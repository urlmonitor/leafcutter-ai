it_requirements:
  - "All three degenerate inputs — missing `components` key, empty list [], and a list containing only an empty string [\"\"] — MUST be rejected identically with the same 'at least one non-empty component name is required' message; no input may pass where another is rejected."
  - "Treat whitespace-only names as empty (strip before the non-empty test), so [\"   \"] fails the same way as [\"\"]."
  - "Implement inside the single required-non-empty-`components`-list predicate from KM-KGS-100e-1 (deployed + templates/scripts/commit_guardian/ source in parity); do NOT add a second divergent validation code path for the empty-name case."
