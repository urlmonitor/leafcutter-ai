notes: |
  DOCUMENTATION AC, produced because ACD-2000b declares
  `documentation_triggers: [reference-doc, state-diagram]`. This is the
  state-diagram half; ACD-2000b-5 is the reference-doc half.

  WHY THIS IS AN L3 AND NOT A SIXTH L2. ACD-2000b's L2 cap is 5
  (`_MAX_L2_PER_L1` in scripts/commit_guardian/check_ac_limits.py, tested as
  `child_count > limit`) and the four behavioural leaves plus the reference doc
  fill it exactly. Placing the diagram as a fine-grained leaf under ACD-2000b-3
  keeps the tree legal AND puts it under the behaviour it depicts -- the reclaim
  path is the only transition in this machine that is not caused by the actor who
  owns the state, and it is the reason the diagram is worth drawing at all. This
  is a tree-position choice, not a downgrade: both triggered documentation types
  are delivered. Craft LEFT UNSET this pass; the intended craft is the
  architecture-diagram surface and the IT PO fills the rest.

  THE FIFTH THEN CLAUSE (the reclaim edge) IS THE POINT OF THE DIAGRAM. Every
  other transition here has an obvious actor: the effort takes, hands back, or
  finishes. Reclaim is performed by a THIRD party on state it does not own, on
  the strength of a judgement about a process it cannot see. That is the
  transition operators will misread, and prose has consistently failed to convey
  it -- ACD-2000b's hazard 1 exists because the current release-only design was
  understood as sufficient.

  THE SIXTH THEN CLAUSE prevents a common modelling error: drawing the losing
  contender of ACD-2000b-2's race as entering a "blocked" or "waiting" state on
  this requirement. It does not -- it goes and finds other work. Modelling it as
  waiting implies a queue that does not exist and invites someone to build one.

  DO NOT CONFLATE WITH ACD-2000a's LIFECYCLE. ACD-2000a-5 covers the adjudication
  machine (attempted / reworked / escalated / resolved). The two machines run on
  the same requirement simultaneously and are independent -- a requirement can be
  taken and mid-escalation at once. Merging them into one diagram would imply
  transitions that do not exist and states that are actually pairs.

  CONSISTENCY OBLIGATION: the states drawn must be the states the claim record
  from ACD-2000b-1 can actually represent and the staleness rule from ACD-2000b-3
  can actually reach. A diagram drawn ahead of those, or not revisited after
  them, is a confident wrong picture -- worse than none.

  2026-08-17 (IT PO enrichment). Craft set to `architecture-diagram-author` per
  the S7b documentation-gate mapping for the `state-diagram` trigger and the BA's
  recorded intent. The L3 placement is deliberate and is left as authored.

  PLACEMENT FIXED at `docs/architecture/components/ac-driven-dev.md`. The BA left
  the home implicit; fixing it here gives ACD-2000b-5 a stable anchor to link,
  and the consistency obligation above means the diagram is the LAST artefact in
  this L1 to be produced, not the first.
