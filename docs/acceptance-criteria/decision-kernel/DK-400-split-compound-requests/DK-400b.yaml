notes: |
  FLOW NODES: split-mid-run (branch). This is the user's "(and other things)":
  the split is not tied to goals.

  SETTLED: one split gate for every subject kind. A mid-run split is recorded
  with found_at mid_run, its work-item depth (1 or more) and no routing
  trigger. found_at routing iff depth 0 iff a trigger is present (mock-data
  invariant).

  CARRY TO L2 / IT PO:
    - Nesting. A part of an approved split may itself hold several questions
      and be split again at a greater depth. Neither the flow nor the mock data
      bounds that depth. Whether nesting is allowed, and how deep, is a PO open
      question; the IT PO owns the bound itself.
    - What tells the kernel, partway through, that a work item holds several
      questions? The flow names the condition but not who judges it. Apply the
      ADR-053 order, as on DK-400a.
    - A research request split this way runs research children only; their
      outcome is "answered" with findings, not a decision record (see DK-400e).

  DOCS: which kinds of request can be split, and where a split can be found,
  belong in the same reference entry as DK-400a.
