notes: |
  THIS L2 IS THE CENSUS AND THE MIGRATION RULE. Each route's own migration is one L3 below, and
  every migration L3 repeats the rule as a criterion (the BO-4500 standing rule requires it at
  every level, not as a note).

  BEHAVIOURAL, NOT GREP (repo CLAUDE.md "Gate / Workflow ACs -- Verify Behaviorally"): the census
  must run each workflow's commit path, or for a workflow the unit layer cannot run, assert the
  shared step's answer is consumed in control flow. A grep for the step's name passes on dead code.

  BUILD-FEATURE is listed in the census though the request named eight sites without it: its
  commit dispatch goes to the commit agent, so it migrates through BO-4500a-5-v rather than a
  workflow edit. Its commitLane chaining (KI-BO-20260901-0920, 2026-10-09 update) stays.

  BO-3200f (open PR #971, readiness draft, no L2s yet) routes ~40 workflow command steps to the
  command-step-runner. The commit sites are owned HERE; BO-3200f's L2s must exclude them so the same
  site is not decomposed twice. Recorded for whoever decomposes BO-3200f.

  KI VERIFICATION AGAINST CODE (L1 notes require it before an L2 claims a KI): the BA does not read
  source. Each KI was read in its register entry; the IT PO must re-verify the cited line ranges
  against current code before a ticket is generated. KI-BO-20260901-0920's own 2026-10-09 update
  already records a code change (build-feature's commitLane).
