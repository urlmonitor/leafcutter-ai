notes: |
  Authored by /quick-fix. Root cause: Every subcommand runs git with cwd=<given path>; for a FILE, subprocess raises NotADirectoryError (OSError), _git_output turns it into None, and the subcommand answers null. Fix: resolve the reference/start/repo arguments to their parent directory when they name an existing file (e.g. a small _anchor_dir helper: p.parent if p.is_file() else p) for base's start, facts' --reference and branch-standing's --repo (NOT for facts' own inspected path); directories and non-existent paths are unchanged. This amends BO-4000f, whose it_requirement (BO-4000f.yaml:71) says the script is not modified; the new AC should be a constraint under BO-4000f (build-orchestration). Tests: unit_tests/workflows/test_bo4000f_repository_reference_anchor.py builds a real temp repo with a linked worktree and only uses an epic-folder anchor; add ticket-.md-file cases for base, facts --reference and branch-standing --repo, run from a non-git cwd..

  WHY BO-4000g AND NOT A CHILD OF BO-4000f. BO-4000f is already L3, the deepest level the
  store has, and the id schema admits no child id under an alpha-suffixed L3 that would
  still be L3 (BO-4000f-i does not match the id pattern). The constraint therefore sits
  as a sibling L3 under the L2 BO-4000 — the same family the other five worktree-step
  constraints (BO-4000a..f) use — and records its relationship to BO-4000f through
  depends_on and expects_from. BO-4000 is L2, so no L0/L1 child cap applies, and no
  child_limit_override was added.

  AMENDMENT TO BO-4000f, STATED PLAINLY. BO-4000f's it_requirement "worktree_repo_facts.py
  itself is not modified" was right for the defect it fixed: the driver was not passing a
  reference at all. It did not anticipate that the reference the driver passes for a
  single ticket is a FILE. This record changes only how the script handles its three
  reference arguments; BO-4000f's own guarantees (every call carries a reference derived
  from the resolved target; the cwd fallback for a non-absolute target; no refusal
  weakened) are unchanged and still hold.

  NAMED MUTATIONS (each must turn at least one test red):
    M1 — leave the script unchanged (the incident). Caught by all three criterion tests.
    M2 — anchor base's start only. Caught by
         test_facts_referenced_by_a_ticket_file_reports_the_same_repository and
         test_branch_standing_anchored_on_a_ticket_file_sees_the_existing_branch.
    M3 — also re-anchor facts' own candidate path. Caught by
         test_facts_on_the_ticket_file_itself_is_still_not_a_checkout.
    M4 — use p.parent unconditionally. Caught by
         test_directory_missing_and_out_of_repo_references_answer_as_before.
    M5 — make the reuse guard or the base guard tolerate null instead of fixing the
         answers. Caught by BO-4000f's
         test_unanchored_answers_abort_the_run_and_anchored_answers_do_not, which requires
         the degenerate answers to STILL abort, together with
         test_file_anchored_answers_let_a_single_ticket_run_reuse_its_worktree here, which
         requires the reuse to come from correct answers.

  The guard's fail-closed posture is not what broke, here or in BO-4000f. The question
  was asked with a reference the mechanism could not use; the refusal to guess at the
  answer was correct.
