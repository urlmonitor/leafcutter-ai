notes: |
  BOTH POLES OF ONE PREDICATE, deliberately in one record. The residual section
  appears exactly when there is residual or unaccounted work, and the cheapest way
  to pass either pole alone is to fail the other: warn always, or warn never. Split
  across two records they can be satisfied by two implementations that contradict
  each other; together they cannot.

  ABSENCE OF EVIDENCE IS NOT SUCCESS. The first two scenarios are the case BO-300d's
  notes make mandatory — the run's own view of what it did is empty or partial — and
  they are the ones a report-wording test cannot reach, because in the failing
  version there is no report to inspect.

  The third scenario is the mandatory control. It is what stops the fix degrading
  into a permanent warning banner, which trains the operator to ignore it and
  returns us to the silence being fixed.
