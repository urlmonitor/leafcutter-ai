     into this record's implementation. The mechanical defence this record ships instead is
     the conformance test in test_spec, which runs in CI on every commit rather than only when
     the diagram is staged."
  - "Whoever later does undertake the drift-coverage extension must reconcile the genre
     vocabulary FIRST: the frontmatter validator's diagram-type vocabulary spells it
     'dataflow' while check_mermaid_drift.py keys on 'data_flow' and 'user_flow'. Harmless
     while sequences are skipped either way; a silent no-op the moment someone adds a
     'sequence' key to the wrong one of the two."
  - "The conformance test is part of THIS record's delivery, not a follow-up. The assigned
     agent's registry produces value is 'documentation', so the produces-trait TDD guardrail
