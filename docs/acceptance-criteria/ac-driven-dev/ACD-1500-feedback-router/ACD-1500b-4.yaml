it_requirements:
  - "Parking in feedback-router.js must be a no-op against the corpus: it must NOT call scripts/feedback/resolve_feedback.py and must NOT set resolved_at on the entry, so /feedback-review (aggregate.py --unresolved) still surfaces it"
  - "Park bookkeeping (the reason, the parked-entry list) must be recorded in run output/logs only, never written back into feedback.jsonl as a resolution"
  - "Must be idempotent: re-running the router re-parks the same entries without accumulating duplicate corpus writes"
