criteria: |
  Given the four flow-change-gate mandatory-agents lists after `documentation-expert` has
    been removed from them,
  When a flow-change ticket is generated,
  Then `architect-review` (and any other pre-coder mandatory agent that was in those lists)
    is still injected and still ordered before the coder.
  And `documentation-expert` no longer appears in any flow-change-gate list, so it is never
    injected twice (once pre-coder and once post-coder) for the same ticket.
depends_on: [BO-2200d-1]
