id: GE-129a-4
title: "A commit specialist definition that differs from the shipped one, or a second definition under the same name, is flagged"
component: guardrail-engine
components:
  - commit_guardian
  - agent_registry
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the commit specialist definition shipped by the package, and five installed projects:
    (a) the installed definition is byte-identical to the shipped one and no other definition
        declares the commit specialist's name,
    (b) the installed definition differs from the shipped one in one line of its instructions, and
        the project records no exemption for its commit specialist,
    (c) the installed definition matches, and a second definition declaring the same name exists
        at user scope,
    (d) the installed definition matches, and a second definition declaring the same name is
        provided by an installed plugin,
    (e) the installed definition matches, and the project holds a second definition file under a
        different file name that declares the same name,
  When the commit specialist parity check runs on each project,
  Then (a) passes with no finding,
    And each of (b) to (e) fails, naming the location and scope of every definition involved,
    And the failure for (b) quotes the first differing line of the installed definition and the
    shipped line it replaced,
    And the failures for (c) to (e) list every location that declares the commit specialist's
    name,
    And adding one more same-named definition to project (e) adds exactly one location to its
    failure.
depends_on:
