notes: |
  Satisfies the sequence-diagram entry in BO-3100c's documentation_triggers.

  The diagram must show results returning to the SAME lifeline that dispatched them. That
  single detail is the whole structural change, and it is the detail the superseded records
  get wrong: ADR-006 and ADR-019 both draw the topology as a depth problem, so a reader
  reasons about how many levels are allowed rather than about who can wait. The clause
  forbidding a specialist as the source of any dispatch is what keeps the drawing from
  reproducing the old shape.

  Sequenced after c-3 so the overlapping lifelines depict concurrency that actually exists.

  The parent L1 notes that BO-3100c may change the correct topology, so any topology diagram
  authored earlier is about to move — this AC is the replacement, and BO-3100d handles
  reconciling the written decisions.

  IT-PO ENRICHMENT NOTE (2026-08-26). The overlap precondition on the coherence test is the one
  addition worth flagging: without it the check is satisfiable by comparing against a drive that
  serialised, and the resulting diagram would then be the authoritative picture of a serial
  queue — quietly reversing BO-3100c-3 through documentation.
