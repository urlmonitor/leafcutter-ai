criteria: |
  Given the requirement collection contains two records claiming the identifier "GE-119": a
    goal-level record owning a folder of 33 files, and a single parentless detail-level record at
    the namespace root whose subject is the contract-shrinking guard,
  And nine test functions carry a coverage tag naming "GE-119", all of them written for the
    parentless record,
  And a guard source file and two release notes cite "GE-119" — one release note meaning the
    parentless record, the other meaning the goal record,
  When the repair is complete,
  Then exactly one record in the collection claims "GE-119", and it is the goal record,
  And every one of the 33 files in that goal record's folder is unchanged,
  And the parentless record claims an identifier in the same namespace that no other artifact
    claims, and that was not previously claimed by any retired artifact,
  And it declares a parent that exists, and that parent lists it among its children,
  And all nine coverage tags name the identifier the moved record now claims, so each tag
    resolves to exactly one record,
  And the guard source citation names the moved record's new identifier,
  And each remaining citation of "GE-119" in a dated historical record either genuinely refers to
    the goal record, or states the identifier the moved record now carries, so no reader is left
    holding a citation that resolves to the wrong work,
  And no citation of either identifier anywhere in the repository resolves to zero records or to
    more than one.

  Coverage note: covered by executing the whole-collection uniqueness pass and a repository-wide
  citation resolution over the repaired tree, asserting one claimant for the old identifier, one
  for the new, and no unresolved or multiply-resolved citation of either. Asserting only that the
  file was renamed does not cover it — the references are where a renumbering does its damage.
