notes: |
  New behavioral requirement derived from the user-authorized entity-context concept.
  BA behavior and IT PO technical contracts are reviewed; implementation is verified by the independent strict entity suite and recognition corpus.
  Verification evidence: reports/entity-context-verification.md. No human approval is implied.
  Historical DK-200 direct-gather tests and evaluation reports are preserved.
  Fresh-run wiring criteria were explicitly reconciled to EntityContext on 2026-10-04.
estimated_complexity: L
it_requirements:
  - "Canonical config and native readers own vocabulary membership, declared aliases and authored definitions; local caches must not invent aliases or copy complete owner records."
  - "Document genres use config/doc_types.json; destination kinds use config/entry_kind_vocabulary.json. Destination purpose must be owner-authored descriptive metadata rather than a bare destination path. Package-owned native-kind role descriptions remain separate."
  - "Returned meaning text and signatures are bounded by entity_context.max_meaning_chars (default 300), and card bodies remain meaning-only. Canonical identities are never shortened into a different identity; omit an oversized card with an explicit limitation if it cannot fit the shared projection budget."
test_required: true
test_spec:
  - name: "test_owner_meanings_and_namespaces_are_source_driven"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_owner_projection.py::test_owner_meanings_and_namespaces_are_source_driven: Build a real index from glossary, doc-type, entry-kind and native-kind sources; assert canonical identities, distinct families and authored meanings."
  - name: "test_declared_aliases_resolve_without_record_bodies"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_owner_projection.py::test_declared_aliases_resolve_without_record_bodies: Resolve declared how-to/owner aliases to canonical identities and assert serialized cards omit document/routing/artifact body sentinels."
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
