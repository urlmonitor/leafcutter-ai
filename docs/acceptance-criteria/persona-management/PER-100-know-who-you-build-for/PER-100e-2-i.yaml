id: PER-100e-2-i
title: "Persona refinement does not remove existing entries without explicit user confirmation"
component: persona-management
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given an existing persona at docs/personas/field-service-engineer/persona.yaml with:
    - goals: ["Minimize equipment downtime", "Complete repairs on first visit", "Maintain accurate service logs"]
  When the persona expert agent is invoked with: "Replace the goals with just 'Fix things quickly'"
  Then the agent does NOT immediately overwrite the goals list
  And the agent presents the proposed change to the user:
    - "This would remove 3 existing goals and replace them with 1. Confirm? (yes/no)"
  And only writes the change if the user confirms with "yes"
  And if the user declines, the original goals list is preserved unchanged
