id: BP-300e-4
components:
  - build_pipeline
title: "A reply with no recoverable structured result stops the run with a clear error naming the stage and agent"
component: build-pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: high
work_status: todo
criteria: |
  Given a workflow run dispatches a helper agent to return a structured result,
  And that agent's reply contains no recoverable structured result at all
    (prose only, with no valid JSON object or array anywhere in it),
  When the workflow reads the agent's reply,
  Then the run stops with a clear, typed error that names the stage and the agent
    whose reply could not be understood,
  And the failure is neither silently skipped nor swallowed — the user is told a real
    problem occurred rather than the run appearing to succeed with missing output.
depends_on:
  - BP-300e
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Edit only the canonical source templates/workflows-js/*.js; rebuild via build.py so the deployed .claude/workflows/*.js copy stays byte-identical (BP-100k drift guard) — never hand-edit the deployed copy."
  - "On no recoverable value, throw a typed error carrying the stage and agent identity supplied by the caller; never return null/undefined and never let the reply be silently skipped or swallowed."
  - "Every call site must thread its stage/agent label into the reader so the error can name them — the current bare `typeof x === 'string' ? JSON.parse(x) : x` sites pass no such context, so the coder must add it at each site."
  - "The typed error must supersede finalize-feature.js's current {value:null, malformed:true} return convention so the halt is a raised typed error, not a soft sentinel a caller could ignore."
  - "Behavior must be verified by a runtime behavioral test through the vm.Script replay harness (assert a typed error is raised, not a generic crash or a silent None/skip), not a source string-scan."
delivers_to: null
expects_from:
  ac_id: BP-300e-1
  contract: >-
    Inline tolerant reader parseAgentJson(raw, {stage, agent}) whose failure path throws
    a typed error naming the stage and agent when no balanced top-level value parses.
