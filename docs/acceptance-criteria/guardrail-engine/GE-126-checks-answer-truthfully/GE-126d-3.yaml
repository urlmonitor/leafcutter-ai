id: GE-126d-3
title: "The legs of registration are one list that the procedure and the parity check both read"
component: guardrail-engine
components:
  - commit_guardian
  - skills_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the places a check must be registered are declared once as data,
  When a further leg is added to that declaration and nothing else in the repository is
    edited,
  Then the documented procedure an author follows presents the new leg as a step without
    its text having been edited,
  And the registration parity check reports a fixture check that has omitted the new leg
    without its logic having been edited,
  And the sentence the parity check prints about a missing leg and the sentence the
    procedure shows the author for that same leg are produced from one wording so the
    author recognises the report as being about the step they skipped,
  And removing a leg from the declaration stops both surfaces mentioning it in the same
    way,
  And a fixture check registered on every leg the declaration names is reported by the
    parity check as complete so the declaration is what completeness is measured against
    rather than a number written into either surface.

  Coverage note: covered by adding a leg to the declaration in a fixture tree and asserting
  both surfaces change with no other edit, and by asserting the two wordings are the same
  string rather than two similar strings. A test that counts the legs mentioned in the
  procedure document does not cover this criterion — a hardcoded count in a test is the
  second copy of the list this criterion exists to prevent.
depends_on:
