title: "A goal is the unit of delivery that supervisors walk"
component: ticket-creation
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  The goal (L0) and its children replace the epic folder as the dispatch boundary.

  When a supervisor begins a batch of work, it walks the children of an L0 AC
  in dependency order. The L0 is "done" when all its leaf-level children have
  signed off. No separate epic folder or ticket grouping mechanism is needed —
  the AC hierarchy itself is the work breakdown structure.
