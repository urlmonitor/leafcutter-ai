    framework: unittest
    type: behavioral
    angle: failure
    description: "Run from a non-checkout directory against a real linked worktree, the unreferenced facts call answers same_repository null while every other field is correct — the degenerate answer that made the reuse guard fall through."
  - name: test_base_without_a_reference_resolves_nothing_outside_a_checkout
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "From the same directory the unreferenced base call answers all-null — the second degenerate answer, the one the incident aborted on."
  - name: test_facts_anchored_on_the_target_reports_the_same_repository
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "With a reference derived from the target, the same call from the same non-checkout directory answers same_repository true, so the whole reuse predicate holds."
  - name: test_base_anchored_on_the_target_resolves_the_worktree_base
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "With the same reference, base resolves the real main checkout and worktree base from outside any checkout."
  - name: test_unanchored_answers_abort_the_run_and_anchored_answers_do_not
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: real_artifact
    surface_invoked: templates/workflows-js/build-feature.js
    description: "The two real script answers, fed to build-feature.js's own top-level body, reproduce the incident and its absence: the cwd-defaulted pair aborts worktree-base-unavailable with zero phase agents, the anchored pair reuses the worktree and the run goes on."
  - name: test_every_worktree_repo_facts_invocation_in_the_driver_is_anchored
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: templates/workflows-js/build-feature.js
    description: "Every invocation is parsed out of the driver and must carry an interpolated reference, so a newly added unanchored call site fails immediately rather than waiting for a drive to abort."
test_rationale: |
  The mechanism was already correct and already had the parameters needed; the step simply
  never passed them. So a test of worktree_repo_facts.py alone would stay green through the
  entire incident, and a test of the step alone — with the facts calls stubbed, as every
  other BO-4000 test stubs them — would stay green too, because stubs answer from the
  fixture rather than from a directory. The defect lived precisely in the seam the existing
  tests mock away.

  This record therefore runs the real script as a subprocess against a real temporary
  repository with a real linked worktree, from a directory that is genuinely not a
  checkout, and then feeds those real answers into the real driver body through the
  workflow harness. That the degenerate answers abort and the referenced answers do not is
  the whole claim, and it is observed rather than asserted about.

  The driver-parsing case is deliberately paired with it. The executable half proves what
  happens for a given pair of answers; it cannot prove the driver asks in the way that
  produces the good pair. Parsing the invocations out of the driver closes that loop, and
  deriving them rather than counting them means a fifth call site added later is checked
  the moment it appears instead of silently inheriting the defect.
