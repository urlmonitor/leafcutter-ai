    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The same check, same cannot-run condition, disposition announce: the outcome is reported unmissably and the commit proceeds — a different commit result from the block run."
  - name: test_ge119a2_observed_checks_carry_a_stated_reason
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "check-ac-parent-covered-by and check-ac-schema each carry a recorded disposition with a non-empty stated reason."
test_rationale: "A presence assertion over the manifest passes on a field that nothing reads — the exact shape of dead configuration this tree exists to catch. The determining clause is only covered by executing the same check under both dispositions and observing two different commit results, which requires the out-of-process harness because the cannot-run condition itself must be genuine rather than simulated in-process."
