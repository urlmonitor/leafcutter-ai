test_spec:
  - name: test_the_learning_survives_removal_of_the_working_directory_the_work_ran_in
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "The whole AC in one test. Drive a completion path to completion inside an isolated working directory whose declared sink holds one record naming a tracked destination; publish and merge as that path does; remove the working directory; then read the destination IN THE MERGED TREE and assert it holds the learning text. The assertion is made after the removal and against a different directory from the one the routing step wrote in — a test that reads the destination before teardown passes on the defect this AC exists to close."
  - name: test_a_unit_of_work_produces_the_same_number_of_commits_with_and_without_records_to_route
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Drive the same completion path twice, once with an empty declared sink and once with three routable records, and assert the branch's commit count is equal between the two runs while the destination contents differ. This is the no-new-commit clause as a number: an implementation that appends a commit of its own goes red here even though the durability test above is green."
  - name: test_a_write_that_is_never_published_is_reported_unwritten_and_rerouted_later
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "Drive a completion path whose publication step does not happen (the path is stopped between the routing write and the commit that would carry it). Assert the reported result counts the record as unwritten, that the record is still eligible afterwards, and that a second completed unit of work over the same sink puts the learning in the merged tree exactly once. Proves 'written' means published, not written-somewhere."
  - name: test_a_record_routed_on_a_branch_that_never_merges_is_routed_again_by_a_later_run
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "The bookkeeping clause, and the loss mode a repository-scoped sink introduces. Drive a completion path to publication on a branch with one routable record; discard that branch without merging it; then drive a second unit of work in the same repository and assert the learning reaches the merged tree, and reaches it exactly once. A run whose routed-already bookkeeping lives beside the sink rather than beside the write suppresses the second run and goes red here while passing every other descriptor on this AC — the write really did happen, on a branch nobody kept."
  - name: test_the_destination_is_absent_from_the_merged_tree_when_the_routing_write_is_not_carried
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "The must-fail negative control for the criterion's last clause. Wire a completion path that writes the destinations into the working directory and does not carry them into the publication; assert the test suite reports failure — the learning is present before teardown and absent after. Without this control, the durability test can be satisfied by a fixture that never tears anything down."
test_rationale: |
  Every descriptor asserts across the teardown boundary, because that boundary
  is the criterion. A test that drives a completion path and then reads the
  destination in the same directory the path ran in passes on precisely the
  implementation this AC rejects, and would have passed on INF-700a-1 as
  written — the destination files really do contain the text, for as long as
  the directory exists. The commit-count descriptor exists because the
  durability outcome has two candidate implementations that are
  indistinguishable by the artefact alone: riding the path's own commit, and
  adding an unattended commit inside the routing step. The criteria require the
  first and forbid the second, so something has to count commits. The last
  descriptor is the negative control: without a wiring in which the write is
  deliberately not carried, a green suite proves the fixture tore nothing down
  rather than that the implementation is durable.
notes: |
  WHY THIS AC EXISTS. INF-700a-1 settled WHEN the routing step runs and said
  nothing about WHERE its writes end up. Four of the five completion paths run
  in an isolated working directory, and finalize-feature removes its own at
  step 7 after merging the pull request at step 4. A routing step that writes
  memory files and documentation pages into that directory at the driver's
  completion step satisfies INF-700a-1's "those three destination files each
  contain the learning text" for as long as the directory exists, and its tests
  pass. Production loses every learning. That is the phantom-done shape the
  whole INF-700 family exists to eliminate, reappearing inside it, and it is
  why the durability obligation is stated as an outcome here rather than left
  to an implementation note.

  THE DECISION, AND THE THREE OPTIONS IT REJECTS. The criteria require the
  routing step's writes to be published by the commit the completion path
  already makes for its own output. The alternatives were weighed and are
  rejected for stated reasons, so nobody re-opens them on a hunch:

  1. A NEW COMMIT INSIDE THE ROUTING STEP is rejected, and this is the loudest
     line in this record. This repository requires commits to go through the
     commit agent, and enforce_commit_delegation blocks a direct git commit
     that does not originate there. A workflow that silently commits curated,
     tracked files during a teardown sequence is a change in blast radius, not
     a wiring detail. The precedent is not encouraging: finalize-feature's
     step 3.5 already makes an unattended closure commit, and it has previously
     flipped acceptance criteria across the entire store rather than the epic
     in front of it. If the IT PO concludes that no completion path has a
     commit that can carry the routing writes, then a new unattended commit is
     the only remaining answer — and it must be raised for review in its own
     right, not written into an it_requirements line under this AC.
  2. WRITING THE DESTINATIONS TO THE MAIN CHECKOUT INSTEAD OF THE WORKING
     DIRECTORY is rejected. It leaves the shared tree dirty with tracked-file
     modifications nobody staged, which blocks the fast-forward that
     finalization depends on, and it is an isolated drive reaching outside its
     own directory — the thing isolation exists to prevent. It also does not
     make the learning durable; it moves the uncommitted write to a place where
     a later reset destroys it instead of a teardown. THIS REJECTION SURVIVES
     THE 2026-09-07 SINK DECISION AND IS NOT WEAKENED BY IT. That decision fixes
     the SINK at an install-wide location; it does not move the DESTINATIONS.
     The sink is untracked runtime data with one copy per install, and
     writing to it from an isolated directory is fine. The destinations are
     tracked files whose whole value is that they are reviewed and merged, and
     writing to them outside the branch doing the work is exactly as wrong
     today as it was before. Anyone who reads "the sink is shared now" as
     licence to write memory files into the main checkout has read the decision
     backwards.
  3. RUNNING THE ROUTING STEP AFTER THE MERGE, ON MAIN, is rejected on
     coverage. Only finalize-feature merges. The fast lane, quick-fix,
     single-ticket and epic drives complete without it, so this wires one path
     of five and reproduces the partial-wiring failure INF-700a-1-i exists to
     catch. It also has problem 2's dirty-main consequence.
  4. DURABLE EMISSION WITH DEFERRED ROUTING — REOPENED AND RE-DECIDED
     2026-09-07, ON A NEW FOOTING. The original rejection rested on a fact that
     is being fixed: the sink did not outlive the working directory, so
     deferring the routing discarded the record rather than delaying it. Under
     the settled decision the sink is an absolute path fixed when the package is
     built into the project, and one copy is shared by every working directory
     of that install, so deferral now genuinely defers. The old reason is void
     and is not reused.

     RE-DECIDED ON THE MERITS, and the answer is the same with a different
     shape: deferral is ADOPTED FOR THE RESIDUAL and REJECTED AS THE WHOLE
     MECHANISM. As the whole mechanism it means no unit of work ever routes its
     own learnings; every learning lands one completed unit of work late, and
     the last unit of work in any repository — the end of a project, the end of
     a week, the change a person makes and then stops — never has a successor
     to route it, so its learnings sit in the sink indefinitely with nothing
     wrong showing anywhere. That tail is unbounded and invisible, and this
     family exists to close exactly that shape. Nor does deferral buy anything
     on durability: whenever the routing does run, it still runs inside some
     unit of work's working directory and its writes still have to ride that
     unit's publication, which is this AC's requirement either way. What it
     buys is only that nobody has to order the routing step ahead of the
     publishing phases — and INF-700a-1 has now made that ordering, so the
     purchase is unnecessary.

     WHERE IT IS ADOPTED: the records emitted after this unit of work's routing
     step has read the sink — the publishing phases emit too — are deferred to
     the next completed unit of work rather than lost, and that is now a true
     statement rather than a hopeful one. INF-700a-5-ii owns what a run says
     about them and, since 2026-09-07, states them as delayed rather than gone.

     WHAT WOULD REOPEN IT AS THE WHOLE MECHANISM: evidence that no completion
     path can order its routing step before its publishing phases. That is an
     ordering question, and if the answer turns out to be no, deferral plus a
     named owner for the tail is the fallback to argue for — not an unattended
     commit, which stays rejected under point 1.

  5. A DATABASE, INSTALLED OR EMBEDDED, AND AN API THAT COMMITS LEARNINGS TO
     THE DEFAULT BRANCH ON EMISSION were both weighed and rejected in the
     2026-09-07 decision, at the sink layer rather than here. Their reasons are
     recorded on INF-400c-4 and are not restated: portability and reviewability
     for the first, branch protection and the value of review for the second.
     They are named here only so a reader of this list does not conclude the
     durability question was settled without considering them.

  WHAT THIS AC DOES NOT DECIDE. It does not decide at which line of which
  workflow the routing step is invoked. It requires only that, wherever it is
  invoked, the writes are carried by the path's own publication. Whether that
  is achievable at the driver's completion step as INF-700a-1 words it, or
  requires the invocation to sit earlier in the path, is an ordering question
  for the IT PO — and if it turns out to require moving the invocation, that is
  a refinement of INF-700a-1's trigger point and belongs back with the BA and
  the PO rather than being absorbed silently.
