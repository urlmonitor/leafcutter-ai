id: GE-126a-5
title: "The target contract a check owes its caller is written down once"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a person or an agent deciding what a check is obliged to do with the targets it
    is handed,
  When they consult the reference material for this check family,
  Then it states the contract in one place: a target named by any honoured route is
    examined a target named and not resolved is reported and never passed and a scope
    that names no target at all is an ordinary pass,
  And it names the routes through which a target may be named for the check that
    carries this contract today rather than describing the routes in general terms,
  And the reference records that this contract governs the interrogation surface and
    does not by itself decide whether a commit is blocked,
  And any statement elsewhere in the reference material that a check may pass on an
    argument it did not read is removed rather than qualified,
  And the reference names the recorded observation that motivated the contract together
    with its date so a later reader can tell a rule from an opinion.

  Coverage note: covered by a test that reads the contract's three clauses from the
  reference and asserts the deployed check's observed behaviour on each of the three
  cases matches the clause. A test that asserts only that the reference contains the
  words does not cover this criterion.
depends_on:
  - GE-126a
  - GE-126a-1
  - GE-126a-2
  - GE-126a-3
