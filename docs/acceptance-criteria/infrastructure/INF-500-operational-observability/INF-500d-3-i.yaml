notes: |
  SOURCE. KI-FC-002 half (1). The recovery file is named after whole epoch seconds,
  so two submissions in the same second share a name and the later one overwrites
  the earlier. Observed 2026-08-25: entries 869bc2f7 and 9057159a share timestamp
  18:52:29Z, and only one recovery file exists for that second.

  FIX DIRECTION (from the KI, not binding on the implementer): add the process id
  and a random suffix to the name. The criteria require uniqueness per submission
  and do not prescribe a scheme.

  CONTRACT TENSION WITH INF-500d-4-ii / INF-500d-4-vi. Both pin the recovery search
  'sidecar:[^ ]*feedback_id_[0-9]*.txt', and their tests apply that exact pattern.
  A name such as feedback_id_<epoch>_<pid>_<hex>.txt does NOT match it: the run of
  digits stops at the first underscore, and the single-character '.' wildcard is
  followed by a literal 'txt' that is not there. Two ways to resolve this; the IT PO
  chooses:
    (a) keep the name all-digits (e.g. epoch, pid and a random number concatenated
        as digits), so the existing pattern, the existing callers and both earlier
        ACs keep working unchanged; or
    (b) change the name freely and update the recovery search in every caller
        (signoff skill, live-surface-tester) plus INF-500d-4-ii's and -4-vi's tests
        in the same delivery.
  The third criteria scenario holds under either option. It is the guard against
  shipping a unique name that the documented recovery step can no longer find.
  The BA did not edit INF-500d-4-ii or -4-vi.

  Out of scope: removing recovery files after use. Unique names mean the files
  accumulate in the temporary directory. That is a separate concern and is not
  required for correctness.
