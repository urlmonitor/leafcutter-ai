id: ACS-300h-3
title: "Ordering in agent_affinity conveys implementor priority"
component: ac-store
level: L2
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given a component entry has agent_affinity: ["python-coder", "frontend-coder"],
  When the IT PO reads the entry to assign an agent to a ticket,
  Then the first element ("python-coder") is treated as the primary implementor,
  And subsequent elements are secondary or fallback choices.
  And the components.json schema documentation (or a companion doc)
    explicitly states that array order represents priority --
    first element is the preferred agent, subsequent elements are
    used when the primary is unavailable or the ticket spans multiple
    implementation domains.
