id: GE-130c-3
title: The hooks reference explains what is refused beforehand, what is caught afterwards, and what a
  stop afterwards does not do
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the hooks reference,
  When a reader looks up how a file protection treats a shell command,
  Then it states that a command clearly writing a protected file is refused before it runs, and
    that a command whose effect cannot be told beforehand runs and is examined afterwards,
  And for the documentation guard and the guide-read guard it states the three outcomes of that
    examination, each with what the reader sees:
    (attributed) a change to a protected file positively attributed to this caller's command stops
    the run, naming the changed file, which is left changed, and stating what the caller must do
    to continue;
    (could not examine) when the files could not be examined at all, the protection states that it
    could not tell what the command changed and stops the run;
    (could not attribute) a changed protected file the examination cannot attribute is named with
    the protection and the reason whose change it was could not be told, no caller is named as
    having made it, the file is left changed and a caller whose change it was must put it back or
    make the change in a way the rule allows, the finding is recorded, still readable after the
    session ends, and listed in the report the drive ends with, and the run continues,
  And it states that a caller is never stopped for a change that is not positively attributed to it,
    except when the files could not be examined at all,
  And it states that the task-lock guard is outside these three outcomes and its lock semantics are
    unchanged: under the build lock it refuses a writing command whoever's change it was, unless the
    caller is one of the build workflow's own dispatched agents as identified by the caller identity
    the harness supplies.
