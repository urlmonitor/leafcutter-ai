id: GE-118g
title: "The decision-numbering tools act on the repository they belong to, not on whichever directory they were started in"
component: guardrail-engine
components:
  - commit_guardian
  - doc_compliance
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  A tool that exists to answer a question about this repository answers it about
  this repository, from anywhere you can start it.

  Today the two tools the project's own numbering procedure tells an author to
  run both take their subject from the directory the process happened to start
  in. One of them cannot read the repository's staged changes at all from there
  and says so; the other silently takes a different tree as its subject and
  reports an answer about that. Either way the published procedure cannot be
  followed from where work actually starts, so the number an author ends up
  with is chosen by hand instead — which is the situation the procedure was
  written to end.

  After this, the directory a numbering tool is started from stops being an
  input to its answer. Where the repository cannot be established at all, the
  tool says which situation it is in rather than producing an answer computed
  from somewhere else.
