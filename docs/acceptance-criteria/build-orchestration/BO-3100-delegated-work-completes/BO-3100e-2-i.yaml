  - supervisor_system
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a step whose declaration names a result the build has no means of looking
    for,
  When the step ends and its completion is judged,
  Then the step is not counted as done,
    And the build reports that the step's declared result could not be looked for,
      naming the step and the result,
    And the run's overall verdict reflects that a step was left undecided.

  Given a step whose declared result the build can normally look for, but the
    attempt to look fails,
  When the step's completion is judged,
  Then the step is not counted as done,
    And the failure to look is reported as a failure to look, not as the result
      being absent and not as the result being present,
  So the three outcomes — found, not found, could not look — stay distinct.

  Given a step whose declared result was looked for successfully and found,
  When the step's completion is judged,
  Then it is counted as done and nothing is reported as undecided,
  So the undecided outcome is reserved for cases where the build genuinely could
    not tell.
