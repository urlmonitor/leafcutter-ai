criteria: |
  Given the twelve Modern-smell entries across the structural and design buckets,
  When each smell entry is inspected,
  Then every entry names at least one specific Martin Fowler refactoring move
    that removes that smell (e.g. Long Function names Extract Function),
  And no smell entry is left without a named refactoring,
  So that each finding drawn from the catalogue carries a concrete fix, not just
    a problem.
