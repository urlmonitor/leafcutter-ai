    - "The back-reference write must be idempotent: running the generator twice against the same AC leaves the implemented_by list unchanged in length and content (run-twice byte-stable)."
    - "Preserve the existing minimal-diff targeted rewrite of only the implemented_by block; do not full-dump the AC YAML."
