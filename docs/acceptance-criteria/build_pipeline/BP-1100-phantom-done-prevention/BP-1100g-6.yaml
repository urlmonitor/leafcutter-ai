test_required: false
test_rationale: |
  Genuinely test-free: change_target is docs and the AC's entire observable is the prose
  content of one reference page. There is no executable behaviour to assert. The
  mechanical properties nearby are covered elsewhere and must not be re-tested here by
  proxy — frontmatter validity by the check-doc-frontmatter hook, the enforcement
  separation by BP-1100g-3-i, and the accepted-paste invariance by BP-1100g-4-i. A test
  that greps this page for the phrase "promised and claimed" would assert prose presence,
  not correctness, which is exactly the Neverfail Test smell this tree exists to avoid.
