id: TQ-500g-3-iii
components:
  - testing_quality
  - build_orchestration
title: "An existing test the work changed that now asserts less, compares more loosely, or tolerates more stops the work, even when listed as strengthened"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: in_progress
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given seven tests in test_retry.py that existed before the work began, each
    still present and passing after the work, and the work's sweep list
    naming all seven as strengthened —
      F: test_backoff_caps_at_five had three assertions
           assert delay == 5, assert attempts == 3, assert log.called
         and after the work has two (assert log.called is gone),
      G: test_first_delay asserted delay == 1 and now asserts delay >= 1,
      H: test_no_result asserted result is None and now asserts
           result in (None, ""),
      K: test_ok_status asserted response.status == 200 and now asserts
           response.status,
      I: test_jitter_bounds compared jitter == pytest.approx(0.5, rel=0.01)
         and now compares jitter == pytest.approx(0.5, rel=0.1),
      L: test_rejects_negative_delay checked with pytest.raises(ValueError)
         that compute_delay(-1) is refused, and the pytest.raises block is
         gone, leaving a plain call,
      J: test_retry_header asserted header == "Retry-After: 5" and now also
         asserts "5" in header, keeping the first assertion,
  When the work's tests are checked before commit,
  Then the work stops, naming each weakened test as <file>::<test> with its
      reason:
        test_retry.py::test_backoff_caps_at_five  fewer assertions (3 to 2),
        test_retry.py::test_first_delay           comparison loosened
                                                  (== became >=),
        test_retry.py::test_no_result             comparison loosened
                                                  (is became in),
        test_retry.py::test_ok_status             comparison loosened
                                                  (== removed),
        test_retry.py::test_jitter_bounds         tolerance widened
                                                  (rel 0.01 to 0.1),
        test_retry.py::test_rejects_negative_delay fewer assertions (1 to 0),
    And J is not reported,
    And the sweep list marking F, G, H, K, I and L as strengthened does not
      prevent the stop,
    And the same changes in a test that the sweep list does not name are
      reported the same way, alongside the unlisted edit,
    And the decision is taken from the code of each test before and after the
      work, without running the tests and without a language model, so the
      same work gives the same result every time.
