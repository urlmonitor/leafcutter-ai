notes: |
  "DATABASE TESTS INCLUDED" (TQ-500g's criteria) and the "to run later" pick-up
  from the PO's plan item g-2.

  USER DECISION AT THE BA GATE (Q2, 2026-09-28): the database test writer's
  own extra wrong versions ("to run later") are RUN and each outcome is
  REPORTED, but a survivor among them does NOT stop the work. Whether it should
  is the deferred Phase C question ("wrong versions proposed by the agent
  itself"), recorded in TQ-500g's notes. They are run because the writer's
  report (TQ-500f-4, -4-i) says the test catches them, and running them checks
  that. The survivor reports are the evidence Phase C is waiting for. The
  Then clause on survivors pins this: a control named by the requirement still
  stops the work, so a rule that stops on nothing, or on everything, fails.

  P2 AND P3 KEEP THE RUNS HONEST WITHOUT A DATABASE. Both leave the work
  unfinished, following TQ-500b (a run owed and not taken is incomplete). If the
  user wants database-free projects to proceed, that is a change to this AC, not
  a silent skip.

  PLACEHOLDER ADDRESSES ONLY in fixtures and docs:
  postgresql://<user>:<password>@<host>:<port>/<database> (INF-1100d-4).
