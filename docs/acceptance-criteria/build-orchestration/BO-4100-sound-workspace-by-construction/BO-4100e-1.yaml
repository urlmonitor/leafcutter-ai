id: BO-4100e-1
title: "A workspace with no registration entry is still shown in the list"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given a directory sitting where workspaces are created, carrying a workspace's
    own identifying state, for which the registration record holds no entry,
  When the set of workspaces is listed,
  Then that directory appears in the listing,
  And it is marked in the listing as having no registration entry, distinguishing
    it from the registered workspaces alongside it,
  And the listing reaches it by inspecting the location workspaces occupy, so it
    is found even though nothing in the registration record refers to it.
depends_on: [BO-4100e]
