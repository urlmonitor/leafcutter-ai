notes: |
  WHY THIS IS AN L3 UNDER GE-122d-6 AND NOT A RESTATEMENT OF GE-122d-2 OR GE-122d-3. Three ACs
  in this tree ask for inspected counts, at three different points, for three different reasons,
  and collapsing them would lose one of the three:
    - GE-122d-2 asks for per-namespace counts on the SHARED-BUILD passing path, so a gate that
      passed over an empty checkout is distinguishable from one that passed over the collection.
    - GE-122d-3 asks for a read count on the DEGRADED path, so the size of a blind spot is
      visible when the pass could not read everything.
    - This AC asks for them on the COMMIT-TIME passing path, and pairs that with a run in which
      the check is deregistered, so that "the guard ran and found nothing" and "the guard was
      never reached" are two different observations rather than one silence.
  The third is the only one that fails on the repository as it stands today.

  THE DEREGISTERED RUN IS THE LOAD-BEARING CLAUSE. Without it this AC is satisfiable by a check
  that prints counts and is wired to nothing, which is the exact state four guards in this
  component are in. With it, the AC is a statement about what the COMMIT produces, not about
  what the script produces, and no assertion over a script's return value can satisfy it.

  THE HONEST LIMIT OF THIS CRITERION, worth stating so nobody over-claims it: a reader still has
  to look. This makes the two situations distinguishable; it does not make anyone notice. What
  makes it mechanical is GE-120c-6, which sweeps for guards that ship unregistered, and this
  criterion is what gives that sweep something observable to check a live commit against.

  IT-PO (2026-08-25) — THE COUNT AND THE NAMESPACE LIST FAIL THE SAME WAY. The criteria already
  forbid a fixed count. They do not forbid a fixed LIST of namespaces to report counts for, and
  that is the identical defect one level up: a fifth namespace added to ADR-034's responsibility
  set would get no line, and its absence would look exactly like the four-line output everyone
  is used to. The added it_requirement derives the reported set from the same declaration the
  pass resolves its roots from, which is also what keeps this AC consistent with GE-122d-3-ii's
  requirement that no root be resolved from a location written into the pass.
