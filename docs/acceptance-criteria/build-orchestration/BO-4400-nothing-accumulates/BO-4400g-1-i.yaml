criteria: |
  Given the epic "Files Stay Workable" has one workspace, made when it was requested by its
    older spelling "EPIC-FilesStayWorkable", holding nothing unsent,
  And the epic "Files Stay Workable Two" has its own workspace, holding nothing unsent,
  When clearing is requested by the older spelling "EPIC-FilesStayWorkable",
  Then the one workspace of "Files Stay Workable" is answered cleared and no folder of it
    remains,
  And the workspace of "Files Stay Workable Two" is identical before and after,
  And a lookup of the epic by its current kind and short name then answers that no
    workspace exists for it.

  Given that workspace has already been cleared,
  When clearing is requested again, once by the older spelling and once by the current
    kind and short name,
  Then each request is answered with a definite statement that no workspace exists for
    that work, not with a failure,
  And every remaining workspace of the project is identical before and after.
