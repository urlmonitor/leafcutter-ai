title: "On /build-epic the supervisor reads each wrong-version step's answer through relayed log and exit lines, asks the list for the ticket's own pins, and sends test-breaker only the names that need preparing"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given an epic driven through /build-epic whose ticket 07_TICKET-refresh-gate
    (ticket_key "07_TICKET-refresh-gate" in the dispatch input, source_ac
    ["TQ-9101"], run alone in its chunk) reaches the step before commit,
    and test T1's entry owes N1 "drop the retry_due condition" and N2
    "the gate always allows",
    and the supervisor's shell tool relays each command's stdout and stderr
    merged, so the list step's output arrives as one of:
      E1: the writer's log line "base ref HEAD: 0 names declared, 2 derived",
          then the one-line answer
          '{"owed": [N1, N2], "to_prepare": [N2], "decisions": [...], "error": null}',
          then a line "exit: 0",
      E2: the same three lines, with "to_prepare": [] (both names pinned),
      E3: no JSON object answer: a prose refusal with no JSON line, or two
          different lines that are each a JSON object,
      E4: an answer with owed [N1, N2] and error null but no to_prepare, or a
          to_prepare that is not a list,
  When the supervisor runs the wrong-version sequence for that ticket,
  Then the list command it runs carries --work-key "07_TICKET-refresh-gate",
      the ticket_key build-epic.js passed, never a key the supervisor makes
      up, and finish is given that same key,
    And in E1 the supervisor reads the answer line and spawns test-breaker
      exactly once, with wrong_versions equal to the to_prepare list [N2]
      exactly (same item, spelling, files and scope), never with N1 and never
      with the owed list, and hands test-breaker's reply to finish unchanged,
    And in E2 the supervisor spawns no test-breaker at all and runs finish
      with an empty reply,
    And in E1 and E2 the log line and the "exit: 0" line are never read as
      part of the answer and never cause a halt,
    And in E3 and E4 no answer is read: no test-breaker is spawned, finish
      does not run, no commit follows, and the ticket is reported blocked
      with the list step named; a missing or non-list to_prepare is never
      read as "nothing to prepare",
    And finish's output is read by the same rule: a log line before
      '{"gate_passed": true, ...}' and "exit: 0" after it still leads to the
      commit, and a finish output with no JSON object answer never does.
