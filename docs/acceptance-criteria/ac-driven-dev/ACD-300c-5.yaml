      final commit subject becomes plan-feature(TEST-DESIGN, final)."
  - path: docs/reference/plan-feature-workflow-rationale.md
    relationship: related
    status: exists
    relevance: Where moved rationale comments go if lines must be freed to keep the body from growing.
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- Only the final-gate heading, the final-gate cancel message and the final commit-failure stage name change;
  the other gates' messages stay byte-identical.
- Any test that asserts the old text changes in the same commit.
- 'templates/workflows-js/plan-feature.js is over its size limit and its measured length must not grow
  (GE-127b-1 growth ratchet): lines added are paid for by lines removed or by rationale comments moved
  to docs/reference/plan-feature-workflow-rationale*.md. Build after GE-134a-1 so decision-history lines
  are free.'
- Canonical sources only; deployed and installed copies are regenerated by the build and never hand-edited
  (ADR-001).
- The second-edit abort fix goes into the final-gate branch of plan-feature.js only (its message and its
  max-retries label); the shared automatic-gate abort branch stays driven by the stage's agent, so the
  product owner, business analyst and technical planner stages keep their current abort text unchanged.
declared_files:
- path: templates/workflows-js/plan-feature.js
  state: existing
delivers_to: null
expects_from: null
test_intent:
- clause: the final gate's heading names the test-design stage as the stage it follows
  needs_test: true
  reason: The heading text is what the user sees at the gate, and the stale name is the defect.
- clause: the cancel message names the final gate as the test-design gate, as in "final gate (test design)",
    and does not contain "IT-PO" or "IT PO v3"
  needs_test: true
  reason: The cancel message is produced by a shared builder whose argument is the stale text.
- clause: the commit-failure message names the stage "test-design", not "it-po"
  needs_test: true
  reason: The commit-failure message names the stage that failed and must name the right one.
- clause: the messages for the product owner, business analyst and technical planner gates are unchanged,
    character for character
  needs_test: true
  reason: The shared builders could change the other gates' messages too, so they must be pinned.
- clause: the workflow body's measured length after the change is no greater than before it
  needs_test: false
  reason: The commit-time file-size growth ratchet enforces this and refuses a body that grew.
- clause: given the user has chosen "edit" once at the final gate and the test-design stage has been
    re-invoked with the feedback
  needs_test: false
  reason: Precondition line of the next scenario, not an outcome, so there is nothing to prove here.
- clause: the abort message names the test-design stage as the stage that did not produce satisfactory
    ACs after 2 attempts, as in "test-design failed to produce satisfactory ACs after 2 attempts. Pipeline
    aborted.", and the abort message, including its max-retries label, does not contain "it-po", "IT-PO"
    or "IT PO v3"
  needs_test: true
  reason: The final gate's second-edit abort hard-codes it-po in both the message and its max-retries
    label, although the stage re-invoked there is test design.
- clause: given instead the technical planner's stage fails its requirement rule check on its first attempt
    and again after its one re-invocation
  needs_test: false
  reason: Precondition line of the next scenario, not an outcome, so there is nothing to prove here.
- clause: the abort message still names that stage's agent, character for character "it-po failed to produce
    satisfactory ACs after 2 attempts. Pipeline aborted.", with the max-retries label "max-retries abort
    for it-po"
  needs_test: true
  reason: The automatic gates share one abort text driven by the stage's agent, so a fix made there would
    relabel every gate; this pin catches that.
test_spec:
- name: test_final_gate_heading_names_the_test_design_stage
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: reachability
  description: plan-feature.js under run_workflow_under_e2 (technical route) runs to the final-gate pause;
    the persisted question prompt and the no-answer gate-failure message name the test-design stage and
    not IT PO v3.
  proves_clause: the final gate's heading names the test-design stage as the stage it follows
  code_file: templates/workflows-js/plan-feature.js
- name: test_final_gate_cancel_names_the_test_design_gate
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: discrimination
  description: Resumed with a person's cancel at final-gate, the returned message contains final gate
    (test design) and contains neither IT-PO nor IT PO v3.
  proves_clause: the cancel message names the final gate as the test-design gate, as in "final gate (test
    design)", and does not contain "IT-PO" or "IT PO v3"
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - the cancel label stays final gate (IT-PO)
  - only the label changes while the message still names IT PO v3 elsewhere
- name: test_final_commit_failure_names_the_test_design_stage
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Resumed with approve while the second commit-stage-output reply is a hook failure: the
    error message reads Commit of test-design AC output failed and does not contain it-po.'
  proves_clause: the commit-failure message names the stage "test-design", not "it-po"
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - formatCommitError at the final commit is still passed it-po
  - the stage name comes from the last authoring agent instead of the final stage
- name: test_other_gate_messages_are_unchanged
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Pins the other gates character for character: a cancel at gate-po and at gate-ba gives
    Pipeline cancelled at gate after product-owner and after business-analyst, and an itpo-stage commit
    failure still reads Commit of it-po AC output failed.'
  proves_clause: the messages for the product owner, business analyst and technical planner gates are
    unchanged, character for character
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - buildCancelMessage or formatCommitError is changed globally, so every gate names test design
  - the itpo stage's own commit failure is relabelled test-design
- name: test_final_gate_second_edit_abort_names_the_test_design_stage
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Technical route under run_workflow_under_e2, resumed with a person''s approve at final-gate
    while the design-prepass reply fails (exit 1, no report) on every pass, so the test-design stage''s check
    forces an edit on both final-gate passes (a person''s resume answer applies once per run, BO-2300d-1-iii;
    the TestFinalGateEditFallthrough technique). Asserts design-prepass was dispatched twice, status is error,
    the first message line is exactly "test-design failed to produce satisfactory ACs after 2 attempts. Pipeline
    aborted.", the "Pipeline cancelled at ..." label line names test-design, and the whole message contains none
    of it-po, IT-PO, IT PO v3.'
  proves_clause: the abort message names the test-design stage as the stage that did not produce satisfactory
    ACs after 2 attempts, as in "test-design failed to produce satisfactory ACs after 2 attempts. Pipeline
    aborted.", and the abort message, including its max-retries label, does not contain "it-po", "IT-PO"
    or "IT PO v3"
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - only the first message line is fixed while the max-retries label still reads "max-retries abort for it-po
    (final gate)"
  - the fix is made in the shared automatic-gate abort branch instead of the final-gate branch, so the
    final-gate abort still names it-po
  - the final-gate abort is built from step.agent, so it names test-designer rather than the test-design stage
- name: test_other_gate_messages_are_unchanged
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'The existing pin test, extended to the technical planner''s automatic-gate abort: technical
    route under run_workflow_under_e2 with no resume answer and rule-check-itpo answered check_reply(passed=False)
    on both passes. Asserts stage-itpo-author and rule-check-itpo were each dispatched twice, design-prepass was
    never dispatched, status is error, and the whole message equals, character for character, "it-po failed to
    produce satisfactory ACs after 2 attempts. Pipeline aborted." followed by a newline and buildCancelMessage''s
    text for the label "max-retries abort for it-po" with the batch ids as uncommitted drafts.'
  proves_clause: the abort message still names that stage's agent, character for character "it-po failed to produce
    satisfactory ACs after 2 attempts. Pipeline aborted.", with the max-retries label "max-retries abort
    for it-po"
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - the shared automatic-gate abort is renamed globally to test-design, so the technical planner's abort names
    test design
  - the shared branch's max-retries label is changed (for example given a final-gate or test-design suffix)
    while its first line still names it-po
