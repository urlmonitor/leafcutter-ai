test_spec:
  - name: test_paths_the_routing_step_wrote_are_staged_by_name
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Drive quick-fix.js under the engine harness with a routing reply naming two written paths; assert both appear as items 5 and 6 in the commit dispatch's stage list and no sweep command appears."
  - name: test_commit_prompt_is_identical_whenever_no_routed_write_exists
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "Assert the commit prompt is byte-identical across the harness default routing stub, an empty list, an absent field, did_not_run and an unrecognised case, and that its stage list ends at item 4."
test_rationale: |
  The defect was a result nobody consumed, so every test drives the whole
  workflow and asserts on the prompt the commit dispatch actually received.
  A grep for the new field in quick-fix.js would pass on the same dead shape.
notes: |
  Found 2026-10-08: quick-fix.js routed learnings before its commit (per
  INF-700a-1's ordering) but the commit prompt said "Stage and commit exactly
  these files" (four) and "Do not stage any other files", so every routed
  learning was left uncommitted and lost when the worktree was removed.
  fast-lane-ship.js only carries them because its commit prompt runs git add -A.
