readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a run whose set of steps to perform is fixed before the first step starts,
    And one of those steps stops short while the run is going,
  When the run reaches its end,
  Then that step is still counted among the steps the run was supposed to perform,
    And the set of steps the run was supposed to perform is the same set at the end
      as at the start,
    And the step is not reclassified as one that was not required, not marked
      optional, and not dropped from that set.

  Given the same run,
  When its outcome is returned,
  Then the number of steps performed is smaller than the number it was supposed to
    perform,
    And the run does not lead with a success value,
  So a run cannot reach a clean report by shrinking what it owed.

  Given a run in which a step stops short and the run then decides that step was not
    required after all,
  When the run returns its outcome,
  Then that decision does not remove the step from the set the run was supposed to
    perform and does not restore the success value,
    And the decision itself is reported, naming the step and the obligation it
      would have removed,
  So an attempt to resolve a stop by relieving the obligation is visible rather than
    silent.

  Given a run in which no step stopped short and every step it was supposed to
    perform was performed,
  When the run returns its outcome,
  Then the two counts are equal and the run leads with a success value,
  So the comparison is a real comparison and not a permanent shortfall.
