notes: |
  THE COMMA IS THE WHOLE RISK. `[data-ac~="id"]`, the selector the built side
  derives, splits on whitespace only. One comma in a mockup's attribute value
  produces a selector that matches nothing — on a screen that looks correctly
  annotated to a human reader. This is why the second scenario asserts the
  absence of a comma explicitly rather than only asserting the ids are present.
  Note the deliberate asymmetry with the `@ac` comment-line grammar, which IS
  comma-tolerant; two grammars coexist and only one of them belongs here.

  ONE PIN PER ELEMENT, EVEN WHEN MULTI-VALUED — mirrors GE-124b-1's cardinality
  rule. An author (or a generator) that emits two adjacent single-valued
  wrapper elements instead of one multi-valued attribute satisfies every
  membership assertion while changing the counts the comparison reports.

  THE THIRD SCENARIO IS A POSITIVE BEHAVIOUR, NOT AN ABSENCE. Pinning is not
  exhaustive — a mockup is not required to pin every element, and an
  implementation that nudges toward blanket annotation turns a review aid into
  paperwork and floods the design side with pins nobody chose.
