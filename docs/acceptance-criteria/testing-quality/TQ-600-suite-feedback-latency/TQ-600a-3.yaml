notes: |
  SHARING IS ONLY SAFE IF READ-ONLY IS ENFORCED RATHER THAN ASSUMED. TQ-600a-1
  hands one layout to many tests on the premise that they only read it. That
  premise is an assumption about code nobody has audited test-by-test, and it will
  be violated eventually — most likely by a test added a year from now by someone
  who has never read this AC. The cost of an unnoticed violation is the worst kind:
  a shared layout silently wrong for every test that runs after the offender, which
  presents as intermittent unrelated failures.

  THE SECOND CLAUSE IS THE CAN-FAIL PROOF AND IS NOT OPTIONAL. A comparison that
  always reports "clean" is worth less than no comparison at all, because it
  licenses the assumption it was supposed to test. Deliberately dirtying the layout
  and requiring a named, located difference is the only evidence the comparison is
  live.

  THE THIRD CLAUSE EXISTS BECAUSE OF THIS REPO'S OWN HISTORY. The AC-store
  validator exited 0 having globbed zero files for eight days and looked clean
  throughout. A file-count in the output is cheap and makes that failure mode
  visible.

  DELIBERATELY NOT SPECIFIED: how the contents record is taken (hashes, sizes,
  modification times) and whether the comparison runs once at the end or between
  tests. Both are implementation decisions for the it-po; the criteria constrain
  what must be observable, not how.
