criteria: |
  No silent edits, no leftovers, no stale copies -- and no false all-clear.

  Running the build should never cost you anything you did not ask to give up.
  Today it can quietly rewrite files you did not touch, abandon files you deleted,
  and leave the checks on your machine running last week's rules -- and in each
  case it finishes by telling you everything is fine. This goal makes the build's
  own account of its work complete and true: what it changed, what it removed,
  and what it left behind all match what it reports. You can run it, read the one
  line it prints, and act on it without checking by hand.
