    changed: "SUPERSEDED by AR-300c-1 and AR-300a-4, decided by BrainCandy 2026-10-09. This record required llm-expert's template BODY to hold a hand-written 'Skills' table; AR-300a-4 ('No compiled prompt carries two competing accounts of what an agent may use') forbids exactly that once AR-300c-1 makes the frontmatter `skills:` declaration the single source, delivered as one appended skills section with mode and condition. The intent survives: llm-expert still declares exactly add-agent-to-package, add-skill-to-package and signoff, and its compiled prompt names each with when it applies. Two parts are deliberately not carried forward: the SKILL.md path column (skills are invoked by name), and signoff's 'end of every ticket phase' condition (the user made llm-expert/signoff `always`). criteria left unchanged as the audit trail; the covering test in unit_tests/agents/test_llm_expert_artifacts.py is rewritten to assert the replacement."
