notes: |
  FLOW BACK-LINKS (add this AC id to each node's implements list):
    leafcutter/decision-forming    step    resolve
    leafcutter/decision-lifecycle  step    form

  DERIVATION. Scenario resolve, plus the journey scenario decision-lifecycle/form
  ("the decision resolves only after a human approves the criteria and makes the
  ranked choice, and it carries approved_by: human:<id> and approved_at"). Values
  from dec-d53e1c52cd47c832.

  SCOPE. "formed by ranking" is deliberate: a decision formed by reusing a
  precedent (assessment_basis precedent_reuse) has no criteria and no ranked
  choice and resolves on the reuse answer instead. That path is DK-100e-4.

  JOURNEY NODE NOTE. decision-lifecycle/form expands into the forming sub-flow,
  which DK-100a and DK-100b share. If the journey node should roll up the whole
  sub-flow, list DK-100a and DK-100b (the composites) in its implements instead of,
  or as well as, this AC.

  IT-PO BUILD STATUS (2026-10-02, unverified): built and tested. Pointers: amended_by.
