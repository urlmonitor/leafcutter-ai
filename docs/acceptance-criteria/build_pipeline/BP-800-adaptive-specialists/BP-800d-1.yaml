id: BP-800d-1
title: "Legacy hardcoded agent is superseded when a generated specialist exists for the same technology"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given the project previously deployed a hardcoded "python-coder" agent template (from the legacy fixed agent set)
  And the technology detector detects "python" in the project
  And the agent generator produces a new "python-coder" specialist from the best-practice knowledge layer
  When the build completes
  Then the generated specialist replaces the legacy template at the same dispatch name ("python-coder")
  And the legacy template file is renamed with a ".legacy" suffix (not deleted)
  And the build output reports: "Superseded legacy agent: python-coder (replaced by generated specialist)"
  And dispatching "python-coder" by name invokes the generated specialist, not the legacy one
