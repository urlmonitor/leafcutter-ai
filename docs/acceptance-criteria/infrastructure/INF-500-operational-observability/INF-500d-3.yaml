      - stderr_lines itself changed to drop the submit-failed line
  - name: test_declared_sink_refusals_leave_one_human_line_plus_the_reason_line_and_the_4_i_assertions_stay_strict
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: criterion
    description: "Real script runs of the INF-500d-4-i cases (absent declaration, a bad declaration, a stale root, and the sink outside the root of the sink-rule file): the raw stderr_lines count is 2, the refusal helper count is exactly 1, that one line still names the declaration and the failed condition (and operational_log_root for the sink-rule case), nothing is created and the declared sink is untouched. The two INF-500d-4-i assertion sites (_assert_refusal and the sink-rule test around the stderr count) call the refusal helper and keep every other assertion; a run with an extra non-reason stderr line still fails the count."
    proves_clause: the destination could not be written
    code_file: unit_tests/feedback/_inf_500d_4_helpers.py
  - name: test_submit_feedback_run_as_a_subprocess_emits_the_reason_line_on_a_real_failure
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: reachability
    description: "Runs the real submit_feedback.py of the copied layout as a subprocess with real argv (python -B, own declared sink, confined TMPDIR) once into a refused writer and once with no sink declaration, and asserts the submit-failed:<reason>:<category> line appears on stderr with the matching reason, stdout stays empty and the exit status is non-zero. A third run with a usable declaration succeeds and prints no such line."
    proves_clause: "the marker names the reason, drawn from a closed set that distinguishes at minimum these five cases:"
    code_file: templates/scripts/feedback/submit_feedback.py
