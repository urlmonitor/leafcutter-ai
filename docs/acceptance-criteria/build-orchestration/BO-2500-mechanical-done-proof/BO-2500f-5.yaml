title: "How-to: close a requirement no test can prove by naming its check or recording its inspection"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a person who has to close a requirement that no test can prove,
  When they follow the how-to for proving a requirement done,
  Then the guide shows how to choose between a check and an inspection, with one
    worked example of each, and states that an inspection is not available for
    code, schema or pipeline work,
  And it shows how to add the enforces tag to a check and how to confirm the check
    is wired to a commit-time hook or a build phase,
  And it shows how to run the inspection workflow (BO-2500f-3-ii) so that a person
    approves the inspection, that the approval is kept in a committed approval
    file the inspection references by run id, that the file must be committed
    together with the record, that the approval and its date are read from that
    file when the record is marked done, and that a change to any inspected file
    makes marking done refuse with "re-inspection needed",
  And it links to the exemption reference entry (TQ-400e-6, as amended for the
    verification record) for when a declaration is honoured or refused and which
    records may carry one, and does not restate those rules,
  And it has a section on what goes wrong that lists each refusal a reader can
    meet, with the message and the fix,
  And a reader who follows the guide produces a record the done gate accepts.
