id: KM-KGS-100c-1-ii
components:
  - knowledge_management
readiness: approved
priority: high
title: "A node on a surface that is neither declared nor one of the map's named synthetic surfaces fails the surface check"
component: knowledge-management
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
parent: KM-KGS-100c-1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100c-1.yaml"
criteria: |
  Given a surfaces configuration that declares the agents and tickets surfaces and
    no surface named "files" or "gizmos",
  And the map's named set of synthetic surface labels is exactly "components"
    (component hub nodes) and "files" (path-keyed file nodes),
  And a built map holds agent node "python-coder", ticket node "T-1", hub node
    "build-pipeline" labelled "components", file node "scripts/foo.py" labelled
    "files", and node "stray-1" labelled "gizmos",
  When the surface-set check runs over that map,
  Then the check fails and its message names the label "gizmos" and the node
    "stray-1",
  And the nodes labelled "components" and "files" raise no failure,
  And removing node "stray-1" makes the check pass with the same configuration.
depends_on:
  - KM-KGS-100c-1
doc_links:
  - path: docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100c-1.yaml
    relationship: context
    status: exists
    relevance: "The parent's 'no surface is read that was not declared' clause. Today a node with an undeclared label never enters contributing_surfaces, so the subset check is true by construction and cannot catch it. This record makes that clause checkable."
  - path: docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100d-4.yaml
    relationship: context
    status: exists
    relevance: "Introduces the synthetic 'files' surface label. Its nodes are created only for referenced files, so 'files' is a synthetic label and must never be a declared, traversed surface."
