notes: |
  2026-08-13 (BA decomposition). Five L2s: -1 the core rule (a proof that reached the
  code by direct import does not satisfy done when the unit has a way in), -2 the
  method constraint that makes -1 trustworthy (the judgement comes from watching the
  run, never from reading the test's text), -3 the no-way-in refusal that catches the
  actual fast-lane regression, -4 the how-to and -5 the sequence diagram satisfying
  the two documentation_triggers. One L3, BO-2900a-1-i, isolates the
  entered-but-not-reached misreading of -1.

  MANDATORY BOUNDARY vs BP-1100b-5 (build-pipeline, authored concurrently) is recorded
  in full in BO-2900a-1's notes: BP-1100b-5 is a diff-time lint on assertion SHAPE
  over a fixed glob set; this L1 is a done-proof rule on what an executing assertion
  REACHED. BP-1100b-5 would NOT have caught the fast-lane regression; this L1 does.
  Conversely this L1 does not catch a presence-only assertion over workflow
  JavaScript, which has no entry point of its own to run through. Neither rule may be
  widened into the other.

  BOUNDARY vs BO-2900b: b inventories REGISTERED capabilities and demands a caller for
  each; in the regression state nothing was registered, so b's forward check passes
  vacuously there. BO-2900a-3 is what refuses that state. See BO-2900a-3's notes.
