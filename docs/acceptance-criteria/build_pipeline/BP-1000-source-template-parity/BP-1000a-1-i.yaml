title: "The merge-gate parity check catches cumulative cross-ticket drift that per-ticket sync verification let through"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-1000-source-template-parity/BP-1000a-1.yaml"
criteria: |
  Given an early ticket on the branch added a behavior to a canonical source
    script and updated its shipped template copy to match, so that ticket's own
    per-ticket template-sync verification passed
  And a later ticket on the same branch edited that source script again and
    silently dropped the earlier addition from the shipped template copy, yet
    its own per-ticket verification still passed because that ticket touched a
    different region
  When the merge-gate parity check runs over the final state of the whole branch
  Then it compares the final source and final shipped copy as they now stand,
    independent of any single ticket's verification
  And it reports the accumulated divergence as drift
  And it blocks the merge
  And the per-ticket template-sync verification is supplemented, not replaced —
    the gate is the backstop that catches drift no individual ticket flagged
