id: BO-3100b-3
title: "A step that legitimately changes nothing passes on a declared no-op, and nothing else confers one"
component: build-orchestration
components:
  - supervisor_system
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a step whose contract declares that it may legitimately produce no change — because
    the condition it exists to satisfy is already satisfied, or because it is skipped for a
    stated reason,
    And the project's working state is unchanged after it runs,
  When it attempts to finish,
  Then it finishes, is recorded as a step that legitimately produced no change, and the
    stated reason appears in the build's record.

  Given a step whose contract makes no such declaration,
    And the project's working state is unchanged after it runs,
  When it attempts to finish,
  Then it is prevented from finishing and re-run.

  Given a step whose contract makes no such declaration but whose name, kind and position in
    the build all match those of a step that does,
    And the project's working state is unchanged after it runs,
  When it attempts to finish,
  Then it is prevented from finishing, because nothing other than the step's own declaration
    permits an empty result.
depends_on:
  - BO-3100b
  - BO-3100b-1
doc_links:
  - path: docs/architecture/agent_delivery_workflows.md
    relationship: modifies
    status: exists
    relevance: "Where a step's dispatch contract is defined; the no-op declaration is a field on it."
  - path: docs/known-issues/supervisor-system.md
