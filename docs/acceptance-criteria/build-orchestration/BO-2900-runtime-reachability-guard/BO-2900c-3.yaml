criteria: |
  Given the capability-to-automation connection checks are in place,
  When an author who is renaming or removing an operator-facing capability consults
    the project's task-oriented documentation,
  Then the same how-to guide that covers adding a capability also covers renaming and
    removing one,
    And it shows the refusal produced by an automation invocation naming a capability
      that does not exist, and states that the remedy is to fix the call,
    And it states that a rename produces findings of two kinds in one change — stale
      callers and a newly uncalled capability — with one underlying fix, so neither
      kind is exempted away,
    And it states that a removal produces stale-caller findings only,
    And no second guide covering the reverse direction is created.
