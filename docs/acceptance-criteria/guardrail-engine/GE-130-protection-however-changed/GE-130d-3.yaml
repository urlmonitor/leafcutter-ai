id: GE-130d-3
title: Each protection runs warn-only on the command path for every caller first, and moves to blocking
  only after its measurement shows no false block and few changes it could not attribute
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a protection whose command coverage is in its warn-only stage,
  When a shell command it would refuse or stop is issued, by any caller,
  Then the command is carried out and the run continues, and the protection states on the
    session's visible output the protection, the command and the file it would have refused,
    in the wording its refusal will use,
  And the stage applies to every caller alike: no caller meets the blocking stage while another
    meets the warn-only stage for the same protection,
  And when the stage is checked, a protection whose command coverage is in its blocking stage
    without a measurement from GE-130d-2 for it reporting no false block is named and the check
    fails,
  And for the documentation guard and the guide-read guard, a protection whose command coverage is
    in its blocking stage without a stated limit on the share of its after-the-fact findings it
    could not attribute (GE-130c-2-i), or whose share measured over real runs in which more than
    one agent worked in the same working copy at once exceeds that limit, is named with the
    measured share and the limit, and the check fails,
  And such a measurement states how many of those parallel runs and how many after-the-fact
    findings it counted, and a measurement over no parallel run reaches no verdict on the share
    and does not let the protection into its blocking stage,
  And a protection still in its warn-only stage whose measured share exceeds its stated limit
    stays in its warn-only stage, and the check states that it stays warn-only because the share
    exceeds the limit, naming both,
  And a protection in its blocking stage whose most recent measurement reports no false block,
    and, for those two guards, whose measured share of unattributed findings is within its stated
    limit, is not named, established in the same run.
