notes: |
  CONSEQUENCES THE USER MUST SEE BEFORE APPROVING. With the data measured on
  2026-10-09, the union rule:
    - GRANTS python-coder permission to dispatch test-runner. Today that
      permission exists only in python-coder's hand-written table; the registry
      does not list it, and nothing delivers either source. After this lands,
      python-coder's compiled prompt will name test-runner as a sub-agent it may
      call. If the user does not want python-coder dispatching test-runner, the
      right move is to say so now and remove it from the table before the
      migration, not to let the migration drop it silently.
    - KEEPS architect-review-deep on architect-review. That sub-agent has a
      registry entry (template_path null) and no templates/agents/ definition, so
      under AR-300c-5-iii the build will REFUSE on architect-review until the
      user resolves it. The union is still correct: dropping it silently would
      hide that architect-review's body instructs it to "Spawn
      architect-review-deep via the Agent tool".

  WHY UNION RATHER THAN 'REGISTRY WINS'. Mirrors AR-300c-2 deliberately. A
  hand-written table entry is a permission an author typed on purpose; picking
  one side quietly discards the other side's decisions, and the user cannot
  check what was lost. The union plus a named disagreement list puts every such
  call in front of the user.

  THREE SOURCES, NOT TWO. The orchestrator's probe compared the registry against
  the body tables. The BA found a third: four templates already carry a
  frontmatter `spawn_allowlist:` key (frontend-coder, onboard non-empty;
  ac-triage, onboard-config-section empty). The two non-empty ones agree with
  the registry today, so the union is unchanged by them -- but the consolidation
  must still read them, or a future disagreement there is dropped.

  THE FIVE TABLES (measured): business-analyst, frontend-coder, test-writer
  MATCH the registry; python-coder adds test-runner; architect-review omits
  architect-review-deep. llm-expert only mentions the heading in its review
  checklist prose and has no table -- it is not a source (see AR-300a-5-i).
  The user decision text says "six" tables; the measurement says five tables
  plus one prose mention.

  EXISTING EMPTY DECLARATIONS ARE LEFT ALONE. AR-300c-2 says an ungranted agent
  ends with no declaration rather than an empty one. Here two templates already
  hold `spawn_allowlist: []`; the migration does not rewrite unrelated
  frontmatter, so it neither removes those nor adds new ones. Empty and absent
  are treated identically downstream (AR-300a-5).

  ORDER MATTERS. This consolidation must run before the hand-written tables are
  removed (AR-300a-5-i); deleting the tables first loses test-runner.

  USER DECISIONS SINCE AUTHORING (IT PO, 2026-10-09). Both consequences above
  have been decided by BrainCandy. Decision 11: python-coder keeps test-runner;
  the union's grant stands. Decision 10: architect-review-deep is removed, but
  by a separate remediation step after this consolidation (written into
  AR-300c-5-iii's it_requirements), not by this migration -- the migration still
  carries the union and reports the disagreement, as the criteria require.
