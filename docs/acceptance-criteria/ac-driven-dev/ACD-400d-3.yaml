notes: |
  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Decomposes ACD-400d.

  THE SAME-ANSWER CLAUSE IS WHAT PINS THE VERDICT. Asserting only the three-way order
  would be satisfied by any rule that puts a no-urgency piece somewhere between high and
  low — including a rule that gives it a tier of its own just above or just below medium,
  which would reorder real work whenever a no-urgency piece and a medium piece are the
  same size. Requiring that the absent case and the explicit-medium case produce the
  identical offer removes that whole family of near-misses in one sentence, and it is
  cheap to test: build the store twice, change one field, compare the two lists.

  WHY THE SIZES ARE ARRANGED THE WAY THEY ARE. The no-urgency piece is deliberately given
  the smaller size and the medium piece the larger, so that the no-urgency piece leads the
  offer for a reason the criteria can name (size, at equal urgency) rather than for an
  unexplained one. Had both been the same size the identifier would decide, and the test
  would tell a reader nothing about which tier the absent case landed in.

  THIS IS A STATEMENT OF SHIPPED BEHAVIOUR. The scope fence in ACD-400d's notes applies:
  whether a generous default is the right default is BrainCandy's call, not this AC's.

  RULED 2026-09-08 BY BrainCandy: KEEP IT. The generous absent-urgency default stays,
  and so does the harsh absent-approval default in ACD-400c-2 — the asymmetry between
  them is accepted rather than left pending. This AC therefore now records a chosen
  behaviour, not merely an observed one. Its criteria are unchanged, because they
  already described what ships; what changed is that an implementer who "tidies" this
  default is now reversing a decision instead of resolving an ambiguity.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L2.
