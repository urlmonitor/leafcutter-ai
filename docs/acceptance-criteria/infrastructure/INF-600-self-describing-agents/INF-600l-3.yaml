title: "The pr-reviewer prose backstop for card/registry consistency delegates the search to research-agent"
component: infrastructure
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/infrastructure/INF-600-self-describing-agents/INF-600l.yaml"
criteria: |
  Given a change modifies an agent's registry entry or its generated card, and the
    pr-reviewer is reviewing it as a backstop to the build-time mirror check
  When the pr-reviewer's review instructions cover card<->registry consistency
  Then the pr-reviewer does not attempt to search the registry and cards itself
    (it has no search tools) -- instead it delegates the card<->registry
    cross-reference to research-agent and reasons over what research-agent returns
  And the review instructions frame this consistency check as a BACKSTOP to the
    authoritative build-time check (INF-600l-1), not a replacement for it
  And when research-agent reports a card<->registry disagreement, the pr-reviewer
    surfaces it in the review naming both agents and the disagreeing side
depends_on:
  - INF-600l
  - INF-600l-1
