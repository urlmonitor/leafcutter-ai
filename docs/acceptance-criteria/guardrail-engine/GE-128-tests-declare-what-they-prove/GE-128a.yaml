readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  A new test declares its requirement; the existing backlog never blocks you.

  Adding a test that does not name the requirement it proves is refused. Working
  on a file that already holds undeclared tests is never refused for tests it did
  not add, so nothing in the project becomes untouchable on the day the standard
  is switched on. The number of undeclared tests in any one file can go down and
  never up, judged against that same file as it stood before the change rather
  than against any target — so the backlog shrinks on its own and the standard
  needs no cleanup before it can be adopted.
