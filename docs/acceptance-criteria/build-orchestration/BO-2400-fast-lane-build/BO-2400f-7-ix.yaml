  contract: "Claim-step outcome, one of: usable claim | {halt_kind: 'declined_step', ...} | {halt_kind: 'claim_command_failed', exit_status, stderr} | {halt_kind: 'claim_held', held: [non-empty ids], claim_outcome (verbatim)} | {halt_kind: 'state_unknown', ...}. claim_command_failed triggers BO-2400f-10-iv; claim_held dispatches no release. BO-2400f-7-x extends the same reader to a held outcome relayed on standard error."
