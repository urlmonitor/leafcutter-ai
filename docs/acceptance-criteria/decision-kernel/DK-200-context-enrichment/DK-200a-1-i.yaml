id: DK-200a-1-i
title: "An explicit answer contract keeps its route and still receives initial context"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: draft
req_status: draft
priority: high
work_status: done
criteria: |
  Given a new request has an explicitly requested evidence answer,
  And permitted documentation can ground that request,
  When the kernel starts the run,
  Then initial enrichment runs once,
  And the explicit evidence answer remains the requested output without automatic intent selection replacing it.
depends_on: [DK-200a-1]
