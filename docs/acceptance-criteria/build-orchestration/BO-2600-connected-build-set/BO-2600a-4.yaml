id: BO-2600a-4
components:
  - build_orchestration
title: "build-ac emits a dependency-ordered epic when the connected build set has more than one AC"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given /build-ac processing a leaf AC in its single-ticket path (Step 2b),
  And the coordinator resolves the connected build set via the select_connected
    CLI with --exclude-structural-parent,
  When the resolved set contains more than one AC,
  Then the coordinator emits a dependency-ordered epic folder (not a single ticket)
    by passing the EXACT resolved id list to goal_to_epic's id-list entrypoint
    (BO-2600a-5) — one ticket per id in the set, ordered prerequisites-first, with each
    ticket's depends_on wired to the co-located prerequisite tickets so the
    ticket_frontmatter_guard passes,
  And the epic CONTENT is the resolved connected set itself (NOT a re-walk of the
    target AC's covered_by subtree) — so cross-tree genuine prerequisites that live
    outside the target's subtree are included, not dropped,
  And every member of the resolved set (the target AC, its baked-in cross-tree
    prerequisites, and its un-built children) appears as a ticket in the epic folder,
  And the Step 3 confirmation prompt adapts to the epic form
    ("Build this epic now? (yes / review / skip)"),
  And dependency cycles are already drained (with a warning) UPSTREAM during
    connected-set resolution (fast_lane.resolve_connected_build_set via
    scan_ac_store._drain_cycles), so the id list handed to goal_to_epic is acyclic;
    goal_to_epic's CyclicDependencyError is only a defensive backstop, and if it
    does fire the coordinator surfaces that non-zero exit as an error rather than
    silently proceeding.
depends_on: [BO-2600a, BO-2600a-2, BO-2600a-5]
