    description: "Arms 1 AND 2 in ONE test method, deliberately not split. Six entries, one per declared rule, all naming the fixture path and every line: at least one finding is reported, and the identical six entries written in reverse order report the same count. RED today (measured 0 in both orders). The order assertion is vacuous alone — 0 equals 0 today — so it is only ever asserted alongside the at-least-one assertion in the same method, and must never be reported as a standalone pass"
  - name: test_multi_entry_collapse_warning_names_the_file_and_the_declined_lines
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Arm 1's announcement clause, RED today (no output on any stream): the error stream captured around scan_files names the fixture file as the one the entries would have left with nothing able to report on it, and identifies each declined line by its 1-based line number and verbatim text, reusing GE-123b-1-i's contract without variation"
  - name: test_five_per_rule_entries_leaving_one_live_rule_still_narrow
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Arm 3, REGRESSION GUARD, GREEN ON ARRIVAL by design (measured 1). Five entries naming five of the six declared rules, with the high-entropy rule left unnamed, report exactly one finding — the high-entropy token — and no lost-coverage warning. Fails any implementation that declines entries as soon as more than one is in force"
  - name: test_collapse_threshold_follows_the_declared_rule_inventory
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "Data-driven guard against a hard-coded six: with the scanner's declared rule inventory temporarily extended by one additional rule id, the same six entries are no longer a collapse — the file is suppressed to zero findings and no lost-coverage warning is emitted. A hard-coded count passes every other descriptor here and fails this one"
  - name: test_exit_status_reports_findings_present_for_the_accumulated_collapse
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "Arm 1's exit-status clause driven through the scanner module's CLI entry point with the temporary root as the working directory, so the allowlist is read the way a real run reads it: the run exits findings-present. Working directory restored in cleanup"
test_rationale: "GE-123b's title says no single line, and the literal reading of that invites an implementation examining each entry alone — which six individually unremarkable per-rule lines defeat, reaching the same measured zero as one over-broad line. The accumulation cannot be observed by calling the suppression predicate once, so every descriptor drives scan_files with a real allowlist file whose lines are written in the specified order. The first descriptor deliberately fuses arms 1 and 2 into one test method: both orders yield zero today, so an order-equality test standing alone is green while the defect is fully live, and a split would hand a reviewer a passing test that proves nothing. The inventory descriptor exists because the threshold is the one number an implementer will hard-code, and a hard-coded six passes every other descriptor while silently weakening the guarantee the day a seventh rule is added. The regression descriptor guards the opposite over-reach — declining entries as soon as more than one is in force — and is green on arrival by design. Note for whoever picks the resolution strategy: two of the six rules fire zero times on an ordinary source file, so restoring one of those would satisfy a rules-only assertion while reporting nothing, which is why the first descriptor asserts a reported finding and not merely a live rule."
