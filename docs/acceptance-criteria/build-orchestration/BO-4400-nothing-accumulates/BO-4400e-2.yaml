risk_surface: safety
criteria: |
  Given the refusal limit is set to 5 GB and the warning level to 20 GB,
  When a workspace is requested with 12 GB free on the volume where workspaces are
    created,
  Then the answer is ready and carries a warning stating the free space (12 GB), the
    warning level (20 GB) and the space existing workspaces occupy,
  And the route that asked shows that warning in its own result,
  And when a workspace is requested with 25 GB free, the answer is ready with no
    space warning,
  And when the configured refusal limit is set higher than the warning level, every
    workspace request is answered with a refusal that names the two settings as
    contradictory, and no workspace is made.
