    status: exists
  - path: docs/architecture/adrs/ADR-017-dual-engine-workflow-support.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment: null
  reference_file_path: "templates/workflows-js/finalize-feature.js"
  n_location_rule: "all"
  required_skills:
    - "python-coder"
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  notes: |
    Policy constraints:
    - A skipped step (BO-1000a-3 branch) must write a "skipped" entry to the same
      in-order per-step record produced by BO-1000b-1, carrying the
      already-satisfied reason.
    - The completeness invariant: after a run, every step in the declared
      sequence has exactly one recorded outcome (executed or skipped) — the
      record has no gaps and no duplicate entries. Assert this against the
      declared step count (the same source of truth as BO-1000a-2's N).
    - No new config key. ADR-001 build.py round-trip parity.
