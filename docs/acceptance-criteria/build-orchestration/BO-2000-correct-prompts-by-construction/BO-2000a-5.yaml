it_requirements:
  - "The sign-off block must contain the section 7 knowledge-capture step as a mandatory post-sign-off step, so every signing agent inherits it without a per-ticket instruction. The step's own content is that the agent emits a knowledge_captured record; section 7 itself is the trigger. This AC constrains only that the step is PRESENT and mandatory in the shared block -- what the record contains (INF-700b-1) and where it is appended (INF-400c-4, INF-400c-4-i) are owned elsewhere and may change without touching this AC."
  - "DO NOT reintroduce `route-learning` / `capture-learning` here. This bullet named them as the section 7 trigger until 2026-09-14; both skill names were retired by ADR-034 decision 3, neither has ever existed under templates/skills/ or .claude/skills/, and section 7 now explicitly PROHIBITS loading them. They were never the trigger mechanism -- reaching section 7 in the protocol is."
  - "Test coverage: assert the compiled sign-off block contains the knowledge-capture (section 7) step."
delivers_to:
  agent: llm-expert
  contract: "A mandatory knowledge-capture (section 7) step in the shared sign-off block"
