  - ac_store
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  A declaration tells you where to look. It never tells you it works.

  Marking a screen or an element with the requirement it renders is a signpost,
  not a result. It can never be recorded as evidence that the requirement is
  satisfied, can never be counted where a proving test is required, and can
  never let work be treated as finished on its own. Wherever the product asks
  "is this actually proven?", a declaration answers no — every time, with no
  exception and no way to configure one.
