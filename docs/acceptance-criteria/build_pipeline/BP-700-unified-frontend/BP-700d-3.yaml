priority: medium
roadmap_phase: phase_1
criteria: |
  Given a project's skills_config.json has a frontend section with:
    frontend.optional_skills: ["webapp-testing", "frontend-design"]
  When the adopter runs build.py with the new package version
  Then the frontend.optional_skills value is updated to remove "frontend-design"
  And the resulting value is: ["webapp-testing"]
  And the frontend.project_context_path key is preserved unchanged
  And the frontend.test_command key is preserved unchanged
  And if the adopter's skills_config.json did not list frontend-design,
    no change is made to the frontend section
