notes: |
  Authored by /quick-fix. Root cause: The `if` clause has only `properties: { status: { const: 'handoff' } }`. In JSON Schema, `properties` passes vacuously when the property is absent, so a reply with no `status` at all satisfies the `if` and the `then` demands handoff_target — a misleading error that points the agent at the wrong field. Fix: add `required: ["status"]` inside the `if` so the conditional applies only when status is present and equals 'handoff'; a reply missing status then fails only on the top-level required status, naming the real problem. Every currently valid reply stays valid. Keep the change within the existing line count: build-feature.js is already over the .js size limit, so it must not grow. The declared twin templates/workflows-js/build-ticket.js (line ~146) carries the identical conditional; it needs the same one-line change, and that edit is expected and approved as part of this fix..

  PLACEMENT. Filed as an L3 constraint under BO-3000 (sibling of BO-3000a, which
  introduced the handoff_target conditional), following the flat BO-3000/BO-3900/BO-4000
  family convention. It narrows when an already-specified schema rule fires; it adds no
  new routing behaviour.
