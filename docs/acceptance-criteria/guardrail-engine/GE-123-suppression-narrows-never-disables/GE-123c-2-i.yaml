estimated_complexity: S
it_requirements:
  - "The set of reportable rule ids currently has no single home: some are declared in the module's rule table and the rest are emitted directly by the per-file scan. Establish ONE canonical set inside the scanner, derived from those declarations rather than hand-copied, and make it the set both the load-time check and the test read. A hand-written second copy is a duplicated source that will drift the moment a rule is added, and the drift shows up as valid new suppressions being rejected."
  - "Reject by data property — the value is not in the canonical reportable set, and is not the wildcard — never by enumerating the specific mis-spellings observed. A branch that names the hyphen variant, the byte-order mark or the trailing space by hand leaves the next variant to escape."
  - "No case-insensitive, whitespace-tolerant or fuzzy matching of the rule id, and no invisible-character stripping: a mis-cased or byte-order-mark-prefixed id is reported and skipped, not quietly repaired."
  - "Reuse the single allowlist-diagnostic convention — error stream, allowlist file path, 1-based line number, verbatim line text, one message per offending line — and do not add a second shape."
  - "Classification is never fatal and never alters the scan's exit status."
  - "Edit the canonical template at templates/skills/security-scanner/scripts/scan_secrets.py and propagate with build.py; never edit a deployed copy (ADR-001)."
  - "Tests must never create, modify or delete a .security-allowlist at any real project root, workspace root or worktree root; every fixture allowlist lives under tmp_path/tempfile."
  - "Fixture files must use ordinary source filenames — the per-file scan short-circuits environment-named files and never reads their content."
test_spec:
  - name: test_unreportable_rule_ids_each_warn_and_are_skipped
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A tempfile-backed allowlist carrying the byte-order-mark-prefixed line, the hyphen variant and the trailing-space variant leaves the high-entropy finding reported, produces one warning per line with its own 1-based line number and verbatim text, and loads none of the three."
  - name: test_every_reportable_rule_id_and_the_wildcard_load_silently
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: boundary
    description: "One entry per rule the scanner can report, plus one wildcard entry, all load with an empty error stream — the ids enumerated from the scanner's own canonical set, never from a literal list written in the test."
  - name: test_accepted_rule_id_set_equals_the_rules_the_scanner_can_report
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: seam
    description: "The set the load-time check accepts is exactly the set of rule ids the scanner can emit, so adding a rule without extending the accepted set turns this test red instead of silently rejecting valid new suppressions."
test_rationale: |
  The positive arm is the load-bearing one and it is only load-bearing if it reads
  the scanner's own rule set: enumerated by hand it would pass forever while the
  check quietly rejected every suppression written for a newly added rule. The
  third descriptor makes that coupling explicit as a parity assertion rather than
  leaving it as a property of how the second was written. The negative arm runs
  through the multi-file scan entry point with real files, per the tree-wide
  verification standard, because the claim includes that the finding survives.
