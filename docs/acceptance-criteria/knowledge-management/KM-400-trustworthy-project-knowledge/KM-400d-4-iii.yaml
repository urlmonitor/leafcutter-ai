id: KM-400d-4-iii
title: "A retrieval result reports name-lookup, connect and query time and names the step a deadline miss happened in"
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-400d-4
criteria: |
  Scenario: per-step timings on a successful retrieval
  Given the graph server name lookup takes 0.2 s, opening the connection takes 0.3 s and the queries take 0.5 s in total
  When a fresh process runs one knowledge retrieve request with deadline_ms 10000
  Then the result has status ok
  And its stats carry three separate fields: name-lookup time about 200 ms, connect time about 300 ms and query time about 500 ms (each within 100 ms)
  And none of the three is folded into another

  Scenario: deadline miss during the name lookup
  Given the graph server name lookup blocks for 20 s
  When a retrieve request with deadline_ms 2000 runs
  Then the result has status unavailable
  And it names "name lookup" as the step the deadline was reached in, with the time already spent in that step (about 2000 ms)
  And the connect and query times are reported as not reached (null), not as 0

  Scenario: deadline miss while connecting
  Given the name lookup returns in 0.05 s and opening the connection blocks for 20 s
  When a retrieve request with deadline_ms 2000 runs
  Then the result names "connect" as the step the deadline was reached in
  And it reports the name-lookup time (about 50 ms) and the query time as not reached (null)

  Scenario: deadline miss while querying
  Given the name lookup and connect finish in 0.1 s and the query blocks for 20 s
  When a retrieve request with deadline_ms 2000 runs
  Then the result names "query" as the step the deadline was reached in
  And it reports the name-lookup and connect times measured before the query started

  Scenario: remembered lookup in a later request
  Given one process has already looked up the graph server names
  When a second retrieve request in that process reuses the remembered addresses
  Then its name-lookup time is reported as 0 with an indication that the remembered address was used, not as not reached
