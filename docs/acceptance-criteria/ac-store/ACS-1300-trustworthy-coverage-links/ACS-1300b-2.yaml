assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "EXACTLY ONE WRITER OF THE COVERAGE FIELD ON THIS PATH, AND IT IS THE EXISTING ONE. The bypassing path must REACH `templates/agents/ac-fulfillment-gate.md` §3c's link-recording behaviour; it must not contain, import, or inline a second implementation of it. Two writers of the same field drift, and the drift is invisible precisely because both write something plausible. The single-line-deletion mutation in the criteria is the only available proof of this and must be preserved as a runnable mutation, not restated as an assertion."
  - "CHANGE_TARGET INCLUDES `prompt` CONDITIONALLY, AND THAT HALF IS NOT THIS AGENT'S SURFACE. The criteria and doc_links deliberately leave the mechanism open: producing the `ac_traceability` key on the bypassing path (workflow code only) and broadening the gate's trigger condition (an agent-template edit) both satisfy the outcome. Per `config/agent_registry.json`, `templates/agents/*.md` is `llm-expert`'s owned surface and `python-coder` owns `.py` and `.js`. If the chosen mechanism requires editing the fulfillment-gate template, that edit must be dispatched to `llm-expert` within the same ticket — it must not be made by the coder, and it must not silently expand into a rewrite of the gate's search behaviour."
  - "PREFER THE WORKFLOW-SIDE HAND-OFF OVER A TEMPLATE CHANGE, PER THE L1's 'RECOGNITION, NOT A SECOND GATE'. Making a bypassing path produce the condition the existing gate already keys on changes nothing about the gate and therefore cannot regress the ticket route. Loosening the gate's trigger changes behaviour for every path at once, including paths this AC never examined."
  - "THE ENTRY WRITTEN MUST BE CHARACTER-IDENTICAL TO THE ENTRY THE TICKET ROUTE PRODUCES FOR THE SAME REQUIREMENT AND THE SAME TEST. `docs/reference/ac-schema.md` permits both `path` and `path::test_function` forms; a path emitting one where the ticket route emits the other satisfies 'the link is recorded' while leaving two spellings of the same fact in the store for every downstream reader to disagree about. Compare per entry, never by count."
  - "NEVER WRITES THE FINISHED-STATE FIELD, AND THIS IS THE SURFACE WHERE THAT IS HARDEST. Unlike the repair tool, a delivery path already flips finished state through other steps, so the badge write is one line away from the link write and will look consistent with its surroundings. The record's `work_status` line must be character-for-character identical across the run. Refused, not deferred."
  - "RECORDS EVIDENCE THAT EXISTS, NEVER EVERY REQUIREMENT IN SCOPE. A requirement named by no present, passing, coverage-tagged test must end the run with its coverage list unchanged. A path that writes an entry for everything it touches manufactures exactly the false evidence this tree calls worse than the missing evidence it replaces."
  - "IF RESOLUTION FROM A TICKET OR RUN CONTEXT TO RECORDS IS NEEDED, EXTEND `scripts/ac_store/ac_coverage_resolver.py` — DO NOT ADD A PARALLEL RESOLVER. Its module docstring carries an EXACTLY ONE RESOLVER constraint that exists because a second reader of the same traceability data already drifted from the first (ACD-1900b-5-i)."
  - "SCOPE FENCE. `templates/agents/ac-fulfillment-gate.md` §3c already searches `tests/ unit_tests/` and §2f already declines to skip L3 — both shipped 2026-08-26, verified on this branch 2026-09-01. This AC is about WHEN the step runs. Re-fixing what it searches goes green against work it did not do."
  - "Must handle errors gracefully per the project error handling policy. A hand-off that fails must be visible in the path's own output — a swallowed hand-off failure is indistinguishable from a path that was never wired, which is the condition ACS-1300b-3 then reports as clean."
delivers_to: null
expects_from:
  ac_id: ACS-1300b-1
  contract: "The classified enumeration. This AC wires the paths that enumeration marks bypassing; it does not decide which those are."
test_spec:
  - name: test_acs_1300b_2_a_bypassing_path_run_to_completion_records_the_link
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the bypassing delivery path's own entry point, run to completion as a subprocess against a temporary store and test tree"
    description: "Run the path itself out of process — not a helper it calls — for a requirement named by a present, passing, coverage-tagged test. Assert the record holds that test's path afterwards. Invoking an internal function here would pass on a hand-off that no real run reaches, which is the fast-lane-build.js failure mode verbatim."
  - name: test_acs_1300b_2_the_entry_matches_the_ticket_route_s_entry_character_for_character
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "REAL PRODUCER INTO REAL CONSUMER. Drive the same requirement and the same test through the ticket route and through the bypassing path against identical store copies, then compare the resulting coverage entries entry to entry. Compare the entry TEXT, not the count: a parallel writer emitting `unit_tests/x/test_y.py` where the gate emits `unit_tests/x/test_y.py::test_z` passes a count comparison and leaves two spellings of one fact in the store."
  - name: test_acs_1300b_2_deleting_the_single_hand_off_stops_the_link_appearing
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    description: "THE SINGLE-WRITER MUTATION, AND IT IS THE ONLY PROOF AVAILABLE. 'No second writer exists' cannot be observed; 'removing one line makes the link stop appearing' can. Remove the hand-off, re-run the same path, assert the coverage list is unchanged. If the link still appears, a second writer exists."
  - name: test_acs_1300b_2_the_finished_state_line_is_unchanged_while_the_link_is_written
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "PAIRING INSIDE ONE RUN — DO NOT SPLIT. In the same invocation that writes the coverage entry, assert the record's `work_status` line is character-for-character identical to its pre-run content. Both halves together: unchanged finished state alone is satisfied by a path that wired nothing. This is the surface where the badge write is most tempting, because the path already flips finished state elsewhere."
  - name: test_acs_1300b_2_an_untested_requirement_touched_by_the_same_run_gains_no_entry
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: "THE OVER-EAGER-FIX GUARD, ASSERTED IN THE SAME RUN as the successful write above. A requirement in the path's scope that no passing coverage-tagged test names must end with its coverage list unchanged. A path that writes an entry for every requirement it touches satisfies every other clause and manufactures false evidence."
