id: BO-2000b-2
title: "Dual-tree files are changed in the package source and reconciled by comparison, never synced by running a build"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a file that exists both in the package source and in its deployed
    location (a dual-tree file), and a change to that file is required,
  When the change is made,
  Then the change is authored in the package source (templates/) copy,
  And the source and deployed copies are reconciled by comparing them directly
    and editing to match,
  And the deployed copy is never regenerated by running a build over the active
    worktree to "sync" it.
