  - path: docs/acceptance-criteria/build-orchestration/BO-2900-runtime-reachability-guard/BO-2900f.yaml
    relationship: related
    status: exists
    relevance: >-
      The originating discipline for bounding a carve-out: a run that never reached
      a piece of work produced no record for it, and reporting that as a bad answer
      generates false shortfalls.
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - >-
    THE CARVE-OUT KEYS ON THE ABSENCE OF A RECORD, NEVER ON A DATE. Piece D
    (pre-epoch, no completion_manifest at all) and piece E (run halted, no
    hand-off record at all) both reach the no-record state by the same rule:
    nothing was emitted. A date-keyed carve-out is the obvious shortcut and it
    fails in both directions — it hides answers older work genuinely recorded and
    grants amnesty to newer work whose date can be made to look old.
  - >-
    PIECE G IS THE ANTI-VACUITY CONTROL AND MUST NOT BE WEAKENED. Every clause
    about D, E and F asserts that nothing is reported, and a reader that reports
    nothing at all satisfies all of them. G is the only clause in this AC that can
    object. Do not narrow, skip, or fixture-special-case it.
  - >-
    A REASONED NEGATIVE IS AN ANSWER. Piece F lands in answer_taken, not in a
    third "soft shortfall" bucket. Any treatment of F as a lesser outcome
    recreates the pressure to fabricate a proof that TQ-500a-2 exists to remove.
  - >-
    THE ANTI-GREP CLAUSE IS BINDING. All four results must be established from
    the records the run actually emitted, over one reading of one run.
  - >-
    Adds no behaviour. This is a regression test over TQ-500b-1's reading and
    must not be closed by a change that special-cases the four fixture records.
delivers_to: null
expects_from:
  ac_id: TQ-500b-1
  contract: >-
    The per-piece-of-work state entries. This AC asserts D and E resolve to the
    no-record state, F to answer taken, and G to answer owed and absent, from one
    reading over one run.
test_spec:
  - name: test_tq500b_1_i_piece_g_is_reported_as_answer_owed_and_absent
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      THE ONLY CLAUSE IN THIS AC THAT CAN OBJECT ON ARRIVAL. Piece G — a record
      carrying the run's other required answers but no falsifiability answer — is
      reported as answer_owed_absent. This is the anti-vacuity control for the
      four descriptors below; if it is ever weakened, this AC becomes a test that
      cannot fail.
  - name: test_tq500b_1_i_pieces_d_e_and_f_are_not_reported_as_shortfalls
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: failure
    description: >-
      D (pre-epoch, no manifest), E (halted run, no record) and F (reasoned
      negative) each produce no shortfall. NAMED MUTATION (this descriptor
      asserts an absence): narrow the legacy carve-out so it accepts only records
      whose ticket predates a hard-coded epoch DATE. Under that injection piece E
      — a present-day halted run — is reported as answer_owed_absent and THIS
      TEST MUST GO RED; restore the presence-of-record rule and it returns to
      green.
  - name: test_tq500b_1_i_the_carve_out_is_a_boundary_not_a_blanket_silence
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: boundary
    description: >-
      THE CONTROL THE BA WROTE INTO THE CRITERIA. Over the SAME run and the SAME
      reading that leaves D, E and F unreported, piece G is still reported.
      NAMED MUTATION: widen the no-record carve-out from "the record carries no
      completion_manifest at all" to "the record carries no falsifiability_answer
      key", which sweeps G into the no-record state. THIS TEST MUST GO RED under
      that widening and green again on revert. This is the alteration this AC's
      own falsifiability answer must name — record it and the per-test outcomes
      under it.
  - name: test_tq500b_1_i_d_and_e_land_in_no_record_and_f_lands_in_answer_taken
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      State placement, distinct from the shortfall assertion above: D and E in
      no_record, F in answer_taken. NAMED MUTATION: place a reasoned negative in
      a third bucket separate from answer_taken; the F half of this test must go
      RED under it.
  - name: test_tq500b_1_i_the_four_records_are_built_by_the_projects_own_writer_and_read_once
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_ticket_signoff_parity.py
    description: >-
      Build D, E, F and G on disk — D with no completion_manifest block at all, E
      as a ticket file with no sign-off comment, F and G via yaml.safe_dump per
      the signoff §2b recipe — and read all four through the registered hook in
      one subprocess invocation. Hand-typed fixtures reproduced the bias that hid
      a parser no-op here twice.
test_rationale: |
  Four pieces of work rather than three, and the fourth is the whole point. Every
  clause about D, E and F asserts that nothing is reported, so a reader that
  reports nothing at all satisfies them completely — it is a negative control in
  exactly the sense KI-TQ-010 describes: green on arrival, incapable of failing,
  and later cited as proof the carve-out is correctly bounded. Piece G is what
  makes the scenario able to object.

  Three of the five descriptors assert an absence and each therefore names a
  concrete injection. The load-bearing one is the carve-out widening: change the
  no-record rule from "no completion_manifest at all" to "no falsifiability_answer
  key" and G is swallowed. That single alteration must turn the boundary
  descriptor RED while leaving the D/E/F descriptors green — which is precisely
  the asymmetry that proves the carve-out is a boundary rather than a blanket
  silence. This AC's falsifiability answer must be of the substitute kind naming
  that alteration.
