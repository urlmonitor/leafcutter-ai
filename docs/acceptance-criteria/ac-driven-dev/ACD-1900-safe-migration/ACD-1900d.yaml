notes: |
  ADR-026 non-negotiable rules 2 + 3. "Advisory before required": new gates ship
  enabled:true, strict:false and are promoted to required only after >=10 consecutive green
  self-host merges. "Deploy-manifest-first": no hook/gate script is made a required CI check
  until it is in the correct build_phases.py deploy_map and verified from the DEPLOYED layout
  (the done_proof.py ModuleNotFoundError precedent -- an un-deployed dependency blocks EVERY
  merge once the gate is required). New done-accounting gates are diff-scoped (like BO-2500b)
  so pre-existing ACs never retroactively fail.
  RE-HOME CANDIDATE: this staged-gate-rollout pattern also lives in guardrail-engine /
  testing-quality; kept in ac-driven-dev for goal cohesion, flagged for IT-PO. Combines three
  ADR rules into one operator-value feature to avoid over-fragmenting the L0.
