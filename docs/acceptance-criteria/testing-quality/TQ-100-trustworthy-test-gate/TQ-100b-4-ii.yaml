assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Recognition must become position-aware, not merely shape-aware. A line-oriented regex over raw file text cannot satisfy this criterion at any level of pattern sophistication, because the distinguishing fact is not in the line — it is in whether the line is inside a string literal. Parse the file (AST or equivalent) rather than tightening the regex."
  - "AMBIGUITY TO RESOLVE BEFORE IMPLEMENTING (raised by it-po, not resolvable from the criteria alone): TQ-100b-4-i names the test's docstring as a valid tag position, while this AC names a docstring occurrence as a non-tag. Adopt one deterministic rule that satisfies both — the workable one is that a docstring counts as tag position only when the covers marker is the docstring's own leading content, whereas a covers marker embedded inside larger fixture text being built by the test is not. State the chosen rule in the reader's own documentation and cover it with the boundary test in this AC's test_spec. Do NOT resolve the ambiguity by dropping either criterion."
  - "Position-awareness must not silently swallow files it cannot parse. A file that fails to parse must be reported (as an unscannable file), never treated as containing zero tags — a parse failure that reads as 'no tags here' is a false negative in exactly the direction TQ-100b-4-i forbids."
  - "Excluding literal occurrences must not cost a file its genuine tags. The files that produce this false positive (ac_store/test_done_proof_js.py, ac_store/test_done_proof_composite.py, ac_store/test_bo2500a_done_proof.py, commit_guardian/test_bo2500b_done_proof_hook.py, build_orchestration/test_bo2400a_fast_lane.py) also carry real tags on their own test functions; those must survive the change unchanged."
  - "Applies to both readers or to neither. Reader 2 (check_test_ac_tags.py) is already position-aware; making reader 1 position-aware CLOSES a known behavioural gap between them, so the parity assertion in TQ-100b-5 must be re-run after this change, not before."
  - "Parsing cost must stay inside the commit-time done-proof budget: at most one parse per file per scan, results reused across both the resolved and unresolved paths. Do not parse the tree once per report class."
test_spec:
  - name: test_id_shaped_covers_text_inside_a_string_literal_yields_no_record
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "In a real on-disk tree containing '# covers: ACS-999z-9' only inside a string literal (and, in a second case, only inside a docstring as embedded fixture text), run the reader and assert ACS-999z-9 produces no coverage-tag record and appears in neither the dangling-reference list nor the malformed-tag list."
  - name: test_real_tags_in_the_committed_tag_mechanism_files_survive_the_position_rule
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Run the reader over the committed unit_tests/ tree — the real files, not a fixture — and assert that the genuine tags carried by the very files that also contain literal covers text (ac_store/test_done_proof_js.py, ac_store/test_done_proof_composite.py, ac_store/test_bo2500a_done_proof.py, commit_guardian/test_bo2500b_done_proof_hook.py, build_orchestration/test_bo2400a_fast_lane.py) are still recorded, while the literal-position captures from those same files ({ac_id}, {self.child_a_id}, {nonexistent_id}, <id>, <deprecated-id>) are gone. A hand-typed fixture reproduces the bias that hides this bug."
  - name: test_moving_the_text_into_tag_position_flips_it_to_a_dangling_reference
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    description: "Two runs through the SAME production entry point (subprocess, not a directly-imported helper) over two real trees differing only in whether ACS-999z-9 sits inside the string literal or in tag position above a test function: the first run reports nothing, the second reports it as a dangling reference. The flip on position alone, through one entry point, is the proof."
  - name: test_docstring_leading_marker_versus_embedded_fixture_text_disambiguation
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: "Pins the docstring boundary the two edge cases straddle: a docstring whose own leading content is the covers marker IS a tag (as TQ-100b-4-i requires), while a covers marker embedded inside larger fixture text within a docstring is NOT (as this AC requires). Also asserts an unparseable file is reported as unscannable rather than as containing zero tags."
