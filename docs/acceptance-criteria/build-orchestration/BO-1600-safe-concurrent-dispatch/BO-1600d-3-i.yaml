estimated_complexity: S
it_requirements:
  - "Probe the git version before the refetch action; guard the --refetch flag behind version >= 2.36. On older git, either use a supported fetch that restores the needed objects, or refuse with a message naming the minimum version — never invoke an unsupported flag and let git error opaquely."
  - "Ordering safety: do not remove the zero-byte objects until the refetch path for restoring them is confirmed viable, so a version-refuse never leaves the store worse than the halted state."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3): wrap the version probe and fetch in try/except with a specific exception type and log at WARNING or higher."
