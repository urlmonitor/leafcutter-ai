notes: |
  Satisfies the reference-doc entry in BO-3200a's documentation_triggers.

  THE DOCUMENTATION MUST CARRY THE TEST, NOT THE PROHIBITION. "Do not use a specialist as an
  errand runner" is exactly the unacceptable form the parent L0 names — an instruction, with no
  way to tell whether you have followed it. Giving the author the same discriminating question
  the sweep asks means the guidance and the enforcement cannot diverge, and an author can check
  their own work before the sweep does.

  The second scenario makes that non-divergence a testable property rather than an intention:
  the documentation's own examples are run through the sweep and must land where it says they
  will.

  Sequenced after a-2 because the sweep is the arbiter the documentation defers to.

  IT-PO ENRICHMENT NOTE (2026-08-26). Two things the page MUST say that the criteria do not
  spell out, because they only became true once the declaration mechanism was settled on
  BO-3200a-2: that a missing result_use declaration FAILS rather than exempts, and that a
  judgement declaration is verified by observation rather than taken at its word. An author who
  learns either of those as a surprise failure will reasonably conclude the sweep is broken and
  work around it — which is the fate BO-2900d exists to prevent, arriving through the
  documentation instead of through the check.
