notes: |
  WHY A DOCUMENTATION RECORD IS REQUIRED AND WHY IT IS NOT OPTIONAL PADDING. The parent
  sets documentation_triggers [reference-doc], and the trigger has a specific cause: of
  the four reassurances the parent names, THREE ARE PURE DOCUMENTATION OR CONFIGURATION
  and only one causes execution — and nothing written anywhere says which. A reader doing
  everything right today reaches the wrong conclusion. GE-120h-1 makes the surfaces agree
  from now on; it does not tell the next reader what they are looking at, and it cannot
  reach the adopter who is reading the package's index before installing it.

  ASSIGNED AGENT. This record's work is documentation and belongs to the documentation
  author, on the precedent of GE-120g-3 in this same tree. The field is left unset here
  because assigned_agent is the IT PO's to set; it is named so the routing is not
  guessed.

  THE AGREEMENT CLAUSE IS WHAT STOPS THIS BEING PROSE, AND THE COMPONENT HAS AN
  ANTI-PRECEDENT FOR IT. Every other clause here is discharged by writing sentences. This
  component has already recorded a check documented as taking a remediation action its
  own code never takes, believed by authors for months, and a page that states an
  enforcement level the running entry does not carry. A documented-but-false rule is worse
  than no rule, because the reader stops checking.

  NAMED MUTATION FOR THE AGREEMENT CLAUSE — EXECUTE IT, DO NOT DESCRIBE IT. INJECTION:
  leave the page as written and remove one of the five entries from the running list.
  Under that injection the page says a check is reached that nothing reaches, and this
  clause must go RED and return to green on revert. The mirror injection is equally valid
  and worth running: leave the list alone and change the page's statement about one check.
  Either divergence must be caught, because the defect is the gap and not its direction.

  SECOND NAMED MUTATION, FOR THE NO-SECOND-SOURCE CLAUSE. INJECTION: state a check's
  status on the page in a form the reconciliation does not consult and cannot contradict —
  free prose beside the entry rather than the statement the reconciliation reads. Under
  that injection every other clause stays green and only this one goes red. That is the
  shape by which a page drifts back into being a fifth independent signal, which is the
  exact thing this tree exists to end.

  NO COUNT MAY APPEAR IN THE TEXT THIS RECORD PRODUCES, beyond figures that carry the date
  and the state they were measured at. The unregistered population moved three times in a
  single day. A page stating how many checks are unreached is stale within the week; a
  page stating, per check, whether that check is reached, is maintained by its own
  agreement clause.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's fields.

  ---- IT PO ENRICHMENT, 2026-09-14 ----

  ROUTING TAKEN AS THE RECORD ASKED. assigned_agent: documentation-expert, on the
  GE-120g-3 precedent in this tree, which carries the same value — confirmed by reading
  that record rather than by assuming the convention.

  test_required IS NOT SET TO false, DELIBERATELY. A docs-target record would normally
  take it, and the S7b documentation trigger on the parent (reference-doc) is satisfied
  by this record's existence. But the BA's coverage note singles out the agreement
  clause as exercisable, and the record's three named mutations are all executable
  against two real artifacts. Setting test_required: false would have discarded exactly
  the clause that stops this being prose, so a test_spec was authored instead. The
  documentation author writes the page; the agreement and mutation cases are a
  test-writer surface over the page and the manifest, and should be dispatched as such
  rather than expected from documentation-expert.

  HOW EVERY NAME IN it_requirements WAS VERIFIED. All five artifacts named as the
  descriptive-versus-executing surfaces were opened in this worktree on 2026-09-14:
  templates/scripts/commit_guardian/README.md, .../config.py,
  .../commit_guardian.json (38 top-level keys, 62-member hooks_manifest.hooks),
  templates/scripts/precommit-autofix.json, and both documentation pages
  (docs/pre-commit-hooks.md, docs/how-to/managing-pre-commit-hooks.md). The two
  qualifications the page must carry about the newly registered five were measured, not
  inferred: test_fixture_bloat is absent from the 38 top-level keys and
  check_test_fixture_bloat.py reads load_config().get("test_fixture_bloat", {}) then
  config.get("enabled", False), so it is inert; and the manifest's stages today are
  pre-commit (60), commit-msg (1) and manual (1), so post-merge would be the first of
  its kind and depends on a shim that install_pre_commit_shims.py writes from the
  generated .pre-commit-config.yaml. No configuration key is asserted to exist anywhere
  in this enrichment.
