title: "The unbuildable share is grouped by reason, largest group first, and the groups add up"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a backlog containing requirements the automation cannot build for several
    different reasons — a craft it does not have, a kind of artifact with no defined
    proof, and a declaration it cannot resolve,
  When the buildability report is produced,
  Then the requirements it cannot build are grouped by the reason it cannot build them,
  And each group names the specific craft or kind of artifact involved, not just the
    category of reason,
  And each group states how many requirements are waiting on it,
  And the groups are ordered largest first, so the single change that would unblock the
    most work is the first thing read.

  Given the same report,
  When the group sizes are added together,
  Then they equal the total the report gave for requirements it cannot build — every
    such requirement appears in exactly one group, none is counted twice and none is
    left out.

  Given a backlog in which the largest reason is a craft the automation does not have,
  When that craft is added and the report is produced again,
  Then that group is gone from the report and the buildable total has risen by its
    size — so the report can be used to decide what to build next and to check
    afterwards that it worked.
depends_on: [BO-3500d]
