id: ACS-1300
components:
  - ac_store
title: "Trust the link between a requirement and the tests that prove it"
component: ac-store
level: L0
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  Proof that already exists is on the record, and what the record claims is real.

  A requirement can be genuinely proven by a test that passes today and still show
  no proof at all, and it can point at a test that no longer exists. Every honesty
  check downstream reads that link, so wherever it is wrong the check answers
  confidently from a false premise. This goal makes the link match reality: proof
  that exists is credited, proof that has vanished is no longer claimed, and the
  same accuracy holds for work that never passed through the usual delivery route.
  Restoring a link is never the same act as awarding a done badge — that decision
  stays exactly where it is today, behind its own evidence.
