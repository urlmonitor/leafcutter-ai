roadmap_phase: phase_3
criteria: |
  Each changelog entry connects to the L0 goal and L1 features it delivers.

  Readers see customer value in the changelog, not a flat list of commits.
  Every entry traces back to the goal it advances and the features it
  shipped, so a package consumer or project owner understands the purpose
  of the release at a glance.
