title: "Epic folder includes a Master_Plan.md so /build-feature can drive it"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given goal_to_epic.py has assembled an EPIC folder with numbered ticket files,
  When the epic folder assembly step completes,
  Then the folder also contains a Master_Plan.md file
  And Master_Plan.md includes:
    - The epic name and source AC id
    - The goal AC's criteria text (purpose statement)
    - An ordered list of all sub-ticket filenames with their titles
    - The dependency graph edges expressed as depends_on per ticket
  And /build-feature <EPIC-Name> accepts the folder without error
  And ticket-supervisor can read Master_Plan.md to determine sub-ticket inventory.
