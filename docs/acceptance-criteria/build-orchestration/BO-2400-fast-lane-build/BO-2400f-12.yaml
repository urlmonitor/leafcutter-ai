id: BO-2400f-12
components:
  - build_orchestration
title: "Refuse an unbuildable resolved set up front, naming what cannot be made and why"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run has resolved the connected build set for the acceptance
    criterion the operator named,
  When the run examines that set — before it claims any acceptance criterion, and
    before it dispatches the first build agent of the run,
  Then it decides, for each member of the set, whether the run's own phase roster
    contains a phase that produces the deliverable that member declares and a phase
    that produces the proof that member's done-obligation requires,
  And when every member is producible the run continues unchanged, so this decision
    adds no ending to a set the lane can build.

  Given a resolved set with at least one member the roster cannot produce — today that
    is a criterion whose declared proof is not a passing covering test
    (test_required: false), or one whose declared producer is an agent the roster does
    not contain, because the roster produces exactly one kind of deliverable: source
    and test code proved by a passing covering test,
  When the run reaches that decision,
  Then the run ends there with a refusal,
  And the refusal names every unproducible member individually — its id, the
    deliverable or the producer it declares, and the fact that this run has no phase
    that produces it — so the operator reads which criterion cannot be made and why,
    rather than a message about a missing test,
  And the refusal is the run's terminal outcome, reported as a refusal: it is not
    reported as a successful run, and it never asserts that a pull request was opened,
  And at the moment the refusal is issued no build agent has been dispatched, no
    acceptance criterion has been claimed, and no file in the repository has been
    changed by the run — so the operator has paid for resolution and nothing more.

  Given the same resolved set,
  When the run refuses,
  Then it refuses the whole set: it does not drop the unproducible members and build
    the remainder, and it does not build the remainder and report a partial success,
  And it does not quietly narrow what it was asked to build, because a member removed
    from the set and left todo is indistinguishable, from the store, from a member that
    was never asked for.

  Given a resolved set containing a member the roster cannot produce,
  When this run's correct ending is judged,
  Then that ending is the pre-work refusal above, and not a run that proceeds to its
    finish-time done transition and fails there,
  And BO-2400f-9's unconditional "every built acceptance criterion ends done", together
    with its guard BO-2400f-9-i, is narrowed to sets every member of which the roster
    can produce — where the two readings differ for an unproducible member, this
    criterion governs,
  And the late ending those two produce today — a stale-todo failure raised after the
    test-writer and the coder have both run — does not satisfy this criterion, whatever
    the message says.
