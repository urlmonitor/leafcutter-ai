it_requirements:
  - "THE SHARED MODULE MUST BE IN THE BUILD DEPLOY MANIFEST FOR ITS DIRECTORY, AND WHICH MANIFEST DEPENDS ON WHERE IT LIVES. Name the entry in the implementation, do not leave it implicit. (a) If the resolver ships under templates/scripts/commit_guardian/, it deploys wholesale via build_commit_guardian's directory copy and needs NO new manifest line — the precedent is BP-1100g-4, recorded in scripts/build_phases.py's decision history — but the deployed scripts/knowledge_query.py must then resolve it from the deployed commit_guardian directory, which is a sys.path insertion of the kind check_done_proof.py already does for scripts/ac_store/. (b) If it ships as a scripts/ sibling of knowledge_query.py — the precedent is scripts/knowledge_frontmatter_reader.py, added for KM-KGS-100a-3-xi — its filename MUST be added in TWO places: the deploy_scripts list inside build_workflow_tools() in scripts/build_phases_workflows.py, and the script-name tuple inside _manifest_workflow_tool_scripts() in scripts/build_phases_knowledge.py. _guard_source_paths_workflow_tools delegates to the second, and the manifest/deploy parity guard (test_guard_source_paths_match_deployable_set) fails when the two disagree. The deployed commit-guardian hook must then reach it, which is again a sys.path question and not a free import."
  - "THE MANIFEST OBLIGATION IS PROVEN BY RUNNING THE DEPLOYED HOOK, NEVER BY THE UNIT TESTS. Unit tests import from the source tree and are structurally blind to a missing manifest entry — they were green throughout the window in which GE-118c's config/doc_types.json was absent from the manifest and the deployed guard crashed in a consumer install. The proof is: build.py into a temp target directory that is NOT inside this repository, then invoke BOTH deployed entry points as fresh subprocesses and assert neither emits ModuleNotFoundError on any stream. A target inside this repository is the self-hosting mask GE-118c's reopening note describes; it cannot distinguish the two failure modes."
  - "THE AGREEMENT MUST BE PROVEN BEHAVIOURALLY, NOT BY GREP (CLAUDE.md, 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep'). A test that asserts both call sites mention the helper's name passes on two independent copies that both happen to import it, and on dead code. The required proof is: admit a further shape at the resolver's SINGLE accepted-shape declaration point at runtime — with no edit to either consumer — and observe both consumers resolve the further shape in their own outputs. Two copies make that test fail; it is the only arm that cannot be satisfied by coincidence."
  - "STATE THE SINGLE PATCH POINT AS AN INTERFACE PROPERTY, BECAUSE THE TEST DEPENDS ON IT. The accepted-shape set must be reachable and extensible from one object, so the third-shape arm is a single in-process substitution rather than a source edit. If admitting a shape requires touching more than one place, the arrangement does not have the property this record asserts, whatever the code looks like."
  - "AGREEMENT IS ON THE ORDERED LIST, NOT THE SET. Both consumers must produce the same path strings in the same order from the same field value, so that a document declaring two relationships is two relationships to both, in the order the author wrote them."
  - "DO NOT ROUTE check_adr_cross_reference._doc_mentions_adr THROUGH THE RESOLVER. It reads related_docs by case-insensitive substring match over the whole file and never indexes into an element, so it is unaffected today and must remain so. Its present behaviour — matching an ADR id that appears anywhere in the document, including in prose outside related_docs — is the observable that proves it was left alone."
  - "SOURCE-VERSUS-BUILD-OUTPUT PARITY (ADR-001). templates/scripts/commit_guardian/ is the source for consumer one; scripts/knowledge_query.py is itself the source for consumer two and is copied verbatim. Run build.py after editing and confirm the deployed copies match, or the next build silently reverts half the change."
  - "ERROR-HANDLING POLICY APPLIES UNCHANGED (CLAUDE.md Rules 1-4) in both consumers."
test_spec:
  - name: test_ge_118f_both_consumers_resolve_one_field_value_to_the_same_ordered_path_list
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "One field value holding a bare entry and a labelled entry. Assert the guard's list of paths-to-check and the map builder's list of edge targets are equal AND in the same order. Set equality is not sufficient — order is what makes 'the document declares these two relationships, in this order' the same statement in both components."
  - name: test_ge_118f_admitting_a_further_shape_at_the_single_declaration_point_moves_both_consumers
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: "THE ONLY ARM THAT CANNOT PASS BY COINCIDENCE. Substitute the resolver's one accepted-shape declaration in process to admit a third shape, with no edit to either consumer, then re-run the comparison: both must now resolve the third shape. Assert the pre-substitution baseline refuses it in both, so the test proves movement rather than a pre-existing accept. If either consumer holds its own copy of the rule, only one moves and this fails — which is the point."
  - name: test_ge_118f_deployed_layout_both_consumers_import_the_resolver_from_a_target_outside_this_repo
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: ".leafcutter/scripts/commit_guardian/run_hook.py check_doc_frontmatter.py and scripts/knowledge_query.py"
    description: "THE DEPLOY-MANIFEST OBLIGATION, PROVEN THE ONLY WAY IT CAN BE. Run build.py --target-dir into a temp directory outside this repository, then invoke the deployed hook and the deployed knowledge_query.py as separate fresh subprocesses against a document carrying a labelled entry. Assert both exit as expected and that neither stream contains ModuleNotFoundError or ImportError. Running against this repository's own .leafcutter/ passes while the manifest entry is missing, which is exactly how GE-118c was reopened."
  - name: test_ge_118f_adr_cross_reference_still_matches_by_whole_file_substring
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: boundary
    description: "The third consumer must stay unaffected. Assert _doc_mentions_adr returns True for an ADR id that appears only in the document's prose and never in related_docs — a behaviour a resolver-backed implementation would lose. This is a behavioural check that it was not rewired, not a grep for an import."
test_rationale: |
  Two independent implementations satisfy every other test in this feature on
  the day they are written, so the coverage here is built around the two things
  that distinguish one routine from two copies that currently agree.

  The third-shape arm is the load-bearing one. Comparing today's two resolvers
  on today's two shapes passes whenever the copies agree, which they will. The
  substitution arm asserts a baseline refusal in both consumers, applies one
  in-process change at one declaration point, and asserts both consumers moved —
  a property no amount of source-text inspection can establish, and one that
  fails loudly if a second copy exists. A test that greps both call sites for
  the helper's name is explicitly not acceptable: it passes on dead code and on
  two copies that both import a helper neither actually uses.

  The deployed arm is separate from the integration arm for the reason recorded
  in GE-118c's reopening note: unit tests import from the source tree, so a
  module missing from the deploy manifest is invisible to them, and running the
  deployed hook inside this repository is equally blind because the package IS
  the git root here. Only a target directory outside this repository can tell a
  reachable helper from an unreachable one.
delivers_to:
  agent: python-coder
  contract: "STEP 3 — the resolver, now importable from BOTH deployed locations, with its accepted-shape set extensible at one declaration point, and with the deploy-manifest entry for its directory actually added. KM-KGS-100d-3 consumes this unchanged in scripts/knowledge_query.py's extract_edges, in place of the isinstance(item, str) test; it inherits the deployed reachability proved here and must not re-derive the shape rule."
