# Continuous-integration gate for leafcutter-ai.
#
# Runs on every push to main and every PR targeting main. Three jobs:
#
#   lint       — ruff check over scripts/, tests/, unit_tests/ (config: ruff.toml).
#                BLOCKING. The templates/ source tree is excluded (see ruff.toml).
#
#   test       — full pytest suite over tests/ and unit_tests/. INFORMATIONAL
#                ONLY (continue-on-error) FOR NOW. The build step
#                (python scripts/build.py --target-dir .) runs before pytest
#                because build.py's install_shims() creates symlinks at
#                scripts/commit_guardian/, scripts/doc_compliance/, and
#                scripts/feedback/ pointing into .leafcutter/scripts/. Tests
#                import from those paths at startup; without the build step they
#                fail at import on a fresh clone (ADR-016). The shim fix (this
#                job's reason for existing) is complete, but the suite is NOT yet
#                green on a fresh checkout: ~4 collection errors (test files for
#                unbuilt modules: check_test_fixture_bloat, link_feedback,
#                transform_decision_history, known_failing_tests) plus pre-existing
#                failures keep it red. Until those are resolved, this job runs
#                informationally so it surfaces results without blocking merges.
#                Promote to BLOCKING (drop continue-on-error) once the suite is
#                green — that is the BP-1200b deliverable, tracked separately.
#
#   typecheck  — mypy over the .py files changed in a PR (non-strict,
#                --ignore-missing-imports, since the codebase has no type config
#                yet). INFORMATIONAL ONLY (continue-on-error): the codebase is
#                untyped, so touching any file surfaces dozens of pre-existing
#                type errors unrelated to the change. The job surfaces type
#                findings on changed files without blocking the merge. Promote
#                to blocking once the codebase is annotated. On direct pushes
#                there is no diff base, so it is a no-op.
#
# Dependencies are pinned in requirements-dev.txt.

name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check scripts tests unit_tests

  component-vocab:
    name: Component vocab style (components.json)
    runs-on: ubuntu-latest
    # BLOCKING. Every `components` LIST value must be a canonical id in
    # docs/components.json (underscore-case). Scope depends on the event:
    #   - pull_request : only files CHANGED vs the base (diff-scoped), so a clean
    #     PR is not failed for pre-existing drift in the base it didn't introduce;
    #     a PR that *adds* drift still has that file in its diff and is caught.
    #   - push (to main): the FULL tree, guaranteeing main never carries an
    #     off-registry value (the merge-vector backstop that pre-commit can't cover).
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history + base ref for the diff on pull_request events.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Check component vocabulary (PR — changed files only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python scripts/check_component_vocab.py --changed "origin/${{ github.base_ref }}"

      - name: Check component vocabulary (push — full tree)
        if: github.event_name != 'pull_request'
        run: python scripts/check_component_vocab.py

  test:
    name: Test suite (pytest)
    runs-on: ubuntu-latest
    # BLOCKING gate (BP-1200b): the suite is green on a fresh checkout under
    # AC_ENFORCE_STRICT=1 (build step + install_shims, then strict pytest), so a
    # PR carrying a failing test now fails this check and cannot merge. There is
    # NO continue-on-error — dropping it is the whole point of this job.
    # The job name "Test suite (pytest)" is the stable contract referenced by the
    # branch-protection required-status-checks list (BP-1200c) — do NOT rename it.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build — run install_shims to create scripts/ symlinks
        # Required before pytest: install_shims() creates symlinks at
        # scripts/commit_guardian/, scripts/doc_compliance/, and
        # scripts/feedback/ pointing into .leafcutter/scripts/. Tests
        # add those paths to sys.path at import time (ADR-016).
        run: python scripts/build.py --target-dir .

      - name: Run test suite
        env:
          # Disable AC-enforcement xfail-masking on the gate so genuinely-failing
          # tests surface as real failures (not downgraded to xfail when their
          # covering AC is not "done"). Keeps the CI signal trustworthy — a
          # prerequisite for making this job blocking (BP-1200b).
          # (EPIC-RedTestClusterRepair ticket 09.)
          AC_ENFORCE_STRICT: "1"
        run: python -m pytest tests/ unit_tests/ -q --continue-on-collection-errors

  done-proof:
    name: Proof-of-done coverage check (BO-2500b)
    runs-on: ubuntu-latest
    # Blocking gate (BO-2500b-3): diff-scoped ci-changed mode evaluates only ACs
    # changed in the PR, making this safe to require without failing on pre-existing
    # done ACs that predate the covers-tag mandate.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so git diff <base>...HEAD is reachable.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build — run install_shims to create scripts/ symlinks
        # Required before invoking check_done_proof.py: install_shims() creates
        # the symlinks at scripts/commit_guardian/ etc. so the hook's imports
        # resolve correctly on a fresh checkout (ADR-016).
        run: python scripts/build.py --target-dir .

      - name: Run proof-of-done check (CI-changed mode)
        run: python scripts/commit_guardian/check_done_proof.py --mode ci-changed --base origin/${{ github.base_ref }}

  ac-store-valid:
    name: AC store valid
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # BLOCKING (ACS-200g). Until this job existed, NOTHING in CI read
    # docs/acceptance-criteria/ — the AC guardrails lived only in
    # .pre-commit-config.yaml, so a contributor whose local hooks were absent
    # (see setup_ticket_worktree.py, which installs shims into the main repo
    # rather than the new worktree) could merge a structurally invalid
    # acceptance criterion with every required check green. The AC store is the
    # input to the whole build pipeline, so a bad record there propagates into
    # tickets, code and sign-offs.
    #
    # Diff-scoped to the PR (ACS-200g-2): the store currently has 57 orphaned
    # children, so a whole-store gate applied per-PR would fail every
    # contributor on day one and get switched off. Touch a broken record and
    # you own it; leave it alone and it is not your failure.
    #
    # NOT YET IMPLEMENTED — ACS-200h (whole-store run on push to main as a
    # merge-vector backstop). It is deliberately omitted rather than added
    # informationally: it would be red from the first run because of those 57
    # pre-existing orphans. Land it once the store is reconciled.
    #
    # WHY THE reset --soft: these hooks read their file set from
    # `git diff --cached --name-only --diff-filter=AM` (see
    # _get_staged_ac_paths in check_ac_schema.py) and are documented fail-open
    # — with a clean index they validate NOTHING and exit 0. In a CI checkout
    # the PR's files are committed, not staged, so `git add` is a no-op and
    # invoking the hooks with file arguments silently checks nothing. Moving
    # HEAD back to the base ref makes exactly the PR's added/modified files
    # appear staged; the working tree is untouched. Verified both ways: with
    # the reset a deliberately malformed record fails the job, without it the
    # same record passes.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so the base ref is reachable for the reset.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build — deploy .leafcutter so the guardian hooks resolve
        # install_shims() creates .pre-commit-config.yaml and the
        # scripts/commit_guardian symlink, both of which the hooks below need
        # on a fresh checkout (ADR-016).
        run: python scripts/build.py --target-dir .

      - name: Stage the PR's changes so the guardians can see them
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git reset --soft "origin/${{ github.base_ref }}"

      - name: Check AC store (PR — changed records only)
        # Run through pre-commit rather than calling the scripts directly, so
        # the merge-time and commit-time rule sets are literally the same
        # config and cannot drift apart (ACS-200i). Each hook applies its own
        # files: filter, so non-AC files in the diff are ignored.
        run: |
          pre-commit run check-ac-schema
          pre-commit run check-ac-tree-limits
          pre-commit run check-ac-governance
          pre-commit run check-ac-parent-covered-by
          pre-commit run check-ac-circular-deps
          pre-commit run check-ac-pattern-refs

  changelog-presence:
    name: "Changelog entry present"
    runs-on: ubuntu-latest
    # Blocking release-completeness gate: fails when a PR changes releasable
    # content (files outside of changelogs/, tickets/, docs/acceptance-criteria/)
    # but adds no changelogs/*.md entry. Without this gate, releasable work can
    # merge without triggering the auto-release version bump in compute_next_version.py.
    # Runs ONLY on pull_request — on direct pushes to main a changelog entry is
    # already expected to be present (it was required before merge).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so git diff <base>...HEAD is reachable.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # No pip install step: check_changelog_presence.py is stdlib-only.

      - name: Fetch base branch for three-dot diff
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Check changelog presence
        run: python scripts/release/check_changelog_presence.py --base "origin/${{ github.base_ref }}"

  typecheck:
    name: Type-check changed files (mypy, informational)
    runs-on: ubuntu-latest
    # Informational only — see header. Surfaces type findings without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the PR base commit to diff against.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: mypy on changed Python files
        # On push events github.base_ref is empty and this becomes a no-op.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only --diff-filter=ACM "origin/${{ github.base_ref }}"...HEAD -- 'scripts/**/*.py' 'tests/**/*.py' 'unit_tests/**/*.py')
          if [ -z "$CHANGED" ]; then
            echo "No changed Python files under scripts/, tests/, or unit_tests/ — skipping mypy."
            exit 0
          fi
          echo "Type-checking changed files:"
          echo "$CHANGED"
          # --explicit-package-bases avoids "source file found twice" errors from
          # the flat sys.path-based layout (scripts/ is not an installed package).
          mypy --ignore-missing-imports --explicit-package-bases --no-error-summary $CHANGED
