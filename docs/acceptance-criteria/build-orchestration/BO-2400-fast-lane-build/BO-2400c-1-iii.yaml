test_rationale: |
  Every scenario here is a workflow gate, and the only instrument that can see one is a
  run. Execute the lane under unit_tests/_workflow_engine_harness.py with
  run_workflow_under_e2 and label_responses, and assert on the RECORDED dispatches'
  prompt text and on the run's TERMINAL PAYLOAD. A test that greps
  templates/workflows-js/fast-lane-ship.js for a string, a label, an agent type or a
  statement order is not acceptable evidence and must be rejected at review: it passes
  unchanged on dead code, and dead-but-green is the entire documented history of this
  feature — roughly 25 green unit tests and a reference doc across a month in which the
  layer never ran once.

  The three scenarios need three different stubs, and the second and third are the ones
  the pre-amendment tests never had:

  Stub the assembling dispatch to return a well-formed bundle and assert both
  context-carrying prompts contain it verbatim.

  Stub it to return {"obtained": true, "bundle": "file:/tmp/…/bundle_output.txt"} —
  the literal shape observed in run wf_bd4984e8-438 — and assert the run halts, records
  no test-writer or coder dispatch, and that its terminal message says the assembly
  succeeded, reports the size and location it was given, and says the lane cannot follow
  a reference. A test that only asserts the run halted passes on today's code, which
  halts for the wrong stated reason; the assertion has to be on the WORDING that
  distinguishes the three cases.

  Stub it three ways in turn — nothing back, a reference back, content back with the
  breakpoint marker missing — and assert the three terminal messages differ from one
  another. Asserting each in isolation lets one message that happens to satisfy all three
  string checks pass all three tests.

  The size expectation is prompt text and is proved by the recorded assembling dispatch's
  prompt; it is the one assertion here that a grep could also make, and it is worth
  almost nothing on its own. The payload is made small by BO-2400c-1-vi, and that is
  where the load-bearing evidence for smallness lives.
