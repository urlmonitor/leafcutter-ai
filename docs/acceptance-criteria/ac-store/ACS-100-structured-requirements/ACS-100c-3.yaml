title: "L0 and L1 ACs are authored by product-owner-class agents only"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a new AC file is created with level L0 or L1,
  When the AC validator checks the origin_agent field,
  Then it accepts values from the product-owner class
    (e.g., "product-owner-v3", "BrainCandy"),
  And it rejects origin_agent values from the analyst class
    (e.g., "business-analyst-v3") with an error stating
    "L0/L1 ACs must be authored by a product-owner-class agent",
  And L2/L3 ACs with origin_agent from the analyst class pass validation.
