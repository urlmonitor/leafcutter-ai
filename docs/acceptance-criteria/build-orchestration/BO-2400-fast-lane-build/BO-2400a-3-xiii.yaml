title: "In a mixed batch, a criterion whose new tests all pass is still mutation-proven, even though another criterion supplies the red baseline"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a batch of TKT-600a-1, with 2 red and 2 green newly-added covering tests, and
    UXP-511, whose 3 newly-added covering tests are all green at baseline,
  When the red-baseline gate produces its verdict,
  Then a red baseline is established by TKT-600a-1, its route is red-first, and its 2
    green tests are reported green_at_baseline as BO-2400a-3-v states,
  And UXP-511 is classified as a test backfill and must pass the mutation proof of
    BO-2400a-3-x before the coder is dispatched,
  And the red tests of TKT-600a-1 are not accepted as evidence about UXP-511's tests.

  Given UXP-511's mutation proof halts with tests_survive_mutation in that mixed batch,
  When the run ends,
  Then the coder is not dispatched for the batch, and the halt names UXP-511 even
    though TKT-600a-1's red baseline was established.

  Given a criterion with at least one red newly-added covering test,
  When the gate assigns its proof route,
  Then the route is red-first and that criterion is never sent to the mutation proof.
depends_on: [BO-2400a-3, BO-2400a-3-ix, BO-2400a-3-v]
