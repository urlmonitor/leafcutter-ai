    type: integration
    angle: reachability
    description: "The three-file staged set of the first arm, staged in a throwaway git repository and checked through the canonical pre-commit entry point as a subprocess, writes one error-stream notice naming the check, the total 3 withheld across 2 files, and for each of the two reduced files its repository-relative path, its own withheld count and the stable reduction name"
  - name: test_reported_control_file_is_absent_from_the_notice_and_still_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "In the same run, the value in src/app.py is reported as a finding in the existing report format and src/app.py appears nowhere in the notice — the control that fails an implementation announcing every staged file"
  - name: test_marker_embedded_in_each_withheld_value_appears_on_neither_stream
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A distinctive marker embedded inside each of the three withheld values appears on neither the error stream nor the output stream, and neither stream carries the matched line or any excerpt of it — asserted by ABSENCE of the marker, never by matching expected notice text"
  - name: test_reduced_only_run_emits_the_notice_and_exits_zero
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A staged set of only the two reduced files, 3 findings withheld and nothing reported, writes the notice and exits 0 — the arm that exercises the early-return path main() takes today before producing any output"
  - name: test_single_withheld_finding_uses_the_same_notice_shape
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "One withheld finding in one reduced file still produces the header, the exact total of 1, one per-file line and the reduction name — the one-item boundary of the same shape, not a special-cased sentence"
  - name: test_notice_reaches_the_error_stream_from_the_deployed_copy
    target_dir: unit_tests/commit_guardian/
    framework: unittest
