roadmap_phase: phase_1
criteria: |
  Every workflow, skill and agent gets its workspace the same way.

  Whether the request comes from a long-running build, a quick fix, a requirements
  session, a skill or a person at the keyboard, the workspace is made by the same single,
  standalone means and comes out the same shape: the same starting point, the same
  set-up, and the same piece of work always recognised as the same workspace. Making a
  workspace is never left to an assistant's judgement or improvised step by step.
