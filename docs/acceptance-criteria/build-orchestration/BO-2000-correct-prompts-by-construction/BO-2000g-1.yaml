criteria: |
  Given the Comments-entry examples that agent templates and skills give an agent to
    write as its own phase sign-off, including at minimum:
      - the python-coder template's red-baseline sign-off example, whose body today
        opens with `red_baseline_results:` and carries no feedback-id line;
      - the test-writer template's non-code skip entry
        ("no production-code agent in this ticket — no tests required");
      - the status-checker template's auto-close entry
        ("auto-closed: matched merge commit <sha>");
      - the signoff skill's own worked examples: the research-agent entry in the clean
        sign-off's "before" excerpt, the python-coder and pr-reviewer entries in the
        failed-path example, and the architect-review entry in the handoff example,
  When an agent reads any one of those examples,
  Then the first line of the example's body (the line directly under its heading) is a
    `feedback-id:` line,
  And that line's value is either a real-id placeholder spelling from the signoff
    skill's documented list (telling the agent to put the id the feedback submission
    step printed), or the failure fallback exactly as the signoff skill documents it
    (today `feedback-id: (submit-failed)`),
  And every body line the example carried before the change (for example
    `red_baseline_results:` and its test entries) is still present, in its original
    order, below the feedback-id line,
  And no phase sign-off example uses `feedback-id: (not-a-signoff)`.

  Given the signoff skill, which today documents no real-id placeholder spelling,
  When an agent reads it,
  Then it holds exactly one documented list of the real-id placeholder spellings that a
    copyable example may use,
  And that list includes every spelling a shipped example already uses --
    `fb_<date>_<short-hash>` (documentation-verifier, live-surface-tester,
    user-surface-smoker), `<fb_id>` (the write-c4-diagram skill) and
    `fb_YYYY-MM-DD_XXXXXXXX` (test-writer) -- so none of those examples is rewritten
    for its spelling,
  And every copyable example in the agent templates and skills that carries a real-id
    placeholder uses a spelling from that list.

  Given the three heading examples that are shown only to illustrate the heading schema
    and are not entries to copy -- the signoff skill's heading-schema block
    (`### YYYY-MM-DD HH:MM — <agent-name> (status: ok|blocker|question|handoff)`), the
    ticket-authoring skill's Comments-section heading line, and the building-epics
    skill's routing illustration
    (`### YYYY-MM-DD HH:MM — <agent> (status: ok|handoff|blocker|question)`),
  When an agent reads any one of them,
  Then it carries the explicit heading-schema-illustration mark that the signoff skill
    defines, so a reader can tell it apart from an entry to copy.

  Given live-surface-tester's skipped-run sign-off example, whose heading today carries
    `(status: skipped)`, which is not one of the signoff skill's four status values
    (ok, blocker, question, handoff),
  When an agent reads it,
  Then its heading carries `(status: ok)`,
  And its body still states that the phase was skipped and why, in its existing
    `Skipped: <reason ...>` line below the feedback-id line,
  And no other live-surface-tester example changes its status value.
depends_on:
