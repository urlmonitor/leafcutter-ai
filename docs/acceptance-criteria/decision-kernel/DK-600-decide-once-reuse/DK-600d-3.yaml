assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
  - '`python -m kernel decisions publish` is the only writer of docs/decisions/ (ADR-060): it runs
    only when a person invokes it, validates everything before writing, writes atomically, and exits
    0 ok, 3 refused (problems listed, nothing written), 5 environment error.'
  - 'Publishing is idempotent: the same run published twice reports already_present and leaves the
    index byte-identical.'
  - The index is generated, never hand-edited, and `decisions validate` fails on a stale index.
  - 'This L2 has L3 children, so done_proof treats it as a composite unless it carries its own covers
    tag: tag the tests of its own clauses so it proves itself, not only through its children.'
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
test_spec:
  - name: test_a_staged_record_is_published_with_an_index
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: real_artifact
    description: 'EXISTS (tests/kernel/memory/test_publish_cli.py::TestPublish::test_a_staged_record_is_published_with_an_index):
      record text equals the staged text; index written; store validates'
    covers:
      - DK-600d-3
  - name: test_publishing_twice_is_idempotent
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_publish_cli.py::TestPublish::test_publishing_twice_is_idempotent):
      second publish: already_present, index unchanged'
    covers:
      - DK-600d-3
  - name: test_publish_then_validate_through_the_cli
    target_dir: tests/kernel/memory/
    framework: unittest
    type: integration
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_publish_cli.py::TestCli::test_publish_then_validate_through_the_cli):
      validate exits 0 with the new record counted'
    covers:
      - DK-600d-3
  - name: test_publish_files_a_valid_record_and_the_index
    target_dir: tests/kernel/memory/
    framework: unittest
    type: integration
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_learning_loop_e2e.py::TestRunOneStagesARecordThatPublishFiles::test_publish_files_a_valid_record_and_the_index):
      validate reports ok true and records 1'
    covers:
      - DK-600d-3
