notes: |
  WHY A COMPARISON AND NOT THREE EDITS. Three surfaces answering the same
  question by three independently maintained descriptions is the state that
  produced this defect: two of them were changed and one was not, and nothing
  reported it. Aligning them once without a comparison leaves the same failure
  available tomorrow.

  THE COMPARISON MUST READ THE REAL SOURCES. A check that reads a convenience
  copy of any of the three descriptions can report agreement while the real ones
  disagree — the shape of EPIC-ComputedQualityGates FP-1, and the reason
  BP-1100g-1's last clause exists.

  THE LAST THEN CLAUSE IS THE POINT. A route may reach the right answer on a
  given example for the wrong reason; the requirement is that it asks the right
  question, because the wrong question is what silently produces the wrong
  answer on the next input.
