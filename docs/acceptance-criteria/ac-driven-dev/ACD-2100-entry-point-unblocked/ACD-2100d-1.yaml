notes: |
  THE MOTIVATING FACT, verified by the PO on 2026-08-25: the deployed workflow at
  leafcutter-ai/.leafcutter/workflows/plan-feature.js is STALE -- it carries no
  charter gate at all. The installed copy and the source copy are therefore
  observably different programs today, and nobody noticed because nothing compares
  their behaviour.

  THE LAST CLAUSE IS THE POINT OF THE RECORD. A test that diffs the two files, or
  checks a build manifest, passes on a deployed artifact that is byte-identical and
  still cannot run -- a missing dependency, a path that resolves differently in the
  deployed layout, a support file that was not copied. This repo has that failure
  twice over in CLAUDE.md ("New Hook / Gate Dependencies Must Be in the Build
  Deploy-Manifest" and the deployed-layout no-op trap), both of which were invisible
  to source-tree tests. Run the deployed artifact, in the deployed layout, in a
  fresh process.

  SAME STARTING DIRECTORY CONDITIONS matters because ACD-2100a's behaviours are
  directory-sensitive. Vary one thing: which copy is running.

  BOUNDARY WITH ITS SIBLINGS. This record does not restate what a, b or c require;
  it requires that the copy the user runs is the copy that does it. If a child here
  reads like "sibling behaviour X but in the deployed layout", it is duplicating
  coverage and splitting the evidence for one behaviour across two L1s.

  2026-08-25 (it-po): sized L because the deliverable is largely a harness that does not
  exist yet -- install into a temporary target, start a run there, and observe how far
  it got -- and that harness is what ACD-2100d-3 then reuses. SEQUENCING CAVEAT RAISED
  TO THE USER: this record's Then clause ("both runs reach the first question") cannot
  hold until ACD-2100a-3 and ACD-2100a-5 land, because the source copy halts at the
  charter gate today. depends_on carries only [ACD-2100d], and the build sequencer reads
  depends_on only (KI-ACD-015, open), so nothing stops this being scheduled first. The
  it-po does not own depends_on and has not edited it; the recommended edit is to add
  ACD-2100a-5 to this record's depends_on before the tree is approved.
