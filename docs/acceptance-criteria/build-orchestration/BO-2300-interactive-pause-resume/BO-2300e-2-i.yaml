  - reason: "it-po correction (2026-09-29, second pass): assigned_agent llm-expert -> python-coder, reversing this record's own earlier 2026-09-29 retarget above, and matching BO-2300e-2 (its parent, and the same file). That retarget followed the sibling 2026-07-20 precedent (\"retargeted to the E2 workflow ENGINE... assigned_agent python-coder -> llm-expert\") and flagged its own risk -- that llm-expert's registry entry does not list workflow JS as owned surface. The flag was right, and dispatching the work proved it. VERIFIED AGAINST config/agent_registry.json rather than taken on report: llm-expert's selection_criteria DSL trigger reads \"files_touched contains templates/agents/*.md OR files_touched contains templates/skills/*/SKILL.md OR files_touched contains templates/workflows/*.md\" -- three markdown surfaces -- and llm-expert DECLINED this work on exactly those charter grounds. templates/workflows/ holds command-prompt .md docs (build-ac.md, commit.md, plan.md, ...); templates/workflows-js/ holds the executable workflow bodies including plan-feature.js. Both directories exist and are distinct; their names differ by a suffix, and the 2026-07-20 amendment appears to have conflated the two. workflow-architect also declined, confirming no agent in the package is chartered for workflow-JS bodies. python-coder accepted and did the work because config/agent_registry.json gives it owns_file_extensions [\".py\", \".js\"]. That ownership is PROVISIONAL BY THE REGISTRY'S OWN ACCOUNT -- its owns_file_extensions_rationale reads \"'.js' is an EXPEDIENT, not a judgement that a Python agent is the right owner of JavaScript... The proper fix is a dedicated workflow-author agent, with ownership driven by per-consumer configuration rather than a hardcoded list; ACs for that are being authored. Revisit this entry when they land.\" Revisit this assignment when that agent lands. Criteria, it_requirements, test_spec and readiness unchanged. STALE POINTER FIXED IN THE SAME PASS: doc_links' templates/agents/llm-expert.md -> templates/agents/python-coder.md. That link was the IMPLEMENTER'S REFERENCE, not a subject of this criterion -- llm-expert appears nowhere in this record's criteria, notes or it_requirements, unlike templates/agents/command-step-runner.md, which IS a genuine subject (this AC's whole point is that agent's workspace-decline rule) and is therefore kept unchanged. llm-expert.md's own declared scope is \"LLM instructions inside agent templates, skill files, and slash-command prompts\"; this record edits an executable JS workflow body, so none of that craft applies and the python-coder template is the correct replacement rather than a retention or a removal. delivers_to is null and expects_from names only an ac_id on this record, so neither carried a stale agent name."
  - reason: "it-po done-reconciliation (2026-09-29): work_status todo -> done, with evidence, and implemented_by/covered_by wired. Implemented by commit 179d5245 \"fix(build-orchestration): dispatch pause-store work to a chartered runner (BO-2300e-2)\", which threaded authoringWorktreePath into peekPausedGateId()/resolveGate()/pauseAtGate() as an explicit function parameter (never a closure read, per this record's own it_requirement) and embedded it in each of the six pause-store dispatch prompts. implemented_by names the SOURCE FILE PATH, this store's actual convention for the field (config/ac_store_schema.json: \"Source file paths (optionally with #anchor) that implement this criterion\"; a sweep of every AC under docs/acceptance-criteria/ found no record carrying a bare commit SHA there), so the SHA is recorded here in prose rather than invented into the field. covered_by names unit_tests/workflows/test_bo_2300e_2_i.py, whose single test test_every_pause_store_call_site_supplies_a_workspace carries \"# covers: BO-2300e-2-i\" and checks all six labels INDIVIDUALLY (so a partial fix threading the parameter into only one of the three functions still fails), verified PASSED under AC_ENFORCE_STRICT=1 on 2026-09-29 via run_workflow_under_e2 against the real on-disk plan-feature.js. Both Then clauses are genuinely exercised: the first directly, and the second (\"command-step-runner is never asked to perform a pause-store operation without a named workspace\") as the exhaustive per-label form of the first. No clause is left uncovered."
