id: INF-600
title: "Understand any agent without reading its source"
component: infrastructure
level: L0
status: active
criteria: |
  Every agent describes itself completely enough that its full profile is assembled automatically.

  With 40+ agents in the system, no one can hold the full picture in their
  head. Any contributor, operator, or peer agent can look up a single agent
  and instantly see what it knows, what it does, who invokes it, what it
  produces, and how it fits into the wider pipeline. This profile is never
  hand-written -- it is generated from the same metadata the build system
  already uses, so it is always accurate and never stale. Adding a new agent
  automatically produces its card; changing an agent automatically updates it.
