assigned_agent: python-coder
estimated_complexity: L
declares_side_effect: false
it_requirements:
  reference_file_path: "scripts/build_phases.py"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/ -q"
  config_schema_fragment:
    type: object
    description: "The three sets this AC and BP-900g-5 together govern, named explicitly so an implementer cannot satisfy one by collapsing it into another. The whole defect class is these three being assumed equal while never being compared."
    required:
      - resolved_closure
      - deploy_declaration
      - guard_manifest
    properties:
      resolved_closure:
        type: array
        items:
          type: string
        description: "SET A — the transitive set of intra-package modules a deployed script actually resolves, DERIVED from the code by static analysis of imports, relative path construction, and dynamic loader calls. Never hand-maintained. This is the new artifact this AC introduces."
      deploy_declaration:
        type: array
        items:
          type: string
        description: "SET B — the deploy_map: what a phase declares it ships. Remains an explicit, human-readable declaration. It is CHECKED against set A, not generated from it."
      guard_manifest:
        type: array
        items:
          type: string
        description: "SET C — _manifest_ac_store_scripts: the guard's model of what has been deployed. Per BP-900g-5's fifth it_requirement this must derive FROM set B. It must never be the source set B is derived from."
      invariant:
        type: string
        description: "B must contain closure(A), enforced by a build failure; C is derived from B. Deriving B from A automatically, or deriving C from anything other than B, does not satisfy this AC."
  constraints:
    - "THE BINDING DIRECTION RULE (resolves the conflict the BA escalated). Three sets, two edges, and the direction of each edge is fixed. Edge 1: B must CONTAIN closure(A) — checked at build time, failing the build when it does not. Edge 2: C DERIVES FROM B — this is BP-900g-5's fifth it_requirement and it stays. What is FORBIDDEN: (a) generating B from A, which silently deploys whatever a typo'd import names and leaves BP-900g-9 with no declaration to check; (b) deriving the checker's view from B, which makes the guard and the thing it polices agree by construction and detect nothing — this is the failure the AC's own criteria name; (c) deriving C from A, which restores the divergence BP-900g-5 was closing. Full rationale in this AC's notes under IT-PO RULING."
    - "DERIVED MEANS DERIVED FROM THE CODE. The closure must be computed from what the deployed script resolves — import statements, paths built relative to __file__, and dynamic loader calls — not read from any list, map, allowlist, or annotation. The test that proves this is the newly-added-module case in BP-900g-8-i: add a module inside the test, have an already-deployed script resolve it, edit NO list, and require the build to either deploy it or fail naming it. An implementation that passes every other test and fails that one is an enumeration wearing the word 'derived'."
    - "TRANSITIVE, AND SAY SO IN THE FAILURE. The closure follows dependencies of dependencies. When it fails at the second hop the message must name the module that is actually missing, not only the top-level deployed script, or the author fixes the wrong hop."
    - "EVERY DEPLOY PHASE, NOT ONLY build_ac_store. n_location_rule is 'all': the live instance is in build_ac_store, but any phase in scripts/build_phases.py that ships intra-package Python modules is subject to the same closure. A fix scoped to the one phase where the defect was found reproduces the history the criteria cite — three prior instances, each fixed individually, each annotated with a warning comment, and a fourth still live."
    - "DO NOT SATISFY THIS BY ADDING _component_migration_map.py TO THE DEPLOY MAP. That makes the live symptom disappear and leaves the mechanism exactly as it was. Adding it is necessary and is not sufficient; the closure check must independently fail on a tree where it is withheld."
    - "OUT-OF-PACKAGE MODULES ARE NOT OURS TO SHIP. The standard library, installed third-party distributions, and host-project paths the consumer owns must produce no finding. A closure that demands the build ship the standard library gets an allowlist, and an allowlist is a hand-maintained list wearing a different name. Respect BP-900g-5's narrowed output-root prefix bound and keep BP-900g-6's negative-control tests green — that bound exists because BP-900g-4 mis-normalised a host-project path (debugging/scripts/...) into a deploy key."
    - "STATIC ANALYSIS HAS A KNOWN BLIND SPOT AND IT MUST BE DECLARED, NOT PAPERED OVER. A dynamic loader that builds a module path from a runtime value cannot always be resolved statically. Where the closure cannot decide, it must report the unresolvable reference for a human rather than assume it is external — an unknown silently classified as not-ours is the same fail-open in a new place. BP-900g-10 is the runtime backstop for whatever the closure still misses; it is not a licence for the closure to guess."
    - "IDEMPOTENCY AND BUDGET. The closure computation must be deterministic and byte-stable across runs on an unchanged tree, and must run inside the existing build preflight's budget — static analysis of the package's own Python files, no network, no per-module subprocess."
delivers_to:
  - agent: python-coder
    contract: "Two artifacts. (1) The derived transitive intra-package dependency closure — a function over the package tree returning, per deployed script, the set of intra-package modules it resolves, computed from the code and never from a list, together with the build-time check that set B (the deploy declaration) contains it. (2) The deployed-tree test harness: run `python scripts/build.py --target-dir <tmp>` into a temporary target and exercise the DEPLOYED copy in a genuinely fresh subprocess with the source tree off sys.path. Consumed by BP-900g-8-i (which drives three surface shapes through the same harness) and by BP-900g-10 (which removes a dependency from that same deployed tree and asserts the runtime behaviour). The harness is shared, not rebuilt per AC."
expects_from: null
test_spec:
  - name: test_bp_900g_8_derived_closure_includes_the_sibling_the_deploy_map_omits
    target_dir: unit_tests/
    framework: unittest
    type: unit
    angle: criterion
    description: "Compute the closure for scripts/ac_store/generate_ticket_from_ac.py from the code and assert _component_migration_map.py is in it, and that it is reported as NOT covered by the build_ac_store declaration. Asserts the closure's contents and the containment verdict — never that a name appears in a list literal in build_phases.py."
  - name: test_bp_900g_8_build_subprocess_blocks_when_a_resolved_dependency_is_withheld_from_the_deploy
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT with the must_block modifier, plus its paired control. Copy the package tree to a temp dir, withhold one intra-package dependency of a deployed script from the deploy declaration, run `python scripts/build.py --target-dir <tmp_target>` as a SUBPROCESS: assert non-zero exit and that the output names the deployed script, the missing dependency, and the phase that would have to carry it. Then run the SAME command against the unmodified tree: exit zero. Both halves through the same command — a positive-path build alone cannot tell a working guard from an absent one."
  - name: test_bp_900g_8_deployed_tree_contains_the_full_closure_of_every_deployed_script
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: deployed
    description: "Run build.py into a temp target, then walk the DEPLOYED tree (not the source tree) and assert that for every deployed Python script, every module in its derived closure is present in the deployed tree. The source tree contains every module by construction, so the same assertion made there is structurally incapable of failing — this is the BP-811 distinction between the copy tier and the reachability tier."
  - name: test_bp_900g_8_deployed_generate_ticket_cold_imports_in_a_fresh_subprocess
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "From the temp target produced by the harness, execute the DEPLOYED copy of generate_ticket_from_ac.py in a genuinely fresh `python` subprocess with the package source tree absent from sys.path, and assert it reaches its entry point without a ModuleNotFoundError. importlib.reload does NOT satisfy this: it re-executes inside an already-populated namespace and masks cold-import failures — that is exactly how the GenReviewFixes H-2 forward-reference NameError survived its tests."
test_rationale: |
  The defect is invisible to source-tree inspection by construction. In the package
  repo every sibling module resolves, so every direct-import test passes on a tree
  that ships broken. Three prior instances of this exact failure were each fixed
  individually and each annotated with a warning comment in the deploy map, and a
  fourth is live at HEAD — the convention was written down, in CLAUDE.md and in the
  map itself, and the defect shipped anyway. Only a test that inspects a produced
  deployed tree can fail on it, which is why entries 3 and 4 build into a temp target.

  Entry 4 is separated from entry 3 deliberately even though both use the same
  harness. Entry 3 asserts a FILE IS PRESENT; entry 4 asserts the module LOADS in a
  cold process. Those are different claims and this repo has been burned by the
  distinction twice: BP-811 (the file was copied to a path nothing invoked) and
  GenReviewFixes H-2 (the import failed only on true first import, which
  importlib.reload never performs).

  Entry 2 carries must_block because a preflight that cannot block is inert, and it
  carries its own positive control through the same command because a guard that fails
  every build also passes the must_block assertion.

  Entry 1 is the only unit-level entry and it exists to make the closure itself
  falsifiable — the containment verdict has to be wrong for the withheld-dependency
  case before the build failure means anything. It asserts on the computed closure, not
  on the presence of a name in build_phases.py; a grep-shaped assertion there would be
  green over a closure nothing consults.

  real_artifact and deployed are both charged, and criterion and reachability are the
  floor, which puts this AC exactly at the four-angle cap. `boundary` (one hop, two
  hops, not-ours) is deliberately pushed to BP-900g-8-i rather than squeezed in here.
