it_requirements:
  - "SCOPE RESOLVED — THIS IS AN ADOPTION SWEEP, NOT A BUILD. VERIFIED 2026-08-14: templates/scripts/commit_guardian/_resolve_root.py EXISTS and 27 files under templates/scripts/commit_guardian/ already reference it. It is answer (a) to the open question the BA recorded: the shared facility this AC asks for, already present but not universally adopted. Do NOT build a second facility."
  - "THE UN-MIGRATED SET IS THE ACTUAL WORK, and it is measurable: 19 files under templates/scripts/commit_guardian/ still carry a private _find_project_root / parents[] walk — doc_type_validators.py, diagram_type_validators.py, check_components_integrity.py, check_structural_change.py, transform_doc_index.py, check_mermaid_parent_link.py, check_build_drift.py, check_ac_pattern_refs.py, ensure_precommit_config.py, check_ac_governance.py, check_workflow_meta.py, check_surface_components_e2.py, check_surface_components_e3.py, check_ac_circular_deps.py, check_output_drift.py, check_adr_cross_reference.py, hooks/check_ac_limits.py, and BOTH observed-failing checks: check_ac_parent_covered_by.py and check_ac_schema.py. Derive the working list by scanning, not from this snapshot — the count will move."
  - "THE FINDING, stated plainly so it is not lost: the facility exists and is widely adopted, and the two hooks that broke are precisely the ones that bypass it. The failure is non-adoption, not absence."
  - "Migration is REMOVE-THEN-ADOPT, not add-beside. Each migrated check DELETES its private root walk AND its private graceful fail-open fallback (for example check_ac_parent_covered_by.py's _get_derive_parent_id() fallback at ~line 377). A shared facility installed while a private fallback survives changes nothing, because the private path still wins on failure. A duplicated resolution source is a defect the criteria imply but never name."
  - "If _resolve_root.py does not today cover DATA and CONFIGURATION prerequisites — GE-119b-3 requires a schema document plus a second, different configuration document — EXTEND the existing facility rather than adding a sibling module. One facility is the criterion."
  - "The authoritative set is templates/scripts/commit_guardian/commit_guardian.json -> hooks_manifest.hooks[], read at run time: 54 entries today (48 tier=judgment, 6 tier=transform). Do NOT hard-code 18 or 54. Two invocation shapes exist — most entries run via run_hook.py, precommit-canary invokes its script directly — and five checks live under templates/scripts/commit_guardian/hooks/. The sweep must handle all of these or report them as gaps, never skip them."
  - "The no-new-private-walk rule for a newly added check must be DATA-DRIVEN (a scan of the family for private root-walk patterns), never a named-file exemption list, so a new check inherits the rule by existing rather than by being remembered."
  - "BEHAVIOUR-PRESERVING SWEEP: do not migrate and change behaviour in the same edit. GE-119b-2-i's before/after baseline is only meaningful if this sweep changes nothing in the main checkout."
  - "ADR-001 deployed/template parity across every migrated file: edit templates/scripts/commit_guardian/ (canonical), then run 'python scripts/build.py --target-dir .' so scripts/commit_guardian/ and .leafcutter/scripts/commit_guardian/ match. check_hook_parity compares all four locations (runtime, canonical template, legacy templates/commit-guardian, deployed .leafcutter). This AC touches the largest number of files in the tree, so a partial rebuild is the most likely way it half-lands."
  - "Confirm _resolve_root.py itself is in deploy_map in scripts/build_phases.py and lands at .leafcutter/scripts/commit_guardian/_resolve_root.py after a build. Making 19 more hooks depend on a module that is not deployed converts a silent skip into a ModuleNotFoundError on every commit."
test_spec:
  - name: test_ge119b2_migrated_check_resolves_all_prerequisites_from_second_copy
