    framework: pytest
    type: integration
    angle: discrimination
    must_catch:
      - "runs ruff under the mismatched version and lists its findings alongside the mismatch"
    description: "Same 0.15.14 stub; staged file carrying E741 at line 12: refused for the version mismatch naming both versions; output contains neither 'E741' nor ':12:'; --json findings is []."
  - name: test_bp_1300e_1_v_newer_patch_version_is_refused
