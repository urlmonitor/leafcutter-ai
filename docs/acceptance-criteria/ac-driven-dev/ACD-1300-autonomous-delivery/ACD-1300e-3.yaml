id: ACD-1300e-3
title: Revalidate saved scope and evidence before dispatch or continuation
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given a saved run refers to approved AC and ADR revisions, a target revision and dependency evidence
  When the worker prepares any further dispatch or resumes that run
  Then it verifies the saved scope, approval, prerequisites, execution settings and evidence against their current sources
  And a scope change, revoked approval or invalidated evidence preserves the work and reports a blocker before further implementation or publication
  And a priority-only change leaves a healthy claimed feature in place
