notes: |
  THIS IS THE HOME FOR THE QUEUED POINT FIX AND IT HAS FIVE FREE SLOTS. A fix is
  already queued to stop the governed tool treating retired records as candidates.
  It arrives as its own child record with this one as its parent, and this record's
  covered_by is updated in that same write. It is deliberately NOT authored here.
  Zero children today against a hard cap of five.

  THE SPECIFIC DEFECT, SUPPLIED BY THE USER AND CARRIED AT THE CONFIDENCE GIVEN —
  IT BELONGS HERE AND NOT IN THE CRITERIA. The governed tool's candidate selection
  reads only the finished-state field and the implementation-link field. It never
  reads lifecycle status at all, so a record whose requirement has been retired is
  as eligible as any other. This is a single unread field, which is what makes the
  fix small; it is also why the criterion above is written as a GUARANTEE about
  which records are in reach rather than as an instruction to read one more field.
  A criterion pinned to the fields today's implementation happens to consult is
  falsified the moment that implementation changes.

  THE SHARPEST REASON THIS MATTERS RIGHT NOW, AND IT IS NOT HYPOTHETICAL. The
  entire governing specification of the governed tool is itself being retired.
  Once that lands, the store contains a live tool whose candidate set includes the
  very records that were retired for describing it. A tool that acts on retired
  requirements does not merely waste effort — it re-animates decisions the project
  has already taken.

  MANDATORY NEGATIVE ARM. Every positive reading of this criterion is satisfied by
  a tool that selects nothing at all. The arm that distinguishes a working
  eligibility rule from a broken one is a run over a store containing BOTH a live
  record needing a change AND a retired record that would otherwise have matched:
  the live one is acted on and the retired one is not, in the same run. Either arm
  alone passes on a stuck answer.

  AND THE ABSTENTION IS REPORTED, NOT SILENT. A retired record that would have
  matched is excluded visibly, not dropped without trace — otherwise the exclusion
  is indistinguishable from the tool having found nothing. That property is
  ACS-1600d's and is inherited here rather than restated.
