criteria: |
  The web app's code style is automatically checked, so style violations block the merge.

  When a pull request changes the web app, its code style is checked
  automatically and the request is stopped if any style rule is broken — the same
  incident that shipped in production, where a style violation slipped through
  every check, is prevented from merging.
