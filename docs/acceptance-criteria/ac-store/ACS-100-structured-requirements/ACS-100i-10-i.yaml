title: "Setting the producer to null lands on the same default as leaving it out, instead of putting a nameless phase into a ticket"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given two records identical in every respect except that one sets its
    producer to null and the other leaves the field out entirely,
  When a ticket is generated from each,
  Then both tickets name `python-coder` as the producer, and their phase lists
    are the same.

  And given a record that sets its producer to null and declares neither a
    change target nor a risk surface,
  When a ticket is generated from it and the ticket's phase list is inspected,
  Then no entry in that list is nameless — today the default applies only when
    the field is missing, so a field that is present and null reaches the phase
    list as an entry with no agent name, which nothing can be dispatched
    against.

  And given the 18 records that currently set their producer to null while
    declaring no change target, none of which sits at leaf level,
  When the store is scanned for buildable work,
  Then none of them is offered as buildable, and that is true both before and
    after this change.
