estimated_complexity: S
it_requirements:
  - "IDENTITY: an error key is (head path, error code, message with every 'line <digits>' rewritten to 'line N'). The line and column mypy prints are carried for display only and never compared."
  - "COUNTING: per key, new = max(0, head count - base count). When the base count is 0 every head occurrence is new and each is printed on its own line as '<path>:<line>: new error [<code>] <message>'. When the base count is above 0 the excess is reported once with every head line of that key and the base count, because which of identical errors is the new one cannot be known."
  - "REMEDY: every new error is followed by one remedy line telling the author to fix the type and not to add a '# type: ignore' (an added ignore fails the same check)."
  - "PARSING: mypy's text output is parsed with one regex accepting 'path:line[:col[:endline:endcol]]: error: message  [code]'; 'note:' lines are ignored; only errors whose path is one of the inspected files count (mypy also reports errors in modules it follows)."
  - "MYPY FLAGS live in the module once: --ignore-missing-imports --explicit-package-bases (unchanged from the old job) plus --no-error-summary --show-error-codes --no-pretty --no-color-output --hide-error-context for a stable output format."
test_spec:
  - name: test_bp_1300f_1_i_shifted_old_error_is_not_new
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: criterion
    must_catch:
      - "matches errors by (path, line) so a moved error counts as new"
    description: "Real git repo: base has the return-value error at line 2, head inserts five lines above it; the real module exits 0 and reports 0 new errors and 1 existing error untouched."
  - name: test_bp_1300f_1_i_genuinely_new_error_fails_naming_line_code_and_remedy
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: criterion
    must_catch:
      - "reports a failure without the head line number"
      - "exits 0 while printing the new error"
    description: "Head adds an assignment error at line 12; exit 1; output names scripts/svc.py:12, [assignment], the message and the remedy line."
  - name: test_bp_1300f_1_i_extra_copy_of_an_existing_error_is_new
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "compares sets instead of multisets, so a second identical error is absorbed by the first"
    description: "Head duplicates the return-value error in a second function; exit 1 and exactly one new error reported, naming both head lines and the base count 1."
  - name: test_bp_1300f_1_i_line_number_inside_a_message_is_not_identity
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: unit
    angle: boundary
    must_catch:
      - "keys errors on the raw message, so 'already defined on line 3' and 'on line 8' differ"
    description: "Pure comparison over parsed mypy lines: a no-redef error whose message says line 3 at base and line 8 at head is not new."
test_rationale: >-
  The behaviour is a verdict over two real mypy runs against two real git revisions,
  so the criterion arms build a temporary git repository with a base commit and a
  head commit and run the real module as a subprocess with the real mypy. The
  message-normalisation arm is a pure function over mypy's output format, tested
  directly with real mypy output lines so it does not pay two mypy runs.
