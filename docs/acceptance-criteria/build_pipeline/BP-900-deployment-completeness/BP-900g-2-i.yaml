criteria: |
  Given a deployed command whose handoff references a Skill by name, such as
    Skill("signoff"),
  And a skill named "signoff" is present in the deployed skill set of a consumer
    install,
  When build.py runs its command-reference reachability check,
  Then the build succeeds with a zero exit status for that reference,
  And the guardrail does NOT flag the Skill reference, because it resolves to a
    real deployed skill.
