id: BO-530
title: "Code changes always get tests written first and verified after"
component: build-orchestration
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  When the change type implies production code, tests are mandatory and automatic.

  The system injects test-writing before the implementation agent runs and
  test-verification after it finishes. This is a system invariant -- no one
  decides per ticket whether TDD applies. If tests fail after implementation,
  the failure is handed back to the same implementation agent with the relevant
  context to fix. The coder always has a failing test to code against, and
  the build never completes with unverified code.
