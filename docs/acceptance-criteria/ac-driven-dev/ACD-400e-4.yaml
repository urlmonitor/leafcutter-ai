it_requirements:
  - "IT-PO CORRECTION TO THE FRAMING, FOUND BY READING fast_lane.py 2026-09-08 — THE ACCOUNT MUST NOT PRESENT THE BATCH SELECTOR AS A LIVE PATH. select_batch carries an explicit docstring stating it has NO PRODUCTION CALLER: the live lane (fast-lane-ship.js) invokes the select_connected subcommand, and select_batch's only former caller, fast-lane-build.js, was deleted under BO-2400c-1-v. It is retained deliberately as dormant-not-dead. So the criteria's final clause is true of the function and would mislead if written as though a reader could reach it: the account must say that the fast lane's approval-respecting batch selection exists and is dormant, not that it is a path work travels. Writing it as live would make this page the next ACD-400a-1, which is the failure the whole tree exists to close."
  - "The account must record WHY the two postures cannot be unified, not merely that they differ. BO-2400f-2 is approved and done, and BO-2400f-12-ii holds as a hard constraint that approval, urgency, requirement status and status must not appear anywhere in the fast lane's producibility decision. An account that states the difference without its reason invites the next reader to 'fix' the inconsistency and contradict an approved criterion in another component."
  - "State that the two selectors share the approval test rather than merely agreeing on it: fast_lane.py imports the scanner's admission predicate and its sort helper directly, so the batch selector's agreement with the backlog queue is identity, not coincidence, and an edit to either rule moves both at once. A reader told only that they 'both require approval' will not know that."
  - "This AC changes no code in either component. scripts/ac_store/scan_ac_store.py and scripts/build_orchestration/fast_lane.py must be byte-identical before and after; the deliverable is an account plus a demonstration. A reading that harmonises the two selectors contradicts an approved criterion elsewhere and is wrong."
  - "Every pytest invocation used to run or verify the demonstration must set AC_ENFORCE_STRICT=1, or a red result is masked as an xfail and reads green."
  - "The demonstration must ask both selectors about ONE store in a single run and compare their two answers, rather than asserting each separately against a written expectation. Comparing the answers is what makes the difference an observation, and it is what turns this test red the moment someone unifies the two — which is the outcome the fast-lane ACs want."
  - "Both selectors must be reached through their real command surfaces over a temporary store; neither may be exercised by importing a private helper, and neither verdict may be inferred from the other."
test_spec:
  - name: test_one_store_two_selectors_disagree_on_the_draft_record
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: seam
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --ac-root <tmp> --json AND python scripts/build_orchestration/fast_lane.py select_connected --ac <draft-id> --ac-root <tmp>"
