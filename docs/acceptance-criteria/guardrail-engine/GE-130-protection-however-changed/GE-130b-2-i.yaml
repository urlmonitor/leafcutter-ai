notes: |
  GE-130b notes: once widened, a top-level session could lose CLAUDE_NO_DOC_UPDATE and
  CLAUDE_NO_README_CHECK if "no agent named" is read as an unidentified caller. GE-129a's notes
  settle it: absence of agent_id means the top-level session. Named mutation that turns ONLY this
  record red: treat a payload with no agent_id as unidentified (GE-130b-2's executor and
  unidentified cases stay green).

