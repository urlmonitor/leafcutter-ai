id: UXP-700e-2-i
title: "The derived short form is bounded, reproducible, and not editable in place"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given a journey whose authoritative description is 938 characters long,
  When the shorter form is derived,
  Then the derived form is no longer than the declared bound for the place it is shown,
  And deriving it twice from the same description produces the same text,
  And an edit made directly to the derived form is reported, naming the authoritative
    description as the place to edit instead,
  And the derived form ends in a way that shows a reader it was shortened, so nobody reads it
    as the whole description.
depends_on:
  - UXP-700e-2
created_by: "docs/acceptance-criteria/ux-prototyping/UXP-700-truthful-project-record/UXP-700e-2.yaml"
