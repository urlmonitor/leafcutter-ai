assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "Spec surfaces of record: templates/commands/plan-feature.md (mandates the Workflow tool, forbids an LLM-mediated manual alternative), templates/skills/plan-feature/SKILL.md (currently a prose runbook that tells the LLM to hand-drive the authoring agents), and templates/workflows-js/plan-feature.js (the canonical workflow)."
  - "Reconcile to a single canonical execution model: the SKILL.md must not instruct the LLM to manually dispatch triage/PO/BA/IT-PO or run the confirmation gates itself in contradiction of the command — it should defer to the Workflow tool path."
  - "After reconciliation, no reader can find two mutually exclusive instructions for how /plan-feature runs across the three artifacts."
  - "This is a prompt/spec consistency change owned by llm-expert; do not add behavioral runtime logic to the .js workflow. If reconciliation turns out to require editing plan-feature.js control flow (a .js surface llm-expert does not own), that portion must be split to a JS-capable implementer — flag rather than silently edit."
  - "Preserve portability of the affected templates (front-matter, trigger phrases) so build.py deploys them unchanged in shape."
test_required: false
notes: |
  Verification method (spec-only, no executable behaviour): this AC is a
  documentation/consistency reconciliation, so test_required is false. Verify by
  a cross-artifact consistency check over the three surfaces — read
  templates/commands/plan-feature.md, templates/skills/plan-feature/SKILL.md, and
  templates/workflows-js/plan-feature.js together and confirm (a) the SKILL.md
  contains no manual agent-dispatch or self-run-gate instructions that contradict
  the command's "use the Workflow tool" directive, and (b) all three describe
  exactly one canonical execution path. This is the v3 convention for spec-only
  ACs (test-writer skips with this recorded reason rather than misclassifying it
  as docs-only).
