id: KM-300c-1-ii
components:
  - knowledge_management
  - documentation_system
  - precommit_hooks
readiness: approved
priority: high
title: "A map check that finds no links to inspect refuses instead of passing silently"
component: knowledge-management
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/knowledge-management/KM-300-docs-same-everywhere/KM-300c-1.yaml"
criteria: |
  Given the documentation map about to be committed has section headings such
    as "## Components" and "## Glossary"
  And its entries are written in a form the map checks do not recognise as
    links (e.g. a changed table layout), so the checks recognise zero links
  When the contributor commits
  Then the commit is refused
  And the refusal message states that the map was inspected and 0 links were
    found, and that the check could therefore not verify the map
  And when the checks recognise at least one link per non-empty section, the
    message (on pass or refusal) or the check's output states how many links
    were inspected
depends_on:
  - KM-300c-1
doc_links:
  - path: docs/INDEX.md
    relationship: describes
    status: exists
  - path: templates/scripts/commit_guardian/check_doc_index_links.py
    relationship: implements
    status: planned
  - path: docs/acceptance-criteria/knowledge-management/PROJECT_CONTEXT.md
    relationship: context
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Both the separator check (KM-300c-1) and the resolution check (KM-300c-2) must refuse when they recognise zero links in a map that has section headings (fail closed), and must report the inspected-link count on pass and on refusal"
  - "The minimum-count rule must be derived from the map itself (non-empty sections), not a hard-coded number of links"
  - "A section that states No docs found. counts as empty and does not require a link"
delivers_to: null
expects_from:
  ac_id: KM-300c-1
  contract: "The separator check (and KM-300c-2's resolution check) whose inspected-link count this edge case asserts"
origin_agent: business-analyst
created: 2026-09-25
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
change_target: code
risk_surface: internal
test_spec:
  - name: test_zero_recognised_links_refuses_with_zero_count_message
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "A map with ## Components and ## Glossary headings whose entries use an unrecognised layout is refused, and the message states 0 links were inspected and the map could not be verified."
  - name: test_inspected_link_count_reported_on_pass
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "A valid map with N entries passes and the output states N links were inspected."
  - name: test_section_with_no_docs_found_needs_no_link
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "A map where one section reads No docs found. and others have valid links passes."
  - name: test_resolution_check_zero_links_also_refuses
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "The same zero-link map is refused by the KM-300c-2 resolution check with the same 0-links statement."
test_rationale: "A check that silently passes on zero matches looks green forever after a layout change; only a test that feeds an unrecognised layout proves the fail-closed floor exists in both checks."
notes: |
  Standing constraint inherited in this component (see PROJECT_CONTEXT,
  KM-ADM-100d / ACS-1100): a check must assert a minimum matched count or it
  degrades to a zero-denominator silent pass. Applies equally to KM-300c-2's
  resolution check; parented under KM-300c-1 because derive_parent_id allows
  one parent.
