it_requirements:
  - "THE COMPONENT-TEST SURFACE THAT ESTABLISHES THE SCREEN PROOF (the open question), and it is affordable TODAY with nothing provisioned (finding F1): leafcutter-web/ already carries vitest 4.1.10, jsdom 29.1.1, @testing-library/react 16.3.2 and @testing-library/jest-dom; leafcutter-web/vitest.config.ts sets environment \"jsdom\" and include [\"**/*.test.{ts,tsx}\"]; and a real render-and-drive component test already exists at leafcutter-web/components/flows/__tests__/flow-nodes.decisions.test.tsx. That is the surface. Do not stand up a second one."
  - "REUSE THE EXISTING INVOCATION SEAM; DO NOT BUILD A SECOND RUNNER. scripts/ac_store/done_proof.py already scans .ts/.tsx sources for `// covers:` tags (_scan_single_ts_file) and already invokes vitest scoped to specific files and parses per-file outcomes (run_vitest_and_parse, with JsRunnerUnavailable on a missing binary or launch error). The screen proof is that seam applied to a screen member — the assigned agent is python-coder because the work is the Python-side proof harness, not the screen."
  - "REFUSE, DO NOT DOWNGRADE, WHEN A LIVE SERVICE IS REQUIRED. config/skills_config.default.json sets live_surface_testing.enabled false by default and deliberately: a portable package installed into arbitrary repositories must not require its consumers to start servers. A member whose described result is observable only against a live HTTP surface is refused up front under BO-3500c-4 scenario 3 — a cheaper proof for a screen does not prove less, it proves nothing."
  - "JsRunnerUnavailable IS A REFUSAL, NOT A PASS AND NOT A SKIP. A missing vitest binary means the defined proof cannot be established in this run — BO-3500c-4's `proof_unavailable_here`. done_proof already fails closed on this path; preserve that and do not add a lenient branch."
  - "COMPARING CLASS. The receipt carries condition_a (observed state before the described interaction), condition_b (after) and a non-empty difference. A proof that renders and never interacts produces identical conditions and is therefore rejected at write time by BO-3500c-1 — that cross-check is the intended mechanism for catching a screen proved by rendering alone, not a redundancy."
  - "THE INSTRUMENT MUST RECORD THAT A RENDER ACTUALLY OCCURRED, NOT INFER IT from the test file existing or from a PASSED outcome on an empty test. The third scenario — source produced, never loaded — is the one an existence check cannot see."
  - "TEST FRAMEWORK NOTE: the AC schema's test_spec framework enum is unittest|pytest, and `vitest` is not a permitted value (records that used it are the store's current schema violations). Model these as pytest tests that drive run_vitest_and_parse as a subprocess — which is also what the lane actually does."
  - "NO PRESENCE-ONLY ASSERTIONS. Every test renders, drives, and reads an observable, or asserts a refusal."
