notes: |
  THIS RECORD SATISFIES THE PARENT'S documentation_triggers: [reference-doc], WHICH IS THE ONLY
  TRIGGER THE PARENT SETS AND IS DELIBERATELY ALONE. No component diagram is owed: ADR-045 §5
  binds the execution surface to the harness that already exists, which is to be extended rather
  than drawn a second time.

  WHY IT IS WRITTEN AS AN EXECUTABLE WALKTHROUGH RATHER THAN AS A LIST OF THINGS THE DOCUMENT
  MUST MENTION. A documentation criterion phrased as "the document states X" is satisfied by a
  paragraph nobody follows, and it is checkable by searching the text — which is the one form of
  verification this whole tree treats as disqualifying. Phrasing it as two walkthroughs whose
  difference shows up in the run's own output makes the document falsifiable: a page that omits
  the declaration step, or describes it in a way that does not produce a tied declaration, fails
  by producing a guard the run names as undeclared. The last clause is the only one about
  placement, and it is there because a rule the next author does not meet is a rule that is not
  written down in any sense that matters — which is precisely the history of the vocabulary this
  record tells them to use.

  THE INTENDED IMPLEMENTER IS THE DOCUMENTATION AUTHOR, AND THE ASSIGNMENT IS NOT MADE HERE. The
  brief for this stage withholds assigned_agent, estimated_complexity, it_requirements and
  test_spec from the BA. Recorded rather than assigned, so the IT PO is not left inferring it:
  the behaviour is a documentation surface and the natural owner is documentation-expert, with
  the walkthrough verification needing something that can run the liveness run over the guard the
  walkthrough produced — which may make this record a two-party change, and if the IT PO
  concludes it is, the split point is between writing the page and executing it.

  THE DOC-LENGTH CONSTRAINT IS NOT COSMETIC. See the doc_link above: the most natural host is
  already over the limit and the gate now refuses growth. Discovering that at the end of the
  change costs a rewrite; the note is here so it is discovered at the start.

  Authored at the BA stage. L2 behaviour only. No assigned_agent, no it_requirements, no
  test_spec, no estimated_complexity — the IT PO's.
