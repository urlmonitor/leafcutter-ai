amended_by:
  - "2026-10-09: product-owner reviewed this AC during the KM-400f split and
    deliberately left it here. Its four sibling ACs from the same authoring pass moved
    to KM-400f, which is about staying inside declared storage limits; this AC is about
    honest configuration — an unset required backend setting failing loudly instead of
    being guessed — which is KM-400e's own subject, continuing honestly when the
    capability cannot be used. It also comes from a different incident (60 consecutive
    synchronization failures) and depends on KM-400e-5's synchronization job. Nothing in
    the record changed except readiness to approved and priority to high at the user's
    approval gate. Keeping it here leaves KM-400e with six children, so its
    child_limit_override is reduced from 8 to 6 rather than removed; that remaining
    waiver is the deliberate price of not stretching KM-400f's wording to cover a fifth
    child it does not honestly describe."
