it_requirements:
  - >-
    A REFUSAL IS ESTABLISHED ON THE FILESYSTEM, NEVER FROM THE GUARD'S OWN REPORT. Everywhere
    in this L1, a guard counts as having refused only when the target file is byte-identical
    before and after the attempt, and, for a create, still absent afterwards. The guard's exit
    status, its stderr text and any JSON it emits are captured as evidence and are never the
    value the liveness record is computed from. GE-130f-1-i is the discriminator for this rule
    and its named mutation is mandatory, not advisory.
  - >-
    ONE ENTRY POINT AND ONE HARNESS FOR EVERY OBSERVATION. Each observation goes through the
    exact PreToolUse command string templates/settings.json registers for that guard, with a
    real tool payload on stdin, run out of process against a built working copy. Extend
    unit_tests/portability/_deployed_check_harness.py (GE-120c-1, already delivered); a second
    harness beside it is refused, and an in-process import of the hook module is not an entry
    point and is not accepted as coverage for any record in this L1.
  - >-
    THE GUARD MUST REFUSE IN THE ONE FORM CLAUDE CODE HONOURS, AND THE HARNESS MUST APPLY THAT
    CONTRACT RATHER THAN GUESS IT. Printing a refusal is not refusing. The harness carries one
    decision interpreter implementing the PreToolUse contract Claude Code's own hooks reference
    states, it is the only place that contract is encoded, and its fidelity is asserted by its
    own conformance case over every ending a hook can produce. docs/reference/claude-code-hooks.md
    is NOT usable as the source for that contract until GE-130f-4 lands - it contradicts itself
    (KI-CG-20260917-claude-code-hooks-reference-contradicts-exit-codes).
  - >-
    THE LIVENESS RECORD FOR A SESSION GUARD LIVES IN A NEW session_hooks_manifest SECTION OF
    templates/scripts/commit_guardian/commit_guardian.json, NOT IN templates/settings.json.
    settings.json is parsed by Claude Code and its hook entries are a fixed
    {type, command, timeout} shape; carrying verification state there risks the host's parser
    and puts evidence in a user-editable file. The new section is keyed by hook script name and
    each entry restates NOTHING it can derive: it names the settings.json matcher and command
    string it corresponds to, and the run reconciles the two, so "held where the check is
    registered" (GE-120f-1) is satisfied by derivation rather than by a second copy that can
    drift. GE-130f-1 creates the section; GE-130f-2 adds its entry inside it.
  - >-
    NEITHER GUARD MAY NAME THIS REPOSITORY'S FOLDERS, PATHS OR COMPONENTS IN ITS SOURCE. Both
    are shipped in a portable package and install into projects with other layouts. Every
    folder a guard watches or gates is read at run time from the installing project (for
    documentation_guard, docs/components.json primary_code plus the architecture documents'
    own frontmatter; for readme_read_guard, its configured gated set), and a watched or gated
    entry that matches nothing in the installed project is REPORTED as gating nothing rather
    than silently exiting 0. A map rewritten to this repository's folder names is the same
    defect with different literals.
  - >-
    NO GUARD IS WIDENED TO SHELL COMMANDS ANYWHERE IN THIS L1. Every record here changes
    behaviour on the Edit|Write matcher only. Adding either guard to a Bash matcher is
    GE-130a's work and is refused by GE-130f-3 until that guard's record reads passing.
  - >-
    Error-handling policy applies to both guards and to the harness. A guard's UNEXPECTED
    exception must stay fail-open so an unrelated edit is never lost, and must be logged at
    WARNING or higher rather than swallowed; a DELIBERATE refusal must never travel the
    fail-open path. The harness's own subprocess and filesystem calls raise specific
    exceptions, and a setup failure is a reported failure, never a skipped case (GE-120c-1-i).
  - >-
    AC_ENFORCE_STRICT=1 on every pytest invocation in this L1. Without it pytest_ac_enforcement
    xfail-masks these tests, every one of which covers a not-done AC on the day it is written,
    and a green run means nothing.
