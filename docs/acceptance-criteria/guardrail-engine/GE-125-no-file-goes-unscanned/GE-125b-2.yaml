notes: |
  COVERED BY NAME ON PURPOSE, as GE-125b requires, and not left to follow from
  the general kind rule in GE-125b-1. This is the case a future reader checks
  first and the case that makes the whole goal legible; if it existed only as an
  instance of an extension rule, a later narrowing of that rule could reopen it
  without anything visibly turning red. GE-123d-4-i makes the same demand from
  the other side of the fence for the rule it governs — the sharpest instance
  must be pinned explicitly, not by implication.

  THE MEASUREMENT THIS INVERTS. KI-SEC-001 ran a 5.17-entropy token through the
  real exemption logic and recorded
  "templates/skills/security-scanner/scripts/scan_secrets.py  EXEMPT — not
  reported". Today the tool that exists to catch a pasted credential is one of
  the places it cannot catch one.

  THE SECOND ARM IS THE MANDATORY NEGATIVE CONTROL AND ALSO THE ARGUMENT AGAINST
  THE CHEAP ALTERNATIVE. Dropping the skill-prompt area from the list would pass
  the first arm and fail the second, and GE-123d-4-i already recorded why that
  alternative was rejected: the prompt text in that directory is exactly the
  writing that has to describe credential shapes, and the same prose-beside-code
  conflict recurs wherever the two share a directory. Gating on kind solves the
  class; dropping one directory solves one instance and creates a false positive
  in its place.

  FIXTURE PLACEMENT, STATED AND JUSTIFIED, AND SHARPEST HERE OF ANYWHERE IN THIS
  TREE.
    - The fixture is a file placed at that repository-relative path INSIDE a
      throwaway git repository. It is never this repository's own
      templates/skills/security-scanner/scripts/scan_secrets.py. Writing a
      credential-shaped token into the real file would require an allowlist entry
      on the scanner's own source — a genuine blind spot in the single file most
      likely to accumulate credential-shaped fixture data.
    - The fixture does not need to be the real scanner's contents. What is
      load-bearing is the path and the file kind, so a small Python file at that
      path is sufficient and is preferable to a copy that would drift.
    - The token is assembled at runtime from fragments, never written as a source
      literal, per the discipline already established for this repository's
      scanner tests.
    - Both arms are driven through the pre-commit secrets check over a staged set
      in that repository. Calling the exemption logic with this path as a string
      does not discharge either arm, and the second arm — an exact count of one
      across two files staged together — is not expressible that way at all.
    - Pair this with the "scripts/build_probe.py" control from GE-125b-1: every
      path named here contains a listed name, so the silence of the prompt file
      is only evidence beside a file that is reported in the same run.

  THE FENCE WITH GE-123d-4-i, RESTATED HERE BECAUSE THIS IS WHERE THE TWO LOOK
  MOST ALIKE. GE-123d-4-i also names the scanner's own source path explicitly and
  also requires it to be reported. It governs the keyword-based rule's PROPOSED
  exemption; this record governs the shapeless-value rule's EXISTING one. The
  same file, the same path, two different rules, two different states of the
  world. Neither closes the other, neither is a duplicate of the other, and a
  test written for one does not discharge the other — the value in the line
  differs, and so does the rule that must report it. Do not edit any GE-123
  record from this tree and do not add a depends_on edge into it.
