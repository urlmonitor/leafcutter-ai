notes: "Verified defect, 2026-08-13. Found only after GE-118b made the drift hooks actually run (they had been silently no-opping on an unresolvable manifest path). write_build_manifest() in scripts/build_helpers.py populates its Direction-A template_hashes section from templates/agents/*.md alone, so check_build_drift.py emits 'INFO — <path> not in manifest (new template — run build.py before committing built outputs)' for every other template it inspects, e.g. every templates/scripts/commit_guardian/*.py. Those templates are therefore never drift-checked. Distinct from GE-118b (manifest path resolution) and from BP-100b-6 (category-level parity across the four infrastructure layers, which does not assert per-artifact manifest records)."
