notes: |
  L1 CONSTRAINT 1, NARROWLY: plan-feature and finalize have no AC id, so a route reaching the
  executor must be able to name its run instead. This is the "narrowly-scoped L2" the L1 allows in
  place of generalising the executor; nothing else about the executor changes. It is needed whoever
  runs the commit step (Q1): BO-3200f's ~40 plan-feature and finalize command steps need the same
  key. BO-2400a-1-i is done; amending its contract record is the IT PO's call.
