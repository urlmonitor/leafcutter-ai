title: "The closure guard walks each file's syntax tree once and builds each scope's names once, with unchanged verdicts"
component: build-pipeline
level: L3
status: active
req_status: active
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g-8.yaml"
criteria: |
  Given the deploy-completeness closure guard of BP-900g-8, which analyses every
    deployed Python file once per build (BP-900g-8-i's pass-level cache),
  And a deployed file with module-level and function-level assignments, several
    path constructions, data-file reads and a sys.path push,
  When one guard pass analyses that file,
  Then the file's module syntax tree is traversed by ast.walk exactly once, and every
    detector that needs the tree's nodes reuses that one traversal,
  And the name-to-value map of each scope in the file (the module, and each function)
    is collected from that scope's own body exactly once, however many path
    expressions inside the scope are evaluated against it,
  And for every real deployed root of the package the closure, the
    deploy-root-relative subset and the namespaced findings are identical to those
    computed with both reuses switched off,
  And the unresolvable-reference WARNING lines the guard logs are identical, in
    number and in text, to those logged with both reuses switched off,
  Because after the per-build cache landed, a fresh-consumer build still spent about
    a third of its time in this guard: each file was walked six times and every path
    expression rebuilt its scope's assignments, including a full rescan of the module
    body, so files with many path expressions paid that rescan again for each one.
