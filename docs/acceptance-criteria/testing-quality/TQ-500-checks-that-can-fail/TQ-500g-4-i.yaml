notes: |
  THE CROSS-CHECK HALF OF TQ-500g-4. TQ-500g-4 fixes the one line format known
  to be dropped (sub-case failures). This L3 is the safety net for the next
  format nobody has seen yet: the run's own overall verdict is compared with
  what was parsed, and a contradiction is never resolved in favour of "passed".

  IN TECHNICAL TERMS (for IT-PO): "reports failure overall" is pytest exit
  status 1; "reports success" is exit status 0. The cross-check compares the
  exit status with the parsed {nodeid: outcome} map. Other exit statuses keep
  the handling they have today.

  R2 AND R3 ARE CONTROLS. A rule that marks every failing run inconclusive
  passes R1 and breaks R3 (and with it every ordinary failing test); a rule
  that ignores the overall verdict passes R2 and R3 and misses R1.

  FAIL CLOSED AT BOTH GATES. Inconclusive at done proof means not eligible; at
  red baseline it means neither red nor green, which the gate already treats as
  not passing (TQ-500f-3-i's fail-closed rule).
