notes: |
  A RULE THAT RESOLVES TO NOTHING PASSES FOREVER -- STATED HERE BECAUSE THIS IS
  THE CRITERION MOST EXPOSED TO IT. Its first clause is a universal over a
  population it derives, and a universal over an empty set is true. The
  repository has already shipped a check that matched zero files, printed a
  success line and exited clean for eight days (KI-ACS-001), and the roadmap's
  own phase_1 exit criterion is satisfied today while two per-agent deliveries
  reach nobody, because it counts leftover markers rather than delivered
  content. Counting the population is not decoration here; without it this
  criterion is the roadmap criterion again.

  WHY THE NEGATIVE PREMISE IS IN THE GIVEN. Asserting 'no delivery path is
  marker-gated' by inspecting the delivery step is a statement about source, and
  a source inspection is what has been passing. Stating the premise as 'no
  definition carries a marker' and observing the compiled prompts turns it into
  something the tree can be measured against.
