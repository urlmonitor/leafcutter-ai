created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100b.yaml"
criteria: |
  Given the read index is enabled and currently fresh, and a surface source file is
    then hand-edited on disk while no refresh event fires (no post-commit, build, or
    session-start refresh runs)
  When the next index-backed read happens
  Then the read's mandatory freshness check detects the drift on that surface
  And the affected surface is rebuilt on read so the returned nodes and edges reflect
    the hand-edit
  And the answer returned equals a live full parse of the current tree — the missed
    event costs only the extra rebuild time on that read, never correctness
  And no index-backed read ever returns data that contradicts the current on-disk
    sources, upholding the KM-KGS-100d invariant that every connection the map shows
    points to something that really exists on disk
