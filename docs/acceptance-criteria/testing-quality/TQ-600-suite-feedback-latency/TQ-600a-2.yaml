notes: |
  THIS IS THE AC THAT STOPS THE OBVIOUS WRONG ANSWER. The naive reading of TQ-600a
  is "make every test reuse one deploy". Applied to unit_tests/test_bp_900g_8*.py
  that is doubly destructive: those four tests (~10.5 min between them, each running
  a three-state deploy) exist to prove that a broken package FAILS to deploy, so
  sharing a layout with them would leave a deliberately broken layout behind for
  every reader, and would remove the very thing they assert.

  THE LAST CLAUSE IS THE ANTI-REGRESSION CLAUSE AND IT IS THE LOAD-BEARING ONE.
  Routing is a decision made per test, and decisions rot. Without a failure that
  names the offender, a future test that mutates the shared layout degrades the
  whole suite silently and the first symptom is an unrelated test failing
  intermittently somewhere else. TQ-600a-3 asserts the corruption is detected;
  this clause asserts the mis-routing is detected before it can corrupt anything.

  VERDICT UNCHANGED, NOT MERELY STILL-FAILING. "The deploy still fails" is
  satisfiable by a copy that is broken in some entirely different way. The clause
  requires the failure reason the test names, so a test that passes for a new
  wrong reason is not counted as preserved.
