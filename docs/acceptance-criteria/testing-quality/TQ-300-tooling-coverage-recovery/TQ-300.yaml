criteria: |
  Regressions in the package's behind-the-scenes tooling get caught by tests
  instead of shipping unnoticed.

  A cluster of internal tools does real work every drive — it loads and
  validates the agent registry, injects registry data into agent templates,
  audits the package for portability gaps, evaluates the selection rules that
  decide which agent fits a task, draws the agent spawn map, ranks the next
  ticket to build, and scans for leaked secrets before a commit. Today several
  of those tools ship with no automated coverage at all, so a change that
  quietly breaks one of them slips through unseen and only surfaces later as a
  confusing mid-run failure. After this goal, each of these tools is backed by
  focused tests that fail the moment its behavior regresses, making the package
  self-protecting against its own tooling breaking. This complements TQ-100
  (which decides WHICH tests gate main) by ensuring the tooling those gates
  depend on is itself tested. Re-authored under the TQ-300 prefix from the
  salvaged (never-merged) TQ-200 tooling-coverage group; the TQ-200 id range
  was independently reused on main by an unrelated per-agent-eval-coverage
  feature, so this work carries fresh, non-colliding ids.
