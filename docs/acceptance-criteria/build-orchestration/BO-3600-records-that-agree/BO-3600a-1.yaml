readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a fault entry whose status reads open and whose body names requirement R,
    And R's record reads finished,
  When the two records are reconciled,
  Then that pairing is reported as a conflict,
    And the report names the fault entry and names R,
    And it states which claim each record makes.

  Given a fault entry whose status reads resolved and whose body names requirement
    R, where R reads finished,
  When the two records are reconciled,
  Then no conflict is reported for that pairing.

  Given a fault entry whose status reads open and whose body names requirement S,
    where S reads unfinished,
  When the two records are reconciled,
  Then no conflict is reported for that pairing,
  So the conflict is the conjunction of an open fault and a finished requirement,
    and neither half alone raises one.

  Given a fault entry whose status reads open and whose body names three
    requirements, of which one reads finished and two read unfinished,
  When the two records are reconciled,
  Then one conflict is reported, naming the entry and the one finished requirement,
    And the two unfinished requirements are not named as being in conflict,
  So an entry naming several requirements produces a conflict per disagreeing pair
    rather than one conflict for the whole entry.
