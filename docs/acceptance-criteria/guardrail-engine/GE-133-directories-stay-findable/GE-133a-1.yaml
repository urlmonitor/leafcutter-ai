notes: |
  WHICH ARMS GO RED AGAINST THE CHECK AS IT STANDS (read from its source and configuration
  on 2026-10-09; there is no set-aside declaration and nothing reads one):
    - ARM 1: RED. A folder going from 15 to 19 is exactly what the check refuses (the
      BO-3800 refusal of 2026-10-09, reproduced), and a folder absent at the parent
      revision counts as 0 before and 20 after, so it is refused as newly dense too.
    - ARM 2: RED. Today all four folders, the store folder included, are named as too dense.
      The arm stays red under every name-shaped or prefix-shaped fix, which is its purpose.
    - ARM 3: RED on the statement clauses. The refusal half is already true today; nothing
      looks for a declaration, so nothing states that one could not be read or interpreted.
    - ARM 4: GREEN TODAY ON ITS REFUSAL, by design: an empty declaration must behave like
      today's check. It is the negative control that a switched-off check fails, and its
      last clause tells it apart from arm 3.
    - ARM 5: RED. Today the records/criteria/ folder is refused alongside the store folder.

  THE NEW FOLDER IN ARM 1 IS WHAT TELLS A DECLARED LOCATION FROM A LIST. The BO-3800 half
  alone is satisfied by naming that folder. Only a folder that did not exist when the
  declaration was last edited, committed with the declaration untouched, separates the two.

  THE TWO NAMES IN ARM 2 ARE PARTLY MEASURED. templates/acceptance-criteria/ exists in this
  repository as the template the installer ships. unit_tests/acceptance-criteria/ and
  docs/acceptance-criteria-archive/ do not exist; they are fixture names chosen to cover
  the test-folder case and the string-prefix case.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM.
    (1) THE LIST. Name the over-limit store folders individually. MUST GO RED: arm 1 (the
        new folder). MUST STAY GREEN: arm 4.
    (2) THE SWITCH-OFF. Disable the check, or skip every folder under docs/. MUST GO RED:
        arms 2, 3, 4 and 5. MUST STAY GREEN: arm 1, which a disabled check satisfies.
    (3) THE BUILT-IN PATH. Hard-code docs/acceptance-criteria/ in the check and ignore the
        declaration. MUST GO RED: arms 3, 4 and 5. MUST STAY GREEN: arms 1 and 2.
    (4) THE NAME RULE. Add acceptance-criteria to the check's existing list of directory
        names skipped by name. MUST GO RED: arm 2 (source and test folders skipped), and
        arms 3, 4 and 5. MUST STAY GREEN: arm 1. Recorded because it is the one-line "fix"
        most likely to be tried first.
    (5) THE STRING PREFIX. Treat a folder as inside the location when its path starts with
        the declared text. MUST GO RED: arm 2 (the -archive folder).
    (6) THE FAIL-OPEN DECLARATION. Treat an absent or uninterpretable declaration as "set
        everything aside", or let the check exit clean. MUST GO RED: arm 3.
    (7) THE CONFLATION. Report an empty declaration as unreadable, or an unreadable one as
        empty. MUST GO RED: arm 4's last clause, or arm 3's statement clauses.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec and test_rationale. Those are the IT PO's, as are the declaration's key name
  and shape (GE-133a's notes recommend reusing GE-127g's).
