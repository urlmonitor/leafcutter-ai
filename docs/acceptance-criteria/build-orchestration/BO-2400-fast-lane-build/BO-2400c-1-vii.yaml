it_requirements:
  - "SURFACE: docs/reference/fast-lane-prompt-caching.md, and only that file. Agent: documentation-expert. Location rule: ALL drifted regions, not the first one found — they are enumerated below. No post-write build step: a docs/reference page is not deployed by build.py, so nothing needs regenerating."
  - "SCHEMA NOTE ON THIS FIELD'S SHAPE: it_requirements is authored here as a LIST rather than the structured object form deliberately. The object branch of config/ac_store_schema.json requires all five of config_schema_fragment, reference_file_path, n_location_rule, required_skills and post_write_commands for EVERY record that uses it — the schema says so explicitly, so that narrowing the trigger cannot become a way to file a half-populated spec. This record registers no config key, so a config_schema_fragment would have to be invented to satisfy the validator. Filling a field with a fiction to make a gate pass is the failure this repo exists to prevent, so the list form is used instead and the same content is carried in full."
  - "SINGLE-FILE SCOPE. This criterion changes docs/reference/fast-lane-prompt-caching.md and nothing else. It does NOT change scripts/injection_builders.py or templates/workflows-js/fast-lane-ship.js — both are already correct as of BO-2400c-1-vi, and re-editing them here would put a documentation record on a code surface it does not own. If the page and the code disagree, the CODE is right and the page is what changes."
  - "CORRECT AGAINST THE SOURCE, NOT AGAINST THIS RECORD. Read the actual assemble_context_bundle() signature and docstring in scripts/injection_builders.py and transcribe from it. Do not transcribe the layer list out of this criterion's prose — a second-hand description is exactly how the page drifted the first time. If a statement on the page cannot be checked against the function, it does not belong on the page."
  - "ALL TEN DRIFTED REGIONS — the drift is in TEN separate regions, and correcting the signature block alone leaves nine wrong. As of 2026-08-26 they are: the 'accepts eight keyword-only parameters ... first five are required' sentence (lines 29-30); the Parameter Overview table rows for conventions and acs and the change-frequency ranks of everything after them (32-41); the signature code block (49-61); the Parameters table rows (69-78); the stable-prefix ordering block (84-92); the volatile-suffix ordering block (94-104); the Cacheable-Prefix Guarantee paragraph, which names conventions as a stable input (117-120); the Return Value expression, which reads '\\n\\n'.join([acs, prior_tests, *optional_layers]) (138); all three worked examples (156-199); and the Related Knob: Cache TTL section (207-215)."
  - "THE THREE EXAMPLES MUST BE RUNNABLE, NOT MERELY EDITED. Every worked example currently passes conventions= and acs=, which the function now rejects with TypeError. A reader copies examples. After the correction, paste each example into a Python process against the real module and confirm it runs — a reference page whose examples raise on the first call is worse than one that is simply terse."
  - "THE TTL SECTION IS NOT STALE — IT IS FALSE, and that is a stronger claim needing a different fix. Stale text describes something that used to be true. This section describes a knob that has never existed: verified 2026-08-18 and re-verified 2026-08-26 that the string cache_control appears nowhere in scripts/, templates/ or config/; the cache breakpoint is a literal HTML comment inside a prompt string; and leafcutter never issues the model API call (the workflow engine's agent() does, and it is handed plain prompt text), so there is no request on which a TTL could be set. Do not soften it to 'not yet configured' or 'planned' — that preserves the false impression that setting it is a matter of turning something on."
  - "DO NOT OVERCORRECT THE CACHE FRAMING INTO A CLAIM THAT THE ORDERING IS POINTLESS. The byte-identical stable prefix is a real, tested property of the function (BO-2400c-1, BO-2400c-1-iv) and the page should keep documenting it as such. What must go is the assertion that a provider cache is configured, primed, or observed. Distinguish the property the code guarantees from the benefit it was hoped to unlock — that distinction is the whole correction, and collapsing it in either direction gets the page wrong again."
  - "STATE THE RULE, NOT ONLY THE NEW LIST. A reader who learns only that there are now three layers will add a fourth the next time something seems useful. The rule that decides membership — the bundle carries only what the receiving agent does not otherwise have — is what stops the page going stale again, and it is the reason both removed layers were removed."
  - "SAY THAT THE CONTENT MOVED. The acs layer's content was not dropped; every context-carrying dispatch now instructs its agent to read each id's record from the run's own store. A page that says only 'the acs parameter was removed' invites the reader to conclude the coder no longer sees its ACs, which is false and would prompt someone to add the layer back."
  - "GENRE GUARD — THIS STAYS A REFERENCE PAGE. Diataxis reference is lookup-oriented: tables, signatures, contracts, enumerated behaviour. The reasoning belongs in one or two sentences of orientation and in the pointer to BO-2400c-1-vi, not in an essay about the 87% duplication. If the explanation grows past a short paragraph, that is a signal it belongs in an explanation doc and should be raised as its own record rather than absorbed here."
  - "FRONTMATTER: last_updated is 2026-07-21 and must move to the correction date. Leave title, type, status, created and the components list alone — the page is still a reference, still active, and still owned by build_orchestration + injection_builder."
