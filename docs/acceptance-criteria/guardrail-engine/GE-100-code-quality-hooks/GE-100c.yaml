title: "jscpd hook blocks commit when strict mode is enabled and duplicates exceed threshold"
component: guardrail-engine
level: L2
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-100-code-quality-hooks/GE-100.yaml"
criteria: |
  Given the commit guardian configuration has the duplicate_code section with:
    enabled: true
    strict: true
    min_lines: 5
    min_tokens: 50
    threshold_percent: 5
    checked_extensions: [".py", ".ts", ".js", ".tsx", ".jsx", ".sql"]
  And the jscpd binary is installed and reports version 3.x
  And a developer has staged a TypeScript file containing a 12-line block that
    is duplicated at 8% of total lines scanned (above the 5% threshold)
  When the duplicate code hook runs at pre-commit time
  Then the hook exits with code 1 (blocking)
  And it emits an error message listing each duplicate clone with
    file path and line range for both the source and the copy
  And the error message states the measured duplication percentage (8%)
    and the configured threshold (5%)
