notes: |
  Satisfies TQ-600a documentation_triggers: [how-to]. Depends on all four behavioural
  records because the guide describes each of them; it cannot be finished before they
  exist.

  WHY THE PERMISSION POINT IS IN CRITERIA. With nothing pre-approved (user decision
  2026-09-16), an operator whose own settings do not allow a case's commands gets a
  permission_request_unanswered failure on the first run. A guide that omits this sends
  the operator to debug a correct failure.
