it_requirements:
  - "IT-PO DECISION -- CHARTER VERSUS RUNTIME CODE: REASSIGNED from llm-expert to python-coder, NOT split. Every Then in the first two scenarios (three separately readable parts, byte-identical output down to a tab, a trailing space, a backslash escape and a non-ASCII character, empty rather than absent, exit status 3) is a property of how output is CAPTURED and CARRIED, which no charter text can guarantee: a model transcribing that output is exactly the relay that cut KI-BO-018's registry mid-escape-sequence. The charter's policy content -- admits every exact command, no remit refusal, stated permission, containment -- stays with llm-expert under BO-3200f-2 and BO-3200f-2-i. A split was rejected because every scenario here needs both the capture and a dispatchable party, so the criteria cannot be partitioned without inventing text."
  - "THE THREE PARTS MUST BE CAPTURED BY DETERMINISTIC CODE, NEVER TRANSCRIBED BY THE MODEL. Standard output, error stream and exit status are captured separately at the moment the command runs, and the executor's reply carries that capture unchanged. The representation must be lossless for arbitrary bytes, not only valid UTF-8, and must keep an empty part distinguishable from an absent one."
  - "TRANSCRIPTION LOSS MUST BE DETECTABLE BY THE CONSUMER, NOT MERELY UNLIKELY. For each output part the capture carries its byte length and a content digest computed at capture time, and the workflow-side reader verifies both before any part is used. A reply that does not verify is BO-3200f-1-i's incomplete result and never a value. This is the mechanical half of 'exercises no judgement': a paraphrase, a summary, a refusal or a fabricated exit status cannot carry a verifying capture of the command that was dispatched."
  - "ONE SHARED WORKFLOW-SIDE DISPATCH-AND-VERIFY HELPER, used by every executor dispatch in every shipped workflow. It takes an exact command and an absolute directory and returns either the verified result or a could-not-complete reason. No per-site prompt text and no per-site reply parser -- twenty sites with twenty parsers is how the plan-feature relays came to disagree."
  - "LITERAL EXECUTION, NO CLASSIFICATION STEP -- settles the choice the BA left open for the last scenario. Whatever text the executor receives as the command is run as the command. The executor never first decides whether the text 'is' an exact command, because that decision is itself judgement. A request such as 'tell me whether worktree-agent is permitted to run shell commands' is therefore run literally and returns the shell's own failure, identical for both registries. A fixed 'no exact command received' reply was rejected because it needs exactly the classification this record forbids."
  - "EXACTLY ONE COMMAND PER DISPATCH. The capture runs the dispatched command once and nothing else, and nothing in any part of its output is ever executed. The command text is not split, rewritten, re-quoted, prefixed or suffixed beyond what running it in the named directory strictly requires."
  - "THE DIRECTORY IS AN INPUT, NEVER INFERRED. The command runs in the directory the dispatch names, and the result reports the absolute directory it actually ran in, resolved at capture time rather than echoed from the input. A dispatch with no directory, or naming one that does not exist, runs nothing and is a could-not-complete outcome; it never falls back to the executor's own working directory (KI-ACD-009 cause 1)."
  - "SECURITY -- THE CAPTURE MUST NOT HIDE THE COMMAND FROM GUARDRAILS. Every Bash tool-use guardrail and every permission rule must evaluate the exact command text exactly as it would if the command were issued directly. Encoding the command, passing it through a file, or wrapping it so that a guardrail's matcher no longer sees it is a containment bypass and is forbidden. If the capture mechanism cannot keep the command visible, the capture changes -- never the guardrail."
  - "BOUNDED REPLIES, NO SIZE WORKAROUND HERE. The reply still travels through a model and is subject to the transport limit that truncated KI-BO-018 at 75,000 characters. The helper must not chunk, page or retry around that limit: commands dispatched for facts are expected to emit the fact rather than the source (BO-3200a-1), an over-limit reply fails verification and is reported as incomplete, and large-result handover remains BO-3200d's."
  - "THE HARNESS STAND-IN IS DELIVERED HERE AND IS THE ONLY ONE. unit_tests/_workflow_engine_harness.py must be able to answer an executor dispatch by running the SAME capture the real executor issues, and to fail every other dispatch immediately with a transport error. BO-3200a-1, BO-3200a-2, ACD-2100b-5 and the ACD-2100a and ACD-2100d records all exercise that environment; a per-test fake that returns canned output proves nothing about the capture and is forbidden."
  - "Must satisfy the repository error-handling policy: the capture is external I/O. A failure to launch, a missing directory or a timeout is logged at WARNING or higher and reported as a could-not-complete reason; it is never swallowed and never converted into an exit status."
  - "Must grant nothing the executor's registry entry (BO-3200f-2) does not state. This record adds no allow rule, settings entry or hook exemption that pre-approves executor commands as a class."
delivers_to:
  - agent: python-coder
    contract: "Executor dispatch helper. Input {command: str, cwd: str (absolute)}. Output either {outcome: 'completed', cwd: str (absolute, as run), exit_status: int, stdout: bytes, stderr: bytes} -- stdout and stderr are empty, never null, when nothing was emitted -- or {outcome: 'could_not_complete', reason: 'transport_failed' | 'incomplete' | 'declined' | 'guardrail_blocked' | 'invalid_dispatch', detail: str, blocked_by: str | null}. exit_status exists only on 'completed'. Consumed by BO-3200f-1-i (reason reporting), BO-3200f-3 (routing and repointing), BO-3200a-1, BO-3200a-2 and ACD-2100b-5. The harness stand-in answers executor dispatches with the same shape."
  - agent: llm-expert
    contract: "The exact capture invocation the executor's charter must issue for a dispatch {command, cwd}, and the rule that its reply is that invocation's output returned unchanged -- so BO-3200f-2's charter carries no output formatting of its own."
  - agent: reference-author
    contract: "The result shape above and the literal-execution rule (no classification step; a judgement request runs as a command and returns the shell's own failure), for BO-3200f-4."
