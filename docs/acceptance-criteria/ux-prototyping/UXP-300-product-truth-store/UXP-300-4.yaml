id: UXP-300-4
title: When the validator cannot load a dependency, its refusal names the module that actually failed
component: ux-prototyping
components:
- ux_prototyping
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the product-truth validator is run in an environment where jsonschema imports successfully
    but a module the contract checks depend on (for example `referencing`) cannot be imported,
  When the validator starts,
  Then it refuses to run and exits non-zero, exactly as it does when a dependency is missing,
  And its refusal message names the module that actually failed to import,
  And the message does not say that jsonschema is missing,
  And when that failing module is `referencing` while jsonschema is importable, the message states
    the installed jsonschema version and that it is too old to provide `referencing`,
  And when jsonschema itself cannot be imported, the refusal still says that jsonschema is missing.
