notes: |
  THE LAST SCENARIO IS THE DISCRIMINATOR FOR "EXERCISES NO JUDGEMENT". Asserting the absence of
  words like "permitted" is weak on its own -- an executor could paraphrase around them. Running
  the same judgement request against two registries whose true answers differ, and requiring
  that nothing in the result differs, is the shape only a party that did not look can pass. It
  is deliberately silent on HOW the executor gives no answer (carrying the text out literally and
  returning the shell's own failure, or returning a fixed statement that no exact command was
  received). Both satisfy it; choosing is the IT PO's.

  WHY THE DIRECTORY SCENARIO IS HERE. KI-ACD-009 cause 1 was a relative path that existed at the
  workspace root and not in the worktree the run started from. An executor that runs commands
  somewhere other than where the workflow believes reproduces that failure with a verbatim
  result. Where the SOURCE of a fact is located is BO-3200a-1-i's; this AC only requires the
  executor to run where it is told and say where that was.

  WHY THE ONE-COMMAND SCENARIO IS HERE. A helpful agent that acts on its output ("now run: git
  pull") is exercising judgement over what to do next. That is exactly what the charter forbids,
  and it is invisible in a result that only checks the dispatched command's output.

  SIZE IS NOT RESTATED HERE. A result of at least 130 kilobytes arriving whole is specified by
  BO-3200a-1's second scenario (for facts) and BO-3200d-1 (for large results in general). An
  executor whose reply is shortened in transit fails those; do not duplicate them.

  ASSIGNED AGENT, FOR THE IT PO TO CONFIRM. llm-expert because the executor is chiefly an agent
  charter. Registration is covered by BO-3200f-2. If the result's three-part shape needs code
  in the dispatch runtime, the IT PO should split that out rather than widen this record.

  BOUNDARY. BO-3200a is the RULE (facts are read at the source); this is the MEANS. BO-3200f-2
  owns "admits every exact command"; BO-3200f-1-i owns what a consumer reports when the dispatch
  itself does not deliver.

  IT-PO ENRICHMENT (2026-09-16).

  ASSIGNMENT: python-coder, not llm-expert, and no split. The byte-identical three-part result
  cannot be delivered by prompt text: it needs a deterministic capture at the moment the command
  runs, a verifying reader on the workflow side, and a harness stand-in that uses the same
  capture. The charter is still needed and still llm-expert's -- it is BO-3200f-2 and
  BO-3200f-2-i, which already own the charter by their titles. ORDERING CONSEQUENCE:
  BO-3200f-2 depends on this record, so the real executor agent does not exist when this lands.
  That is acceptable because every property here is proven on the capture and the verifier, and
  the one property only a live agent can show -- that it issues the capture and returns it
  unchanged -- is tested under BO-3200f-2. A reply that fails to do so is detected here anyway.

  THE LAST SCENARIO'S "HOW" IS DECIDED: literal execution. See it_requirements.

  CAVEAT -- NO NEW FILE IS NAMED. The capture needs a new script and the helper may need a new
  shared module; neither name is invented here, so the generated ticket's files_touched will
  list only the existing harness until the implementer names them. Surface this at ticket
  generation rather than letting a change-scope reviewer treat the new files as out of scope.

  USER DECISION NEEDED (security, shared with BO-3200f-2). An unattended workflow issuing
  executor commands will meet Claude Code permission prompts for any command the user's
  settings do not already allow. This record forbids shipping a blanket allow rule for the
  executor. Whether some command families (store reads, fast_lane.py subcommands) should be
  pre-allowed by explicit rule is a user decision; the default here is none.
