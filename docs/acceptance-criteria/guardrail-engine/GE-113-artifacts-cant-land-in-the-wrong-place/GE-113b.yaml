criteria: |
  Waving through unrelated structural changes never silently lets a misplaced artifact slip past.

  The escape hatch used to acknowledge intentional structural changes does not
  also suppress the misplaced-artifact check, so an artifact that landed in the
  wrong place is still caught even when the structural-change bypass is in play.
