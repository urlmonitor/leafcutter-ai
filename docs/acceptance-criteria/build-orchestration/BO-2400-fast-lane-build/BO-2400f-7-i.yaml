title: "Claim change fails to merge: do not build against an unclaimed state"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the fast-lane run has opened its status-only change to claim the resolved
    acceptance criteria,
  And that status-only change cannot be merged onto mainline (it conflicts with a
    change another run already merged, or its required checks do not pass),
  When the run detects the status-only change did not merge,
  Then the run does not begin its test or code work,
  And it reports a clear error stating the claim could not be recorded and naming the
    acceptance criteria it tried to claim,
  And it does not build against an unclaimed or partially-claimed state.
