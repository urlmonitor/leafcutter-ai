notes: |
  Amendment provenance (2026-08-24): this record was written against the
  original strictly-in-place design and was contradicted by the shipped
  workflow for an unknown interval. It is amended in place rather than
  superseded, per docs/how-to/ac-traceability-store.md ("How do I amend an
  existing AC?" — an amendment changes the criteria text; the AC ID does not
  change). Supersession in this store is reserved for a replacement record
  under a new ID (BO-520-1 -> BO-610-4, FIN-100c-3 -> FIN-100c-9).

  The Case A path is not a legacy fallback — it is the common case, and it is
  the reason /quick-fix still deserves the name. Isolation is the exception the
  environment forces, not the new default posture.
