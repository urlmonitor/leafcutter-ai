id: GE-130b-1
title: An override lets a change through on the shell path exactly when it lets the same change through
  with the editing tools, read from the one bypass declaration
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the single bypass-variable declaration BO-3200f-2-iii delivers, naming for each of the
    documentation guard, the guide-read guard and the task-lock guard its override variable and
    the value that bypasses it,
  And a caller for whom each guard honours its override on the editing path today,
  When that caller makes the same protected change once with the editing tools and once with a
    shell command, first with the override set in the environment the call runs in and then
    with it absent,
  Then for each of the three guards both changes are let through with the override set, and both
    are refused without it,
  And the command path recognises overrides from the same declaration the editing path reads, so
    no override variable or bypass value is honoured on one path and not on the other,
  And an override set only in the command's own text, for that command alone, is honoured for
    that caller exactly as the same override set in the environment is.
