it_requirements:
  - '''Shipped'' = templates/ (including templates/docs/) and config/, i.e. what build.py copies
    into an install (user decision at the IT-PO gate). Declare these roots positively in ONE
    place that the check and its tests share. Leafcutter''s own docs/ tree and the AC store
    are not scanned because they are outside the declared roots. There is no exclusion list
    of any paths or files.'
  - 'Detection: <scheme>://[<user>[:<password>]@]<host>:<port>[/<database>] for schemes postgresql,
    postgres and mysql. A concrete host plus port is an address even without credentials. Angle-bracket
    placeholders, ${ENV} references, {{config.*}} placeholders and prose that names the setting
    are not addresses.'
  - Report every hit as file:line and exit non-zero. On a clean run, exit 0 with a summary that
    states how many shipped files were scanned. A scan that found zero files must not report
    success.
  - Accept both the source roots and a build-output directory as scan targets.
  - 'Runs in the normal test suite (no _MANUAL marker) in under 10 s. It must not spawn build.py
    (CLAUDE.md): built-output coverage uses TQ-600a''s shared session layout once it lands,
    and until then a synthetic built tree.'
  - The pre-fix proof must use the real bytes of the five shipped source files (templates/agents/test-writer.md,
    templates/agents/test-runner.md, templates/workflows/test.md, config/skills_config.default.json,
    config/skills_config.schema.json) as they stood at the pinned pre-work commit e919a24f.
    If that history is unavailable (e.g. a shallow CI clone), fail closed; never skip silently.
  - The check itself contains no literal of the old address (no stale-default detection, NQ1).
  - 'Build order: the real-roots scan goes green only after INF-1100d-1 and INF-1100d-2 remove
    the addresses (both now in depends_on). The implementer must not make it green by editing
    those templates or config files itself.'
test_spec:
  - name: test_shipped_address_check_passes_on_current_shipped_roots
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: the shipped-address check CLI, run as a subprocess over the declared shipped
      roots templates/ and config/ (the normal-suite entry point)
    description: Over the real templates/ and config/ trees, the check exits 0 and reports a
      non-zero count of scanned files.
  - name: test_shipped_address_check_fails_on_pre_fix_sources_naming_every_file
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: real_artifact
    description: Over a temp shipped tree holding the five shipped source files' real bytes
      from commit e919a24f, the check exits non-zero and names each of the five files with a
      line number.
  - name: test_shipped_address_check_flags_reintroduced_address_with_file_and_line
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: criterion
    description: A template in a temp shipped tree that reintroduces postgresql://trader:trader@localhost:5403/LIVE,
      and another with a mysql://u:p@h:3306/d address, are each reported with file and line,
      with a non-zero exit (must_block).
  - name: test_shipped_address_check_scans_build_output_directory
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: deployed
    description: Pointed at a built-layout directory (TQ-600a's shared layout when available,
      otherwise a synthetic .leafcutter/.claude tree), the check flags an address in a built
      agent file.
test_rationale: 'This check is the behavioural proof for the whole L1, so it must be shown
  to fail on the real pre-fix bytes. A check that passes only on fixed sources proves nothing.
  The build-output half is honest about the build.py spawn ban: it uses the shared layout
  once it exists and a synthetic built tree until then.'
