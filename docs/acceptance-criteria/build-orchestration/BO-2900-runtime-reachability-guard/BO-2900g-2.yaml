notes: |
  GAP B of BO-2900g. The whole content of this AC is the word DERIVED.

  THE OBSERVED STATE. The declaration that routes work to the observable-change
  check is set on 0 of 2,888 records, while 460 leaf records assert a durable
  observable effect in their own Then clause. Neither authoring agent mentions
  the field. The routing mechanism (BP-1100f-5) is complete and correct and
  fires on nothing.

  WHY A BACKFILL IS NOT THE FIX, AND WHY THAT IS AN AC AND NOT A NOTE. Sweeping
  the 460 closes the gap for exactly as long as it takes to author record 2,889.
  This is the identical shape of EPIC-ComputedQualityGates FP-1 layer 2, where
  no AC in a 1,802-record store carried the computed axes and every test fed
  hand-built dicts that already contained them. The property that survives is
  "the declaration falls out of what the work already says"; the L3
  (BO-2900g-2-i) is where that property is made falsifiable, because it is not
  observable from any single authored record.

  THE NEGATIVE CLAUSE IS LOAD-BEARING. A derivation that marks everything is
  indistinguishable from a derivation that marks nothing, one gate later: it
  routes every piece of work to the observable-change check, the check becomes
  noise, and someone switches it off. BP-1100f-5-i already established that the
  exemption must be data-driven and never by item name; this AC's second work
  item is the authoring-side statement of the same rule.

  THE RECURSION. The work that closes this gap writes to a record store, which
  is a durable observable change. Its own records must therefore carry the
  declaration. If they do not, the derivation does not work on the first real
  input it is given.

  BOUNDARY. Authoring only. This AC does not describe what the declaration
  causes — that is BP-1100f-5, which is done — and it produces no gate, block or
  done-state consequence.

  IT-PO ENRICHMENT NOTE (2026-08-17). Verified at HEAD: declares_side_effect is
  a legal top-level property in config/ac_store_schema.json (root is
  additionalProperties: false, so this had to land first) and the only code that
  reads it is generate_ticket_from_ac.py. This AC's own record is among the first
  in the store to carry declares_side_effect: true. it_requirements uses the
  package-surface OBJECT form mandated by the schema's root if/then;
  reference_file_path names the shared validators module so one implementation
  can serve both the pre-commit gate and the bulk/CI path.
