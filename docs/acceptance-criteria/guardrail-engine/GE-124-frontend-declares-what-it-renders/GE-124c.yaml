roadmap_phase: phase_1
criteria: |
  Screen work that says nothing about what it serves does not get committed.

  When you change a screen component, you are stopped before the change lands if
  it carries no statement of the requirement it serves, or if the requirement it
  names does not exist. You are told which of those two things went wrong, on
  which file, and what to do about it — and you are told it once, not once per
  place it could have been noticed.
