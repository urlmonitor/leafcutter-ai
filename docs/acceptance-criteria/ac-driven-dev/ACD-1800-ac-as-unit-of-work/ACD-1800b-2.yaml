  - name: test_requirement_done_when_all_deliverables_signed
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "Once the remaining deliverable is signed off, the requirement is reported done."
  - name: test_done_computed_solely_from_per_deliverable_signoffs
    target_dir: unit_tests/ac_store/
