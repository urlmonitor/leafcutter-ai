id: BO-2000a-2-i
title: "A claim with a recorded command but missing captured output is rejected as incomplete evidence"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a self-hosting non-regression claim that includes the recorded command
    that was run but is missing the captured output of that run,
  When the fulfillment gate / validator evaluates the claim,
  Then the claim is rejected as incomplete evidence,
  And the rejection message states that the recorded output is missing and that
    both the command and its captured zero-new-violations output are required,
  And the claim is not marked as a passing self-hosting non-regression result.
depends_on:
  - BO-2000a-2
