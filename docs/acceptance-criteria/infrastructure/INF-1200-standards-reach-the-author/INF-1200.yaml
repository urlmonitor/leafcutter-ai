roadmap_phase: phase_1
criteria: |
  Standards reach the author before the work, not after it.

  Your project decides things like how long a file of a given kind may get.
  Today those decisions live where they are enforced, and the usual way anyone
  finds out about one is to be turned away once the work is already written.
  After this goal, a standard for a kind of file is stated once, in one place,
  and everyone who works on that kind of file knows it before they begin.
  Setting a new standard, or covering a new kind of file, is a single decision
  that takes effect everywhere — nobody goes round updating each specialist by
  hand, nobody is held to a figure different from the one they were given, and
  anyone still uninformed is visible rather than silently missed.
