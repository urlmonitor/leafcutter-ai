id: BO-2400f-8-i
components:
  - build_orchestration
title: "Partial-overlap set: build the todo members, skip the claimed ones, clean no-op if empty"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a resolved connected build set contains a mix of acceptance criteria: some
    with work_status todo and some already with work_status in_progress from another
    in-flight run,
  When the run claims and builds the set,
  Then only the todo acceptance criteria are claimed and built,
  And the already-in_progress acceptance criteria are excluded and named in the run's
    message,
  And the run proceeds with the remaining todo criteria rather than aborting the whole
    run,
  And if excluding the already-claimed criteria leaves nothing to build, the run
    reports "nothing to build" and exits cleanly without opening a build pull request.
depends_on: [BO-2400f-8]
