it_requirements:
  - "The vocabulary must be declared once and read by both the classifier surface and the harvester — a second hand-maintained copy re-creates the drift this AC exists to close"
  - "Enforcement belongs at the emission helper, not only at the harvester: a free-hand JSON append by an agent is how the 15 uncontrolled values arose"
  - "A vocabulary member with no routing rule must fail the check, not fall through to a default surface"
  - "Must handle errors gracefully per the project error handling policy"
