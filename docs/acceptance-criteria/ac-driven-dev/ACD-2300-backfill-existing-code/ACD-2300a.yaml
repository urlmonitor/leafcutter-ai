criteria: |
  Behaviour already in your code is proposed as criteria you accept or reject.

  Working through the code the project already has, the behaviour it exhibits is
  written up as candidate criteria in your own terms, each one carrying the code
  it was drawn from as its evidence. You accept, amend or reject each proposal.
  Nothing enters the record because a tool decided it should.
