it_requirements:
  - "DECIDED POLICY (final gate): ADMIN OVERRIDE IS ALLOWED as an emergency path. Branch protection does NOT enable the GitHub 'Do not allow bypassing the above settings' / 'include administrators' option, so an administrator may perform an emergency admin-merge. For NORMAL (non-admin) merges the test check AND the lint check remain hard-required and cannot be bypassed."
  - "Settings-as-code implication: the branch-protection script from BP-1200c-1 must set enforce_admins = false (admins exempt) while keeping the required-status-checks (lint + test) strict for everyone else. This is the configuration this AC verifies."
  - "The not-mergeable outcome for NON-ADMIN actors must hold for BOTH absence (check never ran) AND failure (check ran red) — a required-but-not-reported check must leave the PR un-mergeable for normal merges, not auto-pass."
  - "Verification of the enforcement property is an inspection/exercise of the branch-protection configuration produced by BP-1200c-1 (settings-as-code); confirm enforce_admins=false and required-status-checks strict via the GitHub API."
  - "EMU/account caveat: verifying merge-blocking via the API requires the non-EMU urlmonitor account (gh auth switch --user urlmonitor; verify with gh auth status)."
  - "CAVEAT — CRITERIA/POLICY MISMATCH (IT-PO cannot resolve): the criteria prose still asserts that an administrative merge does NOT succeed (no-bypass INCLUDING admins). The decided policy permits an emergency admin override. The criteria text must be amended by the Business Analyst to permit emergency admin-merge while keeping checks hard-required for normal merges. IT-PO does not edit the criteria field; this mismatch is flagged for BA follow-up before implementation begins."
