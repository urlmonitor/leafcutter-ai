criteria: |
  Given three recorded findings — two emitted by the documentation-verification gate with
    rule identifier "how-to-missing-for-trigger" on two different tickets and with
    different detail prose, and one emitted by the same gate with rule identifier
    "reference-doc-missing-for-trigger",
  When each finding's signature is computed,
  Then the signature is derived from exactly two inputs — the emitting gate and the rule
    identifier — and from nothing else,
  And the two "how-to-missing-for-trigger" findings share one identical signature while the
    third has a different one,
  And changing only the free-text detail of a finding leaves its signature unchanged,
  And changing only the file, ticket, or artifact the finding was raised against leaves its
    signature unchanged,
  And an aggregate over the recorded findings reports that shared signature with an
    occurrence count of 2 spanning 2 tickets, so a problem that fires four times in one epic
    is reported as one problem with a count of four rather than four unrelated paragraphs.

  Given a finding mined from the frozen historical corpus, which carries an emitting agent
    and prose but records nothing about the kind of artifact it was raised against,
  When its signature is computed,
  Then a signature is produced for it from the two inputs alone,
  And no input that the historical record does not carry is required in order to signature
    it, so the mined findings are countable rather than excluded for want of a field that
    was never written.
