notes: |
  Reporting a total at the source achieves nothing if the next tool drops it. The defect
  is not one verifier failing to print a number, it is the figure evaporating at a hop
  and every later tool confirming a number nobody computed.

  ==========================================================================
  TWO HOPS, NOT THREE (2026-08-13, expert review).
  ==========================================================================
  The original text required the figure to survive "a chain of three verifiers". Only
  TWO real hops exist in the store today: scan_ac_store.py produces the answer,
  ac_prioritizer.py consumes it as JSON over a subprocess boundary and merges it with
  prioritize.py's output, and the AC build selector consumes that. Naming a third hop
  would have made the AC unimplementable against the real system and invited a synthetic
  third verifier written only to satisfy the test. The criterion now names the two real
  hops and, separately, the property that actually matters — survival across a
  SERIALISATION boundary, which is where the figure is really at risk.

  ==========================================================================
  THIS AC RAISES ITS OWN HALT (2026-08-13, expert review).
  ==========================================================================
  The original clause said a verdict with no inherited coverage figure "halts under
  ACS-1100c-1". It does not type-check: ACS-1100c-1's only halt trigger is an arithmetic
  shortfall (covered + declared exclusions != total), and a missing figure is not a
  shortfall — there is no arithmetic to fail. Rather than widening ACS-1100c-1's trigger
  set (which would blur the reconciliation contract that ACS-1100c-2 mirrors), this AC
  now defines its own dropped-coverage halt with the same withhold-rather-than-pass
  posture. Two distinct triggers, one posture.

  Distinct from ACS-1100d-2: this AC governs PROPAGATION (the figure survives the hop),
  d-2 governs the CAP (what the verdict may claim given that figure).

  OPEN — NOT DECIDED HERE: nothing in this AC fixes a persistence surface for the
  carried figure. "Carries the figure" is satisfied by an in-process return value or by
  a serialised payload; whether a durable sink is also required is the pending
  write-surface question (ticket "## Comments" versus a durable JSONL sink) and is
  deliberately left open for the IT PO.
