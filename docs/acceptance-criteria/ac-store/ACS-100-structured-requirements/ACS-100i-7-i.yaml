notes: |
  Without this, ACS-100i-7's headline result — "zero records refused on this
  rule" — is indistinguishable from a run that validated nothing at all. That is
  not hypothetical: the store-wide sweep prescribed in CLAUDE.md was itself a
  no-op from 2026-08-10 to 2026-08-18 because it passed a bare directory, and the
  validator exited 0 having examined no files. The first two scenarios prove the
  gate still bites inside the whole-store pass; the third proves the pass was a
  pass.
