criteria: |
  Guidance you can trust, because it reflects real behaviour not a stale belief.

  The recorded explanation of how this system hands work to specialists says what
  is actually true of it. Where a past decision was written down on a belief that
  has since turned out to be false, the record is corrected in the open — the old
  decision is kept and marked as superseded, so anyone reading later can see both
  what was believed and what replaced it.
