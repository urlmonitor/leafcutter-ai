roadmap_phase: phase_1
criteria: |
  No guesswork — the demand travels with the request, exactly as it was stated.

  Whatever the standard asked for is carried across intact: which file is at
  issue and how much has to come out of it. The specialist never has to work out
  the demand for itself or guess at it, so it cannot answer a different question
  from the one that was actually asked.
