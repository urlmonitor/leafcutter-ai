id: GE-123e-3
components:
  - commit_guardian
title: "The refusal names each heading at fault and the real way to get an id, and offers no way round the check"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a scratch repository with the commit checks installed,
  And a staged change to the ticket file "tickets/00_inbox/TICKET-demo.md" that
    appends two sign-off headings, each with no feedback-id line:
    "### 2026-11-16 10:00 — python-coder (status: ok)" and
    "### 2026-11-16 10:20 — pr-reviewer (status: ok)",
  When the change is committed with an inline message and is refused,
  Then the refusal names the ticket file "tickets/00_inbox/TICKET-demo.md" and
    quotes each of the two headings in full,
  And it names the feedback submission script "scripts/feedback/submit_feedback.py"
    and the sign-off skill's section §2a as the way to obtain a real feedback id,
  And it says that the id that script prints goes on a feedback-id line beneath
    the heading,
  And it says that an entry which signs nothing off carries the line
    "feedback-id: (not-a-signoff)", and names no other value or convention for
    such entries,
  And it does not offer typing a feedback-id line by hand, without running that
    script, as a remedy for a sign-off.

  Given the same refused commit,
  When the whole refusal text is searched,
  Then it contains neither the token "[NO-FEEDBACK-CHECK]", nor any instruction to
    add a word to the commit message, nor the name of any setting that switches
    the check off,
  Because a refusal that keeps offering a dead escape hatch sends every reader down
    a dead end, and one that says only "add a line" invites the hand-typed id that
    the record then cannot tell apart from a real one.

  Given a staged ticket change that appends only the python-coder heading above,
    with no feedback-id line,
  When it is committed through the shared commit step and is refused,
  Then the refusal quotes only that one heading and carries the same remedy text
    as the inline-message refusal.

  Given that same refusal on the shared commit step, which routes a refusal from
    this check to its automated fix-up,
  When the automated fix-up repairs the ticket,
  Then the feedback-id line it puts beneath the python-coder heading carries the
    id printed by a run of "scripts/feedback/submit_feedback.py" that the fix-up
    made for that sign-off, or "feedback-id: (not-a-signoff)" when the entry signs
    nothing off,
  And it never puts beneath a heading a feedback-id value that no run of that
    script printed,
  And the instruction the fix-up is given names that script and the sign-off
    skill's section §2a as the only source of an id, names
    "feedback-id: (not-a-signoff)" for entries that sign nothing off, and does not
    tell it to add a feedback-id line by any other means,
  Because a refusal that stops inviting the hand-typed id is undone if the
    automated repair it routes to still types one.
