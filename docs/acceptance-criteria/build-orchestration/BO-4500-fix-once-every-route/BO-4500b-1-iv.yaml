id: BO-4500b-1-iv
title: "Blocks marked one inside another, or overlapping, fail the install naming both blocks"
component: build-orchestration
components:
  - build_pipeline
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500b-1.yaml"
criteria: |
  Given route B's template, in this order, marks ALPHA-ANSWER start, BETA-ANSWER start,
    BETA-ANSWER end, ALPHA-ANSWER end,
  When the package is installed,
  Then the install fails with a message naming route B, the blocks ALPHA-ANSWER and BETA-ANSWER,
    the line of each start marker, and stating that BETA-ANSWER is marked inside ALPHA-ANSWER,
  And every installed route is byte for byte as it was before that install began.

  Given route B's template, in this order, marks ALPHA-ANSWER start, BETA-ANSWER start,
    ALPHA-ANSWER end, BETA-ANSWER end,
  When the package is installed,
  Then the install fails with a message naming route B, the blocks ALPHA-ANSWER and BETA-ANSWER,
    the line of each start marker, and stating that the two blocks overlap,
  And every installed route is byte for byte as it was before that install began.
depends_on: [BO-4500b-1]
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500b-1.yaml
    relationship: parent
    status: exists
assigned_agent: python-coder
estimated_complexity: S
package_surface: false
it_requirements:
  - >-
    Nesting and overlap are detected from the order of markers within one route template, for
    any pair of distinct block names. The check is not limited to the block names in the
    fixture.
  - >-
    Two separate, non-overlapping places for the SAME block in one route stay allowed
    (BO-4500b-1). The check must not refuse them.
  - >-
    The message names both blocks and the 1-based line of each start marker, and the check runs
    in BO-4500b-1's validation pass, before any installed route is written.
delivers_to: null
expects_from:
  ac_id: BO-4500b-1
  contract: >-
    BO-4500b-1's marker grammar (start/end lines carrying a block name) and the
    validate-all-then-write fill.
test_intent:
  - clause: the install fails with a message naming route B, the blocks ALPHA-ANSWER and BETA-ANSWER, the line of each start marker, and stating that BETA-ANSWER is marked inside ALPHA-ANSWER
    needs_test: true
    reason: A nested block makes the outer copy depend on two sources, and a fill that accepts it ships text the identity check can never match.
  - clause: every installed route is byte for byte as it was before that install began
    needs_test: true
    reason: Both failing scenarios must leave the installed set untouched, which a write-as-you-go fill would break.
  - clause: the install fails with a message naming route B, the blocks ALPHA-ANSWER and BETA-ANSWER, the line of each start marker, and stating that the two blocks overlap
    needs_test: true
    reason: Overlap is a distinct ordering from nesting, and a check that handles only nesting would let it through.
origin_agent: business-analyst
created: 2026-10-20
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  Nesting is refused rather than supported: a block whose text is filled inside another block's
  place would make the outer block's installed text depend on two sources, so its identity check
  against its own source could never pass. Two separate, non-overlapping places for the SAME block
  in one route are not covered here and are allowed by BO-4500b-1.
