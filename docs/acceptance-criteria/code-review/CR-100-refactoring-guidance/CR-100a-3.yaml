id: CR-100a-3
title: "Core review method holds no catalogue; findings carry the named smell"
component: code-review
components:
  - review_system
level: L2
status: active
req_status: active
work_status: done
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the shared core review method (the review-for-code-smells skill),
  When its content is inspected,
  Then it defines the review method, severity rubric, and finding format but
    does NOT itself enumerate the twelve Modern smells (the catalogue lives in
    the two bucket skills),
  And the finding format it defines requires every emitted finding to carry a
    title that names one specific, recognised Fowler code smell plus a
    "what's wrong" explanation,
  And a finding whose title is a generic warning rather than a named smell does
    not satisfy the format.
depends_on:
  - CR-100a
doc_links:
