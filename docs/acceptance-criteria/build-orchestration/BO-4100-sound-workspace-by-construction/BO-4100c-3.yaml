notes: >-
  Separately failable from BO-4100c-2 and the more dangerous of the two: an unreadable
  workspace is the one most likely to be the damaged one worth keeping, and the natural
  implementation reads an unanswerable question as an absence of findings, which lands
  on holds-nothing and disposes of it. Keeping the two refusals distinguishable matters
  because they need opposite follow-ups -- deliver the work, versus repair the workspace.
