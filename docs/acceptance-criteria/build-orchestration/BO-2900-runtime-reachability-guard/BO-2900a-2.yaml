notes: |
  This AC exists because BO-2900a-1 is otherwise trivially satisfiable by the very
  defect it prohibits, and that is not a hypothetical.

  THE SELF-DEFEATING IMPLEMENTATION. The cheapest way to answer "did this test go in
  through the way in" is to search the test file for the name of the entry point, or
  for a subprocess invocation of the module. That implementation is a presence scan.
  It stays green on a test that mentions the entry point and never runs it, and it
  goes red on a test that reaches the entry point through a fixture or a helper whose
  text does not name it. Shipping BO-2900a-1 on a source scan would put a
  phantom-done guard inside the phantom-done guard — which is precisely how the
  fast-lane runner shipped: its structural tests were green while its gates never
  executed.

  WHY THE THREE DECOYS IN TEST Q ARE NAMED INDIVIDUALLY. A comment, a docstring and
  an uncalled helper are the three forms a partial implementation typically survives:
  a naive substring scan is fooled by all three; a scan that strips comments is still
  fooled by the docstring and the dead helper; an import-graph scan is still fooled by
  the dead helper. Naming all three makes the fixture adversarial rather than
  illustrative. The final clause — delete every mention and the verdict is unchanged —
  is the decisive assertion; it is a property no text-based implementation can satisfy.

  BOUNDARY. This AC governs the METHOD of the determination only. What the
  determination is used for is BO-2900a-1; what happens when there is no way in at all
  is BO-2900a-3; the wording of the resulting refusal is BO-2900e. Do not restate any
  of those here.

  Implementation caution for the IT PO: whatever observation mechanism is chosen must
  itself be exercised end to end. An observation harness that silently records nothing
  makes every test look like test Q and blocks the whole store; one that records
  everything makes every test look like test P and restores the original defect. The
  fixture pair in the criteria is the minimum viable check, and both verdicts must be
  asserted in the same run — asserting only the rejection lets a
  reject-everything implementation pass.

  2026-08-13 (IT PO enrichment). Mechanism chosen: a call-level execution recorder
  (sys.monitoring, sys.setprofile fallback) rather than coverage.py line/arc data.
  Coverage arcs answer "was this line executed" but carry no call-stack ancestry, and
  ancestry is exactly what BO-2900a-1-i's reached-through-versus-entered distinction
  requires. The observation_ok flag is added as an explicit third state precisely
  because the IT PO caution above names two silent failure modes that no verdict-only
  assertion can detect.
