notes: |
  Satisfies the how-to entry in TQ-400c's documentation_triggers.

  NO RECURRING SCHEDULE EXISTS TODAY. Verified 2026-08-17: every workflow in the
  repository is event-driven and none carries a recurring trigger. So unlike the
  TQ-400a how-to, this guide documents a surface that TQ-400c-1 creates. That
  makes the publication-accuracy clause the sharpest one here: the guide must be
  written against the schedule as delivered, because there is no incumbent
  behaviour to fall back on and a plausible-sounding generic account would be
  indistinguishable from a correct one until someone tried to change the cadence.

  AUTHORING DEPENDENCY — NOW RESOLVED (2026-08-18). This note previously recorded
  TQ-400c-2's routine-status surface as an unsettled blocking ambiguity. The user
  has settled it: the pull-request check list, as a non-blocking entry on every
  pull request, reading alongside "Proof-of-done coverage check (BO-2500b)" and
  publishing the last completed scheduled occurrence's figures. The fourth clause
  is therefore writable. What the resolution does NOT relax: the guide must send
  readers to that surface and no other, and must not fall back on a placeholder if
  the surface is not yet built when the guide is drafted — sequence the guide after
  TQ-400c-2 ships.

  Written as reader outcomes rather than "a guide exists" because a cadence
  how-to is the easiest of all to satisfy with a page that restates the
  schedule's configuration. The two clauses that cannot be faked are the
  round-trip ones: the reader triggers a run and sees its report, and the reader
  finds real figures at the surface the guide names.

  IT-PO ENRICHMENT NOTE (2026-08-18) — THE BA'S FLAG WAS MADE A GATE, NOT A
  WARNING. The BA asked at enrichment that the TQ-400c-2 ambiguity be acted on.
  It was recorded three times over, deliberately: as the first and most emphatic
  it_requirement, inside the expects_from contract for TQ-400c-2 (so a generator
  reading contracts sees it), and inside the real_artifact test entry (so the test
  contract could not be satisfied by pointing at a guessed path). The reason for the
  redundancy was that the failure mode is not an implementer ignoring a warning —
  it is an implementer finding the ambiguity, reasonably picking the most
  plausible surface, and shipping a guide that reads perfectly and sends every
  reader to the wrong place. A single note in a notes block does not stop that.
  The gate did its job: the decision was escalated to the user and settled on
  2026-08-18, and all three records are converted to carry the settled surface.
