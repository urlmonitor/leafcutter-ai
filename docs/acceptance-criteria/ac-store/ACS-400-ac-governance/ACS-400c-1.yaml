title: "New AC creation records origin_agent identifying the author"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a new AC YAML file is staged for commit with a populated criteria field,
  When the governance check inspects the file,
  Then the file must contain a non-empty origin_agent field,
  And the origin_agent value must match the identity of the committing agent,
  And if origin_agent is absent or empty, the commit is blocked with an error
    stating "new AC file requires origin_agent to identify the criteria author".
