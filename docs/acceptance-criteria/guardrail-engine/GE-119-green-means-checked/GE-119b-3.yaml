notes: |
  WHY THIS IS A SEPARATE AC FROM GE-119b-1. The two observed failures look alike from the
  outside — a check quietly does less than it promises from a worktree — but the prerequisite
  kinds differ: GE-119b-1 is a failed MODULE IMPORT, this is a failed DATA FILE lookup. An
  implementation that fixes module resolution and calls the family done leaves every
  config-reading and data-reading check exactly as broken as before, while the canonical
  reproduction turns green. That is a realistic partial fix and this AC is what prevents it.

  The final clause exists for the same reason at a smaller scale: fixing the one observed
  schema path is a fourth point patch. Requiring a second, different data prerequisite forces
  the resolution to be general.

  PAIRED WITH GE-119a-3, NOT REDUNDANT WITH IT. This AC makes the schema reachable; GE-119a-3
  makes the check announce it when it is not. Both are needed — GE-119b-3 cannot cover every
  future environment, and GE-119a-3 alone leaves the check honestly reporting that it did
  nothing.
