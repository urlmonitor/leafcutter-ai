title: "Pre-PR review re-verifies bulk/quantitative data-claim ACs against the real data store"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1400-trustworthy-pre-pr-review/BO-1400a.yaml"
criteria: |
  Given a ticket under pre-PR review whose acceptance criteria contain a bulk or
    quantitative claim about a whole body of stored records (for example "every stored
    record validates against the new shape", "no currently-valid record is rejected",
    or "all N records match")
  When the pre-PR self-review reviews the working diff for that ticket
  Then the review independently runs the asserted validation across the real data store
    (every real record, not a sample and not the implementer's self-reported count)
  And the review reports the actual pass count and fail count it observed against the
    real records
  And the review raises a blocking finding when the observed real-data result contradicts
    the bulk/quantitative claim in the acceptance criteria (for example the AC claims
    every record validates but the real-data run rejects some records)
  And the review cannot return a clean verdict on that claim while relying only on a
    sample or on the implementer's reported figure
