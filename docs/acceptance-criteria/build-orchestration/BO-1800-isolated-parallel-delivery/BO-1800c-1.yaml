it_requirements:
  - "Cap agents-PER-feature (~3-4) as a drive-runbook rule on the building-epics skill surface (templates/skills/building-epics/SKILL.md); this is runbook/prose guidance the ticket-supervisor follows, not a new module (ADR-018 Decision §3, Migration §6)."
  - "The runbook rule MUST state that adding agents beyond the per-feature cap is prevented or held rather than piling on more concurrent collaborators — this is the axis where coordination overhead and error amplification appear (Google/MIT scaling evidence)."
  - "This cap is distinct from the uncapped features-in-flight axis (BO-1800c-2) and MUST NOT be conflated with it."
