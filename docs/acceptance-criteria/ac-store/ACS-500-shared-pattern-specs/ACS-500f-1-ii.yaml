it_requirements:
  - "The staged-file discovery must resolve the project root the same way the Phase 1 HEAD-version loader resolves it (the existing _load_head_yaml project-root resolution), then bind the staged-diff invocation to that root (e.g. git -C <project_root> diff --cached) rather than relying on process cwd."
  - "Self-hosting parity (ADR-001): the deployed hook scripts/commit_guardian/check_ac_schema.py AND the packaged template templates/scripts/commit_guardian/check_ac_schema.py must be changed together and verified in parity via the build.py round-trip — never edit one side only."
  - "When project-root resolution fails, the hook must fail open (exit 0, commit not blocked) and emit a diagnostic naming the hook and the failure to stderr, consistent with ACS-500f-1-i — do not let the hardening introduce a fail-closed regression."
  - "No regression on the normal cwd-at-root pre-commit path: the modified-file set detected after the change must equal the set detected before for that path."
  - "Wrap the git subprocess invocation per the project error handling policy (typed exception, log or re-raise); do not swallow a git failure silently."
