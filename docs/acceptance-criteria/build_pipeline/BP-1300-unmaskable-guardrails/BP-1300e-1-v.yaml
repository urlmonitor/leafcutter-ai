it_requirements:
  - "WHERE THE REQUIRED VERSION COMES FROM -- THE FILE CI INSTALLS FROM, NEVER A COPY. The required version is read from the pip requirements file that the project's CI installs its linter from. For this repository that is requirements-dev.txt (line 29 `ruff==0.15.15`), which ci.yml's lint job installs via `pip install -r requirements-dev.txt`; ci.yml itself carries no version string. leafcutter-lint.json (BP-1300e-1-i) gains ONE OPTIONAL key, `linter_version_source`: a repo-relative POSIX path (same path rules as steps[].paths: no globs, no absolute, no '..') naming that requirements file. It holds a PATH, never a version string. This repository's leafcutter-lint.json sets it to \"requirements-dev.txt\". REJECTED: a version field in leafcutter-lint.json that requirements-dev.txt is checked against -- that is two copies of the version, so changing the pin CI installs from would itself refuse every commit until the second copy was edited, which fails scenario 5 ('no second copy of the version needed editing')."
  - "DEFAULT AND ADOPTERS. `linter_version_source` absent (or leafcutter-lint.json absent) means the single default constant \"requirements-dev.txt\", declared ONCE in the same module as BP-1300e-1-i's default scope -- so an adopter whose requirements-dev.txt pins ruff exactly is checked with no configuration (scenario 7), and an adopter whose CI installs from another file declares that file's path in `linter_version_source`. This package's own pin is never consulted in an adopter project: the source is always resolved against the subject root (BP-1300e-1-iv). No version check applies -- stated in the output, scenario 8 -- when (a) the key is absent and the default file does not exist, or (b) the resolved file exists but contains no ruff requirement, or only a non-exact one. The no-check line must name the file that was consulted (or that none existed) and say that no exact linter version is declared for the project, so no version check was applied. An EXPLICITLY declared `linter_version_source` that does not exist or cannot be read is NOT 'undeclared': it is could_not_check, reason linter_version_source_unreadable, naming the path -- a declared source that silently stops being read would turn the check off without anyone deciding to."
  - "WHAT COUNTS AS AN EXACT PIN. Parse the requirements file as pip does for the linter's line: name compared PEP 503-normalised ('ruff', case-insensitive, '-'/'_'/'.' equivalent), comments and blank lines ignored, line continuations joined, `-r`/`--requirement` includes followed relative to the including file and confined to the subject root (CI's pip follows them too). Exact = a single `==<version>` specifier with no wildcard. `==0.15.*`, `>=`, `~=`, `!=`, a bare name, or no ruff line at all = not exact (no check, stated). Any of these is could_not_check, reason linter_version_source_unreadable, naming the file and line: two different exact ruff pins across the file and its includes; a ruff line carrying an environment marker; `===`; an include that escapes the subject root or cannot be read. Parsing is stdlib-only (no `packaging` import: hooks run in adopter environments where it is not guaranteed); the pure parser has no try/except."
  - "WHERE IT IS READ FROM, PER MODE -- SAME RULE AS THE DECLARATION. Staged mode reads the version source (and any include) from the INDEX (`git show :<path>`), so a commit that bumps the pin is judged against the version it will commit; full and files modes read the working tree (identical to the committed file in a CI checkout). Same split as BP-1300e-1-i's _lint_scope.load(source=...)."
  - "COMPARISON IS EXACT STRING EQUALITY. The local version is the version token from the locator's single `<prefix> --version` probe (BP-1300e-1-iii; e.g. 'ruff 0.15.14' -> '0.15.14'). Mismatch = the two strings differ character for character. Older and newer both refuse. No range, semver or 'same minor' logic exists anywhere in the check. An unparseable --version output is could_not_check, reason ruff_failed_to_start (the locator's failure), never 'no check'."
  - "OUTCOME: could_not_check, NEW REASON linter_version_mismatch, EXIT NON-ZERO. A mismatch is a 'could not reach CI's verdict' refusal, not a findings refusal: it uses BP-1300e-1-iii's could_not_check outcome and its BLOCK disposition (pre-commit prints Passed beside any exit 0). The reason line names the local version, the required version and the file it was read from, and gives an install command for exactly the required version against the interpreter the locator probed: `<sys.executable> -m pip install ruff==<required>` (so the module form, which the locator tries first, finds it next time). Two new reasons join -1-iii's vocabulary: linter_version_mismatch and linter_version_source_unreadable."
  - "ORDER OF DECISIONS -- AND NO FINDINGS UNDER THE WRONG VERSION. (1) Compute the in-scope staged set from the declaration and git alone; empty -> nothing_to_inspect, exit 0, and neither the version source nor the linter is consulted (scenario 6). (2) Locate and probe ruff (-1-iii). (3) Resolve the version source and compare. (4) Only on a match, or on 'no exact version declared', run the declared steps. On a mismatch ruff check is NOT run over any file, and the --json payload carries findings: [] -- the simplest way to guarantee scenario 2 (no finding presented as CI's verdict). Do not print findings 'for information'."
  - "EVERY RUNNER APPLIES IT, BY CONSTRUCTION, NOT BY COPY. The check lives inside check_lint_gate.py and runs identically in --mode staged, full and files. run_ci_local.py (which BP-1300e-1-i points at --mode full) and BO-570-3's sign-off adapter (--mode files --json) therefore apply it with no code of their own; BO-570-3 maps could_not_check -> tooling-unavailable and carries the reason. No runner holds its own version string or its own requirements parser. The edit-time hook templates/hooks/check_exception_handling_hook.py is NOT a CI mirror and does not apply this check (it stays self-contained per GE-108e)."
  - "CI'S OWN RUN CANNOT FAIL THIS CHECK SPURIOUSLY -- GUARANTEED, NOT ASSUMED. In ci.yml's lint job the installed version and the required version come from the SAME file in the SAME checkout: `pip install -r requirements-dev.txt` installs exactly the `==` pin the check then reads from requirements-dev.txt, and the gate step runs in the same job under the same setup-python interpreter, so the locator's module-form probe sees the version pip just installed. Hold that with a binding test that parses the REAL .github/workflows/ci.yml with a YAML parser and asserts: the lint job installs with `pip install -r <F>` (or `python -m pip install -r <F>`) where <F> equals the version source resolved from the REAL leafcutter-lint.json; the gate step comes after that install in the same job; and no step of the lint job installs, upgrades or pins ruff any other way (no other `pip install` naming ruff, no `ruff==` anywhere in ci.yml). If those ever diverge the outcome is a visible red required check (could_not_check, non-zero), never a silent pass -- the check fails closed in CI too."
  - "JSON PAYLOAD. check_lint_gate.py --json gains, in every mode: required_ruff_version: str|null, version_source: str|null (repo-relative path consulted, null when none existed), version_check: 'matched'|'mismatched'|'not_declared'|'not_reached' ('not_reached' on nothing_to_inspect and on any could_not_check decided before step 3). The existing ruff_version field keeps its meaning. The human output always names the linter version used when one was probed (scenarios 4 and 8)."
  - "SCHEMA OF THE DECLARATION. BP-1300e-1-i's hand-written validator rejects unknown keys; `linter_version_source` must be added to its known-key set as optional and validated with the same path rules, in the same change -- otherwise every leafcutter-lint.json that declares it is refused as malformed. The helper that reads the requirements file lives in templates/scripts/commit_guardian/ (underscore-prefixed, stdlib only, no {{config.*}} tokens -- build.py's inject_config rewrites contiguous config literals in deployed .py), beside _lint_scope.py, so build_commit_guardian()'s rglob deploys it without a deploy_map edit."
  - "ERROR-HANDLING POLICY (CLAUDE.md Rules 1-4): reading the version source (git show / open) is wrapped in a specific except (OSError, subprocess.SubprocessError, UnicodeDecodeError), logged at WARNING and converted to could_not_check reason linter_version_source_unreadable; the pure requirements parser and the version comparison have no try/except."
test_spec:
  - name: test_bp_1300e_1_v_older_ruff_refuses_clean_commit_naming_both_versions_and_install_command
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    must_catch:
      - "warns about the version but exits 0"
      - "prints an install instruction that does not pin the required version"
    description: "A stub ruff module on the hook interpreter's path answers --version with 'ruff 0.15.14' and delegates every other call to the real ruff; fixture requirements-dev.txt pins ruff==0.15.15; a clean staged in-scope .py: commit refused, output names 0.15.14 and 0.15.15, contains an install command with ruff==0.15.15, RESULT: could_not_check with reason linter_version_mismatch, and pre-commit's line for the hook reads Failed, never Passed."
  - name: test_bp_1300e_1_v_mismatch_with_e741_presents_no_finding
