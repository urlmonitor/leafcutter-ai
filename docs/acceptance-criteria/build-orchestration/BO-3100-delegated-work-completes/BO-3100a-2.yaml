notes: |
  The parent L1 is explicit that the surveyed counts — roughly 25 records with cleared
  recipients, roughly 30 definitions holding the means, 9 mismatches — are evidence to
  verify, not scope, and "must be re-measured at build time rather than hard-coded into a
  test". This AC is that instruction turned into a behaviour.

  WHY IT NEEDS ITS OWN CRITERION. The cheapest implementation of BO-3100a-1 is a recorded
  list of the 9 known offenders, which passes every test written against today's roster and
  silently stops working the first time an agent is added. The second scenario exists so a
  frozen roster cannot satisfy this AC: the reported numbers must move when the population
  moves.

  Reporting the observed numbers on a CLEAN run also matters on its own. A reconciliation
  that prints nothing when it finds nothing is indistinguishable from one that did not run —
  the same trap recorded against the AC-store validator, which exited 0 having checked zero
  files for eight days (KI-ACS-001).

  Verification must run the real assembly twice over fixture sets whose agent population
  differs, with no change to the check between runs. A test that reads the check for the
  absence of hard-coded names passes on a check that hard-codes them somewhere else.

  IT-PO ENRICHMENT NOTE (2026-08-26). The nine current offenders will have to be repaired for
  the first scenario's precondition ("every existing mismatch has been corrected") to hold.
  That repair is part of delivering BO-3100a-1, not a separate AC, and it must be done by
  changing the declarations — never by adding a suppression list, which would violate this
  AC's first it_requirement and re-create the frozen-roster defect under another name.
