id: UXP-700d-3-i
title: "Every piece of example content carries its own example marker, and the project's own record carries none"
component: ux-prototyping
components:
  - ux_prototyping
  - ac_store
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the example product's journeys, screens and dataset under its product root, and the
    example acceptance criteria that implement its steps,
  When any one of them is read on its own, with nothing but its own content,
  Then it carries `example_product` naming the product-root slug of the example product,
  And the value is a slug such as `fern-and-fig`, never a display name,
  And the same field is accepted by the journey, screen and dataset shapes and documented for
    acceptance criteria,
  And an artifact or criterion of the project's own record read the same way carries no
    `example_product` at all, not even an empty or null one,
  And the older `product:` field on example acceptance criteria is replaced by
    `example_product`, so the fact has one spelling, and the count of example criteria set
    aside from the work queue is unchanged by the rename.
depends_on:
