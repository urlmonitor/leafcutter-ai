notes: |
  A SINGLE PERCENTAGE IS NOT ACTIONABLE and would satisfy BO-3500d-1 completely. The
  reason the hand count on BO-3500 was useful is that it was broken down — prompts 463,
  written pages 152, diagrams 119, screens 80, workflows 44 — and that breakdown says
  immediately which capability to build first. A report that lost it would be a worse
  artifact than the one-off count it replaces.

  THE ADD-UP CLAUSE IS THE INTEGRITY CHECK and is the only assertion here that catches
  the commonest reporting bug, which is a requirement with two reasons counted in both
  groups. Group sizes that overstate the problem discredit the report; group sizes that
  understate it hide work. Exactly-one-group is the rule, and where a requirement
  genuinely has two reasons the report must choose deterministically rather than
  double-count.

  THE THIRD SCENARIO IS THE POINT OF THE WHOLE L1 and is the only assertion in it that
  proves the figure tracks reality rather than being computed once and cached. It is
  also testable in exactly the shape BO-3500a-3's second scenario is: run the same
  backlog against two different sets of available crafts and assert the report changes,
  with nothing else changing.

  NAMING THE SPECIFIC CRAFT, not the category, is what makes the report a work list.
  "440 requirements need a craft you do not have" is a fact; "463 need the prompt
  craft" is a decision.
