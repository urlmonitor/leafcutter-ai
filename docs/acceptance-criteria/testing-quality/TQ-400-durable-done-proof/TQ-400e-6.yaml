notes: |
  Satisfies the reference-doc entry in TQ-400e's documentation_triggers.

  THE SUBJECT IS ALREADY LIVE, WHICH IS WHY THE ENTRY MUST DESCRIBE TODAY AS WELL
  AS TOMORROW. Verified 2026-08-17: the test-free declaration is already honoured
  at check time with no reason required, 37 finished records carry it, and the
  prose reason field already exists in the store's schema. Nothing is being
  invented. An entry written purely against the hardened rule would misdescribe
  the store as it stands and would let a reader believe those 37 records are
  already compliant.

  THE RECONCILIATION IS THE HARDEST CLAUSE AND IS DELIBERATE. Two enforcement
  layers currently point in opposite directions: the authoring-time schema
  validator refuses a test-free declaration on an approved, not-yet-done, leaf
  code requirement, while the check-time sweep honours the same declaration
  unconditionally on a finished record. A reference entry that documents only one
  of the two leaves a record that is legal to one layer and illegal to the other
  — the disjoint-vocabulary failure this repo has already shipped once. The
  reconciled boundary is the thing a reader most needs and the thing an author
  writing to satisfy a presence check will omit.

  Written as reader outcomes rather than "the fields are documented" because the
  cheapest satisfying artifact here is two field rows and a sentence, which would
  answer none of the three questions an author of an exemption actually has: may
  this record have one, what will be refused, and what will the next run do.

  The round-trip clause makes the entry falsifiable against the shipped check
  rather than against its author's intent.

  IT-PO ENRICHMENT NOTE (2026-08-18) — BOTH SIDES RE-VERIFIED, AND THE
  RECONCILIATION IS NOW A TEST, NOT A HOPE. The two opposing rules were read at
  source during enrichment and are quoted with line references in doc_links and in
  the first it_requirement, so no implementer has to rediscover them. More
  importantly the obligation is no longer only prose: the seam test entry derives
  both layers' behaviour over the REAL store and asserts the entry's stated rule is
  consistent with both, in both directions. That is what stops this AC being
  satisfied by a well-written description of one layer — the outcome that would
  leave the same 37 records in dispute while every check goes green.
