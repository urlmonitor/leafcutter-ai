work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a project whose settings do not set db_connection_test,
    and two pieces of work in one run —
      W1, which needs a database test for a stored procedure,
      W2, which needs only tests that touch no database,
  When the test writer and the test runner handle W1 and W2,
  Then for W1 the hand-off says that no test database connection is
      configured and names the setting testing_context.db_connection_test,
    And for W1 no agent connects to, or produces a test pointing at, an address
      it chose itself — not localhost on a default port, not the address
      leafcutter used to ship, not a value guessed from the environment,
    And W1's database tests are reported as not run for want of
      configuration — never as passed, never as skipped without a reason, and
      never as "database unreachable",
    And W2 proceeds with no mention of the missing setting.
