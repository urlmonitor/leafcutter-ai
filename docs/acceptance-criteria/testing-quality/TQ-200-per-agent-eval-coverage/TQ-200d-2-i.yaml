roadmap_phase: phase_1
criteria: |
  Given the sql-test-writer "stored-procedure regression" row for TQ-9501 and
      fn_refresh_due,
    And a to-run-later file with ac_id TQ-9501 whose entry has the test
      "unit_tests/sql_functions/test_fn_refresh_due.py::TestFnRefreshDue::test_retry_due_false_overrides_refresh_due_true"
      and the wrong version "select refresh_due (retry_due parameter ignored
      entirely)",
  When the row's to-run-later check reads the file,
  Then the check passes, although the wrong-version text does not contain
      "fn_refresh_due",
    And a file whose only entry's test names a different function
      ("unit_tests/sql_functions/test_fn_other.py::TestFnOther::test_x") fails,
      with a detail naming fn_refresh_due as the function no entry covers,
    And an entry whose wrong version is empty or only whitespace does not
      count, so a file holding only such entries fails,
    And an entry whose test has no "::" test id does not count,
    And a file whose ac_id is not TQ-9501 fails,
    And the recorded gold output for the row still passes,
    And the agent template's instruction that the wrong version is written
      "in your own words" is unchanged.
