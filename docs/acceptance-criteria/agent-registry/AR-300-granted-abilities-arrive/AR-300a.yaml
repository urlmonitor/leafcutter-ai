notes: |
  MEASURE THE BRIEFING, NOT THE PREPARATION. The defect behind this criterion is
  that the abilities table is computed correctly and then discarded. Any proof
  that reads the computation, the record, or the source template will pass today
  on 31 specialists that receive nothing. Evidence must be the compiled briefing
  a specialist actually receives.

  ONE HAND-WRITTEN SECTION EXISTS AND IS NOT COVERAGE. Exactly one specialist's
  instructions mention its abilities, written by hand rather than delivered. A
  criterion satisfied by hand-writing the section into 31 templates has answered
  a question nobody asked -- see AR-300d, which owns the generality this must
  not be traded against.
