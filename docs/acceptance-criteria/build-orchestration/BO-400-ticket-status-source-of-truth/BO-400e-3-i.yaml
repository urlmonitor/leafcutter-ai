    angle: boundary
    description: "The non-zero-exit branch names the ticket, does not write the status by another means, and does not retry with an override."
test_rationale: |
  This record's deliverable is the text of a dispatch prompt: sub-step C is instructions an
  agent receives, not control flow the unit layer can execute. Asserting on that text is
  therefore asserting on the artifact itself, not on a proxy for it — the usual objection to
  a source-level test, that it passes on dead code, does not apply when the source IS the
  deliverable being shipped to the agent.

  This also follows the established precedent for this exact file and this exact step:
  unit_tests/test_finalize_feature_step35_scope.py already guards step 3.5's instructions
  the same way, including two negative assertions of the same shape as the one here
  (test_no_whole_store_scan_instruction, test_no_worktree_walk_instruction).

  The negative test is written as a scan for the direct-write pattern across the whole
  finalization prompt rather than an inspection of sub-step C, so that a direct write
  reintroduced in a different sub-step fails it too. A test that only checked sub-step C
  would pass on the defect simply moving.
