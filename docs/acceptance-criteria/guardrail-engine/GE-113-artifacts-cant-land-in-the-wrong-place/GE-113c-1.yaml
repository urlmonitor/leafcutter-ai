readiness: approved
priority: medium
criteria: |
  Given the guard scripts are installed in the deployed layout under a
    .leafcutter/ subdirectory of a consumer project,
  When a guard resolves the project root for its check,
  Then the resolved project root is the consumer project root,
  And the resolved project root is not the .leafcutter/ subdirectory the guard
    runs from.
