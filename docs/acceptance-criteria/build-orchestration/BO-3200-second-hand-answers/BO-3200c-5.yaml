it_requirements:
  - "AGENT CHOICE IS DELIBERATE: architecture-diagram-author, the leaf author, not documentation-expert."
  - "THE PERSON MUST BE A DISTINCT PARTICIPANT, and no specialist may appear in the answering position — as a declared property of the drawing, not a matter of labelling. In the arrangement this replaces, the answering position was occupied and the occupant was a specialist; every diagram of it would have looked correct because the SHAPE was right and only the identity was wrong."
  - "BOTH PATHS MUST BE DRAWN, and the pause path drawn as an explicit alternative rather than an aside. The pause is the behaviour that was missing; a diagram showing only the answered case leaves the unanswered case to whatever the next implementer assumes, which is how it was missing in the first place."
  - "THE PAUSE PATH MUST SHOW THREE THINGS SEPARATELY: the run pausing, the resumable record being written, and the authored work being left in place. Collapsing them loses the only element that distinguishes a pause from a discard."
  - "The coherence claim must be enforced by an executable test comparing the diagram's declared interactions, per path and in order, against real runs driven down EACH path."
  - "The diagram page must declare its participants, paths and ordered interactions in a machine-readable form so the coherence test reads data, not a picture."
  - "Must be consistent with the existing interactive pause-resume sequence diagram rather than contradicting or duplicating it; if the existing one becomes wrong, say so there rather than leaving two drawings that disagree."
  - "Must satisfy the repository's existing doc front-matter and component-vocabulary rules unchanged."
delivers_to: null
