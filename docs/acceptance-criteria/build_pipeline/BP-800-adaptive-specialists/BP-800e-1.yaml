id: BP-800e-1
title: "Build detects the legacy agent layout and triggers migration"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a project directory with the legacy agent structure:
    - .claude/agents/python-coder.md (hardcoded, no generated-by metadata)
    - .claude/agents/sql-coder.md (hardcoded, no generated-by metadata)
    - No technology manifest file present
  When the build runs for the first time after the package upgrade to the adaptive-specialists version
  And the build detects the legacy layout (presence of agent files without generated-by metadata and absence of technology manifest)
  And the build triggers the migration process before proceeding with normal specialist generation
  And the build output reports: "Legacy agent layout detected — running migration"
depends_on:
  - BP-800e
  - BP-800d-1
