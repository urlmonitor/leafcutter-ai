notes: |
  THE ATOMICITY LEAF -- ACD-2000b hazard 2, verified and NOT satisfied today.

  THE VERIFIED RACE (do not re-investigate), in
  scripts/build_orchestration/fast_lane.py `claim_build_set()`:
    - reads the YAML at ~line 181,
    - tests `current_status == "in_progress"` at ~line 193,
    - writes at ~line 203.
  Read, check, write, with no exclusion between the three. Two runs can both read
  `todo` and both flip, each believing it owns the requirement. The existing
  already-in_progress detection at ~193 is exactly the check that the race
  defeats -- it looks like protection and is not.

  WHY THE FOURTH THEN CLAUSE IS WORDED AS A REPEATED CONTEST. A single concurrent
  attempt is a coin flip: a broken implementation passes it most of the time, and
  a test that runs the contest once is a flaky green rather than a proof. Stating
  "many times, never once" makes the required test shape unambiguous. ACD-2000b's
  own note makes the same demand: "cover it with a test that runs two claimers
  CONCURRENTLY; a sequential test cannot observe this bug."

  "ZERO HOLDERS" IS IN THE CLAUSE ON PURPOSE. The natural over-correction for a
  double-claim is mutual back-off, where both contenders detect the conflict and
  both release -- leaving the requirement available, no work started, and both
  efforts moving on. That satisfies "never two holders" and is still a bug: it
  is a livelock that presents as an idle build.

  THE SECOND THEN CLAUSE ("goes looking for different work") ties this to the
  L1's first promise. Losing the contest must be an ordinary, non-fatal outcome
  -- not an error that aborts the losing drive. Today `claim_build_set` reports
  an already-in_progress AC "via `error`", which the IT PO should check is
  consumed as "pick something else" and not as "fail the run".

  IMPLEMENTATION SPACE (IT PO's call, deliberately unconstrained here):
  compare-and-set on the record, exclusive file creation, an OS-level lock, or a
  single-writer serialisation point. Note that the store is per-requirement YAML
  files on disk, and that `_update_ac_work_status()` (~lines 113-125) rewrites
  the WHOLE record, so whatever is chosen must also protect ACD-2000a's trail
  from interleaved rewrites -- see ACD-2000a-1-i.

  TESTABILITY. Two real processes (not two threads sharing an interpreter, and
  not two sequential calls) contending for one real on-disk requirement, repeated
  enough times to make the window reliably hit. Then assert the file's recorded
  owner. This is the one AC in the tree that a same-process test cannot honestly
  cover.

  2026-08-17 (IT PO enrichment). THE CONSUMER CHECK THE BA ASKED FOR, ANSWERED.
  `fast_lane.main()`'s claim branch (~lines 990-1012) returns exit 1 only on
  `target_refused` -- the case where the WHOLE set is already claimed. A single
  contended member today lands in `claim_build_set`'s `error` string while the
  CLI still exits 0. So the "goes looking for different work" clause is partly
  inherited and partly missing: the loser is not fatally aborted, but nor is it
  told anything a caller can act on. Both halves are it_requirements.

  THE MECHANISM IS CONSTRAINED BY PORTABILITY, NOT BY TASTE. leafcutter installs
  into consumer projects on Linux, WSL2 over NTFS, and Windows.
  `docs/reference/feedback-concurrency.md` records the sibling defect (an
  unlocked append losing writes) and proposes `fcntl.flock` / `msvcrt.locking` --
  a platform split that has never been implemented. Advisory locks are not
  reliably honoured on every mount this package runs on, so the it_requirements
  point at exclusive create and atomic replace instead. This is the constraint
  most likely to be discovered late, on a consumer's machine rather than here.

  SELF-CONTENTION IS THE CLAUSE NOBODY WRITES. An owner re-taking its own claim
  must not refuse itself and must not refresh the instant -- refreshing it lets a
  looping build hold a requirement indefinitely while never appearing stale to
  ACD-2000b-3.
