id: BP-100i-3-i
readiness: approved
priority: high
title: "Parity check degrades gracefully when the deployed output directory does not exist"
component: build-pipeline
level: L3
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-100-reliable-builds/BP-100i.yaml"
criteria: |
  Given the canonical template directory exists and contains hook scripts
  And the deployed output directory does NOT exist (e.g. a fresh clone
    where build.py has not yet been run)
  When the parity check runs at pre-commit time
  Then it skips the deployed-output comparison entirely
  And it still performs the runtime-vs-canonical and manifest parity checks
  And if no other violations are found, the hook exits with code 0
  And a single-line informational message is emitted noting that the
    deployed output directory was not found and that comparison was skipped
