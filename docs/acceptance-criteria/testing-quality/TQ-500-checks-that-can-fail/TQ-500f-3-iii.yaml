notes: |
  THE REAL FIX BEHIND THE TQ-500f-3 SAFETY NET (user decision 2026-09-27: defer
  to its own AC). The proof-of-done check matches a covering tag to a test run
  result by (file name, bare function name). Two tests with the same function
  name in two classes of one file, or in same-named files under different
  package directories, collapse onto one result, so one test's outcome is used
  as the other's — for proof-of-done and for the red-baseline reader, which
  shares the matching. The TQ-500f-3 build only makes the reader FAIL CLOSED
  ("ambiguous_test_identity") when that happens. This AC removes the cause.

  THE SAFETY NET STAYS. After this AC, the "ambiguous_test_identity" refusal
  should become rare, but it is kept: any tag that still cannot be tied to
  exactly one test (last Then clause) is refused, never guessed. A fix that
  removes the refusal because "full identity makes collisions impossible" has
  broken this AC. If the TQ-500f-3 build lands without that refusal, this AC's
  last clause owns it.

  The TQ-9001..TQ-9004 ids and the test paths in the Given are fixture values,
  not real records.

  SIZE CONSTRAINT FOR THE IMPLEMENTER (user direction): scripts/ac_store/done_proof.py
  is over the file-size ratchet (2,355 lines on origin/main at 86bd630f). This fix
  must not make it grow; the matching has to move out into its own module (the one
  the red-baseline reader then also uses), so the net line count of done_proof.py
  goes down. IT-PO: carry this into it_requirements.

  PLACEMENT. L3 under TQ-500f-3 (the absence/assertion red-baseline behaviour, whose
  build surfaced the defect). TQ-500f is at its 6-L2 override and TQ-500 at its
  7-L1 cap, so a new L2/L1 was not possible without raising a cap; L3s have no
  child cap. ACS-200f (the proof-of-done gate, work_status done) was the other
  candidate home; it was not reopened.

  IT-PO ENRICHMENT (2026-09-27)
  AGENT: python-coder (every surface is .py, plus one deploy-map entry). Complexity L:
  new module + done_proof.py + _fl_red_baseline_support.py (and
  done_proof_kind_support.py) + scripts/build_phases_ac_store.py, plus
  tests in two dirs.
  SIZE BASELINE MEASURED: done_proof.py = 1307 counted lines (2355 raw) at 10986ebf,
  via _file_size_ratchet.measure_current_length. The build must end strictly below
  its merge-base value.
  DOC LINK CHANGE: the BA's source-file doc_link (scripts/ac_store/done_proof.py) was
  replaced by architecture docs, because IT-PO doc_links never point at source. The
  file is named in it_requirements instead.
  STALE DOC AFTER BUILD: docs/architecture/diagrams/c3-done-proof-evaluation-sequence.md
  describes the matching as "exact file+function match, then function-suffix
  fallback". Once this lands it is wrong, and needs an architecture-diagram-author
  follow-up.
  ANGLES: criterion, reachability (+real_artifact), seam and deployed take the 4 core
  slots. The conditional discrimination, boundary and failure entries take no slot.

  USER DECISION AT THE IT-PO GATE (2026-09-28): a UNIQUE name-only match is
  allowed. Basename + function, or function-name-only, matching is refused only
  when more than one test shares that name. The full-identity it_requirement is
  worded that way on purpose, and it keeps ACS-200f-2's same-file-beats-name-only
  ordering for the unique case.

  INHERITED-TEST CASE (added 2026-09-28, from the final PR #923 review): one covers
  tag on a mixin/base-class method inherited by two test classes yields two
  nodeids. Both are judged (all must pass; an absence-only red on a declared test
  refuses), never collapsed, never guessed, never refused as ambiguous. See the
  inherited-tests it_requirement and test_inherited_test_judged_across_every_inheriting_class.

  STATE OF TQ-500f-3-i AFTER #923 (merged at 141465d5): its reader already fails
  closed with ambiguous_test_identity when two TAGS share (function name, file
  basename). This AC keeps that refusal as the safety net while removing the
  common cause. The red-baseline kind support module was renamed on merge to
  scripts/ac_store/done_proof_kind_support.py (no leading underscore); earlier
  mentions of _done_proof_kind_support.py mean this file.
