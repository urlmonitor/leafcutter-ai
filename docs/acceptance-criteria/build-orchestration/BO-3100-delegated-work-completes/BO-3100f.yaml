criteria: |
  Work that could not be completed is named as unfinished, not counted.

  When a step ends because it ran into something it could not get past — a
  permission it was not given, a decision only you can make — the build says so,
  names what stopped it, and does not call the run a success. Stopping short is
  never quietly dropped, waved through, or removed from what the run was
  supposed to do in order to make the report come out clean.
