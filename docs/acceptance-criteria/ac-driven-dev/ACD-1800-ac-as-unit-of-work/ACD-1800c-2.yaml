criteria: |
  Given a ticket grouping three requirements where two are done and one is not,
  When the ticket's completion state is evaluated,
  Then the ticket is reported as not done,
  And when the remaining requirement becomes done,
  Then the ticket is reported as done,
  And an agent advances the feature only by completing individual requirements,
    never by completing the ticket directly.
