roadmap_phase: phase_1
criteria: |
  The fast lane trades away overhead, never scrutiny.

  Work built through the lean lane is asked for the same proof, and gets the same
  reading, as work built the thorough way. Before any test is written, the plan for
  the work asks it to prove it is reached the way the product is really used. Before
  anything is committed, the change is read — for local mistakes and for cross-cutting
  design problems — by a reader that knows which requirements the run was pointed at
  and what the run actually changed, so the reading is a real examination rather than
  a formality that happens to be present. What that reading finds either stops the run
  before a commit exists, or comes back attached to the result; nothing is quietly
  dropped. You keep the lane's speed and stop discovering, after the pull request is
  already open, that nobody looked.
depends_on: [BO-2400, BO-2400f]
