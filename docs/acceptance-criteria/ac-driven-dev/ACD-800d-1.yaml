criteria: |
  Given the cross-reference audit tool has completed a run (in either
    read-only mode or --apply mode),
  When the debugging/logs/ directory is inspected,
  Then a file named ac_cross_reference_audit_YYYYMMDD.json exists
    (where YYYYMMDD is the date of the run),
  And the file contains valid JSON conforming to the schema:
    { "run_date": "<ISO date string>",
      "matches": [
        { "ac_id": "<AC identifier string>",
          "ticket_path": "<relative path to ticket file>",
          "confidence": "high" | "medium",
          "reason": "<human-readable explanation of the match>" }
      ] },
  And every match reported to stdout also appears in the JSON file,
  And the JSON file is parseable by a standard JSON library without errors.
