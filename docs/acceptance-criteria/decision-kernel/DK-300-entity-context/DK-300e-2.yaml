notes: |
  New behavioral requirement derived from the user-authorized entity-context concept.
  BA behavior and IT PO technical contracts are reviewed; implementation is verified by the independent strict entity suite and recognition corpus.
  Verification evidence: reports/entity-context-verification.md. No human approval is implied.
  Historical DK-200 direct-gather tests and evaluation reports are preserved.
  Fresh-run wiring criteria were explicitly reconciled to EntityContext on 2026-10-04.
estimated_complexity: L
it_requirements:
  - "Corpus labels are versioned independent expected results; evaluation calls production recognize_entities on real native source fixtures rather than reproducing implementation logic."
  - "Report exact per-case expected/observed identities/spans/states/provenance/bounds/calls plus family-level precision, recall and coverage; unsupported or omitted families remain visible."
  - "Paired baseline versus entity-context intent comparisons use identical caller inputs and explicitly controlled recording providers, with model-call counts and clarification outcomes reported separately from recognition quality."
  - "The test-writer owns executable evaluation fixtures/harness and establishes the red baseline; live Anthropic or any generative model calls are forbidden for this work."
test_required: true
test_spec:
  - name: "test_labelled_recognition_corpus_reports_family_metrics_and_exact_cases"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "real_artifact"
    description: "tests/kernel/entity_context/test_evaluation.py::test_labelled_recognition_corpus_reports_family_metrics_and_exact_cases: Run a nonempty versioned corpus spanning all6 families and stated adversarial cases; assert expected/observed detail and precision/recall/coverage by family."
  - name: "test_paired_intent_report_keeps_context_constant_and_calls_honest"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "reachability"
    description: "tests/kernel/entity_context/test_evaluation.py::test_paired_intent_report_keeps_context_constant_and_calls_honest: Evaluate baseline and entity paths against identical caller context with controlled provider, report intent/clarification/call outcomes separately and prove the actual service consumes cards."
  - name: "test_historical_enrichment_results_are_not_entity_contract_evidence"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_evaluation.py::test_historical_enrichment_results_are_not_entity_contract_evidence: Assert evaluation identifies legacy DK-200 results separately from current recognition labels and cannot use an old aggregate score as a new pass."
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
