decision_type: design
question: "And one other thing regarding decisions: do they already have some kind of categories? \nI mean currently we build\
  \ leafcutter and all decisions pretty much apply. But there could be some decisions that are also important for the customers.\
  \ So actually we would have to have jev decide whether a decision / rule applies only to leafcutter itself or the harness\
  \ itself. So e.g. how to fill product truth is a decision it has to form based on exising components - for customers but\
  \ also for leafcutter itself.\nlet leafcutter research and decide which other categories / classifiers we need."
