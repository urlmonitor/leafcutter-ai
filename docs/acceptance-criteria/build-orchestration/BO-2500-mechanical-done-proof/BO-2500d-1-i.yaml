    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "For each of the three mechanical gates in turn, a lane definition with that gate removed from the done-ness set is rejected by the executed guard, and the rejection names the removed gate."
  - name: test_verdict_substituting_for_a_gate_is_rejected
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "A lane definition in which a mark-done path is reachable on a review verdict where a mechanical gate did not pass is rejected by the executed guard, and the rejection states that a verdict may not establish done-ness."
  - name: test_veto_only_reviewer_with_all_gates_intact_is_accepted
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "The lane as BO-2400f-11 shipped it — one veto-only reviewer, three unconditional mechanical gates — is accepted by the executed guard, so the guard rejects substitution rather than review."
  - name: test_substitution_does_not_reach_mark_done_at_runtime
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "Executed under the E2 harness with a mechanical gate stubbed failing and the review dispatch stubbed clean, the run records no mark-done dispatch for the ACs that gate covers — the runtime counterpart of the change-time rejection."
  - name: test_undeterminable_effect_on_doneness_is_rejected
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "An unreadable or unresolvable lane definition is rejected with a message stating the effect on done-ness could not be determined, never accepted as clean."
