notes: |
  ORIGIN. BrainCandy, on being shown that BO-3100d-2's rationale half cannot be mechanically
  checked: "here we need strong reasoning from the planning agents. the only thing we can make
  sure is that we provide a skill to the agents which lets them pull all the ACs in the area and
  read it one more time to see if there are discrepancies."

  That framing is the criterion. The guarantee offered is availability and completeness of the
  material, plus honesty when the material cannot be presented whole. The judgement stays with
  the agent, and this record does not pretend otherwise.

  WHY IT IS NOT A DETECTOR. The tempting version of this skill reports "N discrepancies found",
  and that version is worse than nothing: a clean report would be read as a coherence guarantee
  while proving only that a heuristic did not fire. BO-3100d-2 already carries an instruction
  not to close its gap with a prose grep; a discrepancy detector would be that grep wearing a
  different hat.

  PROCESS NOTE. Authored by the main loop rather than the business-analyst, at the user's
  direction, after the three-stage pipeline had completed and its leaves were approved. Flagged
  here rather than left implicit — the role boundary was crossed knowingly, and a reviewer
  should read this record with the same scepticism they would give any single-author criterion.
