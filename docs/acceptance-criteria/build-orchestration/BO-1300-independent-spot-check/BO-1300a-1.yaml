id: BO-1300a-1
readiness: approved
priority: high
title: "On-demand spot-check command targets a named finished feature"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-independent-spot-check/BO-1300a.yaml"
criteria: |
  Given a feature has just finished building (its tickets are implemented and merged)
  When the user invokes the standalone spot-check command and names that feature as the
    target scope (for example, the epic folder, the feature branch, or the changed files
    of the just-built feature)
  Then the command resolves the target into a concrete review scope describing what was
    built (the feature's behavior and the files it changed)
  And the review proceeds against that scope without requiring a full build cycle to run
  And the command does not ask the user to author any new tests
