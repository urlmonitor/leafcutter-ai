criteria: |
  Tests connect where your settings say, and a missing setting is said out loud.

  Nothing leafcutter installs carries a ready-made database address; every agent
  and guide that needs one takes it from your project's own configuration. When
  none is configured, you are told it is missing, instead of the work quietly
  pointing at an address that belongs to some other project.
