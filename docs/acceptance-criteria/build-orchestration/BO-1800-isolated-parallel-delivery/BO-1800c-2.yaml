criteria: |
  Given multiple independent features are ready to be built in parallel,
  When they are dispatched as concurrent drives (each in its own isolated clone),
  Then the system does not reject or queue a drive because of a fixed maximum count
    of concurrent features/drives,
  And the count of independent features that may run at once is limited only by host
    resources (per BO-1800c-3), not by an arbitrary configured cap.
