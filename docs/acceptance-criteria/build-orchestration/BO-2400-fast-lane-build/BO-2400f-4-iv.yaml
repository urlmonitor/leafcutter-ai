  - name: test_pr_body_declares_breaking_undetermined
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    description: "The opened PR states that the breaking flag was not determined by the run and needs human confirmation."
  - name: test_notice_present_regardless_of_ac_risk_surface
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    description: "Two runs whose built criteria differ only in risk_surface produce the same not-breaking entry and the same notice — the flag is not inferred from AC metadata."
