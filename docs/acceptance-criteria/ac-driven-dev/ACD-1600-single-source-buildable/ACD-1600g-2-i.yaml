notes: |
  THE MIXED-GRAIN EDGE CASE. This is the case where an exact-path/exact-path set
  difference silently does the wrong thing in BOTH directions, and it is not
  hypothetical -- it is the grain the existing consumer already uses.

  VERIFIED: templates/agents/change-scope-reviewer.md Tier 2 (block) matches on
  "The file's top-level directory or component is listed in `out_of_scope`", and
  Tier 1 (soft) requires "The file is NOT named in the ticket's `out_of_scope`
  list". So exclusions are authored and matched at DIRECTORY / COMPONENT grain,
  while `files_touched` (derived by `_build_files_touched()`,
  scripts/ac_store/generate_ticket_from_ac.py ~line 497) is a set of EXACT PATHS.

  THE TWO FAILURE DIRECTIONS, both produced by a naive exact-string difference:
    1. NO CANCELLATION (false blocker). "build_orchestration/" never equals
       "scripts/build_orchestration/fast_lane.py", so the subtraction removes
       nothing and the member that legitimately changes that file is blocked by
       its bundle-mate's exclusion. This is ACD-1600g-2's defect surviving the
       fix, just one grain down.
    2. OVER-CANCELLATION (false pass -- the more dangerous one). If the fix is
       "drop the whole exclusion when any member touches anything inside it",
       the sibling file that nobody was supposed to change loses its protection
       too, and the boundary silently shrinks to nothing. The second and third
       Then clauses exist to pin this down: cancellation is per-path, not
       per-exclusion-entry.

  BEHAVIOURAL, NOT STRUCTURAL. The third Then deliberately carries the assertion
  through to the observable outcome (what is and is not surfaced as a breach)
  rather than stopping at the computed set, because a correct set that no
  consumer consults is dead code -- see CLAUDE.md, "Gate / Workflow ACs -- Verify
  Behaviorally, Not by Grep", and the fast-lane precedent it cites where the
  gates were defined and never executed.

  OPEN TECHNICAL DECISION (for the IT PO, not this AC): whether normalisation is
  "expand exclusions to the path set they cover" or "match each changed path
  against exclusion prefixes". Either satisfies these criteria; the choice
  belongs in it_requirements.

  2026-08-17 (IT PO enrichment). The deferred decision is now made, with the
  reason recorded so it is not re-litigated.

  - PREFIX MATCHING, NOT EXPANSION. Both options satisfy the criteria as written,
    so the criteria cannot decide it -- but they are not equivalent in operation.
    Expanding an exclusion into the set of files it currently covers requires a
    filesystem walk at check time and can only enumerate files that ALREADY
    EXIST. A change that CREATES a new file inside an excluded directory would
    then fall outside the expanded set and pass unflagged, which is the exact
    class of change a scope guard exists to catch. Prefix matching has no such
    blind spot and needs no I/O.

  - ONE CONSEQUENCE WORTH NAMING: prefix matching makes segment-boundary handling
    load-bearing, because `startswith` is the obvious implementation and it is
    wrong -- an exclusion of a directory would swallow every sibling directory
    sharing its name as a prefix (the `_legacy` twin case). That is why it is a
    separate it_requirement and a separate test rather than an implementation
    detail.

  - COMPONENT-GRAIN ENTRIES ARE THE QUIET THIRD CASE. The existing reviewer
    accepts "directory OR component" in the exclusion list. A component id is not
    a path prefix and will match nothing under a pure prefix rule, so the guard
    would degrade silently for exactly the authors who write at component grain.
    Resolution has to go through the component vocabulary, not string matching.

  - AUTHORING NOTE ON it_requirements PROSE: illustrative example paths are
    written WITHOUT slashes on purpose. `_build_files_touched()` scrapes any
    slash-bearing token out of it_requirements prose into the generated ticket's
    `files_touched`, so a made-up example path becomes a declared change surface
    and the scope reviewer then expects a file that does not exist. Real edit
    surfaces are named with their paths; examples are described in words.
