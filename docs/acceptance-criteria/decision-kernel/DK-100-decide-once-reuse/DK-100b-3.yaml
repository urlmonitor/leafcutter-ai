id: DK-100b-3
title: "A decision resolves only on your choice, and it carries your approval"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a decision formed by ranking, whose criteria you approved, and your choice of
    opt.kernel_entry_point at the ranked-choice question as human:user,
  When the decision resolves,
  Then its selected option is opt.kernel_entry_point,
  And it carries approved_by human:user and approved_at set to the UTC time of your choice, for
    example 2026-10-02T05:39:33Z,
  And report.md is written to the run folder,
  And a decision formed by ranking does not resolve while its criteria are unapproved or no
    ranked choice has been made.
depends_on:
  - DK-100b
