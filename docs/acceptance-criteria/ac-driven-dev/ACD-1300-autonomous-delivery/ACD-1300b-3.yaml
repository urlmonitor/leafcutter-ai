id: ACD-1300b-3
title: Switching off drains active work to a safe checkpoint
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given an implementation, repair, review, validation or publication action is in flight
  When the user switches the worker off
  Then admission of all subsequent agent calls and feature work stops immediately
  And the in-flight action may finish within its existing bounds
  And its result and next safe step are persisted before the run becomes paused
  And the feature worktree remains available until the user re-enables the worker
