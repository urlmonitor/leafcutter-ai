id: TKT-600b-1
title: "The generated phase record names exactly the phases the drive will dispatch for that ticket's location"
component: ticket-creation
components:
  - ticket_creation_pipeline
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical   # owner decision at the approval gate, 2026-09-01
roadmap_phase: phase_1
criteria: |
  Given an acceptance criterion whose generated ticket will be written into an epic
    folder,
  And the drive, for a ticket in that folder, dispatches every phase except the
    pull-request phase, because one epic-level pull request covers every ticket on the
    branch,
  When the ticket is generated,
  Then the set of phase agents the ticket's own record marks as required is exactly the
    set of phases the drive will dispatch for that location — no phase the drive will
    skip is marked required, and no phase the drive will run is marked excluded,
  And the pull-request agent's entry reads "explicitly excluded from this ticket",
  And driving the generated ticket to completion requires no edit to its frontmatter by
    any person or any agent.

  And the same agreement holds under a different deferral rule, which is the point of
  this criterion rather than an extra case:
  Given the drive is changed so that, for that same epic location, it defers the
    changelog phase and dispatches the pull-request phase,
  When a ticket is generated for that location,
  Then the record marks the changelog agent excluded and the pull-request agent
    required,
  And this is true without any accompanying change that names the changelog phase or
    the epic-folder shape a second time.

  A record that is correct only because one phase name and one folder shape were
  written into the generating side does not satisfy this criterion: it reproduces
  today's answer and will disagree again the next time the drive's deferral set moves.
  What must hold is that the two sides cannot state different phase sets for the same
  location.
depends_on: [TKT-600b]
