criteria: |
  Given a staged Python file that calls .execute() / .executemany() / .callproc()
       on a receiver that is plainly NOT a database cursor (a receiver named
       something other than a recognised cursor identifier such as cursor / cur /
       crsr / db_cursor), outside any try/except
  When check_exception_handling analyses the file
  Then the call is NOT flagged as an unwrapped I/O boundary (IO-001), so the hook
       exits 0 and the legitimate commit is not blocked
  And  a genuine cursor.execute() / cur.execute() on a recognised cursor receiver,
       unwrapped, is still flagged IO-001 (no regression in true-positive detection)

  And given a staged path that ends in ".py" but cannot be read as text
      (a directory, a permission-denied file, or a broken symlink)
  When check_exception_handling's main() processes that path
  Then the OSError is caught and reported as a skip message on stderr, the path is
       skipped, and processing continues to the remaining files — the process does
       NOT terminate with an uncaught OSError traceback
  And the bug symptom (an uncaught IsADirectoryError/OSError traceback from
      analyse_file's read_text, exiting with code 1 and colliding with the
      legitimate "violations found" exit code) must not occur
