notes: |
  A TOTAL-ONLY BUDGET IS EXACTLY HOW THE SUITE REACHED AN HOUR AND A HALF. The
  parent L1 puts it plainly: it got there without any single change ever looking
  like the culprit. Under a total-only guard that history repeats — one test gets
  four minutes slower, another was made faster last week, the total holds, nothing
  fires, and the headroom is consumed one invisible increment at a time until the
  guard fires on a change that is not the cause. Per-test comparison is what makes
  the increment attributable to the change that caused it, while that change is
  still in review.

  THE NEW-TEST CLAUSE PREVENTS A GUARD NOBODY CAN LIVE WITH. Without it, every
  added test is an infinite regression against a zero baseline, the guard fires on
  every honest change, and it is disabled within a fortnight. Reporting new tests
  as new, with their cost, keeps the information — a new 200s test should be seen —
  without making the guard a nuisance.

  THE GOT-CHEAPER CLAUSE IS A REAL ASSERTION, NOT SYMMETRY FOR ITS OWN SAKE. A
  comparison written on absolute difference rather than signed growth reports
  improvements as regressions, which trains readers to ignore the output.

  THE PER-TEST GROWTH ALLOWANCE LIVES WITH THE BUDGET DELIBERATELY. One declared
  record, two numbers, both revisable in one place with their justification beside
  them — see TQ-600c-3.
