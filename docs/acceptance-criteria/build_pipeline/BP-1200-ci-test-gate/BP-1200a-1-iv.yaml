it_requirements:
  - "Grounded (2026-07-10): tests/commit_guardian/test_check_ac_done_on_merge.py and unit_tests/commit_guardian/test_check_ac_schema.py require `python scripts/build.py` to have run (they invoke the deployed commit_guardian scripts). The CI pytest job must run the build preparation step first (ADR-016 Approach 1: build.py + install_shims shim_map bridge), or the tests must resolve their scripts build-independently."
  - "SAME ROOT CAUSE as FIN-100a-4's Step-3 build gap in finalize-feature.js (deploy-dependent tests failing when build.py has not run). Keep the two fixes consistent: the CI job and finalize both establish the build/deploy state before running these tests. Cross-link, do not diverge."
  - "Consistent with ADR-016 Approach 1 and ADR-001/ADR-004: the deployed scripts/commit_guardian/ output stays gitignored and is bridged via the install_shims shim_map; do not resolve this by committing build outputs into source control."
  - "This L3 is a thin observable over BP-1200a-1's build+shim prerequisite for the specific commit_guardian test class; do not re-specify the shim/build mechanism here (owned by BP-1200a-1 / ADR-016)."
  - "The fresh-clone determinism this asserts must not depend on a leftover working-tree scripts/commit_guardian/ copy: the result must be identical with or without a stale local copy."
