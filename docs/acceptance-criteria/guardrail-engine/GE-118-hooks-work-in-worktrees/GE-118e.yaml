risk_surface: contract_boundary
notes: |
  THIS IS NOT DOCUMENTATION-OF-A-FIX. It is the other half of the defect. The
  register names the absence of any declaration as a root cause in its own right,
  alongside the crash: doc_types.json says nothing about related_docs, and the
  guard's README documents only "path existence of related_docs / related_code".
  A guard whose rule exists only inside the guard is discoverable by one method,
  and that method is being refused.

  ORDER MATTERS AND IS ENCODED IN depends_on. This record depends on GE-118d
  because the decision it publishes is GE-118d's to make. A document written
  before the decision settles would describe a shape rule that the guard does not
  hold — which is the state the project is in today, one level up.

  THE LAST CLAUSE IS A DELETION, NOT AN ADDITION, and it is the one most likely
  to be skipped. The existing sentence in the hooks guide is not merely
  incomplete; it is the sentence that persuaded an adopter there was nothing more
  to know. Leaving it in place beside a new, fuller paragraph leaves both true-
  looking and one of them wrong.

  WHAT WOULD MAKE THIS RECORD VACUOUS. A test that greps either document for the
  word "labelled" passes on a sentence that says the labelled form is rejected.
  The observable has to be that a reader who follows only these two documents
  authors an entry the guard accepts, and knows what happens if they do not —
  which is why the criterion names the examples and the refusal, not the topic.
