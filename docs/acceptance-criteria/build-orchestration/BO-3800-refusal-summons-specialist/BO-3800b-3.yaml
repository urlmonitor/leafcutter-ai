id: BO-3800b-3
title: "A complexity refusal brings in the restructuring specialist, not the coder that wrote the change, and the skill it is told to apply is the one the refusing check declares"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a ticket is being driven whose change was written by python-coder,
  And check-complexity refuses its delivery, and check-complexity's remedy declaration
    has the engage-specialist disposition and names the restructuring specialist with
    the complexity-reduction skill,
  When the run adjudicates that refusal,
  Then the restructuring specialist appears in the ordered record of parties the run
    engaged, after the refusal and before delivery is attempted again,
  And what the specialist is given tells it to apply complexity-reduction,
  And between the refusal and the second delivery attempt python-coder is not engaged
    to bring the function under its ceiling.

  Given instead the file-size check refuses delivery with the disposition that hands
    the demand to the restructuring specialist,
  When the run adjudicates that refusal,
  Then the restructuring specialist is engaged as BO-3800b-1 requires, and what it is
    given does not tell it to apply complexity-reduction, so the skill follows the
    refusing check's declaration and is not attached to every engagement.

  Given a ticket is being driven and check-doc-links refuses its delivery, and
    check-doc-links' remedy declaration has the author-clears disposition and names no
    specialist,
  And, in a second run, check-doc-frontmatter refuses its delivery, and its remedy
    declaration has the mechanical-autofix disposition and names general-purpose as its
    fixer,
  When the run adjudicates each refusal,
  Then in neither run is any party engaged beyond those the same refusal engages before
    this capability exists, as BO-3800e-1 requires, because only the engage-specialist
    disposition brings in a specialist.
depends_on:
