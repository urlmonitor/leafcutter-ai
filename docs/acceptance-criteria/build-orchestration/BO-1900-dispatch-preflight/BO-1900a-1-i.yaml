roadmap_phase: phase_1
criteria: |
  Given a ticket at the dispatch point,
    and the preflight validation stage itself raises an unexpected error while evaluating
    a fitness check (for example the check subprocess crashes),
  When the supervisor runs preflight before spawning,
  Then the ticket is held back rather than dispatched,
  And the held-back reason states that preflight could not complete and names the check
    that errored,
  And the phase agent is never spawned.
