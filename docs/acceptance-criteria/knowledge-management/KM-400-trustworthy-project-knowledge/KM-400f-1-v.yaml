change_target: code
risk_surface: contract_boundary
notes: |
  Authored 2026-10-12. This record is deliberately about MEASUREMENT, not about reclaiming
  orphaned nodes, and the reason is a measurement rather than a judgement.

  Measured on the live hosted store, 2026-10-12: all 123,810 generation-tagged entity nodes
  DID have a corresponding generation record. The entity-nodes-without-a-record case is
  therefore currently HYPOTHETICAL — it has never been observed on either destroyed
  instance. Saying so is the point. Writing criteria that specify how to reclaim an orphan
  set nobody has seen would be inventing coverage; writing criteria that make the orphan
  count an explicitly reported figure makes the hypothetical detectable the first time it
  happens, at the cost of one number.

  The second scenario's input is consequently a constructed case, not an observed one, and
  the record states that rather than implying a measurement behind it. If the figure is ever
  reported non-zero on a real store, the reclamation behaviour for those nodes becomes a new
  record with real measurement behind it — it is not specified here.

  The first scenario carries the real measurement and is the one that binds today: an
  evaluation that reports per-generation node counts summing to the store's own total is the
  evidence that the reconciliation actually looked at every node, which is what makes the
  zero trustworthy. The fourth scenario separates two states that an implementation is prone
  to conflate: a generation record with no nodes attributed to it is accounted for and
  empty, which is not the same as a node with no record.
it_requirements: null
test_required: true
test_spec:
  - name: test_fully_accounted_population_reports_an_explicit_zero_and_per_generation_counts
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: criterion
    description: With 12 generation records that record failed publications and every
      generation-tagged node naming one of them, assert the evaluation reports 0 unaccounted
      nodes explicitly and reports a per-generation node count whose sum equals the store's
      own total node count.
    covers: [KM-400f-1-v]
    must_catch:
      - "count nodes only within generations whose publication completed, so the per-generation counts sum to zero while the store holds 123,810"
      - "omit the unaccounted figure when it is zero"
      - "report a per-generation node count that does not sum to the store's own total"
    requires_db: false
  - name: test_unaccounted_nodes_are_counted_named_and_never_reported_reclaimable
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: boundary
    description: Construct 400 generation-tagged nodes naming a generation for which no
      record exists, then assert the evaluation reports the figure 400, names the generations
      referred to, reports those nodes as unaccounted rather than reclaimable, and still
      issues a verdict for every generation that does have a record.
    covers: [KM-400f-1-v]
    must_catch:
      - "report unaccounted nodes as reclaimable, so a sweep would reclaim nodes no policy evaluated"
      - "stop issuing verdicts for the recorded generations once an unaccounted node is found"
      - "report that unaccounted nodes exist without stating how many or which generations they name"
    requires_db: false
  - name: test_unaccounted_figure_moves_with_the_unaccounted_population
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: discrimination
    description: Evaluate with 400 unaccounted nodes, add 200 more, evaluate again and assert
      the reported figure rises from 400 to 600.
    covers: [KM-400f-1-v]
    must_catch:
      - "return a literal figure that does not move with the population"
      - "report a boolean indication that unaccounted nodes exist instead of a count"
    requires_db: false
  - name: test_an_empty_generation_is_accounted_for_not_unaccounted
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: failure
    description: With 12 generation records and no node naming any generation, assert each
      record reports a node count of 0, the unaccounted figure is 0, and no empty generation
      record is misreported as unaccounted for.
    covers: [KM-400f-1-v]
    must_catch:
      - "report a generation record with zero attributed nodes as an unaccounted-for case"
    requires_db: false
  - name: test_live_reconciliation_matches_a_real_backends_own_node_total
    target_dir: tests/knowledge_live/
    framework: pytest
    type: integration
    angle: real_artifact
    description: Against a real database holding generations that record failed publications,
      assert the sum of the reported per-generation node counts plus the reported unaccounted
      figure equals the backend's own count of generation-tagged nodes.
    covers: [KM-400f-1-v]
    requires_db: true
test_rationale: >-
  The figure this record exists to produce is a zero today, and a zero is the easiest value
  in the store to report by accident. Under KM-400f-1's existing fixture of completed and
  retired generations, a reconciliation that counts nodes only inside completed publications
  reports zero unaccounted and per-generation totals that look right — the same fixture bias
  that let the whole evaluator aim at an empty population. Every fixture here reproduces the
  REAL observed shape instead: generations whose publication FAILED, carrying no retirement
  time, holding every node in the store, because that is the only shape under which a
  completed-publication-only reconciliation reports a sum of zero against a store of 123,810
  nodes and is thereby caught. The sum-equals-the-store's-own-total assertion is what
  distinguishes a reconciliation that examined every node from one that examined none and
  found nothing wrong. The moving-population test is required because the asserted value is
  otherwise a literal zero, which any implementation satisfies. The unaccounted scenarios are
  CONSTRUCTED, not observed — no real store has shown a non-zero figure — and they are
  written to make the hypothetical detectable rather than to claim it has occurred.
