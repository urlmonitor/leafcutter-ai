assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The invariant is ordering-independent: the collision must be detected regardless of which phase writes first, so reordering artifact_phases cannot mask the defect. Detect the same-target write and fail rather than allowing last-write-wins."
  - "Detection must happen such that no partial/overwritten artifact reaches consumers — fail the build instead of completing with an ambiguously-authored file."
