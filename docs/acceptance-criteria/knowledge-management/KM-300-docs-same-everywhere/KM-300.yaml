criteria: |
  One documentation map, identical and working on every machine.

  The project keeps an automatically maintained map of all its written
  material. That map should be something anyone can rely on: every entry opens
  the page it names, whether you browse the project online or on your own
  machine, and it looks exactly the same no matter which contributor's computer
  last refreshed it. Teams that mix operating systems never see the map quietly
  break for one half of them, and never see their change history cluttered by
  the map flipping back and forth between two versions of itself.
