criteria: |
  A record of your project you can rely on — at any size, in any project.

  Every project that adopts this tooling gets a written record of what it does:
  the journeys through it, the example data behind them, and the screens people
  see. That record is only worth having if you can trust it without checking it
  yourself. This goal makes it trustworthy in both directions of a project's
  life: honest on day one when it is empty and has nothing to say, and still
  correct months later when it is large, busy, and nobody remembers writing half
  of it. You should be able to read it and act on it, rather than reading it and
  then going to confirm it.
