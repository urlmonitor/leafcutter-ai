notes: |
  Isolated as an L3 because it is the single most likely wrong implementation of
  BO-2900a-1, and it is wrong in a way that leaves the gate green.

  THE TRAP. The cheap reading of BO-2900a-1 is "did the run enter the unit's way in".
  Under that reading, any proof test can be made to pass the gate by adding one
  unrelated invocation of the command surface — a help call, a status call, a call to
  a different action entirely. The gate would then be satisfied by a ritual, and the
  fast-lane regression would still ship: the functions would remain unreached while
  the criterion turned green. The condition is REACHED-THROUGH, not ENTERED.

  Consequence for implementation: the evaluation needs the path taken during the run
  (way in entered AND code under proof entered on the same run), not two independent
  facts. Two separate booleans ANDed together reproduce the trap whenever the test
  does both things in separate, unconnected steps.

  Kept as an L3 rather than a fourth L2 because it does not add a new guarantee — it
  fixes the interpretation of an existing one, and it shares BO-2900a-1's fixtures.
