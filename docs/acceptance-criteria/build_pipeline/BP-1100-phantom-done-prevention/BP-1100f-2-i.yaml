title: "Asserting the artifact path was passed as an argument is topology, not effect coverage"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
criteria: |
  Given a work item declares a durable side-effect (an artifact written to disk),
  And its only side-effect-related test asserts that the artifact's destination path was
    passed as an argument to the dispatched helper, without ever reading the artifact back,
  When the test-evidence sufficiency check evaluates coverage,
  Then it still reports the side-effect as uncovered, treating a path-argument assertion as
    dispatch topology rather than proof the artifact was written,
  And coverage is satisfied only by a test that observes the artifact's actual existence or
    content after the work runs.
