id: ACD-300e-1
components:
  - ac_driven_dev
readiness: approved
priority: medium
title: "Each authoring agent template declares knowledge-query under skills, and the registry shows it in skills_invoked"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: done
criteria: |
  Given the agent templates for product-owner, business-analyst and it-po, each with a
    YAML frontmatter block,
  When each template's frontmatter is read,
  Then its skills list contains an entry with skill_id "knowledge-query", mode
    "conditional" and a non-empty condition stating when to search the knowledge graph
    for component context,
  And every other ability the template declares under skills is preserved (product-owner
    and business-analyst also declare "ac-tree-split"),
  And the frontmatter parses as valid YAML,
  And the "knowledge-query" entry resolves to the packaged knowledge-query skill, so the
    build accepts the declaration,
  And given the agent registry has been regenerated from those declarations,
  When the registry records for product-owner, business-analyst and it-po are read,
  Then each record's skills_invoked list contains a "knowledge-query" entry with the same
    mode and condition as its template declaration,
  And no record carries the retired skills_used field.
depends_on: [ACD-300e]
