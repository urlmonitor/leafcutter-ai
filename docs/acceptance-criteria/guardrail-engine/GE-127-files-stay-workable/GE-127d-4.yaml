  by: business-analyst
  at: '2026-10-16'
  note: >-
    Title and criteria changed on BrainCandy's answer of 2026-10-16: the backstop
    applies only to files whose previous version is already over its limit
    (previous measured length strictly greater than the permitted length, under the
    rule in force per GE-127d-3-iii). A file at or under its limit is never refused
