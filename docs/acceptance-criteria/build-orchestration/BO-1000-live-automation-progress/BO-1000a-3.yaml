    description: "When a step's required outcome is already satisfied (e.g. PR already open, branch synced, closure commit exists, PR already merged, worktree absent), finalize still emits a start line reporting the step is skipped and naming the concrete already-satisfied condition."
  - name: test_skipped_step_not_silently_omitted_from_progress_output
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "A skipped step still appears in the progress output — it is never a silent early-return that removes the step from the narration."
