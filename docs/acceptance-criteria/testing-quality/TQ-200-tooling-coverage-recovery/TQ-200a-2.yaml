id: TQ-200a-2
title: "Spawn bidirectionality checking is covered by tests"
component: testing-quality
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a registry in which agent A lists B in its spawn list and B lists A in
    its allowed-spawner (reverse) relationship,
  When _check_spawn_bidirectionality runs,
  Then it reports no asymmetry for that edge.

  Given a registry with a one-directional spawn edge — agent A declares it can
    spawn B, but B does not declare A as an allowed spawner,
  When _check_spawn_bidirectionality runs,
  Then it flags the asymmetry and the reported error names both the spawner (A)
    and the target (B) and the missing reverse direction.

  Given a registry with a spawn edge that points to an agent id that does not
    exist in the registry,
  When _check_spawn_bidirectionality runs,
  Then it reports an error naming the dangling target id rather than silently
    ignoring the edge.
