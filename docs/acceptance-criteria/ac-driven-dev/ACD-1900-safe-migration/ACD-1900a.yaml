notes: |
  ADR-026 non-negotiable rule 1 ("Additive schema first"). The new AC fields (deliverable
  checklist, per-deliverable sign-offs -- defined by ACD-1800) land OPTIONAL, in lockstep
  with the code that reads them; every AC carries schema_version (1=legacy, 2=new); the whole
  store validates on BOTH shapes; additionalProperties is never tightened until the store is
  100% backfilled. Guards the dormant "additionalProperties:false" tripwire the deliberation
  found (config/ac_store_schema.json declares it but nothing enforces it today, and the
  validator docstring is wrong -- fixing that is part of this L1's scope).
