id: BO-3500c-2-i
components:
  - build_orchestration
  - documentation_system
title: "Proof for a written page: it exists in this run's change, carries content on the subject asked for, and is reachable"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a member whose artifact is a written page,
  When its proof is established,
  Then the page the requirement named exists and is part of the change this run
    produced,
  And the page carries content beyond its heading and any template scaffolding,
  And the subject the requirement named is addressed in that content,
  And the page is reachable from a surface a person wrote and maintains — a link from an
    existing page, a reference carried by a requirement, or a project instruction file —
    so a page nobody can find is not counted as delivered.

  Given a page whose only route in is an index that this same run generates,
  When its proof is established,
  Then that route does not satisfy reachability and the proof fails,
  And the reason given is that the evidence and the thing it is evidence for share a
    producer — so a reachability check that a rebuild can satisfy, or empty, is not
    evidence at all.

  Given a member whose named page already existed and was not changed by this run,
  When its proof is established,
  Then the proof fails and the member is not finished — an unchanged page is not
    evidence that this run wrote anything.
depends_on: [BO-3500c-2]
doc_links:
  - path: docs/known-issues/build-orchestration.md
    relationship: related
    status: exists
    relevance: "KI-BO-013 fix direction 2 proposes exactly the first two clauses of the first scenario. The remaining clauses are the difference between that floor and a proof."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "READING CLASS. This proof compares nothing, so its receipt carries NO condition_a, condition_b or difference (BO-3500c-1). If the implementation ever emits one, the receipt is rejected at write time — that cross-check is intentional, not redundancy."
  - "'EXISTS AND IS PART OF THIS RUN'S CHANGE' MEANS THE RUN'S OWN DIFF against its base ref, not a filesystem stat. A file that was already there passes a stat and proves nothing; the third scenario exists to fail exactly that."
  - "'CONTENT BEYOND HEADING AND SCAFFOLDING' IS MEASURED AGAINST THE DECLARED TEMPLATE for the doc's type (config/doc_types.json), not against a fixed byte count. A byte threshold is either trivially passed by boilerplate or fails a legitimately short reference page."
  - "'THE SUBJECT IS ADDRESSED' IS DELIBERATELY MODEST AND MUST STAY MODEST: the terms the requirement names appear in the BODY, not only in the heading. No quality judgement — a machine can check address, not merit, and a clause demanding merit would be untestable and satisfied by anything."
  - "REACHABILITY MUST KEY OFF A HAND-AUTHORED SURFACE AND NEVER docs/INDEX.md (finding F3). scripts/generate_doc_index.py REGENERATES that index during the same build.py run, so the proof and the thing proved would share a producer and the check would pass because the build ran. KI-BP-016 also records a mis-rooted build overwriting it with a 'No docs found.' stub, so the same check fails for reasons unrelated to the page. Both directions are noise. Accepted surfaces: an inbound link from an existing hand-maintained .md, a doc_links entry on an AC record, or a project instruction file (CLAUDE.md / README.md)."
  - "THE GENERATED-INDEX ROUTE MUST BE ACTIVELY REJECTED, not merely not preferred: if the only inbound link comes from a generated file, the proof FAILS with that reason stated. Determine 'generated' from the producing scripts' declared outputs, not from a hard-coded filename list — a filename list is the same by-name exemption D4 forbids elsewhere."
  - "REUSE BO-2200's EXISTING DOCUMENTATION CHECKS WHERE THEY ALREADY DO THIS. This is not a second documentation gate; it is the proof instrument for one kind in a lean run that until now could not produce that kind at all. Reuse is a merit here."
  - "NO PRESENCE-ONLY ASSERTIONS. Every test constructs a real page in a real diff and executes the proof."
