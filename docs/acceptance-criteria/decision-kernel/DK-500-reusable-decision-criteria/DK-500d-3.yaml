notes: |
  OPEN, NOT SETTLED BY THE FLOWS (PO open item): how a NEW decision's reuse becomes a member pair. Option 1: publishing the decision also stages and publishes the category update in the same person-run publish. Option 2: the next mining round proposes the pair for a person (DK-500a-1-ii's last clause). This AC pins only the invariants both options must keep; the IT PO or the user picks the path. DK-500f's usage and outcome counts depend on it.
  Membership lives only in the category record; published decision records stay unchanged (dec-93c1c730463c1f3c).
  FLOW BACK-LINK (for step.implements, to be applied by the store owner): leafcutter/criteria-library: publish.
  Authored by the business-analyst stage of /plan-feature (route strategic) under decision dec-93c1c730463c1f3c; readiness draft, no product approval implied.
  IT PO (2026-10-05), Q1 settled as an IT PO default to confirm: option 1, the pair joins at publish through the run's own staged membership addition, published by the same decisions publish as the decision. Reason: it records the actual reuse instead of re-inferring it, keeps usage counts current (DK-500f), and needs no decision-record schema change. Option 2 stays a fallback only for reuse the run could not record.
