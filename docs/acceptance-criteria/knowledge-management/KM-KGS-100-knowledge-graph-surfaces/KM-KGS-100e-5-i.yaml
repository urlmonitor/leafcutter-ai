  - "The uninferable-report path must preserve idempotency (KM-KGS-100e-5): items routed to review remain unchanged on every subsequent run, and the report is deterministic across runs on an unchanged store."
  - "Follow the project error-handling policy; the review report is data output, not an error/exception."
