notes: |
  THE ID AND THE TARGET PATH ARE FIXED FROM THE OTHER SIDE. Four sibling records --
  ACD-2100c-1, c-2, c-4 and c-5 -- already carry a planned doc_link to
  docs/architecture/diagrams/c3-006-plan-feature-decision-gate-sequence.md naming
  ACD-2100e-1 as its author, and ACD-2100c-1 additionally carries a delivers_to
  contract to this id and to architecture-diagram-author. Authoring under a different
  id or at a different path silently dangles all of it: check-doc-links reports a
  broken link, never a target that was never created.

  THE CLOSED-SET CLAUSE IS THE POINT OF THE FIRST THEN. "Depicts no decision point
  the route does not present" is what stops the diagram going stale in the direction
  that matters. KI-ACD-005 lists three decision points; the PO verified five on
  2026-08-25, and the two the known issue omits include the stranded-draft decision,
  which can delete drafts. A diagram drawn from the known issue would be missing the
  destructive one on the day it was published. Sites are named by what they decide
  rather than by line number so the criterion survives the file moving.

  THREE EXITS ON EVERY DECISION POINT, NOT ONE HAPPY PATH. The failure this diagram
  exists to prevent is a reader who believes the only way past a gate is an answer.
  Each of the three exits is owned by a different sibling -- answered by the person
  (c-1), nobody reachable (c-2), answer refused for provenance (c-4) -- which is why
  all three appear in depends_on. The one-discard-path clause is c-5's invariant made
  visible: if a reader can find a second way out of the diagram that loses work, the
  invariant has not been delivered.

  RESUME IS DELIBERATELY NOT DEPICTED HERE. Re-entering a paused run at the decision
  it stopped at is ACD-2100c-3's behaviour and ACD-2100e-2's subject. Adding it would
  pull ACD-2100c-3 into this record's ordering for a single arrow and would put the
  operator's procedure into a diagram drawn for a different reader. The two children
  cross-link instead.

  BOUNDARY WITH ACD-2100d-4 -- HELD IN BOTH DIRECTIONS. Nothing here depicts which
  copy of a route file runs where or what the startup checks report; that is the
  reference page for a reader holding a message about a file that could not be found.
  This diagram must not be retargeted at
  docs/reference/plan-feature-layout-and-startup-checks.md.

  BOUNDARY WITH AN EXISTING DIAGRAM -- FOUND WHILE DECOMPOSING, NOT IN THE PO's NOTE.
  docs/architecture/diagrams/c3-002-interactive-pause-resume-sequence.md already
  exists and covers the ADR-024 substrate at message level -- resolveGate, the
  persist/read exchange, the pending-question store, resumeFromRunId -- tagged
  build_orchestration. It is not this diagram and does not serve this trigger: it
  documents how a pause is mechanically effected, not which decisions the route stops
  at or what each exit costs. The overlap is real enough to be worth naming, so it is
  linked as related with an explicit instruction to link rather than restate. If the
  author concludes on reading it that c3-006 would duplicate it, that is a finding to
  raise rather than a licence to merge them -- four inbound links point here.

  DELIVERED BEHAVIOUR ONLY. Every path depicted must name the criterion that delivers
  it, and none of it may be drawn from KI-ACD-005's fix direction: that known issue's
  stated root cause and its stated fix are both out of date -- resolveGate already
  pauses on an unparseable answer and the observed loss came from a well-formed one --
  so a diagram drawn from it would be wrong on the day it was published. The whole
  gate flow is being replaced underneath this page, which is why depends_on names four
  leaves rather than the composite.

  DEPENDS_ON CARRIES THE ORDERING AND NOTHING ELSE DOES. The build sequencer reads
  depends_on only; expects_from edges are invisible to it (KI-ACD-015, open), which is
  the gap ACD-2100d-4 hit and had to recommend explicit edges for after the fact. So
  the four leaf edges are mirrored here rather than left to the composite edge on
  ACD-2100e. The expects_from contracts below record what each leaf owes this page;
  they are documentation of the contract, not the ordering mechanism.

  FOR THE IT PO: assigned_agent is architecture-diagram-author per ACD-2100c-1's
  delivers_to contract. This is a diagram deliverable with no executable surface, so
  test_required: false with an explicit test_rationale is the likely correct call --
  permitted because change_target is docs, with ACD-2100d-4 the precedent in this same
  tree. Do not let that become a grep-for-words test: a test asserting that five
  labels appear in a diagram passes on a diagram that shows them in the wrong
  relationship, and presence-shaped proof is what this tree exists to discredit. The
  two mechanically checkable clauses -- index reachability and the component
  declaration -- are already covered by the generated docs/INDEX.md and
  check-doc-frontmatter.

  2026-08-25 (it-po): CONFIRMED architecture-diagram-author rather than chosen. The
  assignment was already fixed from the other side by ACD-2100c-1's delivers_to
  contract, which names both this id and that agent; the registry carries the agent and
  documentation-expert dispatches it as the diagram specialist. Sized M -- one new
  diagram file plus a parent-doc children: edit plus the regenerated docs/INDEX.md, so
  three files, with the composition rather than the volume being the work. Test contract
  is test_required: false with the reason recorded in test_rationale rather than left to
  inference, following ACD-2100d-4 in this same tree; permitted because change_target is
  docs, which the schema validator allows.

  THREE CONSTRAINTS THE BA COULD NOT SEE, ALL FOUND IN THE LIVE GATES AND ALL RECORDED
  ABOVE. They are the reason this record is not simply "draw the diagram":
    - check_mermaid_complexity caps a sequence diagram at 8 participants, 25
      interactions and 4 boundaries. Five decision points times three exits is fifteen
      arrows before any setup, so the cap is genuinely close and the temptation under it
      is to drop an exit -- which would delete the criterion. Named as a
      raise-a-finding, never a silent thinning.
    - check_mermaid_parent_link is BLOCKING and bidirectional, and there is no eligible
      parent today: docs/architecture/components/ac-driven-dev.md is itself
      L3-Component and the hook requires the parent to be strictly higher. The author
      has to choose an L2 parent and edit its children: list in the same commit, or
      declare root: true as c3-005 does. Discovering this at commit time costs a cycle.
    - check_doc_frontmatter validates components entries against docs/components.json,
      whose keys are the underscore ids -- so the frontmatter must read ac_driven_dev.
      ACD-2100d-4's corresponding requirement says the kebab ac-driven-dev, which would
      fail that gate; flagged there rather than copied here.

  ONE CHECK THE STORE LEANS ON DOES NOT DO WHAT THE NOTES ASSUME. Four records in this
  tree cite check-doc-links as the reason a wrong target path matters. The hook validates
  DOC_LINKS declared in Python and SQL files only and its docstring states it always
  exits 0 -- no hook in this repository validates a markdown-to-markdown link. The
  conclusion the notes draw is still right (publish at the exact path) but the stated
  reason understates it: a wrong path is not "reported as a broken link", it is not
  reported at all, on either side.

  ORDERING GAP RECORDED AND NOT EDITED (depends_on is BA-owned). ACD-2100e-2's how-to
  links this diagram and sends the operator here, so this record is upstream of it, but
  ACD-2100e-2's depends_on does not name ACD-2100e-1. The build sequencer reads
  depends_on only (KI-ACD-015, open) and nothing validates the markdown link, so building
  e-2 first publishes a live page pointing at a file that does not exist and nothing
  reports it. Recorded as a delivers_to contract above and mirrored as an expects_from on
  ACD-2100e-2. The recommended edit before approval is to append ACD-2100e-1 to
  ACD-2100e-2's depends_on. Left to the BA rather than applied here.
target_epic: EPIC-StartingNewWorkTheProperWayAlways
