notes: |
  THE REAL FIX BEHIND THE TQ-500f-3 SAFETY NET (user decision 2026-09-27: defer
  to its own AC). The proof-of-done check matches a covering tag to a test run
  result by (file name, bare function name). Two tests with the same function
  name in two classes of one file, or in same-named files under different
  package directories, collapse onto one result, so one test's outcome is used
  as the other's — for proof-of-done and for the red-baseline reader, which
  shares the matching. The TQ-500f-3 build only makes the reader FAIL CLOSED
  ("ambiguous_test_identity") when that happens. This AC removes the cause.

  THE SAFETY NET STAYS. After this AC, the "ambiguous_test_identity" refusal
  should become rare, but it is kept: any tag that still cannot be tied to
  exactly one test (last Then clause) is refused, never guessed. A fix that
  removes the refusal because "full identity makes collisions impossible" has
  broken this AC. If the TQ-500f-3 build lands without that refusal, this AC's
  last clause owns it.

  The TQ-9001..TQ-9004 ids and the test paths in the Given are fixture values,
  not real records.

  SIZE CONSTRAINT FOR THE IMPLEMENTER (user direction): scripts/ac_store/done_proof.py
  is over the file-size ratchet (2,355 lines on origin/main at 86bd630f). This fix
  must not make it grow; the matching has to move out into its own module (the one
  the red-baseline reader then also uses), so the net line count of done_proof.py
  goes down. IT-PO: carry this into it_requirements.

  PLACEMENT. L3 under TQ-500f-3 (the absence/assertion red-baseline behaviour, whose
  build surfaced the defect). TQ-500f is at its 6-L2 override and TQ-500 at its
  7-L1 cap, so a new L2/L1 was not possible without raising a cap; L3s have no
  child cap. ACS-200f (the proof-of-done gate, work_status done) was the other
  candidate home; it was not reopened.
