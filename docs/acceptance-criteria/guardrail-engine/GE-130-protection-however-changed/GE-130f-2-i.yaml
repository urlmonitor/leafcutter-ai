notes: |
  FINDING (GE-130f notes): a Write carries no old_string/new_string, so the trivial-edit skip is
  always true and a Write is never checked. Named mutation that turns ONLY this record red:
  restore "no before/after text means trivial". GE-130f-2 uses the Edit tool and stays green.

  declares_side_effect: false.
  IT-PO ENRICHMENT (2026-09-25).

  THE RULE, NOT THE SPECIAL CASE. "A Write is never trivial" closes today's hole and re-opens it
  for the next payload shape. The rule is: an allowance may apply only to a payload it can
  measure; a payload lacking the fields the size is computed from is unmeasurable, and
  unmeasurable is checked. Absent input is never benign input.

  DO NOT SYNTHESISE A BEFORE-IMAGE. Measuring a Write against the file's current size on disk
  looks like the tidy fix and re-opens the hole for a whole-file rewrite with a small net delta,
  while making the allowance depend on state the request never carried.

  ORDER MATTERS AS MUCH AS THE RULE. The skip runs before any guide lookup, so an unmeasurable
  payload never reaches the check at all. Whatever shape the repair takes, it must reach it.

  CREATE AND REPLACE ARE DIFFERENT. A create has no before-state at all; a replace has one the
  request does not carry. A repair that handles only replacement leaves file creation - the
  commonest way new work enters a gated folder - unchecked, and nothing else in this tree would
  notice.
