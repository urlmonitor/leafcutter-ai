notes: |
  Gap G7 test-runner half: pytest tmp_path_retention_policy = failed, and --basetemp never at
  a durable path (test-logs/wire-700a5-tmp reached 3.4 GB). The settings themselves are
  config; the refusal of a durable scratch base is code -- both owned by one implementer
  because the proof is one suite run.
  Proof must run a real test session in a subprocess and inspect disk afterwards; asserting
  that a setting string appears in the settings file is explicitly insufficient (repo
  CLAUDE.md: a pytest setting present in the file was shown to enforce nothing, TQ-600a-5).
