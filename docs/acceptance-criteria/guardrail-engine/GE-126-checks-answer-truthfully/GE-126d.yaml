criteria: |
  Follow the procedure to the end and your new check is fully wired in.

  The written procedure for adding a check lists every place it has to be
  registered, and the parity check that confirms registration knows about every
  one of them. Leaving a place out is a deliberate choice you record rather than
  an omission you never learn about.
