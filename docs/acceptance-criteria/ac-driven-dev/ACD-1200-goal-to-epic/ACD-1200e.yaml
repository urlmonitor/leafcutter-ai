criteria: |
  No new command to learn — /build-ac detects whether the target is a leaf or a goal and does the right thing.

  When invoked with a leaf-level AC, the command behaves as it does today
  (single ticket, single build). When invoked with an L0 or L1 AC, it
  switches to epic-generation mode automatically. The user's mental model
  stays the same: "build-ac means build from the AC store."
