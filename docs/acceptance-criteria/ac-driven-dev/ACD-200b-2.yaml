notes: |
  Item 6, user decision D2 (2026-10-16): the map stays in code, as built TRIGGER_SPECIALISTS
  in scripts/ac_store/_rc_doc_triggers.py. The NAMES are duplicated today in
  validate_ac_schema._DOC_TRIGGER_VALUES and in the schema enum; fold them into one list.
  Which of the two survives as the one list (the schema enum is the natural single source
  both validators already read) is the IT PO's call. "api-guide" is a fixture name.
