assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - "Ruff-tooling-unavailable is a THIRD outcome (inconclusive), distinct from pass and from a genuine lint failure; it must never be collapsed into a silent pass."
  - "Worktrees historically lack some hook/tooling wiring (the worktree pre-commit gap is the originating motivation), so the tooling/config-unavailable path is a real, expected branch the gate must handle explicitly with a named reason."
  - "An inconclusive ruff check blocks an 'ok' sign-off on the Python surface and is escalated to the supervisor (consistent with the inconclusive-not-pass pattern used by BO-1400a-1-i)."
