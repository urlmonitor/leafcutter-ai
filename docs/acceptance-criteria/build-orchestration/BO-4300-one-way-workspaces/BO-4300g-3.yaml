id: BO-4300g-3
title: "Finalize's workspace removal carries the caller authorization for exactly its own workspace and branch"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: critical
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
declares_side_effect: false
criteria: |
  Given finalize is run for the branch "feature/eta", whose workspace is
    "<landing root>/feature/eta",
  And its pull request has merged and the workspace holds no unsent work,
  When finalize reaches step 7, the workspace removal,
  Then its one dispatch to the removal-capable agent carries a caller authorization
    naming exactly the workspace "<landing root>/feature/eta" and the branch
    "feature/eta",
  And after the run that workspace is gone and no other workspace under the landing
    root is changed,
  And finalize asks no interactive question at step 7.
depends_on: [BO-4300g, BO-4300e, BO-4300g-1, BO-4300e-2]
