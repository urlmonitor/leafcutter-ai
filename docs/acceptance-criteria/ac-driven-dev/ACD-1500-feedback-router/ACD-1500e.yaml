id: ACD-1500e
readiness: approved
priority: medium
title: "The platform improves how it collects feedback, not just what it does with it"
component: ac-driven-dev
level: L1
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  When feedback is too thin to act on, the system files feedback to make future feedback better.

  Sometimes an entry cannot be routed confidently because it is missing the
  detail the platform needs -- no clear target, no root cause, a vague note, or
  too coarse a category. Instead of just giving up, the platform records its own
  feedback that the feedback process should improve: made quicker for agents to
  fill in, and richer and more structured so the required detail is captured up
  front. Over time the corpus the platform learns from gets better on its own,
  and future routing becomes more confident. The system is both a consumer and a
  producer of feedback, continuously raising the quality of its own inputs.
