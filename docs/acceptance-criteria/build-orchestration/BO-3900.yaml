test_spec:
  - name: test_windows_absolute_ticket_path_reaches_phase_agents_unjoined
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The incident replay — an absolute backslash ticket path inside a forward-slash-spelled worktree reaches every phase agent prompt as one absolute path with one drive root."
  - name: test_relative_ticket_paths_in_either_separator_are_joined_onto_the_worktree_once
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Forward-slash, backslash and mixed relative spellings all reach phase agents as the same single path under the worktree."
  - name: test_absolute_path_outside_the_worktree_is_never_joined
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Drive-letter, lowercase drive-letter, UNC and POSIX absolute paths outside the worktree pass through naming the same file."
  - name: test_depends_on_in_any_spelling_resolves_to_the_dispatched_ticket_path
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: seam
    description: "A predecessor named in depends_on by an absolute Windows path, a relative forward-slash path, or a relative backslash path is matched to the path the run dispatches it under."
  - name: test_posix_worktree_paths_keep_their_current_outcomes
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The POSIX spellings reach the same outcomes as before the fix, so the change does not trade one platform for the other."
  - name: test_cross_platform_path_resolution_is_reachable_from_the_workflow_top_level_body
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: templates/workflows-js/build-feature.js
    description: "Every case above is driven through _workflow_engine_harness.py running build-feature.js's own top-level body, asserting on dispatched prompts, not on a helper's return value."
  - name: test_plan_feature_cross_platform_path_joins_are_reachable_from_its_own_top_level_body
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: templates/workflows-js/plan-feature.js
    description: "plan-feature.js's own top-level body, run through _workflow_engine_harness.py with a Windows-spelled authoring worktree and Windows absolute, backslash-relative and forward-slash-relative file paths, hands its agents one correct path each: an absolute path is never joined onto the worktree."
  - name: test_build_epic_path_derived_names_are_reachable_from_its_own_top_level_body
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: templates/workflows-js/build-epic.js
    description: "build-epic.js's own top-level body, run through _workflow_engine_harness.py with the epic path spelled with backslashes and with forward slashes, derives the same epic name EPIC-TruthfulProjectRecord in both, not the whole path."
test_rationale: |
  The defect is in what a top-level workflow body hands to agents, not only in what a
  helper returns. A pure-function test of a corrected helper stays green if the workflow
  keeps calling the old helper at one of its call sites (the ticket path and the
  depends_on path go through separate call sites), if the fix lives in a helper nothing
  calls, or if the fix reaches for a module the workflow engine does not provide — the
  E2 engine injects no module loader, which already made one done criterion false
  (BO-1000c-1a, recorded in KI-BO-028's addendum). Only running build-feature's own body
  through _workflow_engine_harness.py and reading the paths out of the dispatched prompts
  distinguishes a workflow that hands agents the right file from one that merely contains
  a correct function. The inputs must be literal Windows-shaped strings, never paths built
  from the host's separator, or the Linux CI runner never sees a backslash and the test
  passes vacuously (BO-3900a owns that property). The same argument applies to each script
  separately. plan-feature and build-epic have their own path code (see notes), so a green
  build-feature run says nothing about them. Each gets its own harness entry.
