test_rationale: "The artifact is a Mermaid state diagram embedded in an architecture page; it has no executable surface for a test to drive, and its correctness is a question of whether it matches the machine rather than whether any code runs. Its mechanical gates are the repository diagram hooks (check-mermaid-drift, check-mermaid-parent-link, check-diagram-naming, check-mermaid-complexity), which run at commit time rather than as unit tests. A test that asserted a state name appears in the page text would be a presence-only check that passes on a diagram whose edges are wrong -- the same grep-on-prose failure mode CLAUDE.md's gate/workflow rule prohibits for behavioural ACs. The states and transitions depicted are covered by the executing tests on ACD-2000a-1, ACD-2000a-2 and ACD-2000a-3; the diagram's own acceptance is the fifth criterion's trace test, performed by a reader."
