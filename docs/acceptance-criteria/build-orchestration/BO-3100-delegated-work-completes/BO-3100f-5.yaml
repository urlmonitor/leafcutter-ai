  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader deciding how a run will report a step that could not finish,
  When they open the state diagram for a step's outcome,
  Then it shows each outcome a step can end in as a distinct state, including
    completed, skipped and stopped short,
    And it shows what causes each transition into those states,
    And it shows no transition between skipped and stopped short in either
      direction.

  Given the diagram,
  When it is compared against the outcomes a real run records,
  Then every state the diagram shows is one a real run records,
    And every outcome a real run records appears in the diagram,
    And every transition the diagram shows can be produced by a real run.

  Given the diagram,
  When a reader looks for what a step ending in stopped short does to the run's
    leading outcome value,
  Then the diagram shows that value being withheld from success while any step is in
    that state,
    And it shows no transition by which a step leaves the stopped-short state
      because the run decided the step was not required,
  So the diagram cannot be read as permitting a stop to be resolved by dropping the
    step.
