criteria: |
  Given a build or authoring guardrail whose subject is present as a defect in the canonical
    source tree but where the deployed working copy is clean (an older, correct copy),
  When the guardrail runs,
  Then it reads the subject from the canonical source and detects the defect,
  And it fails with a message naming the defective canonical-source artifact,
  And the clean deployed copy does not suppress the failure.
