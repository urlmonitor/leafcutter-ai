it_requirements:
  config_schema_fragment:
    fast_lane_red_baseline_verdict:
      type: object
      description: "Verdict is 'red baseline established' iff at least one newly-added covering test is classified red; newly-added green tests are emitted as a non-fatal green_at_baseline list (test id + AC id)."
  reference_file_path: "scripts/build_orchestration/fast_lane.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "The verdict is a fold over the newly-added partition, not an early return on the first green test — the pre-amendment implementation returned all_red=False on the first PASSED outcome and must not survive as a short-circuit."
    - "green_at_baseline entries must be emitted individually (test id + AC id), never collapsed into a count, so the operator can act on them."
    - "The coder-dispatch precondition stays a hard gate: an established red baseline is required, only its definition changes (BO-2400a-3)."
    - "The covering test must use a mixed newly-added set (some red, some green) — an all-red fixture cannot distinguish the amended rule from the pre-amendment one."
delivers_to:
  agent: python-coder
  contract: "The red-baseline verdict (established / halt) plus the green_at_baseline list; the halt path and its reasons are specified by BO-2400a-3-i."
expects_from:
