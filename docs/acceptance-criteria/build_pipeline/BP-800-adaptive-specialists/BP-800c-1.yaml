assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Version must be an integer (monotonically increasing) stored in the knowledge file metadata header"
  - "Must compare current knowledge version against the version recorded in the generated template metadata to detect staleness"
  - "Must fully regenerate the template when version changes (not patch/merge — clean replacement)"
  - "Must be idempotent — if versions match, regeneration produces identical output and may be skipped"
  - "Must handle errors gracefully per the project error handling policy if the knowledge file is unreadable"
delivers_to:
  agent: python-coder
  contract: "Versioned knowledge file at knowledge/<tech>.md with metadata header: {technology_id: str, version: int, category: str} — consumed by the agent generator at build time"
expects_from:
  ac_id: BP-800b-1
  contract: "Agent generator that reads knowledge files and produces templates — this AC adds version-aware regeneration to that generator"
