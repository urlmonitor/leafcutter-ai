  attached to nothing is what the first round of this AC shipped"; and pair it with
  output-equality and parsed-count assertions. And on form: the RATIO rather than an
  absolute threshold, because "an absolute threshold on a shared host under agent
  load is a flaky test, and a flaky guard is removed within a month" — this record's
  own first amendment was caused by reasoning from absolute figures taken in a
  different sitting.

  ==========================================================================
  BELOW THIS LINE: THE RECORD AS IT STOOD BEFORE RETIREMENT, PRESERVED VERBATIM.
  ==========================================================================

  WHY THIS LEVER IS DIFFERENT FROM EVERY OTHER CHILD OF TQ-600a. The rest of this L1
  is about not repeating an expensive deploy. This one is about a single operation
  being 13x slower than it needs to be in a library the package already depends on.
  Three consequences follow, and they are the reason it should be built first:

    - IT DOES NOT DECAY AS THE TQ-600a MIGRATION LANDS. The deploy-sharing levers are
      worth less as the migration completes. The store is not a build artifact; it
      only gets bigger. 3,340 records in August, 4,635 in October — a 39% rise in
      seven weeks. Every month this is deferred, it is worth more.
    - IT IS PARTLY A CORRECTNESS CONCERN, NOT ONLY A SPEED ONE. The done-proof gate
      runs an AC's linked tests under a 60 s budget. A test that sweeps the store
      inside that budget is on a timer, and when it trips, the gate reports every
      linked test as "not run" — which reads as a COVERAGE FAILURE, not as a timeout.
      That is a false phantom-done signal produced by a parser. One author already
      worked around it with a raw-text pre-filter; at 1.86 s a sweep the workaround
      is unnecessary.
    - IT PAYS OUTSIDE THE TEST SUITE. The required "AC store valid" pull-request
      check and the AC pre-commit hooks both pay it, on every pull request and every
      commit respectively.

  PLACEMENT, STATED HONESTLY. This record and its three children are filed under
  TQ-600a because TQ-600a is where the suite-cost work lives and the user needs this
  built now. It is an imperfect fit: TQ-600a's criteria name SHARING as the mechanism
  ("produced once and shared"), and a parse cannot be shared across operating-system
  processes — this lever makes the work cheap rather than making it happen once. The
  natural home is a fourth L1 under TQ-600 along the lines of "the tools stop reading
  the store the slow way", which only the product owner may author. Re-parenting is
  two fields (this record's depends_on and the parent's covered_by) and should happen
  at the next PO pass over the TQ-600 tree.

  ==========================================================================
  WHAT WAS STRUCK (2026-10-08). DO NOT REINSTATE ANY OF THE THREE.
  ==========================================================================
  The three clauses below are the ORIGINAL TEXT, verbatim, as it stood before the
  2026-10-08 amendment. They are preserved so the history is readable and so a later
  reader can see that the change was a retraction rather than a lost requirement. The
  reasoning for each is in the second amended_by entry.

  STRUCK 1, verbatim:
    "And in each of the two headline consumers the parsing itself drops to at most a
      tenth of its pure-Python cost, measured against a baseline taken in the same
      sitting rather than against the figures quoted above, because that portion is
      the only part this change governs,"

  STRUCK 2, verbatim:
    "And each of those consumers finishes end to end in at most a quarter of its own
      same-sitting baseline, which is a floor against regression rather than the
      target: with parsing at 81.8% of the run, even an instantaneous parser caps the
      end-to-end gain at 5.50x, so a fifth is within 10% of a ceiling that no parser
      choice can reach and demanding it would be demanding the impossible,"

  STRUCK 3, verbatim — and this is the one whose INTENT IS REVERSED, not merely unmet:
    "And no entry point in the package names the pure-Python safe parser directly: an
      inventory of readers derived mechanically from the source at implementation time
      lists every one of them, and every one resolves through the shared accessor,
    And that inventory is derived mechanically rather than copied from this record,
      because the reader population and the store both keep growing — 76 source files
      named the pure-Python parser at origin/main d4ee594d, 26 of them under
      scripts/ac_store/ and 30 under templates/scripts/commit_guardian/, and the store
      grew from 3,340 records in August to 4,635 in October."

  Also struck, as a premise rather than a requirement: the Given/And block that
  introduced "the two headline consumers of such a sweep" (store-wide schema
  validation at 23.16 s and a ticket-generation dry run at 24.00 s, parser at 81.8% of
  a 30.16 s run with a 5.48 s non-parse floor). Those measurements are still true of
  the pure-Python parser and of those two scripts; what is no longer true is that
  either script is a BENEFICIARY of this record. The Amdahl arithmetic in the first
  amended_by entry is correct and is retained there for its own sake — it is simply no
  longer load-bearing for anything this record requires.

  ==========================================================================
  WHAT A READER OF THIS RECORD COULD STILL BE MISLED ABOUT
  ==========================================================================
    - THE 13.25x FIGURE IS STILL QUOTED, in the first amended_by entry, in the
      analysis doc this record links, and in yaml_safe_loader.py's own BUSINESS
