notes: |
  PRECONDITION FOR TQ-100b-1-ii — NOT A DUPLICATE OF IT. TQ-100b-1-ii specifies
  what HAPPENS to a tag that resolves to no AC (it is enforced, and flagged to
  the TQ-100c linkage-integrity check). This AC specifies what COUNTS AS A TAG in
  the first place. A future author must not fold the two together, and must not
  build TQ-100b-1-ii first: on today's reader its first run reports 80 items of
  which 64 are artifacts, and a gate that is wrong four times out of five on day
  one gets switched off — after which the 16 genuine dangling tags stay invisible
  permanently. Build order: TQ-100b-4 -> TQ-100b-4-i -> TQ-100b-4-ii ->
  TQ-100b-1-ii. TQ-100b-1-ii's depends_on should gain TQ-100b-4 (that file is
  readiness: approved and was not edited here — flagged to the coordinator).

  MEASURED BASELINE (real store, HEAD 339b0981c, 2026-08-17, produced by running
  the project's own covers-tag scan over the committed unit-test tree, not a
  hand-written fixture): 2,328 tag records / 680 distinct ids / 80 unresolvable /
  64 of those 80 not id-shaped / 16 id-shaped. The 64 arise because the single
  canonical reader captures any non-whitespace token after "covers:" with no
  id-shape test and no exclusion for occurrences inside string literals or
  docstrings; most come from the very test files that exist to test the tag
  mechanism.

  SCOPE: re-tagging the 16 genuine dangling ids is remediation, not this
  criterion. The test-angle vocabulary is settled elsewhere and is not reopened.

  TEST ANGLE (load-bearing): a test that asserts the reader's pattern source
  string looks a certain way proves nothing — grep-only structural tests are the
  dominant false-green mechanism in this repo. The only satisfying evidence is
  running the real reader over the real on-disk tree, including the repo's own
  tag-mechanism test files, which are the exact input that produces the 64
  artifacts. A hand-typed fixture reproduces the bias that hides the bug (the
  PhantomDoneFilesTouched precedent).
