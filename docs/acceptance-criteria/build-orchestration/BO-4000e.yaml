it_requirements:
  - "The correction is applied to the INPUT: an absolute main-checkout ticket path is reduced to its repo-relative tail so toWorktreePath's existing relative branch re-roots it once."
  - "BO-3900's contract that an absolute path is normalised and returned as-is, never joined, is NOT changed. It exists to prevent double-joining and remains correct; the defect was that the drive fed it a clone path and treated the result as worktree-resident."
  - "Re-rooting is idempotent. A path already inside the worktree reduces to the same tail and rejoins to itself, so repeated application cannot accumulate a second copy of the tail."
  - "A path carrying no recognisable repo-relative tail is passed through unchanged, so no currently-working shape is altered."
  - "The guarantee is stated over dispatches, not over one call site: no prompt handed to any agent may name a location inside the main checkout once a worktree exists."
