  constraints:
    - "REACHED-THROUGH, NOT ENTERED. The eligibility condition must read the single reached_through flag from the BO-2900a-2 observation record. Implementing it as `entered_entry_point and target_was_called` reproduces the exact trap this AC isolates: any proof can then be made eligible by adding one unrelated invocation of the command surface (a --help call, a status call, a different action)."
    - "The refusal for this case must be distinguishable in the emitted text from the BO-2900a-1 direct-import refusal: 'the way in was entered but the code under proof was not reached on that run'. Same refusal_cause family ('proof_not_through_entry_point'), different reason string; do not add a fifth refusal cause (BO-2900e-1 enumerates exactly four)."
    - "Do not special-case action names. The rule is derived from the observed call stack, so a surface with N actions needs no per-action wiring and a new action inherits the rule automatically."
