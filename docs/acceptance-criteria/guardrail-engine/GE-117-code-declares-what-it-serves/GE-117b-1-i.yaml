notes: |
  Locks the deferred "public" definition (resolution #1) at its three boundaries:
  underscore-named symbol without __all__ is private (not required); a public-named
  symbol absent from a present __all__ is not public (not required); an
  underscore-named symbol listed in __all__ IS public (required). This is the exact
  negative-space guarantee the PO asked for — private/internal helpers must NOT be
  forced to carry an AC. Determinable from ast alone (no MCP).
