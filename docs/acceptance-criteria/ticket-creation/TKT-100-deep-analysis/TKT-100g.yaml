criteria: |
  Big-picture ideas get strategic treatment; specific fixes get straight to work.
  Before any analysis begins, your request is classified as either a product
  goal (routed through vision alignment first) or a tactical change (routed
  directly to detailed specification). You can override the classification
  explicitly, and ambiguous requests default to the more thorough path.
