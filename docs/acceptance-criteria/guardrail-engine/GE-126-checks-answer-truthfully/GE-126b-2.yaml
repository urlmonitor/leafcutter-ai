id: GE-126b-2
title: "A store that was never found and a store with nothing to look at are two different answers"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the deployed AC-governance check is invoked out of process three times against
    three working copies — one whose resolved root holds no acceptance-criterion store at
    all one whose resolved root holds the store with no record in scope and one whose
    resolved root holds the store with two records in scope that both satisfy the rule,
  When each run finishes,
  Then each run reports a different one of three outcome values and each value is
    readable by a caller without parsing prose,
  And the first run's report names the root it resolved because the root is the fact that
    explains why no store was found there,
  And the second run's report states that the store was located and that nothing was in
    scope naming the location,
  And only the third run reports the ordinary success value and it states that two records
    were examined,
  And a fourth run against the third working copy with one of the two records altered so
    it genuinely violates the rule refuses that record — so the ordinary success value in
    the third run is a verdict rather than an absence of one,
  And no two of the four runs can be told apart by exit status alone which is why the
    outcome value carries the distinction.

  Coverage note: covered only by four out-of-process runs of the deployed check asserting
  a distinct outcome value for each of the first three and the refusal in the fourth. A
  test that asserts three different messages were printed does not cover this criterion —
  the distinction has to be machine-readable, because the callers who were misled were
  reading an exit code and not prose.
