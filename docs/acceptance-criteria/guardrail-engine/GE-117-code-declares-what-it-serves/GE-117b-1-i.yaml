assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Determine __all__ membership from the staged blob via ast: read the module-level __all__ assignment (list/tuple of string literals). When __all__ is present it is authoritative for BOTH inclusion (underscore-named name in __all__ => public) and exclusion (public-named name absent from __all__ => not public). When __all__ is absent, fall back to the underscore-name rule. No MCP."
  - "Non-public symbols produce NO verdict at all (not a satisfied verdict) so they never reach GE-117d-1's block set — private/internal helpers must never be forced to carry an AC."
  - "Same shared public/private classification used by GE-117b-1; do not re-derive it. Edit templates/commit-guardian/ source AND scripts/commit_guardian/ deployed copy together; verify via build.py round-trip (ADR-001)."
delivers_to: null
expects_from:
  ac_id: GE-117b-1
  contract: "The public/private classification rule (underscore, __all__ authoritative) whose boundary this edge case pins"
