criteria: |
  Given the documentation set for the build pipeline,
  When a reader opens the web-app route-render check documentation,
  Then a sequence diagram shows the flow from a pull request that changes the web
    app, through the check headlessly loading each route and observing the HTTP
    status and any console or render output, to the pass/fail result being
    reported on the pull request and gating the merge decision,
  And the diagram identifies the participating actors: the pull request, the CI
    system, the headless browser loading each route, and the merge gate.
