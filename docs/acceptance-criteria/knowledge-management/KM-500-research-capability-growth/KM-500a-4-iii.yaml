id: KM-500a-4-iii
title: Missing authorization or credentials gives not run with no score, before any provider is set up
component: knowledge-management
components:
- knowledge_management
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-500a-4
criteria: |
  Given a kernel-path evaluation is asked to run 40 real-model cases
  And use of the external judgment provider has not been authorized for the disclosed context
  When the evaluation starts
  Then every real-model case is reported not_run with the unmet prerequisite "provider authorization missing"
  And no provider client is set up and zero provider calls are made
  And the real-model portion of the report has no quality figure, pass rate or threshold verdict: those fields are absent, never 0% and never 100%
  And the run-level verdict is not_run, which a reader of the report cannot confuse with failed

  Given the same request where authorization exists but the Jev provider credentials are absent
  When the evaluation starts
  Then every real-model case that needs Jev is reported not_run with the unmet prerequisite "Jev credentials missing", naming the actor
  And no case is retried with a scripted Jev in place of the real one

  Given one invocation that asks for 12 scripted cases and 40 real-model cases without authorization
  When the evaluation runs
  Then the 12 scripted cases execute and are labelled scripted, the 40 real-model cases are not_run, and the two groups have separate denominators.
