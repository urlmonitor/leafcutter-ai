criteria: |
  Given the how-to for resuming a paused planning run,
  When an operator looks up a run that ended because a pause could not be confirmed, or because
    a step that reads or clears a pause record was declined,
  Then the guide shows a report that quotes what the write said next to what the read-back
    found, and how to tell its four causes apart: the write reported success but no record was
    found, the write ran and failed, the write was declined, and the write's reply could not be
    read as a result,
  And it states that a declined look-up of a pause record leaves the record and the drafted
    criteria unchanged, does not apply the answer, and is retried by starting the resume again
    with the same answer,
  And it states what the run's result says when a pause record could not be cleared, where that
    record is, and when it is safe to delete it,
  And it states that the drafted criteria of a run whose pause could not be confirmed are on
    disk and not committed, and how the operator keeps them,
  And every report text and status value the guide quotes is one the route actually produces.
