id: ACD-1300e-1
components:
  - ac_driven_dev
readiness: draft
priority: medium
title: "A resumed run does not mistake the criteria it committed itself for existing coverage"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given a planning run with run id R that has committed the criteria it authored in an
    earlier stage (for example two L2 criteria under one L1, committed by run R before it
    stopped at its final decision point),
  And run R has stopped -- either paused at that decision point or ended by a crash --
    and the process is no longer running,
  When the route is started again for run R with the same request,
  Then the duplicate-coverage check does not count any criterion committed by run R as
    existing coverage of that request,
  And the run is not routed as "covered" on the basis of run R's own criteria,
  And the covered-route decision is not raised for run R's own criteria,
  And the run reaches the decision point it had stopped at, carrying run R's committed
    criteria forward unchanged,
  And a criterion in the store that was NOT authored by run R and does cover the request
    is still reported as existing coverage exactly as it is for a new run,
  And the bug symptom ("on run structural-parent-covered-by every crash-resume re-triaged
    the request as covered because the run's own committed criteria now existed, so the
    resume stopped at the covered-route decision first, the answer supplied for the final
    decision was refused as naming a different decision, and the final decision had to be
    applied by hand") must not occur.
