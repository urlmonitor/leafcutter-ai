id: BP-900h-6-ii
components:
  - build_pipeline
  - commit_guardian
title: "The executed-guard record accounts for the guard population the adopter would face, and a narrowed run cannot report an unqualified pass"
component: build-pipeline
level: L3
status: active
req_status: active
readiness: draft
priority: critical
roadmap_phase: phase_1
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900h-6.yaml"
criteria: |
  Given the use-the-install step's evidence that a plain install is wired is its record of
    which guards executed during the adopter's first commit,
  And the step may reduce the population of guards the commit path sees before that commit
    is attempted, so the record can only ever name guards drawn from what survived the
    reduction,

  When the step runs and reports,
  Then every guard the freshly built install deployed is accounted for in the report in
    exactly one of three states — executed and passed, executed and failed, or withheld —
    and the count of deployed guards is stated alongside the count that executed, so a
    reader cannot mistake "the guards that ran, ran" for "the guards an adopter faces,
    ran",
  And every withheld guard is named individually, together with the recorded reason it was
    withheld,

  And when any guard was withheld, the verdict is a qualified one that is textually and
    structurally distinct from the verdict of a run in which nothing was withheld — a
    narrowed run never emits the unqualified pass,
  And the step exits non-zero when any deployed guard is unaccounted for, or is withheld
    without a recorded reason naming it, so silence about a narrowing is a failure rather
    than a pass,

  And given a run in which no guard was withheld and every deployed guard executed,
  When the step reports,
  Then it emits the unqualified pass and exits zero, so the qualification is a statement
    about what was observed and not a permanent hedge every run carries.

  REACHABILITY. The report clauses are asserted on what the job actually emits when the
  consumer-install entry point is invoked as a subprocess with the use-the-install flag,
  in a real built install, using the command the runner parses out of the workflow file —
  not on the return value of a formatting helper. At the time this AC was written the
  workflow's consumer-simulation step invoked that entry point WITHOUT the use-the-install
  flag, so nothing in CI reached the record at all; a qualifier that exists in the module
  but never appears in the job's output is not coverage.

  Coverage note: behavioral only. Grepping the source for the word withheld, for a
  qualified-verdict string, or for the deployed-count arithmetic passes on code no caller
  reaches — and that is the state this step is in. The only honest coverage runs the step
  twice against two real built installs, one narrowed and one not, and compares the two
  outputs and the two exit statuses against each other.
