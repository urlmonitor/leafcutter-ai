roadmap_phase: phase_3
criteria: |
  Automatic release notes and version numbers from structured delivery data.

  Every release tells you what changed and what version it is -- derived
  automatically from the tickets and acceptance criteria that already exist.
  No one manually writes changelog entries. No one decides minor or patch
  version numbers. The AC flight level encodes the version semantics: a
  feature completion (L1) bumps minor, an edge-case fix (L3) bumps patch,
  and major bumps remain a deliberate human choice. The changelog is a
  materialized view of what shipped, not a separate artifact someone has
  to remember to write.
