notes: |
  Every figure in this report is a per-period figure, so a defect in period
  construction corrupts all four sections at once and does so invisibly — the
  tables still render, the trends still move, and the numbers are simply about
  the wrong days. That is why the periods get a criterion of their own rather
  than being assumed by the metric criteria that consume them.

  Both boundary scenarios are written against fixed dates. A test that derives
  its expectation from the current date would pass every day of the week while
  asserting nothing about the Monday rule, and would be exactly the shape of
  test that lets an off-by-one week survive.

  The final period being partial is intended and is stated as a scenario rather
  than left as a caveat: a reader comparing this week's three days against last
  week's seven needs the report to have told them so, which is why the rendered
  header states how many days the last period covers.
