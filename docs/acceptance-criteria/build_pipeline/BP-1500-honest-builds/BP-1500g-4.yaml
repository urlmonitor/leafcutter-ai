id: BP-1500g-4
title: "An adopter can find out where their own work can live, and what a build will do to it, before they lose any of it"
component: build-pipeline
components:
  - build_pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
declares_side_effect: false
criteria: |
  Given an adopter who wants to add a capability of their own to a project that
    has the package installed, and who has not yet added it,
  When they consult the project's task-oriented documentation before making the
    change,
  Then it tells them where their own additions can live such that both their
    addition and the package's capabilities work,
  And it states, for each way of running the build, what that run will do to their
    addition,
  And it gives them a way to confirm for themselves, after a build, that their
    addition is still present and still runs, so the guarantee is checkable by the
    adopter and not only by the project's own tests,
  And an adopter who follows it does not have to read the build's source, ask the
    maintainers, or recover from a backup in order to learn the answer.
depends_on:
  - BP-1500g
  - BP-1500g-1
  - BP-1500g-2
