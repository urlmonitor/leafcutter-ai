  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_phase_signoff_verification.py"
  constraints:
    - "VERIFY BY EXECUTION, NOT BY GREP. Per CLAUDE.md 'Gate / Workflow ACs -- Verify Behaviorally, Not by Grep', a test that finds a read-back call in the source cannot tell a read-back whose result is consumed from one whose result is discarded -- and a discarded read-back is the single most likely wrong implementation here. Drive the real workflow through unit_tests/prompt_assembly/harness_build_ticket_guard.mjs with a phase stub that reports success and writes nothing, and assert the run's outcome for that phase is a failure."
    - "THE READ-BACK MUST BE THE DECIDING INPUT. It is not enough to read the record and log a warning. The verdict the drive carries forward -- the one that decides whether the next phase runs and whether the work item completes -- must be the one derived from the record. An implementation that reads, warns, and proceeds on the agent's own report leaves the observed defect fully intact while appearing fixed."
    - "FAIL CLOSED ON AN UNREADABLE RECORD. If the record cannot be read back, the gate is adjudicated failed, not passed. Absent evidence must never resolve to success -- that is the whole content of this AC and its parent L1."
    - "DO NOT NARROW TO ONE GATE. The observed run showed the defect on test-runner for one ticket and on pr-reviewer for another, and showed both gates recording correctly on a third. The verification therefore belongs to the generic post-dispatch path and must not be attached to a named phase; a per-gate special case reproduces exactly the per-ticket unreliability this AC exists to end."
    - "BOTH TWINS IN ONE CHANGE. The file headers declare the drivers twins; a read-back landed in only one produces two drivers with different trust models."
delivers_to:
