id: ACD-2500b-2
components:
  - ac_driven_dev
  - testing_quality
readiness: approved
priority: high
title: "A requirement with test intent but no test design cannot be approved"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given three leaf code requirements at readiness "reviewed":
    R1 carries test intent marking 2 clauses needs-test and carries no test design,
    R2 carries test intent and a test design covering both needs-test clauses,
    R3 is recorded as requiring no tests,
  When the user runs the approval step over all three,
  Then R1 stays at "reviewed" and the approval report names R1 with the reason
    "test design pending",
  And R2 and R3 move to "approved",
  And test intent on its own is never accepted as the test contract that an approved leaf
    code requirement must carry.
depends_on:
  - ACD-2500b
  - ACD-2500b-1
  - ACD-1600c-1
doc_links:
- path: docs/acceptance-criteria/ac-driven-dev/ACD-1600-single-source-buildable/ACD-1600c-1.yaml
  relationship: related
  status: exists
- path: docs/reference/ac-schema.md
  relationship: describes
  status: exists
- path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
  relationship: describes
  status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
- 'The approval step is the tool the plan-feature final gate runs (scripts/ac_store/approve_acs.py). It
  refuses to raise to ''approved'' any leaf code record whose test_intent has a needs_test: true clause
  not covered by a test-design entry, reporting ''test design pending''.'
- Coverage is computed from the per-entry clause link defined by ACD-2500c-3, never from test names or
  descriptions.
- 'Closed hold-reason vocabulary, defined once (docs/reference/ac-schema.md plus one code constant): ''missing
  file targets'', ''missing test contract'' (ACD-1600c-1, unchanged), ''test design pending'' (ACD-2500b-2),
  ''reference file pending'' (ACD-2500d-2-i), ''file finding undecided'' (ACD-2500d-3-i). Approval report
  shape: {approved: [id], held: [{id: str, file: str, reason: <vocabulary value>}]}. Every gate that emits
  a hold reason reads that one vocabulary.'
- The rule 'an approved leaf code AC carries a test contract' (ACD-1600c-1/-2, check-ac-schema) is not
  weakened; test_intent alone is never accepted as that contract.
- Held records keep every field byte-identical; records outside the batch are not touched.
delivers_to:
  agent: python-coder
  contract: 'Closed hold-reason vocabulary, defined once (docs/reference/ac-schema.md plus one code constant):
    ''missing file targets'', ''missing test contract'' (ACD-1600c-1, unchanged), ''test design pending''
    (ACD-2500b-2), ''reference file pending'' (ACD-2500d-2-i), ''file finding undecided'' (ACD-2500d-3-i).
    Approval report shape: {approved: [id], held: [{id: str, file: str, reason: <vocabulary value>}]}.
    Consumed by ACD-2500b-2-i, ACD-2500d-2-i and ACD-2500d-3-i.'
expects_from:
- ac_id: ACD-2500b-1
  contract: 'test_intent: list of {clause: str (the outcome clause text, verbatim from criteria), needs_test:
    bool, reason: str (one sentence)}; exactly one entry per Then/And outcome clause; no test names, directories,
    frameworks, types, angles or strategy.'
- ac_id: ACD-2500c-3
  contract: Per-entry clause link key on test_spec items and the code-aware authorship mark.
test_spec:
- name: test_intent_without_design_held_with_reason
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: R1 stays reviewed and the approval report names R1 with 'test design pending'.
- name: test_designed_and_no_test_records_approved
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: R2 (design covers both clauses) and R3 (no tests required) move to approved.
- name: test_intent_alone_never_accepted_as_contract
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: An approved leaf code record carrying only test_intent is rejected by the record check.
  angle: failure
origin_agent: business-analyst
