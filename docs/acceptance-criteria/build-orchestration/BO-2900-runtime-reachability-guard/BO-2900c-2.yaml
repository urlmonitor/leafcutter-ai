assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    finding_set:
      type: object
      description: "{ stale_invocations: [stale_invocation_finding], uncalled_capabilities: [uncalled_capability_finding], counts: { stale_invocations: int, uncalled_capabilities: int } }. Two kinds carried in two lists with two counts — never one flat list with a kind attribute the reporter then loses."
  reference_file_path: "scripts/build_orchestration/fast_lane.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "THE TWO KINDS MUST STAY SEPARATELY COUNTABLE end to end — in the returned structure, in the emitted output and in the count BO-2900e-2 requires. A single undifferentiated list makes a rename read as N+1 unrelated problems, and the natural response is to exempt the uncalled-capability finding permanently while fixing only the callers."
    - "THE REMOVAL ASYMMETRY IS THE CLAUSE MOST LIKELY TO BE GOT WRONG: removing a capability leaves stale callers but creates NO uncalled capability, because there is nothing left to be uncalled. Do not model a rename as 'one finding of each kind'; derive each kind independently from its own comparison, and the removal case falls out correctly. An implementation that pairs them emits a phantom finding naming a capability that no longer exists."
    - "Report EVERY stale caller, not the first. The fixture carries two callers precisely because a first-match implementation satisfies a single-caller scenario and then walls the author twice."
    - "Both directions must run in the same invocation of the check, so a rename produces its full finding set in one run. This is BO-2900e-2's completeness rule applied to the case where it matters most; consume it rather than restating it."
    - "This AC asserts the interaction and the finding shapes only. Message wording belongs to BO-2900e-1 and the invocation-collection rule to BO-2900b-3 — do not re-derive either here."
delivers_to: null
expects_from:
  ac_id: BO-2900c-1
  contract: "stale_invocation_finding records for the caller side, and BO-2900b-1's uncalled_capability_finding records for the surface side, both produced by one run of check_reachability.py so the rename's two kinds are observable together."
test_spec:
  - name: test_rename_reports_two_stale_callers_and_one_uncalled_capability_as_distinct_kinds
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Runs the real check over a fixture tree where `mark-done` is renamed to `finalise` and neither of two automation scripts is updated; asserts exactly two stale_invocation findings (one per script) and exactly one uncalled_capability finding, retrievable and counted separately."
  - name: test_rename_with_both_callers_updated_reports_nothing
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Same rename with both scripts updated to invoke `finalise`; asserts a zero exit and an empty finding set."
  - name: test_removal_reports_stale_callers_and_no_uncalled_capability_finding
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The capability is removed and neither script updated; asserts two stale_invocation findings and zero uncalled_capability findings, so no phantom finding names a capability that no longer exists."
test_rationale: "The whole subject of this AC is the INTERACTION of two independently-implemented checks over one change, and an interaction is not observable from either check in isolation — which is exactly what a direct-import unit test of one comparison would exercise. The removal asymmetry in particular can only be caught by running both directions over a real tree in the removal state: an implementation that pairs the two kinds returns the correct rename answer and the wrong removal answer, and both look right when the comparisons are called separately with hand-fed inventories. All three states drive the production entry point over a real fixture tree with two automation scripts."
