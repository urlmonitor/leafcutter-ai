test_spec:
  - name: test_locked_row_folder_does_not_end_the_run
    target_dir: unit_tests/evals/tq200d5iv/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      A live produced-tests run of a 2-row set whose first row's folder deletion raises PermissionError on every
      attempt runs and scores the second row, writes a results file with a scored entry for both rows, prints the
      aggregate, logs one warning naming the folder left behind, and records the first row with the result its outputs
      earned (not a folder error).
    must_catch:
      - revert the fix (the cleanup error escapes score_one and ends the run)
      - the cleanup error recorded as the first row's failure
      - no warning naming the folder
    in_scope_files:
      - scripts/evals/produced_tests_mode.py
      - scripts/evals/produced_tests_runs.py
      - scripts/evals/produced_tests_scoring.py
  - name: test_cleanup_that_succeeds_on_retry_leaves_nothing_and_warns_nothing
    target_dir: unit_tests/evals/tq200d5iv/
    framework: pytest
    type: unit
    angle: boundary
    description: >-
      Deletion failing on the first attempt and succeeding on a retry leaves no folder and logs no warning.
    must_catch:
      - no retry before giving up
      - a warning logged after a successful retry
    in_scope_files:
      - scripts/evals/produced_tests_runs.py
  - name: test_agent_failure_is_recorded_not_the_locked_sandbox
    target_dir: unit_tests/evals/tq200d5iv/
    framework: pytest
    type: unit
    angle: failure
    description: >-
      A row whose agent run fails with 'agent CLI exited 1: API Error: Connection closed mid-response' and whose
      agent sandbox cannot be deleted is recorded with an error naming the agent failure, not the locked folder.
    must_catch:
      - the cleanup error replaces the agent error
    in_scope_files:
      - scripts/evals/produced_tests_mode.py
      - scripts/evals/produced_tests_runs.py
  - name: test_other_row_failures_stay_failed_with_their_reason
    target_dir: unit_tests/evals/tq200d5iv/
    framework: pytest
    type: unit
    angle: boundary
    description: >-
      A row failing with a sandbox error (not cleanup) is recorded as failed with that reason while its folder deletion
      also fails.
    must_catch:
      - cleanup tolerance turns a failed row into a pass
      - the row's own error dropped
    in_scope_files:
      - scripts/evals/produced_tests_mode.py
  - name: test_agent_that_cannot_be_launched_still_stops_the_run
    target_dir: unit_tests/evals/tq200d5iv/
    framework: pytest
    type: unit
    angle: boundary
    description: >-
      An agent launch failure still stops the run as a harness failure (exit status 3, harness_failure results file),
      with folder deletion failing too.
    must_catch:
      - a broadened catch swallows the launch failure
    in_scope_files:
      - scripts/evals/produced_tests_mode.py
  - name: test_score_gold_replay_with_locked_folders_keeps_its_scores
    target_dir: unit_tests/evals/tq200d5iv/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: >-
      run_agent_eval.main(['--agent', <agent>, '--score-gold', '--results-file', <tmp>]) in process, for test-writer,
      sql-test-writer and test-runner, with folder deletion patched to fail
    description: >-
      Each --score-gold replay completes with the same per-row results and accuracy as an unpatched replay.
    must_catch:
      - a locked scoring sandbox changes a gold row's result
    in_scope_files:
      - scripts/evals/produced_tests_mode.py
      - scripts/evals/produced_tests_runs.py
      - scripts/evals/produced_tests_scoring.py
  - name: test_docs_state_the_left_behind_folder_warning
    target_dir: unit_tests/evals/tq200d5iv/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The README bullet and the how-to section quote the warning text the helper logs and say the run is not stopped.
    in_scope_files:
      - scripts/evals/README.md
      - docs/how-to/run-a-live-agent-eval.md
test_rationale: >-
  A Windows lock cannot be produced on Linux CI, so every test fakes it at the delete call; the tests then pin the
  three ways the lock hurt a run (the run ended, the row's real error was replaced, a folder error became a row
  failure) and the two things tolerance must not break: a real failure stays a failure and a launch failure still
  stops the run. The score-gold test covers the flaky gold tests named in the known issue.
