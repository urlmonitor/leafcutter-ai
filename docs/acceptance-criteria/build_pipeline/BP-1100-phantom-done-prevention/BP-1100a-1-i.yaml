criteria: |
  Given a ticket whose acceptance criterion describes runtime behavior and whose
  files_touched lists both a documentation surface (a SKILL.md file) and an
  executable surface (scripts/workflows/plan-feature.js),
  When the refinement files_touched-completeness lens evaluates the ticket,
  Then the lens reports no files_touched-completeness violation,
  And the ticket proceeds to coder dispatch without being flagged.
