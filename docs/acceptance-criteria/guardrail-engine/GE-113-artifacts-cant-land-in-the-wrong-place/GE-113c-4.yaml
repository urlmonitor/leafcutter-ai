notes: |
  Item 3 (KI-CG-20261016-mermaid-parent-link-root-inside-package).
  templates/scripts/commit_guardian/check_mermaid_parent_link.py:49 sets
  REPO_ROOT = Path(__file__).resolve().parents[2]; that is templates/ for the source copy and
