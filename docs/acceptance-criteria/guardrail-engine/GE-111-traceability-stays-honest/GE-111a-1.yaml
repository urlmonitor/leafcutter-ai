assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Implement as a new commit_guardian hook script under scripts/commit_guardian/ (e.g. check_ac_traceability.py), invoked via scripts/commit_guardian/run_hook.py, exiting non-zero to block and zero to proceed — mirror the existing check_ac_circular_deps.py / check_ac_schema.py structure."
  - "Register the hook in scripts/commit_guardian/commit_guardian.json hooks_manifest with tier: judgment, files scoped to the AC store and staged source, stages: [pre-commit], pass_filenames: false. The deployed config and its packaged template source must be edited together and verified in parity via the build.py round-trip (ADR-001 self-hosting constraint)."
  - "Must follow the project error handling policy (CLAUDE.md Rules 1-4): wrap all git/file I/O in try/except with a specific exception type and log-or-reraise; never bare except."
  - "Must fail open on any unexpected internal error (exit 0 with a [check-ac-traceability] advisory to stderr), consistent with the check_ac_circular_deps / check_ac_governance fail-open precedent — a hook crash must never wedge commits."
  - "Must complete within a typical pre-commit latency budget (target under 2s for a normal staged set); the block decision is a pure aggregation over per-AC verdicts and must add no I/O beyond reading the verdicts it consumes."
  - "The block decision must be a pure consumer of the GE-111b verdicts and the GE-111c in-scope set: it must not itself parse anchors or touch symbol tooling (single-responsibility — detection lives in GE-111b)."
delivers_to:
  agent: python-coder
  contract: "The pass/block decision and the affected-AC list that GE-111e formats into the actionable message"
expects_from:
  ac_id: GE-111b-1
  contract: "The per-AC drift verdict object {ac_id: str, entry: str, verdict: 'drift'|'clean', change_kind: 'deleted'|'moved'|'renamed'|'removed'|null} for each evaluated implemented_by entry"
