notes: |
  Satisfies the reference-doc entry in INF-700b's documentation_triggers.
  The last clause is inherited from ADR-034's consequence ("Until the harvester
  has a caller, capture is not automatic and any documentation implying
  otherwise is wrong") and from INF-700a, which owns the trigger itself. This
  AC does not require the trigger to exist; it requires the documentation to
  stop implying one that does not.
