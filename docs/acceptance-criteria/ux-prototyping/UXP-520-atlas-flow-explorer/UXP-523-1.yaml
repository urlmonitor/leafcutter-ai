risk_surface: contract_boundary
it_requirements:
- Load and carry the authoritative flow and node metadata through the production loader, explorer selection
  and drawer for both steps and branches; a component supplied only hand-made props does not prove this
  seam.
- Keep JSON pointer structure and escaped keys unambiguous. Distinguish an absent default from explicit
  false, zero, null, empty string, empty array and empty object.
- Contract group labels must never become an extra property in the example payload or a repeated field-name
  prefix.
expects_from:
  ac_id: UXP-300-1
  contract: 'Flow JSON at docs/product-truth/flows/**/*.flow.json: contract_definitions is a map from
    reference label to {schema?: string, model?: string, authority?: runtime|source_reviewed|illustrative_design,
    note?: string}; each node has io_contracts with consumes/produces arrays of {contract: string, fields:
    [{path: JSON-pointer string, types: JSON-type string[], required: boolean, default?: JSON value, applies?:
    string}]}. Optional means absent, not null unless explicitly allowed. Contract labels are not payload
    wrapper keys.'
delivers_to: null
