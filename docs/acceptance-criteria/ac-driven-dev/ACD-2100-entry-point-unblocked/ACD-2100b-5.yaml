notes: |
  2026-09-16 (business-analyst) -- PREMISE NARROWED, READ THIS FIRST. The Given changed
  from "no agent can be dispatched" to "no party can be asked to judge anything" (only a
  chartered executor of exact commands is dispatchable), and the "no dispatch on behalf of
  the check" Then became "only exact commands to that chartered party". Authorised by the
  user via BO-3200f's chartered-executor decision; the old wording, the reason, what the
  narrowing gives up and the list of now-stale technical fields are in amended_by. The two
  paragraphs below that depend on removing the round-trip entirely describe the SUPERSEDED
  premise.

  THE FOURTH CAUSE IS AVOIDABLE, NOT MERELY REPORTABLE -- this is the record that
  removes it rather than labelling it. The observed run recorded
  `[resolve-workspace-setup-permission] failed: API Error: Connection lost
  mid-response`. Startup is gated on a live agent round-trip taken in order to read
  a static local file, so a network hiccup closes the mandated entry point, and in
  the output it is indistinguishable from a real mis-assignment. Removing the
  round-trip removes a whole class of false halt.

  THE FIRST GIVEN IS THE TEST. Make dispatch impossible and require the run to get
  past the check anyway. That is observable in a fresh process and cannot be
  satisfied by a source scan; a test that greps for the absence of a dispatch call
  passes on a call that is present but unreachable, and fails on a correct
  implementation that keeps the helper for another purpose.

  THE THIRD THEN CLAUSE stops the fix being "skip the check when dispatch is
  unavailable", which would be a fail-open regression wearing this AC's clothes.
  The verdict must be the same either way because it comes from the file, not from
  the transport.

  ORDER OF LANDING. Once this lands, ACD-2100b-1 through -3 have three outcomes to
  distinguish rather than four -- the dispatch-failure cause no longer exists. That
  is the intended outcome and not a reason to defer them: the remaining three are
  still conflated today, and ACD-2100b-3-i shows the space is not closed by
  enumeration alone.

  2026-08-25 (it-po): delivers_to and expects_from are both null deliberately. This
  record interacts with ACD-2100a-3 (which makes the read succeed from a worktree) and
  with b-1..b-3 (which report its failures), but neither relationship is a prerequisite
  in either direction and neither is carried in depends_on. Writing an expects_from
  edge with no depends_on mirror would create a contract the build sequencer cannot see
  (KI-ACD-015, open) and that nothing enforces. The interactions are stated in
  it_requirements instead, where the coder will actually read them.

  2026-09-16 (it-po) -- RE-ENRICHMENT AFTER THE PREMISE NARROWING. READ THIS BEFORE THE
  PARAGRAPHS ABOVE.

  WHAT THE NARROWING GIVES UP, STATED FOR THE TECHNICAL LAYER. The old record removed the live
  round-trip and with it KI-ACD-009's TRANSPORT cause ("Connection lost mid-response"). A
  dispatch to the chartered executor is still a round-trip, so this record NO LONGER removes that
  cause. It removes only the REFUSAL cause -- a party declining a registry read on charter
  grounds. The transport cause is now handled, not removed: the check fails closed and reports
  could-not-check with the reason named, instead of printing a permission verdict. The
  paragraphs "THE FOURTH CAUSE IS AVOIDABLE" and "THE FIRST GIVEN IS THE TEST" above describe the
  superseded premise and are no longer delivered; the paragraph "ORDER OF LANDING" is also
  superseded in one respect -- ACD-2100b-1 through -3 do NOT lose the dispatch-failure cause, it
  becomes a could-not-check outcome that ACD-2100b-4's halt must cover.

  expects_from IS NOW SET, reversing the 2026-08-25 it-po paragraph above, because the user
  directed it and the dependency is real: this record cannot be built without the executor. The
  KI-ACD-015 hazard that paragraph names is live -- depends_on carries only ACD-2100b.
  RECOMMENDED BA EDIT: add BO-3200f-1, BO-3200f-1-i and BO-3200f-2 to depends_on.

  SIZE. The real registry is larger than the 75,000-character limit that truncated KI-BO-018. The
  check's command must therefore emit the one entry it needs, not the file; a command that prints
  the registry for the workflow to parse reproduces KI-BO-018 through the executor.
