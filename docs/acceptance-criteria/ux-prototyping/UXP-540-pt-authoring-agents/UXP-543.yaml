it_requirements: |
  The routing that skips unneeded agents does not exist yet and must be built. The pipeline reads
  the classifier outcome (full-set / mockup+data / mock-data-only / mockup-only / none — see
  docs/product-truth/classifier/eval.jsonl) and dispatches only the corresponding authoring agents.
  The pt-classifier agent that produces the outcome also does not exist yet (its needed inputs are
  specced in docs/product-truth/mock-data/pipeline-prompts/classify-request.prompt.json).
