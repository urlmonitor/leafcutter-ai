notes: |
  ORIGIN. The user's brief targets the technical-planning agent (IT PO), which today
  covers routing and splitting, sizing and technical requirements, integration
  contracts, the test contract, store housekeeping, and the knowledge loop. Four
  problems were named: it authors test design without being allowed to read code or
  tests; two of its decisions need file visibility it lacks; many of its rules are
  deterministic and belong in a check that runs after writing; and its own declared
  profile misstates what it changes and produces.

  FRAMING CHANGES I MADE. The request reads as one refactor; it is five separable
  outcomes, each independently shippable, so it is framed as an L0 with five L1s.
  The profile correction is a one-line tactical fix on its own; it is folded into
  ACD-2500e rather than given its own L1.

  SEQUENCING IS A HARD CONSTRAINT. This goal must land before the discrimination /
  must_catch work from the 2026-09-25 analysis, because that work's field lives in
  the test design ACD-2500c relocates. Ordering inside this goal: ACD-2500b and
  ACD-2500c ship together (intent without a filler leaves the test writer with
  nothing); ACD-2500a can ship first and independently.

  UPDATE 2026-09-28 (business-analyst, user-directed): the "must land before the
  must_catch work" constraint in the paragraph above is overtaken; the paragraph is kept
  as history. The must_catch work landed first: PR #911 (TQ-500f-1/-2, merged 2026-09-27)
  added the optional test_spec[].must_catch list and the 'discrimination' angle to the
  test design without depending on this goal. The relation now runs the other way:
  ACD-2500c-3 builds on that existing field (it neither forbids nor re-specifies it), and
  only the code-aware test-design step (the test designer) writes must_catch -- the
  technical planner never does. TQ-500f-2-ii, being amended on branch
  ac-authoring/tq-500f-2-ii-amend in another session, depends on ACD-2500c / ACD-2500d-5.
  The ordering inside this goal (ACD-2500b with ACD-2500c; ACD-2500a independently) is
  unchanged. The first doc_link's relevance ("THE WORK THIS GOAL MUST PRECEDE") is
  overtaken in the same way.

  DECIDED AT THE PO GATE (user, 2026-09-25): the test design is filled by a
  code-aware planning step BEFORE the build (test-planner with source access), not
  by the test writer at build time. Reason: the design then exists before approval,
  a reviewer can see it before tests are written, and the existing readiness rule
  keeps working (see next paragraph).

  CONFLICT TO RESOLVE IN BA/IT PO: ACD-1600c-1 / ACD-1600c-2 and the check-ac-schema
  guard require an approved leaf code AC to carry a test contract. Once the IT PO
  records only test intent, the code-aware step must run before the AC reaches
  `readiness: approved`, or those rules must accept "intent recorded, design
  pending" as a distinct not-yet-buildable state. Do not weaken the rule silently.

  KNOWLEDGE LOOP. The brief lists it as a current duty but does not relocate it. I
  have assumed it stays with the IT PO and have not created an L1 for it.
