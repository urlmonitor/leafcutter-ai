it_requirements:
  - "COMPOSITION IS UNION, AND THAT IS THE EASY HALF. The proof set for a work item is the union of every member requirement's proofs, in a deterministic order keyed by member id then proof index. Note the deliberate contrast with ACD-1600g, where exclusions compose by DIFFERENCE -- do not reuse that composition rule here."
  - "ISOLATION IS THE HARD HALF, AND THE INCUMBENT CLEANUP MUST NOT SURVIVE. templates/agents/user-surface-smoker.md Step 5 (~line 163) runs `git restore .` unconditionally after every stanza, and Step 1 (~lines 119-121) refuses to start when the worktree has staged changes. Running N members' proofs in one pass interleaves N whole-tree restores with N invocations that each may mutate the tree. Each proof must begin from a starting state unaffected by any other proof's run; a sequential run over one shared tree with an unconditional whole-tree restore does NOT satisfy the second Then clause."
  - "THE TECHNIQUE IS THE IMPLEMENTER'S CHOICE, THE OUTCOME IS NOT. A fresh worktree per proof, a restore scoped to only the paths that proof declared, or capturing the observation before cleanup rather than after -- any of these is acceptable. Whichever is chosen, the dirty-worktree pre-check must be evaluated against that proof's own baseline, never against the raw tree, or member A's legitimate artefact aborts member B's run."
  - "ATTRIBUTION IS PER-REQUIREMENT, NOT PER-BUNDLE. Every outcome entry carries the member ac_id and the proof index. The incumbent aggregation ('if ALL stanzas PASS: emit ok') is set-shaped and loses stanza identity; 'the feature's smoke check failed' tells a reader nothing about which requirement to reopen. Same shape as ACD-1600g-3-i for boundaries."
  - "GRAIN-INVARIANCE IS A REAL, VERIFIED GAP -- A STORE-SIDE RESOLVER ALONE DOES NOT SATISFY THE FOURTH THEN CLAUSE. templates/workflows-js/fast-lane-ship.js has a fixed, code-defined five-phase order (Worktree, Resolve, Test Writer, Coder, Commit) with NO observation phase, and scripts/build_orchestration/fast_lane.py has ZERO occurrences of user-surface-smoker. The fast lane therefore builds and marks an AC done today without ever checking its observable promise. The standalone path must gain an observation step keyed on the declaration, or the clause is proven on the bundled half only."
  - "MIXED SURFACE -- PARTIAL FLAG (S2.8, BP-1100f-3-i). The matched portion (union resolution, isolation harness, attributed aggregation, the standalone entry point in scripts/build_orchestration/fast_lane.py) is python-coder's and is checkable by pytest. The unmatched portion is templates/workflows-js/fast-lane-ship.js (a `.js` workflow, jest/vitest territory) and templates/agents/user-surface-smoker.md (prose). A Python implementer cannot act on either. Expose the standalone check as a callable/CLI surface in fast_lane.py so the Python half is independently drivable, and flag the JS phase insertion and the template repoint for the user; see the caveat in notes."
  - "The fast lane's done accounting is already a known regression risk under this migration: fast_lane.mark_done_built_acs() marks ACs done on test coverage alone. Once an observable promise can be unproven (ACD-1800f-3), marking done on coverage alone is a phantom-done regression introduced by the migration itself, in the tool with the strongest done proof in the repo. The standalone observation step must gate that call."
  - "Canonical source only: scripts/ac_store/, scripts/build_orchestration/, templates/workflows-js/ -- never a deployed .claude/ copy or the workspace-parent build-output mirror (ADR-001). Run ./build-self.sh after the change and re-verify from the deployed layout, since a workflow invoked by name can run a stale session-cached script."
delivers_to:
  agent: python-coder
  contract: "Bundle-level observation result: { status: 'proven'|'unproven'|'refuted'|null, proofs_declared: int, proofs_executed: int, proofs_observed: int, per_requirement: [{ac_id: str, proof_index: int, status: str, reason: str, isolation_baseline: str}] }, produced identically whether the work item is a multi-AC bundle or a single AC built standalone by the fast lane. Consumed by ACD-1800f-4-i (the destructive-interference case), by scripts/ac_store/done_proof.py's eligibility path, and by the reporting craft."
expects_from:
