criteria: |
  Given scaffold or finalize bookkeeping (for example creating epic scaffold files
    or recording ticket/AC status changes) needs to reach the hub,
  When that bookkeeping is produced,
  Then it is committed on a branch and lands on the hub `main` through a pull request
    (subject to the BO-1800b gate),
  And it is never written by a direct commit to a local `main` and pushed straight
    to the hub.
