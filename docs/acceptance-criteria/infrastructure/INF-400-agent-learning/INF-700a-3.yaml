created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a.yaml"
criteria: |
  Given a person has finished a piece of work during which an agent captured a
    learning, and wants to confirm it reached its surface — or wants to route
    learnings that a failed routing step left unwritten,
  When they open the how-to guide for the knowledge loop,
  Then it states at which point the routing step runs on its own, and lists
    which ways of completing work carry it and which do not,
  And it gives the steps to confirm, from the completed work's own reported
    result and then from the destination file, that a specific learning was
    written,
  And it gives the steps to run the routing step by hand against the declared
    sink, for the ways of completing work that do not carry it and for
    recovering from a routing step that failed,
  And it gives the steps to establish whether the routing step has ever
    completed in the tree the reader is standing in,
  And every path, command and file it names resolves in both a package
    checkout and a consumer install at the time of writing,
  And it describes no way of completing work as carrying the routing step
    unless that way carries it, and it says plainly that routing is by hand
    for as long as no way of completing work carries it.
