id: BO-2300c-1
components:
  - build_orchestration
title: "The pause surfaces the decision context captured at pause time"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run pauses at an interactive decision point after producing artifacts
    (for example a set of acceptance criteria and a proposed change),
  When it emits the pending question,
  Then the question is accompanied by a context payload that includes what the
    run has done so far, what it proposes, and the decision being asked,
  And that context is captured at the moment the run pauses (a snapshot of the
    state at pause time, not re-derived afterwards),
  And the context payload is presented to the answerer alongside the question so
    the answer can be made from the shown information.
depends_on: [BO-2300c]
assigned_agent: python-coder
estimated_complexity: M
doc_links:
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
  - path: docs/reference/workflow-authoring-contract.md
    relationship: describes
    status: exists
it_requirements:
  config_schema_fragment:
    type: object
    description: "Context snapshot captured at pause time and stored with the pending-question record."
    properties:
      work_done_so_far: {type: object, description: "e.g. the ACs/artifacts produced so far"}
      proposal: {type: object, description: "the proposed change/diff summary"}
      decision_summary: {type: string, description: "one-line summary of the decision being asked"}
    required: [work_done_so_far, proposal, decision_summary]
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "The context payload must be captured as a snapshot at the moment of pause (not re-derived at answer time), so it remains correct when the answerer returns much later (see durability BO-2300e-1)."
    - "The context must include what the run has done, what it proposes, and the decision being asked, and must be persisted with the pending-question record."
    - "Context capture must not include secrets/credentials; snapshot only the decision-relevant artifacts."
    - "E2 top-level-body form (ADR-017); deployed/template parity via build.py (ADR-001)."
delivers_to:
  agent: python-coder
  contract: "Context snapshot object { work_done_so_far, proposal, decision_summary } captured at pause time and stored in the pending-question record's context field; presented to the answerer alongside the question. Consumed by apply/resume (BO-2300d-1) and durability (BO-2300e-1)."
expects_from:
