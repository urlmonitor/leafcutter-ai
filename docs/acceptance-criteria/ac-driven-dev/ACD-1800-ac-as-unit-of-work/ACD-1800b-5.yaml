delivers_to: null
expects_from:
  ac_id: ACD-1800b-1a
  contract: "The AC-side per-deliverable sign-off record on the requirement: deliverables[].signoff = {status: needed|signed_off|not_applicable, by, at, reason?}. Done-eligibility reads these records to judge a thin ticket done-eligible when all deliverables are signed_off/not_applicable."
it_requirements:
  - "Canonical surfaces (prose): the building-epics runbook templates/skills/building-epics/SKILL.md and the supervisor template templates/agents/ticket-supervisor.md, in the done-eligibility / mark-done step (the deployed .claude/ copies are build output per ADR-001; never hand-edit them)."
  - "Teach done-eligibility to DUAL-READ: judge a thin ticket done-eligible from the AC-side per-deliverable sign-offs (the deliverables[].signoff records defined in ACD-1800b-1a) when the ticket body carries no \"## Comments\" phase-status; continue to honour ticket-body \"## Comments\" status for legacy fat tickets during the dual-record window (dual-read, not replace)."
  - "A ticket with ANY AC-side deliverable still unsigned MUST NOT be judged done-eligible -- all-signed (each slot signed_off or not_applicable) is the done condition, derived data-driven from the deliverable set, never a hard-coded craft/phase list."
  - "Author the done-eligibility rule UNIFORMLY across BOTH the runbook (building-epics/SKILL.md) and the supervisor template (ticket-supervisor.md) so no reader is exempt (read-side-first invariant, ADR-026)."
  - "No executable pytest surface is authored here (prose change) -- see test_required. Per CLAUDE.md 'Gate/Workflow ACs verify behaviorally', behavioral correctness is proven by the AC-side sign-off record tests (ACD-1800b-1a), the ticket-done computation tests (ACD-1800b-2-i), and an ADR-026 rule-7 spot-check asserting the AC-side sign-offs are CONSUMED in the mark-done control flow (thin -> done-eligible; unsigned deliverable -> not) -- never grep-only."
