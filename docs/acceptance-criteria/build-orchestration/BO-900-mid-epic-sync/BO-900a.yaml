title: "The epic workflow warns you before your branch drifts too far from main"
component: build-orchestration
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  After each ticket batch completes, the build-epic workflow checks how far
  the worktree has diverged from origin/main. If the count of commits ahead
  exceeds a configurable threshold (default: 20), it pauses the epic drive,
  warns the user about merge-conflict risk, and offers to merge main into
  the worktree automatically. The user decides whether to merge now or
  continue without syncing.
