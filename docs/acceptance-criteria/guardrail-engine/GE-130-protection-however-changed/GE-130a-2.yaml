id: GE-130a-2
title: A shell command that clearly writes into a gated folder whose guide is unread is stopped the way
  the same edit is stopped
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the guide-read guard's command coverage has been accepted by GE-130f-3 and is in its
    blocking stage (GE-130d-3),
  And a folder the guard gates whose nearest guide has not been read in this session,
  And a command issued from the session's shell that clearly writes a file inside that folder:
    redirecting output into a file there, editing a file there in place, copying or moving a
    file into it, or creating a new file in it,
  And no guide-check override in effect,
  When the command is issued,
  Then it is not carried out, and the refusal names the file and the guide that must be read
    first, in the same wording the editing-path refusal uses,
  And after the guide has been read -- with the reading tool or with a command, as GE-130a-3
    specifies -- the same command is carried out with no refusal, in the same run,
  And the small-edit allowance never lets a command through, because a command carries no
    before-and-after text the guard can measure, which is the rule GE-130f-2-i sets for
    whole-file writes,
  And a command whose effect on the folder cannot be told before it runs is not refused
    beforehand and is left to the after-the-fact check GE-130c-1 specifies.
depends_on:
- GE-130a
- GE-130f-2
- GE-130f-3
- GE-130a-3
