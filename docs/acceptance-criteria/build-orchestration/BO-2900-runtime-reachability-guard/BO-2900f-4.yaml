notes: |
  The parent L1 states the rule generically and explicitly forbids narrowing it to
  one named gate at L2. This AC is what makes that stick mechanically rather than by
  good intentions: the guarantee must be a property of the requested-gate iteration,
  not a hand-written skip record per gate.

  WHY IT IS WORTH ITS OWN AC — and note the earlier justification was factually
  wrong. The draft claimed `live-surface-tester` and `change-scope-reviewer` were
  "two independent instances of the same defect". They are not:
    - `live-surface-tester` IS requested — a ticket asks for it via
      `live_surface_test: true` in frontmatter — and then silently fails to run
      because `live_surface_testing.enabled` defaults to false. That is exactly the
      defect this tree fixes, and BO-2100d-5 is its named instance.
    - `change-scope-reviewer` is requested by NOTHING. It is absent from
      `_CANONICAL_PHASE_ORDER` in `scripts/ac_store/generate_ticket_from_ac.py` and
      absent from `config/guardrail_gates.yaml`; its only appearance is a row in a
      phase table in `templates/skills/building-epics/SKILL.md`. Under
      BO-2900f-1's gate D clause — a gate the work item never requested produces no
      entry — this tree correctly produces NOTHING for it. BO-2900f provably cannot
      catch it, and an implementer who treats it as a test case for this AC will
      either fail the AC or break the gate D clause trying to pass it.
  A gate that nothing ever requests is a REACHABILITY defect: it belongs to
  BO-2900b / BO-2900c, which govern whether a declared gate is wired at all. Flagged
  there, not fixed here.

  The justification for this AC therefore rests on the generic argument alone, which
  is sufficient: a per-gate fix repairs one gate and leaves every future gate
  starting out silent. The observable test is the extension test in the Given —
  introduce a synthetic gate and assert its skip is recorded without touching the
  recording code.

  Implementer note tied to BO-2900f-2: because the rule is one shared iteration, the
  cardinality bug and its fix are also shared — get the conditionalization right once
  and every gate inherits it. That is the upside of refusing the per-gate branch.

  2026-08-14 (IT PO enrichment). Three additions:

  - THE VOCABULARY HAS A FILE, AND EXTENDING IT IS THE GIVEN. The requested-gate
    vocabulary is config/guardrail_gates.yaml (per-surface lists, plus the
    flow_change_gates and documentation_gates sections that union further gates in),
    realised through _CANONICAL_PHASE_ORDER. "A new gate with no recording logic
    written for it" is concretely a new entry there — which makes the extension test
    constructible rather than hypothetical.
  - THE NO-EXEMPTION CLAUSE IS TESTED VOCABULARY-DRIVEN, NOT LIST-DRIVEN. Asserting
    against a hard-coded list of today's gates satisfies the clause today and stops
    being true the moment the config grows. The test reads the vocabulary, so a gate
    added later is covered without anyone remembering to edit the test.
  - SEQUENCING WITH BO-2900f-2 IS NOT OPTIONAL. The two ACs constrain the same few
    lines from opposite directions. Implemented separately, each partially undoes
    the other; they should be one change with two sets of assertions.
