id: BO-2300b-2
components:
  - build_orchestration
title: "An answer of the wrong shape is rejected and the question is re-asked"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run is paused on a single-choice question whose valid answers are
    "approve", "edit", or "cancel",
  When an answer that does not match the declared shape is submitted
    (for example "high", which belongs to a priority-choice question),
  Then the answer is rejected and NOT applied,
  And the run stays paused on the same pending question,
  And the same question is presented again together with a statement of the
    valid answer shape.
depends_on: [BO-2300b]
assigned_agent: llm-expert
estimated_complexity: S
