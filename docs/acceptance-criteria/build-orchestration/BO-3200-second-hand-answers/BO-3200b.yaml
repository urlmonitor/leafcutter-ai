criteria: |
  A required action is carried out, never left to someone who may decline.

  When the build must make something happen — releasing a claim, tidying up after
  a failure, putting things back as they were — it performs that action itself.
  Nothing required is delegated to a specialist that might reasonably refuse, and
  no cleanup is treated as best-effort and left unchecked, so a run that stops
  early does not leave your work in a stuck state.
