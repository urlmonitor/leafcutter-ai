risk_surface: internal
notes: |
  Authored by /quick-fix. Root cause: _produce_private_copy() creates staging_parent with tempfile.mkdtemp, copies the repo and runs build.py into it, and returns staging_parent/'layout'; nothing ever removes staging_parent. The fixture is a plain function-scoped fixture that `return`s the path, so there is no teardown; and the copy/deploy/completeness failure paths raise SharedReferenceLayoutError without removing the partially built staging_parent either. Expected fix (this file only): make shared_reference_layout a yield fixture; for the mutator and undeclared routes remove the private copy's staging_parent (shutil.rmtree, log a WARNING via the module logger if removal fails, never fail the test on cleanup) after the test finishes, pass or fail; on every failure path inside _produce_private_copy remove staging_parent before raising. The reader route (the one shared, cross-process-cached layout) must NOT be removed by this fixture. Keep emit_execution_signal / routing-log behaviour and counts unchanged. Tests must be behavioural: run a tiny pytest session (pytester or a subprocess pytest run against a temp test file) that requests the fixture as undeclared and as mutator (stub/monkeypatch the expensive build subprocess and copy so no real build.py runs, per the repo's no-build.py-spawn rule) and assert the staging directory exists during the test and is gone afterwards, including when the test body fails; assert a failing deploy leaves no staging directory; assert the reader route's shared root still exists after the test..

  PLACEMENT: an L3 technical constraint on TQ-600a-2 (the private-copy route). TQ-600a
  is at its child_limit_override of 13, so a new L2 was not added. The undeclared route
  (TQ-600a-5) uses the same private-copy path and is covered by the same constraint.
