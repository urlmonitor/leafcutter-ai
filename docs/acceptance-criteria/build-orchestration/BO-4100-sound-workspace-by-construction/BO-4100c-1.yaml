it_requirements:
  - "The verdict must be produced by an invocable program, not by an agent following a procedure. templates/workflows/close-worktree.md is today's only disposal surface and it is a prompt: it judges one workspace a human already chose, so it structurally cannot carry the clause that all 150 receive a verdict. It must not be the thing this record changes."
  - "The five triggers are independently sufficient and must be evaluated as a disjunction over a DECLARED set, so a sixth trigger is added by extending the set rather than by editing the verdict logic. A hard-coded chain of conditions reproduces the count-coupling defect this family is full of."
  - "A commit is accounted for when it is reachable from the workspace's OWN pushed remote branch OR is on the shared main line; only a commit that is neither produces holds-work. Reachability from the shared main line must be decided by PATCH CONTENT, not by commit identity (BO-4100c-1-i's rule, unchanged): after a squash merge the pre-squash SHAs are absent from main's history while their diffs are on it, so a squash- or patch-equivalent commit counts as on main. The existing close-worktree procedure already uses git cherry for exactly this reason and records why. A pushed-but-unmerged commit must read as accounted for; a commit whose pushed branch was deleted after merge must still be caught by the main-line / patch-content check."
  - "The pushed-line half of the reachability check must read the locally known remote-tracking ref of the workspace's OWN branch -- the ref the workspace's own push updates -- and must not fetch to refresh it. A workspace with no remote-tracking ref for its branch has no pushed line, and its commits are judged against the shared main line alone. Open, not decided here: BO-4300e-2's it_requirements say reachability is judged after a fetch; reconciling that with this record's no-fetch read is unresolved and must not be settled silently by the implementation."
  - "The ONLY exemption for a modified tracked file is that BO-4300c-1-iii's build-output rule identifies it as changed by a build. The verdict must consume that rule's answer and must hold no file-name list, path pattern or heuristic of its own for what counts as build output; until BO-4300c-1-iii is available, every modified tracked file produces holds-work (the safe direction). Staged changes, non-ignored untracked files and stash entries are never exempted by the build-output rule."
  - "Every holds-work record must name every item that produced it -- commit by full identifier, file by repo-relative path, stash entry by its stash reference -- and nothing that did not produce it, so the named set is exact rather than a sample."
  - "Untracked-file detection must honour the project's ignore rules as git itself resolves them -- nested .gitignore files and the worktree's own exclude file included -- or every workspace with a build cache reads as holding work and the accumulation half of BO-4100c never improves (see BO-4100c-1-i)."
  - "A stash entry must be attributed to the workspace it was made in. Git's stash list is per-repository and shared across every workspace, so an attribution rule is required. An entry that cannot be attributed to any workspace must not be silently dropped -- it is itself an unaccounted holding and must be surfaced rather than discarded."
  - "An assessment that raises or cannot read must yield the no-verdict outcome, never holds-nothing. The natural implementation reads an unanswerable question as an empty finding set; that path must be closed here, because BO-4100c-3 can only act on an outcome this record produces."
  - "Assessing the whole live set must be fast enough for routine use at the recorded scale -- on the order of seconds for 150 workspaces -- so per-workspace git invocations must not be issued serially without bound."
  - "The assessment is a READ. It must not fetch, prune, reset, stash, or write any ref or file in any workspace it inspects. (The fetch question against BO-4300e-2 remains open -- see the pushed-line requirement above.)"
  - "Any new module must be registered in the build deploy manifest (scripts/build_phases*.py). The hook and CLI layers run from the DEPLOYED layout, so a module present only in the source tree raises ModuleNotFoundError at runtime while every source-tree unit test passes."
delivers_to:
  agent: python-coder
  contract: "One assessment record per live workspace: { path: str, verdict: 'holds_work' | 'holds_nothing' | 'no_verdict', items: [{kind: 'modified' | 'staged' | 'untracked' | 'unreached_commit' | 'stash', ref: str}], reason: str | null }. `items` is non-empty exactly when verdict is holds_work, and is the set BO-4100c-2's refusal names item by item. `reason` is non-null exactly when verdict is no_verdict, and is what BO-4100c-3's refusal states. The three verdict values are a closed machine-readable discriminator, so BO-4100c-3's two refusals are distinguishable without parsing prose. BO-4100e-2-i consumes the same record for a workspace reached by discovery rather than by registration."
expects_from: null
test_required: true
test_spec:
  - name: test_every_workspace_in_the_live_set_carries_exactly_one_verdict
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A fixture holding many workspaces of mixed state is assessed; the number of records equals the number of live workspaces, every record carries one value from the closed verdict set, and none is absent or null."
  - name: test_each_of_the_five_triggers_independently_yields_the_holds_work_verdict
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Five workspaces are built, each carrying exactly ONE trigger -- a modified tracked file the build-output rule does not identify as build-changed, a staged change, a non-ignored untracked file, a commit on neither its own pushed line nor main, and an attributed stash entry -- and each is asserted holds_work on its own, naming exactly that one item. Independently sufficient means a fixture combining them cannot prove this. Real git repos in temp dirs (a bare repo as the shared project), no mocks of git, no build.py spawn."
  - name: test_pushed_unmerged_workspace_holds_nothing
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "'pushed': a workspace whose branch carries two commits pushed to its own branch on a bare-repo shared project but absent from main, with a clean tree, is asserted holds_nothing with empty items. Discriminates the amended rule from the old main-only rule, under which this read holds_work. The assessment does not fetch -- the remote-tracking ref is the one the fixture's own push updated. Real git repos in temp dirs, no mocks of git, no build.py spawn."
  - name: test_squash_merged_workspace_holds_nothing
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "'squashed': three commits whose combined content landed on main as one new commit under a different identifier, with the workspace's pushed branch deleted and a clean tree, are asserted holds_nothing -- proving patch-equivalence counts as on main rather than commit identity. Real git repos in temp dirs, no mocks of git, no build.py spawn."
  - name: test_rebuilt_workspace_with_only_build_output_dirt_holds_nothing
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "'rebuilt': all commits on main and the only uncommitted changes are tracked files that BO-4300c-1-iii's build-output rule identifies as build-changed; asserted holds_nothing. A paired control modifies one further tracked file the rule does NOT identify and is asserted holds_work naming exactly that path, proving the exemption comes from the rule and not from a blanket tolerance of dirt. The build-output rule is exercised through its real interface, not a name list in the test or verdict. Real git repos in temp dirs, no mocks of git, no build.py spawn."
  - name: test_unsent_workspace_holds_work_naming_exactly_its_three_items
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "'unsent': one commit on neither its own pushed line nor main, one work-made change to a tracked file, and one new non-ignored file; asserted holds_work whose items are exactly {unreached_commit: <that commit's full identifier>, modified: <that path>, untracked: <that path>} -- no more, no fewer. Real git repos in temp dirs, no mocks of git, no build.py spawn."
  - name: test_the_assessment_covers_the_whole_live_set_rather_than_one_named_workspace
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The assessment is invoked with no workspace named and returns a record for every live workspace. A per-workspace answer that nothing calls for the whole set leaves the accumulation exactly where it was, and passes every other test here."
  - name: test_an_unattributable_stash_entry_is_surfaced_rather_than_dropped
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A stash entry that cannot be attributed to any live workspace appears in the output as an unaccounted holding. Silently dropping it is the recorded loss shape -- a stash belonging to a workspace nobody could attribute."
  - name: test_the_assessment_is_reached_through_its_cli_entry_point
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: "the workspace-assessment CLI entry point (the command BO-4100c-2/c-3/c-4 disposal invokes)"
    description: "The verdict is obtained through the entry point disposal actually calls, not by importing the helper, so a verdict rule that is never wired into disposal fails."
test_rationale: |
  Two clauses here are routinely dropped and both are the point of the record.
  First, WHOLE-SET coverage. A test that assesses one workspace and checks its verdict is
  correct passes against an implementation that can only ever be pointed at a workspace
  someone already chose -- which is exactly today's prompt-based procedure, and which
  leaves 150 workspaces at 150. The assertion has to be that a call naming nothing returns
  a record per live workspace.
  Second, INDEPENDENT SUFFICIENCY. A single fixture carrying all five triggers at once is
  satisfied by an implementation that detects only one of them. Each trigger therefore
  gets its own single-trigger workspace, and each is asserted alone.
  The five are not interchangeable detections: a commit that never left the branch and an
  orphaned stash entry are different losses found by different means, and the stash case
  needs an attribution rule that has no analogue in the other four -- which is why the
  unattributable entry gets a test of its own rather than being assumed away.
