criteria: |
  Once your work lands, its workspace is gone -- no wrap-up step needed.

  Whichever route did the work, its workspace is cleared through the one shared door
  once that work has landed on the shared main line -- by the run itself when the work
  lands before the run ends or there was nothing to deliver, and otherwise by the
  routine landed-work pass with no one having to step in. A run that stopped or failed
  keeps its work and is listed, and once nothing unsent remains the landed-work pass
  clears its workspace as soon as its work lands or after 14 days with no change,
  because work already sent stays safe on the shared project; the older ways of
  clearing are gone.
