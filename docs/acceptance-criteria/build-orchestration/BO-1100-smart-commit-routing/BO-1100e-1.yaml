criteria: |
  Given an unmatched shape with directory pattern "docs/architecture/**",
  When the filtering skill is invoked with this pattern,
  Then the skill executes a path-scoped git log query limited to commits
    that touched files under "docs/architecture/",
  And the skill does NOT read the full unfiltered git log,
  And the returned commits are limited to those where at least one
    changed file matches the provided directory pattern.
