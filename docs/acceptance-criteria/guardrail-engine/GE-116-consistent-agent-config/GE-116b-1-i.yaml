id: GE-116b-1-i
components:
  - commit_guardian
title: "Every offending definition in a commit is named in the block message"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
assigned_agent: python-coder
estimated_complexity: S
criteria: |
  Given a single commit is blocked because two or more staged agent definitions
    each require verification while granting no ability to edit or create files,
  When the block message is shown to the person committing,
  Then the message names every one of the offending definitions, not only the
    first one encountered,
  And each named definition is accompanied by the two valid fixes,
  And no offending definition is silently omitted from the message.
