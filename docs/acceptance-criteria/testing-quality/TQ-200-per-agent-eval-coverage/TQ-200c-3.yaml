title: "One piece of work can be asked for a deterministic proof and a judged proof at the same time"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given one piece of work with two things to prove — that its declaration is
    well-formed and consistent with the registry it must agree with, which an
    assertion settles, and that it actually elicits the intended behaviour from a
    model, which only a judgment settles,
  When the proof it will be asked for is written down and handed on,
  Then both demands are present in the same plan for that one piece of work,
  And each is legible as its own kind, so the deterministic demand is not read as
    judged and the judged demand is not read as deterministic,
  And adding the second demand leaves the first unaltered — same proofs, same
    wording, same order — so neither kind displaces, absorbs or reorders the other,
  And each demand reaches the party that can satisfy it without the other being
    dropped in transit, so a plan that carries two demands results in two proofs
    being asked for rather than one,
  And nothing about the work has to be split into two separate pieces in order for it
    to carry both.
depends_on:
  - TQ-200c
  - TQ-200c-1
