notes: |
  SEQUENCING HAZARD — READ BEFORE SCHEDULING. This AC and ACS-1200a (sibling tree,
  ac-store component) modify check_ac_parent_covered_by.py in OPPOSITE directions:
    - GE-120b-1 makes the check RUN RELIABLY from every working copy.
    - ACS-1200a changes WHICH RULE the check enforces, so that a deliberately parked idea
      stub is not treated as a violation.
  Landing GE-120b-1 alone makes the WRONG rule fire more reliably: every parked idea stub
  would be blocked more consistently than it is today, because today the check silently
  skips itself in the working copies where the stubs are authored. Net effect of shipping
  this AC first is a REGRESSION in usable behaviour, even though it is a correct fix.

  Required ordering: land ACS-1200a with or before GE-120b-1, or land both in the same
  release. ACS-1200a is recorded in this AC's depends_on to make the ordering machine-
  visible to the build sequencer rather than leaving it as prose. It is a scheduling
  dependency, not a structural parent — the structural parent is GE-120b.

  ACCEPTANCE SHAPE, as the PO specified it: the two runs must agree. This is the canonical
  reproduction of the whole GE-120 defect class and is labelled DIRECTLY OBSERVED AND
  REPRODUCIBLE — same check, same repo, same staged files, opposite verdicts decided purely
  by workspace layout.

  RECIPROCAL ORDERING NOTE (IT-PO, 2026-08-14) — this is the half the BA could not write,
  because the two trees were authored by concurrent agents.
    ACS-1200a-2 ("The commit-time back-link check passes a parked tree with nothing
    skipped", component ac-store) carries in its delivers_to: "ORDERING CONTRACT: must land
    before, or in the same release as, GE-120b — GE-120b increases how reliably this check
    runs, so shipping it first amplifies the wrong rule." Its notes explicitly ask that the
    matching note be added here.
    The reciprocal is now recorded on this AC in three machine-visible places: depends_on
    already lists ACS-1200a; delivers_to now carries the ORDERING CONTRACT in the same
    words; and it_requirements states it as a scheduling constraint. Both halves of the
    contract now agree: ACS-1200a lands first, or both land together. Neither tree may be
    scheduled against the other's absence.

  PREREQUISITE RECONCILIATION (IT-PO, 2026-08-14) — ACD-1403 is a live landmine and is
  recorded here as a RISK, not as work for this tree. ACD-1403 requires deleting
  unit_tests/commit_guardian/test_check_ac_parent_covered_by.py on the premise that the hook
  was removed. The hook exists, the test exists, and the hook is wired at
  .pre-commit-config.yaml:294. Building ACD-1403 as written deletes coverage this AC
  depends on. It also carries level: null and work_status: null. Reconcile or supersede it
  in the ac-driven-dev component before this AC is scheduled.
target_epic: EPIC-TrustThatAGreenCheckActuallyChecked
