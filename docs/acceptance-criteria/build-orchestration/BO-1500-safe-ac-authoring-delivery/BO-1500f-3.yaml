notes: |
  Design-review gap 2. Today an already-existing workspace whose name matches is adopted
  silently, so a second run walks straight into another run's in-flight drafts. Silently
  absorbing another run's unfinished work is the reported incident, which is why the
  no-longer-going case is reported as recoverable rather than adopted automatically --
  the person decides whether those drafts are salvaged, abandoned, or handed back.

  Re-homed 2026-08-14 from BO-1500a-10 to BO-1500f-3 by the Pattern C intermediate split
  of BO-1500a. Criteria text is unchanged. The flagged amendment against BO-1500a-1-i is
  preserved verbatim in the constraints above and is now a cross-tree obligation, because
  BO-1500a-1-i stayed under BO-1500a.
