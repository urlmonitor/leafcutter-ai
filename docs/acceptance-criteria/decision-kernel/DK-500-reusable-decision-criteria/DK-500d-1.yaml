id: DK-500d-1
title: A new decision is first offered the published categories that fit its kind and components
component: decision-kernel
components:
- decision_kernel
level: L2
status: active
readiness: approved
req_status: draft
priority: high
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given the published categories cat-1dc11c5a2ffa7310, cat-d15d52392d7aa94c, cat-52b16c7b5a23106f, cat-d6ce5f78c181ebd1 and cat-1df63b670163b54e, all for decision type design and not limited to a component,
  And the candidate cat-73d233fc8b15c735, the staged cat-6c3eb4f2af148922 and the retired cat-40cc613f737e3323, which would also fit,
  When a design decision scoped to the component decision_kernel is framed after its findings are written,
  Then the five published categories are offered as its starting criteria before any criterion is drafted,
  And each is offered in its preferred wording and carries its category id,
  And cat-73d233fc8b15c735, cat-6c3eb4f2af148922 and cat-40cc613f737e3323 are not offered,
  And the categories are found from the reviewed records in the repository by filter and wording, without a request to the run history,
  And they reach the approval of proposals as proposals, never as approved criteria.
depends_on:
- DK-500d
- DK-500c-2
covered_by:
- DK-500d-1-i
implemented_by: []
assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: 'Reused criteria: [{category_id, criterion_id, question: pref_label, priority: required|supporting, kind: evidence_answerable|design_judgement, proposal_status: proposed, reuse: unedited}] plus left_out_count: int, proposed beside drafted ones. Consumed by the gap judgement (DK-500e-1), the approval of proposals (DK-500d-2) and membership staging (DK-500d-3).'
expects_from:
  ac_id: DK-500c-2
  contract: docs/criteria/index.json entries with decision_types and components filters (DK-500c-2 delivers_to).
change_target: code
risk_surface: contract_boundary
it_requirements:
- Reuse runs in the decision capability after the findings and before any drafting (flow step reuse-criteria). It reads only published categories, through docs/criteria/index.json with the same sha256 check the decision file backend uses, and never reads Langfuse, the mining store or any run root (ADR-058 section 6).
- 'Q8 fit rule, IT PO default (confirm with the user): a published, non-retired category fits when its decision_types is empty or contains the decision''s decision_type, and its components is empty or intersects the decision''s scope components. A component-limited category therefore does not fit a repository-wide decision. Candidate, staged and retired categories never fit.'
- 'Q8 cap and order, IT PO default: at most a configured number of fitting categories is offered (default 8). They are ordered by content-word overlap between the category labels and the decision question, with ties broken by category id. Usage counts and outcomes never enter the order (DK-500f-4). When more categories fit than the cap allows, the approval states how many were left out.'
- Each reused criterion is a proposal (proposal_status proposed) whose question is the category's pref_label. Its criterion id is the most common member criterion id (ties in lexical order), made unique within the decision; its priority and kind are the majority among the category's member criteria, falling back to the decision record schema defaults on a tie.
- The reuse link (category id, criterion id, reuse kind unedited, edited or grouped) is kept in run state and in the run's staged area, never as a new field of the decision record. RecordCriterion has additionalProperties false, and the decision record schema stays unchanged (dec-93c1c730463c1f3c, crit.existing_consumers_unchanged).
- Reuse makes no Jev call.
test_required: true
test_spec:
- name: test_five_published_categories_offered_before_drafting
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The five published design categories are offered as starting criteria before any host drafting request.
- name: test_offered_in_pref_label_with_category_id
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Each offered criterion carries its category's preferred wording and category id.
- name: test_candidate_staged_and_retired_not_offered
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: cat-73d233fc8b15c735, cat-6c3eb4f2af148922 and cat-40cc613f737e3323 are not offered.
- name: test_lookup_reads_index_not_run_history
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The categories come from docs/criteria/index.json; a failing Langfuse read port is never called.
- name: test_reused_reach_approval_as_proposals
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The reused criteria reach the approval of proposals with proposal_status proposed, never approved.
- name: test_cap_and_left_out_count
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: boundary
  description: With more fitting categories than the cap, exactly the cap is offered in the stated order and the approval states the left-out count.
test_rationale: Run the decision capability through the public run/resume boundary with a scripted Jev provider and a recording host port over a fixture category library; assert the approval payload, call counts and staged files rather than internal helpers.
