id: INF-500d-3-iii
components:
  - infrastructure
  - feedback_collector
title: "Reading the feedback id from standard output keeps working unchanged, and still returns each agent its own id under concurrent submissions"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given 20 submissions from 20 separate processes start within the same second,
  When all 20 complete successfully,
  Then each submission's standard output is exactly one line,
  And that line is a feedback id of the form fb_YYYY-MM-DD_xxxxxxxx,
  And the 20 ids are pairwise distinct,
  And each id names the record that its own submission appended, matched by that
    record's category, phase and note.

  Given a caller that captures the id from standard output and never consults the
    recovery file, as the epic-supervisor and live-surface-tester instructions do
    today,
  When it runs the same submission command as before the recovery-file change and
    the error-stream change,
  Then it receives the same single-line id with no change to its command or parsing,
  And the sign-off instructions still tell the agent to read standard output first
    and to fall back to the recovery file only when standard output is empty.
