it_requirements:
  - "BINDING CONSTRAINTS (these are the requirement; the mechanism below is a recommendation). (1) The process under test must not be able to import from the source tree: scrub PYTHONPATH, run the interpreter in isolated mode, and do not set cwd to the source tree. (2) The deployed layout must be what the check sees: .leafcutter/scripts/commit_guardian/ inside the second copy, produced by running 'python scripts/build.py --target-dir <copy>' there. (3) The invocation must match the real commit path in shape — 'python .leafcutter/scripts/commit_guardian/run_hook.py .leafcutter/scripts/commit_guardian/<check>.py <staged files>' as .pre-commit-config.yaml declares it (line 294 for check-ac-parent-covered-by) — plus the direct-script shape used by precommit-canary."
  - "OPEN QUESTION ANSWERED — recommended mechanism: 'git worktree add' into a temporary directory at the same commit, then build into it. It matches how people actually work, which is the L1's stated standard, and it gives real staged files via a real git index. CAVEAT TO HANDLE: a worktree SHARES the git object store, so the harness must not run concurrently with another drive in the same repository, and must clean up with 'git worktree remove' even on failure. A copied tree is acceptable if staging can still be exercised; a clone is safest under concurrency and slowest. Record which was chosen and why — the behavioural requirement is only that the source tree is not importable and the deployed layout is what the check sees."
  - "THE HARNESS ASSERTS ONLY ON THE SUBPROCESS'S OBSERVABLE OUTPUT: exit status, the result value carried in its output, and the text it wrote. It must not import any check module, any commit_guardian helper, or _resolve_root.py. Importing anything from the source tree reintroduces the exact blindness this harness exists to remove."
  - "Per check exercised, record and print result status plus output text FROM BOTH copies, side by side, so a disagreement is readable directly rather than inferred from a failed assertion. This report is the artifact GE-120b-1, GE-120b-3 and GE-120b-4 consume."
  - "A grep or source-text harness case is NOT acceptable coverage for any criterion in this tree. Encode that as a rule the harness enforces on its OWN case definitions — a review convention will not survive the fourth author."
  - "SELF-DEMONSTRATION IS A DELIVERABLE, not a nice-to-have: point the harness at a check that resolves its prerequisites only via the source tree (any of the 19 un-migrated files listed in GE-120b-2, before that AC migrates it) and show the harness FAILS. A harness that cannot be made to fail is not evidence."
  - "HOME: unit_tests/portability/, which already holds test_build_deployment.py, the existing deployed-layout test. Do NOT place it in unit_tests/commit_guardian/, whose tests import from the source tree — that directory is the layout the defect hides in, and a harness living there will be tempted into the same import."
  - "RUNTIME BUDGET: the sweep builds a second copy and spawns one process per manifest check (54 today, 108 across both copies). Build each copy ONCE per sweep, never per check, and mark the sweep slow rather than letting it quietly narrow its subject list to stay fast."
  - "Error-handling policy applies to the harness's own subprocess and filesystem calls: specific exceptions, logged at WARNING, never swallowed — and per GE-120c-1-i a setup failure is a reported failure, not a skipped case."
test_spec:
  - name: test_ge120c1_harness_creates_real_second_copy_and_stages_files
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The harness stands up a real second working copy of the repository and stages real files in it."
  - name: test_ge120c1_check_invoked_as_separate_process_in_commit_path_form
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The check is invoked as a separate process using the same entry shape the pre-commit config declares, including the direct-script form."
  - name: test_ge120c1_source_tree_absent_from_import_path_of_process_under_test
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The subprocess cannot import from the source tree — PYTHONPATH scrubbed, isolated interpreter, cwd not the source tree."
  - name: test_ge120c1_source_tree_only_check_fails_the_harness
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Pointed at a check that resolves prerequisites only via the source tree, the harness FAILS — the self-demonstration that it can catch the defect class."
  - name: test_ge120c1_reports_status_and_output_from_both_copies_per_check
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Per check exercised, the harness reports result status and output text from each of the two working copies."
test_rationale: "Every existing unit test for these checks imports the check module from the source tree, which is precisely the layout in which the defect does not reproduce — a test that cannot fail on the observed defect is not evidence. The source-tree-off-the-import-path property is therefore not a style preference but the single property that lets this harness see the defect class at all, and it can only be established by inspecting the real subprocess environment. The self-demonstration case is included as a test because a harness that has never been observed to fail proves nothing about the harness."
delivers_to:
  agent: python-coder
  contract: "Out-of-process execution of a deployed check from a second working copy, returning its result status and output text for comparison."
