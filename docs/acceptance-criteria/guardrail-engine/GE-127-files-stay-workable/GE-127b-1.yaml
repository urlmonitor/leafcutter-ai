notes: |
  THIS IS THE KEYSTONE RECORD OF THE GOAL AND THE HIGHEST-VALUE ITEM IN IT. It is
  what makes the standard switchable on the day it lands. RE-MEASURED IN THIS
  WORKTREE AT AUTHORING TIME, 2026-09-01, under the guard's own counting rule
  (docstrings and block comments discarded before counting), over tracked files
  only: 200 files of the kind already in scope stand above their permitted length.
  Two figures that must NOT be merged, both re-measured here and both moved since
  assessment:
    - 200 above their applicable limit under the guard's own counting rule
      (assessment recorded "on the order of 190" — carry the new figure, and keep
      the label).
    - 314 above 400 raw lines with no exclusions (the L0 records 312 from a
      differently-scoped walk of four source directories; this figure is over all
      tracked files of that kind, so the two are not in conflict but are not the
      same measurement either).
  No file of the other currently-in-scope kind stands above its limit at all. The
  gap between 200 and 314 is produced by the counting rule discarding
  documentation blocks, and that gap is GE-127d's subject, not this record's.
  A flat threshold switched on today refuses essentially every commit touching any
  of those 200.

  THE THREE ARMS ARE THE THREE THE L1 ASKS FOR, STATED SO THEY CANNOT BE INFERRED
  AWAY. Grew → refused. Same or shorter → allowed, even though still over. No
  previous length → outside what this comparison judges. The second arm is not a
  concession, it is the mechanism: without it the ratchet is a freeze, and a
  frozen file never gets refactored because nobody can touch it.

  THE NEGATIVE ARM IS MANDATORY AND IT IS CLAUSE ONE. Every other arm here is
  satisfied by an implementation that permits everything. One line longer on an
  already-oversized file, refused, is the only clause that distinguishes a working
  ratchet from a disabled one — and it is genuinely RED today, because no commit
  is refused for file length at all. Capture that failing run before any work
  starts.

  README ALREADY PROMISES THIS AND HAS SINCE THE PROMISE WAS REMOVED. The
  published description of this gate states that modifications to existing large
  files are exempt as an "incremental refactor path". The guard's own recorded
  change history says that exemption was removed on 2026-05-01 to drive
  progressive refactoring, and nothing replaced the path it was providing. This
  record restores a documented-but-absent behaviour rather than inventing a new
  one — and it does so in the form that survives, since a ratchet gives the
  incremental path without reintroducing the exemption. Reconciling the stale
  wording itself is GE-127d's work and must not be done here.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Two clauses assert
  that a commit is ALLOWED, and every one of them is green on arrival on an
  implementation that refuses nothing. Each carries an injection that must be run
  and reverted:

  (1) "the commit completes, and the file is not refused for still standing above
      its permitted length" — MUTATION: judge the already-oversized file against
      its fixed permitted length instead of against its own previous length. Under
      that injection a change that SHRINKS an oversized file is refused; this
      clause must go RED, failing by the commit outcome as well as by the text, and
      return to green on revert. This injection is the freeze the L1 names as the
      failure mode, and it is the single most likely way for a well-intentioned
      implementation to land.

  (2) "a file with no previous length is never treated as having previously stood
      at zero lines" — MUTATION: treat an absent previous length as a previous
      length of zero. Under that injection every newly added non-empty file of a
      covered kind is refused as having grown; this clause must go RED and return
      to green on revert. Without the injection the clause is satisfied by a guard
      that refuses nothing.

  THE SHRINKING-BACKLOG CLAIM IS PART OF THE PROMISE, NOT A SIDE-EFFECT. The value
  being sold is that the population of oversized files is monotonically
  non-increasing once this lands. An implementation that lets an oversized file
  grow under a routine condition — a large mechanical rename, a generated block, a
  merge commit — breaks that promise even though every hand-written scenario above
  passes. No such exception may be defaulted into existence. If one is judged
  necessary it is a decision to be taken explicitly and recorded, and the record
  belongs with the decision, not in a path pattern nobody revisits.

  BOUNDARY WITH GE-127a-1, DELIBERATE. That record's population is a file that was
  UNDER its permitted length before the change and is OVER it after. This record's
  population is a file already OVER before the change. The populations do not
  intersect and neither record closes the other.

  BOUNDARY WITH GE-127d, AND A REAL HAZARD RATHER THAN A FORMALITY. What counts as
  the file's length — which lines are counted and which discarded — is settled in
  one place and that place is GE-127d. This record consumes that answer. Note the
  interaction: if the counting rule discards some classes of line, a change that
  adds only discarded lines registers as no growth and is allowed here. Whether
  that is correct is GE-127d's call to make and this record's to inherit; do not
  settle it by writing a second counting rule into the comparison.

  WHERE THE PREVIOUS LENGTH COMES FROM IS DELIBERATELY UNSTATED. The criteria say
  "the length it stood at before the change" and nothing about how that is
  obtained. That is the IT PO's decision, and GE-127b-1-i is the floor that stops
  whichever source is chosen from degrading into a silent no-op.

