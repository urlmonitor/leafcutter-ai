notes: |
  A CONTRADICTION WITH A STANDING INSTRUCTION, FLAGGED EXPLICITLY RATHER THAN RESOLVED
  QUIETLY. The authoring surface says unsettled documents do not belong in the index. This
  record says they do, with their state shown. The two cannot both stand, and the reasons
  for taking this side are: the L1's benefit is being findable on the day the document is
  written, and every document is unsettled on that day; the surface's own worked example
  passes the listing flag on the creation invocation, so the instruction already contradicts
  itself; and an index that silently omits part of the collection is worse than one that
  shows it as provisional, because a reader cannot tell an absent document from a
  non-existent one. THE USER SHOULD SEE THIS AND MAY DECIDE OTHERWISE. The alternative — the
  index lists only settled documents and the listing is performed later, when the document
  settles — is coherent, and it reduces INF-1300c to a benefit nobody will ever collect,
  because "later" is a step no check enforces and no author remembers. If it is chosen, the
  L1's title must change, because the document will not be findable the day it is written.

  WHY THIS IS AN L3. It adds no behaviour of its own. It constrains INF-1300c-1's listing
  on the single input every listing actually has — a document in its first moments — and
  that input is where the standing instruction and the benefit collide.

  FALSIFIABILITY. Produce a document with its listing requested and read the index: the
  record is falsified if no entry appeared, or if the entry does not show the document's
  state. Then change the document's declared state and request the listing again: falsified
  if a second entry appears, or if the entry's stated state and the document's own now
  disagree. The last arm is the one an implementation fails by writing the state once, at
  creation, and never reading it again — which produces an index that grows increasingly
  confident about documents that have moved on.

