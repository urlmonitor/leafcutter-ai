it_requirements:
  - "WHERE IT RUNS: templates/skills/building-epics/SKILL.md section 5.9, the procedure ticket-supervisor follows around its commit phase (ADR-040 section 3). build-epic.js only dispatches ticket-supervisor and makes no commit of its own, so it stays EXCLUDED in knowledge_routing_wiring, with covered_by naming the skill section. The build-time guard enumerates workflow artefacts only and cannot see a skill-hosted step."
  - "WHY INSIDE THE LOCK: sibling tickets share one worktree, and the CLI keeps one run record per worktree git dir. Stage, commit and observe must not interleave across tickets."
  - "THE DEDUPE LIVES IN THE ROUTING MODULE, NOT THE DRIVER (INF-700a-1: idempotence is inherited, not rebuilt): stage_completion checks HEAD's copy of the destination before writing, and the worktree copy before appending."
  - "Fail-open per ADR-034."
