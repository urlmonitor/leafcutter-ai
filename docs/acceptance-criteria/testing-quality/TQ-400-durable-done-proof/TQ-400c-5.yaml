id: TQ-400c-5
components:
  - testing_quality
title: "A reader can change the cadence and find the latest published verdict from the guide alone"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a maintainer who needs either to change how often the honesty sweep runs
    or to find the result of the most recent run, and who has the cadence how-to
    and nothing else,
  When they follow that guide,
  Then they can say where the recurring run is configured and what changing it
    involves, and make such a change without searching the repository for the
    schedule,
  And they can reach the most recently published verdict and say which dated
    occurrence produced it, and reach the preceding occurrence's report to compare
    against it,
  And, following the guide, they trigger one run outside the normal cadence and
    see its report appear — so the instructions are demonstrably the live ones
    rather than a description of them,
  And the place the guide sends them to read the headline figures is the place a
    completed run actually publishes to: a reader who follows the guide after a
    run finds that run's figures there, not an empty or placeholder location,
  And, faced with a cycle in which no report is present, they can tell from the
    guide whether the run failed or has not yet fired, and what to look at in each
    case,
  And they can state what the direction-of-travel figures mean — which population
    moved, in which direction, and against which earlier occurrence — rather than
    only that a change is reported,
  And the cadence, the trigger and the out-of-cycle instruction the guide gives
    are the ones configured in the repository when the guide is published, not a
    generic account of scheduling.
depends_on:
  - TQ-400c
  - TQ-400c-1
  - TQ-400c-2
  - TQ-400c-3
  - TQ-400c-4
