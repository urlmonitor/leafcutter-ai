notes: |
  THE RECONCILIATION IS THE POINT — a check that reads only one declaration cannot see the
  drift, because the drift IS the disagreement between them. The parent L1 records the
  starting state the user surveyed on 2026-08-25: roughly 25 registry entries declare a
  non-empty set of cleared recipients, roughly 30 agent definitions are granted the means
  to hand off, and 9 hold that means with nothing cleared. Those 9 are exactly the first
  scenario. Do not encode the counts — see BO-3100a-2.

  MECHANICAL, NOT ADVISORY. "Does not ship" is expressed here as assembly stopping and
  producing no output, so the criterion cannot be satisfied by a check that prints a
  warning and lets the build continue. Per CLAUDE.md "Gate / Workflow ACs — Verify
  Behaviorally, Not by Grep", the covering test must run the real assembly over a fixture
  set in all three states and assert on the assembly's outcome, not on the presence of the
  check's source text.

  THE THIRD SCENARIO KEEPS THE GUARD ON. An agent that neither holds nor is cleared for
  hand-off must be silent. Without it, the check reports most of the roster on every run
  and gets switched off — the fate BO-2900d exists to avoid.

  BOUNDARY: INF-600g already covers agent-card / registry coherence in general and
  INF-600k covers tolerating non-agent external callers such as workflows in the
  "who may call me" direction. This AC is specifically the hand-off AUTHORITY axis and
  must not re-derive either; a workflow named as a caller is not an agent holding a
  hand-off means and is out of scope here.

  IT-PO ENRICHMENT NOTE (2026-08-26). The two declarations resolve, today, to
  `spawn_allowlist` in config/agent_registry.json and the `tools:` frontmatter of
  templates/agents/*.md (the means being the Agent/Task tool). The implementer must confirm
  those against the repository rather than take this note as the specification — the
  criterion is written about the declarations, not about those two field names, so it
  survives a rename. `declares_side_effect: true` because the observable is an assembled
  tree written (or, on failure, deliberately NOT written) to a target directory.
