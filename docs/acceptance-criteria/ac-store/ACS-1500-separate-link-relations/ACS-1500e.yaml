notes: |
  WITHOUT THIS L1 THE TREE IS A ONE-TIME CLEANUP THAT REFILLS. The 76 mixed
  records and the 361 test-path-only lists were not written by hand in one
  sitting; they accumulated because the documented rule permitted them and
  every authoring surface followed it. Convert the store and leave the rule
  alone and the same population regrows.

  AGENT ASSIGNMENT — FLAG FOR THE IT-PO, WHO SCANS FOR THIS LINE. This L1 is
  prose and template surface: ac-schema.md plus the agent templates and skills
  that instruct an agent what to WRITE. That is llm-expert per the IT-PO's
  'agent assignment by technical surface' convention, NOT python-coder, exactly
  as ACS-800f is. Its five siblings are tooling and schema and are python-coder.
  Do not let a uniform stamp collapse the distinction — PROJECT_CONTEXT.md
  already records this going wrong once.

  ENUMERATE THE WRITING SURFACES FROM THE REPO, NOT FROM THIS RECORD. The
  doc_links above name a starting set found by grep on 2026-09-08 and it is not
  claimed to be complete. State the population examined against the population
  found (ACS-1100, inherited).

  ac-schema.md ALREADY CONTAINS A RULE THE CODE DOES NOT ENFORCE — its back-link
  protocol is written as unconditional while the hook has three escape hatches,
  and ACS-1400a and ACS-1200a are both amending the same document for their own
  reasons. Three trees editing one reference doc in the same period; sequence
  the edits or they will overwrite one another.

  THIS L1 DOES NOT ENFORCE ANYTHING. Making the guardrails demand the new form
  is a separate act with its own blast radius, and a required gate that rejects
  the old form before ACS-1500c has finished converting is unshippable. Guidance
  first, enforcement later and deliberately.
