  agent conduct. Substitutes: -i and -ii (deterministic), pr-reviewer against the
  Then clauses, and a test-writer eval row (incident 2 shape) in TQ-200d-1.
  Loosened assertions that neither -i nor -ii can see (for example a widened
  tolerance) are left to review and to the wrong-version runs.

