notes: |
  Anti-duplication / scoping AC. The existing tool is
  scripts/ac_store/cross_reference_audit.py — it BACKFILLS implemented_by links
  but does NOT detect stale code behind a retired AC. IT-PO/BA: reuse its
  traceability-resolution logic (the AC<->source mapping) rather than writing a
  second independent traversal; the new hook is the lifecycle-enforcement
  complement, not a replacement. The component-diagram trigger captures the
  boundary between the new blocking hook and the existing audit script so a future
  reader sees the two are complementary by design.
