title: "Once the fix exists, its tests are run against the wrong versions, and the runs decide"
component: testing-quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  A fix or gate isn't done while a named wrong version still passes its tests.

  After the code is written, each named wrong version, plus the fix simply
  undone, is actually applied and the guarding tests are run against it,
  database tests included. Any wrong version the tests fail to notice stops the
  work, and the verdict comes from those runs, not from anyone's opinion of the
  tests. Existing tests that lean on a changed check are part of that set; they
  may be strengthened, and every change to one is listed, but none may be
  weakened to get a green result.
