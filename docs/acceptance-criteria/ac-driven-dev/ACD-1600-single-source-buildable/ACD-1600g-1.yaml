notes: |
  THE DECLARATION SLOT. This is the half of ACD-1600g that does not exist at all
  today: per the L1's verified notes, `out_of_scope` has ZERO occurrences in
  config/ac_store_schema.json and ZERO in scripts/ac_store/generate_ticket_from_ac.py.
  Its twin `files_touched` already survives the migration (derived AC-side by
  `_build_files_touched()`, generate_ticket_from_ac.py ~line 497), so the pair is
  asymmetric and only the exclusion half needs a new home.

  HARD PREREQUISITE, NOT A PREFERENCE. config/ac_store_schema.json declares
  `"additionalProperties": false` at top level (line 15) and that constraint IS
  enforced today (jsonschema.Draft7Validator in scripts/ac_store/validate_ac_schema.py
  ~line 152; empirically confirmed 2026-08-17 -- an AC carrying an undeclared field
  is rejected with "Additional properties are not allowed", exit 1). No author can
  pilot this by hand-adding the field first: the optional slot must land under
  ACD-1900a's additive-first rule before any exclusion can be authored anywhere in
  the store. The IT PO should consider whether depends_on needs an ACD-1900a edge
  in the same shape as ACD-1800a's 2026-08-17 amendment.

  ADR-026 SAFETY RULES 1 AND 4 apply verbatim: the field lands OPTIONAL; absence
  means legacy mode (derive nothing, never fail -- hence the third Then clause,
  which makes "no exclusion" a valid, distinguishable state rather than a
  validation error); do not tighten additionalProperties until the store is 100%
  backfilled.

  MIRROR THE VALIDATION INTO ALL THREE ENFORCEMENT POINTS. Any shape/type rule
  must be added to scripts/commit_guardian/check_ac_schema.py AND its manual
  fallback scripts/commit_guardian/_ac_schema_validators.py (the load-bearing
  gate when jsonschema is absent) AND scripts/ac_store/validate_ac_schema.py. A
  rule added only to the JSON schema is a partial/no-op gate -- the same finding
  recorded on ACD-1800a-1's it_requirements.

  WHY THE EMPTY-BOUNDARY CLAUSE IS SEPARATE FROM "no boundary declared". The
  consumer (templates/agents/change-scope-reviewer.md, Step 1.1) currently reads
  `out_of_scope` from ticket frontmatter and says "may be absent -- treat as empty
  list". That conflation is exactly the quiet degradation ACD-1600g-4 exists to
  fix, so this L2 deliberately requires the two states to be reportable apart.

  TESTABILITY. Drive this behaviourally through the store validator and the
  reader that surfaces the boundary -- author a real AC record on disk, run the
  validator, and assert the boundary is returned. Do NOT satisfy it with a test
  that greps config/ac_store_schema.json for the field name: a grep passes on a
  key that no reader ever consults, which is the failure shape CLAUDE.md's
  "Gate / Workflow ACs -- Verify Behaviorally, Not by Grep" section forbids.

  2026-08-17 (IT PO enrichment). Four decisions recorded for the implementer.

  - KEY NAME IS `out_of_scope`, DELIBERATELY. Reusing the ticket-frontmatter key
    the consumer already reads makes ACD-1600g-3 a change of SOURCE only, not of
    vocabulary, and keeps the eventual backfill mechanical. A new name would force
    the reviewer to hold two vocabularies for the whole cutover window.

  - ONE READ SEAM (scripts/ac_store/scope_boundary.py) IS A CONSTRAINT, NOT A
    STYLE PREFERENCE. Four leaves under this L1 all need the same three-state
    read; if each parses the record itself, the default-to-empty collapse that
    ACD-1600g-4 exists to prevent will be reintroduced by whichever leaf is
    implemented last, and it will be invisible because the other three still pass.

  - THE ACD-1900a EDGE IS RECORDED AS `expects_from`, NOT ADDED TO depends_on.
    The BA's note asks the IT PO to consider a depends_on edge. The prerequisite
    is real and verified, but ACD-1600g's ORDERING note deliberately scoped its
    depends_on, and re-sequencing an L1 subtree is the user's call, not an
    enrichment. Flagged for the user in this pass's report.

  - RELATED VERIFIED FINDING, OUT OF SCOPE HERE: `schema_version` -- the per-AC
    data-version signal ADR-026's control surface depends on -- is ALSO absent
    from config/ac_store_schema.json's property list, and is therefore equally
    unauthorable under additionalProperties:false today. It belongs to ACD-1900a,
    not here, but it is the same blocker and should land in the same slot change.

  - AUTHORING NOTE ON it_requirements PROSE: only genuine EDIT surfaces are
    written as full paths. `_build_files_touched()` scrapes any slash-bearing
    token out of these bullets into the generated ticket's `files_touched`, so a
    read-only reference written as a path silently widens the declared change
    surface and weakens the very scope guard this L1 is building.
