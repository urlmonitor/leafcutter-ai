id: BP-100n-5-i
title: "A declaration whose shape the check cannot interpret, and a named file it cannot open, are each reported as their own unresolved condition — never folded into the conforming class and never into each other"
component: build-pipeline
components:
  - build_pipeline
  - ac_store
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given two shapes of declaration are in use against the same configuration file: one
    whose keys are the names of parts of that file, and one whose keys are the
    vocabulary of a schema language and therefore name nothing in that file,
  And at the time of writing one record whose work is recorded as finished uses the
    second shape, alongside three that are unfinished,
  When the check reads a declaration,
  Then a declaration whose shape it can interpret is looked up against the file and
    reported under the finding classes its parent defines,
  And a declaration whose shape it cannot interpret is reported by name as a
    declaration it could not interpret, is counted under a figure of its own stated
    alongside the others, and the run fails,
  And a declaration naming a file that cannot be opened is reported by name as a file
    it could not open, is counted under a further figure of its own, and the run fails
    — this is a different condition from a file that was opened and found not to contain
    the named part, and the two are reported with different wording,
  And no declaration is counted under more than one figure, and the figures sum to the
    stated number of declarations read,
  And a declaration whose shape the check can interpret is not reported as one it could
    not interpret.
