id: KM-400a-1-i
title: AC metadata retains the complete authored requirement and its test contract
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
priority: medium
work_status: done
parent: KM-400a-1
criteria: |
  Given an accepted AC has id KM-400a-1, a multiline criteria value, component knowledge-management,
  components [knowledge_management], status active, readiness reviewed and work_status done
  And it declares nested test_spec, doc_links, amended_by, pattern_bindings, delivers_to and expects_from values
  When that AC's native fields are exposed as graph metadata from the selected source revision
  Then the complete authored record is available, including criteria and every supplied schema field
  And lifecycle, priority, level, assignment, implementation references, coverage references and test declarations retain their independent meanings
  And each nested test declaration retains its own name, target, description and coverage references without mixing values between entries
  And the scalar component namespace remains distinct from the components membership list
  And source list order, duplicates, multiline text, typed dates, false, zero, explicit null and empty containers are preserved
  And an omitted optional field remains omitted even when its authoring schema defines a default
  And exposure creates no approval, parent relationship or passing-test claim that the source did not declare

  Given the selected source contains duplicate AC IDs or an AC rejected by the canonical AC validation rules
  When native AC metadata is prepared
  Then the invalid source is reported explicitly and is not silently collapsed or presented as a valid complete AC
depends_on: [KM-400a-1]
