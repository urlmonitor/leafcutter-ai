id: BO-3800b-1
title: "On the refusal path the restructuring specialist is actually engaged by the run, and is engaged before delivery is attempted again"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a ticket is being driven and delivery is refused with an outcome that
    names one file, states a demand of 120 measured lines against it, and states
    that a demand of that size is handed to a restructuring specialist rather than
    to the author inside this change,
  When the run adjudicates that refusal,
  Then the run engages the restructuring specialist,
  And that engagement is observable as a step the run actually took — it appears
    in the ordered record of parties the run engaged, alongside the parties engaged
    before the refusal, and it is not evidenced by the specialist's name appearing
    in a template, a workflow definition, a prompt, a routing table, a
    configuration file or a line the run printed without acting on,
  And the party engaged is the restructuring specialist and not some other party
    the run had to hand,
  And the engagement appears in that record BEFORE the entry for the second
    delivery attempt,
  And given instead the same refusal with its stated disposition changed in one
    respect only — it states that the demand is one the author may discharge
    inside this change,
  When the run adjudicates that refusal,
  Then no restructuring specialist appears in the record of parties the run
    engaged, so the engagement follows the disposition the refusal states and is
    not something this run does on every refusal.
depends_on:
  - BO-3800b
