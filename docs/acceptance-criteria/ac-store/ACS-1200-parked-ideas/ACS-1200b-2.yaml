notes: |
  RECOGNITION, NOT SUPPRESSION at the reporting layer. The cheap implementation
  — filter parked trees out of the scan entirely — satisfies "stops showing up
  as a problem" while destroying the visibility that makes parking safe. The
  L0's whole framing is that a parked idea stays VISIBLE in the store and merely
  sits outside the buildable backlog, so the report must show it, in its own
  section, with its reason.

  The separate section is also what keeps ACS-1200d's un-park decision possible
  without borrowing KM-200c's counting remit: it lists the parked trees; it does
  not tally them or age them.

  IT-PO ENRICHMENT (2026-08-14). A delivers_to contract was added: three ACs in
  this tree each add a report state to the same scan (this one, ACS-1200c-4-i,
  ACS-1200d-1-i). Naming the classification as a deliverable here is what stops
  the scan accumulating four independently-written branches whose states can
  overlap.
