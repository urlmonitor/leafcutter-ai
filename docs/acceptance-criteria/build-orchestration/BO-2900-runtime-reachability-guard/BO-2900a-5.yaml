title: "Sequence diagram: from a done claim to a verdict, including the run observation and the exemption branch"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the entry-point condition on done eligibility is in place,
  When a reader consults the architecture documentation for how a done claim is decided,
  Then a sequence diagram shows the ordered interaction from the moment a criterion is
    claimed done through to the verdict,
    And it shows the existing two conditions — a linked proof exists, and it passes —
      before the new one, so the reader sees where the condition was inserted,
    And it shows the step that establishes what the proof reached while it ran, drawn
      as an observation of the executing proof rather than as an inspection of its source,
    And it shows the three terminal outcomes — eligible, refused because the proof did
      not go in the real way, and refused because nothing reaches the code — as
      distinct ends,
    And it shows the recorded exemption as the branch that turns the second refusal
      into an eligible verdict.
