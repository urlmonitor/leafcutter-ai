notes: |
  Gap G4. Backstop for anything end-of-route clearing (BO-4400a) misses: crashed sessions,
  pile-up from before BO-4400a existed, workspaces kept by halted runs whose work was later
  sent by hand. The sweep does not decide anything itself -- the workspace decision comes
  from the landed-work pass (BO-4400g-2), which uses the BO-4100c verdict; "active" from
  BO-1800d, expiry from BO-4400f-1, clearing from BO-4300e. Its own promise is the selection:
  each of the nine workspaces and five scratch items is a distinct case and the wrong
  selection on any one turns a clause red.

  ONE RULE (user decision 2026-11-16, BO-4400g plan-feature gate): the sweep no longer clears
  a workspace just because it holds nothing unsent. It clears exactly what the landed-work
  pass clears: work landed on the main line, or no work of its own and 7 days idle, or work
  pushed but unmerged and 14 days idle. Its kept reasons are the pass's. "pushed-1" and
  "fresh-1" are the cases where the old rule and the pass disagree (the old rule would have
  removed both).

  LEFTOVER-1 (user decision 2026-11-16, ONE RULE owned by the door): the removal of
  "leftover-1", a record-less remnant whose work reached the main line, stays as written. It
  now happens because the landed-work pass hands the leftover to the clearing door, and the
  door clears it under its own rule for a record-less leftover matching its merged line,
  being specified in PR #1414. That rule is not on main yet, so it is deliberately absent from
  depends_on and doc_links. Until it exists, the pass keeps "leftover-1" as
  landing_unconfirmed and this record's first Then cannot pass. Build this record only after
  that rule. The fixture is not reworded to restate the door's matching rule; its test must
  build "leftover-1" so the door's rule matches it.

  Prior art outside the package: the operator's machine-local hourly reclaim timer
  (~/bin/wsl-reclaim). The packaged sweep replaces its workspace/scratch half for every
  install; the machine-local tool is not modified by this record.
