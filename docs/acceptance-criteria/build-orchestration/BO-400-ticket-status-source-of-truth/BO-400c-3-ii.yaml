  - "Error message must name the offending file and the tickets/99_done/ destination, consistent with the existing done-folder prohibition message"
  - "Must define an explicit context signal (env flag or allowlisted invocation) that identifies the finalize-feature archive step running on main"
  - "Must exempt (not block) moves into tickets/99_done/ only when that finalize context signal is present"
  - "Must NOT exempt any 99_done move when the context signal is absent (branches must never archive)"
  - "Must complete within the existing pre-commit hook time budget (<5 seconds)"
