id: BO-300a-5-i
components:
  - build_orchestration
title: "An epic whose work set is not affirmatively confirmed re-read is reported unverified, and pre-existing or removed work raises no false alarm"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a drive producing its completion output,
    And in the first case the completion-time re-check of the epic's set of work
      does not affirmatively confirm that it read that set -- in one shape it
      states outright that the set could not be read, and in another it makes no
      statement either way while still returning a list of work, including a
      plausible-looking list naming only some of the work the drive already knew
      about,
    And in the second case the re-check does affirmatively confirm it read the
      set, and that set is unchanged except that one piece of work was already
      complete before the drive started, and one planned piece has since been
      removed from the epic,
  When the completion output is produced,
  Then in the first case every one of those shapes produces the same outcome: the
    epic is reported as not verified complete, the output names that the set was
    not confirmed read and why, no statement that the epic is complete is
    emitted, and no piece of work absent from the unconfirmed list is named as
    removed on the strength of that list,
    And in the second case nothing is named as discovered after planning,
    And the removed piece is named as no longer present rather than as unbuilt,
    And the piece that was already complete before the drive is not named at all,
  So only an affirmative confirmation that the set was read counts as a verified
    read -- a re-check that never claims it could read the set is treated exactly
    as one that says it could not -- and the check stays quiet when nothing was
    added.
