it_requirements:
- Use the existing KernelService and LangGraph lifecycle, registered host operation, durable interaction ledger, revision checks and cumulative budgets. No second host protocol, direct model client or independent orchestration loop is introduced.
- A single host packet carries all dimensions of one interpretation attempt. A changed clarification answer may require a later attempt; unchanged inputs must not trigger unbounded repetition. The host supplies interpretation, Jev chooses only offered finite options, and System enforces exact contracts.
- Explicit caller answer requirements retain their existing compatible path. The new interpretation route is conditional on the selected authorized knowledge source; unrelated source paths do not silently acquire graph access or a generative dependency.
- Preserve original_question and trusted kernel scope independently of model echoes. Candidate context and IDs cannot grant authority, replace literal user targets or mutate the pinned source. Host acceptance checks happen before accepted ledger effects.
- The catalog-configured and catalog-absent routes consume the same validated needs. Missing supported operations may use the existing separately authorized build path; unsupported data, missing fields or unavailable sources cannot authorize it.
- Preserve exact field meanings and hierarchy levels in the consumer contract. Canonical criteria remain authoritative for acceptance obligations; verification-obligation questions require criteria and authored test_spec as complementary evidence, while explicitly narrower requests remain narrow. Structured unsupported reasons must remain recognizable independently of explanatory wording.
- Bind the complete original single-entity or selected-entities target set before finite query selection as answer_requirements.scope.entity_ids, with the same canonical identities used by the query. Keep it independent from operation parameter names and returned rows; descendant and relationship populations retain their separate population obligations. Missing original targets prevent fulfillment and an exact total, including saved-query and disclosure paths.
- Preserve full literal ADR stems without inventing a shorter prefix. For covered_by, governing_adrs and component_context, keep one original anchor separate from the one supported result entity/document pair; require examples completeness and only the matching existing registered recipe. Component-scoped recipes cannot exceed an explicit trusted component scope.
- A required content field is a bounded level-3 canonical-source excerpt with its exact locator, never a backend property or full-document promise. Unavailable, empty, withheld and truncated excerpts remain distinct. Mixed component-context kinds retain a partial result under the existing kind guard.
- Successful transport, model confidence and nonempty evidence are not fulfillment proof. Required-field and source-completeness failures remain visible alongside useful partial evidence.
- Host instructions and repository catalog distinguish acceptance clauses, authored verification specifications, declared references, test requirements and status meanings. Verification-obligation questions select offered criteria and test_spec together; explicit narrower requests retain their selected fields. No target-specific rule, all-fields default or deterministic post-processing adds semantic obligations to accepted host output.
- Measure interpretation sufficiency and unnecessary field selection independently from retrieval fulfillment of the selected fields. A faithful criteria-only answer can fail a verification-obligation question even when its selected-field assessment is fulfilled. Frozen Oct3 optional-spec gold and the closed Aura baseline retain their original outcomes.
- Required fields are indispensable facts for the requested answer, not optional discovery leads; possible leads remain in rationale and unavailable answer meanings remain unresolved. Reading declared reference values on the original AC does not itself request a relationship traversal. Facts about linked Test records or a related population retain the coverage relationship, the result entity/document kinds, original anchor and requested completeness; no global deletion of references or relationships is permitted.
- Record test provenance and denominator honestly. Offline controlled host/provider responses establish wiring and boundary behavior, not live LLM/Jev quality, Aura freshness, production query admission or remote trace ingestion.
test_required: true
test_rationale: The change crosses the public kernel, host wait/resume, semantic selection and neutral retrieval boundaries. Exercise the real producers and consumers with controlled external judgments and actual source artifacts, retaining changed-input and failure controls. Separate live model-quality evaluation remains KM-500a-4.
test_spec:
- name: test_public_question_reaches_host_before_source_read
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  surface_invoked: KernelService.start_run and KernelService.resume_run for a research question
  description: Start a question without an operation through the public entry with and without a catalog; inspect the real host packet and prove no source read occurs before accepted interpretation.
  covers: [KM-500e-1-i]
  requires_db: false
  must_catch:
  - The configured catalog bypasses needs interpretation or causes an extra interpretation per evidence category.
- name: test_host_needs_drives_exact_criteria_through_public_entry
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: seam
  description: Resume the real host wait with a needs proposal for a literal AC, pass it through finite selection and actual retrieval, and assert canonical criteria and source citations; repeat with a different AC identity and distinguish required criteria from test_spec.
  covers: [KM-500e-1-i, KM-500e-2]
  requires_db: false
  must_catch:
  - Ignoring the accepted needs and deriving entity IDs from component scope.
  - Returning test_spec alone as fulfilled canonical acceptance obligations.
- name: test_public_population_preserves_levels_root_and_work_status
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Carry an explicit all-L2/L3-descendants question through the public producer and consumer and preserve hierarchy levels, root-only exclusion and work_status; distinguish lifecycle status and terminal leaves.
  covers: [KM-500e-1-i, KM-500e-1]
  requires_db: false
  must_catch:
  - Dropping L2/L3 or using lifecycle status or terminal-leaf population instead of the user's obligations.
- name: test_public_ambiguous_needs_clarifies_and_resumes_original_question
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: real_artifact
  description: Use the real persisted host/human continuation artifacts to resolve missing meaning and resume the original question with the unchanged source and retained prior context; do not restart a different research question.
  covers: [KM-500e-1-i]
  requires_db: false
  must_catch:
  - Treating unresolved needs as a complete plan or replacing the original question with the clarification answer.
- name: test_invalid_host_scope_and_changed_question_rejected
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: boundary
  description: Attempt host outputs with changed question or source and compare with the valid control; reject before accepted ledger effects or source access and retain the original wait.
  covers: [KM-500e-1-i]
  requires_db: false
  must_catch:
  - Trusting model-echoed scope or context as authority for different repository access.
- name: test_unavailable_or_stale_source_never_becomes_complete_answer
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: failure
  description: Through the public question path preserve unsupported meaning, unavailable or stale source states and useful partial findings without declaring completion, writing a graph or activating a query.
  covers: [KM-500e-1-i, KM-500e-4]
  requires_db: false
  must_catch:
  - Converting source failure or unsupported meaning into a query-build authorization or a successful answer.
- name: test_partial_source_cannot_be_upgraded_by_sufficient_jev
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: Return source evidence missing a required canonical field beside a high-confidence sufficiency judgment; retain the missing obligation and partial status, with a fully evidenced control.
  covers: [KM-500e-1-i]
  requires_db: false
  must_catch:
  - Letting a confident Jev answer override deterministic field or completeness failures.
- name: test_selected_entities_cannot_complete_after_selector_narrows_original_targets
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: seam
  description: Exercise both public catalog configurations with two original AC targets and a selector favoring one. Preserve both obligations through retrieval and assessment; a subset cannot be complete.
  covers: [KM-500e-1-i]
  requires_db: false
  must_catch:
  - Narrowing query targets silently rewrites the original requested set.
- name: test_selected_entities_complete_control_returns_both_canonical_criteria
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: real_artifact
  description: Return both requested ACs through the public entry and independently compare both cited criteria with their pinned Git source; complete evidence may fulfill both original obligations.
  covers: [KM-500e-1-i]
  requires_db: false
  must_catch:
  - The guard blocks every selected-entities answer or accepts only one source.
- name: test_missing_selected_entity_stays_unmet_after_disclosure_of_present_entity
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: failure
  description: Compare one present and one absent requested AC with both catalog settings. Retain the present evidence and both original IDs, with a partial assessment and unknown exact total.
  covers: [KM-500e-1-i]
  requires_db: false
  must_catch:
  - Hydration replaces a missing requested identity with the evidence that happened to be returned.
- name: test_saved_query_assesses_original_ids_independently_of_custom_argument_name
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: Run an admitted query whose seed parameter has a custom name, paired with complete and missing-target source results. The neutral assessment uses the original target set and preserves the saved catalog.
  covers: [KM-500e-1-i]
  requires_db: false
  must_catch:
  - Only builtin entity_ids parameters trigger complete-set coverage checks.
- name: test_incompatible_single_seed_offer_retains_paid_selector_usage
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: boundary
  description: Reject an operation that cannot bind the two original targets while retaining the actual paid selector usage and returning no invented evidence.
  covers: [KM-500e-1-i]
  requires_db: false
  must_catch:
  - Refusing an incompatible operation drops the already incurred model usage.
- name: test_prefixed_canonical_targets_match_original_scope_and_query_seeds
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: boundary
  description: Compare native and already-prefixed Ticket, Flow and Decision IDs. Answer obligations and query seeds use the same canonical identities without changing the literal user question.
  covers: [KM-500e-1-i]
  requires_db: false
  must_catch:
  - Canonical prefix handling diverges between original obligations and executed query seeds.
- name: test_full_adr_stem_is_offered_without_an_ungrounded_short_prefix
  target_dir: tests/kernel/retrieval/
  framework: pytest
  type: unit
  angle: discrimination
  description: Preserve a literal ADR filename stem with and without a known-ID candidate, without adding an ungrounded short prefix.
  must_catch:
  - A numeric ADR prefix is added beside the full literal and causes an invented target obligation.
- name: test_relation_requests_cannot_narrow_or_claim_complete_populations
  target_dir: tests/kernel/entity_context/
  framework: pytest
  type: integration
  angle: failure
  description: Reject multiple anchors, incompatible result kinds and exhaustive relationship set or count requests; related examples retain a separate original anchor.
  must_catch:
  - A bounded relationship sample is upgraded to an exhaustive population or silently drops an anchor.
- name: test_content_requires_actual_bounded_source
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: Compare actual pinned source content with unavailable, empty, whitespace, withheld and truncated controls; a graph content property never satisfies the requested excerpt.
  must_catch:
  - A summary, graph property or incomplete excerpt is reported as fulfilled canonical content.
- name: test_public_verification_fields_reach_pinned_source
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: seam
  description: Through actual public run/resume and both catalog modes, carry accepted criteria and test_spec for two different literal ACs into retrieval; compare both disclosed fields and separate locators with their immutable Git sources. Controlled host output proves wiring, not semantic quality.
  covers: [KM-500e-1-i, KM-500e-2]
  requires_db: false
  must_catch:
  - Dropping the authored test specification after acceptance or reusing another target's source values.
- name: test_public_minimal_field_selection_is_not_expanded
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: Resume independent criteria-only, specification-only and work-status-only needs through both catalog modes; retain exactly the selected fact obligations and their attributable source values without an unconditional verification-field expansion.
  covers: [KM-500e-1-i]
  requires_db: false
  must_catch:
  - Adding criteria or test_spec to every accepted AC interpretation regardless of the original narrower question.
notes: This child specifies the approved needs-to-selector integration seam. It does not complete the wider KM-500e-1 parent, the multi-method strategy design, query-agent delivery, automatic learning or real-provider quality. Controlled relation ports establish host and query transport only; real mixed-kind component context, exhaustive relation populations and full documents remain unproved; canonical Aura publication is recorded separately from answer quality. Historical Oct3 8/12 host semantics and 7/12 Jev semantics remain frozen; new proof must identify the actually tested source and mechanism. The closed Aura batch at canonical source 2a8ebc87ce937a0a2fec65ab26220f79a72e4859 matched chosen criteria in 3/3 positives but omitted authored test_spec in all three interpretations, yielding 0/3 whole-question answers and a passing stale control. The first closed twelve-case precision batch passed 10/12; complementary-field positives passed, while redundant declaration/relationship selection and an unnecessary investigative field remained. The closed revision2 batch passed 16/16 fresh host interpretations (the unchanged twelve cases plus four independently frozen holdouts), including both independently reviewed execution-gap explanations; it used zero Jev calls, zero graph calls and no retries. Evidence is reports/retrieval-needs-precision-v2-2026-10-09/stage1b/review.html with review.json, summary.json and closure-integrity.json alongside it. Model identity and token counts are unknown. The new execution-gap holdout is stricter than historical IP11, whose original allowance remains unchanged. The authorized once-only live batch at runtime 44406d923e2a0e2f40079a317135d0736534c654 and source 2a8ebc87ce937a0a2fec65ab26220f79a72e4859 is closed at reports/retrieval-aura-2026-10-09/runs/precision-v2-44406d9/review.html. All 4/4 interpretations retained both fields; 2/3 positive answers completed with exact source fields and citations, and 1/1 actual stale control passed, using 6 Jev calls and 4 accepted host results without retries. A02 preserved the correct interpretation and answer requirements but selected get_entities with probability 0.71 below unchanged 0.80 (confidence 0.64 above 0.50), so it returned partial without retrieval or evidence while retaining paid usage. This accepts only the narrow interpretation repair; query-selection reliability moves to queued issue02 and the original whole-question exit remains unmet. One paired observation does not establish catalog causation. Historical 10/12 and live 0/3 results remain unchanged; full-document, exhaustive-population, CI-execution and general retrieval quality remain unproved, and this child stays approved/in_progress.
