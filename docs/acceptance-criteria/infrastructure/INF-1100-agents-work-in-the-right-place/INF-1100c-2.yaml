id: INF-1100c-2
title: "An automated test guards compiled prompts against unresolved work-location placeholders"
component: infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given the set of compiled agent instructions produced from templates,
  When the work-location resolution test runs over those compiled instructions,
  Then the test passes only when every work-location path is the resolved value
    from configuration,
  And the test fails if any compiled instruction still contains a work-location
    placeholder token or an empty work-location path,
  And the test fails if a compiled instruction contains a work-location path that
    does not match the configured value.
depends_on:
  - INF-1100c
doc_links:
  - path: scripts/build_placeholder_detection.py
    relationship: describes
    status: exists
  - path: scripts/template_compiler.py
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Surface is an automated test under the configured test_root (tests/ per skills_config) plus, where reuse applies, the existing scan_for_placeholders()/format_placeholder_report() mechanism in scripts/build_placeholder_detection.py that build.py already runs post-build."
  - "The test must FAIL on three distinct conditions: (a) a remaining work-location placeholder token, (b) an empty work-location path, (c) a compiled path that does not equal the configured value — and PASS only when every compiled work-location path equals the config-resolved value."
  - "The guard must be a regression backstop: a future change that reintroduces a raw or empty path must fail this test, satisfying the 'proven by tests' part of INF-1100c."
  - "This guarding test is itself subject to the test-placement rule — it must live under the configured test_root (tests/), not unit_tests/ (note: this repo currently has both tests/ and unit_tests/; place the new test under tests/)."
  - "Must complete in <2s for the full compiled-prompt set; must handle a missing/empty compiled-output directory gracefully per the error handling policy."
