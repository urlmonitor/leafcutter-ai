notes: |
  WHY THIS L0 EXISTS. UXP-490 held nine L1 children against a 3-7 rule, and it never
  tripped check_ac_limits: all nine use the numeric-sibling id form (UXP-491, UXP-590,
  ...), and derive_parent_id returns None for every one of them, so the hook counted
  zero children under UXP-490 and had nothing to flag. The overcrowding was real; only
  the alarm was missing.

  THE SPLIT AXIS. UXP-490's own promise has two halves that had silently merged. One
  half is a person looking at product truth and believing what they see — a flow drawn
  in the Atlas, a fork readable as a decision, a step coloured by real work_status, a
  design that says which criteria it shows. The other half is the machinery that makes
  those artifacts exist and stay correct — the store's shape, the classifier that
  decides which artifacts a request warrants, the authoring agents that draft them, and
  the single writer that generates the flow-to-AC links and fails CI when they drift.
  A goal that owns both cannot be finished, because "I can see it" and "it wrote itself
  correctly" are answered by different work with different evidence.

  UXP-590 STAYS ON THE PRODUCTION SIDE, NOT UNDER UXP-700. This was considered and
  rejected. UXP-590 is the internal-consistency axis: the derived links inside the
  product-truth store agree with the AC store they are computed from. UXP-700c is the
  correspondence-with-code axis: the record agrees with the repository it describes.
  They are different claims with different failure modes, and merging them was ruled
  out on review. UXP-590 belongs with the pipeline that writes the links.

  MECHANICAL LIMIT, STATED PLAINLY. Because no ids were renamed, check_ac_limits still
  derives no parent for UXP-493/590/592/594 and therefore still counts zero children
  under BOTH UXP-800 and UXP-490. This split restores the 3-7 discipline in the store's
  own recorded edges (depends_on and covered_by); it does not and cannot make the hook
  see them. Making the hook see them requires renaming every child to the canonical
  form (UXP-490a, UXP-490b, ...), which would break citations in
  docs/product-truth/index.json by_ac, flow files' implements arrays, ADRs and agent
  cards. That trade was judged not worth taking for an advisory count.
