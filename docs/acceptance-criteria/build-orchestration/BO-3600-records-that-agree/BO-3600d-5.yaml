notes: |
  Satisfies the reference-doc half of BO-3600d's documentation_triggers.

  The entry is aimed at the person holding a conflict and deciding what to do, which
  is a governance act: narrowing a requirement changes what the project promises,
  and doing it without knowing that is how a silent relaxation happens. The "what
  does not change" clause is as important as the rest — BO-3600b-3 keeps the two
  acts separate, and a reader who does not know that will expect a retirement to
  also settle the requirement.

  The fourth scenario is the anti-drift clause in both directions, and it is the one
  that keeps this entry from becoming another record that can quietly disagree with
  the system it describes — which would be an unusually poor outcome for this
  particular tree.

  assigned_agent deliberately unset — the reference surface belongs to the IT
  Product Owner's assignment pass.
