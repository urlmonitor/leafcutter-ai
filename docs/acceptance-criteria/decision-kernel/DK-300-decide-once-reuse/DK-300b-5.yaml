criteria: |
  Given the forming flow's human decision points, DK-300b-1 to DK-300b-3,
  When the state diagram is drawn,
  Then it shows the states proposed, approved, ranked and resolved, plus an unresolved end state
    for no answer or a cancel,
  And every transition is labelled with the action that causes it: your approval (all, or a
    revised set), the assessment, your choice, the re-rank loop from ranked back to assessment when
    you add an option or answer in your own words, and the exit when you never answer or cancel,
  And no transition reaches resolved without your choice.
