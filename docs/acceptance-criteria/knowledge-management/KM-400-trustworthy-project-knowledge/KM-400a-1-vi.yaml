id: KM-400a-1-vi
title: Ticket metadata retains execution declarations without inventing completion evidence
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
priority: medium
work_status: done
parent: KM-400a-1
criteria: |
  Given a Ticket declares title, status, components, created and depends_on
  And it may declare change_target, risk_surface, requires_diagram, requires_adr, agents, ac_traceability and test_requirements
  When its native fields are exposed as graph metadata from the selected source revision
  Then every authored frontmatter field remains available together with the complete body as separately identified source content
  And nested agent status, AC traceability and test declarations preserve their own fields and associations
  And historical scalar or list alternatives such as ac_coverage, ac_traceability and test_constraints remain in their authored shapes
  And true, false, explicit null and absence for requires_diagram or requires_adr remain distinguishable
  And a historical status such as open is not silently changed to a current lifecycle value
  And test declarations, planned files_touched, signoff text and status done do not manufacture passing-test or actual-change evidence
  And tickets with the same filename in different locations remain distinct by their complete canonical source identities

  Given an epic master plan, a child ticket inside its epic and a README with ticket-like frontmatter
  When ticket records are selected
  Then an epic remains a Ticket subtype with attributable subtype information
  And the child does not become an epic solely because of its containing folder
  And the README and generic notes are not admitted as Ticket records
  And malformed admitted ticket frontmatter is reported explicitly rather than replaced with defaults
