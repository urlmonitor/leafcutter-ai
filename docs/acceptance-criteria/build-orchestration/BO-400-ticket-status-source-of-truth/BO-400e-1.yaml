notes: |
  Behaviour (a) of the four the parent BO-400e names in its DECOMPOSITION GUIDANCE.

  THE OVERTURNED FRAMING IS THE ATTRACTIVE ONE -- DO NOT REINSTATE IT. An earlier pass
  framed this defect as "the completion write must honour the exclusion list it was
  handed", reasoning that the driver's own subtraction of a deferred phase is already
  correct. The parent overturns that explicitly. A writer that accepts the caller's
  exclusion list has stopped checking the caller, and catching a run that wrongly
  excluded a step is the only thing the writer was ever for. The list comes FROM THE
  RECORD.

  WHY THE THREE ATTEMPTS ARE THREE AND NOT ONE. Each closes a different escape:
    - the eight-item list closes "intersect the caller's list with the record's";
    - the ten-item list closes "union them";
    - the no-list attempt closes "fall back to the record only when no list is offered".
  An implementation that consults the caller's list at all fails at least one of the
  three. An implementation that ignores it passes all three.

  VERIFY BY EXECUTION, NEVER BY GREP. The phase-list code, the prompt and the parity
  check are all already present in the source, so a test that searches for them passes on
  the broken driver. Each attempt must be driven through the real workflow via
  unit_tests/prompt_assembly/harness_build_ticket_guard.mjs and must assert on what the
  run wrote to the ticket record.

  BOTH TWINS IN ONE CHANGE, per BO-400a-2-ii's standing constraint. build-feature.js and
  build-ticket.js declare each other twins in their own headers; landing this in one
  produces a store in which epic drives and single-ticket drives disagree about what
  "finished" means.

  PRIORITY. Inherited from the parent's medium, which the parent labels a
  validator-forced placeholder; the PO recommends high for the family.
