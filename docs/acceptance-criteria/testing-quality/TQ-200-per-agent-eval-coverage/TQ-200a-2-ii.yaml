title: "ARTIFACT output is scored by deterministic assertions plus an LLM-judge rubric"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given an agent whose output is a structured artifact — mock-data-author,
    flow-author, or an AC-authoring agent (business-analyst / product-owner / it-po),
  When its eval rows are scored,
  Then the produced artifact is first checked by deterministic assertions:
    it is schema-valid,
    every entity it names is a member of the entity registry,
    an existing artifact was EXTENDED in place rather than duplicated,
    every referenced record actually exists,
    every step and every branch carries an acceptance_scenario,
    and any ACs it produces are testable Gherkin,
  And the artifact is then scored by an LLM-judge rubric for faithfulness and
    quality,
  And a row passes only when the deterministic assertions all hold and the judge
    score meets the rubric threshold.
