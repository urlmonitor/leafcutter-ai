notes: |
  Directly enforces the L1's closing constraint: this is a MEASUREMENT L1, not a
  governance L1. If capturing the override adds friction, operators stop declaring
  overrides and the last signal is lost. The negative clauses are the point of this AC —
  it is written so that a reviewer can reject any implementation that turns override
  recording into an approval gate.
