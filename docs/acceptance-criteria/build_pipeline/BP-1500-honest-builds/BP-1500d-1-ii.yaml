id: BP-1500d-1-ii
components:
  - build_pipeline
title: "No entry in the record points outside the project the record describes -- an account is untruthful whether it could not be written or was written wrong"
component: build-pipeline
level: L3
status: active
req_status: draft
readiness: draft
priority: high
roadmap_phase: phase_1
work_status: todo
criteria: |
  Given a real build aimed at a project outside the producing package's own parent
    folder -- the venue every child of this feature is proved in -- and given that
    build is configured to place one of the files it manages at a destination that
    is written as a position inside that project but that steps back out of it
    before arriving, so the file lands outside the project while its position still
    begins inside it,
  When the build runs to completion and the record it left on disk in that project
    is read where it sits,
  Then the build has not recorded that file as though it sat inside the project:
    either the build reported failure and produced no account of an install it
    cannot describe truthfully, or the record it produced carries no entry for that
    file at all,
  And, whichever of those two the build does, no entry anywhere in that record names
    a position which -- followed from the project's own root, with every step
    including a step back out of it taken as written -- arrives anywhere other than
    inside that same project,
  And that verdict is reached by following each position to the place it actually
    arrives at and asking whether THAT place lies inside the project, never by
    asking only whether something exists at the end of it: a position that steps out
    of the project and lands on a real file elsewhere on the machine is exactly the
    entry this behaviour exists to reject, and a reading that accepts it because
    something is there has distinguished nothing,
  And the reading is demonstrated to FAIL, before it may be accepted as passing, on a
    record deliberately given one entry whose position steps back out of the project
    -- which must be reported as an entry that leaves the project it belongs to,
    naming that entry and that project, rather than being accepted, silently
    dropped, or reported as an absence,
  And the same reading returns a clean result on the same project immediately before
    and immediately after that deliberate breakage, so the red is attributable to the
    breakage and not to a record that was already wrong,
  And in each of those clean runs the reading reports the set of entries it actually
    examined, and that set is not empty, so a reading that examined nothing cannot be
    received as a reading that found nothing,
  And a build asked to place every file it manages inside the project it is aimed at
    still reports success and still writes a record naming those files, so this
    behaviour is not satisfied by a build that refuses destinations it merely
    dislikes,
  And every verdict is taken from a real build run through the command line a consumer
    runs, into a real project on disk, and from the bytes of the record that build
    left there, never from reading the build's own source for the presence of a
    check on where a position leads.
