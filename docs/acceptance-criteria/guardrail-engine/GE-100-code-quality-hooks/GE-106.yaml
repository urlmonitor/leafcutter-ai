it_requirements: "In check_ac_limits.py _build_children_map, attribute each node to exactly one parent: the parent derived from its hierarchical AC id via derive_parent_id() (scripts/ac_store/ac_parent_id.py), rather than appending the node to every same-tier entry in its depends_on. depends_on is documented (docs/reference/ac-schema.md) as multi-purpose (parent edge AND non-parent cross-links / pattern composition); the structural parent is defined by id derivation. The fix touches the canonical template copy; rebuild via build.py to sync the deployed/built copy at templates/commit-guardian/hooks/check_ac_limits.py. Add a regression test where a node carries both its id-derived parent and a sibling cross-link in depends_on and assert the sibling's child count is not inflated. Symptom fix scope only; the duplicate-hook-copy layout is pre-existing and out of scope."
