notes: |
  BOTH DIRECTIONS, per AR-400d's notes. The third clause ("marking a shipped
  ability as project-supplied is a fault") is a BA inference from "never
  confused in either direction" -- it is the only way the marking could
  silently override a package ability. Flagged in the BA report in case the
  user wants a project to be able to shadow a package ability deliberately.

  RESOLVED 2026-10-12 (user decision 5): the user DOES want deliberate
  shadowing. The third clause now states the override; the "never confused in
  either direction" rule survives only as the first two clauses (an UNMARKED
  grant is never rescued by a project copy). See amended_by.
