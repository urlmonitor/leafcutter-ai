notes: |
  GAP 3 OF THE 2026-08-17 FAST-LANE PASS, PART ONE OF TWO. Its twin is BO-2400e-4
  (recording progress must not rewrite the record). Both are properties of the same
  single write, which is why they sit together under BO-2400e; they are separate ACs
  because one is about survival and the other about noise, and an implementation can
  easily deliver one while worsening the other.

  VERIFIED EVIDENCE (2026-08-17, do not re-investigate).
  scripts/build_orchestration/fast_lane.py:98-125, function _update_ac_work_status:

      with yaml_path.open("w", encoding="utf-8") as fh:
          yaml.safe_dump(data, fh, allow_unicode=True)

  Opening for writing TRUNCATES AT OPEN. An interrupted or failed run therefore leaves
  a zero-byte requirement record behind. The function is called three times per
  requirement per run — line 203 (in_progress), line 261 (todo), line 376 (done).

  WHY THIS IS NOT A SMALL BUG. The YAML records under docs/acceptance-criteria/ are the
  source of truth for the entire build system: what the work is, what depends on what,
  what has been done. They are also, in this workspace, frequently untracked while being
  authored (see the standing "no destructive one-liners" rule in CLAUDE.md, which exists
  because a truncated store file in an untracked folder is unrecoverable). A build tool
  whose ordinary progress-recording can empty one of them is one crash away from
  destroying an author's work, and the most dangerous moment is exactly the abort path
  BO-2400f-10 uses, which runs when things are already going wrong.

  BOUNDARY WITH THE BO-2400f LEAVES. BO-2400f-7 (claim at start), BO-2400f-9
  (coverage-gated mark-done at finish) and BO-2400f-10 (release on failure) all own
  WHEN and WHY the record changes. This AC owns whether the change is safe to make at
  all. They are the callers; this is the property their shared write must have. Do not
  fold this into any of them, and do not restate their protocols here — but note that
  all three inherit whatever is built for this AC, which is why the entry-point test
  drives the real surface rather than a helper.

  STATED AS BEHAVIOUR ON PURPOSE. The criteria say the record survives, is never empty,
  and is never observed half-written. They do not name a technique. Several designs
  satisfy them; choosing between them is the IT PO's call, and writing one into the
  requirement would make the AC pass or fail on how it was built rather than on whether
  the work record survives.

  TESTABILITY WARNING. Do not accept a test that patches the filesystem. The entire
  question is what is left on disk after a failure, and a filesystem double will happily
  model the atomic replacement the code does not actually perform — the same
  synthetic-fixture bias recorded in CLAUDE.md's "Real-artifact behavioral spot-check"
  section, where hand-authored fixtures reproduced the bug-hiding bias and a hook that
  was a complete no-op passed every test.

  IT-PO ENRICHMENT NOTE (2026-08-17). Assigned python-coder: the entire surface is
  scripts/build_orchestration/fast_lane.py, so this AC has no mixed-surface problem —
  unlike its BO-2400g siblings. it_requirements uses the package-surface OBJECT form
  because config/ac_store_schema.json's root if/then makes it mandatory for
  assigned_agent: python-coder + component: build-orchestration; a list of strings would
  fail validation. n_location_rule is "all" rather than "1" because the hazard is not a
  single registration point but the three existing call sites, one of which will be left
  behind. declares_side_effect is true: the observable IS the requirement record on disk.
  Note the standing irony recorded in BO-2400g's notes — the fast lane does not dispatch
  user-surface-smoker at all today, so setting this flag correctly records the durable
  side-effect but does NOT produce smoker routing on this lane; it will route only if and
  when a ticket is generated for this AC through generate_ticket_from_ac.py.
  Deployment: a new helper must go in scripts/build_orchestration/, which build.py
  deploys wholesale, so no deploy_map edit is needed — but the deployed-angle test was
  added because that is only true for that directory.
