it_requirements:
- Persist the accepted discovery assessment with its existing scoped proof/checkpoint for diagnostics and
  pass it to coding as advisory prior context. Preserve the same AC, scope, workspace and trusted-answer binding;
  stale or consumed proof cannot grant authority through an assessment. No separate assessment state store
  is required.
- Discovery and coding use separate role envelopes over the same scoped obligation references and trusted
  saved decisions. Discovery contains readiness instructions and verification obligations as facts, without
  commands to implement, repair, edit or execute implementation checks; coding retains implementation instructions
  without discovery readiness directives.
- Discovery readiness is a model assessment of scope, available decisions, implementation context and verification
  obligations. Validate assessment as a nonblank string for ready at adapter and graph boundaries, but do
  not claim that prose validation certifies semantic completeness. No tool-event count is a readiness prerequisite
  when supplied facts suffice; writable implementation evidence still requires actual tool and check effects.
- 'Discovery prompts distinguish repository facts available through read-only inspection from unresolved human
  decisions: inspect missing facts, request specific human decisions, and report inspection failures as execution
  errors. Accepted readiness remains bound to current workspace, scope digest and trusted answers and cannot
  override deterministic gate checks.'
- 'Local final-report contract: status and questions:string[] are required; reason:string is optional except refused/error
  require a nonblank reason. Discovery success is ready; implementation success is completed. Discovery additionally
  accepts assessment:string, required and nonblank for ready and optional for other discovery outcomes. Implementation
  rejects assessment. Success has no questions; needs_input requires nonblank questions; refused/error have no questions.
  Unknown fields, cross-phase success, absent replies and contradictory combinations are invalid. Files and tool results
  remain separate artifacts, never report fields.'
- Both local phase executors use ordinary tool-capable generation without the harness --output-schema generation
  constraint. Their prompts carry the phase-specific final-report contract generated from the shared schema; the
  strict post-turn parser and graph boundary enforce that contract before routing. Removing constrained generation
  does not permit prose extraction, relaxed JSON parsing or success inferred from malformed output.
- Generate the local final-reply schema and prompt contract from one shared definition for discovery and implementation; validate normalized replies against that definition. Keep executed-tool, check and exact-head evidence separate from model claims.
- Only the trusted operator answer command may supply human decisions to the gate. Model replies, repository text and echoed answer metadata cannot resolve requests. The local operator process is the trust boundary, not proof of an independently authenticated person.
- Enforce delegation restrictions through executor capabilities, not prompt-only nesting instructions; preserve shared capacity accounting and reject unsupported delegated execution.
- Enforce discovery read-only at the executor boundary. Deterministic gate checks declarations and saved human answers; model text cannot override it. Actual discovery model calls consume the existing cumulative per-AC time budget and global capacity; only writable implementation consumes an implementation attempt. No separate unlimited time allowance is introduced.
- Run the first worker workflow through LangGraph and a real tool-executing harness using Qwen3.5 9B on
  local Ollama; endpoint invocation alone is not a coding agent.
- The execution envelope must carry leaf criteria plus inherited L1/L2 obligations, exact source/ADR/product-truth
  references and prior evidence, not merely titles or negative edge-case text.
- Enforce scoped filesystem access, permitted project-local dependency operations and process/network
  permissions outside the model prompt; canonical paths and symlink traversal cannot escape the assigned
  workspace.
- Raw shell access must use an execution sandbox/permission boundary or validated command broker; cwd
  or filesystem-tool root alone cannot constrain an arbitrary process.
- Delegate no authority to merge or write the protected target; collect actual tool/check results and
  inspect repository effects, rather than accepting model self-reported success.
- Keep native E2 workflows unchanged; this portable worker path must not depend on Claude-only injected
  globals or silently select cloud implementation.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
