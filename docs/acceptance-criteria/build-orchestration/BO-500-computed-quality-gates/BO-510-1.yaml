req_status: active
work_status: todo
criteria: |
  Given the agent_registry.json file contains entries for all agents in the system,
  When the registry schema is validated,
  Then every agent entry contains a "produces" field
  And the "produces" field value is one of the defined enum:
    production_code, documentation, configuration, prompt,
    review_verdict, orchestration, test_artifact, analysis
  And the enum is documented in the agent_registry.schema.json file
  And agents with role "coding" have produces: production_code
  And agents with role "documentation" have produces: documentation
  And agents with role "review" have produces: review_verdict
  And agents with role "orchestration" have produces: orchestration
  And agents with role "quality" have produces: test_artifact
  And agents with role "analysis" have produces: analysis
