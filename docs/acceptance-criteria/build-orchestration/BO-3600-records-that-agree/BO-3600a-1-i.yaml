notes: |
  ABSENT EVIDENCE IS NOT AGREEMENT — binding across this tree, and this is the
  record that states it for the detection half. A check whose failure mode is
  reporting "no conflicts" is worse than no check, because it converts an unknown
  into a reassurance.

  The third scenario is the strongest form and the one worth building first: a
  reconciliation that cannot read one side of the pair must fail loudly. BO-3600e-2
  carries the same rule at the whole-store scale; this record carries it per pairing.

  Note this is the reconciliation being unable to DECIDE, which is different from
  the fault entry pointing at something that no longer exists — that is BO-3600c,
  and a reference that cannot be resolved is reported by both, from different ends.
