    relationship: specified-by
    status: exists
assigned_agent: frontend-coder
estimated_complexity: S
it_requirements: |
  A NEXT_PUBLIC_LEAFCUTTER_MOCK flag (client-readable) drives a "mock mode" badge
  rendered in the app chrome (leafcutter-web/app/layout.tsx or the shared header/nav
  component). The badge is presentation only; it must NOT be the authority for whether
  mock data is served — that decision is made by the seam per UXP-553 (env default +
  runtime override) / UXP-553-1 (production lock). The badge reflects the effective
  mock decision so a reviewer always knows when the data is fixtures.
