id: TQ-400f-1-i
components:
  - testing_quality
  - ac_store
title: "Children covered by passing tests does not excuse children that are not finished — the two verdicts move independently"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a finished parent record that the existing proof-of-done check already
    treats as satisfied because each of its children is covered by a test that
    passes, while one of those children is itself still unfinished work,
  When the whole-store honesty sweep evaluates that parent,
  Then the parent still receives the "has unfinished work beneath it" verdict and
    is demoted on it,
  And the satisfied test-coverage verdict for that same parent is still reported,
    alongside the new one rather than in place of it, so neither outcome hides the
    other,
  And a finished parent all of whose children are finished but one of whose
    children has no passing test receives the test-coverage verdict alone and is
    NOT given the "has unfinished work beneath it" verdict,
  And in a single run over one store containing both parents, the two receive
    different outcomes, so the sweep is shown to be answering two independent
    questions rather than one question twice.
depends_on:
  - TQ-400f-1
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-2500-mechanical-done-proof/BO-2500a-6.yaml
    relationship: related
    status: exists
    relevance: >-
      THE NEIGHBOUR THIS AC IS THE CONTROL FOR. It is already built and marked
      finished, and it says a finished composite derives its proof from its
      children being COVERED BY PASSING TESTS. It says nothing about whether those
      children are finished work, so a parent can satisfy it completely while
      sitting above unfinished children. Read it to see exactly what is already
      guaranteed; do not restate it and do not treat it as a duplicate of this tree.
  - path: scripts/ac_store/done_proof.py
    relationship: implements
    status: exists
    relevance: >-
      Where the composite exemption of BO-2500a-6 lives today. The risk this AC
      guards is that the new child-status question gets folded into that existing
      exemption branch, at which point a parent that satisfies the coverage check
      is never asked the second question at all.
  - path: docs/testing/test-angles.md
    relationship: describes
    status: exists
    relevance: >-
      The seam angle. Two verdicts about one record collapsing into one is the
      failure mode here, and it is only observable by constructing two parents that
      must receive different outcomes in the same run.
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    THE CHILD-STATUS QUESTION MUST NOT SIT INSIDE THE BO-2500a-6 COMPOSITE-EXEMPTION
    BRANCH in scripts/ac_store/done_proof.py. Placed there it runs only for
    composites that FAILED the coverage check — which is none of the twenty parents
    measured at 439b9076f, because all of them pass it. That single placement choice
    is the difference between this tree changing the store and changing nothing.
  - >-
    A RECORD MUST BE ABLE TO CARRY TWO OUTCOMES FROM ONE RUN. The verdict shape the
    oracle returns and TQ-400a-4's inventory serializes must therefore be per-axis
    rather than one scalar. A scalar verdict field forces one outcome to overwrite
    the other, which is the collapse this AC exists to prevent, and it cannot be
    retrofitted once four consumers read the field.
  - >-
    THE TWO AXES MUST BE COMPUTED FROM INDEPENDENT INPUTS: the coverage axis from the
    covers-tag scan (_scan_test_root_for_covers_tags), the descendant axis from
    TQ-400f-1's child index. Neither may short-circuit the other in either direction
    — not "coverage satisfied, skip the descendant check", and not "descendants
    unfinished, skip the coverage check".
  - >-
    BO-2500a-6 IS work_status: done AND MUST NOT REGRESS. A done composite whose
    children are covered by passing tests must still satisfy the coverage axis with no
    direct test of its own. This AC adds an axis; it does not amend BO-2500a-6, and
    unit_tests/ac_store/test_done_proof_composite.py must still pass unchanged in the
    same build.
  - >-
    BOTH OUTCOMES MUST APPEAR SEPARATELY IN THE REPORT AND THE INVENTORY. Folding the
    descendant outcome into the coverage cause string is not sufficient: TQ-400b-1's
    and TQ-400f-2's demotion population filters select on the outcome value, not on
    prose, so an outcome that exists only inside a sentence is an outcome nothing acts
    on.
  - >-
    Must handle errors gracefully per the project error handling policy: a failure
    computing one axis must be reported for that axis and must not silently produce a
    satisfied verdict on the other.
delivers_to:
  - agent: python-coder
    ac_id: TQ-400f-2
    contract: >-
      The two-axis verdict for a single record, so the demotion writer can select
      records carrying the descendant outcome without consulting or being blocked by
      their coverage outcome.
expects_from:
  - ac_id: TQ-400f-1
    contract: >-
      The descendant index and the has-unfinished-descendants outcome, delivered as a
      value that is independent of the coverage verdict for the same record.
  - ac_id: BO-2500a-6
    contract: >-
      The already-built composite coverage exemption — a done composite is satisfied
      on the coverage axis when its children are covered by passing tests, with no
      direct test of its own. Consumed as a branch to sit BESIDE, never inside, and
      never to modify. BO-2500a-6 says nothing about whether those children are
      finished work, and that silence is the whole gap this AC closes.
