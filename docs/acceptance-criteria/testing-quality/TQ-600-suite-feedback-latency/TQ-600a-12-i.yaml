assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - >-
    THE CONFIGURATION CONDITION IS THE SUBTLE ONE AND THE REASON THIS RECORD EXISTS.
    An absent seed fails loudly on its own. A seed that is complete but was built
    under different settings produces a tree that passes every structural check and
    is wrong in content. Compare a fingerprint of the configuration that produced the
    seed against the configuration this run would use; record the fingerprint
    alongside the seed when it is produced, so the comparison has something to read.
  - >-
    REUSE SharedReferenceLayoutError. A new exception type would escape the handlers
    every existing caller already has, converting a clear refusal into an unhandled
    traceback in an unrelated test.
  - >-
    THREE SEPARATE CHECKS, THREE SEPARATE REDS. One combined validity predicate is
    satisfiable by a check that only ever tests existence — and the existence case is
    the one that never happens in practice. The last clause is what stops that.
  - >-
    NO SILENT FALLBACK, EVEN A LOGGED ONE. A warning plus a 49-second build is
    indistinguishable from normal operation to anyone watching a test run, and the
    misconfiguration survives indefinitely. Raise.
delivers_to: null
expects_from:
  - ac_id: TQ-600a-12
    contract: >-
      The seed-directory option on the private-copy route, and the completeness check
      the seeded copy must satisfy.
test_spec:
  - name: test_tq600a_12_i_an_absent_seed_directory_raises_and_names_the_path
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: failure
    description: >-
      Point the route at a path that does not exist. SharedReferenceLayoutError, with
      the path in the message, and no build subprocess started.
  - name: test_tq600a_12_i_a_seed_without_the_completeness_record_raises
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: failure
    description: >-
      Take a real finished layout, remove the build manifest from the copy, point the
      route at it. Raises, and the message says the completeness record was the
      missing thing.
  - name: test_tq600a_12_i_a_seed_from_a_different_configuration_raises
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      A complete seed whose recorded configuration fingerprint differs from the one
      this run would use. Raises, and the message names the mismatch. THIS IS THE
      DESCRIPTOR THAT CANNOT BE DROPPED: it is the only one covering a seed that
      passes every structural check and is still wrong.
  - name: test_tq600a_12_i_a_sound_seed_is_accepted_by_all_three_checks
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The paired control. A real finished layout used as a seed passes all three and
      yields a usable private root. Without this, three checks that refuse everything
      would satisfy the record.
  - name: test_tq600a_12_i_no_build_subprocess_runs_on_any_refusal
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      The execution log gains no entry on any of the three refusal paths. NAMED
      MUTATION: replace a raise with a fallback to the build route; this test must go
      RED, because the fallback is the natural defensive thing to write and it is
      precisely what the third clause forbids.
test_rationale: |
  Serving a mismatched tree silently is the only outcome worse than the current
  slowness, so the controls are arranged around the mismatch that is hardest to see
  rather than the one that is easiest to construct.

  Three separate descriptors exist because a single combined predicate is almost
  always implemented as an existence check and extended later, if ever. The
  configuration-mismatch descriptor is the load-bearing one: it is the condition
  under which the seeded tree is structurally perfect and semantically wrong, and it
  is the condition the prior analysis identified as the copy route's real hazard.

  The sound-seed control is there because five red-path descriptors with no green
  path are satisfied by a route that refuses every seed, which would be a correct
  reading of the clauses and a complete failure of the feature.
