title: "Parity violation: status done but agents map has needed entries"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket file where:
    - frontmatter `status:` is currently `in_progress`
    - the `agents:` map contains `python-coder: signed_off`
      and `test-runner: needed` and `commit: needed`,
  When ticket-supervisor invokes set_ticket_status.py
    with --ticket <path> --status done (without --force),
  Then the script parses the agents: map from the frontmatter
  And it finds entries with value `needed`: [test-runner, commit]
  And it rejects the transition with exit code 1
  And it prints:
    "Cannot set done - agents with status 'needed': test-runner, commit"
  And the frontmatter `status:` field is NOT modified
  And ticket-supervisor treats this as a parity violation
    and returns {status: "failed"} with a blocker payload
    naming the inconsistent agents.
