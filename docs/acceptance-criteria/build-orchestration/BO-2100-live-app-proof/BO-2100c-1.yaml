  required_skills:
    - "python-coder"
  post_write_commands:
    - "python -m pytest tests/test_live_surface_startup.py -q"
  notes: |
    The PID must be recorded before the start command reports the server ready, so
    teardown always has a PID to act on. The recorded PID must be the
    process-group-leader PID that teardown signals (consistent with the group-kill
    behavior in BO-2100c-3). Registry writes must follow the project error-handling
    policy for file I/O and must not corrupt or lose other worktrees' entries on
    concurrent access.
delivers_to:
  agent: python-coder
  contract: "A port-registry entry for the worktree carrying a non-null server PID (the process-group leader) that stop/finalize teardown reads to terminate the server"
