work_status: todo
criteria: |
  Given the UX designer agent has begun producing a prototype (partial output exists)
    and the BA agent is concurrently decomposing L1 ACs into L2 Gherkin behaviors,
  When the BA agent needs to understand the proposed user experience to write
    more specific criteria,
  Then the BA agent can read the prototype artifact in its current state
    (even if not yet complete or approved)
  And the BA agent uses the prototype's layout and flow information to inform
    the specificity of Given/When/Then clauses
  And the BA agent does not block waiting for the prototype to be finalized
