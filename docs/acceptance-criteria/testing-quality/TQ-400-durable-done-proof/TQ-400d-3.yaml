risk_surface: contract_boundary
notes: |
  The must_block modifier from docs/testing/test-angles.md applied to the triage
  pile: known-bad input (a clear attempt with no decision) fed through the SAME
  entry point that a valid clear uses, required to be refused. A gate that cannot
  block is inert, and the positive path alone cannot tell the difference.

  This is the mechanism that makes "never grandfathered into silence" real. Without
  it the 259-record pile can be emptied in one gesture and the entire TQ-400 tree
  reduces to theatre.

  The paired positive clause is essential: a "refuse everything" implementation
  would satisfy the negative control alone while making the pile impossible to
  work. Both outcomes must be observed in one cycle.

  IT-PO ENRICHMENT NOTE (2026-08-17). Two failure shapes added to it_requirements
  that the criteria imply but do not name. First, refusal must be visible OUTSIDE
  the process: a gate whose refusal is only a logged warning followed by a success
  return is inert to every caller, and this repo has shipped that exact shape
  (BO-1700 fail-open; FIN-100h's final else being the success path). Second, a
  refused attempt must leave no residue — a 'seen' or 'attempted' marker that lets
  a second attempt succeed converts the gate into a speed bump.
