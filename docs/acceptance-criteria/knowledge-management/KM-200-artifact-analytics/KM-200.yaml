notes: |
  IDEA STUB — PARKED, NOT QUEUED. Authored 2026-08-14 under the new cheap-capture
  convention: L0 + L1 only, no L2/L3, no BA hand-off. `covered_by` is DELIBERATELY
  EMPTY on this L0 and on every KM-200x child, so the whole tree reads as a parked
  idea (level in {L0,L1} and not covered_by) and is structurally excluded from the
  build loop. The parent->child link is intentionally recorded in ONE direction
  only: each L1 carries depends_on: [KM-200]. Do not "repair" the missing
  covered_by list without a decision to un-park this tree — restoring it is the act
  that turns the stub into a real backlog item, and it must be paired with L2
  decomposition. Note that check_ac_parent_covered_by will object to this shape at
  commit time; that is expected for a stub, not a defect to be silently patched.

  ADD-VS-CREATE: a new root L0 was chosen over grafting onto an existing tree.
    - KM-KGS-100 (traceability map) answers "what builds this and what proves it"
      for ONE artifact — a connectivity question. This goal answers "how many of
      these arrived and how many were worked off" across ALL artifacts — a
      population question over time. Different question, and KM-KGS-100 is already
      at five L1s with a large subtree.
    - ACS-1100 (honest denominators) is a STANDING principle every figure here must
      obey, not a home for it: it governs how an answer describes its own coverage,
      not what is counted. Inherited, not duplicated.
    - BO-2800 (gate value measurement) measures CHECKS, not artifacts. BP-400
      measures a DRIVE run. INF-500 is retrospective tooling resilience. All three
      are event/run-scoped; none owns a standing corpus census.
    - UXP-100 / UXP-490 own product-truth and prototypes; the Atlas views under
      UXP-520 / UXP-550 are the surface this would appear on, not the capability.
  Namespace: knowledge-management, whose remit is already cross-surface ingestion
  of every artifact kind. Plain `KM-NNN` prefix (not a new compound sub-prefix)
  because derive_parent_id mis-derives compound ids — KM-KGS-100a resolves to
  "KM-KGS", so any new compound tree would ship a broken parent link. KM-200 rather
  than KM-100 purely to avoid visual collision with KM-KGS-100 in prose and greps.

  MOTIVATING EVIDENCE (manual weekly report, 2026-08-07 -> 2026-08-13): 339 ACs
  authored vs 108 marked done (~3:1); store 2,482 -> 2,819 files, done 544 -> 651;
  52 new test files / 332 new test cases; 3 ADRs; 4 component docs; 2 C4 diagrams;
  18 changelog entries; 11 tickets; 20 PRs merged; 23 version tags. The report was
  hand-assembled once and is not repeatable — that is the gap KM-200e names.

  THE SEED REQUIREMENT IS KM-200c. The 3:1 ratio above is misleading on its own
  because readiness: draft conflates three populations: buildable backlog
  (approved L2/L3 at work_status todo — the only bucket that gates throughput),
  authoring WIP (draft/reviewed L2/L3 — 159 L2 + 49 L3 at the time of writing) and
  parked idea stubs (childless L0/L1 — 47, of which this tree is now seven). Any
  decomposition that reports one undifferentiated AC count fails this goal, because
  it punishes the cheap-parking behaviour the store wants to encourage.

  ROADMAP CONFLICT — RESOLVE BEFORE PROMOTING THIS TREE TO approved. No
  roadmap_phase is claimed on purpose. docs/vision.md lists "Runtime telemetry
  dashboard or analytics" under "What We're NOT Doing (Yet)", alongside "GUI or
  web-based configuration interface" — which the Atlas web view has already
  overtaken. Either the vision's out-of-scope list is stale and should be amended,
  or this tree stays parked until a phase claims it. That is a user decision; no
  vision or roadmap file was changed while authoring this stub.
