assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    consumer_simulation_absent_kind:
      type: object
      description: "The coverage record the consumer-install simulation emits for its adopter fixture: which file kinds the deployed guard configuration watches for, which of those the simulated project deliberately tracks none of, and whether the install's own deployed files of a watched kind were tracked. Makes the language shape the simulation actually exercised readable in the job's output, so coverage is stated rather than inferred from the job passing."
  reference_file_path: ".github/workflows/ci.yml"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "WHY THE PARENT DID NOT CATCH IT. BP-900h-6 already requires the job to fail when a guard blocks the commit 'over an artifact a brand-new project legitimately does not yet have'. That clause is right and was not enough: the simulated adopter tracks the package's own deployed Python, so every condition selecting Python files matches and the language-absence case is never presented. The gap is in the fixture's shape, not in the parent's rule."
    - "Choose the absent kind from the deployed configuration at run time. A job that hardcodes 'no Python' passes for exactly as long as Python is the only watched kind, and goes quietly stale the day another is registered — the same staleness that produced this defect."
    - "Do not satisfy this by deleting the deployed guard sources from the project. They must be deployed, because the guards have to run; what is being varied is which files the project TRACKS, which is what an activation condition is evaluated against."
    - "The negative case is mandatory and is the point. Without a fixture guard that turns the job red, this AC adds a step that cannot fail, which is the defect class this repository exists to prevent and would make the coverage claim worse than no claim."
    - "This is the detection half of BP-100k-4-ii. Landing detection without the gate correction leaves adopters blocked and the job red; landing the correction without detection lets the blocker return unobserved. Build both."
    - "Must follow the repo error-handling policy in any Python added: specific-exception try/except around file, JSON and subprocess I/O, log at WARNING or higher or re-raise; no bare or blind excepts."
    - "REACHABILITY GUARD IS RUN (2026-09-28 clause) — withheld set. check-hook-trigger-reachability must leave the set the scratch-fixture narrowing withholds. That narrowing is _isolate_precommit_registry_for_scratch_fixture in scripts/ci/_use_install_step.py, and it is a KEEP-WHITELIST (_ALWAYS_KEEP_HOOK_IDS plus the check_identifier_uniqueness entry match), so the guard is withheld today by omission rather than by name: the change must make it KEPT, and every other deployed guard's kept/withheld outcome must be unchanged. check-build-drift stays withheld (KI-CG-017)."
    - "REACHABILITY GUARD IS RUN — BP-900h-6-ii accounting preserved. Every guard still withheld must continue to be named in WITHHELD GUARDS with a recorded reason, and the verdict must stay qualified while anything is withheld. The shared _WITHHELD_REASON text must not go on citing a reason that no longer applies to the remaining withheld guards (it must not imply the reachability misfire, KI-CG-20260831-0713, is still why anything is withheld). The reachability guard must appear in the executed set, read from the commit's own captured output as today, never inferred from the registry."
    - "REACHABILITY GUARD IS RUN — evidence comes from the commit's own run. The job output must carry the guard's RESULT line (total=N unreachable=0 ...) from the execution that happened inside the adopter's first commit, against the real deployed registry the build produced. A separate direct invocation of check_hook_trigger_reachability.py does not satisfy the clause. pre-commit suppresses the output of passing hooks by default, so this must be surfaced deliberately; parsing an absent line as a pass is a defect."
    - "REACHABILITY GUARD IS RUN — negative case. The impossible-location fixture gate must be added to a copy of the deployed registry inside the scratch consumer only, never to templates/scripts/commit_guardian/commit_guardian.json or to the repo's own .pre-commit-config.yaml. The failing job must name the guard by its registered id (check-hook-trigger-reachability) or registered name (Check Hook Trigger Reachability (BP-100k-4)). A failure of the job for any other reason, such as a different guard blocking, does not satisfy the negative case."
    - "Windows portability: every subprocess whose output is read as text (git, pre-commit install, the commit itself) must decode as UTF-8 explicitly (encoding='utf-8', with an explicit errors policy), never the platform default. None of the existing text=True subprocess.run calls in scripts/ci/_use_install_step.py pass an encoding today, so on a cp1252 Windows console pre-commit's output (including the RESULT line and dot-fill status lines) can fail to decode or mis-decode. Every path comparison (registry entry paths, tracked-file sets, the fixture gate's location) must use POSIX-normalised forms, never raw OS separators."
    - "check-file-size ratchet (.py limit 400, measured 2026-09-28 with _file_size_ratchet.measure_current_length, the gate's own counting rule; wc -l reports 624 / 605 / 475 because the rule strips docstrings and block comments before counting). scripts/ci/_use_install_step.py = 399, 1 line of headroom: any net growth past 400 is a crossing refusal, so the clause must land at net <=+1 there or move logic into a new sibling module, as check_consumer_install.py already did to create this one. scripts/ci/check_consumer_install.py = 394, 6 lines of headroom: must stay <=400. templates/scripts/commit_guardian/check_hook_trigger_reachability.py = 306, within limit. No hook may be skipped to land this change."
test_spec:
  - name: test_simulated_adopter_tracks_no_file_of_a_watched_kind
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The prepared simulation project is inspected for its tracked file set and holds no file of at least one kind drawn from the deployed guard configuration, with the chosen kind named in the job's own output."
  - name: test_watched_kind_set_is_read_from_the_deployed_configuration
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Registering a guard that watches a new file kind changes the set the simulation selects from, without the job being edited — establishing the set is read at run time rather than recited."
  - name: test_adopter_hostile_language_guard_turns_the_job_red
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "With a fixture guard that blocks whenever the project tracks no file of its watched kind, the simulation fails and names that guard — the negative case proving this coverage can fail."
  - name: test_first_commit_completes_when_no_such_guard_is_present
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Against the real deployed guard set with the gate correction in place, the first commit in the language-absent adopter completes and the job passes — the coverage is not permanently red."
  - name: test_deployed_source_tracking_decision_is_explicit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Whether the install's deployed files of a watched kind are tracked in the simulation project is stated in the job's output, so the fixture cannot silently drift back to tracking the package's own sources."
  - name: test_reachability_guard_executes_and_passes_on_first_commit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Driving scripts/ci/check_consumer_install.py --use-install over a real build, the narrowing in scripts/ci/_use_install_step.py (_isolate_precommit_registry_for_scratch_fixture) leaves check-hook-trigger-reachability out of WITHHELD GUARDS (check-build-drift may remain), the deployed templates/scripts/commit_guardian/check_hook_trigger_reachability.py is listed as executed and Passed in the commit's own output with RESULT unreachable=0, and the first commit completes."
  - name: test_impossible_location_gate_blocks_commit_and_names_reachability_guard
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "With the scratch consumer's registry additionally carrying a gate whose activation condition names a location neither the consumer nor the vendored package can produce, the adopter's first commit is blocked by check_hook_trigger_reachability.py, and scripts/ci/check_consumer_install.py exits non-zero naming check-hook-trigger-reachability as the blocker, proving the un-withheld guard can turn the job red."
test_rationale: "This AC exists because a correctly-specified, done parent stayed green through a blocker it was written to catch. BP-900h-6 performs a real commit and fails on an adopter-hostile guard, and both properties held — the simulation simply never presented the condition, because its adopter tracks the package's own deployed Python and every language-conditional guard therefore finds what it is looking for. So the assertions here are about the FIXTURE's shape, and each is made by inspecting the prepared project and the job's emitted record rather than by reading the workflow file: a job that declares the right intent and prepares the wrong tree is source-shaped exactly like one that does neither. The adopter-hostile-guard descriptor is load-bearing per CLAUDE.md's rule that a gate must be shown capable of failing; without it this reduces to a step that always passes, which is how the parent came to be green over a live blocker."
delivers_to: null
