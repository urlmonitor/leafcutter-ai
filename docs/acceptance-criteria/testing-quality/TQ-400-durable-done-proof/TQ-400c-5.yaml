it_requirements:
  - >-
    THE ROUTINE-STATUS SURFACE IS SETTLED — PRECONDITION DISCHARGED 2026-08-18.
    This requirement previously read "BLOCKING PRECONDITION — DO NOT START THE
    FOURTH CLAUSE UNTIL THE ROUTINE-STATUS SURFACE IS NAMED BY THE USER"; the user
    has now named it and TQ-400c-2's criteria carry it, so the fourth clause is
    unblocked and must be written. THE SURFACE: the pull-request check list — a
    NON-BLOCKING entry appearing on every pull request, named so it reads alongside
    the existing "Proof-of-done coverage check (BO-2500b)" entry, publishing the
    three counts (proven / unproven / exempt) from the most recent COMPLETED
    SCHEDULED occurrence rather than re-running the sweep per pull request. The
    guide must send readers THERE and nowhere else, must say that the entry never
    blocks a merge (so a reader does not mistake a green pull request for a clean
    store), and must say that the figures are as old as the last scheduled
    occurrence — not as fresh as the pull request. The original prohibitions still
    stand in their converted form: DO NOT invent a dashboard, DO NOT substitute a
    different surface, and DO NOT write a placeholder path or a "TBD" heading — a
    guide that sends a reader anywhere other than the settled surface reproduces
    exactly the invisibility the parent L0 exists to remove, and a placeholder
    passes every presence check. The surface name remains an input from TQ-400c-2's
    delivery, not an authoring choice made here.
  - >-
    TARGET DOCUMENT — a NEW how-to at docs/how-to/done-proof-cadence.md, NOT an
    extension of docs/how-to/done-proof-enforcement.md. That file is 191 lines and
    TQ-400a-5 is already extending it with the third enforcement layer; the
    300-line advisory budget (check_doc_length, severity warn) leaves no room, and
    the two documents answer different questions. Cross-link both ways so a reader
    who finds one reaches the other.
  - >-
    LINK TO THE POPULATION TABLE, DO NOT RESTATE IT. TQ-400a-5 publishes the single
    three-population blind-spot table and the outcome/cause vocabulary in
    done-proof-enforcement.md. This guide names those outcomes and links; a second
    account of the populations in a second file is the drift both guides exist to
    remove.
  - >-
    NO RECURRING SCHEDULE EXISTS IN THE REPOSITORY TODAY (verified 2026-08-17:
    every workflow is event-driven, none carries a recurring trigger). This guide
    therefore documents a surface TQ-400c-1 CREATES, which makes the
    publication-accuracy clause the sharpest one here — there is no incumbent
    behaviour to fall back on, and a plausible generic account of scheduling would
    be indistinguishable from a correct one until someone tried to change the
    cadence. Name the delivered workflow file, job name, cron expression and
    out-of-cycle trigger exactly as they ship.
  - >-
    EVERY COMMAND AND EVERY NAVIGATION STEP MUST BE COPY-RUNNABLE AS WRITTEN, and
    the out-of-cycle trigger must be given as the actual invocation a reader
    performs, not as a description of one. The test contract extracts each fenced
    command and executes it, so an unrunnable step is a red test.
  - >-
    THE ABSENT-REPORT CASE MUST DISTINGUISH FAILED FROM NOT-YET-FIRED USING
    TQ-400c-4'S DELIVERED REPRESENTATION, and must say what to look at in each
    case. Do not invent a failure representation here — TQ-400c-4 owns it. "No
    report" reading as "all clear" is the Lost Test failure this clause exists to
    prevent. Note the interlock with the settled surface: TQ-400c-2 requires the
    check entry to show a failed or lapsed occurrence as a state of its own and to
    state the age of the figures, so the guide teaches a reader to read that state
    off the check list rather than to infer it from silence.
  - >-
    THE DIRECTION-OF-TRAVEL EXPLANATION MUST NAME THREE THINGS PER FIGURE: which
    population moved, in which direction, and against which earlier dated
    occurrence it is compared. A delta with no stated comparison base is a number a
    reader cannot act on, and it is the commonest way a trend report becomes
    decorative.
  - >-
    REACHING THE PRECEDING OCCURRENCE'S REPORT IS A FIRST-CLASS STEP, not an
    implication of "reports are dated". State how to list occurrences and how to
    open the previous one; comparison against the previous run is the whole basis
    of the direction-of-travel figures.
  - >-
    Tracked how-to subject to check_doc_frontmatter, check_doc_length and
    check_doc_links. A new file also changes the generated docs/INDEX.md — run
    `python scripts/build.py --target-dir .` and commit the regenerated index; do
    not hand-edit it (build.py:1009).
  - >-
    SEQUENCE AFTER TQ-400c-1, TQ-400c-3 AND TQ-400c-4 LAND. The TQ-400c-2 surface
    decision is recorded as of 2026-08-18 and is no longer a sequencing constraint;
    what remains is that every clause here is a claim about a configuration that
    does not yet exist, so the guide is written against the delivered artifacts.
