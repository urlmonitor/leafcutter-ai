title: "The epic batch call site opts into PR deferral; the single-ticket call site does not"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given templates/workflows-js/build-feature.js wires the per-ticket phase driver
    to the pure helper selectDispatchPhases(orderedPhases, isEpicMember),
  When the epic batch loop drives an epic-member ticket through its phases,
  Then it invokes the per-ticket driver so that selectDispatchPhases receives
    isEpicMember=true for that ticket (the epic call site passes true),
  And when the standalone single-ticket path drives a ticket,
  Then it invokes the per-ticket driver without opting in, so selectDispatchPhases
    receives the default isEpicMember=false (the single-ticket call site does not
    pass true) and the single-ticket build still opens its own pull request.
notes: |
  This AC covers the call-site WIRING — which caller opts into PR deferral — as
  opposed to the filtering behavior of selectDispatchPhases itself (BO-2700a-1/-2/-3).
  Because build-feature.js is a Workflow-engine script that uses injected globals
  (agent()/parallel()) and is not importable, this wiring is verified STRUCTURALLY:
  a test parses the JS source (the pattern used by
  unit_tests/workflows/test_fast_lane_ship_structure.py) and asserts (a) the epic
  batch call site passes isEpicMember=true and (b) the single-ticket call site does
  not. Pair with `node --check` and an independent runtime-path review, per the
  CLAUDE.md workflow-AC caveat. The behavioral guarantee that the true/false inputs
  produce the correct dispatch sets is carried by the executable ACs BO-2700a-1,
  BO-2700a-2, and BO-2700a-3.
