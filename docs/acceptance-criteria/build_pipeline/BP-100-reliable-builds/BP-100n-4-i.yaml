notes: >-
  WHY THIS EXISTS AS A SEPARATE CRITERION. Some of the 19 scripts named by no entry line
  will legitimately never be gates. A check with no exemption path gets disabled the first
  time it is right about something inconvenient — that is the observed lifecycle of a
  guard in this repository, and it is cheaper to specify the escape hatch now than to
  discover it as a suppression later. The escape hatch is deliberately narrow: it requires
  a written ground, and a blank ground is refused rather than accepted, so the register
  cannot become a silent allowlist.


  MUTATIONS FOR THE ABSENCE-ASSERTING CLAUSES. The clause "a script whose record states a
  ground is not counted among the scripts nothing invokes" is an assertion that something
  is NOT reported, and it is green on arrival on any implementation that reports nothing.
  Two mutations give it evidential value:

  (1) MUTATION: key the register lookup on the hook id rather than on the script filename.
  Every declared non-gate then fails to resolve — an unregistered script has no hook id —
  and each is reported as invoked by nothing. The clause must fail under this mutation,
  naming every script in the register.

  (2) MUTATION: accept a record whose ground is the empty string, or whitespace only.
  The groundless-record clause must fail, and it must fail by the script NOT being
  reported — the observable difference between a register that is checked and one that is
  merely consulted. Pair this with the existing REJECTED-groundless behaviour in
  validate_exemptions so the two registers cannot diverge on what counts as a ground.


  THE STALE-RECORD AND REDUNDANT-RECORD CLAUSES ARE THE REGISTER'S OWN VERSION OF THIS
  EPIC'S THESIS. A register nobody prunes accumulates cover for scripts that are gone or
  for scripts that are now invoked, and cover that outlives its subject is exactly how a
  check quietly stops checking. Both are reported conditions rather than silent skips,
  and neither needs its own mutation: both are red on arrival, because no such register
  exists yet.
