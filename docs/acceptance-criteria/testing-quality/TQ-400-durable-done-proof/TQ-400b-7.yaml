    status: exists
    relevance: >-
      IT-PO ADDITION. The declaration the entry must agree with, field for field.
      The root is additionalProperties:false, which is why an undocumented field
      is a field nobody will set correctly, and why the both-directions agreement
      test reads this file rather than the entry's prose.
  - path: scripts/ac_store/validate_ac_schema.py
    relationship: implements
    status: exists
    relevance: >-
      IT-PO ADDITION. The shipped validator. The criteria's round-trip clause is a
