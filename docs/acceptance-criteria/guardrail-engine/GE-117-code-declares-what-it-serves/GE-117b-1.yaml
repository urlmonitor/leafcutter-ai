id: GE-117b-1
readiness: approved
priority: medium
title: "A changed public symbol docstring referencing a real AC satisfies the symbol-AC declaration"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-117-code-declares-what-it-serves/GE-117b.yaml"
criteria: |
  Given a public function or class is new or changed in the staged commit
  And a symbol is public when its name does not start with an underscore, except
    that when the module defines __all__ the __all__ membership is authoritative
    (a name listed in __all__ is public; a name absent from __all__ is not)
  And the symbol's docstring references an acceptance criterion that resolves to a
    real AC id in the store
  When the declaration check evaluates the symbol
  Then the check produces a satisfied verdict for that symbol's AC declaration

  Given a public function or class is new or changed in the staged commit
  And its docstring exists but references no acceptance criterion
  When the declaration check evaluates the symbol
  Then the check produces a missing-declaration verdict naming the symbol and the
    symbol-AC declaration as the missing requirement

  Given a public function or class is unchanged in the staged commit
  And its docstring references no acceptance criterion
  When the declaration check evaluates the staged diff
  Then the check produces no verdict for that unchanged symbol
