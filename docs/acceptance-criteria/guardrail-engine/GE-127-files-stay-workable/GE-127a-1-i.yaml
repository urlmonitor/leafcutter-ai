it_requirements:
  - >-
    NO PACKAGE SURFACE — MEASURED, NOT ASSUMED, WHICH IS WHY THE SPEC HERE IS A PLAIN LIST.
    _package_surface_registry.WATCHED_REGISTRIES watches commit_guardian.json on
    hooks_manifest.hooks (by id) and on the document's own top level (by mapping key, with
    only "$schema" and "_comment" excluded). This record adds neither: it changes how one
    unmeasurable input is reported inside check_file_size.py. The manifest entry that makes
    the gate reachable is declared once, on GE-127a-1, and inherited here. Do NOT mint a
    config_schema_fragment key to satisfy the structured-spec validator — BP-100n-4-ii
    records that BP-100k-4 and BP-100k-4-i both declared keys
    (hook_trigger_reachability, hook_trigger_reachability_indeterminate) that were never
    created, and commit_guardian.json's 36 top-level keys still contain neither. A second
    imaginary key makes the machine-checked spec less trustworthy than no spec at all.
  - >-
    REUSE BP-100n-4-ii's VERDICT VOCABULARY AND EXIT-STATUS CONTRACT UNCHANGED — THIS IS THE
    PIN THE BA ASKED FOR AND IT IS DECIDED. The criteria deliberately name no exit status
    and the BA's notes ask the IT PO to choose. Chosen: an "INDETERMINATE: reason=<text>"
    line naming which of the two situations occurred, with exit 2, alongside exit 0 for a
    clean run and exit 1 for a length that WAS measured and found over. That is the existing
    contract on check_hook_trigger_reachability and the one BP-100n-4-ii pins; using it here
    means the two guards speak one language and an author can tell a measurement failure
    from a size finding by the status alone. The alternative the BA names — treating an
    unmeasurable file as an ordinary finding — is rejected because it collapses exactly the
    distinction the third clause requires. Do not mint a third verdict set and do not widen
    the exit-status set.
  - >-
    THE DEFECT IS RULE 3, NOT RULE 2, AND THE FIX IS AN UNAVAILABILITY SIGNAL RATHER THAN A
    NUMBER. count_lines currently wraps its read in `except Exception: return 0` and
    separately returns 0 for a path that does not exist; zero then compares under the limit
    and the file is printed in the PASSED block as "0 lines - OK". Replace the swallowed
    return with a value the caller cannot mistake for a measurement — the measurement
    function must be incapable of returning a length for a file it could not read. A branch
    that returns a sentinel integer reintroduces the same defect with a different constant.
  - >-
    TWO SITUATIONS, NAMED SEPARATELY, NEVER COLLAPSED. "The contents are not readable as
    text in the encoding the standard reads" and "the file cannot be opened at all" are
    different facts about the world and the outcome must say which occurred. Collapsing them
    costs the author the only information that distinguishes a genuinely binary file from a
    permissions or path problem. This is BP-100n-4-ii's two-disk-situations rule applied
    here.
  - >-
    A STAGED DELETION IS OUT OF SCOPE AND MUST NOT BE RESOLVED SILENTLY WHILE FIXING THE READ
    PATH. A deletion presents a path that does not exist and today takes the same
    return-zero route, so the fix will pass through it. Whether a deleted file should be
    measured at all is a scope question the BA explicitly left out of the approved set.
    Exclude deletions from the measured population explicitly and by their git status
    (`git diff --cached --name-status` already yields D), never by letting them fall into
    the unreadable branch — a deleted file reported as INDETERMINATE would refuse every
    commit that removes a covered file.
  - >-
    EXERCISE THE UNMEASURABLE STATES FOR REAL. Make a file genuinely unreadable at run time
    — bytes that are not valid in the encoding the standard reads, or permissions that
    forbid opening it — never by asserting that an error branch is present in the source.
    BP-100k-4-i's standing constraint applies unchanged: a source assertion stays green on
    precisely the fail-open implementation this record exists to forbid.
  - >-
    CANONICAL VERSUS BUILD OUTPUT, AND THE BUILD IS PART OF THE CHANGE.
    templates/scripts/commit_guardian/ is canonical; scripts/commit_guardian/ and the
    repo-root .pre-commit-config.yaml are untracked build outputs that build.py overwrites,
    and templates/commit-guardian/commit_guardian.json is a decoy that needs no edit. Edit
    the canonical template and re-run `python scripts/build.py --target-dir .` — config.py:19
    resolves commit_guardian.json beside the DEPLOYED script, so an unbuilt change leaves the
    running gate unchanged and the work unverified.
  - >-
    DEPLOY-MANIFEST BOUNDARY. build_commit_guardian copies every file in
    templates/scripts/commit_guardian/ verbatim, so a sibling module inside that directory
    needs no deploy entry; anything imported from outside it MUST be added to the deploy map
    in scripts/build_phases.py in the same change or the deployed hook raises
    ModuleNotFoundError at commit time while source-tree tests stay green.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around the file
    read and any decode; log at WARNING or higher or re-raise; no bare or blind excepts. Here
    the re-raise-equivalent is the INDETERMINATE verdict — it must never degrade into a
    swallowed error and a measured length.
test_spec:
  - name: test_ge_127a_1_i_an_undecodable_file_is_refused_and_named_as_the_unreadable_situation
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      Stage a covered file whose bytes are genuinely not valid in the encoding the standard
      reads and run an ordinary commit. The outcome must state that the file's length could
      not be established, must name this specific situation as the not-readable-as-text one,
      and the commit must not complete. Exercised by writing real undecodable bytes, never by
      asserting an error branch exists in the source.
  - name: test_ge_127a_1_i_an_unopenable_file_is_the_other_separately_named_situation
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      A covered file that cannot be opened at all — permissions forbidding the read — is
      reported as a DIFFERENT, separately named situation from the undecodable one, and also
      refuses the commit. Establishes that the two facts are distinguishable in the outcome
      rather than collapsed into one message.
  - name: test_ge_127a_1_i_an_unmeasurable_file_is_never_listed_as_within_its_permitted_length
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      The unmeasurable file appears in no within-permitted-length class and no length is
      stated for it. NAMED MUTATION (mandatory, run it, do not merely describe it — the BA's
      injection): restore the swallow-and-return-zero behaviour, so a file whose contents
      cannot be read yields a measured length of zero instead of an unavailability signal.
      That is the exact shape presently in the source and the shape every cited precedent
      shipped. Under the injection the file is reported as within its permitted length at a
      length of zero and the commit completes; this descriptor must go RED, failing BY THE
      COMMIT OUTCOME as well as by the text, and return to green on revert.
  - name: test_ge_127a_1_i_the_unmeasurable_outcome_is_distinguishable_from_a_measured_over_limit_outcome
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Two runs — one staging an unmeasurable covered file, one staging a covered file
      measured and found over its limit — produce outcomes an author can tell apart without
      inspecting anything else. Assert on both the emitted text and the exit status, which
      under the pinned contract are 2 (INDETERMINATE) and 1 (finding) respectively. A single
      shared refusal message for both states fails this descriptor.
  - name: test_ge_127a_1_i_the_same_file_made_readable_and_under_its_limit_commits_and_is_reported_within
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      THE PAIRED RUN, WHICH IS WHAT MAKES THE FIRST ARM A STATEMENT ABOUT MEASURABILITY. Take
      the same file from the unreadable descriptor, make it readable and below its permitted
      length, and commit. The commit must complete and the file must be reported as within
      its permitted length. Without this pairing, a guard that refuses everything passes
      every other descriptor here.
  - name: test_ge_127a_1_i_a_staged_deletion_of_a_covered_file_does_not_produce_an_indeterminate_verdict
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      A commit that deletes a covered file completes and produces no could-not-be-measured
      verdict for the deleted path. Guards the out-of-scope state the BA flagged: a deletion
      presents a non-existent path and today takes the same return-zero route the fix
      replaces, so without this descriptor the fix converts every deletion into a refusal.
  - name: test_ge_127a_1_i_the_indeterminate_verdict_reaches_the_registered_hook_output_and_exit_status
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      PRODUCTION ENTRY POINT. Run the gate through the registered hook path with an
      unmeasurable file staged and assert that the INDETERMINATE line and its named reason
      appear in the hook's own output stream and that the exit status is the commit outcome
      rather than an advisory note. A verdict printed by a function nothing at commit time
      calls is inert.
  - name: test_ge_127a_1_i_the_deployed_copy_fails_closed_on_an_unmeasurable_file_in_a_cold_process
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After build.py, the DEPLOYED copy and every module it imports load and run in a cold
      process — a helper placed outside templates/scripts/commit_guardian/ without a
      scripts/build_phases.py deploy-map entry surfaces here as ModuleNotFoundError rather
      than passing. With an unmeasurable covered file staged, the deployed run emits the
      indeterminate verdict with its named reason and exits non-zero. Source-tree greenness
      cannot substitute: the hook runs from the deployed layout.
test_rationale: |
  The clause that carries the actual guarantee — "that file is not listed among those found
  to be within their permitted length" — asserts an absence, and on today's implementation,
  which refuses nothing at any commit because it runs at no commit, it is green on arrival.
  The BA's injection is carried into a descriptor verbatim rather than restated: restoring
  the swallow-and-return-zero shape must turn it red BY THE COMMIT OUTCOME, not merely by
  the text, because a gate that prints a worried message and exits 0 is indistinguishable
  from a passing one to pre-commit, which reads only the status.

  Both unmeasurable states are exercised by making the read genuinely fail at run time.
  BP-100k-4-i's standing constraint is the reason: a test that asserts an error branch is
  present in the source stays green on precisely the fail-open implementation this record
  forbids, and every one of the four cited precedents (KI-CG-034, KI-CG-012, KI-CG-018, the
  AC-store validator's bare-directory no-op) passed its own tests that way.

  The paired readable run and the deletion descriptor are the two boundary checks that stop
  the fix overshooting. Without the first, a guard that refuses everything passes; without
  the second, the fix turns every deletion of a covered file into a refusal, because a
  deletion presents exactly the non-existent path the read-error branch now rejects.
