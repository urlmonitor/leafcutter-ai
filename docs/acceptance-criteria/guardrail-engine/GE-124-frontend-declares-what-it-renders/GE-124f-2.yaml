assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "PREREQUISITE THAT DOES NOT EXIST YET — READ THIS FIRST. The criteria assume 'the design's own rendered markup carries element pins'. It does not. Verified 2026-08-25: docs/product-truth/mockups/fern-and-fig/ contains five rendered .html files (plant-listing, plant-detail, cart, checkout, order-confirmation) and NONE of them contains a single `data-ac` attribute; the .mockup.json records carry `screen`, `renders` (the html filename) and `entities`, but no per-criterion element mapping. This AC therefore has an unbuilt prerequisite: mockup markup must start carrying data-ac pins, which is mockup-author's surface and is NOT covered by any AC in the GE-124 family. Either land that prerequisite first or this AC compares against an empty set and reports every criterion as missing from every built page. Flagged to the user rather than absorbed."
  - "THE COMPARISON IS OVER ELEMENT PINS, NOT PIXELS, and is read from both sides with the SAME shared reader (GE-124b-1). Comparing rendered appearance is a different and much larger problem with a far worse signal-to-noise ratio; comparing which criteria each side claims to render is mechanical, stable, and answers the question the realisation label actually makes. Using one reader for both sides is what makes the two pin sets commensurable."
  - "THE DERIVED LABEL TAKES PRECEDENCE, AND PRECEDENCE MEANS THE HAND-WRITTEN VALUE IS NOT CONSULTED WHEN A COMPARISON IS AVAILABLE. Resolve the label in one place, comparison-first. Without precedence the derived result is advice and the hand-written label still governs, which leaves the phantom-done pattern exactly where it was — the PO's whole reason for this AC."
  - "A PAGE OUTSIDE THE CHAIN HAS NO COMPARISON AND MUST KEEP ITS HAND-WRITTEN LABEL WITHOUT PENALTY (GE-124f-1-ii). Precedence applies when a comparison exists; absence of a design is not evidence of a mismatch. Conflating the two would report every unmodelled page as unbuilt."
  - "THE DIFFERENCE IS DIRECTIONAL AND BOTH DIRECTIONS ARE REPORTED SEPARATELY: in the design and absent from the page (the criteria's case, an incomplete build), and on the page and absent from the design (a page claiming a criterion the design never had — either an undocumented addition or a stale design). A symmetric set-difference collapses two different conversations into one number."
  - "THIS IS A REPORTING/DERIVATION SURFACE, NOT A COMMIT GATE. It produces a comparison and a label; it must not block a commit, and its output feeds GE-124g-3's reporting, where it is counted on its own axis and never folded into a coverage figure. A matching comparison proves the built page CLAIMS what the design claims — it does not prove the behaviour behind it works."
  - "Must handle errors gracefully per the project error handling policy; an unreadable mockup file must be named rather than silently producing an empty design-side pin set, which would report every criterion as missing from the built page."
delivers_to:
  agent: python-coder
  contract: "A per-page comparison of the design's element pins against the built page's element pins — both sides read with the SAME shared reader, reported directionally (in-design-not-on-page and on-page-not-in-design kept separate) — plus a realisation label DERIVED from that comparison and taking precedence over any hand-written value whenever a comparison exists. A page outside the chain has no comparison and keeps its hand-written label without penalty. Output feeds GE-124g-3's reporting on its own axis, never a coverage figure."
expects_from:
  ac_id: GE-124f-1
  contract: "The built-page-to-design link the comparison runs across, including the outside-the-chain state that means no comparison is available for that page"
test_spec:
  - name: test_ge_124f_2_criterion_in_the_design_and_absent_from_the_page_is_reported_directionally
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "Design pins UXP-100d-2 and UXP-100d-3, built page pins UXP-100d-2 only: the comparison names the design, the page, and UXP-100d-3 as in-design-not-on-page. Assert the direction, not just membership in a difference set."
  - name: test_ge_124f_2_criterion_on_the_page_and_absent_from_the_design_is_reported_as_the_other_direction
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: boundary
    description: "The reverse asymmetry — a built page pinning a criterion the design does not — is reported in its own direction, not merged with the first. Two different conversations (incomplete build; undocumented addition or stale design), so two different report entries."
  - name: test_ge_124f_2_derived_label_overrides_a_hand_written_built_label
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "A page hand-labelled 'built' whose comparison finds a difference resolves to the derived label, not to 'built'. This is where the value of the AC lands: without precedence the derived result is advice and the phantom-done pattern survives untouched."
  - name: test_ge_124f_2_comparison_reads_both_sides_with_the_same_reader_over_real_mockup_and_source_files
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Run the comparison over a real on-disk mockup .html file annotated with data-ac and a real front-end source file, using the shared reader for both sides. Assert an EMPTY design-side pin set is reported as 'no pins in the design' rather than as 'every criterion missing from the page' — that is today's actual state of docs/product-truth/mockups/ and it must not read as a total build failure."
  - name: test_ge_124f_2_page_outside_the_chain_keeps_its_hand_written_label_without_penalty
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: boundary
    description: "A page with no modelled design produces no comparison and no derived label, and its hand-written label stands. Absence of a design must never be reported as a mismatch."
test_rationale: |
  This AC's real hazard is not a comparison bug, it is an empty input: no mockup in the repo
  carries a single data-ac pin today, so a naive implementation reports every criterion as
  missing from every built page and floods the report on its first run. The fourth test pins
  that case explicitly — an empty design-side set must read as 'the design has no pins', not as
  a total mismatch — and runs over real on-disk mockup and source files rather than fixtures, so
  the empty-input reality is exercised rather than assumed away. The directional tests exist
  because a symmetric set difference is the obvious implementation and it merges two findings
  with different remedies. The precedence test is where the AC's value lands and is the one line
  that separates a working anti-phantom-done control from advice.
