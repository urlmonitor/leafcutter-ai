  contract: "The dual-read resolver (store + ticket-body) that must remain readable while the compatibility window is open."
it_requirements:
  - "Canonical source: scripts/build.py / scripts/build_phases.py and the dual-read resolver in scripts/ac_store/generate_ticket_from_ac.py. While the compatibility window is open (>=1 in-flight fat ticket remains) both old and new AC shapes MUST remain readable and the legacy-derive path MUST NOT be removed."
  - "Removal of the legacy path is permitted ONLY when the window has elapsed AND zero in-flight fat tickets remain; the in-flight count must be derived from actual store/ticket state, not a hard-coded flag."
  - "Test must EXECUTE the window/removal gate with in-flight fat tickets present (expect dual-read retained, removal blocked) and with the window elapsed + zero in-flight (expect removal permitted) -- never grep-only."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file I/O in typed try/except and log-or-reraise; no bare except."
