it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/workflows-js/build-feature.js
  n_location_rule: "1 -- the epic driver's completion path in build-feature.js. build-ticket.js drives a single piece of work and has no epic set to re-read; state in the sign-off that the twin was inspected and correctly carries no counterpart, so the twins do not silently drift into two different completion contracts."
  required_skills:
    - python-coder
  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_epic_ticket_set_recheck.py"
  constraints:
    - "VERIFY BY EXECUTION, NOT BY GREP. Per CLAUDE.md 'Gate / Workflow ACs -- Verify Behaviorally, Not by Grep', a test that finds a second enumeration call in the source cannot tell whether its result reaches the output. Drive the real workflow through unit_tests/prompt_assembly/harness_build_ticket_guard.mjs with an enumeration stub that returns a larger set on its second call, and assert the emitted completion output names the additions."
    - "DETECT AND REPORT -- DO NOT BUILD. Building the additions inside the same drive is out of scope and is not a safe default: work added during a drive can itself add more, and the drive would have no termination condition. The contract is that the additions are surfaced, named, and left outstanding."
    - "THE COMPLETE CLAIM IS THE PART THAT MUST CHANGE. Naming the additions in a list while still emitting an epic-complete statement leaves the operator with two contradictory sentences and an archive attempt that will fail later. Suppressing the complete claim is the load-bearing half, and must be asserted on the emitted text."
    - "COMPARE SETS, NOT COUNTS. A drive in which one piece of work was added and another removed has an unchanged count. The comparison must be by identity."
    - "SAY WHEN, TOO. The criteria fix the latest moment the re-read must happen -- before the completion output. If the re-read is also performed earlier, at batch boundaries, that is an improvement and not a substitute: the completion-time re-read is what makes the claim in the output true at the moment it is made."
delivers_to:
  agent: python-coder
  contract: "A completion output that names, by identity, every piece of the epic's work that existed at the end of the drive but not in the plan, and that withholds the epic-complete statement while any such work exists"
expects_from: null
test_spec:
  - name: test_work_added_after_planning_is_named_in_the_completion_output
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Drive the real epic workflow with an enumeration that grows by three between the plan and the end, and assert all three are named in the emitted completion output as discovered after planning."
  - name: test_the_epic_complete_statement_is_withheld_while_unplanned_work_exists
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "In the same scenario, assert the emitted output contains no statement that the epic is complete -- the defect being that the drive would have reported completion having never seen the additions."
  - name: test_unchanged_epic_still_reports_complete_with_no_additions_section
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Control case: an epic whose set is identical at both reads produces the existing completion output unchanged, with no discovered-after-planning entries -- so the two assertions above are attributable to the additions."
  - name: test_the_comparison_is_by_identity_not_by_count
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "One piece of work added and one removed between the reads, leaving the count unchanged; assert the addition is still named."
  - name: test_existing_completion_sections_are_unchanged
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Assert the four sections BO-300a-2 specifies remain present and in order in the emitted output, so the new section is an addition rather than a rewrite."
test_rationale: |
  The failure being prevented is a sentence the drive emits, so every descriptor
  asserts on the emitted completion text rather than on an intermediate structure --
  a roll-up that internally knows about the additions while the output still reads
  epic complete is the same defect with a better data model. Reproducing the
  condition at all requires an enumeration that answers differently on its second
  call, which no static test can express; that is what makes the harness extension
  the natural verification. The control case is required because the cheapest way to
  pass the first two descriptors is to stop claiming completion at all.
