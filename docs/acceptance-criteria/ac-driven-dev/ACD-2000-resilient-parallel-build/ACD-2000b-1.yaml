test_spec:
  - name: test_claim_is_visible_to_a_third_reader_with_owner_and_instant
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Takes a real requirement in a fixture store through the real claim path, then reads the record back through a separate reader and asserts it reports taken, by that owner, at that instant."
  - name: test_hand_back_clears_owner_and_instant
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Releases the same requirement and asserts a third reader sees it available with owner and instant cleared, not merely with the status flipped back."
  - name: test_general_drive_selection_observes_a_fast_lane_claim
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Claims a requirement through the fast-lane entry point, then runs the general drive's real ready-set selection over the same store and asserts the claimed requirement is reported taken by the named owner."
  - name: test_fast_lane_selection_observes_a_drive_claim
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "The same assertion in the opposite direction: a requirement taken by the general drive is seen as taken by the fast-lane selection. Both directions are required -- a one-way implementation satisfies the fast lane and leaves the original gap."
  - name: test_claim_write_preserves_every_other_field
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Claims and releases a record carrying a populated adjudication trail and asserts every other field survives the yaml round trip unchanged."
test_rationale: "Asserting that a claim field is WRITTEN is the test this AC must not accept: it passes on a fast-lane-only implementation, which is the status quo. The L1's promise is about what an OBSERVER sees, and today the general drive is an observer that does not look -- so every test reads the record back through a second, different reader, and two of them cross the entry-point boundary in both directions. That cross-caller pair is the discriminating test: a change that adds owner and instant to claim_build_set alone passes the first two tests and fails these."
