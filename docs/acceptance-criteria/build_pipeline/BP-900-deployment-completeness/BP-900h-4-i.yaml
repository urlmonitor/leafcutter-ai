id: BP-900h-4-i
components:
  - build_pipeline
title: "The declaring-file proof runs against every install layout an adopter produces, so a file that resolves in one layout is not accepted as proof for the rest"
component: build-pipeline
level: L3
status: active
req_status: active
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900h-4.yaml"
criteria: |
  Given the consumer-layout install and the declaring-file inspection of BP-900h-4,
  And the set of install layouts a real adopter produces rather than the single
    layout the fixture builds today,
  When the inspection is run,
  Then it is run once per layout in that set and each layout carries its own verdict,
    named in the report by layout, so a green overall result cannot be produced by one
    layout answering for the others,
  And the set contains at least these four layouts, each present for a reason the
    report states: (a) an install whose package directory is named as the project's own
    bootstrap documentation prescribes; (b) an install whose package directory carries a
    DIFFERENT name of the adopter's choosing; (c) a git worktree created from an install
    of shape (a) or (b), which is the layout the package's own feature-branch workflow
    and its worktree agent create; and (d) the package's self-hosted checkout, which
    must keep passing,
  And every declaring file a deployed guardrail reads is found under the deployed output
    root of EVERY layout in the set, resolved on BP-900h-4's terms — from that layout's
    deployed output root alone, never from the package checkout, a parent directory, or
    the invoking process's working directory,
  And no declaring file is located by a candidate path that spells out any particular
    package-directory name, so an adopter who names the directory something other than
    the one name the current lookup is written against is not thereby a broken install,
  And an absent declaring file is reported loudly and by name in the layout where it is
    absent: neither a narrower built-in list of permitted values, nor a substitute rule,
    nor an empty result may be produced in its place, so the fail-closed posture that was
    deliberately established for the document type vocabulary is preserved rather than
    traded away for a green run,
  And the presence of each declaring file is asserted directly by the inspection rather
    than inferred from its reader completing without complaint, because a reader that
    returns nothing when its file is absent produces the same silence as a reader whose
    file is present — the sibling vocabulary lookup behaves exactly this way today, so
    a reader-driven inspection is green on the layout that is broken,
  And the multi-layout inspection is demonstrated to FAIL when one declaring file is
    removed from exactly one layout's deployed output root while the others stay intact,
    with the report naming the layout, the file, the guardrail that reads it, and the
    deployed location it was expected at, and to pass again once the file is restored,
    because a per-layout proof that stays green when one layout is incomplete is the
    single-layout proof under a longer name.

  Because on 2026-08-25 the same lookup produced two contradictory field reports and both
  were accurate. Where the package is installed under the directory name one report's
  adopter used, the lookup's second candidate resolves in the main checkout and fails
  inside a git worktree, because the worktree's copy of that directory is empty. Where the
  package is installed under the directory name this project's own bootstrap
  documentation prescribes, neither candidate ever resolves and the lookup fails
  everywhere, main checkout included. The disagreement was never about whether the defect
  exists; it was about which layout the reporter was standing in. A proof anchored to one
  layout can only ever settle one of those reports, and today's fixture is anchored to one
  layout.
