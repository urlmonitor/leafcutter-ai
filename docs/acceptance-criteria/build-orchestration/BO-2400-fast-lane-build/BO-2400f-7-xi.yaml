id: BO-2400f-7-xi
components:
  - build_orchestration
title: "The lane's claim tests give the lane the reply the real claim command produces, never a shape it cannot emit"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the lane's tests for the claim step's held, ran-and-failed and usable-claim
    outcomes,
  When each test gives the lane a claim reply,
  Then that reply's exit status, standard output and standard error are the ones the claim
    command produced when it was run against a fixture store in the matching state — the
    target already in_progress for held, an id the store does not contain for
    ran-and-failed, and every member todo for a usable claim,
  And no test gives the lane a held outcome together with a success exit status, the shape
    the 2026-09-23 claim-refusal test gave and the real command never emits.

  Given the lane as it stood on 2026-11-16, which reads every non-success claim reply as
    never attempted,
  When the held test runs against it,
  Then the held test fails.

  Given the claim command's held output changes shape,
  When the lane's held test runs,
  Then the test fails, because its reply comes from the command and not from a copy written
    into the test.
depends_on: [BO-2400f-7, BO-2400f-7-viii, BO-2400f-7-ix]
