assigned_agent: python-coder
estimated_complexity: S
it_requirements: |
  The remedy-declaration leg asks "is the package's own declaration table correct?",
  of the file being committed. A consumer never commits the package's table or
  manifest: a vendored copy is a submodule or a build input, so the consumer can
  neither change a finding nor be the place it gets fixed. The leg also resolves the
  agent and skill registries under the project root (config/), which in a consumer
  are not the package's. So outside the package checkout the leg does not apply.
  Reading the vendored or deployed table instead was rejected: GE-132a-4 forbids the
  deployed fallback, and judging package content in every consumer moves the
  package's defects into commits that cannot fix them.
  The rule is explicit, not a silent pass: the leg applies exactly when
  templates/scripts/commit_guardian/commit_guardian.json exists under the project
  root, and prints a not-applicable line naming both paths otherwise. Inside the
  package checkout an absent or unreadable committed table stays could-not-check.
  Script, manifest and deployed parity are unchanged and still run in consumers.
