it_requirements:
  - >-
    Edit the template sources only (templates/agents/, templates/skills/). Never edit the
    built copies under .claude/ or the output root (ADR-001). No build is needed to check this
    record.
  - >-
    PLACEHOLDER SPELLINGS ARE DEFINED ONCE. The signoff skill does not document any real-id
    placeholder spelling today. Its examples use only concrete ids such as
    fb_2026-05-14_a3f2c891. This record adds one dedicated subsection to the signoff skill that
    lists every real-id placeholder spelling a copyable example may use. Each spelling is written
    as a code span, so the lint (BO-2000g-3) and the proof (BO-2000g-4) read the list from the
    skill and keep no copy of it. The list must include every spelling already shipped in an
    example: `fb_<date>_<short-hash>` (documentation-verifier, live-surface-tester,
    user-surface-smoker), `<fb_id>` (write-c4-diagram) and `fb_YYYY-MM-DD_XXXXXXXX`
    (test-writer.md ~:1211). The one exception: an example with an unlisted spelling may be
    rewritten to a listed spelling in this same change. Only test-writer.md is declared here, so
    the first two spellings must be listed.
  - >-
    HEADING-SCHEMA-ILLUSTRATION MARK. The signoff skill defines the mark once, as a fixed literal
    token. The definition says which single line the mark annotates, and that it exempts that one
    heading and nothing else in its fenced block or file. Place the mark on three illustrations:
    the signoff skill's heading-schema block (~:721), the ticket-authoring skill's
    Comments-section heading line (~:266), and the building-epics skill's routing illustration
    (~:555, `### YYYY-MM-DD HH:MM — <agent> (status: ok|handoff|blocker|question)`). The criteria
    do not list the third one, but the lint fails on it when it is unmarked. The mark must not
    change how the illustrated heading reads to an agent.
  - >-
    Each corrected example opens with a documented real-id placeholder, never with the failure
    fallback. An example whose default is (submit-failed) invites the hand-typed fallback that the
    KI recorded on 2026-10-10 and 2026-10-13. The fallback stays described where signoff §2a
    describes it. It follows that description when INF-500d-3 changes the form, and no example
    copies the form.
  - >-
    INSERT ONLY. Each corrected example gains exactly one line, the feedback-id line, directly
    under its heading. No existing body line is removed, reworded, re-indented or reordered. The
    inserted line takes the example's own body indentation. Several examples are nested inside
    list items, for example test-writer ~:273 and status-checker ~:230.
  - >-
    In the python-coder red-baseline example (~:332), the feedback-id line goes directly under
    the heading, ahead of `red_baseline_results:`. Placing it anywhere below body line 1 is a
    defect, even though the commit-time check reads two lines (BO-2000g-3-i, BO-2000g-4-i).
  - >-
    After the change, the research-agent entry in signoff §6.1's "before" excerpt (~:845) must be
    identical to its copy in the "after" excerpt (~:858). Today the worked example shows an
    append-only entry gaining a line between before and after.
  - >-
    Do not edit the templates whose examples already comply: user-surface-smoker,
    documentation-verifier and write-c4-diagram. Their spellings are covered by the placeholder
    list. live-surface-tester is edited in exactly one line: the heading of its skipped-run
    sign-off example (~:323, `### YYYY-MM-DD HH:MM — live-surface-tester (status: skipped)`)
    changes its status tag to `(status: ok)`. Nothing else in that file changes: not the
    example's feedback-id line or its `Skipped: <reason ...>` body line, not the ok and blocker
    examples (~:297, ~:307), not the frontmatter, and not the prose that mentions
    `(status: skipped)` (about :10, :37, :52, :67, :90-92, :106, :142, :229-231, :291). See the
    IT PO caveat on that prose.
  - >-
    SHARED FILE WITH INF-500d-3-iv AND INF-500d-3-v. templates/agents/live-surface-tester.md is
    also edited by INF-500d-3-iv (approved), which rewrites the executable capture block in the
    "Feedback Submission (signoff §2a)" section (~:355-380). INF-500d-3-v does not edit this
    template source: it edits templates/agents/_signoff_block.md, which the build appends to the
    deployed live-surface-tester, so the deployed file holds text from all three records. To
    avoid conflicts: (1) this record touches only the one heading line in the "Signoff Comment
    Schema" section (~:294-331) and never the "Feedback Submission" section or the appended
    block; (2) locate the line by its text, not its line number, because INF-500d-3-iv may land
    first and shift lines; (3) if both records are built in one delivery, apply them as separate
    edits to the template source and rebuild once; (4) no record edits the deployed copy
    (ADR-001).
  - >-
    The IT PO verified these locations on 2026-11-16. Line numbers drift, so find each one by its
    text: python-coder.md:332, test-writer.md:273, status-checker.md:230, signoff SKILL.md :721,
    :845, :858, :877, :880 and :894, ticket-authoring SKILL.md:266, building-epics SKILL.md:555,
    live-surface-tester.md:323.
test_intent:
  - clause: "the first line of the example's body (the line directly under its heading) is a `feedback-id:` line"
    needs_test: true
    reason: "Each named example is a separate block in a separate file, and the test must catch both an example left without the line and one with the line below its first body line, as in today's python-coder block."
  - clause: "that line's value is either a real-id placeholder spelling from the signoff skill's documented list (telling the agent to put the id the feedback submission step printed), or the failure fallback exactly as the signoff skill documents it (today `feedback-id: (submit-failed)`)"
    needs_test: true
    reason: "An example given an invented id that looks concrete, `TBD`, or a placeholder spelling the signoff skill does not list would still look fixed, so the value must be checked against the skill's own list."
  - clause: "every body line the example carried before the change (for example `red_baseline_results:` and its test entries) is still present, in its original order, below the feedback-id line"
    needs_test: true
    reason: "A correction that drops, rewords or reorders the red_baseline_results entries or the skip-reason text passes a first-line check while changing what the agent is told to write."
  - clause: "no phase sign-off example uses `feedback-id: (not-a-signoff)`"
    needs_test: true
    reason: "The lint accepts (not-a-signoff) on any example, so only a check over the phase sign-off examples catches a fix that uses the note value in place of a real-id placeholder."
  - clause: "it carries the explicit heading-schema-illustration mark that the signoff skill defines, so a reader can tell it apart from an entry to copy"
    needs_test: true
    reason: "An unmarked illustration makes the lint fail on the corrected tree, and a mark placed on a copyable example instead would exempt the very entry that must be fixed."
  - clause: "it holds exactly one documented list of the real-id placeholder spellings that a copyable example may use"
    needs_test: true
    reason: "The lint and the proof read the list from the skill, so a missing list leaves them nothing to read and a second list lets the two copies drift apart."
  - clause: "that list includes every spelling a shipped example already uses -- `fb_<date>_<short-hash>` (documentation-verifier, live-surface-tester, user-surface-smoker), `<fb_id>` (the write-c4-diagram skill) and `fb_YYYY-MM-DD_XXXXXXXX` (test-writer) -- so none of those examples is rewritten for its spelling"
    needs_test: true
    reason: "A list that leaves out one shipped spelling makes the lint fail on a template that already complies, and only a check of each named spelling against the list catches the gap."
  - clause: "every copyable example in the agent templates and skills that carries a real-id placeholder uses a spelling from that list"
    needs_test: true
    reason: "A new example with an unlisted spelling looks correct to a reader, and only a walk of the whole agent and skill trees against the list finds it."
  - clause: "its heading carries `(status: ok)`"
    needs_test: true
    reason: "The skipped-run heading is one line in one file, and a correction that leaves `(status: skipped)` or picks another of the four values is a text difference a check can see."
  - clause: "its body still states that the phase was skipped and why, in its existing `Skipped: <reason ...>` line below the feedback-id line"
    needs_test: true
    reason: "Changing the status to ok while dropping or rewording the Skipped line would hide that the phase did not run, so the line must be checked in place below the feedback-id line."
  - clause: "no other live-surface-tester example changes its status value"
    needs_test: true
    reason: "A blanket replace of the status tags across the file would also change the blocker example, and only a check of every other example's status catches it."
delivers_to:
  - agent: python-coder
    contract: >-
      Consumed by BO-2000g-3, BO-2000g-3-ii and BO-2000g-4. Delivers the corrected phase sign-off
      examples (including live-surface-tester's skipped-run example, whose heading now carries
      (status: ok)) and three marked heading-schema illustrations, which the template lint checks and
      the real-hook proof commits. Also delivers two definitions in the signoff skill
      (templates/skills/signoff/SKILL.md): the real-id placeholder spellings, each a code span in
      one dedicated subsection, and the literal token of the heading-schema-illustration mark. The
      lint and the proof read both from there. The lint fails loudly when it cannot find either
      one.
expects_from:
  - ac_id: INF-500d-3
    contract: >-
      The failure-fallback marker form "feedback-id: (submit-failed:<reason>:<category>)" and the
      legacy bare "(submit-failed)", from templates/scripts/feedback/submit_failure_reasons.json.
      Until INF-500d-3 and its instruction-surface companion land, the signoff skill documents
      the bare form. This record names the fallback only by reference to the skill and copies no
      form of it, so nothing here changes when the form changes.
