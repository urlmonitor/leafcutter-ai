title: "Root requirements have no parent and child level is exactly one below the parent"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given a root requirement at level L0,
  When its hierarchy metadata is validated,
  Then its parent-pointer field is empty (it has no parent),
  And given any non-root requirement whose parent has level L_parent,
  When its hierarchy metadata is validated,
  Then its own level is exactly one step deeper than its parent
    (an L0 parent has L1 children, an L1 parent has L2 children, an L2 parent
    has L3 children),
  And an L3 requirement is never permitted to have children.
