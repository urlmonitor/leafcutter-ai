id: ACS-100i-6-i
components:
  - ac_store
title: "A record that declares a package surface but omits any of the five spec fields is still refused, and the refusal names each field it is missing"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a record carrying `package_surface: true` whose implementation
    requirements are a structured object supplying the config-schema fragment,
    the reference-file path and the required-skills list, but omitting both the
    N-location rule and the post-write commands,
  When the AC-record validator evaluates it,
  Then the record is refused,
  And the refusal names the N-location rule and the post-write commands as the
    missing fields,
  And the refusal does not name the three fields that were supplied.

  And given the same record with all five fields supplied — the config-schema
    fragment, the reference-file path, the N-location rule, the required-skills
    list and the post-write commands —
  When it is validated,
  Then it is accepted.

  And given a record that does NOT carry `package_surface: true` but whose
    implementation requirements are nevertheless a structured object missing the
    N-location rule,
  When it is validated,
  Then it is still refused for the missing field — the object form is held to
    its full shape whatever the declaration says, so narrowing the trigger
    cannot become a way to file a half-populated structured spec.

  And given a record carrying `package_surface: true` whose structured object supplies the
    config-schema fragment, the N-location rule, the required-skills list and the
    post-write commands, omits the reference-file path, and carries the explicit,
    schema-declared "reference file pending" marker (ACD-2500d-2-i),
  When it is validated,
  Then it is accepted,
  And the same record without the marker is refused, naming the reference-file path,
  And a record carrying the marker that also omits the N-location rule is refused, naming
    the N-location rule — the marker excuses the reference-file path and nothing else.
depends_on: [ACS-100i-6, ACD-2500d-2-i]
