test_spec:
- name: test_three_half_cleared_shapes_are_cleared_and_leave_nothing
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: reachability
  description: "Runs the real maker CLI as a subprocess. Fixture: shop's landing place gets ticket/alpha (empty), ticket/gamma (only the workspace record naming shop), ticket/delta (record plus empty sub-folder build), each made by ensure and then deleting the .git folder and the other content (force-rmtree helper). Each remove --path is answered ok and nothing remains at the location. Uses WorkspaceCase and make_project as in test_bo_4300e_2_iii.py."
  proves_clause: "each of shop's three requests is answered cleared, and no folder or file of it remains at its location"
  code_file: templates/scripts/worktree_remove.py
- name: test_half_cleared_folders_are_not_answered_not_found
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: discrimination
  description: "Same fixture; for each of the three requests assert the code is not NOT_FOUND (the observed defect) and the status is ok."
  proves_clause: "none of shop's three requests is answered \"not found\""
  code_file: templates/scripts/worktree_remove.py
  must_catch:
  - "a maker that still requires the folder's own .git to treat it as a workspace so it answers NOT_FOUND"
  - "a maker that finishes any folder inside the landing place, ignoring the record's project"
- name: test_other_projects_half_cleared_folder_is_refused_and_untouched
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: "Second project blog (make_project) whose landing place holds an empty ticket/alpha left half-cleared. remove from shop for that path is refused NOT_FOUND (exit 2) with a message saying shop has no workspace at that location, and the folder snapshot is identical before and after."
  proves_clause: "the request for blog's \"ticket/alpha\" is refused, stating that shop has no workspace at that location, and that folder is identical before and after"
  code_file: templates/scripts/worktree_remove.py
  must_catch:
  - "a maker that finishes an empty folder in another project's landing place"
- name: test_finishing_half_cleared_folders_sends_nothing_to_either_hub
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: "Hub refs of shop's and blog's bare hubs are identical before and after all four requests, and the requests carry --delete-remote-branch so a push would be visible."
  proves_clause: "no fetch or push reached the shared project of either project"
  code_file: templates/scripts/worktree_remove.py
