id: UXP-601
components:
  - ux_prototyping
  - frontend_coding
readiness: reviewed
priority: medium
title: "Decision and outcome nodes tint by their derived impl_status"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: in_progress
criteria: |
  Given decision diamonds and their outcome targets in a rendered flow,
  When each node's status is resolved,
  Then each decision/outcome node is tinted by its derived impl_status,
  resolved from the live work_status of the acceptance criteria it implements
  (the same derivation that badges ordinary step status in UXP-411 and UXP-412),
  And no hand-maintained per-decision status is trusted over the derived status.
depends_on:
  - UXP-596
doc_links:
  - path: docs/architecture/adrs/ADR-025-first-class-flow-decisions.md
    relationship: specified-by
    status: exists
  - path: docs/product-truth/flows/leafcutter/explore-flows-in-atlas.flow.json
    relationship: implemented-by-step
    status: exists
assigned_agent: frontend-coder
estimated_complexity: M
it_requirements:
  - "The OUTCOME (branch) node must tint by its derived implStatus: rollupStatus in leafcutter-web/lib/data/flows.ts resolves the branch's live status from its ACs' work_status, graph.ts carries it as the branch node's status, and FlowStepNode in leafcutter-web/components/flows/flow-nodes.tsx tints via WORK_STATUS_TONE — the same derived-status path as UXP-411/UXP-412; no hand-maintained per-node status may override it."
  - "The DECISION DIAMOND must tint by its derived impl_status: buildFlowGraph in leafcutter-web/lib/data/graph.ts must resolve and carry a derived status on each decision node and FlowDecisionNode in leafcutter-web/components/flows/flow-nodes.tsx must tint by WORK_STATUS_TONE rather than a fixed AMBER constant."
  - "Status must be derived from AC work_status, never hand-edited (ADR-023 rule 3)."
