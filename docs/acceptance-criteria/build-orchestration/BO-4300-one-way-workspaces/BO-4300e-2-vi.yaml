it_requirements:
- Reuse the existing one-time discard-token mechanism of BO-4300e-3; no second token scheme.
- The token is bound to the folder's resolved path and to a content digest of exactly the listed files;
  any added, removed or changed file invalidates it.
- The token never appears in a log line, a file on disk, an environment variable or a config setting;
  only in the refusal answer.
- Token comparison must be constant-time.
- Remaining files are listed by workspace-relative forward-slash path in a deterministic order, and the
  cleared answer lists the same paths as discarded.
- A folder holding files other than its record and empty folders is never finished without a valid token
  (the half-cleared rule of BO-4300e-2-v must not delete it).
- Edit the template source under templates/scripts/, never a deployed build output (ADR-001); the change
  must reach the deployed maker through the normal build.
- Must keep the existing answer envelope and existing answer codes backward compatible; any new answer
  field or code must be additive.
- Must stay within the project's file-size and complexity limits for the maker modules; if the remove
  module would exceed them, the new logic moves into a sibling maker module rather than raising a limit.
- Every refusal must leave the workspace folder, its repository and its workspace record unmodified (no
  write, rename or delete of any item), consistent with the standing never-delete-unsent-work rule.
test_intent:
- clause: the request is refused, stating that the workspace was half-cleared and that its remaining files
    cannot be checked against the shared project
  needs_test: true
  reason: Telling a half-cleared folder with files from an empty one is a safety decision a test must
    pin.
- clause: the refusal lists "src/app.py" and "notes.txt" by path and returns a one-time token bound to
    that folder and exactly those two files
  needs_test: true
  reason: The token's binding to exactly these files is computed, and a wrong binding would authorise
    the wrong loss.
- clause: '"ticket/epsilon" is identical before and after'
  needs_test: true
  reason: A refusal that alters the folder would lose unsent work, which a before-and-after comparison
    catches.
- clause: when clearing is requested again with that token, it is answered cleared, the answer lists both
    files as discarded, and nothing of "ticket/epsilon" remains at its location
  needs_test: true
  reason: Finishing with a valid token and reporting the discarded files is computed behaviour.
- clause: when, in a second run of the same setup, "notes.txt" is changed after the refusal, clearing
    with the earlier token is refused and "ticket/epsilon" is identical before and after that request
  needs_test: true
  reason: Rejecting a stale token after a file change is the guard against discarding work that changed
    after consent.
