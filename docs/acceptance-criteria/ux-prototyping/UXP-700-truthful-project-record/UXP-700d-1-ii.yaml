test_rationale: |
  A predicate that classifies everything as example content satisfies UXP-700d-1 and
  UXP-700d-1-i completely and empties the project's record. This is the paired acceptable input
  that makes the exclusion rule falsifiable in both directions; without it the separation rule
  is discharged by over-excluding.
test_spec:
  - name: test_projects_own_journey_is_returned_by_the_projects_record
    target_dir: unit_tests/product_truth/
    description: "A journey under the project's own product root appears in the project's record."
    type: integration
    angle: criterion
    framework: unittest
  - name: test_projects_own_journey_is_not_counted_as_example_content
    target_dir: unit_tests/product_truth/
    description: "The set-aside count is unchanged by adding a project-owned journey."
    type: integration
    angle: boundary
    framework: unittest
notes: |
  Recorded in the BA memory as a general rule: any "prove it can refuse" requirement needs a
  paired acceptable input, or it is discharged by widening the guard until it refuses
  everything. This is that pair for UXP-700d-1.

  Today leafcutter's own 11 flows under flows/leafcutter/ are the population this record
  protects.
