id: BP-1300
components:
  - build-pipeline
title: "Every guardrail gives the same verdict everywhere -- a green local run can't hide a real break"
component: build-pipeline
level: L0
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Checks can't be fooled by a dirty local tree -- broken is broken, in CI and on your machine.

  A check that passes on your machine but fails in CI (or the reverse) is worse
  than no check at all, because it teaches you to trust a false green. This goal
  makes the build and authoring guardrails judge the real, canonical source rather
  than whatever happens to be deployed locally, so a genuinely broken registry, a
  missing artifact, or a skipped sign-off looks broken everywhere. It also makes
  the checks that matter block during automated drives instead of emitting a
  warning nobody sees. You get one honest verdict you can rely on, no matter where
  or how the check runs.
