notes: |
  THE FIGURE THAT MATTERS AND THE FIGURE THAT IS EASY TO GET ARE NOT THE SAME, which is
  the whole content of this criterion. BO-3500 states the underlying fact: because
  groups are resolved from the backlog rather than chosen, one unbuildable member
  anywhere in a subtree takes the whole subtree with it, so the share of refused
  STARTING POINTS is higher than the share of unbuildable records. A report giving only
  the second understates the problem, and understates it by an unknown amount.

  THE SECOND SCENARIO IS THE PRODUCT OWNER'S THIRD DEFERRED QUESTION APPLIED TO ITS
  HARDEST CASE. The obvious way to count startable points is to resolve each one's
  group and see. At the measured cost of a full reading — thirty to forty seconds after
  BO-2400c-6, per KI-BO-016 — doing that a few thousand times is not a slow report, it
  is a report nobody will ever run. So it is specified out: both figures come from one
  reading, and reachability is worked out over the whole backlog at once rather than
  per starting point. That is affordable, because reach over a graph already in hand is
  cheap, and it is testable in the shape KI-BO-016's own fix was tested — assert the
  number of readings, never a duration.

  IF THAT PROVES IMPOSSIBLE, the honest fallback is to report the starting-point figure
  over a stated sample and say so, not to drop it and let the record count stand in for
  it. Recorded here so the fallback is a deliberate choice rather than a silent one.

  THE THIRD SCENARIO turns the gap into a work list, the way BO-3500d-2 turns the
  unbuildable count into one. A single requirement blocking two hundred starting points
  is worth more attention than fifty requirements blocking one each, and only the reach
  figure can tell them apart.
