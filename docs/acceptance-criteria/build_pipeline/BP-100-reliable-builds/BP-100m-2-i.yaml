title: "One template deployed to different per-platform directories is not a collision"
component: build-pipeline
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-100-reliable-builds/BP-100m-2.yaml"
criteria: |
  Given a source template that is deployed for two different platforms,
  And the two platforms map that template to DIFFERENT deployed target output
    paths (for example one platform writes to commands/ and the other writes to a
    different platform directory),
  When build.py runs,
  Then the build succeeds with a zero exit status,
  And the guardrail does NOT flag this as a collision, because the two deployments
    land on distinct target paths and neither overwrites the other.
