notes: |
  PROMPT-ONLY. must_catch entries are prose ("drop the retry_due condition"), so
  something must turn each into code, and only an agent can. The fidelity of
  that translation cannot be unit-tested without a template text search, which
  CLAUDE.md forbids. Deterministic backstops that bound the damage of a bad
  translation: TQ-500g-1-ii refuses an alteration that does not load or changes
  nothing; "could not be prepared" leaves the work unfinished (TQ-500b).
  Remaining substitute: pr-reviewer against the Then clauses, and an eval row
  for the preparing agent once one exists (TQ-200 charter).

  WHICH AGENT PREPARES — USER DECISION AT THE BA GATE (Q1, 2026-09-28): an
  agent that wrote neither the code nor the tests. The concrete agent is chosen
  at build time. The criteria stay agent-neutral ("the preparer") on purpose.
  Considered and set aside: the test writer (it wrote the tests, so it would
  be judging its own work) and the coder (it wrote the code, the weakest
  independence). The analysis's working name for a new agent is "test-breaker";
  a new agent is allowed but not required.

  A NAME THAT CANNOT BE PREPARED IS A FINDING, NOT A NUISANCE. It means either
  the requirement names a wrong version of code that was never written (the work
  may be incomplete) or the name is too vague to act on. Both need a human.

  IT-PO ENRICHMENT (2026-09-28)
  llm-expert lane. The runner (-1-i) can be built and tested before this
  AC, using hand-written manifests as fixtures. The routes (-1-v, -1-vi,
  -1-vii) need both.

  BUILD-TIME DECISION (2026-10-07; Decision Kernel decision
  dec-124faaaa3d814050, run run-c730927ae56c4299; the user's choice): the
  preparer is a NEW dedicated agent, test-breaker. Its tools were set to Read
  and Write only, with no Bash and no shell of any kind, so it cannot run
  tests or git. (The tool set was superseded on 2026-10-11; see READ-ONLY
  REDESIGN below.) It is registered through the add-agent-to-package
  procedure (config/agent_registry.json, docs/agents/README.md). This settles
  the "chosen at build time" point above. The criteria stay agent-neutral
  ("the preparer") on purpose.

  READ-ONLY REDESIGN (2026-10-11; Decision Kernel run run-92227a2a275f44ff,
  on a basis the user approved). Read and Write without Bash cannot be
  registered. The registry's verification-flag rules require
  requires_verification: true for any agent holding Write, and that
  post-edit git-diff verification step needs a shell. So test-breaker is
  READ-ONLY (tools: Read, requires_verification: false). It REPLIES with
  exact-match replacements per name ({path, old, new}), or with
  could_not_prepare and a one-line reason. A new deterministic writer step,
  TQ-500g-1-ix (python-coder), validates the reply, makes the altered copies
  outside the working tree, computes every diff and writes the alterations
  manifest. The manifest contract to TQ-500g-1-i is unchanged; only its
  author moved from this agent to TQ-500g-1-ix. Both decisions stand
  together: dec-124faaaa3d814050 (a new agent) and run-92227a2a275f44ff
  (read-only plus writer). Registry category: research (see constraints).

  DISPATCH CONTRACT THE ROUTES RELY ON (TQ-500g-1-v, -vi, -vii; the exact
  shapes are in delivers_to). The route runs three steps in order:
  test-breaker, then the writer (TQ-500g-1-ix), then the runner
  (TQ-500g-1-i). The agent cannot run git, so the route passes it:
    - work_key
    - repo_root: the absolute working-tree root. The Read tool takes absolute
      paths, and the agent cannot ask git for the root.
    - requirement_ids: the AC ids
    - wrong_versions: the named wrong versions (the must_catch strings,
      verbatim), each with the source files in scope as repo-relative POSIX
      paths
  manifest_path and copies_dir are gone: the agent writes nothing. It returns
  one JSON value:
    {work_key, entries: [{name, status: prepared|could_not_prepare,
    reason|null, replacements: [{path, old, new}]}], anomalies: [...]}
  or, on failure,
    {status: "failed", blocker_summary, anomalies}.
  The writer turns that reply into the copies and the manifest and prints the
  manifest path. The runner then takes that path through --alterations. A
  failed or unreadable reply leaves no manifest, so the runner reports every
  owed name as unfinished. The work never reads as owing nothing.

  IT-PO AMENDMENT (2026-10-09): package_surface: true and the structured
  it_requirements object (ACS-100i-6). Registering test-breaker adds an
  agent_registry.json entry, and the check-package-surface-declaration
  commit-msg hook (ACS-100i-8) checks that against this declaration. The five
  earlier list requirements are the first five entries of
  it_requirements.constraints. The object form has a free-text slot
  (additionalProperties: true), so nothing is duplicated here.
