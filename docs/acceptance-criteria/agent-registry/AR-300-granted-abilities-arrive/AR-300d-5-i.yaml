  - scripts/template_compiler.py
notes: |
  THIS IS THE CRITERION THAT DECIDES THE MACRO QUESTION. If the
  `__ticket_phase_agents__` macro were expanded into names during migration,
  ticket-supervisor's declaration would be right on migration day and wrong the
  day a ticket-phase agent is added, with no failure anywhere -- the new phase
  agent simply never appears in the supervisor's permission. Keeping the macro as
  one entry and resolving it on every build (AR-300c-5) is what makes this
  criterion satisfiable. The byte-identical clause is the assertion that
  separates the two designs; a test that edits ticket-supervisor as part of its
  setup passes on the broken one.

  "MARKED AS A TICKET-PHASE AGENT" -- WHERE. Today the flag is authored in the
  registry (`is_ticket_phase`), not in frontmatter. This criterion is satisfied by
  marking the agent wherever that flag is authoritatively declared; it does not
  move the flag. If AR-300c's direction is later extended to make the whole
  registry derived, the flag must move into the agent's own header or the macro
  resolves against a derived copy -- an open item for the user, not decided here.
  Note the tension with AR-300d-5's "no central record entry" clause: that clause
  is about the sub-agent section of the NEW agent's own prompt; being a ticket-
  phase agent is a separate registration decision.

  REVOCATION THROUGH THE MACRO is per agent in the same sense as AR-300d-3: an
  agent un-marked as ticket-phase disappears from every macro holder's prompt and
  from nowhere else.
