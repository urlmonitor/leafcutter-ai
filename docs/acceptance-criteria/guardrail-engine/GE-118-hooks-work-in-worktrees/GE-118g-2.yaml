notes: |
  WHY THE LAST TWO ARMS ARE THE LOAD-BEARING ONES. A stated claimed set is satisfiable by
  an implementation that computes it from the right tree and by one that computes it from
  a hardcoded list — and, worse here, by one that still walks the working directory on a
  machine where the working directory happens to contain only the repository. The two
  varying-population arms are the only shape no such implementation satisfies: add a
  record inside and the reported set must grow by exactly that number; add one outside and
  it must not change at all. The second of the two is specifically the anti-cwd clause,
  and it is the one a single-tree test harness cannot express. This construction is
  reused from BP-1600a-2 rather than reinvented.

  WHY THE DEFECT IS THE DEFAULT AND NOT THE PERFORMANCE, STATED SO IT IS NOT RE-OPENED AS
  A SPEED RECORD. Run from the workspace parent the audit walks 77 sibling checkouts and
  produced no output within five minutes, and was reported as hung. It is not hung. With
  the repository named explicitly it completes in 5.0 seconds. The duration is a
  consequence of auditing 78 trees instead of one; fixing which tree is audited removes it
  without any work on speed. No clause above mentions a duration, no clause may be
  satisfied by making the wide walk faster, and a test that asserts a completion time
  satisfies nothing here.

  AND THE CORRECTNESS CONSEQUENCE THAT MATTERS MORE THAN THE WAIT, WHICH IS THE REASON
  THE FOURTH ARM EXISTS. Walking sibling checkouts means a number claimed only on another
  branch in another tree is reported as claimed here, so a genuinely free number is
  withheld; and the reported claimed set depends on which worktrees happen to exist on the
  machine at the moment of the run, which makes the audit's answer unreproducible between
  two developers. That is a wrong answer, not a slow one.

  MEASURED 2026-10-09 IN THIS WORKTREE, WITH METHOD. `ls` of the workspace parent's
  worktrees directory returns 77 entries. The prior filed note says "~100"; 77 is what is
  there today and the two figures must not be merged. The workspace parent is not a git
  work tree (`git -C` on it exits 128). It does NOT contain `scripts/adr_refs.py`, which
  is why the published bare relative command fails to start from there and the reachable
  path to this defect is the absolute-path invocation the shell convention mandates.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM.

  (1) THE DEFECT ITSELF. MUTATION: restore the working-directory default for the scan
      root.
      MUST GO RED: the first arm (no outside path appears) and the fourth (a sibling's
      new record must not change the reported set).
      MUST STAY GREEN: the second arm and the third, both of which a
      working-directory-defaulting implementation satisfies whenever it is run from the
      repository root. A verification performed only from the repository root cannot
      distinguish the fix from the defect.

  (2) THE LITERAL. MUTATION: return the claimed set observed at implementation time
      instead of reading the repository.
      MUST GO RED: the third arm only.
      MUST STAY GREEN: arms one, two and four. This is why the third arm is stated
      separately from the first.

  (3) THE SILENT SUBSTITUTION. MUTATION: when no scan root is named and no repository can
      be established, fall back to the working directory and report the result.
      MUST GO RED: GE-118g-3's arms, not this record's. Recorded here so the boundary
      between the two is visible: this record owns where the audit looks when a repository
      CAN be established; GE-118g-3 owns what happens when one cannot.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. Those are the IT PO's, as is the question of
  whether this tool reaches the shared resolver by import or by another route.
