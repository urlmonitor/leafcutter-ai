notes: |
  Reuse, do not re-derive: the VERDICT "does this workspace still hold undelivered work"
  is BO-4100c, and "the listing is complete and every leftover clearable" is BO-4100e.
  This record is that finding and clearing are served by the same one door as making
  (decision 4), and that clearing is safe for unattended callers.

  OPEN, NOT DECIDED HERE: Q8 whether removal requires a caller-supplied confirmation
  token. The customer intent is only that authorisation is given up front rather than
  asked interactively (finalize's teardown step deadlocks today on an interactive "yes"
  it cannot give) and that without it, work that never reached the shared project is
  never destroyed.

  Under decision 1 no version-control command lists the workspaces, so "find" cannot lean
  on one; how they are found is for BA/IT PO. Temporary workspaces used for comparison
  runs (finalize's baselines) are workspaces too: they must be made and cleared through
  this door and leave nothing registered in the real project (F14).

  documentation_triggers: how-to -- clearing a workspace by hand, including how to
  authorise the loss of unsent work, is a user-facing action.
