it_requirements:
  - "Default-enforce is the no-mass-migration guarantee: a test with no `# covers:` tag is ENFORCED by default, with zero backfill required across the ~1746-test suite — only a tag resolving to a not-done AC may soften a test; absence of a tag never softens it."
  - "Implemented as the default branch of the SAME TQ-100b-1 session-scoped classifier (untagged -> enforced), not a separate code path."
  - "Must be deterministic under pytest-randomly: an untagged test is always enforced regardless of seed/order."
