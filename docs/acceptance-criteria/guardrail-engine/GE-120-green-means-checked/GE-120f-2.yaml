notes: |
  WHAT THIS RECORD OWNS. GE-126b-5 makes the four values visible when a check reports its own
  result. Visibility is not consequence: a check can carry the never-attempted value in a
  perfectly honest report and still be counted, everywhere else in the system, among the
  protections in place. This record attaches the consequence — named, and the run fails —
  and forbids the counting.

  THE SECOND FAILING CLASS IS THE LOAD-BEARING ONE. Naming a check whose declared rejection
  was not observed is the easy half; that check at least tried. The class that changes
  behaviour is the one that has never been asked. If never-asked does not fail, the whole
  regime is discharged by never asking, and the difference between a guard that refuses and
  a guard that has never been given anything to refuse survives into every report the system
  produces — which is the L1's sentence exactly.

  DAY-ONE BLAST RADIUS IS THE CORRECT OUTCOME AND MUST NOT BE PRE-SUPPRESSED. On the commit
  that lands this, most checks will be named as never demonstrated, because none has been.
  That is the true state. It must not be quietened by seeding exemption records ahead of the
  first run, and the natural remedy for the noise — weakening the rule until it stops
  reporting — is the failure mode this whole tree exists to design against. An honest
  exemption for checks that genuinely count or measure is required and belongs to
  GE-126b-5-i; a postponement is not a ground.

  NO COUNT OF INSTANCES. Records authored the same day disagree, and the parent records the
  figure as disputed and forbids one below it. The final clause makes that mechanical: the
  run states only what it measured. Nothing in this record states or implies how many checks
  have the condition.

  NAMED MUTATION FOR THE FIRST ABSENCE-ASSERTING CLAUSE. "A check whose record says the
  rejection was observed is named in no failing class." ARRIVAL COLOUR: GREEN, vacuously —
  nothing is reported at all today, so no demonstrated check is currently mis-named.
  INJECTION: build the failing set from the registered population minus the exempt, ignoring
  each check's record. Under that injection a check that demonstrably refused is named as not
  demonstrated; this clause must go RED naming it, and must return to green on revert.
  Without this injection the clause has no red baseline and no evidential value.

  NAMED MUTATION FOR THE SECOND ABSENCE-ASSERTING CLAUSE. "No check whose refusal has not
  been observed appears in any statement the system makes about what is protecting the work."
  ARRIVAL COLOUR: GREEN, vacuously — and this is the most misleading green in the record,
  because today the reason no undemonstrated check appears in such a statement is that the
  statement counts every registered check without asking. INJECTION: count a check as
  protection from the moment it is registered. Under that injection every never-demonstrated
  check appears in the protection statement; this clause must go RED naming at least one, and
  must return to green on revert.

  ARRIVAL COLOURS FOR THE REMAINING CLAUSES. Both naming-and-failing clauses are RED on
  arrival — nothing is named and nothing fails. The exemption clause is RED on arrival, since
  no disposition exists to honour. The reasons-are-about-that-check clause is GREEN on
  arrival, vacuously, and its mutation is the shared one below.

  NAMED MUTATION FOR THE ATTRIBUTION CLAUSE. INJECTION: derive one check's class from a
  family-level summary — mark every check in a group as not demonstrated when any member of
  the group is. Under that injection a demonstrated check inherits its neighbour's finding
  and this clause goes RED. It is the same shape as quoting a disputed population figure as
  though it were measured, and it is the reason the clause is written.
