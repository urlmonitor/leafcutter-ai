    state: existing
it_requirements:
  - >-
    Run continuation (IT-PO decision): a declined or unconfirmed clear does not end the run. The
    answer has already been validated and applied, and the clear runs before the caller's commit,
    so ending the run there would leave the stage the person approved uncommitted
    (KI-BO-20261101). The run continues past the gate exactly as after a confirmed clear. This
    refines ADR-070 sec. 5.2-5.3 for this one housekeeping step and is flagged for the person.
  - >-
    Cleared if and only if confirmed: the record is reported cleared only when the clear's
    read-back finds no record. A declined clear, a clear with a non-zero exit, and a read-back that
    finds the record or cannot be read all leave the record in the not-cleared state. The clear is
    sent once, to shell-runner only, and nothing else deletes or rewrites the record.
  - >-
    The not-cleared state is carried into the run's own terminal result as the statement in the
    delivers_to contract, not only as a log line; the [plan-feature][WARNING] line stays as well.
    The statement must agree with the resume how-to's rule against hand-editing records: deleting
    a stale record once nothing waits on the run is the one manual step it names.
  - >-
    A later pause of the same run that replaces the record (ACD-1300e-2) withdraws the statement,
    because the record then names the gate the run is waiting on.
  - >-
    File-size ratchet: templates/workflows-js/plan-feature.js measures 2375 lines under
    count_content_lines ('.js') at 927934e33, against a 1000-line limit, so every measured line
    this change puts in (a changed line counts) must be paid for by about two removed.
  - >-
    templates/workflows-js/plan-feature.js is the source. The deployed .claude/workflows/plan-feature.js
    is rebuilt by python scripts/build.py and never hand-edited.
test_intent:
  - clause: >-
      the run's result states that run R's pause record was not cleared, names the declined step and the agent that declined it, quotes the stated reason, and gives the record's location on disk
    needs_test: true
    reason: Keeping the warning line only is the named mutation, and only the run's result shows the difference.
  - clause: >-
      it states that the record still names a decision point the run has already passed, and that the record can be deleted once nothing is waiting on run R
    needs_test: true
    reason: The gate id and run id in the statement are filled in per run and can be wrong or missing.
  - clause: nothing in the result reports the record as cleared
    needs_test: true
    reason: A cleared flag set before the read-back confirms it would contradict the statement.
  - clause: >-
      the record is left on disk unchanged, and the clearing is not sent to any other agent or done by any other means
    needs_test: true
    reason: A substitute clear is visible only in the dispatch record and the file on disk.
  - clause: the person's answer and the criteria committed for that stage stay as they were
    needs_test: true
    reason: Continuing past a declined clear must not disturb what the answer already did.
  - clause: >-
      when the clearing runs and its read-back confirms no record remains, the result carries no such statement
    needs_test: true
    reason: Without this arm, a result that always carries the statement passes every other clause.
  - clause: >-
      the bug symptom (run wf_4a8567df-505, 2026-10-30: the clearing replied "My role is limited to the two workspace actions, create and remove", only a warning line was logged, and the run's pause record was still on disk after the run had moved past its decision point) must not occur
    needs_test: true
    reason: This is the recorded failure, and it returns if the decline goes back to a log line only.
