notes: |
  THE NEW VERIFICATION SURFACE. Everything else in GE-120c consumes this; GE-120b-1,
  GE-120b-3 and GE-120b-4 declare expects_from against it.

  WHY THE EXISTING TESTS DO NOT COUNT, in the PO's words: today's unit tests for these checks
  import from the source tree, which is precisely the layout in which the bug does not
  reproduce. A test that cannot fail on the observed defect is not evidence. The
  source-tree-off-the-import-path clause is therefore not a stylistic preference — it is the
  single property that makes this harness able to see the defect class at all.

  IT-PO — assignment is deliberate. This is assigned to test-writer rather than python-coder
  because the deliverable is verification apparatus, and the failure mode being guarded
  against is an implementer building a harness shaped to pass against their own fix. If the
  harness and the fixes are built by the same agent in the same pass, the red-baseline
  evidence required by GE-120c-2 is worth much less. Sequence this AC first, capture its red
  result, then implement GE-120b.

  OPEN FOR THE IT-PO: whether "a real second working copy" is a git worktree, a clone, or a
  copied tree is not specified here on purpose. The behavioural requirement is only that the
  source tree is not importable from it and that the deployed layout is what the check sees.
  The worktree route matches how people actually work, which is the L1's standard, but it
  carries the constraint that a worktree shares the object store — relevant if the harness
  runs concurrently with anything else.

  IT-PO ANSWER (2026-08-14): assignment to test-writer CONFIRMED, for exactly the reason the
  BA gave. Mechanism: git worktree recommended, with the shared-object-store caveat and
  guaranteed cleanup recorded as requirements; the binding constraints are stated separately
  from the recommendation so the coder keeps latitude. Home is unit_tests/portability/
  alongside test_build_deployment.py, deliberately NOT unit_tests/commit_guardian/.
