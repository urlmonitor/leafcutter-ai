id: UXP-591-5-i
title: "Leaving a flow while its drawer is open keeps that drawer on the entry left behind"
component: ux-prototyping
components:
  - ux_prototyping
  - frontend_coding
level: L3
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given /flows/leafcutter/flow-render-pipeline?step=resolve is open with the 'resolve' drawer
    open,
  When the person picks "Inside python-coder (the coder's internal workflow)" in the flow
    selector,
  Then the drawer closes and a new history entry at /flows/leafcutter/python-coder-internal,
    with no ?step=, is added,
  And pressing Back returns to /flows/leafcutter/flow-render-pipeline?step=resolve with the
    'resolve' drawer open,
  And drilling with 'Open sub-flow' in an open drawer behaves the same way: from
    /flows/leafcutter/how-acs-are-built?step=code the new entry is
    /flows/leafcutter/python-coder-internal, and Back returns to ?step=code with the
    'Coders make it green (prio 6-8)' drawer open.
depends_on:
  - UXP-591-5
  - UXP-591-4
