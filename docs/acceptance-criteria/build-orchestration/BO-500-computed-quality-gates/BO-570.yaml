    note: "New sibling L1 created to house the local pre-PR/CI verification-gate behaviors (dev-render smoke + repo-ruff) that were mis-parented under BO-530 (a TDD-framed L1). The four gate L2s and their five L3s moved here. BO-530's title is about tests-written-first (TDD); these are a distinct flavor -- local verification gates -- so they earn their own L1. Motivated by two real escapes: an ssr:false render-time-only bug and ruff lint failures that only appeared in CI (worktree pre-commit gap)."
