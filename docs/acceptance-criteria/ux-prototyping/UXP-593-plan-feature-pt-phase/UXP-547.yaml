assigned_agent: frontend-coder
estimated_complexity: M
it_requirements: |
  templates/workflows-js/plan-feature.js commits the flow + regenerated index before the
  BA stage, passes a free-text flow-derivation instruction (flow_ref is inert; the BA
  self-discovers via index.json), and on the technical route with a produced flow forces
  the BA stage in supplying an L1 anchor (the flow's covering L1, else the classifier
  component L1).
