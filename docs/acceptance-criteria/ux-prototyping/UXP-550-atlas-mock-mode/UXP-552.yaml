level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the Atlas is running in mock mode,
  When any view is displayed,
  Then a clearly visible "mock mode" badge appears in the app chrome,
  And the badge is driven by a NEXT_PUBLIC_ mock flag so it is available to the client render,
  And the badge is presentation-only and is never the authority for whether mock data is served,
  And when mock mode is off the badge is absent from every view.
depends_on:
  - UXP-593
doc_links:
