  - name: test_ge122d3ii_no_namespace_root_resolves_from_a_location_written_into_the_pass
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "Every responsible namespace root is read from the project's declared path configuration: changing the declaration changes where the pass looks, for every root, with no code change. Goes red if any root retains a hardcoded default as a fallback."
  - name: test_ge122d3ii_scaffolding_does_not_disturb_grandfathered_unnumbered_diagrams
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: boundary
