notes: |
  THE FAILURE MODE THIS EXISTS FOR is an emptiness guard written as a convenience: "if the
  narrowed set came back empty, use the staged diff" reads like defensive programming and is
  the whole defect reinstated, aimed precisely at the clean auto-merge — the most common
  shape of the observed case. It cannot be caught by any test whose fixture has authored
  content in it, which is every other test in this L1.

  AXIS GUARD. The last clause touches GE-120a-1 deliberately and does not re-derive it.
  GE-120a-1 owns what a check says when it could not look; this clause owns only that the
  two outcomes are told apart, because a narrowing that reports "nothing to inspect" in the
  same words as "could not inspect" would trade a false positive for the false negative
  GE-120a exists to close. If the implementation of that distinction turns out to belong in
  GE-120a-1's output vocabulary, say so rather than defining a second vocabulary here.
target_epic: EPIC-TrustThatAGreenCheckActuallyChecked
