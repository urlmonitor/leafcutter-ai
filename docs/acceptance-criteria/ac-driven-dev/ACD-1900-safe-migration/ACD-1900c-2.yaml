criteria: |
  Given ac_unit_of_work.enforce = false,
  When a migration gate runs against a ticket that lacks the new AC shape,
  Then the gate operates in dual-read/advisory mode and does not block;
  And when ac_unit_of_work.enforce = true, the same gate requires the new shape and
    blocks that ticket.
