title: "Know an agent really behaves the way its instructions promise, because the real agent was asked"
component: testing-quality
level: L0
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Proof of an agent's behaviour comes from the agent itself, not from a stand-in.

  Today, when a requirement says "this agent does X", the only tests that can run
  answer with a scripted reply written for the test — so they prove the script,
  not the agent. A change to the agent's instructions can quietly stop it doing X
  and every one of those tests stays green. After this goal, a behaviour that only
  the real agent can show is proven by actually asking the real agent, as the
  project ships it, and checking what it gives back. You choose when that happens,
  because asking the real agent costs money and needs access; when you do, the
  result is a clear pass or fail for each case, a record is left behind that later
  work can point to, and a run that could not ask the agent at all is reported as a
  failure — never as a pass and never as quietly skipped.
