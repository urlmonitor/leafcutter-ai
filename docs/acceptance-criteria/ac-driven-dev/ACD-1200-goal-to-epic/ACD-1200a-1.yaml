req_status: draft
work_status: todo
criteria: |
  Given the AC store contains goal ACD-050 (level: L0) with this tree structure:
    - ACD-050a (level: L1, covered_by: [ACD-050a-1, ACD-050a-2])
      - ACD-050a-1 (level: L2, covered_by: [])
      - ACD-050a-2 (level: L2, covered_by: [ACD-050a-2-i])
        - ACD-050a-2-i (level: L3, covered_by: [])
    - ACD-050b (level: L1, covered_by: [ACD-050b-1])
      - ACD-050b-1 (level: L2, covered_by: [])
  When /build-ac is invoked with --ac ACD-050,
  Then the system identifies 3 leaf ACs: ACD-050a-1, ACD-050a-2-i, ACD-050b-1
  And it does NOT include the composite ACs (ACD-050, ACD-050a, ACD-050a-2, ACD-050b)
  And the leaf set contains exactly those ACs that have no children (covered_by is empty or absent).
