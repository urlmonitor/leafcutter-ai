notes: |
  Verified empirically: the rendered effective prompt for python-coder included BA/PO/IT-PO
  authoring memory, the Pre-Drive Checklist, and authoring-pipeline instructions. Concerns
  the harness injection channels (agent knowledge plane); may alternatively belong to the
  infrastructure component -- flagged for the user.

  IT-PO enrichment note (2026-08-12): the in-repo, verifiable surface for "effective context
  assembled at spawn" is scripts/render_effective_prompt.py -- the tool that reproduces the
  deterministic subset of the 11 injection channels per role. Role-scoping is implemented and
  verified there. The PRODUCTION spawn-time injection filter (what the live Claude Code harness
  actually assembles, esp. auto-memory channel 9) may be a harness/infrastructure concern beyond
  this file; see caveat raised at the IT-PO gate.
