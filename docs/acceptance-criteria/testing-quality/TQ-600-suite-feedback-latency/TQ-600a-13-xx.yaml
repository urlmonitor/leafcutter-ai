id: TQ-600a-13-xx
components:
  - testing_quality
title: "The finalize workflow reports a pull request held only by Post-merge suite status as held externally, not as merged and not as its own failure"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the finalize workflow is deterministic code, not a prompt, so the agent guidance
    of TQ-600a-13-xviii does not govern the decisions the workflow itself makes,
  And that today the workflow never looks at a pull request's checks before it asks to
    merge, and records the merge step as "merged to main" and finishes the run as a success
    whether or not the merge happened,
  And that a failing `Post-merge suite status` means the correctness lane on main is not
    green or has no fresh verdict, a condition the pull request did not cause unless it is
    the fix (TQ-600a-13-vi),
  When the finalize workflow reaches its merge step for an open pull request and reads
    that pull request's checks,
  Then a check recognised by its exact name `Post-merge suite status` and reported as
    failing is reported as an external hold, quoting that check's held state word for word
    and giving its link, so the run on main and the notice it names reach the user,
  And the workflow does not report that hold as a regression of the branch, does not
    re-run the check or wait on it in a loop, does not push any commit, empty or otherwise,
    and does not add a fix declaration to the pull request's description,
  And no step the workflow takes after reading the checks edits the post-merge workflows,
    the scripts that run them, the family's tunables file, the repository's ruleset or the
    notice issues, and its report says that when the hold check itself is broken only the
    owner's break-glass procedure (TQ-600a-13-xvii) applies, which the workflow never
    performs,
  And when that hold is the only failing check, the merge does not proceed and the run
    ends with an outcome of "held externally", which is distinct from every branch-failure
    outcome, is never reported as a success, and leaves the worktree and branch in place so
    that a later run finishes the merge once the hold lifts,
  And when the hold fails beside any other failing check, the merge does not proceed, the
    run ends as a failure of the branch naming each other failing check as the branch's
    own, and the hold is listed separately as external rather than counted among them,
  And when `Post-merge suite status` is not failing, every other check is treated exactly
    as before, and when no check is failing the run's dispatches, step record and outcome
    are the same as before this change apart from the one added read of the checks,
  And a check whose name merely resembles `Post-merge suite status` is never treated as
    the hold,
  And this is demonstrated by executing the workflow on three recorded pull-request states
    — A, the hold is the only failing check; B, the hold fails beside a real
    `Test suite (pytest)` failure; C, every check passes — and observing the decision each
    one reaches.
