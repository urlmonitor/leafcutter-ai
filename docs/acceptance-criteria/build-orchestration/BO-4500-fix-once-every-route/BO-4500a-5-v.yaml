    framework: unittest
    type: unit
    angle: criterion
    description: "The deployed commit agent template instructs exactly one call of the shared step with the caller's path list and message file and a verbatim relay inside commit_answer."
  - name: test_commit_agent_template_has_no_staging_commit_kill_or_stash_command
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: discrimination
    description: "The deployed template contains no git add, git commit, pkill/kill, git stash or literal model name, and states that a caller-supplied message and trailer are passed as given (KI-BO-20260914, KI-BO-20260925)."
    must_catch:
      - "keep the hardcoded Co-Authored-By footer"
      - "keep Step 0's test-process kill"
