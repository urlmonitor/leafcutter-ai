it_requirements:
  - "THE CANDIDATE SET COMES FROM THE DIRECTORY, NOT FROM THE MANIFEST, and that inversion is the entire point. GE-120c-3 derives its expected set from the manifest, so a guard missing from the manifest is missing from the expected set and is never noticed — the sweep is complete with respect to a registry that is itself incomplete. This AC starts from what was BUILT and asks what was WIRED. Verified 2026-08-25: the guard directory holds 62 check scripts, the operative manifest holds 55 entries, and the deployed registry declares 50 hook identifiers. Do not encode those numbers; they are the reason the axis exists, not the assertion."
  - "MEASURE AGAINST THE DEPLOYED REGISTRY, resolved the way the commit path resolves it in the second working copy GE-120c-1 stands up. Measuring against the source manifest would let a registration that the install never deploys count as wired, which is the same class of evidence as the four guards that are registered nowhere today."
  - "DO NOT MERGE THIS SWEEP WITH GE-120c-3's — THEY RUN IN OPPOSITE DIRECTIONS AND A SINGLE COMPARISON LOSES ONE (IT-PO 2026-08-25). GE-120c-3 traverses manifest to harness and asks 'is every registered check exercised'. This traverses guard directory to deployed registry and asks 'is every built check registered'. Their inputs differ (manifest vs directory), their reference sets differ (harness cases vs deployed registry), and neither's finding implies the other's. Keep TWO independently-failing verdicts with two distinct failure messages, so a reader can tell 'registered but unexercised' from 'built but unregistered'. A future refactor that folds them into one set-difference is a regression, not a simplification."
  - "THE OPT-OUT MUST BE DATA-DRIVEN AND MUST BE DECIDED, not left to the implementer's discretion at review time. A hardcoded identifier list is rejected: it is how check sixty-three inherits an exemption by resemblance, and it is the same rule GE-120c-3 already applies to its own sweepable-entry exemptions. Reuse that mechanism rather than inventing a second one — two independently-maintained exemption vocabularies will disagree. Legitimate exempt shapes to expect include a shared helper that is imported rather than invoked, and a check invoked directly rather than through the hook runner."
  - "A SHARED EXEMPTION VOCABULARY MUST BE SCOPED PER SWEEP (IT-PO 2026-08-25). Reusing GE-120c-3's exemption mechanism is required, and it creates a specific hazard: an exemption declared for the harness-coverage sweep must not silently become an exemption from the registration sweep. A helper module that is legitimately exempt from 'must be exercised by a harness case' is NOT thereby exempt from 'must be registered', and vice versa. Each declaration therefore carries WHICH sweep or sweeps it applies to, and an unscoped declaration is rejected rather than defaulted to both. One vocabulary, one storage location, explicit scope per entry."
  - "PIN THE NEGATIVE CASES AS REGRESSIONS, AND PIN THE PROPERTY AS WELL AS THE NAMES. scripts/build.py and scripts/epic_lock.py must stay out of the verdict in every category. BP-900e-3 exists precisely to stop that false positive and its exclusion rule is stated differently from this one — it excludes by 'not promised by registry or template reference', this sweep excludes by 'not in the guard directory'. Keep both statements distinct and satisfy both; a sweep that flags build.py contradicts an approved sibling AC. Assert the PROPERTY (a script outside the guard directory is never a candidate) alongside the two names, or a third package-development script added tomorrow inherits nothing from this pin."
  - "STANDING FLAG — scripts/epic_lock.py DOES NOT EXIST IN THE TREE (verified 2026-08-25; referenced only by docs/components.json and templates/skills/building-epics/SKILL.md). BP-900e-3's approved criteria name it and are not amended here. For THIS sweep the consequence is concrete: a regression assertion written as 'epic_lock.py is absent from the verdict' is vacuous — a path that does not exist can never be a candidate, so the assertion passes on a completely broken sweep. Pin the property against a package-development script that actually exists, and treat the epic_lock reference as the store-hygiene finding it is rather than as a test subject."
  - "EXPOSE THE COMPARISON AS A CALLABLE the sweep consumes, matching the shape GE-120c-3 requires for its own comparison, so a future gate can consume this verdict rather than reimplementing it."
  - "SELF-DEMONSTRATION IS A DELIVERABLE, following GE-120c-1's precedent: the first run against this repository as it stands must be recorded, and it is expected to name at least check_adr_collision and check_identifier_uniqueness. Record the observed list as evidence on the implementing ticket. Do not encode that expected list as an assertion — it becomes false the day those guards are registered, which is the day the sweep starts earning its place. The durable assertions are the fixture-based ones."
  - "HOME: unit_tests/portability/, alongside the rest of this harness. Not unit_tests/commit_guardian/, whose tests import from the source tree — the layout in which this defect class cannot reproduce."
  - "FILE SCOPE — READ THIS BEFORE TRUSTING THE GENERATED TICKET'S files_touched. This AC creates one new sweep module under unit_tests/portability/ and edits nothing else in the tree. scripts/build.py and scripts/epic_lock.py are named above ONLY as negative regression subjects and MUST NOT be modified; generate_ticket_from_ac.py extracts path tokens from prose bullets and gates them on on-disk existence, so scripts/build.py will very likely appear in the generated ticket's files_touched. That is a generator artefact — correct the ticket, do not touch the file. Editing build.py to make this sweep pass would invert the AC."
  - "Error handling per CLAUDE.md Rules 1-4 applies to the sweep's own directory and registry reads: specific exceptions, logged at WARNING or above, never swallowed. Per GE-120c-1-i, a sweep that could not enumerate the candidate set reports a failure, never a clean result — an unreadable guard directory yields zero candidates and zero findings, which would otherwise be the greenest possible run."
test_spec:
  - name: test_ge120c6_unregistered_candidate_in_fixture_is_named_and_sweep_fails
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A guard-directory fixture holds a check that no entry in the deployed registry resolves to: the sweep reports it by name and FAILS. Exercised against a fixture, not against today's tree, so the assertion still fails on the day guard sixty-three is added."
  - name: test_ge120c6_candidate_set_is_read_from_the_guard_directory_at_run_time
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "Adding a check script to the guard-directory fixture grows the candidate set with no change to the sweep's code, and removing one shrinks it. Goes red if the candidate set is a list written into the sweep, or is derived from the manifest instead of the directory."
  - name: test_ge120c6_verdict_is_measured_against_the_deployed_registry_not_the_source_manifest
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: deployed
    description: "A candidate present in the source manifest but absent from the registry the install actually deployed is reported as unregistered. Measured against the deployed registry in the built second working copy, resolved the way the commit path resolves it."
  - name: test_ge120c6_registration_only_in_the_non_operative_manifest_reads_as_unregistered
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: seam
    description: "A candidate whose only registration lives in the 3-entry templates/commit-guardian/commit_guardian.json — the file the install does not deploy the registry from — is reported as unregistered, because a registration the commit path never reads is not a registration."
  - name: test_ge120c6_declared_optout_candidate_is_reported_as_exempt_with_its_declaration
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A candidate carrying a declared opt-out is reported as exempt TOGETHER with the declaration that exempts it — present in the output, not omitted from it — so an exemption is visible rather than silent."
  - name: test_ge120c6_exemption_scoped_to_the_other_sweep_does_not_exempt_here
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A declaration scoped to GE-120c-3's harness-coverage sweep does NOT exempt the same candidate from the registration sweep, and an unscoped declaration is rejected rather than treated as applying to both. Guards the one hazard created by sharing the exemption vocabulary."
  - name: test_ge120c6_exemption_is_a_data_property_not_a_matched_identifier
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A newly added candidate that merely RESEMBLES an exempt one — similar name, same directory, no declaration — is reported as unregistered. Goes red if the exemption is implemented as an identifier list."
  - name: test_ge120c6_scripts_outside_the_guard_directory_are_never_candidates
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The no-false-positive regression: a package-development script that lives outside the guard directory appears in NO verdict category, neither unregistered nor exempt. Asserts the property against a fixture script placed outside the directory AND pins scripts/build.py by name, so the sweep cannot contradict BP-900e-3."
  - name: test_ge120c6_unreadable_guard_directory_reports_failure_not_a_clean_sweep
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A guard directory the sweep cannot enumerate produces a reported FAILURE, never zero candidates and zero findings. Per GE-120c-1-i, the greenest possible run is exactly the shape of the defect this AC exists to catch."
  - name: test_ge120c6_comparison_is_reachable_as_a_callable_a_gate_can_consume
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "The registry-reachability verdict is produced by one callable that the sweep invokes, and a second caller obtains the same verdict from it without re-deriving the candidate set — so a future gate consumes this rather than reimplementing it."
test_rationale: "This AC exists because a sweep can be complete with respect to an incomplete registry, so the test contract has to attack the two ways this sweep could inherit that same blindness. First, every assertion is fixture-based: 'all of today's candidates are registered' would pass forever and would be silent on the day guard sixty-three is added, which is the only day this sweep matters — and it would be false today anyway, which is the point of the self-demonstration run being recorded as evidence rather than encoded as an assertion. Second, the counts observed on 2026-08-25 (62 scripts, 55 manifest entries, 50 deployed hook identifiers) are motivation and are deliberately absent from every descriptor; encoding them makes the sweep stale the day it starts working. The exemption descriptors are split into three because a data-driven opt-out has three distinct failure modes — silent omission instead of a reported exemption, an identifier list masquerading as a property, and an exemption declared for the sibling sweep leaking into this one — and a single test covers only the first. The scripts-outside-the-directory descriptor pins BOTH the property and the name, because a name-only pin teaches the sweep nothing about the next package-development script and a property-only pin cannot demonstrate that this sweep and BP-900e-3 agree."
