it_requirements:
  - >-
    A FAILURE-ASSERTING TEST MUST MATCH THE REASON, NOT JUST THE FAILURE. If any test
    in this file currently asserts only that the build exited non-zero, tighten it to
    assert the reason before the copy is made smaller. Otherwise the smaller copy
    cannot be distinguished from a correct result and this whole record is
    unverifiable.
  - >-
    THE OMISSION CHECK BELONGS AT THE COPY, NOT IN EACH TEST. One place that refuses
    when a needed path is not present, naming it. Spread across five tests it will be
    added to three of them.
  - >-
    REFUSE, DO NOT DEFAULT. A missing path that yields an empty string or a default is
    the exact silent shape this record exists to prevent, and it is the natural thing
    to write.
  - >-
    THE CONTROL IS NOT OPTIONAL. Three refusal descriptors with no green path are
    satisfied by a copy mechanism that rejects everything.
  - >-
    SIZED AS M, NOT S, AND THE REASON IS THE ORDERING. This looks like a one-function
    change and is not. The first requirement above — tighten every failure-asserting
    test to match its reason BEFORE the copy shrinks — lands in a file of over a
    thousand lines across the three named failure tests at lines 430, 598 and 723; the
    omission refusal lands in a SECOND file, the synthetic-package helper owned by
    unit_tests/build_guards/test_bp_100k_2.py. Two files, and the tightening must
    precede the shrink or the whole record is unverifiable.
  - >-
    THE OMISSION CHECK GOES IN A HELPER TWO OTHER FILES DEPEND ON. test_bp_900g_8_i.py
    and test_acd_2100d_2_i.py already use the synthetic-package helper, and
    TQ-600a-9-iii is working in the second of those concurrently. A refusal added there
    changes behaviour for all three. Either make the refusal opt-in per caller, or
    confirm the other two callers never ask for a path the copy omits — do not add a
    global raise and discover the blast radius at green phase.
  - >-
    THE UNRELATED-FAILURE INJECTION MUST NOT BE A MISSING FILE. The hazard under test
    is a build that fails because the copy is short of something. If the injected
    "unrelated failure" is itself a missing path, the injection and the hazard are the
    same event and the descriptor proves nothing. Inject a failure of a different kind
    — a syntactically valid but semantically rejected declaration, say — so the
    reason-matching is genuinely discriminating.
