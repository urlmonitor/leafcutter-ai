created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g-10.yaml"
criteria: |
  Given a decision taken by looking up a record in a declaring file that ships with
    the install — whether a capability is permitted, whether a feature is enabled,
    whether an actor may perform an action,
  And that declaring file being absent, unreadable, or unparseable in the install
    where the decision is taken,
  When the decision is taken,
  Then it stops and reports that the file the decision is read from could not be
    read, naming the file and the location it looked for,
  And the absent lookup does NOT resolve to a negative answer, because "the file is
    not there" and "the file says no" are different facts and only one of them is
    true,
  And the message describes the unreadable file, not the outcome the absent lookup
    would have produced, so the reader is not sent to inspect a record's contents to
    explain a verdict that no record produced,
  And a record that is genuinely present and genuinely says no still produces a
    denial that names the record — so the fix distinguishes the two cases rather than
    permitting everything,
  And when the file is present, the lookup returns the answer the record states, so a
    capability the record grants is not withheld.

  Because on 2026-08-18 the plan-feature workflow read an absent agent registry,
  evaluated the resulting empty lookup to "not permitted", and halted reporting that
  an agent's charter did not permit shell commands — while the source registry
  plainly permitted them. The operator was handed a permission problem to disprove,
  in a record that was fine, about a rule that was never consulted. Nothing in the
  message pointed at the missing file. The shape is general: an absent record read as
  a boolean is false, and false is a verdict.
