title: "Red-baseline gate halts when a batch test will not go red"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the red-baseline script runs the batch's tests before any implementation and
    finds at least one batch test that already passes,
  When the red-baseline check completes,
  Then the loop halts before the coder agent is dispatched
  And the halt report names the offending test and its associated AC id.
depends_on: [BO-2400a-3]
