    target_dir: unit_tests/
    framework: unittest
    type: unit
    description: "Reader given a native object (not a string) returns it identical with no string parsing attempted."
  - name: test_native_array_returned_unchanged
    target_dir: unit_tests/
    framework: unittest
    type: unit
    description: "Reader given a native array (not a string) returns it identical with no string parsing attempted."
