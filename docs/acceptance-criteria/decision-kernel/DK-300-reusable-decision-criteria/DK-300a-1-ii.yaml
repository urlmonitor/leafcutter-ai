criteria: |
  Given the published category cat-1dc11c5a2ffa7310 with the preferred wording "Can it be built and verified as one ticket?" and members from dec-4673055ef54113d5, dec-acdfd972fcaca478 and dec-d53e1c52cd47c832,
  And the candidate cat-73d233fc8b15c735 from an earlier mining run still awaits a person,
  When a person runs the mining again over the same published records and run history,
  Then no new candidate is proposed whose wordings are labels of cat-1dc11c5a2ffa7310,
  And cat-73d233fc8b15c735 is not proposed a second time under another id,
  And cat-1dc11c5a2ffa7310 is unchanged by the mining run,
  And a newly published decision whose criterion asks "Can it be built and verified as one ticket?" is reported as a sighting for cat-1dc11c5a2ffa7310, for a person to review, rather than as a new candidate.
