assigned_agent: business-analyst
estimated_complexity: S
it_requirements:
  - "Assignment follows ACS-500g-6: the blinding rule is a section of the same pattern record's parameterised body, written literally because it does not vary per agent."
  - "THE EXISTING HARNESS ALREADY HAS THE RIGHT SHAPE — reuse it rather than invent one. scripts/evals/agent_eval_config.json separates `input_field` (what the agent is given) from `expected_field` (the recorded answers), and run_agent_eval.py builds the prompt from input_field only. Express the blinding rule in those terms so an implementation is a configuration of the existing harness, not a parallel one."
  - "State the invariant as a property of the prompt actually sent: the string handed to the agent contains the row's input material and contains neither the expected-items content nor their count. That is checkable; 'the material carries no marker' alone is not."
  - "'Otherwise indistinguishable from normal operation' has a concrete meaning in this repo: the material must be a REAL on-disk artifact of the kind the agent normally receives, not a synthetic fixture typed by hand. See docs/how-to/real-artifact-fixtures.md and docs/reference/fixture-policy.md — a synthetic fixture reproduces the bug-hiding bias and makes a round pass on material the agent would never see."
  - "The seeded count is itself a leak. Do not report 'N defects were seeded' in the task, in the round header, or in any telemetry the agent can read — an agent that knows N stops when it has found N."
  - "Round status must be three-valued (pass / fail / invalid) so 'invalid' is expressible; this is the same tri-state ACS-500g-6-i requires. The overall verdict cannot be pass while any round is invalid — that is a separate rule from the all-or-nothing pass rule and must be stated separately."
  - "An invalid round is re-run with cleaned material; it is not silently rescored. The invalid result stays on record (results are append-only, scripts/evals/results/) alongside the re-run."
  - "CAVEAT: the leaked-answer-key detection and the invalid round status have no implementation today — the existing harness has no notion of an invalid round. Like the all-or-nothing verdict in ACS-500g-6-i, enforcing this needs a seeded_gap scoring mode in scripts/evals/run_agent_eval.py (python-coder). Raise it as a follow-up AC; do not claim it enforced."
delivers_to:
  agent: business-analyst
  contract: "The blinding section of the agent-evaluation pattern body: the prompt sent to the agent under test contains only the round's input material — no seeded-item markers, no seeded count, no answer key; material is a real on-disk artifact; a round whose material exposed the recorded answers is status 'invalid', the overall verdict cannot be pass while any round is invalid, and the round is re-run on cleaned material with the invalid result retained."
