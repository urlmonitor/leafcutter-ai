id: DK-300e-1
title: "Trace recognition work separately from intent and later evidence reads"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given a new recognition pass and subsequent intent and research work,
  When its observations are recorded,
  Then recognition, resolution and projection are distinguishable within the pre-intent boundary,
  And the trace records the permitted index fingerprint and coverage, per-family detected and resolved counts, ambiguity and unknown counts, lookup work, elapsed time, serialized sizes, omissions and truncation reasons,
  And traces expose incomplete scanning separately from card omission,
  And the initial pass records zero enrichment-owned model calls,
  And intent model calls and later evidence reads belong to distinct observations rather than being credited as avoided work,
  And trace values obey the same redaction and scope rules as the context projection.
depends_on: [DK-300e]
