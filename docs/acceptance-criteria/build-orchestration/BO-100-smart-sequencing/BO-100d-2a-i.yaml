id: BO-100d-2a-i
components:
  - build_orchestration
readiness: approved
priority: high
title: "Remediation that makes a failing probe pass lets the drive proceed"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given /build-feature is invoked for an epic with at least one ready ticket,
  And the install's telemetry location query has printed an absolute stream path
    (for example /home/dev/proj/debugging/logs/agent_telemetry.jsonl),
  And the first pre-drive feedback-sink reachability probe against that printed
    path fails because its log directory is absent,
  When the remediation step creates the missing log directory and the probe is
    retried,
  And the retried append to the same printed path succeeds,
  Then the drive proceeds past the pre-dispatch stage and dispatches
    ticket-supervisors normally,
  And no hard-block operator message is shown,
  And the earlier first-attempt failure does not cause the drive to halt.
depends_on: [BO-100d-2a, BO-100d-1a]
doc_links:
  - path: docs/architecture/agent_delivery_workflows.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "When the directory-absent remediation makes the re-probe succeed, the gate must treat the overall probe as PASS and proceed to normal dispatch — the earlier first-attempt failure must not latch the drive into a halt state."
  - "No hard-block operator message may be shown when remediation resolves the issue; the recovered path is silent-success (aside from any WARNING-level log of the transient first-miss)."
  - "Idempotent: across first-probe + remediation + re-probe, exactly one probe line ends up appended to the absolute stream path printed by the telemetry location query."
  - "Dual-surface parity (the KI-3 lesson): the remediate-then-proceed outcome must be identical whether the drive enters via build-epic.js or via the build-feature.md prose gate, since both use the single shared probe helper."
delivers_to: null
expects_from:
  ac_id: BO-100d-1a
  contract: "The shared pre-drive sink probe helper exposing the full first-probe -> mkdir-and-reprobe -> success sequence and a single typed PASS result on recovery. This L3 specifies the recovered-success branch (transient first-miss followed by a successful re-probe -> proceed)."
