documentation_rationale: |
  The how-to written under BO-2800e covers reading the value report and acting on what it
  says, and the silent-check section is part of that one report — a second how-to would
  describe the same surface twice and the two would drift apart. Nothing here introduces a
  separate surface, workflow, or state machine of its own.
change_target: pipeline
risk_surface: internal
notes: |
  WHY THIS IS A SEPARATE BENEFIT FROM THE OVERRIDE RATE. Zero-yield and high-override are
  different diagnoses with different remedies, and collapsing them into one "low value"
  number gives the wrong advice for both. Overruled-a-lot means the check is wrong too
  often. Never-fired means nobody has ever tested whether it is right at all — the check
  may be misconfigured, pointed at nothing, or never reached, and retiring it would remove
  a guard that was never actually on duty.

  THE EVIDENCE, FROM A LIVE MINING PASS OVER THE RECORDED HISTORY. Nine checks show zero
  blocks across every run on file. Five of them, with their run counts: llm-expert 0/84,
  ac-fulfillment-gate 0/15, user-surface-smoker 0/14, ac-validator 0/11,
  change-scope-reviewer 0/1. Treat these as the worked examples at decomposition — they are
  the real corpus, not an illustration.

  BEWARE THE DENOMINATOR. 0/1 and 0/84 are not the same finding. A check that has run once
  and not fired has told you nothing; a check that has run eighty-four times and not fired
  has told you something. Any L2 that reports a bare zero without the number of runs behind
  it is reporting noise as signal — the run count must travel with the zero.

  SILENCE HAS AT LEAST THREE CAUSES, AND THIS L1 MUST NOT PRE-JUDGE WHICH. The check runs
  and genuinely finds nothing (the code is clean); the check runs but can never produce a
  blocking result by construction (advisory by design); or the check never really runs at
  all (misconfigured or unreachable — see the BO-2900 link). Report the silence and the
  evidence; leave the verdict to BO-2800e, which is where the remedy is chosen.

  DEPENDS ON BO-2800a AND BO-2800b, NOT ON BO-2800c. The zero-block finding falls out of the
  mined corpus and the per-check problem counts. It does not need override rates, and wiring
  it behind BO-2800c would block a cheap, immediately useful report behind the most expensive
  measurement in the tree.
