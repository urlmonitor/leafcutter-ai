it_requirements:
  - >-
    Sec. RS.2 states that the re-invocation passes, besides resumeFromRunId and args.resume_answer,
    the paused run's own workspace answer as args.workspace, passed verbatim as sec. WS.2 requires
    (never re-typed, trimmed or re-shaped). The answer comes from ONE maker command for that
    workspace's kind and slug using the maker's locate verb (docs/how-to/get-a-workspace.md), which
    never makes a workspace, or is the maker answer the session already holds for that run.
  - >-
    No startup verdict and no other argument is added on a resume (ACD-2100d-5's start contract).
  - >-
    When the maker refuses (for example NOT_FOUND), the skill stops and reports the maker's answer
    verbatim. It never makes a new workspace for the resume, because a fresh workspace holds
    neither the paused run's record nor its drafts.
  - >-
    The resume arguments in sec. RS.2 are shown in a form the support module of ACD-2100d-5-i can
    read from the installed skill, so the resume can be checked behaviourally with the arguments
    the skill gives.
  - >-
    Sec. RS.3's provenance obligation is unchanged. The command template has no resume step and is
    not edited.
  - >-
    templates/skills/plan-feature/SKILL.md is the source and gains a DECISION HISTORY entry; the
    deployed .claude/skills/plan-feature/SKILL.md is rebuilt by python scripts/build.py and never
    hand-edited.
test_intent:
  - clause: the resumed run passes every check made before triage with no startup verdict or other argument added by hand
    needs_test: true
    reason: A resume is a second start that runs the same startup check, and a fix to the first start alone leaves every resume halting.
  - clause: it reaches the product-owner decision point, applies the answer, and continues
    needs_test: true
    reason: Passing the startup check is not enough if the resume cannot find its record in the workspace it was given.
  - clause: it works in the same workspace run R was paused in, and no second workspace is made for it
    needs_test: true
    reason: Running the maker to make a workspace on resume is the obvious repair, and it silently loses the paused run's record and drafts.
  - clause: >-
      the bug symptom (KI-ACD-20261022: a start without a hand-run startup verdict "returned status error" with "No workspace-setup permission pre-flight verdict was supplied in args" and dispatched no agent) must not occur on the resume
    needs_test: true
    reason: This is the recorded failure on a fresh start, and the resume path reaches the same check.
