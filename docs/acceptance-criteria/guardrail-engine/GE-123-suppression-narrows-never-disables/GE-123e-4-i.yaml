id: GE-123e-4-i
components:
  - commit_guardian
title: "When the merge relief cannot read what came in, the check says so instead of quietly passing or blocking every merge"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a conflicted merge of "main" into "feature" in the ticket file
    "tickets/00_inbox/TICKET-demo.md", whose resolution appends the heading
    "### 2026-11-16 11:00 — conflict-resolver (status: ok)" with no feedback-id line,
  And the incoming side's copy of that ticket file cannot be read when the check
    runs,
  When the merge is concluded with an inline message,
  Then the check does not refuse the commit,
  And the error stream carries a warning that names
    "tickets/00_inbox/TICKET-demo.md", says its sign-offs were not verified, and
    says the incoming side of the merge could not be read,
  And the check reports the could-not-check outcome, not a clean pass.

  Given the same repository with no merge in progress,
  When an ordinary commit appends the same heading with no feedback-id line,
  Then the commit is refused,
  Because a fault in the merge relief may open only the merge it could not judge.
    It must never look like a check that ran and found nothing, and it must never
    reach an ordinary commit.
depends_on:
  - GE-123e-4
