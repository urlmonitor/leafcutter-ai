notes: |
  THE ONE-OFF CLEARANCE OF THE EXISTING POPULATION. Keeping it from refilling is
  ACS-1400a; surfacing it is ACS-1400b; the durable fix for the largest slice is
  ACS-1400d. This L1 is the deliberate pass over what is there now.

  THE FRAMING THAT MATTERS MOST, AND IT INVERTS THE OBVIOUS ONE: the risk here is
  not failing to repair. It is repairing. A bulk repair tool already exists and is
  one command away; the originating brief, read literally, is an instruction to run
  it. Doing so would reverse a deliberate decision the store paid a hook bypass to
  make and would perform 25 writes with done-proof consequences. THE DELIVERABLE
  OF THIS L1 IS THE ADJUDICATION, NOT THE WRITE. Every criterion should be
  readable as "and here is how we know we did not damage anything."

  THE FOUR POPULATIONS ARE IN THE L0 NOTES AND MUST BE HANDLED SEPARATELY — do not
  let a criterion say "reconcile the orphans." Briefly: six deliberate (never
  repair), twenty-six where the field is carrying test paths instead of child links
  (repair has teeth; ACS-1300a-3 abstains on these and so should this until
  ACS-1400d settles the field), about five on retired records (needs a convention
  decision first), and roughly ten of plain drift (the straightforwardly safe
  repairs). NOTE WHAT THAT ARITHMETIC IMPLIES: the unambiguously-safe population
  may be as small as ten of the forty-seven. An L2 that promises to clear 47 is
  promising the damage.

  EVERY GUARANTEE HERE IS SATISFIED BY A TOOL THAT DOES NOTHING — this is the
  single most important test-design constraint in the L1, and it is why the pairing
  discipline is not optional. "Left the parked records alone", "was byte-stable",
  "changed no done-proof verdict" are all trivially true of a no-op. Each must be
  asserted in the SAME invocation as a repair that genuinely happened, exactly as
  ACS-1300a-3's pairing test does it. Split across two runs, the safety half is
  vacuous.

  ABSTENTION IS REPORTED, NEVER SILENT. A record left alone must appear in the
  report naming the record and the reason. A silently skipped record is invisible,
  and invisibility is the same defect one level down — which is the defect this
  entire tree exists to remove. Use ACS-1300c-3's single abstention channel; do
  not add a second format.

  THE RETIRED-PARENT CONVENTION IS A DECISION, NOT AN IMPLEMENTATION DETAIL, and
  it should be taken by a person before any code is written. TKT-100 lists its
  seven successors and omits the two retired L1s they replaced; that reads as
  deliberate and arguably correct, and "repairing" it would add retired records
  back into an active parent's child list. Settle it, write it into ac-schema.md's
  status lifecycle, then implement it.

  NEVER WRITES work_status — inherited from the L0 as a refusal, and this is the
  record where it will be most tempting, because the motivating investigation was
  a sweep of composites marked done with unfinished children. Correcting the child
  set and re-judging the done claim are two acts. Only the first is here.

  A NOTE ON WHAT "DONE" LOOKS LIKE FOR THIS L1: not "zero orphans". A store where
  the scan reports six deliberate exclusions, clearly labelled as such, is a
  HEALTHY store. Any criterion that binds success to a count of zero will force
  the six wrong repairs to achieve it.

  DOCUMENTATION: `[how-to]`. A person runs this deliberately against the whole
  store and must be able to read what it decided per record — especially the
  abstentions, which are the output that matters most here. No sequence-diagram:
  one pass over one store.
