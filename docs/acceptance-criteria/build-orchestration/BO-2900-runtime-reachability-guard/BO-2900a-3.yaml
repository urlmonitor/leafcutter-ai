notes: |
  THIS IS THE CLAUSE THAT CATCHES THE ACTUAL REGRESSION. It is not a variant of
  BO-2900a-1 and must not be folded into it.

  In the state that shipped, the fast-lane module exposed NO command surface at all.
  Under BO-2900a-1 alone that state is out of scope — there is no way in to compare
  the run against — so BO-2900a-1 would have passed it. The functions were reachable
  from nothing: not from a command surface, not from an importing module that had one,
  not from any automation. That is the condition this AC refuses.

  BOUNDARY vs BO-2900b — READ BEFORE IMPLEMENTING EITHER. BO-2900b inventories the
  capabilities the product REGISTERS and demands a caller for each. In the regression
  state, ZERO capabilities were registered, so BO-2900b's forward check passes
  vacuously — there is nothing in the inventory to be uncalled. BO-2900b catches the
  later shape (a capability exists and nothing calls it); this AC catches the earlier
  one (there is no capability and nothing reaches the code). Both are required to
  cover the regression end to end, and neither implementer may treat the other as
  covering their case. This asymmetry is easy to miss and expensive to rediscover.

  DECIDABILITY. "Nothing reaches it" is stated as three concrete conditions — no way
  in of its own, not reached from a unit that has one, not run as a program by any
  automation — precisely so it does not degrade into an open-ended call-graph
  question. If the three prove insufficient in practice, amend the list; do not
  replace it with a vaguer predicate.

  THE ANTI-RITUAL CLAUSE. "Adding a further passing test leaves the verdict unchanged"
  is load-bearing. The reflex when a done-proof gate refuses is to write another test.
  Here that is exactly the wrong response, and the criteria say so, so the refusal
  cannot be worked around by the same behaviour that created the problem.

  Verification must EXECUTE the evaluation against a fixture unit that genuinely has
  no way in, and then against the same unit after one is added, asserting both
  verdicts.

  2026-08-13 (IT PO enrichment). Condition (3) is the one cross-family dependency in
  the BO-2900a tree: it consumes BO-2900b-3's invocation collection rather than
  growing a second, weaker notion of "is this run as a program". That is why this AC's
  expects_from points across to BO-2900b-3 even though its depends_on stays within the
  a-family — the ordering constraint is real and the implementer must build b-3's seam
  first or stub it behind the same interface.
