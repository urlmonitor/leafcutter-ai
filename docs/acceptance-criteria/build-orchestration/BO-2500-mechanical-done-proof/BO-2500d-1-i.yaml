estimated_complexity: M
it_requirements:
  - "The guard must reject two distinct classes of change to the fast lane: (a) the removal of any of the three mechanical proof-of-done gates from the set that establishes done-ness (red-baseline, green-plus-coverage, covers-tag linkage), and (b) any wiring under which an LLM verdict substitutes for one of those gates — a mark-done path reachable on a verdict where a gate did not pass, or a gate result read conditionally on a verdict."
  - "The guard must NOT reject the presence of a reviewing agent as such. A veto-only reviewer with all three gates intact and unconditional is the shape BO-2400f-11 shipped and BO-2500d-1 permits; a guard that blocks it is over-broad and would have to be worked around, which is how this guard would be lost."
  - "The set of mechanical gates the guard requires must be data-driven, read from one declaration, not a hard-coded triple restated at the guard site — so adding a fourth mechanical gate does not silently leave the guard checking three."
  - "Fail closed. An unreadable lane definition, an unresolvable gate set, or a parse failure is a rejection stating that the effect on done-ness could not be determined — never an acceptance on the grounds that no violation was seen. Follow the plain-falsy read used for the red-baseline gate_passed key; no default-true, no `|| true`."
  - "Validation must be idempotent and deterministic for a given lane definition."
  - "Covering tests must EXECUTE something: the guard itself, invoked against a mutated lane definition and asserted on its returned rejection; and, for the substitution class, the lane under unit_tests/_workflow_engine_harness.py (run_workflow_under_e2) driven so a verdict would substitute for a failing gate, asserting no mark-done dispatch is recorded. A test that greps a workflow source file for an agent name or a phase name is not acceptable evidence — that is exactly what this criterion has been green on since 2026-07-21, against an orphaned runner (CLAUDE.md, 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep')."
  - "The replacement tests must carry the SAME '# covers:' ids as the assertions they replace, so scripts/ac_store/done_proof.py sees no change in linkage."
delivers_to: null
