notes: |
  F1 and the incident's steps 3-4: status-checker refused the resolver on charter grounds, and
  the workflow then re-sent the resolution command to worktree-agent instead of halting. F13:
  today's harness executes every dispatched command, so a refusing agent is never modelled --
  the proof for this record must model one.
