notes: |
  Migration / back-compat path from the existing position-encoded ids to stable UIDs.
  The BA should decompose at L2: a one-time migration that assigns each existing AC a
  UID and populates its parent/level/order metadata from its current id; a back-compat
  guarantee that existing references either keep resolving or are rewritten in the same
  migration; and a verification that the migration leaves zero dangling references
  (relates to scan_ac_orphans.py / check_ac_parent_covered_by.py). This is the
  highest-risk L1 (estimated_complexity L) because it touches the whole store at once.
