criteria: |
  Given a package-surface requirement for which the technical planner has supplied the other
    four package-surface fields and the file-aware step has not yet run,
  When the user runs the approval step,
  Then the requirement stays at "reviewed" with the reason "reference file pending",
  And the technical planner's stage is not failed for the missing reference file,
  And once the file-aware step has named the reference file, validation of the five
    package-surface fields runs exactly as before this change, failing and naming each
    missing field.
