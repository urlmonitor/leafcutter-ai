title: "Stale recovery worktree is reclaimed by the recovery path before it creates its own worktree"
level: L3
component: finalize
status: active
parent: FIN-100c-4
criteria: |
  Given a prior interrupted finalize run left a recovery worktree at the
    deterministic recovery path (the Step-0 baseline path suffixed with
    "-recovery")
  And a new finalize run reaches the null-baseline recovery attempt, which reuses
    that same deterministic recovery path
  When the recovery attempt prepares to create its temporary main-HEAD worktree
  Then it first reclaims any pre-existing worktree registered at that recovery
    path and deletes the leftover directory, before creating the new worktree
  And the reclaim is performed by the recovery path itself, not left to rely on
    the Step-0 stale-baseline glob incidentally matching the recovery path
  And the subsequent worktree creation therefore succeeds, rather than failing
    with a path-already-exists error that would be misreported as a checkout
    failure and trigger a false conservative halt (FIN-100c-9)
depends_on:
