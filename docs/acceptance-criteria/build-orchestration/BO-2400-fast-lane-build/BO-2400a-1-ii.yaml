id: BO-2400a-1-ii
components:
  - build_orchestration
title: "A command output too large to relay is handed over as a file in the run's workspace, named by path and hash, and checked by whoever reads it"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the lane states, in one place, a size limit for command output relayed verbatim
    — call it L bytes,
  And a command step run by the command-step-runner (BO-2400a-1-i) whose output is
    larger than L — for example the resolved connected set of a large subtree, or the
    assembled context bundle,
  When the command-step-runner replies,
  Then the reply does not carry the output itself: it carries the absolute path of a file
    inside the run's own workspace that holds the output byte-for-byte, the length of
    that file in bytes, and a hash of those bytes stated by the command that produced
    them,
  And a command whose output is exactly L bytes or fewer is still returned verbatim, as
    BO-2400a-1-i requires, so the two outputs either side of the limit take different
    forms.

  Given a reply that hands over a file by path and hash,
  When the workflow passes it on,
  Then the workflow relays only the path, the length and the hash, because the workflow
    engine cannot read files itself,
  And the workflow never claims to have seen, checked or forwarded the file's contents.

  Given an agent that receives a path and hash as its input — the next command step, or a
    context-carrying agent receiving the bundle,
  When it reads the file,
  Then it uses the contents only when the hash of the bytes it read equals the stated
    hash,
  And when the file is missing, a different length, or has a different hash, it uses
    nothing and returns a decline naming the path, the expected hash and what it found,
    which the run reports as a declined step (BO-2400f-5-iii).

  Given a run that handed over one or more files this way,
  When the run commits and opens its pull request,
  Then none of those hand-over files is part of the commit or the pull request.
depends_on: [BO-2400a-1, BO-2400a-1-i]
