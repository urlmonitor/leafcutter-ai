it_requirements:
  - "Edit the existing surfaces. Do not create a new doc. The retirement steps go in docs/how-to/ac-traceability-store.md, extending the existing 'If this AC is superseded by a newer one' passage at about line 452 into one retirement section shared with ACS-900d-3. The lifecycle wording goes in the Status Lifecycle table of docs/reference/ac-schema.md, the superseded_by and superseded rows at about lines 198-199."
  - "The guide must state the exact retired rule as implemented: status superseded_by (canonical) or superseded (older form), with a non-empty superseded_by naming records that exist anywhere in the store, none of which is the record itself. It must state that status deprecated with no successor is NOT exempt and keeps the forward rules (user decision 1)."
  - "The guide must state the composite rule: a retired child neither blocks nor proves its parent, and a live parent whose children are all retired needs its own covering test (user decision 2)."
  - "Gate names must match the hook ids users see in refusals: check-done-proof (covering-test proof and composite rollup) and check-ac-schema (test contract, successor and self-supersession structural checks, schema shape), plus check-ac-parent-covered-by (parent/child links)."
  - "Retire the false sentence. ac-schema.md currently says superseded records are 'excluded from active enforcement'. Replace it with the split between forward rules (exempt) and structural rules (still enforced). Do not delete the row."
  - "Write this only after ACS-900d-4's behaviour is merged or on the same branch, and verify every gate claim against the implemented hooks, not against the AC text. If ACS-900d-4-ii reconciled the 'superseded' status enum, the doc must describe the reconciled state."
  - "Edited docs must pass check-doc-frontmatter, check-doc-links and check-doc-length. The doc-length ratchet limits growth, so keep the retirement section compact."
delivers_to: null
