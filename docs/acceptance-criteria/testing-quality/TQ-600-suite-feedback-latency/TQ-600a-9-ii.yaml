test_spec:
  - name: test_tq600a_9_ii_the_tracked_files_file_starts_two_builds_not_three
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "run_child_session() over unit_tests/build_guards/test_build_leaves_tracked_files_clean.py, no --splits, LEAFCUTTER_SHARED_LAYOUT_EXECUTION_LOG set"
    description: >-
      Run the file in ONE child session with the execution log pointed at a scratch
      file, and count the `deploy_executed` lines it received. The count is 2, and all
      four of its tests pass. Counted from real emitted signals, never from a patched
      subprocess.run — a mocked build cannot leave a tracked file dirty, which is the
      only thing this file exists to detect.
  - name: test_tq600a_9_ii_the_build_still_targets_the_tree_it_was_cloned_into
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "the target directory is pointed at a sibling directory, so the build stops self-targeting and exercises the directed path instead of the worktree-bootstrap path this file covers"
    description: >-
      Read the `target_dir` field of the `deploy_executed` entries the run emitted and
      assert the target directory and the package root resolve to the same tree.
  - name: test_tq600a_9_ii_the_clone_has_no_hardlinks_into_the_real_repository
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "the --no-local option is dropped from the git clone at line 25, so the clone's object store is hardlinked into the real repository and a build inside the clone can reach it"
    description: >-
      Inspect the clone the run produces and assert its object store is independent of
      the real repository's — not that the option string is present at the call site,
      but that the produced clone's objects are its own.
  - name: test_tq600a_9_ii_the_second_build_runs_on_an_already_built_tree
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "the caching is changed so the clone is handed out unbuilt, which leaves the file green while its idempotence assertion compares an untouched tree against itself"
    description: >-
      Assert the tree the second build runs against carries the output of a prior
      build — check for the artifacts a completed build leaves, such as the
      .build_manifest.json the shared-layout publish gate already keys on. This is what
      stops the idempotence assertion becoming an assertion about an untouched clone.
  - name: test_tq600a_9_ii_the_two_non_building_tests_are_unaffected
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The two tests in the file that never start a build pass unchanged and start no
      build after the change either.
test_rationale: |
  Every descriptor here except the count is a guard on a property that the saving could
  plausibly destroy, and each names the mutation that would destroy it. That shape is
  deliberate: the saving itself is one build and is trivially verifiable, while the
  three properties it endangers — self-targeting, clone independence, and a second
  build that actually follows a first — are each the kind of thing that can be broken
  without any test noticing.

  The idempotence descriptor is the subtle one. Sharing a cached clone is sound only
  because the clone has already been built once; a future change to the caching that
  handed out an unbuilt clone would leave the file green while asserting nothing.
