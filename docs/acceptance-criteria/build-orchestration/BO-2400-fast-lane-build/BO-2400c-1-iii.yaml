id: BO-2400c-1-iii
components:
  - build_orchestration
  - injection_builder
title: "The prompt a dispatched fast-lane agent receives is the assembled bundle"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run that dispatches its phase agents to build a connected set,
  When each build-context-carrying agent is dispatched — at minimum the test-writer and
    the coder, the two that receive the run's working context,
  Then the prompt that agent receives is the bundle the prompt-caching layer assembled:
    the stable layers first, then the cache breakpoint, then this run's volatile layers,
  And the bundle reaches the agent verbatim — what the layer produced is what is sent,
    not a summary of it, a re-worded version of it, a subset of it, or a pointer to
    where it could be found,
  And the criterion is satisfied only by what the dispatched agent receives: a run that
    names the layer, invokes it, and then composes its prompts some other way does not
    satisfy it, however faithfully the layer was called.

  Given the bundle cannot be obtained for this run — the assembling command fails, or it
    returns nothing the run can use,
  When the run reaches the point at which it would dispatch those agents,
  Then it reports that the context bundle was not obtained and names it as the reason,
  And it does not quietly fall back to prompts composed some other way, so a lane that
    is not assembling its context is visibly different from one that is — rather than
    looking identical from the outside, which is how this went unnoticed.
depends_on: [BO-2400c-1, BO-2400c-1-ii]
