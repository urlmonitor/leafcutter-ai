notes: |
  Authored by /quick-fix. Root cause: The static pre-commit scan decides 'composite' by
  level (L0/L1 only) instead of by non-empty covered_by, contradicting
  scripts/ac_store/done_proof.py::_verify_composite_eligible (BO-2500a-6), which
  mark_ac_done.py uses and which treats any AC with non-empty covered_by as a composite.
  Fix: treat an AC as a composite when its covered_by is non-empty (any level), in both
  places, keeping the existing guard that every child must be done-and-covered.

  Follow-up correction (same day, in-progress /quick-fix): the first fix over-widened
  "composite" to mean "covered_by is non-empty", but this store ALSO uses covered_by on
  a LEAF to record the covers-tagged test file path(s) that prove it (this AC's own
  record is a real example: covered_by names its unit test file, not a child AC).
  Treating every non-empty covered_by as composite therefore misread every such leaf's
  test path as an unresolved child AC id and reported it as an unproven child — the
  pre-commit hook then refused to commit this very ticket's own staged files. Fix:
  compositeness (in both check_staged_done_proofs and _unproven_composite_children) is
  now decided by "covered_by contains at least one AC-id-shaped entry" via the shared
  _composite_child_ids/_looks_like_test_path helpers — an entry is excluded as a test
  path when it contains a path separator or ends in a recognised test-file extension
  (.py/.ts/.tsx), mirroring (in spirit) scripts/ac_store/done_proof.py's own
  store-resolvability convention (_has_resolvable_child/_resolve_all_child_ids). An AC
  whose covered_by holds only test paths is now correctly classified as a leaf and still
  requires its own covers tag.
