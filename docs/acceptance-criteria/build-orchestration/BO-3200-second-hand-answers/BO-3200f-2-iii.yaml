it_requirements:
  - "IT-PO DECISION -- ASSIGNMENT CONFIRMED python-coder. The surface is the Claude Code guardrail hook scripts, a machine-readable bypass-variable declaration they read, and the hooks reference table that must agree with it. Hook sources and their deployed copies are edited together and verified through the build round-trip (ADR-001)."
  - "DEFERRED, LOW PRIORITY, NOT DROPPED. User decision (a), 2026-09-16: BO-3200f-3's authoring-time check is the load-bearing enforcement point now and this run-time half comes later. priority stays low and roadmap_phase stays unset; scheduling is the user's or the Product Owner's call."
  - "ONE DECLARED SET OF BYPASS VARIABLES, READ BY EVERY ENFORCEMENT POINT. Each guardrail bypass variable is declared once, in machine-readable form, with the guardrail that honours it, the value that bypasses, and its unidentified-caller policy. The run-time refusal reads that declaration and hard-codes no variable name. Today the declaration holds four: COMMIT_AGENT_MODE (enforce_commit_delegation), CLAUDE_NO_DOC_UPDATE (documentation_guard), INLINE_WORK_GUARD_MODE (inline_work_guard) and CLAUDE_NO_README_CHECK (readme_read_guard) -- the fourth is in the hooks reference's escape-hatch table and enters through the fifth scenario from day one. The Bypass / Escape Hatches table in docs/reference/claude-code-hooks.md must agree with the declaration mechanically (it currently omits COMMIT_AGENT_MODE and enforce_commit_delegation is absent from the hook catalogue); BO-3200f-3's authoring-time check should read the same declaration rather than the prose table (recommended follow-up on BO-3200f-3, not edited here)."
  - "A NEW ESCAPE HATCH IS REFUSED BY DECLARING IT, WITH NO CHANGE TO THE REFUSAL. The fifth scenario is met only if adding a variable to the declaration is the whole change. A guardrail that honours a bypass variable absent from the declaration must fail a coverage check at commit time, so a new escape hatch cannot be added outside the declaration and escape the rule silently."
  - "BOTH ROUTES ARE REFUSED FOR THE EXECUTOR: the variable set for the command in its text, in any shell form that sets it for that command (not only a leading whitespace-separated token, the match KI-CG-20260907 records), and the variable present in the environment the executor's command runs in."
  - "CALLER IDENTITY COMES ONLY FROM WHAT THE HARNESS SUPPLIES AND A COMMAND CANNOT SET. Never from the command text, an environment variable, a marker file, a working directory or the dispatch prompt: each is mintable by the caller, which is the whole defect KI-CG-20260907 records. The PreToolUse payload documented today carries tool_name, tool_input and session_id and names no agent. The implementer must establish from the live payload whether an agent identity is supplied and record the finding in the stdin contract of docs/reference/claude-code-hooks.md. If none is supplied, every call is an unidentified caller and the policy below applies to all callers of that guardrail; that consequence is reported to the user before this record is marked done."
  - "IT-PO DECISION -- THE LAST SCENARIO, RESOLVED PER GUARDRAIL, declared as data next to each variable (policy 'block' or 'state'): CLAUDE_NO_DOC_UPDATE (documentation_guard) -> BLOCK; INLINE_WORK_GUARD_MODE (inline_work_guard) -> BLOCK; CLAUDE_NO_README_CHECK (readme_read_guard) -> BLOCK; COMMIT_AGENT_MODE (enforce_commit_delegation) -> STATE. Reasons: the first three are convenience or debugging overrides whose fail-closed cost is re-running without them. COMMIT_AGENT_MODE has live, unattended, legitimate non-executor callers (the fast lane's commit phase, ticket-supervisor auto-authorisation, the top-level session under docs/agents/conventions.md); blocking every unidentified caller would break the fourth scenario wherever the payload names no agent, and the pre-commit hook chain still runs on the commit itself (KI-CG-20260907). A STATE decision lets the command through only while writing, in the same decision on the guardrail's error output, the guardrail, the variable and that the caller could not be identified. Any variable declared later defaults to BLOCK; STATE requires a recorded user decision on that declaration."
  - "NO SILENT ALLOW, INCLUDING ON INTERNAL ERROR. The hooks convention of exiting cleanly on an internal error must not honour a bypass: if the guardrail cannot read its payload or the declaration while a bypass variable is present, it proceeds as though the variable were absent -- its ordinary check decides -- and writes the error to its error output."
  - "COMMIT_AGENT_MODE CONFLICT -- THE NON-REMOVAL RULE. Neither this record nor BO-3200f-3 may remove, rename or narrow a bypass variable for non-executor callers, strip one from a shipped command, or repoint the fast lane's commit step (COMMIT_AGENT_MODE=1 git commit, issued by the commit agent in Phase 5) to the executor. If BO-3200f-3's inventory reports that step -- as a mis-addressed chore, or as bypass_variable after someone repoints it -- the report stands until a recorded user decision on how the commit step is authorised (KI-CG-20260907); it is never cleared by repointing the step and never by deleting the variable from its command. The fourth scenario is pinned on that exact shipped command shape, so removing the bypass fails a test rather than degrading silently."
  - "GUARDRAILS THAT DO NOT SEE THE EXECUTOR'S TOOLS ARE NOT WIDENED BY THIS RECORD. The executor holds shell only (BO-3200f-2 containment 1); per the hook catalogue, documentation_guard, inline_work_guard and readme_read_guard match Edit|Write. Which guardrails a shell command reaches is read from the shipped hook settings, not from the catalogue. Where a guardrail's matcher covers no tool the executor holds, the implementer reports it as a caveat (see notes) and does not widen the matcher inside this record."
  - "ENFORCE WHERE IT RUNS. The refusal lives in the guardrail hooks registered in the shipped settings, not in a helper nothing calls; any shared module a hook imports is added to the build deploy manifest in the same change (CLAUDE.md). The block uses the documented PreToolUse block outcome with a message that names the guardrail and the variable, in a form BO-3200f-1-i's mapping reads as guardrail_blocked with blocked_by set."
  - "NO EXEMPTION KEYED TO THE EXECUTOR (BO-3200f-2 containment 3; user decision (b)): the change adds no allow rule, settings entry or hook exemption for the executor or its capture invocation. Identifying the executor may only ever make a guardrail stricter."
  - "Must not add perceptible latency to tool calls: the bypass decision completes in under 100 ms per call on a typical payload, measured on the deployed hook."
