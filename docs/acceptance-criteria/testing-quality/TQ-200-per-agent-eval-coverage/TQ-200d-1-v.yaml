notes: |
  Work item 2. Code: scripts/evals/produced_tests_runs.py (write_ac_records,
  judge_verdict, wrong_version_run) and possibly scripts/build_orchestration/_wvr_verdict.py.

  BA addition (unasked-for, keep): the second scenario. The request names "the shared
  wrong-version runner verdict"; that verdict also gates real builds, where every
  must_catch test that survives must keep blocking. The fix is to be made on the
  eval side (which entries carry must_catch / are blocking, or how the eval judges
  the verdict), never by loosening the build gate. If the IT PO finds the shared
  verdict must change, it needs its own AC under the build-orchestration tree.

  The "tagged test fails on the fixed version" clause keeps a broken test set from
  passing because one test happens to fail under the wrong version.

  IT-PO (2026-11-02).
    - Decision: eval-side fix in judge_verdict; the shared verdict is not touched, so no
      build-orchestration AC is needed. The alternative in the KI (must_catch only on the
      test meant to catch, or to-run-later extras) was not chosen: it needs the eval to
      guess the catching test before the run and would drop the other tagged tests from the
      fixed-version baseline, which the 'tagged test fails on the fixed version' clause needs.
    - Overlap: TQ-200d-5-iv also edits produced_tests_runs.py (a tolerant delete helper
      next to remove_tree :133-141); different functions, no ordering needed. Same reference
      page as TQ-200d-1-iv and -1-vi (budget <= +15 lines here).

  OPEN QUESTIONS (for the user at the final gate).
    - OQ-1v-1: the third Given names the first live run's refresh-gate output as a probe
      fixture, but only re-run 1 and re-run 2 were kept (the first live run predates the
      keep-outputs change of PR #1386). The Then clause names only the re-run 1 and re-run
      2 files. Recommendation: build with the two kept re-runs and treat the first-live-run
      mention as covered by them (same row, same three survivors per the KI table); the BA
      may reword the Given.
    - USER DECISIONS carried over: OQ-6 (docs stay with this AC's implementing agent);
      OQ-7 (legacy test_spec, no test_intent).

  USER DECISIONS (2026-11-03, final gate).
    - Approved, priority high. Build order: TQ-200d-5-iv first, then 1-iv, 1-v, 1-vi, 2-iii, 4-v, 4-vi.
    - OQ-1v-1 answered: build with the kept re-run 1 and re-run 2 outputs only; the first live run's output was never kept.
