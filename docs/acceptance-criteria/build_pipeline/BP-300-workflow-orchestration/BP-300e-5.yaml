test_spec:
  - name: test_all_agent_parse_sites_route_through_tolerant_reader
    target_dir: unit_tests/
    framework: unittest
    type: unit
    description: "Structural audit: every enumerated agent-reply parse site across the five workflow scripts routes through parseAgentJson; no bare JSON.parse or strict ternary on agent output remains."
  - name: test_tolerant_reader_body_identical_across_workflow_scripts
    target_dir: unit_tests/
    framework: unittest
    type: unit
    description: "Parity: the inlined parseAgentJson body is byte-identical across every workflow script that contains it (guards the chosen inline placement against drift)."
  - name: test_build_feature_run_tolerates_prose_wrapped_reply
    target_dir: unit_tests/
    framework: unittest
    type: integration
    description: "Replay a prose-wrapped reply through build-feature; the run continues to its next stage."
  - name: test_finalize_feature_run_tolerates_prose_wrapped_reply
    target_dir: unit_tests/
    framework: unittest
    type: integration
    description: "Replay a prose-wrapped reply through finalize-feature; the run continues to its next stage."
