  - "The merge-relief description also states two things. First, a conflicted revert and a conflicted cherry-pick get the same relief as a merge (gate decision 2). Second, the 'either side' rule is a check-local exception to the incoming-side-only shared derivation (ADR-038 §4). That exception is stated in, or cross-referenced from, the 'Merge-Aware Checks' section, with a relative link to ADR-038 Amendment 3 (docs/architecture/adrs/amendments/ADR-038/amendment-3-feedback-id-either-side-heading-relief.md, written under GE-123e-4). Without it, that section contradicts its own statement that the author's own content is always inspected."
