notes: |
  F5's sandbox run: without Developer Mode, WinError 1314 on both links, bootstrap failed and
  left a half-made worktree. Decision 2 (real install files, never a symlink) is the answer;
  this record is its observable. The migration plan asks for this to run for real on a Windows
  runner without Developer Mode, not only with a simulated failure.
