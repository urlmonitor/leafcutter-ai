  contract: "The refusal wording for the build-source copy: the fact that it names the copy run and a runnable route to the enforcing copy, and the fact that it makes no setup-repairable claim. GE-126c-4 documents which copy enforces and records the pre-repair workaround, and must describe the message a reader will actually meet."
expects_from:
