  - clause: 'it says what the check requires: a feedback-id line beneath that heading'
    needs_test: false
    reason: This is reference prose, checked at review against the shipped check, with no executable behaviour of its own.
  - clause: it says that a commit made by a person and a commit made through the shared commit step get the same verdict
    needs_test: false
    reason: The behaviour itself is proven by GE-123e-1's real-commit tests, and this clause only requires the reference to say so.
  - clause: it says how a real id is obtained by pointing at the sign-off skill's section §2a, without restating a second procedure
    needs_test: false
    reason: Whether the text points rather than restates is a review judgement on prose, not executable behaviour.
  - clause: 'for an entry that signs nothing off it points at the sign-off skill''s one documented value, "feedback-id: (not-a-signoff)", and gives no other'
    needs_test: false
    reason: The value's single definition is owned and tested by BO-2000g-2, and this clause only requires the reference to point at it.
  - clause: it says that nothing in a commit message, the current one or any earlier one, switches the check off
    needs_test: false
    reason: The behaviour is proven by GE-123e-2 and GE-123e-2-i, and this clause is reference prose checked at review.
  - clause: 'it describes the merge relief: while a merge, revert or cherry-pick is being concluded, a heading identical to its copy on either side of that operation is not judged, a heading added or changed during the resolution is judged, and when the incoming side cannot be read the check announces that it could not verify the sign-offs'
    needs_test: false
    reason: The relief and its could-not-check path are proven by GE-123e-4 and GE-123e-4-i, and this clause is prose checked at review.
  - clause: none of them tells a reader to put it in a commit message, Because a reference or prompt that still offers the dead escape hatch sends its reader down the same dead end the refusal no longer offers
    needs_test: true
    reason: A search over the real shipped prompt files is a cheap executable guard against the dead bypass being reintroduced, or surviving in a copy no one has read.
