expects_from:
  ac_id: BO-4300a-1
  contract: ensure/locate CLI with --kind epic --slug <raw identity>; the maker performs normalisation.
package_surface: false
it_requirements:
- 'ONE SCHEME (Q4, DECIDED user 2026-09-28): the maker''s single naming table normalises every request to
  the identity <kind>/<slug> for every kind (ticket, feature, ac, fastlane, epic, scratch); the slug is a
  deterministic lower-case form of the raw identity made of letters, digits, ''-'' and single ''.'' separators,
  with no leading or trailing ''-'' or ''.'', no ''..'' and no ''.lock'' suffix, so <kind>/<slug> is always
  a valid line-of-work name and exactly one folder below <landing-root>/<kind>/. A raw identity whose
  normalised form is empty is a usage error (status error, code USAGE, exit 64) naming the identity; nothing
  is written and no default slug is substituted. EPIC-FilesStayWorkable, epic/files-stay-workable and the
  display title Files Stay Workable all give epic/files-stay-workable. A new line of work is named
  by the identity; the workspace lands at <landing-root>/<kind>/<slug> (landing root per BO-4300b-2); the
  answer''s kind and slug are always the canonical ones. Distinct works never collide.'
- 'LEGACY ALIASES (Q4): the legacy spellings are declared in that same table, keyed by kind, each entry
  with its reason -- epic <- EPIC-<Name> (feature skill); ac <- ac-authoring/<slug> (create-ac-worktree);
  fastlane <- fast-lane/<slug> (create-fastlane-worktree). A
  request in a legacy spelling resolves to the canonical identity and the same workspace; there is no second
  table or per-caller mapping. No spelling is declared as an alias of one kind while it is canonical for
  another: feature/<slug> always resolves to kind feature. The retired setup-ticket''s feature/<slug> lines
  are feature lines; their built-for-ticket record (BO-400e-3-ix) stays with the branch.'
- 'NEVER ORPHANED: when the hub carries a line of work for the identity only under a legacy spelling, ensure
  resumes THAT line (BO-4300d-4 semantics: line_of_work ''resumed'', every commit kept, never reset, never
  pushed) and never starts a line under the canonical name beside it; the hub branch is never renamed. The
  answer''s branch and the marker''s branch name the actual branch; kind and slug stay canonical.'
- 'NEVER TWINNED: when more than one spelling of the same identity already carries a line of work on the
  hub, the maker refuses with code AMBIGUOUS_LINE (status refused, exit 2; field lines [branch], added to
  the BO-4300c-2 contract) naming every such branch, and creates, moves, merges or renames nothing. A legacy
  git worktree registered in the main checkout for any spelling of the identity is refused OCCUPIED_LEGACY_WORKTREE
  wherever its folder is (BO-4300d-3-i), so a new clone is never made beside it.'
- Matching is on the exact normalised identity, never a prefix or substring (the '_worktree_exists' prefix
  table and finalize's branch-substring match are retired).
- A re-request never abandons an existing line of work for a freshly named twin and never moves or resets
  its commits (F10, KI-BO-20260921 'abandons the epic worktree branch').
- Answers conform to the result contract delivered by BO-4300c-2 (one JSON object on stdout, status/code/exit
  mapping, workspace_path absent on every non-ok answer).
- Proof runs the DEPLOYED maker -- the copy an install delivers, resolved through the shared test locator
  delivered by BO-4300f-4 -- as a separate process against real temporary git repositories with a real
  bare hub. No mock of git, no import of the maker module, no grep of its source (CLAUDE.md 'Gate / Workflow
  ACs -- Verify Behaviorally, Not by Grep'); a test never falls back to the templates/ source copy.
- 'Tests must not spawn the package''s own scripts/build.py (CLAUDE.md ''Tests must not spawn their own
  build.py''): the deployed maker comes from the shared deployed layout, and fixture projects carry a
  minimal stub build entry point that installs a real, rejecting hook in well under a second. A test that
  must mutate the package and build its own copy says so and justifies it in its ticket.'
- All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
  isolated global and system config; afterwards the developer's own repository's branches, registered
  worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_same_epic_requested_via_other_spelling_returns_existing_location
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: With a ready workspace for 'Files Stay Workable' obtained as kind epic, requests using
    the feature skill's EPIC-FilesStayWorkable spelling and the build route's spelling are both answered
    ok with the existing workspace_path.
- name: test_one_workspace_and_one_line_of_work_exist_after_rerequests
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: Afterwards the landing place holds one workspace for the epic and the hub and workspace
    hold one line of work for it.
- name: test_existing_commits_survive_rerequests
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: Both commits remain on the workspace's line of work, with unchanged shas.
- name: test_distinct_epic_gets_its_own_location
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: '''Files Stay Portable'' is answered ok with a different workspace_path.'
- name: test_legacy_epic_spelling_lands_on_the_canonical_epic_workspace
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: With no workspace yet, ensure --kind epic --slug EPIC-FilesStayPortable is answered ok with
    kind epic, slug files-stay-portable, branch epic/files-stay-portable and workspace_path at <landing-root>/epic/files-stay-portable;
    a second request spelled epic/files-stay-portable returns the same workspace_path.
- name: test_every_declared_legacy_alias_resolves_to_its_canonical_identity
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: Table-driven over the declared aliases -- EPIC-X (epic), ac-authoring/x (ac), fast-lane/x
    (fastlane) -- each request is answered ok with the canonical <kind>/<slug> and the
    same workspace_path as the canonical spelling of the same work.
- name: test_legacy_line_on_the_hub_is_resumed_never_twinned
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: With the hub carrying EPIC-FilesStayPortable (two commits) and no epic/files-stay-portable,
    a request for the epic is answered ok with line_of_work resumed and branch EPIC-FilesStayPortable, both
    commits are in the workspace, and afterwards the hub has no epic/files-stay-portable ref and the legacy
    ref is unchanged.
- name: test_two_spellings_with_lines_on_the_hub_are_refused_ambiguous_line
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: With the hub carrying both EPIC-FilesStayPortable and epic/files-stay-portable, each with
    commits, the request is refused AMBIGUOUS_LINE (exit 2) whose lines name both branches, no workspace_path
    is emitted, no folder is created and both hub refs are unchanged.
- name: test_dot_only_or_empty_identity_is_usage_and_writes_nothing
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: ensure with --slug '..', '...' and '' is each answered status error, code USAGE, exit 64,
    naming the identity; no folder, branch or marker is written and no default slug is substituted.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer, its exit code, and the state of the workspace, the hub and the main copy afterwards.
  A direct-import unit test would pass while the deployed copy is stale or mis-deployed (F13), and a git
  mock cannot show the half-made and occupied states this family exists to handle.
