it_requirements:
  - "Implement the composition in scripts/ac_store/scope_boundary.py as an explicit set DIFFERENCE: bundle_boundary = union(members' declared exclusions) MINUS union(members' derived change surfaces). A union of the members' exclusions is the single most likely defect in this L1 and produces a false blocker on essentially every real bundle."
  - "REUSE `_build_files_touched()` from scripts/ac_store/generate_ticket_from_ac.py for the minuend -- do not re-derive the change surface. If reuse requires promoting it out of the generator module, EXTRACT it (single definition, both callers import it); do not copy it. Two derivations of the change surface will drift, and the drift shows up only as an intermittent false blocker."
  - "KNOWN DEGENERACY, MUST BE STATED IN THE MODULE DOCSTRING RATHER THAN HIDDEN: a member whose it_requirements is still null derives an EMPTY change surface, so for an un-enriched bundle the difference degenerates to the union. This is correct behaviour, not a bug, but a reviewer who meets it cold will read it as the union defect this AC forbids."
  - "The empty case must be an empty boundary, never a complement. Forbid any derivation of the form 'every path no member named' -- with no declared exclusions the boundary is the empty set."
  - "Deterministic and order-independent: the same members supplied in any order must produce a byte-identical sorted result, so the composition can be diffed across runs and cached."
  - "Read every member's exclusions through the ACD-1600g-1 three-state seam. A member with an ABSENT boundary contributes nothing to the union AND must stay individually distinguishable in the composed result, because ACD-1600g-4 needs to name which members had none."
  - "Carry per-path provenance through the composition: for each path in the result, retain the set of member AC ids that excluded it. A bare set of paths loses this irrecoverably and makes ACD-1600g-3-i unimplementable without redoing the composition."
  - "Route every path comparison through a SINGLE normalisation seam so ACD-1600g-2-i can implement mixed-grain matching in one place. Scattering the comparison across the union and the subtraction guarantees the two halves normalise differently."
  - "Performance budget: composition over a 50-member bundle completes in under 100 ms. This runs on a pre-commit / phase-agent path, not in a batch job."
  - "Canonical source only -- scripts/ac_store/ in the source tree, never a deployed .claude/ copy (ADR-001)."
