notes: |
  WHY THE L1 CUT IS SHAPED THIS WAY (do not re-cut at L1).
    The obvious cut — one L1 per numbered thing (requirements / tickets /
    decisions / diagrams) — was rejected. It produces four near-identical ACs
    that each re-specify the same guarantee against a different file pattern,
    and it hides the fact that the interesting differences are not between the
    namespaces but between the KINDS of failure and the STRENGTH of the promise.
    The cut used instead is by distinct user-visible guarantee:
      - GE-120a — the invariant itself: one number, one thing. This is where all
        four namespaces are enforced, because for this guarantee they genuinely
        are the same requirement applied four times.
      - GE-120b — coverage of that invariant: a thing that never takes a number
        can never collide, so no uniqueness promise can ever see it. Without
        this L1, GE-120a is a guarantee with an opt-out. Distinct benefit,
        distinct failure mode, distinct evidence.
      - GE-120c — what happens on a hit: being told which two things collide and
        what to do about it, rather than just being stopped. Remediation quality
        is what decides whether the guard is useful or merely obstructive.
      - GE-120d — the strength of the promise: it holds at every stage of the
        work and cannot be bypassed or quietly self-disable. Separate from (a)
        because a correct rule that can be waved through is not a guarantee.
      - GE-120e — the starting point: the drift that already exists is repaired,
        not grandfathered. A guard added on top of a store that already contains
        a collision certifies a broken state as clean. Separate benefit, and the
        only one that is one-time rather than standing.

  ALL FOUR NAMESPACES ARE IN SCOPE, WITH DIFFERENT MOTIVES (user decision).
    Requirement ids and ticket ids are being REPAIRED (drift observed today).
    Decision-record numbers are currently healthy — contiguous, no duplicates,
    no gaps — so guarding them LOCKS IN a good state and protects it from the
    same erosion, rather than fixing a present defect. Frame their benefit that
    way; do not invent a defect for them. Diagram sequencing has no collisions
    but a large opt-out population, which is exactly why GE-120b exists.

  THE DRIFT HAS THREE SHAPES — ONLY THE FIRST IS A COLLISION.
    1. Two unrelated artifacts claim one number (observed: a requirement id
       claimed independently by two different documents, at two different levels
       of the hierarchy, minted from two different working copies; this is the
       third such incident recently, an earlier one was resolved by renumbering).
    2. An artifact takes no number at all, so it can never collide and no
       uniqueness pass will ever see it (observed: a substantial set of diagrams
       carrying no sequence number, despite an allocator existing for exactly
       that purpose). Drift by abandonment.
    3. One number, two files in different lifecycle locations, free to disagree
       about the state of the work (observed on a handful of tickets).
    Shapes 1 and 3 are both "one number must mean one thing" and live in
    GE-120a; shape 2 is a different promise and lives in GE-120b.

  WHY NOTHING CAUGHT ANY OF IT — the structural point the BA must preserve.
    The existing validation is per-file: it opens one artifact at a time and
    judges it in isolation. A per-file check is structurally incapable of
    noticing that a second file elsewhere claims the same number. No existing
    gate performs a whole-collection pass. The fix is therefore a change in the
    UNIT of inspection, not another rule added to the per-file validator.

  HONESTY CONSTRAINT ON THE REMEDIATION PROMISE — load-bearing, see GE-120c.
    The user's request was for the gates to "say a specialist should be brought
    in to fix the numbers". What each stage can actually do differs, and the ACs
    must not promise more than the stage can deliver: the stage that runs while
    the author is still working is the only one able to actually bring a
    specialist in; the stage at commit time and the stage in the shared build
    can block and explain, but cannot summon anyone. Precedent for the first
    exists in this project already. There is also an anti-precedent that must not
    be repeated: another guard is DOCUMENTED as automatically dispatching a
    specialist and does not — it is hard-wired to report success and its
    remediation path is a placeholder. A documented-but-dead remediation path is
    worse than none, because authors believe they are covered. Every promise in
    this tree must be true of the stage it is written about.

  RELATIONSHIP TO THE STABLE-IDENTITY WORK — do not close either as a duplicate.
    An approved requirement in the requirements-store component already states
    the same uniqueness invariant, but it is a child of a large, approved and
    entirely UNBUILT restructure that replaces today's position-encoded numbers
    with position-independent ones. The user chose deliberately to DECOUPLE:
    GE-120 enforces uniqueness on the numbering scheme in use today and ships
    now, without waiting for that migration; the other requirement carries the
    same invariant forward to the future scheme. They are complementary and
    sequential. Nothing in the stable-identity tree may be edited, reopened, or
    re-authored by this work.

  Authored at the PO stage; L0/L1 only. The BA decomposes to L2/L3 and the IT PO
  adds the technical constraints.
