it_requirements:
  - "DO NOT BUILD THIS FROM SCRATCH. `templates/hooks/check_ticket_state_integrity.py` already performs exactly this detection — basename duplicates across lifecycle folders plus status-folder inconsistency, over the whole tickets/ tree, reading `tickets/ticket_lifecycle.json` for the allowed-status-per-folder mapping. Verified 2026-08-17: it is referenced only by its own source, its tests, a changelog and closed tickets — it is registered in no settings.json entry, no hooks_manifest, no CI job, and no git post-merge installer, so it has never run in anger. Extract its detection into the shared pass rather than reimplementing it."
  - "Its always-exit-0 contract must be changed when it is adopted. It was written as a non-blocking post-merge watchdog ('always exits 0, non-blocking, informational'); this AC requires a failing result. Announce-only is what let the five duplicates accumulate, and a second inert copy of the same logic is the worst possible outcome — retire or re-point the post-merge script rather than leaving two definitions of the rule (GE-120d-1 forbids the second definition)."
  - "THE WORK-ITEM IDENTIFIER MUST BE DECLARED EXPLICITLY, and it is not self-evident. Verified 2026-08-17: over bare basenames of all `*.md` under `tickets/`, the duplicate set is enormous and almost entirely spurious — every epic contributes `Master_Plan.md`, `01_*.md`, `02_*.md` and so on, which are distinct work items that merely share a numeric prefix. Over `TICKET-*.md` basenames the duplicate set is exactly the five the criteria name. Declare the identifier rule as DATA in the same declared rule GE-120b-1 introduces, not as a hard-coded pattern in the pass, so the fifth namespace and any future work-item shape inherit it."
  - "ONE ADDITIONAL COLLISION EXISTS THAT THE FIVE DO NOT COVER, and the implementer will meet it on the first whole-collection run: the epic folder `EPIC-MoveOnMainOnly` is held by BOTH `tickets/99_done/` and `tickets/99_rejected/` — one identifier, two TERMINAL lifecycle folders that flatly disagree (done versus rejected), with `Master_Plan.md` and four sub-items duplicated inside. It is invisible under a `TICKET-*.md` basename rule and visible under an epic-qualified path rule. Whichever rule is declared, this case must be REPORTED, never silently exempted; whether it is also repaired is GE-120e-2's scope question and is flagged to the user, not decided here."
  - "Sixteen loose `TICKET-*.md` files sit at `tickets/` root, outside any lifecycle folder. The declared rule must state whether the root counts as a lifecycle location; if it does not, those files are unenrolled rather than uniquely-held, and the report must not silently treat 'no lifecycle folder' as 'exactly one lifecycle folder'."
  - "The declared state, not the folder, is authoritative — this repository's existing convention (ticket-prioritizer, finalize-feature-archive-check, BO-400a-3/c-2). The finding must carry both copies' declared states so GE-120e-2 can pick a survivor from the report alone, without reopening either file."
  - "Feeds the same shared verdict object as GE-120a-1 so that all three stages evaluate one rule (GE-120d-1). Do not emit a separate work-item report format."
  - "DEPLOY MANIFEST: `templates/hooks/*.py` deploy to `.claude/hooks/` and commit-guardian scripts to `.leafcutter/scripts/commit_guardian/`. Any module shared between the two layouts must be present in both deploy paths, or the gate crashes with ModuleNotFoundError in the layout it is not deployed to while source-tree tests stay green."
  - "Error handling per CLAUDE.md Rules 1-4; a work item whose frontmatter cannot be parsed is a could-not-read condition and belongs to GE-120d-3's disposition, not to a silent skip."
