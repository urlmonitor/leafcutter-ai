criteria: |
  An inspection that could not run reports uncertainty, never a false verdict.

  When a check cannot actually examine what it was asked to examine, it reports
  that it could not tell. It never converts its own inability to look into a
  confident statement about what it would have found. You are told what could not
  be checked and why, so you can act on a real problem instead of chasing a
  conclusion the system was never in a position to reach.
