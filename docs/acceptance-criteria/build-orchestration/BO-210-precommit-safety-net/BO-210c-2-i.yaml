criteria: |
  Given the originating coder has been re-dispatched at depth 2 to satisfy a judgment-tier hook,
  And it is forbidden from spawning a sub-agent,
  When fixing the violation would require a refactor that depends on cross-file information
    not present in the capsule's consumers_checked,
  Then the re-dispatched coder does NOT spawn a research-agent and does NOT guess,
  And it returns a status of blocker describing the missing cross-file information,
  And the commit is not retried on that pass,
  And the blocker is surfaced so a full-context pass can be scheduled outside the depth-2 fixer.
