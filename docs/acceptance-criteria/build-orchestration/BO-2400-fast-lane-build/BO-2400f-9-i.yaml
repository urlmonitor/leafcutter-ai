title: "Stale-todo guard: a passing run that leaves any built AC un-flipped is an error"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run passed its green and coverage gates for the built set,
  When the run performs its finish-time work_status transition,
  Then if any built acceptance criterion is still work_status todo or in_progress
    after the transition step, the run reports it as an error naming the un-flipped
    criteria rather than returning success,
  And a successful run's reported result asserts that every built acceptance criterion
    is work_status done.
