notes: |
  Documentation AC for GE-130c's reference-doc trigger.

  2026-09-17 (business-analyst, user decision) -- "a caller is stopped only for its own command's
  changes" and "what the reader sees when the protection cannot tell whose change it was" describe
  the documentation guard and the guide-read guard: an unattributed change is named, explained and
  does not stop the run (GE-130c-2-i), and is listed at the end of the drive (GE-130c-2-ii). The
  task-lock guard's lock semantics are unaffected -- under the build lock it stops any writing
  command regardless of attribution, except the build workflow's own dispatched agents
  (GE-130a-4). Criteria amended the same day to state this; old criteria quoted in amended_by.

