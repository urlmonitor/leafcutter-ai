id: KM-400a-1-x
title: Flow properties preserve the authored journey and its nested steps
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
work_status: done
priority: medium
parent: KM-400a-1
criteria: |
  Given a canonical Flow named leafcutter/finalize-feature contains ordered steps, branches and acceptance scenarios, and its registration has a shorter summary
  When the Flow's native fields are exposed in the repository graph
  Then the Flow retains its complete authored id, component, name, summary, kind, source, status, readiness, version, entities and steps
  And any authored product, example_product, level, realization, superseded_by, shape_version, tags, mock_data_ref, branches, impl_summary, acceptance_scenarios, provenance, behind and confirmed values remain separately queryable
  And each step and branch retains its own identity, order, actor, screen, inputs, outputs, requirement references and stored implementation status without exchanging values with another member
  And an expands_to string remains a string while an expands_to list remains an ordered list, and stored progress and confirmation values are not recomputed
  And source fields remain distinct from registration fields, including conflicting summaries and tags
  And a canonical Flow missing from registration remains visible with its unregistered state identified, while malformed records, conflicting identities, duplicate registrations and source references outside the selected repository fail explicitly
  And nested values, future fields, explicit nulls, empty collections and omitted optional fields remain distinguishable without invented defaults or additional top-level step records
depends_on: [KM-400a-1]
