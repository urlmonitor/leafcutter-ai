title: "Agents know how and when to invoke the knowledge query"
component: knowledge-management
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Given agents (PO v3, BA v3, IT PO v3) need to query the knowledge graph
    during their knowledge-acquisition phases,
  When the knowledge-query SKILL.md is loaded by any consuming agent,
  Then the SKILL.md contains an "Agent Protocol" section that defines:
    the standard invocation syntax, the mandatory-invocation rule, and the
    self-contained structure for single-line delegation,
  And each consuming agent template delegates to "follow the Agent Protocol
    in knowledge-query SKILL.md" rather than repeating the invocation logic inline,
  And agent-specific concerns (which surfaces to query, when to query,
    what to do with results) remain in each agent template.
