notes: |
  THIS IS THE L1 THAT MAKES THE TREE SHIPPABLE, AND THE ONE MOST LIKELY TO BE
  CUT AS OVERHEAD. Cutting it turns the tree into a flag day, and a flag day is
  not available here. Several readers are pre-commit hooks and REQUIRED CI
  gates; a single commit that changes all of them at once is a commit that
  cannot be landed safely and, more importantly, cannot be reverted safely
  either — a revert mid-migration leaves converted records being read by
  unconverted readers.

  THE MIXED STATE IS THE NORMAL STATE, NOT THE EXCEPTION. Given the size of the
  store and the number of readers, there will be days or weeks where some
  records carry the new form and some do not. Every reader must give the same
  answer for both shapes throughout. The BA should write at least one L2 whose
  Given is explicitly a HALF-MIGRATED store — that is the state the tree will
  actually live in, and it is the one nobody tests.

  BACK-COMPATIBILITY IS PERMANENT, NOT TRANSITIONAL. Some records will never
  move: records under parked trees, superseded records nobody will reopen, and
  whatever ACS-1500c abstains on. 'The old form stops being read once migration
  completes' is a plan with no completion date. Specify the posture for a record
  that is never converted as a permanent supported state.

  THE KILL-SWITCH IS PART OF THE DELIVERABLE. One commit, documented, tested by
  actually throwing it — not a config key nobody has ever set. phase_acbuild_1's
  exit criteria already require exactly this for its own staged rollout; borrow
  the shape.

  VERIFY IN THE DEPLOYED LAYOUT, NOT THE SOURCE TREE. Every stage boundary here
  is a moment where a hook could start importing something the build does not
  deploy, and the resulting ModuleNotFoundError fires at hook runtime with the
  unit tests all green. Once these gates are required that blocks every merge.
  CLAUDE.md documents the precedent; this L1 is where it will bite.
