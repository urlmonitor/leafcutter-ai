id: BO-1700c-1
components:
  - build_orchestration
readiness: approved
priority: medium
title: "First-registered self-healing hook re-materializes a missing config on any commit"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1700-worktree-quality-gate-guard/BO-1700c.yaml"
criteria: |
  Given the commit-guardian manifest,
  When it is read,
  Then the self-healing hook is the first hook registered after the stage
    canaries (the precommit-canary-* members BO-4300c-1-ii places first), so
    every entry before it is a stage canary and it runs before any other hook.
  And given a commit is attempted in a worktree where `.pre-commit-config.yaml`
    does not resolve to a readable file,
    When the self-healing hook runs,
    Then it re-materializes the config by creating a `.leafcutter` symlink to the
      main tree's `.leafcutter` (located via the shared git dir), or by copying
      the config when a symlink cannot be created,
    And after it runs the worktree's `.pre-commit-config.yaml` resolves and the
      remaining hooks run against the restored config.
depends_on: [BO-1700c]
