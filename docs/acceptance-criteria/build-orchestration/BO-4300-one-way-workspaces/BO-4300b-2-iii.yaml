notes: |
  Reproduced in the DIAGraph adopter (leafcutter build v21.0.93, pin 67a7b443): the package is the
  submodule <repo>/leafcutter/, so build.py lives at <workspace>/leafcutter/scripts/build.py while
  <workspace>/scripts/ is DIAGraph's own folder. run_install_build hard-coded
  <workspace>/scripts/build.py, so `worktree.py ensure --kind epic --slug <x>` cloned the workspace and
  then refused with BOOTSTRAP_FAILED "scripts/build.py is absent"; the submodule was never initialised
  either. Same adopter-layout class as #1307 and #1408.
  2026-11-24: DIAGraph's main checkout had leafcutter/ at dcd93781, older than the recorded pin
  67a7b443 and without templates/scripts/worktree.py. The submodule-fetch gate required the full
  package signature on that main copy, so it skipped the fetch and the same refusal came back. The
  gate now asks only for scripts/build.py on the main copy.
