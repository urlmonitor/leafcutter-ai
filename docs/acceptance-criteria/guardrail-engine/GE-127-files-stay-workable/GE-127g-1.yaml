  note: 'ADDITIVE ONLY. criteria are UNTOUCHED and readiness stays approved. One notes
    block and this entry are added; no other field changed. The deliberate choice not
    to touch criteria is explained below and is not an oversight.


    WHAT CHANGED UNDER THIS RECORD. Agent cards became static on the day this record
    was approved: the trailing per-agent AC-assignment section — 3,787 of 11,526 card
    lines, present in 17 of 64 cards — is removed. python-coder.card.md falls from
