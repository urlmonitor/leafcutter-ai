id: BO-3500b-1
components:
  - build_orchestration
title: "A set mixing code, tests, a page and a diagram is accepted and delivered in one pull request"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an operator points at one requirement whose connected group contains a source
    code member, a documentation page member and a diagram member,
  When the run builds that group,
  Then the run is not turned away for containing members that are not code,
  And each member's declared artifact is produced within that one run,
  And the tests that prove the code member are produced as part of that member rather
    than as a member of their own,
  And all of those artifacts arrive together in the single pull request that run opens,
    so a reviewer sees the change, the tests that prove it, and the page and the diagram
    that go with it in one review rather than in three,
  And the operator gave one instruction naming one requirement and made no further
    choice about which members were included or which were left out.

  Given the same group,
  When the run has finished,
  Then every member of the group is accounted for in the run's ending — each one either
    delivered or named as the reason the run did not deliver,
  And no member is absent from that account.
