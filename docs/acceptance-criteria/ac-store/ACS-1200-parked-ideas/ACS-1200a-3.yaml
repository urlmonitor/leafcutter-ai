notes: |
  Satisfies the mandatory reference-doc trigger on ACS-1200a. The PO's reason for
  making it mandatory rather than nice-to-have: shipping the exemption while the
  reference still documents the rule as unconditional leaves the written rule
  contradicting the enforced one — which is how a corrected safeguard gets
  "repaired" back to the wrong behaviour by someone reading the docs.

  The last clause is the checkable one. An addition that describes the exemption
  while leaving the old absolute statement in place elsewhere in the document
  does not satisfy this AC.
