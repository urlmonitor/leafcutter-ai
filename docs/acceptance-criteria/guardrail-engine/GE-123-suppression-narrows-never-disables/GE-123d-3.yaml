notes: |
  THIS IS THE MANDATORY NEGATIVE ARM, stated as its own criterion rather than
  as a caveat on GE-123d-2, because the product-owner identified it as the
  load-bearing one: widening what prose may contain must not become a way to
  smuggle a live credential into permanent history.

  THE DISTINCTION THIS AC HOLDS, and the honest limit of it. The distinction the
  feature has to draw is between text that DESCRIBES a credential shape and text
  that CONTAINS a live value. That distinction cannot be drawn perfectly — a
  short, low-entropy, human-chosen password is textually indistinguishable from
  a placeholder someone typed by hand. Rather than claim a confident test, the
  chosen answer is the narrower one the product-owner asked for: a closed list
  of positively recognised non-credential shapes, with everything unrecognised
  treated as a credential. The cost is accepted and named: a prose author who
  writes an example value that resembles nothing on the list is still blocked
  and must either reword it into a recognised shape or add an explicit
  suppression. That residual cost is preferred to a broad exemption.

  THE FOURTH SCENARIO IS THE SHARP EDGE of the whitespace shape and is why it is
  written as a scenario rather than left to implementation. "Contains
  whitespace" as a literal test is trivially defeatable — appending one space to
  a credential would exempt it. The criterion therefore constrains the shape to
  a value that reads as a run of ordinary words. Whatever test satisfies that,
  a credential with a space bolted on must still be reported.

  RELATIONSHIP TO THE PRE-EXISTING HIGH-ENTROPY EXEMPTION, flagged and NOT fixed
  here. The high-entropy rule is exempted at FILE level for four of these same
  locations, so a high-entropy credential already rides into a ticket file
  unreported today. That is a separate, pre-existing hole, adjacent to this AC
  but not caused by it; this AC is scoped to not repeating the mistake for the
  generic-credential rule. It is recorded here so that it is not mistaken for
  something this feature introduced, and so that whoever picks it up has the
  observation.

  VERIFICATION STANDARD (inherited from the L0): every scenario here must be
  exercised through the pre-commit secrets check against a real staged file. A
  negative arm verified against the exemption predicate in isolation proves the
  predicate says no; it does not prove the commit was blocked.

  IT-PO NOTE, 2026-08-18: the pre-existing file-level high-entropy exemption
  this section flags has since been recorded formally as KI-CG-004 in
  docs/known-issues/commit-guardian.md, with measured evidence. The two remain
  separate: KI-CG-004 is an existing defect in the high-entropy rule, this AC is
  the guarantee that the NEW generic-credential exemption does not acquire the
  same shape. The fence is now also an it_requirement so a coder cannot reach
  for the existing file-level exemption as a template.
target_epic: EPIC-SuppressionNarrowsNeverDisables
