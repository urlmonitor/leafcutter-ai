readiness: approved
priority: high
title: "A map committed from one operating system is left untouched when refreshed on another"
component: knowledge-management
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/knowledge-management/KM-300-docs-same-everywhere/KM-300b.yaml"
criteria: |
  Given the documentation map was generated and committed from a Linux host
  And a contributor on a Windows host checks out that commit into a fresh
    clone, so every file's modification time is the time of the checkout
  And no documentation page has changed since the map was generated
  When the map is refreshed on the Windows host — either by running the
    generator directly or by the automatic refresh that runs when work is saved
    with a commit
  Then the refreshed map is byte-identical to the committed map
  And the version-control status reports no modification to the map
  And no date, time, user name, host name or absolute path that differs between
    the two hosts or between the two checkouts appears anywhere in the map,
    including its front-matter header
  And the same holds in the reverse direction (committed from Windows, refreshed
    on Linux or macOS)
  And when a documentation page HAS changed, the refreshed map reflects that
    change on either host
