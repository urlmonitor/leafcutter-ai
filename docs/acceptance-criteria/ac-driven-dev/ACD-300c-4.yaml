assigned_agent: python-coder
estimated_complexity: M
it_requirements:
- 'IT PO decision (the BA''s open call): the store''s one approval step, scripts/ac_store/approve_acs.py,
  gains an explicit id-list mode and a priority option. Readiness, priority and the single amended_by
  entry are written by that one step in one write per record; there is no second priority-writing step.'
- The id-list mode approves each listed id at any level, never expands an id to its children, and leaves
  the existing --goal and --ac modes unchanged.
- 'The workflow takes the hold report from the same approval step (its dry-run JSON report) and passes
  it only the ids reported not held. The step still checks holds on every id it is given: an id it holds
  is reported held and never written.'
- The approval is a deterministic workflow step with no agent dispatch, and it replaces today's status-checker
  apply-approval dispatch. No agent writes readiness or priority.
- 'Field-targeted writes only: readiness, priority and one appended amended_by entry change; every other
  byte of the record is preserved, and the write-then-read-back check stays.'
- The step's --json output keeps its exact {approved, held} shape; anything added is an additive key.
- The approve_acs.py CLI change is documented in docs/reference/ac-readiness-and-assignment-gates.md in
  the same change.
- 'templates/workflows-js/plan-feature.js is over its size limit and its measured length must not grow
  (GE-127b-1 growth ratchet): lines added are paid for by lines removed or by rationale comments moved
  to docs/reference/plan-feature-workflow-rationale*.md. Build after GE-127h-1 so decision-history lines
  are free.'
- Canonical sources only; deployed and installed copies are regenerated by the build and never hand-edited
  (ADR-001).
declared_files:
- path: scripts/ac_store/approve_acs.py
  state: existing
- path: templates/workflows-js/plan-feature.js
  state: existing
- path: docs/reference/ac-readiness-and-assignment-gates.md
  state: existing
delivers_to:
  agent: python-coder
  contract: 'scripts/ac_store/approve_acs.py gains an id-list mode and a priority option: given ids [str]
    and priority (critical|high|medium|low) it writes, for each id it does not hold, readiness approved,
    that priority and one appended amended_by approval entry, as one field-targeted write per record followed
    by a read-back. --json prints {approved: [id], held: [{id, file, reason}]} (reason in HOLD_REASONS),
    plus an additive already_approved: [id] list; --dry-run --json prints the same report without writing.
    Exit is non-zero when any written record fails read-back, and that record is restored to its pre-write
    bytes.'
expects_from: null
test_intent:
- clause: ACD-9990a-1, ACD-9990a-2 and ACD-9990a-4 read readiness "approved" and priority "high"
  needs_test: true
  reason: Approving the released records with the chosen priority is the core outcome.
- clause: ACD-9990a-3 still reads readiness "reviewed", and its priority is the value it had before
  needs_test: true
  reason: A held record must stay untouched, which is the bypass this change closes.
- clause: each of the three approved records has gained exactly one new amended_by entry, at the end of
    its list, recording the approval and the date, and every amended_by entry it held before is byte-identical
    to before
  needs_test: true
  reason: The append-only audit entry is one of the guarantees the agent edit skipped.
- clause: every other field of all 4 records is byte-identical to before
  needs_test: true
  reason: Byte identity of every other field proves the write is field-targeted.
- clause: the approval is made by the store's one approval step -- the same step a person runs by hand
    to approve records -- given exactly the ids ACD-9990a-1, ACD-9990a-2 and ACD-9990a-4, as a deterministic
    workflow step, so no agent edits any record's readiness or priority during approval
  needs_test: true
  reason: Approval through the one step with exactly the released ids is the contract, and an agent edit
    would bypass the holds.
- clause: the run's closing summary states "3 approved, 1 held" and names ACD-9990a-3 with the reason
    "file finding undecided"
  needs_test: true
  reason: The closing summary's counts and held reason are computed from the step's report.
