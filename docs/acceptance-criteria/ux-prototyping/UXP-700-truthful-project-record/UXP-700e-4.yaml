id: UXP-700e-4
title: "A reference for the record's size bounds and how a shape change is rolled out"
component: ux-prototyping
components:
  - ux_prototyping
  - documentation_system
level: L2
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a person about to add a bound to the record's shape, or a person who has just been told
    their artifact exceeds one,
  When they open the reference on the record's size bounds,
  Then it lists every declared bound, its value, the field it applies to and the shape version
    in which it took effect,
  And it states the rollout order a new bound must follow - declare behind a new shape version,
    warn, backfill, and only then tighten - and that tightening is decided by the record being
    fully backfilled rather than by a date,
  And it states which fields are authored and which are derived, so a reader knows which text to
    edit when the two disagree,
  And it records the measurement that motivated the bounds, including that a 120-character
    description cap would fail all 14 journeys as they stand.
