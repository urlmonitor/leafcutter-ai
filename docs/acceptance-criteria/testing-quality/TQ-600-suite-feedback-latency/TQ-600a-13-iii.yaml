notes: |
  UNDER-SPECIFIED, NOT INVENTED: WHERE "THE LAST GREEN NIGHT" IS RECORDED. The design
  says the issue carries the commits merged since the last green night, but not where
  that green night is remembered. The obvious source is the scheduled workflow's own run
  history; it is not the close date of the flag (see TQ-600a-13-iv for why). This record
  fixes the behaviour — the range starts at the head commit of the most recent green run
  — and leaves the store to the implementer.

  UNDER-SPECIFIED: TWO OR MORE OPEN FLAGS. A race between a scheduled run and a manual
  re-run, or a human opening a second issue with the label, can produce two. This record
  does not say which one a red night updates. TQ-600a-13-vi holds the PR when any open
  flag exists, which is the safe direction; consolidation is left open.
