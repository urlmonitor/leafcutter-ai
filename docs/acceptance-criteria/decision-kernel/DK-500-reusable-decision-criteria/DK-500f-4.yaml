notes: |
  NON-GOAL guard (L0 and DK-500f notes): using outcome statistics to choose or rank offered categories is INFLUENCE, which belongs after held-out evaluation (ADR-056 section 3, phase_colony_4_influence). Being used often never counts as proof that a category is good (ADR-056). The swap is the falsifiable form: any ranking by usage or outcome changes the order in one of the two runs.
