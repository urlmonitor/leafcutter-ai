it_requirements:
  - >-
    A decline is not an answer about the record: in the look-up (peek-pause-record, peekPausedGateId)
    and in the resume read (read-pause-record), a reply shellStepReply() classifies as declined is
    never read as exists false, as "not paused here", or as nothing_to_resume.
  - >-
    The bounded re-attempt of ACD-2100c-3-ii applies: at most three attempts in total, a distinct
    label each, the same command, each sent to shell-runner. No attempt goes to another agent or
    runs another command (ADR-070 sec. 5.3).
  - >-
    When every attempt is declined, the run ends with the existing status pause_record_unreadable
    (ACD-2100c-3-ii), not a new one. Its message is the declined form in the delivers_to contract,
    distinct from the damaged-reply form; when attempts returned different kinds of reply, the
    message reports what each attempt returned.
  - >-
    Nothing moves on a declined look-up: no authoring agent is dispatched for the stage, the answer
    is not applied, no approval, priority or commit is made, and the record and the drafted
    criteria stay byte-identical. The run ends at that point with no later step.
  - >-
    Errors follow the CLAUDE.md error-handling policy: a [plan-feature][WARNING] line names the run
    id, the gate id, the step label and the declining agent.
  - >-
    File-size ratchet: templates/workflows-js/plan-feature.js measures 2375 lines under
    count_content_lines ('.js') at 927934e33, against a 1000-line limit, so every measured line
    this change puts in (a changed line counts) must be paid for by about two removed.
  - >-
    templates/workflows-js/plan-feature.js is the source. The deployed .claude/workflows/plan-feature.js
    is rebuilt by python scripts/build.py and never hand-edited.
