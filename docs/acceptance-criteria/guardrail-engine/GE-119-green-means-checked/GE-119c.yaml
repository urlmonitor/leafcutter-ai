notes: |
  The anti-regression L1, and the reason the other three do not quietly come
  back. Without it, GE-119a and GE-119b are one refactor away from undone.

  WHY THE EXISTING TESTS DO NOT COUNT: today's unit tests for these checks
  import from the source tree, which is precisely the layout in which the bug
  does not reproduce. A test that cannot fail on the observed defect is not
  evidence. This L1 is only satisfied by executing the checks as deployed, from
  a working copy that does not have the source tree on its path — the "verify
  behaviorally, not by grep" rule the project already applies to gates and
  workflows.

  The component-diagram trigger is for the new verification surface itself
  (a harness / fixture that stands up a separate working copy and runs the real
  checks against it) — it is a new architectural piece, not a change to an
  existing one.

  This L1 is what makes the UNVERIFIED "26 schema-violating files looked clean"
  report checkable. The BA should have it produce that number honestly rather
  than inheriting it as an assumption.
