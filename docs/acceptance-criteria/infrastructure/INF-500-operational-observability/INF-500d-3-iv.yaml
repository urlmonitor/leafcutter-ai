id: INF-500d-3-iv
components:
  - infrastructure
  - feedback_collector
title: "An agent that cannot find its own recovery file records that the id was not captured, never the newest id it can find"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an agent's submission printed nothing on standard output,
  And the agent's own error-stream file holds no recovery-file line (the submission
    exited before writing one),
  And the shared temporary directory holds recovery files written in the last minute
    by other agents' submissions, the newest holding fb_2026-08-25_9057159a,
  When the agent follows the sign-off instructions to fill in its feedback id,
  Then it records a failure marker whose reason comes from INF-500d-3's closed set,
  And it does not record fb_2026-08-25_9057159a or any other id it did not read from
    its own standard output or from the recovery file named in its own error stream,
  And the sign-off instructions contain no step that lists, sorts, or searches the
    shared temporary directory for recovery files by name pattern or modification
    time.

  Given an agent's own error-stream file names a recovery file that no longer exists
    or is empty,
  When the agent follows the sign-off instructions,
  Then it records the failure marker with INF-500d-3's "written but not captured"
    reason,
  And it does not record any other id,
  So that a missing id stays visible as missing instead of being replaced by a
    plausible id that belongs to another agent.
