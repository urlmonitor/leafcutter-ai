id: ACD-300a-3
components:
  - ac_driven_dev
readiness: approved
priority: high
title: "Triage detects already-covered requests and surfaces existing ACs"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the user's request is semantically equivalent to ACs that already exist
    in the store (regardless of readiness state),
  When the Haiku triage agent evaluates the request against the AC store,
  Then it classifies the route as "covered",
  And the response includes the list of existing AC ids and titles that cover
    the request,
  And the orchestration workflow presents these to the user with the message:
    "These existing ACs already cover your request. Would you like to proceed
    anyway (force new), amend an existing AC, or cancel?",
  And if the user selects "cancel" no authoring agents are invoked,
  And if the user selects "amend" the technical route is used on the specified AC
    (technical planner, then test designer and the final gate),
  And if the user selects "force new" the triage re-evaluates as "strategic"
    and proceeds with the full pipeline.
depends_on: [ACD-300a]
doc_links:
  - path: templates/skills/plan-feature/SKILL.md
    relationship: describes
    status: exists
  - path: docs/reference/plan-feature-workflow-rationale-gates.md
    relationship: describes
    status: exists
  - path: docs/architecture/diagrams/c2-002-ac-authoring-pipeline.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-001-self-hosting-boundary.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
declared_files:
  - path: templates/workflows-js/plan-feature.js
    state: existing
it_requirements:
  - "Edit the canonical workflow only (templates/workflows-js/plan-feature.js); deployed and installed copies are regenerated by the build and never hand-edited (ADR-001). The edit must pass the file-size and complexity commit checks without a skip."
  - "The covered gate shows the exact sentence of the criteria, followed by every covering AC with its id and its title; an id whose record has no readable title is still listed by id, never dropped. The same sentence and list reach the person on the live gate and in the paused-gate question that a resume presents."
  - "The gate keeps accepting the answer values cancel, amend and force (force is the answer behind the 'force new' option), so runs paused at covered-route-gate before this change can still be resumed."
  - "Cancel returns before any product-truth, authoring or test-design dispatch, with the covering ids still reported as covered_by; a missing or unreadable gate answer keeps failing closed as undetermined and is never read as cancel, amend or force (KI-ACD-005)."
  - "Amend runs the technical pipeline (it-po, then test-designer, then the final gate) and hands the covering AC ids to the it-po stage as the records to amend, so the technical planner edits those records rather than authoring new ones."
  - "Force sets the route to strategic and runs the full pipeline (product-owner, business-analyst, it-po, test-designer). The --force argument must have the same effect: today a covered triage with --force skips the gate but keeps route covered, which falls through to the technical pipeline, contrary to the plan-feature skill's statement that --force implicitly uses route strategic."
  - "The resume rule of ACD-2100c-3-iv is preserved: a resume of covered-route-gate applies the stored answer, and a resume of any other gate never opens covered-route-gate."
delivers_to: null
expects_from:
  ac_id: ACD-300a
  contract: 'The ac-triage reply to the stage-0-triage dispatch in templates/workflows-js/plan-feature.js, one JSON object: { route: "strategic" | "behavioral" | "technical" | "covered" (string, required), existing_acs: string[] of AC ids (required, [] when none), parent_l1_id: string | null (required), rationale: string (required), anomalies: string[] (optional) }. On route covered, existing_acs names the covering records; titles are not part of the reply and are read from those records in the AC store.'
test_required: true
test_intent:
  - clause: it classifies the route as "covered"
    needs_test: true
    reason: The workflow opens the covered gate only on this route value, and a wrong branch would author duplicates without asking the user.
  - clause: the response includes the list of existing AC ids and titles that cover the request
    needs_test: true
    reason: Today only the ids reach the user, so a check that each title is shown next to its id is what shows the change was made.
  - clause: 'the orchestration workflow presents these to the user with the message: "These existing ACs already cover your request. Would you like to proceed anyway (force new), amend an existing AC, or cancel?"'
    needs_test: true
    reason: The gate text today is different wording, and an exact-text check stops it drifting again.
  - clause: if the user selects "cancel" no authoring agents are invoked
    needs_test: true
    reason: Cancel is an early return in the workflow, and a missed return would run the authoring pipeline anyway.
  - clause: if the user selects "amend" the technical route is used on the specified AC (technical planner, then test designer and the final gate)
    needs_test: true
    reason: Today amend runs the technical route without telling the technical planner which records to amend, so both the stage list and the handed-over ids need proof.
  - clause: if the user selects "force new" the triage re-evaluates as "strategic" and proceeds with the full pipeline
    needs_test: true
    reason: The force answer and the --force argument take different code paths, and the argument path today ends on the technical pipeline instead of the full one.
test_spec:
  - name: test_acd_300a_3_covered_triage_pauses_at_covered_gate_before_any_authoring
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: reachability
    description: 'In unit_tests/workflows/test_acd_300a_3.py: drives the real templates/workflows-js/plan-feature.js through run_workflow_under_e2 (unit_tests/_workflow_engine_harness.py) on a fresh run, stage-0-triage replying route covered with existing_acs [ACD-9101, ACD-9102]; the run returns paused_awaiting_input with gate_id covered-route-gate, a pause-persist record names that gate, and no pt-classify, pt-*-author, stage-*-author or stage-test-design-author dispatch happens.'
    proves_clause: it classifies the route as "covered"
    code_file: templates/workflows-js/plan-feature.js
  - name: test_acd_300a_3_gate_question_lists_each_covering_id_with_its_title
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: 'In unit_tests/workflows/test_acd_300a_3.py: covered triage with existing_acs [ACD-9101, ACD-9102, ACD-9103]. The workflow body has no file access, so the titles reach it through one shell-agent dispatch labelled read-covering-ac-titles (this design fixes that label for the implementer); the test scripts its reply as {output: JSON object of id to title for ACD-9101 and ACD-9102 only, exit_code: 0}. The paused question prompt (terminal question.prompt and the pause-persist record) shows ACD-9101 next to its own title and ACD-9102 next to its own title, and still lists ACD-9103 by id.'
    proves_clause: the response includes the list of existing AC ids and titles that cover the request
    code_file: templates/workflows-js/plan-feature.js
    must_catch:
      - only the ids are shown, as today
      - an id whose record has no readable title is dropped from the list
      - each title is shown next to the wrong id
  - name: test_acd_300a_3_failed_title_read_still_lists_every_id
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: 'In unit_tests/workflows/test_acd_300a_3.py: same run, read-covering-ac-titles replies exit_code 1 with empty output; the run still pauses at covered-route-gate and the paused question prompt lists ACD-9101, ACD-9102 and ACD-9103 by id.'
    proves_clause: the response includes the list of existing AC ids and titles that cover the request
    code_file: templates/workflows-js/plan-feature.js
  - name: test_acd_300a_3_gate_question_shows_exact_message
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: 'In unit_tests/workflows/test_acd_300a_3.py: fresh covered run; the paused question prompt the person is shown (terminal question.prompt, the same text in the pause-persist record) contains "These existing ACs already cover your request. Would you like to proceed anyway (force new), amend an existing AC, or cancel?" character for character, and the question options stay cancel, amend and force.'
    proves_clause: 'the orchestration workflow presents these to the user with the message: "These existing ACs already cover your request. Would you like to proceed anyway (force new), amend an existing AC, or cancel?"'
    code_file: templates/workflows-js/plan-feature.js
    must_catch:
      - the paused question is still the generic "Interactive gate 'covered-route-gate' requires a human decision" text
      - the sentence is put only into the live gate instructions, which resolveGate never dispatches
  - name: test_acd_300a_3_cancel_invokes_no_authoring_agent
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: 'In unit_tests/workflows/test_acd_300a_3.py: resume of covered-route-gate with a person-channel cancel answer (pause record and answer shaped as in unit_tests/workflows/test_acd_2100c_3_iv.py); the run returns status ok with covered_by [ACD-9101, ACD-9102], and no pt-classify, pt-*-author, stage-*-author, design-prepass or stage-test-design-author dispatch happens.'
    proves_clause: if the user selects "cancel" no authoring agents are invoked
    code_file: templates/workflows-js/plan-feature.js
  - name: test_acd_300a_3_unreadable_answer_is_not_read_as_cancel
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: 'In unit_tests/workflows/test_acd_300a_3.py: resume of covered-route-gate with an answer whose action is not one of cancel, amend or force; the run stays paused at covered-route-gate (status paused_awaiting_input), never returns status ok with covered_by, and dispatches no authoring agent.'
    proves_clause: if the user selects "cancel" no authoring agents are invoked
    code_file: templates/workflows-js/plan-feature.js
    must_catch:
      - a missing or unreadable answer falls back to cancel
  - name: test_acd_300a_3_amend_runs_technical_pipeline_on_covering_acs
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: 'In unit_tests/workflows/test_acd_300a_3.py: resume of covered-route-gate with amend, pt-classify replying outcome none, the rest of the label table after unit_tests/ac_driven_dev/file_findings/_handback_support.py; the authoring dispatches are stage-itpo-author then stage-test-design-author, the run then pauses at final-gate, no stage-po-author or stage-ba-author is dispatched, and the stage-itpo-author instructions name ACD-9101 and ACD-9102 as the records to amend.'
    proves_clause: if the user selects "amend" the technical route is used on the specified AC (technical planner, then test designer and the final gate)
    code_file: templates/workflows-js/plan-feature.js
    must_catch:
      - the it-po stage is not told which records to amend, as today
      - amend dispatches the product-owner or business-analyst stage
  - name: test_acd_300a_3_force_answer_runs_full_pipeline
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: 'In unit_tests/workflows/test_acd_300a_3.py: resume of covered-route-gate with force, pt-classify replying outcome none; the first stage-*-author dispatch is stage-po-author, its instructions carry route "strategic", and the run pauses at gate-po (the strategic pipeline order beyond the first gate is proven by the ACD-300a-1 tests).'
    proves_clause: if the user selects "force new" the triage re-evaluates as "strategic" and proceeds with the full pipeline
    code_file: templates/workflows-js/plan-feature.js
  - name: test_acd_300a_3_force_argument_routes_covered_request_as_strategic
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: 'In unit_tests/workflows/test_acd_300a_3.py: fresh run with args.userInput ending in --force, stage-0-triage replying route covered; no pause names covered-route-gate, the first stage-*-author dispatch is stage-po-author with route "strategic" in its instructions, and no stage-itpo-author is dispatched before it.'
    proves_clause: if the user selects "force new" the triage re-evaluates as "strategic" and proceeds with the full pipeline
    code_file: templates/workflows-js/plan-feature.js
    must_catch:
      - with --force a covered request keeps route covered and runs only stage-itpo-author, as today
