notes: |
  USER DIRECTION AT THE BA GATE (Q3): the fast lane and /build-feature must use
  the SAME existing scripts rather than reinvent them.

  WHAT HAPPENS IN THE HEAVY LANE TODAY (per the user's gate answer; the BA did
  not read the source to confirm): /build-feature has no mechanical red-baseline
  reader. The only evidence is the test writer's own statement, the red_baseline
  block in its sign-off comment. The record shows only that such a block exists
  (red_baseline_captured). Nothing re-runs the tests or classifies the red
  before the coder is dispatched. K1 is the case that statement cannot catch.

  WHY THIS IS SEPARATE FROM TQ-500f-3-i. That AC owns the rule inside the
  reader. This one owns wiring the reader into the heavy lane's phase sequence
  (ticket-supervisor / the build workflow). Either can ship and fail on its own.

  FOR IT-PO: the wiring surface is the /build-feature workflow and
  ticket-supervisor path, not the test-writer prompt. Place the call so a
  failure halts before the coder, matching the fast lane. Do not put it after
  commit: test-angles.md records gates that run after commit as a known process
  failure. Covering tests must drive the workflow under the workflow-engine
  harness and assert on the recorded dispatches. A grep of the workflow source
  for the script name is not acceptable (CLAUDE.md "Verify Behaviorally, Not by
  Grep").
