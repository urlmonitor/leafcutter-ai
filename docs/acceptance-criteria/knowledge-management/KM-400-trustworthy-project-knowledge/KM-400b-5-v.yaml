id: KM-400b-5-v
title: "A write batch that hits the writer's time limit is retried a bounded number of times before the publication fails, and only time-limit failures are retried"
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
priority: medium
work_status: todo
parent: KM-400b-5
criteria: |
  Given the writer declares at most 3 attempts per write batch
  And a publication of generation G33 for repository R1 has written node batches 1 to 33 of 46
  When batch 34 (label AcceptanceCriterion, 250 rows) exceeds the writer's time limit on its first attempt and succeeds on its second
  Then the publication continues with batch 35 and does not rewrite batches 1 to 33
  And each of the 250 rows of batch 34 exists exactly once in G33 after the retry
  And the generation's count check expects and keeps 11,307 nodes, the same figures as a publication with no retry
  And the publication succeeds
  And the publication result states that batch 34 of label AcceptanceCriterion was retried once, with its rows and payload bytes

  Given batch 34 exceeds the writer's time limit on all 3 attempts
  When the third attempt fails
  Then no fourth attempt is made
  And the publication fails, and the removal of G33 required for a failure after storing takes place
  And the result states that the cause is the writer's time limit, after 3 attempts

  Given batch 34 fails on its first attempt because the store refuses the write as read-only
  When the failure is observed
  Then the batch is not retried
  And the publication fails at once with the read-only refusal as its cause

  Given batch 34 fails on its first attempt because a uniqueness rule is violated
  When the failure is observed
  Then the batch is not retried
  And the publication fails at once with the violation as its cause

  Given batches 12 and 34 each exceed the time limit once and then succeed
  When the publication completes
  Then the result reports 2 retried batches, naming each, and the publication succeeds
depends_on: [KM-400b-5, KM-400b-5-i, KM-400b-5-iii]
