notes: |
  THE DOCUMENTATION AC FOR ACS-1400a'S `reference-doc` TRIGGER. Intended author is
  the documentation expert; the agent assignment is left for the IT PO to set.

  IT IS NOT A TIDY-UP. The written reference asserting a stronger rule than the
  code enforces is not a cosmetic mismatch — it is the mechanism by which the gap
  survived. Every authoring agent reads this reference and acts as though the
  back-link is guaranteed; the guarantee was never there, and nothing in the
  written rule would have told them.

  THE CRITERION IS WRITTEN AS A PREDICTION TEST FOR A REASON. "The reference is
  updated" is satisfied by any edit. Naming the three specific cases and requiring
  the reference to state the outcome for each makes the claim falsifiable by
  reading the text against the check's real behaviour, and it pins the three
  meanings of silence that ACS-1400a-1, ACS-1400a-2 and ACS-1400a-4 respectively
  resolve.

  DEPENDS ON THE THREE BEHAVIOURAL ACs, DELIBERATELY. The reference cannot be
  written before the rules it describes are settled, and writing it early is how
  it drifts again.
