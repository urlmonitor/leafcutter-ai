title: "An epic drive routes learnings around each ticket's commit, and N tickets leave one copy"
component: infrastructure
level: L3
status: active
req_status: active
work_status: done
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a-1.yaml"
criteria: |
  Given an epic drive in which ticket-supervisor drives each ticket and
    dispatches that ticket's commit phase while holding the commit-phase lock,
  When a ticket reaches its commit phase,
  Then inside that lock and before the commit agent is spawned, the
    supervisor runs the routing step's stage in the epic's worktree,
  And the commit agent is told to stage every path the stage reported, by
    name, alongside the ticket's own files, and never by a sweep,
  And after the commit agent returns, on success and on failure alike, the
    supervisor runs exactly one observe, still inside the lock, and that
    observation is the knowledge_routing it returns for the ticket,
  And the epic drive's own result carries each ticket's knowledge_routing and
    the total written and unwritten across the drive,
  And a learning whose text an earlier commit on the same branch already
    carries is not written again, not marked routed, and is counted as
    already_on_branch, so an epic of N tickets merges one copy of each
    learning rather than N,
  And a learning a refused commit left uncommitted in the worktree is staged
    by the next ticket's commit without being appended a second time,
  And no routing problem (a stage or observe that cannot run, or an
    unrecognised reply) changes the ticket's or the drive's own outcome.
depends_on: [INF-700a-1]
