criteria: |
  A check that never objects is a different problem from one that is ignored.

  Some checks have run for the entire recorded history of the project and never
  raised a single objection. That silence is reported in its own right — with how
  many times each check ran without ever speaking up — because a check nobody ever
  hears is usually looking at the wrong thing or never really reached, which needs
  a different fix from a check that speaks up and gets waved through.
