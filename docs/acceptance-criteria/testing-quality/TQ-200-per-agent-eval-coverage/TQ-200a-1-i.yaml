criteria: |
  Given the coverage check enumerates the agents that require an eval set,
  When it determines scope,
  Then the producer agents pt-classifier, mock-data-author, mockup-author, and
    flow-author are each in scope,
  And the AC-authoring agents product-owner, business-analyst, and it-po are each
    in scope,
  And the test-writing agents test-designer, test-writer, sql-test-writer, and
    test-runner are each in scope,
  And every one of these eleven agents is required to have its own eval set.
