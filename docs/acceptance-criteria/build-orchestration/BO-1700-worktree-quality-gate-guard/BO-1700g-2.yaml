title: "The canary token is only trusted when the canary hook actually executed"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1700-worktree-quality-gate-guard/BO-1700g.yaml"
criteria: |
  Given the string `PRECOMMIT_CANARY_OK` appears in tracked repository content or
    in some other hook's output, but the canary hook itself is NOT registered in
    the resolved config,
  When the probe runs Check D,
  Then Check D fails, the probe exits non-zero, `canary` is false in the JSON
    result, and stderr states that the token could not be attributed to a
    registered canary hook execution.
  And Check D only passes when the token is produced by invoking the registered
    canary hook through the resolved config.
depends_on: [BO-1700g, BO-1700a-1]
