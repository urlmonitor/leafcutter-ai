id: BO-4300g-2-i
title: "No deployed workflow sends a removal-capable agent a request without caller authorization"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
  - build_pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
declares_side_effect: false
criteria: |
  Given every workflow the install deploys is run under the workflow engine harness
    with its recorded dispatches captured, the set of workflows being derived from
    what the install deploys and never from a hand-written list,
  When every dispatch to a removal-capable agent is examined,
  Then each such dispatch carries a caller authorization naming one exact workspace
    and one exact branch,
  And a dispatch to a removal-capable agent that carries no caller authorization
    fails the check, naming the workflow and the step.

  Given a new workflow is added that dispatches a removal-capable agent for a step
    that only reads the pause store,
  When the check runs,
  Then it fails, naming that workflow and that step.
depends_on: [BO-4300g-2, BO-4300g-1]
