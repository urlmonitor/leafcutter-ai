notes: |
  WHAT IS SETTLED HERE AND WHAT IS LEFT OPEN, STATED PLAINLY SO NEITHER IS MISTAKEN FOR THE
  OTHER. GE-129a names the declaration's home as an open mechanism question and hands it to
  the BA and the IT PO. This record settles the half that is a requirement rather than a
  preference — the PROPERTY the binding must have — and leaves the half that is an
  engineering choice:
    SETTLED, and testable above: the tie is derived from particulars the run reads off the
      settings surface; when the entry moves out from under the declaration the run says so,
      on both sides, and credits nothing; one declaration never answers for two entries.
    LEFT OPEN, deliberately, for the IT PO: whether the declaration lives inside the entry
      object, in a side-car document keyed by those same particulars, or alongside the guard
      itself. Every one of those satisfies the clauses above, and they differ on grounds this
      record cannot adjudicate — chiefly whether the editor's own settings parser tolerates a
      key it does not know, which is a fact about that parser, and whether a side-car
      introduces a second file that can rot independently.
  The constraint that is NOT open, and is inherited rather than decided here: the words are
  config/verification_flow.schema.json's, reused verbatim. Where the declaration is HELD is
  open; what it SAYS is not.

  WHY BINDING IS A BEHAVIOUR AND NOT AN IMPLEMENTATION DETAIL. A tie that drifts does not fail
  loudly. It keeps pointing at a guard that is no longer there, and the run keeps reporting a
  demonstration that was observed against something else — the same shape as this whole tree's
  subject, one level down. Because the drift arrives through an ordinary, well-intentioned edit
  to settings.json, nobody is ever looking at the declaration on the day it stops being true.

  ANTI-GREP. Nothing above is satisfied by asserting that a declaration exists, parses, or is
  populated: every clause turns on what the run reports AFTER the surface is changed underneath
  a declaration that is itself held byte-for-byte as written. The repointing case is the
  discriminator, and it is the same discipline as ADR-045 §1's alter-and-revert pair applied to
  the binding rather than to the behaviour — that pair itself is GE-120f-1's and is not
  restated here.

  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSES. Bind the declaration by the guard's bare
  filename. ARRIVAL COLOUR: RED throughout — no declaration exists for any guard on this
  surface today, and the day-one state of every subject is that no attempt has been made,
  which is the correct outcome and must not be pre-suppressed. Under the mutation the
  repointing clause goes green-by-accident for a repoint that changes the matcher only, and
  the two-entries clause goes red, which is how the mutation is recognised.

  Authored at the BA stage. L2 behaviour only. No assigned_agent, no it_requirements, no
  test_spec, no estimated_complexity — the IT PO's.
