  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "There must be exactly ONE documented decision rule mapping (scope size, attended/unattended, defect-cost) to a lane — no second, divergent routing rule may exist elsewhere in the pipeline."
  - "The mapping must be table-driven / documented so it is auditable, and identical inputs must always yield the identical lane (deterministic, not a per-run LLM judgment)."
  - "The rule is the single source consumed by BO-2400b-1 (fast case) and BO-2400b-2 (heavy case); those ACs must reference it rather than re-deriving routing logic."
delivers_to:
  agent: llm-expert
  contract: "The documented, deterministic lane-decision rule (inputs: scope size, attended/unattended, defect-cost; output: fast | heavy) consumed by BO-2400b-1, BO-2400b-2, and its edge-case children."
