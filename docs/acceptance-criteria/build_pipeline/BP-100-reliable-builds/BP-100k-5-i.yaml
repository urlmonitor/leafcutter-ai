notes: "Paired negative case for BP-100k-5, with the measurement corrected on 2026-08-25 after the first figure was found to double-count symlinked directories. 253 of 528 deployed files must move from unrecorded to covered — not the ~512 first reported — and the shape matters more than the count: only 2 of the 253 are reported as gaps today, while 251 are silent, and the largest silent group is all 181 deployed script files, which include every commit-guardian hook and both drift gates. Three shortcuts must fail here. A blanket exemption over the deploy tree would satisfy the count while restoring the silent suppression list BP-100k-3 was written to remove. Records the gate never consults would satisfy the manifest while changing no verdict. And simply widening the scan set would convert 251 silent files into 251 reported gaps — visible, but still unchecked. Only a whole-tree end-to-end run, plus a drift verdict on a deployed commit-guardian gate script, separates registration from suppression and from mere visibility."
