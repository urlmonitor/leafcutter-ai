id: TQ-500g-1-iii
components:
  - testing_quality
  - build_orchestration
title: "The code is put back exactly after a wrong-version run, even when the run is cut short"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a wrong-version run for requirement TQ-9101 has altered
    refresh_config.py to "drop the retry_due condition", and a copy of the
    code as written was taken before the alteration,
  When the run is cut short in one of three ways —
      X1: the tests exceed the run's time limit,
      X2: the test process crashes,
      X3: the drive is stopped between the alteration and the put-back, and
          is later resumed,
  Then for X1 and X2 refresh_config.py is put back from the copy and compared
      with it byte for byte before anything else happens,
    And for X3 the resumed drive first compares refresh_config.py with the
      copy, and puts it back when they differ, before any other step,
    And the cut-short run's result is reported as not run, never as caught
      and never as survived,
    And when the file still differs from the copy after the put-back, the
      drive stops, says that the code may still be altered, and names where
      the copy of the code as written is kept,
    And no step of the alter-and-put-back cycle uses the repository's shared
      stash, and no file other than refresh_config.py changes.
depends_on:
  - TQ-500g-1
  - TQ-500g-1-i
