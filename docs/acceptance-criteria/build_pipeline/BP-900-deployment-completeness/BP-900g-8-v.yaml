assigned_agent: python-coder
estimated_complexity: S
declares_side_effect: false
package_surface: false
it_requirements:
  - "parse_frontmatter keeps its signature, its splitting rules and its error behaviour. The reference in the test re-implements only the YAML step (yaml.load with yaml.SafeLoader), so a divergence in splitting is caught too."
  - "The returned frontmatter is a fresh copy on every call. Several callers mutate it (they pop or set keys), so sharing one stored object would leak a mutation into the next parse."
  - "Tests must not spawn build.py. The real inputs are the files under templates/ read from the source tree."
test_spec:
  - name: test_every_real_template_frontmatter_equals_the_reference_parse
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "template_compiler.parse_frontmatter over every .md under templates/ that starts with a frontmatter block, parsed twice, compared with the reference parse"
    description: "For every real template the pair returned equals the reference pair on the first and on the second parse, with identical key order and identical value types."
    must_catch:
      - "A stored result returned by reference, so one parse's mutation shows in the next."
      - "A cache keyed on something coarser than the frontmatter text (for example the first line), returning another template's frontmatter."
      - "A reused result whose key order differs from the reference's."
  - name: test_synthetic_edge_cases_match_the_reference_and_survive_caller_mutation
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    angle: boundary
    surface_invoked: "template_compiler.parse_frontmatter over dates, quoted strings, multi-line scalars, empty frontmatter, malformed YAML, a tab after a colon, a non-mapping document and text with no frontmatter"
    description: "Each edge case equals the reference result on a first and a second parse, YAML that does not parse gives an empty dict, and mutating the returned dict (nested values included) does not change a later parse."
    must_catch:
      - "A parse failure remembered as an exception or as None instead of an empty dict."
      - "A shallow copy, so mutating a nested list or dict leaks into the next parse."
test_rationale: |
  The criterion entry is the safety net: it compares the real package against an
  independent computation, so a reuse bug that returns the wrong template's data or a
  reordered mapping cannot hide. The boundary entry covers the inputs that real
  templates do not currently contain but a hand-edited one could, and the mutation
  check is the one property a plain equality comparison cannot show.
