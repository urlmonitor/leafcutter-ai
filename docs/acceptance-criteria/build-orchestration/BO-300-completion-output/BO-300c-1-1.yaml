title: "Nested epic path is reduced to just the epic name in the finalize command"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
criteria: |
  Given an epic is located at a nested path such as tickets/00_inbox/epics/EPIC-Foo,
  When the completion message constructs the /finalize-feature command,
  Then the command argument is "EPIC-Foo" (the basename of the epic directory),
  And the command argument does not include any parent directory segments
    (e.g. not "tickets/00_inbox/epics/EPIC-Foo" or "epics/EPIC-Foo"),
  And this extraction works regardless of how many parent directories exist in the path.
