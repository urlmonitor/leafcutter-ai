readiness: approved
priority: high
title: "A commit carrying a map with machine-specific link paths is refused with an explanation"
component: knowledge-management
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/knowledge-management/KM-300-docs-same-everywhere/KM-300c.yaml"
criteria: |
  Given the version of the documentation map about to be committed (after any
    automatic refresh has run) contains, in its ADR table, the entry
    "[docs\architecture\adrs\ADR-001-self-hosting-boundary.md](docs\architecture\adrs\ADR-001-self-hosting-boundary.md)"
  When the contributor commits
  Then the commit is refused
  And the refusal message names the map, the line number of the offending
    entry, and the offending link text or target
  And the message states that link paths must use "/" and tells the
    contributor how to regenerate the map
  And the same refusal occurs when a link target is a machine-specific
    absolute path, e.g. "C:/Users/alice/project/docs/glossary.md",
    "/home/alice/project/docs/glossary.md" or "file:///C:/..."
  And when every link text and target in the map is a forward-slash path
    relative to the project, the commit is not refused by this check
depends_on:
  - KM-300c
  - KM-300a-1
