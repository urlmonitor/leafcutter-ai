id: DK-500e-2-i
title: A drafted criterion that repeats a reused one is caught before the approval
component: decision-kernel
components:
- decision_kernel
level: L3
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given reused cat-1dc11c5a2ffa7310 with the preferred wording "Can it be built and verified as one ticket?",
  And a host that returns, among its gap criteria, "Can it be built and verified as one ticket?" and "Can the format be read into the knowledge graph as one reviewed kind?",
  When the drafted criteria are taken into the run,
  Then "Can it be built and verified as one ticket?" appears at the approval of proposals only once, as the reused criterion of cat-1dc11c5a2ffa7310,
  And the approval states that one drafted repeat of cat-1dc11c5a2ffa7310 was removed,
  And "Can the format be read into the knowledge graph as one reviewed kind?" is kept as a drafted criterion.
depends_on:
- DK-500e-2
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500e-2
  contract: Gap criteria returned by the host.
change_target: code
risk_surface: internal
it_requirements:
- 'A repeat is detected deterministically with the shared wording rule against every reused criterion''s pref_label and alt_labels. Paraphrases are left to in-run grouping (DK-500b-4) and never removed here. Wording equality (''exact match'', ''identical'', ''repeat'', label uniqueness) is one shared rule for every caller (offline grouping, in-run grouping, publish label checks, drafted-repeat removal, edit detection): Unicode NFC, trimmed, internal whitespace collapsed to one space, case-folded; punctuation and word order stay significant. No caller may apply a looser or stricter rule of its own.'
- 'The approval payload states each removal: the count and the category each removed wording repeated.'
test_required: true
test_spec:
- name: test_repeat_appears_once_as_reused
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: '''Can it be built and verified as one ticket?'' appears once at the approval, as the reused criterion of cat-1dc11c5a2ffa7310.'
- name: test_removal_is_stated
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The approval states that one drafted repeat of cat-1dc11c5a2ffa7310 was removed.
- name: test_non_repeat_kept_as_drafted
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: boundary
  description: '''Can the format be read into the knowledge graph as one reviewed kind?'' is kept as a drafted criterion.'
test_rationale: Run the decision capability through the public run/resume boundary with a scripted Jev provider and a recording host port over a fixture category library; assert the approval payload, the run report, trace events and call counts rather than internal helpers.
