notes: |
  THE QUIET-DEGRADATION LEAF. ACD-1600g's verified notes ask for this explicitly:
  "It already treats an absent `out_of_scope` as tolerable, so the migration will
  not break it loudly -- it will silently lose half its signal and fall back to
  component-overlap guessing. That is a quiet-degradation risk, not a crash:
  budget an explicit test for it."

  VERIFIED MECHANISM. templates/agents/change-scope-reviewer.md Step 1.1 reads
  `out_of_scope` from ticket frontmatter and instructs: "may be absent -- treat as
  empty list". With an empty list, Tier 2's block condition ("the file's top-level
  directory or component is listed in out_of_scope") can never fire on the
  exclusion clause, and Tier 1's soft condition ("the file is NOT named in
  out_of_scope") is trivially satisfied, so unexpected files in a sibling
  directory downgrade to `[scope-extension]` tags and the review continues. The
  reviewer then adjudicates on component-overlap heuristics alone -- half its
  signal, with no indication that half is missing.

  WHY THIS IS THE MIGRATION-CRITICAL LEAF, NOT A NICETY. During the cutover
  window the store will contain ACs written before ACD-1600g-1's slot existed
  (ADR-026 rule 4: absence of a new field = legacy mode, derive, never fail). If
  "legacy mode" is implemented as "empty boundary", every legacy AC silently
  reports clean scope forever and nobody learns the migration is incomplete.
  Distinguishing the two states is what turns a silent regression into a
  measurable backfill queue.

  TOLERANT READER, NOT A HARD FAIL. Note the criteria deliberately do NOT say
  "blocks". ADR-026 rule 4 forbids failing on an absent new field, and rule 3
  ("advisory before required") applies. The requirement is that the absence is
  ANNOUNCED in the outcome a person reads -- loud, not fatal. Whether that is a
  warning line, a distinct status, or a counted advisory is the IT PO's call.
  Compare `check_ticket_signoff_parity`, which fails loud and blocks: the
  component PROJECT_CONTEXT.md classifies a stalled repo as a different -- and
  lesser -- risk than a false green, and this AC picks the middle path.

  THE FOURTH THEN CLAUSE is the one that will be dropped by a careless
  implementation. "Declared and empty" is an author's positive statement that
  nothing is excluded; "not declared" is an unmigrated record. Collapsing them is
  a one-line convenience (`data.get("out_of_scope", [])`) and destroys the
  distinction ACD-1600g-1's third Then clause was written to preserve.

  TESTABILITY. Run the reviewer twice over the same staged diff -- once against
  an AC with no boundary key, once against an AC with an explicitly empty
  boundary -- and assert the two outcomes differ and that the first names the
  requirement. A test that only checks the absent case passes on an
  implementation that reports the warning unconditionally.

  2026-08-17 (IT PO enrichment). The deferred shape decision is made, plus one
  correction of precision to the mechanism above.

  - THE ANNOUNCEMENT IS A COUNTED ADVISORY, not a warning line and not a distinct
    status. Reason: the point of distinguishing absent from empty is to convert a
    silent regression into a MEASURABLE backfill queue, and prose cannot be
    aggregated. A new status value would also collide with the reviewer's existing
    Step 5 status table, which maps exactly three conditions onto ok / blocker /
    question; adding a fourth would force every caller of the sign-off contract to
    learn it. So: a named section in the Step 4 body plus a machine-readable
    { undeclared_members, count } payload, with the sign-off status unchanged.

  - PRECISION CORRECTION to "Tier 2's block condition can never fire". Verified
    against the template: Tier 2 has TWO clauses joined by ANY, and only the first
    depends on the exclusion list. The second (a wholly different top-level
    component) still fires today and is currently the ONLY working block path.
    Likewise Tier 3 already routes "out_of_scope absent AND component overlap
    partial" to ambiguous, so absence is half-announced in that one case already.
    The genuinely uncovered gap -- and therefore the real content of this AC -- is
    absence with FULL component overlap, which takes Tier 1 soft with no signal
    whatsoever. Two tests were added to pin both edges of that correction.

  - THE PUSH IS TOWARD "PASS", NOT A NEUTRAL LOSS, and the corrected reading does
    not soften that: for the sibling-directory and same-component cases -- the
    overwhelming majority of real unexpected files -- the degradation actively
    downgrades findings into the continue bucket rather than merely failing to
    upgrade them.
