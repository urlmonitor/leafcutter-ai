criteria: |
  Given a requirement that promises a person will see a warning line naming the
    offending record when a malformed record is checked,
  When the proof of that promise is inspected,
  Then the requirement itself carries the proof -- the surface to act on, the
    input to feed it, and what must be observed afterwards,
  And it also carries what would be observed if the promise were unimplemented,
    so that a run cannot be counted as proof merely because it produced output,
  And a requirement may carry more than one such proof, each independently
    stated,
  And the proof is readable from the requirement alone, without opening any
    container the requirement is later bundled into.
