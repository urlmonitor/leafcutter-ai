    contract: "An engine-faithful run_workflow_under_e2() harness that exposes only the ADR-017 injected globals (agent, parallel, pipeline, phase, log, args, workflow, budget) and no module loader or filesystem primitive, so every subsequent workflow test asserts behaviour the production engine can actually perform."
