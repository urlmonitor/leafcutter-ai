criteria: |
  Given the decision-records goal offered for a split with trigger bundled_accepted,
  When the host proposes three parts and two of them quote words the goal does not contain,
  Then only one part would remain, so no split gate is shown and no part is created,
  And the goal goes ahead as one decision from the precedent step,
  And the two set-aside proposals are not offered for approval.
