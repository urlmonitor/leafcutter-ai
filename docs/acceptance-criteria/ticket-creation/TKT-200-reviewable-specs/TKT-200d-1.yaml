estimated_complexity: M
it_requirements:
  - "Must detect changes by comparing AC field values (component, depends_on, delivers_to, expects_from) against the diagram's source snapshot"
  - "Must replace the diagram file atomically (write to temp, then rename)"
  - "Must log which AC changes triggered the regeneration"
delivers_to:
  agent: llm-expert
  contract: "Change-detection result identifying which AC files changed and which diagrams are stale"
expects_from:
