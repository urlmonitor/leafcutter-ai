it_requirements:
- Use QueryCatalog persistent atomic activation, immutable operation/version/digest and independent verification;
  reject stale expected-active digest without replacing valid readers.
- A dedicated native catalog activation capability requires write_query_catalog and catalog_write effect confined
  to configured catalog root. Do not globally allow repo_write/external_write or relabel mutation as read_only.
- Kernel eligibility grants catalog_write only to the trusted activation binding with required permission; denied
  activation cannot fall back to a host.
- Factory injects query admission service sharing configured backend; default disabled/read-only startup remains
  optional and unchanged.
test_required: true
test_rationale: Prove observable behavior at the public service/kernel or trusted real-backend admission boundary.
  Provider and host doubles are labeled; no helper-only proof substitutes for the persisted end-to-end flow.
