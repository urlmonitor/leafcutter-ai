notes: "Authored by /quick-fix. Root cause: str(Path.relative_to(...)) yields an OS-native backslash path on Windows; git revision:path syntax requires forward slashes. Missing .as_posix() before the path is used in `git show HEAD:<path>`. Same bug class as KI-BP-20260907-0812 (product-truth index) and the doc-index generator.. Component note: scripts/commit_guardian/check_ac_governance.py also matches the guardrail-engine directory glob (scripts/commit_guardian/check_*.py), but the behaviour is AC governance, whose L1 tree (ACS-400) lives in ac-store; no guardrail-engine L1 covers governance HEAD comparison."
