amended_by:
  - "2026-08-18 BrainCandy: broadened the first case from 'the set cannot be read back' to 'the re-check does not affirmatively confirm it read the set', and added the partial-list shape. As authored, the criteria named only the reply that says it FAILED, so an implementer reading it writes a check for that denial -- which is exactly the live defect: the epic re-check reply schema declares no required list and the guard tests for the denial, so a reply that simply OMITS its readability claim is legal, takes the VERIFIED branch, and a partial enumeration then yields no additions, no withholding, and an 'Epic complete' statement. That is BUG-19's failure mode occurring inside the guard built to prevent it. The sibling record read-back is correct by contrast: it requires the confirmation and treats anything other than an affirmative true as unverified. 'Could not read' and 'did not confirm it could read' are different statements, and the point of failing closed is that they must produce the same outcome -- so the AC now says so, and adds that work missing from an unconfirmed list must not be reported as removed, since such a reply gives no basis for a claim about the store. Amended the title (it named only the narrower shape), added the ABSENCE OF A CLAIM IS NOT A CLAIM and AN UNCONFIRMED LIST SUPPORTS NO REMOVAL CLAIM constraints, added three test_spec descriptors naming the tests that now cover this (the unconfirmed-with-full-list and unconfirmed-with-partial-list cases plus the affirmative control that keeps the negatives non-vacuous), added their test file to post_write_commands, and extended test_rationale. Covered by unit_tests/prompt_assembly/test_epic_recheck_readable_flag_polarity.py. work_status left todo -- the fix is not built yet."
