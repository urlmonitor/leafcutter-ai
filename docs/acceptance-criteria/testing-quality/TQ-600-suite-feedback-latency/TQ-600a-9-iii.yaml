it_requirements:
  - >-
    THIS RECORD REVISES A WRITTEN AUTHOR DECISION AND MUST NOT BE BUILT WITHOUT THE
    OWNER OF ACD-2100d-2-i AGREEING TO THE REVISION. The file states in its own source
    that the first install is never shared or reused, for a stated reason. The
    copy-not-share technique is believed to resolve that reason completely, and the
    order-independence criterion above is the proof — but the belief is the reviser's,
    not the author's. Obtain the agreement before the change, and if it is refused,
    this record is withdrawn and about 39 s stays on the table. That is the correct
    outcome, not a failure.
  - >-
    COPY THE FINISHED INSTALL, DO NOT SHARE IT. The entire answer to the author's
    objection is that nothing mutable is shared. A shared directory with a convention
    about who may write to it reintroduces exactly the order-dependency the decision
    was written to prevent.
  - >-
    DO NOT CHANGE THE SYNTHETIC PACKAGE SHAPE. The package root and target root
    coincide on purpose; pointing the target directory elsewhere makes the
    output-mapping computation fail and produces the empty mapping the criterion is
    looking for, which would make the file pass for the wrong reason.
  - >-
    THE THREE-ARRANGEMENT RUN IS THE DELIVERABLE, NOT A NICETY. Before this change the
    isolation was guaranteed by never sharing; after it, isolation is a property of the
    copying. A property has to be executed to be believed.
  - >-
    THE AGREEMENT IS A PRECONDITION ON STARTING, AND THE IMPLEMENTER CANNOT GRANT IT TO
    THEMSELVES. The first requirement above makes this record conditional on the owner
    of ACD-2100d-2-i agreeing. That agreement is a human decision recorded outside this
    store; an implementing agent that reads the reasoning, finds it convincing and
    proceeds has not obtained it. If no recorded agreement is in hand when this record
    reaches a coder, the correct action is to stop and report blocked — not to build
    it and let review catch the question.
  - >-
    `_run_build()` AT LINE 115 IS THIS FILE'S OWN BUILDER AND IS WHERE THE COUNT COMES
    FROM. It takes `(pkg_root, workspace)` and calls subprocess.run at line 136. Emit
    `emit_execution_signal` from scripts/suite_performance/_shared_layout_coordination.py
    there. Note the signature already separates package root from workspace, which is
    what makes the coinciding-roots descriptor checkable from the emitted record rather
    than by re-reading the call site.
  - >-
    DO NOT TOUCH THE SYNTHETIC-PACKAGE HELPER. This file loads
    `_build_synthetic_full_package` from unit_tests/build_guards/test_bp_100k_2.py by
    FILE PATH under a unique module name (lines 75-113), freshly per use. That loader
    is deliberate and TQ-600a-10 is simultaneously adopting the same helper for a
    different file — a change to it lands in both records at once and neither one's
    tests would attribute the breakage correctly.
  - >-
    FOUR RUNS AND THREE ARRANGEMENTS MEAN SEVEN CHILD SESSIONS, NOT SEVEN IN-PROCESS
    LOOPS. Same reasoning as TQ-600a-9-i: a reversed arrangement that reuses the
    forward arrangement's memoised install tests nothing about order, and four
    discrimination runs sharing one install inherit each other's breakage.
