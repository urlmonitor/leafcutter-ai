title: "Fail-open covers a valid-JSON-but-wrong-shape config and a missing git binary, not only missing/corrupt config"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-1100-phantom-done-prevention/BP-1100e.yaml"
criteria: |
  Given the reconciliation's config is valid JSON but the wrong SHAPE —
    e.g. files_touched_reconciliation set to null, a top-level list, an absent key,
    or a non-boolean enabled/strict value such as "yes"
  When the hook reads the config to decide off / advisory / block
  Then it fails open: it never crashes on the shape, treats enabled and strict as set
    ONLY when the value is the JSON boolean true (a truthy non-boolean such as "yes"
    does NOT enable), and any wrong shape degrades to the check being off/advisory —
    never a hard block from the hook's own config read
  And given the git binary is entirely absent from PATH (raising OSError /
    FileNotFoundError) in any of the hook's git helpers
  When the hook attempts to compute the staged files, repo root, branch diff, or
    filesystem case-sensitivity
  Then every git helper fails open (returns its safe default) and logs a WARNING, and
    the hook exits 0 rather than propagating an uncaught traceback that would block
    the commit
