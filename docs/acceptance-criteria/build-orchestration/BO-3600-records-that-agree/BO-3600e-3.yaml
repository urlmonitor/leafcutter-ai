notes: |
  THE EXISTING BACKLOG IS PART OF THE DELIVERY, not a follow-up — BO-3600e says so.
  A check switched on over a store with a large standing population either blocks
  everything or is immediately suppressed, and the fourth scenario names both
  failure modes so neither can be chosen quietly.

  The third scenario is the one that gets skipped in practice: grandfathering the
  starting population is the natural way to make a new check comfortable, and it
  would exempt precisely the records this goal exists for, since every one of the
  eight behind it was old.

  This record owns measurement and visibility. The rule that the count may only fall
  by decision is BO-3600e-4, and the verdicts themselves are BO-3600d's.
