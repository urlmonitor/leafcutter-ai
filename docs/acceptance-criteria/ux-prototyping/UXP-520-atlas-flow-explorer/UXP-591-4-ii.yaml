it_requirements:
- The X button and a click on the canvas beside the drawer both close through the UXP-591-4 replace-entry
  path to flowHref(flowId) with no query.
- The replace stores the entry's view state with the drawer closed, so a later drill and Back return the
  flow with no drawer.
- The close button keeps the accessible name 'Close step details' that UXP-617-3-i relies on.
delivers_to: null
expects_from:
  ac_id: UXP-591-4
  contract: replaceEntry(url, {crumbs, filters}) in leafcutter-web/components/flows/flow-history.ts, rewriting
    the current entry with replaceState under 'leafcutter:flows-view' beside the App Router's keys; history.length
    never changes.
test_spec:
- name: closing the Build drawer with X or a canvas click returns the address to /flows/leafcutter/deliver-a-feature
    at unchanged history length
  target_dir: leafcutter-web/__tests__/uxp-591-4/
  framework: vitest
  type: component
  angle: criterion
  must_catch:
  - the close pushes an entry
  - the address keeps ?step=build
- name: after closing the drawer and drilling into Build, Back returns /flows/leafcutter/deliver-a-feature
    with no drawer
  target_dir: leafcutter-web/__tests__/uxp-591-4/
  framework: vitest
  type: component
  angle: seam
test_rationale: 'The seam test crosses the close (replace), the drill (push) and the pop, which is where
  a stale ?step= would reappear. Tests are vitest under leafcutter-web/__tests__/, run host-side with
  `npx vitest run` (180 s timeout). Known gap: the build pipeline''s red-baseline and done-proof checks
  cannot read vitest tests yet, so build by direct phase dispatch with host-run vitest, as the UXP-591
  epic was. No Playwright: the harness is deferred by the owner.'
