it_requirements: |
  Gate 2 is a new section (e.g. §1.0.1) in templates/skills/building-epics/SKILL.md
  PROSE (llm-expert surface), mirroring the existing §1.0 feedback-sink pre-flight.
  It REUSES the shared probe helper (BO-1700a-1) — it does NOT reimplement the four
  checks. Hard-halt with the structured blocked payload {status: blocked, reason:
  <failing check>}; proceed only on exit 0 + empty failing_checks (BO-1700b-1). The
  gate must be placed BEFORE any phase agent is dispatched so no ticket can start
  through an unverified worktree.
