assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  config_schema_fragment:
    fast_lane_mutation_proof:
      type: object
      description: "Per backfill AC: the list of mutations applied (file, location, change), and per newly-added test the mutation that turned it red or none; passed iff every newly-added test of the AC is red under >=1 mutation; post-restore re-run is all PASSED."
  reference_file_path: "scripts/build_orchestration/fast_lane.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "OPEN for it-po: how mutation targets are chosen. Candidates are the backfill AC's implemented_by paths, the modules the newly-added tests import, or an agent-proposed break checked by the script. Whatever is chosen, applying the break, running the tests and deciding the verdict must be deterministic script steps. An agent never decides whether a test is proven."
    - "Mutations must not touch test files, conftest files or the newly-added tests' fixtures. Only implementation code that existed at the merge-base may be broken."
    - "Mutated test runs use the same strict-mode, per-test-outcome run as the green gate (BO-2400a-4-ii, -iii), so a mutated failure is not masked."
    - "Restoration and its guarantees are specified separately in BO-2400a-3-xii."
delivers_to:
  agent: llm-expert
  contract: "Mutation-proof verdict per backfill AC (passed / halt reason) plus the per-test mutation record that the lane reports in its result."
expects_from:
  ac_id: BO-2400a-3-ix
  contract: "Backfill ACs and their green newly-added test ids."
origin_agent: business-analyst
