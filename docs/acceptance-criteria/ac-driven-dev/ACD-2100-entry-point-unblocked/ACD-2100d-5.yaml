criteria: |
  Given a project with the route installed from the current source, whose agent registry is the
    one the install delivered,
  And the feature request "Add a CSV export to the parts list",
  When a run is started by doing exactly what the installed /plan-feature command says and
    nothing else -- run the workspace-maker command it shows, then start the workflow with
    exactly the arguments it shows, filled in from the maker's answer --
  Then the run passes every check made before triage, and the triage agent is dispatched for
    that request,
  And the run does not end with a report that a startup verdict or any other argument was not
    supplied,
  And no command beyond those the command text shows was run by hand, and no argument beyond
    those it shows was added,
  And the same holds when the run is started by doing exactly what the installed plan-feature
    skill says in its workspace section,
  And the bug symptom (KI-ACD-20261022, 2026-10-22 and run wf_d2396526-264 on 2026-10-29: started
    with only the maker's answer, as the command and skill say, the run returned status error
    "No workspace-setup permission pre-flight verdict was supplied in args" and dispatched no
    agent) must not occur.
depends_on: [ACD-2100d, ACD-2100b-5]
