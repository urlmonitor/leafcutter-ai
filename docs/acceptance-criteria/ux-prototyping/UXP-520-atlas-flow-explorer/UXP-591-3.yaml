assigned_agent: frontend-coder
estimated_complexity: S
change_target:
  - code
  - ui
risk_surface: contract_boundary
it_requirements:
  - leafcutter-web/components/atlas/detail-drawer.tsx (around line 311 it builds /flows?flow=<encodeURIComponent(id)>&step=<node
    id> today) builds every 'Appears in flows' href with flowHref(flowId, nodeId) from the shared address
    module; no local URL construction remains.
  - One link per (flow, node) pair from the AC's existing product_truth back-reference, steps and branches
    alike; no new data source and no de-duplication across different nodes of one flow (BO-2000b has three
    links into leafcutter/python-coder-internal).
  - Links are same-origin relative hrefs.
  - 'This AC closes the UXP-524 gap: UXP-524 is work_status done, but its links open the default flow
    because the Flows view ignores ?flow=. The link tests carry both `// covers: UXP-591-3` and `// covers:
    UXP-524`. TICKET-20261009-AtlasFlowExplorerAcsProvenDone is on open PR #1065 and also touches UXP-524''s
    proof: rebase onto it once merged and reconcile UXP-524''s covered_by rather than duplicating it.'
delivers_to: null
expects_from:
  ac_id: UXP-591-2
  contract: "A step address /flows/<flow id>?step=<step or branch id> opens that flow with that node's drawer open; the AC detail builds it from the flow id and node id its appearance list already carries."
test_spec:
  - name: AC detail 'Appears in flows' hrefs are the step addresses for UXP-411, UXP-210d-2 and BO-2000b
    target_dir: leafcutter-web/components/atlas/__tests__/
    framework: vitest
    type: component
    angle: criterion
    covers:
      - UXP-591-3
      - UXP-524
    must_catch:
      - the drawer still emits /flows?flow=<id>&step=<node>
      - branch appearances are dropped
      - two nodes of one flow collapse into one link
  - name: no 'Appears in flows' href uses the ?flow= form or percent-encodes the slash in a flow id
    target_dir: leafcutter-web/components/atlas/__tests__/
    framework: vitest
    type: component
    angle: failure
    covers:
      - UXP-591-3
      - UXP-524
  - name: every FlowAppearance in atlas-flows.mock.json yields its href in the AC detail
    target_dir: leafcutter-web/components/atlas/__tests__/
    framework: vitest
    type: component
    angle: real_artifact
    covers:
      - UXP-591-3
      - UXP-524
  - name: following UXP-411's href through the catch-all route opens leafcutter/flow-render-pipeline with
      the resolve drawer
    target_dir: leafcutter-web/__tests__/
    framework: vitest
    type: integration
    angle: reachability
    surface_invoked: href rendered by leafcutter-web/components/atlas/detail-drawer.tsx, then the default
      export of leafcutter-web/app/flows/[...id]/page.tsx with that path and query
    covers:
      - UXP-591-3
      - UXP-524
test_rationale: UXP-524 was marked done while its links were dead, because nothing followed the href;
  the reachability test follows UXP-411's href into the real route, and every test carries UXP-524 so
  its proof is restored with this change.
