id: BP-1100a-1
title: "Refinement files_touched lens flags a behavior ticket missing its executable target"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a ticket whose acceptance criterion describes runtime behavior — for example
  "commitStageOutput() dispatches the commit agent" — and whose files_touched lists
  only documentation surfaces (a SKILL.md file, an ADR, and a diagram), with no file
  under scripts/workflows/ or templates/workflows-js/,
  When the refinement files_touched-completeness lens evaluates the ticket,
  Then the lens reports a completeness violation that names the ticket and states that
  a behavioral acceptance criterion has no executable file in files_touched,
  And the violation is raised before any coder agent is dispatched.
depends_on:
  - BP-1100a
doc_links:
  - path: docs/retrospectives/EPIC-CommitAcOutputPerStage.md
    relationship: describes
    status: exists
  - path: docs/architecture/agent_delivery_workflows.md
    relationship: describes
    status: exists
assigned_agent: workflow-architect
estimated_complexity: M
it_requirements:
  - "The refinement five-lens pass (lens 1, files_touched completeness) must classify each acceptance criterion as behavioral or documentation-only, using the criterion's verbs (calls, dispatches, executes, returns, blocks) as the behavioral signal."
  - "For any behavioral criterion, at least one files_touched entry must match an executable surface (a path under scripts/workflows/ or templates/workflows-js/, or another runtime artifact); a files_touched list of only .md/ADR/diagram paths is a violation."
  - "The violation must be reported (named ticket + reason) and gate the ticket before the first coder dispatch; it must not be a silent pass."
delivers_to:
  agent: ticket-supervisor
  contract: "A refinement lens that emits a files_touched-completeness violation for behavioral tickets whose files_touched contains no executable surface"
