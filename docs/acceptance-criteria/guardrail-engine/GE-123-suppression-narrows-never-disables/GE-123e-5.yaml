notes: |
  DISCHARGES GE-123e's documentation_triggers: [reference-doc]. GE-123e's reason:
  once the bypass is gone, the rule must be written where a reader of the guardrails
  looks, not only in the known-issues register and a retrospective.

  ORDERING. Write this after GE-123e-1 to -4 (and -4-i) have settled. A reference
  written from the criteria and not from the shipped behaviour records an intention.

  SCOPE OF THE SEARCH ARM. Shipped instruction surfaces only: agent templates,
  skills and command prompts. Retrospectives, known-issue records, changelogs and
  AC records are dated history and legitimately quote the token. At authoring time
  the commit agent template names the check but does not advertise the token. The
  arm is a guard against reintroduction and against copies the BA could not see
  (source was not read).

  HOUSEKEEPING, NOT A TRIGGER: the implementing change must also move
  KI-CG-20260901 to resolved. Neither KI-CG-20261116 (the structural-change token's
  own stale-message defect) nor the structural-change token's description on other
  checks is touched. Both are FENCED by GE-123e.

  TEST-EVIDENCE NOTE (for the IT PO). Any test here reads the real reference and the
  real shipped prompt files on disk. A test against a fixture copy proves nothing
  about what a reader finds.
