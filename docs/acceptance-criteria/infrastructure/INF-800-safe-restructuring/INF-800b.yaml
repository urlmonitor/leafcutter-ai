criteria: |
  Cross-file dependency map before any restructuring begins.

  You see a structural picture of how modules, classes, and functions
  connect to each other -- which modules import which, where shared
  utilities live, and where tangled dependencies create risk. This
  understanding drives the restructuring plan, not guesswork.
