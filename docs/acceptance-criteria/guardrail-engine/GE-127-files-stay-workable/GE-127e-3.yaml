it_requirements:
  - >-
    NO PACKAGE SURFACE — MEASURED, NOT ASSUMED. WATCHED_REGISTRIES binds hooks_manifest.hooks
    (by id) and the document's own top level (by mapping key) on commit_guardian.json. This
    record adds neither: its whole effect is to audit, and where necessary DELETE, sentences
    in a printed message. Deleting text registers nothing. `check-file-size` is already a
    manifest id and `file_size` already a top-level key, both read in this worktree. Plain
    -list spec form; no config_schema_fragment invented to satisfy the structured-spec
    validator.
  - >-
    THE FIRST APPLICATION IS AN INVENTORY OF EVERY SENTENCE THE GUARD PRINTS, AND IT MUST BE
    PERFORMED RATHER THAN ASSUMED. The audited population is every sentence in the refusal,
    including all of the ones inherited from the incumbent message: the refactor-and-split
    instruction, the do-not-strip-content warning, the `@documentation-expert` branch, the
    `/code-refactoring-specialist` branch, the generic fallback branch, and the parenthetical
    about enforcing the check over time. Each is either evidenced by carrying it out or
    deleted. There is no third disposition — softening a sentence to "consider" leaves the
    reader exactly where a dead dispatch leaves them, which is the failure GE-122c-1 records.
  - >-
    THREE MEASURED FACTS ABOUT THE INCUMBENT SENTENCES, RECORDED SO THE AUDIT STARTS FROM
    EVIDENCE RATHER THAN FROM SCRATCH — AND NONE OF THEM IS THE VERDICT, WHICH ONLY RUNNING
    THE ACTION CAN GIVE. (a) `/code-refactoring-specialist` resolves to
    templates/workflows/code-refactoring-specialist.md and IS deployed as a slash command in
    the workspace install, so the pointer is not simply dead. (b) That workflow's own step 1
    instructs running `python .agent/skills/code-analysis/scripts/analyze_structure.py`, and
    no file of that name exists anywhere in the workspace — a promise one level below the
    refusal, which this criterion's evidence bar reaches. (c) The `@documentation-expert`
    branch fires only for a path ending `.md`, and `.md` is not in checked_extensions, so
    that branch is unreachable at every commit: an unreachable sentence cannot be evidenced
    by carrying it out and is therefore deleted, not defended.
  - >-
    A COMMIT-TIME HOOK CAN BLOCK AND PRINT; IT CANNOT BRING IN AN AGENT. That is settled in
    this component by GE-122c-1 and it is the ceiling on what any sentence here may claim. No
    sentence may state or imply that a specialist has been engaged, that a review has been
    run, that anything has been queued, or that a report will follow. The pre-commit process
    exits and nothing survives it. Any capability that genuinely requires a live session
    belongs to a live-session surface and must be named as something the READER does, never
    as something that has been done or will be done for them.
  - >-
    "ALREADY DONE" IS A CLAIM ABOUT THE RUN THAT PRINTED THE SENTENCE, AND MUST BE OBSERVABLE
    IN THAT RUN. If the refusal says work was performed on the author's behalf — a file
    parsed, an analysis computed, a candidate division derived — that work must be evidenced
    from the same invocation, not from a prior run, not from a cache and not from a
    capability that exists somewhere in the package. The description GE-127e-1 produces is
    the one such claim this tree creates, and it is honest precisely because it is computed
    in that run and printed in that message.
  - >-
    DELETION IS THE COMPLIANT MOVE AND MUST NOT BE TRADED FOR SUBSTITUTION. This record is a
    ceiling, not a floor: a refusal that offers nothing passes it. The pressure an implementer
    will feel — to replace a deleted sentence with a vaguer one so the message does not look
    empty — is exactly how the incumbent message came to exist. The floor is GE-127e-1's, and
    is met by describing the file, never by adding a sentence in order to have one.
  - >-
    THE AUDIT HAS NO STANDING ENFORCEMENT MECHANISM AND MUST NOT ACQUIRE A FAKE ONE. Do not
    add an approved-sentence allowlist, a message-template registry, or a lint rule that
    checks the refusal text against a fixture — every one of those passes on a guard that
    delivers nothing, which is the family of assertions GE-122c-1's coverage note rules out.
    The durable enforcement is the descriptors below, which carry out whatever the message
    names.
  - >-
    Must follow the repo error-handling policy for any action-verification code that reaches
    the filesystem or a subprocess: specific-exception try/except, log at WARNING or higher or
    re-raise, no bare or blind excepts. Note that verification belongs in the TEST, not in the
    gate — the gate must not attempt to check its own message at commit time, which would put
    I/O of unknown cost on every refusal.
  - >-
    CANONICAL VERSUS BUILD OUTPUT, AND THE BUILD IS PART OF THE CHANGE. The message the author
    actually reads is printed by the DEPLOYED copy under
    .leafcutter/scripts/commit_guardian/. A sentence deleted only from
    templates/scripts/commit_guardian/check_file_size.py leaves the unkeepable promise on
    screen at every real commit while the source-tree tests report it gone. Re-run `python
    scripts/build.py --target-dir .` as part of the change, and let the deployed descriptor
    below be the thing that proves it.
test_spec:
  - name: test_ge_127e_3_every_action_the_refusal_names_is_carried_out_and_produces_what_it_says
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Produce a real refusal from a real commit attempt, extract every further action it
      names — something to run, something to read, a helper to use, a specialist to bring in
      — and CARRY EACH ONE OUT, exactly as stated, from the place the refusal says to carry
      it out. Each must be performable and must produce the thing the refusal says it
      produces. Extraction is from the actual emitted text, so a sentence added later is
      audited automatically rather than needing the test updated. NAMED MUTATION (mandatory,
      run it, do not merely describe it — the BA's injection 1): "the action can be carried
      out as stated, and it produces the thing the refusal says it produces" — MUTATION:
      append to the refusal one sentence naming a helper that the run does not invoke and
      that cannot be carried out as written — the exact shape of the recorded anti-precedent,
      e.g. a sentence stating that a refactoring specialist has been engaged for this file.
      Under that injection this clause must go RED, and must return to green on revert.
      Without this injection the clause is satisfied by a refusal that names nothing, which
      is today's state for every sentence except the helper pointer.
  - name: test_ge_127e_3_the_incumbent_helper_pointer_is_disposed_of_by_running_it_not_by_assumption
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: >-
      THE FIRST APPLICATION, AGAINST THE MESSAGE THAT SHIPS TODAY. Refuse a real over-limit
      `.py` file and take the shipped sentence that names `/code-refactoring-specialist` at
      its word: establish, by carrying it out, whether that action is available to the reader
      of a terminal refusal and whether it produces an intelligent split of the named file.
      The chain is followed all the way down — the workflow exists and is deployed, but its
      own step 1 runs
      `python .agent/skills/code-analysis/scripts/analyze_structure.py <file>`, which was
      found nowhere in the workspace at enrichment time. Whichever way the evidence falls,
      the sentence either stays because it was run or is deleted; a softened wording fails
      this descriptor. The same treatment is applied to the `@documentation-expert` branch,
      which cannot fire at all while `.md` is absent from checked_extensions, and to the
      generic fallback branch.
  - name: test_ge_127e_3_a_claim_that_work_was_already_done_is_observable_in_that_same_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      For every statement in the refusal that work was performed on the author's behalf
      before they read it, check the claim against what the run that produced the refusal
      actually did — same invocation, no cache, no prior run, no capability that merely
      exists in the package. The description GE-127e-1 produces is the intended passing case
      and must be shown to pass by being computed in that run; a claim sourced from anywhere
      else fails.
  - name: test_ge_127e_3_the_refusal_makes_no_promise_about_anything_happening_afterwards
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      The refusal contains no statement that anything will be done on the author's behalf
      after it is issued. Asserted against the real emitted text of a real refusal, and
      against the process itself: nothing is queued, spawned, scheduled or written for later
      consumption during the run. NAMED MUTATION (mandatory, run it — the BA's injection 2):
      "the refusal contains no statement that anything will be done on the author's behalf
      after the refusal is issued" — MUTATION: append a sentence stating that the file has
      been queued for follow-up, or that a report will be produced for it. Under that
      injection this clause must go RED, and must return to green on revert. This is the
      future-tense version of the same defect and it is the one most likely to be added in
      good faith by an implementer who has built the queueing but not the consuming end.
  - name: test_ge_127e_3_a_refusal_that_offers_nothing_at_all_satisfies_this_record
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      THE CEILING STATED AS A PERMISSION, WHICH IS WHAT MAKES DELETION COMPLIANT. A refusal
      naming no further action and claiming no work of any kind passes this record. The
      descriptor exists so that removing an unkeepable sentence is demonstrably not a
      regression against this criterion, and so that no implementer is pressured into adding
      a sentence in order to have one. Its counterpart floor lives in GE-127e-1, and this
      descriptor deliberately does not assert it.
  - name: test_ge_127e_3_the_audited_text_is_the_one_the_registered_hook_actually_emits
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      PRODUCTION ENTRY POINT. The text under audit is captured from the registered hook
      path's own output stream, not from a message-assembling helper called in-process. A
      message that is honest when assembled directly and different when printed through the
      hook is the only thing this descriptor can catch, and it is the difference between
      auditing what the author reads and auditing what the code intended them to read.
  - name: test_ge_127e_3_the_deployed_copy_carries_no_unkeepable_sentence_in_a_cold_process
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After build.py, run the DEPLOYED copy in a cold process and re-run the action audit
      against ITS refusal. This is the descriptor that catches the specific way this record
      fails silently: a sentence deleted from the canonical template but never built leaves
      the unkeepable promise on screen at every real commit while every source-tree test
      reports it gone.
test_rationale: |
  Every arm of this criterion asserts an absence or a property of text that may not be present
  at all, and all of them are green on arrival against a refusal that names nothing. That is
  why both of the BA's injections are carried into descriptors verbatim rather than restated
  as prose: without them, an implementation that deletes the helper pointer and adds nothing
  passes this record trivially and would keep passing after someone later re-adds a promise.

  The evidence bar is not negotiated down here. "The action can be carried out" is evidenced by
  CARRYING IT OUT in the test, from a real refusal produced by a real commit attempt. The
  descriptors deliberately exclude the entire family of assertions GE-122c-1's coverage note
  rules out for the same reason in this same component: that the refusal contains a path which
  exists on disk, that a helper is registered somewhere, that a dispatch function is defined,
  or that the text matches an approved list of sentences. Each of those passes on a guard that
  delivers nothing, which is precisely how the anti-precedent stayed green while every author
  who read it believed they were covered.

  Actions are extracted from the actual emitted text rather than from a list the test authored.
  A fixed list would make the audit stale the moment a sentence is added, and a later sentence
  is exactly the shape of the second injection — a queueing promise added in good faith by
  someone who built half of it.

  The permission descriptor is not filler. Read alone this record is passed by a refusal that
  offers nothing, and that is deliberate; stating the ceiling as a permission is what makes
  deleting an unkeepable sentence the compliant move rather than something an implementer will
  quietly avoid by softening the wording instead. The deployed descriptor is likewise not
  redundant with the reachability one: reachability proves the audited text is what the hook
  path emits, deployed proves it is what the BUILT copy emits, and only the second catches the
  unbuilt deletion.
delivers_to:
  - agent: python-coder
    ac_id: GE-127e-3-i
    contract: >-
      The honesty ceiling and the named-line discipline it implies: any state the refusal
      reports must be one the run actually reached, stated in its own words rather than
      papered over. GE-127e-3-i applies that ceiling to the one state where the description
      could not be produced, and inherits from here the rule that a substitute sentence is
      worse than saying nothing.
expects_from:
  ac_id: GE-127a-1
  contract: >-
    The refusal and the single outcome stream it is emitted through. This record adds
    no content to it; it constrains what that content is permitted to CLAIM, and
    applies to every sentence in the refusal including any inherited from the
    incumbent message.
