id: TQ-600a-10-ii
components:
  - testing_quality
title: "An unmeasured saving is measured before it is claimed, and abandoned if it is not there"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a proposed saving whose size has never been measured — the copy step was never
    timed, and the case for it rests entirely on a file count of over eleven thousand
    against about five hundred,
  And the specific way this fails: the structural argument is persuasive enough that a
    disappointing measurement will be explained away rather than acted on, unless the
    response to a disappointing measurement is agreed in advance,
  And this workspace's measuring conditions, which rule out absolute thresholds: a
    shared host under variable load, where the figures already in these records were
    taken under load and are upper bounds,
  When the copy step is timed with the whole-checkout copy and with the smaller copy,
    on the same machine, in the same sitting, with the same number of copies,
  Then both figures are reported alongside the change, and the claim made for the
    change is the measured ratio between them rather than any figure stated in advance,
  And the comparison is a ratio taken in one sitting, never an absolute number of
    seconds compared against a threshold, so that a loaded host produces a smaller
    claim rather than a false failure,
  And when the measured ratio shows no reduction, the change is reverted and the
    finding reported as a negative result, rather than kept on the strength of the file
    count,
  And no record, message or summary accompanying this change states a figure that was
    not produced by that measurement.
