title: "A pause record that cannot be read is never reported as a pause record that does not exist"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given a run paused at a decision point whose durable pause record exists on disk
    and is not stale,
  When the route is started again supplying the person's well-formed answer for that
    decision point, and the dispatch that reads the pause record returns a reply that
    is not the record (prose, commentary, or anything without a readable boolean
    "exists"),
  Then the read is re-attempted with a stricter instruction under a distinct label for
    each attempt, bounded to three attempts in total,
  And if a later attempt returns a readable record with exists true and not stale, the
    person's answer is applied to that decision exactly as ACD-2100c-3 requires,
  And if no attempt returns a readable record, the run ends with the distinct status
    "pause_record_unreadable", its message says the record could not be read (not that
    it is absent) and how to retry, the answer is not applied, and the record and the
    drafted work are left unchanged on disk,
  And a readable record reporting exists false still ends with "nothing_to_resume",
  And every other read of the pause record goes through that same bounded retry: the
    read-back that verifies a pause was persisted (an unreadable reply on every attempt
    is never reported as a verified pause, a reply that is damaged once and then valid
    on a later attempt IS verified as paused), and the read-back that verifies a pause
    record was cleared after a resume (an unreadable reply is never reported as cleared),
  And a reply whose outer JSON object is malformed (for example a closing brace dropped
    from the record the reader retyped) is never replaced by one of the objects nested
    inside it: the reader skips the whole malformed object, so such a reply is treated as
    unreadable and re-attempted, never as a record with no "exists" field,
  And the bug symptom ("A person-attributed, shape-valid resume_answer {gate_id:'gate-po', action:'approve', channel:'person'} for a run whose durable pause record verifiably exists on disk (exists:true, stale:false; the preceding peek-pause-record dispatch in the same run returned it correctly) terminated with {status:'nothing_to_resume'} (live, 2026-10-09, run_id pf-workspace-scratch-cleanup-20261009). The person's approval was silently lost and the run falsely reported there was nothing to resume. On a harness resume (resumeFromRunId) the identical (prompt, opts) replays the cached bad reply, so the failure repeats deterministically.") must not occur.
depends_on: [ACD-2100c-3]
