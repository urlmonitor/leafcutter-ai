id: FIN-200c
title: "Finalize never silently ships without a changelog record"
component: finalize
level: L1
status: active
readiness: approved
priority: high
req_status: draft
work_status: todo
criteria: |
  If the changelog cannot be captured, finalize reports it instead of completing
  as though a record was written.

  Given a feature or epic branch is being finalized,
  When changelog capture fails to produce an entry,
  Then finalize surfaces the failure to the developer rather than completing
  silently,
  And finalize does not behave as if a changelog entry was written,
  And no finalized feature reaches main with a missing changelog entry going
  unreported.
