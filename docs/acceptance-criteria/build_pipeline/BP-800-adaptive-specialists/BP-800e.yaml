criteria: |
  A compatibility check at build time migrates old project context into the new structure.

  Projects using the old hardcoded agent structure get an automatic migration
  when they upgrade. The build detects the earlier layout, transfers project
  context into the new generation-based structure, and the user continues
  working without manual steps.
