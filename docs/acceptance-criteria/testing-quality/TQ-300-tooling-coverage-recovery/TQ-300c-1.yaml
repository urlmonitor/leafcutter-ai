assigned_agent: python-coder
estimated_complexity: M
test_required: true
test_spec:
  - name: test_blocked_tickets_excluded_from_ready
    target_dir: tests/
    framework: pytest
    type: unit
    description: "compute_ready returns (ready, blocked) with tickets whose deps are unmet excluded from ready."
  - name: test_ready_sorted_highest_priority_first
    target_dir: tests/
    framework: pytest
    type: unit
    description: "ready is sorted highest-priority-first per PRIORITY_ORDER (critical<high<medium<low)."
  - name: test_parked_ticket_excluded_even_when_unblocked
    target_dir: tests/
    framework: pytest
    type: unit
    description: "A status: parked ticket is excluded from ready even when all its deps are satisfied (requires the production fix in it_requirements)."
  - name: test_dependency_cycle_is_reported_with_nodes
    target_dir: tests/
    framework: pytest
    type: unit
    description: "detect_cycle returns the cycle node path (and main() exits non-zero) for a dependency cycle rather than surfacing an arbitrary ticket as ready."
it_requirements:
  - "Author fresh unit tests in tests/test_prioritize.py (new file). Write from scratch and verify run-to-green before sign-off. prioritize.py lives under templates/skills/ticket-prioritizer/scripts/ — import it via sys.path.insert of that scripts directory (see tests/test_pick_next_with_acs.py for the sys.path pattern)."
  - "API MISMATCH: there is NO single function named prioritize. Map 'the prioritizer ranks the tickets' to the pipeline discover_tickets -> build_graph -> detect_cycle -> compute_ready. Assert compute_ready returns (ready, blocked); assert detect_cycle returns the cycle node path."
  - "PRODUCTION FIX REQUIRED before the parked scenario can go green: parked-ticket handling does NOT exist — _is_done treats only status 'done'/'deferred' as done, so a status: parked ticket is currently surfaced as ready. The coder must add 'parked' exclusion to the ready-set computation so the test can assert the parked ticket is filtered out; coordinate this small production change in the same ticket as the test."
  - "Use tmp_path ticket .md fixtures carrying real frontmatter (status, priority, depends_on) since discovery is filesystem-driven (discover_tickets rglob's *.md). Do not duplicate tests/test_prioritize_ac_integration.py, which covers only the --include-acs CLI flag."
