title: "selectDispatchPhases preserves all phases including pull-request when isEpicMember is false (single-ticket backward compatible)"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the pure helper selectDispatchPhases(orderedPhases, isEpicMember) exported
    from templates/workflows-js/build-feature.js,
  And orderedPhases is the list of per-ticket phase objects
    [{agent: "test-writer"}, {agent: "python-coder"}, {agent: "commit"}, {agent: "pull-request"}],
  When selectDispatchPhases(orderedPhases, false) is executed,
  Then the returned list contains the phase whose agent equals "pull-request",
  And the returned list has the same phases in the same order as orderedPhases
    (no phase is removed and the element count is unchanged),
  And executing selectDispatchPhases(orderedPhases) with the second argument
    omitted returns the same list as selectDispatchPhases(orderedPhases, false)
    (isEpicMember defaults to false).
notes: |
  This is the backward-compatibility guarantee: a standalone single-ticket build
  is not an epic member, so its dispatch set is unchanged and it still opens its
  own pull request. Testability: behavioral, not grep-only — a test EXECUTES
  selectDispatchPhases (e.g. via `node`) with the concrete orderedPhases above,
  once passing false and once omitting the argument, and asserts pull-request
  survives in both and the returned lists match.
