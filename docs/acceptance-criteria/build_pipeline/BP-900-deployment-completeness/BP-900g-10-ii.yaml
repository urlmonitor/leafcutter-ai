notes: |
  WHY THIS ESCAPES BOTH THE PARENT AND ITS SIBLING. BP-900g-10 forbids a neutral
  default, on the reasoning that a neutral default is indistinguishable from a correct
  result. Here the default is not neutral and it is not indistinguishable — it is a
  denial, and it is extremely visible. It stops the work and demands attention. The
  reason it is still the same defect is that the attention it commands is aimed
  somewhere false: at a permission the reader must go and disprove, in a file that is
  correct, rather than at the file that is absent.

  THE PYTHON IDIOM THAT PRODUCES IT is the thing to hunt for, not the one workflow.
  Any expression that coerces a lookup result to a boolean — a truthiness test over a
  possibly-absent record, a get-with-default that returns the falsy value, an
  equality test against an expected value that an empty result fails — collapses
  "absent" and "says no" into one branch. The surface is not confined to one language
  or one file: the live instance is in a JavaScript workflow, and the same idiom is
  available everywhere. Audit for the idiom.

  THE NEGATIVE CONTROL THAT MATTERS. A fix that permits everything when the file is
  missing is not a fix, it is the opposite defect with a friendlier failure mode. The
  criterion demands three distinct outcomes — permitted, denied by a record that says
  so, and unable to decide — and it is the third that must be new.
