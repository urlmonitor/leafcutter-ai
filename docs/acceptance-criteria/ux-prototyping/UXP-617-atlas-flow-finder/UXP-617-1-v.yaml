assigned_agent: frontend-coder
estimated_complexity: S
delivers_to: null
expects_from:
- ac_id: UXP-617-1-iii
  contract: Per-value flow counts with the search and other facets kept.
- ac_id: UXP-617-2
  contract: buildFinderHref(state) for each suggestion's remove address.
it_requirements:
- One suggestion per chosen facet value; its count comes from the same listing function with that value
  removed and q kept, and its href is that chip's remove address built by the UXP-617-2 address builder.
- The empty state is computed in leafcutter-web/lib/flow-finder/ (the FlowFinderQuery empty_state shape);
  the component only renders it, and the live region announces 'No flows match'.
- Following a suggestion is an in-place finder edit (replace), not a push or a router navigation.
- Expected values come from the leafcutter/atlas-flows v4 dataset records, replayed against a frozen finder-index
  fixture in leafcutter-web/fixtures/flow-finder/ produced by the finder's own index builder from docs/product-truth/flows/
  at the dataset's measurement commit (provenance recorded in the fixture); tests never pin counts against
  the live store, which grows. fixtures/** is already excluded from vitest collection.
test_spec:
- name: 'tracking + Jev replay: ''No flows match'', the quoted title and ''Remove Actor: Jev'' linking
    /flows?q=tracking with 3 flows'
  target_dir: leafcutter-web/__tests__/uxp-617-1/
  framework: vitest
  type: unit
  angle: real_artifact
  description: Replays FlowFinderQuery finder-no-match over the fixture.
- name: 'following ''Remove Actor: Jev'' lists the 3 flows with the search kept and adds no history entry'
  target_dir: leafcutter-web/__tests__/uxp-617-1/
  framework: vitest
  type: component
  angle: seam
  must_catch:
  - following the suggestion pushes an entry
  - the search is dropped
- name: a facet combination that matches nothing with no search shows 'No flows match these filters'
  target_dir: leafcutter-web/__tests__/uxp-617-1/
  framework: vitest
  type: unit
  angle: boundary
  description: The combination is chosen from the fixture, not pinned by this AC.
test_rationale: 'Tests are vitest under leafcutter-web/__tests__/, run host-side with `npx vitest run`
  (180 s timeout). Known gap: the build pipeline''s red-baseline and done-proof checks cannot read vitest
  tests yet, so build by direct phase dispatch with host-run vitest, as the UXP-591 epic was. No Playwright:
  the harness is deferred by the owner.'
test_required: true
