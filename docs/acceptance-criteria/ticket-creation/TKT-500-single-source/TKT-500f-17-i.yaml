criteria: |
  This edge case bounds TKT-500f-17 so the WARNING path stays visible and
  deterministic rather than masking or guessing.

  Given a leaf AC whose component value cannot be resolved to any valid
    components.json graph id,
  When a ticket is generated from that AC by generate_ticket_from_ac.py,
  Then the WARNING message identifies both the source AC id and the exact
    unresolved component value,
  And the unresolved value is passed through to the generated components LIST
    verbatim — it is neither silently dropped nor replaced by a fabricated or
    guessed graph id — so the downstream Component-vocab CI check surfaces it
    visibly instead of the generator masking it,
  And the WARNING is emitted at most once per distinct unresolved value even when
    that value appears more than once in the AC's components.
