criteria: |
  Every doc request says exactly what to write, where, and what to link.

  When documentation is required, whoever writes it receives a clear brief: the
  kind of document needed (how-to, reference, diagram, or explanation), where it
  belongs, what it must contain, and which existing docs to update or cross-link.
  The result is accurate, useful documentation instead of generic filler -- and
  far less rework.
