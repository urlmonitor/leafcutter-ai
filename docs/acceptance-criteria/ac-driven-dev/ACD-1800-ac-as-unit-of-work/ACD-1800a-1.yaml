notes: |
  CONCEPT A (part 1) -- the AC as a self-contained mini-ticket that enumerates its
  own deliverables. Declaration/presence behaviour of ACD-1800a. Complements
  ACD-1600a (ticket references the AC, no copy) and ACD-1600b (agents read the spec
  from the store); does not duplicate ACD-1600c (buildable = concrete files + test
  contract), which gates SPEC completeness -- this L2 is about the requirement
  declaring the full set of DELIVERABLES.

  IT-PO enrichment (2026-08-12): surface = AC-store schema (config/ac_store_schema.json)
  + validators (scripts/ac_store/, scripts/commit_guardian/); added ac_store to the
  graph components list so component_membership edges point at the code that implements
  this. This is the normative deliverable-checklist model documented by ACD-1800a-3.

  2026-08-31 -- KIND VOCABULARY AMENDED (BA). See amended_by for the full reasoning. In
  short: reuse the store's existing change-target vocabulary rather than minting a fifth
  parallel one, add `diagram` to it as the single genuinely-missing value, and drop
  `tests`, which is a proof rather than an artifact and which -- given the independent
  per-deliverable sign-off slots of ACD-1800b-1a -- would let a record hold a signed-off
  code deliverable next to an unstarted tests deliverable.

  THE ENRICHMENT FIELDS ON THIS RECORD ARE NOW STALE and were deliberately left alone:
  it_requirements, delivers_to, expects_from and test_spec all still name the superseded
  five-value enum. They are the IT PO's to re-derive, and until they are, this record
  contradicts itself between criteria and it_requirements -- with the it_requirements
  side being the one an implementer reads. Flagged in amended_by so the contradiction is
  attributable rather than discovered.
