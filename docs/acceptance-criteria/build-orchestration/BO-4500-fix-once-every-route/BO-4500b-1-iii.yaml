criteria: |
  Given route A's template holds the line "return { action: 'continue' };" between its
    ALPHA-ANSWER start and end markers,
  When the package is installed,
  Then the install fails with a message naming route A and the block ALPHA-ANSWER and stating that
    the marker pair in a route template must be empty,
  And every installed route is byte for byte as it was before that install began.

  Given route A's template holds, between its ALPHA-ANSWER markers, text byte for byte equal to
    the current ALPHA-ANSWER source,
  When the package is installed,
  Then the install fails with the same message naming route A and ALPHA-ANSWER,
  And every installed route is byte for byte as it was before that install began.
