    relevance: "THE ENTRY POINT THAT MUST ACQUIRE THIS REFUSAL. Today it takes no adjudication input at all: it calls the scan, iterates every parent the scan names, and patches each one. There is no argument, flag or file by which a caller could express that a record should be left alone. That is why the refusal has to be a behaviour of the tool rather than a convention its callers follow."
