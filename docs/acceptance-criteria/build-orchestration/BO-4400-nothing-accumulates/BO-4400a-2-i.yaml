id: BO-4400a-2-i
title: "A run that fails after its pull request opened keeps its workspace until its work lands, clears it once landed, and still reports the failure"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
criteria: |
  Given the quick fix has pushed its commits and opened its pull request, and a step it
    runs after that fails without creating any new commit or changing any file in the
    workspace, while the pull request is still open and not merged into the main line,
  When the run returns its final result,
  Then the workspace still exists, identical to its state when the step failed,
  And the final result reports the run as failed and names the failing step,
  And the final result also reports the workspace as kept because its work is not yet
    on the main line, leaving it for the landed-work pass,
  And given instead the step after the pull request creates one new commit and then
    fails before pushing it,
  When the run returns its final result,
  Then the workspace still exists and the final result names that one commit as kept.

  Given the quick fix has pushed its commits and opened its pull request, that pull
    request has been merged into the main line, and a step the quick fix runs after the
    merge fails without creating any new commit or changing any file in the workspace,
  When the run returns its final result,
  Then no folder remains at the location its workspace occupied,
  And the final result reports the run as failed and names the failing step,
  And the final result also contains the one shared clearing door's answer reporting the
    workspace removed.
depends_on: [BO-4400a-2]
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-4300-one-way-workspaces/BO-4300e-2.yaml
    relationship: constrains
    status: exists
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: BO-4400a-2
  contract: "Halt-path handling that keeps work and names it."
package_surface: false
it_requirements:
  - >-
    quick-fix.js issues the route-end clearing request after a post-pull-request step fails, using
    BO-4400a-1's shared step; the final result reports status failed, names the failing step, and
    carries the clearing answer (kept as not_on_main while the pull request is open, UNSENT_WORK relayed
    as kept work, removed only once the work has landed).
  - >-
    The run's failure status is never overwritten by a successful clear, and a refused clear never
    turns the run's failure into a second, different error.
  - >-
    PROOF: deployed quick-fix workflow under unit_tests/_workflow_engine_harness.py; the failing
    post-PR step is a scripted reply in three variants: one with no file change while the pull request is
    still open; one that makes a real commit in the workspace and then fails; and one where the pull request
    has been merged on the real bare hub (squash merge with the line deleted, the repository's default) and the
    step after the merge then fails with no file change. The maker is executed for real. Isolation and
    no-build.py rules as BO-4400a-1.
test_required: true
test_spec:
  - name: test_post_pr_failure_with_open_pull_request_keeps_workspace_and_reports_failure
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "The workspace is unchanged; the result is failed, names the failing step and reports the workspace kept as not yet on the main line."
    must_catch:
      - "clear on the pushed but unmerged line (the door's pushed-counts-as-sent verdict used instead of the landed rule)"
      - "the run's failed status replaced by the clearing answer"
  - name: test_post_pr_failure_with_new_unpushed_commit_keeps_workspace
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "The workspace still exists and the result names the one new commit as kept."
    must_catch:
      - "clear on any post-PR failure without consulting the verdict"
  - name: test_post_merge_failure_clears_workspace_and_still_reports_failure
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      The pull request is merged on the real bare hub, then the step after the merge fails with no file change.
      No folder remains at the workspace location. The result is failed, names the failing step, and contains the
      door's own removed answer (removed_path equal to the workspace path).
    must_catch:
      - "only clear on success (workspace left behind holding nothing, after its work landed)"
      - "the run's failed status replaced by the clearing answer"
      - "a squash-merged line judged by commit identity, so the landed workspace is kept"
  - name: test_quick_fix_post_pr_failure_reaches_its_clearing_step_in_the_deployed_flow
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      Grounding added at the test-designer pass (nothing above is weakened). The deployed quick-fix.js is run under
      run_workflow_under_e2 with the scripted failing post-pull-request step (three variants); in each the clearing
      dispatch is recorded after the failure, the result stays failed and names the failing step. quick-fix.js
      carries no clearing dispatch today, so each variant is red until the build. The live shell stand-in is a
      prerequisite (the harness replays static label_responses).
    code_file: templates/workflows-js/quick-fix.js
  - name: test_merged_squash_with_deleted_line_is_judged_by_content_in_the_real_maker
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      Third variant, at the maker: after a real squash merge on the hub with the line deleted (the repository's
      default), clear-landed --kind K --slug S clears the workspace. The door today compares commits by identity only
      (worktree_remove._unsent_commits), so without BO-4400g-2's content check it answers UNSENT_WORK and the variant
      fails, which is the wrong version this entry catches. The maker proof belongs to BO-4400g-2-ii, this entry
      pins that quick fix's third variant depends on it.
    code_file: templates/scripts/worktree_remove.py
test_design_authorship:
  step: test-designer
  date: "2026-11-16"
test_design_opened_files:
  - templates/workflows-js/quick-fix.js
  - templates/scripts/worktree_remove.py
test_rationale: >-
  The rule is that keeping or clearing follows the workspace's state, not the success flag, and the
  kept reason says which state. Three scripted failures make the set. Two differ only in whether a commit
  was left unsent: one is kept as not yet on the main line, the other names the unsent commit. The third
  fails only after the merge, so a workspace whose work has landed is cleared although the run failed. That
  is the one case where "only clear on success" and the landed rule disagree.
