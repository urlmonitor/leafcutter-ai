criteria: |
  Given a ticket whose YAML frontmatter agents map contains
    "pr-reviewer: signed_off",
  And the ticket body "## Sign-offs" section contains the unchecked line
    "- [ ] pr-reviewer",
  When build-ticket.js Step 1 runs the planner agent,
  Then the planner returns ordered_phases with pr-reviewer having
    status "needed",
  And drift_warnings contains at least one entry naming the
    frontmatter/Sign-offs discrepancy for pr-reviewer.
