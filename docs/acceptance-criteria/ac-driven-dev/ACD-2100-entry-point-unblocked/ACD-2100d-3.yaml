notes: |
  THE HAZARD IS LIVE AND IT RUNS THE WRONG WAY. Verified by the PO on 2026-08-25:
  the deployed workflow at leafcutter-ai/.leafcutter/workflows/plan-feature.js
  carries NO charter gate, while the source does. So a project where the route
  currently starts would have the KI-ACD-009 blocker ADDED to it by the next
  install. A source-only repair has a window in which installing makes things
  worse, and every consumer walks into it on their next build.

  STANDING GUARANTEE, NOT A ONE-OFF CHECK. It is stated in terms of before-and-after
  behaviour of the same project, so it keeps its meaning for the next change to the
  startup path -- which is the point of writing it as an AC rather than as a release
  note for this repair.

  THE BEFORE MEASUREMENT IS NOT OPTIONAL. "The route still starts" is unfalsifiable
  without it: if the route was already broken in that project, an install that keeps
  it broken passes. Measure first, install, measure again.

  DELIBERATELY WEAKER THAN d-1. This does not require the installed and source
  copies to agree -- that is ACD-2100d-1. It requires only that installing never
  takes a working project backwards, which is the guarantee a consumer actually
  relies on and the one the current stale artifact breaks.

  2026-08-25 (it-po): sized M rather than L because the expensive part -- install into a
  temporary target, start a run there, observe how far it got -- is ACD-2100d-1's
  deliverable and is reused here; what is new is the two-measurement protocol, the
  precondition-not-met verdict, and wiring the check so it keeps running. The
  before-measurement is enforced by a test rather than by an instruction: the boundary
  descriptor requires a fixture that an after-only implementation would pass and this
  one must not, which is the only shape that cannot be satisfied by computing the before
  value and discarding it.

  SEQUENCING CAVEAT INHERITED FROM ACD-2100d-1 (raised to the user, not edited here).
  This record's Given -- a project in which the route already reaches the first question
  -- cannot be constructed until ACD-2100a-5 lands, because the source copy halts at the
  charter gate today. depends_on carries [ACD-2100d, ACD-2100d-1], and ACD-2100d-1's own
  depends_on carries only [ACD-2100d], so no path in the build order reaches ACD-2100a-5.
  The build sequencer reads depends_on only (KI-ACD-015, open), so the expects_from edge
  above does not order anything. The it-po does not own depends_on and has not edited it;
  the recommended edit is to add ACD-2100a-5 to ACD-2100d-1's depends_on before the tree
  is approved, which orders this record correctly by transitivity.
target_epic: EPIC-StartingNewWorkTheProperWayAlways
