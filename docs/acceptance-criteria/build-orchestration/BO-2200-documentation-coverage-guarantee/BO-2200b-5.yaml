criteria: |
  Given a ticket whose classification triggered a documentation demand, so
    `documentation-expert` and `documentation-verifier` were injected,
  When an override attempts to set either agent's status to `not_needed`,
  Then the override does not take effect and both agents remain `needed`.
  And this non-suppressibility is enforced the same way the existing TDD-mandatory
    protection keeps `test-writer` and `test-runner` from being stripped once required.
