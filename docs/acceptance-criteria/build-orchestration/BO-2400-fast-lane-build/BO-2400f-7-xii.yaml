criteria: |
  Given the fast-lane how-to after BO-2400f-7-vii, BO-2400f-7-ix and BO-2400f-10-iv are
    built,
  When an operator reads it,
  Then it describes the state-unknown halt: that it is reached when a command step's reply
    carries no exit status and is not the command-step-runner's decline (for example, the
    command was still running when its time budget was spent), that the halt names the step,
    the agent asked and what came back, and that it means the command may have run and what
    it changed is not known,
  And it gives the state-unknown remedy: read the work_status of the run's acceptance
    criteria in the store before starting another run, and do not treat the step as never
    attempted,
  And it describes the ran-and-failed claim halt: that the claim command ran and ended with
    a failure status other than held, that the halt names its exit status and quotes its
    standard error, that the run reconciles the claim before it reports (as below), and
    that the operator's remedy is to act on the cause the quoted standard error names,
  And it describes the held claim halt: that it names the acceptance criteria already at
    in_progress, that the run did not find out which run holds them, and that the remedy is
    to wait for the run that holds them or, if no run does, to return them to todo,
  And it states that a declined step, a state-unknown step, a ran-and-failed claim and a
    held claim are four different halts, and that a halted run reports exactly one of them
    and never two.

  Given the same how-to,
  When an operator reads what happens after a claim that ended as state unknown or as
    ran-and-failed,
  Then it says the run reads the store before it reports, releases back to todo only the
    acceptance criteria that read todo before the claim and in_progress after it, and never
    releases one that was already in_progress before the claim,
  And it says the halt lists the criteria found claimed and released and the criteria found
    unchanged, or says nothing was found claimed,
  And it says that when the store cannot be read the halt lists the criteria possibly left
    at in_progress, and that a later run aimed at them is refused until they are returned
    to todo.

  Given the same how-to,
  When it is compared with the run's actual halt kinds,
  Then every halt kind the how-to names exists in the lane as built, and state unknown,
    ran-and-failed and held are among them.
