    description: "In the SAME test module and the SAME on-disk project, one namespace root is then renamed or removed while the pass still holds it responsible: the commit does not complete, and the output names the root that was not found, the place the pass expected it, and states that uniqueness for that namespace was not established. This is the must-block half of the boundary — without it the first three descriptors are satisfied by teaching the pass that absence means zero."
  - name: test_ge122d3ii_absent_root_never_reads_as_inspected_count_zero
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The absent-root run and the resolved-but-empty run are compared directly: the absent root produces a could-not-establish outcome and never a count of zero, and never contributes to a clean verdict. Distinguishes the two conditions that the shortcut implementation collapses into one."
  - name: test_ge122d3ii_relocated_namespace_is_resolved_at_its_declared_location
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: seam
