id: GE-126b-5
title: "A check reports whether it has ever been shown to refuse anything, and never-shown is a different answer from shown-and-refused"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given each check in the family carries, alongside its own configuration, one
    known-bad input it must reject and the observable rejection that input must
    produce — a non-zero outcome, a named error, or an absence from what the check
    emits,
  And the record of what happened when that input was last fed through the check's
    real entry point can hold exactly four values: the rejection was observed, the
    rejection was not observed, the attempt could not be run to a verdict, and the
    attempt has not been made,
  When any check reports its result,
  Then the report carries that record for that check alongside the result, and the
    four values are distinguishable from one another in the report,
  And a check whose record says the attempt has not been made is not counted among
    the checks whose refusal has been observed, and is not reported as though its
    refusal had been demonstrated,
  And the run states how many checks it examined in total and how many carried each
    of the four values, and the four stated figures sum to the stated total,
  And given one check's record changes from the attempt has not been made to the
    rejection was observed, and nothing else in the repository changes,
  When the run repeats,
  Then the two corresponding stated figures each move by one, in opposite directions,
    and the stated total is unchanged.
