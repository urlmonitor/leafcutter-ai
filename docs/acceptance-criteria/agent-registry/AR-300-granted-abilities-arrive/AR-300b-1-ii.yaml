notes: |
  THE TWO CAUSES ARE NOT COSMETIC VARIANTS. A missing destination is the
  measured defect and the fix is in the delivery path, once, for every agent. An
  empty preparation is an agent-specific data problem and the fix is in that
  agent's declaration. Collapsing them into one message sends every future
  reader down the wrong one of the two roads about half the time.

  REPORTING ONLY THE FIRST AFFECTED AGENT IS HOW 60 LOOKS LIKE 1. The observed
  defect affects the entire population; a report that stops at the first
  instance would have presented it as a single agent's problem.
