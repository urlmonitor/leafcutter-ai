id: ACS-200f-1
components:
  - ac_store
title: "An AC whose covering tests genuinely fail, or that has no covering test at all, is still refused — the gate is unblocked, not weakened"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given an active AC that is still recorded as not-yet-done,
  And a test in the repository declares that it covers that AC but that test
    genuinely fails when the suite is run,
  When an operator runs the done-marking tool for that AC with no environment
    variables set beyond the repository defaults,
  Then the tool refuses to mark the AC done,
  And it exits non-zero and names the failing covering test,
  And the AC's recorded status is left unchanged,
  And given a second active AC for which no test in the repository declares
    coverage at all,
  When the operator runs the same tool for that AC,
  Then the tool refuses and states that no covering test was found,
  And given a third active AC whose only covering test is genuinely skipped or
    genuinely expected to fail for a reason of its own,
  When the operator runs the same tool for that AC,
  Then the tool still refuses, so unblocking the masked-pass case does not turn
    the gate into a rubber stamp.
