priority: medium
roadmap_phase: phase_1
criteria: |
  Who is asking decides whether a commit happens; no typed word opens it.

  A commit goes through only when the party making it is the commit specialist,
  as established from who is actually calling. Nothing a caller writes into its
  command, sets in its surroundings or says in its instructions can make it count
  as the commit specialist, and a caller whose identity cannot be established is
  refused rather than waved through.
