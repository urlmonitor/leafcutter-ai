  ==========================================================================
  ROADMAP — RESOLVED 2026-09-09: NO CURRENT PHASE CLAIMS THIS TREE, ARGUED
  ==========================================================================
  This section previously left the question open ("Either a phase claims this
  tree or it stays unphased backlog"). BrainCandy asked for it to be decided
  rather than left open ("let PO fix it"). DECIDED: `roadmap_phase` is
  deliberately ABSENT, and the absence is the answer rather than an omission.
  All six phases in docs/roadmap.json were checked by their exit criteria, not
  by their titles.

  phase_1 (Stable Portable MVP) — REJECTED, and this is the closest call. Its
  four exit criteria are: clean install on a blank project, `build.py
  --validate-only` returning 0, consecutive builds producing zero git diff, and
  a truthful self-host build. Not one of them moves when the AC store's CONTENT
  changes; they are all about the build producing correct artifacts. The
  tempting argument is the one ACD-2200 makes — "installs into any project" —
  but the two trees sit on opposite sides of that phrase. ACD-2200 makes
  adoption POSSIBLE: without the floor, switching a standard on in an existing
  codebase stops all work, so there is no working install at all. ACD-2300
  makes an adoption already achieved MORE VALUABLE. A project that has ACD-2200
  and not ACD-2300 has a genuine, working, honest install: new work is held to
  the standard and the tolerated backlog is counted and can only go down. That
  is the whole of what phase_1 promises. Claiming phase_1 here would be
  borrowing the sibling's argument for a weaker case — precisely the
  over-claiming ACS-1300's notes warn about.

  phase_acbuild_3_migration — REJECTED, and it is a deliberate trap worth
  naming because its wording matches almost exactly. Its exit criterion reads
  "Opt-in idempotent backfill ships (dry-run, --ac-store-dir, preserves notes
  blocks); >=1 consumer migrated green". That backfill migrates EXISTING
  RECORDS INTO THE NEW SCHEMA SHAPE — schema_version skew, the phase-2a
  deliverable-checklist fields. It is a FORMAT migration over records that
  already exist. This tree CREATES records for code that has none: a CONTENT
  backfill. Same word, disjoint populations. This is exactly the failure mode
  this component's own PROJECT_CONTEXT.md lesson 3 warns about — "check not
  only whether an AC covers it wrongly but whether one covers a NEIGHBOURING
  population under wording that sounds identical" — and it would be a poor
  showing to fall into it in this record's own roadmap section.

  phase_acbuild_1 / 2a / 2b — REJECTED on subject. All three are about moving
  the unit of work onto the requirement (schema slots, deliverable checklists,
  sign-off relocation, ticket thinning). None concerns where a requirement's
  CONTENT comes from. phase_2 (version upgrades, contribution workflow, config
  schema validation) and phase_3 (packaging, distribution) — rejected on
  subject, no argument needed.

  WHY ABSENCE IS A LEGITIMATE ENCODING AND NOT A DODGE. `roadmap_phase` has no
  "none" member in ac_store_schema.json (it is an optional string with
  minLength 1), so inventing a sentinel value would break the field's contract
  with docs/roadmap.json. Absence is already a first-class, queryable state:
  roadmap_query.py reports ACs with no roadmap_phase assigned. This tree is
  therefore recorded as what it actually is — valuable work that no CURRENT
  phase's outcome depends on. The precedent is in-store: ACS-1200 and ACS-1300
  are both unphased for the same reason.

  WHAT WOULD HAVE TO BE TRUE FOR IT TO CLAIM A PHASE — the condition is stated
  so this is falsifiable rather than a permanent shrug. Any ONE of:
    (a) A phase acquires an exit criterion about the RECORD's completeness
        rather than the BUILD's correctness — e.g. "a repository adopting
        leafcutter reaches N% of its behaviour described by requirements". No
        phase carries such a criterion today; that is the actual reason this
        tree is homeless, and it is a gap in the roadmap, not a defect in the
        tree.
    (b) phase_acbuild_3's consumer-migration criterion is widened from schema
        migration to content backfill. Then this tree becomes the mechanism
        that criterion depends on and should claim it outright.
    (c) ACD-2200 ships and the counted backlog turns out NOT to be a tolerable
        steady state for a real adopter — i.e. the floor alone leaves the
        install unusable in practice. That would retroactively make this tree
        part of phase_1's "installs into any project", and the phase_1 claim
        rejected above should be revisited on that evidence.
  Until one of those holds, this is unphased backlog by decision, not by
  neglect.

  No roadmap or vision file was modified, either while authoring this record or
  while resolving the phase question on 2026-09-09. Option (a) above is a
  roadmap change and is NOT proposed here — it is offered as the condition, for
  BrainCandy to accept or decline separately.

  ==========================================================================
  IDENTIFIER AND CAPS
  ==========================================================================
  ACD-2300 established free on 2026-09-09 by the same four independent checks
  recorded in ACD-2200's notes — store-wide id scan (highest ACD-2100),
  whole-worktree grep excluding .git, a grep of the shared main working tree, and
  git grep against origin/main. None of the four is a directory listing, because
  this component holds loose namespace-root records ACD-1400 through ACD-1405 that
  a folder listing misses. RE-VERIFY at merge time; id allocation here is
  known-broken (KI-ACD-008).

  Four L1s against a hard cap of seven — three slots of headroom, deliberately
  preserved. No child_limit_override is authored here and none may be added. Do NOT
  re-cut this split at L1; decompose each of a, b, c and d into L2 behaviours.

  Authored at the PO stage. L0 and L1 only. No L2, no test_spec, no
  it_requirements and no declares_side_effect, by design.
