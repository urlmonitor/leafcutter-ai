id: GE-126a-3
title: "Naming your targets through the test seam carries the same promise as the command line"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the deployed AC-governance check offers an environment seam through which a
    caller names the records it should examine instead of deriving them from the
    staged set,
  When the seam names one record that genuinely violates the rule the check enforces,
  Then the check refuses that record exactly as it does when the same record is named
    on the command line — same outcome value and the same record named,
  And when the seam names a target that resolves to nothing the check reports that
    target as unresolved and does not report the ordinary success outcome,
  And when the seam is set to a value the check cannot interpret as a list of targets
    at all it reports that it could not interpret what it was given and does not report
    the ordinary success outcome — because a caller who spelled the seam wrongly is
    a caller who named targets that were never examined,
  And when the seam is not set at all the check derives its scope as it does today and
    an empty derived scope is still an ordinary pass.

  Coverage note: covered only by out-of-process runs of the deployed check driving each
  of the four seam states against a record known to violate the rule. The
  uninterpretable-value arm is the one that matters most and is the one a test suite
  will omit by default: today a caller who uses the wrong spelling or the wrong
  separator resolves to nothing and receives the ordinary success outcome.
depends_on:
