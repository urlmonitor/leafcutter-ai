id: GE-117e-1-i
readiness: approved
priority: medium
title: "When the component or AC cannot be inferred unambiguously, autofix prompts instead of guessing"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-117-code-declares-what-it-serves/GE-117e.yaml"
criteria: |
  Given a commit was blocked because a new file's module docstring does not name a
    component
  And the file's location matches more than one registered component's directory
    pattern
  When the developer invokes the guided autofix for that file
  Then the autofix does not silently pick one component
  And it presents the matching candidate components for the developer to choose
  And it inserts a component only after the developer selects one

  Given a commit was blocked because a new file's module docstring does not name a
    component
  And the file's location matches no registered component's directory pattern
  When the developer invokes the guided autofix for that file
  Then the autofix does not insert a fabricated component name
  And it reports that it could not infer the component and asks the developer to
    supply one

  Given a commit was blocked because a new public symbol or a new decision-history
    entry does not reference an AC
  And the ticket the workspace maker recorded for the current branch declares two
    or more source ACs, for example "GE-117e-1" and "GE-117e-2"
  When the developer invokes the guided autofix for that item
  Then the autofix does not silently pick one AC
  And it presents those declared ACs as the candidates for the developer to choose
  And it inserts an AC reference only after the developer selects one

  Given a commit was blocked because a new public symbol or a new decision-history
    entry does not reference an AC
  And either the ticket the workspace maker recorded for the current branch
    declares no source AC, or declares one source AC that does not exist in the AC
    store, or no ticket is recorded for the current branch, or the recorded
    ticket file is not present in the workspace
  When the developer invokes the guided autofix for that item
  Then the autofix does not insert a guessed AC reference
  And it asks the developer to supply the AC the item satisfies
depends_on:
  - GE-117e-1
