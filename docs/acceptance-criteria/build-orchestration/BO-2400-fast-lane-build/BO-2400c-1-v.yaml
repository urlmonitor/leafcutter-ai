id: BO-2400c-1-v
components:
  - build_orchestration
  - injection_builder
title: "The orphaned second runner is removed once the live lane is wired, and the grep test guarding it goes with it"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the prompt-caching layer is assembled and consumed by the lane that actually
    runs, so the second, orphaned fast-lane runner is the last file holding a reference
    to a capability that is now wired elsewhere,
  When that orphan is reviewed,
  Then it holds nothing the running lane does not, and it is removed from the package
    rather than kept, built, deployed and maintained in parallel with the lane that runs,
  And after the removal nothing refers to it: no command routes to it, no build or
    deploy step ships it, and no justification for shipping anything else cites it,
  And the removal happens only after the wiring lands — while the running lane does not
    consume the layer, this orphan is the last thread attaching a tested, documented
    capability to the codebase, and deleting it first retires that capability silently.

  Given the removal deletes a file that a test asserts a string inside,
  When the file is removed,
  Then that test is removed with it or re-pointed at the executed behaviour that replaced
    it,
  And it is not kept alive by re-creating the string somewhere else, by relaxing the
    assertion, by marking the test skipped, or by pointing it at another file that merely
    contains the same name — the assertion was that a name appeared in a file, and a name
    appearing in a file is not the property anyone wanted proved.
depends_on: [BO-2400c-1, BO-2400c-1-iii]
