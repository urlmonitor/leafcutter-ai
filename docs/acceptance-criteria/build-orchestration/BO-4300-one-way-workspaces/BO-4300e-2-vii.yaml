test_spec:
- name: test_detached_workspaces_are_found_by_location
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: reachability
  description: "Runs the real maker CLI as a subprocess. Three ready clean workspaces each switched with git checkout --detach: alpha at a commit the shared main already holds with nothing unpushed on its own line, beta on commit c1 made while detached, gamma at a shared commit while its own line holds unpushed c2. Each remove --path is not answered NOT_FOUND."
  proves_clause: "no request is answered \"not found\""
  code_file: templates/scripts/worktree_remove.py
- name: test_detached_alpha_with_nothing_unsent_is_cleared
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: "remove of alpha is ok and nothing remains at its location."
  proves_clause: "\"ticket/alpha\" is answered cleared and nothing of it remains at its location"
  code_file: templates/scripts/worktree_remove.py
- name: test_detached_beta_is_refused_naming_c1_and_not_on_its_line
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: discrimination
  description: "Refused UNSENT_WORK; the unsent commits hold the full identifier of c1 and the message says the workspace is not on its line of work; snapshot with_git=True is identical before and after."
  proves_clause: "\"ticket/beta\" is refused, the refusal names commit \"c1\" by identifier as unsent and states that the workspace is not on its line of work, and \"ticket/beta\" is identical before and after"
  code_file: templates/scripts/worktree_remove.py
  must_catch:
  - "a maker that checks only the checked-out branch and so finds no unsent work when detached"
  - "a maker that answers NOT_FOUND for a detached workspace"
  - "a maker that reports abbreviated commit identifiers"
- name: test_detached_gamma_is_refused_naming_c2
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: discrimination
  description: "Refused UNSENT_WORK naming the full identifier of c2 (on the record's own line, not the detached commit); snapshot with_git=True identical before and after."
  proves_clause: "\"ticket/gamma\" is refused, the refusal names commit \"c2\" by identifier as unsent, and \"ticket/gamma\" is identical before and after"
  code_file: templates/scripts/worktree_remove.py
  must_catch:
  - "a maker that checks only the detached commit and misses unpushed commits on the record's own line"
- name: test_detached_beta_token_clears_and_lists_c1_as_discarded
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: "Repeat remove of beta with the returned token: ok, discarded commits list c1, nothing remains. Also a moved detached commit (new commit after the refusal) invalidates the earlier token."
  proves_clause: "clearing \"ticket/beta\" again with the one-time token its refusal returned is answered cleared, listing \"c1\" as discarded"
  code_file: templates/scripts/worktree_remove.py
