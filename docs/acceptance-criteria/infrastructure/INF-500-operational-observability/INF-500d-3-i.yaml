id: INF-500d-3-i
components:
  - infrastructure
  - feedback_collector
title: "Two submissions in the same second each leave their own id-recovery file, holding their own id"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given two agents, a python-coder on ticket A and a pr-reviewer on ticket B, each
    submit one report,
  And both submissions start within the same wall-clock second,
  When both submissions complete successfully, printing ids fb_2026-08-25_869bc2f7
    and fb_2026-08-25_9057159a respectively,
  Then two distinct id-recovery files exist, one per submission,
  And the recovery file announced on the first submission's error stream contains
    exactly fb_2026-08-25_869bc2f7,
  And the recovery file announced on the second submission's error stream contains
    exactly fb_2026-08-25_9057159a,
  And neither recovery file was overwritten by the other submission.

  Given 20 submissions from 20 separate processes start within the same second,
  When all 20 complete successfully,
  Then 20 distinct recovery files exist,
  And each printed id appears in exactly one recovery file,
  And each submission's error stream names the recovery file that holds that
    submission's own printed id.

  Given any successful submission,
  When the recovery search documented in the sign-off instructions is applied to that
    submission's error stream,
  Then it returns exactly one match,
  And that match names the recovery file holding the id the submission printed,
  So that the uniquely-named recovery file is still found by the recovery step agents
    are told to run.
