id: BP-100k-2
components:
  - build_pipeline
title: "Every deployed output the build produces is recorded in the manifest's output mapping, so the output-drift gate has something to compare"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the build has just run over an unmodified checkout and deployed its
    outputs into the project,
  And a deployed output the build produced is staged for commit — for example
    a deployed agent definition in the deployed agents directory,
  When the output-drift gate inspects that staged output and looks up which
    source it was produced from,
  Then the manifest's output-mapping record names that deployed output and the
    source artifact it was produced from,
  And the gate reports, for that output, either that it matches its recorded
    source or that it has drifted from it,
  And the gate does not report that output as absent from the output mapping,
  And the symptom ("the gate announces that a deployed file it inspected is not
    in the output mapping, so a hand-edit to that deployed file can never be
    detected") must not occur for any output the build actually produces.
depends_on:
  - BP-100k
doc_links:
  - path: "docs/acceptance-criteria/build_pipeline/BP-100-reliable-builds/BP-100k.yaml"
    relationship: parent
    status: exists
  - path: "docs/build-drift-hook.md"
    relationship: describes
    status: exists
  - path: "docs/build-pipeline.md"
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    manifest_output_mapping_coverage:
      type: object
      description: "Manifest section mapping every deployed output the build writes back to the source artifact it was produced from, so the output-drift gate can resolve a source for any deployed file it inspects instead of skipping it as unregistered."
  reference_file_path: "scripts/build_helpers.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "Entries must be recorded by the deploy phases as they write each output, so a newly added output is registered by the act of deploying it and cannot be forgotten in a separate bookkeeping step."
    - "The mapping must cover outputs deployed by every phase, not only the phases that happen to register today; a phase that writes an output without recording a mapping must be detectable."
    - "Verify behaviorally — run the build, then execute the output-drift gate against a real deployed output that is currently reported as unregistered and assert it now yields a match/drift verdict; do not grep the manifest writer's source."
    - "Must follow the repo error-handling policy: specific-exception try/except around file and JSON I/O, log at WARNING or higher or re-raise; no bare or silent excepts."
    - "Bundle A1 (shared reviewable diff with BP-100k-1): both ACs edit scripts/build_helpers.py's write_build_manifest(). They must land as one diff. No other ticket in this epic may edit scripts/build_helpers.py concurrently."
test_spec:
  - name: test_output_mapping_names_the_deployed_output_and_its_source
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: behavioral
    description: "After the build runs and deploys, the manifest's output-mapping section resolves a deployed agent definition under the deployed agents directory to the source artifact it was produced from."
  - name: test_output_drift_gate_emits_match_then_drift_for_that_output
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: behavioral
    description: "Executing check_output_drift.py as a process against that staged deployed output yields a match verdict on an untouched copy and a drift verdict after the deployed copy is hand-edited — the gate is run, not read."
  - name: test_gate_never_reports_a_build_produced_output_as_unregistered
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: behavioral
    description: "The executed gate's output for a build-produced deployed file contains no not-in-output_mappings notice; the unregistered branch is not taken for any output the build actually produces."
  - name: test_output_mapping_covers_every_deploy_phase_output
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: behavioral
    description: "The set of paths recorded in output_mappings after a real build equals the set of files the deploy phases actually wrote — count- and phase-agnostic, so a phase that writes an output without registering a mapping is detected rather than tolerated."
test_rationale: "Asserting output_mappings has entries, or importing the writer directly, stays green on a mapping that covers only the phases that already register today — which is the incumbent defect. Each descriptor runs the real build and then executes the output-drift gate as a process against a real deployed file, so the mapping is proved by the verdict the gate produces."
delivers_to:
  agent: python-coder
  contract: "A build manifest whose output-mapping section resolves every deployed output to its source, consumed by the output-drift gate to produce a match/drift verdict per inspected output."
