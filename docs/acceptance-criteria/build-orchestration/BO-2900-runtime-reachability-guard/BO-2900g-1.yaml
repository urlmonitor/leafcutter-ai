id: BO-2900g-1
components:
  - build_orchestration
  - ac_store
  - testing_quality
title: "The demand for proof-of-wiring reaches every piece of work, including work that arrived with a plan of its own"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given two pieces of work of the same kind, both to be built by a coding agent:
    work X, which arrived with no test plan of its own, so its plan is derived
      from the behaviour it states,
    and work Y, which arrived with a hand-authored test plan naming three proofs,
  When a test plan is produced for each,
  Then each plan contains a request for a proof that the finished work is reached
    the way the product is really used,
    And work Y's three authored proofs are all still present, unaltered and in
      their authored order, alongside that request,
    And when a third way of producing a plan is introduced without being told
      about this rule, the plans it produces carry the request as well,
    And there is no piece of work for which the request is absent because of how
      its plan was produced.
depends_on:
  - BO-2900g
