test_spec:
- name: test_declared_input_blocks_even_ready_adapter_without_any_model_call
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: boundary
  description: Supply an adapter capable of returning valid readiness while a declared input remains unresolved;
    assert no model call or writable dispatch and a durable human request.
  covers:
  - ACD-1300g-1
- name: test_discovery_context_has_readiness_role_without_coding_directives
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: seam
  description: Capture discovery and coding prompts emitted from actual graph dispatch; assert separate role
    instructions with shared scoped facts and trusted decisions. Discovery describes verification obligations
    without directing implementation or checks, and distinguishes repository inspection, human questions and
    inspection errors.
  covers:
  - ACD-1300g-1
- name: test_discovery_ready_with_assessment_needs_no_tool_event
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Return ready with a nonblank supplied-context assessment through the actual discovery adapter
    with zero tool events; accept readiness. Pair with implementation completed without tools, which still
    fails.
  covers:
  - ACD-1300g-1
- name: test_graph_context_only_readiness_advances_without_implementation_evidence
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: seam
  description: Feed valid context-only readiness into the real graph; assert it advances only through the
    deterministic input gate, creates no completed-AC evidence and starts coding separately. Reopen the checkpoint and assert the accepted assessment is retained and handed to coding as advisory context under the current proof binding. Existing missing-input,
    stale workspace and forged-answer protections remain effective.
  covers:
  - ACD-1300g-1
- name: test_tool_turn_uses_prompt_contract_without_forced_generation_schema
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: seam
  description: Invoke each actual phase executor with a controlled harness; assert the invocation omits generation-time
    output-schema constraints while its prompt carries the shared phase-specific final-report contract. Return valid
    and malformed reports through the real strict parser; keep ready/completed distinct and require actual tool
    evidence for coding. Detect reintroduced generation constraints, missing prompt contracts and parser bypass.
  covers:
  - ACD-1300g-1
- name: test_background_worker_input_gate_g_1
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Exercise prepare, read-only discovery, deterministic gate and writable dispatch; missing declared inputs spend no attempt, discovered ambiguity cannot write, and actual discovery consumes existing budgets.
  covers:
  - ACD-1300g-1
- name: test_background_worker_local_harness_executes_scoped_project_work
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: reachability
  description: Use controlled local model/tool fixtures to read/edit code and docs, run checks and permitted
    project-local dependency work; assert real resulting files and check exits tied to exact worktree
    head.
  covers:
  - ACD-1300g-1
  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_dispatch_carries_full_traceable_obligation_context
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Capture next executor input and assert feature/leaf/ancestor IDs and criteria, AC/ADR/product-truth
    revisions, prerequisite evidence and prior results are all present.
  covers:
  - ACD-1300g-1
- name: test_background_worker_tool_boundary_blocks_workspace_escape
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: boundary
  description: Attempt parent path, symlink escape, unrelated checkout write and shell command escaping
    allowed roots; assert enforced denial with target/unrelated bytes unchanged.
  covers:
  - ACD-1300g-1
- name: test_background_worker_passing_evidence_releases_internal_not_external_dependency
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Actual passing check evidence releases same-run dependent only; false success prose and
    zero executed checks release neither.
  covers:
  - ACD-1300g-1
- name: test_background_worker_installed_langgraph_path_runs_without_e2_globals
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: criterion
  description: Invoke installed worker entry with local model stub and no Claude Workflow globals; observe
    full tool loop and persisted evidence rather than a no-op.
  covers:
  - ACD-1300g-1
