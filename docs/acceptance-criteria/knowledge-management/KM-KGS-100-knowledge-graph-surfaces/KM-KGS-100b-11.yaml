criteria: |
  Given the read index must locate its on-disk file in an installed project
  When the index path is resolved
  Then the path is derived from the project root / configured output root (for example
    the .leafcutter output directory), and never from the git root or from the module's
    own __file__ location
  And in a deployed consumer layout produced by build.py --target-dir, the read path
    resolves the index under that project's output root and the index-backed read works
  And when run inside a git worktree, the index path resolves under that worktree's own
    root, so the index used matches the tree being queried
