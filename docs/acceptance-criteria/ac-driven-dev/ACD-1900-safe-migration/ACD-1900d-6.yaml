notes: |
  GAP 3 from the independent v2 review. Mirrors ADR-026 non-negotiable rule 6 (self-host is a
  self-consistent build: the thin generator and universal dual-read ship in the SAME self-build)
  and rule 2 (deploy-manifest-first). ACD-1900c-3 gates enforce=true on "zero v1 records", but
  nothing gates emit=true on the read-side actually being PRESENT IN THE DEPLOYED LAYOUT; flipping
  emit=true before the dual-read resolver (ACD-1900b-1) and migrated read-side agent/gate templates
  are deployed re-opens the phantom-green window. This guard refuses emit=true (with a clear error
  naming what is missing) until they are deployed -- the emit-flag analogue of the deploy-manifest
  guard ACD-1900d-3-i. Placed under ACD-1900d because it is a deploy-manifest / advisory-before-
  required presence guard; the emit flag itself is defined in ACD-1900c-1 (hence depends_on).
  Per CLAUDE.md (gate/workflow ACs verify BEHAVIORALLY): the covering check MUST exercise the
  emit-enable path against a DEPLOYED-layout fixture with the read-side surface absent (expect
  refusal naming it) and present (expect acceptance) -- never grep-only, and verified from the
  deployed layout, not the source tree. IT-PO to add it_requirements + surface wiring.

  IT-PO enrichment (2026-08-12): canonical source scripts/ac_store/ emit-enable path +
  config/guardrail_gates.yaml (ac_unit_of_work.emit); presence verified from the DEPLOYED layout
  per ADR-026 rule 2. Behavioral test_spec exercises absent/present deployed-layout fixtures.
