title: "jscpd hook exits fail-open when the jscpd subprocess exceeds the 30-second timeout"
component: guardrail-engine
level: L3
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-100-code-quality-hooks/GE-100.yaml"
criteria: |
  Given the commit guardian configuration has the duplicate_code section with:
    enabled: true
    strict: true
  And the jscpd binary is installed (version 3.x)
  And the jscpd subprocess takes longer than 30 seconds to complete
    (e.g. scanning a very large working tree)
  When the duplicate code hook runs at pre-commit time
  Then the hook terminates the jscpd subprocess after 30 seconds
  And it emits a warning to stderr stating that jscpd timed out
  And the hook exits with code 0 (fail-open despite strict mode)
  And the commit proceeds without duplicate checking
