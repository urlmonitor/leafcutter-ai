id: ACD-300c-4-ii
components:
  - ac_driven_dev
  - ac_store
readiness: reviewed
priority: medium
title: "An approval that cannot be written and read back is a failed run, never a reported success"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the final gate releases ACD-9990a-1 and ACD-9990a-2 for approval,
    and ACD-9990a-2's file cannot be read back as a requirement record after the approval
    is written to it (for example the write leaves a YAML syntax error at line 12),
  When the workflow applies the approval,
  Then the run is reported failed, not complete, and the failure names ACD-9990a-2, its file
    and the reason it could not be read back,
  And ACD-9990a-2's file is left as it was before the approval was attempted,
  And the closing summary does not state that ACD-9990a-2 was approved,
  And no commit is made that records the batch as approved.
depends_on:
  - ACD-300c-4
doc_links:
  - path: docs/acceptance-criteria/ac-driven-dev/ACD-300c-4.yaml
    relationship: parent
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- 'IT PO decision (the BA''s open question): records written and read back cleanly in a failed run keep
  readiness approved on disk. Because the step is idempotent, a re-run converges; they are not rolled
  back, and the failure report names them as written but not committed.'
- A record whose read-back fails is restored to its exact pre-write bytes before the step exits.
- 'The workflow treats a non-zero exit or an unreadable report from the approval step as a failed run:
  it makes no stage commit, and the closing summary names the failure.'
- The failure is logged at error severity, naming the file and the reason.
declared_files:
- path: scripts/ac_store/approve_acs.py
  state: existing
- path: templates/workflows-js/plan-feature.js
  state: existing
delivers_to: null
expects_from:
  ac_id: ACD-300c-4
  contract: 'scripts/ac_store/approve_acs.py gains an id-list mode and a priority option: given ids [str]
    and priority (critical|high|medium|low) it writes, for each id it does not hold, readiness approved,
    that priority and one appended amended_by approval entry, as one field-targeted write per record followed
    by a read-back. --json prints {approved: [id], held: [{id, file, reason}]} (reason in HOLD_REASONS),
    plus an additive already_approved: [id] list; --dry-run --json prints the same report without writing.
    Exit is non-zero when any written record fails read-back, and that record is restored to its pre-write
    bytes.'
test_intent:
- clause: the run is reported failed, not complete, and the failure names ACD-9990a-2, its file and the
    reason it could not be read back
  needs_test: true
  reason: A silent success on a broken write is the failure mode this record exists to forbid.
- clause: ACD-9990a-2's file is left as it was before the approval was attempted
  needs_test: true
  reason: Restoring the file is computed behaviour that a missed branch would skip.
- clause: the closing summary does not state that ACD-9990a-2 was approved
  needs_test: true
  reason: The summary must not claim an approval that did not stick.
- clause: no commit is made that records the batch as approved
  needs_test: true
  reason: Committing a batch as approved after a failed write would put a broken record on the branch.
test_spec:
- name: test_failed_approval_is_reported_failed_naming_record_file_and_reason
  target_dir: unit_tests/ac_driven_dev/test_design_stage/
  framework: pytest
  type: unit
  angle: reachability
  description: plan-feature.js under run_workflow_under_e2, resumed with approve; the approval-step reply
    has exit_code 1 and stderr naming ACD-9990a-2, its file and that the write did not re-parse. The run
    returns a non-ok status whose message names ACD-9990a-2, the file and the reason.
  proves_clause: the run is reported failed, not complete, and the failure names ACD-9990a-2, its file
    and the reason it could not be read back
  code_file: templates/workflows-js/plan-feature.js
- name: test_unreadable_write_restores_the_file_and_exits_nonzero
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: real_artifact
  description: 'In-process main(argv) of approve_acs.py with --ids ACD-9990a-1,ACD-9990a-2 --priority
    high, with the write for ACD-9990a-2 forced to produce invalid YAML: the file on disk is read back
    byte-identical to before, ACD-9990a-1 stays approved, the exit code is non-zero and stderr names the
    file and reason.'
  proves_clause: ACD-9990a-2's file is left as it was before the approval was attempted
  code_file: scripts/ac_store/approve_acs.py
- name: test_failed_approval_summary_does_not_claim_the_record
  target_dir: unit_tests/ac_driven_dev/test_design_stage/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Same failed run: the message never states ACD-9990a-2 approved and the result has no acs_approved
    list containing it.'
  proves_clause: the closing summary does not state that ACD-9990a-2 was approved
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - the workflow ignores the step's exit code and reports every id it passed as approved
  - the summary lists the ids sent to the step rather than the step's report
- name: test_failed_approval_makes_no_commit_or_delivery
  target_dir: unit_tests/ac_driven_dev/test_design_stage/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Same failed run: no commit-stage-output dispatch and no deliver-authoring-branch dispatch
    happen after the approval step.'
  proves_clause: no commit is made that records the batch as approved
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - the final commit runs before the approval step's result is checked
  - the run commits and only flags the failure in its message afterwards
