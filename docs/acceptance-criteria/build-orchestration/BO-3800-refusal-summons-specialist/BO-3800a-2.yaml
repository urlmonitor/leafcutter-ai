notes: |
  SPAWN SCOPE DECIDED BY BRAINCANDY, 2026-10-09: the commit agent and a drive's commit step
  bring the specialist in automatically; any other agent or person is told what to do and
  nothing is brought in for them. "If commit agent did it, it would be able to spawn it.
  And if any other agent or human does it they would also know what to do." The open
  question an earlier draft carried, whether an interactive session's commit-agent commit
  counts, is closed: it brings the specialist in.

  DEPTH RISK. BrainCandy's words say the commit agent spawns the specialist. Under ADR-019
  it cannot: the commit agent runs at depth 1, and an Agent call from there is silently
  dropped. That is precisely why today's router does nothing (precommit-autofix Step 4a.3).
  The criteria therefore state the observable outcome, that the specialist is engaged,
  and do not say who makes the call. The buildable shape is the BO-3000a handoff: the
  commit agent returns a handoff naming the specialist and the demand, and its depth-0
  dispatcher (the drive's driver, or the interactive session) engages it. For the
  interactive session that last step rests on the session acting on the handoff. The IT
  PO must settle how that is made mechanical rather than a prompt instruction (BO-3100's
  standing constraint).

  PARENT WORDING: RESOLVED 2026-10-09. BO-3800a's L1 once said "work that is being
  driven, and only that", which was narrower than this record. On BrainCandy's approval it
  now covers deliveries by a drive or by the commit agent, the latter in a drive or in an
  interactive session, with a direct commit staying inform-only (see BO-3800a's
  2026-10-09 amended_by entry). This record's three arms are now exactly as wide as their
  parent.

  NAMED MUTATION. ONE ROUTE WIRED: bring the specialist in only from the drive's commit
  step. MUST GO RED: arm two. MUST STAY GREEN: arms one and three, and every arm of
  BO-3800a-1.
