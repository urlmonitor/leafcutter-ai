change_target: code
risk_surface: contract_boundary
test_required: true
test_rationale: |
  Vacuous truth is invisible to any test that only feeds the check a populated input, which is
  what every existing test in this area does. The fixture has to be an empty input set for a
  universally quantified check, and the assertion has to be that the check refuses to claim the
  rule holds. Asserting the outcome is non-zero would be too weak: a crash also produces a
  non-zero outcome and is not the required behaviour.
test_spec:
  - name: test_universal_rule_on_empty_input_reports_not_exercised
    target_dir: unit_tests/product_truth/
    description: "A check of the form 'every X must satisfy P' run against zero X reports not-exercised naming X."
    type: unit
    angle: boundary
    framework: unittest
  - name: test_universal_rule_on_empty_input_does_not_report_the_rule_holds
    target_dir: unit_tests/product_truth/
    description: "The not-exercised report is distinct from, and does not accompany, a statement that the rule holds."
    type: unit
    angle: criterion
    framework: unittest
notes: |
  EVIDENCE. UXP-514's four clauses are each "errors if ANY X differs". On an empty store there
  is no X, so all four clauses are true and the checker reports success having tested nothing.
  UXP-514-5 is the instance of this rule for those four checks specifically; this AC is the
  general rule the record's checks are held to.

  Paired acceptable input lives in UXP-700b-3-i so this AC cannot be discharged by making every
  such check refuse unconditionally.
target_epic: EPIC-WhatYourProjectSaysAboutItselfIsTrue,And
