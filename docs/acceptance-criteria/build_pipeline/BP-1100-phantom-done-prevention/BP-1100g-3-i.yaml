notes: |
  The negative control for BP-1100g-3, and the clause that keeps the two tag axes
  from merging.

  WHY IT NEEDS ITS OWN SCENARIO. "The new axis does not affect enforcement" is a
  property of the ABSENCE of an effect, and absences are not observable in any
  test that only exercises the new axis. The discriminating observation is a pair
  of runs differing in exactly the tag, plus the whole-suite form in the last
  clause: strip every kind tag and nothing changes. That is a property no
  implementation which quietly consumes the tag in a verdict can satisfy, and it
  is invisible to any test that inspects a single tagged test.

  THE PRESSURE THIS RESISTS IS REAL AND WILL COME FROM A GOOD PLACE. Once the
  tags exist, "this work has a reachability-tagged test, so it is reachable" is
  the obvious next inference and it is free to implement. It is also exactly the
  phantom-done-guard-inside-the-phantom-done-guard that BO-2900a-2 exists to
  prevent, and it is wrong for the mundane reason that the tag is trivially
  pasteable — see BP-1100g-4-i, which accepts the paste on purpose.

  IT-PO ENRICHMENT NOTE (2026-08-17). Two consequence surfaces are named in the
  constraints rather than one: the run outcome (pytest_ac_enforcement, the
  plugin that applies TQ-100's decision) and the completion decision
  (verify_done_eligible). An implementation can leave the first alone and still
  leak the tag into the second, and the third Then clause is about the second.
  it_requirements uses the package-surface OBJECT form because
  scripts/ac_store/validate_ac.py classifies any python-coder AC whose components
  list contains build_pipeline as package-surface.
