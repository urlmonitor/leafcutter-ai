test_spec:
  - name: test_bo_3200c_1_question_reaches_a_means_capable_of_answering
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: criterion
    description: "Drive a real gate under the harness with an answering channel available; assert the question is raised through a means that can receive an answer, that no specialist is dispatched to answer it, and that the run does not continue until an answer arrives."
  - name: test_bo_3200c_1_unaskable_question_pauses_with_a_resumable_record
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: criterion
    description: "Withhold the answering means; assert the run stops, writes a pause record identifying the gate and the resume point, leaves every authored path unchanged on disk, and reports awaiting-an-answer."
  - name: test_bo_3200c_1_resume_continues_at_the_same_question_with_work_intact
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: e2e
    angle: criterion
    description: "THE PAUSE IS ONLY REAL IF IT RESUMES. From the paused run, supply the person's answer and resume; assert it continues from that same question and every file authored before the pause is present and byte-identical."
  - name: test_bo_3200c_1_awaiting_outcome_is_not_a_settled_value
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: seam
    description: "Assert the value a caller branches on for a paused run is neither a success value nor a cancel value. A run reported as concluded while nobody answered is the false-success shape PR #565 removed one instance of."
  - name: test_bo_3200c_1_pause_uses_the_existing_substrate_not_a_second_store
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: seam
    description: "Assert the paused-at-a-gate record is readable through the existing pause substrate's own interface. Two pause stores would each work in isolation and lose runs between them."
  - name: test_bo_3200c_1_double_resume_does_not_double_apply
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: boundary
    description: "Resuming the same paused run twice with the same answer applies the decision once and does not duplicate the previously authored work."
test_rationale: |
  A pause that cannot be resumed from is a discard with extra steps, and a pause record nobody
  can resume from is the same thing — so the load-bearing test is the end-to-end one that
  actually resumes and asserts the earlier work is byte-identical. Asserting only that a record
  was written would pass on a record that cannot be used.
  Asserting on the value a caller branches on, not only the message, is required by CLAUDE.md's
  gate rule and by this repository's own history: a cancelled run once returned an ok status
  having authored nothing.
  The substrate test exists because the tempting implementation is a small purpose-built pause
  file. Two pause stores are two places a run can be stranded, each correct in isolation.
