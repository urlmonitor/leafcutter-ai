notes: |
  DECIDED 2026-09-17 (user): every unattributed finding is persisted so it is not lost in a long
  unattended run, and the end-of-drive report lists them. Follows from GE-130c-2-i no longer
  stopping the run -- without a record, a finding made hours into a drive scrolls away unseen.

  The varying-count and none-found clauses are this component's standing anti-vacuity shape: a
  report with a fixed count, or one that silently omits the listing, passes every other clause.
  Named mutation that turns ONLY this record red: state the finding on session output without
  writing the record (GE-130c-2-i stays green).

  Where the records live and their format are the IT PO's. Precedents for per-worktree records:
  inline_work_guard.jsonl, readme_markers/. The same records are a natural data source for
  GE-130d-3's unattributed-share threshold.

  SCOPE: documentation guard and guide-read guard only. The task-lock guard (inline_work_guard)
  makes no unattributed finding -- under the build lock it stops any writing command regardless
  of attribution (GE-130a-4); its lock semantics are unaffected.

  declares_side_effect: true -- "a record is persisted" in the Then clause.
