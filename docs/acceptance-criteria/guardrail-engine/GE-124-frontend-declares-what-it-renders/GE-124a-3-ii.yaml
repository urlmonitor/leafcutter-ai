change_target: code
risk_surface: contract_boundary
notes: |
  These three survive GE-124a-3's markup test — a story and a test both render
  markup, and a generated component file renders the most markup of all — so
  they need naming. Each exclusion is a stated rule with a stated reason, which
  is what lets a reviewer argue with it.

  The second scenario is the guard against the shortcut a hurried implementation
  reaches for: excluding a whole directory because it happens to contain
  stories. Directory-level exclusion would silently exempt real components that
  sit beside them, and a silent exemption is indistinguishable from the check
  not running (GE-120's standing rule for this component).

  IT-PO ENRICHMENT NOTE (2026-08-25). One legitimate path-segment exception is
  named: a file under __tests__/ (the convention leafcutter-web/__tests__
  already uses) is a test file by virtue of its own location, not a neighbour's.
  That is not the directory-exclusion shortcut the second scenario forbids, and
  the distinction is stated so an implementer does not have to guess.
