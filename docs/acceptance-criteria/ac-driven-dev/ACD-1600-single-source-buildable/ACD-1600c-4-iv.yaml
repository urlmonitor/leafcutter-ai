notes: |
  ORIGIN (2026-09-28, user decision on open question Q4 of the declared-files run,
  follow-up C2). Q4 asked what happens to a FINISHED requirement that declares an existing
  file which other work has since deleted: refuse, report or ignore. Decision: report, in
  the store-wide declared-files report; never refuse at commit time.

  WHY NOT REFUSE. The file was present when the work was done; the declaration was true
  then. Refusing would block every later commit that touches F for any reason (a notes
  edit, a store-wide field migration) on a fact that F's author cannot fix and that F's
  own work did not cause -- historical records would hold unrelated work hostage.

  WHY NOT IGNORE. A declared existing file that no longer exists is still information: a
  reader of F, or someone re-opening F's work, would otherwise trust a file list that points
  at nothing. The store-wide report makes the drift countable without making it blocking.

  CONSISTENCY WITH ACD-1600c-4-i. That AC refuses "neither present nor marked to be
  created" for requirements whose work is not finished, and its it_requirements already
  exclude finished records from the refusal. U in this AC is the control case showing the
  boundary is exactly finished vs unfinished. ACD-1600c-4-i's own NOTES still call Q4 open;
  this AC is the answer (its record was not edited in this run).

  NOT SPECIFIED HERE: a finished record whose to-be-created file was created and later
  deleted. ACD-1600c-4-i exempts finished records from the "marked to be created but already
  exists" report; the reverse drift is not decided.
