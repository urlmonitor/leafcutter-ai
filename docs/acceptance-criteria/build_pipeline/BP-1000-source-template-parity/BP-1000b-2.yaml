title: "When the parity gate finds drift, finalize HALTs and the PR-merge step is never reached"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-1000-source-template-parity/BP-1000b.yaml"
criteria: |
  Given the finalize-feature workflow has reached the parity gate (after the
    merge-origin/main step, before the PR-merge step)
  And the parity check reports drift (at least one mirrored source-template pair
    is not byte-identical)
  When the gate evaluates that outcome
  Then the workflow HALTs at the parity gate and returns a non-success status
  And the PR-merge step is never reached — the branch is not merged to main
  And the drift is surfaced to the user in the halt block summary, exactly the
    way a test regression halts finalize today
  And the workflow does not attempt to auto-fix or auto-sync the drifted copy —
    it halts and hands the fix back to the user
depends_on:
  - BP-1000b
  - BP-1000b-1
  - BP-1000a-2
