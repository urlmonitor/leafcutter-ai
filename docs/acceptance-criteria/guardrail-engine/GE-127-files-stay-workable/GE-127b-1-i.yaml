it_requirements:
  - >-
    THE REFUSING SET IS EXACTLY TWO, AND HERE IS WHAT EACH ONE CONCRETELY IS UNDER THE PINNED
    HEAD-BLOB SOURCE. READ THIS BEFORE IMPLEMENTING ANYTHING ELSE HERE. The criteria separate
    the RESOLUTION of the previous-length source from what that source happens to hold, and
    only the resolution can refuse. Concretely: "cannot be reached at all" means the git
    executable is unavailable or the working copy is not a git repository — a broken
    environment; "reached and cannot be interpreted" means the history resolves but a blob read
    fails or its content cannot be decoded in the encoding the standard reads. Those two, and
    nothing else, refuse. TWO STATES IN PARTICULAR MUST NOT BE FOLDED BACK INTO THE REFUSING
    SET: a history that resolves and holds no covered file at all, and a populated history
    against which the particular commit stages only newly added covered files. Both complete;
    the first is additionally named in the outcome. Folding either one back in contradicts
    GE-127b-1's fourth arm, whose test builds the identical fixture and requires exit 0.
    RECLASSIFIED IN THIS PASS, AND A CHANGE FROM THE PREVIOUS ENRICHMENT: an UNBORN HEAD — a
    repository with no commit yet, so HEAD does not resolve — is the EMPTY-HISTORY case, not
    the cannot-be-reached case. The previous pass listed it under "cannot be read at all",
    which reinstates through the back door the exact bootstrap deadlock the criteria correction
    removed: the very first commit into a fresh repository has no HEAD, so it would be refused,
    and no later commit could ever give it one. The discriminating question the correction
    pins — could this state be true of a HEALTHY system? — answers yes for a repository at its
    first commit and no for an absent git binary.
  - >-
    THE STATED COUNT IS THE NUMBER OF STAGED COVERED FILES ACTUALLY COMPARED AGAINST A
    PREVIOUS LENGTH, AND ITS POSITIVITY IS CONDITIONAL ON THERE BEING SOMETHING TO COMPARE.
    The criteria require the number to be stated unconditionally "including when it is none",
    say in terms that "a stated count of none does not by itself refuse the commit", and scope
    the positive-count arm to "such a run in which at least one staged covered file had a
    previous length". An all-new-files commit is outside that scope and must not be refused for
    a compared-count of zero. Implement the count as an unconditional statement in the outcome
    — always printed, whatever its value — and the refusal as a consequence of the SOURCE being
    unresolvable, meaning unreachable or uninterpretable: never of the count being zero, and
    never of the history being empty. This is the positive-count form BP-100n-4-ii requires:
    make the empty state unrepresentable in the output, then derive the refusal from the source
    resolution rather than from the number.
  - >-
    NO PACKAGE SURFACE — MEASURED. This record adds no hooks_manifest.hooks id and no new
    top-level mapping key to commit_guardian.json, the only two containers
    _package_surface_registry.WATCHED_REGISTRIES binds on that file. It changes the outcome's
    summary line and adds the source-resolution floor. Do NOT mint a config_schema_fragment
    key to clear the structured-spec validator: BP-100n-4-ii records that BP-100k-4 and
    BP-100k-4-i each declared a key that was never created, and commit_guardian.json's 36
    top-level keys still contain neither. A second imaginary key would make the machine-checked
    spec less trustworthy than no spec at all.
  - >-
    REUSE BP-100n-4-ii's VERDICT VOCABULARY AND EXIT-STATUS CONTRACT UNCHANGED, AND THE SAME
    ONE GE-127a-1-i PINS. "INDETERMINATE: reason=<text>" naming which situation occurred, with
    exit 2; exit 0 for a clean run; exit 1 for a reported finding, which keeps GE-127b-1's
    grew-and-refused case distinguishable from an unresolvable one. Do not mint a third verdict
    set and do not widen the exit-status set. BOTH refusing conditions here — source unreachable,
    source reached but uninterpretable — report through that same line with different reason
    text. THE EMPTY HISTORY DOES NOT: it completes at exit 0, so it is named in the exit-0
    outcome in wording of its own and must NOT borrow the INDETERMINATE token, which the pinned
    contract binds to exit 2. An INDETERMINATE line that exits 0 makes the token stop predicting
    the commit outcome, which is the single thing reusing that contract buys.
  - >-
    ONE SUMMARY LINE, EXTENDED IN PLACE, NEVER A SECOND ONE. Whatever the run states about how
    many files it compared belongs in the single outcome the author already reads from this
    gate. A second summary printed elsewhere lets one line report a determinate run while the
    other reports an empty one, and the reader has no way to know which is authoritative. This
    is BP-100n-4-ii's one-summary rule applied here.
  - >-
    THE TWO REFUSING SITUATIONS ARE DISTINGUISHED BY NAME, NOT MERELY BOTH REFUSED — AND THE
    EMPTY HISTORY IS NAMED APART FROM BOTH. The two that refuse are "the previous lengths could
    not be reached at all" and "they were reached and what came back could not be interpreted":
    a broken environment versus a source carrying content that cannot be read. They are two
    different facts about the world and collapsing them costs the reader the only information
    that separates them. A third wording, on the COMPLETING path, says the history holds nothing
    of a covered kind. Three distinct texts across two exit statuses, and the third is the point
    of this record: a reader must be able to tell an empty history from a broken lookup.
  - >-
    A SWALLOWED LOOKUP ERROR MUST NEVER BE REPORTED AS AN EMPTY HISTORY, AND AN UNAVAILABLE
    SOURCE MUST NEVER BECOME A COMPLETED COMMIT. Note how the criteria correction sharpens this
    rather than relaxing it: the empty history is now a COMPLETING path, so converting an error
    into an empty result no longer merely loses information — it buys the failed run an exit 0
    outright. That is the exact shape all four cited precedents shipped — KI-CG-034 examined 169
    files, compared zero and exited 0; KI-CG-012; KI-CG-018; the AC-store validator's
    bare-directory no-op that reported clean for eight days. Separate the two AT THE POINT OF
    RESOLUTION, by what the source did, never downstream by inspecting how big a collection came
    back — a size cannot tell a genuine emptiness from a discarded exception. The subprocess call
    to git is external I/O under the repo error-handling policy: specific exceptions only
    (subprocess.CalledProcessError, subprocess.SubprocessError, OSError, UnicodeDecodeError), log
    at WARNING or higher or re-raise, and the re-raise-equivalent here is the INDETERMINATE
    verdict.
  - >-
    EXERCISE THE UNAVAILABLE STATES FOR REAL. Make the previous-length source genuinely
    unavailable at run time — a working copy that is not a git repository, or a history whose
    blob read fails or decodes to something the standard cannot read — and make the empty state
    genuinely empty: a real repository whose history holds no covered file, INCLUDING the
    unborn-HEAD repository with no commit at all, which belongs to the empty state and not to
    the unavailable ones. BP-100k-4-i's standing constraint applies unchanged: never assert that
    an error branch is present in the source, because such an assertion stays green on precisely
    the fail-open implementation this record exists to forbid.
  - >-
    HOST, LAYERING AND THE BUILD. The floor and the summary assembly belong in the same sibling
    module inside templates/scripts/commit_guardian/ that holds GE-127b-1's previous-length
    resolution — build_commit_guardian copies that directory whole, so no
    scripts/build_phases.py deploy entry is needed; a module imported from outside it does need
    one. templates/scripts/commit_guardian/ is canonical; scripts/commit_guardian/ and the
    repo-root .pre-commit-config.yaml are untracked build outputs; templates/commit-guardian/
    is a decoy. config.py:19 resolves the config beside the DEPLOYED script, so
    `python scripts/build.py --target-dir .` is part of this change.
test_spec:
  - name: test_ge_127b_1_i_an_unreadable_previous_length_source_is_named_as_such_and_refuses
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      With the previous-length source made GENUINELY unavailable at run time — a working copy
      that is not a git repository, or the git executable unreachable — the executed gate states
      that the previous lengths could not be established, names this specific situation as the
      could-not-be-reached one, and the commit does not complete. Exercised by breaking the
      lookup for real, never by asserting an error branch exists in the source. DO NOT use a
      repository with no commit yet as this fixture: an unborn HEAD is the empty-history case
      that must COMPLETE, and building it here would reinstate the bootstrap deadlock the
      criteria correction removed while looking like a passing test.
  - name: test_ge_127b_1_i_an_uninterpretable_previous_length_source_names_its_own_reason_and_refuses
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      A source that resolves but whose content cannot be interpreted — a HEAD blob that cannot
      be decoded in the encoding the standard reads — is reported with a reason naming that
      situation specifically, distinct in text from the could-not-be-read one, and the commit
      does not complete.
  - name: test_ge_127b_1_i_a_history_holding_no_covered_file_completes_and_is_named_apart_from_both_refusals
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      THE ANTI-DEADLOCK DESCRIPTOR — BOTH HALVES ARE MANDATORY AND NEITHER SUBSTITUTES FOR THE
      OTHER. A source that resolves successfully and holds no covered file at all — a repository
      whose history contains none, and separately one with no commit at all — is exercised by
      staging the first covered file into it and performing an ordinary commit. HALF ONE: the
      commit COMPLETES. HALF TWO: the outcome NAMES that situation, and the naming text is
      distinct from the reason text emitted by BOTH refusing runs. Assert half two by contrast,
      running all three fixtures in the same test and requiring three different texts, never
      against a hard-coded literal. Exit status alone would let an implementation pass while
      emitting nothing about the empty history, which is the readability half of the criterion;
      naming alone would let it emit the sentence and still refuse, which is the deadlock. This
      descriptor is the executable form of the 2026-09-01 correction: an empty history is an
      ordinary day-one state of any consumer project, and refusing it means the first commit
      that would populate the history is the one being refused, so no later commit can ever fix
      it and only a hook bypass escapes.
  - name: test_ge_127b_1_i_a_commit_adding_only_new_covered_files_against_a_populated_history_completes
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      THE SEAM DESCRIPTOR THAT KEEPS THIS RECORD FROM BREAKING ITS PARENT — the disambiguation
      pinned in it_requirements, made executable. In a repository whose HEAD already holds
      covered files, stage a commit consisting only of NEWLY ADDED covered files, all below
      their permitted lengths. The commit must complete, and the outcome must state a compared
      count of zero without that zero causing a refusal. An implementation that reads "holds a
      previous length for no file whatsoever" as the per-commit lookup result rather than as
      the resolution of the source refuses this commit and contradicts GE-127b-1's fourth arm.
      This descriptor and GE-127b-1's newly-added-file descriptor must be green simultaneously.
  - name: test_ge_127b_1_i_neither_unavailable_situation_reports_any_file_as_not_having_grown
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      In NEITHER of the two unresolvable situations — source unreachable, source reached but
      uninterpretable — is any file reported as not having grown, and in neither does the commit
      complete as though every staged covered file had been compared and found not to have grown.
      NAMED MUTATION (mandatory, run it, do not merely describe it — the BA's injection): make
      the previous-length lookup yield an empty collection on error rather than raising or
      returning an unavailability signal. That is the ordinary fail-open shape and the one all
      four cited precedents actually shipped. The injection BITES HARDER after the criteria
      correction, not less: an empty result is now the COMPLETING empty-history path, so an
      unavailable source is laundered straight into an exit 0. Under the injection every file
      compares against nothing, the run states zero files compared, and the commit completes;
      this descriptor must go RED, and it must fail BY THE COMMIT OUTCOME as well as by the
      text, then return to green on revert. Verify the injection is genuinely load-bearing by
      confirming the empty-history descriptor stays GREEN under it — the mutation must be caught
      here, on the unavailable fixtures, rather than by accidentally breaking the legitimate
      empty case.
  - name: test_ge_127b_1_i_the_stated_compared_count_moves_with_the_number_of_covered_files_staged
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: >-
      ASSERT BY VARIATION, NEVER AGAINST A LITERAL. Run the gate twice over the same repository,
      staging a different number of covered files with predecessors each time, and require the
      stated compared-count read from the gate's own output to move with it. A fixed expected
      number satisfies a stated-count requirement while proving nothing about what was examined
      — which is the same defect one level up, and is how every one of the cited precedents
      passed its own tests.
  - name: test_ge_127b_1_i_a_clean_run_states_a_positive_compared_count_and_that_is_what_makes_it_clean
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Over a run in which at least one staged covered file has a predecessor and none has grown,
      the stated compared-count read from the gate's own output is greater than zero, and it is
      that positive number — not the absence of findings — that establishes the run as clean. A
      run reporting nothing while stating a compared count of zero must not be accepted as clean
      by this descriptor.
  - name: test_ge_127b_1_i_the_count_and_the_indeterminate_verdict_reach_the_registered_hook_output
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      PRODUCTION ENTRY POINT. Run the gate as a subprocess through the registered hook path and
      assert that the compared-count appears in the hook's own output stream on a determinate
      run, that the indeterminate verdict and its named reason appear on an unresolvable one,
      and that the exit status is the commit outcome in both cases rather than an advisory note.
      A count computed by a function nothing at commit time calls is inert — which is the defect
      this whole family exists to close.
  - name: test_ge_127b_1_i_the_deployed_copy_fails_closed_when_the_previous_length_source_is_unavailable
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After build.py, the DEPLOYED copy and every module it imports load and run in a cold
      process — a helper outside templates/scripts/commit_guardian/ with no
      scripts/build_phases.py deploy-map entry surfaces here as ModuleNotFoundError rather than
      passing. With the previous-length source made genuinely unavailable to that deployed run,
      it emits the indeterminate verdict with its named reason and exits non-zero; over the real
      repository it states a compared count greater than zero and exits zero. Source-tree
      greenness cannot substitute: the hook runs from the deployed layout.
test_rationale: |
  Every clause here asserts what the gate must NOT do — must not report a file as not having
  grown, must not let the commit through, must not let a comparison that never happened look
  like one that found nothing. On today's implementation, which has no previous-length notion
  at all, all of them are green on arrival for the trivial reason that nothing is reported.
  That is KI-TQ-010's shape, and it is why the absence-asserting clause carries the BA's
  executable injection rather than a note. Requiring that injection to fail by the COMMIT
  OUTCOME as well as by the text is deliberate: a check that prints a worried message and then
  exits 0 is indistinguishable from a passing one to pre-commit, which reads only the status.

  The mutation is not hypothetical — an error path returning an empty collection instead of an
  unavailability signal is a reconstruction of KI-CG-034, KI-CG-012, KI-CG-018 and the AC-store
  validator's bare-directory no-op, all four of which shipped exactly that shape on this
  surface.

  The compared-count descriptor asserts by variation rather than against a literal because a
  hard-coded number satisfies a stated-count requirement while proving nothing about what was
  examined. BP-100n-4-ii requires the same construction for the same reason.

  Two descriptors carry the load of keeping this record consistent with its parent, and after
  the 2026-09-01 criteria correction the criteria now name both cases positively rather than
  leaving them to be inferred. The all-new-files descriptor pins the arm stating that a
  populated source plus a commit staging only newly added covered files COMPLETES; it and
  GE-127b-1's newly-added-file descriptor must be green simultaneously. The empty-history
  descriptor pins the arm stating that a source holding no covered file completes AND is named
  apart from both refusals. Both halves of that second one are asserted deliberately: exit
  status alone passes an implementation that says nothing about the empty history, and the
  naming alone passes one that says it and still refuses. The refusing set is exactly two, and
  the reason it is two is the bootstrap deadlock — refusing an empty history refuses the very
  commit that would end it.

  ONE FIXTURE WAS RECLASSIFIED IN THE ENRICHMENT RESYNC AND THE TESTS MUST FOLLOW. A repository
  with no commit yet — an unborn HEAD — is the EMPTY-HISTORY fixture, not the
  source-unreachable one. The earlier enrichment listed it under "cannot be read at all", which
  would have rebuilt the deadlock inside the very descriptor set written to prevent it: a fresh
  repository's first commit has no HEAD, so it would be refused, permanently. The unreachable
  descriptor therefore uses a working copy that is not a git repository, which is a broken
  environment rather than a healthy day-one one, and keeps its full teeth.

  Per BP-100k-4-i's standing constraint, every unresolvable state is exercised by making the
  lookup genuinely unavailable at run time; the reachability descriptor runs the registered
  hook entry point and the deployed descriptor runs the built copy, so a missing deploy-map
  entry cannot hide behind source-tree imports.
delivers_to: null
expects_from:
  ac_id: GE-127b-1
  contract: >-
    The comparison of each covered file's length after the change against the
    length it stood at before, and the population of previous lengths that
    comparison consumes. This record requires that population's size to be stated
    unconditionally, converts the UNAVAILABILITY of the source it is resolved from
    — unreachable, or reached and uninterpretable — from a silent completed commit
    into a named refusal, and requires the separate case of a source that resolves
    and holds nothing to complete while being named apart from both refusals.
    NOTE FOR THE PARENT: GE-127b-1's mirrored delivers_to entry still reads
    "converts its unavailability or its emptiness ... into a named refusal", which
    is the superseded three-refusing reading. That file was out of scope for this
    resync; this side is authoritative until it is reconciled.
