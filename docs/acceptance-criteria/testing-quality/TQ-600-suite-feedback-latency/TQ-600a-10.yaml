test_spec:
  - name: test_tq600a_10_the_package_copy_omits_the_documentation_ticket_and_unit_test_trees
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      Inspect the copy the file actually produces during a run — walk the directory
      `_copy_package_tree()` returned, not a list of what the helper claims to provide.
      The template, script and configuration directories are present; the
      documentation, ticket and unit-test trees are absent. Assert too that entries
      which were symlinks in the source are still symlinks in the copy, since the
      current call passes symlinks=True and the swap must not quietly resolve them.
  - name: test_tq600a_10_all_five_tests_reach_the_same_verdicts_against_the_smaller_copy
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Run the file before and after the change and compare the verdict of each of its
      five tests. Identical. This is the descriptor that converts a source reading into
      a result.
  - name: test_tq600a_10_the_file_still_performs_ten_real_builds
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "run_child_session() over unit_tests/test_bp_900g_8_ii.py, no --splits, LEAFCUTTER_SHARED_LAYOUT_EXECUTION_LOG set"
    must_catch:
      - "one copy is shared across two tests so the build count drops below ten, which is a different change with a different risk and is not what this record authorises"
    description: >-
      Count `deploy_executed` lines emitted by `_run_build_in_copy()` (line 234) in one
      child session. Still ten. This descriptor is a fence against scope creep, not a
      goal.
  - name: test_tq600a_10_the_copy_step_is_measured_before_and_after_in_one_sitting
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    must_catch:
      - "the whole file is timed instead of the copy step, so ten unchanged builds at roughly 13 s each swamp the signal and a real saving reads as noise"
      - "the two figures are taken in separate runs rather than one sitting, so host load rather than copy size decides the verdict"
    description: >-
      Time the copy step specifically — wrap the `_copy_package_tree()` call, not the
      file — on the same machine in the same run, with the whole-checkout copy and with
      the synthetic copy, and with the same number of copies. Report both figures and
      assert the RATIO favours the second. Never an absolute second count.
  - name: test_tq600a_10_the_file_uses_the_shared_helper_rather_than_its_own_copy_of_it
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "the file carries its own near-duplicate of the helper, so a controlled change to the shared helper's output leaves this file's copy unchanged"
      - "the file imports the helper and never calls it, which a name search in the source cannot distinguish from calling it"
    description: >-
      Change the shared helper's output in a controlled way and observe that this
      file's PRODUCED copy changes with it. Executed against the real produced
      directory, never by searching the source for the helper's name.
test_rationale: |
  The structural argument for this change is strong and the measurement behind it does
  not exist, so the descriptor set is arranged to stop the argument standing in for the
  measurement. The timing descriptor times the copy step rather than the file, because
  the file's ten unchanged builds would swamp the signal and make a real saving look
  like nothing.

  The build-count descriptor is a fence, not a goal. The tempting next step in this file
  is to share copies between tests and cut the ten builds — a different change, with the
  vacuity risk the sibling record addresses, and one this record does not authorise. The
  named mutation makes the scope creep fail rather than merely be discouraged.

  The helper descriptor is behavioural on purpose. The natural weak form is to search
  the file for the helper's name, which passes equally well on a file that imports the
  helper and never calls it, and on a file that has pasted a copy of it.
