id: BO-3100e-5
title: "A reference entry states how a step declares its expected result and what declaring nothing costs"
component: build-orchestration
components:
  - documentation_system
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given someone adding a new step to a build,
  When they read the reference entry for a step's expected result,
  Then it states how a step declares the result it produces,
    And it states what happens when a step declares no result at all,
    And it states what a declaration of no observable result requires — that it is
      explicit, carries a reason, and is counted and named in the build's record,
    And it states the three outcomes of looking for a declared result: found, not
      found, and could not be looked for.

  Given the reference entry,
  When a step is declared exactly as the entry describes and the build is run,
  Then the step is judged as the entry says it will be,
  So the entry is verified against the behaviour rather than against an intention.

  Given the reference entry,
  When a reader looks for the difference between this judgement and the judgement
    that a step produced nothing at all,
  Then the entry states the difference and gives the case that separates them: a
    step that changed files in the project and still produced none of its own
    declared result,
  So the two judgements are not read as one, and neither is taken as coverage of
    the other.
