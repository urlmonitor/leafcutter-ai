criteria: |
  Given one piece of work described only by a requirement in the store, with no
    surrounding plan document of any kind,
  And the same piece of work also being buildable the thorough way, where a plan
    document is produced for it,
  When the fast way is used and the person writing the tests is told what to write,
  Then what they are told includes a request for a proof that the finished work is
    reached the way the product is really used, not only a proof that it answers
    correctly when called directly,
  And that request is worded identically to the one the thorough way produces for
    the same piece of work, so a change to the wording changes both,
  And the request is present without the fast way having been given its own private
    copy of it — introducing a second way of asking cannot be how this is satisfied,
  And a piece of work that already states its own proofs keeps every one of them,
    unaltered and in its stated order, alongside the request.
