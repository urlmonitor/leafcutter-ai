test_spec:
  - name: test_bo_3200f_2_registry_entry_states_shell_permission_explicitly
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    angle: real_artifact
    description: "Load the repository's actual config/agent_registry.json and assert the executor's entry carries permits_shell as the literal value true, not absent."
  - name: test_bo_3200f_2_workspace_setup_gate_classifies_executor_as_permitted
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: "Run plan-feature's own permission classifier against the real registry with the executor's id; assert the verdict is permitted."
  - name: test_bo_3200f_2_template_and_registry_disagreement_fails_validation
    target_dir: unit_tests/agents/
    framework: unittest
    type: integration
    angle: failure
    description: "Copy the real template and registry into a temp tree, flip the permission (then the tool list, then the spawn rules) in one of them, run the real registry validation, and assert each disagreement fails it."
  - name: test_bo_3200f_2_executor_tools_and_spawn_rules_are_contained
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    angle: boundary
    description: "Assert the executor's tools contain no Edit, Write, Agent/Task, web or MCP tool and stay within the ADR-033 floor, its spawn_allowlist is empty, and no other registry entry lists it in a spawn_allowlist."
  - name: test_bo_3200f_2_no_shipped_setting_preapproves_executor_commands
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    angle: failure
    description: "Scan every settings and hook configuration the build ships and assert none contains an allow rule or exemption keyed to the executor or to its capture invocation as a class."
  - name: test_bo_3200f_2_bypass_variable_dispatched_to_executor_is_stopped_as_guardrail_refusal
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: "Dispatch a command setting the commit-agent bypass variable in front of a commit through the executor path; assert it is stopped at the load-bearing enforcement point chosen by the user and reported as a guardrail refusal, never carried out."
  - name: test_bo_3200f_2_four_command_kinds_are_carried_out_by_the_registered_executor
    target_dir: unit_tests/workflows/
    framework: unittest
    type: e2e
    angle: deployed
    description: "LIVE DISPATCH. Against a temporary project, dispatch to the real registered executor an AC-store read, a todo-to-in-progress claim, a git command inside a worktree and a repository script with arguments; assert each reply verifies as a BO-3200f-1 capture and none is a refusal, a confirmation request or an out-of-remit statement."
  - name: test_bo_3200f_2_no_executed_command_is_one_the_stated_permission_excludes
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: "For each of the four commands, compare its kind (read, store mutation, git, script) with what permits_shell: true admits under the registry schema's own wording; assert none is excluded."
test_rationale: |
  The registry half is deterministic and is asserted on the real registry file, because the
  defect this tree came from was a field read wrongly from the real file, never from a fixture.
  The disagreement test runs the real validator with a planted mismatch, since agreement that is
  only described is agreement nothing enforces.
  The four containment tests are the price of 'admits every exact command': tools, callers,
  shipped settings and bypass variables are the four ways a party that cannot decline becomes
  more capable than intended, and each has to fail a build when it drifts.
  The live-dispatch descriptor is the only honest evidence for the first scenario -- whether the
  registered agent carries a claim out rather than refusing it is behaviour of a model under its
  charter, and a grep of the charter is exactly the dead-prose proof the BO-3100/BO-3200
  constraint rejects. It is listed even though no live-dispatch test surface exists yet (see
  notes), so the gap is visible rather than silently filled with a template grep.
