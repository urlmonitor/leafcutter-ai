id: TQ-600a-13-xiii
components:
  - testing_quality
title: "A correctness test that passes only on retry is tracked on a non-holding notice, and one that does so repeatedly makes the run red"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the fresh-machine retry of TQ-600a-13-ii, under which a correctness-lane test that
    fails and then passes leaves the run green and is named as passed-on-retry,
  And the reason that is not enough for this population: the shared-layout guards catch a
    corruption that presents nondeterministically, so a pass on retry may be the defect
    itself, and a green run that records it only in a log loses the signal,
  When a completed correctness-lane run on main has one or more passed-on-retry tests,
  Then each is named, with that run's link, on the open `post-merge-flaky` notice
    (created if none is open), whose description lists every test that passed on retry in
    any of the last five settled correctness runs together with how many of those five it
    did so in,
  And that notice never affects the verdict of `Post-merge suite status`,
  And a correctness-lane test that passed on retry in two or more of the last five settled
    correctness runs on main — the current run included — makes the current run red,
    named in the run's result as a repeated pass-on-retry, exactly as a test that failed
    both executions is,
  And the count is taken from the recorded results of earlier runs, not from the notice,
    so a notice that was never written, edited by hand or closed does not change it,
  And a run with no passed-on-retry test writes nothing to the `post-merge-flaky` notice,
    and the notice is closed when none of the last five settled runs had one,
  And a correctness-lane test whose red was not reproduced at the same commit — a red run
    followed by a green run with the same head commit — is named on the same notice as a
    candidate for the timing lane (TQ-600a-13-xii),
  And timing-lane tests never escalate by this rule,
  And each case is demonstrated by applying sequences of run results — with passed-on-
    retry tests in zero, one and two of five runs — to the run's verdict and to the notice
    double, and observing the verdicts and the writes.
