  - path: docs/architecture/adrs/ADR-010-ac-store-as-authoritative-backlog.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-008-ac-store-schema-id-format-enforcement.md
    relationship: describes
    status: exists
  - path: docs/architecture/diagrams/c2-002-ac-authoring-pipeline.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Commit message must be deterministic given the same inputs (stage name, component, AC IDs)"
  - "Commit message must be parseable by standard git log tooling without custom parsers"
delivers_to: null
expects_from: null
test_intent:
- clause: 'the commit message first line contains: the text "plan-feature", the stage name (one of "PO",
    "BA", "IT-PO", "TEST-DESIGN-HANDBACK" for the test design committed before a hand-back round, or "TEST-DESIGN"
    for the final commit), and the target component name'
  needs_test: true
  reason: The subject is built from the stage-name mapping, the final flag and the component, and a wrong
    mapping would mislabel the stage in the log.
- clause: the commit message body lists every AC ID included in the commit (e.g. "ACD-300g, ACD-300g-1,
    ACD-300g-2")
  needs_test: true
  reason: The AC id list is joined from the stage's written ids, and a dropped id would hide a committed
    record from the log.
- clause: the commit message body states whether this is a mid-pipeline commit or the final commit of
    the run
  needs_test: true
  reason: The mid-pipeline or final marker comes from the isFinal flag, and an inverted flag would mislabel
    the run's last commit.
- clause: a reviewer reading only the git log can determine which /plan-feature stage produced each committed
    AC file without opening the files
  needs_test: false
  reason: It is the reader's view of the three clauses above, which already prove the subject and body
    a reviewer sees, so a separate test would only restate them.
test_spec:
