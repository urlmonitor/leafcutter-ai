id: TQ-500a-1
components:
  - testing_quality
  - build_orchestration
title: "Exactly one falsifiability answer per piece of work, and the writer says which kind it is"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the test-writing side hands on two pieces of work in one run —
      piece P, whose tests objected before the work was done and accepted after,
      and piece Q, whose tests were correct and passing from the moment they were
        written, so no before-and-after objection was ever available,
  When each piece of work is handed on,
  Then its hand-off record carries exactly one answer to the falsifiability
    question for that piece of work, in one of two shapes — the ordinary
    before-and-after evidence, naming the tests that objected before the work; or
    the substitute evidence, naming the deliberate alteration made to the guarded
    behaviour and what each test did under it,
    And which of the two shapes applies is taken from the writer's own statement
      in that record and from nothing else: no part of the run derives it from the
      wording of the requirement, from the shape of the outcome the requirement
      asks for, or from any phrase appearing in the requirement's notes,
    And the answer sits in the same hand-off record that already carries the
      writer's other machine-checkable statements, not in prose a reader has to
      interpret,
    And piece P and piece Q each carry their own answer, so a run leaves one
      answer per piece of work and never one answer standing for the run.
depends_on:
  - TQ-500a
