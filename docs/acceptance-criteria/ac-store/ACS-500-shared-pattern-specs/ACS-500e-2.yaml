criteria: |
  Given a page AC references composite pattern "crud-list-page" (PTN-020),
  And PTN-020 depends_on atomic patterns [PTN-010, PTN-011, PTN-012],
  When a reader traverses the dependency graph starting from the page AC,
  Then they can resolve the full behavior stack in order:
    1. Page-specific criteria (from the page AC itself),
    2. Composite wiring behavior (from PTN-020),
    3. Atomic behaviors (from PTN-010, PTN-011, PTN-012),
  And each layer is a distinct AC file with its own id and criteria,
  And the layering from atomic to composite to page-specific is
    expressible using only the standard depends_on and implements_pattern
    fields (no additional hierarchy mechanism is required).
