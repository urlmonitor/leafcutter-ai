work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the /plan-feature workflow source (templates/workflows-js/plan-feature.js) holds
    rationale pointer comments, each a code comment that points to a rationale doc, and 15 of
    them today begin "// Why why" (a doubled word),
  When those comments are corrected,
  Then every rationale pointer comment reads "Why" once, with the rest of its line unchanged
    character for character,
  And no line of the workflow source contains "Why why" in any letter case.
