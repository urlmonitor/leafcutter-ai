id: GE-120c-3
title: "A person blocked where nobody can be brought in has a procedure to follow"
component: guardrail-engine
components:
  - commit_guardian
  - documentation_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a person whose commit has been stopped, or whose shared build has failed, on a numbering
    clash, and who has only the printed output in front of them,
  When they follow the how-to guide,
  Then it tells them how to decide WHICH of the two claimants moves, giving the criterion this
    project uses rather than leaving it to preference,
  And it tells them how to find a free number for the artifact that moves,
  And it tells them how to find and update the existing references to the number being vacated,
    so the move does not leave a citation resolving to nothing or to the wrong artifact,
  And it states which references are deliberately NOT rewritten — dated historical records that
    describe what happened at the time — and what to do instead for those,
  And it states plainly that at these two stages nobody is dispatched to do this for them, and
    names the one stage where that does happen, so the difference is understood rather than
    discovered,
  And a person following the guide end to end on a real clash reaches a state where the
    numbering gate passes.
depends_on:
  - GE-120c
  - GE-120c-2
doc_links:
