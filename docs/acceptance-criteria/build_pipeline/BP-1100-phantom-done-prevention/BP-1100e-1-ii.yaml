assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Normalize both the declared and the actual paths to a canonical form before set comparison: unify path separators to POSIX forward-slash, and case-fold when the target filesystem is case-insensitive (NTFS/APFS) so casing differences do not cause a false mismatch."
  - "Do not case-fold unconditionally on case-sensitive filesystems (two files differing only by case are distinct there); gate case-folding on filesystem case-sensitivity."
  - "_normalise_path must strip only a single leading './' via str.removeprefix('./'), NOT lstrip('./') — lstrip removes ALL leading dot/slash characters and destroys leading-dot filenames (.github/ci.py, .hidden.py, .env), producing a false undeclared-flag. Separator normalisation and case-folding still compose after the prefix strip."
  - "PORTABLE SURFACE: this path normalization lives in the same hook (templates/scripts/commit_guardian/hooks/check_files_touched_reconciliation.py) pinned in BP-1100e-1; ADR-001 build.py round-trip parity applies. Path normalization is what keeps the check portable across the WSL2/NTFS, macOS/APFS, and native-Linux consumer filesystems."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
