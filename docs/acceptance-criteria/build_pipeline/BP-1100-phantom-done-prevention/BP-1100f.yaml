notes: |
  Origin: BO-2300 "Interactive Pause/Resume" phantom-built twice (RCA
  /tmp/phantom-rca-bo2300.md, 2026-07-20). A feature was signed off twice while its
  real behavior was absent because tests keyed off dispatch TOPOLOGY (labels/counts
  the harness mock controls) rather than the instruction PAYLOAD and the on-disk
  EFFECT. Three benefit-level angles for the BA to decompose into L2/L3:
  (1) a step that should make a real change is not accepted on "an agent ran"
  alone -- the pipeline confirms the real artifact/effect;
  (2) a work item whose stated intent (assigned helper / how-checked) contradicts
  the actual thing being changed is caught BEFORE implementation begins
  (root of RCA Failure #1: python-coder+pytest pointed at .js surface);
  (3) a step meant to produce a durable result must carry a real, actionable
  instruction -- an empty/content-free step is caught, not silently passed
  (root of RCA Failure #2: bare-object dispatch with no instruction, no consumer).
  Guard #1 (undeclared-file changes) is BP-1100e-1 (DONE) -- reference, do NOT
  re-derive. Sibling boundaries: BP-1100a = pre-dispatch scope completeness;
  BP-1100e = declared-vs-actual files after work. BP-1100f = proof of real
  effect/intent vs dispatch topology.
