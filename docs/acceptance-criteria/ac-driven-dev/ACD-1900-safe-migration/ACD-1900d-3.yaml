title: "A gate not in the deploy-manifest cannot be promoted to required"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given a gate script that is absent from the build deploy-manifest,
  When promotion of that gate to a required check is attempted,
  Then promotion is refused with an error naming the missing deploy-manifest entry;
  And when the script is present in the deploy-manifest, promotion is permitted.
depends_on:
  - ACD-1900d
