notes: |
  USER REQUIREMENT (2026-10-02, decided directly by the user; NO decision record
  exists for it): mining reads BOTH sources:
    1. published decision records (docs/decisions/), and
    2. Langfuse traces of kernel runs, including runs that failed, were
       cancelled, or were staged and never published.
  Do not drop either source at L2.

  SETTLED: mining is an OFFLINE job that produces CANDIDATES only. The decision
  hot path never reads Langfuse (ADR-058 section 6, ADR-056). The mining job
  never approves anything (ADR-060). "Never waits on it" in the criteria is the
  customer form of that rule.

  CARRY TO L2 (assumptions in the mock data that the BA and IT PO must settle):
    - proposed_by takes the value criteria_mining for mined candidates, or
      human:<name> for a category a person proposes.
    - A trace sighting is evidence FOR a proposal and never a member. Only
      published-record sightings can become (decision id, criterion id)
      membership.
    - When and how mining runs (on demand or scheduled) is not decided.
  The new job is a new architectural component, hence component-diagram. A
  person runs it, hence how-to. It involves Langfuse, the decision store, the
  job and a reviewing person, hence sequence-diagram.
