notes: |
  NO CRITERION MAY BE SATISFIED BY RELAXING AN OBLIGATION — binding across this
  whole set, and this is where it bites hardest, because a visible count creates a
  direct incentive to make it smaller. The cheapest way to burn down a backlog of
  conflicts is to stop counting some of them.

  The second and third scenarios make exclusion a reported event rather than a
  quieter number, and the fourth keeps the honest path distinguishable from it. A
  count that falls for two different reasons without saying which is a count nobody
  can act on.

  Note the interaction with BO-3600d-2-i: deferral does not reduce the count either,
  it ages within it. Between the two records, the only ways the number goes down are
  a recorded verdict and the records coming into agreement.
