change_target: pipeline
risk_surface: contract_boundary
notes: >-
  Test contract intent: unit-testable against the tolerant agent-reply reader with ''
  and with a whitespace-only string, asserting each raises the same typed
  stage/agent-named error as the prose-only case (BP-300e-4) rather than returning
  None/empty or being swallowed. Closes the boundary case where "nothing came back"
  could otherwise read as "nothing to do". Since the 2026-08-17 adjudication it also
  closes the second half of that boundary: at a reading point that IS registered for
  degradation, an empty reply must degrade the same way a prose-only reply does, so
  emptiness never becomes a quieter side door through a reading point that would have
  stopped on unreadable prose. The adjudication itself — the two positions, the decision
  and the grounds — is recorded in the parent, BP-300e-4.
