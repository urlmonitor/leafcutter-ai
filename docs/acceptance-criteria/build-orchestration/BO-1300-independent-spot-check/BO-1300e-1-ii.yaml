it_requirements:
  - "Deduplication must merge only findings describing the same underlying problem; genuinely distinct findings each retain their own ticket. The merge criterion (e.g. same affected seam/behavior) must be explicit, not coincidental string-equality of summaries."
  - "A merged ticket must record all contributing reviewer angles so the multi-angle corroboration is visible in the tracked work."
  - "Dedup runs before ticket emission so the one-ticket-per-distinct-issue invariant holds end to end, and remains stable on re-run (no duplicate tickets across repeated passes)."
