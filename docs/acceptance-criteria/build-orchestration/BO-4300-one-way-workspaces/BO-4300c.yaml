notes: |
  The record the incident violated. Two halves, both required, and they fail separately:
  (1) the MAKER only answers "ready" when every part of readiness holds (F4 unparseable
  answers, F5 a half-made workspace reported healthy, F6 a failed install swallowed,
  F7 a "protections active" check that passes when they are not); (2) EVERY CALLER stops
  on anything but "ready" and takes the workspace's location only from the maker's own
  answer (F2 -- plan-feature's no-workspace mode, build-epic's fallback to the epic
  folder, finalize's "unknown", the fast lane trusting a path an agent claimed). A
  perfect maker with a caller that carries on is the 2026-09-25 incident exactly.

  Reuse, do not re-derive: proof that protections genuinely fire is BO-1700a/d; failing
  closed on unrunnable checks is BO-1700b; set-up naming what it could not establish is
  GE-120d; never writing straight into shared main as the END STATE is BO-1800e.
  This record adds the cross-caller halt and "ready means all of it".

  Proof must be behavioural at the workflow level: a maker that refuses, answers in
  prose, or answers without a status must end the calling workflow before any authoring,
  phase or delivery step is dispatched (migration plan 6.1, last paragraph). The current
  harness cannot express an agent refusing its task (F13).

  documentation_triggers: sequence-diagram -- caller, maker and the halt path involve
  more than two actors, and the halt is the whole of the visible difference.
