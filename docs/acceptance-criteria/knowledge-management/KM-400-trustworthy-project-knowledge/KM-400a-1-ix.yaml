notes: |
  Retrospective type-specific refinement of KM-400a-3-i. The canonical glossary
  persists term and definition, not a universal structured triage schema. Existing
  corpus, boundary and mutation evidence supports this contract. The reader receipt
  separately reports one real-symlink test skipped because Windows lacked the required
  privilege; this reviewed specification makes no claim that the skipped case passed.
  IT PO review and criterion-specific test links are recorded.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
  The unchanged symlink escape test subsequently passed in the local Linux environment.
  All linked behaviors now have passing evidence; the original Windows skip remains recorded.
estimated_complexity: M
it_requirements:
- Term identity must remain compatible with the canonical lowercase-trimmed heading convention while original term
  text and Markdown are retained for inspection.
- Heading recognition must respect Markdown comments, fences and indentation; glossary exposure must not execute
  triage or manufacture term-level metadata from file context.
