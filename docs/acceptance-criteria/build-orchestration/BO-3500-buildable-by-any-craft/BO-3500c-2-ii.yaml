notes: |
  THE RENDER REQUIREMENT IS GONE, AND WHAT REPLACED IT IS STRICTLY STRONGER (amended
  2026-08-31, findings F4 and F5). Two facts, in the order they arrived:

    - A RENDER IS NOT AFFORDABLE (F4). There is no diagram renderer installed here and no
      root package manifest, and this is a portable package that is installed into
      arbitrary repositories — it cannot assume a JavaScript runtime is present. A
      required gate that needs one is a gate that fails for reasons about the host rather
      than about the diagram. On its own, that argument only removes a clause and leaves
      the proof weaker.
    - THE USER'S REASON FOR NEEDING A DIAGRAM KIND DISSOLVES IT (F5). They intend to move
      to structured data as the foundation for diagrams. A diagram held as structured
      data is SCHEMA-VALIDATABLE, and a schema-validatable source needs no renderer to be
      checked: malformed source — the failure a render catches — is caught by the schema,
      earlier and more precisely, with the offending element named. So the proof becomes
      cheaper AND stronger at once, which is why the render clause could be dropped
      without weakening anything.

  RENDERING WAS NEVER THE POINT ANYWAY. A diagram that renders beautifully and describes
  a system that does not exist is the expensive failure, and it is invisible to every
  check short of resolving the names.

  THE RESOLUTION CLAUSE IS AFFORDABLE HERE SPECIFICALLY, and it is not a new build. This
  project already keeps registers of its components, its crafts and its skills, so "does
  this name resolve" is a lookup rather than an inference — and one commit-time check
  ALREADY DOES EXACTLY THIS for one family of diagram: it parses the spawn diagram out of
  the agent cards and compares its edges against the craft register in both directions.
  The work here is extending a mechanism that exists and is running, not inventing one.
  That is also why the clause is written for elements the diagram claims are parts of
  this project and not for every label on it — a diagram may legitimately name an
  external system, a user, or an abstraction, and demanding those resolve would make the
  proof unsatisfiable.

  ONE INSTRUMENT, PARAMETERISED — NOT TWO IMPLEMENTATIONS (third scenario; a judgement
  call decided by the user, 2026-08-31). A diagram is a distinct authoring KIND but it is
  NOT a distinct proof instrument: it is the reading-class check the written page uses,
  with a denser reference extractor per file type. Given F5, the schema validation IS
  that per-type parameter. Building it as a second implementation would give the project
  two reading instruments that must agree about what a resolvable project element is,
  kept in step by discipline — which is the shape this repo keeps paying for.

  THE FOURTH SCENARIO IS THE HONEST ENDING FOR THE DIAGRAMS THAT ARE NOT YET STRUCTURED
  DATA. Diagrams embedded in prose exist today in quantity. Until the extractor reaches
  their form they are refused up front under BO-3500c-4, not passed on existence. That
  keeps the transition visible instead of quietly creating a class of diagram that is
  finished on a weaker proof than its neighbours.

  WHY THIS IS STRONGER THAN THE WRITTEN-PAGE PROOF, deliberately. A page is prose and a
  reader can judge it. A diagram is read as a statement of fact about the system's
  shape, is believed more readily, and is corrected less often. 119 not-yet-done
  requirements declare the diagram craft, so whatever this proof is will be applied a
  great many times before anybody re-examines it.
