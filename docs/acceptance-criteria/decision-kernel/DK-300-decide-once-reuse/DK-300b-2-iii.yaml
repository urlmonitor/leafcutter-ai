id: DK-300b-2-iii
title: "No answer or a cancel leaves the decision unresolved and keeps no record"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: in_progress
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the ranked-choice question is open,
  When you never answer, or you cancel the run with
    python -m kernel cancel --run-id <run id> --actor human:<your id>,
  Then the decision does not resolve,
  And the run's staged decisions folder holds no decision record,
  And docs/decisions/ holds no record from the run.
