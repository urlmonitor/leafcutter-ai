it_requirements:
  - "Pin the path: docs/reference/required-proof-vocabulary.md. It must carry the project reference-doc frontmatter (title / type: reference / status / created / last_updated / components / description) or check_doc_frontmatter blocks the commit."
  - "The permitted-kind table must be generated from, or explicitly stated as mirroring, the single definition BO-2900g-3 establishes — and the page must name that file path. A reference page that restates an enum from memory becomes the next competing definition."
  - "The page must name the retired kind and its replacement explicitly, and state that no synonym is accepted, so a reader who meets the old name in an existing description knows what it became."
  - "The final clause is not boilerplate: the page must state in its own words that it covers what is ASKED FOR before any test exists, and must name BO-2900a's execution observer as where ACHIEVED is settled. Without it this becomes the most convenient page from which to conclude that a conforming description means the proof exists."
  - "Cross-link, do not restate: docs/testing/test-angles.md keeps the failure catalogue and the evidence base; this page is the contract."
  - "It must be reachable from docs/reference/ac-schema.md and must not state a different permitted-kind set from it."
test_required: false
test_rationale: |
  Genuinely test-free: change_target is docs and the AC's entire observable is the prose
  content of one reference page. There is no executable behaviour to assert. The two
  mechanical properties that DO exist are already covered elsewhere and must not be
  re-tested here by proxy: frontmatter validity is enforced by the check-doc-frontmatter
  hook, and enum agreement between the page and the single definition is covered by
  BO-2900g-3's cross-source set-equality test. A test that greps this page for keywords
  would assert prose presence, not correctness, and is explicitly not wanted.
