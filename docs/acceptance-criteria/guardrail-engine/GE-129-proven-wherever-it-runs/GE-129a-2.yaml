assigned_agent: python-coder
estimated_complexity: M
package_surface: true
it_requirements:
  config_schema_fragment:
    session_hook_declarations:
      type: object
      description: >-
        NEW TOP-LEVEL SECTION. Declarations for guards wired on the session (tool-call)
        registration surface, held here rather than in templates/settings.json — see the
        constraint below for why that file is excluded. Shape: {"_comment": string,
        "declarations": [ ... ]}, where each member is an object carrying the identity triple
        GE-129a-1 derives plus the declaration itself. The triple is held as three separate
        fields, never as one composed key, so no delimiter is invented and each part stays
        comparable to what the reader read off the surface: `event` (the tool-call event the
        entry sits under, as the surface spells it), `matcher` (the group's matcher string
        VERBATIM, never an expanded tool list), and `script` (the guard the entry's command
        resolves to, recorded as the repo-relative canonical path under templates/hooks/ so the
        declaration does not encode a deployed path that differs per layout). Each member also
        carries `negative_control`, whose shape is COPIED FROM
        config/verification_flow.schema.json $defs/negative_control and is NEVER re-invented:
        either {input, command (optional), expected_result, currently} or the {not_applicable:
        true, reason} alternative. `currently` is that schema's $defs/currently — {state in
        [passing, failing, blocked, unverified], observed (YYYY-MM-DD), evidence[] of {command,
        output}}. Each member also carries `entry_point`, that schema's own field, which on this
        surface names the tool-call event the payload is delivered through and never a command
        line. No field is added beside these and no synonym is minted; what this surface needs
        that hooks_manifest did not is the triple, and the triple is identity, not vocabulary.
  reference_file_path: "templates/scripts/commit_guardian/commit_guardian.json"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - >-
      THE HOME IS SETTLED AND templates/settings.json IS EXCLUDED — the reason is stronger than
      the parser question this record poses, so the parser fact does not need settling. That file
      is read by the editor's own settings parser, whose tolerance of an unknown key this project
      cannot test, cannot pin and does not control, and whose worst rejection mode is the whole
      file being refused, which unwires every session guard at once. Risking the guard surface to
      hold metadata about the guard surface is not an acceptable trade at any tolerance level.
      The third candidate — a block inside the guard script — is excluded on the criteria's own
      terms: one declaration per ENTRY is required, a guard wired at two events needs two, and a
      per-script home structurally cannot hold two. That is the same collapse GE-129a-1 rejected
      for script-path identity, reappearing one level down.
    - >-
      THE TIE IS COMPUTED, NEVER STORED. Bind a declaration to a subject by comparing the triple
      the declaration carries against the triple GE-129a-1 read off the surface on THIS run. Do
      not store a subject id on the declaration, do not store a declaration id on anything
      derived from the surface, and do not cache the resolved pairing between runs. A stored tie
      is a tie that cannot notice the surface moving, which is the precise failure this record
      exists to make visible.
    - >-
      BOTH ORPHAN DIRECTIONS ARE REPORTED, AND NEITHER IS AN ERROR CONDITION. The pairing is a
      set comparison with three outcomes and the run must emit all three: subjects with a
      declaration, subjects with none, and declarations tied to nothing. An implementation that
      raises on an unmatched declaration, or that silently drops one, satisfies neither of the
      two middle clauses in the criteria. Nothing in either unmatched class may be credited with
      a demonstration on the strength of a tie that used to hold.
    - >-
      THE VOCABULARY IS config/verification_flow.schema.json's, REUSED VERBATIM — ADR-045 §3,
      inherited, not re-decided. Do not collapse `blocked` into `failing`, do not omit the block
      for an unrun control, and do not mint a synonym for any of the four states. That schema
      has exactly one reader today; a second vocabulary beside it is how a vocabulary with one
      reader becomes a vocabulary with none, which is the history this whole record is built on.
    - >-
      THE DECLARATION SECTION IS DATA AND MUST NEVER BE READ BACK AS AN ANSWER. Nothing in
      `currently` may be written from anything but an execution, and nothing in the run's report
      may be derived from a declaration's own contents. This record is where that rule is
      easiest to break, because the declaration is right there and already holds a state field.
      ADR-045 §1 owns the rule and GE-120f-1 owns its alter-and-revert discriminator; neither is
      restated in the criteria above, and both bind this implementation.
    - >-
      PACKAGE SURFACE, DECLARED DELIBERATELY. A new top-level key in commit_guardian.json is a
      watched registry entry, so this record carries package_surface: true and the structured
      spec above. Omitting the declaration would be caught at landing time by the
      check-package-surface-declaration hook reconciling the registry entries the change actually
      adds — declaring it here is the cheaper end of the same conversation. Run
      `python scripts/build.py --target-dir .` after the edit; a section present in templates/
      and absent from the deployed copy is a declaration the run cannot see.
    - >-
      AC_ENFORCE_STRICT=1 on every pytest invocation below. Error-handling policy applies to the
      config read and JSON parse: specific exception types, logged at WARNING or higher or
      re-raised. A swallowed read error must never become "no declarations exist", which would
      report every subject as undeclared and read as a large, plausible, entirely false finding.
test_spec:
  - name: test_ge129a2_a_repointed_entry_orphans_its_declaration_in_both_directions_while_the_declaration_is_held_byte_identical
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      THE DECISIVE DRIFT DESCRIPTOR — WRITE THIS ONE FIRST. Over a fixture surface and a fixture
      declaration section, run once and capture the tie. Repoint the entry the declaration speaks
      for at a different guard, leaving the declaration BYTE-IDENTICAL, and re-run: the
      declaration is reported as tied to nothing and named, the repointed entry is reported as
      carrying no declaration, and neither is credited with a demonstration. Assert the
      declaration bytes are identical across both runs. PAIRED IN THE SAME RUN: an untouched
      guard is still reported with its own declaration tied to it and with the state its own
      examination produced — without that half, a run that reports everything as tied to nothing
      passes.
  - name: test_ge129a2_one_declaration_never_answers_for_a_second_entry_naming_the_same_guard
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Wire an already-declared guard at a second tool-call event and add no declaration for it.
      Re-run: the first entry keeps its declaration, the second is reported as carrying none, and
      the second is not credited with the first's state. NAMED MUTATION (mandatory, run it): bind
      the declaration by the guard's bare filename. Under that injection the second entry
      inherits the first's declaration and this descriptor goes RED, while the repointing
      descriptor above goes green-by-accident for a repoint that changes only the matcher — run
      both and observe the asymmetry rather than assuming it.
  - name: test_ge129a2_every_subject_and_every_declaration_falls_into_exactly_one_of_the_three_reported_classes
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Over a fixture surface holding declared subjects, undeclared subjects and a declaration
      matching nothing, assert in one run that all three classes are populated, that they are
      distinguishable in the run's own output, and that no subject or declaration appears in two
      of them or in none. Assert by membership over the emitted output, never against a literal
      expected list.
  - name: test_ge129a2_the_declaration_section_is_read_from_the_deployed_config_in_a_cold_process
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After `python scripts/build.py --target-dir <copy>`, the DEPLOYED run loads the declaration
      section from the deployed commit_guardian.json with PYTHONPATH scrubbed, the interpreter
      isolated and cwd off the source tree. Assert the run states which config path it loaded and
      that it is the deployed one. PAIRED: a section present in templates/ but removed from the
      deployed copy must make every subject report as undeclared rather than the run reporting a
      clean pairing — the build step is part of this record, not a precondition of it. Invoke
      pytest with AC_ENFORCE_STRICT=1.
  - name: test_ge129a2_the_declaration_vocabulary_matches_the_schema_at_run_time_and_a_synonym_section_fails
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      Extract the field names and the four state values from config/verification_flow.schema.json
      AT RUN TIME — never from a literal in the test, so the expectation moves when the schema
      moves — and assert the declaration section uses exactly those names. PAIRED AND MANDATORY:
      run the same check against a fixture declaration section that says the same things in its
      own synonyms and assert it FAILS. Without the paired fixture this is a presence grep and
      proves nothing.
test_rationale: |
  Every clause of this record turns on what the run reports AFTER the surface has moved underneath
  a declaration held byte-for-byte as written, so no descriptor above can be satisfied by asserting
  that a declaration exists, parses or is populated — which is the one form of verification this
  tree treats as disqualifying. The two named mutations are the two bindings a competent engineer
  reaches for first (bare filename, stored tie), and they redden different descriptors, so both are
  executed rather than described.

  The deployed descriptor is here because the declaration's chosen home is a file that exists in
  two copies. A pairing computed against the templates/ copy while the run loads the deployed one
  agrees with nothing that runs, and it fails green — the same mechanism that made this tree's
  worked example inert, reappearing in the machinery built to examine it.
