notes: |
  Satisfies the how-to entry in GE-119b's documentation_triggers. The PO was explicit that
  this trigger is a REPLACEMENT, not an addition: "that instruction must be deleted rather
  than left to rot beside the fix."

  Why deletion is the criterion rather than an update: a documented manual workaround for a
  defect that no longer exists is worse than no documentation. It teaches every future reader
  that the checks cannot be trusted from a worktree, so they keep applying the workaround, and
  the day it stops being applied nobody knows whether the resulting behaviour is the fix
  working or the workaround missing. The store already carries an instance of this rot: the
  memory note for GE-118a-1 has to say "FIXED at source 2026-08-13 — stop applying the old
  per-worktree workaround," which is only necessary because the workaround outlived its cause.

  ORDERING: this AC must land AFTER GE-119b-4 demonstrates parity, never before. Deleting the
  workaround while the defect is still live removes the only thing protecting drives from it.

  DISTINCT FROM GE-119d-5, which is also a how-to AC on the same document. This one REMOVES
  the obsolete manual step for the check family; GE-119d-5 ADDS what a prepared working copy
  now guarantees and how to confirm it. Sequence d-5 after b-5 so the two edits do not
  reintroduce each other's text.
