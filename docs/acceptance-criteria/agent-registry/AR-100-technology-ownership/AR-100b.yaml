criteria: |
  Installed projects whose own code is JavaScript get a JavaScript specialist.

  When leafcutter is installed into a project whose application code is
  JavaScript, that code is implemented by someone fluent in the language and
  its everyday tooling — a genuinely different need from maintaining
  leafcutter's own automation, and served on its own terms rather than folded
  into it.
