notes: |
  THIS RECORD GUARDS THE REPLACEMENT, NOT THE DEFECT. Every path it names is
  reported today, so on the current behaviour all four arms are GREEN ON ARRIVAL
  and none of them is evidence that anything landed. They exist because the
  change most likely to be written — replace a substring test with a comparison
  over path segments — has a family of near-miss readings that are each one
  keystroke away from correct and each of which reopens the hole in a new place:
  a name compared with "begins with" instead of "equals"; a two-segment location
  reduced to its last segment; the file name included in the segments compared.
  A change that introduced any of them would pass the parent's measured rows and
  this L1 would have traded one silent loss for another.

  THE LAST ARM IS DELIBERATELY A MIXED RUN. Read on their own, the first three
  arms are all satisfiable by refusing the entitlement to everything, which is
  the failure GE-125a-2 exists to forbid. Repeating that control here in
  miniature is not duplication of GE-125a-2: it is what stops a suite that runs
  only this record from certifying an over-narrowed comparison. GE-125a-2 remains
  the record that owns the full four-location control.

  WHY THESE NAMES. tickets-archive/ and old-tickets/ are the shapes a project
  actually grows; templates/skills-experimental/ is the shape this package would
  grow. acceptance-criteria/ and retrospectives/ without their heading segment
  are the specific reading a segment-set comparison produces if the four
  locations are flattened into four names — two of the four are two segments
  deep, which is easy to lose sight of. None of the ten is exempt today, so the
  parent's measured table does not cover any of them.

  FOR THE IT PO. The token is assembled at runtime from fragments, as recorded on
  the parent. This record in particular cannot be discharged by inspecting the
  check's source: the whole subject is the difference between two comparisons
  that read almost identically, and only running them apart tells them apart.
