notes: |
  THE negative control for the whole TQ-400 tree. TQ-400b-1 (demotion) depends on
  this AC: a sweep that demotes a proven record destroys trust in every other
  verdict it produces, so this must hold before demotion has any authority.

  Test-angle constraint: this cannot be satisfied by a test that greps a config
  file or asserts a "skip proven records" branch exists. It requires a real store
  on disk, a real test that really passes, a real sweep run, and a byte-level
  before/after comparison of the record file. The final clause (unproven records
  in the SAME run are acted on) is what stops a no-op sweep from passing — a
  sweep that does nothing at all would otherwise satisfy "proven record
  unchanged".

  Reuse constraint: the proven/unproven verdict must come from the existing
  per-record oracle (verify_done_eligible in scripts/ac_store/done_proof.py), not
  from a second reader written for the sweep. Two readers of the same evidence
  drift; this repo has already hit that failure mode (EPIC-ComputedQualityGates
  FP-1 layer 3, disjoint vocabularies).

  IT-PO ENRICHMENT NOTE (2026-08-17) — SEQUENCING AND THE DESIGN CONSTRAINT IT
  IMPLIES. Per the product owner, TQ-400e is a precondition for TQ-400b and
  TQ-400d, and this record is the sharpest edge of that: byte stability is not a
  property that can be retrofitted onto a bulk-rewrite design. If the sweep is
  built to load the store, mutate in memory, and write it back, every untouched
  record is reformatted by the serializer and this AC becomes unimplementable
  without a rewrite. That is why complexity is L and why the per-record
  discriminating write path is stated as an it_requirement rather than left to the
  implementer: it is a decision that must be made before any demotion code exists.

  Also note what check_all_done_acs does NOT do today: it collects violations and
  writes nothing. The entire write path is new, so there is no existing write
  discipline to inherit — it has to be established here.
