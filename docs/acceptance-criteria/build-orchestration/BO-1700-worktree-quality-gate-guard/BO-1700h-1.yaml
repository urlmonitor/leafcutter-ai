criteria: |
  Given the worktree's resolved pre-commit config content-hash differs from the
    current pre-commit config content-hash in the main tree,
  When the probe runs,
  Then the probe reports the config as stale, exits non-zero, and stderr states
    that the worktree hook set does not match the main tree's current hook set.
  And given the worktree's resolved config content-hash equals the main tree's
    current config content-hash,
    Then the freshness assertion passes.
