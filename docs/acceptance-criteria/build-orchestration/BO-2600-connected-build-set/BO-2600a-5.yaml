id: BO-2600a-5
components:
  - build_orchestration
title: "goal_to_epic can build an epic from an explicit connected-set id list, not just a single AC's subtree"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given goal_to_epic (scripts/goal_to_epic.py),
  And a new entrypoint that accepts an explicit, already-resolved, dependency-ordered
    list of leaf AC ids (e.g. a `--ids` CLI mode / a build_epic_from_ids() function),
  When it is given that id list,
  Then it builds the epic folder from EXACTLY those ids — one ticket per id — using the
    existing assembly path (resolve_leaf_dependencies restricted to the given id set +
    topological_sort + per-leaf ticket generation + epic-folder assembly + Master_Plan),
  And it does NOT re-derive the set by walking a single AC's covered_by subtree
    (traverse_ac_tree) — so ids that live OUTSIDE the target's subtree (genuine
    cross-tree prerequisites) are included rather than dropped,
  And each generated ticket's depends_on references co-located ticket files (AC-id ->
    ticket-file translation) so ticket_frontmatter_guard passes,
  And the existing single-AC `--ac` mode is preserved unchanged (backward compatible).
