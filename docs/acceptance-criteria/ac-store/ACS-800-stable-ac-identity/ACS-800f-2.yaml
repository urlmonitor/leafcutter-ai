criteria: |
  Given the product-owner, business-analyst, and it-po agent instructions that
    today tell an agent to derive a parent by stripping a segment from a child's
    name,
  When those instructions are updated for the new identity model,
  Then they tell the agent that a requirement's identity is a stable opaque UID
    and that its parent is read from the parent-pointer metadata field,
  And the parent-child link update protocol they describe is keyed on the
    parent's UID rather than on a name-derived parent id,
  And none of the three agent instruction sets still instructs the agent to
    derive a parent from a requirement's name as the primary mechanism.
