notes: |
  WHAT THE EVIDENCE ACTUALLY SAID, AND WHAT IT CORRECTED. This record is specified
  against a per-file analysis of the thirteen slowest build-spawning test files, with a
  path-and-line citation for every claim. Its headline finding is a correction: the
  originating hypothesis was that these files "did not move" because they self-target,
  and that the fix is the same self-targeting-to-directed conversion applied elsewhere.
  That is true of one file out of thirteen, and in that one file the self-targeting is
  correct. The lever is the number of real builds a file performs. Every criterion here
  follows from that correction, and the last test descriptor exists to stop the original
  hypothesis being acted on anyway.

  HOW THIS RELATES TO TQ-600a-8. TQ-600a-8 is the ratchet that migrates the existing
  deploy-site population onto the shared layout. This record is the residue that ratchet
  cannot move: files that build fresh adopter projects from an empty directory, or alter
  package source before building, and so can never be read-only consumers of one shared
  artifact. The two do not overlap and do not order against each other.

  WHAT IS DELIBERATELY NOT HERE. Two files were examined and found already minimal, and
  no criterion covers them: the authored-test-spec file, which already memoises per input
  and is cited in two independent analyses as exemplary, and the fifth consumer-install
  file, in which no identical-setup pair was found. A third proposal was examined and
  rejected: merging the three mutation shapes in the reachability file so that one
  execution serves both the message assertions and the produced-tree assertion, worth
  about 37 s. That file's own AC names four distinct test_spec entries, and collapsing
  four declared executions into one to save 37 s trades a declared per-test-id execution
  boundary for a small gain. It is the one proposal the evidence itself calls genuinely
  contestable, and it is left out rather than smuggled in.

  CONFIDENCE, STATED HONESTLY. The 497 s adopter-family figure is the largest number in
  this record and the least independently verified: it comes from a prior analysis's
  call-site count whose premise was checked against all six files but whose arithmetic
  was not recomputed. The 78 s and 52 s figures were derived independently by reading
  the call sites. That asymmetry is why the criteria require the saving to be counted
  from the run rather than asserted, and why the timing criterion is a ratio.
