id: BO-2500a-7
components:
  - build_orchestration
title: "A proof run that did not finish is reported as unfinished, never as a list of tests that failed"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an acceptance criterion whose linked tests are asked to run as proof,
  When the run does not reach the end -- because it exceeded its time budget, or
    was killed by the machine, or ended for any other reason before every linked
    test had reported an outcome,
  Then the verdict says the run did not finish,
  And it does not name any test as not passing on the strength of a result it
    never received,
  And a reader can tell that outcome apart from a run that completed and found
    real failures, without inspecting the code that produced it.
