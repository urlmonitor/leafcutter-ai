it_requirements:
  - >-
    ONE MEASURE, PER-LANGUAGE TOKENIZER, NO DELIMITER REGEX. Uncounted content is
    exactly: comments of every style the language has (Python `#`; shell `#`; JS/MJS/
    TS/TSX `//` and `/* */`, including a JSX `{/* ... */}` container standing alone on
    its line; SQL `--` and `/* */`) and Python docstrings (a string literal that is
    the first statement of a module, class or function). Blank lines outside those
    stay counted. Decided by BrainCandy 2026-10-16: "NO comment counts toward a
    file's length, in any style."
  - >-
    The language is chosen from the file's covered extension. A covered extension
    with no tokenizer is a defect in this change, not a raw-count fallback: GE-127d-3-ii
    owns the could-not-measure outcome, and the deployed-copy descriptor below fails
    if any checked extension is unmapped.
  - >-
    THE LINE RULE, STATED ONCE FOR EVERY LANGUAGE (IT PO, 2026-10-16). A physical line
    counts when it carries at least one token that is neither a comment nor part of a
    docstring, OR when it is whitespace-only and lies outside every comment and docstring.
    Every physical line spanned by a multi-line string value (a non-docstring triple-quoted
    string, a JS template literal, a quoted shell string, a shell here-document body, a SQL
    string) counts, blank or not. Every physical line wholly inside a comment or docstring is
    uncounted, blank or not. LF and CRLF content measure identically (the 2026-09-23 CRLF
    phantom-line defect in this module's own history must not return), as does a file with
    no trailing newline. "Total line count" wherever a sibling record compares against it
    (GE-127d-4) uses the SAME physical-line split as this measure.
  - >-
    TOKENIZER DECISIONS, PINNED BY THE IT PO SO THE CODER DOES NOT RE-DECIDE THEM.
    PYTHON — the standard library tokenizer on the RUNNING interpreter; no second lexer and
    no fallback. Docstring = exactly the set Python's own ast.get_docstring recognises (a
    plain or r/u-prefixed string literal, adjacent-literal concatenation included, as the
    first statement of a module, class or function body; an f-string or bytes literal in that
    position is code). Docstring position is read from the token stream, so a file that
    tokenizes but does not parse is still measured (only a tokenization failure is
    GE-127d-3-ii's could-not-measure). A shebang and an encoding line are `#` comments and
    uncounted. JS/MJS/TS/TSX — no stdlib tokenizer exists: a small hand-written lexer
    (states: code, line comment, block comment, single- and double-quoted string with
    escapes and line continuations, template literal with a `${}` nesting stack, regex
    literal with character classes and flags, JSX element/attribute/text/expression-container
    states). A leading `#!` hashbang is a comment; `#` elsewhere is code (private names). JSX
    recognition is on for .js, .mjs and .tsx (`<` at an expression-start position followed by
    a name or `>`), and OFF for .ts, where `<T>expr` is a type assertion. SQL — `--` line
    comments and NESTED `/* */` block comments (PostgreSQL / T-SQL / SQL-standard behaviour),
    '...' with '' doubling, E'...' with backslash escapes, "..." identifiers, and dollar
    quotes `$tag$...$tag$` (tag empty or an identifier not starting with a digit, so `$1` is a
    parameter); `#` is not a SQL comment. SHELL (.sh) — `#` starts a comment only at the start
    of a word (line start or after unquoted whitespace, `;`, `&`, `|`, `(`, `)`), never inside
    '...', "...", $'...', backticks, $(...), here-document bodies, or mid-word (`a#b`, `$#`,
    `${#x}`, `16#ff`); here-documents `<<WORD`, `<<-WORD`, quoted or backslashed WORD, several
    per line, `<<<` here-strings excluded; there are no block comments and no triple quotes.
    The marker-inside-literal behaviour of every lexer, and the dollar-quote and `${}`
    recursion, are GE-127d-3-i's acceptance; this record owns the dispatch, the line rule
    and the comment forms.
  - >-
    PYTHON INTERPRETER POSITION (the question GE-127d-3-ii put to the IT PO). CI runs every
    pytest shard on Python 3.13 (.github/workflows/ci.yml, all setup-python steps; ruff
    target-version py313); this host runs 3.12.3; a consumer install runs the hook under
    whatever `python` its PATH provides, and no minimum version is declared anywhere in the
    package (the gate's own modules already need 3.10 at runtime for `X | None`
    annotations). Nested same-quote f-strings (PEP 701) tokenize only from 3.12. DECISION:
    content the running interpreter's tokenizer rejects is GE-127d-3-ii's INDETERMINATE, with
    the reason naming the running interpreter's major.minor version so the author can see
    why; there is NO fallback measure, because a fallback is a second rule with its own
    comment behaviour. Constructs every supported interpreter tokenizes the same way (a `#`
    inside an f-string's quoted text or replacement-field string) are measured on all of them.
    The lexer modules must import cleanly on 3.10 or later: no unguarded reference to token
    types that only exist from 3.12 (e.g. the FSTRING_* token constants).
  - >-
    HOST, SIZE AND THE DEPLOY. Put the lexers in a NEW sub-package inside
    templates/scripts/commit_guardian/ (declared_files: _file_size_measure/ with one module per
    language family), not in _file_size_ratchet.py and not as more flat siblings:
    templates/scripts/commit_guardian/ already holds far more than file_size's 15-file density
    limit (pre-existing density only warns, but the gate exists to push new modules into
    sub-folders). build_commit_guardian deploys that directory by rglob, so no
    scripts/build_phases.py deploy-map entry is needed; the deployed-copy descriptor below,
    run in a cold process from the shared layout, is the proof — a source-tree test cannot
    see a missing deploy. Every new module must stand at or under 400 measured lines under the
    rule it introduces and every function at or under the configured complexity max_score
    (15). No `.py` file in the sub-package may contain a contiguous `{{config.` literal
    (inject_config rewrites it at deploy time); build such a corpus string by concatenation.
  - >-
    THIS CHANGE MUST PASS THE FILE-SIZE GATE UNDER THE RULE IT INTRODUCES. Measured by the IT
    PO on 2026-10-16 with an approximate token-stream classifier over the worktree (not a
    gate run): _file_size_ratchet.py moves 335 -> 498 and check_file_size.py 312 -> 561 under
    the new rule, almost entirely because each ends in a module-level DECISION HISTORY
    triple-quoted string, which the criteria make code. Rebuild the deployed layout
    (`python scripts/build.py --target-dir .`) before committing so the hook judges the change
    with the new rule, and do not grow either file under it: move the probe/statement
    machinery out to the sub-package rather than adding to them. Converting a file's
    DECISION HISTORY string to the `#` form doc-enforcer §8 already prescribes for new files
    is a legitimate measured reduction, not gaming. The measure must NOT special-case DECISION
    HISTORY (or any string) by name or content — exemptions derive from token position only.
  - >-
    POPULATION CHANGE, MEASURED — RE-MEASURE BEFORE BUILDING AND RECORD IT IN THE TICKET.
    IT PO approximation at 259540316 over 2853 tracked .py files, all of which tokenize on
    3.12: over 400 under the pre-2026-10-16 rule 193, under the new rule 164 (line comments
    stop counting outweighs the strings that start counting); 14 files cross from at-or-under
    to over, 6 of them only because of a trailing DECISION HISTORY string (with those strings
    uncounted the new-rule figure would be 156). .js/.mjs/.ts/.tsx/.sql/.sh were not measured
    here. GE-127d-3-iii keeps the switch from refusing an unchanged file; record the
    implementer's own before/after figures per extension in the ticket.
  - >-
    SIGNATURE EXTENSION — CALL-SITE AUDIT (CLAUDE.md). The shared measure gains the file's
    language/extension. Audit and update every caller in the same change:
    measure_current_length, get_previous_length and resolve_previous_lengths (their DEFAULT
    measure becomes the path-aware code measure), count_added_measured_lines and
    resolve_added_measured_lines (GE-127d-3-iv), describe_measurement_rule and its probes
    (GE-127d-5), and _file_description.extract_python_parts / extract_sql_parts (segment
    measurement with the refused file's own language; a segment that cannot be tokenized
    yields DESCRIPTION UNAVAILABLE per GE-127e-3-i, never a crash and never a changed verdict).
    A caller that passes its OWN measure (check_doc_length via _doc_length_ratchet's
    resolve_previous_lengths(..., measure_doc_lines)) keeps its exact signature and behaviour.
  - >-
    SHARED PLUMBING MUST NOT CHANGE BEHAVIOUR. check_complexity.py imports
    resolve_parent_revisions and PreviousLengthSourceError; _complexity_ratchet.py calls
    get_previous_content; _ac_governance_baseline.py calls resolve_parent_revisions;
    _doc_length_ratchet.py calls resolve_head_matching_paths, resolve_parent_revisions and
    resolve_previous_lengths with its own measure. Their suites must stay green with no edit
    to their tests, and none of those functions' signatures or return shapes may change.
  - >-
    EXISTING TESTS THAT ENCODE THE OLD RULE ARE REWRITTEN, NOT DEFENDED, IN THIS CHANGE. Named:
    GE-127d-2's asymmetry and seam descriptors (see the two test_spec entries covering
    GE-127d-2). Also run the whole unit_tests/commit_guardian/ suite plus
    tests/knowledge/test_native_decision.py's measurement and list every other failure whose
    expectation encodes the pre-2026-10-16 rule (a `#` line counted, a non-docstring
    triple-quoted string or a false /* span discarded) in the ticket, rewritten to the new
    rule; an expectation that fails for any other reason is a regression, not a rewrite.
  - >-
    Must stay linear in file size (no rescanning from the start per line, no catastrophic
    regex backtracking); measuring a generated 10,000-line file of any covered language must
    complete in under 2 seconds.
  - >-
    Must follow the repo error-handling policy: specific exceptions around file I/O and
    tokenization, log at WARNING or re-raise; a tokenizer failure takes GE-127d-3-ii's
    path, never a quoted length of zero or the raw count.
  - >-
    CLOSE THE TWO KIs IN THE SAME CHANGE. KI-CG-20261013 (comment style games the measure) and
    KI-CG-20261009 (/* inside a string opens a false block comment) are resolved through the
    component's known-issues register flow once GE-127d-3 and GE-127d-3-i are green.
test_spec:
  - name: test_ge_127d_3_the_same_comment_text_measures_identically_in_every_style_and_language
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      For every covered extension, generate real files on disk holding N code lines
      and K comment lines, with K carried in each comment style the language has (and
      as a module, class and function docstring for .py, and as a standalone JSX
      `{/* */}` container for .tsx), N and K varied across runs (e.g. N in {2, 37}, K in
      {1, 4, 40}). Pass each file through the shared measure the hook calls and require
      the measured length to equal N for every style, so the number moves with the code and
      never with the comment style. Never assert a hard-coded total.
    must_catch:
      - "the pre-2026-10-16 rule: strip /* */ and triple-quoted strings, count # and // lines"
      - "strip # and // but not SQL -- comments"
      - "strip comments for .py only and count raw for every other extension"
  - name: test_ge_127d_3_blank_lines_count_outside_comments_and_not_inside_them
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      A file with B blank lines between code lines and C blank lines inside a block
      comment or docstring measures N + B, with B and C varied independently; a line of
      code with a trailing comment counts once; the same content with CRLF line endings
      and with no trailing newline measures the same number.
    must_catch:
      - "blank lines dropped everywhere (raw non-blank measure)"
      - "blank lines inside a block comment counted"
      - "a CRLF file's uncounted region leaves a phantom line behind"
  - name: test_ge_127d_3_a_python_triple_quoted_string_that_is_not_a_docstring_counts_as_code
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      A .py file holding an S-line triple-quoted string assigned to a name, another
      holding the same string as a bare expression after the first statement of a
      function, and another holding it as a module-level expression at the END of the file
      (the DECISION HISTORY shape), each measure S lines more than the same file without the
      string, while the same text as the module's, a class's or a function's docstring adds 0;
      an f-string or bytes literal in docstring position adds its lines, as Python itself
      does not treat either as a docstring. S varied.
    must_catch:
      - "every triple-quoted string discarded regardless of position"
      - "a trailing module-level string treated as a docstring"
  - name: test_ge_127d_3_restyling_a_real_workflow_template_leaves_its_quoted_length_unchanged
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      Take the repository's real templates/workflows-js/build-feature.js, rewrite every
      run of `//` lines into one /* */ block (the exact conversion the 2026-10-13 KI
      records), and stage the original and the rewrite in a temporary git repository.
      The hook's quoted length for both versions is the same number, read from the
      hook's own output.
  - name: test_ge_127d_3_the_hook_quotes_the_same_length_before_and_after_a_restyle_only_commit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      Through the registered hook entry point, in a temporary git repository, a staged
      restyle-only change to an over-limit .js file and to an over-limit .py file
      (line comments to a block or docstring) completes, and the quoted previous and
      current lengths in the hook output are equal.
  - name: test_ge_127d_3_the_deployed_measure_has_a_tokenizer_for_every_checked_extension
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      Using the shared deployed layout (shared_layout_reader marker), read
      file_size.checked_extensions from the deployed configuration and, for each extension,
      measure a generated file with one comment in every style of that language in a cold
      subprocess that imports only from the deployed .leafcutter/scripts/commit_guardian/;
      every extension returns a number equal to its code-line count and none falls back to
      a raw count or raises ModuleNotFoundError (the new sub-package reached the deploy).
  - name: test_ge_127d_3_the_refusal_part_breakdown_is_measured_by_the_same_rule
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      Through the hook, refuse an over-limit .py file whose top-level functions carry `#`
      comment runs and non-docstring triple-quoted strings (counts varied). Each part the
      refusal lists has a portion equal to the shared measure applied, at run time, to that
      part's own line range of the file; moving a comment run from one function to another
      leaves every listed portion unchanged.
    must_catch:
      - "_file_description still measuring segments with the old regex rule"
  - name: test_ge_127d_2_the_asymmetry_between_removable_and_non_removable_content_is_legible_from_the_outcome
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    covers:
      - GE-127d-2
    description: >-
      REWRITE IN PLACE, SAME NAME (GE-127d-2's descriptor, superseded rule). Take one refused
      .py file and produce three variants — blank lines outside comments removed, every `#`
      comment removed, every docstring removed. The quoted length moves for the first only;
      the second and third leave it unchanged; the outcome's Measures line lets an author
      predict exactly that. The old assertion (deleting `#` comments moves the number) is
      deleted, not kept alongside.
  - name: test_ge_127d_2_changing_the_rule_in_force_changes_both_what_is_published_and_what_is_quoted
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    covers:
      - GE-127d-2
    description: >-
      REWRITE IN PLACE, SAME NAME. The current mutation (also discard hash comments) is a
      no-op under the new rule, so the descriptor would pass vacuously. Replace it with a
      mutation that still changes one file's length under the new rule — e.g. make the
      in-force measure count `#` comment lines again, or stop counting blank lines — and
      require both the published statement and the quoted length to move with it,
      re-derived independently at run time.
    must_catch:
      - "a mutation that leaves the new-rule length unchanged, so the descriptor passes vacuously"
test_rationale: |
  Every descriptor runs real files through the real measure or the real hook; none greps
  the source. The style-equivalence test is generated across all covered extensions with
  code and comment counts varied, so the only way to pass is a measure in which comment
  style has no effect. The must_catch entries name the incumbent rule first, because the
  incumbent rule is the wrong version most likely to survive a partial fix. The
  build-feature.js descriptor replays the exact restyle that cleared the ratchet on
  2026-10-13 over the real file. The part-breakdown seam exists because _file_description
  is a second caller of the measure that the criteria never name and that silently keeps
  the old rule if the call-site audit misses it. The two GE-127d-2 entries are rewrites
  of existing descriptors whose expectations this decision reverses: one would go red, the
  other would pass vacuously, and both are fixed in this change rather than left behind.
delivers_to:
  - agent: python-coder
    ac_id: GE-127d-3-i
    contract: >-
      The per-language lexer modules under templates/scripts/commit_guardian/_file_size_measure/,
      reached only through the shared measure, whose string, template, regex, JSX, heredoc and
      dollar-quote states GE-127d-3-i's acceptance exercises.
  - agent: python-coder
    ac_id: GE-127d-3-ii
    contract: >-
      A distinct failure signal from the shared measure for content that cannot be tokenized,
      carrying the file's language name and a reason string (and, for Python, the running
      interpreter's major.minor) — never a count of 0 and never the raw line count.
  - agent: python-coder
    ac_id: GE-127d-3-iv
    contract: >-
      For a file's content and extension, the ordered list of its COUNTED lines, each keyed by
      its non-comment text with trailing whitespace stripped, produced by the same tokenizer
      pass that produces the length (len(list) == measured length), for the added-lines diff.
  - agent: python-coder
    ac_id: GE-127d-4
    contract: >-
      The shared measure (content, extension) -> int and the same physical-line split, so the
      backstop's total line count and measured length come from one definition of a line.
  - agent: python-coder
    ac_id: GE-127d-5
    contract: >-
      The single shared measure with the new rule, whose generated description of what
      a quoted length measures becomes the rule the published surfaces and the refusal
      advice must state.
expects_from:
  ac_id: GE-127d-2
  contract: >-
    The one measurement function every caller shares and the published-rule
    derivation built on it; this record replaces the rule inside that function and adds
    no second measure.
