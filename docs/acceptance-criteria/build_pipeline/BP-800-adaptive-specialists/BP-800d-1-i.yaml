criteria: |
  Given the legacy "python-coder" agent template has been manually modified by the user (contains custom project-specific rules appended after a "# User Customizations" marker)
  When the supersession process runs and replaces the legacy template with a generated specialist
  Then the user customization section is extracted and appended to the generated specialist template
  And the generated template clearly separates package content from user customizations with a visible marker
  And the build output warns: "Preserved user customizations from legacy python-coder — review for compatibility"
  And the user's custom rules continue to be loaded when the specialist is dispatched
