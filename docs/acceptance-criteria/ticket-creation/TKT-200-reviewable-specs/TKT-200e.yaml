readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Each premise ships with the command to reproduce it and the result you'd see.

  Every motivating factual claim in a spec ("build X fails", "these tests are
  red", "module Y is missing") is captured together with the exact command that
  reproduces it and the observed result, so a reviewer can check the claim instead
  of taking it on trust. Confirming those claims against a clean environment
  before the ticket leaves the inbox is TKT-200f; re-checking them at dispatch time
  is BO-1900b.
