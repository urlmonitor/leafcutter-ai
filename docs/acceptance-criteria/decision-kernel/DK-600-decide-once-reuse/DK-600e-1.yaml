delivers_to:
  agent: python-coder
  ac_id: DK-600e-2
  contract: 'list[kernel.memory.port.DecisionHit], best text score first, at most memory.max_precedents
    entries: {record: DecisionRecord (sha256 already checked against its index entry), score: float
    0..1 (overlap coefficient of content words, 4 places, >= memory.min_candidate_score), path: repo-relative
    POSIX ''docs/decisions/<id>.yaml'', superseded_by: tuple[str] derived from the index}; approver
    and approval date are record.approval.approved_by / approved_at; hit.superseded is true when any
    later record supersedes it. Empty list when memory is off, the index is missing or nothing matches.'
expects_from:
  ac_id: DK-600d-3
  contract: docs/decisions/<id>.yaml (the staged record's exact text) plus a regenerated docs/decisions/index.json
    entry {id, file, sha256 of the LF-normalised file, title, question, decision_type, selected_option_id,
    selected_option_title, approved_by, approved_at, components, change_target, risk_surface, roadmap_phase,
    file_globs, repository_wide, supersedes, superseded_by}; visible to later runs only after the
    change is merged.
