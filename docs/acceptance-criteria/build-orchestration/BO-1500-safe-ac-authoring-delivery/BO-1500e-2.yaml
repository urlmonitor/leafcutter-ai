created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500e.yaml
criteria: |
  Given the workflow has been installed into a consumer project (deployed copy)
    where the package lives in a subdirectory rather than the dev workspace layout,
  When the user starts /create-ac or /plan-feature there,
  Then the workflow resolves the repository root and the AC store location from
    the actual installed layout rather than assuming the dev workspace paths,
  And the isolated authoring worktree is created relative to the resolved consumer
    repository root,
  And the run completes through delivery in the installed copy the same way it
    does in the dev layout.
depends_on: [BO-1500e, BO-1500a-1]
