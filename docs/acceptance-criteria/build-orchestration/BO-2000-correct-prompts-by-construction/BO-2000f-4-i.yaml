criteria: |
  Given a variant of /build-feature that dispatches a single ticket-supervisor agent to run
    a ticket's phases inline (the pre-rewire anti-pattern) instead of routing through the
    flattened build-ticket driver,
  When the structural regression check runs against it,
  Then the check fails,
  And the failure names that per-ticket phase execution must route through the flattened driver
    and must not be delegated to a single inline supervisor agent.
