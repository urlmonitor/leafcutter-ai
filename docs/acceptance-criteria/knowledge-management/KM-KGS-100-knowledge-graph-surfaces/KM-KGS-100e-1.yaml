criteria: |
  Given one acceptance-criterion file whose frontmatter declares no component
    membership, and one acceptance-criterion file whose frontmatter declares
    components: ["knowledge-management"]
  When each file is validated at commit time
  Then the file that declares no component membership is rejected and its commit
    is blocked
  And the rejection message names that file and states that a component membership
    must be declared
  And the file that declares components: ["knowledge-management"] passes validation
