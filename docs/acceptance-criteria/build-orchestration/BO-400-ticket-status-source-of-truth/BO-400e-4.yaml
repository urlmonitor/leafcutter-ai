    - "ORDER-INDEPENDENCE IS A PROPERTY OF THE DECISION, NOT OF THE FIXTURE. No state accumulated during a run -- a memo, a cache, a running tally, a set of already-seen phases, a batch index -- may influence a later ticket's answer. The observed split correlated with position in the run (ticket 01 refused, tickets 03 and 20 written); an implementation whose answer depends on how far into the run a ticket sits has not converged, it has moved the disagreement somewhere harder to see."
