id: KM-500a-4-i
title: Evaluation drives the research run itself, so needs interpretation and operation selection are measured
component: knowledge-management
components:
- knowledge_management
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-500a-4
criteria: |
  Given a reviewed evaluation case whose question names no operation, for example "Which ACs under GE-118 are still todo?", with the reviewed expected outcome "select the descendant-status operation with root GE-118 bound"
  And the evaluation is configured with a scripted host and a scripted Jev
  When the kernel-path evaluation runs that case
  Then the case starts a research run through the same public start entry point an agent uses, so host needs interpretation and Jev operation selection both execute for that case
  And the case result names the outcome reached, one of clarification, selected_operation, missing_query, unsupported_data, field_gap, unavailable, denied, budget_exhausted, selection_uncertain or unresolved, together with the selected operation identity, its bound arguments and its selection confidence beside the selection gate value in force
  And when the case carries a reviewed clarification reply, the same paused run is continued through the public resume entry point with that reply, and the clarification request and the resumed outcome are each scored against their own reviewed expectation
  And each case result carries the source revision, the catalog version and descriptor digests, the host and Jev identities with their prompt and settings identifiers, the count of host calls and of Jev calls, and the end-to-end latency
  And a case whose run neither finishes nor pauses within its case budget is reported unresolved with the stop reason and stays in the denominator
  And the report states the total, executed, passed, failed, not-run, unresolved and selection_uncertain counts for the run
  And an existing explicit-operation evaluation pack, evaluated again after this change, produces the same verdicts and denominators as before.
depends_on:
