criteria: |
  Work the run is not in a position to judge is named as such, never blamed.

  Some work can only be proved once it has been taken up into the project's own
  history, and a run that checks before that point can never see it succeed. When
  that is the situation, you are told that — plainly, and in time — instead of
  being handed a refusal that reads as though the work itself is wrong. Being
  unable to judge something is an answer you can act on; a misattributed failure
  is not.
