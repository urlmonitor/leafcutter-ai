notes: |
  WHY AN L3 UNDER c-2. The GE-129c notes ask for the committer inventory to be re-measured, not
  trusted. A hand-written list of three is what went stale at step 3.5. Before the reroute
  (GE-129c-1) this check must fail on finalize-feature's closure step naming status-checker --
  that is its first honest finding.

  The "at least" clause rules out an empty walker that passes by finding nothing; the
  varying-population clause rules out a hard-coded list.

  declares_side_effect: false -- the Then clauses assert a list and failures.
