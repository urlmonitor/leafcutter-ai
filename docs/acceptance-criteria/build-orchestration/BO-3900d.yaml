it_requirements:
  - "User decision Q4 (2026-09-14): the check is a unit test only. Its scanning logic is test-support code under unit_tests/ and only unit tests invoke it. It is not registered as a pre-commit hook, a commit_guardian hooks_manifest entry, or a CI step."
  - "The examined set is derived at run time from the directory listing of templates/workflows-js/ (every .js file in it). No script list or count is hard-coded, and the stated examined count comes from that listing."
  - "Only the canonical source directory templates/workflows-js/ is scanned. The deployed .claude/workflows/ copy is not scanned a second time, because its equality is BP-1000e's concern."
  - "The permitted-home exemption is derived from a property of the code: the leading-'/' test sits inside a classification that also recognises drive-letter and UNC forms. It is never derived from a function-name allowlist, so renaming the classification neither breaks nor widens the exemption."
  - "The non-path marker has one documented spelling carrying non-empty reason text, placed on the flagged line or the line directly above it. A marker with empty or whitespace-only reason text is treated as absent."
  - "A failing run reports every finding, each with the script's file name, its 1-based line number and the matched expression text, not just the first finding."
  - "The scanner accepts a target directory, so the seeded-shape and count-derivation tests run against fixture copies and never write to templates/workflows-js/."
  - "The check's tests carry no coverage tag for BO-3900 or for any BO-3900 child other than this record."
  - "A run over the real templates/workflows-js/ directory completes in under 5 seconds."
delivers_to: null
expects_from:
  ac_id: BO-3900
  contract: "After BO-3900 lands, every leading-'/' absoluteness test left in templates/workflows-js/*.js either sits inside a classification that also recognises drive-lettered and UNC forms, or carries a reasoned non-path marker."
test_required: true
test_spec:
  - name: test_every_workflow_script_is_examined_and_the_count_is_derived
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: criterion
    description: "The stated examined count equals the number of scripts in the directory, and adding a temporary script in a fixture copy raises it by one."
  - name: test_each_leading_slash_absoluteness_shape_is_reported_with_script_line_and_expression
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: failure
    description: "A seeded fixture script carrying each of the five shapes fails the check once per shape, naming script, line and expression."
  - name: test_shared_classification_and_reasoned_marker_are_not_reported
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: boundary
    description: "Paired acceptable inputs: the shared classification and a reasoned non-path marker pass, and a marker with no reason is reported."
  - name: test_check_passes_on_the_real_workflow_scripts
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: real_artifact
    description: "Run over the real templates/workflows-js directory after BO-3900, the check passes and states an examined count equal to the directory's script count."
test_rationale: |
  A guard against reintroduction has two ways to be worthless. It can examine a
  hand-written list of files, so the next new script is never looked at. Or it can refuse
  everything, which is discharged by broadening an exemption until it means nothing. The
  derived count with a varying population closes the first. The paired acceptable inputs,
  plus the rule that a reasonless marker does not exempt, close the second. The check is
  text-based on purpose. That is why it is kept out of BO-3900's coverage: this repo has
  repeatedly let source-text assertions stand in for behaviour (KI-BO-028, M1 in
  docs/reference/false-green-mechanisms.md).
