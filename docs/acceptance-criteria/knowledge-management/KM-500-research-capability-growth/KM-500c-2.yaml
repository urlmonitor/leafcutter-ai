criteria: 'Given the original research has obtained results from an existing or newly verified query

  When its existing evidence evaluation decides whether the question can be answered

  Then the answer or evidence bundle cites the actual source revision and retrieved items and states which required
  needs remain unsatisfied

  And a successful build, successful query execution and successful answer assessment remain separate recorded outcomes

  And zero matches, contradictory evidence and insufficient evidence remain distinguishable with their limitations
  intact

  And any bounded synthesis or follow-up uses the existing research policy rather than silently treating query availability
  as answer quality.

  '
