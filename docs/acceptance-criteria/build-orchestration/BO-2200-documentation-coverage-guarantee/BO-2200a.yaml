title: "Documentation is required for every change that matters -- and only those"
component: build-orchestration
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Docs are demanded for user-facing, flow, data, security, and privacy changes.

  The build recognises when a change affects what users see, how a process or flow
  behaves, what data is stored, or how the system handles security, authentication,
  or privacy -- and requires documentation for it. Purely internal refactoring that
  changes nothing observable does not trigger a documentation demand, so you get
  coverage exactly where it counts without busywork on invisible changes.
