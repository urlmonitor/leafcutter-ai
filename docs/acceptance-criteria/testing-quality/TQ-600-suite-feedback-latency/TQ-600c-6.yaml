assigned_agent: documentation-expert
estimated_complexity: M
it_requirements:
  - >-
    SURFACE DECISION, WHICH THE BA EXPLICITLY LEFT HERE: a new page,
    `docs/testing/suite-cost-guard.md`. Verified at enrichment: `check-doc-length`
    refuses a commit in which a file already over the 300-line limit grows, and
    `docs/testing/README.md` is 326 lines — so it cannot absorb this material, and
    even a one-line pointer added there must be offset by at least as many lines
    removed in the same commit. A new file is not growth. The gate is PRE-COMMIT
    ONLY and runs in no CI job, so a violation surfaces as a local refusal only.
  - >-
    THE PAGE MUST BE REACHABLE FROM WHERE THE READER ACTUALLY ARRIVES, which is a
    failed run and not a table of contents. Preferred: the guard's failure output
    names this page's path, and that path is where the page is. Note that this is
    a two-sided obligation and TQ-600c-2's criteria do not currently require the
    guard to name a documentation location — if that pointer is not added, the
    discoverability must be solved another way and the gap must be raised rather
    than absorbed by publishing somewhere only a search will find.
  - >-
    NO NUMBER, AND THE ENFORCEMENT POINT THAT ACTUALLY GATES MUST BE THE ONE
    IMPLEMENTED. The fifth clause is an absence with two possible checks: (a) no
    figure in the guidance equals any value in the declared budget record, and (b)
    no duration literal appears in the guidance at all. While TQ-600c-3 is
    structurally blocked and the record carries no value, (a) is VACUOUSLY TRUE —
    it would report clean over a page quoting an invented number. (b) is the
    load-bearing check and the one that must be built; (a) may be added as well,
    but not instead.
  - >-
    QUOTE THE OUTPUT AND THE FIELD NAMES AS DELIVERED by TQ-600c-2 and TQ-600c-1
    — in particular the separate setup, call and teardown figures per test, which
    is the distinction the third clause teaches and the most actionable fact this
    investigation produced. A paraphrase of a field name sends the reader looking
    for something that is not in the record.
  - >-
    THE UNAVAILABLE RESPONSES ARE STATED AS A PROHIBITION, NOT LEFT OUT.
    Suppressing the guard, and editing the recorded limit without a measurement
    behind it, must both be named as not available. Omission is what lets a guard
    be quietly neutered the first time it is inconvenient, and this repository's
    history is of checks that reported clean forever.
  - >-
    PUBLISH AFTER TQ-600c-1, TQ-600c-2 AND TQ-600c-3 LAND, BUT DO NOT WAIT FOR THE
    BUDGET VALUE. The page states no number, so the absence of a measured baseline
    does not block it — but the derivation procedure it reports must be the one
    TQ-600c-3 actually shipped, not the one intended.
  - >-
    THE NEW PAGE MUST BE COMMITTABLE AND REACHABLE: YAML frontmatter as
    `check-doc-frontmatter` requires, and a link from the doc index. Cross-link
    with TQ-600b-6's material rather than restating it — how to run the suite and
    what to do when its cost guard fails are different questions with one reader.
  - >-
    VERIFY THE GATES FROM INSIDE THE WORKTREE. Commit-guardian hooks resolve their
    target set from the current working directory; invoked with absolute paths
    from elsewhere they examine nothing and exit 0, which is indistinguishable
    from a pass. Use `env --chdir=<worktree>` with worktree-relative paths and
    read silence as "it examined nothing".
delivers_to: null
expects_from:
  - ac_id: TQ-600c-3
    contract: >-
      The derivation procedure as delivered and the location of the recorded limit.
      This guidance reports both and reproduces neither — in particular it never
      restates the number, which is the single constraint that keeps the guidance and
      the guard from ever disagreeing.
  - ac_id: TQ-600c-2
    contract: >-
      The guard's failure output as delivered, including how it names the tests that
      spent the time, so the guidance describes the screen the reader is looking at.
  - ac_id: TQ-600c-1
    contract: >-
      The cost record's location and its named fields, including the separate setup
      and call figures per test, which the guidance teaches a contributor to read.
test_spec:
  - name: test_tq600c_6_the_guidance_states_no_limit_of_its_own
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      No duration literal appears anywhere in the page — no number presented as a
      limit, a baseline, a headroom or a runtime — and, whenever the declared
      budget record carries values, none of them appears in the page either. The
      first half is the one with teeth: while TQ-600c-3 is blocked and the record
      holds no value, the second half is vacuously true and would report clean
      over a page quoting an invented figure. NAMED MUTATION: paste a budget
      figure into the page as an illustration; this test must go RED.
  - name: test_tq600c_6_every_location_and_command_the_guidance_gives_resolves
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: "the locations and commands extracted verbatim from the published page"
    description: >-
      Every repository path the page gives exists, and every command it gives runs
      as written — including the one that shows the reader the recorded limit and
      the one that opens their own run's cost record. NAMED MUTATION: move the
      cost record's directory without updating the page; this test must go RED.
      "Works as written against the repository at the time it is published" is the
      clause, so the test runs it rather than reading it.
  - name: test_tq600c_6_the_page_is_reachable_from_where_a_failed_contributor_arrives
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      The page is linked from a surface the reader reaches at the moment of
      failure — the guard's own failure output where that names a location, the
      testing index otherwise — and the link resolves to the page. NAMED MUTATION:
      publish the page with no inbound link; every content descriptor stays green
      and this test must go RED. A guidance page reachable only by searching the
      repository is reachable by nobody at the moment they need it.
test_rationale: |
  Four of this AC's six clauses are reader outcomes and no descriptor can check
  them: whether a contributor can say where the limit came from, read their own
  record and tell repeated preparation apart from work done inside the test, name
  the responses available to them, and say which one their case calls for. Those
  are verified by a reader trial against the published page, and are recorded as
  such rather than approximated by a check that the right headings are present. A
  page with the right headings teaches nobody and passes every presence check.

  The two mechanical clauses are tested as such. The no-number clause is checkable
  precisely because it was written as an absence, and its descriptor names WHICH
  of its two possible checks actually gates: comparing the page against the
  recorded budget is vacuous while the record has no value, so the check that
  forbids any duration literal is the real one. Building the vacuous half alone
  would be a gate that reports clean over exactly the failure it exists to catch.

  The resolves-as-written clause is tested by running the commands, not by
  matching them, for the same reason TQ-600b-6's are: a location that has moved
  looks identical to one that has not until someone follows it.

  The reachability descriptor is separate from the content descriptors on purpose.
  Everything else here can be satisfied by a page nobody ever opens, and this
  reader arrives from a failed run rather than from a table of contents.
