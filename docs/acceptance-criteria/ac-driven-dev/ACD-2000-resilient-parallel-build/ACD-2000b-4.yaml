it_requirements:
  - "THE RULE IS MISSING, NOT THE DATA. Verified: _build_files_touched (scripts/ac_store/generate_ticket_from_ac.py ~line 497) already derives a requirement's footprint. REUSE it -- a second derivation guarantees that the batching rule and the generated ticket eventually disagree about the same requirement's footprint, and the disagreement will be silent."
  - "EMPTY MEANS CONFLICTS WITH EVERYTHING, AND IT MUST BE AN EXPLICIT BRANCH EVALUATED BEFORE ANY INTERSECTION. A naive set intersection inverts the rule -- the empty set intersects nothing, so 'unknown footprint' reads as 'safe to parallelise'. This is ACD-2000b's single most likely defect and it is invisible in code review because the wrong implementation is the shorter one."
  - "DERIVED-EMPTY IS NOT THE SAME AS NO-FILES, AND BOTH ARE CONSERVATIVE. _build_files_touched reads it_requirements path tokens and doc_links whose relationship is an edit surface; doc_links marked describes or related are excluded. So docs-only requirements, prose requirements and EVERY requirement not yet enriched by the IT PO derive an empty footprint. 'The derivation ran and produced nothing' must never be treated as 'this requirement touches nothing'."
  - "NO EXEMPTION BY IDENTITY. If any requirement is ever excused from the empty-footprint rule, the exemption must derive from a property of the record, never from a hard-coded id or path list -- otherwise new cases silently inherit the unsafe default."
  - "THE FOURTH CLAUSE IS NOT SATISFIABLE BY A PLANNER. Two independent choosers can only avoid overlap through shared state, so the footprint test must be applied against the footprints of the requirements CURRENTLY CLAIMED by other efforts, read at take time -- not merely across the members of one planner's own batch. A planner-local antichain satisfies clauses one to three and fails this one, and that partial pass is the likely outcome if this constraint is not stated. The shared state this needs already exists and is already read: filter_already_claimed (scripts/build_orchestration/fast_lane.py line 490) walks the store and inspects every candidate's work_status. It is a footprint comparison that is missing there, not a place to put one."
  - "RE-VERIFY AT TAKE TIME, mirroring the pre-dispatch re-check the ticket-grain rule already performs (templates/skills/building-epics/SKILL.md ~lines 150-153). The set of claimed requirements changes between planning and dispatch; a check performed only during planning is stale by the time it matters. TAKE TIME IS A NAMED MOMENT, NOT AN ABSTRACTION (verified 2026-09-01): it is the `claim` subcommand handler at fast_lane.py lines 1939-1974, between the filter_already_claimed call (1942) and the claim_build_set write (1954). That is the last read before the store is written, and both happen inside one process invocation, so the footprint check and the take are not separated by an agent round-trip. Put the re-verification there."
  - "DO NOT REWRITE THE TICKET-GRAIN RULE IN THIS CHANGE. templates/skills/building-epics/SKILL.md stays authoritative for tickets until ACD-1800c lands; the two rules run side by side during the migration and must not disagree. Reconciling them is that AC's scope, and the prose surface belongs to a different craft."
  - "PERFORMANCE AND DETERMINISM, STATED AS A PROPERTY OF THE RULE AND NOT OF ANY ONE FUNCTION. The comparison runs over every candidate on every selection or take, so index the store ONCE per call rather than re-walking it per pair. The precedent is _build_ac_id_to_path_index at scripts/build_orchestration/fast_lane.py LINE 123 -- re-verified 2026-09-01; the '~line 71' this bullet used to cite was wrong. It survives as a precedent because it is what the claim-side functions already do: claim_build_set (379), release_claim (467), filter_already_claimed (519), mark_done_built_acs (579) and check_no_stale_todo (630) each take one index and reuse it. Notably select_batch does NOT use it, so the precedent points at the claim path rather than at batch selection. WHEREVER THE RULE LANDS it must stay deterministic: the same store state must always yield the identical ordered result, and adding the footprint test must not make the outcome depend on dict iteration order or on which effort happened to ask first. That guarantee is also documented on select_batch, but it is required here as a property of the rule -- this bullet is NOT an instruction to implement on select_batch, which has no production caller (see the fast_lane.py doc_links relevance note and the 2026-09-01 amendment below)."
  - "THE TAKE-TIME HALF HAS A LIVE HOST; THE BATCH-SELECTION HALF HAS NONE (verified 2026-09-01, and this is the surface decision this record was previously missing). Clause four -- two efforts never concurrently hold requirements whose footprints overlap -- is buildable TODAY against a path every fast-lane run already executes: templates/workflows-js/fast-lane-ship.js line 818 invokes `python3 fast_lane.py claim`, whose handler calls filter_already_claimed then claim_build_set. That path admits or refuses a requirement on ITS OWN work_status alone and never compares footprints, which is exactly the gap ACD-2000b names. Clauses one to three describe choosing N requirements to run at the same time, and NO live surface does that at requirement grain: select_batch is dormant, the live lane resolves ONE connected set and builds it sequentially (fast-lane-ship.js contains zero parallel( calls), and the only real parallel dispatch in the system -- build-feature.js, BATCH_SIZE = 12, await parallel(chunkThunks) -- is TICKET grain and outside this record. So: build clause four on the claim path, where it fires on the next run. Do NOT attach clauses one to three to a dormant surface in order to close the record; if they are built before a requirement-grain dispatcher exists, the intersection helper must be pure and separately tested, and the record must not be marked done on the strength of a rule nothing invokes."
  - "THE PERMISSIVE DEFAULT IS ALREADY PRESENT IN THE LIKELY HOST, so bullet two changes behaviour there rather than adding to a blank surface. filter_already_claimed (fast_lane.py lines 525-536) currently routes a candidate to `to_build` both when its id is absent from the store index and when its YAML cannot be read -- 'unknown' resolves to 'free to build' at the very call site this rule attaches to. An implementer must decide EXPLICITLY, and cover with a test, that footprint-unknown conflicts with everything at this site, and must not let the neighbouring id-unknown default silently supply the opposite answer by proximity. Whether the id-unknown and read-error defaults should also change is a separate question this record does not settle."
  - "Follow the project error handling policy (Ruff E722/BLE001/TRY): typed except around store reads, log-or-reraise, no bare except. A footprint that cannot be derived because of a read error is UNKNOWN, and unknown conflicts with everything -- it must never degrade to empty-and-safe."
delivers_to:
  agent: python-coder
  contract: "Two things, with different maturity. (1) A pure requirement-grain contention test, conflicts(a, b) -> bool: true when the derived footprints intersect, AND true whenever either footprint is empty or underivable. Surface-independent and testable on its own. (2) Its application at take time: a candidate checked against the footprints of the requirements other efforts CURRENTLY hold, wired into the claim path (fast_lane.py's `claim` handler, between filter_already_claimed and claim_build_set) -- the one live surface where the check fires in production today. Consumed by whatever chooses what to build concurrently and by ACD-2000b-5's operator documentation. NOT delivered against select_batch: no production caller invokes it, so a contention test wired only there is delivered to nobody."
expects_from:
