id: DK-200a-4
title: "Later research and handoffs retain the meaning supplied by initial context"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: draft
req_status: draft
priority: high
work_status: done
criteria: |
  Given the request "Can you explain it?" has initial context identifying "it" as the Zephyr manifest,
  When the run proceeds from intent into research, a capability judgment or a host handoff,
  Then the receiving work has the saved context with its provenance and trust limits,
  And repository research uses the supplied Zephyr reference to retrieve manifest evidence,
  And the original request remains unchanged.
depends_on: [DK-200a]
covered_by:
  - "tests/kernel/intent/test_context_enrichment_wiring.py::TestContextEnrichmentWiring::test_conversation_referent_reaches_downstream_research_and_retrieval"
  - "tests/kernel/intent/test_context_enrichment_wiring.py::TestContextEnrichmentWiring::test_native_decision_judgments_receive_the_saved_context"
  - "tests/kernel/intent/test_context_enrichment_wiring.py::TestContextEnrichmentWiring::test_host_artifact_and_host_resume_retain_the_saved_context"
implemented_by:
  - "kernel/capabilities/base.py"
  - "kernel/scheduler/nodes_route.py"
  - "kernel/scheduler/nodes_execute.py"
  - "kernel/capabilities/decision/jev_support.py"
  - "kernel/capabilities/research/planning.py"
  - "kernel/interaction/packets.py"
assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "Native research, native decision judgments and host input artifacts must consume the saved context rather than independently reconstructing facts."
  - "Downstream query hints must retain relevant supplied references without replacing the original request."
  - "Every receiving context representation must distinguish supplied claims, evidence, registry information and authority limits."
delivers_to: null
expects_from:
  ac_id: DK-200a-3
  contract: "EnrichedContext checkpoint value: original_goal:string; caller_context:{host:string|null, capabilities:string[], conversation:string[], observations:string[]}; workspace_id:string; repository_root:string; registered_capabilities:string[]; evidence:{source_id:string, locator:string, excerpt:string, content_hash:string, truncated:boolean}[]; sources_consulted:string[]; files_scanned:integer; limitations:string[]; truncated:boolean; status:gathered|no_evidence|partial|unavailable|disabled. Caller claims and source evidence remain distinct; the saved value is unchanged by provider projection."
test_required: true
test_spec:
  - name: test_conversation_referent_reaches_downstream_research_and_retrieval
    target_dir: tests/kernel/intent/
    framework: pytest
    type: integration
    angle: reachability
    description: "A pronoun request completes with actual Zephyr evidence, while the research batch and repository query hints carry its conversation referent and preserve the original goal."
  - name: test_native_decision_judgments_receive_the_saved_context
    target_dir: tests/kernel/intent/
    framework: pytest
    type: integration
    angle: seam
    description: "A real native decision flow completes with decision.assess batches containing the saved caller context, evidence, goal and trust limits."
  - name: test_host_artifact_and_host_resume_retain_the_saved_context
    target_dir: tests/kernel/intent/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "The actual host input artifact carries the checkpoint's caller context, excerpts, original goal and authority/availability/preference trust limits."
test_rationale: "Each consumer boundary is exercised through a service run and actual batch or artifact; helper-only forwarding tests would miss an omitted call site."
