test_spec:
  - name: test_a_nested_install_declares_the_sink_at_the_consumers_root_not_the_package_subdirectory
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: real_artifact
    surface_invoked: "the build run against a temp target, then the reader's production entry point as a subprocess"
    description: "Build the fixture the criterion names: a consumer repository containing a package subdirectory that is itself a repository with its own repository data. Build with the target at the consumer root, then read the declaration and assert the path is directly under the consumer root and NOT under the package subdirectory. The nested repository is the whole test — in a flat fixture every candidate implementation gives the same answer and the test cannot fail."
  - name: test_the_declared_sink_sits_beside_the_rest_of_the_installs_deployed_content
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "In a workspace-shaped fixture, build with the target at the workspace root and assert the declared sink is under that same root — the root the deployed configuration, agents and scripts were written to — and not under the package sources. Pins the sink to the install rather than to the clone."
  - name: test_a_declaration_whose_directory_is_gone_is_reported_stale_and_not_as_an_empty_sink
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Build into a temp project, then move the project. Run the reader and assert three things: the output says the declared location is not there and names it, the output is distinguishable from the same reader's output over a project where the sink has simply never been written to, and the exit status is one of the existing enumerated statuses rather than a new one. Assert afterwards that neither the declared path nor any directory on the way to it was created."
  - name: test_a_build_pointed_at_an_isolated_working_directory_does_not_silently_split_the_sink
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: seam
    description: "The clause that exists because durability is contingent under this anchor. Build a project, add an isolated working directory, then run the build again with the target at that working directory. Assert EITHER that emitting from inside it still reaches the project's one sink, OR that the second build stated it was creating a separate sink and named the project it divided. Assert that the silent third outcome — a second sink, no statement — fails. Then remove the working directory and assert no record emitted during the run was lost with it."
  - name: test_adopting_the_declaration_does_not_silently_orphan_records_already_accumulating
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "In a fixture where a populated stream already sits at the location records were accumulating in before the change, adopt the declaration with a different location. Assert the run names both locations once. Assert it does not present the new empty location as the whole history, which is the outcome that makes a reader believe the corpus is gone."
  - name: test_the_declared_location_is_obtainable_without_emitting_or_harvesting
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "the resolver's production entry point"
    description: "Ask for the location in a project where nothing has been emitted; assert an absolute path is reported, and assert afterwards that no sink file, no directory holding it, and no record were created by asking. Pairs with INF-400c-4-iv's no-side-effect rule for the reader and applies it to the question this AC adds."
test_rationale: |
  The first descriptor is a fixture-shape argument rather than an assertion
  about a return value, because the anchor's remaining failure mode is that
  every candidate implementation agrees in a flat layout and only a nested one
  separates them. The fourth is the descriptor this AC would be incomplete
  without: under the previous anchor, durability held no matter how a working
  directory was provisioned; under this one it holds only if that working
  directory uses the install whose configuration names the shared root, and a
  rebuild inside it quietly breaks that. A test that never runs the build twice
  cannot see it, and neither can anyone reading a green suite. The staleness
  descriptor asserts distinguishability from the never-written-to case rather
  than asserting a particular message, because the two conditions are
  indistinguishable to a reader by construction — both present as no file — and
  the whole point is that they stop being.
notes: |
  WHY THE CONSUMER'S ROOT IS THE RIGHT ANSWER, stated as a reason and not a
  preference: the records are learnings about the consumer's project, they are
  destined for surfaces the consumer's repository tracks, and the settled
  decision routes learnings through the ordinary pull request flow so they are
  reviewed before they land. All three break if the sink sits inside a package
  subdirectory the consumer updates by replacing.

  WHAT THE BUILD-TIME ANCHOR FIXED, kept so the next person does not re-open
  it. The previous anchor resolved against the repository's common git
  directory. It was dropped for two reasons, both of which this record used to
  have to defend against and no longer does: "the repository" was ambiguous in
  a nested consumer install, and the common directory is reported relative from
  a main checkout and absolute from a working directory, so the obvious
  implementation reproduced the original relative-path defect in exactly the
  layout a developer tests in. The build receives the project root as an
  argument and neither hazard survives that.

  WHAT IT COST, AND IT IS NOT NOTHING. Durability used to be automatic — every
  working directory of a repository resolved to the same place however it came
  into being. It is now contingent on the working directory using the
  configuration that names the shared root. A worktree that symlinks or copies
  the main install inherits the right path; a worktree that has the build run
  inside it gets its own. This repository's own pre-drive checklist discusses
  running the build in a fresh worktree, so this is a live practice and not a
  hypothesis. That is what the fourth criterion and the fourth test descriptor
  are for.

  AN INSTANCE OF THE RELOCATION CLAUSE EXISTS TODAY AND NEEDS AN ANSWER BEFORE
  THIS LANDS — raised, not settled, because it crosses two records. In the
  development workspace the build target is the workspace root, and that root
  has no records directory at all; the operational stream's 33 lines sit one
  level down, under the package clone. So adopting a build-target declaration
  moves the operational stream's declared location away from the file that
  actually holds the history. Nothing is deleted and nothing is touched — but
  INF-400c-4-iii requires that every existing reader of the operational stream
  return identical results before and after, and a reader pointed at the
  declared location would find an empty file while the populated one sits
  unread beside it. That clause and this anchor cannot both be satisfied by
  doing nothing. Three answers are available and all are outside this record:
  declare the operational stream at the location it already occupies, point the
  development build at the clone, or accept the move and amend INF-400c-4-iii's
  identical-results clause with the reconciliation stated. This criterion only
  requires that whichever is chosen, the difference is named once rather than
  discovered by someone wondering where the history went.

  BOUNDARY, three ways. INF-400c-4 owns the declaration and the parity check.
  INF-400c-4-iv owns a sink that has never been written to, which is a no-work
  outcome in every shape and is not restated here — this record's staleness
  clause exists precisely so that outcome does not absorb a broken install.
  This record owns which project the sink belongs to and when that answer goes
  wrong. Nothing here reopens INF-400c-4-ii: the relocation clause requires the
  difference to be STATED, not the records to be carried anywhere, and the
  retained corpus stays at rest under INF-700c-2 wherever it sits.
change_target: code
risk_surface: contract_boundary
