risk_surface: contract_boundary
it_requirements:
  - "THE READ MUST BE PERFORMED BY THE LAYER THAT NEEDS THE VALUE, from the recorded source, with no dispatch in the path. This is testable only by removing the ability to dispatch — an assertion on the returned value cannot distinguish a direct read from a relay that happened to return the right thing."
  - "THE FIXTURE MUST BE AT OR ABOVE THE REAL FAILING SIZE (130 KB), per CLAUDE.md 'Real-artifact behavioral spot-check'. A smaller fixture passes on an implementation that still relays, because the truncation only appears above the transport's limit. Prefer exercising the repository's ACTUAL registry file over a synthetic one of the same size."
  - "The fixture must contain a value that survives only if the whole source is read — placed beyond the truncation point and, ideally, immediately after an escape sequence, because the anchor case failed by splitting one."
  - "THE ASSERTION MUST REACH THE OUTCOME, not stop at the parsed value. The third criterion is about the build PERMITTING the action; a test that asserts the value parsed correctly passes on a downstream branch that still refuses."
  - "A read that fails must produce BO-3200e's `undetermined` outcome, not a substantive verdict. This is the other half of KI-BO-018 and it is not fixed by reading directly — a direct read can also fail."
  - "The source location must be resolved the way BO-3200a-1-i requires (see that AC), not by an upward walk from the process's starting directory."
  - "No new caching layer between the source and the reader. A cache is a second copy, and a value read from the wrong copy is the same defect as a truncated one."
  - "Coverage must use unit_tests/_workflow_engine_harness.py so the no-specialist-available environment can be produced by withholding the dispatch surface from the real workflow."
delivers_to:
  - agent: python-coder
    contract: "A direct source-read resolver for project facts: given a fact identifier, returns {value: Any, outcome: 'read' | 'undetermined', source_path: str, looked_in: list[str]} with no dispatch in its call path. BO-3200a-1-i constrains how source_path is resolved and what `looked_in` must contain; BO-3200a-2's sweep asserts every fact-resolving path uses a resolver of this kind."
expects_from: null
test_spec:
  - name: test_bo_3200a_1_fact_resolves_with_dispatch_impossible
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: "THE DISCRIMINATOR. Run the real entry workflow under the harness with the dispatch surface withheld entirely; assert the fact is obtained, its value is correct, and the workflow proceeds. Only a build that no longer relays can pass."
  - name: test_bo_3200a_1_value_beyond_the_truncation_point_is_read_whole
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Source of at least 130 KB with the needed value placed after the 75,000-character mark and immediately following an escape sequence; assert the resolved value is complete and the decision made from it matches the decision made from the source read whole."
  - name: test_bo_3200a_1_permitting_value_produces_a_permit_not_a_refusal
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: "Assert the OUTCOME, not the parsed value: a recorded value that should permit the action results in the workflow permitting it. Ties the AC to the observed damage — a false refusal that halted the canonical entry path."
  - name: test_bo_3200a_1_unreadable_source_is_undetermined_not_a_refusal
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: "With the source unreadable, assert the outcome is `undetermined` and that the workflow does not emit a substantive claim about the permission. The other half of KI-BO-018, which reading directly does not fix."
  - name: test_bo_3200a_1_resolver_has_no_dispatch_in_its_call_path
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: "Assert zero agent() calls are recorded by the harness while the fact is resolved. A resolver that falls back to a dispatch when the direct read is slow or fails would otherwise pass every value assertion."
test_rationale: |
  "Reads the fact directly" is a claim about HOW, and no assertion on the returned value can
  distinguish it from a relay that returned the right thing — which a relay does most of the
  time. Removing the ability to dispatch and requiring success is the only shape that can only
  be passed by a build that no longer relays. It is the same technique BO-3100c-4 applies to
  the dispatch-mode option.
  The 130 KB fixture size is not a round number: it is the real failing size from KI-BO-018,
  and a smaller fixture would pass on the broken implementation because the truncation only
  appears above the transport's limit. Placing the needed value after an escape sequence past
  the truncation point reproduces the exact way parsing failed.
  Asserting the permit outcome rather than the parsed value is what ties this AC to the damage —
  a halted canonical entry path with no fallback.
