notes: |
  WHY THIS IS ITS OWN RECORD RATHER THAN PART OF BO-2400c-1-vi. That record's own
  it_requirements say so explicitly: a .md reference page is documentation-expert's
  surface, and config/agent_registry.json gives python-coder .py and .js only. So -vi was
  authored NOT to include the doc, and its implementer was instructed to report the
  divergence so a companion record could be raised. This is that record. Keeping them
  separate also keeps the sign-offs attributable: if the page drifts again, the history
  says whether the code change or the documentation pass was responsible.

  A SECOND DEFECT WAS FOUND WHILE SCOPING THIS, AND IT DOES NOT COME FROM -vi.
  The page's "Related Knob: Cache TTL" section describes an extended 1-hour cache TTL
  "configured in the API or harness layer (AC BO-2400c-2)". That was already false before
  the layer removal. Verified twice — 2026-08-18 during the BO-2400c-2 re-spec, and again
  2026-08-26 while scoping this record — the string cache_control appears nowhere in
  scripts/, templates/ or config/; the cache breakpoint is a literal HTML comment inside a
  prompt string, a textual convention rather than a provider cache-control block; and
  leafcutter never issues the model API call, so there is no request on which a TTL could
  be set. BO-2400c-2 itself was re-specified from configuration to MEASUREMENT and now
  asks for a context-reuse statement on the drive's terminal record.

  So the page cites a criterion for a claim that criterion no longer makes, about a knob
  that does not exist. That is a different and worse failure than the signature drift: the
  signature drift is a page that has fallen behind, while the TTL section is a page that
  was never right. Both are in scope here because a reader does not distinguish them — they
  are on the same page, under the same title, and one lends credibility to the other.

  WHAT THIS RECORD DELIBERATELY DOES NOT DO. It does not touch the code. It does not
  re-open whether the two layers should have been removed. It does not rewrite the page
  into an explanation of the 87% duplication — that framing belongs in an explanation doc
  if anyone wants it, and should be raised separately rather than smuggled into a reference
  page under the genre guard.
