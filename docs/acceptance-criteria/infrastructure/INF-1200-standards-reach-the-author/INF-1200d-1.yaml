notes: |
  THIS IS THE SECOND AXIS OF THE GRID AND IT IS THE ONE THAT MAKES THE CAPABILITY WORTH
  BUILDING RATHER THAN PATCHING. INF-1200c generalises across specialists by walking the
  ownership record; this generalises across standards and across time by walking the
  standards declaration. The user asked for their example to work. The value is that the
  standard AFTER their example works too, without them asking.

  THE ACCEPTANCE SHAPE WITH TEETH, RESTATED AS THE ARMS ACTUALLY WRITTEN. "The standards
  that exist today all reach their audiences" is a snapshot and is satisfied once, by
  hand, permanently. What discharges this record is a standard that did not exist when
  the delivery was built reaching its audience with the delivery untouched. Every arm is
  therefore stated over a standard the implementation has never seen.

  THE WITHDRAWAL ARM IS NOT SYMMETRY FOR ITS OWN SAKE. An implementation that
  accumulates — that adds each newly seen standard to a growing store and never removes
  one — passes the arrival arms indefinitely and quietly holds standards the project has
  retired. A specialist held to a rule the project no longer declares is being misled by
  the very mechanism built to inform it, and no other record in this tree can see it:
  INF-1200f compares two surfaces for a standard that still exists, and INF-1200e counts
  specialists that were told too little, never too much.

  THE COUNTING ARM IS DELIBERATELY A COUNT AND NOT A LIST. "Rose by exactly the number
  newly declared" fails on an implementation that carries one of the two, and it fails on
  one that carries the new standards to everybody. A list of expected recipients authored
  by the test would pass both.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift
  it verbatim into a test descriptor.

  MUTATION: carry outward only the standards named in a fixed enumeration compiled when
  the delivery was built — one entry per known standard, which is the shape the project
  already has, one entry larger. Under that injection:
    - the first arm must go RED, because a newly declared standard is not in the
      enumeration and does not arrive;
    - the two-new-standards counting arm must go RED, because the count does not rise;
    - the withdrawal arm must go RED, because a withdrawn standard named in the
      enumeration keeps arriving;
    - every arm of INF-1200c-1 must STAY GREEN, because the audience for the standards
      the enumeration does know is still derived from the ownership record.
  All four outcomes must be observed together and all must revert. The green outcome is
  the whole reason c and d are separate L1s: this mutation is the current state of the
  project one value larger, it satisfies the specialist axis completely, and only this
  record can fail on it.

  MEASURED, 2026-09-09, IN THIS WORKTREE. Three standards besides the size one are
  already fully configured with thresholds of their own — one for how tangled code may
  get, a separate one for database code, and one for how crowded a folder may become. No
  specialist anywhere is told any of their figures. They are simultaneously the concrete
  "guardrails we add later" case and INF-1200e's silent-gap case, which is why the two
  records cite the same evidence from different sides. Note the fence: making them RUN is
  BP-1600a-2's, and they matter here only as an audience that has never been addressed.

  DELIBERATELY NOT NAMED IN THE CRITERIA: any kind of file, any specialist, any standard
  by name, and any figure.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. The mutation
  above, including which arms must stay green, is written to be turned directly into test
  descriptors.
