assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "When ast.get_docstring returns None for the module (no docstring at all), the declaration check must NOT emit its own missing-docstring finding — docstring PRESENCE is GE-100's floor; this check only asserts that an existing docstring names a resolvable component. Layer on top; do not double-report the same defect."
  - "Once a docstring exists and names a registered component, apply the normal satisfied path (second scenario) — the no-docstring branch is a suppression of THIS check's finding, not a permanent exemption for the file."
  - "Same in-process ast parse over the staged blob; no MCP. Edit templates/commit-guardian/ source AND scripts/commit_guardian/ deployed copy together; verify via build.py round-trip (ADR-001)."
delivers_to: null
expects_from:
  ac_id: GE-117a-1
  contract: "The per-file module-component verdict whose no-docstring boundary vs GE-100 this edge case defines"
