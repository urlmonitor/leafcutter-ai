id: ACD-200b-1
title: "IT PO v3 template contains documentation AC validation gate"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given templates/agents/it-po-v3.md is the IT PO v3 agent template,
  When the template is read,
  Then it contains a section titled "Documentation Gate" (or equivalent),
  And that section instructs the IT PO to check for documentation ACs
    before setting readiness: reviewed on any AC batch,
  And the check criteria are:
    - If any behavioral AC in the batch introduces a new command:
      require a how-to guide AC (assigned_agent: documentation-expert)
    - If any behavioral AC introduces a multi-actor flow:
      require a sequence diagram AC (assigned_agent: architecture-diagram-author)
    - If any behavioral AC introduces a state machine:
      require a state diagram AC (assigned_agent: architecture-diagram-author)
    - If any behavioral AC introduces a new architectural component:
      require a component diagram AC (assigned_agent: architecture-diagram-author),
  And if no documentation ACs are found for a triggered category,
    the IT PO must add them before promoting,
  And the section states: "Batches without documentation coverage for triggered
    categories MUST NOT receive readiness: reviewed."
depends_on: [ACD-200b]
