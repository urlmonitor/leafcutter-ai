change_target: pipeline
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_unwritable_declared_stream_blocks_before_any_dispatch
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Scenario 1. A temp install whose real knowledge_sink.json declares an absolute operational_log_root outside the worktree; the real location query (sink_resolution.py --print-location telemetry) is run and prints the stream path; that stream file exists and is made non-writable. build-epic.js runs under the E2 harness over an epic with one ready ticket. Asserts the terminal payload is { status: 'blocked', sink_unreachable: true } with sink_path equal to the path the query printed, zero ticket-supervisor / phase agent() dispatches, and every ticket file's frontmatter byte-identical before and after (no in_progress). Skips when run as root, where chmod cannot make a file unwritable."
    must_catch:
      - "warn-only gate that logs the failure and continues to dispatch"
      - "gate placed after the first parallel() batch"
  - name: test_block_message_names_printed_path_and_writability_remediation
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Scenario 1. Same unwritable-stream run: the operator message contains the exact absolute path the location query printed and a remediation telling the operator to make that stream writable; it does not contain debugging/logs/agent_telemetry.jsonl as a relative path."
  - name: test_missing_declaration_blocks_with_rebuild_and_creates_nothing
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Scenario 2, non-zero exit. The temp install has no knowledge_sink.json, so the real location query exits non-zero. build-epic.js under E2 returns blocked with sink_path null and a remediation naming 'rebuild', makes zero dispatches, and a recursive snapshot (paths + mtimes) of the worktree and of the would-be log root's parent is identical before and after the run."
    must_catch:
      - "fall back to <worktree>/debugging/logs/agent_telemetry.jsonl when the query fails"
      - "treat a failed location query as a pass"
  - name: test_empty_location_output_is_an_unusable_declaration
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Scenario 2, exit 0 with empty stdout. The resolved location query is a stand-in that exits 0 and prints nothing (the shape of a deployed sink_resolution.py older than INF-500d-4-iii). The gate blocks with 'rebuild', makes zero dispatches and creates no file or directory (snapshot unchanged)."
    must_catch:
      - "check only the exit code of the location query"
  - name: test_stale_enduring_root_blocks_with_rebuild_and_is_not_recreated
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Scenario 2, stale root. A real declaration is written, then its enduring root directory is deleted; the real location query is run and its printed path recorded. The gate blocks with a message stating the location is stale and naming 'rebuild', makes zero dispatches, and afterwards the enduring root still does not exist and the snapshot of its parent is unchanged."
    must_catch:
      - "mkdir -p the full printed path, resurrecting the deleted enduring root"
  - name: test_refusal_never_writes_to_the_workspace_relative_telemetry_path
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "Scenario 2, no fallback. Across the missing, empty and stale declaration runs, <worktree>/debugging/logs/agent_telemetry.jsonl and <worktree>/debugging/ do not exist after the run, while a control run with a pre-created writable <worktree>/debugging/logs/ still blocks (the relative path being writable must not turn the refusal into a pass)."
    must_catch:
      - "probe the workspace-relative path debugging/logs/agent_telemetry.jsonl"
  - name: test_sink_gate_runs_from_build_epic_top_level_body_before_dispatch
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: reachability
    description: "The block is produced by executing build-epic.js's own top-level body under the E2 harness, not by importing or calling the probe helper directly: the harness records the location-query subprocess call, records no agent() dispatch after it, and the workflow's returned payload is the block result."
  - name: test_deployed_build_epic_js_hard_blocks_on_unwritable_stream
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: deployed
    description: "Using the shared_reference_layout fixture (marked shared_layout_reader), runs the DEPLOYED build-epic.js and probe helper under the E2 harness against an unwritable declared stream and asserts the same blocked payload and zero dispatches, proving the template change reached the deployed copy."
test_rationale: >-
  The gate's whole value is that it refuses before dispatch, so every test drives
  build-epic.js's real top-level body under the E2 harness and observes dispatches
  and the terminal payload; a direct helper test would pass on a helper the
  workflow never calls, the phantom-done shape the repo CLAUDE.md warns about.
  The probe target is always obtained by running the real location query against
  a real temp declaration (never a hard-coded path), because the defect this AC
  fixes (KI-BO-20261009) was a probe that pinned a relative path. The empty-stdout
  case uses a stand-in query only because a real current query cannot produce
  that shape. Refusal tests assert a before/after filesystem snapshot, since
  "creates no file and no directory" is a negative claim only a snapshot can
  check. No test greps build-epic.js or build-feature.md text.
