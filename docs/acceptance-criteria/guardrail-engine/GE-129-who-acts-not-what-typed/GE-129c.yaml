criteria: |
  Automated runs still save their work, without a password to do it.

  Every unattended run that legitimately commits -- a fast build, a supervised
  ticket, closing out a finished feature -- still commits, because it hands the
  commit to the commit specialist. A run that tries to commit any other way stops
  and says so, instead of committing or quietly skipping the step.
