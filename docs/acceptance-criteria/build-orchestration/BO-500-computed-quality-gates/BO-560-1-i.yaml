title: "Work agent with missing produces trait causes chain computation to fail gracefully"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket assigns work agent "new-experimental-agent"
    and that agent's registry entry does NOT have a "produces" field
    (e.g. because it was added before BO-510 was implemented),
  When ticket-supervisor attempts to compute the agent chain,
  Then it does NOT silently default to any produces value
  And it does NOT dispatch any agents
  And it rejects the ticket with status: blocker
  And the blocker payload includes:
    blocker_summary: "Work agent 'new-experimental-agent' is missing the 'produces' field in agent_registry.json"
    resolution: "Add a 'produces' field with a valid enum value to the agent's registry entry"
  And the ticket status is set to "blocked"

  Given the produces field is then added to the agent's registry entry,
  When ticket-supervisor retries the ticket,
  Then it reads the newly-added produces value
  And it computes the agent chain without error
  And the ticket proceeds through the computed chain
