notes: >-
  MEASURED IN THIS WORKTREE AT 468e0490f, 2026-09-07, AND TREAT EVERY NUMBER HERE AS AN
  OBSERVATION WITH A DATE ATTACHED RATHER THAN AS A REQUIREMENT. The hook directory holds
  thirteen files, all Python, all carrying an executable entry point, and the directory is
  flat — no subdirectories. The shipped settings surface wires eleven of them across four
  matcher groups over two tool-call events. Two are executed by no entry:
  check_ticket_no_branch_move.py and check_ticket_state_integrity.py. Both are installed by
  the build, so both reach consumer projects; both carry unit tests under tests/; both are
  green; neither has ever run. The counting rule that produced these figures is "every file
  listed beneath the hook directory" on the disk side and "the last script token of the
  command each configured entry executes" on the wired side. No number in this paragraph may
  be written into criteria or into a test assertion — BP-1600a-1-i requires the census to
  STATE its populations in every run, and a number the census prints from what it examined
  cannot go stale while a number written into a requirement can only go stale.


  WHY THIS SURFACE AND NOT ONLY THE OTHER ONE. Two registration surfaces exist in this
  project and until now only one has been counted. BP-1600a-2 owns the commit-gate scripts
  against the gate registry; GE-120c-6 sweeps the same directory against the deployed commit
  registry; both are scoped, by their own first clauses, to where the commit-guardian check
  scripts live. Nothing has ever compared the harness hook directory against the settings
  surface. That is not a small omission: the worked example of the entire M9 family in
  docs/reference/false-green-mechanisms.md is a guard in THIS directory — registered,
  correctly wired, running on every edit, and unable to refuse, because three of its four
  gated prefixes resolve out from under themselves through the installed-tree symlinks and
  the fourth names a directory this project does not have. The poster child for a guard that
  cannot fire sits on the one surface no census examines.


  WHAT THIS RECORD DOES NOT DECIDE, STATED SO IT IS NOT DECIDED BY ACCIDENT. The census
  reports; the disposition of each reported script stays open and is owned elsewhere. One of
  the two scripts it will name on its first run already has an approved disposition and it is
  NOT registration: GE-122a-2 requires its detection to be extracted into the shared
  uniqueness pass, and records it as verified never to have run. The other is named in
  GE-122e-2 as "registered nowhere, so it will not fire today", together with the reason
  wiring it is a sequencing decision rather than a free one — it blocks a tracked move of a
  work-item file on a non-main branch, which is exactly what that repair performs. A census
  that demanded registration would contradict one approved record and break another. Hence
  the third state in BP-1600a-1-iii, and hence the clause there forbidding the census to state
  what should be done with a script it reports.


  HOW IT LANDS: BLOCKING, WITH DAY-ONE TRIAGE IN THE SAME CHANGE. The recommendation carried
  over from the sibling surface's analysis applies here unchanged and is repeated because the
  bootstrapping question is sharper on this surface — these hooks run on every tool call, so
  a census that lands blocking and stays red risks wedging ordinary work. Two tempting
  answers are both refused. Report-only, exiting zero, is the defect class being fixed: a
  check that reports and passes is what every precedent in the known-issues register actually
  shipped. A pinned allowlist of today's two names is suppression wearing a ratchet's
  clothes, and it also silently exempts the third script the day it appears. The answer is
  the third: land it failing, and triage the whole reported set in the same change through
  the grounded records of BP-1600a-1-iii, whose grounds must cite the record that owns each
  script's fate. Two scripts is a small enough set for that to be realistic, and both already
  have owning records to cite. IF THE SET TURNS OUT LARGER ON THE DAY, take the set from the
  census's own first run and do not resolve the difficulty by weakening the census.


  MUTATIONS FOR THE ABSENCE-ASSERTING CLAUSE. "A script an entry executes is not reported at
  all" is green on arrival by construction, because today nothing is reported at all.
  MUTATION: build the wired set by matching bare filenames against the raw text of the
  settings surface rather than against the script each command executes. Under that injection
  a script named anywhere in the document — a permission entry, an unexecuted value, a
  comment — counts as wired, and the clause must fail and then return to green on revert. The
  injection is not hypothetical: on this surface the scripts are named inside shell command
  strings, so a substring search is the natural first implementation and it returns the right
  answer today.


  PARENT AND CAPACITY — A REAL PROBLEM, RECORDED RATHER THAN QUIETLY SOLVED. BP-100n is the
  honest parent: its own sentence is "a guard that finds nothing where something should be
  says so, instead of passing", and its criteria say that an empty result "looks, from inside
  the guard, exactly like there is nothing here to check" — which is this census's fail-closed
  requirement verbatim, and BP-1600a-2 is the sibling census already living there. BP-100n was
  at its five-L2 cap when this record was written, so this record makes it six and the
  child-limit guard will report it. NO child_limit_override WAS ADDED. That was deliberate:
  raising an override to silence a guard, in a record whose entire subject is guards that were
  silenced, is the wrong instinct even when the override is a sanctioned field. Two remedies
  exist and the choice is the user's. The precedent in this family is a SPLIT — BP-100k was at
  eight children on a live override and was split into BP-100k plus BP-100n, discharging the
  override rather than raising it, and GE-120f chose a new L1 over a sixth child for the same
  reason. If BP-100n is split, this record and its three children RENAME, because the
  child-limit and parent-link guards derive a parent from the id string rather than from
  covered_by. The alternative is an explicit override on BP-100n with a stated ground. Until
  one is chosen, the cap finding is left visible on purpose.


  RESOLVED, 2026-09-07 — THE SPLIT WAS CHOSEN AND THIS RECORD IS ON THE OTHER SIDE OF IT. The
  paragraph above is left standing as the reasoning that was offered, not because it is still
  the live state. The user chose SPLIT. No override was added anywhere, and BP-100n's five
  remaining children put it back at its cap rather than over it. This record and its three
  children were renamed from BP-100n-6/-i/-ii/-iii to BP-1600a-1/-i/-ii/-iii and moved to
  BP-1600a, exactly as the paragraph predicted a split would require.

  ONE THING THE PARAGRAPH GOT WRONG, AND IT MATTERS FOR THE NEXT PERSON. It assumed the split
  would produce a new L1 SIBLING under BP-100. It cannot: BP-100 carries
  child_limit_override: 13 and has exactly 13 active L1 children, and its own amendment note
  states the waiver "is left at exactly the current count, so the next L1 added to BP-100
  trips the gate and forces this conversation rather than sliding under a margin". A sibling
  L1 would have been that next L1, so the only ways to place one were to raise BP-100's
  override — the same instinct this record declined — or to give the new L1 a new L0. The
  latter was chosen: BP-1600, following the precedent BP-1300 set and documented in its own
  notes when it was placed outside BP-100 for this identical reason.

  WHY THE OTHER TWO CLUSTER MEMBERS DID NOT COME. BP-100n-3 and BP-1600a-2 share this record's
  rule and belong under BP-1600a on the merits. BP-100n-3 is work_status done with covers-tags
  in scripts/build_phases.py and a test file named after it; renaming it would break an
  evidence chain inside a structural move. BP-1600a-2 is cited from roughly sixty places, and
  the open, unmerged PR #726 adds five more from a branch that cannot be edited from here.
  BP-1600a's notes carry the migration path and its precondition. Both remain under BP-100n
  for now, which is why the absence-reporting parent still hosts two population records.


  ADJACENT RECORDS THAT MUST NOT BE CLOSED AS DUPLICATES OF THIS ONE, OR IT OF THEM. BP-1600a-2
  owns enumeration on the commit-gate surface. GE-120c-6 owns the deployed-registry sweep of
  the same directory. GE-120f owns whether a guard in any set can refuse. GE-126d-3 owns the
  single declaration of registration legs that a settings leg should be added to. TQ-500a owns
  the substitute-falsifiability machinery this record's injections use but must not rebuild.
  Five neighbours, none of them sufficient, and the two scripts this census names are the
  proof: they are enumerated by nothing, swept by nothing, have no refusal to demonstrate
  because they never run, were never taken through a registration procedure, and are covered
