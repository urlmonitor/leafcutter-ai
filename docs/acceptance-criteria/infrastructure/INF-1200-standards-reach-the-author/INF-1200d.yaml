  - injection_builder
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  New standards travel on their own — nothing has to be rewired to carry them.

  When your project starts holding work to a standard it did not hold it to
  before, everyone that standard applies to learns it as part of adding it.
  There is no separate step in which someone has to remember to pass it on, and
  no way for a standard to be in force while its audience has never heard of
  it.
