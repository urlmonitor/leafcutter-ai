it_requirements:
  - >-
    NO DISCRIMINATOR FOR WHAT COUNTS AS A HOOK SCRIPT — DECIDED DELIBERATELY, AND THIS IS
    A DEVIATION FROM THE SIBLING CENSUS THAT MUST NOT BE SILENTLY UNDONE. BP-1600a-2's
    surface needed a predicate to separate gates from helper modules, and the winning one
    there was an executable entry point. Measured on this surface at 468e0490f: the hook
    directory holds thirteen files, all thirteen are Python, and all thirteen carry an
    executable entry point — so that predicate admits the entire directory and discriminates
    nothing today, while excluding, tomorrow, any hook that runs its work at module level
    without one. The population here is therefore every FILE listed beneath the hook
    directory, with no predicate. Directory membership is the whole contract of this place:
    the build enumerates every file in it and installs each one. An over-inclusive
    population produces a report that names something which turns out not to be a hook,
    which is noisy and safe and is disposed of through the grounded record in BP-1600a-1-iii;
    an under-inclusive population produces "nothing unwired, all clean", which is the defect
    class this record exists to police. If a future implementer wants a predicate, the
    burden is to show it cannot exclude a real hook.
  - >-
    BOTH SIDES ENUMERATED AT RUN TIME, AND NEITHER MAY BE A LITERAL. The disk side by
    listing the hook directory recursively; the wired side by reading the shipped settings
    surface and extracting, from each configured entry, the script its command executes. A
    frozenset of known filenames, a hard-coded expected total, or a hand-maintained pattern
    list reproduces the exact defect one level up — which is how the sibling surface's
    incumbent guard fails. The decisive descriptor is the added-script one: add one file,
    and the reported set must contain it while the stated examined-count rises by exactly
    one, both read from the census's own output.
  - >-
    THE LISTING IS RECURSIVE EVEN THOUGH THE DIRECTORY IS FLAT TODAY. Verified at
    468e0490f: the hook directory contains no subdirectories. Recursion therefore costs
    nothing now and is required anyway, because the sibling surface learned this the
    expensive way — its subdirectory held five gate scripts, three of them live and one
    invoked by nothing, and a non-recursive population silently excused all five. Identity
    is the path beneath the hook directory for the same reason recursion forces it there:
    two files with one basename at two positions are two members.
  - >-
    HOST AND LAYERING ARE OPEN AND MUST BE DECIDED BEFORE IMPLEMENTATION, NOT DURING IT.
    Three candidate homes exist and they are not equivalent: a commit-time gate beside the
    sibling census (which examines a surface the commit path does not read, but is where a
    reader will look for it); a build-time check inside the phase that already enumerates
    every file in the hook directory to install it (which holds the disk-side population
    already, and whose findings a consumer sees at install time); or a portability sweep
    beside the harness that runs deployed checks out of process. Whichever is chosen, the
    two populations must be produced by ONE callable that a second caller can consume
    without re-deriving them, so a future gate consumes this verdict rather than growing a
    third enumeration of the same directory.
  - >-
    THE CENSUS MUST NOT BE DEFEATED BY THE MECHANISM THAT DEFEATED ITS OWN EXEMPLAR. The
    installed hook directory and the installed settings surface are reached through
    symlinks into the installed tree, and resolving a path through them is precisely what
    makes the M9a guard on this surface unable to match anything. A census that compares
    resolved real paths on one side against unresolved declared paths on the other will
    find nothing in common and report every script as unwired — the mirror-image false
    positive, and the one whose natural remedy is switching the census off. Decide the
    resolution rule once, apply it to both sides, and state it in the run's output.
  - >-
    PACKAGE SURFACE — CONSIDERED AND NOT DECLARED. The registries the package-surface
    declaration hook watches are the agent registry, the skill registry, the paths registry
    and the commit-guardian registry. The settings surface is none of them, and this record
    adds no id to any of them. If day-one triage wires a script by adding an entry to the
    settings surface, that still touches no watched registry. Re-check this if the
    implementation lands the grounded register of BP-1600a-1-iii inside the commit-guardian
    registry rather than beside the settings surface; that choice would change the verdict
    and the record must be amended before it is built.
  - >-
    DEPLOY-MANIFEST BOUNDARY. Files in the hook directory are installed into the harness's
    hook directory by the build, and commit-guardian scripts into a different installed
    location. Any module the census imports must be present in whichever installed layout
    the census actually runs from, or it raises a missing-module error at run time while
    unit tests importing from the source tree stay green. This is the repository's most
    frequently repeated deployment defect and the deployed descriptor exists to make it
    visible rather than latent.
  - >-
    CANONICAL VERSUS BUILD OUTPUT. The template directory is canonical and the installed
    tree is a build output the build overwrites. Edit the template and re-run the build. A
    fix applied only to the build output disappears on the next build; a fix applied only
    to the template leaves the running configuration unchanged and the work unverified.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around
    directory listing and around reading and parsing the settings surface; log at WARNING or
    higher or re-raise; no bare or blind excepts. A swallowed listing error must never
    become an empty population — that is the precise fail-open shape BP-1600a-1-i exists to
    make impossible.
test_spec:
  - name: test_bp_100n_6_added_hook_script_is_reported_and_the_examined_count_rises_by_one
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: >-
      THE DECISIVE ANTI-LITERAL DESCRIPTOR — WRITE THIS ONE FIRST. Over a fixture copy of
      the real hook directory and the real shipped settings surface, execute the census as a
      process and capture two things from its own output: the stated examined-count and the
      set of scripts reported as run by nothing. Then write ONE new hook file into that
      directory, change nothing else, and execute the census again. The new file must appear
      in the reported set and the stated examined-count must be exactly one greater than the
      first run's. Both numbers are read from the census's output, never from a literal
      expected value. No implementation carrying a list of script names — however that list
      is spelled — can pass this.
  - name: test_bp_100n_6_added_script_inside_a_subdirectory_is_reported_the_same_way
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      The same exercise with the new file placed in a subdirectory of the fixture hook
      directory rather than directly in it. This is the only red baseline for the recursion
      decision: the real directory is flat today, so every non-recursive implementation
      passes every other descriptor here.
  - name: test_bp_100n_6_every_script_no_entry_executes_is_reported_and_the_run_fails
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Over the repository's real hook directory and real shipped settings surface, the
      executed census reports by name every script no configured entry executes, states of
      each that nothing runs it, and exits non-zero. The assertion is count-and-membership
      based over the census's own reported set — never a comparison against a hard-coded
      list of today's names, which would pass while the next one escaped.
  - name: test_bp_100n_6_a_script_an_entry_executes_is_not_reported_at_all
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      A script executed by at least one configured entry appears in NO reported class —
      not as run by nothing, not as deliberately unwired. NAMED MUTATION (mandatory, run it,
      do not merely describe it): build the wired set by matching each script's bare
      filename against the raw text of the settings surface instead of against the script
      each command executes. Under that injection this descriptor must go RED — a script
      whose name appears in the surface outside any executed command is then counted as
      wired — and must return to green on revert. Without the injection this clause is green
      on arrival, because today nothing is reported at all.
  - name: test_bp_100n_6_two_scripts_sharing_a_filename_at_two_positions_are_two_members
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      A fixture directory holding the same filename at the top level and inside a
      subdirectory, with only the top-level one executed by an entry, reports the
      subdirectory copy as run by nothing. Goes red on bare-filename identity, which silently
      covers the second copy with the first one's wiring — the false negative in the one
      direction this census exists to close.
  - name: test_bp_100n_6_census_is_emitted_through_the_entry_point_that_actually_runs_it
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: >-
      PRODUCTION ENTRY POINT. Run the census through the surface that will invoke it in
      practice — whichever of the three candidate hosts the implementation chose, invoked the
      way that host invokes it — and assert that the per-script verdicts and the summary
      appear in that host's own output stream, and that the exit status is the host's outcome
      rather than an advisory note. A census computed by a function nothing calls is inert,
      which is the defect class this record belongs to.
  - name: test_bp_100n_6_deployed_copy_runs_the_census_over_the_installed_layout
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After a real build, the DEPLOYED copy of the census and every module it imports load
      and run in a cold process — a helper missing from the deploy manifest surfaces here as
      a missing-module error rather than passing. Over the real installed hook directory and
      the real installed settings surface, reached through the symlinks that defeated this
      surface's own worked example, the census resolves both sides to one identity and does
      NOT report every script as unwired. Source-tree greenness cannot substitute: the
      symlink resolution only exists in the installed layout.
test_rationale: |
  Every clause of this record is green on arrival on the repository as it stands, for the
  single trivial reason that no census of this surface exists and nothing is reported at
  all. That is the shape this whole family is about, and it is why the two clauses that
  assert something is NOT reported carry executable injections rather than notes asking
  someone to confirm the test is meaningful.

  The added-script descriptor is written first because it is the only one that cannot pass
  on an implementation holding a literal list, however that list is spelled: it adds a file
  the list cannot know about and requires the stated count to move by exactly one. The
  subdirectory variant is separated from it deliberately — the real directory is flat, so
  without that descriptor the recursion requirement has no red baseline and every
  non-recursive implementation passes.

  The raw-text injection defends the not-reported-at-all clause, and it reconstructs the
  most likely wrong implementation on this surface rather than a hypothetical one: the
  scripts are named inside shell command strings, so a substring search over the settings
  document returns the right answer today and the wrong answer the first time a script's
  name appears anywhere that is not executed.

  Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by Grep", no descriptor here
  may be satisfied by reading the census's source or the settings surface as text; a text
  assertion stays green on precisely the dead enumeration being prevented. Every descriptor
  executes the census as a process and asserts on its emitted output and exit status, and
  the deployed descriptor runs the built copy through the installed symlinks, because that
  layout is where this surface's own exemplar failure lives.
