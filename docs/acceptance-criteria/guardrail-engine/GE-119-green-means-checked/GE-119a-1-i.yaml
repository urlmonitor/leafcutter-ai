id: GE-119a-1-i
title: "One unparseable input, while the check still ran, remains an ordinary pass"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given 5 staged agent definition files, of which exactly 1 cannot be parsed,
  And the check that inspects agent definitions can reach every prerequisite it needs,
  When the check runs,
  Then it inspects the 4 parseable definitions and reports its findings for them,
  And it warns about the 1 unparseable definition, naming that file,
  And it does not block the commit on account of the unparseable definition,
  And its overall result is the ordinary success value, NOT the could-not-check value
    defined by GE-119a-1 — because the check did run,
  And the behaviour approved in GE-116a-1-iii ("Unparseable agent definition fails open
    and does not block the commit") is therefore observably unchanged by this feature.

  Coverage note: this must be exercised by running the check against a real staged file
  set containing a genuinely unparseable definition, not by asserting that a fail-open
  branch exists in the source.
depends_on:
  - GE-119a-1
