criteria: |
  Given a workspace whose protection settings are in place, but in which a commit
    of a known-bad file is not rejected,
  When the workspace maker answers,
  Then the answer is a refusal stating that the protections are not active,
  And the presence of the protection settings alone never produces a ready answer.
