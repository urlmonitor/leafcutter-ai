criteria: |
  Given a message file whose body contains the line "# covers: BO-4500a-2" and the line
    "#1043 is the fix this follows",
  When the shared commit step commits,
  Then both lines appear in the recorded message, unchanged and in place.

  Given a message file whose body contains a line indented with four spaces and a line with
    trailing spaces,
  When the step commits,
  Then the indented line keeps its four leading spaces,
  And the only differences between the file and the recorded message are trailing whitespace
    at line ends and blank lines at the very end of the message, which the version-control
    system always removes.
