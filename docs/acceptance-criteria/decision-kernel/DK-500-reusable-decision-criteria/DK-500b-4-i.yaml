id: DK-500b-4-i
title: When the run's budget cannot fund grouping, the run goes on without it and says so
component: decision-kernel
components:
- decision_kernel
level: L3
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given a decision run with drafted gap criteria,
  And a remaining Jev budget that cannot fund the grouping calls and still fund the run's research and assessment,
  When the drafted criteria would be grouped,
  Then no grouping call is made,
  And the approval of proposals shows the drafted criteria without suggestions and states that grouping was skipped for budget,
  And the run's research and assessment are funded as they would be without grouping.
depends_on:
- DK-500b-4
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500b-4
  contract: In-run grouping step and the run's Jev budget gate.
change_target: code
risk_surface: internal
it_requirements:
- Grouping is the first call dropped under budget pressure. Before grouping, the remaining Jev budget is compared with the calls the run still needs for research and assessment; if grouping would leave less than that reserve, no grouping call is made.
- The approval payload then states grouping_skipped with reason budget and lists the drafted criteria without suggestions.
- Research and assessment receive the same Jev allowance as in the same run without grouping, which the call counts show.
test_required: true
test_spec:
- name: test_no_grouping_call_when_budget_tight
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: With a remaining budget that cannot fund grouping and the reserve, no grouping call is made.
- name: test_approval_states_grouping_skipped_for_budget
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The approval shows the drafted criteria without suggestions and states grouping was skipped for budget.
- name: test_research_and_assessment_funded_as_without_grouping
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Research and assessment Jev calls equal those of the same run without grouping.
test_rationale: Run the decision capability through the public run/resume boundary with a scripted Jev provider and a recording host port; assert the approval payload, call counts and staged files. A direct-import unit test of a helper would not prove the forming flow wires the step.
