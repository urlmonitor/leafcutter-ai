it_requirements:
  - "Author fresh unit tests in tests/test_scan_secrets.py (new file). Source PR is closed — write from scratch and verify run-to-green before sign-off. scan_secrets.py lives under templates/skills/security-scanner/scripts/ — import it via sys.path.insert of that scripts directory."
  - "API NAMING: there is no function named scan_secrets. Use scan_file(path) (raw findings) and scan_files(paths, project_root) (applies the .security-allowlist). Findings are Finding(rule_id, file_path, line_no, excerpt) NamedTuples."
  - "Assert a file with a high-entropy secret-like token yields a finding (rule_id ENTROPY_HIGH) naming the file and line; assert a plain-text file yields no findings."
  - "Assert an allowlist entry matching rule_id:file:line suppresses the finding via scan_files; use a tmp_path project_root containing a .security-allowlist file."
  - "Assert a wildcard line marker ('*') for a path suppresses every matching line under that path, not just one fixed line number (_is_suppressed treats lineno '*' as match-all)."
