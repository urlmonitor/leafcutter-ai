criteria: |
  Given the collection's index exists and a new architecture document is produced
    with its listing requested,
  When production completes,
  Then the index has gained exactly one entry for the new document, carrying its
    title, its tier, the kind of picture it holds, and a link to it,
  And following that link from the index reaches the produced document,
  And the entry sits in the order the index already uses rather than being
    appended wherever there was room,
  And every entry the index already held is still present and unchanged, including
    entries for documents this production had nothing to do with,
  And the index, after the entry is added, still satisfies the project's own
    document checks.
