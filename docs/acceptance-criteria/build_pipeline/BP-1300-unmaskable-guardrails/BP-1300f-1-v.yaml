id: BP-1300f-1-v
components:
  - build_pipeline
title: "A pull request that raises a changed file's count of type-ignore comments fails, naming the file and lines, and text that only looks like one inside a string is not counted"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Background:
    Given at the merge base the file scripts/svc.py has exactly one comment
      "# type: ignore[assignment]".

  Scenario: An added type-ignore fails even when it hides the only new error
    When the pull request adds a line with an assignment error at head line 9 and
      silences it with "# type: ignore[assignment]",
    Then mypy reports no new error,
    But the check fails,
    And it names scripts/svc.py, the count rising from 1 to 2, and line 9,
    And it gives a one-line remedy: remove the ignore and fix the type.

  Scenario: The words inside a string are not a comment
    When the pull request adds the string literal "# type: ignore" and a docstring that
      mentions "# type: ignore", and adds no comment,
    Then the check passes,
    And it reports 0 new type-ignores.

  Scenario: Removing an ignore is not a failure
    When the pull request removes the existing type-ignore comment and fixes the
      error it silenced,
    Then the check passes.
depends_on:
  - BP-1300f-1
