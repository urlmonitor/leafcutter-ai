notes: |
  WHY THIS IS NOT PART OF BO-3800b-1, AND THE MUTATION THAT PROVES IT. Engaging the right
  party and NOT engaging the wrong one are separately failable, and the implementation that
  separates them is not hypothetical — it is the safest-looking build available. BO-210c's
  route already re-dispatches the originating coder on a gating-hook failure and retries
  once; adding the specialist alongside it, without touching that route, satisfies every arm
  of BO-3800b-1 (the specialist is engaged, and engaged before the retry) while leaving the
  author racing the standard in parallel. The user's stated reason for wanting a specialist
  is that an author racing a gate moves lines to a neighbouring file to make a number fall;
  a build that engages both gets that failure anyway, at twice the cost, and looks correct
  from BO-3800b-1's side. That is injection (1) below, and its stay-green half is the whole
  argument for two records instead of one.

  WHAT THIS RECORD DOES NOT CLAIM. It does not claim the specialist did the restructuring —
  unobservable, and forbidden by BO-3800's notes. It claims only which parties the run
  engaged, which is observable. In particular, a run satisfying every arm above may still
  have produced a file the author would have produced: the protection against that rests on
  the specialist's judgement, not on anything a check can detect, and BO-3800b's notes say
  so plainly. Do not write a clause that implies otherwise.

  THE BOUNDARY WITH BO-3800e-1, STATED SO THE TWO ARE NOT READ AS DUPLICATES. The paired arm
  above asserts only that the party MOVED when the disposition moved — it is this record's
  discriminator, without which the first arm is satisfied by a run that engages nobody.
  BO-3800e-1 asserts something this record does not: that in the author-clearable case the
  parties, their order and the outcome are the same as they are BEFORE this capability
  exists. A build could make the party move correctly while changing how the author-clearable
  case behaves in every other respect; that build passes here and fails there.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Written so the IT PO can
  lift them verbatim into test descriptors.

  (1) THE BELT AND BRACES. MUTATION: on a refusal whose disposition names the specialist,
      engage the restructuring specialist AND ALSO re-engage the originating coder with the
      same demand, exactly as the existing same-agent recovery route already does for every
      refusal — that is, add the specialist without removing the coder from this class.
      MUST GO RED: the coder-not-engaged arm and the nobody-in-its-place arm.
      MUST STAY GREEN: EVERY arm of BO-3800b-1 — the specialist is still engaged, still
      before the retry, and the engagement still moves with the disposition — and every arm
      of BO-3800a-1 and BO-3800e-1. That green half is the separability evidence for this
      record and must be observed rather than assumed.

  (2) THE DISPOSITION IGNORED. MUTATION: engage the restructuring specialist on every
      refusal and never the originating coder, without reading the stated disposition.
      MUST GO RED: the paired author-clearable arm of this record, and both arms of
      BO-3800e-1.
      MUST STAY GREEN: the first two arms of this record, every arm of BO-3800b-1 and
      BO-3800a-1. EXPECTED COUPLING, TO BE REPORTED RATHER THAN SUPPRESSED: this injection
      reddens BO-3800e-1 by construction, because BO-3800e-1 is the record that owns the
      population it destroys. That is a true consequence and not a defect in either record.

  THE RECONCILIATION THIS RECORD FORCES AND DOES NOT PERFORM. BO-210 is approved, active and
  priority high, with three approved children. Its same-agent clause is narrowed by this
  record for one class and by nothing else. The change that implements this must reconcile
  BO-210a's single gating list and BO-210c's re-dispatch with the carve-out in the same pass
  — not discover it when BO-210's own descriptors go red. Which of the two possible seams is
  taken (route on the hook id, or route on the disposition the refusal states) is named in
  the doc_links above as an IT PO decision and is deliberately not taken here.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's, which runs
  after this pass.
