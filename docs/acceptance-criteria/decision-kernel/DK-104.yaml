criteria: |
  Given a versioned labelled enrichment corpus including the original Leafcutter availability question,
  And relevant and irrelevant documents, explicit caller context, unknown facts, missing preferences and adversarial content,
  When the enrichment-only evaluation runs,
  Then it invokes the production enrichment function without intent classification or downstream research,
  And it checks relevant source discovery, provenance, request preservation, scope and bounds, redaction and honest unknowns,
  And it reports case-level failures and aggregate results independently of any final-answer grade,
  And a separate integration check proves that the real classifier receives the gathered context.
