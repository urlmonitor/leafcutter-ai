  - name: test_direct_import_proof_is_refused_when_unit_has_an_entry_point
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Calls the real verify_done_eligible() over a fixture AC store plus a fixture unit with a genuine argparse main(), whose only covers-tagged proof imports the implementing function directly; asserts eligible is False and the reason names the unit, the un-entered entry point and the offending test nodeid."
  - name: test_same_criterion_becomes_eligible_once_the_proof_drives_the_entry_point
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Identical fixture unit and identical implementing code, with only the proof rewritten to invoke main(['<action>', ...]); asserts eligible flips to True with no code change and no added assertion."
  - name: test_unit_with_no_entry_point_is_not_judged_by_this_rule
    target_dir: unit_tests/ac_store/
