decision_type: design
question: 'Decide how the Leafcutter decision kernel should get read access to GitHub (pull requests, CI check results and
  run times, issues) so it can answer questions such as whether CI is green or whether open pull requests should be combined.
  Options: a native read-only retrieval source inside the kernel that pulls from the GitHub API into evidence; a host tool,
  where the kernel hands GitHub lookups to the host LLM (Claude Code or Codex) which runs gh; or another option grounded in
  the repository.'
