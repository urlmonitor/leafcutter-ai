assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "Dispatch must respect the ADR-006 depth-1 nesting limit: the command spawns the three reviewers at depth 1 and the reviewers themselves must NOT invoke the Agent tool (no further nesting). Aggregation and ticketing run in the command (depth 0), not inside a reviewer."
  - "The three reviewers must be issued in a single concurrent batch (one Agent-tool turn with three dispatches) so they run in parallel, not sequentially."
  - "All three reviewers receive the identical resolved-scope object from BO-1300a-1 so they probe the same feature."
  - "The reviewer count is fixed at exactly three and tied to the three angles defined in BO-1300b-1 — it is a constant of the pass, not a user-tunable parameter."
  - "This dispatch is the single shared spot-check pass reused by the automatic end-of-build surface (BO-1300d-1); it must be authored once and invoked from both surfaces, not duplicated."
delivers_to:
  agent: llm-expert
  contract: "Three concurrently-dispatched reviewer agents (depth 1) each seeded per BO-1300b-1, whose completed per-angle finding sets are collected by the aggregation step (BO-1300b-2)."
expects_from:
  ac_id: BO-1300a-1
  contract: "Resolved review scope object { feature_id|epic_folder, changed_files, behavior_summary } to dispatch the three reviewers against."
