id: ACS-100h-1
title: "Overcrowded parent triggers the split procedure with the correct pattern"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an L0 AC has 8 L1 children listed in its covered_by field (exceeding the limit of 7),
  When an agent loads the ac-tree-split skill for that L0,
  Then it selects Pattern A (horizontal split) as the applicable procedure,
  And given an L1 AC has 6 L2 children (exceeding the limit of 5),
  When an agent loads the ac-tree-split skill for that L1,
  Then it selects Pattern C (intermediate split) as the applicable procedure.
