notes: |
  Decomposed from ACS-800e. Relaxes the config/ac_store_schema.json id regex (id no
  longer carries hierarchy meaning) AND adds the parent-pointer/level/order field
  definitions to the schema. NOTE the schema is currently additionalProperties:false
  and does NOT yet contain the parent-pointer or order fields — adding them is part of
  this AC. Depends on the field-defining ACs ACS-800a-1, ACS-800b-1/2/3.
