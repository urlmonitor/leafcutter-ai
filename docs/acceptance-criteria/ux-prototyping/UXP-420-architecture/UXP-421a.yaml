criteria: |
  Given a populated product-truth store and acceptance-criteria store,
  When the Atlas renders the /flows view,
  Then each step's colour is derived live from the work_status of its linked acceptance criteria,
  And changing an AC's work_status changes the step's colour on the next load without editing the flow file.
