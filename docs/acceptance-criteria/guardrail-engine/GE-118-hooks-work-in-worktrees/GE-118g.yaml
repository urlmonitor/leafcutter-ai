notes: |
  WHY THIS L1 EXISTS RATHER THAN A CHILD OF AN EXISTING ONE. GE-118's six existing
  children are each about ONE named hook and ONE named dependency: GE-118a the
  check-secrets scanner directory, GE-118b the drift hooks' build manifest, GE-118c the
  declared document-type file, GE-118d/e/f the two accepted shapes of a path-bearing
  frontmatter entry. Filing a cwd-resolution defect in the decision-numbering tools under
  any of them would file it under a record about a different hook's helper. That
  mis-filing has a cost this project has already paid once: BP-600f sat in the wrong
  component for six weeks.

  WHY GE-118 IS THE RIGHT L0 AND NOT MERELY THE NEAREST. Its L0 criterion is about a hook
  resolving what it needs from the layout that actually holds it rather than from a
  hardcoded or assumed location. GE-118a-1, GE-118b and GE-118c are each an instance of
  the same shape — a resolution anchored on something the invoker controls instead of on
  something the project declares. The two children here add the one anchor the register
  does not yet hold: the invoking process's working directory. That is the same shape and
  not a new one, and the shared resolver GE-118b and GE-118c argued about by name is the
  same module the fix here routes through.

  WHY NOT GE-126. GE-126 ("You can verify for yourself that a check actually inspected
  your work") is about truthfulness, and both tools here are already truthful in their
  own terms. The collision guard says "could not read the decision-number sequence" —
  which is exactly what happened. The audit reports what it found in the tree it
  examined. Neither lies; both are pointed at the wrong thing. A criterion about honesty
  would be satisfied by the code as it stands today, which is the test that this is the
  wrong home. This paragraph is the record of that check, so the next author does not
  repeat it.

  MEASURED IN THIS WORKTREE ON 2026-10-09, WITH METHOD, AND NOT TO BE UPGRADED.
    - The directory this workspace's agent sessions start in is NOT a git work tree:
      `git -C /home/henzeh/projects/leafcutter rev-parse --show-toplevel` exits 128 with
      "not a git repository".
    - That same directory DOES contain a deployed `scripts/commit_guardian/`, so the
      procedure's bare relative command finds a script to run and only then fails to read
      git state. This is what makes the first defect reachable rather than theoretical:
      the command does not fail to start, it starts and answers wrongly.
    - It does NOT contain `scripts/adr_refs.py`, so section 6's bare relative command
      fails to start from there. The audit defect is reached by the absolute-path
      invocation that this project's own MANDATORY shell convention requires ("Use
      absolute paths for the script AND its arguments") — which leaves the scan root at
      its cwd default on every compliant invocation.
    - That directory holds 77 sibling worktrees under `worktrees/`. The prior filed note
      says "~100"; 77 is what is there today and the two must not be conflated.

  WHAT IS DELIBERATELY OUT OF SCOPE, AND THE CRITERIA ARE WRITTEN TO HOLD EITHER WAY.
    - REGISTERING THE COLLISION GUARD AS A COMMIT-TIME HOOK. It is registered nowhere
      today (verified 2026-10-09). KI-CG-20260909-dormant-gate-registration-census
      records that registering dormant gates carries real blast radius. Every criterion
      in this subtree is expressed as a DIRECT invocation — the form the published
      procedure prescribes — so it is satisfiable whether or not the gate is ever
      registered, and registering it later neither satisfies nor invalidates any clause.
    - THE FAIL-OPEN EMPTY-SET RETURN on a failed read, recorded in KI-CG-022. Real, and
      not this subtree's subject. A context-resolution fix will make today's symptom
      disappear while leaving that path in place; that is worth knowing and is not worth
      conflating.
    - HOW LONG EITHER TOOL TAKES. The audit was reported as hung from the wrong directory
      and is not hung — measured at 5.0s with the repository named explicitly. The defect
      is which tree it walks, not how fast it walks one. No criterion here states a
      duration and none may be added.

  L2 CUT. GE-118g-1 is the staged-change read (the tool cannot see the repository's own
  staged files). GE-118g-2 is the scan root (the tool sees a different tree and reports
  about it). They are separate because they are different mechanisms with different
  failure signatures — one refuses visibly, one answers wrongly and quietly — and a fix
  to either leaves the other untouched. GE-118g-3 is the no-repository case, which
  belongs to neither child because it applies to both.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent beyond a single nominated owner per leaf,
  estimated_complexity, it_requirements, test_spec, test_rationale and
  declares_side_effect. Those are the IT PO's.
