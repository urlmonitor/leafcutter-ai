notes: |
  Not asked for in the 2026-10-25 request; written so the "finish the job" fix of
  BO-4300e-2-v cannot be implemented as "delete any folder whose repository is gone". With
  the repository gone, whether the remaining files ever reached the shared project cannot be
  checked, so they count as unsent work under the standing rule "never delete unsent work",
  and the existing Q8 discard-token mechanism applies unchanged. Do not drop as scope creep.
