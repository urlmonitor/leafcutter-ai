      type: object
      description: "Report emitting cost-per-unit-of-work and time-per-unit-of-work for the fast lane and the heavy pipeline, presented side by side."
  reference_file_path: "scripts/agent-health/generate_health_report.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Reuse the existing agent_telemetry.jsonl read/aggregation surface (generate_health_report.py) rather than introducing a second telemetry reader, so the comparison stays consistent with existing reporting."
    - "The report must emit cost per unit of work and time per unit of work for each lane and present the two lanes side by side."
    - "Grouping must key on the lane tag (BO-2400d-2); a run with records for only one lane must degrade gracefully (report the available lane, note the missing one) rather than crash."
