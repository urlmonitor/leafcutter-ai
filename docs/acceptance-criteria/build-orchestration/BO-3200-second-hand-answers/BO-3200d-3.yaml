readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader designing a step that produces a substantial finding,
  When they open the sequence diagram for how a result is handed over,
  Then it shows the producer placing the result at the agreed handover, shows the reply
    returning separately and carrying no part of the result's content, shows the consumer
    obtaining the result from the handover, and shows the consumer's verdict being formed from
    what it obtained there.

  Given the diagram,
  When it is compared against a real run in which a result of at least 149 kilobytes is
    produced and consumed,
  Then every interaction it shows occurred, in the order shown, and the reply in that run
    carried no part of the result's content.
