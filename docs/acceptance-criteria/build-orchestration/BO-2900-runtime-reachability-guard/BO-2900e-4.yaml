it_requirements:
  - "ONE HOME, and it is docs/how-to/done-proof-enforcement.md — the guide a refused reader most often meets first, and already the destination BO-2900a-4 extends. What this AC forbids is two homes; anchoring it here removes the choice rather than leaving the writer to make it."
  - "One table, one row per refusal cause, four rows today: proof reached its code by direct import; nothing reaches the code at all; a registered capability nothing runs; an automation invocation naming a capability that does not exist. Columns: what is unreachable / which side is missing / the clearing action / where the full procedure lives."
  - "Each row LINKS to its procedural guide (BO-2900a-4's section, the capability-automation-connection guide, the exemption how-to) and restates none of it. A fourth page re-explaining the same procedures from the message's point of view is the copy that goes stale, and it goes stale invisibly because its readers arrive from a refusal and never see the original."
  - "State explicitly, per row, whether a recorded exemption releases that refusal: it releases only 'nothing reaches the code' and the deliberately-undriven capability case; it does NOT release the direct-import refusal or the stale-invocation refusal. Left to inference, the exemption becomes the universal answer to every row."
  - "REACHABLE FROM THE OUTPUT: coordinate with BO-2900e-1's requirement that every refusal emits a pointer to this table. Confirm the emitted pointer resolves to this document's anchor; a table only findable by someone who already knows it exists serves nobody who needs it."
  - "Satisfy check-doc-frontmatter, check-doc-length and check-doc-index, and update docs/INDEX.md if the guide's index entry changes."
