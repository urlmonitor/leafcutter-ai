notes: |
  Test-contract scope caveat (IT PO, 2026-08-17): the second Then clause — "the
  pull request cannot be merged until those required checks pass" — is enforced
  by the GitHub branch-protection ruleset on main, which lives outside the
  repository and cannot be asserted by a unit test. The test_spec covers the two
  clauses that ARE in-repo and behaviourally checkable: (1) the required gate
  workflows fire for a PR from an authoring branch, and (2) the delivery code
  path opens no bypass (no push to main, no privileged merge, no force-push).
  Ruleset configuration itself remains a manual/ops assertion.
