id: KM-500b-5
title: Keep reusable queries trustworthy as source data and versions change
component: knowledge-management
components:
- knowledge_management
level: L2
status: active
req_status: active
readiness: approved
priority: medium
work_status: todo
parent: KM-500b
criteria: 'Given a verified query has an active version and readers already pinned to that version and its
  source

  When source data, supported mappings or the query contract changes

  Then the declared compatibility policy distinguishes legitimate data changes from an incompatible or unverified
  query

  And any required revalidation uses reviewed expectations for the new source instead of assuming old result
  IDs remain correct

  And failed or incomplete revalidation cannot silently promote an incompatible version or erase the last verified
  version and its evidence

  When an authorized operator retires a query, selects a verified rollback version or recovers interrupted
  activation

  Then the authorized active-version selection is persisted in the configured catalog according to the recorded
  policy and the reason and verification history remain inspectable

  And already pinned readers either complete against retained compatible artifacts or receive an explicit expiration
  or incompatibility result

  And recovery never exposes a partly activated catalog or grants broader write permission

  And concurrent retirement, activation or rollback has one consistent outcome without conflicting active versions.'
