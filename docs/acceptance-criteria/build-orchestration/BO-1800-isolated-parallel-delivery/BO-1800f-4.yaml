it_requirements:
  - "THE PAGE IS docs/reference/removes-trailer.md. The record left placement open on the
     grounds that the boundary spans three delivery workflows and so argues for a
     cross-cutting surface; that argument is correct and it does not need to be weighed,
     because the placement rule admits no alternative. write-reference.md Step 2 states
     that ALL reference docs live at docs/reference/<topic>.md, and its Common Mistakes
     table records placing the file anywhere else as a defect that makes reference-author
     unable to find it. There is no component-scoped reference location in this repo, so
     `docs/reference/` is both the cross-cutting answer and the only answer. The file name
     is the literal trailer token, not a task phrase, per the same step's naming rules."
  - "EVERY WORKED EXAMPLE ON THE PAGE MUST SIT INSIDE ONE MACHINE-EXTRACTABLE BLOCK, in a
     single documented format, and each example must state all three of its parts
     explicitly: the exact trailer line or lines, the removal set it is stated against,
     and the recorded outcome. An example shown anywhere outside that block is invisible
     to the harness below and is therefore an uncovered drift hole; the page must contain
     no worked example outside it. This is a constraint on the page's SHAPE, and it is the
     precondition that makes the record's last clause checkable at all."
  - "THE RECORDED OUTCOME MUST BE WRITTEN IN THE VOCABULARY THE ADJUDICATION EMITS — the
     verdict kind together with which paths the verdict names — not paraphrased prose.
     Agreement between the page and the behaviour has to be decidable by a comparison, not
     by a reader's judgement, or the example clause degrades into a review item and the
     drift it exists to catch becomes invisible again."
  - "THE EXAMPLE SET MUST COVER ALL THREE DOCUMENTED FAILURE MODES AND AT LEAST ONE
     ACCEPTED DELIVERY: a removal with no matching declaration, a declared path matching
     nothing the delivery removes, and a path written in a form that is not accepted, plus
     one declaration that is honoured and delivers. The accepted example is not decoration
     and follows the same discipline as BO-1800f-2's add-only pair: an example set
     containing only refusals is satisfied by an engine that refuses everything, and one
     containing only acceptances by an engine that refuses nothing. Only a set carrying
     both can fail either."
  - "THE FACTS MUST BE DERIVED FROM THE IMPLEMENTED ADJUDICATION AS IT STANDS AT THE
     DELIVERY COMMIT, not from this record's prose and not from BO-1800f-2's notes. Where
     the implementation and either of those disagree, the implementation is authoritative
     for what the page states and the disagreement must be raised rather than documented
     away — a page that documents the intended rule while the gate enforces another is
     precisely the failure the last criterion exists to make visible."
  - "PATH-FORM STATEMENTS MUST MATCH BO-1800f-2-i's NORMALIZATION RULE EXACTLY: repo-
     relative, forward slashes, no leading `./`, no trailing whitespace, exact match after
     normalization rather than substring or basename, and case handled by the repository's
     path semantics rather than the host filesystem's. A page that softens any of these to
     a near-equivalent teaches a form that the gate then refuses."
  - "NO RATIONALE PROSE. Why a commit trailer was chosen over a declaration file or a
     ticket field is explanation content, forbidden by write-reference.md Step 7 and by
     the genre's own definition. That reasoning is already in BO-1800f-2's notes; if it is
     ever restated it belongs in an explanation doc, linked from See Also."
  - "STEP 9 BACK-LINKS ARE PART OF THE WORK, NOT OPTIONAL. Add the page to
     docs/architecture/components/build-orchestration.md (its `related_docs` frontmatter
     and a cross-link in the body), and to the delivery how-to(s) it supports. A reference
     doc nothing links to is not discoverable, which is the whole purpose of that step."
  - "DISCOVERABILITY IS ESTABLISHED THROUGH docs/INDEX.md, NOT BY CREATING
     docs/reference/README.md. The index does not exist (22 reference docs, no README);
     reference-author Step 5 directs the author to note its absence in the response
     payload and explicitly NOT to create one speculatively, so creating it here would
     contradict the agent's own procedure and is out of scope for this record. The step
     must therefore be skipped KNOWINGLY and reported, not silently: regenerate the
     generated index with `python scripts/generate_doc_index.py` and confirm the new row
     is present. Run THAT script only — not scripts/build.py, whose doc-index phase
     overwrites the tracked docs/INDEX.md with a `No docs found.` stub in this workspace
     layout (KI-BP-016)."
  - "ONE PAGE, ONE COPY OF THE RULES. The syntax must not be duplicated into a workflow
     doc, a skill body, or an agent template; those cite the page. A second copy is a
     second thing to drift, and only one of the two is bound to the behaviour by the
     harness below."
