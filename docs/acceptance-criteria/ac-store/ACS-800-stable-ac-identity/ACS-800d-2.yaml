title: "Existing cross-references keep resolving after migration"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given a requirement referenced by other requirements through dependency,
    coverage, contract, and supersedes links written under the old
    position-encoded names,
  When the migration completes,
  Then every one of those references still resolves to the same requirement it
    pointed at before the migration,
  And resolution succeeds whether the reference is read by its old
    position-encoded name or by the migrated requirement's new UID (the
    migration preserves a mapping from old name to UID, or rewrites the
    references, such that neither form dangles).
