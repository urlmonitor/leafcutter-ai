id: GE-127g-1-i
title: "A set-aside document is set aside on both arms of the standard — it may cross its limit and it may grow once already over"
component: guardrail-engine
components:
  - commit_guardian
  - doc_compliance
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the directory the agent-card generator writes into is a declared
    set-aside location,
  And one generated document in it stood at 2,525 lines as last committed,
    already far above the 300-line limit,
  And a regeneration leaves that same document at 2,809 lines, so the change
    leaves a document that was already over the limit longer than it was,
  When the author performs an ordinary commit,
  Then the commit completes.

  And given a second generated document in that directory that stood at 268
    lines as last committed, under the limit,
  And a regeneration leaves that same document at 340 lines, so the change takes
    it across the limit for the first time,
  When the author performs an ordinary commit,
  Then the commit completes.

  And given a hand-authored document outside every declared set-aside location
    that stood at 340 lines as last committed and that the same commit leaves at
    355,
  When the author performs an ordinary commit,
  Then the commit does not complete, and the document it names is that
    hand-authored one and not either generated one — so both arms are set aside
    for the declared class and neither arm is set aside for anything else.
depends_on:
  - GE-127g-1
doc_links:
