title: "A test linked to a done AC is enforced and its failure fails the run"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100b.yaml
criteria: |
  Given a test function tagged "# covers: <AC-ID>" where that AC's work_status in
    the AC store is done,
  When the suite is run and that test fails,
  Then the test's failure counts as a real failure
  And the overall run outcome is non-passing
  And the test is enforced purely on the strength of its covering AC being done,
    with no additional manual marking on the test required.
