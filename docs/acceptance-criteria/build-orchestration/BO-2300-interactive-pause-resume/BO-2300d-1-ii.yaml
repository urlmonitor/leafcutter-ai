it_requirements:
  config_schema_fragment:
    type: object
    description: "Graceful-cancel outcome for a paused multi-stage run."
    properties:
      stopped_gracefully: {type: boolean, description: "true; must not error"}
      committed_stages_unchanged: {type: boolean}
      pr_opened: {type: boolean, description: "must be false"}
    required: [stopped_gracefully, pr_opened]
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "1"
  required_skills:
    - llm-expert
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "SURFACE: asserted against the E2 workflow ENGINE (JavaScript). The cancel branch of resolveGate() in the shared JS helper returns a graceful stop from the workflow body; for finalize-feature.js's merge gate a cancel must not proceed to open/merge a PR. Not a standalone Python module."
    - "A valid 'cancel' answer must stop the run gracefully (not error); earlier committed stages remain present and unchanged; no pull request is opened as a result of the cancellation."
    - "Cancel is a graceful stop, not a rollback: prior committed work is retained, but the run does not proceed to open a PR for the incomplete work."
    - "TEST STRATEGY: drive the real JS engine via unit_tests/_workflow_engine_harness.py run_workflow_under_e2(plan-feature.js): pause, resume with 'cancel' in args, and assert the harness run stops without error, committed stages are unchanged, and no PR-opening agent() is dispatched (absent from captured agent_calls). Do NOT test a standalone Python module."
  delivers_shape:
    description: "Terminal cancel state consumed only as an assertion surface; no downstream producer."
