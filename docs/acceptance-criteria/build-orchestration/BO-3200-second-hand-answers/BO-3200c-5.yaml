  - ac_id: BO-3200c-1
    contract: "The ordered interaction traces of both paths — question raised and answered by the person; and question unaskable, run paused, record written, authored work left in place — obtainable programmatically from real runs."
  - ac_id: BO-3200c-2
    contract: "The fact that a non-person reply never reaches the settle path, so the drawing's answering position can be asserted to contain only the person."
test_spec:
  - name: test_bo_3200c_5_diagram_declares_the_person_and_no_specialist_answering
    target_dir: unit_tests/docs/
    framework: unittest
