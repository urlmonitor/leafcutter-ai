it_requirements:
  - "The roster stays closed. Nothing in this change may open it, default new checks into it, or add a check to it automatically. Membership remains an author's decision; only its invisibility is the defect (ADR-035's shape)."
  - "The finding must be a warning that leaves the parity check's outcome value identical to the one a clean registration set produces. Exclusion is legitimate and a blocked commit for a legitimate state is how a detector gets bypassed - KI-CG-017 is the recorded instance of exactly that."
  - "The silence of the already-registered checks is an assertion, not a courtesy. A report that names every check in the manifest carries the same information as no report and will be suppressed; the seven checks currently on the roster are the regression boundary."
  - "The fixture check must be registered by following the documented procedure rather than by hand-placing files, because the criterion is about what the documented procedure leaves undone. A hand-built fixture tests the parity check against the author's model of registration instead of against the procedure."
  - "The parity check must be run out of process over a fixture tree. Its production entry point is the pre-commit chain and an in-process call cannot observe the outcome value a caller reads."
  - "The fixture registration set must be isolated from the real one - a temporary tree, not the repository's own manifest - so a test run cannot alter the real roster or the real manifest."
  - "Error handling must follow the four rules in CLAUDE.md."
test_spec:
  - name: test_procedure_registered_fixture_absent_from_the_roster_is_named
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_hook_parity.py"
    description: "A fixture check registered on all documented legs and absent from the roster is named by the parity check, together with the roster it is missing from and the route for recording a deliberate exclusion."
  - name: test_checks_already_on_the_roster_are_not_named_in_the_same_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "In the same run, every check already present on the roster is absent from the report. A parity check that warns about all of them produces the same visible output and has found nothing."
  - name: test_the_finding_is_a_warning_and_the_outcome_value_is_unchanged
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "The outcome value from the run with the omission and the outcome value from a run over a clean registration set are compared to each other and are the same - no commit is blocked by a legitimate exclusion."
  - name: test_adding_the_fixture_to_the_roster_silences_the_finding
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "The same fixture tree with the check added to the roster and nothing else changed produces a report naming nothing - binding the finding to the roster's contents rather than to the parity check having an opinion."
test_rationale: |
  A warning-appeared assertion is satisfied by a parity check that warns about every
  check in the manifest, which finds nothing and gets suppressed within a week — this
  component has the recorded instance (KI-CG-017, a working detector bypassed because
  of how its verdict arrived). So the negative half is the real coverage: the seven
  checks already on the roster must be absent from the report, and that absence is an
  assertion rather than a courtesy. The fourth descriptor closes the other direction —
  a parity check that names nothing under any condition also passes the negative half —
  by binding the silence to a single change in the fixture roster. The fixture must be
  registered the documented way because the criterion is about what the documented
  procedure leaves undone, not about what the test author remembers registration to be.
