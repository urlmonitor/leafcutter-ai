id: BO-2400a-3-iv
components:
  - build_orchestration
  - testing_quality
title: "Pre-existing covering tests are excluded from the red-baseline verdict but still reported"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the batch's covering tests have been partitioned, and the pre-existing set holds
    three tests that all pass while the newly-added set holds two tests of which at least
    one is red,
  When the red-baseline gate produces its verdict,
  Then the verdict is that a red baseline is established and the coder agent is
    dispatched,
  And no pre-existing covering test contributes to that verdict — the verdict is
    unchanged if a pre-existing covering test passes, fails, or is removed from the run
    entirely,
  And the gate's report still lists every pre-existing covering test by test id, with its
    acceptance-criterion id and its observed outcome, in a group labelled as excluded
    from the verdict.
depends_on: [BO-2400a-3, BO-2400a-3-ii]
