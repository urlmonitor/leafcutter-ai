  contract: >-
    The one pause-store step path: a fixed shell-runner dispatch per step whose reply
    shellStepReply() classifies as a result {command, exit_status, stdout, stderr} or a decline
    {declined: true, agent, reason} with no exit_status key; the clear's read-back uses the bounded
    read of ACD-2100c-3-ii.
declared_files:
