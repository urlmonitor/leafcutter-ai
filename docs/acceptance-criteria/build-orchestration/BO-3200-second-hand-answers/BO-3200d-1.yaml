risk_surface: contract_boundary
it_requirements:
  - "ONE HANDOVER, WHATEVER THE SIZE. No size threshold, no fast path for small results. A size-dependent split leaves two code paths, one of which is the defect, and a threshold nobody will re-examine. The third criterion exists to fail exactly that implementation."
  - "THE FIXTURE MUST BE AT OR ABOVE THE REAL SIZE (149 KB) with the marker placed PART-WAY THROUGH, not at the start. A truncating handover delivers the beginning intact, so a marker in the first kilobyte is found by a handover that lost ninety per cent of the content. Prefer a real bundle over a synthetic block of repeated bytes, per CLAUDE.md 'Real-artifact behavioral spot-check' — a synthetic fixture can also compress or serialise differently from real content."
  - "EQUALITY MUST BE ASSERTED BYTE-FOR-BYTE, on content, not by length or by a checksum of a normalised form. A handover that re-encodes line endings or strips a trailing newline is a handover that altered the result."
  - "THE VERDICT MUST BE COMPARED, not just the bytes. Content equality can hold while the consuming step reads something else entirely; requiring the verdict to match the one reached from the produced result directly is what ties this AC to the halt it prevents."
  - "The handover must not require the producer to reproduce the content in its reply — that is BO-3200d-2, and this AC must not be satisfied by a bigger reply field."
  - "THIS AC MUST NOT BE SATISFIED BY LOOSENING THE GATE. The cheapest way to make it pass is to stop the reading step refusing; BO-3200d-1-i is the guard and both must be delivered together."
  - "The artifact the handover uses must be cleaned up or scoped to the run, so a repeated drive does not read a previous run's result. A stale artifact read as this run's output is a new phantom-done vector."
delivers_to:
  - agent: python-coder
    contract: "A size-independent result handover: the consumer reads the producer's result whole, byte-for-byte identical to what was written, with no size threshold and no dependence on the reply's content. BO-3200d-2 constrains how the location is agreed; BO-3200d-1-i asserts the reading step still refuses a genuinely bad result; BO-3200d-2-i defines the three not-good outcomes."
  - agent: architecture-diagram-author
    contract: "The ordered trace of a real run in which a result of at least 149 KB is produced and consumed, so BO-3200d-3's diagram can be compared against a run at the real size."
