id: BO-650-5
title: "Architect runs at L0/L1 level, before implementation tickets are created"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a new L0 (goal) or L1 (feature) AC has been created by the PO,
  When the guardrail engine evaluates whether architecture work is needed,
  Then it triggers the architect agent at the L0/L1 level --
    BEFORE any L2 decomposition or implementation tickets are created
  And the architect produces design artifacts (ADRs, C4 diagrams, documentation)
    that inform the subsequent BA decomposition and IT PO technical enrichment

  Given the architect has completed its work at the L0/L1 level,
  When the BA agent subsequently decomposes the L1 into L2 behaviors,
  Then the BA has access to the architect's produced artifacts
  And the L2 ACs can reference the architect's ADRs and diagrams in their doc_links

  Given a ticket is classified as an implementation-only change (change_target: code,
    risk_surface: internal, estimated_complexity: S),
  When the guardrail engine evaluates whether architecture work is needed,
  Then the architect is NOT triggered --
    architecture work is reserved for structural or high-risk changes
