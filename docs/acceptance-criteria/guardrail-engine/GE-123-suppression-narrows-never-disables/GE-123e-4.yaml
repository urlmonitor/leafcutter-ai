id: GE-123e-4
components:
  - commit_guardian
title: "Concluding a merge, revert or cherry-pick is not refused for sign-offs carried in unchanged, while a sign-off added or edited during the resolution still is"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a scratch repository with two branches, "main" and "feature", that both
    changed the ticket file "tickets/00_inbox/TICKET-demo.md", so that merging
    "main" into "feature" conflicts in that file,
  And "main"'s copy of the ticket holds the heading
    "### 2026-05-01 09:00 — test-writer (status: ok)" with no feedback-id line,
    committed before the commit checks were installed, and "feature"'s copy
    does not,
  And the commit checks are now installed,
  When the conflict is resolved keeping that heading word for word, and the
    merge is concluded with an inline message,
  Then the merge commit succeeds.

  Given the same conflicted merge,
  When the resolution keeps the carried-in heading word for word and also appends
    "### 2026-11-16 11:00 — conflict-resolver (status: ok)" with no feedback-id line,
  Then concluding the merge is refused,
  And the refusal names the appended heading and does not name the carried-in
    heading.

  Given the same conflicted merge,
  When the resolution changes the carried-in heading to
    "### 2026-05-01 09:30 — test-writer (status: ok)", still with no feedback-id line,
  Then concluding the merge is refused, and the refusal names the changed heading.

  Given "feature"'s own copy of the ticket held, before the merge began, the
    heading "### 2026-05-02 08:00 — sql-coder (status: ok)" with no feedback-id
    line, committed before the checks were installed, and "main"'s copy does not,
  When the resolution keeps that heading word for word and the merge is concluded,
  Then the merge commit succeeds,
  Because a heading identical to its copy on either side of the merge is not work
    done in the resolution.

  Given "main"'s copy instead holds "### 2026-11-15 16:00 — python-coder (status: ok)"
    followed, on the next line, by "feedback-id: fb_2026-11-15_0f1e2d3c",
  When the conflict is resolved keeping it word for word and the merge is concluded
    with a message file handed to the commit by file, as the shared commit step does,
  Then the merge commit succeeds.

  Given a conflicted revert on "feature" of an earlier commit that removed the
    heading "### 2026-05-03 14:00 — test-runner (status: ok)", which has no
    feedback-id line and was added before the checks were installed, so that the
    revert brings that heading back and conflicts in the ticket file,
  And, separately, a conflicted cherry-pick onto "feature" of a commit from "main"
    that added the id-less test-writer heading above to the ticket file before the
    checks were installed, conflicting in that file,
  When each is resolved keeping its carried-in heading word for word and then
    concluded,
  Then both the revert commit and the cherry-pick commit succeed.

  Given the same conflicted revert and the same conflicted cherry-pick,
  When each resolution keeps its carried-in heading word for word and also appends
    "### 2026-11-16 11:00 — conflict-resolver (status: ok)" with no feedback-id line,
  Then concluding the revert is refused and concluding the cherry-pick is refused,
  And each refusal names the appended heading and does not name the carried-in
    heading,
  Because undoing or replaying a recorded change carries someone else's sign-offs
    in as literally as a merge does, and the component already treats all three
    operations alike.

  Given no merge, revert or cherry-pick is in progress, and "main" holds the
    id-less test-writer heading above,
  When an ordinary commit on "feature" appends that same heading, copied word for
    word, with no feedback-id line,
  Then the commit is refused,
  Because the relief belongs to a merge, revert or cherry-pick being concluded, and
    covers a heading identical to its copy on either side of that operation, not a
    heading that merely exists elsewhere in the repository.
depends_on:
  - GE-123e
  - GE-123e-1
