notes: |
  THE PROOF AC for this L1, and the anti-regression anchor the two negatives hang from.
  Without it, GE-120e-1 is satisfied by any change that makes the merge arm quiet — including
  switching the check off for merges, which is the SKIP habit moved into the codebase where
  nobody has to type it.

  TWO AXES, TWO SWEEPS, NO OVERLAP. GE-120b-4 sweeps the manifest for LAYOUT parity: same
  work, same verdict from either working copy. This sweeps for OPERATION-SHAPE parity: same
  authored work, same verdict whichever git operation delivered it. Both consume GE-120c-1's
  harness and both iterate the manifest; neither subsumes the other, and an implementer
  should extend the harness with a second dimension rather than fork it.

  THE LAST CLAUSE — comparing what each arm objected to, not only whether it objected — is
  there because status-only comparison passes on two arms that both block for different
  reasons, which is exactly the state the observed merge was in: contract-shrinking would
  have blocked the ordinary arm too if the author had really deleted a test, and a
  status-only pair would have called that agreement.
target_epic: EPIC-TrustThatAGreenCheckActuallyChecked
