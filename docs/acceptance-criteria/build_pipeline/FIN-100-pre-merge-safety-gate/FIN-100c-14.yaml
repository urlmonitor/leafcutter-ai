title: "Recovery tests assert observable behavior, not brittle source-substring counts"
level: L2
component: finalize
status: active
parent: FIN-100c-4
criteria: |
  Given the test file covering the null-baseline targeted-rerun recovery
  When its test functions verify the recovery behavior
  Then no test gates on a count of source substrings in the workflow file text
    (for example the number of occurrences of a worktree-add command string or of
    a build-script path string)
  And coverage of the recovery behavior is obtained by executing the recovery path
    under the workflow test harness and asserting observable outcomes — the
    recovered baseline forwarded to triage, the conservative fallback on a
    rerun-unavailable result, and the worktree cleanup
  And a benign refactor that preserves recovery behavior but changes source
    wording or command spelling does not fail these tests
  And an inverted recovery decision (for example forwarding a non-null recovered
    baseline when the rerun was unavailable, or leaving the baseline null when a
    recovered baseline was produced) is caught by at least one behavioral test
