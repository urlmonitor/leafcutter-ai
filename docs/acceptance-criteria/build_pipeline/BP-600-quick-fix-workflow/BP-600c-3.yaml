id: BP-600c-3
components:
  - build_pipeline
title: "Quick-fix confirms the test passes under strict enforcement, then proves it is coupled to the fix"
component: build-pipeline
level: L2
status: active
readiness: reviewed
priority: medium
work_status: done
criteria: |
  Given the python-coder has applied the fix to the diagnosed file,
  When the workflow reaches the green-phase verification step,
  Then it dispatches the test-runner agent targeting the same test file
    from the red phase,
  And the run is required to be made under strict AC enforcement, on the same
    terms and for the same reason as the red phase,
  And the workflow rejects the verdict outright — halting, and naming the
    command that was actually run — whenever the runner cannot evidence that
    the strict setting was in force,
  And the test-runner reports all tests PASSED,
  And if the test still fails the workflow halts before committing anything,
    reporting the failure and that the fix did not resolve the bug.

  And green-after-red is then treated as insufficient on its own, because a
    test can pass for a reason unrelated to the fix,
  When the green verdict has been accepted,
  Then the workflow proves the test is coupled to the fix: it reverts the fix,
    confirms the test goes red again, restores the fix, and confirms the test
    is green once more,
  And if the test stays green with the fix reverted, the workflow halts and
    refuses to mark the criterion done — a test that passes without the fix is
    evidence of nothing,
  And if the restore step does not put the fix back, the workflow halts and
    says so explicitly, so the fix is never left reverted in the working tree,
  And only when the revert produced red, the restore produced green, and the
    fix is confirmed back in place does the workflow proceed to commit.
depends_on:
  - BP-600c
  - BP-600c-2
  - BP-600d-2
