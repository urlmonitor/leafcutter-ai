notes: |
  WHAT WAS ASSESSED BEFORE AUTHORING, AND WHAT WAS FOUND ALREADY COVERED. The
  finding that prompted this record has two halves, and only one of them is new.

    THE CLASSIFICATION HALF IS ALREADY COVERED, AND NO RECORD IS OWED FOR IT.
    BP-100k-3's first clause reads: given an artifact inside a directory the
    gates inspect "that the build deliberately does not manage -- a hand-
    maintained file with no build-produced counterpart", the gate reports it as
    a declared exemption naming its ground. A lockfile the tooling writes, a
    machine-local settings file and a project's own configuration file are
    exactly that description. The parent already says what should happen to
    them, and the reason it is not happening is that nobody has declared them --
    which the parent's second clause then correctly treats as a gap. So the
    remedy for the classification half is three entries in the exemption
    registry with their grounds stated, not a new acceptance criterion. Authoring
    one would restate a clause that already exists and would leave the actual
    defect untouched.

    THE ADVICE HALF IS GENUINELY UNCOVERED, and it is what this record is for.
    The parent requires the gap report to name "the action that would register
    it". Nothing anywhere requires the action named to be one that can register
    it. For a file no build phase produces, the action named is running the
    build, and running the build changes nothing -- so the reader is handed an
    instruction, follows it, and arrives back at the identical message. That is
    not a cosmetic complaint: it is a gate that blocks work and then misdirects
    the person it blocked, and the natural next move for someone who has run the
    prescribed remedy twice is to conclude the gate is broken and skip it. This
    repo has a known-issues entry recording precisely that outcome for a
    different cause.

  IT HAS HAPPENED AT LEAST THREE TIMES, WHICH IS WHY IT IS WORTH A RECORD RATHER
  THAN A FIX. Measured 2026-09-07 on branch fix/carried-followups, built from
  origin/main at 004bf9e87. Three files confirmed present on disk in this
  worktree and reported by the gate as unregistered build outputs with the
  build prescribed as the remedy: a scheduled-task lockfile, a local settings
  file and the project's own skills configuration, all under the tool directory
  the gate treats as a floor of its scan. Denominator: these are three of the
  files present in that directory on this date in this worktree, not a survey of
  the whole tree, and not a count of everything the gate reported -- a fuller
  sweep was not run and the figure should not be treated as the extent of it.
  The kinds are what generalise, not the three names, and the names will change:
  a file that exists on one developer's machine today may not exist on another's
  tomorrow, and a fresh clone has none of them, which is exactly why the sibling
  BP-100k-3-i can be green while this stands. Independently, two known-issues
  entries record the same misdirected-advice shape from unrelated causes -- one
  on a write-if-absent scaffold released from registration when its template
  changed, one on a gitignored cache file -- and the first of those is filed
  "open -- no AC".

  ONE OF THESE BLOCKED A COMMIT ON THE DAY THIS WAS AUTHORED, and the advice it
  gave would have been wrong. That is the whole argument for the AC in one
  sentence: the cost is not the false report, it is the false instruction
  attached to it, because the report at least invites a look and the instruction
  ends one.

  THE PAIRED CASE IS THE LOAD-BEARING CLAUSE, NOT A COURTESY. Every clause here
  except that one is satisfiable by a gate that has simply stopped recommending
  the build -- delete the suggestion, and no reader is ever misdirected again,
  and every remaining clause passes. That would be strictly worse than today,
  because the advice is correct and useful for the case it was written for: a
  file the build really does produce and really has not recorded. So the
  criterion requires both verdicts in one session on one tree, each remedy
  carried out and each shown to clear its own file. A gate that says one thing to
  everybody fails, whichever thing it says.

  WHY THE REMEDY MUST BE CARRIED OUT RATHER THAN READ. A test that inspects the
  gate's message for a better-worded suggestion is a test of the string, and a
  string can be improved while remaining unactionable -- indeed the most likely
  partial fix here is a softer, longer message that still points at the build.
  The only reading that distinguishes advice that works from advice that reads
  well is to do what it says and run the gate again. That also settles a
  question the implementer will otherwise have to guess at: whether the exemption
  route the gate recommends is one a reader can actually complete, which is only
  answerable by completing it.

  SCOPE BOUND. This AC governs what the gate SAYS to a reader it has stopped, and
  whether that is actionable. It does not govern which files the gate inspects
  (the scan set is derived from the build's own record plus a floor, and
  narrowing it is how a previous defect in this family went silent -- do not
  close this AC by making the gate look at less). It does not govern the verdict
  vocabulary itself, which is BP-100k-3's. It does not govern whether these
  particular files ought to be exempt, which is the parent's first clause and a
  declaration rather than code. And it does not govern the twin-copy
  desynchronisation behind the scaffold case in the known issues -- that is a
  real and separate defect whose symptom merely arrives through this gate.

  FOR THE IT PO. Two open choices. (1) How the gate decides a file is not
  build-producible. Deriving it from the build's own declared output families is
  the honest form and keeps the gate and the build unable to disagree; a
  hardcoded list of names will drift from the build exactly as a hardcoded scan
  list already did in this family, and would also fail the moment a file appears
  under a name nobody anticipated. Whatever is chosen, the criterion is
  behavioural and does not prescribe it. (2) Whether the alternative remedy
  should offer both declaring-exempt and removing, or only the first. The
  criterion names both because either can be right depending on the file -- a
  machine-local settings file should be exempt, a stale artifact should go -- but
  a gate that cannot tell them apart should say so rather than pick.
