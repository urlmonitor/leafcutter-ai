notes: |
  Gap found 2026-10-23: /plan-feature commits the test design as
  plan-feature(TEST-DESIGN-HANDBACK) before the hand-back round (ACD-2500a-2-ix), but the
  resume scan of committed stages has no entry for that label, so a resumed run does not
  see the stage as committed and designs and commits the batch again. The label is
  deliberately not TEST-DESIGN, so the fix must not simply map it to the finished stage:
  the final gate and the final commit still lie ahead.
