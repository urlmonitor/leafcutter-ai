criteria: |
  Given the commit phase is about to run `git commit`,
  When the commit driver executes,
  Then it runs the probe against the worktree before the commit, and if the probe
    returns a non-zero verdict the commit is refused with a message naming the
    failing check,
  And the commit only proceeds when the probe returns a passing verdict.
depends_on: [BO-1700d, BO-1700a-1]
