  - "Must rename (not delete) legacy files — use .legacy suffix for user recovery"
  - "Must update dispatch routing so the generated specialist is resolved when the agent name is invoked"
  - "Must be idempotent — re-running on an already-superseded project does not re-rename or produce warnings"
  - "Must handle errors gracefully per the project error handling policy if the rename operation fails"
