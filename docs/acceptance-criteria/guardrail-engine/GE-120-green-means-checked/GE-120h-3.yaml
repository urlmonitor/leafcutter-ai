notes: |
  PARTIAL PROGRESS — THREE OF FIVE ARMS LANDED IN 5d0792d13 (PR #808), AND THIS RECORD IS
  CORRECTLY STILL work_status: todo. Read this before concluding either that nothing
  shipped or that this is finished; both readings are available from the bare status and
  both are wrong.

    LANDED, observed rather than asserted:
      - Arm 1 (each of the five runs on an ordinary commit, and the commit completes) —
        the four pre-commit gates were seen Passing in the very commit that registered
        them; check-ac-done-on-merge is post-merge and was exercised through its deployed
        entry point.
      - Arm 2 (pre-existing state is reported, and does not by itself refuse) —
        check-folder-density reported templates/scripts/commit_guardian (109 files) and
        unit_tests/commit_guardian (142) as PRE-EXISTING against a limit of 15, and the
        commit completed.
      - Arm 5 (the record of advertised-but-unrun checks is smaller by exactly these five)
        — the inventory baseline went 14 -> 9, naming none of the five.

    NOT LANDED — this is what keeps the record open:
      - Arm 4, the anti-theatre clause: for each of the five, an input that check exists to
        refuse, put through the commit path it is now registered on, must actually be
        refused. NONE of the five has been shown saying no. Three are vacuous in this
        repository and a fourth is unarmed by default, so all five passing proves only that
        they do not crash. This arm is the difference between five gates and five entries.
      - Arm 3, the nothing-to-examine clause: a check whose subject this repository holds
        no instance of must SAY it had nothing to examine, rather than report that it
        examined something and found it clean. Unverified, and the early signs are that it
        currently fails: check-sql-complexity and check-debug-scripts exit 0 silently here,
        which is indistinguishable from a clean pass. That is GE-120a's defect appearing
        inside the fix for GE-120h, and it may need the GE-120 outcome vocabulary
        (OUTCOME_NOTHING_TO_INSPECT, check_outcome.py) wiring into those two scripts.

    Do not mark this done on the strength of the registration commit. Registration is arm
    1; arms 3 and 4 are the ones that distinguish a switched-on check from a decorative
    manifest entry, and they are precisely what KI-TQ-007 is about.

  THIS IS THE IMMEDIATE HALF, AND IT IS DELIBERATELY NOT THE WHOLE DECOMPOSITION. The
  parent forbids "register the missing checks" as the answer; GE-120h-1 and GE-120h-2 are
  the durable rule and this record is the cleanup that rule makes observable. It is
  written as a behaviour rather than as a task because a task is done when five lines are
  added to a file, and five lines added to a file is not evidence that anything runs.

  WHY EXACTLY THESE FIVE, AND WHY NOT THE OTHER NINE. The inventory record on main marks
  precisely these five as needing no code work, each with a measured reason. The other
  nine each need real work first — a shrink-only ratchet over existing violations, an
  unhandled parse error, an argv fix that would otherwise make the check read zero files
  and always pass. Registering those nine as they stand would either wall off large parts
  of the repository or install gates that cannot fail, and a gate that cannot fail is the
  defect this L0 is named after. Do not widen this record to them: the set is defined by
  the ready-to-register ground, not by the number five, and if the inventory's grounds
  have changed by the time this is built, take the set from the record rather than from
  this sentence.

  THE FOURTH CLAUSE IS WHAT STOPS THIS BEING THEATRE, AND IT IS UNCOMFORTABLE ON PURPOSE.
  Three of the five have nothing to bite on in this repository and one is unarmed by
  default. Registering all five and observing five green results would satisfy a naive
  reading of "they now run" while changing nothing about whether the package's promise is
  true. The demonstration must therefore be a refusal delivered through the registered
  commit path, under settings that arm the check, for each of the five.

  package_surface: true MUST BE SET ON THIS RECORD DURING TECHNICAL ENRICHMENT. It is not
  a formality and it is not deferrable: adding these five entries to the registry trips
  check-package-surface-declaration, which refuses the commit unless a cited criterion
  declares it, and the absence of such a criterion is the recorded reason the five are
  still unregistered today. The field is the IT PO's to set (as are the structured
  implementation fields the schema then requires), which is why it is flagged here rather
  than written here.

  A NEWLY REGISTERED ENTRY IS JUDGED BY THE EXISTING REACHABILITY RULE ON THE SAME COMMIT.
  That is the subject of GE-120h-3-i and the reason this record has a child: the
  registration shape is not free, and the natural-looking shape is the wrong one.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
