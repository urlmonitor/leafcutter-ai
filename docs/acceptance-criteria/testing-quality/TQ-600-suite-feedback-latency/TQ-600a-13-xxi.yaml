notes: |
  THE FOLDER. The request names it as tests/knowledge_live/ (nine test modules at authoring,
  including the publication/ subfolder). The criteria say "the live-database test folder"
  so the record survives a rename; the IT PO should pin the selection to the folder, never
  to a hard-coded list.

  WHY ONE VERDICT, AND THE CONSEQUENCE STATED PLAINLY. The request says the lane's failures
  go "through the suite's existing retry-once and verdict mechanism". The existing verdict is
  the one the per-PR `Post-merge suite status` hold reads (TQ-600a-13-vi). So a red
  live-database lane holds every open pull request until it is fixed or a declared fix proves
  itself (TQ-600a-13-viii, -xvi; see TQ-600a-13-xxv). That is the intended alarm, but it is a
  wider blast radius than "report the failure", and the owner should confirm it before the
  hold is made required (TQ-600a-13-x's rollout).

  THE PARTITION CLAUSE. TQ-600a-13-xii says every test is collected by exactly one of three
  sets, "none by two". The live-database lane collects default-run tests a second time. This
  record does not edit -xii (a BA never modifies another run's record); it scopes the
  partition explicitly and flags that -xii may want a one-line amendment.

  RUNNER COST. The live-database lane adds a database start-up and nine modules to each
  coalesced run. Measure it at sign-off and record it here; the job timeout follows
  TQ-600a-13-ii's "no more than three times its measured cost" rule.
