id: BP-100n-5
title: "A finished record's declaration that names parts of a real configuration file is read back against that file, and a named part that is not there is reported by name and fails the run — a declaration checked only for shape is a check that never opened anything"
component: build-pipeline
components:
  - build_pipeline
  - ac_store
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given a requirement record may declare the configuration it expects the finished
    work to add, by naming one or more top-level parts of a configuration file it
    also names,
  And at the time of writing the configuration file that most such records name holds
    36 top-level parts,
  And among the records naming parts of that file whose work is recorded as finished,
    four name a part the file does not contain while one names a part it does,
  When the declaration check runs,
  Then for every record whose work is recorded as finished, whose declaration names
    parts, and whose named file can be opened, each named part is looked up in that
    file as it stands on disk,
  And every named part the file does not contain is reported together with the record
    that named it and the file that was opened, and the run fails,
  And a record naming a part the file does contain is not reported in any class,
  And a record whose work is not recorded as finished is not reported for a part the
    file does not yet contain, because that part is what the unfinished work exists to
    add,
  And the run states how many declarations it opened a file for and how many named
    parts it looked up, and a run that looked up no parts fails as a run that reached
    no verdict rather than reporting nothing wrong,
  And given one further finished record is added that names a part the file does not
    contain, and nothing else in the repository changes,
  When the check runs again,
  Then that record is among those reported, and the stated number of parts looked up
    is greater than the number stated before.
