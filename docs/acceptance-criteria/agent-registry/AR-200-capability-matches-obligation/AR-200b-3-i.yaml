notes: |
  THE MACRO CLAUSE IS THE NEW EDGE. An implementation that resolves the
  ticket-phase entry first and then asks "is the resolved list non-empty?" would
  exempt the macro holder on any build where the entry happens to resolve to
  nothing -- and would make the verdict depend on the rest of the tree rather
  than on the agent's own definition. The entry is a permission by itself. (An
  entry that resolves to no agents is separately reported by AR-300c-5-iii.)
  Today ticket-supervisor holds the entry and holds the dispatch tool, so the
  clause is a guard against regression, not a live finding.

  THE ASYMMETRY CARRIES OVER FROM AR-200b-2-i. On the TOOLS side, absent means
  permits nothing (a finding when a permission exists). On the PERMISSION side,
  absent or empty means holds nothing (never a finding). A single
  "missing means empty" normaliser applied to both sides gets the second clause
  wrong. Two templates already carry an explicit empty sub-agent declaration
  (ac-triage, onboard-config-section) -- the third clause's real instances.

  THE NEGATIVE CLAUSES KEEP THE RULE USABLE. Most agents permit no sub-agents;
  several hold the dispatch tool anyway. Reporting either group is the noisy-rule
  failure AR-200b-1 records in this component.
