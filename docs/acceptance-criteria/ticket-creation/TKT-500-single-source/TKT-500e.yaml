criteria: |
  Agents maintain continuity within a goal's scope.

  When an agent completes work on one requirement within a goal, it receives
  the next requirement without losing context. Files it modified, patterns it
  learned, and decisions it made carry forward. The agent accumulates
  understanding across the goal's requirements rather than starting cold each
  time. Across goal boundaries, agents start fresh — no context leaks between
  independent goals.
