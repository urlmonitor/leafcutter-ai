created: 2026-07-21
amended_by:
  - reason: it-po-technical-enrichment
    by: it-po
    at: 2026-07-21
    note: "Assigned python-coder (routing config + generator + workflow-js: agent_registry.json selection_criteria, generate_ticket_from_ac.py agents-map, build-ticket.js dispatch). Structured it_requirements (BO-2000d) with real reference_file_path + build.py post_write_command. delivers_to user-surface-smoker (validated against registry). CAVEAT raised at the final gate: the criteria say 'selected by its declared side-effect'; there is no explicit 'durable side-effect' declared field today (the current selector is user_facing_surface). The exact declared field must be decided (broaden user_facing_surface vs add a new axis) before implementation — pinned as data-driven, never by-name."
