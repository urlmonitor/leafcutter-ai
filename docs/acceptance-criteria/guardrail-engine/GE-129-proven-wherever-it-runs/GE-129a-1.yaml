notes: |
  WHY THE UNIT IS THE ENTRY AND NOT THE SCRIPT — THE ONE THING THAT MAKES THIS RECORD
  DIFFERENT FROM EVERY NEIGHBOUR THAT ALSO READS THIS FILE.
  hooks_manifest entries carry an id, so GE-120f's population has an identity handed to it.
  This surface hands out none. Every candidate identity was considered and only one survives
  contact with the surface's shape:
    - THE SCRIPT PATH. Rejected. The same guard can be wired at more than one event, and its
      ability to refuse is not a property of the file — it is a property of the file plus the
      payload the event hands it plus what that event does with the answer. Identifying by
      script silently merges two subjects and lets a demonstration at one event stand for the
      other. This is also exactly the identity BP-1600a-1 uses, correctly, for a different
      question, which is why the two records must not be collapsed.
    - THE ENTRY'S POSITION IN THE FILE. Rejected. An index into an array moves when anything
      above it is inserted or removed, so a declaration bound to it drifts on an unrelated
      edit — the failure GE-129a-2 exists to make impossible.
    - THE EVENT, THE MATCHER AND THE RESOLVED GUARD, TAKEN TOGETHER AT RUN TIME. Chosen. It
      is stable under unrelated edits, it distinguishes the cases that genuinely behave
      differently, and every part of it is read from the surface rather than repeated by hand.
      The criteria above fix this behaviourally — two events, two subjects; a move between
      matcher groups follows the entry — without fixing a representation, which is the IT PO's.

  A CORRECTION TO THE FRAMING THIS RECORD WAS AUTHORED FROM, RECORDED BECAUSE IT CHANGES THE
  OPEN QUESTION'S SHAPE. GE-129a and GE-129's notes both describe settings.json entries as
  "COMMAND STRINGS inside matcher groups" with "no field on a command string to hang a
  declaration from". Read in this worktree 2026-09-14, an entry is a JSON OBJECT —
  {type, command, timeout} — sitting in a `hooks` array inside a group carrying a `matcher`.
  The load-bearing half of the claim holds and is why GE-129a-2 exists: there is NO
  IDENTIFIER on an entry. The other half does not: there is somewhere to put a value. That
  matters, because it means "declare it in the entry itself" is not ruled out by the file's
  shape — it is ruled out, if it is ruled out, by the fact that this file is read by the
  editor's own settings parser rather than by this project, which is a question about that
  parser's tolerance of unknown keys and is the IT PO's to settle. Left open here
  deliberately; see GE-129a-2, which fixes the property the answer must have.

  ANTI-VACUITY. The boundary clause — a guard on disk that no entry names is named in nothing
  this run reports — is trivially true of a run that reports nothing at all, so it is asserted
  in the same run as the entries the surface does name, each carrying a state. That pairing is
  ACS-1300a-3's and ACS-1400c-3's shape and it is not optional here.

  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSE. Identify subjects by resolved script path
  and deduplicate. ARRIVAL COLOUR: the identity clauses are RED on arrival — nothing reads
  this surface for this purpose today. Under the mutation the two-events-two-subjects clause
  and the move-between-groups clause both go red while the boundary clause stays green, which
  is the asymmetry that proves the mutation lands on this record rather than on its neighbour.

  NO POPULATION FIGURE APPEARS ABOVE, DELIBERATELY, and none may be added: the parent forbids
  one, GE-120f records the count as disputed, and the figure clause itself belongs to
  GE-120f-3. Every assertion here is membership over the run's own output.

  Authored at the BA stage. L2 behaviour only. No assigned_agent, no it_requirements, no
  test_spec, no estimated_complexity — the IT PO's.
