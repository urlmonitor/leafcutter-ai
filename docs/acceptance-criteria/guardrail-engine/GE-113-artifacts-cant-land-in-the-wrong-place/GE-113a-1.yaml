criteria: |
  Given the configured test location is "tests/",
  And a commit stages a test file at "unit_tests/etl/test_pipeline.py" which is
    outside the configured test location,
  When the pre-commit guard for test placement runs,
  Then the commit is blocked,
  And the blocking message names the misplaced test file,
  And the blocking message points at the configuration that decides the correct
    test location (the test_root key in skills_config.json).
