title: "The tool assembles an agent's effective prompt from template, channels, and AC-graph context"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given a target AC id and the agent assigned to it,
  When the effective-prompt render tool assembles that agent's brief,
  Then the output contains three labelled sections: the agent's role template, the reproducible
    shared harness channels, and the AC-graph task context,
  And the AC-graph task context includes the target AC's parent chain, its dependencies, its
    dependents, its siblings, and its linked docs.
depends_on: [ACD-1700c]
doc_links:
  - path: docs/architecture/agent_knowledge_plane.md
    relationship: describes
    status: exists
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "Output must contain three explicitly labelled sections: the agent's role template, the reproducible shared harness channels, and the AC-graph task context."
  - "AC-graph task context must include the target AC's parent chain, dependencies, dependents, siblings, and linked docs; graph traversal must use the canonical derive_parent_id() helper (scripts/ac_store/ac_parent_id.py), not a re-implemented parent rule."
  - "Read-only: the tool must never mutate the AC store or any template while assembling a brief."
  - "Paths named in the brief must resolve to canonical source (templates/...) per ADR-026 and must not silently render a build-output copy (scripts/... or .claude/... in a consumer layout)."
  - "Must complete within a few seconds over the full store for a typical AC (use a fast YAML loader); a large store must not degrade rendering to minutes."
delivers_to:
  agent: python-coder
  contract: "Assembled effective-prompt document (Markdown + JSON sidecar) with the three labelled sections and the five AC-graph relationship groups; the base surface extended by ACD-1700c-1-i (empty-relationships), c-2 (dependencies-with-shipped), c-3 (non-reproducible marking), and c-4 (cross-agent pointer)."
expects_from: null
test_spec:
