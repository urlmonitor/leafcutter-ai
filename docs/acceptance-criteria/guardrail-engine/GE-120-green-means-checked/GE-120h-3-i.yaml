      written separately — for check_debug_scripts, whose subject lives under a directory
      this repository does not track, a location-anchored condition matching nothing would
      be classified UNREACHABLE and would fail the run, where no condition at all is
      correct and silent. The check is also itself registered whole-tree with no condition,
      so the shape this record requires is the shape it already uses.
