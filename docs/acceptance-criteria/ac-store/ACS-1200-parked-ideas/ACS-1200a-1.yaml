notes: |
  RECOGNITION, NOT SUPPRESSION — this is the AC where that constraint becomes
  mechanical. The exemption granted in ACS-1200a-2 keys off this positive field,
  never off "covered_by is empty". The final clause is the load-bearing one: a
  childless record with no marker is reported as not-parked, which is what keeps
  a genuinely half-broken tree distinguishable from a deliberately parked one.
  The matching negative — that such a tree is still blocked and still reported —
  is ACS-1200c-3, deliberately placed under the enforcement L1 so the guarantee
  cannot be dropped by relaxing this one.

  WHY A REASON IS REQUIRED, not just a boolean: the PO's constraint is that the
  signal be something an author sets ON PURPOSE and a reader can SEE. A bare
  boolean can be pasted in reflexively; a required non-empty reason makes the
  act deliberate and makes the decision legible later. It also gives ACS-1200d
  something to show at the un-park decision.

  DELIBERATELY NOT INCLUDED: any duration or population field (parked_since, a
  count of parked trees, an age threshold). Reporting how many trees are parked
  and for how long is KM-200c's remit; this tree defines and enforces the state
  only. KM-200c is itself parked, so nothing here depends on it.

  IT-PO ENRICHMENT (2026-08-14). Complexity raised S -> M: the field pair is not
  a one-file schema addition. It lands in config/ac_store_schema.json AND must be
  honoured by two validator entry points AND by the degraded manual-validation
  fallback, and the shared marker reader it introduces is subject to the
  scripts/ac_store/ deploy_map constraint. That is three to four files plus a
  build-manifest edit.
