id: BO-2600b-4-ii
components:
  - build_orchestration
title: "A genuine prerequisite's own recorded parent is not pulled in either"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a target criterion T with no structural-parent dependency and one genuine,
    not-done prerequisite G that lives in a different tree,
  And G lists its own structural parent H in depends_on, where H's covered_by lists G
    and four other not-done children [H-a, H-b, H-c, H-d], and G's id does not have the
    shape of an H descendant,
  When the connected build set for T is resolved with structural-parent
    prerequisites excluded,
  Then the set is exactly [G, T], with G ordered before T,
  And H is not in the set and none of H-a, H-b, H-c, H-d are in the set: the
    recorded-edge rule is applied at every criterion reached by the walk, not only at T.
depends_on: [BO-2600b-4]
