  - path: templates/scripts/commit_guardian/_file_size_ratchet.py
    state: existing
it_requirements:
  - >-
    ADDED LINES ARE DIFFED OVER COUNTED LINES, KEYED BY THEIR NON-COMMENT TEXT. Both sides are
    reduced, by the same tokenizer pass that produces the measured length, to the ordered list
    of their counted lines, each keyed by the line's text with every comment removed and
    trailing whitespace stripped; that list's length equals the measured length by
    construction. Keying by the whole physical line would charge 1 added line for restyling a
    trailing `// note` to `/* note */` on a code line, which is a comment rewrite with the code
    unchanged. Whitespace-only lines are not counted lines (GE-127d-3, 2026-10-21), so they
    are neither keyed nor diffed anywhere — not outside comments, not inside used strings —
    and a change that only adds or removes blank lines yields 0 added by construction, not by
    a special case.
  - >-
    GROSS, NEVER NET, AND THE MERGE AND DELETION RULES ARE UNCHANGED. Still the sum of
    inserted/replacing lines from a SequenceMatcher with autojunk off, never current minus
    previous; still the minimum across merge parents; still 0 for a staged deletion; still
    AddedLineCountUnavailableError (INDETERMINATE) when it cannot be established — which now
    includes either side failing to tokenize (GE-127d-3-ii).
  - >-
    The language for both sides comes from the staged file's own extension. A rename that
    changes the extension is out of scope for this record; do not special-case it.
  - >-
    The Python arm follows the 2026-10-20 standalone-versus-used rule (GE-127d-3), not
    position: a `#` run rewritten as a string literal standing alone as a statement —
    docstring, bare string between functions, or trailing DECISION HISTORY string — adds 0
    lines in either direction, wherever it stands. The same text turned into a USED string
    (assigned, passed, returned, part of a larger expression) or into a standalone f-string is
    code, and such a rewrite legitimately adds its lines; tests must not present that as a
    restyle. Appending entries inside an existing trailing DECISION HISTORY string adds 0.
test_spec:
  - name: test_ge_127d_3_iv_restyling_comments_either_way_adds_zero_lines
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      In a temporary git repository with an over-limit .js file and an over-limit .py
      file, stage a restyle-only change in each direction and run the hook: each completes
      and states 0 lines added; the quoted lengths are equal before and after. The .py run
      is repeated at the module docstring position, at a function docstring position, as a
      bare string between two functions, and as a trailing module-level DECISION HISTORY
      string converted to and from the `#`-comment form (BrainCandy 2026-10-20).
    must_catch:
      - "the pre-2026-10-16 rule, under which restoring // lines counts 4 added"
      - "added lines counted from the raw diff rather than from measured content"
      - "docstring position only, so a bare or trailing standalone string is charged as added lines"
  - name: test_ge_127d_3_iv_appending_to_a_trailing_decision_history_string_adds_zero
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: >-
      Copy a real tracked over-limit .py file that ends in a module-level DECISION HISTORY
      string into a temporary git repository, stage a change that appends E new entry lines
      inside that string (E varied), and run the hook: it completes, states 0 lines added,
      and quotes the same length before and after.
    must_catch:
      - "a trailing DECISION HISTORY string counted as code"
  - name: test_ge_127d_3_iv_paragraph_to_block_restyles_and_blank_line_only_changes_add_zero
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      BrainCandy 2026-10-21. In a temporary git repository with an over-limit .js file and an
      over-limit .py file, stage (a) the pr-reviewer's paragraph restyles — `// a`, blank,
      `// b` rewritten as `/* a`, blank, ` b */`, and `# a`, blank, `# b` rewritten as a
      standalone `"""a`, blank, `b"""` — and the reverse of each; (b) a change that only
      removes B blank lines; (c) a change that only adds B blank lines (B varied). Each run
      through the hook completes, states 0 lines added, and quotes equal lengths before and
      after; the previous and current lengths are re-derived at run time.
    must_catch:
      - "a blank line between two line comments counted as a measured line"
      - "a blank line outside comments counted, so adding blank lines is charged as added lines"
  - name: test_ge_127d_3_iv_a_restyle_does_not_hide_code_added_in_the_same_change
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      The restyle plus K new code lines (K varied) states K added and requires the file
      to stand at its previous length minus K or below (or at the limit, whichever is less
      demanding), and is refused when it does not.
  - name: test_ge_127d_3_iv_restyling_a_trailing_comment_on_a_code_line_adds_zero
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      On an over-limit .js and .sql file, rewriting T trailing comments on code lines from the
      line form to the block form (`x(); // n` -> `x(); /* n */`, `-- n` -> `/* n */`), T
      varied, states 0 lines added and passes; changing the code on one of those lines in the
      same change states exactly 1 added.
    must_catch:
      - "added lines diffed over whole physical lines, so a trailing-comment restyle costs one line each"
test_rationale: |
  Both directions of the restyle are run through the real hook, because the KI's second
  effect appeared only in the restore direction. The mixed descriptor proves that zero-cost
  restyling cannot be used as cover for added code. The trailing-comment descriptor pins the
  one place a correct length measure can still charge a restyle: diffing whole lines instead
  of their non-comment content.
delivers_to: null
expects_from:
  ac_id: GE-127d-3
  contract: >-
    For a file's content and extension, the ordered list of counted lines keyed by their
    non-comment text with trailing whitespace stripped, produced by the same pass as the
    measured length (len(list) == measured length); and the distinct tokenizer-failure signal.
