assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    fast_lane_delivery_outcome:
      type: object
      description: "Terminal payload: {status: 'ok'|'blocked', pr_url: str|null, unsatisfied_required_checks: [str]}. status 'ok' is reachable only when unsatisfied_required_checks is empty; a non-empty list forces 'blocked' and the list is echoed in the message."
  reference_file_path: "templates/workflows-js/fast-lane-ship.js"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Scope of 'to the run's own knowledge': the required checks whose satisfaction the run itself determines before returning — today, the changelog-presence check. This is not a poll of the pull request's live check runs; do not gate the terminal payload on remote CI, which has not started when the run returns."
    - "The invariant must be enforced at the single point that builds the terminal payload, so a future step that discovers another unsatisfied check cannot bypass it by returning its own success. One construction site, not a convention."
    - "'blocked' must be distinguishable from 'halt': the work is committed and a pull request exists, so the operator's next action is to satisfy the named check, not to rebuild."
    - "The covering test must construct a run state with a known-unsatisfied required check and assert the terminal payload's status, not merely that a warning string appears. A payload whose status stays ok while a warning is appended is the failure mode."
delivers_to:
  agent: python-coder
  contract: "The run's terminal outcome payload, whose 'ok' status is the lane's delivery claim."
expects_from:
  ac_id: BO-2400f-4-v
  contract: "Whether the required changelog entry is present in the delivered change, and the halt reason when it is not."
test_required: true
test_spec:
  - name: test_success_payload_requires_no_unsatisfied_required_check
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "The terminal payload reports ok only when the list of known-unsatisfied required checks is empty."
  - name: test_known_failing_required_check_reports_blocked_not_ok
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "A run that knows a required check is unsatisfied reports blocked and names the check, rather than ok with a warning."
  - name: test_blocked_outcome_names_the_pull_request
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    description: "The blocked outcome carries the pull request it opened, so the operator can act on it rather than rebuild."
origin_agent: BrainCandy
