id: UXP-700b-1
title: "A run that examined nothing reports a different outcome from a run that examined something"
component: ux-prototyping
components:
  - ux_prototyping
  - precommit_hooks
level: L2
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a project record holding zero journeys, zero example datasets and zero screens,
  When the record's checker runs,
  Then the outcome it reports is not the outcome it reports for a record holding at least one
    artifact of each type that satisfies every check,
  And the reported outcome names each artifact type for which the checker read zero records,
  And a caller that reads only the outcome, without reading the message, can tell the two runs
    apart.
