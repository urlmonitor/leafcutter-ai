    target_dir: leafcutter-web/lib/data/__tests__/
    framework: vitest
    type: unit
    description: "buildFlowGraph(flow) with the default showAcNodes produces zero nodes of kind 'ac' and zero 'implements' edges, even when steps/branches reference ACs; only step/branch/decision nodes are present."
  - name: flow_explorer_defaults_show_ac_nodes_off
    target_dir: leafcutter-web/components/flows/__tests__/
