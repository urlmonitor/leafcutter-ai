created_by: "docs/acceptance-criteria/build-orchestration/BO-1700-worktree-quality-gate-guard/BO-1700a.yaml"
criteria: |
  Given the canary hook is invoked directly,
  When it runs,
  Then it prints the exact constant string `PRECOMMIT_CANARY_OK` to stdout and exits 0.
  And the canary is registered in the commit-guardian hooks manifest with
    `stages: [manual]` only, `always_run: true`, and `pass_filenames: false`.
  And given a normal `git commit` in the worktree,
    When the commit's pre-commit stage runs,
    Then the canary hook does NOT execute and the token does NOT appear in the
      commit's hook output.
  And given the build step that generates the deployed pre-commit config runs,
    Then the generated config contains the canary hook entry with `stages: [manual]`.
depends_on: [BO-1700a]
