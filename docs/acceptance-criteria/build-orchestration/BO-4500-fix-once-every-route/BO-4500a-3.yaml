risk_surface: safety
created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500a.yaml"
criteria: |
  Given the caller names a.py and notes.md, both changed, with a valid message file,
  And every check the project runs before a commit passes on both files,
  When the shared commit step runs,
  Then the checks run once over the named files before any commit is recorded,
  And the commit is recorded and the answer is committed.

  Given the same call,
  And on that first run a fixing check (a formatter) rewrites a.py and every other check passes,
  When the step continues,
  Then it takes the rewritten a.py into the named set and runs the checks exactly once more,
  And when that second run passes, the commit is recorded with the rewritten a.py,
  And the answer is committed and names the fixing check and a.py as the file it changed.

  Given the same call,
  And on the first run a judging check that fixes nothing fails on notes.md,
  When the step continues,
  Then no commit is recorded and the checks are not run a second time,
  And the answer is hook_failed with hook_name naming that check and failing_files listing
    notes.md,
  And a.py and notes.md hold in the working tree the content they had when the step stopped,
    with any fixing check's changes kept,
  And neither file is left staged by the call.
depends_on: [BO-4500a, BO-4500a-1]
