readiness: reviewed
priority: medium
title: "Generator recomputes each flow step's impl_status from its ACs' work_status"
component: ux-prototyping
level: L2
status: active
req_status: approved
work_status: done
criteria: |
  Given the AC store and the product-truth flows,
  When generate_product_truth.py runs,
  Then it builds one {ac_id -> work_status} map in a single pass over the AC store,
  And each flow step/branch impl_status is recomputed from the work_status of every AC
  in its implements list (all done -> done; none started -> not_started; otherwise
  in_progress),
  And each flow's impl_summary is the counted rollup of those statuses.
