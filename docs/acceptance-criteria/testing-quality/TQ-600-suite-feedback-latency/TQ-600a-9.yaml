  - name: test_tq600a_9_the_consumer_install_file_starts_one_pre_mutation_build
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "run_child_session() over unit_tests/portability/test_inf_400c_4_i.py, no --splits, LEAFCUTTER_SHARED_LAYOUT_EXECUTION_LOG set"
    description: >-
      Run the consumer-install file under the same execution log. The pre-mutation build
      happens once across the first test and all four parametrised instances of the
      second, and every one of the nine tests still passes.
  - name: test_tq600a_9_each_shared_assertion_still_fails_when_its_own_subject_is_broken
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "the four tests share one produced tree and three of them assert a property the shared fixture supplies unconditionally, so breaking the adopter file, the message, the declared winner or the cross-platform winner reddens fewer than four of the four runs"
      - "the shared build is reused across the four runs of this descriptor, so a mutation made for run one is still present in run two and more than one test goes red"
    description: >-
      For each of the four collision tests, break only the property that test names —
      the surviving file, the message, the declared winner, the cross-platform winner —
      and assert that exactly that test goes red while the other three stay green.
      THIS IS THE DESCRIPTOR THAT CANNOT BE DROPPED: it is the only proof that sharing
      one build did not turn three of the four assertions into statements the shared
      artifact makes true by construction.
  - name: test_tq600a_9_the_build_subprocess_count_for_the_named_files_falls_by_the_declared_counts
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "run_child_session() over each named file with LEAFCUTTER_SHARED_LAYOUT_EXECUTION_LOG set; deploy_executed lines counted per file"
    description: >-
      Count real build subprocesses across the six adopter files, the consumer-install
      file and the tracked-files file, before and after, by reading the execution log
      rather than by instrumenting anew. The reduction is at least 35, 4 and 1
      respectively, and the measured totals are reported rather than the estimates in
      this record.
  - name: test_tq600a_9_the_named_files_cost_at_most_two_thirds_of_their_baseline
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    must_catch:
      - "the ratio is replaced by an absolute wall-clock threshold in seconds; scaling both the baseline and the after figure by the same factor, as a loaded host does, must not change the verdict, and an absolute threshold makes it change"
      - "the baseline is read from a figure recorded in this record or in a previous sitting rather than measured alongside the after figure in the same run"
    description: >-
      Run the named files with sharing off and with sharing on, same machine same
      sitting, same process, and assert the RATIO is at most two thirds. This is the
      only descriptor that measures the population rather than a mechanism. Never an
      absolute second count: this host has shown 3.8x to 10.74x variance with no code
      change at all, recorded in TQ-600a-11.
  - name: test_tq600a_9_no_file_in_the_set_changes_between_directed_and_self_targeting
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "the tracked-files file's build is converted to a directed one, so its target directory and its package root stop resolving to the same tree"
      - "an adopter file's build is converted from directed to self-targeting, so it begins copying package source into its target and exercises the opposite code path"
    description: >-
      For each changed file, observe the build invocation the run actually performs —
      read the `target_dir` field of the `deploy_executed` entries the execution log
      received — and assert its target directory stands in the same relation to its
      package root as it did before. This is the plausible-looking change this record
      exists to forbid, so it is asserted against the invocation the run really made,
      not against the source of the call site.
test_rationale: |
  The whole risk of this change is that sharing a build makes an assertion true by
  construction instead of by behaviour, so the central descriptor is not a build count
  but a four-way discrimination: break one property, exactly one test goes red. A build
  count alone is satisfiable by a change that shares the artifact and quietly leaves
  three assertions inspecting something the fourth already guaranteed.

  The count descriptors are separate from the timing descriptor on purpose. Counts are
  deterministic and can be asserted exactly; timings on this shared host cannot, so the
  timing descriptor is a ratio measured in one sitting and the absolute figures in the
  criteria are treated as upper bounds.

  The directed-versus-self-targeting descriptor exists because the ticket that produced
  this work asked for exactly the conversion the evidence says is wrong. A record that
  only says "do not convert" in prose will be read as advice; a descriptor with a named
  mutation makes the conversion fail out loud.
