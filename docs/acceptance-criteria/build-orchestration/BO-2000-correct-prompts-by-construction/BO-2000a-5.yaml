amended_by:
  - reason: "Corrected a stale it_requirement, found while building INF-400c-4-i. The first bullet named '(route-learning / capture-learning)' as the section 7 knowledge-capture trigger. Both skill names were retired by ADR-034 decision 3, neither has ever existed on disk under templates/skills/ or .claude/skills/, and section 7 now explicitly prohibits loading them -- so the bullet pointed an implementer at two files that were never there, and at a trigger mechanism that never existed. Reaching section 7 in the protocol IS the trigger. NOTHING ABOUT THE REQUIREMENT CHANGED: the criteria were already correct and are untouched, work_status stays done, and its covering test (unit_tests/prompt_assembly/test_signoff_block_protocol.py, 4 passed) was re-run to confirm no regression. Also added an explicit do-not-reintroduce bullet, and scoped the first bullet to say this AC constrains only that the step is present and mandatory -- the record's content (INF-700b-1) and its destination (INF-400c-4, INF-400c-4-i) are owned elsewhere, which is what let this parenthetical rot unnoticed while those ACs moved underneath it."
