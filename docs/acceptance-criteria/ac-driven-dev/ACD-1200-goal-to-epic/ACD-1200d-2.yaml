title: "ACs excluded by the approval gate do NOT receive target_epic"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given goal ACD-050 has 5 leaf ACs:
    - ACD-050a-1 (readiness: approved) -- included
    - ACD-050a-2 (readiness: approved) -- included
    - ACD-050a-2-i (readiness: draft) -- excluded by user choosing "approved only"
    - ACD-050b-1 (readiness: reviewed) -- excluded
    - ACD-050b-2 (readiness: approved) -- included
  When the user chooses "proceed with approved only" at the readiness gate,
  And the epic EPIC-ValidateApiInputs is generated with 3 tickets,
  Then only the 3 included ACs receive target_epic: EPIC-ValidateApiInputs
  And the 2 excluded ACs retain no target_epic field
  And the excluded ACs remain available for inclusion in a future epic.
