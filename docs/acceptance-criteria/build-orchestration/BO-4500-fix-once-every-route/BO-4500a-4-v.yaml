notes: |
  QUESTION Q4 FOR THE GATE: the C6 spec has four statuses and none means "the step broke". This
  record maps it to refused-with-reason, because the alternative inside the spec (nothing_to_commit)
  is success-shaped. A fifth status "error" would match C2's runCommand vocabulary
  (ok | refused | error) and is the cleaner contract; if the user chooses it, only the status value
  in both Thens changes.

  IT PO 2026-10-14 -- Q4 ANSWERED WITHOUT A FIFTH STATUS (BrainCandy instruction 1). The status
  stays refused as the approved criteria say; the runtime case is distinguished by a required
  reason_code in the step_ family (step_index_locked, step_vcs_error), disjoint from the policy_
  family used for disallowed requests. Callers decide stop vs retry from the code, never from the
  reason text. A fifth status is not needed.
