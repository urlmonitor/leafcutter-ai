criteria: |
  Given a project that has already been migrated from the legacy layout (migration completed on a previous build)
  And the technology manifest exists
  And legacy agent files have been renamed with ".legacy" suffixes
  When the build runs again
  Then it does not re-trigger the migration process
  And it proceeds directly to specialist generation from the existing manifest
  And no "Legacy agent layout detected" message is emitted
  And the build output is identical to a build on a project that was never in the legacy layout
