it_requirements:
  - "THE TAUGHT SET MUST BE MACHINE-EXTRACTABLE. Write it into templates/agents/test-writer.md behind one stable anchor (a single fenced block or a table under a fixed heading) so the comparison can read the real source. Prose that merely mentions the names is not a set and cannot be compared; a taught set the checker cannot find is the same as no taught set."
  - "The comparison must read BOTH sides from where they really live — the single definition established by BO-2900g-3, and templates/agents/test-writer.md — never a fixture copy of either. A comparison against a convenience copy reproduces exactly the EPIC-ComputedQualityGates FP-1 layer-3 defect it exists to catch (a hook's allow-list and the config it mirrored were disjoint, each tested against its own copy)."
  - "A reported mismatch must name the specific missing name AND the side that lacks it. 'The sets differ' is unactionable."
  - "The teaching must be a set-cover checklist over decidable predicates, never a ratio model. docs/testing/test-angles.md 'Prompt-design note' is binding here: a pyramid/trophy framing plus a cheapest-green optimiser collapses reliably to zero high-level tests."
  - "The template ships through build.py. The taught set must be present in the DEPLOYED copy (.claude/agents/test-writer.md), not only in templates/ — a template edit that does not survive deployment teaches nobody."
  - "NOT MACHINE-CHECKABLE, DELIBERATELY UNCOVERED: the second Then clause ('for each name, the instructions state what distinguishes a proof of that kind from a proof of the behaviour alone, in terms the writer can act on') is a judgement about prose quality. It is NOT to be tested by grepping the template for keywords — that asserts presence, not actionability, and is the Neverfail Test smell. It is assigned to human/pr-reviewer review against the llm-expert Prompt-Quality Checklist. See caveat in the enrichment note."
  - "Nothing here reads a test. A reported mismatch is a mismatch between two declarations of a vocabulary, never a verdict about any piece of work."
delivers_to:
  - agent: test-writer
    contract: "templates/agents/test-writer.md carries the taught kind set behind one stable, documented anchor, one entry per permitted kind, each with its distinguishing rule. The anchor and the value shape are the contract the set-equality check and BP-1100g-3's tag validation both read."
expects_from:
  - ac_id: BO-2900g-3
    contract: "One authoritative statement of the permitted kinds, resolvable from a single file path — the well-defined left-hand side of this comparison. Until it lands there are two candidate sets and no comparison is decidable."
test_spec:
  - name: test_bp_1100g_1_taught_set_equals_the_emittable_set
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: unit
    angle: criterion
    description: "Set-equality between the kinds the planning side may emit and the kinds templates/agents/test-writer.md teaches: no emittable name is undefined for the writer, and no taught name is unemittable."
  - name: test_bp_1100g_1_both_sets_are_read_from_their_real_sources
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Both sets are parsed from the actual on-disk files (the single definition file and templates/agents/test-writer.md) in a fresh subprocess — no fixture copy of either side, and the test fails if either source path is missing rather than falling back to a literal."
  - name: test_bp_1100g_1_one_sided_name_addition_is_reported_by_name_and_side
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: unit
    angle: failure
    description: "Add a name to a temp copy of one source only, run the comparison, and assert the report names that specific name and states which side lacks it — then repeat with the sides swapped."
  - name: test_bp_1100g_1_deployed_test_writer_template_carries_the_taught_set
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT: run `python scripts/build.py --target-dir <tmp>` as a subprocess, then read the DEPLOYED .claude/agents/test-writer.md that the agent runtime actually loads and assert its taught set equals the definition. Source-tree reads are structurally blind to deploy-manifest gaps."
test_rationale: |
  A test asserting "the template mentions the angles" is satisfied by pasting a paragraph
  and decays silently the first time a name is added on the emitting side — that is the
  failure this AC exists to prevent, so it cannot be the test. The falsifiable shape is
  cross-source set-equality over the two REAL files plus a one-sided-drift negative
  control. The deployed read is separate because the harness loads the built copy, not
  templates/. The prose-quality clause is deliberately excluded from this contract; see
  the last it_requirement.
