it_requirements:
  - >-
    EVIDENCE (verified 2026-09-16, Python 3.14.2 on the developer machine). The
    docstring branch of the tag check, at lines 143-144 of
    templates/scripts/commit_guardian/check_test_ac_tags.py, reads the string
    payload of an ast.Constant through the `.s` attribute. `.s` was a deprecated
    alias and Python 3.14 removed it: `hasattr(ast.Constant('x'), 's')` is False.
    The branch runs whenever a test function has no covers tag on the line above
    its def and its first statement is an expression, which includes every test
    with a docstring.
  - >-
    REPRODUCTION (2026-09-16). Running
    `python .leafcutter/scripts/commit_guardian/check_test_ac_tags.py <file>` on
    each of unit_tests/test_km_kgs_100a_3.py, test_km_kgs_100a_3_i.py,
    test_km_kgs_100a_3_v.py, test_km_kgs_100a_3_viii.py and
    test_km_kgs_100a_3_ix.py exits 1 with
    `AttributeError: 'Constant' object has no attribute 's'`.
  - >-
    IMPACT. On 3.14 the hook crashes instead of judging, blocks every local
    commit that stages such a file, and its failure says nothing about whether
    the tags are right. CI runs Python 3.13 (where `.s` still exists) and does
    not run this hook, so no CI signal catches it.
  - >-
    REQUIRED ACCESSOR. Read the constant's payload through `.value`, which exists
    on every supported Python version, and keep the string-type guard so a
    non-string constant (e.g. a bare number) falls through to "no docstring tag".
    Do not introduce any accessor that exists on only some supported versions.
  - >-
    SCOPE GUARD. Do not change COVERS_REGEX, the accepted tag positions, or the
    warn/error mode resolution in this change; recognition breadth is owned by
    TQ-100b-4 / TQ-100b-5 and mode by GE-128a.
