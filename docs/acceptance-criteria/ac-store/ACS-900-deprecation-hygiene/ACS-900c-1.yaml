assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The block message MUST be written to STDOUT (not only stderr) so the committing agent receives it as feedback, following the ACS-400e-1 house style and the check_ac_governance.py _emit_block_decision pattern (structured/decision payload to stdout; human-readable diagnostics may additionally go to stderr)."
  - "The message MUST name every required element: the retired AC id, the new retired status, one line per surviving implemented_by entry (the specific path, anchor included where present), the violated rule, and the remedy(ies). No 'cycle detected'-style terse message — the fix must be obvious without forensic investigation."
  - "Remedy selection MUST be driven by the retired status: a deprecated AC offers only remedy (a) remove-the-code; a superseded_by AC offers both (a) and (b) re-point-to-successor. The exact per-status wording is refined in ACS-900c-1-i — keep that branch a single source of truth, do not duplicate the logic."
  - "When multiple retired ACs each have surviving entries in one commit, the message MUST report all of them (group by AC id), not just the first — the committing agent should see the full set of fixes needed in one pass."
  - "Message formatting is a pure transform of the block-decision records (no I/O); it MUST be a pure function so it stays out of the fail-open try/except and is unit-testable in isolation per the project error-handling policy."
  - "Deployed and packaged-template copies of the hook MUST stay in parity (ADR-001)."
