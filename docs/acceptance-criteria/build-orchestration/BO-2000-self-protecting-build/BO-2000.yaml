roadmap_phase: phase_1
criteria: |
  A build that protects itself -- it never wipes work in progress, and "still correct" is proven, not promised.

  When the project builds itself, two guarantees hold. First, running the build
  can never delete or overwrite the work you have open right now -- your
  in-progress changes survive untouched, so a routine build can no longer quietly
  eat an afternoon of edits. Second, any claim that the project still passes its
  own standards after a change is only believed when it is backed by evidence you
  can see -- a claim with nothing to show for it is rejected outright. Together
  these keep the build honest: it protects what you are working on, and it refuses
  to mark itself healthy on trust alone.

  This goal is distinct from its neighbours. BO-1700 governs whether the quality
  checks FIRE at all inside a throwaway workspace; BO-1500 governs how authoring
  requirements stays out of your way and lands safely on main. BO-2000 is a
  narrower, different promise: the build not destroying work in progress, and
  self-health claims being backed by recorded evidence rather than assertion.
