test_spec:
  - name: test_unittest_counts_against_the_seed_length_pass
    target_dir: unit_tests/evals/tq200d1iv/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      A test asserting self.assertEqual(len(volumes), len(window)) and self.assertEqual(sum(v is not None for v
      in volumes), len(window)), window a 3-value list it built, passes counts_rows_and_non_null.
    must_catch:
      - revert the fix
      - only bare assert statements read
      - only an int literal accepted on the other side of an exact count
    in_scope_files:
      - scripts/evals/produced_tests_scoring.py
  - name: test_bare_assert_and_assert_true_forms_still_pass
    target_dir: unit_tests/evals/tq200d1iv/
    framework: pytest
    type: unit
    angle: boundary
    description: >-
      The same test with bare asserts and the literal 3 still passes, and self.assertTrue(len(volumes) == 3) is
      read as assert len(volumes) == 3.
    must_catch:
      - bare-assert path dropped when the call path was added
      - assertTrue(<comparison>) not read as the comparison
    in_scope_files:
      - scripts/evals/produced_tests_scoring.py
  - name: test_unittest_bounds_follow_the_assert_bounds
    target_dir: unit_tests/evals/tq200d1iv/
    framework: pytest
    type: unit
    angle: boundary
    description: >-
      assertGreater(non_null, 0) and assertGreaterEqual(non_null, 1) count as a non-NULL count; assertGreaterEqual(non_null,
      0) does not.
    must_catch:
      - assertGreaterEqual(non_null, 0) accepted as a non-NULL count
      - assertGreater(non_null, 0) rejected
    in_scope_files:
      - scripts/evals/produced_tests_scoring.py
  - name: test_weak_or_self_comparing_counts_fail
    target_dir: unit_tests/evals/tq200d1iv/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Each fails: only assertGreaterEqual(non_null, 0); only assertTrue(len(volumes)); only assertIsNotNone(volumes);
      self.assertEqual(len(volumes), len(volumes)); an exact row count with no non-NULL count, in bare-assert and
      in unittest form.
    must_catch:
      - a count compared with itself accepted
      - assertTrue(len(x)) accepted as an exact count
      - assertIsNotNone accepted as a count
      - exact row count accepted without a non-NULL count
    in_scope_files:
      - scripts/evals/produced_tests_scoring.py
  - name: test_unittest_seeded_value_assertions_pass
    target_dir: unit_tests/evals/tq200d1iv/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      With feed = {"AAPL": 190.12, ...}, self.assertEqual(result["AAPL"], 190.12) and self.assertEqual(190.12, result["AAPL"])
      each pass asserts_known_seeded_value.
    must_catch:
      - revert the fix
      - assertEqual with the seeded value first rejected
    in_scope_files:
      - scripts/evals/produced_tests_scoring.py
  - name: test_presence_and_unseeded_values_fail_in_unittest_form
    target_dir: unit_tests/evals/tq200d1iv/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      self.assertIsNotNone(result["AAPL"]) alone fails; self.assertEqual(result["AAPL"], 9.0) fails when no assignment
      holds 9.0; a number that appears only inside assertion calls is not a seed.
    must_catch:
      - numbers inside assertion calls counted as seeds
      - assertIsNotNone accepted as correctness
    in_scope_files:
      - scripts/evals/produced_tests_scoring.py
  - name: test_kept_rerun_outputs_pass_and_presence_only_copies_fail
    target_dir: unit_tests/evals/tq200d1iv/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The probe fixtures under unit_tests/evals/fixtures/tq200d-rerun/test-writer/: run1 empty-window (unittest),
      run2 empty-window (bare asserts) and run1/run2 presence-is-not-correctness pass their kind; a copy of each
      weakened to assert only presence fails (no false green).
    must_catch:
      - a presence-only copy of a kept output passes (false green)
    in_scope_files:
      - scripts/evals/produced_tests_scoring.py
  - name: test_test_writer_gold_still_passes_with_unittest_reading
    target_dir: unit_tests/evals/tq200d1iv/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: >-
      python scripts/evals/run_agent_eval.py --agent test-writer --score-gold --results-file <tmp>
    description: >-
      The real CLI replays the test-writer gold outputs; the empty-window and presence-is-not-correctness rows still
      pass.
  - name: test_count_and_seed_entries_describe_unittest_reading
    target_dir: unit_tests/evals/tq200d1iv/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      Both entries name the accepted unittest calls and the bound rules, every python block on them scores as the
      entry states, the two template remedies are still in templates/agents/test-writer.md, and the README bullet
      links both entries.
    must_catch:
      - entry still says only 'an `assert`'
      - an example on the page that the kind no longer scores as stated
    in_scope_files:
      - docs/reference/produced-tests-eval-assertion-kinds-test-writer.md
      - scripts/evals/README.md
test_rationale: >-
  The fix widens two static checks, so half the weight is on the false-green boundaries a widened check could let
  through: a count compared with itself, a '>= 0' bound and a presence-only assertion, each in unittest form. The
  kept live outputs prove the defect is gone on real agent output, and their presence-only copies prove the widening
  did not open a false green; the gold run proves the rows are wired through the real CLI.
