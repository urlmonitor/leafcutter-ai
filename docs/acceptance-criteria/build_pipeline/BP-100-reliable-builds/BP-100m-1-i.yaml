created_by: "docs/acceptance-criteria/build_pipeline/BP-100-reliable-builds/BP-100m-1.yaml"
criteria: |
  Given two source templates that resolve to the same deployed target output path,
  And the two source templates have byte-identical content,
  When build.py runs,
  Then the build still exits with a non-zero status and reports the collision,
  Because the guardrail keys on the target path, not on content: even identical
    sources leave "which source is authoritative" undefined, so a later divergent
    edit to one could silently change the artifact.
