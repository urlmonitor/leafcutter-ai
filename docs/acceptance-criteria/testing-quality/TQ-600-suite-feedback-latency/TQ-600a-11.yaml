it_requirements:
  - >-
    THE ACCESSOR IS A GUARDED IMPORT, NEVER A HARD ONE. The C parser class is absent
    whenever PyYAML was built without libyaml, which is a real configuration for
    adopters of this package. The accessor must take the shape the in-repo precedent
    already uses — `getattr(yaml, "CSafeLoader", yaml.SafeLoader)`, or the equivalent
    `try: from yaml import CSafeLoader as _Loader / except ImportError: from yaml
    import SafeLoader as _Loader`. A bare `from yaml import CSafeLoader` makes the
    package uninstallable for those adopters, and the failure arrives at import time
    on an unrelated command.
  - >-
    THE INVENTORY IS DERIVED, NOT TRANSCRIBED. Produce the list of readers by
    searching the source at implementation time. The counts in the criteria (76 files
    overall, 26 + 30 in the two dense directories) are the figures measured at
    origin/main d4ee594d on 2026-10-05 and are given so a wildly different count is
    recognised as a changed population, not as a target to hit. Extend the ticket's
    files_touched from the derived inventory before the coder phase signs off, or the
    done-proof surface will be narrower than the change.
  - >-
    THE DEPLOY MANIFEST IS PART OF THIS CHANGE. If the accessor lives in a new module
    that any commit_guardian hook imports, add it to the deploy map in
    scripts/build_phases.py in the same commit and verify by running the DEPLOYED
    hook after a build — not the unit tests, which import from the source tree and
    mask the gap entirely. Consider instead placing the accessor where the hooks
    already import from, so no new deploy entry is needed; either answer is
    acceptable, an unverified one is not.
  - >-
    GREP FOR PARSER-ERROR STRING ASSERTIONS BEFORE CHANGING ANYTHING. The two parsers
    raise the same exception family but differ in message text and in some mark
    positions. Any existing test that asserts on a parser error STRING will change
    behaviour. Find them first; a surprise at green phase reads as a regression.
  - >-
    THE SPEED CLAIM IS COMPARED WITHIN ONE SITTING. This workspace is a shared WSL
    host under variable agent load, so an absolute second count measured today is not
    reproducible tomorrow. Take the pure-Python baseline and the accessor figure in
    the same process or the same script run, and assert the RATIO. A test that pins
    an absolute wall-clock number will be flaky and will be disabled, which is the
    same as not having it.
  - >-
    DO NOT WIDEN THE SAFETY POSTURE. CSafeLoader is the C implementation of the SAME
    safe schema; the change must never reach for yaml.load with the unsafe full
    loader, or for yaml.Loader, as a way to go faster.
