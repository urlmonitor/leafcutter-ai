id: AR-200a-1
title: "An agent template carrying a sign-off obligation declares a tool that can perform the write"
component: agent-registry
components:
  - agent_registry
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the set of agent templates the build can dispatch as a ticket phase,
    And the sign-off protocol requires the dispatched agent to write its outcome
      into the ticket record itself -- an atomic change to the frontmatter agents
      map, the Sign-offs checklist and the Comments section,
  When each such template's declared tools are compared against that obligation,
  Then every template that carries the obligation declares at least one tool
      capable of performing the write,
    And a template that carries the obligation while declaring no such tool is
      reported, naming the template and the obligation it cannot discharge,
    And the comparison derives BOTH sides from the templates themselves, so a
      newly added phase agent with the same mismatch is reported without anyone
      editing the check,
  So a build halts only for reasons found in the work, never because the agent it
    dispatched was required to do something its own definition forbids.
