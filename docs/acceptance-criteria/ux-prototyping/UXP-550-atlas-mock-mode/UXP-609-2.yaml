title: "The drift-guard fails when it read zero fixture records — it never passes on nothing"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given the drift-guard has asserted mock mode is active but the loaders returned zero fixture
    records for the views it checks,
  When the drift-guard evaluates drift,
  Then it exits with a failure naming the empty/absent fixtures instead of reporting clean,
  So "no drift found" can never be a vacuous pass produced by having nothing to compare.
