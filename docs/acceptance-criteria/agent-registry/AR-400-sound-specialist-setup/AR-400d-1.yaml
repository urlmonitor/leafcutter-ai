notes: |
  USER DECISION 1 (BrainCandy, 2026-10-12), BINDING: per-grant marking
  `provided_by: project`; looked up ONLY in <project>/.leafcutter/skills; absent
  -> report, not refuse (AR-400d-2).

  The last clause pins that the marking is the ONLY thing that turns a missing
  package ability into an acceptable one -- the "typo must not be rescued" rule
  from AR-400d's notes, whose L3 form is AR-400d-2-ii.
