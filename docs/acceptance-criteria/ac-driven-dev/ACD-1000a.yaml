title: "A shared epic name groups ACs into a transient shipping batch"
component: ac-driven-dev
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Given any L2/L3 AC in the store,
  When it is tagged with target_epic: EPIC-Name,
  Then all ACs sharing that same epic name form a single shipping batch,
  And when the epic ships and closes, the target_epic tag becomes historical
    context (the AC retains the tag as provenance, but the batch is done),
  And new work under the same parent L1 goal spawns a new epic name and a
    new batch — the L1 goal itself is permanent and untouched,
  And the epic lifecycle (open, in-progress, shipped, closed) is independent
    of the AC lifecycle (the AC persists regardless of epic state).
