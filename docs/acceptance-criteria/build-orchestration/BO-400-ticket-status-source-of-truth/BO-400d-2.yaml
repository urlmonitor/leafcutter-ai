notes: |
  Honours the parent's USER-CONFIRMED product decision: `failed -> signed_off`
  STAYS LEGAL. This AC's second clause is that exact transition, and it must
  keep working — the entry survives it, the transition does not. Do not "fix"
  this by making the transition illegal: agents that cannot progress past a
  `failed` value stop writing `failed` at all, which destroys the only failure
  signal that survives today. Overwriting, not the transition, is the defect.

  ABSORBED BO-400d-1 (2026-08-13). BO-400d-1 specified the persisted attempt
  count as a separate AC. It was folded in here and its file deleted, for two
  reasons:
    - SAME TWO FILES. Both landed in `templates/skills/signoff/SKILL.md` and the
      ticket frontmatter schema. As separate ACs they collided on
      `files_touched` and forced serialisation for no analytical gain.
    - NO SEPARATE `attempts:` FIELD. The count is derivable —
      `len(prior_failures[agent]) + (1 if terminal == signed_off else 0)` — and
      writing it as its own field creates two figures that must agree, i.e. a
      NEW parity surface, in a tree whose entire defect is surfaces disagreeing.
      The criteria therefore forbid the second field explicitly.
  What was kept verbatim is the crash-and-resume scenario, and it is the
  load-bearing part: `templates/skills/building-epics/SKILL.md` states outright
  that today's retry counter "is per-supervisor-invocation; it is NOT
  persisted... If a supervisor crashes, the counters reset." A scenario driven
  entirely inside ONE supervisor process would pass against that in-memory
  counter and prove nothing. Two invocations with a crash between them is what
  makes the AC discriminate between a persisted history and today's transient
  one. Any future edit that collapses it to a single invocation guts the AC.

  SCOPE BOUNDARY on rule_id — the rule_id VOCABULARY IS NOT DEFINED HERE. It is
  owned by BO-2800b, which requires each gate to declare the problem kinds it
  can report. This AC only CONSUMES that vocabulary.

  UNCLASSIFIED SPELLING IS SETTLED, do not re-open: BO-2800b-4 already defines
  the sentinel as the word "unclassified" followed by the emitting gate name
  (`unclassified/<gate>`). This AC adopts that spelling rather than a bare
  `unclassified`. An earlier draft of this AC hedged with "if BO-2800b later
  defines its own sentinel, this AC adopts it" — that hedge is removed, because
  b-4 defines it now.

  NON-GATE FAILURES — ANALYST CALL, flagged for the IT PO. BO-2800b-4 is scoped
  to findings emitted by a GATE. A coder whose tests stayed red emits no gate
  finding at all, so `<gate>` has no value to take. The criteria fill that
  position with the failing phase agent's name (`unclassified/python-coder`).
  This keeps one sentinel shape across both cases; if BO-2800's owner prefers a
  distinct namespace for agent-originated failures, this is the clause to amend
  — but the record must never be dropped for want of a rule_id, which would
  recreate the defect this L1 exists to fix one level down.

  ABSENT FIELD IS BENIGN, verified 2026-08-13: `ticket_frontmatter_guard.py`
  validates against a REQUIRED_FIELDS allowlist and does not reject unknown or
  missing optional keys, so adding `prior_failures:` does not invalidate the
  ~1,169 tickets that lack it. The last scenario pins that down as a
  requirement rather than an accident: absent means zero attempts and an empty
  history, not an error.

  BOUNDARY: append-only history sits ALONGSIDE the terminal state. Current state
  still lives in frontmatter (BO-400 unchanged), and no folder-move semantics
  are introduced.

  ENFORCEMENT: this AC states the write rule. BO-400d-3 makes it enforceable at
  commit time rather than advisory.

  OPEN — WRITE SURFACE NOT YET CHOSEN BY THE USER. These criteria place
  `prior_failures:` in git-tracked ticket frontmatter, matching where the
  terminal state already lives. The user has not yet decided whether attempt
  records belong on the git-tracked ticket or in a durable JSONL sink. If the
  sink is chosen, the shape of an entry (agent, timestamp, rule_id), the
  append-only rule, the derived-count rule and the absent-means-zero rule all
  carry over unchanged — only the location does not. Do not implement the
  location before that decision lands.
