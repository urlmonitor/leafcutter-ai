  contract: "The narrowed blocking rule in scan_ac_store._classify_ac and its independently_completable predicate. This L3 neither introduces a predicate nor changes what it means — it fixes the granularity at which the parent's predicate is applied, so it must be implemented against that rule rather than alongside it."
