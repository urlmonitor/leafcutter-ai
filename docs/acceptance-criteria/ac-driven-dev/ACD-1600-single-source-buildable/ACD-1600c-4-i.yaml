  - reason: >-
      ADDITIVE ONLY. THE CLOSING CRITERION'S STATED REASON IS UNSOUND FOR A SHARED PATH; ITS
      BEHAVIOUR IS CORRECT AND IS NOT DISTURBED. criteria, status, req_status, work_status
      (done), readiness (approved), test_spec, covered_by, implemented_by and every other
      field are UNTOUCHED -- one notes block is added and this entry. Nothing here changes
      what this record requires or what its tests assert.


      THE DEFECT. The final criterion reads "for a requirement whose work is finished, a file
      it marked to be created that now exists is neither refused nor reported, BECAUSE THE
      FINISHED WORK IS WHAT CREATED IT". The exemption is right. The causal clause is false
      whenever the path is shared between records, and shared paths are the ordinary case in
      any multi-record family that builds one module. MEASURED 2026-10-12 across the three
      paths TQ-600a-13-x declares: 15 `to_be_created` declarations, of which 3 are on the
      creating record and 12 on finished records exempted by this clause -- so the stated
      reason is true of 3 and false of 9 of the 12 it absolves.


      WHY THE WRONG REASON MATTERS WHEN THE BEHAVIOUR IS RIGHT, which is the whole point of
      recording it rather than letting it stand. The sentence reads as a COMPLETE account of
      every exempted entry, so nobody asks how many exempted entries exist or how many that
      sentence holds for. The condition is exempted rather than flagged, no gate or report
      counts it, and the explanation is what makes it look accounted-for. A wrong reason
      attached to right behaviour is a different defect from wrong behaviour, and this is the
      form it takes: not a bad outcome, an uncounted population.


      THE PRIOR QUESTION IT RESTS ON, AND THE ANSWER IS NEITHER OF THE TWO CANDIDATES.
      Whether `to_be_created` means "my own work creates this" (ownership) or "this path did
      not exist when I was authored" (a historical note). Settled in ACD-1600c-4-v as NEITHER:
      the marker is a BUILD PRECONDITION -- a claim about the tree at the moment this record's
      work is built -- so it is live while the work is pending and SPENT once it is finished.
      Ownership dies on the enum's arity (a record whose work EDITS a file a sibling CREATES
      has no honest value available, and nine of the fifteen measured declarations are that
      shape) and on severity (a false ownership claim would have to refuse, and this condition
      is advisory by explicit design). THE HISTORICAL READING DIES ON THIS RECORD'S OWN
      REFUSAL BRANCH: nothing blocks a merge over a stale dated note, so `existing` + absent
      being a BLOCKING REFUSAL is proof the field is a live claim about the tree the work will
      be built against -- which is exactly what this record's notes say when they call it "a
      claim that cannot be true of any repository state".


      SO THE CORRECT REASON FOR THIS RECORD'S EXEMPTION IS THAT THE PRECONDITION IS SPENT, and
      that reason is true of all 12 exempted entries, creator and consumer alike -- which is
      precisely what the filed reason is not. Under the settled reading zero of the fifteen
      declarations are mistakes and the nine are not stale markers to be fixed; what is wrong
      is that the live advisory cannot distinguish a precondition a sibling satisfied early
      from a declaration no record accounts for, and its wording reads as the second.


      NOTE THAT THIS RECORD'S OWN NOTES ALREADY STATE THE SOUND PREMISE -- "the marker records
      intent at authoring time" -- so the unsound clause contradicts the prose two fields
      below it. Only the criteria sentence asserts ownership, and the criteria is the field a
      reader treats as normative. FILED, NOT FIXED HERE: the criteria text is left verbatim
      per this store's convention, and the correction plus the new countability requirement
      live in ACD-1600c-4-v (readiness draft, pending the user). See also INF-600b-2's
      canonical shape list, where `declared_files[].state` is recorded as the fourth
      true-looking-and-wrong shape.
