it_requirements:
  config_schema_fragment:
    workspace_setup_permission:
      type: object
      description: "The pre-flight verdict object, emitted as one JSON line by
        scripts/worktree/check_workspace_setup_permission.py's build_verdict() and carried into
        the workflow as args.workspace_setup_permission. This is the data contract the criterion's
        charter decision now travels on. An absent or non-object value is NOT a denial -- the
        workflow reports it as a missing pre-flight and halts (plan-feature.js:2385-2396)."
      required:
        - permits
        - outcome
        - agent_id
      properties:
        permits:
          type: boolean
          description: "True only when outcome == 'granted'. The workflow proceeds past the gate on
            true and halts on anything else; it never infers permission from any other field."
        outcome:
          type: string
          enum:
            - granted
            - permission_denied
            - agent_not_found
            - read_failure
            - parse_failure
            - no_entries_collection
          description: "The distinct fact the pre-flight established. Keeping these six separable
            is what stops a failed read being reported as a charter denial (KI-ACD-009). The
            workflow renders one message per value and must never reuse one value's wording for
            another."
        agent_id:
          type: string
          description: "The agent id the workspace-setup step was pointed at, echoed back so the
            report can name it."
        location:
          type: string
          description: "Absolute path of the registry the pre-flight actually read. Present on every
            outcome except the no-repository read_failure."
        reason:
          type: string
          description: "Human-readable cause, present on read_failure and parse_failure."
        agents_type:
          type: string
          description: "Only on no_entries_collection: the type found where the agents list was
            expected."
        agents_value:
          description: "Only on no_entries_collection, and only when the malformed value is a JSON
            scalar: the value itself."
    workspace_setup_agent:
      type: string
      default: "worktree-agent"
      description: "The configured dispatch target for the workspace-setup step, read from args by
        plan-feature.js:2373 and passed to the pre-flight as --agent-id. This is the 'configured
        target' the criterion's third Then clause refers to."
  reference_file_path: "scripts/worktree/check_workspace_setup_permission.py"
  n_location_rule: "2 -- the charter verdict is RESOLVED in reference_file_path
    (_resolve_agent_outcome / build_verdict) and ENFORCED in templates/workflows-js/plan-feature.js
    (the args.workspace_setup_permission guard at ~2374-2463 and the single worktree-setup dispatch
    at ~2496-2501). The enforcement point is the load-bearing one: a verdict the workflow does not
    act on is inert, and a dispatch the workflow makes before reading the verdict is a fail-open.
    Both locations must be considered together; changing only one is either a no-op or a bypass."
  required_skills:
    - python-coder
    - test-writer
  post_write_commands:
    - "./build-self.sh"
    - "python -m pytest unit_tests/workflows/test_bo_1500f_1.py unit_tests/workflows/test_bo_1500f_1_real_registry_read.py -q"
  constraints:
    - "The permitted-agent decision must be resolved from config/agent_registry.json's permits_shell
      field, never from a hardcoded agent name, so the guarantee survives an agent rename. This is
      the constraint the two-registry differential test exists to detect."
    - "Do NOT re-add any agent() dispatch or filesystem read for this check inside
      templates/workflows-js/plan-feature.js. The E2 engine (ADR-030) contextifies the workflow body
      with exactly agent, parallel, pipeline, phase, log, args, workflow and budget -- no module
      loader and no filesystem primitive -- so the workflow physically cannot read the registry, and
      the dispatch that used to work around that is what ACD-2100b-5 removed."
    - "The halt must stay fail-CLOSED on an absent or malformed verdict. A caller that invokes the
      deployed script directly (Workflow({ scriptPath: '.leafcutter/workflows/plan-feature.js' }))
      supplies no verdict; that run must stop before any authoring agent and must report a missing
      pre-flight, never assert a permission cause it never established."
    - "No test or implementation in this record's scope may assert on the retired
      'resolve-workspace-setup-permission' dispatch label, or on any agent() call made on the
      permission check's behalf. That label no longer exists anywhere in the workflow; asserting it
      is the direct cause of this record's 5 CI failures on PR #652. The behaviour is unchanged --
      only the surface it is observable on moved."
    - "Tests must obtain the verdict by RUNNING scripts/worktree/check_workspace_setup_permission.py
      against a real on-disk config/agent_registry.json, never by hand-typing a verdict literal.
      unit_tests/_workflow_engine_harness.py's _default_args_for_script() already does exactly this
      for the permitted default; caller-supplied args override it, which is how a denial path is
      exercised. A hand-typed verdict reintroduces the precise defect recorded in this file's notes:
      the one operation that fails in production is the one the harness never performs."
    - "All source changes land under templates/ and scripts/. The deployed workflow, skill and
      script are build output."
    - "Out of scope: templates/workflows-js/plan-feature.js:1929's orphaned
      classifyWorkspaceSetupPermission() helper. See notes, 2026-09-14."
delivers_to:
  agent: python-coder
  contract: "A workspace-setup dispatch whose target agent is charter-verified to run repository commands, so its result can be trusted as a real setup attempt rather than a refusal"
expects_from: null
test_spec:
  - name: test_workspace_setup_dispatches_to_a_shell_permitted_agent
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    surface_invoked: "templates/workflows-js/plan-feature.js driven through
      run_workflow_under_e2(), taking the harness's registry-backed default
      args.workspace_setup_permission (itself a real subprocess run of the pre-flight against the
      on-disk config/agent_registry.json), with the harness's recorded agent-call list read back"
    description: "Asserts the run makes exactly one agent call labelled 'worktree-setup', then
      reads config/agent_registry.json in the test, finds the entry whose id equals that call's
      agentType, and asserts its permits_shell is True. The permitted agent id is READ from the
      registry, never written into the assertion."
  - name: test_setup_target_without_shell_permission_halts_before_any_authoring_agent
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    surface_invoked: "the same workflow run, with args overridden to point the step at a registry
      agent whose entry lacks permits_shell (args.workspace_setup_agent) and to carry that agent's
      real denying verdict (args.workspace_setup_permission, produced by running the pre-flight
      against a registry in which that id is present and not shell-permitted)"
    description: "Asserts the run terminates with status 'error' AND that the harness's recorded
      agent-call list contains no call to an authoring agent (product-owner, business-analyst,
      it-po) and no 'worktree-setup' call. The absence of the authoring dispatch is the assertion
      that matters -- a halt message alone does not prove nothing was authored."
  - name: test_mis_assignment_halt_names_both_the_step_and_the_agent
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    surface_invoked: "the terminal payload of the denial run above (its 'message'), read as the
      user-visible report"
    description: "Asserts the report contains the step name 'worktree-setup' AND the exact agent id
      it was pointed at AND the field to change ('permits_shell'), so an operator can see what was
      mis-wired without opening the source. Also asserts the denial wording is not the
      agent_not_found wording -- a present-but-unpermitted agent must not be reported as absent."
  - name: test_permission_follows_the_registry_not_a_hardcoded_agent_name
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    surface_invoked: "scripts/worktree/check_workspace_setup_permission.py executed as a subprocess
      in a fresh process against two temporary repositories, then each resulting verdict fed into
      the workflow through run_workflow_under_e2(args=...)"
    description: "Two registries differ only in WHICH agent id carries permits_shell: true. Asserts
      the pre-flight returns outcome 'granted' for the permitted id and 'permission_denied' for the
      other in each repository, and that the workflow proceeds to the worktree-setup dispatch or
      halts accordingly. An implementation that hardcodes an agent name passes the first repository
      and fails the second, so only this differential distinguishes registry lookup from a literal."
  - name: test_verdict_under_test_is_produced_by_a_real_run_against_a_real_registry
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: real_artifact
    surface_invoked: "the pre-flight script run as a subprocess against the repository's own
      on-disk config/agent_registry.json, with its stdout parsed as the verdict the other tests
      feed into the workflow"
    description: "Asserts the script emits exactly one JSON object on stdout, exits 0 even when
      denying, and that the object carries permits, outcome and agent_id; then asserts the workflow
      accepts that object unmodified through args. This is the replacement for the retired
      'real registry read' file: its old point was that the harness stubbed the registry read via
      label_responses, and the read is no longer a dispatch at all -- the equivalent guard now is
      that no test hand-types a verdict literal, so the one operation that fails in production is
      the one the tests actually perform."
test_rationale: "The behaviour under test is unchanged; only the surface it is observable on moved.
  ACD-2100b-5 took the registry read out of the workflow body -- the E2 engine gives that body no
  filesystem -- and put it in scripts/worktree/check_workspace_setup_permission.py, run by the
  plan-feature skill, with the verdict crossing into the workflow as args.workspace_setup_permission.
  So the charter decision and the dispatch are now on two surfaces, and a test must straddle them:
  the dispatch assertions still read the run's own recorded agent calls under the E2 harness (a
  source grep passes on dead code and fails on a live implementation that keeps a helper for
  another caller), while the charter assertions run the real pre-flight in a fresh process against
  a real registry file. The negative assertion -- that no authoring agent was dispatched -- remains
  the critical one, because the original incident's damage came from authoring proceeding after the
  setup step was refused, not from the refusal itself. The two-registry differential is what
  distinguishes a registry lookup from a hardcoded agent name, and it is now cheaper and sharper
  than before because the pre-flight is a directly-invokable script. The real-artifact entry exists
  because this record's own notes record the previous test set passing while broken: it stubbed the
  registry read via label_responses and thereby never performed the one operation that failed in
  production. Nothing in this set may assert on the retired
  'resolve-workspace-setup-permission' label -- that assertion is what is red in CI today, and it
  tests a mechanism that no longer exists rather than the criterion, which still holds."
