notes: |
  Authored 2026-08-17 to close the two phase_1 exit criteria in docs/roadmap.json
  that have no automated check anywhere: "clean install succeeds on a blank
  project with only skills_config.json present" and "consecutive builds produce
  zero git diff (idempotent)".

  The gap this closes is measured, not assumed: the closest existing coverage,
  unit_tests/portability/test_build_deployment.py, asserts byte-identity for the
  build_commit_guardian phase only, and tests/test_build_clean.py exercises the
  --clean flag rather than a clean install. Between 2026-08-13 and 2026-08-17
  seven consumer-install defects shipped and were hotfixed after release
  (BP-900g-4, BP-900g-5, BP-900g-6, BP-015, BP-016, BP-017, BP-018) — each one a
  script, reference, or symlink that did not resolve in a consumer layout. Those
  are the failures a real install would have caught before merge.
