priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader trying to understand why a run built work that was not eligible
    when it started,
  When they open the sequence diagram for the run's eligibility looks,
  Then it shows, in order: the set of work being fixed at the start, the first look
    deciding which pieces are eligible, those pieces being built, a piece finishing
    successfully, a further look being taken against what has finished by then, the
    newly eligible piece being built, a look that releases nothing, and the run
    ending,
    And it shows the point at which the run decides to stop as a distinct decision
      with its condition stated.

  Given the diagram,
  When it is compared against a real run over a chain four layers deep,
  Then every interaction the diagram shows occurred in that run, in the order shown,
    And the diagram shows no interaction that did not occur,
    And the stopping condition the diagram states is the condition that ended that
      run.

  Given the diagram,
  When a reader looks for what happens to work added to the body of work while the
    run is going,
  Then the diagram shows that such work is not drawn into the run's set,
  So the diagram cannot be read as promising that a run absorbs later additions.
