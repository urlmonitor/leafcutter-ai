status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Similar questions merge into one category, so each concern is weighed once.

  Questions that ask the same thing in different wording are gathered into one
  category with one preferred wording, so a decision does not weigh the same
  concern twice and the library stays small enough to browse. Grouping first
  puts together questions whose wording is identical; for each remaining
  question, Jev, the kernel's judging model, picks an existing category only
  when it is sure, and otherwise the question starts a new category of its own.
  Its groupings are suggestions a person can accept, change or undo, and only a
  person places a category under a broader one.
