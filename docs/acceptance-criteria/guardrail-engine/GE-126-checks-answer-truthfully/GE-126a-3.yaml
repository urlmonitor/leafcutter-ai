assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Every assertion must be made against the copy the build deploys under .leafcutter/. The seam is precisely the route ad-hoc verification uses, and ad-hoc verification runs the deployed copy."
  - "The seam and argv must produce the SAME outcome value for the same input, not two similar ones. Assert equality of the two outcome values in one test rather than asserting each against a literal - two literals that happen to agree today are the drift shape ACS-100i-9 exists to prevent."
  - "The seam's accepted spelling and separator must not change in this record. KI-CG-012 records that the family disagrees on both; unifying them is separate work and a change here would silently break every existing caller of this one seam while that work is unscheduled."
  - "An uninterpretable seam value must be distinguishable from an unset seam. Today both resolve to an empty collection and both return the ordinary success value; only the first is a caller error."
  - "Must not change the exit status of any commit-time invocation that passes today; the commit-time path leaves the seam unset and must remain an ordinary pass with an empty derived scope."
  - "Error handling must follow the four rules in CLAUDE.md. A malformed seam value is caller input, not an internal error, and must not be routed through the fail-open warning path that GE-116a-1-iii preserves for genuine internal failures."
test_spec:
  - name: test_seam_named_violating_record_is_refused_identically_to_argv
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "One record missing origin_agent named through the environment seam, and the same record named on argv, produce the same outcome value and name the same record - asserted by comparing the two runs to each other, not each to a literal."
  - name: test_seam_target_resolving_to_nothing_reports_unresolved
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A seam value naming a path that does not exist returns the unresolved-target outcome value GE-126a-2 introduced, not the ordinary success value."
  - name: test_uninterpretable_seam_value_is_reported_and_not_passed
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "A seam set to a value the check cannot read as a list of targets - the wrong separator and a non-path string are both exercised - reports that it could not interpret the value and does not return the ordinary success outcome. This is today's silent false pass."
  - name: test_unset_seam_still_derives_scope_and_empty_scope_still_passes
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "With the seam absent from the environment the check derives its scope as before; an empty derived scope returns the ordinary success outcome, preserving GE-126a-2-i."
test_rationale: |
  Three of the four seam states already return the ordinary success value today, and a
  test written per-state against a literal would let the seam and the argv path drift
  into two nearly-identical vocabularies — which is how KI-CG-012 arose in the first
  place. The first descriptor therefore compares the two runs to each other rather than
  to expected constants. The third descriptor is the record's reason for existing: a
  caller who misspells the separator is, today, indistinguishable from a caller whose
  targets were all clean, and that is the exact route agents and ad-hoc verification
  take. A suite that omits it leaves the seam a false-pass surface while the argv path
  is repaired.
delivers_to:
  agent: documentation-expert
  contract: "The enumerated set of honoured target routes for check_ac_governance - argv and the environment seam under its current spelling and separator - together with the four seam states and the outcome value each produces. GE-126a-4 documents these as the procedure a reader follows and GE-126a-5 states them as the reference contract. Both must name the routes for this one check rather than describing routes in general terms."
expects_from:
  - ac_id: GE-126a-1
    contract: "The resolved-target collection populated from argv, and the refusal outcome value a judged violating member produces. The seam must populate the same collection and reach the same value."
  - ac_id: GE-126a-2
    contract: "The unresolved-target outcome value. A seam target that resolves to nothing must produce this same value rather than a fourth similar one."
