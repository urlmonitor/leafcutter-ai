test_spec:
  - name: test_handoff_naming_a_known_agent_redispatches_exactly_that_agent
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The unresolved case, re-cast 2026-10-06. A phase returns a handoff naming a known agent that is a key in the ticket's agents map, and the record read-back does not confirm the re-dispatched agent's sign-off (record: false). Assert that agent was dispatched next through the normal phase dispatch, the handing-off phase was not recorded completed, no later phase ran, and the ticket stopped as cross_agent naming the target. Parametrised over TWIN_DRIVERS."
  - name: test_handoff_with_no_target_refuses_and_dispatches_no_agent
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Absent, empty and non-name targets each stop the ticket with no agent dispatched and a refusal stating the result was read and named nothing."
  - name: test_unknown_target_is_reproduced_in_the_refusal_and_never_substituted
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A handoff naming an agent the driver does not recognise refuses, quotes the value it was given, and dispatches nobody in its place."
  - name: test_ticket_body_agent_sections_do_not_supply_a_handoff_target
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "On a real ticket whose body names agents in its per-agent task breakdown and its agent-contract section, a targetless handoff still dispatches nobody and refuses identically to a ticket naming no agents — proving no inference from prose."
  - name: test_deliberate_targetless_halt_does_not_respawn_a_body_named_agent
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "The contract-shrinkage and test-drift stops emit a handoff naming no agent on purpose; on a ticket already carrying that agent's task section the drive must halt rather than re-run it."
  - name: test_unobtainable_result_and_targetless_result_refuse_distinguishably
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A phase that returns nothing readable and a phase that returns a readable handoff naming nothing both stop the ticket, and the two refusals are told apart in what the run reports."
  - name: test_handoff_routing_is_reachable_from_the_workflow_top_level_body
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: templates/workflows-js/build-feature.js
    description: "Every case above, and every continuation case below, is driven through unit_tests/prompt_assembly/_driver_harness.py executing the driver's own top-level body (build-feature.js, and build-ticket.js through TWIN_DRIVERS). No case uses an extracted helper or a source scan."
  - name: test_resolved_handoff_with_handing_phase_signed_off_resumes_normal_order
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "architect-review approves and hands off to test-writer. The record confirms test-writer's sign-off and shows architect-review signed_off. The dispatch sequence is [architect-review, test-writer, python-coder, pr-reviewer], test-writer runs once, and the ticket completes in the same drive with no re-run. Parametrised over TWIN_DRIVERS."
  - name: test_resolved_handoff_with_handing_phase_still_needed_runs_it_next
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "python-coder hands off to test-writer. The record confirms test-writer and shows python-coder still needed. The dispatch sequence is [test-writer, python-coder, test-writer, python-coder, pr-reviewer], the second python-coder returns ok, and the ticket completes. Parametrised over TWIN_DRIVERS."
  - name: test_repeated_handoff_pair_stops_as_handoff_loop
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "The same handing phase hands off to the same target a second time in one drive. The ticket stops with classification handoff_loop and the report names the chain. The target is not dispatched again, the handing phase is not recorded completed, and pr-reviewer never runs. Parametrised over TWIN_DRIVERS."
  - name: test_fourth_handoff_in_one_drive_stops_at_the_per_ticket_cap
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A chain of distinct from-to handoffs, each target itself returning a handoff, is honoured three times. The fourth stops the ticket as handoff_loop, the report names all four links, and the fourth target is not dispatched. This also proves that a target which returns a handoff is judged by the same rules. Parametrised over TWIN_DRIVERS."
  - name: test_self_handoff_is_refused_and_dispatches_no_agent
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A phase whose handoff_target names itself stops the ticket with a self-handoff reason. No agent is dispatched after it, and it is not recorded completed. Parametrised over TWIN_DRIVERS."
  - name: test_target_missing_from_agents_map_is_refused_and_dispatches_no_agent
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A handoff naming a recognised phase agent that is not a key in this ticket's agents map stops the ticket. The reason is distinct from the unrecognised-target refusal, and no agent is dispatched. Parametrised over TWIN_DRIVERS."
  - name: test_target_marked_not_needed_in_agents_map_is_honoured
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A handoff naming an agent that is in the agents map as not_needed is honoured, and that agent is dispatched next. Parametrised over TWIN_DRIVERS."
  - name: test_deferred_target_is_refused_and_the_report_names_it
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "In an epic drive through build-feature.js, a member ticket's phase hands off to pull-request, whose phase is deferred for that drive. No agent is dispatched, the ticket stops, the report names pull-request as the deferred target, and the handing phase is not recorded completed. build-feature.js only, because build-ticket.js has no epic loop."
  - name: test_unconfirmed_target_signoff_stops_the_ticket_and_dispatches_no_later_phase
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Two variants: the target returns ok but the record read-back does not show it signed off, and the record cannot be read at all. Each stops the ticket as cross_agent naming handoff_target, dispatches no later phase, and does not record the handing phase completed. Parametrised over TWIN_DRIVERS."
  - name: test_handoff_to_python_coder_runs_the_red_baseline_gate_before_the_coder
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "Through the E2 harness (unit_tests/prompt_assembly/harness_build_ticket_guard.mjs), a handoff to python-coder runs the test-requirements guard and dispatches red-baseline-gate before python-coder, exactly as a normal coder dispatch does. Parametrised over TWIN_DRIVERS."
  - name: test_epic_ticket_whose_handoff_resolves_completes_in_the_same_run
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "In an epic drive through build-feature.js, a member ticket whose handoff resolves completes in that run and is not reported as a halted ticket. This is the field case where every honoured handoff ended the ticket as blocked with 're-run /build-feature'. build-feature.js only."
test_rationale: "Handoff continuation is a property of the running driver. The same reply leads to a continued, stopped or looping ticket depending only on the record read-back and the per-drive handoff budget, so only driving the real workflow body and asserting on the dispatched agents and the reported stop can prove it. The cases are parametrised over TWIN_DRIVERS because the two drivers are separate files that ship the same behaviour, and a single-driver test would let build-ticket.js drift unnoticed, as the original scope note did. The red-baseline-gate case uses the E2 harness because that is the harness that dispatches the gate."
amended_by:
  - date: 2026-09-07
    agent: business-analyst
    reason: "The handoff-target design was reversed and this record had to follow. The first draft required the driver, on a targetless handoff, to infer its re-dispatch target by reading the `### <agent>` headings under the ticket's `## Implementation Tasks` section. Code review and follow-up verification rejected that on three grounds now recorded in the notes: the per-agent task breakdown is a general convention carried by 13 agents that answers what each agent OWES on a ticket, not who a handoff is ADDRESSED to, so it is ambiguous by construction on exactly the tickets that follow the convention best; inference converts the deliberate targetless halt emitted by python-coder's contract-shrinkage guard and test-writer's test-repair rule into a spurious agent run that looks like progress; and the template/driver skew it was justified as covering is unreachable, since build.py deploys agent templates and workflow JS in the same run from the same package. The remedy moved to the emitter — the templates now require `handoff_target` alongside the handoff — so the criteria were rewritten from inference-plus-fallback to explicit-target-or-diagnosable-refusal, adding the unrecognised-value reproduction clause, the no-inference-from-prose clause, and the unobtainable-result versus targetless-result distinction. title, test_spec and notes were rewritten in the same pass to match; BO-3000's five existing refusals are not relaxed, only strengthened. work_status, covered_by and implemented_by were deliberately left untouched — the five covering tests in unit_tests/workflows/test_bo_3000a_3700_dispatch_defects.py still encode the REJECTED design, so a green run of them is now evidence against this record rather than for it, and reconciling status here would be a claim ahead of its proof."
  - date: 2026-09-07
    agent: business-analyst
    reason: "notes only — corrected a passage that had gone stale between amendments. The first amendment left a present-tense warning that the covering tests in unit_tests/workflows/test_bo_3000a_3700_dispatch_defects.py still encoded the REJECTED inference design, so that a green run of them was evidence against this record rather than for it. That was true when written and is now false: commit 5d997855a rewrote the file, DELETING the tests that asserted the rejected inference (test_handoff_without_target_field_resolves_target_from_implementation_tasks, test_agent_contracts_subsection_is_not_read_as_a_handoff_target, test_two_candidate_agents_in_implementation_tasks_still_refuses, test_explicit_handoff_target_field_takes_precedence_over_the_record) and implementing this record's seven test_spec entries name for name; an AC-fulfilment gate verified the mapping 1:1 and flipped work_status to done on that basis. Verified before editing: the rejected-design test name no longer occurs in the file, all seven spec names are present, and the class named in covered_by still exists. Left standing as history is the sequence itself — criteria rewritten first, coverage rewritten second, and the window between them in which the record and its own tests disagreed — since that window, and the decision not to reconcile status inside it, is what the note exists to preserve; only the claim that the disagreement STILL holds was removed, because a reader hitting it would reasonably distrust a work_status the evidence supports. No other passage altered: the field evidence on the dropped GE-122d-1 ticket, the three grounds for rejecting inference, the observation about BO-3000's own unreconciled state, and the build-ticket.js scope note are all still accurate. work_status, covered_by and implemented_by deliberately untouched — the gate set them against verified evidence."
  - date: 2026-10-06
    agent: business-analyst
    reason: "user decision 2026-10-06, flag F1 (build-tooling fix design, sections 1a and 8; delivered by ticket T2). Field evidence: in an epic, every honoured handoff ended the ticket as blocked with 're-run /build-feature', and the epic loop treated that as a halt, so a handoff that had already resolved still stopped the whole run. The first scenario now also requires the target to be a key in the ticket's agents map, requires the re-dispatch to go through the normal phase dispatch (the inline re-dispatch skipped the record read-back and the checks run before a phase, so a handoff to python-coder ran the coder with no red-baseline gate), and limits 'does not advance' to while the handoff is unresolved. Two scenarios were added: once the record confirms the target's sign-off, the ticket continues, with the handing phase next if it is still needed or failed and normal order otherwise; and a handoff stops the ticket only on a repeated from-to pair in one drive, a fourth honoured handoff on the ticket in one drive, a self-handoff, a target that is not a key in the agents map, a target whose phase is deferred for this drive, or a target the record cannot confirm. The deferred-target condition is design section 1a refusal (e), for example pull-request on an epic member whose pull request the epic opens. It dispatches no agent, and the report names the deferred target. It was added at the coordinator's direction on 2026-10-06 as part of the approved T2 design, within the user's F1 approval, because a deferred phase cannot run in that drive. The two existing refusals (no target; a target that is not a phase agent) and the no-inference, distinguishable-refusal and harness-coverage scenarios are unchanged. BO-3000's 'must not advance to the next phase' still holds, because the order resumes only after the handoff is resolved. work_status moved done -> todo because the amended behaviour is not built. readiness stays approved because the user approved the amendment. covered_by and implemented_by were left as history. The test_spec entry test_handoff_naming_a_known_agent_redispatches_exactly_that_agent ('no later phase ran') and its covering test still pin the old halt-after-resolve behaviour; the IT PO re-specifies them next."
  - date: 2026-10-06
    agent: it-po
    reason: "it-po-build-tooling-fix: user decision 2026-10-06, flag F1 (build-tooling fix design, sections 1a and 8; ticket T2). Technical fields re-specified to match the amended criteria; criteria untouched. Added doc_links, assigned_agent python-coder (the surface is the two twin workflow-JS drivers), estimated_complexity M, delivers_to/expects_from null, and a structured it_requirements object, required because this AC is package-surface (python-coder + build-orchestration). It covers twin parity, the single dispatch path, the 1-per-pair and 3-per-ticket handoff budget (handoff_loop), the fail-closed confirmation, the handing-phase decision, the refusals, the size ratchet and the build.py mirrors. test_spec: test_handoff_naming_a_known_agent_redispatches_exactly_that_agent was re-cast as the unresolved case (record: false); its assertions, including 'no later phase ran', still hold. Eleven entries were added for the new unit_tests/workflows/test_bo_3000c_handoff_continuation.py, parametrised over TWIN_DRIVERS in unit_tests/prompt_assembly/_driver_harness.py. The reachability entry now names both twins. test_rationale added. In notes, the SCOPE paragraph now says both twins change. work_status, readiness, covered_by and implemented_by untouched."
