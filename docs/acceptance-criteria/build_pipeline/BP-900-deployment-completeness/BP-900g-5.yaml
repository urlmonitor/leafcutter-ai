created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g.yaml"
criteria: |
  Given KNOWN_UNDEPLOYED_ALLOWLIST in scripts/build_propagation_audit.py, which
    BP-900g-4 populated with the script references that the widened extraction
    pattern made visible but did not fix,
  When each parked entry is resolved,
  Then the six entries that have a real source in the package tree
    (scripts/changelog/emit_entry.py, scripts/next_diagram_seq.py,
    scripts/retrospective/extract_epic_facts.py,
    scripts/agent-health/generate_health_report.py, scripts/roadmap_query.py,
    scripts/package_audit.py) are deployed to the consumer tree by a build phase,
    each registered in both _get_source_deployable_scripts and
    _get_source_paths_for_guard so the two sets stay 1:1,
  And scripts/check/prod_status_check.py is resolved correctly once identified for
    what it is: status-checker.md invokes
    `python debugging/scripts/check/prod_status_check.py`, a HOST-project path
    belonging to the consumer's own repository, not a leafcutter deliverable. It
    appeared in the allowlist only because BP-900g-4's prefix allowance accepted any
    single leading segment and so mis-normalised `debugging/` into a
    `scripts/...` deploy key. The prefix is therefore narrowed to accept only an
    output root — the `{{config.output_root}}/` token or a dot-prefixed root such
    as `.leafcutter/` — after which the reference is not captured at all, and no
    deploy phase, allowlist entry, or template edit is needed,
  And KNOWN_UNDEPLOYED_ALLOWLIST is then empty, so any future reference of this
    class fails the build instead of being parked,
  And each newly deployed script is verified to actually run from the deployed
    tree (import resolution included), not merely to be present as a file,
  Because until this is done the affected capabilities — changelog-agent,
    retrospective-agent, architect-review, status-checker, the roadmap skills and
    package-audit — remain silently dead in every consumer install.
