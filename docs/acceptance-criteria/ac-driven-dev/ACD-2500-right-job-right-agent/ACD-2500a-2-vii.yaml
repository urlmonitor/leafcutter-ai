id: ACD-2500a-2-vii
components:
  - ac_driven_dev
  - ac_store
readiness: reviewed
priority: high
title: "Which protected fields a stage may change comes from one per-stage owner map; the planner's hand-back may change the assignment, the finding decision and its own enrichment fields"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the before-state of the technical planner's hand-back pass (the pass after test
    design in which the planner decides on file findings) holds ACD-9990a-1 and ACD-9990a-2,
    and ACD-9990a-2 carries one file finding with verdict "describes, does not implement"
    and no decision,
    and in the hand-back pass ACD-9990a-2's assigned_agent changes from python-coder to
    sql-coder, that finding's decision changes from none to the choice "reassign" by it-po,
    its declared_files gains the entry scripts/example_writer.py with state existing, its
    it_requirements gains the entry "Writes through the shared writer", and its delivers_to
    and expects_from contract texts change,
    and ACD-9990a-1's criteria text changes, and ACD-9990a-2's finding verdict changes to
    "consistent",
  When the requirement rule check runs at the end of the hand-back pass,
  Then no finding is raised for ACD-9990a-2's assigned_agent, the finding's decision,
    declared_files, it_requirements, delivers_to or expects_from,
  And exactly two "protected fields" findings are raised: ACD-9990a-1 field criteria and
    ACD-9990a-2 file-finding verdict, each naming the hand-back pass as the stage,
  And in a separate hand-back run whose only change is to ACD-9990a-1's test_intent, exactly
    one "protected fields" finding is raised, naming test_intent and the hand-back pass; the
    hand-back pass may never change criteria, test_intent, test_spec, a file finding's
    fields other than its decision, or a test_design_* mark,
  And the same assigned_agent change made during the test-design stage instead is reported,
    as ACD-2500a-2-vi requires,
  And which protected fields each stage may change is read from one owner map, so allowing
    one more field for one stage is a single edit to that map and changes this family's
    verdict on the next run with no other edit,
  And a stage the owner map does not list (the product owner, business analyst and the
    planner's first pass, which own these fields) is listed "not evaluated" for this family
    and is not failed by it.
depends_on:
  - ACD-2500a-2-vi
  - ACD-2500d-3-i
doc_links:
  - path: docs/acceptance-criteria/ac-driven-dev/ACD-2500-right-job-right-agent/ACD-2500a-2-vi.yaml
    relationship: related
    status: exists
    relevance: The family and the fixed protected-field list this record adds the owner map to.
  - path: docs/acceptance-criteria/ac-driven-dev/ACD-2500-right-job-right-agent/ACD-2500d-3-i.yaml
    relationship: related
    status: exists
    relevance: The planner's decision on a file finding (choice reassign / split / assignment stands, by it-po).
  - path: docs/architecture/diagrams/c3-030-requirement-rule-check-components.md
    relationship: describes
    status: exists
  - path: docs/architecture/components/ac-driven-dev.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- 'IT PO decision (the BA''s open call): the hand-back pass is named to the check as its own --stage value,
  itpo-handback. The CLI stage list, the owner map and the reference doc use that one spelling.'
- The owner map is held in exactly one place and read only by the protected-fields family; no other code
  branches on a stage name to allow a field.
- For itpo-handback the protected set also covers the test designer's outputs (file_findings verdict,
  reason, line_range, found_in, file_findings_opened_files, test_spec, test_design_* marks), and of all
  protected fields it allows only assigned_agent, each file finding's decision (it-po S3b) and the planner's
  own enrichment fields it_requirements, declared_files, delivers_to and expects_from. It never allows
  criteria, test_intent, test_spec, a file finding's fields other than its decision, or a test_design_*
  mark.
- Wiring /plan-feature to run the check with --stage itpo-handback after the hand-back pass is not in
  this record's scope (logged as a caveat).
- The itpo-handback before-state is the post-design batch (provided by ACD-2500a-2-ix's stage commit).
  Run against a pre-design before-state, the map would report every test_spec and file_findings entry
  as a hand-back edit; that is a wiring error, not a finding to tune away in the map.
declared_files:
- path: scripts/ac_store/_rc_protected_fields.py
  state: to_be_created
- path: scripts/ac_store/requirement_rule_check.py
  state: existing
delivers_to:
  agent: python-coder
  contract: 'The rule check accepts --stage itpo-handback and applies that stage''s owner map: assigned_agent,
    file_findings[].decision, it_requirements, declared_files, delivers_to and expects_from allowed; every
    other protected field (criteria, test_intent, test_spec, a file finding''s fields other than its decision,
    file_findings_opened_files and test_design_* marks) reported as a ''protected fields'' finding with
    disposition ''needs a decision''; exit 0 only on verdict passed. Consumed by ACD-2500a-2-ix''s /plan-feature
    step.'
expects_from:
- ac_id: ACD-2500a-1
  contract: 'Requirement rule-check report: findings [{file, record_id, rule_family, disposition, message,
    line, detail}], disposition one of fixed / needs a decision / failed / not evaluated; any finding
    fails the stage verdict.'
- ac_id: ACD-2500a-2-vi
  contract: Rule family 'protected fields' with its fixed protected-field list and findings carrying detail
    {field, stage, before, after}; this record adds the per-stage owner map it reads.
test_intent:
- clause: no finding is raised for ACD-9990a-2's assigned_agent, the finding's decision, declared_files,
    it_requirements, delivers_to or expects_from
  needs_test: true
  reason: The hand-back pass's allowed changes must pass, or every legitimate reassignment or newly declared
    file fails the stage.
- clause: 'exactly two "protected fields" findings are raised: ACD-9990a-1 field criteria and ACD-9990a-2
    file-finding verdict, each naming the hand-back pass as the stage'
  needs_test: true
  reason: The fields the hand-back pass must not touch, including another stage's finding verdict, must
    still be caught.
- clause: 'in a separate hand-back run whose only change is to ACD-9990a-1''s test_intent, exactly one "protected
    fields" finding is raised, naming test_intent and the hand-back pass; the hand-back pass may never change
    criteria, test_intent, test_spec, a file finding''s fields other than its decision, or a test_design_*
    mark'
  needs_test: true
  reason: Widening the hand-back's allowed set must not let it rewrite the planner's own test_intent or the
    designer's output, and only a run that changes test_intent alone shows that.
- clause: the same assigned_agent change made during the test-design stage instead is reported, as ACD-2500a-2-vi
    requires
  needs_test: true
  reason: The same change is allowed in one stage and refused in another, which only the owner map decides.
- clause: which protected fields each stage may change is read from one owner map, so allowing one more
    field for one stage is a single edit to that map and changes this family's verdict on the next run
    with no other edit
  needs_test: true
  reason: Single-sourcing the owner map is the deliverable, and a second place allowing fields would only
    show when they drift.
- clause: a stage the owner map does not list (the product owner, business analyst and the planner's first
    pass, which own these fields) is listed "not evaluated" for this family and is not failed by it
  needs_test: true
  reason: Stages that own these fields must not be failed by this family, or the PO, BA and first planner
    pass could never complete.
test_spec:
- name: test_handback_allowed_changes_raise_no_finding
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Tmp git repo via init_git_repo/commit_all from _rule_check_fixtures: the before-state
    records are committed, the stage''s edits are written uncommitted, and the check runs with --before-ref
    HEAD. Stage itpo-handback. ACD-9990a-2''s assigned_agent python-coder -> sql-coder, its one finding''s
    decision none -> {choice: reassign, by: it-po}, its declared_files gains {path: scripts/example_writer.py,
    state: existing}, its it_requirements gains ''Writes through the shared writer'', and its delivers_to
    and expects_from contract texts change: no ''protected fields'' finding names assigned_agent, the
    decision, declared_files, it_requirements, delivers_to or expects_from. Control in the same run: ACD-9990a-1''s
    criteria change is reported.'
  proves_clause: no finding is raised for ACD-9990a-2's assigned_agent, the finding's decision, declared_files,
    it_requirements, delivers_to or expects_from
  code_file: scripts/ac_store/_rc_protected_fields.py
  to_be_created: true
  convention_test_file: unit_tests/ac_store/test_acd_2500a_2_iv.py
  must_catch:
  - an owner map that still allows only assigned_agent and the decision, so the newly declared file fails
    the stage
  - it_requirements allowed as a whole for itpo-handback but compared per key, so a new list entry is
    still reported
- name: test_handback_reports_criteria_and_finding_verdict
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Same scenario plus ACD-9990a-2''s finding verdict changed to ''consistent'': exactly two
    ''protected fields'' findings, (ACD-9990a-1, criteria) and (ACD-9990a-2, the file-finding verdict),
    each ''needs a decision'' and each naming stage itpo-handback.'
  proves_clause: 'exactly two "protected fields" findings are raised: ACD-9990a-1 field criteria and ACD-9990a-2
    file-finding verdict, each naming the hand-back pass as the stage'
  code_file: scripts/ac_store/_rc_protected_fields.py
  to_be_created: true
  convention_test_file: unit_tests/ac_store/test_acd_2500a_2_iv.py
- name: test_handback_test_intent_only_run_raises_exactly_one_finding
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Tmp git repo via init_git_repo/commit_all from _rule_check_fixtures: the before-state
    records are committed, the stage''s edits are written uncommitted, and the check runs with --before-ref
    HEAD. A separate store, stage itpo-handback, whose only change is to ACD-9990a-1''s test_intent (one
    clause''s needs_test flipped): exactly one ''protected fields'' finding, (ACD-9990a-1, test_intent),
    ''needs a decision'', naming stage itpo-handback. Parametrized with one more lone change each: a test_spec
    entry''s description, a file finding''s reason, and test_design_authorship.date; each gives exactly
    one finding naming that field.'
  proves_clause: in a separate hand-back run whose only change is to ACD-9990a-1's test_intent, exactly
    one "protected fields" finding is raised, naming test_intent and the hand-back pass; the hand-back
    pass may never change criteria, test_intent, test_spec, a file finding's fields other than its decision,
    or a test_design_* mark
  code_file: scripts/ac_store/_rc_protected_fields.py
  must_catch:
  - test_intent allowed for itpo-handback because the planner authored it
  - the test designer's outputs left out of the itpo-handback protected set, so a test_spec or test_design_*
    edit passes
  - a file finding compared only on its decision, so a changed reason is not reported
  to_be_created: true
  convention_test_file: unit_tests/ac_store/test_acd_2500a_2_iv.py
- name: test_same_assignment_change_reported_at_test_design_stage
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: boundary
  description: The identical on-disk change and before-state checked with --stage test-design reports
    assigned_agent; with --stage itpo-handback it does not. Only the stage differs.
  proves_clause: the same assigned_agent change made during the test-design stage instead is reported,
    as ACD-2500a-2-vi requires
  code_file: scripts/ac_store/_rc_protected_fields.py
  to_be_created: true
  convention_test_file: unit_tests/ac_store/test_acd_2500a_2_iv.py
- name: test_owner_map_is_the_single_source
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'In process, stage itpo-handback, a store whose only disallowed hand-back change is ACD-9990a-1''s
    criteria: the baseline run fails with that one finding; with the module''s owner map monkeypatched
    to also allow criteria for itpo-handback, the next run on the same store passes with no other edit;
    restoring the map restores the finding.'
  proves_clause: which protected fields each stage may change is read from one owner map, so allowing
    one more field for one stage is a single edit to that map and changes this family's verdict on the
    next run with no other edit
  code_file: scripts/ac_store/_rc_protected_fields.py
  must_catch:
  - an extra `if stage == 'itpo-handback'` branch outside the owner map, so editing the map does not change
    the verdict
  - the allowed fields copied into a second constant in requirement_rule_check.py
  to_be_created: true
  convention_test_file: unit_tests/ac_store/test_acd_2500a_2_iv.py
- name: test_stages_outside_owner_map_listed_not_evaluated
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: boundary
  description: 'Parametrized over --stage po, ba, itpo with the same criteria change: every record gets
    ''not evaluated'' from ''protected fields'' and no blocking finding from it; the family never fails
    the verdict at these stages.'
  proves_clause: a stage the owner map does not list (the product owner, business analyst and the planner's
    first pass, which own these fields) is listed "not evaluated" for this family and is not failed by
    it
  code_file: scripts/ac_store/_rc_protected_fields.py
  to_be_created: true
  convention_test_file: unit_tests/ac_store/test_acd_2500a_2_iv.py
- name: test_itpo_handback_stage_reachable_from_cli
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: reachability
  description: 'Entry point: requirement_rule_check.py as a subprocess with --stage itpo-handback --before-ref
    HEAD on the tmp git repo: the stage is accepted (no ''unrecognised --stage'' finding), exit 0 when
    only the six allowed fields (assigned_agent, the decision, declared_files, it_requirements, delivers_to,
    expects_from) changed. Control: an unknown stage still fails.'
  proves_clause: no finding is raised for ACD-9990a-2's assigned_agent, the finding's decision, declared_files,
    it_requirements, delivers_to or expects_from
  code_file: scripts/ac_store/requirement_rule_check.py
