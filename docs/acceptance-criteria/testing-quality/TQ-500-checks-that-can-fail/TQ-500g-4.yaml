assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  - agent: python-coder
    ac_id: TQ-500g-1-i
    contract: "One shared reading of a test run in which a test whose any sub-case failed is failed, and a run that reports overall failure with no identifiable failed test is inconclusive (TQ-500g-4-i). The wrong-version runs read their runs through it, never through a copy."
expects_from: null
it_requirements:
- 'One shared reading. Every reader goes through the same function: done_proof._run_pytest_and_parse,
  done_proof_kind_support._run_pytest_with_kind_plugin, and through them fast_lane.verify_red_baseline,
  heavy_lane_gate and later the wrong-version runner. No caller keeps a private regex or outcome table.'
- scripts/ac_store/done_proof.py is over the 400-line file-size ratchet (1264 counted lines) and must
  not grow. New parsing logic goes in a sibling module under scripts/ac_store/; any line added to done_proof.py
  is offset by moving existing parser code out, so its counted length stays the same or drops.
- The new sibling module has no leading underscore, because it is imported from scripts/build_orchestration/
  (see the naming note in done_proof_kind_support). Register it in AC_STORE_DEPLOY_MAP (scripts/build_phases_ac_store.py),
  or the deployed gates crash on import.
- 'Keep the {nodeid: outcome} return contract and its outcome words unchanged for every existing caller:
  PASSED, FAILED, XFAIL, XPASS, SKIPPED, ERROR. Failed sub-case names go through an additive side channel,
  never as new outcome strings.'
- A node id with at least one SUBFAILED line reads FAILED, whatever its own result line says. SUBPASSED
  lines are informational only and never turn a FAILED or ERROR test into a pass.
- Must read pytest 8 output (no SUBFAILED lines; requirements-dev.txt allows pytest>=8.0) and pytest 9
  output, with no regression on either. Tests use the installed pytest and must not assume one major version.
- The done-proof reason and the red-baseline verdict entry both name each failed sub-case by the parameters
  pytest prints for it.
- The red-baseline gate still makes exactly one pytest run per call.
- 'Rebase onto TQ-500f-3-iii''s shared tag-matching module (on main via PR #926) before building. Keep
  the {nodeid: outcome} contract that module consumes.'
test_spec:
- name: test_subfailed_test_read_identically_by_done_proof_and_red_baseline
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: integration
  angle: seam
  description: A real pytest run of a fixture module with S1 (one failing subTest 'retry_due unset'),
    S2 (two passing subTests) and S3 (plain failing test) is read through both production readers. Both
    give S1 FAILED naming 'retry_due unset', S2 PASSED and S3 FAILED, as identical maps.
  must_catch:
  - parser ignores SUBFAILED lines
  - only the done-proof path reads SUBFAILED lines; the red-baseline path keeps a private parser
- name: test_done_proof_refuses_requirement_covered_only_by_subfailed_test
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: integration
  angle: reachability
  surface_invoked: scripts/ac_store/done_proof.py (verify_done_eligible CLI path)
  description: Through done_proof's production entry point, with a real pytest run, a requirement covered
    only by S1 is judged not eligible for done, and the reason names the failed sub-case.
  must_catch:
  - SUBFAILED downgrade applied in the red-baseline path only
- name: test_red_baseline_counts_subfailed_test_red
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: integration
  angle: reachability
  surface_invoked: python scripts/build_orchestration/fast_lane.py verify_red_baseline
  description: fast_lane.py verify_red_baseline, run as a subprocess over the same fixture, lists S1 as
    red at baseline and not as green at baseline.
- name: test_test_with_only_passing_subcases_stays_passed
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: integration
  angle: discrimination
  description: S2, whose sub-cases all pass, still reads PASSED at both checks. This is the control against
    a fix that fails every test that has sub-cases.
  must_catch:
  - any test with sub-cases read as FAILED
  - SUBPASSED lines read as failures
- name: test_deployed_gate_reads_subfailed_as_failed
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: integration
  angle: deployed
  description: After build.py deploys into a temp target, the deployed verify_red_baseline, run in a fresh
    subprocess, imports the new sibling reader and reads S1 as red.
  must_catch:
  - new sibling module missing from AC_STORE_DEPLOY_MAP
test_rationale: The defect sits in one line format of real pytest output, so each test feeds a REAL pytest
  run (a fixture module with self.subTest cases), never a hand-typed stdout string. The seam test holds
  both production readers to one verdict. That is the 'one shared reading' clause. The deployed test covers
  the ratchet-driven move into a new sibling module, which ships through a hard-coded deploy map.
