id: GE-124b-1-i
readiness: approved
priority: high
title: "A CSS class is never read as a pin"
component: guardrail-engine
components:
  - frontend_coding
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124b.yaml"
criteria: |
  Given a staged screen component file containing the element
    `<span class="stock stock--out ac-UXP-100d-2">`
  And the file contains no `data-ac` attribute
  When the element-pin reader evaluates the file
  Then no pins are recorded for the file

  Given a staged screen component file containing the element
    `<span class="stock stock--{status}" data-ac="UXP-100d-2">`
  When the element-pin reader evaluates the file
  Then one pin is recorded with the criteria ["UXP-100d-2"]
  And the value of the `class` attribute contributes nothing to the recorded
    criteria
depends_on:
  - GE-124b-1
doc_links:
  - path: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124b-1.yaml"
    relationship: parent
    status: exists
