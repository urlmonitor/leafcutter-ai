notes: |
  SOURCE REQUEST (the user's, verbatim, for traceability): "update product truth
  so that we have a way to split goals (and other things), then have PO, BA and
  IT PO file the respective ACs to enable this."
  The product truth is approved and committed on ac-authoring/split-compound-goals:
  decisions.mock.json v3 (Decomposition), the mockups decision-split-approve and
  decision-split-progress, and decision-forming.flow.json v2.

  LIVE CASE. Run run-40d2159630bb48bd (2026-10-02) was blocked at routing
  (no_match, reason jev_none; gap unsupported), because the decision capability
  takes one bounded question and the goal held four decisions. The orchestrating
  Claude Code session split it by hand outside the kernel into G1-G3, and the
  user picked "format first". G1 ran as run-3bba494c7c9b48ce and staged
  dec-93c1c730463c1f3c, the storage decision the DK-300 tree rests on. G3 was
  settled by the user directly, and G2 (clustering method) is still open. Mock
  record: dcp-reusable-criteria-by-hand.

  SUPERSESSION. Both earlier tickets are superseded by this tree. Neither is
  edited here; retire both as superseded once these ACs merge.
    - TICKET-20261002-KernelDecomposeMultiPartGoal (open PR #995; the file is on
      branch docs/kernel-tickets-criteria-reuse, not on main or this branch):
      the routing-failure case, run-40d2159630bb48bd.
    - TICKET-20261001-KernelCompoundGoalSplit: the accepted-as-one case,
      run-5d246775f5e54f11. There, routing DID give a goal bundling five
      sub-decisions to the decision capability, which answered it as one
      pick-one-of-N. DK-400a now covers this case too (user decision 2026-10-05),
      and DK-400e covers its "one decision record per sub-decision, linked to the
      goal".

  DECISIONS AT THE PO GATE (2026-10-05). These answer the PO open questions.
  Where an L1's notes still call one of these "open", this list wins:
    Q1 (the user, directly): YES. A bundled request is also offered as a split
       when the kernel WOULD accept it as one decision, not only when it is
       turned away. A single question is still never split, and an unhandled
       single question stays a capability gap (DK-400a).
    Q2 (PO recommendation, the default the BA uses; DK-400a, DK-400c):
       - fewer than 2 bounded parts means it was one question: no split gate
         is shown;
       - more than 5 means either asking the person to narrow the request, or
         offering 5 parts and listing the rest read-only as not covered;
       - never a silent drop.
    Q4 (PO recommendation, default; DK-400f): hand splits made outside the
       kernel are history only. The kernel does not record them.
    Q5 (PO recommendation, default; DK-400e): when a part cannot be settled,
       the parts that depend on it are marked not run with the reason, and
       independent parts carry on.
    Q6 and Q7 (left to the IT PO): how deep nested splits may go, and whether
       a person may add new parts or change a part's dependencies or kind at
       the gate.
    Q8: priority is set at the final gate.
    REJECTION (the user, directly, 2026-10-05; DK-400d, DK-400f):
       - When the person rejects the split of a request the kernel would have
         accepted as one decision (trigger bundled_accepted, the "squeezed
         into one choice" case), the request goes ahead as ONE decision,
         exactly as today. The run is not blocked.
       - When the person rejects a split found mid-run (found_at mid_run, no
         trigger), the work item goes ahead as one, like bundled_accepted
         (the user, directly, 2026-10-05).
       - Only a rejected split of a request the kernel turned away (trigger
         jev_none or ambiguous) ends the run blocked, with the plain note
         that nothing was decided.
       - In every case the report keeps one plain line saying a split was
         offered and rejected (the PO recommendation, confirmed as the
         default; DK-400f).

  SETTLED. Do not re-open these at L2:
    1. Proposing the split is generative work done by the host (Claude Code),
       a person approves it, and Jev only selects or judges (ADR-053).
    2. Only a person answers the split gate, recorded as human:<name> with the
       time; a model never does (ADR-060).
    3. The split is generic: subject_kind goal | research_request |
       decision_question, and found_at routing | mid_run.
    4. A proposal is 2 to 5 parts, and every part quotes its span of the subject
       verbatim. A proposal without a verbatim quote is dropped and shown at the
       gate read-only with its reason.
    5. Parts run one after another, in dependency order. Parallel children are
       out of scope (KernelDecomposeMultiPartGoal, Out of Scope).

  WORDING MAP FOR BA / IT PO (customer word -> record or flow term):
    - "request" -> the subject (Decomposition.subject_text, subject_kind)
    - "turned away" -> routing no_match with reason jev_none, or an ambiguous gap
    - "squeezed into one choice" -> routing matched one capability (decision)
      for a subject that holds several questions. split-detect covers it
      since flow v4 (now v5), and the mock data records it as trigger
      bundled_accepted (mock data v5; see DK-400a)
    - "an ability the kernel lacks" -> a capability-gap record (unsupported)
    - "split" -> a Decomposition record
    - "part" -> parts[]; "the words it covers" -> covers;
      "the parts it waits for" -> depends_on;
      "needs a decision or research" -> child_capability
    - "set aside" -> dropped[] (read-only, with reason)
    - "approval step" -> the split gate, screen decision-split-approve
    - "reword" -> review edited, with proposed_text kept;
      "leave out" -> review left_out; "reject" -> gate_answer rejected, with
      run_status blocked only for a turned-away request (jev_none, ambiguous);
      a rejected bundled_accepted or mid_run split "goes ahead as one"
    - "found along the way" -> found_at mid_run, work_item_depth 1 or more
    - "decision record linked back" -> Decision.split_part (a derived reverse view)
    - "one view" -> screen decision-split-progress;
      "final report" -> the report.md split section (report_lines)

  ROADMAP ALIGNMENT. phase_kernel_1_founding (active). Its first exit criterion
  asks for a question answered "traceable end to end without hidden host-side
  orchestration", and the hand split of the live case is exactly that hidden
  orchestration. Its second asks for countable capability-gap records; DK-400a
  keeps those counts honest in both directions (a compound request is not
  counted as a gap, and a real gap is not hidden behind a split). No roadmap
  change is proposed.

  FOR THE IT PO (how safely; the PO adds no constraint here): the
  KernelDecomposeMultiPartGoal ticket also asks for a configured bound on child
  work per run, an off switch that restores today's behaviour, and an ADR with a
  pinned number (requires_adr: true; dispatch adr-author directly). ADR-055 may
  apply if the new host operation needs a registry entry. Cost: with Q1 widened,
  every routed request, not only every jev_none, now needs a "one question or
  several?" check. ADR-053's order (deterministic code, then Jev, before any
  generative call) matters more as a result.

