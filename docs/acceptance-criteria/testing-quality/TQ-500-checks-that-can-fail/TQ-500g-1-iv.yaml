  constraints:
  - The preparer is an agent that wrote neither the code nor the tests (user decision Q1). So it is not
    test-writer and not the coder. Build-time decision dec-124faaaa3d814050 (2026-10-07) chose the new
    dedicated agent test-breaker, registered through the add-agent-to-package procedure (config/agent_registry.json,
    docs/agents/README.md). Decision Kernel run run-92227a2a275f44ff (2026-10-11) made it read-only. Its
    tool allowlist is Read only. It lets it read the code, but not write any file or run tests (no Write,
    no Edit, no Bash or other shell, no Agent, no search tools).
  - It writes nothing. Its only output is the reply described in delivers_to (TQ-500g-1-ix). It never edits
    the working tree (the runner applies each alteration), never runs tests, and never says whether a test
    would catch a wrong version.
  - Each named wrong version gets exactly one entry, under its name verbatim. A name it cannot prepare gets
    'could_not_prepare' with a one-line reason, never a silent omission. The fix-undone aliases ('revert
    the fix', 'the fix undone') are not prepared (TQ-500g-1-i).
  - Each alteration changes only what its name says. The diff shown next to the name is the evidence a reviewer
    checks. The writer (TQ-500g-1-ix) computes that diff from the replacements; the agent supplies none.
  - 'The template passes prompt-audit: signoff protocol, spawn_allowlist, no compound bash, and a tool allowlist
    that matches the body. For this agent signoff is false and it holds no Agent tool, so checks 4 and 5
    are N/A, and check 2 reports no tool named in the body outside Read.'
  - 'Writer split (run-92227a2a275f44ff): the writer step TQ-500g-1-ix, which is code and not an agent, validates
    the reply, makes the altered copies, computes every diff and writes the alterations manifest the runner
    (TQ-500g-1-i) reads. The agent never produces a copy, a diff or the manifest, and its reply never reaches
    the runner directly.'
  - 'Dispatch inputs: work_key, repo_root (the absolute working-tree root; the Read tool takes absolute paths
    and the agent cannot ask git for it), requirement_ids, and wrong_versions (each named wrong version with
    its in-scope source files, repo-relative POSIX). manifest_path and copies_dir are no longer inputs.
    The reply is the one JSON value in the delivers_to entry for TQ-500g-1-ix.'
  - 'Exact names (TQ-500g-1-ix decision): the writer matches a reply name to an owed name exactly, so the agent
    answers every dispatched spelling under that exact spelling. It merges only names that are identical
    strings, never names that differ by case or spacing. Merging those would leave the second spelling
    "no alteration returned".'
  - 'Tier and visibility (ADR-033): Sonnet, because each prose name needs judgement and is not a fixed recipe.
    Internal, so the description takes the internal shape and spawned_by never names ''user''. Narrowing
    to Read, below the Sonnet floor, needs no justification block (section 2.8). requires_verification
    is false and permits_shell is false: the agent holds no Write or Edit, so the post-edit verification
    block, which needs a shell, does not apply.'
  - 'Spawn reciprocity: spawned_by names exactly the four dispatching routes: fast-lane-ship.js (TQ-500g-1-v),
    build-feature.js and build-ticket.js (TQ-500g-1-vi), and ticket-supervisor (TQ-500g-1-vii). The build''s
    asymmetric-spawn check and the check-agent-spawn-consistency hook must pass. The __ticket_phase_agents__
    wildcard does not cover a non-phase agent, so ticket-supervisor''s spawn_allowlist gains test-breaker.
    If a workflow-script caller is not exempt in that check (the docs name only user and finalize-feature.js;
    fast-lane-ship.js already appears on command-step-runner), raise it as a blocker. Never invent a reciprocal
    entry.'
  - 'Registry category research (IT-PO decision, on llm-expert''s recommendation). research defaults to signoff_capable
    false, no required inputs and no spawning. That matches a read-only internal agent that replies with
    JSON, like ac-triage and pt-classifier. testing would default to signoff_capable true and a required
    ticket_path, and the fast lane has no ticket. produces stays test_artifact: the category sets defaults,
    not the artifact type.'
  - The registry entry and the build-generated card match the template frontmatter (tools, model, produces,
    visibility). Deployed/template parity comes from the build (ADR-001).
test_required: false
test_rationale: 'Prompt-only. How faithfully an LLM turns a prose name into code cannot be unit-tested,
  and a template text search is forbidden (CLAUDE.md). Deterministic backstops bound the damage: TQ-500g-1-ii
  refuses an alteration that does not load or changes nothing; the runner treats a missing or could_not_prepare
  entry as unfinished; and TQ-500g-1-i ignores any outcome claim. Substitutes: pr-reviewer against the
  Then clauses, and an eval row for the preparer under TQ-200 once the agent exists.'
