notes: |
  WHY A NEGATIVE PROMISE EARNS ITS OWN RECORD. Every other child of BO-3800 is satisfied by
  a system that summons a specialist. Each of them, alone and together, is also satisfied by
  a system that summons one on EVERY refusal — which would be cheaper to build, would pass
  every positive arm, and would be a serious regression: it dispatches a restructuring
  specialist to remove two lines for a typo fix, it collides head-on with BO-210's
  same-agent promise across that promise's entire population, and it makes the urgent
  one-line correction expensive in exactly the way GE-127f's second decision ("zero addition
  costs nothing") exists to prevent. GE-127f-3's notes name the over-broad reading as one of
  its two mutations for the same reason. Without this record, the cheapest implementation of
  this tree is the one that breaks the most.

  IT IS ALSO THE SEPARABILITY EVIDENCE. If this record's arms stay green while the other
  four are broken and repaired, the tree is not one promise written five times. That is the
  store's established way of showing siblings are not duplicates, and it should be carried
  into decomposition as a required observation rather than asserted in prose.

  WHAT "EXACTLY AS TODAY" MEANS, SO IT IS NOT READ AS A FREEZE. It means the outcome and the
  parties involved are unchanged for work that is accepted and for refusals that do not ask
  for another craft. It is not a claim that no code changes, and it must not be decomposed
  into a criterion about which files were edited.
