id: TQ-600a-6
components:
  - testing_quality
  - build_pipeline
title: "The run says how many times it really deployed the package, and that figure is bounded by the tests that needed their own copy"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given any run of the suite, however it is spread across workers,
  When the run finishes,
  Then the run states, in its own output, the number of times a real package deploy
    was executed, so the figure is observable without timing the run,
    And the same figure appears as a named field in the durable cost record, so a
      later reader recovers it from the artifact rather than from console text,
    And the figure counts deploys that were actually executed, not requests for a
      layout: a layout handed out many times within one run is reported as the one
      deploy that produced it,
    And the figure is stated for the whole run and not for one worker: a run spread
      across several workers in which the layout was produced once reports one, and a
      run in which each worker produced its own reports the number of workers, so a
      per-worker multiplication is visible in the figure rather than hidden by it,
    And across a full run the figure is no greater than one plus the number of tests
      that DECLARED they must have a copy of their own, with both numbers taken from
      the run's own record rather than from any figure written into a test,
    And a test that took a copy of its own WITHOUT declaring why does not widen that
      bound — it is reported as a figure of its own, so a run still carrying tests
      that deploy their own copy unconverted breaks the bound rather than loosening
      it, and the bound is at its tightest while the migration is least done rather
      than at its loosest.
depends_on:
  - TQ-600a
  - TQ-600a-1
