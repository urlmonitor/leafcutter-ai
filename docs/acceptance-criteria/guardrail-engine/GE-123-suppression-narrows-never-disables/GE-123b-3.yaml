notes: |
  THIS IS THE DEFINITION CRITERION, and it exists because the invariant has a
  failure mode in the opposite direction from the one that prompted it. Every
  other criterion under GE-123b pushes towards refusing more entries. Left
  alone, that pressure produces an implementation that refuses ordinary,
  well-scoped suppressions and warns about clean files — which on a check that
  runs on every commit is its own outage, and which would put GE-123b in direct
  conflict with its sibling GE-123a-2.

  THE CONTRADICTION IT RESOLVES, stated plainly for whoever implements this.
  GE-123a-2's third arm requires that suppressing the only finding a file
  genuinely produces keeps working. GE-123b requires that no suppression takes a
  file's effective coverage to zero. These are only compatible under one reading
  of "coverage": the RULES still able to report on the file, not the FINDINGS it
  currently produces. Under that reading GE-123a-2's arm suppresses one of the
  six live rules on that file and leaves five, which is a narrowing; whereas the
  measured collapse left the file with one live rule and then removed it. If a
  future change ever makes rule applicability genuinely file-dependent, this is
  the criterion that has to be revisited first.

  MEASURED TODAY, end-to-end through the multi-file entry point (2026-08-18):
    - arm 1 baseline: 0 findings, clean exit, no warning — ALREADY CORRECT.
    - arm 2 baseline: 0 findings, clean exit, no warning — ALREADY CORRECT.
  Both arms are therefore green on arrival, deliberately and by design. They are
  the guard rails on this L1, not the change it asks for; a green result here is
  expected and is not a TDD-order violation. They fail only if an implementation
  of GE-123b-1, GE-123b-2 or GE-123b-4 over-reaches, which is exactly what they
  exist to catch. The third arm's silence requirement is scoped to the
  lost-coverage warning specifically, so that it cannot be read as forbidding
  whatever GE-120a decides about unreadable files.

  Ordinary source filenames throughout — no env-named file appears here, per the
  tree-wide authoring constraint. Every arm must be exercised through the
  multi-file entry point with real files on disk.

  IT-PO RE-VERIFICATION (2026-08-18, before enrichment): both baselines were
  re-measured through scan_files with real files on disk and a real allowlist in
  the same temporary root — 0 findings, clean, silent in each case — matching the
  BA's figures. The unreadable-file arm was also exercised: a path that does not
  resolve produces no finding and no output on either stream, because scan_file
  swallows the read error and returns an empty finding list.
