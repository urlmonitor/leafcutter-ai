readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given someone recording a new fault,
  When they read the reference entry for the fault register,
  Then it states what a reference must carry to be checkable — a requirement named
    by its id, and a place named together with what is expected to be found there,
    And it states what happens to a reference that carries less than that: reported
      as unverifiable rather than as sound.

  Given the reference entry,
  When someone records an entry exactly as it describes and the check is run,
  Then the references in that entry are decided as the entry says they will be,
  So the documented format is verified against the check rather than asserted.

  Given the reference entry,
  When a reader looks for what an unflagged entry means,
  Then it states that an unflagged entry means only that the kinds of staleness the
    check looks for were not found in it,
    And it names the kinds it does not look for,
  So no reader takes an unflagged entry for a true one.

  Given the reference entry,
  When the flag kinds it documents are compared against the flag kinds the check
    emits,
  Then every kind it documents is one the check emits, and every kind the check
    emits appears in it,
  So the documented vocabulary cannot drift from the emitted one.
