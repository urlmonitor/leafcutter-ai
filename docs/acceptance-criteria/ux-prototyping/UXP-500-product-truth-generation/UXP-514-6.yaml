id: UXP-514-6
title: "An index field copied from an artifact is compared against that artifact"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a store index in which the description recorded against a journey differs from the
    description in the journey file itself,
  When the record is checked,
  Then the check reports that artifact, naming the artifact, the field, and both values,
  And every scalar field the index copies from a source artifact is compared, not only the
    derived lookups,
  And an artifact whose copied fields all match its source is not reported,
  And the check states how many artifact fields it compared, and that figure rises when an
    artifact is added.
