criteria: 'Given the coding agent receives a query-gap build request within the supported recipe language

  When it supplies a new relationship-path or filter recipe with a proposed catalog description

  Then the trusted query compiler produces repository- and generation-scoped parameterized Neo4j execution with
  enforced limits

  And the candidate can express a new supported query, not only rename an existing operation

  And supplied text and bound values cannot add executable clauses or escape scope

  And independent validation executes positive expected-result, empty-result, foreign-scope and invalid-input cases
  plus a recorded evaluation against the requested result meaning

  And the build produces a reviewable candidate, compiled query and matching test/evaluation evidence before any
  activation

  And the agent claiming success, an unrelated passing test or an unverified receipt cannot activate the candidate

  And requests outside the compiler language remain explicit code-build gaps rather than executing arbitrary proposed
  Cypher.

  '
