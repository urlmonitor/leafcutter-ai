assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "DESIGN DECISION (confirmed): the no-config safe default is report-only — the most conservative of the two non-blocking options. With neither the commit_guardian.json `testing_quality.enforcement_mode` key NOR the LEAFCUTTER_TEST_ENFORCEMENT_MODE env var set, the active mode is report-only."
  - "A fresh consumer install (no config, no env) must never be blocked nor have any test silently excluded until the project explicitly opts in — absence of config can only ever yield report-only, never exclude-unbuilt and never blocking."
  - "The default must be the documented constant report-only, not a date-derived or otherwise implicit runtime choice."
