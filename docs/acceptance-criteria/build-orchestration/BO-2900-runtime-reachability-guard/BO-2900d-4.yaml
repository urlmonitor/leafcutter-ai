criteria: |
  Given the exemption mechanism is in place,
  When an author whose code has been reported as having no way in consults the
    project's task-oriented documentation,
  Then a how-to guide gives the decision first — wire the code in, or exempt it — and
    states that exempting is correct only when the code is genuinely used by other
    code and will never be reached on its own,
    And it shows how to record an exemption, including where it goes and what the
      reason must say,
    And it states that the exemption covers only the item it names, so a sibling needs
      its own decision and its own reason,
    And it shows how to see every exemption currently in force,
    And it states that an exemption is not the route past a stale automation call or
      an uncalled capability, naming the guides for those instead.
