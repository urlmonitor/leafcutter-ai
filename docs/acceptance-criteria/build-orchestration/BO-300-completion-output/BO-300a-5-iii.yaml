notes: |
  THE THIRD REMEDIATION-INDUCED DEFECT IN THREE CONSECUTIVE ROUNDS, AND ALL THREE HAVE
  THE SAME SHAPE. A remedy makes a previously inert or silent path active or
  authoritative, and the guard is not extended to that path. BO-300a-5 added the
  completion-time re-read; BO-300a-5-i had to add the fail-closed and no-false-alarm
  boundary the re-read opened. BO-300a-5-ii made the success path assert the
  epic-complete verdict affirmatively, where previously it said nothing; that turned
  this record's branch -- removals with no additions -- from an absent field into an
  authoritative claim on a payload that already contradicted itself. Each remedy was
  correct in what it changed and incomplete in what it reached. The reusable lesson is
  to enumerate the branches a remedy newly makes load-bearing, not only the branch it
  was written for.

  THE OBSERVED PAYLOAD. A reviewer drove a real two-ticket epic and captured a single
  completion output that reported both tickets completed by name, then reported one of
  those same tickets as planned work that was not built, and certified the whole thing
  with a success outcome value and an affirmative epic-complete verdict. One piece of
  work, two opposite statements, one certification over both.

  WHY THE PARTITION IS THE FIX AND WORDING IS NOT. The driver treats every removal as
  unbuilt work, and that is the actual error: a removal and a completion are independent
  facts, and the payload already holds both. The ordinary cause of a removal is a
  lifecycle move made by the drive that finished the ticket, so under the current
  treatment a perfectly successful epic looks unfinished the moment it tidies up after
  itself -- which is why withholding unconditionally is not an acceptable fix. What
  remains genuinely alarming is planned work that neither completed nor still exists:
  nothing anywhere can assert it was done, and the claim must be withheld for it exactly
  as it is for work discovered after planning.

  WHY THE SUITE COULD NOT SEE IT. The contradiction detector recognises a disagreement
  only by the phrases not complete and incomplete. The removals branch says the work was
  not built. That is the same contradiction in different words, and the check written to
  catch this exact class waved it through. The check's coverage is therefore part of this
  record and not an implementation aside -- a guard that only recognises the wording it
  was born with will keep being outrun by the code it guards.

  WHY IT IS EPIC-ONLY. The single-ticket driver has no epic path, no completion-time
  re-read and no epic completion return, so there is nothing to partition in the twin.
  That is stated explicitly because sibling records in this batch require changes in both
  drivers, and an implementer carrying that pattern here would search for code that does
  not exist.
