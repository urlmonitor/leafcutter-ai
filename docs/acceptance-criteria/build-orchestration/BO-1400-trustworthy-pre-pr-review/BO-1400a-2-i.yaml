id: BO-1400a-2-i
readiness: approved
priority: high
title: "A build-output-only artifact that is not consumer-shipped by design is not falsely flagged"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1400-trustworthy-pre-pr-review/BO-1400a.yaml"
criteria: |
  Given a ticket under pre-PR review whose diff adds or modifies an artifact that, by
    design, lives only in the build-output tree and is never meant to ship to consumers
    (for example a generated file or a development-workspace-only build output, not a
    deliverable a fresh install must receive)
  When the pre-PR self-review applies the deployable-placement check to that diff
  Then the review does not raise a placement blocker for that artifact
  And the review distinguishes a build-output-only artifact (not consumer-shipped) from
    a consumer-facing deliverable, applying the deployable-source requirement only to
    the deliverables
depends_on:
  - BO-1400a-2
