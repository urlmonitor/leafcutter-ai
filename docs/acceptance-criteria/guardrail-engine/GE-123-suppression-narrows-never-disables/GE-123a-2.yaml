notes: |
  This criterion IS the measured defect, stated as the behaviour that must hold
  after the fix. DIRECTLY MEASURED baseline (GE-123a notes): this exact setup —
  five env-named files, four secret shapes each, one suppression line — produced
  ZERO findings and a clean exit. The target is twenty findings and a
  findings-present exit.

  THE THREE ARMS ARE ONE BEHAVIOUR, NOT THREE. The first arm is the guarantee.
  The second and third are its mandatory paired positives: without them the
  criterion is satisfiable by an implementation that stops honouring the entry
  at all, or that reports the filename finding regardless. All three must hold
  in the same implementation.

  WHY FIVE FILES RATHER THAN ONE: the measured baseline used five, and a
  repository-wide entry is the form that makes the collapse total. One file
  would not distinguish "the entry is scoped correctly" from "the entry happened
  to miss".

  Env filenames are the subject of this criterion, as in GE-123a-1 — not a
  casual example. Depends on GE-123a-1 because there is nothing to observe until
  the content scan actually runs on these files.
