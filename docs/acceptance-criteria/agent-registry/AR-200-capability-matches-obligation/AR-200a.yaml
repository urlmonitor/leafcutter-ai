id: AR-200a
title: "A build never stalls because the specialist it dispatched was not given a pen"
component: agent-registry
components:
  - agent_registry
  - build_orchestration
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Your build does not halt on a contradiction inside its own configuration.

  Every specialist a build can dispatch is equipped for the job it is given. If
  a specialist is required to write its verdict into the record, it arrives able
  to write. The mismatch is caught when the specialist is defined, not the first
  time a build dispatches it and stops.

  The benefit is a build that fails only for real reasons. A halt tells you
  something about your code, not something about a missing tool in a
  configuration file you have never read.
