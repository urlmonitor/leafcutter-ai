title: "The file that exists to prove the self-targeting bootstrap keeps self-targeting"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the tracked-files file, the one file of the thirteen that genuinely self-targets
    — it clones the checkout with no local hardlinks and then builds the clone against
    itself — and does so because the criterion it covers is literally whether the
    worktree bootstrap's own self-targeting build stays idempotent and leaves no
    tracked file altered,
  And its measured cost of about 43 s per build, which matches the self-targeting rate
    and confirms the expensive shape is real rather than imagined,
  And the single inefficiency in it: of its three clone-and-build cycles, one is
    structurally identical to a cycle the same module already performs and already
    caches for another test,
  And the reason the obvious saving is safe: idempotence is the property under test, so
    the state of a shared clone after a second build is byte-identical to its state
    after the first, whichever test looks at it,
  When the duplicate cycle is removed and the two remaining tests work from the cached
    clone,
  Then the file starts two real builds where it started three, and both of its
    build-running tests still pass,
  And the build those tests observe still runs with its target directory and its package
    root resolving to the same tree, rather than to two different trees,
  And the clone those builds run against is still made without local hardlinks into the
    real repository, so a build inside the clone still cannot reach the real object
    store,
  And the second build still runs against a tree a first build has already touched,
    because a second build on an untouched tree would assert idempotence over nothing,
  And the two tests that never start a build at all are untouched by this change.
