test_spec:
  - name: test_tq_400f_1_i_two_parents_one_run_receive_different_outcomes
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci"
    description: >-
      ONE subprocess run over ONE store holding P1 (every child covered by a test
      that actually passes, one of those children work_status todo) and P2 (every
      child finished, one child with no passing test). P1 receives the
      has-unfinished-descendants outcome AND retains its satisfied coverage outcome;
      P2 receives the coverage outcome and NOT the descendant outcome. Asserting
      these in two separate runs, or asserting P1 alone, passes on the collapsed
      implementation.
  - name: test_tq_400f_1_i_coverage_satisfied_parent_is_still_demoted_on_disk
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      In the same production invocation with outcome application enabled, P1's file
      on disk is demoted — work_status and demotion_reason changed — even though its
      coverage verdict is satisfied. This proves the descendant outcome reached the
      write path rather than being printed beside a satisfied coverage verdict and
      then dropped by a filter that selects on the coverage axis.
  - name: test_tq_400f_1_i_bo_2500a_6_composite_exemption_does_not_regress
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      Through the real oracle in the same build: a done composite whose children are
      all finished AND all covered by passing tests still satisfies the coverage axis
      with no direct '# covers:' test of its own, and a done leaf with no covering
      test still fails. BO-2500a-6 is work_status done; this entry is the regression
      boundary that keeps this AC additive.
  - name: test_tq_400f_1_i_inventory_carries_both_outcomes_as_separate_fields
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      Read the inventory the run actually wrote: P1's entry carries the coverage
      outcome and the descendant outcome as two separately machine-readable values,
      and a consumer selecting "records with the descendant outcome" finds P1 despite
      its satisfied coverage outcome. A single scalar verdict field, or a descendant
      cause embedded in the coverage cause string, fails here.
test_rationale: >-
  The naive test builds one parent, gives it an unfinished child, and asserts the
  sweep flags it. That test stays green on the cheapest wrong implementation — adding
  the child-status check inside the existing composite-exemption branch — for a
  reason that is easy to miss: a hand-built fixture parent usually fails the coverage
  check too, because the author did not trouble to write passing tests for its
  children, so the new check runs and the test passes. Every one of the twenty
  parents measured at 439b9076f PASSES the coverage check, so the naive fixture is
  the one shape that never occurs in the real population, and the naive test would
  certify an implementation that leaves all twenty untouched. Only two parents that
  must receive DIFFERENT outcomes in the same run, with the coverage-satisfied one
  demoted on disk under apply, distinguishes two independent axes from one axis asked
  twice. The BO-2500a-6 entry is included because the second-cheapest wrong
  implementation deletes the composite exemption instead of sitting beside it, and
  that regression is invisible from inside this AC.
change_target: code
risk_surface: contract_boundary
notes: |
  This is the falsifiable form of the gap named in TQ-400f's notes. BO-2500a-6 is
  the closest existing record and it is DONE, so the temptation is to conclude the
  parent case is already handled. It is not: BO-2500a-6 keys on the children's test
  coverage, and a child can be covered by a passing test while its own work is
  still unfinished. Every one of the twenty bad parents measured at 439b9076f can
  satisfy BO-2500a-6 and still be wrong.

  The cheapest wrong implementation is to add the child-status test inside the
  existing composite-exemption branch, so it only runs for parents that failed the
  coverage check. That passes any single-parent test and leaves the entire
  measured population untouched, because those parents pass the coverage check.
  The two-parents-in-one-run clause is what makes that specific mistake fail.

  Authored as an L3 rather than a sixth child on purpose: it is a technical
  constraint on TQ-400f-1's verdict, not a behaviour of its own, and the cap of
  five is hard. It is expected to be built — without it, TQ-400f-1 is closable by
  an implementation that changes nothing for any record currently in the store.
