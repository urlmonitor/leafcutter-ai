notes: |
  The parent L1 names parallel work explicitly — "handing out parallel work and collecting the
  results is done only at the level of the system that can genuinely wait for an answer" — so
  the concurrency has to survive the relocation, not be traded away for it.

  WHY THIS NEEDS ITS OWN CRITERION. The simplest way to satisfy BO-3100c-1 is to run every
  step one after another; each result then trivially reaches the dispatcher before the next
  step begins. That would pass c-1 completely while turning every drive into a serial queue,
  and nothing else in this tree would notice. The first scenario is written to fail that
  implementation.

  THE THIRD SCENARIO IS THE COLLECTION HALF. Concurrency without collection is the original
  defect wearing a different hat: several steps in flight and a coordinator that reports
  completion before their results arrive. Requiring every result to be held before the build
  is reported complete closes it.

  Measuring overlap by recorded start and end moments is deliberate — it is observable from
  outside the coordination layer and cannot be satisfied by a system that merely claims to
  dispatch concurrently.

  IT-PO ENRICHMENT NOTE (2026-08-26). The cross-AC hazard worth naming: BO-3100b-1 judges a
  step by comparing project state before and after it ran, and this AC requires steps to run at
  the same time. Unless the snapshot is scoped per step or the judgement is serialised, a parked
  step inherits its concurrent sibling's changes and is judged to have produced work — which
  turns off the exact guard BO-3100b exists to install, with nothing failing. The test is placed
  here because only a concurrent build can produce it.
