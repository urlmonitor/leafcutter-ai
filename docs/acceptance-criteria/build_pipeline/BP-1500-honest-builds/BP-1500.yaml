notes: |
  WHY A NEW L0 -- the caps forced it, and the theme justifies it.

  The two thematically correct homes are both structurally closed. BP-900
  ("every capability you install actually works") is at 8 L1s carrying
  child_limit_override: 8, and its newest branch BP-900h is at the 5-L2 cap.
  BP-100 ("every build produces exactly what you expect") carries
  child_limit_override: 13 against a default of 7. Neither can absorb this at
  any id without a further override, and _MAX_L1_PER_L0 = 7 is a hard cap in
  check_ac_limits.py. Per the ac-tree-split guidance this is a horizontal split:
  a new sibling L0, not another waiver.

  The theme stands on its own regardless of the caps. BP-900 asks whether
  everything PROMISED arrived. BP-100 asks whether every artifact landed in the
  right PLACE. This goal asks a third question neither one poses: is the build's
  ACCOUNT of its own work complete and true -- did it change only what it says
  it changed, remove what it says it removed, and admit what it left behind.
  All five observed defects are silent or actively reassuring, and that is the
  property that unites them.

  THE ROADMAP CRITERION -- read this before claiming it closed.

  phase_1 exit criterion 4 reads "Self-hosting parity: leafcutter development
  uses its own compiled agents". Taken literally that is already true -- this
  repository does self-host. What is missing is that self-hosting is SAFE: the
  documented self-host build command currently damages the repository it is run
  from. This goal is what makes the criterion honest to claim, but the criterion
  as worded arguably measures the wrong thing. Flagged for the user as a possible
  roadmap wording change; NOT changed here, because roadmap edits require
  explicit confirmation.

  WHY THE L0 IS NOT FRAMED AS "SELF-HOSTING". The defects were all OBSERVED in
  the self-hosted workspace, but two of the three guarantees are not
  self-host-specific. An orphaned artifact (BP-1500b) persists in every install
  that ever received it -- KI-BP-005 says so explicitly. A deployed copy frozen
  behind its source (BP-1500c) hits consumers permanently and invisibly --
  KI-BP-008 records exactly that for a consumer on an older toolchain. Naming
  this goal after self-hosting would narrow three general guarantees to the
  layout where they happened to be caught. Do not re-narrow them at L2.

  WHAT ALREADY COVERS PART OF THIS, AND MUST NOT BE RE-DERIVED.

  - BP-900h-2 (consecutive builds produce zero git diff) does NOT cover
    BP-1500a, despite the surface similarity. It measures the DEPLOYED output in
    a scratch git repository built from the consumer simulation of BP-900h-1.
    KI-BP-001 writes into the PACKAGE repository while scanning the deploy
    target, so the scratch repository never sees it; and the defect is
    deterministic, so a second build produces the same wrong result and the
    idempotency comparison passes. Two different trees, two different
    properties, both needed.
  - BP-1300b ("checks judge the canonical source, not stale deployed copies") is
    the nearest neighbour to BP-1500c and is NOT the same requirement. Its three
    L2s (BP-1300b-1, -2, -3) all govern where a guardrail resolves the SUBJECT
    it validates. BP-1500c governs whether the guardrail's OWN deployed code is
    current. A guardrail can obey BP-1300b perfectly and still be an old build
    that never learned the rule. Cite BP-1300b when decomposing BP-1500c; do not
    merge them, and do not restate BP-1300b's canonical-source rule here.
  - BP-100b-3 ("stale workflow artifacts are removed during build cleanup", L2,
    work_status: done) is a narrower already-shipped instance of BP-1500b. It is
    scoped to the workflows output directory only, and it says nothing about the
    build's REPORT. KI-BP-005 is the same failure in the commit-guardian tree
    with a false clean bill of health attached. Treat b-3 as prior art to reuse,
    not as coverage.
  - KI-BP-003 (a deployed hook cannot find config/doc_types.json) is
    DELIBERATELY EXCLUDED from this goal -- it is already covered. BP-900h-4
    proves empirically that every declaring file a deployed guardrail reads is
    present under a consumer install's deployed root; BP-900g-8-ii makes the
    build refuse to ship an install whose declaring files are unmanifested; and
    BP-900g-10-iii requires the file to be located from where the running
    artifact lives rather than from the process working directory, which
    dissolves the hardcoded package-directory-name half of the defect. Authoring
    for KI-BP-003 here would duplicate three approved records.

  THE PRODUCT DECISION THAT CONSTRAINS BP-1500a -- already made, carry it down.

  Generated artifacts (the documentation index, the generated agent cards) STAY
  TRACKED and reviewable in the pull request diff. The requirement is that a
  rebuild producing a different result FAILS A CHECK. An implementation that
  gitignores them, or stops generating them, does not satisfy this goal.

  TWO REVIEWED L2 DRAFTS EXIST -- do not re-derive them.

  A BA drafted and verified two leaves before the BP-900 caps were discovered.
  Their criteria, it_requirements and test_spec were reviewed and are good; only
  their ids and parent were wrong (they were written at BP-900h-4 and BP-900h-5,
  both of which are now live, unrelated, approved records on main -- see
  docs/known-issues/ac-driven-dev.md KI-ACD-008). They map one-to-one onto the
  first two L1s here:
    - /tmp/selfhost_leaf_build_clean.yaml  -> first L2 of BP-1500a
    - /tmp/selfhost_leaf_orphans.yaml      -> first L2 of BP-1500b
  Re-id them under their new parents rather than re-deriving. BP-1500c has no
  draft yet.

  ID EVIDENCE. BP-1500 and BP-1600 were both confirmed free by a store-wide
  grep of every "^id: BP-" line in docs/acceptance-criteria/ and by a full-text
  grep across docs/, unit_tests/, tests/ and tickets/ -- zero hits for either.
  BP-1500 taken here; BP-1600 remains free.
