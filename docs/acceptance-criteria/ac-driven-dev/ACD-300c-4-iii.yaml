id: ACD-300c-4-iii
components:
  - ac_driven_dev
  - ac_store
readiness: approved
priority: high
title: "A feature record in the final-gate batch is approved like its children, not skipped for having children"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given the final-gate batch holds the feature record ACD-9990a (level L1) and its two
    children ACD-9990a-1 and ACD-9990a-2, all at readiness "reviewed",
    and the approval-hold report returns none of the three as held,
  When the user chooses "approve" and the workflow applies the approval,
  Then all three records read readiness "approved",
  And ACD-9990a is approved once under its own id: it is not skipped because it has
    children, and it gains exactly one approval entry in amended_by,
  And the closing summary states "3 approved, 0 held".
depends_on:
  - ACD-300c-4
doc_links:
  - path: docs/acceptance-criteria/ac-driven-dev/ACD-300c-4.yaml
    relationship: parent
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- The id-list mode approves an L1 or L2 id under its own id and never re-derives leaves from it; goal
  mode keeps its leaf-only behaviour.
declared_files:
- path: scripts/ac_store/approve_acs.py
  state: existing
- path: templates/workflows-js/plan-feature.js
  state: existing
delivers_to: null
expects_from:
  ac_id: ACD-300c-4
  contract: 'scripts/ac_store/approve_acs.py gains an id-list mode and a priority option: given ids [str]
    and priority (critical|high|medium|low) it writes, for each id it does not hold, readiness approved,
    that priority and one appended amended_by approval entry, as one field-targeted write per record followed
    by a read-back. --json prints {approved: [id], held: [{id, file, reason}]} (reason in HOLD_REASONS),
    plus an additive already_approved: [id] list; --dry-run --json prints the same report without writing.
    Exit is non-zero when any written record fails read-back, and that record is restored to its pre-write
    bytes.'
test_intent:
- clause: all three records read readiness "approved"
  needs_test: true
  reason: Every record in the batch, feature records included, must reach approved.
- clause: 'ACD-9990a is approved once under its own id: it is not skipped because it has children, and
    it gains exactly one approval entry in amended_by'
  needs_test: true
  reason: Goal mode skips non-leaf records, so approving a feature record under its own id must be proven.
- clause: the closing summary states "3 approved, 0 held"
  needs_test: true
  reason: The count is computed from the step's report and must include the feature record.
test_spec:
- name: test_id_list_mode_approves_an_l1_with_its_children
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: reachability
  description: Runs approve_acs.py --ids ACD-9990a,ACD-9990a-1,ACD-9990a-2 --priority high --json as a
    subprocess on a tmp store where ACD-9990a is an L1 covering the two children; all three read readiness
    approved.
  proves_clause: all three records read readiness "approved"
  code_file: scripts/ac_store/approve_acs.py
- name: test_l1_is_approved_once_under_its_own_id
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Reads the files back: ACD-9990a gained exactly one approval entry, and each child gained
    exactly one (not one per mention).'
  proves_clause: 'ACD-9990a is approved once under its own id: it is not skipped because it has children,
    and it gains exactly one approval entry in amended_by'
  code_file: scripts/ac_store/approve_acs.py
  must_catch:
  - the id-list mode expands an L1 id to its covered_by children, so the L1 stays reviewed and each child
    is approved twice
  - the id-list mode skips any id whose record has covered_by children
- name: test_workflow_summary_states_three_approved_zero_held
  target_dir: unit_tests/ac_driven_dev/test_design_stage/
  framework: pytest
  type: unit
  angle: criterion
  description: 'plan-feature.js under run_workflow_under_e2 with the step''s real --json report for the
    L1 batch: the closing message states 3 approved, 0 held, and the dispatched --ids include ACD-9990a.'
  proves_clause: the closing summary states "3 approved, 0 held"
  code_file: templates/workflows-js/plan-feature.js
