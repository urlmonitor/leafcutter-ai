notes: |
  Satisfies the sequence-diagram entry in TKT-500g's documentation_triggers.

  DELIBERATE DEVIATION — AUTHORED AT L3, NOT L2. The documentation-AC convention
  places a triggered diagram at L2. TKT-500g is at the hard cap of five L2
  children and all five slots carry load-bearing behaviour (the demand arriving,
  the phase running, the negative control, the explicit waiver, and the honest
  readiness report). Displacing one of those to make room for a diagram would
  hide a behaviour to document a picture. The trigger is satisfied in substance:
  a single owned criterion, its own agent, its own observable. Raising the cap
  was rejected — the parent L1 was created precisely to avoid another override.

  WHY A SEQUENCE DIAGRAM IS THE RIGHT FORM. This defect existed because two
  independent steps can each discard the same demand and neither reports it. A
  sequence of four participants with the two drop points marked states that in a
  glance; prose has to enumerate it and will fall out of date at the next route.

  IT-PO NOTE 2026-08-25 — test_required: false ACCEPTED AS AUTHORED. The rationale
  is sound and the mechanical properties really are enforced elsewhere; duplicating
  them here would be a second gate that reports on the first. The one addition is an
  it_requirement about the dangling parent link: the component page named in the
  first doc_link does not exist in the tree, and a diagram nobody can reach from a
  component page is the documentation form of unreachable code.
