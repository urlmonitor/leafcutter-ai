assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The deliverable checklist is a NEW additive AC-schema field (a list of items, each `{kind, craft}`). Declare it OPTIONAL in the canonical schema config/ac_store_schema.json; do NOT tighten additionalProperties until the store is 100% backfilled (ADR-026 safety rule 1)."
  - "NO NEW KIND VOCABULARY (user decision D1, 2026-08-31). The checklist item's `kind` enum MUST be the store's EXISTING change_target enum in config/ac_store_schema.json -- code, schema, ui, infrastructure, pipeline, prompt, model, config, docs, dependency -- extended by exactly one value, `diagram` (D2). Eleven values, not five. Verified live use of the existing ten: code 1241, pipeline 884, prompt 449, docs 260, config 90, schema 73, infrastructure 32, ui 10; 3,381 of 3,694 records already carry one."
  - "READ THE ENUM FROM THE ONE PLACE IT IS DEFINED; DO NOT RESTATE IT. The checklist item's kind MUST resolve to the SAME schema definition object as change_target -- a JSON-Schema `$ref` into a shared `$defs` enum, with change_target itself refactored to use that `$ref` -- so `diagram` is added by ONE edit and the two can never disagree. A second literal copy of the values inside the checklist definition is the duplicated-source defect D1 exists to prevent, and a copy is 'correct' against itself from the moment it drifts."
  - "`tests` IS NOT A KIND and must be rejected by the enum (user decision D3). A code deliverable's test obligation is carried by this record's existing `test_spec` / `test_required` fields; the checklist writer must never synthesize a `tests` item, and a checklist containing one fails validation."
  - "Validate the enum at EVERY enforcement point that actually gates commits, and know which one is load-bearing: templates/scripts/commit_guardian/check_ac_schema.py plus its manual-validation fallback in templates/scripts/commit_guardian/_ac_schema_validators.py -- the branch that actually runs when jsonschema is absent, and therefore the authoritative gate -- mirrored by the agent-side scripts/ac_store/validate_ac_schema.py. A rule added only to the JSON schema is a partial/no-op gate."
  - "The `craft` attribute value must resolve to a real agent id in config/agent_registry.json; reject an unknown craft. This is the store-side half of the same resolution BO-3500a-2 performs at build time -- the two must read the same registry or a record can pass one gate and fail the other."
  - "Tolerant reader: absence of the checklist (schema_version < 2) is legacy mode -- derive/skip, never fail (ADR-026 rule 4)."
  - "Canonical source only: edit config/ac_store_schema.json, scripts/ac_store/*.py and templates/scripts/commit_guardian/*.py; never a deployed .claude/ or scripts/commit_guardian/ build-output copy, and never the workspace-parent mirror (ADR-001 / ADR-026)."
  - "DEPLOY MANIFEST: any new module the check_ac_schema hook imports MUST be added to AC_STORE_DEPLOY_MAP in scripts/build_phases.py. Verify by running the DEPLOYED hook, not the unit tests -- those import from the source tree and mask the gap (the done_proof.py incident)."
delivers_to:
  agent: python-coder
  contract: "deliverables[] checklist field on the AC record: a list of {kind, craft}, where `kind` is the SHARED change-target enum definition resolved by $ref rather than copied (code|schema|ui|infrastructure|pipeline|prompt|model|config|docs|dependency|diagram -- eleven values, no `tests`), and `craft` is an id from config/agent_registry.json. Consumed by the checklist-vs-change-surface validator (ACD-1800a-2-i), by the per-deliverable sign-off store (ACD-1800b-1a), and -- at build time -- by the proof-class derivation of BO-3500c-2."
expects_from: null
test_spec:
  - name: test_deliverable_checklist_present_on_requirement
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: criterion
    description: "An AC declaring a code change surface and a how-to documentation surface exposes a non-empty deliverable checklist field."
  - name: test_checklist_one_item_per_artifact_kind
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: criterion
    description: "The checklist enumerates exactly one item for each artifact the requirement needs -- a code item and a docs item -- and no item for tests."
  - name: test_checklist_item_names_kind_and_craft
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: criterion
    description: "Each checklist item carries a `kind` and a `craft` attribute."
  - name: test_checklist_kind_enum_equals_change_target_enum_plus_diagram
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: seam
    description: "Load config/ac_store_schema.json, resolve the checklist item's kind enum and the change_target enum through their $refs, and assert the first set equals the second union {diagram} -- so the two vocabularies are provably one rather than two that currently agree."
  - name: test_kind_added_in_one_place_appears_in_both_enums
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: seam
    description: "Add a value to the shared $defs enum in an in-memory copy of the schema, re-resolve both references, and assert BOTH the checklist kind enum and change_target reflect it. A duplicated literal copy fails this test; a $ref passes it."
  - name: test_checklist_kind_tests_is_rejected
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: failure
    description: "A checklist item with kind `tests` is rejected -- asserted through validate_ac_schema.py AND through the manual-validation fallback in _ac_schema_validators.py, since that fallback is the branch that gates commits when jsonschema is absent."
  - name: test_checklist_kind_enum_rejects_unknown_value
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: failure
    description: "A checklist item whose kind is outside the eleven-value vocabulary fails validation at the manual-validation fallback as well as at the JSON-schema path."
  - name: test_checklist_craft_must_be_registry_agent
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: failure
    description: "A checklist item whose craft is not an agent id in config/agent_registry.json fails validation."
  - name: test_deployed_check_ac_schema_hook_rejects_tests_kind
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: "scripts/commit_guardian/check_ac_schema.py (deployed layout)"
    description: "Build the deploy layout, then run the DEPLOYED check_ac_schema hook over a staged AC carrying kind `tests` and assert a non-zero exit with the kind named -- catches a missing AC_STORE_DEPLOY_MAP entry that source-tree unit tests cannot see."
origin_agent: BrainCandy
