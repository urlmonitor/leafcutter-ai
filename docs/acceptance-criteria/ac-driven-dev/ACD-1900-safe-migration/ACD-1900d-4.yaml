criteria: |
  Given a new done-accounting gate and a store in which pre-existing ACs lack the new
    fields,
  When the gate runs on a change that touches only one AC,
  Then it evaluates only the diff-touched AC(s),
  And every pre-existing untouched AC is neither evaluated nor failed by that run.
