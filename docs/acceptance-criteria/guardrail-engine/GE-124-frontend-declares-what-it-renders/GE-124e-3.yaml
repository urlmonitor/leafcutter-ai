change_target: code
risk_surface: contract_boundary
notes: |
  Mirrors what the existing done-proof gate does for tests — the PO's
  instruction is to use that model and not invent a parallel idiom.

  THE SUBJECT IS THE CRITERION ID, and the mock-data artifact states this as an
  invariant: commit-tier subjects are file paths, CI-tier subjects are criterion
  ids. That difference is what makes GE-124c and GE-124e two L1s rather than
  one, so a finding keyed by the wrong subject type is not a cosmetic defect —
  it collapses the distinction the tree is built on.

  The second scenario is the reader-facing consequence: the two directions
  surface in the same place, and a reviewer who cannot tell them apart will try
  to fix a criterion by editing a file, or the reverse.

  Worked case: mock-data record `gf-ci-uxp-607-2-undeclared`.
