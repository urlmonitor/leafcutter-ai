notes: |
  Authored from BrainCandy's requirement that the fast lane "must also use a review
  agent in the process to catch any silly things that should not be shipped". The
  changelog half of the same requirement is already covered by BO-2400f-4-i..v; this
  criterion is only the review half.

  The ordering is the point, not a detail. Placed after Commit, a review turns every
  finding into a follow-up commit on top of a defect that has already entered the
  delivered history — which is what the lane exists to avoid. Placed before Commit,
  the same finding is a correction to a change nobody has seen yet.

  Deliberately no new classification is introduced. pr-reviewer already sorts findings
  into high / medium / low confidence, suppresses low-confidence noise, and escalates a
  medium cluster of more than three findings to an Opus second opinion that can promote
  findings to high. Reusing that verdict is what keeps low-confidence noise from
  halting a green run without the lane inventing a threshold that would drift from the
  reviewer's.

  The last scenario exists because of a defect authored in this same family: a
  release-critical boolean was derived from an unrelated metadata field on the argument
  that over-reporting is cheap. It was neither accurate nor cheap. A run that cannot
  obtain a verdict must say it has no verdict; it must never manufacture one.

  This criterion does not by itself relax BO-2400f-4-vi: a run stopped by review has
  opened no pull request, so it reports neither a landable one nor a blocked one.

  assigned_agent is deliberately left for the IT-PO layer. The store schema's
  package-surface rule makes assigned_agent: python-coder on a build-orchestration AC
  compel a five-field it_requirements block, and that technical spec is IT-PO work, not
  BA work — the sibling BO-2400f-10 was authored the same way. The two fields should be
  added together.
