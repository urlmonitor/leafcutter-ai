id: UXP-514-2
title: "D2: a criterion whose back-reference disagrees with the inverted links is named"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given an acceptance criterion carrying a back-reference to a journey step that no longer names
    it,
  When the record is checked,
  Then the check reports that criterion by identifier, stating the back-reference the criterion
    holds and the back-reference produced by inverting the journey-to-criterion links,
  And a criterion named by a journey step but carrying no back-reference is reported separately,
    as a missing back-reference rather than as a disagreeing one,
  And a criterion whose held back-reference equals the inverted one is not reported,
  And the check states how many criteria it inverted.
depends_on:
  - UXP-514
