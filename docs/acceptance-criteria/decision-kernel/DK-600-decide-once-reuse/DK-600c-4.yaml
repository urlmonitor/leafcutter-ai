it_requirements:
  - The completed-run message is carried as a run limitation in the result, the decision report and
    the envelope, with the exact staged path and the exact publish command.
  - 'The /leafcutter skill is transport only: it may show the publish command, never run it, and its
    allowed-tools never pre-approve `decisions publish`.'
  - Skill text lives in kernel/adapters/claude_code/SKILL.md (template prose, llm-expert surface);
    any change to that wording is llm-expert work, while the message and the tests are python-coder
    work.
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
