notes: |
  WHY THIS IS ITS OWN RECORD. BO-3900 can be satisfied on a Windows developer machine
  by path handling that asks the host whether a path is absolute. That handling is correct
  on Windows and wrong on Linux for a Windows-shaped string. The drives that hand agents
  these paths can run on either. This record's mutations turn only its own tests red:
  BO-3900's harness tests, run on Windows, stay green under them.

  NAMED MUTATIONS:
    M1 — delegate absoluteness to the host platform's own rules (the host path module's
         isAbsolute, with no Windows-rules variant). Green on a Windows host, red on the
         Linux runner via test_windows_shaped_paths_classify_absolute_on_a_posix_host.
    M2 — replace the Windows-absolute recognition with startsWith("/"). Red on Linux, the
         clause the user asked for by name.
    M3 (a mutation of the test, not the code) — build fixtures with the host separator or
         a host path-join. Caught by
         test_windows_fixtures_hold_literal_drive_letters_and_backslashes_on_this_host.
    M4 (a mutation of the test) — decorate the Windows cases with a skip-unless-Windows
         condition. The criterion forbids it. A reviewer or a skip-count check on the Linux
         run catches it. No test can catch its own skip decorator.

  ASSUMPTION, logged. A drive-lettered or UNC spelling is treated as absolute on every host.
  On a POSIX file system `C:\x.md` is technically a legal relative file name. No build
  orchestration path is spelled that way on purpose, and treating it as relative is exactly
  the incident. Risk if wrong: a POSIX project with a directory literally named `C:` would
  have its paths misclassified. Accepted as negligible.
