delivers_to:
  agent: python-coder
  contract: "The consolidation guarantee: check_components_integrity.py, check_doc_frontmatter.py, check_secrets.py, and any future commit_guardian guard obtain the project root exclusively through the single shared _resolve_root helper (git rev-parse --show-toplevel + safe fallback), with no per-guard parents[N] literal, .leafcutter-symlink-following, or bespoke _resolve_worktree_root resolution remaining in the guard set."
expects_from:
  ac_id: GE-113c-1
  contract: "The single shared project-root resolver produced by GE-113c-1 (scripts/commit_guardian/_resolve_root.py); this AC generalizes its adoption across all guards and forbids alternative per-guard mechanisms."
test_spec:
- name: test_ge_113c_1_iv_every_migrated_guard_resolves_the_project_root_through_the_shared_module
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Parametrized over the 30 declared guard files: each source, parsed with ast, imports from _resolve_root
    (from _resolve_root import ... or import _resolve_root) and calls find_project_root or find_git_toplevel_strict,
    and defines none of the old per-guard resolvers (_find_project_root, _repo_root, _git_root, _find_root, _find_repo_root,
    _get_repo_root, _resolve_repo_root, _resolve_worktree_root), and check_components_integrity and check_structural_change
    keep no module-level REPO_ROOT derived from __file__.'
  proves_clause: each guard obtains the project root exclusively through that one shared helper
  code_file: templates/scripts/commit_guardian/check_components_integrity.py
- name: test_ge_113c_1_iv_installed_workflow_meta_checks_the_project_it_is_committed_from
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: reachability
  description: A temporary git repository holds templates/workflows-js/bad.js whose export const meta block has
    a string concatenation; python .leafcutter/scripts/commit_guardian/check_workflow_meta.py, run as a subprocess
    with cwd at the repository root, exits 1 and prints a FAIL line naming templates/workflows-js/bad.js, both with
    nothing staged (standalone scan) and with bad.js staged. Today parents[3] of the installed copy is the temporary
    directory's parent, so the run reads nothing and exits 0. The installed layout is made by copying the hook and
    _resolve_root.py into .leafcutter/scripts/commit_guardian/ of a temporary git repository, as _ge_113c_1_vi_fixtures.deploy_hook
    does; no build.py is spawned and no POSIX flock is needed, so it runs locally as well as on CI.
  proves_clause: each guard obtains the project root exclusively through that one shared helper
  code_file: templates/scripts/commit_guardian/check_workflow_meta.py
- name: test_ge_113c_1_iv_installed_cwd_walk_guard_finds_the_project_root_past_a_nested_claude_md
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: discrimination
  description: A temporary git repository with docs/CLAUDE.md (a nested per-folder CLAUDE.md, common in real projects)
    and two staged records docs/acceptance-criteria/GE-901-a.yaml and GE-901-b.yaml whose depends_on name each other;
    the installed check_ac_circular_deps.py, run as a subprocess with cwd at docs/, exits 1 and its stderr names
    both ids in the BLOCKED cycle report. A second case sets HOOK_ROOT to the repository and HOOK_TEST_FILES to
    the two absolute record paths with cwd outside any repository, and also exits 1, so the override is honoured
    through the shared module. The installed layout is made by copying the hook and _resolve_root.py into .leafcutter/scripts/commit_guardian/
    of a temporary git repository, as _ge_113c_1_vi_fixtures.deploy_hook does; no build.py is spawned and no POSIX
    flock is needed, so it runs locally as well as on CI.
  proves_clause: each guard obtains the project root exclusively through that one shared helper
  code_file: templates/scripts/commit_guardian/check_ac_circular_deps.py
  must_catch:
  - the per-guard cwd-ancestor walk kept, so the run from docs/ stops at docs/CLAUDE.md, finds no docs/docs/acceptance-criteria
    and exits 0
  - the guard migrated to find_project_root but the shared module ignores HOOK_ROOT, so the HOOK_ROOT case resolves
    the wrong root and exits 0
- name: test_ge_113c_1_iv_guard_sources_derive_no_project_root_outside_the_shared_module
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Scans the code of every .py under templates/scripts/commit_guardian/ and its hooks/ folder (tokenize,
    so comments and docstrings are ignored; _resolve_root.py and __pycache__ are skipped) for project-root derivation:
    .parents[<int>], chained .parent.parent, [x, *x.parents] ancestor walks, Path.cwd().parents walks, os.getcwd()
    root fallbacks and a ''--show-toplevel'' subprocess argument. Every match must be an allowed exception and every
    other match fails the test, naming file, line and pattern. The allowed exceptions are exactly the DOCUMENTED
    EXCEPTIONS entry of it_requirements, each keyed by file, pattern kind and the matched code line, each with a
    one-line reason: check_secrets _DEPLOYED_SIBLING_SCANNER_DIR, hooks/check_ac_done_on_merge mark_ac_done.py path,
    hooks/check_agent_spawn_consistency sys.path.insert of parent.parent, transform_doc_index parents[1] generator
    candidate, the __file__ ancestor walks of diagram_type_validators, doc_type_validators, check_exception_handling,
    _ac_store_locator and _frontmatter_path_resolver_locator, ensure_precommit_config _PACKAGE_ROOT = parents[1],
    run_hook.py''s toplevel comparison and Poetry pyproject walk, install_pre_commit_shims.py''s CLI toplevel, and
    _work_items_scanner''s config-path parent.parent; check_mermaid_parent_link and check_adr_cross_reference are
    listed as owned by GE-113c-4 and GE-113c-5 until those land, and the entry is removed when they do.'
  proves_clause: no guard re-derives the project root via Path(__file__).resolve().parents[N], via following the
    .leafcutter symlink to the workspace parent, or via its own bespoke resolver duplicated from the shared one
  code_file: templates/scripts/commit_guardian/check_structural_change.py
  must_catch:
  - the dead REPO_ROOT = Path(__file__).resolve().parents[2] left in check_structural_change
  - check_components_integrity keeping its own _repo_root() with a parents[2] fallback
  - check_doc_frontmatter keeping _resolve_worktree_root with its private git rev-parse call
  - one of the seven HOOK_ROOT plus cwd-walk _find_project_root copies left in place
  - an allowlist keyed by file name only, so a second, new parents[N] root added to an exempt file such as check_secrets
    passes
- name: test_ge_113c_1_iv_scan_refuses_a_new_guard_that_brings_its_own_root_resolution
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'The scan of the previous test is run over a temporary copy of the guard folder plus one synthetic
    new guard check_fixture_new_guard.py: one variant sets REPO_ROOT = Path(__file__).resolve().parents[2], one
    calls subprocess.run([''git'', ''rev-parse'', ''--show-toplevel'']) in its own helper, one walks [Path.cwd(),
    *Path.cwd().parents]; each is refused and the report names check_fixture_new_guard.py. A fourth variant that
    does from _resolve_root import find_project_root passes.'
  proves_clause: a new guard added later that needs the project root reuses the same shared helper rather than introducing
    its own resolution mechanism, so this wrong-root bug class cannot recur
  code_file: templates/scripts/commit_guardian/_resolve_root.py
  must_catch:
  - a scan limited to a fixed list of today's guard file names, so a new file is never scanned
  - a scan that only looks for parents[N] and lets a new private git rev-parse helper through
- name: test_ge_113c_1_iv_exception_list_is_exact_and_carries_a_reason
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: Every allowed exception still matches a code line in the current guard sources (a stale entry fails,
    so the list cannot grow quietly into a blanket pass) and each has a non-empty reason naming the sibling file
    or the non-root question it answers.
  proves_clause: a new guard added later that needs the project root reuses the same shared helper rather than introducing
    its own resolution mechanism, so this wrong-root bug class cannot recur
  code_file: templates/scripts/commit_guardian/_resolve_root.py
