notes: >-
  Evidence, observed 2026-09-14: roughly 150 workspaces were live at once, with no stated
  way to judge whether any given one was safe to let go. Read alongside two recorded losses
  of the opposite kind -- a concurrent session removing a workspace mid-drive and leaving
  behind a snapshot commit marked not-for-merge, and KI-BO-20260831-1331, where a
  half-created workspace is invisible to the tool that lists them, so it cannot be disposed
  of at all and its symptom reads as store-wide corruption. Boundary against BO-1800d, which
  is the nearest neighbour and was rejected as the host: BO-1800d is the do-no-harm
  constraint on background tidying against a drive that is STILL RUNNING. It presupposes
  tidying exists and says nothing about accumulation, about how a finished workspace is
  recognised, or about a workspace that is not running anything yet still holds work that
  never reached the shared line -- which is exactly the loss recorded above. Both are needed;
  do not fold this into BO-1800d or restate its promise here.
