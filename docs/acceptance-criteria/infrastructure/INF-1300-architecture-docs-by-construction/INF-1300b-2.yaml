  contract: "The generator CLI and the per-kind skeleton emitter from INF-1300a-1's delivers_to; the key is derived from the notation that skeleton uses, so a change to the skeleton must be visible to the key derivation at run time rather than requiring a second edit. INF-1300b-1's single section-shape declaration fixes where the key sits, and INF-1300a-4's enumeration fixes the kind set."
notes: |
  HOW THE DANGLING REFERENT WAS RESOLVED, AND WHY THE "VERBATIM" RULE COULD NOT SURVIVE.
  Both authoring surfaces say the key is populated from ADR-015 and that the author must
  not alter it. Two things are wrong with that and they are wrong independently. First, the
  source does not exist: ADR-015 in this repository concerns inline suppression of an
  exception-handling rule, and no ADR defines a diagram key — verified by reading the
  directory. A criterion citing it would be unimplementable, so none does. Second, and more
  interesting: even a real source could not supply one fixed block. The six documents in the
  collection that carry a key carry at least three different things — a C4 element key, a
  flowchart shape key, and a pair of per-diagram edge-trust tables. Notation differs by kind
  of picture, so a key that is correct for a C4 component picture is simply wrong above a
  flowchart. "Emit a fixed block the author must not modify" is therefore not merely
  unsourced; it would be the wrong requirement if it had a source.

  THE RESOLUTION, STATED SO IT CANNOT BE READ TWO WAYS. The key is PRODUCED and is
  per-kind: it covers exactly the notation that kind's skeleton uses, with general meanings
  that hold for any document of that kind. What each particular element of THIS document
  stands for is AUTHORED. The produced part is stable and the author has no reason to
  rewrite it; the authored part is the point of writing the document at all. INF-1300b-3
  owns making that line visible in the document itself, so "do not modify the key" becomes
  an instruction an author can actually follow rather than one that forbids completing the
  document.

  FALSIFIABILITY. Produce two documents of the same kind and two of different kinds. Read
  each key against the skeleton produced beside it. The record is falsified when the key
  names notation the skeleton does not use, when the skeleton uses notation the key does
  not name, when the two same-kind keys differ, or when the two different-kind keys are
  identical — that last one is how a single fixed block reveals itself, and it is the
  observation the present instruction would have failed. It is also falsified by any
  produced text attributing the key to a source document that does not define one. Note
  what will NOT falsify it: reading what produces the key. A producer holding one hard-
  written block per kind and a producer deriving each key from the declaration are
  indistinguishable by inspection and distinguishable by adding a kind to the declaration —
  which is INF-1300d-1-i's arm, and is the reason that arm is worth its own record.

  FENCED. The key's PLACE in the document is INF-1300b-1's. The correction of the false
  statement on the two authoring surfaces is INF-1300b-4's. This record owns the key's
  content and its derivation, and nothing else.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
