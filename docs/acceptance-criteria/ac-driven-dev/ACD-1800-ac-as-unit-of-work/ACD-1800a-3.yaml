    agent: business-analyst
    reason: "User decisions D1, D2 and D3, and this record was the most dangerous carrier of the superseded list. Its criteria required the reference documentation to DEFINE the allowed kinds as (code, tests, docs, diagram, config), and its it_requirements designate that section as the SINGLE NORMATIVE definition that the store schema and the signoff skill both mirror -- so the wrong list would have shipped into the one place every other surface copies from, and each copy would then have been correct-by-construction against it. Amended so the documentation defines no list of its own: it points at the vocabulary the store already uses to declare what a requirement changes (D1), records the one value added for a diagram (D2), and states that a test is a proof rather than a deliverable and that no tests kind exists (D3). A second scenario makes the pointer-not-copy property testable: adding or removing a kind must not require this documentation to be edited for the two to agree."
  - date: 2026-08-31
    agent: business-analyst
    reason: "NOT AMENDED, AND CONTRADICTS THE CRITERIA ABOVE UNTIL THE IT PO RE-DERIVES IT. This record is readiness: reviewed and it_requirements is the IT PO's field, so it was left untouched: its first entry still instructs the author to document 'the allowed kinds {code, tests, docs, diagram, config}', which is exactly the list the amendment removes. A documentation-expert reading it_requirements rather than criteria will write the superseded list into the normative section. This needs the IT PO before the record is built."
  - date: 2026-08-31
    agent: it-po
    reason: "RESOLVES THE CONTRADICTION THE ENTRY ABOVE FLAGGED, on the record the BA correctly identified as the most dangerous carrier. criteria untouched. it_requirements: the instruction to document 'the allowed kinds {code, tests, docs, diagram, config}' is DELETED and replaced by an instruction to define no list at all -- point at the change-target vocabulary, record `diagram` as the one value added to it, and state that a test is a proof and no `tests` kind exists. A separate entry makes the pointer property an obligation rather than a style preference: adding or removing a value must not require this section to be edited, so a prose enumeration is forbidden even when currently accurate, because a stale correct-looking list is indistinguishable from a current one. The spec-parity entry is kept but its scope narrowed in writing: this section stays the single normative definition of the checklist's SHAPE and of the fact that kinds come from the change-target vocabulary, and stops being the definition of that vocabulary's VALUES. expects_from restated so the documentation-expert receives the indirection ($ref to the shared enum) rather than a list to transcribe. test_required stays false -- this is a prose surface -- and the mechanical guard for the pointer property is deliberately attached to ACD-1800a-1's schema tests (test_kind_added_in_one_place_appears_in_both_enums) rather than invented here as a doc grep, which this repo rejects as coverage."
