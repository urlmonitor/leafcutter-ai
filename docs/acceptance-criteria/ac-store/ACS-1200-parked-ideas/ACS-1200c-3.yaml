notes: |
  THE recognition-not-suppression test. A half-finished, abandoned or
  interrupted tree is byte-for-byte indistinguishable from a parked one except
  for the marker; an exemption keyed off the empty child list would silence
  every one of them. This AC is what makes that distinction mechanically
  observable, and the final clause — marker added, nothing else changed, both
  verdicts flip — is what proves the marker is the actual discriminator rather
  than an incidental field.

  Placed under ACS-1200c rather than ACS-1200a on purpose: it is the guarantee
  that must survive any future relaxation of the exemption, so it belongs with
  the enforcement L1 that exists to prevent exactly that.

  Both surfaces are asserted in one criterion because they must agree; a commit
  that blocks while the health report shows the tree as parked (or the reverse)
  is the inconsistency ACS-1200b was written to remove.
