estimated_complexity: M
it_requirements:
  - "THE EMPTY CASE MUST BE DECIDED BEFORE THE LOOP, NOT BY IT. The defect being corrected is an all-must-pass aggregation over a possibly-empty collection: user-surface-smoker.md's algorithm is 'for each stanza in the block' (~line 111) and its aggregation is 'If ALL stanzas PASS: emit (status: ok)' (~line 171), so zero stanzas emits ok having verified nothing. Resolve the proof set first, refuse when it is empty and the requirement declared an observable effect, and only then iterate."
  - "THE OUTCOME MUST CARRY COUNTS, NOT JUST A VERDICT. Emit `proofs_declared`, `proofs_executed` and `proofs_observed` alongside the status. A bare pass/fail does not satisfy the fourth Then clause, and the count is what stops the defect reappearing the next time an aggregation is written over a possibly-empty collection. The verdict must name the requirement id (and, in a bundle, the member id) -- not merely the work item."
  - "THE AGGREGATION IS COMPUTED IN PYTHON AND ONLY REPORTED BY THE CRAFT. Expose the verdict from canonical source under scripts/ac_store/ so the pass/fail decision, the empty-set refusal and the counts are executable and directly testable. An agent template that re-derives the aggregation in prose is a second, untested implementation of the exact rule that failed -- and 'If ALL stanzas PASS: emit ok' living only in a Markdown template is how the current defect shipped."
  - "THREE DISTINGUISHABLE OUTCOMES, NOT TWO. `proven` (declared, proofs resolved, all observed), `unproven` (declared, zero proofs resolved -- an incomplete requirement) and `refuted` (a proof ran and its assertion failed, or its placeholder_signature matched). Never collapse unproven into refuted: the clearing action differs (author a proof vs fix the surface), and ACD-1800f-5 documents them separately."
  - "DO NOT CATCH THE LEGACY CASE. A requirement that declares NO observable effect is legacy mode and must return no verdict at all -- not `unproven` (ADR-026 rule 4, and ACD-1800f-1's third Then clause). The scope fence is mechanical: the declaration is present and non-empty. Never infer an observable promise from criteria text, change_target, files_touched or component."
  - "WIRE THE 'CANNOT BE COUNTED AS COMPLETE' CLAUSE INTO THE EXISTING DONE PATH, NOT A NEW ONE. `unproven` must make the requirement ineligible via scripts/ac_store/done_proof.py's verify_done_eligible, which is already consumed by both the check_done_proof pre-commit hook and the required CI done-proof job -- extending it inherits both enforcement points. Do not create a second eligibility oracle beside it (the BO-2900a-1 precedent)."
  - "DEPLOY-MANIFEST FIRST: the new verdict module imported by done_proof.py MUST be added to build_ac_store's deploy_map (scripts/build_phases.py ~line 794) in the same change, or the deployed check_done_proof hook and the required CI done-proof job crash with ModuleNotFoundError. Verify by running the deployed hook after ./build-self.sh, not only the source-tree unit tests, which import from the source tree and mask the gap."
  - "ADVISORY BEFORE REQUIRED AND DIFF-SCOPED (ADR-026 rule 3). During the cutover window the store will hold requirements that declared an effect under ACD-1800f-1 before anyone authored proofs under ACD-1800f-2; the refusal must make that backfill queue measurable rather than block every commit. Ship enabled and non-strict, promote only after a green self-host window, and scope done-accounting to the diff so pre-existing ACs never retroactively fail."
  - "MIXED SURFACE -- PARTIAL FLAG (S2.8). The verdict, counts, refusal and done-eligibility wiring are Python and are python-coder's. Changing templates/agents/user-surface-smoker.md Step 6 to report the computed verdict instead of re-deriving 'if ALL stanzas PASS' is a `.md` edit outside python-coder's surface and needs an llm-expert pass; see the caveat in notes. The Python verdict must not be signed off as if the craft had been repointed."
delivers_to:
  agent: python-coder
  contract: "Observation verdict, emitted from scripts/ac_store/: { status: 'proven'|'unproven'|'refuted'|null, proofs_declared: int, proofs_executed: int, proofs_observed: int, per_requirement: [{ac_id: str, status: str, proof_index: int|null, reason: str}], reason: str }. status null means the requirement declared no observable effect and this rule did not apply (legacy mode). Consumed by scripts/ac_store/done_proof.py's verify_done_eligible as a further eligibility condition, by ACD-1800f-4's bundle aggregation and attribution, and by templates/agents/user-surface-smoker.md as the outcome it reports rather than re-derives."
expects_from:
  ac_id: ACD-1800f-2
  contract: "The store-only resolver `resolve_observation_proofs(ac_ids, *, ac_root)` returning the ordered proof list per requirement, with an empty result for a requirement that authored none. The empty result is the input this AC turns into `unproven`, so the resolver must distinguish 'declared and resolved zero' from 'did not declare'."
test_spec:
  - name: test_declared_effect_with_no_proof_reports_unproven_and_names_the_requirement
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Runs the real verdict function over a real on-disk AC that declares observable_effect and carries no observation_proofs; asserts status is 'unproven', that it is not a pass, and that the AC id appears in the emitted reason. This is the assertion that fails today: the equivalent path emits ok."
  - name: test_declared_effect_with_three_observed_proofs_reports_proven_with_a_count_of_three
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Executes three real proofs that are all observed and asserts status 'proven' with proofs_executed == 3, asserted in the same suite as the empty case so a refuse-everything implementation cannot pass."
  - name: test_an_executed_none_run_is_distinguishable_from_an_all_observed_run
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Compares the emitted outcomes of the two runs above and asserts they differ in proofs_executed, not only in status -- the fourth Then clause. A bare pass/fail pair would satisfy the first three descriptors and fail this one."
  - name: test_unproven_requirement_is_refused_by_the_real_done_eligibility_gate
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Calls the real verify_done_eligible in scripts/ac_store/done_proof.py for an unproven requirement that has a passing covers-tagged test, and asserts eligible is False with a reason naming the unproven observable promise. Proves the refusal is consumed in control flow, not merely emitted."
  - name: test_requirement_declaring_no_observable_effect_is_not_judged_by_this_rule
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "A legacy AC with no declaration yields no verdict and stays eligible -- the ADR-026 rule 4 scope fence holds and the migration cannot mass-refuse the existing store."
  - name: test_a_failed_assertion_reports_refuted_not_unproven
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "A requirement with one proof whose assertion does not match reports 'refuted' with the proof index, distinct from 'unproven' -- the two have different clearing actions and must not be collapsed."
test_rationale: "This AC exists because a mandatory gate has been emitting a pass while verifying nothing, so the one shape of test that must not be written is the shape that would have missed it: asserting the source contains an `if not proofs:` branch passes on a branch that is never reached, exactly as the current 'for each stanza' loop passes on a block nobody writes. Every descriptor therefore drives the real verdict function over a real on-disk requirement and asserts the emitted outcome. The empty-set and all-observed cases are asserted in the same suite so a refuse-everything implementation cannot pass the first descriptor alone, and the counts comparison is separated out because a bare pass/fail verdict satisfies the refusal clauses while leaving the durable half of the fix -- distinguishability -- unbuilt. The done-eligibility descriptor is what proves the refusal is consumed rather than merely logged."
