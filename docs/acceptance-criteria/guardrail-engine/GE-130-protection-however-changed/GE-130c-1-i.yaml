id: GE-130c-1-i
title: When the after-the-fact check cannot tell what a command changed, it says so and stops the run
  instead of reporting nothing changed
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a command the before-check could not judge,
  And the state of the watched files immediately before or after that command cannot be
    established -- it could not be read, or the comparison did not complete,
  When the command finishes,
  Then the protection states that it could not tell which watched files the command changed,
    names itself and the command, and stops the run,
  And it does not report the command as having changed no watched file,
  And in the same run a command for which the comparison did complete and found no watched file
    changed finishes with no stop, so "could not tell" and "nothing changed" reach different
    outcomes.
