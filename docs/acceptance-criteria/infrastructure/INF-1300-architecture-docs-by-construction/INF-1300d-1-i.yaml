id: INF-1300d-1-i
title: "Which names are recognised is read from the project's declaration, so changing the declaration changes what is accepted"
component: infrastructure
components:
  - documentation_system
  - infrastructure
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300d.yaml"
criteria: |
  Given the project's declared vocabulary of kinds of picture is held in the one
    place the project already treats as its statement of that vocabulary,
  When a kind is added to that declaration and nothing else in the project is
    changed,
  Then a request naming the added kind is accepted, and a document is produced for
    it,
  And when a kind already declared is then marked as retired in favour of another
    and nothing else is changed, a request naming it is accepted with the
    substitution stated,
  And when a kind is removed from that declaration and nothing else is changed, a
    request naming it is refused,
  And no list of kind names is held anywhere in what performs the work, nor in
    what observes it — a name appearing in either, other than as a value read from
    the declaration, is a failure of this criterion.
