id: BP-300e-1-iii
components:
  - build_pipeline
title: "An already-parsed (non-string) result is passed through unchanged"
component: build-pipeline
level: L3
status: active
req_status: draft
readiness: approved
priority: high
work_status: done
criteria: |
  Given a workflow dispatches a helper agent and receives its result already as a
    structured object or array rather than as a string of text (the runtime handed
    back an already-parsed value),
  When the workflow reads that result through the same tolerant reply reader,
  Then the value is returned unchanged with no attempt to re-parse it as text,
  And the run continues normally.
depends_on:
  - BP-300e-1
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "A non-string (already-parsed) input is returned unchanged with no string-parse attempted; this degenerate branch must precede any parse attempt in the reader."
  - "The tolerant reader stays a pure, synchronous, dependency-free function; confine try/except to the JSON.parse boundary only."
  - "Behavior must be verified by a runtime behavioral test through the vm.Script replay harness passing native (non-string) values, not a source string-scan."
delivers_to: null
expects_from:
  ac_id: BP-300e-1
  contract: >-
    Inline tolerant reader parseAgentJson whose first branch returns any non-string raw
    unchanged before attempting JSON.parse.
