  - path: docs/acceptance-criteria/agent-registry/AR-200-capability-matches-obligation/AR-200b.yaml
    relationship: related
    status: exists
    relevance: >-
      FENCED. AR-200b matches an obligation to a TOOL the specialist needs to
      act. This goal matches an instruction to an ABILITY the specialist was
      granted. Same shape, different subject; reuse its "derive both sides"
      discipline, do not merge the records.
  - path: docs/acceptance-criteria/infrastructure/INF-600-self-describing-agents/INF-600g-3.yaml
    relationship: related
    status: exists
    relevance: >-
      SUPERSEDED BY THIS GOAL. INF-600g-3 (and its child INF-600g-3-i) defined
