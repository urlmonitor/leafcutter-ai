criteria: |
  An open fault naming finished work is raised as a conflict, every time.

  When a fault is recorded against a piece of work that the project already counts
  as finished, that pairing is surfaced as a conflict rather than left for someone
  to notice. Nobody has to read both records side by side to find out that the
  system is claiming something it cannot do.
