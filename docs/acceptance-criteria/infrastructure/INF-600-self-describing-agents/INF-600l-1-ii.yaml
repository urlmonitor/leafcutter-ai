it_requirements:
  - "When no agent registry is present, SKIP the entire mirror comparison (fail-open no-op) -- a project that does not use the agent subsystem must never be false-failed by this check."
  - "The skip must be observable (advisory note that no registry was found); this is the registry-absent counterpart to the card-absent fail-open (INF-600l-1-i), consistent with the opt-in scoping in INF-600l-2."
  - "PORTABLE SURFACE: this registry-absent fail-open lives in the same EXISTING hook (templates/scripts/commit_guardian/hooks/check_agent_spawn_consistency.py) extended in INF-600l-1; the registry-absent no-op is what keeps the deployed hook harmless in a consumer that does not use the leafcutter agent subsystem at all. ADR-001 build.py round-trip parity applies."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
