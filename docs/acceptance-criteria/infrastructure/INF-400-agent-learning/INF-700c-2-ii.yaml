notes: |
  This is the anti-cheat clause for INF-700c-2. The cheapest way to make a
  permanently non-zero backlog go to zero is to stop counting, and that would
  pass INF-700c-2 read on its own while destroying the same signal it was
  written to protect. The rise-again clause is the discriminator: only a count
  that still responds to new input is a count.
