id: BP-900e-1
readiness: approved
priority: high
title: "A hook registered in commit_guardian.json with no template copy fails the registry-completeness gate"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: not_started
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900e.yaml"
criteria: |
  Given the commit-guardian hook registry
    (scripts/commit_guardian/commit_guardian.json) registers a hook whose entry
    resolves to the script path scripts/commit_guardian/check_test_fixture_bloat.py
  And that script exists under scripts/commit_guardian/
  And no copy of that script exists anywhere under templates/scripts/
    (specifically templates/scripts/commit_guardian/check_test_fixture_bloat.py
    is absent)
  And the registry also registers a hook resolving to
    scripts/commit_guardian/hooks/check_agent_spawn_consistency.py
  And no copy exists under
    templates/scripts/commit_guardian/hooks/check_agent_spawn_consistency.py
  When the registry-completeness check runs at the finalize merge gate
  Then the check fails the merge gate
  And the failure names both check_test_fixture_bloat.py and
    check_agent_spawn_consistency.py as registered-but-undeployed scripts
  And the merge stays blocked until each named script has a deploy-source copy
    under templates/scripts/ (or its registration is removed)
