notes: |
  BOUNDARY WITH BO-3200e, and it is a fine one that was argued before the record was
  written. BO-3200e is about what a CHECK reports when its own inspection could not be
  performed -- its three answers are "in order", "has a problem", "could not tell".
  This L1 sits one layer beneath: the check cannot choose the third answer if the
  layer feeding it has already converted a refusal into a read failure. BO-3200e-1's
  second Given enumerates exactly two ways an inspection can fail -- "the subject
  cannot be read, or what it read cannot be interpreted." A refusal is neither. The
  user considered folding this in as a fifth L2 under BO-3200e and chose a full L1
  on 2026-09-16, on the grounds that "you are not sent to repair a healthy file" is a
  distinct benefit from "a check that could not look says so".

  BOUNDARY WITH BO-3200c-2 AND ACD-2100c. Those cover a refusal misread as the USER'S
  CONSENT (KI-ACD-005). This covers a refusal misread as an I/O FAILURE (KI-ACD-009,
  KI-BO-018). Both must exist; neither is a special case of the other, and the
  remedies differ -- one is about provenance of an answer, this is about the class of
  an outcome.

  BOUNDARY WITH ACD-2100b. That L1 enumerates four startup-check outcomes: registry
  unreadable, uninterpretable, agent absent, agent denied. When this record was
  written, a refusal was a possible FIFTH on that path and was not among them.
  ACD-2100b-3-i already demonstrates the enumeration is not closed, and ACD-2100b-4's
  it_requirements warn against implementing the guard as a four-branch table.
  CORRECTED 2026-09-30. As written on 2026-09-16, this paragraph went on to say that
  ACD-2100b had been amended to name the fifth outcome. That amendment was removed by
  0ac98ffd, and none is needed. ACD-2100b-5's pre-flight (e4ee392d) reads the
  registry before the run starts, so the startup check dispatches no agent and no
  party on that path can refuse. ACD-2100b stays at four outcomes. WHAT THIS CHANGES
  FOR THIS L1: it no longer relies on ACD-2100b to carry the rule on the startup
  path, and its anchor case now lies on a path that no longer dispatches. The rule
  itself is unchanged. It applies to every path that still asks a party that can
  decline, chiefly the dispatches in
  KI-BO-20260927-status-checker-runs-workflow-shell-commands.

  WHY high AND NOT critical. This is the misdiagnosis rather than the blockage.
  CORRECTED 2026-09-30. As written on 2026-09-16, this said that with BO-3200f built
  the run would no longer halt here at all. The halt it meant -- /plan-feature
  stopping at the startup check -- was removed by ACD-2100b-5's pre-flight
  (e4ee392d, on main via PR #864 on 2026-09-22), not by BO-3200f, and it cannot
  recur there because that check no longer dispatches anyone. The anchor case cost
  two full runs of operator time and pointed at a 131 KB file that was present and
  readable at both candidate locations, which is why this is not medium. The same
  misdiagnosis remains possible wherever a routine step is still sent to a party
  that may decline. BO-3200f moves those steps to routes that do not decline them,
  and this L1 makes sure any decline that still happens is reported as a decline.
  The executor BO-3200f adopts, command-step-runner, can itself decline a request
  outside its role; its decline has no exit status, so it cannot pass for a
  command's result (BO-2400a-1-i).

  WHY NOT A FIFTH KNOWN ISSUE. When this record was written, four open entries
  described this family -- KI-ACD-009, KI-ACD-005, KI-BO-018, KI-BO-20260901-1620 --
  and the user directed that they be updated and cross-referenced rather than joined
  by another. As of 2026-09-30, KI-ACD-009, KI-ACD-005 and KI-BO-018 are filed under
  resolved/. KI-BO-20260901-1620 and KI-BO-20260927-status-checker-runs-workflow-shell-commands
  are open and carry the live cases.
