id: INF-1200d-1
title: "A standard the delivery has never carried before arrives without the delivery being touched"
component: infrastructure
components:
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a standard of a sort the project has never carried outward to anyone,
    governing a kind of file the ownership record assigns to a specialist,
  When that standard is stated in the one place the project declares standards,
    and nothing that carries standards outward is added or altered,
  Then that specialist begins work with the new standard stated in its material,
  And nowhere in what carried it does any step, case, entry or mapping specific
    to that standard exist,
  And given a second standard, of a different sort again, governing a different
    kind of file with a different owner, declared the same way,
  When both specialists begin work,
  Then each has the standard governing its own kind of file stated in its
    material, and the number of declared standards reaching an audience has risen
    by exactly the number newly declared,
  And given one of those two declarations is then withdrawn,
  When its owner begins work,
  Then the withdrawn standard is no longer stated in its material, while the
    other remains — so what travels is the declaration as it stands rather than
    the declaration as it once was.
