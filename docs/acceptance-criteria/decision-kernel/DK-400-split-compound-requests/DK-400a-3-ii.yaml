notes: |
  User answer to BA open question Q5 (2026-10-05): a caller-supplied decision request is NEVER
  checked for bundling or split. The caller framed it as one decision, and a split would throw
  away the caller's options and criteria. Flow v5 branch split-typed-request.
  Placed as an L3 under DK-400a-3, because DK-400a is at its 5-L2 cap. The example question
  bundles three questions on purpose: a routed goal like it would be offered a split
  (DK-400a-2), a typed request is not.
