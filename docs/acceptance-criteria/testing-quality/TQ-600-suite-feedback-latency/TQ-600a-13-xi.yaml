declared_files:
  - path: scripts/ci/_github_rest.py
    state: to_be_created
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - >-
    THE ALLOWED-WRITE LIST IS ENFORCED IN ONE PLACE EVERY WRITE PASSES THROUGH (user
    decisions B, C, D, E and I). The shared REST client refuses, before
    sending, every write that is not one of: `POST /issues` carrying exactly one of the
    labels `post-merge-red`, `post-merge-timing`, `post-merge-flaky`; `PATCH /issues/{n}`
    (body, state, state_reason) on an issue carrying one of those labels; `POST
    /issues/{n}/comments` on such an issue; `POST /issues/{pr}/comments` and `PATCH
    /issues/comments/{id}` for the hold's own marked comment on the pull request being
    evaluated; `POST /actions/runs/{id}/rerun` where run {id} belongs to the
    `post-merge-hold.yml` workflow (verified by reading the run before re-running it).
    Refused by construction: git refs, contents, pull-request create/update/merge/review,
    labels on other issues or pull requests, label creation, workflow dispatch, enable,
    disable or cancel, re-runs of any other workflow, check-run creation other than the
    one below, statuses, releases. Reads are unrestricted. AMENDED 2026-10-09 (owner
    decision, dedicated hold App): ALSO ALLOWED, and only when the request carries the
    App's installation token: `POST /check-runs` with `name` exactly `Post-merge suite
    status` and `head_sha` equal to the evaluated pull request's head SHA from the event
    payload, and `PATCH /check-runs/{id}` for a check run this evaluation created. The
    App token is refused for every other endpoint, and the GITHUB_TOKEN is refused for
    check-run writes. SUPERSEDED: "check-run creation" in the refused list without
    exception.
  - >-
    NEW WRITES, AND WHY EACH IS SAFE. (1) Editing a notice's description (decision I) is
    the notice's own state, under the `issues: write` the notice job already held —
    VERIFIED no separate permission exists. (2) Two more labels (`post-merge-timing`,
    decision C; `post-merge-flaky`, decision D) are non-holding notices of the same kind.
    (3) Re-running the hold workflow's own runs (decision E) needs `actions: write`, which
    the platform scopes broadly (it also allows dispatch, cancel, enable and disable —
    GitHub expert, Q2), so the client narrows it to one endpoint on one workflow and the
    re-evaluation job holds no other write scope. None of them changes code.
  - >-
    DEFENCE IN DEPTH IN THE WORKFLOWS. No job holds `contents: write` or the right to
    create or merge pull requests; the suite and timing test jobs hold `contents: read`;
    the fix proof's `Post-merge fix proof` job holds `permissions: {}` and its `Prepare
    fix proof` job `actions: read` and `issues: read` only (TQ-600a-13-xvi); `actions: write` appears on
    exactly ONE job in the repository's family workflows — `reevaluate` in
    post-merge-followup.yml, which serves both the verdict-change fan-out (-xv) and the
    proof re-trigger (-xvi); checkouts do not persist a git credential. Both the workflow
    scopes and the client allowlist are required. A descriptor loads every family
    workflow and asserts these scopes, because a scope is enforced only by the platform
    and cannot be executed offline (structural by necessity; the behavioural half is the
    client allowlist).
  - >-
    NO RUN EVER REGENERATES A BASELINE. Refreshing .github/test_durations.json — or any
    baseline a timing-ratio test reads — stays test-durations.yml's job, through a pull
    request. The timing lane (TQ-600a-13-xii) is where a "fix it by moving the baseline"
    step would most plausibly be added; it is covered by the mutation descriptor.
  - >-
    LATER TRIAGE FITS INSIDE THE LIST. A diagnosis posted as a comment on a notice is an
    allowed write.
  - >-
    A SYNTHETIC SCRATCH REPOSITORY STANDS IN FOR A REAL CLONE — a measured cost
    substitution (a depth-1 clone took 5.16 s at enrichment), flagged.
  - >-
    CHECK-RUN CREATION FOR `Post-merge suite status` ON A PR HEAD IS NOW AUTHORISED
    (owner decision 2026-10-09; SUPERSEDED "IF TQ-600a-13-x's FALLBACK IS ADOPTED, this
    list must be amended ... deliberately not pre-authorised"). It is authorised for the
    dedicated App's credential only, on both the primary route and -x's fallback. The
    job-scope rule is unchanged: no job's GITHUB_TOKEN holds `checks` or `statuses`,
    because the App's permission is its own and needs none.
  - >-
    TUNABLES ARE NOT A WRITE SURFACE. scripts/ci/post_merge_tunables.json (TQ-600a-13-x)
    changes only by a reviewed pull request; no family job writes it.
  - >-
    THE TESTS COST UNDER 1.0 s. The mutation descriptor executes only non-test jobs
    (notice, re-evaluation, verdict, proof prepare) on mutated workflow copies, so it
    starts no pytest.
