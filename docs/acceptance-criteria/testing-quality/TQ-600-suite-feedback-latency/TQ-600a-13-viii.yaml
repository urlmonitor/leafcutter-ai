id: TQ-600a-13-viii
components:
  - testing_quality
title: "A pull request that declares it fixes the current red run, and proves it, is not held by it — and nothing else exempts a pull request"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the latest settled post-merge run on main is red or did not complete, and the
    notice describing it is issue N (TQ-600a-13-iii),
  And the deadlock this record exists to prevent: without an exception, the pull request
    that repairs the run is itself held by it, nothing can merge, the run cannot go green,
    and the repository stops,
  And the fact that every pull request in this repository is opened by the one account
    every agent also uses, so anything any pull request can apply to itself — a label, a
    phrase — is a declaration and not a control,
  When the check `Post-merge suite status` evaluates a pull request,
  Then it grants an exemption only when BOTH hold: the pull request's description
    declares that it fixes issue N, and TQ-600a-13-xvi's proof run shows that the tests
    which failed in the current red run pass on that pull request's head — and its output
    then says it is passing because the pull request declares and proves a fix for #N,
  And a declaration is any of the closing keywords close, closes, closed, fix, fixes,
    fixed, resolve, resolves, resolved, in any letter case, optionally followed by a
    colon, followed by a reference to issue N written as `#N`, as `owner/repo#N` for this
    repository, or as this repository's full issue URL for N,
  And a declaration naming any open `post-merge-red` issue counts, so a repairer who
    referenced a duplicate is not blocked,
  And it still fails when the description names a different issue, mentions N without a
    closing keyword ("see #N", "related to #N"), names a number that merely begins with
    N's digits, names another repository's issue N, or declares a fix without a passing
    proof run for the current red run,
  And a declaration only in the title or in a commit message is not read as one,
  And no label exempts a pull request,
  And when the proof run completes after the pull request's last push, the verdict becomes
    a pass without a further push, and removing the declaration returns the verdict to a
    fail on the next evaluation,
  And every exemption granted is recorded on issue N — which pull request, which head
    commit, and which proof run — at most once per pull request per red run, so the owner
    sees every bypass in one place,
  And no exemption applies when the check holds for any reason other than a red or
    did-not-complete run — stale, disabled, never run, or could not read,
  And each case is demonstrated by evaluating the check against a pull request whose
    description is supplied, with the run history, the notice and the proof run served by
    the double, and observing pass or fail and the recorded exemption.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-vi
