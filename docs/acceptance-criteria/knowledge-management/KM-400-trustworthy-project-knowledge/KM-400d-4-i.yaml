notes: |
  Source: joint analysis /home/henzeh/.cache/lc_probe/cli_query_time_limit_analysis.md
  (2026-10-22, analysts A and B agree). On WSL2 with DNS tunneling on (the default) and a
  Windows DNS suffix search list, an IPv6 lookup of a name that has no IPv6 address stalls
  15 s; the routing driver looks up two different names per cold process (15 s + 5 s), so a
  cold connect takes about 20.7 s against a 10 s default deadline. Measured with an
  IPv4-first-with-fallback lookup: cold connect 0.92 s; full default-budget retrieval ok in
  1.57 s. Aura publishes no IPv6 address, so dual-stack clients lose nothing today.
  User-directed design (for the IT PO, not criteria): the IPv4-first behaviour is scoped by
  call site, not by host name -- it applies only while a per-thread flag is set by the graph
  adapter around its own session work (Neo4jBackend._transaction), installed once and
  idempotently; host-name scoping would miss the reader lookup. The driver's resolver hook
  and an IP literal in the URI are rejected (they cannot change the address family and break
  TLS SNI / hostname verification). Opt-out switch values: "ipv4-first" (default) and "any".
  The "unrecognised value" clause is a BA assumption (default plus warning) -- confirm at review.
  Residual risk kept visible by the opt-out: a client with an A record but no IPv4 route
  would not reach a future IPv6 address unless "any" is set.
  Out of scope: raising default deadlines, moving connect time outside the deadline, a
  background daemon, a result cache.
