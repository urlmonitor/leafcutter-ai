assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Parity check must only apply to the done transition, not to todo or in_progress"
  - "The --force flag must bypass parity check completely"
  - "Error message must list all agents with status 'needed', not just the first"
  - "Must not modify the ticket file when rejecting a transition"
