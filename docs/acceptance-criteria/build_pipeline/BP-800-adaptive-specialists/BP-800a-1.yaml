work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a project directory containing:
    - 3 Python files (*.py) in src/
    - 1 Go module (go.mod at root, 2 *.go files in cmd/)
    - 1 package.json with "typescript" in devDependencies
  When the technology detector scans the project at build time
  Then it reports detected languages: ["python", "go", "typescript"]
  And each detection includes a confidence indicator ("manifest" for go and typescript, "file-extension" for python)
  And the scan completes without requiring any user-provided configuration file
