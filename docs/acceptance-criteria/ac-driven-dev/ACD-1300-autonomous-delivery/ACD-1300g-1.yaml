id: ACD-1300g-1
title: Execute local implementation with tools and traceable feature context
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given an admitted feature has an isolated worktree and an ordered next AC
  When the worker dispatches local implementation
  Then the local tool-capable agent can read and edit scoped project files, run required checks, maintain documentation and perform permitted project-local dependency work
  And it receives the same feature and AC identifiers, source revisions, linked ADRs, product-truth references, prerequisite evidence and prior results
  And each passing AC produces evidence for that exact worktree and revision before its dependent is released
  And local implementation evidence alone is not target-branch completion
  And preparation leads through read-only discovery and a deterministic input gate before writable implementation
  And missing declared inputs are raised before model dispatch, without consuming a model attempt
  And discovery of otherwise unknown ambiguity cannot edit project files or authorize its own answers
  And writable implementation starts only when the current scoped input gate is satisfied
  And discovery distinguishes readiness, a request for input, refusal and execution error before any writable dispatch
  And discovery receives a readiness-assessment task without instructions to implement, repair or run implementation checks
  And discovery assesses the assigned scope, saved decisions, implementation context and verification obligations and explains why coding can start
  And when those facts are supplied in the current context, a ready assessment may advance through the satisfied input gate without an inspection tool call
  And when a required repository fact is absent from that context, discovery inspects it using read-only tools before declaring readiness
  And an empty readiness explanation cannot authorize writable implementation, while a tool call alone is not proof of readiness
  And a readiness assessment remains a model judgment and cannot override missing declared inputs, changed workspace evidence or the authority of saved human answers
  And coding receives its own implementation task with the same scoped facts and saved decisions, without being asked to return discovery readiness
  And implementation distinguishes completed work, a request for input, refusal and execution error before validation
  And final-report formatting preserves the phase-permitted tool interactions needed to inspect repository facts or perform scoped implementation
  And allowing those tool interactions does not relax the final-report contract or replace observed tool and check evidence with a completion claim
  And file contents and tool results remain worktree and execution evidence rather than becoming authoritative merely because they appear in an agent's final report
  And a ready discovery report does not count as completed implementation, and a completed implementation report does not count as passing validation
