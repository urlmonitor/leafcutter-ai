id: BP-900h-5
components:
  - build_pipeline
title: "Every guardrail the package ships reaches a verdict in the consumer install, and one that cannot run is reported as such"
component: build-pipeline
level: L2
status: active
req_status: active
readiness: approved
priority: critical
roadmap_phase: phase_1
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900h.yaml"
criteria: |
  Given the consumer-layout install of BP-900h-4,
  And the set of guardrails the package registers as running against a consumer's
    commits,
  When each registered guardrail is invoked inside that install against an input of
    the kind it guards — one input it should pass and one it should fail,
  Then each guardrail returns a pass verdict on the passing input and a fail verdict
    on the failing input,
  And a guardrail that instead stops because it could not locate something it needs
    is reported in a THIRD category, "unable to run", distinct from both pass and
    fail — because a guardrail that blocks everything and a guardrail that rejects
    the specific input in front of it are indistinguishable by exit code alone,
  And the report names, for each guardrail unable to run, the guardrail and the file
    or location it could not resolve,
  And the job's conclusion is failing when any registered guardrail is unable to run,
    with the same force as when a guardrail is missing outright,
  And the set of guardrails exercised is derived from what the package registers, so
    a guardrail added tomorrow is exercised without anyone editing a list.

  Because on 2026-08-18, in a consumer install, the document-frontmatter guardrail
  stopped on an absent type vocabulary and blocked every commit that touched
  documentation or tickets, while the package's own test suite was entirely green.
  No test had ever invoked a deployed guardrail from an install that was not the
  package's own workspace, so the difference between "runs and judges" and "cannot
  start" had never been observed for any guardrail.
depends_on:
  - BP-900h
  - BP-900h-4
