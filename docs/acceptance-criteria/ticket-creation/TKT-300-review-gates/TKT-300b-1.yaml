priority: medium
title: "Sign-off requires at least one concrete artifact reference"
component: ticket-creation
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a phase agent has completed work on a ticket,
  When it attempts to record sign-off,
  Then the sign-off payload must include at least one artifact reference
    (a file path, a test result summary, or a generated document name),
  And the system rejects any sign-off payload
    that contains zero artifact references.
