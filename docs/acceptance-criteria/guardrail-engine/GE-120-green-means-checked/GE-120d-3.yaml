notes: |
  THE FOLD QUESTION, ANSWERED EXPLICITLY. The PO gave the BA latitude: "if decomposition shows
  the set-up no-op and the check-side resolution failure are literally the same root cause,
  this L1 may be folded into GE-120b — but say so explicitly rather than dropping it."

  DECISION: NOT FOLDED. They share a root cause but not a surface, and the difference changes
  the work. The shared cause is one resolution mechanism that assumes the source-tree layout,
  which is why this AC consumes GE-120b-2's facility rather than building a second one — the
  fix is genuinely shared. But GE-120b's acceptance shape is "two runs of a check agree", and
  no amount of check-side parity produces the behaviour GE-120d-1 and GE-120d-2 require,
  because the set-up path has no verdict to compare; it has an artifact to hand over or refuse.
  Folding would have carried the resolution fix across and quietly dropped the report-and-refuse
  behaviour, which is the part that was actually observed failing.

  So: the RESOLUTION fix is shared (this AC, depends_on GE-120b-2), and the REPORTING and
  REFUSAL behaviours are GE-120d's own (GE-120d-1, GE-120d-2). That split is the answer to the
  latitude the PO granted, recorded here rather than left implicit.

  IT-PO: this AC and GE-120b-2 must be scheduled together — this one cannot land first, and
  landing GE-120b-2 without it leaves the set-up path as the last private root-walk in the
  codebase, which is the position from which the pattern regrows.

  IT-PO (2026-08-14): the specific technical risk is the IMPORT BOUNDARY —
  setup_ticket_worktree.py sits one directory above the commit_guardian package that owns
  _resolve_root.py, so the resolver must be reachable from .leafcutter/scripts/ in the
  deployed layout or set-up trades a silent no-op for a ModuleNotFoundError. The three
  layouts to run set-up in are enumerated in it_requirements.
target_epic: EPIC-TrustThatAGreenCheckActuallyChecked
