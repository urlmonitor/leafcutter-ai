test_spec:
  - name: test_driver_exit_status_is_equal_with_a_failing_and_a_succeeding_routing_step
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Drive the same unit of work twice under the engine harness, once with every destination writable and once with a destination write forced to fail; assert the driver's exit status is EQUAL between the two runs. Equality between runs, not equality to success, so the clause also holds for work that failed on its own merits."
  - name: test_a_failed_unit_of_work_still_reports_its_routing_case
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Drive a unit of work that fails on its own merits, with the routing step both succeeding and failing. Assert the routing case is present in the reported result in both variants and that the work's own outcome is unchanged by which case occurred. A failed drive must not also be a silent one."
  - name: test_the_three_routing_cases_are_distinguishable_by_a_data_field
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "Produce all three cases (ran and completed; ran and could not complete; did not run) and assert the reported result carries a distinct enumerated value for each. Assert specifically that did-not-run is NOT equal to completed-with-zero-figures — rendering (c) as (a) with zeros is exactly how an unwired pipeline reads as a healthy one."
  - name: test_the_could_not_complete_case_states_what_it_could_not_do
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "the completion path dispatched through the workflow engine harness"
    description: "With the declared sink unreadable, and separately with a destination file unwritable, assert the reported result names the routing step as not completed and carries the specific cause, and that the two causes are distinguishable from each other."
  - name: test_a_record_the_routing_step_could_not_write_is_written_by_a_later_run
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Fail a destination write, then remove the cause and drive a second unit of work; assert the destination now holds the learning and holds it exactly once. Asserts INF-400c-2-ii's retention end to end from the driver without the driver re-implementing it."
  - name: test_the_routing_failure_does_not_enter_the_unit_of_work_failure_count
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "With a failing routing step on an otherwise clean unit of work, assert the driver's failure count and any merge-deciding gate value are identical to the run with a succeeding routing step. Fail-open means the knowledge step cannot fail, retry or block the work."
test_rationale: |
  The three-case partition is the AC and it is decided by data, so the third
  descriptor asserts on an enumerated field rather than on rendered text: a
  test that greps the reported prose passes on a driver that prints the words
  and computes nothing. The exit-status descriptors are written as equality
  between two runs rather than equality to zero, because the clause must hold
  for work that failed on its own merits, and asserting success would make the
  test wrong for exactly the case the AC's last clause adds. Every descriptor
  drives a real completion path through the harness — the failure this AC
  closes is that signoff's fail-open branch has been the only reachable path
  since the feature shipped and left no countable trace, and no test that
  inspects source could have noticed that.
notes: |
  Boundary against INF-700b-1-ii. That AC owns the receipt left when an AGENT's
  capture attempt fails — the emitting side, at sign-off time, counted by
  INF-700b-3's capture-health report. This AC owns the receipt left when the
  ROUTING step fails after the work is done. They are different failures at
  different times with different readers, and a project can have either without
  the other.
change_target:
  - pipeline
  - code
risk_surface: contract_boundary
