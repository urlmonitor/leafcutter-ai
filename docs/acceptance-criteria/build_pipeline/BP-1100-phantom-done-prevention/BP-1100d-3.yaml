it_requirements:
  - "Split the command into simple commands with a quote-aware scanner, then tokenise each with shlex.split; never match on a substring of the raw command."
  - "On a shlex ValueError (unbalanced quote), fail closed: treat the segment as a commit when a commit token follows a git token."
  - "Keep the COMMIT_AGENT_MODE=1 exemption (environment variable or inline prefix token) unchanged."
