id: BO-1500a-5
components:
  - build_orchestration
readiness: draft
priority: high
title: "Authoring begins only on a positive confirmation of isolation; every other outcome halts the run"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500a.yaml
criteria: |
  Given an AC-authoring run has requested an isolated authoring workspace,
  When the workflow evaluates the setup outcome, before it dispatches the first
    authoring agent,
  Then it continues only when the outcome positively confirms isolation by naming both
    an existing workspace directory and the branch that workspace is on,
  And any other outcome stops the run before the first authoring agent is dispatched --
    including an outcome that reports no failure but confirms nothing,
  And the stop is reported to the user in the run's visible output, stating that isolation
    could not be confirmed and quoting the outcome that was received,
  And the run does not continue on the basis that no failure was reported.
depends_on:
  - BO-1500a
  - BO-1500f-1
doc_links:
  - path: docs/architecture/agent_delivery_workflows.md
    relationship: describes
    status: exists
  - path: templates/workflows-js/plan-feature.js
    relationship: modifies
    status: exists
  - path: scripts/setup_ticket_worktree.py
    relationship: models
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    isolation_confirmation:
      type: object
      description: "{ confirmed: bool, workspace_path: '<absolute path>', branch: '<branch name>' }. The single positive-confirmation record the workflow must hold before dispatching any authoring agent. Absence of the record, or confirmed=false, or a missing workspace_path/branch, all mean halt."
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "BA-supplied schema minimum — the IT PO refines this block during technical enrichment."
    - "Invert the existing default: the gate must be an allowlist on an affirmative confirmation record, NOT a denylist on an explicit failure indication. A result-handler branch keyed only on a non-zero exit indication is the defect being fixed."
    - "Distinguish this product-level always-halt-on-unconfirmed posture from the project's fail-open-on-INTERNAL-ERROR convention: an internal crash in the confirmation logic must still halt this run, because continuing means authoring into an unknown checkout."
delivers_to:
  agent: python-coder
  contract: "A confirmed absolute authoring-workspace location and branch name, or a halt -- the only two outcomes downstream authoring stages may see"
expects_from:
  ac_id: BO-1500f-1
  contract: "A setup outcome produced by an agent actually permitted to run repository commands"
origin_agent: business-analyst
created: 2026-08-14
amended_by:
  - reason: "split: BO-1500a -> BO-1500a + BO-1500f + BO-1500g [Pattern C intermediate, 11->5+3+3], 2026-08-14. This AC stays under BO-1500a and was deliberately NOT renamed (BO-1500g-2's criteria text hard-codes 'specified in BO-1500a-5'). Its depends_on and expects_from were re-pointed from BO-1500a-4 to that AC's new id BO-1500f-1; the pair now spans the a/f boundary and is otherwise intact. Criteria text unchanged."
superseded_by: null
covered_by:
  - BO-1500a-5-i
  - BO-1500a-5-ii
implemented_by: []
change_target: pipeline
risk_surface: safety
notes: |
  Regression origin: the setup-result handler stopped the run only on an explicit
  non-success indication, so a refusal or an uninterpretable reply read as "keep going".
  This AC inverts the default from fail-open to fail-closed: continuing requires an
  affirmative confirmation, not merely the absence of a reported failure.
