assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    THIS RECORD IS CONDITIONAL AND MAY END UP NOT APPLYING. If the parent's documents
    branch is chosen, nothing is excluded, and this record is satisfied vacuously and
    should be marked so rather than built. It exists to make the exclusion branch
    safe, not to push toward it.
  - >-
    AN OPT-IN NOBODY INVOKES IS NOT AN OPT-IN. The failure here is not forgetting to
    write the opt-in; it is writing it, documenting it, and never adding it to anything
    that runs. Assert the invocation, not the existence.
  - >-
    THE TWO SETS MUST COVER THE SUITE. Default collection plus opt-in collection equals
    the whole suite. A test that is in neither is deleted in effect while appearing to
    exist, which is the quietest way to lose coverage there is.
  - >-
    REFUSE THE DESELECTION WHEN THE COMPENSATION IS ABSENT. Ordering matters: the
    deselection is a one-line change and the invoked cadence is not, so the deselection
    will land first unless landing it first is made to fail.
  - >-
    SIZED AS M WHEN IT APPLIES, NOT S, AND IT MAY APPLY ZERO TIMES. If the parent takes
    the documents branch this record is vacuous and costs nothing. If the exclusion
    branch is taken it spans three files — a marker registration in pytest.ini, a new
    invoked job in .github/workflows/ci.yml, and the refusal gate itself — and the
    estimate reflects that branch, because sizing the branch that might not happen as S
    makes the branch that might happen look free.
  - >-
    HOW A FAILURE BLOCKS MERGES — RESOLVED BY THE 2026-10-08 CRITERIA AMENDMENT. The
    correctness lane (excluded tests WITHOUT the timing marker) does not feed the
    `Test suite (pytest)` aggregator at ci.yml line 412; it blocks through the required
    `Post-merge suite status` check (TQ-600a-13-ii runs it, -vi holds on it, -x makes it
    required). Until -x records the check as enforced in ruleset 17810993, this clause
    is not met and the record is not done — verify against the ruleset, not the workflow
    file. The timing lane (TQ-600a-13-xii / -xix) is the stated carve-out: its own
    `Post-merge timing suite` run goes red and the `post-merge-timing` notice names the
    failing node id, and nothing in it is read by the hold.
  - >-
    A PER-TEST-ID DESELECTION AND A SHARDED RUN INTERACT. CI shards with pytest-split
    using the committed .github/test_durations.json. Removing tests from the default
    collection changes which test ids the splitter sees, so the durations file must be
    regenerated alongside the exclusion or the shard balance drifts. This is the same
    coupling TQ-600a-9 carries; if both land, regenerate once, after both.
  - >-
    THE UNION ASSERTION MUST COMPARE TWO REAL COLLECTIONS. "Default collection plus
    opt-in collection equals the whole suite" is checkable only by running
    `--collect-only` three times — default, opt-in, and unfiltered — and comparing node
    id sets. Deriving the third set by adding the first two together assumes the very
    property under test. Collection is cheap (about 5.33 s for the whole suite), so
    three real collections is an affordable descriptor, not an expensive one.
delivers_to: null
expects_from:
  - ac_id: TQ-600a-13
    contract: >-
      The chosen outcome and, if it is the exclusion branch, the deselection mechanism
      this record constrains.
  - ac_id: TQ-600a-13-vi
    contract: >-
      The hold's verdict function (scripts/ci/post_merge_hold.py), reading only
      post-merge-suite.yml runs, which the two lane descriptors drive in-process.
  - ac_id: TQ-600a-13-xii
    contract: >-
      The timing lane (`timing_ratio` marker, `Post-merge timing suite` workflow) and the
      `post-merge-timing` notice that names a failing node id.
test_spec:
  - name: test_tq600a_13_i_the_opt_in_collects_every_test_the_default_run_excluded
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "three real `python -m pytest --collect-only -q` subprocesses: default, opt-in, and unfiltered"
    description: >-
      Collect with the default settings, with the opt-in, and with no filter at all —
      three real collections — and compare node id sets. The union of the first two
      equals the third. Do NOT derive the third set by adding the first two: that
      assumes the property under test.
  - name: test_tq600a_13_i_a_failing_excluded_test_turns_the_invoking_job_red
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "an opt-in cadence (either lane) runs the excluded tests and reports their failure without failing the job — continue-on-error or a swallowed exit status"
      - "CORRECTNESS LANE ONLY: a failing excluded test without the timing marker is run by a job whose result `Post-merge suite status` does not read, so it blocks nothing"
      - "the cadence exists in the workflow file and is never triggered by any event, so it never runs at all"
    description: >-
      Make one excluded test fail and execute the invoking job's command, once per lane.
      The job's exit status is non-zero in both. For the correctness lane, additionally
      feed the resulting verdict to the hold (TQ-600a-13-vi's verdict function, in-process
      against the fake server) and observe `Post-merge suite status` fail. THIS IS THE
      DESCRIPTOR THAT CANNOT BE DROPPED: an opt-in whose failures do not fail anything is
      a way of not running the tests while appearing to run them. Assert the exit status
      and the hold's verdict, not the presence of the job.
  - name: test_tq600a_13_i_a_timing_lane_failure_leaves_the_hold_unchanged
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "the `Post-merge timing suite` pytest step executed in a synthetic project with one failing `timing_ratio` test, then scripts/ci/post_merge_hold.py's verdict function in-process against the fake server serving that red timing run beside a green correctness run, and the notice planner given the timing verdict"
    must_catch:
      - "the hold reads runs of any workflow other than post-merge-suite.yml, so a red timing run holds every pull request"
      - "a timing-lane failure is silent: its run concludes green or the post-merge-timing notice does not name the failing node id"
      - "a timing-marked test also lands in the correctness lane, so its failure blocks merges through the back door"
    description: >-
      The timing step exits non-zero; the notice plan names the failing node id under the
      `post-merge-timing` label; the hold's verdict for a pull request evaluated afterwards
      is identical (state and reason) to its verdict with no timing run present. Paired
      control: the same failing test WITHOUT the timing marker, in the correctness lane,
      makes the hold fail. Written once -vi and -xii exist; covers -13-i, -xii and -vi.
  - name: test_tq600a_13_i_a_deselection_without_an_invoked_opt_in_is_refused
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "the refusal is downgraded to a warning, so the cheap half of the change lands alone and the compensation becomes a follow-up nobody files"
      - "the refusal checks that an opt-in is DEFINED rather than that it is INVOKED, so a workflow job that exists and is never triggered satisfies it"
    description: >-
      Configure the deselection with no invoked cadence present. The configuration is
      refused, with a non-zero status, and names what is missing.
  - name: test_tq600a_13_i_a_complete_arrangement_is_accepted
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The paired control. Deselection plus a registered marker plus an invoked cadence
      is accepted and both collections work, so a check that refuses every arrangement
      does not satisfy this record.
test_rationale: |
  Every descriptor here is about the gap between a mechanism existing and a mechanism
  running, because that gap is the entire subject. The opt-in is easy to write and easy
  to never invoke, and the state in which it exists but is never invoked looks, from
  every surface anybody reads, identical to the state in which it works.

  The failing-test descriptor is therefore specified as an end-to-end observation of the
  invoking job rather than as a check that the opt-in collects the right tests. A
  collection that finds the tests and a job that ignores their result are different
  things, and only the second one matters.

  The ordering refusal is here because the deselection is one line and the compensation
  is not. Left to itself, the cheap half lands and the expensive half becomes a
  follow-up that nobody files.

  The timing-lane descriptor (IT PO reconciliation, 2026-10-08) tests the carve-out in
  both directions with a paired control: a timing failure is loud on its own surface and
  invisible to the hold, while the same failure without the marker holds. Either half
  alone would pass on a hold that ignores everything or holds on everything.

  READINESS: dropped from approved to reviewed by the IT PO on 2026-10-08 because the
  criteria changed after approval (the BA amendment above); every other amended record in
  this family is at reviewed, and an approval given to the earlier text is not an
  approval of this one. The owner re-approves.
