test_spec:
  - name: test_store_wide_pass_refuses_unregistered_producer_naming_path_and_value
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "validate_ac_schema.py run as a real subprocess against an on-disk fixture store (records serialised through the same writer the store uses) exits non-zero, and the output names both the offending record's file path and the value finalize-feature-workflow, while naming neither the python-coder nor the test-failure-triage record."
  - name: test_commit_hook_refuses_unregistered_producer_and_provably_saw_the_file
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "scripts/commit_guardian/check_ac_schema.py"
    description: "The hook is executed the way it actually runs — staged set supplied via HOOK_TEST_STAGED_FILES or a real git index, not argv, since _get_staged_ac_paths ignores argv entirely — and the fixture's path appears in the refusal output before the non-zero exit is trusted."
  - name: test_both_entry_points_return_the_same_verdict_and_the_same_message
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: seam
    description: "The identical fixture record is put through the store-wide pass and the commit-time gate in one test; both refuse and the refusal text is byte-identical, which is only achievable if one helper produced both."
  - name: test_rule_runs_on_the_jsonschema_path_not_only_the_manual_fallback
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: unit
    angle: reachability
    description: "With jsonschema and PyYAML both importable — the real commit environment, where schema_validated suppresses validate_manually — the unregistered producer is still refused. This is the load-bearing test: a rule placed in validate_manually passes every other test here and never fires in production."
  - name: test_registered_producers_are_accepted_with_a_nonzero_examined_count
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: criterion
    description: "A fixture store containing only python-coder and test-failure-triage records passes, AND the run reports a stated non-zero count of records examined — a zero-examined pass must fail this test (KI-ACS-001)."
  - name: test_newly_registered_agent_is_accepted_with_no_other_file_edited
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: boundary
    description: "An id absent from the shipped registry is added to a fixture registry only; a record naming it is then accepted. Proves the vocabulary is read at check time and fails on any hard-coded or schema-enum allow-list."
  - name: test_quoted_spelling_of_a_registered_agent_is_accepted
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: boundary
    description: "A record written as assigned_agent with a double-quoted registered name is ACCEPTED by the membership rule, since it parses to that registered name. Guards the over-strict implementation that would refuse the 16 such records already in the store."
  - name: test_deployed_hook_imports_the_shared_module_without_modulenotfound
    target_dir: unit_tests/build_pipeline/
    framework: pytest
    type: integration
    angle: deployed
    surface_invoked: "scripts/build.py --target-dir <tmp>"
    description: "build.py is run into a temporary target and the DEPLOYED check_ac_schema.py and validate_ac_schema.py are then executed there; both must import their shared modules and reach a verdict rather than raising ModuleNotFoundError (KI-BP-016). Source-tree unit tests cannot see this gap."
test_rationale: |
  A test that greps a validator source file for a rule name, a constant, or an
  error string is not evidence. It passes on dead code, on a rule that is
  defined and never called, and on a rule wired into an entry point nobody runs
  — which is the precise failure this criterion exists to prevent one level
  down.

  The covering tests must EXECUTE the validator. Build a real on-disk fixture
  store: one record carrying `assigned_agent: finalize-feature-workflow`, one
  carrying `assigned_agent: python-coder`, one carrying
  `assigned_agent: test-failure-triage`. Run the validator against it as a
  process and assert (a) a non-zero exit, (b) the offending record's file path
  and the offending value both appear in the output, and (c) the two valid
  records are not named. Then run it against a store containing only the valid
  records and assert a zero exit.

  Both entry points must be exercised independently — the commit-time check and
  the store-wide pass — against the SAME fixture, asserting the same verdict and
  the same message. A test that exercises only one of them cannot detect the
  drift this criterion's second scenario is about, and the two surfaces have
  drifted before (ACS-200e).

  Registry-read must be proven, not assumed: add an agent id to a fixture
  registry, re-run, and assert a record naming it is now accepted. A test that
  only checks the currently-registered names passes equally on a hard-coded
  allow-list.

  Guard the empty run. Until 2026-08-19 the store-wide validator printed success
  and exited 0 when its arguments resolved to zero files, so a sweep that
  checked nothing was indistinguishable from a clean one (KI-ACS-001). Every
  test here must assert on a stated count of records examined, not merely on the
  exit code, or a regression that makes the rule unreachable will read as green.
declares_side_effect: false
notes: |
  WHERE THE RULE HAS TO LIVE, and why the obvious answer is wrong.
  `scripts/ac_store/validate_ac_schema.py` is NOT what the required CI check
  "AC store valid" runs. That job (.github/workflows/ci.yml, job `ac-store-valid`)
  runs `pre-commit run check-ac-schema` and five sibling hooks, diff-scoped to the
  PR; `validate_ac_schema.py` appears in no CI job at all. It is the manual
  store-wide sweep CLAUDE.md prescribes, plus a step in quick-fix.js. So a rule
  added only to `validate_ac_schema.py` does NOT become a merge gate, and a rule
  added only to the hook is invisible to the sweep.

  The `components` precedent already solved this shape and is the one to copy:
  the rule itself lives in a shared helper (`scripts/ac_store/_ac_components.py`,
  functions `load_registry_ids` + `components_field_errors`) which callers import.
  The equivalent here is a single shared agent-name helper imported by BOTH the
  commit-guardian path (`templates/scripts/commit_guardian/_ac_schema_validators.py`,
  which `check_ac_schema.py` imports and which the required CI check therefore
  runs) and `validate_ac_schema.py`. One rule, two entry points, no drift. Note
  the deploy-manifest trap: a new module imported by a guardian hook must be added
  to the build deploy map or the deployed hook raises ModuleNotFoundError and
  blocks every merge (CLAUDE.md, "New Hook / Gate Dependencies").

  THE FIELD ALREADY REACHES LIVE DISPATCH, so this is not preventative hygiene.
  `generate_ticket_from_ac.py` writes the value verbatim into the generated
  ticket's phase map (`agents_legacy[assigned_agent] = "needed"` at ~line 1116,
  and `all_needed.add(assigned_agent)` at ~line 964 on the computed path), and
  `templates/workflows-js/build-feature.js:1498` dispatches `agentType: phaseName`
  from that map. A fourth consumer exists that is easy to miss: the generated
  agent cards group ACs by `assigned_agent` (docs/reference/ac-schema.md,
  agent-cards section), so an unrecognised or differently-spelled value silently
  splits an agent's backlog.

  A THIRD AGENT VOCABULARY EXISTS AND IS OUT OF SCOPE HERE, but should be named
  so it is not mistaken for settled: `_ac_schema_validators.py` hard-codes
  `_CODER_AGENTS = {"python-coder", "sql-coder", "frontend-coder"}` (~line 56)
  and never consults the registry, and `generate_ticket_from_ac.py` keeps its own
  `_KNOWN_CODERS`. Deriving those from the registry's `produces` field is a
  separate change; this criterion only makes the NAME valid, not the ROLE.

  WHAT THIS UNBLOCKS (deliberately not specified here):
  - Letting the fast lane dispatch the producer a criterion names, instead of
    hard-coding one coder. ADR-035 Decision 3 makes this criterion prerequisite 1
    of three; the other two are BO-2400f-12's up-front refusal, and KI-BO-019 /
    KI-BO-020 being fixed so the lane can complete one end-to-end run.
  - Deciding WHICH registered agents may legally be a build phase. The registry
    cannot express this today: exactly 24 of the 60 agents carry
    `is_ticket_phase: true` and that set is identical to `phaseOrder` in
    build-feature.js (lines 284-308, verified — 24 entries), but ADR-035 measured
    17 agent templates self-declaring "internal — invoked by X only" in
    contradiction with their registry `spawned_by` (the brief said 19; ADR-035
    reports 17 measured and notes 19 as reported-but-unverified), and 2 registry
    entries have no deployed template at all (`architect-review-deep`,
    `conflict-resolver-deep`). ADR-035 Decision 1 has already settled that the
    dispatchable set will be a hand-written closed roster, NOT the 60 and not the
    24. So this rule validates membership of the 60 only — it is deliberately not
    a dispatchability check, and must not be implemented as one.
  - Any change to the proof chain for non-code deliverables (ADR-035 Decision 2,
    which is itself blocked on `doc_links.relationship` gaining an enum).

  ---
  IT-PO TECHNICAL ENRICHMENT, 2026-08-25. Findings that change the implementation,
  recorded here because they are not visible from the criteria.

  1. THE BA'S "SHARED HELPER" DIRECTION IS RIGHT, BUT THE PRECEDENT IS ONLY HALF
     SHARED. `_ac_components.py` is imported by `validate_ac_schema.py` and
     `backfill_components.py` — and by NOTHING in the commit-guardian tree
     (verified: a grep for components_field_errors and load_registry_ids across
     templates/scripts/commit_guardian/ returns nothing). The guardian gets its
     components referential integrity from a HARD-CODED enum in
     `config/ac_store_schema.json` (line 548), whose own description says "Keep
     this enum in sync with docs/components.json". So the components rule is
     already enforced by two sources that can drift. Copying the precedent
     literally would reproduce exactly the second hand-maintained list this
     criterion's last scenario forbids.

  2. THE GATE THAT ACTUALLY RUNS IS NOT `validate_manually`. In
     `check_ac_schema.py::_validate_file`, `validate_manually()` is guarded by
     `if not schema_validated:` (lines 605-614) — it runs ONLY when jsonschema or
     PyYAML is unavailable. In this repo both are present, so a rule added there
     never fires. The unconditional seam is lines 616-625.

  3. SOURCE VS GENERATED, verified with `git ls-files`. All four files named in
     the brief are TRACKED SOURCE in this repo: `scripts/ac_store/validate_ac_schema.py`,
     `templates/scripts/commit_guardian/_ac_schema_validators.py`,
     `config/ac_store_schema.json`, `config/agent_registry.json`. Each is ALSO a
     build INPUT: `build_ac_store` copies `scripts/ac_store/*` to
     `<target>/scripts/ac_store/`, `build_commit_guardian` copies the whole of
     `templates/scripts/commit_guardian/` to `<target>/scripts/commit_guardian/`,
     and the deployed layout carries `.leafcutter/config/agent_registry.json`.
     `templates/scripts/ac_store/` exists but contains only `.gitkeep` — there is
     no template copy of the validator, so nothing here can or should be
     byte-parity checked against a template. Practical consequence: a new file
     under `templates/scripts/commit_guardian/` deploys automatically (whole-dir
     rglob), whereas a new file under `scripts/ac_store/` deploys ONLY if it is
     listed in `deploy_map`.

  4. `_ac_components.py` IS MISSING FROM `deploy_map` TODAY — filed as KI-BP-016
     and confirmed live: the deployed copy raises
     `ModuleNotFoundError: No module named '_ac_components'`. Nothing in
     `.github/workflows/` invokes that script, and in this repo `scripts/` is
     source, so the package's own CI is unaffected. In a CONSUMER install
     `scripts/` IS the deployed copy, and CLAUDE.md's AC-store hygiene section
     prescribes exactly that command — so the documented store-rot defence cannot
     start at all for any consumer. Same defect class as the new module, one
     import away; fix both together.
