criteria: |
  Given a feature that bundles three requirements, two of which promise
    observable effects and carry one proof each,
  When the observable promises of the feature are checked,
  Then both proofs are executed, and the feature is only counted as proven when
    both are observed,
  And each proof runs against a starting state unaffected by the other proof's
    run,
  And when the second requirement's proof is not observed, the reported outcome
    names that requirement, not merely the feature,
  And checking the second requirement on its own, with no bundle, executes the
    same proof and reaches the same outcome.
