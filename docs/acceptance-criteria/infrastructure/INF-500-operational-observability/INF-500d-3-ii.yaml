id: INF-500d-3-ii
components:
  - infrastructure
  - feedback_collector
title: "Every agent sends its submission's error stream to a file of its own, so its recovery search reads only its own submission"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given every shipped agent instruction that submits a report and saves the
    submission's error stream to a file for the id-recovery step,
  When the file name each instruction prescribes is filled in for two concurrent
    runs — a python-coder signing off on ticket 03-add-parser and a pr-reviewer
    signing off on ticket 05-wire-cli in the same epic drive,
  Then the two runs resolve to two different files,
  And the name each run resolves to includes the ticket it is signing off on and the
    phase name it is submitting as,
  And no shipped instruction prescribes one fixed file name that every caller shares.

  Given two ticket supervisors driving tickets 03-add-parser and 05-wire-cli in
    parallel,
  When both record the same kind of supervisor event (for example a halt) within the
    same second,
  Then each supervisor's submission writes its error stream to a different file,
  Because a name keyed only on the event kind is shared across every ticket in the
    batch and recreates the collision this record removes.

  Given one agent run whose submission printed nothing on standard output,
  When it runs the documented recovery search,
  Then the search reads only the file that run's own submission wrote,
  And another agent's submission that finished in the same second cannot have
    written to that file.

  Given the set of shipped instructions that redirect a submission's error stream,
  When a check scans the deployed instructions,
  Then it reports how many redirecting instructions it inspected,
  And it fails when that count is zero,
  And it fails when any of them prescribes a name without both the ticket and the
    phase in it.
