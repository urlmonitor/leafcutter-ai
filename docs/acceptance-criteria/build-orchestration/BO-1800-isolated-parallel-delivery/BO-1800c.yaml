readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Parallelism scales with your machine -- only the crowd on a single feature is capped.

  There is no arbitrary limit on how many independent features run at the same
  time; that is bounded only by the resources of your machine. The only thing
  capped is how many agents pile onto one feature, where extra hands stop
  helping and start getting in each other's way.
