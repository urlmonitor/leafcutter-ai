notes: |
  This is the criterion that makes BO-2400c-1 true rather than merely implemented. The
  parent promises that the prompt a fast-lane agent receives is laid out stable-first
  with a cache breakpoint. Today no fast-lane invocation has ever assembled a prompt that
  way: the layer is pure, tested and documented, its only production reference is a call
  from an orphaned runner that cannot reach it, and the live lane does not mention it.

  The load-bearing word is CONSUMPTION. An acceptance criterion satisfied by "the
  workflow refers to the layer" is worth nothing here — that is literally the state we
  are in, and it is the state that read as done. The only observable that distinguishes
  a wired lane from an unwired one is the text a dispatched agent actually received,
  which is why every covering test runs the lane and reads the recorded prompts.

  The second scenario exists because silent fallback is what would let this regress
  invisibly. If the assembly fails and the lane simply builds its prompts the old way,
  the run still succeeds, the tests still pass, and the caching is gone again with no
  signal. A lane that cannot assemble its context must say so.
