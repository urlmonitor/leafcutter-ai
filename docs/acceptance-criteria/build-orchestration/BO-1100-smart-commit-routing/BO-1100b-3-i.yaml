criteria: |
  Given the user has confirmed a mixed commit after the mixed-change warning,
    and the staging area contains files in groups "tickets" and "implementation",
  When the commit agent composes the message for the confirmed mixed commit,
  Then the subject line or body includes an indicator that this was an intentionally
    mixed commit (e.g. a "mixed:" prefix, a "Mixed commit:" body header, or a
    note listing both groups),
  And the history reader can distinguish this commit from a single-group commit
    by reading the message alone,
  And the message still references the specific files or identifiers from each group.
