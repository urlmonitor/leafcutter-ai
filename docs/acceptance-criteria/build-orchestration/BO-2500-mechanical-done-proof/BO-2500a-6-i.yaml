id: BO-2500a-6-i
components:
  - build_orchestration
  - testing_quality
title: "Editing only a non-coverage field of a done composite does not trip the proof-of-done check"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a work_status: done composite AC whose children are each covered by a
    passing "# covers:" test,
  When only a non-coverage field of that composite is changed (for example a new
    child identifier is appended to its covered_by) and the change is submitted,
  Then the proof-of-done coverage check does not fail the merge with a
    "no linked test found" result for the composite,
  And the check reports the composite as satisfied via its children,
  And the change is not hard-blocked by the required proof-of-done check.
depends_on: [BO-2500a-6]
doc_links:
