readiness: approved
priority: high
title: "Recognized patterns are defined in one place"
component: ac-store
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Single authoritative definition for every shared behavior pattern.

  Each recognized pattern — whether an atomic component like a sortable table
  or a composite like a CRUD list page wired to a paginated collection — has
  exactly one AC that defines its behavior. All consuming pages reference this
  single definition. A pattern definition is an ordinary AC YAML record living in
  the AC store itself, at
  docs/acceptance-criteria/<component>/<feature-folder>/<id>.yaml, addressed by its
  AC id; no separate catalog is needed. It is NOT an entry in docs/components.json
  and NOT an entry in docs/acceptance-criteria/index.yaml.
