title: "The action a drift gate prescribes is one that, carried out, clears the report -- and where the build cannot produce the artifact, the gate does not send the reader to the build"
component: build-pipeline
level: L3
status: active
req_status: draft
readiness: draft
priority: high
roadmap_phase: phase_1
work_status: todo
criteria: |
  Given a file that sits inside a directory a drift gate inspects but that no run of
    the build can ever produce -- a file the tooling itself writes while running, a
    file holding one machine's own local settings, or a file the project supplies as
    its own configuration -- and given that file is neither recorded by the build nor
    declared exempt,
  When the gate inspects it and reports it as an artifact it could not compare,
  Then the remedy the gate names for that file is one that, carried out exactly as
    named and nothing else, makes the gate stop reporting it,
  And because no build run can produce that file, the remedy the gate names for it is
    not to run the build: the gate says instead that the file is not something the
    build produces, and names what does resolve it -- declaring it exempt on a stated
    ground, or removing it -- so a reader who does what the gate tells them arrives at
    a gate that passes rather than at the same message a second time,
  And this is proved by carrying the named remedy out and running the gate again as a
    separate run, and observing that its report for that file has changed and its
    outcome with it, never by reading the gate's message for the presence of a
    better-worded suggestion,
  And the gate is shown, on the same tree and in the same session, to still name
    running the build as the remedy for a file the build genuinely does produce and
    has merely not recorded -- and that remedy is carried out and shown to clear that
    file -- so the behaviour is not satisfied by a gate that has stopped prescribing
    the build at all, and each verdict is attributable to the kind of file it was
    given rather than to a gate that says one thing to everybody,
  And each of those runs reports which files it could not compare, and the set is not
    empty in the runs that precede a remedy, so a gate that inspected nothing cannot
    be received as a gate that found nothing to advise on,
  And every verdict is taken from running the gate as the project runs it, over real
    files present on disk in the tree it is pointed at, and from the report it
    actually emits.
