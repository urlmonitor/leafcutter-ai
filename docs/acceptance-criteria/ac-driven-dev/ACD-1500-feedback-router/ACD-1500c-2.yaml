it_requirements:
  - "Exclusion is automatic because the queue-build step (ACD-1500a-1) uses aggregate.py --unresolved, which filters out any entry carrying resolved_at; no separate dedup list is needed for resolved entries"
  - "The distinction between parked (no resolved_at) and resolved (resolved_at set) must hold: parked entries reappear in the next scan, resolved entries do not. This is the load-bearing reason parking never calls resolve_feedback.py (ACD-1500b-4)"
