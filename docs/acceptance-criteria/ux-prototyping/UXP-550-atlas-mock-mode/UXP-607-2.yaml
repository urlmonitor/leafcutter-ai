title: "On an unlocked live-default deployment, an override to mock shows the mock badge"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given an UNLOCKED deployment whose LEAFCUTTER_MOCK env sets live as the DEFAULT data source
    and whose runtime overrides are honored (no production lock, overrides allowed),
  When a request arrives carrying a runtime override to mock (e.g. ?mock=1) and the seam
    resolves the effective source to bundled fixtures,
  Then the mock/live badge reads "mock" (not "live"),
  And every view on that page is served from the bundled fixtures,
  So the badge follows the override in both directions and never lags the resolved decision.
