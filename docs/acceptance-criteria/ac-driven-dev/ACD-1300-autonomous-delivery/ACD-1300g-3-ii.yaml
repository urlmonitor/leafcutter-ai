id: ACD-1300g-3-ii
title: First-review findings stop immediately when local repair budget is exhausted
component: ac-driven-dev
components:
- ac_driven_dev
level: L3
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given the first review reports changes for an AC whose three attempts or sixty implementation minutes are exhausted
  When the worker evaluates whether to repair the feature
  Then it preserves the first review findings and reports a human-attention blocker
  And it performs neither another local repair nor a second review without a changed and revalidated head
  And stopping or restarting cannot grant a fresh automatic allowance
