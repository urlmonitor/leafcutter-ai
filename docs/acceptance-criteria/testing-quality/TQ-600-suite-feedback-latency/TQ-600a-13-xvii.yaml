estimated_complexity: S
it_requirements:
  - >-
    WHY CONTEXT REMOVAL AND NOT A BYPASS ACTOR. VERIFIED (GitHub expert): the ruleset has
    `bypass_actors: []` and `current_user_can_bypass: "never"`; every agent acts as
    `urlmonitor`, the sole admin. A bypass actor for the admin role would let any agent
    merge past all six required checks without a trace in the ruleset. Removing one
    context is a visible ruleset edit with history. DECIDED BY THE OWNER 2026-10-08:
    REMOVAL of `Post-merge suite status` from ruleset 17810993's required contexts; no
    standing bypass actor is ever added. The procedure must say so, and must say that
    adding a bypass actor is not an acceptable shortcut.
  - >-
    AGENT CONFIRMED: documentation-expert. The deliverable is a procedure section in
    docs/testing/README.md (beside the hold section other records hand to the same agent)
    plus a log table there for uses and the rehearsal. The procedure's steps: read the
    ruleset (`GET /repos/{o}/{r}/rulesets/17810993`) and record it; remove only the one
    context in the ruleset UI or `PUT /repos/{o}/{r}/rulesets/17810993` with the
    required_status_checks list minus that entry (owner only — admin rights); merge the
    repair; restore the identical entry with source GitHub Actions (integration 15368);
    read the ruleset back and confirm the six original contexts are untouched and the
    hold is present; re-observe a held PR reported unmergeable (TQ-600a-13-x); write the
    log entry (date, reason, repairing PR, restore time) on the open `post-merge-red`
    notice or in the log table. A first line addressed to agents: never perform this.
  - >-
    -xviii's agent guidance must reference this procedure as owner-only, so an agent
    held by a broken check stops and reports instead of attempting it.
  - >-
    A DOCUMENTATION RECORD WITH A LIVE REHEARSAL. The behaviour is a human procedure, so
    its done-proof is the documented procedure plus a recorded rehearsal — like
    TQ-600a-13-x's observations — not a unit test. Nothing here is verified by searching
    the document for a phrase.
  - >-
    TIES TO THE ROLLOUT: TQ-600a-13-x's prerequisites include the documented procedure,
    and its rollout order ends with this rehearsal; a required check with no known way
    back is how a broken gate freezes the repository.
delivers_to: null
expects_from:
  - ac_id: TQ-600a-13-x
    contract: >-
      The enforcement state and the held-PR observation the procedure ends by repeating.
test_required: false
test_rationale: |
  No unit test: the behaviour is an owner's procedure on the hosting service, and the
  record changes only prose (change_target docs + infrastructure, no code). The proof is
  the documented procedure plus a recorded rehearsal, with date, on the real repository,
  within the first day the check is required. documentation-verifier's normal gates apply
  to the prose; nothing is verified by searching it for a phrase.
