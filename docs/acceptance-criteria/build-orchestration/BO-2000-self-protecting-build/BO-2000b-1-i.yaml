id: BO-2000b-1-i
title: "A build target that resolves inside the active worktree is refused, same as the worktree root"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a request to exercise the build,
    and the build is invoked with a target directory that resolves to a path
    inside the active worktree (a subdirectory of the worktree root, not an
    external disposable location),
  When the build is invoked,
  Then it is treated the same as targeting the worktree root itself and the run
    is refused with a message identifying the target as inside the active worktree,
  And no build output is written anywhere inside the active worktree,
  And the in-progress changes in the worktree are unchanged.
depends_on:
  - BO-2000b-1
doc_links:
