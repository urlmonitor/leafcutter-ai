notes: |
  WITHOUT THIS THE PAUSE IS JUST A SLOWER DISCARD. ACD-2100c-2 promises the work
  survives; this is the behaviour that gets the person back to it. The two are
  separable because a run can persist a perfectly good record and still restart from
  the beginning on re-entry, redoing the drafting and losing what was reviewed.

  A NEW PROCESS IS PART OF THE GIVEN. Resuming inside the same process proves
  nothing about the record -- the state is still in memory. The interval between
  pause and resume is a human one, measured in hours.

  THE FOURTH CLAUSE PREVENTS A STUCK RUN. A record left behind after a successful
  resume makes the run look permanently paused to anything that lists waiting runs,
  and the next resume then re-applies an answer to a decision already made. Clearing
  it is part of resuming.

  THE MISMATCHED-ANSWER CASE IS ACD-2100c-3-i: an answer naming a different decision
  point must not be applied to the one being waited on.

  ADJACENT WORK: the dropped-`edit`-feedback fix on worktrees/pf-gate-fix (5a3eae6d)
  touches what is carried across a gate answer. It does not cover resume-after-pause.

  2026-08-25 (it-po): the it_requirement routing the supplied answer through
  ACD-2100c-4's evaluation is the one most likely to be dropped. Resume is the obvious
  place to build a second answer path -- the answer arrives as a parameter rather than
  on the channel -- and a second path that skips the provenance check reopens
  KI-ACD-005 through the back door. The delivers_to contract to c-3-i names the two
  bindings separately for the same reason ACD-2100a-2 names a candidate set: if resume
  applies whatever answer it was handed to whatever gate it is paused at, the mismatch
  case is not representable and c-3-i cannot be built without re-opening this record.
