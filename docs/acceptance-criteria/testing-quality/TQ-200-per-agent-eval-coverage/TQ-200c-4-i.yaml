title: "A row that exists but that no run would ever reach is a gap, not coverage"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a judged proof that has been written as a row and placed on disk,
  When eval coverage for its agent is reported,
  Then a row that sits in a set the runner is not told about is reported as a gap
    naming the agent and the unreferenced set, not counted as coverage,
  And a registration that points at a set which is absent or empty is reported as a
    gap naming the missing set, rather than the agent being reported as covered,
  And a registered, non-empty set that no change to the agent's own material would
    ever select for a run is reported as a gap naming the agent, so a set that can
    never be triggered is not mistaken for a set that always passes,
  And each of these is reported as a gap in its own right, so an agent with one
    reachable row and one unreachable one is not reported as fully covered.
