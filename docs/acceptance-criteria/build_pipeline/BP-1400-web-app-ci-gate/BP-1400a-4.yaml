  - path: .github/workflows/ci.yml
    relationship: implements
    status: exists
  - path: docs/architecture/components/web-app-ci-gate.md
    relationship: describes
    status: planned
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Wire all THREE web-app check names — the build/type-check job (BP-1400a-1), the style job (BP-1400b-1), and the route-render job (BP-1400c-1) — into the main branch's required-status-checks list so a failing web-app check blocks the merge and each result is visible on the PR."
  - "Making these checks REQUIRED is a repo-admin / branch-protection RULESET step — it is NOT achievable in .github/workflows/ci.yml alone. Mirror how the Python 'Test suite (pytest)' gate became required (BP-1200c): the current main protection is a Ruleset (`require-ci-lint`), so the required-checks change is a ruleset edit, applied as settings-as-code via the GitHub branch-protection/rulesets API with a DOCUMENTED MANUAL fallback runbook."
  - "The three check names added to the required list MUST match the exact ci.yml job names verbatim (the stable `name:` values pinned in BP-1400a-1 / BP-1400b-1 / BP-1400c-1). A mismatched name silently fails to enforce."
  - "Reconcile with the path-scoping in BP-1400a-2: because the web-app jobs are path-filtered, a required-status-check that never runs on a non-web-app PR must not permanently block that PR. Verify a non-web-app-only PR still merges under the chosen required-check mechanism (skipped-as-neutral, or a no-op success job on non-web changes)."
  - "EMU/account constraint (CLAUDE.md): branch-protection/ruleset API calls require the non-EMU urlmonitor account. The settings-as-code script must run under (or document switching to) `gh auth switch --user urlmonitor`; verify with `gh auth status` before invoking the API. Note the repo main protection is a Ruleset (id 17810993), so use the Rulesets API/UI, not classic branch-protection endpoints."
  - "The settings-as-code change must be idempotent: re-running against already-correct protection converges to the same required-checks set without duplicating or dropping the existing required checks (Lint (ruff), Component vocab style, Test suite (pytest))."
test_spec:
