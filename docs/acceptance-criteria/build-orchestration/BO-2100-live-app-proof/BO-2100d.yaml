criteria: |
  Misconfiguration or a missing prerequisite fails loudly, never silently.

  When live testing is switched on but cannot actually run — a setting is wrong or a
  required prerequisite is absent — the pipeline reports a clear, visible error
  rather than quietly doing nothing and letting you believe the check happened.
