notes: |
  THREE WAYS A CLOSED LIST LEAKS, AND ALL THREE FAIL IN THE UNSAFE DIRECTION IF
  LEFT UNSTATED.
    - Letter case. If matching is case-sensitive, "NOTES.MD" is checked. That is
      the safe direction, but it is a false positive on a genuinely prose file and
      it is the kind of surprise that gets an exemption widened carelessly later
      to make it stop. Fold the case.
    - Compound suffixes. If the test is "does the name contain an admitted
      extension", then "notes.md.bak" — an editor backup, or a credential-bearing
      file renamed out of the way — is exempt. Read the final extension only.
    - No extension. "Makefile" has no extension to compare, and a rule that
      treats "no extension" as "nothing disqualifying" admits every extensionless
      executable in the tree. Absence from the list is exclusion; there is no
      third state.

  THE SEPARATOR ARM IS ABOUT ONE FILE GETTING ONE VERDICT. The check receives its
  paths from the staged set, while the scanner beneath it can be handed paths in
  other forms; the same file must not be admitted by one route and checked by the
  other. This is the same normalisation concern GE-123d-2 records for its own
  gate, expressed here as an observable rather than as a technical instruction —
  the IT PO will decide how it is satisfied.

  FIXTURE PLACEMENT, STATED AND JUSTIFIED. All four fixtures sit in one directory
  of the skill-prompt area so that location, directory and content are identical
  across them and the only variable left is the spelling of the name. The
  four-file single-run shape is load-bearing: an exact count of two across four
  files staged together is what shows the decision is made per file from its own
  name. Real files in a throwaway git repository, token assembled at runtime from
  fragments, driven through the pre-commit secrets check. Pair with the
  "scripts/build_probe.py" control from the parent so the two silent files are
  evidence rather than an absence.

  ONE ARM IS GREEN ON ARRIVAL. Today every one of these four files is exempt, so
  "NOTES.MD is silent" and "notes.md is silent" both pass before any change. Only
  the two reported findings are red today. Do not read a passing run of the
  silent halves as evidence the gate exists.
