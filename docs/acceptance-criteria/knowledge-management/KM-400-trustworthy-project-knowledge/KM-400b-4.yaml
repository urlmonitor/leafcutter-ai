criteria: |
  Given A contains AC X with a link to test T and B renames X's file, changes its text and removes that link
  When B is published and queried
  Then X keeps its canonical ID and cites its new path and B's content
  And the removed link is absent from B
  And an entity deleted in B is absent from B
  And retained A evidence still cites A's former content and relationships
