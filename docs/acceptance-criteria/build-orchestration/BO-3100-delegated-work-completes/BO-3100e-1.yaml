id: BO-3100e-1
title: "A positive, well-formed verdict from a step whose own result does not exist is not counted as done"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a step whose declared result is that the change is published where the team
    can see it and a review of it is open,
    And the step returns a well-formed report and records a positive verdict for
      itself,
    And, looked for directly, the change has not been published anywhere the team
      can see it and no review of it exists,
  When the step's completion is judged,
  Then the step is not counted as done,
    And it does not appear among the steps the build records as completed,
    And the judgement is unchanged by the wording of the report or by the verdict
      the step recorded for itself.

  Given the same step returning the same well-formed report and the same positive
    verdict,
    And the change has been published where the team can see it and a review of it
      is open,
  When the step's completion is judged,
  Then the step is counted as done,
  So two steps whose reports are identical receive opposite judgements, because the
    judgement is read from the result and not from the report.

  Given the same step whose declared result has not come into being,
    And the step nevertheless changed files in the project while it ran — it drafted
      its submission and wrote its own verdict into the work record,
  When the step's completion is judged,
  Then the step is not counted as done,
  So a step that was busy is distinguished from a step that delivered, and a generic
    did-anything-change test is not sufficient to pass this judgement.
