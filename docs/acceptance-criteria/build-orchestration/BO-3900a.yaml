test_spec:
  - name: test_windows_shaped_paths_classify_absolute_on_a_posix_host
    target_dir: unit_tests/portability/
    framework: unittest
    type: unit
    angle: criterion
    description: "Drive-letter, lowercase drive-letter, mixed-separator and UNC spellings classify absolute, and both relative spellings classify relative, when the test runs on Linux."
  - name: test_resolution_result_is_identical_under_both_simulated_hosts
    target_dir: unit_tests/portability/
    framework: unittest
    type: unit
    angle: seam
    description: "Resolving all seven spellings against C:/wt/epic with the host forced to POSIX and to Windows yields identical strings."
  - name: test_windows_fixtures_hold_literal_drive_letters_and_backslashes_on_this_host
    target_dir: unit_tests/portability/
    framework: unittest
    type: unit
    angle: failure
    description: "Anti-vacuity guard: the fixture strings contain a drive letter with a colon and a literal backslash on the running host, so fixtures built from the host separator fail loudly."
  - name: test_host_independent_classification_is_reachable_from_the_workflow_top_level_body
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: templates/workflows-js/build-feature.js
    description: "The incident's Windows ticket path, driven through _workflow_engine_harness.py on the Linux runner, reaches the phase agent prompts unjoined."
test_rationale: |
  The only CI runner is Linux, and the defect only shows on Windows. That is why it went
  unseen. A test that proves Windows handling only on a Windows host proves nothing in CI.
  A test whose fixtures are built with the host's path functions holds no backslash on
  Linux and passes whatever the code does. So the inputs have to be literal strings,
  checked for their own shape before use, and classification has to be asserted on the
  runner CI actually has. The reachability entry repeats the incident replay on that same
  runner, because a helper can classify correctly in isolation while the workflow body
  never calls it.
