test_spec:
  - name: test_handoff_instruction_requires_full_atomic_signoff
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Scan every templates/agents/*.md for a section instructing the agent to emit a handoff status tag. For each one found, assert that the same section also requires the frontmatter update AND the Sign-offs checklist entry. Derives the agent list from the templates on disk, so a newly added phase agent with an incomplete handoff instruction fails without the test being edited."
  - name: test_scan_finds_at_least_one_handoff_instruction
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "REQUIRED non-vacuity guard. Assert the scan actually located at least one handoff-instructing section. Without this, a scanner whose pattern matches nothing passes the rule above trivially and reports success having examined no templates at all -- the silent-no-op failure this repository has hit three times in its own defences."
notes: |
  OBSERVED, NOT HYPOTHESISED. On 2026-09-14, driving ticket 01 of
  EPIC-WorkIsOnlyEverMarkedFinishedThroughThe, python-coder took the Test
  Delegation handoff path. It set `python-coder: signed_off` in frontmatter and
  wrote a correct `(status: handoff)` comment, but left `- [ ] python-coder`
  unchecked in the Sign-offs checklist. Its own comment names the surface it
  updated twice -- "python-coder's own FRONTMATTER status is flipped to
  signed_off" -- and never mentions the checklist.

  THE COST WAS NOT COSMETIC. The completion write refused the ticket four
  /build-feature runs later, correctly: the record asserted in one place what it
  denied in another. The epic halted at batch 1 and its four remaining tickets
  stayed blocked behind it until the record was repaired by hand.

  There is an irony worth preserving here, because it is also the argument for
  this record. The agent that refused was applying BO-400e-1 -- the criterion
  that a close is checked against the ticket's OWN record and not against a
  caller's claim about it. It declined to accept "only commit is outstanding"
  because the record itself still showed a phase unchecked. The refusal was
  right. What was wrong was upstream: an agent had been told to produce a record
  it could not make consistent.

  WHY THIS IS AR AND NOT BO. The defect is in an agent template's instructions,
  and `templates/agents/*.md` is agent-registry's own directory pattern. It sits
  under AR-200 ("every agent that has to record a verdict is able to record
  one") beside AR-200a-1, which asks whether such a template CAN write all three
  surfaces. This record asks whether it is TOLD to. python-coder passes
  AR-200a-1 -- it declares Edit and Write -- and still produced a half-written
  record, which is what makes these two conditions genuinely distinct rather
  than one restated.
