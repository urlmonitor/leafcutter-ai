id: DK-500c-1-ii
title: Rejecting or undoing a suggestion stages nothing and changes no published category
component: decision-kernel
components:
- decision_kernel
level: L3
status: active
readiness: approved
req_status: draft
priority: high
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given a kernel run that presents the candidate cat-73d233fc8b15c735, a suggestion to add the wording "Can it be done as one small ticket?" to the published cat-1dc11c5a2ffa7310, and the candidate for "Does the option keep secrets out of the published records?",
  When the person rejects cat-73d233fc8b15c735, undoes the suggested addition to cat-1dc11c5a2ffa7310 and accepts the third candidate,
  And the run ends,
  Then no record is staged for cat-73d233fc8b15c735 and none for cat-1dc11c5a2ffa7310,
  And cat-1dc11c5a2ffa7310 keeps exactly its published wordings and members,
  And cat-73d233fc8b15c735 does not become a record,
  And the accepted third candidate is staged.
depends_on:
- DK-500c-1
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500c-1
  contract: Approval path for candidates and grouping suggestions in the criteria.review run.
change_target: code
risk_surface: internal
it_requirements:
- A rejection or an undone suggestion stages nothing and leaves every published category byte-identical.
- 'IT PO default for the BA''s open point (confirm with the user): a rejected candidate is recorded in the mining store as rejected (rejected_by, rejected_at), not deleted, so the next mining round does not propose it again. A sighting that was not part of it at rejection time re-opens it as a review item.'
- Accepted items in the same run are staged as usual (positive control).
test_required: true
test_spec:
- name: test_rejected_and_undone_stage_nothing
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: No record is staged for the rejected cat-73d233fc8b15c735 or for cat-1dc11c5a2ffa7310 after the undo.
- name: test_published_category_unchanged_after_undo
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: cat-1dc11c5a2ffa7310 keeps exactly its published wordings and members.
- name: test_rejected_candidate_not_a_record
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: cat-73d233fc8b15c735 does not become a record in the run root or in docs/criteria/.
- name: test_accepted_third_candidate_staged
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: boundary
  description: The accepted secrets candidate is staged.
test_rationale: Exercise the review run and the publish command through their public CLI and RunService boundaries on a temporary repository copy and run root; assert staged files, published files, exit codes and byte-level before/after snapshots of docs/decisions/. Model-level unit tests alone would not prove that nothing is written outside the staged area or that publish is all-or-nothing.
