notes: |
  User decision 1: test-writer consumes the design at build time; it does not author it.
  The halt clause is the build-time twin of ACD-2500b-2-i (gate) - both are needed
  because a record can reach the test writer through a path other than the queue
  (fast lane, quick-fix).
