id: BP-1500g-2
title: "The package's own capabilities arrive and are usable in the same project, out of the same run, in which the adopter's survived"
component: build-pipeline
components:
  - build_pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
declares_side_effect: false
criteria: |
  Given the project and the single ordinary build of BP-1500g-1, in which the
    adopter's own capability survived,
  When that same project is asked, after that same run, for the capabilities the
    package ships,
  Then every capability the package currently ships is present in that project,
  And the tool which runs capabilities in that project discovers each of them by
    name and runs it, so they are reachable and not merely written somewhere in
    the tree,
  And this is observed of the one run in which the adopter's capability survived,
    not of a separately configured run, so the two outcomes are proven to hold at
    once in one project,
  And a project that has never held any adopter-owned content receives the same
    complete set, so the guarantee is not obtained by treating the package's own
    delivery as optional.
depends_on:
  - BP-1500g
  - BP-1500g-1
