notes: |
  WHY THIS EDGE CASE IS WORTH A RECORD. Every candidate repair for BP-1500g-1 has
  to decide what a name means in the shared tree, and a collision is where that
  decision becomes visible. The two obvious implementations both fail an adopter
  silently: package-wins overwrites their work, adopter-wins leaves a package
  capability that appears installed while something else answers to its name. This
  AC forbids resolving it silently in EITHER direction and requires the run to say
  what it did -- which is the only outcome that leaves the adopter able to act.

  IT DOES NOT PICK A WINNER, DELIBERATELY. The third Then clause requires the run
  to STATE which version the project will run; it does not say which that should
  be. Choosing is part of the ownership convention this L1 leaves open, and
  pinning it here would prescribe by the back door the thing the L1 refused to
  prescribe at the front.

  NOTE FOR WHOEVER RESOLVES THE OWNERSHIP CONVENTION: this is the case that will
  tell you whether the convention is real. A convention under which a collision
  cannot be described is not a convention.

  PRIORITY IS medium, ONE STEP BELOW ITS PARENT AND THE OTHER LEAVES IN THIS SET.
  A collision requires the adopter to have chosen a name the package already uses,
  which is uncommon and is not the reported defect; the deviation is recorded here
  rather than silently inherited. Raise it at approval if the reviewer disagrees.
