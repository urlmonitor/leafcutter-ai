risk_surface: contract_boundary
notes: |
  Authored 2026-10-09. A cleanup mechanism already exists and is genuinely tested under
  KM-400b-5, but nothing invokes it: the projection published a generation on every merge
  to the canonical branch and reclaimed nothing, so 32 generations accumulated to 189,950
  nodes and 304,498 relationships and the hosted instance latched read-only. That produced
  the catch-22 that made recovery impossible — reclaiming space needs the writes a full
  instance blocks — and the instance had to be destroyed and recreated.

  The reporting clause is load-bearing and is not presentation polish. A silent regression
  to zero-reclaimed is exactly the failure that occurred, and it is invisible unless the
  publication result states how many generations it reclaimed and how many it retained.
  The explicit zero matters for the same reason: an omitted figure and a figure of zero
  read identically in a log.

  Settled design decision, not to be reopened: immutable generations are KEPT. This AC
  reclaims generations outside a declared bound; it does not replace generations with
  in-place upserting, and KM-400b-3's pinning guarantee remains superior to the bound.
it_requirements: null
test_required: true
test_spec:
  - name: test_successful_publication_reclaims_outside_bound_and_reports_counts
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: criterion
    description: Publish a new generation into a fixture holding 27 generations for the
      target repository plus 4 for a second repository, through the real publication entry
      point; assert the surviving set, the untouched foreign repository, and that the
      result states both the reclaimed and the retained count.
    covers: [KM-400f-2]
    must_catch:
      - "publish without invoking reclamation at all, leaving every generation in place"
      - "report success without stating a reclaimed count"
      - "reclaim generations belonging to the second repository"
    requires_db: false
  - name: test_pinned_generation_survives_until_its_continuation_expires
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: boundary
    description: Hold an unexpired continuation against a generation that is outside the
      declared bound, publish, assert it survived; expire the continuation, publish again
      and assert it is reclaimed and the continuation receives an explicit expiration
      result.
    covers: [KM-400f-2]
    must_catch:
      - "reclaim the pinned generation on the first publication, breaking the pinning guarantee"
      - "never reclaim a generation that was once pinned, even after expiry"
    requires_db: false
  - name: test_failed_publication_reclaims_nothing
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: failure
    description: Fail a publication before the active pointer switches and assert no
      generation of either repository was reclaimed, the previous generation is still
      active, and the failure result reports a reclaimed count of zero.
    covers: [KM-400f-2]
    must_catch:
      - "reclaim before the new generation is proven publishable"
    requires_db: false
  - name: test_live_publication_reclaims_against_a_real_backend
    target_dir: tests/knowledge_live/
    framework: pytest
    type: integration
    angle: real_artifact
    description: Against a real database, publish enough successive generations to exceed
      the declared bound and assert the retained set, the stable canonical fingerprints of
      the survivors and the reported counts after each publication.
    covers: [KM-400f-2]
    requires_db: true
test_rationale: >-
  Reclamation cannot be proved by a test whose fixture never exceeds the bound, so the
  criterion test seeds 27 generations and the live test publishes successively past the
  limit, in deliberate contrast to the 2-node live snapshot used elsewhere in this family
  under which the real limits never bind. The counts are asserted as values because the
  failure being prevented is a silent regression to zero-reclaimed, which a test that only
  checks the surviving set after a correct run would still pass once reclamation stopped
  firing. The foreign-repository and pin cases are separate tests because they are the two
  ways correct reclamation turns into data loss.
