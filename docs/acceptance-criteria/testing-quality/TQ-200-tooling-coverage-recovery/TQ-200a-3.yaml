it_requirements:
  - "Author fresh unit tests in tests/test_registry_injection.py (new file). Source PR is closed — write from scratch and verify run-to-green before sign-off. Note tests/test_config_driven_build_paths.py already covers the project_paths placeholder; do not duplicate it."
  - "Functions under test: injection_builders.build_per_agent_spawn_table / build_registry_block, and template_compiler.compile_agent_template together with its _apply_registry_injection placeholder resolution. Import both by bare module name after adding scripts/ to sys.path."
  - "Assert that a template containing a registry-injection placeholder (e.g. {{my_spawn_allowlist}}) compiles to output that contains the registry-derived table AND that the placeholder token no longer appears in the output."
  - "Assert that a template declaring no registry-injection placeholder compiles unchanged (no registry content injected)."
  - "API NUANCE for the absent/empty scenario: only some injection types raise. build_per_agent_spawn_table raises ValueError on an unknown/missing agent (surfaced by _apply_registry_injection as a wrapped ValueError), but build_registry_block and build_per_agent_skills_table return an empty string by design when the registry section is absent/empty rather than raising. Target the ValueError path (spawn table with an unknown agent id) for the 'fails with an error' assertion; the empty-string degradation cases will not raise."
  - "Use tmp_path template files plus an on-disk registry fixture; do not depend on the live package registry."
