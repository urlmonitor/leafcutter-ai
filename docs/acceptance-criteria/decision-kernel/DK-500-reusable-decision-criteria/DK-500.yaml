  NON-GOAL. Using outcome statistics to choose or rank which categories are
  offered would let colony memory influence behaviour. That belongs to the
  INFLUENCE step after held-out evaluation (ADR-056 section 3,
  phase_colony_4_influence), not to this goal.

  COMPONENT DRIFT. colony_memory belongs in components (DK-500f), but the
  components enum in config/ac_store_schema.json does not contain it, although
  docs/components.json does. It is omitted until the enum is fixed.

  NAMESPACE. decision-kernel (DK). DK-100..DK-104 (superseded L2s) and DK-200
