notes: |
  A dispatch that reaches command-step-runner without a named workspace is
  declined by charter -- the same shape of failure this whole defect is about,
  just relocated one level down. This AC exists so that fixing BO-2300e-2's
  routing does not silently reintroduce the original failure mode via a missing
  workspace argument instead of a wrong agent name.
