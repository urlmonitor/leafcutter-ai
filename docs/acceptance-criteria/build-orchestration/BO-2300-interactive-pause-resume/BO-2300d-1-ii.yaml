title: "A cancel answer stops gracefully, keeps committed stages, opens no PR"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a multi-stage run that has completed and committed earlier stages,
  And the run is paused on a pending question,
  When a valid "cancel" answer is submitted,
  Then the run stops gracefully rather than erroring,
  And the earlier committed stages remain present and unchanged,
  And no pull request is opened as a result of the cancellation.
depends_on: [BO-2300d-1]
