criteria: |
  Given /flows/leafcutter/python-coder-internal?step=lint is open with the 'Step not found'
    notice and no drawer, and the tab has one history entry,
  When the person clicks the 'Doc-enforcer' step,
  Then the notice disappears and the 'Doc-enforcer' drawer opens,
  And the address bar becomes /flows/leafcutter/python-coder-internal?step=docenforce,
  And the tab still has one history entry,
  And after the person then picks "How a flow renders in the Atlas" in the flow selector and
    presses Back, the Atlas shows /flows/leafcutter/python-coder-internal?step=docenforce with
    the 'Doc-enforcer' drawer open, never ?step=lint and never the 'Step not found' notice.
