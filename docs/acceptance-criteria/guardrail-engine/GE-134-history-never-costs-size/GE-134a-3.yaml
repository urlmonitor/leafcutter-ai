    not a comment line", "it says that ordinary comments are still counted", and the
    pinned figure of 80 lines. Wholly superseded as a separate obligation:
    superseded_by set to GE-127d-3 (the published-rule obligation itself lives in its
    sibling GE-127d-5). Criteria narrowed to the one still-true promise, kept for the
    record. Title, depends_on, req_status and work_status (done) unchanged; a superseded
    record is retired from covering-test proof. The test_intent / test_spec entries for
    the removed clauses (start/end sentence, ordinary-comments sentence, 80 by hand) are
    left for the test-writer to delete or re-point at GE-127d-5.
