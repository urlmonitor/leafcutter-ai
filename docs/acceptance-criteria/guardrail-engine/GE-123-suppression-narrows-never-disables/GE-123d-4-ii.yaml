    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: real_artifact
    description: "Parsing the real templates/skills/security-scanner/SKILL.md on disk finds one section that names all five prose locations, all four admitted file kinds, every recognised non-credential value shape, and the one shape exempt in every file regardless of location"
  - name: test_reference_lists_match_the_lists_the_implementation_reads
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: seam
    description: "Drift guard: the locations, kinds and value shapes enumerated in the reference match, item for item, the corresponding data in the canonical check and scanner sources — a documentation check, not a prose review"
  - name: test_reference_states_the_lists_are_closed_and_extended_deliberately
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "The section states that a value, location or kind absent from its list is treated as a credential, that each list is extended only by a deliberate edit with a recorded reason, and that source and configuration and an unadmitted kind inside a prose location never inherit the exemption"
  - name: test_reference_states_the_notice_contract_and_its_withheld_value
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "The section states that a granted exemption produces a notice on the error stream naming the file, the 1-based line number and the granting shape, that the notice never reproduces the matched value, and that it does not change whether the commit succeeds"
  - name: test_reference_section_passes_the_check_it_documents
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "The real reference file, staged at its own repository-relative path in a temporary git repository and checked by the canonical pre-commit check, produces exit status 0 — the section describing credential shapes does not block its own commit"
test_rationale: "This is a documentation AC, so four of the five entries are documentation checks rather than code tests: they parse the real reference file on disk and assert what it states. They are checks rather than a review pass because the thing most likely to go wrong here is drift — a reference that enumerates five locations while the code reads six is worse than silence, since a reader trusts it and stops looking. The second entry is therefore the load-bearing one: it compares the reference's enumerations against the data the canonical sources actually read, so an extension to either side that forgets the other goes red. None of the four may be satisfied by a fixture: they must read the real templates/skills/security-scanner/SKILL.md, because a fixture would assert only that the test author can write the section. The fifth entry is the analogue of this tree's real-pre-commit-path standard for a docs AC, and it guards a live hazard rather than a hypothetical one — a section documenting credential shapes is liable to be blocked by the check it documents, and the sibling authoring pass in this subtree was blocked five times by exactly that. Test-writer, not documentation-expert, authors these; the assigned agent writes the reference."
