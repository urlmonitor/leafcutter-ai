criteria: |
  Stopped with a starting point, not just a verdict.

  When a file is refused for being too large, you are told what is in it that
  makes it too large and where a sensible division lies, so the next step is
  obvious rather than a research task. Nobody is left choosing between a
  half-hour of investigation and the quickest way to make the message go away.
