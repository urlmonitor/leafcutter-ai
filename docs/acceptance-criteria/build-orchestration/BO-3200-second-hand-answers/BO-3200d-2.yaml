id: BO-3200d-2
title: "The consumer obtains the result without depending on the producer reproducing it in its reply"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a specialist that produces a well-formed result and returns a reply containing none of
    that result's content — only a plain description of what it did,
  When the step that reads the result runs,
  Then it obtains the complete result and forms the same verdict it would form from the
    produced result read directly.

  Given a specialist that returns a reply containing a description of the result that
    contradicts the result itself,
  When the step that reads the result runs,
  Then the verdict is formed from the result, not from the description.

  Given the arrangement by which the consumer obtains the result,
  When it is examined,
  Then no step in it requires a specialist to reproduce the result's content in its reply.
