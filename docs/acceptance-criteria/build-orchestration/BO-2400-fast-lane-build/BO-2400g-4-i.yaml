test_rationale: "The natural implementation prints the advisory findings in the run's output and moves on, which satisfies BO-2400g-4 completely — that AC only requires such findings not to stop the run. The findings then vanish with the session, and since both smell readers RETURN their findings rather than writing them anywhere, the loss is silent and total. The discriminating assertion is therefore against the pull-request body the lane actually submits, not against any value the run computed on the way there. The clean-run case is asserted in the same suite because the obvious repair — always render the section — leaves an empty 'Findings' heading on every clean pull request, which trains readers to ignore it and is how a real signal becomes noise."
