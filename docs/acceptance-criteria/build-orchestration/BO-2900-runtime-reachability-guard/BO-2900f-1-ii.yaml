notes: |
  The adjudication half of BUG-23 (run wf_cc2b46d9-f6f). Ticket 03's record carried the
  delivery gate twice while carrying no entry at all for test-runner -- both halves of
  the parent's cardinality invariant broken on one work item, in opposite directions,
  in the same drive.

  WHY THE WRITE SIDE LEFT THIS AC (2026-08-18). The original criteria bound one actor
  to two jobs: decide correctly from a record, and guarantee the shape of that record.
  The driver can only do the first. The second belongs to whoever appends -- the phase
  agent -- and is now BO-2900f-2-ii, parented under BO-2900f-2 because that L2 is the
  exactly-one-entry-per-gate cardinality invariant and this is its write-side
  enforcement. Read the two together: BO-2900f-2-ii stops the duplicate being written;
  this AC keeps the verdict correct for every record already carrying one, and makes
  the duplicate visible so the write-side failure is not permanently masked by the
  read-side compensation.

  THE THREE SIBLINGS UNDER BO-2900f-1 ARE NOW ONE FAMILY. -1-i adjudicates a gate that
  reported success and left no entry; -1-iii requires the check to be applied to every
  dispatched gate on every work item; this one adjudicates a gate that left two. All
  three are read-back rules over a record the driver did not author, which is the
  boundary the amendment restores.

  CARRIES A KNOWN TRAP FORWARD. BO-2900f's notes record that the earlier gap-free-
  records work shipped a double-recording bug because a skip-branch call was added
  while the pre-existing unconditional call was left in place, and that the structural
  test was blind to it. That trap now lives where it belongs, on the write-side AC; the
  residue here is the constraint that recency, not outcome, selects the surviving
  verdict -- the same class of mistake, one layer up.
