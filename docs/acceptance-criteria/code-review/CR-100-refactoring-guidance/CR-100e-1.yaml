id: CR-100e-1
title: "Review target may be a file, a folder, or a pasted snippet"
component: code-review
components:
  - review_system
level: L2
status: active
req_status: active
work_status: done
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a developer invokes the /code-smell-review command (the code-smell-review skill),
  When the target is a single file path,
  Then the review runs against that file and produces a report,
  And when the target is a folder path, the review runs against the code in that
    folder and produces a report,
  And when the target is a snippet of code pasted directly into the invocation,
    the review runs against that snippet and produces a report.
