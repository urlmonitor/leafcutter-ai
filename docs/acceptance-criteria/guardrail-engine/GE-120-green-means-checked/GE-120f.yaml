id: GE-120f
title: "A guard that has never said no is not counted as protection"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: critical
roadmap_phase: phase_1
criteria: |
  Protection counts only once it has been seen to refuse something.

  Every protective check earns its place by being handed something it must
  reject and being seen to reject it. A check that has never refused anything
  is named as unproven rather than counted among the things keeping your work
  safe, so one that would wave everything through is visible instead of quietly
  reassuring.
