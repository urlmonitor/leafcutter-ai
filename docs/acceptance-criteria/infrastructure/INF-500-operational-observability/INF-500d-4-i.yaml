title: "When the enduring location cannot be determined, the sink says so rather than quietly using the disposable one"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a report is filed from a context where the enduring project location cannot
    be determined — the drive is not running under version control at all, or the
    version-control tooling is unavailable to the caller,
  When the durable report location is resolved,
  Then the sink does not silently fall back to the temporary workspace directory,
  And the report is either written to a location the caller can confirm is not the
    disposable workspace, or the write is refused with a failure reason naming the
    unresolved location,
  And in the refusal case the agent's verdict is still delivered.

  Given a project that uses no temporary workspaces at all, so the drive runs
    directly in the ordinary project checkout,
  When a report is filed,
  Then it is written to the same durable location that a workspace-based drive
    would have used, and is readable there,
  So that consumer projects without the worktree-per-drive convention are not
    given a second, divergent storage location.
