change_target: code
risk_surface: contract_boundary
notes: |
  THE TRIGGER IS NARROW AND MUST STAY NARROW — the PO's words. Two axes,
  both required: change target is the user interface, and the criterion is
  marked done.

  THREE OUTCOMES, NOT TWO. The third scenario is the one an implementation gets
  wrong by counting rows: a non-UI criterion is OUT OF SCOPE, not "passing". If
  it is recorded as a pass, every report built on this gate inherits a coverage
  figure inflated by the entire non-UI store — which is precisely the number
  GE-124g-3 forbids.

  The in-progress case is the mock-data record KM-ADM-003, carried explicitly by
  the PO so that a UI criterion still being built is skipped rather than
  blocked.

  IT-PO ENRICHMENT NOTE (2026-08-25). Two facts the implementer should not have
  to rediscover. First, the CI-tier gate does not exist and neither does its
  workflow job; the shape to copy is the done-proof job already in
  .github/workflows/ci.yml, which is also the gate this one composes with
  (GE-124e-3-i). Second, change_target is `anyOf string|array` in
  config/ac_store_schema.json — the scalar assumption is a real and silent
  selected-set bug, not a hypothetical.
