test_rationale: "Stubbing the not-found branch would test the branch the author wrote rather than the resolution failure that was actually observed, and would pass on a set-up that still no-ops when the scripts are genuinely unreachable. The caller-visible clause needs its own test because the whole defect class is a signal that is emitted and then ignored one layer up — an exit code nothing reads is the same silent pass."
