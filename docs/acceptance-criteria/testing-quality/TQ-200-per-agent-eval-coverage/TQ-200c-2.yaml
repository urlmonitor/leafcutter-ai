id: TQ-200c-2
components:
  - testing_quality
  - ac_store
  - agent_registry
title: "Which kinds of proof a piece of work needs is derived from what the work says about itself, not from a list of names"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given three pieces of work: one whose behaviour is settled entirely by assertion,
    one whose behaviour is settled entirely by judgment about a model's output, and
    one that needs both,
  When the proof each will be asked for is decided,
  Then each is asked for the kinds of proof its own description implies, derived
    from what the work and its producer already declare about themselves,
  And when a kind of producer that nobody anticipated is introduced — one that
    exists in no enumeration the decision consults, and whose introduction changes
    no enumeration — the kinds of proof asked of its work are still correct,
  And two pieces of work that describe themselves identically are asked for the same
    kinds of proof even when their producers are named differently, so that the
    answer cannot be changed by renaming a producer and cannot be obtained by
    recognising one,
  And there is no piece of work for which the answer is "no proof of any kind is
    required" arrived at by the work's producer being absent from an enumeration —
    an answer of "no proof required" is reachable only from something the work
    itself says.
depends_on:
  - TQ-200c
  - TQ-200c-1
