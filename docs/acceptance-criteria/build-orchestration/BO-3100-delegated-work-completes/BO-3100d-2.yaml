assigned_agent: adr-author
estimated_complexity: L
change_target: docs
risk_surface: internal
it_requirements:
  - "AGENT CHOICE IS DELIBERATE: adr-author, the leaf author of decision records, not documentation-expert. A documentation-expert dispatch that then dispatches a leaf author is the defect BO-3100c removes."
  - "THE SUPERSESSION MUST BE COMPLETED IN BOTH PLACES IN THE SAME CHANGE: the superseding record names its predecessor and the premise found false, and the predecessor is marked superseded and names its successor. The half that is normally forgotten is the predecessor's own marking — and that is the half a reader depends on, because the reader arrives at the old record first."
  - "BOTH POINTERS MUST BE MACHINE-READABLE FIELDS, not sentences in the body. BO-3100d-2-i's checker has to resolve them; a pointer expressed only in prose is unresolvable and reads as coverage while pointing nowhere."
  - "THE PREDECESSOR MUST REMAIN READABLE IN PLACE. It is not deleted, not emptied, not reduced to a redirect. The value of the supersession is that a later reader can see both what was believed and what replaced it."
  - "THE SUPERSEDING RECORD MUST STATE WHICH PREMISE WAS FALSE, specifically — not merely that the predecessor is superseded. 'Superseded by ADR-N' with no stated reason leaves the false depth story intact in the reader's head, and the reader will re-derive it."
  - "The superseding record's own behavioural claims are subject to BO-3100d-1: each must carry a claim identifier and be paired with an executable check. A new decision record that asserts unverified runtime behaviour re-creates the defect one generation on."
  - "HUMAN-REVIEW OBLIGATION (records the boundary of what can be automated). Whether the superseding record REASONS well — draws a sound conclusion from the now-true premise — is not mechanically checkable and is not claimed by any test in this AC's test_spec. It is discharged by a named human review recorded on the delivering ticket before the AC is marked done. Do not add a test that appears to cover it; an assertion that the record 'contains' the right reasoning is a grep on prose and would be worse than no test, because it would read as coverage."
delivers_to:
  - agent: python-coder
    contract: "The supersession field pair as machine-readable metadata on each decision record: on the predecessor {status: superseded, superseded_by: <id>}, on the successor {supersedes: <id>, false_premise: <string>}. BO-3100d-2-i's checker resolves exactly these."
  - agent: reference-author
    contract: "The corrected constraint as settled in the superseding decision, so BO-3100d-3's delegation reference restates the decision rather than re-deriving it."
expects_from:
  - ac_id: BO-3100d-1
    contract: "The claim-identifier mechanism and the three-state claim report, so the superseding record's own behavioural claims are bound to executable checks rather than asserted."
test_spec:
  - name: test_bo_3100d_2_predecessor_is_marked_and_names_its_successor
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "For every superseded decision record, assert the machine-readable status marks it superseded and the superseded_by field names the successor."
  - name: test_bo_3100d_2_successor_names_its_predecessor_and_the_false_premise
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "The superseding record carries a supersedes pointer and a non-empty false_premise field. Empty or absent fails."
  - name: test_bo_3100d_2_both_pointers_resolve_to_records_that_exist
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: real_artifact
    description: "Follow each pointer against the real docs/architecture/adrs/ tree and assert the target file exists. A pointer that resolves to nothing reads as coverage to everyone who checks for one."
  - name: test_bo_3100d_2_predecessor_remains_readable_in_place
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: boundary
    description: "The superseded record still exists at its original path with its original argument body intact — not deleted, emptied, or reduced to a redirect stub."
  - name: test_bo_3100d_2_reader_arriving_at_the_old_record_can_see_both
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "Reading ONLY the predecessor file, assert both facts are obtainable from it: that it is superseded, and by which record. Encodes the third scenario's reader position — a reader who found the old record has by definition not found the new one."
test_rationale: |
  Only part of this AC is mechanically checkable, and the split is drawn deliberately.
  COVERED, by the tests above: the structural facts — both markings present, both pointers
  resolving, the predecessor still readable in place, and the old record self-sufficient for a
  reader who arrives at it first. Those are facts about the records and are exactly why this
  criterion is enforceable where "keep the documentation accurate" would not be.
  NOT COVERED, deliberately and by decision: whether the superseding record reasons WELL. A
  decision record can reason correctly from a true premise to a poor conclusion, and every
  structural check above will pass. That half is discharged by a named human review recorded on
  the delivering ticket. No test here claims it, and none should be added: an assertion that the
  record "contains" the right reasoning is the grep-on-prose form this whole tree rejects, and
  it would be strictly worse than the honest gap because it would read as coverage. The
  distinction is stated here rather than left implicit so the absence is a recorded decision.
