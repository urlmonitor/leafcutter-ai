notes: |
  INCIDENT (2026-09-16, run wf_3d2879c1-2ae): after BO-3900 and BO-4000 landed, /build-feature
  planned 9 eligible UXP-700 tickets and withheld 7. Each depends_on entry was a bare sibling
  filename such as `02_TICKET-20260909-UXP-700a-1.md`, and both readers called
  `toWorktreePath(entry, realWorktreePath)`, which resolved it to
  `worktrees/ki-20260914/02_TICKET-20260909-UXP-700a-1.md`. The gate's done-prerequisite
  read found nothing there and recorded `not_in_run_set`, though the real sibling reads
  `status: done`. The old pre-BO-3900 toWorktreePath joined relative paths onto the
  worktree root too, so the defect predates BO-3900, but BO-3900's it_requirements already
  said depends_on must resolve "by the same rule as dispatch", and that rule is the
  ticket's own folder.

  MEASURED 2026-09-16 across tickets/**: 458 bare-filename entries, 38 `tickets/`-prefixed,
  5 other relative paths (e.g. `../../../99_done/...`), 772 AC ids. AC-id entries are not
  file paths and are out of scope here.

  NAMED MUTATIONS:
    M1 — keep resolving relative entries onto the worktree root. Caught by
         test_bare_sibling_prerequisite_is_read_beside_the_ticket.
    M2 — fix only the release gate and leave the membership check on the old rule. Caught
         by test_membership_check_and_release_gate_resolve_depends_on_identically.
    M3 — skip the done/ fallbacks. Caught by
         test_prerequisite_in_done_subfolder_and_legacy_tickets_prefix_resolve.
