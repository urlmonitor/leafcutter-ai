id: BP-100m-2
title: "Any set of two or more sources mapping to one target is detected, with every colliding source named"
component: build-pipeline
level: L2
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-100-reliable-builds/BP-100m.yaml"
criteria: |
  Given a build in which three distinct source templates all resolve to the same
    deployed target output path,
  When build.py runs,
  Then the build exits with a non-zero status,
  And the failure message names the shared target path and ALL THREE colliding
    source templates (not only the first two discovered),
  And the guardrail treats this generally — any target reached by N >= 2 distinct
    sources is a collision, not only the known commands-vs-workflows case.
