assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "A remedy MUST be named. This record is not satisfiable by deleting the remedy line from the refusal: the first clause requires that carrying out the named remedy actually clears the refusal, so 'offer nothing' fails rather than passes. Without that clause the safest implementation would leave the author stuck instead of safe."
  - "The remedy currently named by both drift gates is 'Re-run build.py' (check_output_drift prints 'build.py (or: python leafcutter/scripts/build.py --force)'). From inside a worktree that is KI-BP-016: it deploys the branch's unmerged templates over the live shared install tree other sessions are reading, and it overwrites the tracked docs/INDEX.md. The remedy text must change in step with BO-4100b-3's per-workspace material so the named command acts on the workspace's own copy only."
  - "The remedy must be executable exactly as printed, from the workspace it was printed in, with no argument the operator has to infer. A remedy that needs a --target-dir the operator has to work out is the same defect one step removed."
  - "Byte-identity of the shared install tree and of the second live workspace must be established across the remedy by recursive content hashing of each whole tree."
  - "Both drift gates must carry the corrected remedy; a fixed message in one and the KI-BP-016 message in the other still sends the operator to destroy the shared install half the time."
  - "Template and deployed copies change together and are verified in parity via the build.py round-trip (ADR-001)."
delivers_to: null
expects_from:
  ac_id: BO-4100b-3
  contract: "A per-workspace supporting-material tree at <workspace>/.leafcutter that is a real materialisation rather than an alias of the shared install tree -- the local thing the named remedy acts on, and the reason acting on it cannot reach the shared tree or the second workspace."
test_required: true
test_spec:
  - name: test_carrying_out_the_named_remedy_clears_the_refusal
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "The remedy string is EXTRACTED FROM THE REFUSAL ITSELF and executed as a real subprocess from inside the refused workspace; re-running the check afterwards exits 0. Extracting rather than hard-coding the command is what makes the assertion fail against an implementation that names no remedy, or names one that does not work."
  - name: test_the_shared_install_tree_is_byte_identical_across_the_remedy
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A recursive content hash of the shared install tree, taken before and after the same extracted remedy runs, must be equal. Today's remedy fails this."
  - name: test_the_second_live_workspaces_supporting_material_is_byte_identical_across_the_remedy
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The same whole-tree hash comparison for a second workspace live at the same time."
  - name: test_both_drift_gates_name_a_remedy_that_satisfies_all_three_clauses
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The extract-execute-and-compare cycle is run for check-build-drift and for check-output-drift separately. A remedy corrected in one gate only still sends the operator to overwrite the shared install from the other."
test_rationale: |
  The first clause is load-bearing and is the one a test contract silently drops. Without
  it, the cheapest implementation -- stop printing a remedy at all -- passes both
  byte-identity assertions perfectly, and the author is left with a refusal and no way
  forward. The test therefore has to EXTRACT the remedy from the refusal and RUN it,
  rather than hard-coding a command the test author believes is correct: a hard-coded
  command tests the test author's belief, not the tool's advice, and the defect here is
  precisely that the tool's advice is wrong.
  All three observables are states of trees on disk rather than properties of wording,
  so all three are whole-tree content hashes. Reading the shared tree is harmless; the
  measurement has to span the remedy's execution.
