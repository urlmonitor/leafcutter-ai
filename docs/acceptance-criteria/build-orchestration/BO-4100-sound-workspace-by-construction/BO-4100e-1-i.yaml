notes: >-
  Bounds the discovery route BO-4100e-1 introduces. A listing that reports every directory
  it finds is complete in the useless sense: the real leftovers are then buried among
  entries that were never workspaces, and the operator goes back to judging by hand, which
  is the state BO-4100c exists to end. Keeping the entry count stable is the falsifiable
  form -- it fails against an implementation that lists a stray folder and also against one
  that miscounts while hiding it.
