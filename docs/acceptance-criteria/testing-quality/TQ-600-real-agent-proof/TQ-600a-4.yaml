notes: |
  Satisfies TQ-600a documentation_triggers: [component-diagram].

  WHY THE "NO CONNECTION" CLAUSE. The reuse decision on BO-3200f-2-ii (transport yes,
  runner no) is the one most likely to drift: a later change that imports the runner's
  scoring into this mechanism turns pass/fail proof into judged proof. The diagram makes
  the boundary visible to whoever makes that change.

  ASSUMPTION. The shared transport is built as BO-3200f-2-ii's IT PO decided. If the IT PO
  re-decides on TQ-600a-1, this diagram follows that decision.
