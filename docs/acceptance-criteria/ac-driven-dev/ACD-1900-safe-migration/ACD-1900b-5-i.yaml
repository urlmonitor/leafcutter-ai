notes: |
  VERIFIED DEFECT, LIVE TODAY (verification performed 2026-08-17 against the working
  tree; every claim below was read from the files, not inferred):

  - PRODUCER: scripts/ac_store/generate_ticket_from_ac.py:1897 --
    fm["ac_traceability"] = {"id": ac_id, "path": ac_store_path} (the path value is
    computed at line 2763). Two keys: id, path.
  - CONSUMER: templates/agents/ac-fulfillment-gate.md, Step 1, lines 85-93 -- "If
    ac_traceability: is present, extract: l2: ... l3: ... ac_path: ... Build the
    working list of ACs to check: combine l2 and l3."
  - CONSEQUENCE: on a generator-produced ticket the working list is EMPTY. Step 5
    (line 230) returns ok when "every AC in the working list is passed or skipped" --
    vacuously true over an empty list. The gate signs off green having verified
    nothing.
  - CONFIRMED ON REAL ARTIFACTS, not fixtures: tickets/00_inbox/TICKET-20260813-ACD-400b-7.md
    and tickets/00_inbox/epics/EPIC-InFlightVisibility/01_TICKET-20260720-BO-1000a-1.md
    both carry the two-key form. A store-wide grep found the list form (ac_path) only
    in hand-authored tickets, never in a generated one.
  - CONFIRMED LIVE IN THE DEPLOYED COPY: .claude/agents/ac-fulfillment-gate.md lines
    41-43 carry the same three-key instruction, so this is not a source-only drift.
  - CONFIRMED SOLE CONSUMER: templates/agents/ac-validator.md does not read
    ac_traceability at all, and no script under scripts/ or templates/ reads the key.
    The gate is the only consumer, so nothing else compensates.
  - SEVERITY: the gate runs at priority 11.7, immediately before commit. It is the
    mechanical check that work_status / implemented_by / covered_by are accurate. A
    vacuous pass there is the phantom-done class this repository exists to prevent,
    sitting in the pre-commit path of every AC-generated ticket.

  AUTHORITATIVE SIDE -- DECIDED, NOT LEFT OPEN. The CONSUMER accepts both forms.
  Reasoning: (a) the two-key form is already on disk in dozens of tickets, several
  already in 99_done, so changing the producer would silently invalidate every ticket
  written to date; (b) the two-key form is strictly more precise -- it names the exact
  store file rather than a directory the gate must guess a filename inside; (c) the
  gate additionally has source_ac available on every generated ticket as a second
  resolution route, so no new data is needed. What is NOT decided here, and is left to
  the IT PO: whether the dual-shape read lands in the gate's own prose or in the shared
  resolver introduced by ACD-1900b-1. The third scenario exists so that whichever route
  is taken, the list form is provably still honoured.

  WHY BLOCKING HERE DOES NOT CONTRADICT ADR-026 RULE 5. Rule 5 retains the silent skip
  for tickets with NO traceability block until fat tickets drain. These tickets HAVE a
  block; they are exactly the fat tickets the gate is supposed to be verifying now. The
  carve-out does not reach them, so the foundation-phase advisory fallback of the parent
  ACD-1900b-5 does not apply and a non-ok verdict is correct today. roadmap_phase is
  phase_1 rather than the parent's phase_acbuild_1_foundation for the same reason: this
  is a live defect in the current fat-ticket pipeline and is fixable independently of
  the ADR-026 migration.

  BOUNDARY vs the parent and its twins -- keep these distinct at implementation time:
    - ACD-1900b-5 (parent): traceability block ABSENT -> dual-read from source_ac. Its
      premise is the absence of the block, so it does not fire on these tickets at all;
      this defect survives ACD-1900b-5 untouched.
    - ACD-1900c-6: the enforce-time flip of that same absent-block path.
    - ACD-1900b-1-i: source_ac unresolvable -> halt, never silent-green. Different input
      (no resolvable AC anywhere) from this one (a resolvable AC the gate never looks
      at).
    - BO-201: the original fulfillment-gate spec. Note it codifies the list form in its
      own criteria, so the store's spec and the generator have disagreed since the
      generator gained the block. BO-201 is a loose L2 whose ID admits no children,
      which is why this AC is parented here instead.

  PROOF OBLIGATION FOR THE IT PO AND TEST AUTHOR. This must be proven by a test that
  EXECUTES the gate's coverage-resolution over a real generator-produced ticket (or one
  written by invoking the generator) and asserts the emitted verdict and the count of
  ACs actually verified. A test that greps either the template or the generator for a
  key name would itself be an instance of the defect class -- it passes while the two
  sides still disagree -- and is explicitly disallowed here, per CLAUDE.md "Gate /
  Workflow ACs -- Verify Behaviorally, Not by Grep". The discriminating assertion is the
  verified-AC COUNT: an implementation that still reads only the list form yields zero
  on a generated ticket, while every verdict-only assertion can be made to pass.

  change_target is set to prompt on the reading that the fix lands in the gate template.
  If the IT PO routes it through the shared resolver instead, widen change_target to
  include code in the same pass.
