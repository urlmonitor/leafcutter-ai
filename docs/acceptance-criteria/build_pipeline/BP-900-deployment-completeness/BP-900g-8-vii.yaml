id: BP-900g-8-vii
components:
  - build_pipeline
title: "Template frontmatter is still parsed by the pure-Python safe loader, so YAML it rejects still gives an empty frontmatter"
component: build-pipeline
level: L3
status: active
req_status: active
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g-8.yaml"
criteria: |
  Given template_compiler.parse_frontmatter, which runs in the live build over every
    agent and skill template,
  When it parses frontmatter, whether or not libyaml is installed,
  Then the loader class it hands to yaml.load is yaml.SafeLoader and never the
    libyaml-backed yaml.CSafeLoader,
  And frontmatter containing a tab next to a colon or comma, which yaml.SafeLoader
    rejects and yaml.CSafeLoader accepts, still gives an empty frontmatter dict,
  And that holds on a repeated parse of the same text as well as on the first,
  Because the libyaml loader parses the same text about seven times faster but
    accepts input the project's loader rejects, so a hand-typo'd template would parse
    into a partial dict instead of the uniform empty one (the shape behind KI-BP-019),
    and TQ-600a-11 records that the libyaml loader earns its place at one whole-store
    walk and is not to be re-migrated onto small per-file parses.
depends_on:
  - BP-900g-8
  - BP-900g-8-v
