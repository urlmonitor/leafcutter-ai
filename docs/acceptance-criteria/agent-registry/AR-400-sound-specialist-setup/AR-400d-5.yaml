id: AR-400d-5
title: "The specialist-definition reference documents the project-supplied grant marking"
component: agent-registry
components:
  - agent_registry
  - skills_system
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an author reading the reference documentation for a specialist's
    `skills:` declaration,
  When they look up the fields a grant may carry,
  Then the reference lists `provided_by` with its single accepted value
    `project`, states that an absent marking means the package supplies the
    ability,
    And it states the lookup location, the report-not-refuse behaviour when the
      project lacks the ability, the refusal of an unmarked grant to an
      unshipped ability, and the deliberate override (a marked grant to a
      shipped ability delivers the project's copy, stated at informational
      severity),
    And it states that a marked ability's project copy is used by every
      specialist granting that ability, that the build never deploys over or
      removes it, and that a marked shipped ability the project does not
      supply falls back to the packaged copy with an informational line,
    And its example declaration, copied into a fixture specialist, passes the
      declaration-shape check.
depends_on:
  - AR-400d-3
