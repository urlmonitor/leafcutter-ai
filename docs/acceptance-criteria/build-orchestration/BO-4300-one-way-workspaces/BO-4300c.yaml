criteria: |
  Ready in full, or refused with a reason -- and nothing carries on without it.

  A workspace is only handed over when it is complete: its own line of work, started from
  the latest shared work, its tools installed inside it and its protections shown to be
  active. Anything short of that is a plain refusal naming the cause, and the work that
  asked for it stops there -- it never falls back to working in the main copy, in some
  other folder, or wherever an assistant says it put things.
