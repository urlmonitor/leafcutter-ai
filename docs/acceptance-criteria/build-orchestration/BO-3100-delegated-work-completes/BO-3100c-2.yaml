notes: |
  THIS AC EXISTS BECAUSE OF THE PARENT L1'S EXPLICIT DECOMPOSITION WARNING: "the remaining
  coordinators are retired must be verified by ABSENCE across the whole system, not by the
  presence of the new path. A test asserting the new coordinator works is satisfied by a repo
  that still contains five old ones." The second scenario is that warning turned into a
  falsifiable case — it is written so that any implementation which only checks the new path
  fails it.

  The parent also states that retiring the remaining coordinators is part of this criterion,
  not a follow-up: "a relocation that leaves the old path in place has not removed anything."

  THE SWEEP MUST EXECUTE, NOT READ. The record of what dispatched what is a runtime
  observation of a real drive. A search of the sources for coordinating constructs passes on
  a coordinator that is reached through an indirection and fails on one that exists but is
  unreachable — both wrong answers. CLAUDE.md's fast-lane precedent is the reference case: a
  runner passed its grep-only structural tests while never executing its gates.

  THE THIRD SCENARIO GUARDS THE SWEEP ITSELF. An entry point that silently exercises nothing
  reports clean, which is the AC-store validator's zero-file no-op (KI-ACS-001) in another
  guise — a success-shaped result from a run that checked nothing.

  IT-PO ENRICHMENT NOTE (2026-08-26). The no-source-scan boundary is now an it_requirement AND
  a test, not just a note. It was previously stated only in prose here and in BO-3100c-2-i,
  which means the next person to want better coverage could add a grep and break BO-3100c-2-i's
  second scenario without anything failing. The test that asserts the sweep produces its
  verdict with the source tree unreadable is what makes the boundary hold.
