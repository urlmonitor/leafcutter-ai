  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an outstanding count of twelve conflicts,
  When a verdict is recorded against one of them,
  Then the outstanding count reads eleven.

  Given the same outstanding count of twelve,
  When one of the conflicts stops being reported because it was excluded, filtered
    out, or because the comparison was narrowed so it no longer matches,
  Then the outstanding count still reads twelve,
    And the excluded conflict is reported as excluded, naming what excluded it and
      when,
  So narrowing the check never looks like progress.

  Given a run in which the comparison has been narrowed since the previous run,
  When it reports,
  Then it states that its scope changed and how many previously reported conflicts
    fall outside the new scope,
  So a change in what is looked for is never invisible in the numbers.

  Given a conflict that stops being reported because the two records now agree,
  When the run reports,
  Then the outstanding count falls and the conflict is not reported as excluded,
  So genuine resolution and suppression are distinguishable in the count and in the
    output.
