expects_from: null
test_required: true
test_spec:
  - name: test_explicit_contract_still_gets_enriched_without_intent_classification
    target_dir: tests/kernel/intent/
    framework: pytest
    type: integration
    angle: reachability
    description: "An explicit evidence request retains EVIDENCE_BUNDLE as Task.requested_output_schema, checkpoints non-empty repository context and issues no kernel.intent question."
test_rationale: "The service entry point exercises the explicit-contract branch; a direct call to gathering would miss an early bypass in routing."
