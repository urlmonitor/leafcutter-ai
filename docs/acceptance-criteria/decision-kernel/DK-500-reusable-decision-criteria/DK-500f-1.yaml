id: DK-500f-1
title: Each published category's usage count is generated from the published records and checked for freshness
component: decision-kernel
components:
- decision_kernel
level: L2
status: active
readiness: approved
req_status: draft
priority: high
work_status: todo
roadmap_phase: phase_colony_1_collect
criteria: |
  Given the published cat-1dc11c5a2ffa7310 with members from dec-4673055ef54113d5, dec-acdfd972fcaca478 and dec-d53e1c52cd47c832, the published cat-d15d52392d7aa94c with members from dec-d53e1c52cd47c832 and dec-acdfd972fcaca478, and the retired cat-40cc613f737e3323 with no members,
  When the generated usage index is rebuilt,
  Then the usage counts are 3, 2 and 0,
  And a category with two members from the same decision counts that decision once,
  And candidate and staged categories have no usage count,
  And when the count of cat-1dc11c5a2ffa7310 is changed by hand to 4, the freshness check fails, naming cat-1dc11c5a2ffa7310,
  And after a member from a fourth published decision is published into cat-1dc11c5a2ffa7310, the rebuilt count is 4.
depends_on:
- DK-500f
- DK-500c-2
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: 'docs/criteria/index.json categories[] entries {id, lifecycle_stage: published|retired, usage_count: int (distinct member decision ids)}, freshness-checked by criteria validate like docs/decisions/index.json. Consumed by the outcome aggregates (DK-500f-2) and cross-checked by the graph query (DK-500g-3).'
expects_from:
  ac_id: DK-500c-2
  contract: Published category records with members in docs/criteria/.
change_target: code
risk_surface: internal
package_surface: false
it_requirements:
- docs/criteria/index.json is produced only by the generator (criteria index, and publish). usage_count is the number of distinct decision ids among a category's members, for published and retired categories only; candidates and staged categories are absent from the index.
- criteria validate fails, naming the category, when the committed index differs from a fresh generation, including a hand-edited count. The same check runs in the test suite over the committed store and in CI, as for the decision index. No pre-commit hook is added, so package_surface is false.
- 'Generation is deterministic and byte-stable: sorted ids, stable key order, LF line endings.'
test_required: true
test_spec:
- name: test_counts_3_2_0
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Rebuilding the index gives usage counts 3, 2 and 0 for cat-1dc11c5a2ffa7310, cat-d15d52392d7aa94c and cat-40cc613f737e3323.
- name: test_same_decision_counted_once
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A category with two members from one decision counts that decision once.
- name: test_candidate_and_staged_have_no_count
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Candidate and staged categories have no entry and no usage count in the index.
- name: test_hand_edited_count_fails_freshness_naming_category
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Changing cat-1dc11c5a2ffa7310's count to 4 by hand makes criteria validate fail, naming cat-1dc11c5a2ffa7310.
- name: test_count_rises_after_new_member_published
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: After a member from a fourth published decision is published into cat-1dc11c5a2ffa7310, the rebuilt count is 4.
test_rationale: Run the index generator and criteria validate through their CLI over a temporary copy of a fixture store, including a hand-edited index; a pure counting unit test would pass with a hard-coded count.
