notes: |
  THIS AC IS WHAT MAKES THE USER'S SCOPE TRIM IMPLEMENTABLE. GE-120e's binding scope decision
  puts the 11 unnumbered diagrams OUT of repair scope: they are not ambiguous, they break no
  reference, and renaming them to add numbers would risk exactly the dangling-reference damage
  the repair is meant to avoid. But an enrolment check with no notion of "pre-existing" would
  then fail on every single commit until someone renamed them anyway — which would either force
  the retro-numbering the user rejected, or get the check disabled. Without this AC, GE-120b and
  GE-120e contradict each other in practice.

  NOTE THE DIRECTION OF SCOPING HERE VERSUS GE-120a-1-i, which look opposed but are not.
  Uniqueness is inspected over the WHOLE collection, because a collision's second claimant may
  be anywhere. Enrolment is ATTRIBUTED to the change set, because enrolment is a property of a
  single artifact and there is no second party to find. Whole-collection inspection buys nothing
  for enrolment and costs a permanently red gate.

  THE VISIBLE EXEMPTION COUNT is the safeguard against this becoming permanent invisible drift.
  If the count grows, someone sees it grow. A silent exemption is how the current population
  reached 11 in the first place.
