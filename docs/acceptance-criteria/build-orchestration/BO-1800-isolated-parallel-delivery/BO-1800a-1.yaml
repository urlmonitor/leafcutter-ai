assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "The isolation primitive MUST be an independent clone with its own git object store and ref namespace per ADR-018 Decision §1 — never a git worktree that shares one repository's .git/objects and refs/."
  - "Object-store-sharing shortcuts (git clone --shared, and git clone --reference WITHOUT --dissociate) MUST NOT be used for autonomous drives (git documents them as possibly dangerous: a gc in one repo can corrupt the borrower)."
  - "The create/remove lifecycle interface MUST stay stable so /build-feature, build-single-ticket, and finalize call sites are unchanged; only the isolation mechanism swaps (worktree -> clone)."
  - "Clone-creation and I/O errors MUST be handled per the project error handling policy (typed exception, logged at WARNING or higher, no bare except)."
  - "The clone-lifecycle logic MUST live on a portable package surface (scripts/ or templates/scripts/ clone-lifecycle helper) deployed by build.py; the invoking agent/skill prose lives in templates/agents/worktree-agent.md and templates/skills/feature/SKILL.md."
delivers_to:
  agent: python-coder
  contract: "An independent per-drive working copy whose object store and refs are physically disjoint from every other concurrent drive; consumed by the create/remove lifecycle and by the gc-disable behavior (BO-1800d)."
