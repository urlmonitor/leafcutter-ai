it_requirements:
  - "LANDING ORDER (IT PO, 2026-11-16). This record lands in the same PR as INF-500d-3 or after it. The vocabulary file templates/scripts/feedback/submit_failure_reasons.json does not exist in this checkout yet, and submit_feedback.py does not yet write the 'submit-failed:<reason>:<category>' line. Until both exist, the instructions have no line to read and the tests cannot pass. The epic-supervisor case also needs INF-500d-3-vi, so INF-500d-3-vi lands with this record or before it."
  - "ERROR STREAM MUST BE SAVED (shared sign-off block and python-coder). templates/agents/_signoff_block.md and templates/agents/python-coder.md do not save the submission's error stream anywhere today. INF-500d-3-ii (done) was meant to cover every submit instruction but did not reach these two. Every submit instruction in both must send the error stream to the per-run file named exactly as INF-500d-3-ii specifies: /tmp/feedback_err_<ticket_basename>_<agent_name>.txt, where <ticket_basename> is the ticket file's name (for example 03-add-parser.md) and <agent_name> is the phase submitted as. python-coder's own section may write the literal phase python-coder in place of <agent_name>. A surface with an event kind adds _<event-kind> before .txt, as ticket-supervisor does."
  - "The per-run name must use placeholders that the INF-500d-3-ii check (unit_tests/feedback/_inf_500d_3_ii_check.py) fills: underscore spellings only. The ticket part must be a basename-type placeholder, never <ticket_path>, which carries path separators. The phase part is <agent_name> or <phase>, or the literal phase. The shared block's existing <your-name> is hyphenated and the check does not fill it, so it must not appear in the file name. Once discovered, every new redirect must pass test_inf_500d_3_ii.py unchanged. INF-500d-3-ii's YAML and tests are neither edited nor weakened."
  - "SHARED BLOCK REACH. The build appends the shared sign-off block to the body of every agent that takes it. In the reference install that is about 24 deployed agents, including python-coder, ticket-supervisor, documentation-verifier, user-surface-smoker and live-surface-tester. Every deployed copy must therefore conform. python-coder then carries two sign-off sections, its own and the appended block, and both must conform. The appended block inside live-surface-tester belongs to this record; live-surface-tester's own capture block stays with INF-500d-3-iv. This record does not edit the template source templates/agents/live-surface-tester.md, which INF-500d-3-iv (capture block) and BO-2000g-1 (one heading line, ~:323) edit; it reaches the deployed copy only through _signoff_block.md."
  - "CAPTURE PRECEDENCE IS REFERENCED, NOT REDEFINED (INF-500d-3). Every instruction applies, in order: (1) the id printed on standard output; (2) the id in the recovery file named by the run's own 'sidecar:' line; (3) the run's own 'submit-failed:<reason>:<category>' line, with reason and category copied verbatim into '(submit-failed:<reason>:<category>)'; (4) written-uncited with the submitted category when a 'sidecar:' or '[submit_feedback] sink:' line exists but no id was recovered; (5) facility-unavailable with the submitted category when none of those three lines exists. No instruction carries its own list of reasons. Every reason identifier an instruction names must be a member of the vocabulary file."
  - "THE READ-BACK MUST BE EXECUTABLE. Today documentation-verifier, user-surface-smoker and ticket-supervisor read standard output only. The shared block and python-coder read nothing at all. Each of these surfaces must prescribe its recovery search and its failure-line read as shell commands. Those commands read only that run's own per-run error file and use the same placeholders as the redirect, so the INF-500d-3-ii check's search-and-redirect agreement covers them. Each prescribed command stays a single simple shell command (shell convention: no chaining, pipes or subshells)."
  - "The read-back finds the 'submit-failed:' line by its prefix. It never assumes the error file holds only one line, because INF-500d-3 keeps the human-readable ERROR lines beside it."
  - "No step may list, glob, sort or search the shared temporary directory, or take 'the newest' or 'the first' recovery file. This is the same rule as INF-500d-3-iv, applied to every surface this record touches."
  - "TICKET-SUPERVISOR. These all carry the reasoned marker form: the four event blocks (mechanical-retry, cross-agent-rework, brainstorm-escalation, halt), the CFCS emit contract paragraph that names the fallback, and the documented value of the payload's feedback_id field. The payload value is either a real id matching ^fb_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9a-f]{8}$ or the marker without its 'feedback-id: ' prefix, matching ^\\(submit-failed:([a-z][a-z0-9-]*):([^\\s:()]+)\\)$. The bare '(submit-failed)' is never documented as a value. The four event-kind file names keep the shape INF-500d-3-ii gave them."
  - "TICKET-SUPERVISOR SECONDARY SUBMISSION (fifth scenario). The secondary '--category tooling-issue' submission that the CFCS emit contract describes (about :597) without a command is removed from every place ticket-supervisor describes it. No command is added for it, and no other submission is removed or merged. After the change, every feedback submission ticket-supervisor describes is one of the four event submissions, each with its runnable command, per-run error file and read-back. If removing the sentence leaves the emit contract paragraph inconsistent, the paragraph is reworded only as far as needed to stay true."
  - "FAIL-OPEN IS UNCHANGED. Recording a marker never aborts or downgrades a sign-off and never changes an adjudication route or a surfaced payload. This holds for BO-2000a-3's continue-anyway rule, ticket-supervisor's CFCS emit contract and epic-supervisor's non-blocking contract. Every lifted recipe ends with exit status 0 when the submission fails."
  - "epic-supervisor is marked DEPRECATED (ADR-006) but still ships and can still be dispatched, so its instruction must be correct. Retiring it is a separate decision and not this record's. This record covers only epic-supervisor's marker; keeping the error stream is INF-500d-3-vi."
  - "Edits are made in the template sources only. Deployed copies are refreshed by the build (ADR-001)."
  - "Test home: unit_tests/feedback/test_inf_500d_3_v.py, created by the test phase. It is not in declared_files because this record's own change is prompt-only, and test files belong to test-writer and python-coder per the surface map, as on INF-500d-3-ii and INF-500d-3-iv. The tests reuse the INF-500d-3-ii harness: _inf_500d_3_helpers.make_layout, plus redirects, searches and fill from _inf_500d_3_ii_check, plus prepare, run_shell and error_file from _inf_500d_3_ii_run. For each deployed surface they lift the recipe from the shared reference layout (marker shared_layout_reader, never their own build.py). They run it with bash in a copied layout with a confined TMPDIR, against a submit entry point that fails with each reason. The vocabulary is read from the copied layout. A grep alone is not sufficient (CLAUDE.md 'Gate / Workflow ACs'). Any scan for the bare form carries positive controls. The deployed copies of the shared block are discovered at test time, never taken from a hard-coded list."
  - "SAME-DELIVERY TEST IMPACT. Once the shared block and python-coder redirect to files, test_inf_500d_3_ii.py discovers them as well. Its reachability test runs every discovered command twice, so roughly 24 copies of the block add about 48 real submissions to its runtime. That file must stay green. Report any slowdown; never cut it by narrowing INF-500d-3-ii's discovery."
test_intent:
  - clause: "it records `feedback-id: (submit-failed:writer-not-allowed:subagent-quality)`, and in ticket-supervisor's returned payload the feedback_id field carries `(submit-failed:writer-not-allowed:subagent-quality)`"
    needs_test: true
    reason: The recorded value comes from running each surface's read-back against its own error file, and ticket-supervisor's payload field is a second place where the bare form can survive.
  - clause: "the reason and the category in the recorded marker are exactly those on the run's own failure line, never a reason the agent chose by judgement, inferred from the exit status alone, or took from a fixed default"
    needs_test: true
    reason: A recipe that hard-codes one reason or rebuilds the category from its own arguments passes on one example, so only runs with different failure lines catch it.
  - clause: "none of these instructions still tells the agent to record a bare `(submit-failed)` in any case"
    needs_test: true
    reason: A single leftover fallback sentence in any deployed copy brings the bare form back, and only a scan of every copy finds it.
  - clause: "if that recovery file holds `fb_2026-11-16_1a2b3c4d`, it records `fb_2026-11-16_1a2b3c4d` and no failure marker"
    needs_test: true
    reason: Recording a marker over a recovered id re-files a written record, and running the recipe with a planted recovery file shows which value wins.
  - clause: "if that recovery file is missing or empty, it records `(submit-failed:written-uncited:<category>)` with the category it submitted under"
    needs_test: true
    reason: The written-uncited choice decides whether a report is later re-filed, so the missing and empty recovery-file runs must each yield it.
  - clause: "it records `(submit-failed:facility-unavailable:complete)`"
    needs_test: true
    reason: The last step of the precedence is reached only when the error file holds none of the three lines, which an absent entry point produces.
  - clause: "it continues its sign-off, or in a supervisor its adjudication routing, exactly as it would after a successful submission, and the verdict, the sign-off status and the route taken are unchanged by the failure"
    needs_test: true
    reason: A read-back step that exits non-zero, or a rule that routes on the marker, makes a failed write fatal, and the lifted recipe's exit status shows it.
  - clause: "each described submission is given with its command"
    needs_test: true
    reason: A submission described in prose with no command has no per-run error file and no read-back, so only a pass over every place ticket-supervisor describes a submission, matched against its lifted commands, shows none is left without one.
  - clause: "the secondary tooling-issue submission is no longer described anywhere in them"
    needs_test: true
    reason: The tooling-issue sentence sits in the emit contract paragraph and can survive an edit of the four event blocks, so a scan of the deployed ticket-supervisor, with a positive control, is needed to show it is gone.
test_spec:
  - name: test_shared_signoff_block_and_every_deployed_copy_record_the_reasoned_marker
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: criterion
    description: "Lifts the submit command and the read-back commands of the shared sign-off block from the deployed shared reference layout (shared_layout_reader), discovering at test time every deployed instruction that carries the block (about 24 agents, never a hard-coded list). Each lifted submit command runs with bash in a copied layout (confined TMPDIR, placeholders filled by the INF-500d-3-ii fill) against a submit entry point that prints nothing on stdout, exits non-zero and writes submit-failed:writer-not-allowed:subagent-quality plus a human ERROR line to the run's per-run error file; the lifted failure-line read returns that line and the marker built from it is feedback-id: (submit-failed:writer-not-allowed:subagent-quality). Every copy agrees."
    proves_clause: "it records `feedback-id: (submit-failed:writer-not-allowed:subagent-quality)`, and in ticket-supervisor's returned payload the feedback_id field carries `(submit-failed:writer-not-allowed:subagent-quality)`"
    code_file: templates/agents/_signoff_block.md
  - name: test_python_coder_own_signoff_step_records_the_reasoned_marker
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: criterion
    description: "Same executed recipe for python-coder's own sign-off submit step (the deployed python-coder carries two sections, its own and the appended block, and both are lifted): the redirect names /tmp/feedback_err_<ticket_basename>_<agent_name>.txt or the literal python-coder phase, the read-back returns the run's own line and the marker is the writer-not-allowed one."
    proves_clause: "it records `feedback-id: (submit-failed:writer-not-allowed:subagent-quality)`, and in ticket-supervisor's returned payload the feedback_id field carries `(submit-failed:writer-not-allowed:subagent-quality)`"
    code_file: templates/agents/python-coder.md
  - name: test_documentation_verifier_records_the_reasoned_marker
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: criterion
    description: "Executes documentation-verifier's lifted submit command (its own category and the fixed phase documentation-verifier) and read-back against the failing entry point; the marker equals the run's own submit-failed line wrapped in parentheses."
    proves_clause: "it records `feedback-id: (submit-failed:writer-not-allowed:subagent-quality)`, and in ticket-supervisor's returned payload the feedback_id field carries `(submit-failed:writer-not-allowed:subagent-quality)`"
    code_file: templates/agents/documentation-verifier.md
  - name: test_user_surface_smoker_records_the_reasoned_marker
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: criterion
    description: "Executes user-surface-smoker's lifted submit command and read-back against the failing entry point; the marker equals the run's own submit-failed line wrapped in parentheses."
    proves_clause: "it records `feedback-id: (submit-failed:writer-not-allowed:subagent-quality)`, and in ticket-supervisor's returned payload the feedback_id field carries `(submit-failed:writer-not-allowed:subagent-quality)`"
    code_file: templates/agents/user-surface-smoker.md
  - name: test_ticket_supervisor_four_events_record_the_reasoned_marker_and_the_payload_field_documents_no_bare_form
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: "Runs each of the four event commands (mechanical-retry, cross-agent-rework, brainstorm-escalation, halt) with its own per-run error file against the failing entry point and applies the lifted read-back: four markers, each the run's own line. The feedback_id field documentation in the blocked payload block is read from the deployed text: it names a real-id form and the reasoned marker form without its prefix, never the bare (submit-failed); the Include feedback_id sentences of the retry and halt events and the CFCS emit contract paragraph carry the reasoned form."
    proves_clause: "it records `feedback-id: (submit-failed:writer-not-allowed:subagent-quality)`, and in ticket-supervisor's returned payload the feedback_id field carries `(submit-failed:writer-not-allowed:subagent-quality)`"
    code_file: templates/agents/ticket-supervisor.md
    must_catch:
      - the four event blocks updated while the payload feedback_id field is still documented as a real id or bare (submit-failed)
      - one of the four events keeping its old read-stdout-only wording
      - an event kind dropped from the per-run file name so two events share one file
  - name: test_epic_supervisor_cross_ticket_recipe_records_the_reasoned_marker
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: criterion
    description: "Executes epic-supervisor's lifted cross-ticket pattern command and read-back against the failing entry point (needs INF-500d-3-vi); the marker is the run's own writer-not-allowed line wrapped in parentheses, not a facility-unavailable default."
    proves_clause: "it records `feedback-id: (submit-failed:writer-not-allowed:subagent-quality)`, and in ticket-supervisor's returned payload the feedback_id field carries `(submit-failed:writer-not-allowed:subagent-quality)`"
    code_file: templates/agents/epic-supervisor.md
  - name: test_marker_reason_and_category_are_copied_from_the_runs_own_failure_line_for_every_reason
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: "For each surface and each of the five reasons from the vocabulary in the copied layout, runs the lifted recipe with a failing entry point whose line carries a category different from the command's own --category (for example the command submits under complete and the line says malformed-submission:blocker) and with distinct exit statuses 1, 2 and 3. The error file holds the human ERROR lines both before and after the one submit-failed: line, and one run has an ERROR line that mentions submit-failed mid-line. The marker equals the line exactly in every case."
    proves_clause: "the reason and the category in the recorded marker are exactly those on the run's own failure line, never a reason the agent chose by judgement, inferred from the exit status alone, or took from a fixed default"
    code_file: templates/agents/_signoff_block.md
    must_catch:
      - reason read off the exit status
      - one fixed reasoned value such as always facility-unavailable
      - category rebuilt from the command's own --category instead of the line
      - a read-back that takes the first line of the error file whatever it says
      - a read-back that matches submit-failed anywhere in a line instead of by prefix
      - a read-back that assumes the error file holds only one line
  - name: test_every_reason_identifier_named_in_a_deployed_instruction_is_a_vocabulary_member
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: "Scans every deployed copy of the six surfaces for submit-failed:<reason>:<category> tokens and for named identifiers (facility-unavailable, written-uncited), and asserts each is a member of the vocabulary read from the copied layout. Positive controls: a planted submit-failed:made-up-reason:complete line and an instruction that carries its own list of reasons are both flagged by the same predicate."
    proves_clause: "the reason and the category in the recorded marker are exactly those on the run's own failure line, never a reason the agent chose by judgement, inferred from the exit status alone, or took from a fixed default"
    code_file: templates/agents/ticket-supervisor.md
    must_catch:
      - an instruction naming an invented reason identifier
      - an instruction that defines its own list of reasons
      - a renamed identifier such as written-but-not-captured
  - name: test_no_deployed_copy_of_the_six_surfaces_still_tells_the_agent_to_record_a_bare_submit_failed
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: "Scans every deployed copy of the shared block, python-coder, documentation-verifier, user-surface-smoker, ticket-supervisor (event blocks, CFCS emit contract, payload field) and epic-supervisor for the bare form: a (submit-failed) not followed by a colon, in prose, fenced text and a payload placeholder. Positive controls: each of the six sentences as they read today is flagged by the same scan, while the reasoned form is not. This scan only pairs with the executed recipe tests and never stands alone; the legacy-pattern mention in the signoff skill and the live-surface-tester capture block belong to INF-500d-3-iv and are not scanned."
    proves_clause: "none of these instructions still tells the agent to record a bare `(submit-failed)` in any case"
    code_file: templates/agents/documentation-verifier.md
    must_catch:
      - a single leftover use (submit-failed) fallback sentence in one deployed copy
      - the ticket-supervisor payload placeholder still reading fb_YYYY-MM-DD_XXXXXXXX or (submit-failed)
      - the epic-supervisor commented fallback FB_ID=(submit-failed) left in the pseudo-code block
  - name: test_a_recovery_file_holding_an_id_wins_over_any_failure_marker
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: "Per surface, the run prints nothing on stdout and its own error file holds a sidecar: line naming a recovery file in the confined TMPDIR that holds fb_2026-11-16_1a2b3c4d (the entry point also writes a submit-failed: line in one variant). The lifted recovery search finds that path, the recovery file read returns the id, and the recorded value is that id and no marker. Decoy recovery files holding other ids sit in the TMPDIR and are never recorded."
    proves_clause: "if that recovery file holds `fb_2026-11-16_1a2b3c4d`, it records `fb_2026-11-16_1a2b3c4d` and no failure marker"
    code_file: templates/agents/documentation-verifier.md
    must_catch:
      - recording the failure marker over a recovered id so a written record is re-filed
      - taking an id from a decoy recovery file in the shared temporary directory
      - recording both the id and a marker
  - name: test_a_missing_or_empty_named_recovery_file_records_written_uncited_with_the_submitted_category
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: "Per surface and per category it submits under (complete, blocker, subagent-quality), runs with an error file whose sidecar: line names a recovery file that is missing, then empty, then (a third run) an error file holding only a [submit_feedback] sink: line. Each records (submit-failed:written-uncited:<category>) with the category of the command, never a dash, never facility-unavailable and never a recovered foreign id from a decoy."
    proves_clause: "if that recovery file is missing or empty, it records `(submit-failed:written-uncited:<category>)` with the category it submitted under"
    code_file: templates/agents/user-surface-smoker.md
    must_catch:
      - facility-unavailable recorded when a sidecar line proves the write happened
      - the category dropped or replaced by a dash
      - the missing case handled but the empty case recorded as an id
      - an empty recovery file read as a valid id
  - name: test_an_absent_submit_entry_point_records_facility_unavailable_with_the_submitted_category
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: "In a copied layout whose scripts/feedback/submit_feedback.py is removed, each surface's lifted submit command (category complete) fails with the interpreter's own message, so the per-run error file holds none of submit-failed:, sidecar: or [submit_feedback] sink:. The lifted read-back records (submit-failed:facility-unavailable:complete); the same recipe against a failure line that exists never yields facility-unavailable."
    proves_clause: "it records `(submit-failed:facility-unavailable:complete)`"
    code_file: templates/agents/_signoff_block.md
    must_catch:
      - written-uncited recorded as the default when no line exists
      - the bare form recorded when the file holds nothing
      - facility-unavailable recorded as a default even when a submit-failed line exists
      - the reason chosen from the interpreter's exit status 2
  - name: test_failed_submission_recipes_leave_the_signoff_and_the_route_untouched
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: "For every surface and every failure case, each read-back command after the submit command exits 0 (a sed-style prefix print, not a grep that exits 1 on no match), the submit command's own non-zero status is not masked, and no prescribed command chains, pipes or subshells. A scan of the instructions finds no step that routes on the marker (no halt, no retry and no changed adjudication outcome keyed on a submit-failed value), with a positive control of an instruction that says to stop sign-off when the marker is written."
    proves_clause: "it continues its sign-off, or in a supervisor its adjudication routing, exactly as it would after a successful submission, and the verdict, the sign-off status and the route taken are unchanged by the failure"
    code_file: templates/agents/ticket-supervisor.md
    must_catch:
      - a read-back that is a bare grep and so exits 1 when the file holds no failure line
      - an instruction that aborts sign-off when the marker is recorded
      - an adjudication route that changes when the submission fails
      - a read-back that pipes or chains and so triggers a permission prompt
  - name: test_every_feedback_submission_ticket_supervisor_describes_is_given_with_its_command
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: "In the deployed ticket-supervisor, enumerates every place a feedback submission is described (the four event blocks, the CFCS emit contract, the payload field note) and matches each against the lifted commands: exactly four submit commands exist, each with its own per-run error file and read-back, and no prose describes a submission that has none. Positive control: the sentence about a secondary tooling-issue call, as it reads today, is flagged as a described submission without a command by the same enumeration."
    proves_clause: each described submission is given with its command
    code_file: templates/agents/ticket-supervisor.md
    must_catch:
      - a prose-only submission description with no command left in the emit contract
      - a fifth submission described with no per-run error file
      - one of the four event commands deleted to satisfy the enumeration
  - name: test_the_secondary_tooling_issue_submission_is_gone_and_the_emit_contract_still_reads_true
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: "Scans the deployed ticket-supervisor for any description of a secondary tooling-issue submission (the word tooling-issue near a submission, a secondary call, loaded but rejected the category) and finds none, with a positive control on the current sentence. The four event commands and their per-run files remain, no command for tooling-issue was added, and the emit contract paragraph still says the calls are non-blocking and routing is unchanged."
    proves_clause: the secondary tooling-issue submission is no longer described anywhere in them
    code_file: templates/agents/ticket-supervisor.md
    must_catch:
      - the sentence removed from the emit contract but a tooling-issue submission still described elsewhere
      - a command added for the secondary submission instead of removing it
      - one of the four event submissions removed along with the sentence
      - the paragraph left with a dangling sentence about the secondary call
  - name: test_lifted_recipes_run_against_the_real_submit_script_and_read_back_its_own_failure_line
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: reachability
    description: "Reachability: for every surface, runs the deployed lifted submit command with bash against the real submit_feedback.py of a copied layout that has no sink declaration (needs INF-500d-3), so the script itself writes submit-failed:destination-unwritable:<category> to the per-run error file; the lifted read-back returns that line and the marker built from it carries the category the command submitted under. A control run with a declared sink returns an id on stdout and no failure line."
    proves_clause: "it records `feedback-id: (submit-failed:writer-not-allowed:subagent-quality)`, and in ticket-supervisor's returned payload the feedback_id field carries `(submit-failed:writer-not-allowed:subagent-quality)`"
    code_file: templates/agents/_signoff_block.md
