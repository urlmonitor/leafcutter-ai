notes: |
  Amendment provenance (2026-08-24): amended in place, not superseded, per
  docs/how-to/ac-traceability-store.md.

  THIS RECORD WAS NEVER FALSELY DONE — THE STORE WAS HONEST HERE. It carried
  work_status: todo for its whole life, correctly, because nothing implemented
  it. What went wrong was the reverse of phantom-done: its parent BP-600c-2 was
  marked done, and a reader who stopped at the parent would not have seen that
  this constraint on it was unbuilt. The defect was real — an import error in
  the red phase reported "did not pass", which the workflow read as a good red
  phase and proceeded to apply a fix on the strength of a test that had never
  executed a single assertion.

  work_status is left at todo per the instruction not to change it, but that
  value is now stale in the safe direction: the behaviour is implemented in
  templates/workflows-js/quick-fix.js and covered by the two tests named in
  covered_by, each mutation-proved (disabling the guard turns the test red).
  Promoting it to done is a deliberate decision for the owner, not something
  this amendment should take; the done-proof gate should now be satisfiable,
  since a covering test bearing this AC's covers-tag exists.

  Worth recording: expects_from on this record already named an "outcome field"
  in the red-phase result at authoring time in June. The requirement was
  specified correctly and the implementation simply never grew the field. The
  criterion was right and waiting for two and a half months.
