notes: |
  WHAT THE GAP IS, AND WHY IT IS NOT A NEW PRINCIPLE. The parent L1 and its first four
  children make a document inside a declared location exempt from the length standard
  ENTIRELY AND FOREVER. A generated card can go from 2,809 lines to 28,000 and no record
  in the subtree notices: GE-127g-1 only asks that such a commit complete, GE-127g-2 only
  asks that the document be counted and named as set aside, GE-127g-3 bounds WHICH
  documents are set aside and says in its own notes that it does not bound their size, and
  GE-127g-4 publishes the mechanism. So the L1 breaks a promise this goal already made:
  GE-127c's criteria state that holding work to a workable size means the project "does
  not silently create a place where files can grow without limit", and a declared
  set-aside location with no bound is precisely such a place. The user's words endorse the
  exemption and not the unboundedness — "in the end we can also skip some files, but we
  need to make sure that stuff does not grow indefinitely" — so what is missing is a
  bound, not a narrower exemption.

  THE BOUND, SETTLED: A PER-LOCATION DECLARED CEILING THAT IS REPORTED AND NEVER REFUSED,
  PLUS AN ENTRY THAT IS INVALID WITHOUT ONE.

  Three parts, and all three are load-bearing:
    (a) Each declared entry carries a ceiling of its own, far above the authored limit,
        chosen so that an ordinary regeneration does not reach it. The numeric values are
        the IT PO's, per GE-127c's precedent of stating the principle and leaving the
        enumeration to enrichment.
    (b) Standing above that ceiling is REPORTED, with the measured size, the ceiling, and
        the SOURCE the location's stated ground identifies — and the commit completes.
    (c) An entry that declares no ceiling is REJECTED, so a location cannot be set aside
        without a bound. This is the clause with teeth: it is the only one that makes the
        bound impossible to omit, and it is the direct mechanical expression of GE-127c's
        sentence.

  WHY A REFUSAL IS NOT THE BOUND, STATED AS THE DECISION IT IS RATHER THAN AS CAUTION.
  A refusal no human can act on is the entire defect this L1 exists to remove. If crossing
  the ceiling refused the commit, the refusal would land on whoever next stages the
  regenerated document — who did not write the growth, cannot shorten it, and whose only
  remedies are to edit a file the next regeneration overwrites or to wait for someone else
  to change a generator. That is the original defect reproduced at a larger number, and
  the ceiling's height makes it worse rather than better: a ceiling high enough never to
  fire on ordinary drift is also high enough that, when it does fire, the fix is a
  generator change measured in days — and every commit in the repository that touches the
  location would be blocked throughout. Part (c)'s refusal is a different animal and is
  the one refusal this record does admit: it fires on the commit that EDITS THE
  DECLARATION, where the person at the keyboard is the person who can act in the next
  keystroke.

  WHO THE SIGNAL REACHES, NAMED. Not the committing author — that is the point. The report
  is addressed to the owner of the source the location's stated ground identifies: for the
  cards, whoever maintains templates/agents/ and scripts/generate_agent_cards.py; for the
  roadmap mirror, whoever maintains docs/roadmap.json and the regeneration step; for the
  document index, whoever maintains the build's doc-index phase. That is why the second arm
  requires the source to be NAMED rather than merely the document: a report that says only
  "this file is enormous" is addressed to nobody. And because the only two ways to silence
  an over-ceiling report are to change what the generator emits or to raise the ceiling in
  the declaration, the second route lands as a diff hunk in commit_guardian.json carrying a
  stated ground — which puts the decision in front of a pull-request reviewer rather than
  letting it happen by nobody deciding anything. GE-127g-4's published text is what makes
  the report legible to that reader, which is why the follow-up below is not cosmetic.

  WHAT WAS REJECTED, AND ON WHAT GROUND.
    - REFUSING ON CROSSING THE CEILING. Rejected on the ground above: it reintroduces the
      unactionable refusal that is this L1's whole subject, and it is explicitly ruled out
      by the requirement that a card which grew because a template legitimately gained
      content must not block the commit that regenerates it.
    - REFUSING ONLY THE COMMIT THAT EDITS THE GENERATOR OR ITS TEMPLATES. This was the
      most attractive rival, because it routes the refusal to exactly the person who can
      act on generator output. Rejected because that commit IS the ordinary-regeneration
      case named above: a template legitimately gaining content is precisely a generator
      edit, so the rule would block the one commit that must not be blocked.
    - BOUNDING THE GENERATOR'S OUTPUT AT GENERATION TIME, so the build fails when a
      generated document exceeds its ceiling. The strongest rival on the "reaches someone
      who can act" axis, and rejected on three grounds rather than one. First, it leaves
      the doc-length gate with no bound at all, so a document arriving in a declared
      location by any other route — a hand-run script, a vendored mirror, a location
      declared for a generator that no longer runs — is still unbounded; the bound would
      attach to generators while GE-127g-1 declares LOCATIONS, and GE-127g-4's second
      clause requires the ground to be the earning PROPERTY and not the generator's name.
      Second, a failing build blocks every developer of the package, which is the
      unactionable-refusal shape moved one level up rather than removed. Third, it cannot
      be read out of a commit's outcome, which is this subtree's verification convention.
      Recorded as a reasonable COMPLEMENT for a later record, not as a substitute.
    - A REVIEW TRIGGER WITH NO DECLARED NUMBER — report the largest document in each
      location and leave the judgement to a reader. Rejected because nothing ever changes
      state: there is no point at which anything is required, the output is satisfiable by
      a figure nobody reads, and an exemption that has quietly grown by a factor of ten
      looks exactly like one that has not. The declared ceiling is what turns a figure
      into a threshold, and part (c) is what stops the threshold being omitted.
    - ONE GLOBAL CEILING FOR ALL SET-ASIDE DOCUMENTS, or simply a raised max_lines.
      Rejected on two grounds. A single number cannot say anything useful about both a
      2,809-line card and a 289-line index at once — set high enough for the former it is
      vacuous for the latter. And the parent L1's it_requirements forbid raising a limit
      for any document outside the declared locations, which a raised max_lines would do.

  WHICH BRANCH OF classify_dimension EACH ARM EXERCISES — READ THE FUNCTION BEFORE
  IMPLEMENTING, AND NOTE THAT A SIBLING RECORD'S ARMS WERE TRANSPOSED BY GETTING THIS
  WRONG. classify_dimension(current, previous, limit) at
  templates/scripts/commit_guardian/_doc_length_ratchet.py:293-314 routes
  `previous is not None and previous > limit` to the GROWTH branch, returning "grew" only
  when current > previous and "pass" otherwise; everything else goes to the CROSSING
  branch, returning "over" only when current > limit.
    - ARM 1 (ordinary regeneration below the ceiling): against the DECLARED CEILING the
      previous value is below the ceiling, so this is the CROSSING branch and the current
      value is below the ceiling, so it classifies "pass". Against the AUTHORED LIMIT the
      very same document is in the GROWTH branch — it was already over 300 at the parent
      revision and grew — and would classify "grew", which is the present-tense refusal
      GE-127g-1 removes. One document, two limits, two different branches: this is the
      pair that must not be collapsed.
    - ARM 2 (crossing the ceiling): CROSSING branch against the ceiling — previous below
      it, current above it — classifying "over". The verdict word is "over" and the
      outcome is a REPORT with a completing commit, which is why the report must not be
      taken from the refusal path.
    - ARM 3 (already above the ceiling and shrinking): GROWTH branch against the ceiling —
      previous above the ceiling — with current < previous, so the ratchet classifies
      "pass". This is the arm a transposed reading loses, and it is the reason the arm
      exists: an implementation that triggers the over-ceiling report from
      classify_dimension's verdict says nothing at all here.
    - ARM 4, FIRST HALF (ceiling raised above the document): CROSSING branch against the
      raised ceiling, classifying "pass".
    - ARM 4, SECOND HALF (ceiling held, document larger again): GROWTH branch against the
      ceiling, classifying "grew". The two halves of arm 4 sit in different branches, which
      is deliberate — the figures must be right in both.
    - ARM 5 (entry with no ceiling): no branch at all. The entry is invalid before any
      document is measured and classify_dimension is never reached.

  HOW EACH ARM DEFEATS A LITERAL, AND WHY NO ARM IS SUFFICIENT ALONE. Arm 2 alone is
  satisfied exactly by printing two numbers observed at implementation time, which is why
  arm 4 exists in two halves: the first holds the document fixed and moves the ceiling,
  requiring the report to DISAPPEAR; the second holds the ceiling fixed and moves the
  document, requiring both the stated size and the stated headroom to follow. Holding one
  thing fixed and moving the other in both directions is GE-127g-2's construction, reused
  rather than reinvented, and it is the only shape no pair of literals satisfies. Arm 1 is
  the negative control against the cheapest possible "bound" — disabling the exemption —
  and it is also the arm that proves this record has not reintroduced the original defect.
  No figure anywhere is pinned: the sizes, the headroom and the population must be computed
  from the tree at run time, so none of these arms goes red the next time an agent is added.

  MEASURED IN THIS WORKTREE ON 2026-10-09 — CARRY THESE INTO THE ENRICHMENT DECISION, NOT
  INTO THE CRITERIA, AND DO NOT PIN ANY OF THEM AS AN EXPECTED VALUE. docs/agents/cards/
  holds 64 documents, every one carrying card_version: generated; three stand above the
  300-line limit and the longest is python-coder.card.md at 2,809 lines, up from 2,525 at
  HEAD after one ORDINARY regeneration. That single figure — a 284-line jump from an
  unremarkable regeneration — is the measurement that sets the shape of the ceiling
  decision: a ceiling placed anywhere near the present maximum would fire on ordinary
  drift within a handful of regenerations, so it must sit well clear of it, which is the
  same conclusion as "crossed only when something is wrong with the generator".
  docs/roadmap.md stands at 286 against 300 and is climbing; docs/INDEX.md stands at 289
  against 300 and grows whenever any unrelated document is added. The three declared
  locations the parent L1 pins therefore differ in scale by an order of magnitude, which is
  the measured reason the ceiling is per location rather than global. Any test that pins
  64, 2,809, 286 or 289 as an expected value goes red the next time an agent is added or a
  document is written, which is the opposite of what this record says.

  NO HEADROOM LEFT. With this record, GE-127g holds 5 of its 5 permitted L2 children, and
  the parent's own notes record that GE-127 holds 7 of 7 L1 slots. Both follow-ups named
  below therefore need a split or a new L0 rather than another sibling, and this paragraph
  is the warning for whoever hits that.

  FOLLOW-UPS, NAMED AND DELIBERATELY NOT AUTHORED HERE.
    (1) DISCHARGED 2026-10-09 — KEPT RATHER THAN DELETED, BECAUSE A FOLLOW-UP THAT WAS
        RAISED AND THEN CLOSED IS MORE USEFUL TO A LATER READER THAN ONE THAT VANISHED.
        AS RAISED: GE-127g-4's published text must also state each declared location's
        ceiling and what an over-ceiling report means, or the published description will
        document an exemption without its bound; that record was already authored and
        reviewed and its criteria were not this author's to change, so the gap was reported
        here rather than fixed.
        AS DISCHARGED: GE-127g-4 was amended the same day — not by this record — and now
        carries a third criteria arm requiring the published description to state that a
        bound applies to a set-aside location, that a document standing above it is
        reported while the commit still completes, and that declaring a location requires
        declaring the size as well as its ground. It also gained GE-127g-5 in depends_on
        and a reciprocal doc_links entry stating the boundary in both directions. Nothing
        in this record's criteria restates any clause of GE-127g-4, and the criteria were
        not changed by the discharge; the boundary is stated in this record's doc_links
        entry for GE-127g-4.
    (2) A generation-time bound on the generator's own output, as a complement to this
        record rather than a substitute — the rejected option whose ground for rejection
        was sufficiency, not wrongness.

  DOCUMENTATION-TRIGGER RATIONALE, REQUIRED BECAUSE THE PARENT L1 CARRIES A reference-doc
  TRIGGER AND THIS RECORD ADDS NO DOCUMENTATION AC. The trigger is already discharged by
  GE-127g-4, which owns the whole of the published surface for this mechanism; a second
  documentation child would split one published description across two records, which is
  the drift the parent's notes rule out for the declaration itself. There is also no slot:
  GE-127g is at 5 of 5 after this record. The documentation obligation this record creates
  is therefore recorded as follow-up (1) above, against GE-127g-4's deliverable, rather
  than as a sixth child.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM.

  (1) THE REFUSAL. MUTATION: refuse the commit when a document in a declared location
      stands above its location's declared ceiling.
      MUST GO RED: the second and third arms, both of which require the commit to COMPLETE.
      MUST STAY GREEN: the first arm, the first half of the fourth arm, the fifth arm, and
      every arm of GE-127g-1, GE-127g-1-i, GE-127g-2, GE-127g-2-i and GE-127g-3 — all of
      which run below the ceiling. That green half is the measure of how easily this record
      could reintroduce the very defect the parent L1 exists to remove, and it is why the
      completing commit is stated as a clause rather than assumed.

  (2) THE RATCHET-DERIVED REPORT. MUTATION: trigger the over-ceiling report from
      classify_dimension's verdict against the ceiling, so it is stated only when that
      verdict is "over" or "grew".
      MUST GO RED: the third arm only — the GROWTH branch returning "pass" for a document
      that shrank while still standing above its ceiling.
      MUST STAY GREEN: the first, second, fourth and fifth arms. This is the narrowest
      mutation here and the whole reason the third arm exists. It is also the mutation a
      transposed reading of classify_dimension conceals, because the third arm is the
      GROWTH branch and the second is the CROSSING branch.

  (3) THE LITERAL CEILING. MUTATION: compare against a single ceiling written into the
      gate's own code instead of the one each entry declares.
      MUST GO RED: the first half of the fourth arm, which raises one location's declared
      ceiling and requires the report to disappear, and the fifth arm, which requires an
      entry with no ceiling to be refused.
      MUST STAY GREEN: the first, second and third arms, each of which a single built-in
      number satisfies whenever it happens to sit between the fixture's sizes. This is the
      BP-900g-7 shape — a declaration nothing consumes — and the fourth arm's first half is
      the only clause that catches it.

  (4) THE PINNED FIGURES. MUTATION: state the measured size and the headroom as the numbers
      observed at implementation time.
      MUST GO RED: the second half of the fourth arm, which regenerates the document larger
      with the ceiling held fixed and requires both figures to follow.
      MUST STAY GREEN: the first, second, third and fifth arms — the second arm is
      satisfied exactly by two literals, which is why it is never sufficient on its own.
      Construction reused from GE-127g-2's second and third arms.

  (5) THE DISABLED EXEMPTION. MUTATION: obtain the bound by judging documents in declared
      locations against the authored limit after all.
      MUST GO RED: the first arm's final clause, and every arm of GE-127g-1 and
      GE-127g-1-i.
      MUST STAY GREEN: the second, third and fourth arms, if the ceiling report is kept
      alongside. Recorded because it is the cheapest way to make growth look bounded and it
      re-breaks the record this whole subtree was written for.

  (6) THE DEFAULTED CEILING. MUTATION: honour an entry with no declared ceiling by treating
      its ceiling as unbounded, or as the authored limit.
      MUST GO RED: the fifth arm.
      MUST STAY GREEN: every other arm here and every arm elsewhere in the subtree. This is
      the omission GE-127c's sentence forbids, the fifth arm is the only clause in the tree
      that reaches it, and the "unbounded" variant is the one that leaves the whole record
      satisfiable while changing nothing.

  (7) THE THIRD POPULATION. MUTATION: satisfy this record by moving over-ceiling documents
      out of the set-aside count and into the judged count.
      MUST GO RED: the first arm's final clause, and GE-127g-2's first arm, whose counts
      and exactly-one-population requirement this would break.
      MUST STAY GREEN: the second, third and fourth arms, whose statements an
      implementation of this shape can still make correctly. Recorded because it is the
      natural way to express "now we do care about this document" and because it quietly
      converts a report into a refusal through GE-127g-1's own judged path.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. Those are the IT PO's, as are the numeric
  ceiling for each of the three declared locations, the key name the ceiling is declared
  under, and where in the run's output the over-ceiling statement appears.
