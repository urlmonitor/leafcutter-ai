id: BO-2400g-3
components:
  - build_orchestration
  - review_system
title: "The fast lane's change is read for design problems, not only for local mistakes"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run has built its work and the change is about to be read,
  When the change is examined,
  Then it is examined both for local mistakes inside a single piece of code and for
    cross-cutting problems in how the change is shaped — the kind that are only
    visible when the whole change is considered together,
  And those two examinations are carried out by two separate readers, each asked for
    by the run itself,
  And neither reader obtains the other examination by asking a further reader on its
    behalf,
  And a change that contains a cross-cutting design problem but no local mistake is
    still surfaced.
depends_on: [BO-2400g, BO-2400g-2, TQ-200c-2]
doc_links:
