notes: |
  Retention rather than deletion is the point ADR-011 chose the separate sink
  for: a corrected rule can be re-run over a retained corpus and cannot be
  re-run over a deleted one. This AC keeps that property intact through
  whichever resting-state mechanism the IT PO picks, including archival.
change_target: code
