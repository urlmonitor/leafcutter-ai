id: GE-128a-4
title: "The test-declaration check runs in a mode someone chose, and says so"
component: guardrail-engine
components:
  - commit_guardian
  - testing_quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Scenario 1 - the shipped configuration chooses the mode
  Given the project's shipped commit-check configuration as built for a fresh
    install,
  When the configuration entry for the test-declaration check is read,
  Then it states that check's mode explicitly, as either warning mode or error
    mode,
  And the mode the check runs in equals the mode that entry states.

  Scenario 2 - the check reports the mode in force and where it came from
  Given the test-declaration check runs with its mode explicitly set to warning
    mode,
  When it evaluates a staged test file that adds one undeclared test,
  Then its output states that warning mode is in force and that the mode was
    explicitly configured.

  Scenario 3 - an absent setting is reported, not silently treated as a choice
  Given a configuration in which the test-declaration check has no mode entry,
  When the check evaluates a staged test file that adds one undeclared test,
  Then its output states that no mode has been chosen for this check,
  And it does not report the mode it falls back to as a configured choice.
depends_on:
  - GE-128a
  - GE-128a-2
doc_links:
  - path: docs/acceptance-criteria/guardrail-engine/GE-128-tests-declare-what-they-prove/GE-128a.yaml
    relationship: parent
    status: exists
    relevance: >-
      Parent L1. Its notes: today the gate resolves to advisory because its key is
      ABSENT and nobody chose advisory; once the ratchet exists the setting can be
      made deliberate, and a deliberate advisory is a legitimate answer. What must
      not survive is a mode nobody picked. Which mode is chosen is NOT decided here.
  - path: templates/scripts/commit_guardian/commit_guardian.json
    relationship: modifies
    status: exists
  - path: templates/scripts/commit_guardian/check_test_ac_tags.py
    relationship: modifies
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The shipped configuration (templates/scripts/commit_guardian/commit_guardian.json, as deployed by build.py) must carry an explicit mode value for the test-declaration check; which value is chosen is NOT decided by this record and must be recorded by whoever sets it, not defaulted by the implementer."
  - "The check must report, on every run that evaluates a test file, the mode in force and its source as one of: explicitly configured, or not chosen (falling back to <mode>). The not-chosen wording must never describe the fallback as a configured choice."
  - "If an environment-variable override of the mode (CHECK_TEST_AC_TAGS_MODE) is kept, a run governed by it must report the override as its source, distinct from both the configuration and the not-chosen fallback."
  - "Do not restate or change whether the gate is registered at all (BP-1600a-2) or how a check reports its own strength (GE-126); this record covers only the mode setting and its report."
  - "Edit the tracked templates only (check_test_ac_tags.py, commit_guardian.json); verify the deployed copies through the build.py round-trip, and note the inject_config build step rewrites literal {{config.*}} tokens in deployed files."
delivers_to:
  agent: documentation-expert
  contract: "For GE-128a-6's reference entry: the configuration file and key that hold the test-declaration check's mode, its two allowed values (warning, error), and the exact source wording the check prints for explicitly configured, environment override (if kept) and not chosen."
expects_from:
  ac_id: GE-128a-2
  contract: "The per-file ratchet verdict whose refusal this mode setting either enforces (error mode) or reports as a warning (warning mode)."
