id: TQ-400e-6
components:
  - testing_quality
  - ac_store
title: "The exemption reference states when a declaration is honoured, when refused, and which records may carry one"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the exemption path — a finished record declared to need no test, carrying
    a written reason — which is already live and unguarded today and is honoured
    with no reason required for 37 finished records,
  When a reader consults the reference entry for exemptions, without the schema or
    the check's source in front of them,
  Then they can state which two existing record fields express an exemption — the
    declaration and its written reason — and that no third or parallel field is
    involved,
  And they can state exactly when a declaration is honoured and when it is
    refused: that an absent, empty or whitespace-only reason is refused, that the
    reason's wording is never judged for quality, and that a refused record is
    reported unproven on the same terms as one carrying no declaration at all and
    is demotable like any other,
  And they can determine, for a record in front of them, whether it may legally
    carry an exemption before writing one — the entry reconciles the two rules
    that today point in opposite directions, the authoring-time rule that refuses
    a test-free declaration on an approved leaf code requirement and the
    check-time rule that honours the same declaration unconditionally on a
    finished record, and states which records the reconciled rule leaves eligible,
  And they can tell what the store looks like today as distinct from what the
    hardened rule requires, so the finished records currently exempt without a
    reason are described as the backlog they are rather than as compliant,
  And a reader can write a valid exemption from the entry alone and have the next
    run honour it, and can write the reasonless form and see it refused — the
    rules the entry states are the rules the check applies, not a parallel
    description of them,
  And the entry is the single statement of these rules, with each enforcement
    point that applies them pointing to it rather than carrying its own account,
    so the two layers cannot drift into disagreeing about which records may be
    exempt.
depends_on:
  - TQ-400e
  - TQ-400e-3
  - TQ-400e-4
  - TQ-400e-5
