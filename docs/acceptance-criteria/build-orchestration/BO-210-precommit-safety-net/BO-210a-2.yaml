created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  Given the reconciled routing config,
  When a reader inspects it for the list of gating hooks,
  Then the config contains exactly one blocking_hook_ids array,
  And that array lists the gating hook ids: check-complexity, check-docstrings,
    check-exception-handling, check-file-size, check-ac-schema, check-ac-limits,
    and check-contract-shrinking,
  And no other field in the config independently determines whether a hook gates a commit,
  And a hook id absent from blocking_hook_ids is treated as non-gating by any reader.
depends_on: [BO-210a, BO-210a-1]
