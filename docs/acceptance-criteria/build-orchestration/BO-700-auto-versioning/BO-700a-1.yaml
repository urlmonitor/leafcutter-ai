title: "Changelog entry content is assembled from AC fields of completed tickets"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket file with frontmatter `source_ac: BO-100a`
    and the AC file BO-100a.yaml contains:
      title: "Build tickets in dependency order"
      component: build-orchestration
      level: L1
      criteria: "Given an epic has multiple tickets..."
    and the parent L0 AC BO-100.yaml contains:
      title: "Smart sequencing for multi-ticket epics"
  When the changelog emission step runs for this ticket,
  Then the changelog entry contains:
    - the L1 title as the entry heading ("Build tickets in dependency order")
    - the component name ("build-orchestration")
    - the L0 title as the goal context ("Smart sequencing for multi-ticket epics")
  And no field in the entry is composed by an LLM from the diff or commit messages
  And every field is read verbatim from the AC YAML files.
