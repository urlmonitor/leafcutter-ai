title: "Sign-off status is tracked in AC metadata and queryable"
component: ticket-creation
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket has three phase agents each requiring sign-off,
  When the first agent signs off with valid artifacts
    and the second agent has not yet run,
  Then the ticket metadata shows sign-off status per phase:
    phase 1 as "signed_off", phase 2 as "needed", phase 3 as "not_needed",
  And a supervisor querying the ticket can determine
    which phases are complete and which remain outstanding.
