criteria: |
  One saving step for every route -- only your files, your credit kept, never on main.

  Every route saves its work through the same single step: only the files that work
  touched go in, the author credit you wrote is kept word for word, the project's checks
  always run and get one honest chance to be fixed, the shared main line is never written
  to directly, and you always get one clear answer about what happened.
