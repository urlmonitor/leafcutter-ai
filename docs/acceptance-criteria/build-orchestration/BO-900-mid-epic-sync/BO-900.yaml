criteria: |
  Given an epic drive accumulates commits on a feature branch while main advances,
  When the divergence between the worktree and origin/main grows beyond a threshold,
  Then the build-epic workflow pauses and prompts the user to merge main,
  And the user can accept the automatic merge or continue without merging,
  And merge conflicts are surfaced immediately with actionable diagnostics,
  And the threshold is configurable per project.
