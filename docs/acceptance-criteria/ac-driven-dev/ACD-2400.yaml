id: ACD-2400
components:
  - ac_driven_dev
readiness: approved
priority: high
title: "Product-truth artifacts are written inside the authoring worktree, not the caller's checkout"
component: ac-driven-dev
status: active
req_status: approved
work_status: done
roadmap_phase: phase_1
criteria: |
  Given the /plan-feature workflow has created a dedicated authoring worktree
    (authoringWorktreePath is a non-null absolute path) for this run,
  When the product-truth (PT) phase dispatches mock-data-author, mockup-author,
    or flow-author to draft an artifact,
  Then the dispatched agent is told the product-truth store path as an
    absolute path anchored inside the authoring worktree, so the artifact
    file it writes is written inside that worktree rather than the caller's
    own checkout,
  And the dispatch prompt explicitly warns the agent not to write relative to
    docs/product-truth/ in its own checkout, mirroring the equivalent warning
    already carried by the AC-authoring dispatch prompt,
  And every other consumer of the product-truth store path (the store-presence
    check and the flow-backlink reconciliation step) resolves that same
    worktree-anchored location without joining the worktree root onto it a
    second time,
  And when no authoring worktree exists for this run, the store path remains
    the plain relative "docs/product-truth" default, unchanged from before
    this fix.
