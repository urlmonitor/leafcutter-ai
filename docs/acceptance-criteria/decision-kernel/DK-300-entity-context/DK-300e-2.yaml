assigned_agent: test-writer
delivers_to: {"agent":"python-coder","contract":"Executable recognition evaluation report: {corpus_version:string,case_count:int,passed:boolean,cases:list[{id,expected,observed,violations}],by_family:dict[family,{precision:number,recall:number,coverage:number}],paired_intent:{baseline,entity_context,caller_context_equal:boolean,model_call_counts}}. Empty cases are invalid; each named negative control must fail. Tests and harness reside in tests/kernel/entity_context/ and the repository's evaluation surface."}
expects_from: {"ac_id":"DK-300d-1","contract":"EntityContext (kernel.contracts.entity_context): schema_version='1.0', kind='entity_context'; entities:list[EntityCard] with family:glossary|doc_type|entry_kind|native_kind|symbol|artifact_id, identity:string, native_kind:string|null, meaning:string, signature:string|null, resolution:resolved|ambiguous, matches:list[{channel:string,record_index:int|null,start:int,end:int,surface:string}], provenance:{source_id:string,locator:string,snapshot:string,source_hash:string,projection_hash:string}. Offsets are half-open Unicode code-point positions in original channel text. Original goal and caller claims are separate from meaning projection. Context has original_goal:string (verbatim), caller_context, workspace_id, repository_root, registered_capabilities:string[], status:recognized|no_matches|partial|unavailable|disabled, unresolved:list[{family,reference,state,matches,candidates}], coverage:{scan_complete:bool,index_status,index_fingerprint:string|null,families,counts,by_family}, budgets:{lookups:int,serialized_chars:int,elapsed_ms:number,jev_calls:0}, limitations:string[]. Counts contain detected,resolved,returned,omitted,unknown,ambiguous. No evidence field."}
