title: "flow_change injects architect-review before any coder in the computed chain"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket has change_type: flow_change
    and the assigned work agent is python-coder (produces: production_code),
  When ticket-supervisor computes the agent chain,
  Then architect-review appears in the chain
  And architect-review has a lower sequence number than python-coder
  And architect-review has a lower sequence number than test-writer
  And architect-review's status is set to "needed"
  And architect-review must sign off before any coder or test-writer is dispatched

  Given a ticket has change_type: data_change
    and the guardrails mapping includes architect-review for data_change,
  When ticket-supervisor computes the agent chain,
  Then architect-review appears before the work agent
  And it follows the same ordering constraint (review before implementation)

  Given a ticket has change_type: config_change,
  When ticket-supervisor computes the agent chain,
  Then architect-review does NOT appear in the chain
  And the chain proceeds directly to TDD agents and the work agent
