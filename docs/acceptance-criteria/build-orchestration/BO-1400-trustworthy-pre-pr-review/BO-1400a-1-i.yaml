readiness: approved
priority: high
title: "Real-data verification reports INCONCLUSIVE (not PASS) when the validation tool is unavailable"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1400-trustworthy-pre-pr-review/BO-1400a.yaml"
criteria: |
  Given a ticket under pre-PR review carries a bulk/quantitative data claim that the
    review must verify against the real data store
  And the means of running that validation is unavailable (for example the validation
    library is not installed, or the real data store cannot be reached)
  When the pre-PR self-review attempts the real-data verification of that claim
  Then the review reports the verification as INCONCLUSIVE for that claim and names the
    limitation that prevented it (the missing validation means or the unreachable store)
  And the review does not record the claim as PASS, and does not silently treat the
    skipped verification as a clean result
  And the inconclusive verification is visible in the review output rather than omitted
depends_on:
  - BO-1400a-1
