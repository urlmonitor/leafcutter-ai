amended_by:
  - reason: "Retitled 'Every ticket is proven fit to dispatch before an agent is spawned' -> 'Every dispatch is proven fit before an agent is spawned', and the criteria moved with it. The subject had drifted: four of the five L1s beneath this goal now concern the DISPATCH rather than the ticket -- BO-1900c (is this the right agent for the work), BO-1900d (is the hand-off a safe pointer), BO-1900e (can the agent reach the checks its own instructions demand), and BO-1900a (does the check run at all). Only BO-1900b is about the ticket's own claims. The criteria had drifted the same way and were additionally incomplete after BO-1900e was promoted on 2026-08-31: the benefit statement enumerated three dimensions of fitness (premises, agent fit, hand-off shape) and did not mention the fourth, so the goal's own text understated what sits beneath it. Enumeration extended and the ticket-framed phrasings ('Catch a bad ticket', 'Tickets that fail the check') changed to dispatch-framed ones. No L1 or below was touched. WHY A TITLE IS WORTH A DEDICATED AMENDMENT: titles are what scanners, roadmap views and human readers surface, so a drifted title is read as the specification by everyone who does not open the record. This repository had just spent a PR on precisely that cost -- BO-2400d-1's title promised 'Each agent invocation records duration and token counts' while its Gherkin only specified what a record must CONTAIN once written, and a fast-lane coder read the title, concluded a cleanup would regress the promise, and refused to build. The drift, not the code, blocked the work."
