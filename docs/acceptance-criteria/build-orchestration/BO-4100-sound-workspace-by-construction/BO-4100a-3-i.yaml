    relationship: modifies
    status: exists
    relevance: "Canonical source. The decide-before-write ordering and the scoped undo live at the refusal boundary shared by every creation refusal path (unreadable shared line, unsupported kind, post-condition failure)."
  - path: scripts/setup_ticket_worktree.py
