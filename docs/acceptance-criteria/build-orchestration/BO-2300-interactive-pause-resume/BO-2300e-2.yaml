notes: |
  Covers the write/routing half of the defect filed as
  docs/known-issues/ac-driven-dev/open-blocker-ki-acd-20260928-pause-store-dispatched-to-worktree-agent.md.
  templates/workflows-js/plan-feature.js hardcodes
  `const _shellPermittedAgentId = "worktree-agent"` at lines 1599, 1647 and 1831,
  feeding all six pause-store dispatches. worktree-agent's charter is
  create/remove worktrees only, so it declines every one of them, the pause
  record is never written, and an interactive run halts pause_persist_failed at
  its first gate -- every component behaved correctly; the routing was wrong.
  `permits_shell: true` answers "may this agent run a command at all", not "is
  this command within its role" (the same defect class as KI-BO-20260901-1620).

  Fix direction per the known issue: dispatch to command-step-runner
  (BO-2400a-1-i), the package's agent chartered to run exactly one given
  command, once, in one named workspace, and hand back that command's exit
  status, stdout and stderr untouched -- holding no judgement about whether a
  command is wise.

  Out of scope, deliberately: routing to status-checker instead. It declares
  permits_shell: false while ~37 other dispatches in this same workflow already
  send it shell commands; that contradiction is real and tracked separately as
  KI-BO-20260901-1620 -- widening it is not a fix for this defect.

  This AC does NOT by itself fix the read-path parsing defect (a refusal on
  peek-pause-record being indistinguishable from "no record exists") -- that is
  the separate behavior BO-2300e-3. Routing peek-pause-record to a chartered
  agent removes the most common trigger for a refusal, but any future refusal,
  transport failure, or malformed reply on that path must still never be read
  as "no record"; fixing the router does not fix the parser.

  RESOLVED (2026-09-29, business-analyst): the KNOWN CONFLICT WITH BO-2300a-1-ii
  noted above is reconciled via the second option this AC's it_requirements
  named -- BO-2300a-1-ii has been narrowed by the BA (superseded_by: BO-2300e-2,
  criteria unchanged; see that record's own amended_by/notes for the full
  account). BO-2300a-1-ii's routing claim over the six pause-store dispatches is
  superseded by this AC; its claim over resolve-worktree-setup-script-path ->
  worktree-agent is unaffected and remains this AC's stated exclusion. The
  test-update instruction above (update test_bo_2300a_1_ii.py's pause-store
  assertions to command-step-runner while keeping worktree-agent for the
  script-path label, in the same commit) still stands and is now the only
  outstanding action for that conflict.
