criteria: |
  Each proposed part quotes the words of your request it covers.

  You are offered two to five clearly bounded parts, each quoting the words it
  covers from what you asked, naming the parts it waits for and saying whether
  it needs a decision or research. A proposed part that cannot point to your
  words is set aside and shown to you with its reason, never offered for
  approval, and a request that does not divide honestly into two to five parts
  is not forced into a split: you are told so plainly instead.
