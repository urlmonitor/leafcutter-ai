title: "A verdict cannot claim more than the weakest coverage it consumed"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/ac-store/ACS-1100-honest-coverage-answers/ACS-1100d.yaml
criteria: |
  Given a verifier that consumed one answer covering 40 records of 180 and one
    covering 180 of 180, and that found no violation in what it examined,
  When it reports its verdict,
  Then the verdict is stated as clear for 40 of 180 — the weakest coverage figure
    among its inputs — and not as an unqualified all-clear,
  And an unqualified all-clear, meaning a pass verdict that carries no coverage figure
    at all, is available only when EVERY consumed answer reported its covered count
    equal to its total with no declared exclusions, no records the measurement could
    not classify, and no shortfall,
  And an answer that reconciled by DECLARING exclusions does not unlock an unqualified
    all-clear, even though it passed ACS-1100c-2 without a halt: the answer of 148
    covered plus 24 plus 8 declared exclusions against 180 reconciles and is returned,
    and a verdict over it is stated as clear for 148 of 180 carrying those exclusion
    grounds — reconciling and being all-clear-eligible are different things,
  And the same holds at the limit case ACS-1100c-2 admits: an answer of 0 covered with
    all 180 declared excluded with grounds passes reconciliation and does not halt, yet
    a verdict over it is stated as clear for 0 of 180 and can never be an unqualified
    all-clear, because the verifier examined nothing,
  And where any consumed answer reported one or more records the measurement could not
    classify under ACS-1100c-1-i, no unqualified all-clear is available whatever the
    counts reconcile to, and the verdict names that count alongside its coverage figure,
  And where any consumed answer halted under ACS-1100c-1 or under the dropped-coverage
    halt of ACS-1100d-1, the verifier emits no pass verdict at all rather than a pass
    qualified by a coverage figure,
  And a verifier that reports an unqualified all-clear over a consumed answer covering
    40 of 180 does not satisfy this criterion, whatever its own examination found.
