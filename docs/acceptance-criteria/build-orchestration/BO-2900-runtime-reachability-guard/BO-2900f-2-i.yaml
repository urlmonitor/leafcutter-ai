title: "A run that halts leaves later gates with no entry, and the halt itself is recorded so the shortfall is explained"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a work item requests four quality gates — gate A, gate B, gate C and
    gate D, in that order,
    And the run halts after gate B's decision point and before gate C's,
  When the recorded gate results are read,
  Then gate A and gate B each have exactly one entry,
    And gate C and gate D have zero entries, because the run never reached their
      decision points,
    And the recorded results carry a halt entry naming the gate the run stopped
      at and the reason it stopped,
    And a reader of the record can tell, from the record alone, that gate C and
      gate D are unreached rather than silently dropped.

  Given the same four requested gates and a run that halts after gate B,
    And no halt entry is written,
  When the recorded gate results are read,
  Then the missing entries for gate C and gate D are reported as a defect, not
    excused, because zero entries is legitimate only when the halt is itself
    recorded.
