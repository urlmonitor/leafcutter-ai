it_requirements:
  - "FAIL-OPEN LADDER (IT-PO resolution of the open question) — the symbol tier degrades to an advisory skip (no drift verdict, file-path floor still authoritative) on ALL of these signals, each modeled on the check_duplicate_code.py jscpd precedent: (1) resolver binary/index absent from PATH; (2) file language unsupported by the resolver (extension outside the supported set; for the AST default this is any non-.py file); (3) resolver present but version/interface-incompatible; (4) resolution exceeds the configured timeout budget (precedent: jscpd 30s) — terminate the subprocess and skip; (5) resolver non-zero exit or malformed/unparseable output, including ast.parse SyntaxError on a partially-staged file."
  - "The advisory on a skip names the AC id and states the symbol-level check was skipped (to stderr with a [check-ac-traceability] prefix), never altering the exit code on that ground alone."
  - "The file-path floor (GE-111b-1) is INDEPENDENT of the resolver and MUST still run and still block on a vanished file in every fail-open case (criteria scenario 2). The fail-open applies to the SYMBOL tier only, never to the floor."
  - "SCOPE DECISION (IT-PO, the second half of the BA's question): a fail-open skip is a SILENT-TO-STDERR ADVISORY at commit time only. It must NOT enqueue or defer a store-wide rescan from inside the hook — the commit-time gate stays staged-scoped per GE-111c. Cross-commit / store-wide re-resolution of skipped symbols is a SEPARATE surface and is OUT OF SCOPE for GE-111 (recorded as a caveat for a future store-wide scan feature)."
  - "Must follow the project error handling policy (CLAUDE.md Rules 1-4): each fail-open branch catches a SPECIFIC exception type (OSError / FileNotFoundError / subprocess.TimeoutExpired / subprocess.SubprocessError / SyntaxError) and logs at WARNING before degrading — no bare except, no silent swallow without the advisory."
