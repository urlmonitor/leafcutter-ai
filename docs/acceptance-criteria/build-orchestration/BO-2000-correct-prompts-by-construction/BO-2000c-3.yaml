id: BO-2000c-3
components:
  - build_orchestration
title: "The reference file is emitted as a resolved path, not a raw pattern"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an AC whose it_requirements names a reference file via a reference pattern
    that resolves to exactly one existing file,
  When a ticket is generated from that AC,
  Then the Implementation Notes section carries the resolved concrete file path,
  And it does not emit the unresolved glob or pattern string in place of the path.
depends_on:
  - BO-2000c
doc_links:
  - path: scripts/ac_store/_gtfa_files_touched.py
    relationship: modifies
    status: exists
    relevance: "Holds _resolve_reference_patterns, which expands the it_requirements reference_pattern glob to the one concrete path. (Re-pointed 2026-09-22: scripts/ac_store/generate_ticket_from_ac.py is now a re-export shell with one real def; the implementation moved to the _gtfa_* siblings.)"
  - path: scripts/ac_store/_gtfa_body.py
    relationship: modifies
    status: exists
    relevance: "Holds _build_implementation_notes_section, which calls _gtfa_files_touched._resolve_reference_patterns before serialising it_requirements — this is where the resolved path actually reaches the ticket."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "_gtfa_files_touched._resolve_reference_patterns must resolve the AC's reference_pattern to a concrete file path, and _gtfa_body._build_implementation_notes_section must emit that resolved path in Implementation Notes."
  - "Test coverage: given a reference_pattern that resolves to one file, assert the emitted section shows the concrete path and not the raw pattern."
delivers_to:
  agent: workflow-architect
  contract: "A resolved reference-file path in the Implementation Notes section"
expects_from:
  ac_id: BO-2000c-1
  contract: "The Implementation Notes emit path this AC populates"
origin_agent: BrainCandy
created: 2026-07-08
amended_by:
- reason: edit-surface-repoint
  by: it-po
  at: '2026-09-22'
  note: 'doc_links re-pointed off scripts/ac_store/generate_ticket_from_ac.py at
    relationship: modifies. That file is now a 386-line re-export shell carrying exactly
    one real def (_sibling) plus a TYPE_CHECKING block; the implementation lives in 22
    _gtfa_* siblings. Because modifies is an edit-surface relationship, it fed
    files_touched directly — a generated ticket emitted files_touched:
    [scripts/ac_store/generate_ticket_from_ac.py] and nothing else, sending a coder to a
    file of re-export assignments. Worse, files_touched drives the surface the
    phantom-done guards check, so a CORRECT fix touching the real sibling would have
    read as touching an undeclared file. Targets re-derived from the criteria text, not
    the filename: the resolver (_resolve_reference_patterns) is in _gtfa_files_touched.py
    and the Implementation Notes emitter (_build_implementation_notes_section) is in
    _gtfa_body.py, which calls it at _gtfa_body.py:107. criteria untouched.'
- reason: test-contract
  by: it-po
  at: '2026-09-22'
  note: 'Added test_spec. check-ac-schema refuses an approved, not-done, leaf code AC
    with no test contract ("approved code AC must declare a test contract"). The error
    offers "reclassify as non-code" as an escape, which would be a lie here:
    assigned_agent is python-coder and the AC governs real generator behaviour.
    Descriptors derived from the two Then clauses, one test per clause plus a
    real-artifact check through the production CLI. The second clause needs its own test
    because an implementation that emits the resolved path ALONGSIDE the raw pattern
    satisfies clause 1 and fails the AC. criteria untouched.'
- reason: test-spec-correspondence
  by: it-po
  at: '2026-09-23'
  note: 'test_spec corrected to name the tests that actually exist and pass. It was stale
    in two ways, both dating from its authoring on 2026-09-22, before the covering tests
    were reconciled: (1) every descriptor targeted unit_tests/ac_store/, but the covering
    tests live in unit_tests/prompt_assembly/ — that directory does exist, so the wrong
    target read as plausible; (2) none of the four descriptor names matched a real test —
    a grep for all four across unit_tests/ returned nothing. Left alone, the next agent
    reading this literally would have authored four new tests in a second directory,
    duplicating three that already pass. Corrected to the three tests carrying
    "# covers: BO-2000c-3", which match covered_by exactly:
    test_implementation_notes_emission.py::TestReferencePatternResolution::test_ac3_reference_pattern_resolves_to_paths,
    and test_reference_pattern_resolution.py::TestAmbiguousReferencePatternIsAnAuthoringError::test_single_match_pattern_still_resolves
    plus ::TestResolvedPathReachesTicketViaCli::test_resolved_path_reaches_the_ticket_via_the_generator_cli.
    The last was already named correctly and needed only the directory fix. Two descriptors
    were REMOVED rather than renamed, because their behaviour is covered under a
    differently-shaped test rather than a separately-named one:
    test_unresolved_glob_is_absent_from_implementation_notes (the second Then) is asserted
    as an assertNotIn inside all three surviving tests, so the absence it demanded is
    proven three times over, just never as its own def; and
    test_resolution_happens_before_it_requirements_are_serialised (seam) named a call-order
    fact with no test of its own, but its stated risk — resolving after serialisation
    leaves the pattern in the emitted text — is exactly what those same assertNotIn
    assertions catch, since all three read the emitted body or the CLI stdout rather than
    the resolver return value. No descriptor was invented for an untested behaviour: naming
    a test that does not exist is the defect being fixed here. All three named tests were
    run and pass. criteria untouched; work_status, readiness, priority, implemented_by and
    covered_by untouched.'
