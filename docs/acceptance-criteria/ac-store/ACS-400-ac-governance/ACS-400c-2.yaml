it_requirements:
  - "Must follow the fail-open convention per docs/reference/claude-code-hooks.md"
  - "Must compare the amended_by list between the staged version and the HEAD version of the file"
  - "Must detect criteria changes using YAML-level comparison (not raw text diff) to avoid false positives from whitespace or formatting changes"
  - "Must not prescribe the exact format of amended_by entries beyond requiring non-empty new content"
  - "Must handle the case where the file has no prior committed version (new file) -- amended_by check only applies to modifications"
