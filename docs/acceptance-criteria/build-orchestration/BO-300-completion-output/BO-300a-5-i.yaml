it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/workflows-js/build-feature.js
  n_location_rule: "1 -- the epic driver's completion path in build-feature.js; build-ticket.js carries no counterpart, which the sign-off must state explicitly"
