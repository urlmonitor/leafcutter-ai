it_requirements:
  - "Target is concrete: templates/scripts/commit_guardian/check_ac_schema.py — the manual-validation fallback at ~line 623, plus the schema_validated flag introduced by GE-112 (see that file's DECISION HISTORY, ~lines 29-37). The three-state model of GE-120a-1-ii maps onto that EXISTING flag: derive the degraded-but-ran outcome from it rather than introducing a second, parallel indicator."
  - "The document the check must name when it cannot reach it is config/ac_store_schema.json. VERIFIED 2026-08-14: check_ac_schema.py does NOT import the shared templates/scripts/commit_guardian/_resolve_root.py; it carries its own private root walk, which is why the lookup fails from a separate working copy."
  - "SEPARATION OF DELIVERABLES: announcing the degrade is THIS AC; making the document resolvable is GE-120b-3. Neither closes the other. An implementation that makes the path resolve and deletes the announce path fails this AC; an implementation that announces and leaves resolution broken fails GE-120b-3."
  - "A change confined to this one file has met the letter of the AC and missed its point. This is the SECOND defect in this file in this area (GE-112 was the first, on the same fallback). Satisfy it through the shared vocabulary of GE-120a-1-ii, and flag at review any implementation that would not also have prevented the neighbouring instances."
  - "The non-authoritative label must be on the CLOSING line and must appear even when the reduced validation reports nothing at all — an empty-findings degraded run is indistinguishable from a real pass without it."
  - "EVIDENCE DISCIPLINE: do NOT assert or cite the unverified 26-files figure anywhere in the implementation, its output, or its tests. Producing a measured number is GE-120c-4's job; until it runs, the figure carries the label REPORTED BY A PARALLEL SESSION, NOT VERIFIED."
  - "ADR-001 deployed/template parity: edit templates/scripts/commit_guardian/ then run 'python scripts/build.py --target-dir .' so scripts/commit_guardian/ and .leafcutter/scripts/commit_guardian/ match (check_hook_parity enforces all four locations). Any new shared module the check imports must be added to deploy_map in scripts/build_phases.py."
  - "Error-handling policy: the unreachable-schema path catches a specific exception (OSError / FileNotFoundError / json decode error), logs at WARNING, and returns the degraded-but-ran outcome. No bare except, no silent swallow."
test_spec:
  - name: test_ge120a3_unreachable_schema_document_named_in_output
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Check executed from a working copy where config/ac_store_schema.json is genuinely unresolvable: the output states authoritative validation did not happen and names the document."
  - name: test_ge120a3_reduced_clean_finding_labelled_not_authoritative
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "A clean finding from the reduced manual field validation is labelled as reduced and not authoritative."
  - name: test_ge120a3_reduced_and_authoritative_result_values_differ
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Identical staged files: the result value of the reduced run differs from the value of a run that loaded and satisfied the authoritative schema."
  - name: test_ge120a3_label_present_when_reduced_validation_reports_nothing
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "A reduced run with zero findings still carries the non-authoritative label on its closing line."
  - name: test_ge120a3_file_authoritative_validation_rejects_never_clean_unlabelled
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "A staged AC file the authoritative schema rejects is never reported clean without the non-authoritative label."
test_rationale: "The criteria's coverage note rules out both weaker shapes explicitly: a source-text assertion that the fallback branch exists passes on dead code, and making the schema unreachable by monkey-patching an import inside the same process exercises a different failure from the observed path-resolution failure. Coverage therefore requires the GE-120c-1 harness running the deployed check from a second working copy where the document is genuinely unreachable."
