superseded_by: null
covered_by: []
implemented_by: []
notes: |
  Satisfies the component-diagram entry in BO-3100a's documentation_triggers.

  The second scenario is the one that keeps this from being decoration: the diagram is
  checked against the reconciliation's actual inputs, so a declaration added later without
  updating the diagram is a discrepancy rather than an omission nobody can see. This is the
  same discipline BO-3100d applies to the written topology record.

  Sequence after BO-3100a-1, since the diagram describes a reconciliation that must exist
  before it can be drawn accurately.

  IT-PO ENRICHMENT NOTE (2026-08-26). The coherence check needs the reconciliation to EXPOSE
  its input set as data. That is a real obligation on BO-3100a-1 and is written into this AC's
  expects_from rather than left implicit, because a coherence test that has to grep the
  reconciliation's source to learn what it reads is the grep-on-dead-code shape this tree
  rejects, and would pass on an input that is declared but never read.
