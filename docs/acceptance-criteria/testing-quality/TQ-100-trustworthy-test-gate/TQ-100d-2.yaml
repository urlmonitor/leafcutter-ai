it_requirements:
  - "Must be a Mermaid stateDiagram (repo convention; subject to check-mermaid-* commit hooks for drift/complexity/naming/parent-link) — author it to pass those hooks."
  - "Must cover the full anti-rot lifecycle: tracked/valid -> (expiry passes) expired-flagged; tracked/valid -> (named test starts passing) now-passing-flagged; and the rejected/invalid state for an entry missing ticket_ref or expiry."
  - "Transition triggers must name the actual mechanism: expiry date passing, the named test starting to pass, and a required field being absent."
  - "Place the diagram where a fresh consumer install can reach it if it is a deliverable doc (ADR-001) — under docs/, not a build-output-only path."
