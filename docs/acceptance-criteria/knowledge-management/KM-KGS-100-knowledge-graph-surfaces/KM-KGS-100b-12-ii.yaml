title: "A build refreshes the registry-derived surfaces as a final build step"
component: knowledge-management
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100b.yaml"
criteria: |
  Given a build runs and can regenerate registry-derived sources (for example the
    surfaces produced or updated during the build)
  When the build reaches its final step
  Then a refresh runs that updates the index for the registry-derived surfaces to
    reflect the just-built sources
  And after the build completes, an index-backed read of those surfaces finds them
    fresh (no read-time rebuild needed) and returns data matching the built sources
depends_on:
  - KM-KGS-100b-12
doc_links:
