    relationship: verifies
    status: exists
  - path: tests/README.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
test_required: true
test_spec:
  - name: test_run_audit_includes_noncompliant_omits_compliant
    target_dir: tests/
    framework: pytest
    type: unit
    description: "run_audit findings include every non-compliant (portable, missing-from-template) item and omit compliant items; total_missing counts only action=='move' items."
  - name: test_classify_item_returns_expected_category
    target_dir: tests/
    framework: pytest
    type: unit
    description: "_classify_item returns the expected category from items_map (portable / project-specific / unknown)."
  - name: test_suggest_action_matches_classification
    target_dir: tests/
    framework: pytest
    type: unit
    description: "_suggest_action returns 'move' / 'mark-boundary' / 'none' matching classification + in_template."
  - name: test_format_markdown_lists_findings_and_empty_report
    target_dir: tests/
    framework: pytest
    type: unit
    description: "format_markdown lists each finding with its category and action, and an empty AuditReport renders the explicit 'No package gap detected' no-issues line."
it_requirements:
  - "Author fresh unit tests in tests/test_package_audit.py (new file). Write from scratch and verify run-to-green before sign-off."
  - "Functions under test (scripts/package_audit.py): run_audit(project_root, package_root, boundary_config_path), _classify_item(filename, items_map), _suggest_action(classification, in_template), format_markdown(audit). Import by bare module name after adding scripts/ to sys.path."
  - "Build a tmp_path fixture with live/template directory pairs plus a package_boundary.json describing sections and items; run_audit is filesystem-driven and reads that config. Do not assert against the live package."
  - "No production change is expected for this AC — this is coverage recovery over existing behavior."
