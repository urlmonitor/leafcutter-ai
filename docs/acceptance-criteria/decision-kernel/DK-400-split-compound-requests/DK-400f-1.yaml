id: DK-400f-1
title: "One view shows every part's outcome with a link to its answer"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the split-bounds split while p1 is decided, p2 is pending and p3 was left out,
  When the person looks at the split's progress,
  Then p1 shows decided, with a link to its decision record,
  And p2 shows pending (waiting), with its reworded text and its proposed text beside it,
  And p3 shows not run, left out at the split,
  And for the reuse-threshold research split, each answered part shows answered, with a link to its
    research findings.
depends_on:
  - DK-400f
  - DK-400e-1
