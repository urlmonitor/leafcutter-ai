id: GE-126e-3
title: "A new check joins the census by being registered rather than by being remembered"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the set of checks the census examines is derived from the same registration data the
    rest of the check family already maintains rather than from a list the census keeps,
  When a fixture check is registered by following the documented procedure and the census is
    run again with no census-side edit of any kind,
  Then the new check appears in the census's examined count and receives a classification,
  And when that check is removed from the registration data and the census is run again it
    disappears from the examined count rather than being reported as unexecutable,
  And a check named in the registration data whose script the census cannot locate is reported
    as attempted and unexecutable and named rather than being dropped from the count,
  And no check is examined that the registration data does not name so the examined count and
    the registered set describe the same population,
  And the census reports the registration source it derived its set from so a reader can tell
    which population the measurement covers.

  Coverage note: covered by registering and deregistering a fixture check around census runs
  and asserting the examined set changes accordingly with no edit to the census. Asserting only
  that the census examines many checks does not cover this criterion; a hardcoded list also
  examines many checks and silently omits every check added after it was written.
