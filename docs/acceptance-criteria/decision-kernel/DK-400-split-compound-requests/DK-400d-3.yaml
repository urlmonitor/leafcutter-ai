assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: 'Rejected split: gate_answer ''rejected'' with gate_by, gate_at and gate_note verbatim; every part review
    ''rejected'' and outcome ''not_run''; no part work item. Ending keyed deterministically on trigger and found_at:
    jev_none -> state ''rejected'', run status ''blocked'', capability_gap_recorded true and today''s unsupported
    gap observation stored; ambiguous -> state ''rejected_clarify'', today''s clarification question opened, run
    status ''waiting_human'', capability_gap_recorded false while it is open (true, with today''s ambiguous gap
    and run ''blocked'', only if the request ends unresolved); bundled_accepted or found_at mid_run -> state ''rejected_kept_whole'',
    the subject resumes from kept_routing as one decision or research step, whole_decision_id set once that decision''s
    record is staged (null for a research step). Consumed by DK-400f-3 (report lines) and DK-400d-3-i, -ii, -iii.'
expects_from:
  ac_id: DK-400d-1
  contract: "The gate answer path, here with the answer rejected."
it_requirements:
  - 'A rejection arrives as leafcutter.split_answer.v1 with answer rejected and an empty parts list (ADR-067 §4.4,
    confirming Open Question 6b); the kernel records it atomically: gate_answer rejected, gate_by, gate_at, the
    note word for word, every part review rejected and outcome not_run, and no part work item ever created.'
  - 'The ending is chosen deterministically from the split record (trigger, found_at), never by a model: jev_none
    -> state rejected and run blocked (DK-400d-3-i); ambiguous -> state rejected_clarify and today''s insufficient_context
    path, unchanged: with routing.on_insufficient_context ''human'' today''s clarification question is opened (the
    same template and choices as today) and the run is waiting_human; follow-ups count against intent.max_clarifications;
    today''s ambiguous gap is recorded only if the request ends unresolved (the person cannot be asked, or the follow-up
    limit is reached), and only then does the run end blocked (DK-400d-3-i); bundled_accepted or mid_run -> state
    rejected_kept_whole and the subject resumes as one (DK-400d-3-ii, DK-400d-3-iii).'
  - A rejection is never inferred from another answer (DK-400d-2-i).
  - 'A request that falls back to the clarification question after a rejected or too-small ambiguous split is never
    offered a split again in the same run: the item keeps its Decomposition (rejected_clarify) and its split_checked
    flag (DK-400c-3), so the bundle check is skipped for it even after the person''s answer changes its effective
    goal, and it routes normally from there.'
  - 'Tests enable splitting explicitly: split.enabled true through a config override (false only where a test compares
    with the off switch). None relies on the shipped default, which stays false until E3 merges (dec-9925ebf1895222f4,
    see DK-400a-1). A test asserting that no split starts must run with splitting on, or it passes for the wrong
    reason.'
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_rejection_runs_no_part_and_keeps_answer
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: Rejecting at a pinned 2026-10-05T09:14:26Z records gate_answer rejected by human:user at that time
      with the note word for word, every part rejected and not run, and no part work item.
  - name: test_rejection_ending_keyed_on_trigger
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: 'Parametrised over jev_none, ambiguous, bundled_accepted and mid_run: the rejection ends in state
      rejected with the run blocked for jev_none, rejected_clarify with the run waiting_human on today''s clarification
      question for ambiguous, and rejected_kept_whole for bundled_accepted and mid_run.'
test_rationale: One rule fans out to three rejection endings (rejected, rejected_clarify, rejected_kept_whole);
  the parametrised test pins the mapping, the criterion test pins what is recorded.
