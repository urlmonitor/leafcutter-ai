id: BO-2400f-7-v
components:
  - build_orchestration
title: "The command-step-runner stays with a long-running command until it ends, and never replies while a command it started is still running"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the command-step-runner is asked to run one command in a named workspace with a
    time budget of 600 seconds,
  And the command takes 270 seconds to end on the host (the duration measured for a
    store-wide fast-lane command on 2026-09-30, once it was given 600 seconds),
  When the command-step-runner performs the request,
  Then it replies only after the command has ended, with the command's exit status, its
    standard output and its standard error (the result reply of BO-2400a-1-i),
  And the shell's 120-second default limit neither stops the command nor ends the wait.

  Given the shell moves the command to the background before it ends,
  When the command-step-runner continues,
  Then it waits on that background command until it ends, and then replies with that
    command's exit status and output,
  And it does not end its turn while that command is still running, because ending its
    turn stops the command part-way.

  Given the command is still running when the full 600-second budget has elapsed,
  When the command-step-runner replies,
  Then the reply says the command had not finished, names the command, the workspace and
    the number of seconds it waited, and says that what the command changed is unknown,
  And that reply carries no exit status and does not say declined, so the run can tell it
    apart from a result and from a decline.

  Given a request that states no time budget,
  When the command-step-runner runs the command,
  Then it waits up to 600 seconds, not the shell's 120-second default.
