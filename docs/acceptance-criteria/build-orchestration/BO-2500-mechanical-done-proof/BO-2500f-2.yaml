    angle: deployed
    description: "scripts/ac_store/_enforces_tags.py is in build_ac_store's deploy_map and imports in a fresh subprocess restricted to the deployed .leafcutter/scripts/ac_store directory."
    proves_clause: "the verification holds only if the named check exists and carries a tag \"# enforces: <id>\" naming this record's id, and the check is wired as BO-2500f-2-i requires"
    code_file: scripts/ac_store/_enforces_tags.py
    to_be_created: true
    convention_test_file: unit_tests/commit_guardian/test_bp_1100g_3_deployed.py
