it_requirements: |
  The distinguishing rule: no-op ONLY when the MAIN tree has no config; a
  main-has-config-but-worktree-inert state is ALWAYS a hard fail, never a no-op
  (fail closed per BO-1700b-1). This is precisely the production silent-skip bug
  (fresh worktree, absent .leafcutter symlink, pre-commit running zero hooks under
  PRE_COMMIT_ALLOW_NO_CONFIG=1). Implemented in the shared probe helper (BO-1700a-1)
  over the main-tree determination (BO-1700f-1-ii); ADR-001 deployed/template parity
  applies.
