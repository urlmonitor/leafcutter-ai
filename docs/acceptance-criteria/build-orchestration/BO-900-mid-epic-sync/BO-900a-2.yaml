title: "User prompt with merge-or-continue choice when threshold exceeded"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the sync-checkpoint has been triggered
    because the worktree is 25 commits ahead of origin/main
    and the threshold is 20,
  When the build-epic workflow presents the sync prompt to the user,
  Then the prompt message includes:
    - the exact commit count ahead (25),
    - the threshold value (20),
    - a warning that continuing without merging increases merge-conflict risk,
  And the prompt offers exactly two choices:
    - "Merge origin/main into the worktree now" (the recommended default),
    - "Continue without merging",
  And the workflow pauses until the user responds,
  And if the user chooses to continue without merging,
    the workflow resumes with the next batch without any merge operation.
