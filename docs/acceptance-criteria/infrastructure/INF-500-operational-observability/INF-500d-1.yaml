notes: |
  BOUNDARY vs INF-100c-3 (readiness: approved, work_status: done). INF-100c-3
  enumerated the phase agents that existed on the day it was written. It is a
  correct historical snapshot and it is genuinely done. Do NOT amend it, do NOT
  re-open it, and do NOT satisfy this AC by hand-adding the four named agents to
  the permitted-writer lists — that repeats the snapshot and goes stale again, as
  the DECISION HISTORY in feedback_categories.yaml records happening on 2026-06-03,
  2026-06-08 and 2026-07-17. The requirement here is STRUCTURAL: the permitted set
  is derived from the live roster, so the four names are a symptom used as test
  evidence, not the deliverable.

  The four names are the observable evidence available on 2026-08-13; a test should
  assert the derivation property, not freeze this particular quartet.

  THE PREDICATE IS ROSTER MEMBERSHIP AND NOTHING NARROWER. An earlier draft of this
  AC said "the live agent roster" while INF-500d-2 said "agents the roster marks as
  a ticket-phase agent". Those are different predicates and the narrower one is
  wrong. Measured on the roster on 2026-08-13: epic-supervisor and ticket-supervisor
  both carry is_ticket_phase: false, yet both are permitted writers TODAY of
  tooling-issue, convention-ambiguity and blocker. Deriving on is_ticket_phase would
  add the four missing agents while silently revoking those two across three
  categories each — six working writer permissions destroyed — which directly
  violates INF-100c-3's it_requirement "Must not remove any existing allowed_writers
  entries". The second scenario above exists solely to make that revocation a test
  failure rather than a review-time judgement call.

  DEPRECATED ROSTER ENTRIES — decide, do not assume. epic-supervisor is marked
  deprecated: true in the roster (ADR-006). A predicate of "any NON-DEPRECATED roster
  id" would still revoke it and still break the no-revocation scenario. The scenario
  is written to be the binding constraint: whatever predicate is chosen, an identity
  that could write a category yesterday must still be able to write it tomorrow.
  Retiring a deprecated writer is a separate, deliberate decision for its own AC.

  SCOPE — GENERAL-PURPOSE CATEGORIES ONLY. Derivation applies to the general-purpose
  categories. The three deliberately restricted categories keep explicit, literally
  enumerated writer lists; see INF-500d-1-i for why derivation cannot express them.

  THE NON-AGENT WRITER. The guard-only category's sole permitted writer is a literal
  identity string that is not an agent id and does not appear in the roster at all.
  Roster derivation must not be applied to it, or the commit-time guards lose their
  only writer. The fourth scenario pins this.

  OBSERVED BYPASS, RECORDED NOT SPECIFIED. On 2026-08-13 the submission path performs
  writer validation only when the submission declares itself agent-sourced; a
  submission that declares a non-agent source skips writer validation entirely
  regardless of the phase it names. That is why the scenarios above are scoped to
  agent-source submissions — an unscoped "for any category, from any source" claim
  would be false as written. Whether the non-agent source should also be validated is
  a distinct defect and is deliberately NOT specified here.

  PREREQUISITE FOR THE IT PO — THE ROSTER IS NOT DEPLOYED. On 2026-08-13 the build's
  feedback deploy step ships feedback_categories.yaml to a consumer project's config/
  directory but does NOT ship agent_registry.json; the deployed config directory
  observed in this workspace contains only feedback_categories.yaml and the guard
  config. A submission path that reads the roster at submission time is therefore
  unbuildable in a consumer install until the roster is added to the deploy manifest.
  Treat "the roster is present and readable in a consumer install" as a prerequisite
  of this AC and size it accordingly. Do not treat it as licence to edit the build
  phase from inside this AC's ticket without an accompanying AC.
