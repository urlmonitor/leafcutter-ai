id: BO-4300b-4-i
title: "A project that commits its hook settings as a link into its own install still gets a ready workspace"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: critical
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a project "shop" that keeps its hook settings file in its version
    history as a link, written relative to the file's own folder, to an
    ordinary file inside shop's own install folder,
  When a workspace for the work "alpha" is requested on a machine where links
    are permitted,
  Then the workspace is answered ready,
  And the hook settings file in the workspace is the link exactly as shop
    committed it, so the work starts from an unchanged tree,
  And the protections declared through that link are shown to reject a
    known-bad commit,
  And a committed link that leads out of the workspace is refused as not
    ready, naming the install and protection paths,
  And a committed link written as an absolute location is refused the same way,
    even when it names a file inside the workspace,
  And a link the install build itself leaves behind, which shop never
    committed, is still refused exactly as before.
