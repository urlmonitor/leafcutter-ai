notes: |
  RETROFIT. Authored 2026-10-08, after the fact, for behaviour shipped without
  an AC by PR #1013 (merge 2d895308, 2026-10-05). Nothing here needs building:
  the code is on origin/main. The criteria were written to match what the
  existing tests actually assert, so covered_by reflects real coverage.

  DONE ON 2026-10-08, AS A RETROFIT. The three covering tests now carry
  "# covers: BP-100k-3-iv" tags, and done_proof.verify_done_eligible returned
  eligible: true for this id. This record was written AFTER the behaviour
  shipped (PR #1013), so its tests describe the code rather than having
  constrained it; there was no red baseline. The declared-key test was also
  tightened the same day: key and ground must now share one line, and the key
  must NOT also appear under UNCOMPARABLE: EXEMPT.

  WHAT THIS RECORD DELIBERATELY DOES NOT PIN: the uncomparable column. Today
  a drift-exempt recorded key is added to the uncomparable count (and therefore
  to the derived exempt field) while still counted in verified. That
  contradicts the ScanResult docstring and arguably conflicts with BP-100k-3's
  last clause ("could not compare" and "compared and matched" must be
  distinguishable). The obvious alternative follows the precedent of the
  unreadable column added in adversarial-review finding B-2: a separate drift_exempt
  field and its own RESULT column. The criteria above name only what the tests
  assert (verified, exempt, drifted, gaps, missing, exit status) and say nothing
  about uncomparable, so they do not lock in either choice.
  CAVEAT: if the ADR picks the separate column and the exempt field stops counting
  these keys, the exempt=1 / exempt=2 clauses here and their tests must be
  amended in the same change. That cost belongs with the decision. It does not
  argue for leaving the decision open.
