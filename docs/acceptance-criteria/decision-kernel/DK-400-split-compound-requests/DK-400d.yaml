criteria: |
  Approve, reword, trim or reject the split before any part runs.

  You see your request as you submitted it beside every proposed part, and you
  can approve the split as shown, reword a part, leave parts out or reject it;
  only a person can give that answer, and who gave it and when is kept with the
  split. A reworded part keeps the original proposal beside it and a left-out
  part never runs. If you reject the split of a request that could have been
  taken on as one question, it goes ahead as one decision, exactly as today; if
  you reject the split of a request that would have been turned away, the work
  ends with a plain note that nothing was decided and a hint to ask again as
  one question.
