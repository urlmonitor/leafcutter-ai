id: UXP-614
components:
  - ux_prototyping
readiness: draft
priority: medium
title: "The design's criterion mapping is reviewable as data, not only as markup"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given a rendered mockup carrying element pins for UXP-100d-2 and UXP-100d-3
  When its *.mockup.json record is written
  Then the record carries a per-criterion element mapping naming each criterion
    the screen shows and where in the rendering it is shown
  And a reviewer can read which criteria the design claims without opening the
    rendered HTML file

  Given a *.mockup.json record whose mapping and whose rendered markup name the
    same set of criteria
  When the record is checked against its rendering
  Then the two agree and no finding is produced

  Given a criterion listed in the record's mapping with no matching pin in the
    rendered markup, or a pin in the markup absent from the record's mapping
  When the record is checked against its rendering
  Then the disagreement is reported, naming the screen, the criterion, and
    which of the two sides is missing it
  And it is not resolved by silently preferring the record or the markup

  Given a screen registered with `renders: null`, or a screen whose design
    shows no criterion yet
  When its record is written
  Then the mapping is empty
  And an empty mapping is recorded as "this design pins nothing", never as a
    missing or invalid record
