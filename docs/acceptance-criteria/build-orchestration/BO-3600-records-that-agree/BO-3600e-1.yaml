notes: |
  THE OBVIOUS PLACE TO HANG THIS CHECK IS THE WRONG ONE. A change-scoped reconciler
  would have found none of the eight records behind this goal, and this repo has the
  failure on record twice: the AC hooks that read only the commit index and so never
  see a parent they were written to check, and the population-versus-change scoping
  filed as KI-CG-001.

  THE COUNTS ARE THE LOAD-BEARING CLAUSE. A change-scoped reconciler and a
  whole-store one produce identical output on a clean store — both say nothing —
  so without the examined counts this criterion cannot be falsified by an
  implementation that quietly kept the narrow scope. The fourth scenario makes the
  count track reality rather than being a constant printed once.

  VERIFY BY EXECUTION over a real store with a real standing pair, not a fixture
  assembled to match the check.
