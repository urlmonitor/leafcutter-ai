it_requirements:
- "The coverage requirement used by a comparison is the one in the frozen set's policy.json, verified against its sha256 in set.lock.json (KM-500a-4-v). A requirement read only from a report body, with no matching frozen hash, counts as absent."
- "python -m knowledge compare accepts the frozen set identity as an optional input; compare with no frozen requirement gives limited with the exact reason 'no frozen coverage requirement', whatever the pack's coverage block says. Without that input the existing gates behaviour is otherwise unchanged."
- "Each evaluation report (knowledge/evaluation.py and the kernel-path runner) records the coverage-requirement hash it was measured under. _compatibility in knowledge/evaluation_comparison.py treats a different hash between baseline and proposal as invalidated, naming the coverage requirement as changed since the baseline, alongside the existing review_fingerprint, source_sha and answer_semantics_version checks."
- "No promotion verdict (eligible or limited-as-promotion) is emitted while the requirement differs; the outcome stays invalidated until a baseline is measured under the newly frozen requirement."
- "Cases with no category label or no target family count toward no category and no family, and the result states the unlabelled count. They are never assigned a default category."
- "Adding the report field must not change any existing verdict, denominator or review_fingerprint semantics of python -m knowledge evaluate for packs that carry no frozen set (the KM-500a-4-i regression clause)."
test_required: true
test_intent:
- clause: "the comparison outcome is limited with the reason \"no frozen coverage requirement\", whatever the pack declares about itself"
  needs_test: true
  reason: The absent-requirement path must be shown to ignore a self-declared pack claim.
- clause: "the comparison outcome is invalidated, naming the coverage requirement as changed since the baseline"
  needs_test: true
  reason: Lowering the requirement to pass is the bypass this record closes, and only a comparison test shows it is caught.
- clause: "no promotion verdict is given until the requirement is fixed again and the baseline is measured under it"
  needs_test: true
  reason: A promotion verdict leaking through an invalidated comparison would defeat the invalidation.
- clause: "those 7 cases count toward no category and no family, and the result states the count of unlabelled cases"
  needs_test: true
  reason: Defaulting unlabelled cases into a category would inflate coverage silently.
test_spec:
- name: test_no_frozen_requirement_gives_limited_whatever_the_pack_declares
  target_dir: tests/knowledge/
  framework: pytest
  type: unit
  angle: discrimination
  description: Compare two reports on a pack with no frozen coverage requirement, with other gates passing and the pack coverage block declaring representative true and carrying its own coverage_requirement body; promotion is limited with the exact reason "no frozen coverage requirement". A requirement present only in a report body with no matching frozen hash counts as absent.
  proves_clause: the comparison outcome is limited with the reason "no frozen coverage requirement", whatever the pack declares about itself
  code_file: knowledge/evaluation_comparison.py
  convention_test_file: tests/knowledge/test_query_answer_contract_acceptance.py
  must_catch:
    - a requirement read from the report body with no frozen hash treated as present
    - a self-declared pack claim turning the absent-requirement case eligible
- name: test_lowered_requirement_invalidates_the_comparison_naming_the_change
  target_dir: tests/knowledge/
  framework: pytest
  type: unit
  angle: discrimination
  description: A baseline measured under a requirement of 15 for one_suitable_query and a proposal measured under 5 on an unchanged case file; compare_reports returns status invalidated with a reason naming the coverage requirement as changed since the baseline, alongside the existing review_fingerprint and source_sha checks.
  proves_clause: the comparison outcome is invalidated, naming the coverage requirement as changed since the baseline
  code_file: knowledge/evaluation_comparison.py
  convention_test_file: tests/knowledge/test_query_answer_contract_acceptance.py
  must_catch:
    - lowering the requirement to 5 passing a comparison that failed at 15
    - the compatibility check ignoring the coverage requirement hash
- name: test_invalidated_comparison_leaks_no_promotion_verdict
  target_dir: tests/knowledge/
  framework: pytest
  type: unit
  angle: discrimination
  description: In the invalidated comparison above the output has promotion blocked, neither eligible nor limited-as-promotion, and stays invalidated until a baseline is re-measured under the new hash, after which a comparison under equal hashes can reach a verdict.
  proves_clause: no promotion verdict is given until the requirement is fixed again and the baseline is measured under it
  code_file: knowledge/evaluation_comparison.py
  convention_test_file: tests/knowledge/test_query_answer_contract_acceptance.py
  must_catch:
    - a promotion verdict of eligible leaking through an invalidated comparison
- name: test_evaluate_report_records_the_coverage_requirement_hash
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Run knowledge.evaluation.evaluate over a version-2 pack with a frozen set identity through the in-process storage double and assert the report carries the coverage-requirement hash; for a pack with no frozen set the verdicts, denominators and review_fingerprint are unchanged from the same pack evaluated before the field existed.
  proves_clause: the comparison outcome is invalidated, naming the coverage requirement as changed since the baseline
  code_file: knowledge/evaluation.py
  convention_test_file: tests/knowledge/test_query_answer_contract_acceptance.py
  must_catch:
    - the new report field changing review_fingerprint for packs without a frozen set
- name: test_seven_unlabelled_cases_count_toward_no_category_or_family
  target_dir: tests/knowledge/
  framework: pytest
  type: unit
  angle: discrimination
  description: A case set with 7 cases missing a category label or a target family; the representativeness result counts those 7 toward no category and no family, states unlabelled 7, and the category counts equal those of the same set with the 7 rows removed.
  proves_clause: those 7 cases count toward no category and no family, and the result states the count of unlabelled cases
  code_file: knowledge/evaluation_comparison.py
  convention_test_file: tests/knowledge/test_query_answer_contract_acceptance.py
  must_catch:
    - unlabelled cases defaulted into a category inflating coverage
    - the unlabelled count not stated
- name: test_compare_command_with_frozen_set_input_and_without_it
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Run python -m knowledge compare as a subprocess with no frozen set input and assert the limited outcome with the reason "no frozen coverage requirement"; then with a frozen set input whose policy hash differs from the lock and assert it is treated as absent. Without the new input the existing gates behaviour is unchanged.
  proves_clause: the comparison outcome is limited with the reason "no frozen coverage requirement", whatever the pack declares about itself
  code_file: knowledge/__main__.py
