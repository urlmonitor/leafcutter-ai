criteria: |
  Given the project's vocabulary declares, for certain kinds of picture, a further
    fact the document must carry which nothing in the request determines,
  When a document of such a kind is requested without that fact,
  Then nothing is written, and the refusal names the kind, names the fact that
    kind obliges, and says what sort of value it takes,
  And the fact is never written with a stand-in: not an example, not an empty
    entry, not a value copied from another document, and not a value guessed from
    the component or the title,
  And given the same request supplying that fact,
  When the document is produced,
  Then it carries the supplied value, and the produced document passes the
    project's full set of commit-time checks unmodified,
  And which kinds oblige which facts is read from the project's declaration at the
    moment of the request, so a kind that stops obliging a fact stops being
    refused for it, and a kind that starts obliging one starts being refused
    without anything else changing.
