criteria: |
  Given the canonical commit-guardian template tree
    `templates/scripts/commit_guardian/check_exception_handling.py` — the copy
    that build.py / build_phases.py / build_precommit.py read from first and
    deploy into consumer projects,
  And a staged Python file that is a test file — its path contains a `tests` or
    `unit_tests` component, OR its basename matches `test_*.py`, `*_test.py`, or
    `conftest.py`,
  When the canonical hook runs,
  Then the file is skipped without AST analysis (the same GE-109a exemption),
  And no E722, BLE001, or IO-001 violation is emitted for that file,
  And the hook exit code is not raised to 1 on account of that file's contents,
  And a non-test production `.py` file with the same violations is still
    blocked (exit 1), so the exemption never widens to production code.
