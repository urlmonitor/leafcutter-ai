it_requirements:
  - "Every one of the six pause-store dispatch construction sites in templates/workflows-js/plan-feature.js must pass a non-empty workspace value; there is no call site that omits it. The value is the module-level `authoringWorktreePath`, which the workflow guarantees is non-null and non-empty before Stage 0 begins (see BO-2300e-2's it_requirements) -- it must be threaded into peekPausedGateId()/resolveGate()/pauseAtGate() as an explicit function parameter, never read via closure over the module-level variable, because closure would break under unit_tests/workflows/test_acd_2100c_1.py's standalone-driver extraction of resolveGate()/pauseAtGate() (a separate, pre-existing regression risk BO-2300e-2 already names in detail)."
  - "TEST STRATEGY: via unit_tests/_workflow_engine_harness.py run_workflow_under_e2(plan-feature.js), inspect the prompt/args of every one of the six captured pause-store agent_calls and assert a non-empty workspace value is present in each. Do not grep the source for a workspace literal."
  - "FILE-SIZE RATCHET: this AC's criteria are satisfied by the same parameter-threading edit introduced under BO-2300e-2 (see that AC's it_requirements for the net-zero-content-lines constraint under KI-CG-20260923); this AC contributes no additional lines of its own to plan-feature.js beyond BO-2300e-2's threaded parameter -- only additional test coverage of the existing threaded value."
  - "REACHABILITY (BO-2900a-3): proven via the same real-engine invocation as BO-2300e-2 -- run_workflow_under_e2(plan-feature.js) -- inspecting the captured six agent_calls' actual prompt/args as produced by a real run of the workflow, not a fixture copy of the six call sites' argument-construction logic."
test_spec:
  - name: test_every_pause_store_call_site_supplies_a_workspace
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Via the harness, all six captured pause-store agent_calls (peek/read/clear/clear-verify/persist/persist-verify) carry a non-empty target-workspace value; none is missing or blank."
test_rationale: >-
  This is the boundary condition of BO-2300e-2's main behavior: command-step-runner's
  charter declines a workspace-less request, so the fix is only complete if none
  of the six sites can ever produce one. Asserted from the harness's captured
  dispatch arguments, not from source inspection.
