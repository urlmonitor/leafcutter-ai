id: GE-126d-1
title: "A check registered on every documented leg but missing from the autofix roster is named"
component: guardrail-engine
components:
  - commit_guardian
  - skills_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a fixture check registered by following the documented procedure to its end — its
    script present its entry added to the manifest its configuration key added and its row
    added to the documentation index — and absent from the roster the autofix loop reads
    and carrying no record of a deliberate exclusion,
  When the registration parity check runs,
  Then it names that fixture check and names the roster it is missing from and states the
    route by which an author records a deliberate exclusion,
  And it reports this as a warning: the parity check's outcome is unchanged from the
    outcome it produces on a clean registration set so no commit is blocked by the
    omission,
  And in the same run every check already on the roster is left unmentioned so the report
    is a finding about one check rather than a line printed for all of them,
  And when the fixture check is added to the roster and the parity check is run again on
    an otherwise identical tree it names nothing.

  Coverage note: covered only by running the parity check out of process over a fixture
  registration set and asserting both halves — the fixture named and the already-registered
  checks not named. Asserting only that a warning appeared does not cover this criterion; a
  parity check that warns about everything produces the same output and finds nothing. The
  already-registered checks are the regression boundary and their silence is an assertion.
