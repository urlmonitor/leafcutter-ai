id: GE-125d-1-ii
components:
  - security_scanner
  - commit_guardian
title: "The number announced counts only what the location-based reduction withheld, not what any other mechanism removed"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a throwaway git repository whose staged set is three files:
    "docs/retrospectives/2026-08-19-incident.md", under a location to which the
    location-based reduction applies and carrying 2 opaque credential-shaped
    values that the reduction withholds;
    "src/config_loader.py", outside every reduced location, carrying 1
    credential-shaped value that a ".security-allowlist" entry suppresses;
    and "src/app.py", outside every reduced location, carrying 1
    credential-shaped value that nothing suppresses,
  When the staged set is checked on the path a real commit takes,
  Then the notice states that 2 findings were withheld, names only
    "docs/retrospectives/2026-08-19-incident.md", and attributes both to the
    location-based reduction,
  And the allowlist-suppressed finding is counted in no part of the notice,
  Because at least three separate mechanisms remove a finding from a run of this
    check — an allowlist entry written by an author, the location-based
    reduction this goal is about, and any per-finding narrowing a sibling
    introduces — and a number that silently pools them cannot be reviewed by
    anyone, which is the only reason the number is printed at all.

  Given the same staged set,
  When the staged set is checked on the path a real commit takes,
  Then the reduction is attributed by a stable name drawn from a fixed
    vocabulary, identical between two runs over the same input, rather than by a
    sentence composed per finding or by any rendering of the value,
  Because two runs whose notices cannot be compared do not show anyone that the
    reduced set has widened, and showing that is the standing purpose of this
    L1.

  Given a staged set in which one file under a reduced location carries a
    credential-shaped value that BOTH the location-based reduction and a
    ".security-allowlist" entry would remove,
  When the staged set is checked on the path a real commit takes,
  Then that finding is counted at most once in the notice, and the notice does
    not report a total larger than the number of findings actually removed,
  Because a count that double-reports one finding under two mechanisms is
    unreviewable in the other direction — it makes the protection gap look
    larger than it is, and a number that cannot be trusted upward stops being
    read.
