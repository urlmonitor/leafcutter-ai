notes: |
  WHY THIS AC EXISTS. The parent L1 carries documentation_triggers:
  [reference-doc], so a documentation AC is required alongside the behavioural
  ones. It is scoped to a reference document rather than a how-to because the
  reader's question is "would it delete this file?", which is a lookup, not a
  procedure.

  assigned_agent IS DELIBERATELY UNSET, as it is on every AC in this batch --
  the IT PO owns technical enrichment for this run. For the record, the BA
  documentation-trigger table nominates documentation-expert for a reference-doc
  AC; that is a suggestion to the IT PO, not a decision taken here.

  THE LAST Then CLAUSE IS THE ACCEPTANCE TEST FOR THE OTHERS. Prose that
  describes the sweep in general terms can satisfy the first four clauses and
  still leave a reader unable to answer the only question they will ever
  actually ask. Predicting the verdict for a specific file is what makes the
  documentation load-bearing, and it is checkable: hand a reader
  settings.local.json and the retired fast-lane-build workflow and see whether
  they get both right.

  DO NOT CREATE A NEW REFERENCE PAGE WITHOUT CHECKING THE TWO LINKED ONES FIRST.
  false-green-mechanisms.md already exists precisely for checks that report
  success having examined nothing, which is the BP-1500b-3 half of this work. A
  third page on the same theme would repeat the store's own recurring failure of
  scattering one rule across several records.
