it_requirements: |
  Check D must FIRST confirm the canary hook is registered in the resolved config;
  an absent registration is a distinct, named FAIL — never a no-op skip that reads
  as a pass. Implemented in the shared probe helper (BO-1700a-1); fail closed
  (BO-1700b-1); ADR-001 deployed/template parity applies (manifest canonical source
  is the templates/scripts/commit_guardian/ copy).
