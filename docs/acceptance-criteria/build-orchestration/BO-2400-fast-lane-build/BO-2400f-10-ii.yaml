id: BO-2400f-10-ii
components:
  - build_orchestration
title: "A release that did not release is read, and named in the halt beside the failure that triggered it"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: critical
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run is halting after having claimed its connected set,
  And it has asked for that claim to be released,
  When it composes the outcome it hands back to its operator,
  Then the result of the release appears in that outcome, beside the failure that
    triggered it — either the acceptance criteria that went back to todo, or the fact
    that they did not, together with what came back instead,
  And a run that never inspected the release's result does not satisfy this: a discarded
    result cannot tell a release that ran from one that was declined, and that is exactly
    how a lane released nothing for as long as it did while every one of its runs looked
    correctly halted.

  Given the release did not happen,
  When the operator reads the run's outcome,
  Then it names the acceptance criteria that are therefore left at in_progress, and says
    that a later run aimed at them will be refused while they stay there,
  And the failure that triggered the halt is still named as the reason the run stopped,
    so the unreleased claim is reported as a second fact about the same run rather than
    displacing the first — an operator must not have to choose between learning why the
    run stopped and learning what it left behind.
depends_on: [BO-2400f-10, BO-2400f-10-i]
