notes: |
  WHY THIS IS ITS OWN RECORD. With the error stream sent to /dev/null, the capture
  precedence in INF-500d-3 falls through every step: there is no id, no recovery line
  and no failure line. It ends at facility-unavailable on EVERY failure. A template
  that kept `2>/dev/null` and swapped the bare fallback for the facility-unavailable
  marker would satisfy INF-500d-3-v's wording for epic-supervisor ("a reasoned marker
  from the vocabulary"). It would still misreport every writer refusal, malformed
  submission and unwritable destination as an unavailable facility. The
  destination-unwritable case in the first scenario turns that version red. That
  wrong version is the reason this record exists.

  Location verified 2026-11-16: epic-supervisor.md:373, a commented shell equivalent
  inside a Python-style pseudocode block, `... 2>/dev/null) || FB_ID="(submit-failed)"`.
  The non-blocking contract it must keep is at :376-378.

  Observed, not in scope: epic-supervisor is marked DEPRECATED (ADR-006) but is still
  shipped and dispatchable, so its instruction must still be correct. Retiring it is
  not this record's decision.

  IT PO ENRICHMENT (2026-11-16). The criteria are unchanged. Points for the reviewer:

  - SAME-DELIVERY EFFECT ON INF-500d-3-ii's TESTS. Today the INF-500d-3-ii check skips
    epic-supervisor because its error stream goes to /dev/null. Once it goes to a file,
    the check discovers the line, judges its name and runs it with bash -c. So the name
    must use a ticket placeholder the check fills to a file name, and the command must
    run as lifted. The current '#'-commented, collapsed line would make
    test_inf_500d_3_ii.py red.
  - OVERLAP WITH INF-500d-3-v. Both records list epic-supervisor and both name the
    marker. This record owns the redirect and the destination-unwritable case.
    INF-500d-3-v owns the full precedence across every surface. Build the two in one
    delivery, or this one first.
  - The second scenario holds today only by instruction text (the non-blocking
    contract), because the grouping algorithm is pseudo-code that the agent carries
    out. A test can show that no step routes the marker into a surfaced payload, but it
    cannot run the supervisor.
