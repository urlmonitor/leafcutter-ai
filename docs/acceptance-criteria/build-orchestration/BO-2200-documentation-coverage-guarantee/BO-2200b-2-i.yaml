criteria: |
  Given a ticket whose documentation brief requires two documentation files,
  When the git diff contains a real change to the first required file but no change to
    the second,
  Then the verifier reports `status: blocker` rather than passing on partial coverage.
  And the blocker message names the second file as the one still missing a real change,
    and does not name the first file (which was satisfied).
