notes: 'Approved requirements; implementation is under review; live execution remains blocked by the native Windows isolation requirement. Pattern inventory found
  no matching reusable worker behavior. User-selected technical constraints for IT PO: Qwen3.5 9B through
  Ollama; first workflow LangGraph with durable local-first state. No hosted database or global migration
  required.'
declares_side_effect: false
estimated_complexity: L
it_requirements:
- Run the first worker workflow through LangGraph and a real tool-executing harness using Qwen3.5 9B on
  local Ollama; endpoint invocation alone is not a coding agent.
- The execution envelope must carry leaf criteria plus inherited L1/L2 obligations, exact source/ADR/product-truth
  references and prior evidence, not merely titles or negative edge-case text.
- Enforce scoped filesystem access, permitted project-local dependency operations and process/network
  permissions outside the model prompt; canonical paths and symlink traversal cannot escape the assigned
  workspace.
- Raw shell access must use an execution sandbox/permission boundary or validated command broker; cwd
  or filesystem-tool root alone cannot constrain an arbitrary process.
- Delegate no authority to merge or write the protected target; collect actual tool/check results and
  inspect repository effects, rather than accepting model self-reported success.
- Keep native E2 workflows unchanged; this portable worker path must not depend on Claude-only injected
  globals or silently select cloud implementation.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
