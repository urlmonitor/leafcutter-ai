notes: |
  THE OUTGOING HALF of the provenance rule: the question must not be asked of an
  agent. ACD-2100c-4 is the incoming half -- an answer that arrives from somewhere
  other than the person is not accepted. Both are needed. A gate can be routed to a
  person and still swallow whatever turns up on the channel.

  ALL FIVE SITES ARE NAMED IN THE CRITERIA ON PURPOSE. The known issue lists three;
  the PO verified five on 2026-08-25 (lines 2067, 2361, 2458, 1913 and 841), and the
  last two appear in no known issue. The orphan-resolution decision at 841 is
  destructive in its own right -- it can delete drafts -- so leaving it out of the
  class is the worst of the five omissions. Fix the class with one mechanism; five
  per-site patches is how the two unlisted ones get missed. Sites are described by
  what they decide rather than by line number so the criterion survives the file
  moving.

  WHY THE DISPATCH-RECORD CLAUSE RATHER THAN "no agent answers". The property is
  only observable from outside: run the route, then read what it dispatched. A test
  that asserts a particular agent name is absent from the source passes as soon as
  the dispatch is built from a variable. Per CLAUDE.md, an AC about a gate is
  covered by a test that executes the gate path.

  NOT IN SCOPE HERE: what happens when the channel reaches nobody. That is
  ACD-2100c-2 -- pause, do not proceed and do not discard.

  2026-08-25 (it-po): sized L. This is the only record in the tree that changes a
  mechanism rather than a site: five call sites, a new answer-provenance shape that
  ACD-2100c-4 consumes, and a class-wide guard that a sixth site inherits. The
  delivers_to contract to c-4 states the shape without prescribing it -- what matters
  is that the channel an answer arrived on survives to the point of evaluation,
  because c-4's proof is a pair of answers identical in content and differing only in
  origin, and that pair is unrepresentable if provenance is discarded at parse time.
