notes: |
  THE SETUP-VERSUS-CALL SPLIT IS NOT A NICETY, IT IS THE FINDING. Two of the three
  most expensive entries in the measured duration table are preparation, not the
  test: 206.74s for a single test in unit_tests/portability/test_bp_1500d_1_i.py
  and 73.03s in unit_tests/portability/test_ge_120c_1.py. A record that reports
  only a per-test total hides the single most actionable fact this investigation
  produced — that the cost is repetition rather than work — and would have sent
  the next reader looking at the wrong thing.

  THE DURABLE-LOCATION CLAUSE IS WRITTEN FROM A FAILURE THAT ALREADY HAPPENED. The
  profiler behind this goal's evidence was reclaimed by the hourly cleanup timer
  while it was still being used. A measurement surface that does not survive an
  hour cannot support a trend, and a budget without a trend is a number nobody can
  justify.

  THE MACHINE-READABLE CLAUSE EXISTS BECAUSE OF TQ-600c-2 AND TQ-600c-4. Both read
  this record. A guard that re-parses console output is fragile in a specific and
  dangerous way: a change in output formatting makes it silently match nothing,
  and a guard that matches nothing reports clean.

  WHAT IS NOT DECIDED HERE: the record's format, and its exact path. Both are
  it-po decisions. The criteria fix only that it is durable, complete, split by
  phase, self-describing, and readable by a program.
