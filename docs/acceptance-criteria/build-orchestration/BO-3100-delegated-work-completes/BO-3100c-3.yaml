id: BO-3100c-3
title: "Independent steps still run at the same time, and a dependent step still waits"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a build containing two steps that depend on nothing and on each other not at all,
    And each step records the moment it starts and the moment it ends,
  When the build is driven,
  Then the two steps overlap in time — the second starts before the first ends.

  Given a build containing a step that depends on another,
    And both record their start and end moments,
  When the build is driven,
  Then the dependent step starts only after the step it depends on has ended.

  Given a build containing four independent steps,
  When the build is driven,
  Then all four end, and each one's result is held by the coordinating layer before the build
    is reported as complete.
depends_on:
  - BO-3100c
  - BO-3100c-1
