notes: >-
  Authored by /quick-fix. Two independent root causes. (1) The three paths were
  committed despite .gitignore listing two of them — .gitignore has no effect on
  already-tracked files, so the entries were inert. (2) The patterns are written
  `scripts/commit_guardian/` with a trailing slash, which matches a DIRECTORY
  only; git stores these as symlinks (mode 120000), not directories, so the
  pattern cannot match them even once untracked — `git check-ignore -v
  scripts/commit_guardian` exits 1. `scripts/feedback`, `.claude/workflows` and
  `.env` had no entry at all.
  A generic index scan (rather than checking the three originally-reported
  paths) surfaced two further offenders: `.claude/workflows`, an install_shims
  build output missing from .gitignore alongside its agents/skills/commands/
  hooks siblings; and `.env`, tracked as a symlink pointing at ITSELF
  (leafcutter-ai/.env -> leafcutter-ai/.env). That self-reference is the exact
  hazard BP-015 had to defend against, and it is why `git status` permanently
  reports ` T .env` for any developer whose .env is a real file.
  Observed impact 2026-08-14: on main all three scripts/ shims point at
  /home/henzeh/projects/leafcutter/worktrees/adr-numbering/... , a deleted
  worktree, so guardian-dependent gates silently no-op locally and tests
  false-green (see BP-015 / PR #440, where two tests passed locally only
  because verify_precommit_active.py was unreachable and failed in CI).
