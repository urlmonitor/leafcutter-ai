id: GE-127a-1-i
title: "A file whose length cannot be established is refused and named, never reported as within its permitted length"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a staged file of a kind the size standard covers whose length cannot be
    established — its contents are not readable as text in the encoding the
    standard reads, or the file cannot be opened at all,
  When the author performs an ordinary commit,
  Then the outcome states that the file's length could not be established, names
    which of those two situations occurred, and the commit does not complete,
  And that file is not listed among those found to be within their permitted
    length, and no length is stated for it,
  And the outcome is distinguishable from the outcome produced by a file whose
    length WAS established and found to exceed its limit — an author can tell
    which of the two results they were given without inspecting anything else,
  And given the same file is then made readable and its length is below its
    permitted length,
  When the author performs an ordinary commit,
  Then the commit completes and that file is reported as within its permitted
    length — establishing that the refusal above was a statement about the
    measurement and not about the file.
depends_on:
  - GE-127a-1
