id: BO-2400f-5-i
components:
  - build_orchestration
title: "Every step of the one-command arc is asked of an agent whose charter covers that step, so no step is refused as someone else's job"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run is started with one acceptance-criterion id, and its arc
    contains steps that each run one repository command and hand back its result —
    resolving the connected set, deciding producibility, claiming the set, assembling
    the context bundle, releasing the claim on a halt, and, where the run asks an agent
    to perform them, writing the changelog entry, committing, pushing and opening the
    pull request,
  When the run asks an agent to perform any one of those steps,
  Then the agent it asks is the dedicated command-step-runner (BO-2400a-1-i), whose
    registered role is running a given command in a named workspace and returning its
    output, and whose registry entry declares permits_shell true,
  And no command step is asked of status-checker, python-coder, worktree-agent or any
    other agent, so the claim and release steps move off worktree-agent and
    python-coder as well as resolve and producibility moving off status-checker,
  And the request does not tell the command-step-runner to act as a role other than its
    registered one, so that no step reaches an agent with the instruction to become
    some other agent,
  And an agent whose registry entry says it may not run repository-changing commands,
    or says nothing about it, is asked to perform none of these steps.

  Given the same run reaches its specialist phases,
  When it asks for the tests to be written, the code to be written, and the change to
    be reviewed,
  Then those are still asked of the test-writer, the coder and the pr-reviewer
    respectively, and none of them is asked of the command-step-runner.

  Given the lane as it stands on 2026-09-25, in which the resolve and producibility
    steps are asked of an agent whose registry entry declares that it may not run
    commands, and the claim and release steps were moved to other agents only one at a
    time,
  When this criterion is met,
  Then all of the steps above satisfy it together, and none is left on an agent whose
    charter excludes it,
  And a run started once from an unchanged store proceeds from resolve through claim
    and context bundle without any step being declined as outside the asked agent's
    role, so the operator does not have to drive any step by hand.
depends_on: [BO-2400f-5, BO-2400a-1-i, BO-2400f-7-iii, BO-2400f-10-i, BO-2400f-3-ii, BO-2400f-5-iii]
