notes: |
  Authored 2026-08-25 from a user (BrainCandy) request. Sibling of BO-3100; see
  that record's notes for the shared root cause and the split rationale.

  THE RULE, in the user's words: only JUDGEMENT is delegable to a specialist.
  I/O, control flow, and consent are not.

  KNOWN STARTING STATE, to be re-measured rather than trusted: roughly 69
  dispatches currently use a read-only reporting specialist as a general-purpose
  errand runner — to read files, run commands, or collect user consent.

  FOUR OBSERVED FAILURES, all the same shape, all currently open. These are the
  evidence base and each child should be traceable to at least one:
  - A configuration file was read by asking a specialist to print it. The file
    was ~130 KB; the reply truncated at 75,000 characters mid-escape-sequence, so
    parsing failed. The failure was fail-closed into a SUBSTANTIVE verdict — "this
    agent is not permitted" — and the run halted. The permission was in fact
    granted. (KI-BO-018)
  - A ~149 KB result was requested as a text field in a reply. The specialist did
    the work correctly, wrote it to disk, and returned a file path. The gate
    checked the 47-character path for content, found none, and halted a run whose
    work was fine. The gate was right; the transport was impossible. (KI-BO-019)
  - A required cleanup action was dispatched to a read-only reporting specialist,
    which correctly refused the role. The reply was never inspected, so the
    action silently never happened and claimed work was left stranded. (KI-BO-020)
  - Approval gates were put to a reporting specialist rather than a person. It
    refused, and its refusal was parsed as the user choosing to cancel, which
    discarded already-authored work. (KI-ACD-005)

  ALREADY SHIPPED — DO NOT RE-SPECIFY. PR #565 (88c6395e) added an `undetermined`
  status and stopped the approval gates defaulting to discard. So the fourth
  failure no longer destroys work, and a status exists for "I could not perform my
  task". What remains is making the gates actually reach a person (BO-3200c) and
  using that status at every check that can fail to inspect (BO-3200e).

  MECHANICAL ENFORCEMENT ONLY — the same hard constraint as BO-3100 applies here.
  "Workflow authors are instructed not to use a specialist as an errand runner"
  is not an acceptable L2. The gap must be closed so the misuse cannot be
  expressed, or is caught automatically.

  A NOTE ON BLAME, worth preserving because it shapes the fix: in every case
  above the specialist behaved well. It said plainly what it had done, or
  correctly refused a role outside its remit. What failed was asking it for
  something no specialist can reliably provide. Decompose these as contract
  defects, not as agent-obedience problems.

  IT-PO ENRICHMENT NOTE (2026-08-26). risk_surface is contract_boundary at L0
  rather than internal, unlike BO-3100: every child of this tree changes the
  contract between the build and something outside it — the declaration a dispatch
  site must carry (BO-3200a-2), the out-of-band handover between a producer and a
  consumer (BO-3200d-2), the three-answer vocabulary every check site must emit
  (BO-3200e). BO-3200c's children carry `auth` instead, because the property under
  test there is the PROVENANCE of an answer that settles a consent gate, which is
  an authorisation question rather than a contract-shape one.
