id: GE-118a-1
components:
  - commit_guardian
title: "check_secrets resolves scan_secrets from the layout build.py deploys, not a hardcoded .claude path"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the check-secrets pre-commit hook running inside a git worktree,
  And the worktree exposes the deployed leafcutter layout under .leafcutter (via the
    build/symlink) but not necessarily a .claude directory,
  When check_secrets.py resolves the security-scanner scripts directory to import
    scan_secrets,
  Then it locates scan_secrets from the layout that build.py actually deploys
    (.leafcutter/skills/security-scanner/scripts) — e.g. by resolving relative to the
    hook's own deployed location or trying the deployed layout before the .claude
    fallback — rather than only the hardcoded commit_guardian.json
    security_scanner.scripts_dir value of ".claude/skills/security-scanner/scripts",
  And the hook imports scan_secrets and runs (scanning or exempting the staged files)
    instead of exiting non-zero with ModuleNotFoundError,
  And the main-checkout behavior is unchanged (backward compatible).
depends_on: [GE-118a]
