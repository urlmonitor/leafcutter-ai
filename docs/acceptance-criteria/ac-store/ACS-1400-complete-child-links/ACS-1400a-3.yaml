doc_links:
  - path: templates/scripts/commit_guardian/check_ac_parent_covered_by.py
    relationship: related
    status: exists
    relevance: "THE DOCUMENTED HATCH, AND THE HONEST THING TO DO ABOUT IT AT COMMIT TIME. The check reads only the commit's staged set, so a record nobody is touching is structurally unreachable from here — and no amount of hardening changes that, which is why ACS-1400b exists as a different instrument. What IS closable here is the ambiguity: today a commit that staged nothing and a commit that staged clean records both exit 0 with no output. Naming the examined population converts the first from a silent pass into a stated non-answer."
  - path: scripts/ac_store/validate_ac_schema.py
    relationship: related
    status: exists
    relevance: "THE PRECEDENT AND ITS SCAR, IN THIS SAME COMPONENT. For eight days a bare-directory argument matched zero files, printed a success message and exited 0 — a defence that reported clean while checking nothing, and the project's own written instruction prescribed the form that triggered it. Its fix is the model: state the count examined, and make a zero-file run non-silent. CLAUDE.md's AC-store hygiene section records the whole episode."
  - path: docs/acceptance-criteria/ac-store/ACS-1100-honest-coverage-answers/ACS-1100.yaml
    relationship: related
    status: exists
    relevance: "STANDING, INHERITED, NOT DUPLICATED. Every figure a descendant reports must state the total it was measured against. This AC is that obligation applied to the smallest possible answer — a commit-time check reporting zero findings."
