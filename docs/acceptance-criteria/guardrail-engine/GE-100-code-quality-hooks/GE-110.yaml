it_requirements:
  - "The GE-109a test-file exemption was implemented only in the DEPRECATED tree templates/commit-guardian/check_exception_handling.py (per DEPRECATED.md). Port the is_test_file(path) pure helper and the main() short-circuit into the canonical tree templates/scripts/commit_guardian/check_exception_handling.py."
  - "Test-file detection is path-based: any path component equal to `tests` or `unit_tests`, or a basename of `conftest.py` / `test_*.py` / `*_test.py`."
  - "Exemption must short-circuit before AST analysis (before analyse_file()) so a test file never contributes a violation."
  - "Production files (normal directory, normal name) must remain subject to the full E722/BLE001/IO-001 check."
