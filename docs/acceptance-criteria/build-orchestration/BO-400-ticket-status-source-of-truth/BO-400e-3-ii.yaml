id: BO-400e-3-ii
title: "Finalization may close only what the finalizing branch was built to deliver and itself changed since it left main -- on a single-ticket branch only its own ticket and that ticket's source AC -- never a record changed only on main, edited in passing, or untouched"
component: build-orchestration
components:
  - build_orchestration
  - finalize
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
criteria: |
  Background:
    Given main is at commit M0 when the single-ticket branch "feat-close-x" is created from it
        to build the ticket "TICKET-X.md"
      And on "feat-close-x" the ticket "TICKET-X.md" is edited so that every phase it names is
        signed off or not needed, and its source acceptance criterion is "BO-9100a-1"
      And after the branch was created, main gains a commit M1 that edits the ticket
        "TICKET-Y.md" and the acceptance criterion "BO-9200a-1", both of which stay unfinished
      And the store also holds the ticket "TICKET-Z.md" and the acceptance criterion
        "BO-9300a-1", which neither main nor the branch has changed since M0
      And "feat-close-x" has not yet taken in M1

  Scenario: Control -- the branch's own delivery is closable
    When finalization works out which records it may close for "feat-close-x"
    Then the set it may close is exactly "TICKET-X.md" and "BO-9100a-1"

  Scenario: A record changed only on main is not the branch's delivery
    When finalization works out which records it may close for "feat-close-x"
    Then neither "TICKET-Y.md" nor "BO-9200a-1" is in the set
      Because the comparison is between the branch and the point where it left main, not
        between the branch's files and main's current files -- a whole-tree comparison lists
        every record main changed since the branch was created as if the branch had changed it

  Scenario: An untouched record is never in the set
    When finalization works out which records it may close for "feat-close-x"
    Then neither "TICKET-Z.md" nor "BO-9300a-1" is in the set
      And no record enters the set because it was found by walking the inbox or the
        acceptance-criteria store

  Scenario: Changes that arrived by taking in main are not the branch's own
    Given "feat-close-x" took in main at M1 by merging it, before finalization started
    When finalization works out which records it may close for "feat-close-x"
    Then "TICKET-Y.md" and "BO-9200a-1" are still not in the set
      And "TICKET-X.md" and "BO-9100a-1" still are

  Scenario: A single-ticket branch closes only the ticket it was built for -- not a ticket it edited in passing
    Given "feat-close-x" also edited the ticket "TICKET-Q.md" in passing (a wording fix), and
        "TICKET-Q.md" reads "todo" with every phase it names signed off or not needed, and its
        source acceptance criterion is "BO-9400a-1", which reads "todo"
    When finalization works out which records it may close for "feat-close-x"
    Then the set is exactly "TICKET-X.md" and "BO-9100a-1"
      And after finalization "TICKET-Q.md" still reads "todo" and "BO-9400a-1" still reads "todo"
      Because a branch changing a ticket is not the branch delivering it, and a ticket whose
        record happens to pass the check would otherwise be closed on the strength of a typo fix

  Scenario: The ticket a single-ticket branch was built for must be one the branch changed
    Given "feat-close-x" was built for "TICKET-X.md" but no commit on the branch since M0
        changed "TICKET-X.md"
    When finalization works out which records it may close for "feat-close-x"
    Then the set is empty, and the outcome is reported as described in BO-400e-3-viii

  Scenario: When the ticket a single-ticket branch was built for cannot be identified, nothing is closed
    Given finalization cannot establish which ticket "feat-close-x" was built for
    When finalization works out which records it may close
    Then the set is empty and no record changes status
      And the run reports that it could not tell which ticket the branch was built for
      And it does not fall back to treating every ticket the branch changed as closable

  Scenario: An epic branch is bounded by its own epic folder
    Given the branch is "EPIC-Alpha" and it changed both
      "tickets/00_inbox/epics/EPIC-Alpha/alpha-01.md" and
      "tickets/00_inbox/epics/EPIC-Beta/beta-01.md"
    When finalization works out which records it may close
    Then "alpha-01.md" is in the set and "beta-01.md" is not
      And the acceptance criteria in the set are exactly the source acceptance criteria of
        the epic tickets in the set

  Scenario: The same branch state always gives the same set, and the set is fixed before anything is written
    Given finalization is run twice against "feat-close-x" in the identical state
    When each run works out which records it may close
    Then both runs produce the identical set, listed in the same order
      And the set is settled before any record is written, so the party carrying out the
        closure is handed that list and cannot add a record to it
  So a ticket or acceptance criterion is marked done only because the branch being finished
    delivered it -- because "done" unblocks the work that depends on it and drops the item out
    of the backlog, a record closed on someone else's behalf silently releases work whose
    prerequisites do not exist.
