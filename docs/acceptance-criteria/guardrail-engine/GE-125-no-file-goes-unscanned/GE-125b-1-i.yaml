notes: |
  WHY THIS IS NOT ALREADY COVERED BY THE PARENT. The measured evidence in
  KI-SEC-001 is entirely about the skill-prompt area, and it describes the other
  three locations as "genuinely prose directories". The most plausible cheap
  implementation of the parent criterion is therefore one that special-cases the
  skill-prompt area — which passes every arm of the parent and leaves a Python
  file in the ticket tree exempt. This criterion is the standing argument against
  that shape, and it is why the parent's fix has to be a property of the file
  rather than a property of the directory.

  THE THIRD FILE IS THE CONTROL AND THE SECOND IS THE ONE THAT MOVED. The
  acceptance-criteria record used to be admitted, because .yaml was one of the
  four kinds chosen in GE-125b-3, and this criterion used to pin that the store
  kept the reduced scrutiny it had. Both GE-125's notes and this record said in
  advance that if .yaml were ever dropped, THIS arm would turn red and that would
  be the correct outcome rather than a defect. On 2026-08-25 the product owner
  dropped it: the acceptance-criteria store SHALL be scanned. The arm has
  inverted, the expected count is two rather than one, and the .yaml fixture is
  now part of the evidence that the narrowed kind list landed rather than a fence
  around an undecided question.

  WHAT THE DECISION DID NOT DO, AND WHY THE RETROSPECTIVE IS STILL SILENT.
    - The LOCATION list is untouched. docs/acceptance-criteria/ is still one of
      the four reduced-scrutiny locations; a .md or .txt file in the store is
      still admitted there. Only the kind gate narrowed. The third fixture — a
      Markdown retrospective — is silent for exactly that reason, and it is what
      distinguishes this change from deleting a location.
    - The TICKET-/EPIC- residual-entropy filter survives everywhere. It is not
      path-gated: a line carrying a ticket or epic identifier whose residual
      entropy is below the threshold stays exempt regardless of location and
      kind. That filter is why the measured store-wide cost of this decision is 58
      findings across 48 files rather than 625. The fixture line here deliberately
      carries no ticket identifier, so this arm measures the kind gate and nothing
      else — do not read it as saying store lines with ticket identifiers now
      report.

  FIXTURE PLACEMENT, STATED AND JUSTIFIED. All three paths deliberately contain
  one of the four listed names, because being at a listed location is a
  precondition of the scenario rather than an accident. That is exactly the
  fixture trap, so this criterion must be run in the SAME invocation as the
  parent's "scripts/build_probe.py" control, or carry its own copy of it: the one
  silent file here is only evidence alongside a file that is reported. Real
  files in a throwaway repository; token assembled at runtime from fragments;
  driven through the pre-commit secrets check over a staged set, never through
  the exemption logic directly.

  ATTACHMENTS UNDER A TICKET ARE NOT HYPOTHETICAL. KI-SEC-001 records that a
  ticket is a file a developer will happily paste a token into while writing up
  an incident; a reproduction script committed beside that write-up is the same
  habit with an executable file on the end of it.
