criteria: |
  Given a phase agent (test-writer, python-coder, or ac-validator) is dispatched for a ticket
    whose frontmatter carries source_ac: ACS-100a-1,
  When the agent needs the authoritative requirement to act on,
  Then it opens docs/acceptance-criteria/{component}/{id}.yaml resolved from source_ac,
  And it treats that store record's criteria as its authoritative spec,
  And it does not rely on a criteria copy pasted into the ticket body.
