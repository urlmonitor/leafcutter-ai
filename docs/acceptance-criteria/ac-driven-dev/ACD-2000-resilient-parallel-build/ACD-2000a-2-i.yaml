it_requirements:
  - "REPOINT THE PAYLOAD DERIVATION IN THE SAME CHANGE AS THE TRAIL, NOT AFTERWARDS. Verified: templates/skills/building-epics/SKILL.md section 6 emits `blocker_summary` at line 1053 and defines it at line 1062 as 'a single sentence (<=120 chars) lifted or distilled from the latest `## Comments` body'. That derivation has exactly ONE input and ACD-1800c-1 removes it. The moment the grouping container stops carrying ## Comments, the payload builder reads nothing and produces nothing -- and the failure surfaces to the USER as an unexplained halt, which reads as 'no reason given' rather than as a defect."
  - "PRESERVE THE EXISTING PAYLOAD CONTRACT UNLESS THE SAME CHANGE UPDATES SECTION 6. The key name `blocker_summary` and the 120-character ceiling are the runbook's current choices, and the key is already emitted from at least three other halt paths (SKILL.md lines 67, 110 and 472). A rename or a length change made only at the new derivation point leaves those three emitting the old shape, and nothing will fail loudly."
  - "AN ABSENT REASON MUST PRODUCE A DISTINGUISHABLE MESSAGE, NEVER AN EMPTY STRING. The defect is one line long -- reading the latest entry's reason with an empty-string default -- and empty string is precisely the silent degradation this AC guards. The missing case must say that the reason is missing and must still name the requirement, so the operator can tell 'the build could not explain itself' from 'the build had nothing to say'. This is the same distinction ACD-1600g-4 draws for an absent boundary and ACD-1800f-3 for an empty proof set: nothing-to-read must never be presented as nothing-wrong."
  - "ENFORCE THE NO-BLANK-SUMMARY RULE AT THE EMIT POINT, NOT IN THE CALLER. If any code path can construct the payload without going through the check, the guarantee is advisory. Name in the implementation which function is the single emit point for this payload and route every halt path through it."
  - "THE PAYLOAD MUST NAME THE REQUIREMENT (the AC id) IT STOPPED ON. Under ACD-1800c a ticket groups N requirements, so 'the build stopped' without the AC id is not actionable -- the operator cannot tell which of N requirements is blocked, which is the same container-grain conflation ACD-2000a exists to remove, resurfacing at the user interface."
  - "TRUNCATION MUST BE LOSSLESS AT THE BOUNDARY. When the trail's reason text exceeds the summary ceiling it is shortened FOR THE SUMMARY only; the full text stays readable in the trail entry. Never truncate or rewrite the trail entry to fit the payload -- that would violate ACD-2000a-1's append-only guarantee via the escalation path, which is the least-watched writer in the system."
  - "Must log the emitted summary at INFO, and log at WARNING when the missing-reason branch fires, so a run of empty reasons is visible as a defect signal rather than only as user confusion."
delivers_to: null
