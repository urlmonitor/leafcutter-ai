criteria: |
  Given AC ACD-800a-1 has a criteria field containing multi-line Gherkin text
    (e.g. "Given a YAML file with status: active..."),
  And a done ticket (status: done or located in a 99_done/ folder) has an
    ## Acceptance Criteria section whose body is >= 90% similar to that
    criteria text (measured by difflib.SequenceMatcher ratio),
  When the cross-reference audit tool is run in read-only mode (no --apply flag),
  Then the output lists this AC with confidence: high,
  And the matched ticket path appears as the proposed implemented_by entry,
  And no AC YAML files are modified (read-only mode).
