      specialist (INF-800f) is dispatched against the named file with the named demand,
      the specialist restructures, and the commit is retried. That sequence is provable
      only by a reachability-angle test that the specialist is actually dispatched on the
      refusal path, and it belongs in build-orchestration's own tree. NO AC IN THIS TREE
