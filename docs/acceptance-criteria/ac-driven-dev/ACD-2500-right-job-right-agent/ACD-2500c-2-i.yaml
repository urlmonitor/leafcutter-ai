title: "The test writer builds from the design and never authors one"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given a requirement at readiness "approved" whose test design has 3 entries,
  When the test writer runs at build time,
  Then it writes tests whose names and directories match the 3 entries, each tagged with the
    requirement id,
  And it adds no entry to, removes no entry from, and edits no entry of the requirement's
    test design,
  And when a requirement carrying test intent but no test design reaches the test writer,
    it writes no test, derives nothing from the Then clauses, and stops with the reason
    "test design pending" naming the requirement.
