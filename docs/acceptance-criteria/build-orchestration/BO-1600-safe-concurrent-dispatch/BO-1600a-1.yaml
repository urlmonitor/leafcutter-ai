estimated_complexity: M
it_requirements:
  - "The serialization guard must be scoped to the git write portion of the commit only (writing loose objects, updating the index/refs); non-git work of each supervisor must remain free to run in parallel and must not be held behind the guard."
  - "Acquire/release must be safe across separate OS processes (concurrent ticket-supervisors are independent processes sharing one worktree), not merely across threads in one process."
  - "The guard must guarantee mutual exclusion under contention: at no instant may two holders be inside the git write portion concurrently."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3): wrap filesystem/OS calls that acquire or release the guard in try/except with a specific exception type and log at WARNING or higher; never swallow an acquisition failure silently."
  - "The guard must be released on every exit path of the git write portion, including error and exception paths, so a failing commit does not strand the guard (the stranded-guard release path is exercised by BO-1600b-2)."
  - "Acquiring an uncontended guard must add negligible latency to a commit (well under 100ms) so serialization does not materially slow a drive."
  - "Must be discoverable/invokable from the epic build-orchestration layer where supervisor commit phases are dispatched (see templates/skills/building-epics/SKILL.md and the templates/workflows-js/build-epic.js Step-0 worktree-guard precedent, BO-100d); do not bury the primitive where only one call site can reach it."
delivers_to:
  agent: python-coder
  contract: "A serialization primitive (a single named mutual-exclusion guard scoped to the shared worktree's git write portion) that every supervisor's commit phase acquires before writing git objects/index/refs and releases after. This guard is the single load-bearing primitive consumed by the wait-then-proceed behavior (BO-1600a-2) and the no-corruption guarantee (BO-1600a-3). Distinct from BO-100c (pre-dispatch file-conflict scheduling) and BO-200 (single-ticket atomic commit)."
