notes: |
  MOSTLY PROMPT. Two of the three surfaces are agent instructions and one is a
  workflow description. Whether the setting is read when the test runs or
  compiled into the instructions at install (the INF-1100c route) is IT-PO's
  call. If it is compiled, the compiled output for a configured project is
  observable and testable. If it is read at run time, the only
  deterministic proof is the absence half, which INF-1100d-4 guards
  mechanically. Say which in test_rationale; do not write a text search for the
  setting's name.

  The PO's list of seven places counts full address strings. The port-only
  mentions in test-runner prose and the test workflow are the same address in
  fragments and fall under this AC's last clause.

  IT-PO ENRICHMENT (2026-09-25)
  Route chosen: RUN-TIME read (see it_requirements). The reachability-check wiring is
  deterministic because it delegates to INF-1100d-3-i's checker.
