it_requirements:
  - "This documents the current behavior of buildFlowGraph in leafcutter-web/lib/data/graph.ts: the diamond-synthesis loop iterates i in [0, steps.length - 1), so branches whose from-step is the LAST ordered step are never processed into a diamond and fall through to the plain branch-card path."
  - "A test must PIN this current behavior (no diamond for a trailing fork) so the known limitation is verifiable against the live /flows view; it must NOT assert the desired future behavior."
  - "Lifting the limitation is out of scope here — it is a forward dependency on the ADR-025 decisions[] model (an explicit terminal outcome would give a trailing fork a home). Do not implement it under this AC."
