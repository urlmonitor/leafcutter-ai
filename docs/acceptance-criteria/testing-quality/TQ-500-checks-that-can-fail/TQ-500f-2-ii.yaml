id: TQ-500f-2-ii
components:
  - testing_quality
  - ac_store
title: "Bug-fix and gate requirements arrive at the test writer with their wrong versions already named"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the technical enricher (IT-PO) enriches three requirements in one pass —
      R1, a bug fix: "a database outage no longer causes a retry storm; the
        refresh runs only when a refresh is due and a retry is due",
      R2, a gate: "a trade is blocked unless both the window is open and the
        position limit is not reached",
      R3, new behaviour with no earlier version: "export the report as CSV",
  When it authors each requirement's test plan,
  Then R1's guarding test entry carries must_catch naming "revert the fix" and
      at least one specific wrong version that names the condition or input
      involved (for example "drop the retry_due condition"),
    And R2's guarding test entry carries must_catch naming one wrong version
      per condition of the gate ("drop the window-open condition", "drop the
      position-limit condition") and "the gate always allows",
    And R3 is not required to carry must_catch; if it carries none, nothing
      reports that as a defect,
    And whether a requirement is a bug fix or a gate is the enricher's own
      stated judgement in its enrichment note, not the output of an automatic
      classifier over the requirement's wording.
depends_on:
  - TQ-500f-2
