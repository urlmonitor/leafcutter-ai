notes: |
  SCOPED AROUND BP-100b-3, NOT OVER IT. The specific doubled-path defect -- a
  managed-directory name joined onto a base that already ends in that name --
  has a named owner in BP-100b-3, reopened as KI-BP-010. This AC states only the
  outcome that must hold once that is fixed: the same behaviour in both layouts,
  and a blast radius limited to the tree being rebuilt.

  A CORRECTION TO KI-BP-010'S STATED PREMISE, verified on disk 2026-09-07 and
  the reason the second Then clause exists. The entry reasons that the doubled
  path "never exists, so the loop continues every time". In the self-hosting
  layout it DOES exist:

    /home/henzeh/projects/leafcutter/.claude/.claude
      -> /home/henzeh/projects/leafcutter/leafcutter-ai/.claude   (a link)

  and that target holds nine real workflow files, eight of them current. So in
  that layout the doubled path is not a harmless miss -- it aims the reaper at
  the package's own installed tree rather than at the target's. An
  implementation that merely stops the doubled join without bounding the blast
  radius converts a silent no-op into a cross-tree deletion, which is why "never
  a second tree on the same machine" is in the title and not just the criteria.

  THE TWO TREES IN THE GIVEN ARE THE TWO THAT ACTUALLY EXIST HERE:
    /home/henzeh/projects/leafcutter/.leafcutter/workflows/          9 files
    /home/henzeh/projects/leafcutter/leafcutter-ai/.claude/workflows/ 9 files
  Both carry fast-lane-build.js; the package source carries eight templates and
  no fast-lane-build. The second tree's other workflows were rewritten on
  2026-09-07, so builds ran against it after the 2026-09-01 template deletion
  and left the orphan each time.

  THE LINK CLAUSE IS ABOUT SCOPE HONESTY, NOT CONVENIENCE. It pairs with
  BP-1500b-3: a sweep that declines to walk a linked location and says nothing
  produces a scope count that silently omits it, which is the vacuous all-clear
  arriving by a different route.
