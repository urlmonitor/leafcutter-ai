  - git_vcs_operations
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, a staged change, and a top-level session (no agent_id) in
    each permission mode that the probe findings (GE-129a-1) record as showing no prompt to a
    person -- among auto-accept of edits, bypass-permissions and a headless print run,
  When the session issues `git commit -m "x"`,
  Then the commit is refused and no commit is added to the history,
    And the refusal names the permission mode it received and states that a commit from the
    session needs a person at the permission prompt,
    And the refusal names no token, environment setting or flag as a way to let the commit through.

  Given a mode among those three that the probe findings record as showing a prompt to a person,
  When the session issues the same command,
  Then the commit follows GE-129d-1 in that mode and is not refused for its mode.

  Given a top-level session whose permission mode is absent from what the guard receives, or is a
    value the probe findings do not list,
  When the session issues the same command,
  Then the commit is refused, and the refusal states that the permission mode could not be
    established.
