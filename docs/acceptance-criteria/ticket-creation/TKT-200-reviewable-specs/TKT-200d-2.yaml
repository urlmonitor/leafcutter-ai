criteria: |
  Given a feature folder contains 3 AC files across 2 components,
    with a diagram for each component and a boundary doc for each component,
  When one AC file is revised and it belongs to component A only,
  Then only component A's diagram and boundary document are regenerated,
  And component B's diagram and boundary document remain unchanged,
  And the review package manifest is updated to reflect the regeneration timestamp.
