created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100d.yaml
criteria: |
  Given the allowlist behavior defined by TQ-100d-1 (valid entry exempts) and its
    edge cases (expired, now-passing, missing required fields),
  When a state diagram is authored for an allowlist entry's lifecycle,
  Then the diagram shows the states an entry can occupy (at least: tracked/valid,
    expired, now-passing, and rejected/invalid)
  And it shows the transitions and triggers (expiry date passing, the named test
    starting to pass, a required field being absent)
  And a maintainer can read from the diagram exactly when an entry stops
    exempting its test and gets flagged for removal.
depends_on:
