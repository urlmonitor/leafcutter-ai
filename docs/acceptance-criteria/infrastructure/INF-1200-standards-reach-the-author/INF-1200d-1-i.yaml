notes: |
  THE FALSIFYING CASE THE L1 TOLD US TO KEEP IN VIEW, MADE INTO A CONSTRAINT. INF-1200d
  promises that a newly declared standard reaches everyone it applies to. When it
  applies to nobody, that promise is discharged vacuously and truthfully, and the run
  reports success. Zero of zero recipients is a true statement and a worthless one — it
  is the same arithmetic by which a delivery that reached nobody at all looks
  indistinguishable from a project with no standards, which is the failure mode the L0
  names as the one this whole tree is exposed to.

  WHY THIS IS AN L3 AND NOT AN L2. It adds no delivery behaviour. It constrains what
  INF-1200d-1's own run may claim about itself on the one input where the criterion is
  vacuously satisfied. That is a technical constraint on an already-specified behaviour,
  which is exactly the L3 shape.

  THE LAST ARM IS THE CATASTROPHIC CASE AND IT IS CHEAP TO GET WRONG. If every declared
  standard has an empty audience — because the ownership record failed to load, because
  a field was renamed, because the join key changed shape — an implementation that
  reports per-standard success will report total success. This project's root
  instructions record three separate defences that reported clean for days or weeks
  while examining nothing, and each time the clean result was believed. That is the
  precedent this arm exists against, applied on the delivery side rather than the
  reporting side.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift
  it verbatim into a test descriptor.

  MUTATION: treat a standard whose audience is empty as delivered, on the grounds that
  every specialist that had to be told was told. Under that injection:
    - the first arm must go RED, because the standard is represented as delivered;
    - the naming arm must go RED;
    - the non-empty-audience arm must STAY GREEN, so the two cases are shown to be
      distinguished by the record rather than by the mutation;
    - the all-empty arm must go RED, reporting a wholly failed run as a success.
  All four outcomes must be observed together and all must revert.

  A SECOND MUTATION WORTH RUNNING. MUTATION: make the empty-audience statement
  unconditional, emitted for every declared standard. Under it the non-empty-audience
  arm goes RED while the first two stay green. A warning that always fires is
  indistinguishable from no warning, and it is the standard way a condition like this
  gets neutralised within a month of shipping.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. Both
  mutations above are written to be turned directly into test descriptors.
