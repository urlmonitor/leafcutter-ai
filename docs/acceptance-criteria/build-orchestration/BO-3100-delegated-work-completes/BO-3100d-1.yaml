it_requirements:
  - "IT-PO DECISION — WHAT COUNTS AS A BEHAVIOURAL CLAIM. A statement in the delivery record that asserts an observable outcome of running the system: what a dispatch does, what a dispatched agent receives or returns, what happens when it emits text without acting, what the harness makes available to a subagent. Statements of intent, rationale, policy or preference are NOT behavioural claims and are out of scope. The distinction must be recorded in the record itself, as an explicit marking on each claim, not inferred from wording — a text heuristic over prose is the shape this tree rejects everywhere else and it would be no better here."
  - "IT-PO DECISION — WHERE THE CHECKS LIVE. Alongside the repository's other behavioural workflow tests (unit_tests/), each check bound to its claim by an identifier carried in the record. The binding must be data, so that BOTH directions are computable: claim-without-check and check-without-claim."
  - "EACH CHECK MUST EXERCISE THE BEHAVIOUR, NOT DESCRIBE IT. A check whose assertion is that the record contains a sentence is a grep on prose and does not count; a check that reads the record at all, other than to enumerate its claims, is suspect."
  - "THE REPORT MUST CARRY THREE STATES PER CLAIM — confirmed, contradicted, unchecked — and unchecked must be reported, not silently omitted. Without it the cheapest way to pass is to pair one claim and leave the rest unexamined, and the record then carries verified and unverified assertions that read identically."
  - "A CONTRADICTED CLAIM MUST FAIL SOMETHING that runs in CI. A report that names a contradiction while the run exits zero is the false-success shape this repository has hit repeatedly."
  - "A run in which zero claims were enumerated must FAIL, not pass — the KI-ACS-001 zero-input shape, which would be especially embarrassing in the instrument built to prove the documentation is honest."
  - "The check for the depth claim must actually issue a dispatch from inside a dispatched agent and observe the outcome. Asserting that nesting works because a test says so, without a dispatch occurring, proves nothing about the claim."
  - "Reuse BO-3200e's vocabulary for a check whose observation could not be made: that is `undetermined`, and it is distinct from both contradicted and unchecked."
delivers_to:
  - agent: reference-author
    contract: "The claim-to-check binding mechanism (claim identifier in the record, matching identifier on the check) and the three-state report, so BO-3100d-3 and BO-3100a-4 can use one mechanism rather than inventing a second."
expects_from:
  - ac_id: BO-3100c
    contract: "The relocated coordination, in its final shape. Sequenced after it on the parent's instruction: documenting and claim-checking a topology that is about to move describes a design that no longer exists."
test_spec:
  - name: test_bo_3100d_1_depth_claim_is_reported_contradicted_by_observation
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: criterion
    description: "Exercise the current claim that a dispatch issued from inside a dispatched agent does not execute: issue one, observe that it DOES execute, and assert the claim-check report marks that claim contradicted."
  - name: test_bo_3100d_1_no_idle_state_claim_is_reported_confirmed
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: criterion
    description: "Exercise the corrected claim: a dispatched agent emits text without acting; assert what the dispatcher receives is that text as the agent's result, and that the report marks the claim confirmed."
  - name: test_bo_3100d_1_unpaired_claim_is_reported_unchecked
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "THE ANTI-VACUUM TEST. Add a behavioural claim with no bound check and assert the report lists it as unchecked rather than omitting it, so partial coverage is visible instead of invisible."
  - name: test_bo_3100d_1_orphan_check_without_a_claim_is_reported
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: boundary
    description: "The reverse direction: a bound check whose claim identifier no longer exists in the record is reported, so a claim deleted from the record does not leave a check silently asserting nothing."
  - name: test_bo_3100d_1_contradicted_claim_fails_the_run
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: "Assert the claim-check runner exits non-zero on a contradiction — the value CI branches on, not only the report text. A report that names the contradiction while the run passes is the false-success shape."
  - name: test_bo_3100d_1_zero_claims_enumerated_is_a_failure
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: failure
    description: "Point the runner at a record with no enumerable claims and assert it exits non-zero rather than reporting clean."
test_rationale: |
  This is the one child of BO-3100d that can be mechanically enforced, and its whole value comes
  from the checks EXERCISING behaviour rather than reading the document. So the two headline
  tests each actually run the thing the claim is about — one issues a nested dispatch and
  observes that it executes, the other has a dispatched agent emit text without acting and
  observes what comes back.
  The unchecked and orphan tests cover the two directions in which the pairing rots: a claim
  gains no check, or a claim disappears leaving a check that asserts nothing. Both read as
  coverage to anyone who looks for one, which this repository already has on record.
  The exit-code test exists because a report is not a gate; it is the value CI branches on that
  decides whether a contradicted claim actually stops anything.
