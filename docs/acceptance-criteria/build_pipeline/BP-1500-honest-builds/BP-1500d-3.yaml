notes: |
  WHAT THIS CHILD OWNS. Point (d) of the guarantee in BP-1500d's notes, which that
  L1 flags as the one that must not be dropped: (a) through (c) implemented over a
  build that still reports success when it gives up leaves the whole family
  unenforceable, silently, exactly as today. This child is therefore the enforcement
  floor for its three siblings, not an extra.

  HOW THE MANDATED NEGATIVE CONTROL LANDS HERE. In the other children the check must
  be shown to go red on a deliberately non-portable record. Here the check IS the
  build's own verdict, so the deliberate breakage is the unproducible record and the
  demanded red is the build's failure. The second run -- the same build succeeding
  once the record can be produced -- is what stops the requirement being satisfied by
  a build that simply refuses every out-of-package target, which would be a
  regression dressed as a fix.

  THE OUTCOME CLAUSE IS SEPARATE FROM THE MESSAGE CLAUSE ON PURPOSE. A build that
  prints a loud, well-worded failure and still reports a successful outcome leaves
  every automated caller exactly where it is today. Both must be asserted; neither
  substitutes for the other.

  ORDERING. This child gates the acceptance of BP-1500d-1 and -2 in practice: an
  install that received no record because the build gave up is indistinguishable from
  one that was never built. depends_on carries only the parent link, as the authoring
  request specified; the it-po should record the gating relationship in the contract
  fields.
