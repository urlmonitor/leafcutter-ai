notes: |
  Mechanism (settled design): pytest --continue-on-collection-errors. The
  load-bearing behavior is "one un-collectable file does not abort the others";
  the flag is the agreed means. This L2 is the foundation TQ-100a-1-i/-ii/-iii
  stress with specific failure modes.
  IT-PO note: durable home for the flag is pytest ini addopts (config) so the CI
  invocation `python -m pytest tests/ unit_tests/` inherits it without editing
  the workflow YAML. ADR-016 already mandates `python scripts/build.py
  --target-dir .` runs before pytest in CI, so any deployed conftest/plugin is
  present at test time.
