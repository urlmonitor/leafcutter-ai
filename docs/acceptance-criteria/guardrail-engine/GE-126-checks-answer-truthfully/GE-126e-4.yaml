  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NULL AND THAT IS NOW A DECISION, NOT AN UNFILLED FIELD. This record is
  TERMINAL: its output is a diagram on the component page. GE-126e-5 is the sibling
  reference-doc leg of the same L1 and publishes figures rather than reading the picture.
  DO NOT REFILL.

  AGENT — architecture-diagram-author. This is the only record in the tree assigned to it
  and it is the one the component-diagram documentation trigger requires. The mermaid
  guards in this repository (check_diagram_naming, check_mermaid_complexity,
  check_mermaid_drift, check_mermaid_parent_link) are enforced at commit time and are named
  in it_requirements so they are not discovered at the gate.

  THE REVERSE-DIRECTION DESCRIPTOR IS THE ONE THAT MATTERS AND THE ONE THAT WILL BE
  DROPPED. Checking that every named element exists is easy and is half a check: it passes
  on a diagram showing three of eight participants. Collecting what the census actually
  reads at run time and comparing against the diagram is what makes the picture a claim
  about the system rather than a subset of it.

  DEPENDS ON THE CENSUS EXISTING, LITERALLY. The everything-exists clause means this record
  cannot be built before GE-126e-1 to GE-126e-3 have landed - not as a preference but
  because there would be nothing for the named elements to resolve to. depends_on already
  says so; noting it because a driver batching documentation records together would
  otherwise pull this one forward.

  NOT AUTHORED HERE: declares_side_effect (derived per BO-2900g-2, see KI-CG-015).
