notes: |
  DECIDED DESIGN POINT: the vocabulary must LEARN rather than OSSIFY. A closed vocabulary
  with no intake path silently discards every problem kind nobody anticipated, which
  reintroduces the uncounted-defect problem one level down.

  WHY THE SUB-KEY WAS ADDED. As originally written, every unrecognised finding from one
  gate collapsed into the single identifier "unclassified/<gate>". That made the promotion
  loop unrunnable rather than merely coarse: there was exactly one unclassified identifier
  per gate, so "listed with its occurrence count in a promotion queue" degenerated to a
  one-row queue whose count was just the gate's unrecognised total, and "promote
  unclassified/pr-reviewer into pr-reviewer's vocabulary" named no actual problem kind to
  promote. A normalised-prose sub-key restores the distinction between unknowns. This is
  the same prose normalisation BO-2800b-3 defines, reused as a sub-key rather than as a
  primary identity — it does not reintroduce free-text clustering as the dedup mechanism,
  which remains barred for declared findings.

  CANONICAL SPELLING. `unclassified/<gate>` is canonical; the bare, gate-agnostic
  `unclassified` is not written. BO-400d-2 consumes this spelling and already writes the
  two-segment form (extending it to `unclassified/<phase-agent>` for failures with no
  emitting gate), which is why the sub-key is stated here as an extension that applies
  when prose is available rather than as a mandatory third segment — a mandatory third
  segment would have broken that consumer. BO-400d-2 is owned by a sibling author and is
  not edited from this tree.

  PROMOTION CHANGES THE SIGNATURE, and the original AC did not say what happens to the
  occurrences already counted under the old one. Because signature = gate + rule_id, a
  promotion necessarily retires one signature and creates another; without the mapping
  clause, "without discarding occurrences already counted" was an assertion no
  implementation could satisfy. The mapping is the migration rule.

  Distinguish the two promotions in this tree, they are different:
    - here (b-4) — promoting an unclassified rule identifier INTO a gate's vocabulary;
    - in b-5's report — promoting a high-count rule identifier to a DETERMINISTIC
      pre-commit check.
