id: INF-1200a-2
title: "The telling does not wait for something to go wrong, and is not changed by something having gone wrong"
component: infrastructure
components:
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a kind of file carries a standard, and a specialist the ownership record
    assigns that kind of file,
  When that specialist begins work in a project state in which no work of that
    kind has been produced, nothing has been submitted for checking, and that
    standard has never been breached by anyone,
  Then the standards for the kinds of file that specialist owns are already
    stated in the material it begins from,
  And given the same specialist begins work again in a project state that
    follows a breach of that same standard,
  When the material it begins from is compared with the material it began from
    before,
  Then what it is told about that standard is the same — neither introduced by
    the earlier breach, nor reworded by it, nor added to because of it,
  And given the check that would apply that standard is not currently reached at
    all, so that no breach of it can occur,
  When the specialist begins work,
  Then the standard is stated in its material exactly as before, so what the
    specialist is told is a function of what the project declares and of what the
    specialist owns, and of nothing that has or has not happened.
depends_on:
