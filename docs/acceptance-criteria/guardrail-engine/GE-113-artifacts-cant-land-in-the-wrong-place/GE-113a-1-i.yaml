id: GE-113a-1-i
title: "A test inside a nested subfolder of the configured test root is allowed"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given the configured test location is "tests/",
  And a commit stages a test file at "tests/etl/test_pipeline.py" which sits in a
    nested subfolder of the configured test location,
  When the pre-commit guard for test placement runs,
  Then the commit is not blocked by the test-placement guard,
  And no misplaced-test message is emitted for that file.
