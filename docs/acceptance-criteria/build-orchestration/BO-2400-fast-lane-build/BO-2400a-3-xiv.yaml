risk_surface: internal
notes: |
  Assumed default: an all-backfill batch has no failing test for the coder to work on, so
  dispatching it costs a run and changes nothing. If the user prefers to always dispatch
  the coder, this record changes. The rest of the backfill decomposition does not.
