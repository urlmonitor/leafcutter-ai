title: "Migration leaves zero dangling references it did not already find"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given the store before migration with a recorded count of references that
    resolve and references that already dangle,
  When the migration completes and the store is scanned for dangling references,
  Then every reference that resolved before the migration still resolves after
    it,
  And the migration introduces no new dangling reference,
  And the only dangling references reported after migration are exactly those
    that were already dangling before it.
