notes: |
  Retrospective type-specific refinement of KM-400a-3-i. Base authoring requirements,
  newer edit-hook requirements and actually present historical fields are different sets;
  metadata exposure does not rewrite historical records to satisfy newer authoring rules.
  The receipt verifies complete frontmatter/body fidelity and source-selection mutations.
  IT PO review and criterion-specific test links are recorded; declaration is not execution evidence.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
