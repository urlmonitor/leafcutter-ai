criteria: |
  Given the harness introduced by GE-119c-1 is a new architectural piece rather than a change
    to an existing one,
  When a reader opens the guardrail engine's architecture documentation,
  Then a component diagram shows the harness, the separate working copy it stands up, the
    deployed check processes it invokes, and the hook manifest it compares its coverage
    against,
  And the diagram distinguishes the harness's out-of-process invocation path from the existing
    in-process unit tests that import checks from the source tree,
  And it states which of those two paths can observe the defect class this tree addresses and
    which cannot,
  And the boundary that the source tree does not cross into the process under test is shown,
    since that boundary is the property the harness exists to enforce,
  And the diagram is reachable from the guardrail engine's component documentation rather than
    filed only under testing.
