assigned_agent: frontend-coder
estimated_complexity: M
delivers_to:
  agent: frontend-coder
  contract: 'actorLabel(actorKind: ''deterministic'' | ''llm'' | ''human'' | ''jev'') -> ''Code'' | ''AI
    agent'' | ''Person'' | ''Jev'' and cardLabel(node, stepCount) -> ''Step <order> of <step count>: <label>
    (<actor>)'' | ''Branch: <label> (<actor>)'', from one pure module. UXP-617-1-ii and the Actor facet
    use actorLabel; UXP-617-3-i addresses cards by cardLabel.'
expects_from:
  ac_id: UXP-591-1
  contract: A flow drawn at its canonical address /flows/<flow id> through app/flows/[...id]/page.tsx.
it_requirements:
- One actor-label mapping keyed by stored actor_kind (deterministic -> Code, llm -> AI agent, human ->
  Person, jev -> Jev) in a pure shared module outside components/flows/ (proposed leafcutter-web/lib/flow-finder/actor.ts),
  imported by the step and branch cards, the finder's step rows and the Actor facet. Jev is never folded
  into llm.
- 'Each card''s accessible name comes from one function: ''Step <order> of <step count>: <label> (<actor>)''
  for a step, ''Branch: <label> (<actor>)'' for a branch.'
- 'flow-nodes.tsx is 429 lines: an edit must leave it shorter than before (file-size ratchet); move the
  badge into components/flows/parts/ (2 files today) rather than growing it.'
- A node with no stored actor (the flow contract allows null) renders without crashing; what it shows
  is an open owner decision.
test_spec:
- name: decision-retrieval cards show Jev, Person and Code badges and the card names the criteria give
  target_dir: leafcutter-web/__tests__/uxp-617-3/
  framework: vitest
  type: component
  angle: criterion
  description: 'Renders leafcutter/decision-retrieval; asserts ''Step 4 of 5: Reuse it, or decide anew?
    (Person)'' and the branch name form.'
- name: actorLabel maps the four stored kinds and never returns 'AI agent' for jev
  target_dir: leafcutter-web/__tests__/uxp-617-3/
  framework: vitest
  type: unit
  angle: discrimination
  must_catch:
  - jev is folded into llm
- name: every FlowNode record's actor_label and card_label equal the shared functions' output
  target_dir: leafcutter-web/__tests__/uxp-617-3/
  framework: vitest
  type: unit
  angle: real_artifact
  description: Replays the 20 FlowNode records of docs/product-truth/mock-data/leafcutter/atlas-flows.mock.json.
- name: every step and branch card of a drawn flow carries a badge
  target_dir: leafcutter-web/__tests__/uxp-617-3/
  framework: vitest
  type: component
  angle: boundary
  must_catch:
  - branch cards are left without a badge
test_rationale: 'Tests are vitest under leafcutter-web/__tests__/, run host-side with `npx vitest run`
  (180 s timeout). Known gap: the build pipeline''s red-baseline and done-proof checks cannot read vitest
  tests yet, so build by direct phase dispatch with host-run vitest, as the UXP-591 epic was. No Playwright:
  the harness is deferred by the owner.'
test_required: true
declares_side_effect: false
