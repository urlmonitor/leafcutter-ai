notes: |
  THE CORE DELIVERABLE, IN BRAINCANDY'S WORDS (2026-10-09): "we do not just say: too
  complex, but that we say: complexity X but only Y allowed. Spawn restructuring agent
  (which should have the complexity skill). And then of course if commit agent did it, it
  would be able to spawn it. And if any other agent or human does it they would also know
  what to do."

  THE SECOND ARM IS WHY ONE TEXT MATTERS. If the agent-facing and human-facing messages
  are built separately, they drift, and the reader who is only told gets the weaker one.
  The check cannot know who committed, so it must not vary its text by committer.

  THE THIRD ARM IS THE DISCRIMINATOR. A check that hard-codes the same wording as its
  declaration passes the first two arms.

  NAMED MUTATIONS.
  (1) THE BARE VERDICT: refuse with "too complex" and no numbers. MUST GO RED: arm one's
      "complexity 31, only 30 allowed". MUST STAY GREEN: arm three.
  (2) THE COPY: print a hard-coded copy of the declared instruction. MUST GO RED: arm
      three. MUST STAY GREEN: arms one and two.
