notes: |
  NO NUMBER IS WRITTEN HERE, ON THE PARENT'S EXPLICIT INSTRUCTION, AND THE
  SUBSTITUTE IS A DERIVATION RULE. The budget is the measured post-fix baseline
  plus a recorded headroom. Both inputs live beside the result, so any later reader
  can check the arithmetic and, more importantly, can see what the suite actually
  cost on the day the budget was agreed. A bare number in a file is unfalsifiable
  six months later; a number with its baseline and date beside it is an argument.

  THE MEASURED BASELINE DOES NOT EXIST YET AND THIS AC IS BLOCKED UNTIL IT DOES.
  That is why depends_on names TQ-600a and TQ-600b rather than only the parent. The
  figures measured on 2026-09-21 — a 5387.62s run on a shared WSL host — are
  explicitly not the baseline: they predate the fix and the absolute total is
  contaminated by other activity on the host.

  THE SECOND CLAUSE IS THE ONE WITH TEETH. It is the only clause that distinguishes
  a guard which genuinely consults the record from one which reads it, ignores it,
  and compares against a literal of its own. Changing only the record and observing
  the verdict flip is the whole proof.

  THE HEADROOM IS RECORDED RATHER THAN FIXED HERE ON PURPOSE. Too tight and the
  guard fires on ordinary host variation until somebody disables it; too loose and
  it never fires at all. That trade-off needs the post-fix variance, which nobody
  has yet. Recording the value beside the baseline is what lets it be revised
  honestly rather than quietly.
