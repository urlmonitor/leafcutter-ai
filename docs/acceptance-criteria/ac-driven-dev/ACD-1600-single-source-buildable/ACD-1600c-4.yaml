title: "A requirement lists the files its work changes, each marked existing or to be created, and that list is the only answer to which files the work changes"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given requirement R declares the files its work changes as:
      scripts/ac_store/scan_ac_store.py, marked existing,
      unit_tests/ac_store/test_hold_reasons.py, marked to be created,
    and R's documentation links name docs/reference/ac-schema.md as describing the work
      and templates/agents/it-po.md as a file the work modifies,
  When the store is asked which files R's work changes,
  Then the answer is exactly scripts/ac_store/scan_ac_store.py (existing) and
    unit_tests/ac_store/test_hold_reasons.py (to be created), in the order R declares them,
  And neither documentation link is part of the answer, including the one whose link says
    the work modifies templates/agents/it-po.md,
  And adding a documentation link to R, or removing one, leaves the answer unchanged,
  And this is the one answer the store gives to every step that asks which files a piece of
    work changes -- the requirement rule check and the file-aware pre-pass included -- with no
    second answer derived from documentation links.
