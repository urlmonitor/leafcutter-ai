documentation_rationale: "No new user-facing surface — a configuration contradiction stops occurring. The affected instructions already exist and are unchanged."
notes: |
  WHY THIS IS A SIBLING OF AR-200a AND NOT THE SAME AC.

  AR-200a derives the obligation from the SIGN-OFF protocol: an agent required to
  record a verdict must hold a write-capable tool. Its three instances all carry
  `signoff: true`.

  This L1's obligation source is different and more literal: the template BODY
  names a specific tool as the way to perform a mandatory step. The three
  instances -- product-owner, business-analyst, it-po -- all carry
  `signoff: false`, so AR-200a's rule does not reach them and never would have.
  They are outside its derivation by construction, not by oversight.

  THE INSTANCE. Each of the three carries a "parent covered_by update" section
  marked mandatory, implementing ac-schema S6b, and each says in so many words to
  use an `Edit` call that modifies only the `covered_by` field. None of the three
  listed `Edit` in `tools:`. Four authoring agents run consecutively on
  2026-08-26 hit this; all four fell back to rewriting the whole parent file with
  `Write`.

  WHY THE FALLBACK IS NOT EQUIVALENT, which is the whole reason this is worth an
  AC rather than a tidy-up:

    - `Edit` requires an exact match on the text it replaces, so it fails closed.
      `Write` replaces the file wholesale and cannot fail that way.
    - AC YAML files are untracked until committed. A truncating `Write` on a file
      that has never been committed is unrecoverable -- there is no `git checkout`
      to fall back to.
    - It nearly happened: one of the four leaked stray markup into a file tail on
      its first `Write` and caught it only on a manual inspection it was not
      obliged to perform.
    - The usual proof that a rewrite was surgical, `git diff --stat`, is VACUOUS
      for an untracked file. It reports nothing whether the file survived intact
      or was emptied. So the natural check does not cover the natural risk.

  BINDING CONSTRAINT ON ANY FIX, inherited from AR-200a-1's constraint 1 and
  restated because it is easy to get backwards here: GRANT THE CAPABILITY, DO NOT
  DELETE THE INSTRUCTION. Removing the "use an Edit call" line from the three
  templates would make the rule pass while leaving the agents doing whole-file
  rewrites on unrecoverable files -- trading a caught contradiction for an
  uncaught hazard. The instruction encodes the safe route; it is the thing to
  preserve.

  DERIVE BOTH SIDES. The rule must be derived from the templates themselves, not
  written against these three names. AR-200a-1's evidence is the precedent: a
  derived rule found five violators where the incident report named three. The
  value here is the fourth instance nobody has noticed.
