id: BO-2400a-1-v
components:
  - build_orchestration
title: "The fast lane's claim command is run by the dedicated command-step executor, and a refusal to run it cannot be mistaken for the store reporting a hold"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the fast lane must run a command that changes the acceptance-criterion store,
  When it dispatches that command step,
  Then the performer it dispatches to declares that it is permitted to run commands,
  And that performer's role does not give it grounds to decline the request,
  And the reply is read as the command's own output rather than as the performer's
    account of what the output meant,
  And a performer that ran nothing is reported as not having attempted the claim,
  And a performer's reply cannot assert that the set is held by another run unless
    the command itself named the held members.
depends_on: [BO-2400a-1-i]
doc_links:
