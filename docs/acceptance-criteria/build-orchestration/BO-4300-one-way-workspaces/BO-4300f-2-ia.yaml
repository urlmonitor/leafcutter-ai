it_requirements:
- 'Surfaces: templates/agents/*.md (worktree-agent.md''s create-only/setup-ticket recipe and its wrong
  ticket_path_new field; any agent that probes or removes workspaces), templates/skills/*/SKILL.md (feature
  epic recipe, building-epics'' direct `git worktree remove` fallback and non-halting pre-drive probe,
  build-feature-ops-notes'' `git worktree add --detach /tmp/base`, ship''s `git worktree remove`, quick-fix''s
  two-location lookup), templates/workflows/*.md (close-worktree.md, build-backlog.md, worktree.md), and
  the project rules file CLAUDE.md.'
- 'CLAUDE.md (item routed here): replace ''Worktree pre-commit config (MANDATORY for worktree-based drives)''
  -- its fail-open `ls .pre-commit-config.yaml || ls .leafcutter` check and its symlink-preferred Option
  A / copy Option B fixes -- with ''run the maker''; delete the ''.security-allowlist resolves via the
  symlink target'' latent-hazard paragraph and the BOTH-copies dual-update instruction in ''Security Allowlist
  -- Use Glob Patterns'' (with real install files the hook reads the workspace''s own allowlist; decision
  memo Q2); rewrite the ''Prefer the symlink instead'' advice in the feedback_categories section. The
  ''Land the scaffold commit on origin/main'' section stays true (base is origin/main) but points at the
  maker instead of worktree-agent.'
- Every rewritten passage points to the maker and to docs/how-to/get-a-workspace.md; none keeps its own
  copy, clone, worktree, link, install or delete steps.
- Template edits reach consumers only through the build; the repo's own CLAUDE.md is edited directly (it
  is not a template).
- 'TICKET LOCATION (KI-BO-20260925-build-single-ticket-treats-ticket-path-final-as-worktree-path; routed
  from BO-4300a-1-ii, lands in the SAME change set as it): templates/agents/worktree-agent.md stops parsing
  and reporting ticket_path_new (a field the set-up script no longer emits) and reports the ticket''s
  working location ONLY from ticket_path_in_worktree of the maker''s ok answer; no charter, skill or workflow
  text describes ticket_path_final or the path a caller passed in as "the ticket inside the workspace".'
- 'Commit spelling (KI-CG-20260925-commit-delegation-hook-misses-git-dash-c): no passage this record rewrites
  spells a commit as `git -C <path> commit`, because the commit-delegation hook matches only the literal
  "git commit"; commits are delegated to the commit agent per CLAUDE.md, and -C appears only with non-commit
  verbs.'
test_required: true
test_spec:
- name: test_deployed_instruction_passages_about_workspaces_point_to_the_maker
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: unit
  angle: deployed
  description: Every workspace passage in the deployed agent charters, skills and workflow texts, and
    in CLAUDE.md, names the maker and the get-a-workspace how-to (text is this record's subject, so reading
    the delivered text is the behaviour).
- name: test_no_deployed_instruction_carries_its_own_workspace_recipe
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: unit
  angle: criterion
  description: None of those texts contains a workspace clone, git worktree add/remove, ln -s / cp of
    .leafcutter or .pre-commit-config.yaml, EnterWorktree, or a manual rm of a workspace.
- name: test_deployed_texts_take_the_ticket_location_only_from_ticket_path_in_worktree
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: unit
  angle: criterion
  description: The deployed worktree-agent charter, and every deployed skill or workflow text that names
    a ticket location from a workspace answer, name ticket_path_in_worktree and contain no ticket_path_new
    or ticket_path_final (delivered text is the subject).
test_rationale: The record's subject is delivered text (its notes say so), so the proof reads the DEPLOYED
  text rather than the templates, catching a template fix that never reaches an install.
