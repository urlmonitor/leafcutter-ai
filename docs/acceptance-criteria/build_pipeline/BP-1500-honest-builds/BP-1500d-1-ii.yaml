notes: |
  WHY THIS IS A SEPARATE RECORD AND NOT A CLAUSE ON AN EXISTING ONE. Three
  candidates were assessed against one question: can that candidate go fully
  green while this defect stands? All three can, and each for a different and
  structural reason rather than for want of a stricter test.

    BP-1500d-3, the unproducible-record floor. It scopes this out in writing,
    twice -- once in it_requirements ("OUT OF SCOPE AND NOT A SUBSTITUTE -- THE
    RELATIVE FORM OF THE SAME ESCAPE") and once in notes ("A SECOND FAIL-OPEN
    FOUND WHILE PROBING, NOT COVERED BY THIS AC, FILE IT SEPARATELY"). That is
    not an oversight to be corrected by folding this in: -3's whole subject is
    the build's VERDICT when no truthful account exists, and here an account
    does exist -- it is simply false. Its trigger raises and this one does not,
    so -3's fixture cannot be made red by this defect at all.

    BP-1500d-1-i, the producing-end truthfulness sibling. Its criteria close by
    saying, in terms, that it concerns only what the record says about the
    producing end. The positions of the files the build PUT INTO the project are
    the receiving end. A record can describe its producing package impeccably
    and still name a deployed file that is not in the project.

    BP-1500d-2, "the record still reads after the project is moved". Assessed
    most carefully, because a position pointing outside the project is, loosely
    described, a record that has stopped meaning what it said. It is not the same
    thing. -2's verdict is a comparison between two locations -- true where
    written, still true where read -- and this entry is false in both. Its
    reading would have to already reject the entry before the move for the move
    to change anything, and rejecting it before the move is precisely what no
    existing record requires. -2's own negative control points the other way: a
    record "keyed to the location the record was written in", i.e. carrying too
    much context rather than escaping.

  THE PARENT IS THE CLOSEST CALL, AND IT IS WHY THIS SITS UNDER BP-1500d-1
  RATHER THAN ELSEWHERE. The parent's clause -- entries "name the artifacts that
  are actually present in that project" -- is the right sentence, and this AC is
  a refinement of it rather than a new subject. Two things stop the parent from
  reaching this on its own, and the second is the one that matters. First, its
  it_requirements pin that clause's gloss to the entry set being non-empty, which
  measures quantity, not location. Second, and decisively: an entry whose position
  steps out of the project still ARRIVES at a real file, so any reading that asks
  "is something there?" is satisfied by it. Following the parent's clause to the
  letter -- present IN THAT PROJECT -- is what catches this, and that reading has
  to be specified, because the weaker one is both easier to write and green.

  THE PROOF SHAPE, AND THE THREE WAYS IT CAN GO VACUOUS. This AC's Then clauses
  are written against the three shortcuts available to an implementer here, all
  of which produce a green run.
    - Existence-only reading. Asking whether a file is present at the end of each
      position passes on the exact entry this AC rejects, and passes MORE readily
      in the self-host layout, where the place a position escapes to is a
      directory full of real files. Hence the clause requiring the arrival point
      itself be tested for being inside the project.
    - Reading nothing. A per-entry check over a record with no entries is green.
      Hence the clause requiring each clean run to report the set of entries it
      examined and that set to be non-empty. This is the same defence the parent
      already carries for its own vacuity risk, restated here because this AC's
      reading is a different one.
    - Closing it by refusing. Rejecting the destination outright, or dropping the
      offending entry, or substituting some other position for it, each converts
      this into a build that refuses more than it should -- which BP-1500d-3's
      it_requirements forbid by name, and which has already been shipped once in
      this family. Hence the clause requiring an ordinary build, with every
      managed file inside the project, to still succeed and still record those
      files. Two acceptable outcomes are offered in the first Then clause so the
      implementer is not forced toward a refusal to satisfy the criterion.

  ON THE ACCEPTABLE-OUTCOMES CLAUSE, since a reviewer will reasonably ask whether
  it weakens the AC. It does not, because the second Then clause binds regardless
  of which outcome the build chooses: no entry may point outside the project, in
  either case. What the first clause avoids is prescribing HOW -- failing the
  build, as -3 does for its own trigger, and omitting the untruthful entry are
  both honest, and choosing between them is an implementation judgement that
  belongs with the coder and the it-po, not in the behaviour. What is NOT
  acceptable, and is excluded by the clauses that follow, is recording the file
  as though it sat inside the project.

  MEASURED FIGURES, WITH METHOD AND DENOMINATOR -- AND A WARNING ABOUT THEIR
  SHELF LIFE. Measured 2026-09-07 on branch fix/carried-followups, built from
  origin/main at 004bf9e87. Reported by the run that found the defect: a build
  whose managed file escapes the receiving project by a relative parent step
  exits 0, writes a record carrying 472 output-mapping entries, and leaves the
  record's failure field empty -- the denominator being every output mapping that
  build produced, i.e. the full record, of which one entry is the escaping one.
  The comparison figure, from the same family's earlier measurements on the same
  date: an ordinary out-of-package build also produces 472 entries with an empty
  failure field, which is exactly why the escaping build's report is
  indistinguishable from a healthy one. The 472 is a property of this repository's
  current template inventory on this date and will move with any change to it; it
  is recorded to convey that the record is FULL rather than empty, and no test
  should assert on the number. Independently confirmed on the same date that the
  path library does not normalise a step back out of a directory: relativizing
  such a destination against the project root succeeds and yields a position that,
  followed, arrives outside the project.

  WHY THE ABSOLUTE AND RELATIVE FORMS DIVERGE, stated once so nobody re-derives
  it. The two are the same intent expressed two ways, and the build treats them
  as unrelated: the absolute form has no expression as a position inside the
  project, so relativizing it raises, the whole record is discarded, and -3's
  exit path fires. The relative form relativizes without complaint. There is no
  error, no warning, and nothing for any exit path to consume -- which is why
  this one has to be caught by looking at where a position LEADS rather than by
  catching a failure. It is the same defect wearing the successful build's
  clothes, and it is strictly the more dangerous of the two: the absolute form
  costs a build, the relative form costs the truth of every check that later
  reads the record.

  FOR THE IT PO. Three things this record deliberately leaves open. (1) The
  concrete configuration key that delivers the escape is not named in the
  criteria, on purpose -- BP-1500d-3 names two candidates in its own test_spec
  and pins one, and the same discipline applies here; whichever is chosen, carry
  -3's config-was-read proof, because the build reads its configuration from a
  path inside the project's tool directory and a fixture that writes the
  top-level path configures nothing and returns a false green. (2) The choice
  between the two acceptable outcomes needs to be made once, in it_requirements,
  and then held -- a test that accepts either on a per-run basis cannot detect a
  build that flips between them. (3) The negative control needs a record whose
  escaping entry the reading did not itself create; hand-editing the record the
  real build wrote is the cheapest honest way, and is the same delete-and-restore
  attribution discipline the rest of this family uses.
