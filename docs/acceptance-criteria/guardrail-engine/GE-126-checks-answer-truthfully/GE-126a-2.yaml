notes: |
  THIS IS THE SECOND MANDATORY ARM and the L1 calls it the only one that separates
  "honoured your argument" from "ignored it and found nothing to complain about". An
  implementation that quietly drops the command line still passes GE-126a-1's clean
  control run; it cannot pass this.

  THE MIXED-TARGET CLAUSE IS DELIBERATE AND IS NOT DECORATION. The obvious repair for
  an unresolvable target is to abort the run. That converts a fail-open into a
  fail-closed while still inspecting nothing, which is this goal's defect wearing the
  opposite sign. Requiring both facts from one run — the violation refused AND the
  unresolved target named — forces the implementation to keep inspecting what it can
  reach while still reporting what it could not.

  THE BOUNDARY THAT MUST NOT MOVE lives in GE-126a-2-i: naming no target at all in a
  scope where nothing matches is an ordinary pass. This criterion fires on targets that
  were NAMED and not resolved. A fix that makes empty-scope runs fail breaks every
  commit-time invocation of the AC check family and is the regression to watch for.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET, not because this criterion is
  terminal. DO NOT REFILL from the BA stage — see BP-1100b-5.

