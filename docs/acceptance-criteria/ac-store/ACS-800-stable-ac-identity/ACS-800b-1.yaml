notes: |
  Decomposed from ACS-800b. Defines the parent-pointer metadata field (PROJECT_CONTEXT
  uses parent_uid as the example name; the exact field name is finalized by IT-PO and
  added to config/ac_store_schema.json, which is currently additionalProperties:false
  and does NOT yet carry this field). The pointer holds the parent's stable UID from
