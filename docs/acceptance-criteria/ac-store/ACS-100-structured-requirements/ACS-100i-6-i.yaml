notes: |
  This is the criterion that distinguishes "narrowed" from "switched off". The
  third scenario is the load-bearing one: at 9b16d013 the object branch of
  `it_requirements` already carries its own `required` list of all five fields,
  so a half-populated object is refused today regardless of the top-level
  if/then. That behaviour must survive the change untouched. If the
  implementation reaches the narrowing by loosening the object branch instead of
  by narrowing the `if`, this scenario fails.

  AMENDMENT (2026-09-25, ACD-2500): a fourth scenario admits the explicit "reference file
  pending" marker from ACD-2500d-2-i. It keeps the intent above — the marker is explicit and
  schema-declared, so it is not a silent half-populated spec. depends_on ACD-2500d-2-i.
  readiness stays draft and work_status stays todo (unchanged by the amendment).
