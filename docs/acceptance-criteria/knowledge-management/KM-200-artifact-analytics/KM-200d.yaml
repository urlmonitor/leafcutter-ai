criteria: |
  See which kinds of work are outrunning your ability to finish them.

  For each kind of thing the project produces you can see how what is arriving
  compares with what is being finished, and which way that comparison is moving
  over time — so a class of work that is steadily accumulating is called out while
  it is still a trend, instead of being discovered months later as a pile.
