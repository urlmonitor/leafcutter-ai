id: KM-400b-2-ii
title: "The publication count check expects what the store keeps for that snapshot, and still fails a real shortfall"
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: done
parent: KM-400b-2
criteria: |
  Given valid generation A is active for the repository
  And the proposed snapshot holds 10,700 nodes and 28,814 relationships with 28,814 distinct relationship identities
  When the snapshot is published and the store keeps all 10,700 nodes and 28,814 relationships for the new generation
  Then the count check compares 10,700 kept nodes against 10,700 expected and 28,814 kept relationships against 28,814 expected
  And the count check passes
  And the new generation becomes the active generation
  And the publication result states the expected and kept count for nodes and for relationships

  Given the proposed snapshot was loaded with 28,815 relationships of which 28,814 are distinct
  When the snapshot is published and the store keeps 28,814 relationships for the new generation
  Then the expected relationship count used by the count check is 28,814, the number of distinct relationship identities, not 28,815
  And the count check passes

  Given the proposed snapshot holds 28,814 distinct relationships
  When the snapshot is published and the store keeps only 28,813 relationships for the new generation
  Then the count check fails
  And the failure names relationships as the mismatched kind and states 28,814 expected and 28,813 kept
  And generation A remains the active generation and remains retrievable
depends_on: [KM-400b-2, KM-400b-2-i]
