id: INF-100
readiness: reviewed
priority: medium
title: "Agents work without manual intervention"
component: infrastructure
level: L0
status: active
criteria: |
  Every agent has the context it needs to do its job without human handholding.

  When an agent is dispatched, it arrives with the right project conventions,
  account credentials, and writing standards already loaded. You never have
  to babysit an agent through setup steps it should handle on its own, and
  you never discover after the fact that it used the wrong account or
  ignored project norms.
