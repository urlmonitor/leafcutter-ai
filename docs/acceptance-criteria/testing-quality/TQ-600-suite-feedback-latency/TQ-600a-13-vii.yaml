id: TQ-600a-13-vii
components:
  - testing_quality
title: "A held pull request carries one explanatory comment, updated in place and never duplicated"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a pull request that TQ-600a-13-vi holds because an issue labelled `nightly-red` is
    open,
  And the reason the comment exists: a failing status alone tells the author their PR is
    blocked but not that the cause is outside their change, and an author who cannot see
    that will start debugging their own diff,
  When the check evaluates the held pull request for the first time,
  Then exactly one comment is created on it, containing: the failing node ids from the
    flag's most recent night, the date the flag was raised (red since), a link to the
    flag issue, and the commit range that issue carries,
  And when the check evaluates the same pull request again while it is still held — on a
    later push, or after a further red night has changed the failing set — that same
    comment is edited to carry the current contents, and the number of comments the
    check has authored on the pull request remains one,
  And a comment written by anyone else, including another automated comment, is never
    edited or removed by the check,
  And the comment is demonstrated by executing three evaluations of one held pull request
    against a recording double of the comment service — the second after the failing set
    has changed — and observing one create, then two edits of that comment, and no second
    create.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-vi
