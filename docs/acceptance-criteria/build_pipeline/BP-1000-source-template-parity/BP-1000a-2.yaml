assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "This is the exact KI-2 regression to reproduce: the jscpd hook (check_duplicate_code.py) source gained the GE-100c measured%/threshold% logic and the templates/ copy was not synced, shipping a downgraded copy caught only post-merge. The gate must turn that scenario into a hard block at finalize time."
  - "Wire the gate as a pre-merge step in the finalize-feature workflow (templates/workflows-js/finalize-feature.js): it runs against the final worktree state after origin/main is merged in (Step 2) and BEFORE the PR is merged to main (Step 4). A drift verdict HALTs the workflow with a non-success status, mirroring the existing test-regression HALT in Step 3 — do not auto-fix or auto-sync."
  - "finalize-feature is a workflow (.js) — assigned_agent finalize-feature is is_ticket_phase:false and not dispatchable; the .js workflow-body edit plus any Python script glue is python-coder work, not an agent-template prose change."
  - "Re-running the gate after the template copy is restored to byte-identical must pass deterministically with no residual state (idempotent; no caching that could mask a subsequent re-drift)."
  - "Must surface the blocking outcome through the workflow's existing HALT/return contract (a non-ok status with the drift summary), not by raising an unhandled exception."
