notes: |
  Pins the move-vs-presence distinction. The deployed
  _check_done_folder_prohibition currently over-fires on path presence
  (any staged file whose path contains done/) rather than on an actual
  path change into done/. This edge case fixes the false positive: a
  ticket that has legitimately lived under done/ since a prior commit
  must remain editable in place.
