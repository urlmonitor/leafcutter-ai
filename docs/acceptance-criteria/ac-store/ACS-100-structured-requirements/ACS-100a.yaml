criteria: |
  Each AC YAML file's individual fields are validated before a commit is allowed.
  Required fields must be present and non-empty, the ID field must match its
  naming pattern, and enum fields like status must contain only allowed values.
  Validation runs at commit time and produces clear diagnostics identifying
  the offending field, value, and file path.
