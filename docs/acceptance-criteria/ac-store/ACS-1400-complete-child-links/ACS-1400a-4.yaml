title: "A deliberately parked tree is exempt by its own signal, and the stricter rule refuses to ship without that exemption"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a deliberately parked tree whose parent records no children on purpose and
    which carries the author-set parked signal and the reason the author gave,
  And an unmarked tree whose parent omits a child it really has,
  When a commit staging a child from each is checked at the moment it lands,
  Then no child of the parked tree is reported as a violation,
  And each child of the parked tree is reported as an exemption naming the record
    and the parked reason its author gave,
  And the child of the unmarked tree is reported as a violation in that same run,
  And when the same commit is checked in a build where the parked signal is not
    recognised, the check run fails and names the missing parked signal, rather
    than reporting the parked tree's children as violations.
