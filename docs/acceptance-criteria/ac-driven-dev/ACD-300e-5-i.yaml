title: "Agents do not block when the knowledge graph is entirely empty (fresh project)"
component: ac-driven-dev
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a freshly installed project where paths.json exists but no surfaces
    contain any indexed nodes (zero agents, zero tickets, zero docs, zero skills),
  When any of the three authoring agents invokes knowledge-query during S1
    without a keyword filter (requesting the full graph),
  Then the knowledge-query script returns an empty node list with zero nodes
    and zero edges,
  And the agent treats the empty result identically to a "no matching nodes"
    result (logs the assumption and proceeds),
  And the agent does NOT prompt the user with "the knowledge graph is empty —
    should I continue?" or any equivalent confirmation,
  And the agent produces valid AC output using only its file-based
    context reads (S0 memory files, component docs, AC store files),
  And the absence of graph context does not cause any field in the output
    AC YAML to be left blank or set to a placeholder value.
