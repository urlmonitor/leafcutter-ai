id: BO-400e-3-iii
title: "Every ticket and acceptance criterion outside the closable set reads exactly the same status after the closure as before it"
component: build-orchestration
components:
  - build_orchestration
  - finalize
  - ac_store
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
criteria: |
  Given an epic branch "EPIC-Alpha" whose closable set is the ticket "alpha-02.md" and its
      source acceptance criterion "BO-9100a-2"
    And before finalization starts, the status of every other ticket and acceptance criterion
      in the store is captured -- including the epic's own siblings "alpha-01.md" (todo),
      "alpha-03.md" (in_progress) and "alpha-04.md" (done), the acceptance criteria
      "BO-9100a-1" (todo) and "BO-9100a-3" (in_progress), and records of other epics such
      as "beta-01.md" (todo) and "BO-9200a-1" (todo)
  When finalization finishes its closure step and its closure commit exists
  Then re-reading the same records gives a status equal to the captured one for every record
    outside the closable set -- "alpha-01.md" todo, "alpha-03.md" in_progress, "alpha-04.md"
    done, "BO-9100a-1" todo, "BO-9100a-3" in_progress, "beta-01.md" todo, "BO-9200a-1" todo
    And this holds for records that are parents of a closed acceptance criterion as well:
      a parent's own recorded status is not set to done by the closure of one of its children
    And only "alpha-02.md" and "BO-9100a-2" read done that did not read done before

  Given the same capture, and a closure that changed the status of "alpha-01.md" as well
  When the before and after states are compared
  Then the difference names "alpha-01.md" with its before and after status
    And that difference is reported by the finalization run as a closure that went outside
      its set, not passed over in silence
  Because a false "done" looks exactly like a real one once written, and the only way to know
    a closure leaked nothing is a captured before-state compared with the after-state -- a
    recollection of what used to be open proves nothing, since the whole failure is a write
    nobody noticed.
