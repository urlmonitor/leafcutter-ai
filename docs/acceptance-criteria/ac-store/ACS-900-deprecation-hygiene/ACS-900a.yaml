title: "Retiring a requirement triggers a check that its claimed code is gone"
component: ac-store
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  Change a requirement to retired and the system checks its implementing code is gone.

  When an AC's status changes to deprecated or superseded, the system inspects
  the source files that AC listed as its implementation and determines whether
  that code has been removed or no longer references the retired behavior.
