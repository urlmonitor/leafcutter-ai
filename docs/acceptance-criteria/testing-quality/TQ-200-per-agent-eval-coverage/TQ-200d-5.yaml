  assertion-kind reference page under TQ-200d-1, which introduced the
  produced-tests mode and its kind registry.

  NOT RE-PLANNED. The test-designer side (TQ-500f-2-ii) is already an approved
  AC built separately.

  IT-PO (2026-10-30).
    - Re-scoped against main: TQ-200b-1-i (merged after the KI was filed) already moved
      the template to a prompt file for label and artifact runs. Remaining: the
      transcript invoker, the row input on argv in all three invokers, and one shared
      builder. The KI is resolved here, naming both ACs.
    - Decided: prompt-file flags for the instructions (confirmed on CLI 2.1.205), stdin
      for the input, temp file in the OS temp directory, new sub-package
