id: KM-500a-4-x
title: The S1 data run is recorded per file and producer, and S1 is locked in a commit before any scored run
component: knowledge-management
components:
- knowledge_management
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-500a-4
criteria: |
  Given the S1 data run has been carried out at one pinned Git revision
  When S1 is checked before its first scored run
  Then these exist at that revision, and each one records the dispatch or person that produced it: the case file and the holdout file, the reviewer A judgment file, the reviewer B judgment file, the adjudication record, the oracle and the set lock
  And the case file and the holdout file were produced by one case-drafting dispatch, which records that it saw no run report, no system output, no expected outcome and no host or catalog prompt text being tuned
  And the reviewer A and reviewer B judgment files were produced by two separate reviewer dispatches, each recording its own dispatch identity, the pinned revision and the Git bytes it read at that revision, and neither recording the other's judgment, a run report or system output among its inputs
  And every case on which the two judgments disagree appears in the adjudication record either with the user named as adjudicator and the user's reason, or as dropped from S1, and the report states the adjudicated count and the dropped count
  And the provenance check refuses the whole set, naming the file and the reason, when any of these holds: a file records no producer; the case file and a reviewer judgment file name the same dispatch; both reviewer judgment files name the same dispatch; a reviewer judgment names a revision other than the pinned one; an adjudication names anyone other than the user as adjudicator; a file names a ticket-phase build agent, such as the coder or the test writer, as its producer
  And the set lock is committed in a commit that comes before the commit of any S1 run report, scripted or real
  And a scored run attempted while no committed set lock exists is reported not_run with the unmet prerequisite "S1 not frozen" and contributes no figure to any S1 result.
