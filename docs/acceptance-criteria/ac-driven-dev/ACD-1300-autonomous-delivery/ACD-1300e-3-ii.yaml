criteria: |
  Given a planning run with no person attached reaches its business-analyst decision point
    while working in a workspace made by the workspace maker, with drafted criteria on disk,
  And the run must write its pause record and read it back, and a later resume must look the
    record up, read it, clear it and read back the clearing,
  When each of those six steps is sent out,
  Then each request carries exactly one command line, which names every location it acts on
    by absolute path and does not change directory, join two commands, branch on the result
    of an earlier command, or run a nested command,
  And each request goes to the agent whose only role is to run one given command unchanged
    and relay its output word for word, and to no agent whose role is creating and removing
    workspaces, investigating ticket state, or running the fast lane's own command steps,
  And the result each step acts on is read from that one command's own outcome and output as
    relayed in the reply,
  And any further step of the run that reads the pause store (for example a scan for leftover
    pause records) follows the same two rules,
  And the pause ends with the run reported as waiting and its record present in that
    workspace's pause store, and a resume started from that same workspace finds the record
    and applies the person's answer,
  And a run started from a linked worktree of the project still writes to and reads from the
    project's own pause store, exactly as ACD-2100a-4 requires,
  And the bug symptom ("on run finalize-gate-child-1, 2026-10-25, the gate-ba pause-store write
    was sent to the worktree agent as one line chaining a directory change, a fallback and a
    nested command; it declined both because writing a pause record is neither create nor
    remove and because the line was a compound command, so no record was written and the run
    ended pause_persist_failed and could not be resumed") must not occur.
