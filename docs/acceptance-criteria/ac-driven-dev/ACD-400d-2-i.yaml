work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given four pieces of work are ready to be picked up and all record the same
    urgency: one records a size of S, one the largest recognised size XL, one records
    no size at all, and one records a size written in a form outside the recognised
    set (for example the word "Medium" where the recognised form is "M"),
  When the queue is asked which work is ready,
  Then the S piece is offered first and the XL piece second — every recognised size,
    including the largest, is ranked ahead of both unreadable ones,
  And the piece with no size and the piece with the unwritable size are offered last,
    placed relative to each other by identifier alone,
  And both are offered: a size the queue cannot read moves the work down the offer
    and never removes it from the offer.
