    framework: unittest
    type: unit
    angle: criterion
    description: "BO-2400f-13 resolved from its component root and from a feature folder beneath it yields the identical key."
  - name: TestAcKey::test_returns_the_identifier_stem
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "A store path resolves to the bare identifier stem, ACS-100, and not to the path."
  - name: TestAcKey::test_moved_criterion_is_not_counted_as_filed
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: seam
    description: "The same identifier resolved at two different paths across a period, still done at both ends, feeds ac_deltas and yields filed 0, done 0 and reopened 0."
  - name: TestAcKey::test_registry_index_is_not_a_criterion
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "The component registry index.yaml resolves to None, so a registry never enters the counts."
  - name: TestAcKey::test_non_yaml_is_not_a_criterion
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "A prose file in the store, PROJECT_CONTEXT.md, resolves to None."
  - name: TestCollectCycleTimes::test_age_is_measured_from_first_appearance_to_period_end
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "A criterion born 2026-08-20 and closed within a period ending 2026-08-26 reports a single age of 6 days."
  - name: TestCollectCycleTimes::test_already_done_criteria_are_excluded
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "A criterion done at both ends of the period contributes no age, because it was not closed during this period."
  - name: TestAcBirthDates::test_birth_is_the_first_add_not_the_latest_write
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Drives ac_birth_dates against a real temporary git repository: a file added on 2026-08-01 and edited on 2026-08-15 reports its birth as the earlier add date, not the later write."
  - name: TestAcBirthDates::test_moving_a_criterion_does_not_reset_its_age
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "A criterion deleted in one commit and re-added under the same identifier inside a feature folder in a later commit -- a non-atomic move, which git does NOT fold into a rename -- reports its birth as the original add date."
  - name: TestAcBirthDates::test_earliest_of_two_add_records_wins
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "The same identifier added, deleted and re-added at the same path across three commits reports the EARLIEST add date, proving the newest-first git log walk keeps the earliest record per key rather than the first one encountered."
  - name: TestAcBirthDates::test_registry_index_is_excluded_from_the_index
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: integration
    angle: boundary
    description: "A commit adding both index.yaml and AC-3.yaml produces a birth index containing AC-3 but not index."
  - name: TestAcBirthDates::test_repository_with_no_store_yields_an_empty_index
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: integration
    angle: boundary
    description: "A repository with no acceptance-criteria store at all yields an empty birth index rather than raising."
test_rationale: |
  The move scenario is the one that decides whether the whole trust tier can be
  trusted, so its descriptor deliberately does not stop at the key comparison: it
  feeds the two resolved keys into ac_deltas and asserts the movement counts,
  which is the observable a path-keyed implementation would get wrong. Asserting
  only that two calls return equal strings would pass on a resolver that was
  never actually used by the counting path. Direct-import unit tests are the
  right shape for ac_key and collect_cycle_times because both are pure over
  literal inputs.

  FORMERLY A DECLARED GAP, CLOSED 2026-08-31: the it_requirement covering
  ac_birth_dates — that the index is built in one history pass and keeps the
  EARLIEST add per identifier — used to have no descriptor here, because no
  test in the suite executed ac_birth_dates; the cycle-time tests only ever
  injected a births mapping directly. TestAcBirthDates now drives
  ac_birth_dates against a real temporary git repository instead:
  test_birth_is_the_first_add_not_the_latest_write proves the criterion clause
  "measured from the criterion's first appearance, not from the last time its
  file was written" for the PRODUCER, not just the consumer;
  test_moving_a_criterion_does_not_reset_its_age and
  test_earliest_of_two_add_records_wins prove the earliest-add-wins
  aggregation across a non-atomic cross-commit move and a delete/re-add at the
  same path; test_registry_index_is_excluded_from_the_index and
  test_repository_with_no_store_yields_an_empty_index prove the two boundary
  cases. The green suite is now proof of that clause. The one thing these
  tests deliberately do NOT close is the atomic single-commit rename case —
  that is a known, accepted limitation, restated with the corrected direction
  of bias in this record's it_requirements and notes (previously it was
  mis-described as making a renamed criterion "read as newly born"; the
  measured behaviour is the opposite — the closure is skipped from the sample
  entirely).
delivers_to:
  agent: python-coder
  contract: "Store identity and age primitives consumed by INF-500e-1's movement computation and by the velocity tier: ac_key(path: str) -> str | None returning the identifier stem or None for index.yaml and non-YAML; work_status_at(repo: Path, rev: str) -> dict[str, str] mapping identifier to work_status at a revision, empty when the store did not exist there; ac_birth_dates(repo: Path, ref: str) -> dict[str, date] mapping identifier to earliest appearance; collect_cycle_times(after, before, births, period_end) -> list[int] of ages in days, one per criterion newly closed, possibly empty."
