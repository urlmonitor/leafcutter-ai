id: BO-610-4-i
title: "Ticket with change_target but missing risk_surface is rejected"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket file has change_target: code (a valid value)
    but the risk_surface field is entirely absent from the frontmatter,
  When the frontmatter validation runs,
  Then it rejects the ticket with an error message:
    "Missing required field 'risk_surface'. Both change_target and risk_surface must be present."
  And the ticket cannot proceed to the guardrail engine

  Given a ticket file has risk_surface: internal (a valid value)
    but the change_target field is entirely absent from the frontmatter,
  When the frontmatter validation runs,
  Then it rejects the ticket with an error message:
    "Missing required field 'change_target'. Both change_target and risk_surface must be present."
  And the ticket cannot proceed to the guardrail engine

  Given a ticket file has both fields entirely absent from the frontmatter,
  When the frontmatter validation runs,
  Then it rejects the ticket listing both missing fields in a single error message
