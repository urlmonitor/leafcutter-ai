risk_surface: internal
test_spec:
  - name: test_doc_index_links_use_forward_slashes_in_table_and_single_file_sections
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Builds a temp repo whose docs/ holds architecture/adrs/ADR-001-self-hosting-boundary.md (a table-section entry three folders deep), architecture/components/ac-driven-dev.md, retrospectives/EPIC-ACDrivenDevelopment.md and glossary.md (the single-file Glossary section); calls generate_doc_index.generate_index(repo_root); extracts every [text](target) pair; asserts the ADR row's link text is exactly docs/architecture/adrs/ADR-001-self-hosting-boundary.md, the Glossary entry's link text is docs/glossary.md, and no link text or target contains a backslash. Fails red on the current code on a Windows host, where both sites render str(WindowsPath) with backslashes."
  - name: test_doc_index_links_forward_slash_under_simulated_windows_path_flavour
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Same fixture, but patches the generator's repo-relative path computation so it returns a PureWindowsPath (backslash-stringifying) for every entry; asserts one table-section entry and the Glossary single-file entry both still carry forward-slash link text and target and no backslash anywhere inside [..] or (..). Makes the defect red on a POSIX CI host too; a half-fix covering only one rendering site stays red."
  - name: test_doc_index_links_identical_across_path_flavours
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Generates the same fixture once natively and once under the simulated Windows path flavour and asserts the extracted link text/target lists are equal character for character."
test_rationale: "The defect is a stringification at two rendering sites, so a direct-import unit test over a temp docs tree is the tightest proof. A test on a real tree alone is red only on a Windows host; the simulated PureWindowsPath case makes it red on POSIX CI as well, and asserting one table entry plus the Glossary entry stops a half-fix (one site only) from passing."
notes: |
  The /quick-fix target for the known defect. Per the KM-300a L1 note, BOTH
  link-producing sites must be covered: the single-file sections AND the
  directory-table rendering. A test that exercises only one section passes
  against a half-fix — the test must include at least one table-section entry
  and one single-file-section entry, generated with a Windows-style path
  flavour so it fails red on a POSIX CI host too.
