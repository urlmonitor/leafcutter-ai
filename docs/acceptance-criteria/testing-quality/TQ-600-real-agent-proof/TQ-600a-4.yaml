criteria: |
  Given the mechanism defined by TQ-600a-1 and TQ-600a-2, and the existing eval runner
    (TQ-200b),
  When a component diagram is authored for asking the real agent,
  Then the diagram shows the cases that ask a real agent, the switch that gates them, the
    shared way of reaching the model service, the registered agent's shipped instructions
    and registry entry, and the evidence record,
    And it shows the eval runner reaching the model service through that same shared part,
    And it shows no connection from asking the real agent to the eval runner's scoring,
    thresholds, results directory or required CI gate,
    And a maintainer can read from the diagram which parts the two share and which they do
    not.
