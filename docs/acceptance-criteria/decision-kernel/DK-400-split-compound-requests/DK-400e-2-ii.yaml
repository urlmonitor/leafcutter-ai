criteria: |
  Given the reusable-criteria split approved by human:user at the split gate,
  When part p1's decision reaches its final choice,
  Then the person is asked to approve p1's choice, as for any other decision,
  And no decision record exists for p1 until the person approves that choice,
  And the approver and approval time on p1's record are those of p1's choice, not those of the
    split's approval.
