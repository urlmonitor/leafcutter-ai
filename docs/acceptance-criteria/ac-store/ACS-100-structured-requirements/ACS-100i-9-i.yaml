assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    fallback_reader_scalar_normalisation:
      type: object
      description: "The behaviour the two fallback parsers must gain so their output agrees with yaml.safe_load: a scalar wrapped in a MATCHED pair of literal quote characters (both double or both single) yields the value without them; every other spelling is returned exactly as today. Applied generically in the reader, not per-field. The shared helper keeps its optional raw_text parameter, repurposed from refusal to RECONCILIATION: {handed_value: str, parsed_value: str, readers_agree: bool} — when they disagree the helper reports a reader-disagreement diagnostic naming both, and never refuses the record for being quoted."
  reference_file_path: "templates/scripts/commit_guardian/_ac_schema_validators.py"
  n_location_rule: "2"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python scripts/ac_store/validate_ac_schema.py docs/acceptance-criteria"
  constraints:
    - "THE FIX IS IN THE FALLBACK READER; NO RECORD IS REFUSED FOR BEING QUOTED. `assigned_agent: \"python-coder\"` is ordinary YAML double-quoting and yaml.safe_load returns exactly `python-coder`, so all 16 such records are semantically correct and a rule that refused them would refuse valid records. The real defect is that load_yaml_manual (line 105) and the ImportError branch of load_yaml_from_string (line 144) do value.strip() only — never unquoting — so they yield the 14-character string WITH the quotes and the same record gets opposite verdicts depending on which reader ran. Make both readers unwrap a matched surrounding quote pair so the name they yield equals the name the real parser yields."
    - "THE PARSED VALUE IS THE AUTHORITY WHEN THE TWO COULD DIFFER. A dispatcher acts on the parsed value: generate_ticket_from_ac.py uses it as a phase-map key and build-feature.js dispatches agentType: phaseName from that map. Never resolve a disagreement in favour of the fallback's literal text, and never make the parsed reader keep quotes for symmetry — converge the fallback UP to the parser, not the parser DOWN to the fallback."
    - "FIX IT IN THE READER, GENERICALLY — NOT AS AN assigned_agent SPECIAL CASE. Both fallback parsers are generic `key: value` readers used for every field on the record. A normalisation applied only to assigned_agent leaves every other field still disagreeing between the two readers, which is the same latent divergence one field over."
    - "UNWRAP ONLY MATCHED PAIRS, AND ONLY AT THE ENDS. Strip when the first and last characters are the same quote character and the value is at least two characters long. Leave a single leading quote, a single trailing quote, and any internal quote exactly as they are — a value that legitimately contains a quote must survive unchanged."
    - "DO NOT DISTURB THE OTHER SCALAR COMPENSATIONS ON THIS PATH. The fallback readers also fail to resolve null, booleans, integers and lists — `assigned_agent: null` becomes the STRING \"null\" there, and validate_manually already compensates by treating (None, \"\", \"null\") as missing (line 183). Keep this change to quote-unwrapping only, and re-run the manual-path tests to confirm that guard, the empty-string spelling ACS-100i-10-i depends on, and the components non-empty-list check all still behave."
    - "NO MUTATION OF ANY RECORD. The check reports and never writes. The 16 quoted lines stay exactly as they are on disk — ACS-100i-11 explicitly does NOT rewrite them, because their parsed value is already a registered agent name and changing them would be a cosmetic edit dressed as a correction."
    - "KEEP THE HELPER SEAM, REPURPOSED. assigned_agent_field_errors(data, agent_ids, raw_text=None) retains its optional raw_text parameter, but it now RECONCILES rather than refuses: when raw_text is supplied the helper compares the value it was handed against what a real parse of that source line yields and reports a reader-disagreement diagnostic if they differ. That makes a future regression in either reader audible instead of silent. It must never itself refuse a record for carrying quotes."
    - "Re-measure the 16 at the implementing commit — they are the fixture source for the agreement test, not a refusal count. The numbers drift as other work lands, and a test pinning 16 without re-measuring fails for the wrong reason."
