notes: |
  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Decomposes ACD-400c.

  EVERY CLAUSE HERE WAS OBSERVED, NOT READ. A probe built a temp AC store, invoked
  scan_ac_store.main(["--ac-root", <tmp>, "--json"]) and parsed the emitted JSON. The
  three-record fixture returned ready=['approved-id'], blocked=[]. The PO's report of
  the gate matches what the code does.

  WHY THE LAST CLAUSE IS IN THE CRITERIA AND NOT LEFT TO A TEST. Without it, a test can
  satisfy this AC by asserting two ids are missing from the offer — which they would also
  be if some unrelated filter dropped them, or if the scanner returned an empty list. The
  flip-and-re-ask clause makes the approval field the demonstrated cause: it fails on an
  implementation where the gate is absent (the draft piece is offered before the flip) and
  on one where the whole store is being dropped (the flip changes nothing). This is the
  repo's anti-vacuity pattern applied to a filter rather than to a gate.

  THE ABSENT-APPROVAL CASE IS DELIBERATELY NOT HERE. A record with no approval field at
  all is a separately changeable decision with its own consequence, and it is specified by
  ACD-400c-2. Folding it in would have produced one AC that two different one-line edits
  could each half-satisfy.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L2.
  assigned_agent, it_requirements, estimated_complexity, test_spec, delivers_to and
  expects_from are the IT PO's to set. Note for that pass: the deliverable is a pinning
  test, not a change to the selector, so `reference_file_path` naming scan_ac_store.py
  would be wrong unless the IT PO intends an edit there.
