notes: |
  Wave 1 of the done-proof remedy. This is a composite: its four L3 children carry
  the testable behaviour, and it is done when they are.

  Placement (user decision at the BA gate, 2026-10-25). The four records were
  first drafted under BO-2500a-1, next to BO-2500a-1-ii. BO-2500a-1 is
  work_status done, so todo children under it made it a done composite with
  unfinished children, and the check-done-proof hook refused the commit. They are
  re-hosted here, and BO-2500a-1 is left untouched and done. This takes the last
  slot under BO-2500a (child_limit_override 8).

  Old ids, never committed: BO-2500a-1-iii -> BO-2500a-8-i, -iv -> -ii,
  -v -> -iii, -vi -> -iv.

  BO-2500f's notes (PO, staged) still say wave 1 sits "under BO-2500a >
  BO-2500a-1, as siblings of BO-2500a-1-ii". Read that as this L2.
