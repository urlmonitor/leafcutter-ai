id: GE-130c-2-i
title: When the check sees a protected file changed but cannot tell whose change it was, it says so and
  why, blames no one, and lets the run continue
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a watched file changed, in a way its protection's rule refuses, while this caller's command
    was running,
  And whether this caller's command or another agent in the same working copy made that change
    cannot be established,
  When this caller's command finishes,
  Then the protection names the file and itself, and states that it could not tell whose change
    it was,
  And it states why: it names the other tracked command or edit that overlapped this caller's
    command in the same working copy, or it states that the change came from something the
    protection does not see,
  And the run is not stopped, and the next tool call in it is carried out,
  And it does not state that this caller made the change,
  And it states that the file remains changed in the working copy, and that if the change was this
    caller's own, this caller must put the file back or make the change in a way the protection's
    rule allows,
  And the statement is distinguishable from both a stop GE-130c-2 attributes to this caller and a
    stop GE-130c-1-i makes when the files could not be examined, so a reader can tell "your command
    changed this", "this changed and it is not known who changed it" and "the files could not be
    examined" apart,
  And given, in the same run, this caller's command changes a different watched file in a way the
    rule refuses and that change is positively attributed to this caller,
  When that command finishes,
  Then the run is stopped naming that file, so the unattributed change going through is not the
    result of a check that stops nothing.
depends_on:
- GE-130c-2
- GE-130c-1-i
