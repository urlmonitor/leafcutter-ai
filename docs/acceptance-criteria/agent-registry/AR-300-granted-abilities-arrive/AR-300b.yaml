notes: |
  WHY THIS IS NOT JUST AR-300a WITH EXTRA STEPS. AR-300a can be fully satisfied
  for today's 60 specialists by a one-off repair, leaving the mechanism exactly
  as willing to discard the next block as it was this one. This criterion is
  about the mechanism: the observed defect hit TWO independent per-specialist
  blocks simultaneously, by the same silence, and neither was noticed by
  anything. That is one failure mode with two instances, not two coincidences.

  THE SECOND INSTANCE IS THE PROOF OBLIGATION. A guarantee written against the
  abilities block alone is indistinguishable from AR-300a. Whatever reports the
  failure must cover any per-specialist preparation, including the second dead
  one measured on this defect and one added later.
