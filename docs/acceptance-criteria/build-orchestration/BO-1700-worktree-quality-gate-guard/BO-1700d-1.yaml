it_requirements: |
  Gate 1 lives at the end of _bootstrap() in scripts/setup_ticket_worktree.py.
  Order: heal (BO-1700c-1) THEN verify (BO-1700a-1) — heal-then-verify. The
  create-time halt is expressed behaviorally as "worktree creation halts naming the
  failing check"; it REPLACES the prior file-existence-only check that reported
  success on mere config presence. Proceed condition is exit 0 + empty
  failing_checks per BO-1700b-1 (fail closed). Route the epic path and
  worktree-agent through this SAME gate so no creation path bypasses it. Both the
  probe (a-1) and heal (c-1) are reused, not reimplemented. ADR-001
  deployed/template parity applies.
