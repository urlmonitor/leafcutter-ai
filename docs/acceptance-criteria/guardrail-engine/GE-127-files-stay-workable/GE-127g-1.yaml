assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The declaration's home, shape, matching rule and the three concrete entries with
    their stated grounds are pinned in the parent L1's it_requirements. Implement that
    set; do not re-derive it and do not add a fourth entry without the same kind of
    measured evidence the three carry."
  - "is_excluded() in templates/scripts/commit_guardian/_doc_length_ratchet.py (line 207)
    is the defect site and must stop comparing Path(filepath).name. The replacement must
    receive the document's repo-relative path."
  - "There is exactly ONE membership test and it must be consulted at exactly one point.
    is_checked() is used in TWO places that must stay in agreement — the staged-path
    filter in check_doc_length.main() (line 407) and the HEAD-covered-set predicate
    passed into resolve_doc_ratchet() (line 272). If the two disagree about a document,
    the previous-value resolution and the current measurement are computed over
    different populations."
  - "The old basename-matched excluded_files key must be REMOVED from the doc_length
    section in the same change, not left in place alongside the new key. Leaving it
    keeps the basename leak alive and GE-127g-3's second arm red; a mechanism with two
    enforcement surfaces is the shape where the inert one gets fixed and the live one
    does not."
  - "Adding a new generated document to an already-declared location must require no
    edit to anything — no declaration entry, no code change, no regeneration of a
    cached list. If the implementation materialises the declared locations into a
    concrete file list at any point, that list must be recomputed per run and never
    persisted."
  - "A new helper module, if one is extracted, must live in
    templates/scripts/commit_guardian/ — build_commit_guardian() in
    scripts/build_phases_lifecycle.py rglobs that directory, so it deploys with no
    deploy-map line. A module placed anywhere else needs an explicit deploy-map entry in
    the SAME change or the deployed hook raises ModuleNotFoundError at hook runtime
    while source-tree unit tests stay green."
  - "templates/scripts/commit_guardian/ is the SOURCE. scripts/commit_guardian/ and
    .leafcutter/scripts/commit_guardian/ are untracked build outputs in this checkout;
    an edit to either alone is reverted by the next build."
  - "Must handle errors gracefully per the project error handling policy."
test_spec:
  - name: test_regenerated_cards_directory_commits_cleanly
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    surface_invoked: templates/scripts/commit_guardian/check_doc_length.py
    description: >-
      Arm 1. A real throwaway git repo with a populated docs/agents/cards/ whose shape
      matches the measured population — several documents under the limit and at least
      one far above it — committed at HEAD, then restaged as a regeneration leaves it.
      Perform a real git add and invoke the gate against that index; assert it completes
      with a clean verdict. No build.py spawn and no layout fixture, so no marker.
    must_catch:
      - "leave the basename-matched excluded_files key in place as the only mechanism"
  - name: test_newly_generated_document_needs_no_declaration_edit
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 2, and the whole record. Add a 66th generated document at 420 lines, named in
      no declared entry, to the same directory and stage it with the rest. Assert the
      gate completes AND assert the declaration file is byte-identical before and after
      the run — the no-edit property must be checked, not assumed, because a fix that
      appends the new filename on the fly satisfies the verdict half and not this one.
      No marker.
    must_catch:
      - "express the exclusion as the 65 current filenames instead of their location"
      - "append a newly seen generated document to the declaration at run time"
  - name: test_emptied_declaration_names_the_three_over_limit_documents
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 3, the negative control. Remove the cards-directory entry from the declaration,
      stage the same regenerated directory, and assert the gate refuses AND that the
      documents it names are exactly the ones above the limit — by comparing against the
      set the fixture constructed, never against a pinned count. This is the only arm
      that a disabled gate, or a gate that hardcodes the directory and ignores the
      declaration, fails. No marker.
    must_catch:
      - "exclude every document under docs/ from the length standard"
      - "hardcode the directory in the gate's own code and ignore the declaration"
  - name: test_deployed_doc_length_gate_honours_the_declared_locations
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: deployed
    surface_invoked: scripts/commit_guardian/check_doc_length.py
    description: >-
      The deploy-manifest arm. Runs the gate from the real DEPLOYED layout against a
      staged generated document that is over the limit, and asserts it reaches a clean
      verdict rather than a ModuleNotFoundError or a refusal — proving both that any new
      helper module deployed and that the deployed copy of the declaration is the one in
      effect. Requests the session-scoped shared_reference_layout fixture and declares
      @pytest.mark.shared_layout_reader; it only reads the layout, so it must not spawn
      its own build.py (one build costs 59.8s).
    must_catch:
      - "add a membership-test helper module that the build does not deploy, so the deployed hook crashes while source-tree tests stay green"
      - "edit the deployed scripts/commit_guardian/ copy instead of the templates/ source"
test_rationale: >-
  Every entry stages real documents in a real git repository and reads the verdict out of
  the gate's own exit status and output. This record is the one most exposed to the
  grep-shaped test — a declaration is precisely the kind of subject that attracts an
  assertion that a path pattern is present in commit_guardian.json — and such a test
  passes on a gate that never reads the declaration and on a gate that never runs.
  CLAUDE.md's behavioural rule outranks any test_spec that blessed that form. Three
  shaping decisions. First, arm 2's test asserts TWO things, the clean verdict and the
  declaration file's byte-identity across the run, because an implementation that quietly
  appends the newly seen filename satisfies the verdict and defeats the record's actual
  subject. Second, arm 3 compares the named documents against the set its own fixture
  constructed rather than against the measured figures 65 / 2,809 / 639 / 355: the record's
  notes are explicit that pinning any of those as a constant goes red the next time an
  agent or an assignment is added, which is the opposite of what the record says. Third,
  the fourth entry exists because the other three import from the source tree and would
  stay green on a helper module the build does not deploy — the exact failure this
  repository shipped once with done_proof.py. Markers: only that fourth entry requests
  shared_reference_layout and therefore carries @pytest.mark.shared_layout_reader; the
  other three neither request the fixture nor build anything, so they sit outside the
  marker-routing mechanism and pay no build cost.
