notes: >-
  Closes the general defect class rather than the four cases in BO-4100d-1: silent
  substitution is what made the 2026-09-14 failure invisible, and an implementation that
  learns the four current kinds while keeping a fallback will reproduce it on the fifth.
  Refusing also keeps the promise honest at the boundary -- there is no kind for which
  the caller both gets a workspace and gets something other than what was asked for.
