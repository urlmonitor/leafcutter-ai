it_requirements:
  - "The appended-note signal is whitespace immediately followed by the comment marker inside a field — never the marker alone, and never the absence of the named file on disk. A suppression may legitimately precede the file it names, so non-existence must not be treated as evidence of anything."
  - "Evaluate the signal per field rather than per spelling, so the same authoring mistake is caught in whichever field it lands and no field is left with an untreated variant of it. One message per offending line regardless of how many fields carry the signal."
  - "Reject, do not repair: the entry is reported and skipped, never silently stripped of the note and honoured. Stripping changes what the entry means on a guess, which is the habit this L1 removes."
  - "Reuse the single allowlist-diagnostic convention this file already has — error stream, allowlist file path, 1-based line number, verbatim line text — and do not add a second message shape."
  - "Classification is never fatal and never alters the scan's exit status, which stays determined by the surviving findings alone."
  - "Edit the canonical template at templates/skills/security-scanner/scripts/scan_secrets.py and propagate with build.py; never edit a deployed copy (ADR-001)."
  - "This runs on every commit: keep the check a single linear pass with no per-entry filesystem access."
  - "Tests must never create, modify or delete a .security-allowlist at any real project root, workspace root or worktree root; every fixture allowlist lives under tmp_path/tempfile."
  - "Fixture files must use ordinary source filenames — the per-file scan short-circuits environment-named files and never reads their content, so such a fixture cannot produce the content findings these criteria depend on."
test_spec:
  - name: test_appended_note_after_two_field_entry_warns_and_suppresses_nothing
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "With a tempfile-backed allowlist whose second line is a two-field entry followed by a trailing note, and a real source file on disk carrying a quoted value assigned to an identifier the generic-secret rule reports, the multi-file scan entry point still returns that finding, one warning names the allowlist path, line 2 and the verbatim text, and no entry is loaded for that line."
  - name: test_same_entry_without_the_note_suppresses_silently
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The identical entry with the trailing note removed suppresses the same finding and produces an empty error stream, proving the note is the only thing that made the first version inert."
  - name: test_comment_marker_inside_a_path_segment_is_not_treated_as_a_note
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "A real file on disk whose name legitimately contains the comment marker with no whitespace before it is still suppressed by its entry, with no warning — the narrowness guard on the predicate."
test_rationale: |
  The predicate here is deliberately narrow, and the third arm is the guard that
  keeps it narrow, so all three must be measured against real files: an in-memory
  test of the marker rule would pass while the real path never reaches the matcher.
  Every arm runs through the multi-file scan entry point with a tempfile-backed
  allowlist, per the tree-wide verification standard — a sibling audit in this
  family found criteria discharged only against the matcher in isolation that
  described situations the real entry point can never produce.
