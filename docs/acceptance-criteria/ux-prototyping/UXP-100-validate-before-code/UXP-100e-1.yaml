criteria: |
  Given the PO agent has completed L0 and L1 AC authoring for a feature
    and the L1 ACs have readiness: approved,
  When the pipeline determines that UX involvement is warranted for this feature,
  Then the UX designer agent and the BA agent are both dispatched in the same
    orchestration step (not sequentially)
  And neither agent's dispatch is gated on the other agent having started or finished
  And both agents receive the same L0/L1 ACs as their input context
