notes: |
  THE MISDIRECTION IS THE EXPENSIVE PART, and it is the half of KI-BO-018 that is easiest to
  leave unfixed. The false verdict did not merely halt the run: the remediation text sent the
  reader to fix a permission that was already correct. Someone following that advice changes a
  setting that was right, the run still fails, and the real cause — a transport truncation — is
  now further away than when they started.

  A CHECK CAN CARRY THE RIGHT OUTCOME AND THE WRONG ADVICE. Adopting the undetermined outcome
  from BO-3200e-1 while leaving the existing remediation string in place produces exactly that,
  and every test written against the outcome value passes. This AC is written against the advice
  because that is what the reader acts on.

  The third scenario keeps the two messages from being merged into one generic line, which is
  the other way this is commonly "fixed" — advice that covers both cases tells the reader
  nothing about which one they are in.

  IT-PO ENRICHMENT NOTE (2026-08-26). Binding the advice to the OUTCOME rather than to the check
  is the structural form of this criterion, and it is what makes BO-3200e-3's sweep able to cover
  it: every check that gains the undetermined outcome gains the right advice with it, so the
  correction does not have to be repeated per site and cannot be forgotten at one.
