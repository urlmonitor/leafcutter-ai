notes: |
  Zero-as-unknown is the same false-green shape the trust tier exists to surface,
  one layer down in the rendering. A transient failure of the pull-request query
  once produced a row reading 0 merged pull requests for every week; nothing in
  that output distinguished it from a genuinely quiet fortnight.

  The scenarios deliberately pair each unknown with a measured value in the same
  row or the same run. An implementation that renders everything as a dash would
  satisfy an unknown-only scenario and destroy the report; the measured-zero and
  measured-69 assertions are what stop that.

  Three independent sources of unknown are covered here because they share one
  rule and one rendering: an unobtainable pull-request count, a truncated result
  page (specified separately in INF-500e-2-i, where the mechanism is subtle
  enough to deserve its own record), and a telemetry sink carrying no lane-run
  events. The availability flag travels with the figure so a consumer of the
  machine-readable form can tell the two apart without parsing a dash.
