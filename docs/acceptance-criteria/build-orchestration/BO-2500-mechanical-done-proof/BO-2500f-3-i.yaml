      workflow''s approve step, and the record''s inspection filled with gate_run and the
      shown blobs.'
test_spec:
  - name: test_bo_2500f_3_i_approval_file_is_read_from_the_committed_tree_never_from_an_untracked_file
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: seam
    description: "In a temporary git repo, an approval file with correct content that is only an untracked working-tree file is 'missing' at every layer; staged it satisfies the pre-commit layer (index) but not ci-changed (HEAD); committed it satisfies both. A scratch socket guard (sitecustomize patching socket.socket to raise) proves no network call, and a planted file in a local untracked store is never read."
    proves_clause: "the approval file for the referenced run is read from the committed tree, with no network call and no read of any local, untracked store"
    code_file: scripts/ac_store/_inspection_approval.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_3_i_answer_record_id_and_run_id_are_three_bindings
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: boundary
    description: "approval_verdict holds for answer 'approve', ac_id equal to the record and run_id equal to both gate_run and the file name; each of 'approved', 'APPROVE', 'reject', a different ac_id, a run_id differing from gate_run and a run_id differing from the file name breaks it alone."
    proves_clause: "the inspection holds only if the file's answer is \"approve\", its AC id is the record being marked done, and its run id is the one the inspection references"
    code_file: scripts/ac_store/_inspection_approval.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_3_i_inspected_set_must_equal_the_approval_set
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: boundary
    description: "One different blob, an extra file, a missing file in the approval file refuse; the same pairs in another order hold (set equality of (path, blob))."
    proves_clause: "the inspected files and fingerprints in the approval file are exactly the files and fingerprints the inspection lists"
    code_file: scripts/ac_store/_inspection_approval.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_3_i_review_date_is_answered_at_and_a_differing_inspection_date_is_refused_naming_both
