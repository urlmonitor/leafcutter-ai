implemented_by: []
notes: |
  Carries the second half of the superseded KernelCompoundGoalSplit ticket: one decision
  record per sub-decision, linked to the goal. The link is a derived reverse view
  (Decision.split_part), not a field of the record file, so published records keep their shape.
