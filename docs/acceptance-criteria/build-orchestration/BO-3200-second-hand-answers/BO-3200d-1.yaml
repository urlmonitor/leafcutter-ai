notes: |
  THE SIZE IS THE REAL ONE, not a round number. KI-BO-019: the bundle was 148,891 bytes, 2,232
  lines, and the marker was present at line 958; the specialist wrote it correctly to disk and
  returned a 47-character pointer, and the gate reading that pointer found no marker and
  halted a run whose work was fine. A fixture below the size at which the handover changes
  behaviour passes on the broken handover, which is exactly the fixture bias CLAUDE.md's
  "Real-artifact behavioral spot-check" warns about.

  A MARKER PART-WAY THROUGH, not at the start, for the same reason: a truncating handover
  delivers the beginning intact, so a marker in the first kilobyte is found by a handover that
  loses ninety per cent of the content.

  THE SECOND SCENARIO ASSERTS THE CONSEQUENCE. Content equality alone can be satisfied while
  the consuming step still reads something else; requiring the verdict to match the one reached
  from the produced result ties this AC to the halt it exists to prevent.

  THE THIRD SCENARIO FORBIDS A SIZE-DEPENDENT SPLIT. An implementation that keeps the old
  in-reply handover for small results and adds a second mechanism for large ones has two code
  paths, one of which is the defect, and a threshold nobody will re-examine. One handover,
  whatever the size.

  THE GATE IS NOT THE BUG — see BO-3200d-1-i. Its fail-closed posture is correct and this
  criterion must not be read as loosening it.

  IT-PO ENRICHMENT NOTE (2026-08-26). The stale-artifact requirement is a hazard this fix
  introduces rather than one it inherits. Once the result lives outside the reply it persists,
  and a consumer that reads a path without knowing which run wrote it will happily validate a
  previous run's bundle — a confident, well-formed, entirely wrong pass. Run-scoping the artifact
  is also what BO-3200d-2's caller-supplied path gives for free, which is one more reason the two
  should be implemented together.
