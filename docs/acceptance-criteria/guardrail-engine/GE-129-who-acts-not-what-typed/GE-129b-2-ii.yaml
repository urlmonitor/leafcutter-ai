notes: |
  WHY REFUSE AND NOT MERELY STATE. For a non-specialist subagent there is no legitimate need to
  commit, so refusing an undeterminable git subcommand costs nothing on the commit path; a
  statement-only outcome would let the reworded commit through, which the L1 forbids. The
  contrast command pins that the rule is about an unreadable subcommand, not about variables in
  a command.

  DECIDED 2026-09-17 (user, default accepted) -- REFUSE. A git command whose subcommand cannot be
  read from its text is refused, not merely stated. From the top-level session the same rule puts
  (a)-(c) to the person's prompt (or refuses them where no person is reached). Stating instead of
  refusing is not an accepted fallback; changing it needs a new user decision.

  Out of reach by design: a commit made by a program the command starts (a script file, an alias
  defined outside the command). Stated as a limit in GE-129b-3 and GE-129e-4.

  declares_side_effect: false -- the Then clauses assert refusal, run and absence of a commit.
