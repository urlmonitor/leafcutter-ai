notes: |
  The load-bearing "one maker, one shape" behaviour (decision 4; decisions 1-3 define the
  shape). Freshness itself stays BO-4100a, protections firing stays BO-1700a/d -- this
  record asserts only that every route gets the SAME set of properties from the SAME maker.
  The five routes are the entry points in the consolidation inventory (section 2). Proof is
  behavioural: real test projects with a real shared project, the installed maker run as a
  separate process (BO-4300f-4).
