notes: |
  Work item 2. Code: scripts/evals/produced_tests_runs.py (write_ac_records,
  judge_verdict, wrong_version_run) and possibly scripts/build_orchestration/_wvr_verdict.py.

  BA addition (unasked-for, keep): the second scenario. The request names "the shared
  wrong-version runner verdict"; that verdict also gates real builds, where every
  must_catch test that survives must keep blocking. The fix is to be made on the
  eval side (which entries carry must_catch / are blocking, or how the eval judges
  the verdict), never by loosening the build gate. If the IT PO finds the shared
  verdict must change, it needs its own AC under the build-orchestration tree.

  The "tagged test fails on the fixed version" clause keeps a broken test set from
  passing because one test happens to fail under the wrong version.
