id: KM-500a-1
title: Ask only for missing research inputs and continue from the answer
component: knowledge-management
components:
- knowledge_management
level: L2
status: active
req_status: active
readiness: approved
priority: medium
work_status: done
parent: KM-500a
criteria: 'Given a research question lacks a required target, scope or disambiguating input

  When deterministic input checks and the bounded readiness judgment assess it

  Then the original research item pauses with a focused question naming the missing input

  And no graph query or capability-build child starts while that input is unresolved

  When the answer supplies the input through the existing interaction continuation

  Then the same research question and need resume with the answer attached

  And readiness is not asked again for unchanged sufficient inputs

  And provider failure or an invalid answer remains an explicit failure or unresolved input, never a ready judgment.

  '
