estimated_complexity: M
it_requirements:
  - "Work through KNOWN_UNDEPLOYED_ALLOWLIST one entry at a time, removing each from the frozenset as its deploy phase lands. The set shrinking to empty IS the completion signal."
  - "Deploy targets must be verified by running the script from the deployed tree, not by asserting file presence. Several of these scripts import siblings (e.g. scripts/agent-health/agent_telemetry.py next to generate_health_report.py), so a single-file deploy can produce a file that exists and still fails at import."
  - "scripts/check/prod_status_check.py needs no deploy phase: it is a host-project path (debugging/scripts/...) that BP-900g-4's over-permissive prefix mis-captured. Narrow the prefix to output roots only and add a negative-control test covering both it and the package-dev form (leafcutter/scripts/build.py), so neither is ever normalised into a deploy key again."
  - "Extend unit_tests/test_bp_900g_4.py's deployed-tree assertion, or add a sibling test, so the emptied allowlist is enforced going forward: a test asserting KNOWN_UNDEPLOYED_ALLOWLIST == frozenset() makes re-parking a visible regression."
  - "Separately, _manifest_ac_store_scripts OVERSTATES deployment: it scans all ~23 files in scripts/ac_store/ while build_ac_store deploys only an explicit 9-entry deploy_map. Any reference to an ac_store script outside that map passes the guard and fails at runtime — the same defect shape as BP-900g-4, one level down. (BP-900g-4 hit this via ac_parent_id.py and fixed that one instance by adding it to the map.) Make the manifest derive FROM the deploy_map so the two cannot diverge. Audit for newly-surfaced references before landing; today's referenced ac_store scripts all happen to be in the map, so this is expected to be behaviour-neutral."
