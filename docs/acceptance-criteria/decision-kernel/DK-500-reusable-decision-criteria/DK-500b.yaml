criteria: |
  Similar questions merge into one category, so each concern is weighed once.

  Questions that ask the same thing in different wording are gathered into one
  category with one preferred wording, and related categories can sit under a
  broader one, so a decision does not weigh the same concern twice and the
  library stays small enough to browse. How the grouping is worked out is still
  to be decided; whichever way is chosen, its groupings are suggestions a person
  can accept, change or undo.
