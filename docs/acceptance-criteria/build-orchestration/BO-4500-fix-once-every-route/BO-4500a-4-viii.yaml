notes: |
  Authored by /quick-fix. Root cause: git() decodes the child's output with text=True and no encoding, i.e. the locale code page (cp1252 on Windows), so any non-cp1252 byte in hook output (UTF-8 emoji/arrows from pre-commit hooks) kills the reader thread and leaves stdout None. The supervised path run_without_input (line 234) already decodes with utf-8, errors='replace'; git() must do the same (encoding='utf-8', errors='replace')..

  Placement: BO-4500a holds its five-L2 cap, so this technical constraint on the one-answer
  contract is an L3 child of BO-4500a-4.
