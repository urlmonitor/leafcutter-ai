title: "The connections that tell you what a change will break are ones you can actually follow"
component: knowledge-management
level: L1
status: active
req_status: draft
readiness: draft
priority: medium
criteria: |
  The relationships you reach for when planning a change are traversable, not summarised.

  A relationship that answers "what else does this touch?" is shown as a link you can
  follow and inspect, rather than being folded into a count or a footnote — because a
  relationship you cannot traverse cannot inform the decision it exists to inform.
