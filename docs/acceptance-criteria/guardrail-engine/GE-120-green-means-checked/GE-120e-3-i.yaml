assigned_agent: test-writer
estimated_complexity: S
it_requirements:
  - "THE CONTROL IS A PROPERTY OF THE VERIFICATION, EVALUATED PER CHECK PER RUN. Implement it once in the pair evaluator so every check added to the sweep inherits it, rather than as a per-check assertion each future author must remember."
  - "THE CONTROL MUST BE LIVE, IN THE SAME RUN, ON THE SAME CHECK: the check observed objecting to content the author actually introduced. A control read from a previous run, a recorded snapshot, a fixture file or a hard-coded expectation does not count — a stale control agrees with a disabled check just as happily as two silences do."
  - "SELF-DEMONSTRATION IS A DELIVERABLE. Two states must be shown to make the verification fail: (a) the check under test switched off, and (b) the check handed no change set at all. Both produce a run of perfectly agreeing silences, which is exactly what every mis-implementation of this L1 looks like."
  - "INCONCLUSIVE IS A FAILURE, NEVER A SKIP AND NEVER AN XFAIL. This repository has a recorded history of xfail-masked AC enforcement that made CI under-report failures; an inconclusive pair recorded as a skip is that failure mode reintroduced at the point it matters most."
  - "THE INCONCLUSIVE REPORT MUST BE VISUALLY DISTINCT FROM A PASS and must name the check and state that the control was missing. Two silences printed in the same form as a verified pair is the whole defect at the reporting layer."
test_spec:
  - name: test_ge120e3i_agreeing_pair_without_a_control_is_inconclusive_and_fails
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "A pair whose arms both stay silent, with no live control for that check in the run, is reported inconclusive and the verification exits non-zero."
  - name: test_ge120e3i_disabled_check_makes_the_verification_fail
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Switching the check under test off produces a failure, not a run of agreeing pairs — the self-demonstration the coverage note requires."
  - name: test_ge120e3i_check_given_no_change_set_makes_the_verification_fail
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "A check handed no change set at all is caught by the control rather than passing as two silences."
  - name: test_ge120e3i_inconclusive_report_names_the_check_and_the_missing_control
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The inconclusive output identifies the check, states the control was missing, and is not rendered in the same form as a pass."
  - name: test_ge120e3i_agreeing_pair_with_a_live_control_is_accepted_as_evidence
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "With the same check shown objecting to author-introduced content in the same run, the agreeing pair is accepted — the control does not make every pair fail."
test_rationale: "Every way this L1 can be mis-implemented — narrowing the change set to nothing, exempting merges outright, disabling the check while the fix is in progress — produces two agreeing silences and a green pair, so the pair alone cannot be trusted. The contract therefore tests the CONTROL rather than the check: three of the five cases deliberately break the verification (check off, no change set, no control) and assert it fails, because a verification that cannot be made to fail is not evidence. The fifth case is the necessary counterweight — a control that fails every pair would be abandoned within a week. All cases run through the real pair machinery as processes; asserting on the evaluator's internals would leave the reporting layer, where two silences can still be printed as a pass, untested."
