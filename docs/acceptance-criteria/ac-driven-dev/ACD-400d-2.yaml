notes: |
  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Decomposes ACD-400d.

  THE STORAGE-ORDER CLAUSE IS WHAT STOPS THIS AC BEING VACUOUS. The queue reads records
  in a fixed order today, so a repeated identical run returns an identical list whether
  or not the identifier key exists at all — meaning the obvious determinism assertion
  passes on an implementation that has no tie-break and is merely lucky. Holding the same
  records under names whose alphabetical order runs counter to their identifiers is what
  separates "the answer is stable" from "the answer is determined by the record, not by
  the filesystem". Only the second is worth the name idempotent, and only the second
  survives a change to how records are enumerated.

  WHY THE TIE-BREAK CHAIN IS ONE AC AND THE URGENCY KEY IS ANOTHER. The urgency key is
  what the store currently denies exists (ACD-400d-1). The chain beneath it is what the
  store currently describes correctly — ACD-400a-1's 'estimated_complexity ascending
  (S before M before L before XL) then by AC id ascending' is right about these two keys
  and their order, and wrong only in omitting the key above them. Keeping them apart
  means ACD-400e-2's reconciliation is an insertion rather than a rewrite, and means a
  future change to the ranking does not disturb the record that pins determinism.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L2.
