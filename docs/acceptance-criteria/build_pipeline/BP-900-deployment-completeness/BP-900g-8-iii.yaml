criteria: |
  Given the project rule that requires a new guardrail or gate dependency to be added
    to the build deploy manifest,
  When an author consults that rule to decide whether a dependency they have just
    added is in scope,
  Then the rule states that a dependency is ANY file the guardrail reads in order to
    do its job — naming schemas, vocabularies, registries and data tables alongside
    imported modules — rather than defining the class by the kind of error a missing
    module raises,
  And it describes the symptom of the data-file case as concretely as it describes
    the module case, so a reader who has hit the data-file symptom recognises the rule
    as applying to them,
  And it names the verification that actually distinguishes the two: running the
    guardrail from an install that does not contain the package's own source tree,
    and states why running it from the package's own workspace cannot,
  And at least one worked example in the rule is a non-code declaring file,
  And the rule points at the mechanism that enforces it, so a reader learns the check
    exists rather than being asked to remember the rule unaided.

  Because the rule as written defines the dependency class by its failure signature —
  a module that cannot be imported — and a configuration JSON does not produce that
  signature. Five confirmed gaps on 2026-08-18 were all in scope of the rule's
  intent and all outside the reach of its wording.
