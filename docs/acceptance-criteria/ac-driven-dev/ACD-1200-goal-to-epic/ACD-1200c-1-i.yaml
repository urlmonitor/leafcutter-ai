title: "Circular dependency among leaf ACs is detected and reported before ticket generation"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given 3 leaf ACs have a circular dependency chain:
    - ACD-050a-1 (depends_on includes ACD-050a-3)
    - ACD-050a-2 (depends_on includes ACD-050a-1)
    - ACD-050a-3 (depends_on includes ACD-050a-2)
  When the system attempts to resolve dependency ordering for ticket generation,
  Then it detects the cycle before any ticket files are written
  And outputs an error identifying the cycle:
    "Circular dependency detected: ACD-050a-1 -> ACD-050a-3 -> ACD-050a-2 -> ACD-050a-1"
  And no epic folder is created
  And no ticket files are generated
  And the AC store is left unmodified (no target_epic tags stamped).
