expects_from:
  ac_id: GE-123a-1
  contract: "The per-file scan that no longer stops at the filename recognition. ONLY the second arm of this criterion consumes it — the filename finding cannot be observed ALONGSIDE content findings until the content scan runs on an env-named file. The first and third arms are independent of GE-123a-1 and are observable against today's code, which is why depends_on names GE-123a alone; this contract records the arm-level dependency without changing that ordering."
it_requirements:
  - "The third arm's filename set must be a FROZEN BASELINE captured from the sensitive-filename rule as it stands BEFORE this change, written into the test with its provenance recorded. It must NOT be derived at test time from the rule under test: a derived set narrows whenever the rule narrows and therefore cannot detect narrowing, which is the only thing this arm exists to catch."
  - "The frozen baseline must include the bare dotted name, the dotted-name-with-suffix form, the stem-plus-extension form, and at least one case variant. A single example name cannot detect narrowing, and the criterion says 'every filename form' for that reason."
  - "Widening the recognised set is explicitly NOT a failure of this criterion; only narrowing is. Write the third arm so that a newly recognised form does not break it."
  - "The filename finding must be observed as its own separate result identified by its rule id and its own line number — never inferred from a total count. A count-only assertion cannot distinguish 'reported separately' from 'merged into, or downgraded relative to, a content finding', which is the exact failure the second arm exists to catch."
  - "All arms must run through the multi-file entry point scan_files over real files in a tempfile-backed directory, and the third arm must scan every baseline filename in a SINGLE run. Coverage of the filename matcher in isolation does not discharge any arm — that is how two sibling criteria in this family came to describe situations the real entry point can never produce."
  - "Exit-status arms must run the scanner's CLI entry point in a fresh subprocess with the fixture directory as the working directory, and must assert the process exit code. A returned list of findings is not an exit status."
  - "Test fixtures must assemble every credential-shaped string at runtime from concatenated fragments rather than writing it as a source literal, so this repository continues to need no PRIVATE_KEY or AWS_KEY suppression anywhere. The existing suppression test module does this deliberately; do not collapse the fragments back into literals."
  - "The ordinary configuration text used by the first and third arms must contain no token of twenty or more characters and no keyword-followed-by-quoted-value line, or 'exactly one finding' becomes an accident of the fixture rather than a statement about the scanner."
  - "The module under test must be loaded from the canonical templates/ path via importlib.util.spec_from_file_location, never from a deployed copy, which can be stale."
  - "No test may write a .security-allowlist to any real project root. Every arm of this criterion runs with no allowlist present in the fixture directory."
  - "Fixture files must not be placed under tickets/, docs/retrospectives/, docs/acceptance-criteria/ or templates/skills/. The pre-commit consumer post-filters entropy findings for those path prefixes, which would silently change the expected counts."
  - "Reporting the filename finding on a file whose contents are innocuous is a deliberate accepted cost here. Whether that noise should be reduced is GE-123d's subject; no implementation of this criterion may reduce it by ceasing to report the finding."
test_spec:
  - name: test_name_only_env_file_reports_exactly_the_filename_finding
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "An env-named fixture holding only ordinary configuration text, scanned through scan_files with no allowlist, returns exactly one finding for that file and it carries the filename rule id — the only place the name signal is observable on its own."
  - name: test_filename_finding_survives_alongside_all_four_content_findings
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The same fixture with the four recognised lines added returns five findings, one of which carries the filename rule id as its own separate result with its own line number, so an implementation that merges or drops the name finding once content findings exist fails."
  - name: test_every_baseline_filename_form_still_reports_its_filename_finding
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "One innocuous file per filename form in the frozen pre-change baseline set — bare dotted name, dotted-name-with-suffix, stem-plus-extension, and a case variant — scanned in a single run, each reports its filename finding; a rule narrowed to only the example name used elsewhere fails."
  - name: test_cli_exit_status_is_nonzero_for_a_name_only_env_file
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: e2e
    angle: reachability
    description: "The scanner CLI, run in a fresh subprocess with the fixture directory as its working directory over the innocuous env-named fixture alone, exits non-zero — the name signal reaches the author through the real entry point, not only through a returned list."
test_rationale: "This is the positive arm that stops the rest of GE-123a being satisfiable by deletion: with no filename rule at all, contents are trivially read and there is nothing left for a name-scoped suppression to silence, so GE-123a-1 and GE-123a-2 both pass on a scanner that has quietly lost a detector. The three descriptors that mirror the three arms fail independently by design — outright deletion, result-discarded-once-content-exists, and deletion-by-narrowing — and the third is the one a single-example test cannot reach, which is why its filename set is a frozen baseline rather than a list an author chose. RED-VS-GREEN HONESTY, so a later TDD-order check does not misread the baseline. Only ONE descriptor is red: test_filename_finding_survives_alongside_all_four_content_findings, because today an env-named file produces the filename finding and nothing else, so there is no 'alongside' to observe. The other three are GREEN ON ARRIVAL and are regression guards, not evidence the fix landed. test_name_only_env_file_reports_exactly_the_filename_finding passes today because one finding is all such a file can currently produce; after the fix it keeps the same expected value for a genuinely different reason, and that is the point of keeping it. test_every_baseline_filename_form_still_reports_its_filename_finding passes today because the recognised set is the baseline it is captured from; it exists to fail on a FUTURE narrowing. test_cli_exit_status_is_nonzero_for_a_name_only_env_file passes today for the same reason. A green-on-arrival majority is correct for a deletion guard and must not be read as a TDD-order violation."
