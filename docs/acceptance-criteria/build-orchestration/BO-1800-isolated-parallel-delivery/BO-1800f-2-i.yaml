created_by: "docs/acceptance-criteria/build-orchestration/BO-1800-isolated-parallel-delivery/BO-1800f.yaml"
criteria: |
  Given a copy that has declared it intends to remove file A,
    and a delivery, already brought up to date with the shared branch's current
    state, that removes all 200 lines of A and also removes 12 lines of file B,
    where B is on the shared branch and no removal of B has been declared,
  When the workflow examines what the delivery would take away from the shared branch,
  Then no part of the delivery leaves the copy,
  And the refusal names B,
  And the refusal does not name A,
  And given a second delivery from the same copy that removes A and nothing else,
    that delivery leaves the copy and A is gone from the result.
