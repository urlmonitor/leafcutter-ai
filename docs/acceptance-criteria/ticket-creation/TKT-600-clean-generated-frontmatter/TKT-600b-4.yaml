notes: |
  THE EXCLUSION IS IN THE CRITERIA ON PURPOSE, not only here. Runtime reconciliation is
  the cheapest implementation that clears the observed blocker: it is one write, it needs
  no agreement between the generator and the drive, and it fixes every ticket already on
  disk as a side effect. If the exclusion lived only in a notes field, that is the
  implementation a coder would reasonably choose, and it would pass TKT-600b-1 through
  TKT-600b-3 without ever making the two sides agree. Stated as criteria it is testable:
  compare the record before and after a run.

  WHAT THIS DOES NOT FORBID is bounded by TKT-600b-4-i — a phase that actually ran
  records its own outcome, and that is a write to the record which must remain legal.
  The line is authorship: the party that performed the work records it; the drive does
  not record work on behalf of a phase it declined to run.

  ADJACENT AND NOT ABSORBED — KI-BO-20260831-1932. In one drive the completion guard
  refused ticket 01 and flipped tickets 03 and 20 to done on identical conditions. That
  lenient path is a second and separate way the record stops being evidence, and its fix
  direction (take the phase list from the ticket, not from the caller's request) is a
  change to the completion write rather than to the drive's record-editing behaviour. It
  is left out of this AC deliberately. It matters here only as confirmation that the
  refusing path is the correct one, which is what this criterion is protecting.

  THE HALT ITSELF IS IN SCOPE HERE; THE WORDING OF THE HALT IS NOT. This criterion
  requires that the disagreement be surfaced and that both sides be named. Whether the
  message can state its own cause without contradicting itself — the "0 needed phases
  outstanding, and a refusal anyway" shape — is a diagnosability property recommended
  out to build-orchestration in TKT-600b's notes, because a generator fix would make
  that message stop appearing for this cause while leaving it able to mislead about the
  next one.
