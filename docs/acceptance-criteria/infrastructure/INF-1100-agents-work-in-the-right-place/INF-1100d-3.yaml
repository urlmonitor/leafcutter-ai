notes: |
  USER DECISION Q3: "a missing connection is reported, never guessed". Safety
  surface: the shipped address named a database LIVE, so a guess can point
  tests at a real database.

  W2 is the control: without it, an agent that reports the missing setting on
  every run passes W1 and trains users to ignore the message.

  MOSTLY PROMPT. The agent conduct is instruction text; an eval over W1/W2 can
  judge the hand-offs. The "stops with a message rather than passing" clause is
  deterministic if the DB test pattern reads the setting at run time — IT-PO
  may split it out as a python-coder L3 if the pattern gains a helper.
