notes: |
  The last scenario guards against a classifier that calls every push refusal a
  credential failure. Not decided here: whether the run's claim on the built criteria is
  released (BO-2400f-10) or kept after a credential failure. The work is committed and
  only delivery is missing, so releasing to todo invites a rebuild that BO-2400f-13 would
  then refuse on the occupied workspace. Flagged for the Product Owner.
