notes: |
  USER DECISION (BrainCandy, 2026-11-16). mypy findings become blocking as a
  RATCHET: a pull request fails only for mypy errors it ADDS and for
  `# type: ignore` comments it adds. Errors that already exist in a file the pull
  request touches do not block. Other agents clear the existing errors in batches
  (baseline measured 2026-11-16 over all tracked files: 789 errors in 158 files,
  371 existing `# type: ignore` lines); this record never fixes existing errors.

  WHY BP-1300. The L0 promises checks that matter block instead of emitting a
  warning nobody sees. The typecheck job was continue-on-error for exactly the
  reason this record removes: whole-file mypy charged every pull request for every
  old error in any file it touched, so the job could only ever be informational.

  WHAT IS NOT YET DONE AT THE L1 LEVEL. "Stops a pull request" is complete only when
  the job is a required status check. That promotion is deliberately out of scope
  of the first slice (BP-1300f-1): the user adds it to the required checks once the
  job runs clean on main. Until then the job's red is visible but does not block a
  merge, so this L1 stays todo while BP-1300f-1 can be done.
