title: "An interrupted commit leaves no half-written object behind"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1600-safe-concurrent-dispatch/BO-1600b.yaml"
criteria: |
  Given a supervisor is partway through writing its commit's git objects into the
    shared worktree
  When that supervisor is interrupted or fails before its commit completes (the
    process is killed, times out, or errors mid-write)
  Then the shared object store contains no zero-byte or partially-written loose
    object attributable to the interrupted commit
  And any object the interrupted commit had begun writing is either fully present
    and content-hash-valid or absent entirely (never a truncated intermediate file)
