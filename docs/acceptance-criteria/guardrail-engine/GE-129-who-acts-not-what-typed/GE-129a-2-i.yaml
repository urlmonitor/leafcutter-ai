notes: |
  WHY AN L3. The parent's discriminating cases all carry a readable identity. The mutation that
  turns only this record red is "on an exception or unreadable input, allow" -- the common hook
  convention of exiting cleanly on internal error. That convention must not apply to this guard.

  DECIDED 2026-09-17 (user, default accepted) -- FAIL CLOSED FOR COMMIT COMMANDS ONLY. The hooks
  convention elsewhere is fail-open on internal error (a broken hook must not block unrelated
  work). This guard departs from it for commit commands: if it fails while deciding on a commit,
  the commit is refused (condition (d)). For commands that are not commits the guard stays
  fail-open.

  (a)/(b) are distinct from the top-level session: absence of agent_id means the top-level
  session (GE-129d). agent_id present with no usable name is a subagent whose name is unknown.

  declares_side_effect: false -- the Then clauses assert a refusal and the absence of a commit.
