title: "Delivering your work never quietly removes someone else's"
component: build-orchestration
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  What you deliver is current, and removes nothing you did not mean to remove.

  When finished work leaves its own copy and heads for the shared main branch,
  it is first brought up to date with what is actually there at that moment, so
  it carries everyone else's recent work instead of an older picture of the
  project. And if a delivery would still take away something the shared branch
  already has, it does not leave the copy at all until that removal is one you
  have deliberately declared. Taking things away on purpose stays entirely
  possible; taking them away by accident stops being possible, and it stops
  depending on anyone remembering to check.
