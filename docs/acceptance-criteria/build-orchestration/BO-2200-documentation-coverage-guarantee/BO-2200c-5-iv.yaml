notes: |
  "Does that document exist and already say enough?" is a fact about disk at the moment the agent
  runs, so it belongs to the agent, not to the author of the AC -- the run-time half of the split
  whose author-time half is BO-2200c-5-i to -iii.

  Today the writer has no existence check at all: on a contract block it dispatches a specialist to
  write, and its only escape is to surface the problem as an open question. On ACD-2100a-1 it used
  that escape to decline on ownership grounds its own instructions never mention -- it inferred a
  rule nobody had given it, and the sign-off stayed green. Once ownership is decided at authoring
  time (BO-2200c-5-i), that inference is both unnecessary and wrong, which is why the last clause
  closes the hatch rather than leaving it as a fallback.

  The three-outcome requirement is load-bearing for BO-2200c-5-v, not bookkeeping: the verifier
  currently treats "the document is in this ticket's diff" as the definition of satisfied, so an
  idempotent writer that correctly changes nothing produces no diff entry and fails the coverage
  check. Without a distinct "already satisfied" outcome for the verifier to act on, this AC makes
  the build worse. The two must ship together.
