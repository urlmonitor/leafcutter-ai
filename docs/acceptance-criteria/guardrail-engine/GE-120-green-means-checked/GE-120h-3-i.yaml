assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "SHAPE, FOR ALL FIVE: always_run: true, pass_filenames: false, and NO files key. This is the shape check-file-size, check-build-drift, check-identifier-uniqueness and check-hook-trigger-reachability already carry (all four read from the manifest 2026-09-14). Do not add a files regex to any of them."
  - "THE SECOND ARM IS ALREADY ENFORCED BY A REGISTERED, RUNNING GATE — DO NOT BUILD A SECOND ONE. check_hook_trigger_reachability.py reports an always_run entry that also carries a files filter as a self-contradiction and fails the run, and it is registered (always_run, pass_filenames: false, no files key) so it judges the new entries on the same commit that adds them. This AC's job is to make the added entries pass that existing judgement and to cover the two failing arms with constructed fixtures, not to reimplement the reachability rule."
  - "THE THIRD ARM'S DISTINCTION IS THE REASON THE DEBUG-SCRIPTS ENTRY TAKES NO CONDITION. A kind-based pattern matching nothing today is NOTHING-TO-MATCH (non-blocking); a location-anchored pattern matching nothing is UNREACHABLE (blocking). `^debugging/scripts/` is location-anchored and this checkout tracks no file under debugging/, so that regex would fail the run where no regex at all is correct and silent. The rule and its escape hatch live in commit_guardian.json's __hook_trigger_reachability_nothing_to_match_doc and in _hook_trigger_reachability_helpers.has_location_anchor(); read them rather than re-deriving the distinction."
  - "THE THIRD CLAUSE CANNOT TRUTHFULLY BE SATISFIED WITH change_set_source: self_derived AS THE FIVE SCRIPTS STAND, AND THIS IS THE ONE FINDING THAT CONTRADICTS THE OBVIOUS READING. The field is not a free label. change_set_source._classify_hook() credits self_derived ONLY when the entry's own script text contains `get_authored_change` or `_authored_change` (_SHARED_SOURCE_MARKERS, read 2026-09-14); an entry that claims self_derived without one is placed in DeterminationResult.failures, and GE-120e-2's own test_spec names that case explicitly. All five scripts were grepped for both markers: zero hits. The two genuine self_derived entries are check-doc-frontmatter and check-contract-shrinking, which do import the shared source."
  - "SO THERE ARE EXACTLY TWO HONEST ROUTES, AND THE IMPLEMENTER MUST PICK ONE DELIBERATELY. (a) Declare handed_by_commit_path on all five — truthful today, the value the four structurally identical always_run entries already carry, and no code work; the criterion's third clause is then only partly served and that must be said out loud rather than papered over. (b) Migrate the four staged-set-deriving scripts onto the shared authored-change source first, which makes self_derived a verified claim — but that is code work, and GE-120h-3 is scoped to the five that need none, so it belongs in its own change. check_ac_done_on_merge.py can take neither route honestly: it runs post-merge over `git diff HEAD~1 HEAD` and is not an authored-change consumer at all. Do NOT take the third route of writing self_derived and moving on."
  - "THE LIVE SUITE WILL NOT CATCH A FALSE self_derived, WHICH IS WHY IT IS CALLED OUT HERE. test_ge_120e_2.py's real-manifest assertion only checks that every entry's value is a member of the allowed set; determine_change_set_sources() is exercised against fixtures, never against the installed manifest. A false declaration would therefore pass a green suite — the same declaration-checked-for-shape-not-for-truth shape as KI-CG-20260831-fictional-config-schema-fragment, one field along. If route (a) is taken, consider whether the real manifest should be put through determine_change_set_sources() too, and raise it rather than doing it silently under this AC."
  - "THIS AC ADDS NO MANIFEST ENTRY AND REMOVES NONE. It constrains the shape of entries GE-120h-3 adds. It therefore registers no package surface and carries no package_surface declaration; if an implementer finds themselves adding an entry here, they are building the parent."
  - "ADR-001 PARITY. The shape is expressed in templates/scripts/commit_guardian/commit_guardian.json, the canonical source. Verify through build.py that the deployed copies and the generated .pre-commit-config.yaml carry the same shape — a correct template beside a stale deployed copy is the condition GE-120c exists for."
test_spec:
  - name: test_ge120h3i_always_run_entry_carrying_a_files_filter_is_reported_and_fails
