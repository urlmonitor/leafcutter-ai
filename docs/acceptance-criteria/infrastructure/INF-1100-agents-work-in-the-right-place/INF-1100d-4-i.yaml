risk_surface: safety
notes: |
  EDGE CASES on both sides of the line: S1/S2 stop a narrow literal match from
  passing; S3-S6 stop an over-broad check from forbidding the guidance
  INF-1100d-5 needs to write.

  USER DECISION AT THE BA GATE (Q5): shipped documentation that quotes the
  address as history is edited to use a placeholder. It is never exempted by
  path. The check therefore has NO exclusion list. S7 is the case that proves
  it: it must fail before the edit and pass after. The doc edits themselves are
  owned by INF-1100d-5.

  No shipped code needs a literal of the old address (the user dropped
  stale-default detection at the BA gate, NQ1), so the check has no exceptions
  of any kind.

  IT-PO ENRICHMENT (2026-09-25)
  INTENDED must_catch: "exclude history pages by path" -> S7 before-redaction passes, test goes red;
  "require user:password@" -> S1 not flagged, test goes red; "flag any scheme://" -> S3/S4 flagged,
  test goes red; "scan the whole repo" -> the AC-store record is flagged, test goes red.

  SHIPPED SCOPE (user decision at the IT-PO gate): shipped = templates/
  (including templates/docs/) and config/, i.e. what build.py copies into
  installs. S7 is therefore a templates/docs/ page. The analysis page and every
  other page in leafcutter's own docs/ tree are unshipped, like the AC store: not
  scanned, and cleaned by hand under INF-1100d-5.

  IT-PO PASS 2 (2026-09-25): aligned to shipped = templates/ + config/. S7 is a
  templates/docs/ page, and the unshipped-records test covers both the AC store and a docs/ page.
