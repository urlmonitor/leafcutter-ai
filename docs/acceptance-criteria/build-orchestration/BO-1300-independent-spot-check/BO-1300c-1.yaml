created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-independent-spot-check/BO-1300c.yaml"
criteria: |
  Given a spot-check reviewer is probing a finished feature from its assigned angle
  When the reviewer carries out its review
  Then the reviewer actually exercises the feature (invokes it, feeds it inputs, walks its
    seams) to look for problems the existing tests and acceptance criteria were never
    written to catch
  And the reviewer does NOT run the project's unit test suite
  And the reviewer does NOT write or add any new tests
  And every finding the reviewer reports describes a gap discovered by using the feature,
    not a failing or passing unit test
