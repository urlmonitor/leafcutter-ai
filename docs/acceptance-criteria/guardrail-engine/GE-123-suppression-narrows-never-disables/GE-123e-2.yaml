id: GE-123e-2
components:
  - commit_guardian
title: "No word in the commit's own message, by any route the message travels, switches the feedback-id check off"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a scratch repository with the commit checks installed,
  And a staged ticket change that appends the sign-off heading
    "### 2026-11-16 10:00 — python-coder (status: ok)" with no feedback-id line,
  When that change is committed by each of these six routes in turn, from the
    same starting state:
    an inline message whose subject is "Add sign-off [NO-FEEDBACK-CHECK]";
    an inline message whose subject is "Add sign-off" and whose body line is
      "[NO-FEEDBACK-CHECK]";
    a message file holding that subject and body, handed to the commit by file;
    the shared commit step agents use, given that message file;
    a commit by file whose environment also names that message file in the
      GIT_COMMIT_MSG variable;
    a commit by file whose environment also names that message file in a
      variable called COMMIT_EDITMSG,
  Then every one of the six commits is refused and the branch tip is unchanged
    after each attempt,
  And each refusal is the same refusal the same change receives when committed
    with the plain inline message "Add sign-off",
  And no output of any of the six attempts says that the check was skipped.

  Given the same repository,
  And a staged ticket change that appends the same heading followed, on the next
    line, by "feedback-id: fb_2026-11-16_a1b2c3d4",
  When that change is committed with the inline message
    "Add sign-off [NO-FEEDBACK-CHECK]",
  Then the commit succeeds,
  Because the token is now ordinary text: it neither excuses a missing id nor
    causes a present one to be refused.
depends_on:
  - GE-123e
  - GE-123e-1
