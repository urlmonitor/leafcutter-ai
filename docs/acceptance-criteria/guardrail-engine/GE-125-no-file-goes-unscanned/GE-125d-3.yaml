test_rationale: "This record's central claim is a negative — that on one class of run nothing is said at all — and a negative is only provable by capturing the real process output of a real run and asserting the buffers are empty. A test over a formatter would assert that a function returned None while an unconditional warning printed elsewhere in main() sailed past, which is precisely the failure the first arm exists to catch. The 40-file entry is therefore the load-bearing entry of the whole L1 and is kept as its own descriptor rather than a clause on a sibling. The remainder-line entry exists because the 30-file case cannot see an off-by-one at the bound: at 10 and at 11 affected files the two behaviours differ by exactly one line, and that is where the bound is actually specified. The exit-status entry compares against the check's present-day verdict on the same input rather than against a hard-coded code, so it keeps holding when a sibling changes what is reported. Fixtures are generated inside the throwaway repository with their credential-shaped content assembled at runtime from fragments, following unit_tests/commit_guardian/test_scan_secrets_suppression.py, so 40 and 30 real files exist for the run while the test source itself trips no rule. Both streams are captured separately throughout, because a merged capture cannot tell silence on stderr from silence overall."
