expects_from:
  - ac_id: INF-800f
    contract: >-
      A restructuring specialist a supervisor can engage as part of an ordinary workflow.
      Added by the IT PO at enrichment: this record's account must state THAT THAT PARTY was
      engaged and HOW MANY TIMES, and must tell 'could not be engaged at all' apart from
      'engaged and returned nothing usable' — three facts that presuppose an engageable
      identity with a defined result. The dependency was reachable only transitively through
