estimated_complexity: M
it_requirements:
  - "The examined population must be derived from the registration data the check family already maintains. The census may not keep a list of its own - a census roster would be a fifth enumeration opened on the same day GE-126d closes the fourth."
  - "Where the parity check's notion of the registered set already exists, share it rather than growing a second reader of the same data. If it cannot be shared, record the reason in the implementation rather than leaving the divergence to be inferred - the L1 asks for that explicitly."
  - "A registered check whose script cannot be located is reported as attempted and unexecutable, never dropped. A shrinking denominator makes the instance count look better without anything having improved, which is the arithmetic form of this tree's defect."
  - "A deregistered check must disappear from the examined count rather than becoming an unexecutable finding. Those are different facts - one is 'this is no longer in the population', the other is 'this is in the population and I could not run it' - and conflating them makes every removal look like a defect."
  - "The census must report the registration source it derived its set from. A measurement whose population is unstated cannot be compared with the next one, and GE-126e-5 publishes figures that a reader must be able to scope."
  - "The registration data must be read from the DEPLOYED layout, matching where the census executes the checks. Reading the source manifest while executing deployed copies measures one population and enrols another."
  - "Register and deregister exercises must be performed in an isolated fixture tree; the repository's own registration data must never be written by a test."
  - "Error handling must follow the four rules in CLAUDE.md. Unreadable registration data must be reported, not failed open on - a census that fails open on its own enrolment examines nothing and says nothing is wrong."
test_spec:
  - name: test_a_newly_registered_fixture_appears_with_no_census_side_edit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    surface_invoked: "the census entry point"
    description: "A fixture check registered by following the documented procedure appears in the examined count and receives a classification, with no edit to the census of any kind - the assertion a hardcoded list cannot pass."
  - name: test_a_deregistered_check_leaves_the_population_rather_than_becoming_unexecutable
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "Removing the fixture from the registration data drops it from the examined count and does NOT report it as unexecutable - the two facts are kept distinct so a removal does not read as a defect."
  - name: test_a_registered_check_with_no_locatable_script_is_named_as_unexecutable
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "A check the registration data names but whose script cannot be found is reported as attempted, unexecutable and named - never quietly removed from the denominator."
  - name: test_no_check_outside_the_registration_data_is_examined
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A check-shaped script present on disk but named by no registration data is absent from the examined set, so the examined count and the registered set describe the same population."
  - name: test_the_census_enrols_from_the_deployed_registration_data
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: "scripts/build.py --target-dir <temp> then the census entry point"
    description: "After a real build, the reported registration source resolves to the deployed layout - the same layout the checks are executed from, so the enrolled and the measured populations are one population."
test_rationale: |
  A hardcoded census roster passes every test that asks whether the census examines many
  checks, and silently omits every check added after it was written — which is the same
  enumeration-drift shape KI-CG-020 records, occurring inside the instrument built to
  detect that family. Only the register-and-rerun exercise, with no census-side edit,
  distinguishes derivation from a list. The deregister descriptor covers the opposite
  direction and specifically the wrong repair for it: reporting a removed check as
  unexecutable, which would make every deletion look like a finding. The
  unlocatable-script descriptor protects the denominator, and the deployed descriptor
  guards against enrolling from one layout while executing from another, which would
  produce a population that neither surface actually describes.
delivers_to:
  agent: architecture-diagram-author
  contract: "The derivation of the census population from the registration data, and the reported registration source. GE-126e-4's diagram must show the population as derived rather than held, and must show which registration surface it is derived from, so a reader can see why a newly registered check is enrolled automatically."
