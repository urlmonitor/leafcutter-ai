notes: |
  This is the reachability half of making BO-2400c-1 real. The layering function has
  been correct and fully tested since 2026-07-21; what it has never had is a way for
  the lane to call it. The workflow engine cannot import Python, cannot read a file,
  and cannot spawn a process — it can only ask an agent to run one command. A module
  with no command-line entry point is, from the lane's position, unreachable.

  KI-BO-005 records that the orphaned runner nonetheless calls it as a script. The path
  resolves, the call runs, nothing happens, and every test stays green. Reachability is
  therefore not an implementation detail of the wiring — it is a separate promise that
  needs its own executed proof.
