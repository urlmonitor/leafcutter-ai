notes: |
  THE FAIL-CLOSED CASE FOR BO-1900a-5. Today no craft declares the capabilities its own
  instructions oblige it to invoke, so a comparison implemented naively has nothing to
  compare and would return "fit" for every dispatch — reproducing the observed defect while
  appearing to be a working check. That is why the absence of a declaration must be its own
  outcome rather than a pass.

  THREE OUTCOMES, NOT TWO. The third Then clause requires "unconfirmed" to be distinguishable
  from "confirmed absent". They call for different responses — the first is a gap in the
  craft's own declaration, the second is a genuine mis-provisioned dispatch — and collapsing
  them into a single failure makes the first unfixable, because nobody can tell which crafts
  are undeclared.

  PROOF OBLIGATION. Provable only by running a comparison against a craft with no declaration
  and observing the outcome it produces. Asserting that a declaration field is absent from a
  template is a presence check, not evidence of what the run does with the absence.

  MECHANISM IS THE IT PO'S. Where the declaration lives is not decided here.
