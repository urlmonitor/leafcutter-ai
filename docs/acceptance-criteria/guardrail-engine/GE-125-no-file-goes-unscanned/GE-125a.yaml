criteria: |
  A folder name repeated elsewhere no longer switches off detection.

  The places that get less scrutiny are the specific ones the project chose,
  identified from the top of the project down. A feature area, a bought-in
  dependency, or any nested folder that merely reuses one of those names keeps
  full credential detection.
