criteria: |
  Behavior that keeps reappearing is turned into one reusable, adjustable spec.

  When the same behavior shows up in more than one requirement, it is lifted
  out into a single named pattern that other requirements point at — and adjust
  for their own situation — instead of restating it from scratch. This happens
  both while new requirements are being written and as a deliberate pass over
  the requirements already on the shelf, so a starting set of patterns exists
  rather than waiting for one to appear on its own. Without this producing
  half, "define once, reuse everywhere" can never begin: with nothing to reuse,
  every check for an existing pattern comes up empty and another one-off
  specification is written instead.
