id: GE-127f-4
title: "The refusal states the two-for-one obligation it actually enforces, not a one-for-one one the author can satisfy and still be refused"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  GE-127f's rule is that an oversized file "gets smaller by about twice what
  the change adds to it" -- GE-127f-1 implements that as
  `lines > max(limit, previous - added)`, with `added` the GROSS measured
  lines the change PUT INTO the file (GE-127f-2). Below the cap that resolves
  to: a change adding A measured lines must take out at least 2A.

  The closing advice of the grown-file refusal states a DIFFERENT, weaker
  rule. It reads "Shrink it, or add no more than you remove, to commit this
  edit" -- that is, remove at least as many as you add (R >= A). An author who
  does exactly that is still refused, because R >= A is not R >= 2A.

  The refusal already prints the correct REQUIRED LENGTH as a number on the
  line above. So the block as a whole contradicts itself: a correct figure
  followed by prose advice that, if followed, does not reach it. The number is
  not the problem and must not be changed -- the prose is.

  Scenario: Removing exactly as many lines as were added is still refused, and
            the advice no longer claims otherwise
    Given a tracked file of a kind the size standard covers has a permitted
      length of 400 measured lines,
    And it stood at 500 measured lines before the change, so it is already
      over its permitted length,
    And the staged change puts 10 measured lines into it and takes 10 measured
      lines out, leaving it at 500,
    When the size standard judges the staged change,
    Then the change is refused, because the required length is 490 and the
      file stands at 500,
    And the refusal's closing advice does NOT tell the author that adding no
      more than they remove is sufficient,
    And the refusal's closing advice states that reaching the required length
      means taking out about twice what the change puts in,
    Because advice an author can follow exactly and still be refused is worse
      than no advice: it sends them round the loop a second time having done
      what they were told.

  Scenario: Removing twice what was added is accepted
    Given the same file at 500 measured lines with a permitted length of 400,
    And the staged change puts 10 measured lines into it and takes 20 out,
      leaving it at 490,
    When the size standard judges the staged change,
    Then the change is accepted,
    Because 490 is the required length (previous 500 less the 10 added), and
      this is the case the corrected advice now describes.

  Scenario: The stated required length is unchanged
    Given any file and change reaching the grown-file refusal,
    When the refusal block is produced,
    Then the "Required length:" figure it states is the same figure it stated
      before this change,
    And the "Previous length:", "New length:", "Limit:" and "This change
      added" figures are likewise unchanged,
    Because this criterion corrects a sentence of prose only; the arithmetic
      and every number derived from it belong to GE-127f-1 and GE-127f-2 and
      are not touched here.
