readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Per-test results, not one combined verdict that hides the inert one.

  When the guarded behaviour is deliberately broken, the outcome is reported for
  each test on its own. A single combined answer says "the group noticed" and
  lets the one test that noticed nothing stay in place, still green, still
  counted as protection it does not provide.
