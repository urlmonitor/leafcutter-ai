title: "An artifact produced empty fails its proof, whatever its kind"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given members whose declared artifacts were produced but produced hollow — a page
    with a heading and no body, a diagram with no elements, a screen that renders
    nothing, a prompt no surface loads, and a setting no component reads,
  When each member's proof is established,
  Then each proof fails and none of those members is finished,
  And this holds for every kind of artifact, including the kind whose defined proof is
    the least demanding — so for no kind is the presence of an artifact sufficient on
    its own,
  And for those kinds whose proof compares two conditions, the hollow artifact shows
    itself as a comparison in which the two conditions produced the same result, and a
    comparison recording no difference is never a passed proof.

  Given a hollow artifact that failed its proof,
  When the run reports it,
  Then the report states that the artifact was produced but does not deliver what the
    requirement asked for, and names the member,
  And it does not report the artifact as missing — because it is not missing, and a
    reader told it is missing will go looking for a run that did not happen.

  Given a group in which one member's artifact is hollow and the rest are sound,
  When the run reaches its ending,
  Then the run does not succeed, and no member of the group is marked finished.
depends_on: [BO-3500c]
