estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-500a-1
  contract: Mining round result, plus the published category records (docs/criteria/ through its index) and the open-candidate pool it compares against.
change_target: code
risk_surface: internal
it_requirements:
- 'Before proposing anything, each sighting is compared with every published category, every staged category in the local run root and every open candidate in the mining store, using the shared wording rule. A sighting whose wording is a label of one of them is reported as a sighting for that category, never as a new candidate. Wording equality (''exact match'', ''identical'', ''repeat'', label uniqueness) is one shared rule for every caller (offline grouping, in-run grouping, publish label checks, drafted-repeat removal, edit detection): Unicode NFC, trimmed, internal whitespace collapsed to one space, case-folded; punctuation and word order stay significant. No caller may apply a looser or stricter rule of its own.'
- Open candidates keep their ids across rounds; a later round extends an open candidate's mined_from with new sightings instead of proposing a second candidate.
- Mining never writes a published or staged category. A sighting for a published category becomes a review item for the review run (DK-500c-1), not a change.
- A published-record sighting that is already a member of its category is not reported as new, which keeps both options of DK-500d-3 consistent.
test_required: true
test_spec:
- name: test_no_candidate_from_published_labels
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A second round proposes no new candidate whose wordings are labels of cat-1dc11c5a2ffa7310.
- name: test_open_candidate_not_reproposed_under_new_id
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The open candidate cat-73d233fc8b15c735 is not proposed again under another id.
- name: test_published_category_unchanged_by_mining
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The published record of cat-1dc11c5a2ffa7310 is byte-identical before and after the round.
- name: test_new_published_wording_reported_as_sighting_for_existing_category
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A newly published decision asking 'Can it be built and verified as one ticket?' is reported as a sighting for cat-1dc11c5a2ffa7310, not as a new candidate.
- name: test_existing_member_not_reported_again
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: boundary
  description: A published-record sighting that is already a member is not reported as a new sighting.
test_rationale: Exercise the public mining entry point with a fixture decision store and a controlled Langfuse observations port (no live Langfuse); assert the returned result, the mining store and a before/after snapshot of docs/ and the run root. A unit test of a sighting parser alone would not prove that both sources are read through the real entry point.
