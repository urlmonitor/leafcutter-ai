id: GE-124g-1
readiness: approved
priority: high
title: "A declaration is never written into a criterion's covered_by"
component: guardrail-engine
components:
  - ac_store
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124g.yaml"
criteria: |
  Given a front-end file names the criterion KM-ADM-004 in its component-level
    declaration
  When any tool or agent records that declaration against the criterion
  Then the criterion's `covered_by` list is unchanged
  And the declaring file path is recorded in `declared_by`, a field that holds
    component-level declarations only

  Given a rendered element pins the criterion KM-ADM-004
  When any tool or agent records that pin against the criterion
  Then the criterion's `covered_by` list is unchanged
  And the pin is recorded in `pinned_by`, a field that holds element pins only
  And it is not recorded in `implemented_by`

  Given a tool attempts to add a front-end file path or an element pin
    identifier to a criterion's `covered_by`
  When the write is evaluated
  Then the write is rejected and the report names the criterion, the value, and
    the field the value belongs in
  And the rejection holds for every criterion, with no warn tier, no per-item
    exception, and no configuration key that permits it
