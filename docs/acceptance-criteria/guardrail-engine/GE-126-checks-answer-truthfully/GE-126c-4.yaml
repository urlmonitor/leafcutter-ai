id: GE-126c-4
title: "Which copy of a check is the one that enforces is written down where an author will read it"
component: guardrail-engine
components:
  - commit_guardian
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an author editing a check who wants to try it out and who is by definition already
    working in the tree where its source lives,
  When they consult the reference material for this check family,
  Then it states which copy of a check enforces and which copy is a build input and states
    that running a build input is not a way to verify anything,
  And it names the one check known to be structurally incapable of running from the
    build-source tree together with the reason it can never run there,
  And it does not assert that build-source copies in general can or cannot run because that
    has not been measured,
  And it records the observation that motivated the rule with its date and states the
    workaround that was used before the repair so a reader recognises the situation if they
    meet it in an older copy,
  And any statement in the reference material that a warning followed by a zero exit is an
    acceptable response to a dependency a copy can never satisfy is removed rather than
    qualified.

  Coverage note: covered by a test that takes the reference's statement about which copy
  enforces and asserts the behaviour matches — the named build-source copy refuses and the
  named enforcing copy produces a verdict on a record known to violate. A test that asserts
  the reference mentions the distinction does not cover this criterion.
depends_on:
  - GE-126c
  - GE-126c-1
  - GE-126c-2
  - GE-126c-3
