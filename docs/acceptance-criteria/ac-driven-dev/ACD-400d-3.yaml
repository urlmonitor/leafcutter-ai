title: "Work that names no urgency is ranked as middle-urgency, by a stated verdict rather than by omission"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given three pieces of work are ready to be picked up: one recording medium urgency
    and a large size, one recording no urgency at all and a small size, and one
    recording low urgency and a small size,
  When the queue is asked which work is ready,
  Then the piece with no recorded urgency is offered first, ahead of the
    medium-urgency piece only because it is the smaller of the two, and ahead of the
    low-urgency piece because low ranks beneath middle,
  And a store that differs only in whether that piece records medium urgency or
    records none at all yields the identical offer, so work naming no urgency is
    ranked exactly as middle-urgency work is — not ahead of it, not behind it, and
    not in a tier of its own,
  And the piece is offered in every case: naming no urgency affects only where the
    work sits in the offer.
depends_on: [ACD-400d, ACD-400d-1]
