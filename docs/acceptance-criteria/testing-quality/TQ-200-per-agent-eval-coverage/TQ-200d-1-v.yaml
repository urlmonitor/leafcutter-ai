it_requirements:
  - >-
    Fix-location decision (IT PO): the fix is on the eval side only, in judge_verdict (scripts/evals/produced_tests_runs.py
    :265-275). scripts/build_orchestration/_wvr_verdict.py (assemble :114-143, classify_run :73-101) and wrong_version_runner.py
    are not changed, so a must_catch survivor in real build work keeps blocking the gate. write_ac_records (:242-250)
    keeps giving every tagged test a test_spec entry with must_catch [wrong_version], so every tagged test is in
    scope, runs on the fixed version in the runner's baseline and runs under the wrong version.
  - >-
    judge_verdict passes the row when, and only when: (a) at least one result row is 'caught' for the row's wrong_version
    from a tagged test; (b) the verdict has no reason_override (a tagged test failing on the fixed version, a stopped
    run or an internal error - reason 'failing on the code as written' or any reason other than null or 'survivor'
    - fails the row); (c) verdict['unfinished'] is empty; and (d) every blocking row that is not 'caught' is a 'survived'
    row of a tagged test under the row's wrong_version. Its detail names the catching test and the wrong version
    ("caught '<wrong version>' by <test>") and lists the tagged tests that passed under the wrong version as not
    blocking in the eval. Every other case keeps today's failing detail, including "not caught by the runner (survivor)"
    when all tagged tests survive and "no '# covers: <AC-ID>' tagged test in the output" (wrong_version_run :278-291
    unchanged). An untagged catching test never counts, because only tagged tests are written to the AC records.
  - >-
    scripts/evals/sets/test-writer.jsonl row refresh-gate is unchanged; its recorded gold output still passes.
  - >-
    Unit tests never call a live model; they score recorded outputs and probe fixtures only. Kept live outputs are
    copied by the test-writer from the kept-outputs folder of the 2026-11-02 runs (<session scratchpad>/kept_runs/run1|run2/<set>/<row>/,
    local to the run machine, as the known issue names it) into unit_tests/evals/fixtures/tq200d-rerun/<set>/<row>/run1|run2/
    as flat '<name>.py.recorded' files plus report.md (and transcript.jsonl where the row reads commands), the gold-output
    form place_outputs reads, so a bare pytest never collects them. Absolute local paths in a copied file (for example
    a sys.path line naming a user temp folder) are replaced with a neutral placeholder and nothing else is changed.
    No committed file names the scratchpad path. If another TQ-200d re-run AC has already created a needed fixture
    file, it is reused, not copied again. Probe fixtures for this AC: test-writer/refresh-gate/run1 and run2 (test_refresh_gate.py.recorded
    plus report.md; run2's tests/__init__.py is not needed in the flat form). The first live run's output was not
    kept (see notes); the copies with the catching test removed are built by the test. Tests run the real shared
    runner against the row's fixture project (scripts/evals/sets/test-writer/projects/refresh-gate) like unit_tests/evals/test_tq200d1i_refresh_row.py.
  - >-
    Every changed .py file stays at or under 400 counted lines; run_agent_eval.py is not touched and does not grow;
    no new module is added at the top of scripts/evals/. unit_tests/evals/ is at its density cap, so this AC's tests
    go in their own subfolder (named in test_spec) with an __init__.py, like unit_tests/evals/tq200d1ii/.
  - >-
    DOCUMENTATION (part of done) - the wrong_version_run entry on docs/reference/produced-tests-eval-assertion-kinds-test-writer.md
    must state: every tagged test is written with must_catch and runs on the fixed version and under the wrong version;
