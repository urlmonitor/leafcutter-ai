change_target: code
risk_surface: contract_boundary
notes: RQ1/RQ2/RQ7; BA-01, BA-02, BA-05, ITPO-01, ITPO-03, CODER-02, QA-01. Extends input clarification to answer
  semantics and counting scope; does not replace the completed clarification control flow. Authored using the business-analyst
  template under explicit user authorization to draft ACs; not approval or implementation proof.
it_requirements:
- Retain immutable repository/source SHA provenance, bounded registered read-only queries and existing kernel authorization,
  budgets and retries. This contract adds no arbitrary Cypher, new network endpoint, source-write permission or
  automatic query activation.
- The named fields below describe the planned observable semantic contract; preserve compatible existing envelope
  fields and version any incompatible extension. Required unavailable values stay explicit and are never inferred
  from an evaluation oracle.
- Resolve count semantics before capability selection. The canonical work_status field must not alias graph lifecycle
  status; record the population and whether only the selected root or every parent is excluded.
- Preserve the original question, explicit user answers and unresolved scope in the existing serialized run/resume
  state and pass the same requirements to query selection and final sufficiency assessment. Previously resolved
  material choices must not be asked again.
- A supported operation may expose fewer fields than requested; retain those requirements and report a gap instead
  of weakening the question. Clarification is bounded and uses the existing continuation contract.
test_required: true
test_rationale: Planned criterion and public reachability proof includes real producer/consumer boundaries and named
  plausible wrong outcomes. No descriptor is executed coverage; no provider, database or deployment result is asserted.
test_spec:
- name: test_research_resolves_count_scope_and_preserves_explicit_choices
  target_dir: tests/kernel/
  framework: pytest
  type: integration
  angle: reachability
  description: Invoke the public research entry point with an ambiguous test-writing status question and then an
    explicit TQ-500f all-L2/L3-descendants request; assert focused clarification only for the ambiguous input, work_status
    as the requested fact and the explicit root-excluded scope preserved.
  must_catch:
  - Accepting an ambiguous global count or repeatedly asking an already answered scope question.
  covers:
  - KM-500e-1
  requires_db: false
  surface_invoked: Existing kernel research run/resume entry point using retrieve.repository
- name: test_answer_requirements_keep_root_only_and_terminal_leaf_distinct
  target_dir: tests/kernel/
  framework: pytest
  type: integration
  angle: criterion
  description: Using the pinned RQE-01 population, assert the requirements distinguish all 15 descendants from 11
    terminal leaves without substituting lifecycle status or hard-coding those totals for other revisions.
  must_catch:
  - Treating root-excluded and terminal-leaf-only populations as interchangeable.
  covers:
  - KM-500e-1
  requires_db: false
- name: test_answer_requirements_survive_real_run_resume_handoff
  target_dir: tests/kernel/
  framework: pytest
  type: integration
  angle: real_artifact
  description: Serialize a real clarification result through the existing checkpoint producer, reopen it in a fresh
    process and resume through the real consumer; assert original question, required fields, scope and explicit
    answers survive unchanged.
  must_catch:
  - A resume dropping work_status or replacing the original question with the first query output.
  covers:
  - KM-500e-1
  requires_db: false
- name: test_query_selection_cannot_remove_unavailable_required_field
  target_dir: tests/kernel/
  framework: pytest
  type: integration
  angle: seam
  description: Pass requirements from the real planning producer to capability selection and sufficiency assessment
    with an operation lacking work_status; assert the original field obligation remains unresolved.
  must_catch:
  - Declaring fulfillment after silently deleting the unavailable field from answer requirements.
  covers:
  - KM-500e-1
  requires_db: false
