notes: |
  Quick-fix, 2026-11-02. The live re-run of the produced-tests evals failed 6
  rows and none could be checked, because live_output() writes the agent's
  output into the TemporaryDirectory score_one() deletes. The kernel decision
  (run-c0b71afec3e34fc0, option opt-classify-then-fix) makes keeping the
  outputs the first step before classifying the failures. An environment
  variable, not a CLI flag, because run_agent_eval.py must not grow.
test_spec:
  - name: test_live_row_outputs_are_kept_when_keep_dir_is_set
    target_dir: unit_tests/evals/tq200d1iii/
    framework: pytest
    type: unit
    description: >-
      With LEAFCUTTER_EVAL_KEEP_OUTPUTS set, a live row (agent invocation faked to write a test file and
      reply) leaves files/<test>, report.md under <dir>/<set name>/<row id>/ after score_one returns, for
      a failing row too.
  - name: test_rerun_replaces_kept_row_outputs
    target_dir: unit_tests/evals/tq200d1iii/
    framework: pytest
    type: unit
    description: A stale file in the kept row folder is gone after a second run of the same row.
  - name: test_nothing_kept_when_unset_or_score_gold
    target_dir: unit_tests/evals/tq200d1iii/
    framework: pytest
    type: unit
    description: With the variable unset, or with score_gold, no folder is created in the keep directory.
