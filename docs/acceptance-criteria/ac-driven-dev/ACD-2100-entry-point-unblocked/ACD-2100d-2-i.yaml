notes: |
  WHY THIS IS WORTH PINNING SEPARATELY. The 2026-08-18 workaround did not fail
  loudly; it disappeared. The person who applied it had every reason to believe the
  defect was fixed, and the next build silently restored the broken behaviour with
  no trace in any output. One line naming the file at install time would have closed
  that gap, and it costs nothing.

  THE THIRD CLAUSE KEEPS IT USABLE. Every generated file is replaced on every
  install; a message for each one is noise that gets filtered and then ignored. The
  statement is for files that actually diverged, which is also what makes the
  behaviour testable -- run the installer twice, change one file in between, and
  assert the statement appears exactly once and names exactly that file.

  THE INSTALL STILL WINS. This does not make the installer refuse or preserve the
  local change; build output is generated and must be regenerated. The requirement
  is that the loss is announced, not prevented.

  2026-08-25 (it-po): the shared-determination requirement is the load-bearing one and
  it is the reason this record has an expects_from edge at all rather than standing
  alone. Its depends_on already carries ACD-2100d-2, so the edge is visible to the
  build sequencer.

  IT PO ENRICHMENT -- 2026-08-26 (files_touched backfill).

  WHY THIS RECORD PRODUCED AN EMPTY files_touched. generate_ticket_from_ac.py derives
  the ticket surface as the union of path tokens found in it_requirements prose that
  exist on disk, plus doc_links whose relationship is one of constrains / creates /
  implements / modifies / specifies. Every doc_link here was "describes" and no
  it_requirement named a path, so the union was empty. Fixed at the cause below, so a
  regeneration reproduces the same three paths.

  NARROWED ON REVIEW, SAME DAY. My first pass listed four paths and included
  build_helpers.py, on the reasoning that the divergence determination lives there and
  this record depends on it. That was wrong, and the coordinator was right to push back.
  A dependency is not a surface. The determination is ACD-2100d-2's deliverable and
  reaches this record through the expects_from contract; listing the file here would have
  given two tickets authority over one file for two different reasons, which is exactly
  the ambiguity files_touched exists to remove. The boundary rule applied: THE RECORD
  THAT AUTHORS A SHARED ARTIFACT LISTS IT; THE RECORD THAT CONSUMES IT DECLARES THE
  DEPENDENCY IN expects_from AND DOES NOT LIST THE FILE. Under that rule the two records
  now have zero overlap.

  THE THREE PATHS, AND WHY EACH ONE IS THERE.

  scripts/build.py -- the installer entry point and the owner of the process whose stdout
  the criteria call "its output for that run". Its write_file helper carries one of the
  four compare-before-write branches; the branch that decides the on-disk content differs
  from what is about to be written is exactly the moment the announcement describes.

  scripts/build_phases.py -- three more of those branches, and the reason this record is
  worth more care than its S sizing suggests. Verified on 2026-08-26: _write does a text
  equality compare, _files_content_identical does a SHA-256 compare ahead of copy2 at
  roughly fourteen call sites, and the workflow-script phase does its own inline SHA-256
  compare that never calls _files_content_identical. That last phase is the one that
  installs the route itself. An implementation that instruments only the obvious shared
  text helper would therefore be silent for precisely the file this whole epic is about,
  and every test written against the text path would still pass. This is the
  enforce-on-the-gate-that-actually-runs shape; naming all four branches in the
  requirements is what keeps a coder from shipping a partial no-op.

  unit_tests/build_guards/test_acd_2100d_2_i.py -- the four descriptors. target_dir is
  the build_guards package on every one, and the generator already names this exact path
  in the ticket's Test Requirements block.

  PATHS CONSIDERED AND REJECTED.

  build_helpers.py -- rejected on review; see the narrowing note above. It is where
  ACD-2100d-2's determination is computed, and it is that record's surface.

  check_output_drift.py under the commit-guardian tree -- rejected for the same reason. It
  is the delivery check, which is the parent's reporting side. This record is the
  installer's announcement at write time.

  The generated build manifest -- rejected. It is an artifact the installer writes, not a
  file anyone edits.

  A SECOND-ORDER RISK WORTH FLAGGING TO WHOEVER IMPLEMENTS THIS. The announcement fires
  from inside the installer's write path, and the tests run the real installer as a
  subprocess against a temporary target. Take care that the announcement cannot fire for
  the manifest file the installer writes about itself, or the exactly-once assertion in
  the boundary descriptor becomes order-dependent.
target_epic: EPIC-StartingNewWorkTheProperWayAlways
