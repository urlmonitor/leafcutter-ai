criteria: |
  Given the routing config already contains an entry:
    - group: "docs-general", path_pattern: "docs/**"
  And the specialist proposes a new entry:
    - group: "architecture-docs", path_pattern: "docs/architecture/**"
  When the specialist validates the proposed entry against existing config,
  Then the specialist detects that "docs/architecture/**" is a subset of "docs/**"
    (the existing "docs-general" entry would match these files first due to array order),
  And the specialist reports the conflict to the user:
    "Proposed pattern 'docs/architecture/**' overlaps with existing entry
    'docs-general' (pattern: 'docs/**'). The new rule would never match
    unless placed before the existing entry."
  And the specialist suggests placement options (before vs. after the conflicting entry),
  And the specialist does NOT silently insert the rule at the end where it would be unreachable.
