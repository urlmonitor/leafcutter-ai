id: ACS-1300b-2
components:
  - ac_store
  - build_orchestration
title: "A bypassing path records the link by reaching the existing writer, not a second one"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a delivery path the enumeration classifies as bypassing,
  And work completed through that path for a requirement that a present, passing,
    coverage-tagged test names,
  When that path runs to completion out of process,
  Then the requirement's record holds that test's path in its coverage list afterwards,
  And the entry it holds is compared entry to entry against the entry the ticket route's
    own link-recording step produces for the same requirement and the same test, and the
    two are the same,
  And removing the single hand-off from that path to the existing link-recording step
    leaves the requirement's coverage list unchanged after the same run, so the entry
    observed above came from that step rather than from a writer added alongside it,
  And the record's finished-state field is character-for-character identical before and
    after the run,
  And a requirement named by no passing test is left with its coverage list unchanged in
    that same run, so the path records evidence that exists rather than every requirement
    it touches.
