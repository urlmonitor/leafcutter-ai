criteria: |
  Given the triage agent returns route: "strategic",
  When the /plan-feature workflow script processes the routing decision,
  Then it dispatches product-owner with the user's request,
  And waits for the product owner to write L0/L1 ACs to the AC store with readiness: draft,
  And presents the product owner's output to the user for confirmation (gate 1),
  And only after user approval dispatches business-analyst with the L1 AC ids,
  And waits for the business analyst to write L2/L3 ACs with readiness: draft,
  And presents the business analyst's output to the user for confirmation (gate 2),
  And only after user approval dispatches it-po with the full AC batch,
  And waits for the technical planner to record per-clause test intent and set
    readiness: reviewed,
  And does not present the technical planner's output to the user: that stage is
    approved automatically once its requirement rule check passes, and is committed,
  And only then runs the design pre-pass and dispatches the test-designer for the batch,
  And presents the batch with its test design to the user for one priority and
    approval (the final gate).
