it_requirements:
  - "TARGET AND PARITY: templates/scripts/setup_ticket_worktree.py is canonical. VERIFIED 2026-08-14 that all three copies exist — templates/scripts/setup_ticket_worktree.py, scripts/setup_ticket_worktree.py and .leafcutter/scripts/setup_ticket_worktree.py. ADR-001 applies: edit the template, run 'python scripts/build.py --target-dir .', confirm all three match. Callers invoke the DEPLOYED copy, so a template-only change is a no-op."
  - "PROTECTION STEPS IN SCOPE, at minimum the ones observed no-opping: locating and running verify_precommit_active.py and install_pre_commit_shims.py (both present under templates/scripts/commit_guardian/), and establishing .pre-commit-config.yaml / the .leafcutter layout in the new copy."
  - "ENUMERATE THE STEPS FROM A DECLARED LIST that the reporter iterates — not from scattered print statements. Both the exactly-once clause and the not-established count are unenforceable over ad-hoc prints, and a report that miscounts is a report the reader stops trusting, at which point it protects nothing."
  - "EXACTLY ONCE ON EVERY PATH, INCLUDING SKIP PATHS. This project has already shipped the inverse defect: per-step records were added inside skip branches while the pre-existing UNCONDITIONAL record after the if/else was left in place, so every skipped step double-recorded, and the structural test's regex was blind to the template-literal call. CONDITIONALIZE the pre-existing unconditional call — move it into the execute branch or guard it — do not merely add a second one (CLAUDE.md, 'Skip-Branch Side-Effects — Conditionalize, Don't Add')."
  - "A not-established step names the SPECIFIC ARTIFACT by path that it could not find or create, never the general activity ('could not set up hooks')."
  - "The closing summary states the NOT-ESTABLISHED COUNT, and a run with a non-zero count is not presented as a completed set-up. The refusal itself is GE-119d-2; this AC is the visibility half, and reporting comes first because a set-up that refuses without saying which step failed just moves the opacity."
  - "Error-handling policy: each step's failure is a caught SPECIFIC exception, logged at WARNING, and recorded as a not-established outcome. No bare except, and no swallowed failure that leaves the step unrecorded — an unrecorded step breaks the exactly-once invariant in the quiet direction."
test_spec:
  - name: test_ge119d1_one_outcome_recorded_per_attempted_step
    target_dir: unit_tests/setup/
    framework: unittest
    type: behavioral
    description: "Real set-up command run to completion: the report contains exactly one outcome per attempted protection step, established or not established."
  - name: test_ge119d1_not_established_step_names_the_specific_artifact
    target_dir: unit_tests/setup/
    framework: unittest
    type: behavioral
    description: "A run where a step genuinely cannot be established names the specific artifact by path rather than the activity."
  - name: test_ge119d1_summary_states_not_established_count
    target_dir: unit_tests/setup/
    framework: unittest
    type: behavioral
    description: "The closing summary states how many protection steps were not established."
  - name: test_ge119d1_run_with_unestablished_step_not_presented_as_complete
    target_dir: unit_tests/setup/
    framework: unittest
    type: behavioral
    description: "A run with a non-zero not-established count is not presented as a completed set-up."
  - name: test_ge119d1_each_step_recorded_exactly_once_on_the_skip_path
    target_dir: unit_tests/setup/
    framework: unittest
    type: behavioral
    description: "A run that takes the skip path for a step records that step exactly once — no duplicate from an unconditional record after the branch."
test_rationale: "The exactly-once clause is the one a source inspection cannot cover: the repo has already shipped a duplicate-record defect whose structural test matched only quoted-string call arguments and was blind to the template-literal call, so it stayed green on the buggy code. Cardinality per runtime path is only observable by running the real command down each path, including the skip path, and counting the entries in the report it actually produced."
