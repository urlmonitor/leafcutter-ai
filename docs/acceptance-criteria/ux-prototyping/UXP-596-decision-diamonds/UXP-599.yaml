id: UXP-599
components:
  - ux_prototyping
  - frontend_coding
readiness: reviewed
priority: medium
title: "A multi-branch fork chains into diamonds (diamond -> diamond -> happy path), not one N-way node"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: done
criteria: |
  Given a single step that has N conditional branches (N >= 2),
  When the graph for that flow is drawn,
  Then the fork is rendered as a chain of N diamonds (diamond -> diamond -> ... -> happy path),
  one diamond per branch, each diamond testing exactly one branch's condition,
  And the "else" edge of each diamond descends to the next diamond in the chain,
  And the final "else" edge continues to the happy-path next step,
  And the fork is NOT drawn as a single node with N outgoing edges.
