id: GE-125a-2
components:
  - security_scanner
  - commit_guardian
title: "The four locations the project chose still receive their reduced scrutiny, and still only for the opaque-token rule"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  FIXTURE ROOT USED BY EVERY SCENARIO BELOW. Each scenario builds a throwaway
  project root, written <root>, that is a directory of its own and contains no
  part of this repository. Every path in these scenarios is relative to <root>.
  No fixture may be written anywhere inside this repository's own working tree.
  That constraint bites hardest here, because these scenarios assert that a file
  IS exempt: a fixture placed under this repository's own tickets/,
  docs/retrospectives/, docs/acceptance-criteria/ or templates/skills/ would be
  exempt by way of this repository's list whatever the change under test did, so
  it would report success while measuring nothing. Every scenario is exercised
  the way a commit exercises the check — the files are staged in <root> and the
  credential check runs over that staged set — not by asking the location rule
  for a verdict on a path, and not by reading the check's own source.

  EVERY FIXTURE BELOW IS OF AN ADMITTED PROSE KIND — .md or .txt — AND THAT IS
  DELIBERATE. These scenarios assert that a file IS exempt, so each fixture must
  be one that stays exempt after the sibling L1s land as well as before. GE-125b
  narrows what counts as prose to those two kinds, following the product owner's
  decision of 2026-08-25 that the acceptance-criteria store shall be scanned. A
  .yaml or .py fixture here would freeze behaviour a sibling exists to change.

  Given <root> contains tickets/00_inbox/note.md, a written incident note holding
    one line with a thirty-two-character opaque token whose measured Shannon
    entropy is 5.17, above the 4.5 threshold, carrying no keyword the keyword
    rule recognises and no fixed prefix the prefix rules recognise,
  And no suppression entries are in force,
  When it is staged and the check runs over the staged set,
  Then the token is NOT reported for that file,
  And the run is not blocked on account of that token,
  Because tickets/ at the top of the project is one of the four locations this
    project chose, and this criterion changes where the entitlement reaches
    without changing who is entitled to it.

  Given <root> contains these three further written files, each holding the same
    token:
      docs/retrospectives/2026-08-19-retro.md
      docs/acceptance-criteria/guardrail-engine/PROJECT_CONTEXT.md
      templates/skills/example-skill/SKILL.md
  And no suppression entries are in force,
  When they are staged and the check runs over the staged set,
  Then the token is NOT reported for any of the three,
  Because all four chosen locations keep the entitlement, not just the first one,
    and a change that anchored one name and dropped the other three would satisfy
    the scenario above on its own. The acceptance-criteria fixture is a Markdown
    file rather than a store record, because the store's YAML is no longer an
    admitted kind — the LOCATION keeps its entitlement, and a prose file there is
    what demonstrates it.

  Given <root> contains all four chosen-location files above together with
    src/app.py and leafcutter-web/tickets/app.py, each holding the same token,
  And no suppression entries are in force,
  When all six are staged and the check runs over the staged set once,
  Then the token is reported for src/app.py and for leafcutter-web/tickets/app.py
    and is not reported for the four chosen-location files,
  Because the set of entitled locations must come out of this change with exactly
    the four members it went in with — none removed, and none gained by a folder
    below the top of the project reusing a chosen name.

  Given <root> contains tickets/00_inbox/incident.md, a written incident note
    holding four separate lines: the same opaque token, a private-key header
    line, a cloud-access-key-shaped value, and a quoted twelve-character value
    assigned to a field named password,
  And no suppression entries are in force,
  When it is staged and the check runs over the staged set,
  Then the opaque token is not reported,
  And the private-key line, the cloud-access-key value and the password value are
    all reported for that file,
  And the run's exit status reports findings present,
  Because reduced scrutiny at a chosen location has only ever meant the
    opaque-token rule and never the other rules, and a change to WHERE the
    entitlement reaches must leave WHAT it removes exactly as it was.
