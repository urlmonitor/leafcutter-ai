title: "How-to: what to do when the commit-time lint check refuses your commit or cannot run"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a contributor whose commit was refused by the commit-time lint check,
  When they follow the how-to guide produced for this feature,
  Then the guide shows how to read a refusal (file, line, rule), how to reproduce
    the same verdict by hand with the same scope and configuration CI uses, and
    how to fix it,
  And it explains why a file they only touched can be refused for a finding that
    predates their change (BP-1300e-1-ii),
  And it shows how to resolve each cannot-run refusal (linter not installed,
    will not start, configuration unreadable) from BP-1300e-1-iii,
  And it shows an adopter where the one lint-scope declaration lives, what the
    default is, and how to point their own CI at the same declaration,
  And it replaces, rather than sits beside, any existing instruction to run the
    lint command by hand before pushing as the only protection.
