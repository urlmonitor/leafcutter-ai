    relationship: implements
    status: exists
  - path: docs/architecture/components/decision-kernel.md
    relationship: describes
    status: exists
  - path: docs/how-to/run-the-decision-kernel.md
    relationship: context
    status: exists
origin_agent: business-analyst
created: 2026-10-02
amended_by:
