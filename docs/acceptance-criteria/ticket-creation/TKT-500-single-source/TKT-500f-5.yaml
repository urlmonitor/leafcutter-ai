test_spec:
  - name: test_non_phase_agent_is_not_named_as_the_ticket_phase_agent
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "An AC assigned an agent whose registry entry has is_ticket_phase false (e.g. workflow-architect) generates a ticket that does not name that agent as its phase agent."
  - name: test_template_editing_work_substitutes_llm_expert
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "When the work edits agent or skill templates, the substitute is llm-expert — the first branch of the substitution rule."
  - name: test_all_other_work_substitutes_python_coder
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "For all other work the substitute is python-coder — the second branch. Both branches need their own test or a constant-return implementation passes."
  - name: test_substitution_warning_names_substitute_and_original_agent
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "The recorded warning states a substitution was made AND names both the substitute and the AC's original assigned_agent. Assert all three facts separately — a bare 'substitution occurred' string satisfies none of the diagnostic purpose."
  - name: test_phase_agent_passes_through_unchanged_with_no_warning
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: "The second Given: an is_ticket_phase true agent (python-coder) is named unchanged and NO substitution warning is recorded. This is the control that stops the substitution firing on everything."
  - name: test_substitution_reads_is_ticket_phase_from_the_real_registry
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "The is_ticket_phase decision is taken from the actual config/agent_registry.json rather than a hard-coded agent-name list, so a newly registered phase agent inherits the behaviour automatically."
change_target: code
risk_surface: contract_boundary
