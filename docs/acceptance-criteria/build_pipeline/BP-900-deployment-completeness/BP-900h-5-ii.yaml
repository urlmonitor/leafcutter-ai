notes: |
  WHAT THIS AC ADDS THAT THE BRANCH DOES NOT ALREADY HAVE. BP-900g-8 already specifies the
  build-side answer to this defect — a derived, transitive intra-package import closure that
  fails the build, plus one cold-import check of one named script — and it named the very
  module still missing today. It is approved and work_status: todo. So KI-BP-006's build-side
  half is an unimplemented specification, and authoring a second build-side AC would add a
  duplicate rather than a defence. Do not.

  Two things the branch genuinely does not cover, and both are why the fifth occurrence
  looks different from the first four:

  FIRST, THE SET. BP-900h-5 is the only AC in the family that invokes anything in a consumer
  install, and it derives its set from the guardrail registry. The executable that broke on
  2026-08-25 is in no registry: adopters run it from the command line and other guardrails
  shell out to it. A registry-derived set cannot see it, and neither can a closure that was
  never built. The deployed tree itself is the only source of truth for what an adopter can
  run.

  SECOND, THE OBSERVABLE. BP-900h-4 asserts declaring files are PRESENT. The file in this
  instance is present — the validator is deployed today, which is the point on which the
  register is now stale. Presence and startability are different claims, and this branch has
  been burned by the distinction before: a file copied to a path nothing invoked, and an
  import that failed only on true first import. An AC written around "the file is missing"
  would read as satisfied while the adopter's command still produces a traceback.

  WHY THE INSTANCE IS NOT THE DELIVERABLE. Four modules were each added to the same
  hand-maintained deploy list after each shipped broken, and several entries in that list now
  carry a comment explaining why that particular module must not be forgotten. Those comments
  are the evidence: a list that needs a warning per entry is a trap with annotations. The
  sixth entry is already unwritten. The deliverable is a sweep the list cannot pass by being
  edited, which is what entry 4 of the test contract enforces and nothing else does.

  EXPECTED SIDE-EFFECT AT IMPLEMENTATION, FLAGGED NOT SOFTENED. Turning this on will surface
  every deployed executable that cannot currently start, not only the one in the register,
  and may turn the consumer-simulation job red on its first run. That is the intended effect.
  The set must be enumerated and each entry resolved or explicitly deferred with a date.
  Parking them behind a skip list would reintroduce, inside the very sweep built to remove
  it, the hand-maintained list that is the defect.
