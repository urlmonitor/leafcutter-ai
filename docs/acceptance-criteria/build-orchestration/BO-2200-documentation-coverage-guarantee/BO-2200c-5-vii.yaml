notes: |
  Authored by /quick-fix. Root cause: build-feature dispatches every phase as a flat depth-1 agent() call (agentType: phaseName). Sub-agents are hard-limited to depth 1, so a phase agent has no Agent tool. templates/agents/documentation-expert.md is an orchestrator whose rules are 'never write or edit a doc file yourself; all authoring is delegated to specialists' (lines ~198 and ~367). Inside the workflow it can neither delegate nor author, so it always returns blocker. The dispatch prompt gives it no leaf-mode instruction. Fix: when phaseName === 'documentation-expert', append a leaf-mode instruction to the dispatch prompt. It says this dispatch cannot spawn sub-agents, so for each required doc in the ticket's '## Agent Contracts → ### documentation-expert' block the agent must classify intent exactly as its template says, pick the specialist (how-to-author, reference-author, explanation-author, adr-author, architecture-diagram-author or architecture-author), read that specialist's agent template (.claude/agents/<specialist>.md in the worktree, falling back to templates/agents/<specialist>.md) and its canonical how-to, and author the doc itself following that specialist's rules. For this dispatch only, this explicitly overrides the 'never author yourself' rule. Never return status handoff to a specialist that is not a key of the ticket's agents map; author it instead. The test must run the workflow through the existing workflow engine harness (unit_tests/_workflow_engine_harness.py) and assert on the prompt actually sent to the documentation-expert dispatch, plus a negative control that other phases (e.g. pr-reviewer) do not receive the leaf-mode text. Not a grep of the source..

  Placement: BO-2200c ("The writer gets a precise brief") is at its child_limit_override of 6
  L2s, and this is a constraint on the writer side of BO-2200c-5 (the writer reads the Agent
  Contracts block as its brief) rather than a new behaviour, so it is a Roman-suffix L3.
  Related: BO-3100c-2 states the structural end-state (no entry point reaches a coordinating
  specialist at all); this AC is the interim leaf-mode remedy that lets the current flat
  dispatch produce docs. readiness is left at reviewed: approval is the user's sign-off.
