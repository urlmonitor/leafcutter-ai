test_spec:
  - name: TestReportEndToEnd::test_one_run_answers_both_health_and_speed
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "build_report run once against a real temporary git repository, then rendered to markdown, contains all four section headings (Tier 1 -- Trust, Tier 2 -- Autonomy, Tier 3 -- Velocity, Code volume by language) in one output, proving one command answers both the health and the speed reading."
  - name: TestReportEndToEnd::test_trust_tier_is_rendered_before_the_velocity_tier
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: integration
    angle: criterion
    description: "In the rendered markdown, Tier 1 -- Trust appears before Tier 3 -- Velocity, so a speed figure is never read before the trust figures that qualify it."
  - name: TestReportEndToEnd::test_the_closed_criterion_is_counted_in_the_period_it_closed
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: integration
    angle: criterion
    description: "A criterion closed inside the current reporting period is attributed to that period's ac_done and ac_reopened figures in the fully assembled report, not to an adjacent period."
  - name: TestReportEndToEnd::test_absent_telemetry_renders_a_named_reason_not_a_zero_rate
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: integration
    angle: failure
    description: "With no telemetry sink present, the rendered report states 'No lane data' rather than 'Completion rate: 0%', so an unwired emitter is never presented as a measured zero, end to end through the whole render."
test_rationale: |
  These four descriptors are this L1's own contract, not a restatement of any
  child's. Each child (INF-500e-1..5) proves one computation in isolation over
  literal or single-purpose fixture inputs; none of them runs build_report and
  _render_markdown together against a real temporary repository, and none of
  them asserts the cross-section reading order or the fully-assembled-report
  shape of the absent-telemetry guarantee. TestReportEndToEnd is therefore the
  only place the L1-level promise -- "one command, both readings, trust read
  first" -- is actually exercised as a whole. This record's done status is
  additionally supported by all five children being independently done with
  their own passing test contracts, per the composite/L1 pattern; covered_by
  reflects that relationship and is unchanged by this contract.
