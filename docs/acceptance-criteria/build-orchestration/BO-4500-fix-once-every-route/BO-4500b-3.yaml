notes: |
  PO CHALLENGE 2 (scope) -- RESOLVED HERE. This record delivers the COMMIT-ANSWER single source and
  the proof of its predicate ON ITS OWN: the decision is taken from a reply with no route and no
  engine (first scenario). Placing the block into fast-lane-ship, plan-feature, quick-fix,
  finalize-feature and the /commit route is the job of BO-4500a-5-i..iv and the /commit route's
  migration record; build-feature and build-ticket keep BO-3000a routing (BO-3800a-1) and do not
  take the block. Until the first route adopts it, COMMIT-ANSWER is declared awaiting adoption by
  those records (BO-4500b-1-ii).

  PO CHALLENGE 5 (framework neutrality) for the block: the DECISION is separated from the DISPATCH.
  The decision reads a reply and an attempt history and returns a decision; it names no engine call.
  A LangGraph node or an Agent SDK tool can take the same decision from the same reply.

  The (f) row follows the request as written: continue ONLY on committed, so nothing_to_commit is
  reported, not continued. Flagged to the user (question Q2): a re-run after a partly successful
  route can legitimately find nothing to commit, and some routes may expect to carry on.

  STANDING RULE (BO-4500) is the second scenario, as an explicit criterion per the L0's demand that
  it survive decomposition to L2/L3.
