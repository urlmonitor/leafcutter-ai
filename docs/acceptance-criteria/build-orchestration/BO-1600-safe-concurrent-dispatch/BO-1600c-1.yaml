assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The integrity probe must return a determinate corrupt/clean verdict for the shared worktree, detecting at minimum a zero-byte loose object, an object whose content hash does not match its name, and an unreadable index."
  - "On a corrupt verdict the drive must halt BEFORE any subsequent git write that would touch the damaged object store or index — the probe must run at a point where the next commit can still be prevented."
  - "PREVENTION/DETECTION ONLY per the BO-1600 goal and BO PROJECT_CONTEXT: the probe must NOT attempt to repair, gc, or rewrite the damaged store; its sole effect is to produce the verdict and trigger the halt."
  - "Must complete fast enough to run between ticket commits without materially slowing a clean drive (well under a few seconds for the working repository)."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3): wrap the git integrity subprocess in try/except with a specific exception type; treat an inconclusive/errored probe as corrupt (fail-safe), not clean, and log at WARNING or higher."
delivers_to:
  agent: python-coder
  contract: "A repository-integrity probe plus a halt signal that the drive orchestration consumes: the probe returns a determinate corrupt/clean verdict for the shared worktree, and a corrupt verdict aborts the drive. The verdict is the single load-bearing primitive consumed by the actionable-message behavior (BO-1600c-2) and the do-not-continue behavior (BO-1600c-3)."
