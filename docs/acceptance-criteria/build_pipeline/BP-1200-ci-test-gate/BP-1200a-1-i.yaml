notes: |
  Determinism is a real observed risk: earlier fresh-clone runs swung
  2 -> 11 -> 15 -> 17 failures because the missing-build-output state interacted
  with randomized test ordering. This edge case asserts stability once the
  prerequisite outputs/repointing (ADR-selected) are in place. Stays
  outcome-focused — it asserts the determinism OUTCOME.
  IT-PO note: re-routed to test-runner because the behavior is "run the prepared
  suite N times across seeds and compare pass sets", which is verification, not
  source authoring. ADR-016 direction now decided = Approach 1.
