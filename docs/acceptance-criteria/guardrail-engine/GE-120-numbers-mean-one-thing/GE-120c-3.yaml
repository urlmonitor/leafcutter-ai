notes: |
  Satisfies GE-120c's documentation_triggers: [how-to]. The L1 scopes it precisely: "the how-to
  covers what a person does when they hit a clash at a stage where nobody can be brought in for
  them."

  THE REFERENCE-REPAIR HALF IS THE PART THAT WILL BE UNDER-WRITTEN. Choosing a free number is
  easy and obvious; finding every citation of the vacated number is neither, and getting it
  wrong is what turns a renumbering into a set of broken links. GE-120e-1 has to do exactly this
  work for the live collision and is the natural source of the procedure — write the guide from
  what that repair actually required.

  The clause about dated historical records is drawn from an existing decision in this
  repository rather than invented: the decision-number auditor deliberately refuses to repoint
  citations in closed records, on the grounds that doing so would make the record claim
  something that did not happen.
