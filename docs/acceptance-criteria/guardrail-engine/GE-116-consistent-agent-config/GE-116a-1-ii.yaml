id: GE-116a-1-ii
components:
  - commit_guardian
title: "Multiple contradictory agent definitions in one commit all block it"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
assigned_agent: python-coder
estimated_complexity: S
criteria: |
  Given a single commit stages two or more agent definitions that each declare
    they must verify their changes while granting neither the ability to edit
    nor to create files,
  When the commit is attempted,
  Then the commit is blocked fail-closed,
  And a single offending definition is enough to block, so the commit does not
    partially succeed for the consistent definitions in the same commit.
depends_on:
  - GE-116a-1
