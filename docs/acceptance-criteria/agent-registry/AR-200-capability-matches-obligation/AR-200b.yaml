priority: high
roadmap_phase: phase_1
criteria: |
  When your instructions name the safe way to do something, the specialist can
  actually do it that way.

  A specialist's instructions sometimes name a specific tool as the way to carry
  out a mandatory step, because that tool is the safe one for that step. Every
  such instruction is matched by the specialist actually having that tool. The
  contradiction is caught when the specialist is defined, not discovered by the
  specialist mid-task.

  The benefit is that a named safe route is a real one. A specialist that cannot
  follow the safe instruction does not simply stop — it improvises with whatever
  it does have, and the riskier route it falls back to is the one your
  instructions were written to avoid.
