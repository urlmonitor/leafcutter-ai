criteria: |
  Given a store in which every conflicting pair known at the time the check was
    built has been reconciled, so none of them still disagrees,
    And a fault entry is then recorded, open, naming a requirement that reads
      finished, where neither the entry nor the requirement is named anywhere in the
      check itself,
  When the reconciliation runs,
  Then that new pairing is reported as a conflict.

  Given the same store,
  When the reconciliation runs,
  Then no pairing is reported merely because it appeared in an earlier run's output,
    And a pairing that no longer disagrees is not reported,
  So the output describes the store as it is now and not as it was.

  Given a fault entry and a requirement whose identifiers appear nowhere in the
    check, in any form,
  When they are made to disagree and the reconciliation runs,
  Then the conflict is reported,
  So the check is exercised on a pair it cannot have been written against.

  Given the check,
  When the number of conflicts it reports is compared against the number of
    disagreeing pairs present in the store,
  Then the two are equal,
  So the check is not reporting a sample, a fixed list, or the first few it finds.
