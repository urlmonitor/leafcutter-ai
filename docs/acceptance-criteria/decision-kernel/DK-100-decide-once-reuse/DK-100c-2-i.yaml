id: DK-100c-2-i
title: "The record builder refuses an approver who is not human, or a missing approval time"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: in_progress
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a completed decision whose approver is jev, or host, or whose approval has no approved_at,
  When the record builder is asked to build its record,
  Then no decision record is built,
  And the refusal states which condition failed: a non-human approver or a missing approval time,
  And, as the paired accepted inputs, a decision approved by human:user with approved_at set, and
    one approved by the bare actor human with approved_at set, are both built.
depends_on:
  - DK-100c-2
