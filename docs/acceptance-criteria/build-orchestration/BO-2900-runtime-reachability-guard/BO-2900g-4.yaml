notes: |
  GAP C of BO-2900g, second half, and the carrier of the HARD ORDERING
  CONSTRAINT the parent L1 requires to be encoded as a depends_on edge.

  THE ORDERING, EXPLICITLY. depends_on lists BO-2900g-3. The reconciliation of
  the two definitions is a prerequisite of this AC, and this AC is where any
  reader of a required-proof description is held to the single definition. A
  checker for these descriptions is advertised as shipped in the package
  boundary manifest while the file does not exist; building it first would
  freeze the unreconciled vocabulary into an enforcement point and turn the
  reconciliation from an edit into a breaking change. That is why the edge runs
  this way and must not be reversed.

  THE PRODUCED SHAPE IS THE DEFECT, NOT ONLY THE DEFINITIONS. The 2026-08-14
  investigation found the generator's emitted shape violating the ticket-side
  definition on 6+ counts. Reconciling the two definitions and leaving the
  producer alone therefore satisfies BO-2900g-3 and still leaves every real plan
  non-conforming. The third Then clause — the two routes read the same way — is
  the one that catches a reconciliation that quietly legalises whatever the
  criteria-derived route happens to emit while leaving authored plans behind.

  THE 'NOT YET RESOLVED' VALUE IS DELIBERATE, NOT A LOOPHOLE. For the ~80% of
  work that brings no plan of its own, nothing upstream knows the way in, and a
  definition that forbids saying so forces either a fabricated way in or a plan
  that cannot be produced. Saying it out loud is what BP-1100g-2 then hands to
  the doer to resolve, with a recorded answer.

  BOUNDARY. Conformance of a DESCRIPTION to a vocabulary. No gate, no block, no
  done-state consequence, and no statement about whether any proof was achieved.

  DELIBERATELY NOT AN AC HERE (carried from the parent L1): the package boundary
  manifest advertising a portable check whose file does not exist. Route it as a
  one-line remediation plus, if needed, an L2 widening under BP-900e. It is not
  L0/L1 work and it is not this tree's.

  IT-PO ENRICHMENT NOTE (2026-08-17). The ordering constraint is now carried in
  three places that all have to be edited to break it: the depends_on edge, a
  constraint inside it_requirements, and the expects_from contract on
  BO-2900g-3. it_requirements uses the package-surface OBJECT form mandated by
  the schema's root if/then.
