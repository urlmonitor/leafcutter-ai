criteria: |
  Given a thinned ticket whose body contains no embedded spec but whose source_ac
    resolves to an AC present in the store,
  When a phase agent or gate resolves the ticket's spec,
  Then the resolved spec is read from the store AC (its criteria and contract),
  And the resolved content equals the store AC's content in the fields the agent or
    gate consumes.
