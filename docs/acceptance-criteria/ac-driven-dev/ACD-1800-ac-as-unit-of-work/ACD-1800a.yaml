notes: |
  CONCEPT A (part 1). The AC becomes a self-contained mini-ticket that enumerates
  its own deliverables. Complements ACD-1600a (ticket references the AC, no copy)
  and ACD-1600b (agents read the spec from the store): here the AC additionally
  carries the deliverable checklist that work is derived from. Does not duplicate
  ACD-1600c (buildable = concrete files + a test contract), which gates completeness
  of the SPEC; this L1 is about the AC declaring the full set of DELIVERABLES.
