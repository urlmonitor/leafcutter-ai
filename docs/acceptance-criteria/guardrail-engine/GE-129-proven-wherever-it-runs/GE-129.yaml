  ==========================================================================
  WHAT WAS DELIBERATELY NOT TOUCHED
  ==========================================================================
  No existing record was modified to author this tree. GE-120f and its five L2s are
  untouched, ADR-045 is untouched, and no known-issues register was edited (the
  check-doc-length gate refuses every register since 2026-09-14; they are cited in
  doc_links instead). Nothing existing becomes false as a result: ADR-045's unresolved
  boundary says the ADR does not close the gap, which remains true — this tree specifies
  it. A back-link from GE-120f, and an ADR-045 amendment naming this tree, are both
  available and are the user's call, not taken unasked on approved records.

  Authored at the PO stage. L0 and L1 only. No L2, no L3, no test_spec, no
  it_requirements, no assigned_agent, no estimated_complexity and no
  declares_side_effect, by design.
