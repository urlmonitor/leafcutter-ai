id: TQ-500g-1-ix
components:
  - testing_quality
  - build_orchestration
title: "The preparer's reply becomes the alterations manifest only through a writer that applies each replacement where it matches exactly once, computes every diff itself, and records every owed name once"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the guarding test entries of requirement TQ-9101 owe nine named
    wrong versions, plus "revert the fix", and the code as written in
    refresh_config.py contains "if refresh_due and retry_due" once and
    "retry_due" three times,
    and the owed list for TQ-9101 (the second scenario below) puts
    refresh_config.py in scope for every owed name, and settings.py, an
    ordinary source file of the repository, in scope for "retry on a
    timeout" only,
    and the preparer, which changes no file itself, replies for each name
    with exact-match replacements (per file: old text, new text) or with
    "could not be prepared" and a one-line reason —
      R1 "drop the retry_due condition": in refresh_config.py, replace
         "if refresh_due and retry_due" with "if refresh_due"; the reply also
         carries a diff of its own and says that
         test_refresh_gate_requires_retry would catch it,
      R2 "ignore retry_due": in refresh_config.py, replace "retry_due" with
         "True",
      R3 "retry only once": in refresh_config.py, replace "max_retries = 3"
         with "max_retries = 1", text the file does not contain,
      R4 "skip the refresh when the cache is warm": one replacement in
         refresh_config.py whose old text occurs once, and one in
         tests/test_refresh_config.py,
      R5 "refresh on every call": a replacement in
         ../shared/refresh_config.py, outside the repository,
      R6 "refresh without a due check": a replacement in
         .git/hooks/pre-commit, inside the repository's version-control
         folder,
      R7 "retry on a timeout": could not be prepared, with the reason
         "refresh_config.py has no timeout handling",
      R8 "refresh twice": no answer at all,
      R9 "refresh from the settings file": one replacement in
         refresh_config.py whose old text occurs once, and one in
         settings.py, which the list puts in scope for another name but not
         for this one,
    and the reply also answers "revert the fix", and "invert refresh_due", a
    name the work did not owe,
  When the reply is turned into the alterations manifest for the runs,
  Then R1 is recorded as prepared under "drop the retry_due condition", with
      one altered copy of refresh_config.py that is byte-for-byte the code as
      written except that "if refresh_due and retry_due" reads
      "if refresh_due",
    And the diff shown next to R1's name is computed by comparing the code as
      written with that altered copy; the diff the reply carries is not used,
    And R2 and R3 are each recorded as "could not be prepared", with a reason
      naming refresh_config.py and saying the old text was found 3 times (R2)
      or was not found (R3); no replacement is guessed and no altered copy is
      made for either,
    And R4, R5 and R6 are each refused: recorded as "could not be prepared"
      with a reason naming the refused path and saying that it is a test
      file, outside the repository, or inside the version-control folder,
      and no altered copy is made for any of them, not even of
      refresh_config.py for R4, whose old text there occurs once,
    And R9 is refused the same way: recorded as "could not be prepared" with
      a reason naming settings.py and saying that it was not in scope for
      "refresh from the settings file", and no altered copy is made for that
      name at all, not even of refresh_config.py, whose old text there
      occurs once; a file is in scope for a name only when the owed list
      puts it in scope for that name, and being an ordinary source file
      inside the repository, or being in scope for another name, does not
      make it so,
    And R7 is recorded as "could not be prepared" with the reason
      "refresh_config.py has no timeout handling", word for word,
    And R8 is recorded as "could not be prepared: no alteration returned",
    And each of the nine owed names appears in the manifest exactly once,
      spelled exactly as the test entries spell it, and the manifest holds no
      entry for "revert the fix" or "the fix undone", and none for
      "invert refresh_due",
    And no entry says which test would catch a wrong version: the reply's
      claim about test_refresh_gate_requires_retry appears nowhere in the
      manifest,
    And every name recorded as "could not be prepared" leaves the work
      unfinished when the runs read the manifest; no owed name is dropped
      without a word,
    And afterwards no file in the working tree has been changed, added or
      removed; the altered copy and the alterations manifest are written
      only to the work's own folder outside the working tree,
    And when the reply instead cannot be read at all (it is empty, or it is
      cut off part-way), the step stops with an error saying that the
      preparer's reply could not be read, no manifest is written, and no
      manifest left by an earlier preparation of the same work remains to be
      read in its place, so the work never looks as if it owed no wrong
      version.

  Given the same test entries guarding TQ-9101, which owe the nine named
    wrong versions above plus "revert the fix" and "the fix undone", and put
    refresh_config.py and the test file tests/test_refresh_config.py in
    scope for every name, and settings.py also for "retry on a timeout",
    and the test entries guarding requirement TQ-9102, which declare no
    wrong version at all,
  When the writer is asked to list what is owed for TQ-9101 and TQ-9102,
  Then each of the nine owed names of TQ-9101 appears in the list exactly
      once, spelled exactly as the test entries spell it: "retry on a
      timeout" with refresh_config.py and settings.py as its in-scope files,
      and each of the other eight with refresh_config.py as its only
      in-scope file,
    And neither "revert the fix" nor "the fix undone" is listed,
    And tests/test_refresh_config.py is listed as in scope for no name,
      although the test entries put it in scope; no test's own file is ever
      listed as in scope,
    And nothing is listed for TQ-9102: no name and no file, and that is not
      an error,
    And the names listed are exactly the names the writer then records in
      the manifest for the same requirement ids and the names the runner
      holds the tests to, because all three read the test entries the same
      way; the list, the writer and the runner never disagree about what is
      owed,
    And the route sends this list to the preparer unchanged, as the names
      to prepare and, for each, the files it may alter,
    And listing changes no file in the working tree.
declares_side_effect: true
depends_on:
  - TQ-500g-1
  - TQ-500g-1-i
