notes: |
  THIS IS THE RECORD THE USER ASKED FOR, IN THEIR OWN WORDS: "the agent that adds the new
  lines should not be the one that refactors. it should be a specific agent we already
  have. That way the move to new file will not take place at all as the refactor agent
  knows how to properly refactor."

  WHAT IS PROVABLE AND WHAT IS NOT — READ BEFORE WRITING A SINGLE CLAUSE BENEATH THIS.
  Separation of duties CANNOT be checked from the delivered result. One change, one
  identity; nothing in it distinguishes a hundred lines removed by the author from a
  hundred removed by a specialist. No criterion beneath this record may assert that the
  restructuring WAS performed by the specialist, because nothing can observe that.

  WHAT IS CHECKABLE IS THE SEQUENCE: on the refusal path, the specialist is actually asked,
  before delivery is retried. That is a reachability-shaped claim about the run and it is
  provable by observing the ask happen in a real run. It is also the only claim that cannot
  be satisfied by a system that does nothing — which is exactly why it is the claim this
  record makes. Anything stronger would be false on its face and anything weaker would be
  discharged by a prompt that says "please use the specialist".

  THE ANTI-SHUFFLING PROTECTION HAS NO MECHANICAL BACKSTOP AND THIS RECORD IS IT. Moving
  NEW work out of an oversized file into a home of its own is desired; moving EXISTING
  content out to make a number fall is the failure; a change shows both identically. The
  protection rests on the specialist's judgement. That is a matter of who is asked, not of
  what a check can detect, and the criteria above are worded to claim nothing more.

  BOUNDARY WITH INF-800, DELIBERATE. INF-800 owns performing a restructure safely once one
  is decided on. This record owns who is asked to do it. Neither closes the other.
