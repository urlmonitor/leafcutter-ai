notes: |
  This is the L1 that stops the defect propagating. Reporting a denominator at
  the source (ACS-1100a) achieves nothing if the next tool in the chain drops it
  and prints "all clear"; the store's own verifiers would go on confirming a
  number nobody computed. Coverage must travel WITH the result through every
  hop, and a verifier's own verdict is capped by the weakest coverage figure it
  consumed.

  Consider this the coverage analogue of the phantom-done family (BO-2500,
  BP-1100): a green verdict over a partial scan is a phantom all-clear. Cite the
  parallel; do not fold this into those trees — they govern proof that WORK is
  done, this governs proof that a QUERY was complete.

