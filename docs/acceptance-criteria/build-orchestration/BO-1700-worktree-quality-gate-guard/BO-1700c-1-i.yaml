created_by: "docs/acceptance-criteria/build-orchestration/BO-1700-worktree-quality-gate-guard/BO-1700c.yaml"
criteria: |
  Given the filesystem rejects symlink creation (for example an NTFS/WSL2 mount),
  When the self-healing hook re-materializes the config,
  Then it falls back to copying the config file into the worktree,
  And after the copy the worktree's `.pre-commit-config.yaml` resolves and a
    subsequent probe run returns a passing verdict.
depends_on: [BO-1700c-1]
