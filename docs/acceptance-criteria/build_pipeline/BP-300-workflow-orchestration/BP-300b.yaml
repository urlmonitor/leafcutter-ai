title: "The build planner uses current sign-off state, not stale frontmatter"
component: build-pipeline
level: L1
status: active
work_status: todo
criteria: |
  Workflows never re-run phases that are already signed off, and never skip phases still needed.

  When build-ticket.js plans which agents to dispatch, it reads both the
  YAML frontmatter agents map and the Sign-offs checklist in the ticket
  body. When the two diverge (a crash left them inconsistent), the planner
  treats the Sign-offs section as authoritative, logs the discrepancy as a
  drift warning, and produces an ordered_phases array that reflects actual
  current state. The result: no wasted re-runs of completed work, and no
  skipped phases that still need attention.
