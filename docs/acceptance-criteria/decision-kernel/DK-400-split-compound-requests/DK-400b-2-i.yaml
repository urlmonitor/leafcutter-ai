  contract: "The quote check that sets proposals aside, applied here to the mid-run subject."
it_requirements:
  - The quote check compares against the split's own subject_text (the work item's question) and nothing else; it
    never falls back to the root goal, the task's original goal or any parent's text.
  - 'The set-aside reason is template text by subject kind: ''quote not found in the goal'', ''quote not found in
    the request'' (research request) or ''quote not found in the question'' (decision question).'
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_mid_run_quote_of_root_goal_is_set_aside
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: With the split-bounds work item as subject, p3 quoting words found only in the root goal is set
      aside with the question reason while p1 and p2 are kept.
test_rationale: The trap is which text the check reads, so the test runs a mid-run split whose root goal contains
  the quote.
