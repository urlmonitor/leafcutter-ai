title: "A whitespace-only or empty instruction string is treated as no instruction"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
criteria: |
  Given a workflow step dispatches an automated helper to produce a durable change,
  And the dispatch request's first argument is a string that is empty or contains only
    whitespace characters,
  When the pre-implementation dispatch review examines the step,
  Then the step is flagged as carrying no actionable instruction, the same outcome as a
    bare data payload,
  And a first argument that is a non-empty, non-whitespace instruction string is not
    flagged on this ground.
