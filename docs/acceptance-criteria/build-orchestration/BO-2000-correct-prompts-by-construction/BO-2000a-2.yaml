criteria: |
  Given a phase agent completing its work on a ticket and following the sign-off block,
  When it records its sign-off,
  Then the frontmatter status, the Sign-offs checklist entry, and the appended
    sign-off comment are all updated together in one edit batch,
  And the ticket is never left in a state where one of the three is updated while
    another still shows the pre-sign-off value.
