origin_agent: business-analyst
created: '2026-10-01'
amended_by:
  - "2026-10-09: business-analyst amendment, not a rewrite. This AC enumerates the
    synchronization job's obligations and omitted reclamation entirely, and its
    documentation clause named rollback but not cleanup. Once KM-400f-2 requires
    publication to reclaim superseded generations, an unamended KM-400e-5 would make
    the store self-contradictory — the job AC would specify a publication that keeps
    everything while the publication AC requires it to reclaim. Three clauses were
    appended and nothing existing was altered: reclamation within the same successful
    publication (subject to KM-400b-3 pinning), reporting of the reclaimed and
    retained counts, and no substitution for an unset required backend setting. The
    documentation clause gained reclamation alongside rollback. work_status moved from
    done to in_progress: the appended obligations are not implemented, and the
    existing coverage does not reach them. Note for whoever implements this: the
    existing workflow coverage string-parses the job definition rather than executing
    it, which is the shape this repository's conventions forbid for a workflow AC and
    is why a wrong configuration default survived 60 consecutive failures; the
    appended clauses must be covered by tests that run the job."
superseded_by: null
