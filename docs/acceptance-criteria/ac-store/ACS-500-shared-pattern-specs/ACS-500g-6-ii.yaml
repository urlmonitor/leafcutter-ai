test_spec:
  - name: test_prompt_sent_to_agent_excludes_the_recorded_answers
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Assemble the round prompt for a seeded-gap eval row through the real prompt-assembly path with a stubbed backend; assert the string sent contains the row's input material and contains none of the expected-items content."
  - name: test_prompt_sent_to_agent_excludes_the_seeded_count
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Assert the assembled prompt contains no statement of how many items were seeded, in any field the agent can read."
  - name: test_round_with_leaked_answer_key_is_invalid_not_pass
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Score a round whose material contained the recorded answers and whose agent reported all of them; assert the round status is 'invalid' rather than 'pass'."
  - name: test_overall_verdict_cannot_be_pass_while_any_round_is_invalid
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Compute the overall verdict for rounds [pass, pass, invalid]; assert it is not 'pass' — exercises the verdict computation, not the prose."
  - name: test_invalid_round_result_is_retained_after_rerun
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Re-run a round after cleaning its material and assert the earlier invalid result file still exists alongside the new one (append-only history)."
