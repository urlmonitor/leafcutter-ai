it_requirements:
  - "WRITTEN AGAINST THE SHIPPED INTERFACE, NOT A PLANNED ONE. Every command, flag and report field the guide names must be copied from the tool as it exists when the guide is written. A guide describing a planned interface becomes a second source of truth for that interface and will be believed over the code."
  - "THE GUIDE POINTS AT THE REFUSAL; IT DOES NOT RESTATE IT. The authoritative home for 'restoring a coverage entry never promotes finished state' is the reference section ACS-1300c-4 delivers in `docs/reference/ac-schema.md`. This guide states the fact and links there. Three copies of a standing rule drift, and the copy a reader happens to find is the one that governs."
  - "THE ABSTENTION SECTION MUST BE ACTIONABLE, NOT DESCRIPTIVE. It must say what the reader is expected to DO about each abstention class the tool can emit, enumerated from the tool's real output rather than from this AC. An abstention a reader cannot act on degrades to noise, and a report nobody reads is the mechanism by which the enumeration in ACS-1300b dies."
  - "THE DELIVERABLE IS THE DOCUMENT AND NOTHING ELSE. No behavioural AC in this tree may be closed by pointing at this guide. A guide describing a preview that does not exist reads exactly like a guide describing one that does."
