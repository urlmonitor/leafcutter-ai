id: TQ-400f
components:
  - testing_quality
  - ac_store
title: "A finished parent answers for its children — it cannot keep a done badge while work beneath it is unfinished"
component: testing-quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Done at the top means done underneath.

  A parent item is a summary of the work below it, and today that summary can be
  wrong in both directions without anyone noticing. It can read finished while
  work beneath it is not, and it can read unfinished long after everything
  beneath it is complete. Either way the plan you read from is wrong, and in the
  first direction it overstates what you have.

  After this, a parent whose children are not all finished cannot keep a finished
  badge: it is knocked back, and the record names the unfinished children that
  caused it. A parent whose children are all finished is reported as ready to
  close and is never closed automatically — awarding the badge stays a judgement
  someone makes about the parent's own behaviour, not an arithmetic result.
