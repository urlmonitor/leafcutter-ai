criteria: |
  Turned away is not lost — the change waits, then goes through on its own.

  When a standard refuses the work, the change is kept exactly as it was left
  while the file is put right, and it is delivered afterwards without anyone
  having to start again, re-do the work by hand, or push it past the standard.
