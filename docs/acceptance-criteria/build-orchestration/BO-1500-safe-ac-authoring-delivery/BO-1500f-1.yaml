notes: |
  Regression origin: the setup step was dispatched to a status-reporting agent that
  refused it as out of scope. The refusal was not an execution failure, so the run
  continued with no workspace. Adjacent-but-distinct: BO-1900c covers charter-vs-task
  matching for TICKET dispatch; this AC covers a workflow-internal step dispatch and
  must not be folded into that tree.

  Re-homed 2026-08-14 from BO-1500a-4 to BO-1500f-1 by the Pattern C intermediate split
  of BO-1500a. Criteria text is unchanged. BO-1500a-5 and BO-1500a-8 remain under
  BO-1500a and now depend on this AC across the f/a boundary.

  REOPENED 2026-08-25 (was work_status: done). MECHANISM SUPERSEDED 2026-09-07 by ACD-2100b-5 --
  read the 2026-09-14 block below BEFORE acting on anything in the next four paragraphs. The
  file-and-line citations in them (plan-feature.js:1747-1773, the dispatched registry read, the
  label_responses stub at test_bo_1500f_1.py:176-196) describe code that no longer exists. The
  CAUSE they record is real history and the reason this record was reopened; the REMEDY they
  imply is not. Filed as KI-ACD-009 and KI-ACD-019. The
  criterion requires that the workflow "dispatches it to an agent whose registered charter
  permits running repository and shell commands". Given worktree-agent, which
  config/agent_registry.json:1364-1368 gives "permits_shell": true, it does not dispatch at
  all -- it halts first and blames the charter.

  templates/workflows-js/plan-feature.js:1747-1773 reads the registry by dispatching an agent
  to `cat {{config.output_root}}/config/agent_registry.json`. config/skills_config.default.json
  sets output_root to ".leafcutter", and that path is resolved relative to the session cwd, so
  inside a worktree it does not exist. The result is collapsed at :1770 into permitsShell =
  false and the run returns status: "error" naming an agent "whose registered charter does not
  permit" shell -- a claim about the charter derived from a failed file read. A read failure, a
  parse failure and an API error are indistinguishable from a genuine denial.

  Why the test missed it: unit_tests/workflows/test_bo_1500f_1.py:176-196 stubs the registry
  read via label_responses, supplying the real registry JSON for free. The one operation that
  fails in production -- resolving and reading that path -- is the one the harness never
  performs. The AC's own test_rationale claims every test observes a real dispatch under the
  harness; that is true of the setup dispatch and false of the registry read the verdict
  depends on.

  This sits downstream of BO-1500e-2 (work_status: in_progress), whose it_requirements already
  name the fix for the shared cause: resolve the repo root from the git toplevel of the
  invocation cwd. KI-ACD-004 is the same bug reaching a different file. Fixing e-2 properly
  should close this; verify rather than assume, and replace the stub with a test that lets the
  real path resolution run.

  2026-09-14 (it-po): SURFACE AMENDMENT -- THE CRITERIA WERE NEVER THE PROBLEM. Confirmed by
  direct inspection before writing this: the string "resolve-workspace-setup-permission" appears
  ZERO times in this file and never has (git log -S on this path returns nothing). The criteria
  contain no dispatch label, no agent() call and no path; the third Then clause says "the run
  stops", not "the workflow stops", so it is deliberately agnostic about which layer halts and
  survived ACD-2100b-5 unchanged. What was stale was this record's TECHNICAL SURFACE, and only
  that has been amended.

  WHERE THE BEHAVIOUR LIVES NOW, verified live on 2026-09-14:
    - scripts/worktree/check_workspace_setup_permission.py resolves the charter locally.
      _resolve_agent_outcome() returns "granted" when the entry's permits_shell is True and
      "permission_denied" when it is not (line 301), "agent_not_found" when the id is absent from
      a real agents list (line 300), "no_entries_collection" when agents is not a list;
      _load_registry() contributes "read_failure" and "parse_failure". Six distinct outcomes, no
      dispatch, no network.
    - templates/workflows-js/plan-feature.js consumes the verdict at args.workspace_setup_permission
      (line 2374), fails closed on an absent or non-object verdict (2385-2396) with a report that
      names the MISSING PRE-FLIGHT rather than asserting a permission cause, renders one distinct
      message per outcome (2398-2463) -- the permission_denied branch naming step='worktree-setup',
      the agent id, and the permits_shell field to change -- and only then issues the single
      worktree-setup dispatch to workspaceSetupAgentId (2496-2501).
    - unit_tests/_workflow_engine_harness.py already supports this: _default_args_for_script()
      supplies a registry-backed permitted default by really running the pre-flight against the
      real config/agent_registry.json, and run_workflow_under_e2(args=...) lets a test override it
      to exercise a denial. Its module docstring names THIS record at the "ACD-2100b-5" note.

  A PARTIAL DISAGREEMENT WITH THE BRIEF, stated so it is not lost: plan-feature.js is not wholly
  off this record's surface. Two of the three Then clauses -- the positive dispatch obligation and
  the halt that names step and agent -- are still realised there, and it is the LOAD-BEARING
  enforcement point: a verdict the workflow declines to act on is inert. What genuinely died is
  the in-workflow registry RESOLUTION, which is what the old reference_file_path and the old
  config_schema_fragment.workspace_setup_dispatch described. reference_file_path now names the
  pre-flight script (the surface the stale field pointed away from) and n_location_rule names
  plan-feature.js as the second, load-bearing location, so neither surface can be edited alone.

  WHAT IS ACTUALLY LEFT TO DO. The production mechanism appears to satisfy all three Then clauses
  already; the remaining work is most likely test-side. The two covering files assert the retired
  dispatch label (4 occurrences in test_bo_1500f_1.py, 5 in test_bo_1500f_1_real_registry_read.py)
  and are 5 real red tests on PR #652. Re-point them at the mechanism described above per
  test_spec. Do NOT flip work_status until they are green -- and do not assume green means the
  criterion holds: re-read the three Then clauses against the run, since a test set can be rewritten
  to pass against the new surface while quietly dropping the negative assertion that no authoring
  agent was dispatched.

  ONE ORPHAN, DELIBERATELY LEFT ALONE. templates/workflows-js/plan-feature.js:1929 still defines
  classifyWorkspaceSetupPermission(), carrying { stage: "resolve-workspace-setup-permission",
  agent: "status-checker" }. Exactly one occurrence repository-wide -- the definition. No call
  site, no test reference. ACD-2100b-5's own comment at plan-feature.js:2171-2179 claims it removed
  the four now-dead interpretation helpers; this fifth one survived that sweep. It is NOT in this
  record's scope: this record is about which agent the setup step is dispatched to, and a function
  nothing calls dispatches nothing, so removing it changes no behaviour this criterion can observe
  -- and ACD-2100b-5's own it_requirements already say the absence of a helper from the file is not
  what satisfies that record either. It does deserve its own record, on two grounds: it is dead
  code carrying the one string in this whole area that still reads as a live dispatch label, and it
  is precisely the string that caused a reader to misdiagnose this AC on 2026-09-14. A one-line
  removal AC under ACD-2100b (change_target: pipeline, risk_surface: internal) would close it.
