notes: |
  DETECTION ONLY. This AC produces the finding set; ACS-1300a-2 is the only place a
  file is written. Splitting them this way is what makes the preview run in
  ACS-1300a-2 a real preview rather than a flag on a write path.

  THE FOUR-RECORD FIXTURE IS THE POINT. Three of the four records are there to stop
  the criterion being satisfied by a run that reports only what it found: the
  already-correct record must be visibly examined, and the untagged record must be
  visibly examined, or "untouched" and "never looked at" collapse into the same
  observation. That collapse is the defect one level down and it is what the ACS-1300
  L0 notes mean by abstention over silence.

  ANTI-DUPLICATION, MEASURED 2026-09-01 ON THIS BRANCH — the two candidates the L0
  named were read, and neither performs this join:
    - scripts/ac_store/ac_coverage_resolver.py resolves a TICKET's ac_traceability
      block to the records it names and checks three fields are non-empty. It is the
      ticket-to-record direction and never reads the test tree.
    - scripts/ac_store/cross_reference_audit.py matches record criteria text against
      done-ticket text by difflib similarity and keyword overlap. Its enumeration
      helpers (_detect_worktree_root, _load_ac_yamls, _write_report) are reusable; its
      matching layer is not this join, and its apply layer is disqualified outright —
      see ACS-1300c-1-i.
  The join itself already exists, in done_proof. Compose it; do not rewrite it.

  NO COUNT IN THE CRITERIA, DELIBERATELY. Figures live in the L0 notes with their method
  and denominator. A criterion pinned to a number is falsified by the next commit that
  changes the number — and this tree's own evidence section proved the point on
  2026-09-01, when its "12 of 20" turned out to carry a denominator quoted from a cited
  sweep and never re-measured. The repository also carries a hand-typed "244 of 607"
  rotting in the artifact map as the older worked example.

  THE FIELD HAS THREE DIALECTS AND ONE MALFORMED CASE — measured 2026-09-01, and this is
  a live trap for the parser this AC specifies, not a hypothetical. The coverage field
  holds child record ids (3,586 entries), `path::Class::test` (162) and bare file paths
  (365). GE-107 writes `path.py:Class::test` with a SINGLE colon. A parser that splits on
  `::` misreads that entry as four dead links and reports GE-107 as inverse rot — four
  false findings, and one destructive removal each if the write step trusts them. The
  fifth-record clause exists to make that misparse fail here, at detection, before
  ACS-1300a-2-i's removal rule can act on it.

  PHANTOM TAGS ARE A FOURTH DIRECTION, MEASURED AND DELIBERATELY NOT OWNED HERE. Of 937
  distinct tag ids in the test tree, 850 resolve to a record — roughly 87 name a record
  that does not exist. done_proof already computes exactly this set as its dangling_tags
  output, so no new traversal is needed to surface it. ACS-1300c-3 currently reports
  these as abstentions. Whether they deserve their own repair direction is an OPEN
  question the L0 records as undecided; do not resolve it by quietly widening this AC.

  WHAT THIS AC'S FINDINGS DO NOT MEAN. A missing link is a traceability defect, not a
  blocked piece of work: restoring it does not change any record's mark-done eligibility,
  because verify_done_eligible reads the direct tag first and only consults the coverage
  list on the composite path. The report must not be worded to suggest otherwise. See the
  L0's framing section and ACS-1300c-1's eligibility clauses.
