assigned_agent: python-coder
estimated_complexity: S
delivers_to:
  - agent: llm-expert
    ac_id: INF-1100d-3
    contract: "A shipped resolver function, in the same module as INF-1100d-3-i's checker, that returns the configured test-database address or raises an error naming testing_context.db_connection_test when it is unset, empty or whitespace-only. The test writer's DB test pattern calls it in setUp."
expects_from:
  ac_id: INF-1100d-3-i
  contract: "The shipped checker module and its resolution semantics (unset, empty and whitespace-only all count as not configured)."
it_requirements:
  - The resolver lives in the SAME shipped module as INF-1100d-3-i's checker, and the checker
    calls it. There is exactly one piece of code that reads testing_context.db_connection_test,
    and unset, empty and whitespace-only all mean 'not configured' in both uses.
  - 'Resolution semantics match config_loader: package defaults merged under the project''s
    own settings, read at test run time and never compiled into templates.'
  - Unconfigured raises an exception, never a skip marker and never a silent return. The exception
    message names testing_context.db_connection_test as not configured, contains no address,
    and is raised before any database driver is imported or any connection is attempted.
  - 'When configured, it returns the value exactly as the project set it: no trimming of internal
    content, no normalisation, no credential rewriting.'
  - Importable from a test in an adopter project via the deployed install layout, so the DB
    test pattern works without the leafcutter source tree. Place the module under a scripts/
    subtree build.py already deploys whole, and name the import path the pattern uses.
  - No shipped default address and no stale-default detection (user decisions Q3/NQ1).
  - Tests must not spawn build.py (CLAUDE.md). Run the pattern-shaped test in a temp project
    whose settings file is on disk.
test_spec:
  - name: test_db_pattern_test_errors_naming_setting_when_unset_or_blank
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: a DB test written in the shipped Step 2b pattern shape, run by pytest as
      a subprocess in a temp project that calls the resolver from setUp
    description: 'P1 (unset) and P2 (''   ''): the pattern-shaped test ends as an ERROR (not
      PASSED, not SKIPPED), the message names testing_context.db_connection_test as not configured,
      and a connect spy records zero connection attempts (must_block).'
  - name: test_resolver_returns_project_address_verbatim
    target_dir: unit_tests/portability/
    framework: pytest
    type: unit
    angle: criterion
    description: 'P3: the resolver returns exactly postgresql://app:app@db.internal:5432/app_test
      (the control against a resolver that always raises).'
  - name: test_checker_and_db_pattern_share_one_resolver
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: seam
    description: For P1, P2 and P3, the INF-1100d-3-i checker's verdict and the resolver's outcome
      agree, and substituting a stub resolver in the shared module changes both, so the checker
      has no second reader.
test_rationale: The behaviour is what a real pattern-shaped test does when pytest runs it,
  so the floor test runs one in a subprocess and reads its outcome. A skip would be misread
  as 'not applicable', so the outcome itself is asserted. The seam test proves the 'one reader'
  clause by behaviour rather than by inspecting imports.
