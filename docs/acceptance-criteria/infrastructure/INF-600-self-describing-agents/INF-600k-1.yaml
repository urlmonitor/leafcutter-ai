assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Behavior is ALREADY SHIPPED in scripts/registry_validator.py via the _EXTERNAL_CALLERS set; this AC formalizes and regression-protects it. Implementation work is documentation/test coverage that locks the existing behavior, not a new feature build — do not reimplement what exists."
  - "A spawned_by entry that is not a known agent must be checked against the recognized-external-caller set (workflow *.js filenames and the literal external triggers) BEFORE being treated as an unknown agent; a recognized external caller must not raise an 'unknown agent' error and must not fail the build."
  - "Must preserve the INF-600g registry-validation strength for genuine unknown agents (the relaxation is exercised here; the negative guarantee is pinned by INF-600k-3) — do not broaden _EXTERNAL_CALLERS into a blanket accept."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
delivers_to:
  agent: python-coder
  contract: "The registry validator's spawned_by-entry classification: an entry that is not a known agent is checked against the recognized-external-caller set (workflow filenames and the literal external triggers) before being treated as an unknown agent. This classification is the single load-bearing primitive consumed by the user-caller behavior (INF-600k-2) and the genuine-unknown-rejection behavior (INF-600k-3)."
