title: "A Node workflow body assigned to python-coder passes; a SQL file assigned to python-coder does not"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given record W is assigned to python-coder and declares templates/workflows-js/plan-feature.js,
    and record Y is assigned to python-coder and declares queries/report.sql,
  When the requirement rule check runs,
  Then W produces no finding,
  And Y produces one finding naming queries/report.sql, the resolved specialist sql-coder
    and python-coder,
  And when the map's entry for workflow bodies is changed to another specialist, W's verdict
    changes on the next run with no other edit.
depends_on:
  - ACD-2500a-3
doc_links:
  - path: docs/acceptance-criteria/ac-driven-dev/ACD-1700-role-scoped-context/ACD-1700b-1.yaml
    relationship: related
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- The test fixture uses a temporary copy of the map; the shipped config/surface_craft_map.yaml is never
  modified by the test.
delivers_to: null
expects_from:
  ac_id: ACD-2500a-3
  contract: 'Requirement rule-check report: JSON on stdout, exit 0 iff verdict is passed. Shape: {verdict:
    ''passed''|''failed'', location: str (the path given, repo-root-relative POSIX), records_checked:
    int, findings: [{file: str (repo-root-relative POSIX), record_id: str|null (null only when the file
    could not be read), rule_family: str (human family name, e.g. ''producer/consumer contract symmetry''),
    disposition: ''fixed''|''needs a decision''|''failed''|''not evaluated'', message: str, line: int|null,
    detail: object|null}]}. Findings sorted by file then rule_family; at most one finding per (file, record_id,
    rule_family, subject).'
test_spec:
- name: test_workflow_js_assigned_python_coder_passes
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: W (python-coder, templates/workflows-js/plan-feature.js) produces no finding.
- name: test_sql_assigned_python_coder_flagged
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: Y (python-coder, queries/report.sql) gets one finding naming the path, sql-coder and python-coder.
- name: test_map_entry_change_flips_workflow_verdict
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: Changing the workflow-bodies entry to another specialist changes W's verdict on the next
    run.
  angle: seam
