created_by: "docs/acceptance-criteria/build-orchestration/BO-2200-documentation-coverage-guarantee/BO-2200a.yaml"
criteria: |
  Given the declarative `documentation_gates` policy and the ticket generator building
    the agents map for a leaf AC whose `change_target` is `code`,
  When the AC's `risk_surface` is `contract_boundary`,
  Then the generated agents map includes `documentation-expert`.
  And the same result holds when `risk_surface` is `safety`, `auth`, or `privacy`
    (each of these values, on its own, causes `documentation-expert` to be required
    even when the `change_target` alone would not have triggered it).
  And the risk-surface trigger is evaluated independently of the change-target trigger,
    so a documentation demand is raised if EITHER dimension matches its triggering set.
depends_on: [BO-2200a, BO-2200a-1]
