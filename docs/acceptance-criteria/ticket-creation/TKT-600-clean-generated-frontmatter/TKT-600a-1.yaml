criteria: "Given generate_ticket_from_ac generating a ticket from an AC,\nWhen it\
  \ builds the ticket frontmatter,\nThen every path written to files_touched names\
  \ a FILE that exists on disk, so a\n  bare directory named in a prose it_requirements\
  \ bullet (e.g. a bullet saying a\n  rule applies under docs/acceptance-criteria\
  \ or templates/skills) is never written\n  as an edit surface, since a directory\
  \ is not something a coder can edit,\nAnd a path named in a prose bullet that does\
  \ NOT exist on disk (an illustrative\n  example such as src/foo.py) is likewise\
  \ excluded,\nAnd a real source file named only inside a prose bullet (e.g. a bullet\
  \ reading\n  \"Modify scripts/goal_to_epic.py to ...\") IS kept, preserving TKT-500f-8-i,\n\
  And depends_on written to the ticket is guard-valid: an AC dependency\
  \ that is the\n  AC's structural parent (or any AC id with no corresponding ticket\
  \ in scope) is\n  dropped or translated to a co-located ticket filename, so the\
  \ generated ticket\n  passes ticket_frontmatter_guard without manual fixup,\nAnd\
  \ a standalone leaf AC whose only depends_on is its structural parent yields a\n\
  \  ticket with depends_on: [] (not a dangling AC-id reference).\n"
