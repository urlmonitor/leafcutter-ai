work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given an AC that references a supporting artifact (an eval fixture or example dataset)
    and specifies the field names that artifact is expected to use,
  When the consistency check runs before the work is dispatched,
  Then it verifies the artifact's field names and schema match what the AC specifies,
  And a mismatch is flagged and blocks dispatch,
  And the flag names the mismatching field on each side (AC-specified vs artifact-actual).
