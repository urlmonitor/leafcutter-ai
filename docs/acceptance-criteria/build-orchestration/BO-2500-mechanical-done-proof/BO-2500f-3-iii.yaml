id: BO-2500f-3-iii
components:
  - build_orchestration
  - ac_store
title: "The /inspect command starts the inspection workflow for one requirement id, and never approves anything itself"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the /inspect slash command, installed as a thin command over the
    inspection workflow in the same way /fast-lane-build is a thin command over
    its workflow,
  When a person types "/inspect DK-210b-3",
  Then the command starts the inspection workflow (BO-2500f-3-ii) with the single
    argument DK-210b-3 as the requirement id, and relays the workflow's result,
  And when the command is typed with no argument, with more than one argument, or
    with an argument that is not shaped like a requirement id (for example
    "/inspect please-approve" or "/inspect DK 210"), it does not start the
    workflow and replies with usage text naming the form "/inspect <AC-id>" and
    one example,
  And when the workflow tool is not available, or the workflow reports an error,
    the command stops and reports that failure, and does not carry out the
    inspection steps itself as a conversation,
  And the command never creates an approval file, never writes an answer of
    "approve", and never changes the requirement record itself; the only approval
    is the one the person gives inside the workflow,
  And the command's instructions contain no step that asks the agent running it
    to answer the workflow's approve-or-reject question on the person's behalf.
depends_on: [BO-2500f-3, BO-2500f-3-ii]
