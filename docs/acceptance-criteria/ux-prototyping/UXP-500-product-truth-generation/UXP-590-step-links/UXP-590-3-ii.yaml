criteria: |
  Given the product-truth generation flow has steps map, derive, invert, backref and validate,
  And UXP-512 claims it specifies step "write-backrefs" of that flow,
  When the product-truth validator runs,
  Then it exits non-zero,
  And it reports an error naming UXP-512, the flow id and the unknown step id
    "write-backrefs", and listing the flow's five existing step ids,
  And a claim naming a flow id that does not exist in the store is reported as an error
    naming the AC and the unknown flow id.
