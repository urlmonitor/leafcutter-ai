id: GE-129d-2-i
title: "Where no person can be asked, your own session is also refused when it hands the commit to the commit specialist"
component: guardrail-engine
components:
  - commit_guardian
  - supervisor_system
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, a staged change, and a top-level session in each permission
    mode the probe findings (GE-129a-1) record as showing no prompt to a person, and in a mode that
    is absent from what the guard receives or not listed in those findings,
  When the session dispatches the commit specialist to commit the change -- directly through the
    Agent tool, and separately through a subagent it dispatched that then dispatches the commit
    specialist,
  Then each dispatch is refused and no commit is added to the history,
    And the refusal names the permission mode received, or states that it could not be
    established, and states that a commit started from the session needs a person at the
    permission prompt,
    And the refusal names no token, environment setting, flag or dispatch wording as a way through.

  Given the same session in the same mode, dispatching the commit specialist with a dispatch prompt
    that says "dispatched by ticket-supervisor" and carries `ticket_path: tickets/x.md`, with an
    environment variable set that names a workflow run, and with a command text that names one,
  When the session dispatches the commit specialist,
  Then the dispatch is refused exactly as in the first scenario, because whether a dispatch comes
    from the session or from a workflow run is read only from the harness-supplied identity and
    context the probe findings record, never from command text, prompt, environment or files.

  Given the probe findings record a harness-supplied value that tells a workflow run's dispatch
    from a top-level session's in a mode that reaches no person,
    And in that mode, in turn, the fast lane's commit step, ticket-supervisor's commit phase and
    finalize-feature's closure step each dispatching the commit specialist on a staged change,
  When each run dispatches the commit specialist,
  Then none of the three dispatches is refused under this record.

  Given the probe findings record that no harness-supplied value tells a workflow run's dispatch
    from a top-level session's in a mode that reaches no person,
  When a top-level session in that mode dispatches the commit specialist,
  Then the dispatch is refused and no commit is added to the history,
    And the refusal states that the dispatch could not be told apart from a workflow run's,
    And that finding, with the consequence that a workflow run's dispatch in that mode is refused
    the same way, is returned to the user for a decision before this record is marked done.

  Given a top-level session in a mode the probe findings record as showing a prompt to a person,
  When the session dispatches the commit specialist,
  Then the dispatch is not refused under this record.
