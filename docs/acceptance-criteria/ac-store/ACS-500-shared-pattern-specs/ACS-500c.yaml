criteria: |
  Authoring agents detect and link to existing patterns automatically.

  When the BA, IT PO, or ac-triage agents encounter behavior that matches an
  existing shared pattern, they reference the pattern definition rather than
  writing a duplicate specification. The agents are pattern-aware during
  authoring — they check for existing shared components before creating new
  standalone ACs.
