id: BO-2400e-4
components:
  - build_orchestration
  - ac_store
title: "Recording progress on a requirement changes the progress and nothing else"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a requirement's record written in a deliberate order — its identity first, its
    wording next, its links and its long accumulated notes at the end,
  When a lean build records that work on it has begun, and later that it is finished,
  Then the only difference between the record before and after each update is the value
    that says how far the work has got,
  And every other part of the record keeps its original text and its original position
    within the record,
  And a build that carries eleven requirements, each recorded three times as the build
    progresses, changes exactly those thirty-three values and nothing else in the store.
depends_on: [BO-2400e, BO-2400e-3]
doc_links:
  - path: scripts/build_orchestration/fast_lane.py
    relationship: describes
    status: exists
    relevance: "The surface. SATISFIED as of 2026-08-18 — the description below is retained as history, not as current state. Originally: _update_ac_work_status re-serialised the whole record with the serialiser's default key ordering, so every update alphabetically re-keyed the entire file, and with three writes per requirement per run an eleven-member build produced roughly thirty whole-file rewrites. That round-trip was replaced by a targeted single-line text edit; the function now lives at lines 130-210 and its three call sites at lines 288, 346 and 461. Measured 2026-08-25 on a real 177-line record: 2 changed lines, against 305 for safe_dump(sort_keys=False) and 387 for the default dump."
  - path: docs/acceptance-criteria/build-orchestration/BO-2400-fast-lane-build/BO-2400e-2.yaml
    relationship: related
    status: exists
    relevance: "Sibling and motive: the lane must record 'incremental, logical commits' whose 'claims are verifiable in that commit's diff'. A commit whose diff is dominated by re-ordered record fields cannot be verified by reading it, so this AC is what makes BO-2400e-2's guarantee usable in practice."
  - path: docs/acceptance-criteria/build-orchestration/BO-2400-fast-lane-build/BO-2400f-9.yaml
    relationship: related
    status: exists
    relevance: "The mark-done flip that produces the third write per requirement; one of the three callers whose output this AC constrains."
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
declares_side_effect: false
it_requirements:
  reference_file_path: "scripts/build_orchestration/fast_lane.py"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/build_orchestration/ -q"
  config_schema_fragment:
    type: object
    description: "Post-condition contract of a progress update, stated as a property of the record's TEXT rather than of its parsed value. This is the shape the durable writer from BO-2400e-3 must additionally satisfy."
    required:
      - changed_lines
      - preserved
    properties:
      changed_lines:
        type: array
        description: "Exactly the line(s) carrying the work_status value. No other line in the file may differ, including whitespace and blank lines."
        items:
          type: string
      preserved:
        type: array
        description: "Everything else: key order, block-scalar style, quoting style, indentation, comments and trailing newline, all byte-identical to the pre-update file."
        items:
          type: string
  constraints:
    - "The guarantee is TEXTUAL, not structural. yaml.safe_dump sorts keys by default and normalises quoting and block scalars, so any design that loads-and-re-dumps the record fails the criteria even when the parsed mapping is equal. A round-trip-preserving loader or a targeted in-place edit of the single value are both acceptable; a plain safe_dump with sort_keys=False is NOT sufficient, because it still normalises block scalars, quoting and comments."
    - "Must preserve the store's real record features, not just simple ones: multi-line block scalars (the `criteria` and `notes` fields), blank lines inside those blocks, mixed quoting styles, unicode, and the file's trailing newline. These are the features a hand-written fixture lacks and a re-serialising writer mangles."
    - "This behaviour lands on the SAME writer BO-2400e-3 introduces, at all three call sites (fast_lane.py:203, :261, :376). Do not build a second, shape-preserving writer alongside the durable one: two writers will drift and one of them will stop preserving. That is why this AC depends_on BO-2400e-3 rather than the other way round."
    - "Fixtures must be REAL records copied from docs/acceptance-criteria/ into a temp tree, per CLAUDE.md's real-artifact rule. A short, uniformly-quoted hand-written record survives re-serialisation almost unchanged, so a synthetic fixture reproduces the bug-hiding bias and will false-green this AC — the store's actual records, with block-scalar notes and mixed quoting, are what expose the defect."
    - "Comparing parsed records is explicitly insufficient evidence for this AC and must not be accepted as coverage: a re-keyed record parses to an equal mapping, so a parsed-value assertion passes on the current defective behaviour."
    - "An eleven-member build performs about thirty writes; the preserving write must not make a single update more than marginally slower than the current whole-file dump."
delivers_to:
  - agent: python-coder
    contract: "The durable record-update entry point from BO-2400e-3, additionally guaranteeing that a progress update alters only the work_status line and leaves every other byte of the record — key order, block scalars, quoting, blank lines, trailing newline — unchanged. BO-2400e-2's 'claims verifiable in the commit diff' guarantee depends on this property holding for every progress commit the lane produces."
expects_from:
  - ac_id: BO-2400e-3
    contract: "The single durable record-update entry point in scripts/build_orchestration/, used by all three call sites. This AC constrains the serialisation that writer performs; it must not introduce a second writer alongside it."
test_spec:
  - name: test_only_the_progress_value_differs_after_an_update
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A real on-disk record is captured as text before and after a progress update; the textual difference is asserted to be confined to the progress value. Comparing parsed records instead of text is explicitly insufficient — see the rationale."
  - name: test_field_order_and_untouched_text_are_preserved
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The order of the record's parts, and the exact text of a long multi-line notes block including its blank lines, are unchanged after the update."
  - name: test_eleven_member_build_changes_only_its_progress_values
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "Copies eleven REAL records from the store into a temp tree, drives the build's progress recording through begin/finish for each, and asserts the total textual change across the tree is confined to the progress values. Real records are required: they carry the long notes, block scalars and quoting styles that a hand-written fixture will not reproduce."
  - name: test_progress_recording_preserves_the_record_via_the_real_surface
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "PRODUCTION ENTRY POINT: drive the lane's real progress-recording surface rather than any helper, so a preserving writer that exists but is not the one the lane calls fails here."
test_rationale: "The test an implementer will reach for first — load the record after the update and assert its values are correct — passes on the current, defective behaviour, because a re-keyed record parses to exactly the same mapping. The defect is invisible at the parsed level and visible only in the file's text, so every assertion here is textual. The real-records case matters for the same reason the project's real-artifact rule exists: hand-written fixtures are short, uniformly quoted and free of block scalars, which is precisely the shape that hides serialisation differences; the store's actual records carry long notes blocks, mixed quoting and multi-line criteria, and those are what a re-serialising writer mangles. The entry-point test is separate because adding a preserving writer while leaving one of the three call sites on the old path is the most likely partial implementation, and it would be undetectable from the other three tests."
