notes: |
  THE VERDICT MUST BE EVIDENCE-BASED. This is the binding constraint on this
  criterion and the reason it can work where two existing prompt rules failed:
  the judgement is made from observable repository state, never from the
  specialist's returned text. A parked specialist returns confident, well-formed
  prose ("I'll act on the completion notification when it arrives") — reading
  that text is exactly how the failure stayed invisible. On 2026-08-18 the stall
  was detected only by checking git status and git log against the report.

  Mechanism available to the implementer (IT PO territory, recorded so the
  behavioural intent is not lost): an exit-time hook can veto a specialist's
  attempt to finish, which is what makes "retry" enforceable rather than
  advisory. The requirement here is the behaviour — empty work cannot become a
  pass — not that specific mechanism.

  Two failure modes the BA must cover explicitly, because they are what make this
  hard rather than routine:
  - A step that legitimately changes nothing (a genuine no-op, an already-satisfied
    condition, a skip) must be distinguishable from a step that did nothing
    because it vanished. Without this, the guard blocks honest work and gets
    switched off — the same fate BO-2900d was added to prevent.
  - The retry must terminate. A specialist that parks identically every time must
    end as a visible failure, not an endless loop.

  Boundary: BO-210 (pre-commit safety net) re-dispatches a coder after a hook
  FAILURE and assumes the coder ran. BO-3100b covers the case where it never ran
  at all. BO-1300 (independent spot-check) verifies the QUALITY of work that was
  done; this verifies that work was done. Keep all three distinct.

  IT-PO DECISION (2026-08-26) — WHAT "THE PROJECT'S WORKING STATE" MEANS. The BA
  left this open on BO-3100b-1 and flagged its coupling to BO-3100b-3. Decided:
  BOTH tracked and untracked, over a content snapshot, minus a declared volatile
  set. Full specification lives in BO-3100b-1's it_requirements; the reasoning is
  recorded here because it binds every child of this L1.

  - Untracked additions MUST count. Almost every honest first output in this
    repository is an untracked new file (a new test, a new AC record, a new doc);
    ticket and AC folders are untracked wholesale. A tracked-only surface would
    judge the most common honest step empty and re-run it forever, which is the
    guard-gets-switched-off failure this L1 exists to avoid. This also resolves
    the coupling the BA recorded: a step whose only legitimate output is untracked
    is no longer falsely empty, so BO-3100b-3's declared no-op is needed only for
    steps that genuinely produce nothing at all.
  - The volatile exclusion set is the load-bearing half, and it is what keeps the
    guard from being a total no-op. Every agent appends to
    debugging/logs/agent_telemetry.jsonl and most touch __pycache__. If ambient
    churn counted as work, EVERY parked agent would be judged to have produced
    work and this L1 would ship as a no-op that looks like a fix — the same
    success-shaped nothing it exists to remove.
  - Content hashes, not mtimes. A rewrite with identical bytes is legitimately
    "produced nothing", and mtime moves on a no-op write.
