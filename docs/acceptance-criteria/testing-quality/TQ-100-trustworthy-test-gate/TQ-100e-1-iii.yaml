criteria: |
  Given a fixed suite and a fixed AC store, run once with the enforcement mode
    configured to report-only and the run observed to be non-blocking,
  When only the configuration value is changed to blocking and the suite is run
    again, with no edit made to any test file,
  Then the second run's enforcement behavior changes accordingly (a failing
    enforced test now blocks the outcome)
  And the change in behavior is produced entirely by the configuration change,
    not by any code or test edit
  And the same is true when switching among report-only, exclude-unbuilt, and
    blocking in any order.
