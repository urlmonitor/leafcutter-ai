id: BO-2500d-1-i
components:
  - build_orchestration
  - review_system
title: "Removing a mechanical proof-of-done gate, or letting an LLM verdict stand in for one, is rejected"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a proposed change to the fast lane that drops one of the three mechanical
    proof-of-done gates — red-baseline verification, green-plus-coverage verification,
    or the covers-tag linkage check — from the set that establishes done-ness there,
  When the change is validated,
  Then the change is rejected,
  And the rejection names the gate that would be dropped and states that all three must
    establish done-ness in the fast lane.

  Given a proposed change to the fast lane under which an LLM agent's verdict would
    stand in for a mechanical gate — the run could record an acceptance criterion done
    on the strength of that verdict where a mechanical gate had not passed, or a
    mechanical gate's result would be read only when a verdict permitted it,
  When the change is validated,
  Then the change is rejected,
  And the rejection states that an LLM verdict may withhold delivery and may never
    establish done-ness.

  Given a proposed change that adds, replaces or alters a reviewing agent whose verdict
    can only withhold delivery, while all three mechanical gates remain present and
    their results remain unconditional,
  When the change is validated,
  Then the change is accepted — what is rejected is substitution, not review, so the
    guard does not block the reviewer BO-2400f-11 put into this lane.

  Given a proposed change whose effect on done-ness cannot be determined — the lane
    definition cannot be read, or the set of gates establishing done-ness cannot be
    resolved from it,
  When the change is validated,
  Then the change is rejected and the rejection states that the effect on done-ness
    could not be determined,
  And it is not accepted on the grounds that no violation was observed.
