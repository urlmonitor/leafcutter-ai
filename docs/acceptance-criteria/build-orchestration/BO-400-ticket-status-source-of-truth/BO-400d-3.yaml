criteria: |
  Given a ticket whose `## Comments` log carries the entry headed
    "### 2026-08-12 09:15 — python-coder (status: blocker)",
  And whose frontmatter `agents:` map records `python-coder: signed_off` after a
    passing retry, with the matching `## Sign-offs` line
    "- [x] python-coder — 2026-08-13 10:14",
  When the ticket sign-off parity guard runs at commit time,
  Then it reads the ticket's `prior_failures:` list as a fourth place alongside
    the three it already checks — the frontmatter `agents:` map, the
    `## Sign-offs` checklist, and the Implementation Tasks checkboxes,
  And the commit is allowed when that list holds an entry for python-coder at
    2026-08-12 09:15,
  And the commit is blocked, with a message naming python-coder and the
    unaccounted blocker comment at 2026-08-12 09:15, when no such entry is
    present — whether the entry was never written or was removed by a later
    edit,
  And a ticket recording `python-coder: signed_off` with the matching
    `prior_failures:` entry passes the guard, so the `failed -> signed_off`
    transition remains a legal, committable path.

  Given the guard carrying this fourth check,
  When any commit that stages a ticket file is made,
  Then the guard runs on that commit as a registered commit-time hook,
  And it runs whether the ticket was driven by the single-ticket route, the
    epic route, or committed by hand,
  And it runs in blocking mode, so an unaccounted failure stops the commit
    rather than printing a warning that the commit ignores.
