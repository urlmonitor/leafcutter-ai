criteria: |
  Your L0/L1 priority settings are the autopilot's steering wheel.

  The system reads the priority field on your goals (L0) and features (L1) and
  uses it to rank the build queue. When you change a priority, the queue
  reorders itself. The highest-priority refined work is always what gets built
  next. You never need to manually select work items -- your priority choices
  do it for you.
