notes: |
  FRAMEWORK NEUTRALITY (L0/L1 constraint 4) is the second scenario: a harness that is not the E2
  engine calls the step and gets the same answer. A LangGraph node or a Claude Agent SDK tool that
  can run a command can call it unchanged. Nothing in the contract names the engine, an agent or a
  workflow.

  "reason" is added to the spec's five keys so a refusal is explainable; BO-4500a-1-iii adds one
  list for files a check changed outside the named set. Both are flagged as extensions of the C6
  spec for the user's confirmation.

  IT PO 2026-10-14 -- REASON_CODE DECISION (BrainCandy instruction 1). "refused" covers both a
  policy refusal (you asked for something not allowed: stop, do not retry) and a step failure
  (the step could not finish: may be retried). The approved criteria fix four statuses and put
  the runtime case under refused (BO-4500a-4-v), so a fifth status would contradict them. The
  distinction is therefore a REQUIRED, ENUMERATED reason_code on every non-committed answer,
  partitioned into policy_* and step_* families for refused (plus check_* for hook_failed and
  nothing_changed for nothing_to_commit). A fifth status is NOT needed: the partition gives
  callers the stop/retry decision mechanically. This supersedes the BA's Q4 alternative.

  IT PO 2026-10-14 -- ONE ANSWER WITH BO-3800a. The in-flight BO-3800a work
  (templates/scripts/commit_guardian/remedy_handoff.py on branch fast-lane/bo-3800a) builds the
  handoff payload a depth-0 caller consumes. This contract embeds that payload (remedy, handoff)
  instead of defining a second one, so BO-4500a and BO-3800a-2 describe ONE answer shape. The
  extension keys beyond C6's five are listed in delivers_to and flagged for the user.
