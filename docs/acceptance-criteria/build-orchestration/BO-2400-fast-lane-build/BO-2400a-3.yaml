title: "Red-baseline verification is a deterministic script gate before the coder runs"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the test-writer has written the batch's tests and no implementation change
    has been made yet,
  When the fast-lane loop verifies the red baseline,
  Then a deterministic script runs the batch's covering tests, partitions them into the
    tests newly added for this batch and the tests that already existed, and confirms
    that at least one newly added test for the batch is red
  And the coder agent is dispatched only after this red-baseline check passes.
