criteria: |
  Given a normal clone where the shared git dir equals the repository's own `.git`
    (not a linked worktree),
  When the probe runs against a correctly configured, firing hook chain,
  Then all four checks pass, the probe exits 0, and it does not report a
    "chain broken" or unresolved-shared-dir verdict.
  And a genuinely broken chain in a plain clone still fails as it would in a
    worktree.
