criteria: |
  Given an acceptance criterion AC-X has implemented_by entry
    "src/foo.py#process_order"
  And the staged commit keeps "src/foo.py" present but moves the function
    process_order out of that file (or renames it, or removes it)
  And the symbol-analysis tooling is available for the file's language
  When the traceability reconciliation check evaluates AC-X
  Then the check parses the #symbol anchor as the symbol name "process_order"
  And it resolves the symbol via the symbol-analysis tooling
  And it produces a drift verdict for AC-X naming the symbol "process_order" and
    the change kind as moved, renamed, or removed

  Given an acceptance criterion AC-Y has implemented_by entry
    "src/foo.py#charge_card"
  And the staged commit keeps "src/foo.py" present and the function charge_card
    still resides in that file
  And the symbol-analysis tooling is available for the file's language
  When the traceability reconciliation check evaluates AC-Y
  Then the check produces a clean verdict for AC-Y even though the file content
    changed
