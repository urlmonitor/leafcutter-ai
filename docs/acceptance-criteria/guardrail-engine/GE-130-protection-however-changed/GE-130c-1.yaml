id: GE-130c-1
title: When a command the before-check could not judge changes a protected file, the file is named afterwards
  and the run stops
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a command issued from the session's shell whose effect on files a protection watches
    could not be told before it ran -- running a script, a build step, or a program handed a list
    of files -- so it was not refused beforehand,
  And each protection's rule: the documentation guard's for a code file in a folder an
    architecture document describes, the guide-read guard's for a file in a gated folder whose
    guide is unread, and the task-lock guard's for any file while the lock is in place,
  When the command finishes,
  Then every watched file that differs on disk from its state immediately before the command and
    that the protection's rule would have refused is named, with the protection whose rule
    covers it,
  And the run is stopped, no further tool call in it is carried out, and the stop names the
    protection and every file it named,
  And a watched file that already differed before the command began, and that the command did not
    change, is not named,
  And in the same run a command of the same kind that changed no watched file finishes with no
    stop and no statement.
