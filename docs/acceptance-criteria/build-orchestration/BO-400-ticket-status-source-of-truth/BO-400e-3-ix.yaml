id: BO-400e-3-ix
title: "Setting up a single-ticket worktree records, against the branch it creates, which ticket that branch is being built for -- so finalization reads it back instead of guessing it from the branch's name"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
  - finalize
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
package_surface: false
criteria: |
  Background:
    Given the ticket "tickets/00_inbox/TICKET-20261015-Close_X.md" exists on main

  Scenario: Setting up a single-ticket worktree records the ticket against its branch
    When a single-ticket worktree is set up for "TICKET-20261015-Close_X.md"
    Then the branch it creates carries a record naming
        "tickets/00_inbox/TICKET-20261015-Close_X.md" as the ticket it is being built for
      And finalization of that branch takes the ticket it was built for from that record, not
        from the branch's name
      And making the record changes no file on the branch, so the branch has not changed the
        ticket merely by being set up for it

  Scenario: The record holds when the branch's name cannot be turned back into the ticket
    Given the worktree for "TICKET-20261015-Close_X.md" was set up with its branch name
        overridden to "feature/my-fix"
    When finalization works out which ticket "feature/my-fix" was built for
    Then it is "tickets/00_inbox/TICKET-20261015-Close_X.md"

  Scenario: Two tickets whose names give the same branch are not confused
    Given a worktree was set up for "TICKET-20261001-Close_X.md", creating the branch
        "feature/close-x", and that branch still exists
    When a single-ticket worktree is set up for "TICKET-20261015-Close_X.md", whose name gives
        the same branch "feature/close-x"
    Then the record on "feature/close-x" still names "TICKET-20261001-Close_X.md"
      And the setup stops without reusing the worktree, and says that "feature/close-x" is
        already being built for "TICKET-20261001-Close_X.md"

  Scenario: Setting up the same ticket again leaves the record as it was
    Given a worktree was already set up for "TICKET-20261015-Close_X.md"
    When a single-ticket worktree is set up again for the same ticket
    Then the record names "tickets/00_inbox/TICKET-20261015-Close_X.md", and only that ticket

  Scenario: A worktree set up without a ticket records none
    When a worktree is set up for a branch that has no ticket -- for a quick fix, a fast-lane
        build, or acceptance-criteria authoring
    Then no ticket is recorded against its branch

  Scenario: A branch set up before tickets were recorded is not guessed at
    Given a single-ticket branch whose worktree was set up before tickets were recorded against
        branches, and which changed tickets since it left main
    When finalization works out which ticket the branch was built for
    Then it cannot identify one, closes nothing, and says so as described in BO-400e-3-viii
      And it does not fall back to the branch's name or to searching the tickets for one that
        mentions the branch
  So finalization can tell which ticket a single-ticket branch was built to deliver from a fact
    written when the branch was made, rather than from a branch name that drops the ticket's date,
    folds its case and can be overridden -- and a branch that carries no such fact closes nothing
    rather than being guessed at.
