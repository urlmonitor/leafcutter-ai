test_spec:
- name: test_agent_knowledge_entrypoint_discovery
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Start from the normal installed agent discovery surface, locate each route and execute its documented
    public example with a local port. Verify exact lookup versus research clarification and explicit disabled/unsupported
    outcomes, not merely documentation text matching.
  covers:
  - KM-500d-1
  requires_db: false
- name: test_agent_entrypoint_disabled_is_offline
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: failure
  description: Exercise ordinary startup/discovery with optional SDKs and credentials absent, instrumenting
    network creation; disabled knowledge must make no connection and legacy scanner must not invoke research
    or host build.
  covers:
  - KM-500d-1
  requires_db: false
