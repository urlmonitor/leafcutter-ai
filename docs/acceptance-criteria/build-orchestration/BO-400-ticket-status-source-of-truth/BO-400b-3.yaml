criteria: |
  Given a ticket file at path /path/to/epic/03_some_ticket.md
    tracked by git with no uncommitted changes,
  When the script successfully updates the status field
    (exit code 0),
  Then it runs git add on the modified ticket file
  And a subsequent git status --porcelain on that file path
    shows the file in the staged-modified state
    (the index column shows M).
