roadmap_phase: phase_1
criteria: |
  Oversized files can be worked on, but never made bigger.

  A file that is already past a workable size may still be fixed, corrected and
  improved — but a change that leaves it larger than it was is refused, and the
  refusal is judged against that file's own previous size rather than against
  any threshold. The backlog of oversized files can therefore only ever shrink,
  and the standard can be switched on today without stopping work on the files
  that already breach it.
