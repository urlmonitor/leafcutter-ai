notes: |
  THE THRESHOLD IS A JUDGEMENT AND IT IS MADE HERE RATHER THAN LEFT OPEN, as the
  L1 requires. Two decisions:

    1. WHEN TO SPEAK — only when at least one finding was actually withheld, not
       whenever the reduction applied. The difference is enormous in this
       repository. The reduction covers the acceptance-criteria store, the
       ticket tree, the retrospectives and the skill prompts; an ordinary commit
       touches dozens of files in those trees and withholds nothing in any of
       them. Announcing application rather than effect would print on nearly
       every commit, and a notice printed on nearly every commit is read on
       none.

    2. HOW MUCH TO SAY — one summary per run, an exact total, and at most 10
       per-file lines followed by a count of the remainder. The bound exists so
       that a pathological run cannot bury the header; the exact total exists so
       that the bound never hides the size of the gap; and the machine-readable
       record keeps the complete list for anything that needs it.

  WHY "AT LEAST ONE WITHHELD" IS NOT THE SAME AS "AT LEAST ONE CREDENTIAL". A
  withheld finding is a value the check would have reported and did not. It may
  be a false positive. That is precisely why the notice announces rather than
  blocks, and why the number matters more than any individual line: a total that
  jumps after a change to the reduced set is the signal, and it is visible even
  when every individual withheld finding turns out to be benign.

  THIS ARM IS WHAT MAKES THE OTHERS FALSIFIABLE. Every other criterion in this
  L1 asserts that something is said. Only this one asserts that something is not
  said, and an implementation that always speaks passes all of them without it.
  It must not be folded into a sibling as an afterthought clause.

  FIXTURE PLACEMENT, stated as this tree requires, and unusual in the first arm:
  40 files under "docs/acceptance-criteria/guardrail-engine/" are all under a
  reduced location ON PURPOSE. The usual trap in this tree is a fixture that
  accidentally sits under a reduced path and so measures the reduction; here the
  arm is specifically about a reduced path that withholds nothing, so the
  placement is the scenario. The second arm's "src/app.py" is outside every
  reduced location, also on purpose, so that the two silences have different
  causes and an implementation cannot satisfy both by never printing anything —
  it is GE-125d-1's positive arm that stops that.

  IT-PO NOTE, 2026-08-24 — THE SILENCE IS THE STATUS QUO AND MUST BE LEFT
  ALONE. Measured in the canonical copy: main() in
  templates/scripts/commit_guardian/check_secrets.py returns 0 at the
  `if not findings` guard before producing any output, so a run over 40 reduced
  files that withheld nothing is silent today. The risk this record guards is
  not that the silence is missing but that GE-125d-1's notice is implemented in
  a way that breaks it — most obviously by emitting a header before the withheld
  count is known, or by emitting a zero-valued block for symmetry with
  GE-125d-2's always-present record. Both are ruled out above.
