notes: |
  THE DRIFT IS THE POINT, NOT THE FIRST-DAY CORRECTNESS. Any hand-built arrangement is
  faithful on the day it is built. What this record is actually about is the second day:
  the standard changes and one of the two surfaces does not. This project has already
  lived that exact failure on an adjacent surface, where a published description of a
  gate outlived a change to the gate's behaviour by long enough for people to plan around
  the wrong rule. A criterion satisfied by correcting today's figures is satisfied again
  the next time they diverge — which is to say, not satisfied.

  WHY THERE ARE TWO CHANGES AND NOT ONE. A single change can be survived by an
  arrangement that re-resolves the figure whenever the declaration is edited but not
  whenever the specialist is dispatched — one that happens to have been rebuilt between
  the edit and the observation. Two changes in a row, with the comparison made after
  each, is the smallest sequence in which "they agree" reads as a property rather than
  as a coincidence of ordering. If an implementation needs a rebuild between the two,
  that is a legitimate design and should be stated as such at enrichment; what may not
  be left unstated is what a specialist is told in the window before it happens.

  WHY THIS IS NOT PART OF INF-1200b, SINCE THE MERGE IS TEMPTING AND WAS REFUSED. b
  promises one edit in one place; this promises no divergence between what was said and
  what is applied. The negative case is today's design generalised: if each specialist's
  material continued to name the figure it wants while the values were filled in from
  the declaration, this record would hold and b would fail, because covering a new kind
  of file would still mean editing a specialist. Both are needed and the PO recorded the
  refusal explicitly.

  WHAT THIS DOES NOT CLAIM, STATED SO IT IS NOT INFERRED. It takes no position on
  whether a given standard or a given way of measuring is the right one — only that one
  figure is in play rather than two. Which figure is correct is the user's decision at
  approval; whether the measurement is reproducible is GE-127d's subject; whether a
  figure is applied at all is not required here, which is what keeps this record
  consistent with INF-1200a-3.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Written so the IT PO can
  lift them verbatim into test descriptors.

  (1) MUTATION: hold the figure stated in the specialist's material at the value it had
      when the delivery was last carried out — a snapshot taken once and reused. Under
      that injection the first comparison must STAY GREEN, because a snapshot is correct
      on the day it is taken, and both later comparisons must go RED. Both outcomes must
      be observed and both must revert. The green outcome is the entire argument of this
      record: first-day correctness is what every hand-built arrangement already has.

  (2) MUTATION: resolve the figure stated in the material from one copy of the
      declaration and leave the figure applied to the work resolving from another copy,
      the two being identical at the moment of the split. Under that injection the first
      comparison must STAY GREEN and the later comparisons must go RED as soon as one
      copy is edited. Both outcomes must be observed and both must revert. Two copies
      that agree today is the exact shape this record forbids and it is invisible to any
      single comparison — which is why the criterion is written as a sequence and not as
      an equality.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. Both
  mutations above, including which arm must stay green, are written to be turned
  directly into test descriptors.
