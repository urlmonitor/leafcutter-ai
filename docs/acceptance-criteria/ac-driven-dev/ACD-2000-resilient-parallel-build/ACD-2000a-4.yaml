criteria: |
  Given a requirement carries a trail of attempts and a rework budget,
  When an author or an operator consults the reference documentation for the
    requirement record,
  Then the documentation describes what an attempt record holds -- who, when,
    which stage, what outcome, what was decided -- and states that the trail is
    append-only and why,
  And it states whether a spent budget is per-run or per-lifetime, and how a
    person clears an exhausted one,
  And it states that a declared budget of zero means escalate on the first
    failure and is not the same as declaring nothing,
  And an operator who has read only this documentation can look at a stuck
    requirement and say how many attempts it has left and what to do next,
    without reading any implementation.
