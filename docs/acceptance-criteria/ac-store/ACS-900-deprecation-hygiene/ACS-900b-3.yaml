criteria: |
  Given the blocking enforcement (ACS-900b-1) and its commit_guardian wiring
    (ACS-900b-2) are implemented,
  When a contributor hits the block or needs to understand the enforcement
    posture,
  Then a how-to guide documents that retiring an AC whose implementing code
    still lives blocks the commit, that the block is never downgraded to a
    warning, and that an internal hook error fails open instead of hard-blocking,
  And a sequence diagram shows the block path at commit time: retired transition
    detected, surviving implemented_by entries found, non-zero exit returned,
    commit halted — with the fail-open branch shown as an alternative on
    internal error.
depends_on: [ACS-900b-1, ACS-900b-2]
