  notes: |
    The server must be launched in its own session (start_new_session=True) so a process
    group exists to signal. Teardown must signal the whole process group (os.killpg), not
    only the recorded shell PID; after teardown no member of that group may remain
    running. Subprocess and signal handling must follow the project error-handling policy
    — an already-dead process (ProcessLookupError) must be handled gracefully, not
    swallowed silently. The port previously held by the group must be free after
    teardown. This change spans two locations: the Popen spawn (start_new_session) and
    the kill path (os.killpg).
