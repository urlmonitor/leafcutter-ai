it_requirements:
  - >-
    THE BOUND IS SHARED AND SETTLED: ONE specialist engagement per delivery. It is
    BO-3800d-1's own named constant, declared in both phase-loop twins, and never
    MAX_RETRIES. Complexity and file size use the same specialist, so they share the bound.
    BO-3000a's pair cap (one honoured commit-to-specialist handoff per drive) agrees with it.
    The stop that pair cap produces must carry this record's account, not only BO-3000a's
    handoff chain.
  - >-
    FULL STRENGTH ON EVERY RETRY. The re-offered commit's dispatch carries no
    SKIP=check-complexity and no override or bypass instruction. GE-131a-3's pure-move SKIP
    route is for a human with an unchanged function, and a drive never takes it. Between the
    first and last attempt, complexity.max_score in commit_guardian.json is byte-identical.
    The parent revisions the ratchet reads are unchanged: no amend, no rewritten HEAD, no
    baseline edit. No excluded directory or exemption is added for the file or the function.
  - >-
    THE ACCOUNT names scripts/planner.py, plan_batches, the score plan_batches has now, the 30
    allowed, the engagement count and "nothing delivered". The score is taken from the second
    refusal's machine-readable record (GE-132a-3), never recomputed. Reuse BO-3800d-2's stop
    shape and its endings, and its decision on keeping partial progress. Neither is restated
    or decided here.
  - >-
    The same twin-parity, size-ratchet and ADR-001 constraints as BO-3800b-3 apply.
test_required: true
test_spec:
  - name: test_bo3800d3_success_within_bound_lands_without_reengaging_the_specialist
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "unit_tests/prompt_assembly/_driver_harness.py executing build-feature.js (TWIN_DRIVERS)"
    description: "Arm 1. The stub specialist leaves plan_batches at 29, and the stub commit agent runs the REAL check_complexity.py against the fixture repo. The second attempt is judged and lands, and restructuring-specialist appears exactly once in the dispatch record. RED TODAY."
  - name: test_bo3800d3_still_over_ceiling_at_bound_stops_with_account
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Arm 2. The stub specialist leaves plan_batches at 31. The run stops without delivering. Its account names scripts/planner.py, plan_batches, 31, 30, an engagement count of 1, and that nothing was delivered. RED TODAY."
  - name: test_bo3800d3_every_retry_is_judged_at_full_strength
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Arm 3, over both runs above. The re-offered commit dispatch carries no SKIP or override. commit_guardian.json and the fixture repo's HEAD are byte-identical before and after. The real check was executed on every attempt. RED TODAY: no retry exists."
    must_catch:
      - "THE QUIET SKIP: retry with check-complexity skipped"
      - "THE MOVED GOALPOST: record plan_batches' previous committed score as 31"
test_rationale: >-
  The bound and the escape hatches are observed in the run: the dispatch count, the retry's
  dispatch arguments, and the repo state before and after. Grepping the driver for a counter
  or a SKIP string proves nothing. Three tests, all red today. Named mutation (3), THE SPENT
  QUOTA, has no descriptor. At the settled bound of one, together with BO-3000a's pair cap,
  it is behaviourally identical to the correct build (reported as an ambiguity).
