id: BP-100a
readiness: reviewed
priority: medium
title: "Every registered hook has a real script behind it"
component: build-pipeline
level: L1
status: active
criteria: |
  Registered hooks always point to scripts that exist — broken references are caught before they ship.

  When a hook is declared in the configuration but its backing script is
  missing or misplaced, the build warns clearly instead of producing a hook
  that silently does nothing. The integrity check is non-blocking — the build
  continues after emitting warnings — so that developers are informed without
  being halted.
