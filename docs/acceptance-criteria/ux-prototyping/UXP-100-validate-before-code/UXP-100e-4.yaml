criteria: |
  Given UXP-100e describes parallel execution of the UX designer and BA agents
    after PO framing is complete,
  When a sequence diagram is produced for this parallel workflow,
  Then the diagram shows the following actors: PO agent, pipeline orchestrator,
    UX designer agent, BA agent, and prototype artifact store
  And the diagram shows: (1) PO completes L0/L1 ACs, (2) orchestrator dispatches
    UX designer and BA in parallel (shown as a par fragment), (3) UX designer
    writes prototype artifact, (4) BA reads partial prototype while decomposing,
    (5) both agents complete independently
  And the diagram shows the optional path where UX is not warranted:
    orchestrator dispatches BA only, UX designer is not invoked
