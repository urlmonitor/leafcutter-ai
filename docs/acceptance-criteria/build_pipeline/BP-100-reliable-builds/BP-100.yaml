criteria: |
  Build once, trust the result — every artifact lands exactly where it should.

  After a build completes, every artifact the system promised is present and
  correctly placed. Hooks point to real scripts, compiled workflows land where
  agents can find them, folder paths respect the project's own configuration,
  and hook templates ship identically across all template directories so
  consumer projects receive the same hooks the package itself uses.
