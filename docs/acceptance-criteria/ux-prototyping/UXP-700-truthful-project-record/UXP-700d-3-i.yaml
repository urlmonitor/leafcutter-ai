risk_surface: contract_boundary
test_required: true
test_rationale: |
  The marker is only useful if a reader holding one file finds it, so the real-artifact test
  reads a checked-in example file's own content rather than an index or a loader that
  already knows the path. The boundary test reads a project-owned artifact the same way and
  asserts the key is absent, because a marker present everywhere says nothing.
test_spec:
  - name: test_example_artifact_declares_its_example_product_in_its_own_content
    target_dir: unit_tests/product_truth/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "A checked-in fern-and-fig journey, screen and dataset each carry example_product: fern-and-fig in their own content."
  - name: test_project_owned_artifact_carries_no_example_declaration
    target_dir: unit_tests/product_truth/
    framework: unittest
    type: integration
    angle: boundary
    description: "A project-owned artifact and criterion read the same way carry no example_product key; the schemas accept the key without requiring it."
notes: |
  ORDER, DECIDED 2026-09-16: the split the user chose was "schema and checker" then
  "backfill". It is taken in the reverse order. ADR-044 section 5 requires every existing
  example item to be marked in the same change that introduces the check; a cross-check
  landing first would report all 14 fern-and-fig artifacts and 18 example criteria as
  undeclared, and check-product-truth-validate would refuse that PR's own commit. So this
  half registers and backfills the key with no check, and UXP-700d-3-ii adds the check once
  nothing is unmarked.

  MEASURED 2026-09-16 (scratchpad draft): 3 fern-and-fig flows, 10 mockups, 1 dataset; 18
  example criteria carrying `product: fern-and-fig`.

  MEASURED 2026-09-17 (implementation, re-verified): flows/mockups/dataset counts unchanged
  (3/10/1). The 18-file raw grep count for `product: fern-and-fig` across AC yaml also holds.
  scan_ac_store.py's own reported `set_aside_count` (its default --level leaf --work-status
  todo --json filters: leaf, work_status=todo, status=active, readiness=approved) is 3, not
  18 -- most of the 18 example ACs are not yet readiness: approved, so they are excluded from
  the ready/blocked/set-aside classification entirely regardless of the product marker. The
  AC's own closing clause ("the count of example criteria set aside from the work queue is
  unchanged by the rename") is verified against this real, smaller figure (3), not the raw
  18-file count.
target_epic: EPIC-TruthfulProjectRecord
