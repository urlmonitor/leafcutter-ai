notes: |
  UNASKED-FOR, KEPT ON PURPOSE. The request names the fresh start only. A resume is a second
  start of the same workflow, and the startup check runs before any gate logic, so a fix that
  only patches the command's Step 2 leaves every documented resume halting the same way -- and
  the person's answer is then never applied, which is ACD-1300e's whole promise. The skill's
  sec. RS.2 shows only args.resume_answer.

  The same-workspace clause stops the obvious repair (have the resume run the maker again)
  from silently making a fresh workspace without the paused run's drafts and record
  (ACD-1300e: "resumes in the same workspace, with the same state").
