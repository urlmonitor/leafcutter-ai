readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a step that ran, did its preparatory work, and then reported that it was
    holding at a confirmation it is required to obtain and that no way of obtaining
    that confirmation was available to it,
  When the run records the step's outcome,
  Then the outcome recorded for that step is that it stopped short,
    And the record names what stopped it, in the words of the step's own account,
    And the step does not appear in the run's list of steps that completed.

  Given a step that ran and could not get past a permission it was not granted,
  When the run records the step's outcome,
  Then the outcome recorded is that it stopped short and the record names the
    permission,
  So the two kinds of blocker a step can hit are both recorded as stopping short,
    each naming its own cause.

  Given a step that ran and completed its work,
  When the run records the step's outcome,
  Then the outcome recorded is that it completed, and nothing is recorded as having
    stopped it,
  So an outcome of stopped short is a consequence of a step actually stopping and
    never a state every step passes through.

  Given a step that stopped short,
  When the run's record is read afterwards,
  Then the information the step gave about why it stopped is present in that record,
  So an account the step supplied is never discarded on its way into the record.
