estimated_complexity: L
it_requirements:
  - "One declaration, read by both surfaces. Neither the procedure's prose nor the parity check's logic may carry its own copy of the leg list, and no test may carry a third copy as a hardcoded count - the coverage note names that explicitly."
  - "The message about a missing leg and the step the procedure shows for that leg must come from ONE format string, so the two are identical rather than merely similar. ACS-100i-9's finding is that two paraphrases of one requirement read to an author as two different requirements."
  - "Completeness must be measured against the declaration, never against a count. A parity check that knows there are four legs is a third copy of the list wearing a number."
  - "The declaration file must be deployed to every layout that reads it. Both a deployed commit-guardian hook and a portable skill consume it, so a source-tree-only declaration leaves the deployed parity check with no legs at all - and a parity check with no legs reports every check as complete, which is this tree's defect arriving through the build (CLAUDE.md, 'New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest'; ADR-013)."
  - "The procedure surface is templates/skills/create-hook/SKILL.md, a skill body rather than an ordinary document. Its rendered form must be verified as the build produces it, not only as the template reads, because the author sees the deployed skill."
  - "The add-a-leg exercise must be performed in an isolated fixture tree. Adding a leg to the repository's real declaration during a test would change what every real check is measured against."
  - "Error handling must follow the four rules in CLAUDE.md. A declaration that cannot be read is a condition the parity check must report, not one it may fail open on - failing open here reports every check as complete."
test_spec:
  - name: test_adding_a_leg_to_the_declaration_moves_both_surfaces_with_no_other_edit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_hook_parity.py and the rendered create-hook procedure"
    description: "A leg is added to the declaration in a fixture tree and nothing else is edited; the rendered procedure presents it as a step and the parity check reports a fixture check that omitted it. This is the only honest test of single-sourcing - asserting the two surfaces currently agree passes on two hardcoded lists that happen to match."
  - name: test_removing_a_leg_stops_both_surfaces_mentioning_it
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "The reverse edit removes the leg from both surfaces with no other change - a surface that renders from the declaration on add but keeps a stale entry on remove is caught here."
  - name: test_the_parity_message_and_the_procedure_step_are_the_same_string
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "The wording the parity check emits for a missing leg and the wording the procedure shows for that leg are compared to each other for equality, not each to a literal - two similar strings fail."
  - name: test_a_fixture_registered_on_every_declared_leg_is_reported_complete
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "A fixture check registered on every leg the declaration names is reported complete, and the same tree with the declaration unreadable does NOT report it complete - a declaration that fails open reports every check as complete, which is this tree's own defect."
  - name: test_the_declaration_is_present_and_readable_in_the_built_layout
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: "scripts/build.py --target-dir <temp>"
    description: "After a real build into a temporary target, the deployed parity check reads a non-empty leg list from the deployed declaration - a source-tree-only declaration leaves the deployed check measuring against nothing."
test_rationale: |
  Asserting that the two surfaces currently agree is the test everybody writes and it
  passes on two hardcoded lists that happen to match — which is the state the repository
  is in today, and the state that produced KI-CG-020. Only the add-a-leg exercise can
  distinguish single-sourcing from coincidence, and only the remove-a-leg exercise
  catches a renderer that grows entries but never drops them. The same-string descriptor
  is a comparison between the two producers rather than against expected text, per
  ACS-100i-9. The fifth descriptor exists because the declaration is a new file: if the
  build does not deploy it, the deployed parity check measures against an empty leg list
  and reports every check complete — a green gate that checked nothing, which is the
  defect this entire tree is about, arriving through the build step.
delivers_to:
  agent: documentation-expert
  contract: "The single leg declaration and the one wording per leg produced from it. GE-126d-4's procedure and GE-126d-5's reference must both RENDER their leg list from this declaration rather than restating it in prose, and both are forbidden by their own criteria from carrying a second copy."
expects_from:
  - ac_id: GE-126d-1
    contract: "The roster recognised as a fourth registration leg, and the finding emitted for a check absent from it. That finding's wording becomes one of the per-leg wordings this declaration owns."
  - ac_id: GE-126d-2
    contract: "The deliberate-exclusion record. Where it lives must be settled against this declaration rather than ahead of it, so that recording an exclusion does not become a fifth undeclared enumeration."
