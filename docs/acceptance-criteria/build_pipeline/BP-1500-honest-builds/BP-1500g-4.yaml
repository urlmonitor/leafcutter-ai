notes: |
  SATISFIES THE how-to ENTRY IN BP-1500g's documentation_triggers.

  THIS AC IS ORDERED AFTER THE BEHAVIOURAL ONES ON PURPOSE. It depends on
  BP-1500g-1 and BP-1500g-2 because the first Then clause cannot be written
  truthfully until a placement exists that survives both a build and the package's
  own delivery. Writing it earlier would produce a document that describes an
  intention. If an implementer reaches this AC and finds the answer is still "there
  is nowhere safe", the correct response is to stop and say so, not to publish the
  least-bad option as guidance.

  IT DOES NOT PRESCRIBE THE PLACEMENT EITHER. The criterion is that the
  documentation STATES where additions can live -- whatever the implementation of
  BP-1500g-1 decided. The AC set constrains the outcome and the discoverability of
  the answer; it does not contain the answer, and this file must not become the
  place someone writes one down.

  THE THIRD Then CLAUSE IS THE ONE THAT MAKES THIS MORE THAN A PAGE. An adopter
  who can verify their own work survived does not need to trust the guarantee, and
  it is the only check available to them in a project whose test suite they do not
  run. It is also the check that would have surfaced this defect years earlier in
  the reporting repository.
