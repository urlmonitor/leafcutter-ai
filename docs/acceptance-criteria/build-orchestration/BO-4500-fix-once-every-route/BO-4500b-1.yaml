notes: |
  THE MECHANISM. ALPHA/BETA/GAMMA-ANSWER are fixture names, so the record proves the mechanism is
  general and not COMMIT-ANSWER-shaped. The GAMMA scenario is the generality claim: a new block
  needs a source and a marker pair, nothing else.

  PO CHALLENGE 1 (overlap with BO-4300c-3) -- RESOLVED HERE. This record owns the one filling
  mechanism. WORKSPACE-ANSWER becomes one more block on it when BO-4300c-3 is driven; whichever is
  driven first builds THIS general mechanism, never a workspace-only one. BO-4300c-3 needs an
  amended_by entry pointing its inliner / parity / hand-filled-pair it_requirements at BO-4500b-1,
  BO-4500b-2 and BO-4500b-1-iii. The BA does not edit another run's L2 -- flagged for the gate.

  PO CHALLENGE 5 (framework neutrality) -- RESOLVED AS: sharing is a property of the INSTALLED
  TEXT. The filling and the identity check are judged on installed files, need no workflow engine
  (last scenario), and nothing in the criteria names today's engine. A route moved to LangGraph or
  the Claude Agent SDK keeps the promise as long as its installed text carries a marker pair.

  ERROR CASES (PO challenge 3) are the five L3s below. All of them share one property, stated in
  each: a failing install leaves every installed route exactly as it was before that install began
  -- the whole route set is validated before any route is replaced. That is a deliberate choice: a
  half-replaced set would mix old and new block text, the drift this L1 exists to prevent.

  OUT OF SCOPE (PO challenge 4), recorded as follow-ups, not absorbed:
    - BO-3900-PATH-HELPERS blocks already differ between build-feature.js and plan-feature.js
      (BO-4300c-3 it_requirements, verified 2026-09-25). Natural third consumer; needs its own record.
    - The duplication analysis C3 proposes a further inlined human-approval gate block
      (resolveGate / pauseAtGate). Same mechanism, separate record.
  BOUNDARY vs BP-1000e (build-pipeline): BP-1000e compares a workflow FILE with its shipped mirror;
  this record makes one BLOCK identical across MANY routes. Different axis; neither replaces the other.
