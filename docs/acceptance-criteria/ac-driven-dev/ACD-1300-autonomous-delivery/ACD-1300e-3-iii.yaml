notes: |
  INFERRED, NOT REPRODUCED. KI-BO-20261022 lists the quote break as candidate path 3 and says
  it did not fire on the 2026-10-25 occurrence. It is still a live defect in the code as
  described there, and it is the one candidate the executor move (ACD-1300e-3-ii) does NOT
  close: the one-command executor runs the line unchanged, so a quote that breaks the line
  breaks it there too.

  WHY THE GIVEN CARRIES MORE THAN A SINGLE QUOTE. "Escape ' as '\''" (the KI's minimum fix)
  turns the single-quote case green and leaves $ and backtick expansion open the moment the
  quoting style changes to double quotes, and leaves a CRLF/encoding round-trip unpinned on
  Windows. Each character in the Given is there to turn one specific weaker fix red. The
  non-ASCII line pins the Windows code-page hazard (the recorded runs are on win32).

  The rule-check summary is the realistic source: KI-BO-20261101 records a declined rule check
  producing exactly "the check produced no readable report (JSON Parse error: ...)", and V8's
  parse errors quote the offending token in single quotes.
