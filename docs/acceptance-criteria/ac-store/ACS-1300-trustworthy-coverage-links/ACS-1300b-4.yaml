it_requirements:
  - "THE PARTICIPANT SET AND THE CLASSIFICATION ARE TAKEN FROM ACS-1300b-1's DERIVED ENUMERATION, NOT FROM THE AUTHOR'S READING OF THE CODE. Where the diagram and the enumeration disagree the enumeration is right, because it is derived. A diagram drawn from a reading of the source drifts the moment a path is added and there is nothing to catch it."
  - "DRAWN IN THE EXISTING DELIVERY-FLOW VOCABULARY of `docs/architecture/agent_delivery_workflows.md` — the same actor names and the same notation. A second notation for the same actors makes the two documents describe two systems."
  - "THE TRIGGER CONDITION IS THE LOAD-BEARING ELEMENT AND MUST BE ON THE INTERACTION, NOT IN A CAPTION. `templates/agents/ac-fulfillment-gate.md` skips silently when a ticket carries no `ac_traceability` key (:82-89). A reader who cannot see that condition on the arrow cannot see why a path misses the step."
  - "THREE OUTCOMES MUST BE VISUALLY DISTINCT: reaching, bypassing, exempt. A bypassing path must be shown completing WITHOUT the interaction occurring — the omission drawn, not inferred from a missing arrow, because a missing arrow also looks like an incomplete diagram."
  - "SCOPE FENCE, NOT A STYLE NOTE: do not depict what the link-recording step SEARCHES. The stale diagnosis this tree had to correct was about exactly that, and drawing it re-seeds it and puts the shipped 2026-08-26 fix back on the table as though it were open."
  - "THE DELIVERABLE IS THE DIAGRAM AND NOTHING ELSE. No behavioural AC in this tree may be closed by pointing at it. A diagram showing a hand-off that does not exist looks exactly like a diagram showing one that does."
  - "Placed and front-mattered to this repository's doc conventions and reachable from `docs/INDEX.md` after the doc-index build phase; mermaid, per the existing architecture-diagram convention."
