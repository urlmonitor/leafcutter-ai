test_spec:
  - name: test_escalation_message_states_the_reason_from_the_latest_trail_entry
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "Drives a real escalation from a real AC file whose latest trail entry records a missing-dependency failure; asserts the emitted payload's blocker_summary conveys that reason rather than a generic halt string."
  - name: test_escalation_message_names_the_requirement_it_stopped_on
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "Escalates from a bundle of three requirements where only one is blocked; asserts the payload names that AC id and not the container."
  - name: test_missing_reason_produces_an_explicit_missing_reason_message
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "Escalates from a real AC whose latest entry carries no reason text; asserts the payload says the reason is missing, still names the requirement, and is not the empty string -- the exact output an empty-string default would produce."
  - name: test_no_emit_path_can_produce_a_blank_summary
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "Exercises every escalation entry point in the module against reason-present, reason-empty and reason-null trails; asserts none of them emits a blank or whitespace-only blocker_summary."
  - name: test_an_over_long_reason_is_shortened_only_in_the_summary
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "Escalates from a trail entry whose reason exceeds the summary ceiling; asserts the payload is within the ceiling AND that the trail entry on disk still holds the full untruncated text."
test_rationale: "The degradation this AC prevents is invisible to every test that checks the payload builder in isolation. A direct-import test hands the builder a well-formed record with a populated reason and asserts the sentence comes out -- and it passes on the broken implementation, because the broken implementation reads the field correctly when the field is there. The defect only appears on the input the unit test never constructs: a latest entry whose reason is absent or null, where a one-line empty-string default yields a technically-successful escalation carrying nothing. Equally, a test that asserts the payload builder REFERENCES the trail field is a grep test and passes on a reference whose result is discarded. So each test drives a real escalation end to end from a real on-disk requirement, and the reason-present and reason-missing cases are asserted in the same run -- because the two messages must be DIFFERENT, and neither assertion alone can show that. The bundle test exists for the same reason: a payload naming the container passes any assertion about the summary text while being unactionable, and only a multi-requirement fixture distinguishes it."
