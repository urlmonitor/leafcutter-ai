      standing rules the mutation proof implements at workflow level.
  - path: templates/workflows-js/quick-fix.js
    relationship: implements
    status: exists
    relevance: >-
      Phase 4. The green verdict is gated on strict_command_run exactly as the
      red phase is; the mutation proof is a separate step whose three booleans
      must all hold before Phase 5 runs.
assigned_agent: workflow-architect
estimated_complexity: M
it_requirements:
  - "Must operate at depth 0 per ADR-006 — phase agents dispatched at depth 1 via the Agent tool"
  - "Requires Claude Code >= 2.1.154 for JS workflow script support"
  - "Must handle errors gracefully per the project error handling policy"
  - "Must reuse the same test file path from the red phase — no re-discovery"
  - >-
    Must apply the same strict-enforcement verification as the red phase: read
    back the command the runner ran and reject the verdict when the strict
    prefix is absent. A default run cannot distinguish a real pass from a
    downgraded failure on a not-yet-done AC, so an unqualified green is not a
    green.
  - "Must halt the workflow (not just warn) if the fix does not resolve the failing test"
  - >-
    Must run the mutation proof as a distinct gate after the green verdict, not
    as an optional extra, and must report all three of its outcomes separately
    (red without the fix, green with the fix restored, fix actually restored)
    so a partial completion cannot read as a pass.
  - >-
    Must treat a failure to restore the fix as its own halt with recovery
    instructions. Leaving the fix reverted after a proof step is a worse
    outcome than never running the proof.
delivers_to:
  agent: workflow-architect
  contract: "Green-phase and mutation-proof result: { passed: boolean, strict_command_run: string } from the strict green run, plus { red_without_fix: boolean, green_with_fix_restored: boolean, fix_restored: boolean } from the mutation proof. The commit phase proceeds only when passed, red_without_fix, green_with_fix_restored and fix_restored are all true."
expects_from:
  ac_id: BP-600c-2
  contract: "Red-phase result containing test_file path to reuse for green-phase verification"
origin_agent: business-analyst-v3
created: 2026-06-05
amended_by:
  - reason: behaviour-change-restatement
    by: business-analyst
    at: '2026-08-24'
    note: >-
      Two changes. First, the same strict-enforcement correction applied to
      BP-600c-2: "the test-runner reports all tests PASSED" was accepted
      unqualified, and an unqualified pass is exactly what the xfail downgrade
      manufactures for a not-yet-done AC. The workflow now rejects a green
      verdict whose reported command lacks the strict prefix. Second, and
      larger, the mutation proof was entirely absent from this record. It is
      not an optional hardening — BP-600d-3 now names it as the precondition
      for the commit phase, so without it stated here that record expected a
      contract this one did not describe. The delivers_to contract was
      rewritten to the shape actually produced and actually consumed: the old
      { test_file, all_passed, failures[] } was neither. The verbatim halt
      string was replaced with a description of what the halt must convey, for
      the same reason as on BP-600c-2 — the quoted text never matched the
      emitted string. Title amended. work_status left done.
