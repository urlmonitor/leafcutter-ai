title: "Retry cap on test-failure rework loop prevents infinite cycling"
component: build-orchestration
level: L3
status: superseded_by
req_status: active
work_status: todo
criteria: |
  Given python-coder has been re-dispatched twice after test-runner failures
    (the maximum retry count for test-failure rework is 2 attempts),
  When test-runner fails for the third time after the second rework attempt,
  Then ticket-supervisor does NOT re-dispatch python-coder again
  And it escalates the ticket to blocker status
  And the escalation payload includes:
    - blocker_summary: "Test failures persist after 2 rework attempts"
    - failing_tests: [list of test names that still fail]
    - rework_history: [timestamps and outcomes of each attempt]
  And the ticket's status is set to "blocked"
  And no further agents in the chain are dispatched

  Given the retry cap is configurable in the building-epics skill
    (default: 2 rework attempts),
  When the cap is reached,
  Then the escalation message states the configured cap value:
    "Retry cap reached (2 of 2 attempts exhausted)"
