  notes:
    - "The kebab-to-graph-id mapping must be obtained from a side-effect-free source (parse docs/components.json or import a plain data module) — the migration-map loader (_load_migration_map, ~line 194) must stop exec-ing the sibling scripts/migrate_component_vocab.py at import time."
    - "Importing the generator (or its mapping source) must NOT reconfigure global logging: no logging.basicConfig or equivalent root-logger reconfiguration may run as an import side effect."
    - "A program importing the generator must retain its pre-existing root logging configuration (handlers and level unchanged by the import)."
    - "Import of the generator must not raise on a sibling-script error (no exec-at-import coupling to a script that can fail)."
test_spec:
  - name: test_import_does_not_call_logging_basicconfig
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "Importing generate_ticket_from_ac does not call logging.basicConfig / does not mutate the root logger's handlers or level."
  - name: test_import_preserves_preexisting_root_logging_config
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A root logger configured before the import keeps its handlers and level after importing the generator."
  - name: test_mapping_read_from_side_effect_free_source
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "The kebab-to-graph-id mapping is obtained by parsing components.json / a plain data module, not by exec-ing the sibling migrate_component_vocab.py script."
