estimated_complexity: S
it_requirements:
  - "THE NAMED ANTI-PATTERN. There must be no branch anywhere in the shared source or in any consuming check of the form 'if the narrowed set is empty, use the staged diff'. An empty authored change set is a value, not a signal to widen. This is the single load-bearing constraint of this AC and it is the one that reads like defensive programming to a reviewer, so state it in the implementation as a comment tied to this AC id."
  - "EMPTY MUST BE AN EXPLICIT STATE, NOT AN ABSENCE. The shared source must return an explicitly represented empty result that consumers can distinguish from 'no derivation was made'. Two Python falsy values that both mean 'nothing here' will collapse under the first refactor and reinstate the widening."
  - "REUSE GE-120a-1'S OUTPUT VOCABULARY FOR THE DISTINCTION. Do not define a second vocabulary for reader-facing outcomes. If a new token is needed to say 'nothing of the author's to inspect', add it to GE-120a-1's vocabulary and record that decision on this AC rather than inventing a parallel one here — the AC notes make this an explicit instruction, not an option."
  - "EMPTY IS A PASS, NOT A SKIP. Exit status must be success and the commit must proceed. Reporting the empty case as a skip re-reads as 'this check did not run', which is precisely the GE-120a false negative this L1 must not trade itself for."
  - "TEMPLATE/DEPLOYED PARITY (ADR-001): verify in the deployed layout, not only the source tree. Run build.py and execute the deployed check — a clean auto-merge is the commonest shape of the observed case and it must be exercised where the commit path actually runs."
test_spec:
  - name: test_ge120e1i_clean_automerge_with_no_authored_content_is_not_blocked
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "check_contract_shrinking, run as a process on a merge with zero authored content and carried-in test deletions staged, exits clean."
  - name: test_ge120e1i_empty_change_set_does_not_fall_back_to_the_staged_tree
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Carried-in content known to trip the check is present in the staged tree and is named nowhere in the check's output — the widening fallback is absent."
  - name: test_ge120e1i_empty_outcome_is_distinguishable_from_could_not_check
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The 'nothing of the author's to inspect' outcome and GE-120a-1's could-not-check outcome produce different reader-facing text in the same run."
test_rationale: "The fixture is the whole point and it is one no other test in this tree has: a staged tree with ZERO authored content. Every other GE-120e test carries authored content, so all of them stay green against an implementation that widens an empty change set back to the staged diff — the exact defect reinstated, aimed at the commonest shape of the observed case. That can only be caught by executing the check as a process against a repository standing in that state and observing that content known to trip the check goes unmentioned; a direct-import test of the shared source proves the helper returns empty, not that the check declined to widen it."
