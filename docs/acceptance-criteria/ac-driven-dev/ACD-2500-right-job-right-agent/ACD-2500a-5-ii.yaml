criteria: |
  Given ADR-072 section 2 names "the rule check, run with --before-ref HEAD" as the
    deterministic backstop for fields the test designer must not touch,
    and its Consequences state that byte-identity of those fields is "not by a dedicated
    rule family" and that "The M-5 bypass stays open",
    and the protected-field family (ACD-2500a-2-vi) and approval through the store's one
    approval step (ACD-300c-4) are both done,
  When ADR-072 is amended,
  Then section 2's backstop sentence names the protected-field rule family,
  And each of the two Consequences bullets carries a dated amendment note naming the record
    that closed it, ACD-2500a-2-vi and ACD-300c-4 respectively,
  And the original sentences stay readable beneath the notes,
  And section 4 gains a dated amendment sentence stating that /plan-feature commits the
    test-design output before the IT PO's hand-back round, so the hand-back rule check's
    before-state is the post-design batch (ACD-2500a-2-ix), with section 4's original text
    unchanged,
  And ADR-072's status and its decisions are otherwise unchanged, and it links ADR-075.
