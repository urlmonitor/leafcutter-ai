it_requirements:
- The holder check must run, and its verdict be final, before the first destructive step of clearing (hub-branch
  deletion, repository removal or folder deletion); no code path may answer PROCESS_HOLDS_FILES after
  any deletion has started.
- A program counts as holding the workspace when its current folder is the workspace or any folder inside
  it, even with no file open; the comparison is on resolved paths, case-insensitive on Windows, and must
  not match a sibling folder that only shares a name prefix.
- For a holder whose only hold is its current folder, clearing must refuse and must not stop or terminate
  that program.
- The refusal names each holder by process identifier and program name only, never its command line or
  environment (no secret leaks).
- The maker's own process and its ancestors are never counted as holders.
- The program check fails closed. When the sweep_processes module is missing, fails to load, or fails while
  running, clearing is refused before any destructive step, and the refusal states that the program check
  is unavailable. Warning and carrying on is no longer allowed.
- Must log each refusal at warning level with the workspace path and the holder process identifiers.
- Edit the template source under templates/scripts/ (and the package-source sweep module under scripts/worktree/),
  never a deployed build output (ADR-001); the change must reach the deployed maker through the normal
  build.
- Must keep the existing answer envelope and existing answer codes backward compatible; any new answer
  field or code must be additive.
- Must stay within the project's file-size and complexity limits for the maker modules; if the remove
  module would exceed them, the new logic moves into a sibling maker module rather than raising a limit.
- Every refusal must leave the workspace folder, its repository and its workspace record unmodified (no
  write, rename or delete of any item), consistent with the standing never-delete-unsent-work rule.
test_intent:
- clause: each request is refused, and the refusal names the running shell by its process identifier and
    program name and states that it is working inside the workspace
  needs_test: true
  reason: Detecting a current-folder-only holder and naming it is computed behaviour that the observed
    defect shows can fail.
- clause: for each workspace its repository, its workspace record and every one of its files are identical
    before and after the refused request
  needs_test: true
  reason: The defect deleted the repository before refusing, so the order of the check against deletion
    must be proven.
- clause: no fetch, push or deletion reached the shared project for either workspace
  needs_test: true
  reason: A refusal that still deletes the hub branch would lose shared state, which a test catches.
- clause: after both shells have exited, clearing "ticket/alpha" again is answered cleared and nothing
    of it remains at its location
  needs_test: true
  reason: The retry after the holders exit proves the refusal left a clearable workspace and no stale
    lock.
- clause: the request is refused, and the refusal states that the program check is unavailable
  needs_test: true
  reason: The old code warned and went ahead when the program check was missing, so failing closed is
    new behaviour a test must pin.
- clause: the repository, the workspace record and every one of the files of "ticket/gamma" are identical
    before and after the refused request
  needs_test: true
  reason: A refusal issued after any deletion step had started would lose the workspace, which a before-and-after
    comparison catches.
- clause: no fetch, push or deletion reached the shared project for "ticket/gamma"
  needs_test: true
  reason: Deleting the hub branch before the unavailable check refuses would change shared state, which
    a test can observe.
