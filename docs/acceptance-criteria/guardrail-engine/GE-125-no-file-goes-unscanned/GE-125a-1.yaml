notes: |
  THIS IS THE ARM THAT REMOVES THE MEASURED DEFECT. Its four reused-name paths
  are the four measured-exempt-but-not-intended rows of KI-SEC-001's second
  table, and src/app.py is that table's reported row, carried over unchanged so
  the pair the L1 demands is visible inside one criterion rather than only across
  siblings. The fifth file, the written file at a reused-name path, is not in the
  measured table; it is added because KI-SEC-001 states the exposure is the same
  "for .py as readily as for .md", and without it a change that anchors only for
  executable files passes every measured row.

  ON ITS OWN THIS CRITERION IS SATISFIABLE BY DELETING THE ENTITLEMENT
  ENTIRELY, which would reintroduce the false positives GE-123d exists to remove
  and would be indistinguishable from the change actually wanted. GE-125a-2 is
  the control that forbids that reading and is not optional hardening — neither
  record is evidence of anything without the other. Do not close this one while
  GE-125a-2 is unfinished.

  BOUNDARY WITH GE-125b, held deliberately. This criterion is about WHERE the
  entitlement reaches. Every file it names sits at a location the project did NOT
  choose, so file kind cannot be the discriminator in any of these scenarios and
  nothing here anticipates or pre-empts what a chosen location covers. The .md
  scenario is here to stop an executable-only anchoring, not to make a claim
  about prose.

  FOR THE IT PO. Two constraints this record cannot carry itself but that decide
  whether a green suite means anything. First, the token must be assembled at
  runtime from fragments rather than written as a source literal, as the existing
  suppression test module in this repository already does deliberately — a
  credential-shaped literal in a test file either trips the check or needs a
  suppression, and a suppression there would be a real blind spot in the file
  most likely to accumulate credential-shaped data. Second, per this repository's
  standing rule for gate and hook criteria, every scenario must EXECUTE the
  check; a test that greps the check's source for the four names passes on dead
  code and cannot tell an anchored comparison from an unanchored one.

  MEASURED BASELINE, carried at the confidence KI-SEC-001 records it: all four
  reused-name paths are EXEMPT today and src/app.py is reported, run through the
  real location logic with a 5.17-entropy token. Every arm above except the
  src/app.py arm is red today. The src/app.py arm is green on arrival and is a
  regression guard, not evidence the change landed — read it that way.
