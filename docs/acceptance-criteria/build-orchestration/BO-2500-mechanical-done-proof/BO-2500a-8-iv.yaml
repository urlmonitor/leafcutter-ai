assigned_agent: it-po
estimated_complexity: L
it_requirements:
  - 'Measure the population, never copy it: at the start re-run the inclusion rule (active
    records, test_required false, test_rationale empty after strip, work_status todo or in_progress)
    and report the count, date and rule. The 99 of 2026-10-25 is the expected figure, not
    an input.'
  - 'Write only the test_rationale key into each approved record: a targeted insert, never
    a load-and-dump rewrite (criteria bytes, key order and comments unchanged). A second run
    over an already-backfilled record writes nothing.'
  - Nothing is written before the user approves the batch that holds it. A rejected or unwritable
    reason goes to the decision list with its finding, never a guessed value.
  - 'Before each batch is shown, check uniqueness with BO-2500a-8-v''s normalisation function
    (the same one check-ac-schema applies): each proposed reason differs from every other
    proposed and every already-stored test-free reason, so no approved reason is later refused
    at commit.'
  - Each written record is committed through check-ac-schema, so BO-2500a-8-i's refusal is
    the gate every backfilled record passes. Build after BO-2500a-8-i.
  - Records with work_status done are never written by this run (they belong to TQ-400d and
    BO-2500f-4-ii).
  - 'it-po is not a ticket-phase agent (config/agent_registry.json: is_ticket_phase false),
    so /build-ac cannot dispatch this record. Run it as a planning session with the user,
    batch by batch.'
test_required: false
test_rationale: 'The deliverable is about 99 hand-written sentences in record files, one per
  record, each approved by the user; whether a sentence honestly says why no test can observe
  that record is a judgement no test can make. What verifies it: the user''s per-batch approval,
  recorded in the run report with each batch''s member ids; BO-2500a-8-i''s check-ac-schema
  refusal, which every backfilled record passes when it is committed; and the run''s closing
  count (reasons written plus records listed for decision equals the measured population),
  stated with its measurement date and inclusion rule.'
delivers_to: null
expects_from:
  - ac_id: BO-2500a-8-i
    contract: "The authoring-time refusal that makes each backfilled record pass the commit-time record check when it is next changed."
  - ac_id: BO-2500a-8-v
    contract: The normalisation function and the duplicate refusal; each proposed reason is
      checked with it before a batch is shown.
