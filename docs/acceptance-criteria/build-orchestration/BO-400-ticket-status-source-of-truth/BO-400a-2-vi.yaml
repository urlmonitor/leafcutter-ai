notes: |
  Requested by BrainCandy on 2026-10-14 ("put architect to work") as the follow-up
  to BO-400a-2-v, the residual named in KI-BO-20261009's fix direction: "Stop agent
  templates from writing level-2 headings inside ## Comments. Make architect-review's
  ## Escalation a bold label or a #### heading." A bold label is used rather than
  `####`, because a heading parser that matches `^###` without requiring a space
  could still read `####` as a sign-off heading.
