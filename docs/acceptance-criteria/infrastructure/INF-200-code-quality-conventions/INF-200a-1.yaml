title: "check_no_print pre-commit hook blocks print() outside CLI entry points"
component: infrastructure
level: L2
status: active
work_status: todo
criteria: |
  Given a .py file is staged for commit in the leafcutter-ai repo,
  When the file contains a print() call that is NOT inside:
    - a function named main(), OR
    - an `if __name__ == "__main__":` guard block,
  Then the check_no_print pre-commit hook exits non-zero,
  And the error message includes the file path, line number, and column,
  And the error message suggests using `logger.debug(...)` instead.
