notes: |
  Guard #4 of BP-1100f. Surface for IT-PO to pin: the workflow-js test harness /
  dispatch interceptor (the agent() test double used by workflow unit tests). This is
  the harness-level counterpart to BP-1100f-1: BP-1100f-1 is a pr-review of a PROPOSED
  dispatch; this AC makes the test double itself refuse to silently accept an
  instruction-less first argument, so an instruction-less dispatch is mechanically
  detectable in tests rather than passing unnoticed. Origin RCA Failure #2. Portable
  per ADR-001.
