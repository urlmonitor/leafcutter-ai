id: BP-1100g-5-i
components:
  - build_pipeline
  - testing_quality
  - ticket_lifecycle
title: "A missing, reasonless, or contradictory seam answer is reported, while a reasoned no is not"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given four hand-off records for four pieces of work:
      record W, which answers the seam rule with "no seam applies" and gives the
        reason no seam applies,
      record X, which answers "no seam applies" and gives no reason,
      record Y, which contains no answer to the seam rule at all,
      and record Z, which answers the seam rule twice for the same piece of work
        with two different answers,
  When the four records are read,
  Then record W is not reported, because a reasoned negative is a valid answer,
    And records X, Y and Z are each reported as a shortfall, and each report says
      which of the three it is — reasonless, absent, or answered more than once,
    And the number of answers found for each piece of work is established from the
      records the hand-off actually produced, not from whether the writing side
      was observed to have been asked for one,
    And a run that stops before a piece of work is handed on leaves that work with
      no record at all, which is not reported as a reasonless or contradictory
      answer.
