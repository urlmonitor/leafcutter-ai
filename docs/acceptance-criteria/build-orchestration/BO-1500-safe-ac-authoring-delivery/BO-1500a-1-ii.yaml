notes: |
  Authored by /quick-fix. Root cause: child processes started during bootstrap (install_pre_commit_shims.py, which prints '[<result>] <stage>' per hook stage, and build output) inherit the parent's stdout, which is the script's machine-readable JSON channel; their progress lines must go to stderr so stdout carries only the JSON payload.

  Placement: BO-1500a is at its cap of 5 L2 children, and this is a technical constraint on
  BO-1500a-1's existing behaviour (the authoring worktree is created and reported), so it is an L3
  under BO-1500a-1 rather than a new L2.

  Scope: git worktree add on the fresh-branch path also inherits stdout. It is listed in
  it_requirements because the first-run outcome cannot hold without it: its tracking and HEAD lines
  were recorded as a leak in unit_tests/ac_driven_dev/test_acd_2100a_2_ii.py (_parse_json_payload)
  and as finding F4 in BO-4300c-2. BO-4300c-2 states the same stdout-only rule for the planned
  workspace maker; this record covers the current create-ac-worktree command, which /plan-feature
  runs today.

  Follow-on, out of scope here: once this lands, the last-line tolerance in
  test_acd_2100a_2_ii._parse_json_payload no longer serves a purpose and could be tightened.
