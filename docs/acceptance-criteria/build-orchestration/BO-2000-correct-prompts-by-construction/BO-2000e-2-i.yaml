work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a code ticket whose Test Requirements section is absent,
    and the test-writer phase has already run earlier in the same drive for that ticket
    and reported the test files it wrote,
  When the supervisor reaches the point where it would spawn the coder phase,
  Then it spawns the coder,
  And the ticket is not held back for missing tests,
  So a ticket whose tests were derived from its acceptance criteria instead of from a
    Test Requirements section is still buildable.
