change_target: code
risk_surface: contract_boundary
notes: |
  Produced for the `how-to` entry in GE-124b's `documentation_triggers`. The
  reference-doc entry is GE-124b-5 — deliberately a separate AC, because the
  two documents have different readers: this one is read once by an author
  mid-task, GE-124b-5 is read by the four consumers of the attribute contract.

  The "when not to pin" clauses carry weight the how-to would otherwise leak:
  an author told only how to add a pin will add one everywhere, and a pin on
  every element makes the marker meaningless.

  IT-PO NOTE (2026-08-25). The five markup examples are executable, but only
  the React shapes have a real application in this repo to be checked against
  (leafcutter-web). The .vue / .svelte / .html examples are exercised against
  the shared pin reader, which is framework-agnostic — that is sufficient for
  this AC and is the honest limit of what can be verified today.
