id: GE-125a-2-i
components:
  - security_scanner
  - commit_guardian
title: "The top of the project is the working copy being committed from, and an undetermined top entitles nothing"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  FIXTURE ROOTS USED BY THE SCENARIOS BELOW. Each scenario builds a throwaway
  workspace directory, written <ws>, that is a directory of its own and contains
  no part of this repository, and inside it a secondary working copy of a project
  at <ws>/worktrees/copy — that copy is the project whose commit is being made
  and is written <root>. No fixture is written anywhere inside this repository's
  own working tree: a fixture under this repository's tickets/,
  docs/retrospectives/, docs/acceptance-criteria/ or templates/skills/ would take
  its verdict from this repository's reduced-scrutiny list rather than from the
  scenario's, and a scenario about which top of the project is used would then be
  measuring a third one. Every file below holds one line with the same
  thirty-two-character opaque token of measured Shannon entropy 5.17, no
  suppression entries are in force, and every scenario is exercised the way a
  commit exercises the check — the files are staged in <root> and the check runs
  over that staged set as part of a commit made from <root>.

  Given <root> contains docs/acceptance-criteria/guardrail-engine/PROJECT_CONTEXT.md
    and tickets/00_inbox/note.md, both written files of an admitted prose kind,
  When they are staged and the check runs over the staged set,
  Then the token is not reported for either,
  Because both sit at locations this project chose, measured from the top of the
    working copy the commit is being made from — and the enclosing workspace
    above that copy is not the top of anything the project chose. Were the
    enclosing workspace used instead, both files would sit below a segment named
    worktrees, neither would be a chosen location, and every acceptance-criterion
    file and every ticket in every secondary working copy would begin reporting a
    credential.

  Given the same <root> also contains src/vendor/tickets/handler.py,
  When it is staged in the same run as the two files above,
  Then the token is reported for it while the two files above stay unreported,
  Because the anchor being the working copy is not the same as everything in a
    secondary working copy being entitled; the reused-name folder inside that
    copy loses the entitlement exactly as it does anywhere else.

  Given the same three files and the same staged set,
  When the check is run again with the current directory set to <root>/src rather
    than to the top of the working copy,
  Then all three files receive the same verdicts as in the two scenarios above,
  Because where the author happened to be standing when they committed is not the
    top of the project, and a verdict that moves with the current directory means
    the same commit is checked differently depending on which folder it was made
    from.

  Given a <root> in which the top of the project cannot be determined at all,
  And <root> contains tickets/00_inbox/note.md holding the same token,
  When it is staged and the check runs over the staged set,
  Then the token is reported,
  Because with no top to measure from, no location can be shown to be one the
    project chose, and the only safe direction is to report. Treating an
    undetermined top as though every location qualified would hand the
    entitlement to the whole working copy in exactly the circumstances nobody is
    watching.
