id: INF-400c-4
components:
  - infrastructure
  - knowledge_system
title: "Emitters and the harvester read one knowledge-emission sink per install, as an absolute path fixed at build time, from one declared location"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-400c.yaml"
criteria: |
  Given the side that emits a knowledge record and the side that reads
    knowledge records disagree about which file the record lands in: the four
    shipped emit surfaces name debugging/logs/agent_telemetry.jsonl, and the
    reader's own default names debugging/logs/knowledge_emissions.jsonl, a
    file that has never existed in this repository or in any install,
  And underneath that disagreement sits a second one that survives settling it:
    both of those names are bare relative names, so each side reaches whichever
    file lies under the directory its process happened to start in. Four of the
    five ways this package completes work start their processes inside an
    isolated working directory that is removed once the work has been merged,
    so a name resolved that way reaches a file that is reclaimed with the
    directory. Agreeing on a name and leaving the resolution alone leaves both
    sides agreeing, per working directory, about a different file each time,
  And exactly two settlements would end the first disagreement -- move the
    reader onto the operational stream the emitters already write to, or move
    the emitters onto a knowledge-only stream the reader keeps to itself,
  When the sink is settled,
  Then the sink is declared exactly once, as an ABSOLUTE path, in a single
    named location that both the emitting side and the reading side read,
  And that path is fixed when the package is built into a project, from the
    project root the build was pointed at, and is recorded in the configuration
    that build deploys: nothing discovers it at run time, nothing walks upward
    from wherever a process is standing, and no process finishes the resolution
    for itself,
  And because it is absolute and written down once, every process of that
    install reaches the same file wherever it was started: two reads of the
    declaration made from two different current directories -- one from inside
    an isolated working directory of the project, one from the project root --
    yield the identical path, and that path lies outside every isolated working
    directory,
  And a record appended at that path from inside an isolated working directory
    is still readable there, unchanged, after that working directory has been
    removed,
  And the reader's default -- the path it uses when no sink is supplied on the
    command line -- is that declared value, and not an independently written
    literal,
  And two units of work running at the same time in that install append to the
    one file without a record being lost, truncated, or interleaved with
    another: the sink is shared, so simultaneous emission is the ordinary case
    and not an exceptional one. What two simultaneous ROUTING STEPS over that
    one file must do is INF-700a-5-iii's; this clause covers the appending side
    only,
  And the declared value is a knowledge-only stream: a tree in which the
    declaration resolves to the file that also carries pre-drive writability
    probes and supervisor telemetry fails this criterion, so of the two
    settlements the one required here is that the EMITTERS move and the reader
    stays where it is,
  And a check exists that resolves both sides and fails when they differ,
    naming both resolved paths and which side produced each,
  And that same check fails when the declared value is the operational
    telemetry stream, so an implementation that ends the disagreement by
    pointing the reader at the shared file is rejected rather than accepted,
  And that same check fails when the declared value is not an absolute path, or
    when reading the declaration from two different current directories yields
    two different paths, naming both values and the directory each was read
    from, so a settlement that changes which name is written down and leaves
    each process to finish the resolution against its own directory is rejected
    rather than accepted,
  And all three of that check's failure branches fire today: the two sides
    resolve to different paths, the path the emitting side names is the
    operational telemetry stream, and each side's shipped default is a bare
    relative name — not absolute, and reaching a different file according to
    where its process was started.
