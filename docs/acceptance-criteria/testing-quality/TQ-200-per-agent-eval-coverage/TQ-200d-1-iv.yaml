notes: |
  Work item 1 of the 2026-11-02 re-run fixes. Scorer: scripts/evals/produced_tests_scoring.py
  (_count_side, _count_kind, counts_rows_and_non_null, asserts_known_seeded_value). The
  sql-test-writer twin (_equality_statements in sql_test_writer_eval/evidence_kinds.py)
  already reads assertEqual and a non-literal right side; reuse is an IT-PO call.

  BA additions beyond the request (unasked-for, keep): the self-comparison case
  (len(x) == len(x)) and the ">= 0" bound in unittest form are the false-green
  boundaries a widened check could let through; the seed-only-in-assertions rule keeps
  "numbers inside assertions are not seeds" true for assertion calls.

  Kept outputs are local to the run machine (session scratchpad kept_runs/), not
  committed; the implementer copies the named files into recorded probe fixtures.
  The Completion-Report-format omission noted in the KI is an agent-side weakness and
  out of scope here.
