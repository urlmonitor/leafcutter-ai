id: ACD-1300a-1
title: Effective feature urgency includes its remaining work and ancestors
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given one approved feature has low urgency, a high-urgency L0 ancestor and two low-urgency remaining leaves
  And another approved feature has low-urgency ancestors and one critical remaining required leaf
  When the background worker computes their effective priorities
  Then their effective priorities are high and critical respectively
  And the strongest urgency among all remaining required leaves and every ancestor on their canonical L0/L1/L2 paths determines each result
  And a low-priority child cannot lower the urgency inherited from that group
  And a high-priority L2 parent with low-priority L3 leaves raises the feature to high even when its L0 and L1 are low
