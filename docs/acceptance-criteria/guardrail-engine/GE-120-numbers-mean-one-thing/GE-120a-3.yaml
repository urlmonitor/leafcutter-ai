notes: |
  Satisfies GE-120a's documentation_triggers: [reference-doc].

  The L1's justification for the trigger is precise and worth preserving: "a rule that four
  namespaces must obey has to live somewhere a future author will find it". Today it lives in
  four places or nowhere — the acceptance-criterion format in docs/reference/ac-schema.md, the
  decision-number rule in a generated index README, the diagram rule only in a script docstring,
  and the work-item rule nowhere at all.

  ONE DOCUMENT, TWO CONTRIBUTING ACs. GE-120b-4 adds the enrolment table (which locations are
  expected to carry a number and which are exempt) to this SAME document as its own section,
  rather than creating a competing numbering document. The final clause above exists so the two
  ACs cannot both write the same content.

  IT PO NOTE (2026-08-17): the document is docs/reference/artifact-numbering.md, and it is three
  sections written by three ACs — this one, GE-120b-4 and GE-120d-5. A partial pre-existing
  authority already exists for one namespace (docs/conventions/adr-numbering.md); it is
  re-pointed at the new document, not extended, so the four-namespace rule has exactly one home.
