criteria: |
  One inventory covering everything the project produces, not just code.

  Requirements, tickets, epics, tests, code, decision records, diagrams and the
  rest of the written material, changelogs, agents, skills, hooks, components and
  retrospectives are all counted in the same place, under one shared idea of what
  counts as arriving and what counts as being worked off. A kind of thing that did
  not exist last month can join the count without the count being rebuilt.
