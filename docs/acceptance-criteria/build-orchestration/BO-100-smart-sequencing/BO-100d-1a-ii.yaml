id: BO-100d-1a-ii
components:
  - build_orchestration
readiness: approved
priority: high
title: "Only a genuine write failure after remediation hard-blocks the drive"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given /build-feature is invoked for an epic with at least one ready ticket,
  And the install's telemetry location query has printed an absolute stream path
    (for example /home/dev/proj/debugging/logs/agent_telemetry.jsonl),
  And the pre-drive feedback-sink reachability probe has already attempted its
    directory-creation remediation for that path's log directory,
  When a retried append to the printed path still fails for a reason other than
    the directory being absent (for example the path exists but is not writable,
    or is a directory, or the filesystem is read-only),
  Then the drive is hard-blocked at the pre-dispatch stage,
  And no ticket-supervisor is dispatched,
  And the operator message names the absolute path the location query printed
    and describes the genuine write failure that remediation could not resolve.
depends_on: [BO-100d-1a]
