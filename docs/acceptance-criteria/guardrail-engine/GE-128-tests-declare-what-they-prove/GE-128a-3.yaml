covered_by: []
implemented_by: []
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_declaring_one_existing_test_lowers_the_count_and_is_allowed
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Scenario 1. A temp git repo commits a file with 40 tests, all undeclared; the staged change adds a declaration to one. The real hook CLI (templates/scripts/commit_guardian/check_test_ac_tags.py) in error mode exits 0 and lists none of the 39 remaining undeclared tests as a violation."
    must_catch:
      - "flat rule that refuses any file still holding an undeclared test"
  - name: test_declared_test_added_alongside_the_backlog_is_allowed
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Scenario 2. Same 40/40 file; the staged change adds one new test that carries a declaration, leaving 40 undeclared. The real hook in error mode exits 0."
    must_catch:
      - "refuse when the count is unchanged (strict decrease required)"
  - name: test_deleting_an_undeclared_test_is_allowed
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Scenario 3. Same file; the staged change deletes one undeclared test, leaving 39. The real hook in error mode exits 0."
  - name: test_verdict_uses_only_the_files_own_before_and_after_counts
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "Scenario 4. In one process the real hook judges, in separate temp repos: a file with 500 undeclared tests edited without changing the count (allowed, so no maximum applies), and a file going 0 -> 1 undeclared with a previous version present (refused, so no percentage or 'mostly declared' target excuses growth). Both verdicts must hold together."
    must_catch:
      - "apply a project-wide or per-file maximum of undeclared tests"
      - "apply a percentage target instead of the before/after direction"
test_rationale: >-
  The allow arm is what stops the ratchet from becoming a freeze, and an
  allow-everything hook would pass all three positive scenarios, so each test runs
  the real hook over a real temp repository whose committed version supplies the
  previous count, and the discrimination test pairs a huge unchanged backlog
  (must be allowed) with a tiny increase (must be refused) so that neither a cap
  nor a percentage target can satisfy both. The 40-test fixture size follows the
  criteria; the 500 and 0 -> 1 files exist only to separate direction from
  magnitude.
