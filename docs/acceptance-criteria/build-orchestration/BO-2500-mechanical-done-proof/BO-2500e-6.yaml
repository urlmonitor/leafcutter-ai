id: BO-2500e-6
components:
  - build_orchestration
  - commit_guardian
title: "The required CI done-proof gate covers JS-covered ACs"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a pull request is opened or updated,
  When the required CI proof-of-done gate runs against a fresh clean checkout of the branch,
  Then its verdict includes JS-covered ACs — it runs the JS test runner and applies the same
    done-proof engine used for Python-covered ACs,
  And the gate's pass/fail is derived from committed branch state only and reflects both JS- and
    Python-covered ACs,
  So the required final gate cannot pass a branch whose front-end proof-of-done is failing.
