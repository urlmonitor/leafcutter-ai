id: BO-4500a-4
title: "Every call of the shared step ends in one machine-readable answer with one of four outcomes, readable by any orchestrator"
component: build-orchestration
components:
  - build_orchestration
  - git_vcs_operations
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: contract_boundary
created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500a.yaml"
criteria: |
  Given four calls of the shared commit step that end, in turn, in a recorded commit, in no
    change among the named files, in a refusal, and in a failed check,
  When each call finishes,
  Then its whole standard output is exactly one JSON object and nothing else,
  And that object always carries the keys status, sha, paths, hook_name and failing_files,
  And status is respectively committed, nothing_to_commit, refused and hook_failed,
  And sha holds the new commit's id only when status is committed and is null otherwise,
  And hook_name and failing_files are filled only when status is hook_failed, and are null and
    an empty list otherwise,
  And a refused answer carries a reason in plain words.

  Given the step is started as a plain command by a test harness that is not a workflow
    engine, with the files to commit and the message file given as arguments,
  When it finishes,
  Then its answer has exactly the same shape and values as when a workflow route calls it,
  And reaching the step needs nothing but the ability to run a command in the workspace and
    read its standard output.
depends_on: [BO-4500a, BO-4500a-1]
