title: "Content already sitting in the workspace before authoring began is never delivered"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500a.yaml
criteria: |
  Given an authoring run's workspace already holds around sixty changed files that nobody
    authored in this run, present from the moment the workspace was prepared and before any
    criterion was written,
  And the run then authors two acceptance criteria and the user approves both,
  When the run delivers,
  Then what is delivered contains those two criteria and nothing else,
  And none of the pre-existing changed files are part of what is delivered,
  And this holds regardless of how many pre-existing changed files there are,
  And the pre-existing changed files are left in the workspace exactly as they were.
depends_on:
