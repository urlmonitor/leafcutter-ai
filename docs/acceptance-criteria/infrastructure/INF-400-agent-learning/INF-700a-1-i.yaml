it_requirements:
  - "AGENT REASSIGNED FROM workflow-architect TO python-coder for the reason given on INF-700a-1: workflow-architect is is_ticket_phase false with null selection_criteria and cannot be dispatched as a ticket phase, and python-coder is the registry's declared owner of templates/workflows-js/ and of the pytest-over-Node-harness tests that cover it."
  - "COMPLEXITY RAISED M TO L. Five workflow files, a new declaration artefact, a new build-time guard with its own wiring and deploy-manifest entry, and five per-path behavioural tests. That is four-plus files and well past 200 lines. Sizing it M invites a single-file change that wires one path."
  - "THE COMPLETION PATHS TO ENUMERATE, as they stand at 2026-09-07: build-epic, build-ticket, fast-lane-ship, quick-fix and finalize-feature. build-feature is the user-facing entry point that resolves to one of the first two and is not itself a completion path. plan-feature and create-ticket produce specifications rather than completing built work — if they are excluded, they still have to appear on the exclusion list with that reason, because agents emit knowledge during AC authoring (the product-owner, business-analyst and it-po templates all carry an emission block) and an unlisted omission is indistinguishable from an oversight."
  - "PARTIAL WIRING IS THE PREDICTED FAILURE, and the exclusion list is what makes it visible. A change that wires the epic drive and leaves quick-fix alone would satisfy INF-700a-1 as written for the path it tested. The list must be a single artefact a reader can hold against the set of drivers, not a comment in each file."
  - "THE LAST CLAUSE NEEDS A MECHANISM, and choosing it is an IT PO call. The two shapes that work here are a test that enumerates the completion-path artefacts and asserts each is either wired or listed, or a commit-time check over the same set. Whichever is chosen must derive its list of paths from the artefacts rather than from a hand-maintained copy, or the guard goes stale the first time a path is added — which is the failure it exists to catch."
  - "PER-PATH BEHAVIOURAL COVERAGE, not one test times five names. Each path must be driven far enough that the destination file is asserted afterwards. Where a path cannot be run in the unit layer, the substitute is asserting the routing result is consumed in that path's guarded control flow — never asserting the call string appears in its source."
  - "THE MECHANISM THAT FAILS — IT PO decision on the clause the BA left to me. A BUILD-TIME GUARD INVOKED FROM build.py, with the same shape and the same abort semantics as the existing _check_command_reachability_guard (scripts/build.py, called before any write, aborts the build on a verdict). Not a commit hook and not a test alone. Reasons: build.py runs in CI ahead of pytest, so an unwired new path blocks the merge rather than producing a test failure someone can mark xfail; a commit hook only sees the files in that commit's index and would miss a path added in a commit that does not stage the guard's data; and this repository has a working, tested precedent for exactly this enumerate-the-artefacts-and-abort shape."
  - "THE GUARD IS ALSO TESTED THROUGH ITS OWN ENTRY POINT, in unit_tests/build_guards/ alongside test_command_reachability_guard.py, with a positive run and a must-block negative run. The guard is the thing that catches the next unwired path; a guard that cannot block is inert and a positive-path test cannot tell the difference."
  - "WHERE THE LIST LIVES — a new top-level section in config/guardrail_gates.yaml, carrying wired paths and excluded paths, each exclusion with a reason and the path whose routing step covers its emissions instead. That file is the deployed guardrail-policy SSOT the guard layer already reads, it ships through build.py so a consumer install sees the same list, and it is a single artefact a reader can hold against the set of drivers — which a comment in each workflow file is not. TRAP, documented in this repository's CLAUDE.md and previously shipped as a branch-invisible failure: unit_tests/commit_guardian/test_check_ac_schema.py asserts the non-policy top-level keys of guardrail_gates.yaml equal the change_target enum, so the new section name must be added to that test's _NON_CHANGE_TARGET_SECTIONS set IN THE SAME COMMIT."
  - "THE ENUMERATION DERIVES FROM THE ARTEFACTS; ONLY THE EXCLUSIONS ARE HAND-WRITTEN. The guard globs templates/workflows-js/*.js for the candidate set and checks each against the config's two lists. A path present in neither list is the failure. Do NOT let the candidate set itself come from the config — that is the hand-maintained copy the criteria forbid, and it goes stale the first time a path is added, which is the exact event the guard exists to catch."
  - "THE THREE NON-COMPLETION PATHS MUST STILL BE LISTED, WITH REASONS. build-feature.js is a user-facing entry point that resolves to build-epic or build-ticket and completes nothing itself. plan-feature.js and create-ticket.js produce specifications rather than completed built work — but agents emit knowledge during AC authoring (the product-owner, business-analyst and it-po templates all carry an emission block), so their exclusion must name which path's routing step picks those emissions up. An unlisted omission is indistinguishable from an oversight, which is the whole point of the list."
  - "THE GUARD AND ITS CONFIG MUST BE IN THE BUILD DEPLOY MANIFEST. A guard that build.py imports but that the deploy map does not carry raises ModuleNotFoundError from the deployed layout; once it is a required gate that crash blocks every merge. This repository shipped exactly that with done_proof.py. Verify by running the guard from a built temp target, not from the source tree."
  - "Must handle errors gracefully per the project error handling policy"
