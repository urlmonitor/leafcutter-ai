id: GE-130a-1
title: A shell command that clearly writes a code file the documentation guard watches is stopped the
  way the same edit is stopped
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the documentation guard's command coverage has been accepted by GE-130f-3 and is in its
    blocking stage (GE-130d-3),
  And a command issued from the session's shell that clearly writes a code file in a folder an
    architecture document of a level the guard blocks for describes: redirecting output into
    the file, editing the file in place with a stream editor, copying or moving another file
    onto it, or piping into a program told to write that file,
  And no documentation override in effect,
  When the command is issued,
  Then it is not carried out, and the refusal names the guard, the file and the architecture
    document, in the same wording the editing-path refusal uses,
  And each of the same command forms aimed at a code file in a folder no architecture document
    describes is carried out with no refusal, in the same run,
  And a command whose effect on such a file cannot be told before it runs -- running a script,
    a build step, or a program handed a list of files -- is not refused beforehand and is left
    to the after-the-fact check GE-130c-1 specifies.
depends_on:
- GE-130a
- GE-130f-1
- GE-130f-3
