notes: |
  THE REQUIRED FLOOR, parse side. This AC owns the shape of `declares` and
  nothing else: it does not decide which files are in scope (GE-124a-3), which
  comment syntax a given file type uses (GE-124a-2), or what happens when a
  declared id resolves to nothing (GE-124c-2).

  The list shape is deliberate — the PO note states a file may legitimately
  declare more than one criterion. The three-separator scenario exists because
  authors write all three forms and a reader that accepts only one produces a
  false "missing" verdict, which is the most corrosive failure this guardrail
  can have (it teaches authors the check is wrong).

  Mock-data invariant this satisfies: "FrontendComponent.declares == [] iff
  FrontendComponent.declaration_block == null" — the empty half is
  GE-124a-1-i, the non-empty half is here.

  IT-PO ENRICHMENT NOTE (2026-08-25). The reader is a NEW module; nothing in
  scripts/commit_guardian/ parses frontend comments today. It is named here
  rather than left to the implementer because GE-124c and GE-124e both consume
  it, and the whole tree's coherence depends on there being exactly one of it.
