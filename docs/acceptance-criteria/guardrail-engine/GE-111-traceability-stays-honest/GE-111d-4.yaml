criteria: |
  Given a developer faces a blocked commit and wants to reconcile the flagged link
  When the developer opens the reconciliation how-to guide
  Then the guide gives step-by-step instructions for the update route, including
    how to apply a suggested new location when one is offered
  And the guide gives step-by-step instructions for the confirm route, including
    how to record the durable confirmation and that it is tied to the current
    source version
  And the guide states that either route, completed in the same commit, unblocks
    the commit
  And the guide explains when to prefer each route (update when the code moved;
    confirm when the structural change does not change what the code does)
