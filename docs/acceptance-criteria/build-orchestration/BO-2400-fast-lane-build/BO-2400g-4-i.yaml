it_requirements:
  - "DO NOT INVENT A SECOND PR CONVENTION. BO-800 ('self-describing PRs') already owns what a pull request must tell its reader. Read BO-800's leaves first and extend that convention; a fast-lane-only body format means two renderers, and the one that drifts is the one that fires least."
  - "The assertion surface is the pull-request body the lane ACTUALLY SUBMITS, not any intermediate value the run computed on the way there. Both smell readers RETURN their findings rather than writing them anywhere, so 'computed and then dropped' is a silent and entirely plausible outcome that an intermediate-value assertion would call a pass."
  - "Every rendered finding must carry the requirement id and the file path it relates to, drawn from the {ac_id, file, severity, text} shape defined by BO-2400g-2. A bulleted list of bare sentences does not satisfy the second Then clause."
  - "A clean run must add NO section at all — not an empty heading. An always-render implementation leaves an empty 'Findings' heading on every clean pull request, which trains readers to ignore it and is how a real signal becomes noise. The positive and clean cases must be asserted in the same suite."
  - "Scope is findings that did NOT stop the run. Findings that stopped the run never reach a pull request, because BO-2400g-4 requires that no pull request exists in that case; the operator-facing message for a stop is that AC's fourth clause, not this one's."
  - "TESTS MUST NOT BE GREP-ONLY. Drive the real lane through unit_tests/_workflow_engine_harness.py and capture the pull-request body the Pull Request phase (fast-lane-ship.js:539) submits; assert on the captured dispatch payload, never on meta.phases."
  - "Workflow changes take effect only in the deployed layout, so `python scripts/build.py --target-dir .` must run before any test exercising the deployed lane."
