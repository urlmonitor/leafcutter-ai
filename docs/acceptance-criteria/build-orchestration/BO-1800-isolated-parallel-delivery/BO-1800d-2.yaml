criteria: |
  Given garbage collection / maintenance needs to run on a repository,
  When it is invoked,
  Then it runs only when no drive is active against that repository (between drives),
    as a single-writer operation,
  And gc/maintenance is never started against a repository while a drive is writing
    to it.
depends_on: [BO-1800d]
