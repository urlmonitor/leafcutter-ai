amended_by:
- reason: it-po-technical-enrichment
  date: '2026-09-25'
  by: it-po
superseded_by: null
covered_by: []
implemented_by: []
change_target: code
risk_surface: contract_boundary
notes: |
  Standing rule honoured: ACD-400c ("a requirement only joins the buildable queue once a
  person has approved it"). IT-PO: the check needs to know each record's readiness at
  stage start (the stage's before-state); how it obtains that is an enrichment decision.
