notes: |
  THE CONTROL CLAUSE IS LOAD-BEARING, NOT DEFENSIVE. AR-200b-1 records the same
  hazard one component over: a detector that matched the bare English word
  instead of the declaration flagged most of the registry, and a noisy rule gets
  disabled, which is strictly worse than no rule. The distinction here is
  between a definition that states its own grant and one that merely mentions
  abilities.

  WHY AGREEMENT IS STILL REPORTED. An in-place account that happens to match
  today is the state the tree is in right now, and it is one grant change away
  from being a contradiction with nothing watching. Reporting it as a duplicate
  rather than a contradiction keeps the severity honest while still making it
  visible.
