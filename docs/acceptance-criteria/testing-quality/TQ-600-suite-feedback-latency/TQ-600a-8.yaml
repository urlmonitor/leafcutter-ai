    suite still at ~1:29:47. TQ-600a-1''s Given is "a selection of tests" — unbounded,
    and supplied by whoever implements it; TQ-600a-4''s "the set of tests moved" is
    vacuously true at size zero; TQ-600a-6''s bound grew looser with every test left
