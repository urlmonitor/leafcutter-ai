notes: |
  GE-130a criteria: "anything a protection accepts as done first (such as having read the
  folder's guide) counts however it was done." Today only the reading tool feeds the session's
  read record (readme_marker_recorder, PostToolUse on Read).

  Concrete inputs: cat README.md; Get-Content README.md; head -n 40 README.md (partial);
  ls <folder>; find . -name README.md; test -f README.md (naming only).

  DECIDED 2026-09-17 (user): a content search that prints a few matching lines of the guide
  (grep pattern README.md) is a partial read, on the same terms as a reading-tool read of those
  lines.

