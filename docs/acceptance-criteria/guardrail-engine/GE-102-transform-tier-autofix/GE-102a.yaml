created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  Given a staged docs markdown file whose YAML frontmatter is missing the created date,
    the last_updated date, the type field, or the status field,
  And the commit guardian config doc_frontmatter section lists allowed types and statuses,
  When the doc-frontmatter transform hook runs at pre-commit time,
  Then it writes the missing created and last_updated dates in place using the current date,
  And it fills a missing type and status from the doc_frontmatter defaults for that path,
  And it re-stages the corrected file,
  And it exits with code 0 so the commit proceeds,
  And it never blocks the commit and never rewrites a field that was already present.
depends_on: [GE-102]
