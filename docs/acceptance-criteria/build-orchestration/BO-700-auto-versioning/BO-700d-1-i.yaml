title: "An empty release (no tickets between tags) produces a No changes entry"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given the latest git tag is "v0.4.2"
    and the changelog directory contains NO entry files created after v0.4.2
    and a human invokes the release rendering step with --force,
  When the rendering step attempts to produce the CHANGELOG and manifest,
  Then the Markdown output contains a heading: "## 0.4.2 (no changes)"
  And the body under the heading states: "No tickets completed since last release."
  And the YAML manifest contains:
    - version: "0.4.2"
    - entries: []
    - note: "No tickets completed since last release"
  And no version bump is applied.
