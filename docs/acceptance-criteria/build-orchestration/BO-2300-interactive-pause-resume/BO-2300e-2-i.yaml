title: "A pause-store dispatch is never sent without naming its workspace"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given each of the six pause-store dispatch call sites in plan-feature.js --
    peek-pause-record, read-pause-record, clear-pause-record,
    clear-pause-record-verify, pause-persist, and pause-persist-verify,
  When the workflow constructs the agent() call for that operation,
  Then the call's prompt/args always includes a specific, non-empty target
    workspace for command-step-runner to run the command in,
  And command-step-runner is never asked to perform a pause-store operation
    without a named workspace, so its charter-declined path (declining a
    request that names no workspace) is never exercised during normal
    operation of any of the six call sites.
