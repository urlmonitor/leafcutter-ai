readiness: approved
priority: high
title: "A commit with a broken AC-to-code link is blocked; an honest commit proceeds"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-111-traceability-stays-honest/GE-111a.yaml"
criteria: |
  Given an acceptance criterion AC-X has implemented_by entry "src/foo.py"
  And the staged commit deletes or renames "src/foo.py" so that path no longer
    resolves to a file in the staged tree
  When the traceability reconciliation check runs at pre-commit time
  Then the check finishes with a blocking (non-zero) outcome
  And the commit does not complete
  And the blocking outcome names AC-X as the affected criterion

  Given a second acceptance criterion AC-Y has implemented_by entry "src/bar.py"
  And the staged commit modifies "src/bar.py" but that path still resolves to a
    file in the staged tree
  When the traceability reconciliation check runs at pre-commit time
  Then the check finishes with a passing (zero) outcome for AC-Y
  And the commit is allowed to proceed
depends_on:
  - GE-111a
