notes: |
  WHY THE TABLE IS ONE TABLE. GE-129e-3 checks that every stated outcome equals the guard's
  actual outcome. Examples scattered through prose cannot be checked; a table can.

  DECIDED 2026-09-17 (user) -- COMMIT ONLY, FOR NOW. Only the `commit` subcommand is guarded. The
  last clause names the history-writing subcommands left unguarded so the limit is stated, not
  implied: merge (non-fast-forward), pull (merges or rebases), cherry-pick, revert, rebase, am,
  commit-tree (plumbing; creates a commit object), stash (commits on refs/stash), notes (commits
  on refs/notes/*), fast-import, filter-branch and replay (rewrite). Verified against git's
  command set 2026-09-17: the user's seven were confirmed and five added. Not listed because
  they move a ref without creating a commit: reset, update-ref, branch -f, push. If any
  subcommand is brought into scope later, this clause and GE-129e-4's change with it.

  The caller table (who may commit) is GE-129e-2 / GE-129e-3; this record covers commands only.

  declares_side_effect: false -- the Then clauses describe reference content.
