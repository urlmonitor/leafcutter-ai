    relevance: "Holds _resolve_reference_patterns — the zero-match / multiple-match failure branch this scenario exercises, and the error that must name the AC id and the unresolvable pattern. (Re-pointed 2026-09-22: scripts/ac_store/generate_ticket_from_ac.py is now a re-export shell; the implementation moved to the _gtfa_* siblings.)"
  - path: scripts/ac_store/_gtfa_body.py
    relationship: modifies
    status: exists
    relevance: "Holds _build_implementation_notes_section, the caller (at _gtfa_body.py:107) that must let the authoring error surface rather than emitting a raw pattern or broken path into the ticket body."
