notes: |
  THIS IS THE FIRST OF THE TWO MANDATORY ARMS the L1 names. It establishes that a
  named target is honoured. GE-126a-2 establishes that a named target which resolves
  to nothing is a caller error rather than a pass. Neither arm alone distinguishes
  "honoured your argument" from "ignored it and found nothing to complain about", so
  do not close one by satisfying the other.

  WHY THE VIOLATING RECORD IS LOAD-BEARING AND THE CLEAN ONE IS ONLY THE CONTROL. The
  observable is the verdict on a record known to break the rule. A printed count of
  files seen is explicitly NOT accepted here — the L1 says so and the L0 says so — a
  check can echo the number of paths it was handed and have inspected a different set.
  The clean-record run exists solely to prove the refusal is discriminating rather than
  unconditional; without it an implementer satisfies this by refusing everything.

  BOUNDARY — THIS IS NOT AN EMPTY-SCOPE RULE. A run with no target named at all, where
  nothing is in scope, still reports an ordinary pass. That boundary is pinned
  separately as GE-126a-2-i because breaking it breaks every commit-time invocation of
  the whole AC check family, and because it is the most likely regression from this
  work.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET, not because this criterion is
  terminal. Contracts between records are filled at the IT PO stage. See BP-1100b-5 on
  main for why that distinction is worth stating rather than leaving to inference.
  DO NOT REFILL this field from the BA stage.

  ------------------------------------------------------------------------------
  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NOW SET AND IS NOT TERMINAL. This record establishes the
  resolved-target collection that GE-126a-2 and GE-126a-3 both extend. The contract is
  the collection and the obligation attached to a member of it — that it is JUDGED,
  not counted. Stated that way because both consumers can be satisfied superficially by
  a longer list nobody reads.

  expects_from IS NULL AND THAT IS A DECISION. This is the head of the GE-126a chain:
  it consumes no artifact produced by another record in this tree. It is not an
  unenriched field. DO NOT REFILL.

  AGENT AND ORDERING. python-coder. Ordering to GE-126a-2 and GE-126a-3 lives in their
  depends_on and nowhere else — expects_from is invisible to the build sequencer
  (KI-ACD-015), so the contract above carries no scheduling meaning.

  THE TEST CONTRACT IS DELIBERATELY THREE-ARMED PLUS ONE. The third descriptor —
  argv naming the violating record while the git index holds only unrelated clean files
  — is the only one an implementation that discards argv cannot satisfy. If a reviewer
  has to drop a descriptor, that is not the one.

  NOT AUTHORED HERE: declares_side_effect. It is derived from the Then clause per
  BO-2900g-2 and hand-authoring it is what produced the nine store-wide disagreements
  recorded in KI-CG-015.
