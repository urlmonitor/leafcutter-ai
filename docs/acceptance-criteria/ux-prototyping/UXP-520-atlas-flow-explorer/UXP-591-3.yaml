id: UXP-591-3
title: "'Appears in flows' links in an AC's detail point at the step address of each node that implements it"
component: ux-prototyping
components:
  - ux_prototyping
  - frontend_coding
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given AC UXP-411 is implemented by the step 'resolve' of leafcutter/flow-render-pipeline,
    AC UXP-210d-2 by the branch 'declined' of fern-and-fig/checkout-and-pay and the branch
    'paymentFailed' of fern-and-fig/customer-buys-a-plant, and AC BO-2000b by the step 'code'
    of leafcutter/how-acs-are-built and the steps 'conventions', 'docenforce' and 'complexity'
    of leafcutter/python-coder-internal,
  When the person opens each of those ACs' detail in the Atlas,
  Then UXP-411's 'Appears in flows' link points at
    /flows/leafcutter/flow-render-pipeline?step=resolve,
  And UXP-210d-2's two links point at /flows/fern-and-fig/checkout-and-pay?step=declined and
    /flows/fern-and-fig/customer-buys-a-plant?step=paymentFailed,
  And BO-2000b shows four links, one per node, at /flows/leafcutter/how-acs-are-built?step=code,
    /flows/leafcutter/python-coder-internal?step=conventions,
    /flows/leafcutter/python-coder-internal?step=docenforce and
    /flows/leafcutter/python-coder-internal?step=complexity,
  And no link uses the /flows?flow= form or encodes the '/' in a flow id as %2F,
  And following UXP-411's link opens leafcutter/flow-render-pipeline with the 'resolve'
    drawer open.
depends_on:
  - UXP-591
  - UXP-591-2
  - UXP-524
