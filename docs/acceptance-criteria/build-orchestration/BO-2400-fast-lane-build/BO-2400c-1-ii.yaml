id: BO-2400c-1-ii
components:
  - build_orchestration
  - injection_builder
title: "The prompt-caching layer is reachable the only way the lane can reach Python — as a command that runs"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the fast lane's workflow body cannot read or write files and reaches Python
    only by dispatching an agent that runs a single command,
  When the lane needs an assembled context bundle,
  Then the prompt-caching layer answers that command: invoked with the layer's inputs
    supplied as arguments, it runs to completion, exits zero, and emits the assembled
    bundle — the stable layers, one cache breakpoint, then the volatile layers — as its
    output,
  And what it emits is the bundle and nothing else: no banner, no progress line, no log
    text is mixed into the output, because any extra byte on the stable side of the
    breakpoint destroys the byte-identity the whole feature rests on,
  And an invocation that resolves to a real path, runs, exits zero and produces nothing
    does not satisfy this criterion — a call that silently does nothing is the defect
    being fixed here, not evidence of a fix.

  Given the invocation is unusable — a required layer is not supplied, or an argument
    names content the layer cannot obtain,
  When the command runs,
  Then it exits non-zero and names what was missing,
  And it does not exit zero carrying a partial bundle, an empty bundle, or a bundle with
    a silently-omitted stable layer, so a caller can never mistake a broken assembly for
    a successful one.
depends_on: [BO-2400c-1]
