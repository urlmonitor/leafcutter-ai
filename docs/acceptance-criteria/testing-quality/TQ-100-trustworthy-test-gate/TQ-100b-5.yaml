estimated_complexity: M
it_requirements:
  - "MEASURED STARTING POINT the criteria could not carry: the two readers do not merely spell one pattern differently, they differ on three axes today. Reader 1 captures the id and applies no shape rule and no position rule. Reader 2 applies a stricter shape rule (exactly three digits after a 2-6 letter prefix, so AC-1 and other short-form ids never match) and IS position-aware via AST, but only detects that a tag is present — it never extracts the value. Producing 'the same set of records of (file, test function, captured value)' therefore requires reader 2 to start capturing values, which is new behaviour, not a pattern tweak. Budget for that before starting."
  - "Parity must be established from the two readers' OUTPUT over real on-disk files. Comparing the two pattern strings, asserting one module imports the other, or asserting the two constants are equal does not satisfy any clause of this AC — those are the grep-only structural tests this AC exists to replace."
  - "Reader 2 has a source-of-truth split that will silently revert a fix: templates/scripts/commit_guardian/check_test_ac_tags.py is the source and scripts/commit_guardian/check_test_ac_tags.py is a build.py-generated copy (byte-identical at HEAD). Land recognition changes in the template and re-run build.py; never patch only the deployed copy. Reader 1 has no template and is edited in place under scripts/ac_store/."
  - "If parity is implemented by extracting a single shared reader, that shared module must be added to build.py's deploy map for BOTH the ac_store and commit_guardian consumers in the same change. A commit-time hook importing an undeployed module raises ModuleNotFoundError, and the done-proof gate is a required check — that failure blocks every merge."
  - "The parity verdict must be CONSUMED by something that runs, not merely computed. Reader 2's check currently runs in warn mode behind the commit_guardian test_ac_tag_enforcement key; name explicitly which gate consumes the parity result and in which mode it runs, and make that the entry point the tests exercise. A parity function nobody calls is the phantom-done shape, one level up."
  - "A disagreement report must name the captured value, the file, and which of the two readers accepted it. A boolean 'readers differ', or a count of differences, is not actionable and does not satisfy the criterion."
  - "The comparison must be order-insensitive and deterministic: parity is over sets of records, so a difference in filesystem walk order or in the order either reader emits records must never register as a disagreement."
  - "Must run inside the existing commit-time budget over the full committed tree (roughly 2,328 tag records today): at most one pass per reader per file, no repeated full-tree scans per report class."
  - "Ordering constraint: TQ-100b-4 and TQ-100b-4-ii both change what reader 1 recognises. Establish the parity comparison first and record the pre-change disagreement set as a known baseline, then require it to be EMPTY after those two land. Asserting empty parity before the narrowing lands will fail for reasons unrelated to this AC."
  - "BA CENSUS CORRECTION 2026-08-19 — the nine it_requirements above were written against a two-reader picture and remain accurate ONLY as a description of the R1/R2 pair. The criteria now name four definition sites (R1, R1f, R2, R3). R3 (templates/scripts/commit_guardian/check_ac_coverage.py:41) and R1f (templates/scripts/commit_guardian/check_done_proof.py:92-95) are not costed anywhere above, and R3 adds a fourth axis of disagreement not listed in the first requirement: it is blind to \"// covers:\" tags entirely. This entry does not attempt to price them — it flags that an IT-PO re-pass is owed before this AC is built, and that the estimated_complexity of M was set against two readers, not four."
test_spec:
  - name: test_both_readers_produce_the_same_record_set_over_the_committed_tree
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "Run BOTH readers over the committed unit_tests/ tree and assert set equality on (file, test function, captured value) plus the same verdict class (recognised / rejected non-tag / malformed) for every capture. Real files, real readers, output compared — never the two pattern strings."
  - name: test_shared_tag_vocabulary_is_single_sourced_across_the_two_consumers
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "The cross-source contract test: pipe the real done-proof reader's output and the real commit-guardian reader's output into the comparison and assert the recognition vocabularies are not disjoint sets maintained independently. This is EPIC-ComputedQualityGates FP-1 layer 3 in miniature — each side is already green against its own copy, and only a set-equality contract across the two sources detects the drift."
  - name: test_parity_verdict_is_reached_and_consumed_by_its_production_entry_point
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "Invoke the gate that consumes the parity verdict through its real runner as a subprocess and assert both that the comparison executed and that its result is acted on in control flow (exit status or blocker payload reflects it) — not merely that a parity helper exists or was passed an argument. Deleting the single line that wires the verdict into the gate must turn this red."
  - name: test_parity_holds_between_the_deployed_copies_after_build
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: "Run build.py into a temp target and compare the DEPLOYED readers' output over a real tree. Catches the specific drift this repo has hit: a recognition change landed in scripts/commit_guardian/check_test_ac_tags.py but not in its templates/ source, so the next build silently reverts it and the deployed pair disagrees while the source pair agrees."
  - name: test_every_named_recognition_rule_is_included_in_the_comparison
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "Added 2026-08-19 with the referent clarification. Assert the comparison's input set contains all four named rules (R1, R1f, R2, R3), so a parity run that silently covers only a pair fails rather than reporting agreement. Removing any one rule from the comparison must turn this red."
