notes: |
  WHY THIS EXISTS. PR #687 fixed two dispatch defects in build-feature.js — the
  frozen phase list (BO-3700) and the handoff contract (BO-3000a). build-ticket.js,
  the declared twin, received neither. Only one of those two halves is uncovered,
  and this record covers exactly that half:

    - Frozen phase list — UNCOVERED, and this record's subject. BO-3700's criteria
      name templates/workflows-js/build-feature.js explicitly, and its notes close
      with a SCOPE paragraph deliberately excluding the twin for want of a red
      baseline. Nothing in the store requires the twin to re-derive its pending set
      until this record does.
    - Handoff routing — ALREADY COVERED, and deliberately NOT restated here.
      BO-3000 requires that "build-ticket.js MUST apply the same handoff routing
      behaviour as build-feature.js, so the two drivers cannot diverge". That
      criterion is currently false and BO-3000 is still work_status: todo, so the
      requirement exists and is unmet. Authoring a second record for it would
      duplicate a live requirement and split its coverage across two ids.

  WHY A TOP-LEVEL L2 AND NOT A CHILD OF BO-3700. The store's precedent for a
  follow-up on the same behaviour is a lettered child (BO-3000a under BO-3000), and
  that shape was the first candidate here. It is wrong for this case on two counts.

  First, BO-3700 is work_status: done, verified against build-feature.js through a
  green harness test. A todo child hung under a done parent is precisely the drift
  shape this repo has already had to sweep for — the store-wide sweep at 439b9076f
  found twenty composites marked done with unfinished children — and it would make
  BO-3700's done a claim about work that has not happened. The alternative,
  reopening BO-3700 so the parent can honestly carry the child, would retract a
  verified done to describe a second file it was explicitly scoped away from.

  Second, and independent of status: the twin is its own unit of work. It needs its
  own red baseline through _driver_harness.py, its own test file entries, and its
  own lifecycle; BO-3700's SCOPE paragraph gives the reason ("widening a fix to a
  second driver without one turns a fix into a rewrite"). A record that can be
  scheduled, driven and closed on its own is a record, not a constraint on another
  one. `depends_on: [BO-3700]` carries the relationship instead: the shape of the
  fix is already settled on the twin, and this one should follow it rather than
  reinvent it. BO-3701 is a root id, so it derives no parent and needs no
  covered_by back-link — the same shape BO-3000 and BO-3700 already use.

  ON THE DIVERGENCE-DETECTION CRITERION. The last criterion above is deliberately
  narrow: it requires the mid-drive-promotion cases to be asserted over every entry
  in H.TWIN_DRIVERS, which makes THIS axis of divergence a test failure rather than
  a reading exercise. It is in this record rather than its own because it costs
  nothing extra here — the harness already exposes TWIN_DRIVERS and at least seven
  existing test files already loop over it — and because a promotion fix that is
  written against one driver only is how this record came to be needed.

  What is NOT in this record, and should be its own: a general twin-parity gate
  asserting that the two drivers' phaseOrder arrays and handoff-branch behaviour
  agree, failing on any future divergence on any axis. That belongs elsewhere for
  three reasons. It also serves BO-3000's half, so parking it here would make one
  record's done depend on work that two records need. It is a new mechanism rather
  than a mirrored fix, with its own design question (assert the arrays are equal,
  or assert the observable orderings are — the first is stricter and will fire on a
  harmless comment change). And a parity gate that fails would then read as "the
  promotion fix is not done", which is a diagnosis this record should not be able
  to emit. Recommended as a follow-up record; KI-BO-20260907-0850's countermeasure
  paragraph already argues for it.

  WHAT THE KNOWN-ISSUE ENTRY UNDERSTATES. KI-BO-20260907-0850 records "Occurrences:
  0 observed on this path", correctly, and then reads that as sampling rather than
  safety — also correct, but only for the handoff half. For the frozen-list half
  the exposure is narrower than the entry implies and worth stating: the promotion
  that triggers it comes from architect-review, and whether a standalone ticket
  schedules architect-review at all is what decides whether this driver can hit the
  bug. The entry's "anyone running /build-ticket" is true of the handoff defect,
  which any coder handoff reaches; the frozen-list defect needs a promoting phase in
  the drive. That does not lower the severity — the field evidence behind BO-3700 is
  two tickets in one batch of four — but it does mean the absence of observed
  occurrences here is partly a real difference in reach, not purely which driver got
  looked at.

  Two further notes on the entry. It says the twin's `PHASE_RESULT_SCHEMA` has no
  `handoff_target` property and no `additionalProperties: false`, so an agent
  correctly emitting the field is refused for non-conformance — that belongs to the
  BO-3000 half and is not this record's to fix; nothing here should be read as
  covering it. And the entry's countermeasure asks for both changes to be mirrored
  "in the same pass": the two halves now sit under different records with different
  work_status, so a single pass is an efficiency, not a requirement, and either half
  can land alone without leaving the other unrecorded.
