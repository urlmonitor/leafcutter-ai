amended_by:
  - reason: "Scope correction (not a change of intent), 2026-08-18: the criteria are unchanged; the recorded size and the readiness of this criterion were both wrong. Found by resolving the connected build set for this id and auditing every covering test file, rather than by reading the two files the first note named. Two corrections, in the notes in full. (1) The migration is SMALLER than recorded in one place — only BO-2400a-1 and BO-2400a-5 have sole proof in the two named files, and test_bo2400a_runner_wiring.py holds no sole proof at all. (2) It is BLOCKED in another: a third file, test_bo2500d_gate_retirement.py, points exclusively at the orphan and carries the sole proof for four done criteria (BO-2500d-1, -1-i, -2, -3), one of which — BO-2500d-1, 'no LLM review agent in the fast-lane phase order' — is directly contradicted by BO-2400f-11, the review phase shipped in PR #485 on BrainCandy's instruction. The two only coexist because BO-2500d's proof points at a file nobody runs. This criterion cannot be built until the BO-2500d family is amended or superseded to match the lane that ships; that is a product decision, not a coder's."
