    relationship: describes
    status: exists
assigned_agent: llm-expert
estimated_complexity: M
it_requirements: |
  Gate 3 lives in templates/agents/commit.md PROSE (llm-expert surface) and runs in
  the commit driver path BEFORE git commit, so it executes even when --no-verify
  would skip the pre-commit hook (ties to BO-1700b-3, same commit.md surface).
  REUSES the shared probe helper (BO-1700a-1) — does NOT reimplement the checks.
  Proceed only on exit 0 + empty failing_checks (BO-1700b-1); refuse with a message
  naming the failing check on any other outcome.
delivers_to: null
