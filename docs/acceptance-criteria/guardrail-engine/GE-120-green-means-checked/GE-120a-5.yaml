notes: |
  Satisfies the reference-doc entry in GE-120a's documentation_triggers.

  The PO's reason for the trigger, preserved: "a rule that 18 checks must obey has to be
  written down somewhere a future author will find it; today the opposite rule (fail open
  quietly) is the one that is documented." That makes the CORRECTION clause load-bearing —
  adding a new document while the old one still says "any unexpected exception causes the
  hook to exit 0" leaves the next author with two rules and no ordering between them.

  Sequence this after GE-120a-2 lands, so the disposition storage location documented here
  is the one that actually exists rather than one the author guessed at.

  IT-PO (2026-08-14): the storage location is a new per-entry key in
  hooks_manifest.hooks[] — there is no existing mode field to extend. Also added
  docs/how-to/creating-a-claude-code-hook.md to the sweep, since that is the surface a new
  check author reads before touching the reference.
target_epic: EPIC-TrustThatAGreenCheckActuallyChecked
