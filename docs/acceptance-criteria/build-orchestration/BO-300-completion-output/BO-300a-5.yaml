test_rationale: |
  The failure being prevented is a sentence the drive emits, so every descriptor
  asserts on the emitted completion text rather than on an intermediate structure --
  a roll-up that internally knows about the additions while the output still reads
  epic complete is the same defect with a better data model. The same reasoning
  applies to the cause: renaming an internal field from discovered-after-planning to
  something honest, while the operator-facing sentence still says the work was added
  mid-drive, leaves KI-BO-026 in place. Reproducing the condition at all requires an
  enumeration that answers differently on its second call, which no static test can
  express; that is what makes the harness extension the natural verification. The
  control case is required because the cheapest way to pass the first descriptors is
  to stop claiming completion at all.
