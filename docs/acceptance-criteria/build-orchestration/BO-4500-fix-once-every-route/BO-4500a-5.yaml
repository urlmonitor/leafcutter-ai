it_requirements:
  - >-
    THE SITE INVENTORY, VERIFIED 2026-10-14 against templates/workflows-js/ on this branch (grep of
    commit-agent dispatches and raw commit commands; line numbers are hints, re-verify at HEAD):
    plan-feature.js has THREE commit dispatches -- the commitStageOutput helper (label
    commit-stage-output, which serves the per-stage, final and orphan-recovery commits),
    commit-stage-output-product-truth and commit-flow-reconciliation; quick-fix.js has two (labels
    commit and commit/changelog); fast-lane-ship.js one; finalize-feature.js one (a raw
    COMMIT_AGENT_MODE=1 git commit inside a dispatched prompt); build-feature.js and its declared
    twin build-ticket.js reach commits through the commit phase agent. The in-flight /commit route,
    templates/workflows-js/commit.js (BO-3800a-2, branch fast-lane/bo-3800a), is a NINTH route
    once it lands and must be migrated onto the shared step like the others. The criteria's
    "eight sites" therefore understate the population; the census must count what exists.
  - >-
    The census is DERIVED, never a hard-coded list: it enumerates every dispatch in the deployed
    workflow set whose agent type is the commit agent or whose prompt instructs staging or
    committing, and every commit instruction in agent and skill text, then requires each to be
    accounted for by a migration record. A new route that commits is caught without editing the
    test.
  - >-
    After migration the only commit instruction any workflow prompt may carry is: run the shared
    step with this explicit path list and this message file (or let the commit agent author one)
    and relay its answer. commit.js's current "Show the planned commit message and file list, then
    commit" is a hand recipe and is replaced the same way.
  - >-
    ONE CALLER-SIDE BLOCK, NOT HAND COPIES. Every depth-0 route reads the commit agent's reply with
    the SAME acceptance predicate (continue only on commit_answer.status committed; stop without
    retry on a policy_ code; up to max_transient_retries retries on a step_ code (config, default 3); on handoff engage the named
    specialist at most once and re-offer the identical path list and message file; report
    everything else) and the SAME engage-then-re-offer loop that commit.js introduces. Typed into
    each workflow, that loop is exactly the duplication BO-4500 exists to stop. It must be shared
    through the reserved shared-code-inliner L1 named in BO-4500's notes, generalising
    BO-4300c-3's build-inlined WORKSPACE-ANSWER block to a COMMIT-ANSWER block with a
    byte-identity parity test over every deployed consumer. DEPENDENCY: that L1 is not authored
    yet; route migrations (BO-4500a-5-i..iv and the /commit route) must not land the loop as
    untested hand copies. build-feature / build-ticket consume handoffs through their existing
    BO-3000a phase-loop routing (BO-3800a-1) and do not take the block.
  - >-
    PROVENANCE IS PART OF THE CHANGE. The change that builds the step names, per piece (staging,
    message, checks and retry, branch refusal, serialisation, process and stash safety, handoff
    payload), the copy it was taken from and the KIs that copy was fixed for: commit.md
    stage-by-name; no hardened message copy exists (defined by BO-4500a-2); precommit-autofix
    single retry per BO-210c-2; quick-fix's BP-600f protected-branch refusal and BP-600c-3-ii
    no-bare-stash; BO-1600a-1 serialisation; remedy_handoff.py for the handoff payload.
  - >-
    REGRESSION TESTS THAT MUST EXERCISE THE STEP: KI-BO-029, KI-BO-20260928 (edited parent),
    KI-BO-20260901-0920 (index half), KI-BO-20260914 (trailer), KI-BO-20260925 (process kill and
    stash), BP-600f, BP-600c-3-ii and BO-210c-2. BO-210c-2 is approved but todo, so its regression
    tests do not exist yet and must be written against the step, not the retired recipe.
  - >-
    ORDER: the step (BO-4500a-1..-4) lands before any route moves; each route then moves in its own
    change so a regression is attributable to one route. BO-3200f must exclude these commit sites
    from its command-step routing (recorded on this record's notes).
  - >-
    Workflow .js edits are python-coder work in this repo (precedent BO-4300c-3, BO-3800a-2) because
    they are proved by the Python workflow-engine harness; prompt text inside agent and skill
    templates stays llm-expert (BO-4500a-5-v, -vi, -viii).
