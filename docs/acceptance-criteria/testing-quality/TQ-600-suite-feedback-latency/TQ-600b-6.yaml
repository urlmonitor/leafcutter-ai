notes: |
  Satisfies the how-to entry in TQ-600b's documentation_triggers.

  THE ESCAPE HATCH IS THE REASON THIS AC IS NOT OPTIONAL. Making parallel the default
  takes something away from every contributor: a readable, ordered, one-thing-at-a-time
  run. If the way back is undocumented, the predictable response to interleaved output
  is not to look for a flag — it is to conclude the parallel default was a mistake and
  to work around it, or to argue for reverting it. A documented, supported serial run
  costs one sentence and removes that whole conversation.

  THE TWO-SURFACE AGREEMENT CLAUSE IS WRITTEN FROM THIS REPOSITORY'S OWN HISTORY. Two
  documents describing one command is two chances for one of them to rot, and the one
  that rots keeps being believed. The clause is satisfiable either by one statement
  plus a link or by two statements that match; what it forbids is two statements that
  do not. That is mechanically checkable, which is why it is phrased as agreement
  rather than as "both are kept up to date".

  DELIBERATELY NOT HERE: any claim about how much faster the parallel run is. The
  measured wall clock on this workspace is contaminated by shared-host load, and a
  documented speed figure would be a number nobody could reproduce. The guidance
  documents the command, not the saving.
