test_rationale: "The whole defect was measured end-to-end and only exists end-to-end: a single well-formed line takes an ordinary source file from four findings to zero through scan_files, while every existing test in unit_tests/commit_guardian/test_scan_secrets_suppression.py calls _is_suppressed with hand-built tuples and sees none of it. An audit in the sibling GE-113c-3 family found two criteria that passed unit-level tests while describing scenarios the real entry point can never produce, so every descriptor here drives scan_files with real files on disk and a real .security-allowlist in the same temporary root. The two regression descriptors are not optional hardening: arm 3 fails an implementation that stops honouring suppressions at all, and arm 4 fails the cheap fix of banning the rule wildcard at parse time, which is why arm 4 must assert the resulting findings and never the shape of the line. The exit-status descriptor exists because scan_files returns a list and the pre-commit consumer turns it into an exit code; a test that only counts findings cannot tell the two apart."
