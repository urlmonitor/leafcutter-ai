id: GE-134a
components:
  - commit_guardian
title: "Recording why a file changed never counts against its size"
component: guardrail-engine
level: L1
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  The history of decisions a file carries is free; the code and prose still count.

  A file's written record of why it was changed the way it was is there to be read
  only when someone needs it, so keeping that record honest never pushes a file over
  its permitted length or blocks a change. Everything a person reads to work in the
  file, including its ordinary comments and descriptions, is still measured as before,
  and the published rule says exactly what is left out.
