criteria: |
  The old habit of committing straight onto one shared main is gone for good.

  No drive ever writes its work directly into a shared main branch. Every change
  travels through its own isolated copy and lands only via the reviewed workflow,
  so a stray delivery can no longer clobber the branch everyone depends on.
