id: INF-1200a-1
title: "The standard is stated in the material the specialist begins from, not pointed at from it"
component: infrastructure
components:
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a kind of file carries a standard the project holds work to, and the
    project's own ownership record assigns that kind of file to a specialist,
  When that specialist begins work holding only the material it was given at
    dispatch, having taken no action of its own,
  Then that material already states the standards for every kind of file the
    ownership record assigns to that specialist, each stated against the kind of
    file it governs,
  And each standard is stated in full there — the terms a reader would have to
    know in order to comply are present in that material, so the specialist can
    say what the standard is without opening, invoking, resolving, fetching or
    asking for anything further,
  And the value or rule so stated is the one the project declares for that kind
    of file, so it can be compared against the declaration by a reader who has
    seen only the brief,
  And given instead a specialist the ownership record assigns no kind of file
    that carries a standard,
  When it begins work,
  Then no standard for any kind of file is stated in its material, so what is
    present is an obligation on its own work rather than a recital of the
    project's rules.
depends_on:
  - INF-1200a
