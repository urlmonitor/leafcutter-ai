notes: |
  THE THIRD CLAUSE IS THE DURABILITY CLAUSE AND IT IS EASY TO LOSE. A record that says
  "see the verification run output" is complete at the moment it is written and empty
  six weeks later, when the run output is gone and the branch is deleted. The harm this
  L1 closes is a green result being quoted as proof a rule holds with no way for anyone
  to check whether the test could ever have said otherwise — and a dangling pointer
  closes nothing.

  BOUNDARY WITH TQ-500a-3. That AC requires the alteration be named specifically enough
  to reapply; this AC requires the naming to survive the run that produced it and to be
  legible to a stranger. They are the same sentence at two different moments, and the
  second is the one a later citation depends on.

  BOUNDARY WITH TQ-400. TQ-400 re-examines finished work on a rhythm and withdraws the
  done badge when the evidence has lapsed. This AC does no re-examination — it makes the
  original demonstration legible at the time it is taken, so that a later reader, human
  or a TQ-400 sweep, has something to read.
