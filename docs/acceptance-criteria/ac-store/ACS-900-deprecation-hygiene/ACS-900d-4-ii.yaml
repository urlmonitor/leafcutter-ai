notes: |
  The anti-gaming guard. Without it, marking any unfinished record
  "superseded_by: [anything]" would silently dodge done-proof — the exact
  phantom-done route the store exists to prevent. The request keeps schema
  shape, successor existence, and parent/child links in force for retired
  records; this L3 makes each of those observable.

  Successor existence is checked against the whole store, not only the staged
  set (a successor usually already exists on main and is not restaged).

  IT-PO enrichment (2026-10-15): the successor-existence and empty-list checks
  are NEW. No gate checks them today. They go in check_ac_schema.py. Parent
  links (check_ac_parent_covered_by.py) and schema shape need no change, only
  pinning tests. Found an enforcement-point disagreement: the JSON schema
  accepts status "superseded" but the manual validator and
  validate_ac_schema.py reject it. It is named in it_requirements for
  reconciliation. check_ac_limits.py keeps its own superseded set and should
  move to the shared predicate.
