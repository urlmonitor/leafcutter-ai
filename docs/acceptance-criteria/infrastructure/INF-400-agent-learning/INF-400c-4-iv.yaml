test_spec:
  - name: test_absent_sink_exit_status_equals_the_empty_sink_exit_status
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "python scripts/knowledge/harvest_learnings.py run through subprocess in two temp trees"
    description: "Run the harvester CLI twice: once in a tree where the declared sink does not exist, once in a tree where it exists and is empty. Assert the two exit statuses are EQUAL to each other. The assertion must be equality between the two runs, not equality to the literal 0, so a future change to the empty case moves both together."
  - name: test_absent_sink_reports_zero_read_and_zero_outstanding
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "With the declared sink absent, assert the run reports zero records read and zero outstanding, and reports the no-work outcome rather than an error outcome."
  - name: test_absent_sink_creates_neither_the_sink_nor_its_parent_directory
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Run in a temp tree containing no debugging/ directory at all; assert afterwards that debugging/, debugging/logs/ and the sink file all still do not exist. A reader that mkdirs on read turns a misconfigured path into a silently-created empty file."
  - name: test_absent_sink_does_not_widen_into_the_operational_stream
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: seam
    description: "In a tree where debugging/logs/agent_telemetry.jsonl holds 28 knowledge records and the declared sink is absent, assert the run still reports zero records read and writes to no destination file."
  - name: test_absent_sink_report_names_the_path_it_looked_for
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Assert the reported output on the absent-sink path contains the resolved sink path, and that a run over a deliberately wrong path names that wrong path rather than the declared one, so the two runs are distinguishable from their reports alone."
  - name: test_a_sink_that_exists_but_cannot_be_read_keeps_its_distinct_nonzero_status
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: failure
    description: "The must-not-change half. Create the sink and make it unreadable (mode 000, then separately a directory in its place); assert the run exits with the existing sink-unreadable status and that this status is NOT equal to the absent-sink status. Assert in the same test that a corrupt state file, retained unroutable records and a failed destination write still return their existing distinct statuses, so the absent-case change did not renumber anything."
test_rationale: |
  A direct unit test of a resolver function would pass while the CLI still
  mapped absent to the error branch, so every descriptor runs the production
  entry point through subprocess. The first and last tests are a pair and must
  be read together: the first asserts absent and empty are equal, the last
  asserts absent and unreadable are not, and the last also pins 2, 3 and 4
  against silent renumbering. Asserting the first as status == 0 rather than as
  equality with the empty run would let the empty case drift away later without
  any test going red, which is the drift mode this AC exists to prevent one
  level down.
notes: |
  Authored 2026-09-07 to fill the hole INF-400c-4-ii's withdrawal left at this
  position. The withdrawn AC asked what happens to the records already in the
  operational stream when the sink is repointed; the answer, settled by
  INF-700c-2, is nothing. The question that remains unanswered is what happens
  on the other side of the repoint: the declared sink is empty and absent, and
  something is about to start running against it on every completed unit of
  work.

  Boundary. INF-700c-1-i owns a line in the sink that cannot be parsed.
  INF-700c-1 owns a record with no learning in it. This AC owns the sink not
  being there at all, which is a different condition with a different correct
  answer, and is the condition every fresh clone starts in.
change_target: code
risk_surface: contract_boundary
