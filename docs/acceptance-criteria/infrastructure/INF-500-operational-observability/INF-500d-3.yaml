title: "A report that could not be written says which report failed and why"
component: infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an agent files a report and the caller cannot confirm the report landed,
  When the caller records the failure marker for that submission,
  Then the marker names the reason, drawn from a closed set that distinguishes at
    minimum these five cases:
      - the submitter was not permitted to write the category;
      - the submission was refused as malformed before anything was written (an
        unrecognised category, a badly shaped tag, or a badly shaped reference list);
      - the submission facility itself was unavailable (its entry point is missing, or
        a library it depends on is not installed);
      - the destination could not be written;
      - the report WAS written successfully but the caller did not capture the record
        identifier,
  And the marker also names the category the failed report was destined for,
  And the agent's verdict is still delivered — the failed write never aborts or
    downgrades the sign-off it accompanied.

  Given a marker whose recorded reason is "the report was written but the identifier
    was not captured",
  When anything that retries, holds, or re-files failed reports processes that marker,
  Then the report is NOT held and NOT re-filed, because a stored record for it already
    exists,
  And the marker instead reports that the record exists but is uncited,
  So that the one failure mode in which nothing was actually lost cannot be turned
    into a duplicated record.

  Given five failures occur in one run, one of each reason in the closed set,
  When an operator reads the accumulated markers afterwards,
  Then the five are distinguishable from one another by reason without inspecting any
    other artefact.
