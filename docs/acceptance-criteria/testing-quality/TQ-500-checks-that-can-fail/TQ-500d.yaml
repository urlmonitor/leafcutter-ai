readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Guidance that says when an early pass is expected, and what to prove instead.

  The rules today treat a test that passes straight away as a sign the work was
  done in the wrong order. For this family of work that reading is exactly
  inverted — passing straight away is the correct result — so the one question
  worth asking looks like it has already been answered. After this, the guidance
  names the exception plainly and points at the substitute proof it requires.
