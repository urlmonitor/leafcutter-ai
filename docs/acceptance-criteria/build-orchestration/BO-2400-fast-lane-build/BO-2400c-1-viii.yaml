title: "The bundle the lane acts on is proved to be the bundle that was assembled"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the lane obtains its context bundle by asking another party to produce it and
    hand it back,
  And the only channel back is that party's reply, so the lane never sees the bundle as
    it was produced and has no way of its own to go and look,
  When the reply arrives,
  Then the lane treats the text as usable only after comparing it against a verification
    value that the producing step states over the exact bytes it produced,
  And that comparison separates any difference at all — one character re-encoded,
    re-spaced, inserted or dropped anywhere in the text makes it fail — so an alteration
    that leaves the length unchanged is caught as surely as one that does not,
  And the value compared against is the one the producer stated, never one the lane
    derives from the text it received: a comparison whose two sides both come from the
    received text compares that text with itself and can only ever agree.

  Given a reply whose text differs from what was produced — for example one in which
    every angle bracket arrives as its escaped spelling, the shape observed on
    2026-08-31 —
  When the lane runs the comparison,
  Then the run ends and no context-carrying agent is dispatched,
  And no repaired, re-decoded or otherwise adjusted version of the received text is used
    in its place unless that adjusted text itself satisfies the same comparison,
  And the refusal is not softened by the text looking right: content that reads as a
    plausible bundle, carries the structural landmarks the lane looks for, and is the
    expected size is still refused when it is not the text that was produced.

  Given a reply that carries content but states no verification value, or states one the
    lane cannot interpret,
  When the lane tries to establish that what it holds is what was produced,
  Then it cannot, and the run ends on that basis rather than proceeding on the assumption
    that unverifiable content is intact,
  And that outcome is reached the same way a failed comparison is, so an absent
    verification value is never a quieter way past the gate than a wrong one.
