criteria: |
  Given a target criterion T whose structural parent P is recorded only as P's
    covered_by listing T,
  And T also lists three further prerequisites, all not done:
    - Q, whose covered_by lists [Q-1, Q-2] and does not list T,
    - R, which has no covered_by field at all,
    - S, whose covered_by lists only test-file references
      (e.g. "unit_tests/build_orchestration/test_s.py") and no criterion ids,
  When the connected build set for T is resolved with structural-parent
    prerequisites excluded,
  Then P is excluded from the set,
  And Q, R and S are each included and walked as genuine prerequisites, with Q's
    not-done descendants Q-1 and Q-2 included as they are today,
  And the resolution completes without error for R's missing covered_by and S's
    non-criterion covered_by entries, and neither is treated as the structural parent.
