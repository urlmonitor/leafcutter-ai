id: BP-1600a-1
components:
  - build_pipeline
  - precommit_hooks
title: "The population of session hook scripts the wiring census walks is taken from the scripts present on disk, so a script the settings surface never invokes is reported as run by nothing — the surface that carries the harness's own guards has never been counted"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the project keeps the scripts that run in response to the assistant
    harness's own tool calls together in one place, and that place holds both
    scripts sitting directly in it and any scripts held in subdirectories of it,
  And a settings surface declares which of those scripts the harness runs, at
    which tool-call event, by naming each one inside a command it executes,
  When the wiring census runs,
  Then the population it examines is every hook script held anywhere beneath that
    place, subdirectories included, obtained by listing that place at run time,
  And each script in that population is identified by its position within that
    place rather than by its bare filename, so two scripts sharing a filename at
    different positions are two members of the population and a wiring naming one
    of them is never read as covering the other,
  And the wired population is obtained by reading the settings surface the project
    ships and taking from each configured entry the hook script that entry's
    command executes, so neither side of the comparison is a set written into the
    census itself,
  And every script present in that place that no configured entry executes is
    reported by name, together with the statement that nothing runs it, and the
    run fails,
  And a script that at least one configured entry executes is not reported at all,
  And given one new hook script is added to that place and nothing else in the
    project changes,
  When the census runs again,
  Then the newly added script is among those reported as run by nothing, and the
    number of scripts the census states it examined is exactly one greater than
    the number it stated before — establishing that the population was enumerated
    from the tree rather than recited from a list,
  And the same holds when that one new script is added inside a subdirectory of
    that place rather than directly in it — a script the census cannot see is a
    script the census cannot report, and a population that stops at the top level
    silently excuses everything held below it.
