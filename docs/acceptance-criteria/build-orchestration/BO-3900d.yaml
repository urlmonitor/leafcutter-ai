id: BO-3900d
title: "A POSIX-only absolute-path test added to any workflow script is caught automatically, over a set of scripts that is derived rather than listed"
component: build-orchestration
components:
  - build_orchestration
  - testing_quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: internal
package_surface: false
criteria: |
  Given the workflow script directory holds 8 scripts at authoring time — build-epic,
    build-feature, build-ticket, create-ticket, fast-lane-ship, finalize-feature,
    plan-feature and quick-fix
  When the automated check runs
  Then it examines every script in that directory and states how many it examined
  And a ninth script added to that directory raises the stated count to 9 with no
    change to the check.

  Given a workflow script that treats a leading `/` as a sign that a path is absolute,
    in any of these shapes: `startsWith("/")`, `startsWith('/')`, `[0] === "/"`,
    `charAt(0) === '/'`, or a regular expression anchored on a leading slash
  And that test is neither the shared cross-platform path classification nor marked
    with a recorded reason stating the value is not a file-system path
  When the check runs
  Then the check fails
  And its failure names the script, the line, and the expression it found.

  Given a script whose only leading-`/` test sits inside the shared cross-platform path
    classification, which also recognises drive-letter and UNC forms
  And another script whose leading-`/` test carries a recorded reason such as
    "URL route, not a file-system path"
  When the check runs
  Then neither script is reported
  And a recorded marker that carries no reason text is reported as if it were absent.

  Given BO-3900 has landed
  When the check runs over the repository as it then stands
  Then it passes.

  Given this check passes
  When BO-3900's coverage is judged
  Then the check counts for nothing toward it: it guards against the POSIX-only form
    coming back, and it says nothing about which paths a workflow actually hands to agents.
