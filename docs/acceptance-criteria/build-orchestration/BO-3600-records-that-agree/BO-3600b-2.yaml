readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a requirement that reads unfinished,
    And a fault entry recording the same defect, whose status reads resolved and
      which carries evidence that the behaviour was delivered,
  When the two records are reconciled,
  Then that pairing is reported as a conflict, in the same way as the opposite
    pairing,
    And the report states that the delivery is recorded against the fault entry
      while the requirement reads unfinished.

  Given that same requirement while the conflict stands undecided,
  When work is selected as ready to be picked up,
  Then the outstanding conflict is presented alongside it,
    And it cannot be picked up without the conflict having been shown,
  So the requirement is not selected again and again on the strength of a state
    another record contradicts.

  Given a requirement that reads unfinished with no resolved fault entry recording
    its delivery,
  When work is selected as ready to be picked up,
  Then it is offered as ready with no conflict attached,
  So ordinary unfinished work is unaffected.

  Given the conflict is decided and the requirement is brought into agreement with
    the fault entry,
  When work is next selected as ready,
  Then that requirement is no longer offered as ready work,
  So the waste ends when the disagreement does.
