criteria: |
  Given the routing config contains an entry for "shipped-acs" targeting "config/ac_store/",
  And the following files are staged:
    - config/ac_store_backup/old-data.json
    - my-config/ac_store/leftover.yaml
    - tools/reconfig/ac_store_migrator.py
  When the commit agent classifies the staged files,
  Then config/ac_store_backup/old-data.json is NOT assigned to the shipped-ACs group
    (because "ac_store_backup" is a different directory than "ac_store"),
  And my-config/ac_store/leftover.yaml is NOT assigned to the shipped-ACs group
    (because the path does not start at the expected root "config/"),
  And tools/reconfig/ac_store_migrator.py is NOT assigned to the shipped-ACs group
    (because the substring appears mid-path in an unrelated context),
  And all three files remain unmatched or are assigned to a different group.
