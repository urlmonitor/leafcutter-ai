notes: |
  WHICH ARMS GO RED AGAINST THE CHECK AS IT STANDS (read from its source on 2026-10-09):
  today the check reports one figure, a count of every folder the commit touched, followed
  by the list of those folders and their counts. It has no notion of a set-aside folder,
  and it prints a "pre-existing density" warning for every touched folder already over the
  limit.
    - ARM 1: RED. A store folder that grew from 15 or under to 19 is refused today, a store
      folder already over is printed as pre-existing density, and no outcome states a
      judged figure and a set-aside figure.
    - ARM 2: RED. The single figure counts both populations together.
    - ARM 3: RED. Today a commit touching only store folders that are already over the
      limit and growing prints the pre-existing warnings and then a passed line saying
      every folder checked is within limits. After this change that is a success-shaped
      report from a run that judged nothing.

  WHY BOTH "NOT WITHIN THE LIMIT" AND "NOT ALREADY OVER" IN THE FIRST ARM. The check has
  two report lists for judged folders, and a set-aside folder could leak into either. The
  "already over" leak is the likelier one, because most store folders are over 15 and the
  existing grandfather path would print them there unchanged.

  NAMED MUTATIONS — EXECUTE THEM.
    (1) THE SILENT SKIP. Drop set-aside folders from the outcome entirely. MUST GO RED:
        arm 1's naming clause, arms 2 and 3.
    (2) THE LITERAL COUNT. Print the counts observed at implementation time. MUST GO RED:
        arm 2. MUST STAY GREEN: arm 1.
    (3) THE MERGED POPULATION. Count set-aside folders among the judged and mark them
        within limits. MUST GO RED: arm 1's last clause and arm 3.
    (4) THE GROUNDLESS REPORT. Name the folders but not the ground. MUST GO RED: arm 1's
        second clause only.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec and test_rationale (IT PO), and the wording and placement of the report lines.
