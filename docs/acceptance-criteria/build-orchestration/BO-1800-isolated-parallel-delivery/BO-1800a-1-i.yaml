it_requirements:
  - "A drive killed mid-commit MUST confine all damage to its own object store; a sibling drive's object store, refs, and index MUST remain byte-for-byte usable and able to keep committing (blast-radius boundary, not a recovery path — recovery is BO-1600d, de-prioritised)."
  - "The isolation guarantee MUST hold with no manual repair of any shared store."
  - "Verifiable by simulating a killed writer in one clone (leaving a half-written/zero-length loose object) and asserting the sibling clone completes its work with no error."
