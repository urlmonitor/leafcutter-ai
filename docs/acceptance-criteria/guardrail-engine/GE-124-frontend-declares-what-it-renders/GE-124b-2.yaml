change_target: code
risk_surface: contract_boundary
notes: |
  THE HARD LIMIT — GE-124's LIMIT 1, stated as behaviour. The two scenarios are
  the two directions it runs in, and both are needed:

  - Scenario 1 (the `detail-drawer.tsx` worked case): a pin does not buy you out
    of the floor. Without this, the cheap surface displaces the required one.
  - Scenario 2: the floor does not drag the pin in behind it. An element-level
    pin can only express that something is ON SCREEN, so a criterion with
    nothing to point at must be declarable at component level alone. Without
    this, an implementation would demand a pin per declared criterion and make
    the optional surface compulsory — contradicting GE-124b-1 and, via the back
    door, GE-124e.

  This AC states that a pin does not satisfy the FLOOR. It deliberately does
  not state that a pin is not COVERAGE — that is GE-124g's guarantee, decomposed
  across four places, and restating a fragment of it here is exactly the
  flattening the PO warned against.

  How many findings scenario 1 produces (one, not two) is GE-124c-1-i.
