assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    Confirmed at enrichment (2026-09-28): the shipped layouts differ in where the
    package sits relative to the project root, and the build records that offset as
    package_root in the project's .build_manifest.json. It is '' when the package is
    the project root, as here, and a subdirectory name in an outer project ('leafcutter-ai'
    observed in a real outer layout). check_build_drift and check_output_drift already
    read it. KI-CG-024 records that leafcutter/config/agent_registry.json has never
    existed as a layout.
  - >-
    Locate the package root as the project root from the shared resolver
    (_resolve_root.py, the resolver GE-113c-1-iv consolidates onto) joined with the
    manifest's package_root. Read package_root the way check_build_drift and
    check_output_drift already do, and reuse that reading rather than adding a third
    one. The hook must hold no literal 'leafcutter' path segment. Any fallback used
    when the manifest is absent must be the same fallback those hooks use. Nothing
    new is invented here.
  - >-
    Decide scope from the staged paths alone, before and independently of locating
    the package. The staged paths in scope are the agent registry
    (config/agent_registry.json), its schema (config/agent_registry.schema.json) and
    agent templates (templates/agents/**), under whatever prefix they have. A root
    that cannot be found must never hide the fact that in-scope files were staged.
  - >-
    Cannot locate the package: when an in-scope file is staged, the hook exits
    non-zero. Its message names every location it tried (the project root, the
    manifest path and the package_root value it read, and any fallback) and the
    staged in-scope files it did not check. The message's wording is its own and
    cannot be confused with the registry-invalid message, so the output alone tells
    the two apart.
  - >-
    Nothing in scope staged: exit 0 with an ordinary pass, whether or not a root can
    be found (the GE-120a-4 empty-scope rule).
  - >-
    Messages name the registry path that was actually resolved. The hard-coded
    'See leafcutter/config/agent_registry.json' hint must go.
  - >-
    Verdict parity with the build: the commit-time hook and build.py --validate-only
    call the same registry validation, so the same registry gives the same errors.
    Existing warnings (about two dozen skill-reference warnings on the real registry
    as of 2026-09-28) stay warnings. This change must not turn warnings into
    blocking errors.
  - >-
    Edit templates/scripts/commit_guardian/check_agent_registry.py. The live copy
    scripts/commit_guardian/check_agent_registry.py reaches parity through the build
    (in a build-provisioned workspace it is a link into the build output,
    KI-CG-20260831-hook-parity-legs-alias-and-fail-open). check-hook-parity passes.
  - >-
    No silent re-disable. The check-agent-registry entry in the hook configuration
    keeps at least its current scope: no files: narrowing, no exemption or allow-list
    entry, no warn-only mode, and no early success return. Enablement preview done at
    enrichment on 2026-09-28: the real registry gave 0 errors both under build.py
    --validate-only and under the current hook run against a copy of this repo laid
    out the way the hook expects. So as of this date no known-issue entries are
    needed to turn the gate on. Re-run both at implementation. Fix any new error in
    the same change or record it in the open KI, naming the error and the agent entry.
  - >-
    Tests elsewhere that reach this hook through a bare leafcutter/ fixture directory
    (for example the BO-2400a-1-iii test-writer's fixtures, per the open KI) must be
    moved to a real layout from the list above. They are migrated, not deleted,
    skipped or weakened.
  - >-
    When GE-120a-2 lands, this hook registers with cannot-run disposition 'block'.
    That registration is not in this record's scope and is not a dependency (user
    decision 2026-09-28).
test_required: true
test_spec:
  - name: test_repo_root_layout_invalid_registry_blocks_naming_fixture_agent
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: failure
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_agent_registry.py run as a subprocess in a temporary git repository"
    description: "A temporary git repository has the package at its root (package_root '') and the hook deployed under .leafcutter/scripts/commit_guardian/. A staged registry adds 'fixture-agent' (empty spawned_by) with a template_path that does not exist. The hook exits non-zero and its output names 'fixture-agent' and the missing template path."
    must_catch:
      - "the early exit 0 when <repo root>/leafcutter is absent (today's behaviour; this test fails today)"
      - "an exit 0 with a warning instead of a block"
  - name: test_repo_root_layout_corrected_registry_passes
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "In the same repository, after the fixture-agent template file is added and staged, the hook exits 0."
  - name: test_manifest_named_subdirectory_layout_is_validated
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: boundary
    description: "Parametrised over package_root 'leafcutter-ai' and 'leafcutter': an outer project repository with the package in that subdirectory, .build_manifest.json recording it, and the hook under .leafcutter/. The invalid fixture registry blocks naming fixture-agent, and the corrected one passes."
    must_catch:
      - "a hook that still hard-codes the 'leafcutter' segment passes the 'leafcutter' case and fails the 'leafcutter-ai' one"
  - name: test_unlocatable_package_blocks_with_its_own_message
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: failure
    description: "A repository with a staged config/agent_registry.json but no manifest and no locatable package makes the hook exit non-zero. The output names the locations tried and the staged file. It shares no identifying wording with the registry-invalid message, which is checked by comparing both outputs."
    must_catch:
      - "exit 0 when the package cannot be found"
      - "the cannot-locate case reusing the 'validation failed' wording"
  - name: test_nothing_in_scope_staged_passes_whether_or_not_package_is_found
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: boundary
    description: "With only an out-of-scope file staged, the hook exits 0 both in a repository where the package can be located and in one where it cannot."
    must_catch:
      - "a fix that blocks every commit in a repository without the package"
  - name: test_commit_time_and_build_validate_only_report_the_same_error
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: seam
    description: "For the invalid fixture package, the hook and build.py --validate-only (subprocess, pointed at the fixture) both fail and both name fixture-agent and the missing template."
  - name: test_live_and_packaged_copies_give_the_same_verdicts
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: deployed
    description: "scripts/commit_guardian/check_agent_registry.py and templates/scripts/commit_guardian/check_agent_registry.py, each deployed into the fixture repositories, give the same exit codes and error lines on the invalid, corrected, unlocatable and nothing-in-scope scenarios, and check_hook_parity passes."
  - name: test_real_repository_registry_passes_the_enabled_gate
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "The fixed hook, run over a temporary clone of this repository at its real layout with the real config/agent_registry.json staged, exits 0, and build.py --validate-only on the real repository exits 0. Turning the gate on does not block the registry as it stands."
  - name: test_check_agent_registry_hook_entry_is_not_narrowed_or_softened
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: unit
    angle: discrimination
    description: "The check-agent-registry entry in the hook configuration (the shipped pre-commit config and the commit_guardian hooks manifest) has no files: narrowing, no exemption and no warn-only disposition. The entry must never be re-disabled."
test_rationale: |
  The defect is a hook that exits 0 before it looks, so every assertion is made on a real
  subprocess run of the hook, from its deployed location, against a real temporary git
  repository with a real staged set. The layout is the variable under test, and a direct
  import would bypass the very path resolution that is broken.

  The first test is the one that fails today: in the repo-root layout the current hook
  returns 0. The manifest-named subdirectory test is parametrised over 'leafcutter' and
  'leafcutter-ai' because a hook that keeps the literal segment passes one and fails the
  other. The unlocatable and nothing-in-scope tests are the opposed pair. One requires a
  block with its own wording; the other forbids the block, so "block everything" and
  "pass everything" both fail. The build-parity test pins the commit-time verdict to the
  build's, which already works.

  The real-repository test is the enablement guard: it proves that switching the gate on
  does not block the registry as it stands. A preview at enrichment on 2026-09-28 gave 0
  errors. The hook-entry test backs the no-silent-re-disable clause mechanically. Every
  fixture is a temporary directory, and no test calls a model or the network.
delivers_to:
  agent: python-coder
  contract: "A commit-time check-agent-registry that locates the package as shared-resolver project root + .build_manifest.json package_root ('' or a subdirectory name), validates the resolved registry with the same function build.py --validate-only uses, exits non-zero with a distinct 'cannot locate package' message (locations tried + staged in-scope files) when in-scope files are staged and no package is found, and exits 0 when nothing in scope is staged. This is what makes BO-2400a-1-iii's commit-time step_kinds rejection actually run in this repository."
expects_from:
  ac_id: GE-120a-1
  contract: "The generic no-silent-pass rule: a guard that could not inspect what it was given does not report a pass. This record applies it to check-agent-registry's package lookup; the empty-scope pass follows GE-120a-4."
