id: BO-4500b-1-i
title: "A marker naming no known block, or a block whose source is empty, fails the install and leaves installed routes untouched"
component: build-orchestration
components:
  - build_pipeline
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500b-1.yaml"
criteria: |
  Given route A's template marks an empty place for a block named ALPHA-ANSWR,
  And the package holds block sources only for ALPHA-ANSWER and BETA-ANSWER,
  When the package is installed,
  Then the install fails with a message naming route A, the line of the start marker, the
    unknown name ALPHA-ANSWR, and the known block names ALPHA-ANSWER and BETA-ANSWER,
  And every installed route is byte for byte as it was before that install began.

  Given route A's template marks an empty place for ALPHA-ANSWER,
  And the ALPHA-ANSWER source exists but holds no text other than whitespace,
  When the package is installed,
  Then the install fails with a message naming the block ALPHA-ANSWER as having an empty source
    and naming route A as a route that needs it,
  And no installed route carries an empty ALPHA-ANSWER marker pair,
  And every installed route is byte for byte as it was before that install began.
depends_on: [BO-4500b-1]
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500b-1.yaml
