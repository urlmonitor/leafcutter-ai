id: GE-126e-5
title: "The first measured answer is published with the question that produced it"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the census has been run over the real registered set for the first time,
  When a reader consults the reference material for the check family,
  Then it records that measurement: how many checks were examined how many were classified as
    instances how many could not be executed the date and the commit it was measured at,
  And it states the procedure that produced the classification — a genuine violation handed to
    each check and two runs from two working directories compared — so a reader can repeat the
    measurement rather than take the number on trust,
  And it states that the figure describes the registered set at that commit and will move
    which is why it carries a date,
  And it names the census as the way to obtain a current figure so nobody quotes the recorded
    one as though it were current,
  And no statement anywhere in the reference material asserts a number for this defect that did
    not come from a census run.

  Coverage note: covered by a check that the recorded figures match the output of a census run
  at the recorded commit and that the recorded procedure is the one the census performs. A
  reference stating a figure no run produced is the failure this criterion pins and it is
  detectable by re-running at that commit.
depends_on:
  - GE-126e
  - GE-126e-1
  - GE-126e-2
  - GE-126e-3
