test_spec:
  - name: test_acs_1300a_1_cli_run_reports_missing_link_with_record_id_and_test_path
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the coverage-link repair CLI under scripts/ac_store/, invoked as a subprocess against a temporary store root and test root"
    description: "Build the four-record fixture store and its test tree on disk, invoke the tool's real command-line entry point as a subprocess (not an imported function), and assert the record whose naming test is absent from its coverage list is reported as a missing link naming BOTH its id and the naming test file's path. This descriptor is also the tree's reachability proof: an entry point that no subprocess can invoke cannot satisfy any criterion in this L1."
  - name: test_acs_1300a_1_absent_file_claim_is_reported_with_record_id_and_path
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "In the same fixture, the record whose coverage list names a file not on disk is reported as a claim to an absent file, naming the record id and the absent path."
  - name: test_acs_1300a_1_already_correct_and_untagged_records_are_reported_as_examined
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "THE COLLAPSE THIS FIXTURE EXISTS TO PREVENT. Assert the already-correct record and the untagged record are each PRESENT in the report with their own classification. Absence from the report is the failure — 'untouched' and 'never looked at' must not produce the same observation. Assert presence explicitly; do not assert only on the two findings."
  - name: test_acs_1300a_1_report_states_examined_read_and_excluded_totals
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "The report states how many records were examined, how many tag occurrences were read, and what the run excluded. Assert the totals are present and internally reconcilable against the fixture; do NOT assert a hard-coded number that a fixture change would falsify for the wrong reason."
  - name: test_acs_1300a_1_occurrence_set_equals_done_proof_scan_occurrence_for_occurrence
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "REAL PRODUCER INTO REAL CONSUMER, AND THE NO-FIFTH-READER CLAUSE. Over the same test tree, assert the run's tag-occurrence set equals `done_proof._scan_test_root_for_covers_tags`'s output occurrence for occurrence — including the `//` occurrences. Compare per occurrence, never by count: matching counts hide two offsetting differences, which is exactly how a second reader drifts undetected."
  - name: test_acs_1300a_1_every_coverage_dialect_naming_a_present_file_classifies_as_present
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      THE FIFTH-RECORD DIALECT CLAUSE, AND THE FALSE-ABSENT FALSIFIER. In the same fixture
      store, add a fifth record whose coverage list holds one entry per measured dialect —
      a child record id, `path.py::Class::test`, a bare `path.py`, and GE-107's
      `path.py:Class::test` with a SINGLE colon — with every file it names actually present
      on disk. Assert every entry naming a present file is classified present, and assert
      the absent-file finding set FOR THIS RECORD is empty. The single-colon entry is the
      one that fails against a parser splitting on `::`, which reads it as four dead links
      and reports GE-107 as inverse rot. Assert emptiness, not a per-dialect spot check:
      checking only that the double-colon entries passed leaves the four false positives
      in place, and ACS-1300a-2-i's removal rule would act on them destructively.
  - name: test_acs_1300a_1_hierarchically_suffixed_and_slash_slash_tags_are_not_truncated_or_dropped
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: "THE WRONG-RECORD REGRESSION, WRITTEN AS A TEST BECAUSE THE DEFECT IS LIVE IN THE REPO. Tags naming `ACS-1300a-1` and `BP-100k-6` must match those records and must NOT be attributed to `ACS-1300` or `BP-100`; a `// covers:` tag must be read. This fails against `check_ac_coverage.py:41`'s pattern and passes against `test_enforcement.COVERS_TAG_RE`, so it pins which rule the join actually used."
