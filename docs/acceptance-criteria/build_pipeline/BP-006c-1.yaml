criteria: |
  Given scripts/build_phases.py build_workflow_scripts() is invoked with a target_root path,
  When workflow scripts are compiled and written to disk,
  Then the output_dir variable resolves to target_root / ".claude" / "workflows",
  And all generated workflow files exist under target_root/.claude/workflows/,
  And no files are created under target_root/workflows/.
