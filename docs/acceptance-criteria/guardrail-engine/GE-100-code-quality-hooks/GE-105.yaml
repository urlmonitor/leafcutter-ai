criteria: |
  Given a docs/**/*.md file declaring a canonical diagram_type frontmatter
       value (data_flow, user_flow, or agent_flow)
  When check_doc_frontmatter runs validate_diagram_type during pre-commit
  Then the value must be accepted (no error), because the effective enum source
       (commit_guardian.json -> doc_frontmatter.diagram_type_values, used as the
       runtime fallback when diagram_types.json is not deployed) lists it

  And given the legacy alias "dataflow"
  When the same validation runs
  Then "dataflow" must still be accepted (backward compatibility)

  And the bug symptom ("unknown diagram_type: agent_flow" / "unknown
      diagram_type: data_flow" on a doc that uses a canonical value) must not
      occur
