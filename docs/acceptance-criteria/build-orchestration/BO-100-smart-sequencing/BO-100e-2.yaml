id: BO-100e-2
title: "The run stops when a fresh look finds nothing further it can build, and says so rather than circling"
component: build-orchestration
components:
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run over a set of work in which, after some pieces have been built, every
    remaining piece carries a prerequisite that cannot be satisfied within this run,
  When the run looks again at which work is eligible and finds none,
  Then the run ends,
    And it ends after a number of looks bounded by the number of pieces in the set,
    And it does not look again after a look that produced no newly eligible work
      and no piece finished in between,
    And it states that it ended because nothing further could be built, naming the
      remaining pieces,
  So a run that cannot make further progress terminates rather than circling.

  Given a run over a four-deep chain in which every layer does become eligible in
    turn,
  When the run proceeds,
  Then the run ends only after the look that follows the last piece finishing
    returns nothing further,
    And the run does not end at the first look that returns nothing new while a
      piece is still in progress,
  So ending early on a momentarily empty look is as much a failure of this criterion
    as never ending at all.

  Given any completed run,
  When the run's own record of how it proceeded is read,
  Then it states how many times it looked again for newly eligible work and how many
    pieces each look released,
    And a run that looked exactly once is distinguishable in that record from a run
      that looked repeatedly and found nothing after the first,
  So a re-look that never happens cannot be mistaken for one that happened and found
    nothing.
depends_on:
  - BO-100e
  - BO-100e-1
