it_requirements:
  - "ARCHITECTURE CONSTRAINT (load-bearing): the jcodemunch family (search_symbols / find_references / get_blast_radius) is exposed ONLY as MCP tools (mcp__jcodemunch__*), which are LLM-agent capabilities. Per ADR-006 / docs/agents/conventions.md the rule strips these even from coding agents — only research-agent holds them. A pre-commit hook is a plain Python subprocess invoked by git with NO MCP channel. Therefore the symbol tier MUST resolve symbols WITHOUT MCP: either (a) shell out to a CLI/index binary (mirror check_duplicate_code.py shelling out to jscpd), or (b) resolve in-process via stdlib AST for Python (ast.parse + walk top-level/class-scope def/class nodes in the staged blob)."
  - "Strongly recommended default: in-process Python AST resolution for .py files (no external dependency, always available, deterministic) as the primary resolver; treat any CLI-based cross-language resolver as an optional add-on guarded by the GE-111b-2-i fail-open ladder. This keeps the common (Python) case dependency-free."
  - "Symbol presence test: the symbol is CLEAN iff a top-level (or class-scoped, for dotted Class.method anchors) definition with the anchored name exists in the SAME staged file. Absent-from-this-file => drift. Locating where it moved is GE-111b-3's job, not this AC's."
  - "The symbol tier runs ONLY when (a) the entry has a meaningful anchor (GE-111b-1-i) AND (b) the file-path floor already returned clean for that file (file survives). It must consume, not recompute, the GE-111b-1 file verdict."
  - "Must read the symbol's source from the STAGED blob (git cat-file :path), never the working tree, to stay consistent with the file-path floor and the staged-only scope (GE-111c)."
  - "Must follow the project error handling policy (CLAUDE.md Rules 1-4): wrap the resolver subprocess / ast.parse in try/except SyntaxError|OSError|subprocess.SubprocessError and route a failure into the GE-111b-2-i fail-open path (advisory skip), never a hard block."
  - "Verdict object extends the GE-111b-1 shape with tier: 'symbol', symbol: <name>, and (for moves) suggested_location populated by GE-111b-3."
delivers_to:
  agent: python-coder
  contract: "Per-AC symbol-level verdict object {ac_id, entry, tier: 'symbol', verdict, change_kind: 'moved'|'renamed'|'removed'|null, symbol: str, suggested_location: str|null} consumed by GE-111a and GE-111e; the moved-symbol identity consumed by GE-111b-3"
expects_from:
  ac_id: GE-111b-1
  contract: "The surviving-file confirmation (file-tier verdict == clean) that gates whether the symbol tier runs"
origin_agent: business-analyst
