it_requirements:
  - "FIX THE TEMPLATE, NOT THE BUILD OUTPUT. templates/scripts/commit_guardian/frontmatter_validators.py is the source; scripts/commit_guardian/ and .leafcutter/scripts/commit_guardian/ are regenerated from it by build_commit_guardian's directory copy. An edit applied to a deployed copy alone is reverted by the next build.py run and leaves the template broken while the suite reads green."
  - "ONE ROUTINE, ONE DECLARED ACCEPTED-SHAPE SET, IN EXACTLY ONE PLACE. validate_paths() must obtain its path strings by calling the resolver, not by testing element types inline. GE-118f proves the sharing by admitting a further shape at that single declaration point and observing both consumers move; any second copy of the rule — including an inlined 'fast path for the common string case' — makes that proof fail for a reason unrelated to GE-118f."
  - "THE RESOLVER'S HOME IS SETTLED: scripts/frontmatter_path_resolver.py, a new top-level module in the VERBATIM-COPY tier alongside scripts/knowledge_query.py and scripts/knowledge_frontmatter_reader.py. Decided 2026-09-21 by the user on an architect's recommendation, against the initial instinct to place it in the template tree. THREE REASONS, IN ORDER OF WEIGHT. (1) TIER. templates/scripts/commit_guardian/ is the COMPILED tier -- build_commit_guardian's docstring states that .py files there 'have config placeholders injected' (scripts/build_phases_lifecycle.py:330-331) -- while build_workflow_tools states 'Files are copied verbatim (no template compilation)' (scripts/build_phases_workflows.py:422). This resolver has no config-dependent behaviour, so running it through inject_config() is a category error and a latent hazard: any {{...}}-shaped text in a docstring or a refusal message naming an example shape would be silently substituted. (2) DEPENDENCY DIRECTION. The one existing precedent for a gate sharing a leaf module runs the other way -- check_done_proof.py, inside the commit-guardian template tree, reaches OUT into scripts/ac_store/ via sys.path.insert(0, str(_HERE.parent / 'ac_store')) (check_done_proof.py:143-146). Hosting the resolver in commit_guardian would invert that, making knowledge_query.py -- a standalone CLI and library that never touches a commit -- reach INTO commit-guardian's private template directory. (3) OWNERSHIP. This record's sibling GE-118f declares components: [commit_guardian, knowledge_system] precisely because neither component owns 'resolve a frontmatter entry to paths'. Filing it under one of them asserts an ownership that does not exist. THE COST, ACCEPTED WITH EYES OPEN: the filename must appear in TWO deploy lists (see GE-118f it_requirement 1) and that exact two-place drift already bit knowledge_frontmatter_reader.py. It is accepted because test_guard_source_paths_match_deployable_set fails when the two disagree -- a loud failure, not a silent one."
  - "ALL THREE FIELDS, DRIVEN BY THE path_fields LIST RATHER THAN BY NAME. related_docs, related_code and architecture_diagrams already share one list and one loop. Apply the resolver inside that loop so a fourth field added to the list inherits the rule automatically; do not special-case any field name."
  - "A PATH ERROR NAMES THE PATH AND THE FIELD, AND DOES NOT NAME THE PARSED ELEMENT. For a labelled entry pointing at an absent file the message must contain the path string and the field name and must NOT contain the mapping's Python repr — the reader has to be able to copy the path out of the message and act on it."
  - "REAL-ARTIFACT FIXTURE, NOT A HAND-INDENTED LITERAL (CLAUDE.md, 'Real-artifact behavioral spot-check'; docs/how-to/real-artifact-fixtures.md). At least one test must run against a document whose frontmatter was produced by yaml.safe_dump — PyYAML's own serialisation, block lists at column 0 — and at least one must run against a document already tracked in this repository that uses the bare form. A triple-quoted fixture reproduces the author's own indentation bias; that bias has already hidden one defect of this class here."
  - "THE VERDICT FOR EVERY DOCUMENT THAT PASSES TODAY MUST BE UNCHANGED. The bare string is the form essentially every tracked document in this repository uses, so any change in its verdict is a regression, and the real-artifact arm above is what makes that visible rather than assumed."
  - "ERROR-HANDLING POLICY APPLIES UNCHANGED (CLAUDE.md Rules 1-4). No bare except, no swallowed exception, and no try/except wrapped around the pure classification step: the classification must be total — it returns a refusal for an input it does not accept rather than being prevented from raising by a wrapper."
test_spec:
  - name: test_ge_118d_deployed_guard_accepts_bare_and_labelled_entries_in_all_three_fields
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: ".leafcutter/scripts/commit_guardian/run_hook.py check_doc_frontmatter.py"
    description: "PRODUCTION LAYOUT AND ENTRY POINT. Build into a temp target OUTSIDE this repository, then run the deployed hook as a subprocess against a document whose related_docs holds one bare and one labelled entry and whose related_code and architecture_diagrams each hold one labelled entry, every named path existing. Assert exit zero, no path error for any of the four entries, and no ModuleNotFoundError or traceback on either stream. A source-tree import resolves a different module set and is blind to the deploy gap that reopened GE-118c."
  - name: test_ge_118d_labelled_entry_naming_an_absent_path_reports_exactly_one_error_naming_the_path
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "THE NEGATIVE ARM, which is what separates the fix from unwrapping an element and never checking it. Change one labelled entry to name docs/explanation/absent.md and assert exactly one error, that it names the field and the literal string docs/explanation/absent.md, and that the message does NOT contain the mapping's repr. Asserting only 'an error occurred' passes on an implementation that reports the whole element."
  - name: test_ge_118d_resolver_returns_one_ordered_path_per_accepted_entry
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "Direct on the resolver: a bare string yields that string; a single-key mapping yields its value; a mixed list yields both, in the order declared. Order is asserted because GE-118f compares the two consumers' ordered lists and an unordered resolver makes that comparison vacuous."
  - name: test_ge_118d_verdict_is_unchanged_on_a_real_tracked_document_and_on_a_pyyaml_serialised_one
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Run the guard against a document tracked in this repository that uses the bare form (e.g. docs/known-issues/commit-guardian/open-blocker-ki-cg-008.md) and against a labelled-form document written with yaml.safe_dump rather than as an indented string literal. Assert a verdict is reached on both and that the bare-form document's verdict is unchanged from today's."
test_rationale: |
  Every weaker shape passes on the bug. A test that imports
  frontmatter_validators from the source tree cannot see the deploy gap that
  reopened GE-118c, so the deployed-layout arm is not optional. A test that
  asserts only 'the guard did not crash' passes on an implementation that
  unwraps a labelled entry and never checks the path it names — hence the
  negative arm, which pins the error count at exactly one and pins the message
  to the path string rather than to the element. A hand-indented fixture
  reproduces the author's own serialisation bias; PyYAML writes block lists at
  column 0 and that difference has already produced a green suite over a
  complete no-op in this repository, which is why one arm builds its fixture
  with yaml.safe_dump and one reads a document already on disk.
delivers_to:
  agent: python-coder
  contract: "STEP 1 OF THE CHAIN — the producer everything else in this feature consumes. One importable entry-shape resolver taking a single element of a path-bearing frontmatter field and returning either the one path string it denotes or a named refusal carrying the field, the entry as parsed, and the accepted-shape set. Three outcomes only: accepted-bare, accepted-labelled (single-key mapping whose value is a string), refused-by-name. Accompanied by the accepted-shape set itself, declared in exactly one place so that admitting a further shape is a one-line edit at that point. Consumed by GE-118d-1 and GE-118d-2 (refusal arms), by GE-118f (second consumer plus the agreement property), and — through GE-118f — by KM-KGS-100d-3 in scripts/knowledge_query.py. GE-118e publishes the accepted-shape set and the refusal message as prose."
