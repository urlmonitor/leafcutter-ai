notes: |
  GAP 3 OF THE 2026-08-17 FAST-LANE PASS, PART TWO OF TWO. Twin of BO-2400e-3. Both are
  properties of one write; they are separate ACs because survival and noise are
  different guarantees and an implementation can deliver either alone. Note the
  sequencing: this AC depends on BO-2400e-3 because whatever durable-write design lands
  there is the mechanism that must also preserve the record's shape. Landing this one
  first would specify the shape of a writer that BO-2400e-3 then replaces.

  VERIFIED EVIDENCE (2026-08-17, do not re-investigate).
  scripts/build_orchestration/fast_lane.py:98-125, function _update_ac_work_status:

      with yaml_path.open("w", encoding="utf-8") as fh:
          yaml.safe_dump(data, fh, allow_unicode=True)

  The serialiser sorts keys by default, so every write alphabetically re-keys the whole
  record. It is called three times per requirement per run — line 203 (in_progress),
  line 261 (todo), line 376 (done) — so an eleven-member build set produces roughly
  thirty whole-file rewrites.

  WHY THIS IS WORTH AN AC AND NOT JUST A TIDY-UP. Three compounding consequences:
    - It buries the real change. A reviewer looking at a fast-lane commit sees a record
      reshuffled from top to bottom and cannot tell that one value moved. BO-2400e-2
      requires that each commit's claims be verifiable in its diff; this behaviour makes
      that impossible for every progress commit the lane produces.
    - It manufactures conflicts. Whole-file rewrites of shared store records collide
      with any concurrent authoring in the same folder — a recurring hazard in this
      workspace, where requirement authoring routinely runs alongside builds.
    - It multiplies the blast radius of BO-2400e-3's defect. A write that rewrites every
      line is a write with far more to lose when it is interrupted.

  STATED AS BEHAVIOUR ON PURPOSE. The criteria describe what the record looks like
  before and after, and say nothing about serialiser options, round-trip loaders or
  in-place editing. Any of those may be the right answer; that is the IT PO's call.

  TESTABILITY WARNING — THIS IS THE ONE THAT WILL BE FALSE-GREENED. A test that loads
  the record after the update and compares parsed values passes on the current
  behaviour, because a re-keyed record parses to an equal mapping. The assertion must be
  textual, and the fixtures must be real records copied from the store, for the reason
  CLAUDE.md's real-artifact rule records: synthetic fixtures reproduce the bug-hiding
  bias. A short, uniformly-quoted hand-written record survives re-serialisation almost
  unchanged; the store's actual records, with their block-scalar notes and mixed
  quoting, do not.
