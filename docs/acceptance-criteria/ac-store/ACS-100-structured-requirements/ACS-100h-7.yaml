id: ACS-100h-7
title: "Epic scaffolding validates AC-tree limits before generating any ticket stub"
component: ac-store
level: L2
status: superseded_by
req_status: active
work_status: todo
criteria: |
  Given an author triggers /create-epic to scaffold a new epic whose deliverables
    would add ACs (or ticket stubs deriving from ACs) under a target AC subtree,
  When the scaffold step runs, BEFORE any Master_Plan or ticket stub file is written,
  Then it evaluates the AC-tree structure limits for the target subtree using the
    same ID-derived parent child-counting rule the check-ac-tree-limits pre-commit
    hook applies (max direct L1 children under an L0, max direct L2 children under
    an L1; honouring any child_limit_override on the parent),
  And if a limit violation exists, no ticket stub file is generated and the
    scaffold is blocked with an error directing the author to split the AC tree
    first (via the ac-tree-split procedure),
  And if no violation exists, scaffolding proceeds to stub generation as normal.

  This prevents mid-drive structural renames (e.g. GE-100d/e/f -> GE-101a/b/c)
  that would force renaming YAML files and updating implemented_by / depends_on /
  covered_by references across downstream tickets after stubs already exist.
