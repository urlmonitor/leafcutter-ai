it_requirements:
  - "The change must land under templates/. The deployed workflow is build output."
  - "Provenance -- where the answer came from -- must be the discriminator. The answer's content must not be inspected to decide whether to accept it. Any content-based test is re-implementing the defect with a longer regex: the agent gets better at sounding like a user and the bug returns."
  - "Hardening the answer parser does not satisfy this record and must not be offered as satisfying it. resolveGate already pauses on a null or unparseable answer; the observed loss came from a well-formed answer that passed every shape check."
  - "A refused answer must leave the run waiting, not failed, and must leave the record on disk. The person is still owed the question."
  - "The recorded reason must name provenance. Recording 'could not understand the answer' for an answer that was perfectly well formed is how this defect stayed invisible for a whole run -- the journal showed a clean decision."
  - "The accept-and-refuse pair must differ only in origin. If accepting an answer requires it to carry anything the refused answer could not also carry, the pair is not a controlled comparison and the record is not proved."
  - "Must satisfy the repository error-handling policy on the channel interaction."
test_spec:
  - name: test_well_formed_answer_not_from_the_person_is_refused
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      An answer that is well formed and names a valid choice for the waiting decision
      but did not originate from the person is not carried out -- no step after the
      decision point executes and the named choice takes no effect on disk.
  - name: test_identical_answers_differing_only_in_origin_produce_opposite_outcomes
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      Two answers byte-identical in content, one arriving from the person's channel and
      one not; the first is carried out and the second is refused. The only variable is
      origin.
  - name: test_refusal_records_provenance_as_the_reason_not_unparseable
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The recorded reason for the refusal states that the answer did not come from the
      person, and does not state that the answer could not be understood.
  - name: test_refused_answer_leaves_the_run_waiting_with_its_record_on_disk
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      After the refusal the run is still at the decision point, its record is still
      present, and the drafted work is byte-identical.
test_rationale: >-
  The pair assertion is the whole proof and it is why the last Then clause is written as
  a pair. Two answers identical in content and differing only in origin must produce
  opposite outcomes; a test built that way cannot be passed by a parser change and fails
  on any implementation that inspects the text instead of the source. Everything else in
  this record is satisfiable by accident -- a run that refuses everything passes the
  first, third and fourth assertions. The known issue's own fix direction, hardening the
  parser, closes nothing: resolveGate already pauses on a null or unparseable answer, and
  the observed refusal was well-formed JSON carrying a valid action plus a paragraph of
  explanation, which satisfied both the parse check and the valid-explicit-decision test
  and was accepted as the user's choice.
