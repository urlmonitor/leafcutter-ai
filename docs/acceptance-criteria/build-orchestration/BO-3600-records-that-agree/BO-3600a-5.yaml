id: BO-3600a-5
title: "A reference entry states what makes a conflict, and what a clean result does and does not assert"
component: build-orchestration
components:
  - documentation_system
  - ac_store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given someone reading a reported conflict for the first time,
  When they look up the reference entry for the reconciliation,
  Then it states the condition that raises a conflict — an open fault naming a
    requirement that reads finished — and states that neither half alone raises one,
    And it states that the reconciliation does not decide which record is wrong, and
      where that decision is recorded instead,
    And it states what a pairing reported as undecided means and what to do about it.

  Given the reference entry,
  When the conditions it documents are reproduced against a real store,
  Then the reconciliation behaves as the entry says it will,
  So the entry is verified against the behaviour rather than against an intention.

  Given the reference entry,
  When a reader looks for what a run reporting no conflicts asserts,
  Then it states that a clean result asserts only that every pairing the run could
    examine was examined and none disagreed,
    And it states that a run which could not examine everything reports that rather
      than reporting clean,
  So a clean result is never read as a guarantee the two records agree everywhere.
