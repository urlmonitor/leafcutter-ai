criteria: |
  Work finishes, space comes back -- nothing piles up behind you.

  Every run that does work on your behalf tidies up after itself as soon as its
  work is safely handed over for review, not days later when someone remembers to
  run a separate wrap-up step. Its workspace, its supporting material and its
  temporary files all go with it, leaving nothing behind anywhere on the machine,
  while work that never reached the team is always kept. Whatever does slip through
  is swept up routinely, and you are warned long before space runs out.
