    relationship: describes
    status: exists
  - path: docs/architecture/components/worktree-manager.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "A drive whose working copy would live on a non-native-POSIX filesystem (e.g. /mnt/c DrvFs, network share, portable/removable drive) MUST be refused before any working copy is created — native-POSIX-FS precondition per ADR-018 Operational note (these weaken rename atomicity / fsync durability and produce 0-byte objects independent of concurrency)."
  - "The refusal message MUST name the offending path and state that isolation requires a native POSIX filesystem (ext4/btrfs/xfs); default behavior is a hard refusal."
  - "Filesystem-type detection failures MUST be handled per the project error handling policy."
delivers_to: null
expects_from:
  ac_id: BO-1800a-1
  contract: "The per-drive object-store durability guarantee this precondition protects."
