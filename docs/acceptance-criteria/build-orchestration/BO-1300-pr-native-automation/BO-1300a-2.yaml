assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "Surface is agent/skill prose: idempotent open-or-update logic lives in templates/agents/pull-request.md (gh pr list --head <branch> then gh pr create vs reuse) and is already partially present; harden it so an existing open PR is updated, never duplicated."
  - "MODIFY existing workflow item: generalize the EMU 'open epic PR before drive' note in CLAUDE.md / templates/skills/building-epics/SKILL.md into a first-class up-front step — the /build-feature (build-feature.js) + ticket-supervisor flow opens (or detects) the epic PR before the first ticket, rather than relying on the manual pre-drive checklist. This is a workflow change to the build-feature entrypoint, NOT a new agent."
  - "Must be idempotent across re-runs: detect an existing open PR via gh pr list --head <branch> --base main and reuse its number; running the phase twice must leave exactly one open PR."
  - "Base branch must be the repo default resolved dynamically, not hard-coded; the head is the BO-1300a-1 working branch."
  - "Respect the EMU constraint already documented: under an Enterprise Managed User account gh pr create is blocked — the up-front-PR step must detect a pre-existing PR and push to it rather than failing on create."
delivers_to:
  agent: python-coder
  contract: "An open PR number + head/base refs for the working branch into main; consumed by BO-1300b-1's poller (which reads that PR's required checks) and by the BO-1300a-3 merge step"
expects_from:
  ac_id: BO-1300a-1
  contract: "A named non-main working branch pushed to the remote"
