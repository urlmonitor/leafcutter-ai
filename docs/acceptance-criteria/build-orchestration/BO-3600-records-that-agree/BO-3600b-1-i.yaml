notes: |
  A partial delivery is the most likely way an entry gets retired while still
  describing something broken: three of four subjects land, the entry looks handled,
  and the fourth finding disappears with it. The register's real entries routinely
  name several requirements, so this is the common shape rather than a corner.

  The third scenario keeps the unresolvable-reference case on the safe side of the
  asymmetry: unknown is treated as undelivered for the purpose of retiring, which is
  the opposite of how BO-3600a-1-i treats it for the purpose of raising a conflict,
  and deliberately so — the costs point in opposite directions.
