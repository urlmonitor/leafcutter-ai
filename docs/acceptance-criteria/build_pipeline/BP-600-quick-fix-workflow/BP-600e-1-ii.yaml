notes: |
  Authored by /quick-fix. Root cause: The fix prompt tells the agent to report
  everything from `git status --porcelain` without telling it which files the
  workflow itself already created, and the guard then trusts extra_files
  verbatim. SKILL.md's Phase 3.5 already specifies that the AC YAML(s) and the
  test file are expected additions and must be ignored. Fix: name the expected
  paths (ac_path, parent_ac_path, testFile) in the prompt as files the agent
  must exclude, and filter those same paths out of extra_files before deciding
  whether to halt, so a halt happens only for a genuine third-party file.

  Placement: filed as a child of BP-600e-1 rather than as a fourth L2 under
  BP-600e, because BP-600e-1's own criteria already excludes "the test file and
  AC YAML" from the file count — this record is the technical constraint that
  makes that clause hold against a self-reporting agent, not a new guardrail
  behaviour. It is the exact shape of its sibling BP-600e-1-i, which carves out
  auto-formatted files from the same count. BP-600e had 3 of 5 L2 slots used at
  authoring time, so no cap forced the choice.
