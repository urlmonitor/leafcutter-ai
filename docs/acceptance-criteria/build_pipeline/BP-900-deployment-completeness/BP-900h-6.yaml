assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment: null
  reference_file_path: .github/workflows/ci.yml
  n_location_rule: "1 — a use-the-install step inside the existing consumer-simulation job"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "ATTEMPT A REAL COMMIT. Invoking a guard script directly, or running the hook framework against a file list, does not cover this: both prove the script works and neither proves the commit path reaches it. Initialise a git repository in the built project, stage a real file, and run the ordinary commit."
    - "The staged change must be something a new adopter would actually have — the project's own skills_config.json, or a README the adopter writes. Do not stage an artifact from one of the numbered namespaces; that tests the guard's subject rather than the adopter's first commit."
    - "The project must be built from an empty directory and must NOT have the opt-in documentation-seeding step run. Copying this repository, or seeding it, reintroduces exactly the content whose absence is the condition under test."
    - "THE EXECUTED-GUARD RECORD IS NOT OPTIONAL AND IS THE HARD PART. A commit that completes because every guard is unregistered looks identical to a commit that completes because every guard passed, and that is the state four guards in this repository are in today. Capture which guards the commit path actually ran — the hook framework's own per-hook reporting is the natural source — and fail the job on an empty record."
    - "Demonstrate the job can go red before accepting it green: introduce a guard fixture that blocks over content a new project lacks and confirm a non-zero result. A green step that would stay green on an adopter-blocking guard is the phantom-done failure this branch exists to prevent, and the repository has shipped that exact shape in its own gate code."
    - "No continue-on-error, and no condition that skips the step on pull_request events. Registering this job among the required checks is BP-900h-3's scope and is not re-decided here; this AC only requires that the new step cannot pass while the commit fails."
    - "ONE ENTRY POINT FOR THE JOB AND ITS TEST (IT-PO 2026-08-25). The workflow step must not inline the logic as a shell block: put the stage-and-commit-and-record behaviour in a single invocable script (scripts/ci/ is the established home for merge-gate-only tooling and is correctly source-only per BP-1000d-1), and have the ci.yml step call it with no logic of its own beyond arguments. Otherwise every unit test written for this AC exercises a COPY of the job rather than the job, and the step itself stays unverified — which is the same one-surface-tested-other-surface-shipped shape as a guard registered in the manifest the install ignores. The workflow step and the test must reach the same code."
    - "THE EXECUTED-GUARD RECORD IS A CAPTURED OBSERVATION, NOT A DERIVED ONE. Read which guards ran from what the commit path itself reported during the commit — never by re-parsing the deployed registry and assuming everything listed executed. A record derived from the registry is exactly as green on an unwired install as on a wired one, which reproduces the defect the record exists to detect. If the hook framework's per-hook reporting is unavailable in the job's environment, that is a blocker to raise, not a licence to derive the record."
    - "REPORT THE RECORD, AND MAKE THE EMPTY CASE LOUD. The three outcomes — every guard that ran passed, no guard ran at all, and a guard blocked — must be three visibly distinct job outputs, with the guard names printed in the first two cases. A job that prints only a pass/fail verdict satisfies the failure condition and loses the diagnostic the criterion is actually asking for."
    - "IDEMPOTENT AND SELF-CLEANING. The step runs inside the same job and workspace BP-900h-1 built into, and BP-900h-2 asserts install idempotency over that tree. Git-initialising the project and committing into it must not leave state that makes a re-run of the surrounding job behave differently, and must not be mistaken by BP-900h-2's idempotency comparison for install drift. Sequence the step after the idempotency assertions or isolate its artefacts explicitly — do not leave the interaction unstated."
    - "RE-RUN OBLIGATION, RECORDED HERE SO IT SURVIVES THE TICKET. GE-122d-6 declares this AC in its depends_on and is not signed off until this job has been re-run green against a build that carries the commit-time uniqueness registration. Do not weaken this step to make that later registration pass — if the registration turns this job red, the registration is what is wrong."
  notes: |
    Added 2026-08-25. BP-900h-1 and BP-900h-2 stand the install UP and inspect the resulting
    tree; nothing in this branch yet USES it. The distinction is not academic: the guards a
    consumer install deploys only speak when a commit is attempted, so a defect in which a guard
    blocks an adopter over content a plain install never creates is invisible to every static
    check in BP-900a..BP-900h-2.

    Two known conditions this step is sized against, both already filed: KI-BO-030 (the install
    does not scaffold two of the four namespace roots) and the four commit-guardian checks that
    are deployed and registered nowhere. The first would surface here as a blocked first commit;
    the second as an empty executed-guard record.
test_spec:
  - name: test_bp900h6_adopter_first_commit_completes_in_a_from_empty_install
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: deployed
    description: "A project built into an EMPTY directory holding only a minimal skills_config.json, with no opt-in documentation-seeding step, is git-initialised and an ordinary adopter change is committed through the ordinary commit path — no skip flag, no environment override, no direct guard invocation — and the commit completes. Runs the same entry point the ci.yml step invokes."
  - name: test_bp900h6_executed_guard_record_is_captured_from_the_commit_itself
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "The record of which guards ran is read from what the commit path reported during that commit, and is non-empty. Goes red if the record is derived by re-reading the deployed registry, because a derived record is identical on a wired and an unwired install."
  - name: test_bp900h6_empty_executed_guard_record_fails_the_job
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A simulated commit in which no guard executed produces a non-zero job result, so an install in which nothing was wired is never reported as a successful adopter experience. Must-block case."
  - name: test_bp900h6_adopter_hostile_guard_fixture_turns_the_job_red
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A guard fixture that blocks over content a brand-new project legitimately lacks makes the job fail, naming the guard that blocked and the content it demanded. This is the can-it-go-red demonstration: without it the step is a green box that would stay green on the exact defect it exists to catch."
  - name: test_bp900h6_nothing_ran_is_reported_differently_from_everything_passed
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The output of a commit that completed because every guard that ran passed is compared with the output of a commit that completed because no guard ran, and the two are visibly distinct, with guard names printed. Both commits succeed, so exit status alone cannot separate them."
  - name: test_bp900h6_ci_step_has_no_continue_on_error_and_no_pull_request_skip
    target_dir: unit_tests/portability/
    framework: unittest
    type: unit
    angle: real_artifact
    description: "The consumer-simulation job's use-the-install step is read from the actual .github/workflows/ci.yml the runner parses: it carries no continue-on-error and no condition that skips it on pull_request events. Asserted against the real on-disk workflow, never a hand-typed fixture."
  - name: test_bp900h6_workflow_step_and_test_invoke_the_same_entry_point
    target_dir: unit_tests/portability/
    framework: unittest
    type: unit
    angle: seam
    description: "The command the ci.yml step runs resolves to the same script these tests invoke, and the step carries no logic of its own beyond arguments. Goes red if the job's behaviour is inlined into the workflow, in which case every other descriptor here would be testing a copy of the job rather than the job."
test_rationale: "The whole branch has shipped seven consumer-install defects while every static deployment check stayed green, and the reason is structural: a guard only speaks when a commit is attempted, so a job that builds an install and inspects the tree cannot see it. The contract is therefore a real `git commit` in a real from-empty install, not a guard invocation and not a tree inspection. Two descriptors exist purely because a green result here is worth nothing on its own — the adopter-hostile fixture proves the step CAN go red, and the empty-record case proves it fails when nothing was wired, which is the likeliest first implementation and precisely the state four guards in this repository occupy today. The captured-not-derived descriptor is separate because deriving the executed-guard record from the deployed registry produces an identically green job on a wired and an unwired install, silently converting this AC back into the static check it was created to replace. The last two descriptors are asserted against the real ci.yml rather than a fixture, because the failure mode they guard — a step that is skipped on pull_request, or whose logic lives inline where no test reaches it — is a property of the file the runner actually parses."
