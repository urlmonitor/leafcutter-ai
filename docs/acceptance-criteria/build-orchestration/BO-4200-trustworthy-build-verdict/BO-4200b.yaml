criteria: |
  Every all-clear states its own reach, so it is never read as wider than it was.

  A result that says the work passed also says what was examined to reach that
  conclusion. Nothing the run hands over — what you read at the end, and what
  travels with the delivered change — claims more certainty than the checking it
  actually did.
