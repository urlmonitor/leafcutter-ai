criteria: |
  Given the capability-to-automation connection checks are in place,
  When a reader consults the architecture documentation for how operator-facing
    capabilities reach the automation that runs them,
  Then a component diagram shows the command surface, the automation that invokes it,
    and the checks that connect them,
    And it shows the two checks as separate arrows in opposite directions — registered
      capability to caller, and caller to registered capability — rather than one
      bidirectional link,
    And it marks the source of each check's inventory: the built command surface for
      the registered capabilities, and the automation's own invocations for the callers,
    And it shows the recorded exemption as an input that removes an item from a
      check's scope, with the item still visible rather than absent,
    And it distinguishes this capability-to-caller connection from the byte-parity
      check between a source script and its shipped copy, and from agent-registry
      reciprocity, so a reader does not take the three for one mechanism.
