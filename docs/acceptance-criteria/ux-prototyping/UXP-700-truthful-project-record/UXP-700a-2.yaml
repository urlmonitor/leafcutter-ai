id: UXP-700a-2
title: "The record rebuilds itself from zero artifacts with no hand-written index"
component: ux-prototyping
components:
  - ux_prototyping
level: L2
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a record whose artifact places exist and are empty and whose store index is absent,
  When the record's generator runs,
  Then a store index is written declaring zero artifacts, holding an empty entry for every
    derived lookup it maintains,
  And running the generator a second time with no artifact added writes nothing further,
  And the record's checker then reaches a verdict against that index without any file having
    been authored by hand.
depends_on:
  - UXP-700a
