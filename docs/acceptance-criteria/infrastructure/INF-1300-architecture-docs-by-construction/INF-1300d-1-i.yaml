notes: |
  WHY THIS IS AN L3. It adds no behaviour of its own. It constrains where INF-1300d-1's
  already-specified acceptance decision gets its answer from, and that is a property no
  single request can reveal: a producer holding its own copy of today's eleven names and a
  producer reading the declaration behave identically on every request anyone will make
  today. They differ only across a change to the declaration, which is why the criteria are
  written as three before-and-after pairs rather than as assertions about one run.

  THIS IS THE SAME CONSTRUCTION INF-1200c-1 AND BP-900c-4-i ALREADY SETTLE, REUSED. The
  general principle those records pin is that a value claimed to be derived from an input
  must be observed to MOVE when that input changes, because a hard-written copy passes every
  single-run assertion. The subject here is different and the construction is not reinvented.

  WHY IT MATTERS PARTICULARLY HERE. The vocabulary has already moved once — that is how it
  came to contain a retired alias — and INF-1300b-2 derives the explanatory key from the same
  declaration, INF-1300a-4 enumerates its membership, and INF-1300d-1 decides refusals from
  it. Four records in this tree take that declaration as their source of truth, so a private
  copy anywhere would put the tree quietly out of step with the project at the next change,
  in four places at once, with every observation still green.

  THE LAST CLAUSE COVERS THE OBSERVATION AS WELL AS THE WORK, AND THAT IS DELIBERATE. A test
  that enumerates today's eleven names has re-created the private copy inside the test suite:
  it will keep passing after the vocabulary moves, and it will report that the producer reads
  the declaration when the producer does no such thing. This is the recorded failure mode of
  the count-pinned surfaces in this project's own history.

  FALSIFIABILITY. Three paired runs against a scratch copy of the declaration. Add a kind,
  change nothing else, request it — falsified if it is refused. Mark a kind retired, change
  nothing else, request it — falsified if the substitution does not appear. Remove a kind,
  change nothing else, request it — falsified if a document is produced. Then sweep both the
  producer and the observation for any kind name written as a literal — falsified if one is
  found. The removal arm is the one that most often fails: a producer may read the
  declaration to learn about additions and still carry a private floor of names it always
  accepts.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale, delivers_to and expects_from. Those are the IT PO's.
