notes: |
  AUTHORED 2026-09-01 (product-owner) against KI-BO-20260831-1932. Read the whole
  block before decomposing; the obvious decomposition is wrong in three named ways
  and one earlier ruling on this defect has been overturned.

  A RULING OF MINE WAS OVERTURNED — recorded because the discarded version is the
  attractive one and someone will re-derive it. An earlier pass framed this record
  as "the completion write must honour the exclusion list it was handed", on the
  reasoning that the driver's own computation is already correct
  (requiredPhasesForCompletion, build-feature.js:668-677, does subtract the
  deferred phase, and concludeTicket :1040-1057 does pass only the reduced list).
  That reasoning is sound about the driver and wrong about the remedy. A writer
  that accepts the caller's exclusion list has stopped checking the caller, and
  catching a run that wrongly excluded a step is the only thing the writer was
  ever for. It fixes the visible symptom by deleting the guard. KI-1932 says the
  list must come FROM THE RECORD and KI-1932 is right. Do not reinstate the
  earlier framing; TKT-600b-4 states the underlying principle and this record is
  bound by it.

  THE SPLIT IS TWO DOORS IN ONE PROMPT, NOT AGENT CAPRICE. This is the finding to
  build on. writeTicketCompletion dispatches a status-checker with a prompt that
  does both of these at once: it names the confirmed phases, and it says "Edit the
  ticket's frontmatter so that status: reads done". Two routes follow from one
  instruction:
    - the mandated route, set_ticket_status.py, which runs the agents-parity check
      and refuses on any `needed` entry (:387-391);
    - the literal route, a direct Edit of the frontmatter, which touches no check
      at all.
  The three observed tickets were in identical states; the refusal came from the
  first route and the two `done` writes from the second. That is why the outcome
  looked arbitrary, and it is why a fix expressed only as better prompt wording
  cannot hold: the criteria must require ONE door, or convergence is unenforceable
  and the next prompt edit reopens it.

  THE SCRIPT IS IN SCOPE, NOT ONLY THE PROMPT. Two properties of
  set_ticket_status.py bear on this and neither is currently specified anywhere:
    - it has NO exclusion parameter. `--force` is the only override and it
      bypasses the transition allow-list as well as the parity check (:466), so it
      is not a surgical escape and must not become the routine close path. A
      decomposition that "converges" the two doors by having the writer always
      pass --force has recreated the lenient branch with a flag on it.
    - nothing makes it the only writer. BO-400b already states that intent at L1
      and its three L2 children never enforce it; the completion write's own
      prompt is the counter-example, in the repository, today.

  THE THREE WRONG FIXES.
    1. TRUST THE CALLER. Take the exclusion list as given and stop reading the
       record. The overturned framing above. Removes the guard.
    2. FIX ONLY THE REFUSAL. Make the strict path stop refusing and leave the
       lenient path alone. Leaves the phantom-done write intact and now
       unremarkable, since it would no longer contradict anything. The lenient
       branch is the worse of the two: it wrote `done` onto a ticket whose
       source AC still read work_status: todo, which check-ticket-ac-status-parity
       then had to catch at commit time.
    3. CONVERGE BY LOOSENING. Unify the two doors on the permissive answer, by
       --force or by dropping the parity check. Converges, and converges on the
       answer that makes every completion decision worthless.
  The criteria are written so that all three fail: the guard reads the record, the
  refusal is preserved, one door, and the strict answer named explicitly.

  RELATIONSHIP TO BO-400a-2-i — RATIFIED AND UNIVERSALISED, not amended, not
  bounded. BO-400a-2-i (todo, reviewed) specifies the script refusing `--status
  done` whenever the agents map carries `needed` entries, down to the exact
  message. Under this criterion that rule is exactly right and stays untouched.
  The defect it does not reach is that it governs ONE writer while a second writer
  exists that never invokes it. This record makes BO-400a-2-i's rule the only
  behaviour available rather than one of two, so the two records agree and neither
  needs editing. (An earlier pass proposed narrowing BO-400a-2-i to admit an
  excluded phase; that proposal is withdrawn with the framing that produced it.)
  BO-400a-2-ii is likewise ratified: its trigger — every needed phase carries a
  sign-off in the record — is the correct one.

  THERE IS NO WRITER-SIDE RESCUE, and the population is far larger than reported.
  This record does not unblock a single existing ticket; it makes the block
  reliable. Measured on this worktree's branch today: 333 tickets under
  tickets/00_inbox/epics/ carry `pull-request: needed`, of which 316 are not yet
  done, spread across 24 epic folders. The hand-correction the register cites
  (9682d6adf, 25 tickets) exists ONLY on branch
  EPIC-StartingNewWorkTheProperWayAlways and is not on this branch — `git branch
  --contains` names that branch and no other, and all 25 of those tickets still
  read `pull-request: needed` here. So the "already corrected" population is not
  corrected on main. Once this criterion lands, every one of those 316 halts
  reliably at completion instead of two-in-three slipping through. That is the
  correct behaviour and it is also a large, immediate operational cost that the
  owner must plan for. Two things are needed and NEITHER belongs in this record:
  a one-time correction of the existing population (a repair with a ticket, not a
  standing guarantee), and a pre-dispatch check that catches a record demanding a
  step the drive will not run BEFORE a drive spends hours on it — which is the
  BO-1900 routing the BA originally proposed and an earlier pass of mine overrode.
  That override is withdrawn.

  PARENT CHOICE — BO-400, moved here from BO-2700, and the move is the point.
  An earlier pass filed this under BO-2700 (defer epic PR) on two arguments, both
  of which the corrected direction destroys:
    - "BO-2700's L0 already contemplates the record side." It does, and under the
      corrected direction that side is TKT-600b's job — make an epic member's
      record say not_needed. This record contains nothing PR-specific at all.
    - "BO-400 is disqualified because BO-400a-2-i would contradict it." It no
      longer contradicts; it is ratified. The disqualifying reason is gone.
  Containment test, applied again: remove the epic-PR deferral entirely and this
  criterion still has a subject — two doors to the completion write, one guarded,
  is a defect for any needed step. It is therefore not BO-2700's. BO-400 owns the
  recorded lifecycle state and the write path to it (BO-400a-2 the done-write,
  BO-400b the single script), and BO-400b states this record's own requirement as
  an unenforced intent. Fifth L1 under BO-400 (a, b, c, d, e), within the seven
  cap; BO-400b holds three L2s of five and was not chosen because the missing
  guarantee is about every OTHER writer, not about the script's own behaviour, and
  because an L1-level promise is what BO-400b's unenforced clause needs.
  Also rejected: BO-3600 (detects two records disagreeing — the disagreement here
  was detected loudly, the question is which record is authoritative); BO-3100 (a
  step that did not run counted as passed — here the step is agreed not to have
  run); BO-2500 (proof the WORK is done, from tests — presupposes this write);
  a new L0 (would restate BO-400's own promise).

  DECOMPOSITION GUIDANCE FOR THE BA. Four separable behaviours; the second and
  fourth are the ones a decomposition drops:
    (a) the completion decision is taken from the record's own list of demanded
        steps, and the caller's list cannot narrow it;
    (b) the guard still refuses — an unaccounted-for demanded step blocks the
        write. Its own child, or (a) gets built as "trust the caller";
    (c) one door — every write of the finished state goes through the checking
        mechanism, the direct-edit route is unavailable, and the blanket override
        is not reachable as the ordinary close path;
    (d) determinism — several tickets in the identical state in ONE run all get
        the same answer. A single-ticket test cannot see this defect at all,
        because either branch looks correct in isolation; the defect IS the
        disagreement between two tickets, and the test must be written that way.
  Both twins (build-feature.js, build-ticket.js) in one change, per BO-400a-2-ii's
  standing constraint. Verify by execution, never by grep: the parity check, the
  prompt and the phase-list code are all already present in the source, so a
  structural test passes on the broken driver.
