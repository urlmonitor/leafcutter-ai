notes: |
  Amendment provenance (2026-08-24): amended in place, not superseded, per
  docs/how-to/ac-traceability-store.md ("an amendment changes the criteria text
  or corrects a field on an AC that already exists; the AC ID does not change").
  Supersession in this store is reserved for replacement by a new record under a
  new id, which would have required renumbering this one.

  Original note, retained for lineage: "Authored by /quick-fix. Root cause:
  guard unconditionally rejects main/master instead of prompting user for
  confirmation." The fix that note describes — prompting instead of rejecting —
  is the behaviour this record no longer specifies. Both the original rejection
  and the prompt were wrong for the same underlying reason, which neither
  diagnosis reached: the problem was never what to do about being on main, it
  was that the workflow had no way to get off it.

  This record has no covering test. It is the protected-branch AC that
  CLAUDE.md's "In-Place Workflow Specs" rule requires, and the rule exists
  because this exact criterion was missing at ship time and had to be added
  post-merge. Leaving it untested repeats the shape of that miss at one remove;
  a test asserting that a main/master cwd routes to self-isolation is the
  obvious backfill.
