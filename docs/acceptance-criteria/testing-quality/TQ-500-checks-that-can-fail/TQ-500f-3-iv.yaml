it_requirements:
- Edit the ticket-level phase algorithm in templates/skills/building-epics/SKILL.md, and templates/agents/ticket-supervisor.md
  only where it restates it. Make this one llm-expert change with TQ-500g-1-vii.
- 'Instruction: between the test-writer phase and the first coder dispatch, including on resume when test-writer
  is already signed_off, run the same CLI /build-feature uses: fast_lane.py heavy_lane_gate with --source-ac,
  the worktree as --test-root, and --ac-root. On gate_passed false, report the ticket as blocked with
  the reader''s JSON verbatim, and dispatch no coder. The test writer''s red_baseline_verified or sign-off
  is never a substitute.'
- Call the gate CLI with the record option TQ-500g-1-viii adds, naming this ticket. The CLI ITSELF then
  writes its verdict to the ticket's record under the worktree's git directory. The supervisor never writes,
  edits, paraphrases or summarises that record, and never substitutes its own account of the verdict.
- 'K3 (no source_ac): still call heavy_lane_gate with no ids. It returns and records ''red-baseline reader
  not applicable: no source requirement''. Then continue to the coder.'
- Tickets WITH source_ac get every existing halt reason of the shared reader (for example no_new_covering_tests).
  That is the carried-over TQ-500f-3-ii user decision.
- Ship in ONE change together with TQ-500f-3-iv / TQ-500g-1-vii (the paired prompt) and TQ-500g-1-viii
  (the backstop). Without -1-viii the instruction names a record option that does not exist. Without the
  instruction, -1-viii blocks every /build-epic commit.
test_required: false
test_rationale: 'Prompt-only, for the same reasons as TQ-500g-1-vii. The reader is deterministic and already
  tested (TQ-500f-3-i, TQ-500f-3-ii). Mechanical backstop: TQ-500g-1-viii blocks the commit of a /build-epic
  ticket whose red-baseline record is missing or unreadable. Substitutes: pr-reviewer against the Then
  clauses, and a live /build-epic drive of a fixture epic with K1 to K3.'
