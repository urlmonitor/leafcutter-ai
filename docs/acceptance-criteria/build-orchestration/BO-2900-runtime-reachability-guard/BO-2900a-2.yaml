it_requirements:
  config_schema_fragment:
    reach_record:
      type: object
      description: "One record per (proof test, code under proof): { test_nodeid: str, target: '<module>:<callable>', entry_point: '<module>:main'|null, entered_entry_point: bool, reached_through: bool, observation_ok: bool }. reached_through is true only when target was entered while an entry_point frame was an ancestor on the same call stack."
  reference_file_path: "scripts/ac_store/done_proof.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "Create scripts/ac_store/run_observer.py exposing observe_test_run(test_nodeids, *, targets, entry_points) -> list[ReachRecord], and call it from done_proof.py's existing pytest-invocation path (_run_pytest_and_parse, scripts/ac_store/done_proof.py:206) so the proof is observed on the run that already happens — do not add a second pytest run per AC."
    - "THE MECHANISM MUST BE EXECUTION-DERIVED: a call-level recorder installed for the duration of the proof run (sys.monitoring on 3.12+, sys.setprofile fallback). No code path in the observer may read, parse, tokenize, import-for-inspection, or regex the test file's source. Decoy-immunity is then a property of the mechanism, not a filter that has to enumerate comment/docstring/dead-helper forms."
    - "Records must be attributable to a SPECIFIC test, not to the run as a whole (pytest dynamic contexts, or one observed subprocess per test file). A run-level record makes every test in a file inherit the reachability of its most thorough sibling."
    - "SELF-VALIDATION, FAIL LOUD. The recorder must confirm it observed at least one frame; an observation that recorded nothing returns observation_ok: false and is reported as 'observation unavailable', never as 'did not reach'. An observer that silently records nothing makes every test look like test Q and blocks the whole store; one that records everything makes every test look like test P and restores the original defect. Both are silent failures unless this flag exists."
    - "Overhead budget: the recorder must be installed only around the proof run and must not more than double the wall-clock time of a single-file proof run; done_proof already invokes pytest per AC in the required CI gate."
    - "scripts/ac_store/run_observer.py MUST be added to build_ac_store's deploy_map (scripts/build_phases.py:794) in the same change, or the deployed check_done_proof hook and the required CI done-proof job crash with ModuleNotFoundError."
