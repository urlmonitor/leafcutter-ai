criteria: |
  Scenario: Publish only writes under docs/decisions/ and makes no commit, push or merge
    Given run run-2fbb4ef43b1345f6 staged the decision record dec-ef8ddcb79d668a67, and a git
      checkout whose docs/decisions/ does not yet hold that record,
    When a person runs python -m kernel decisions publish --run-id run-2fbb4ef43b1345f6 in that
      checkout,
    Then the only files created or changed in the checkout are
      docs/decisions/dec-ef8ddcb79d668a67.yaml and the regenerated docs/decisions/index.json,
    And publish makes no commit, no push and no merge: the branch head, the git staging area and
      every remote branch are the same before and after.

  Scenario: A record in the checkout's docs/decisions/ is found by a later run through the index
    Given docs/decisions/dec-ef8ddcb79d668a67.yaml and a docs/decisions/index.json that lists it
      are in the checkout,
    When a later decision run in that checkout looks up precedent for the same question that
      dec-ef8ddcb79d668a67 records,
    Then the lookup reads docs/decisions/index.json and returns dec-ef8ddcb79d668a67 as a
      precedent candidate.
