title: "Continuation lines and trailing comments inside a block list neither end the list nor leak into item values"
component: knowledge-management
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100a-3.yaml"
criteria: |
  Given a first acceptance-criterion record whose covered_by field is declared as a
    block list in which the first plain item wraps onto an indented continuation
    line, followed immediately by the next top-level key with its own block list:
      covered_by:
        - unit_tests/very/long/path/
          that/continues/here.py
        - unit_tests/second.py
      implemented_by:
        - scripts/example_module.py
  And a second record whose covered_by block list holds one item that is itself a
    mapping, with an indented continuation line, followed by a plain item and the
    next top-level key:
      covered_by:
        - path: unit_tests/test_alpha.py
          relationship: covers
        - unit_tests/test_beta.py
      implemented_by:
        - scripts/example_module.py
  And a third record whose covered_by block list holds plain and quoted items
    carrying hash characters, followed by the next top-level key:
      covered_by:
        - unit_tests/test_gamma.py  # note
        - unit_tests/test_delta.py#test_symbol
        - "unit_tests/test_epsilon.py #kept"
      implemented_by:
        - scripts/example_module.py
  When each record's frontmatter is read for relationship extraction
  Then the value obtained for covered_by in the first record is the two-item list
    ["unit_tests/very/long/path/ that/continues/here.py", "unit_tests/second.py"]
  And the value obtained for implemented_by in the first record is the one-item list
    ["scripts/example_module.py"]
  And in the second record the last item of the covered_by value is
    "unit_tests/test_beta.py", and no item of implemented_by appears in covered_by
  And the value obtained for implemented_by in the second record is the one-item list
    ["scripts/example_module.py"]
  And the value obtained for covered_by in the third record is the three-item list
    ["unit_tests/test_gamma.py", "unit_tests/test_delta.py#test_symbol",
     "unit_tests/test_epsilon.py #kept"]
  And the value obtained for implemented_by in the third record is the one-item list
    ["scripts/example_module.py"]
  And a fourth record declaring the first record's covered_by list with its dash items
    at column zero and the continuation line indented two spaces yields the same
    covered_by and implemented_by values as the first record
depends_on:
  - KM-KGS-100a-3
  - KM-KGS-100a-3-ii
  - KM-KGS-100a-3-ix
