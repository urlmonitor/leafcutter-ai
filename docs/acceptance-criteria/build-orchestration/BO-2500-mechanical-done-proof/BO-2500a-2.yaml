title: "An AC whose linked covers test fails cannot be marked done"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an active AC that has a test tagged "# covers:<id>" but that test fails in the
    current test run,
  When the done-status of that AC is evaluated,
  Then the AC cannot be marked done
  And the result names the failing linked test as the reason.
depends_on: [BO-2500a]
