notes: |
  THREE RESOLUTIONS AND A FOURTH STATE, all four named by BO-3600d and all three
  resolutions already practised by hand in the material behind this goal. The BA is
  told not to invent a fourth resolution, and the closed set in the fourth scenario
  is how that instruction becomes enforceable rather than advisory.

  A VERDICT PATH THAT FORCES AN ANSWER PRODUCES BAD ANSWERS, which is why
  not-yet-decided is a first-class state. Its cost is contained by BO-3600d-2-i,
  which makes deferral visible and ageing rather than free.

  The third scenario carries the discipline from KI-BO-028's handover ticket: five
  of its eight records offered narrowing as the honest outcome, and narrowing a
  criterion is a governance change. The clause about not reading as an ordinary edit
  is the load-bearing half — an amendment nobody can distinguish from a typo fix is
  a silent relaxation with extra steps.

  This record chooses the verdict; BO-3600b-3 keeps the two acts from bleeding into
  each other once chosen.
