assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Own the SINGLE shared files_touched classification helper used by both scripts/goal_to_epic.py and scripts/ac_store/generate_ticket_from_ac.py: a path is a qualifying implementation .py when it ends in .py AND is not under docs/ AND is not a .yaml/.json file AND is not under tickets/ AND its basename does NOT match test_*.py or *_test.py. Do not duplicate or inline the predicate in either generator."
  - "The generated ticket's presence-or-absence of the '## Test Requirements' section must be a RELIABLE signal: present iff at least one qualifying implementation .py is in files_touched. This is the signal TKT-500f-6-iii-b's ticket-supervisor rule consumes."
  - "Reconcile this predicate with the ticket-supervisor template (markdown prose) by SPEC PARITY, not code import: the supervisor cannot import this helper, so state the classification rule once normatively in docs/reference/ac-schema.md and keep both the generator helper and the supervisor template matching that single normative definition."
  - "Idempotent on re-runs: regenerating a ticket from the same AC produces the same section presence/absence and the same stub set."
delivers_to:
  agent: llm-expert
  contract: "(1) A generated ticket whose '## Test Requirements' section presence/absence is the authoritative test-writer-required signal the ticket-supervisor reads; (2) the normative classification rule for 'implementation .py in scope' (impl-.py = ends .py AND not under docs/ AND not .yaml/.json AND not under tickets/ AND basename not test_*.py / *_test.py), published in docs/reference/ac-schema.md for the supervisor template to mirror by spec parity"
expects_from:
