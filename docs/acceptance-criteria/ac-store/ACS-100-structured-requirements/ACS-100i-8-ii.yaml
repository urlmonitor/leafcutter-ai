notes: |
  WHY THIS EXISTS. ACS-100i-8 says a change adding a package-registry entry must
  cite a criterion declaring the surface. It did not say what "adding" means when
  a commit has two parents, and the implementation resolved that by diffing the
  index against `HEAD`. For a merge, `HEAD` names only the FIRST parent, so every
  entry the SECOND parent already carried read as new.

  The consequence was not theoretical. `check-ticket-signoff-parity` landed on
  main in 406375c88; from then on EVERY branch merging origin/main was refused
  for an entry it never introduced. Observed and bypassed with an authorised SKIP
  while merging PR #661, and filed as KI-BP-20260901-0812.

  THE SHAPE OF THE DEFECT is worth keeping. The gate was not too weak and not too
  strong — it was asking git the wrong question. Its notion of "new" was relative
  to one branch rather than to the commit's own history, so the debt sat with
  whoever merged next rather than with whoever created it. A gate that fires on
  the wrong person still fires, which is why it went a while before anyone
  treated it as a defect rather than an inconvenience.

  DO NOT "SIMPLIFY" THIS by skipping the check during merges. That is the obvious
  shortcut and it is wrong: scenario 2 above exists precisely because a merge is a
  perfectly good place to introduce a genuinely new undeclared entry, and a
  merge-exempt gate would wave it through. The correct rule is narrower — an entry
  is added by this commit only if it is absent from EVERY parent.

  There is a second, unfixed half to KI-BP-20260901-0812, recorded here so it is
  not lost: the entry that triggered all this is on main declared by
  BP-1100g-5-i, which carried no `package_surface` field at all. ACS-100i-8 should
  have refused that registration when it landed and did not. How it got through is
  unestablished — the likeliest candidates are the hook not being installed in that
  worktree (KI-BP-004) or an unrecorded bypass. This criterion stops the symptom
  spreading; it does not explain the original miss.
