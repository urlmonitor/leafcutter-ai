  - reason: "it-po correction (2026-09-29, second pass): assigned_agent llm-expert -> python-coder, reversing this record's own earlier 2026-09-29 retarget above, and matching BO-2300e-3 (its parent, and the same file). That retarget followed the sibling 2026-07-20 precedent (\"retargeted to the E2 workflow ENGINE... assigned_agent python-coder -> llm-expert\") and flagged its own risk -- that llm-expert's registry entry does not list workflow JS as owned surface. The flag was right, and dispatching the sibling BO-2300e-2 work against the same file proved it. VERIFIED AGAINST config/agent_registry.json rather than taken on report: llm-expert's selection_criteria DSL trigger reads \"files_touched contains templates/agents/*.md OR files_touched contains templates/skills/*/SKILL.md OR files_touched contains templates/workflows/*.md\" -- three markdown surfaces -- and llm-expert DECLINED on exactly those charter grounds. templates/workflows/ holds command-prompt .md docs (build-ac.md, commit.md, plan.md, ...); templates/workflows-js/ holds the executable workflow bodies including plan-feature.js, which this AC edits. Both directories exist and are distinct; their names differ by a suffix, and the 2026-07-20 amendment appears to have conflated the two. workflow-architect also declined, confirming no agent in the package is chartered for workflow-JS bodies. python-coder accepted and completed the sibling work because config/agent_registry.json gives it owns_file_extensions [\".py\", \".js\"]. That ownership is PROVISIONAL BY THE REGISTRY'S OWN ACCOUNT -- its owns_file_extensions_rationale reads \"'.js' is an EXPEDIENT, not a judgement that a Python agent is the right owner of JavaScript... The proper fix is a dedicated workflow-author agent, with ownership driven by per-consumer configuration rather than a hardcoded list; ACs for that are being authored. Revisit this entry when they land.\" Revisit this assignment when that agent lands. This record's failed-read classification is NOT implemented: work_status stays todo, and criteria, it_requirements, test_spec and readiness are unchanged. STALE POINTER FIXED IN THE SAME PASS (superseding this entry's earlier note that it was being left as-is; the coordinator widened the field fence for exactly this): doc_links' templates/agents/llm-expert.md -> templates/agents/python-coder.md. That link was the IMPLEMENTER'S REFERENCE, not a subject of this criterion -- llm-expert appears nowhere in this record's criteria, notes or it_requirements. This AC's subject is how a no-reply, transport-error, or malformed reply is classified -- JS error handling and JSON parsing over a returned value, not the authoring of LLM instructions, and llm-expert.md's declared scope is \"LLM instructions inside agent templates, skill files, and slash-command prompts\". So replacement, not retention and not removal. delivers_to is null and expects_from names only an ac_id on this record, so neither carried a stale agent name."
  - reason: "it-po done-reconciliation (2026-09-30): work_status todo -> done, with evidence, and implemented_by/covered_by wired. Implemented by commit 78d452ff alongside its parent BO-2300e-3 -- the SHA is in prose, not in implemented_by, because that field's schema definition is \"Source file paths (optionally with #anchor) that implement this criterion\" and no record in this store carries a bare SHA there. The single implementing path is templates/workflows-js/plan-feature.js, confirmed by grepping templates/, scripts/ and config/ for this AC id rather than inherited from the parent. This record's distinctive requirement -- the one the parent could not deliver on its own -- is the try/catch around the DISPATCH ITSELF: readPauseStore() now performs `raw = await agent(prompt, ...)` at L1615, INSIDE the try opened at L1614, where both call sites previously had the await outside and wrapped only parseAgentJson(). Verified by reading `git show 78d452ff^:templates/workflows-js/plan-feature.js`: pre-fix, L1605 and L1691 hold bare awaits ahead of their try blocks, so a transport rejection propagated out of the whole script and reached no classification at all. That is why this record's transport-error scenario was previously not merely failing but UNREACHABLE, and why proving it needed a new additive __harness_agent_throws__ sentinel in unit_tests/_workflow_engine_harness.py -- named here as an enabling test-harness change, deliberately not in implemented_by. covered_by: unit_tests/workflows/test_bo_2300e_3_ii.py. Read, not assumed -- its three functions all carry `# covers: BO-2300e-3-ii`, none claims the parent or the -i sibling, and a whole-tree grep for `covers: BO-2300e-3` confirms no other file claims this id. All three are parametrized over both labels, so the file yields SIX collected cases: no-reply, transport-error and malformed-reply, each against peek-pause-record and read-pause-record independently, which is this record's fourth it_requirement (must hold at both call sites) discharged by construction rather than by assumption that one shared helper covers both. unit_tests/workflows/_bo_2300e_3_fixtures.py is NOT listed: it supplies NO_REPLY, MALFORMED_REPLY_TEXT and the transport_error_response() builder, but defines no test function, carries no covers tag, and is not collected by pytest -- an input source, not a covering test. All six cases verified PASSED under AC_ENFORCE_STRICT=1 on 2026-09-30 against the real on-disk plan-feature.js via run_workflow_under_e2, satisfying reachability (BO-2900a-3). Both criteria clauses are exercised: the classified-as-could-not-determine clause by all six, and the does-not-silently-proceed clause by the terminal-payload assertions -- the transport-error case asserts specifically that the payload is a dict rather than the None a top-level rejection produced before the fix, so 'the script crashed' cannot masquerade as 'the script classified'. RESIDUAL, minor and recorded rather than glossed: the second it_requirement asks that the caught error be handled per the project error-handling policy with a WARNING-or-higher log. That IS satisfied in code -- L1626 emits `[plan-feature][WARNING] <label> for run '<id>' was undetermined: <why>` on every undetermined outcome, and nothing is swallowed silently -- but it is verified by reading the line, not asserted by any test; no test inspects the emitted log. This is an it_requirement, not a criterion clause, so no criterion is left uncovered by it. The policy's 'typed except' half has no JavaScript analogue (JS catch is untyped), so it is satisfied as far as the language allows."
