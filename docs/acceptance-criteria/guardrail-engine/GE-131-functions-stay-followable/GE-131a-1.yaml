notes: |
  THE RULE is in GE-131a's notes and is not restated here.

  IMPLEMENTATION PATH. Read the staged content (`git show :path`) and, for each
  revision from resolve_parent_revisions(), the previous content via
  get_previous_content(); both already live in _file_size_ratchet.py. A function's
  ceiling is max(limit, highest score among its matches across those parents).

  IDENTITY: qualified name plus position. The qualified name joins the enclosing
  classes and functions (Planner.plan, encode.visit). Position is the function's
  ordinal among definitions sharing that qualified name in the same file, in source
  order, so a property getter and setter are distinct. Do not use line numbers: an
  edit above a function would lose its identity. Today the checker keys by bare
  node.name (check_complexity.py:99), which makes encode.visit and decode.visit in
  knowledge/native_properties.py indistinguishable; that is the real case the
  same-name arm stands for.

  FAIL CLOSED. Today calculate_complexities returns [] on a SyntaxError (lines 86-89)
  and process_staged_file swallows any exception into [] (lines 154-155), so a broken
  file passes as clean. Either outcome in the last arm is acceptable; a clean pass is
  not.

  REASON WORDING. "new" = no previous version in any parent; "crossed" = previous
  score at or under 15, now over; "grew" = previous score over 15, now higher.

  TEST BUDGET: one test per arm, 7 tests, synthetic scratch git repos driving the
  check script as a subprocess. Every arm that allows has a matching refusing arm, so
  a check that allows everything fails this record.
