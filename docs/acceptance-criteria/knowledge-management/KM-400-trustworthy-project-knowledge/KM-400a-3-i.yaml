id: KM-400a-3-i
title: Explore native project types, complete metadata and declared component membership in Aura
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: approved
priority: medium
work_status: done
parent: KM-400a-3
criteria: |
  Given a published repository graph contains acceptance criteria, ADRs, components, source files and tests
  When the user explores the current repository snapshot in Aura
  Then those entities have the native labels AC, ADR, Component, SourceFile and Test respectively
  And each entity exposes its readable canonical identifier, name or source path for its caption
  And connections have meaningful native relationship types while retaining their declared direction and provenance
  And the normal domain exploration excludes repository and snapshot bookkeeping and retired snapshots

  Given some entities explicitly declare membership of finalize and others only connect indirectly to those entities
  When the user filters current entities by finalize in their components property
  Then the result is exactly the entities with declared finalize membership in that repository snapshot
  And entities with multiple declared components remain filterable by each component
  And no inferred or transitive membership is presented as a declared component assignment

  Given the existing Aura database contains retained generations and registered retrieval queries
  When the retained native graph is inspected and a subsequent snapshot is published, refreshed or rolled back
  Then retained generations preserve their canonical identities, source revisions, payloads and relationship counts
  And the current marker agrees with the active repository snapshot after the atomic switch
  And invalid, unowned, contradictory or cross-generation records cause native inspection to refuse without changing the graph
  And publication refuses unsupported repository control records before writing a snapshot or changing its active pointer

  Given saved retrieval queries were admitted using an obsolete compiler format
  When the explicitly authorized native-only catalog replacement runs
  Then saved queries are recompiled to native labels, freshly verified against their pinned source and replaced with an explicit old-to-new digest mapping
  And original catalog receipts are retained as private historical backups rather than accepted by runtime compatibility code
  And unsupported compiler versions and old query pins are rejected instead of silently translated

  Given Leafcutter defines native artifact types and their authored fields in schemas, registries or validated source conventions
  When each type is reviewed and projected into Neo4j
  Then every present native field is exposed as a typed queryable node property or a documented queryable nested leaf
  And an auditable type and field inventory names each authoritative source, implementation and verification result
  And absent, explicit null and empty values remain distinguishable without inventing schema defaults
  And nested objects and lists retain their field identity, ordering and same-object correlation
  And projection bookkeeping cannot overwrite authored metadata or be overwritten by it
  And future imports and the existing published graph use the reviewed field mapping
depends_on: [KM-400a-3]
