notes: |
  The fail-closed half of BUG-22 (run wf_cc2b46d9-f6f). BO-400a-2-ii adds the
  completion write that was missing; this AC bounds it.

  WHY THIS IS AUTHORED AS ITS OWN RECORD RATHER THAN A CLAUSE. The defect is an
  absent write, so the obvious remedy is to add one. An added write with no negative
  boundary is strictly worse than the defect: today the store under-reports work that
  really landed, which is recoverable by hand; an unbounded write would over-report
  work that never ran, which is not visibly recoverable at all. Separating the two
  records makes it impossible to land the write without also landing the refusal.

  THE THIRD CASE IS THE ONE THE PRODUCTION RUN ACTUALLY HIT. Tickets 01, 03 and 09
  each had at least one phase that ran, returned success, and left no sign-off. That
  case is only decidable once BO-2900f-1-i's verification exists -- which is why it
  is recorded here as an expects_from rather than re-derived.
