id: BO-400e-3-vi
title: "Before writing anything, finalization lists every record it is about to close by id and path, and its report carries the same list"
component: build-orchestration
components:
  - build_orchestration
  - finalize
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
criteria: |
  Given the closable set for "EPIC-Alpha" is the ticket
      "tickets/00_inbox/epics/EPIC-Alpha/alpha-02.md" and the acceptance criterion
      "BO-9100a-2" at
      "docs/acceptance-criteria/build-orchestration/BO-9100-x/BO-9100a-2.yaml"
  When finalization reaches its closure step
  Then before any record is written, it shows the person running it a list with one line
      per record: the record's id, its path, and its current status
    And the list states how many tickets and how many acceptance criteria it holds
    And the finalization run's final report repeats that list, marking each record as
      closed, refused, or left open

  Given the closure goes on to close a record that was not on the list it showed
  When the run's final report is produced
  Then the record is reported as closed outside the shown list
    And the run does not report the closure as completed
  Because "done" is load-bearing and a wrong one is invisible afterwards, so the person
    finishing a feature has to be able to see -- before it happens, not by reading a commit's
    file list later -- exactly which tickets and acceptance criteria are about to be marked
    finished in their name.
depends_on:
  - BO-400e-3
  - BO-400e-3-ii
doc_links:
  - path: docs/known-issues/build-orchestration/open-blocker-ki-bo-20260930-finalize-step-35-closes-every-inbox-ticket-store-wide.md
    relationship: describes
    status: exists
    relevance: "Remediation item 2 (print the records about to be closed). The KI notes the damage was visible only in `git show <sha> --stat`, which no finalize run prompts anyone to read."
