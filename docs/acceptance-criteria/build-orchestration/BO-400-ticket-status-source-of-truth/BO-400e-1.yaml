    angle: criterion
    description: "Drive the close of a ticket whose record names nine phases as needed with a caller-supplied list of the other eight plus a claim that the ninth is excluded from this run. Assert the close is refused, that the refusal names the ninth phase, and that the recorded state is unchanged -- proving the caller's list cannot narrow the demanded set."
  - name: test_caller_widened_list_does_not_add_phases_the_record_never_names
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Drive the same close with a caller-supplied list of ten -- the eight plus two phases the ticket's record never names. Assert the two extra phases are treated as demanded in neither the decision nor the refusal message, and that the refusal still names only the ninth -- proving the caller's list cannot widen the demanded set either."
  - name: test_close_with_no_caller_list_reads_the_record_and_refuses_identically
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Drive the same close with no caller-supplied list at all and assert the answer is byte-identical to the narrowed and widened attempts -- closing the 'fall back to the record only when no list is offered' implementation, which passes the other two attempts and fails this one."
  - name: test_all_three_attempts_leave_the_ticket_record_unchanged
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Re-read the ticket record after all three attempts and assert it is exactly as found: still nine phases named needed, still no sign-off for the ninth, no lifecycle state written. A refusal that edits the record while refusing is not a refusal."
  - name: test_both_drivers_derive_the_same_demanded_set_for_the_same_record
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Run the same ticket record through the epic driver and through the single-ticket driver and assert both decided against the same demanded-step set and produced the same answer -- the seam BO-400a-2-ii's twin constraint exists to hold closed."
  - name: test_demanded_set_derivation_is_reachable_from_a_real_workflow_run
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "REQUIRED -- invoke the production entry point: load and execute the real workflow script via unit_tests/prompt_assembly/harness_build_ticket_guard.mjs and assert the derivation actually runs during a close. Do NOT satisfy this by importing a helper directly, and do NOT satisfy it by asserting the derivation code is present in the source: the broken driver contains phase-list code too."
