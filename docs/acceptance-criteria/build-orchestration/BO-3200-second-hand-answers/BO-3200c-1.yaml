notes: |
  SCOPE — HALF OF THIS L1 IS ALREADY FIXED. PR #565 stopped the gates defaulting to discard,
  so a refusal no longer destroys authored work, and that must not be re-specified. What
  remains, and what this AC covers, is that the question genuinely reaches a person, and that
  a run which cannot reach one pauses resumably instead of resolving.

  Anchor case KI-ACD-005: gates documented as user decision points were dispatched as prompts
  to a reporting specialist. No human was involved at any point. The known issue's own words:
  "A gate that cannot reach a user should pause and persist a resumable state."

  THE STRUCTURAL CONSTRAINT, from KI-SS-001 and shared with BO-3100c: the ability to put a
  question to the person is not available to a specialist — the harness removes it. So the gate
  has to be raised at a layer that still has it. The first scenario is therefore not satisfiable
  from inside a specialist, which is why the two trees are sequenced together.

  THE THIRD SCENARIO IS WHAT MAKES THE PAUSE WORTH ANYTHING. A pause that loses the authored
  work is a discard with extra steps, and a resumable record nobody can resume from is the same
  thing. Requiring an actual resume that finds the work unchanged is the only way to test that
  the pause is real, and it is executable end to end.

  "Reports that it is waiting for an answer rather than reporting a decision" is the outcome
  clause: an unresolved gate must not be reported as a run that concluded. The covering test
  must assert on the outcome a caller branches on, not only on the message.

  IT-PO ENRICHMENT NOTE (2026-08-26). Two decisions worth naming.

  FIRST, reuse ADR-024's pause substrate rather than authoring a second one. This is not tidiness:
  BO-3200c-4's how-to is executed against a real paused run, and if there are two kinds of paused
  run the how-to is correct for one of them and silently wrong for the other.

  SECOND, impossibility must be DETECTED, not assumed. The natural implementation checks whether
  the context looks interactive and skips the ask if not — and that is how a gate stops being
  asked at all, gradually, as more contexts are classified non-interactive. The run must attempt
  to ask and pause on the absence of a means to receive an answer.
