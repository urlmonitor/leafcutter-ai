notes: |
  Guard #5 of BP-1100f. Surface for IT-PO to pin: the pre-dispatch refinement /
  consistency lens (before the first coder dispatch). This is DISTINCT from its BP-1100
  siblings and must not re-derive them: BP-1100a checks that files_touched contains an
  executable surface at all; BP-1100e-1 (DONE) is the post-change declared-vs-actual
  file reconciliation. This AC checks an intent(technology)-versus-surface CONTRADICTION
  (implementer/checker technology cannot act on the declared surface). Origin RCA
  Failure #1: python-coder + pytest were aimed at a .js surface. Portable per ADR-001.
