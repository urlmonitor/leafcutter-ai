notes: |
  Satisfies the reference-doc half of BO-3600a's documentation_triggers.

  The third scenario is the reason this entry is worth writing at all. This whole
  goal exists because a clean-looking state was believed; a reference entry that
  does not bound what a clean result asserts would hand the reader the same
  false assurance in a new place.

  The second scenario keeps the entry honest by reproducing its documented
  conditions against a real store rather than asserting them.

  assigned_agent deliberately unset — the reference surface belongs to the IT
