id: ACD-1300f-1-i
title: One unapproved or oversized required leaf excludes the whole feature
component: ac-driven-dev
components:
- ac_driven_dev
level: L3
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given feature STATUS has one approved S leaf and another required leaf that is draft, has an unanswered question or is estimated XS, L, XL or unknown
  When the worker evaluates admission
  Then STATUS is excluded with the offending leaf and reason
  And no easy subset of STATUS is implemented
  And the same feature can be reconsidered once the unmet conditions are corrected
