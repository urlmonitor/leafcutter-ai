notes: |
  ORIGIN. The user, 2026-10-09: "and same for the tmp files. we need clear ACs that provide
  scripts that clean-up when something finishes - latest when opening the PR (finalize
  feature is used too rarely)". Deliverable is ACs that require concrete cleanup scripts,
  not guidance -- same "enforcement by construction" framing as BO-4100 / BO-4300.

  WHY A NEW L0 AND NOT BO-4300g. BO-4300 has six L1s, so one more child would fit the cap,
  but the request is six distinct benefits (when each route cleans up, what "gone" means
  across the machine, environments that die with the workspace, a recurring sweep, a
  disk-pressure guard, temporary files). Folding them into one L1 would give BO-4300g far
  more than its own child cap. BO-4300 promises ONE DOOR for making, finding and clearing;
  BO-4400 promises that the door is actually USED, on time, by every route, and that the
  clear is complete. Rule for future requests: "how a workspace is cleared safely" ->
  BO-4300e; "that it IS cleared, when, and that nothing is left" -> BO-4400.

  CAPABILITIES USED, NOT RE-DERIVED: BO-4300e (the central clear: no prompt, refusal while
  unsent work, up-front authorisation), BO-4100c (holds-work / holds-nothing verdict incl.
  BO-4100c-1-i squash-merge detection), BO-4100e (complete listing incl. unregistered
  leftovers), BO-4300c-1-iii (a build restores tracked files it changes, so a finished
  workspace does not falsely read as holding work), BO-4300e-4 (comparison workspaces),
  BO-1800d (housekeeping never disturbs work in flight), TQ-600b-2 (each test gets its own
  scratch location -- BO-4400f adds the home/expiry rule, not uniqueness), ACD-2100c-5
  (halted runs keep their work). All of these are todo/unbuilt as of 2026-10-09; the BA
  must sequence BO-4400 children behind them via depends_on rather than restating them.

  KEY FRAMING DECISION (amended 2026-11-16). The cleanup point is the moment the work has
  LANDED on the main line (its pull request merged, or its work merged directly) -- NOT the
  moment the pull request is opened, and NOT finalize-feature, which runs too rarely. A run
  whose pull request is still open when it ends keeps its workspace, and the unattended
  landed-work pass (BO-4400g) clears it once the work lands, or once nothing unsent remains
  and nothing in it has changed for 14 days; a run that ends with nothing to
  deliver (no commits of its own) clears its own workspace right away. Unsent work (not on
  the shared project, or uncommitted) is never removed. Work that was sent to the shared
  project but never reached the main line (a failed run, an abandoned or closed pull
  request) is not lost by clearing, because it stays on its line on the shared project: the
  landed-work pass clears such a workspace once nothing unsent remains AND no file in it has
  changed for 14 days, and keeps younger ones. Finalize may still clear, but no route may
  rely on it.

  AMENDED 2026-11-16 (user decision at the BO-4400g plan-feature gate): cleanup timing moved
  from "handed over for review / pull request opened" to "work landed on the main line". The
  ORIGIN quote above ("latest when opening the PR") is kept verbatim as history; the KEY
  FRAMING DECISION supersedes it.

  AMENDED (2) 2026-11-16 (second user decision, same gate): sent-but-never-landed work is
  safe on the shared project, so its workspace is cleared by the landed-work pass after 14
  days with no change once nothing unsent remains. Only unsent work is never removed. This
  replaces the first amendment's "unsent or unmerged work is never removed".

  DECIDED 2026-10-09 by BrainCandy (resolves BO-4300 Q8): clearing a workspace whose
  verdict is "holds nothing unsent" (BO-4100c) needs NO caller-supplied confirmation
  token -- the verdict is the safety check. Up-front permission (BO-4300e-3) is required
  only to discard unsent work. BO-4400a's automatic end-of-run clear relies on this.

  FINAL GATE 2026-10-09 (BrainCandy): approved, priority high. Decisions: disk guard
  defaults refuse below 10 GB free / warn below 25 GB, the lower of the Linux volume and the
  Windows host drive deciding under WSL (BO-4400e); when free space cannot be measured the
  workspace is still made and the unreadable drive is named (BO-4400e-1-i); scratch root
  defaults to <user cache>/leafcutter/scratch/ (BO-4400f-1); environment precedence uv.lock >
  poetry.lock > requirements-dev.txt > requirements.txt > none, a pyproject.toml without a lock
  file counting as none, uv winning when both lock files exist (BO-4400c-3, c-3-i).
