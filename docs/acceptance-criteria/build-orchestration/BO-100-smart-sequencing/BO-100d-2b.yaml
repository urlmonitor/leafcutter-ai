criteria: |
  Given /build-feature is invoked for an epic that has at least one ready ticket,
  And the install's telemetry location query prints exactly one absolute path,
    the declared telemetry stream, that lies outside the drive's worktree,
  And the pre-drive feedback-sink reachability probe appends one probe line to
    that printed absolute path,
  When the append succeeds,
  Then the drive proceeds past the pre-dispatch stage and dispatches
    ticket-supervisors according to the normal sequencing rules,
  And no pre-drive sink error is shown to the operator,
  And the only content the probe added to the declared stream is its single
    probe line,
  And the probe created and appended to no file at the workspace-relative path
    debugging/logs/agent_telemetry.jsonl under the drive's worktree.
