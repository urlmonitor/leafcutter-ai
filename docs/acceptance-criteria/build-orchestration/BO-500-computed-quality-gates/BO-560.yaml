id: BO-560
title: "The build system computes the full agent chain -- no one hand-curates it"
component: build-orchestration
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  The agent sequence is derived, not authored.

  Given the change type and the assigned work agent's traits, the ticket-supervisor
  derives the complete ordered sequence of agents that must participate. The
  manually-authored agents map becomes an output of this computation, not an
  input that humans maintain. The IT PO assigns the work agent and classifies
  the change; the system fills in reviewers, testers, and documenters based on
  the rules defined by the trait registry and change-type taxonomy.
