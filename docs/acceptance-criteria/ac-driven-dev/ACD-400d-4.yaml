  - "The order must be obtained by executing the scanner over a temporary store through its real command surface; neither a source-text assertion nor a direct call to the private sort helper satisfies this AC."
  - "THE PRODUCT QUESTION IN THIS AC'S NOTES IS OPEN WITH BrainCandy AND MUST NOT BE ANSWERED BY THE IMPLEMENTATION. The three coherent rulings — keep the silent demotion, reject an unreadable urgency loudly, or match leniently — are BrainCandy's to choose. The implementation records the behaviour that ships and nothing more: no case-insensitive comparison, no whitespace trimming, no warning or error emitted on an unrecognised value, and no vocabulary validation added anywhere on this path. Introducing any of them under cover of making the test green pre-empts the ruling."
  - "Both unrecognised values named in the criteria must be in the fixture. The nonsense value and the capitalisation near-miss are asserted to rank identically, and a fixture carrying only one cannot show that nearly matching a recognised urgency earns no credit."
  - "The near-miss value must survive the round-trip to disk with its capitalisation intact; assert the value as loaded back from the fixture file before asserting the scanner's answer, or a normalising writer silently turns this into a duplicate of the recognised-value case."
  - "Both unrecognised records must be asserted present in the offer, not merely ranked last. The still-offered clause is the half of the verdict that differs from the approval field, and it is the half the open question would change."
