id: ACS-200f
components:
  - ac_store
title: "An AC whose covering tests genuinely pass can be marked done through the normal path, without the operator knowing an environment variable"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given an active AC that is still recorded as not-yet-done,
  And at least one test in the repository declares that it covers that AC,
  And every such test passes when the suite is run without any special
    environment configuration,
  When an operator runs the done-marking tool for that AC with no environment
    variables set beyond the repository defaults,
  Then the tool's coverage gate treats those covering tests as passing,
  And the AC is marked done and the tool exits successfully,
  And the tool does not refuse on the ground that a covering test was reported
    as an expected failure,
  And the symptom ("the only way to satisfy the coverage gate is to already be
    done, so a genuinely covered AC can never be marked done through the tool's
    normal path") must not occur.
