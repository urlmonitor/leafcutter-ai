assigned_agent: architecture-diagram-author
estimated_complexity: M
it_requirements:
  - >-
    TARGET FILE — a NEW diagram under docs/architecture/diagrams/, named to the
    enforced convention c{level}-{seq:03d}-{slug}.md. Allocate the sequence number
    at authoring time with `python scripts/next_diagram_seq.py 3` (it returned 6 on
    2026-08-18, so c3-006-*.md unless a sibling claims it first). Suggested slug:
    done-proof-checkers-and-populations. Frontmatter must carry type: architecture,
    diagram_type: component (a value from config/diagram_types.json) and
    flight_level: L3-Component — scripts/commit_guardian/check_diagram_naming.py
    rejects a filename whose c-prefix disagrees with flight_level.
  - >-
    EVERY NAMED ELEMENT MUST RESOLVE TO A REAL MODULE AT PUBLICATION, AND THE
    frontmatter related_code LIST IS WHAT MAKES THAT CHECKABLE. List in
    related_code every module a box names — at minimum
    scripts/ac_store/done_proof.py (verify_done_eligible, the one verdict source),
    the commit-time hook and the change-time gate in
    scripts/commit_guardian/check_done_proof.py, and whatever TQ-400a-2 delivers as
    the store-wide invocation. A box naming a module or symbol that does not exist
    is the failure the publication-accuracy clause forbids, and it is only
    mechanically detectable if the names are in related_code as well as in the
    mermaid body.
  - >-
    NAME THE VERDICT SOURCE EXACTLY AS docs/architecture/diagrams/
    c3-done-proof-evaluation-sequence.md NAMES IT. That sequence diagram already
    documents verify_done_eligible as the authoritative oracle. Two diagrams
    naming one oracle differently reintroduces, in the documentation layer, the
    two-readers drift the single-verdict-source depiction exists to expose.
  - >-
    DRAW THE ARRANGEMENT AS DELIVERED, NOT AS INTENDED. If the delivered code has
    two verdict sources, the diagram shows two and the discrepancy is raised
    against TQ-400a-3 — it is not smoothed into the intended single source. A
    diagram that draws the constraint rather than the code lets a reviewer believe
    the constraint holds when it does not, which is worse than no diagram.
  - >-
    LIVE VERSUS INTRODUCED MUST BE A DECLARED CONVENTION, NOT AN IMPLICATION. Two
    of the four elements already run. Use an explicit visual convention (e.g.
    dashed for introduced-by-this-work) AND state the convention in a legend with
    the publication date, so a reader in six months can tell what the distinction
    was asserting and when.
  - >-
    EACH CHECKER CARRIES ITS POPULATION LABEL ON THE DIAGRAM ITSELF. This is the
    one thing prose cannot do at a glance and is the diagram's whole justification.
    Do NOT restate the population prose in body text — link to
    docs/how-to/done-proof-enforcement.md for the narrative — but the label must be
    on the node.
  - >-
    THE INVENTORY AND ITS CONSUMERS ARE PART OF THE DIAGRAM, WITH THE DERIVATION
    DIRECTION EXPLICIT. Draw the durable inventory TQ-400a-4 delivers and both
    readers of it (the cadence report, the triage list), and make clear by edge
    direction which figures are derived from one run's inventory and which are
    re-derived from the store. A consumer that re-derives is a second reader and
    the diagram must show it as one.
  - >-
    CROSS-LINK BIDIRECTIONALLY. Add the diagram to related_docs on
    docs/architecture/components/phantom-done-prevention.md and reference that
    component doc from the diagram's related_docs; check_doc_links checks
    bidirectionality and check_doc_frontmatter checks the required fields.
  - >-
    SEQUENCE AFTER TQ-400a-3 AND TQ-400a-4 LAND, for the same reason as the
    draw-as-delivered rule: both the single-verdict-source constraint and the
    inventory boundary are claims about shipped code.
delivers_to: null
expects_from:
  - ac_id: TQ-400a-3
    contract: >-
      The single-verdict-source constraint — every sweep verdict originates from
      the established per-record oracle. The diagram depicts that constraint;
      if the delivered code has two verdict sources the diagram must show two,
