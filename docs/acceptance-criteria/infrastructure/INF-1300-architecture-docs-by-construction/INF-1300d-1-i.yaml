estimated_complexity: S
change_target: code
risk_surface: contract_boundary
test_required: true
it_requirements:
  - "The vocabulary must be read from config/diagram_types.json at the moment of the request. Reading it once at import and caching for the process lifetime is acceptable; baking it into the producer at build time is not."
  - "The declaration must be resolved relative to the project root the run is operating on, discovered the same way the project's existing consumers of that file discover it, so both the development layout (config/) and the deployed consumer layout (leafcutter/config/) resolve."
  - "There must be no fallback to a built-in list of names when the declaration cannot be found or parsed. That situation is a refusal with an explicit message. diagram_type_validators.py's recorded history is the precedent: its constant fallback once silently disabled frontmatter enforcement in every consuming project, and a second instance of that failure is not acceptable."
  - "No diagram-type name may appear as a literal in the producing code or in the tests, other than as a value read from a declaration the test itself authored. Tests must build their scratch declaration and then assert against the names they put in it."
  - "The count of declared names must not be asserted anywhere, in the producer or in the tests, so adding or retiring a name does not require a test edit."
  - "One accessor reads the declaration; INF-1300d-1, INF-1300d-4, INF-1300b-2 and INF-1300a-4 all consume it rather than each opening the file, so a change to how the declaration is read cannot leave part of the tree reading it differently."
test_spec:
  - name: test_adding_a_kind_to_the_declaration_makes_it_accepted
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "In a temporary project carrying its own copy of the declaration, add a kind, change nothing else, and request it. Assert a document is produced. The kind's name must be invented by the test, not taken from the real vocabulary."
  - name: test_marking_a_kind_retired_makes_it_accepted_with_the_substitution_stated
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Mark a declared kind as retired in favour of another, change nothing else, and request it. Assert the document is produced under the replacement name and the run states the substitution."
  - name: test_removing_a_kind_from_the_declaration_makes_it_refused
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: failure
    description: "Remove a kind from the declaration, change nothing else, and request it. Assert it is refused and nothing is written. This is the arm that fails a producer that reads the declaration for additions while carrying a private floor of names it always accepts."
  - name: test_no_diagram_type_name_is_written_as_a_literal_in_producer_or_tests
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: unit
    angle: criterion
    description: "Read the declaration, then scan the producing module and this record's own test module for any declared name appearing as a string literal. Assert none is found. The scan reads its search terms from the declaration, so it cannot go stale."
  - name: test_missing_or_malformed_declaration_is_a_refusal_not_a_fallback
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: failure
    description: "Remove the declaration entirely, then corrupt it, and request a name that is valid in the real vocabulary. Assert both runs refuse with a message naming the declaration problem, and that neither produces a document under a built-in default."
test_rationale: >-
  A producer holding a private copy of today's names and a producer reading the declaration
  behave identically on every request anyone will make today, so no single-run assertion can
  separate them. The contract is therefore written as before-and-after pairs over a scratch
  declaration the test itself mutates - the only construction in which the derived value can
  be observed to move. The literal-sweep descriptor extends the same discipline to the
  observation, because a test enumerating today's eleven names is the private copy relocated
  into the test suite: it keeps passing after the vocabulary moves and reports that the
  producer reads the declaration when it does no such thing.
delivers_to:
  - agent: python-coder
    ac_id: INF-1300d-1
    contract: "A single accessor returning the declared vocabulary as read from config/diagram_types.json at request time - each name with its description, requires_frontmatter list and deprecation marker - plus the replacement name for a retired entry."
  - agent: python-coder
    ac_id: INF-1300d-4
    contract: "The same accessor's requires_frontmatter list per kind, which is what makes 'which kinds oblige which facts' follow the declaration rather than a private list of three names."
