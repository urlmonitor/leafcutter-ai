    angle: failure
    description: "A fixture carrying an unreachable early-return-zero in dead code, but which refuses on both runs, is classified as not an instance - a source-searching census fails here and no execution-based one can."
  - name: test_the_census_executes_the_deployed_copy_of_each_check
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: "scripts/build.py --target-dir <temp> then the census entry point"
    description: "After a real build, the census's executions resolve to the deployed copies; a fixture whose deployed and source copies behave differently is classified by the deployed behaviour."
test_rationale: |
  The failure this record must exclude is a census that is confidently wrong — and the
  cheap implementation, searching each check's source for an early return, is confidently
  wrong in both directions while producing a plausible list. Only fixtures whose correct
  classification is known in advance can catch that, and the pair is deliberately
  adversarial: a census that classifies everything as an instance passes the first and
  fails the second, one that classifies nothing does the reverse, and neither can pass
  both. The dead-code descriptor is the direct anti-grep assertion — a source-reading
  census must fail it. The fixtures reproduce the recorded shapes rather than naming the
  recorded checks so that the control pair survives GE-126a to GE-126c landing; naming
  the real checks would leave the census untested from the moment it became useful.
