notes: |
  The declared producer is a field the store already carries on nearly every
  requirement — this asks that it be honoured, not that it be invented. 660
  not-yet-done records name a craft the automation does not currently have; see
  the measured blast radius on BO-3500.

  BOUNDARY vs BO-3500b. This one is about a single requirement reaching the
  right craft. That one is about a mixed group surviving as a group. Route every
  member correctly and you can still refuse the group; accept the group and you
  can still hand a diagram to a coder. Distinct failures, distinct tests.

  FOR THE BA, NOT DECIDED HERE: what happens when a requirement names a craft
  that does not exist at all, as opposed to one that exists but is absent from
  a particular run. Those are different answers — the second should become
  buildable, the first is a data defect and should say so. Both belong in
  decomposition, and neither may resolve to silently substituting a coder.
