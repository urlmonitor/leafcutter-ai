notes: |
  User-authored intent: BrainCandy. Framed by product-owner-v3, 2026-09-09.

  THIS IS THE KEYSTONE AND THE CRITERION THE USER ACTUALLY ASKED FOR. Their
  words were "it must be easy to control these things from a single source of
  truth". They meant it operationally, not architecturally: one edit, one
  place, and every specialist that touches that kind of file is correct
  thereafter.

  THE FAILURE MODE TO DESIGN AGAINST IS AN IMPLEMENTATION THAT PASSES EVERY
  OTHER CRITERION IN THIS TREE. It is entirely possible to end up with every
  specialist correctly informed, every kind of file covered, and every figure
  faithful — by hand-editing each specialist's instructions once. That
  satisfies a, c, d and f on the day it ships and fails this one, because the
  next standard costs the same work again. If the acceptance shape does not
  distinguish those two worlds, this L1 has not been decomposed; the
  distinguishing question is what a person must do to add a standard for a kind
  of file that has none, and the answer must be "state it in the one place".

  MEASURED, 2026-09-09, AND IT IS THE WHOLE ARGUMENT. Carrying a declared
  standard outward is currently a purpose-written step per value, and naming it
  is currently a hand edit per specialist. Two hand-written steps exist for two
  unrelated values. Nothing walks the standards declaration and nothing walks
  the record of which specialist owns which kinds of file, although both
  records exist and both are already machine-readable. The join that answers
  "which specialists must be told what" is computable today and is computed
  nowhere.

  THE HOW-TO TRIGGER IS DELIBERATE AND IS A REPLACEMENT, NOT AN ADDITION. If
  this promise lands, "how do I set a standard for a new kind of file" becomes
  a one-step answer, and any existing instruction that tells someone to also go
  and update specialist instructions must be DELETED rather than left standing
  beside the new one.

  WHAT THIS RECORD DOES NOT DECIDE. Whether the one place is where the
  standards live today, and how the statement travels, are technical decisions
  for enrichment. The promise here is the property, not the route. What it does
  rule out is a route that leaves a second place needing to agree.
