id: GE-118f
components:
  - commit_guardian
  - knowledge_system
title: "The commit-time guard and the knowledge map resolve a frontmatter entry through one shared rule"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given one frontmatter field value holding a bare entry and a labelled entry,
  When the document-frontmatter guard resolves that value to the paths it will
    check, and the knowledge-map builder resolves the same value to the targets
    it will connect,
  Then both produce the same ordered list of path strings,
  And both obtain that list by calling one shared routine, rather than each
    applying its own rule,
  And given a further entry shape is then admitted to that routine's accepted
    set, with nothing else in the project altered,
  When the same comparison is made again,
  Then both consumers resolve the further shape, so agreement is a property of
    the arrangement rather than of the moment it was last inspected.
