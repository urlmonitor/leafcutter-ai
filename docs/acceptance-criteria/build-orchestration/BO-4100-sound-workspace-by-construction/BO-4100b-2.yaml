notes: >-
  Observed 2026-09-14: the refusing check's own summary line read "drifted=0 missing=0"
  while it refused the commit anyway, so its verdict was not derived from its findings
  at all. That is separately failable from BO-4100b-1: scoping a check to the changed
  set does not stop a verdict being reached by some path other than the findings, and a
  check whose verdict already followed its findings could still be scoped too widely.
  This AC is the invariant linking the two halves of a check's own output, and it is
  falsifiable without reference to what the commit changed.
