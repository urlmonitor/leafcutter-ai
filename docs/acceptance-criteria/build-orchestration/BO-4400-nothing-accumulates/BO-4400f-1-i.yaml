criteria: |
  Given the scratch age limit is 24 hours, and a run that started 30 hours ago and is
    still active owns a scratch item created 29 hours ago,
  When the scratch age and ownership rule is applied, and when the sweep runs,
  Then the item is not expired and is byte-identical afterwards,
  And when that run then ends, the next application of the rule finds the item
    expired.
