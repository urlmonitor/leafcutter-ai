id: UXP-605
components:
  - ux_prototyping
  - frontend_coding
readiness: reviewed
priority: medium
title: "A 'Show ACs in graph' toggle (default off, persisted) restores the fully-wired AC-node view"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: done
criteria: |
  Given the /flows view with a "Show ACs in graph" toggle,
  When the person turns the toggle on,
  Then the graph restores the fully-wired AC-node view, drawing individual acceptance-criterion nodes wired to their steps and branches,
  And the toggle defaults to off,
  And the toggle state is persisted as a view preference that is not tied to any user role or identity,
  And there is no role or identity system governing who may enable it.
depends_on:
  - UXP-591
doc_links:
  - path: docs/architecture/components/ux-prototyping.md
    relationship: describes
    status: exists
  - path: docs/product-truth/flows/leafcutter/explore-flows-in-atlas.flow.json
    relationship: implemented-by-step
    status: exists
assigned_agent: frontend-coder
estimated_complexity: M
it_requirements:
  - "ExplorerInner in leafcutter-web/components/flows/flow-explorer.tsx must render a 'Show ACs in graph' toggle whose handler (handleToggleShowAcNodes) flips showAcNodes and passes it to buildFlowGraph(flow, showAcNodes); when on, the AC nodes and their 'implements' edges are drawn (via the showAcNodes gate in leafcutter-web/lib/data/graph.ts)."
  - "The toggle must default to off and persist as a plain client view preference in localStorage under key 'flows:showAcNodes'."
  - "SECURITY/POLICY: persistence must NOT be tied to any user role, identity, or sign-in — there is no role/identity gate governing who may enable it; localStorage reads/writes must be wrapped so a storage exception cannot break the view."
delivers_to: null
expects_from: {}
origin_agent: BrainCandy
