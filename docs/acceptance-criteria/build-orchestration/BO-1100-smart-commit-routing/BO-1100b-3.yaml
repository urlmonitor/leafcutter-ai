id: BO-1100b-3
title: "User can confirm a mixed commit or abort to split"
component: build-orchestration
level: L2
status: active
readiness: draft
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the commit agent has presented a mixed-change warning
    listing groups "tickets" and "implementation" with their files,
  When the user is prompted for a decision,
  Then the user is offered at least two options:
    - "Proceed" — compose a best-effort message for the mixed commit
    - "Abort" — stop the commit so the user can unstage files and split
  And if the user selects "Proceed", the commit agent composes a message
    that covers all groups,
  And if the user selects "Abort", no commit is made and no message is composed,
  And the prompt does not auto-select either option without user input.
