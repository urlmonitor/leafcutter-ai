criteria: |
  Given the caller names exactly docs/known-issues/a.md, docs/known-issues/b.md and
    docs/known-issues/c.md,
  And a fixing check regenerates docs/INDEX.md while the checks run and stages it,
  When the shared commit step finishes with every check passing,
  Then the new commit contains the three named files and does not contain docs/INDEX.md,
  And docs/INDEX.md is left in the working tree with the check's regenerated content, unstaged,
  And the answer has status committed and lists docs/INDEX.md separately from paths, as a
    file changed by a check and not committed.

  Given a fixing check rewrites a named file, docs/known-issues/a.md,
  When the step finishes,
  Then the fixed content of a.md is the content in the commit (BO-4500a-3),
  And a.md is reported in paths, not as a file outside the list.
