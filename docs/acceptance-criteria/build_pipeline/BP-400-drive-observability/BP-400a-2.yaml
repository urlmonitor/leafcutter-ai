criteria: |
  Given emit_event.py is invoked with --log pointing to a path whose
    parent directory does not yet exist
    (e.g. --log /tmp/new_dir/subdir/telemetry.jsonl),
  When the script attempts to write the log entry,
  Then it creates the missing directory hierarchy (mkdir -p semantics),
  And exits with code 0,
  And the log file exists at the specified path with the appended entry.
