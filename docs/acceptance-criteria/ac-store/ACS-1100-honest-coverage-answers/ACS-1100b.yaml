notes: |
  A bare number is not enough: "180 of 180" is meaningless if the scope silently
  excluded a whole folder. The stated method is what makes a denominator
  reviewable, and it is also the mechanism by which the ACS-100h-7a-exempt
  tree-limit counter satisfies ACS-1100 without a second traversal — the single
  shared callable reports the parents it examined and the exclusions it applied.

  Deliberate exclusions are legitimate and expected (deprecated records,
  superseded records, non-AC YAML, and records outside the requested scope). The
  requirement is that they be DECLARED, not that they be eliminated. An exclusion
  with no stated ground is a gap, and ACS-1100c governs what happens then.

  "OUTSIDE THE REQUESTED SCOPE" IS A FIRST-CLASS GROUND (added 2026-08-13 on expert
  review). All eight AC pre-commit hooks resolve their work set from git diff
  --cached. Without this ground a staged-scope hook would halt on every commit,
  reporting thousands of records unaccounted for. With it, the hook reads honestly:
  "3 of 3 staged, scope = staged paths; store = 2,784". The ground is only
  legitimate when the scope is DECLARED and the store total is reported alongside
  the scope total — otherwise it becomes the laundering channel it was added to
  prevent.

  AGE IS NOT A GROUND (added 2026-08-25, BA, via ACS-1100b-4). The NEGATIVE half of
  the list above had one entry missing, and it is the one a validator in this
  repository is relying on today: check_components_integrity.py checks only the
  components appearing in the diff and records that existing components with no
  diff are not checked, legacy state accepted. That is an exclusion of 36 of 45
  registry entries whose only ground is that the records pre-date the rule.
  ACS-1100b-4 rules it out before ACS-1100e-1 writes the published list, and
  ACS-1100b-4-i supplies the honest alternative for a backfill actually in progress
  — a declared, dated, owned count that may fall and may not rise.

  ALREADY SATISFIED, FOR ONE SURFACE ONLY (2026-08-18, PO). KM-ADM-005's shipped
  edge note is a method record in all but name, and it is the SAME exclusion ground
  as the paragraph above ("outside the requested scope") applied to a gate rather
  than a query: check-done-proof's scope is the diff, the note declares that scope,
  and it reports the store population alongside it. Two consequences for L2:
    - Use it as the worked example when specifying the method record's fields;
      scope / inclusion rule / exclusion grounds / measurement provenance are all
      present in it already.
    - It is missing one thing this L1 requires and should be treated as the gap:
      the AGE of the figure is declared but nothing acts on it. A method record
      whose measurement date is stale is still a declared method — decide at L2
      whether staleness is a b-concern (declare it) or a c-concern (halt on it).
      Do not leave that unassigned.
