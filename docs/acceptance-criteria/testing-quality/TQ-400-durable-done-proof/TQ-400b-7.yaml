      are checked by running it, not by re-reading the schema.
assigned_agent: documentation-expert
estimated_complexity: S
it_requirements:
  - >-
    THIS IS AN ACCEPTANCE STANDARD, NOT A SECOND DOCUMENTATION TASK — THE MOST
    IMPORTANT CONSTRAINT ON THIS RECORD. TQ-400b-2's it_requirements ALREADY carry
    the obligation to document demotion_reason and demotion_date in
    docs/reference/ac-schema.md, in the same change as the
    config/ac_store_schema.json edit. That obligation stands, is owned by
    TQ-400b-2, and is NOT duplicated here. What this AC adds is the quality bar
    that one entry must meet. An implementer working this AC must therefore
    AMEND OR COMPLETE the entry TQ-400b-2 produces — never open a second section,
    a second document, or a parallel account of the same two fields. Two accounts
    of one field pair is precisely the drift the final criterion forbids, and it
    is the drift this repo has already shipped in the code layer.
  - >-
    TARGET DOCUMENT AND SITE — docs/reference/ac-schema.md, in the existing field
    reference, sited alongside the other work_status-related field entries. The
    file is 846 lines and already over the 300-line advisory budget
    (check_doc_length, severity warn), which is a further reason to complete the
    existing entry rather than add a new top-level section.
  - >-
    IF TQ-400b-2'S ENTRY IS ALREADY PRESENT WHEN THIS AC IS WORKED, THE
    DELIVERABLE MAY BE A ZERO-LINE DIFF PLUS A RECORDED VERIFICATION. That is a
    legitimate outcome and must be reported as one. Do not manufacture an edit to
    satisfy a diff-based documentation check — documentation-verifier's real-diff
    assertion is the floor for a NEW document, not a licence to duplicate an
    adequate entry. If the entry falls short, amend it in place and say which of
    the six required facts were missing.
  - >-
    SIX FACTS PER FIELD, ALL SIX EXPLICIT. For each of demotion_reason and
    demotion_date: (1) type, (2) whether it may be empty, (3) the value that means
    the record was never demoted, (4) which process writes it, (5) at what moment,
    and — for demotion_date only — (6) that it records the FIRST demotion and is
    never rewritten by a later run. Fact 6 cannot be inferred from the type and is
    the one an author writing to satisfy a presence check omits; losing it destroys
    the lapse-duration information the cadence reports depend on.
  - >-
    STATE EXPLICITLY THAT A RECORD CARRYING NEITHER FIELD IS VALID. All existing
    records in the store predate the demotion path; without this sentence a reader
    reasonably concludes they are malformed. Neither field may appear in the
    schema's required list (TQ-400b-2 already carries that constraint) and the
    entry must say so in reader-facing terms.
  - >-
    THE ACCEPT/REJECT ACCOUNT MUST BE FALSIFIABLE, SO WRITE IT AS EXAMPLES. Give at
    least one example record the store's validator accepts and at least one it
    rejects (e.g. a malformed demotion_date), in the form a reader would actually
    write by hand. Prose alone about "valid values" is not extractable, and the
    round-trip criterion is only checkable if the examples can be lifted out and
    fed to scripts/ac_store/validate_ac_schema.py.
  - >-
    WRITE AGAINST THE DELIVERED FIELD SHAPE, NOT AGAINST THIS AC'S WORDING. If
    TQ-400b-2 ships a different type, nullability, or date format from what this
    record anticipates, the entry follows the delivery and the divergence is raised
    against TQ-400b-2 — it is never smoothed over in the reference.
  - >-
    SINGLE STATEMENT, ENFORCED BY LINKING. Every other mention of the two fields —
    docs/how-to/done-proof-enforcement.md (TQ-400a-5), the state diagram
    (TQ-400b-6), the triage guide (TQ-400d-5) — names the fields and LINKS here for
    their rules. Any of those that restates a rule is a second account that will
    drift; check for them at authoring time rather than trusting the convention.
  - >-
    SEQUENCE AFTER TQ-400b-2'S SCHEMA EDIT AND WRITER LAND. Both the field shapes
    and the validator's behaviour are claims about shipped code; the round-trip
    criterion cannot be satisfied before there is something to round-trip against.
  - >-
    The file is a tracked reference subject to check_doc_frontmatter and
    check_doc_links; keep both passing in the same commit.
delivers_to:
  - agent: architecture-diagram-author
    ac_id: TQ-400b-6
    contract: >-
      The single normative account of demotion_reason and demotion_date — type,
      nullability, never-rewritten rule, and the never-demoted value — published in
      docs/reference/ac-schema.md. TQ-400b-6's state diagram LABELS the demotion
      edge with the two field names and links here for their semantics; it must not
      restate them.
expects_from:
  - ac_id: TQ-400b-2
    contract: >-
      The two fields as delivered — their names, types, nullability, the closed
      set of values each can take, and the schema change that admits them. This
      AC's reference entry describes exactly that delivery; if the delivered
      shape differs, the entry follows the delivery, not this AC's wording. ALSO
      the field-reference entry itself: TQ-400b-2's it_requirements already oblige
      it, so this AC receives an entry to complete rather than a blank page.
  - ac_id: TQ-400b-4
    contract: >-
      The never-rewritten rule for the demotion date, which is the one semantic
      the field's type cannot express and which the reference must state
      explicitly.
test_spec:
  - name: test_tq400b7_reference_states_all_six_facts_for_both_demotion_fields
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      Read the published docs/reference/ac-schema.md and assert that, for each of
      demotion_reason and demotion_date, the entry states type, emptiness, the
      never-demoted value, the writing process and the moment of writing — and
      that the demotion_date entry states the first-demotion / never-rewritten
      rule. Also assert the entry states that a record carrying neither field is
      valid.
  - name: test_tq400b7_documented_shapes_agree_with_the_shipped_schema_and_no_second_account_exists
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      TWO SOURCES, ONE VOCABULARY, BOTH DIRECTIONS. Load
      config/ac_store_schema.json and assert the field names, JSON types,
      nullability and date format the reference documents agree with what the
      schema declares — no documented property the schema lacks, and no demotion
      property in the schema left undocumented. Then scan docs/ for any OTHER file
      that DEFINES (rather than links to) either field's type, nullability or
      never-rewritten rule, and assert there is none. That scan is the mechanical
      form of the single-statement criterion.
  - name: test_tq400b7_reference_examples_are_accepted_and_rejected_by_the_real_validator
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: reachability
    description: >-
      PRODUCTION ENTRY POINT, BOTH POLARITIES. Extract the example records from the
      entry, write them into a temp store, and run
      scripts/ac_store/validate_ac_schema.py as a SUBPROCESS: every example the
      reference calls valid must pass, and every example it calls invalid must be
      rejected (must_block). Re-implementing the schema check inside the test
      proves nothing about the validator a reader will actually meet.
  - name: test_tq400b7_a_real_pre_demotion_record_still_validates
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      Take an actual on-disk AC file from docs/acceptance-criteria/ that carries
      neither demotion field, copy it verbatim into a temp store, and run the real
      validator over it — it must pass. This is the bytes-as-written check behind
      the "records that predate the demotion path are not malformed" clause; a
      hand-built dict reproduces the author's assumption instead of the store's
      actual shape.
test_rationale: >-
  change_target is docs, and the cheapest satisfying artifact here is two field
  rows — which would pass a file-diff check and answer none of the reader's
  questions. Two of this AC's clauses are round-trips against shipped programs and
  therefore fully mechanical: what the reference says the validator accepts is
  checked by running the validator on the reference's own examples in both
  polarities, and the pre-demotion-record clause is checked against a real
  on-disk record rather than a fixture. The single-statement clause is also fully
  mechanical and is folded into the seam entry as an absence scan, because a
  reviewer reading this AC's diff sees an addition and has no way to know another
  document already defines the same fields. NOT MECHANICALLY TESTABLE: "a reader
  can state its type / can say in advance which values will be rejected" is
  comprehension. The proxy is deliberately structural — assert the six facts are
  each PRESENT (not merely that the field name appears) and assert via the seam
  entry that what is present is TRUE of the shipped schema. Presence plus
  correctness is the checkable half of "can state correctly"; the reader's success
  is not observable by a test. Note also that this AC may legitimately produce a
  zero-line diff if TQ-400b-2's entry already meets the bar — the tests are
  written against the published entry, not against this AC's diff, precisely so
  that outcome is a pass rather than a reason to duplicate.
