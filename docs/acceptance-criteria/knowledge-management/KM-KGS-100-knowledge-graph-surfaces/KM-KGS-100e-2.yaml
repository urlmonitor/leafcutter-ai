roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100e.yaml"
criteria: |
  Given a ticket file and a documentation file, each carrying frontmatter and each
    belonging to a knowledge-map surface that declares a component-membership
    relationship
  When each file is validated at commit time while its frontmatter declares no
    component membership
  Then the ticket file is rejected and its commit is blocked
  And the documentation file is rejected and its commit is blocked
  And each rejection message names the file and states that a component membership
    must be declared
  And each of the same files passes validation once it declares
    components: ["knowledge-management"]
depends_on:
  - KM-KGS-100e
doc_links:
  - path: config/paths.json
    relationship: specifies
    status: exists
  - path: scripts/commit_guardian/check_ac_schema.py
    relationship: context
    status: exists
  - path: docs/reference/ac-schema.md
