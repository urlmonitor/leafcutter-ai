id: ACD-1200f-2-i
readiness: approved
priority: high
title: "traverse_ac_tree emits each leaf once even when reachable by multiple covered_by paths"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given the AC store contains a tree where a leaf is reachable by more than one
    covered_by path — e.g. an L1 whose covered_by lists ALL descendants
    (children and grandchildren) while each L2 child ALSO lists its own L3
    children:
    - ROOT-002 (level: L0, covered_by: [ROOT-002a])
    - ROOT-002a (level: L1, covered_by: [ROOT-002a-1, ROOT-002a-1-i, ROOT-002a-2])
      - ROOT-002a-1 (level: L2, covered_by: [ROOT-002a-1-i])
        - ROOT-002a-1-i (level: L3, covered_by: [])
      - ROOT-002a-2 (level: L2, covered_by: [])
  When traverse_ac_tree is called with root_id=ROOT-002,
  Then the result contains ROOT-002a-1-i EXACTLY ONCE (not twice), even though
    it is reachable both directly from ROOT-002a's covered_by and indirectly
    via ROOT-002a-1's covered_by,
  And every other leaf (ROOT-002a-1, ROOT-002a-2) appears exactly once,
  And the total leaf count is 3 (no duplicates).

  And the bug symptom (a leaf id appearing more than once in the returned list,
    which causes goal_to_epic to generate duplicate tickets for the same AC)
    must not occur.
