created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500a.yaml
criteria: |
  Given two entry points for authoring acceptance criteria exist -- a lean entry point for
    writing one or two criteria without the full planning stages, and the full planning
    pipeline,
  When either entry point is invoked,
  Then both obtain their isolated authoring workspace through the same setup-and-confirmation
    behavior specified in BO-1500a-5, including its halt-on-unconfirmed outcome,
  And both write their criteria through the same store-writing behavior and deliver them
    through the same commit behavior,
  And a change to that shared setup-and-confirmation behavior is observable through both
    entry points without any further change to either entry point,
  And the lean entry point dispatches the same authoring agents the full pipeline uses,
    running only the subset of stages the lean path calls for.
depends_on:
