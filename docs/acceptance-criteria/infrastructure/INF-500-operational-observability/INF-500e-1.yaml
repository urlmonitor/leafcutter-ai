id: INF-500e-1
components:
  - infrastructure
  - agent_telemetry
title: "Delivery is scored on what was retracted, not only on what was claimed"
component: infrastructure
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the store held four criteria across one reporting period — "a" unfinished at
    the start and closed by the end, "b" closed at the start and unfinished by the
    end, "c" closed at both ends, and "d" absent at the start and unfinished at the
    end,
  When the period's criterion movement is computed,
  Then the period reports filed 1, done 1, reopened 1, net verified 0, and a store
    size of 4,
  So that a criterion going back from closed to unfinished subtracts from the week's
    verified total instead of leaving the earlier claim standing.

  Given a criterion that did not exist at the start of the period and is closed by the
    end of it,
  When the period's criterion movement is computed,
  Then it is counted once as filed and once as done, and the net verified total is 1,
  And it is not counted twice, nor excluded for having no starting state.

  Given a criterion that was closed at the start of the period and is absent from the
    store at the end of it,
  When the period's criterion movement is computed,
  Then the reopened count is 0,
  So that deleting records during a store cleanup cannot be read as the system
    retracting its own completed work.

  Given a period that closed 40 criteria and reopened none,
  When the period's discounted delivery score is computed,
  Then the score equals the net verified total of 40.

  Given a period that closed 40 criteria and reopened 40 of them, leaving a net
    verified total of 0,
  When the period's discounted delivery score is computed,
  Then the score is 0.

  Given a period that closed 36 criteria and reopened 47, leaving a net verified total
    of -11,
  When the period's discounted delivery score is computed,
  Then the score is negative,
  So that a week which retracted more than it closed cannot present as progress.

  Given a period in which nothing at all was closed,
  When the period's reopen rate and discounted delivery score are computed,
  Then both are reported as unknown rather than as 0,
  And computing them raises no error,
  So that "we closed nothing" is never rendered as a perfect trust reading.
