id: INF-700c-2
components:
  - infrastructure
  - knowledge_system
title: "Knowledge history that has already been honoured stops being reported as work outstanding"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
priority: medium
readiness: approved
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700c.yaml"
criteria: |
  Given a body of retained knowledge records that carry no learning text and
    whose named destinations already hold the learnings their agents wrote at
    the time — 28 such records exist today, naming 10 destinations of which 9
    are present and substantial,
  When the count of knowledge still waiting to be written is produced,
  Then those records contribute zero to that count,
  And they contribute zero on every subsequent run, with nobody re-applying a
    manual step between runs,
  And resolving them writes no learning to any knowledge surface and modifies
    no curated file,
  And a run whose whole input is records of this body reports "nothing
    outstanding" rather than "nothing could be routed", and its outcome is the
    same outcome a run over an empty input would report,
  And this holds however the resting state is reached, so a mechanism that
    leaves the body permanently unroutable and therefore permanently counted
    does not satisfy this criterion.
depends_on:
  - INF-700c
  - INF-700c-1
