  post_write_commands: []
  notes: |
    check_secrets.py reads security_scanner.scripts_dir from commit_guardian.json
    (".claude/skills/security-scanner/scripts") and does
    sys.path.insert(0, project_root / that_dir), then `from scan_secrets import
    scan_files`. In a worktree the deployed layout is .leafcutter/, so the .claude path
    does not exist and the import raises ModuleNotFoundError (observed live in the
    BO-2600 worktree; the manual workaround was a .claude/skills -> .leafcutter/skills
    symlink). Fix: make the scripts-dir resolution layout-aware — resolve relative to
    the deployed hook's own __file__ (its skills/security-scanner/scripts sibling), or
    try the .leafcutter layout before falling back to the configured .claude path.
    Preserve main-checkout behavior. ADR-001: edit the canonical templates/ copy;
    build.py propagates to materialized copies.
test_spec:
  - name: test_check_secrets_imports_scan_secrets_in_worktree_layout
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "With only the .leafcutter deployed layout present (no .claude scripts dir), check_secrets resolves and imports scan_secrets without ModuleNotFoundError"
  - name: test_check_secrets_main_checkout_layout_still_works
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "The main-checkout resolution path is unchanged (backward compatible)"
