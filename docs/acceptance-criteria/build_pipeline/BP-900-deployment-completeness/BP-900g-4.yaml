it_requirements:
  - "Extend the extraction patterns in scripts/build_referential_integrity.py so an optional output-root prefix is accepted before `scripts/`, and the captured value is normalised to the bare `scripts/...` deploy-namespace key the guard already compares against. Accept both the literal `{{config.output_root}}/` template form and an already-rendered `.leafcutter/` prefix, since templates are scanned pre-render but the same text may appear rendered. Do NOT widen the pattern to arbitrary prefixes — an unanchored match would capture unrelated paths and produce false-positive build failures, which is the defect class EPIC-BuildGuardFalsePositive already fixed once."
  - "Add a build phase that deploys scripts/build_orchestration/ to the consumer tree, mirroring build_knowledge_scripts (which closed the same Class B deploy gap for harvest_learnings.py in EPIC-BuildGuardFalsePositive/03). Register a matching _manifest_build_orchestration_scripts entry so the stale-file sweep does not delete the newly deployed files, and extend _get_source_paths_for_guard in lockstep — test_guard_source_paths_match_deployable_set asserts those two sets stay 1:1 and will fail otherwise."
  - "Correct templates/agents/build-ac.md Step 2b.1 so its --ac-root argument is `docs/acceptance-criteria`, matching the form the same template already uses at its other call sites, rather than an output-root-prefixed path that exists in no layout."
  - "Verify behaviorally: assert the EXTRACTOR returns the normalised key for an output-root-form reference (the unit-level blind spot), AND assert against a real build.py --target-dir run into a temp root that every script referenced by a deployed agent template exists in that deployed tree. A test that only calls the guard on the real package is INSUFFICIENT — test_guard_exits_0_on_clean_package already did exactly that and passed green while the bug was live (CLAUDE.md 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep')."
