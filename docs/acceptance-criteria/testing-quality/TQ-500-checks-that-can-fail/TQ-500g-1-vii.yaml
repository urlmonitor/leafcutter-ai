assigned_agent: llm-expert
estimated_complexity: M
package_surface: false
delivers_to:
- agent: python-coder
  ac_id: TQ-500g-1-viii
  contract: >-
    On /build-epic, for every ticket whose commit phase is dispatched, including one with no
    source_ac, ticket-supervisor runs the finish wrapper with --record "<ticket_key>" immediately
    before each commit spawn. ticket_key is the value build-epic.js put in the dispatch prompt,
    never one the supervisor derives. The runner itself then writes
    <git-dir>/leafcutter/gate-verdicts/<ticket_key>/wrong_version.json (git-dir = git rev-parse
    --absolute-git-dir of the worktree). The supervisor never writes, edits or deletes a record or the
    marker (open.json). When the writer stops, no record is written and the supervisor has already
    reported the ticket blocked.
expects_from:
- ac_id: TQ-500g-1-v
  contract: >-
    Gate wrapper CLI (merged, PR #1280): python <worktree>/{{config.output_root}}/scripts/build_orchestration/wrong_version_gate.py
    finish --work-key <key> --reply - [--ac-ids <comma-separated ids>] --ac-root <path> --test-root
    <worktree root> --base-ref <ref>, with the raw test-breaker reply on stdin (empty when nothing was
    owed). --ac-ids is omitted when the ticket has no source_ac. stdout is exactly one JSON object
    {gate_passed: bool, stopped_at: null|"write", writer: <writer write JSON>|null, verdict: <runner run
    JSON verbatim>|null}; exit 0 if and only if gate_passed. An internal error still prints the shape with
    gate_passed false.
- ac_id: TQ-500g-1-ix
  contract: >-
    Writer list step (merged): python <worktree>/{{config.output_root}}/scripts/build_orchestration/wrong_version_writer.py
    list --ac-ids <ids> --ac-root <path> --test-root <path> --base-ref <ref>. It prints {owed: [{name,
    files, scope}], error: str|null}; exit 0 when printed (also when owed is []), 1 when the AC store or
    test root cannot be read. The route passes owed to test-breaker unchanged.
- ac_id: TQ-500g-1-x
  contract: >-
    list and finish both take --base-ref (default HEAD). Owed items carry scope ("declared" | "derived"),
    passed to test-breaker unchanged. With --base-ref HEAD the derived scope is the worktree's uncommitted
    changes, tracked and untracked, which is why the batch must run one ticket at a time when it owes runs.
- ac_id: TQ-500g-1-iv
  contract: >-
    Dispatch of agent test-breaker (already in ticket-supervisor's spawn_allowlist; its registry
    spawned_by already names ticket-supervisor): inputs {work_key: str, repo_root: str (absolute worktree
    root), requirement_ids: [str], wrong_versions: [{name, files, scope}]}. One JSON reply, which the
    supervisor hands to finish unchanged and never reads as an outcome.
- ac_id: TQ-500g-1-i
  contract: >-
    The runner's JSON verdict carried in finish's verdict field ({gate_passed, applicable, verified,
    outcome, reason, results, survivors, unfinished}). With no ids its outcome is "wrong-version runs not
    applicable: no source requirement".
- ac_id: TQ-500g-1-viii
  contract: >-
    (a) The record option --record <ticket-key> on the runner's run step and on finish, which passes it
    to the runner unchanged; NOT on main as of adb0c2e61, added by TQ-500g-1-viii in this same change.
    (b) build-epic.js's dispatch prompt to ticket-supervisor carries two new plain fields:
    ticket_key: <the ticket file's stem, already checked against ^[A-Za-z0-9._-]+$> and runs_alone:
    true|false (true when the ticket's chunk holds only this ticket). (c) build-epic.js runs the runner's
    recover step once at the drive head, so the supervisor runs no recover of its own.
it_requirements:
- >-
  Where: edit the ticket-level algorithm in templates/skills/building-epics/SKILL.md (section 2.1 step
  2, where the commit spawn goes through section 5.9, and section 5.9 itself) and add one subsection
  holding the gate steps of TQ-500f-3-iv and this AC. Change templates/agents/ticket-supervisor.md
  only where it restates that algorithm (its commit-lock / section 5.9 paragraph and its inputs list,
  which gains ticket_key and runs_alone). One llm-expert change with TQ-500f-3-iv.
- >-
  When: immediately before EVERY commit spawn, after the last pre-commit phase (review included). Every
  means: the first commit spawn, a re-spawn after a retry, after a handoff, and after a remedy agent
  (for example restructuring-specialist after a file-size refusal), because the code may have changed.
  Never reuse an earlier list, reply or finish result. A ticket whose commit phase is not dispatched in
  this drive gets no runs.
- >-
  Order inside the commit lock (section 5): (a) acquire the lock (section 5.2); (b) run the input check,
  the serial check and the sequence below; (c) when finish's gate_passed is true, continue with section
  5.9 steps 2 to 5 under the SAME lock (do not acquire it twice); (d) on any halt, release the lock
  (section 5.3), dispatch no commit, and return blocked. finish alters files in the worktree that
  sibling tickets share, so the sequence never runs outside the lock.
- >-
  Input check, before any command (mirrors TQ-500g-1-vi's wvBad). ticket_key and every source_ac id
  must match ^[A-Za-z0-9._-]+$; the worktree root must contain none of the characters ", $, backtick,
  CR or LF. When ticket_key is missing from the dispatch input (ticket-supervisor started by the user,
  not by build-epic.js), use the ticket file's stem and check it the same way. On a failed check run
  no command and return blocked with wrong_version_step "input-check" and wrong_version_detail = the
  list of rejected values.
- >-
  Serial check (TQ-500g-1-vi M-2, user decision 2026-10-21). When runs_alone is false and the ticket's
  source_ac is non-empty, run no wrong-version command and return blocked with wrong_version_step
  "batch-serial-check", wrong_version_detail {source_ac: [ids]}, message "This ticket owes
  wrong-version runs but its batch ran in parallel; no wrong-version step ran." A missing runs_alone
  counts as true only when the ticket was not dispatched by build-epic.js (no ticket_key in the input).
- >-
  Sequence, the same as the merged twins (build-feature.js wvRuns). Each command is ONE Bash call, run
  from the worktree root, no cd, no pipe, no && chain. <root> is the worktree root with backslashes
  turned into forward slashes; <ids> is the source_ac ids joined by commas.
  (1) Only when source_ac is non-empty, the list step, exactly:
  python "<root>"/{{config.output_root}}/scripts/build_orchestration/wrong_version_writer.py list --ac-ids "<ids>" --ac-root "<root>/docs/acceptance-criteria" --test-root "<root>" --base-ref HEAD
  (2) Only when owed is non-empty: spawn test-breaker with the input JSON {work_key: <ticket_key>,
  repo_root: <root>, requirement_ids: [<ids>], wrong_versions: <owed, unchanged, scope included>}.
  (3) Always, the finish step, exactly (for K3 drop the --ac-ids "<ids>" pair):
  python "<root>"/{{config.output_root}}/scripts/build_orchestration/wrong_version_gate.py finish --work-key "<ticket_key>" --reply - --ac-ids "<ids>" --ac-root "<root>/docs/acceptance-criteria" --test-root "<root>" --base-ref HEAD --record "<ticket_key>" <<'<DELIM>'
  followed by the reply, a newline when the reply is non-empty, and <DELIM> on its own line.
  (4) Spawn commit only when finish's own stdout JSON has gate_passed true.
- >-
  Reply transport. <DELIM> starts as WV_REPLY_EOF and gains _X while the reply contains it. The quoted
  delimiter means no $, backtick or quote in the reply is expanded. The supervisor never edits,
  reformats, extracts, summarises or completes the reply. A string reply goes in as is; a failed,
  refused or empty test-breaker spawn goes in as an empty reply (the writer then stops). Nothing owed:
  test-breaker is not spawned and finish runs with an empty here-document. The supervisor never decides
  by itself that nothing is owed: only the list step says so.
- >-
  Fail closed on every reply. list: stdout must parse as one JSON object with owed an array and error
  null, else halt with step "list". finish: gate_passed must be a boolean and true, else halt with step
  "finish". A non-zero exit, an empty stdout or prose counts as no reply. A writer stop (stopped_at
  "write") is a halt like any other; never retry by running the runner without a manifest.
- >-
  Halt shape (the fast lane's keys): return {status: "blocked", message: "Wrong-version <step> step did
  not pass: <the parsed reply as JSON text, or null>", ticket_path, gate: "wrong_version_gate",
  wrong_version_step: "input-check" | "batch-serial-check" | "list" | "finish", wrong_version_detail:
  <the parsed reply verbatim, or null>}. Set the commit phase to failed through the signoff skill
  (section 4) so a re-drive repeats the sequence.
- >-
  Outcome: on every ticket that reached finish, return wrong_version_outcome = finish's verdict.outcome
  verbatim (null when finish gave no verdict) in the result payload, beside red_baseline_gate from
  TQ-500f-3-iv. K3's value is "wrong-version runs not applicable: no source requirement". Never record
  or report "verified" for it.
- >-
  The record is the runner's. finish is called with --record "<ticket_key>"; the supervisor never
  writes, edits, moves or deletes anything under <git-dir>/leafcutter/ and never substitutes its own
  account of the verdict.
- >-
  No recover call. build-epic.js runs the runner's recover step once at the drive head
  (TQ-500g-1-viii). recover closes every open journal in the worktree, so a supervisor-side recover in
  a parallel chunk could put back a sibling's in-flight alteration. Do not add one.
- >-
  These steps run on every ticket-supervisor drive, not only when dispatched by build-epic.js: the
  supervisor cannot reliably tell routes apart, and a route condition would be a skip path. Outside
  /build-epic no marker is open, so the backstop hook ignores the records.
- >-
  Size: templates/skills/building-epics/SKILL.md (1343 lines) and templates/agents/ticket-supervisor.md
  (736 lines) are outside check-file-size (.md is not a checked extension) and outside check-doc-length
  (docs/ only), so no ratchet applies. Expected growth with TQ-500f-3-iv: SKILL.md about +70 to 100
  lines (one new subsection plus the section 2.1 and 5.9 edits), ticket-supervisor.md about +10 to 20.
  Much more than that means rule logic leaked into the prompt.
- >-
  Ship in ONE change with TQ-500f-3-iv and TQ-500g-1-viii. Without -viii the record option and the
  ticket_key / runs_alone fields do not exist. Without this instruction, -viii's hook blocks every
  /build-epic commit. TQ-500g-1-v and -vi are on main (adb0c2e61).
- >-
  The edit passes prompt-audit: each command is a single invocation (a here-document on the finish call
  is part of that one command), and the spawn_allowlist covers every spawn (test-breaker is already
  listed). No template text search is used as a test.
test_required: false
test_rationale: >-
  Prompt-only (change_target: prompt). Whether the supervisor follows a runbook instruction cannot be
  unit-tested without a template text search, which CLAUDE.md forbids. The rule is tested in
  TQ-500g-1-i, the owed list in TQ-500g-1-ix, the wrapper (verdict verbatim, writer stop never reaches
  the runner, reply byte for byte) in TQ-500g-1-v. The parts that are code are tested in
  TQ-500g-1-viii: the ticket_key and runs_alone fields in the dispatch prompt, the one-ticket-per-chunk
  rule and the drive-head recover in build-epic.js under the workflow-engine harness, the record the
  runner writes through finish, and the hook that blocks the commit when that record is missing,
  unreadable, stop or out of date. So a skipped or altered instruction is visible and blocking.
  Substitutes for the prompt itself: pr-reviewer against the Then clauses, and a live /build-epic
  drive of a fixture epic with K1 to K3.
