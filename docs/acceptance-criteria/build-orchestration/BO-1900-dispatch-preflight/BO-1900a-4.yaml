test_rationale: |
  The emitted value was path-shaped and plausible, so nothing short of inspecting what
  a run actually produced can distinguish the defect from correct behaviour -- and the
  observed run masked it entirely, because a later step overwrote the value before
  anyone read it. Every descriptor therefore runs the real resolver and asserts on the
  value it emitted. The control case is essential: reporting undetermined forever
  passes the two negative descriptors and breaks every drive, so the hand-off has to
  be pinned in the same suite. The last descriptor exists because the twin obligation
  is currently enforced only by a comment in the file headers.
