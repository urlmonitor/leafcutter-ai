id: ACD-200a
title: "BA v3 produces documentation ACs when decomposing features with flows or state"
component: ac-driven-dev
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Given business-analyst-v3 is decomposing an L1 feature AC into L2/L3 behaviors,
  When the feature introduces any of:
    - A new user-facing command or slash command
    - A new multi-step workflow with more than 2 actors
    - A new state machine (field with >2 states and explicit transitions)
    - A new architectural component (new script, agent, or hook),
  Then the BA v3 MUST also produce at least one documentation AC specifying:
    - A flow/sequence diagram AC for each multi-actor interaction
    - A state machine diagram AC for each new state field
    - A how-to guide AC for each new user-facing command,
  And documentation ACs are tagged with assigned_agent: architecture-diagram-author
    or documentation-expert as appropriate,
  And documentation ACs reference the behavioral ACs they document via depends_on.
depends_on: [ACD-200]
