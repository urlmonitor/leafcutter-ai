title: "Charter work settled by one definite check on the real agent's reply is asked for asserted proof, not judged proof alone"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a piece of charter work — an agent's instructions — whose behaviour is settled
    by asking the real agent once per case and accepting or rejecting its reply with one
    definite check, for example that the agent, sent the exact command
    echo "hello", returns that command's unchanged output rather than a refusal,
  When the proof it will be asked for is decided,
  Then it is asked for asserted proof,
  And it is never asked for judged proof alone, and no score, threshold or set of
    scored examples is demanded in place of that one check,
  And the demand names only the two proof kinds asserted and judged — asking the real
    agent is how that asserted proof is run, not a third kind of proof.

  Given a second piece of charter work whose behaviour is whether the agent does
    something reliably across many examples, which no single check can settle and only
    a score against a bar decides,
  When the proof it will be asked for is decided,
  Then it is asked for judged proof, so the rule for the first piece of work does not
    take judged proof away from work that needs it.
