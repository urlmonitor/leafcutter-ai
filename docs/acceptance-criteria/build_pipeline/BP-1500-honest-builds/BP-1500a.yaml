notes: |
  A REVIEWED L2 DRAFT ALREADY EXISTS for this L1 at
  /tmp/selfhost_leaf_build_clean.yaml. Its criteria, it_requirements and
  test_spec were reviewed and verified; only its id and parent are wrong (it was
  written at BP-900h-4, which is now a live unrelated approved record). Re-id it
  as the first L2 of BP-1500a and keep its content. Do not re-derive it.

  TWO CAUSES, ONE GUARANTEE -- kept as one L1 deliberately.

  The user-visible outcome is identical in both cases: you run the documented
  build on a clean tree and are left holding a tracked diff you did not author,
  which is easy to sweep into an unrelated commit with git add -A and easy to
  blame on a concurrent author. Both known-issue entries record that same trap in
  the same words. Splitting this into one L1 per defect would produce two point
  patches and hide that they are one promise. The two causes are:

  - KI-BP-001 -- the doc-index phase scans the deploy target while writing into
    the package repository, so it regenerates the index from a tree that has no
    docs. Every run leaves docs/INDEX.md as the sole working-tree modification,
    11 insertions and 172 deletions, reading "No docs found." in all nine
    sections. The generic rule is that a phase's scan root and its write target
    must resolve from the same base, so the content produced is a function of the
    sources being written from, not of where the build is deploying.
  - KI-BP-002 -- the generated agent cards derive from agent template
    descriptions and the AC store, are tracked, and are not regenerated by the
    pull requests that change those sources. One run rewrote six cards, 99
    insertions and 36 deletions.

  THE PRODUCT DECISION, restated because it is easy to "fix" the wrong way. The
  generated artifacts STAY TRACKED and reviewable in the pull request diff. The
  requirement is that a rebuild producing a different result FAILS A CHECK. An
  implementation that gitignores or stops generating them does not satisfy this
  L1.

  THE CLAUSE THAT MAKES OR BREAKS IT. The verdict must be computed over every
  tracked generated artifact in the repository, not over the subset appearing in
  the change under review. The artifact that drifts is by definition never in
  that subset -- a template's description changes and its card does not. The
  existing check-build-drift hook has exactly the change-set-scoped shape, which
  is precisely why KI-BP-002 goes uncaught. This is the M3 blind spot in
  docs/reference/false-green-mechanisms.md, live elsewhere as KI-CG-001.

  BOUNDARY. BP-900h-2 (consecutive builds produce zero git diff) measures the
  DEPLOYED output in a consumer-simulation scratch repository and cannot see
  either defect: KI-BP-001 writes into the package repository, and it is
  deterministic, so a second build reproduces the same wrong result and the
  idempotency comparison passes. BP-1000 (source-to-template parity) asks whether
  a source script matches its shipped copy, which is a different pair of files
  entirely. Cite both; duplicate neither.
