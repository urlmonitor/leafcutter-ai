notes: |
  Test-angle constraint — this is the AC most exposed to a grep-only false green.
  A test that reads the schedule definition and asserts a cron expression or a
  step name is present proves only that a string exists in a config file; it
  passes identically on a schedule wired to nothing, which is the "Neverfail Test"
  smell named in docs/testing/test-angles.md.

  What must be observed instead: fire the scheduled entry point, then observe a
  new dated report appear whose CONTENTS track a deliberate change made to the
  store between occurrences. Contents tracking the store is what proves the sweep
  really ran on that occurrence rather than a cached or stubbed result being
  republished.

  The separate-dated-reports clause is required by TQ-400c-3, which needs a
  previous run to compare against; a report that overwrites its predecessor makes
  the trend impossible to compute.

  IT-PO ENRICHMENT NOTE (2026-08-17). Two facts verified in the working tree that
  the implementer should not have to rediscover. First, the whole-store sweep is
  NOT new: check_all_done_acs already exists at
  scripts/commit_guardian/check_done_proof.py:403 and is already reachable via
  `main()` with `--mode ci` (:626). What is new is the schedule, the dated report,
  and the three-way outcome split. Second, the schedule surface genuinely does not
  exist: all five files in .github/workflows/ are event-driven, none carries
  `on: schedule`. Complexity is L for that reason, not for the sweep logic.
