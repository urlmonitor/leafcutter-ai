id: TQ-200c
components:
  - testing_quality
  - ac_store
  - llm_authoring
title: "Work that is proved by judgment is asked for that proof as reliably as work that is proved by assertion"
component: testing-quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  As someone who owns the pipeline's agents, I want every piece of work to be asked
  for the KINDS of proof it actually needs — the mechanically checkable ones and the
  judged ones — so that prompt, template and skill work stops arriving with no proof
  demanded of it at all, and so that the demand keeps working for kinds of work
  nobody has invented yet.

  Today the pipeline asks one question — "does a coding agent build this?" — and
  gives everything that answers no a free pass, reported as a success. That is how
  444 requirements assigned to the prompt-authoring agent came to be built with no
  test contract asked of them, and how 115 proofs their authors DID name were never
  written.

  The fix is not to demand ordinary unit tests of prompt work, and it is not to send
  everything a model touches off to be scored. What makes a proof one kind or the
  other is how its pass is decided, not whether a model is involved. A proof is
  ASSERTED when one definite check decides it: a declaration is well-formed, a rule
  is obeyed, a registry agrees with a template, a step really got dispatched — or
  the real agent, actually asked, gave back a reply that one definite check accepts
  or rejects. A proof is JUDGED when no single check can decide it and the answer is
  a score across many examples held against a bar: does the prompt reliably elicit
  the intended behaviour from a model. Asking the real agent is a way of running an
  asserted proof, not a third kind of proof. Most real prompt work needs BOTH kinds.

  After this, the pipeline can tell which kinds a piece of work needs, never asks for
  a score alone where one definite check settles the question, can ask for both kinds
  at once, has words for "this proof is asserted" and "this proof is judged" that
  mean the same thing to whoever writes the plan and whoever runs it, lands the
  judged half in the eval harness that already exists, and refuses to report a proof
  it could not honour as a pass.
