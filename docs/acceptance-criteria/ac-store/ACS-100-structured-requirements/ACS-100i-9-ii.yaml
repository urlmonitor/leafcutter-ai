change_target: code
risk_surface: safety
test_required: true
test_rationale: |
  This criterion is entirely about the difference between two outcomes that a
  grep-based or exit-code-only test cannot tell apart: "checked everything,
  found nothing wrong" and "could not check anything". Any test that asserts
  only `exit == 0` passes on both, and therefore proves nothing here.

  Execute the validator three times against the same real on-disk fixture store,
  varying only the registry: (1) registry file deleted, (2) registry present but
  containing `{}`, (3) registry present and valid. In cases 1 and 2 assert a
  zero exit AND assert the captured output contains a statement that the
  producer-name check was skipped, naming the reason. In case 3 assert a
  non-zero exit naming the offending record. The three-way comparison is the
  test; no single run demonstrates the property.

  Assert on the reported count of records examined in every case (KI-ACS-001):
  a run that examined zero records must not be reportable as a pass, and the
  skip message must not be produced by a run that simply had no input.

  Do the same for both entry points. The commit-time hook family is documented
  fail-open and several of its members ignore argv entirely, reading the git
  index or HOOK_TEST_FILES instead — so a test that passes a path on the command
  line may be asserting against a run that never saw the file. Verify the hook
  actually saw the fixture (assert the file path appears in its output on the
  refusal case) before trusting any exit code from it.
declares_side_effect: false
notes: |
  This is the guard on the guard, and it is not hypothetical in this repository.

  The `components` precedent this rule copies skips its registry check when the
  registry is empty — `components_field_errors` does exactly that, deliberately,
  so an unreadable `docs/components.json` never blocks all commits. That is the
  right call. What the precedent does NOT do is say so. Copying it verbatim
  would produce a rule that is correct and inaudible.

  Two documented incidents make the cost concrete. GE-120 named the case: a hook
  that could not RUN AT ALL took the fail-open path and reported SUCCESS, making
  "green" indistinguishable from "did not run". KI-ACS-001 is the same shape in
  the other direction: the store-wide validator exited 0 on a bare directory,
  and the CLAUDE.md instruction that prescribed exactly that invocation was
  therefore a no-op for eight days while reporting clean.

  The distinction to preserve, from the ac-store PROJECT_CONTEXT: fail-open on
  an INTERNAL ERROR (registry unreadable, parse failure) stays; the
  always-block-on-a-REAL-violation posture of ACS-100i-9 must NOT be relaxed to
  a warning. These are orthogonal and must not be collapsed into each other
  during implementation.
