estimated_complexity: L
it_requirements:
  - "THE KIND VOCABULARY IS THE STORE'S EXISTING change_target ENUM PLUS ONE VALUE (user decisions D1/D2/D3). config/ac_store_schema.json already defines it: code, schema, ui, infrastructure, pipeline, prompt, model, config, docs, dependency — ten values on 3,381 of 3,694 records (code 1241, pipeline 884, prompt 449, docs 260, config 90, schema 73, infrastructure 32, ui 10). Add `diagram`, giving eleven. `tests` is NOT among them. Resolve the enum through the SAME shared $defs $ref ACD-1800a-1 introduces; do not copy the list into the proof selector, or proof selection and the store drift and each is then correct against itself."
  - "THE PROOF CLASS IS DERIVED FROM PATH + CLAIMING REGISTRY, NEVER DECLARED (user decision D4). Deterministic, single pass, FIRST MATCH WINS, held as ONE ordered table — not a chain of ifs spread across the per-kind proof modules. The order, and the registries that resolve it: (1) config/agent_registry.json — agents[].template_path claims templates/agents/*.md -> prompt; (2) config/skill_registry.json — skills[].template_path claims templates/skills/<id>/ -> prompt; (3) templates/scripts/commit_guardian/commit_guardian.json — hooks_manifest entries claim their hook script paths -> pipeline; (4) scripts/build_phases.py — AC_STORE_DEPLOY_MAP and the sibling phase deploy maps claim deployed modules -> pipeline; (5) leafcutter-web/vitest.config.ts — the include globs (**/*.test.{ts,tsx}) and the leafcutter-web/ root claim front-end sources -> ui; (6) docs/components.json — components[].primary_code claims remaining source paths -> code, or schema for .sql; (7) docs/components.json — components[].detail_ref and docs/**/*.md -> docs, and a doc whose frontmatter declares a diagram_type from config/diagram_types.json, or a structured diagram source, -> diagram; (8) config/** and repo-root *.json|*.yaml|*.toml|*.ini not claimed above -> config; (9) NO MATCH -> no derived kind, which is BO-3500c-4's up-front refusal and NEVER a default to the cheapest class."
  - "WHY FIRST-MATCH-WINS AND WHY THE ORDER IS THAT ONE: the earlier entries are the narrower, more authoritative claims (a file a registry names explicitly) and the later ones are broad path patterns. A templates/agents/*.md file is also under a components[].primary_code glob for some components; without a fixed order it would resolve to two kinds on two runs. State the order as data so it is auditable, and make the ordering itself testable."
  - "A RECORD THAT STATES ITS OWN PROOF CLASS IS A DEFECTIVE DECLARATION, reported in the same reason-code family as BO-3500a-2 and never honoured. This is the record's fourth scenario and it is the one most likely to be dropped as pedantry: the second scenario — the load-bearing one — is otherwise defeated by an author typing a weaker class."
  - "PROOF STRENGTHS ARE ORDERED AND THE REJECTION MUST NAME THE OWED PROOF. Applying the written-page proof to a screen, a prompt or a config member is rejected with 'this kind owes the <named> proof', not 'failed' — an implementer must read which stronger check is due."
  - "EVERY ONE OF THE ELEVEN VALUES NEEDS AN ENTRY IN THE PROOF TABLE, INCLUDING `model` AND `dependency`, WHICH CURRENTLY HAVE ZERO LIVE RECORDS. 'Refused up front, no proof defined' is a legitimate entry; a MISSING entry is a fall-through, and a fall-through defaults to optimism (the fail-open shape BO-3500d-2-i names). Iterate the resolved enum in the test so a value added later cannot slip through unmapped."
  - "NO KIND'S PROOF IS 'THE ARTIFACT EXISTS'. Existence may be a clause only where the further checks defined for that kind are also applied."
  - "DEPLOY MANIFEST: the derivation table module will be imported by both the lane and the commit-guardian receipt validator; add it to the deploy list in scripts/build_phases.py and verify by running the DEPLOYED hook, not the source-tree unit tests."
  - "NO PRESENCE-ONLY ASSERTIONS. Every test below resolves a real path against the real registries or executes a proof; a test that greps the table for a kind name passes on a table nothing consults."
delivers_to:
  agent: python-coder
  contract: "derive_proof_kind(path) -> {kind: <one of the eleven change-target values plus diagram>, claimed_by: <registry id>, class: 'reading'|'comparing'} or a no-match sentinel that routes to BO-3500c-4's refusal. Single ordered resolution table, consumed by every per-kind proof (BO-3500c-2-i..v), by BO-3500c-1's receipt-shape validator (which checks the receipt against the DERIVED class), by BO-3500c-3's hollow guard and by BO-3500c-4's up-front refusal. One derivation call site for all of them."
expects_from:
  ac_id: ACD-1800a-1
  contract: "The shared change-target enum definition in config/ac_store_schema.json, reached by $ref rather than copied, already extended with `diagram` and already excluding `tests`. This record consumes that one definition; it must not restate the values."
test_spec:
  - name: test_kind_vocabulary_equals_change_target_enum_plus_diagram
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: seam
    description: "Resolve the proof table's key set and the schema's change_target enum at runtime and assert the first equals the second union {diagram}; the test must not carry a literal list of its own."
  - name: test_tests_is_not_a_selectable_kind
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: failure
    description: "`tests` resolves to no kind and selects no proof; a member attempting it is rejected rather than routed."
  - name: test_proof_class_derived_from_path_and_claiming_registry
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: criterion
    description: "A path under leafcutter-web matched by the vitest include globs derives to ui/comparing; a templates/agents/*.md path named by agent_registry derives to prompt/comparing; a docs/**/*.md path derives to docs/reading. Assert kind, claimed_by and class."
  - name: test_resolution_order_is_first_match_wins
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: boundary
    description: "Construct a path claimed by two registries at different table positions and assert it resolves to the earlier one, deterministically across repeated calls."
  - name: test_declared_proof_class_is_ignored_and_reported_as_a_defect
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "A screen member declaring itself reading-class still gets the screen proof applied; assert both the applied proof and the emitted defective-declaration reason code."
  - name: test_written_page_proof_applied_to_a_screen_is_rejected
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "THE SECOND SCENARIO'S TEST. Produce a screen member whose file exists and changed in the diff and assert the member is NOT finished — the implementation that applies the page proof to everything fails only here."
  - name: test_rejection_names_the_owed_proof
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "The rejection carries the member's kind and the name of the proof that kind requires, as fields."
  - name: test_unclaimed_path_yields_no_kind_and_routes_to_the_refusal
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: failure
    description: "A path no registry claims returns the no-match sentinel and the caller routes it to BO-3500c-4's refusal — assert the routing, not merely the sentinel."
  - name: test_every_vocabulary_value_maps_to_a_proof_or_an_explicit_refusal
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: boundary
    description: "Iterate the resolved eleven-value enum and assert each has a table entry — a defined proof or an explicit no-proof-defined refusal. A value with no entry fails, so a later addition cannot fall through."
