assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    fastlane_foreign_occupant_report:
      type: object
      description: "The `refusal` sub-object of the BO-2400f-13 payload as populated when the occupant does NOT classify as this lane's own prior attempt at this criterion. `foreign` is the DEFAULT: it is what the classifier returns whenever `own_prior_attempt` cannot be established, not a separate positive finding."
      required: [occupant, occupied_path, occupant_branch, occupant_kind, options]
      properties:
        occupant:
          type: string
          enum: [foreign]
          description: "There is deliberately no third value. An occupant the run cannot classify with confidence — a detached-HEAD worktree, a porcelain block with no branch line, a symlink, an unreadable path, a porcelain read that fails or parses to nothing — is FOREIGN. Guessing 'probably mine' is the failure that destroys unrecoverable work."
        occupied_path:
          type: string
          description: "Absolute path, always named."
        occupant_branch:
          type: [string, "null"]
          description: "The branch the occupying worktree is on, when it is a registered worktree. Null for a bare directory or a detached-HEAD occupant — and null must render as 'not a registered workspace' / 'no branch', never be omitted from the message."
        occupant_kind:
          type: string
          enum: [unregistered_directory, registered_worktree_other_branch, unclassifiable]
          description: "The two shapes fail differently and the operator's next move differs, so the message must distinguish them. `unclassifiable` is the fail-closed value and reads as foreign in every other respect."
        options:
          type: array
          minItems: 1
          description: "Every entry MUST have destructive: false. No clear, no remove, no --force, no move, no prune — the lane offers nothing it would carry out against work it does not own. Options are things the operator does themselves."
          items:
            type: object
            required: [action, description, destructive]
            properties:
              action: {type: string}
              description: {type: string}
              destructive:
                type: boolean
                enum: [false]
  reference_file_path: "templates/scripts/setup_ticket_worktree.py"
  n_location_rule: "1 — the same single classification helper BO-2400f-13-i populates the other branch of. Two independent classifiers, one per record, is the defect this rule exists to prevent: they will disagree, and the disagreement will favour whichever one runs first."
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/build_orchestration/ -q"
  constraints:
    - "PYTHON ONLY. Classification and message composition are in templates/scripts/setup_ticket_worktree.py, mirrored to scripts/ by build.py. No JS change is owed by this record."
    - "TWO DETECTION MECHANISMS ARE REQUIRED, AND THE MISSING ONE IS THE DEFECT. `git worktree list --porcelain` finds registered worktrees only. The occupant that actually produced KI-BO-015 was a hand-made directory at worktrees/bo-1500a-5 — no registered worktree, invisible to any porcelain-only lookup. So occupancy detection must ALSO stat the target path. An implementation that extends _worktree_exists with a fast-lane/ prefix and stops there fixes the tidy half and leaves the half that drew blood."
    - "FOREIGN IS THE DEFAULT, NOT A FINDING. Write the classifier so `own_prior_attempt` is the narrow, positively-established case (a porcelain block whose branch line is exactly refs/heads/fast-lane/<slug> for this slug) and everything else falls through to foreign. Written the other way round — foreign as the narrow case — a new occupant shape silently inherits the destructive option. This is the data-driven-default rule: the safe verdict must be the one you get by doing nothing."
    - "FAIL CLOSED ON THE LOOKUP ITSELF. If `git worktree list --porcelain` fails, times out, or yields output that does not parse, the verdict is foreign with occupant_kind `unclassifiable` — not 'no occupant found', which would proceed to the failing open, and not own_prior_attempt."
    - "NO DESTRUCTIVE OPTION MAY BE CONSTRUCTED ON THIS BRANCH AT ALL. Enforce it in the code path, not by review: the foreign branch must not have access to the clear-and-re-run option builder. A shared option list filtered at render time is how the destructive option leaks back in."
    - "THE TWO REFUSALS MUST BE DISTINGUISHABLE FROM THE PAYLOAD ALONE — different `occupant`, different `occupant_kind` where applicable, and different option sets. A test asserting only that some refusal came back is satisfied by an implementation that calls everything foreign, which loses the whole point of the split with BO-2400f-13-i."
    - "READ-ONLY ON THE OCCUPANT. For a foreign occupant the permitted operations are stat and the porcelain read. Not even `git status` inside it — it may not be a working tree, and running commands in another party's directory is outside what this refusal is allowed to do."
