    note: "Split by IT-PO across a hard technical surface boundary: a background workflow cannot inject into the main conversation. BO-1000c-1a (python-coder) makes the workflow emit each progress line to a durable, pollable run-progress journal as it happens; BO-1000c-1b (llm-expert) makes the /finalize-feature launcher poll that journal in flight and relay lines into the main conversation. Criteria preserved verbatim; union of the two children equals this behavior."
