notes: |
  The first scenario's x_helpers.py is the discriminator for "re-derive the list from what changed":
  a specialist that moved code into a new file has NOT been authorised to widen the commit. Whether a
  specialist's new file should join the commit is a separate decision this record does not make;
  reporting it is enough (BO-3800 owns the handoff semantics). "At most once" is per commit, per
  BO-3800a and BO-4500a-4 ("a specialist is engaged at most once, whatever these values are").
