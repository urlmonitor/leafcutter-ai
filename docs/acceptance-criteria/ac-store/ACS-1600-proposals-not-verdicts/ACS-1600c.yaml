criteria: |
  A tool examines by default and alters only when told to.

  Pointing a tool at your requirements record and running it never changes the
  record. Altering anything takes a separate, deliberate instruction given at the
  moment you mean it. There is no setting whose default is to modify, and no path
  by which a run intended as a look becomes a run that rewrote something.
