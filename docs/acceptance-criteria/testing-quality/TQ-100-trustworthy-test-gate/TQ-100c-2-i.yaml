it_requirements:
  - "DESIGN DECISION (settled): a done AC with zero covering tests is a HARD failure of the pre-pytest integrity check (non-zero exit), NOT a non-blocking warning — scoped strictly to ACs whose work_status is done ('a shipped feature must have a protecting test')."
  - "DESIGN DECISION (settled 2026-06-24, PREMISE CORRECTED 2026-09-07): build the zero-coverage detection as a violation class of the TQ-100c-2 integrity check (one module). The original wording of this requirement read 'there is currently NO check_ac_coverage.py in this repo'. THAT IS FALSE and was corrected on 2026-09-07: the file exists at templates/scripts/commit_guardian/check_ac_coverage.py. The design decision itself is UNCHANGED — the detection is still a violation class of the TQ-100c-2 integrity module, and the done-scoped hard-fail is still an added severity tier rather than a second coverage walker — but the 'if such a script is later introduced' framing no longer applies, because it is already here. WHAT TO DO INSTEAD OF ASSUMING: read the script before deciding whether to reuse its reverse-direction coverage scan, and read the three incompatible positions the store holds on it (see the doc_link to BP-100n-4 on this record, which cross-links all three). Do NOT reuse its tag-recognition rule: ACS-1300a-1:76 records it VERIFIED DISQUALIFIED 2026-09-01 because it collapses every suffixed id to its L0 root and is blind to '// covers:' tags, so a coverage judgement built on it attributes tags to the wrong record. It is also registered in no hooks_manifest entry today, so it does not run."
  - "Coverage is determined by scanning test bodies for the `# covers: <AC-ID>` tag (the established convention) — an AC is covered iff at least one collected/known test names it."
  - "The violation message must name the offending AC id; the violation class must be reported distinctly from an assertion failure."
test_spec:
  - name: test_done_ac_with_zero_covering_tests_is_flagged_and_the_message_names_it
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Build a real on-disk AC store containing an AC whose work_status is done,
      alongside a real test tree in which no test carries a "# covers:" tag
      naming that AC. Run the pre-pytest integrity check over that pair and
      assert a zero-covering-tests violation is reported, naming the done AC's
      id verbatim. Handing a hand-built in-memory record straight to the
      detection function does not satisfy this entry — the check must walk the
      store and the tree, because the failure mode this AC guards against is a
      real done AC in the real store going unnoticed.
  - name: test_zero_coverage_violation_blocks_at_the_pre_pytest_entry_point
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      The pre-pytest linkage-integrity check entry point delivered by TQ-100c-2,
      invoked as a subprocess exactly as the gate runs it — not imported.
    description: >-
      The must_block control. Invoke the integrity check through its production
      pre-pytest entry point as a subprocess over the same tree and assert a
      non-zero exit status. A violation that is computed but emitted with exit 0,
      or downgraded to a warning, fails this entry: the settled design decision
      is a HARD failure, and a hard failure that does not stop the run is
      indistinguishable from the silently-unprotected done feature this AC
      exists to prevent. Proves the verdict survives from the detection code to
      what the caller actually acts on.
  - name: test_zero_coverage_violation_is_reported_as_a_distinct_class_from_an_assertion_failure
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      Over one tree carrying BOTH a done AC with zero covering tests AND a
      covered test that genuinely fails its assertion, assert the two land in
      separately addressable output classes: the coverage-gap violation is
      emitted by the pre-pytest gate before any test executes, the assertion
      failure by the pytest session, and neither appears in the other's list. A
      run that collapses both into one undifferentiated failure count fails this
      entry — the criteria require the integrity violation to be distinguishable
      from a normal test failure, which is only observable by producing one of
      each in the same run.
  - name: test_adding_a_covering_tag_for_the_named_ac_clears_that_violation_and_nothing_else
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      Run two of the discriminating pair. Rerun over the identical tree with the
      single change of adding a "# covers:" tag naming that AC to one test, and
      assert the zero-coverage violation for that AC is gone while every other
      record in the run is byte-identical to run one. This is what falsifies the
      two ways the check can be wrong without anyone noticing: it fails if the
      check reports nothing at all (no violation in run one), and it fails if
      the report is driven by a fixed AC list rather than by the tags actually
      present in the tree (violation persists in run two).
  - name: test_a_not_done_ac_with_zero_covering_tests_is_not_flagged
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      NEGATIVE CONTROL — green on arrival, and no red baseline is possible for
      it, because a check that flags nothing whatsoever also passes it. In the
      same run as the first descriptor, an AC whose work_status is todo and
      which has zero covering tests must NOT appear in the violation list: the
      hard failure is done-scoped per the settled design decision, and a check
      that flags every uncovered AC in the store would block the repository on
      unbuilt work. Because this clause asserts an absence it owes a substitute
      proof rather than a before-and-after one — TQ-500a owns that obligation
      and the form it takes; do not invent the alteration here, and do not sign
      this off as "green on arrival, nothing to prove".
test_rationale: |
  Every descriptor runs the integrity check and asserts its verdict. None of
  them greps the source for a violation-class name, a message string, or an
  exit code, because this AC specifies a gate: a grep passes identically on a
  gate that is wired and running and on one whose strings are defined and never
  reached, which is the exact distinction the AC is about. That is also why the
  entry-point descriptor is a subprocess through the production pre-pytest
  surface rather than a direct import of the detection function — a violation
  correctly computed but dropped before it reaches the caller is the same
  observable outcome as no violation at all.

  The tag-added rerun is the load-bearing entry. A single flagging run proves
  only that something was emitted; it cannot separate a real tag scan from a
  hard-coded list of AC ids, and this record's own history is a warning about
  premises that are simply assumed (its it_requirement asserted for months that
  check_ac_coverage.py did not exist). Demanding that the violation disappear
  when a covering tag appears, and that nothing else in the output move, pins
  the verdict to the tags actually present in the tree.

  One descriptor asserts an absence and is therefore green on arrival by
  construction: the done-scoping control. It is marked as such rather than
  quietly counted as coverage, and the substitute-proof obligation is deferred
  to TQ-500a rather than restated or improvised here.
