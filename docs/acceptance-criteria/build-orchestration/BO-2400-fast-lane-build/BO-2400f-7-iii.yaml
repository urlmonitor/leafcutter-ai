title: "The claim is attempted by something permitted to make it, and a refusal to attempt it is never reported as contention"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run has resolved a build set and reaches the point where it claims that
    set,
  When the step that would make the claim declines to attempt it at all — because
    whatever was asked to perform it is not permitted to change the store,
  Then the run halts saying the claim was never attempted, and why,
  And it does not say the set is held by another run,
  And given instead the claim is attempted and genuinely finds members already
    held, the run reports contention and names the members that are held,
  And no halt can report contention while naming no held member.
