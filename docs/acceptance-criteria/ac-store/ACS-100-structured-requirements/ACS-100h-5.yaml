title: "Post-split validation confirms no cycles, no dangling refs, and limits respected"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a split has been executed (files created and modified),
  When the post-split validation step runs,
  Then it confirms that both resulting parents are below the child limit
    (7 for L0, 5 for L1),
  And it confirms no depends_on cycle was introduced
    by walking the dependency graph from each modified AC,
  And it confirms no delivers_to reference points to a non-existent AC,
  And it confirms no expects_from reference points to a non-existent AC,
  And if any parent has fewer than 3 children,
    it emits a non-blocking advisory naming the sparse parent.
