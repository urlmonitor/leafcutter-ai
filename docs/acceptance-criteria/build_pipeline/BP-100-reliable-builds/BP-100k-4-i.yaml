notes: "Paired negative case for BP-100k-4. Reviving two long-dead gate triggers is a change with repository-wide blast radius: an over-strict reachability check blocks every commit, and a fail-open one reproduces the original silence. Only running the check end to end over the real registry, and separately under a broken precondition, distinguishes a correct implementation from either shortcut."
