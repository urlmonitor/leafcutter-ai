id: AGC-100a-1
title: "A fresh build exposes every launchable registry identity to Codex"
component: agent-compatibility
components: [agent_registry, build_pipeline, template_compiler]
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given the canonical registry contains 59 non-deprecated identities, including
    57 standalone specialists and the separately named variants
    architect-review-deep and conflict-resolver-deep,
  And epic-supervisor is marked deprecated,
  And the target contains no prior Codex artifacts,
  When the normal Leafcutter build completes,
  Then Codex discovers exactly one native identity for each of the 59
    non-deprecated registry entries,
  And architect-review-deep and conflict-resolver-deep are discoverable under
    their own names,
  And epic-supervisor is not offered as a launchable identity.
depends_on: [AGC-100a]
assigned_agent: python-coder
estimated_complexity: L
package_surface: true
it_requirements:
  config_schema_fragment:
    type: object
    required: [launchable, guidance_source]
    properties:
      launchable: {type: boolean}
      guidance_source:
        type: [string, "null"]
    additionalProperties: true
  reference_file_path: config/agent_registry.schema.json
  n_location_rule: all
  required_skills: [python-coder, add-agent-to-package]
  post_write_commands:
    - python scripts/build.py --target-dir . --validate-only
    - python -m pytest unit_tests/agent_compatibility -q
  constraints:
    - Launchability and guidance inheritance are explicit registry data.
    - Every launchable identity resolves to one acyclic guidance source.
test_required: true
test_spec:
  - name: test_fresh_build_exposes_exact_launchable_registry_set
    target_dir: unit_tests/agent_compatibility/
    framework: pytest
    type: integration
    angle: real_artifact
    description: A fresh build emits exactly the explicitly launchable identities.
  - name: test_deep_variants_are_distinct_and_deprecated_agents_are_excluded
    target_dir: unit_tests/agent_compatibility/
    framework: pytest
    type: integration
    angle: criterion
    description: Deep variants are distinct native identities and deprecated entries are excluded.
test_rationale: "Parsed native identities and registry launch metadata are required; Markdown file counts miss inherited variants and include non-agent files."
delivers_to:
  agent: python-coder
  contract: "ResolvedIdentityCatalogV1 ordered by registry identity with launchability, guidance source, source model, and deprecation state."
expects_from: null
