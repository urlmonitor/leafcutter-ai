  - path: scripts/ac_store/validate_ac_schema.py
    relationship: related
    status: exists
    relevance: "THE SCAR THIS AC EXISTS TO AVOID REPEATING, IN THIS SAME COMPONENT AND ON THIS SAME STORE. For eight days a bare-directory argument matched zero files, printed a success message and exited 0 — and the project's own written instruction prescribed exactly that form, so the documented defence against store rot was itself a no-op and reported clean the whole time. The fix made a zero-file run exit non-zero and made the script state the count it validated. Copy both halves."
  - path: scripts/ac_store/scan_ac_orphans.py
    relationship: related
    status: exists
    relevance: "THE SURFACE THAT INHERITS THE RISK. Once this scan is wired to a recurring job with a root path, a path argument, or a working-directory assumption, the same failure shape is available to it: a run that resolved to no records exits cleanly and the schedule reports green forever. Verified 2026-09-08 that it currently finds 47 across the real store — the point is that nothing about its output would distinguish that from a run that found a store of size zero."
