notes: |
  Authored by /quick-fix.

  ROOT CAUSE. `handoff` is declared as a valid value in the PHASE_RESULT_SCHEMA
  status enum (templates/workflows-js/build-feature.js line 147) but has NO
  handler anywhere in the file — `grep -c handoff` returns exactly 1, the enum
  entry itself. The adjudication branch at line 643 tests only
  `resultStatus === 'blocker' || resultStatus === 'failed'`, so the `handoff`
  status falls through that guard entirely and reaches the phase-completed path.

  RED BASELINE CONFIRMS THIS EXACTLY. unit_tests/workflows/test_bo_3000_handoff_routing.py
  is already captured and RED: 3 tests fail, showing test-writer dispatched once
  instead of twice in BOTH drivers, and an unparseable handoff target advancing to
  pr-reviewer instead of failing closed. The diagnosis is confirmed — proceed with
  the fix.

  THE FIX. Add a `handoff` branch that re-dispatches the agent named in
  `handoff_target` (or, absent a parseable target, returns a `blocked` result
  naming the phase) rather than letting the loop advance.

  FIELD EVIDENCE. Observed live in EPIC-BuildPipelinePhantomRemediation ticket 07:
  python-coder returned `status: handoff` at 17:15 asking test-writer to update one
  stale assertion; test-writer was never respawned and still shows `needed`, while
  the driver advanced through pr-reviewer, ac-validator, ac-fulfillment-gate and
  commit — all four independently re-discovered the same unfixed regression and
  blocked. A blocker was inverted into a pass and four downstream agent invocations
  were wasted rediscovering it.

  IMPORTANT CONSTRAINTS:
  (1) This worktree is at /home/henzeh/projects/leafcutter/worktrees/handoff-routing
      on branch fix/handoff-routing — the session cwd is NOT a git repository, so
      EVERY git command MUST use
      `git -C /home/henzeh/projects/leafcutter/worktrees/handoff-routing`, never a
      bare `git`. Do not run `git worktree add` or invoke worktree-agent; the
      worktree already exists.
  (2) The identical defect exists in the sibling driver
      templates/workflows-js/build-ticket.js at line 80 (same enum, same single
      occurrence, same missing handler) — fix it in the same pass and keep both
      handlers consistent; do NOT treat the second file as scope expansion
      requiring escalation.
  (3) Do not weaken or delete the `cross_agent` branch at line 677 while doing
      this; it is a related but separate defect.
  (4) Do NOT modify or weaken the three tests in
      unit_tests/workflows/test_bo_3000_handoff_routing.py to make them pass —
      they are the specification; change the drivers until the tests go green.
      Per CLAUDE.md 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep', a
      grep-only structural test is NOT acceptable coverage; the existing tests
      drive the real JS through unit_tests/_workflow_engine_harness.py.

