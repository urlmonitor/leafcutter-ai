notes: |
  THIS IS WHERE THE SEQUENCING HAZARD IS MADE UNLOSABLE. It is expressed three
  ways on purpose, because a note alone would not survive decomposition into
  tickets: (1) as a depends_on edge to ACS-1200a on this record and on
  ACS-1400a-1, so the dependency is machine-readable and orders the build;
  (2) as the final Then clause, which FAILS the run when the parked signal is not
  recognised — so an implementation that lands the stricter rule ahead of the
  exemption cannot report green; and (3) in this note.

  THE PO'S FRAMING NEEDED ONE CORRECTION AND IT SHARPENS THE CASE. The L1 says
  landing this L1 first "makes the wrong rule fire more reliably" against parked
  trees. Measured 2026-09-08, the wrong rule already fires against all six KM-200
  records — they block today. What landing this L1 first actually does is remove
  the escape route: the KM-200 tree was merged with the check skipped, and
  ACS-1400a-3's examined-population reporting plus ACS-1400a-1's wider net make
  that route conspicuous. The exemption is therefore a prerequisite of this L1 in
  the strict sense, not a nicety to sequence politely around.

  THE FOURTH Then IS DELIBERATELY A FAILURE, NOT A WARNING. A criterion that said
  "the exemption should exist" is satisfied by shipping without it and filing a
  follow-up. A run that fails when the signal is unrecognised is the only shape
  that makes the ordering enforceable by the build rather than by memory.

  THE SECOND Given IS THE ANTI-VACUITY HALF. An exemption is trivially satisfied
  by a check that exempts everything. The unmarked tree's child must be reported
  in the same run, or the exemption is indistinguishable from switching the check
  off.

  RECOGNITION, NOT SUPPRESSION — inherited verbatim from ACS-1200a and not
  re-derived here. "Parent lists no children" is also exactly what a half-finished
  broken tree looks like; an exemption keyed off absence would silence real
  breakage.
