criteria: |
  Given requirement F, whose work is finished, declares scripts/ac_store/legacy_helper.py
    marked existing,
    and requirement U, whose work is not finished, declares the same file marked existing,
    and later, unrelated work has deleted scripts/ac_store/legacy_helper.py from the repository,
  When a change that edits only F's notes is checked before it enters the repository,
  Then F is accepted, and no refusal message names F or scripts/ac_store/legacy_helper.py,
  And a change that edits U is refused, naming U and scripts/ac_store/legacy_helper.py as
    neither present nor marked to be created, exactly as for any unfinished requirement,
  And the store-wide declared-files report lists F with scripts/ac_store/legacy_helper.py as
    "declared existing, now absent (work finished)", naming F and the path,
  And the report states how many such entries it found across the store (1 here),
  And F's declared-files list is unchanged by the check and by the report: nothing removes
    the entry or re-marks it automatically.
