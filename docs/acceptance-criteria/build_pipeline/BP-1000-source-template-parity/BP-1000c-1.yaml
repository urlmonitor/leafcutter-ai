estimated_complexity: S
it_requirements:
  - "The reporter must enumerate ALL drifted pairs from the verdict, never stop at the first difference — the comparison in BP-1000a-1 must collect every differing pair before the reporter renders, so the contributor sees the full remediation surface in one pass."
  - "For each drifted pair the message must include both repo-root-relative paths (canonical source and shipped template) and a line-level unified diff oriented source-vs-shipped, with a stable header naming which side is which, so a reader can tell what the shipped copy is missing or has extra."
  - "The failure text is the artifact the how-to (BP-1000c-2) teaches contributors to read — keep the path-naming and diff layout stable and self-describing so the doc can reference concrete labels."
  - "Diff rendering must be deterministic (stable ordering of pairs, e.g. sorted by source path) so the same drift produces the same message across runs and machines."
  - "Output goes to the channel the finalize-feature workflow surfaces to the user on a HALT (the block summary); it must read as a clear remediation message, not a stack trace."
delivers_to:
  agent: documentation-expert
  contract: "The human-readable parity-failure report format: a per-pair block listing the canonical source path, the shipped template path, and a source-vs-shipped unified diff, with all drifted pairs listed in stable order. BP-1000c-2 documents how to read this exact format."
expects_from:
  ac_id: BP-1000a-1
  contract: "The per-pair parity verdict object { ok, pairs: [{source_path, template_path, identical, diff}] }; this AC consumes the full pairs list (filtering identical=false) plus each pair's diff string to render the failure report."
