criteria: |
  Given a fast-lane run whose reading produced three findings, none of them serious
    enough to stop it,
  When the run finishes and hands back its pull request,
  Then all three findings are visible on the pull request itself, so a person who
    never saw the run can read them,
  And each one names the requirement and the file it relates to,
  And a run whose reading produced no findings adds nothing of this kind to its pull
    request.
