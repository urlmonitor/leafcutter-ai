title: "Trust that requirements cannot be silently rewritten by the wrong agent"
component: ac-store
level: L0
status: active
req_status: active
work_status: todo
criteria: |
  Requirements stay exactly as the product team wrote them — no silent rewrites.

  When an acceptance criterion is created, its criteria field represents the
  authoritative definition of "done" as agreed by the product team. No
  implementation agent, test agent, or automation can alter that definition.
  Only the agents responsible for defining requirements (PO, BA, IT-PO) and
  the human user can create, change, or remove criteria. Implementation agents
  report their progress through status fields without ever touching what they
  are being measured against. This separation of concerns ensures the AC store
  remains a trustworthy source of truth.
