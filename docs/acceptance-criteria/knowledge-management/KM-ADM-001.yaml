title: "Artifact data-map enforcement ratings match the commit-guardian hook registry"
parent: KM-ADM-100a
depends_on:
  - KM-ADM-100a
origin_agent: BrainCandy
criteria: |
  Given docs/reference/artifact-knowledge-graph.graph.json rates every edge with an
    `enforcement` value drawn from the legend (enforced / derived-validated /
    derived-raw / warn / none), and an edge's `note` names the hook that backs it
  When the map is read to decide whether a link may be trusted during a refactor
  Then an edge whose named hook is absent from
    templates/scripts/commit_guardian/commit_guardian.json (or present with
    enabled:false) is rated `enforcement: none`, because an unregistered hook never runs
  And an edge whose named hook IS registered and enabled but does not block is rated
    `enforcement: warn`
  And specifically `ac-tested` (AC -> Test via covered_by) is rated `none` — its named
    hook check_ac_coverage.py is unregistered dead code — while `ticket-touches`
    (Ticket -> SourceFile via files_touched) is rated `warn`, because the
    check-predone-scope hook IS registered and reports advisory scope violations
  And the bug symptom ("ac-tested is rated warn and ticket-touches is rated none, so a
    refactorer trusts the test link that nothing checks and discards the
    files_touched link that is actually reported") must not occur
doc_links:
