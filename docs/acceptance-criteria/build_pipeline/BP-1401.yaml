title: "next_diagram_seq.py scans docs/architecture/ recursively so it sees diagrams in the diagrams/ subdirectory"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: done
origin_agent: BrainCandy
criteria: |
  Given the C4 diagram files live in the docs/architecture/diagrams/ subdirectory
    (e.g. docs/architecture/diagrams/c3-002-interactive-pause-resume-sequence.md)
    and no c{level}-NNN-*.md files exist at the top level of docs/architecture/,
  When next_seq(level, arch_dir) is called with arch_dir = docs/architecture/ for a level
    that already has diagrams under the diagrams/ subdirectory,
  Then it discovers those existing diagrams (scanning recursively, not only the top level)
    and returns max(existing sequence number for that level) + 1
  And the symptom ("returns 1 for every C4 level regardless of existing diagrams, causing
    diagram sequence-number collisions") must not occur
