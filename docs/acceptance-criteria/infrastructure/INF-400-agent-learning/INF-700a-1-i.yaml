test_spec:
  - name: test_each_of_the_five_completion_paths_writes_the_learning_to_its_destination
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Parametrised over build-epic, build-ticket, fast-lane-ship, quick-fix and finalize-feature. For each, drive the path to completion under the engine harness in a temp tree whose declared sink holds one record carrying learning text and naming one destination; assert that destination contains the text by the time the path reports its result. Five parametrised cases, each asserting a file, not one test naming five paths."
  - name: test_the_guard_derives_its_candidate_set_from_the_workflow_artefacts
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: behavioral
    angle: real_artifact
    description: "Run the guard against the real templates/workflows-js/ directory and assert it reports having examined every .js file present there, by count and by name. A guard whose candidate set comes from its config would report only the names already listed and passes vacuously."
  - name: test_a_new_completion_path_with_neither_wiring_nor_an_exclusion_blocks_the_build
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "the guard invoked from build.py through its real entry point, run as a subprocess against a temp target"
    description: "The must-block negative control and the AC's last clause. Add a synthetic completion-path artefact to a temp copy of templates/workflows-js/ that neither harvests nor appears in the exclusion list; run build.py; assert it aborts non-zero and that the message names the new artefact. This is the something that fails when a path is added later."
  - name: test_removing_a_path_from_the_exclusion_list_makes_the_guard_block
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: behavioral
    angle: seam
    description: "Delete one excluded entry from the config section and assert the guard now blocks and names that path. Proves the guard reads the single list artefact rather than embedding a second copy of it, which is what would let the list and the guard drift apart."
  - name: test_wiring_only_one_path_still_blocks
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: behavioral
    angle: failure
    description: "The predicted partial-wiring failure, as a test. In a temp target where only build-epic is wired and the other four are neither wired nor excluded, assert the guard blocks and names all four. A guard that reports only the first missing path lets a fixer close them one build at a time without ever seeing the scale."
  - name: test_a_passing_guard_run_states_which_artefact_kinds_it_cannot_see
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "The residual clause. Run the guard on a fully-wired temp target and assert its PASSING output names the artefact kind it enumerated and names the kinds outside its reach — a completion path shipped only as a skill or only as a command. Assert on the passing run specifically: a limitation disclosed only in a failure message is invisible to every reader who sees a green build, which is every reader who matters here."
test_rationale: |
  The first descriptor is deliberately five parametrised cases rather than one
  test, because a single test asserting over a list of five names passes when
  the loop body silently no-ops for four of them. The guard tests run build.py
  as a subprocess against a temp target rather than importing the guard
  function, because the failure this repository has actually shipped is a guard
  that exists, is tested in isolation, and is never reached from the deployed
  entry point. The second descriptor is the anti-vacuous-pass check: a guard
  reading its candidate set from its own config would pass every other test
  here and catch nothing, so it must be made to state what it examined.
notes: |
  This is the anti-partial-wiring criterion. It exists because the defect being
  closed is not "the harvester is hard to call" but "nobody noticed it was never
  called", and a fix that wires one of five paths reproduces that condition at
  four fifths strength while looking, from the wired path, exactly like success.
change_target:
