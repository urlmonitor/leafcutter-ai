- name: test_new_record_listed_not_evaluated_new_record
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: boundary
  description: 'ACD-9990a-3 (absent from the HEAD commit) gets exactly one ''protected fields'' finding
