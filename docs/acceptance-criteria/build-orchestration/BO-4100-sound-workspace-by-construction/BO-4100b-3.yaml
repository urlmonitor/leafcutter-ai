assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "_establish_pre_commit_config currently prefers os.symlink(<main_repo>/.leafcutter, <worktree>/.leafcutter). That symlink IS the structural cause of both harms in BO-4100b -- it makes the workspace's supporting material an alias of the shared install tree. Replacing it with a per-workspace materialisation is the change. Leaving the symlink in place and adding a guard on top of it is not."
  - "A check running inside a workspace must reach that workspace's own copy through the resolution the guardian scripts already share, not through per-hook path logic. Today several hooks resolve their root from __file__ of the RESOLVED symlink target, which lands them in the shared install tree -- that resolution path is in scope and must be fixed at the shared resolution point, not hook by hook."
  - "The .security-allowlist dual-update workaround documented in CLAUDE.md exists only because of this symlink. If the per-workspace copy makes it unnecessary, that instruction must be corrected in the same change; a stale workaround for a removed defect is a second source of confusion."
  - "Byte-identity of the shared install tree and of the other live workspace must be established by recursive content hashing of the whole tree, never by mtime, size or a spot check of a few files."
  - "The Windows/NTFS fallback branch must keep working. A workspace on a filesystem where os.symlink raises must still get its own supporting material, or the fix makes those installs unbootstrappable."
  - "Per-workspace materialisation must not push workspace creation outside its current latency budget. A copy-on-write or hardlink arrangement is acceptable provided a write inside one workspace is not observable in any other and not observable in the shared install tree."
  - "ADR-031's create-time and pre-drive quality-gate guards must continue to pass against the per-workspace copy. This record changes WHERE the material lives, not WHETHER the gates run; proof that checks genuinely fire is BO-1700a and must not be re-derived here."
  - "Template and deployed copies of setup_ticket_worktree.py change together and are verified in parity via the build.py round-trip (ADR-001)."
delivers_to:
  agent: python-coder
  contract: "A per-workspace supporting-material tree at <workspace>/.leafcutter that is a real materialisation rather than an alias of the shared install tree: a write inside it is not observable in <main_repo>/.leafcutter nor in any other live workspace's copy. BO-4100b-4's named remedy acts on this tree, and BO-4100b-3-i asserts its check set is equivalent to the shared one."
expects_from: null
test_required: true
test_spec:
  - name: test_a_check_running_in_the_first_workspace_resolves_that_workspaces_own_supporting_material
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Two workspaces are created through the normal path; a check is run inside the first and the supporting-material root it actually resolved is captured. It must be under the first workspace, and must be neither the shared install tree nor the second workspace. Resolving through a symlink to the shared tree fails here even though every file it finds is correct."
  - name: test_repairing_the_first_workspaces_material_leaves_the_shared_install_tree_byte_identical
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A recursive content hash of the shared install tree is taken before and after a repair carried out inside the first workspace, and must be equal. This is the cross-session-damage assertion."
  - name: test_repairing_the_first_workspaces_material_leaves_the_second_workspace_byte_identical
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The same whole-tree hash comparison for the concurrently live second workspace."
  - name: test_the_fallback_materialisation_route_also_produces_an_independent_copy
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "With os.symlink forced to raise OSError, the workspace still gets its own material and the same three independence assertions hold. Without this, the Windows/NTFS install silently keeps the shared-alias behaviour."
test_rationale: |
  Every clause here is a state of a tree on disk, so every assertion is a whole-tree
  content hash rather than a claim about configuration. Byte-identity is measured ACROSS
  A REPAIR specifically, because a repair is the operation the current symlink arrangement
  makes destructive -- reading is harmless and would pass against the defect.
  The first test asserts the resolved ROOT, not the resolved content. Under today's
  symlink the content a check reads is entirely correct; what is wrong is where it came
  from. A test that compares file contents is green against the defect, so the assertion
  has to be on the path the resolution returned.
