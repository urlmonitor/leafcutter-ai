criteria: |
  When a requirement needs multiple specialists, it becomes separate deliverable pieces.
  During technical review, if a single requirement spans multiple implementation
  boundaries (e.g., database + API + frontend), it is automatically split into
  one focused piece per specialist. Each piece has a clear deliverable and
  ordering, and the split is visible to you at the confirmation step.
