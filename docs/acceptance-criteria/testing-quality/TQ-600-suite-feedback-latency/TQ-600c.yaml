  - reason: >-
      child_limit_override raised 5 -> 6 to admit TQ-600c-6, the how-to this L1's
      documentation_triggers ([how-to]) require. WHAT THE OVERRIDE ADMITS: exactly one
      child beyond the cap, and it is documentation of the five behaviours already
      here rather than a sixth behaviour. WHY REDISTRIBUTING WOULD BE WORSE: the five
      behavioural children form one chain that only works whole — the record (c-1), the
      guard that reads it and can fail (c-2), the single-source measured limit the
      guard looks up (c-3), the per-test regression that catches what a whole-run total
      hides (c-4), and the gating that makes the guard run at all (c-5). Cutting that
      chain across two L1s would let a future author satisfy one L1 and ship a guard
      that reports clean forever, which is the exact failure this L1's notes name three
      precedents for. The documentation child is the reader's end of the same chain:
      separating it would leave the guidance free to drift from the guard, and its
      load-bearing clause is that it never states a limit the guard does not. REMOVE
      THIS OVERRIDE when a PO-owned split rebalances the TQ-600 tree, or if the budget
      guard and the per-test regression detector (c-4) prove to be independently
      useful enough that the PO decides they are two goals rather than one — that is a
      PO call, not one an override should pre-empt.
