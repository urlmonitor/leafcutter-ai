criteria: |
  Given the migration feature is implemented
  When an architecture-diagram-author produces the sequence diagram
  Then the diagram shows the temporal flow:
    1. Build system starts and checks for technology manifest
    2. No manifest found — build checks for legacy agent files
    3. Legacy layout detected — migration triggered
    4. Migration extracts knowledge from legacy templates
    5. Migration writes best-practice files to knowledge layer
    6. Migration renames legacy templates with .legacy suffix
    7. Technology detector runs and produces manifest
    8. Agent generator runs and produces specialists
    9. Build completes with generated specialists deployed
  And the diagram shows the alternative path (manifest exists — skip to step 7)
  And the diagram is placed under docs/architecture/
