package_surface: false
declares_side_effect: false
it_requirements:
  - >-
    WHERE THE PREVIOUS LENGTH COMES FROM — DECIDED, AND THE DECISION IS "NOWHERE NEW". The
    BA deliberately left this open and it is pinned here: the length a file stood at before
    the change is obtained by measuring the file's HEAD blob (`git show HEAD:<path>`) with
    the SAME measurement function used on the staged content. There is NO persisted baseline
    file, NO new configuration key and NO recorded state of any kind. Four reasons, and each
    one independently rules out the persisted alternative: (1) a recorded baseline must be
    updated on every commit that changes a size, so it either turns this judgment gate into
    a transform gate that writes during commit, or it goes stale — and a stale baseline is
    strictly worse than none, because it lets a file grow while asserting it did not;
    (2) git already holds the exact quantity the criterion names, with no possibility of
    drift between the record and reality; (3) a persisted record would have to live
    somewhere, and the only natural home is a NEW top-level key in commit_guardian.json,
    which is a watched mapping_keys container and would drag a package-surface declaration
    and the structured five-field spec onto this record for no behavioural gain; (4)
    `git show HEAD:<path>` is already the established pattern in this hook family — nine
    scripts under templates/scripts/commit_guardian/ read HEAD blobs today, including
    check_structural_change.py, check_ac_schema.py and check_adr_collision.py. Reuse the
    pattern; do not invent a fifth kind of state.
  - >-
    NO PACKAGE SURFACE, AND THIS IS THE RECORD MOST LIKELY TO ACQUIRE ONE BY ACCIDENT. This
    record's own doc_link on commit_guardian.json warns that a NEW top-level key trips the
    package-surface declaration gate. With the HEAD-blob decision above, no new top-level
    key is needed and none may be added: the ratchet consumes only the staged content, the
    HEAD blob, and the per-kind limits already nested under the existing `file_size` key at
    line 13. It also adds no hooks_manifest id — the registration is declared once on
    GE-127a-1 and inherited. package_surface is therefore FALSE and the plain-list spec is
    correct. If an implementer finds a genuine need for a new top-level key, that is a
    decision to escalate, not to take: the declaration and the structured five-field spec
    must move onto this record with it. Do NOT mint a config_schema_fragment key to satisfy
    the validator — BP-100k-4 and BP-100k-4-i both did exactly that and neither declared key
    was ever created.
  - >-
    THE PREVIOUS AND CURRENT LENGTHS MUST COME FROM ONE MEASUREMENT FUNCTION, CALLED TWICE.
    Two implementations of the counting rule — one for the HEAD blob, one for the staged
    content — can drift, and a drift of even one line manufactures phantom growth on files
    nobody touched. Mandate a single pure function taking file content and returning a
    length, used by the threshold comparison (GE-127a-1), the ratchet's before and after
    measurements, and the published-rule reproduction (GE-127d-2). One rule, one
    implementation, four call sites.
  - >-
    THE THREE ARMS ARE DISTINCT STATES AND MUST BE DISTINCT BRANCHES, NOT A SINGLE
    INEQUALITY. Over the limit and grown → refuse. Over the limit and same-or-shorter →
    allow, and say nothing that reads as a finding about that file. No HEAD blob for the path
    (the file did not exist before) → the ratchet does not apply at all and the file is
    governed only by GE-127a-1's threshold. An absent previous length is NEVER coerced to
    zero: that single coercion refuses every new file ever created, and it is the BA's named
    injection 2.
  - >-
    ONLY FILES ALREADY ABOVE THEIR LIMIT ENTER THE RATCHET. A file under its permitted length
    that grows but stays under it is not this record's population and must produce no
    finding — that is GE-127a-1's silence arm and this record must not break it. A file that
    crosses from under to over in one change is GE-127a-1's population, refused by the
    threshold arm, and must not be double-reported by the ratchet as well.
  - >-
    THE SHRINKING-BACKLOG PROMISE ADMITS NO DEFAULTED EXCEPTION. No routine condition — a
    mechanical rename, a generated block, a merge commit, a bulk reformat — may be given an
    implicit pass to grow an oversized file. If an exception is judged necessary it is an
    explicit, recorded decision using the mechanisms that exist (see the rollout constraint
    below), never a path pattern or a status check quietly added to the comparison.
  - >-
    THE ROLLOUT MECHANISMS THAT EXIST, STATED AS THEY ARE — THERE IS NO WARN-VERSUS-ENFORCE
    TIER, SO DO NOT DESIGN A RAMP AROUND ONE. What exists: `enabled: false` on a manifest
    entry, honoured by build_precommit_config's filter on h.get("enabled", True) before entry
    lines are emitted (5 entries use it today); the two exemption registries
    (drift_gate_exemption_registry, hook_trigger_reachability_exemption_registry), each entry
    a {path|id, ground} pair with a mandatory non-empty ground and a __*_doc sibling carrying
    the discipline that an exemption is "not a way to silence a finding the gate got right";
    per-gate `excluded_dirs` overrides as complexity and sql_complexity use; and ad-hoc
    per-script advisory severity as check_doc_links and check_adr_cross_reference implement
    individually. What does NOT exist: any warn tier in the framework. The manifest `tier`
    field takes only "judgment" (54 entries) and "transform" (6) and is not a severity, and
    run_hook.py contains no advisory handling at all. BP-100n-4 additionally forbids using
    enabled:false to dodge a day-one finding. THIS RECORD IS THE ROLLOUT MECHANISM — that is
    why it is the keystone, and why reaching for any of the above instead of building it is
    the failure mode.
  - >-
    THE MEASURED BLAST RADIUS THIS RECORD EXISTS TO ABSORB, RE-MEASURED IN THIS WORKTREE AT
    b846121c9. Under the guard's own counting rule, 200 of 845 tracked .py files stand above
    the 400-line limit already in force (largest: scripts/build_phases.py at 2603 counted /
    3873 raw; tests/test_git_recovery.py at 3078). Zero tracked .sql files exist at all, so
    the other in-scope kind contributes nothing. Once GE-127c-1's widened list lands, 10 of
    13 tracked JavaScript files and 10 of 99 TypeScript files join that population. Every one
    of those files must remain committable the day the gate is registered, and this record is
    the only thing that makes that true.
  - >-
    DO NOT WIRE EXCLUDED_DIRS INTO THIS GUARD. check_file_size.py imports only
    CHECKED_EXTENSIONS, DEFAULT_LINE_LIMIT and FILE_LINE_LIMITS and never imports
    EXCLUDED_DIRS, although config.py:90 exports it and README.md line 65 claims the list
    applies to ALL hooks. Fixing that inconsistency here would exempt every path under
    `templates`, `unit_tests` and `tests` — including all 11 substantial JavaScript files,
    which live under templates/workflows-js/ — and would ship the ratchet as a no-op over
    most of its intended population. The discrepancy between the README's global claim and
    this gate's behaviour is GE-127d-1's subject; it is not a silent code change here.
  - >-
    HOST AND LAYERING — MEASURED, NOT GUESSED. check_file_size.py stands at 148 of its 400
    permitted lines (217 raw) under its own counting rule, so it has headroom, but this
    record is the largest of the six landing on it. Put the previous-length resolution, the
    shared measurement function and the outcome assembly in a sibling module INSIDE
    templates/scripts/commit_guardian/ — build_commit_guardian copies that directory whole,
    so no scripts/build_phases.py deploy entry is needed. A module imported from OUTSIDE that
    directory MUST be added to the deploy map in the same change or the deployed hook raises
    ModuleNotFoundError at commit time while source-tree tests stay green. Never split
    outside the directory.
  - >-
    CANONICAL VERSUS BUILD OUTPUT, AND THE BUILD IS PART OF THE CHANGE.
    templates/scripts/commit_guardian/ is canonical and tracked; scripts/commit_guardian/ and
    the repo-root .pre-commit-config.yaml are UNTRACKED build outputs that build.py
    overwrites; templates/commit-guardian/commit_guardian.json is a decoy that needs no edit
    (manifest parity is one-directional, legacy ⊆ canonical). config.py:19 resolves
    commit_guardian.json beside the DEPLOYED script, so `python scripts/build.py
    --target-dir .` is mandatory and is part of this change, not a follow-up.
  - >-
    THE COUNTING-RULE INTERACTION IS INHERITED, NOT SETTLED HERE. If the measurement rule
    declines to count some class of content, a change that adds only that class registers as
    no growth and this ratchet allows it. That is GE-127d-2's call to make and this record's
    to consume. Do not write a second counting rule into the comparison to close it.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around the
    subprocess call to git, the blob decode and any file I/O; log at WARNING or higher or
    re-raise; no bare or blind excepts. A swallowed lookup error must never become an absent
    previous length — that is the precise fail-open shape GE-127b-1-i exists to make
    impossible, and it is the shape all four cited precedents shipped.
test_spec:
  - name: test_ge_127b_1_an_oversized_file_made_one_line_longer_is_refused_naming_both_lengths
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      THE MANDATORY NEGATIVE ARM AND THE ONLY CLAUSE THAT DISTINGUISHES A WORKING RATCHET
      FROM A DISABLED ONE — WRITE THIS ONE FIRST. In a real temporary git repository with the
      gate installed, commit a covered file already above its permitted length, then stage a
      change leaving it exactly one line longer and run an ordinary commit. The commit must
      not complete, and the outcome must state BOTH the length the file stood at before the
      change and the length it stands at after it. Both numbers are read from the process
      output. This is genuinely RED today — no commit is refused for file length at all —
      so capture the failing run before any work starts.
  - name: test_ge_127b_1_an_oversized_file_made_shorter_commits_and_is_not_refused_for_still_being_over
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      A change leaving an already-oversized covered file shorter than it stood before, while
      still above its permitted length, commits cleanly and is not refused. NAMED MUTATION
      (mandatory, run it, do not merely describe it — the BA's injection 1): judge the
      already-oversized file against its fixed permitted length instead of against its own
      previous length. Under that injection a change that SHRINKS an oversized file is
      refused; this descriptor must go RED, failing BY THE COMMIT OUTCOME as well as by the
      text, and return to green on revert. This injection reconstructs the freeze the parent
      L1 names as the failure mode, and it is the single most likely way for a
      well-intentioned implementation to land.
  - name: test_ge_127b_1_an_oversized_file_left_at_exactly_its_previous_length_commits
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      A change leaving an already-oversized covered file at exactly the length it stood at
      before commits cleanly. The boundary between the refuse arm and the allow arm is
      strictly greater-than, not greater-than-or-equal; an off-by-one here refuses every
      pure edit to an oversized file and reproduces the freeze from the other side.
  - name: test_ge_127b_1_a_newly_added_file_below_its_limit_commits_and_is_not_treated_as_having_grown
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      A covered file that did not exist before, added at a length comfortably below its
      permitted length, commits cleanly. NAMED MUTATION (mandatory, run it — the BA's
      injection 2): treat an absent previous length as a previous length of zero. Under that
      injection every newly added non-empty covered file is refused as having grown; this
      descriptor must go RED and return to green on revert. Without the injection the clause
      is satisfied by a guard that refuses nothing.
  - name: test_ge_127b_1_the_previous_length_is_read_from_the_repository_history_and_moves_with_it
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: >-
      THE ANTI-STALE-BASELINE DESCRIPTOR. Establish an oversized covered file, commit a
      change that SHRINKS it, then stage a change that grows it back by one line relative to
      the NEW shorter length while leaving it below its original length. The commit must be
      refused. An implementation reading a recorded baseline that was not updated by the
      intervening commit allows this, and an implementation reading the file's HEAD blob
      refuses it. Assert over real commits in a real repository, never over a fixture
      describing a previous size.
  - name: test_ge_127b_1_a_file_under_its_limit_that_grows_but_stays_under_produces_no_finding
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      A covered file below its permitted length that the change leaves larger but still below
      it commits cleanly and produces no line naming it. Guards the seam with GE-127a-1's
      silence arm: an over-eager ratchet applied to every file, not only those already above
      their limit, refuses ordinary growth everywhere and is the second-most-likely wrong
      implementation after the freeze.
  - name: test_ge_127b_1_the_ratchet_verdict_is_emitted_through_the_registered_hook_entry_point
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      PRODUCTION ENTRY POINT. Run the gate as a subprocess through the registered hook path
      with a grown oversized file staged, and assert the before-and-after lengths appear in
      the hook's own output stream and that the exit status is the commit outcome rather than
      an advisory note. A comparison computed by a function nothing at commit time calls is
      inert.
  - name: test_ge_127b_1_the_deployed_copy_runs_the_ratchet_over_the_repositorys_real_oversized_files
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After build.py, the DEPLOYED copy and every module it imports load and run in a cold
      process — a helper outside templates/scripts/commit_guardian/ with no
      scripts/build_phases.py deploy-map entry surfaces here as ModuleNotFoundError rather
      than passing. Then the survivability proof this record exists for: stage a
      size-neutral edit to one of the repository's genuinely oversized tracked files and
      assert the deployed run permits it. A run that refuses it means the gate cannot be
      switched on, whatever the synthetic descriptors say.
test_rationale: |
  Three of the four criterion arms assert that a commit is ALLOWED, and every one of them is
  green on arrival on an implementation that refuses nothing — which is today's
  implementation exactly. The BA attached two named injections to the two that matter most
  and both are carried into descriptors verbatim rather than restated as prose. Each must
  fail BY THE COMMIT OUTCOME, not merely by emitted text: a gate that prints a worried
  message and exits 0 is indistinguishable from a passing one to pre-commit, which reads
  only the status.

  The negative arm — one line longer on an already-oversized file, refused — is written
  first because it is the only clause that cannot pass on an implementation that permits
  everything, and it is the one clause with a genuine red baseline today.

  Two descriptors exist that the criteria do not name and that the enrichment decision
  makes necessary. The history-derived descriptor discriminates the pinned HEAD-blob source
  from a recorded baseline: it shrinks a file in one commit and grows it back relative to
  the new length in the next, which a stale record permits and a HEAD read refuses. The
  under-limit-growth descriptor guards the seam with GE-127a-1's silence arm, because a
  ratchet applied to every file rather than only those already over is the second-most-likely
  wrong implementation.

  Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by Grep", every descriptor
  performs an ordinary commit in a real temporary repository over real git history; a test
  that reads the guard's source stays green on precisely the absent comparison this record
  introduces. The deployed descriptor ends on the survivability proof — a size-neutral edit
  to one of the repository's real oversized files must be permitted by the built copy —
  because that, and not any synthetic fixture, is the claim the keystone is making.
delivers_to:
  - agent: python-coder
    ac_id: GE-127b-1-i
    contract: >-
      The previous-length population resolved for the run — obtained by measuring each staged
      covered file's HEAD blob with the shared measurement function — and the per-file
      before-versus-after comparison built on it. GE-127b-1-i requires that population's size
      to be stated in the single outcome, and converts its unavailability or its emptiness
      from a silent completed commit into a named refusal.
  - agent: python-coder
    ac_id: GE-127c-1
    contract: >-
      The set of staged files the ratchet compared, which contributes to the set of kinds
      GE-127c-1 requires the outcome to declare as measured.
expects_from:
  ac_id: GE-127a-1
  contract: >-
    The commit-time per-file verdict, the shared measurement function and the single outcome
    stream, plus the per-kind permitted lengths resolved from the existing `file_size`
    section. This record adds a second comparison — the file's length after the change
    against the length it stood at before — as an additional arm on that same verdict, never
    as a parallel gate with its own output.
