criteria: |
  In your own session, the go-ahead to commit comes from you in person.

  When you ask for a commit in the conversation you are working in, the commit
  goes ahead once you confirm it yourself, in a way the assistant cannot answer on
  your behalf. When no person is there to confirm, the commit does not happen.
