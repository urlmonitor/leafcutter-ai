notes: |
  Change of intent, requested by the user on 2026-10-15. UXP-510 and UXP-511 had code
  that landed in July and were demoted on 2026-09-07 because they had no covers-tagged
  proof. On those runs the lane halted with all_new_tests_green_at_baseline, and the user
  finished them by hand with a mutation check: break the code the tests target, confirm
  the tests turn red, restore. This record lets the lane recognise that case. The proof
  itself is BO-2400a-3-x, and the refusals are in BO-2400a-3-xi.
