notes: |
  USER DECISION 4 (BrainCandy, 2026-10-12), BINDING: ticket-supervisor's
  llm-expert entry is a leftover -- remove it; redundancy becomes a
  declaration-shape error.

  WHY A FAULT AND NOT A NOTE. A redundant entry is harmless the day it is
  written and misleading the day the covering entry changes: if llm-expert
  stopped being a ticket-phase agent, the explicit entry would silently keep a
  permission nobody meant to keep. Today it surfaces as an unowned warning
  nobody acts on -- the class of message this goal removes.

  PLACEMENT CONSIDERED. Hosting this as an L2 under BO-3100a was considered
  and rejected for the reason in doc_links: BO-3100a is about authority, and
  this record is about declarations being coherent, which is AR-400's promise.
  AR-300c-5 would have been the nearest host but is done.

  2026-10-21: test contract (test_spec, test_rationale) added for composite
  closure, at the user's decision ("Add parent tests, then close"), so this
  parent can be proven done by covering tests of its own. Criteria, readiness
  and every requirement-defining field are unchanged.
