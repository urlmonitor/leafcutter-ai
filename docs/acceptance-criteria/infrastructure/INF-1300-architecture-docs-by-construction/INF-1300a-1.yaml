  - name: test_harness_uses_unmodified_hooks_and_no_bypass_token
    target_dir: unit_tests/docs/
    framework: pytest
    type: integration
    angle: boundary
    description: "The hook files copied into the scratch repo hash-match the repository's own, and neither the scratch commit subject nor .git/COMMIT_EDITMSG contains [NO-ARCH-UPDATE]."
  - name: test_description_and_components_satisfied_without_the_transform_tier
    target_dir: unit_tests/docs/
    framework: pytest
    type: integration
    angle: boundary
    description: "With transform-doc-frontmatter and transform-description-field disabled, check_description_field and check_surface_components_e2 both exit 0 over the produced file, proving the generator emits description: and components: itself rather than relying on a repair step."
  - name: test_single_produced_file_commits_with_no_hand_edit
    target_dir: unit_tests/docs/
    framework: pytest
    type: integration
    angle: deployed
    description: "Staging only the produced file (plus, where a parent is named, the parent it updated) and committing in the scratch repo with the full hook set installed succeeds with zero characters altered by hand and no second file."
test_rationale: >-
  A direct-import unit test on the generator is insufficient here by construction: this
  record's promise is ACCEPTANCE, and acceptance is decided by machinery this record does
  not get to change. A test that asserts the emitted text equals a stored fixture, or that
  re-implements a check's rule, passes on a producer whose output the project refuses —
  the exact failure the whole tree exists to end. Three measured mechanisms additionally
  make a naive "run the hook and read the exit code" test pass vacuously: two of the four
  named hooks ignore argv and read the staged index; check_mermaid_parent_link resolves
  paths against its own file's grandparent rather than the cwd repo, so a tmpdir scratch
  repo silently makes every check return empty; and the parent-link hook's bypass reads the
  LAST commit's subject. Hence every descriptor is an in-tree, real-hook, staged-index
  execution paired with an examination proof or a negative control.
delivers_to:
  - agent: python-coder
    contract: "The generator CLI at deployed path scripts/scaffold/new_arch_doc.py (sourced under templates/scripts/), accepting the seven pinned flags plus --parent <path>, --root, --source-ticket <id>; and the reusable scratch-harness that copies scripts/commit_guardian/ + config/ into a scratch git repo at equal relative depth, stages a produced file, runs each manifest-matched judgment hook, and returns a per-hook record of {hook_id, exit_code, examined: bool, stderr}. Consumed by INF-1300a-2, a-2-i, a-3, a-4, b-1, b-2 and b-3."
  - agent: llm-expert
    contract: "The means' accepted argument set as the CLI actually implements it — argument names, which are required, which are mutually exclusive (--parent vs --root) — so the two authoring surfaces can be corrected against what the means really accepts rather than against a restatement. Consumed by INF-1300b-4."
expects_from: null
notes: |
  THIS IS THE RECORD THAT CARRIES INF-1300a's WHOLE PROMISE, AND IT IS DELIBERATELY
  STATED AS AN OUTCOME OF THE REAL CHECKS. The L1 insists the benefit is "accepted",
  not "correctly formatted", precisely because formatting is claimable by inspection.
  The only observation that can distinguish the two is offering the produced artifact
  to the machinery that decides acceptance, unmodified.

  FALSIFIABILITY. Produce a document into a scratch repository, stage it there, and run
  the project's four commit-time document checks over it as the project runs them. The
  record is falsified by any one of them failing on a document nobody has touched. It is
  ALSO falsified by an observation that cannot fail: a test that greps what produces the
  document for the strings it emits, that asserts the output equals a stored fixture, or
  that re-implements a check's rule instead of invoking the check, passes on a producer
  whose output the project would refuse — which is the exact failure this whole tree
  exists to end. The four checks must be run, and the run must be capable of reporting
  each one's result separately, so "all four passed" cannot be satisfied by three running
  and one silently not being reached. Note the recorded trap in this repository: several
  of these hooks read the staged index rather than a path handed to them, so a hook
  invoked with a path argument may examine nothing and exit zero. An observation must
  confirm each check actually saw the produced file before treating its silence as a pass.

  THE BOUNDARY THIS RECORD DRAWS, AND WHY IT IS DRAWN HERE. The L0 and the L1 both record
  that the pinned inputs cannot determine three things the checks demand. The resolution
  taken across INF-1300a is: the promise is kept WHOLE, and the inputs are widened to
  carry the two facts the caller demonstrably already has — the document above the new
  one, and the originating ticket. Both are things the author knows at the moment of
  asking, and both authoring surfaces already oblige the author to know them: the parent
  is identified in the surfaces' own manual step, and the originating ticket is stated as
  a MUST on every create. Widening is not reinventing: the seven pinned arguments keep
  their names and meanings, and the additions are additive. The third gap — the further
  field certain kinds of picture oblige — cannot be widened away, because its value is
  content nobody but the author has; it is resolved by refusal rather than by a
  placeholder, and that refusal is INF-1300d-4. The alternative resolution the L1 offered,
  bounding the promise and naming the remainder as the author's, was rejected for the two
  widened inputs because a document that is produced and then still refused leaves the
  author in the round trip this goal exists to end, while appearing to have fixed it.

  DO NOT RESOLVE ANY PART OF THIS BY WEAKENING A CHECK. Stated as a clause in the criteria
  rather than left as a note, because the cheapest way to make this record pass is to
  narrow what the checks look at. The L1 says the same in its own terms: if delivering this
  appears to require changing one of those checks, the producer is wrong, not the check.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale, delivers_to and expects_from. Those are the IT PO's.
