notes: |
  EXPECTED RESOLUTION, stated as guidance and consistent with the criterion above: move the
  parentless record to GE-121 — verified free at authoring time, since GE-120 was taken by this
  tree — and give it a parent. That is the cheap direction: one file with no children moves,
  while the 33-file tree stays put. The criterion is deliberately written against "an identifier
  no other artifact claims" rather than against the literal GE-121, so that a later mint of
  GE-121 by another session does not invalidate the acceptance test.

  WHEN LISTING TAKEN IDENTIFIERS IN THIS NAMESPACE, scan the loose files as well as the folders.
  GE-114-*, GE-115 and the GE-119 record being moved all sit at the namespace root, so a
  folder-only listing under-reports what is taken. That listing error is a plausible way to
  produce a second collision while repairing the first.

  REPAIR IS NOT FREE, AND THIS CASE PROVES IT. The parentless record looks isolated, but it is
  cited from nine coverage tags in one test module, from a guard source file, and from a release
  note — and the same bare identifier is cited by 33 requirement files and a second release note
  meaning the OTHER record. So a bare "GE-119" citation is genuinely ambiguous today, which is
  the goal's own thesis demonstrated on its own worked example. Any tool resolving a coverage tag
  named GE-119 currently gets two answers.

  DELETING EITHER CLAIMANT IS NOT THE ANSWER. Both describe real, wanted work: the goal record is
  an active five-child tree, and the parentless record documents a live defect in the
  contract-shrinking guard that is covered by nine passing tests.

  THE MOVED RECORD IS PARENTLESS TODAY and would be reported by an orphan scan regardless. Giving
  it a parent is required by the criterion because a record with a new identifier and no parent
  simply relocates the problem, and because the store's own back-link gate would reject it.
