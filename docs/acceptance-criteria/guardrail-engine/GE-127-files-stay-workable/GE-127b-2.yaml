id: GE-127b-2
title: "During a merge, a file's previous length is resolved against the merge's other parent as well as HEAD, so a file inherited from the incoming branch is not judged as newly authored"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a merge is in progress, and a covered file already stands above its
    permitted length on the branch being merged IN but does not exist at all on
    the branch being merged INTO — so the literal ref HEAD, which during a merge
    is the receiving branch's PRE-merge tip, holds no blob for that path,
  When the author completes the merge with an ordinary commit that authors no new
    content for that file, the file arriving unchanged from the incoming branch,
  Then the merge commit completes and that file is not refused, because its
    previous length is resolved against the merge's other parent (MERGE_HEAD) as
    well as against HEAD and is found there unchanged,
  And given, in that same merge, a covered file that exists on NEITHER parent is
    added at a length above its permitted length,
  When the author completes the merge,
  Then the merge commit is refused for that file, because a file present on no
    parent is genuinely new and the absolute limit still applies to it inside a
    merge exactly as it does outside one,
  And given, in that same merge, a covered file that is already oversized on a
    parent is edited by the merge itself into being longer than it stood on the
    parent it was inherited from,
  When the author completes the merge,
  Then the merge commit is refused for that file, because a merge that itself
    grows an oversized file is not exempt,
  And given no merge is in progress,
  When the author performs an ordinary commit,
  Then the previous length is resolved exactly as it is today, from HEAD alone,
    and the outcome for every file is byte-for-byte the outcome the gate produces
    before this change,
  And the bug symptom ("Merging origin/main into any branch is refused by check-file-size for files the merge did not author. Observed 2026-09-08 merging origin/main into fast-lane/ge-127a-1 — a merge whose only conflict was three marker lines in one AC file — refused with 'FILE TOO LARGE' for unit_tests/portability/test_ge_120e_2_i.py (462 lines) and unit_tests/portability/test_ge_120e_4.py (501 lines). Both files are already committed on origin/main via eaf49388b and are untouched by that branch (verified with git ls-tree origin/main --name-only, and by checking every branch-only commit for them). The merge had to be completed with SKIP=check-file-size on commit d0271d413. Filed as KI-CG-20260908-ratchet-reads-pre-merge-head in docs/known-issues/commit-guardian.md.") must not occur
depends_on:
  - GE-127b
