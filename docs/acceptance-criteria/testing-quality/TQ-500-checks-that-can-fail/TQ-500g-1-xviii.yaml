test_rationale: >-
  The behaviour is an agent following prompt text, so a search of the skill text cannot show it (CLAUDE.md:
  verify behaviourally, not by grep). The proof is an agent eval of ticket-supervisor run with the edited
  building-epics skill and ticket-supervisor template, whose shell tool returns the scripted outputs E1 to E4
  (and the finish outputs) and whose agent-spawn tool only records; the assertions are on the recorded tool
  calls, not on the reply text: the list command carries --work-key "07_TICKET-refresh-gate"; test-breaker is
  spawned once with wrong_versions equal to [N2] in E1 and not at all in E2; nothing after the list step runs in
  E3 and E4, and the blocked result names the list step. Every row must show the model was actually invoked: a
  row with no model response fails the eval, never scores as a match (KI-TQ-20260907).
notes: |
  WHY. The IT PO's caveat on TQ-500g-1-vii and TQ-500g-1-xi. On /build-epic
  the list / test-breaker / finish sequence is run by ticket-supervisor from
  prompt text (building-epics SKILL.md section 5.10.2, and its restatement in
  ticket-supervisor.md), not from workflow JS. That text still
  (i) requires stdout to parse as one JSON object, which the shell tool's
      merged stderr defeats (the writer logs "base ref HEAD: ..." before its
      answer); TQ-500f-3-v fixed this only in the JS routes, and
  (ii) sends every owed name to test-breaker instead of only to_prepare, with
      no --work-key on the list command, so pins are never used on /build-epic
      and the preparer is paid every run (safe, since the writer ignores
      answers for pinned names, but slow and the guess it could make differs).
  One agent per requirement: TQ-500g-1-xi is python-coder's and does not
  declare the skill, so this llm-expert AC carries the prompt change.

  PLACEMENT. L3 under TQ-500g-1, next to TQ-500g-1-vii whose prompt it amends.
  TQ-500g-1-vii is done; this AC is new work rather than a reopening of it.

  WHAT STAYS AS -vii SAYS. Input check, serial check, the quoted command lines
  (only --work-key "<ticket_key>" is added right after list), the commit lock,
  --record "<ticket_key>" on finish, the halt shape, wrong_version_outcome, no
  supervisor-side recover, re-running before every commit spawn. K3 (no
  source_ac) still skips list and test-breaker and runs finish without ids.

  TESTABILITY (for the IT PO to turn into test_spec). An agent eval, not a
  grep:
    - Subject: ticket-supervisor with the edited building-epics skill and
      template, run through the repository's agent-eval runner (the Agent
      Evals harness), with the skill and template in its triggers so a change
      to either selects the eval.
    - Fixture: scripted shell-tool outputs for the list step (E1 to E4) and for
      finish (answer around a log line and "exit: 0"; no answer), a recording
      stub for agent spawns, a dispatch input carrying ticket_key and
      runs_alone true.
    - Assertions on the recorded tool calls: the list command's --work-key
      value; test-breaker spawn count and its wrong_versions; no finish and no
      commit spawn after a list with no answer or no to_prepare list; the
      blocked result's wrong_version_step "list".
    - Fail closed: a row where the model was not invoked counts as failed
      (KI-TQ-20260907), so the eval cannot pass by not running.
    - Control rows: the same scripted outputs with the answer alone (no log
      line) behave the same as E1 / E2, so the eval separates "reads the
      answer" from "reads any JSON-looking text".
  A live /build-epic drive of a fixture epic (a pinned ticket that owes two
  names, one pinned) is a useful extra check but not the proof.

  ASSUMPTIONS (BA). The ticket_key build-epic.js passes is the work key used
  for pins on /build-epic (TQ-500g-1-xi pins per work key; -vii already uses
  ticket_key as finish's --work-key). A supervisor started by the user without
  ticket_key uses the ticket file stem, as -vii's input check says.
