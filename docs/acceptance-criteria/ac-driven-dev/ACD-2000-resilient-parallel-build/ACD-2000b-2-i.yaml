it_requirements:
  - "THE CONTRACT IS ALL-OR-NOTHING FROM THE CALLER'S POINT OF VIEW, as the BA decided. Verified starting point: the claim loop is per-AC sequential (~line 165) and returns success=False with a PARTIALLY populated `claimed` list, leaving the caller obliged to release. That obligation is what this AC removes."
  - "A try/finally DOES NOT SATISFY THE FOURTH CLAUSE and must not be offered as the implementation. Its correctness depends on the failing process still being alive, which is the entire class of bug this L1 exists to close. Satisfy it either by taking the set in one indivisible step, or by recording the set identity on each member so ACD-2000b-3's reclaim rule can clear a partial residue without the owner."
  - "STAMP THE SET IDENTITY ON EVERY MEMBER as it is taken, so a partially-taken set is recognisable as one interrupted operation rather than as several unrelated claims. Without it a reclaim rule frees the members one at a time and a second effort can start on a member of a set it does not hold."
  - "TAKE THE SET IN A DETERMINISTIC ORDER (sort the member ids before taking). Two efforts taking overlapping sets in opposite orders can each hold part of the other's set and neither can proceed -- a deadlock the criteria do not name and that an unordered implementation will produce as soon as bundles overlap."
  - "NAME THE UNAVAILABLE MEMBER in the caller-facing failure. Today the error string embeds the full named_acs list (~line 196), which sends an operator to inspect every member. The contended id must be identifiable on its own -- it is also the input a scheduler needs to decide whether to wait or to re-plan around it."
  - "THE CLI CONTRACT CHANGES AND MUST BE UPDATED IN THE SAME CHANGE. fast_lane.main()'s claim branch (~lines 990-1012) refuses only when target_refused -- every member already taken. Under all-or-nothing a SINGLE contended member must also yield none-taken, so the documented exit-code semantics in main()'s docstring (~lines 933-946) and the subparser help (~lines 850-857) become wrong the moment this lands."
  - "EVERY MEMBER MUST BE TAKEN THROUGH ACD-2000b-2's ATOMIC TAKE. A set operation composed of non-atomic takes tears in a second way -- two set-claimers can both believe they hold the same member -- so this AC's guarantee is strictly on top of that one, never a substitute for it."
  - "RELEASING THE BRIEFLY-HELD MEMBERS MUST BE ATTRIBUTABLE, per ACD-2000b-1-i: a set that unwinds leaves a record of the hand-back rather than requirements that quietly became free."
  - "Follow the project error handling policy (Ruff E722/BLE001/TRY): typed except, log-or-reraise, no bare except; a failed unwind must be reported, never swallowed into a successful-looking refusal."
