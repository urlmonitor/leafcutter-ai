    description: "Running check_test_ac_tags.py as a subprocess over a file whose test function opens with a docstring carrying a covers tag exits 0 with no traceback, and a docstring-first function with no tag anywhere is still reported."
notes: |
  FOUND 2026-09-16: the hook blocked a commit on Python 3.14.2 with
  `AttributeError: 'Constant' object has no attribute 's'` at has_covers_tag()'s
  docstring branch. `ast.Constant.s` and `.n` were deprecated aliases and are removed in
  Python 3.14. Earlier commits touching test files passed only because none of their
  test functions opened with a docstring.

  SCOPE: this record is only about the gate not crashing and keeping its current
  verdict. Whether a covers phrase inside a docstring should count as a tag is
  TQ-100b-4-ii's subject and is not decided here.
