id: AR-400d-3
title: "Every part of the system that reads a grant understands the project-supplied marking the same way"
component: agent-registry
components:
  - agent_registry
  - skills_system
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given probe-coder grants "postgres" marked `provided_by: project`, in a
    project that does not provide it, and its instructions say "Apply the
    `postgres` skill",
  When each of the following is run over that tree --
      the declaration-shape check of the specialist's header,
      the commit-time step that regenerates the derived central registry,
      the instruction-to-grant reference check (AR-400a-1, AR-400b-1),
      the verdict that decides whether a specialist's abilities work is done,
      the prompt compile that delivers abilities to the specialist,
  Then the shape check accepts the marking and rejects any other value of it
    ("provided_by: vendor") with a finding naming the specialist, the grant and
    the value,
    And the regenerated central registry keeps the marking on that grant, and a
      second regeneration is byte-identical,
    And the reference check reports neither "does not exist" nor "not granted"
      for the instruction,
    And the done verdict counts the grant as declared and not as a missing
      package ability,
    And the compiled prompt states the ability is project-supplied and not
      installed here (AR-400d-2),
    And the five classifications are made from the one parsed grant, so changing
      only the marking changes all five together on the next run.
depends_on:
  - AR-400d-1
  - AR-400d-2
