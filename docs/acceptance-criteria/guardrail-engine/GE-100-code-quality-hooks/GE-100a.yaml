title: "jscpd hook exits cleanly when the jscpd binary is not installed"
component: guardrail-engine
level: L2
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-100-code-quality-hooks/GE-100.yaml"
criteria: |
  Given the commit guardian configuration has the duplicate_code section with:
    enabled: true
    strict: false
  And the jscpd binary is not present on the system PATH
  When the duplicate code hook runs at pre-commit time
  Then the hook exits with code 0 (fail-open)
  And it emits an advisory message to stderr stating that jscpd was not found
  And the advisory message includes guidance on how to install jscpd
  And no staged files are blocked from committing
