notes: |
  FIELD EVIDENCE -- PR #862, merging origin/main into
  EPIC-WorkIsOnlyEverMarkedFinishedThroughThe on 2026-09-28. Both branches had
  independently minted BO-4000d for different behaviours. The collision was resolved
  by taking main's record verbatim and renumbering the branch's own to BO-4000f.
  `git diff MERGE_HEAD -- docs/acceptance-criteria/build-orchestration/BO-4000d.yaml`
  was EMPTY -- the staged file was byte-identical to main's -- and the hook still
  refused the commit with "criteria was modified but amended_by was not updated".

  The two available responses were both wrong, which is what makes this a defect
  rather than an inconvenience: appending an amended_by entry would have recorded
  the merge author as having amended criteria written by someone else on another
  branch, corrupting the audit trail the field exists to provide; and SKIP=
  switched off a governance gate for the whole commit. The commit was made with
  the skip, recorded in its message.
