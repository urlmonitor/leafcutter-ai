  THE SCOPE BOUND FORBADE THE ONLY HONEST FIX -- THIS IS A SPECIFICATION TRAP, NOT A
  CODER ERROR. The last it_requirement reads "do not satisfy this AC by making the
  record always producible; that is -1's work and would leave this enforcement floor
  untested." Correct in isolation, and correct if -1 had landed first. Built before
  -1, it barred the coder from the one remedy that resolves the condition and left
  only its opposite available: implement a refusal keyed on a condition that is
  itself the defect. The instructions were followed and the result regressed 18
  outcomes across 6 files. Whoever re-lands this should see that the failure sits in
  the specification's sequencing, not in the implementation, and should re-read this
  bound alongside the it_requirement it sits next to -- "MUST NOT REFUSE
  OUT-OF-PACKAGE TARGETS WHOLESALE" -- which the two of them together made
  unsatisfiable in the -3-first order.

