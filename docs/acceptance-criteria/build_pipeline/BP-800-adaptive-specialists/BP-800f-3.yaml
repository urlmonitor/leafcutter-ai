criteria: |
  Given a project that uses PostgreSQL (relational), Neo4j (graph), and MongoDB (document)
  And best-practice knowledge files exist for all three
  When the technology detector and agent generator run
  Then three database specialists are generated: "postgresql-coder", "neo4j-coder", "mongodb-coder"
  And each specialist contains only the best practices for its own paradigm
  And each can be dispatched independently by name
  And there is no single "database-coder" umbrella agent that conflates paradigms
