assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    The agent for command steps is declared once in the lane, and no command-step
    dispatch carries its own agent literal. Retire CLAIM_EXECUTOR_AGENT_TYPE,
    RELEASE_EXECUTOR_AGENT_TYPE and the status-checker and python-coder literals at
    resolve, producibility and context-bundle. Do not leave any of them as aliases. A
    duplicated per-step choice is how the claim and release steps drifted apart before.
  - >-
    Every dispatch in the lane must be identifiable as either a command step, with a
    declared step kind (reads_store, changes_store, changes_repository or publishes), or
    a specialist phase. BO-2400f-5-ii reads this declaration, so it must be readable
    without running a model.
  - >-
    Command-step requests use the command-step-runner request shape from BO-2400a-1-i and carry
    BO-2400f-3-ii's target block. The lane reads each step's outcome from the result's
    exit_status and stdout, not from agent prose. The JSON a step previously parsed is
    now the stdout field, parsed unchanged.
  - >-
    Each command step's declared kind uses the step_kinds vocabulary from
    config/agent_registry.schema.json (BO-2400a-1-i). Push and pull-request steps are
    publishes. Claim and release are changes_store. Resolve and producibility are
    reads_store. Commit is changes_repository.
  - >-
    Moving the context-bundle step to the command-step-runner must not bypass
    BO-2400c-1-viii (approved). The bundle command's producer-stated verification value
    must reach the lane in the relayed stdout, and the lane's comparison stays in place.
    A relay that alters the bundle is expected to halt the run under c-1-viii. That is
    correct behaviour, not a regression.
  - >-
    No request contains a role reassignment. No 'You are the <x>-phase agent' framing is
    sent to any agent. A request names the step and the command, not a persona.
  - >-
    Test-writer, coder and pr-reviewer dispatches keep their agents and prompts, apart
    from the target block BO-2400f-3-ii adds.
  - >-
    Permission is not manufactured. Do not add or change permits_shell on an existing
    agent. Remove any code comment that justifies a former executor with a permission
    the registry does not grant (the KI-BO-020 comment KI-BO-20260901-1620 describes).
    It must not survive next to the new routing.
  - >-
    Registry spawned_by lists stay consistent with the new routing, so
    check-agent-spawn-consistency passes. The command-step-runner lists fast-lane-ship.js. An
    agent that is no longer dispatched by the lane has the lane dropped from its
    spawned_by only if the lane was listed there.
  - >-
    The template workflow is the edit site. The deployed .claude/workflows/fast-lane-ship.js
    is regenerated by build.py, and test_fastlane_template_deploy_parity stays green.
  - >-
    Existing fast-lane workflow tests (BO-2400f-7-iii, f-10-i, f-10-ii, f-12, f-13,
    f-3-i) that stub replies by agent type are re-keyed to the new agent and reply
    shape. Their assertions may be re-keyed but not weakened or deleted.
test_required: true
test_spec:
  - name: test_every_command_step_is_dispatched_to_the_command_step_runner
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: seam
    description: "Under the workflow engine harness, a stubbed run through resolve, producibility, claim, context bundle and a post-claim halt records every command-step dispatch with agentType command-step-runner. The assertion is on the dispatches actually made, not on a source constant."
    must_catch:
      - "resolve or producibility still dispatched to status-checker (today's state)"
      - "claim still dispatched to worktree-agent"
      - "release still dispatched to python-coder"
      - "context bundle still dispatched to python-coder"
  - name: test_specialist_phases_stay_on_their_specialist_agents
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: discrimination
    description: "In the same run the test-writer, coder and pr-reviewer dispatches keep their specialist agent types, and none of them goes to the command-step-runner."
    must_catch:
      - "a blanket rewrite routes every dispatch, specialists included, to the command-step-runner"
  - name: test_no_step_request_reassigns_the_asked_agent_role
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: failure
    description: "No recorded request prompt instructs its agent to act as a named role other than its own ('You are the claim-phase agent' and similar)."
  - name: test_lane_proceeds_resolve_through_context_bundle_on_command_step_runner_results
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: reachability
    description: "With the command-step-runner stubbed to return contract-shaped results (exit_status 0, stdout holding each step's JSON), a run from an unchanged fixture store reaches the context-bundle step's successor with no declined-step halt."
  - name: test_command_step_runner_dispatches_do_not_count_toward_test_writer_plus_coder_total
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: boundary
    covers: [BO-2400a-1-i, BO-2400f-5-i]
    description: "In a full stubbed green run the test-writer plus coder dispatch count is exactly 2, while command-step-runner dispatches are several."
test_rationale: |
  The defect was a dispatch that looked right and went to the wrong agent, and the claim
  and release fixes drifted apart inside the same file. So every assertion is made on the
  dispatch records the harness captures from an executed run
  (unit_tests/_workflow_engine_harness.py), as in the existing BO-2400f-7-iii and f-10-i
  workflow tests. A test that greps the workflow for the agent name proves nothing about
  which agent each step is actually asked.

  The first and second tests are opposed. Routing nothing passes the second and fails the
  first. Routing everything, specialists included, passes the first and fails the second.

  The criteria's final clause ("no step declined as outside the asked agent's role") depends
  on model judgement and cannot be proved deterministically. The reachability test shows
  that the lane, given replies in the command-step-runner's contract, carries the run through
  without a halt. Whether the real agent produces such replies is left to BO-2400a-1-i's
  contract tests and a manual live smoke run.
delivers_to:
  agent: python-coder
  contract: "templates/workflows-js/fast-lane-ship.js in which every dispatch is declared either as a command step {step: string, kind: 'reads_store'|'changes_store'|'changes_repository'|'publishes', agent: <single lane-level command-step-runner declaration>} or as a specialist phase, readable statically for BO-2400f-5-ii; every command step parses the BO-2400a-1-i reply shape, so BO-2400f-5-iii's decline classification and BO-2400f-10-iii's release routing apply to it."
expects_from:
  ac_id: BO-2400a-1-i
  contract: "Agent command-step-runner registered with permits_shell: true and deployed to .claude/agents/. Request {step, command, target: {workspace, branch, ac_id}}; reply result {command, workspace, exit_status: int, stdout, stderr} or decline {declined: true, step, agent, reason} without exit_status. (Also requires BO-2400f-3-ii's target block and BO-2400f-5-iii's decline classification, both in depends_on.)"
