notes: |
  FLOW NODES: split-approve (step); split-revise, split-reject and
  split-reject-kept-whole (branches).

  SETTLED: no part runs before a person answers, and the run waits for that
  answer (run_status waiting_human). Only a person answers, recorded as
  human:<name> with the time (ADR-060). An approved split keeps at least one
  part. A rejected split runs no part.

  REJECTION, BY WHY THE SPLIT WAS OFFERED (user decisions 2026-10-05, the last
  one at the final gate; recorded in DK-400 "DECISIONS AT THE PO GATE" and
  "FINAL GATE"). Only jev_none ends blocked:
    - trigger bundled_accepted (routing would have accepted the request as one
      decision): the request goes ahead as ONE decision, exactly as today, from
      the precedent step. The run is not blocked, and no part or child work
      item is created (state rejected_kept_whole).
    - found_at mid_run (no trigger): the same go-ahead. The work item that held
      the many-sided question goes ahead as one, because the run had already
      taken it on. The run is not blocked, and no part or child work item is
      created (state rejected_kept_whole).
    - trigger ambiguous (the request was unclear): it falls back to today's
      clarification question, and the run is not blocked. Customer wording:
      "an unclear request comes back to you as the clarifying question you
      would get today". This replaces the earlier rule that ambiguous ends
      blocked like jev_none.
    - trigger jev_none (nothing could handle the request): the run ends blocked
      and still records the capability gap, as today. Its report says plainly
      that the split was rejected and nothing was decided, with a hint to ask
      again as one bounded question (state rejected).
  In every case the report keeps one plain line saying a split was offered and
  rejected (DK-400f).

  PRODUCT-TRUTH FOLLOW-UP:
    - RESOLVED: the go-ahead ending for bundled_accepted and mid-run. Flow v5
      has split-reject-kept-whole, and mock v5 has state rejected_kept_whole
      with whole_decision_id and record dcp-decision-records-bundled.
    - OPEN, for the ambiguous fallback decided at the final gate:
      - Flow v5's split-reject still covers "jev_none or ambiguous" (ends
        blocked), and so does split-too-few-parts.
      - In mock v5, state rejected covers a "jev_none or ambiguous subject"
        whose run ended blocked, and capability_gap_recorded is true for
        both.
      Both must be amended so that ambiguous falls back to today's
      clarification question. The mock-data author is preparing v6; the flow
      needs the matching change. Confirm both before the BA back-links L2s to
      split-reject.

  CARRY TO L2:
    - The gate offers four answers: approve as shown, edit a part's text, untick
      parts (a subset), or reject. Edits and a subset can be combined in one
      approval (dcp-split-bounds-mid-run does both).
    - A person may add back a dropped proposal's question by editing (flow
      branch split-dropped). Whether a person may also ADD a new part, or change
      a part's dependencies or whether it needs a decision or research, was
      SETTLED by the IT PO (DK-400 Q7, approved at the final gate). The person
      may not; a missing question is added by rewording a part or is asked
      again as its own request (DK-400d-1).
    - A skills AC was added at the final gate: DK-400d-1-ii, written by the BA.
    - Unticking every part is not an approval. Whether the gate forbids it or
      treats it as a rejection is for the BA to settle.
    - The gate note (gate_note) keeps the person's words: a rejection reason,
      why a part was left out, the order picked.

  DOCS: a person answers this gate (how-to). The split has seven states with
  explicit transitions (state-diagram): proposed, approved, in_progress,
  completed, ended_partial, rejected and rejected_kept_whole (mock v5).
