criteria: |
  When the work lands, the fault log stops saying it is still open.

  A fault whose subject has since been delivered no longer reads as an outstanding
  problem. The list of what is wrong with the system shrinks as things are fixed,
  so it stays worth reading — and work is never left sitting in the queue because
  the only record that it had already been done was kept somewhere else.
