id: DK-200a-2
title: "Resuming a run reuses the context already gathered for that run"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: draft
req_status: draft
priority: high
work_status: done
criteria: |
  Given a run has gathered context and is waiting for a human answer or a host result,
  And a document used by enrichment changes while the run waits,
  When the waiting run resumes,
  Then the run retains its original context snapshot,
  And no second initial enrichment outcome is produced for that run.
depends_on: [DK-200a]
covered_by:
  - "tests/kernel/intent/test_context_enrichment_wiring.py::TestContextEnrichmentWiring::test_resume_reuses_checkpointed_context_instead_of_reading_changed_files"
  - "tests/kernel/intent/test_context_enrichment_wiring.py::TestContextEnrichmentWiring::test_host_artifact_and_host_resume_retain_the_saved_context"
implemented_by:
  - "kernel/scheduler/nodes_enrichment.py"
  - "kernel/scheduler/graph.py"
  - "kernel/scheduler/state.py"
  - "kernel/contracts/__init__.py"
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Persisted context must survive process boundaries and human or host resume without re-reading changed repository files."
  - "Resuming the same run must not create a second initial context event or replace its checkpointed context."
delivers_to: null
expects_from:
  ac_id: DK-200a-3
  contract: "EnrichedContext checkpoint value: original_goal:string; caller_context:{host:string|null, capabilities:string[], conversation:string[], observations:string[]}; workspace_id:string; repository_root:string; registered_capabilities:string[]; evidence:{source_id:string, locator:string, excerpt:string, content_hash:string, truncated:boolean}[]; sources_consulted:string[]; files_scanned:integer; limitations:string[]; truncated:boolean; status:gathered|no_evidence|partial|unavailable|disabled. Caller claims and source evidence remain distinct; the saved value is unchanged by provider projection."
test_required: true
test_spec:
  - name: test_resume_reuses_checkpointed_context_instead_of_reading_changed_files
    target_dir: tests/kernel/intent/
    framework: pytest
    type: integration
    angle: reachability
    description: "After a human pause and repository mutation, resume preserves the identical context snapshot and exactly one context.enriched event."
  - name: test_host_artifact_and_host_resume_retain_the_saved_context
    target_dir: tests/kernel/intent/
    framework: pytest
    type: integration
    angle: seam
    description: "A valid host submission through a fresh service preserves the prior context after repository mutation and produces no second context.enriched event."
test_rationale: "Human and host continuations are distinct entry paths; both require checkpoint round-trip evidence against a changed repository."
