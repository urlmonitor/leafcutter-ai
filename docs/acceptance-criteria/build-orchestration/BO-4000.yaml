risk_surface: contract_boundary
package_surface: false
criteria: |
  Given /build-feature EPIC-TruthfulProjectRecord is started from inside the linked
    worktree `C:\Users\Hendrik\Code\leafcutter\worktrees\uxp-700-tranche-2`
  And the epic folder
    `C:\Users\Hendrik\Code\leafcutter\worktrees\uxp-700-tranche-2\tickets\00_inbox\epics\EPIC-TruthfulProjectRecord`
    lies inside that worktree
  And the run's target resolution reports that worktree as the target's worktree
  And that path is the top-level directory of a linked worktree, not the main checkout
  When the worktree step runs
  Then no agent is asked to open a new worktree
  And every phase agent in the run is handed paths rooted in
    `C:\Users\Hendrik\Code\leafcutter\worktrees\uxp-700-tranche-2`
  And no later step replaces that worktree with a different path.

  Given the run's target resolution reports as the target's worktree a path that is not
    the top-level directory of a linked worktree — the epic folder inside a checkout,
    as in KI-BO-027 — or reports the main checkout itself
  When the worktree step runs
  Then that path is not used as the run's worktree
  And the run goes on as if no worktree had been resolved for the target, per the next
    scenario.

  Given /build-feature EPIC-TruthfulProjectRecord is started from the main checkout
    `C:\Users\Hendrik\Code\leafcutter\leafcutter-ai`, in the dev layout, where the
    repository's worktree base is `C:\Users\Hendrik\Code\leafcutter\worktrees`
  And no worktree exists for that target
  When the worktree step runs
  Then the workflow itself names one exact location for the new worktree to the agent
    that opens it, and the location is not left to that agent's judgement
  And that location is a direct child of the worktree base, derived only from the base
    and the target's identity — for this target,
    `C:\Users\Hendrik\Code\leafcutter\worktrees\EPIC-TruthfulProjectRecord`
  And starting the same run for the same target again names the same location
  And the location is never the target's folder or any folder under it, never at or under
    the top-level directory of the main checkout in the dev layout, and never at or under
    the top-level directory of any linked worktree.

  Given the Node-based workflow harness at unit_tests/_workflow_engine_harness.py, which
    runs a workflow script's own top-level body under mocked agent globals
  When this record is verified
  Then the reuse scenario, the rejected-resolution scenario, and the named-location
    scenario are each proven by running build-feature's own top-level body through that
    harness, with stubbed resolver and worktree agents, asserting on which agents the run
    dispatched and on the paths present in their prompts
  And a test that only inspects the worktree step's prompt text in the workflow source is
    not accepted as coverage.
