roadmap_phase: phase_1
criteria: |
  Given the enrolled diagrams location holds 11 artifacts that carry no sequence number and
    predate the enrolment rule,
  And the current change set adds no artifact to that location,
  When the enrolment check runs,
  Then it terminates with a passing result,
  And it reports none of the 11 as a violation,

  And when the change set MODIFIES the content of one of the 11 without renaming it,
  Then the check still terminates with a passing result and reports no violation for it,

  And when the change set ADDS a twelfth unnumbered artifact to the same location,
  Then the check terminates with a failing result and names only that twelfth artifact,

  And when the change set RENAMES one of the 11 to another unnumbered name,
  Then the check terminates with a failing result and names it, because a rename is the moment
    its name is being chosen again,

  And in every one of these runs the check states how many pre-existing unnumbered artifacts it
    observed and did not flag, so the size of the exemption is visible on every run rather than
    silently absorbed.

  Coverage note: covered only by a test that executes the check with each of these four change
  sets against a tree that really contains the pre-existing unnumbered population, asserting the
  result value and exactly which paths are named. A test run against a tree with no pre-existing
  unnumbered artifacts cannot distinguish this behaviour from one that flags everything.
