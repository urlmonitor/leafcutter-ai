# Continuous-integration gate for leafcutter-ai.
#
# Runs on every push to main and every PR targeting main. Required checks are
# configured in the main-branch ruleset. The full pytest job is disabled by
# owner request because of its runtime; other jobs retain their existing policy.
#
#   lint       — ruff check over scripts/, tests/, unit_tests/, kernel/ (config:
#                ruff.toml), plus kernel/ under E722,BLE001,TRY (the Error Handling
#                Policy; the repo-wide cleanup of the other trees is deferred).
#                BLOCKING. The templates/ source tree is excluded (see ruff.toml).
#
#   component-vocab — every `components` value is a canonical id in
#                docs/components.json. BLOCKING. Diff-scoped on PRs, full tree
#                on push to main.
#
#   product-truth-valid - the same offline store validator used by pre-commit,
#                including documented handoff fields and examples. BLOCKING,
#                every PR/push, plus its focused contract regression tests.
#
#   shipped-address-check — nothing under templates/ (including templates/docs/)
#                or config/ carries a real-looking database connection address
#                (INF-1100d-4 / INF-1100d-4-i). BLOCKING, full tree every run —
#                a build ships the whole of both roots regardless of what any
#                one PR touched, so this is not diff-scoped. Runs
#                scripts/portability/check_shipped_addresses.py with no flags,
#                the same normal-suite entry point the check's own unit tests
#                (unit_tests/portability/test_inf_1100d_4*.py, part of the
#                `test` job below) already exercise; this step is the
#                comparable-package-check wiring (mirrors
#                scripts/ci/check_declaring_files.py's direct-invocation shape)
#                that makes a reintroduced address fail CI even on a
#                contributor whose local pre-commit hooks are not installed.
#
#   test-shard — the full pytest suite over tests/ and unit_tests/, split
#                across 8 parallel shards via pytest-split's --splits/--group.
#                Re-enables what was DISABLED on 2026-10-02 for runtime: the
#                single job took ~52 min, which is why no behavioural gate has
#                guarded main since that date. The shards PARTITION the
#                collected set — every test still runs exactly once, nothing is
#                skipped, deselected, or sampled. Balance comes from the
#                committed durations file; without it pytest-split splits by
#                test COUNT, which is pathological for this suite (60 of 7604
#                tests hold 63% of the clock). fail-fast is off so one shard's
#                failure cannot cancel the others. NOT YET BLOCKING — see
#                `test` below.
#
#                THE DURATIONS FILE IS NOT YET PRESENT. Until
#                .github/workflows/test-durations.yml has run once and its PR
#                is merged, these shards split by count and will be UNEVEN —
#                degraded balance, never lost coverage. It cannot be generated
#                locally: pydantic, langgraph, langchain, neo4j and langfuse
#                are pinned here but absent from a typical dev environment, so
#                163 modules fail to import locally and run only on CI.
#
#   test       — aggregator over test-shard, carrying the stable check name
#                `Test suite (pytest)` that the required-check list used before
#                2026-10-02. Green only when EVERY shard is green. Exists so
#                that re-promoting the suite to a required check is a ruleset
#                checkbox rather than a workflow edit, and so a matrix resize
#                never invalidates the required-check name. Still
#                INFORMATIONAL until the owner promotes it.
#
#                Shard count is bounded by CONCURRENCY, not by arithmetic. A PR
#                starts 21 slots from this file (13 non-shard jobs, since
#                ac-store-valid-whole-store is push-only, plus the 8 shards)
#                and 4 more from schema_diff, agent-evals and fixture-drift —
#                25 at peak, against a per-account cap set by plan (20 on
#                Free). Above the cap jobs QUEUE rather than fail, so the
#                effect is silent: later shards start only as earlier jobs
#                finish. Accepted here because 12 of the 13 non-shard jobs are
#                static checks that clear in seconds and hand their slots over,
#                so the overflow drains in the first minutes rather than
#                persisting. Expect ~7 min plus a short start-up stagger, not a
#                clean 1/8 of 53 min. Confirm the plan before raising 8.
#                Full rationale and measurements:
#                docs/analysis/2026-10-05-pytest-ten-minute-target-4-ci-sharding.md
#
#   done-proof — proof-of-done coverage (BO-2500b). BLOCKING, diff-scoped.
#
#   reachability-guard — forward runtime-reachability guard (BO-2900b-1):
#                every capability a command surface's built parser registers
#                must have an automation caller. BLOCKING — REFUSES, NOT
#                WARNS (ADR-050 SS4): no continue-on-error on this job. When
#                no --surface/--automation overrides are supplied (this job's
#                current invocation), check_reachability.py's own
#                no-automation-supplied default applies and it exits 0
#                honestly ("nothing to check yet", ADR-050 SS8) rather than
#                the job downgrading via continue-on-error — see the job's
#                own comment for why (collected_invocations() does not yet
#                parse this repo's real JavaScript automation) and the single
#                line that adds real --surface/--automation arguments once
#                BO-2900b-3/BO-2900c-4 land.
#
#   ac-store-valid — the AC store passes its schema and governance hooks.
#                BLOCKING. Diff-scoped to the pull request (ACS-200g).
#
#   ac-store-valid-whole-store — the merge-vector backstop (ACS-200h): the same
#                hook set applied to EVERY record, on push to main. Catches the
#                cross-PR breakage a diff-scoped check cannot see (two PRs each
#                valid alone that together break a cross-record rule).
#                INFORMATIONAL while a 512-finding backlog is burned down; see
#                the job's own comment for the single line that flips it.
#
#   changelog-presence — a changelogs/ entry accompanies the change. BLOCKING.
#
#   typecheck  — mypy over the .py files changed in a PR (non-strict,
#                --ignore-missing-imports, since the codebase has no type config
#                yet). INFORMATIONAL ONLY (continue-on-error): the codebase is
#                untyped, so touching any file surfaces dozens of pre-existing
#                type errors unrelated to the change. The job surfaces type
#                findings on changed files without blocking the merge. Promote
#                to blocking once the codebase is annotated. On direct pushes
#                there is no diff base, so it is a no-op.
#
#   consumer-install-sim — empirical consumer-install simulation (AC BP-900h-1).
#                Checks the package out into a leafcutter-ai/ subdirectory (so
#                the job's default working directory holds nothing but that
#                checkout — the "scratch directory containing no files other
#                than a minimal skills_config.json" the AC's Gherkin
#                describes, once the script below writes that file), then runs
#                scripts/ci/check_consumer_install.py, which drives a REAL
#                `build.py --target-dir` into that scratch directory (never a
#                copy of this repo — copying would reintroduce the
#                source-tree bias that hid BP-900g-4/-5/-6, BP-015..BP-018)
#                and reuses the existing BP-900b-1/BP-900c-1
#                reference-resolution machinery against the deployed output.
#                All job logic lives in that one invocable script; this job
#                supplies only arguments (mirrors the constraint already
#                written into sibling AC BP-900h-6 for merge-gate tooling).
#                Runs on both push and pull_request — unlike ac-store-valid /
#                changelog-presence, this job's logic does not differ between
#                the two events, so no `if:` guard is needed; the AC's
#                requirement ("must run on pull_request, so it gates before
#                merge") is satisfied simply by not excluding pull_request.
#                INFORMATIONAL ONLY for now: this is NOT yet a required/
#                blocking branch-protection check — promoting it to required
#                is BP-900h-3 (a separate ticket, out of scope here). Do not
#                add it to any required-status-checks list until that ticket
#                lands.
#
# Dependencies are pinned in requirements-dev.txt.

name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check scripts tests unit_tests kernel

      - name: Ruff check kernel error-handling rules
        # The Decision Kernel is written to the Error Handling Policy (CLAUDE.md), so it is held
        # to the full E722/BLE001/TRY set; the other trees are not (see ruff.toml).
        run: ruff check kernel --select E722,BLE001,TRY

  product-truth-valid:
    name: Product truth valid (offline)
    runs-on: ubuntu-latest
    # A focused whole-store check on every PR/push catches dependency-only
    # changes and removed contract metadata without a second driftable selector.
    # Keep this the same validator invoked by check-product-truth-validate.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate product-truth contracts and store
        run: python docs/product-truth/scripts/validate_product_truth.py --quiet

      - name: Test product-truth contract enforcement
        env:
          AC_ENFORCE_STRICT: "1"
        run: python -m pytest unit_tests/product_truth/test_flow_io_contract*.py -q

  atlas-contracts:
    name: Atlas contract display
    runs-on: ubuntu-latest
    # Display-only changes must exercise the real loader/explorer/drawer seam,
    # even when no AC status or product-truth JSON file changed in this PR.
    defaults:
      run:
        working-directory: leafcutter-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: leafcutter-web/package-lock.json

      - name: Install Atlas dependencies
        run: npm ci

      - name: Type check Atlas and its tests
        run: npx tsc --noEmit --incremental false

      - name: Test Atlas contract display
        run: npm test -- components/flows/__tests__/flow-drawer.contracts.test.tsx components/flows/__tests__/flow-explorer.contracts.test.tsx lib/data/__tests__/flows.contracts.test.ts

  component-vocab:
    name: Component vocab style (components.json)
    runs-on: ubuntu-latest
    # BLOCKING. Every `components` LIST value must be a canonical id in
    # docs/components.json (underscore-case). Scope depends on the event:
    #   - pull_request : only files CHANGED vs the base (diff-scoped), so a clean
    #     PR is not failed for pre-existing drift in the base it didn't introduce;
    #     a PR that *adds* drift still has that file in its diff and is caught.
    #   - push (to main): the FULL tree, guaranteeing main never carries an
    #     off-registry value (the merge-vector backstop that pre-commit can't cover).
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history + base ref for the diff on pull_request events.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Check component vocabulary (PR — changed files only)
        if: github.event_name == 'pull_request'
        run: |
          # No --depth on this fetch, on purpose (same as changelog-presence).
          # The checkout above has full history; --depth=1 would make the clone
          # shallow again at the base branch's tip. Once the base has moved past
          # this PR's merge base, the script's `git diff base...HEAD` then fails
          # with "no merge base", and the script silently falls back to a
          # full-tree scan, so pre-existing drift can fail a clean PR.
          # Fixed 2026-10-02, together with the typecheck job (PR #985 failure).
          git fetch --no-tags origin "${{ github.base_ref }}"
          python scripts/check_component_vocab.py --changed "origin/${{ github.base_ref }}"

      - name: Check component vocabulary (push — full tree)
        if: github.event_name != 'pull_request'
        run: python scripts/check_component_vocab.py

  shipped-address-check:
    name: Shipped address check (INF-1100d-4)
    runs-on: ubuntu-latest
    # BLOCKING. No pip install step: check_shipped_addresses.py is
    # stdlib-only. Full tree every run (not diff-scoped): a build ships the
    # whole of templates/ and config/ regardless of what one PR touched, so
    # an address reintroduced by an earlier, already-merged PR must still
    # fail every subsequent run, not just the run that added it.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check shipped sources for database connection addresses
        run: python scripts/portability/check_shipped_addresses.py

  test-shard:
    name: Test suite shard ${{ matrix.group }}/${{ strategy.job-total }}
    # Re-enables the suite that was disabled on 2026-10-02 for runtime, by
    # splitting it across parallel shards instead of running it as one job.
    # Every test still runs exactly once: the shards partition the collected
    # set, they do not sample it. See
    # docs/analysis/2026-10-05-pytest-ten-minute-target-4-ci-sharding.md.
    runs-on: ubuntu-latest
    strategy:
      # Do NOT let one shard's failure cancel its siblings. The default would
      # turn a single-test regression into "7 shards cancelled, cause unknown"
      # — strictly less information than the old single job produced.
      fail-fast: false
      matrix:
        # Eight, not ten. With these 8, a PR peaks at 25 concurrent jobs
        # against a per-account cap of 20 on GitHub Free, so some queueing is
        # expected and accepted — see the header note for why it drains fast.
        # Over the cap jobs QUEUE rather than fail, so a larger matrix buys
        # less wall clock than the arithmetic suggests, silently. Raise only
        # after measuring a real run.
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build — run install_shims to create scripts/ symlinks
        # Required before pytest: install_shims() creates symlinks at
        # scripts/commit_guardian/, scripts/doc_compliance/, and
        # scripts/feedback/ pointing into .leafcutter/scripts/. Tests
        # add those paths to sys.path at import time (ADR-016).
        #
        # Paid once per shard rather than once per run. That is the intended
        # trade (runner minutes for wall clock) and it does not affect
        # correctness: each shard is an independent process tree, so
        # TQ-600a-1's "one shared layout per run" still holds within a shard.
        run: python scripts/build.py --target-dir .

      - name: Fetch the retrieval benchmark's pinned corpus commit
        # tests/kernel/retrieval scores the files of one recorded commit (`corpus_commit` in
        # benchmark_cases.json), not this checkout, so docs-only changes cannot move its
        # ratchets. The checkout above is depth 1, so fetch just that commit; without it the
        # benchmark FAILS under CI (it only skips locally).
        run: |
          PIN=$(python -c "import json; print(json.load(open('tests/kernel/retrieval/benchmark_cases.json'))['corpus_commit'])")
          git fetch --no-tags --depth=1 origin "$PIN"

      - name: Run test suite shard
        env:
          # Disable AC-enforcement xfail-masking on the gate so genuinely-failing
          # tests surface as real failures (not downgraded to xfail when their
          # covering AC is not "done"). Keeps the CI signal trustworthy — a
          # prerequisite for making this job blocking (BP-1200b).
          # (EPIC-RedTestClusterRepair ticket 09.)
          AC_ENFORCE_STRICT: "1"
        # --splits/--group come from pytest-split. Balance comes from the
        # committed durations file: WITHOUT it pytest-split falls back to
        # splitting by test COUNT, which is close to the worst choice for this
        # suite, where 60 of 7604 tests hold 63% of the clock. An unlucky
        # count-split lands most of those 60 on one shard and the matrix waits
        # for it. A stale durations file degrades balance, never correctness.
        #
        # --durations-path keeps the file out of the repo root: pytest-split
        # defaults to a root-level `.test_durations`, and this repo's
        # check-root-files commit guardian governs additions there. It lives
        # beside the only workflow that reads it instead.
        run: >
          python -m pytest tests/ unit_tests/ -q
          --continue-on-collection-errors
          --splits ${{ strategy.job-total }}
          --group ${{ matrix.group }}
          --durations-path .github/test_durations.json

  test:
    name: Test suite (pytest)
    # Aggregator. Carries the single stable check name across a matrix whose
    # size may change, so promoting the suite back to a required check is a
    # ruleset checkbox with no workflow edit. The name is deliberately the one
    # the required-check list used before 2026-10-02.
    runs-on: ubuntu-latest
    needs: [test-shard]
    # Required: without always() this job is SKIPPED when any shard fails, so
    # it would report nothing instead of failing — a green-looking absence.
    if: always()
    steps:
      - name: Fail unless every shard succeeded
        # needs.<matrix-job>.result aggregates across all legs: it is
        # 'success' only when every leg succeeded, and 'failure' / 'cancelled'
        # otherwise. Echoed before the assertion so the log names the reason.
        run: |
          echo "aggregate shard result: ${{ needs.test-shard.result }}"
          test "${{ needs.test-shard.result }}" = "success"

  done-proof:
    name: Proof-of-done coverage check (BO-2500b)
    runs-on: ubuntu-latest
    services:
      knowledge-retrieval:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/leafcutter-local-tests
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 17687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p leafcutter-local-tests 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12
      knowledge-domain:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/leafcutter-domain-tests
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 18087:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p leafcutter-domain-tests 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12
      knowledge-native:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/leafcutter-native-tests
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 18088:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p leafcutter-native-tests 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12
    # Blocking gate (BO-2500b-3): diff-scoped ci-changed mode evaluates only ACs
    # changed in the PR, making this safe to require without failing on pre-existing
    # done ACs that predate the covers-tag mandate.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so git diff <base>...HEAD is reachable.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # --- JS/TypeScript toolchain (BO-2500e-6) -------------------------------
      # The oracle recognises `// covers:` tags in .ts/.tsx tests and proves them
      # by running vitest. It fails CLOSED when the runner is unavailable
      # (BO-2500e-3-i), so the JS toolchain MUST be installed here — otherwise
      # every JS-covered AC would be judged ineligible and block the merge.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: leafcutter-web/package-lock.json

      - name: Install leafcutter-web dependencies (provides vitest)
        run: npm ci --prefix leafcutter-web

      - name: Build — run install_shims to create scripts/ symlinks
        # Required before invoking check_done_proof.py: install_shims() creates
        # the symlinks at scripts/commit_guardian/ etc. so the hook's imports
        # resolve correctly on a fresh checkout (ADR-016).
        run: python scripts/build.py --target-dir .

      - name: Run proof-of-done check (CI-changed mode)
        # --test-root . scans the whole repository so BOTH Python (`# covers:`
        # under unit_tests/) and JS/TS (`// covers:` under leafcutter-web/)
        # proofs are discovered by the one gate (BO-2500e-6). Without it the
        # default root is unit_tests/, which contains no .ts files, so every
        # JS-covered AC would be reported as having no proof. node_modules/,
        # .next/ and dist/ are excluded by the scanner.
        run: python scripts/commit_guardian/check_done_proof.py --mode ci-changed --base origin/${{ github.base_ref }} --test-root .

  reachability-guard:
    name: Reachability guard (BO-2900b-1, forward direction)
    runs-on: ubuntu-latest
    # BLOCKING — REFUSES, NOT WARNS (ADR-050 SS4): no continue-on-error on
    # this job; dropping it is the whole point (mirrors the `test` job's own
    # "NO continue-on-error" comment above). Registers the `--mode ci` half
    # of the check_done_proof.py two-layer precedent this AC's own
    # constraints name, but collected_invocations() (scripts/commit_guardian/
    # _reachability_inventory.py, re-exported from the sibling
    # _reachability_invocation_collector.py) recognises only Python
    # automation scripts today — see that module's own ROLLOUT NOTE. This
    # repository's real automation (templates/workflows-js/fast-lane-ship.js)
    # is JavaScript, and deriving the real surface/automation-script set is
    # BO-2900c-4's scope, not yet implemented. This step therefore passes no
    # --surface/--automation overrides, so check_reachability.py's own
    # no-automation-supplied default applies: it honestly reports "nothing to
    # check yet" and exits 0 every run (ADR-050 SS8), rather than
    # false-refusing every PR that touches scripts/build_orchestration/ or
    # templates/workflows-js/ against an invocation collector that cannot yet
    # read its only real caller, and rather than papering over a future real
    # finding with a downgrade flag.
    #
    # Add --surface/--automation arguments deriving the real sets once
    # BO-2900b-3 (JS invocation collection) and BO-2900c-4 (derived
    # surface/automation-script sets) land. Until then this job is a
    # structural placeholder that can never produce a false pass on a real
    # finding, because it has no real inputs — the honest exit-0 default
    # above is the sanctioned inert state (ADR-050 SS8), not a downgrade
    # flag on the job itself.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build — run install_shims to create scripts/ symlinks
        # Required before invoking check_reachability.py: install_shims()
        # creates the symlinks at scripts/commit_guardian/ etc. so the
        # hook's imports resolve correctly on a fresh checkout (ADR-016).
        run: python scripts/build.py --target-dir .

      - name: Run reachability guard (CI mode)
        run: python scripts/commit_guardian/check_reachability.py --mode ci

  ac-store-valid:
    name: AC store valid
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # BLOCKING (ACS-200g). Until this job existed, NOTHING in CI read
    # docs/acceptance-criteria/ — the AC guardrails lived only in
    # .pre-commit-config.yaml, so a contributor whose local hooks were absent
    # (see setup_ticket_worktree.py, which installs shims into the main repo
    # rather than the new worktree) could merge a structurally invalid
    # acceptance criterion with every required check green. The AC store is the
    # input to the whole build pipeline, so a bad record there propagates into
    # tickets, code and sign-offs.
    #
    # Diff-scoped to the PR (ACS-200g-2): the store currently has 57 orphaned
    # children, so a whole-store gate applied per-PR would fail every
    # contributor on day one and get switched off. Touch a broken record and
    # you own it; leave it alone and it is not your failure.
    #
    # NOT YET IMPLEMENTED — ACS-200h (whole-store run on push to main as a
    # merge-vector backstop). It is deliberately omitted rather than added
    # informationally: it would be red from the first run because of those 57
    # pre-existing orphans. Land it once the store is reconciled.
    #
    # WHY THE reset --soft: these hooks read their file set from
    # `git diff --cached --name-only --diff-filter=AM` (see
    # _get_staged_ac_paths in check_ac_schema.py) and are documented fail-open
    # — with a clean index they validate NOTHING and exit 0. In a CI checkout
    # the PR's files are committed, not staged, so `git add` is a no-op and
    # invoking the hooks with file arguments silently checks nothing. Moving
    # HEAD back to the base ref makes exactly the PR's added/modified files
    # appear staged; the working tree is untouched. Verified both ways: with
    # the reset a deliberately malformed record fails the job, without it the
    # same record passes.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so the base ref is reachable for the reset.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build — deploy .leafcutter so the guardian hooks resolve
        # install_shims() creates .pre-commit-config.yaml and the
        # scripts/commit_guardian symlink, both of which the hooks below need
        # on a fresh checkout (ADR-016).
        run: python scripts/build.py --target-dir .

      - name: Stage the PR's changes so the guardians can see them
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git reset --soft "origin/${{ github.base_ref }}"

      - name: Check AC store (PR — changed records only)
        # Run through pre-commit rather than calling the scripts directly, so
        # the merge-time and commit-time rule sets are literally the same
        # config and cannot drift apart (ACS-200i). Each hook applies its own
        # files: filter, so non-AC files in the diff are ignored.
        run: |
          pre-commit run check-ac-schema
          pre-commit run check-ac-tree-limits
          pre-commit run check-ac-governance
          pre-commit run check-ac-parent-covered-by
          pre-commit run check-ac-circular-deps
          pre-commit run check-ac-pattern-refs

  ac-store-valid-whole-store:
    name: AC store valid (whole store, push to main)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # INFORMATIONAL, NOT BLOCKING (ACS-200h). The merge-vector backstop for the
    # PR-scoped `ac-store-valid` job above. That job only ever sees the files
    # one pull request changed, and several store rules are cross-record — the
    # per-parent child limit, dependency acyclicity, the parent/child back-link
    # — so two PRs that are each individually valid can together break one, and
    # a diff-scoped check is structurally blind to it.
    #
    # WHY IT DOES NOT BLOCK, AND WHAT WOULD CHANGE THAT.
    # Measured on main 2026-09-02: this hook set reports 512 findings (437 ACs
    # missing a test_spec, 70 missing declares_side_effect, 5 contradicting it).
    # Not one was introduced by the push that would surface it — they are a
    # standing backlog that no gate has ever been able to see. Blocking on day
    # one would fail every push to main for drift nobody in that push caused,
    # and a permanently-red required gate gets switched off, which would lose
    # the backstop entirely. So it reports.
    #
    # Flip `continue-on-error` to false once the reporter prints REMAINING: 0.
    # That is a one-line change and it is the whole point of the countdown.
    #
    # NOTE the deliberate difference from `validate_ac_schema.py`: that script
    # reports the store clean today. This hook set is strictly stricter (it adds
    # the BO-2900g-2 derivation rules and the test-contract requirement), so
    # "the store validates" is true of one tool and false of the other. Do not
    # substitute one for the other when judging whether this can block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build — deploy .leafcutter so the guardian hooks resolve
        run: python scripts/build.py --target-dir .

      # WHY THIS STEP EXISTS — do not remove it as redundant.
      # Every check-ac-* hook sets `pass_filenames: false` and discovers its own
      # file set from `git diff --cached --name-only --diff-filter=AM`. So
      # `--all-files` NEVER reaches these scripts, and on a fresh checkout with
      # a clean index they validate ZERO records and exit 0 — a permanently
      # green job that inspects nothing. Verified by hand on 2026-09-02: the
      # hook reported "Passed" on a tree the real validator failed with 8
      # errors.
      #
      # `git add -A` does NOT fix this: the files are unmodified, so nothing is
      # staged and `git diff --cached` is still empty. The index must be made to
      # DIFFER from HEAD. Pointing HEAD at an empty root commit makes every
      # tracked file read as newly added — the same manufactured-diff trick the
      # PR-scoped job uses with `origin/${{ github.base_ref }}`, but with
      # nothing as the base so the scope is the whole store instead of one PR.
      #
      # Staging is scoped to docs/acceptance-criteria/ on purpose: staging
      # everything also sweeps in leafcutter-web/fixtures/docs/acceptance-criteria/,
      # which holds DELIBERATELY invalid records used as test fixtures, and the
      # job would fail on its own fixtures.
      - name: Stage the whole store so the index-driven hooks can see it
        run: |
          # `git commit-tree` WRITES a commit, so it needs a committer identity.
          # A GitHub runner has none configured, and the failure is opaque:
          # commit-tree prints "fatal: empty ident name" to stderr, substitutes
          # EMPTY into the reset, and the next line dies with the misleading
          # "ambiguous argument ''". Supplied inline with -c rather than via
          # `git config` so no repository state is mutated.
          base="$(git -c user.name=ci -c user.email=ci@localhost commit-tree "$(git hash-object -t tree /dev/null)" -m 'empty base for whole-store staging')"
          if [ -z "$base" ]; then
            echo "FATAL: could not create the empty base commit; refusing to continue." >&2
            echo "Without it the index matches HEAD and every hook would validate ZERO records and pass." >&2
            exit 1
          fi
          git reset --soft "$base"
          git reset -q
          git add -- docs/acceptance-criteria/
          staged="$(git diff --cached --name-only --diff-filter=AM -- docs/acceptance-criteria/ | wc -l)"
          echo "staged records: $staged"
          # A zero here means the hooks would inspect nothing and report green.
          # That is the exact false pass this job exists to avoid, so it fails
          # loudly rather than proceeding to a meaningless success.
          if [ "$staged" -eq 0 ]; then
            echo "FATAL: staged 0 records — the hooks would validate nothing and exit 0." >&2
            exit 1
          fi

      # Same hook set, same order, as the PR-scoped job (ACS-200i parity).
      # `|| true` per hook: this job reports the FULL backlog in one run rather
      # than stopping at the first failing rule, and its blocking posture is
      # owned by continue-on-error above, not by these exit codes.
      - name: Check AC store (whole store — every record, not diff-scoped)
        run: |
          pre-commit run check-ac-schema           > /tmp/ac-whole-store.txt 2>&1 || true
          pre-commit run check-ac-tree-limits      >> /tmp/ac-whole-store.txt 2>&1 || true
          pre-commit run check-ac-governance       >> /tmp/ac-whole-store.txt 2>&1 || true
          pre-commit run check-ac-parent-covered-by >> /tmp/ac-whole-store.txt 2>&1 || true
          pre-commit run check-ac-circular-deps    >> /tmp/ac-whole-store.txt 2>&1 || true
          pre-commit run check-ac-pattern-refs     >> /tmp/ac-whole-store.txt 2>&1 || true

      # Groups findings by the component that owns them and states one
      # finishable ask, because a 512-line dump is scrolled past rather than
      # acted on.
      - name: Report the backlog by owning component
        run: python scripts/ac_store/whole_store_report.py --input /tmp/ac-whole-store.txt

  numbering-guarantee-valid:
    name: Numbering guarantee valid (GE-122d-1)
    runs-on: ubuntu-latest
    # Shared-build stage for GE-122's whole-collection numbering rule
    # (GE-122d-1). This is a SEPARATE job from ac-store-valid on purpose:
    # test_acs200i_ac_gate_rule_parity.py asserts ac-store-valid runs ONLY
    # hooks scoped to the docs/acceptance-criteria/*.yaml files: pattern in
    # the manifest, and check-identifier-uniqueness is not one of them (it
    # is always_run / pass_filenames: false, scoped to the whole collection,
    # not to AC YAML files) — folding it into that job would break that
    # parity guard.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so the base ref (PR) / pre-push SHA (push)
          # is reachable for the reset below — same requirement as
          # ac-store-valid, and for the same reason (see the staging steps).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build — deploy .leafcutter so the guardian hooks resolve
        run: python scripts/build.py --target-dir .

      - name: Stage the PR's changes so a contested number is attributed (PR)
        # WHY THE reset --soft: this hook's *inspection* is genuinely
        # whole-collection and always_run: true / pass_filenames: false at
        # the pre-commit level — that half of the old comment here was
        # correct. What it missed is that the hook's EXIT CODE is not
        # whole-collection: main() (check_identifier_uniqueness.py) calls
        # _get_staged_paths() (`git diff --cached --name-only`) and, via
        # compute_commit_disposition, blocks ONLY on a finding with a
        # claimant in that staged set — every other finding is printed as
        # "reported-but-unattributed ... not blocking" and the hook exits 0.
        # In a CI checkout the PR's files are committed, not staged, so with
        # no reset the staged set is genuinely empty (git ran fine — this is
        # not the "could not be determined" fallback path) and EVERY
        # contested number, including one the PR itself introduces, comes
        # back unattributed. Moving HEAD back to the base ref makes exactly
        # the PR's added/modified files appear staged, the identical
        # technique ac-store-valid already documents for the AC guardrails
        # and the technique this AC's (GE-122d-1) own it_requirements names
        # explicitly. Verified both ways in a scratch clone: with the reset,
        # a deliberately contested ADR number introduced by the diff fails
        # the job (exit 1); without it, the same collision passes (exit 0).
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git reset --soft "origin/${{ github.base_ref }}"

      - name: Stage the push's changes so a contested number is attributed (push)
        # Same requirement as the PR step above, for a direct push to main:
        # reset to the pre-push SHA (github.event.before) so the commit(s)
        # just pushed appear staged and a contested number introduced by the
        # push is attributed rather than silently reported-but-unattributed.
        if: github.event_name != 'pull_request'
        run: git reset --soft "${{ github.event.before }}"

      - name: Check numbering uniqueness (GE-122d-1 shared-build stage)
        # Run through pre-commit rather than calling the script directly, so
        # the shared-build and commit-time rule sets are literally the same
        # config and cannot drift apart (same technique the ac-store-valid
        # job already uses for the AC guardrails, per this AC's
        # it_requirements).
        run: pre-commit run check-identifier-uniqueness

  changelog-presence:
    name: "Changelog entry present"
    runs-on: ubuntu-latest
    # Blocking release-completeness gate: fails when a PR changes releasable
    # content (files outside of changelogs/, tickets/, docs/acceptance-criteria/)
    # but adds no changelogs/*.md entry. Without this gate, releasable work can
    # merge without triggering the auto-release version bump in compute_next_version.py.
    # Runs ONLY on pull_request — on direct pushes to main a changelog entry is
    # already expected to be present (it was required before merge).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so git diff <base>...HEAD is reachable.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # No pip install step: check_changelog_presence.py is stdlib-only.

      - name: Fetch base branch for three-dot diff
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Check changelog presence
        run: python scripts/release/check_changelog_presence.py --base "origin/${{ github.base_ref }}"

  typecheck:
    name: Type-check changed files (mypy, informational)
    runs-on: ubuntu-latest
    # Informational only — see header. Surfaces type findings without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the PR base commit to diff against.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: mypy on changed Python files
        # On push events github.base_ref is empty and this becomes a no-op.
        if: github.event_name == 'pull_request'
        run: |
          # No --depth on this fetch, on purpose (same as changelog-presence).
          # The checkout above has full history; --depth=1 would make the clone
          # shallow again at the base branch's tip. Once the base has moved past
          # this PR's merge base, the three-dot diff below then fails with
          # "fatal: origin/main...HEAD: no merge base" (exit 128) and mypy never
          # runs. Seen on PR #985 (run 37006254096); fixed 2026-10-02.
          git fetch --no-tags origin "${{ github.base_ref }}"
          # KI-BP-20260831-0620: git pathspec '**/*.py' does NOT match files directly
          # inside the named directory (e.g. scripts/build.py) -- only files at least
          # one level deeper. The 'dir/*.py' forms alongside the existing 'dir/**/*.py'
          # forms are required so top-level scripts are not silently excluded from
          # mypy, which previously reported SUCCESS while never seeing 64 of 123
          # tracked scripts, including scripts/build.py.
          CHANGED=$(git diff --name-only --diff-filter=ACM "origin/${{ github.base_ref }}"...HEAD -- 'scripts/*.py' 'scripts/**/*.py' 'tests/*.py' 'tests/**/*.py' 'unit_tests/*.py' 'unit_tests/**/*.py' 'knowledge/*.py' 'knowledge/**/*.py' 'integrations/*.py' 'integrations/**/*.py' 'kernel/*.py' 'kernel/**/*.py')
          if [ -z "$CHANGED" ]; then
            echo "No changed Python files under scripts/, tests/, unit_tests/, knowledge/, integrations/, or kernel/ — skipping mypy."
            exit 0
          fi
          echo "Type-checking changed files:"
          echo "$CHANGED"
          # --explicit-package-bases avoids "source file found twice" errors from
          # the flat sys.path-based layout (scripts/ is not an installed package).
          mypy --ignore-missing-imports --explicit-package-bases --no-error-summary $CHANGED

  consumer-install-sim:
    name: Consumer install simulation (BP-900h-1)
    runs-on: ubuntu-latest
    # INFORMATIONAL ONLY for now — see header. This is NOT yet a required/
    # blocking branch-protection check (that promotion is BP-900h-3, a
    # separate ticket). Runs on both push and pull_request: the job's logic
    # is identical either way, so no `if:` guard is needed to satisfy the
    # AC's "must run on pull_request" requirement.
    steps:
      # Checked out into leafcutter-ai/ beneath the job's default working
      # directory (github.workspace), simulating a real consumer install: the
      # scratch directory contains nothing but this checkout until the script
      # below writes a minimal skills_config.json into it.
      - uses: actions/checkout@v4
        with:
          path: leafcutter-ai

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r leafcutter-ai/requirements-dev.txt

      - name: Run consumer install simulation
        # All job logic lives in check_consumer_install.py; this step supplies
        # only arguments (mirrors the constraint already written into sibling
        # AC BP-900h-6 for merge-gate tooling). --target-dir . is
        # github.workspace itself, which holds only the leafcutter-ai/
        # checkout at this point.
        run: python leafcutter-ai/scripts/ci/check_consumer_install.py --package-dir leafcutter-ai --target-dir . --use-install

      - name: Check declaring files resolve from the deployed output root
        # AC BP-900h-4. .leafcutter is the deployed output root the step
        # above just built as a sibling of the leafcutter-ai/ checkout.
        # Non-zero here is a real, load-bearing failure — this step
        # deliberately carries no continue-on-error.
        run: python leafcutter-ai/scripts/ci/check_declaring_files.py --deployed-root .leafcutter

      - name: Check declaring files resolve across every install layout
        # AC BP-900h-4-i. Layout (a) — the prescribed leafcutter-ai/ package
        # directory name, main checkout — is this job's own already-built
        # install; the layout-set config names it as one entry so this same
        # multi-layout entry point (never a second, single-layout-only path)
        # covers the self-hosted-shape control this job already stands up.
        # Non-zero here is likewise load-bearing; no continue-on-error.
        run: |
          python -c "import json; json.dump([{'layout': 'prescribed-name', 'deployed_root': '.leafcutter', 'package_dir_name': 'leafcutter-ai', 'is_worktree': False}], open('layout_set.json', 'w'))"
          python leafcutter-ai/scripts/ci/check_declaring_files.py --layout-set layout_set.json
