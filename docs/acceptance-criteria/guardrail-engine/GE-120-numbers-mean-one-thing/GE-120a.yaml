criteria: |
  One number, one thing — never two things wearing the same number.

  Whichever kind of work you are numbering — a requirement, a ticket, a recorded
  decision, a diagram — the number you give it is yours alone, and looking it up
  always lands on a single, unambiguous piece of work. Two unrelated things can
  no longer end up sharing a number, and one piece of work can no longer exist as
  two copies of itself that disagree about where it stands.
