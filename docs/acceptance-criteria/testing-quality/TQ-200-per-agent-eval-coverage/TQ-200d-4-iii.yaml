    relationship: modifies
    status: exists
    relevance: >-
      Sections changed: '## Output: Success' (PASS only with a passed-test count above zero quoted from
      the runner's own summary); a new '## Output: No Test Ran' section placed after it (says no test
      ran, quotes the command, gives the reason: nothing collected, or no runner summary); '## Combined
      Output (action: all)' (Status column vocabulary PASS / FAIL / NO TEST RAN); '## Machine-Parsed Dispatch
      Output Contract' ('passed' is false when no test ran, with the reason in 'anomalies'); '## Completion
