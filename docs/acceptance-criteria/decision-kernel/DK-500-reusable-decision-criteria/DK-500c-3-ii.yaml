id: DK-500c-3-ii
title: Retiring a broader category requires its narrower categories to point somewhere live
component: decision-kernel
components:
- decision_kernel
level: L3
status: active
readiness: approved
req_status: draft
priority: high
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given cat-6c3eb4f2af148922 has been published with cat-d6ce5f78c181ebd1 as its broader category,
  When a person merges or splits cat-d6ce5f78c181ebd1 and publishes the change without changing cat-6c3eb4f2af148922,
  Then the publish is refused, naming cat-6c3eb4f2af148922 and its retired broader category,
  And when the same change also sets the broader category of cat-6c3eb4f2af148922 to a live replacement, or to none, the publish succeeds.
depends_on:
- DK-500c-3
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500c-3
  contract: Merge, split and retire through stage and publish.
change_target: code
risk_surface: internal
it_requirements:
- Publish refuses any change that would leave a staged or published category whose broader points at a category retired by the same or an earlier change, naming the narrower category and its retired broader.
- Re-pointing broader to a live replacement, or to none, in the same publish is accepted.
test_required: true
test_spec:
- name: test_retiring_broader_without_repointing_refused
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Merging or splitting cat-d6ce5f78c181ebd1 without changing cat-6c3eb4f2af148922 is refused, naming both.
- name: test_repointing_to_replacement_or_none_succeeds
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: boundary
  description: The same change that also sets cat-6c3eb4f2af148922's broader to a live replacement, or to none, publishes.
test_rationale: Exercise the review run and the publish command through their public CLI and RunService boundaries on a temporary repository copy and run root; assert staged files, published files, exit codes and byte-level before/after snapshots of docs/decisions/. Model-level unit tests alone would not prove that nothing is written outside the staged area or that publish is all-or-nothing.
