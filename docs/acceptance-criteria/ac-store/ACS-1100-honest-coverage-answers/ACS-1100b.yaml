documentation_rationale: >-
  The reference documentation for this L1's method record and its list of legitimate
  exclusion grounds is written by ACS-1100e-1, a single consolidated reference-doc AC
  covering all four behavioural L1s. Four separate per-L1 reference-doc ACs (the former
  ACS-1100a-4, ACS-1100b-3, ACS-1100c-3 and ACS-1100d-3) all wrote sections of the same
  file, docs/reference/ac-schema.md, and would have been serialised by the build's
  file-touch parallelism gate into four sequential tickets editing one file.
  Documentation is required and is delivered — by ACS-1100e-1, not by a child of this L1.
