criteria: |
  Given the runtime source directory contains 5 hook scripts:
    - check_alpha.py
    - check_beta.py
    - check_gamma.py
    - check_delta.py
    - run_hook.py
  And the canonical template directory contains only 4 of those scripts:
    - check_alpha.py
    - check_beta.py
    - check_gamma.py
    - run_hook.py
  (check_delta.py is absent from the canonical template directory)
  When the parity check runs at pre-commit time
  Then the commit is blocked with exit code 1
  And the error message names "check_delta.py" as missing from the canonical template directory
  And the error message states the expected location where the file should exist
