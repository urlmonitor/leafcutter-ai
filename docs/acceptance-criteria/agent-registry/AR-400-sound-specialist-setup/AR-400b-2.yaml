id: AR-400b-2
title: "Every way the package's instructions actually phrase 'use this ability' is recognised as an instruction"
component: agent-registry
components:
  - agent_registry
  - skills_system
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a test specialist "probe-agent" that grants nothing, and whose
    instructions contain exactly these eight lines, each naming a different
    existing ability a1..a8:
      1. "Load `.claude/skills/a1/SKILL.md` and follow it."
      2. "Invoke the `a2` skill before writing."
      3. "Skill: a3" (an ability-tool call written out)
      4. "| Question | `.claude/skills/a4/SKILL.md` -- invoke via `Bash` |"
      5. "Run the a5 skill on every new file."
      6. "Resolve and load the a6 skill (read it in full before editing)."
      7. "Apply the `a7` skill before writing the file."
      8. "Step 1 -- Load the A8 Skill" (a heading, different letter case)
  When the build runs,
  Then the build stops with exactly eight findings, one per line, each naming
    "probe-agent", the ability and the line,
    And line 8's finding names the ability by its real identifier "a8",
    And a ninth line "The a9 skill's output is a table." -- naming an existing
      ability without telling the reader to use it -- produces no finding.
depends_on:
  - AR-400b
