criteria: |
  Given knowledge-map surfaces that are declared through registries — the agent
    registry, the skill registry, and the roadmap — each of which declares a
    component-membership relationship, and one surface (the glossary) that declares
    no component-membership relationship
  When an entry in a membership-declaring surface is added or changed while its
    component membership is absent or empty
  Then that change is flagged and blocked with a message naming the entry and
    stating that a component membership must be declared
  And an entry in a membership-declaring surface whose component membership names a
    component present in the registry passes
  And a change to the glossary surface, which declares no component-membership
    relationship, is not subject to this rule
