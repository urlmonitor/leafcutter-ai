notes: |
  The enforceability half of BP-1100g-5. Without it the parent states a shape
  nobody has to produce, which is the same silence GAP F is about.

  WHY FOUR RECORDS AND NOT TWO. The three failure shapes are distinct and an
  implementation commonly gets one or two: absent is caught by a presence check,
  reasonless needs the reason to be required rather than merely allowed, and
  answered-twice needs cardinality rather than presence. BO-1000b-1-i shipped
  exactly the third defect and its test was structurally blind to it. Naming all
  three, alongside a valid record that must NOT be reported, makes the scenario
  adversarial rather than illustrative.

  THE THIRD CLAUSE IS THE ANTI-GREP CLAUSE, carried forward from BO-2900f's
  standing instruction. A test that asserts "the writing side was told to answer"
  passes on an implementation that never records anything. Assert over the
  records the run emitted.

  THE FOURTH CLAUSE BOUNDS THE RULE THE WAY BO-2900f-2-i BOUNDS ITS CARVE-OUT. A
  run that never reaches a piece of work has produced no record for it, and
  reporting that as a reasonless answer generates false shortfalls, whose natural
  remedy is to weaken the check until they stop. No record and a bad record are
  different states.

  IT-PO CAVEAT (2026-08-17) — change_target IS WRONG ON THIS AC. It reads
  `prompt`, inherited from the parent BP-1100g-5, but every Then clause here
  describes a mechanical reader over emitted hand-off records: reporting three
  named shortfall classes, counting answers per work item, and distinguishing no
  record from a bad record. That is code, and the assigned agent is python-coder.
  change_target is a BA/PO axis (it drives guardrail_gates agent routing), so it
  has NOT been changed during enrichment. RECOMMENDED FIX for the user to apply:
  set `change_target: [code]` (or `[prompt, code]` if the reader's output wording
  is also to be authored in a template). Left as-is, guardrail_gates will route
  this AC's ticket as a prompt change and will not mandate architect-review /
  test-runner.

  IT-PO ENRICHMENT NOTE. Verified during enrichment: completion_manifest has zero
  code readers anywhere under scripts/ — it is parsed only by the supervisor. The
  natural host, _signoff_parity_checks.py, parses ## Sign-offs but not the
  ## Comments manifest block, so the parser is new work rather than a widening.
  declares_side_effect is true: the shortfall report is user-facing commit-time
  output.
