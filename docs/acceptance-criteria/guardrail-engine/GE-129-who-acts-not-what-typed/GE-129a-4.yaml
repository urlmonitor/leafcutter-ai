notes: |
  PLACEMENT (coordinator instruction, Q3): under GE-129a because it fits the 5-L2 cap. The
  cap forced a trade -- see GE-129a-5's notes: GE-129a's reference-doc trigger is discharged by
  GE-129e-2 and GE-129e-4 rather than by a sixth L2 here.

  WHY (e). A duplicate is declared by the name inside the definition, not by the file name. A
  check that only looks for a second commit.md passes (c)/(d) in the usual layout and misses (e).

  WHY THE LAST CLAUSE. A check that stops at the first duplicate satisfies "fails" for (c)-(e).
  The varying-population clause is the only form a first-hit implementation cannot meet.

  DECIDED 2026-09-17 (user, defaults accepted).
    - WHEN IT RUNS: at session start in the developer's environment AND at install. User scope and
      plugin definitions live outside the repository, so a commit-time check on a CI machine
      cannot see (c) or (d); both points are required.
    - CUSTOMISATION: a project may customise its commit specialist only with a recorded exemption.
      Without one, any divergence (b) is a failure, matching the user's "flags a divergent
      definition".
    - The stated limit (GE-129e-4): this narrows, but does not close, the gap for someone who can
      write agent definitions.
  Both decisions are now pinned by scenarios (2026-09-17 amendment): run points in GE-129a-4-i,
  the exemption in GE-129a-4-ii. Case (b) here is qualified "no exemption" so the two agree.

  declares_side_effect: false -- the Then clauses assert a pass or a failure with named findings.
