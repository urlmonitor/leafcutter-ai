risk_surface: internal
notes: |
  WHY THIS EDGE IS WORTH A CRITERION. An empty demand and a waiver produce the
  same work item, and only one of them is a decision. If emptying the list were
  accepted, the loss this whole L1 exists to prevent would simply move upstream
  from the generator into the record itself — same silence, one layer earlier,
  and with the author's name on it.

  ENFORCEMENT IS NOT SINGLE-SOURCED IN THIS REPO. The schema reference notes that
  field validation runs in more than one place and that a rule added to only one
  of them is sometimes a no-op. A refusal added to the machine-readable schema
  alone would pass in exactly the environments where the fallback validator is
  what actually gates.

  IT-PO NOTE 2026-08-25 — THE DECLARATIVE HALF MAY ALREADY BE IN PLACE. The
  machine-readable schema already declares a minimum of one statement for an
  authored demand, so descriptor 1 may be green from the outset. That is a
  regression pin, not a discharge of this AC: the red baseline for this work is
  descriptors 2 and 4, on the enforcement path that gates and on the generation
  path that can be reached without validating at all.
