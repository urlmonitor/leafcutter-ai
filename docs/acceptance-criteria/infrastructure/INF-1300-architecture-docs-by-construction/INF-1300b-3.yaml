it_requirements:
  - "THE TWO STATES MUST BE MACHINE-DECIDABLE FROM THE DOCUMENT ALONE. Every line of the produced document falls into exactly one of produced-and-closed or open-prompt, and which one must be determinable by reading the document with no reference to a freshly produced copy, no diff, and no external manifest. A line in neither state, or in both, is a failure."
  - "THE PROMPT MARKER MUST BE UNAMBIGUOUS AND MUST SURVIVE THE CHECKS. It must be a form that check_doc_frontmatter, check_diagram_naming, check_mermaid_parent_link, check_mermaid_complexity, check_description_field and check_surface_components_e2 all tolerate in an unreplaced document — because an author will stage a partially filled document at least once — while still being detectable. Note the measured constraint on where it may NOT sit: check_doc_frontmatter BLOCKS on any entry in related_docs, related_code or architecture_diagrams that does not resolve on disk, so a prompt placed in a path-valued field converts an acceptable document into a refused one."
  - "THE THIRD CLAUSE IS A STRUCTURAL CLAIM, NOT A LABELLING ONE, AND IT IS THE ARM WITH TEETH. Requiring that an author who fills every prompt and changes nothing else still passes every check constrains WHERE the prompts sit: filling a prompt must not be able to break the frontmatter, the filename-to-tier agreement, the parent link, or a per-kind complexity threshold. In particular the prompts inside the mermaid skeleton must leave headroom under check_mermaid_complexity's per-family thresholds after realistic content is added — a skeleton that is at the threshold when empty fails this clause the moment it is completed."
  - "EACH PROMPT SAYS WHAT BELONGS IN THAT PLACE, NOT MERELY THAT SOMETHING DOES. A single repeated marker in every open place satisfies the partition clauses completely and tells the author nothing, returning them to copying a sibling — the propagation failure this tree exists to end. Falsifiable form: no two prompts within one document are textually identical, and each names the subject of the section it sits in."
  - "MEASURED — ONE FIELD FORCES AN EXPLICIT DECISION HERE. `description:` is required on every `docs/**/*.md` by check_description_field, is omitted from SKILL.md section 6's frontmatter checklist, and is satisfied by any non-empty string. So a prompt left in it passes the hook while the document is incomplete, and a constant stub in it passes both the hook and a careless reading of INF-1300a-3. Decide and record which of the two states that field is in; the decision must be consistent with INF-1300a-3's no-placeholder clause."
  - "THE FILL MUST BE REALISTIC, NOT TOKEN. Replacing each prompt with a single word proves nothing about the complexity thresholds or the field length limits; replace with content of the length a real author would write."
  - "The partition and the fill-and-check must be performed on a PRODUCED artifact, never on the emitter's source or a fixture. All of INF-1300a-1's vacuous-green guards apply to the check run over the filled document."
  - "Error handling per the project error-handling policy (CLAUDE.md rules 1-4)."
