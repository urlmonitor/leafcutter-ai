      - a ratchet that treats an empty list of live children as no unproven child without asking the gate rule
  - name: test_test_paths_in_covered_by_are_not_read_as_children
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: discrimination
    description: "A finished L1 whose covered_by lists one proved AC-id child plus a test file path leaves the count, and the path is never looked up as a child or as a live record needing listing; a covered_by holding only test paths is a leaf and stays counted when untagged."
    proves_clause: 'the composite leaves the count under the ground "proved through its children (tags read, tests not run)" only when all three of these hold: (a) the done gate''s own composite rule, looked up when the ratchet runs and given the set of ids tagged by the done gate''s own covers-tag pattern, finds no unproven child; (b) its covered_by is complete: every live (not superseded) record on disk whose parent is this record is listed in it; (c) it is level L0 or L1, or its change_target is exactly "docs"'
    code_file: scripts/ac_store/untagged_done_count.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_km_adm_005_1_untagged_done_count.py
    must_catch:
      - test paths read as children, so a path entry is judged unproven or counted as a child
      - a ratchet that treats any non-empty covered_by as a composite
  - name: test_gate_tag_set_is_built_from_the_ratchets_test_roots_not_the_repo_root
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: discrimination
    description: "A child tagged only in a file outside the passed test roots, or only in a .js file the gate collector does not read, does not prove its parent; the same tag inside a passed root as a .py file does."
    proves_clause: 'the composite leaves the count under the ground "proved through its children (tags read, tests not run)" only when all three of these hold: (a) the done gate''s own composite rule, looked up when the ratchet runs and given the set of ids tagged by the done gate''s own covers-tag pattern, finds no unproven child; (b) its covered_by is complete: every live (not superseded) record on disk whose parent is this record is listed in it; (c) it is level L0 or L1, or its change_target is exactly "docs"'
    code_file: scripts/ac_store/untagged_done_count.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_km_adm_005_1_untagged_done_count.py
    must_catch:
