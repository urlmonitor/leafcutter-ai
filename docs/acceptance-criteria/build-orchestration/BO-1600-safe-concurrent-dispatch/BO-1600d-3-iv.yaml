title: "Branch-ref reset targets the detected default/current branch, never a hardcoded main"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1600-safe-concurrent-dispatch/BO-1600d.yaml"
criteria: |
  Given the corrupt branch ref belongs to a branch whose name is not "main" (for
    example a repository whose default branch is "master" or a drive on an epic
    branch "EPIC-Foo")
  When the recovery step engine performs the reset-corrupt-branch-to-reflog-tip action
  Then it resets the reflog tip of the actual affected branch — detected at runtime
    from the corrupt ref / current HEAD / repository default branch — and never
    resets a hardcoded "main" or "master"
  And if the affected branch cannot be determined unambiguously, it stops and reports
    that it could not identify the branch to reset rather than guessing
