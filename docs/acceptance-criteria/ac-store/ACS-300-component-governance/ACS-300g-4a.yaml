id: ACS-300g-4a
title: "Write tooling Python script for adding component entries to the registry"
component: ac-store
level: L2
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given a caller provides a component definition as structured input
    (id, name, type, description, primary_code, detail_ref, status),
  When the write tooling script is invoked with that definition,
  Then a new entry is appended to docs/components.json under the components object,
  And the resulting JSON is valid (parseable, no duplicate keys),
  And the output preserves existing entries unchanged,
  And the script exits with a non-zero code if the component ID already exists
    (preventing silent overwrites).

  The script is a standalone Python script that reads the current components.json,
  validates the new entry against the schema, appends it, and writes
  the file back with consistent formatting (2-space indent, sorted keys).
depends_on: [ACS-300g-1]
doc_links:
  - path: docs/components.json
    relationship: governs
    status: exists
  - path: docs/build-pipeline.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Must preserve existing entries byte-for-byte (field values and order unchanged)"
  - "Must validate new entry against the same schema enforced by check_components_integrity.py"
  - "Must write JSON with consistent formatting (2-space indent, sorted keys) for deterministic diffs"
  - "Must be idempotent on re-runs with the same input (reject duplicate, not corrupt)"
  - "Must handle errors gracefully per the project error handling policy"
  - "Must complete in <2s for a components.json with up to 100 entries"
delivers_to:
  agent: llm-expert
  contract: "A working Python script at scripts/components/add_component.py (or similar path) that accepts structured input (id, name, type, description, primary_code, detail_ref, status) and appends a validated entry to docs/components.json. Exit 0 on success, exit 1 on duplicate or validation failure with descriptive stderr."
