it_requirements:
  - "Must document the settled configuration surface concretely: the `testing_quality.enforcement_mode` key in commit_guardian.json AND the LEAFCUTTER_TEST_ENFORCEMENT_MODE env override (env takes precedence), the three valid values (report-only | exclude-unbuilt | blocking), and the no-config safe default of report-only."
  - "Must state precisely what each mode does to the run outcome (report-only = surface all/block none; exclude-unbuilt = exclude not-done-feature tests; blocking = enforce done-AC and untagged tests), and what happens to a now-failing run when a maintainer switches modes."
  - "Reference doc (lookup-oriented), authored to pass the repo's doc-frontmatter / doc-length / doc-type commit hooks; place under docs/ where a fresh consumer install can reach it (ADR-001), consistent with the parent L1's reference-doc trigger."
