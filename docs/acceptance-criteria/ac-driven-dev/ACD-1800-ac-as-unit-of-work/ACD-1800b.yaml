notes: |
  CONCEPT A (part 2). Per-deliverable sign-offs move from the ticket body onto the
  AC, and AC-level "done" is computed from them. SUPERSESSION INTENT: this replaces
  the sign-offs-in-ticket clause of ACD-400b-4 ("## Sign-offs section contains
  exactly the needed agents") -- sign-offs now live on the AC, not the ticket. Do
  NOT edit ACD-400b-4 here; governance records the supersession separately (ACD-400b-4
  already carries a partial-supersession note anticipating this). Anti-phantom-done
  motivation: this is the mechanism that makes "done" mean genuinely done.

