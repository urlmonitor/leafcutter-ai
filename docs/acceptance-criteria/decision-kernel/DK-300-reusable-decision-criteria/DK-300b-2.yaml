notes: |
  PENDING METHOD (DK-300b): the grouping method is being decided in kernel run
  run-b5af8c7fae2248ba after a Jev trial. This record is method-neutral by design.
  USER RULE (b), settled: a wrong merge is worse than a missed merge, so favour precision. A missed merge is recoverable (it stays a candidate and DK-300c-3 can merge it later); a wrong merge silently weighs two concerns as one.
  EVIDENCE USED ONLY TO MAKE THIS CONCRETE (not a method choice): a live Jev trial asked "which existing category asks the same question, or none?" for 82 wordings against 7 categories. At p>=0.8: 100% precision, 55% recall; at p>=0.7: 94% precision, 68% recall; at p>=0.5: 78% precision, 82% recall. The false merges were mostly compound criteria that bundle two questions (DK-300b-2-i). Caveats from the trial: the gold set is LLM-drafted mock data approved as mock data, the sample is small, one run at one seed.
  Pending with the method decision: whether the labelled set is this trial's or a person-reviewed one, whether a numeric precision floor or a minimum recall applies, and what "acceptance setting" means for a method with no confidence (a deterministic method offers one setting).
  FLOW BACK-LINK (for step.implements, to be applied by the store owner): leafcutter/criteria-library: suggest-grouping.
