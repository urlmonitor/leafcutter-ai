id: BP-900h-5-ii
components:
  - build_pipeline
title: "Every executable the package deploys is started in the consumer install, not only the ones a registry names"
component: build-pipeline
level: L3
status: active
req_status: active
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900h-5.yaml"
criteria: |
  Given the consumer-layout install of BP-900h-4 and the three-way outcome of BP-900h-5,
  And the set of executables the build places into that install — DERIVED by walking the
    deployed output root itself, and NOT filtered to the entries any registry declares,
  When each of those executables is started in a fresh operating-system process launched
    from the deployed layout, with the package's source tree absent from the interpreter's
    module search path,
  Then each one reaches its entry point,
  And an executable that instead stops before its entry point because a module, helper, or
    data file it needs is not present in the deployed layout is recorded as unable to run —
    the same third category BP-900h-5 establishes, never as a failure of the input — and is
    named together with the dependency it could not resolve and the deployed location it
    looked in,
  And the job's conclusion is failing when any deployed executable is unable to start, with
    the same force as when a registered guardrail is unable to run,
  And the exercised set is derived from the deployed tree, so an executable deployed
    tomorrow is started tomorrow without anyone editing a list — demonstrated by deploying a
    new executable whose dependency is withheld and requiring the job to go red with no
    change to the harness,
  And the set is explicitly NOT narrowed to the guardrail registry, because the executable
    an adopter runs from the command line and the helper another deployed executable imports
    are both shipped and neither is registered anywhere the harness could read,
  And the proof is that the executable STARTS, not that its file is present: asserting the
    file exists in the deployed tree does not satisfy this criterion, and neither does
    importing the module from the package's source tree, which contains every sibling by
    construction and is therefore structurally incapable of failing,
  And the proof is a genuinely cold process: re-importing a module inside an interpreter
    that has already imported it does not satisfy the fresh-process clause, because it
    re-executes inside an already-populated namespace and cannot observe a first-import
    failure,
  And an executable the harness declines to start — because starting it would do real work,
    or because it needs arguments or environment the harness cannot supply — is reported as
    not exercised, with the reason, and counted against the derived set, so the number
    started plus the number reported unexercised equals the number deployed and a silent
    skip cannot be mistaken for a pass,
  And adding a named module to the deploy declaration does not satisfy this criterion: the
    harness must be shown to go red on a tree where a dependency of an already-deployed
    executable is withheld, whichever dependency that is.

  Because on 2026-08-25 an adopter running the AC-store schema validator from a genuine
  consumer install got an unhandled import failure naming a helper module. The validator
  itself IS deployed — the deploy list was corrected for it — and two modules it imports at
  module scope are not, so the executable ships and cannot start. That is the fifth
  occurrence of one failure mode: four other modules were each added to the same
  hand-maintained deploy list after each one shipped broken, and several of that list's
  entries now carry a comment explaining why that particular module must not be forgotten.
  A list that needs a warning per entry is not a mechanism; every prior fix was an entry,
  and the entry after this one is already unwritten. Every existing test imports these
  modules from the source tree, where the siblings resolve by construction, which is why all
  five occurrences were green until an adopter ran the command.
