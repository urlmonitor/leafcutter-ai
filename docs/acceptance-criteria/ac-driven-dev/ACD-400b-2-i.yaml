work_status: todo
criteria: |
  Given an AC YAML file has multi-line criteria with block scalar (|) syntax,
    comments, and specific field ordering,
  When the generator writes the implemented_by back-reference,
  Then the resulting file diff shows ONLY the implemented_by field changed
    (no field reordering, no quoting style changes, no whitespace reformatting),
  And the YAML remains parseable by yaml.safe_load after the write,
  And if the implemented_by field was previously an empty list ([]),
    it now contains exactly the one new ticket path entry.
