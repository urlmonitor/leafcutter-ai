description: Decide when the Leafcutter decision kernel may publish an approved decision record into ...
decision_type: design
question: 'Decide when the Leafcutter decision kernel may publish an approved decision record into docs/decisions by itself
  and when it must ask the user first, recorded as a policy decision file. Today publishing is an explicit human-run command
  (ADR-060) and every record is human-approved. Options: always ask the user before publishing; publish directly unless the
  decision supersedes or corrects an existing record or changes an accepted ADR or policy, and ask otherwise; or another option
  grounded in the repository.'
