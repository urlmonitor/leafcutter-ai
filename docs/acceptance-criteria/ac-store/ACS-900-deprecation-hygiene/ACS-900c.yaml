notes: |
  Message-quality AC, modeled on the ACS-400e-1 house style (the block message
  must name the AC id, the offending file path(s), the violated rule, and the
  remedy). BA/IT-PO: the actionable message should distinguish the two remedies —
  (a) remove the orphaned code, or (b) for a superseded_by retirement, re-point
  implemented_by to the successor AC named in superseded_by. Keep the message on
  the channel the committing agent actually receives (per ACS-400e-1, write to
  stdout, not only stderr).
