notes: |
  BOUNDARY WITH ACD-1300e-3-i. That sibling pins that an UNWRITABLE store is reported as a
  store write, not as a refusal. This record's headline case is the one nobody owns: the write
  REPORTED SUCCESS and the read-back still found nothing. Without the write's reply in the
  report, that case is indistinguishable from the other three, which is exactly why the
  2026-10-22 occurrence could not be diagnosed. The store-write-failed arm is kept only to pin
  that the write's own error output is QUOTED (the sibling requires only that the cause is
  named).

  CONSISTENCY WITH ACD-2100a-4 ("the write is reported as failed if and only if no record is on
  disk"): every arm here is a no-record-on-disk case, so all of them are failures; none
  reports a pause as failed while a record exists.

  The "claims no read-back result for a read-back that was not sent" clause is there so the
  report is correct whether or not the IT PO keeps the read-back after a declined write
  (ADR-070 sec. 5.3 says no later step is dispatched after a decline; ACD-1300e-3 says the
  read-back decides). Either is acceptable; a report that invents a read-back result is not.
