id: KM-400d-4-i
title: "Cold retrieval fits the default deadline when the graph host's IPv6 name lookup stalls"
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: done
parent: KM-400d-4
criteria: |
  Scenario: IPv4-first lookup inside the graph adapter's own calls (default)
  Given LEAFCUTTER_NEO4J_ADDRESS_FAMILY is unset
  And the name resolver answers IPv4-only lookups for every graph server name in 0.05 s
  And the same resolver takes 15 s to answer any lookup that also asks for IPv6 addresses
  And the routing table names a second server (the reader) whose name differs from the configured server name
  When a fresh process runs one knowledge retrieve request with the default deadline_ms of 10000
  Then the request returns status ok with its evidence
  And stats.duration_ms is below 10000
  And both server names (configured server and reader) were looked up IPv4-first

  Scenario: fallback to the normal lookup when the IPv4 lookup fails
  Given LEAFCUTTER_NEO4J_ADDRESS_FAMILY is unset
  And the resolver reports "no such address" for the IPv4-only lookup of the graph server name
  And the normal lookup (any address family) of that name returns an IPv6 address
  When a fresh process runs one knowledge retrieve request
  Then the adapter connects using the address from the normal lookup
  And the request is not reported unavailable because of the failed IPv4 lookup

  Scenario: lookups outside the graph adapter's own calls are unchanged
  Given LEAFCUTTER_NEO4J_ADDRESS_FAMILY is unset
  And the graph adapter has been created in a process that also runs other network clients
  When code outside the graph adapter's own calls looks up a name, on the same thread or another thread, including the graph server's own name
  Then that lookup asks for the address family the caller requested, with no IPv4-first step
  And its result is not served from the adapter's remembered lookups

  Scenario: opt-out restores the normal lookup
  Given LEAFCUTTER_NEO4J_ADDRESS_FAMILY is set to "any"
  When a fresh process runs one knowledge retrieve request
  Then every graph server name lookup asks for any address family, exactly as with no IPv4-first behaviour
  And an unrecognised value such as "ipv6" is reported as a configuration warning in the result and treated as the default "ipv4-first"

  Scenario: lookups are remembered for the process lifetime only
  Given LEAFCUTTER_NEO4J_ADDRESS_FAMILY is unset
  When one process runs three retrieve requests against the same graph server
  Then each distinct (server name, port) pair is looked up at most once in that process
  And the configured server name and the reader name may each be looked up once
  And a second, new process looks each name up again (nothing is stored on disk)
