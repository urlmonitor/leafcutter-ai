notes: >-
  Rules out the cheapest wrong implementation of BO-4100a-1: bringing the shared line
  down into the machine's local copy and then branching from that copy. That satisfies
  "not behind" while still handing over a starting point nobody else has, and it also
  mutates shared local state as a side effect of creating one workspace.
