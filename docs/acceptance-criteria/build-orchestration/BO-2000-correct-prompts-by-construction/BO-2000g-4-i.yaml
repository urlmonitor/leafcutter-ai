id: BO-2000g-4-i
components:
  - build_orchestration
  - commit_guardian
title: "The proof reaches the real check: the pre-correction python-coder example is refused by the same harness"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/build-orchestration/BO-2000-correct-prompts-by-construction/BO-2000g-4.yaml
criteria: |
  Given the scratch repository, the active feedback-id check and the scratch ticket of
    BO-2000g-4,
  And two variants of the python-coder red-baseline sign-off example as it stood before
    BO-2000g-1:
      (a) the heading, then `red_baseline_results:` and its two test entries, with no
          feedback-id line;
      (b) the heading, then `red_baseline_results:`, then
          `  - test_name: test_foo_raises_on_empty_input`, then
          `feedback-id: fb_2026-05-08_aa112233` as the third body line, then the
          remaining entries,
  When each variant is appended and committed in the same way BO-2000g-4 commits a
    corrected example,
  Then both commits are refused by the feedback-id check, and the refusal names the
    heading,
  And neither variant leaves a commit in the scratch repository's history,
  So a harness that never reaches the check (the hook not installed, the ticket outside
    the inspected path, or the check skipped) cannot report BO-2000g-4 as passing.
depends_on:
  - BO-2000g-4
