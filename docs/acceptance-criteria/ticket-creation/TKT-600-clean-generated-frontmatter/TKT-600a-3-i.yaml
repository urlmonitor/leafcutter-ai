title: "A ticket generated from a requirement with no declared files says its files were derived, not declared, and generation leaves the hold to the readiness gate"
component: ticket-creation
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given requirement L is in the "no declared files" state,
    and L's documentation links name scripts/build.py as a file the work modifies
    and docs/reference/ac-schema.md as describing the work,
  When a ticket is generated from L,
  Then the ticket's files-touched list is the one the existing derivation gives for L,
    containing scripts/build.py and not docs/reference/ac-schema.md,
  And the ticket states, next to that list, that its files were derived from documentation
    links and technical requirements rather than declared, naming L,
  And the ticket readiness report shows the surface as "derived, not declared" for L and does
    not report it as passed,
  And no derived path is described anywhere in the ticket or the report as a declared file,
  And generation is not refused on this account; whether L is held back from builders is the
    implementation-readiness gate's decision, which reports L with the reason
    "missing file targets".
