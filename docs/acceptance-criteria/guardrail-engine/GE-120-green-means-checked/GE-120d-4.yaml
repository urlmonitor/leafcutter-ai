it_requirements:
  - "DRIVE THE REAL SET-UP COMMAND a person would run — the deployed .leafcutter/scripts/setup_ticket_worktree.py entry point, invoked the way worktree-agent and the /feature path invoke it — never a fixture that reproduces what set-up is believed to do. That substitution is how this defect class survived one layer down: the phantom-done hook passed its unit tests against hand-authored fixtures while being a no-op on every real ticket."
  - "NO MANUAL REPAIR between set-up and sweep: no symlink, no copy, no build, no SKIP variable. THE INVALIDATION MUST BE MECHANICAL — fingerprint the copy immediately after set-up returns and re-check the fingerprint before the sweep, rather than trusting the operator not to touch it. The sequence that defeats this AC is: run set-up, notice something missing, fix it by reflex, run the sweep, see green. Every step of that is reasonable and the result is meaningless, so INVALID must be a reported state distinct from both PASS and FAIL."
  - "REUSE GE-120b-4's SWEEP UNCHANGED. Do not fork a set-up-specific variant: the end-to-end claim must cover the same sweep the tree hardened, or it asserts something about a different instrument."
  - "BOTH CLOSING CONDITIONS MUST HOLD: every check agrees with the main checkout AND no check reports could-not-check. Agreement alone is insufficient — a copy in which every check honestly reports could-not-check would satisfy it while being exactly the unprotected artifact this L1 exists to prevent."
  - "SEQUENCE: this AC lands BEFORE GE-120b-5 deletes the documented manual workaround. GE-120b-5 removes the instruction; this AC demonstrates the instruction is no longer needed. Deleting first makes the documentation change a claim rather than a record."
  - "ENVIRONMENT: the set-up path creates a git worktree that shares the repository object store. Run this in isolation from any concurrent drive, and clean up with 'git worktree remove' even on failure — a leaked worktree from a failed run silently changes the next run's environment."
  - "The sweep must exercise the DEPLOYED checks in the created copy (ADR-001) — that is what a commit in that copy would run. Pointing it at the source tree would measure the layout that never fails."
test_spec:
  - name: test_ge120d4_copy_from_real_setup_command_passes_the_parity_sweep
    target_dir: unit_tests/portability/
    framework: unittest
    type: e2e
    description: "A working copy created by invoking the real deployed set-up command passes the GE-120b-4 parity sweep: every check reaches the same verdict as the main checkout."
  - name: test_ge120d4_no_check_reports_could_not_check_in_that_copy
    target_dir: unit_tests/portability/
    framework: unittest
    type: e2e
    description: "No check in the sweep reports a could-not-check outcome in the copy set-up produced."
  - name: test_ge120d4_manually_repaired_copy_reports_invalid_not_pass
    target_dir: unit_tests/portability/
    framework: unittest
    type: e2e
    description: "A copy altered after set-up returned is detected by fingerprint and the run is reported INVALID — a state distinct from both PASS and FAIL."
  - name: test_ge120d4_sweep_driven_by_the_real_command_not_a_fixture
    target_dir: unit_tests/portability/
    framework: unittest
    type: e2e
    description: "The copy under test is produced by the real set-up entry point, not by a fixture that reproduces what set-up is believed to do."
test_rationale: "This is the end-to-end criterion for the whole tree and its value rests entirely on two procedural properties that assertions alone cannot supply: the copy must come from the real command, and it must be untouched. A fixture standing up the copy the way the author believes set-up does would pass while the real command still fails — which is precisely how this defect class survived one layer down. The INVALID state needs its own test because the defeating sequence produces no failing assertion of its own."
