notes: |
  HOLE A. A registry can name a check that does not exist, and nothing notices.

  WHY THIS IS NOT ALREADY COVERED. BP-900e ("Build catches package capabilities
  promised in the registry but never shipped to consumers") covers registered-but-
  not-deployed: an artifact that exists in the package tree and fails to reach the
  consumer. This AC covers the strictly weaker precondition — the artifact does not
  exist at all — which every deployment check structurally cannot see, because there
  is nothing to fail to deploy. BP-900e is also at the five-L2 cap, so this behaviour
  could not be added there without a structural split; BP-900g's L1 statement ("every
  invocation ... resolves to a real path") is the correct home for a reference that
  resolves to nothing.

  WHY IT IS NOT COVERED BY BP-900g-5 EITHER. BP-900g-5 emptied
  KNOWN_UNDEPLOYED_ALLOWLIST and is readiness: approved, work_status: done. This
  reference was never in that allowlist, so emptying it proved nothing about it. That
  is exactly the failure this AC's criteria are written to avoid reproducing: the
  criterion above is a resolution rule over all entries, not an inventory of the two
  known-bad names, and it is deliberately phrased so that satisfying it for
  check_test_requirements_refs.py alone does not satisfy it.

  TEST ANGLES for it-po (docs/testing/test-angles.md). Floor: criterion +
  reachability. reachability carries the must_block modifier — a synthesized registry
  entry naming a nonexistent artifact, fed through the SAME preflight entry point as a
  subprocess, must exit non-zero. Pair it with the positive control (a resolvable
  entry produces no finding) so the guard cannot be satisfied by flagging everything.
  real_artifact is triggered: the registry fixtures must be the real on-disk
  config/*.json, not hand-typed dicts, because the parse shape of these files is part
  of what the rule must survive.

  BOUNDARY OF THIS AC. It says nothing about what
  check_test_requirements_refs.py should do if written, and does not require writing
  it. Resolving the live instance by DELETING the two false references satisfies this
  AC exactly as well as implementing the script — and BO-2900g-3 explicitly parks the
  build-it decision out of scope. The criterion is about detection, not remedy.

  ─────────────────────────────────────────────────────────────────────────────
  IT-PO RULING (2026-08-17) — OPEN QUESTION 2, ESCALATED BY THE BA.
  Question: BO-2900g-3's it_requirements route Hole A to "a one-line remediation
  plus, if needed, an L2 widening under BP-900e", which conflicts with the Stage 0
  triage that placed it under BP-900g.

  RULING: the triage is CONFIRMED. BP-900g-7 stays where it is. Two independent
  reasons, either sufficient:

  (1) Capacity. BP-900e already holds five L2 children (BP-900e-1 .. BP-900e-5) and
      is at the cap. A widening there is not available without a structural split,
      and a split of an approved, partly-built tree is a larger change than the
      behaviour being added.

  (2) Semantics, which is the stronger reason. BP-900e's subject is
      registered-but-not-shipped: the artifact EXISTS in the package tree and fails
      to reach the consumer. Hole A is the strictly weaker precondition — the
      artifact exists nowhere — and a deployment-completeness rule is structurally
      blind to it, because there is nothing to fail to deploy. Placing an
      existence rule under a deployment L1 would produce exactly the conflation
      BP-900g-7-i's third clause exists to prevent.

  STATUS OF BO-2900g-3. Its constraint bullet "OUT OF SCOPE — DO NOT BUILD IT HERE"
  remains correct and is fully compatible with this AC: BP-900g-7 does not require
  writing check_test_requirements_refs.py, only that the dangling reference be
  detected, and deleting the two references satisfies it. Only the destination named
  in that bullet is stale — it was written before BP-900g-7 existed. FLAGGED, NOT
  CHANGED: BO-2900g-3 is owned by another in-flight authoring pass and is staged;
  no record was moved and no file outside this set was touched. Recommended
  follow-up for whoever owns BO-2900g-3: amend that one bullet to name BP-900g-7
  as the destination instead of "an L2 widening under BP-900e". This is a
  one-line docs-level correction with no behavioural consequence — BP-900g-7 is
  authored and reviewed either way.
