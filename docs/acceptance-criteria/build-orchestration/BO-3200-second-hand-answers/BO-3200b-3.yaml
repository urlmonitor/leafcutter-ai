notes: |
  The parent L1 requires that nothing required is "treated as best-effort and left unchecked",
  and states the condition precisely: "best-effort cleanup is acceptable only where failing to
  clean up is genuinely harmless, and that must be an explicit, recorded choice rather than an
  omission."

  OMISSION IS THE DEFECT, NOT TOLERANCE. In KI-BO-020 the release was best-effort by default —
  nobody decided it, the result was simply never read. Requiring the choice to be recorded with
  a reason converts a silent default into a reviewable decision, and makes the set of actions
  the system is willing to lose enumerable.

  THE FIRST SCENARIO STILL REPORTS. A best-effort action that fails silently is indistinguishable
  from one that succeeded, so the tolerance applies to whether the run halts, never to whether
  the outcome is mentioned. This keeps BO-3200b-2's report complete: every required action's
  outcome appears, and the record explains why one of them did not stop the run.

  THE THIRD SCENARIO IS THE CONVENTION-PROOF CLAUSE, the same shape as BO-3100b-3 and BO-2900d-1.
  Every declared exemption decays into a heuristic — cleanup actions are best-effort, actions in
  the shutdown path are best-effort — and at that point the record stops meaning anything. It is
  written to be failed by any implementation that infers tolerance from where an action sits.

  Deliberately left to the IT PO: where the record lives. The criterion constrains only that it
  is explicit, attached to that action, carries a reason, and reaches the halt report.

  IT-PO DECISION (2026-08-26). The record lives on the action's invocation site as
  {best_effort, best_effort_reason}, validated together. This deliberately mirrors BO-3100b-3's
  no-op declaration in the sibling tree: the two are the same pattern — a per-instance, reasoned,
  pre-declared exemption from a guard — and implementing them with one shape rather than two
  keeps the convention-proof property in both. Note the release in KI-BO-020 would NOT qualify
  under this rule: losing a claim is not harmless, so no honest reason could be stated for it.
