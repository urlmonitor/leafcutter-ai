it_requirements:
  - "The how-to guide and its embedded Mermaid sequenceDiagram satisfy BOTH documentation_triggers on the parent L1 ACS-900b ([how-to, sequence-diagram]); the sequence diagram is an embedded Mermaid block inside the how-to (see notes for the no-split rationale)."
  - "The how-to MUST make the block-vs-fail-open distinction explicit: a real violation always blocks (never downgraded to a warning), while an INTERNAL hook error fails open (exit 0 + stderr warning). These two postures are orthogonal and must not be conflated for the reader."
  - "The sequence diagram MUST show the block path (retired transition -> surviving entries found -> non-zero exit -> commit halted) AND the fail-open branch as an alt/alternative on internal error, matching ACS-900b-1 and ACS-900b-1-i."
  - "Doc frontmatter MUST satisfy check_doc_frontmatter.py for docs/** (title, type how-to, status, created, last_updated, components); prefer extending docs/how-to/ac-traceability-store.md over a new file to avoid frontmatter drift, and coordinate with ACS-900a-3 / ACS-900c-2 / ACS-900d-3 so the four how-to ACs form one coherent guide rather than four overlapping files."
  - "The sequence diagram MUST stay within mermaid_complexity limits (<=8 participants, <=25 interactions) so check-mermaid-complexity does not warn."
