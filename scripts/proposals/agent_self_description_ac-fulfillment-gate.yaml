agent_id: ac-fulfillment-gate
template_file: templates/agents/ac-fulfillment-gate.md
proposed_frontmatter:
  pre_flight_reads:
  - source: ticket_path
    required: true
  inputs:
  - name: ticket_path
    type: file_path
    required: true
    description: Absolute path to the ticket markdown file
  outputs:
  - name: sign_off_comment
    type: sign_off_comment
    description: 'Sign-off comment with status: ok | blocker | handoff'
  mutates:
  - name: ticket_frontmatter_agents_status
    surface: ticket frontmatter
    description: Sets agents.ac-fulfillment-gate to signed_off or failed
  - name: sign_offs_checklist
    surface: ticket body sign-offs section
    description: Checks the ac-fulfillment-gate checkbox with timestamp
  behavioral_patterns:
  - name: Conditional Behavior
    trigger: the file is absent
    behavior: treat as L2/L3 (check it)
    related_agent: null
  - name: Conditional Behavior
    trigger: '`level` equals `L0` or `L1`'
    behavior: skip this AC entirely
    related_agent: null
proposed_registry:
  category: testing
  skills_invoked:
  - skill_id: signoff
    mode: always
  knowledge_channels:
  - channel: 1
    source: template description field
  - channel: 3
    source: ticket_path from ticket-supervisor
  - channel: 6
    source: project files read during execution
  - channel: 7
    source: bash command output (git, build, tests)
