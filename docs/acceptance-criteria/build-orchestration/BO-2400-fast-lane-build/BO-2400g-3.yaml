notes: |
  GAP 2 OF BO-2400g, PART TWO OF THREE. BO-2400g-2 establishes that a reading happens
  and is substantive; this AC says what the reading must cover. It is separate because
  design review is a separate CAPABILITY from code review, not a deeper setting of the
  same one — the user's stated motivation for the whole L1 was that the review agent
  "often finds stuff during code and design review that we did not find before", and
  an implementation that adds only a code reader answers half of that.

  VERIFIED EVIDENCE (2026-08-17, do not re-investigate).
    - templates/agents/find-design-smells.md (Opus tier) covers six cross-cutting
      Fowler smells; templates/agents/find-structural-smells.md (Sonnet tier) covers
      six local ones. BOTH return findings rather than writing a file.
    - They are normally fanned out by templates/skills/code-smell-review/SKILL.md,
      which states it runs "in the top-level loop (not inside a sub-agent) so the
      parallel dispatch respects the depth-1 sub-agent limit".

  THE DEPTH CONSTRAINT, AS A CONSEQUENCE RATHER THAN AN INSTRUCTION. Sub-agents are
  hard-limited to depth 1 in this system. A workflow's own dispatch is top-level, so
  the LANE can ask for both readers; a reviewer agent that tried to obtain the second
  opinion by spawning them from inside itself cannot — it would silently get nothing
  back, which is the inert-phase failure BO-2400g-2 exists to prevent, reappearing one
  level down. That is why the third Then clause is written as a property of the
  outcome ("neither reader obtains the other examination by asking a further reader on
  its behalf") rather than as "the workflow must dispatch them": the requirement is
  that the examinations really happen, and the depth limit is the reason a delegating
  design cannot deliver that.

  TIER ASYMMETRY IS DELIBERATE UPSTREAM AND MUST NOT BE FLATTENED. The cross-cutting
  reader is an Opus-tier agent because its smells need whole-target reasoning about
  data flow, ownership and change locality; the local reader is Sonnet-tier. An
  implementation that runs both at the cheap tier to protect the lane's cost story
  satisfies the dispatch-shaped clauses and fails the first Then clause in practice.
  Flagged for the IT PO rather than written into the criteria, because the criteria
  must describe behaviour, not model selection.

  TENSION WITH THE LANE'S LEANNESS CLAIM — RECORDED, NOT RESOLVED. BO-2400a-1 caps the
  build loop at exactly one test-writer and one coder; BO-2400c/d exist to show the
  lane is cheaper and faster. Adding two readers per run has a real cost, and the
  honest framing is that BO-2400's L0 promises to drop ORCHESTRATION overhead, not
  scrutiny — the same argument BO-2400e already makes for git discipline ("the fast
  lane drops heavy agent orchestration, not git discipline"). If the measured cost
  turns out to be unacceptable, that is a scoping decision for the user, not something
  to be quietly resolved by making the readers shallower.

  BOUNDARY. This AC says nothing about what happens to the findings — whether they
  stop the run or ride along with it is BO-2400g-4. It also says nothing about the
  five other phases the fast lane skips (ac-validator, ac-fulfillment-gate,
  user-surface-smoker, live-surface-tester, documentation-verifier); those are recorded
  as an open question in BO-2400g's notes and are explicitly out of scope.

  IT-PO ENRICHMENT NOTE (2026-08-17). The tier-asymmetry hazard the BA flagged for this
  role is now an explicit it_requirement, since it is exactly the kind of
  implementation-environment constraint the criteria correctly refuse to carry. Assigned
  llm-expert: the surface is essentially ONE file, templates/workflows-js/fast-lane-ship.js
  (two dispatches plus carrying the returned findings into the result) — the two reader
  templates already exist and need no change. This is therefore the purest workflow-js AC
  of the ten, and the one where the registry gap bites hardest: `.js` is in no agent's
  owns_file_extensions and llm-expert's declared trigger covers templates/workflows/*.md,
  not templates/workflows-js/*.js. The assignment follows this tree's empirical
  convention (BO-2400a-1, a-3, a-5). declares_side_effect is false — both readers return
  findings and this AC persists nothing; the durable surface is BO-2400g-4-i's PR body.
