id: GE-113c-3-i
components:
  - commit_guardian
title: "A path-qualified allowlist entry does not suppress findings at a different directory with the same basename"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: critical
criteria: |
  Given the security allowlist contains the entry "ENTROPY_HIGH:src/config/.env:*",
  And the secrets scanner detects an ENTROPY_HIGH finding in the file "deploy/prod/.env",
  When the scanner evaluates whether the allowlist entry suppresses the finding,
  Then the finding at "deploy/prod/.env" is NOT suppressed,
  Because the allowlist path segments ["src", "config", ".env"] are not a suffix
    of the finding path segments ["deploy", "prod", ".env"]
  And basename equality (".env" == ".env") is not sufficient when the allowlist
    entry is path-qualified.

  Given the security allowlist contains the entry "ENTROPY_HIGH:src/config/.env:*",
  And the secrets scanner detects an ENTROPY_HIGH finding in the file "src/config/.env",
  When the scanner evaluates whether the allowlist entry suppresses the finding,
  Then the finding at "src/config/.env" IS suppressed,
  Because the allowlist path segments match the finding path segments exactly.
