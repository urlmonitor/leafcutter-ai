it_requirements:
  - "PLACEMENT, NAME AND GENRE. docs/reference/architecture-document-anatomy.md, title prefixed \"Reference: \" per the genre guide. Lookup-oriented throughout: tables and enumerations, one row per part and one entry per kind. No numbered steps, no walk-through, no \"you\" — the task guide is INF-1300a-5's how-to and the two must cross-link rather than overlap. If a paragraph is explaining WHY the collection has a convention, it belongs in an explanation doc and not here."
  - "THE KIND SET IS READ FROM config/diagram_types.json THROUGH INF-1300a-4's SINGLE RUN-TIME ENUMERATION, by the observation and by any generation step alike. Never a list written into the page's check. This is the recurring defect across this whole tree and it is the one that makes a reference rot silently: a table is correct on the day it is typed and stops discriminating the moment the vocabulary moves. The vocabulary has already moved once, which is how it came to contain a retired alias."
  - "MEASURED — THE DECLARATION IS NOT UNIFORM AND THE TABLE MUST REFLECT THAT, NOT SMOOTH IT. Eleven entries. Three oblige a further frontmatter fact: data_flow obliges related_code, user_flow obliges related_surfaces, agent_flow obliges related_agents. One, dataflow, carries _deprecated: true and is described as a legacy alias for data_flow — and declares requires_frontmatter: [] while its successor declares [related_code], so reading the obligation off the alias silently drops it. One, none, is a placeholder for documents declaring no picture and is not a kind of picture. Exclude it by its data property, never by matching its name."
  - "THE OBLIGED-FACT COLUMN IS THE ONLY PLACE AN AUTHOR CAN LEARN THIS, AND IT IS CHECKED AGAINST THE DECLARATION, NEVER AGAINST A HOOK. Verified: requires_frontmatter is enforced by nothing — check_doc_frontmatter validates the kind NAME against the vocabulary and stops, and the identifier appears outside the JSON only in a docstring. So a document of an obliging kind that omits the field passes every check today. An observation built on \"the checks agree with the page\" would report a green that says nothing about this column. Assert against config/diagram_types.json directly. Closing the enforcement gap is the guardrail surface's work and is outside INF-1300's fence."
  - "THE KEY COLUMN IS CHECKED AGAINST WHAT IS PRODUCED, IN BOTH DIRECTIONS. For each kind, parse the notation elements out of the produced document's emitted picture and out of its key, and require the page's account to equal that set. One-directional agreement passes on a page carrying stale entries for notation that has been removed, which is precisely how a reference goes out of date without ever being wrong about anything it was checked for."
  - "THE PRODUCED-VERSUS-AUTHORED COLUMN IS A VIEW OF INF-1300b-3's PARTITION, NOT A SECOND OPINION. Compute it by running b-3's partition over the produced document of that kind and comparing; do not hand-author the column and do not let the page become the place the split is decided. Where a split is expressed twice it drifts, and b-1 states the same rule for the section shape."
  - "NO ATTRIBUTION ON THE PAGE MAY POINT AT A DOCUMENT THAT DOES NOT DEFINE WHAT IS ATTRIBUTED TO IT. Concretely: the key is not attributed to ADR-015, which concerns honouring an inline exception-handling suppression and defines no key. This page is being written precisely because that question had no findable answer; reproducing the false answer in the place readers are now sent would be the worst available outcome."
  - "REFERENCE, DO NOT FORK. The invocation, the frontmatter checklist and the verification command belong to the two authoring surfaces and are INF-1300b-4's to correct. Link to them. A reference page is the most attractive place to paste a field checklist and the worst place for a second copy of one, because readers will trust it over the surface."
  - "THE PAGE IS ITSELF A docs/**/*.md. It must carry a non-empty description:, valid frontmatter and components values drawn from docs/components.json, and must pass the judgment-tier hooks its own path matches with the transform tier disabled."
  - "BACK-LINKS ARE PART OF DELIVERY, NOT POLISH. Per the genre guide's step 9: INF-1300a-5's how-to lists this page in related_docs and links to it for anatomy, and this page's See Also names that how-to as its task guide. A reference nothing links to is one nobody finds, and the whole point of this record is that the answer becomes findable."
  - "Error handling per the project error-handling policy (CLAUDE.md rules 1-4) applies to the test harness this record adds: every filesystem and subprocess boundary wrapped with a named exception type, nothing swallowed."
