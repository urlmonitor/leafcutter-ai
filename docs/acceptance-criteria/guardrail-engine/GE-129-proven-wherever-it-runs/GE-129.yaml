  - precommit_hooks
level: L0
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Every place that runs guards is held to the same proof of protection.

  Your work is protected from more than one place: some guards run when you
  commit, others run continuously while you work. Every standard for proving a
  guard is real — that it is counted, that it can be reached, that it has been
  seen to refuse something — has so far been written against one of those
  places, so a guard attached anywhere else inherits all of the reassurance and
  none of the proof. After this goal, where a guard happens to be attached no
  longer decides whether anyone ever establishes that it works, and a new place
  to attach guards cannot arrive already exempt from the standards the existing
  ones are held to.
