    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "Re-deriving from a requirement whose checklist already exists creates no duplicate deliverable checklist item."
  - name: test_rederivation_creates_no_duplicate_grouping_ticket
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "Re-derivation creates no duplicate grouping ticket."
  - name: test_rederivation_creates_no_duplicate_signoff_slot
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "Re-derivation creates no duplicate sign-off slot."
  - name: test_rederivation_resolves_to_existing_work
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "The second derivation resolves to the existing work rather than creating a second copy of it (byte-stable on an already-complete AC)."
