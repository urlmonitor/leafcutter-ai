id: BO-100d-1a-i
components:
  - build_orchestration
readiness: approved
priority: high
title: "Missing log directory is created and re-probed rather than hard-failing on first miss"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given /build-feature is invoked for an epic with at least one ready ticket,
  And the install's telemetry location query prints an absolute stream path
    (for example /home/dev/proj/debugging/logs/agent_telemetry.jsonl) whose log
    directory (/home/dev/proj/debugging/logs/) does not exist,
  And that log directory's enduring root (/home/dev/proj/) does exist,
  When the pre-drive feedback-sink reachability probe first attempts to append a
    probe line to the printed path and that attempt fails only because the log
    directory is absent,
  Then the remediation step creates the missing log directory and any missing
    directories between it and the enduring root, and nothing outside the
    enduring root,
  And the probe is retried once against the same printed path,
  And the drive does NOT halt on the first miss,
  And the first-miss directory-absence condition alone never produces the
    hard-block operator message.
depends_on: [BO-100d-1a]
doc_links:
  - path: docs/architecture/agent_delivery_workflows.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The remediation must create the declared stream's log directory, including missing directories up to (never above or including) the enduring root (the log directory's parent, or the project above it when that parent is debugging; see the repository CLAUDE.md 'Feedback sink reachable'), and then re-probe exactly once; the first directory-absence miss must NOT trigger the hard-block path. An absent enduring root is a stale declaration and belongs to BO-100d-1a Scenario 2, not to this remediation."
  - "Directory-absence must be classified distinctly from a genuine write failure — only the absent-parent cause is auto-remediated; everything else flows to the BO-100d-1a-ii hard-block path."
  - "The mkdir + re-probe is part of the single shared probe helper (BO-100d-1a); do not implement a second, divergent remediation in either enforcement surface."
  - "Handle the mkdir and re-probe I/O gracefully per the project error handling policy (CLAUDE.md Rules 1-3): typed except, log at WARNING, no silent swallow."
  - "Idempotent: after remediation the re-probe appends exactly one probe line; the first failed attempt must not have left partial/duplicate content."
