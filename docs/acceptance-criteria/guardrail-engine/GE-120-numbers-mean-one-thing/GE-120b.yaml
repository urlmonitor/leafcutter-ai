notes: |
  WHY THIS IS ITS OWN L1 AND NOT PART OF GE-120a. Uniqueness and enrolment are
  different promises with opposite failure modes. A thing that never takes a
  number can never collide with anything, so no uniqueness check — however
  thorough — will ever see it. Without this L1, GE-120a is a guarantee with a
  silent opt-out, and the opt-out is the cheaper path for anyone in a hurry.
  Drift by abandonment rather than drift by collision.

  OBSERVED EVIDENCE. In the diagram collection, the artifacts that DO follow the
  sequence convention have zero collisions — but a substantial further set in the
  same place carries no sequence number at all, even though a mechanism to
  allocate one already exists and is simply not being used. That is the whole
  failure mode in one place: the convention works perfectly for everyone who
  opts in.

  SCOPE JUDGEMENT FOR THE BA. "Supposed to carry a number" is the load-bearing
  phrase and it is not self-evident — some documents legitimately have no number.
  Decide the enrolment rule per kind of work explicitly at L2 and write it down;
  do not infer it from the current file listing, which is exactly the drifted
  state being corrected. The how-to trigger covers "how do I get a number for a
  new X" — today an author who does not already know the mechanism has no path to
  discover it, which is a large part of why the opt-out population exists.
