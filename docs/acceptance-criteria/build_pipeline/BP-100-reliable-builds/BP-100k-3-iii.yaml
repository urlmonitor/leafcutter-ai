test_rationale: |
  THE DEFECT HERE IS A DATA GAP, NOT A LOGIC GAP, SO THE TESTS ASSERT ON REAL
  DATA. BP-100k-3 already built the exemption mechanism and BP-100k-3-i already
  proved a freshly built tree reports clean; the untested seam is what happens
  on a tree that has actually been used, where these four files come into
  existence through use rather than through the build. A test that only checks
  the mechanism (a HOOK_TEST_CONFIG fixture, as BP-100k-3's own suite already
  does) cannot catch a missing DATA entry — the mechanism was never broken. Every
  descriptor here therefore either runs the deployed gate against the REAL
  commit_guardian.json (no test-only override) or loads that real file through
  the same loader the gate uses, so the evidence is the artifact a real commit
  would actually be judged against.

  THE ORPHAN-VS-EXEMPT DISTINCTION IS THE LOAD-BEARING HALF, NOT A FOOTNOTE. The
  cheapest way to clear all six originally-reported gaps is to declare all six
  exempt. That would pass every clause about the four real never-build-determined
  files while quietly creating the exact blind spot _drift_exemptions.py's own
  governing comment warns against for the other two — an orphan with no template
  is a real, correctly-found gap, and exempting it means nobody is ever told
  again if that same orphan file is hand-edited in place. The second test
  descriptor exists specifically to fail an implementation that took the
  six-for-six shortcut: it re-plants the two orphan paths and requires the real
  registry to still gap them.

  RUNTIME. Five descriptors, all synthesized-tree subprocess or direct-import
  runs over small trees — no live network, no real build.py invocation.
  Comfortably inside the done-proof pytest budget.
