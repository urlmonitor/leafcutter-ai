notes: |
  Measured on origin/main 14ca070a6 (2026-10-25), fixture repo holding only docs/ and
  project.txt: a fresh-consumer build took 50.3 s wall on this host. Running the guard
  in-process alone took 12-19 s over 407 roots. A profile showed the per-build
  cache working (409 analyses, one per file), with the remaining guard time in the
  repeated ast.walk passes and in _build_local_assignments / _iter_same_scope rebuilding
  scope maps for every Call and BinOp node.
