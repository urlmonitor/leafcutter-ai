criteria: |
  Given the chain that runs from the store root through a query, a reconciliation
    gate, and one or more downstream verifiers,
  When a reader consults the architecture documentation for the store,
  Then a component diagram shows each participant in that chain — the independent
    enumeration that establishes the total, the query pass that produces the results,
    the reconciliation gate, and the downstream verifiers — as distinct elements,
  And it shows the coverage figure as what travels along the connections between them,
    so a reader can point at the hop where a figure would be lost,
  And it marks the reconciliation gate as the point where an unreconciled answer is
    withheld rather than passed on,
  And it marks the surface exempted from independent enumeration — the AC-tree
    child-limit counter — as self-reporting from a single shared callable, so the
    diagram does not imply a second traversal exists for it.
