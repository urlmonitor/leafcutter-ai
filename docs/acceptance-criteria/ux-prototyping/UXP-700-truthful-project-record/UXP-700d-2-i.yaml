criteria: |
  Given the example criteria that today appear as ready to work on or one blocker away - the
    order-summary-before-payment criterion, the payment-record criterion, and the criterion
    blocked behind the payment-record one,
  When the store of work is scanned,
  Then none of the three appears in the ready set,
  And none of the three appears in the blocked set,
  And the number of items in the ready set is smaller than before the change by exactly the
    number of example criteria that were previously in it.
