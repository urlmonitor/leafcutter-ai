id: BO-300d-5
title: "A reference entry states the unbuilt-work causes, what establishes each, and which distinctions the run cannot make"
component: build-orchestration
components:
  - documentation_system
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an operator reading a closing report that names unbuilt pieces,
  When they look up the reference entry for the report's unbuilt-work section,
  Then it lists every cause the report can state,
    And for each cause it states what the run relies on to establish it,
    And for each cause it states the action the report gives,
    And it states plainly that the run cannot distinguish work it never selected
      from work that arrived after it started, and why.

  Given the reference entry,
  When each cause it lists is compared against the causes a real run emits,
  Then every cause the entry lists is one a run can emit,
    And every cause a run emits appears in the entry,
  So the entry cannot document a taxonomy the run does not implement, nor omit one
    it does.

  Given the reference entry,
  When a reader looks for what a report with no unbuilt-work section means,
  Then the entry states that its absence means the run accounted for every piece
    and built them all,
  So an absent section is documented as a positive claim rather than left ambiguous.
depends_on:
  - BO-300d
  - BO-300d-2
  - BO-300d-4
