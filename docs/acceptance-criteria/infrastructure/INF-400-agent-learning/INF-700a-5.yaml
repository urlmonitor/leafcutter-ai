amended_by:
  - reason: "BA amendment, 2026-09-07, following BrainCandy's approved decision that the knowledge-emission sink resolves against the repository and is therefore shared by every working directory of it. ONE CLAUSE ADDED TO CRITERIA, plus one test descriptor, plus two rewritten entries in the rejected-alternatives list. THE ADDED CLAUSE — and it exists because the sink decision CREATES this hazard rather than merely leaving it: with a repository-scoped sink, the record of having already routed something can now outlive the branch the routing write went to. Four of the five completion paths publish to a branch that may never merge. Before the decision, an abandoned branch took the write AND the sink AND its bookkeeping down together, so the record was simply lost and nothing claimed otherwise. After it, the write dies with the branch while the routed-already mark survives in the shared location — a durable claim that a learning was written, with no merged tree that holds it, and nothing that will ever look again. That is the phantom-done shape, newly reachable, inside the AC written to stop it. The clause requires the bookkeeping not to outlive the publication it rode. REJECTED-ALTERNATIVES LIST: item 2 (writing destinations to the main checkout) is UNCHANGED in substance and reaffirmed explicitly, because the sink moving is easily misread as licence for the destinations to move — the sink is untracked runtime data, the destinations are tracked files whose value is that they are reviewed. Item 4 (durable emission with deferred routing) is REOPENED and re-decided: its original rejection rested on the sink dying with the working directory, which is the fact being fixed, so the old reason is void. On the merits it is now adopted for the residual and rejected as the whole mechanism, on an unbounded and invisible tail (the last unit of work in a repository has no successor to route it) rather than on the retired fact. Item 5 was added to name the database and immediate-commit-to-main options and point at where their reasons are recorded. WHAT DID NOT CHANGE: the outcome, the requirement that the writes ride the path's own commit, the rejection of an unattended commit inside the routing step, and the rejection of post-merge-only routing."
    by: business-analyst
    at: 2026-09-07
  - reason: "BA addition, 2026-09-07, same day. CRITERIA UNCHANGED — this entry records a third L3 (INF-700a-5-iii) and re-foots two words of context, nothing in this record's own criteria is edited and the bookkeeping clause added above stands exactly as written. WHAT THE THIRD L3 CLOSES: making one sink serve a whole install creates a race that could not previously exist. Each working directory used to have its own sink and its own bookkeeping, so two drives never saw the same record; now two units of work completing near each other both read the same sink, and parallel working directories are routine here rather than theoretical — three at once has been observed. INF-700a-5-iii states the outcome (the learning is written once, by exactly one of them, and is not left unwritten by both), requires the bookkeeping to survive two runs updating it at once, and fixes the ASYMMETRY that makes the choice of mechanism judgeable: where both branches merge the failure is a visible duplicate, where one does not it is a learning lost while marked as routed, and only the second is unacceptable. The mechanism is left to the IT PO. IT IS AN L3 UNDER THIS RECORD, NOT A NEW L2, because both failure shapes are this record's own written-means-published rule breaking under a second stress — a duplicate is one learning published twice, a loss is a record marked routed against a publication that never arrived. INF-700a remains at five children and no split is needed. ALSO NOTE, for whoever implements the bookkeeping: the clause added in the entry above (bookkeeping must not outlive the publication it rode) and INF-700a-5-iii's arbitration are the same state under two different pressures. Solving them separately is how they end up contradicting each other."
    by: business-analyst
    at: 2026-09-07
