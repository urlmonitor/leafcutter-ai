id: BO-3200e-3
title: "Every check that can fail to inspect is driven into that state, and one that answers substantively is named"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given every check in the system whose inspection can fail to be performed,
  When each is driven into the state where its inspection cannot be performed,
  Then each reports that it could not tell, and none reports a finding about its subject.

  Given one such check restored to reporting a substantive finding when its inspection cannot
    be performed, while every other check reports correctly,
  When all checks are driven into that state,
  Then the restored check is named, and the fact that every other check behaves correctly does
    not suppress the report.

  Given a check that could not be driven into that state during the sweep,
  When the sweep reports,
  Then that check is reported as not having been exercised, distinguishable from one that was
    exercised and behaved correctly.

  Given a new check added afterwards that answers substantively when its inspection cannot be
    performed,
  When the sweep is run with nothing changed in it,
  Then the new check is named.
