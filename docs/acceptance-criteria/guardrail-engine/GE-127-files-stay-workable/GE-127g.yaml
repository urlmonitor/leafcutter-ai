    max_lines_adr, max_sections and the blocking severity, and mirroring the file_size
    section in the same file which already declares whole kinds out of scope 'each for a
    stated reason, not by omission'. Not a new configuration file: two sections of one
    file expressing the same decision two different ways is the drift the parent's notes
    rule out, and a third file would add a third."
  - "ENRICHMENT DECISION 1 — THE SHAPE. The recommended key is set_aside_locations: a
    list of objects, each carrying a repo-relative `path` and a `ground` string. An
    object per entry rather than a bare path list, so a ground cannot be omitted by
    construction; an entry whose ground is absent, empty or whitespace-only must be
    REJECTED rather than honoured silently, reusing the vocabulary the drift-gate and
    hook-trigger exemption registries in this same file already established for a
    blank ground."
  - "ENRICHMENT DECISION 1 — MATCHING. A declared path is matched against the document's
    repo-relative path. A path ending in / matches every document beneath it at any
    depth; a path not ending in / matches that one document exactly. Basename matching
    must be gone, not merely supplemented — it is the mechanism that today exempts all
    12 hand-authored README.md files under docs/ from one entry intended for one file."
  - "ENRICHMENT DECISION 1 — THE THREE ENTRIES, each with its ground stated as the
    PROPERTY that earns the exemption rather than as the name of the generator (GE-127g-4's
    second clause depends on this wording):
