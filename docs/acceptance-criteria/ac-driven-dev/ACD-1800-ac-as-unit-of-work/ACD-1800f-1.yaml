notes: |
  THE DECLARATION SLOT -- the half of ACD-1800f that the original gap statement
  missed. The gap is not "the fixture block has no AC-side home"; the ROUTING
  SIGNAL has no AC-side home either, and it is the harder of the two.

  VERIFIED (ACD-1800f notes, re-verified 2026-08-17 -- do not re-investigate):
    - `declares_side_effect` has ZERO occurrences in config/ac_store_schema.json.
      (Line ~637 of that file is `product_truth`, not `declares_side_effect` -- an
      earlier analysis got this backwards.)
    - The schema sets `"additionalProperties": false` at top level (line 15) and
      that IS enforced today (jsonschema.Draft7Validator,
      scripts/ac_store/validate_ac_schema.py ~line 152). A probe AC carrying the
      field is rejected: "Additional properties are not allowed
      ('declares_side_effect' was unexpected)", exit 1.
    - Consistently, ZERO ACs in docs/acceptance-criteria/ carry the field.
    - CONCLUSION: the field cannot legally be authored on an AC at all. The
      generator's propagation (~lines 1914-1920) and its routing
      (~line 903: `if declares_side_effect: all_needed.add("user-surface-smoker")`)
      plus the non-overridable `_SIDE_EFFECT_MANDATORY` frozenset (~line 920) are
      LIVE BUT DEAD-ENDED from the AC path.
  Hence the FIRST Then clause, which reads oddly for a behaviour AC and is
  deliberate: today the store REJECTS this declaration, so "is accepted" is a
  real, currently-failing assertion, not a tautology.

  ONE SLOT, NOT THREE -- the fourth Then clause. Three triggers are orphaned in
  the same shape and must not spawn three mechanisms:
    - `declares_side_effect` -> user-surface-smoker (generator ~903);
    - `user_facing_surface` -> user-surface-smoker's second routing condition
      (config/agent_registry.json ~2597-2603); zero occurrences in BOTH the
      schema and generate_ticket_from_ac.py;
    - `live_surface_test` -> live-surface-tester (registry ~2663,
      `conditional_field: live_surface_test`, `requires_ticket_section: true`);
      zero occurrences in both, and the agent exists but is unreachable.
  ACD-1800f's notes ask explicitly that the slot be designed "wide enough that
  live_surface_test can reuse the same mechanism rather than inventing a third
  one". The criteria encode that as a capability (declare the KIND of
  observation) rather than as a field shape, so the IT PO can choose between a
  kinded list and parallel booleans without reopening the behaviour.

  ORDERING. config/ac_store_schema.json's additionalProperties:false is enforced
  NOW, so this slot is a HARD prerequisite for ACD-1800f-2's proof content and
  for anything piloting the behaviour by hand. It lands under ACD-1900a's
  additive-first, optional-field rule (ADR-026 safety rule 1), and absence means
  legacy mode -- derive nothing, never fail (rule 4), which is what the third
  Then clause protects. The IT PO should consider an ACD-1900a depends_on edge in
  the same shape as ACD-1800a's 2026-08-17 amendment.

  MIRROR VALIDATION INTO ALL THREE ENFORCEMENT POINTS:
  scripts/commit_guardian/check_ac_schema.py, its manual fallback
  scripts/commit_guardian/_ac_schema_validators.py, and
  scripts/ac_store/validate_ac_schema.py. A rule added only to the JSON schema is
  a no-op gate (the ACD-1800a-1 it_requirements finding).

  TESTABILITY. Write a real AC record carrying the declaration to disk and run
  the store validator on it -- the assertion is the validator's exit status and
  the value a reader gets back. Grepping the schema for the key name would pass
  on a key that the generator's routing never consults, which is exactly the
  state the code is in today.

  2026-08-17 (IT PO enrichment).

  SLOT SHAPE DECIDED: a kinded LIST, `observable_effect`, not parallel booleans.
  The BA deliberately left the choice open. A kinded list is chosen because the
  three legacy triggers then become DERIVED reads over one authored field, which
  makes "no second slot" a mechanical property rather than a review convention:
  a fourth observation craft is a new enum member, not a new field. Parallel
  booleans would satisfy the criteria as written while leaving the next author
  the same invitation that produced three orphans.

  DERIVATION MAP (binding for ACD-1800f-1-i and ACD-1800f-2):
    declares_side_effect  == observable_effect is non-empty
    live_surface_test     == "live_surface" in observable_effect
    user_facing_surface   == derived from the `surface` key of the smoke proofs
                             authored under ACD-1800f-2, NOT from this field.
  The declaration carries WHICH KIND of observation; each individual proof
  carries its own surface. Keeping `surface` off the declaration is what lets a
  requirement carry several proofs against different surfaces (ACD-1800f-2's
  third Then clause).

  CROSS-TREE DEPENDENCY NOT ENCODED AS AN EDGE (caveat for the user). This AC is
  unimplementable before ACD-1900a lands its optional slots -- verified, not
  inferred: additionalProperties:false is enforced by jsonschema.Draft7Validator
  in both scripts/ac_store/validate_ac_schema.py (~152) and the commit hook. The
  correct expression of that is `depends_on: [ACD-1800f, ACD-1900a]`, matching
  the ACD-1800a amendment of 2026-08-17. It was NOT added here because ACD-1900*
  is owned by a concurrent authoring pass and depends_on is governance
  write-locked; the constraint is instead carried in `expects_from` and in
  it_requirements, and the edge is recommended to the user for a single
  reconciling amendment across the whole ACD-1800/1900 boundary.

  ADDITIONAL VERIFIED FINDING, not in the briefing: the routing repoint is
  larger than line ~903. `declares_side_effect` appears at generator lines ~659
  (parameter default), ~685/689/702 (docstring), ~896-922 (routing plus the
  _SIDE_EFFECT_MANDATORY frozenset), ~1914-1920 (frontmatter propagation) and
  ~2772/~2809 (two separate extraction sites that both call
  `ac.get("declares_side_effect")`). Repointing only the routing leaves two live
  extraction sites reading a key no AC can carry.
