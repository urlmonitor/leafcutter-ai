notes: |
  THE RULE, stated once for all children. For each changed file in scope, let H be
  the multiset of (head path, error code, normalised message) over its mypy errors at
  the head and B the same multiset over the file's mypy errors at the merge base
  (re-keyed to the head path for a rename; empty for a file that did not exist). An
  error key is new by max(0, H[k] - B[k]); it is existing-untouched by min(H[k], B[k]);
  it is removed by max(0, B[k] - H[k]). The check fails when any key is new, or when a
  file's count of `# type: ignore` comments (counted with the tokenizer) rose. There is
  no stored baseline: the merge base is the baseline, so every error an earlier pull
  request fixed stays fixed.

  SHAPE. One L2 holding the rule, seven L3 arms: line-insensitive matching (-i),
  existing errors not charged and removals reported (-ii), renames (-iii), new files
  (-iv), type-ignore increase (-v), the honest summary and the never-silent empty or
  broken run (-vi), and the CI job wiring (-vii). An eighth arm, added 2026-11-17
  (-viii), makes scripts/run_ci_local.py run the same ratchet call, read from ci.yml,
  as a blocking local step. Tests build real git repositories
  with a base and a head commit and run the real module and the real mypy.

  BUILD EVIDENCE 2026-11-16. Red before the module existed: 20 tests, 18 failed and
  2 errored (-vii red on the real ci.yml, whose job was still informational). Green
  after: 20 of 20. Five named wrong versions were applied one at a time and each
  turned its test red: errors keyed by line (-i shifted), sets instead of multisets
  (-i extra copy), substring ignore counting (-v string and table), mypy exit 2
  accepted (-vi could-not-check), renames read as new files (-iii both arms).
  Real-range dry run, origin/main~5..origin/main (14 changed files): 0 new errors,
  2 existing untouched, 14 removed; whole-file mypy over the same files reported 12
  errors, 10 of them in modules the range never touched.

  FOLLOW-UP ON THE SAME PR. The first CI run of the job on its own pull request passed
  in under two seconds with no evidence mypy had run. Reading it exposed a fail-open:
  `python -m mypy` without mypy exits 1, the status that means "errors found", and the
  module parsed no error line and passed. Fixed (version probe printed in the log; a
  status 1 with no error line is could-not-check) with a test that was red against
  the pre-fix code (exit 0) and green after; see BP-1300f-1-vi.
