it_requirements:
  - "The change must land under templates/. The deployed workflow is build output."
  - "A mismatch must leave the run paused rather than fail it. The person is still owed the question; a failure that clears the record makes the recovery from a mistyped resume a full re-run."
  - "The record must be unchanged on disk after the mismatch -- not rewritten, not re-timestamped in a way that loses which decision is outstanding."
  - "The report must name the decision the run is actually waiting on, so the operator can correct the answer without inspecting the store by hand."
  - "The subject binding must be checked before any part of the answer is acted on. Checking after the branch has been taken is not a check."
  - "Must satisfy the repository error-handling policy."
  - "Must be idempotent: repeated mismatched resumes leave the run in the same waiting state each time."
test_spec:
  - name: test_answer_naming_a_different_decision_is_not_applied
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      A run paused at one decision point; a resume supplying a well-formed answer that
      names a different decision point takes neither branch of the waiting decision --
      no step after it executes.
  - name: test_run_remains_paused_with_its_record_intact_after_a_mismatch
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      After the mismatched resume the record is still present on disk and still names
      the original decision point, and a fresh process listing waiting runs still lists
      it.
  - name: test_mismatch_report_names_the_decision_actually_being_waited_on
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The mismatched resume reports the decision point the run is waiting on, not the
      one the supplied answer named.
  - name: test_mismatched_resume_discards_nothing
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      The drafted artifacts are byte-identical before and after the mismatched resume --
      including when the supplied answer names a decision whose choices include
      discarding.
test_rationale: >-
  The route has five decision points and a supplied answer is a small structure carrying
  an action; nothing in the shape of an answer for the covered-route decision
  distinguishes it from an answer for the final approval, since both may legitimately
  say proceed or stop. So the natural implementation of resume -- apply whatever answer
  it was handed to whatever decision it happens to be paused at -- silently converts an
  answer to one question into an answer to another, and given that one of the five
  decisions can delete drafts, that failure is destructive rather than merely wrong. The
  discards-nothing test deliberately supplies an answer naming a destructive choice on
  another decision, because that is the case where a subject check applied after the
  branch is taken is indistinguishable from one applied before it, except by what is
  left on disk.
