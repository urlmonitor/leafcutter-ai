criteria: |
  Given a run whose root is the single request "Write release notes for the last ten merged
    pull requests",
  And no registered capability can meet it (routing: no match),
  When routing runs on the run's root,
  Then no split is started and the split gate is never shown,
  And the run records the same capability gap, and ends blocked with the same report, as it does
    today,
  And the report has no split section and no line about a rejected split.
