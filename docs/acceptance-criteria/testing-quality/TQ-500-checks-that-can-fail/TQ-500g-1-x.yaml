    relevance: "The writer's list and write steps and the per-name scope rule (in_scope_files, union over entries, minus test files) that this AC extends with the fallback; the R9 out-of-scope refusal it keeps."
  - path: docs/acceptance-criteria/testing-quality/TQ-500-checks-that-can-fail/TQ-500g-1-i.yaml
    relationship: relates-to
    status: exists
