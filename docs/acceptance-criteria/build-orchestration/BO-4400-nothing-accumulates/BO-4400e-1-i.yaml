criteria: |
  Given the refusal limit is set to 5 GB, and the free space of one drive the check
    must measure cannot be read because that drive is not reachable,
  When a workspace is requested from the one workspace maker,
  Then the answer is ready and carries a warning naming the drive that could not be
    measured and stating that the free-space check was not completed for it,
  And the warning is distinguishable in the answer from a low-space warning.
