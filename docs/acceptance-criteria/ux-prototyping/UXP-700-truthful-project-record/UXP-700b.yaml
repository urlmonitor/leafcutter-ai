criteria: |
  "All clear" means something was examined — never that there was nothing there.

  When the tooling checks the record and finds nothing to check, it says so
  plainly instead of reporting a clean result. A person reading the outcome can
  always tell the difference between "I inspected your project and it is sound"
  and "there was nothing for me to inspect".
