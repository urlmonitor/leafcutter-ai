id: GE-127b-1-i
title: "A run that could not establish any previous length says which situation it is in and refuses, and a clean run states how many files it compared"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the source from which every covered file's previous length is obtained
    cannot be established for this run — it cannot be reached at all, or it is
    reached and what it returns cannot be interpreted,
  When the author performs an ordinary commit,
  Then the outcome states that the previous lengths could not be established,
    names which of those two situations occurred, and the commit does not
    complete,
  And given that source is established successfully and holds no covered file at
    all, so that no covered file anywhere yet has a previous length to be
    compared against,
  When the author performs an ordinary commit,
  Then the commit completes, and the outcome names that situation — a history
    holding nothing of a covered kind — in wording that distinguishes it from
    either situation in which the source could not be established, so that a
    reader can tell an empty history apart from a broken lookup,
  And given that source is established successfully and does hold covered files,
    while the particular commit being made stages only covered files that are
    newly added and so have no previous length of their own,
  When the author performs an ordinary commit,
  Then the commit completes — what refuses is the source being unavailable,
    never a history or a particular commit happening to have nothing to compare,
  And in neither of those two unresolvable situations is any file reported as not
    having grown, and in neither does the commit complete as though every staged
    covered file had been compared against its previous length and found not to
    have grown,
  And given any run in which the source was established,
  When the outcome is reported,
  Then it states how many staged covered files it compared against a previous
    length, whatever that number is, including when it is none, and a stated
    count of none does not by itself refuse the commit,
  And given such a run in which at least one staged covered file had a previous
    length and no covered file grew,
  When the outcome is reported,
  Then the stated number is greater than zero, and it is that positive number —
    not the absence of anything to report — that establishes the run as having
    found no growth.
depends_on:
  - GE-127b-1
