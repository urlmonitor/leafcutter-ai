id: TQ-600a-9-iii
components:
  - testing_quality
  - build_pipeline
title: "Four test classes share one finished install as four private copies, and the isolation their author wrote down is demonstrated rather than assumed"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the installer-announcement file: four test classes, eight real builds, two per
    class — a first install produced in a shared setup step and a second install each
    class runs after its own mutation — costing about 107 s, of which about 39 s is the
    three redundant first installs,
  And the file's own written decision, which this change revises and must therefore
    answer rather than ignore: it records that the first install is never shared or
    reused across tests so that no test's mutation or assertion can be order-dependent
    on another test's run,
  And the reason the file's layout cannot simply be made cheaper some other way: it
    builds a synthetic package root deliberately, because a target directory pointed
    away from the package root makes the output-mapping computation fail and produce an
    empty mapping, which is the very thing the criterion inspects,
  And the distinction that answers the author's concern: the proposal is not to share
    one install between classes, but to produce one install and give each class its own
    copy of the finished result before it mutates anything — so nothing mutable is
    shared and the stated order-dependency cannot arise,
  When the first install is produced once and each class receives its own copy of it
    before mutating and running its second install,
  Then the file starts five real builds where it started eight, and all four classes
    still pass,
  And each class's copy is independent: a mutation made by one class is absent from
    every other class's copy,
  And the four classes reach the same verdicts when run in declaration order, in
    reverse order, and each one alone — which is the author's stated concern, now
    checked by execution instead of guaranteed by repetition,
  And each class still fails when the announcement property it alone names is broken,
    so the shared origin of the copies has not made any class's assertion true by
    construction,
  And the synthetic package root each class builds against still has its package root
    and its target root coinciding, so the output-mapping computation this file exists
    to inspect is still the one being exercised.
