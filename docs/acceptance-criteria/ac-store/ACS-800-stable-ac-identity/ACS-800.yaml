notes: |
  Strategic structural capability proposed directly by the user (BrainCandy).
  Decouples AC identity from tree position: every AC gets a STABLE, opaque,
  position-independent unique identifier (assigned sequentially at creation, never
  derived from tree position), and the parent relationship, level, and ordering move
  into metadata fields rather than being encoded in the id string.

  PERMANENT FIX FOR TREE SATURATION: ACS-800 is the permanent resolution of the
  tree-saturation and re-parenting pain that today forces repeated manual L0/L1
  tree splits (see the ac-tree-split skill) and that the newly added
  `child_limit_override` field on check_ac_limits.py is only a TEMPORARY stopgap for.
  The override exists to let an over-cap tree (e.g. ACS-100, currently at 9 L1
  children) keep being worked on in the interim; it is intended to be RETIRED once
  ACS-800 lands and tooling counts children from metadata instead of from the id
  string. A future reader should treat child_limit_override as scaffolding for this
  L0, not a permanent feature.

  This L0 was minted as a NEW root (next free ACS-NNN = ACS-800) rather than as an
  L1 under ACS-100, precisely because ACS-100 is already over the 7-child cap — the
  saturation this capability cures. Placement in the ac-store component is correct:
  this is the store's own structural-identity concern.
change_target: schema
