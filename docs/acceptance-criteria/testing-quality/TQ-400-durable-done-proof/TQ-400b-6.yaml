id: TQ-400b-6
components:
  - testing_quality
  - ac_store
title: "The lifecycle diagram shows done as an exit-able state, with the demotion edge and what it writes"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a record's work state has until now only ever moved one way — into
    finished, never out of it — and the demotion path adds the reverse edge,
  When a reader who has not seen the code opens the state diagram for a record's
    work state,
  Then the diagram shows every state a record can occupy and every transition
    between them, including the edge from finished back to work-still-to-be-done,
  And each transition is labelled with what triggers it and what performs it, so a
    reader can say which moves are made by a person, which by the promotion path,
    and which by the sweep,
  And the demotion edge is labelled with what the transition records on the record
    — the reason and the date — and with the fact that applying it a second time
    to an already-demoted record changes nothing,
  And the diagram shows which sweep outcomes move a record and which do not, so a
    reader can say that a proven, an exempt, and an untrustworthy-evidence record
    all stay where they are,
  And a reader can answer from the diagram alone, for a record in any given state,
    which states it can reach next and what would have to happen for it to get
    there,
  And the transitions that already exist are drawn as they actually behave rather
    than as an idealised lifecycle — including that promotion refuses a record
    that is not active and does nothing to one already finished,
  And the edge this work introduces is distinguishable from the ones already
    running, so the diagram is not read as a record of behaviour that has not
    shipped.
depends_on:
  - TQ-400b
  - TQ-400b-1
  - TQ-400b-2
  - TQ-400b-4
