notes: |
  WHY THIS IS A SEPARATE BENEFIT. Detection and remediation are different
  promises. A guard that only says "no" on a numbering clash is actively
  unhelpful: at the moment of the block the author usually has no idea which
  OTHER piece of work claims the number, or which of the two should move. The
  benefit here is that a hit is actionable on its own, without an investigation.

  HONESTY CONSTRAINT — the single most important thing in this AC, and the reason
  the criteria text says "while you are still working" rather than "always".
  What each stage can do is not the same, and the L2s must state each stage's
  promise truthfully:
    - The stage that runs while the author is still working, inside the live
      session, is the ONLY one whose output feeds back to something that can act.
      This is the only place a specialist can genuinely be brought in to fix the
      numbering. Precedent for this exact stage already exists in this project,
      so the mechanism is proven, not speculative.
    - The stage at commit time is a plain background process. It can stop the
      commit and print. It CANNOT bring anyone in.
    - The stage in the shared build can fail the build and print. It CANNOT
      bring anyone in either.
  Therefore: the "specialist renumbers it for you" promise attaches ONLY to the
  first stage. The other two owe the author an unmistakable, self-contained
  message — the number, both claimants, and the recommended resolution.

  ANTI-PRECEDENT THE BA MUST NOT REPEAT. A guard already exists in this project
  that is DOCUMENTED as automatically bringing in a specialist and does not: it
  is hard-wired to report success regardless of what it finds, and the
  remediation path it advertises is a placeholder that rubber-stamps everything
  it is handed. Authors believe they are covered and are not. A documented-but-
  dead remediation path is worse than no path at all. Any L2 that claims a
  specialist is brought in must be covered by a test that proves it actually
  happens — not by the presence of the wording.

  The sequence-diagram trigger reflects three participants (author, guard, the
  specialist that does the renumbering) and the fact that the flow differs by
  stage; the how-to covers what a person does when they hit a clash at a stage
  where nobody can be brought in for them.
