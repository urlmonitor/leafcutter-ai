id: KM-500g-2
title: Diagnose only what the matching attempt and revision evidence establish
component: knowledge-management
components:
- knowledge_management
level: L2
status: active
req_status: active
work_status: in_progress
readiness: approved
priority: medium
parent: KM-500g
criteria: 'Given one attempt returned complete AC identities without the required work-status field and another
  failed before retrieving any evidence

  When an agent asks why the answer is unavailable and what to do next

  Then the first diagnosis identifies the evidenced field gap while the second identifies retrieval unavailability
  without claiming zero ACs exist

  And any source revision and generation named in the diagnosis come from that attempt rather than a different run
  or the current workspace

  And current workspace, published source and historically tested revision remain distinguishable when the question
  concerns freshness

  And when matching diagnostics establish a scope mismatch, the diagnosis states the expected and observed repository,
  revision, query or permission scope values that are known and cites the governing contract

  And unavailable comparison values remain unknown rather than being reconstructed from a different attempt

  And any rerun recommendation identifies a bounded case and why it addresses the observed mismatch, without claiming
  proven minimality or broader permission

  And a more specific claim about credentials, network, provider, source mapping or field transformation requires
  matching diagnostic evidence

  And absent or conflicting diagnostics produce an unknown-cause or unresolved outcome with the missing information
  named

  And the next step addresses the established limitation under existing permissions, such as completing required
  evidence, checking publication state or obtaining the matching observation

  And source-inspected evaluation expectations are never substituted for what the failed retrieval actually returned.

  '
