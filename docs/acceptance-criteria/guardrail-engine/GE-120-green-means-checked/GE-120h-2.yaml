it_requirements:
  - "EXTEND THE EXISTING RECORD IN unit_tests/commit_guardian/test_hook_registration_inventory.py — DO NOT STAND UP A COMPETING BASELINE. It already holds UNREGISTERED_BASELINE (a frozenset of script filenames) and already enforces two of the four arms: test_no_unregistered_hook_scripts_beyond_baseline asserts set-difference in BOTH directions, so it fails on a new orphan AND fails when the baseline goes stale because an entry was registered or deleted. Its own comment states the rule this criterion generalises — 'THIS LIST MAY ONLY SHRINK'. A second record over an overlapping population is forbidden: the two would disagree about how much debt exists and each would be cited as evidence the other is stale."
  - "THE POPULATION CHANGES AND THAT IS THE REAL WORK. The incumbent record is keyed by SCRIPT FILENAME over the DISK population (scripts present that no entry names, gathered from GUARDIAN_DIR and GUARDIAN_DIR/hooks via hook_parity.hook_script_patterns). This AC's population is the ADVERTISED one from GE-120h-1 — what a surface claims — which is a different set: a surface can advertise a check whose script was deleted, and a script can be present while nothing advertises it. Extending means one record carrying a per-entry ground over the union-aware population, not the old frozenset with new strings in it. Reconcile the two keyings explicitly; do not assume filename and advertised name are the same token."
  - "READ GE-127b'S SHARED RATCHET BEFORE WRITING A THIRD ONE. The store's own guidance on GE-128a recommends reusing it. The concrete candidates on disk are templates/scripts/commit_guardian/_file_size_ratchet.py (get_previous_length, resolve_previous_lengths, resolve_parent_revisions, and a PreviousLengthSourceError/CurrentLengthUnmeasurableError pair) and _doc_length_ratchet.py alongside it. Note honestly what they do and do not give you: they resolve a per-file PREVIOUS MEASUREMENT from git parents, which is the reusable half; they do not carry a per-entry grounded register, which is the new half. State which half is reused and which is new rather than declaring reuse and duplicating."
  - "EXAMINE BP-1600a-2-i's DECLARED-NON-GATE REGISTER BEFORE INVENTING A REGISTER OF YOUR OWN. It is the nearest existing mechanism for a grounded entry. Whoever builds the second of the two must state which disposition governs the overlap — BP-1600a-2 requires day-one triage of its whole set and calls a 'deferred' ground suppression under another name, while this record permits a standing backlog that may only shrink. They are compatible only because the populations differ. Resolve that at authoring time, not at merge."
  - "THE FIRST ARM IS THE ONE AN IMPLEMENTATION VIOLATES BY ACCIDENT: refuse on the DELTA, never on the whole population. A rule that refuses on standing debt refuses every commit and is removed within a day — which is the entire reason GE-120h-1 can be switched on at all."
  - "THE RECORD MUST NOT BE OFFERED AS THE WAY PAST THE REFUSAL. The second arm's message must say the check is to be made to run or the advertisement withdrawn, and must NOT suggest adding it to the record. The incumbent already gets this right — 'Do NOT add it to UNREGISTERED_BASELINE' — and losing that line in the extension would make the ratchet the rubber stamp it exists to prevent."
  - "NO COUNT ANYWHERE. Not in the code, not in a test, not in a message, not in a docstring. The disk record moved 18 -> 16 -> 14 in a single day and the advertised population has never been measured. Every arm is written over relative movement, and a test asserting a total passes forever."
  - "REFUSAL MUST REACH THE AUTHOR AT COMMIT TIME, NOT ONLY IN A TEST RUN. That is the gap the incumbent does not cover and a stated part of this record's scope. Same consequence as GE-120h-1: if this lands as a new registered entry it adds a package surface and this record must then carry package_surface: true with a structured spec read off disk — see the caveat in the notes. If instead the rule is added to an ALREADY-REGISTERED hook, no new surface is created and no declaration is needed; decide which, deliberately."
  - "ADR-001 PARITY. Any hook-side change is authored in templates/scripts/commit_guardian/ and verified from the deployed copy after build.py. The test file itself lives at unit_tests/commit_guardian/test_hook_registration_inventory.py and reads the TEMPLATE manifest directly (MANIFEST_PATH = templates/scripts/commit_guardian/commit_guardian.json), so it is not evidence about the deployed path on its own."
  - "COORDINATE WITH GE-120h-3 RATHER THAN RACING IT. Registering those five cannot be done without reducing the incumbent record by five — the staleness assertion forces it. If the baseline is being restructured here at the same time, the five must come out of whichever structure is current, once."
