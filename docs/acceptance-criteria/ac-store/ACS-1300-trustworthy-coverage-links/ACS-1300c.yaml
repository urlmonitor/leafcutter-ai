notes: |
  THE GUARD ON THE GUARD. The cheapest implementation of ACS-1300a satisfies
  ACS-1300a perfectly while violating every guarantee here: it loads the store,
  fills in the gaps, helpfully promotes the records whose proof it just found, and
  writes all 3,749 files back reformatted. This L1 is what makes that
  implementation fail.

  THREE GUARANTEES, EACH A NEGATIVE CONTROL — the BA should give each its own L2
  and should state each in the negative, because each one is satisfied by inaction
  and must therefore be paired with proof that the same run was live:

  1. AWARDS NOTHING. No AC in the ACS-1300 tree writes work_status, at any level.
     This is REFUSED, NOT DEFERRED — not a phasing decision, not open to the BA,
     the IT PO, or an implementer who notices how easy it would be. Restoring an
     evidence link is not the same act as awarding a done badge; auto-promoting
     finished-state from derived evidence manufactures a done claim on the single
     field the entire phantom-done edifice rests on. The neighbouring L1 TQ-400f
     was authored and then CLOSED UNBUILT on 2026-09-01 partly for approaching
     this line. Flipping the badge stays with mark_ac_done.py.

  2. REWRITES NOTHING THAT IS ALREADY CORRECT. Byte stability, inherited from
     TQ-400e-1 — a record with nothing to repair is never opened for writing. Not
     "written identically": a YAML round trip preserves every value and changes
     every byte, which at this store's size churns the whole store and makes the
     diff unreadable. Reuse TQ-400e-1's test shape (raw-byte hash before and
     after, plus an anti-no-op control in the SAME run), do not invent a second.

  3. ABSTAINS OUT LOUD. Evidence the tool cannot trust produces a reported
     abstention — never a silent skip, never a write. A skipped record is
     invisible, and invisibility is the same defect this tree exists to remove,
     one level down. "Untouched" and "never looked at" must be distinguishable in
     the report.

  EVERY ONE OF THESE IS SATISFIED BY A TOOL THAT DOES NOTHING AT ALL. Each L2 must
  therefore assert, in the same run, that records which genuinely needed repair
  were repaired. Without that pairing this L1 is the easiest green in the tree and
  proves nothing.

  DOCUMENTATION: `[reference-doc]`. Guarantee (1) is a standing rule the next tool
  author must not re-derive, and TQ-400f is the evidence that it does get
  re-derived. A refusal that lives only in an AC's notes is unfindable; it belongs
  written down beside the field it protects.
