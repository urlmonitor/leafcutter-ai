notes: |
  Option chosen from the KI's two directions: drop the prose keyword and keep
  the test-id check plus a non-empty wrong version, because the template asks
  for free prose and the test field already pins the function (the request's
  own framing). The other option, an any-of keyword list, would leave the check
  stricter than the template again (the "select true (hardcoded true ...)"
  entry names neither the function nor retry_due).

  IT-PO (2026-10-30). Decided: drop wrong_version_contains from the kind and from the
  row (its only user). The KI index row is not touched here (TQ-200d-2-ii moves it).

