criteria: |
  The repair that was too dangerous to make becomes routine, and provably so.

  Adding a missing part to a requirement no longer changes whether that
  requirement can be finished. The records the reconciliation pass currently has
  to decline are reported as ordinarily repairable, and the reason it had to
  decline them is no longer reachable.
