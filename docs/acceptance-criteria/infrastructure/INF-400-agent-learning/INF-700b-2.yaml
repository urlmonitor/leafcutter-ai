implemented_by: []
notes: |
  Evidence this exists to close (verified 2026-08-26): scripts/check_skill_refs.py
  is written, has unit tests, and appears in no CI workflow, no pre-commit
  configuration and no hook manifest. It has never run in anger. Forty-three
  references to the two retired skill names survive across eleven files
  precisely because the guard against them is unwired.

  Coverage constraint (project CLAUDE.md, "Gate / Workflow ACs — Verify
  Behaviorally, Not by Grep"): the proof for this AC must be a test that
  executes the gating path and observes the refusal. A test that searches a
  workflow or manifest file for the gate's name passes on a gate that is
  registered and never reached, which is the exact defect being closed.
