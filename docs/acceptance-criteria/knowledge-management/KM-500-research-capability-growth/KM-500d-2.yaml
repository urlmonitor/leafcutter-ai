id: KM-500d-2
title: Show when published knowledge will reflect a branch or source change
component: knowledge-management
components:
- knowledge_management
level: L2
status: active
req_status: active
readiness: approved
priority: medium
work_status: in_progress
parent: KM-500d
criteria: 'Given an installation has a configured canonical indexing branch, a current workspace revision and
  a published graph revision

  When an operator asks whether a source change is available for research

  Then the response identifies the configured branch, requested revision, published revision, readiness and
  any pending, failed or missing synchronization

  And it distinguishes a local edit, a feature or v01 merge, a canonical-branch merge and an explicitly requested
  immutable-revision sync

  And it does not imply that a feature merge triggers a differently configured canonical-branch job or that
  deploying query code automatically indexes its source

  And a manual synchronization is identified as manual rather than evidence that the merge-triggered workflow
  ran

  When the configured canonical event is exercised in an authorized deployment

  Then the observed validation, publication and separate graph and semantic readiness agree with the existing
  publication guarantees

  And the operational proof records the actual trigger and safe status information, including unmet credentials
  or provider prerequisites without revealing secret values

  And retrieval, ingestion and trace correlation are demonstrated through their existing owners without putting
  writer credentials into a research request.'
