criteria: |
  Given the cross-reference audit has identified 2 high-confidence matches
    and 1 medium-confidence match,
  When the tool is invoked with the --apply flag,
  Then the 2 high-confidence ACs have their implemented_by field updated
    to include the matched ticket path,
  And those 2 ACs have their work_status changed to done,
  And the 1 medium-confidence AC's implemented_by and work_status fields
    remain unchanged (no modification without human confirmation).
