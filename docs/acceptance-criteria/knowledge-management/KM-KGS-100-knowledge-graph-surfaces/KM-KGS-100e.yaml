criteria: |
  Stand on any component and see everything that belongs to it — complete, not empty.

  Every knowledge item — your requirements, agents, skills, docs, tickets, and the
  roadmap — says which part of the product it belongs to, so when you or an agent asks
  the map "show me everything for this component", the answer is complete and accurate
  instead of empty. Saying which component an item belongs to is expected of everything
  that joins the map, and items that already existed are brought up to the same standard,
  so the picture is trustworthy for the whole project — not only for new work. The payoff:
  standing on a component, you can see its requirements and, through them, the code and
  tests that deliver it.
