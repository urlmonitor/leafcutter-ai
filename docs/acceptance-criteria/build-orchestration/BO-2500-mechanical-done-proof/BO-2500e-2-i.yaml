title: "An AC covered in both Python and JS is eligible only when every linked test passes"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an active AC that has BOTH a Python "# covers:<id>" test and a JS "// covers:<id>" test,
  When the done-status of that AC is evaluated,
  Then the AC is eligible to be marked done only when every covers-linked test in both languages
    passes,
  And if either the Python test or the JS test fails, the AC cannot be marked done and the failing
    test is named,
  So cross-language coverage requires all linked tests to pass, not just one language's.
