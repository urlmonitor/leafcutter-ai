id: BO-4400c-1
title: "A project that declares uv gets a uv environment inside the workspace"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a test project whose root contains a uv lock file pinning one package, and a
    machine with uv available,
  When a workspace is requested from the one workspace maker and it answers ready,
  Then the workspace contains a Python environment in a folder named ".venv" at its
    root, created by synchronising with uv from the lock file,
  And the pinned package can be imported using that environment's Python at exactly
    the version the lock file pins,
  And the user's shared Poetry environments folder and every other per-environment
    folder outside the workspace contain the same entries as before the request,
  And the maker's ready answer names "uv lock file" as the declaration that chose the
    set-up and gives the environment's location inside the workspace,
  And after the workspace is cleared through the one shared clearing door no Python
    environment created for it exists anywhere on the machine.
depends_on: [BO-4400c, BO-4300c-1]
