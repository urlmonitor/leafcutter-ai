id: ACD-1300b-4
title: Reserve one isolated accumulating workspace per claimed feature
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given feature STATUS is dependency-ready and the user has enabled background work
  When the worker claims STATUS
  Then one run owns an isolated feature branch and worktree based on the recorded target revision
  And all of its required leaves and repairs use that accumulating worktree
  And it never implements directly on the protected target branch or an unrelated workspace
  And a concurrent duplicate claim cannot start another run for STATUS
