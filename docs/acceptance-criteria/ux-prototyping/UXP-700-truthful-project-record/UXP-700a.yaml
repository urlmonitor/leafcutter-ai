notes: |
  The "produce" L1, restated as the failure it prevents: an adopter installs the
  tooling and ends up with no record at all, or with a record that is not theirs.

  DIRECTLY OBSERVED (2026-09-07, this repo, reproducible). A from-scratch empty
  product-truth store — the exact shape a fresh install produces — does not
  merely pass; it first CRASHES. With empty flows/, mock-data/ and mockups/
  directories present, the store checker exited with an uncaught Python
  traceback because docs/product-truth/classifier/eval.jsonl did not exist.
  Only after that file was created by hand, and the derived index rebuilt, did
  the checker report success. So the day-one experience today is: crash, then
  (see UXP-700b) a success message that means nothing. Both halves are this
  L1's problem; the second half is UXP-700b's.

  This L1 pairs with UXP-700b and must not absorb it. (a) is "the empty record
  exists and works"; (b) is "the empty record cannot be mistaken for a full
  one". Building (a) without (b) produces the worse outcome of the two.

  The build_pipeline component tag is deliberate: the gap is in what install
  lays down, not only in what the ux-prototyping surface later reads.
