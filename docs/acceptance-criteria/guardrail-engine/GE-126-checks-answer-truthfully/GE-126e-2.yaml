id: GE-126e-2
title: "The census says how many checks it examined beside how many it found"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the census is run three times — once over a registration set naming no checks at all
    once over a fixture set of four checks of which exactly one is an instance and once over
    a fixture set of four checks of which one cannot be executed at all,
  When each run finishes,
  Then the first run states that it examined no checks and does not report that no instances
    were found so a run that executed nothing cannot read as a clean bill of health,
  And the second run states that it examined four and found one and names the one,
  And the third run states that it examined three attempted a fourth and could not execute it
    and names that fourth check — a check the census tried and failed to run is its own
    reported state and is never counted among the checks with no defect,
  And every run names the commit it was measured at and the date so a later reader can tell a
    current measurement from a stale one,
  And no run reports a total that exceeds the number of checks it actually executed plus the
    number it reports as unexecutable.

  Coverage note: covered by the three runs above asserting the reported examined count the
  reported found count and the reported unexecutable count in each. The empty run is the
  load-bearing one: a census that reports no instances after failing to execute anything is
  this whole goal's defect wearing the census's clothes and is the single most likely way
  this work ships broken.
