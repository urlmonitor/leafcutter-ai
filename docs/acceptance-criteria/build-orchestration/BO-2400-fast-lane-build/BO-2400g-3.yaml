    relationship: describes
    status: exists
    relevance: "The existing fan-out and the source of the third Then clause. It states it runs 'in the top-level loop (not inside a sub-agent) so the parallel dispatch respects the depth-1 sub-agent limit'. A workflow's own dispatch is top-level, so the lane CAN ask for both readers; a review agent that tried to spawn them from inside itself cannot. That is a consequence for the shape of the solution, not an instruction about how to code it."
  - path: templates/agents/find-design-smells.md
