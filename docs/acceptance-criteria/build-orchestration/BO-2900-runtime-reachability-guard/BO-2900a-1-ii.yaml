notes: |
  THIS AC COVERS CODE THAT IS ALREADY WRITTEN AND HAS NO TEST. The suspension of
  BO-2900a-1's refusal paths to report-only landed as an uncommitted change on
  branch analysis/entry-point-gate before any criterion described it. That is the
  reason this record exists and the reason it is work_status: todo rather than
  done: the behaviour is present in the tree, and nothing executes it and asserts
  the verdict is left alone. Do not flip it to done on the strength of the code
  being there — that is the exact move this whole tree exists to refuse.

  WHY THIS IS AN L3 UNDER BO-2900a-1 AND NOT A NEW L2. BO-2900a is at its
  five-L2 cap and BO-2900 is at its seven-L1 cap, so neither level had a slot.
  It would have been the wrong shape regardless: this is not a new guarantee, it
  is the state BO-2900a-1's own guarantee is held in while the judgement behind it
  is repaired. The family's precedent for the same bind is BO-2900f-2-ii, parented
  as an L3 under an existing L2 for the identical reason.

  WHY REPORT-ONLY RATHER THAN REMOVED. Three separately sufficient defects were
  measured, and each of them is a defect in the JUDGEMENT, not in the intent:
  the rule accepts a ritual invocation and refuses an honest direct-import proof
  (the opposite of what it was built for); it cannot see the subprocess proof
  shape 164 ticket files instruct authors to write, so a pure spawn passes
  silently while a hybrid spawn is refused; and it names a unit chosen from the
  proof's import list rather than from the criterion's own record. A rule whose
  verdict is wrong in both directions must stop deciding, but its findings are
  the only measurement of how large the affected population is — which is why the
  announcement is mandatory and full rather than suppressed.

  THE ANNOUNCEMENT IS THE LOAD-BEARING HALF. A suspension that silently passes
  everything is indistinguishable from a rule that found nothing, which is the
  failure shape CLAUDE.md's merge-audit section catalogues three times over. The
  count of announced findings is what BO-2900a-1-iii's re-arm corpus is measured
  against, so a suspension that stops announcing removes the evidence needed to
  end it.

  VERIFICATION MUST EXECUTE THE EVALUATION. A test that reads the rule's source
  for a report-only branch passes on a rule that never reaches it — the identical
  defect this tree derives from. The evidence has to be a real evaluation of a
  criterion the rule does reach a finding against, asserting both that the
  finding was announced and that eligibility is unchanged. Both halves in one
  run: asserting only the announcement passes an implementation that still
  refuses, and asserting only the eligibility passes one that has gone silent.

  NAMING HAZARD FOR THE IMPLEMENTER. unit_tests/ac_store/test_bo_2900a_1_ii.py
  already exists and covers BO-2900a-1, not this record — the filename is an
  artifact of a file-size split, predating this id. Do not read it as this AC's
  proof and do not add this AC's proof to it.
