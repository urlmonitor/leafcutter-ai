notes: |
  WHY AN L3. The mutation "agent_type names the specialist, so go ahead" passes GE-129d-1 (which
  launches without --agent) and GE-129d-2. Probe case (5) is the reason the Q3 rule requires
  agent_id together with agent_type. A headless `claude -p --agent commit` run is the concrete
  shortcut this closes.

  declares_side_effect: false -- the Then clauses assert a prompt or a refusal.
