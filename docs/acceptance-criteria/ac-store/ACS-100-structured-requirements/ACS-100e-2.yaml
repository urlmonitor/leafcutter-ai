criteria: |
  Given an agent template declares default_origin_agent: "business-analyst",
  When the agent explicitly sets origin_agent: "business-analyst-v3" on a specific AC,
  Then the AC file contains origin_agent: "business-analyst-v3" (the explicit value),
  And the template default is ignored for that AC,
  And other ACs created in the same session without an explicit override still use
    the template default "business-analyst".
