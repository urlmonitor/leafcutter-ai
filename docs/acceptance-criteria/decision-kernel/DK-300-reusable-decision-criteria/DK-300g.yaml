criteria: |
  Categories appear beside the decisions that used them, ready to explore.

  Published categories show up alongside the decisions that used them in the
  project's knowledge graph, so you can follow a question across every decision
  that asked it and spot groups of decisions that rest on the same concerns. The
  graph is a view built from the reviewed records, so it can always be rebuilt
  and is never the place where a category is changed.
