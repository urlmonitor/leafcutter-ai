notes: |
  TIER 2 of the resolved file-vs-symbol design question. The symbol tier only
  engages when (a) the implemented_by entry carries a #symbol anchor AND (b) the
  file still survives in the staged tree (so the file-path floor passed). It then
  parses the anchor and resolves the named symbol. A relocated/renamed/removed
  symbol is the exact "moved function inside a surviving file" staleness the user
  wants closed.

  IT-PO RESOLUTION of the open question on tooling access (2026-06-22): jcodemunch
  is MCP-only and unreachable from a subprocess hook. The symbol tier therefore
  does NOT call jcodemunch via MCP. Primary resolver = in-process Python stdlib
  AST (zero dependency, always available); optional CLI resolvers for other
  languages are add-ons gated by the GE-111b-2-i fail-open ladder. The "available
  for the file's language" phrasing in the criteria is satisfied by AST for .py
  and degrades to fail-open (GE-111b-2-i) for any language the resolver does not
  cover. This is the precise unavailability boundary the BA deferred to IT-PO.
change_target: code
risk_surface: contract_boundary
