notes: |
  USER DECISION 2026-10-09: add the complexity-reduction skill from the
  Bybit-Trader project (.agents/skills/complexity-reduction/SKILL.md) to the
  package as a template. The user chose to have this one AC hand-authored in
  the same PR instead of going through /plan-feature. It exists because the
  commit-msg hook check-package-surface-declaration requires a package_surface
  AC for a new skill_registry.json entry.

  WHAT CHANGED IN THE PORT. Every score was re-measured against the shipped
  checkers. Corrected: guard clauses do not lower the Python score; a
  comprehension's `if` filter is not counted; a nested `def` does not reset
  the enclosing function's count; `IF ... IS NULL` to COALESCE saves 1, not 2;
  each additional CTE in one WITH clause costs nothing. Added: notice text is
  scanned, so a RAISE NOTICE message containing "for", "and" or "with" scores.
  The fix is to reword the message, never to remove it. Removed: hard-coded
  limits (the source said SQL 65; the package ships 75), Poetry-only commands,
  and trading-domain examples.

  PLACEMENT. GE-120h ("a check the package says protects you is actually
  switched on") is the closer theme, but it already holds 5 L2s, the cap.
  CR-100b ("every finding tells you the exact fix") had one child and fits the
  refusal's prescription.

  KNOWN GAP, NOT FIXED HERE. python-coder's registry entry (skills_invoked)
  does not list complexity-reduction, although its template invokes it. That
  belongs to the AR-300 / INF-600 records, not this one.
