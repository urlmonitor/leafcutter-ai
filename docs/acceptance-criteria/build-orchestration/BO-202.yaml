doc_links:
  - path: docs/architecture/components/phantom-done-prevention.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-047-single-writer-ticket-close-path.md
    relationship: context
    status: exists
    relevance: "The single-writer principle for a ticket's done state: the finished state is written only by the mechanism that checks it. This AC applies the same principle to an AC's work_status, with mark_ac_done.py as the one writer."
  - path: docs/acceptance-criteria/build-orchestration/BO-2500-mechanical-done-proof/BO-2500b-1-iii.yaml
    relationship: context
    status: exists
    relevance: "The commit-time composite rule (covered_by holds child AC ids, at any level; test-path entries never make an AC composite) that the mark-time writer must share rather than copy."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment: null
  reference_file_path: scripts/ac_store/mark_ac_done.py
  n_location_rule: "1 -- the work_status write path in mark_ac_done.py, which becomes the one writer the gate calls. The shared helper in check_done_proof.py and the gate template's Steps 2b, 2f and 3a are companion edits named in constraints."
  required_skills:
    - python-coder
    - test-writer
    - llm-expert
  post_write_commands:
    - "python scripts/build.py"
    - "python -m pytest tests/ac_store/test_mark_ac_done.py unit_tests/ac_store/test_acs200f_3_mark_ac_done_anchored_write.py tests/test_ac_fulfillment_gate.py"
  constraints:
    - "One writer: every work_status change the ac-fulfillment-gate makes goes through scripts/ac_store/mark_ac_done.py. The gate's Step 3a calls mark_ac_done.py --ac <id> --test-root . instead of editing the AC YAML itself. No second route that writes work_status may remain in the gate (ADR-047's single-writer principle, applied to AC work_status)."
    - "One composite rule, shared and not copied: an AC is composite when _composite_child_ids(covered_by) is non-empty, and it is proven when _unproven_composite_children returns nothing. These are the helpers check_done_proof.py already uses at commit time (BO-2500b-1-ii, BO-2500b-1-iii). mark_ac_done.py imports them from one place, so the mark-time and commit-time rules cannot drift. A covered_by entry that is a test-file path never makes an AC composite."
    - "Composite outcomes: if every child is done and proven, set done. If the composite is todo or in_progress and any child is not done and proven, set in_progress, succeed, and name each unfinished child in the output the gate copies into its sign-off. If the composite is already done and any child is unproven, refuse: the caller must be able to tell the refusal from success (non-success exit), the output names each unfinished child, and the file is left unchanged. work_status is never lowered silently."
    - "Leaves unchanged: an AC whose covered_by holds no child AC ids keeps today's behaviour, including the ACD-600a contract (preconditions, messages, exit codes, idempotence) and ACS-200f (a genuinely covered AC can be marked done through the normal path)."
    - "Writes stay anchored and atomic (ACS-200f-3): the in_progress write changes only the work_status line, exactly as the done write does, and leaves every other byte of the record unchanged."
    - "Idempotent: re-running on an in_progress composite whose children have not changed leaves the file byte-identical. Once every child is done and proven, the next run sets done."
    - "ADR-001 parity: scripts/commit_guardian/check_done_proof.py and its packaged copy templates/scripts/commit_guardian/check_done_proof.py change together through python scripts/build.py. The shared helper must be importable from both deployed locations (.leafcutter/scripts/ac_store/ and .leafcutter/scripts/commit_guardian/), so verify it from the deployed layout, not only from the dev tree. check_done_proof's own verdicts must not change (BO-2500b-1-ii and BO-2500b-1-iii tests stay green)."
    - "Companion prompt edit in the same ticket (llm-expert surface, templates/agents/ac-fulfillment-gate.md): Steps 2b and 2f use the covered_by composite rule at every level, not only L0/L1, and stop counting child AC ids as test coverage for an L2. Step 3a calls the script and reports its outcome (done; in_progress with the unfinished children; refused) in the sign-off audit list. This edit does not settle the open reopen question in notes (extend the gate to L3 and unit_tests/, or narrow the covered_by clause)."
