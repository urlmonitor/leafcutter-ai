id: ACS-100h-7-i
components:
  - ac-store
title: "When the AC tree is already at the limit and cannot be auto-split, the scaffold error tells the author to split first"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Scenario: Target subtree is already at or over the limit at scaffold time
    Given an author triggers /create-epic and the target AC subtree already has a
      parent whose ID-derived child count is at or over its effective limit (so the
      new epic's ACs cannot be added without exceeding it),
    When the scaffold-time AC-tree-limit check runs before stub generation,
    Then the scaffold is blocked and the error explicitly states that the AC tree
      must be split BEFORE scaffolding can proceed,
    And the error names the over-limit parent and points the author to the
      ac-tree-split procedure (Pattern A for an over-limit L0, Pattern C for an
      over-limit L1),
    And no Master_Plan or ticket stub file is written.

  Scenario: Auto-split is not possible at scaffold time
    Given the scaffold step cannot itself perform a structural split safely
      (splitting is a user-confirmed, multi-gate procedure per ACS-100h-3),
    When a limit violation is detected,
    Then the scaffold step does NOT attempt an automatic rename-based
      redistribution,
    And the error makes clear the split is a separate, author-driven step (and
      that child_limit_override on the parent is the documented temporary escape
      hatch when a structural split is not yet warranted, per ACS-100h-6).
depends_on: [ACS-100h-7, ACS-100h-7b]
