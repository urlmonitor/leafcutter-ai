notes: |
  Satisfies the parent L1's second `documentation_trigger` (`sequence-diagram`).

  Intended agent is `architecture-diagram-author` — left null per this run's
  instruction.

  COLLISION FLAGGED DELIBERATELY. BO-2500a-5 already requires a sequence diagram of
  done-proof evaluation "from covers tag to done verdict". This AC changes that
  sequence by inserting a third condition. Two diagrams of the same sequence, one of
  them stale, is worse than none — so the criteria name the existing diagram and
  require the writer to reconcile with it. This is the kind of duplication a
  per-tree decomposition normally creates and nobody notices until both are wrong.

  WHY THE OBSERVATION STEP IS CALLED OUT IN THE DIAGRAM. The single most likely
  misimplementation of this tree is deciding reachability by reading source text
  (see BO-2900a-2). A diagram that draws that step ambiguously will be used as
  licence for the cheap version, so the criteria constrain how it is drawn.

  The three-terminal-outcomes clause exists so the diagram cannot collapse the two
  refusals into one "rejected" box — they have different causes and different
  remedies, and BO-2900e requires the message to distinguish them.

  2026-08-13 (IT PO enrichment). Assigned to architecture-diagram-author rather than
  documentation-expert: the S7b documentation-gate mapping routes the
  `sequence-diagram` trigger to that agent, the registry lists it as a dispatchable
  ticket-phase agent, and the BA recorded the same intent. The task brief's
  "all eight documentation ACs go to documentation-expert" is deliberately deviated
  from for this AC and BO-2900b-5 only, and the deviation is reported.
