assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    orphan_runner_removal:
      type: object
      description: "Removal record for the orphaned fast-lane runner: the workflow source is deleted, no deployed layout contains it after a build, no command or workflow routes to it, and the grep-only test that asserted a string inside it is deleted or re-pointed at executed behaviour. Ordered strictly after the caching wiring lands."
  reference_file_path: "templates/workflows-js/fast-lane-build.js"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/ -q"
  constraints:
    - "Ordering is a hard prerequisite, not a preference. BO-2400c-1-iii must be implemented first. Until the running lane consumes the layer, this orphan is its only production reference, and removing it converts a tested, documented capability into dead code without anyone deciding to."
    - "The grep test at unit_tests/workflows/test_bo2400a_runner_wiring.py:401 asserts the literal 'assemble_context_bundle' appears in the file being deleted, so the deletion breaks the suite by construction. Delete that test alongside the file, or re-point it at the executed coverage authored under BO-2400c-1-iii. Do not re-create the string, relax the assertion, skip the test, or re-aim it at another file that happens to contain the name — every one of those keeps the same worthless proof alive under a new address. The neighbouring telemetry grep test in the same class is in the same position and needs the same decision."
    - "The build's agent-support deploy manifest (scripts/build_phases.py, AGENT_SUPPORT_SCRIPT_FILES) justifies shipping scripts/injection_builders.py by citing fast-lane-build.js as its caller. That justification must be re-pointed at fast-lane-ship.js in the same change, or the module's only recorded reason to be deployed disappears with the orphan and a future cleanup drops it from the manifest — which would break the deployed command surface added by BO-2400c-1-ii."
    - "Sweep every remaining reference before declaring the removal complete: command templates, workflow registries, the docs index, how-to guides, and the known-issues entry. A dangling reference to a deleted workflow is the next KI."
    - "This criterion is a deletion, so the evidence is EXECUTED rather than grep-shaped in the usual sense: run the build and assert the deployed workflows directory no longer contains the file, and run the full suite green with no residual grep-only test standing in for the deleted one. Confirming absence in the source tree alone is not enough — the file is a build output as well as a source file. A source grep passes on dead code, and that is exactly how the deleted assertion earned its place here: it asserted a NAME appeared in an orphaned file and thereby kept a dead reference looking alive while the function it named had never executed once, alongside roughly 25 other green tests."
    - "Record the decision in the known-issues entry rather than leaving KI-BO-006 open — the entry explicitly asks for a capability decision, and the decision taken here is 'wire it, then delete the orphan'."
delivers_to:
  agent: python-coder
  contract: "A package with exactly one fast-lane runner, and no test whose only assertion is that a function name appears somewhere in a file."
expects_from:
  ac_id: BO-2400c-1-iii
  contract: "The live lane consuming the prompt-caching layer, which is what makes the orphan's last unique reference redundant."
test_required: true
test_spec:
  - name: test_deployed_layout_has_no_orphaned_fast_lane_runner
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: deployed
    description: "After a build, the deployed workflows directory contains the shipping lane and no second fast-lane runner."
  - name: test_no_command_or_workflow_routes_to_the_removed_runner
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: reachability
    description: "No command template, workflow registry entry, or deploy manifest resolves to the removed runner, so nothing can dispatch a file that no longer exists."
  - name: test_injection_builders_still_deployed_after_the_removal
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: deployed
    description: "The prompt-caching module is still present and executable in the deployed layout after the orphan is gone, so removing its former caller did not remove its reason to ship."
