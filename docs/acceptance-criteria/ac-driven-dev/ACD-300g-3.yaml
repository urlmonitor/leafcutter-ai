  proves_clause: 'the commit message first line contains: the text "plan-feature", the stage name (one
    of "PO", "BA", "IT-PO", "TEST-DESIGN-HANDBACK" for the test design committed before a hand-back round,
    or "TEST-DESIGN" for the final commit), and the target component name'
  code_file: templates/workflows-js/plan-feature.js
- name: test_acd_300g_3_body_lists_every_ac_id
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: criterion
  description: 'commitStageOutput via run_isolated_e2 (unit_tests/_plan_feature_e2_runner.py) with written
    [ACD-300g, ACD-300g-1, ACD-300g-2]: the message body carries ''AC IDs: ACD-300g, ACD-300g-1, ACD-300g-2''.'
  proves_clause: the commit message body lists every AC ID included in the commit (e.g. "ACD-300g, ACD-300g-1,
    ACD-300g-2")
  code_file: templates/workflows-js/plan-feature.js
- name: test_acd_300g_3_body_marks_mid_pipeline_or_final
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: criterion
  description: 'commitStageOutput via run_isolated_e2 (unit_tests/_plan_feature_e2_runner.py) with isFinal
    false and then true: the body says ''mid-pipeline commit'' and ''final commit of run'' respectively,
    never both.'
  proves_clause: the commit message body states whether this is a mid-pipeline commit or the final commit
    of the run
  code_file: templates/workflows-js/plan-feature.js
