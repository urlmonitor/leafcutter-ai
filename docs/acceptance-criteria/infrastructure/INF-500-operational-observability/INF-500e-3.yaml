it_requirements:
  - "Identity resolution is scripts/agent-health/weekly_health.py::ac_key(path) -> str | None and must return the filename STEM, never the path. It must return None for a non-YAML path and for the registry index.yaml, and it must be the single derivation used by both work_status_at and ac_birth_dates. Two independent derivations would drift, and a path-keyed count inflates filed and done on every folder move."
  - "The exclusion of index.yaml must be a property of the filename, not a hard-coded directory list, so a registry added under a new component is excluded automatically. Same rule for the non-YAML skip: it is the suffix that disqualifies a file, not its name."
  - "The snapshot reader weekly_health.py::work_status_at(repo, rev) must return dict[str, str] keyed by identifier, must read the store AT a revision rather than from the working tree, and must return an empty mapping — not raise — when the store did not exist at that revision. A missing store at the start of the reporting range is an ordinary case, not an error."
  - "The birth index weekly_health.py::ac_birth_dates(repo, ref) -> dict[str, date] must be built by walking the history ONCE for the whole store rather than following each record individually. Keying on the identifier and keeping the earliest add per identifier is what makes a moved record retain its true age instead of resetting to the move date; the git log walks newest-first, so a later-encountered add for a known key is the older one and must win."
  - "Age collection is weekly_health.py::collect_cycle_times(after, before, births, period_end) -> list[int] and must include a criterion only when it is done in the end snapshot and was NOT done in the start snapshot. It must take the births index as an argument rather than reading git itself, so the ages of a period are computable from literal inputs."
  - "Per the project error-handling policy every git invocation here goes through weekly_health.py::run_git with tolerate_failure set, so a missing ref or an empty grep result yields empty output rather than an unhandled CalledProcessError. Do not add a bare except around these calls."
  - "KNOWN LIMITATION, do not silently fix here: the single-pass birth index does not follow renames, so a criterion given a NEW identifier reads as newly born and understates its cycle time. That cost is accepted by this record's notes; specifying rename-following is a separate criterion with a very different cost profile, and adding a per-record git log --follow would change the runtime characteristics of the whole report."
