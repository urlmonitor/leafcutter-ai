id: GE-125c-4
components:
  - security_scanner
  - commit_guardian
title: "The reference says the reduced check is decided one result at a time, and says it in one place for the whole goal"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the reference material that describes when the secrets check gives
    something less scrutiny than usual,
  When a reader wants to know what a reduced check applies to,
  Then the reference states that the reduction is decided one result at a time and
    that no file is ever set aside as a whole,
  And it names the closed list of explanations that can account for a value and
    states that anything the list does not describe is reported,
  Because the reference today describes the reduction as belonging to whole files
    in named locations, which is the behaviour this L1 removes — a reader left with
    that text will keep expecting a file to be quiet and will not notice when it
    stops being.

  Given the same reference,
  When a reader wants to know whether where a value sits inside its line affects
    what happens to it,
  Then the reference states that the judgement is made on the value itself rather
    than on the shortened copy kept to show where it was found, so an explanation
    appearing late in a long line counts exactly as one appearing at the start,
  Because the shortened copy is the defect the parent L1 exists to name, and a
    maintainer who cannot see this stated will reintroduce it the first time the
    reduction is extended.

  Given the same reference and the sibling L1s of this goal, each of which also
    asks for the reference to be corrected,
  When the reference is rewritten,
  Then the corrected description of when the check looks less exists in exactly one
    place, covering all four L1s of this goal together, with no second home opened
    for any part of the same statement,
  And every behaviour the reference attributes to the reduced check is one the
    check actually has, and every behaviour the check has around the reduction is
    one the reference does not omit,
  And where the two disagree the implementation is authoritative and the
    disagreement is raised as a defect against the code criterion that owns it
    rather than written down as fact,
  Because the L0 asks for a single consolidated rewrite rather than four documents,
    and because a reference that overstates the checking reproduces the exact false
    confidence this goal exists to remove.
depends_on:
  - GE-125c
assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "THE REFERENCE IS MISSING BY OMISSION, NOT WRONG — SO THE FIRST OF THE FOUR SIBLINGS TO BE BUILT CREATES THE PASSAGE AND THE OTHER THREE AMEND WHAT IT CREATED. `templates/skills/security-scanner/SKILL.md` carries NO description of the reduced scrutiny at all (measured during decomposition and recorded in the L0's adjudication and in GE-125a-3's notes). There is no passage to amend. Before writing, check whether GE-125a-3, GE-125b-4 or GE-125d-5 has already created it; if so, ADD only the part this L1 changes and do not open a second home. This is a sequencing constraint, deliberately NOT expressed as depends_on edges between the four L1s, because the coupling disappears the moment the passage exists."
  - "THE TARGET FILE IS A TEMPLATE, AND A DEPLOYED-COPY-ONLY EDIT IS REVERTED BY THE NEXT BUILD. Write to `templates/skills/security-scanner/SKILL.md`; the copy under `.claude/skills/security-scanner/` is a build output per ADR-001. Run `python scripts/build.py --target-dir .` after editing and confirm the deployed copy carries the new passage. An edit made only to the deployed skill disappears silently."
  - "THIS FILE IS ALSO A PROMPT SURFACE, NOT ONLY A DOCUMENT. `SKILL.md` is loaded as instructions to an agent, so a sentence describing what the check does is also a sentence telling an agent what to expect. Keep the passage descriptive and factual; do not phrase it as an instruction that would change how the security-scanner skill behaves. If the wording starts to read as guidance rather than description, hand that portion to `llm-expert` rather than resolving it as prose."
  - "WRITE IT AGAINST THE SHIPPED RESULT, OR MARK IT EXPLICITLY PENDING. The behaviour described here is introduced by GE-125c-1, GE-125c-2 and GE-125c-3. Written before they land, the text documents an intention — which is the exact failure the third arm forbids. Either build this after those three, or land it with an explicit pending marker and re-verify every sentence once they are done. A pending marker is not optional cover: it must be removed by a re-check, not by time passing."
  - "THE PARITY REVIEW RUNS IN BOTH DIRECTIONS AND IS THIS RECORD'S SUBSTITUTE FOR A TEST. Nothing may be claimed that the check does not do, and nothing the check does around the reduction may be omitted. Perform it by reading the SHIPPED `templates/scripts/commit_guardian/check_secrets.py` and `templates/skills/security-scanner/scripts/scan_secrets.py`, not the acceptance criteria — the criteria describe the intent and the code describes the behaviour, and where they disagree the code is authoritative and the disagreement is raised as a defect against the code criterion that owns it."
  - "THE STATEMENT MOST AT RISK IS THE WHOLE-VALUE ONE, AND IT MUST NAME THE HAZARD IT PREVENTS. State plainly that the judgement is made on the matched value itself — and on the whole line where surrounding context is needed — rather than on the shortened copy kept to show the author where the value was found, and that an explanation appearing late in a long line counts exactly as one appearing at the start. A reader cannot verify this from the document alone, and it is the statement a future maintainer is most likely to invalidate without noticing, which is precisely why omitting it is not an option."
  - "NAME THE CLOSED LIST AS A CLOSED LIST, WITH REPORT-BY-DEFAULT STATED. Enumerate the recognised explanations and say explicitly that anything the list does not describe is reported. Describe the list by reference to where it is defined rather than transcribing a regex, so the document cannot drift into being a second, stale definition of the recognition."
  - "EXAMPLES MUST NOT CONTAIN CREDENTIAL-SHAPED LITERALS. This material is scanned on every commit, so a realistic-looking example would either trip the check or need a suppression of its own. Describe the value shapes in words, as the neighbouring documentation criteria in the GE-123 tree do, and do not add a `.security-allowlist` entry to make an example committable."
  - "NO EXAMPLE MAY BE WRITTEN AS A LONG LINE WHOSE INTERESTING PART SITS PAST THE 120TH CHARACTER. That would be a live instance of the defect being documented. Keep every line of the new passage well under 120 characters, and verify it rather than assuming it."
  - "DO NOT DESCRIBE A PLANNED NARROWING AS THOUGH IT HAD LANDED. GE-125d-5 asserts this rule for the whole goal; it binds this passage too. Any part of the reduction that is still only proposed — including anything from the sibling L1s not yet built — is either omitted or marked as not yet in effect, never written in the present tense."
  - "NO SECOND HOME FOR ANY PART OF THE STATEMENT. Do not restate the reduction in `docs/how-to/managing-pre-commit-hooks.md`, in a component architecture document, or in a new file. If another surface already says something about the reduction that now contradicts the consolidated passage, correct it by pointing at the consolidated passage rather than by re-explaining — two homes for one statement drift, and the drifted copy is the one someone reads."
test_required: false
test_rationale: |
  This criterion changes prose only, so it carries no executable behaviour and
  test_required is false rather than test_spec being left empty. What stands in
  place of a test is a review against the shipped check, in both directions:
  nothing claimed that the check does not do, nothing omitted that it does. The
  claim most at risk is the second one — a reader cannot verify from the document
  alone that the judgement uses the whole value, and it is the statement a future
  maintainer is most likely to invalidate without noticing. Mechanising the parity
  review would mean reading the check's own description of its reductions and
  comparing it against the document, which is a code criterion of its own and is
  out of scope here.
