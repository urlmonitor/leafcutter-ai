notes: |
  CREATED 2026-09-08 by IT PO v3 as one half of a split of ACD-400e-1 (now
  status: superseded_by). Sibling: ACD-400e-1a.

  WHY THE SPLIT — the full reasoning is recorded in ACD-400e-1a's notes and is
  not repeated. In short: two deliverables, two file types, two owning agents,
  and a circular dependency against ACD-400e-3 that the split removes.

  CRITERIA ARE VERBATIM. This AC holds the Given clause of ACD-400e-1 (as
  context) plus its When clause, second Then clause and closing And clause,
  unaltered. ACD-400e-1a holds the Given plus the first Then. Their union is the
  original text; nothing was invented, narrowed or added.

  WHY THIS IS THE LARGEST AC IN THE TREE. It is the only one that must read a
  human-written page, derive an executable store description from each entry,
  and run the queue once per entry. The temp-store fixture builder from
  ACD-400c-1 covers the materialisation half, which is the reason the estimate
  is L and not larger.

  THE ONE THING THAT MAKES THIS AC WORTH BUILDING is that the verdict set is
  read from the page. Implemented with a hardcoded verdict list it becomes an
  ordinary duplicate of the ACD-400c and ACD-400d pinning tests, and the page it
  was built to guard goes unguarded. That constraint is stated first in
  it_requirements for that reason.
