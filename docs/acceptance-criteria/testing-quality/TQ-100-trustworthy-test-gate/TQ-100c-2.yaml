id: TQ-100c-2
components:
  - testing_quality
title: "A done-AC test has no in-test path to downgrade itself to informational"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100c.yaml
criteria: |
  Given a test function tagged "# covers: <AC-ID>" whose AC's work_status is done,
  When the test author attempts to make that test non-blocking by editing only
    the test (for example adding a skip/xfail marker or otherwise self-declaring
    it informational),
  Then the test remains enforced because its covering AC is done
  And the informational/enforced decision is taken from the covering AC's
    work_status, never from a marker the test sets on itself
  And the only sanctioned way to accept a failing done-AC test is the tracked
    allowlist (TQ-100d), not an in-test downgrade.
