id: AR-400b-3-i
title: "research-agent is granted knowledge-query, which its routing table already tells it to use, and can invoke it"
component: agent-registry
components:
  - agent_registry
  - skills_system
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given research-agent's definition in the package's real tree, whose routing
    table tells it to load the "knowledge-query" ability for cross-surface
    knowledge-graph questions,
  When the build compiles research-agent's prompt,
  Then research-agent's own definition grants "knowledge-query", with a
    condition stating it applies to cross-surface knowledge-graph questions,
    And the compiled prompt's abilities section lists "knowledge-query" with that
      condition,
    And the tools research-agent is permitted to use include the means by which
      an ability is invoked,
    And the build reports no "ability exists but is not granted" finding for
      research-agent.
depends_on:
  - AR-400b-3
doc_links:
  - path: templates/agents/research-agent.md
    relationship: modifies
    status: exists
    relevance: "Routing row at line 145 (dated snapshot) names knowledge-query; no skills: block; tools has no Skill."
  - path: docs/acceptance-criteria/agent-registry/AR-200-capability-matches-obligation/AR-200b-2.yaml
    relationship: related
    status: exists
    relevance: "A non-empty grant must be matched by the ability-invoking tool; the third clause is that rule's instance."
assigned_agent: llm-expert
estimated_complexity: S
change_target: prompt
risk_surface: internal
it_requirements:
  - "Add to templates/agents/research-agent.md frontmatter a `skills:` entry for knowledge-query with mode: conditional and a condition naming cross-surface knowledge-graph questions (AR-300a-2 refuses a conditional grant without a condition)."
  - "Add `Skill` to research-agent's `tools:` line without removing or reordering any existing tool (the line is a long comma-separated list of search tools); AR-200b-2's tool-grant validator refuses the grant otherwise."
  - "The registry copy is regenerated by the commit-time transform hook, never edited by hand."
test_spec:
  - name: test_compiled_research_agent_lists_knowledge_query_with_condition
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: integration
    angle: deployed
    description: "Compile research-agent from the real template; the delivered abilities section lists knowledge-query, mode conditional, with the knowledge-graph condition text."
  - name: test_research_agent_tools_gain_skill_and_keep_every_existing_tool
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: integration
    angle: criterion
    description: "research-agent's declared tools equal the pre-change set plus exactly Skill (exact-token comparison of the full set)."
    must_catch:
      - "a search tool is dropped while editing the tools line"
      - "the grant is added without the Skill tool"
  - name: test_validator_has_no_not_granted_finding_for_research_agent
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "The validator over the real tree reports no 'not granted' finding for research-agent."
test_rationale: >-
  The tool-set descriptor compares the whole set because the realistic
  regression is collateral damage to a long tools line.
delivers_to: null
expects_from: null
origin_agent: BrainCandy
created: 2026-10-12
created_by: docs/acceptance-criteria/agent-registry/AR-400-sound-specialist-setup/AR-400b-3.yaml
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  The instance the L1 calls "hidden in today's noise". research-agent's tool
  list is a long comma-separated line of search tools; adding the
  ability-invoking tool to it must not drop any of them -- assert the full
  permitted set before and after, not only the new member.
