criteria: |
  Given the product-truth generation flow's step links have been corrected per UXP-590-1,
  When the product-truth generator runs over the store,
  Then the by_ac entry for UXP-510 names exactly the nodes map and derive of that flow,
  And the by_ac entry for UXP-511 names exactly the invert node,
  And the by_ac entry for UXP-512 names exactly the backref node,
  And the by_ac entry for UXP-513 names exactly the validate node,
  And the by_ac entry for UXP-514 names exactly the validate node,
  And the product_truth back-reference on each of UXP-510..UXP-514 equals its by_ac entry,
  And no by_ac entry or AC back-reference names a node of this flow that the step links
    no longer support (for example UXP-511 -> derive or UXP-513 -> backref),
  And each step's impl_status equals the value recomputed from its linked ACs' work_status,
  And a following run of the generator in check-only mode reports no pending change
    and the product-truth validator reports zero errors.
