  constraints:
    - "ENFORCEMENT SURFACE: a new commit-guardian hook `check-reachability`, implemented as scripts/commit_guardian/check_reachability.py with two modes (`--mode precommit`, `--mode ci`), registered in the hooks_manifest of scripts/commit_guardian/commit_guardian.json AND its template twin templates/scripts/commit_guardian/commit_guardian.json (n_location_rule 'all' — the check-hook-parity hook enforces this), plus a CI job in .github/workflows/ci.yml running `--mode ci`. This mirrors the proven check_done_proof.py two-layer precedent; do not invent a third gate convention."
    - "Create the shared seam scripts/commit_guardian/_reachability_inventory.py exposing registered_capabilities(surface_module) -> set[str] and collected_invocations(script_paths) -> list[Invocation]. BO-2900c consumes the SAME module for the reverse direction — one seam, two verdicts. Do not fork it."
    - "registered_capabilities MUST be obtained from the BUILT surface: import the surface module, call its own parser builder (fast_lane._build_cli_parser(), scripts/build_orchestration/fast_lane.py:775) and read the argparse _SubParsersAction choices keys. Never regex `add_parser(` out of the source, and never top up the built inventory with source-scanned extras — that reintroduces exactly the false alarms the conditional-registration clause forbids."
    - "REFUSES, NOT WARNS: a finding must produce a non-zero exit from the hook and the CI job. Do not add a global advisory/downgrade flag. The only sanctioned relief is a recorded exemption per BO-2900d-1. The failure output must not print SKIP=check-reachability or --no-verify (BO-2900e-1 final clause, BO-2900b-1-i)."
    - "Every new module (check_reachability.py, _reachability_inventory.py) and config/reachability_exemptions.yaml MUST be added to the build deploy manifest in scripts/build_phases.py in the same change. The hook runs from the DEPLOYED layout; an undeployed dependency crashes with ModuleNotFoundError once the gate is required — see CLAUDE.md 'New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest'."
    - "The set of surfaces to inventory is derived, not hardcoded (see BO-2900c-4); at minimum it must include scripts/build_orchestration/fast_lane.py. Importing a surface module must not execute its main() — build the parser only."
