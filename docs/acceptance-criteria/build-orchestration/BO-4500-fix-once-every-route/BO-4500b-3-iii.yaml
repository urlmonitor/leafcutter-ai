criteria: |
  Given a first commit attempt offering the paths scripts/x.py and unit_tests/test_x.py with the
    message file .pending/commit-msg.txt,
  And its reply carries commit_answer.status hook_failed with a handoff naming
    code-refactoring-specialist,
  And the specialist then reports that it also changed scripts/x_helpers.py,
  When the COMMIT-ANSWER block's decision is taken on the first reply and again after the
    specialist reports,
  Then the first decision is engage code-refactoring-specialist,
  And the next decision re-offers exactly scripts/x.py and unit_tests/test_x.py with
    .pending/commit-msg.txt, and not scripts/x_helpers.py.

  Given that re-offer's reply again carries hook_failed with a handoff naming
    code-refactoring-specialist,
  When the decision is taken,
  Then it is report, naming both hook_failed answers in order,
  And no second engagement of any specialist is decided for that commit.

  Given the specialist, once engaged, declines or returns a reply that cannot be read,
  When the decision is taken,
  Then it is report, naming the specialist and quoting its reply bounded to 2 KB,
  And no re-offer is decided.

  Given the re-offer's reply carries reason_code step_index_locked,
  When the decision is taken,
  Then it is retry with the identical path list and message file, counted against the same
    transient-retry ceiling, with no further engagement.
