title: "Router reads only the unresolved feedback set as its work queue"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given debugging/logs/feedback.jsonl contains 5 entries:
    - F1 with no resolved_at field (unresolved)
    - F2 with no resolved_at field (unresolved)
    - F3 with resolved_at set to a past timestamp (already resolved)
    - F4 with no resolved_at field (unresolved)
    - F5 with resolved_at set to a past timestamp (already resolved)
  When the router builds its work queue at the start of a run,
  Then it queries the feedback corpus for the unresolved set only
    (aggregate.py --unresolved --format json),
  And the work queue contains exactly F1, F2, and F4,
  And F3 and F5 are excluded from the queue without being read into processing,
  And the count of queued entries (3) is reported before any classification begins.
depends_on: [ACD-1500a]
