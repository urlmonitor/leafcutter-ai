  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an open fault entry whose subject is a requirement that reads finished, and
    for which the evidence of delivery is present,
  When the retire outcome is applied to that entry,
  Then the entry no longer reads as outstanding,
    And it carries the evidence the retirement rested on and the date it was
      retired,
    And its original text is still present and readable in full,
    And a fresh read of the register afterwards, in a new process, returns the entry
      as retired rather than open.

  Given an open fault entry whose subject's delivery cannot be established from
    either record,
  When the retire outcome is attempted,
  Then the entry stays open,
    And the ambiguity is recorded on the entry, naming what could not be
      established,
    And the entry is not retired.

  Given an open fault entry whose subject is a requirement that reads unfinished,
  When the register is reconciled,
  Then the entry is not retired,
  So retirement never runs ahead of the delivery it claims.

  Given a retired fault entry,
  When someone searches the register for the finding it recorded,
  Then the finding is still found,
  So retiring an entry removes it from the list of outstanding problems and never
    from the record.
