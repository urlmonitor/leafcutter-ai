id: TQ-500g-1-viii
components:
  - testing_quality
  - build_orchestration
title: "On /build-epic, a ticket cannot be committed until both gate verdicts are on record for it, and a missing or unreadable one stops the commit"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an epic driven through /build-epic with six tickets, each about to
    start its commit phase —
      B1: the red-baseline reader's verdict (passed) and the wrong-version
          runner's verdict (continue) are both on record for it,
      B2: the red-baseline verdict is on record, and no wrong-version verdict
          is,
      B3: the wrong-version verdict is on record, and the red-baseline record
          is present but cannot be read (it is cut off part way),
      B4: both verdicts are on record, and the wrong-version verdict is stop,
          because "drop the retry_due condition" survived its test,
      B5: it has no source requirement, and both verdicts on record read "not
          applicable: no source requirement",
      B6: both verdicts are on record, but its code changed after the
          wrong-version verdict was reached,
  When each ticket's commit phase is about to start,
  Then B1 goes on to its commit,
    And B2 does not reach its commit: the drive stops the ticket, naming the
      missing wrong-version verdict,
    And B3 does not reach its commit: the drive stops the ticket, naming the
      red-baseline verdict as unreadable,
    And B4 does not reach its commit, naming the surviving wrong version, even
      if the supervisor's own summary says the ticket is ready,
    And B5 goes on to its commit, and is not recorded as verified,
    And B6 does not reach its commit, naming the wrong-version verdict as out
      of date for the code as it now stands,
    And the check reads the verdicts as the red-baseline reader and the
      wrong-version runner left them, never the supervisor's account of them.
depends_on:
  - TQ-500g-1
  - TQ-500g-1-vii
  - TQ-500f-3-iv
