notes: |
  The user did not ask for this record. Under the current batch-level rule
  (BO-2400a-3-v), a backfill criterion in the same batch as a red-first criterion passes
  the red gate on the other criterion's red test, and its own tests are never shown to
  constrain anything. That is the same "accept tests that pass against a broken
  implementation" outcome the user ruled out. Kept narrow: the green_at_baseline tests
  of a partially-implemented red-first criterion (the TKT-600a-1 case) are still not
  mutation-proven. Whether they should be is an open question for the user.
