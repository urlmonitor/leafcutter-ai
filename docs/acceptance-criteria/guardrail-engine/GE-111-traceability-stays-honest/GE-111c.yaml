documentation_rationale: "Internal scoping rule of an existing commit-time guardrail; no new user-facing surface or command — the user-facing behavior is documented on GE-111a."
notes: |
  PO authoring note (for the BA). This mirrors the well-established
  staged-files-only scoping that other guardrail hooks already follow
  (check_ac_circular_deps only reports cycles involving a STAGED AC;
  check_ac_schema Phase 2 inspects diff-filter M staged files; ACS-400e-2
  "only staged AC YAML files are inspected"). Decompose against that precedent:
  the trigger set is the source files in the commit, and the ACs to evaluate are
  those whose implemented_by references one of those files (or, at symbol level,
  a symbol within one of them). A broken link whose source file is NOT in the
  commit is out of scope for THIS commit (it should be surfaced by a separate
  store-wide scan, not the pre-commit gate — note for IT-PO, do not conflate the
  two). Pairs with the fail-open precedent in GE-107 / GE-100.
change_target: code
risk_surface: contract_boundary
