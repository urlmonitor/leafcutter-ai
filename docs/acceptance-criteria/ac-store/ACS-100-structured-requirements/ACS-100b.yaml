id: ACS-100b
title: "Feature folders with hierarchical IDs"
component: ac-store
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Given a component directory in docs/acceptance-criteria/,
  When a feature is scoped,
  Then ACs are organized as {component}/{PREFIX-NNN-feature-slug}/ subdirectories
  And L0 gets a round number ID (e.g. ACS-100)
  And L1s get letter suffixes (ACS-100a, ACS-100b)
  And L2s get letter suffixes on L1 (ACS-100a-1, ACS-100a-2)
  And L3s get roman suffixes on L2 (ACS-100a-1-i)
  And the tree structure is reconstructable from IDs alone.
depends_on: [ACS-100a]
