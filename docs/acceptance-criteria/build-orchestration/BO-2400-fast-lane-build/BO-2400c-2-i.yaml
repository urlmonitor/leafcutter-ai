id: BO-2400c-2-i
components:
  - build_orchestration
  - injection_builder
title: "A prefix that changes mid-drive shows in the record as a break, never as a clean anchor"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a fast-lane drive in which the stable prefix presented to a later
    context-carrying invocation differs by at least one byte from the prefix presented
    to the first one — whatever the cause: a stable source re-read and re-rendered
    mid-drive, volatile content leaking in front of the breakpoint marker, a retry that
    recomposed the prompt, or a dispatch composed without the obtained bundle at all,
  When that drive's terminal record is read after the drive,
  Then the context-reuse statement reports that the anchor did not hold for the drive,
  And it reports how many distinct prefixes the drive presented and identifies the first
    invocation whose prefix differed from the drive's first one,
  And the count of invocations sharing the drive's first prefix is reported as smaller
    than the count of context-carrying invocations — on a drive whose prefixes differed,
    the record never reports the total as the shared count,
  And the statement is still present with its counts rather than being omitted or
    emptied, so a drive whose anchor broke is distinguishable from a drive that never
    measured at all.
depends_on: [BO-2400c-2]
