criteria: |
  Given the canary invocation for Check D does not complete within its bounded
    time limit,
  When the probe runs,
  Then the probe terminates the canary invocation, Check D fails, `canary` is
    false in the JSON result, the probe exits non-zero, and stderr states that
    the canary timed out.
  And a timeout is never treated as a pass or as "assume OK".
