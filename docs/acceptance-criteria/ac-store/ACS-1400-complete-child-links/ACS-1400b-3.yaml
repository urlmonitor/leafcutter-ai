readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the store-wide check is pointed at a location holding no requirement
    records,
  And, separately, the same check is pointed at a store where every parent names
    every child it has,
  When each run completes,
  Then the first reports that it examined no records and does not report the store
    as healthy,
  And the second reports the number of records it examined and reports the store
    as healthy,
  And the two runs are told apart from their delivered output, not only from their
    exit status.
