notes: |
  WHY THIS IS A FOURTH CHILD RATHER THAN AN AMENDMENT TO BP-900h-1. BP-900h-1's criteria are
  about the build exiting zero and the deployed tree resolving its references; BP-900h-2's are
  about idempotency; BP-900h-3's are about the job blocking a merge. All three are satisfiable
  by a job that never runs anything the install deployed. "Uses it" is the third verb in the
  L1's own promise — "clone, build, use it" — and it is the one with no child.

  THE EXECUTED-GUARD RECORD IS THE CLAUSE THAT WILL BE DROPPED FIRST, so it is written into the
  criteria rather than left to it_requirements. Without it this AC is satisfied by a green
  commit in a project where nothing was wired, which is both the likeliest outcome of a first
  implementation and the precise defect the guardrail-engine branch is currently repairing four
  instances of.

  SCOPE BOUNDARY WORTH STATING: this job proves that a plain install lets an adopter commit. It
  does not prove that any particular guard is correct, and it must not grow into a second place
  where guard behaviour is asserted — that belongs to the guards' own ACs. The question here is
  narrow and empirical: can a new adopter make their first commit, and did anything actually
  check it.

  IT-PO (2026-08-25) — WHERE THIS SITS IN THE EPIC'S ORDER. GE-122d-6 (register the commit-time
  uniqueness check) now declares this AC in its depends_on, alongside GE-122d-3-ii (scaffold the
  namespace roots) and GE-122e-3 (repair the collection). The user-stated order is scaffold,
  register, re-run the deployed-consumer test; a job that does not exist cannot be re-run, so
  this AC is a predecessor of the registration rather than a successor of it. It takes no
  dependency in return and is buildable and expected green against the tree as it stands.

  IT-PO — THE ONE-ENTRY-POINT CONSTRAINT IS NOT STYLE. If the stage-commit-and-record behaviour
  is inlined into the ci.yml step, every test written for this AC exercises a reimplementation
  of the job and the step itself is covered by nothing. That is the same defect shape as a guard
  registered in the manifest the install ignores: one surface verified, a different surface
  shipped. The step calls a script; the tests call the same script.
