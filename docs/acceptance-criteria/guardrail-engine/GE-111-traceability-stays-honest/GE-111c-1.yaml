work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-111-traceability-stays-honest/GE-111c.yaml"
criteria: |
  Given the staged commit modifies the source files "src/foo.py" and "src/bar.py"
  And acceptance criterion AC-X has implemented_by entry "src/foo.py"
  And acceptance criterion AC-Y has implemented_by entry "src/untouched.py"
    which the commit does not stage
  When the traceability reconciliation check runs at pre-commit time
  Then the check evaluates the link for AC-X (its source is staged)
  And the check does not evaluate the link for AC-Y (its source is not staged)

  Given acceptance criterion AC-Z has implemented_by entry
    "src/foo.py#process_order"
  And the staged commit stages "src/foo.py"
  When the traceability reconciliation check runs at pre-commit time
  Then AC-Z is in scope because the symbol it names belongs to a staged file
