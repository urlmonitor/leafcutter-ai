notes: |
  GAP 2 OF BO-2400g, PART ONE OF THREE. This AC establishes that a reading happens
  and that it is REAL. BO-2400g-3 adds the design half of the reading; BO-2400g-4
  gives its findings a consequence. Keep them distinct: an implementation can satisfy
  this AC with a code reading that halts nothing, and that is the intended increment.

  VERIFIED EVIDENCE (2026-08-17, do not re-investigate).
    - templates/workflows-js/fast-lane-ship.js: Coder at line 395, Commit at line 471,
      Pull Request at line 539. Nothing between Coder and Commit. The ticket lane by
      contrast runs pr-reviewer (priority 11), change-scope-reviewer,
      user-surface-smoker (11.5), ac-validator (11.5), ac-fulfillment-gate (11.7),
      live-surface-tester (11.8) and documentation-verifier (11.9) before commit (12).
    - templates/agents/pr-reviewer.md: line 562 "Skip this section entirely if no
      ticket_path was provided" (sign-off is conditional, so it CAN run ticketless);
      line 193 "If '## Agent Contracts' is absent from the ticket body, skip the
      contract trace"; Contract-Aware Mode at line 102 keys off that section; the
      delivers_to/expects_from cross-file contract trace at line 136 keys off ticket
      ACs; the completion_manifest and scope_verified check at line 517 compares the
      change set against the ticket's files_touched.

  WHY THE REQUIREMENT IS NOT "ADD A REVIEW PHASE". Every rich mode of the existing
  reviewer is keyed to a ticket. On a lane with no ticket they all evaluate to "skip",
  quietly, leaving a diff skim wearing the name of a review. A phase that is present
  but inert is strictly worse than an absent one: the absent one is visible in the
  phase list, the inert one reads as coverage. The fourth Then clause is the whole
  point of this AC — an examination that cannot run must SAY SO in the result.

  WHAT THE READING BINDS TO INSTEAD OF A TICKET. Both substitutes already exist in the
  lane at the moment the reading would run: (1) the resolved connected requirement id
  set — resolve_connected_build_set, scripts/build_orchestration/fast_lane.py:498,
  surfaced to the workflow as batchIds; and (2) the working diff, which is by
  definition present because the commit has not happened yet. Between them they cover
  the substance of what the ticket supplied: what this work was supposed to be, and
  what actually changed. Note that ticket files_touched has no direct equivalent — the
  honest options are to derive an expected surface from the requirements themselves or
  to declare that examination not performed. Both satisfy this AC; silently doing
  neither does not.

  DEPENDENCY DECISION — THIS AC DOES NOT DEPEND ON BO-2400g-1, DELIBERATELY.
  They are independent protections attaching at different phases: g-1 acts before the
  Test Writer phase (line 327) and shapes what is asked for; this AC acts between the
  Coder (line 395) and Commit (line 471) and reads what was produced. Neither consumes
  the other's output — the reading here binds to the resolved id set and the diff, not
  to the test plan. Sequencing them would delay the protection the user asked for most
  directly behind a planning-vocabulary change, for no technical reason. The one
  genuine interaction is indirect and does not require an edge: once g-1 lands, the
  diff this reading examines will contain a reachability test, which gives the reader
  more to work with but changes none of its behaviour. Recorded explicitly so the IT
  PO does not add the edge on aesthetic grounds.

  DO NOT SOLVE THE SCOPE-BOUNDARY PROBLEM HERE. templates/agents/change-scope-reviewer.md
  reads out_of_scope from ticket frontmatter, and ACD-1600g-3 is independently moving
  that source to the requirement itself — its it_requirements already cite this very
  lane ("the fast lane builds a single AC with no ticket file at all, so there is no
  frontmatter to read") as the case that makes a frontmatter-only implementation
  unsatisfiable. That work belongs to ACD-1600g. Here, scope adjudication is simply one
  of the examinations that must either run from the resolved requirements or be named
  as not performed.

  IT-PO ENRICHMENT NOTE (2026-08-17). The dependency instruction above was obeyed: no
  edge to BO-2400g-1 was added. assigned_agent is llm-expert because the surface is
  templates/workflows-js/fast-lane-ship.js (the new phase and its dispatch) plus
  templates/agents/pr-reviewer.md (the ticketless binding and the not-performed
  declaration) — both prompt/workflow surfaces. Note the registry gap this exposes:
  `.js` appears in no agent's owns_file_extensions in config/agent_registry.json, and
  llm-expert's own trigger names templates/workflows/*.md rather than
  templates/workflows-js/*.js. The assignment follows the empirical convention already
  set in this tree (BO-2400a-1, a-3, a-5 all touch workflows-js and are assigned
  llm-expert) rather than the registry, and the registry gap is the ACD-1800g concern.
  it_requirements is the LIST form because the schema's package-surface conditional
  fires only for assigned_agent: python-coder; llm-expert does not trigger it.
  declares_side_effect is false — the review result is in-run state, not a durable
  artifact; the durable-artifact case on this chain is BO-2400g-4-i's pull-request body.
  The review-result shape in delivers_to is deliberately defined ONCE here and cited by
  g-3, g-4 and g-4-i, so the four ACs cannot drift into three incompatible findings
  formats.
