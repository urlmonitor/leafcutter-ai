roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given the candidate cat-73d233fc8b15c735 with proposed_by criteria_mining, approval_status proposed and the preferred wording "Maintainability: does it keep working with little upkeep as decisions and the harness evolve?",
  When human:user accepts it in a kernel run after changing its preferred wording to "Does it keep working with little upkeep as decisions, components and the harness evolve?",
  And that run ends,
  Then the category carries approval_status approved, approved_by human:user and the time of the approval,
  And its id is still cat-73d233fc8b15c735 after the wording change,
  And its record is written into that run's staged area with lifecycle_stage staged and that run's id, and it has no place in the published library yet,
  And no file in the repository changes.
