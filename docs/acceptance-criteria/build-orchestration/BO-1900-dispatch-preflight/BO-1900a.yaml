id: BO-1900a
title: "A fit-to-dispatch check runs before any agent is spawned"
component: build-orchestration
level: L1
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  No agent starts on a ticket that hasn't passed a fitness check first.

  Between reading a ticket and spawning its phase agent, a preflight validation
  stage runs. If the ticket is not fit to dispatch, the agent is never spawned and
  you are told exactly why -- so a bad ticket can no longer burn a full run before
  revealing the problem.
