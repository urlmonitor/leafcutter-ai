notes: |
  This AC is what stops the exemption from quietly becoming the norm, and it is the one
  most likely to be dropped as "just logging". It is not logging: an escape hatch whose
  usage cannot be counted is an escape hatch nobody can argue about.

  THE CLAUSE THAT CARRIES THE WEIGHT is "on a run that reports no findings". The
  natural implementation prints exemptions only when explaining a suppressed finding —
  so exemptions become visible only to the person who just tripped over one, and the
  accumulated set is never seen by anyone. Listing on every run means the number appears
  in ordinary output, and a jump from seven to nineteen is noticed by whoever is
  watching, without anyone having to go looking.

  THE COUNT IS SEPARATE FROM THE LIST, deliberately. A list of nineteen entries scrolls
  past; a stated total is the thing a reviewer compares against last month's. It also
  gives a later ratchet something to hold onto — a cap, or a review trigger — without
  this AC having to specify one now.

  WHY REASON QUALITY IS NOT ASSERTED HERE. BO-2900d-1-i deliberately declines to judge
  reason quality mechanically, because every mechanical version is a blacklist that is
  trivially evaded. This AC is the compensating control: the reasons are all in one
  place, on every run, so a human can judge them. The two ACs are a pair — implementing
  one without the other leaves either an unenforceable rule or an invisible list.

  BOUNDARY: the message shown when a finding IS produced is BO-2900e. This AC governs
  the exemption inventory only, and it appears whether or not any finding occurred.

  Verification must EXECUTE the guard on a clean change with exemptions recorded and
  read its actual output. A test asserting that the guard's source contains a listing
  routine passes on a routine that is never called.
