notes: |
  Work item 3. Code: scripts/evals/sql_test_writer_eval/evidence_kinds.py (non_null_re,
  counts_rows_and_non_null). The same-statement rule is the false-green boundary: a
  "col IS NOT NULL" anywhere else in the file must not turn an unfiltered COUNT(*) into
  a non-NULL count. The filtered COUNT(*) does not double as the exact processed-row
  count, matching the template remedy's "plus".

  IT-PO (2026-11-02).
    - Complexity raised from S to M: the same-statement rule needs per-query
      classification (today the queries are joined), and the 'asserted only with >= 0'
      clause needs each filtered query paired with the assertion on its fetched result,
      which the SQL-side form does not do today.
    - No overlap with the other six re-run ACs in code; shares only README and the
      register (recount on rebase).

