assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: >-
    For ACD-1300e-3-iii (and every other pause-store step): one plain command per step, built by
    one builder in templates/workflows-js/plan-feature.js as
    python "<workspace_path>/<output_root>/scripts/pause_store.py" --store-dir "<workspace_path>/<output_root>/paused_runs" <subcommand> <arguments>,
    where workspace_path comes from the accepted maker answer and <output_root> is the build-time
    output root (.leafcutter); paths absolute and double-quoted; no cd, &&, ||, ;, pipe, $(...),
    backtick, VAR=value prefix or line break. Dispatched with agentType "shell-runner" and a prompt
    holding only that command and the run-unchanged instruction. The reply passes shellStepReply()
    and is a result {command, exit_status, stdout, stderr} (pause_store.py's JSON parsed from the
    stdout string) or a decline {declined: true, agent, reason} with no exit_status key.
    ACD-1300e-3-iii supplies the record argument inside this one command.
