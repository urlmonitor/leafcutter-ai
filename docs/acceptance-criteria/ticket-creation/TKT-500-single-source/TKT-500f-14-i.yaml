title: "Docs/config/diagram-only tickets are not over-gated, and the .py-triggered gate wiring still holds"
component: ticket-creation
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/ticket-creation/TKT-500-single-source/TKT-500f-14.yaml"
criteria: |
  This edge case bounds TKT-500f-14 so broadening the gate signal beyond .py does
  not regress the docs-only exemption (TKT-500f-12) or over-gate non-code work.

  Given a leaf AC whose generated ticket has no code surface — a
    docs/config/diagram-only ticket assigned to a non-coder agent (for example
    documentation-expert or architecture-diagram-author) with no source file in
    files_touched,
  When a ticket is generated from that AC by generate_ticket_from_ac.py,
  Then ac-validator and ac-fulfillment-gate are not force-added to the generated
    ticket's agents map (docs/config/diagram-only tickets are not over-gated).

  Given a leaf AC whose generated ticket's files_touched contains at least one .py
    implementation file,
  When a ticket is generated from that AC,
  Then the existing .py-triggered wiring of ac-validator and ac-fulfillment-gate
    from TKT-500f-12 still holds unchanged.
depends_on: [TKT-500f-14]
