notes: |
  Flow branch split-reject. Only a rejection with trigger jev_none ends the run blocked (user
  decisions 2026-10-05, including the final-gate rule that an ambiguous request falls back to
  today's clarification question). For jev_none the capability gap is still recorded, as today
  (user answer to BA open question Q1; mock-data v5 field capability_gap_recorded). This keeps
  gap counts honest in both directions together with DK-400a-1-ii: an approved split records no
  gap for the request, and a rejected split of a request no capability could meet does.
