criteria: |
  Given the runtime source directory contains these files:
    - check_alpha.py
    - __init__.py
    - README.md
    - __pycache__/check_alpha.cpython-312.pyc
  And the canonical template directory contains only:
    - check_alpha.py
  When the parity check runs at pre-commit time
  Then no violation is reported for "__init__.py", "README.md", or the __pycache__ contents
  And the hook exits with code 0
  And only files matching the hook script naming pattern (e.g. check_*.py,
    run_hook.py, regenerate_*.py) are compared for parity
