notes: |
  BOTH DIRECTIONS ARE ONE L1 -- one root cause (command text used as a proxy for
  'what is being done'). Do not split into two trees.

  Observed false positives: gh pr create --body quoting CLAUDE.md (KI-CG-20260907);
  a read-only awk/grep search blocked on 2026-09-17 during this authoring.

  CONFIRMED FALSE NEGATIVE (verified by the coordinator, 2026-09-17):
  templates/hooks/enforce_commit_delegation.py line 56 is
  `return "git commit" in command` -- a literal substring match. So
  `git -C <worktree> commit`, the fast lane's shipped form, is not recognised as a
  commit at all: the fast lane's token is inert today, and the guard can be passed
  by spelling. Option forms that place anything between 'git' and 'commit' behave
  the same way.

  Blocked by GE-129a's first L2 (live identity probe), decided 2026-09-17.
