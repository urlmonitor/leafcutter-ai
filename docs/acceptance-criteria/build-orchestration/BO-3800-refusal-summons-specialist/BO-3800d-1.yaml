id: BO-3800d-1
title: "The specialist is engaged a bounded number of times for one delivery, and reaching the bound stops the run rather than letting the change through"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a bound on how many times the restructuring specialist is engaged for one
    delivery is settled at technical enrichment and is at least one,
  And a ticket is being driven, delivery is refused with an outcome naming one
    file, stating a demand against it and handing that demand to a restructuring
    specialist,
  And the specialist runs and leaves the file still short of the demand, so the
    standard refuses the next delivery attempt on the same terms,
  When the run continues to adjudicate the repeated refusal,
  Then the restructuring specialist is engaged no more times than that bound for
    this delivery,
  And when the bound is reached the run stops,
  And the change is not delivered — the standard is not relaxed, waived, bypassed,
    or declared satisfied for the named file because attempts ran out,
  And the author's change is still present and unaltered at the stop, exactly as
    it was while the specialist was working,
  And given instead a run in which the specialist leaves the file meeting the
    demand on an attempt within the bound,
  When the run continues,
  Then delivery is attempted again, it completes, and the specialist is not
    engaged again — the bound is a ceiling on failure and never a number of
    attempts to be spent.
