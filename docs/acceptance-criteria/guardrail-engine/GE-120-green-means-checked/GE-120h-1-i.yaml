it_requirements:
  - "THE TWO ARMS TAKE DIFFERENT EXIT DISPOSITIONS AND BOTH ARE ALREADY DECIDED — DO NOT COLLAPSE THEM. An unreadable ADVERTISING place announces and does not refuse; an unreadable EXECUTING list (hooks_manifest.hooks in templates/scripts/commit_guardian/commit_guardian.json) refuses. A single fail-open or single fail-closed path across both violates the record."
  - "THE FIRST ARM MUST NOT REPEAL THE STANDING FAIL-OPEN CONVENTION, AND THE SECOND IS THE NARROW EXCEPTION. GE-116a-1-iii's rule — an unparseable input does not hard-block — still governs the advertising places. The executing list is exempt because with it unreadable there is nothing to compare anything against."
  - "CATCH THE SPECIFIC EXCEPTIONS, NOT Exception. The cannot-read arm is OSError/PermissionError; the cannot-understand arm is the artifact's own format error — json.JSONDecodeError for the two .json surfaces, SyntaxError for a static parse of config.py, and the markdown surface's own parse failure. A bare except turns a defect in the reconciliation into a reported unreadable place, which is the same silence this record exists to end. Log at WARNING per CLAUDE.md error-handling rules 1-4."
  - "config.py MUST BE READ STATICALLY, NEVER IMPORTED. This is the parent's requirement and it is load-bearing here specifically: an import-based reader raises on a malformed settings surface instead of producing the reported unreadable-place outcome, so the cannot-understand arm becomes a crash and the criterion is unsatisfiable by construction."
  - "THE STATED COUNT MUST EXCLUDE AN UNREAD PLACE'S CLAIMS, WHICH MEANS THE COUNT IS ACCUMULATED PER PLACE. A count computed as a total and then adjusted will drift from the per-place reporting. This is the mechanical reason the parent's delivers_to requires per-place attribution to survive into the result."
  - "USE GE-120a'S EXISTING could-not-check VOCABULARY. Do not mint a second name for the same outcome — the family already distinguishes had-nothing-to-examine from examined-and-clean, and this is the third state, not a new one."
  - "THE OUTCOME MUST BE DISTINGUISHABLE IN THE OUTPUT, NOT ONLY IN THE EXIT CODE. The first arm exits the same way a clean run does, so the exit code cannot carry the distinction and the wording must. Note KI-CG-026: a hook's stdout on the passing path is discarded by pre-commit unless the entry sets verbose: true — an announcement nobody sees is the same as no announcement, so if this lands as a registered hook the entry needs verbose: true, as check-identifier-uniqueness already does for exactly this reason."
  - "LATENCY. The unreadable path must not retry or back off; one attempt, report, continue. This runs on every commit."
