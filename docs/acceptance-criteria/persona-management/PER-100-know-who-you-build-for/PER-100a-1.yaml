title: "Persona directory contains a structured YAML definition file"
component: persona-management
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a project with the persona-management component installed
  When a persona named "field-service-engineer" is created
  Then a directory exists at docs/personas/field-service-engineer/
  And the directory contains a persona.yaml file with required sections:
    - identity (name, role, archetype)
    - goals (primary goals as a list of strings)
    - frustrations (pain points as a list of strings)
    - context (environment, tools, constraints)
  And each section is a top-level YAML key with a non-empty value
