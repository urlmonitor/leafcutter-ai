criteria: |
  Given a feature touches a component named "build-orchestration",
  When the boundary documentation step runs for that component,
  Then it produces a document that contains:
    - a section listing responsibilities the component owns (at least 1 item),
    - a section listing responsibilities the component does NOT own (at least 1 item),
    - a section listing adjacent components and how they interact,
  And each listed responsibility references the AC IDs that assign it to this component.
