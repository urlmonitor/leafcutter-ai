notes: |
  ONE RECORD FOR THE HOLD AND THE RETRY, BECAUSE THE L1 REQUIRES IT. BO-3800a's notes are
  explicit: "Holding a change that is never re-offered is the same outcome as losing it,
  from the point of view of the person waiting for it to land. Decomposition must keep the
  two halves in one record so an implementation cannot satisfy the hold and quietly drop
  the retry." This is the only child of BO-3800a for that reason, not for lack of material
  — the three named mutations below each redden a different arm of this one record, which
  is what a two-record split would have bought and what the L1 forbade buying.

  WHAT THIS RECORD DOES NOT CLAIM. It does not claim the restructuring was performed by the
  specialist — that is unobservable in a delivered change and BO-3800's notes forbid any
  descendant asserting it. It claims only what a run can be watched doing: the change
  survives the refusal, no step past delivery runs, and delivery is attempted again against
  the same standard afterwards. Who was asked is BO-3800b's; the three arms above hold
  whoever did the work.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Written so the IT PO can
  lift them verbatim into test descriptors. Each names the arms that must go RED and the
  arms that must STAY GREEN; a mutation run that reddens everything is a FAILURE of the
  descriptor, not a stronger result, because it means the arms are not independent.

  (1) THE DISCARD. MUTATION: on a refusal whose disposition names the specialist, reset the
      working tree to its pre-change state before anyone is asked, so the restructuring
      starts from a clean file.
      MUST GO RED: the change-still-present arm, and the second-attempt-carries-the-
      author's-change arm.
      MUST STAY GREEN: every arm of BO-3800b-1 and BO-3800b-2 — the right party is still
      asked and the author still is not — and both arms of BO-3800e-1 and BO-3800e-2. That
      green half is the evidence that WHO is asked and WHAT HAPPENS TO THE CHANGE are
      separate promises, which is the collapse BO-3800's notes name as the one to avoid
      ("Merging (a) with (b) is the specific collapse to avoid, because it is BO-210's shape
      wearing this goal's title").

  (2) THE FORCED PASS. MUTATION: on the second attempt, deliver without consulting the
      standard that refused — bypass it, or mark the named file exempt for the remainder of
      the run.
      MUST GO RED: the judged-by-the-same-standard arm and the completes-because-the-file-
      now-meets-the-demand arm.
      MUST STAY GREEN: the hold arms above, every arm of BO-3800b-1, and BO-3800e-1. This
      injection is the second of the two failures BO-3800a's notes name, and it is the one
      that looks most like success: the handoff happened, the change landed, and the rule
      was quietly reopened for exactly the population it exists for.

  (3) THE DROPPED RETRY. MUTATION: hold the change and ask the specialist, then end the run
      there — report the handoff as the outcome and never re-offer delivery.
      MUST GO RED: the second-attempt arm and the completes arm.
      MUST STAY GREEN: the change-still-present arm, the not-recorded-as-completed arm,
      every arm of BO-3800b-1 and BO-3800c-1, and BO-3800e-1/e-2. This is the injection the
      L1 was written to make impossible to ship, and it is the cheapest build in the tree:
      everything visible has happened and the person waiting for the change is in exactly
      the position they were in before.

  THE OPEN QUESTION THIS RECORD DOES NOT ANSWER, RAISED RATHER THAN NARROWED AWAY. Every
  arm above begins "Given a ticket is being driven". That scoping is deliberate and it is
  NOT a quiet narrowing of the L1 — it is a gap this decomposition is reporting upward, and
  it is an amendment to BO-3800a rather than something to settle here. The reasoning: the
  hold and the re-offer both need a party that outlives the refusal and can ask for
  another. Inside a drive that party exists — it is the depth-0 driver that owns the phase
  loop. Outside one it does not. A hand-run commit at a terminal has no driver at all; and
  the delivery step itself cannot be the asker, because it runs at depth 1 and ADR-019
  records that an agent at depth 1 cannot invoke the Agent tool, with calls beyond it
  SILENTLY DROPPED. So the honest position is that this capability exists only inside a
  drive, and a refusal outside one is simply refused — today's behaviour, with GE-127e's
  message as the whole of what the author gets. That may be the right answer; it is not
  this record's to declare. Until BO-3800a says so, no clause here claims anything about a
  delivery attempt made outside a drive, and no clause here claims such an attempt is
  out of scope either.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's, which runs
  after this pass. The three named mutations above, including which arms must stay green,
  are written to be turned directly into test descriptors.
