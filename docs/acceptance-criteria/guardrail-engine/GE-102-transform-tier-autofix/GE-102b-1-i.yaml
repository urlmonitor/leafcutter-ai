title: "Description-field transform fails open when no title exists and no-ops on absent layout"
component: guardrail-engine
level: L3
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  Given the description-field transform hook is invoked,
  When the staged file has no title field to derive a description from, or its frontmatter
    cannot be parsed unambiguously,
  Then the hook makes no edit and exits with code 0 (fail-open),
  And when the project has no docs/ layout the config targets,
  Then the hook no-ops silently and exits with code 0,
  And in neither case does the hook block the commit or raise an unhandled error.
