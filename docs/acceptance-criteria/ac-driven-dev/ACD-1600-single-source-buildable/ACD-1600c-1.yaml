id: ACD-1600c-1
components:
  - ac_driven_dev
readiness: reviewed
priority: medium
title: "An AC missing file targets or a test contract is flagged not implementation-ready"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given an AC is a candidate to be released to a builder,
  When the implementation-readiness gate evaluates it,
  Then an AC that lacks concrete file targets (it_requirements) is flagged NOT implementation-ready,
  And an AC that lacks a test contract (a test_spec) is flagged NOT implementation-ready,
  And a flagged AC is held back for enrichment instead of being dispatched to a coder,
  And the flag names which of the two is missing.
depends_on: [ACD-1600c]
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Canonical source to change: scripts/ac_store/scan_ac_store.py (the leaf-readiness/completeness gate; source-only Python, no templates/ counterpart)."
  - "The gate must flag an AC lacking concrete file targets (it_requirements naming file paths) as NOT implementation-ready and hold it back from the ready/dispatch set."
  - "The gate must flag an AC lacking a test contract (a test_spec, or an explicit test_required: false) as NOT implementation-ready."
  - "The flag must name which of {file targets, test contract} is missing — and both, when both are missing."
  - "The held-back decision must be data-driven on field presence, never keyed on specific AC ids."
  - "Gates on enrichment COMPLETENESS, complementary to and distinct from the approval-readiness gate (ACD-1200b). Ship advisory before required and grandfather schema_version < 2 ACs (ADR-026 rules 3-4)."
delivers_to:
  agent: python-coder
  contract: "The implementation-readiness completeness gate: a classifier that flags an AC NOT implementation-ready and names which of {file targets, test contract} is missing; consumed by the real-AC edge case ACD-1600c-1-i."
expects_from: null
test_spec:
  - name: test_ac_missing_file_targets_flagged_not_ready
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "An AC whose it_requirements name no concrete file targets is flagged NOT implementation-ready."
  - name: test_ac_missing_test_contract_flagged_not_ready
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "An AC with neither a test_spec nor test_required: false is flagged NOT implementation-ready."
  - name: test_flag_names_which_of_two_is_missing
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "The flag names which of {file targets, test contract} is missing (and both when both are absent)."
  - name: test_flagged_ac_held_back_from_dispatch_set
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A flagged AC is excluded from the ready/dispatch set and held back for enrichment."
