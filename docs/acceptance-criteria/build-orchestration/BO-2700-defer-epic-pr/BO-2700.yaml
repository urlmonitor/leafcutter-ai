title: "An epic build opens exactly one PR — at finalize, not per ticket mid-drive"
component: build-orchestration
level: L0
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  When /build-feature drives an epic, it must build and commit each ticket on the
  feature branch and stop there — it must NOT open a pull request mid-drive. The
  single epic-level PR is opened once, by finalize-feature, after the epic is built.

  Surfaced during the BO-2600 drive: the per-ticket phase driver ran the
  pull-request phase for an epic-member ticket and opened PR #409 to main in the
  middle of the build (and self-signed tickets), duplicating finalize's job. This
  regressed from the pre-ADR-006 ticket-supervisor close-out, which signed off the
  pull-request phase for epic members without running it ("one PR per epic").
