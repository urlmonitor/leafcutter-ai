id: BP-1300f-1-viii
components:
  - build_pipeline
title: "The local CI run type-checks exactly as the required 'mypy ratchet (new errors only)' check does, with CI's own arguments, and its red fails the local run"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Background:
    Given scripts/run_ci_local.py, the local mirror of .github/workflows/ci.yml,
    And the required CI check "mypy ratchet (new errors only)", whose pull-request step
      runs scripts/ci/mypy_ratchet.py with --base and a list of pathspecs.

  Scenario: The local run uses the ratchet with CI's arguments
    When the local run's typecheck step runs,
    Then it runs scripts/ci/mypy_ratchet.py with exactly the arguments ci.yml gives it, with origin/main as the base
    And the step is blocking and runs without any opt-in flag

  Scenario: The pathspecs come from ci.yml only
    Given ci.yml's ratchet call names a different set of pathspecs,
    When the local run's typecheck step runs,
    Then it type-checks that set, with no edit of its own

  Scenario: A new type error fails the local run, naming it
    Given a branch whose head commit adds a type error to a Python file in scope,
    When the local run's typecheck step runs,
    Then the local run exits non-zero and marks the typecheck step FAIL, naming the file, the head line and the error code

  Scenario: A new silencing comment fails the local run
    Given a branch whose head commit adds a "# type: ignore" comment to a file in scope,
    When the local run's typecheck step runs,
    Then the local run exits non-zero and marks the typecheck step FAIL, naming the file whose type-ignore count rose

  Scenario: A clean change passes
    Given a branch whose head commit changes a file in scope and adds no error,
    When the local run's typecheck step runs,
    Then the local run exits 0 and marks the typecheck step PASS

  Scenario: Could-not-check fails the local run
    Given the ratchet exits 2 because origin/main does not resolve,
    When the local run's typecheck step runs,
    Then the local run exits non-zero and marks the typecheck step FAIL, saying it could not check
    And when ci.yml holds no ratchet call, the local run fails the same way, naming ci.yml

  Scenario: Nothing in scope is not shown as a pass
    Given a branch that changes no Python file in scope,
    When the local run's typecheck step runs,
    Then the typecheck step is marked NOTHING INSPECTED, never PASS
    And the local run exits 0, as CI's check does, its final line saying a step inspected nothing
