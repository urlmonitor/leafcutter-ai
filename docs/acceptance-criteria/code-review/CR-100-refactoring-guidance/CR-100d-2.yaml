criteria: |
  Given the code-smell-review orchestration has received findings from both the
    structural reviewer and the design reviewer,
  When it produces the output,
  Then it emits exactly ONE consolidated report, not one report per reviewer,
  And the report lists all findings ranked by severity, HIGH first, then MEDIUM,
    then LOW,
  And findings from both reviewers are interleaved by severity rather than kept
    in separate per-reviewer sections.
