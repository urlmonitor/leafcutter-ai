criteria: |
  Given the published cat-1dc11c5a2ffa7310 whose member decisions dec-4673055ef54113d5, dec-acdfd972fcaca478 and dec-d53e1c52cd47c832 all have the final outcome pending,
  And a configured learning store,
  When an added item triggers a rebuild,
  Then every aggregate row is rebuilt, each keyed by category id and context (capability, task type, decision type, components, repository-wide, repository id, policy version),
  And the row of cat-1dc11c5a2ffa7310 in the repository-wide design context has a decision count of 3, made of 0 confirmed, 0 corrected, 0 abandoned and 3 pending,
  And for each category the decision counts summed over its rows equal its usage count,
  And all rows carry the same rebuild time,
  And after dec-acdfd972fcaca478's outcome becomes confirmed and a rebuild runs, the row shows 1 confirmed and 2 pending,
  And no category record holds an outcome or success statistic.
