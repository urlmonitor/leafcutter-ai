    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    description: "After the trigger fires, attempting to set documentation-expert or documentation-verifier to not_needed leaves both at needed."
  - name: test_doc_agents_protected_like_tdd_mandatory
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    description: "documentation-expert/documentation-verifier are protected by the same mandatory-agent mechanism that protects test-writer/test-runner."
