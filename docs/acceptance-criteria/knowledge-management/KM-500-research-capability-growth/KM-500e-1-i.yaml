id: KM-500e-1-i
title: Carry interpreted information needs through the public retrieval route
component: knowledge-management
components:
- knowledge_management
- decision_kernel
level: L3
status: active
req_status: active
work_status: in_progress
readiness: approved
priority: high
parent: KM-500e-1
criteria: |
  Given an authorized repository research request supplies its original question and optional context but no query operation or answer requirements
  And the selected repository source supports the configured knowledge retrieval route
  When the public research entry interprets the information needed before retrieving evidence
  Then one host LLM request proposes all information-needs dimensions together and the validated proposal is retained for later finite Jev selection and actual retrieval
  And the caller's original question, literal target identities and trusted source scope remain unchanged through the host wait, query selection and evidence assessment
  And every original selected identity remains an answer obligation even when query selection, custom query arguments or source disclosure return only a subset
  And the same interpreted obligations reach the retrieval executor whether a reusable query catalog and admission path are configured or absent
  And a question about an acceptance criterion's required behavior keeps its canonical criteria as required evidence rather than silently substituting its test specification
  And an explicit descendant-count question keeps its hierarchy levels, root-only versus all-parent exclusion and requested work_status separate from lifecycle status
  And missing user meaning produces a focused existing human continuation and a later interpretation uses that answer without replacing the original question
  And unsupported needs, invalid host output, unavailable or stale evidence and incomplete required fields never become a complete answer because a query ran or a judgment was confident
  And an answer identifies the evidence and source actually retrieved while retaining any unmet obligations
  And the read-only journey grants no graph-write or query-publication authority.
