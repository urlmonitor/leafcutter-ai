id: DK-300a-3
title: "Artifact cards use each canonical store's identity and membership"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given permitted canonical stores contain acceptance criteria, architecture decisions, decision records, flows and tickets,
  And the acceptance-criterion fixtures include a four-digit root and a nested suffix,
  When a request names those stored IDs,
  Then their owner's syntax and actual store membership determine their identities,
  And each card supplies only kind, exact ID, short title and canonical reference as its artifact meaning,
  And criteria, decision rationale and full artifact bodies remain absent,
  And the source identity, canonical locator, snapshot, source hash and retained projection hash accompany each card.
depends_on: [DK-300a]
