roadmap_phase: phase_1
criteria: |
  Given a planning run with no person attached reaches a decision point whose decision context
    includes the rule-check summary
      the check produced no readable report (JSON Parse error: Unexpected token 'X')
  And the request the run was started with is these two lines:
      Don't drop the user's "approved" drafts; keep $HOME and `pwd` literal \ done
      Größe: 5 – ok
  When the run records that it is waiting,
  Then the run is reported as waiting and its pause record is present on disk,
  And the record holds the summary and both request lines character for character, including
    every single quote, double quote, backslash, dollar sign, backtick, line break and
    non-ASCII character,
  And no part of either text was run or expanded as a command on the way: the record holds the
    literal text $HOME and the literal backticked pwd, not a directory path or the output of a
    command,
  And a resume of that run shows the person the same summary and the same two request lines,
    character for character,
  And the bug symptom (KI-BO-20261022 candidate path 3: "the write passes the record as a
    single-quoted shell argument and a single quote in the record is not escaped; a rule-check
    summary such as Unexpected token 'X' ends the quoted argument, the write fails, and the
    read-back finds no record") must not occur.
