test_spec:
  - name: test_tq600b_6_the_command_the_guidance_documents_spreads_across_more_than_one_worker
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: "the run command extracted verbatim from the published guidance"
    description: >-
      The command is EXTRACTED FROM THE DOCUMENT and executed over a small
      selection; more than one worker results. This is distinct from TQ-600b-5's
      reachability descriptor, which invokes the command that AC specifies: only
      this descriptor fails when the document drifts away from the delivered
      invocation. NAMED MUTATION: change the documented command to a form that
      does not inherit the parallel default; this test must go RED while
      TQ-600b-5's own descriptors stay green.
  - name: test_tq600b_6_the_documented_serial_escape_hatch_produces_exactly_one_worker
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      The escape hatch is extracted from the document and executed; exactly one
      worker results and the run completes. NAMED MUTATION: document a flag the
      runner does not accept; the run errors instead of serialising and this test
      must go RED. "Works as written" is the clause, so the test writes it out.
  - name: test_tq600b_6_the_two_surfaces_name_the_same_command_and_the_same_escape_hatch
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: seam
    description: >-
      The statements are extracted from docs/testing/README.md and
      unit_tests/README.md and compared: either they are equal, or one is a link
      to the other. NAMED MUTATION: change the command in one surface only; this
      test must go RED. Two documents describing one command is two chances for
      one to rot, and the one that rots keeps being believed.
test_rationale: |
  Two of this AC's five clauses are reader outcomes and no descriptor can check
  them: whether the guidance gives a contributor the occasions on which a serial
  run is the right diagnostic step, and whether it leaves them knowing that a
  parallel-only failure is a finding about their test rather than an argument
  against parallelism. Those are verified by a reader trial against the published
  text, and are recorded as such rather than approximated by a grep for the
  headings they would appear under.

  The three clauses that are mechanical are tested by EXECUTION, not by reading.
  Both command descriptors extract the command from the document and run it,
  which is the only way to catch the failure this AC exists to prevent: a guide
  that names a flag the runner does not accept, whose reader concludes the suite
  is broken rather than the sentence. Asserting that a string appears in a
  README would pass on exactly that guide.

  The agreement descriptor is mechanical by construction because the criteria
  were phrased as agreement rather than as "both are kept up to date". It is
  satisfied by a link, which is also what the doc-length ratchet on
  docs/testing/README.md pushes the implementation toward.

  No speed figure appears in this contract or may appear in the guidance. The
  measured wall clock is contaminated by shared-host load and a documented saving
  would be unreproducible.
