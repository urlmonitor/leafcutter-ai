notes: |
  THIS IS THE RECORD THAT MAKES THE ACS-1400d DEFERRAL SURVIVABLE. ACS-1400d is
  held at L1 pending a scope ruling and was deliberately not decomposed in this
  pass. Without it, the largest single population here can never be repaired
  safely — so rather than let it be quietly omitted from the reconciliation, this
  AC requires the pass to abstain on it out loud and to name what is blocking it.
  An abstention that says why is a finding; a silent omission is the same defect
  one level down.

  THE ABSTENTION IS OPEN-ENDED, NOT A HOLDING POSITION. If ACS-1400d is never
  built, this pass is still complete and still correct — it will simply always
  report this population as outstanding with a stated reason. That is the property
  that lets ACS-1400c ship without waiting on the most expensive item in the tree.

  CLASSIFY BY RESOLUTION, NOT BY SHAPE — inherited from ACS-1300a-3 verbatim and
  worth the repetition because the wrong proxies are so tempting. The obvious
  implementation is to check whether an entry looks like a file path. Re-measured
  2026-09-08 across the real store, the resolution test and the shape test do not
  agree: the ten parents in this population hold entries that resolve to nothing,
  and separating them from the twelve whose coverage list is simply empty requires
  resolution, not inspection.

  A MEASUREMENT CORRECTION THE IMPLEMENTER SHOULD HAVE. The L0 notes describe this
  population as 26 records across 11 parents. Re-measured by resolution on this
  branch it is 25 across 10; the eleventh parent, KM-KGS-100e-6, has an entirely
  empty coverage list and so falls under the empty-list group of 12 rather than
  this one. Same tree, same underlying cause, different signal — and since this AC
  keys off the signal rather than a list of ids, that record will be dispositioned
  as an empty-list case. Whether that is the right answer for it is a question for
  the report's reader, which is exactly why every record must appear in the
  report.

  THE THIRD Then IS THE PAIRING DISCIPLINE AND IT MUST NOT BE SPLIT OUT. "The file
  is unchanged" is satisfied by a tool that does nothing. Only a genuine repair in
  the same invocation makes the abstention evidence of a decision.
