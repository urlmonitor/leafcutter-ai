id: BO-2400f-3-vi
components:
  - build_orchestration
title: "The setup looks for the worktree's pre-commit hooks where they are installed, so a correctly bootstrapped worktree reports no missing hooks"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a worktree whose bootstrap installed the package pre-commit hooks into the
    package's commit-guardian hooks folder,
  When the setup checks whether those hooks are present,
  Then it checks inside that hooks folder, not in the folder one level above it,
  And it reports the hooks as present,
  And it prints no warning about hooks being missing.

  Given a worktree whose bootstrap did not install the hooks, so the hooks folder is
    absent,
  When the setup checks whether those hooks are present,
  Then it reports them missing, naming the folder it looked in,
  And that folder is the commit-guardian hooks folder itself.
depends_on: [BO-2400f-3, BO-2400f-3-v]
doc_links:
- path: scripts/build_precommit.py
  relationship: modifies
  status: exists
  relevance: Owns the hook-location check that looked one folder too high (_check_hook_script_integrity).
    It runs inside the build.py child that the setup's _bootstrap step 5 invokes. Repointed by it-po from
    templates/scripts/setup_ticket_worktree.py, which only invokes it.
- path: templates/scripts/setup_ticket_worktree.py
  relationship: related
  status: exists
  relevance: Runs build.py during _bootstrap, which is where the warning surfaces in a fast-lane setup.
- path: docs/architecture/components/build-orchestration.md
  relationship: describes
  status: exists
- path: docs/testing/test-angles.md
  relationship: related
  status: exists
assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
  config_schema_fragment:
    hook_script_presence_check:
      type: object
      description: For each hooks_manifest entry, the path checked is the entry's own declared script
        path, the last .py token with {{config.output_root}} resolved, INCLUDING its subfolder (e.g. scripts/commit_guardian/hooks/check_ac_done_on_merge.py).
        It is never <commit_guardian dir>/<basename>. When a script is missing, the warning names the
        folder it looked in.
  reference_file_path: scripts/build_precommit.py
  n_location_rule: '1: _check_hook_script_integrity (scripts/build_precommit.py:242-277), whose caller
    passes cg_dir = TEMPLATES_DIR / ''scripts'' / ''commit_guardian'' (:323).'
  required_skills:
  - python-coder
  post_write_commands:
  - python scripts/build.py --target-dir .
  - python -m pytest unit_tests/commit_guardian/test_build_precommit.py -q
  constraints:
  - 'THE DEFECT, MEASURED. The check reduces the declared path to Path(py_tokens[-1]).name (:268) and
    tests cg_dir / name, which drops the declared hooks/ segment. Run against templates/scripts/commit_guardian/commit_guardian.json
    today (78 entries), it false-warns on exactly 4 commit-guardian entries whose scripts exist under
    hooks/: check-agent-spawn-consistency, check-agent-verification-consistency, check-predone-scope (check_files_touched_reconciliation.py),
    and check-ac-done-on-merge. After the fix, a run against the real manifest emits none of these 4.'
  - RESOLVE THE DECLARED PATH; DO NOT SPECIAL-CASE 'hooks' BY NAME. Any future subfolder declared in an
    entry must be honoured automatically.
  - The same check also warns on 2 product-truth entries (check-product-truth-validate, check-product-truth-generate),
    whose declared path docs/product-truth/scripts/... is outside commit_guardian. Resolving the declared
    path against the right root should silence these too when the files exist. If any still warns, it
    must be because the file is really absent at the declared path, and the warning must name that path.
  - THE MISSING CASE STAYS HONEST. With the hooks folder absent, the warning names the folder looked in
    (the hooks folder itself, not its parent), so deleting the warning cannot pass scenario 2.
  - It stays a warning, not a stop, and its wording follows the BO-2400f-3-v 'non-fatal' label. This AC
    changes no hook entry and does not change commit_guardian.json.
delivers_to: null
expects_from: null
test_required: true
test_spec:
- name: test_presence_check_looks_inside_the_declared_hooks_folder
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: Against a tmp templates tree where the script exists only at scripts/commit_guardian/hooks/<x>.py,
    the path checked for an entry declaring .../commit_guardian/hooks/<x>.py is inside hooks/.
- name: test_hooks_present_in_the_hooks_folder_are_reported_present
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: In the same tree, an entry whose script is in hooks/ is reported present (no missing finding).
- name: test_no_missing_hook_warning_for_the_real_manifest
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: real_artifact
  description: 'Run against the repository''s real templates/scripts/commit_guardian/commit_guardian.json:
    none of check-agent-spawn-consistency, check-agent-verification-consistency, check-predone-scope or
    check-ac-done-on-merge is warned about.'
  must_catch:
  - The check still tests <commit_guardian>/<basename>.
- name: test_absent_hooks_folder_is_reported_missing_naming_the_folder
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: failure
  description: With the hooks folder removed from the tmp tree, each hooks/ entry is reported missing,
    and the warning names the folder that was looked in.
  must_catch:
  - The warning is deleted outright, so a missing hooks folder goes unreported.
- name: test_missing_report_names_the_hooks_folder_itself_not_its_parent
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: discrimination
  description: The folder named in that warning ends in commit_guardian/hooks, not commit_guardian.
  must_catch:
  - The missing path is reported as <commit_guardian>/<basename>, one level too high.
origin_agent: business-analyst
created: 2026-10-16
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
change_target: pipeline
risk_surface: internal
notes: |
  The 2026-10-12..14 UXP-510 refusal cited this warning. The second scenario keeps the
  check honest: a fix that simply deletes the warning passes the first scenario and fails
  the second. Whether a missing-hooks finding should stop the setup is not decided here;
  BO-2400f-3 says the worktree is bootstrapped so hooks are active, and BO-2400f-3-v
  requires whichever label applies to be stated.
