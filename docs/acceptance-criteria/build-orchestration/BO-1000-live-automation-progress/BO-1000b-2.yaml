  post_write_commands:
    - "python scripts/build.py --target-dir ."
  notes: |
    Policy constraints:
    - The end-of-run summary must be built by enumerating the recorded per-step
      outcome record (BO-1000b-1), one line per step with its specific outcome —
      not re-derived from a single terminal status and not a bare "done"/"ok".
    - The summary is the return value / final block of the workflow; it must be
      the single place the final recap is assembled (one location), sourced from
      the record so it cannot diverge from what was narrated live.
    - Must remain correct on the halt path too (BO-1000b-2-i) — the same
      record-backed composition, reporting only steps that actually recorded an
      outcome.
    - No new config key. ADR-001 build.py round-trip parity.
