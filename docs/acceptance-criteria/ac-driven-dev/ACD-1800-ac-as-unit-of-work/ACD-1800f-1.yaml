priority: medium
title: "A requirement can declare that it has an observable effect, through one slot that every observation craft reads"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement that promises an effect a person can observe -- running a
    command changes what a subsequent command reports,
  When the author records that promise on the requirement,
  Then the requirement is accepted as valid rather than rejected for carrying
    something the record does not recognise,
  And the requirement reports that it has an observable effect when it is
    inspected,
  And a requirement that promises nothing observable reports that it has none,
    and is equally valid,
  And the same declaration also carries which kind of observation the promise
    needs -- a smoke check of a user-facing surface, or an exercise of a live
    surface -- so that a second kind of observation can be requested without a
    second place to declare it.
