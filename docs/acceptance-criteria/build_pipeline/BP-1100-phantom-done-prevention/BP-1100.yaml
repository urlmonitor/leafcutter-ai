id: BP-1100
title: "A done ticket means the feature actually runs, not just that it looks done"
component: build-pipeline
level: L0
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Tickets that reach status: done deliver behavior that executes, not prose that
  describes it.

  When a ticket changes how the build pipeline behaves at runtime, the pipeline
  proves the change exists in the executable surface, exercises it from the outside,
  and refuses to call a behavioral feature "done" on the strength of documentation,
  string-scan tests, or in-loop diff review alone. This closes the "phantom-done"
  failure class observed in EPIC-CommitAcOutputPerStage, where six supervisors and a
  PR reviewer all passed a feature that could not run.
