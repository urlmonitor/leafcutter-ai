  - reason: criteria-clarification
    by: business-analyst
    at: 2026-08-18
    note: "Settles the it-po's open caveat that 'independently completable' had no discriminator.
      DECISION: the criteria do NOT name the record field, because naming one would freeze a
      storage detail into a behavioural requirement and would make the AC pass or fail on a
      vocabulary change rather than on the scanner's answers. What was genuinely wrong is that
      the criteria did not FORCE a discriminator, and the three candidates the notes had blessed
      (level, owner presence, the leaf/composite distinction) give different answers on the real
      store — so an implementer could satisfy the letter with a proxy that misses the point. Two
      changes fix that by construction. (1) The R-beneath-P clause now also states that P's own
      record acknowledges R among the things beneath it, so P demonstrably HAS a child. This
      makes 'composite = has children beneath it' fail the very first assertion instead of
      passing it. It is not a hypothetical: BO-2400g-1 — the observed defect's own P — is an L2
      with covered_by [BO-2400g-1-i], so the has-children reading reproduces today's wrong answer
      exactly. (2) A third pair, Q and T, is added: Q is buildable in the same sense as P but has
      nobody named to build it yet, and T beneath Q must still be held. This makes
      'not-independently-completable = no owner recorded' fail, which matters because the store
      is permanently full of BA-authored L2s awaiting enrichment — BP-1100a-3 and BP-1100a-4 were
      both in exactly that state yesterday, and this AC's own notes record that assignment is
      deliberately omitted at authoring time. Consequentially, P's definition no longer makes an
      owner constitutive of being buildable ('its own single owner' became 'the work it describes
      is work one builder does'), or the record would contradict itself.
      TWO IT-PO-OWNED FIELDS ARE NOW OUT OF STEP AND ARE NOT TOUCHED HERE. (a) The
      config_schema_fragment's independently_completable description still says the property
      means the prerequisite 'carries its own criteria and a single owner' — the owner half is
      what the new Q/T pair rejects, and the phrase should be dropped so the fragment and the
      criteria agree. (b) test_spec has four descriptors and none exercises Q/T; a fifth is
      needed, opposed to the first two in the same way, asserting that a buildable prerequisite
      with no owner recorded still appears in the account of what holds its refinement. Both are
      recorded rather than fixed silently. Title and every other it-po-owned field untouched;
      the notes paragraph that had blessed all three candidate mechanisms is corrected in place
      and marked as superseded by this record."
