it_requirements:
  - >-
    ONLY THE PERSON'S ANSWER COUNTS (KI-BO-20260925). This gate must NOT use finalize's current
    resolveGate live path, which accepts any {action} object that an agent returns. The only
    accepted confirmation is a resume answer for this gate's id that carries channel "person" and
    is validated against the durable pause record (ADR-024): the same provenance rule
    plan-feature's gate already enforces. A live agent reply, an answer without channel "person",
    or an answer for another gate id is treated as no answer. If the shared gate module from
    KI-BO-20260925's fix direction exists when this is built, use it rather than adding another
    copy of the gate code.
  - >-
    Outcomes map exactly. Confirm: close the listed set, then continue to the merge. Decline: no
    close, no commit, halt before Step 4, report "declined" with the listed records as left open and
    the statement that re-running finalize shows the list again. No answer, or an expired or stale
    pause record: the same as decline, but reported as "unanswered". Every non-confirm path returns
    a halted result before any merge dispatch and is never recorded as Step 3.5 completed.
  - >-
    The pause-store dispatches for this gate go to an agent permitted to run shell (KI-BO-20260927;
    plan-feature uses worktree-agent as the stopgap). A failed persist is reported as unanswered.
    It is never a silent pause that no later run can resume.
  - >-
    INTERIM, WITH A RETIREMENT CONDITION. Implement the gate as one contiguous guarded block in Step
    3.5, so that retiring it (once -ii, -iii, -iv and -v are done with scratch-repo behavioural
    tests, per this record's notes) is a deletion, not a refactor. The listing (BO-400e-3-vi) must
    not depend on the gate being present.
  - "Answering the gate is not timed by the workflow body (E2 bans Date.now()). 'The time the run allows' is the pause record's staleness rule in pause_store.py, and a stale record is the 'unanswered' outcome."
  - "When the derived set is empty or undeterminable (BO-400e-3-viii), the gate is not shown. There is nothing to confirm, and showing an empty list for confirmation would turn a non-closure into a question."
delivers_to: null
expects_from:
  ac_id: BO-400e-3-vi
  contract: "listing_text and the records array from the derive reply. The gate prompt carries the listing verbatim."
test_required: true
test_spec:
  - name: test_person_confirmation_closes_exactly_the_listed_records_and_continues
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Two-invocation harness run (pause, then resume with resume_answer {gate_id, action confirm, channel person} and a matching pause record); the close dispatch runs once against the listed set and the run proceeds to the Step 4 dispatches."
  - name: test_decline_closes_nothing_and_halts_before_merge
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Resume with action decline from channel person; no close dispatch, no commit dispatch, no merge dispatch is recorded, and the halted result says declined, names alpha-02.md and BO-9100a-2 as left open and states a re-run shows the list again."
  - name: test_no_answer_or_stale_record_is_unanswered_and_halts
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Headless run (no resume answer) and a resume against a stale pause record both halt before merge with no close dispatch, reported as unanswered rather than declined."
  - name: test_agent_yes_is_treated_as_no_answer
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "The live gate dispatch is answered {status ok}/{action ok} by the stubbed agent, and separately a resume answer without channel person is supplied; in both runs nothing is closed and no merge dispatch is recorded. NEGATIVE CONTROL: the same answer with channel person does close, which proves the provenance check discriminates and does not simply refuse everything."
    must_catch:
      - "accept the live agent's {action: ok} reply as the confirmation"
      - "accept a resume answer without channel person"
test_rationale: >-
  The gate's correctness is control flow across a pause and a resume, so it is proven with the E2
  harness's two-invocation pause-resume runs (the pattern in
  unit_tests/workflows/test_bo_2300_pause_resume.py). Each assertion is on which dispatches were
  and were not recorded, and above all on the absence of the close and merge dispatches. The
  agent-yes test carries a positive control, because a gate that refuses every answer would
  otherwise pass the safety tests while being unusable.
