assigned_agent: python-coder
estimated_complexity: L
delivers_to:
- agent: python-coder
  contract: 'CLI of the one maker. Deployed at <install-root>/scripts/worktree.py (source templates/scripts/worktree.py;
    the name is provisional until this AC is built, after which that path is the contract every caller
    names). Stdlib-only Python, run as `python <absolute path> <verb> ...` from ANY cwd. Verbs: `ensure
    --kind {ticket|feature|ac|fastlane|epic|scratch} --slug <work identity> [--ticket <path of the ticket
    in the main copy, absolute or project-relative; not accepted with --kind scratch>] [--repo-root P] [--allow-stale-base]
    [--config-path P]` -- the only creating verb, idempotent, always fetch + build + stage shims + per-stage
    canaries; with --ticket its ok answer carries ticket_path_in_worktree and ticket_path_in_worktree_posix
    (BO-4300a-1-ii, BO-4300c-2); `locate (--kind
    K --slug S | --path P | --branch B) [--repo-root P]` -- read-only; `list [--repo-root P]` -- read-only
    scan of the landing place''s markers, never git worktree list; `verify --path P [--kind K --slug S]
    [--repo-root P]` -- read-only readiness re-check; `remove --path P [--discard-token T] [--delete-remote-branch] [--repo-root P]`
    -- T is the one-time token from this same workspace''s own UNSENT_WORK refusal (Q8, decided 2026-09-28,
    BO-4300e-3); `where` -- prints the maker''s
    own absolute path. ensure, locate, list, verify and remove also accept [--landing-root P], the explicit
    landing-place override the maker validates (Q5, decided 2026-09-28, BO-4300b-2); --kind K --slug S is
    normalised to the one identity <kind>/<slug>, legacy spellings accepted as aliases (Q4, decided
    2026-09-28, BO-4300a-2). There is no --reset-existing (BO-4300d-4 resumes), no --no-bootstrap (decision
    2), and no flag that skips a readiness ingredient.'
- agent: llm-expert
  contract: 'The exact single-command invocation the workspace skill and every entry skill run: `python
    <absolute path printed by `worktree.py where`> ensure --kind <kind> --slug <identity> [--ticket <main-copy
    ticket path>]`, with the answer relayed verbatim as the workflow''s args.workspace. A caller that passed
    --ticket takes the ticket''s working location ONLY from ticket_path_in_worktree of the ok answer.'
- agent: python-coder
  contract: 'Project-root resolver module (C4 shared resolver; consumed by the maker now and by the ~30
    hand-written hook resolvers of duplication-audit cluster C4 next). Source templates/scripts/<resolver
    module>.py (name provisional, e.g. workspace_root.py), deployed by its OWN named deploy-manifest entry
    to <install-root>/scripts/<resolver module>.py, stdlib-only, importable as a top-level module with no
    import-time side effects. One public function taking (cwd: absolute path, repo_root: absolute path
    | None) and returning a result with status ''ok''|''NO_REPO''|''AMBIGUOUS_REPO'', project_root (absolute,
    present only on ok), how (''argument''|''workspace-marker''|''git-common-dir''|''child-search''|''sibling-search''),
    candidates [absolute path] (AMBIGUOUS_REPO only) and searched_from (absolute cwd, NO_REPO only). Order
    and exclusions are fixed by BO-4300b-1''s it_requirements. Every call recomputes; nothing is cached.'
expects_from:
  ac_id: BO-4300c-2
  contract: Every answer the maker emits follows the BO-4300c-2 result contract; this AC supplies the
    ensure path that produces it.
package_surface: false
it_requirements:
- Deliver the one maker as a stdlib-only Python file at templates/scripts/worktree.py (name provisional;
  once built, that path is the contract every caller names), exposing the verbs ensure, locate, list,
  verify, remove and where, plus the separate project-root resolver module described below. After BO-4300f-2
  no other code path in the package creates, clones, locates or removes a workspace.
- 'ROOT RESOLUTION LIVES IN ITS OWN MODULE (duplication audit C4, KI-CG-20260925-shared-root-resolver-accepts-non-repo-workspace-parent):
  project resolution is delivered as a separate importable module (see delivers_to), separate from the
  maker''s CLI file, stdlib-only, with its own named deploy-manifest entry. The maker imports it; it
  never re-implements resolution inline. It must not reuse, import, wrap or copy templates/scripts/commit_guardian/_resolve_root.py
  (that module walks up from __file__ looking for .git or CLAUDE.md and caches its answer in a module
  global -- both forbidden here). The resolution order and exclusions are BO-4300b-1''s.'
- 'NO SECOND TRACKED COPY (KI-TQ-20260831-mutation-probe-lands-in-the-wrong-copy, KI-TQ-004): the only
  tracked source of the maker and of the resolver module is templates/scripts/. No tracked copy exists
  under scripts/ or anywhere else in the package repository (today scripts/setup_ticket_worktree.py and
  templates/scripts/setup_ticket_worktree.py are both tracked and differ -- that shape must not recur).
  Tests run the DEPLOYED copy only.'
- 'ensure follows the decision memo''s order (''Consequences for the standalone script''s contract'',
  step 1): resolve the main checkout; read the hub from its origin (NO_HUB when absent); compute the landing
  place; if the location exists, verify then repair or refuse; otherwise a hardlinked local-path clone
  OF THE MAIN CHECKOUT with --no-checkout (the clone source is the resolved main checkout''s own path,
  never the hub URL; no --shared, no --reference); re-point origin at the hub; fetch from the hub with
  pruning, so that afterwards refs/remotes/origin/* name only the hub''s branches and none of the main
  checkout''s local branches copied in by the clone (BO-4300d-4 IT0: only the hub''s refs are consulted)
  (FETCH_FAILED unless --allow-stale-base); check out the line of work from origin/main, or resume origin/<branch> (BO-4300d-4);
  when --ticket was given, locate the ticket inside the workspace (BO-4300a-1-ii); set gc.auto 0 and maintenance.auto
  false in the workspace; copy .env and .mcp.json; run the install build inside the workspace with an
  explicit config path and an explicit --target-dir naming the workspace (build.py refuses an implicit
  build into the package repository, Q6 decided 2026-09-28, BO-4300f-2; the explicit target keeps a workspace
  of the package itself buildable); install the shim for every hook stage the workspace''s own hook declaration names
  (BO-4300c-1-ii); clean-tree check; one canary per declared stage; write the marker; emit the answer.'
- 'GIT INVOCATION SPELLING (KI-CG-20260925-commit-delegation-hook-misses-git-dash-c): the maker runs git
  as a subprocess with its working directory set to the target, or with -C <path> for verbs other than
  commit only. Any commit the maker makes (the canaries) runs with the working directory set, never as
  `git -C <path> commit`. The same holds for every recipe, skill text and test in this family, because
  the commit-delegation hook matches only the literal "git commit" and the -C spelling slips past it.'
- No os.symlink, ln -s, mklink or junction anywhere in the maker or in the install path it drives (decision
  2).
- The build entry point and its config are derived from the main checkout's own install config (the memo's
  --config-path derivation, stripping the top_level_packages prefix). NO_CONFIG when that is impossible;
  never the build's default config, never the maker's own location.
- 'Work identity and naming live in ONE table inside the maker (Q4, DECIDED user 2026-09-28): callers pass
  kind plus the raw work identity they hold, the maker normalises it to the one identity <kind>/<slug>
  for every kind (ticket, feature, ac, fastlane, epic, scratch), and the same identity from any route
  yields the same landing location and the same line of work. The legacy spellings (EPIC-<Name>, ac-authoring/...,
  fast-lane/...) are declared in that same table as aliases resolving to the same identity (feature/<slug> is
  canonical for kind feature and never an alias, 2026-10-22);
  the rules are in BO-4300a-2 and are implemented by ticket 06.'
- 'Landing place (Q5, DECIDED user 2026-09-28): the landing root is <parent-of-project>/<project-dir-name>-worktrees/,
  derived from the resolved main checkout, in the dev layout as in the consumer layout, unless an explicit
  validated --landing-root is given; the rules are in BO-4300b-2 and are implemented by ticket 04. The
  folder name worktrees/<slug> of fixed decision 1 is superseded; the clone mechanism is not.'
- The marker record is the maker's registry under clones (no git command lists clones). It holds schema_version,
  kind, slug, branch, hub, project_root (absolute path of the main checkout the workspace was made from
  -- the ONLY way a workspace identifies its project, BO-4300b-1), base_commit, maker_version, state ('creating'|'ready')
  and created_at; it is
  written atomically (temp file plus replace), state 'creating' immediately after the clone exists and
  'ready' as the last step; it lives outside version control and outside anything the install build rewrites
  or cleans. The memo's .leafcutter/workspace.json is acceptable only if a test shows the build leaves
  it intact. The same holds for every other folder the maker keeps inside .leafcutter/ (e.g. .leafcutter/rescue/) --
  the shared deployed layout's one real install build runs over a pre-seeded marker and that folder,
  and a test asserts both survive byte-identical. This is that build, not an extra spawn of build.py.
- 'BUILD DEPLOY MANIFEST (CLAUDE.md ''New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest''):
  the maker is added as a NAMED entry to the standalone-scripts deploy (build_template_standalone_scripts
  in scripts/build_phases_script_deploy.py -- its docstring list -- and the matching manifest helper in
  scripts/build_deploy_manifest_helpers.py), not left to the shallow glob alone. The resolver module gets
  its OWN named entry in both places, deployed beside the maker in <install-root>/scripts/; that phase
  is non-recursive, so any further helper module the maker imports needs a named entry too. Verified
  by running the DEPLOYED copy''s `where` verb after the build and importing the DEPLOYED resolver module
  in a separate process, not by the unit suite importing the source.'
- 'docs/components.json -> worktree_manager: its description (''Git worktree lifecycle management for
  isolated epic and ticket branch environments.'') and primary_code ([''scripts/worktree/'']) become wrong
  under decision 1. Update the description to per-feature clone workspaces made, found, listed and cleared
  through one maker, and add templates/scripts/worktree.py and the resolver module to primary_code; drop setup_ticket_worktree
  references when BO-4300f-2 deletes that script. (IT PO recorded this here and did NOT edit components.json.)'
- Excluding the install build, ensure on a generated fixture project of 8,500 tracked files with the
  stub build is budgeted 30 s, and locate, list, verify and where 5 s each. A test on every CI runner
  records the measured timings in its output and fails only above 2x the budget, naming the verb and
  the measured time. The decision memo's reference-host figures are the source of the budgets.
- The maker never reads stdin and never prompts; every decision it needs arrives as an argument of the
  request, so an unattended caller can never stall on it.
- 'Must handle errors per the project error handling policy: a condition the maker cannot classify is
  an error answer (code INTERNAL_ERROR) whose message names it -- never an ok answer, and never a traceback
  on stdout.'
- The workspace skill that agents run the maker from is llm-expert work and is delivered by BO-4300a-1-ib;
  this AC delivers the command that skill runs.
- Proof runs the DEPLOYED maker -- the copy an install delivers, resolved through the shared test locator
  delivered by BO-4300f-4 -- as a separate process against real temporary git repositories with a real
  bare hub. No mock of git, no import of the maker module, no grep of its source (CLAUDE.md 'Gate / Workflow
  ACs -- Verify Behaviorally, Not by Grep'); a test never falls back to the templates/ source copy.
- 'Tests must not spawn the package''s own scripts/build.py (CLAUDE.md ''Tests must not spawn their own
  build.py''): the deployed maker comes from the shared deployed layout, and fixture projects carry a
  minimal stub build entry point that installs a real, rejecting hook in well under a second. A test that
  must mutate the package and build its own copy says so and justifies it in its ticket.'
- All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
  isolated global and system config; afterwards the developer's own repository's branches, registered
  worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_every_route_workspace_carries_marker_agreeing_with_its_answer
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: For each of the five routes (long-running build kind epic, quick fix kind feature, requirements
    session kind ac, the command published by the deployed workspace skill, a person's terminal invocation)
    the workspace named in the ok answer holds the maker's marker with state ready, and its kind, slug,
    branch and base_commit equal the answer's.
- name: test_every_route_workspace_is_independent_clone_rooted_at_fresh_hub_main
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: Each of the five workspaces has its own .git directory (not a gitfile), git-common-dir
    inside itself, origin equal to the hub, and base_commit equal to the hub's main tip S read at request
    time.
- name: test_every_route_workspace_has_own_install_and_rejects_canary
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: real_artifact
  description: Each workspace's install files are regular files inside it, built from its own contents,
    and a commit of the known-bad file inside it is rejected by a real hook.
- name: test_every_route_workspace_lands_in_the_one_landing_place
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: All five workspace_path values share the project's one landing place as parent. (The exact
    Q5 location is asserted by BO-4300b-2's tests in ticket 04, so this ticket-01 test stays green across
    that change.)
- name: test_every_route_receives_answer_of_identical_shape
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: The five answers have the same key set and the same status, differing only in identity-derived
    values (slug, branch, paths, commit).
- name: test_no_route_lacks_a_property_another_route_has
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: The set of true checks.* and marker properties is equal across the five routes.
- name: test_deployed_maker_is_present_after_build_and_answers_where
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: deployed
  description: In the shared deployed layout, <install>/scripts/worktree.py exists as a regular file and
    `where` emits one JSON object naming its own absolute path.
- name: test_deployed_resolver_module_is_its_own_importable_file_beside_the_maker
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: deployed
  description: In the shared deployed layout the resolver module exists as a regular file in <install>/scripts/
    separate from worktree.py, and a separate Python process with only that directory on its path imports
    it and gets an ok answer naming a temp project from inside that project -- proving it is importable
    by a hook without the maker's CLI.
- name: test_maker_and_resolver_have_no_tracked_copy_outside_templates_scripts
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: unit
  angle: seam
  description: '`git ls-files` of the package repository lists the maker''s and the resolver module''s
    file names only under templates/scripts/; any tracked copy under scripts/ or elsewhere fails the test,
    naming the path (the repository''s tracked-file set is this test''s subject).'
- name: test_workspace_is_hardlinked_clone_of_main_checkout_with_origin_at_hub
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: seam
  description: With a bare hub, and a main checkout that has a local-only branch feature/x and a local
    main behind the hub, ensure makes a workspace whose origin URL equals the hub, one of whose object
    files has a link count greater than 1 (same volume), for which ensure --kind feature --slug x answers
    line_of_work 'new', and whose base_commit equals the hub's main tip.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer, its exit code, and the state of the workspace, the hub and the main copy afterwards.
  A direct-import unit test would pass while the deployed copy is stale or mis-deployed (F13), and a git
  mock cannot show the half-made and occupied states this family exists to handle.
