notes: |
  WHY REFUSAL AND NOT A DEFAULT. Three candidate behaviours were considered for a null
  work agent: silently omit it, substitute the python-coder default that an ABSENT
  assigned_agent already gets, or refuse. Refusal is correct because the other two both
  emit a ticket that looks complete and is not. Omission produces a ticket with every
  gate phase wired and nobody assigned to build it. Substitution is worse in a quieter
  way: it invents an answer to a question the AC author never answered, and the drive
  then dispatches a Python coder at an AC that may be a prompt, doc or schema change.
  The 355 affected records need authoring; the generator's job is to say so.

  THE DEFECT PREDATES THE MODULE SPLIT. It is reproducible on origin/main at e5965006
  and the decomposition into _gtfa_agents_map.py preserved it exactly — this is not a
  regression introduced by the split.
