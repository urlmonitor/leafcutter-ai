criteria: |
  RETIRED 2026-10-09. THIS CRITERION'S SUBJECT NO LONGER EXISTS. Do not build it, do
    not re-point it at another call site, and do not read the text below as a live
    requirement. The one whole-AC-store walk whose VOLUME admitted the C-backed parser
    is the agent-card generator's scan of every record by assigned_agent, and that scan
    is being removed — agent cards become static. With it goes the only call site in
    the package that satisfies all four parts of this record's own admission test, and
    the record's central speed clause has nothing left to measure. The reasoning, the
    live artifacts this retirement strands, and the part of this record that is STILL
    WORTH SOMETHING and is NOT retired with it, are in the final amended_by entry and
    under "WHY THIS RECORD IS RETIRED" in the notes. Everything below is preserved
    verbatim for audit.

  AMENDED 2026-10-08. Three clauses of the original text are RETRACTED, not merely
    unmet — one of them has had its intent reversed. The retracted text is preserved
    verbatim under "WHAT WAS STRUCK" in this record's notes, and the reasoning is in
    the second amended_by entry. Read those before reinstating anything below.

  Given the acceptance-criteria store as it stands on disk — 4,781 record files
    counted 2026-10-08, 4,635 when this record was first written, 3,340 in August —
    a population that only grows, and whose cost to any reader that walks it is
    dominated by YAML parsing,
  And the shared parser accessor, which resolves the libyaml-backed safe parser where
    the installed YAML library exposes the C extension and the pure-Python safe parser
    where it does not, both being implementations of the same safe schema,
  And a four-part admission test, ALL FOUR parts of which must hold before any call
    site may resolve the C-backed parser:
      (1) VOLUME — the call site parses a large, bounded portion of the store in one
          operation, so parse time dominates its cost. Volume is the test, not the
          file or the function's subject matter: the same source file may qualify at
          one call site and fail at another, and a call site that parses a handful of
          small documents per invocation does not qualify however often it runs,
      (2) NO ERROR-PATH DEPENDENCE — nothing in it treats a RAISED parse failure as a
          signal, in particular no fail-open "skip this malformed record" branch,
      (3) NO EQUIVALENCE CONTRACT — nothing requires its parse to agree with the
          pure-Python parser as a reference implementation,
      (4) NOT A DECISION POINT — it does not decide BLOCK or PASS for a guardrail
          hook, a required pull-request check, or a done-proof claim,
  When the package is inventoried for which parser each call site resolves,
  Then naming the pure-Python safe parser directly is the DEFAULT and needs no
    justification, and resolving the C-backed parser is the EXCEPTION — admissible
    only at a call site that satisfies all four parts and records, at the call site,
    the measured volume figure that earned it,
  And resolving the C-backed parser by an inline `getattr(yaml, "CSafeLoader", ...)`
    idiom counts as the same decision as resolving it through the shared accessor, so
    copying the inline idiom is not a way around this criterion,
  And the inventory of C-parser call sites is derived mechanically from the source
    rather than copied from this record, and every member of it is declared and
    justified: a call site that resolves the C-backed parser without a declaration
    fails this criterion, whether it is newly added or was overlooked,
  And no member of that inventory is a commit-guardian hook, the store-wide schema
    validation, or any other module that decides BLOCK or PASS,
  And the whole-AC-store walk that agent-card generation performs once per build —
    one traversal of every record file, each parsed once, to group active records by
    their assigned agent — is a call site that satisfies all four parts and resolves
    the C-backed parser,
  And over the real on-disk store that walk completes in at most ONE FIFTH of the
    time the SAME walk takes with the parser forced to pure-Python, both arms measured
    in the same process or the same script run and compared as a RATIO, never against
    an absolute number of seconds,
  And the two arms produce identical output for the same store, so the ratio is a
    claim about doing the same work faster and not about doing less work,
  And each arm reports how many record files it parsed, and the two counts are equal
    to each other and to the number of record files on disk, so an arm that parsed
    nothing is distinguishable from an arm that was fast,
  And the one-fifth threshold is a floor with deliberate headroom, not the expected
    result: the walk measured ~1.7-2.1 s through the accessor against ~20.6-22.7 s
    forced pure-Python across two separate sittings on the real store, roughly 10x to
    13x, and this host has shown 3.8x to 10.74x variation in timing figures with no
    code change at all, so a measured ratio below five means either the walk has left
    the accessor or the host is pathologically loaded — and the test reports both arms
    so those two causes are told apart rather than averaged,
  And the store-wide schema validation behind the required pull-request check is NOT
    admitted and keeps the pure-Python parser deliberately, because it fails part (2):
    its parse failure is turned into a REPORTED VIOLATION rather than a skipped file,
    and the C-backed parser accepts inputs the pure-Python one rejects — a tab
    character inside a flow sequence parses as an empty list instead of raising —
    which at that call site silently converts a malformed record into an accepted one.
    Error fidelity is chosen over speed there. Its parse cost is unchanged by this
    record and no speedup for it is claimed anywhere in this record,
  And no call site reaches for the unsafe full loader, or for a parse with no explicit
    loader named, as a way to go faster: the admitted parser is the C implementation of
    the same safe schema, never a wider one.
