id: TQ-400a-5
components:
  - testing_quality
  - ac_store
title: "Someone who has never run the store-wide sweep can run it and read its verdict unaided"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a maintainer who has never run the whole-store honesty sweep, who has the
    how-to guide and nothing else — no sibling to ask and no access to the sweep's
    source,
  When they follow the guide end to end against this repository,
  Then they run the sweep over the whole store themselves and obtain a verdict for
    every finished record, without having to discover which invocation reaches the
    store-wide population,
  And they can state which population each of the three done-proof layers covers —
    the records staged for a commit, the records changed in a pull request, and
    every finished record in the store — and therefore say which records a given
    layer would never have looked at,
  And they can state, before running anything, whether the run they are about to
    start will write to the store, and what additional step is required before it
    would,
  And, shown a run's output naming one record, they can say which outcome that
    record received, what its stated cause means, and which of the available
    responses applies — obtaining proof, declaring the record exempt with a
    reason, or fixing an unresolvable coverage tag at source,
  And, shown a record the run demoted, they can explain from the guide alone why
    it lost its finished badge and what would restore it, without opening the
    sweep's source or a previous run's report,
  And every command the guide gives runs as written against the repository at the
    time the guide is published, producing the output the guide says it produces —
    a reader who copies a step does not have to adjust it to make it work.
depends_on:
  - TQ-400a
  - TQ-400a-1
  - TQ-400a-2
