it_requirements:
  - "Read the allowlist from build_propagation_audit.EXTERNAL_DEPENDENCY_ALLOWLIST (the same source BP-900b-1-1 honors) rather than a new, divergent allowlist — one allowlist, both surfaces."
  - "Apply the allowlist as the final exemption step: a promised script whose path matches an allowlist entry is removed from the promised-but-undeployed list before the verdict is finalized."
  - "Handle a missing or malformed allowlist gracefully (treat as empty) and fail-open per the project error-handling policy."
