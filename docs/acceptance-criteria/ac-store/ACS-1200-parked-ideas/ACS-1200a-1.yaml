it_requirements:
  - "The field pair enters the store schema at config/ac_store_schema.json, whose top-level object sets additionalProperties: false (line 15). BOTH parked and parked_reason must be declared in the top-level properties block; declaring one without the other rejects every record that carries the pair."
  - "Both fields must be optional at the schema level (absent from any required list) so that every record already in the store validates identically before and after. The conditional rule — parked_reason present and non-empty whenever parked is true — is the only new way a record may fail."
  - "Two validator entry points read that one schema file and both must return the same verdict: the standalone scripts/ac_store/validate_ac_schema.py (load_ac_store_schema(), _SCHEMA_REL at line 48) and the commit-time templates/scripts/commit_guardian/check_ac_schema.py (SCHEMA_PATH at line 90). Leaving either behind means the store and the commit gate disagree about what is valid."
  - "Enforce on the gate that actually runs when the authoritative one degrades. check_ac_schema.py runs validate_manually() from templates/scripts/commit_guardian/_ac_schema_validators.py only as a fallback when jsonschema, PyYAML or the schema file are unavailable (its DECISION HISTORY, GE-112, lines 33-37). validate_manually() today checks REQUIRED_FIELDS presence only (_ac_schema_validators.py:44), so in the degraded path a parked: true record with an empty parked_reason passes silently. The degraded path must reach the same parked verdict as the schema path, or the rule holds only while the environment is healthy."
  - "The marker must be read from the AC record by ONE shared reader that every consumer uses — the back-link hook, the orphan scan, the buildable-work scan, both validators — rather than re-implemented per surface. A duplicated predicate is what lets the surfaces disagree, which is the inconsistency ACS-1200b exists to remove."
  - "DEPLOYMENT (ADR-001, and the CLAUDE.md rule 'New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest'): templates/scripts/commit_guardian/ deploys by directory walk (build_commit_guardian, scripts/build_phases.py:1298) so a new module there ships automatically, but scripts/ac_store/ deploys through an explicit eight-entry deploy_map (scripts/build_phases.py:794-806). A shared helper added under scripts/ac_store/ and NOT added to that deploy_map is absent from the deployed .leafcutter/ layout — the exact condition that leaves ac_parent_id.py undeployed today and forced the fail-open _get_derive_parent_id() fallback in check_ac_parent_covered_by.py. Any new module must be added to deploy_map and proven present after python3 scripts/build.py."
  - "Validation evidence must be produced with explicit file-path arguments: python3 scripts/ac_store/validate_ac_schema.py <paths>. A directory argument silently no-ops and exits 0, so a green run over a directory is not evidence."
