    note: >-
      expects_from rewritten to the contract BP-600c-3 actually describes now
      that its own criteria state the mutation proof. The previous text named
      an all_passed field that exists in neither the shipped result shape nor
      BP-600c-3's delivers_to, so the two records named the same seam with
      different vocabulary — the disjoint-vocabulary failure that lets each
