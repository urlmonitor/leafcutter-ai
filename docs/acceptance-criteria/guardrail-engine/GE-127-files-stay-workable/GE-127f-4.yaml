notes: |
  Reported upstream as an unfiled finding, with the cost attached: it took
  three commit cycles to discover the real obligation, because each cycle the
  author did what the sentence said, was refused again, and had no way to tell
  from the block whether they had mis-measured or been mis-told.

  WHY THIS IS A MESSAGE DEFECT AND NOT A RULE DEFECT, recorded here because
  the opposite conclusion is easy to reach from the code alone. Reading only
  check_file_size.py, `required = previous - added` looks like it could be an
  off-by-one-factor slip, and "add no more than you remove" looks like the
  intended rule. GE-127f's criteria settles it the other way in plain words --
  "it gets smaller by about twice what the change adds to it" -- and GE-127f-2
  independently records the net-growth reading as the known wrong turn. Both
  point the same direction: the arithmetic is intended, the sentence is not.
