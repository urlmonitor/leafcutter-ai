notes: |
  Added 2026-08-13 as a sixth L1 under BO-2900 (tree now a–f, cap 7). Framing
  decisions recorded for the BA and IT PO:

  - THE DEFECT: a ticket can request a quality gate that configuration has
    switched off. Today that produces NO artifact at all, so "gate disabled"
    and "gate passed" are indistinguishable downstream. The generic rule is
    stated at L1 deliberately: ANY requested gate that is disabled, skipped, or
    otherwise not executed must still emit a record with a skipped outcome and
    the reason. Do not narrow this to one named gate at L2.

  - BOUNDARY vs BO-1000b-1-i (work_status: done) — READ THIS BEFORE DECOMPOSING.
    BO-1000b-1-i already guarantees gap-free per-step records for the
    finalize-feature WORKFLOW STEPS: every declared step has exactly one recorded
    outcome, executed or skipped, with the already-satisfied reason. BO-2900f is
    the PHASE-AGENT GATE analogue: a different producer (the gate/phase-agent
    layer, not the finalize step loop) and a different record. Same completeness
    instinct, different surface — this is NOT a duplicate, and neither should be
    folded into the other. DO reuse BO-1000b-1-i's proven record shape: exactly
    one outcome per requested item, no gaps AND no duplicates, reason carried
    with the skip.

  - CARRY THE KNOWN TRAP FORWARD: BO-1000b-1-i's implementation shipped a
    double-recording bug (a skip-branch record was added while the pre-existing
    unconditional record after the if/else was left in place), and the structural
    test was blind to it because its regex matched only quoted-string arguments,
    not template literals. See CLAUDE.md "Skip-Branch Side-Effects". Any L2 here
    must assert cardinality (exactly one record per requested gate per path)
    behaviorally, not by grepping for the presence of a call.

  - BOUNDARY vs siblings: BO-2900d is the honest, reviewable EXEMPTION for code
    with no runtime entry point; BO-2900e is the QUALITY of a failure message
    that IS emitted. BO-2900f is about the ABSENCE of any record at all. Keep
    the three distinct at L2.

  - PARENT BACK-LINK OUTSTANDING: BO-2900.yaml's covered_by does NOT yet list
    BO-2900f. That file was in-flight under another process at authoring time and
    was deliberately not touched. Add `- BO-2900f` to BO-2900.yaml covered_by
    before committing — check_ac_parent_covered_by.py will otherwise block.

  - 2026-08-13 (BA decomposition): the outstanding back-link above is now RESOLVED —
    BO-2900.yaml already lists BO-2900f in covered_by; no edit was needed.
    Decomposed into five L2s: -1 the skipped record itself (with the "gates never
    requested produce no entry" negative clause), -2 the exactly-one-per-requested-
    gate cardinality invariant carrying the double-recording trap, -3 skipped is
    never counted as a pass by any downstream roll-up, -4 the rule is derived from
    the requested-gate set so new gates are covered without bespoke wiring, -5 the
    reference-doc AC satisfying documentation_triggers. The named instance for
    `live-surface-tester` lives at BO-2100d-5 and depends_on BO-2900f-1.
