criteria: |
  Given end-of-route clearing (BO-4400a-1, BO-4400a-1-i, BO-4400a-2) and the retired
    removal paths (BO-4400a-3, BO-4400a-3-i) are in place,
  When a person reads the how-to guide for workspace clearing,
  Then the guide contains a table with one row for each of the six routes named in
    BO-4400a-1 stating the moment its workspace is cleared, including the
    nothing-to-deliver case,
  And the guide states that finalizing a feature is not the cleanup point and that a
    route never waits for it,
  And the guide walks through a stopped run: reading the kept workspace's location and
    unsent work from the run's result, sending that work, and clearing the workspace
    through the one door,
  And the guide names the one clearing door as the only way to remove a workspace and
    states that clearing a workspace holding nothing unsent asks no question,
  And the guide contains no instruction to remove a workspace by forced removal or by
    deleting its folder.
