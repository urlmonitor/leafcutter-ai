notes: |
  "Drift is caught" (L1 criteria) is a separate promise from "filled identically" (BO-4500b-1):
  filling covers what the install produced; this check covers what is in the installed routes NOW,
  including a hand edit made after the install. It reads INSTALLED routes, never templates, because
  the installed text is the shared artefact (repo CLAUDE.md "verify against the deployed layout").

  The BO-4500a-5 and BO-4300c-3 parity tests are instances of this one check, not two more
  implementations of it -- recorded so neither record builds its own.
