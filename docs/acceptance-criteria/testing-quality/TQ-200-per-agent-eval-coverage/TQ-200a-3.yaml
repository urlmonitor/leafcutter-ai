criteria: |
  Given an eval set for an agent,
  When its rows are categorized,
  Then the set contains at least one GOLDEN case and at least one HELD-OUT case,
  And each row declares which kind it is,
  And golden cases guard against regression while held-out cases probe
    generalization (see TQ-200a-3-i and TQ-200a-3-ii).
