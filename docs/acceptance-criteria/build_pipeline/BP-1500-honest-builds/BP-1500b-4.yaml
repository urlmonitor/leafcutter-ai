notes: |
  PRIORITY IS critical, ONE STEP ABOVE THE PARENT'S high, AND DELIBERATELY SO.
  Every other AC under this L1 fails by leaving a dead file in place, which is
  the status quo. This one fails by deleting a live file the adopter owns, which
  is worse than the defect being fixed. The parent's own notes say so: "wiping it
  converts a cleanup defect into data loss."

  THE NEGATIVE CONTROL IS NOT HYPOTHETICAL -- IT IS THE BRIEF'S OWN RULE APPLIED
  TO THIS MACHINE. The decomposition brief proposed the derivation "an installed
  path in neither the template account nor output_mappings, and not a shim
  symlink, is an orphan". Checked against the reporting machine's installed tree
  on 2026-09-07:

    .claude/settings.local.json    present; occurrences in the build manifest: 0
    .claude/scheduled_tasks.lock   present; occurrences in the build manifest: 0

  Neither is a link, so the "not a shim symlink" escape does not cover them.
  Implemented literally, that rule DELETES the adopter's machine-local settings
  and a live lock file on the first rebuild. That is why this is an L2 with its
  own criteria and not a line in a test plan.

  The three categories in the Given are the real inhabitants of that tree, not
  invented ones: settings.local.json (adopter-owned), scheduled_tasks.lock
  (run-time state), and the build-created links agents/ commands/ hooks/ skills/
  workflows/ settings.json.

  WHY THE THIRD Then CLAUSE MATTERS AS MUCH AS THE FIRST. An exception list
  naming these three files would pass a test written from this AC's Given and
  would then delete the fourth such file the moment one appears. It is the same
  hand-maintained-list failure BP-1500b-2 forbids on the positive side, and it
  has to be forbidden on the negative side too or the shortcut simply moves.
