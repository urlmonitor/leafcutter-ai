notes: |
  Resume-from-pause-point (not restart) uses the harness resumeFromRunId replay
  so committed prior stages are replayed as already-done rather than re-executed.
  The four apply behaviors correspond to the three question types in BO-2300b-1.
  Correctness key (ADR-024 rule 4): resolveGate() must consult the record's
  answer before the gate's agent() call, or resume replays the cached
  headless-default and re-cancels.
