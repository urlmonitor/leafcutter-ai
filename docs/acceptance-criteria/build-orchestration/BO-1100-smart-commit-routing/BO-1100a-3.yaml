criteria: |
  Given the routing config contains 5 entries (tickets, new-acs, shipped-acs, implementation, status-changes),
    and the staged files are:
      - docs/architecture/components/new-component.md
      - docs/architecture/diagrams/new-component-c4.mmd
    and neither file matches any configured path_pattern,
  When the commit agent attempts to classify the staged files,
  Then the commit agent does NOT produce a generic "update files" subject line,
  And the commit agent delegates to the pattern-learning specialist agent,
  And the delegation includes:
    - the list of unmatched file paths
    - the structural shape (directory pattern: "docs/architecture/**")
  And the specialist produces a one-time message for this commit
    while also logging the unmatched shape for future learning (BO-1100d).
