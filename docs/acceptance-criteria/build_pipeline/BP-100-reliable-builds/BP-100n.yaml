amended_by:
  - "split: BP-100k -> BP-100k + BP-100n [Pattern C, 8 L2 children -> 5 + 3], 2026-08-26. BP-100k had accumulated 8 L2 children against a default cap of 5 and was carrying child_limit_override: 9 as an explicit temporary waiver. Three of its children — the former BP-100k-6, BP-100k-7 and BP-100k-8 — turned out to share a rule distinct from the drift-comparison theme the rest of BP-100k covers: an absence must be reported as an absence and never inferred to mean there is nothing to check. They were renamed BP-100n-1..-3 and moved here, and BP-100k's override was removed rather than raised. The rename is required because check_ac_limits.py attributes a child to its parent by deriving the parent from the child's ID string, not from covered_by (GE-106), so a moved child that kept its old prefix would still be counted under BP-100k."
