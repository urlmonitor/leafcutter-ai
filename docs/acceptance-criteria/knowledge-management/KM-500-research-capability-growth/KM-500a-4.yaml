criteria: 'Given independently reviewed research cases distinguish missing input, an explicit known operation,
  suitable registered queries, unsupported source data and a genuinely missing query

  And use of the selected external judgment provider has been authorized for the disclosed context

  When the configured real judgment service processes those cases through the public research entry point

  Then the evaluation records the selected outcome against the reviewed expectation and identifies the source
  revision, catalog version and provider settings

  And incomplete questions ask for the missing input while explicit known operations preserve deterministic
  execution

  And unsupported data, unavailable providers, denied access and exhausted budgets never count as correct missing-query
  decisions

  And provider calls, latency, failures and unresolved cases remain visible in the measured report

  And scripted judgments and synthetic examples are labeled separately from real-provider evidence

  And absent authorization or credentials produces not-run with the unmet prerequisite, never a passing quality
  claim.'
