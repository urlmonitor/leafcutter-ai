criteria: |
  Given the pure helper selectDispatchPhases(orderedPhases, isEpicMember) exported
    from templates/workflows-js/build-feature.js,
  And orderedPhases contains no pull-request phase, e.g.
    [{agent: "test-writer"}, {agent: "python-coder"}, {agent: "commit"}],
  When selectDispatchPhases(orderedPhases, true) is executed,
  Then no error is raised,
  And the returned list contains the same phases in the same order as orderedPhases
    (nothing is dropped because there was no pull-request phase to remove),
  And the element count is unchanged.
notes: |
  Edge case for the epic-member filter (BO-2700a-1): if a ticket's ordered phases
  never included a pull-request phase, filtering for epic members must be an
  idempotent no-op rather than dropping an unrelated phase or throwing. Testability:
  behavioral — a test EXECUTES selectDispatchPhases (e.g. via `node`) with the
  pull-request-free orderedPhases above and asserts the input is returned unchanged.
