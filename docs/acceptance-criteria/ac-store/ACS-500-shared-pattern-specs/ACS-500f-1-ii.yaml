title: "Phase 2 field-preservation binds its git diff to the project root, not process cwd"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given the AC store schema hook runs its Phase 2 implements_pattern
    field-preservation check,
  And the process working directory is NOT the repository root (for example the
    hook is invoked from a subdirectory or a worktree path that differs from cwd),
  When the hook determines which staged AC YAML files were modified,
  Then it queries the staged modifications against the project root explicitly
    (the project root resolved the same way Phase 1 / the HEAD-version loader
    resolves it), rather than relying on the process working directory,
  And a staged modification that drops a previously-present implements_pattern
    field is still detected,
  And that commit is blocked with the message identifying the file and stating
    that implements_pattern was dropped.

  Given the schema hook runs under the normal pre-commit framework where the
    process working directory already IS the repository root,
  When Phase 2 determines which staged AC YAML files were modified,
  Then it detects the same set of modified files it detected before this change,
  And no previously-passing or previously-blocking outcome changes (no regression).

  Given the project-root resolution that Phase 2 relies on fails (the repository
    root cannot be determined),
  When the hook handles that failure,
  Then the hook exits with code 0 (fail-open per the project convention),
  And the commit is NOT blocked by this hook,
  And a diagnostic message identifying the hook and the failure is written to stderr,
  Consistent with the fail-open guarantee specified in ACS-500f-1-i.
