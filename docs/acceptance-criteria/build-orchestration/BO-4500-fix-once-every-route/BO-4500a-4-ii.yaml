id: BO-4500a-4-ii
title: "Two calls of the shared step in one workspace at once each record only their own commit"
component: build-orchestration
components:
  - build_orchestration
  - git_vcs_operations
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500a-4.yaml"
criteria: |
  Given one workspace on branch feature/x with a.py and b.py changed,
  And caller A asks the shared commit step to commit a.py while caller B, at an overlapping
    time, asks it to commit b.py,
  When both calls finish with every check passing,
  Then the branch has gained exactly two commits, one containing only a.py and one containing
    only b.py, each with its own caller's message,
  And both answers are committed, each with its own commit id,
  And neither answer is refused or hook_failed because the other call was running.

  Given caller A's call is between staging and recording its commit,
  When caller B's call reaches the point of recording,
  Then B waits until A's commit is recorded or A's call has ended, using the serialisation
    BO-1600a defines, before B stages or records anything.
depends_on: [BO-4500a-4, BO-1600a-1]
doc_links:
  - path: docs/known-issues/build-orchestration/open-high-ki-bo-20260901-0920.md
    relationship: describes
    status: exists
    relevance: "No commit lock in any driver. Its 2026-10-09 update records build-feature now chains commit dispatches on one commitLane; other routes have no such chain. The shared step is where serialisation holds for every route."
  - path: docs/acceptance-criteria/build-orchestration/BO-1600-safe-concurrent-dispatch/BO-1600a-1.yaml
    relationship: consumes
    status: exists
    relevance: "Owns the serialisation primitive and its semantics (git-write portion only, cross-process, released on every exit). Not re-specified here."
assigned_agent: python-coder
estimated_complexity: M
package_surface: false
it_requirements:
  - >-
    The step acquires BO-1600a-1's serialisation guard around the whole staging-to-recording span
    and releases it on every exit path, including refusals, hook failures and crashes. It does not
    define a lock of its own; lock semantics and stale-lock recovery stay with BO-1600a / BO-1600b.
  - >-
    Waiting for the guard is not a failure: a call that waits answers exactly as it would have
    without contention. Only if BO-1600a's guard can report that it could not be acquired does the
    step answer refused with step_serialisation_unavailable (step family, retryable).
  - >-
    DEPENDENCY: BO-1600a-1 is approved but todo. This record cannot be built until the guard
    exists; it must not ship a private lock as a stand-in.
delivers_to: null
expects_from:
  ac_id: BO-1600a-1
  contract: "The git-write serialisation guard scoped to one shared workspace; this step acquires it around staging and recording."
test_required: true
test_spec:
  - name: test_two_overlapping_calls_each_record_only_their_own_commit
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Two real step processes started concurrently in one scratch workspace naming a.py and b.py produce exactly two commits, one per file, each with its caller's message, and two committed answers."
  - name: test_second_call_waits_for_the_first_before_staging
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "With a fixture check that pauses caller A between staging and recording, caller B's first staging action is observed only after A's commit exists."
    must_catch:
      - "no serialisation around staging"
      - "a guard taken only around the record step"
  - name: test_guard_is_released_after_a_refused_or_failed_call
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "After a call ends hook_failed or refused, a following call proceeds without waiting."
test_rationale: >-
  Concurrency is only observable with two real processes and a fixture check that holds one of
  them at a known point; a single-process test cannot show B waited.
