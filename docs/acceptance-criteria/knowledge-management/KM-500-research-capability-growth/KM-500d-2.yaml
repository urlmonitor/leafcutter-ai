it_requirements:
- Reuse immutable sync/status/publication protocols and canonical workflow configuration as the source of branch
  truth. Current workflow targets main; a feature/kernel-v01 merge or deployment is not evidence that main-triggered
  indexing ran.
- Readiness report binds working/requested revision, configured canonical branch, published SHA/generation,
  lag, graph readiness and separate vector/model readiness. Identify manual sync and actual event-triggered
  publication separately.
- Keep serving and writer credentials separate through existing secret loaders; graph research requests and
  traces must never carry writer secrets. Report missing setting names only.
- Publicly test dirty worktree, feature merge, canonical merge, explicit immutable manual sync, out-of-order
  events and failure against existing guarantees. Actual remote workflow proof requires authorized deployment
  and records event/run identity; no merge or remote dispatch is authorized by this AC-only task.
- Trace correlation remains owned by the existing tracer, with request/decision/repository/generation/evidence
  references; telemetry loss must not falsify retrieval readiness.
- Include source validation before merge separately from post-merge publication; derive canonical-branch behavior
  from declared deployment configuration rather than treating the current hardcoded main workflow as universally
  configured.
- Changed-content/model embedding scheduling is separate from graph publication and semantic readiness. Record
  its trigger, pending or failed state and immutable generation instead of implying graph sync populated vectors.
- Measure total deployment capacity across simultaneously retained/building generations, nodes, edges, chunks
  and vectors against configured limits; a single-generation projection count is not complete capacity proof.
- Verify actual backend privileges for serving versus ingestion principals, including an attempted forbidden
  write under the serving identity in an isolated authorized target. Distinct environment-variable names or
  the same privileged Aura principal do not prove least privilege.
- 'Persist merge-job correlation independently of a later retrieval trace lifecycle: include actual event/job
  identifier and immutable source/generation, so an expired retrieval trace cannot be mistaken for ingestion
  observability.'
test_required: true
test_rationale: Planned public-interface and separately labeled real-artifact proof covers the full observable
