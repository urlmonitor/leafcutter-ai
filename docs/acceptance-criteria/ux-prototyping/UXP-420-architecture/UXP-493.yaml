criteria: |
  As a product owner, I want product-truth to be a living layer of the Leafcutter
  architecture rather than a static document: the product-truth store lives beside the
  acceptance-criteria store, the Atlas reads that store live and renders its flows, and
  the agents produce and extend the artifacts (flows, mock data, ACs) both surfaces
  depend on — so what I review is always the current truth and the layer maintains itself
  as features are defined and built.
