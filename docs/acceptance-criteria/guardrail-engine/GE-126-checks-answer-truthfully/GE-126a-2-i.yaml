id: GE-126a-2-i
title: "Naming no target at all in an empty scope is still an ordinary pass"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the deployed AC-governance check is invoked out of process with no target named
    on its command line and no target supplied by any other route,
  And the scope it derives for itself is genuinely empty — the acceptance-criterion
    store is present at the root it resolved and no record in it is staged,
  When the check finishes,
  Then it reports the ordinary success outcome and does not report an unresolved-target
    condition,
  And the same invocation performed with one staged record that genuinely violates the
    rule still refuses that record so the pass above is a statement about scope rather
    than a check that stopped working,
  And a commit that stages only files outside the acceptance-criterion store completes
    without this check reporting anything other than the ordinary success outcome.

  Coverage note: covered only by a test that executes the deployed check in a separate
  process on a working copy with an empty in-scope set and asserts the ordinary success
  outcome, paired with a run on the same working copy with one violating record staged
  that asserts the refusal. The pair is the coverage — the pass alone is also produced
  by a check that has stopped running.
depends_on:
  - GE-126a-2
