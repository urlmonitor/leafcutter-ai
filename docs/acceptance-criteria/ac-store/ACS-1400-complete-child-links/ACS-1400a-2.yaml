notes: |
  THE L1'S CENTRAL INSIGHT, EXPRESSED AS A BEHAVIOUR. The check's silence
  currently means three different things and only one of them is a pass. This AC
  removes two of the three. ACS-1400a-1 removes the dependency-list one and
  ACS-1400a-3 makes the was-never-handed-anything case legible, so between the
  three, silence becomes unambiguous.

  VERIFIED 2026-09-08 THAT NEITHER HATCH IS CURRENTLY FIRING ON THE STORE. Running
  the real hook once per orphan child produced 21 blocks and 26 silences, and all
  26 silences were the dependency-list hatch — none was the parent-absent or
  underivable-parent shape. That is a fact about today's store, not about the
  check: both shapes are reachable in the code and both return an empty violation
  list. So this AC must be proved against a store constructed to contain them,
  and a test that merely runs the check over the current store will pass without
  exercising either branch. That trap is the reason this is its own record.

  THE THIRD Given IS THE ANTI-VACUITY HALF AND MUST STAY IN THE SAME RUN. "The
  check reports did-not-run" is trivially satisfied by a check that reports
  did-not-run for everything. Only the pairing distinguishes a check that
  adjudicated from one that abdicated.

  NEITHER OUTCOME IS DECIDED HERE TO BLOCK OR ANNOUNCE. GE-120 owns that
  disposition and the existing outcome is deliberately independent of the exit
  code. This AC settles only that the outcome is emitted and is distinguishable
  from a pass.
