notes: 'Minimums copied from audit 2026-11-16 section 3.4 (S1); the 12 category minimums sum to 101, and twins at one per
  3 of the 50 positives (17 twins) bring the set to about 118, matching the audit''s "about 110". Why outside KM-500/TQ-500: audit
  section 3.2 found every live and interpretation case targets records written by the same team that wrote the host
  instructions and catalog descriptions. Category-to-flow mapping: explicit_known_operation = direct branch;
  missing_typed_input and ambiguous_population = clarify branch; one_suitable_query and several_plausible_one_correct =
  select step; unsupported_source_data and field_availability_gap = data-gap branch; missing_query_supported_mapping =
  build branch; injected_* = unavailable branch. The case content needs reviewers who are not the implementer (see
  KM-500a-4-v); the IT PO may split the case authoring from the composition check. Draft. IT PO 2026-11-17: the case
  authoring is now KM-500a-4-x (the S1 data run, executed by the driving session); cases.json and holdout.json moved to
  that record''s declared_files. This record keeps the schema, the composition check and policy.json.'
