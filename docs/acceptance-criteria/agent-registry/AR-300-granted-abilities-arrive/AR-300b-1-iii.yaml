notes: |
  WHY AN L3 AND NOT AN EDIT TO AR-300b-1. AR-300b-1 (approved) already names the
  spawn-allowlist section as one of the two preparations its gate must report,
  and its criteria remain true: on the tree it was authored against, both were
  undelivered. What changes with user decision 9 is that the spawn preparation
  stops being "dead and reported" and becomes "delivered and guarded". That
  after-repair behaviour is new, so it is stated here rather than by rewriting
  an approved criterion. AR-300b-1's notes carry a dated pointer to this record
  (amended_by entry, criteria unchanged).

  THE SAME-CHECK CLAUSE IS AR-300b-2's PROMISE APPLIED. A sub-agent-specific
  check would pass every clause above and re-create the per-block guarantee
  AR-300b exists to replace. The sub-agent section must arrive in the gate's
  coverage by registering as a per-agent preparation, not by being named.

  CONSEQUENCE FOR AR-300b-1-i. Its descriptor "gate does not fire on the real
  repository population" cannot pass until the sub-agent section is delivered
  (AR-300a-5) and architect-review-deep is resolved (AR-300c-5-iii) -- the
  first because the gate would report 25 undelivered sections, the second
  because the build refuses before it gets that far.

  THE NEGATIVE CLAUSE (permitted none, not reported) keeps the gate usable:
  most agents permit no sub-agents, and a gate that reports them is the noisy
  rule this component has already lost once.
