notes: |
  THIS AC IS THE EXPIRY TEST, and it is why the parent calls this work urgent rather than
  tidy. The interim mitigation recorded in KI-SS-001 is to dispatch every step so its result
  returns inside the dispatching turn. That knob is documented as disappearing in a coming
  release — silently, with no error — at which point the workaround stops working while
  continuing to look like it works. The version threshold in KI-SS-001 is second-hand and
  unverified; the direction of travel is not.

  Running the build in an environment where the option has been REMOVED is what makes this
  testable today against a change that lands tomorrow. Running it with background dispatch
  forced ON is the stronger of the two, because it is the state the coming default puts the
  system in.

  THE THIRD SCENARIO CATCHES THE OTHER HALF OF THE SAME TRAP: code that passes the option
  explicitly will fail when the option is gone, and that failure is the one thing worse than
  the silent behaviour change, because it takes out every drive at once. A build that neither
  depends on the option nor breaks in its absence is the durable state.

  Note this is a stronger requirement than "do not use the background option" — that is a
  prompt-level rule of the kind this tree rejects. The criterion is expressed as an outcome
  observed in an environment where the option cannot be used, so no instruction has to be
  obeyed for it to hold.

  IT-PO ENRICHMENT NOTE (2026-08-26). The one implementation trap worth naming: it is tempting
  to satisfy this by explicitly forcing foreground dispatch everywhere. That passes the first
  scenario and FAILS the third the day the option disappears, because the explicit selection
  becomes an unknown argument. Independence, not selection, is the requirement.
