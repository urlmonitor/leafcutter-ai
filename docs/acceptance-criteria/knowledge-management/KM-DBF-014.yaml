notes: "Authored by /quick-fix. Root cause: scripts/generate_doc_index.py:340 computes the header timestamp as datetime.now(timezone.utc) and the file is rewritten unconditionally, so the 'Generated: <HH:MM UTC>' line at line 51 changes on every run. This contradicts the module's own stated intent at line 345 ('never to datetime.now()' ... 'so that regenerating without source changes does not bump it'), which is honoured for the per-doc dates but not for the header. Consequence: the doc-index pre-commit hook produces an unstaged change on essentially every commit; pre-commit stashes unstaged changes and restores them after hooks run, so this guaranteed churn is the reliable ingredient in 'patch does not apply' / 'Stashed changes conflicted with hook auto-fixes' restore failures, which can leave the index and working tree in a mixed state after a failed commit."
