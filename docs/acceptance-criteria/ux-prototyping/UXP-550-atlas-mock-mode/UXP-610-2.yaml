it_requirements:
  - "In a CI / non-production build, the /api/drift-guard and /api/mock-toggle-check route handlers under leafcutter-web/app/api/ must be compiled in and respond, so the same production-gating that removes them in production must leave them present in CI."
  - "The gating condition (UXP-610) and the production-detection signal (UXP-608-3) must be the single control point, so presence-in-CI and absence-in-production are two sides of one decision and cannot drift apart."
