work_status: done
criteria: |
  Given a classifier outcome whose run-set includes more than one artifact agent,
  When the product-truth phase dispatches those agents,
  Then they always run in the fixed order mock-data -> mockup -> flow (filtered to the
  run-set),
  And the order does not change even when the classifier's advisory dispatch array
  lists the agents in a different order.
