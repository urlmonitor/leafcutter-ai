notes: |
  The person decided the value at the gate: `feedback-id: (not-a-signoff)`. It is comment
  text only. It is NOT a feedback submission writer or category, and ticket-supervisor
  is NOT added to any category's writers. The person rejected that. See BO-2000g-2-i.

  Locations verified 2026-11-16 in this checkout (line numbers drift; re-locate by text):
  commit.md:302; ticket-supervisor.md:350 (test-writer skip, which is also a proxy sign-off
  of the skipped phase) and :373 (contract-shrinking warning); building-epics SKILL.md:605
  (produces-trait warning). The building-epics skill holds three more note entries the
  dispatch did not list: :457 (ac-validator skip proxy sign-off), :496 (test-writer skip
  proxy sign-off) and :546 (contract-shrinking warning). These are the
  "ticket-supervisor proxy sign-off of a skipped phase" entries. They write the heading as
  `### <today> <time> — ` rather than `### YYYY-MM-DD HH:MM — `, so a lint keyed only on
  the latter spelling misses them. BO-2000g-3 covers that.

  Why the commit audit entry is a note: the commit agent signs off its own phase
  separately. The audit entry records the auto-authorised gate before the commit runs
  (KI-SS-20260927).
test_spec:
  - name: test_signoff_skill_defines_not_a_signoff_in_exactly_one_subsection
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      The signoff skill has exactly one heading-delimited subsection that defines the value
      feedback-id: (not-a-signoff). The literal appears in a definition once, a missing subsection
      fails loudly, and a second definition elsewhere in the skill fails. The subsection heading is
      stable and findable by the consumers GE-123e-3 and GE-123e-5.
    proves_clause: 'the skill defines, in exactly one place, the value `feedback-id: (not-a-signoff)` for a Comments entry that does not sign off the writing agent''s own phase'
    code_file: templates/skills/signoff/SKILL.md
  - name: test_definition_says_it_is_written_without_calling_submit_feedback
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      Inside that one subsection a sentence states the value is written without calling the
      feedback submission step (submit_feedback.py). The same sentence outside the subsection does
      not count.
    proves_clause: 'it states that this value is written without calling the feedback submission step'
    code_file: templates/skills/signoff/SKILL.md
  - name: test_definition_forbids_use_on_own_phase_signoff_and_in_place_of_fallback
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      The subsection carries two separate prohibitions: it never stands in for an id on the writing
      agent's own phase sign-off, and it never replaces the failure fallback on a phase sign-off
      whose submission failed. Each is asserted independently so a subsection with only one fails.
    proves_clause: 'it states that the value never stands in for an id on an entry that signs off the writing agent''s own phase, and never replaces the failure fallback on a phase sign-off whose submission failed'
    code_file: templates/skills/signoff/SKILL.md
  - name: test_no_other_template_or_skill_restates_the_definition
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      Walks templates/agents/ and templates/skills/ at any depth, excluding only the signoff skill.
      Every file mentioning not-a-signoff carries the literal line in an example plus a pointer to
      the signoff subsection, and no prose sentence restating the rule (written without submission,
      never an id, never replaces the fallback). Covers building-epics and ticket-supervisor, and
      files this record does not edit.
    proves_clause: 'no other agent template or skill restates that definition; each one that uses the value refers to the signoff skill for it'
    code_file: templates/skills/building-epics/SKILL.md
  - name: test_each_note_example_opens_with_exactly_not_a_signoff
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      Parametrised over the seven note examples located by heading plus body anchor text, never by
      line number: commit audit entry, ticket-supervisor test-writer skip and contract-shrinking
      warning, building-epics produces-trait warning, contract-shrinking warning, ac-validator skip
      and test-writer skip. The three building-epics pseudocode entries keep their
      <today> <time> heading spelling and indentation. The first body line, indentation removed,
      equals feedback-id: (not-a-signoff) exactly; a variant, a blank line or a later position fails.
    proves_clause: 'the first line of the example''s body (the line directly under its heading) is exactly `feedback-id: (not-a-signoff)`'
    code_file: templates/agents/ticket-supervisor.md
  - name: test_note_examples_carry_no_placeholder_invented_id_or_fallback
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      For the same seven examples no line carries a real-id placeholder spelling read from the
      signoff skill, a concrete fb_ id or the failure fallback, and the commit.md audit entry in
      particular carries only the one (not-a-signoff) line. Also asserts the commit agent
      keeps its own separate sign-off.
    proves_clause: 'it is not a real-id placeholder, an invented id, or the failure fallback'
    code_file: templates/agents/commit.md
  - name: test_note_example_definition_reaches_the_deployed_prompts
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: reachability
    description: >-
      Marked shared_layout_reader with shared_reference_layout. Reads the DEPLOYED signoff skill and
      deployed ticket-supervisor template (what an agent loads) and asserts the single definition
      subsection and the first-body-line literal under the supervisor skip entry are present. Fails,
      never skips, when the layout or a deployed file is missing. No build.py, no writes into the layout.
    proves_clause: 'the first line of the example''s body (the line directly under its heading) is exactly `feedback-id: (not-a-signoff)`'
    code_file: templates/agents/ticket-supervisor.md
