notes: |
  WHY THIS IS NOT PART OF BO-3800b. Asking the right party and asking it the right question
  are separately failable. A handoff that reaches the restructuring specialist with nothing
  but "this file is too big" fully satisfies the separation of duties and fully fails here:
  the specialist restructures to its own taste, the standard refuses again for a different
  amount, and the loop that BO-3800d has to bound becomes the normal case rather than the
  exception. This is the same split BO-2200 makes between dispatching a writer and briefing
  one.

  THE FAILURE THIS EXCLUDES IS RECONSTRUCTION, NOT ABSENCE. The tempting implementation is
  not "send nothing" — it is "send the file name and let the specialist re-run the standard
  to find out how much". That is a second derivation of a quantity already in hand, it can
  disagree with the first, and when it does, the specialist satisfies a demand that is not
  the one blocking delivery. GE-127f-1's enrichment refuses the same shape on its own side
  of the seam ("recomputing any of them on the way to the message is how the printed
  arithmetic stops reconciling with the verdict"); this is that rule applied to the handoff.

  WHAT THIS RECORD DOES NOT OWN. How much must leave the file (GE-127f-1), what counts as a
  line the change added (GE-127f-2), which lines are measured at all (GE-127d), how the
  refusal reads (GE-127e), and where the author-clearable threshold falls (GE-127f-3). Every
  one of those is consumed and none may be restated.
