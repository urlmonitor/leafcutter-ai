estimated_complexity: M
it_requirements:
  - "DESIGN DECISION (settled): the prior 'was-done' state is detected from the AC YAML file's GIT HISTORY — compare the AC's work_status in the merge-base (or the last committed revision of the AC file) against the working-tree/current value; a done -> not-done transition is the trigger. This is the source-of-truth for 'was done', NOT the live-failing-test signal alone."
  - "The downgrade-while-failing condition requires BOTH signals to fire: (a) git-history shows work_status went done -> not-done for that AC, AND (b) the covering test is currently failing. Only the conjunction blocks; a clean downgrade of a passing-test AC is allowed."
  - "Git access must be wrapped per the project error handling policy (CLAUDE.md Rules 1-4): subprocess git calls catch a specific exception, log at WARNING; if git history is genuinely unavailable (e.g. shallow clone, no merge-base), FAIL-SAFE toward enforced — do not silently allow the downgrade."
  - "Implemented as a violation class of the TQ-100c-2 pre-pytest integrity check (shared loader and entry point), failing loudly and naming the AC and its failing covering test; distinct from an assertion failure."
  - "If deployed as a commit-time/CI gate, keep templates/ source and deployed copy in parity via build.py (ADR-001)."
