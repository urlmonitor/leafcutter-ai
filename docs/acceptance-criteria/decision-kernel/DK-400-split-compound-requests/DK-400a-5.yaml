id: DK-400a-5
title: "Reference entry: when a request is split, left whole or recorded as a capability gap"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a reader who wants to know what the kernel does with a request that may hold several
    questions,
  When they open the kernel's reference entry on splits,
  Then it states the four routing-time outcomes, each with one example request: offered as a
    split because routing turned it away (jev_none or ambiguous), offered as a split although
    routing would accept it as one decision (bundled_accepted), left whole as one decision, and
    recorded as a capability gap,
  And it states that a request proposed as fewer than two parts is treated as one question with
    no split gate,
  And it states that a request that is split is not counted as a capability gap, while a single
    question no capability can meet still is.
