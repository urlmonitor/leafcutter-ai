notes: |
  The gap between the two named failure modes. Once the back-links are restored
  the tree stops being an orphan and stops being parked, and because it has no
  leaves it never reaches the buildable queue either — so without this AC it
  falls out of every report and becomes invisible while looking healthy. That is
  the parked-forever risk arriving through the exit door rather than the
  entrance.

  The no-silent-reversion clause matters for the same reason the marker is
  positive in the first place: a state the system re-applies on your behalf is
  not a decision anyone made.

  Deliberately no duration, age, or count here — how long a tree has sat in any
  state is KM-200c's remit.
