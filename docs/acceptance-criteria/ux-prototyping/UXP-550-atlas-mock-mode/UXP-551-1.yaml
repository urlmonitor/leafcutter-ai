id: UXP-551-1
readiness: draft
priority: medium
title: "The JSON entity mock-data records are repurposed directly as test fixtures, no separate authoring"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given the product-truth / entity mock-data records under leafcutter-web/fixtures/ (the
  Plant/Customer/Order-style record data) are authored as plain JSON files shaped
  identically to the real artifacts they stand in for,
  When test-writer needs fixture data for a unit test that exercises the same shape,
  Then test-writer loads those exact same JSON entity mock-data files directly, with no
  separate fixture-authoring step,
  And a test that reads one of these JSON files receives data of the same shape a loader
  produces from the corresponding real artifact,
  And no parallel or divergent copy of the entity mock-data is created for tests,
  And this claim is scoped to the JSON entity mock-data records only, not to the YAML AC
  store or markdown ticket parts of the canned repo.
