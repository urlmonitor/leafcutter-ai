notes: |
  Wave 2. Follows from the IT PO's surface decision for BO-2500f-3-ii: the
  surface is a /inspect slash command over an inspect.js workflow. The command
  file (templates/commands/inspect.md) is llm-expert territory
  (templates/commands/**), so it is a separate record from the workflow
  (python-coder).

  The last two clauses guard the residual trust recorded on BO-2500f-3-i: the
  command must not become a second way to create an "approve", and must not
  invite the agent to answer the person's gate.

  The proof kind is a prompt (BO-3500c-2-iv): the consuming surface loads the
  command and behaves as described. DK-210b-3 is an example id.

  Wiring note for the IT PO: BO-2500f-3-ii should name this record as the
  consumer of its workflow entry point (delivers_to / expects_from), left out
  here so the rule check's symmetry family stays clean until both sides are set.
