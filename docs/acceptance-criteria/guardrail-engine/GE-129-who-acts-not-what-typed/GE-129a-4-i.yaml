id: GE-129a-4-i
title: "The commit specialist parity check runs when a session starts and when the package is installed, and sees same-named definitions outside the project"
component: guardrail-engine
components:
  - commit_guardian
  - agent_registry
  - bootstrap_installer
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a developer environment with three projects that have the package installed:
    (p1) the installed commit specialist definition is byte-identical to the shipped one, a second
         definition declaring the commit specialist's name exists at user scope, and a third is
         provided by an installed plugin,
    (p2) the installed definition differs from the shipped one in one line of its instructions,
         the project records no exemption, and no other definition declares the name,
    (p3) the installed definition is byte-identical to the shipped one and no other definition
         declares the name,
  When, as the session-start case, the developer starts a new session in each project and issues
    no commit in it,
  Then for (p1) the session shows the parity failure naming the user-scope location and the plugin
    location, without the person asking for the check,
    And for (p2) the session shows the parity failure quoting the first differing line and the
    shipped line it replaced,
    And for (p3) the session shows no parity finding.

  Given the same developer environment and the same three projects,
  When, as the install case, the package is installed again into each project from that
    environment, with no session started and no commit issued,
  Then the install's report shows the parity failure for (p1) naming the user-scope location and
    the plugin location,
    And the install's report shows the parity failure for (p2) quoting the first differing line,
    And the install's report for (p3) shows no parity finding.

  Given (p1) with its user-scope definition removed and nothing else changed,
  When the session-start case and the install case are each repeated,
  Then each failure names the plugin location and no longer names a user-scope location.
