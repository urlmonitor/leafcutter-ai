notes: |
  ADDED AT BRAINCANDY'S DIRECTION, 2026-10-09: "Spawn restructuring agent (which should
  have the complexity skill)." This is INF-800f's first L2. INF-800f's own fields are the
  Product Owner's and were not edited, apart from the mandatory covered_by back-link.

  THE AGENT ID IS NOT FIXED HERE. code-refactoring-specialist, the existing prompt's name,
  is the obvious candidate. The IT PO chooses it, and BO-3800b-1, c-1 and d-1 can then be
  enriched against a real id (their stated unblock condition). The criteria name the
  party by role so they survive the choice.

  WHAT THIS RECORD LEAVES TO INF-800f's REST. Its tool set and sign-off protocol, and how
  it restructures safely (INF-800a to e). This record covers only that the agent exists,
  is distinct from the author, and picks complexity-reduction by demand.

  NAMED MUTATIONS.
  (1) THE RENAMED CODER: register the specialist as an alias that resolves to
      python-coder. MUST GO RED: arm one.
  (2) THE ALWAYS-ON SKILL: load complexity-reduction on every engagement. MUST GO RED:
      arm three. MUST STAY GREEN: arms one and two.
