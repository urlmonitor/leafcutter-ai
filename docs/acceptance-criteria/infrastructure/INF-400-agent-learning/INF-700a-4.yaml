notes: |
  The last clause of the criteria is the one the whole L1 turns on. ADR-034
  recorded that until the harvester has a caller, capture is not automatic and
  any documentation implying otherwise is wrong — and the document this AC
  amends currently implies exactly that. The obligation is symmetric and easy to
  half-honour: the same document must stop calling it manual on the day the
  first completion path carries it, or the next reader will run by hand a step
  that has already run and read the duplicate as a defect.
