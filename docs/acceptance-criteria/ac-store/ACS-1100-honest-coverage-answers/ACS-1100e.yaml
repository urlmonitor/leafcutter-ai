notes: |
  WHY THIS L1 EXISTS (added 2026-08-13 in response to expert review).

  The first authoring pass put a reference-doc AC under each of ACS-1100a, b, c and d
  (ACS-1100a-4, ACS-1100b-3, ACS-1100c-3, ACS-1100d-3). All four wrote sections of the
  SAME file, docs/reference/ac-schema.md. The build's file-touch parallelism gate would
  have serialised them into four sequential tickets editing one file — a guaranteed
  conflict — and they accounted for 5 of 15 leaves (33%) of the whole tree. They are now
  one AC, ACS-1100e-1.

  WHY A SIBLING L1 RATHER THAN A CHILD OF a/b/c/d. The consolidated section documents
  contracts owned by all four behavioural L1s. Hanging it under any one of them would
  (i) give a child prerequisites living outside its own parent's subtree — its
  depends_on would reach into three sibling L1s' children — and (ii) gate one L1's
  completion on documentation of behaviour that L1 does not own. A sibling L1 whose
  single outcome is "the contract is written down" is the honest home. This takes the
  L0 to five L1s (cap 7) and leaves every behavioural L1 at three children or fewer
  (cap 5).

  ACS-1100a, b and c consequently carry documentation_triggers: [] plus a
  documentation_rationale naming this L1. ACS-1100d keeps [component-diagram], which is
  a different artifact by a different agent (ACS-1100d-4) and is deliberately NOT
  folded in here.
