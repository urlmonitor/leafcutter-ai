it_requirements:
  - "THESE TESTS ARE WRITTEN FROM THE ATTACKER'S SIDE, AND THAT IS THE SPECIFICATION, NOT AN ASPIRATION. For each of the five kinds, construct the CHEAPEST artifact that could plausibly pass its proof and assert the proof returns false. If the cheapest passing artifact cannot be named for a kind, that kind's proof is not specified tightly enough yet and this record is not satisfied for it."
  - "STATE THEM IN ONE PLACE, ACROSS ALL FIVE KINDS. The failure mode is not per-kind: it is that whoever implements the five proofs implements the first carefully and the remaining four by analogy, and analogy from the written-page proof produces four existence checks. A hollow case tested inside each per-kind record would be written by the same analogy that produced the defect."
  - "REPORT VOCABULARY IS PART OF THE CRITERION. 'Produced but does not deliver what the requirement asked for' must be a DISTINCT outcome value from 'not produced', branchable by a caller. A reader told the artifact is missing goes looking for a run that did not happen — this component's register records exactly that cost, where a correct refusal reported in the wrong vocabulary sent readers hunting for a test that was never supposed to exist."
  - "FOR THE COMPARING KINDS, DO NOT REIMPLEMENT THE DEGENERATE-COMPARISON CHECK — CONSUME BO-3500c-1's. A hollow setting and an ignored instruction both present as condition_a == condition_b, which the receipt validator already rejects at write time. Assert the CONSUMPTION (that the hollow member fails because the receipt validator refused it), not a second copy of the rule."
  - "FOR THE READING KINDS THE PATH IS DIFFERENT AND MUST STAY DIFFERENT. A reading proof has no second condition, so a hollow page cannot present as a degenerate comparison; it is caught by BO-3500c-2-i's content and subject clauses. Keep the two paths distinct — collapsing them either adds a fake second condition to the page proof or lets a hollow page through."
  - "THIRD SCENARIO TIES THIS TO BO-3500b-2 SO THE TWO CANNOT BE SATISFIED SEPARATELY: for the purposes of the group's ending, a hollow member is a member that was not produced, and the sound members are not delivered without it."
  - "NO PRESENCE-ONLY ASSERTIONS. Every test constructs a real hollow artifact and executes the proof."
