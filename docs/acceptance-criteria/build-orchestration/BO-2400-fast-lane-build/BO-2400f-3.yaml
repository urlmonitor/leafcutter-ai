criteria: |
  Given the one-command build is triggered for an AC id,
  When it starts,
  Then it fetches origin and creates a dedicated worktree on a fresh branch cut from
    the latest origin/main (never from stale local main),
  And the branch name is derived from the AC id and prefixed for a build (e.g.
    fast-lane/<slug>), distinct from ac-authoring branches,
  And the worktree is bootstrapped so package pre-commit hooks are active in it,
  And the operator does not create the worktree by hand.
