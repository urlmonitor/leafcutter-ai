title: "A line that is not a record does not derail the run and is never written as knowledge"
component: infrastructure
level: L3
status: active
req_status: active
work_status: done
priority: medium
readiness: approved
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700c-1.yaml"
criteria: |
  Given the file the writer reads contains a line that is not a JSON object —
    for example a stray fragment of markup left behind by a hand-composed
    append,
  And well-formed knowledge records carrying real learning text appear both
    before and after that line,
  When the writer reads the file,
  Then it does not stop at the malformed line,
  And every well-formed record before it and after it is processed,
  And the malformed line's content is not written to any knowledge surface, in
    whole or in part,
  And the run reports the malformed line with its line number and a count of
    such lines, separately from records written and records carrying no
    learning,
  And the malformed line is left in the file rather than removed, so the damage
    remains inspectable,
  And the run's outcome distinguishes "read the whole file" from "stopped part
    way through".
