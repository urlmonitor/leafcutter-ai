criteria: |
  Each part of a requirement comes from the one able to get it right.

  Today one planning step writes almost every technical part of a requirement,
  including parts it cannot see enough to write well: how a behaviour should be
  tested, and which files a piece of work really touches. It also spends effort
  re-checking rules that never need judgment. After this goal, judgment calls stay
  with the planner, rule checks run the same way every time without anyone having to
  remember them, and anything that depends on the actual code is decided by
  something that has looked at the code. The result is requirements that are
  cheaper to produce, more consistent, and whose test guidance can be trusted.
