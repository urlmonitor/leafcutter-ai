notes: |
  RESOLVED 2026-10-08: PULL REQUESTS THAT ARE NOT PUSHED AFTER THE VERDICT CHANGES.
  TQ-600a-13-xv re-runs this check on every open pull request on each verdict change, in
  both directions. Residual, named there: a pull request whose last hold run is older
  than the platform's 30-day re-run limit cannot be re-run and is listed rather than
  silently left.

  CHECK-NAME SPOOF — CLOSED BY THIS DESIGN ONCE TQ-600a-13-x LANDS (owner decision,
  2026-10-09, BrainCandy; supersedes the "known and accepted" wording of user decision H,
  2026-10-08). The gap: any pull request can add a workflow of its own with a job named
  `Post-merge suite status` that exits zero, and while the ruleset pins the context to
  the GitHub Actions app (15368) — which is any Actions job — that spoof satisfies it.
  The owner created the dedicated App (ID 5249547, Checks read and write, this repository
  only). This record now publishes the verdict as that App's check run and renames the
  Actions job; TQ-600a-13-x pins the required context to the App's integration id, after
  which a same-named check from any other source cannot satisfy it. UNTIL -x's ruleset
  entry is added and its spoof observation recorded, the gap is OPEN (the hold is
  advisory anyway until then). The gap is closed only if the App's private key is
  reachable by the evaluation job alone — see the App it_requirement: as repository
  secrets it is readable by any same-repository `pull_request` workflow, which would let
  a PR mint the App's own token.
  STILL OPEN, NOT CLOSED BY THIS RECORD: the six other required checks remain pinned to
  15368 and are spoofable in the same way (any PR could fake `Test suite (pytest)`).
  Moving them onto an App is out of this family's scope.
  RESIDUAL, NAMED: a pass the App has already published on a head commit cannot be
  withdrawn by an evaluation that cannot obtain the App's credential. A re-evaluation of
  that same commit (a description edit, or TQ-600a-13-xv after a red run) then fails its
  job and says the verdict could not be refreshed, but the earlier success stands until a
  later evaluation can write. Open question for the owner.

  risk_surface raised from internal to auth: this record now owns the trust boundary of a
  merge gate.
