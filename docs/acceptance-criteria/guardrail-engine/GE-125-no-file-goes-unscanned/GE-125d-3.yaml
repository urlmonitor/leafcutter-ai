id: GE-125d-3
components:
  - security_scanner
  - commit_guardian
title: "Silence means nothing was withheld, and a run that withheld a great deal still speaks only once"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a throwaway git repository whose staged set is 40 files under
    "docs/acceptance-criteria/guardrail-engine/", every one of them under a
    location to which the check applies reduced scrutiny — placed there
    deliberately, because a run over reduced locations that withholds nothing is
    the exact case this arm exists to pin — and none of them containing any
    value the check's detection rules would have reported,
  When the staged set is checked on the path a real commit takes,
  Then this check writes nothing to the error stream — no header, no zero count,
    no per-file line — and adds nothing to the output stream,
  And the machine-readable reduction total for the run is 0,
  Because reduced scrutiny that withheld nothing is not a gap in anyone's
    protection, and a line printed on every commit for every prose file is the
    fastest way to teach a reader to scroll past the one line that mattered.
    THIS IS THE NEGATIVE CONTROL FOR THE WHOLE L1: without it, a check that
    prints an unconditional warning satisfies every other criterion here.

  Given a staged set of one file outside every reduced location, "src/app.py",
    carrying one credential-shaped value that is reported normally, and no file
    under any reduced location,
  When the staged set is checked on the path a real commit takes,
  Then the finding is reported in the way it is reported today and no reduction
    notice is written on either stream,
  Because the notice is scoped to the reduction and is not an ornament attached
    to every run that found something.

  Given a staged set in which 30 files under reduced locations each have at
    least one finding withheld, 412 withheld in total,
  When the staged set is checked on the path a real commit takes,
  Then exactly one notice is written for the whole run: a single header carrying
    the total of 412 withheld findings across 30 files, then at most 10 per-file
    lines, then one final line stating how many further affected files are not
    listed,
  And no second notice block is written for any further file,
  And the machine-readable reduction record for the same run still carries all
    30 files and the full total, so the abbreviation is a display choice and not
    a loss of information,
  Because the granularity was chosen deliberately and the rejected forms are
    worth naming: a paragraph per withheld finding would put hundreds of lines
    on the error stream of an ordinary documentation commit and reproduce, as
    noise, the invisibility this L1 exists to remove; one block per file fails
    the same way more slowly; and announcing every file the reduction APPLIED to
    regardless of outcome would be louder still in a store holding thousands of
    prose files. One summary per run, spoken only when something was actually
    withheld, with a bounded file list and an exact total, is the form that
    someone still reads on the day it matters.

  Given each of the three runs above,
  When the run finishes,
  Then the exit status is decided only by the findings that were reported, and
    is identical to what it would be if this L1 had never been built,
  Because the announcement is an audit trail and never an input to the verdict —
    stated here as well as in GE-125d-1 because it is the property most easily
    lost when a threshold or a rollup is added later.
