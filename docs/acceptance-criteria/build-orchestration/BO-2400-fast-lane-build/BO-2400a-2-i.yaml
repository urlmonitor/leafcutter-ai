  - name: test_batch_truncated_to_cohesion_cap
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "When ready cohesive ACs exceed M, the selected batch contains at most M ACs."
  - name: test_overflow_acs_remain_ready
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "ACs beyond the cap are excluded from this batch and remain in the ready set for a later loop."
