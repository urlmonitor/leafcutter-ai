id: BO-4400f-3-i
title: "Logs a run writes survive its scratch deletion and every sweep"
component: build-orchestration
components:
  - build_orchestration
  - testing_quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
criteria: |
  Given the build of a single ticket writes a run log and a test-results log while it
    works, alongside its scratch items,
  When the route reaches its end state and deletes its own scratch, and the sweep then
    runs with the scratch age limit set to 0 hours,
  Then both logs exist afterwards at the durable location they were written to and are
    byte-identical to their state when the route ended,
  And neither log was ever written inside the one designated scratch location.
depends_on: [BO-4400f-3, BO-4400d-1]
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-4400-nothing-accumulates/BO-4400f.yaml
    relationship: constrains
    status: exists
    relevance: Logs stay durable, scratch does not; the rule separates them and never deletes logs.
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: BO-4400f-3
  contract: "End-of-route scratch removal."
package_surface: false
it_requirements:
  - >-
    Run logs and test-result logs are written to declared durable folders (debugging/logs/,
    test-logs/) and never inside the scratch root; neither route-end removal nor the sweep ever
    selects a path under a declared durable folder, whatever its name or age.
  - >-
    PROOF: the single-ticket route under unit_tests/_workflow_engine_harness.py writes both logs
    through its normal steps; then the deployed sweep runs as a separate process with
    scratch_max_age_hours set to 0; hashes of both logs taken at route end and after the sweep.
test_required: true
test_spec:
  - name: test_logs_survive_route_end_and_zero_age_sweep
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Both logs exist at their durable location, byte-identical to their state at route end."
    must_catch:
      - "clean-up deletes temporary-looking subfolders of the durable log folder"
  - name: test_logs_never_written_inside_scratch_location
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "No file under the scratch root was ever a log of this run (checked by snapshot during the run)."
test_rationale: >-
  An age limit of zero makes any misclassified log disappear, so one aggressive real sweep is the
  sharpest test that logs and scratch are truly separated.
origin_agent: business-analyst
created: 2026-10-09
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  The age limit of 0 makes the sweep maximally aggressive, so any log misclassified as
  scratch is removed and this record goes red. Named wrong version: "clean up" implemented
  by deleting the durable log folder's temporary-looking subfolders.
