  ac_id: BO-2400c-1
  contract: "The assembled prompt's stable-prefix segment (content before the cache breakpoint) whose checksum is compared across the drive."
test_spec:
  - name: test_stable_prefix_churn_flagged
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: unit
    description: "When the stable prefix differs between two invocations meant to share the cache, the checksum comparison flags the mismatch."
  - name: test_matching_stable_prefix_not_flagged
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: unit
    description: "Identical stable prefixes across invocations produce no churn flag."
