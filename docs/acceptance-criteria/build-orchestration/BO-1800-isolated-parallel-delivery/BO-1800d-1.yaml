readiness: approved
priority: medium
title: "Automatic garbage collection and maintenance are disabled inside a drive clone during a drive"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/build-orchestration/BO-1800-isolated-parallel-delivery/BO-1800d.yaml"
criteria: |
  Given a drive clone has been created and a drive is active in it,
  When the clone's git configuration is inspected during the drive,
  Then `gc.auto` is set to 0 and `maintenance.auto` is set to false in that clone,
  And these settings are established as part of drive creation (before any work
    commits), so no automatic repack or maintenance can start while the drive runs.
depends_on: [BO-1800d, BO-1800a-1]
