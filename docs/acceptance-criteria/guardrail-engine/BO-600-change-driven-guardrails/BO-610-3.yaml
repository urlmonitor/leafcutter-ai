title: "Multi-value classification: a work unit carries one or more change_targets"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket describes work that touches both database schema and production code,
  When the ticket author sets the classification fields,
  Then the change_target field accepts a list value: [code, schema]
  And both values are individually valid members of the change_target enum
  And the guardrail engine treats the ticket as requiring guardrails for BOTH targets

  Given a ticket describes work that touches UI, code, and config simultaneously,
  When the ticket author sets change_target: [ui, code, config],
  Then the classification is valid
  And the resulting guardrail set is the UNION of guardrails for each individual target
    paired with the ticket's risk_surface value

  Given a ticket has a single change_target value (not a list),
  When the classification is read by the guardrail engine,
  Then it is treated equivalently to a list of one element: [code] equals code
