- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the hooks reference,
  When a reader looks up how a file protection treats a shell command,
  Then it states that a command clearly writing a protected file is refused before it runs, and
    that a command whose effect cannot be told beforehand runs and is examined afterwards,
  And it states that a stop afterwards names the changed protected files and leaves them changed,
    and what the caller must do to continue,
  And it states that a caller is stopped only for its own command's changes, and what the reader
    sees when the protection cannot tell whose change it was,
  And it states that the protection says so and stops when it cannot tell what a command
    changed.
