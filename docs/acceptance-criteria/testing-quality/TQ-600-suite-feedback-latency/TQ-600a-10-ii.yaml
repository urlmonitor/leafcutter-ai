notes: |
  This record exists because its parent is the one item in the evidence base with a
  large claimed upside and no measurement behind it. Every other saving in this branch
  of work was derived by counting real build subprocesses against known per-build rates;
  this one was derived by counting files.

  The response to a null result is specified in advance on purpose. Agreeing it
  afterwards, with the change already written and the argument still sounding good, is
  not a decision anybody makes well.
