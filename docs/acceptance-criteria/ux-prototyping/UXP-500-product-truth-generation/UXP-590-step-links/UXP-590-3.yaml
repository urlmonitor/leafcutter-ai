test_spec:
- name: test_shifted_links_report_one_error_per_step_link_whose_ac_claims_another_step
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: criterion
  description: On a fixture copy of the store in the shifted state with the four claims, asserts exactly
    the three mislink errors 'derive links UXP-511, which claims invert', 'invert links UXP-512, which
    claims backref', 'backref links UXP-513, which claims validate'.
- name: test_shifted_links_report_one_error_per_claim_no_step_link_supports
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: criterion
  description: On the same fixture, asserts exactly the four unsupported-claim errors for UXP-510 (derive),
    UXP-511 (invert), UXP-512 (backref) and UXP-513 (validate).
- name: test_every_step_claim_error_names_flow_step_and_ac
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: criterion
  description: Asserts every step-claim error string contains the flow id, the step id and the AC id.
- name: test_corrected_links_produce_no_step_claim_errors
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: discrimination
  description: 'Same fixture with the UXP-590-1 corrected links: asserts zero step-claim errors.'
  must_catch:
  - compare the claims against the generated product_truth back-reference instead of the flow's implements
  - report only one direction (mislinks but not unsupported claims, or the reverse)
  - treat an AC with no claim entry for a flow as unchecked although it carries claims for another flow
- name: test_validator_cli_exits_nonzero_on_the_shifted_fixture_store
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: reachability
  description: Runs validate_product_truth.py's main() / CLI over the shifted fixture store and asserts
    a non-zero exit with the step-claim errors in its output, proving the check is wired into run_checks().
- name: test_ac_schema_accepts_specifies_steps_and_rejects_malformed_claims
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: seam
  description: 'Runs validate_ac_schema.py against fixture ACs: a well-formed specifies_steps passes;
    a missing steps key, an empty steps list, a non-string step and an unknown entry key each fail.'
- name: test_deployed_ac_schema_copy_matches_the_source_schema
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: deployed
  description: Asserts .leafcutter/config/ac_store_schema.json and config/ac_store_schema.json both define
    specifies_steps identically.
- name: test_generator_write_back_preserves_specifies_steps
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: seam
  description: Runs the generator's AC back-reference write over a fixture AC carrying specifies_steps
    and asserts the key and its value survive unchanged.
