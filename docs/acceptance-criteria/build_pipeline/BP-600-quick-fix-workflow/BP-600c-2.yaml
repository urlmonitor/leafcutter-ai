notes: |
  Amendment provenance (2026-08-24): amended in place, not superseded, per
  docs/how-to/ac-traceability-store.md.

  UNRESOLVED CONTRADICTION WITH THIS RECORD'S OWN CHILD — DO NOT READ THIS AS
  CLOSED. BP-600c-2-i (work_status: done) requires the red phase to distinguish
  a test-runner ERROR (import failure, syntax error, missing fixture) from a
  FAILED assertion, and to halt rather than treat the error as the expected red
  phase. The shipped result shape has no ERROR channel: the runner reports a
  boolean pass/fail only. An import error therefore returns "did not pass",
  which this phase reads as a good red phase and proceeds to apply the fix —
  the precise outcome BP-600c-2-i says must not happen. That is a live defect,
  not merely a stale criterion, so it is deliberately NOT written out of this
  record's contract here. Adding an error channel to the runner result is the
  fix; amending BP-600c-2-i to match the current behaviour would be recording
  a bug as a requirement.
