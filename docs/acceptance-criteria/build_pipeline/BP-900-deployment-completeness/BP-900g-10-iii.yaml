id: BP-900g-10-iii
components:
  - build_pipeline
title: "A declaring file is located relative to the install that owns the reader, so the verdict does not depend on where the process was started"
component: build-pipeline
level: L3
status: active
req_status: active
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g-10.yaml"
criteria: |
  Given a deployed guardrail or workflow that reads a declaring file shipped with the
    install,
  When it is invoked twice against identical input from two different working
    directories — once from the install root, once from a nested subdirectory several
    levels below it,
  Then it locates the same declaring file both times and returns the same verdict,
  And neither run reports the file as missing,
  And when the declaring file genuinely is absent from the install, both runs report
    it missing and name the SAME expected location, so the two outcomes remain
    distinguishable from each other,
  And the expected location it names is derived from where the running artifact
    itself lives within the install, not from the directory the process was started
    in,
  And a run started from outside the install entirely reports which install it
    resolved against, so the answer to "which file did you read" is never implicit.

  Excluded from this criterion: how the install root is determined for a process
  running outside any install. That is a separate defect tracked as ACS-300g-6 and is
  being handled on its own — do not re-derive or re-specify it here. This criterion is
  satisfied by anchoring the read to the install that owns the running artifact.

  Because the agent-registry read behind the false permission denial names a relative
  path, so even after the file is deployed the read succeeds or fails according to
  where the process happened to start. Deploying the file fixes the reported symptom
  and leaves the read conditional on an accident of invocation — which is the same
  class of fragility, one layer down, and it will present as an intermittent version
  of the identical misleading error.
