criteria: |
  Given the precedent dec-ef8ddcb79d668a67 scored 0.62, at or above memory.applies_threshold (0.5)
    and below memory.reuse_threshold (0.8), on a decision with no options of its own,
  When the precedent step finishes,
  Then the precedent stays as cited prior_decisions evidence,
  And you are not asked whether to reuse it, and the forming flow continues without waiting for
    you,
  And a precedent scored 0.79 under the same conditions is treated the same way.
