title: "The sink lands in the project the package was built into, in every install shape — and says so when that stops being where it is"
component: infrastructure
level: L3
status: active
req_status: active
work_status: done
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-400c-4.yaml"
criteria: |
  Given the sink is an absolute path fixed when the package is built into a
    project, taken from the project root the build was pointed at and written
    into the configuration that build deploys, and this package installs into
    more than one shape of project: one where the package clone sits inside a
    larger workspace and the build is pointed at that workspace, and one where
    the package sits as a subdirectory of a consumer's own repository and is a
    repository in its own right,
  When an agent working in that project emits a record, and the routing step
    later reads it,
  Then in the consumer shape the sink is at the root of the CONSUMER's project
    and not inside the package subdirectory, so a learning about the consumer's
    project is reviewable, diffable and mergeable by the people who own that
    project, through the same pull request flow as everything else they change,
  And in the workspace shape the sink is at the root the build was pointed at,
    which is the root the rest of that install's deployed content already sits
    under, so the sink is beside the install it belongs to rather than beside
    the package sources,
  And that first outcome is established in a NESTED fixture, because it is only
    falsifiable in one: where the package subdirectory carries its own
    repository data, an implementation that finds the project by looking around
    it instead of by reading what the build recorded can land on the package's
    own root and file every consumer's learnings inside the package clone,
    where the consumer's review never sees them and the next package update
    collides with them. A single-project fixture cannot tell the two apart and
    does not satisfy this criterion,
  And because the path is fixed by the build rather than discovered, moving an
    installed project by hand does not move its sink: a declared path whose
    directory is no longer there is reported as a declaration that has gone
    stale, naming the path it was given and saying a rebuild is what repairs
    it, and this is said DISTINCTLY from a sink that has simply never been
    written to. Nothing is written into nowhere, no directory is conjured to
    have somewhere to write, and no new exit status is introduced for it,
  And a build pointed at an isolated working directory of a project that is
    already installed does not quietly give that working directory a sink of
    its own: either the work done there reaches the same sink as the rest of
    the project, or the build states that it is creating a second one and which
    project it is dividing. A second sink produced in silence is the original
    defect restored in full — records accumulating in a directory that is
    removed after merge, with every check green — reached this time by an
    ordinary rebuild rather than by a relative path,
  And where the declared location differs from the location a project's records
    are already accumulating in when the declaration is adopted, that
    difference is stated once, naming both locations, and is reconciled
    deliberately rather than discovered later. What is forbidden is the
    location changing with nothing saying so, leaving a populated file nobody
    reads and an empty file everybody does,
  And in every one of these shapes the answer to "where is the sink" is
    obtainable without emitting a record or running a harvest, so the location
    can be established before anything depends on it.
