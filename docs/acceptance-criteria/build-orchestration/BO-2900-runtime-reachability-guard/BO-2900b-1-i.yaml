notes: |
  Isolated as an L3 because it is the case that decides whether the guard is
  survivable in daily use, and it is invisible from BO-2900b-1's own scenario.

  THE ADOPTION TRAP. A forward check that refuses any registered-but-uncalled
  capability makes the natural two-step workflow — land the capability, then wire the
  automation — impossible. A team that hits that wall on a Friday afternoon does not
  file a ticket; it switches the check off, and the guarantee is gone. Two things
  make it survivable, and both are asserted here: the same-change path must genuinely
  pass (the positive scenario is as load-bearing as the negative one), and the refusal
  must hand the author a reasoned exemption instead of leaving "disable it" as the
  only visible exit.

  WHY THE POSITIVE SCENARIO IS FIRST. An implementation that refuses both cases still
  satisfies a negative-only test. Ordering the passing case first makes the fixture
  pair explicit and stops the check from being validated against refusals alone.

  The "does not suggest disabling the check" clause is deliberate and testable: it
  refuses the common convenience of printing the skip flag in the failure output,
  which quietly converts a blocking gate into an advisory one.
