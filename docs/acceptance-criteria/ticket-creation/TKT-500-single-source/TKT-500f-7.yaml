amended_by:
  - reason: "SCOPE NARROWED 2026-08-25 (business-analyst, on BrainCandy's instruction) — this AC now governs only the NO-AUTHORED-DEMAND case. It was authored 2026-06-22, before an authored proof demand (test_spec) was a first-class field on a requirement, so the shape of files_touched was its only available input. Since f3ac950c / PR #536 a requirement may author a proof demand explicitly, and 14 of the 85 affected records are docs/config-only AND author one (12 documentation-expert, 2 architecture-diagram-author); generation now emits a proof section for them. Read literally, that shipped behaviour violates this approved AC. Precedence is resolved in favour of the author: an explicitly authored demand outranks an inference drawn from path shape. The Gherkin for the ruling is TKT-500g-1-i. This AC's own criteria are left UNCHANGED and remain correct for their intended input; the narrowing is carried as a new it_requirement so the unbuilt implementation orders the two checks correctly."
  - reason: "TEST CONTRACT AUTHORED 2026-08-25 (it-po). This approved code AC carried no test contract at all — a pre-existing gap that was invisible until the business-analyst's amendment staged the file, because the commit-time AC hooks read the staged index rather than the store. Five descriptors are added, derived from this AC's own Gherkin. It is genuinely code (change_target: code, python-coder, two real generator surfaces), so test_required: false was rejected as a way to clear the gate. The business-analyst's fourth it_requirement is KEPT but restated from an ordering instruction ('check for an authored test_spec BEFORE consulting files_touched') to the precedence policy it is really about, leaving the implementer free to choose the mechanism while forbidding the outcome; their disclosure of the boundary crossing was correct and the substance was right. A fifth it_requirement is added recording that goal_to_epic.py has no emit branch at all, so it satisfies this AC vacuously while losing every demand it is handed."
