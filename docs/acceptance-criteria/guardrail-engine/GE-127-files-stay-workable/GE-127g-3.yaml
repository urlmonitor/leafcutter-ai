id: GE-127g-3
title: "The set-aside population is exactly the declared locations, so a document a person writes is still judged however it is named or wherever it sits"
component: guardrail-engine
components:
  - commit_guardian
  - doc_compliance
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the directory the agent-card generator writes into is a declared
    set-aside location and no other location under docs/ is,
  And a hand-authored document outside that directory standing at 340 lines
    against the 300-line limit, whose filename carries the same suffix the
    generated documents carry,
  When the author performs an ordinary commit,
  Then the commit does not complete and the document it names is that
    hand-authored one — a resemblance in the name is not membership of the
    declared class.

  And given a hand-authored document outside every declared location standing at
    340 lines whose filename is one the declaration lists as set aside at another
    location,
  When the author performs an ordinary commit,
  Then the commit does not complete and the document it names is that one — a
    declared entry takes effect at the location it declares and not at every
    location sharing a filename with it.

  And given a commit staging one hand-authored document inside every other
    directory under docs/ that holds hand-authored documents, each standing at
    340 lines,
  When the author performs an ordinary commit,
  Then the commit does not complete and the documents it names are all of them —
    the declared set did not widen past the locations it names.

  And given the set of documents reported as set aside for any commit,
  Then every member of that set lies inside a declared location, and the number
    of documents the standard judges across the whole of docs/ falls by exactly
    the number of documents inside the declared locations and by no more.
depends_on:
  - GE-127g
