title: "Re-running the migration changes nothing"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given a store that has already been migrated (every requirement has a UID and
    populated hierarchy metadata),
  When the migration is run a second time,
  Then no requirement is assigned a new or different UID,
  And no requirement's parent-pointer, level, or order metadata is changed,
  And the second run reports that there was nothing to migrate.
