notes: |
  FRAMEWORK NEUTRALITY (L0/L1 constraint 4) is the second scenario: a harness that is not the E2
  engine calls the step and gets the same answer. A LangGraph node or a Claude Agent SDK tool that
  can run a command can call it unchanged. Nothing in the contract names the engine, an agent or a
  workflow.

  "reason" is added to the spec's five keys so a refusal is explainable; BO-4500a-1-iii adds one
  list for files a check changed outside the named set. Both are flagged as extensions of the C6
  spec for the user's confirmation.
