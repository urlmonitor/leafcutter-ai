it_requirements:
  - "The lifecycle remove operation MUST delete the drive's entire working-copy directory (including its own .git) and delete the drive's local feature branch (ADR-018 Migration §3)."
  - "remove MUST NOT rely on git worktree remove / git worktree prune bookkeeping against a shared repository."
  - "The create/remove interface MUST stay stable so finalize and /build-feature call sites are unchanged; branch deletion targets the drive's LOCAL feature branch only (the hub branch lifecycle is governed by the merge-queue/PR flow in BO-1800b/e)."
  - "Directory/branch removal errors MUST be handled per the project error handling policy."
