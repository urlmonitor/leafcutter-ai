notes: |
  This L1 is the reason the other three stay true over time: five corrections landed
  on the machine-readable copy alone and the prose silently contradicted it on four
  rows. Without a parity check, every future correction re-opens the same drift.

  INHERITED STANDING CONSTRAINT (ACS-1100, and stated in KM-ADM-006's own criteria):
  the parity check must assert a MINIMUM NUMBER OF ROWS MATCHED. A check that skips
  what it cannot match degrades to vacuously green the moment the table is
  reformatted — a zero-denominator pass, exactly the defect ACS-1100 exists to end.
  Any future child of this L1 inherits that requirement; do not let it be dropped as
  an implementation detail.
