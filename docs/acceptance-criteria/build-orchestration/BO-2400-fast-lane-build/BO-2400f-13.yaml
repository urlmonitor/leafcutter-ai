notes: |
  This is an instance of BO-2400f's 2026-08-24 promise — "there are exactly two honest
  endings: a pull request, or a reason" — applied to the lane's FIRST phase. BO-2400f-12
  gives that ending for a set the lane cannot build; this gives it for a workspace the
  lane cannot open. Neither is a new promise, so no new L1 was authored.

  Placed as a new child of BO-2400f, deliberately NOT as a child of BO-2400f-3.
  BO-2400f-3 is work_status: done / readiness: approved; hanging children off it would
  create a done parent with todo children — the drift pattern CLAUDE.md documents across
  twenty records — and would repeat the BO-2400f-9 / BO-2400f-12 mistake of narrowing an
  already-finished criterion. BO-2400f-3 stays untouched; this criterion sits beside it.

  Override note, flagged by the Product Owner: bumping BO-2400f's child_limit_override
  from 12 to 13 should be the LAST bump. A fourteenth child must force a Pattern C
  intermediate split of BO-2400f rather than child_limit_override: 14.

  Why refusal and not reuse. The lane has no resume semantics — BO-2400f-10 releases the
  claim on abort — so a leftover workspace is either the residue of a finished run or the
  debris of a dead one, and neither is a foundation to build on. Reusing it would build
  against a mainline that no longer exists while BO-2400f-3 promises the latest
  origin/main, and would carry uncommitted debris into the pull request diff.
  Deliberately OUT OF SCOPE and deferred by the Product Owner as a possible future
  criterion: automatically throwing away a leftover workspace when it is provably clean
  and its work already landed. Do not implement that shortcut under this criterion.

  Why the location keeps carrying only the acceptance criterion id. This DIVERGES from
  the sibling authoring lane: BO-1500f-2 requires every authoring run to get a workspace
  no other run can resolve to, minted per run. The divergence is deliberate, and it is
  recorded here because someone will later read the two as inconsistent. Concurrency on
  one acceptance criterion is a claim problem, already owned by BO-2400f-8, not a
  directory-naming problem — and a per-run directory would not solve it anyway.

  That last point was verified rather than assumed, on 2026-08-25, in a throwaway
  repository: with a branch checked out in one worktree, adding a second worktree on the
  same branch exits 128 with "fatal: '<branch>' is already used by worktree at '<path>'".
  So while the branch stays derived from the acceptance criterion id, a second run could
  not proceed even if it were handed a distinct directory. That is why the second
  scenario refuses on the branch as well as on the location.

  Source/deploy split, for whoever implements this: the change lands in
  templates/scripts/setup_ticket_worktree.py and is mirrored. scripts/setup_ticket_worktree.py
  is a build output overwritten by build.py — editing only that copy is silently reverted
  on the next build.

  IT enrichment note, 2026-08-25 (it-po). Three technical facts were established by live
  probe rather than assumed, and each pins down a criterion an implementer would otherwise
  guess at.

  First, an EXISTING EMPTY DIRECTORY is not an occupant: `git worktree add` into one
  succeeds. Defining occupancy as "the path exists" would false-refuse on stale empty
  residue and break BO-2400f-13-iv, so occupancy is "exists AND (not a directory, or
  contains at least one entry)". Second, the branch-collision probe reproduced the
  BA's finding exactly — exit 128, `fatal: 'fast-lane/probe' is already used by worktree
  at '<path>'` — confirming that the two occupancy conditions are genuinely distinct and
  must both be covered. Third, the two copies of the workspace command are NOT
  byte-identical today: the deployed copy carries a `BootstrapError.probe_failure`
  classmethod the template deliberately lacks, and there is a parity test asserting that
  difference. So "mirror it" means "run build.py and prove the fix is present in the
  deployed copy" — the deployed-angle test in test_spec — and never "make the files
  identical".

  Language split, stated so the lane's single-coder phase is not under-scoped: the Python
  half (occupancy determination, own-vs-foreign classification, refusal payload) lives in
  templates/scripts/setup_ticket_worktree.py; the JS half (WORKTREE_SCHEMA at :58, the
  Phase 1 guard at :277, and the terminal refusal outcome) lives in
  templates/workflows-js/fast-lane-ship.js. Both are assigned to python-coder, which
  config/agent_registry.json explicitly gives ownership of '.js' for this orchestration
  layer — so this is not a BP-1100f-3 intent-vs-surface contradiction, but it IS a
  two-file budget.
