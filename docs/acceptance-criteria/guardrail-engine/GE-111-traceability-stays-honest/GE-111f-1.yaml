assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Net skip/xfail weakenings per file and per kind: count added and removed matches of each skip/xfail pattern within one file's diff, and report a violation only for the excess of added over removed. Do not change how test deletions (GE-111f) are detected."
  - "Ignore files whose diff status is A (newly added) for the skip/xfail weakening patterns. A new file cannot weaken an existing test."
  - "Keep blocking a skip added to an existing test file where no skip of that kind was removed in the same file."
  - "Edit templates/scripts/commit_guardian/check_contract_shrinking.py and keep scripts/commit_guardian/check_contract_shrinking.py (build output) byte-identical in the same change."
test_spec:
  - name: test_ge111f1_replaced_skip_in_modified_file_is_not_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A staged diff that removes pytest.skip(f\"live Neo4j not reachable: {exc}\") and adds pytest.skip(unreachable_reason(exc)) in the same existing test file, alongside a production-code change, yields no 'pytest.skip added' violation from check_contract_shrinking run against a real git repository."
  - name: test_ge111f1_skip_in_new_test_file_is_not_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A newly added test file (status A) containing pytest.skip and an xfail mark, staged with a production-code change, yields no skip/xfail violation."
  - name: test_ge111f1_net_new_skip_in_existing_file_still_blocks
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "A skip added to an existing test file with no skip removed (or two added for one removed) is still reported and the hook exits non-zero — catches a wrong version that ignores all skips in modified files."
test_rationale: "The defect is in how the guard nets diff lines per file, so only a test that stages a real diff in a git repository and runs the check can see it; a direct regex test proves the pattern matches, not that matches are netted or that status-A files are skipped. The discrimination case is load-bearing: an implementation that simply stops looking at skips would pass the first two tests, so the third must prove a genuine net-new skip still blocks."
