criteria: |
  Given the hub `main` branch protection is configured,
  When a client with elevated privileges (an admin, an owner, or a privileged token)
    attempts to land on `main` outside the gate,
  Then the change is still rejected -- branch protection allows no bypass, so even an
    admin merge or a privileged token cannot land on `main` outside required
    checks + the merge queue,
  And the machine identity that autonomous agents authenticate as is least-privilege:
    it holds no bypass permission and no direct-push right to `main`, so the
    capability to mutate `main` directly does not exist for agents.
depends_on: [BO-1800b, BO-1800b-1]
