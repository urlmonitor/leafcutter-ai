notes: |
  The three-way verdict is the whole point, and it is the part most likely to be
  dropped as an implementation detail. Collapsing "unable to run" into "failed"
  reproduces exactly the defect this AC exists to catch: on 2026-08-18 a guardrail
  that could not find its vocabulary reported a blocking failure on every commit,
  and the reported failure pointed at the commits rather than at the missing file.
  A harness that records that outcome as "the guardrail failed" is a faithful copy
  of the misdiagnosis.

  Distinct from BP-900e (a registered guardrail has a deploy-source copy at all) and
  from BP-900h-1 (script references in the deployed tree resolve). Both of those are
  satisfied by a guardrail that is present and reachable and still cannot run,
  because presence is not the same as being able to start. This AC is the only one
  in the family that invokes a guardrail.
