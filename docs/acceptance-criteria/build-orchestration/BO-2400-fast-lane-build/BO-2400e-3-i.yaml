notes: |
  THE FAILURE-TO-WRITE EDGE. BO-2400e-3 covers an update that starts and is
  interrupted. This L3 covers one that can never start: the destination is read-only or
  full. Both are write failures, but they have different observable requirements —
  survival of the old content in the first case, and in this one an announcement plus a
  refusal to proceed.

  THE THIRD CLAUSE IS A CONSEQUENCE OF FIXING THE PARENT, NOT OF THE CURRENT DEFECT.
  Today there is no staging of any kind, so there is no debris to leave — the file is
  simply truncated. The moment a durable-write design is introduced, a failed attempt
  can leave a partial companion behind in a directory the build system scans. Writing
  this clause now means the requirement lands with the change that creates the risk,
  rather than being discovered as a new bug afterwards.

  WHY 'DOES NOT CARRY ON' IS THE LOAD-BEARING CLAUSE. The project error-handling policy
  requires every failure to be logged at warning or higher or re-raised. An
  implementation can satisfy the letter of that by logging and returning normally,
  after which the run claims work it never claimed, builds it, and marks it done
  against records that were never touched. The announcement matters; the refusal to
  proceed matters more.

  BOUNDARY. This is not BO-2400f-7-i. That AC covers a claim that was written locally
  and then failed to reach the mainline — a merge/publication failure. This one covers
  a write that never happened. Neither implies the other, and an implementer who reads
  one as covering the other will leave the store-side hole open.

  IT-PO ENRICHMENT NOTE (2026-08-17). Same single surface as its parent
  (scripts/build_orchestration/fast_lane.py), so python-coder with no mixed-surface
  caveat. The object form of it_requirements is mandatory here for the same schema
  reason as the parent. The constraints deliberately spell out the CLAUDE.md Rule 3
  reading, because "log at WARNING and return" is a policy-compliant implementation that
  fails the fourth Then clause, and that is the single most likely way this AC ships
  broken. declares_side_effect is true (the observable is the on-disk store), with the
  same caveat recorded on BO-2400e-3: the fast lane does not dispatch user-surface-smoker
  today, so the flag records the claim without producing routing on this lane.
