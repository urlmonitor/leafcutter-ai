assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    The target block {workspace, branch, ac_id} is built once, from the worktree step's
    confirmed output (BO-2400f-3-i), and every later dispatch uses that single value. No
    request takes a location from the launch directory, the process working directory
    or a caller-supplied cwd.
  - >-
    The block is rendered identically in every request, with the same labels, order and
    sentence stating that this run opened <workspace> on <branch> for <ac_id>. Two runs
    can then be compared by substituting the workspace value alone.
  - >-
    The workspace is given as the absolute path in the form the worktree step confirmed
    it, with no re-normalisation per step. Paths in different forms (separators, drive
    letter case) across requests of one run count as a defect, because they make a
    legitimate target look foreign.
  - >-
    Specialist dispatches (test-writer, coder, pr-reviewer) get the same block. The
    existing mechanism that makes them work in the workspace is kept.
  - >-
    The declined-step halt's target field (BO-2400f-5-iii) is filled with the same
    block.
  - >-
    Edit the template lane and regenerate the deployed copy through build.py. Template
    and deployed copies stay in parity.
test_required: true
test_spec:
  - name: test_every_post_worktree_request_carries_workspace_branch_and_ac_id
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: criterion
    description: "In a stubbed run, every dispatch recorded after the worktree step (command steps and specialist phases) carries the confirmed absolute workspace, the created branch and the run's AC id together."
    must_catch:
      - "context-bundle request names the workspace but not the branch or AC id (today's state)"
      - "specialist requests omitted from the target block"
  - name: test_every_request_states_the_run_opened_the_workspace_for_the_ac
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: criterion
    description: "Every such request contains the ownership statement naming the same workspace, branch and AC id."
  - name: test_launch_location_never_appears_in_any_step_request
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: failure
    description: "Launched with a distinctive sentinel sibling-worktree path as the launch location, no recorded request contains that path."
  - name: test_runs_from_main_and_sibling_worktree_differ_only_in_workspace
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: discrimination
    description: "Two stubbed runs for the same AC and fixture store, launched from the main checkout and from a sibling worktree, produce request sequences that are identical once each run's workspace path is replaced by a placeholder."
  - name: test_declined_step_halt_names_the_target_it_was_given
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: seam
    covers: [BO-2400f-3-ii, BO-2400f-5-iii]
    description: "A step whose stubbed agent declines the target as foreign halts as declined_step with target equal to the block the request carried, plus the step, agent and reason."
test_rationale: |
  "No step is declined as misrouted" is a claim about model judgement and cannot be tested
  deterministically. What the lane controls is what each agent is told. The tests assert
  that every request carries the complete target and the ownership statement, that the
  launch location never leaks, and that the request stream does not depend on where the
  run was launched. The sentinel path makes the leak test exact. A plain "cwd not in
  prompt" check would pass whenever the two paths happened to share a prefix.

  The differ-only-in-workspace test is the one that shows the fix is structural and not
  per step. All tests run through the workflow engine harness with stubbed replies, so no
  model is called.
delivers_to:
  agent: python-coder
  contract: "Every dispatch after the worktree step in templates/workflows-js/fast-lane-ship.js carries target {workspace: absolute path string exactly as BO-2400f-3-i confirmed it, branch: string, ac_id: string} and the sentence 'This run opened <workspace> on branch <branch> for <ac_id>.'; the declined-step halt's target field (BO-2400f-5-iii) is the same object. Consumed by the command-step-runner request shape (BO-2400a-1-i) and BO-2400f-5-i."
expects_from:
  ac_id: BO-2400f-3-i
  contract: "The workspace location the run confirmed against the repository it operates in (absolute path string) and the branch it created (string), available to the lane after the worktree step."
