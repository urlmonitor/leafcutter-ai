it_requirements:
- A bare ready reply, blank or non-string discovery assessment, or discovery assessment in an implementation
  reply is a communication-contract failure. A successful shell command cannot rescue invalid readiness; valid
  supplied-context discovery is not rejected solely for zero tools. Preserve immediate durable blocking without
  repair, provider fallback or budget reset.
- Adapter failures and graph-level invalid results, including a None result from an alternate adapter, block immediately
  with diagnostic context. They cannot enter the ordinary bounded check-repair loop, substitute another provider,
  execute the refused operation in the coordinator, or produce passing evidence.
- Communication regression tests must pair valid replies with plausible wrong outcomes and assert exact dispatch,
  downstream-check, review and publication counts. Tests must detect unconditional success, reintroduced generation-time
  output-schema constraints, a missing phase-specific prompt contract or bypassed strict post-turn parser in either
  phase, ignored refusal routing and forged-answer precedence; an import failure or source-string assertion alone
  is not discrimination evidence.
- Treat explicit refusal and error replies as durable blocked outcomes with bounded diagnostics, never success, implicit permission, a substitute provider call or coordinator execution of the refused action. Malformed and contradictory replies remain non-success.
- Test the real reply adapter and graph routing with refusal, error, malformed output and forged human-answer fields; success-only executor stubs cannot establish these failure paths.
- Separate endpoint availability from full harness/tool capability; an empty tool result or claimed check
  without execution evidence cannot satisfy the contract.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300g-1 (data handoff, not an additional build-order prerequisite): ACEvidence
  {run_id:string, feature_id:string, ac_id:string, obligation_ids:string[], source_revisions:object, workspace_id:string,
  head_sha:string, changed_files:string[], checks:[{command:string, exit_code:integer, evidence_ref:string}],
  outcome:passed|blocked|failed}.'
test_spec:
- name: test_unconstrained_generation_still_rejects_invalid_final_report
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: seam
  description: For both actual phase executors without constrained generation, return prose-wrapped JSON, missing
    questions or forged approval fields; require strict parser rejection and no success transition. Pair with valid
    reports under the same invocation.
  covers:
  - ACD-1300g-1-i
- name: test_implementation_completion_without_tool_event_still_blocks
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: boundary
  description: Return valid completed JSON without any successful tool event from unconstrained implementation;
    reject the completion claim while the actual tool-effect positive control remains accepted.
  covers:
  - ACD-1300g-1-i
- name: test_discovery_ready_rejects_non_string_assessment
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: boundary
  description: Return discovery ready with a non-string assessment; reject at the contract boundary rather
    than coercing a value to text.
  covers:
  - ACD-1300g-1-i
- name: test_discovery_ready_requires_assessment_even_with_tool_event
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: boundary
  description: Pair valid zero-tool assessment with missing, blank, whitespace and wrong-type assessments,
    including a successful ls event; invalid reports block before coding and cannot be rescued by tool activity.
  covers:
  - ACD-1300g-1-i
- name: test_implementation_reply_rejects_discovery_assessment
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: boundary
  description: Return completed with real tool evidence plus discovery-only assessment; assert phase-contract
    rejection. Valid completed without assessment remains accepted and actual checks retain authority.
  covers:
  - ACD-1300g-1-i
- name: test_unusable_serialized_reply_blocks_without_retry
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: seam
  description: Feed serialized null, an empty object and contradictory status/questions through the real parser
    into the real graph; assert immediate durable blocking, one invocation, no retry and zero downstream success
    effects.
  covers:
  - ACD-1300g-1-i
- name: test_adapter_failure_blocks_graph_once_and_persists_diagnostics
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: seam
  description: Pair each refusal/error/unsupported-handoff result in both phases with a valid execution control;
    assert one call, durable blocker and exact zero downstream checks/reviews/publications, including a second graph
    invocation.
  covers:
  - ACD-1300g-1-i
- name: test_empty_adapter_result_never_runs_checks_or_retries
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: boundary
  description: Return None directly from each phase adapter to bypass parser protection; assert graph-level rejection,
    no evidence, zero downstream checks/reviews/publications and no automatic retry. The plausible-wrong implementation
    treats an empty reply as success.
  covers:
  - ACD-1300g-1-i
- name: test_background_worker_lost_local_backend_blocks_without_cloud_call
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: reachability
  description: Remove Ollama or tool harness after admission; assert preserved same-run checkpoint and
    zero cloud implementation calls.
  covers:
  - ACD-1300g-1-i
  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_self_report_without_tool_effects_is_not_passing_evidence
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Return success prose with no edits/check execution; assert no passing evidence or dependent
    release.
  covers:
  - ACD-1300g-1-i
