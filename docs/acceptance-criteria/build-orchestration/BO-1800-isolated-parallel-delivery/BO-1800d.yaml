id: BO-1800d
title: "Automatic cleanup never disturbs work in progress"
component: build-orchestration
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Routine background housekeeping can never damage a delivery that is still running.

  The automatic tidying that keeps the repository healthy is prevented from ever
  running against work that is still in flight, so it can no longer corrupt an
  active build. Cleanup happens safely, on its own, when nothing is being built.
