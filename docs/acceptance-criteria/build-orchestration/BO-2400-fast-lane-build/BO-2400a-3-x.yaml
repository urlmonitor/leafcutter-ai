notes: |
  The user's constraint is "still never accepting tests that pass against a broken
  implementation", so the bar is set per test, not per criterion. If one red test per
  criterion were enough, the other tests could still pass against broken code without
  anyone noticing, which is the property the user ruled out. Errored outcomes do not count
  as kills: otherwise a syntax-error mutation would prove every test.
