id: BP-900e-5
readiness: approved
priority: high
title: "The registry-completeness check fires at the finalize merge gate, not the build preflight"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: not_started
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900e.yaml"
criteria: |
  Given an epic branch is being finalized for merge
  And the branch contains a hook registered in commit_guardian.json with no
    deploy-source copy under templates/scripts/
  When the finalize-feature merge flow runs its gates
  Then the registry-completeness check runs in the same enforcement position as
    the existing source-to-template parity gate (after merge-origin/main, before
    the pull-request merge step)
  And on a registry-completeness violation the finalize flow HALTs and surfaces
    the violation to the user, never reaching the pull-request merge step
  And the registry-completeness check is NOT run as part of the build.py
    preflight (the build.py preflight script-reference guard, which scans
    template references against the deployable manifest, remains a separate
    PREFLIGHT check that does not read commit_guardian.json)
  And when the branch has no registry-completeness violation the finalize flow
    proceeds past this gate to the pull-request merge step
