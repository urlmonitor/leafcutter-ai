id: BP-600e-3-i
title: "Quick-fix workflow does not leave partial commits when escalating"
component: build-pipeline
level: L3
status: active
readiness: reviewed
priority: medium
work_status: todo
criteria: |
  Given the workflow has paused with a scope warning after the fix was
    applied but before the commit phase,
  When the user chooses to escalate rather than continue,
  Then the workflow does not commit any code changes,
  And the AC YAML and test file remain on disk as unstaged changes,
  And the fix applied by python-coder remains as an unstaged modification,
  And the user is informed which files are preserved and that none
    were committed.
