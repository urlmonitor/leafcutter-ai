id: INF-1100c-1
title: "Compiled agent instructions contain the resolved work-location path"
component: infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given an agent instruction template that references the work-location
    placeholder for the configured test root,
  And the project configuration sets that test root to "tests/",
  When the agent's instructions are compiled from the template,
  Then the compiled instructions contain the literal resolved path "tests/",
  And the compiled instructions contain no remaining work-location placeholder token.
