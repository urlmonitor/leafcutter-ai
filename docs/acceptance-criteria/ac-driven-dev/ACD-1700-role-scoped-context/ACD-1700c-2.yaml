criteria: |
  Given the target AC depends on other ACs,
  When the tool renders the dependencies section of the brief,
  Then each dependency is shown together with what it already shipped
    (its implemented_by source and its covered_by tests),
  And a reader can distinguish a dependency that is already delivered from one that is not yet built.
