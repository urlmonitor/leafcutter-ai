it_requirements:
- Edit templates/agents/sql-test-writer.md only, after TQ-500f-4-i has landed on the same template (depends_on).
  Replace 'do not run the test suite' with running the writer's own tests. Keep the ban on deploying SQL
  anywhere except the configured test database.
- Runs use only the address from testing_context.db_connection_test, through scripts/db_check/checker.py
  (the one reader). Before running, use the check_test_db outcome. Never use an address the agent chose.
- '''Before the fix'' is the object''s definition at the base ref, installed into the test database for
  that run and then replaced by the fixed one. The prompt warns about the setUpClass re-deploy trap: alter
  the file the suite installs from, never only the database.'
- 'An answer is labelled ''observed'' only when a quoted run''s output backs it, and ''reasoned'' otherwise.
  With no test database configured: name testing_context.db_connection_test, report both runs as not run,
  label every answer reasoned, and claim no catch.'
- The to-run-later wrong versions are written in machine form (the delivers_to shape), and also rendered
  in the hand-off prose.
- Any database address in a template, fixture or doc is the placeholder postgresql://<user>:<password>@<host>:<port>/<database>.
  INF-1100d-4 scans shipped files.
- 'Composite done-proof: this L2 is test_required: false and has children. Until KI-CG-20260914-done-proof-precommit-ignores-test-required
  is fixed, the pre-commit done-proof path refuses to mark it done.'
test_required: false
