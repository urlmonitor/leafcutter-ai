criteria: |
  Red means you did something wrong — never someone else's work.

  When a check stops you, what it objects to is part of the change you are
  actually making. It never holds you responsible for work other people already
  did and you are merely bringing across, so you are never pushed into
  overriding a check on a commit that did nothing wrong.
