notes: |
  WHY THIS IS NOT OBVIOUS. A commit taken from a message file is, by default, cleaned as if it had
  been typed in an editor: lines beginning with "#" are treated as comments and deleted. "# covers:"
  lines are this repo's own test-tag convention and issue numbers are routinely written "#1043", so
  the default silently edits caller messages -- the same failure as KI-BO-20260914 by a different
  hand. The second scenario's carve-out names the whitespace the step may not be able to preserve
  under any cleanup setting; the IT PO should confirm the exact set against the version-control
  system's "verbatim"/"whitespace" cleanup modes and narrow the carve-out if more can be kept.
