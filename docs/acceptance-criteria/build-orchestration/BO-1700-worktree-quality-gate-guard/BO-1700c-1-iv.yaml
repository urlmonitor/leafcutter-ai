it_requirements: |
  Write-temp-then-atomic-rename for the copy fallback; the symlink path is
  create-or-noop. No observer ever sees a truncated config. Re-running yields
  byte-identical state (idempotent). Implemented in the self-healing hook
  (BO-1700c-1); ADR-001 deployed/template parity applies.
