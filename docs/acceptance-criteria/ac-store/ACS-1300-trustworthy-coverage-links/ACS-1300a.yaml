title: "Requirements get credit for the tests that already prove them"
component: ac-store
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  Clear the backlog of proof the record forgot, in one deliberate pass.

  Where a test that names a requirement is present and passing, the requirement's
  record says so. Where the record names a test that is no longer there, the claim
  goes away — so what remains on the record is exactly what the test tree can back
  up, and every check reading it inherits a true premise instead of a stale one.
