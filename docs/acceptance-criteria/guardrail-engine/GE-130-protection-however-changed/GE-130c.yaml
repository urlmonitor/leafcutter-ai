notes: |
  USER DECISION Q1 (2026-09-17): both. Commands the before-check is not certain
  about go to an after-the-fact check of what changed on disk, which reports the
  changed protected files by name and stops the run. It cannot undo a change;
  stopping the run is the enforcement. Attribution to the calling agent is the
  open design risk (GE-120e).
  [SUPERSEDED 2026-09-17 in part: "and stops the run" no longer holds
  unconditionally -- see the attribution policy decision below.]

  USER DECISION ATTRIBUTION POLICY (2026-09-17): the after-the-fact check stops
  the run only for a change positively attributed to this caller. A changed
  protected file it examined but cannot attribute is named, with the reason it
  could not tell, recorded, and the run continues. If the check could not examine
  the files at all, it stops the run. inline_work_guard is unaffected.
