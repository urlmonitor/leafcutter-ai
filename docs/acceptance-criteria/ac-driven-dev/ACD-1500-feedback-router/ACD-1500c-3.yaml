criteria: |
  Given entries F1 and F2 were each resolved with back-references to ACD-1600a
    and ACD-1601a respectively,
  When a person inspects the resolved feedback corpus,
  Then for F1 the resolution record yields ACD-1600a and for F2 it yields ACD-1601a,
  And the mapping is one feedback entry to the specific artifact that addressed it
    (no ambiguity about which artifact resolved which entry),
  And the reverse lookup is possible: given the artifact id ACD-1600a, the
    originating feedback entry F1 is identifiable from the recorded link.
