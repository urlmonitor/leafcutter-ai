id: BO-3200b-3
title: "Best-effort is a recorded choice with a stated reason, and an action without one cannot be dropped"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an action recorded as best-effort, carrying a stated reason why failing to perform it
    is harmless,
    And the action does not succeed,
  When the run ends,
  Then the run is not halted by that failure, and the halt report states that the action did
    not succeed and that it is recorded as best-effort with its stated reason.

  Given an action with no such record,
    And the action does not succeed,
  When the run ends,
  Then the run does not treat the failure as tolerable, and the failure is surfaced.

  Given an action with no such record whose name, kind and position in the run all match those
    of an action that is recorded as best-effort,
    And the action does not succeed,
  When the run ends,
  Then the failure is surfaced, because nothing other than the action's own record makes it
    best-effort.
depends_on:
