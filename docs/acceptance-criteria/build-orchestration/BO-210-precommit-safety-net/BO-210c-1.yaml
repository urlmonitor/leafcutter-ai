  - "The originating agent id must be parsed from the AUTOFIX_AGENT line in the hook output (delivered by GE-102d), not a static literal, for portability"
  - "The ticket path is threaded from the commit phase into the re-dispatch logic"
  - "Re-dispatch only fires for hooks present in blocking_hook_ids (BO-210a-2) whose manifest tier (GE-102c) is judgment"
  - "Every documented shell command in the edited skill and agent templates must be a single simple command per the project shell convention"
