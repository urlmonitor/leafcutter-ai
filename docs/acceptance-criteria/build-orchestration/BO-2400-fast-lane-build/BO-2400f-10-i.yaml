notes: |
  Written because BO-2400f-10 is a correct promise with no working invocation. The parent
  says the claim is released on failure and it is marked done; verified 2026-08-25 that
  no fast-lane run has ever released anything. All nine release dispatches in the lane
  pass agentType "status-checker" and open their prompt "You are the release-phase agent."
  status-checker refuses role reassignment by design, and the lane discards the reply, so
  the refusal is silent. Lines 506, 574, 596, 648, 668, 751, 773, 871 and 943 are all the
  same defect.

  WHY THIS IS A SEPARATE CRITERION RATHER THAN A REWRITE OF THE PARENT. The parent states
  the outcome and states it correctly. What was missing is any requirement that the
  outcome be reachable, and any evidence standard that could tell a release from a request
  for one. Those are additions, not corrections — the parent's text needs no change, only
  its status.

  THE CONTAINMENT WAS LUCK. The damage stayed harmless only because a fast-lane run claims
  in its own workspace's copy of the store, which is discarded with the workspace, so
  origin/main's copy still read todo. Any path on which a claim reaches a shared store
  leaves those criteria stranded in_progress, where BO-2400f-8 will then correctly refuse
  to rebuild them: a failed run silently makes its own target unbuildable. That is why the
  priority here is critical while the observed blast radius was nil.

  IT INVALIDATES A PREMISE OTHER WORK RESTS ON. BO-2400f-13's reasoning, and the Product
  Owner's decision to refuse rather than reuse an occupied workspace, are written on "the
  lane has no resume semantics — BO-2400f-10 releases the claim on abort". The decision
  still holds, and holds more strongly now, since a leftover workspace may also carry
  stranded claims. But the stated reason is currently false and should not be quoted as
  established behaviour until this lands.

  ADJACENT AND DELIBERATELY NOT AUTHORED HERE: the CLAIM dispatch at fast-lane-ship.js:393
  has the identical shape — agentType "status-checker", prompt opening "You are the
  claim-phase agent." It happened to comply on the observed run, which is why nobody has
  noticed it. Flagged for the Product Owner as a latent sibling rather than folded into
  this criterion, since the claim's failure mode is the opposite one and belongs with
  BO-2400f-7.

  CAP CHECK: BO-2400f-10 is an L2, and check_ac_limits._MAX_CHILDREN carries keys for L0
  and L1 only, continuing past every other level. Adding children here trips nothing and
  needs no override.

  ENRICHMENT NOTE, it-po, 2026-08-25 — HOW THE CLAIM DISPATCH IS KEPT OUT OF SCOPE WITHOUT
  BEING FORGOTTEN. The BA's decision not to fold it in is respected, but "do not fix it"
  and "do not accidentally half-fix it" are different obligations and only the first was
  written down. The risk is concrete: the natural implementation of this record introduces
  one release executor and applies it at nine sites, and the tenth site with the same shape
  sits forty lines above the first. Either it is left with zero changed lines — which
  test_the_claim_dispatch_is_not_altered_by_this_change pins behaviourally — or the
  implementer says at sign-off that it was touched and why. What must not happen is a
  shared refactor that leaves the claim on status-checker with nobody noticing the
  inconsistency, because the next reader will take the inconsistency for a considered
  decision.
