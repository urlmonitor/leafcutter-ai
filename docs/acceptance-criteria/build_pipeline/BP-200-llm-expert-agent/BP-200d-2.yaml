criteria: |
  Given the file templates/skills/prompt-audit/SKILL.md exists,
  When the audit checks section is read,
  Then it defines exactly 6 checks:
    Check 1: Frontmatter Schema Validation (required fields present and valid)
    Check 2: Tool Allowlist vs Body Usage (cross-reference declared vs used tools)
    Check 3: Compound Bash Detection (&&, ;, ||, cd-chain, side-effect pipes)
    Check 4: Signoff Protocol Validation (## Sign-off section exists when signoff: true)
    Check 5: spawn_allowlist Validation (declared when Agent tool is used)
    Check 6: Stop-and-Ask Rules (scope boundary documentation exists)
  And each check documents its detection steps as a numbered list
  And each check assigns a severity level ("error" or "warning") to each finding type
