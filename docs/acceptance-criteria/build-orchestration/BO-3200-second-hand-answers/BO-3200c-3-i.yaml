id: BO-3200c-3-i
title: "A decision point added later without the distinction is reported, not silently exempt"
component: build-orchestration
components:
  - ac_driven_dev
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a run in which every decision point distinguishes no-answer from the person declining,
  When a new decision point is added that produces the same outcome for both states,
  Then it is reported and named, with nothing changed in the check that reports it.

  Given a new decision point that does distinguish the two,
  When the check runs,
  Then it is not reported.

  Given a run in which a decision point exists but could not be driven into either state during
    the check,
  When the check runs,
  Then that point is reported as not having been exercised, distinguishable from one that was
    exercised and found correct.
