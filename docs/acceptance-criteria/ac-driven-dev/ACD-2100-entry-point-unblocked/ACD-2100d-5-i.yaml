id: ACD-2100d-5-i
components:
  - ac_driven_dev
readiness: approved
priority: high
title: "A change to the start arguments on only one side is caught before it ships"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given the project's own checks start the installed workflow with the arguments read, at the
    moment the checks run, from the installed /plan-feature command text and, separately, from
    the installed plan-feature skill's workspace section,
  When the command text is changed to stop passing the maker's answer and nothing else changes,
  Then the checks fail, naming the argument the workflow needs that the command no longer
    supplies and naming the command as the side that lacks it,
  And when instead the workflow is changed to require one more argument that neither the
    command nor the skill supplies, the checks fail naming that argument and naming both the
    command and the skill,
  And when instead only the skill's workspace section is changed to pass the maker's answer
    under a different argument name, the checks fail naming the skill,
  And when the command, the skill and the workflow are all changed together so that they still
    agree (the same argument renamed in all three), the checks pass,
  And when the command text is replaced by one that shows no workflow start at all, the checks
    fail saying no start could be read from it, rather than falling back to a list of arguments
    kept anywhere else.
