  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_epic_ticket_set_recheck.py"
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_epic_recheck_readable_flag_polarity.py"
  constraints:
    - "FAIL CLOSED. A re-read that fails must not be treated as a re-read that found nothing new. Those two states produce opposite outputs and are trivially confused by a single empty-result path; an implementation that returns an empty set on error re-creates the original defect exactly, while appearing to have fixed it."
    - "ABSENCE OF A CLAIM IS NOT A CLAIM. Test for the affirmative confirmation and treat everything else as unverified -- not for an explicit denial with everything else treated as verified. A reply that simply omits its readability claim is a legal reply, it is the shape a partial or truncated enumeration produces, and a check written against the denial takes the verified branch on it. The reply schema must require the confirmation, and the guard must require it to be true, mirroring the sibling record read-back rather than the looser form."
    - "NO FALSE ALARM, OR THE SECTION GETS IGNORED. If work that was already complete before the drive, or work removed during it, shows up as discovered after planning, every drive emits the section and operators learn to skip it. That failure is slower and harder to detect than the original, so the negative cases are as load-bearing as the positive one."
    - "A REMOVAL IS NOT AN ADDITION. Work that was planned and is now gone is a different event with a different action, and must be reported as such rather than left silently absent from both lists -- which is the same class of omission BUG-19 is."
    - "AN UNCONFIRMED LIST SUPPORTS NO REMOVAL CLAIM. When the set was not confirmed read, work missing from the reply must not be reported as removed from the epic: the reply gives no basis for a statement about the store."
    - "VERIFY BY EXECUTION. Each case must be driven through the real workflow via the harness and asserted on the emitted completion output."
delivers_to: null
expects_from:
  ac_id: BO-300a-5
  contract: "The completion-time re-read and the comparison by identity whose failure, unconfirmed and no-change paths this scenario bounds"
test_spec:
  - name: test_unreadable_work_set_reports_the_epic_not_verified_complete
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Make the second enumeration fail and assert the emitted output reports the epic as not verified complete, names the reason, and contains no epic-complete statement."
  - name: test_an_omitted_readable_flag_with_a_full_list_withholds_the_complete_claim
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: "The re-check returns the full list of work but makes no readability claim at all; assert the epic is reported not verified complete and no epic-complete statement is emitted. Distinct from the declared-failure case above: this reply never says it failed."
  - name: test_an_omitted_readable_flag_with_a_partial_list_is_not_a_verified_read
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: "The re-check enumerates some of the known work and makes no readability claim; assert no epic-complete statement, the set is not recorded as verified, and the unenumerated work is not named as removed."
  - name: test_a_recheck_that_does_claim_readable_still_verifies_normally
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "CONTROL. The same drive with a re-check that does confirm it read the set, and an unchanged work set, must still report the epic complete -- otherwise the cheapest way to pass the negatives is to stop verifying anything."
  - name: test_unchanged_work_set_names_nothing_as_discovered_after_planning
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Both reads return the same set, including one piece of work already complete before the drive; assert no discovered-after-planning entries are emitted."
  - name: test_work_removed_during_the_drive_is_reported_as_no_longer_present
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A planned piece is absent from the second read; assert it is named as no longer present and not as unbuilt or as an addition."
  - name: test_an_empty_second_read_is_not_treated_as_a_failed_read_or_the_reverse
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Distinguish an epic that genuinely contains no work from a read that failed, asserting the two produce different outputs -- the error path this AC exists to keep separate."
test_rationale: |
  Both halves are absences, and both are invisible to a test that only exercises the
  happy path: an implementation that returns an empty set when the re-read fails
  passes BO-300a-5's every descriptor and silently restores the original defect. The
  descriptors here are therefore all negative or error cases, driven through the real
  workflow and asserted on the emitted text.

  Two of them exist because a declared failure and a missing confirmation are
  different replies that must produce the same outcome. A suite in which every
  successful enumeration claims it was readable and every failed one claims it was
  not can never tell a fail-open check from a fail-closed one: both pass, for two
  reasons that cannot be separated. Only a reply that says nothing either way
  distinguishes them, so each such test must first assert the reply really did omit
  the claim, and the affirmative control must stay green throughout.

  The empty-versus-failed descriptor remains because an empty set and a failed read
  are the same value in the most likely implementation, and once they are conflated
  the fail-closed guarantee is decorative.
