id: INF-1200d-3
title: "Whether a standard's check currently runs does not decide whether its audience hears about it"
component: infrastructure
components:
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given two standards declared for two kinds of file that each have an assigned
    owner, where the project currently reaches a check for the first standard and
    does not reach one for the second,
  When each owner begins work,
  Then each has the standard governing its own kind of file stated in its
    material, and the two standards are carried alike,
  And given the check for the second standard subsequently begins to be reached,
    with its declaration unchanged,
  When its owner begins work again,
  Then what is stated in its material about that standard is unchanged,
  And given the check for the first standard is subsequently no longer reached,
    with its declaration unchanged,
  When its owner begins work again,
  Then what is stated in its material about that standard is likewise unchanged,
  And at no point does the set of standards carried outward depend on which
    checks the project reaches.
