estimated_complexity: M
it_requirements:
  - "SURFACE. The suspension lives in scripts/ac_store/_done_proof_entry_point_gate.py::_apply_entry_point_reachability_gate, which is already report-only in this tree. This AC's work is (a) making the announcement countable and complete and (b) proving the pass-through executes. Do NOT relocate the rule, do NOT add a second eligibility oracle, and do NOT delete the module's DECISION HISTORY block — BO-2900a-1-iii reads its re-arm conditions."
  - "THE PASS-THROUGH MUST BE TOTAL, NOT PER-BRANCH. On every path — finding, no finding, no entry point resolved, internal error — the function must return the verdict mapping it received with no key added, removed or changed. 'Same eligibility' is an equality property of the whole verdict, not just of verdict['eligible']; a rule that leaves eligible alone while writing refusal_cause has still moved the verdict for BO-2900e-1's message layer."
  - "EVERY FINDING MUST CARRY FOUR NAMED FACTS: the unit, the entry point that was not entered, the proof's test nodeid, and the refusal_cause the rule would have used. A finding missing any one of the four is not countable and does not satisfy this AC. The two causes in play are the ones the module already emits — proof_not_through_entry_point and observation_unavailable — and this AC must not invent a third."
  - "THE FINDINGS MUST BE COUNTABLE WITHOUT PARSING PROSE. Emit each finding through one named function that produces BOTH the operator-facing line on stderr AND a structured finding record ({unit: str, entry_point: str, offending_test: str, refusal_cause: str}) that an in-process caller can collect. BO-2900a-1-iii's corpus exercise measures this population; a population only recoverable by regexing stderr is not a measurement, and a suspension that stops announcing removes the only evidence that can end it."
  - "NO SUPPRESSION SURFACE MAY EXIST. The announcement path must read no environment variable, accept no keyword argument, and consult no config key that changes whether it announces. This is a property of the code, not only of the emitted text: an emitted line that names no bypass while an undocumented env var silences the whole function still fails this AC."
  - "THE ANNOUNCEMENT MUST REACH THE OPERATOR IN ALL THREE check_done_proof MODES (precommit, ci, ci-changed) and from the DEPLOYED layout, not only from the source tree. Write to stderr directly; do not route through a logger whose level the calling context can lower to silence."
  - "ERROR HANDLING. Per the project error handling policy, a failure inside the rule must be logged at WARNING or higher and must not propagate into the eligibility decision — a rule that cannot decide must not be able to crash the gate that is ignoring it. It must equally not be swallowed silently: an inert rule and a suspended rule are indistinguishable without the log line."
  - "PERFORMANCE. The rule still runs only after the two incumbent conditions have already returned eligible: True, and must not add a second pytest or subprocess invocation of its own beyond the observation call that is already there. It must not increase the per-AC done-proof budget measurably."
delivers_to:
  agent: python-coder
  contract: "An eligibility evaluation in which the reachability rule contributes announcements but never an ineligibility, plus the announcement text BO-2900e-1's message layer composes. Concretely: verify_done_eligible returns a verdict mapping equal in every key to the one it would return with this rule not invoked, alongside zero or more structured findings {unit: str, entry_point: str, offending_test: str, refusal_cause: 'proof_not_through_entry_point'|'observation_unavailable'} emitted on stderr and collectable in-process. The announced findings are the population BO-2900a-1-iii's corpus is drawn from and measured against."
expects_from: null
test_spec:
  - name: test_report_only_finding_is_announced_and_eligibility_is_unchanged
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: "scripts/ac_store/done_proof.py::verify_done_eligible"
    description: "Drives the real verify_done_eligible over a fixture AC store plus a fixture unit with a genuine module-level main(), whose only covers-tagged proof direct-imports the implementing function; captures stderr and the structured findings, and asserts IN THE SAME BLOCK that (a) exactly one finding was produced, naming the unit, the entry point, the proof nodeid and refusal_cause proof_not_through_entry_point, and (b) the returned verdict mapping is equal in every key to the verdict the identical fixture yields with the rule not invoked."
    must_catch:
      - "a rule that still returns eligible: False on the direct-import fixture"
      - "a rule that passes the verdict through but announces nothing"
      - "a rule that leaves eligible alone while writing refusal_cause or reason into the verdict"
      - "a fixture on which no entry point resolves, so the report-only branch is never reached and the test passes vacuously"
  - name: test_a_proof_the_rule_finds_nothing_against_is_silent_and_also_unchanged
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Same fixture unit, with the proof rewritten to drive main([action]). First asserts the rule was actually exercised — _detect_module_entry_point resolves an entry point for this fixture, so the gate body ran — then asserts zero findings were produced and the verdict is again equal in every key to the not-invoked verdict. Correctly silent is distinguished from never ran by the entry-point assertion plus the paired positive fixture in the same module."
    must_catch:
      - "a rule that announces a finding for a proof that did enter the entry point"
      - "a rule that is never reached at all on any fixture, which would make every silence-assertion pass"
  - name: test_the_emitted_announcement_names_no_way_to_switch_the_rule_off
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Asserts against the text a REAL evaluation emitted, never against the module's source: the captured announcement is non-empty and contains no bypass token (no ALL_CAPS environment-variable-shaped name, no --flag, no SKIP=/DISABLE=/NO_ construct). Then re-runs the same evaluation with every environment variable the module reads set to a suppressing value and asserts the finding count is identical and still non-zero."
    must_catch:
      - "an announcement that helpfully names an env var to silence it"
      - "a suppression path that exists in code while the emitted text mentions nothing"
      - "an assertion that reads the source file rather than the emitted line, which passes on a rule that never emits"
test_rationale: "This AC covers code that is already in the tree with no test, so the only evidence that counts is a real evaluation. A test that reads _done_proof_entry_point_gate.py for a report-only branch passes on a rule that never reaches it — the exact defect the whole BO-2900 tree derives from, and the shape that let BO-2900a-1-i ship done with its specified test unwritten. Both halves must be asserted in one run: asserting only the announcement passes an implementation that still refuses, and asserting only the eligibility passes one that has gone silent. The second test carries the absence guarantee, and its 'correctly silent versus never ran' discriminator is explicit — it first proves an entry point resolved for that fixture (so the gate body was entered) and only then asserts zero findings, with the paired positive fixture in the same module proving the finding channel works at all. The third test asserts on the string the run actually emitted rather than on source text, because the guarantee is about emitted text and a source grep would pass on a rule that emits nothing."
