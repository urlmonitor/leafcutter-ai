notes: >-
  WHY THIS IS A NEW AC AND NOT AN AMENDMENT. Amendment was preferred and was tried
  first. BP-300e-4 and BP-300e-4-i were both amended in place on 2026-08-17 and they
  now carry the whole per-reply rule: what one reading point does with one unreadable
  reply, whether it is registered or not, and which substitutes the register may admit.
  What they cannot carry is the property this AC states, because it is not a property
  of a reply at all. It quantifies over EVERY reading point in a run and over the
  register as a whole: that the two permitted behaviours are exhaustive across the run,
  that no register entry is stale, and that the number of undeclared degradations cannot
  be increased by a change. A Given/When/Then scoped to "a workflow reads an agent's
  reply" has no place to put a claim about all the other reading points, and folding a
  whole-run sweep into BP-300e-4 would have made a single AC that no single test can
  fail cleanly. This is the inventory-and-ratchet half; BP-300e-4 is the per-reply half.


  ORIGIN. Authored as part of the 2026-08-17 adjudication between BP-300e-4 (a reply with
  no recoverable structured result must stop the run) and the deliberate degradation at
  the finalize step-0 baseline site, whose in-source comment cites "AC-4" — a
  ticket-body-local label from tickets/99_done/EPIC-FinalizeFeatureHardening-2/
  09_finalize_p2_hygiene.md, carried in the store by FIN-100a-2. The full argument, the
  two positions and the grounds for the decision are recorded in the notes of BP-300e-4,
  which is the AC that carries the exception mechanism. This AC exists because that
  decision is worthless without a way to tell a declared exception from the roughly fifty
  undeclared ones the audit found — 26 reading points in plan-feature.js and 24 in
  finalize-feature.js, each a bare catch with a safe default.


  WHY THE SWEEP IS THE PROOF, NOT AN INVENTORY OF CATCH BLOCKS. The tempting
  implementation is to parse the workflow source, count catch blocks around the reader,
  and check each against the register. That is the exact defect class BP-1100b-5 is being
  built to reject: it stays green on unreachable code, it cannot see a reading point
  reached through a helper, and it cannot tell a catch that degrades from a catch that
  rethrows. The criteria are therefore written as a behavioural sweep — one executed run
  per reading point, under the E2 harness (run_workflow_under_e2), with a prose-only
  reply injected at one point and the run's halt/continue behaviour, substitute value and
  reported outcomes asserted. The audit that produced this adjudication used exactly that
  method: a prose-only pre-flight reply injected into finalize-feature.js produced
  dispatch_count=6 and no error.


  CALIBRATION. The finalize step-0 baseline point is the positive case — it must appear in
  the register, its substitute must be the parse_failed baseline that FIN-100a-2 requires,
  and the run must record the degradation. The AC-authoring point in plan-feature.js
  (currently stepResultObj = {}, so acs_written becomes an empty list and the stage reports
  success having written nothing) is the negative case — it must halt, and BP-300e-4's
  third scenario forbids admitting it to the register at all.
