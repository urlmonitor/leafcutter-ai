title: "Prompt-safety pair maps to red-team eval + human sign-off"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket has change_target: prompt and risk_surface: safety,
  When the guardrail engine resolves the applicable quality gates,
  Then the resulting guardrail set contains these mandatory gates:
    - red_team_eval: adversarial prompts are tested against the changed prompt template
    - human_signoff: a human reviewer must explicitly approve the change before merge
    - standard_tdd: tests are written before implementation and verified after
  And the human_signoff gate cannot be satisfied by an automated agent --
    it requires a sign-off from an identity that is not an agent
  And the red_team_eval gate runs BEFORE human_signoff so the reviewer
    sees the evaluation results when deciding whether to approve
