id: INF-500d-3-v
components:
  - infrastructure
  - feedback_collector
title: "Every other instruction that records a failed submission records the reasoned marker from the run's own failure line, never a bare (submit-failed)"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the agent instructions that say what to record when a feedback submission
    fails, other than the signoff skill and live-surface-tester (INF-500d-3-iv):
      - the shared sign-off block;
      - python-coder's sign-off steps;
      - documentation-verifier's and user-surface-smoker's sign-off submission steps;
      - ticket-supervisor's four event submissions (mechanical retry, cross-agent
        rework, brainstorm escalation, halt) and the feedback_id field of the payload
        it returns;
      - epic-supervisor's cross-ticket pattern submission,
  And a submission run from any one of them prints nothing on standard output, exits
    non-zero, and leaves exactly one `submit-failed:` line,
    `submit-failed:writer-not-allowed:subagent-quality`, in that run's own error file,
    alongside any human-readable ERROR lines the script also writes there,
  When the agent follows that instruction to record the outcome,
  Then it records `feedback-id: (submit-failed:writer-not-allowed:subagent-quality)`,
    and in ticket-supervisor's returned payload the feedback_id field carries
    `(submit-failed:writer-not-allowed:subagent-quality)`,
  And the reason and the category in the recorded marker are exactly those on the
    run's own failure line, never a reason the agent chose by judgement, inferred from
    the exit status alone, or took from a fixed default,
  And none of these instructions still tells the agent to record a bare
    `(submit-failed)` in any case.

  Given a run from one of those instructions that printed nothing on standard output,
    and whose own error file holds a `sidecar:` line naming a recovery file,
  When the agent follows the instruction,
  Then, if that recovery file holds `fb_2026-11-16_1a2b3c4d`, it records
    `fb_2026-11-16_1a2b3c4d` and no failure marker,
  And, if that recovery file is missing or empty, it records
    `(submit-failed:written-uncited:<category>)` with the category it submitted under.

  Given a run from one of those instructions with --category complete, whose own error
    file holds no `submit-failed:`, `sidecar:` or `[submit_feedback] sink:` line
    (the submission entry point is absent or could not start),
  When the agent follows the instruction,
  Then it records `(submit-failed:facility-unavailable:complete)`.

  Given a failed submission recorded by any of those instructions, in any of the cases
    above,
  When the agent finishes recording the marker,
  Then it continues its sign-off, or in a supervisor its adjudication routing, exactly
    as it would after a successful submission, and the verdict, the sign-off status and
    the route taken are unchanged by the failure.

  Given ticket-supervisor's instructions, whose emit contract today also describes a
    secondary `--category tooling-issue` submission with no command for it,
  When an agent reads every place those instructions describe a feedback submission,
  Then each described submission is given with its command,
  And the secondary tooling-issue submission is no longer described anywhere in them.
