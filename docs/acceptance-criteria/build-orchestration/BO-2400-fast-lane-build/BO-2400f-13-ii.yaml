id: BO-2400f-13-ii
components:
  - build_orchestration
title: "A workspace the lane did not open for this criterion is named as foreign and left alone"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the location the fast lane would open for an acceptance criterion is occupied
    by something this lane did not open for that criterion — an ordinary directory
    that is no registered workspace at all, or a registered workspace belonging to a
    different branch or a different piece of work,
  When the run refuses,
  Then the refusal says exactly that: the occupant is not this lane's own earlier
    attempt at this criterion, and the lane will not enter it, move it or clear it,
  And it names the occupied location, and when the occupant is a registered workspace
    it names the work that workspace belongs to,
  And the options it offers are only ones the operator carries out themselves — it
    never offers to clear a workspace it does not own, and it offers no option that
    throws away another party's work.

  Given the same foreign occupant,
  When the operator reads the refusal,
  Then it does not read like the refusal for the lane's own earlier attempt
    (BO-2400f-13-i): the two are told apart from the message alone, because the
    operator's next move differs between them,
  And an occupant the run cannot classify with confidence is reported as foreign
    rather than as the lane's own, so an unrecognised occupant is never handed the
    option that throws work away.
