    only when a person invokes it, validates everything before writing, writes atomically, and exits
    0 ok, 3 refused (problems listed, nothing written), 5 environment error.'
  - The kernel's decision store code makes no git call (no commit, push or merge); review and merge
    are the repository's PR process and branch protection, outside the kernel.
