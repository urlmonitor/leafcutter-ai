notes: |
  WHY TIMING IS ITS OWN L1 AND NOT A DETAIL OF THE RATCHET. GE-127b governs a
  file that is ALREADY over the line. This one governs the single change that
  takes a file from under to over — the crossing event. They are different
  populations and different implementations: a ratchet comparing a file to its
  own previous size says nothing at all about a file that has never been over
  before, and a threshold check on the crossing says nothing about a file that
  was over before the check existed. Both are needed and neither implies the
  other.

  THE VALUE BEING CLAIMED IS ECONOMIC, AND IT IS WHAT THE DECOMPOSITION MUST
  PRESERVE. The cost of splitting a file rises with everything that accumulates
  on top of it after it grew too large. Being told at the crossing is worth
  something specific: at that instant the work to undo is one change by one
  author with the reasoning still in memory. An implementation that reports the
  same fact later — in a periodic sweep, a report, a review comment days after
  the fact — satisfies the words and destroys the value. Bind the acceptance to
  the moment of the change.

  THE BOUNDARY WITH GE-127d. This L1 is about WHEN you are told, not about
  whether the number you are told is the right one or reproducible. Do not
  specify counting rules here; that is GE-127d's subject and specifying it in
  two places produces two rules.

  AN ARM THAT IS EASY TO OMIT AND SHOULD NOT BE. A file that stays comfortably
  under the line must produce no interruption at all. Without that arm the
  criterion is satisfiable by warning on everything, which is the same as warning
  on nothing.
