criteria: |
  Given a workspace "sq-2" whose two commits were squash-merged into the main line, after
    which a later commit on the main line changed the same lines again, so that the main
    line no longer holds sq-2's content in the form sq-2 made it,
  And the maker cannot establish that sq-2's content reached the main line,
  When the landed-work pass is run,
  Then "sq-2" is identical before and after,
  And the answer lists "sq-2" as kept with the reason that its landing could not be
    confirmed, naming its two commits by identifier.

  Given the shared project cannot be reached when the landed-work pass starts,
  And the project has a workspace "ff-1" whose commits reached the main line as last
    fetched,
  When the landed-work pass is run,
  Then no workspace is cleared, "ff-1" included,
  And the pass ends with exactly one answer stating that the shared project could not be
    reached and that nothing was cleared,
  And the answer is distinguishable from a pass that found nothing to clear.
