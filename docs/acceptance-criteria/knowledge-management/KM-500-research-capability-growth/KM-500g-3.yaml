test_required: false
test_rationale: Documentation review verifies each worked example and limitation against the shared behavioral criteria.
  A written walkthrough is not execution proof.
it_requirements:
- Extend the existing knowledge-retrieval how-to and link the shared e-5 reference rather than defining competing
  semantics or implying a new API.
- Examples show original question/scope, actual entry point, returned required fields, source pin, completeness,
  fulfillment and provenance. Label static source-oracle inspection and planned examples separately from real tool
  runs.
- Include root-only versus leaf-only counts, missing work status, declarations without execution proof, eligible
  missing query, unsupported mapping and verified trace versus untraced handling.
- State verification limits for disabled services, absent provider/data-transfer permission, scripted actors and
  missing deployment proof. A walkthrough cannot close behavior ACs or grant authorization.
