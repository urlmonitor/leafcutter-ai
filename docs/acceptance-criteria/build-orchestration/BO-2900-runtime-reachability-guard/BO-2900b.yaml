notes: |
  Regression evidence supplied by the user: this guarantee would have failed the
  instant PR 411 landed. Decompose that as a concrete replay scenario at L2/L3 —
  it is evidence for this L1, not a separate feature.

  2026-08-13 (BA decomposition). Five L2s: -1 the forward check itself (a registered
  capability nothing runs is reported and refuses the change, with the inventory taken
  from the BUILT surface), -2 the three-state regression replay, -3 the
  what-counts-as-a-caller rule defined once for both directions, -4 the how-to and -5
  the component diagram satisfying the two documentation_triggers. One L3,
  BO-2900b-1-i, covers the adoption case (capability and caller in the same change
  passes; capability alone is refused with both ways forward named).

  CALIBRATION CORRECTION TO THE REGRESSION EVIDENCE — recorded here because it changes
  how this L1 must be tested. The forward check would NOT have fired on the state that
  actually shipped: no capability was registered at all, so the inventory was empty and
  the check passes vacuously. That state is refused by BO-2900a-3 (nothing reaches the
  code, so no criterion over it may be marked done). This L1 bites in the state where a
  capability exists and nothing calls it. Both are needed; the replay in BO-2900b-2 is
  written as three states so the vacuous pass is a specified outcome rather than a
  surprise that gets "fixed" by widening the check into source scanning.

  BOUNDARY vs BO-2900c: the reverse direction (an invocation naming a capability that
  does not exist) is BO-2900c. The shared what-counts-as-a-caller rule lives here at
  BO-2900b-3 and is consumed there, not duplicated.
