notes: >-
  MEASURED IN THIS WORKTREE, 2026-09-01. Four records declare a config_schema_fragment
  against commit_guardian.json whose top-level keys are schema vocabulary — type,
  properties, required, description — rather than part names: BP-1100g-4 (work_status
  done), and ACS-100i-8, BP-1100g-4-i and INF-700b-2 (all todo). A check that treats every
  fragment key as a part name reports all four as contradicted, which is wrong about all
  four; a check that quietly skips what it cannot parse reports nothing, which is the
  fail-open shape this whole tree exists to make impossible. Neither is acceptable, which
  is why the third class exists.


  THE UNOPENABLE CASE IS SEPARATE FOR A REASON, NOT FOR SYMMETRY. A file that cannot be
  opened and a file that was opened and lacks the named part produce the same answer to
  "is the part there" — no — and opposite answers to "did we check". Folding them together
  means a mistyped filename, a moved file, or a permissions failure reports as a
  contradicted declaration, sending someone to correct a record that was right. This is
  the same distinction GE-126b-2 draws between a store that was never found and a store
  with nothing in it, and the wording should not diverge from it.


  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSE. "A declaration whose shape the check
  can interpret is not reported as one it could not interpret" asserts an absence and is
  green on arrival. INJECTION: classify as uninterpretable any declaration none of whose
  keys are found in the file. Under that injection the four contradicted records the
  parent names move out of the contradicted class and into the uninterpretable one, the
  contradicted figure falls to zero, and the run still fails — so the parent's own clauses
  stay green and only this clause goes RED. Revert must move them back. That asymmetry is
  the whole reason this record exists as a separate file rather than a clause of its
  parent.


  SECOND NAMED MUTATION, FOR THE PARTITION CLAUSE. Count a declaration under every class
  it matches instead of exactly one. Under that injection the stated figures exceed the
  stated number of declarations read; this clause must go RED. A check whose figures do
  not partition its population can report a reassuring zero in one class while the same
  records sit in another, which is how a stated count stops meaning anything.
