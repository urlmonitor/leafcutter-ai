it_requirements:
  - >-
    Executor (IT-PO decision, ADR-070 sec. 2.3): every pause-store step is dispatched with
    agentType "shell-runner", named once in the workflow body. The steps are the write
    (pause-persist), its read-back (pause-persist-verify), the look-up (peek-pause-record), the
    resume read (read-pause-record), the clear (clear-pause-record), its read-back
    (clear-pause-record-verify) and every other read of the pause store, such as the
    leftover-record scan (orphan-scan-pause-record). None goes to worktree-agent, status-checker
    or command-step-runner (ADR-070 sec. 2.2 keeps command-step-runner for the fast lane's own
    steps). The per-function _shellPermittedAgentId = "worktree-agent" locals and the hard-coded
    agentType in readPauseRecordWithRetry() are removed, not duplicated.
  - >-
    No agent template or registry entry changes (ADR-070 sec. 3): shell-runner already has
    permits_shell true and lists plan-feature.js in spawned_by in config/agent_registry.json.
  - >-
    Request shape (ADR-070 sec. 1.2-1.3): each dispatch carries exactly one command line and the
    instruction to run it once, unchanged, and relay its output verbatim. It carries no goal, no
    background, no fallback, no second command and no explanation of what the record means. The
    command is one plain invocation of pause_store.py: no cd, &&, ||, ;, pipe, $(...), backtick,
    VAR=value prefix or line break.
  - >-
    Locations (IT-PO decision): the workflow body computes both absolute paths from the accepted
    maker answer it already holds (args.workspace, or the answer of the run's own workspace step
    when it made one): the workspace's installed pause_store.py under
    <workspace_path>/<output_root>/scripts/ and the store <workspace_path>/<output_root>/paused_runs,
    passed with pause_store.py's existing top-level --store-dir, which precedes the subcommand.
    A maker workspace is a clone with its own install (docs/reference/workspace-maker-answer.md:
    mechanism clone; KI-BO-20261022 confirms the installed script), so workspace_path is the
    repository root the removed cd + git rev-parse --git-common-dir construct resolved to. The
    session's working directory plays no part, which keeps a run started from a linked worktree
    and one started from the project root on the same store (ACD-2100a-4: the store is a function
    of the project operated on, never of the caller's working directory).
  - >-
    Inert values: every path in the command is absolute and double-quoted. No other
    caller-supplied text (run id, gate id, record) reaches the command line unless it is limited
    by construction to characters Bash does not treat specially; the record's carriage is
    ACD-1300e-3-iii's. A value that cannot be made inert stops the step with a named error and is
    never sent.
  - >-
    Replies (ADR-070 sec. 5.1): every reply passes the shared shellStepReply() check
    (templates/workflows-js/_shared/workspace-answer.js, inlined by the build) before any field is
    used; plan-feature.js gains no second reply parser. A step's result is that one command's
    relayed exit_status and stdout, and pause_store.py's JSON is parsed from the stdout string.
    Each dispatch passes the shared shell-runner reply schema, so a decline reaches the check
    instead of failing inside the engine (ADR-070 sec. 6.3). If shellStepReply() itself must
    change, the change is made in _shared/workspace-answer.js and re-inlined by the build
    (ADR-070 sec. 6.4-6.5), never copied into plan-feature.js.
  - >-
    Re-attempts (ACD-2100c-3-ii, done, kept): the reads keep the bounded re-attempt, at most three
    attempts with a distinct label each, for any reply that is not a readable record, a decline
    included. A re-attempt sends the same command to shell-runner and nothing else; no attempt
    goes to another agent or runs another command. The write and the clear are sent once. This
    refines ADR-070 sec. 5.3 for pause-store reads only and is flagged for the person.
  - >-
    Consolidation: one command builder and one dispatch-and-classify path serve every pause-store
    step (pauseAtGate, readPauseRecordWithRetry, resolveGate's clear, peekPausedGateId and the
    leftover-record scan). Replacing the duplicated per-site dispatch code is what pays for this
    change under the file-size ratchet.
  - >-
    File-size ratchet: templates/workflows-js/plan-feature.js measures 2375 lines under
    scripts/commit_guardian/_file_size_ratchet.count_content_lines ('.js') at 927934e33, against
    a 1000-line limit. check-file-size accepts the change only if the new measured length is at
    most 2375 minus the measured lines the change puts in. A changed line counts as put in, and
    comments are not measured, so every measured line added must be paid for by about two removed.
    Logic beyond building the command goes to Python (scripts/pause_store.py measures 190 of its
    400 lines) or is paid for by the consolidation above.
  - >-
    templates/workflows-js/plan-feature.js is the source. The deployed .claude/workflows/plan-feature.js
    is rebuilt by python scripts/build.py in the same change and is never hand-edited.
  - >-
    Pinned tests amended in the same change, none skipped: unit_tests/workflows/test_bo_2300a_1_ii.py
    asserts worktree-agent for these dispatches (BO-2300a-1-ii is superseded_by ACD-1300e-3) and is
    changed to assert shell-runner; tests that assemble pauseAtGate, resolveGate or
    readPauseRecordWithRetry by source-text extraction (unit_tests/workflows/test_acd_2100c_1.py,
    per ACD-2100c-3-ii) follow any function this change renames, merges or adds; and
    unit_tests/build_orchestration/test_bo_4300a_1_ia_lint.py stays green.
  - >-
    Out of scope: the stage-end script steps (rule check, test design, approval holds, hand-back
    findings) keep scriptStepAgentId
    (tickets/00_inbox/TICKET-20261021-PlanFeatureScriptStepsToShellRunner.md); the pause-store
    dispatches in finalize-feature.js; the run-ownership read of ACD-1300e-1.
  - >-
    Errors follow the CLAUDE.md error-handling policy: no silent fallback. A step that does not
    produce its result logs a [plan-feature][WARNING] line naming the run id, the gate id and the
    step label.
test_intent:
  - clause: >-
      each request carries exactly one command line, which names every location it acts on by absolute path and does not change directory, join two commands, branch on the result of an earlier command, or run a nested command
    needs_test: true
    reason: The command text is computed by the workflow, and a compound line is what made the executor decline, so a regression would only show in a live run.
  - clause: >-
      each request goes to the agent whose only role is to run one given command unchanged and relay its output word for word, and to no agent whose role is creating and removing workspaces, investigating ticket state, or running the fast lane's own command steps
    needs_test: true
    reason: The agent type is a value in each dispatch, and a wrong constant at one site changes it with no other symptom.
  - clause: >-
      the result each step acts on is read from that one command's own outcome and output as relayed in the reply
    needs_test: true
    reason: Reading the record from anywhere but the relayed stdout is how wrapped and retyped replies were misread before.
  - clause: >-
      any further step of the run that reads the pause store (for example a scan for leftover pause records) follows the same two rules
    needs_test: true
    reason: A read site outside the main pause path could keep the old executor or the compound line without any pause failing.
  - clause: >-
      the pause ends with the run reported as waiting and its record present in that workspace's pause store, and a resume started from that same workspace finds the record and applies the person's answer
    needs_test: true
    reason: The outcome depends on the store and script paths the workflow computes, which a wrong path breaks while every dispatch still looks correct.
  - clause: >-
      a run started from a linked worktree of the project still writes to and reads from the project's own pause store, exactly as ACD-2100a-4 requires
    needs_test: true
    reason: The store must not depend on where the run was started, and only a run from a second directory shows that.
  - clause: >-
      the bug symptom ("on run finalize-gate-child-1, 2026-10-25, the gate-ba pause-store write was sent to the worktree agent as one line chaining a directory change, a fallback and a nested command; it declined both because writing a pause record is neither create nor remove and because the line was a compound command, so no record was written and the run ended pause_persist_failed and could not be resumed") must not occur
    needs_test: true
    reason: This is the recorded failure, and it returns if either the compound line or the old executor comes back.
