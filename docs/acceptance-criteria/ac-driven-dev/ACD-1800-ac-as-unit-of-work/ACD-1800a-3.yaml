criteria: |
  Given the deliverable-checklist model of ACD-1800a is implemented,
  When the AC reference documentation is read,
  Then it describes that a requirement carries an explicit deliverable checklist,
  And it describes the responsible-craft attribute on each item,
  And it does not define a list of deliverable kinds of its own: it names the
    vocabulary this store already uses to declare what a requirement changes as the one
    the checklist draws its kinds from, and records the single value added to that
    vocabulary for a diagram,
  And it states that a test is a proof of a deliverable rather than a deliverable, and
    that no kind for tests exists,
  And it explains how the checklist is validated against the requirement's change
    surface,
  And it includes a worked example of a complete checklist.

  Given a reader who needs to know which kinds are allowed,
  When they follow this reference documentation,
  Then it sends them to the one place that vocabulary is defined,
  And a kind added to or removed from that vocabulary does not require this reference
    documentation to be edited for the two to agree.
