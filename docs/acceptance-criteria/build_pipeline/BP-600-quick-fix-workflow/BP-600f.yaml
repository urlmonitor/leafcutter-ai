id: BP-600f
components:
  - build_pipeline
title: "Quick-fix self-isolates off the default branch instead of committing to it"
component: build-pipeline
level: L1
status: active
readiness: reviewed
priority: medium
work_status: todo
criteria: |
  Given the user invokes /quick-fix while the current working directory is on
    the main or master branch,
  When the isolation-decision guard runs, before any other action,
  Then the workflow does not warn that commits will land on the default branch
    and does not ask the user to accept that — it does not offer that outcome at
    all, because commits to the default branch here cannot be pushed and the
    work could never land,
  And it instead treats the location as unusable and self-isolates into a
    worktree on a non-default branch, by the canonical route BP-600a-2 requires,
  And the same self-isolation happens when the working directory is in detached
    HEAD, or is not a git repository at all,
  And every later phase — AC creation, test, fix, commit, changelog, push —
    runs on that branch, so the change reaches the default branch only through a
    pull request,
  And if the isolation step cannot complete — the canonical script cannot be
    found, or the local default branch is behind its remote — nothing is created
    and no work begins: the workflow halts and states which condition stopped it.
depends_on:
  - BP-600
