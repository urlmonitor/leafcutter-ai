  agent: approve_acs
  date: '2026-10-01'
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  WHY A SECOND CRITERION RATHER THAN AN 'AND' ON AR-300a-1. AR-300a-1 is
  satisfied by a list of names. A list of names is a measurable improvement on
  nothing and would still leave the observed behaviour largely intact: over
  roughly 90,000 recorded agent actions, abilities were invoked 33 times and raw
  text search about 32,600, including for questions a shipped ability already
  answers. Not knowing an ability exists and not knowing it applies here produce
  the same fallback.

  THE CONDITION IS ALREADY IN THE GRANT. The distinction between an ability used
  on every task and one used under a stated condition is part of what is
  recorded today. This criterion forbids flattening it on the way through -- it
  does not ask anyone to invent it.
