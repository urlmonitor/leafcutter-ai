criteria: |
  Given each of these flows is run against a real test project with a real shared project,
    each in a workspace obtained from the one workspace maker, and each driven to the point
    where its pull request has been merged into the main line before the flow returns:
    - requirements authoring, for the work "ac/clear-merged-workspaces",
    - the fast lane, for the work "fastlane/tq-200d-3",
    - the feature build followed by finalizing it, for the work "feature/alpha",
    - the quick fix, for the work "ticket/fix-null-slug",
    - ship, for the work "feature/beta",
  When each flow returns its final result,
  Then no folder remains at the location its workspace occupied,
  And the flow's final result contains the clearing door's own answer for that workspace,
    reporting it cleared,
  And the clearing request the flow sent named its work by the same name it used to obtain
    the workspace, and gave no location.

  Given the fast lane for the work "fastlane/tq-200d-4" returns while its workspace is still
    present, with the door's answer at the end of the flow stating the workspace was kept
    and why,
  And afterwards its pull request is merged into the main line by hand and the workspace
    holds nothing unsent,
  When the landed-work pass is next run,
  Then the workspace of "fastlane/tq-200d-4" is cleared,
  And no step of the fast lane, or of any other flow, was run between the flow's return and
    that clearing.
