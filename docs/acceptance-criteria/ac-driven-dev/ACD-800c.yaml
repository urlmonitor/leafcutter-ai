title: "The --apply flag atomically backfills high-confidence matches into AC metadata"
component: ac-driven-dev
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Given the audit has identified matches at high and medium confidence,
  When the tool is invoked with --apply,
  Then only high-confidence matches are written to the AC store
    (implemented_by receives the ticket path, work_status becomes done),
  And medium-confidence matches are left unmodified for human review,
  And the operation is idempotent (re-running with the same matches produces no duplicates).
