notes: |
  Four definition sites exist today, not two, and they carry three distinct
  behaviours: the canonical capturing rule in the test-enforcement module (applied
  by the done-proof scan, and reused by import — not redefined — by the pytest
  enforcement plugin and the fast lane); a byte-equal duplicate of it written out
  again in the commit-time done-proof check's import-fallback branch; a separate
  detect-only rule carried by the commit-time test-tag check; and a fourth,
  separate rule carried by the AC-to-test coverage check that is blind to "//"
  tags altogether. A change to one that is not mirrored in the others is the drift
  failure this repo has hit before, and TQ-100b-4's narrowing is exactly the kind
  of change that invites it — narrow one rule only and the commit-time check and
  the done-proof verdict start disagreeing about what a tag is. Whether the fix is
  a single shared reader or several rules held in parity is an implementation
  choice; this criterion only requires that their observable behaviour over the
  real tree is identical, that a divergence is named, and that no member of the
  set is left out of the comparison.

  TEST ANGLE: run EVERY rule over the committed tree and diff their outputs. A
  test that compares the pattern strings, or that asserts one imports the other,
  is a grep-only structural test and proves nothing about behaviour. A test that
  compares only two of the four is the specific hole the 2026-08-19 clarification
  closed.
