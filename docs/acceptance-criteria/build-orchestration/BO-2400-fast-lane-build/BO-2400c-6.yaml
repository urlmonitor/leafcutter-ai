id: BO-2400c-6
components:
  - build_orchestration
  - ac_store
title: "Resolving a connected build set reads the store once, and resolves the same set it did before"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run resolving the connected build set for one acceptance criterion,
    against a store of acceptance-criteria records, where resolving that set requires
    expanding two or more not-done composite dependencies,
  When the resolution completes,
  Then no record in the store has been read from disk and parsed more than once for
    that resolution: the record set the resolution works from is built once and handed
    to every step that needs it, instead of each step rebuilding it,
  And the ordered list of ids the resolution returns is exactly the list the same store
    produced before the reading was consolidated.

  Given the same resolution,
  When the improvement is asserted,
  Then it is asserted as a count — the number of times store records are parsed, or the
    number of times store files are opened, during one resolution — and never as an
    elapsed time,
  And a covering test that asserts a wall-clock bound does not satisfy this criterion:
    such a test flakes on shared CI and is deleted by the first person it inconveniences,
    leaving the criterion uncovered and the regression free to return.

  Given a store in which some records take part in a dependency cycle and other records
    are adjacent to that cycle — they depend on a cycle member, or are reachable only
    through one — and the resolution removes the cycle members from its own working
    view in order to produce a deterministic order,
  When the tree is walked to find the target's subtree and its unmet prerequisites,
  Then the walk sees the store's records as they stand on disk, including every record
    the cycle removal took out of the working view,
  And the resolved set is identical, member for member and in the same order, to the
    set the same store resolved before the reading was consolidated,
  And a resolution that returns fewer members than before while reporting no error is a
    failure of this criterion, not an optimisation.
depends_on: [BO-2400c, BO-2400f-1]
