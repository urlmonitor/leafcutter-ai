it_requirements:
  - >-
    Show three layers: the shared step (staging, checks with one mechanical retry, branch refusal,
    the answer with remedy / handoff); the commit agent (message authoring, own-context mechanical
    fix, relaying the answer and the handoff); and the depth-0 callers that engage a specialist on a
    handoff and re-offer -- each route workflow, the drive's phase loop, and, once BO-3800a lands,
    the /commit route (commit.js). The criteria list five routes; include commit.js as a sixth
    route when it is on main at publishing time.
  - Show remedy_handoff.py / the remedy-declaration loader as a component the step uses, and the shared COMMIT-ANSWER caller block as a component the depth-0 routes share.
  - Run the next-free diagram id allocator immediately before publishing; link the diagram from docs/architecture/components/build-orchestration.md.
