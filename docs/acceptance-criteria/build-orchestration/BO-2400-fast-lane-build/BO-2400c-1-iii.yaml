assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  config_schema_fragment:
    fast_lane_context_bundle:
      type: object
      description: "Bundle payload obtained once per run before the Test Writer phase: {bundle: str, obtained: bool, message: str}. The build-context-carrying dispatches send bundle verbatim as their prompt context. obtained false, absent, or a bundle that is empty or missing the breakpoint marker ends the run with the context-bundle phase named as the failure — never a silent fallback to an unbundled prompt."
  reference_file_path: "templates/workflows-js/fast-lane-ship.js"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "The bundle is obtained once per run through a single agent-mediated command dispatch (the surface added by BO-2400c-1-ii) and the returned text is threaded into the later prompts. The workflow body cannot read the architecture, conventions or parent-AC content itself, and re-deriving the bundle per dispatch is what would break the byte-identity BO-2400c-1-iv asserts."
    - "The returned bundle text is inserted into the dispatched prompt unaltered. No trimming, no re-wrapping, no interpolation inside the stable region, no per-dispatch preamble prepended ahead of it. Anything the phase agent additionally needs goes after the breakpoint, with the volatile layers."
    - "Mentioning is not wiring. Adding the layer's name to a comment, to a phase list, to an agent instruction, or dispatching it and discarding the result does not satisfy this criterion. The single observable that counts is the prompt text the dispatched agent received."
    - "Fail closed when the bundle is unobtainable: read the obtained flag with the same plain-falsy check the red-baseline gate_passed key already uses, so version skew and an explicit failure behave identically. No default-true, no `|| ''`, no optional read that yields undefined-as-empty and lets an unbundled prompt through."
    - "Covering tests must EXECUTE the lane under unit_tests/_workflow_engine_harness.py (run_workflow_under_e2 with label_responses stubbing the bundle-assembling dispatch) and assert on the RECORDED agent_calls — specifically on their prompt text. A test that greps templates/workflows-js/fast-lane-ship.js for the layer's name, for a phase label, or for source-text ordering is not acceptable evidence: it passes on dead code. This exact feature is the proof — it carries roughly 25 green unit tests and a reference doc and has never executed once, and the grep test at unit_tests/workflows/test_bo2400a_runner_wiring.py:401 asserted the layer's NAME appeared in an orphaned file, which kept a dead reference looking alive for a month."
delivers_to:
  agent: test-writer
  contract: "The assembled context bundle, delivered verbatim as the prompt of each build-context-carrying phase dispatch — stable layers, one cache breakpoint, then this run's volatile layers."
expects_from:
