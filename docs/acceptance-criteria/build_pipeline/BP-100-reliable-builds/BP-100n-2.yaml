notes: "Verified defect, 2026-08-25. The command-reachability guard determines whether the workflows capability is 'on' by testing whether the workflows output directory exists, then skips every name-form workflow target when it does not, stating that workflows are disabled as the justification. It never reads the declared enabled value. The two states it conflates are opposite in meaning: deliberately disabled (skipping correct) versus enabled but not deployed (every command referencing a workflow by name is now unreachable — precisely when the guard must fire). The guard is silent in exactly the failure case it exists for, and the skip is indistinguishable in the build output from a check that passed."
