title: "Interface descriptor schema is enforced on exposed_interfaces elements"
component: ac-store
level: L2
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given a component entry includes an exposed_interfaces array,
  When each element is validated,
  Then every element contains exactly four fields:
    name (string, non-empty),
    type (one of "file_contract", "json_schema", "function_signature",
         "cli_command", "hook_protocol", "event", "data_shape"),
    path (string, non-empty),
    shape (string, non-empty, describing the data contract).
  And an element missing any of these four fields is rejected
    with an error naming the missing field and the component it belongs to.
