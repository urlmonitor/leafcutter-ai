    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: failure
    description: 'EXISTS (tests/kernel/memory/test_publish_cli.py::TestPublish::test_a_run_with_nothing_staged_is_refused):
      the message is ''no staged decision record for this run'''
    covers:
      - DK-600d-2-i
  - name: test_publish_exits_3_when_nothing_is_staged
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: failure
    description: 'EXISTS (tests/kernel/memory/test_publish_cli.py::TestCli::test_publish_exits_3_when_nothing_is_staged):
      through the CLI: exit 3, ok false'
    covers:
      - DK-600d-2-i
  - name: test_an_unsafe_run_id_is_refused
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: failure
    description: 'EXISTS (tests/kernel/memory/test_publish_cli.py::TestPublish::test_an_unsafe_run_id_is_refused):
      an id naming no plain run is refused'
    covers:
      - DK-600d-2-i
