created: 2026-08-25
amended_by:
  - "2026-08-25 [claude]: corrected a false premise, same day it was authored, before any implementation. The original text asserted 16 records whose producer value carries literal quote characters and which 'string-match' nothing — and required they be REFUSED. That is wrong. Their raw form is `assigned_agent: \"python-coder\"`, which is ordinary YAML double-quoting: yaml.safe_load returns `python-coder`, byte-identical to the unquoted twin. Verified directly against FIN-100c-5/-6/-9 and confirmed independently by the IT PO. So those 16 records are stylistically inconsistent and semantically correct, and a rule that refused them would refuse valid records. What IS real is narrower and was buried: the fallback reader used when PyYAML is unavailable (load_yaml_manual / the ImportError branch of load_yaml_from_string) does value.strip() and never unquotes, so it yields the 14-character string including quotes. The same record therefore gets opposite verdicts depending on which reader ran — accepted on the parsed path, refused on the fallback. The criterion is rewritten to that: the two readers must agree, and must agree on the parsed value, because the parsed value is what a dispatcher acts on. Scope is narrower than before (no record is refused for being quoted) and the defect it closes is a genuine one."
