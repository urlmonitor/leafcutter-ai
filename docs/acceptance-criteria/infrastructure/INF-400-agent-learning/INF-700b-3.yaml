notes: |
  Scope boundary against INF-700a. INF-700a asks for the count of learnings
  that have been captured but not yet routed to a surface — a backlog on the
  routing side, visible when the routing step has not run. This AC asks for the
  health of the capture side itself: how many runs tried, succeeded, failed.
  A project can have a zero backlog and a broken capture step simultaneously,
  which is exactly the state observed on 2026-08-26, so the two counts are not
  substitutes for one another.

  The motivating shape: 25 events in 2026-06, 2 in 2026-07, 1 in 2026-08. The
  decline was legible only to somebody who went looking for it eight weeks
  later.
change_target: pipeline
risk_surface: contract_boundary
