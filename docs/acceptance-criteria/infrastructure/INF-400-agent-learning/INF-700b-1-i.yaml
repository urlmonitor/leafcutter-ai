notes: |
  This is the capture-side half of the invariant INF-700c-1 enforces on the
  write side: a contentless record must not be created here, and must not be
  expanded into a curated file there. The two are deliberately separate — one
  governs the emitter, the other the writer, and each must hold on its own.
change_target: prompt
risk_surface: contract_boundary
