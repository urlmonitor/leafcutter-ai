id: BO-2400c-2
components:
  - build_orchestration
  - injection_builder
title: "A drive's own record states whether the stable prefix held across its invocations"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a fast-lane drive that presents its assembled context bundle to more than one
    build-context-carrying agent invocation — today the test-writer and the coder —
    and that drive runs to its terminal payload,
  When that terminal record is read after the drive,
  Then the record carries a context-reuse statement for the drive that reports how many
    context-carrying invocations the drive made, how many of those were presented a
    stable prefix byte-identical to the one presented to the first of them, whether the
    anchor held for the whole drive, and a fingerprint of the prefix the drive anchored on,
  And when every one of those invocations was presented the same bytes up to and
    including the cache breakpoint marker, the statement reports that the anchor held and
    reports a shared count equal to the invocation count,
  And the statement is derived from the prefixes the drive presented to its own
    invocations, not from re-assembling the bundle after the drive, so a drive whose
    wiring stopped reusing one bundle cannot report a held anchor.
depends_on: [BO-2400c, BO-2400c-1-iii, BO-2400c-1-iv]
doc_links:
  - path: templates/workflows-js/fast-lane-ship.js
    relationship: modifies
    status: exists
    relevance: "The drive whose record this is. It obtains the bundle once and prefixes the test-writer and coder dispatches with it; those prefixes are the only thing the measurement may read."
  - path: scripts/injection_builders.py
    relationship: related
    status: exists
    relevance: "Produces the bundle and inserts the single <!-- CACHE_BREAKPOINT --> marker that delimits the prefix being measured. The marker is a textual convention in a prompt string — there is no provider cache-control block here to read."
  - path: unit_tests/_workflow_engine_harness.py
    relationship: specifies
    status: exists
    relevance: "Supplies both halves of the evidence: the recorded agent_calls whose prompts carry the presented prefixes, and HarnessResult.result, the drive's terminal payload on which the statement must appear."
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    context_reuse_statement:
      type: object
      description: "Per-drive context-reuse statement on the fast lane's own terminal run record: the number of context-carrying invocations the drive made, the number presented a byte-identical stable prefix, whether the anchor held for the whole drive, and a fingerprint of the anchored prefix."
  reference_file_path: "templates/workflows-js/fast-lane-ship.js"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "Measure the prefixes the drive PRESENTED. Re-assembling the bundle at the end of the drive and comparing that to itself measures the assembler, which BO-2400c-1-i already covers, and would report a held anchor on a drive that composed its dispatches some other way."
    - "Reuse the checksum helper BO-2400c-1-i and BO-2400c-1-iv already share for the fingerprint, so the runtime property and the recorded measurement of it cannot drift apart."
    - "Build the statement at ONE construction site and include it from there, following the buildFastLaneDeliveryOutcome precedent (BO-2400f-4-vi). A statement assembled independently at each return site drifts between paths."
    - "Nothing here reads provider cache statistics. leafcutter never issues the model API call — the workflow engine's agent() does, and it is handed plain prompt text — so the drive can state that it presented one prefix to N invocations and must not state that a cache was hit, a token was saved, or a cost was avoided."
    - "The live lane writes no telemetry today: the only emit_agent_telemetry calls are in the orphaned templates/workflows-js/fast-lane-build.js, which BO-2400c-1-v removes. This statement therefore belongs on the terminal payload the lane already returns. Do NOT stand up a telemetry emission path for it — that would be a second unread artifact. If the live lane later emits per-invocation telemetry (BO-2400d-1), carry this same statement onto that record rather than recomputing it."
delivers_to:
  agent: python-coder
  contract: "A per-drive context-reuse statement on the fast lane's terminal run record: { context_carrying_invocations, invocations_sharing_anchor, anchor_held, prefix_fingerprint }, readable after the drive without re-running it."
expects_from:
  ac_id: BO-2400c-1-iv
  contract: "A drive whose successive context-carrying dispatches are presented one byte-identical cacheable prefix — the runtime property whose holding or breaking this record states."
test_required: true
test_spec:
  - name: test_run_record_carries_context_reuse_statement
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "An executed harness drive's terminal payload carries a context-reuse statement reporting the invocation count, the shared-anchor count, whether the anchor held, and a prefix fingerprint."
  - name: test_shared_anchor_count_equals_invocation_count_when_prefixes_identical
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "On a drive whose recorded context-carrying prompts share one prefix, the statement reports anchor held and a shared count equal to the number of those invocations."
  - name: test_reported_fingerprint_matches_the_prefix_actually_presented
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: real_artifact
    description: "The fingerprint on the terminal payload is the fingerprint of the prefix region of the recorded agent_calls' prompts, computed with the same helper BO-2400c-1-i uses."
  - name: test_statement_reads_presented_prompts_not_a_reassembled_bundle
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "When the drive is stubbed so a later context-carrying dispatch is composed without the obtained bundle, the statement does not report a held anchor — proving the measurement reads the presented prompts rather than re-deriving the bundle."
test_rationale: |
  Every test here must EXECUTE the lane under unit_tests/_workflow_engine_harness.py
  (run_workflow_under_e2 with label_responses) and read two things from the result: the
  recorded agent_calls' prompts, and HarnessResult.result. A test that greps
  fast-lane-ship.js for a field name, or that unit-tests a fingerprint helper in
  isolation, is not acceptable evidence for this criterion. That is not a hypothetical:
  roughly 25 green unit tests plus a grep test at
  unit_tests/workflows/test_bo2400a_runner_wiring.py:401 all stayed green for a month
  while the bundle layer never ran once. The seam test is the load-bearing one — it is
  the only one that fails if the measurement is computed from a re-derivation instead of
  from what the drive presented.
