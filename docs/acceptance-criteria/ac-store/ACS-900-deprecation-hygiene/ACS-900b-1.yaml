id: ACS-900b-1
components:
  - ac-store
readiness: approved
priority: high
title: "Leftover live code behind a retired AC blocks the commit"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given an AC transitions to a retired state (deprecated / superseded_by /
    superseded) in the staged diff,
    And at least one entry in that AC's implemented_by list is verdicted
    "still present" (the file still exists in the staged tree, or an anchored
    entry's anchor is still found),
  When the deprecation-hygiene pre-commit hook completes its inspection,
  Then the hook exits non-zero and the commit is blocked,
  And the block is not downgraded to a warning regardless of how many or how
    few implemented_by entries are still present (one surviving entry is enough
    to block),
  And when every implemented_by entry for the retired AC is verdicted "gone",
    the hook does not block on account of that AC.
depends_on: [ACS-900b, ACS-900a-2]
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: specifies
    status: exists
  - path: scripts/commit_guardian/check_ac_governance.py
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The block is a USER-CONFIRMED product decision (ACS-900 notes): a real violation (>=1 surviving implemented_by entry on a retired AC) MUST always block (exit non-zero). This MUST NOT be downgraded to a warning, and MUST NOT be gated behind a config 'warn' tier — unlike the optional warn/strict tiers on GE-100/GE-101, the block is the only posture for a real violation."
  - "A single surviving entry is sufficient to block; the decision is OR across the per-entry verdicts (block iff any verdict == present), evaluated independently per retired AC."
  - "When every entry for a retired AC is verdicted 'gone', the hook MUST NOT block on account of that AC (no over-firing — the no-false-positive guarantee is owned by ACS-900d)."
  - "The block decision MUST follow the established check_ac_governance.py output contract: structured block decision to stdout, human-readable diagnostics to stderr, exit code 1 on violation / 0 on pass. Reuse the run_hook.py + emit-block pattern rather than inventing a new output channel."
  - "Fail-open on INTERNAL error is orthogonal and MUST be preserved (owned by ACS-900b-1-i): wrap the entry point in try/except, exit 0 + stderr WARNING on any unexpected exception. Never let a script bug hard-block an unrelated commit."
  - "Deployed (scripts/commit_guardian/) and packaged-template (templates/commit-guardian/) copies of the hook MUST be edited together and verified in parity via build.py (ADR-001)."
delivers_to:
  agent: python-coder
  contract: "The block decision: a non-empty list of {retired_ac_id, status, superseded_by, surviving_entries: [str]} records when blocking (drives exit non-zero), consumed by the message formatter (ACS-900c-1); empty list => no block"
expects_from:
  ac_id: ACS-900a-2
  contract: "Per-implemented_by-entry presence verdict mapping {entry_string -> 'present'|'gone'} for each retired AC"
origin_agent: BrainCandy
