  MEASURED BACKLOG — 2026-10-09, origin/main 7c9cc469a.
    Method: imported calculate_complexities, MAX_COMPLEXITY_SCORE and
    COMPLEXITY_EXCLUDED_DIRS from templates/scripts/commit_guardian (the shipped
    checker's own counting function and settings, read-only) and scored the
    committed blob of every file `git ls-files '*.py'` lists. 2,221 files, none
    failed to parse, none in the skipped directories.
    Result: 109 functions score above the limit of 15, in 90 files. Scores run 16 to
    65, median 19. Spread across every area, no file holds more than 4. Worst:
    _compute_output_mappings 65 (scripts/build_helpers.py).
  The figures 65 and 79 in the inventory comment and 49-of-915 in the register are
  stale. Re-measure at build time rather than trusting 109; no test may hard-code it.

  ONE L1. A single L1 under this L0 trips the non-blocking sparse-tree advisory
  (ACS-100c-2, fewer than three children). Accepted: the work is one ticket, and
  splitting it to satisfy an advisory would recreate the over-specification this
  re-authoring removed.

