notes: |
  SATISFIES THE reference-doc LEG of GE-126e's documentation_triggers. The component-diagram
  leg is GE-126e-4.

  THE FIRST MEASURED NUMBER IS A DELIVERABLE — the L1 says so and this record is where it is
  delivered. It is the thing that turns this goal from three repairs to three checks that
  happened to be looked at into a statement about the family.

  UNTIL IT EXISTS NO RECORD IN THIS TREE MAY STATE OR IMPLY HOW WIDESPREAD THE DEFECT IS, which
  is why this criterion also forbids the reference asserting a figure from any other source.
  The count that circulates informally today came from three checks being looked at while doing
  other work, and repeating it as though it were a measurement is how an observation gets
  upgraded past its evidence.

  THE PROCEDURE IS PUBLISHED WITH THE NUMBER because a figure whose method is unstated cannot
  be disagreed with, and a figure nobody can disagree with does not get corrected when it goes
  stale.

  NAMING THE CENSUS AS THE ROUTE TO A CURRENT FIGURE is what keeps the recorded one from
  becoming the answer. This component has a recorded instance of a documented defence against
  store rot that was itself a no-op for eight days and reported clean the whole time.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

  ------------------------------------------------------------------------------
  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NULL AND THAT IS NOW A DECISION, NOT AN UNFILLED FIELD. This record is
  TERMINAL and it is the last record in the whole tree: it publishes a measurement. Nothing
  in this tree reads the published figure, and the L0's standing rule forbids any other
  record here restating it. DO NOT REFILL.

  THIS RECORD IS THE REASON GE-126e-2's REPORT MUST BE MACHINE-READABLE. The coverage note
  requires re-running the census at the recorded commit and comparing against the published
  figures. Against a human-formatted report that comparison is a parsing exercise inside a
  documentation test, which is a test that gets written loosely or skipped. The obligation is
  carried as an it_requirement on GE-126e-2 rather than here, because that is where it is
  actionable - noted here so a reviewer can see the two records are load-bearing for each
  other.

  THE INFORMALLY CIRCULATING FIGURE IS NAMED EXPLICITLY IN it_requirements AND IN A TEST
  DESCRIPTOR. 'Roughly seventy checks of which three are known' has been repeated through
  this tree's authoring as context, correctly labelled every time as three checks that
  happened to be looked at. The moment it appears in reference material it stops carrying
  that label. The third descriptor asserts its absence rather than trusting the author to
  remember.

