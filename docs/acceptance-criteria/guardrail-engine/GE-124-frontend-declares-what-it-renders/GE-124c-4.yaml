notes: |
  Produced for the `how-to` entry in GE-124c's `documentation_triggers`, which
  the PO mirrors from GE-117d.

  KEYED BY VERDICT CODE, deliberately. The whole point of keeping missing and
  unresolved apart is that they have different fixes; a single "how to satisfy
  the frontend declaration check" page would re-merge them at the moment the
  author actually needs them separated.

  Distinct reader from GE-124a-4: that how-to is for someone writing a new
  component, this one is for someone who has just been stopped. The overlap is
  the declaration syntax, which GE-124a-4 owns and this one links to.

  IT-PO NOTE (2026-08-25). The code set this page must cover is not closed by
  the criteria: GE-124b-1-ii introduces a malformed-pin state whose verdict code
  GE-124c has not yet named. Deriving the section set from the check's enum
  rather than from the two codes named here means the page stays correct
  whichever way that is settled.
