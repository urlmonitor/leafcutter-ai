    ways_forward:
      type: array
      description: "Exactly two entries on an uncalled_capability_finding: 'add the automation invocation in this change' and 'record an exemption for <capability> with a stated reason'. No third entry, and no mention of a skip or bypass flag."
  reference_file_path: "scripts/commit_guardian/commit_guardian.json"
