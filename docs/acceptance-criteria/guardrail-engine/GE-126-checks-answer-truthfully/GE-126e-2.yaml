estimated_complexity: M
it_requirements:
  - "The examined count must be derived from the executions the census actually performed, not from the size of the population it intended to examine. A count taken from the enrolment list is a claim about intent and would report four examined when zero ran."
  - "A run that examined zero checks must not be able to render as a clean result by any reading - not in the report's text, not in its outcome value, and not in whatever a caller parses. This is the census being held to the rule it measures and it is the single most likely way this work ships broken."
  - "The unexecutable count is a first-class reported figure, never an omission and never folded into either of the other two. A check the census could not run is indistinguishable from a check with no defect if it is silently dropped, which is the exact substitution this tree exists to stop."
  - "The arithmetic invariant - reported total never exceeds executed plus unexecutable - must be asserted by the census itself as well as by its tests, because a total larger than what was executed means something was inferred rather than observed."
  - "The commit and the date must be captured at run time from the working copy under measurement, not passed in by a caller. A caller-supplied commit lets a stale figure be relabelled as current, which is exactly what the field exists to prevent."
  - "The report must be machine-readable, because GE-126e-5 publishes figures from it and a test at that record has to compare published figures against a re-run. A human-formatted-only report makes that comparison a parsing exercise that will be skipped."
  - "Error handling must follow the four rules in CLAUDE.md."
test_spec:
  - name: test_a_run_over_an_empty_registration_set_states_it_examined_none
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "the census entry point"
    description: "A census run over a registration set naming no checks reports an examined count of zero and does NOT report that no instances were found - the load-bearing descriptor, because a census that executed nothing must not read as a clean bill of health."
  - name: test_four_checks_one_instance_reports_examined_four_found_one_and_names_it
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Over a fixture set of four checks with exactly one instance, the reported examined count is four, the found count is one, and the instance is named."
  - name: test_an_unexecutable_check_is_counted_separately_and_named
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "Over a fixture set of four in which one cannot be executed, the run reports three examined, one attempted-and-unexecutable, names that fourth check, and does not count it among the checks with no defect."
  - name: test_the_report_never_totals_more_than_executed_plus_unexecutable
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "Across all three fixture runs the arithmetic invariant holds, and a deliberately inconsistent internal state is asserted to be rejected by the census itself rather than reported."
  - name: test_every_run_carries_the_commit_and_date_it_was_measured_at
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Each run records the commit of the working copy under measurement and the date, read from that working copy at run time rather than supplied by the caller - a run in a copy moved to a different commit reports the different commit."
test_rationale: |
  The census's own defect wears the census's clothes: a run that executed nothing and
  reported no instances is a green gate that checked nothing, one level up from the
  defect being measured. That makes the empty-run descriptor the load-bearing one, and
  it must assert two things separately — that examined is zero AND that the report does
  not read as clean — because reporting zero examined while still saying "no instances
  found" is exactly the ambiguity. The unexecutable descriptor is separate from both
  counts for the same reason: a silently dropped check shrinks the denominator and makes
  the number improve without anything improving. The commit-and-date descriptor asserts
  the value is read from the measured copy rather than supplied, because a caller-supplied
  commit is how a stale figure gets relabelled as current.
delivers_to:
  agent: documentation-expert
  contract: "The census report: examined count, instance count with each instance named, unexecutable count with each named, the commit and date measured at, and the arithmetic invariant relating them - in a machine-readable form. GE-126e-5 publishes the first measurement from exactly these fields and its coverage requires re-running the census at the recorded commit and comparing."
expects_from:
  ac_id: GE-126e-1
  contract: "The per-check classification - two working directories, two outcomes, which of the four pairings - for every check executed. This record aggregates those into counts without inferring anything the classifications do not contain."
