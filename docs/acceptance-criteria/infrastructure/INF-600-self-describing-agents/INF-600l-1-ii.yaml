created_by: "docs/acceptance-criteria/infrastructure/INF-600-self-describing-agents/INF-600l.yaml"
criteria: |
  Given a project that does not use the leafcutter agent system at all -- there is no
    agent registry present
  When the build runs the extended consistency check
  Then the card<->registry mirror comparison no-ops: with no registry there is nothing
    to mirror against, so it does NOT report a mismatch and does NOT fail the build
  And it emits an advisory note (to stderr / log) that the check was skipped because
    no agent registry was found, so the skip is visible rather than silent
  And a project without the agent subsystem is never blocked or errored by this check
depends_on:
  - INF-600l-1
