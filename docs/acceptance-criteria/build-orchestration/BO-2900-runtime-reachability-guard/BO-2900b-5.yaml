notes: |
  Satisfies the parent L1's second `documentation_trigger` (`component-diagram`).

  Intended agent is `architecture-diagram-author` — left null per this run's instruction.

  THE TWO-ARROWS CLAUSE IS THE POINT OF THE DIAGRAM. Drawn as one bidirectional link,
  the picture implies a single check with a single failure mode, and readers
  consistently conclude that satisfying one direction satisfies the other. They are
  separate checks with separate inventories, separate failure modes, and separate
  remedies — a stranded capability is fixed by wiring a caller, a stale caller is fixed
  by fixing the call. The diagram is the artifact most likely to erase that distinction,
  so the criteria fix it.

  MARKING THE INVENTORY SOURCES is what keeps the diagram honest. The single largest
  implementation risk in this L1 is deriving either inventory from source text
  (BO-2900b-1, BO-2900b-3); a diagram that shows "reads the source files" as the input
  will be used as the specification. Showing the built surface as the forward inventory
  makes the intended design visible at a glance.

  THE LAST CLAUSE IS ANTI-CONFLATION, and it is drawn from the L0's own framing: source
  to shipped-script byte parity and agent-registry reciprocity are separate registries
  with the same reciprocity instinct. Every reader who meets this diagram cold asks
  whether it is one of those; answering it in the diagram is cheaper than answering it
  repeatedly in review.

