notes: |
  CONCEPT A (part 2). AC-level "done" is COMPUTED from per-deliverable sign-offs, so
  "done" can never be claimed while a needed deliverable is unsigned. This is the
  anti-phantom-done mechanism at AC grain.

  IT-PO enrichment (2026-08-12): done-computation surface in scripts/ac_store/ (alongside
  mark_ac_done.py / done_proof.py); reads the per-deliverable sign-off schema from
  ACD-1800b-1a; aligned with edge child ACD-1800b-2-i; added ac_store to graph components.
