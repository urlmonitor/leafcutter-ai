criteria: |
  Trustworthy commit-time enforcement of the Error Handling Policy — no silent
  gaps, no false confidence, no misleading messages.

  The exception-handling guard (check_exception_handling.py) closes the
  remaining differences between what the documented policy (CLAUDE.md Rules 1
  and 3) says and what the guard actually catches:

  - Subprocess calls are recognised as an external-I/O boundary that must be
    wrapped, so an unwrapped subprocess call no longer slips through unflagged.
  - The judgment of "handled, not silently swallowed" becomes precise: a real
    WARNING-or-higher log is accepted, while a handler that only logs at a lower
    level, or a function that merely shares a name with a logger, is not — so a
    developer never gets false confidence that a violation was caught.
  - Every violation message names the exact exception type that was caught,
    including the full tuple for a multi-type except clause, so the explanation
    a developer reads always matches the code the guard saw.

  The three gaps above are decomposed into testable behaviours at L2 by the BA.
