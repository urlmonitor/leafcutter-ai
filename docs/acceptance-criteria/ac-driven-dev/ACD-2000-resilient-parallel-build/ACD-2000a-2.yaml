notes: |
  THE STOP CONDITION -- ACD-2000a's hazard 4 states this leaf is mandatory:
  "after the cap is exhausted, a FRESH supervisor process (not the same in-memory
  one) must route to escalation rather than retry. A test that only checks the
  field is written proves nothing about the cap being honoured." The Given clause
  "a completely new effort that has no memory of those earlier attempts" is
  therefore not colour -- it is the assertion.

  THE LOAD-BEARING CODE FACT (verified, do not re-investigate).
  templates/skills/building-epics/SKILL.md ~line 789 holds retry counters in "a
  small in-memory counter dictionary keyed by (ticket_path, phase, cap_kind)",
  explicitly "NOT persisted to the ticket file", and justifies that: "that is
  acceptable BECAUSE the on-disk `agents` map and comment log already encode the
  relevant history, and a re-spawned supervisor reading a `failed` row will route
  to §3.4 on its own."
  ACD-1800c-1 DELETES BOTH HALVES OF THAT JUSTIFICATION -- it requires the
  grouping ticket to carry "no per-phase or per-deliverable sign-offs of its
  own", so there is no `agents` map with a `failed` row, and a thin container has
  no per-phase comment log. The counters remain volatile; the on-disk history
  they were ALLOWED to be volatile because of is gone. After the cutover,
  "retry 2 of 3" has nowhere to live and a re-spawned supervisor cannot tell a
  first attempt from a fourth. This L2 is the successor to the deleted half.

  THE LADDER THIS FEEDS (SKILL.md §3, all anchored on "When the LATEST COMMENT
  STATUS is blocker", ~line 687): §3.1 respawn same agent, cap 1 per phase per
  ticket (~693); §3.2 respawn a named sibling, cap 1 per phase pair (~708);
  §3.3 spawn brainstorm-lead, cap 1 per ticket (~723); §3.4 halt and escalate
  (~740). The criteria are written against the ladder's OBSERVABLE outcomes
  (retry vs stop-and-ask) rather than against its rungs, so the ladder can be
  restructured without invalidating this AC.

  THE THIRD AND FOURTH THEN CLAUSES RESOLVE ACD-2000a's HAZARD 2, WHICH IS A
  SEMANTIC CHANGE HIDING AS A STORAGE CHANGE. Today counters reset when a
  supervisor is re-spawned. Persisting them silently converts "1 retry per run"
  into "1 retry ever" -- two flaky-infrastructure failures a week apart become a
  permanent halt on a requirement that has nothing wrong with it. The criteria do
  NOT pick per-run or per-lifetime; they require the trail to SAY WHICH, and they
  require a human clearing path if per-lifetime. That is a deliberate deferral of
  a product decision to the IT PO / user, not an omission -- but leaving it
  implied is what turns it into an outage.

  THE FOURTH CLAUSE ALSO PROTECTS APPEND-ONLY. The obvious way to let a human
  clear a budget is to delete the attempt records. That breaks ACD-2000a-1's
  third and fourth Then clauses, so the clearing decision must be an entry.

  TESTABILITY. Exhaust the budget, then run the adjudicating code in a FRESH
  PROCESS (new interpreter, not a re-instantiated object -- see CLAUDE.md,
  "Behavioral spot-check on REAL store" and the importlib.reload masking note in
  the project's test-isolation guidance) and assert it escalates. A same-process
  test cannot distinguish a durable trail from a lucky in-memory counter.

  2026-08-17 (IT PO enrichment). Assigned python-coder, complexity L.

  THE ASSIGNMENT IS THE ONE JUDGEMENT CALL IN THIS TREE, AND IT IS RECORDED HERE
  RATHER THAN LEFT IMPLICIT. This AC spans two surfaces: a Python resolver and
  the prose adjudication ladder in templates/skills/building-epics/SKILL.md
  (normally llm-expert's craft). It is NOT split, for two reasons. First, the
  ACD-2000a tree is at its 5-L2 cap, so a split is unavailable. Second, and more
  importantly, splitting would produce a prose-only child that cannot be covered
  by an executing test -- and CLAUDE.md's gate/workflow rule forbids covering a
  workflow AC by a grep over its own runbook. The repository already contains
  exactly that anti-pattern for exactly this cap (see ACD-2000a-3's enrichment
  notes), so a split would reproduce the defect being fixed. python-coder can act
  on both .py and .md, so there is no technology contradiction (S2.8 passes); the
  SKILL.md repoint is recorded as a mandatory co-deliverable in it_requirements
  and as a delivers_to contract naming llm-expert as the review craft.

  THE PRODUCT DECISION THIS AC CARRIES FORWARD. The BA deliberately deferred
  per-run vs per-lifetime. This enrichment does NOT pick it either -- picking it
  is a product call for the user, not a technical one -- but it_requirements now
  makes three things binding whichever way it goes: the scope must be recorded on
  each entry, the clearing path must ship before the cap can be exhausted in
  production, and clearing must be an append. Those three make either choice safe;
  leaving them implicit is what turns the choice into an outage.

  RECOMMENDED FOLLOW-UP (not authored here, since the tree is at its cap): once
  the resolver exists, the three fixed ladder caps (SKILL.md §3.1, §3.2, §3.3,
  all 1 today) become candidates for the same durable treatment. ACD-2000a-3's
  scope note deliberately excludes them; that exclusion should be revisited as a
  separate AC rather than absorbed into this one.
