delivers_to:
  - ac_id: INF-800f-1
    contract: "A complexity demand naming file, function, complexity and ceiling, which the specialist answers with complexity-reduction."
expects_from:
  - ac_id: GE-131a-3
    contract: "A complexity refusal naming the file, each refused function, its score and the ceiling applied to it."
  - ac_id: GE-132a-3
    contract: >-
      Added at IT PO enrichment. The machine-readable refusal record, one entry per refused
      function: {path: str, function: str, score: int, ceiling: int, reason: "new" | "grew" |
      "crossed"}, in refusal order. This is the only source the demand is carried from.
assigned_agent: python-coder
estimated_complexity: M
package_surface: false
declares_side_effect: false
it_requirements:
  - >-
    CARRY, NEVER RE-DERIVE. The specialist's brief holds demand: a list of {path, function,
    score, ceiling, reason}, copied verbatim and in order from check-complexity's
    machine-readable refusal record (GE-132a-3). The run does not re-run the check, re-score
    the function, regex-parse the human sentence, or collapse several ceilings into one.
    BO-3800c-1's discriminator is binding here.
  - >-
    Each function keeps its own ceiling. A function already over the limit is held to its
    previous score, and a new one to the limit (GE-131a-1). These values are consumed as
    stated and never recomputed.
  - >-
    The brief is a machine-readable field of the specialist's dispatch, also rendered into
    its prompt, so a test reads it from what the run actually sent.
  - >-
    A specialist-disposition refusal with no usable structured record (absent, unparseable,
    or with an empty demand list) takes BO-3800c-1-i's stop and reproduces what it was
    given. It never builds a demand of its own.
  - >-
    The same twin-parity and size-ratchet constraints as BO-3800b-3 apply to build-feature.js
    and build-ticket.js.
test_required: true
test_spec:
  - name: test_bo3800c2_brief_names_file_function_score_and_ceiling
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "unit_tests/prompt_assembly/_driver_harness.py executing build-feature.js (TWIN_DRIVERS), fed the record real check_complexity.py emitted on a fixture repo"
    description: "Arm 1. The specialist's dispatched brief names scripts/planner.py, plan_batches, 31 and 30. RED TODAY."
  - name: test_bo3800c2_brief_follows_the_refusal_when_it_changes
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Arm 2. The fixture's refusal changes only to parse_rules at 16 with 15 allowed. The brief names parse_rules, 16 and 15, and does not name plan_batches. This catches a brief hard-coded or cached from the first run. RED TODAY."
  - name: test_bo3800c2_brief_carries_every_refused_function_with_its_own_ceiling
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Arm 3. One refusal names plan_batches (31, 30 allowed) and parse_rules (16, 15 allowed). The brief's demand list has two entries, each with its own score and ceiling, with nothing dropped or merged. RED TODAY."
    must_catch:
      - "THE FIRST LINE ONLY: carry only the first refused function"
test_rationale: >-
  The brief is read from the dispatch the driver actually made. Its input is a refusal record
  the real check produced, never a hand-typed fixture, so a shape drift between the check and
  the run goes red. Three tests, all red today.
origin_agent: business-analyst
created: 2026-10-09
amended_by: []
