it_requirements:
  - "The three outcome values must be machine-readable and mutually exclusive. The callers who were misled on 2026-08-25 were reading an exit code, so a distinction that lives only in message text does not close this."
  - "Two of the three outcomes remain a zero exit status. Do NOT make the no-store outcome non-zero: this check ships to consumer repositories with no acceptance-criterion store, and blocking there would make this repair worse than the defect it fixes."
  - "The resolved root must appear in the no-store report. A message that says only 'no store found' leaves the reader unable to tell a misconfigured root from a repository that genuinely has no store, and the root is the fact that explains the difference."
  - "The outcome value assigned to each run must be derived from what the run actually did, not from a filesystem probe performed before the work. Three distinguishable labels assigned from directory state can be emitted by a check that never opens a record - which is the same substitution this record exists to detect."
  - "Every assertion must be made against the copy the build deploys under .leafcutter/."
  - "Must not change the exit status of any commit-time invocation that passes today. The component's deliberate fail-open-on-internal-error convention (GE-116a-1-iii) is not repealed by adding outcome values."
  - "The new outcome vocabulary must be introduced in the same change as its documentation in GE-126b-4, or a caller has three values and one place to look them up that does not mention two of them."
test_spec:
  - name: test_no_store_empty_scope_and_clean_scope_yield_three_distinct_outcomes
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "Three subprocess runs of the deployed copy against three working copies return three distinct machine-readable outcome values, asserted against each other for distinctness rather than each against a literal."
  - name: test_no_store_report_names_the_root_it_resolved
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The first run's report contains the resolved root path, so a misconfigured root is distinguishable from a repository that genuinely has no store."
  - name: test_clean_scope_outcome_is_backed_by_a_refusal_on_the_altered_record
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "A fourth run against the third working copy with one of the two records altered to violate the rule refuses it by name - proving the ordinary success value in run three was a verdict and not a label assigned from directory state."
  - name: test_no_two_of_the_four_runs_are_separable_by_exit_status_alone
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: "Exit statuses of the four deployed-copy runs are collected and shown not to partition them, which is why the outcome value carries the distinction. Also guards the no-store run against being made to block."
test_rationale: |
  Three distinguishable labels are cheap: a check can assign them from a filesystem
  probe without opening a single record, and every message-level assertion would pass.
  The fourth run is what stops that — altering one of the two clean records so it
  genuinely violates forces the ordinary success value to be backed by a check that
  would have refused had there been something to refuse. The exit-status descriptor is
  the inverse guard: it fails if an implementer "fixes" the ambiguity by making the
  no-store case non-zero, which would break every consumer repository without an AC
  store. Comparing the three outcome values to each other rather than to literals keeps
  the test honest if the vocabulary is renamed.
