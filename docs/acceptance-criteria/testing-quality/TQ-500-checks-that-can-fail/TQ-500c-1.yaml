id: TQ-500c-1
components:
  - testing_quality
title: "One recorded outcome per test per alteration, and no combined verdict standing in for them"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a piece of work covered by four tests, whose writer applies three successive
      alterations to the guarded behaviour and re-runs the tests after each,
  When that piece of work is handed on,
  Then its hand-off record states, for every test and every alteration that test was
    exposed to, whether that test objected under that alteration, with each test
    identified by name,
    And the record carries no single combined verdict standing in place of those
      outcomes,
    And a record carrying only a statement that the group of tests objected, with no
      outcome attributed to any individual test, is distinguishable from one carrying
      the per-test outcomes,
    And a test that was not exposed to a given alteration is recorded as not exposed,
      which is distinguishable from that test having been exposed and not objected.
depends_on:
  - TQ-500c
