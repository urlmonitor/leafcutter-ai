implemented_by: []
change_target: code
risk_surface: internal
notes: |
  Positive/allow path: requires_verification: true is consistent when tools
  contains Edit (or Write) because the agent can then produce something to
  verify. This AC uses Edit; the Write-only variant is covered by L3
  GE-116a-2-i. "Guard raises no objection" = hook exit 0 for this file.
