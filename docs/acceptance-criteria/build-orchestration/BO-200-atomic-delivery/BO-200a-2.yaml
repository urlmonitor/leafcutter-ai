criteria: |
  Given a ticket has 3 phase agents that each recorded a sign-off status
    (python-coder: signed_off, test-writer: signed_off, pr-reviewer: signed_off),
  When the commit phase assembles the work envelope,
  Then the envelope includes the sign-off status for all 3 phase agents,
  And each sign-off entry names the agent and its recorded status,
  And the envelope is rejected if any required phase agent has status "needed" instead of "signed_off".
