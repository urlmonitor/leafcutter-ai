level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a reader who wants to know which states a split can be in,
  When they open the split state diagram,
  Then it shows eight states, proposed, approved, in progress, completed, ended partial, rejected,
    rejected and back to clarification, and kept whole after rejection, with the event that causes
    each transition,
  And it shows that only a person's answer leaves proposed: approve leads to approved; reject leads
    to rejected, with the run ending blocked, when no capability could meet the request; to rejected
    and back to clarification, with the run waiting for the person's answer to today's
    clarification question, when routing found it ambiguous; and to kept whole when routing would
    have accepted it or it was found mid-run,
  And it shows approved moving to in progress when the first part has an outcome, and to completed
    when every approved part has settled,
  And it shows the split ending in ended partial, with the run partial, when no approved part is
    still pending and at least one did not settle.
