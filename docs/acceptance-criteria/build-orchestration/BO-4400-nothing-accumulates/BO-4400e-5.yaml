criteria: |
  Given the disk-space guard and space report (BO-4400e-1, BO-4400e-2, BO-4400e-3,
    BO-4400e-4) are in place,
  When a person reads the how-to guide for workspace disk space,
  Then the guide shows the command for the space report with an example output and
    explains each column, including the space a sweep would free,
  And the guide names the warning-level and refusal-limit settings, their defaults,
    and where they are set,
  And the guide explains that under WSL the Windows drive holding the Linux disk is
    also checked, and why the Linux free-space figure alone can mislead,
  And the guide gives the steps to take when a workspace is refused for space: read
    the report, preview and run the sweep, then retry.
