assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  reference_file_path: "scripts/ac_store/generate_ticket_from_ac.py"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/ac_store/ unit_tests/ -q"
  config_schema_fragment:
    type: object
    description: "The load contract this AC narrows CLAUDE.md Error Handling Policy Rule 3 with. Rule 3 permits an except block to either log at WARNING or re-raise; this classification decides which of those two is permitted, per dependency, and is the thing that must be made explicit at each load site."
    required:
      - dependency_class
      - on_failure
    properties:
      dependency_class:
        type: string
        description: "REQUIRED — the caller's output is wrong or incomplete without this dependency. OPTIONAL — a cache, a telemetry sink, or an enrichment whose absence leaves the output correct. The class must be decided and recorded at each load site; an unclassified load site defaults to REQUIRED, because guessing OPTIONAL is how the live defect reads today."
      on_failure:
        type: string
        description: "For REQUIRED: stop with a non-zero exit, name the dependency and the output that cannot be produced, and write no artifact. Logging is NOT one of the permitted options for this class. For OPTIONAL: degrading with a log line remains correct and Rule 3 is undisturbed."
      failure_modes_covered:
        type: array
        items:
          type: string
        description: "The load can fail as absent, unreadable (permissions), or unloadable (syntax/import error). All three take the stop path for a REQUIRED dependency. Catching only the absent case leaves two live fail-open branches."
  constraints:
    - "DO NOT SATISFY THIS BY DEPLOYING THE ONE SIBLING. Adding _component_migration_map.py to the deploy map makes the live symptom disappear and leaves the fail-open loader in place for the next undeployed dependency. That is BP-900g-5's failure mode repeated — fixing the instances on the list while the mechanism that produced them stays as it was. The deploy fix belongs to BP-900g-8; this AC is not done until the loader itself fails closed on a tree where the dependency is withheld."
    - "n_location_rule IS 'all' AND IT MEANS EVERY LOAD SITE IN THE FILE. The Because clause names the sibling loader at ~328/334, but the criterion is a class rule. Audit scripts/ac_store/generate_ticket_from_ac.py for every runtime load whose failure is currently absorbed into a neutral default — an empty mapping, an empty list, a passthrough — classify each as REQUIRED or OPTIONAL, and enumerate the findings in the sign-off. Point-fixing line 334 reproduces the exact history BP-900g-8's criteria cite: three prior instances fixed one at a time while the fourth shipped."
    - "THIS NARROWS CLAUDE.md RULE 3 FOR ONE CLASS ONLY, AND THE NARROWING MUST BE WRITTEN DOWN. Rule 3 permits log-at-WARNING OR re-raise. The live defect satisfies Rule 3 and is still a silent-degradation bug, because the choice was made against a dependency the output's correctness depends on. For REQUIRED dependencies, logging is no longer one of the two options. Rule 3 is undisturbed for optional dependencies, caches and telemetry, where degrading is correct. Whoever implements this must ensure the narrowing is discoverable by the next author, not just present in one function."
    - "ALL THREE FAILURE MODES, NOT ONLY ABSENCE. Absent, unreadable (permission denied), and unloadable (syntax or import error) must all take the stop path for a REQUIRED dependency. The live code catches OSError, which covers absent and unreadable but not unloadable; narrowing the fix to 'file missing' leaves live fail-open branches behind a change that reads as complete."
    - "NO ARTIFACT ON THE FAILING PATH IS THE LOAD-BEARING ASSERTION, NOT THE EXIT CODE. A script that writes the degraded ticket and then exits non-zero satisfies an exit-code assertion while leaving the same wrong file on disk for the next step to consume. Order the work so the dependency is resolved before anything is written, and assert the artifact's ABSENCE. If a write has already begun when the failure is detected, the partial artifact must be removed."
    - "VERIFY IN A GENUINELY FRESH SUBPROCESS. The claim is about module load. importlib.reload() re-executes inside an already-populated namespace and masks cold-import failures — that is exactly how the GenReviewFixes H-2 forward-reference NameError survived its tests. The verification must spawn a new `python` process with the package source tree absent from sys.path, so the deployed copy is the only copy."
    - "THE INPUT MUST BE A REAL ON-DISK AC FILE. Feed the deployed script an actual AC YAML from docs/acceptance-criteria/, not a hand-typed fixture. Hand-built inputs reproduce the author's model of the format, which is the bias that hid the files_touched parser no-op for a whole epic and survived its first remediation spot-check."
    - "The error must follow the project error handling policy: raise a typed failure naming both the dependency that could not be loaded and the output that therefore cannot be produced. A bare exception tells the consumer neither."
declares_side_effect: true
delivers_to: null
expects_from:
