id: KM-ADM-005-2
components:
  - knowledge_management
  - testing_quality
title: "Once records name what verifies them, only a holding verification record leaves the untagged count, and invalid ones are counted at zero tolerance"
component: knowledge-management
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the done gate waives a missing covering test only for a record whose
    verification record holds (BO-2500f-4),
  When the untagged-done ratchet measures,
  Then a finished record whose verification record holds is excluded under the
    ground "verified by check" or "verified by inspection", one ground per method,
    each reported with its count,
  And a finished record declared test-free with a stated reason but no verification
    record that holds is no longer excluded under any ground,
  And a second count reports the finished test-free records whose verification
    record is absent or does not hold, names each one and the part that failed, and
    has a recorded high-water mark of 0, so a single such record fails it,
  And whether a verification record holds is decided by the same shared rule the
    done gate uses, except that the content of an inspection is not re-compared
    here; re-checking finished records over time is TQ-400a's,
  And the counts with every exclusion still sum to the finished records enumerated,
    each ground on the published list (ACS-1100b-1),
  And the first ratchet's high-water mark is not raised by this change; a rise
    means the migration (BO-2500f-4-ii) is incomplete, and the change is refused.
depends_on: [KM-ADM-005, KM-ADM-005-1, BO-2500f-4, BO-2500f-4-ii]
doc_links:
  - path: unit_tests/docs/test_artifact_graph_covers_scope.py
    relationship: verifies
    status: exists
  - path: docs/acceptance-criteria/ac-store/ACS-1100-honest-coverage-answers/ACS-1100b-1.yaml
    relationship: constrains
    status: exists
  - path: docs/architecture/adrs/ADR-076-verification-methods-for-non-test-requirements.md
    relationship: describes
    status: exists
    relevance: 'The decision this record implements: wave 1 (section 1) or wave 2 (section 2)
      of the verification-method rule.'
assigned_agent: python-coder
estimated_complexity: S
declared_files:
  - path: scripts/ac_store/untagged_done_count.py
    state: to_be_created
  - path: unit_tests/docs/test_artifact_graph_covers_scope.py
    state: existing
it_requirements:
  - Call BO-2500f-4's shared rule with compare_content=False (clause 4). The approval file
    is tracked, so the ratchet reads it from the committed tree like every other layer; only
    the inspected-content comparison is skipped.
  - 'Second count: HIGH_WATER_MARK_INVALID = 0, recorded beside the first mark with date and
    rule; it names each failing record and the failed part.'
  - 'The grounds ''verified by check'' and ''verified by inspection'' replace ''waived: declared
    test-free with a stated reason'' in the one ground list KM-ADM-005-1 created.'
  - The first mark is never raised; the ratchet failing is the refusal clause 6 asks for.
  - Lands after BO-2500f-4-ii completes and the switch is on; otherwise the second count fails
    on the 63 migrating records.
test_required: true
test_intent:
  - clause: a finished record whose verification record holds is excluded under the ground
      "verified by check" or "verified by inspection", one ground per method, each reported
      with its count
    needs_test: true
    reason: Per-method grounds are computed output and must count each method separately.
  - clause: a finished record declared test-free with a stated reason but no verification
      record that holds is no longer excluded under any ground
    needs_test: true
    reason: Removing the stated-reason exclusion is the tightening; a reasoned record without
      a holding verification record must be counted.
  - clause: a second count reports the finished test-free records whose verification record
      is absent or does not hold, names each one and the part that failed, and has a recorded
      high-water mark of 0, so a single such record fails it
    needs_test: true
    reason: The zero-tolerance count must name each failing record and fail on one, and only
      a single-record case proves the mark is 0.
  - clause: whether a verification record holds is decided by the same shared rule the done
      gate uses, except that the content of an inspection is not re-compared here; re-checking
      finished records over time is TQ-400a's
    needs_test: true
    reason: The ratchet must use the shared rule; agreement with the done gate on a check-verified
      record catches a copy, and a changed inspected file not flipping the ratchet proves
      content is not re-compared.
  - clause: the counts with every exclusion still sum to the finished records enumerated,
      each ground on the published list (ACS-1100b-1)
    needs_test: true
    reason: The sum invariant must survive the new grounds.
  - clause: the first ratchet's high-water mark is not raised by this change; a rise means
      the migration (BO-2500f-4-ii) is incomplete, and the change is refused
    needs_test: true
    reason: A rise in the first count must fail, and an extra untagged finished record shows
      the refusal.
delivers_to: null
expects_from:
  - ac_id: BO-2500f-4
    contract: "The shared done-proof waiver rule over verification records."
  - ac_id: KM-ADM-005-1
    contract: "The ratchet's exclusion-with-ground reporting, whose 'waived' ground this record replaces."
test_spec:
  - name: test_km_adm_005_2_each_method_is_excluded_under_its_own_ground_with_its_count
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: criterion
    description: "On a fixture store of finished records, one verified by a holding check and two by a holding inspection leave the untagged count under the grounds 'verified by check' (1) and 'verified by inspection' (2), reported separately."
    proves_clause: "a finished record whose verification record holds is excluded under the ground \"verified by check\" or \"verified by inspection\", one ground per method, each reported with its count"
    code_file: scripts/ac_store/untagged_done_count.py
    to_be_created: true
    convention_test_file: unit_tests/docs/test_artifact_graph_covers_scope.py
  - name: test_km_adm_005_2_a_stated_reason_without_a_holding_verification_record_is_not_excluded
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: failure
    description: "A finished record with test_required false, a stated reason and no verification record (and one whose record does not hold) is counted as untagged and is excluded under no ground, so the old 'waived: declared test-free with a stated reason' ground no longer exists."
    proves_clause: "a finished record declared test-free with a stated reason but no verification record that holds is no longer excluded under any ground"
    code_file: scripts/ac_store/untagged_done_count.py
    to_be_created: true
    convention_test_file: unit_tests/docs/test_artifact_graph_covers_scope.py
  - name: test_km_adm_005_2_the_second_count_names_each_failing_record_and_a_single_one_fails_it
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: discrimination
    description: "With HIGH_WATER_MARK_INVALID = 0 recorded beside the first mark with date and rule, a store holding one finished test-free record whose verification record is absent fails the ratchet, naming the record and the failed part; a store holding none passes."
    proves_clause: "a second count reports the finished test-free records whose verification record is absent or does not hold, names each one and the part that failed, and has a recorded high-water mark of 0, so a single such record fails it"
    code_file: scripts/ac_store/untagged_done_count.py
    to_be_created: true
    convention_test_file: unit_tests/docs/test_artifact_graph_covers_scope.py
    must_catch:
      - "a second mark above 0"
      - "a count that fails but does not name the record and part"
  - name: test_km_adm_005_2_holding_is_decided_by_the_shared_rule_without_recomparing_inspected_content
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: seam
    description: "The ratchet calls is_done_proof_waived with compare_content=False: on a check-verified record it agrees with the done gate (check_done_proof.py ci), and changing an inspected file after the approval does not flip the ratchet while the approval file is still read from the committed tree."
    proves_clause: "whether a verification record holds is decided by the same shared rule the done gate uses, except that the content of an inspection is not re-compared here; re-checking finished records over time is TQ-400a's"
    code_file: scripts/ac_store/untagged_done_count.py
    to_be_created: true
    convention_test_file: unit_tests/docs/test_artifact_graph_covers_scope.py
    must_catch:
      - "a copy of the holds logic inside the ratchet"
      - "a ratchet that re-compares inspected content"
  - name: test_km_adm_005_2_counts_with_every_exclusion_sum_to_the_finished_records_enumerated
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: boundary
    description: "On a fixture store with tagged, superseded, check-verified, inspection-verified, untagged and invalid records, untagged plus every exclusion plus tagged equals the finished records enumerated, and an exclusion with a ground not on the published list is reported as an unexplained shortfall."
    proves_clause: "the counts with every exclusion still sum to the finished records enumerated, each ground on the published list (ACS-1100b-1)"
    code_file: scripts/ac_store/untagged_done_count.py
    to_be_created: true
    convention_test_file: unit_tests/docs/test_artifact_graph_covers_scope.py
  - name: test_km_adm_005_2_a_rise_in_the_first_count_fails_the_ratchet
    target_dir: unit_tests/docs/
    framework: pytest
    type: integration
    angle: discrimination
    description: "Running the ratchet file as a pytest subprocess against a fixture repo copy holding one extra untagged finished record fails; against the live repo it passes with HIGH_WATER_MARK unchanged from KM-ADM-005-1's value and HIGH_WATER_MARK_INVALID at 0."
    proves_clause: "the first ratchet's high-water mark is not raised by this change; a rise means the migration (BO-2500f-4-ii) is incomplete, and the change is refused"
    code_file: scripts/ac_store/untagged_done_count.py
    to_be_created: true
    convention_test_file: unit_tests/docs/test_artifact_graph_covers_scope.py
    must_catch:
      - "raising the first high-water mark to absorb the new record"
  - name: test_km_adm_005_2_ratchet_runs_green_on_the_live_store_through_pytest
    target_dir: unit_tests/docs/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "pytest unit_tests/docs/test_artifact_graph_covers_scope.py, as a subprocess"
    description: "Runs unit_tests/docs/test_artifact_graph_covers_scope.py as a pytest subprocess from the repo root, as CI does, and asserts exit 0 and that the output reports both grounds with their counts and the second count at 0."
    proves_clause: "a finished record whose verification record holds is excluded under the ground \"verified by check\" or \"verified by inspection\", one ground per method, each reported with its count"
    code_file: scripts/ac_store/untagged_done_count.py
    to_be_created: true
    convention_test_file: unit_tests/docs/test_artifact_graph_covers_scope.py
