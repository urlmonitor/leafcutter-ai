test_spec:
  - name: test_harvester_reports_zero_when_its_own_sink_is_empty_and_the_operational_stream_is_full
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "python scripts/knowledge/harvest_learnings.py run through subprocess with no --sink override"
    description: "In a temp tree where debugging/logs/agent_telemetry.jsonl holds the real 28 knowledge records and the declared sink exists and is empty, run the harvester through its CLI; assert it reports zero records read and writes to no destination."
  - name: test_harvester_succeeds_while_the_operational_stream_is_unopenable
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: failure
    description: "The no-widening proof that cannot pass on an untaken fallback. Populate the declared sink with one routable record, make debugging/logs/agent_telemetry.jsonl unopenable (mode 000 or a directory in its place), run the harvester; assert it completes and writes the record. A reader that opens the operational stream at any point fails this test."
  - name: test_operational_stream_is_byte_identical_before_and_after_a_harvest_run
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Copy the actual on-disk debugging/logs/agent_telemetry.jsonl (33 lines: 28 records, 4 probes with no event key, 1 non-JSON fragment) into a temp tree, hash it, run a full harvest, hash again; assert the digests are equal. Nothing is moved, filtered, rotated, archived or rewritten to achieve the separation."
  - name: test_a_knowledge_record_and_an_operational_record_land_in_different_files
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: seam
    description: "Emit one knowledge record through the declared emission path and one operational record through emit_event, in the same run; assert each file contains only its own kind and neither contains the other."
  - name: test_two_streams_per_repository_not_two_streams_per_working_directory
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "In a temp project with an isolated working directory added, emit one operational record and one knowledge record from a process inside the isolated working directory and one of each from the project root; remove the isolated working directory. Assert exactly two stream files exist in the whole project, that each holds both of its own records, and that neither holds the other kind. A per-working-directory declaration produces four files and passes the neither-receives-the-other assertion, which is why the file count is asserted too."
test_rationale: |
  The second test is the one that matters. The AC's central obligation is
  negative — the reader must never open the operational stream — and a negative
  cannot be proved by asserting the fallback branch was not logged, because a
  fallback that exists and is not taken in the fixture looks identical to a
  fallback that does not exist. Making the operational stream unopenable turns
  the negative into an observable: a reader that reaches across crashes. The
  byte-identity test uses the real 33-line artefact rather than a synthetic
  fixture because the probe lines and the non-JSON fragment are exactly the
  shapes a hand-typed fixture would omit, and they are the shapes most likely
  to tempt a filtering rewrite.
notes: |
  Boundary against the shared-file filtering question. This AC does NOT give the
  knowledge reader a filter over debugging/logs/agent_telemetry.jsonl, because
  after INF-400c-4-i the knowledge reader never opens that file. Filtering the
  shared file is the obligation of the surfaces that legitimately read it —
  INF-700b-3's capture-health report most of all, which is already required to
  skip unrecognised lines and count them separately.

  Boundary against the retained 28. They stay in the operational stream. They
  are not moved here and are not counted as outstanding anywhere, by INF-700c-2's
  eligibility rule. The byte-identity clause above is what makes that stick.
change_target: code
risk_surface: contract_boundary
