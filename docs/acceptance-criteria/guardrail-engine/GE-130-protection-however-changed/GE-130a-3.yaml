id: GE-130a-3
title: A guide read with a shell command counts as read, and merely naming or listing the guide does not
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a guide inside a folder the guide-read guard gates, not yet read in this session,
  When a command issued from the session's shell prints the guide's whole content,
  Then the guide counts as read for the guard exactly as a read of it with the reading tool does,
    so a following edit or command writing in that folder is not refused for an unread guide,
  And a command that prints part of the guide counts as read on the same terms as a
    reading-tool read of the same part,
  And a command that only names the guide -- listing the folder, finding files by name, or
    testing that the guide is present -- does not count as reading it, and a following write in
    that folder is refused, in the same run,
  And when the guide's content changes after a read by command, it counts as unread on the same
    terms as after a reading-tool read.
depends_on:
