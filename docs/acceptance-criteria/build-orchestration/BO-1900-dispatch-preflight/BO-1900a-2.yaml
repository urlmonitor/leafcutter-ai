criteria: |
  Given a ticket that passes every fitness check (premises reproduce, the assigned
    agent fits the task verb, and the payload is a well-formed allowlisted pointer),
  When the supervisor reaches the spawn point and the preflight validation stage runs,
  Then the preflight returns a fit verdict,
  And the phase agent is spawned exactly as it would have been without the preflight stage,
  And no held-back record is produced for that ticket.
