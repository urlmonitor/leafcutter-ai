  - "DRAW ONLY STATES THE RECORD CAN ACTUALLY REPRESENT. The states must be the ones ACD-2000b-1's claim record can hold and the transitions must be the ones ACD-2000b-3's staleness rule can actually reach. A diagram drawn ahead of those two, or not revisited after them, is a confident wrong picture -- worse than none. Draw it last."
