test_spec:
  - name: outcome_node_tints_by_derived_impl_status
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    description: "A branch (outcome) node whose ACs are all done tints with the 'done' tone; a mix tints 'in_progress' — driven by the derived implStatus from flows.ts, not a hand-set field."
  - name: decision_diamond_tints_by_derived_impl_status
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    description: "A decision diamond tints by the derived impl_status of the fork it represents rather than a fixed amber."
