criteria: |
  Every unit of automated work arrives on main through a pull request, never a direct push.

  When the automation finishes a unit of work, it opens (or updates) a pull
  request and lets the merge happen through that pull request, so the "require a
  pull request before merging" protection can be switched on without breaking
  the pipeline.
