    reason: "Reconciled with BO-2400f-11 by amendment, not supersession. As written this L1 promised that the opinion-only review steps are simply gone from the fast lane, and BO-2500d-1 spelled that out as 'no LLM review agent'. That is contradicted by BO-2400f-11 (done, shipped PR #485 on BrainCandy's instruction), which dispatches pr-reviewer at Phase 4.5 of templates/workflows-js/fast-lane-ship.js. The two 'done' criteria coexisted only because BO-2500d's proof (unit_tests/workflows/test_bo2500d_gate_retirement.py, _FAST_LANE_PATH) points at templates/workflows-js/fast-lane-build.js, an orphan nothing invokes and which BO-2400c-1-v deletes. The distinction that survives is directional: the mechanical gates alone grant done-ness; a reviewer may only withhold delivery. Restated on that basis. Amendment (rather than supersession) also keeps the BO-2500d-* ids active, so the ~24 '# covers:' tags in the gate-retirement suite do not become dangling under scripts/ac_store/done_proof.py."
