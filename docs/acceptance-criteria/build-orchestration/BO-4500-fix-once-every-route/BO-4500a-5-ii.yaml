id: BO-4500a-5-ii
title: "Plan-feature's three commits -- after a stage, at the end, and when recovering orphans -- go through the shared step"
component: build-orchestration
components:
  - build_orchestration
  - git_vcs_operations
  - ac_driven_dev
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500a-5.yaml"
criteria: |
  Given a plan-feature run named plan-bo-100k-20261012 whose business-analyst stage reported
    writing BP-100k-4-iv, BP-100k-4-v, BP-100k-4-vi and BP-100k-4-vii and edited their parent
    BP-100k-4's covered_by,
  And the user approved the stage,
  When the workflow commits the stage's output,
  Then it calls the shared commit step in supervised mode, naming the four records and the run
    plan-bo-100k-20261012,
  And the commit contains the four records and BP-100k-4,
  And the check that requires each child in its parent's covered_by passes on that commit.

  Given the same run reaches its final commit, and separately a run that recovers orphaned
    records,
  When each of those two commits is made,
  Then each calls the shared step naming exactly the records that commit is for,
  And the workflow treats any answer other than committed as a failed commit and reports the
    answer's status, hook_name and failing_files to the user.

  Given plan-feature's commit recipe before this change and the shared step after it,
  When the migration is reviewed,
  Then plan-feature's exact-name rule, which kept a stage from sweeping in other stages' or the
    user's files, is preserved by the shared step,
  And the KI-BO-20260928 regression test -- a stage adding children to an existing parent,
    committed through the real checks -- runs against the shared step and passes.
depends_on: [BO-4500a-5, BO-4500a-4-iv]
doc_links:
  - path: docs/known-issues/build-orchestration/open-high-ki-bo-20260928-stage-commit-leaves-the-edited-parent-unstaged.md
    relationship: describes
    status: exists
    relevance: "commitStageOutput() and the orphan-recovery commit pass ids the same way; fix direction 3 names the missing test this record makes mandatory."
  - path: templates/workflows-js/plan-feature.js
    relationship: modifies
    status: exists
assigned_agent: python-coder
estimated_complexity: L
package_surface: false
it_requirements:
  - >-
    ALL FIVE plan-feature COMMIT PATHS MOVE IN THIS CHANGE, not three. Verified 2026-10-14:
    commitStageOutput (label commit-stage-output) serves the per-stage, final and orphan-recovery
    commits named in the criteria, and two further dispatches exist -- the product-truth stage
    commit (label commit-stage-output-product-truth) and the flow-reconciliation commit (label
    commit-flow-reconciliation). Each calls the shared step in supervised mode naming the run id and
    the exact files written; none keeps its own prompt-level staging or "do not retry" recipe.
  - >-
    plan-feature has no AC id for a run: every call names the run (BO-4500a-4-iv). It reaches the
    commit agent, not the command-step-runner, so BO-4500a-5-viii is not on this path; it is needed
    only if a later decision routes the step through the runner.
  - >-
    Every commit result is read through the shared COMMIT-ANSWER block: committed -> continue;
    policy_ code -> fail the commit with no retry; step_ code -> up to max_transient_retries fresh calls (config, default 3), then fail;
    hook_failed with handoff -> engage the specialist at most once and re-offer the identical path
    list and message file; any other non-committed answer -> fail. A failed commit reports status,
    reason_code, hook_name and failing_files to the user and leaves the files uncommitted on disk.
  - >-
    HARDENED COPY KEPT: plan-feature's exact-name rule and its NO-MAIN-COMMIT defensive guard are
    preserved (the guard becomes the step's policy_protected_branch; the workflow-side duplicate may
    be removed only once the step refuses on the same branches). The KI-BO-20260928 regression test
    (a stage adding children to an existing parent, committed through the real checks) runs against
    the step.
  - Open PR #968 (audit/plan-feature-next) edits plan-feature.js; rebase onto it, do not re-derive its pause-gate fixes.
delivers_to: null
expects_from:
  ac_id: BO-4500a-1-ii
  contract: "Structural-parent inclusion: the step adds a modified parent record and lists it in added_parents."
test_required: true
test_spec:
  - name: test_stage_commit_calls_the_step_supervised_with_the_run_and_written_records
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Run plan-feature.js under the workflow-engine harness with a BA stage writing four BP-100k-4-* records; the recorded commit dispatch instructs the shared step in supervised mode naming those four records and run plan-bo-100k-20261012."
  - name: test_kibo20260928_parent_lands_and_covered_by_check_passes
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "The same four records and an edited BP-100k-4 committed through the real step with the real AC checks give a commit containing all five, with the covered_by check passing."
    must_catch:
      - "name the children only and let the parent stay unstaged"
  - name: test_every_plan_feature_commit_path_reaches_the_step
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "The final commit, orphan recovery, product-truth stage commit and flow-reconciliation commit each record a dispatch to the shared step naming exactly that commit's records."
  - name: test_non_committed_answer_fails_the_commit_and_reports_details
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Scripting each non-committed answer makes the workflow report a failed commit with status, reason_code, hook_name and failing_files, and dispatch no later stage."
test_rationale: >-
  The census failure mode is a commit path nobody migrated, so the reachability test drives all
  five plan-feature commit paths through the harness; the KI case runs the real step and real AC
  hooks because the defect was the hooks never seeing the parent.
origin_agent: business-analyst
created: 2026-10-12
amended_by: []
superseded_by: null
