priority: medium
title: "Every classification carries a confidence score"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the router classifies an unresolved feedback entry F1,
  When it produces the work type, size, and routing destination for F1,
  Then it also produces a confidence score for F1 expressed on a 0.0-1.0 scale,
  And the confidence score is attached to F1's decision record,
  And no entry is allowed to reach a routing destination without a confidence
    score present,
  And the score reflects how well the entry's fields supported the classification
    (a complete, unambiguous entry scores higher than a vague one).
depends_on: [ACD-1500b]
