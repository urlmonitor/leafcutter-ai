expects_from:
  ac_id: ACD-1900b-1
  contract: "The shared spec-resolution API whose store-first branch this AC complements with a ticket-body fallback branch."
it_requirements:
  - "Canonical source: scripts/ac_store/generate_ticket_from_ac.py (spec resolution). A legacy fat ticket that embeds its full spec and has no resolvable source_ac must resolve via the ticket-body fallback path."
  - "A store lookup miss alone must NOT raise -- the resolver falls back to the body; it only halts when BOTH store and body fail (ACD-1900b-1-i). Absence of a new field means 'legacy mode: derive', never 'fail' (ADR-026 non-negotiable rule 4)."
  - "Test must EXECUTE the resolver against a real fat ticket and assert the body spec is returned -- never grep-only."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file/YAML I/O in typed try/except and log-or-reraise; no bare except."
test_spec:
  - name: test_fat_ticket_spec_resolved_from_body_fallback
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "A legacy fat ticket with embedded spec and no resolvable source_ac resolves its spec from the ticket body via the fallback path."
  - name: test_resolver_no_error_on_store_miss_with_body
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "The resolver does not error solely because the store lookup missed when a body spec is available."
