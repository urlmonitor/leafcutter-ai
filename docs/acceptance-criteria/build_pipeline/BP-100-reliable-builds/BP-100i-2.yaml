title: "Manifest parity: every hook registered in one commit_guardian.json appears in all commit_guardian.json files"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-100-reliable-builds/BP-100i.yaml"
criteria: |
  Given the legacy template commit_guardian.json registers 6 hooks:
    - check-alpha
    - check-beta
    - check-gamma
    - check-delta
    - check-epsilon
    - check-zeta
  And the canonical template commit_guardian.json registers only 4 of those hooks:
    - check-alpha
    - check-beta
    - check-gamma
    - check-delta
  (check-epsilon and check-zeta are absent from the canonical manifest)
  When the parity check runs at pre-commit time
  Then the commit is blocked with exit code 1
  And the error message lists "check-epsilon" and "check-zeta" as hooks
    present in the legacy manifest but absent from the canonical manifest
  And each violation names the hook ID and the manifest file where it is missing
