id: BO-2000a-1
title: "A self-hosting non-regression claim backed by a recorded command and zero-new-violations output is accepted"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a self-hosting non-regression claim submitted for evaluation,
    and the claim is accompanied by a recorded evidence bundle that contains
    both the exact command that was run to check the project against its own
    standards and the captured output of that run,
    and the captured output reports zero new standards violations,
  When the fulfillment gate / validator evaluates the claim,
  Then the claim is accepted as a valid self-hosting non-regression result,
  And the accepted result retains a reference to the command and the captured
    output that backed it, so the evidence remains inspectable after acceptance.
