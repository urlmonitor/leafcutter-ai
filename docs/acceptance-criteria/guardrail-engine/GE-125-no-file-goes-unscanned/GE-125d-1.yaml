notes: |
  THE FIXTURE PLACEMENT IS INVERTED IN THIS TREE, AND THAT IS DELIBERATE.
  This goal's standing verification rule is that a fixture placed under any path
  containing "tickets/", "docs/retrospectives/", "docs/acceptance-criteria/" or
  "templates/skills/" measures the exemption rather than the scanner, and so
  passes for the wrong reason. For THIS L1 the reduction is the subject, so the
  fixture MUST sit under such a path — which makes it doubly important to say so
  rather than let a later reader assume the trap was walked into. Two of the
  three fixtures are therefore under exempt locations on purpose, and the third,
  "src/app.py", is outside them on purpose: it is the control that makes the
  first arm falsifiable. Without it, an implementation that emits the notice for
  every staged file would satisfy the counting arm.
  "templates/skills/example-skill/scripts/helper.py" was chosen as the second
  fixture because it is the sharp edge recorded in the known issue — that
  location is on the prose list but holds executable Python, including the
  secrets scanner's own script.

  THE VALUE IS WITHHELD FROM THE NOTICE, and the never-echo arm is asserted
  NEGATIVELY. GE-123d-5 holds the same rule for the adjacent notice in a
  different tree and establishes the shape reused here: embed a distinctive
  marker in each value and require its absence from both streams, rather than
  matching expected notice text. Path, count and the reduction's name are the
  whole payload; they are enough for an author to find the line in their own
  working copy, and none of them is the credential.

  WHY THE COUNT AND NOT THE LIST OF VALUES, once more in the form a reviewer
  will need: the entire premise of announcing a reduction is that the reduction
  is occasionally wrong. Printing the value turns every wrong decision into an
  exposure, at the exact moment the tool believes it is being helpful.

  BLOCK-VS-ANNOUNCE was decided here, not defaulted. The L1 requires the choice
  to be explicit in either direction. It is announce-only. The siblings GE-125a,
  GE-125b and GE-125c are the records that change what the check DOES; this one
  changes what is KNOWN, and it holds its value even if every remaining
  reduction turns out to be correct, because a reviewer can only agree with a
  suppression they can see.

  SIBLING COUPLING. The criteria are written against the reduction as it behaves
  at the time of the run, not against today's specific rule, so that the record
  stays true after GE-125a, GE-125b or GE-125c narrow what is reduced. The
  concrete fixture paths name today's behaviour because a criterion needs
  concrete inputs; if a sibling lands first and one of those paths stops being
  reduced, replace the fixture with one that still is — do not weaken the arm to
  "some file somewhere".

  A GREP-ONLY TEST DOES NOT COVER THIS. The claim is that a notice reaches a
  person. CLAUDE.md's rule for gate and hook ACs applies without qualification,
  and this component already ships a guard documented as dispatching a
  specialist that never does — a message defined in the source and never printed
  passes a grep and protects nobody. The notice must be observed arriving on the
  error stream of a real run over real files staged in a throwaway repository.

  IT-PO NOTE, 2026-08-24 — WHAT THE CODE ACTUALLY DOES TODAY, measured rather
  than assumed, because two of the requirements above depend on it. In
  templates/scripts/commit_guardian/check_secrets.py the findings report is
  written by bare print() with no file= argument, so it lands on STDOUT; the
  only existing write to STDERR in that file is the WARNING emitted when
  `git diff --cached` cannot be listed. main() computes raw findings via
  scan_files, then applies _filter_prose_findings per staged file, then returns
  0 immediately if the filtered list is empty — before any output at all. A run
  that withheld everything and reported nothing therefore returns from that
  early guard today, which is why the notice cannot be attached to the
  findings-printing block. In the scanner,
  templates/skills/security-scanner/scripts/scan_secrets.py, allowlist-parse
  warnings already go to stderr and its module docstring states "never stdout",
  so the stream convention this L1 adopts already exists and is consistent.
