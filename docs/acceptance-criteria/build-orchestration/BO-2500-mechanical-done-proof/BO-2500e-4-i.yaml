title: "Python-covered ACs yield an unchanged verdict after JS support is added"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an active AC covered only by Python "# covers:<id>" tests,
  When the done-proof oracle evaluates it after JS / vitest support has been added,
  Then it yields the same verdict it did before JS support existed — the same eligibility outcome
    and the same blocking reasons,
  So adding front-end proof-of-done does not change or regress Python-covered behavior.
