criteria: |
  Given a record under the store root that cannot be read or cannot be parsed while
    the total is being established,
  When the coverage machinery encounters that failure,
  Then the failure is reported as an internal error with a warning naming the
    unreadable record and the run continues, per the project error-handling policy,
  And the unreadable record is counted neither as in scope nor as a declared
    exclusion, and is instead reported in a third category of records the measurement
    could not classify,
  And the count of records in that third category is stated in the answer as its own
    figure alongside the total, the covered count and the declared exclusion total —
    an answer that carries could-not-classify records without naming how many does not
    satisfy this criterion,
  And the presence of even one could-not-classify record forbids an unqualified
    all-clear in any verdict that consumes the answer, under ACS-1100d-2, so a partly
    failed measurement can never be laundered into a clean bill of health downstream,
  And a measurement whose entire result is a failed read — a whole measurement
    returning nothing because its source could not be opened — is reported as every
    record in that source being could-not-classify, never as a legitimate empty answer,
  And "could not classify" means UNREADABLE OR UNPARSEABLE ONLY and never means
    schema-invalid: a record that is read and parsed but fails validation is a fully
    classified in-scope record carrying a validation result, so the store's standing
    schema-validation backlog — 277 of 2,784 records failing validation when measured
    on 2026-08-13 — stays inside the in-scope count and does not label every answer a
    broken measurement,
  And the answer's outcome is labelled distinctly from both a reconciled clean answer
    and a shortfall halt, so a reader can tell a broken measurement from a complete
    one,
  And this graceful degradation applies only to failures of the measurement itself: a
    reconciled shortfall with readable records still halts under ACS-1100c-1 and is
    never downgraded to a warning.
