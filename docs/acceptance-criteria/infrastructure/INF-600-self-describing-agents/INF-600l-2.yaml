it_requirements:
  - "The mirror check is OPT-IN / leafcutter-subsystem-specific: it activates only where the agent registry + generated-card convention are present, and does not run against projects that do not use the agent subsystem."
  - "The card path must be resolved from the card-path CONVENTION (configurable / derived), not a single hardcoded path, so projects whose card directory differs from the default still resolve; when a card's expected path cannot be resolved, defer to the absent-card fail-open (INF-600l-1-i) rather than erroring."
  - "Do not broaden the check beyond the registry+card surfaces (it is not a general file linter); the scoping keeps it aligned with the INF-600g/INF-600k registry-validation family."
  - "PORTABLE SURFACE: this opt-in scoping + convention-based card-path resolution lives in the same EXISTING hook (templates/scripts/commit_guardian/hooks/check_agent_spawn_consistency.py) extended in INF-600l-1; convention-based (not hardcoded) card-path resolution is what makes the extended check portable across consumers whose card directory differs from the default."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
  - "PORTABLE per ADR-001: ships to consumers via build.py; the card-path convention default travels with it (canonical source = templates/scripts/commit_guardian/, deployed scripts/ copy kept in parity via the build.py round-trip); must NOT rely on the leafcutter repo's own root CLAUDE.md."
