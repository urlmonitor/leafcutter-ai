it_requirements:
  - "The check must derive the source-to-installed relationship from the installer's own mapping, not from a hand-maintained list of file pairs. A second list of pairs goes stale the first time a file is added and the check then reports clean on the file it cannot see."
  - "The check must name the file. 'Something is out of sync' cannot be acted on and cannot be distinguished by a test from a check that found nothing."
  - "The check must not fire on a generated file that merely differs from its source in a way generation explains -- template expansion, header injection, path rewriting. Comparing raw bytes across a transform produces a check that is always red and is therefore always ignored."
  - "The check must be usable from the point where 'delivered' is decided, and its result must be consumed there. A check that computes a correct verdict nobody reads is inert -- the phantom-gate failure mode this repo keeps rediscovering."
  - "Must satisfy the repository error-handling policy: reading both copies is external I/O."
  - "Must be idempotent and side-effect free: running the check must not modify either copy."
  - "This is not a ban on touching an installed copy while debugging. The requirement is that a repair living only in build output is visible as undelivered before someone reports it as done."
  - "THE CHECK IS NOT MISSING -- IT IS PRESENT AND INERT, AND THAT IS A HARDER STARTING POINT THAN A BLANK PAGE. Verified by running scripts/commit_guardian/check_output_drift.py in this worktree on 2026-08-26: it exited 0 having examined 169 output files and checked exactly none of them. Its scan list is a hardcoded set of directory names, while the installer's mapping keys every entry under the configured output root -- two namespaces that never intersect, so every file falls through the not-in-mapping branch. The first requirement above is therefore about the SCAN SIDE, not the mapping: the mapping is installer-derived and already correct. Derive the set of files to check, and the key each is looked up under, from the installer's mapping itself, so a newly deployed directory is covered the day it appears."
  - "THE NOT-IN-MAPPING BRANCH MUST NOT STAY FAIL-OPEN. Today an output file with no mapping entry prints an informational line and is skipped. That is indistinguishable, from the outside, from a file that was checked and found clean -- and it is the branch every one of those 169 files took. A file that is deployed but unmapped is either a defect in the mapping or an untracked output; either way the check must say so in a way that a caller can act on, because 'I could not see this file' is the exact condition this record exists to make visible."
  - "REPAIRING THE SCRIPT ALONE LEAVES THE GATE HALF-DEAD. The pre-commit registration in scripts/commit_guardian/commit_guardian.json restricts the hook to a hardcoded set of path prefixes. A deployed route file under a differently-configured output root does not match, so the hook never runs and the corrected verdict is never computed. Fix the trigger and the check together, and prefer deriving both from the same configured output root rather than restating it in a third place."
  - "OWNERSHIP BOUNDARY WITH ACD-2100d-2-i. This record owns the determination -- the installer-derived mapping and the per-file divergence verdict -- and the files that compute and report it. ACD-2100d-2-i owns the install-time announcement and the installer's write paths. Neither record should modify the other's files: the determination reaches the announcement through the delivers_to contract, not through a shared edit surface."
test_spec:
  - name: test_installed_file_carrying_a_repair_its_source_lacks_is_reported
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      A working copy in which an installed route file carries a change its source does
      not; the check reports that file by name as carrying behaviour its source does
      not.
  - name: test_change_is_not_reported_as_delivered_while_the_divergence_stands
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the delivery check invoked the way the build invokes it, with its verdict read from the caller's decision rather than from the check's return value"
    description: >-
      The verdict is consumed where 'delivered' is decided -- the divergent working copy
      is not reported as delivered -- so the check is wired, not merely present. A run
      that examines files and checks none of them, exiting clean, must fail this test.
  - name: test_running_the_installer_confirms_the_report_by_removing_the_repair
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      The installer is run over the same working copy and the installed file afterwards
      no longer carries the repair -- the report is confirmed by what the installer
      actually does, not by an opinion about paths.
  - name: test_a_generated_file_that_only_differs_by_generation_is_not_reported
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      A freshly installed file that differs from its source only in ways generation
      explains produces no report -- the check is not a raw byte comparison.
test_rationale: >-
  The third Then clause is what makes this testable end to end: it requires the report to
  be confirmed by what the installer actually does, so the check cannot pass by being
  merely opinionated about paths. Running the installer and observing the repair gone is
  the real-artifact evidence. The reachability test is separate because a delivery check
  whose verdict nobody reads is exactly the phantom-gate shape this repo keeps
  rediscovering -- a correct verdict computed and discarded looks identical to a correct
  verdict acted on, from the check's own tests. It is also not hypothetical here: the
  check that exists today examines every deployed file and checks none of them, and it
  has always exited 0. The negative case is charged as a boundary angle because a check
  that fires on every generated file is worse than no check: it gets filtered and then
  ignored.
delivers_to:
  - agent: python-coder
    ac_id: ACD-2100d-2-i
    contract: "An installer-derived source-to-installed mapping plus a divergence determination per generated file -- the same determination the installer needs in order to announce that it is replacing a locally changed file. Delivered as a callable determination, not as a shared edit surface: ACD-2100d-2-i reads it and does not modify the files that compute it."
