notes: |
  GAP 2(b) from the independent v2 review. Canonical surfaces (prose): the building-epics
  runbook templates/skills/building-epics/SKILL.md and the supervisor template
  templates/agents/ticket-supervisor.md, in the done-eligibility / mark-done step. ACD-1800b
  records per-deliverable sign-offs ON the AC (schema in ACD-1800b-1a, hence depends_on), but
  the supervisor's done-eligibility still reads only the ticket-body "## Comments" status;
  this AC teaches it to ALSO accept AC-side sign-offs during the dual-record window, so a thin
  ticket whose sign-offs live on the AC is not treated as never-done. Placed under ACD-1800b
  (sign-offs recorded on the requirement; done when every deliverable signed) rather than 1800c
  because it is about CONSUMING the AC-side sign-off record for done-eligibility. Paired with the
  parity-gate side ACD-1800c-5 (GAP 2a).
  Per CLAUDE.md (gate/workflow ACs verify BEHAVIORALLY): the covering check MUST exercise the
  done-eligibility decision against a thin ticket with AC-side sign-offs and a legacy fat ticket
  with body status and assert the result is CONSUMED in the mark-done control flow -- never
  grep-only. IT-PO to add it_requirements + surface wiring.

  IT-PO enrichment (2026-08-12): prose surfaces (ADR-001 canonical templates/; .claude/ is build
  output). test_required: false per the change_target: prompt precedent (ACD-1800b-1b /
  ACD-1600b-1-i). Behavioral proof = ACD-1800b-1a + ACD-1800b-2-i tests + ADR-026 rule-7
  mark-done control-flow spot-check.
