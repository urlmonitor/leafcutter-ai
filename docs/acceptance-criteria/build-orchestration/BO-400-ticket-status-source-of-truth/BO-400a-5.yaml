title: "ticket-prioritizer excludes in_progress tickets from the ready set"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
criteria: |
  Given a tickets folder containing:
    - ticket-A.md with `status: todo` and no unmet depends_on
    - ticket-B.md with `status: in_progress` and no unmet depends_on
    - ticket-C.md with `status: done`
    - ticket-D.md with `status: todo` and `depends_on: [ticket-C]`,
  When ticket-prioritizer scans the folder to produce the ready list,
  Then ticket-A appears in the ready list (todo, unblocked)
  And ticket-D appears in the ready list (todo, dependency satisfied)
  And ticket-B does NOT appear in the ready list
    (status: in_progress means it is already being driven)
  And ticket-C does NOT appear in the ready list (status: done, completed).
