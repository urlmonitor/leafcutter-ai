id: GE-126e-2-i
title: "A list too long to act on in one pass is a successful run and never a blocked commit"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a fixture set in which most of the checks are instances — more than anyone would
    repair in one pass,
  When the census runs,
  Then it completes and reports every instance it found and its own run is a success rather
    than a failure so the size of the finding is information and not an error,
  And no check any check's configuration or any registration data is altered by the run: the
    files it read are byte-identical afterwards,
  And no commit is gated on the census having found nothing so a developer with unrelated work
    in progress is never blocked by a backlog they did not create,
  And the report identifies the instances it found in a form that can be worked through
    afterwards rather than only as a total,
  And the recorded members of adjacent defect families that the census re-surfaces are
    reported like any other instance and are neither repaired nor suppressed by it.

  Coverage note: covered by running the census over a heavily seeded fixture set and asserting
  it completes successfully, that the fixture files are unchanged afterwards, and that the
  instances are individually identified. The unchanged-files assertion is what separates
  reporting from repairing and it is a comparison of file contents rather than a claim in the
  report.
