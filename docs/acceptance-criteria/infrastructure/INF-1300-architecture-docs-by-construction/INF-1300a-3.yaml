priority: high
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300a.yaml"
criteria: |
  Given a request naming a tier, a kind of picture, a component, a title, a
    destination, a date and an originating ticket,
  When the document is produced,
  Then each of those inputs appears in the produced document as the value it was
    given: the declared tier is the requested tier, and the tier digit in the name
    of the file agrees with it; the declared kind is the requested kind; the
    declared components contain the requested component and contain only
    identifiers the project's component registry declares; the document's heading
    and its declared title are both the requested title; the creation date and the
    last-changed date are both the supplied date and neither is later than it; and
    the originating ticket is recorded as supplied, or recorded as explicitly
    absent when the request states there is none,
  And a request whose component is not one the registry declares produces nothing
    and is refused, rather than producing a document that declares it,
  And no field of the produced document holds a value the request did not supply
    and the project does not itself define — in particular no field whose values
    the project requires to point at something real is written with a placeholder,
    an example, a sample path or an empty entry,
  And changing one input and repeating the request changes that value in the
    produced document and changes nothing else in it.
