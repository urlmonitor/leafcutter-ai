notes: |
  Authored 2026-10-21 from an observed failure. On a fresh hosted (Aura Free) instance the
  first knowledge sync aborted with a client-configured transaction timeout after writing
  8,237 of 11,307 nodes. Nodes are written in fixed batches of 250 rows regardless of how
  large each row's payload is, and the writer's transaction limit is capped at 30 seconds.
  The failed-generation cleanup (KM-400b-5-i) worked and the retry passed, so the outcome
  depended on timing rather than on design.

  The figures here (250 rows, 2,000,000 bytes) are illustrative test values. The real
  budget is a technical constraint for IT PO to set; the behaviour required is that a
  batch is closed when EITHER bound would be exceeded, that a record larger than the
  budget is still written (alone), and that small-record batching is not made worse.

  Not a duplicate of KM-400b-3 (readers never see a partial generation) or KM-400b-5-i
  (a failed publication removes its own generation): both act after a failure; this
  record makes the failure less likely in the first place.
