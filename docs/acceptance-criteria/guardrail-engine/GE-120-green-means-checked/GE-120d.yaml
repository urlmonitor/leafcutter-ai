notes: |
  The same degrade-quietly reflex, one layer up — in the code that PREPARES a
  working copy rather than in the checks themselves. Included as its own L1
  because the surface is different (the set-up path, not the check family), so
  fixing GE-120a/b would leave it standing.

  OBSERVED: setup_ticket_worktree.py create-ac-worktree warned that
  verify_precommit_active.py and install_pre_commit_shims.py were "not found ...
  graceful no-op" while creating the very working copy this tree was authored
  in. A set-up step named "verify protection is active" that no-ops when it
  cannot find itself is the worst case of the whole goal: the one check whose
  job is to catch this failure is itself subject to it.

  BA LATITUDE: if decomposition shows the set-up no-op and the check-side
  resolution failure are literally the same root cause, this L1 may be folded
  into GE-120b — but say so explicitly rather than dropping it. Do not fold it
  on the assumption alone; the two live in different scripts today.
