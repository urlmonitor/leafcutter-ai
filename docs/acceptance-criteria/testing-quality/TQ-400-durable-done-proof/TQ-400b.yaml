title: "Work whose proof has lapsed loses its done badge, and the record says why"
component: testing-quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Done becomes reversible — when the evidence goes, the badge goes with it.

  A finished item that no longer has proof behind it returns to the pile of work
  still to be done, carrying the reason it was knocked back and the date it
  happened. Nobody has to argue about whether it is really finished: the record
  itself says what stopped holding, and it reappears as work you can pick up.
