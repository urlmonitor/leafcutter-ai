notes: |
  User request item (2). "Landed" = every commit of the workspace's own line is on the main
  line (by identifier, or by content for squash merges) AND the workspace holds nothing
  unsent. Stricter than BO-4100c-1's holds-nothing, which also accepts "open-1" (pushed,
  unmerged).

  "fresh-1" is an unasked-for boundary: a just-made workspace with no commits of its own is
  trivially "contained in main". Without this clause an hourly pass would delete workspaces
  a run has just been given. It is kept with reason no-own-work while it is younger than
  seven days idle.

  USER DECISION (2026-10-29, BA gate): a workspace with no commits of its own, nothing
  uncommitted and no file changed for seven days is abandoned and is cleared ("idle-1").
  Idle is measured from the newest change to any file in the workspace, not from when it
  was made, so a run still writing to it is never cleared.

  USER DECISION (2026-10-29, BA gate): the pass never deletes lines of work on the shared
  project -- the request is about disk space on this machine; deleting merged lines on the
  shared project stays an explicit, per-request choice on a single clearing request.

  USER DECISION (2026-11-16, D3): the content-equivalence check -- a line whose changes reached
  the main line only as one combined commit with the same content, judged over all of the
  line's own commits together, never commit by commit -- is built into the maker under this
  record. BO-4100c-1 reuses it later, so this record no longer waits for BO-4100c-1.

  USER DECISION (2026-11-16, D2): each flow applies this same landed rule to its own one
  workspace at its end (BO-4400g-4, BO-4400a-1), so there is one rule, not a second one for
  flows. The one exception (user decision Q2, 2026-11-16): the idle thresholds (seven days
  here, fourteen in BO-4400g-2-v) guard only this unattended pass. A flow that ends with no
  commit of its own and nothing unsent clears its own workspace at once (BO-4400a-1-i), so
  "fresh-1" being kept is the pass's behaviour, never a flow's.

  USER DECISION (2026-11-16, plan-feature gate): a workspace whose work is pushed to the shared
  project but never reached the main line (a failed run, an abandoned or closed pull request,
  or one still open but untouched) is cleared by this pass once it holds nothing unsent and no
  file in it has changed for 14 days; its line on the shared project stays and can be fetched
  again. The pass stays git-only. Younger ones stay kept as not yet on the main line, which is
  why "open-1" is now given an age (a file changed an hour ago). BO-4400g-2-v states the rule;
  the 7-day rule above is unchanged.

  BOUNDARY vs BO-4400d (routine sweep), RESOLVED (user decision 2026-11-16, BO-4400g
  plan-feature gate, ONE RULE): the routine sweep's workspace part runs this pass, with its
  children's 7-day and 14-day idle rules, and uses its decision and kept reasons. The sweep
  keeps its own job for expired scratch and outside items and its count-and-space report.
  BO-4400d-1, -1-i, -2, -3 and -4 were amended to match the same day.

  LEFTOVERS (user decision 2026-11-16, ONE RULE owned by the door): a record-less or
  half-cleared leftover in this project's landing place is never judged by this pass's landed
  rule. The pass hands it to the clearing door, which clears it only under the door's rule for
  a record-less leftover matching its merged line, being specified in PR #1414 (not on main
  yet, so it is deliberately absent from depends_on and doc_links). Until that rule exists,
  the pass keeps such a leftover and reports it with reason landing_unconfirmed. This
  replaces the former "design default, open question" in the HALF-CLEARED requirement.
