notes: |
  WHY THE TEXT-SUBSTITUTION CLAUSE. "No classifier was built" is not directly
  observable, and an assertion that no classifier exists in the source is exactly
  the source-presence proof the anti-grep clause forbids. Running the same records
  twice under different requirement text and requiring identical output is the
  behavioural form of the same statement, and it fails on any implementation that
  peeks at the text — including one that only peeks as a tie-break.

  THIS AC IS ITSELF A NEGATIVE CONTROL, and the tree it belongs to says what to do
  about that: its own falsifiability answer must be the substitute kind. The
  obvious alteration is to make the reading consult the requirement text — for
  example by treating an absence-shaped expected outcome as declaring the
  substitute kind — and to require that these clauses object under it. An
  implementer who records "green on arrival, nothing to prove" for this AC has
  reproduced KI-TQ-010 inside the fix for KI-TQ-010.

  BOUNDARY. This AC adds no behaviour of its own. It is satisfied only by a
  regression test over TQ-500a-1's record shape and TQ-500b-1's reading, and it
  must not be closed by a change that special-cases the two fixture records.
