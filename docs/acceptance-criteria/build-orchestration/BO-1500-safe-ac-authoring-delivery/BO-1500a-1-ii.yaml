assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "stdout is reserved for the one payload. Every child process create-ac-worktree starts whose
    output is not already captured -- install_pre_commit_shims.py (_install_pre_commit_shims),
    git submodule update, the dependency install and build.py (_bootstrap), git fetch
    (_fetch_origin) and git worktree add (_create_ac_worktree) -- must have its stdout sent to
    the parent's stderr, never inherited from the parent's stdout. The final print(json.dumps(payload))
    stays the only write to stdout."
  - "Forward, do not discard: child progress lines must reach stderr, not subprocess.DEVNULL. They
    are the diagnostics an operator needs when bootstrap fails, and the BO-1500a-5 halt message
    relays stderr."
  - "When redirecting to the parent's stderr, do not assume sys.stderr has a real file descriptor
    (it may be replaced by a test harness); either pass a descriptor that is known to be valid or
    capture the child's output and re-emit it on sys.stderr. Re-emitting must preserve every line."
  - "Fix the producer, not the consumer. Do not make /plan-feature tolerant (for example by parsing
    only the last stdout line): BO-1500a-5 deliberately fails closed on an uninterpretable setup
    outcome, and loosening the parse would hide the next stdout leak."
  - "The helpers touched here are shared by setup-ticket, create-only and create-fastlane-worktree,
    which make the same single-line JSON promise in the module docstring; the redirect must keep
    their payloads and exit codes unchanged."
  - "Follow the project Error Handling Policy (CLAUDE.md): keep the existing explicit error handling
    around each subprocess call; no bare except; never swallow a failure silently."
test_spec:
  - name: test_first_run_stdout_is_exactly_one_json_object
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "python scripts/setup_ticket_worktree.py create-ac-worktree <slug>, run as a real subprocess"
    description: "In a real clone of a real origin whose committed tree carries a stub build.py that
      prints many lines to stdout and a stub scripts/commit_guardian/install_pre_commit_shims.py that
      prints '[installed] commit-msg', a first create-ac-worktree run exits 0 and json.loads() of the
      WHOLE stripped stdout (not its last line) succeeds, yielding one object whose worktree_path the
      fixture repository itself lists in git worktree list."
    must_catch:
      - "only the shim installer's output is redirected while the build's output still reaches stdout"
      - "only the build's output is redirected while the shim installer's output still reaches stdout"
      - "the bootstrap children are redirected but git worktree add still prints its tracking and HEAD lines to stdout"
  - name: test_reuse_run_stdout_is_exactly_one_json_object
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: boundary
    description: "A second create-ac-worktree run for the same session slug takes the reuse path
      (no bootstrap; only the shim installer runs, printing '[already_installed] commit-msg'),
      exits 0, and its whole stdout still parses as exactly one JSON object with created false."
    must_catch:
      - "the redirect is applied inside _bootstrap() only, so the reuse path's shim install still writes to stdout"
  - name: test_child_progress_lines_reach_stderr_and_never_stdout
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: discrimination
    description: "Across the first and reuse runs, the stub shim installer's '[<result>] commit-msg'
      line and a unique marker line printed by the stub build.py both appear in the command's
      stderr and appear nowhere in its stdout."
    must_catch:
      - "child output is sent to subprocess.DEVNULL, so stdout is clean but the progress lines are lost"
test_rationale: "The defect is in the channel, not in any function's return value, so every test runs
  the real command-line entry point as a separate process against a real git clone of a real origin
  and asserts on the bytes that come out of stdout and stderr. A direct-import unit test of a helper
  would pass while another call site still let a child inherit stdout, which is how the shim installer
  and the build kept leaking after the payload was declared single-line. The first-run test parses
  the WHOLE stdout rather than its last line on purpose: the existing ACD-2100a-2-ii tests accept a
  leading leak by reading only the last line, which is exactly why this regression stayed green. The
  reuse-run test is separate because the reuse path skips bootstrap and runs only the shim installer,
  so a fix scoped to _bootstrap() would pass the first run and still fail every /plan-feature re-run.
  The stderr test discriminates a correct fix from one that silences the children with DEVNULL,
  which would satisfy the first two tests while throwing away the diagnostics the BO-1500a-5 halt
  message relays."
