  - reason: "2026-10-04 DK-300 migration under the user-approved entity-context redesign: retain the fresh-run ordering, explicit-route, snapshot and downstream-handoff invariants, but replace obsolete lexical EnrichedContext/body-evidence expectations with versioned EntityContext. Historical reports and direct gather_context compatibility remain unchanged; these revised criteria are verified by current behavioral tests, not historical scores."
superseded_by: null
