id: UXP-600
components:
  - ux_prototyping
  - frontend_coding
readiness: reviewed
priority: medium
title: "Diamonds and their edges are derived from the existing flow branch data"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: in_progress
criteria: |
  Given flows in the product-truth store that model forks using the existing branch data
  (each branch carrying a from-step, a condition, and a target),
  When the graph for a flow is built,
  Then the decision diamonds and their labelled edges are derived from that existing branch data,
  And no separate first-class decision definition is required in the flow for a diamond to appear,
  And a flow that carries branches renders diamonds without any change to the flow's stored shape.
depends_on:
  - UXP-596
doc_links:
  - path: docs/architecture/adrs/ADR-025-first-class-flow-decisions.md
    relationship: specified-by
    status: exists
  - path: docs/product-truth/flows/leafcutter/explore-flows-in-atlas.flow.json
    relationship: implemented-by-step
    status: exists
assigned_agent: frontend-coder
estimated_complexity: M
it_requirements:
  - "buildFlowGraph in leafcutter-web/lib/data/graph.ts must synthesize decision nodes and their labelled edges purely from flow.branches (each branch's from / condition / label / target), read from the FlowBranch model parsed by parseBranch in leafcutter-web/lib/data/flows.ts."
  - "No decisions[] array (the ADR-025 future schema) may be required for a diamond to appear — a flow carrying only branches[] must render diamonds with no change to its stored JSON shape."
  - "Derivation must be a pure function (no fs / no network) so it is safe to run in the client graph build and unit-testable in isolation."
delivers_to: null
expects_from: {}
origin_agent: BrainCandy
