notes: |
  Read the directional clause carefully before implementing or testing it. The wrong
  reading is positional — "the review phase runs before mark_done" — and that reading is
  satisfiable by moving code from one line to another without changing who has authority
  to declare an acceptance criterion done. The right reading is about the SET: whatever
  the reviewer returns, the acceptance criteria a run marks done are always a subset of
  those the mechanical gates alone would have permitted. A veto removes members from that
  set. Nothing adds to it.

  That reading is also what makes the reviewer safe to keep. BO-2400f-11 exists because
  BrainCandy asked for a reviewer "to catch any silly things that should not be shipped",
  and a veto-only reviewer takes nothing away from BO-2500's guarantee: an acceptance
  criterion that reaches done still reached it through red-baseline, green-plus-coverage
  and covers-tag linkage, exactly as before. What would break the guarantee is a reviewer
  whose approval was READ at the mark-done site, and that is what BO-2500d-1-i now rejects.

  The Phase 4.5 / Phase 5 ordering the lane uses today is correct and must not be
  inverted. Marking done first and reviewing second would leave a veto-blocked run with
  acceptance criteria recorded done and nothing committed — phantom-done, produced by the
  very machinery built to prevent it.

