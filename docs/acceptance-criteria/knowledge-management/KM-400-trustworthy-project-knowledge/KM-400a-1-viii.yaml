id: KM-400a-1-viii
title: Roadmap phase metadata separates each phase from roadmap-wide context
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
priority: medium
work_status: done
parent: KM-400a-1
criteria: |
  Given a roadmap contains phase_1 and phase_2 with id, title, exit_criteria and tickets_advancing_outcome
  And phases may also declare description, status, components and future extension fields
  And both phases have status active while the roadmap selects current_phase phase_1
  When RoadmapPhase metadata is exposed from the selected source revision
  Then one record is available per phase with every authored phase field preserved
  And each phase keeps its exact stable id when the phase order changes
  And exit-criteria order, ticket order, duplicate components and empty lists remain unchanged
  And absent description, status or components remain absent rather than receiving defaults
  And each phase's status remains active independently of the roadmap's selected current phase
  And roadmap-wide current_phase, current_outcome, last_updated and comments are available as separate attributed context
  And roadmap-wide context does not become authored per-phase fields or duplicate the entire phase collection into every phase

  Given a roadmap contains duplicate phase IDs, an invalid phase shape or a current_phase that names no declared phase
  When phase metadata is prepared
  Then the invalid source is reported explicitly instead of merging records, inventing a phase or returning a complete-looking partial result
depends_on: [KM-400a-1]
