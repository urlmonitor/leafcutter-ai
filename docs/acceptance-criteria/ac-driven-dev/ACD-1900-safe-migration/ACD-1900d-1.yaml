it_requirements:
  - "Canonical source: the gate script under scripts/commit_guardian/ and its config entry in config/guardrail_gates.yaml. A gate configured enabled: true, strict: false MUST report its finding on stderr but exit 0 (advisory), so neither the build nor the commit is failed by it (ADR-026 non-negotiable rule 3, advisory-before-required)."
  - "The advisory-vs-blocking behaviour must be driven by the strict flag read from config in the gate's control flow, not hard-coded."
  - "Test must EXECUTE the gate against a change containing a real violation and assert exit 0 with the finding on stderr -- never grep-only (a grep test passes on dead code)."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file/subprocess I/O in typed try/except and log-or-reraise; no bare except."
test_spec:
  - name: test_advisory_gate_reports_finding_exits_zero
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A gate with enabled: true, strict: false run against a real violation reports the finding on stderr and exits 0."
  - name: test_advisory_gate_does_not_fail_build_or_commit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The advisory gate does not fail the build or commit despite detecting a violation."
