criteria: |
  Given a reader who wants to know which states a split can be in,
  When they open the split state diagram,
  Then it shows six states, proposed, approved, in progress, completed, rejected, and kept whole
    after rejection, with the event that causes each transition,
  And it shows that only a person's answer leaves proposed: approve leads to approved; reject leads
    to rejected when routing had turned the request away, and to kept whole when routing would have
    accepted it or it was found mid-run,
  And it shows approved moving to in progress when the first part settles, and to completed when
    every approved part has settled.
