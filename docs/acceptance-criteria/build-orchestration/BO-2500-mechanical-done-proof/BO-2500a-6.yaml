    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-003-test-source-of-truth-discipline.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "File of record: scripts/ac_store/done_proof.py (the module backing the required CI gate 'Proof-of-done coverage check (BO-2500b)', invoked from .github/workflows/ci.yml). The composite-vs-leaf distinction must live in this module's done-eligibility logic."
  - "A composite AC is one with children or a non-empty covered_by; it is satisfied when all its children are covered by passing tests, WITHOUT requiring a direct '# covers:' test of its own."
  - "A leaf AC (no children, empty covered_by) must still fail unless it has its own passing '# covers:' test — the leaf path must not be weakened by the composite exemption."
  - "The composite/leaf classification must be data-driven (derived from children/covered_by), never a hard-coded AC-id allowlist."
  - "If the fix introduces a new import into done_proof.py or its hook, add that module to the build deploy-manifest (build_ac_store deploy_map in scripts/build_phases.py) so the deployed CI gate does not raise ModuleNotFoundError; verify by running the deployed gate, not only the source-tree unit tests."
  - "Must follow the repo error-handling policy: specific-exception try/except around file/YAML I/O and any pytest subprocess call, log at WARNING or higher (or re-raise); no bare or silent excepts."
  - "Verify behaviorally — EXECUTE the checker over a fixture AC store (composite-with-covered-children and done-leaf-without-test), not by grepping done_proof.py."
test_spec:
  - name: test_done_composite_with_covered_children_passes
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    description: "Running the proof-of-done check in CI-changed mode over a fixture store passes a done composite whose children are each covered by a passing test, with no direct linked test of its own."
    covers: [BO-2500a-6]
  - name: test_done_leaf_without_test_still_fails
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    description: "The check fails a done leaf AC (no children, empty covered_by) that has no passing '# covers:' test of its own."
    covers: [BO-2500a-6]
delivers_to:
