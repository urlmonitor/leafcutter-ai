notes: |
  REAL-ARTIFACT SPOT-CHECK, per CLAUDE.md ("Real-artifact behavioral spot-check
  before declaring done"). ACS-1200a-2 proves the behaviour against a
  purpose-built fixture; this one proves it against the exact records that
  forced the bypass, written by the real authoring path with real YAML
  serialisation. The repo has already shipped a hook that passed every synthetic
  fixture and was a complete no-op on real files, for precisely the
  fixture-shape reason.

  Deliberately narrow: this AC asserts the two runs and their difference. It
  does NOT assert anything about the other 54 pre-existing orphans in the store
  — that boundary is ACS-1200b-3.
