notes: |
  USER DECISION Q3 (2026-09-17): all callers, warn-only first, then blocking after the Q2
  measurement. inline_work_guard already has a warn mode; the other two gain the same. Note the
  existing INLINE_WORK_GUARD_MODE=warn is a per-call OVERRIDE governed by GE-130b; this record is
  the project-wide ROLLOUT STAGE. The two must stay distinguishable -- an override that sets the
  rollout stage for everyone would be a bypass with no caller rule.

  The warn-only stage applies to the command path only; the editing path of the task-lock guard
  already blocks and does not regress to warn.

  DECIDED 2026-09-17 (user) -- SECOND GATE: UNATTRIBUTED SHARE. Because an unattributed change no
  longer stops the run (GE-130c-2-i), weak attribution would silently weaken enforcement; the
  share gate keeps such a protection warn-only until attribution is good enough. The threshold
  VALUE is for the IT PO to set; the criteria require that it is stated and met. The share applies
  to the documentation guard and the guide-read guard only -- the task-lock guard makes no
  unattributed finding (it stops any non-exempt writing command under the lock regardless of
  attribution, GE-130a-4), so its gate remains the false-block measurement alone.

  declares_side_effect: false.
