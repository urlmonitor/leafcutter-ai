it_requirements:
  - >-
    NO PACKAGE SURFACE — MEASURED IN THIS WORKTREE, NOT ASSUMED, WHICH IS WHY THE SPEC HERE
    IS A PLAIN LIST RATHER THAN THE STRUCTURED FIVE-FIELD OBJECT.
    _package_surface_registry.WATCHED_REGISTRIES binds exactly two containers on
    commit_guardian.json: hooks_manifest.hooks (by entry id) and the document's own top
    level (by mapping key). Both were read at enrichment time. `check-file-size` is ALREADY
    a manifest id and `file_size` is ALREADY a top-level key. This record adds no id and no
    key: it introduces one new INPUT to an existing comparison and configures nothing at
    all. Do NOT mint a config_schema_fragment to clear the structured-spec validator —
    BP-1600a-2-ii records that BP-100k-4 and BP-100k-4-i each declared a key that was never
    created, and an imaginary key makes the machine-checked spec less trustworthy than no
    spec at all.
  - >-
    GROSS, NEVER NET, AND NEVER THE SUBTRACTION THAT IS ALREADY IN HAND. The number of
    measured lines the change added is read from WHAT THE CHANGE PUT INTO THE FILE. It must
    never be derived from the difference between the two lengths the comparison already
    holds. This is the single most likely wrong implementation precisely because an
    implementer holding two lengths and needing a third number will reach for the
    subtraction. Under a net reading the rule is self-referential — the quantity being
    constrained appears on both sides — and collapses to "the file must end at or below its
    previous length", which is GE-127b unchanged. A net reading does not weaken this record,
    it deletes it and the whole of GE-127f with it.
  - >-
    COUNTED IN THE FILE'S OWN UNIT, BY THE FUNCTION THAT PRODUCED BOTH LENGTHS, ON BOTH
    SIDES. _file_size_ratchet.count_content_lines is the single measurement rule behind the
    current length and the previous length; the added-line count must be denominated in
    exactly that unit. THIS IS SHARPER THAN IT LOOKS: counting `+` lines out of a textual
    diff is a SECOND COUNTING RULE wearing a plausible disguise, because the measurement
    rule strips triple-quoted regions and block comments that span lines, and a per-line
    diff read cannot see those regions. Derive the count so that it agrees by construction
    with the one function — for example by measuring the same content the function measures
    on both sides of the change — rather than by a parallel line-classifier that happens to
    agree on today's fixtures. GE-127d owns which lines count; do not restate it and do not
    write a second version of it here.
  - >-
    GE-127b-1's DELIVERED BOUNDARY DESCRIPTOR IS RECONCILED IN THIS SAME CHANGE, AND THAT
    RECONCILIATION IS THIS RECORD'S TO EXECUTE. GE-127b-1 is done and green.
    test_ge_127b_1_an_oversized_file_left_at_exactly_its_previous_length_commits asserts
    that a change leaving an already-oversized covered file at exactly its previous length
    commits, and GE-127b-1's it_requirements pin the boundary at strictly greater-than. Once
    this record lands that holds for exactly ONE shape: a change that added no MEASURED
    lines. The descriptor's fixture today does not say which shape it exercises. Required:
    the descriptor is NOT deleted and its assertion is NOT weakened; its fixture is PINNED to
    a change that adds no measured lines to the oversized file — a pure deletion, or an edit
    touching only content the measurement rule does not measure — and its name and
    description are amended to say so. The case it used to cover implicitly and no longer
    does becomes this record's first arm, where it is refused. GE-127b's
    strictly-greater-than boundary survives as the boundary of GE-127b's OWN comparison; what
    changed is the threshold that comparison is judged against, not the direction of the
    inequality. This is a deliberate narrowing already recorded on GE-127b's amended_by, not
    a regression, and it is not licence to re-open GE-127b's criteria, which stay untouched.
    The surviving shape is this record's last arm: adding only unmeasured content is free.
  - >-
    THE DOCSTRING-ONLY LOOPHOLE IS THE HONEST CONSEQUENCE OF THIS RECORD AND MUST BE RECORDED
    RATHER THAN HIDDEN. Because additions are counted in the same unit as the file's length,
    a change that adds ONLY docstrings or block comments has added nothing measured and is
    therefore free AT ANY SIZE — an arbitrarily large docstring-only addition to an
    already-oversized file commits. This will look like a bug to whoever meets it first. It is
    not: counting additions in any other unit would be a second counting rule, which this tree
    forbids in four places, and it is the same inheritance GE-127b-1 already carries. Carry
    that reasoning into the module's own DECISION HISTORY beside the added-line count, so the
    next reader meets the argument rather than the surprise and does not "fix" it by quietly
    counting raw added lines — which would break the reconciled GE-127b-1 descriptor for a
    reason that looks like an off-by-one and is not. Whether the measurement rule should
    change is GE-127d's call and must not be settled here.
  - >-
    NO ARM IN WHICH THE COMMIT COMPLETES MAY BE REACHABLE BY STRIPPING BLANK LINES OR HASH
    COMMENTS — A FIXTURE CONSTRAINT, NOT A SECOND COUNTING RULE. Measured by probe in this
    worktree: count_content_lines strips triple-quoted regions and block comments ONLY. It
    does NOT strip `#` line comments (three count as 3) and does NOT strip blank lines (four
    count as 4). The 560 arm and the delete-only arm must therefore reach their end state by
    WHOLE CONSTITUENT DEFINITIONS leaving the file. A fixture that reaches the number the
    cheap way has failed to exercise the record. Note the deliberate exception, which is the
    point of the last arm and not a violation of this constraint: the unmeasured-content arm
    is ABOUT content the rule does not measure, and its fixture must add exactly that.
  - >-
    THE TRAP THAT BIT THIS REPOSITORY TODAY — IF THIS CHANGE ADDS ANY NEW MODULE IMPORTED BY
    check_file_size.py, BOTH HAND-ENUMERATED FIXTURE LISTS MUST BE UPDATED IN THE SAME CHANGE.
    unit_tests/commit_guardian/_ge_127a_1_ordinary_commit_fixture.py (PRODUCTION_MODULES) and
    unit_tests/commit_guardian/_ge_127c_1_scope_fixture.py each copy a hand-maintained list of
    modules beside check_file_size.py into their temp repositories, and nothing checks either
    list against the real import graph. When GE-127e-1 added the _file_description import,
    both lists were silently incomplete and six descriptors went red, surfacing as "baseline
    commit failed" with the real ModuleNotFoundError visible only inside a captured traceback;
    it was caught only by rebasing onto main and running the WHOLE commit_guardian suite. This
    record is more exposed than most, because it also AMENDS a delivered descriptor in one of
    those suites. Run the whole suite before signing off.
  - >-
    HOST AND LAYERING. Prefer putting the added-line count in _file_size_ratchet.py beside the
    measurement function whose unit it must share. If a new module is warranted it goes INSIDE
    templates/scripts/commit_guardian/, copied verbatim by build_commit_guardian, so no
    scripts/build_phases.py deploy-map entry is needed; a module imported from OUTSIDE that
    directory MUST be added to the deploy map in the same change or the DEPLOYED hook raises
    ModuleNotFoundError at commit time while source-tree tests stay green. The guard is subject
    to its own limit and its own ratchet, so watch the counted length of whatever you grow.
  - >-
    HOOK-RUNNING COMMITS GET THE BUILD-CLASS TIMEOUT, NOT THE SHORT ONE. Any descriptor that
    performs a real `git commit` through a `.pre-commit-config.yaml` must use the 180-second
    bound (_HOOK_COMMIT_TIMEOUT_SECONDS), never the 30-second plumbing bound. At 30s this
    construction was observed FLAKY in this worktree today — passing at 28.5s and timing out at
    ~30s on the same commit — and a TimeoutExpired reads exactly like a real refusal.
  - >-
    PROPORTION AND SPLITTING, BECAUSE THIS GATE JUDGES ITS OWN TESTS. The descriptors below do
    not fit one module under a 400-counted-line limit. Split across focused modules sharing ONE
    fixture helper; the established shapes are _ge_127a_1_ordinary_commit_fixture.py (real `git
    commit` through a one-hook .pre-commit-config.yaml) and _ge_127c_1_scope_fixture.py. When a
    test module reaches the limit the precedent is SPLIT plus a shared fixture module, never an
    exemption.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around any read
    or subprocess used to establish what the change added; log at WARNING or higher or
    re-raise; no bare or blind excepts. THE SPECIFIC PROHIBITION: a failure to establish the
    count must NEVER degrade to zero. That is not a partial loss of function — it silently
    restores GE-127b exactly, for every file, on every commit, while every permitting arm of
    this record and of GE-127f-1 keeps passing. Route it to GE-127f-2-i's named refusal, which
    exists for precisely this failure.
  - >-
    COST BUDGET, BECAUSE THIS RUNS ON EVERY COMMIT. The added-line count may be established
    only for files already judged to stand above their permitted length; a commit that refuses
    nothing must do no added-line work at all and must not become measurably slower than today.
  - >-
    CANONICAL VERSUS BUILD OUTPUT, AND THE BUILD IS PART OF THE CHANGE. Edit
    templates/scripts/commit_guardian/ only — scripts/commit_guardian/ and the repo-root
    .pre-commit-config.yaml are untracked build outputs overwritten by build.py, and
    templates/commit-guardian/commit_guardian.json is a decoy. Re-run `python
    scripts/build.py --target-dir .`; config.py resolves the config beside the deployed script,
    so an unbuilt change leaves the running gate reading additions the old way while every
    source-tree test passes.
test_spec:
  - name: test_ge_127f_2_a_replacement_leaving_the_length_unchanged_is_refused_for_the_lines_it_put_in
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      In a real temporary git repository with the gate installed, establish a covered file
      standing at 600 measured lines against a permitted length of 400. Stage a change
      replacing five measured lines with five different measured lines, so the file still
      stands at 600, and run an ordinary `git commit`: the commit must not complete and the
      outcome must state that the change added five lines and that the file is required to
      stand at 595 or below. Repeat with 40 measured lines in and 40 out, still standing at
      600: refused, stating 40 added and 560 required. Both numbers are read from the process
      output. NAMED MUTATION (mandatory, run it, do not merely describe it — the BA's
      injection, carried verbatim): "compute the number of lines the change added as the
      file's net growth — the length after the change minus the length before it, floored at
      zero — instead of reading it from what the change put into the file." MUST GO RED: the
      five-line replacement arm and the 40-in-40-out arm. Under the injection both changes
      register as having added nothing, so both files are required only to stand where they
      already stood, and both commits complete when they must be refused. MUST STAY GREEN: the
      560 arm, the delete-only arm, and the unmeasured-content arm.
  - name: test_ge_127f_2_a_change_that_takes_out_more_than_it_put_in_commits
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      The same 600-line covered file with the same 40 measured lines in and 40 out, plus a
      further 40 measured lines taken out so the file stands at 560, commits cleanly. The
      fixture must reach 560 by whole constituent definitions leaving the file, never by
      deleting blank lines or hash comments — today's measurement rule counts both, so the
      cheap route would discharge the demand while improving nothing and would leave this arm
      proving less than it appears to. Assert the end length from the gate's own quoted number.
      This arm must STAY GREEN under the net-growth injection.
  - name: test_ge_127f_2_a_delete_only_change_commits_and_nothing_further_is_required
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      The same 600-line covered file with a change that takes 12 measured lines out and puts
      none in, leaving it at 588, commits and the outcome asks nothing further of that file.
      The twelve removed lines must be whole constituent definitions. This arm must STAY GREEN
      under the net-growth injection, and it is one of the two free cases the whole L1 rests on.
  - name: test_ge_127f_2_adding_only_content_the_measurement_rule_does_not_measure_is_free
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      The same 600-line covered file with a change that puts in content the measurement rule
      does not measure and takes nothing out, so the file still stands at 600, commits — the
      change added no measured lines, so the file is required only to stand where it already
      stood. THIS IS THE SURVIVING SHAPE OF GE-127b-1's DELIVERED BOUNDARY DESCRIPTOR and the
      visible face of the accepted docstring-only consequence, so the fixture must add a
      SUBSTANTIAL amount of unmeasured content, not a token line, and the test must say in its
      own description that an arbitrarily large addition of this kind is deliberately free. An
      implementation that quietly counts raw added lines instead of measured ones fails here
      for a reason that looks like an off-by-one and is not. Must STAY GREEN under the
      net-growth injection.
  - name: test_ge_127f_2_the_narrowed_ge_127b_1_boundary_descriptor_is_green_in_the_same_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      THE RECONCILIATION, MADE EXECUTABLE RATHER THAN LEFT AS PROSE. In the same run, the
      amended GE-127b-1 boundary descriptor — pinned to a change that adds no MEASURED lines to
      an already-oversized covered file and left at exactly its previous length — must be GREEN
      simultaneously with this record's first arm, which refuses the same end length when the
      change DID add measured lines. The two fixtures differ only in what the change put in,
      and both must be built and run here so the narrowing is observed rather than assumed. A
      run in which the delivered descriptor is red, deleted, or weakened to "at or below" fails
      this descriptor.
  - name: test_ge_127f_2_the_net_growth_injection_reds_both_replacement_arms_and_leaves_the_free_arms_green
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      THE MUTATION PROOF, RUN AS ONE EXPERIMENT AND RECORDED AS ONE RESULT. Apply the BA's
      injection once — "compute the number of lines the change added as the file's net growth —
      the length after the change minus the length before it, floored at zero — instead of
      reading it from what the change put into the file" — then run every arm above and record
      the outcomes together. REQUIRED OBSERVATIONS: the five-line replacement arm RED, the
      40-in-40-out arm RED, and the 560 arm, the delete-only arm and the unmeasured-content arm
      all GREEN. The green half is not decoration — a mutation that reddened everything would
      mean the arms were never independent, and AN INJECTION RUN THAT REDDENS EVERYTHING IS A
      FAILURE OF THIS DESCRIPTOR, NOT A STRONGER RESULT. EXPECTED COUPLING, WHICH IS NOT A
      FAILURE AND MUST BE REPORTED RATHER THAN SUPPRESSED: this injection ALSO reddens
      GE-127f-1's refusal arms, because every one of them leaves the file at or below its
      previous length and so registers as zero growth. Run GE-127f-1's arms under this injection
      too and RECORD that they went red, as declared. That direction of coupling is the point:
      GE-127f-1's own two mutations leave every arm of THIS record green, and the two facts
      together are what show the records are not duplicates — one owns the comparison, the other
      owns an input the comparison cannot check for itself. The injection must revert cleanly.
  - name: test_ge_127f_2_the_added_line_count_reaches_the_registered_hook_output_and_refusal_status
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      PRODUCTION ENTRY POINT. Run the gate through the registered hook path with the five-line
      replacement staged and assert the stated added-line count and the required length appear
      in the hook's OWN output stream, in the same per-file block as the length finding, under
      the ordinary finding exit status. An added-line count computed by a function nothing at
      commit time calls is inert, and a count computed correctly and then not consulted by the
      comparison is invisible to every assertion that does not go through this path.
  - name: test_ge_127f_2_the_deployed_copy_reads_additions_from_the_change_in_a_cold_process
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After build.py, the DEPLOYED copy of the gate and every module it imports load and run in
      a cold process, and both the five-line replacement refusal and the unmeasured-content
      allow arm hold against it. A module placed outside templates/scripts/commit_guardian/
      without a scripts/build_phases.py deploy-map entry surfaces here as ModuleNotFoundError
      rather than passing, and an added-line count written only into the canonical template and
      never built fails here instead of passing on source-tree greenness.
test_rationale: |
  Every descriptor performs an ordinary `git commit` over a real staged change in a real
  temporary repository and reads its assertions out of the process output and the commit
  outcome. Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by Grep" and this
  record's own doc_link, a test that calls an added-line-counting function directly stays green
  on a gate that computes the number correctly and then judges against the file's net growth
  anyway — which is the exact defect this record exists to exclude.

  The BA's named mutation is carried into a descriptor verbatim rather than restated. Its
  stay-green half — the 560 arm, the delete-only arm and the unmeasured-content arm — is
  preserved as a REQUIRED observation, and the separate mutation-proof descriptor exists so
  those greens are observed in the same experiment rather than assumed. The BA also declared an
  EXPECTED COUPLING: this injection necessarily reddens GE-127f-1's refusal arms, because an
  input read the wrong way makes any comparison vacuous. That coupling is preserved exactly as
  declared and is required to be REPORTED, not suppressed and not "fixed"; it is the asymmetry
  that justifies this record existing separately from GE-127f-1, whose own two injections leave
  every arm here green.

  The reconciliation descriptor is not bookkeeping. GE-127b-1 is delivered and green, and its
  boundary descriptor is narrowed rather than broken by this record; making the narrowed
  descriptor green SIMULTANEOUSLY with this record's first arm is the only way the narrowing is
  observed rather than discovered later as a mystery failure in a suite nobody expected to touch.

  The unmeasured-content arm carries the docstring-only consequence on its face deliberately.
  It is the honest result of counting additions in the file's own unit, it is the surviving
  shape of the delivered boundary descriptor, and writing it down as an executed, deliberately
  large case is what stops a future reader treating it as an oversight.
delivers_to:
  - agent: python-coder
    ac_id: GE-127f-1
    contract: >-
      The measured count of lines the staged change PUT INTO each already-oversized covered
      file — gross, never the file's net growth, denominated in the same unit and produced via
      the same measurement function as both lengths, and never derived by subtracting them.
      GE-127f-1 consumes this as the second operand of its end-state threshold and restates
      none of its definition. There must be ONE such count per file on the one existing outcome
      stream; a second derivation path added for either record leaves the other unconstrained.
  - agent: python-coder
    ac_id: GE-127f-2-i
    contract: >-
      The added-line count together with its own availability signal. GE-127f-2-i requires the
      step that establishes this count to be able to report its OWN failure to the caller — the
      account of the change unreachable, or reached and uninterpretable — as two distinct states
      that the caller can never mistake for a genuine count of zero. Do not design the count so
      that its only failure representation is the value 0.
expects_from:
  ac_id: GE-127b-1
  contract: >-
    The per-file before-versus-after comparison and the single shared measurement
    function it calls on both the HEAD blob and the staged content. This record adds one
    new input to that comparison — the measured lines the staged change put into the
    file — and requires it to be counted in the same unit by the same function, never
    derived by subtracting the two lengths the comparison already holds.
