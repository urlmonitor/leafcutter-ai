assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/workflows-js/build-feature.js
  n_location_rule: "2 -- the completion-write step in build-feature.js and the twin step in build-ticket.js. Both derive the demanded-step set, both must derive it the same way, and both must change in the same commit."
  required_skills:
    - python-coder
  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_bo_400e_1.py"
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_ticket_done_recording.py"
  constraints:
    - "VERIFY BY EXECUTION, NEVER BY GREP. Per CLAUDE.md 'Gate / Workflow ACs -- Verify Behaviorally, Not by Grep': the phase-list code, the completion prompt and the parity check are ALL already present in the source today, so a test that searches for any of them passes unchanged on the broken driver. Every test covering this record must load and run the real workflow script through unit_tests/prompt_assembly/harness_build_ticket_guard.mjs and assert on what the run wrote to the ticket record."
    - "THE DEMANDED SET HAS EXACTLY ONE SOURCE. No parameter, prompt field, request payload, environment value or configuration key may add to or subtract from the set derived from the ticket's own record. In particular the guarded script must NOT gain an exclusion parameter -- its absence today is load-bearing, and adding one satisfies the visible symptom by deleting the guard."
    - "DO NOT INTERSECT, DO NOT UNION, DO NOT FALL BACK. The three attempts in the criteria each close one reconciliation strategy: the narrowed list closes 'intersect the caller's list with the record's', the widened list closes 'union them', the absent list closes 'read the record only when no list was offered'. Any implementation that consults the caller's list at all fails at least one; the only implementation that passes all three never reads it."
    - "BO-400a-2-i AND BO-400a-2-ii ARE RATIFIED, NOT NARROWED. Neither the refusal rule nor its trigger may be relaxed, bounded, or given an exception to make this change fit. If the change appears to require softening either, the change is wrong."
    - "BOTH TWINS IN ONE CHANGE. build-feature.js and build-ticket.js declare each other twins in their own headers (BO-400a-2-ii's standing constraint). A landing in one alone produces a store in which epic drives and single-ticket drives disagree about which steps a close is checked against -- which is the same defect this record closes, relocated."
    - "THE DECISION MUST BE OBSERVABLE PER TICKET. The run must record, for each ticket it closes or refuses, which demanded-step set it decided against and which step was unaccounted for. Without that, the next divergent outcome is again indistinguishable from agent caprice, which is what made the original defect take two readers and a day to characterise."
    - "TEMPLATES ARE BUILD SOURCES, NOT THE RUNNING ARTEFACT. templates/workflows-js/*.js is deployed by the build into the workflow directory that actually executes. A change confirmed only against the source tree is not confirmed against what runs; keep the deployed copy in step (check-build-drift is the gate) and confirm the behaviour through the deployed layout before sign-off."
delivers_to:
  agent: python-coder
  contract: "A completion decision whose set of demanded steps is derived solely from the ticket's own record, with no parameter, prompt field, or request payload by which a caller can add to or subtract from it"
