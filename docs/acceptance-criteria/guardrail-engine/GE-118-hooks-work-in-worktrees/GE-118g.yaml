documentation_rationale: >-
  No new documentation is required and none may be substituted for the behaviour. The
  published procedure in docs/conventions/adr-numbering.md (section 3 Step 2, section 6)
  and docs/how-to/documentation/write-adr.md (section 10) are already correct AS WRITTEN
  for a tool that resolves its own repository — they prescribe the bare command with no
  directory argument, which is precisely what must start working. Closing this subtree
  makes the existing text true rather than creating a need for new text. The prior-art
  known-issue for this defect family records that "always run from the repo root" already
  exists as an instruction and has not prevented three recurrences, so a documentation
  arm here would be the known-ineffective fix wearing an acceptance criterion.
