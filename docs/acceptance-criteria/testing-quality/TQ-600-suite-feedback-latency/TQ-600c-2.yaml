notes: |
  THIS IS THE AC THE PARENT L1 SINGLED OUT AS MANDATORY. Its boundary states
  plainly that a child asserting "the budget check exists" or "the budget check
  passes" will be rejected, because this repository has three documented cases of a
  guard that reported clean forever while examining nothing. The over-budget input
  and the failing status are therefore in the criteria, where the it-po cannot
  substitute a weaker test for them.

  NAMING THE OFFENDERS IS WHAT MAKES THE GUARD WORTH HAVING, NOT DECORATION. The
  measured concentration is extreme — the top 60 of 5318 tests are 3404s, 63% of
  wall clock in 1.1% of the tests — so a short ranked list explains most of any
  overrun. A guard that says only "too slow" hands the next person the same
  multi-hour investigation that produced this goal, which is the cost it exists to
  prevent.

  NO NUMBER APPEARS IN THESE CRITERIA AND THAT IS DELIBERATE. "The budget in force"
  is whatever TQ-600c-3 records; this AC is about the guard's behaviour either side
  of that value. Writing a figure here would fix a budget against a baseline that
  does not exist yet, since it depends on what TQ-600a and TQ-600b recover.

  THE WITHIN-BUDGET CLAUSE IS NOT FILLER. A guard that always fails is as useless
  as one that always passes and is far more likely to be disabled. The two clauses
  together are what establish that the verdict is a function of the input.
