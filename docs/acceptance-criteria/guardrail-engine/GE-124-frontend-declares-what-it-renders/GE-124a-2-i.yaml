id: GE-124a-2-i
readiness: approved
priority: high
title: "A declaration written below the leading comment region does not satisfy the floor"
component: guardrail-engine
components:
  - frontend_coding
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124a.yaml"
criteria: |
  Given a staged `.tsx` file whose first tokens are its import statements
  And a `/** @ac UXP-607 */` comment appears further down, immediately above the
    exported component
  When the frontend declaration reader evaluates the file
  Then the file's declared criteria are recorded as the empty list
  And the file's declaration verdict is "missing"
  And the reported message names where the declaration must go — the leading
    comment region, above the first import — and quotes the comment that was
    found in the wrong place

  Given a staged `.vue` file whose `<!-- @ac UXP-100d-2 -->` comment is written
    inside its `<template>` block
  When the frontend declaration reader evaluates the file
  Then the file's declared criteria are recorded as the empty list
  And the file's declaration verdict is "missing"
  And the reported message names the required location — above the first
    `<template>`, `<script>` or `<style>` block
depends_on:
  - GE-124a-2
doc_links:
  - path: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124a-2.yaml"
    relationship: parent
