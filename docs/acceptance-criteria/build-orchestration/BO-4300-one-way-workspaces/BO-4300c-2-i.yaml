id: BO-4300c-2-i
title: "The maker never waits on a question, whatever the shared project or the caller's input does"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a main copy whose shared project is at an https address where nothing
    answers,
  And a caller that holds the maker's input channel open and never writes to it,
  When that caller requests a workspace, and separately asks to clear an existing
    workspace of that project,
  Then each request ends with one answer before the caller's time limit, the
    workspace request stating that the shared project could not be reached,
  And no prompt for a user name, password or passphrase appears on any channel,
  And when the caller has set its own command for reaching the shared project over
    ssh, the maker's requests to the shared project use that command unchanged.
depends_on: [BO-4300c-2]
