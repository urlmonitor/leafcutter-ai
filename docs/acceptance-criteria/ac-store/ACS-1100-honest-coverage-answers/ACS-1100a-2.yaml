notes: |
  This is the load-bearing AC of ACS-1100a. The word is INDEPENDENTLY, and it means
  independent OF THE QUERY'S FILTERS AND KEYS: a total drawn through the result pass's
  own filter reports 40 of 40 when the filter missed 140.

  "SAME PASS" WAS STRUCK (2026-08-13, expert review). The original text also forbade a
  total "produced by the same pass". That clause condemned the correct implementation:
  scan_ac_store.py's AC-YAML walk is a filter-free recursive glob that yields both the
  total and the results in one traversal, which is exactly right, and forcing a second
  traversal is precisely the duplication the ACS-100h-7a exemption exists to avoid. The
  test is now: does the total's derivation apply any filter, match key or join key that
  the result pass applies? A filter-free enumeration answers no, however many passes it
  is folded into.

  This also genuinely resolves the ACS-900e overlap — see the notes on ACS-1100a-3.
  Independence applies to the DENOMINATOR only; the rule applied to each individual
  record is untouched by this AC.

  GROUNDING (2026-08-13, expert review). The binding grounding scenario is now
  IN-COMPONENT: validate_ac_schema.py's zero-denominator directory pass. The two
  originally-named failures live in other components and read agent_telemetry.jsonl, so
  binding this AC to them would have let it go done against scan_ac_store.py alone while
  both named bugs stayed live. They are retained as clearly-labelled illustrations, and
  each needs its own AC in its owning component.

  ==========================================================================
  JOIN-KEY NORMALISATION IS A DENOMINATOR BUG (2026-08-18, BA).
  ==========================================================================
  Added on the strength of already-shipped behaviour, not speculation. KM-ADM-005's
  ratchet joins a filter-free rglob population against coverage tags, and it must strip
  quotes from identifiers before joining: a record written with a quoted id does not
  match the bare token a tag carries. Four records were counted as untagged before the
  strip was added — a four-record error in a figure that is now a build gate.

  WHY THIS AMENDS a-2 RATHER THAN ADDING AN L3. The existing criterion already forbids a
  total that "carries the same blind spot" as the query's own filters. A join that fails
  on presentation IS that blind spot, arriving through the KEY rather than through the
  FILTER, and the criterion already names match keys and join keys alongside filters. It
  is a normal-path property of every join this contract governs, not an exceptional
  input — an L3 would have made the general rule look optional and left the L2 reading as
  though only filters could poison a total. The parent L1's own note asks for it "carried
  into L2" (ACS-1100a notes, 2026-08-18 PO section).

  Boundary kept intact: this clause constrains how the population is MATCHED, never the
  RULE applied per record. The ACS-100h-7a exemption and the denominator-versus-rule
  boundary are untouched.

  The third added clause (state the normalisation in the method) is the seam to
  ACS-1100b-1: without it, two correct measurements of one population can still disagree
  and neither can be reproduced — which is the live TQ-400 / KM-ADM-005 disagreement in
  miniature.
