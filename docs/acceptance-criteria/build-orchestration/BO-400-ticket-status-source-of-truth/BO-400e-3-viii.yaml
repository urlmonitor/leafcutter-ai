notes: |
  Requested by BrainCandy 2026-10-15 (KI-BO-20260930).
  Decided by BrainCandy 2026-10-15: undeterminable halts before merge.
  Scenario order follows the evaluation order recorded in BO-400e-3-ii's notes: merge base
  first (unknown -> halt), then "changed nothing" (-> nothing to close, no halt, no built-for
  ticket needed), then the built-for ticket (missing -> halt).

  The "does not fall back" clause in the third scenario is the point of that scenario: the
  attractive recovery when the branch point is unknown is to compare against main's current
  tree or to scan the inbox, and both are exactly the defects BO-400e-3-ii removes.

  Deliberately NOT restated here: an unreadable or refused reply from the closing agent.
  That is FIN-100h's general rule (no covered_by children yet); the doc_link above records
  that Step 3.5 currently violates it (:1430-1432, :1458, :1677), so whoever decomposes
  FIN-100h should include this step.
