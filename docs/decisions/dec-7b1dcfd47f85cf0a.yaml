    title: Rename the step field human to description, holding one plain sentence of what happens, and add an actor_kind field
      (deterministic, jev, llm or human)
    description: 'The user''s answer: rename human to description, the text the Atlas shows for a step: one plain sentence
      of what happens, with no code paths, function names, build status or design notes; build status comes only from ACs;
      length and code-token gates; the generated contract text moves out of it and the Atlas renders contracts from io_contracts.
      Add actor_kind with the four mechanisms of ADR-053 (deterministic, jev, llm, human) next to the free-text agent name,
      so every step a human must do is visible. Existing flows are migrated by a script plus a cleanup pass.'
    assumptions: []
    evidence_ids: []
    proposed_by: human:user
    approved_by: human:user
