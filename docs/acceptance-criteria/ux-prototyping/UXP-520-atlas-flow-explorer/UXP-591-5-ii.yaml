id: UXP-591-5-ii
title: "Back and Forward return each flow entry as it was left"
component: ux-prototyping
components:
  - ux_prototyping
  - frontend_coding
level: L3
status: active
req_status: active
work_status: todo
readiness: reviewed
priority: medium
criteria: |
  Given the person opened a bookmarked /flows/leafcutter/deliver-a-feature, drilled into 'Build'
    (/flows/leafcutter/how-acs-are-built) and then into 'Coders make it green (prio 6-8)'
    (/flows/leafcutter/python-coder-internal),
  When they press Back twice and then Forward once,
  Then the view shows "How a ticket is built (the phase chain)" with the breadcrumb
    "Deliver a feature end-to-end > How a ticket is built (the phase chain)", then
    "Deliver a feature end-to-end" at /flows/leafcutter/deliver-a-feature with the breadcrumb
    "Deliver a feature end-to-end", then "How a ticket is built (the phase chain)" again with
    that same two-flow breadcrumb,
  And each time the address bar names the flow on screen,
  And an entry returns with the drawer its ?step= value names, as last set there by opening,
    switching or closing a drawer,
  And an entry returns with the Source, Kind and Realization filters it had when the person
    left it, together with the 'Outside the current filters' notice when that entry's filters
    exclude its entry flow,
  And Back onto an entry whose flow id is unknown, /flows/leafcutter/flow-render-pipline, shows
    the 'Flow not found' notice again with no flow drawn,
  And Back never steps through drawer openings, drawer closings or filter changes, since none
    of them added an entry.
depends_on:
  - UXP-591-5
  - UXP-591-4
  - UXP-591-1-ii
