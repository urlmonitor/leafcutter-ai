notes: |
  The parent L1 asks for three things in every refusal — what is unreachable, which
  side is missing, and the one action. This AC enumerates the four causes the tree can
  actually produce and fixes all three for each, because "the message is clear" is not
  testable and "these four messages say these things" is.

  WHY ENUMERATE RATHER THAN STATE A RULE. A single rule ("every refusal names the item,
  the side and the action") is satisfiable by one generic message with the item
  interpolated, which is what a hurried implementation produces: four causes, one
  sentence, and the reader still has to work out which of four different things went
  wrong. Enumerating forces the four to differ where they genuinely differ.

  THE SECOND CAUSE IS THE ONLY ONE WITH TWO ACTIONS, and that is deliberate rather than
  sloppy. Code with no way in genuinely has two legitimate resolutions — give it one, or
  exempt it — and hiding the second produces authors who cannot proceed and reach for
  the skip flag. The other three have exactly one correct action, and offering an
  exemption there would be actively harmful: it converts a five-minute fix into a
  permanent hole. This asymmetry is the substance of the AC.

  THE FINAL CLAUSE closes the most common convenience: printing the bypass flag in the
  failure output. A blocking guard that documents its own off switch at the moment of
  maximum frustration is an advisory guard. BO-2900b-1-i asserts this for the forward
  refusal specifically; this AC generalises it to all four so a later cause does not
  arrive without it.

  Verification must EXECUTE the guard once per cause and assert against the text it
  actually emitted. Asserting that a message template exists in the source proves
  nothing about which template is reached — the failure mode this whole tree is derived
  from.

  2026-08-13 (IT PO enrichment). The four causes are produced on TWO different surfaces
  (two in done_proof.py, two in the new check_reachability.py hook). The message
  composer is therefore required to be a single shared function imported by both — this
  is what makes BO-2900e-3's standing meta-check enforceable, since a fifth cause added
  on either side must go through the same composer to be emitted at all.
