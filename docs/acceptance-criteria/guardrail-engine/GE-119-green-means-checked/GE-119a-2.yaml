notes: |
  THIS is where the PO's explicit instruction lands: "Whether a cannot-run condition
  should also BLOCK is a per-check L2 decision — there is no blanket default." This AC
  does not pick an answer for the family; it requires that an answer exist, per check,
  recorded, with a reason, and that it actually govern behaviour.

  Why a recorded field rather than a code branch per check: the failure mode this tree
  addresses is 18 checks each quietly making the same wrong choice in private. A recorded
  set of dispositions makes the choices reviewable side by side, which is the only way
  the "18 instances of one defect" framing (GE-119b notes) stays true after the fix.

  IT-PO: an existing per-hook "mode" concept (error / warn) already exists in the hook
  manifest. Determine whether the cannot-run disposition is a second axis of that field or
  a distinct one — they are not the same question. "mode: warn" describes what the check
  does when it FINDS a violation; the disposition describes what it does when it cannot
  LOOK. A check can legitimately be warn-on-violation and block-on-cannot-run.
