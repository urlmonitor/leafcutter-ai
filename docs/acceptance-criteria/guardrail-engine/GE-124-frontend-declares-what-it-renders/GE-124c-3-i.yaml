notes: |
  The component's deliberate fail-open convention (approved as GE-116a-1-iii):
  one unparseable input must not block an unrelated commit. GE-120 does not
  repeal it — the line GE-120 draws is that failing open on ONE bad input while
  the check still ran is fine, whereas reporting success for a check that never
  ran is not.

  The last two clauses are what keep this from becoming a silent bypass. A file
  that is skipped and named can be fixed; a file that is skipped quietly is a
  permanent hole an author never learns about, and is the shape of a check that
  passes because it did nothing.

  Distinct from GE-124c-2-ii: there the RESOLVER is unavailable and no file can
  be judged; here one FILE is unreadable and the rest of the run is sound.

  IT-PO ENRICHMENT NOTE (2026-08-25). The tree now has three degrade paths that
  an implementer will be tempted to merge into one broad handler: this one (one
  file), GE-124c-2-ii (the store), and GE-124c-1's internal-error fail-open (the
  hook itself). Each has a different message and a different effect on the exit
  code; merging them produces a check that tells authors to fix the wrong thing.
