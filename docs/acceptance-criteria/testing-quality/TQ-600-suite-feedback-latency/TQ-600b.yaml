notes: |
  Authoring evidence (2026-09-21, origin/main 624d39ac):
    - 979 subprocess call sites across 349 of 667 test files; 94 `git init`
      calls. The workload is process-spawn-bound, which parallelises well.
    - pytest-xdist is NOT installed and NOT in requirements-dev.txt, so
      adopting it is a real dependency decision, not a config flip.
    - Collection is only 5.33s, so per-worker collection overhead is cheap.

  IMPORTANT BOUNDARY for the BA decomposing this L1: correctness under
  parallelism is the risk, not speed. Known collision sources that children
  must address rather than assume away:
    - tests that write to a FIXED /tmp path instead of a per-test tmp_path
      will collide across workers;
    - tests that run `git` against the REAL repository checkout share one
      index; two workers staging at once corrupt each other's state;
    - tests asserting on a shared sink (debugging/logs/*.jsonl) can see
      another worker's writes.
  A child that only asserts "the suite is faster with -n auto" is insufficient
  — equivalence of the VERDICT between serial and parallel runs is the
  criterion that matters. Pair the speed claim with an equivalence claim.
