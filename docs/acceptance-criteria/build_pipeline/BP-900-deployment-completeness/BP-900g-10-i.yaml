title: "A missing rule-declaring file is never replaced by a substitute rule"
component: build-pipeline
level: L3
status: active
req_status: active
readiness: draft
priority: critical
roadmap_phase: phase_1
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g-10.yaml"
criteria: |
  Given a guardrail whose verdict is defined by a rule it reads from a declaring file
    that ships with the install,
  And that declaring file being absent, unreadable, or unparseable in the install
    where the guardrail is running,
  When the guardrail is invoked against input it would otherwise judge,
  Then it stops and reports that the file defining its rule could not be read, naming
    the file and the location it looked for,
  And it judges the input against NO other rule — not one compiled into the
    guardrail, not a previously bundled default, not a stricter or looser variant,
    and not the last rule it successfully read,
  And it emits no per-input findings whatsoever, because a finding produced against a
    substitute rule reports a violation of something nobody wrote, and reads to its
    audience as a defect in their input,
  And the presence of an available substitute is not a reason to use one: a guardrail
    that HAS a built-in rule to hand is still required to stop,
  And when the declaring file is present, the guardrail judges the input against it
    and returns the verdict that file defines, so the fix is not a guardrail that
    refuses to run.

  Because on 2026-08-18 the AC-schema guardrail found its schema absent in a consumer
  install, silently substituted a stricter schema compiled into itself, and rejected
  920 of that consumer's 973 records against an identifier pattern their identifiers
  had never matched and were never required to match. What the consumer was told was
  "920 malformed identifiers". What was true was "one file is missing". The document
  type guardrail, in the same situation, refuses to substitute and says so — that is
  the behaviour this criterion generalises to every rule-declaring file.
