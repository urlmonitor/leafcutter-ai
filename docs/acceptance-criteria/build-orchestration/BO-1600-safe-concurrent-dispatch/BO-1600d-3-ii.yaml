estimated_complexity: S
it_requirements:
  - "After the refetch, verify the needed objects are now present; if origin did not supply them, classify the outcome as unrecoverable, report the specific unresolved objects, and STOP — a single fetch attempt, no retry loop."
  - "Do not delete objects that cannot be restored from origin; the unrecoverable path must never leave the store worse than the halted state."
  - "PORTABLE SURFACE: this unrecoverable-outcome guard lives in the same standalone recovery script (templates/scripts/git_recovery.py) pinned in BO-1600d-1/BO-1600d-4; ADR-001 deployed/template parity applies."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
