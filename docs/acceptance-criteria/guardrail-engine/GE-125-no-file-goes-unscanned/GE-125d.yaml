criteria: |
  Reduced protection is announced, never silent.

  Whenever the check gives something less scrutiny than usual, it says so and
  says which file and why — without repeating the value it declined to judge.
  A gap in your protection is visible while you are still working, instead of
  being found years later by someone reading the source.
