  Honest-limit rule, as for the kernel's context enrichment (unavailable is distinct from empty). A mining run that silently reads one source would quietly break the user's requirement that BOTH sources are mined.
  The same applies in the other direction (records unreadable, run history readable); one direction is pinned here as the concrete case.
