title: "diff-cover hook exits cleanly when the diff-cover tool or coverage artifact is absent"
component: guardrail-engine
level: L2
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-100-code-quality-hooks/GE-100.yaml"
criteria: |
  Given the commit guardian configuration has the diff_coverage section with:
    enabled: true
    strict: false
    min_coverage_percent: 80
    coverage_xml_path: "coverage.xml"
    max_age_seconds: 3600
  And the diff-cover binary is not present on the system PATH
  When the diff-cover hook runs at pre-commit time
  Then the hook exits with code 0 (fail-open)
  And it emits an advisory message to stderr stating that diff-cover was not found
  And the advisory includes installation guidance

  ---

  Given the diff-cover binary IS present on the system PATH
  And the configured coverage.xml file does not exist at the expected path
  When the diff-cover hook runs at pre-commit time
  Then the hook exits with code 0 (fail-open)
  And it emits an advisory message stating that coverage.xml was not found
  And the advisory includes guidance on generating the coverage artifact
