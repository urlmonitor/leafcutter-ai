criteria: |
  Given a reader wants to confirm a worktree's quality gates actually fire,
  When they open the how-to guide,
  Then it explains the four checks (binary, config, shared git hook, canary
    token), shows the command to run the probe against a worktree with the JSON
    output, and shows how to read the `failing_checks` list and the exit code.
  And it explains the silent-skip failure mode the probe defends against (a
    gitignored config symlink absent in a fresh worktree so pre-commit runs zero
    hooks) and how a FAIL verdict surfaces it.
