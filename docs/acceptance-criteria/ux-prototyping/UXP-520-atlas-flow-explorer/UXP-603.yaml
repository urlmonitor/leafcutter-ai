id: UXP-603
components:
  - ux_prototyping
  - frontend_coding
readiness: reviewed
priority: medium
title: "Each step/branch shows a compact, status-tinted done/total ACs progress pill"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: done
criteria: |
  Given a flow node (a step or a branch) that references one or more acceptance criteria,
  When the graph is drawn,
  Then that node shows a compact "done/total ACs" progress pill (for example "2/3"),
  And the pill is tinted by aggregate status: green when all referenced ACs are done,
  amber when some but not all are done, and grey when none are done.
