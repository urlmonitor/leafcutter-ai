id: TQ-600a-13-xxv
components:
  - testing_quality
  - knowledge_management
title: "A pull request declaring a fix for a red live-database lane proves it against a started database, and a skip there is not proof"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given that a red or did-not-complete post-merge run holds every pull request (TQ-600a-13-vi),
    and that once TQ-600a-13-xxi lands the run can be red because of the live-database lane,
  And that the only exemption from the hold is a declared fix whose proof run executes the
    current red run's failing tests against the pull request's head and passes
    (TQ-600a-13-viii, TQ-600a-13-xvi),
  And that a live-database test executed without a database skips, so a proof run that starts
    no database would "pass" every failing live-database test by skipping it and release the
    hold with nothing proven,
  When a pull request declares a fix for a post-merge run whose failing tests include one or
    more live-database tests, or whose live-database lane did not complete,
  Then the proof run starts the same disposable database instances as the live-database lane
    and executes those failing live-database tests against the pull request's head, with the
    same selection, build and strictness as the post-merge run,
  And for a run whose live-database lane did not complete, the proof run executes the whole
    live-database lane against the head and passes only if that lane is green by
    TQ-600a-13-xxi's, -xxii's and -xxiii's rules,
  And a live-database test that skips in the proof run, for any reason, is not a pass, and the
    proof does not pass while any such test skipped,
  And a proof run whose database never became healthy is reported as not proven, never as
    passed, and the hold stays,
  And a declared fix for a run whose failing tests are all correctness-lane tests starts no
    database, as before this change,
  And each of these is demonstrated by executing the proof's selection and judgement against
    a synthetic project in which a failing live-database test is made to pass, to fail and to
    skip at the head, and one in which the database is not started, never by reading the
    proof workflow for a service definition.
