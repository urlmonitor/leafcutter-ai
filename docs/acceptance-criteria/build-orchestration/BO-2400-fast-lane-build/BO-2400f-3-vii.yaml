notes: "Authored by /quick-fix. Root cause: (1) wvStep parses the whole reply.stdout with a strict JSON.parse; the step agent's stdout carried the script's stderr log line ('base ref HEAD: 0 names declared, 0 derived') ahead of the JSON, so parsing threw, the catch returned null and the halt message hid the actual reply. Fix: take the last line of stdout that parses as a JSON object, and on failure halt with the received reply quoted (never 'null'). (2) Two command strings run scripts by a cwd-relative `.leafcutter/scripts/...` path; anchor them to the workspace's absolute path the way the other fast-lane steps already do (workspace path + output root), quoted, so every step runs the workspace's own install (BO-4300a-1-ib: never a cwd-relative script path).."
