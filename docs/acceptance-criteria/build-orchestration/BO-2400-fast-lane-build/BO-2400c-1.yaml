criteria: |
  Given an agent prompt is assembled for a fast-lane invocation,
  When the assembled prompt is inspected,
  Then the static boilerplate (role, standing instructions, schema) appears before
    the cache breakpoint marker
  And all request-variable content (this batch's ACs, prior-phase outputs) appears
    after the cache breakpoint marker.
