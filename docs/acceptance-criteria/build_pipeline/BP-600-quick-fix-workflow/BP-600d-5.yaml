notes: |
  Authored by /quick-fix. Root cause: Phase 7 step 4 instructs the Close agent to ask the user for confirmation before opening a PR. In a background workflow run there is no interactive user to ask, so the agent takes the declined/unanswered path by construction and returns pr_opened=false with an empty pr_url. The terminal return at :1062 then treats that as an ordinary success: status is 'ok', the empty pr_url is passed through verbatim, and the not-opened state is rendered only as prose inside a report whose first line says 'complete.'. DESIRED: quick-fix should still NOT open the PR unattended — that gate is correct and outward-facing actions should stay behind it. What must change is that ending without a PR is reported as an EXPLICIT OUTSTANDING ACTION OWNED BY THE CALLER, not as an incidental empty field. The result must make it unmistakable, in a way a caller cannot skim past, that a PR was deliberately not opened and that opening it is now the caller's responsibility, and must carry what the caller needs to act — the branch, and the compare URL or the exact command. A caller reading only the structured result, without reading the prose, must still be able to tell that an action is required of them. CONSTRAINTS: (1) Do NOT make quick-fix open a PR unattended — the confirmation gate is deliberate and must survive. (2) The existing already-a-PR-exists path and the push-failed 'blocked' path must be unchanged. (3) Do NOT regress the case where a PR IS opened — that must still report cleanly as done. (4) DUAL-SURFACE RULE, read this before deciding scope: templates/workflows-js/quick-fix.js and templates/skills/quick-fix/SKILL.md are two real surfaces of the same workflow, and the skill file states explicitly that a behavioural change must land in BOTH — 'a change made only in the JS leaves this file lying to the next reader.' SKILL.md Phase 7.4 currently carries the matching prose. This may put the change over quick-fix's own one-file constraint and trip the Phase 3.5 scope-expansion gate; that is expected and is flagged deliberately rather than discovered. Judge it: either handle both surfaces as a declared expansion, or change the JS and report the SKILL.md mirror as a required follow-up — but do not silently leave the two disagreeing. (5) Verify behaviourally: assert on what a run actually returns in the no-PR case, not on the presence of a string in the source.
