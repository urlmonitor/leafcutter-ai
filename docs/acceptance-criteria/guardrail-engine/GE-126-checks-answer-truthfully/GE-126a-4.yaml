id: GE-126a-4
title: "The written procedure for interrogating a check yourself is one you can follow and trust"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader who wants to confirm for themselves that a check would refuse a
    particular piece of work rather than trusting an exit code,
  When they follow the documented procedure for interrogating a check end to end,
  Then the procedure tells them how to name the record they want examined by both
    routes the check honours — the command line and the environment seam — and states
    that a target named and not resolved is reported rather than passed,
  And it tells them how to distinguish the three answers they can receive: the work was
    refused the work was examined and found clean or the check could not examine the
    work it was named,
  And it states in the reader's own terms that an exit code alone has never been
    sufficient evidence and names the outcome value they should read instead,
  And the worked example the procedure contains is a record that genuinely violates a
    rule together with the refusal it produces so a reader who copies the example sees
    a refusal rather than a pass,
  And the earlier advice that a silent run means a clean run is removed from the
    documentation rather than left standing beside the new procedure.

  Coverage note: covered by executing the worked example in the procedure verbatim
  against the deployed check and asserting the documented refusal is the one produced.
  A test that asserts the document merely mentions the procedure does not cover this
  criterion — a sentence nobody executes is the documentation form of a check that
  never runs.
