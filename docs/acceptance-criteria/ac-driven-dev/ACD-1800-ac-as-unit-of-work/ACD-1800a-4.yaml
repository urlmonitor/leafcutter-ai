notes: |
  THE GAP. ACD-1800a-1 fixes the deliverable-kind enum at
  {code, tests, docs, diagram, config}. Product-truth artifacts -- flows
  (`*.flow.json`), mockups (`*.mockup.json`) and mock data (`*.mock.json`) under
  docs/product-truth/ -- fit none of those, so a requirement that must produce a
  reviewed journey cannot say so. The user named flows explicitly as something a
  requirement has to account for. This L2 adds the missing kind.

  THE TRAP, AND WHY THE FOURTH THEN CLAUSE IS THE WHOLE AC. Adding `flow` to the
  enum as a plain deliverable kind creates a STATUS CYCLE. Verified in both
  schemas:
    - config/ac_store_schema.json ~line 637-691: `product_truth` is a TOOL-OWNED
      DERIVED back-reference, "GENERATED by
      docs/product-truth/scripts/generate_product_truth.py as the inversion of
      every flow step/branch whose `implements` list contains this AC id -- NEVER
      hand-edited. The authored link direction is flow->AC (step.implements)".
      The product-truth validator "errors on any mismatch against the by_ac
      inversion".
    - docs/product-truth/schemas/flow.schema.json ~line 43: `implements` is the
      "AUTHORED link -- the source of truth for graph<->AC linkage"; ~line 45:
      `impl_status` is "DERIVED from work_status of every AC in `implements` ...
      Regenerated by the impl-status generator; never hand-edited".
  So: flow.impl_status <- AC.work_status. If the AC's completeness then depended
  on the flow step's impl_status, we would have AC.work_status <-
  flow.impl_status <- AC.work_status -- a requirement that can never become
  complete, or worse, one that latches complete on its own echo.

  THE RESOLUTION, STATED PRECISELY: the deliverable is DECLARED by the author
  (third Then clause), and its evidence is the STRUCTURAL fact that a flow node's
  `implements` names this AC (fourth Then) -- which is exactly what the existing
  derived `product_truth` back-reference records. Presence of the link is the
  proof; the linked node's PROGRESS is explicitly excluded. That reads the
  derived field for its link content while never reading its status, which cuts
  the cycle at the only place it can be cut.

  TWO DIRECTIONS, NOT ONE FIELD DOING DOUBLE DUTY (second Then clause). The
  authored obligation ("this requirement owes a journey") and the derived
  back-reference ("these journey nodes reference this requirement") must stay
  separate keys. Merging them would make `product_truth` hand-editable, which the
  schema forbids in terms, and would break the product-truth validator's
  by_ac-inversion equality check on the first hand edit.

  KIND VOCABULARY: the new kind should cover the product-truth family (flow,
  mockup, mock data) rather than `flow` alone -- all three share the same authored
  direction and the same store, and adding them one at a time repeats the
  three-orphaned-triggers pattern documented on ACD-1800f. Whether that is one
  kind with a sub-type or three kinds is an IT PO decision.

  INHERITED CONSTRAINTS FROM ACD-1800a-1, which apply unchanged: validate the
  extended enum at EVERY enforcement point that gates commits --
  scripts/commit_guardian/check_ac_schema.py plus its manual-validation fallback
  scripts/commit_guardian/_ac_schema_validators.py, mirrored by
  scripts/ac_store/validate_ac_schema.py; a rule added only to the JSON schema is
  a partial/no-op gate. Each checklist item also carries a `craft` that must
  resolve to a real agent id in config/agent_registry.json -- for this kind that
  is the flow/mockup/mock-data authoring craft, not a coder. Tolerant reader:
  absence of the checklist is legacy mode, derive/skip, never fail (ADR-026 rule
  4). Canonical source only -- config/ac_store_schema.json and
  scripts/ac_store/*.py, never a deployed .claude/ copy (ADR-001).

  FIFTH THEN CLAUSE is the no-regression clause: this must be purely additive for
  the overwhelming majority of requirements that produce no product-truth
  artifact, or it collides with ACD-1800a-2's checklist-vs-change-surface
  validation and ACD-1800a-2-i's missing-kind reporting.

  TESTABILITY. Author a real requirement declaring the deliverable, add a real
  flow node whose `implements` names it, regenerate, and assert the deliverable
  reads as delivered. Then set that flow node's impl_status to not_started and
  assert the deliverable STILL reads as delivered -- that second assertion is the
  cycle test and is the one that fails on the naive implementation.

  2026-08-17 (IT PO enrichment). The deferred vocabulary decision is made, and
  one further derivation path is added to the cycle analysis.

  - ONE KIND WITH A SUB-TYPE, NOT THREE KINDS. All three product-truth artifact
    families share one store, one authored direction (artifact -> AC) and one
    evidence mechanism (`implements` membership). Three sibling kinds would mean
    three enum entries, three craft mappings and three satisfaction predicates
    that must stay identical by discipline alone -- which is precisely the shape
    ACD-1800f records going wrong, where near-identical declaration slots were
    added separately and two of the three ended up wired to nothing.

  - THE CYCLE HAS TWO EDGES, NOT ONE. The BA's analysis correctly identifies
    flow.impl_status <- AC.work_status via `implements`. Verified additionally at
    docs/product-truth/schemas/flow.schema.json: a step may carry `expands_to`,
    and when it does, that step's impl_status is derived from the CHILD FLOW's
    rollup, TAKING PRECEDENCE over `implements`. An implementation that carefully
    avoids the implements-derived status can still read the rollup-derived one and
    reintroduce the cycle one level down. Hence the positively-stated rule (read
    `implements` membership only; never read impl_status on any path) and a
    dedicated third test, rather than a prohibition that enumerates one path.
    Note `expands_to` is defined on STEPS only, not on branches -- a branch has
    just the one derivation path.

  - A HELPFUL VERIFIED FACT FOR THE IMPLEMENTER: the derived `product_truth`
    back-reference on the AC carries NO status field at all -- its item shape is
    {flow, node, node_kind, flow_kind, screen, mock_data, entities, source, asof}.
    Reading it is therefore structurally incapable of closing the cycle, which
    makes it the safe evidence source and makes "walk the flow JSON yourself" the
    risky one. That asymmetry is not obvious from the criteria and is recorded in
    it_requirements as a preference rather than a mandate.

  - FAIL CLOSED ON AN UNREADABLE EVIDENCE STORE. Not in the criteria, but the
    omission is load-bearing: the evidence read crosses a filesystem boundary, and
    the natural except-and-continue would resolve a missing flow artifact to the
    same value as a present one under a truthy check. A product-truth deliverable
    marked done because its evidence could not be read is a false green of exactly
    the kind ACD-1800f exists to prevent.

  - AUTHORING NOTE ON it_requirements PROSE: the product-truth generator, the
    product-truth validator, the flow schema and the agent registry are READ-ONLY
    references for this AC, so they are named in words in it_requirements and by
    path only here and in doc_links. `_build_files_touched()` scrapes slash-bearing
    tokens out of it_requirements prose into the generated ticket's declared change
    surface, and declaring a tool-owned generator as editable is precisely the
    wrong signal to hand a scope reviewer.
