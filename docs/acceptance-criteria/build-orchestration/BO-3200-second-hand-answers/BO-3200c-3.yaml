notes: |
  The parent L1 states this as the distinction the BA must make explicit: "'no answer
  available' and 'the user answered no' are different outcomes with different consequences,
  and they were collapsed into one. They must remain distinguishable at every gate, not just
  the three that were patched."

  "AT EVERY GATE" IS THE LOAD-BEARING PART, and it is why the criterion enumerates the points
  rather than naming any. PR #565 patched three of them. A criterion written against those
  three would be satisfied on the day it landed and would say nothing about the fourth, which
  is the same partial-coverage shape that let the prompt-level fix rot: building-epics §2.1-R1
  was in force for the agent that loaded it and had nothing to say about the one that stalled.

  THE THIRD SCENARIO IS WHAT STOPS THIS BEING A LABELLING EXERCISE. Two outcome names that lead
  to identical behaviour are one outcome with two spellings, and the original defect — a
  refusal resolving to the one answer that throws work away — would survive it untouched.
  Asserting the different consequences ties the distinction to the damage.

  Verification must drive each real gate into both states. A test that reads a gate's outcome
  vocabulary passes on a gate that never produces one of the values.

  IT-PO ENRICHMENT NOTE (2026-08-26). The one-vocabulary requirement is added because the
  criteria permit per-gate outcome values as long as the two differ AT that gate. That would
  satisfy every scenario here and would defeat BO-3200c-3-i, whose check has to compare a newly
  added gate's outcomes against the established pair; incomparable per-gate spellings make the
  durability check vacuous. The no-answer value is also the same concept BO-3200e names, and must
  be the same word — a third spelling of "could not tell" in this tree would be self-defeating.
