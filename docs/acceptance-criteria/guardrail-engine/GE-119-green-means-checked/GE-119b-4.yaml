notes: |
  The parity claim at family scale. GE-119b-1 and GE-119b-3 fix the two OBSERVED instances;
  this AC is what makes the L1's promise ("same work, same verdict, whichever copy you are
  in") true of the sixteen that were never tested rather than of the two that were.

  THE FIXTURE IS THE HARD PART, and it is deliberately in the criteria rather than left
  implicit. A sweep run against a clean fixture passes trivially: every check agrees, because
  every check finds nothing in both copies — including a check that has silently stopped
  running altogether. The fixture must provoke a real violation per check for the comparison
  to carry information. Shared with GE-119b-2-i; build it once.

  DIVISION OF LABOUR with GE-119c-3: this AC owns the VERDICT-AGREEMENT assertion; GE-119c-3
  owns the MANIFEST-COVERAGE assertion (no check may opt out by omission). They are stated
  from both directions on purpose — the sweep's own completeness is exactly the property that
  a silent-pass culture erodes first.
