  contract: "A human-invoked recovery entry point that (a) is never called by the automatic drive loop or the BO-1600c halt path, and (b) performs no repository write before explicit human confirmation. This entry point is the shell that the dry-run-first plan/confirm behavior (BO-1600d-2) and the recovery-step engine (BO-1600d-3) are wired into."
