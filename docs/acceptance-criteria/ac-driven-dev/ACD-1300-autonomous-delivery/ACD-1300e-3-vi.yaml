  contract: >-
    The statement the run's terminal result carries for an uncleared pause record, quoted in the
    resume how-to by ACD-1300e-4-i: it names the clear step and the agent that declined it (or the
    clear's error output), quotes the stated reason (up to 2 KB), gives the record's absolute
