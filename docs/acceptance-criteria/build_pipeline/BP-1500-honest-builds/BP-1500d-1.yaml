id: BP-1500d-1
components:
  - build_pipeline
title: "The record of what was installed is written into the project that received it, and accounts for that project"
component: build-pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
criteria: |
  Given a project directory that is neither the producing package nor anywhere inside
    the producing package's own parent folder,
  When a real build is run against that project and the resulting tree is inspected,
  Then a record file is written into that project's own tree, so that project holds its
    own record of what the build put there,
  And the record's entries name the artifacts that are actually present in that project,
    so the record is an account of THAT install and of no other,
  And the record is reachable from inside that project alone -- a copy of the project
    taken without the producing package still carries it, so a consumer who never has
    the producing package to hand still has a record,
  And the inspection is demonstrated to FAIL, before it may be accepted as passing, on
    each of two deliberately non-portable installs: one where the record was filed with
    the producing package instead of the receiving project, and one where the receiving
    project's record is present but accounts for nothing -- because an inspection that
    stays green on a record filed in the wrong place, or on a record that names nothing,
    has not been shown to run at all,
  And the same inspection returns a clean result on the good install both before and
    after those two deliberate breakages, so each red is attributable to the breakage
    and not to a fixture that was already broken,
  And every verdict is reached by inspecting the receiving project's tree after a real
    build into it, never by reading the build's own source for the presence of a
    record-writing step.
depends_on:
  - BP-1500d
