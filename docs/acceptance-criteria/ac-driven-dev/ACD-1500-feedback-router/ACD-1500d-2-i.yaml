it_requirements:
  - "When the per_run_artifact_cap (config/feedback_router.yaml) is hit mid-run, remaining eligible entries must be parked (left unresolved, no resolve_feedback.py call) so the next run picks them up, NOT processed or dropped"
  - "The run must end cleanly with a summary stating artifacts-created count and entries-deferred-due-to-cap count"
  - "Deferral due to cap must be distinguishable in the summary from parking due to low confidence or blocker"
