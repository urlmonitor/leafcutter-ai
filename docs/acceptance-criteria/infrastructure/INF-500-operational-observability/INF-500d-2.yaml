notes: |
  COLLAPSED FROM AN EITHER/OR ON 2026-08-13. This AC previously offered the
  implementer a choice: (a) implement the sentinel as "every ticket-phase agent", or
  (b) remove it and reject it at load time. That was wrong for two reasons and the
  choice has been made for (b):

    1. It was unbuildable as written. An unresolved either/or gives test-writer no
       red test to author — it would have to guess which branch ships, and half its
       tests would be discarded.
    2. Branch (a) was actively harmful. It defined the catch-all as "agents the
       roster marks as a ticket-phase agent", a predicate that (measured
       2026-08-13) excludes epic-supervisor and ticket-supervisor, both of which are
       permitted writers today of tooling-issue, convention-ambiguity and blocker.
       Shipping (a) would have revoked six live writer permissions. See INF-500d-1's
       notes for the full measurement.

  Once INF-500d-1 derives the general-purpose writers from the live roster, the
  sentinel has no remaining job: the thing it was documented to do now happens
  automatically and without a sentinel. Removal is therefore the cheaper resolution
  AND the correct one.

  Removing it from the documentation is only half the job — the second scenario is
  the other half. Without the load-time rejection, a future author who copies the
  sentinel from an old ticket or an archived config silently re-introduces the
  no-op, and the third scenario (documented vocabulary equals honoured vocabulary)
  goes quietly false again.

  Evidence on 2026-08-13: the sentinel is documented in the configuration header, is
  used by zero categories, and appears nowhere in the submission path. It is a
  switch that reads as protection and provides none.

  The third scenario is the durable invariant and is the one worth a permanent test.
  It holds regardless of how the sentinel question was resolved and should outlive
  this AC's removal work.
