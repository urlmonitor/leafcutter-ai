title: "Registry entry has DSL trigger conditions matching agent/skill template file patterns"
component: build_pipeline
level: L2
status: active
req_status: active
work_status: done
criteria: |
  Given config/agent_registry.json is loaded,
  When the llm-expert entry's selection_criteria.trigger_conditions array is inspected,
  Then it contains at least one entry with type "dsl" whose expression matches:
    - files_touched containing "templates/agents/*.md"
    - files_touched containing "templates/skills/*/SKILL.md"
    - files_touched containing "templates/workflows/*.md"
  And it contains at least one entry with type "llm" whose expression describes:
    - ticket adds or modifies an agent template, skill body, or slash-command workflow
  And it contains at least one entry with type "llm" whose expression describes:
    - ticket requires applying the Prompt-Quality Checklist
