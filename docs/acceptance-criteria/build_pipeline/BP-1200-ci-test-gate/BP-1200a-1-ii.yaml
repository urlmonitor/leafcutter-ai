id: BP-1200a-1-ii
title: "No test fails at collection time because a build-generated dependency is missing from the fresh clone"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a brand-new checkout in which the locally-generated build outputs are not
    present (the kind of generated tooling directories that a plain clone omits),
  When the documented CI test command is followed through to running the full
    suite,
  Then no test is reported as an error during collection or startup due to a
    module or file it imports or opens being absent
  And every test that previously failed only because such a generated dependency
    was missing now runs and reports a pass
  And the count of tests that error before they can execute is zero.
