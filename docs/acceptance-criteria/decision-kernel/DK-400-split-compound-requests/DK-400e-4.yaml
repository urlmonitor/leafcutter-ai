notes: |
  User decision (DK-400 Q5). "Cannot be settled" covers its decision ending blocked, hitting a
  capability gap, reaching a budget stop, or being cancelled.
  OPEN (reported): the run's final status in this case. The AC requires only that it is not
  completed; partial is the likely default.
  PRODUCT-TRUTH GAPS (flow and mock data): the flow has no branch for a failed part; the outcome
  enum has no value for a part that ran but did not settle (not_run would be untrue); and the
  Decomposition state machine has no ending for this case.
