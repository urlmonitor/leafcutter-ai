title: "The component diagram shows one verdict source with three checkers over three populations"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the done-proof machinery comprises a single per-record verdict source, a
    commit-time check over the records staged for a commit, a change-time gate
    over the records altered in a proposed change, and the whole-store sweep,
  When a reader who has not seen the code opens the component diagram for
    done-proof,
  Then the diagram shows all four, and shows the three checkers as callers of the
    one verdict source rather than as three independent judges of the same
    evidence,
  And each checker is labelled with the population it evaluates, so a reader can
    say which finished records a given checker would never look at and therefore
    which failure each layer is incapable of catching,
  And the diagram shows the durable inventory the sweep leaves behind and the
    consumers that read it — the cadence report and the triage list — so a reader
    can say which downstream figures are derived from a single run and which are
    independently re-derived from the store,
  And a reader can answer from the diagram alone which element would have to
    change to alter a verdict, and which would have to change to alter the set of
    records that is checked, and see that those are different elements,
  And the arrangement drawn is the one in the repository at publication: the
    verdict source, the commit-time check and the change-time gate shown are the
    ones that exist and are named as they are actually reached, with nothing drawn
    as present that is not,
  And any element introduced by this work rather than already running is
    distinguishable as such, so a reader cannot mistake the diagram for a record
    of what is live today.
