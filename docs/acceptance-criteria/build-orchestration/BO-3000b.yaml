    angle: real_artifact
    surface_invoked: templates/workflows-js/build-ticket.js
    description: "The three cases above run against PHASE_RESULT_SCHEMA extracted from build-ticket.js and produce the same verdicts and error sets as build-feature.js."
test_rationale: |
  The defect lives entirely in what a JSON-Schema validator reports for one reply shape,
  so the proof must run a real validator over the real schema object as the workflow
  declares it — extracted by evaluating the JS, not by regex over its text. A source
  scan for `required` inside `if` would pass a fix that put it in the wrong object. The
  failure entry is paired with the criterion entry because the cheapest wrong fix is to
  delete the conditional, which silences the misleading error by also dropping the
  BO-3000a handoff_target requirement. The twin entry exists because the two drivers
  declare the schema independently and have diverged before.
