it_requirements:
  - >-
    Kind decision (IT PO): a new kind report_says_stopped_before_database in scripts/evals/produced_tests_reports.py,
    registered in its KINDS (:143-150) so it falls under the TQ-200d-1-ii registry drift test. It passes when no
    clause claims the database tests ran or connected to a database, and the report holds either a not-run phrase
    (NOT_RUN_RE :25-29, unchanged) or a stopped-before-the-database phrase: the tests stopped / raised / went red
    / failed 'before any connection' (is attempted), 'before ever reaching' the database code, 'did not run against
    a database', 'never reached the database', or no connection was made/attempted. Lines that quote the red verification
    run (a unittest/pytest summary such as 'Ran 2 tests in 0.004s', 'FAILED (errors=2)', 'N failed', 'red, exit
    code 1') are not read as a claim that the database tests ran, and on their own they are not a stopped-before-the-database
    phrase (clause (c)). A clause saying the tests ran and passed, or connected to a (test) database, fails the
    kind.
  - >-
    report_says_not_run (:105-112) and the shared helpers it uses (_claims_run :59-64, CLAIM_RE, NOT_RUN_RE) keep
    their behaviour exactly; the new kind may reuse them but must not change them. In scripts/evals/sets/test-writer.jsonl
    only the row missing-setting-database-work (line 7) changes: {"kind": "report_says_not_run"} becomes {"kind":
    "report_says_stopped_before_database"}; its other three checks stay. scripts/evals/sets/test-runner.jsonl is
    not changed. The recorded test-writer gold report (which says the database test 'was not run') still passes
    through the not-run branch.
  - >-
    Unit tests never call a live model; they score recorded outputs and probe fixtures only. Kept live outputs are
    copied by the test-writer from the kept-outputs folder of the 2026-11-02 runs (<session scratchpad>/kept_runs/run1|run2/<set>/<row>/,
    local to the run machine, as the known issue names it) into unit_tests/evals/fixtures/tq200d-rerun/<set>/<row>/run1|run2/
    as flat '<name>.py.recorded' files plus report.md (and transcript.jsonl where the row reads commands), the gold-output
    form place_outputs reads, so a bare pytest never collects them. Absolute local paths in a copied file (for example
    a sys.path line naming a user temp folder) are replaced with a neutral placeholder and nothing else is changed.
    No committed file names the scratchpad path. If another TQ-200d re-run AC has already created a needed fixture
    file, it is reused, not copied again. Probe fixtures for this AC: test-writer/missing-setting-database-work/run1
    and run2 (report.md and test_refresh_totals.py.recorded; the test file holds a local user path that is neutralised).
    The copies without the 'before any connection is attempted' (run1) / 'before ever reaching `refresh_totals()`'
    (run2) sentence are built by the test.
  - >-
    Every changed .py file stays at or under 400 counted lines; run_agent_eval.py is not touched and does not grow;
    no new module is added at the top of scripts/evals/. unit_tests/evals/ is at its density cap, so this AC's tests
    go in their own subfolder (named in test_spec) with an __init__.py, like unit_tests/evals/tq200d1ii/. Tests
    go in unit_tests/evals/tq200d4vi/. produced_tests_reports.py is 150 lines today.
  - >-
    DOCUMENTATION (part of done) - docs/reference/produced-tests-eval-assertion-kinds-database-setting.md gains
    a '### `report_says_stopped_before_database`' entry in the seven-part format: Used by the test-writer set, row
    missing-setting-database-work; Reads the hand-off report clause by clause; Passes when / Fails when as above,
    including that the red verification-run lines are neither a run claim nor enough on their own; Passing example:
    the run1 probe report (named by its fixture path); Failing example: the same report without its 'before any
    connection' sentence, and 'The database tests ran and passed.'; Template sentence: '> Required outcome: non-zero
    exit code (tests MUST be red).' followed by '- templates/agents/test-writer.md' (a sentence the test-writer
    template holds; the verbatim text inside the bold markers of Step 4), not the test-runner sentence. The report_says_not_run
    entry's 'Used by' becomes the test-runner set only. The page (241 lines, 14 headings) stays within 300 lines
