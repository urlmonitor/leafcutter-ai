title: "Know exactly which tickets are in progress, done, or waiting — without moving files around"
component: build-orchestration
level: L0
status: active
req_status: active
work_status: todo
criteria: |
  Given an epic with multiple sub-tickets at various stages of completion,
  When a supervisor or operator needs to determine ticket state,
  Then the ticket's own YAML frontmatter `status:` field is the single source of truth,
  And no file-system operation (folder move) is required to express state transitions,
  And the backlog, in-progress view, and archive check all derive state from the same field,
  So that parallel worktree branches never conflict on folder structure.
