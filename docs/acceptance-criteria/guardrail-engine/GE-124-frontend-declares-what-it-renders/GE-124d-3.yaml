assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "RESOLVE THE VERDICT ONCE, IN ONE PLACE, BEFORE ANY FINDING IS EMITTED. Implement the escapes as a single verdict-resolution step that takes (base verdict, warn-listed?, accepted reason?) and returns ONE verdict, rather than as two independent downgrade passes over an emitted finding. Two passes can each write, and the mock-data invariant is absolute: verdict == 'block' implies suppression_reason == null."
  - "PRECEDENCE IS OPT-OUT > WARN > BLOCK, encoded as an explicit ordered rule with the reason recorded next to it, not as the incidental result of the order two if-statements happen to appear in. USER CONFIRMATION NEEDED: the BA chose opt-out over warn on the grounds that a stated reason is more specific and more accountable than an area-wide postponement, and that resolving to warn would discard something a reviewer could challenge. The alternative (warn wins) is defensible. This is not stated in the PO note or in the mock data — confirm at the final gate rather than absorbing it."
  - "A REFUSED OPT-OUT (GE-124d-2-i) IS NOT AN OPT-OUT for precedence purposes. The input to the precedence rule is 'accepted reason?', not 'marker present?', so a file with a refused marker on a warn-listed path resolves to warn, and one on an unlisted path resolves to block."
  - "suppression_reason IS POPULATED EXACTLY WHEN THE RESOLVED VERDICT IS pass-with-reason and is null for every other verdict. That biconditional is the mechanical form of 'never sits beside it' and is the cheapest thing to assert in a test."
  - "THIS AC AND GE-124c-1-i ARE DIFFERENT RULES: that one fixes the COUNT of findings at one per (subject, code); this one fixes which single VERDICT that finding carries. An implementation can satisfy either while breaking the other — one finding with a contradictory verdict, or two findings each with a defensible one."
delivers_to:
  agent: python-coder
  contract: "A single resolved verdict per (file, code) produced by one verdict-resolution step from (base verdict, warn-listed?, accepted reason?), with the explicit precedence order opt-out > warn > block and suppression_reason populated if and only if the resolved verdict is pass-with-reason. Consumed by the commit report and by GE-124c-1-i's cardinality rule."
expects_from:
  ac_id: GE-124d-2
  contract: "The accepted-reason signal (accepted, not merely present) and the pass-with-reason verdict whose exclusivity against block this AC fixes"
test_spec:
  - name: test_ge_124d_3_accepted_reason_yields_pass_with_reason_and_no_block_for_the_same_pair
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "Exactly one verdict for the (subject, code) pair, equal to 'pass-with-reason', and no block verdict recorded anywhere for that pair. Assert the absence of the block explicitly — the invariant is about coexistence, which a single-verdict assertion does not cover."
  - name: test_ge_124d_3_warn_listed_and_reasoned_file_resolves_to_pass_with_reason_naming_the_reason
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "A file both warn-listed and carrying an accepted reason resolves to a single 'pass-with-reason' verdict whose report line names the reason. This encodes the precedence decision that is flagged for user confirmation; if the user chooses warn-wins, this test is the one line that changes."
  - name: test_ge_124d_3_suppression_reason_is_populated_iff_the_verdict_is_pass_with_reason
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: seam
    description: "Across all four verdict values produced over a mixed staged set, suppression_reason is non-null exactly for pass-with-reason and null otherwise. A biconditional over the whole finding set catches the coexistence bug from both directions in one assertion."
  - name: test_ge_124d_3_a_refused_reason_on_a_warn_listed_path_resolves_to_warn_not_pass_with_reason
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: boundary
    description: "A file with a placeholder ('N/A') opt-out marker on a warn-listed path resolves to 'warn'. The precedence input is an ACCEPTED reason, not a present marker; an implementation keyed on marker presence turns a refused opt-out into the strongest escape in the system."
test_rationale: |
  The invariant is about coexistence and precedence, so single-verdict assertions are the wrong
  instrument — each test asserts either the absence of the competing verdict or the biconditional
  over the whole finding set. The fourth test is the one the criteria do not reach: precedence
  takes an ACCEPTED reason as its input, and an implementation keyed on marker presence would
  make a refused, empty opt-out outrank a warn listing, turning GE-124d-2-i's refusal into the
  strongest escape in the tree. That is a composition bug between two ACs and it is only visible
  when both are exercised together, which is why it lives here rather than under either parent.
origin_agent: business-analyst
