title: "A requirement may declare the exact replacement for a named wrong version; a declared replacement always wins over a pinned or prepared one and is checked the same way"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given test T1's entry on requirement TQ-9101 names must_catch
    "propagation that reaches only one level deep" and
    "drop the _lc_obs_installed guard",
    and declares, for "propagation that reaches only one level deep" only,
    one replacement in observer.py: old text
    "if _STATE.entered or _STATE.inherited:" becomes "if _STATE.entered:",
    and the work 07_TICKET-observer already holds a pin for that name from an
    earlier preparation, a different replacement,
  When the gate runs for that work,
  Then "propagation that reaches only one level deep" is not sent to the
      preparer, its pin is not applied, and the declared replacement is
      applied to observer.py as it now stands,
    And its row says "declared" and names TQ-9101 and T1's entry,
    And the declared replacement is held to the same checks as a pinned one
      (TQ-500g-1-xiii) and to the same refusals as a prepared one (a test
      file, outside the repository, inside the version-control folder, or not
      in scope for the name),
    And when the declared old text no longer occurs exactly once in
      observer.py, or any other check fails, the name is reported unfinished
      with a reason naming TQ-9101, T1's entry and the failed check; it is
      never sent to the preparer and never falls back to the pin,
    And "drop the _lc_obs_installed guard", which has no declaration, comes
      from its pin or from the preparer as before,
    And the pin held for "propagation that reaches only one level deep" stays
      as it was while the declaration exists, and is used again, after the
      checks, once the declaration is removed from the entry,
    And a declaration on T1's entry for a name that entry's must_catch does
      not list is refused when the requirement is checked, with a message
      naming the entry and the name.
depends_on:
  - TQ-500g-1
  - TQ-500g-1-xi
  - TQ-500g-1-xiii
  - TQ-500f-2
