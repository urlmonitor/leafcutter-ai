notes: |
  DERIVE THE EXPECTATION, DO NOT ENUMERATE THE STEPS — BO-3100e's binding
  instruction, and AR-200a-1's constraint 3 on evidence: the derived rule found five
  violators where the incident named three. The first two scenarios are the test of
  that instruction, because they use a step the system has never seen; a checker
  with a hardcoded case per known step fails them.

  The third scenario is the coverage clause, and it is the one that catches a
  half-built implementation: a judgement that runs for two of a build's nine steps
  is indistinguishable from one that runs for all nine unless the counts are
  compared.

  BP-600d-4 built this same observable check by hand into one workflow's close phase
  for one lane. That is evidence the check is buildable and evidence that it does
  not generalise — this record is the generalisation.
