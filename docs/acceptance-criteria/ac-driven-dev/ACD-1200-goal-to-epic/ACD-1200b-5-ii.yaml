test_spec:
  - name: test_multiline_amended_by_record_survives_promotion_and_reparses
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: real_artifact
    description: "Promote a reviewed leaf whose amended_by already holds a multi-line entry containing blank lines, written the way the store itself serializes such a record (shape taken from the real on-disk GE-123a-4 record, not a hand-indented literal); assert the file re-parses as a single YAML document afterwards."
  - name: test_promotion_appends_one_entry_and_preserves_prior_multiline_text
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "After promoting such a record, assert amended_by holds every prior entry with its full text and blank lines intact plus exactly one new approval entry, and that readiness is the only other changed field."
  - name: test_unparseable_output_restores_original_bytes_and_exits_nonzero
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Regression: when the text the mechanism would store does not parse, assert the file on disk is byte-identical to its pre-run content and the run exits non-zero."
  - name: test_no_promoted_line_reported_for_a_record_left_unwritten
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Assert the report for an unparseable-output record names it as a failure and contains no line describing it as promoted, so the report can be read as proof of the write."
  - name: test_cli_run_over_a_multiline_history_tree_exits_zero_and_all_records_parse
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "python scripts/ac_store/approve_acs.py"
    description: "Invoke the approval mechanism as a process over a tree whose reviewed leaves carry multi-line amended_by histories; assert exit status 0 and that every touched record re-parses, so the guarantee is reachable from the entry point people actually run."
test_rationale: "A direct-import unit test over a synthetic, hand-indented fixture is exactly the shape that let KI-ACS-017 through: the defect only appears on a record whose amended_by holds a multi-line scalar with blank lines as the store serializes it. The contract therefore fixes the artifact shape (real on-disk serialization) and pairs it with a process-level run, because the second half of the bug — a success-shaped exit code over a destroyed file — is only observable from the outside."
