id: BO-2300b-1
components:
  - build_orchestration
title: "Each pending question declares its type and its valid answer shape"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run pauses at an interactive decision point,
  When it emits the pending question,
  Then the question carries a declared type that is exactly one of:
    single-choice (an approve / edit / cancel decision),
    priority-choice (a selection from critical / high / medium / low),
    or free-text (an open written response),
  And the question states the valid answer shape for that type
    (the allowed option set for single-choice and priority-choice, or that any
    text is accepted for free-text),
  And the gate that raised the question is the one that declares which of the
    three types it needs.
depends_on: [BO-2300b]
assigned_agent: llm-expert
estimated_complexity: M
doc_links:
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-024-interactive-pause-resume.md
    relationship: describes
    status: exists
  - path: docs/reference/workflow-authoring-contract.md
    relationship: describes
    status: exists
it_requirements:
  config_schema_fragment:
    type: object
    description: "Structured question object embedded in the pending-question record."
    properties:
      type: {type: string, enum: [single_choice, priority_choice, free_text]}
      prompt: {type: string}
      valid_answers:
        type: array
        description: "['approve','edit','cancel'] for single_choice; ['critical','high','medium','low'] for priority_choice"
      accepts_any_text: {type: boolean, description: "true for free_text"}
    required: [type, prompt]
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "all"
  required_skills:
    - llm-expert
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "SURFACE: implemented in the E2 workflow ENGINE (JavaScript). The question type + valid-answer-shape vocabulary is defined once in the shared JS helper module (imported by all engine files, hence n_location_rule=all) and each JS gate declares its type. This is JS in the workflow files, not a standalone Python module."
    - "Exactly three question types are supported: single_choice (approve/edit/cancel), priority_choice (critical/high/medium/low), free_text; the raising gate declares which type it needs."
    - "Each emitted question must state its valid answer shape (allowed option set for the choice types; any-text for free_text) so the answer contract is unambiguous."
    - "Define the type/answer-shape vocabulary once in the shared JS helper (a single shared definition), not duplicated per gate, so the gates that raise questions and the validator that checks answers (BO-2300b-2) cannot drift."
    - "E2 top-level-body form (ADR-030); deployed/template parity via build.py (ADR-001)."
    - "TEST STRATEGY: drive the real JS engine via unit_tests/_workflow_engine_harness.py run_workflow_under_e2(plan-feature.js); assert the emitted question object (captured via the pause/persist agent() call args) carries the declared type and valid_answers for each of the three gate types. Do NOT test a standalone Python module."
  delivers_shape:
    description: "The question sub-schema this AC establishes populates the record's question field from BO-2300a-1."
delivers_to:
  agent: llm-expert
  contract: "Question object schema: { type: 'single_choice'|'priority_choice'|'free_text', prompt: string, valid_answers: [...] (single_choice -> approve/edit/cancel; priority_choice -> critical/high/medium/low) or accepts_any_text: true (free_text) }, defined once in the shared JS helper. Populates the question field of the pending-question record (BO-2300a-1). Consumed by wrong-shape rejection (BO-2300b-2) and apply-by-type (BO-2300d-1)."
expects_from:
  ac_id: BO-2300a-1
  contract: "The pending-question record container into whose question field this declared-type/answer-shape object is written on pause (via the persist agent() dispatch)."
test_spec:
  - name: test_question_declares_type_single_choice
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via run_workflow_under_e2(plan-feature.js), a single_choice gate emits a question declaring type single_choice with valid_answers approve/edit/cancel (asserted from the persist agent() call args)."
  - name: test_question_declares_type_priority_choice
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the harness, a priority_choice gate emits a question declaring type priority_choice with valid_answers critical/high/medium/low."
  - name: test_question_declares_type_free_text
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the harness, a free_text gate emits a question declaring type free_text and stating that any text is accepted."
  - name: test_choice_question_states_valid_option_set
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the harness, a choice-type question states its allowed option set."
  - name: test_gate_declares_its_question_type
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the harness, the JS gate that raises a question is the one that declares which of the three types it needs (vocabulary sourced from the shared helper)."
