test_spec:
  - name: test_acd_1200a_9i_in_place_overwrite_on_collision
    target_dir: tests/
    framework: unittest
    type: integration
    angle: criterion
    description: "A basename that already exists in the epic folder is overwritten in place — the Then clause that the collision resolves deterministically to the same single path."
  - name: test_acd_1200a_9i_no_second_location_copy
    target_dir: tests/
    framework: unittest
    type: integration
    angle: criterion
    description: "No renamed sibling and no second copy is minted anywhere — the negative half of the same Then clause."
  - name: test_acd_1200a_9i_single_file_after_run
    target_dir: tests/
    framework: unittest
    type: integration
    angle: criterion
    description: "After the run exactly one ticket file with that basename exists for the leaf AC, at the epic-folder path."
  - name: test_acd_1200a_9i_warning_emitted_on_overwrite
    target_dir: tests/
    framework: unittest
    type: integration
    angle: criterion
    description: "A WARNING naming the replaced file is emitted for each overwrite, so the replacement is observable rather than silent. Asserted via assertLogs on the 'goal_to_epic' logger, which is why epic_assembly logs through epic_runtime.get_logger() rather than __name__."
  - name: test_acd_1200a_9i_implemented_by_after_collision
    target_dir: tests/
