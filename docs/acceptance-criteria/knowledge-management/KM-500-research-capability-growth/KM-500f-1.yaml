criteria: 'Given the reviewed source example declares five one-hop incoming dependencies on TQ-500f-2

  When an agent asks which requirements directly depend on that AC at the pinned revision

  Then the answer identifies TQ-500f-2-i, TQ-500f-2-ii, TQ-500f-3-i, TQ-500f-5 and TQ-500f-6 with each supporting
  dependency declaration

  And it states the relation direction, depth, source revision and inspected population

  And hierarchy membership, declared dependency, implementation reference and inferred impact remain distinguishable
  rather than being treated as interchangeable edges

  And a result that omits one dependent and declares truncation reports only its known subset without asserting
  a complete total

  And any requested comparison between two revisions identifies both revisions and limits its claims to the source
  changes and relationships actually inspected

  And absent code-consumer or transitive dependency evidence is named as an impact-analysis limitation rather than
  being filled by an exhaustive-consumer claim.

  '
