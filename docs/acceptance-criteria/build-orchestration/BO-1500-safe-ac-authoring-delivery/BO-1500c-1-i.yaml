- path: scripts/workflows/plan-feature.js
  relationship: modifies
  status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- PR creation is gated strictly on the final-approval signal. Cancellation must be a clean exit that preserves
  committed branch state and triggers no push/PR; committed AC files remain on the branch and are absent
  from main.
- This behavior must be implemented in BOTH surfaces -- /create-ac (templates/skills/create-ac/SKILL.md
  prose) and /plan-feature (scripts/workflows/plan-feature.js) -- preferably via a shared worktree/PR
  helper reused from build-single-ticket (scripts/setup_ticket_worktree.py) and the pull-request machinery;
  keep the two surfaces in sync. The create-ac prose edits are an llm-expert follow-on within the same
  ticket.
- 'Follow the project Error Handling Policy (CLAUDE.md): wrap all external I/O (git subprocess, gh CLI/REST
  calls) in explicit error handling; no bare except; surface a user-visible warning/error rather than
  silently swallowing.'
test_spec:
- name: test_cancel_before_final_approval_opens_no_pull_request
  target_dir: unit_tests/workflows/
  framework: unittest
  type: behavioral
  description: With a gate stub returning "cancel" before the final gate and a recording gh/git shim on
    PATH, no `gh pr create`, no `gh api ... /pulls`, and no `git push` is invoked, and the returned status
    is "cancelled" rather than "ok".
- name: test_cancelled_run_keeps_committed_ac_files_on_the_authoring_branch
  target_dir: unit_tests/workflows/
  framework: unittest
  type: integration
  description: AC YAML committed by the stages that completed before cancellation is still reachable from
    the authoring branch HEAD, with unchanged content, after the cancel path returns.
- name: test_cancelled_run_leaves_no_ac_files_on_main
  target_dir: unit_tests/workflows/
  framework: unittest
  type: integration
  description: The fixture repo's main branch tree contains none of the AC YAML paths the cancelled run
    committed, and main's HEAD sha is unmoved.
- name: test_cancelled_run_is_resumable_from_the_first_uncommitted_stage
  target_dir: unit_tests/workflows/
  framework: unittest
  type: behavioral
  description: Re-running after a cancellation dispatches only the stages that had not committed, confirming
    cancellation is a clean exit and not a terminal state.
