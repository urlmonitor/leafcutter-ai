criteria: |
  Given the sql-test-writer "empty window, database shape" row, whose fixture
      seeds 3 buy_volume rows,
    And a produced test that asserts an exact processed-row count and runs
      "SELECT COUNT(*) FROM buy_volume_window WHERE symbol = ANY(%s) AND
      buy_volume IS NOT NULL" and asserts its result with
      self.assertEqual(self.cur.fetchone()[0], len(_SEEDED_ROWS)),
  When the row's count check reads the produced test,
  Then the check passes,
    And the same query with the predicate as "WHERE buy_volume IS NOT NULL",
      with a table alias ("WHERE w.buy_volume IS NOT NULL") or with COUNT(1)
      passes,
    And the forms accepted before (count(buy_volume), FILTER (WHERE buy_volume
      IS NOT NULL), CASE WHEN buy_volume IS NOT NULL) still pass,
    And a test whose "buy_volume IS NOT NULL" sits in a different statement
      from its COUNT(*) fails,
    And a COUNT(*) filtered on "buy_volume IS NULL" or on another column's
      "IS NOT NULL" fails,
    And a filtered COUNT(*) whose result is asserted only with ">= 0" or
      "at least one row" fails,
    And a test whose filtered COUNT(*) is its only count, with no exact
      processed-row count, fails.

  Given the kept live output of the 2026-11-02 first live run and re-run 1
      for this row, recorded as a probe fixture,
  When the check scores it,
  Then it passes, a copy with the "AND buy_volume IS NOT NULL" predicate
      removed fails (no false green), and the recorded gold output for the
      row still passes.

  Given the change is done,
  Then the sql_counts_rows_and_non_null entry on the sql-test-writer
      assertion-kind reference page lists the filtered COUNT(*) form among
      the accepted forms with a passing example, and the different-statement
      and wrong-column forms among the failing ones,
    And the drift tests that hold the reference entries equal to the kind
      registry and to the quoted template sentences stay green,
    And the "Counts" line of the produced-tests section of the evals README
      still describes the rule, updated if it names the accepted SQL forms,
    And the known issue "sql non-NULL count misses COUNT(*) WHERE NOT NULL" is
      moved to resolved naming this AC and its proving tests, with the
      Open/Resolved count of the testing-quality known-issue register
      recounted,
    And one changelog entry names this AC and the resolved known issue,
    And no glossary term is added except through the glossary-triage flow,
    And the sql-test-writer template's remedy "assert an exact count of
      processed rows plus a non-NULL count" is unchanged.
