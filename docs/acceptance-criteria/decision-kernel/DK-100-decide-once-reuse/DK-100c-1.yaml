assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
  - 'Only a human answer may approve, choose or reuse (ADR-053, ADR-060): no path may let Jev, a host
    or the kernel resolve or approve on a person''s behalf.'
  - Every path that resolves a decision (kernel ranking, resolved gate, precedent reuse) hands it
    to the record builder through one staging function; none bypasses the builder.
  - 'Staging a record must never fail or change the decision: a refusal or write failure is logged
    and leaves the result as it was.'
  - 'This L2 has L3 children, so done_proof treats it as a composite unless it carries its own covers
    tag: tag the tests of its own clauses so it proves itself, not only through its children.'
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
test_spec:
  - name: test_a_humans_design_choice_stages_a_publishable_record
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_decision_precedent.py::TestOnlyHumanApprovalStagesARecord::test_a_humans_design_choice_stages_a_publishable_record):
      a human''s choice hands the decision on; record approver and approval time are the decision''s'
    covers:
      - DK-100c-1
  - name: test_a_required_human_approval_stages_a_record_for_that_human
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_decision_precedent.py::TestRecordsOfOtherApprovalPaths::test_a_required_human_approval_stages_a_record_for_that_human):
      the resolved-gate path also hands a human-approved decision on'
    covers:
      - DK-100c-1
  - name: test_a_human_choice_stages_a_record_and_nothing_is_written_to_the_repository
    target_dir: tests/kernel/memory/
    framework: unittest
    type: integration
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_learning_loop_e2e.py::TestRunOneStagesARecordThatPublishFiles::test_a_human_choice_stages_a_record_and_nothing_is_written_to_the_repository):
      through the service, approved_by human:user reaches the staged record'
    covers:
      - DK-100c-1
delivers_to:
  agent: python-coder
  ac_id: DK-100c-2
  contract: 'kernel.memory.staging.stage_decision_record(ctx, decision, options, criteria, evidence,
    ranking: list[OptionRanking] (kernel_ranking only), precedents: list[PrecedentNote], basis: ''kernel_ranking''
    | ''resolved_gate'' | ''precedent_reuse'', criterion_evidence: {criterion_id: [evidence_id]},
    supersedes: [dec ids], related: [dec ids]) called once per COMPLETED result, with the Decision
    exactly as resolved (approved_by and approved_at untouched).'
expects_from:
  ac_id: DK-100b-3
  contract: 'A COMPLETED CapabilityResult whose decisions[0] is a kernel.contracts.decision.Decision
    {id: ''dec-<16 hex>'' (stable per work item), status: resolved, selected_option_id: str, approval_status:
    approved, approved_by: the answering actor id (''human'', ''human:<id>'' or a bare id such as
    ''user''), approved_at: timezone-aware datetime of the answer, option_ids, criterion_ids, evidence_ids,
    design_reason: str | null, precedent_ids: [dec ids], versions: {options, criteria, templates}},
    plus the Working options, criteria and evidence the staging step needs.'
