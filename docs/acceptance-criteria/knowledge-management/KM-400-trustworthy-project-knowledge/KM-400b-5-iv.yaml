id: KM-400b-5-iv
title: "Write verification compares content fingerprints instead of reading every stored payload back, and still catches a changed or missing record"
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-400b-5
criteria: |
  Given a write batch of 250 nodes of label AcceptanceCriterion whose payloads total 1,800,000 bytes
  And the snapshot holds a content fingerprint for each of those 250 payloads
  When the batch is written and verified
  Then the data the store returns for verification holds, per node, only its identity and the fingerprint of the stored payload
  And no stored payload body is returned for verification
  And the amount of data returned for verification is the same whether the batch's payloads total 1,800,000 bytes or 250,000 bytes
  And the verification passes when all 250 stored fingerprints equal the snapshot fingerprints

  Given one node in the batch, KM-400b-5, was stored with a payload that differs from the snapshot payload by a single character
  When the batch is verified
  Then the verification fails
  And the failure names node KM-400b-5, its label, the expected fingerprint and the stored fingerprint
  And the failure is reported with the original cause through the failed-publication result, so the generation is removed as for any other failure after storing

  Given one node in the batch was not stored at all
  When the batch is verified
  Then the verification fails and names that node as missing, not as a fingerprint mismatch

  Given a relationship batch whose relationships carry property payloads
  When it is verified
  Then the same rules apply: identity and fingerprint are compared, payload bodies are not returned, and a changed or missing relationship fails naming it
depends_on: [KM-400b-5, KM-400b-5-iii]
