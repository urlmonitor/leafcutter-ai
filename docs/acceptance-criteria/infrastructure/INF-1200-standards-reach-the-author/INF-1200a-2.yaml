notes: |
  THIS IS THE RECORD THAT KEEPS THE WHOLE TREE OUT OF GE-127, AND IT IS THE ONLY ONE
  THAT DOES IT BY OBSERVATION RATHER THAN BY ASSERTION. Every other criterion here can
  be read as "the specialist ends up knowing the standard", and a design that tells a
  specialist the limit the first time it is refused satisfies that reading completely.
  It is also a genuinely attractive design — it is cheap, it targets the people who
  demonstrably need it, and it produces excellent-looking before-and-after numbers. It
  is precisely what the L1 forbids, because the value claimed is worth something in the
  runs where nothing would ever have been refused.

  THE SECOND ARM IS WHY THIS IS NOT SIMPLY "DELIVERY IS UNCONDITIONAL". A delivery that
  happens every time but says MORE after a breach — an added warning, a stronger
  wording, a note that this specialist has offended before — has smuggled feedback back
  into the brief. The comparison is between the two materials, and they must be the
  same, not merely both non-empty.

  THE THIRD ARM IS THE ONE THAT WILL BE ARGUED WITH, SO IT IS STATED PLAINLY. Three
  standards are configured on disk today whose checks are not reached, and the natural
  instinct is that telling someone about an unenforced standard is misleading. It is
  not this record's job to settle whether those checks should run — that is
  BP-1600a-2's, it is approved, and it is fenced above. It IS this record's job to
  ensure the telling is not silently coupled to the running, because that coupling is
  the single cheapest way to reintroduce "you find out when you are stopped". See
  INF-1200a-3, which owns the same coupling from the standards axis and states the
  symmetric obligation; the two are consistent and neither may be closed as the other.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift
  it verbatim into a test descriptor.

  MUTATION: make a standard's presence in a specialist's brief conditional on that
  standard having produced a finding — carry outward only the standards that have
  fired, or add the standard to the brief at the point it is first breached. Under that
  injection:
    - the never-breached arm must go RED, because a specialist that has not yet
      offended is told nothing;
    - the after-a-breach comparison must go RED, because the two materials differ;
    - the unreached-check arm must go RED, because a check that cannot fire can never
      produce the finding the delivery waits on.
  All three must revert. An injection run in which any arm stays green means the arm
  was not carrying the timing claim and must be rewritten before this record is
  believed.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. The
  mutation above is written to be turned directly into a test descriptor.
