notes: |
  Design-review gap 1. Today the authoring workspace is identified by the component being
  worked on, falling back to the current date, so two runs on one component -- or any two
  runs on one day -- resolve to the same workspace and the same line of work. That
  reproduces the collision this feature exists to prevent, one level removed. The
  requirement is stated as observable behavior (no two live runs resolve to one workspace),
  not as a naming scheme, so the implementation is free to choose how identity is minted.

  Re-homed 2026-08-14 from BO-1500a-9 to BO-1500f-2 by the Pattern C intermediate split
  of BO-1500a. Criteria text is unchanged. Its dependency on BO-1500a-1 is deliberately
  retained across the f/a boundary, and the delivers_to consumers named above now sit one
  in BO-1500f and one in BO-1500g.
