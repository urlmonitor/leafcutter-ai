id: ACD-1300g-4
title: Publish one checked and reviewed draft PR while leaving merge to the user
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given the current feature head equals both its passing validated revision and approved reviewed revision
  When publication succeeds
  Then one draft PR contains the feature and AC links, check evidence and review summary
  And the durable run records that proposal as ready for the user's decision
  And the worker may select other eligible features but never merges the proposal automatically
  And external dependents remain blocked until actual target-branch completion
