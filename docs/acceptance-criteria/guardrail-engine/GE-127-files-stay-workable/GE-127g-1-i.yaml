  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127b-1.yaml
    relationship: related
    status: exists
    relevance: >-
      THE GROWTH ARM THIS RECORD EXEMPTS FROM, AND THE REASON THIS RECORD EXISTS AT ALL.
      It is the keystone ratchet: already over the line may not get further over it. The
      doc-length gate's own configuration comment states it ratchets exactly as that
      record and GE-127a-1 specify. An exclusion that short-circuits only the crossing
      check leaves the three documents already above the limit unable to be regenerated,
      which is the reported symptom unfixed.
  - path: templates/scripts/commit_guardian/_doc_length_ratchet.py
    relationship: modifies
    status: exists
    relevance: >-
      Both arms run through here, which is exactly why they can be fixed separately by
      accident: the exclusion test is consulted at a point in the flow, and a change that
      places it before one comparison and not the other produces a half fix that passes
      any test using an under-limit document.
  - path: CLAUDE.md
    relationship: describes
    status: exists
    relevance: >-
      Behavioural verification is binding. Each arm is an ordinary commit whose staged
      content differs from the committed content by a stated number of lines, and the
      verdict is read out of the commit. A test that asserts the exclusion test is
      consulted, without exercising a document that is already over its limit, cannot
      tell the two arms apart.
delivers_to: null
expects_from:
  - ac_id: GE-127g-1
    contract: >-
      The declared set of set-aside locations and the single membership test built on it.
      This record adds no second declaration and no second membership test; it constrains
      where in the standard's two comparisons the one membership test must take effect.
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The single membership test must be consulted at a point that PRECEDES both
    comparisons, not inside either. In _doc_length_ratchet.py both comparisons live in
    one function, classify_dimension(): the `previous > limit` branch is the growth
    ratchet and the `else` branch is the crossing refusal. A membership test placed
    inside that function, or inside analyze_file's per-dimension handling, can reach one
    branch and not the other — which is the half fix. The coverage filter (is_checked,
    consulted at check_doc_length.main() line 407 and as resolve_doc_ratchet()'s
    HEAD-covered predicate at line 272) is the point that precedes both."
  - "Both consultation sites of is_checked must receive the same answer for the same
    document. A set-aside document must be absent from the staged coverage filter AND
    from the HEAD-covered set, because resolve_doc_ratchet() computes the previous value
    for the second population — a document excluded from one and not the other has its
    current length compared against a previous value resolved under a different rule."
  - "No document outside the declared locations may have either comparison weakened.
    This record's exemption is about WHERE the one membership test takes effect, never
    about what the standard is."
  - "No new module is required: _doc_length_ratchet.py measures 147 lines against its
    400-line limit (measured 2026-10-09 with check_file_size's own measurement rule), so
    the change fits in place. If a helper is extracted anyway it must live in
    templates/scripts/commit_guardian/, which deploys wholesale; anywhere else needs a
    deploy-map entry in the same change."
  - "Must handle errors gracefully per the project error handling policy."
test_spec:
  - name: test_set_aside_document_already_over_the_limit_may_grow
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    surface_invoked: templates/scripts/commit_guardian/check_doc_length.py
    description: >-
      Arm 1, the live arm. In a real git repo, commit a document inside the declared
      set-aside location at a length far above the limit, then stage it longer than it
      was committed. Invoke the gate against that index and assert a clean verdict. The
      GROWTH comparison is the only one that applies to this document — it has already
      crossed — so this entry is what proves the growth arm is set aside. No build.py
      spawn and no layout fixture, so no marker.
    must_catch:
      - "consult the set-aside membership test only before the crossing comparison, leaving the growth comparison to run on every document"
      - "place the membership test inside classify_dimension's else branch only"
  - name: test_set_aside_document_may_cross_the_limit_for_the_first_time
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: >-
      Arm 2, prospective but independently mutable. Commit a document inside the declared
      location UNDER the limit, then stage it above the limit. Assert a clean verdict.
      The CROSSING comparison is the only one that applies here, so this entry is what
      proves the crossing arm is set aside. No marker.
    must_catch:
      - "consult the set-aside membership test only before the growth comparison, leaving the crossing comparison to run on every document"
      - "place the membership test inside classify_dimension's previous-over-limit branch only"
  - name: test_hand_authored_document_outside_every_declared_location_is_still_refused
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 3, the negative control, staged in the SAME commit as the two generated
      documents above. Commit a hand-authored document outside every declared location
      above the limit and stage it longer. Assert the gate refuses AND that the document
      it names is that hand-authored one and neither generated one. Naming matters: a
      refusal alone does not distinguish a correct exemption from a wide one. No marker.
    must_catch:
      - "set both comparisons aside for every document under docs/"
      - "report a refusal without naming which document caused it"
  - name: test_set_aside_document_absent_from_both_the_staged_and_head_covered_populations
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: seam
    description: >-
      Enrichment's own entry, for the second it_requirement. Drive a run in which a
      set-aside document exists at HEAD and is staged, and assert the previous-value
      resolution did not include it — observed through the run's own behaviour, by
      staging it SHORTER than committed and confirming no INDETERMINATE and no
      previous-value-derived finding is produced for it. The two is_checked consultation
      sites must agree; this is the only entry that can tell them apart. No marker.
    must_catch:
      - "exclude the document from the staged coverage filter but not from the HEAD-covered-set predicate"
test_rationale: >-
  Each arm is an ordinary commit whose staged content differs from the committed content
  by a stated direction of change, with the verdict read out of the gate's own outcome.
  The record's notes are right that a test asserting the exclusion test 'is consulted',
  without exercising a document that is ALREADY over its limit, cannot tell the two arms
  apart — which is why arms 1 and 2 are separate entries driven by documents chosen for
  opposite comparisons rather than by one regenerated directory.
  ONE CORRECTION THE TEST AUTHOR MUST CARRY, AND THE CRITERIA ARE NOT AFFECTED BY IT.
  The record's named mutations (1) and (2) have their must-go-red arms transposed.
  classify_dimension() routes a document whose previous value already exceeds the limit
  into the GROWTH branch and a document whose previous value is under it into the
  CROSSING branch. So mutation (1), which exempts only the crossing comparison, leaves
  the growth comparison live and reddens the FIRST arm (2,525 to 2,809) — not the second;
  and mutation (2), which exempts only the growth comparison, reddens the SECOND arm
  (268 to 340) — not the first. The must_catch strings above carry the corrected mapping.
  The notes' substantive point is untouched and is correct: each arm has its own
  independent half-fix mutation, neither is decorative, and mutation (1) is the one most
  likely to ship by accident. Nothing in the criteria changes, and the criteria have not
  been edited.
  Markers: no entry requests shared_reference_layout and none spawns build.py, so all
  four sit outside the marker-routing mechanism; the deployed-layout proof is paid once by
  GE-127g-1's deployed entry and is not re-paid here. Pinned for the test author: do NOT
  hardcode 2,525 / 2,809 / 268 / 340 / 355 — the record's notes state these are the
  measured shape, not fixed facts, and the population moves whenever an agent or an
  assignment is added. Construct the lengths in the fixture and assert on the fixture's
  own figures.
