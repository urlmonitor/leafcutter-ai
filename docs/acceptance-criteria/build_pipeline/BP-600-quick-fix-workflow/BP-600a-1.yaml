assigned_agent: workflow-architect
estimated_complexity: M
it_requirements:
  - "Must operate at depth 0 per ADR-006 — phase agents dispatched at depth 1 via the Agent tool"
  - "Requires Claude Code >= 2.1.154 for JS workflow script support"
  - "Must handle errors gracefully per the project error handling policy"
  - >-
    Must not invoke worktree-agent or the feature skill on either path. When
    Case B applies, the worktree must come from the canonical
    setup_ticket_worktree.py create-only script and nothing else — see
    BP-600a-2 for the full prohibition and its reason.
  - >-
    The isolation decision must be made in the workflow's own control flow from
    a reported observation, not left to an agent to decide; the observing step
    must be told to create nothing.
  - >-
    The worktree root established by Phase 0 must be threaded into every later
    phase. A path derived from the session's starting directory after Case B has
    run reads or writes the wrong copy of a file, silently.
  - "Workflow script must follow the pattern of existing templates/workflows-js/ scripts (export meta object with name, description, and phases)"
