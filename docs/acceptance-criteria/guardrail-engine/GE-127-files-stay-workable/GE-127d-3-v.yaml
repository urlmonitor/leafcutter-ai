notes: |
  REQUESTED BY BRAINCANDY, 2026-10-23 ("quick-fix the several statements issue"), closing the
  route GE-127d-3's notes recorded as out of scope on 2026-10-21.

  MEASURED IMPACT, 2026-10-23, over every tracked covered file: 36 of 3400 files measure
  higher (largest +30, leafcutter-web/lib/data/types.ts, from `;`-joined type members;
  +16 knowledge/ports.py, from one-line `def ...: ...` protocol stubs), none crosses its
  limit.

  KNOWN RESIDUE, ACCEPTED. (1) A Python compound body joined onto its header (`if x: y`) keys
  with the header line's indentation, not the body's, so joining or splitting it measures the
  same but the added-lines diff charges one line. (2) A JavaScript block written on one line
  (`if (x) { a(); b(); }`) counts once per statement, not the four lines its expanded form
  measures: brace lines are not statements. (3) SQL and shell are not split; their
  statement separators would need string-aware breaks the comment lexers do not track.

