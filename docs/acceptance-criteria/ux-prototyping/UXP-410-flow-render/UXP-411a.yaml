work_status: done
criteria: |
  Given a flow step whose implements list references an AC id that does not resolve in the AC store,
  When the pipeline resolves that step,
  Then the step is rendered with an explicit unknown/fallback status rather than being silently treated as done,
  And the rest of the flow still resolves and renders normally.
