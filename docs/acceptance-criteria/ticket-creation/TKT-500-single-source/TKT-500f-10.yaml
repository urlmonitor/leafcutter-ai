criteria: |
  Given a leaf AC that carries a delivers_to contract
    (agent: "python-coder", contract: "a de-duplicated files_touched list")
    and an expects_from contract
    (ac_id: "TKT-500f-8", contract: "the union edit surface"),
  When a ticket is generated from that AC by generate_ticket_from_ac.py,
  Then the generated ticket renders the delivers_to contract, naming the
    downstream counterpart agent "python-coder" and the contract text,
  And the generated ticket renders the expects_from contract, naming the
    upstream counterpart AC id "TKT-500f-8" and the contract text,
  And both contracts appear in the ticket (in the body and/or frontmatter) so
    the implementing agent receives the producer to consumer hand-off instead
    of re-deriving it from the source AC.

  Given a leaf AC whose delivers_to is null and whose expects_from is null,
  When a ticket is generated from that AC,
  Then no delivers_to or expects_from contract content is rendered into the
    ticket, and generation completes without error.
