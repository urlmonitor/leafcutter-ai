notes: |
  UNDER-SPECIFIED, NOT INVENTED — four points the owner should settle:

  1. MERGING THE FIX CLOSES THE FLAG. The hosting service closes issue #N automatically
     when a PR whose description says "Fixes #N" or "Closes #N" merges to the default
     branch. So the escape hatch, used as designed, closes the flag the moment the fix
     merges — releasing every other PR before any night has confirmed the fix.
     TQ-600a-13-iv makes the flag reappear if the next night is still red; it does not
     keep the hold in between. If the owner wants the hold kept until a green night, the
     declaration needs a non-closing form (the `nightly-fix` label alone, or a keyword the
     hosting service does not act on).
  2. WHO MAY APPLY `nightly-fix`. Anyone able to label a PR can release its hold, for any
     change. The design does not restrict it. Whether that is acceptable is a trust
     decision, not a specification gap the BA can fill.
  3. OTHER CLOSING KEYWORDS AND FORMS. The design names "Fixes" and "Closes". The hosting
     service also acts on "Resolves", past tenses, and full issue URLs. This record
     requires only the two named forms to pass and says nothing about the others.
  4. WHERE THE DECLARATION IS READ. This record reads the PR description. Title and
     commit messages are not covered. With two or more open flags, which number must be
     declared is also unsettled.
