id: BO-1600d-4
readiness: draft
priority: medium
title: "Any project that installs leafcutter and runs build.py gets the recovery helper the same way"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1600-safe-concurrent-dispatch/BO-1600d.yaml"
criteria: |
  Given a fresh consumer project that has installed leafcutter and run
    build.py --target-dir .
  When the consumer looks for the guided recovery helper after a corruption halt
  Then the recovery entry point and its step engine are present in the consumer
    project from the build, deployed from the package source tree that build.py
    copies from (not left only in the leafcutter repository's own working tree)
  And the recovery behavior available to the consumer is the same human-invoked,
    dry-run-first, confirmation-gated behavior defined in BO-1600d-1 through BO-1600d-3
  And the recovery guidance a consumer relies on does not depend on the leafcutter
    repository's own root CLAUDE.md, which is not deployed to consumers
depends_on:
  - BO-1600d
  - BO-1600d-1
  - BO-1600d-3
