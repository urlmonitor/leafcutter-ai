criteria: |
  Given a copy of the worktree setup step placed in a directory that is not inside
    any git repository and has no repository among its ancestors,
  And exactly one git repository exists among the immediate subdirectories of that
    directory,
  When the AC-authoring worktree subcommand and the fast-lane worktree subcommand
    are each executed from that directory with no repository location supplied by
    the caller,
  Then each of those subcommands resolves the repository it operates on by the same
    ordered contract the create-only subcommand already uses -- the script's own
    location first, then the bounded search of the immediate subdirectories -- and
    selects that one repository,
  And each of those subcommands exits successfully with the requested worktree
    present on disk under that repository,
  And each of those subcommands states on its error stream which repository it
    selected and that the selection came from a search rather than from the
    script's own location,
  And the bug symptom ("/plan-feature aborts at Stage 0 with 'Authoring worktree creation failed (exit code 1)'. The deployed script prints: 'ERROR: subprocess failed: Could not resolve a git repository from any candidate anchor. This copy of setup_ticket_worktree.py appears to be deployed outside the repository it manages. Candidates tried: - script's own directory (/home/henzeh/projects/leafcutter/.leafcutter/scripts): ... returned non-zero exit status 128.' Reproduced 2026-09-30 against origin/main ee47a88e. The fast lane's create-fastlane-worktree subcommand has the identical hole and fails the same way, so both AC authoring and the fast lane are unable to create their worktree from any deployed copy.") must not occur.
