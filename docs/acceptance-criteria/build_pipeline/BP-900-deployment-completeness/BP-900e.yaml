title: "Build catches package capabilities promised in the registry but never shipped to consumers"
component: build-pipeline
level: L1
status: active
req_status: active
work_status: not_started
readiness: draft
priority: critical
criteria: |
  Given the package promises capabilities to consumer projects through two
    sources of truth: (a) the commit-guardian hook registry
    (scripts/commit_guardian/commit_guardian.json), which registers hook
    scripts the package commits to running, and (b) deployable agent/skill
    templates, which reference runtime scripts by path,
  When a registry-completeness check runs at the finalize merge gate,
  Then it identifies every script that is REGISTERED in the hook registry OR
    REFERENCED by a deployable template but has NO deploy-source (template)
    copy under templates/scripts/ at all,
  And it fails the merge gate for every such promised-but-undeployed script,
  And it never fails for a source-only script that is neither registered nor
    referenced (legitimate package-development-only tooling),
  And the failure names each promised-but-undeployed script, where it was
    promised, and the action that resolves it.

  This L1 owns the registry-completeness axis: a script PROMISED by the package
  with ZERO template counterpart. It is the deliberate complement of BP-1000
  (byte-equality of scripts that exist in BOTH source and template — BP-1000d-1
  explicitly excludes source-only scripts from parity), of BP-900b (build
  PREFLIGHT scan of template script references against the deployable manifest),
  and of BP-100b-11 (registry entries point to a script that exists within their
  own tree). BP-900e checks the orthogonal question: does a registry-promised or
  template-referenced script have a DEPLOY-SOURCE copy at all.
