title: "Configurable divergence threshold with sensible default"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the build-epic workflow reads its configuration,
  When no sync-checkpoint threshold is explicitly configured,
  Then the threshold defaults to 20 commits,
  And the threshold value is read from a configuration surface
    (skill YAML frontmatter, commit_guardian.json, or equivalent),
  And when the threshold is explicitly set to 10,
    a worktree that is 11 commits ahead triggers the sync-checkpoint,
  And when the threshold is explicitly set to 50,
    a worktree that is 25 commits ahead does NOT trigger the sync-checkpoint,
  And the threshold value must be a positive integer greater than zero.
