id: BP-1500b
components:
  - build_pipeline
title: "What you remove from the source is gone from what you installed"
component: build-pipeline
level: L1
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
criteria: |
  Delete it once and it is really gone -- and the build never claims otherwise.

  When something is removed from the package, the copy that was previously
  installed goes with it, so no abandoned file survives to be offered, run, or
  answered to by name after the thing it belonged to is gone. A capability you
  retired must stop being something your project can still reach for.

  If one does survive, the build says so and names it, instead of finishing with
  a clean bill of health that stops anyone looking.

  And when nothing survives, the build says what it examined to reach that
  conclusion -- which installed copy it looked at, and how much of it. A clean
  result must be distinguishable from a step that looked at nothing and printed
  the same words. An all-clear nobody can check is worth less to the reader than
  no report at all, because it actively stops the check they would have done by
  hand.
