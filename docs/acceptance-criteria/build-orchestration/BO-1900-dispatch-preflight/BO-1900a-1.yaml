title: "Preflight runs before spawn and holds back an unfit ticket with a reason"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a ticket that has been read from the inbox and is next in the dispatch loop,
    and the ticket fails at least one fitness check,
  When the supervisor reaches the point where it would spawn the phase agent,
  Then the preflight validation stage runs first and returns an unfit verdict,
  And no phase agent is spawned for that ticket,
  And the ticket is recorded as held-back with a reason that names the ticket id
    and the specific failing check.
