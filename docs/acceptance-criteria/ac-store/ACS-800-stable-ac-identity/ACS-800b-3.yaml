criteria: |
  Given three requirements that all share the same parent UID,
  When they record where they sit in the tree,
  Then each stores an explicit order field,
  And rendering the three siblings sorted by their order field produces a
    deterministic, stable sequence,
  And changing one sibling's order field is sufficient to change its rendered
    position among its siblings, with no rename required.
