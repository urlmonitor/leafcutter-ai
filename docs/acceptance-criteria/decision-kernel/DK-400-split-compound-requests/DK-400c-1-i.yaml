notes: |
  User decision (DK-400 Q2): more than five means asking the person to narrow the request, or
  offering five parts and listing the rest read-only as not covered; never a silent drop. This AC
  takes the second option as the default and tells the person how to ask for the rest, so both
  readings are served. The user kept this default on 2026-10-05 (answer to BA open question Q2).
  For the IT PO: which five are offered when a dependency crosses the cut (for example p3 waits
  for p6). The example deliberately has no such dependency.
  Mock data v5 records these parts in not_covered[] (quotes that ARE in the subject, reason
  "beyond the five-part cap"; sample dcp-decision-records-seven-parts), separate from dropped[].
  Flow v5 branch split-too-many-parts.
