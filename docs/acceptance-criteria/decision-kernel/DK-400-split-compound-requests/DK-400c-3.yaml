estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-400c-1
  contract: "The host's proposal and its part count."
it_requirements:
  - The part count is taken after set-aside (DK-400c-3-i) and before the five-part cut. Fewer than 2 means no gate,
    no part, no Decomposition in the run's output and no split section in report.md; the split record is closed
    with a run event and a limitation naming why.
  - 'The request then goes on by its trigger, deterministically: bundled_accepted resumes from kept_routing as one
    decision from the precedent step; mid_run resumes the item as one decision or research step from its own routing
    result; jev_none records today''s capability gap (DK-400a-1-ii) and ends blocked with today''s blocked report;
    ambiguous falls back to today''s insufficient_context path, unchanged: with routing.on_insufficient_context
    ''human'' today''s clarification question is opened (the same template and choices as today) and the run is
    waiting_human; follow-ups count against intent.max_clarifications; today''s ambiguous gap is recorded only if
    the request ends unresolved (the person cannot be asked, or the follow-up limit is reached), and only then does
    the run end blocked.'
  - 'No second decomposition is requested for the same item. A request that falls back to the clarification question
    after a rejected or too-small ambiguous split is never offered a split again in the same run: the item keeps
    its closed split record, so the bundle check is skipped for it even after the person''s answer changes its effective
    goal, and it routes normally from there. This holds even when the clarification answer itself bundles several
    questions: the user chose today''s clarification, and today''s clarification path never splits; the person can
    start a new run to get a split.'
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_one_part_proposal_goes_ahead_by_trigger
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: 'Parametrised over bundled_accepted, mid_run (injected test producer), jev_none and ambiguous:
      a one-part or empty proposal opens no gate. bundled_accepted and mid_run go ahead as one; jev_none records
      today''s gap and ends blocked; ambiguous opens today''s clarification question, the run is waiting_human and
      no gap is recorded.'
  - name: test_too_few_parts_requests_no_second_decomposition
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: After a too-few-parts outcome no second decompose_goal interaction is opened for the item.
  - name: test_clarified_ambiguous_request_not_offered_split_again
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: 'After an ambiguous too-few-parts fallback, a clarification answer that is itself bundled (bundle
      0.9) is routed normally: no bundle question is asked for the item and no second split starts.'
  - name: test_too_few_parts_report_has_no_split_section
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: report.md of each run has no split section.
test_rationale: Each trigger leads to a different existing path, so one parametrised service-level test proves every
  ending is reached.
