notes: |
  PO authoring note (for the BA). This L1 is the ESCAPE HATCH that keeps GE-117d's
  block from being a dead end — consistent with GE-111d's reconciliation escape
  routes and GE-100's warn-vs-block config precedent. Two intended routes (keep
  both distinct, do not collapse to one):
    1. FIX / AUTOFIX — a guided or automated way to insert the correct
       declaration (component reference on a module docstring; AC reference on a
       public symbol or new decision-history entry) so the same commit proceeds
       once corrected.
    2. DELIBERATE OPT-OUT — a visible, intentional way to mark an in-scope item
       as genuinely not requiring a declaration, so the guardrail does not trap
       legitimate edge cases. The opt-out must be deliberate and auditable, NOT
       a silent global disable that would defeat GE-117d's fail-closed default.
  OPEN QUESTIONS for BA/IT-PO (do not assume): the exact opt-out mechanism and
  its durability (inline marker vs config allowlist vs per-file annotation);
  whether the autofix can safely infer the component (from directory_patterns in
  components.json) or the AC (from ticket/AC context) or must prompt; and how the
  opt-out is surfaced so it stays visible in review rather than hidden. Tie the
  autofix's component inference to the components.json directory_patterns field
  precedent used by /quick-fix.
  documentation_triggers [how-to, sequence-diagram] — the fix/opt-out is a guided
  user action (how-to) and a multi-step developer<->hook<->store interaction
  (sequence-diagram).
