criteria: |
  Given the knowledge-query script as it stands with the reader fixes of
    KM-KGS-100a-3-i..-x applied, whose frontmatter reader (the functions that
    locate the frontmatter end, strip matched quotes, split flow sequences,
    parse scalars, measure indentation, strip inline comments, recognise mapping
    items, parse block children, parse .md frontmatter and parse .yaml files) is
    defined inside the script itself
  And the field values that reader produces for every .yaml acceptance-criterion
    file and every .md frontmatter file in the repository are recorded as a baseline
  When the reader is moved into a separate module next to the script and the build
    is run
  Then the field values produced for every one of those files are identical to the
    baseline, file for file and field for field
  And the separate reader module is at or below the size standard's limit for its
    file kind
  And the knowledge-query script's code length is no greater than its code length
    on main, so the size ratchet accepts the change with no override
  And each of the ten reader functions is still reachable under its existing name as
    an attribute of the knowledge-query script, both when the script is imported as
    a module and when it is loaded from its file path with no scripts directory on
    the import path
  And after the build, the deployed knowledge-query script imports and reads an
    acceptance-criterion record to the same field values as the source script
  And the reader module is deployed next to the deployed knowledge-query script, each
    deployed copy byte-identical to its source, and the output-drift check does not
    report the reader module as an unregistered or missing output
  And the standard-library-only check fails when a non-standard-library import is
    added to the reader module, exactly as it does for the knowledge-query script
  And no other file that stood above its size limit before the change is longer after it
