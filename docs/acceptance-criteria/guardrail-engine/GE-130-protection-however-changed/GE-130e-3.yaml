id: GE-130e-3
title: The procedure for adding a session-time hook says a file protection must watch every way a file
  is changed, and matches what the check refuses
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the documentation an author of a new session-time hook is directed to read,
  When that author reads it,
  Then it states that a hook protecting against changing files is registered for both the editing
    tools and shell commands, and that a commit-time check does not count as covering it,
  And it states that every hook registered for either declares whether it is such a protection,
    and the grounds on which it may declare itself not one,
  And it states that a command whose effect cannot be told beforehand must reach the
    after-the-fact check,
  And an author who follows the written procedure exactly and registers a file protection for
    the editing tools only is refused by the coverage check, so the written and enforced
    procedures agree.
