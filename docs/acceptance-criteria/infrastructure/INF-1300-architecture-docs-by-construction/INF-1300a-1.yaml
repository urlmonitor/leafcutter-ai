    description: "For every hook in the sweep, assert positive evidence of examination — check_doc_frontmatter's PASSED count of at least one and a non-nothing_to_inspect RESULT line, and for each argv-blind hook a paired negative control that exits non-zero on a corrupted copy at the same staged path."
  - name: test_corrupted_variant_is_rejected_by_the_same_harness
