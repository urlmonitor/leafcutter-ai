criteria: |
  Given the dispatch-time premise re-check exists,
  When the documentation step runs for this feature,
  Then a sequence diagram is produced showing: supervisor loads the ticket's captured
    premises -> re-runs each reproduction command -> compares fresh result to captured
    result -> on match, dispatch proceeds; on mismatch or evaluation failure, the run is
    halted with a held-back reason,
  And the diagram shows the confirm (proceed), stale (halt), and unverifiable (halt)
    branches,
  And the diagram distinguishes this dispatch-time re-check from the authoring-time
    verification (TKT-200f).
