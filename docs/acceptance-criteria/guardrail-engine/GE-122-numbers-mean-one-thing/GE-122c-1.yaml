estimated_complexity: L
it_requirements:
  - "MECHANICAL REALITY THE IMPLEMENTER MUST START FROM: a PostToolUse hook is a subprocess and CANNOT itself spawn an agent. Its only channel is its documented contract — exit 0 with a block decision, whose reason is injected back into the running agent's context (see templates/hooks/ticket_frontmatter_guard.py's own header). The dispatch is therefore MODEL-MEDIATED: the hook makes it happen by returning an unambiguous, imperative instruction, and the session's agent performs it. This does not weaken the criterion; it locates the two things that must be built — a deterministic injection, and an instruction reliable enough that the dispatch actually follows."
  - "The AC is met only when BOTH halves are evidenced. The deterministic half (the hook emits the block decision, the contested identifier, every claimant path and a free identifier on a colliding write, and emits nothing on a clean write) is unit-testable and is the necessary condition. The observed half (a business-analyst invocation actually occurring after the write) is the sufficient condition and requires a live-session observation — see test_spec. Shipping only the first is precisely the anti-precedent this AC exists to avoid."
  - "The instruction text must be imperative and single-valued — one named agent, one named task, no 'consider' or 'you may'. An advisory phrasing is the most likely way the injection lands and the dispatch still does not happen, and it fails identically to a dead dispatch from the author's point of view."
  - "The negative case is not symmetry for its own sake and must be tested as hard as the positive one: no block decision, no injected instruction and no dispatch on a write that contests nothing. The anti-precedent guard fires its placeholder for EVERY novel term it sees, which is how it came to rubber-stamp everything; an unconditional dispatch is indistinguishable from no guard and costs more."
  - "RESOLVES THE QUESTION THE BA LEFT OPEN (notes: 'whether the guard blocks the write or permits it and dispatches alongside'). DECISION: the write is NOT reverted. The hook uses the block-decision channel to inject its message, which is the only way to reach the session, but the author's file stays on disk. This matches GE-122d-3's authoring-time disposition (announce, do not revert), and reverting a write over a collision whose other claimant may be weeks old punishes the wrong person while the two later stages still hold the line."
  - "REGISTRATION TARGET: a new entry under the PostToolUse `Edit|Write` matcher in `templates/settings.json`, following the existing shape exactly — `type: command` invoking `python \"$d/.claude/hooks/<name>.py\"` through the bash root-walk that locates `.claude/hooks`. `.claude/settings.json` is a build output produced by `scripts/build_claude_settings.py`; edit the template and run build.py. Give the entry a timeout consistent with its siblings (5-15s) and keep the hook well inside it — a hook that times out is silently skipped, which is a dead guard with no error."
  - "DEPLOY MANIFEST: the hook script belongs in `templates/hooks/`, which deploys to `.claude/hooks/`. If it imports the shared uniqueness pass from GE-122a-1 — and it must, per GE-122d-1 — that module has to be reachable from the `.claude/hooks/` layout, not only from `.leafcutter/scripts/commit_guardian/`. This is the specific cross-layout import that will raise ModuleNotFoundError at session time while every source-tree unit test passes, and at this stage the failure is INVISIBLE: a crashing PostToolUse hook produces no block decision, which is indistinguishable from a clean write. Resolve the import path explicitly and test from the deployed layout."
  - "The whole-collection pass runs on every Edit|Write in the session. It must stay within the registered timeout on the real collection (~2,975 records) or be scoped to the namespaces the written path belongs to — but scoping the NAMESPACE is permitted, scoping the INSPECTION to changed files is not (GE-122a-1-i)."
  - "The free identifier offered must come from the same allocation rule the reference document states and must account for loose files at the namespace root (GE-114-*, GE-115 and the GE-119 record sit loose). Offering an identifier that is already taken by a loose file would mint a second collision from inside the collision guard."
  - "Error handling per CLAUDE.md Rules 1-4. A hook exception at this stage must not lose the author's write; GE-122d-3 requires the cannot-establish condition to be ANNOUNCED in-session here rather than blocking or reverting."
test_spec:
  - name: test_hook_emits_block_decision_with_both_claimants_on_colliding_write
    target_dir: unit_tests/hooks/
    framework: unittest
    type: behavioral
    description: "Fed a real PostToolUse payload for a write that introduces a contested identifier into a real on-disk collection, the hook exits 0 with a block decision whose reason names the contested identifier, every claimant path, and a free identifier."
  - name: test_hook_emits_nothing_on_non_colliding_write
    target_dir: unit_tests/hooks/
    framework: unittest
    type: behavioral
    description: "The same hook on a write introducing no contested identifier exits 0 with no block decision and no dispatch instruction — the negative case that the anti-precedent guard fails."
  - name: test_injected_instruction_is_imperative_and_names_one_agent
    target_dir: unit_tests/hooks/
    framework: unittest
    type: behavioral
    description: "The injected reason contains a single imperative dispatch instruction naming business-analyst and one task, with no advisory hedging — the property the model-mediated dispatch depends on."
  - name: test_hook_does_not_revert_the_authors_write
    target_dir: unit_tests/hooks/
    framework: unittest
    type: behavioral
    description: "After the colliding-write run, the file the author wrote is still present on disk with its written content — the block channel is used to inject, not to undo."
  - name: test_hook_runs_from_the_deployed_claude_hooks_layout
    target_dir: unit_tests/hooks/
    framework: unittest
    type: integration
    description: "After build.py, the hook is invoked as .claude/hooks/<name>.py with a real payload and produces the block decision — proving the shared uniqueness module resolves from the hooks layout. A crash here would otherwise present as a silent clean write."
  - name: test_business_analyst_dispatch_is_observed_in_a_live_session
    target_dir: unit_tests/hooks/
    framework: unittest
    type: e2e
    description: "In a recorded live session that writes a colliding record, a business-analyst invocation is observed in debugging/logs/agent_telemetry.jsonl after that write and before unrelated work; the matching clean-write session records no such invocation. This is the dispatch-itself evidence the coverage note demands — no weaker assertion substitutes for it."
test_rationale: |
  The coverage note rules out every assertion that a dead guard also passes: output containing
  the string "business-analyst", a defined dispatch function, or correct registration. So the
  contract is split deliberately. Five descriptors pin the deterministic half — the hook's
  emitted decision, its silence on a clean write, the imperative form of the instruction, the
  non-reverting disposition, and the deployed-layout resolution — because a PostToolUse hook
  that crashes emits nothing, and emitting nothing is exactly what a clean write looks like, so
  this is the one stage where a broken guard is completely invisible. The sixth descriptor is
  the sufficient condition and cannot be replaced by any of the first five: it observes an
  actual business-analyst invocation in the telemetry sink, in a session that really wrote a
  colliding record, and it requires the paired clean-write session so that an unconditional
  dispatch — the anti-precedent's failure mode — fails the test rather than passing it.
