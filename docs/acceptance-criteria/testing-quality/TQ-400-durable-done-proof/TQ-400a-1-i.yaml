id: TQ-400a-1-i
components:
  - testing_quality
  - ac_store
title: "A record that lapsed silently after mark time is caught by the sweep"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a store containing a finished record that reproduces the historical lapse
    case — marked finished, its stated criterion no longer true, and the tests it
    named never written — and that record appears in no pending change,
  When the honesty sweep runs over that store,
  Then the record is reported as unproven,
  And the reported cause names the absence of any passing test carrying its
    coverage tag,
  And the change-scoped check run over the same store does not report that record
    at all, because it is in no pending change,
  And the difference between the two results is attributable to scope alone, both
    having been given the same store and the same test tree.
depends_on:
  - TQ-400a-1
