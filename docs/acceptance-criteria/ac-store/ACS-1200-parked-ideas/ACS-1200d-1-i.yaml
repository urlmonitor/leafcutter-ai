criteria: |
  Given a tree that has completed the un-park transition — marker removed and
    covered_by populated with its feature-level children — but that has no
    record at level L2 or below anywhere under it,
  When the store-wide orphan scan is executed as a process over the store,
  Then the tree is reported as un-parked and not yet broken down, as a state of
    its own, naming the root record,
  And it is not reported in the parked section,
  And it is not reported as an orphan, because its back-links are present,
  And the buildable-work scan returns no record from that tree,
  And leaving the tree unchanged does not restore the marker: a record only
    becomes parked again when an author sets the marker again.
