test_required: true
test_rationale: |
  The failure being closed is a pointer that silently stops resolving, so the fixture must
  contain a deliberately broken pointer and the assertion must be on the message naming the
  holder, the position and the target - a bare non-zero outcome does not tell an adopter which
  of fourteen journeys to open. The resolved-count clause needs its own varying-population
  assertion, because a checker that walks zero pointers reports no breakages and looks clean.
test_spec:
  - name: test_broken_pointer_is_reported_with_holder_position_and_target
    target_dir: unit_tests/product_truth/
    description: "A journey step pointing at an acceptance criterion that does not exist is reported naming the journey, the step and the missing criterion."
    type: integration
    angle: failure
    framework: unittest
  - name: test_intact_pointers_are_not_reported
    target_dir: unit_tests/product_truth/
    description: "A store in which every pointer resolves produces no pointer report."
    type: integration
    angle: criterion
    framework: unittest
  - name: test_resolved_pointer_count_rises_with_the_number_of_pointers
    target_dir: unit_tests/product_truth/
    description: "Adding one pointer raises the stated resolved count by exactly one."
    type: integration
    angle: seam
    framework: unittest
notes: |
  Sub-surface 1 of the four the L1 lists (citations). This is the TIER-1 FLOOR of the pair
  UXP-700c-1 / UXP-700c-2, following the tiered shape recorded in the BA memory for GE-111b:
  the floor asks only "does the target exist", needs no external tooling, and is always on;
  UXP-700c-2 is the content tier that asks whether the target still says what the record claims.
  The floor must not be made to depend on the content tier, or a tooling gap disables both.
target_epic: EPIC-WhatYourProjectSaysAboutItselfIsTrue,And
