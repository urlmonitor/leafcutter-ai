title: "Work withheld for want of approval is withheld from the held list too, not moved into it"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the store holds a piece of leaf-level work that is active and still to do,
    whose recorded approval is draft, and which names as its prerequisite another
    piece of work that is not finished — so that if it were admitted at all it would
    be reported as held, with that prerequisite named,
  When the queue is asked which work is ready to be picked up,
  Then the piece appears neither among the work offered nor among the work reported
    as held,
  And neither the count of work offered nor the count of work reported as held
    includes it.
depends_on: [ACD-400c-1]
