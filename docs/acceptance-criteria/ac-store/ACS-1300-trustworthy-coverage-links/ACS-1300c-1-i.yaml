notes: |
  A NEGATIVE CONTROL FOR A NEGATIVE CONTROL, and it exists because ACS-1300c-1 has one
  weakness the pairing does not cover: a check that is correct but never confronted with
  a real violation is indistinguishable from a check that cannot detect one. This AC
  confronts it, using a violation that is not hypothetical — it is sitting in the same
  directory, it is named as a reuse candidate by this tree's own L0 and L1, and it works.

  THE TWO-BUILD COMPARISON IS THE DESIGN. Asserting only that the forbidden build fails
  leaves open that the check fails on everything; asserting only that the permitted build
  passes leaves open that the check fires on nothing. Running both from the same starting
  bytes, and requiring the same coverage entries restored in each, isolates the write
  path as the only difference.

  THIS IS ALSO THE MOST LIKELY WAY THE REFUSAL GETS BROKEN IN PRACTICE. Nobody sets out
  to auto-promote finished state. Somebody reuses a working backfill because the L0 told
  them to reuse rather than rewrite, and the promotion arrives as a side effect of good
  advice followed carefully. The anti-duplication instruction and the refusal point in
  opposite directions at exactly one function, and this record is where that collision is
  written down and made to fail loudly.

  IMPLEMENTATION NOTE FOR WHOEVER TESTS THIS: the forbidden build need not be shipped. It
  is a fixture — the repair's write step pointed at the other apply function — and it
  exists only for the duration of the test that proves the check catches it.
