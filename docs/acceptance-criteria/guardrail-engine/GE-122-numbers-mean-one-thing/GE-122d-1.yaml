  - path: docs/architecture/adrs/ADR-013-portable-skill-script-deployment-boundary.md
    relationship: describes
    status: exists
    relevance: "Governs which scripts are portable and therefore which deploy paths a shared module must satisfy to be importable from every stage's layout."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The shared element is GE-122a-1's evaluation module, imported by all three stage entry points. Each stage owns only its own adaptation — reading its input, rendering its output and choosing its disposition — and none may hold a copy of the rule. A stage-specific special case is the thing this criterion is written to make fail."
  - "THE HARD PART IS DEPLOY-PATH, NOT DESIGN. The three stages run from two different deployed layouts: the authoring-time hook from `.claude/hooks/`, the commit-time and build-time stages from `.leafcutter/scripts/commit_guardian/`. One shared module must be importable from BOTH, which means it must appear in both deploy paths in `scripts/build_phases.py` (or be placed where both already resolve). Getting this wrong presents as the authoring stage silently emitting nothing while the other two work — a three-way disagreement in exactly the shape this criterion forbids, and invisible to source-tree unit tests."
  - "Follow the precedent the `AC store valid` job records: the build stage should invoke the commit-time gate THROUGH pre-commit rather than calling the script directly, 'so the merge-time and commit-time rule sets are literally the same config and cannot drift apart'. That collapses two of the three stages to one configuration by construction, leaving only the authoring stage to reconcile."
  - "The single-rule-change test needs a real, minimal extension seam — the rule's recognised number shapes must be data or a single named constant, so that 'made in ONE place' is a meaningful instruction rather than a matter of the tester's judgement about which edit counts. Name that seam in the implementation."
  - "Verify by executing all three stages, never by comparing registrations. Three registrations pointing at one script name is satisfied by three stages that all silently no-op — and this repository already holds guards that are registered nowhere and guards that are deployed and never invoked, so the presence of a name proves nothing."
  - "Error handling per CLAUDE.md Rules 1-4; the per-stage dispositions on cannot-establish and internal-defect conditions come from GE-122d-3 and GE-122d-3-i and are the ONLY sanctioned differences between the three stages' behaviour. Any other divergence fails this criterion."
test_spec:
  - name: test_three_stages_agree_on_the_same_contested_collection
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "All three stages are actually invoked against one fixture collection holding exactly one contested number, and all three name the same contested number and the same set of claimant paths."
  - name: test_single_rule_change_propagates_to_all_three_stages
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "A number shape previously accepted is made contested by an edit in ONE place; all three stages are re-invoked with no second or third definition edited, and all three report the newly contested case."
  - name: test_no_stage_reports_clean_while_another_reports_contested
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "Across a set of fixture collections spanning clean, contested and mixed-namespace cases, no collection produces a clean verdict at one stage and a contested verdict at another."
  - name: test_shared_module_imports_from_both_deployed_layouts
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "After build.py, the shared evaluation module imports successfully both from .claude/hooks/ and from .leafcutter/scripts/commit_guardian/ — the deploy-path failure that would otherwise present as the authoring stage silently disagreeing."
  - name: test_build_stage_invokes_the_commit_stage_config_not_a_copy
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    description: "The CI gate runs the commit-time hook through pre-commit rather than invoking the script directly, following the AC store valid precedent, so the two stages cannot hold different configurations."
test_rationale: |
  Every descriptor invokes the stages rather than inspecting them, because the coverage note is
  explicit that identical registration does not establish identical evaluation and passes on
  three stages that all no-op. The deployed-layout descriptor is the one a designer would omit
  and the one most likely to fail: the three stages run from two different deploy destinations,
  so a correctly-shared module can still be unimportable from one of them, and at the authoring
  stage that failure is silent — no decision emitted is indistinguishable from a clean write.
  The through-pre-commit descriptor captures the structural half of the guarantee that the AC
  store valid job already proved works, so the only reconciliation left is the authoring stage.
