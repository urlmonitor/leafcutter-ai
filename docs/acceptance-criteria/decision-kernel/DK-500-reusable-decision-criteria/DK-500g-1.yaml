id: DK-500g-1
title: Published categories are imported into the knowledge graph as their own reviewed kind, beside unchanged decisions
component: decision-kernel
components:
- decision_kernel
- knowledge_management
level: L2
status: active
readiness: approved
req_status: draft
priority: high
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given a commit holding the published categories cat-1dc11c5a2ffa7310, cat-d15d52392d7aa94c, cat-52b16c7b5a23106f, cat-d6ce5f78c181ebd1 and cat-1df63b670163b54e, the retired cat-40cc613f737e3323 and the published decisions their members name,
  When the knowledge sync builds a new generation from that commit,
  Then each of the six categories becomes exactly one node keyed by repository id, kind criterion_category and category id,
  And each member pair links its decision, that decision's criterion and the category, so cat-1dc11c5a2ffa7310 has three such links,
  And cat-40cc613f737e3323 is linked to cat-d15d52392d7aa94c as replaced by it, and a broader category, where one is set, is linked from the narrower one,
  And the staged cat-6c3eb4f2af148922 and the candidate cat-73d233fc8b15c735, which are not in the commit, do not appear,
  And the generation is validated and published as a whole,
  And every decision node and its fields are the same as in a generation built from the same commit without categories.
depends_on:
- DK-500g
- DK-500c-2
covered_by:
- DK-500g-1-i
- DK-500g-1-ii
implemented_by: []
assigned_agent: python-coder
estimated_complexity: L
delivers_to:
  agent: python-coder
  contract: 'Per generation: one CriterionCategory node per published or retired category keyed (repository_id, criterion_category, id) with name, title (pref_label), lifecycle_stage and authored fields; per member pair Decision -[HAS_CRITERION]-> member criterion (criterion_id, question, priority) -[IN_CATEGORY]-> CriterionCategory; CriterionCategory -[REPLACED_BY]-> CriterionCategory and -[BROADER]-> CriterionCategory. Consumed by the two registered queries (DK-500g-2, DK-500g-3).'
expects_from:
  ac_id: DK-500c-2
  contract: Published category records docs/criteria/<id>.yaml at the commit being projected.
change_target:
- code
- schema
risk_surface: contract_boundary
it_requirements:
- 'A new reviewed native kind, criterion_category, is added to the finite native reader registry (knowledge/native_types/registry.py) with its own reader module and pinned schema asset, following the Decision kind''s contract: validate_metadata and extract, strict red and green receipts, mutation checks and a reviewed field inventory at reports/native-fields/code-CriterionCategory.json, as the field report of the Decision kind does for decisions. It reads docs/criteria/*.yaml from the immutable commit only.'
- Node identity is (repository_id, 'criterion_category', id) for published and retired categories; the readable name is the id and the title is the pref_label; complete authored fields become native properties. The generated index is not imported; its freshness is an upstream check, as for decisions.
- 'Links: for each member pair, a path Decision -> criterion -> CriterionCategory that carries the criterion id and the decision''s question. IT PO default: a member-criterion entity keyed (repository_id, ''decision_criterion'', ''<decision_id>#<criterion_id>'') with HAS_CRITERION and IN_CATEGORY relationships. A typed relationship carrying criterion_id is acceptable only if the projection''s relationship contract supports properties and both queries'' answer fields stay the same. REPLACED_BY and BROADER link categories; every relationship type is allowlisted uppercase.'
- 'Cross-record validation inside the build: members name decisions in the same commit whose criteria carry the criterion with a matching question (shared wording rule); replaced_by and broader targets exist; labels and pairs are unique among non-retired categories. Any failure fails the whole generation (DK-500g-1-i).'
- 'The Decision kind is read exactly as before: every Decision node''s properties are identical to a build without the new kind (metadata_exact and payload_exact, as in the 2026-10-03 Aura decision readback report).'
- Default imports include the new kind; on an existing published identity, the explicit native refresh performs the scope expansion.
- A real Neo4j build (tests/knowledge_live) is required before claiming server compatibility.
test_required: true
test_spec:
- name: test_each_category_one_node_keyed_by_repository_kind_id
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Each of the six committed categories becomes exactly one node keyed by repository id, criterion_category and its id.
- name: test_member_pairs_link_decision_criterion_category
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Each member pair links decision, criterion and category; cat-1dc11c5a2ffa7310 has three such links.
- name: test_replaced_by_and_broader_links
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: cat-40cc613f737e3323 links to cat-d15d52392d7aa94c as REPLACED_BY, and a set broader is linked from the narrower category.
- name: test_staged_and_candidate_absent
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: cat-6c3eb4f2af148922 and cat-73d233fc8b15c735, which are not in the commit, do not appear.
- name: test_generation_validated_and_published_whole
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The generation is validated and published atomically as one generation.
- name: test_decision_nodes_unchanged_by_categories
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Every Decision node and its properties equal those of a generation built from the same commit without the new kind.
- name: test_live_generation_includes_categories
  target_dir: tests/knowledge_live/
  framework: pytest
  type: integration
  angle: deployed
  description: Against a real Neo4j, a sync of the fixture commit publishes the category nodes and links and reads them back.
test_rationale: Build real generations through the knowledge sync and registered-operation entry points from a fixture commit (offline fixture backend), and assert node identities, links and answers against the category records of that commit; a live Neo4j test proves server compatibility. Unit tests of the reader alone would not prove that the Decision kind is unchanged in a full generation.
