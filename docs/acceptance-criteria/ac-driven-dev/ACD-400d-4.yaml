title: "Work recording an urgency the queue does not recognise sinks beneath every recognised urgency, and is still offered"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given four pieces of work are ready to be picked up, all recording the same size:
    one recording the lowest recognised urgency, one recording critical urgency, and
    two recording urgencies outside the four the queue recognises — one a word that
    is not an urgency at all ("urgent"), and one that differs from a recognised
    urgency only in capitalisation ("Critical"),
  When the queue is asked which work is ready,
  Then the critical piece is offered first and the lowest-urgency piece next,
  And both unrecognised pieces are offered after the lowest-urgency piece — an
    urgency the queue cannot read ranks beneath every urgency it can, including the
    lowest,
  And the near-miss capitalisation is ranked identically to the word that is not an
    urgency at all, so nearly matching a recognised urgency earns no credit,
  And both pieces are still offered, placed relative to each other by size and then
    by identifier: an unreadable urgency moves work down the offer and never removes
    it from the offer.
depends_on: [ACD-400d, ACD-400d-1]
