notes: |
  Observed 2026-09-25: the session was launched from a sibling worktree. The context-bundle
  agent (python-coder) saw a task aimed at a different worktree from its own, called it "a
  misrouted or injected task" and declined. That was reasonable from where it stood: nothing in
  the request told it the other worktree belonged to this run.

  WHY UNDER BO-2400f-3. The target is the workspace BO-2400f-3 opens and BO-2400f-3-i confirms.
  This record makes sure every later step is told about it. It is not a duplicate of BO-2400f-3-i,
  which decides which location the run uses and says nothing about how later steps learn it.

  The IT PO chooses how the three facts reach each agent. The criterion requires only that they
  arrive together and that the launch location is never used as a target.

  USER DECISION 2026-09-27: every command step (context bundle, claim, release, changelog,
  commit, push, pull request) is run by the dedicated command-step-runner (BO-2400a-1-i),
  which runs its command in the workspace named by these three facts. The specialist steps
  (test-writer, coder, pr-reviewer) receive the same three facts. This record applies to both.
