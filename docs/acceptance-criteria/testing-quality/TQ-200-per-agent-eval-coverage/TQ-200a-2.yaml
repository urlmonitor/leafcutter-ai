it_requirements: |
  Three scoring modes keyed on output type: LABEL, ARTIFACT, MARKUP. Each eval set
  carries its output type so the shared runner (TQ-200b-1) dispatches to the right
  scorer. LABEL is fully deterministic; ARTIFACT and MARKUP combine deterministic
  assertions with an LLM/visual judge.
