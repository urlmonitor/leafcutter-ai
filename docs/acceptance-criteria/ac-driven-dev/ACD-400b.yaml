notes: |
  PARTIAL SUPERSESSION — thin-ticket pivot (2026-08-11, origin_agent: BrainCandy).
  This L1's premise — "the generator produces a fully WIRED ticket" (verbatim criteria
  body + per-ticket agents map + Agent Contracts + sign-offs) — is replaced by the
  single-source model (L0 ACD-1600, esp. ACD-1600a thin ticket) and the AC-as-mini-ticket
  model (ACD-1800c: the ticket is a grouping container, not the unit of work). Already
  superseded children: ACD-400b-1 (verbatim body + agents map -> ACD-1600a-1) and
  ACD-400b-5 (Agent Contracts in ticket body -> ACD-1600a-2). ACD-400b-4's
  sign-offs-in-ticket clause is superseded (sign-offs move onto the AC, ACD-1800b).
  Carry-forwards remain ACTIVE and now attach at AC level: ACD-400b-2 (implemented_by
  traceability -> reframed by ACD-1800d) and ACD-400b-3 (idempotency / no duplicates ->
  reframed by ACD-1800e).
