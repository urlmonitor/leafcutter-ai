  Gap G6 (part 1): retire close-worktree's remove-without-force path and worktree-agent's
  removal. finalize Step 7's confirmation gate is a workflow script, not a prompt, and is
  split into BO-4400a-3-i for a different implementer.

  Q8 DECIDED 2026-10-09 (BrainCandy, see BO-4400 notes): no confirmation token for a
  holds-nothing workspace -- the verdict is the safety check. That is why "never asks for a
  yes" holds for done-1 and why open-1 is refused rather than confirmed.

