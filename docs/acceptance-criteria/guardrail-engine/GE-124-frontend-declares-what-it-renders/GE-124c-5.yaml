notes: |
  Produced for the `sequence-diagram` entry in GE-124c's
  `documentation_triggers`. The PO's reason: the check sits between the staged
  set, the shared resolver and the commit, and THE ORDERING IS WHAT MAKES THE
  FOUR VERDICTS DISTINGUISHABLE.

  The two extra clauses are the ordering facts most likely to be got wrong by
  someone reading the code alone: a downgrade that is drawn as an additional
  outcome invites an implementation where an opt-out finding sits beside a block
  finding — which the mock-data artifact forbids outright — and a
  deduplication step drawn in the wrong place produces the double-report
  GE-124c-1-i rules out.

  IT-PO NOTE (2026-08-25). Sequencing: this diagram describes an implementation
  that GE-124c-1 through GE-124c-3 create. Drawing it first is fine and probably
  useful, but its participant-existence test cannot pass until those modules
  exist — schedule it after GE-124c-1, or accept a red test in the interim and
  say so.
