it_requirements:
  - >-
    FLOW SURFACES: requirements authoring (templates/workflows-js/plan-feature.js), the fast lane
    (fast-lane-ship.js, which /fast-lane-build drives), the feature build (build-feature.js) and its
    finalize (finalize-feature.js), and the quick fix (quick-fix.js, the primary driver of /quick-fix). Ship
    is only prose (templates/skills/ship/SKILL.md, which today clears with remove --path). It is owned by
    llm-expert and is companion work, not this agent's surface. The companion change: ship sends remove
    --kind feature --slug <name> (the identity its step 1 already locates by) through the absolute deployed
    maker path, relays the door's answer unchanged, and keeps no other removal instruction. It is its own
    llm-expert record, BO-4400g-4-ii (user decision D4, 2026-11-16), an L3 under this record because
    BO-4400g is at its five-child cap.
  - >-
    ONE REQUEST BUILDER: every flow builds its clearing request through the one shared helper in
    templates/workflows-js/_shared/workspace-answer.js. The helper gains a name-based form beside
    workspaceRemoveCommand(path) and takes the same work identity (kind and short name, or line-of-work
    name) the flow used to obtain the workspace. No flow composes a remove command of its own, passes --path,
    or takes the work's location from an earlier answer, the target argument or agent prose.
  - >-
    THE COMMAND (settles the planner note under TIMING): every flow except finalize sends the per-work mode of
    BO-4400g-2, <maker> clear-landed --kind K --slug S (or --branch B), to shell-runner as its one clearing
    command. That mode applies the landed rule with no idle threshold: merged work is cleared through the
    door, a workspace with no commit of its own and nothing unsent is cleared at once (BO-4400a-1-i), and
    pushed but unmerged work is kept as not_on_main. Its one-work answer carries the door's own remove answer
    when it clears. Finalize step 7 runs after finalize's own merge step, so its clearing request is the door's
    remove by name (remove --kind K --slug S), carried in the worktree-agent request beside BO-4300g-3's
    removal_authorization. worktree-agent's remove action (BO-4300g-1, todo, llm-expert) issues remove by that
    name; that is a note for BO-4300g-1's builder, and its criteria do not change.
  - >-
    AUTHORIZATION, BUILT ON BO-4300g AND NOT RESTATED: a flow reaches the door only through a dispatch path
    that BO-4300g allows. Any dispatch to a removal-capable agent carries removal_authorization exactly as
    BO-4300g-1 defines it, built only from a definite ok answer of a maker locate by the same name (the
    BO-4300g-3 pattern), and it passes the BO-4300g-2-i repo-wide check. Finalize step 7 keeps BO-4300g-3's
    locate and authorization unchanged; only the door request it leads to takes the name form.
  - >-
    WHO CLEARS, DECIDED (user decision D1, 2026-11-16, option B of the former open question): an end-of-run
    clear in every flow except finalize sends the exact name-based clearing command to shell-runner, never to
    worktree-agent or any removal-capable agent. That one command, naming the flow's own work and no location,
    is itself the caller's authorization for exactly that one workspace; BO-4300g, BO-4300g-2 and BO-4300g-2-i
    are amended to state this exception. Finalize step 7 keeps BO-4300g-3 unchanged (see AUTHORIZATION above).
  - >-
    TIMING, DECIDED (user decision D2, 2026-11-16): a flow clears only after its pull request has merged, by
    the landed rule of BO-4400g-2 applied to its one workspace, never a second rule. A flow that ends before
    its pull request is merged clears nothing: its workspace is kept with reason not_on_main and left as it is
    for the landed-work pass, and the flow's final result carries the answer that says it was kept and why.
    BO-4400a-1 is amended to the same timing. The one exception (user decision Q2, 2026-11-16): the rule's
    idle thresholds (7 days, and 14 days for pushed but unmerged work, BO-4400g-2-v) guard only the
    unattended pass, so a flow that ends with no commit of its own and nothing unsent clears its own
    workspace at once (BO-4400a-1-i). The door's plain remove counts a pushed line as sent, so the command a
    flow sends applies the landed rule without its idle thresholds: the per-work clear-landed of THE COMMAND
    above (decided by the technical planner, 2026-11-16).
  - >-
    ONE CLEARING STEP PER FLOW, SHARED WITH BO-4400a-1: BO-4400a-1 (approved, todo) adds the route-end
    clearing step to requirements authoring, the fast lane, the quick fix and the builds. This record must not
    add a second clearing step beside it. Whichever record is built first adds the single step through the
    shared helper, and the other only changes the request it sends. Build both in one build, after the timing
    decision.
  - >-
    RELAY: the door's answer is relayed verbatim in the flow's final result, one object per BO-4300c-2. A
    refusal is reported as kept, never as success, and is never worked around (BO-4400g-4-i). The no-workspace
    answer of BO-4400g-1-i is reported as already gone, not as a failure. The bounded wait and the
    clearing-not-confirmed outcome of BO-4400a-1 are reused, not redefined.
  - >-
    E2 AND ADR-070: workflow bodies cannot run processes (ADR-030). Every maker command is one plain command
    line with absolute paths, sent through shell-runner (ADR-070 section 2), and each reply passes the section
    5 reply check. Edit templates/workflows-js/ only; the deployed copies come from the build (ADR-001).
  - >-
    EXISTING TESTS that pin the old dispatch sequence or the --path request are updated in the same change,
    never skipped or marked expected-failure: the finalize step-7 drivers of BO-4300g-3 and INF-700a-5-i, and
    the plan-feature dispatch-order test in unit_tests/test_workflow_dual_engine.py.
  - >-
    PROOF RUNS THE DEPLOYED WORKFLOWS under unit_tests/_workflow_engine_harness.py, with label-scripted agent
    replies. The shell-runner stand-in executes the real deployed maker against real temporary repositories
    and a real bare hub, and the pull-request merge is a recording stand-in with no network. The proof
    asserts on the recorded dispatches, the final result and the disk afterwards. It never greps workflow
    source, never spawns build.py (the shared reference layout), and isolates HOME and git config.
test_required: true
test_intent:
  - clause: no folder remains at the location its workspace occupied
    needs_test: true
    reason: A flow that never reaches its clearing step leaves the folder, and the pile-up this family exists for comes back.
  - clause: 'the flow''s final result contains the clearing door''s own answer for that workspace, reporting it cleared'
    needs_test: true
    reason: A flow that removes the folder by its own means leaves no door answer, which is how a second deletion route is caught.
  - clause: the clearing request the flow sent named its work by the same name it used to obtain the workspace, and gave no location
    needs_test: true
    reason: A request rebuilt from a parsed location reintroduces the look-up-parse-resend chain this record removes.
  - clause: the clearing request was made after the work was merged into the main line
    needs_test: true
    reason: A clear placed before the merge would treat a pushed line as sent, and only the recorded order against the hub's merge shows it.
  - clause: 'no flow other than finalizing dispatched an agent whose registered abilities include removing a workspace or deleting a branch: each of their clearing requests was the one clearing command, run exactly as given'
    needs_test: true
    reason: A flow that routes its clear to worktree-agent, or hands shell-runner a changed command, breaks the user's decision D1 and the BO-4300g bound.
  - clause: 'finalizing''s only such dispatch was its step-7 workspace removal, carrying beside its clearing request the authorization that names exactly its own workspace and line of work'
    needs_test: false
    reason: BO-4300g-2 counts finalize's removal-capable dispatches and BO-4300g-3 proves the step-7 authorization, so a test here would repeat theirs.
  - clause: the workspace of "fastlane/tq-200d-4" still exists, identical to its state when its pull request was opened
    needs_test: true
    reason: A flow that clears on a pushed but unmerged line would remove it, which is the timing the user decided against.
  - clause: 'the flow''s final result reports that workspace as kept because its work is not yet on the main line'
    needs_test: true
    reason: The kept reason must come from the real one-work answer, or the person cannot tell kept from failed.
  - clause: the workspace of "fastlane/tq-200d-4" is cleared
    needs_test: true
    reason: A workspace a flow kept must still be reachable by the landed-work pass, or it is never cleared.
  - clause: 'no step of the fast lane, or of any other flow, was run between the flow''s return and that clearing'
    needs_test: true
    reason: The clear must come from the pass alone, not from a flow that has to be run again.
delivers_to:
  - agent: python-coder
    contract: >-
      Every flow's clearing request is built by the one shared helper in
      templates/workflows-js/_shared/workspace-answer.js from the flow's own work identity (kind and short
      name, or line-of-work name; never --path), and the door's answer is placed verbatim in the flow's final
      result (one BO-4300c-2 object): ok means cleared, a refusal means kept, and the BO-4400g-1-i
      no-workspace answer means already gone. Consumed by BO-4400g-4-i.
expects_from:
  - ac_id: BO-4400g-2
    contract: >-
      The per-work command clear-landed --kind K --slug S (or --branch B), applying the landed rule with no idle
      threshold to one work, answering in the clear-landed shape: cleared (carrying the door's own remove
      answer), kept with reason not_on_main or holds_unsent_work, or already_gone.
  - ac_id: BO-4400g-1
    contract: >-
      remove by work name (--kind/--slug or --branch) through the door, with ok, refusal and no-workspace
      answers per BO-4400g-1 and BO-4400g-1-i; finalize step 7 uses this form.
  - ac_id: BO-4300g-1
    contract: >-
      removal_authorization = {workspace_path: string (absolute), branch: string} in the dispatching
      workflow's own request to a removal-capable agent; workflow dispatches fill both fields (BO-4300g-2-i).
  - ac_id: BO-4300g-3
    contract: >-
      Finalize step 7 dispatch (label step-7-remove-worktree) carrying removal_authorization built from a fresh
      maker locate by the run's kind and slug.
