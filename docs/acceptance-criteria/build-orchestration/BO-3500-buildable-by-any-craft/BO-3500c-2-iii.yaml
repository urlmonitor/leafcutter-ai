title: "Proof for a screen: it is loaded and driven, and the described result is observed on the running screen"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a member whose artifact is a screen,
  When its proof is established,
  Then the screen is loaded and rendered as part of establishing the proof,
  And establishing it requires no service to be started and no network address to be
    reachable — the screen is rendered within the run itself,
  And the interaction the requirement describes is performed against the running
    screen,
  And the result the requirement describes is observed on the running screen after
    that interaction.

  Given a requirement whose described result can be observed only with a live service
    running,
  When a run resolves a group containing that member,
  Then it is refused before any craft is dispatched, on the ground that this proof
    cannot be established here,
  And the run does not fall back to a weaker check and does not finish the member on
    the strength of the screen's source existing.

  Given a screen whose source was produced and which is never loaded,
  When its proof is established,
  Then the proof fails — a screen that exists as source and was never rendered is not
    evidence that anything was delivered.

  Given a screen that loads and renders but on which the described interaction produces
    no observable result,
  When its proof is established,
  Then the proof fails, naming the interaction and the result that was not observed.
