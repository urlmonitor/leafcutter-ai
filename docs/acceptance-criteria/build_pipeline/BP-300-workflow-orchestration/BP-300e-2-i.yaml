change_target: pipeline
risk_surface: contract_boundary
notes: >-
  Test contract intent: unit-testable against the tolerant agent-reply reader with an
  input holding two distinct top-level JSON blocks separated by prose, asserting the
  returned value equals the FIRST block. Documents the deterministic tie-break rule so a
  reply that mentions an illustrative second payload never silently swaps the result.
