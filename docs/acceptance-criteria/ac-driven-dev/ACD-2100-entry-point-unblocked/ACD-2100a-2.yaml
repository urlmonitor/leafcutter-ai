test_rationale: >-
  The existing tests for this script invoke it from a tmp_path fixture that IS a git
  repository, so the default anchor always resolves and the fallback is never reached.
  Any test built on that fixture passes against the unfixed code and is therefore not
  evidence. The Given here has to be constructed for real: a directory that is genuinely
  not a repository, with no repository among its ancestors, and the script copied
  outside the repository it is pointed at. Running the script as a subprocess rather
  than importing the resolver is what makes the reachability claim real -- an imported
  resolver can be correct while the command-line path still anchors on __file__. A test
  that greps the source for a resolution helper proves nothing (CLAUDE.md, "Gate /
  Workflow ACs -- Verify Behaviorally").
delivers_to:
  - agent: python-coder
    ac_id: ACD-2100a-2-i
    contract: "A repository resolver with an ordered contract: explicit caller-supplied location wins; otherwise the anchor; otherwise a bounded search of immediate subdirectories. The search returns its full candidate set, so the ambiguous case is representable rather than collapsed to a first hit."
  - agent: python-coder
    ac_id: ACD-2100a-5
    contract: "A setup step that exits successfully from a working directory that is not a repository, with the created worktree under the resolved repository."
