req_status: active
work_status: todo
criteria: |
  Given the SKILL.md contains the "Agent Consumption Protocol" section
    (from ACD-300f-1),
  When citation and deduplication subsections are added to the protocol,
  Then the citation subsection prescribes the format:
    "[<surface>] <title>" (e.g., "[agents] python-coder" or
    "[docs] architecture/components/build-orchestration.md")
    for citing overlapping nodes to the user,
  And the deduplication subsection states:
    "When a knowledge-graph node overlaps with a behavior the consuming agent
    is about to author or enrich, the agent presents the overlap to the user
    citing the node in the prescribed format. When the overlap is with an
    existing AC, the agent includes the AC's id and title in the warning
    (e.g., 'ACD-200a-1 already specifies this behavior'). When the overlap is
    with a doc or ADR, the agent adds the path to the new AC's doc_links
    with relationship: context",
  And the subsection states:
    "Do not block or halt when overlap is found — present the overlap, then
    continue with the authoring workflow",
  And a doc_links population rule states:
    "When knowledge-query returns doc or ADR nodes related to the component,
    add their paths to the AC's doc_links field with relationship: context
    if they are not already present".
