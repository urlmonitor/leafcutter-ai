criteria: |
  Given the file-aware step finds that a requirement assigned to python-coder describes
    behaviour that lives partly in a Python helper and partly in an agent template,
  When it reports that finding,
  Then the requirement's assigned specialist, split, technical requirements, contracts and
    criteria are unchanged by the step,
  And the finding reaches the technical planner, whose next pass either reassigns, splits,
    or states why the assignment stands,
  And the requirement is not offered for approval while such a finding has no recorded
    decision.
