it_requirements:
  - "When an agent's card is absent or its path does not resolve, SKIP the mirror comparison for that agent (fail-open no-op) -- never report a card<->registry mismatch caused purely by the card's absence, and never fail the build for a missing card."
  - "The skip must be observable (advisory note naming the skipped agents); the pre-existing registry-internal spawn-consistency check (INF-600g) must continue to run regardless of card presence."
  - "PORTABLE SURFACE: this card-absent fail-open lives in the same EXISTING hook (templates/scripts/commit_guardian/hooks/check_agent_spawn_consistency.py) extended in INF-600l-1; the card-absent no-op is what keeps the extended check harmless in a consumer that has a registry but has not generated cards. ADR-001 build.py round-trip parity applies."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
