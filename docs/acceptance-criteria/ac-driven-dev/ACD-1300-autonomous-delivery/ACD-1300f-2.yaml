  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_external_dependency_requires_target_completion
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Draft PR and reviewed source branch fail to release EXPORT; verified target-branch completion
    after merge releases it.
  covers:
  - ACD-1300f-2
- name: test_background_worker_parent_membership_does_not_deadlock_topology
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Unfinished L1/L2 structural parents coexist with runnable prerequisite-ordered leaves;
    no fabricated parent execution required.
  covers:
  - ACD-1300f-2
