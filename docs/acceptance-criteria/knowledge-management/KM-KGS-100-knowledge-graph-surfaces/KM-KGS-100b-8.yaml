it_requirements:
  - "This is the end-to-end safety scenario proving the cache is never a source of truth: a hand-edit with NO refresh event fired must still be caught by the mandatory per-read check (KM-KGS-100b-6) and healed via the surface-scoped rebuild (KM-KGS-100b-7)."
  - "Verified with a hand-edited real surface file and no post-commit/build/session refresh in between; the returned graph must equal a live full parse of the current tree (never the pre-edit cached graph)."
  - "Upholds the KM-KGS-100d always-real invariant: no index-backed read may return a node/edge that contradicts current on-disk sources — the only observable cost of the missed event is extra rebuild latency on that one read."
test_spec:
