readiness: reviewed
priority: medium
title: "A fast triage agent classifies the request and checks for duplicates before authoring begins"
component: ac-driven-dev
level: L1
status: active
req_status: active
work_status: done
criteria: |
  Before any heavyweight authoring agent is invoked, a Haiku-tier pre-triage
  agent reads the user's request and the existing AC store to determine:
  (a) whether existing ACs already cover the request (duplication check),
  (b) which routing path to follow based on the nature of the request.
  The triage runs in under 3 seconds and produces a structured routing decision
  that the orchestration workflow consumes. The user never interacts with the
  triage agent directly — they see only its outcome (the routing recommendation)
  presented for optional override.
depends_on: [ACD-300]
doc_links: []
assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "Triage must complete in under 3 seconds (Haiku-tier model, not Opus)"
  - "Triage must be stateless: no persistent storage between invocations"
  - "Duplication check must compare against all active ACs in the target component, not just L2s"
  - "Routing decision must include a rationale field explaining the classification"
