notes: |
  WHAT THIS RECORD OWNS, AND WHY IT IS NOT COVERED BY THE DATUM RECORD. A requirement that
  every check carries a declaration is satisfied today by every check that happens to carry
  one, and is silent about the next check, which will be written by someone who has not read
  this tree. Making the declaration a condition of joining is what turns a rule people must
  remember into a rule they cannot avoid — the difference between a family that is compliant
  and a family that stays compliant.

  ANTI-GREP, AND THE ONE PLACE IN THIS TREE WHERE EXISTENCE IS LEGITIMATELY THE SUBJECT. Every
  other record here forbids a criterion satisfiable by asserting that a declaration exists,
  because that reproduces the defect one level up. This record's subject IS existence, at one
  specific moment, and it is safe only because of its final clause: passing this gate places
  a check among those whose refusal has never been demonstrated, not among the protected. If
  that clause is dropped, this record becomes the defect — a family where every check has a
  declaration and none has ever refused anything, reported as fully protected. Implement the
  final clause first.

  THE INHERITANCE CLAUSE IS THE ANTI-LITERAL DISCRIMINATOR. A gate that applies the
  requirement to a set of check identifiers written into it satisfies every other clause and
  fails this one, because the next check is not in the set. The population must be whatever
  the registration surface holds when it is read. This is the same rule GE-120c-6 already
  states for its exemptions, and reusing its mechanism is required rather than optional — two
  independently-maintained vocabularies for the same idea will disagree, and each declaration
  must record which rule it applies to so an exemption from one does not silently become an
  exemption from the other.

  NAMED MUTATION FOR THE FIRST ABSENCE-ASSERTING CLAUSE. "A declaration written only in prose
  beside the check does not satisfy the requirement." ARRIVAL COLOUR: GREEN, vacuously —
  nothing is required today, so nothing is currently satisfied by prose. INJECTION: satisfy
  the requirement from any statement found in the check's own text describing what it
  rejects. Under that injection a check whose description mentions what it refuses is
  admitted with nothing machine-readable to put through it, and this clause must go RED
  naming it; revert must restore it. This is not a straw man — prose beside the check is
  where this repository has repeatedly recorded what a guard does, including one guard whose
  written description claims a remediation it does not perform.

  NAMED MUTATION FOR THE INHERITANCE CLAUSE. ARRIVAL COLOUR: RED — no registration is refused
  today, so a newly registered check without a declaration is admitted. INJECTION, for the
  built state: apply the requirement only to a set of check identifiers written into the gate.
  Under that injection a newly registered check carrying no declaration is admitted while
  every existing one is still policed; the clause must go RED naming the admitted check, and
  return to green on revert. Add the check to a fixture registration surface rather than
  naming a real one, so the assertion does not expire the day that check is declared.

  NAMED MUTATION FOR THE FINAL CLAUSE. ARRIVAL COLOUR: GREEN, vacuously. INJECTION: on
  acceptance at registration, write the check's record as the rejection having been observed.
  Under that injection every newly registered check is reported as demonstrated on the
  strength of its own declaration; this clause must go RED, and it is the same injection
  GE-120f-1's absence-asserting clause carries, deliberately, because it is the single
  substitution that would defeat both records at once.

  DAY ONE. The registration gate arrives on a family most of whose checks carry no
  declaration. Those checks must be brought into line — declared, exempted on a ground the
  exemption rule accepts, or removed — as part of this work rather than after it. Landing the
  gate green by exempting the existing population is the failure this record's child exists to
  prevent, and a postponement is not a ground.

  NO COUNT OF INSTANCES IS STATED OR IMPLIED IN THIS RECORD, per the parent's disputed-count
  rule. How many checks currently carry no declaration is a measurement, not a premise.
