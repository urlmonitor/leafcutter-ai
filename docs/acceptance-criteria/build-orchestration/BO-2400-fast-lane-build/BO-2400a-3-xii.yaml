id: BO-2400a-3-xii
components:
  - build_orchestration
  - testing_quality
title: "The implementation is put back exactly as it was, whatever happens during the mutation proof"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the mutation proof has broken the implementation of UXP-510 in the run's
    workspace,
  When the proof finishes, whether it passes, halts with a named reason, or is stopped
    by an error partway through a test run,
  Then every file the proof changed is returned to its exact pre-proof content,
  And the workspace's tracked and untracked files show no difference from their state
    immediately before the proof began.

  Given the proof cannot confirm that restoration succeeded, because a file still
    differs from its pre-proof content,
  When the run decides its next step,
  Then the run halts with reason mutation_restore_unconfirmed, naming each file that
    differs,
  And nothing is staged, committed or pushed.

  Given any run that used the mutation proof,
  When its commits, staged changes and pull request are inspected,
  Then no broken version appears in any of them,
  And no file outside the run's own workspace was changed by the proof.
depends_on: [BO-2400a-3, BO-2400a-3-x]
