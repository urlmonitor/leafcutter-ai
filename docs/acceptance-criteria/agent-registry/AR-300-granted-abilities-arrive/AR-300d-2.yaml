notes: |
  THE NO-OTHER-AGENT-CHANGES CLAUSE IS A BLAST-RADIUS ASSERTION, NOT TIDINESS.
  A delivery keyed off a shared list rather than the per-agent declaration
  passes the first two clauses while quietly handing the new ability to
  everyone. That failure is invisible in the agent under test and visible only
  in the agents nobody looked at.

  THE NEW-ABILITY CLAUSE CLOSES THE OTHER HALF. An ability added to the project
  in the same edit exercises the resolution path as well as the delivery path;
  granting only pre-existing abilities would leave a design in which the set of
  grantable abilities is itself fixed at some earlier moment.
