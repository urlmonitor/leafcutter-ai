id: BO-2000g-2-i
components:
  - build_orchestration
  - feedback_collector
title: "(not-a-signoff) is comment text only: it is never a feedback writer or category and widens no category's writers"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/build-orchestration/BO-2000-correct-prompts-by-construction/BO-2000g-2.yaml
criteria: |
  Given both copies of the feedback categories file (source and template), after
    BO-2000g-2 has landed,
  When either copy is read,
  Then `not-a-signoff` appears in no category's allowed_writers and is the name of no
    category,
  And neither copy mentions `(not-a-signoff)` in a comment or note as a writer or
    category value,
  And every category's allowed_writers list is identical to its list before
    BO-2000g-2, so ticket-supervisor has been added to none of them.

  Given the feedback submission step is called once with `not-a-signoff` as the
    submitting phase, and once with `not-a-signoff` as the category,
  When each call runs,
  Then each call is refused in the same way as any other unregistered writer or
    unknown category, and no feedback record is written,
  So the value cannot become a way to file feedback, or a sentinel that submission
    honours.
depends_on:
  - BO-2000g-2
