assigned_agent: python-coder
estimated_complexity: S
declares_side_effect: false
package_surface: false
it_requirements:
  - "The speed property is asserted by counting yaml.load invocations from parse_frontmatter, never by wall-clock time."
  - "The reuse is an in-process, size-bounded memo (functools.lru_cache). No file, no environment variable and no module state outside the memo's own storage."
  - "The key is the frontmatter text itself, not a hash of it, so two different texts can never collide."
test_spec:
  - name: test_repeated_text_invokes_the_loader_once
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    angle: discrimination
    surface_invoked: "template_compiler.parse_frontmatter with yaml.load wrapped to count calls, over one text parsed twenty times and over distinct texts"
    description: "Twenty parses of one text call the loader once; N distinct texts call it N times; a text differing by one character is parsed again."
    must_catch:
      - "No reuse at all, so the loader runs once per call."
      - "A key that ignores part of the text, so a different text is answered from the wrong stored parse."
  - name: test_reuse_is_in_memory_only_and_bounded
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    angle: boundary
    surface_invoked: "template_compiler.parse_frontmatter run in a temporary working directory, then the memo's reported size after more distinct texts than its bound"
    description: "Parsing leaves no new file in the working directory or the system temp area under the test's control, and the number of stored parses never exceeds the declared bound."
    must_catch:
      - "A persisted cache file."
      - "An unbounded dictionary."
test_rationale: |
  The discrimination entry is red before the change (the loader runs per call) and
  green after, and it counts the repeated work directly instead of timing it, because
  this host's timings vary by several times with no code change. The boundary entry
  holds the two constraints the reuse was approved under: in memory only, and bounded.
