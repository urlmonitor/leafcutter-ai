id: ACS-400c-2-ii
readiness: approved
priority: high
components:
  - ac_store
title: "A record taken verbatim from a merge parent is not treated as an amendment"
component: ac-store
level: L3
status: active
req_status: active
work_status: done
criteria: |
  Given a merge is in progress,
  And a staged AC YAML file's content is byte-identical to one of the merge parents'
    committed version of that same path,
  When the amended_by audit runs,
  Then the commit is not blocked on that file,
  And no new amended_by entry is demanded for it,
  Because a commit that reproduces a parent's bytes exactly has authored no change
    to that record.

  Given a merge is in progress,
  And a staged AC YAML file's criteria differs from every merge parent's version
    of that path,
  When the amended_by audit runs,
  Then the commit is blocked exactly as it is outside a merge,
  And the error names the file and the amended_by field.

  Given no merge is in progress,
  When an AC YAML file's criteria is changed without a new amended_by entry,
  Then the commit is blocked,
  And this record changes nothing about that path.
