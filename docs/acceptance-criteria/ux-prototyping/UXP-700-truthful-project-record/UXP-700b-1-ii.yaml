level: L3
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a record holding three journeys, zero example datasets and zero screens,
  When the record's checker runs,
  Then it names example data and screens as the types for which it read zero records,
  And it does not name journeys,
  And the outcome it reports is not the outcome for a record that was checked and found sound.
