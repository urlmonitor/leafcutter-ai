criteria: |
  Given the build system defines template categories across four infrastructure
    layers (shim map, output mappings, managed artifact dirs, source manifests)
  When the parity test suite executes
  Then it asserts that every category present in any one layer is also present
    in all other three layers
  And if all four layers agree on the set of categories, the test passes
  And the test covers at minimum the "workflows" category alongside all
    pre-existing categories (commit_guardian, doc_compliance, etc.)
