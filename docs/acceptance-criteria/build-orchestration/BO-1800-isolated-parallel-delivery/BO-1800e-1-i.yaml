  ADR-018 Decision §4 (local, advisory): a pre-commit/pre-push hook refuses commits
  or pushes targeting main. Catches mistakes early but is bypassable (--no-verify);
  BO-1800b is the real guarantee. IT-PO: implement as a commit_guardian hook; keep
  its advisory framing explicit so it is never mistaken for the guarantee.
