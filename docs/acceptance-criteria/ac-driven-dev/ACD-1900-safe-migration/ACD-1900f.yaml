notes: |
  ADR-026 phase_acbuild_3_migration ("Consumer Migration & Legacy Removal"). build.py deploys
  the new artefacts (all hook deps in the deploy-manifest) and warns/refuses on schema_version
  skew; dual-readers (ACD-1900b) are retained >=2 minor releases while in-flight fat tickets
  drain; only then are fat-ticket generation and the legacy-derive path removed, in a dedicated
  release with one full green cycle. Depends on the compatibility bridge (ACD-1900b) and the
  kill-switch/flag (ACD-1900c). References but does NOT supersede the ACD-400b fat-ticket family
  -- governance handles supersession per ACD-1800 notes. RE-HOME CANDIDATE: build-pipeline
  (build.py deploy + skew detection); kept in ac-driven-dev for cohesion.
