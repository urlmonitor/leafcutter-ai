id: BO-2600a-6-iii
components:
  - build_orchestration
title: "With the exclusion switched off, a recorded parent is still walked as before"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the store described in BO-2600a-6 (P-590 recording P-510..P-516 as children,
    P-512 listing P-590 in depends_on),
  When the connected build set for P-512 is resolved without structural-parent
    exclusion (the default),
  Then P-590 is walked as an ordinary prerequisite and the resolved set is identical,
    member for member and in the same order, to the set resolved before the
    recorded-edge rule existed,
  And the recorded-edge rule changes the result only when structural-parent exclusion
    is requested.
depends_on: [BO-2600a-6]
