criteria: |
  Given a ticket whose captured reproduction command cannot be evaluated at dispatch
    time because it errors out or exceeds the re-check time budget,
  When the preflight premise re-check runs before spawn,
  Then the re-check returns an unfit verdict rather than assuming the premise still holds,
  And the dispatch is held back with a reason stating the reproduction could not be
    evaluated (errored or timed out), distinct from a stale-premise reason,
  And no phase agent is spawned.
