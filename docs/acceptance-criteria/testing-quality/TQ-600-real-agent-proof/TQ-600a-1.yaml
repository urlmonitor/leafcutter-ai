  - agent_registry
title: "Switched on, each case asks the agent exactly as the project ships it and passes or fails on one definite check of its own reply"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given the live-dispatch switch set explicitly for one run, locally or in continuous
    integration,
    And a case that declares which registered agent it asks, which acceptance criterion
    it proves, and the request it sends,
  When the case runs,
  Then the request goes to that agent as the repository registers it -- under the
    instructions and the registry entry the project ships, read from the repository when
    the case runs, not a stand-in, a scripted reply or a copy prepared for the test --
    And the case passes or fails on one definite check of the reply that its own request
    returned,
    And no score, threshold, or averaging across cases or repeated runs turns a failed
    case into a passed one.

  Given two switched-on cases that ask the same agent,
    And that agent's shipped instructions changed in place in the repository between the
    first case and the second, with nothing about the mechanism that asks the agent
    changed,
  When the second case runs,
  Then its request is made under the changed instructions, not the instructions the first
    case ran under.

  Given two switched-on cases that ask two different registered agents,
  When both cases run,
  Then both agents are asked through the same mechanism, with no handling that names
    either agent,
    And each case's verdict follows only the reply to its own request.
