notes: |
  FIELD EVIDENCE — workflow run wf_ecb6b1ae-a1c, 2026-09-21, driving
  EPIC-WorkIsOnlyEverMarkedFinishedThroughThe. Resolution returned
  `epic_path: <clone>/tickets/00_inbox/epics/EPIC-WorkIsOnlyEverMarkedFinishedThroughThe`
  while `worktree_path` correctly named the worktree. The drive planned from the clone.

  Observable damage, all from one run:
    - Ticket 01 was `status: done` with `test-writer: signed_off` in the worktree, and
      `status: todo` with `test-writer: failed` in the clone. The drive read the clone,
      re-drove a finished ticket, and halted on the stale failure.
    - Tickets 02-05 were reported as "discovered after planning and not built".
    - The main checkout was left DIRTY on `main`: ticket 01 carried new architect-review
      and adr-author sign-offs and a test-writer failure written at 19:18-19:36, plus an
      untracked `.pending/` directory. Phase agents wrote to main.
    - ~973k subagent tokens spent re-doing completed work.

  The header comment above `toWorktreePath` already stated the intent exactly — "resolve
  may return epic_path / ticket_path as an absolute main-clone path ... Either way we must
  land inside realWorktreePath before passing paths to the planner or phase agents" — while
  the function it introduces returns that very shape unchanged. Intent and implementation
  contradicted each other in adjacent lines, and the contradiction was invisible because
  no fixture ever supplied the shape.

  NAMED MUTATIONS (each turns only this record's tests red):
    M1 — pass resolve's epic_path to the planner unchanged (the incident). Caught by
         test_no_dispatch_names_a_location_inside_the_main_clone.
    M2 — "fix" this by making toWorktreePath re-root absolute paths. This would pass these
         tests and break BO-3900's ratified contract instead; it is rejected on purpose.
         The input is corrected, the rule is not.
    M3 — strip the tail but forget to rejoin, dispatching a bare relative path. Caught by
         test_the_planner_is_given_the_worktree_copy_of_the_epic.
    M4 — join unconditionally, doubling the tail for an already-worktree-resident path.
         Caught by test_an_epic_path_already_inside_the_worktree_is_left_where_it_is.
