criteria: 'Given the answer contracts cover required facts, scope, counts, declared relations, verification evidence,
  query fitness and observable failures

  When a person or agent consults the shared research-answer reference

  Then it defines the separate meanings of lifecycle status, requirement status, work status, readiness, execution
  result and question fulfillment

  And it explains root-only versus terminal-leaf counting, known totals versus incomplete enumeration, source revision
  versus tested revision, and declared tests versus execution and deployment evidence

  And it describes missing-field, missing-source, unsupported-mapping, missing-query and unavailable-trace outcomes
  with examples that cannot be mistaken for completed answers

  And it maps all eight query families and all twenty-five role questions to supported evidence contracts or explicit
  source limitations

  And the same reference serves the field, impact and diagnosis features without creating competing definitions

  And planned evaluation cases and unavailable real-provider or deployment proof are identified as pending.

  '
