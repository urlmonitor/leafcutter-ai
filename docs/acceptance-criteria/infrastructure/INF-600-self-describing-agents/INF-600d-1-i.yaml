criteria: |
  Given an agent (e.g. "documentation-expert") that can spawn a
    specialist agent ("how-to-author") for complex documentation tasks
  And the same agent also writes simple documentation updates directly
    without spawning the specialist
  When the registry entry is inspected
  Then the specialist agent ("how-to-author") appears in spawn_allowlist
    because delegation does occur for complex cases
  And the direct-writing capability appears in skills_invoked or is
    documented in behavioral_patterns with a trigger describing when
    delegation occurs versus when the agent handles it directly
  And the spawn diagram shows the delegation edge to the specialist
  And the behavioral_patterns table explains the decision boundary
    (e.g. "delegates to how-to-author when the guide exceeds N steps")
