notes: |
  A TECHNICAL CONSTRAINT ON ACS-1400a-1, NOT A SEPARATE FEATURE. Closing the
  dependency-list hatch widens the set of records the check will fire on. The
  merge narrowing is the one place where a wider check becomes unsatisfiable for
  the person running it, because the records it would demand they repair belong
  to trees they neither authored nor modified.

  THE FAILURE MODE IS SOCIAL AND IT IS ALREADY DOCUMENTED IN THIS REPO. A gate
  that must be bypassed to complete an ordinary merge produces a bypass habit,
  and the habit is what let the current population accumulate. This AC exists so
  that widening the check cannot silently reintroduce that pressure.

  THE SECOND Given IS THE ANTI-VACUITY HALF. "No merge reports a violation" is
  satisfied by a check that has been disabled for merges entirely. Both clauses
  must hold in the same run.
