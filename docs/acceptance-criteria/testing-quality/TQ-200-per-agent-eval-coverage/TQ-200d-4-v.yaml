test_spec:
  - name: test_not_configured_block_says_the_database_tests_were_not_run
    target_dir: unit_tests/agents/test_runner_prompt/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      The not_configured fenced block names testing_context.db_connection_test, tells the user to set it in skills_config.json
      and holds 'The database tests were not run.'; its other lines equal the pre-change block, and the 'Do NOT
      attempt to run the SQL suite' line is still in the template.
    must_catch:
      - revert the fix
      - the sentence placed outside the fenced block
      - another line of the block reworded
    in_scope_files:
      - templates/agents/test-runner.md
  - name: test_verbatim_block_alone_passes_all_six_checks
    target_dir: unit_tests/evals/tq200d4v/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      A report that is exactly the block extracted from the template, with the run1 transcript, passes all six assertions
      of the test-runner missing-setting-database-work row.
    must_catch:
      - the template block without its not-run sentence
    in_scope_files:
      - templates/agents/test-runner.md
  - name: test_block_without_the_sentence_still_fails_not_run
    target_dir: unit_tests/evals/tq200d4v/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      The same report with 'The database tests were not run.' removed fails report_says_not_run (the sentence, not
      a widened check, makes it pass).
    must_catch:
      - report_says_not_run widened to accept 'before running database tests'
    in_scope_files:
      - scripts/evals/produced_tests_reports.py
  - name: test_block_plus_a_run_claim_fails_not_run
    target_dir: unit_tests/evals/tq200d4v/
    framework: pytest
    type: unit
    angle: discrimination
    description: The block plus 'The database tests ran and passed.' fails report_says_not_run.
    must_catch:
      - a run claim accepted when the not-run sentence is present
    in_scope_files:
      - scripts/evals/produced_tests_reports.py
  - name: test_kept_test_runner_reports_still_pass
    target_dir: unit_tests/evals/tq200d4v/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The run1 and run2 probes under unit_tests/evals/fixtures/tq200d-rerun/test-runner/missing-setting-database-work/
      pass all six assertions of the row.
  - name: test_test_runner_gold_still_passes_with_the_new_sentence
    target_dir: unit_tests/evals/tq200d4v/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: >-
      python scripts/evals/run_agent_eval.py --agent test-runner --score-gold --results-file <tmp>
    description: The real CLI replays the test-runner gold outputs and all four rows pass.
  - name: test_report_says_not_run_entry_quotes_the_test_runner_sentence
    target_dir: unit_tests/evals/tq200d4v/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The entry quotes 'The database tests were not run.' with templates/agents/test-runner.md, its passing example
      is the block as extracted from the template, and the README bullet names the sentence and links #report_says_not_run.
    must_catch:
      - the entry still quotes the old 'Do NOT attempt to run' sentence as its template sentence
    in_scope_files:
      - docs/reference/produced-tests-eval-assertion-kinds-database-setting.md
      - scripts/evals/README.md
test_rationale: >-
  The behaviour is a model relaying a fixed block, so the template test pins the block and the eval tests prove
  that a report which relays it word for word passes the row only because of the new sentence: the sentence-removed
  and run-claim cases guard against the check being widened instead. The kept reports and the gold run show the
  change breaks nothing that passed.
