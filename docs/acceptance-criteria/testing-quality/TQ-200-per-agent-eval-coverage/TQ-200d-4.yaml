id: TQ-200d-4
components:
  - testing_quality
  - llm_authoring
  - infrastructure
title: "The test writer and the test runner are scored on using your project's database setting and on saying when it is missing"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the test writer's eval set from TQ-200d-1, and the test runner, which
    has no eval set today,
  When rows for the database setting are added to both sets,
  Then the test writer's set gains the row "configured database": in a
      project whose testing_context.db_connection_test is set, the database
      test it produces takes its connection from that setting and names no
      host, port or database of its own,
    And the test runner gets its own set, holding the row "configured
      database": in the same project, its check that the test database is
      reachable uses that setting and no other address,
    And both sets hold the row "missing setting, database work" (W1): in a
      project with no test database setting, and work that needs a database
      test for a stored procedure, the hand-off says no test database
      connection is configured, names testing_context.db_connection_test,
      reports the database tests as not run for want of configuration, and
      points at no address the agent chose itself,
    And both sets hold the trap "missing setting, no database work" (W2): in
      the same project, work that needs only tests that touch no database
      proceeds with no mention of the missing setting; a hand-off that warns
      about the setting fails the row,
    And a local run of the shared eval runner for either agent picks up every
      row without anyone naming them, and reports a score for each row,
    And a result from such a local run is reported as a local result; nothing
      presents it as checked by CI.
depends_on:
  - TQ-200d
  - TQ-200d-1
