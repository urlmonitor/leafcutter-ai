id: GE-125b-3
components:
  - security_scanner
  - commit_guardian
title: "What counts as prose is a closed list of file kinds, and an unlisted kind is fully checked"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the reduced scrutiny is granted only when both conditions hold together —
    the file is at one of the four listed locations, AND its kind is one of four
    admitted non-executing kinds: Markdown (.md), YAML (.yaml and .yml) and plain
    text (.txt),
  And four files are staged for commit in the skill-prompt area of a throwaway
    git repository, at the repository-relative paths
    "templates/skills/some-skill/scripts/deploy.sh",
    "templates/skills/some-skill/data/fixture.json",
    "templates/skills/some-skill/scripts/entrypoint" — a file with no extension,
    "templates/skills/some-skill/README.md",
  And each carries one identical line holding the twenty-four-character opaque
    token used throughout this tree,
  And no suppression entries are in force,
  When the staged set is checked by the pre-commit secrets check,
  Then exactly three shapeless-value findings are reported — one each for the
    shell script, the JSON data file and the extensionless file,
  And no finding is reported for "templates/skills/some-skill/README.md",
  And the check exits reporting findings present, so the commit is blocked,
  Because admission is by presence on the list. A kind that is not on it is fully
    checked, and having no extension to match is not a way onto the list.

  Given a file of a kind this project does not currently use is staged in the
    same area at "templates/skills/some-skill/notes.adoc", carrying the same
    token,
  When the staged file is checked by the pre-commit secrets check,
  Then it IS reported and the commit is blocked,
  Because a file kind arrives fully checked and becomes admitted only by someone
    deliberately adding it to the list. Resembling prose is not admission — if it
    were, the next kind anyone invents would arrive already exempt and nobody
    would have decided that.

  Given a fifth file at "scripts/build_probe.py", whose path contains none of the
    four listed names, is staged in the same run carrying the same token,
  When the staged set is checked by the pre-commit secrets check,
  Then it IS reported,
  Because the one silent file in these scenarios is only evidence of an exemption
    if a file the exemption cannot reach is reported in the same run.
depends_on:
  - GE-125b
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "CANONICAL SOURCE — A DEPLOYED-COPY-ONLY FIX IS REVERTED BY THE NEXT BUILD. The admitted-kind constant and the gate that reads it land in `templates/scripts/commit_guardian/check_secrets.py`, beside `_PROSE_FILE_PREFIXES`, `_is_prose_exempt` and `_filter_prose_findings`. `scripts/commit_guardian/check_secrets.py` and `.leafcutter/scripts/commit_guardian/check_secrets.py` are build outputs per ADR-001, and `templates/commit-guardian/` holds the legacy manifest; `check_hook_parity` enforces all four locations. Run `python scripts/build.py --target-dir .` and re-run the commit_guardian suite before claiming this."
  - "OPEN PRODUCT DECISION — THE ADMITTED LIST INCLUDES `.yaml`, AND A CODER MAY NOT SETTLE THAT EITHER WAY. Build the list exactly as this AC specifies: `.md`, `.yaml`, `.yml`, `.txt` — deliberately the same four GE-123d-2 chose, so the two sides stay compatible. Admitting `.yaml` means THIS REPOSITORY'S OWN ACCEPTANCE-CRITERIA STORE KEEPS ITS EXEMPTION and its YAML is never scanned for opaque tokens. That preserves today's behaviour rather than changing it, and removing `.yaml` would strip an entire intended location's exemption as a side effect of a decision about executable code — a different change that nobody has asked for. The counter-worry, that YAML is where configuration secrets live, is answered by the location gate rather than the kind gate: a configuration file outside the four listed locations was never exempt and still is not. IF THE PRODUCT OWNER DECIDES THE STORE SHOULD BE CLOSED, the list shrinks to `.md` and `.txt`, this AC's first arm gains a fourth finding, and GE-125b-1-i's acceptance-criteria-record arm inverts from silent to reported. That is not a one-line edit and it is not local to this record. This choice is recorded as OPEN in GE-125's notes. A coder, reviewer or test-writer must NOT resolve it unilaterally, must NOT add or remove a kind to make a test pass, and must NOT treat a plausible-sounding security argument as authorisation: if implementation surfaces a reason to change the list, STOP and raise it as a product question."
  - "ONE CLOSED CONSTANT, READ EVERYWHERE, DEFAULTING TO REPORTED. The four kinds are a single named module-level constant that the gate reads; no second copy, and no per-location kind list (a YAML-only rule for the store and a Markdown-only rule for the ticket tree was rejected by GE-123d-2 as over-fitting to today's layout). Admission is membership: absence from the list is exclusion, and there is no third state. An implementation carrying a DENY list of known-executable kinds such as `.py`, `.sh` and `.js` satisfies the first arm and fails the second — that inversion is the whole point of the shape, because the kinds nobody enumerated must arrive fully checked."
  - "THE LOCATION LIST IS NOT TOUCHED BY THIS AC. GE-123d-2's five locations include the changelog area, which it added deliberately. This record governs the EXISTING exemption and its four existing locations — the ticket tree, the retrospectives area, the acceptance-criteria store and the skill-prompt area. Adopting a kind list is not adopting a location list; adding a fifth location on this side would be an unasked-for widening."
  - "COORDINATION WITH GE-123d-4-i, NOT A MERGE — AND THIS AC IS WHERE THE COORDINATION IS EARNED. GE-123d-4-i requires that if the location data is ever shared between the existing `ENTROPY_HIGH` exemption and the proposed `GENERIC_SECRET` one, the kind gate must be applied on BOTH sides or the sharing must not happen. Choosing the same four kinds is what makes a later sharing a decision someone can take safely; it is NOT a merge and it does not close either record. If this implementation introduces any structure the other rule could reuse — a shared kind constant, a shared location list, a shared predicate — that requirement binds here too and every call site must go through the gate. Do NOT edit any GE-123 file and do NOT add a depends_on edge into the GE-123 tree."
  - "COORDINATE WITH THE SIBLING L1s RATHER THAN REVERTING THEM. GE-125a re-anchors the same path predicate to a root-anchored segment match and GE-125c moves the decision from the file to the individual finding, both against these same members, concurrently. Reconcile with whatever is in the file at implementation time; do not restore a substring match and do not restore the file as the unit of the decision as a side effect of adding the kind list."
  - "THROWAWAY ROOT, AND ASSERT IT IS NOT ITSELF EXEMPT. All fixtures are real files inside a `tempfile`-backed throwaway git repository with the skill-prompt area constructed INSIDE that root; none may be written under this repository's own `templates/skills/` tree. Because the location match is a substring test (KI-SEC-001), assert as a precondition that the root path ABOVE the constructed directory contains none of the four segment names — otherwise the `scripts/build_probe.py` control falls silent and looks like a broken fixture rather than a re-armed exemption. If the check cannot be pointed at a throwaway root, raise that as a defect against this goal and stop."
  - "VERIFY BY EXECUTION AND BY EXACT COUNT. Stage the files in the throwaway repository, run the pre-commit secrets check as a process, and assert the exit status together with the parsed findings and their 1-based line numbers. The first arm's assertion is an equality — exactly three across four files staged together, with the three named — because an at-least-one assertion is satisfied by an implementation that reports the README as well, which is the deleted-exemption failure. That count is not expressible by calling the exemption logic with path strings."
  - "FIXTURE TOKENS ASSEMBLED AT RUNTIME from concatenated fragments, per `unit_tests/commit_guardian/test_scan_secrets_suppression.py`. No `.security-allowlist` entry may be added for this tree; needing one is the signal the fragments were collapsed into literals."
  - "ERROR HANDLING PER CLAUDE.md. Extension extraction and list membership are pure over a path string and must NOT be wrapped in try/except (Rule 4); any file or subprocess access added by the check or its tests is wrapped in a typed `except` that logs at WARNING or re-raises (Rules 1-3)."
  - "PERFORMANCE — THIS RUNS ON EVERY COMMIT. Membership is tested against a module-level frozen set, not a list rebuilt per call, and the extension is derived from the path string with no filesystem access — no `stat`, no read, no subprocess. The check must remain within its current commit-time budget for a staged set of 200 files."
test_spec:
  - name: test_unadmitted_kinds_at_a_listed_location_report_exactly_three
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Four files in the skill-prompt area of a throwaway root — deploy.sh, fixture.json, an extensionless entrypoint, and README.md — carrying the identical runtime-assembled token and staged together yield EXACTLY THREE findings, one each for the shell script, the JSON file and the extensionless file, none for the README, with a non-zero exit. Location held constant so the kind is the only variable; the equality count is what makes it discriminating."
  - name: test_an_unknown_kind_arrives_fully_checked
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A .adoc file this project does not use, staged in the same area with the same token, IS reported and blocks. This is the arm that separates a closed ADMIT list from a deny list of known-executable kinds: an implementation hard-coding .py/.sh/.js as excluded satisfies the previous descriptor and fails this one."
  - name: test_admitted_kinds_are_one_closed_constant_of_exactly_four
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Behavioural drift guard: staged files of kinds .md, .yaml, .yml and .txt at a listed location are all silent while a representative sample of other kinds is all reported, in one run — so the admitted set is observably exactly those four. Pins the OPEN product decision at test level: if this descriptor ever needs editing to pass, the admitted list has changed and that requires a product decision, not a test fix."
  - name: test_live_path_control_reported_in_the_same_invocation
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "scripts/build_probe.py in the throwaway root, containing none of the four listed names and holding the identical token, IS reported in the SAME run as the silent README. Without it the one silent file is an absence rather than evidence, and a fixture whose token never reached the entropy threshold looks identical to a working exemption."
  - name: test_closed_kind_list_is_present_in_the_deployed_check_after_build
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: "After running the build, the first descriptor's three-finding outcome is produced by the DEPLOYED scripts/commit_guardian/check_secrets.py and .leafcutter/scripts/commit_guardian/check_secrets.py, not only by the canonical template — the ADR-001 revert hazard, asserted by executing the deployed copy rather than by comparing bytes."
test_rationale: |
  Five descriptors, and the first two are a matched pair aimed at two implementations
  that are indistinguishable from a single assertion. A hard-coded deny list of .py,
  .sh and .js produces exactly the three findings the first arm demands and lets the
  next file kind anyone invents arrive already exempt; only the .adoc arm separates
  them. That is why the second descriptor exists as a peer rather than as an edge case
  — default-to-reported is the shape being bought here, not a detail of it.

  The first descriptor holds location and content constant across four files staged in
  one commit so the kind is the only variable, and asserts an equality rather than a
  floor: an at-least-one assertion is satisfied by an implementation that reports the
  README too, which is the deleted-exemption failure the whole subtree guards against.

  The third descriptor is deliberately a fence rather than a behaviour. The admitted
  list is an OPEN product decision recorded in GE-125's notes — admitting .yaml keeps
  this repository's own AC store unscanned for opaque tokens — so the set must be
  observable at test level and must be expensive to change quietly. It is written
  behaviourally rather than by importing the constant, so it cannot be satisfied by a
  source-level grep and so it also proves the constant is actually wired.

  The fourth is the standing live-path control without which every silent assertion
  here is vacuous, and the fifth covers the ADR-001 revert: a fix in the canonical
  template alone leaves the hook a real commit runs unchanged until the next build.
