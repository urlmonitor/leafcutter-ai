notes: |
  WHY FOUR RECORDS AND NOT TWO. The three omissions need three different
  mechanisms and an implementation commonly gets one or two: an unstated revert is
  a presence check, a non-restoring revert is a comparison of two outcome sets, and
  an unnamed alteration is a required rather than merely permitted field. Naming
  all three alongside a conforming record that must NOT be reported makes the
  scenario adversarial rather than illustrative. This is BP-1100g-5-i's design,
  reused deliberately.

  THE THIRD CLAUSE IS THE ANTI-GREP CLAUSE. A test asserting that the writing side
  was instructed to name an alteration passes on an implementation that records
  nothing at all. Assert over the records the run emitted.

  THE FOURTH CLAUSE BOUNDS THE RULE. Ordinary before-and-after answers and reasoned
  negatives make no claim about an alteration, so reporting them here would generate
  false shortfalls — whose only natural remedy is to weaken the check until they
  stop.
