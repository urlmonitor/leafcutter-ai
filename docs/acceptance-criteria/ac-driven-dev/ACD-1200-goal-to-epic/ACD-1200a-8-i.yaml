expects_from:
  ac_id: ACD-1200a-8
  contract: "The generated Master_Plan file at the epic folder root, whose CONTENT that AC specifies. This criterion constrains the frontmatter it carries, so the file that AC produces can actually be committed."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment: null
  reference_file_path: scripts/ac_store/epic_master_plan.py
  n_location_rule: "1 -- the Master_Plan frontmatter renderer (_render_master_plan). The goal-title pass-through in scripts/ac_store/epic_phases.py (_write_master_plan_safely) and its caller in scripts/ac_store/epic_pipeline.py are companion edits named in constraints."
  required_skills:
    - python-coder
    - test-writer
  post_write_commands:
    - "python -m pytest unit_tests/ac_store/test_master_plan_generation.py"
  constraints:
    - "Both enforcement points, both satisfied. The commit-time gate is check-doc-frontmatter, which reads doc_frontmatter.ticket_frontmatter.required_fields from the commit_guardian config (the deployed config and its packaged template source). The authoring-time gate is templates/hooks/ticket_frontmatter_guard.py, deployed to .claude/hooks/ and run on Edit|Write. Neither gate, its required set or its file patterns may change, and no exemption for generated or Master_Plan files may be added."
    - "The frontmatter block is produced by a real YAML serialiser and round-trips: parsing the written block gives exactly the values the generator intended, including a goal title that contains ':' or quote characters. No frontmatter line is assembled by string concatenation."
    - "Fields, from design section 6c. title is 'EPIC: <goal title>', type is epic, and depends_on is []. Out-of-epic dependencies belong in a body section, never in depends_on, which the ticket guard resolves to sibling files. change_target and risk_surface are the union across the epic's tickets. requires_diagram and requires_adr are a tri-state roll-up: true if any ticket is true, otherwise false if any ticket is false, otherwise null. The existing epic_name, created, status, components and source_ac keys are kept unchanged."
    - "Every value must be in the shape the authoring-time guard accepts for that key. If the guard rejects the null branch of the roll-up, or a multi-value union for a single-valued key, stop and report it at review. Do not coerce a value to make the guard pass, and do not change the guard."
    - "One writer: the goal title reaches the renderer through the existing post-assembly write phase (_write_master_plan_safely in scripts/ac_store/epic_phases.py). No second Master_Plan writer is introduced."
    - "Deterministic: the same epic inputs produce a byte-identical Master_Plan frontmatter with a stable key order, so regenerating an epic shows no spurious diff."
    - "Nothing outside the Master_Plan frontmatter changes. The ticket files, the epic folder name (ACD-1200a-3-iii) and the Master_Plan body are unchanged. The status value stays out of scope (see notes). This lands after T7 (--ids honours --dry-run), which also edits scripts/ac_store/epic_pipeline.py."
