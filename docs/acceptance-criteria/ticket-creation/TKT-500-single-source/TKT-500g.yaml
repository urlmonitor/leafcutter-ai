criteria: |
  What you specified as proof survives the trip to the work — never quietly dropped.

  When an approved requirement states what must be proven before it counts as done,
  that statement travels with the work: it appears in the work item, somebody is put
  on the hook for producing it, and the readiness report says plainly whether it
  survived. Nothing that was asked for is discarded, nothing nobody asked for is
  invented, and a deliberate "no proof needed" stays an explicit choice rather than
  an accident of who happens to be doing the work.
