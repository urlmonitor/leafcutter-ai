package_surface: false
it_requirements:
- Every write-capable dispatch of plan-feature (including its product-truth phase, KI-ACD-007) and of
  build-feature names the workspace as its working location and target root; no path is built from the
  session cwd.
- 'Proof: a real temporary main copy is snapshotted (working files and refs) around a complete harness
  run in which each stubbed writer performs its write at the location its dispatch names; the unit layer
  cannot run real authoring agents, so the proof is that the location reaching every writer comes from
  the ok answer (CLAUDE.md: results ''consumed in control flow'').'
- Proof runs the workflow under unit_tests/_workflow_engine_harness.py -- the deployed copy the build
  produces, so the build's workflow transform is exercised -- with label-scripted agent replies, and asserts
  on the RECORDED dispatch list, never on workflow source text. The harness must be able to model a workspace
  step that declines its task, answers in prose, answers exit 0 with a non-JSON path, or answers JSON
  without status (F13); extending the harness for this is in scope of the first AC that needs it.
- Workflow edits are made in templates/workflows-js/*.js and reach .claude/workflows/ only through the
  build; the deployed copy is what the tests run.
test_required: true
test_spec:
- name: test_main_copy_identical_after_full_plan_feature_run_including_product_truth
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: real_artifact
  description: Working files and branches of the temporary main copy are identical before and after a
    complete plan-feature run with a ready workspace.
- name: test_main_copy_identical_after_full_build_feature_run
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: real_artifact
  description: Same for a complete build-feature run.
- name: test_every_file_produced_lies_inside_the_workspace
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: Every file the stubbed writers created is under the workspace_path.
test_rationale: The 2026-09-25 incident was a perfect-enough maker with a caller that carried on, and
  every source grep of plan-feature.js would have passed. So the assertions are made on the recorded dispatch
  list of a real workflow run with scripted hostile answers, which is the only place 'no later step was
  dispatched' can be observed.
