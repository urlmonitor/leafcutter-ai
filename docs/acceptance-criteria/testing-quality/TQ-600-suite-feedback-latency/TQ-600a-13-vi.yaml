notes: |
  RESOLVED 2026-10-08: PULL REQUESTS THAT ARE NOT PUSHED AFTER THE VERDICT CHANGES.
  TQ-600a-13-xv re-runs this check on every open pull request on each verdict change, in
  both directions. Residual, named there: a pull request whose last hold run is older
  than the platform's 30-day re-run limit cannot be re-run and is listed rather than
  silently left.

  RESIDUAL RISK, KNOWN AND ACCEPTED — NOT SOLVED: any pull request can add a workflow of
  its own with a job named `Post-merge suite status` that exits zero. The ruleset pins
  contexts to the GitHub Actions app (15368), which is any Actions job, so such a spoof
  produces a second check run of the same name. This applies equally to all six existing
  required checks (any PR could fake `Test suite (pytest)`). Only a dedicated GitHub App
  with its own integration id closes it. Recorded by user decision H as accepted.

  risk_surface raised from internal to auth: this record now owns the trust boundary of a
  merge gate.
