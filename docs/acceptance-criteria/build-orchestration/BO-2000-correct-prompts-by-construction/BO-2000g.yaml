criteria: |
  The examples agents copy produce entries the commit accepts the first time.

  Every example entry an agent's instructions or skills tell it to copy opens
  with a valid feedback id. Notes that sign nothing off say so in the one
  documented way, so an agent that copies an example faithfully is never
  refused at commit. An automatic check of the instructions keeps every example
  in that shape, and each corrected example is proven against the real commit
  check rather than assumed to pass it.
