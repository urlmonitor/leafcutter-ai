      -> reviewed. BA criteria and product_truth unchanged.'
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  The flow requires "no cycles" but does not say what happens to a proposal that has one. A
  host answer that fails its contract may be repaired today (the how-to: repair attempts are
  configured). What happens when the repair attempts run out is for the IT PO; reported as an
  open question.
  IT PO (2026-10-05): settled what happens when the repairs run out: the split is abandoned and the
  request goes on exactly as for fewer than two parts, by its trigger, so a bad proposal is never
  worse than today.
