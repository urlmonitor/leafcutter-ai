assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The verdict must be a function of the reported finding set. Today it is not: check_build_drift.main() returns 2 on gaps, and gaps is excluded from BOTH the drifted and the missing fields of its own RESULT line (drifted_total = len(violations) + missing). That arithmetic is exactly how a run prints drifted=0 missing=0 and refuses anyway. Every condition that can refuse must be represented in the reported counts."
  - "The invariant must hold for the INDETERMINATE exit (2) as well as the BLOCKED exit (1). An exit that is not a pass must either name findings or state, as its own reported category with a non-zero count, that it could not determine an answer. 'Refused with nothing named' must not be reachable by any path."
  - "Applies to both drift gates in the same change; their RESULT vocabularies are required to stay identical, so an invariant enforced in one and not the other makes the two runs incomparable."
  - "The named-item count and the reported finding count must be produced from one data structure, not computed twice. Two independent counts that agree today is the shape of the defect, not a fix for it."
  - "The verified == 0 floor is an exception that must be preserved and made explicit: a gate that compared nothing refuses with no findings by design. It must report that as its own stated category rather than as an unexplained refusal."
  - "Templates and their deployed scripts/commit_guardian/ copies change together and are verified in parity via the build.py round-trip (ADR-001)."
delivers_to: null
expects_from: null
test_required: true
test_spec:
  - name: test_a_run_reporting_zero_findings_permits_the_commit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A completed comparison reporting zero drifted and zero missing exits 0."
  - name: test_a_refusal_names_at_least_one_specific_item_it_found
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Every non-zero exit the gate can produce is induced in turn; each carries at least one named item or an explicit stated category for why no item could be named."
  - name: test_the_number_of_items_named_in_a_refusal_equals_the_reported_non_zero_finding_count
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The count parsed out of the RESULT line and the number of items named in the BLOCKED block are asserted EQUAL, not merely both non-zero."
  - name: test_the_gaps_exit_path_is_represented_in_the_reported_finding_counts
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The gaps condition is induced on its own; the run must not print drifted=0 missing=0 alongside a refusing exit code. This reproduces the exact 2026-09-14 observation and is the single assertion that fails against today's code."
test_rationale: |
  The recorded symptom is a summary line reading drifted=0 missing=0 next to a refusal.
  A test contract written from the first two Then clauses alone -- zero findings permits,
  a refusal names something -- passes against today's code, because the gaps path is
  neither a finding in the reported sense nor an unnamed refusal in the BLOCKED-block
  sense: it prints its own UNCOMPARABLE lines and returns 2. The count-equality assertion
  and the gaps-specific test are what close that gap, and the count must be asserted
  EQUAL rather than non-zero, since "both are greater than zero" is satisfied by a gate
  that names three items while reporting seven.
