  - path: docs/architecture/adrs/ADR-001-self-hosting-boundary.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- Canonical source templates/scripts/commit_guardian/check_mermaid_parent_link.py.
- The check gets the project root only through the shared resolver of GE-113c-1-iv; no Path(__file__).parents[N]
  root remains in it.
- The proof runs the built, installed copy the way .pre-commit-config.yaml invokes it, in a temporary
  repository with staged fixture documents, independent of the developer's working tree.
- 'The ''read none of its targets is not a pass'' outcome: GE-120a-4 has no shared helper (its rule is
  implemented inside scripts/ac_store/validate_ac_schema.py, which is source-only). The reusable mechanism
  is the shared outcome vocabulary of GE-120a-1, templates/scripts/commit_guardian/check_outcome.py (emit_result
  with OUTCOME_COULD_NOT_CHECK): staged targets named but none readable emits that outcome and does not
  exit as a clean pass; no staged target in scope stays an ordinary pass (GE-120a-4''s boundary). check_outcome.py
  is imported, not changed, so it is not a declared file.'
- Canonical sources only; deployed and installed copies are regenerated by the build and never hand-edited
  (ADR-001).
- Before merge, run the working check once over every existing architecture document. c2-001 to c2-006
  are fixed by GE-113c-4-i (land together, or record a known issue pointing at GE-113c-4-i). Any other
  refusal, such as the c2-fast-* diagrams' bare-name parent, is fixed or filed as a known issue naming
  the document.
- Resolve docs/known-issues/commit-guardian/open-high-ki-cg-20261016-mermaid-parent-link-root-inside-package.md
  in the same change.
declared_files:
- path: templates/scripts/commit_guardian/check_mermaid_parent_link.py
  state: existing
delivers_to: null
expects_from:
  ac_id: GE-113c-1-iv
  contract: The single shared project-root resolver (templates/scripts/commit_guardian/_resolve_root.py,
    git rev-parse --show-toplevel with a safe fallback) returns the project root as a path, the same root
    from the package source copy and from the installed copy.
test_intent:
- clause: each run refuses the commit and names both c2-901-example.md and c1-901-parent.md and the missing
    child entry
  needs_test: true
  reason: Refusing a broken link from both copies is the behaviour that is inert today.
- clause: when c1-901-parent.md is corrected to list c2-901-example.md, both runs pass
  needs_test: true
  reason: A corrected link must pass, or the repaired check would block valid commits.
- clause: the check reads the staged documents from the project root, obtained through the one shared
    root resolver of GE-113c-1-iv, not from a folder computed from where the check's own file sits
  needs_test: true
  reason: Reading from the wrong root is the defect, and only a run from the installed layout shows it.
- clause: a run that was offered staged architecture documents and could read none of them does not report
    a pass (the outcome GE-120a-4 defines)
  needs_test: true
  reason: An empty read must not pass, or the check can go inert again silently.
- clause: the proof is a test that runs the installed copy against a staged broken document, not only
    the package source copy
  needs_test: true
  reason: The clause itself requires the installed-copy test as the proof.
- clause: every existing architecture document the now-working check refuses is either fixed in the same
    change or recorded as a known issue naming the document, and the check is not narrowed, exempted or
    made to warn to let that change through
  needs_test: false
  reason: A one-time sweep of existing documents during the change, verified by that commit, not by a
    lasting test.
test_spec:
- name: test_ge_113c_4_installed_copy_refuses_broken_parent_link_naming_both_documents
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: reachability
  description: 'Stage docs/architecture/diagrams/c2-901-example.md (flight_level L2, a mermaid block,
    parent docs/architecture/diagrams/c1-901-parent.md, a markdown link to the parent below the fence)
    and c1-901-parent.md (flight_level L1, root: true, a children list without c2-901-example.md), then
    run python .leafcutter/scripts/commit_guardian/check_mermaid_parent_link.py as a subprocess with cwd
    at the repository root, the way .pre-commit-config.yaml invokes it; it exits 1 and its output names
    c2-901-example.md, c1-901-parent.md and the missing children entry. The installed layout is made by
    copying the hook and _resolve_root.py into .leafcutter/scripts/commit_guardian/ of a temporary git
    repository, as _ge_113c_1_vi_fixtures.deploy_hook does; no build.py is spawned and no POSIX flock
    is needed, so it runs locally as well as on CI.'
  proves_clause: each run refuses the commit and names both c2-901-example.md and c1-901-parent.md and
    the missing child entry
  code_file: templates/scripts/commit_guardian/check_mermaid_parent_link.py
- name: test_ge_113c_4_source_copy_refuses_broken_parent_link_naming_both_documents
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: criterion
  description: Same staged fixture, run from the package source copy templates/scripts/commit_guardian/
    with cwd at the temporary repository; it exits 1 with the same named documents and missing children
    entry.
  proves_clause: each run refuses the commit and names both c2-901-example.md and c1-901-parent.md and
    the missing child entry
  code_file: templates/scripts/commit_guardian/check_mermaid_parent_link.py
- name: test_ge_113c_4_corrected_parent_passes_from_both_copies
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: criterion
  description: After c1-901-parent.md lists c2-901-example.md in children and is restaged, the installed
    copy and the source copy both exit 0.
  proves_clause: when c1-901-parent.md is corrected to list c2-901-example.md, both runs pass
  code_file: templates/scripts/commit_guardian/check_mermaid_parent_link.py
- name: test_ge_113c_4_installed_copy_reads_staged_documents_from_the_resolved_project_root
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: discrimination
  description: The installed copy refuses the broken fixture both when run with cwd at the repository
    root and with cwd in docs/ (git rev-parse --show-toplevel still names the root), and a decoy copy
    of the two documents placed under .leafcutter/ with a valid link does not turn the refusal into a
    pass.
  proves_clause: the check reads the staged documents from the project root, obtained through the one
    shared root resolver of GE-113c-1-iv, not from a folder computed from where the check's own file sits
  code_file: templates/scripts/commit_guardian/check_mermaid_parent_link.py
  must_catch:
  - REPO_ROOT = Path(__file__).resolve().parents[2] kept, so the installed copy joins staged paths to
    .leafcutter/, finds nothing and exits 0
  - a root taken from the current working directory instead of the shared resolver, so a run from docs/
    misses the staged documents
  - the root fixed for the staged child but the declared parent still joined to a folder computed from
    the hook's own file
- name: test_ge_113c_4_staged_document_that_cannot_be_read_does_not_pass
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: discrimination
  description: Stage c2-901-example.md, then remove its working-tree copy without staging the deletion;
    the installed copy does not exit 0 and states that it inspected nothing, naming the unread path (the
    GE-120a-4 outcome).
  proves_clause: a run that was offered staged architecture documents and could read none of them does
    not report a pass (the outcome GE-120a-4 defines)
  code_file: templates/scripts/commit_guardian/check_mermaid_parent_link.py
  must_catch:
  - 'the existing ''if not abs_path.exists(): return []'' early return kept, so an unread staged document
    counts as a pass'
  - a warning printed but exit 0 returned
- name: test_ge_113c_4_nothing_staged_still_passes
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: criterion
  description: 'With no architecture document staged (empty scope), the installed copy exits 0: the GE-120a-4
    rule fires on offered-but-unread documents, never on an empty scope.'
  proves_clause: a run that was offered staged architecture documents and could read none of them does
    not report a pass (the outcome GE-120a-4 defines)
  code_file: templates/scripts/commit_guardian/check_mermaid_parent_link.py
- name: test_ge_113c_4_installed_copy_alone_refuses_without_a_source_tree
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: reachability
  description: The temporary repository holds only the installed copy (no templates/ tree), so the refusal
    of the staged broken document can only come from the installed copy; exit 1 naming both documents.
    The installed layout is made by copying the hook and _resolve_root.py into .leafcutter/scripts/commit_guardian/
    of a temporary git repository, as _ge_113c_1_vi_fixtures.deploy_hook does; no build.py is spawned
    and no POSIX flock is needed, so it runs locally as well as on CI.
  proves_clause: the proof is a test that runs the installed copy against a staged broken document, not
    only the package source copy
  code_file: templates/scripts/commit_guardian/check_mermaid_parent_link.py
