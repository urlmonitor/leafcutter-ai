notes: |
  FAIL-CLOSED IS KEPT. Whichever fix direction ACD-2100d-5 takes, a run that arrives with
  neither the maker's answer nor a verdict must still stop before authoring (BO-1500f-1,
  ACD-2100b-4, ACD-2100b-5's direct-invocation guard). This record is direction-agnostic: under
  direction 1 the remedy is the restored pre-flight step; under direction 2 it is the maker
  step the command already shows.

  "Names only a remedy that exists" is checked against the INSTALLED command, skill and copy,
  because that is what the operator reads. The do-what-it-says-then-restart clause is the
  falsifier: a report that names a real script but the wrong argument still fails it.
  Not a permission cause: ACD-2100b-5's notes already say an absent verdict must never be
  worded as any of ACD-2100b-1/-2/-3's outcomes.
