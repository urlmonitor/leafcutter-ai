amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
change_target:
  - code
risk_surface: contract_boundary
notes: |
  Item 1, second half: create_ac_workflow.py:209-215 writes approved without consulting the
  approval-hold report. "test design pending" is the example hold reason; the IT PO should
  confirm the exact HOLD_REASONS spelling (any reason from the closed vocabulary works).
