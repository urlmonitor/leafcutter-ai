risk_surface: internal
notes: |
  TQ-600b-1 IS THE GATE THAT DECIDES WHETHER PARALLELISM SHIPS, SO THE GATE ITSELF
  NEEDS A PROOF. A comparison that returns "equal" unconditionally would clear
  TQ-600b-1 on the first run and license a parallel suite nobody has actually
  checked. That is the most expensive possible instance of this repository's
  recurring defect, because the thing it would wave through is the correctness of
  every future verdict.

  THE THREE CLAUSES ARE THREE DIFFERENT WAYS TO REPORT A FALSE MATCH, AND EACH HAS
  A PRECEDENT HERE. A genuine difference missed is the ordinary bug. A test present
  in one run and missing from the other is the shape that matters most in practice
  — a collision that prevents a test from running at all looks like agreement to a
  comparator that iterates the intersection. An empty or unreadable record
  comparing equal is the AC-store validator's zero-file exit-0, repeated.

  THE SECOND CLAUSE IS THE LIKELIEST TO BE MISSED IN IMPLEMENTATION. Comparing two
  mappings by iterating the keys of one of them is the natural way to write this,
  and it silently ignores every test the parallel run failed to execute.
