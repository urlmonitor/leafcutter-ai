criteria: |
  Given a staged commit adds "priority" to the "required" array
    in config/ac_store_schema.json,
  And 5 fixture files exist that conform to that schema,
  And 3 of those fixtures already contain a "priority" field with a valid value,
  And 2 of those fixtures do not contain a "priority" field,
  When the fixture-coherence check runs,
  Then the check reports only the 2 fixtures that lack the "priority" field,
  And the 3 fixtures that already have "priority" are not mentioned in the output,
  And the exit code is 1 (because violations exist).
