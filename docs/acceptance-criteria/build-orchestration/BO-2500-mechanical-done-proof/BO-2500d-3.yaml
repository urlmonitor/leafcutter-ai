risk_surface: internal
notes: |
  The distinction the retitle makes is small on the page and large in consequence. If the
  mechanical gates are a "stand-in" for review, then review is the real arbiter and the
  gates are a cheaper proxy for it — which invites, later and reasonably, putting the real
  arbiter back in charge. If the gates ARE the arbiters, a reviewer is an additional way to
  stop a change, and nothing about it bears on whether an acceptance criterion is done.
  BO-2500d-1 and BO-2500d-1-i are only coherent on the second reading.

