id: DK-200a-3-ii
title: "A shortened excerpt remains verifiable against its retained text"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: draft
req_status: draft
priority: high
work_status: done
criteria: |
  Given a matching document exceeds the allowed excerpt length,
  And shortening the excerpt ends at whitespace,
  When enrichment retains the shortened excerpt,
  Then its content hash identifies exactly the text retained in the result,
  And the result indicates that the excerpt was shortened.
depends_on: [DK-200a-3]
covered_by:
