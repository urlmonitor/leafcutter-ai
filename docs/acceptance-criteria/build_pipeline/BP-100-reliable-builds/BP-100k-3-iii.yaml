  - "Must follow the repo error-handling policy: specific-exception try/except around file and JSON I/O, log at WARNING or higher or re-raise; no bare or silent excepts. (No new I/O is introduced by this AC — it is a data-only change to an existing registry — so this constraint is satisfied by leaving the existing, already-compliant I/O in check_output_drift.py and _drift_exemptions.py untouched.)"
