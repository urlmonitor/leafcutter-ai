  requirements are not universal extraction prerequisites: the reviewed corpus includes
  legacy prose-only documents. Reference, how-to and component-diagram documentation
  obligations remain inherited from KM-400a; this refinement specifies source fidelity,
  not completion of new documentation. IT PO review and criterion-specific test links are now recorded; fresh execution remains separately evidenced.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
