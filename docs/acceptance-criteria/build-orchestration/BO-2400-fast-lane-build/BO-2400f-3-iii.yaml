work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the fast lane is pointed at UXP-510,
  And setting up that run's worktree, including its bootstrap, takes 180 seconds —
    longer than the 2 minutes a single command an agent runs may last before it is
    cut off or moved to the background,
  And the setup finishes and reports that it opened the worktree at a location on
    branch fast-lane/uxp-510,
  When the run decides the outcome of its worktree step,
  Then the run waits for the setup to finish and reads the setup's complete final
    result, not the part of its output that existed when 2 minutes had passed,
  And the run proceeds on the location and branch the setup reported,
  And the run does not end in a refusal.

  Given the same setup is still running, or has ended without a final result the
    run can read, at the moment the run must decide,
  When the run decides the outcome of its worktree step,
  Then the run halts as "worktree setup result not obtained", naming the criterion,
    how long it waited, and that the setup's own result was never read,
  And that halt is not reported as a refusal by the setup and carries no refusal
    reason,
  And no later step runs.

  Given four fast-lane runs are started at the same time for UXP-510, UXP-511,
    UXP-512 and UXP-513, and each setup reports success after between 90 and 180
    seconds,
  When each run decides the outcome of its worktree step,
  Then all four runs proceed on their reported worktrees — a setup that is slower
    because its siblings are running in parallel ends no differently from a fast one.
