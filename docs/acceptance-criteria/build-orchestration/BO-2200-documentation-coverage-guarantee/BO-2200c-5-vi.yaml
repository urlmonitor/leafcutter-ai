title: "A doc_link's status never changes what is demanded -- it is a stale snapshot, not a decision input"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given two leaf ACs identical in every field, each owning `docs/how-to/thing.md` with
    `relationship: creates`, differing only in that the first declares `status: exists` on that
    entry and the second declares `status: planned`,
  When a ticket is generated from each,
  Then the two generated `## Agent Contracts` blocks are identical apart from the rendered status
    text itself: the same agents are dispatched, the same target is named, the same content
    constraint is written, and the same documentation demand is made or not made.
  And the same holds when the status is absent entirely, and when it holds a value the schema does
    not define -- an unrecognised or missing status changes nothing about the demand and does not
    produce an error.

  And given a doc_link declaring `status: exists` for a document that is absent from disk, and
    another declaring `status: planned` for a document that is present,
  When the documentation phase runs,
  Then in both cases what happens is decided by reading the disk, not by reading the declared
    status: the absent document is authored and the present one is checked against its content
    constraint, so a status that contradicts reality changes no outcome.

  And the status value continues to be rendered in the existing-docs cross-link list alongside its
    path and relationship, as an author's note to the writer -- it is demoted from input to
    annotation, not deleted.
