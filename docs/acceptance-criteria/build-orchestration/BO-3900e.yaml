id: BO-3900e
title: "A ticket's prerequisite is found where the ticket names it: beside the ticket, not at the worktree root"
component: build-orchestration
components:
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given the resolved worktree `C:\Users\Hendrik\Code\leafcutter\worktrees\ki-20260914`
  And ticket `tickets/00_inbox/epics/EPIC-X/07_TICKET-a.md` whose depends_on names the
    sibling `02_TICKET-b.md` by bare filename
  And `tickets/00_inbox/epics/EPIC-X/02_TICKET-b.md` reads `status: done`
  When the build workflow decides whether ticket 07 may be released
  Then the prerequisite is read from `tickets/00_inbox/epics/EPIC-X/02_TICKET-b.md`
  And it counts as satisfied, because it was finished before this run
  And ticket 07 is released, not withheld as depending on work outside the run

  Given a depends_on entry that is not a bare sibling filename
  When the workflow resolves it
  Then it is resolved the way the ticket frontmatter hook resolves it
    (templates/skills/ticket-authoring/SKILL.md, "depends_on Resolution"):
    against the ticket's own folder, then that folder's `done/`, then, for a ticket
    that is itself in `done/`, the folder above
  And an entry that begins `tickets/` still resolves against the worktree root
  And an absolute entry is used as written
  And the same rule decides the path in both places that read depends_on: the
    run-set membership check and the per-ticket release gate

  Given a depends_on entry that resolves to no file in any of those places
  When the release gate reports the withheld ticket
  Then the reported prerequisite path is the first candidate beside the ticket,
    not a path at the worktree root that the ticket never named
