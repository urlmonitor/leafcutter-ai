id: AR-400c-2
title: "adr-author is no longer handed doc-enforcer, and product-owner is no longer handed signoff"
component: agent-registry
components:
  - agent_registry
  - skills_system
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the package's real tree,
  When the build compiles the prompts of adr-author and product-owner,
  Then adr-author's compiled abilities section does not list "doc-enforcer" and
    still lists "signoff" with its existing condition,
    And product-owner's compiled abilities section does not list "signoff" and
      still lists "knowledge-query" and "ac-tree-split" with their existing
      conditions,
    And product-owner's instruction that cites signoff's definition as the source
      of an event shape is still present and produces no finding (a citation,
      AR-400b-2-iii),
    And the derived central registry regenerated from those definitions lists
      neither removed grant.
depends_on:
  - AR-400c
doc_links:
  - path: templates/agents/adr-author.md
    relationship: modifies
    status: exists
    relevance: "Grants doc-enforcer (mode: always); its instructions never use it."
  - path: templates/agents/product-owner.md
    relationship: modifies
    status: exists
    relevance: "Grants signoff (mode: always) while declaring `signoff: false` -- it does not sign off a ticket phase."
assigned_agent: llm-expert
estimated_complexity: S
change_target: prompt
risk_surface: internal
it_requirements:
  - "Edit only the `skills:` frontmatter of templates/agents/adr-author.md (remove doc-enforcer) and templates/agents/product-owner.md (remove signoff); keep every other grant with its existing mode and condition byte for byte."
  - "If removing a grant leaves a specialist with no grant at all, the `Skill` tool question of AR-200b-2 must be re-checked (neither specialist is expected to reach zero: adr-author keeps signoff, product-owner keeps knowledge-query and ac-tree-split)."
  - "config/agent_registry.json is regenerated by the commit-time transform hook from the edited declarations and committed as that output; no hand edit."
  - "product-owner's citation of signoff's SKILL.md as the event-shape source stays (a citation, AR-400b-2-iii); it must still resolve under the existence check."
test_spec:
  - name: test_compiled_adr_author_and_product_owner_drop_only_the_dead_grants
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: integration
    angle: deployed
    description: "Compile both from the real templates: adr-author's abilities section lacks doc-enforcer and still lists signoff with its condition; product-owner's lacks signoff and still lists knowledge-query and ac-tree-split with their conditions."
  - name: test_regenerated_registry_lists_neither_removed_grant
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Running the transform-agent-registry hook logic over the real templates produces a registry whose adr-author and product-owner entries list neither removed grant, byte-identical to the committed config/agent_registry.json."
  - name: test_product_owner_signoff_citation_produces_no_finding
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: integration
    angle: criterion
    description: "The validator over the real tree reports no finding for product-owner."
test_rationale: >-
  Compiled prompt plus regenerated registry are the two surfaces the criteria
  name; the citation descriptor guards the removal of the grant turning a
  citation into a fault.
delivers_to: null
expects_from: null
origin_agent: BrainCandy
created: 2026-10-12
created_by: docs/acceptance-criteria/agent-registry/AR-400-sound-specialist-setup/AR-400c.yaml
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  ONE-OFF CLEANUP, NOT A NEW CHECK -- BA DECISION, FLAGGED. AR-400c leaves to the
  BA whether a check should find future dead grants. "The specialist has no use
  for it" has no mechanical signal in general (adr-author/doc-enforcer is a
  judgement). One narrow case IS mechanical -- granting "signoff" to a
  specialist whose definition declares `signoff: false`, which is exactly
  product-owner's -- and could become a declaration-shape error. Not authored,
  because it would be a new rule beyond the user's two named instances. Raised
  as an open question in the BA report.

  WHY adr-author STILL KEEPS signoff. It declares `signoff: true` and grants it
  conditionally on a ticket_path; that grant is live.
