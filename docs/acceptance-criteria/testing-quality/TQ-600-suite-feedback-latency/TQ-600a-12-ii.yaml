test_spec:
  - name: test_tq600a_12_ii_a_test_that_does_not_request_a_seed_observes_the_same_deploy_count_as_today
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Baseline preservation. With seeding available but unrequested, a child session
      records the same number of deploy signals it recorded before the seed option
      existed.
  - name: test_tq600a_12_ii_a_seed_request_from_a_deploy_count_file_is_refused_and_named
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      A test inside one of the three named files requests a seed. The request is
      refused, the refusal names that test and the reason, and the test still gets a
      real build.
  - name: test_tq600a_12_ii_seeding_is_decided_by_the_tests_own_request_not_by_its_location
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      A test in an eligible file that does NOT request a seed gets an unseeded root;
      a requesting test in a directory nobody listed gets a seeded one. NAMED
      MUTATION: key the decision on the directory; this test must go RED.
  - name: test_tq600a_12_ii_a_newly_added_test_in_a_deploy_count_file_is_ineligible_without_being_listed
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      Add a test to one of the three files at runtime, have it request a seed, and
      assert it is refused. NAMED MUTATION: implement the ineligibility as a list of
      the 10 current test names; this test must go RED.
  - name: test_tq600a_12_ii_a_run_wide_seed_switch_does_not_reach_the_ineligible_files
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      If any run-wide enabling mechanism exists at all, a test in a deploy-count file
      is still unseeded under it. If no such mechanism exists, assert that:
      enumerate the seed decision's inputs and assert none of them is an environment
      variable or configuration key.
test_rationale: |
  The failure this record prevents is not a red test. It is a GREEN test that has
  stopped testing anything, which is the hardest defect in this repository to notice
  because every signal says the suite is healthy and faster.

  Three of the five descriptors name their injection, and the three injections are
  the three plausible implementations: keying on the directory, listing test names
  instead of files, and providing a run-wide switch because it is convenient. Each
  satisfies the remaining descriptors. The run-wide-switch descriptor is written to
  be satisfiable either way, because the right answer may be that no such mechanism
  exists — in which case the test should prove its absence rather than be deleted.

  The baseline-preservation descriptor comes first deliberately: the large majority
  of the suite never requests a seed, and a change that altered their behaviour would
  be a far larger problem than the 950 s it saves.
