id: BO-2400f-7-x
components:
  - build_orchestration
title: "A held outcome relayed on standard error with empty standard output is still read as held"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the claim-step reply observed on 2026-11-16 — exit status 1, standard output empty,
    and standard error holding
    {"claimed": [], "excluded_claimed": ["KM-400e-5"], "target_refused": true},
  When the run reads it at the claim step,
  Then it halts as held, naming KM-400e-5 (BO-2400f-7-ix),
  And it does not say the claim was never attempted.

  Given a claim-step reply with the "held" exit status (BO-2400f-7-viii) whose standard
    output holds the held outcome naming XY-100a-1 and whose standard error holds a
    one-line deprecation warning,
  When the run reads it,
  Then the held outcome is taken from standard output, the halt names XY-100a-1, and the
    warning text does not change the halt kind.

  Given a claim-step reply with the "held" exit status whose standard output and standard
    error are both empty, or hold no readable claim outcome,
  When the run reads it,
  Then it does not report a held halt naming no member,
  And it halts as a claim command that ran and failed, quoting what came back.
depends_on: [BO-2400f-7, BO-2400f-7-ix]
