notes: |
  WHY THIS IS NOT INF-1300a-1 REPEATED. a-1 asks whether the producer emits an acceptable
  document. This asks whether the whole arrangement — producer, checks, configuration,
  registries — still agrees with itself once it has been installed somewhere else. Those come
  apart in practice and this project has the scar tissue to prove it: a helper missing from
  the deploy list crashed a hook on import in every consumer while every test here passed,
  and a lost validator silently disabled all frontmatter enforcement in every consuming
  project. In both cases the source tree was healthy.

  THE LAST CLAUSE IS THE ONE THAT PREVENTS A FALSE GREEN, AND IT IS THE SHARPEST THING IN
  THIS RECORD. Both of the failures above present as silence. A check that crashed on import
  and was skipped, a check that read an empty staged index, a check that was never deployed —
  each reports no violation, and an observation looking only for violations reports a pass.
  So the observation has to establish that each check actually saw the document before its
  silence is allowed to mean anything. Without that clause this record is satisfied most
  perfectly by a project where the checks are entirely absent, which is the precise inverse
  of what it is for.

  FALSIFIABILITY. In the adopting project of INF-1300e-1, produce a document by the mandatory
  step, then run that project's deployed checks over it the way that project runs them. The
  record is falsified by any check reporting a violation, by any check failing to run, and by
  any check whose examination of the document cannot be demonstrated — for instance by
  showing it reports a violation when the document is deliberately broken, which is the
  cheapest way to prove it was looking. It is falsified as an observation if this package's
  copies of the checks were used, or if the adopting project still had this package's tree
  beside it.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale, delivers_to and expects_from. Those are the IT PO's.
