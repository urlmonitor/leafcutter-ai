id: BO-4400a-3-i
title: "Finalizing a feature clears its workspace through the one door without a confirmation stop"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
criteria: |
  Given a feature whose pull request has been merged and whose workspace still exists
    because it was created before end-of-route clearing was in place, holding nothing
    that has not reached the shared project,
  When finalizing the feature reaches its workspace-clearing step, run unattended with
    no person available to answer,
  Then the step completes without waiting for any input,
  And no folder remains at the workspace's location,
  And finalize's result contains the one shared clearing door's answer for it,
  And given instead the workspace has already been cleared by its route, the step
    reports that there was nothing to clear and finalizing still completes.
depends_on: [BO-4400a-3, BO-4400g-4]
doc_links:
  - path: docs/how-to/finalize-feature.md
    relationship: describes
    status: exists
  - path: docs/acceptance-criteria/build-orchestration/BO-4300-one-way-workspaces/BO-4300e-2.yaml
    relationship: constrains
    status: exists
    relevance: Notes record finalize's teardown deadlock on the interactive yes it cannot give.
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: BO-4300g-3
  contract: >-
    Finalize step 7: a shell-runner locate by the run's kind and slug, then one worktree-agent dispatch
    (label step-7-remove-worktree) carrying removal_authorization {workspace_path, branch} built from a definite
    ok locate answer; no removal dispatch on any other answer.
package_surface: false
declared_files:
  - path: templates/workflows-js/finalize-feature.js
    state: existing
it_requirements:
  - >-
    HARNESS PREREQUISITE: the proof runs finalize with the real maker through the exec bridge that BO-4400g-4 adds
    to unit_tests/_workflow_engine_harness.py, beside the finalize-to-step-7 driver of BO-4300g-3, so this record
    is built after that bridge (depends_on BO-4400g-4).
  - >-
    SURFACE: templates/workflows-js/finalize-feature.js, the workspace-teardown step (Step 7). Its
    interactive confirmation gate is removed. Step 7 is exactly what BO-4300g-3 defines: one read-only
    worktree.py locate --kind <kind> --slug <slug> dispatched to shell-runner (ADR-070), then, only on a
    definite ok answer for the run's branch, one dispatch to worktree-agent carrying removal_authorization
    {workspace_path, branch} built from that answer (BO-4300g-1), beside its clearing request, the door's
    remove by name (BO-4400g-4). The door's answer is recorded in finalize's result.
  - >-
    A workspace that is already absent is the ordinary case. The step-7 locate answers NOT_FOUND, no removal
    dispatch is made (BO-4300g-3-i), and the step reports nothing-to-clear while finalize continues to
    completion. Absence is never an error and never a halt.
  - >-
    Finalize passes no discard authorisation. A merged feature's workspace reads holds-nothing through the
    door's content check for squash-merged work, built in the maker under BO-4400g-2 (user decision D3). If
    the door refuses anyway, finalize reports the work as kept and completes; it does not force.
  - >-
    No regression of finalize's existing guards: the post-merge test HALT and deploy-parity checks
    keep their behaviour and their existing tests stay green (CLAUDE.md post-merge diff audit
    lesson: finalize-feature.js has lost hardened guards to merges before).
  - >-
    PROOF: deployed finalize-feature workflow under unit_tests/_workflow_engine_harness.py with no
    gate replies scripted (an unanswered gate fails the test by timeout), maker executed for real
    against a temporary project, hub and merged branch. Isolation and no-build.py rules as
    BO-4400a-1.
test_required: true
test_intent:
  - clause: the step completes without waiting for any input
    needs_test: true
    reason: Finalize's teardown deadlocked on a yes it could not give, and only an unattended run shows the gate is gone.
  - clause: 'no folder remains at the workspace''s location'
    needs_test: true
    reason: Step 7 must still remove the merged workspace, which the disk afterwards shows.
  - clause: 'finalize''s result contains the one shared clearing door''s answer for it'
    needs_test: true
    reason: A step 7 that deletes by its own means leaves no door answer in finalize's result.
  - clause: given instead the workspace has already been cleared by its route, the step reports that there was nothing to clear and finalizing still completes
    needs_test: true
    reason: Absence is the ordinary case once routes clear themselves, so it must never halt finalize.
test_spec:
  - name: test_finalize_clear_step_completes_with_no_person_available
    proves_clause: the step completes without waiting for any input
    code_file: templates/workflows-js/finalize-feature.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "With no gate replies scripted, the teardown step completes and no gate dispatch is recorded."
    must_catch:
      - "interactive confirmation gate left in Step 7"
  - name: test_finalize_clears_merged_workspace_through_the_door
    proves_clause: 'no folder remains at the workspace''s location'
    code_file: templates/workflows-js/finalize-feature.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "No folder remains at the workspace location and finalize's result contains the door's removed answer."
  - name: test_finalize_reports_nothing_to_clear_when_workspace_already_gone
    proves_clause: given instead the workspace has already been cleared by its route, the step reports that there was nothing to clear and finalizing still completes
    code_file: templates/workflows-js/finalize-feature.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "With the workspace already removed by its route, the step reports nothing to clear and finalize completes."
  - name: test_finalize_step_7_is_reached_and_makes_its_one_removal_capable_dispatch
    proves_clause: 'finalize''s result contains the one shared clearing door''s answer for it'
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      Grounding added at the test-designer pass (nothing above is weakened). The deployed finalize-feature.js is run
      under run_workflow_under_e2 on a merged-branch fixture with no gate replies scripted, to step 7: today step 7 is
      one agent dispatch labelled step-7-remove-worktree to worktree-agent (finalize-feature.js line 1771) whose reply
      is parsed for removed and conflict_pids, with no preceding maker locate. The test asserts step 7 was reached, no
      gate dispatch is recorded (an unscripted gate is listed in HarnessResult.unscripted_labels), and, once
      BO-4300g-3 is built, the step-7 dispatch is preceded by a shell-runner locate and carries
      removal_authorization beside the name-based remove request.
    code_file: templates/workflows-js/finalize-feature.js
  - name: test_merged_squash_workspace_is_cleared_by_the_name_based_remove_without_a_token
    proves_clause: 'no folder remains at the workspace''s location'
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      At the maker: a workspace whose feature was squash-merged into the hub's main with its line deleted is cleared
      by remove --kind K --slug S with no discard token. Red today: worktree_remove._unsent_commits judges by identity
      only, so the door refuses UNSENT_WORK; green once BO-4400g-2's content check is in the door. When the door
      refuses anyway, finalize reports the work as kept and completes, never forcing.
    code_file: templates/scripts/worktree_remove.py
test_design_authorship:
  step: test-designer
  date: "2026-11-16"
test_design_opened_files:
