notes: |
  Authored from a user request on 2026-08-13 describing a two-layer reachability
  guard. Framing decisions made during authoring, recorded for the BA and IT PO:

  - Placed as a NEW L0 rather than extra L1s under BO-2500. BO-2500 already carries
    four L1s and its axis is "the proof is honest" (a real test, real data, an
    unskippable gate). This tree's axis is "the code under proof is really reached"
    — a different failure mode. Per the build-orchestration PROJECT_CONTEXT rule, a
    drive-time gate concern belongs in build-orchestration.
  - Distinct from BP-1100 (build-pipeline): BP-1100 prevents phantom-done at the
    TICKET and EPIC level (files_touched naming an executable surface, outside-in
    angle testing at finalize). BO-2700 is the mechanical AC-level gate. Do not
    fold either into the other.
  - Distinct from BP-1000e (source <-> shipped workflow-script byte parity) and
    INF-600g (agent registry spawned_by reciprocity). Those are file-copy parity and
    agent-registry reciprocity; BO-2700b/c is command-surface <-> automation-caller
    reciprocity. Same instinct, different registries.
  - The user described only the two enforcement layers. Two supporting guarantees
    were added because the guard is unusable without them: BO-2700d (an honest,
    reviewable exemption for code that legitimately has no runtime entry point —
    without it the guard blocks every helper module and gets switched off) and
    BO-2700e (a failure message that names what is unreachable).
  - "This would have failed the instant PR 411 landed" is regression EVIDENCE, not a
    separate benefit — decompose it as a replay/regression scenario under BO-2700b.

  Explicitly OUT OF SCOPE for this tree (tracked as separate follow-ups by the user):
  the AC-schema ownership-checklist change, the inline pr-reviewer gate in the fast
  lane, and the warn-only orphan-detection meta-test.
