notes: |
  Gaps G1 + G6 of the 2026-10-09 coverage check.

  G1 -- every route, no exceptions: fast-lane ship (BOTH the success path AND the
  empty-set no-op path), quick-fix, AC-authoring, build-feature single-ticket and epic,
  build-backlog. Each calls the central clear (BO-4300e) at its end state once its work
  has landed on the main line (pull request merged, or work merged directly; amended
  2026-11-16, formerly "at the latest right after the pull request is opened"). A route
  whose pull request is still open at its end keeps its workspace as not yet on the main
  line and leaves it to the landed-work pass (BO-4400g); a route that ends with no commits
  of its own clears its workspace right away. Halted/failed runs keep their work
  (ACD-2100c-5 guard) and appear in the listing (BO-4100e); once the verdict reads
  holds-nothing (nothing unsent), the landed-work pass (BO-4400g) clears the workspace as
  soon as its work lands, or once no file in it has changed for 14 days, and keeps younger
  ones (amended 2026-11-16, formerly "reclaimable once the verdict reads holds-nothing").
  Unsent work (not on the shared project, or uncommitted) is never removed.

  G6 -- retire the older removal routes in favour of the central clear: close-worktree's
  remove-without-force path, worktree-agent removal, and finalize Step 7's interactive
  confirmation gate. NEIGHBOUR: BO-4300f-1 already moves every route to the one MAKER and
  names close-worktree.md / worktree-agent.md as llm-expert work; the BA must cite it and
  cover only the removal side it does not.

  Behavioural proof required (repo CLAUDE.md: gate/workflow ACs are verified by running
  them, never by grep): each route is driven to its end state and the workspace is shown
  absent afterwards.

  Q8 DECIDED 2026-10-09 (BrainCandy): no confirmation token for clearing a holds-nothing
  workspace; the BO-4100c verdict is the safety check. Unsent work is discarded only with
  up-front permission (BO-4300e-3). See BO-4400 notes.

  AMENDED 2026-11-16 (user decision at the BO-4400g plan-feature gate): cleared once the work
  has landed on the main line, not when its pull request is opened. A run whose pull request
  is still open at its end keeps its workspace for the landed-work pass (BO-4400g); a run with
  nothing to deliver clears right away; unsent work is never removed. BO-4400a-1 carries the
  same timing (amended by the BA the same day).

  AMENDED (2) 2026-11-16 (second user decision, same gate): work that was sent to the shared
  project but never landed (a failed run, an abandoned or closed pull request) is not lost by
  clearing, because it stays on its line on the shared project. Once nothing unsent remains,
  the landed-work pass clears such a workspace after 14 days with no change to any file in it,
  and keeps younger ones.
