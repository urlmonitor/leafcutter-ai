criteria: |
  Given allowed repository sources and read roots alongside denied or sensitive files,
  And configured source, file, excerpt, character and elapsed-time limits,
  When enrichment searches for context,
  Then it reads only allowed sources within the task's read scope and denial rules,
  And it applies redaction and data-policy restrictions before external model or trace transmission,
  And it stops at its bounds and reports truncation or incomplete coverage honestly,
  And downstream provider projections fit the remaining payload allowance without changing the base request or checkpointed context,
  And it performs no repository writes, host operations or Jev calls of its own.
