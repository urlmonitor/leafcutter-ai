it_requirements:
  - >-
    ASSIGNED python-coder FOR THE PARTS AN AGENT CAN DO; THE REST IS A HUMAN STEP. Editing
    the ruleset and creating the Actions event policy need admin rights; the owner
    performs them by hand. python-coder implements the enforcement-state reader and the
    not-reproduced-red count (reported on the notice by the notice job). The live
    observations are recorded by whoever performs or witnesses them.
  - >-
    THE RULESET AS READ ON 2026-10-08 (the earlier "five contexts" statement was stale and
    is retired). VERIFIED (GitHub expert, API, ruleset updated 2026-10-08T14:30): six
    contexts — Lint (ruff), Component vocab style (components.json), Proof-of-done
    coverage check (BO-2500b), Changelog entry present, AC store valid, Test suite
    (pytest) — each pinned to `integration_id: 15368` (the github-actions app);
    `strict_required_status_checks_policy: false`; `bypass_actors: []`; no pull-request
    review rule. `Post-merge suite status` absent: ADVISORY.
  - >-
    THE ENFORCEMENT-STATE READER IS PURE AND EXACT. "enforced" only when a
    required_status_checks rule lists a context exactly equal to `Post-merge suite status`
    pinned to the dedicated hold App's integration id (5249547 — for a GitHub App the
    ruleset's integration id is its App ID; confirm by the read-back observation);
    anything else, including an unreadable response, "advisory" with a reason. AMENDED
    2026-10-09: SUPERSEDED "pinned to integration 15368"; the context pinned to 15368 is
    now advisory with reason "spoofable source (GitHub Actions)". Where the reader gets
    the expected id (the tunables file, or the `HOLD_APP_ID` value) is for the IT PO; it
    must not be a literal in code, per the tunables rule below.
  - >-
    THE EVENT POLICY IS A HARD PREREQUISITE — VERIFIED (GitHub expert, docs, 2026-10-08):
    "For public repositories that do not already have an applicable Actions event policy,
    GitHub adds a default policy that blocks workflows triggered by `pull_request_target`"
    and "On November 2, 2026, GitHub will enforce the default policy". `GET /repos/
    urlmonitor/leafcutter-ai/actions/policies` returned `{"total_count":0}`. What a
    blocked run looks like is UNVERIFIED, and whether an event policy can be created on a
    personal-account repository is UNVERIFIED. If the policy cannot be created, or a run
    is not observed after it exists, the FALLBACK is a `workflow_run`-triggered job on the
    default branch that computes the verdict and has the dedicated App post the check
    run `Post-merge suite status` on the PR head. AMENDED 2026-10-09: the App-created
    check run is now the PRIMARY route's publication too (TQ-600a-13-vi), and
    TQ-600a-13-xi's allowed writes are amended for it, so the fallback changes only the
    trigger, not the publisher or the write set. Do not add the check to the ruleset on
    either route until a run of that route has been observed reporting through the App.
  - >-
    ROLLOUT ORDER (user decisions H and J; VERIFIED that a `pull_request_target` check
    does not run on the PR that introduces it). TQ-600a-13-xix (with its minimal timing
    workflow) may land before step (1) and is independent of everything below. (1) merge the
    correctness workflow; dispatch it once on main; (2) owner pre-creates labels
    `post-merge-red`, `post-merge-timing`, `post-merge-flaky`; (3) owner creates the event
    policy; read it back; (3a) [added 2026-10-09] owner moves `HOLD_APP_ID` and
    `HOLD_APP_PRIVATE_KEY` from repository secrets to secrets of an environment that only
    `main` may deploy to (see TQ-600a-13-vi), deletes the repository-level copies, and
    observes a throwaway same-repository PR whose added `pull_request` workflow tries to
    read them get nothing; (4) merge the hold and follow-up workflows; (5) observe the
    App's check run (creating app 5249547, read back from the check run) on later PRs and
    a re-evaluation, including one of an already-judged head commit; (6) advisory period,
    with the break-glass procedure documented (TQ-600a-13-xvii); (7) add to the ruleset
    with source = the hold App; (8) observe a held PR reported unmergeable, and a red-run
    PR carrying a passing PR-added job named `Post-merge suite status` reported
    unmergeable; (9) rehearse the break-glass within the first day (TQ-600a-13-xvii).
    Steps (3) to (8) before 2026-11-02 if possible; after that date (3) blocks everything
    after it.
  - >-
    THE REPORTED NAME CANNOT DRIFT OR BE SKIPPED — VERIFIED (GitHub expert): a skipped job
    reports success even when required; a job whose `needs:` failed is skipped; path,
    branch or commit-message filtering leaves the check pending; a matrix suffixes the
    name. So: `name: Post-merge hold evaluation` (AMENDED 2026-10-09; SUPERSEDED `name:
    Post-merge suite status` — that name now belongs only to the App's check run), no
    matrix, no job-level `if:`, no `needs:`, no path filter, and no branch filter that
    could exclude a PR to main. A skipped or never-started evaluation job now publishes
    no App check at all, which blocks rather than passes once required — safe, but it
    still breaks the every-pull-request clause, so the rules stay.
  - >-
    DEMOTION AND ADVISORY NUMBERS — ACCEPTED BY THE OWNER AS TUNABLE DEFAULTS (2026-10-08):
    demote when more than one in three red verdicts in the first 14 days, or three in any
    later 14 days, are not reproduced at the same commit; advisory period at least 7 days
    and at least 20 evaluations matching the run history. "Not reproduced at the same
    commit" is computed mechanically from the run history (a failure-concluded run
    followed by a success-concluded run with the same `head_sha`), not judged by a
    person. The numbers live in the family's ONE tunables file (see the next entry); the
    mechanism stays.
  - >-
    ONE NAMED TUNABLES LOCATION FOR THE WHOLE FAMILY: `scripts/ci/post_merge_tunables.json`
    (JSON so the stdlib-only hold can read it; beside the modules so the hold's sparse
    checkout of scripts/ci already carries it and no build deploy rule touches it — the
    repo's config/ directory is deployed to consumers and this file must not be; read
    from the default-branch checkout, so a PR cannot retune its own hold). Keys and
    accepted defaults: `heartbeat_max_hours`
    12 (documentation of the cron; the cron string itself is in the workflow and a test
    asserts it fires at least this often), `staleness_hours` 30 (-xiv),
    `flaky_window_runs` 5 and `flaky_red_threshold` 2 (-xiii), `run_history_page` 30
    (-v), `advisory_min_days` 7 and `advisory_min_evaluations` 20 (this record),
    `demotion_first_window_days` 14, `demotion_first_ratio` "1/3",
    `demotion_later_window_days` 14, `demotion_later_count` 3 (this record). No module
    in scripts/ci/ carries any of these as a literal; a missing or malformed file fails
    the consuming job closed (for the hold: could_not_read-style failure naming the
    file), never falls back to a hard-coded value silently. Created by whichever family
    record lands first that reads a tunable (normally -ii, for the window), extended by
    the rest.
  - >-
    `Post-merge fix proof` (TQ-600a-13-xvi) IS NEVER ADDED TO THE RULESET. It runs only on
    declaring PRs and is read by the hold; requiring it would hold every undeclared PR on
    a check that never reports.
  - >-
    THE ENFORCEMENT-STATE READ: `GET /repos/{o}/{r}/rules/branches/main` (readable without
    admin — VERIFIED twice). Pure parsing of the response is the unit under test; the
    live read is made by whoever records the observation, and by the notice job when it
    reports the demotion count (a read, no new write).
  - >-
    MERGE QUEUE IS NOT AN OPTION HERE — VERIFIED (GitHub expert): merge queues are
    available only in organisation-owned public repositories; this one is user-owned.
    Recorded so nobody designs the stale-pass fix around it.
  - >-
    THE EVERY-PULL-REQUEST, EVENT-POLICY AND HOLDS-MERGES CLAUSES ARE RECORDED LIVE
    OBSERVATIONS, NOT TESTS. They are properties of the hosting service. Until every
    observation in the criteria is recorded in this record's notes, this record is not
    done.
  - >-
    THE TESTS COST UNDER 0.3 s. The reader in-process on captured response shapes; the
    not-reproduced-red count and the tunables descriptor in-process; the name descriptor
    via the shared workflow-step executor.
delivers_to:
