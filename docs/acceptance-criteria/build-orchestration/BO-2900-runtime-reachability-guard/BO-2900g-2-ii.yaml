test_spec:
  - name: test_bo_2900g_2_ii_stream_writes_and_described_writes_do_not_derive_true
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "The three non-durable shapes, taken verbatim from the real records that exhibited them — a notice written to the error stream, a reported clause where a document states that a write happens, and a relative clause naming where entries are kept — each derive false, while a fourth asserting a file readable after the run derives true."
  - name: test_bo_2900g_2_ii_narrowing_adds_no_new_disagreement
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "STORE-WIDE, AGAINST THE REAL FILES: every record under docs/acceptance-criteria/ whose authored declares_side_effect disagrees with the derivation must appear in the KNOWN_PRE_EXISTING allowlist pinned in the test. The test fails on any disagreement outside that list, so a future widening or narrowing cannot add one silently. Deliberately NOT 'zero disagreements' — nine records disagreed before this change and are held by that allowlist rather than edited, because they are a separate defect in the opposite direction."
  - name: test_bo_2900g_2_ii_an_author_who_is_right_can_record_it
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "A record whose Then clause asserts no durable effect and which authors declares_side_effect: false is ACCEPTED by validate_declares_side_effect. Guards the second criterion without an override: the acceptance must come from the derivation agreeing, so the same test fails if the fix is an escape hatch that accepts any authored value."
  - name: test_bo_2900g_2_ii_durable_effects_still_route_the_smoker
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    description: "REGRESSION FLOOR: a record asserting a file readable after the run still derives true and still causes generate_ticket_from_ac.py to place user-surface-smoker in the generated ticket's agents map as needed. The narrowing must not quietly disable the guard it feeds."
  - name: test_bo_2900g_2_ii_later_scenario_over_match_is_pinned_as_known
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: seam
    description: "CHARACTERISATION, NOT AN ENDORSEMENT: a multi-scenario record whose first Then asserts nothing durable and whose SECOND scenario's Given mentions a written file currently derives TRUE, because the search runs from the first Then to the end of the criteria. The test asserts the present behaviour and names it as the deferred defect, so the day someone bounds the scenarios this test fails and points them at the three affected records rather than letting the change land unnoticed."
test_rationale: |
  Four of the five descriptors use phrasing lifted verbatim from records that actually
  tripped this, rather than invented examples, because invented examples are how the
  original pattern came to accept "is written" in the first place — the author pictured
  "a file is written" and the regex also accepts "the file suppressions are written in".

  The store-wide descriptor is the load-bearing one and is deliberately an integration
  test over the real directory. The parent's guarantee is about the STORE, not about the
  function: a unit test of the narrowed pattern passes while sixteen records sit in
  disagreement waiting to fail on whoever stages them next. Only a run across the actual
  files can see that, and it is also the test that keeps the correction honest, since it
  fails identically whether the sixteen were left alone or bulk-set to the convenient value.

  The third descriptor is written so that the obvious wrong fix fails it. If the second
  criterion is satisfied by adding an override, an authored false is accepted for a record
  that genuinely does assert a durable effect too — so the descriptor asserts acceptance
  for a non-durable record AND, by pairing with the first descriptor, that the acceptance
  came from the derivation rather than from permissiveness.
