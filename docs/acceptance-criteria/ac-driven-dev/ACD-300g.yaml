title: "Each stage's AC output is committed to git before the workflow advances to the next stage"
component: ac-driven-dev
level: L1
status: active
req_status: active
work_status: in_progress
criteria: |
  Given the /create-ac workflow dispatches authoring agents in stages
    (PO v3, BA v3, IT PO v3) with user confirmation gates between them,
  When the user approves a stage's output at a confirmation gate,
  Then all AC YAML files created or modified during that stage are committed
    to git before the next agent is dispatched,
  And each commit includes only the AC files from the completed stage,
  And each commit message identifies the workflow run and stage,
  And if the commit fails, the workflow does not advance to the next stage,
  And if the user cancels at a gate, no commit is made for that stage's output.
depends_on: [ACD-300, ACD-300b, ACD-300c]
