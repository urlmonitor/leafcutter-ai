change_target: pipeline
risk_surface: internal
notes: |
  Isolated as an L3 because it is the smallest gap through which the exemption becomes
  a rubber stamp: if a reasonless exemption works, every exemption will eventually be
  reasonless, and BO-2900d-2's reviewable inventory becomes a list of blanks.

  THE DISTINGUISHING CLAUSE IS THE REAL CONTENT. The easy implementation treats a blank
  reason as no exemption, which produces the right verdict with the wrong message: the
  author is told to add an exemption they can see they already added, and concludes the
  guard is broken. Telling the two apart costs one branch and saves the report from
  being disbelieved.

  SCOPE HONESTY — READ BEFORE WIDENING THIS. Only empty-or-whitespace is specified,
  because only that is mechanically decidable. A reason of "TODO", "n/a", or the unit's
  own name is just as useless, and this AC deliberately does NOT try to catch it: any
  attempt produces a keyword blacklist that is trivially evaded and that fails honest
  reasons which happen to contain a banned word. Reason QUALITY is a review concern,
  and BO-2900d-2's reviewable inventory is the instrument that makes it reviewable.
  Recording this decision here so a later implementer does not "improve" the rule into
  a blacklist.
