notes: |
  The obligation is declared, not detected. The source entry rules out inferring
  the family of work from the text of a requirement — every available signal is
  suggestive and none is dependable — so the choice between the two forms of
  proof is an explicit statement made by whoever does the work. A downstream
  author must not turn this into automatic classification.
