criteria: |
  The knowledge-query SKILL.md contains an "Agent Consumption Protocol" section
  that is the single source of truth for how AC-authoring agents (product owner, business analyst,
  technical planner) invoke the skill, interpret results, handle errors, format citations,
  and degrade gracefully. Each agent template declares the skill in its
  skills_used frontmatter and references the protocol with agent-specific query
  parameters — without duplicating error handling, citation format, or zero-result
  behavior in three separate template bodies.
