title: "Test failure hands context back to the implementation agent for rework"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given python-coder has signed off on a ticket
    and test-runner is dispatched and runs the test suite,
  When test-runner reports test failures (status: failed in its sign-off comment),
  Then ticket-supervisor re-dispatches python-coder (the same implementation agent)
  And the re-dispatch includes the test-runner's failure output:
    - The names of failing tests
    - The assertion errors or stack traces
    - The file paths of the failing test files
  And python-coder's status in the agents map is reset from "signed_off" to "needed"

  Given python-coder fixes the code and signs off again,
  When test-runner is dispatched for the second time,
  Then it runs the full test suite (not just the previously-failing tests)
  And if all tests pass, test-runner signs off with status: ok
  And the chain proceeds to the next agent

  Given test-runner fails and the implementation agent is sql-coder
    (not python-coder),
  When ticket-supervisor re-dispatches for rework,
  Then it re-dispatches sql-coder (the original work agent for this ticket),
    not python-coder
