notes: |
  Split from BP-900g-8-ii because the surfaces and the agents differ: g-8-ii changes
  the build's derivation (python-coder); this changes prose an author reads before
  the build ever runs (documentation-expert). Keeping them in one AC would have put
  two agents on one criterion.

  Sequencing matters more than usual here. The rule must be corrected against the
  specified behaviour, not against an implementation in progress — otherwise the
  documented rule inherits whatever the coder happened to build, which is how the
  current wording came to describe only the module case in the first place.

  Note the reach limitation the author should be aware of: CLAUDE.md is not deployed
  to consumer projects (ADR-001), so this rule governs contributors to the package,
  not consumers. That is correct for this rule — it is a rule about adding a
  dependency to the package — but it means the rule cannot be the enforcement, only
  the explanation. The enforcement is g-8-ii.
