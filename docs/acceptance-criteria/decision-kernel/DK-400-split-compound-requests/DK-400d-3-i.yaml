assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-400d-3
  contract: "The recorded rejection and the trigger it reads."
it_requirements:
  - The run ends blocked with today's capability gap for the goal (the same gap_key and fields as the split.enabled
    false run of the same goal), capability_gap_recorded true, no decision and no staged record.
  - 'For trigger ambiguous the rejection does not end the run blocked: the split''s state is rejected_clarify and
    the request falls back to today''s insufficient_context path, unchanged: with routing.on_insufficient_context
    ''human'' today''s clarification question is opened (the same template and choices as today) and the run is
    waiting_human; follow-ups count against intent.max_clarifications; today''s ambiguous gap is recorded only if
    the request ends unresolved (the person cannot be asked, or the follow-up limit is reached), and only then does
    the run end blocked. capability_gap_recorded stays false while the question is open and becomes true only with
    that unresolved ending.'
  - 'A request that falls back to the clarification question after a rejected or too-small ambiguous split is never
    offered a split again in the same run: the item keeps its Decomposition (rejected_clarify) and its split_checked
    flag (DK-400c-3), so the bundle check is skipped for it even after the person''s answer changes its effective
    goal, and it routes normally from there. This holds even when the clarification answer itself bundles several
    questions: the user chose today''s clarification, and today''s clarification path never splits; the person can
    start a new run to get a split.'
  - 'Tests enable splitting explicitly: split.enabled true through a config override (false only where a test compares
    with the off switch). None relies on the shipped default, which stays false until E3 merges (dec-9925ebf1895222f4,
    see DK-400a-1). A test asserting that no split starts must run with splitting on, or it passes for the wrong
    reason.'
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_rejected_jev_none_split_blocks_and_records_todays_gap
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: Rejecting the trace-analyzers (jev_none) split ends the run blocked with one gap observation equal
      to the split.enabled false run's, no decision and no staged record, and split state rejected.
  - name: test_rejected_ambiguous_split_asks_todays_clarification
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: Rejecting the split of the ambiguous format-and-repeats goal sets state rejected_clarify; the run
      is waiting_human on today's capability clarification question (same template and choices as the split.enabled
      false run), and no gap observation exists while it is open.
  - name: test_rejected_ambiguous_split_records_gap_only_if_unresolved
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: failure
    description: When the follow-up limit (intent.max_clarifications) is reached without a usable answer, today's
      ambiguous gap is recorded, capability_gap_recorded becomes true and the run ends blocked.
test_rationale: 'Both endings are compared with the off-switch run of the same goal (the precise meaning of ''as
  today''): the stored gap observation for jev_none, and the clarification question and the absence of a gap for
  ambiguous; the unresolved ending is driven to the follow-up limit.'
