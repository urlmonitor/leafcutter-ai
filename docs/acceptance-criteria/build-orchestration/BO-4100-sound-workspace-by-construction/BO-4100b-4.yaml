notes: >-
  The cross-session-damage arm of BO-4100b. Observed 2026-09-14: the refusing check's own
  suggested remedy was to rebuild, which is KI-BP-016 and deploys an unmerged branch's
  material over the live shared install that other concurrent sessions are reading -- so
  following the advice the tool gives is the failure. The first clause is load-bearing:
  without it this AC is satisfiable by offering no remedy at all, which leaves the author
  stuck rather than safe. All three clauses are observable states of trees on disk, not
  properties of any wording.
