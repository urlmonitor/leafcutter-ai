id: BO-1100d-1
components:
  - build_orchestration
title: "Unmatched file groupings are logged with their structural shape"
component: build-orchestration
level: L2
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given staged files do not match any routing config entry,
    and the staged files are:
      - docs/architecture/components/new-component.md
      - docs/architecture/diagrams/new-component-c4.mmd
  When the commit agent determines no group matches,
  Then the agent logs an entry recording the structural shape:
    - directory pattern: "docs/architecture/**"
    - file count: 2
    - file extensions: [".md", ".mmd"]
  And the log entry is appended to a persistent shape-tracking store
    (not lost when the agent invocation ends),
  And the log entry includes a timestamp for the occurrence.
depends_on: [BO-1100d]
doc_links:
  - path: templates/commit-guardian/commit_guardian.json
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The shape-tracking store must be a durable, human-readable file (JSON or JSONL) at a documented path"
  - "Must handle concurrent writes gracefully (append-only, no read-modify-write race)"
  - "Must handle errors gracefully per the project error handling policy"
  - "Must be idempotent within a single commit invocation (logging the same shape twice in one run appends only one entry)"
delivers_to:
  agent: python-coder
  contract: "A persistent JSON shape-tracking store at a documented path. Each entry: {shape: {dir_pattern: string, extensions: string[]}, count: int, last_seen: ISO-8601 timestamp}. The store is read by BO-1100d-2 to check occurrence thresholds."
expects_from:
  ac_id: BO-1100a-1
  contract: "JSON classification result: {matched: false, unmatched_files: string[], structural_shape: {dir_pattern: string, extensions: string[]}}"
test_spec:
  - name: test_unmatched_shape_logged_with_dir_pattern_count_and_extensions
    target_dir: unit_tests/
    framework: unittest
    type: unit
    description: "Given the two unmatched staged files docs/architecture/components/new-component.md and docs/architecture/diagrams/new-component-c4.mmd (no routing config entry matches), invoke the shape-logging function and read back the persisted entry from the actual on-disk store (not the function's return value) -- assert the recorded structural shape has directory pattern 'docs/architecture/**', file count 2, and extensions {'.md', '.mmd'} (set/order-independent). A test that only greps source for these literals is not acceptable; the assertion must read the real persisted record."
  - name: test_shape_log_entry_survives_process_restart
    target_dir: unit_tests/
    framework: unittest
    type: integration
    description: "After logging one unmatched-shape occurrence in one process invocation, open the shape-tracking store fresh (a new read, e.g. a separate function call against the same path, or a subprocess) and assert the entry is still present. Proves the write is durable to disk -- not lost when the logging invocation ends -- as the AC's Then clause requires; an in-memory-only store must fail this test."
  - name: test_shape_log_entry_includes_iso8601_timestamp
    target_dir: unit_tests/
    framework: unittest
    type: unit
    description: "After logging an unmatched-shape occurrence, read back the persisted entry and assert it carries a timestamp value that parses as ISO-8601 (e.g. via datetime.fromisoformat on the stored string). Asserted against the actual stored field value, not against the presence of the string 'timestamp' in source."
test_rationale: |
  Derived one test per Then clause in this AC's own Gherkin criteria: the shape
  fields recorded (dir pattern, file count, extensions), the durability of the
  write (survives beyond the invocation), and the timestamp. All three assert
  against the real persisted record read back from disk/subprocess, per this
  repo's rule that a gate/runner/logging behavior must be verified by executing
  it, never by grepping source for a string. Deliberately excludes the
  file-count-invariant identity rule (shapes differing only in file count are
  the same shape) -- that edge case belongs to and is already specified by the
  child AC BO-1100d-1-i, and restating it here would duplicate that contract.
origin_agent: business-analyst-v3
