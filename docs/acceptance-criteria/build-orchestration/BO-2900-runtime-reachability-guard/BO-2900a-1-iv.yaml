notes: |
  THE LIVE EXAMPLE, so no implementer has to reconstruct it. A criterion whose
  record names one module is refused today with a message naming an entirely
  different module's way in, because the proof imports both and the other one
  sorts first alphabetically. The clearing action that message trains is "make
  your test call an unrelated module's way in" — which is worse than no rule,
  because an author who follows it writes a proof that is a ritual by
  construction.

  THIS IS THE CHEAPEST OF THE FOUR REPAIRS AND THE MOST CONTAINED. It removes a
  guess rather than adding a mechanism: the criterion already records what
  implements it, and the rule already has to name a unit in its finding. Nothing
  about the observation changes.

  THE NO-VERDICT BRANCH IS THE WHOLE SAFETY MARGIN. A record that names no unit
  is common, and the tempting fallback — guess from the proof's imports when the
  record is silent — reinstates exactly the defect being removed, for exactly the
  population most likely to be misjudged. No verdict is the correct answer there,
  and it must not be reported as a refusal.

  THE BUILD-OUTPUT CLAUSE IS SEPARATE FROM THE WRONG-UNIT CLAUSE and the two are
  easy to conflate. Resolving a unit into the build-output tree does not by itself
  change whether the code was reached — it changes which path the finding names,
  and a build output can be stale against the source the record names. An
  implementer who fixes only the alphabetical-sort half will still emit findings
  pointing at a copy of the file rather than the file.

  DO NOT SETTLE SCOPING HERE. Narrowing the judged population is a consequence of
  this rule, not its purpose, and the analysis it derives from recommends
  deferring the scoping choice until the observation is honest. An implementer who
  treats this AC as licence to decide which kinds of criteria the rule judges has
  exceeded it.

  VERIFICATION MUST EXECUTE THE EVALUATION over a criterion whose record names
  one unit and whose proof reaches for another that has a way in, and assert
  against the unit the run actually named. Asserting that the record is read is
  not the same as asserting the finding names what it read.
