it_requirements:
  - "FIVE REASONS, NOT FOUR. The criteria separate a transport failure, an incomplete result, an executor decline and a command that ran and exited non-zero. A guardrail or permission-rule block is a FIFTH and must be reported as a refusal BY THAT GUARDRAIL, naming it wherever the block message names it (BO-3200g) -- never as the executor declining, never as the command failing, and never with an exit status. Folding it into 'declined' sends the reader to the executor's charter, which is not what stopped the command. Each of the five reasons must differ from the other four in the report."
  - "THE OUTCOME IS BO-3200e-1's `undetermined` IN ALL FIVE CASES; ONLY THE REASON DIFFERS. Reuse the shared undetermined value the runtime already refuses to count as success (PR #565). No per-reason status value."
  - "AN EXIT STATUS IS REPORTED ONLY WHEN BO-3200f-1's CAPTURE PRODUCED IT AND IT VERIFIED. A reply asserting an exit status without a verifying capture -- KI-ACD-009's refusal payload carrying exit_code 1 -- is reported as incomplete or declined, never as an exit status."
  - "CLASSIFICATION IS MECHANICAL. The reason comes from the dispatch helper's could-not-complete reason, never from reading the executor's prose for words such as 'cannot' or 'out of scope'. A keyword scan is the judgement this tree removes, moved into the consumer."
  - "NO FINDING ABOUT THE SUBJECT in the first three cases or the guardrail case: no permission verdict, and no statement that the registry is missing, unreadable or malformed. Only in the fourth scenario are the path, the command's exit status and its error stream quoted -- verbatim -- as the reason."
  - "ONE CONSUMER-SIDE MAPPING shared by every check that reads through the executor, not re-implemented per check. The plan-feature startup check (ACD-2100b-5) is the first consumer, not the only one; BO-3200f-3 routes the rest through the same mapping."
  - "RETRIES, IF ANY, ARE BOUNDED AND DO NOT CHANGE THE MEANING: a transport failure that succeeds on retry is a completed result; one that does not is reported with the last failure as its reason. A retry must never turn a decline or a guardrail block into a transport failure."
  - "Must satisfy the repository error-handling policy: every could-not-complete path is logged at WARNING or higher before the could-not-tell report is emitted."
delivers_to:
  - agent: python-coder
    contract: "The could-not-check mapping for executor-backed checks: given the dispatch helper's result, returns BO-3200e-1's outcome with outcome 'undetermined' and uninspectable_reason one of 'executor_transport_failed' | 'executor_result_incomplete' | 'executor_declined' | 'guardrail_blocked' | 'command_exited_nonzero', plus {detail: str, exit_status: int | null, stderr: str | null, blocked_by: str | null}; exit_status and stderr are non-null only for 'command_exited_nonzero'. Consumed by ACD-2100b-5, BO-3200a-1 and every site BO-3200f-3 repoints."
  - agent: reference-author
    contract: "The five reasons, what each means and what it does not mean, and the rule that only 'command_exited_nonzero' carries an exit status -- for BO-3200f-4's third Then."
expects_from:
  - ac_id: BO-3200f-1
    contract: "The executor dispatch helper result: {outcome: 'completed', cwd, exit_status, stdout, stderr} or {outcome: 'could_not_complete', reason: 'transport_failed' | 'incomplete' | 'declined' | 'guardrail_blocked' | 'invalid_dispatch', detail, blocked_by}, with verification already applied."
  - ac_id: BO-3200e-1
    contract: "The three-valued check outcome {outcome: 'in_order' | 'problem_found' | 'undetermined', subject, finding, uninspectable_reason, advice} reusing PR #565's undetermined vocabulary."
