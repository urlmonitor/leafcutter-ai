id: ACD-1300c-1
title: Bound each AC to three attempts and sixty total implementation minutes
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given an AC has consumed two attempts and fifty implementation minutes
  When another implementation or repair attempt is considered
  Then at most one further attempt and ten implementation minutes remain for that AC
  And the run blocks when either the third unsuccessful attempt or the sixty-minute total is reached
  And initial work and later validation or review repair share these counters
  And no new automatic attempt starts after either limit is exhausted
