notes: |
  The 2026-10-12..14 UXP-510 reply carried refusal.reason bootstrap_script_failed and cited
  two warnings as its evidence (see BO-2400f-3-v and BO-2400f-3-vi). Distinct from
  BO-2400f-5-iii: that record covers an agent that declines the task; this one covers an
  agent that performs the task and then misreports its result. The halt classification
  should sit beside the declined-step classification, not be merged into it, because the
  remedy differs (look at the setup's own result, not at who was asked).
