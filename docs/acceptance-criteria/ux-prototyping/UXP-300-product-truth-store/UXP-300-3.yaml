id: UXP-300-3
title: Every existing node declares checked handoffs or an honest, visible limitation
component: ux-prototyping
components:
- ux_prototyping
level: L3
status: active
req_status: active
work_status: done
readiness: reviewed
priority: medium
criteria: 'Given the Product Truth store includes existing and newly authored flow steps and branches,

  When the record is checked,

  Then every node supplies checked input and output bindings with examples, a specific genuine non-JSON
  explanation, or an explicit proposed missing binding,

  And removing that metadata from an existing flow identity fails just as it does for a new identity,

  And known bindings remain checked when a separate proposed interface is missing,

  And each missing binding has a nonblank name and reason, a direction and an existing permitted source,

  And each source-reviewed or illustrative-design definition carries its authority and nonblank explanatory
  note,

  And the report counts checked fields and examples separately from missing bindings and lists each gap''s
  flow, node, direction, reason and source,

  And an empty installed consumer store is reported without acquiring this repository''s retrieval-needs
  runtime requirement.'
depends_on:
- UXP-300
