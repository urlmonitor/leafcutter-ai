criteria: |
  Given the written reference for the requirement store describes the parent
    back-link rule as blocking and unconditional,
  When the strengthened commit-time check ships,
  Then the written reference states the rule the check actually enforces,
    including the cases where the check declines to run and the case where a
    deliberately parked tree is exempt,
  And a reader who has only the written reference correctly predicts the check's
    outcome for a child whose dependency list does not name its structural parent,
    for a child whose structural parent cannot be located, and for a child of a
    parked tree,
  And the reference states, for each of those three, whether the outcome is a
    pass, a violation, an exemption, or a did-not-run.
