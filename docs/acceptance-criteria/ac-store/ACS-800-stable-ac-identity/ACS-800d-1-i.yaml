title: "Migration surfaces a requirement whose legacy name cannot be parsed"
component: ac-store
level: L3
status: active
req_status: approved
work_status: todo
criteria: |
  Given an existing requirement whose position-encoded name does not match any
    recognised legacy id form (a malformed name from which no parent, level, or
    order can be derived),
  When the migration runs,
  Then the migration does not silently guess a hierarchy for that requirement,
  And it reports the malformed name and the requirement so a human can resolve
    it,
  And the rest of the store still migrates rather than the whole migration
    aborting on the single malformed entry.
