title: "Per-worktree isolation: untracked cache dir, never git-tracked, atomic per-surface writes"
component: knowledge-management
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100b.yaml"
criteria: |
  Given the index is written to a cache directory keyed to the current worktree root
  When the index is created or refreshed
  Then the cache directory is untracked and gitignored, so the index never appears in
    git status, a diff, or a merge for any worktree
  And two different worktrees of the same repository each maintain their own index and
    do not read or overwrite each other's index
  And each surface's index is written atomically by writing to a temporary file and
    renaming it into place, so a concurrent reader always sees either the complete
    previous index or the complete new one, never a half-written file
depends_on:
  - KM-KGS-100b-11
doc_links:
  - path: scripts/knowledge_query.py
    relationship: describes
    status: exists
  - path: docs/architecture/components/knowledge-management.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The cache directory lives under the worktree's own output_root (`.leafcutter/...`) and is untracked/gitignored — it must never appear in git status, a diff, or a merge; if the output_root is not already ignored, the writer ensures the cache subdir is."
  - "Two worktrees of the same repo maintain independent indexes under their own roots and never read or overwrite each other's — isolation follows from the KM-KGS-100b-11 per-worktree path resolution."
  - "Each surface index is written atomically: write to a temp file in the same directory, then os.replace() into place, so a concurrent reader always sees either the complete previous or the complete new file, never a partial write."
  - "Write failures (disk full, permission) are logged at WARNING and must not corrupt the existing index or raise to the read caller — a failed write leaves the prior complete index in place and the read still degrades to self-heal/live-parse."
test_spec:
  - name: test_cache_dir_is_untracked_and_gitignored
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: unit
    description: "The index cache dir under output_root does not appear in git status/diff (is gitignored)."
  - name: test_two_worktrees_have_independent_indexes
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: integration
    description: "Two worktrees of the same repo maintain separate indexes and do not read or overwrite each other's."
  - name: test_surface_index_written_atomically
    target_dir: unit_tests/knowledge_management/
    framework: unittest
    type: unit
    description: "A surface index is written via temp file + os.replace so a concurrent reader never observes a half-written file."
