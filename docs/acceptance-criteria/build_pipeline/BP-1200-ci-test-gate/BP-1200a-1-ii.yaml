assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "DECIDED DIRECTION (final gate, recorded in ADR-016): APPROACH 1 — CI build step + install_shims shim_map extension bridging .leafcutter/scripts/... -> scripts/... for scripts/commit_guardian, scripts/doc_compliance, scripts/feedback. This edge case pins the specific failure class — collection-time import/file-open errors for the ~36 tests that depend on those gitignored directories — that Approach 1 must eliminate by running build.py and bridging the shim."
  - "Acceptance is measured at pytest COLLECTION/startup: the count of tests erroring before execution due to a missing build-generated module or file must be exactly zero on a fresh clone after the documented build+shim prepare step."
  - "SHARED-CONTRACT VALIDATION (retained): the shim that makes .leafcutter/scripts/ resolvable at scripts/ is a SHARED CONTRACT with consumer-project installs; validate the zero-collection-error outcome against a consumer install as well as the self-build before sign-off."
  - "Must not regress the import resolution for tests that already pass on a fresh clone (no broadening of sys.path or shim scope that masks genuinely missing modules — the shim bridges exactly the three known build-output directories, not a blanket path catch-all)."
  - "Must respect the ADR-001/ADR-004 self-hosting boundary: Approach 1 bridges via shim; do not resolve the gap by committing generated outputs into source control."
