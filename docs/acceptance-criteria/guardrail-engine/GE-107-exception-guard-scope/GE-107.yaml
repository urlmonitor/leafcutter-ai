title: "Exception-handling guard enforces the error-handling policy on production code only"
component: guardrail-engine
level: L1
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-107-exception-guard-scope/GE-107.yaml"
criteria: |
  The AST I/O-boundary guard (check_exception_handling.py) applies the
  error-handling policy — bare except (E722), blind except Exception (BLE001),
  and unwrapped I/O calls (IO-001) — to production Python source. Test code is
  exempt, because tests legitimately call open() and catch broad exceptions
  (e.g. asserting a teardown does not raise) in ways the production policy does
  not require. The exemption is scoped narrowly enough that production files are
  never silently skipped.
