it_requirements:
  config_schema_fragment:
    workflow_harness_injected_globals_contract:
      type: object
      description: "The engine-fidelity contract for run_workflow_under_e2(): the exact set of globals the harness exposes to a workflow body (agent, parallel, pipeline, phase, log, args, workflow, budget) and the guarantee that no module loader and no filesystem primitive is reachable from it. Sourced from ADR-017-dual-engine-workflow-support:51 so the harness and the real engine cannot diverge."
  reference_file_path: "unit_tests/_workflow_engine_harness.py"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python -m pytest unit_tests/workflows/ -q"
  constraints:
    - "ORDERING — the harness fidelity change comes FIRST. Authoring the re-authored journal tests against today's harness ships a test that certifies a behaviour the production engine cannot perform: a reviewer already executed run_workflow_under_e2() against finalize-feature.js and it wrote 9 journal records in step order, present at run end, with zero implementation. Do not author scenario 1 until scenario 2 holds."
    - "SHARED TEST INFRASTRUCTURE — unit_tests/_workflow_engine_harness.py is depended on by every workflow test. Making it engine-faithful will turn other currently-green workflow tests red. Those must be triaged and re-authored inside this same diff. Re-admitting require(), a module loader, or a filesystem primitive to the harness in order to keep another test green is a violation of this AC, not a fix."
    - "The injected-globals set must be declared ONCE and read by the harness, not duplicated as a literal in the harness and again in the runner; a second copy is free to drift from ADR-017 and from the real engine."
    - "The replacement coverage must be able to tell a working journal from a no-op one: it must FAIL when the run produces zero journal records. A test that passes on both outcomes has not re-authored anything."
    - "The correct end state may be either a journal that works under the injected-globals contract or a journal that is removed — the assignee decides. What is not acceptable is a journal-append call whose failure is swallowed by the surrounding catch and reported as a successful run."
    - "Do not satisfy this AC with a renamed or broadened regular expression over finalize-feature.js. Presence-only assertions over workflow source are the defect class this L1 exists to eliminate, and BP-1100b-5 in the same bundle makes them a reportable violation — introducing one here would be caught by the sibling AC's own gate."
    - "Must follow the repo error-handling policy: specific-exception try/except around file and subprocess I/O in the harness, log at WARNING or higher or re-raise; no bare or silent excepts."
    - "BUNDLE B file scope: this AC edits unit_tests/_workflow_engine_harness.py, unit_tests/workflows/test_bo_1000c_1a.py and templates/workflows-js/finalize-feature.js. Its sibling BP-1100b-5 edits the commit-guardian config, a new hook script and the hook doc index — no file overlap, so the two may proceed in parallel. The harness change should nonetheless land before any other branch adds a new workflow test, or that test will be authored against the unfaithful harness."
test_spec:
  - name: test_one_journal_record_is_appended_per_completed_step
    target_dir: unit_tests/workflows/test_bo_1000c_1a.py
    framework: pytest
    type: behavioral
    description: "Executing the finalize workflow under the engine-faithful harness produces exactly one journal record per completed step — cardinality asserted against the steps the run actually completed, not against a hardcoded count."
  - name: test_journal_records_appear_in_step_order
    target_dir: unit_tests/workflows/test_bo_1000c_1a.py
    framework: pytest
    type: behavioral
    description: "The journal records produced by that executed run appear in the order the steps completed."
  - name: test_journal_records_are_still_present_when_the_run_ends
    target_dir: unit_tests/workflows/test_bo_1000c_1a.py
    framework: pytest
    type: behavioral
    description: "The journal records written during the run are still readable after the workflow terminates, so a run that journals into a location the workflow later removes does not count as journaling."
  - name: test_run_that_cannot_append_fails_instead_of_passing
    target_dir: unit_tests/workflows/test_bo_1000c_1a.py
    framework: pytest
    type: behavioral
    description: "A run in which the append cannot happen in the execution environment — the append swallowed by the surrounding error handler — fails at least one of the journal tests rather than passing with zero records."
  - name: test_renaming_the_journal_helper_leaves_the_tests_green
    target_dir: unit_tests/workflows/test_bo_1000c_1a.py
    framework: pytest
    type: behavioral
    description: "Renaming the journal-appending function, or rewording its declaration, without changing what is journaled leaves every journal test green — proving the coverage binds to behaviour rather than to source text."
  - name: test_harness_exposes_only_the_engine_injected_globals
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "A workflow body run under run_workflow_under_e2() can reach exactly the globals the real engine injects (agent, parallel, pipeline, phase, log, args, workflow, budget) and nothing else — enumerated from the workflow body at runtime, not asserted against a copy of the list."
  - name: test_harness_exposes_no_module_loader_to_the_workflow_body
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "A workflow body that attempts to reach a module loader or a filesystem primitive under the harness is refused exactly as the real engine refuses it."
  - name: test_filesystem_dependent_journaling_produces_zero_records_under_the_harness
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "A workflow whose journaling depends on a filesystem primitive produces zero journal records under the engine-faithful harness — the calibration that proves the harness now reproduces the production failure."
test_rationale: "The incumbent coverage is a declaration regex, and the naive replacement is a false green: run_workflow_under_e2() today runs the workflow as a CommonJS temp file under plain node, where require('fs') resolves, so the prescribed executed assertions already pass with zero implementation. The test contract therefore has two halves that must both hold — five descriptors that execute the finalize workflow and assert observable journal outcomes, and three that pin the harness to the ADR-017 injected-globals contract so the first five are meaningful. A direct-import unit test over the journal helper, or any assertion over finalize-feature.js source text, would satisfy neither half."
delivers_to:
  - agent: test-writer
    contract: "An engine-faithful run_workflow_under_e2() harness that exposes only the ADR-017 injected globals (agent, parallel, pipeline, phase, log, args, workflow, budget) and no module loader or filesystem primitive, so every subsequent workflow test asserts behaviour the production engine can actually perform."
