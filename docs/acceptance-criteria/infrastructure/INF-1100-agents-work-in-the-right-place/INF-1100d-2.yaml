title: "Agents that write or run database tests use the connection your settings name, and no other"
component: infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a project whose settings set db_connection_test to
    postgresql://app:app@db.internal:5432/app_test,
  When the test writer writes a database test,
    And the test runner checks that the test database is reachable before
      running database tests,
    And the test workflow describes how to run the database suites,
  Then the database test takes its connection from that setting,
    And the test runner's reachability check uses that setting,
    And the workflow's description refers to the configured test database,
    And none of the three names a host, port or database of its own — for
      example "requires the database on port 5403" is not presented as a fact
      about the user's project.
