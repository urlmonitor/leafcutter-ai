    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Assert a consumer can classify the resolved target as undetermined from the target alone, without being told the epic's work-store folder -- the property that would have let a downstream step catch this."
  - name: test_the_working_copy_appears_once_a_later_step_establishes_it
    target_dir: unit_tests/prompt_assembly/
