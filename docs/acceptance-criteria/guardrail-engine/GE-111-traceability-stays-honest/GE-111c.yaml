id: GE-111c
components:
  - commit_guardian
readiness: approved
priority: high
title: "Only get stopped for links your commit actually touched"
component: guardrail-engine
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  The check fires on the code you are changing, not the whole history.

  Only links affected by the source files in the current commit are evaluated,
  so a pre-existing broken link elsewhere in the project never blocks an unrelated
  change — you are asked to fix exactly what this commit broke and nothing more.
