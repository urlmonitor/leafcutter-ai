notes: |
  THE PREMISE IS REACHABLE, NOT HYPOTHETICAL. Zero of 60 definitions carry the
  marker today, which is the defect. The state this criterion describes arises
  the moment anyone, mid-repair, adds one -- following the old instructions, or
  copying a definition from a branch where the marker fix was attempted. It is
  the most likely wrong turn on the way to the fix, not an exotic input.

  REPORTING IT IS WHAT STOPS IT BECOMING PERMANENT. A leftover token that
  produces a correct prompt is invisible, and invisible residue is how a tree
  ends up with two mechanisms again -- which is the state AR-300c exists to end
  on the declaration side.
