id: KM-500d-3-ii
title: The coverage requirement is fixed with the set, so it cannot be absent or lowered to pass a comparison
component: knowledge-management
components:
- knowledge_management
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-500d-3
criteria: |
  Given a case pack that has no coverage requirement fixed with its set
  When a baseline report and a proposal report on it are compared
  Then the comparison outcome is limited with the reason "no frozen coverage requirement", whatever the pack declares about itself

  Given a baseline report measured on S1 under its fixed coverage requirement, in which one_suitable_query needs at least 15 cases
  And that requirement is then lowered to 5 cases while the case file stays the same
  When the baseline and a proposal measured under the lowered requirement are compared
  Then the comparison outcome is invalidated, naming the coverage requirement as changed since the baseline
  And no promotion verdict is given until the requirement is fixed again and the baseline is measured under it

  Given a case set in which 7 cases have no category label or no target family
  When its representativeness is worked out
  Then those 7 cases count toward no category and no family, and the result states the count of unlabelled cases.
depends_on:
- KM-500d-3
- KM-500d-3-i
- KM-500a-4-v
