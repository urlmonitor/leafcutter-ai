assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  reference_file_path: "scripts/build_phases.py"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/ -q"
  config_schema_fragment:
    type: object
    description: "The end-of-run report the accumulated failures are rendered into, and the post-failure state contract for the target directory. Both are observables the criterion asserts on directly, so both need a defined shape rather than prose in a log line."
    required:
      - failures
      - target_state
    properties:
      failures:
        type: array
        items:
          type: object
        description: "Every DeployFailure {phase, entry, source_path} accumulated in the run, rendered in one report. Length must equal the number of unresolvable entries — three findings produce a three-item report, not the first one."
      target_state:
        type: string
        description: "What the target directory is left as after a failed run. Must be a state an author and a subsequent process can both recognise as failed — not a partially-populated tree that is indistinguishable from a complete deploy. Whichever mechanism is chosen (an explicit failure marker written into the target, or not leaving a partial tree at all) must be stated and asserted, not left implicit."
  constraints:
    - "THE ASSERTION SURFACE IS THE EXIT CODE AND THE TARGET DIRECTORY. Never the log text. The behaviour being replaced already logs every fact an author needs, accurately, and the defect shipped regardless because the exit code said success. A test asserting the failure text is present is green against BOTH the broken and the fixed implementation — this is the cleanest example of the grep-shaped false green in this subtree, and the criterion disqualifies it explicitly."
    - "EXACTLY ONE NON-ZERO EXIT, AND NO SUCCESS VERDICT BEFORE IT. The run must not print or return a success status at any point and then exit non-zero, because callers and workflows read the final status only. Assert both the exit code and the absence of a success verdict in the run's output ordering."
    - "DEFINE THE POST-FAILURE TARGET STATE EXPLICITLY AND ASSERT IT. A build that fails after copying two of five declared files leaves a directory that looks deployed; the next thing to run there — a hook, a workflow, a consumer command — cannot tell the difference, which converts a caught build failure back into the silent runtime failure BP-900g-10 exists to catch. Choose one mechanism (an explicit failure marker in the target, or not leaving a partial tree), state which in the sign-off, and test it. Leaving this implicit is how the clause gets quietly dropped."
    - "IDEMPOTENCY ON THE FAILING PATH. Running the failing build twice must leave the target in the same recognisable state, and a subsequent successful run against a repaired tree must produce a complete, correct target with no residue from the failed attempt."
    - "THE ALL-RESOLVE CONTROL IS NOT OPTIONAL. Assert that a declaration whose entries all resolve exits zero AND that the target contains every declared file. A fail-closed flip that also breaks correct builds passes every negative test in this AC."
    - "NO NEW LOOP AND NO SECOND REPORT FORMAT. This AC constrains the same iteration BP-900g-9 changes and the same accumulated records. A separate reporting path that only the tests exercise will drift from the one the build uses."
delivers_to: null
expects_from:
  ac_id: BP-900g-9
  contract: "The fail-closed deploy iteration and its accumulated DeployFailure records {phase, entry, source_path}, raised once at the end of the run and surfacing as a single non-zero exit from `python scripts/build.py --target-dir <target>`. This AC constrains the rendering of that same accumulation (all findings in one report), the exit discipline (non-zero exactly once, no prior success verdict), and the state the target directory is left in. It introduces no new loop and no second report format."
test_spec:
  - name: test_bp_900g_9_i_three_missing_sources_are_all_named_in_a_single_report
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: boundary
    description: "Delete the sources behind three separate declared entries, run the build once, and assert the single failure report contains all three {phase, entry, source_path} records — count equal to three, not 'at least one'. A loop that halts at the first finding produces a one-item report and fails here while passing every other entry in this AC."
  - name: test_bp_900g_9_i_build_subprocess_exits_non_zero_once_with_no_prior_success_verdict
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT with the must_block modifier. Run `python scripts/build.py --target-dir <tmp_target>` as a SUBPROCESS against a tree with declared-but-absent sources. Assert the process exit code is non-zero and that the run emits no success verdict before exiting. The assertion is the exit code and the verdict ordering — asserting the failure text appears is explicitly disqualified, because the code being replaced emits that same text and exits zero."
  - name: test_bp_900g_9_i_failed_run_leaves_no_partial_target_presented_as_complete
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: deployed
    description: "After the failing subprocess run, inspect the produced target directory and assert it is recognisable as failed by whichever mechanism the implementation declares — an explicit failure marker present, or no partial tree left. Specifically assert it does NOT contain a proper subset of the declared files with nothing distinguishing it from a complete deploy. Run the failing build twice and assert the target state is identical both times."
  - name: test_bp_900g_9_i_all_resolving_declaration_builds_clean_with_a_complete_target
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: criterion
    description: "The false-positive control through the same subprocess: a declaration whose entries all resolve exits zero and the target directory contains every declared file. Then repair the three-missing-sources tree and re-run, asserting the target is complete and carries no residue from the failed attempt. Without this, a fail-closed flip that also breaks correct builds passes every negative assertion in this AC."
test_rationale: |
  The defect this AC guards against is not that the build fails to notice — it notices
  perfectly. It logs the phase, the entry and the missing path, accurately, today, and
  the broken deploy shipped anyway because the process exited zero. That single fact
  determines every assertion here: the exit code and the target directory are the only
  admissible observables. A log-text assertion is green against both implementations,
  which makes it worse than no test, because it reads as coverage.

  Three of the four entries therefore run the real build as a subprocess and assert on
  its exit or on the tree it produced. The fourth is the all-resolve control, which
  exists because a fail-closed flip has a symmetric failure mode nobody tests for:
  breaking correct builds. Every negative assertion in this AC passes against an
  implementation that fails unconditionally.

  The post-failure target state gets its own entry rather than riding along, because
  it is the seam between this AC and BP-900g-10. A build that fails after copying two
  of five declared files leaves a directory the next process cannot distinguish from a
  complete deploy — which converts a CAUGHT build failure straight back into the
  silent runtime failure BP-900g-10 exists to catch. The idempotency assertion (run the
  failing build twice, same state) is folded into that entry rather than spending a
  fifth angle.

  Four distinct angles are charged — boundary, reachability, deployed, criterion — which
  is exactly the cap. `deployed` is charged here although BP-900g-9 declines it, and the
  distinction is real: the parent's observable is the build process's exit, this AC's
  third clause is a claim about a produced target directory, which can only be judged by
  inspecting one.
