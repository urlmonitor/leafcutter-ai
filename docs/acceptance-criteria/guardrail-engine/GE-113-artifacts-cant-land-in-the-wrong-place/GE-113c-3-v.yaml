id: GE-113c-3-v
components:
  - commit_guardian
  - security_scanner
title: "An allowlist entry with a zero-segment file path suppresses nothing and is reported as malformed"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: critical
criteria: |
  Given the security allowlist contains the entry "GENERIC_SECRET:" whose file
    path field is empty and therefore yields zero path segments,
  And the secrets scanner detects GENERIC_SECRET findings in the files:
    - "secrets.py"
    - "src/config/foo.py"
  When the scanner evaluates whether the allowlist entry suppresses each finding,
  Then NEITHER finding is suppressed and both are reported,
  Because a zero-segment allowlist path is vacuously a suffix of every finding
    path, so honouring it would silently disable the GENERIC_SECRET rule for the
    whole repository.

  Given the security allowlist contains an entry whose file path field yields zero
    path segments in any of these forms — an empty field, ".", "./", or a field
    consisting only of whitespace,
  And the secrets scanner detects findings for that entry's rule anywhere in the
    repository,
  When the scanner evaluates suppression for each finding,
  Then no finding is suppressed by that entry, for every one of the four forms,
  And repository-wide suppression remains available only by writing the literal
    wildcard "*" as the file path.

  Given the security allowlist contains the entry "*:" — a wildcard rule with a
    zero-segment file path,
  And a file "secrets.py" contains four findings across four distinct rules,
  When the scanner scans that file,
  Then all four findings are still reported,
  Because a single malformed entry must never be able to disable the scanner
    across every rule.

  Given the security allowlist contains the entry "GENERIC_SECRET:*" on one line
    and the entry "ENTROPY_HIGH:src/config/foo.py:*" on another,
  And the secrets scanner detects a GENERIC_SECRET finding in "secrets.py" and an
    ENTROPY_HIGH finding in "src/config/foo.py",
  When the scanner evaluates suppression for each finding,
  Then both findings ARE suppressed,
  Because the literal wildcard "*" and the segment-suffix forms established by
    GE-113c-3 continue to work unchanged.

  Given the security allowlist file's third line is "GENERIC_SECRET:" and its
    fifth line is "ENTROPY_HIGH:./:*",
  When the scanner loads the allowlist,
  Then a warning is emitted on the error stream for each of those two lines,
  And each warning names the allowlist file it came from, states the 1-based line
    number of the offending line (3 and 5 respectively), and quotes the offending
    line text,
  And each malformed line is skipped rather than applied,
  And every other entry in the same allowlist file is still loaded and applied,
  And the scan itself completes and reports its findings as normal — the malformed
    line does not by itself abort the scan or block the commit,
  Because skipping fails closed (the author sees the finding they were trying to
    suppress) and the warning tells them why, whereas aborting would turn a typo
    into a repository-wide commit outage.

  Given the security allowlist's second line is "secrets.py" — a non-blank,
    non-comment line containing no colon at all,
  When the scanner loads the allowlist,
  Then a warning is emitted on the error stream naming the allowlist file, the
    line number 2, and the text "secrets.py",
  And that line suppresses nothing,
  And the scan completes and reports its findings as normal,
  Because a colon-free line is malformed in the same way and must be surfaced
    rather than dropped in silence.

  Given the security allowlist contains only blank lines and lines beginning with
    the comment marker "#",
  When the scanner loads the allowlist,
  Then no warning is emitted for any of those lines,
  Because blank lines and comments are valid allowlist content, not malformed
    entries.
