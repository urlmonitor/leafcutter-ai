notes: |
  A bare number is not enough: "180 of 180" is meaningless if the scope silently
  excluded a whole folder. The stated method is what makes a denominator
  reviewable, and it is also the mechanism by which the ACS-100h-7a-exempt
  tree-limit counter satisfies ACS-1100 without a second traversal — the single
  shared callable reports the parents it examined and the exclusions it applied.

  Deliberate exclusions are legitimate and expected (deprecated records,
  superseded records, non-AC YAML, and records outside the requested scope). The
  requirement is that they be DECLARED, not that they be eliminated. An exclusion
  with no stated ground is a gap, and ACS-1100c governs what happens then.

  "OUTSIDE THE REQUESTED SCOPE" IS A FIRST-CLASS GROUND (added 2026-08-13 on expert
  review). All eight AC pre-commit hooks resolve their work set from git diff
  --cached. Without this ground a staged-scope hook would halt on every commit,
  reporting thousands of records unaccounted for. With it, the hook reads honestly:
  "3 of 3 staged, scope = staged paths; store = 2,784". The ground is only
  legitimate when the scope is DECLARED and the store total is reported alongside
  the scope total — otherwise it becomes the laundering channel it was added to
  prevent.
