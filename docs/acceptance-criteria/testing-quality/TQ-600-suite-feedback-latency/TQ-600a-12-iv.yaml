    framework: unittest
    type: integration
    angle: failure
    description: >-
      THE CAN-FAIL DESCRIPTOR. Take a test paying the cheaper shape, move it onto the
      unseeded private-copy route, and assert the gate reports a failure naming the
      test and both figures.
  - name: test_tq600a_12_iv_moving_a_test_onto_the_seeded_route_is_not_reported_as_a_regression
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      The paired control. The same move with seeding on is cheaper than the prior
      cost and the gate stays quiet. Without this the record is satisfied by a gate
      that fires on every move.
  - name: test_tq600a_12_iv_the_gate_compares_against_the_tests_own_prior_cost
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: boundary
    description: >-
      NAMED MUTATION: replace the per-test prior cost with a fixed ceiling; this test
      must go RED. A fixed ceiling passes every other descriptor here and is silent
      on exactly the regression this record exists to catch.
test_rationale: |
  This is a trap that a speed migration walks into while believing it is going the
  other way, and the only thing standing in front of it today is a sentence in the
  route that is wrong by a factor of 3.3.

  The can-fail descriptor is mandatory for the same reason it is mandatory on the
  parser agreement check: a cost gate over a population nobody has moved yet reports
  clean forever, and clean is what it will report on the day it is written. So the
  gate is exercised against a real move in the wrong direction, and paired with a
  move in the right direction so the gate is not simply hostile to all movement.

  The fixed-ceiling injection is named because it is the implementation a coder
  reaches for first, it satisfies every other descriptor, and it is specifically
  blind to a 14.81 s test becoming a 48.94 s test if the ceiling sits anywhere above
  49 s — which, with 60 s builds elsewhere in this suite, it very plausibly would.
