criteria: |
  Given a namespace whose already-claimed identifiers are held in two different shapes at the
    same time:
    - "GE-120" is declared by a record that a FEATURE FOLDER owns, and no record at the
      namespace root declares it,
    - "GE-114-1", "GE-114-2", "GE-114-3", "GE-114-4" and "GE-115" are declared by LOOSE records
      that sit at the namespace root and belong to no feature folder,
  And "ACS-1100b-3" is an identifier that NO record declares and that five live records still
    cite by name,
  When a component mints a new identifier for that namespace,
  Then the set of taken identifiers it computes contains every identifier declared by a record
    at ANY depth beneath the namespace root — the folder-owned one and the loose ones alike,
  And that set also contains "ACS-1100b-3", which is taken by citation although no record
    declares it,
  And the identifier it returns belongs to neither set,
  And it states how many records it enumerated and how many identifiers it found taken, so an
    identifier minted against a partial enumeration is distinguishable from one minted against
    a complete one.

  And Given the same namespace with EVERY claimed identifier owned by a feature folder and no
    loose record at the namespace root at all,
  When a component mints a new identifier for that namespace,
  Then the identifier it returns is one that none of those folders already holds — so a
    component that enumerates only the records sitting directly at the namespace root cannot
    satisfy this criterion.

  And Given an identifier whose every claimant has been retired, so no record declares it, while
    live records still cite it,
  When a component mints a new identifier for that namespace,
  Then the returned identifier is not that one — so a component that decides an identifier is
    free because no record currently declares it cannot satisfy this criterion either.

  Coverage note: covered only by a test that executes the minting step against a real on-disk
  namespace holding all three shapes at once — a folder-owned identifier, loose identifiers at
  the namespace root, and an identifier that is cited but declared by nothing — and asserts on
  the identifier actually returned. A namespace whose identifiers are all one shape cannot
  distinguish a complete enumeration from either of the two incomplete ones this criterion
  excludes, and a test asserting that an enumeration helper exists does not cover it at all.
