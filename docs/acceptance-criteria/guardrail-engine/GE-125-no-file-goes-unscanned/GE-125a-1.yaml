id: GE-125a-1
components:
  - security_scanner
  - commit_guardian
title: "A folder that merely reuses a chosen name keeps full credential detection"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  FIXTURE ROOT USED BY EVERY SCENARIO BELOW. Each scenario builds a throwaway
  project root, written <root>, that is a directory of its own and contains no
  part of this repository. Every path in these scenarios is relative to <root>.
  No fixture may be written anywhere inside this repository's own working tree:
  a file placed under this repository's tickets/, docs/retrospectives/,
  docs/acceptance-criteria/ or templates/skills/ would have its verdict decided
  by this repository's reduced-scrutiny list rather than by the scenario's, so it
  would measure the entitlement instead of the check and would pass for the wrong
  reason. Every scenario is exercised the way a commit exercises the check — the
  files are staged in <root> and the credential check runs over that staged set —
  not by asking the location rule for a verdict on a path, and not by reading the
  check's own source for the four chosen names.

  Given <root> contains these four files, each holding one line with a
    thirty-two-character opaque token whose measured Shannon entropy is 5.17,
    above the 4.5 threshold, carrying no keyword the keyword rule recognises and
    no fixed prefix the prefix rules recognise:
      leafcutter-web/tickets/app.py
      src/vendor/tickets/handler.py
      some/deep/nested/docs/retrospectives/x.py
      unrelated/templates/skills/evil.py
  And no suppression entries are in force,
  When the four files are staged in <root> and the credential check runs over the
    staged set,
  Then the token is reported for all four files,
  Because not one of those four locations is a location this project chose to
    scrutinise less — each is reached only by a folder somewhere below the top of
    the project reusing one of the four chosen names, and all four are measured
    unreported today.

  Given <root> contains src/app.py holding the same token,
  And no suppression entries are in force,
  When it is staged and the check runs over the staged set,
  Then the token is reported,
  Because an ordinary source path is reported today and must still be reported
    afterwards; this criterion changes which paths lose the reduced scrutiny and
    changes nothing about paths that never had it.

  Given <root> contains leafcutter-web/tickets/release-notes.md holding the same
    token,
  And no suppression entries are in force,
  When it is staged and the check runs over the staged set,
  Then the token is reported,
  Because the loss measured today is identical for a written file and an
    executable one, so removing it for executable files only would leave half the
    measured exposure in place. What a location this project DID choose covers by
    file kind is a different question and is not settled here.

  Given <root> contains all six files named above — the four reused-name paths,
    the ordinary source path and the written file at the reused-name path,
  And no suppression entries are in force,
  When they are staged together and the check runs over the staged set once,
  Then the run reports the token for every one of the six files,
  And the run's exit status reports findings present,
  Because a per-file verdict that never reaches the author protects nobody, and
    the author sees an exit status and a report rather than a returned list.
