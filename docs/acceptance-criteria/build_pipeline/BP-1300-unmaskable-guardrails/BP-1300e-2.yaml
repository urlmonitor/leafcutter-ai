assigned_agent: python-coder
estimated_complexity: M
package_surface: true
it_requirements:
  config_schema_fragment:
    _declares: >-
      TWO package surfaces in templates/scripts/commit_guardian/commit_guardian.json,
      both watched by _package_surface_registry.WATCHED_REGISTRIES: (1) a NEW
      top-level key lint_rule_claims, whose schema is the fragment below, and
      (2) a NEW hooks_manifest.hooks member, id check-lint-rule-claims, shaped
      exactly like BP-1300e-1's check-lint-gate entry (tier judgment, language
      system, stages [pre-commit], pass_filenames false, change_set_source
      handed_by_commit_path, always_run true, verbose true, no files/types
      filter, a falsifiable negative_control) with entry
      'python {{config.output_root}}/scripts/commit_guardian/run_hook.py
      {{config.output_root}}/scripts/commit_guardian/check_lint_rule_claims.py'.
      The section names WHERE claims live; it never lists rule codes, so it is
      not itself a claim that can drift.
    type: object
    required:
      - texts
    additionalProperties: false
    properties:
      _comment:
        type: string
      texts:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - path
            - region
          additionalProperties: false
          properties:
            path:
              type: string
              description: "Repo-relative POSIX path of a text that claims commit-time lint rules."
            region:
              type: object
              required:
                - kind
              properties:
                kind:
                  enum:
                    - python_function_return
                    - json_pointer
                    - markdown_section
                name:
                  type: string
                  description: "python_function_return: the function whose returned string literal is the claim (read by AST, never imported)."
                pointer:
                  type: string
                  description: "json_pointer: RFC 6901 pointer to the claiming string."
                heading:
                  type: string
                  description: "markdown_section: heading text; the region runs to the next heading of the same or higher level."
    examples:
      - texts:
          - path: templates/hooks/check_exception_handling_hook.py
            region:
              kind: python_function_return
              name: _build_ruff_not_found_message
          - path: templates/scripts/commit_guardian/commit_guardian.json
            region:
              kind: json_pointer
              pointer: /exception_handling/_comment
          - path: CLAUDE.md
            region:
              kind: markdown_section
              heading: Error Handling Policy
  reference_file_path: templates/scripts/commit_guardian/commit_guardian.json
  n_location_rule: >-
    4 -- (a) one top-level key lint_rule_claims added; (b) one hooks_manifest.hooks
    member check-lint-rule-claims appended after check-lint-gate; (c)
    exception_handling._comment rewritten; (d) exception_handling.ruff_rules
    removed. Nothing else in the file changes.
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir <a fresh temporary directory>  (never the workspace parent: KI-BP-016)"
    - "python -m pytest unit_tests/commit_guardian/test_bp_1300e_2.py unit_tests/commit_guardian/test_exception_hook.py -q"
    - "python -m pytest unit_tests/commit_guardian/test_hook_registration_inventory.py -q"
  constraints:
    - "TEXT 1, THE EDIT-TIME HOOK MESSAGE. In templates/hooks/check_exception_handling_hook.py _build_ruff_not_found_message(), replace the final sentence ('They will still be caught at commit time by the pre-commit ruff hook.') with a statement that the commit-time check check-lint-gate applies the rules declared in leafcutter-lint.json under the project's own ruff configuration. Do NOT enumerate rule codes in it: a message that names no codes cannot drift from the declaration, and the hook must stay self-contained (it may not read the declaration via a leafcutter import). Change nothing else: RUFF_SELECT, exit codes, skip conditions, the locator, and every other line of the message stay byte-identical (GE-108d/GE-108e own them)."
    - "TEXT 2, THE MANIFEST SECTION. Rewrite exception_handling._comment to say that ruff rules are applied at commit time by check-lint-gate using the project's own ruff configuration (in this repository, ruff.toml) over the scope in leafcutter-lint.json, and that this section configures only the custom AST check. It must not mention pyproject.toml as this repository's configuration and must attribute no rule codes to ruff.toml. Remove the ruff_rules key: verified 2026-10-09 by the KI's `git grep -l ruff_rules` over scripts templates unit_tests tests that nothing reads it; RE-VERIFY across the whole tree, including config schemas and tests, immediately before deleting, and if anything does read it, stop and raise it rather than deleting."
    - "TEXT 3 IS GIT HISTORY. Commit 4b9894b40's message cannot be corrected and is not an open item."
    - "THE DRIFT ARM IS A DEDICATED, NARROW CHECK: templates/scripts/commit_guardian/check_lint_rule_claims.py. It runs when the staged set contains any configured claim text, leafcutter-lint.json, or a ruff configuration file; otherwise RESULT: nothing_to_inspect, exit 0. For each configured text present at its path it extracts the region STATICALLY (AST for python_function_return, json for json_pointer, heading-delimited slice for markdown_section; never import or execute a text) from the STAGED blob, finds ruff rule codes and linter prefixes in it, and refuses (RESULT: refused, non-zero) every claimed code that no declared step applies, naming the text path and the code. A configured text absent from the project (e.g. an adopter whose CLAUDE.md has no such section) is reported by name as not present and is not a refusal."
    - "WHAT COUNTS AS 'APPLIED' COMES FROM RUFF, NOT FROM A LIST. The applied set is the union over leafcutter-lint.json's steps of the rules ruff reports enabled for that step (ruff's own resolution of the project configuration, plus the step's --select when present, e.g. via `ruff check --show-settings` on a path in the step). The set of recognised rule-code prefixes comes from ruff itself (e.g. `ruff linter --output-format json`), so a bare family name such as TRY is recognised without a hand-written prefix table. A claimed bare prefix is applied if any enabled rule carries it. No rule code, prefix, or allowed-claims list may be written into check_lint_rule_claims.py. Tree attribution ('BLE001 only in kernel/') is not mechanically checked -- the criterion asks only that a claimed rule be applied somewhere; tree wording is BP-1300e-2-i's documentation duty."
    - "RUFF AND DISCOVERY ARE SHARED. Use _ruff_locator.py (BP-1300e-1-iii) and _lint_scope.py (BP-1300e-1-i); if ruff is unavailable while a claim text is staged, the outcome is could_not_check and the commit is refused, for the same banner reason as BP-1300e-1-iii."
    - "WHY NOT GE-120h-1. GE-120h-1 (approved, work_status todo, complexity L) reconciles CHECK NAMES advertised on four discovered surfaces against hooks_manifest.hooks, and delivers a per-check runs/does-not-run result to GE-120h-2 and GE-120h-4. This arm reconciles RULE CODES in three named texts against the lint declaration as ruff resolves it. Different unit, different executing reference, disjoint population: the two cannot disagree about the same fact, which is the failure the 'no second reconciler' rule exists to prevent. Folding rule codes into GE-120h-1 would change its delivered contract for three consumers and make this feature wait on an unbuilt L-sized record. If GE-120h-1 later wants lint claims, it can consume this check's result rather than re-deriving it."
    - "PACKAGE SURFACE. The commit adding lint_rule_claims and check-lint-rule-claims must cite BP-1300e-2 (package_surface: true), or check-package-surface-declaration refuses it."
    - "ERROR-HANDLING POLICY (CLAUDE.md Rules 1-4), unchanged; the region extractors are pure and carry no try/except; git and ruff calls use specific excepts and map to could_not_check."
test_spec:
  - name: test_bp_1300e_2_edit_time_message_names_only_a_running_commit_time_check
    target_dir: unit_tests/commit_guardian/
