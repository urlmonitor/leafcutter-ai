roadmap_phase: phase_1
criteria: |
  Given two projects on a leafcutter version that still shipped the address —
      project A, whose own settings set db_connection_test to
        postgresql://app:app@db.internal:5432/app_test,
      project B, whose own settings never mention db_connection_test and
        which until now received the shipped address as a default,
  When both are upgraded to the version that ships no address,
  Then project A's setting is unchanged, character for character — the
      upgrade removes and rewrites nothing the project set,
    And project B's resolved setting is unset after the upgrade; nothing from the shipped
      defaults is added to its settings, and the old shipped address does
      not reappear from a leftover default, a merged defaults file, or a
      cached copy of the previous settings,
    And when project B next needs a database test, it gets the ordinary
      "not configured" report (INF-1100d-3), not a connection attempt.
