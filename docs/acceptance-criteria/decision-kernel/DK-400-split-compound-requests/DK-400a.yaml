criteria: |
  Bundled questions are recognised; a single question is never split.

  A request that bundles several separate questions is recognised and offered
  to you as a split, whether it would otherwise be turned away or squeezed into
  one choice that tries to answer everything at once. A single question is
  never split: if it can be handled it goes ahead as one, and if it cannot be
  handled yet it is still logged as an ability the kernel lacks, exactly as
  today, so a missing ability is never passed off as a split.
