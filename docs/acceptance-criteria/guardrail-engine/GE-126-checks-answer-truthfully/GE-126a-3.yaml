notes: |
  DECISION THE L1 ASKED FOR EXPLICITLY: the environment seam IS part of "the targets you
  named". The L1 says it should be, because both are the same promise, and this record
  is where that decision is recorded. A caller who names targets through the seam is
  doing the same thing as a caller who names them on the command line and is entitled to
  the same guarantee.

  AND THE DECISION THE L1 EXPLICITLY WITHHELD: unifying the seam's name and separator
  across the whole check family is NOT taken on here. That is its own work, recorded as
  KI-CG-012. This criterion binds one check's seam to one check's argv contract and
  nothing wider.

  THE UNINTERPRETABLE-VALUE ARM IS THE POINT OF THIS RECORD. A seam that silently
  resolves a misspelled value to an empty list turns every verification attempt made
  through it into a false pass, and the seam is precisely the route agents and ad-hoc
  verification use. This is the same shape as GE-126a-2 arriving through a different
  door — a target named and not resolved — and it is why the L1 refuses to let the seam
  be treated as a lesser surface.

  BOUNDARY PRESERVED: the unset seam is not a named target. An unset seam with an empty
  derived scope remains an ordinary pass, per GE-126a-2-i.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

