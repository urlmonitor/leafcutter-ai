title: "A bundle damaged on the way is reported as damaged on the way, not as a bad bundle"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run that stops because what arrived is not what was produced,
  When it reports why it stopped,
  Then its leading statement is that the bundle was produced and then altered between
    production and arrival — not a detail further down, and not an inference the reader
    has to make,
  And it reports both sides of the comparison, the value the producer stated and the value
    derived from what arrived, so a reader can see the two disagree without re-running
    anything,
  And it does not describe the bundle as never produced, as a location standing in for
    content, or as incompletely composed, because each of those names a different fault
    and sends the reader somewhere the fault is not.

  Given the alteration also destroyed a structural landmark the lane independently checks
    for,
  When the lane decides which of the two findings to report,
  Then it reports the delivery failure, because the disagreement with what was produced is
    the finding that explains the missing landmark rather than a second, separate defect,
  And the run therefore does not present a complaint about the bundle's content whose
    actual cause is its delivery — the reversal that, on both recorded occurrences, pointed
    an operator at an assembly that had not failed.

  Given one run driven through each distinct way the bundle can be unusable, in turn,
  When the messages those runs produced are set side by side,
  Then the damaged-in-transit message is distinguishable from every other one — no message
    is a restatement of another and none is a superset of another,
  And a check written for any one cause is not satisfied by the message for a different
    one, so the set of causes stays as separable to a reader as it is to the lane.
