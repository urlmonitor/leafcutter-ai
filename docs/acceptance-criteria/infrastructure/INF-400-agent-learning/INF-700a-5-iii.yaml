    contract: "One sink per install, and the guarantee that concurrent APPENDS to it neither lose nor interleave records — this AC covers the routing side of the same sharing, not the writing side"
  - ac_id: INF-700a-5
    contract: "The rule that a record counts as written only once its write is published, and that the bookkeeping does not outlive the publication it rode — the property two concurrent routing steps must not break between them"
