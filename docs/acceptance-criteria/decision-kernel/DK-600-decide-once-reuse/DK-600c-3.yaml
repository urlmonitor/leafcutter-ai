assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - 'During a run the kernel only reads the repository (ADR-060): no file under the repository root
    may change; the configured run root is the only place a run writes.'
  - The run id is checked as a plain path segment before any staging path is built; an unsafe id stages
    nothing.
  - Staged files are written atomically in the plain YAML subset the publish validator accepts.
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
test_spec:
  - name: test_stage_writes_only_under_the_run_root
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_store.py::TestGetAndStage::test_stage_writes_only_under_the_run_root):
      the record lands at <run_root>/runs/<run_id>/staged/decisions/<id>.yaml'
    covers:
      - DK-600c-3
  - name: test_staging_an_unsafe_run_id_keeps_nothing
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: failure
    description: 'EXISTS (tests/kernel/memory/test_store.py::TestGetAndStage::test_staging_an_unsafe_run_id_keeps_nothing):
      an unsafe run id stages nothing'
    covers:
      - DK-600c-3
  - name: test_a_human_choice_stages_a_record_and_nothing_is_written_to_the_repository
    target_dir: tests/kernel/memory/
    framework: unittest
    type: integration
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_learning_loop_e2e.py::TestRunOneStagesARecordThatPublishFiles::test_a_human_choice_stages_a_record_and_nothing_is_written_to_the_repository):
      after the run docs/decisions/ does not exist in the scenario repository'
    covers:
      - DK-600c-3
  - name: test_staging_never_touches_the_repository_store
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: criterion
    description: 'EXISTS (tests/kernel/memory/test_decision_precedent.py::TestAMatchingPrecedentBeforeAnyBasis::test_staging_never_touches_the_repository_store):
      the store folder is unchanged by a run'
    covers:
      - DK-600c-3
  - name: test_a_staging_run_leaves_git_status_unchanged
    target_dir: tests/kernel/memory/
    framework: unittest
    type: integration
    angle: criterion
    description: 'TO WRITE (in tests/kernel/memory/test_learning_loop_e2e.py): git status of the scenario
      repository is identical before and after the run'
    covers:
      - DK-600c-3
delivers_to:
  agent: python-coder
  ac_id: DK-600c-4
  contract: 'kernel.memory.port.StagedRecord {decision_id: ''dec-<16 hex>'', path: absolute Path <run_root>/runs/<run_id>/staged/decisions/<decision_id>.yaml},
    or None when nothing was kept (not human-approved, invalid, unsafe run id, write failure, null
    memory backend); None produces no message.'
expects_from:
  ac_id: DK-600c-2
  contract: 'A model-validated kernel.memory.models.DecisionRecord matching config/decision_record.schema.json:
    schema_version ''1.0'', kind ''decision'', id ''dec-<16 hex>'', approval {approval_status: approved,
    approved_by: ''human'' | ''human:<id>'', approved_at: ''YYYY-MM-DDTHH:MM:SSZ''}, evidence: [{id,
    locator, category, content_hash: 64 hex, verification, relevance, source_version}] with no text
    field, assessment {basis, design_reason, selected_rank, ranking: [{option_id, rank, required_passed,
    required_total, required_mean, scores}]}, precedents_considered: [{id, applicability, action,
    note}], provenance {run_id, root_task_id, langfuse_trace_id: 32 hex, repository_revision {commit,
    dirty}, template_version, model_version, kernel_version, decision_versions}; serialised by kernel.memory.codec.dump_record
    (plain YAML subset).'
