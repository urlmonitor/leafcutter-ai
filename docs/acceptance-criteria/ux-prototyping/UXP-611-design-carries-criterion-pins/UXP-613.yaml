notes: |
  NOT A NEW IDENTIFIER. `screen` already exists, is already pattern-constrained
  in mockup.schema.json, and is already what every flow step and branch resolves
  against via `step.screen`. All that is new is putting the same value where a
  reader of the rendered file can see it, which is what lets a comparison begin
  from markup on either side.

  ONLY THE PAGE ROOT — the mock-data artifact states this as an "if and only
  if" for the built side, and the design side must not diverge from it. The
  second scenario is the testable form; without it the rule reads as advice.

  THE THIRD SCENARIO KEEPS TWO STATES APART. "This file names a screen that
  does not exist" is a defect. "This screen has no design" is an ordinary,
  blameless state (GE-124f-1-ii's outside-the-chain case). Collapsing the first
  into the second makes typos invisible; collapsing the second into the first
  reports every unmodelled page as broken.
