it_requirements:
  - "MEASURED 2026-09-14 — THE CANONICAL HOW-TO CONVENTION FILE DOES NOT EXIST, AND THE AGENT THAT WRITES THIS PAGE IS INSTRUCTED NOT TO PROCEED WITHOUT IT. templates/agents/how-to-author.md opens with 'load and read docs/how-to/documentation/write-how-to.md in full' and its step 1 says 'Do not proceed without doing this'. That path is absent: docs/how-to/documentation/ contains write-adr.md and write-reference.md only. Until that gap is closed, take the genre conventions from the required-section list inside how-to-author.md itself (frontmatter, H1 'How to <Verb Phrase>', one-sentence overview, Prerequisites, Steps, Verification, Troubleshooting, See Also) and from the structure of the surviving sibling guides. Authoring the missing convention file is NOT this record's work and must not be smuggled into it — record the gap and proceed."
  - "PLACEMENT AND NAME. docs/how-to/start-a-new-architecture-document.md. General-contributor audience, so the flat docs/how-to/ folder rather than a topical one; verb-phrase filename, which is the how-to naming rule and the opposite of the noun-phrase rule INF-1300b-5's reference follows. Do not place it under docs/how-to/documentation/ — that folder holds guides about writing each DOC GENRE, and this guide is about writing one particular document."
  - "THE PAGE IS ITSELF A docs/**/*.md AND MUST SATISFY THE SAME JUDGMENT-TIER HOOKS IT TEACHES ABOUT. In particular check_description_field requires a non-empty `description:` frontmatter field, which SKILL.md section 6's checklist omits — so the very defect INF-1300b-4 retires is one this page can reproduce on itself. Run the manifest-matched judgment hooks over the page with the transform tier disabled; a description injected by a repair step does not count."
  - "REFERENCE, DO NOT FORK. INF-1300b-4 owns the corrections to the two authoring surfaces: the ADR-015 attribution for the key, the published --files verification command that argparse rejects (the script defines --file and a positional), the section 6 checklist that omits description:, and the --date disagreement between the skill and the agent template. This page must LINK to the corrected surfaces for the invocation, the field list and the verification command. Reproducing any of them here creates a second copy that the next correction will not reach, which is the exact failure mode this tree exists to end, one surface further out."
  - "THE REFUSAL-REASON SET IS DERIVED FROM THE MEANS, NEVER WRITTEN INTO THE PAGE'S CHECK. Consume the same enumeration INF-1300d-3's shared refusal path exposes. A fixed list in the observation stops discriminating the first time a reason is added — the count-pinned failure this project has recorded elsewhere — and would leave the page silently incomplete while its test stayed green. The correspondence must be asserted in BOTH directions: a reason with no entry is an incomplete page, and an entry for a reason the means cannot produce is a page teaching a remedy for something that cannot happen."
  - "THE REMEDY ARM EXECUTES; IT DOES NOT READ. For each reason: provoke the real refusal, apply exactly what the entry instructs and nothing more, re-run, and put the result through INF-1300a-1's in-tree scratch harness. Applying 'exactly what the entry instructs and nothing more' is the load-bearing part — an observation that fills in the rest of a well-formed request by hand proves the harness works, not that the entry is sufficient."
  - "ALL OF INF-1300a-1's VACUOUS-GREEN GUARDS APPLY to every hook invocation in the remedy arm: the argv-blind hooks that read the staged index, check_mermaid_parent_link's module-level REPO_ROOT taken from its own file's grandparent, and the [NO-ARCH-UPDATE] bypass token read from the last commit subject and COMMIT_EDITMSG. Use a-1's harness; never a bare tmpdir."
  - "THE PAGE MUST NOT TELL AN AUTHOR TO WORK AROUND A CHECK. No step may instruct the reader to skip a hook, pass a bypass token, or stage a hand-repaired document. If following the page requires any of those, the means is wrong and the finding belongs on the means' record, not in a workaround here."
  - "TASK-ORIENTED, NOT CONCEPTUAL. Steps are actions in the order an author performs them, each with a full command and a stated expected outcome. WHY the collection has these conventions belongs in an explanation doc, and WHAT the parts of a document are belongs in INF-1300b-5's reference; link to both rather than absorbing either."
  - "Error handling per the project error-handling policy (CLAUDE.md rules 1-4) applies to the test harness this record adds, not to the page: every subprocess and filesystem boundary wrapped with a named exception type, nothing swallowed."
