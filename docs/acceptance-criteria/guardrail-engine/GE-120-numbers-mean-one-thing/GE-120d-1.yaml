notes: |
  THE SINGLE-RULE REQUIREMENT IS EXPRESSED BEHAVIOURALLY ON PURPOSE. "The three stages share one
  implementation" is a structural claim and would invite a grep test. "Change the rule once and
  all three stages change behaviour" is the same requirement stated as something only a running
  system can satisfy, and it fails on three copied implementations without anyone having to
  inspect the source.

  THIS IS ALSO WHAT MAKES GE-120c-2's single message contract implementable: two stages can only
  owe the author the same message if they are computing the same verdict.

  DEPLOYMENT HAZARD FOR THE IT PO, worth flagging because this repository has been bitten by it:
  a hook that gains a new shared dependency must have that dependency added to the build deploy
  manifest, or the deployed hook raises an import error at runtime while the source-tree unit
  tests pass. Once the shared-build gate is a required check, that failure blocks every merge.
