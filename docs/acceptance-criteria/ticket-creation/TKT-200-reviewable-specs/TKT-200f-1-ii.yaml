roadmap_phase: phase_1
criteria: |
  Given a ticket at the pre-inbox-exit verification step,
    and the clean, CI-equivalent tree cannot be established (its setup fails or times out),
  When the premise verification attempts to run,
  Then the ticket is held in the inbox with a reason that verification could not be performed
    in a clean environment,
  And the ticket is NOT cleared on the strength of the dirty local result,
  And the premise is not marked confirmed.
