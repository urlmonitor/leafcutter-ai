assigned_agent: documentation-expert
estimated_complexity: S
it_requirements:
  - >-
    Put the how-to under docs/how-to/ with the repo's doc frontmatter, register it in
    docs/INDEX.md, and link to the reference page's anchor (BO-4500b-4) for every failure message
    instead of restating it.
  - >-
    Before publishing, walk both procedures on a scratch copy of the package, with a fixture
    block DEMO-ANSWER and one fixture route. Confirm the install succeeds and the identity check
    reports DEMO-ANSWER with one inspected copy, and record the commands and their output in the
    sign-off. This walk-through is the verification for the first scenario.
  - >-
    The adoption procedure must teach the stale-declaration rule exactly as BO-4500b-1-ii builds
    it: a declaration is stale as soon as any route marks the block, so the whole declaration is
    removed in the change that lands the first adopting route. See the IT PO caveat. The wording
    "when it is the last one" in this record's criteria conflicts with that rule while more than
    one adopter is listed.
