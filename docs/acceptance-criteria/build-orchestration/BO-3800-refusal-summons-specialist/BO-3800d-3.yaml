id: BO-3800d-3
title: "A complexity refusal gets a bounded attempt by the restructuring specialist and then a retried commit; a function still over its ceiling stops the run, which says so, and the check is never weakened to let it through"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given check-complexity refused a delivery, stating that plan_batches in
    scripts/planner.py has complexity 31 and only 30 is allowed, and the restructuring
    specialist has been engaged with complexity-reduction,
  When the specialist leaves plan_batches scoring 29 on an attempt within the bound,
  Then delivery is attempted again, check-complexity judges it, the change lands, and
    the specialist is not engaged again for this delivery.

  Given instead the specialist leaves plan_batches scoring 31 or more on every attempt up
    to the bound,
  When the bound is reached,
  Then the run stops without delivering the change,
  And its account names scripts/planner.py, plan_batches, the complexity plan_batches now
    has, the 30 allowed, how many times the specialist was engaged, and that nothing was
    delivered.

  Given either of the two runs above,
  When the second and later delivery attempts are examined,
  Then each one was judged by check-complexity at the same strength as the first: the
    check was not skipped, its limit was not raised, the function's previous committed
    score was not altered, and neither the file nor the function was exempted.
