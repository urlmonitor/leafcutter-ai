notes: |
  THE FAILURE THIS CATCHES IS THE OVER-CORRECTION. Told that the build destroys
  adopter content, the natural repair is to make the build stop touching what is
  already there. That satisfies BP-1500g-1, BP-1500g-3 and every survival test in
  the set, and it silently freezes the package's own content at whatever version
  the project first received -- a defect with no symptom until someone wonders why
  a fix they shipped never reached anybody. The first two Then clauses have to
  hold together in one run for that reason.

  WHY THE THIRD CLAUSE IS HERE AND NOT LEFT TO BP-1500b-4. That AC forbids the
  maintained-list shortcut for the orphan sweep, which does not exist yet. This
  clause is the same prohibition applied to the distinction the build has to draw
  TODAY in order to update one thing and leave another alone -- available now,
  and needed whether or not the sweep is ever built. The two must agree, which is
  why that AC is linked as a design constraint. If the implementer finds they
  cannot agree, that is a finding to raise, not a conflict to resolve quietly in
  one of the two records.
