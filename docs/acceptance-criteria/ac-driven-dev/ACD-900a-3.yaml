criteria: |
  Given the merged ready list contains at least one AC entry and one ticket entry,
  When the pick-next script is run with --json,
  Then stdout is valid JSON,
  And the JSON structure is an object with a "top" key containing an array,
  And each element in the array has exactly these fields:
    "type" (value: "ac" or "ticket"),
    "id" (string, non-empty),
    "title" (string, non-empty),
    "assigned_agent" (string, non-empty),
    "priority" (string: one of "critical", "high", "medium", "low"),
    "action" (string containing the command to run),
  And AC entries have action values starting with "/build-ac --ac",
  And ticket entries have action values starting with "/build-feature".
