  agent: python-coder
  contract: >-
    Migrated `spawn_allowlist` frontmatter keys in templates/agents/*.md (union of
    registry field, existing frontmatter key and body table; macro verbatim), plus
    a provenance report {agents: [{agent, sub_agents: [{id, sources:
    ["registry"|"frontmatter"|"body_table"]}]}], disagreeing_agents: [str],
    source_holder_counts: {registry: int, frontmatter: int, body_table: int}}.
    Consumed by AR-300c-5-iii (remediation runs after it) and AR-300a-5-i (table
    deletion runs after it).
expects_from:
