title: "When the plan cannot name the way in, the writer is told how to resolve one and records the one it resolved"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a request for a proof that the work is reached the way the product is
      really used, whose own text says the way in is not declared and must be
      resolved before the proof is written,
    And the piece of work is one of the majority that brought no plan of its own,
      so nothing upstream names a way in,
  When the test-writing side answers that request and hands the work on,
  Then its hand-off record names the way in it resolved — the command, the hook's
    own runner, the slash command, the workflow dispatch, or the program's entry
    invoked with real arguments,
    And when it can find no way in at all, the record says so together with what it
      looked for, rather than saying nothing,
    And the instructions it works from state how to resolve a way in for the kinds
      of work this project builds, so the judgement is guided rather than left to
      the writer unaided,
    And a request that DID name a way in is answered with that way in recorded
      unchanged, not with one the writer chose for itself.
depends_on:
  - BP-1100g
  - BP-1100g-1
