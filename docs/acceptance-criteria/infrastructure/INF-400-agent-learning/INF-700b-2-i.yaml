title: "The reference gate still refuses from a fresh consumer install, not only from the package's own checkout"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
priority: medium
readiness: approved
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700b-2.yaml"
criteria: |
  Given a consumer project that has installed the package and run its build,
  And the deployed tree in that consumer project is the only tree the gate can
    run from,
  When a template in that deployed tree names a skill directory that was not
    deployed,
  And the consumer commits that change,
  Then the gate runs from the deployed layout and refuses the commit,
  And it does not exit zero because a module it imports, a configuration file
    it reads, or the repository root it computes was absent or wrong in the
    deployed layout,
  And the same gate run over a consistent deployed tree exits zero,
  And the difference between the two runs is observed in the consumer project,
    not in the package's own working tree.
