notes: |
  SCOPE — THIS IS THE WRONG-ADVICE HALF OF THE 2026-08-31 FINDING, NOT THE WHOLE OF IT.

  The observation that produced this AC had two consequences. Only the first is
  authored here, because only the first is inside BP-900c's promise ("broken-reference
  errors name the file, the referencing template, and the fix").

  The SECOND consequence has no home in this tree and must not be forced into one.
  The build's preflight guards run as a chain that returns on the first failure, so
  one underlying condition — a declared deploy source absent from the tree — is
  diagnosed differently depending on an unrelated property of the file: a
  template-referenced path is reported by the script-reference guard, an
  unreferenced one reaches the deploy loop and is reported as a deploy-declaration
  failure, and in the first case the later check never runs. That property spans the
  script-reference guard (BP-900b/BP-900c), the deploy loop (BP-900g-9) and the
  registry-completeness check (BP-900e-4) — each of which independently requires
  "every finding, not only the first" WITHIN its own scope, and none of which owns
  the property ACROSS scopes. It needs a PO-authored L1. See the sign-off report
  accompanying this record.

  WHY THIS IS A THIRD STATE AND NOT A RESTATEMENT OF BP-900c-3.

  BP-900c-3's Given is "the script's containing source directory already exists AND
  the corresponding deploy phase THAT SHIPS THAT DIRECTORY already exists". Its
  remedy is "commit the source under templates/scripts/". Both halves miss the
  observed case. The knowledge-scripts declaration is a list of individual file
  paths, not a directory-shipping phase, so a directory-keyed predicate does not
  recognise it; and the file was DELETED rather than left uncommitted, so
  "commit it under templates/scripts/" is not the resolution either — restoring the
  source or dropping the declaration is. Three deploy-declaration shapes exist in
  the build today: directory-shipping phases, file-list declarations naming
  individual paths, and mapping-table declarations. Only the first is visible to the
  incumbent predicate.

  IF THE IMPLEMENTER FINDS BP-900c-3'S PREDICATE ALREADY DECLARATION-BASED, that
  changes this from a missing branch into a defect in a record marked work_status:
  done, and the correct action is to say so in the sign-off rather than to widen
  this AC. Either way the observable and the negative controls below are unchanged.

  WHY THE THREE-STATE CLAUSE IS IN THE CRITERIA AND NOT IN NOTES. The remediation is
  a string in a structured record. A test that asserts the corrected text is present
  is green against an implementation that emits that text unconditionally — which
  would make the OTHER two states wrong and every existing BP-900c test still pass,
  because each of those tests only inspects its own entry. Requiring all three
  remediations to appear, correctly assigned, in ONE report is the only assertion
  that distinguishes a state-based selector from a changed constant.

  ENTRY SCHEMA IS OUT OF SCOPE. BP-900c-2 (done, approved) constrains the emitted
  record to exactly the keys missing_path, referencing_template, suggested_action.
  This AC changes a value, never the key set. A related idea considered and
  deliberately NOT authored: adding a fourth key naming the check that produced the
  finding, so a must_block test can assert WHICH guard fired. That would contradict
  BP-900c-2's exact-three-keys constraint and belongs with the cross-guard L1 above,
  where the amendment to BP-900c-2 can be decided in the open.

  PRIORITY DEVIATION, RECORDED. Parent BP-900c is priority: critical; this record is
  high, matching sibling BP-900c-3. The defect misdirects an author; it does not
  admit a broken install, which is what the critical siblings guard.
