notes: |
  THIS IS A BACKSTOP, NOT AN ALTERNATIVE ROUTE TO THE OUTCOME. The parent L1 says
  it plainly: being told after the fact would not be enough, because an adopter
  who has to restore from backup has already lost however clear the message was.
  So this AC is deliberately written to be UNSATISFIABLE by reporting alone -- the
  first Then clause requires the content to still be there, and the last clause
  closes the reading in which an accurate removal report counts as compliance.
  An implementer who reaches for a warning message first has misread it.

  WHY IT IS AN L3 RATHER THAN A FIFTH L2. BP-1500g has five L2 slots against the
  hard cap and two are owed to the L1's documentation_triggers. Given that
  constraint this clause is better placed as a failure-mode specification under
  BP-1500g-1 than dropped: it is the "what could go wrong" face of the same
  behaviour -- what the build must do on the path where it cannot deliver the
  guarantee -- rather than a separate capability. Flagged here so a later reader
  can see the placement was a judgement under a cap and not an accident. If
  BP-1500g ever gains a sixth slot this is the first candidate for promotion.

  THE STOP IS DELIBERATELY NOT SPECIFIED AS A REFUSAL TO BUILD AT ALL. The
  criterion constrains the step and the run's outcome, not the build's overall
  control flow: whether the rest of the build proceeds around the blocked step or
  the whole run halts is an implementation judgement with real trade-offs in a
  partially-installed project. What may not happen is the two things observed
  today -- the content going away, and the run calling that a success.
