it_requirements:
  - "Extend extract_script_path_refs to scan workflow sources (templates/workflows-js/*.js, and templates/workflows/*.md where present) in addition to agents/ and skills/ .md files. Do NOT widen the output-root prefix bound while doing so — the existing negative-control tests for debugging/scripts/... and leafcutter/scripts/build.py must stay green."
  - "Decide deliberately how to treat template-literal paths in JS (`${worktreePath}/scripts/...`): a ${...} interpolation is NOT an output root. Record the decision and its rationale in the module DECISION HISTORY rather than leaving it implicit."
  - "Repoint the fast-lane workflow's script invocations at the deployed locations. Note that fast-lane-ship.js resolves its gate script against a git worktree of the CURRENT repo, which is why the bug is invisible in the package repo: leafcutter-ai tracks scripts/ as real source, a consumer project does not."
  - "Verify behaviorally against a real consumer install produced by build.py --target-dir, not against the package tree — resolving a path in the package repo proves nothing about a consumer, which is precisely how this shipped. Adding the workflow scan must NOT turn _check_script_reference_guard red; if it surfaces new broken references they must be fixed, not parked (KNOWN_UNDEPLOYED_ALLOWLIST was emptied by BP-900g-5 and a test asserts it stays empty)."
