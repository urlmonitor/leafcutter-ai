id: ACS-1300a-2-i
components:
  - ac_store
title: "Dropping a claim is per-entry and reported, and an entry the rule cannot judge is never dropped"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a store in which one record's coverage list holds three entries: a path-shaped
    entry naming a file that is not on disk, a path-shaped entry naming a file that is
    on disk, and an entry that is not path-shaped at all,
  When the repair tool is invoked out of process with the apply request,
  Then only the entry naming the absent file is removed,
  And that removal is reported on its own line naming the record and the exact entry
    text removed, so the run's output alone is enough to put it back by hand,
  And the entry naming the file that is on disk is still present afterwards,
  And the entry that is not path-shaped is still present afterwards and is reported as
    not judged by this rule, rather than passed over without mention,
  And in that same invocation a different record gained a missing link, so the run that
    left two of the three entries alone was demonstrably live,
  And a record whose every coverage entry names an absent file is left with an empty
    coverage list and reported, rather than being skipped to avoid emptying it.
depends_on:
  - ACS-1300a-2
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
    relevance: "The coverage field holds EITHER test paths OR child requirement ids, so 'not path-shaped' is a legitimate and common entry rather than corruption. This is the same dual-purpose fact ACS-1300a-3 is built on; here it appears as the reason a removal rule must never run on an entry it cannot classify."
  - path: scripts/ac_store/done_proof.py
    relationship: relates-to
    status: exists
    relevance: "_has_resolvable_child documents the third case this criterion protects: legacy records predating the child-id convention hold test-file paths where child ids would go, so entry shape alone does not settle what an entry means. A removal rule that guesses will delete real evidence."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "REMOVAL IS PER ENTRY, NEVER PER RECORD. The unit of the removal operation is a single coverage-list entry. A rule that rewrites a record's whole coverage list — even to a value it computed correctly — destroys the ordering, quoting and any entry the classifier did not understand, and turns an asymmetric destructive operation into a bulk one."
  - "AN ENTRY THE CLASSIFIER CANNOT PLACE IS NEVER REMOVED, AND IS NEVER PASSED OVER IN SILENCE. `docs/reference/ac-schema.md` states the coverage field holds EITHER test paths OR child requirement ids, and `done_proof._has_resolvable_child` documents a third live case: legacy records holding test-file paths where child ids would go. Entry shape therefore does not settle entry meaning. Anything the rule cannot classify stays on the record and is reported as not judged by this rule (ACS-1300c-3's abstention channel, not a second one)."
  - "EACH REMOVAL IS REPORTED ON ITS OWN LINE, NAMING THE RECORD AND THE EXACT ENTRY TEXT REMOVED. The report alone must be sufficient to restore any removal by hand without consulting git. Removal is the asymmetric half of this repair — appending a wrong link leaves the previous evidence beside it, while removing an entry destroys the only pointer that existed — and the measured population is small enough that there is no volume argument against reporting every one."
  - "NO MOVED-FILE OR RENAME INFERENCE, EVER. The tool cannot distinguish a moved file from a deleted one, and a rename heuristic writes a link on a guess. That is the drift toward heuristics that made ACD-800 the wrong parent for this tree, and it manufactures false evidence — worse than the missing evidence it replaces. Report the removal and stop."
  - "EMPTYING A COVERAGE LIST IS A PERMITTED OUTCOME AND MUST BE REPORTED, NOT AVOIDED. A guard that declines to empty a list feels protective and is not: it leaves the record claiming proof that is wholly gone, which is precisely the false premise every downstream honesty gate then reads."
  - "NEVER WRITES THE FINISHED-STATE FIELD. Emptying a coverage list is exactly the moment an implementer is tempted to reconcile `work_status` with the now-absent evidence. Refused, not deferred: the record's finished state is left byte-identical and the reconciliation is reported for `mark_ac_done.py`, never performed here."
  - "REMOVAL USES THE SAME TARGETED-LINE WRITE TECHNIQUE AS THE APPEND HALF (ACS-1300a-2), so a record with one entry removed keeps the formatting of every line the removal did not touch, and a record with nothing removed is never opened."
  - "Must handle errors gracefully per the project error handling policy and must fail toward NOT REMOVING: if an entry's classification is uncertain for any reason, it stays."
delivers_to: null
expects_from:
  ac_id: ACS-1300a-2
  contract: "The apply step whose removal half this AC constrains."
test_spec:
  - name: test_acs_1300a_2_i_only_the_absent_file_entry_is_removed_from_a_three_entry_list
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "THE DISCRIMINATION TEST, WITH ITS PAIRING INSIDE IT. One out-of-process apply run over a record whose coverage list holds an absent path-shaped entry, a present path-shaped entry, and a non-path-shaped entry. Assert in that single invocation: only the absent-file entry is gone; the present-file entry survives; the non-path-shaped entry survives; AND a different record in the same store gained a missing link. The last clause is what stops a tool that removes nothing from passing three of the four assertions."
  - name: test_acs_1300a_2_i_each_removal_is_reported_on_its_own_line_with_the_exact_entry_text
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "The removal is reported individually, naming the record id and the exact entry string removed — assert the reported string is character-identical to what was in the file, so the report is sufficient to restore the entry by hand."
  - name: test_acs_1300a_2_i_a_non_path_shaped_entry_is_reported_as_not_judged_rather_than_omitted
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "Assert the non-path-shaped entry is PRESENT in the report with a not-judged-by-this-rule classification. Absence from the report is the failure: an entry passed over without mention is indistinguishable from an entry the run never reached."
  - name: test_acs_1300a_2_i_a_record_whose_every_entry_is_absent_is_emptied_and_reported
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: "A record all of whose coverage entries name absent files ends the run with an empty coverage list and a report line saying so — not skipped to avoid emptying it. In the same invocation assert its finished-state line is character-for-character unchanged, because an emptied evidence list is the sharpest temptation to reconcile the badge."
  - name: test_acs_1300a_2_i_no_rename_or_moved_file_inference_occurs
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: failure
    description: "Given a coverage entry naming `unit_tests/x/test_old.py` which is absent while `unit_tests/x/test_new.py` exists on disk and carries a tag naming the same record, assert the run REMOVES the absent entry and adds the link only because the new file's tag names the record — never because the two paths look similar. Assert no entry is rewritten in place, which is what a rename heuristic would produce."
