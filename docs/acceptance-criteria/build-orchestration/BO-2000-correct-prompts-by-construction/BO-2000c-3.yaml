    description: "In test_implementation_notes_emission.py::TestReferencePatternResolution. Carries BOTH Then clauses in one test: a reference_pattern matching exactly one existing file yields the concrete resolved filename in the Implementation Notes body (assertIn), and the raw glob does not appear (assertNotIn)."
  - name: test_single_match_pattern_still_resolves
    target_dir: unit_tests/prompt_assembly/
