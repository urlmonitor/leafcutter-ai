notes: |
  THE DOCUMENTATION AC FOR ACS-1400b'S `how-to` TRIGGER. Intended author is the
  documentation expert; the agent assignment is left for the IT PO to set.

  THE JUDGEMENT THE GUIDE TEACHES IS THE ONE THIS WHOLE TREE TURNS ON. Telling a
  deliberate exclusion from real drift is not a detail of reading a report — it is
  the distinction that, when missed, produced a brief instructing someone to
  repair all 47 records including six that must never be touched. A guide that
  explains how to invoke the check and stops there leaves the reader exactly where
  the originating brief left its author.

  WRITTEN AS AN OUTCOME FOR A READER, NOT AS A CONTENTS LIST. "A guide exists" is
  satisfied by any page. Requiring that a first-time reader reach the right
  conclusion for each classification makes the claim falsifiable by handing the
  guide and the report to someone who has not seen either.

  THE LAST Then CARRIES ACS-1400b-3's OBLIGATION INTO THE PROSE. A reader who
  cannot tell from the report whether the whole store was examined will read a
  zero-finding run as a clean bill of health, which is the failure this component
  has already shipped three times.

  NO COMPONENT DIAGRAM. No new architectural layer is introduced here — this is
  wiring and reporting for a script that already exists. The reader inventory for
  the coverage field, which genuinely is undrawn, belongs to ACS-1400d.
