notes: >-
  WHY THIS IS A SEPARATE RECORD AND NOT A CLAUSE OF ITS PARENT. Both outcomes are
  failures, so an implementation can satisfy the parent by failing on both with one
  undifferentiated message — and that message is worse than useless, because the two
  cases have opposite remedies. "The alteration never reached the code" means redo the
  proof. "The alteration reached the code and changed nothing" means the guard has a
  dead refusal path and is the finding the proof exists to produce. A reader who cannot
  tell them apart will redo the proof, get the same message, and conclude the tooling
  is flaky.


  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSE. "It does not report the unchanged
  verdict as a proof that succeeded" asserts an absence and is green on arrival.
  INJECTION: treat any completed proof run whose exit status is zero as a successful
  proof, ignoring whether the verdict moved. Under that injection the landed-but-inert
  alteration reports as a successful proof; this criterion must go RED naming that case,
  and must return to green on revert.


  SECOND NAMED MUTATION, FOR THE DISTINGUISHABILITY CLAUSE. Emit one shared message for
  both failing outcomes. Under that injection the run still fails in both cases — so the
  parent's clauses stay green — and only this criterion goes RED. That asymmetry is the
  reason this record exists.
