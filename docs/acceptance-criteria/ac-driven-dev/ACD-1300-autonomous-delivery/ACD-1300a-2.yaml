it_requirements:
- Ranking and topology remain deterministic code, with stable canonical-ID ordering and no LLM grouping
  or ordering decisions.
- Only dependency-ready, eligible candidates enter ranking; structural ancestry and true execution dependencies
  remain distinct inputs.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
