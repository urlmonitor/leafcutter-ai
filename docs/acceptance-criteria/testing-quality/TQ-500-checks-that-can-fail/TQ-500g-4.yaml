title: "A test that failed in any of its cases is read as failed by every check that reads a test run"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given one test run over three tests —
      S1: test_refresh_gate, written with two sub-cases, whose sub-case
          "retry_due unset" fails and whose other sub-case passes,
      S2: test_export_gate, written with two sub-cases, both of which pass,
      S3: test_window_gate, which has no sub-cases and fails,
  When the proof-of-done check and the red-baseline check each read that
    run's outcome for S1, S2 and S3,
  Then both read S1 as failed, and name its failed sub-case "retry_due unset",
    And both read S2 as passed,
    And both read S3 as failed, as they do today,
    And the proof-of-done check judges a requirement covered only by S1 not
      eligible for done,
    And the red-baseline check counts S1 as red at baseline, not as green at
      baseline,
    And the two checks give S1, S2 and S3 the same outcome as each other,
      because they read the run through one shared reading, not two.
