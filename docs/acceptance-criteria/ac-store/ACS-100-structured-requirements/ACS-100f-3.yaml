criteria: |
  Given AC "ACS-100a" has created_by: "tickets/00_inbox/some-ticket.md"
    and amended_by: ["tickets/00_inbox/another-ticket.md"],
  When an agent queries for AC ID "ACS-100a" with include_tickets: true,
  Then the result includes a related_tickets list containing:
    - the ticket path from created_by,
    - all ticket paths from amended_by,
  And each ticket entry includes the ticket's title and status
    (read from frontmatter),
  And tickets that no longer exist on disk are listed with status: "missing".
