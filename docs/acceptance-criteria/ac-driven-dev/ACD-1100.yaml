criteria: |
  The v3 authoring pipeline (PO, BA, IT PO) and its command surface
  (/plan-feature, /build-ac) are the only requirements-to-code path in the
  package. All v1 and v2 pipeline agents, commands, and transitional
  scaffolding have been removed. Agent names carry no version suffixes.
  The package ships as version 2.0. Existing AC stores, tickets, and
  workflows created under v1.x continue working without manual fixup.
