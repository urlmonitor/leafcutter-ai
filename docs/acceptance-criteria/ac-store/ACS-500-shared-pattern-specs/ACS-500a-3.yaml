title: "Schema validates implements_pattern references point to existing ACs"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an AC YAML file contains the field implements_pattern: "ACS-500a-1",
  When the schema validator runs at commit time,
  Then it verifies that the referenced AC ID exists as a file in the AC store,
  And the referenced AC has a criteria field containing at least one
    parameterized slot (a named placeholder in curly braces),
  And if the referenced AC ID does not exist, the commit is blocked
    with an error naming the dangling reference and the file that contains it.
