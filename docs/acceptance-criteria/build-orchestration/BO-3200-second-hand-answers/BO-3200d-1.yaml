test_spec:
  - name: test_bo_3200d_1_149kb_result_arrives_byte_identical_with_the_marker_found
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Produce a well-formed result of at least 149 KB with a distinctive marker part-way through; assert what the reading step reads is byte-for-byte identical to what was produced and that it finds the marker."
  - name: test_bo_3200d_1_verdict_matches_the_one_from_the_produced_result
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: criterion
    description: "Compute the reading step's verdict from the handed-over result and from the produced result read directly; assert they are equal. Content equality alone can hold while the step reads something else."
  - name: test_bo_3200d_1_small_result_uses_the_same_handover
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: boundary
    description: "THE NO-THRESHOLD TEST. A few-hundred-byte result containing the same marker is read whole through the SAME mechanism. Fails any implementation that keeps the old in-reply path for small results and adds a second one for large."
  - name: test_bo_3200d_1_handover_preserves_bytes_exactly_not_normalised
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    angle: boundary
    description: "A result containing mixed line endings, a trailing newline and non-ASCII content survives the handover unchanged — a re-encoding handover is one that altered the result."
  - name: test_bo_3200d_1_stale_artifact_from_a_previous_run_is_not_read
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: failure
    description: "With a previous run's artifact present, assert the current run reads its own result and never the stale one. A stale artifact read as this run's output is a new phantom-done vector introduced by the fix."
test_rationale: |
  The failing size is not a round number and neither is the marker position: KI-BO-019's bundle
  was 148,891 bytes with the marker at line 958. A fixture below the size at which the handover
  changes behaviour passes on the broken handover, and a marker in the first kilobyte is found
  even by a handover that lost ninety per cent of the content. Both choices are the difference
  between a test that can fail and one that cannot.
  The small-result test is the one that forbids the tempting fix: keep the reply for small
  payloads, add a file for large ones. That passes the first two criteria completely and ships
  the defect behind a threshold nobody revisits.
  The stale-artifact test covers a hazard the fix itself creates — moving the result out of the
  reply means it now persists, and a persisted artifact read by the wrong run is a fresh way to
  be confidently wrong.
