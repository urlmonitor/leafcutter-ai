  - documentation_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given a person who has just been told by the automatic checks that part of their record is
    behind,
  When they open the how-to for reconciling the record,
  Then it states, for each kind of finding the checker can report - a pointer that does not
    resolve, a pointer it could not classify, a journey behind, a journey never confirmed -
    what the finding means and what to open first,
  And it walks through reconciling one journey end to end, including how to record that the
    journey has been confirmed against the current code,
  And it states what to do when the code was right and the record was wrong, and separately
    what to do when the record was right and the code was wrong,
  And it states that a separator-only difference between platforms is not drift and must not be
    reconciled as though it were.
