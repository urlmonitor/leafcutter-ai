criteria: |
  Given a labelled set of 78 wordings measured against 7 categories, 22 that belong to one category and 56 that belong to none, plus 4 related-but-different pairs, as in the Jev trial for kernel run run-b5af8c7fae2248ba,
  When the grouping is evaluated on that set at each acceptance setting it offers,
  Then every wording gets exactly one outcome: one existing category that is not retired, or "none",
  And a wording the grouping cannot place at the acceptance setting gets "none", never the nearest category,
  And for each setting the evaluation reports the accepted merges, their precision (correct merges out of accepted merges), their recall (correct merges out of the 22 that belong) and the share of the 56 left at "none",
  And the setting in use is the one with the highest precision, recall deciding only between settings of equal precision, so on the trial's figures a setting with 100% precision (12 of 12) and 55% recall (12 of 22) is chosen over one with 94% precision (15 of 16) and 68% recall (15 of 22),
  And a wording left at "none" stays its own candidate, which a person can still merge later.
