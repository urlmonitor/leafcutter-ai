notes: |
  WHY THIS IS A SEPARATE RECORD RATHER THAN A CLAUSE. The parent is about what
  the notice says. This is about where it lands, and it is the arm most likely
  to be quietly dropped, because a merged stream capture makes a violation
  invisible: a test that reads combined output passes whether the notice went to
  the right stream or corrupted the report. The two streams must be captured
  separately for this criterion to mean anything.

  THE COMPONENT ALREADY HAS THIS CONVENTION. Warnings from this family of checks
  go to the error stream while the findings report stays on the output stream;
  GE-113c-3-v established it for an allowlist warning and GE-123d-5 reuses it
  for the adjacent exemption notice. This record adopts the same split rather
  than inventing a second convention, and the one place it departs from
  GE-113c-3-v — the verbatim offending text, which that record includes and this
  one must never include — is held by the parent, not here.

  FIXTURE PLACEMENT is the parent's, unchanged and for the parent's reason: for
  this L1 the fixture belongs under an exempt path by design. The control file
  outside those locations is what supplies the finding that the output stream
  must still carry, so it is load-bearing here too and must not be dropped as
  redundant.

  IT-PO NOTE, 2026-08-24 — the convention was CONFIRMED IN THE CODE, not taken
  on the strength of the two sibling records. templates/scripts/commit_guardian/
  check_secrets.py writes its findings report with bare print() and no file=
  argument, so that report is on stdout today; its single stderr write is the
  warning issued when the staged set cannot be listed. The scanner it calls,
  templates/skills/security-scanner/scripts/scan_secrets.py, sends
  allowlist-parse warnings to stderr and says so in its module docstring
  ("never stdout"). So the split this record fixes is the one already in force,
  and the change is additive.
