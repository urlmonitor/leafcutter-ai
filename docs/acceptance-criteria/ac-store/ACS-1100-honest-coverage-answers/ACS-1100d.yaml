criteria: |
  Downstream checks inherit the coverage claim, not a false clean bill of health.

  Anything that verifies the store on the back of an earlier answer carries that
  answer's coverage figure through to its own result, so a check can only ever
  claim to have cleared as much as it genuinely saw.
