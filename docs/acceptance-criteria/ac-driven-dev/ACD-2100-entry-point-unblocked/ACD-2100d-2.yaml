notes: |
  THE MOTIVATING FACT: on 2026-08-18 the KI-ACD-004 workaround was applied to the
  DEPLOYED copy of setup_ticket_worktree.py. That file is build output; the next
  build overwrote it from templates/ and the repair evaporated. For the window in
  between, the defect looked fixed on the machine where it was tested.

  THE THIRD CLAUSE IS THE ONE THAT MAKES THIS TESTABLE END TO END. It requires the
  report to be confirmed by what the installer actually does, so the check cannot
  pass by being merely opinionated about paths -- run the installer and observe the
  repair gone.

  WHAT THIS IS NOT. It is not a ban on touching an installed copy while debugging,
  and it is not the general question of what "delivered" means for this repo. It is
  the narrow guarantee that a repair living only in build output is visible as
  undelivered before someone reports it as done. That distinction is what separates
  this from a sibling behaviour: a, b and c say what the route must do, this says
  where a repair must live for the copy that runs to do it.

  THE SILENT-OVERWRITE HALF is ACD-2100d-2-i: an install that replaces a locally
  changed generated file should say so. Reporting and refusing-to-be-silent are
  different behaviours with different observations.

  2026-08-25 (it-po): the delivers_to contract to ACD-2100d-2-i is deliberate -- the
  divergence determination this record needs and the one the installer needs to
  announce a replacement are the same computation. Building them twice is how the two
  come to disagree, and a disagreement here means the check reports clean while the
  installer silently discards a repair, which is the 2026-08-18 incident exactly.
  The generation-transform requirement is the one a coder is most likely to trip on:
  the naive implementation compares bytes, fires on every deployed file, and is
  switched off within a week.

  IT PO ENRICHMENT -- 2026-08-26 (files_touched backfill).

  WHY THIS RECORD PRODUCED AN EMPTY files_touched. generate_ticket_from_ac.py derives
  the ticket surface as the union of path tokens found in it_requirements prose that
  exist on disk, plus doc_links whose relationship is one of constrains / creates /
  implements / modifies / specifies. Every doc_link here was "describes" and no
  it_requirement named a path, so the union was empty. This affected the whole d family
  except d-4 -- four tickets, not the three originally reported. The enrichment below
  fixes the cause, so a regeneration reproduces the same four paths.

  A CORRECTION TO MY OWN FIRST HYPOTHESIS, RECORDED BECAUSE IT WOULD HAVE SENT A CODER
  THE WRONG WAY. Reading the docstring of the installer's output-mapping computation, I
  concluded it enumerated four template directories by hand and therefore could not see
  the route file at all. That is what the docstring says and it is wrong -- the docstring
  is stale. Reading the generated manifest instead showed nine workflow-script entries
  present and correct, including the route. The mapping is installer-derived and already
  covers this record's subject. Had I stopped at the docstring, this record would have
  been pointed at rebuilding a mapping that already works.

  WHAT IS ACTUALLY BROKEN, ESTABLISHED BY RUNNING IT RATHER THAN READING IT. Executing
  scripts/commit_guardian/check_output_drift.py in this worktree on 2026-08-26: exit 0,
  169 output files examined, 169 of them reported as "not in output_mappings" and
  skipped, zero actually compared. The cause is a namespace mismatch. The check walks a
  hardcoded list of directory names and forms its lookup keys relative to the repository
  root; the installer keys every mapping entry under the configured output root. The two
  key spaces never intersect, so every file takes the fail-open not-in-mapping branch.
  The delivery check that this record exists to strengthen cannot presently report drift
  on ANY file, and it has never been able to. That is the inert-gate shape called out in
  the fourth it_requirement, and it is live rather than hypothetical.

  THE FOUR PATHS, AND WHY EACH ONE IS THERE.

  scripts/commit_guardian/check_output_drift.py -- the check itself, and the primary
  surface. Both defects live here: the hardcoded scan list, and the fail-open branch that
  turns "I cannot see this file" into silence.

  scripts/build_helpers.py -- the installer-derived mapping the check must be built on.
  Listed because the two sides have to agree on a key namespace and either side can be
  the one that moves, and because the docstring materially misdescribes the coverage,
  which is what misled me above. Listed with a narrower expectation than the check: this
  may end up being a docstring correction plus an exported key-format helper rather than
  a change to the computation.

  scripts/commit_guardian/commit_guardian.json -- the hook registration. Its file-trigger
  pattern carries the same stale prefixes as the check's scan list, so fixing only the
  script leaves a gate that computes the right answer and never runs. This is the
  enforce-on-the-gate-that-actually-runs case: name every enforcement point, and identify
  which one is load-bearing.

  unit_tests/build_guards/test_acd_2100d_2.py -- the four descriptors. The reachability
  descriptor has been sharpened to say that a run which examines files and checks none of
  them, exiting clean, must FAIL -- because that is precisely today's behaviour and a
  test written without that sentence would pass against it.

  PATHS CONSIDERED AND REJECTED.

  scripts/build.py and scripts/build_phases.py -- rejected, and this is the boundary with
  ACD-2100d-2-i. Those files hold the installer's four compare-before-write branches,
  which are where the install-time ANNOUNCEMENT fires. This record is the DETERMINATION
  and the report at delivery time. See the ownership boundary requirement above.

  The generated build manifest -- rejected. An artifact the installer writes, not a file
  anyone edits.

  templates/workflows-js/plan-feature.js -- rejected. The route file is this record's
  SUBJECT, not its surface; the check reasons about it and must not modify it, which the
  side-effect-free requirement already states.
