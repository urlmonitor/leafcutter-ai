    relationship: describes
    status: exists
assigned_agent: llm-expert
estimated_complexity: M
delivers_to:
  agent: llm-expert
  contract: "The dual-read Step 1 coverage-resolution behaviour of ac-fulfillment-gate.md (accept ac_traceability OR resolve source_ac + the resolved AC deliverable checklist; absent-coverage falls back to advisory in foundation). The enforce-side flip ACD-1900c-6 extends this exact Step 1 to return a blocker under enforce."
expects_from:
  ac_id: ACD-1900b-1
  contract: "The shared dual-read spec resolver returning the resolved-spec dict (source_ac -> store AC record incl. its deliverable checklist / sign-off slots) that the gate consumes in its coverage-resolution control flow instead of the absent-ac_traceability skip."
it_requirements:
  - "Canonical surface: the agent-template prose templates/agents/ac-fulfillment-gate.md, Step 1 (the deployed .claude/agents/ copy is build output per ADR-001 and must never be hand-edited). Rewrite the \"ac_traceability absent -> sign off status: ok immediately\" skip so Step 1 DUAL-READS: accept ac_traceability OR resolve source_ac and the resolved AC's deliverable checklist before deciding a verdict."
  - "Reuse the shared dual-read spec resolver from ACD-1900b-1 -- do not author a second resolver in the prose. The gate's coverage-resolution must consume the resolved AC's deliverable checklist as the data input to its pass/block verdict, so a thin ticket is actually verified (never a fixed skip)."
  - "Read-side foundation only (phase_acbuild_1_foundation): when coverage cannot be resolved the gate falls back to advisory / dual-read, it does NOT block. The enforce-time \"absent -> blocker\" flip is the separate twin ACD-1900c-6 -- do not implement enforce-time blocking here (ADR-026 rule 5: the silent-skip stays until the enforce stage after fat tickets drain)."
  - "No executable pytest surface is authored here (agent-template prose change) -- see test_required. Per CLAUDE.md 'Gate/Workflow ACs verify behaviorally, not by grep', behavioral correctness is proven by the paired python-coder gate-verdict tests (ACD-1900b-3) plus an ADR-026 rule-7 real-thin-ticket spot-check that runs the gate against a real thin ticket whose resolved AC has an unmet deliverable and asserts it BLOCKS (not ok), and against one whose deliverables are all signed and asserts ok -- never grep-only."
