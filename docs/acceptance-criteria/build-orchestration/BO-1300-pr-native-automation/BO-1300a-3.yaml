  - "Surface is the .js workflow body: the delivery-to-main step lives in templates/workflows-js/finalize-feature.js Step 4 (currently `gh pr merge ... --merge`). MODIFY that step so the ONLY path to main is the PR merge; remove/forbid any direct `git push origin main` (or push whose destination ref resolves to the default branch) from the finalize and ticket lifecycle. Per the IT-PO surface rule, the .js workflow body + gh glue is python-coder work, not llm-expert."
  - "MODIFY existing: the building-epics SKILL.md supervisor merge gate and templates/workflows-js/finalize-feature.js must converge on the PR-merge path; do not leave a second code path that pushes commits to main."
