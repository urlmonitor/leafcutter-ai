criteria: |
  Given the package as shipped, with its workflows plan-feature, quick-fix, fast-lane-ship,
    finalize-feature and build-feature, its commit agent, and its precommit-autofix and
    building-epics skills,
  When every place that records a commit is enumerated, by running each workflow's commit
    path against a test repository and by listing every commit instruction in the agent and
    skill text,
  Then every one of them records its commit by calling the shared commit step,
  And none of them stages files or records a commit by a recipe of its own,
  And the enumeration finds the eight workflow sites named in BO-4500a's notes (plan-feature
    three, quick-fix two, fast-lane-ship one, finalize-feature one, plus the build-feature
    commit dispatch) and no site that the migration records do not account for.

  Given each piece of commit logic the shared step carries -- which files are staged, how the
    message is handled, how checks are run and retried, which branches are refused, and how
    concurrent commits are kept apart,
  When the change that builds the shared step is reviewed,
  Then for each piece it names the existing copy the step's version was taken from and the
    known issues that copy was fixed for,
  And no piece was taken from a copy that a sibling copy had already fixed and it had not.

  Given every known issue whose fix lived in a recipe the shared step replaces, including
    KI-BO-029, KI-BO-20260928-stage-commit-leaves-the-edited-parent-unstaged,
    KI-BO-20260901-0920, KI-BO-20260914-commit-agent-rewrites-co-author-trailer and
    KI-BO-20260925-commit-agent-pkill-kills-parallel-test-runs,
  When the test suite runs,
  Then each such known issue's regression test exercises the shared step itself,
  And no regression test is left pointing only at a retired recipe.
