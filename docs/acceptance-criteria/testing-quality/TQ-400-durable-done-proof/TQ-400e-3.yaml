notes: |
  Build on the mechanism that already exists — do NOT mint a new one. A test-free
  declaration is already honoured today: check_all_done_acs and
  check_changed_done_acs (scripts/commit_guardian/check_done_proof.py:463 and
  :491-495) skip any record whose test_required is the boolean False, and 37
  finished records in the store carry it as measured on 2026-08-17. The schema
  already carries test_rationale (config/ac_store_schema.json) as the prose
  justification field.

  What is missing, and what this AC adds, is that the declaration is currently
  honoured with NO reason required — a silent, unaccountable escape. This AC
  requires the reason; TQ-400e-4 makes the requirement enforceable by refusing
  declarations that lack one.

  Exempt must be a reported outcome, not a skip. A skipped record is invisible,
  and invisibility is the whole defect TQ-400 addresses: 37 records currently
  leave the enforced population with no reader ever seeing why.

  IT-PO ENRICHMENT NOTE (2026-08-17) — THE THIRD ENFORCEMENT POINT, AND IT
  DISAGREES. Beyond the two skips the BA identified, scripts/commit_guardian/
  _ac_schema_validators.py (around :522) already REJECTS test_required: false on
  an approved, not-yet-done, leaf CODE AC, and rejects test_required: false
  alongside a non-empty test_spec as a contradiction. So the two layers currently
  point in opposite directions: the schema validator forbids the declaration for
  code ACs at authoring time, while the sweep honours it unconditionally for done
  records at check time. The legitimate exemption population is therefore
  non-code records and already-done records, and that boundary has to be stated in
  the implementation. Adding a reason requirement without reconciling the two
  leaves a record that is legal to the sweep and illegal to the validator, which
  is the disjoint-vocabulary failure (EPIC-ComputedQualityGates FP-1 layer 3)
  waiting to happen again.

  SEQUENCING. Per the product owner, TQ-400e gates TQ-400b and TQ-400d. This
  record is the gate for TQ-400d specifically: TQ-400d-1 consumes the exempt
  outcome to keep the triage pile free of records nobody should triage.
