    type: behavioral
    angle: criterion
    description: "The refusal text never proposes adding the newly advertised check to the record — the way past is never to widen it."
  - name: test_ge120h2_registering_a_recorded_check_without_reducing_the_record_is_refused
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A commit that makes a recorded check run while leaving the record unchanged is refused, names the check, and says the record must be reduced by it."
  - name: test_ge120h2_registering_and_reducing_together_completes_and_shrinks_the_record
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "A commit that both registers a recorded check and removes it from the record completes, and the recorded quantity is smaller than before."
  - name: test_ge120h2_result_is_independent_of_how_many_entries_the_record_holds
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: seam
    description: "Fixtures whose records hold different numbers of entries produce correct verdicts — no count is pinned anywhere."
  - name: test_ge120h2_existing_inventory_assertions_still_hold_after_the_extension
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "test_no_unregistered_hook_scripts_beyond_baseline and test_every_registered_script_resolves_on_disk still pass and still fail on a new orphan and on a stale record — the extension did not weaken the incumbent."
test_rationale: >-
  The two refusal arms are the load-bearing ones and neither has a red baseline today:
  with no such rule in force both changes are accepted silently, so each must be
  exercised as an attempted commit whose outcome and author-facing text are asserted.
  Reading the record as text and comparing it to an expected list is green on a rule
  nothing enforces, which is the specific failure this record exists to prevent one
  level up. The last case is a regression guard rather than a criterion clause and is
  the one most likely to be skipped: the incumbent test already enforces two of these
  four arms over the disk population, and the cheapest way to "extend" it is to relax
  it — an extension that leaves the old assertions passing only because they no longer
  assert anything would satisfy every other case here.
