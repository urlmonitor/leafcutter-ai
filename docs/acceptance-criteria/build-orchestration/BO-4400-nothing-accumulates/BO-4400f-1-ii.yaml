id: BO-4400f-1-ii
title: "Leftover change-stash files from the commit checks expire like any other scratch"
component: build-orchestration
components:
  - build_orchestration
  - testing_quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given the scratch age limit is 24 hours, and the commit-check tool's own cache folder
    holds four saved change-stash files it left behind: two written 3 days ago and two
    written 1 hour ago,
  And the same cache folder holds the commit-check tool's installed check environments,
  When the sweep runs,
  Then the two 3-day-old change-stash files are removed and counted in the report,
  And the two 1-hour-old change-stash files exist afterwards,
  And every installed check environment in that folder exists afterwards and is
    byte-identical to its state before.
depends_on: [BO-4400f-1, BO-4400d-1]
doc_links:
  - path: docs/how-to/managing-pre-commit-hooks.md
    relationship: describes
    status: exists
    relevance: The commit-check tool whose stash patch files (patch* in its user cache) never expire today.
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: BO-4400f-1
  contract: "Scratch age rule, applied to a location the project does not own."
package_surface: false
it_requirements:
  - >-
    Third-party leftovers are a declared list (data, beside the durable-path list): for pre-commit,
    location = PRE_COMMIT_HOME or <user cache dir>/pre-commit, match = top-level regular FILES named
    patch<digits>[-<digits>] only. Directories (repo* hook environments), db.db and every other
    entry are never candidates.
  - >-
    These items have no run owner, so the unknown-owner branch of classify() applies (age by mtime
    alone); removals are counted under the sweep's scratch kind.
  - >-
    PROOF: temporary PRE_COMMIT_HOME with four real patch files (mtimes 3 days and 1 hour) and two
    real hook-environment folders with content; deployed sweep as a separate process; hashes of
    every environment file before and after.
test_required: true
test_spec:
  - name: test_old_pre_commit_stash_files_removed_and_counted
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The two 3-day-old patch files are removed and counted in the sweep report."
  - name: test_recent_pre_commit_stash_files_kept
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The two 1-hour-old patch files exist afterwards."
  - name: test_pre_commit_hook_environments_untouched
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Every hook environment in the cache folder is byte-identical after the sweep."
    must_catch:
      - "clearing the whole pre-commit cache"
test_rationale: >-
  The danger is over-matching in a folder the project does not own; real environments next to real
  patch files are what show the matcher touches only the patches.
origin_agent: business-analyst
created: 2026-10-09
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  Gap G7: "pre-commit stash patch files (~/.cache/pre-commit/patch*) expire". These live
  outside the scratch location because the third-party tool writes them; they have no run
  owner, so the unknown-owner branch of the rule applies (age alone). The last clause guards
  the plausible wrong version "clear the pre-commit cache" which would force every hook
  environment to reinstall.
