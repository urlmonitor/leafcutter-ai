notes: |
  FLOW BACK-LINKS (add this AC id to each node's implements list):
    leafcutter/decision-retrieval  step    lookup
    leafcutter/decision-forming    step    precedent
    leafcutter/decision-lifecycle  step    reuse

  DERIVATION. Scenario lookup, plus decision-forming/precedent (the entry point
  that expands into this sub-flow: "matching earlier records are looked up and
  judged, and any that apply are carried forward") and the journey scenario
  decision-lifecycle/reuse ("found through docs/decisions/index.json"). The two
  umbrella scenarios are also satisfied, in their later clauses, by DK-600e-2
  (judged, carried forward) and DK-600e-3 (offered for reuse, never resolves on
  its own). The "text score alone" clause comes from
  docs/how-to/file-and-reuse-decisions-with-the-kernel.md Step 5 ("where the task
  names them").

  STANDING RULE carried from DK-600e: only published records are found
  (DK-600d-1-i is the same rule from the publishing side).

  GAP, NOT SPECIFIED. The flow does not say what happens when a record's sha256
  does not match its index entry (skipped, error, run fails). Raised as a question
  in the BA sign-off; add an L3 once answered.

  JOURNEY NODE NOTE. decision-lifecycle/reuse expands into the whole retrieval
  sub-flow; listing DK-600e (the composite) in its implements may suit it better.

  IT-PO BUILD STATUS (2026-10-02, unverified): built and tested. The sha256-mismatch
  question is answered by the code: the record is skipped with a warning and the run
  continues. Pointers: amended_by.

  BA QUESTION 1, ANSWERED (2026-10-02): a record whose sha256 does not match its index entry
    is skipped with a warning, and the run continues. No L3 for this behaviour exists in the
    tree and none is added (no new ACs by user decision). The behaviour is built and tested:
    tests/kernel/memory/test_store.py, a sha256 mismatch is skipped.
