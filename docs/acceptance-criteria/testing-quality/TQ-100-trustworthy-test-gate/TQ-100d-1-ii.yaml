assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "DESIGN DECISION (settled): a now-passing allowlisted entry is a HARD violation that fails the check (non-zero), not a non-blocking warning — per the 'list can't quietly rot' intent, a recovered test must force its stale exemption to be removed."
  - "The now-passing detection is outcome-based (the named test passed this run) and distinct from the time-based expiry of TQ-100d-1-i; both reuse the same known_failing_tests module."
  - "The flag message must name the entry and its test and indicate the exemption should be removed."
delivers_to: null
