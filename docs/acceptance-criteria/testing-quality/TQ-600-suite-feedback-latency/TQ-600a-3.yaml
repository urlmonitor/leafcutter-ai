id: TQ-600a-3
components:
  - testing_quality
  - build_pipeline
title: "Read-only is proved, not promised — a run that dirties the shared layout says so and names the test"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the shared reference layout of TQ-600a-1, and a record of its exact contents
    taken at the moment the single deploy that produced it finished,
  When every test that consumes the shared layout has finished,
  Then a comparison against that record reports no file added, no file changed and
    no file missing,
    And when one consuming test is deliberately made to alter a file inside the
      shared layout, the same comparison reports a difference, identifies the altered
      file, and the run reports a failure naming the test that ran between the two
      matching states,
    And the comparison reports how many files it compared, so a comparison that
      inspected nothing is distinguishable from one that found nothing.
depends_on:
  - TQ-600a
  - TQ-600a-1
doc_links:
  - path: docs/testing/test-angles.md
    relationship: describes
    status: exists
    relevance: >-
      The failure angle is mandatory for this AC: the second clause is a
      deliberately-induced failure, and an AC of this shape covered only at the
      criterion angle is the exact shape of guard this repository keeps shipping
      by accident.
  - path: docs/acceptance-criteria/testing-quality/TQ-600-suite-feedback-latency/TQ-600c.yaml
    relationship: related
    status: exists
    relevance: >-
      Sibling L1 carrying the three documented precedents of a check that examined
      nothing and reported clean. The third clause here applies the same discipline
      to this integrity comparison rather than only to the runtime budget.
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    THE RECORD MUST BE TAKEN BEFORE ANY CONSUMER RUNS. Capture it immediately
    after the single deploy returns. A record captured lazily on first consumer
    request is blind to that consumer's own mutation, which is the likeliest
    first offender.
  - >-
    COMPARE BY CONTENT DIGEST, NOT BY MODIFICATION TIME. A deploy writes its
    whole tree within a second, so mtimes are near-identical and an mtime-based
    comparison cannot see a rewrite. Cover all three difference kinds — added,
    changed, missing — and prove each separately.
  - >-
    EXCLUDE `__pycache__/` AND `*.pyc` FROM THE COMPARISON. Importing from the
    deployed tree generates bytecode as a side effect of reading it, so an
    unfiltered comparison reports a difference on every clean run and the check
    is disabled within a week. This repo has already been bitten by exactly this
    tree: idempotency tests that read every deployed file as UTF-8 crashed on
    `__pycache__/*.pyc` under pytest (recorded in CLAUDE.md).
  - >-
    A COMPARISON OVER ZERO FILES IS A FAILURE, NOT A PASS. Report the compared
    file count on every path. The repo's AC-store validator globbed zero files,
    printed a success-shaped message and exited 0 for eight days; a count in the
    output is the cheap defence against repeating it here.
  - >-
    Under pytest-xdist the shared layout is per worker, so the comparison and its
    offender attribution are per worker. State that scope in the output rather
    than implying whole-run attribution the mechanism cannot deliver.
  - >-
    Must complete in a few seconds over the deployed tree so it can run at
    teardown without re-introducing the cost this goal removes. Digest the tree
    once at capture and once at comparison; do not re-walk per consumer unless
    the per-test attribution mode is explicitly requested.
  - >-
    Failure must be non-zero for the run and must name the test that ran between
    the last matching state and the first differing one.
delivers_to: null
expects_from:
  ac_id: TQ-600a-1
  contract: >-
    The shared layout root path and the instant its single deploy finished, so
    the contents record is taken before any consumer runs; plus the ordered
    sequence of consuming tests, so a difference can be attributed to the test
    that ran between two states.
test_spec:
  - name: test_tq600a_3_a_clean_run_reports_no_added_changed_or_missing_file
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      After a session of genuine read-only consumers, the comparison against the
      post-deploy record reports zero differences in all three categories.
  - name: test_tq600a_3_a_deliberately_dirtied_layout_is_reported_with_the_altered_file_named
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      THE CAN-FAIL PROOF. One consuming test is made to alter a file inside the
      shared layout; the comparison reports a difference and identifies that file
      by path. Without this descriptor the comparison is a guard that reports
      clean forever.
  - name: test_tq600a_3_an_added_file_and_a_missing_file_are_each_reported
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: boundary
    description: >-
      The other two difference kinds. NAMED MUTATION: implement the comparison as
      a one-directional walk of the recorded file list; an ADDED file is then
      invisible and this test must go RED.
  - name: test_tq600a_3_a_content_rewrite_with_an_unchanged_modification_time_is_reported
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: failure
    description: >-
      NAMED MUTATION: compare by mtime and size instead of content digest. A file
      rewritten to different content of the same length with its mtime restored
      is then missed and this test must go RED.
  - name: test_tq600a_3_the_comparison_states_how_many_files_it_compared
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      The count is present in the output, is greater than zero for a real layout,
      and equals the number of files in the record.
  - name: test_tq600a_3_a_comparison_that_inspected_nothing_fails_rather_than_reporting_clean
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: failure
    description: >-
      Pointed at an empty or absent layout root, the comparison reports a
      compared count of 0 and a failing status. NAMED MUTATION: return "clean" on
      an empty file list; this test must go RED. This is the AC-store-validator
      shape, reproduced deliberately.
  - name: test_tq600a_3_the_test_that_ran_between_the_two_states_is_named
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      With one offender among several consumers, the run's failure names that
      test by node id — not merely "the layout changed".
  - name: test_tq600a_3_bytecode_churn_is_not_reported_as_a_difference
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      The false-positive control. A session that only caused `__pycache__`
      entries to appear inside the layout reports clean. Without this the check
      fires on every run and is turned off.
test_rationale: |
  Sharing is only safe if read-only is enforced rather than assumed, and the
  premise is an assumption about code nobody has audited test-by-test. The cost
  of an unnoticed violation is the worst kind: a layout silently wrong for
  every test that runs after the offender, presenting as intermittent unrelated
  failures elsewhere.

  Three descriptors are negative controls and each names its injection. The
  one-directional-walk injection is the likely implementation shape and hides
  added files. The mtime-versus-digest injection is the likely shortcut and
  hides rewrites — a deploy writes its whole tree in under a second, so mtimes
  are useless here. The empty-layout injection reproduces this repository's own
  AC-store validator, which globbed zero files and exited 0 for eight days.

  The bytecode descriptor is a false-POSITIVE control rather than a negative
  one, and it is not optional: importing from the deployed tree generates
  `__pycache__` as a side effect of reading it, so an unfiltered comparison
  reports a difference on every clean run and gets disabled.
