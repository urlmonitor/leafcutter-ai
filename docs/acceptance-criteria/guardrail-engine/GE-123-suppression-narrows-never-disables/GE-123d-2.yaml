notes: |
  THE ASYMMETRY, STATED AS THE PRODUCT-OWNER REQUIRED — as a positive rule about
  where the exemption applies, so a new location cannot silently inherit it.
  The exemption is granted only by the conjunction of THREE closed lists:
    LOCATION  — the ticket tree, the retrospectives area, the acceptance-criteria
                store, the skill-prompt area, the changelog area.
    KIND      — .md, .yaml, .yml, .txt.
    VALUE     — whitespace-bearing, bracketed placeholder, masking characters,
                project identifier (plus the file-reference shape from
                GE-123d-1, which needs no location).
  Anything not on all three lists is reported. Adding an entry to any list is a
  deliberate edit, never an inference from resemblance.

  TWO DELIBERATE DEPARTURES FROM THE EXISTING HIGH-ENTROPY EXEMPTION, both of
  which are the point of this AC rather than incidental:
  1. The changelog area is ADDED. It is not on the high-entropy list today, and
     one of the three observed blocks was a changelog migration step. Adding it
     is a decision recorded here, not an oversight corrected silently.
  2. The exemption is PER FINDING, never per file. The high-entropy exemption
     is file-level for the same locations: any line of a ticket file is exempt
     from it outright. Copying that shape for the generic-credential rule would
     be precisely the careless widening the product-owner warned against, and
     GE-123d-3 exists to prove it was not copied.

  A KIND LIST PER AREA WAS CONSIDERED AND REJECTED — record the reasoning so it
  is not silently revisited. Restricting the acceptance-criteria store to .yaml,
  and tickets, retrospectives, changelogs and skill prompts to .md, is tighter
  than one shared kind list. It was rejected as over-fitting: it encodes today's
  file layout into a security rule, so an ordinary layout change (a ticket
  written as .txt, a changelog with a .yaml sidecar) silently reinstates the
  false positives this AC exists to remove. The sharp case the per-area list was
  meant to catch — an executable script inside a prose area — is caught by the
  shared kind list on its own, and GE-123d-4-i proves it.

  WHY NOT THE OTHER CANDIDATE DIRECTIONS, briefly, since the product-owner asked
  for the choice to be stated rather than assumed:
    - Distinguishing a quoted example from an assignment was rejected: in a YAML
      or Markdown document the two are the same characters, so the distinction
      cannot be drawn from the text at all.
    - Treating a Markdown code fence or an inline-code span as exempt was
      rejected as inverted: a fence is exactly where a real pasted credential
      lands, so it is the LAST place to relax the rule.
    - Requiring the value to "look like a real secret" was rejected as the wrong
      polarity. It is a negative test, so any value the test fails to recognise
      passes; the closed positive list used here fails the other way, which is
      the safe way.

  VERIFICATION STANDARD (inherited from the L0): exercise this through the
  pre-commit secrets check against real staged files in each of the five areas,
  not by calling the exemption predicate directly. Coverage of the predicate in
  isolation does not discharge this AC.

  IT-PO OBSERVATION, 2026-08-18, recorded because it bears directly on the
  first closed list and was not visible from the criteria: the prose-prefix
  test the existing high-entropy exemption uses accepts each prefix wherever it
  occurs in the path, not only at the repository root. A directory named for a
  prose area, nested anywhere in the tree, therefore inherits that exemption
  today. The rejected alternatives recorded above rule out shapes that would
  weaken the value list; this is the equivalent hazard on the LOCATION list, and
  it is captured as an it_requirement rather than a criteria change. It is a
  property of the existing matcher, adjacent to KI-CG-004 but not the same
  defect, and repairing the existing high-entropy exemption is out of scope here.
