notes: |
  Gap G1 (success path). finalize-feature is NOT the cleanup point (BO-4400 key framing
  decision); finalize may still clear, but no route in the list may rely on it.

  TIMING AMENDED (user decision D2, 2026-11-16): a route clears its own workspace only after
  its pull request has merged, by the landed rule of BO-4400g-2; with the pull request still
  open at the route's end the workspace is kept, reported as not yet on the main line, and the
  landed-work pass (BO-4400g-2) clears it after the merge. This replaces the 2026-10-09
  "at the latest right after the pull request is opened" reading for this record. The product
  owner amended the parent BO-4400a and the L0 BO-4400 to the same timing the same day.

  NOTHING TO DELIVER (user decision Q2, 2026-11-16): a route that ends with no commit of its
  own clears its workspace at once, as BO-4400a-1-i states; the seven-day idle threshold of
  BO-4400g-2, like the fourteen-day one for pushed but unmerged work (BO-4400g-2-v, user
  decision 2026-11-16), guards only the unattended pass. A route whose pull request is never
  merged keeps its workspace until that pass clears it after 14 days idle. Neither scenario here contradicts this, so the
  criteria are unchanged; the VERDICT it_requirement carries the rule.

  VERDICT WORDING CONFLICT (resolved by D2, 2026-11-16): this record no longer relies on a
  pushed, unmerged line reading as holding nothing, so the BO-4100c-1 wording amendment it
  asked for is no longer a prerequisite here.

  Proof must drive each route to its end state and inspect the disk afterwards (repo
  CLAUDE.md: gate/workflow ACs are verified by running them, never by grep).

  Named wrong versions this must catch: (1) a route that never calls the door (folder
  remains); (2) a route that removes the folder by its own means (result lacks the door's
  answer); (3) clearing placed before the push (door refuses, folder remains, or the PR is
  missing commits).
