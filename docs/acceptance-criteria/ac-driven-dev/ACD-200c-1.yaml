  And the valid values are: [how-to, sequence-diagram, state-diagram,
    component-diagram, reference-doc],
  And the instruction states: "Set documentation_triggers based on what a user
    or operator would need to understand and use this feature. If the feature
    is purely internal with no observable flow changes, set to [] with a
    documentation_rationale explaining why.",
  And the instruction gives examples:
    - New slash command -> [how-to, sequence-diagram]
    - New state field -> [state-diagram]
    - New internal script with no user interaction -> [] with rationale.
