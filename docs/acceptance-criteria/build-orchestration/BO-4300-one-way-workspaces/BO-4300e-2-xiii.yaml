notes: |
  User request 2026-11-04 (decision "Ticket a maker fix"): the maker's remove should be able
  to clear a record-less leftover folder whose repository leftover holds no shared-project
  address, when every file remaining in it matches a merged line of work on the shared
  project. Any changed or new file, or no matching merged line, keeps today's NOT_FOUND
  answer and leaves the folder untouched. Nothing outside this project's landing place is
  ever deleted.

  RULE HISTORY -- this record NARROWS the 2026-10-29 user decision a SECOND time and
  REVERSES a scope exclusion at the user's request. 2026-10-29: a record-less folder holding
  files is NOT_FOUND, because it cannot be told to be this project's. 2026-11-02
  (BO-4300e-2-xii): first narrowing, for a leftover whose repository file names this
  project's shared project (token required); at that time "content-matching leftover files
  is out" of scope. This record brings content matching in, as the user asked on
  2026-11-04. Content that is already on this project's main line is the evidence: clearing
  such a folder cannot lose anything that is not already on the shared project. Every other
  record-less folder holding files keeps the 2026-10-29 rule unchanged (runs three to five
  pin that).

  Observed case: leafcutter-ai-worktrees/ac/maker-remove-hardening has no workspace record.
  Its repository folder holds only an empty FETCH_HEAD, so BO-4300e-2-xii cannot identify it
  (no address at all). 15385 files were deleted; the remaining tracked files are 0 changed
  and 0 new compared with the last commit of the line ac/maker-remove-hardening as merged in
  PR #1372 (commit 1e0f5881b, reachable from origin/main through the merge). Verified
  read-only by the caller with a temporary git index (read-tree of that commit; update-index
  --refresh against the folder; diff-files; ls-files -o --exclude-standard). A further
  read-only check on 2026-11-05 found the folder holds 5 ignored items, all install build
  outputs (.build_manifest.json, .leafcutter.lock, .leafcutter/, .pre-commit-config.yaml,
  VERSION), and no secrets file. So the real folder goes through the token path of the
  second run: the refusal lists those items, and asking again with its token clears it.
  The folder's position (kind ac, slug maker-remove-hardening) corresponds to the line
  ac/maker-remove-hardening. After this ships, the real folder is finished that way
  (operational check, not a CI test).

  Decisions (user, 2026-11-05)
  - D1 (was Q1, final gate) -- no token for a folder holding only tracked, matching files:
    it is answered cleared at once (first run). Reason: nothing is lost; every remaining
    byte is already on the shared project's main line.
  - D2 (was Q2) -- the merged commit is found locally only, from two sources in order:
    (1) the main checkout's own copy of the shared project's line "<kind>/<slug>", used only
    if its last commit is part of the main line; otherwise (2) a merge commit on the main
    line, as the main checkout last fetched it, whose message names the line (as in "Merge
    pull request #1372 from <owner>/ac/maker-remove-hardening"): its merged-in parent is the
    commit matched. A line that was squash-merged or rebased in has no such commit, so its
    leftover stays NOT_FOUND. The shared project is never asked (the "unreachable" in the
    When clause pins it). A wrong guess can only produce a non-match, never a deletion.
  - D3 (was Q3) -- files the ignore rules exclude are listed, and the folder is cleared only
    with a one-time token for exactly those files, using the BO-4300e-2-vi flow (half-cleared
    refusal, token bound to the folder and exactly the listed files with their content;
    finishing with it deletes the whole folder). The refusal names the matched line and
    commit (second run). A token from that run never clears a folder in which a tracked file
    changed (third run): such a folder is NOT_FOUND whatever token is presented. A
    non-ignored file that the matched commit lacks (fourth run) is "new" and keeps NOT_FOUND;
    it is never offered a token.
  - D4 (was Q4) -- a file matches when it equals what a fresh checkout of the matched commit,
    made with this project's main-checkout settings, would write; line-ending conversion and
    the other checkout conversions are not a difference. The ignore rules applied are the
    ones such a checkout would apply.
  - D5 (was Q5) -- scope stays as the user first asked: only a record-less folder whose
    repository leftover is present and names no shared project is covered. A record-less
    folder with no repository folder at all keeps NOT_FOUND; BO-4300e-2-xii's third run is
    unchanged.

  Constraints carried over from BO-4300e-2-xii (for the IT PO):
  - No network call: the shared project is never contacted to identify or match a folder.
  - Git is never run inside the folder; its files are read as plain bytes. Matching uses
    only what the main checkout already holds (D2).
  - Every refusal leaves the folder byte-identical.
  - The BO-4300e-2-iii project boundary: only a folder at a workspace position (kind/slug)
    inside this project's own landing place qualifies; the sixth run pins that.
  - The NOT_FOUND answer and message for a non-matching folder stay exactly as today; this
    record adds no new hint to it.
  - A leftover that BO-4300e-2-xii identifies (repository file names this project's shared
    project) stays under -xii's rule; a leftover whose repository file names ANY other
    shared project (or mixed addresses) is never matched by content and stays NOT_FOUND
    (contradicting evidence beats matching content).
  - The match is made again on every request, the token request included.

  BA assumptions (settled here, not asked):
  - "Merged" means the matched commit is part of the main line's history as the main
    checkout last fetched it. A line whose commits are not on the main line (fifth run)
    never matches, even if its content is identical.
  - Only the files that remain are compared; files of the matched commit that are missing
    from the folder are no loss. Empty sub-folders hold nothing.
  - The whole folder is matched against ONE commit: every remaining tracked file must match
    that same commit; files are never matched against different commits. If the line was
    merged more than once, matching any one of its merged last commits in full suffices.
  - The line of work a folder corresponds to is the canonical "<kind>/<slug>" of its
    position; declared legacy spellings of the line name are not searched.
  - A main checkout whose copy of the main line is older than the merge cannot see it: the
    folder then stays NOT_FOUND (safe outcome); fetching the main checkout first and asking
    again is the remedy, done by the person, not by the maker.
  - A folder that holds both a changed tracked file and an ignored file is NOT_FOUND (the
    change decides); the token path is reached only when every tracked file matches.
  - How ignored items inside an ignored folder (for example ".leafcutter/") are listed
    follows the existing half-cleared listing of BO-4300e-2-vi; this record does not change it.
