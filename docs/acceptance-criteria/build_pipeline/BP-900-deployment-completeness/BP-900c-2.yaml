notes: |
  PARTIAL COVERAGE (ac-audit, 2026-08-17). test_guard_exits_1_on_broken_ref
  asserts the stderr JSONL and the non-zero exit, and a fresh-process behavioral
  probe confirmed the real guard emits rc=1, empty stdout, and one JSON object
  per line with exactly the three required keys. But no test asserts the AC's
  "stdout contains no error output" clause or the exact three-key set: the test
  patches sys.stderr only and never inspects stdout, and no test in the repo
  uses capsys or redirect_stdout against this guard. The AC would stay green if
  the guard began duplicating its report to stdout.

  Known schema inconsistency, not an AC violation and currently untested:
  emit_broken_ref_report_jsonl serialises referencing_template as a bare string
  for a single template but as a list for several, so downstream parsers see a
  heterogeneous type.
