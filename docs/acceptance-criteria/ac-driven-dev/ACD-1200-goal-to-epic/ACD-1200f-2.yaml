criteria: |
  Given the AC store contains this tree:
    - ROOT-001 (level: L0, covered_by: [ROOT-001a])
    - ROOT-001a (level: L1, covered_by: [ROOT-001a-1, ROOT-001a-2])
      - ROOT-001a-1 (level: L2, covered_by: [])
      - ROOT-001a-2 (level: L2, covered_by: [ROOT-001a-2-i])
        - ROOT-001a-2-i (level: L3, covered_by: [])
  When traverse_ac_tree is called with root_id=ROOT-001,
  Then the result includes ROOT-001a-1 (L2 with no children),
  And the result includes ROOT-001a-2 (L2 WITH children — still a leaf by level),
  And the result includes ROOT-001a-2-i (L3 child — also a leaf by level),
  And the result does NOT include ROOT-001 (L0 — composite pass-through),
  And the result does NOT include ROOT-001a (L1 — composite pass-through),
  And the total leaf count is 3 (ROOT-001a-1, ROOT-001a-2, ROOT-001a-2-i).

  The leaf signal must be level in {L2, L3}, not covered_by == [].
  L0/L1 nodes are always composite pass-throughs regardless of covered_by.
  L2/L3 nodes are always emitted as leaves AND their children are recursed
  into (so L3 edge-case ACs beneath an L2 are also collected).
