it_requirements:
  - docs/how-to/prove-ac-done.md is 248 lines against check-doc-length's 300-line limit, and
    crossing it is refused. Two worked examples, the choice between methods and a refusal
    table will not fit, so the material goes in a new how-to page linked from prove-ac-done.md's
    test-free section. The new page carries the frontmatter check-doc-frontmatter requires
    and is registered in docs/INDEX.md in the same change.
  - Link to the TQ-400e-6 entry for the honour, refuse and eligibility rules; do not restate
    them.
  - Refusal messages are quoted verbatim from the delivered code (BO-2500f-4 and its parts);
    write after BO-2500f-4 lands.
  - The worked examples are complete verified_by blocks a reader can paste, using the field
    names BO-2500f-1 fixes (method, check, wired_as; method, gate_run, statement, inspected[path,
    blob]).
  - 'Describe the inspection approval as it is built: the person runs /inspect <AC-ID> (BO-2500f-3-ii),
    sees each path with its fingerprint, and answers approve; the workflow writes docs/acceptance-criteria/_inspections/<run_id>.json
    and fills gate_run and the blobs into the record; the person commits both together; marking
    done reads the committed approval file, so it works the same on every machine and in CI.
    Explain that an approval file left untracked is treated as missing.'
test_required: false
test_rationale: 'This guide is a set of steps a person follows; it is right when following
  it produces a record the done gate accepts, and that gate''s behaviour is proven by the
  tests of BO-2500f-4 and its children. What verifies the page: at pull-request review the
  two worked verified_by examples are pasted into a scratch record and run through check_done_proof.py
  --mode precommit (the inspection example with the approval file a real /inspect approve
  answer produced, committed in a scratch branch), the refusal table is compared line by line
  with the messages the delivered code prints, and check-doc-links proves the link to the
  TQ-400e-6 entry resolves.'
