change_target: code
risk_surface: contract_boundary
notes: |
  WHY THIS IS THE MOST DANGEROUS EDGE OF THE RUNS. A wrong version that breaks
  loading makes EVERY test fail — it looks like a perfect catch. That is the red
  baseline's own defect (absence red passed off as discrimination, TQ-500f-3)
  reproduced one step later, and the natural preparation slip (an agent's edit
  with a syntax or import error) produces it. A no-op wrong version is the
  opposite trap: every test "survives" and the work is stopped for the wrong
  reason, which trains people to switch the check off.

  V1 IS THE CONTROL. A rule that refuses every failing run would pass V2 and
  break V1.

  TECHNICAL DETAIL FOR IT-PO: "did not load" covers a collection-time import or
  syntax error of the altered module as well as a function-level
  ImportError/AttributeError (the COLLECTION-ERROR CAVEAT in TQ-500f-3-i's
  notes). "Changes nothing" is a byte comparison of the prepared file with the
  code as written. Reuse done_proof_kind_support / _kind_plugin; do not copy the
  classification.

  IT-PO ENRICHMENT (2026-09-28)
  Fast lane with TQ-500g-1-i, or right after it.
