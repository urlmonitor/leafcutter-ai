notes: |
  THREE NAMESPACES HERE, THE FOURTH IN GE-122a-2. This criterion covers the collision shape —
  two unrelated artifacts claiming one number — which is possible for acceptance-criterion
  identifiers, decision numbers and diagram sequence numbers. It is NOT possible for work-item
  identifiers, whose identifier is the filename: two different work items cannot share a
  filename in one folder. The work-item namespace's only observed shape is one item held in two
  lifecycle folders, which is GE-122a-2. Together the two L2s discharge the L1's four-namespace
  scope; neither alone does.

  ONE FINDING PER CONTESTED NUMBER, NOT PER FILE, is a deliberate discrimination and is what
  makes the output usable: a per-file report tells the author their file is a duplicate without
  telling them of what.

  THE PER-NAMESPACE INSPECTED COUNT on the passing path is inherited from GE-119 ("a check that
  cannot run says so"). Without it, a pass that inspected zero artifacts is indistinguishable
  from a pass that inspected the whole collection — which is the exact defect GE-122d-3 forbids.

  MOTIVE DIFFERS BY NAMESPACE (carry this through, per the L1 note): the acceptance-criterion
  namespace is being REPAIRED (one live collision, GE-119). The decision-number namespace is
  measured CLEAN — 33 records, contiguous 1..33, no duplicates, no gaps — so guarding it LOCKS
  IN a good state. Do not write the decision namespace up as though a defect existed.

  IT PO NOTE (2026-08-17) — the registration trap, stated once here and carried in
  it_requirements. `.pre-commit-config.yaml` is generated: build_precommit.py strips every
  block tagged `@package-managed` and re-emits it from `hooks_manifest.hooks` in
  `templates/scripts/commit_guardian/commit_guardian.json`. A hook registered only in
  `.pre-commit-config.yaml` therefore passes locally and disappears in CI, where the
  `AC store valid` job runs build.py before invoking any hook. That failure is silent in both
  directions and is the exact shape of the defect this tree exists to close.
