criteria: |
  When the numbers do not reconcile, the answer halts rather than passing.

  If what was covered does not add up to what was in scope, and the difference is
  not accounted for by a declared exclusion, the result is withheld and the
  shortfall is reported — so an incomplete answer can never be handed on as though
  it were a complete one.
