title: "Symlink shims are created with targets relative to the link's own location"
origin_agent: BrainCandy
created: 2026-08-14
assigned_agent: python-coder
criteria: |
  Given install_shims() bridges canonical tool paths into the consolidated
    output root (ADR-004 / ADR-016) — the directory shims .claude/agents,
    .claude/skills, .claude/commands, .claude/hooks, .claude/workflows,
    .gemini, scripts/commit_guardian, scripts/doc_compliance and
    scripts/feedback, plus the single-file shims .pre-commit-config.yaml and
    .claude/settings.json,
  And the output root sits at <target_root>/.leafcutter,
  When a build creates those shims as symlinks (shim_strategy "symlink", or
    "auto" where link creation succeeds),
  Then reading each link back returns a relative path — it does not begin at a
    filesystem root and contains no directory name belonging to the machine the
    build ran on,
  And the relative path is expressed from the directory containing the link,
    not from the directory the build process was invoked in, so a link nested
    one level deep carries one leading parent step and a link at the project
    root carries none: .claude/agents reads back as "../.leafcutter/agents",
    scripts/commit_guardian reads back as
    "../.leafcutter/scripts/commit_guardian", .gemini reads back as
    ".leafcutter/gemini", and .pre-commit-config.yaml reads back as
    ".leafcutter/pre-commit-config.yaml",
  And every link resolves to exactly the same file or directory inside the
    output root as it did when the target was absolute — the destination is
    unchanged and only the way the link records it differs,
  And after the entire project tree (both the links and the output root they
    point into) is moved or copied to a different absolute path, each link
    still resolves to its counterpart inside the relocated output root, with no
    link left dangling,
  And re-running the build over a shim that is already relative leaves the
    recorded target unchanged, character for character,
  And re-running the build over a shim left absolute by an earlier build
    replaces the recorded target with the relative form, so no absolute shim
    survives a rebuild,
  And when the canonical location and the output root have no common ancestor
    on the filesystem, so no relative path between them can be expressed, the
    link is created with an absolute target instead and the build still
    completes,
  And when a shim is produced by the copy strategy — requested explicitly via
    shim_strategy "copy", or entered as the automatic fallback after the
    platform refuses link creation — it remains a copied file or directory
    exactly as before: a copy records no target, so this criterion imposes
    nothing on the copy path and must not be read as a reason to change it.
