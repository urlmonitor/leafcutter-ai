id: UXP-544a
components:
  - ux_prototyping
title: "An unparseable or inconsistent classifier result skips the product-truth phase but still runs the AC pipeline"
component: ux-prototyping
level: L3
status: active
readiness: approved
priority: medium
req_status: approved
work_status: done
criteria: |
  Given the product-truth phase has dispatched pt-classifier,
  When the classifier returns unparseable output, omits its outcome, returns an
  unknown outcome enum, or its advisory dispatch array disagrees with its outcome,
  Then the product-truth phase is skipped (no artifact agents are dispatched),
  And the workflow trusts the outcome over the dispatch array when they disagree,
  And the AC pipeline still proceeds to completion.
depends_on:
  - UXP-544
doc_links:
