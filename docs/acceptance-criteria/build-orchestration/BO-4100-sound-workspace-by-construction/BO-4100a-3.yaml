id: BO-4100a-3
title: "When the shared line cannot be read, creation refuses instead of falling back to the old copy"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given the shared main line cannot be read -- it is unreachable, or the attempt
    to read it fails,
  And the machine holds a local copy of the main line that is 39 commits behind,
  When a workspace is requested,
  Then creation refuses and reports failure,
  And no branch is created and no workspace is registered,
  And the refusal states that the shared main line could not be read,
  And the machine's local main-line copy is not used as a substitute starting
    point.
