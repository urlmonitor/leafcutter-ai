id: TQ-500a-1-i
components:
  - testing_quality
  - build_orchestration
title: "The declared kind is honoured, and the requirement's wording is not an input"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given two pieces of work whose requirement text is word-for-word identical —
      each asking that some new input change no outcome, neither naming a failing
      case — where the writer declared the ordinary before-and-after evidence for
      the first and the substitute evidence for the second,
  When the two hand-off records are read,
  Then each piece of work is read as the kind its own record declares, and neither
    is reassigned to the other kind,
    And repeating the reading with the requirement text of both replaced by
      unrelated text produces the same two results, because the requirement text
      is not an input to the reading,
    And the piece of work declaring the substitute evidence is not reported as a
      shortfall on the grounds that its requirement carries none of the wording
      associated with this family of work,
    And the piece of work declaring the ordinary evidence is not reported as a
      shortfall on the grounds that its requirement does carry that wording,
    And these results are established from the hand-off records the run actually
      produced; a run in which the writing side was instructed to declare a kind
      but emitted no record leaves that piece of work with no declared kind rather
      than with an inferred one.
depends_on:
  - TQ-500a-1
doc_links:
  - path: docs/known-issues/testing-quality.md
    relationship: describes
    status: exists
    relevance: >-
      KI-TQ-010 Fix direction: "Do not try to detect the class automatically from
      the AC text — n_location_rule: 0, an absence-shaped Then clause, and the word
