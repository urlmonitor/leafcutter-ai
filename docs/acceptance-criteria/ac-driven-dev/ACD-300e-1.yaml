criteria: |
  Given the agent template files for product-owner-v3, business-analyst-v3,
    and it-po-v3 each contain a YAML frontmatter block with a skills_used list,
  When the template is loaded by the Claude Code harness at agent spawn time,
  Then the skills_used list includes "knowledge-query" as an entry,
  And any pre-existing entries in skills_used (such as "ac-tree-split") are preserved,
  And the frontmatter remains valid YAML that the harness parses without error,
  And the skill reference resolves to templates/skills/knowledge-query/SKILL.md
    via the standard skill lookup path.
