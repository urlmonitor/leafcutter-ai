    on the old line (another re-run AC may have moved a file first).
  - >-
    CHANGELOG: one entry for TQ-200d-4-v written with scripts/changelog/emit_entry.py (type manual, components [testing_quality])
    into changelogs/, in the same change as the code, naming the template sentence 'The database tests were not
    run.' and the resolved known issue KI-TQ-20261102-test-runner-not-configured-block-has-no-not-run-sentence.
  - >-
    GLOSSARY: any new term in the docs this AC writes reaches docs/glossary.md only through the check-glossary-coverage
