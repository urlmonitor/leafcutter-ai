roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a staged decision record for run run-f0f15b38791a428f and the publish instruction that run
    gave,
  When you decide to publish,
  Then you run python -m kernel decisions publish --run-id run-f0f15b38791a428f yourself, or Claude
    Code runs exactly that command at your request and opens a PR,
  And until you make that request, neither the kernel nor the /leafcutter skill runs the publish
    command.
