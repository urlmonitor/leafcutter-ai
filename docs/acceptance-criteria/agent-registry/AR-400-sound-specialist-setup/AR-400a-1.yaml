id: AR-400a-1
title: "An instruction to use an ability that exists nowhere stops the build, naming the specialist, the ability and the line"
component: agent-registry
components:
  - agent_registry
  - skills_system
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a package tree in which the definition of a test specialist named
    "probe-agent" grants it nothing, and its instructions contain, on line 40,
    the sentence "Load `.claude/skills/ghost-ability/SKILL.md` and follow it",
    And no ability named "ghost-ability" is shipped by the package, and the
    grant does not mark it as supplied by the project,
  When the build runs over that tree,
  Then the build stops with a failing result before anything is deployed,
    And the failure names the specialist "probe-agent", the ability
      "ghost-ability", the file holding the instruction and line 40,
    And it classifies the fault as "ability does not exist" -- distinct from
      "ability exists but is not granted" (AR-400b-1) -- so the reader knows
      which side to fix,
    And the run states how many specialist definitions and shared guides were
      examined, and that count equals the number present in the tree,
    And when "ghost-ability" is then added to the package and granted to
      "probe-agent", the same build passes with no finding about it.
depends_on:
  - AR-400a
