id: GE-132a-5
components:
  - commit_guardian
  - precommit_hooks
title: "In a project that vendors the package, the commit-time remedy-declaration leg says it does not apply instead of could-not-check, while the package checkout still fails closed"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a consumer project that vendors the package in a subdirectory (leafcutter/),
    whose check-hook-parity configuration names the vendored copy
    leafcutter/templates/scripts/commit_guardian/commit_guardian.json as its
    canonical manifest,
  And the project tracks no templates/scripts/commit_guardian/commit_guardian.json
    and no templates/scripts/precommit-autofix.json of its own,
  When check-hook-parity runs for a commit that touches scripts/commit_guardian/,
  Then the remedy-declaration leg prints that it is not applicable, naming the
    canonical manifest and the package manifest path it looked for,
  And the hook does not report could_not_check and exits 0 when the other legs hold,
  And the bug symptom ("committed package declaration table
    templates/scripts/precommit-autofix.json is missing", RESULT: could_not_check,
    exit 2) must not occur.

  Given the same consumer project with a script missing from its deployed
    .leafcutter/scripts/commit_guardian/ copy,
  When check-hook-parity runs,
  Then it still refuses (exit 1), naming the missing script: the parity legs that
    apply to a consumer keep running.

  Given the package checkout itself (templates/scripts/commit_guardian/commit_guardian.json
    exists under the project root),
  When templates/scripts/precommit-autofix.json is absent, or present but not valid JSON,
  Then check-hook-parity reports could_not_check and exits 2, never a pass and never
    "not applicable".
