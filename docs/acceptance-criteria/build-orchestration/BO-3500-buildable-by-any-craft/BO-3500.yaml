criteria: |
  Point at any requirement, not only the code ones, and it gets built.

  Pointing at a single requirement and getting finished, delivered work back is
  only worth having if it works for the work you actually have. Today it works
  for one kind: writing code and the tests that prove it. Everything else a
  requirement can ask for — a page of documentation, a diagram, a screen, a
  prompt, a piece of configuration — is turned away, and because requirements
  are built in connected groups rather than one at a time, a single such member
  turns an entire area of the backlog away with it. This goal closes that gap:
  the range of work the automation can produce grows to match the range of work
  the backlog actually contains, so the honest refusal stays available for
  genuine edge cases instead of being the everyday answer. Refusing well is
  already handled (BO-2400f-12); this is about needing to refuse far less often.
