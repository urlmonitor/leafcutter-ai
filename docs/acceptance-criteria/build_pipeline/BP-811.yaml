title: "Workflow .js scripts are reachable via the .claude/workflows shim in a consumer install"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: done
criteria: |
  Given a consumer build runs with workflows enabled (config.workflows.enabled = true)
    and a supported Claude Code version,
  When build_workflow_scripts() deploys the workflow .js files and install_shims() runs,
  Then the .claude/workflows shim resolves to the directory that actually contains the
    deployed workflow .js files (e.g. plan-feature.js is reachable through
    target_root/.claude/workflows/)
  And the build does NOT log "shim source missing: workflows/ — Skipping .claude/workflows shim"
  And the symptom (workflow .js files deployed to .leafcutter/.claude/workflows/ but orphaned
    with no shim pointing at them) must not occur
