assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "A new pre-commit guard scans staged .js files under scripts/workflows/ and templates/workflows-js/ only."
  - "The guard flags a git commit instruction string that co-occurs (same step / nearby lines) with an agentType set to any value other than 'commit'; status-checker is the canonical bad case."
  - "The guard must exit non-zero (blocking) on a match and name the file and the offending pairing; it must pass when agentType is 'commit' or when COMMIT_AGENT_MODE=1 is used."
  - "Follow the project error-handling policy: wrap file I/O in typed try/except and fail-open with a warning on unexpected internal errors so a guard bug never hard-blocks an unrelated commit."
delivers_to:
  agent: pr-reviewer
  contract: "A staged-file guard whose pass/fail result the pr-reviewer can rely on for the commit-delegation check"
