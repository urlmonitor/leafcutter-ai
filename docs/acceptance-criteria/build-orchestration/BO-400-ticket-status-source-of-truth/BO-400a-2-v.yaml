id: BO-400a-2-v
components:
  - build_orchestration
title: "A phase the ticket marks failed, or that this drive skipped, keeps the ticket from being recorded done even when the record carries an ok entry for it"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  BO-400a-2-iii says a ticket with a needed phase that was dispatched and reported
  a blocker is never recorded done. It holds when the blocker is the only entry
  the phase ever wrote. It does not hold when the record also carries an ok entry
  for that phase: an older ok from an earlier drive, a new blocker entry written
  above an older ok so that the ok is last in file order, or an ok the phase agent
  wrote before the action it reports on had happened. The completion decision
  takes the last entry in file order and reads it as the phase's verdict, so
  the failure the drive itself observed is overruled by stale or premature
  evidence, and the ticket is recorded done.

  Scenario: A phase the ticket's frontmatter marks failed is outstanding
    Given a ticket whose `agents:` map marks the ac-fulfillment-gate phase `failed`,
    And whose record carries an ok sign-off entry for that phase written by an
      earlier drive, placed last in file order,
    When the drive takes the ticket's completion decision,
    Then the ticket is not recorded done and its lifecycle state is left as found,
    And the drive reports the ticket as not completed, naming that phase and
      stating that the ticket's own frontmatter marks it failed,
    Because the frontmatter is the record's current statement about the phase, and
      an ok entry that disagrees with it is evidence of an earlier moment.

  Scenario: A phase this drive skipped after a cross_agent blocker is outstanding
    Given a drive in which the commit phase returned a blocker that the failure
      classifier classed as cross_agent, so the drive skipped the phase,
    And the ticket's record carries an ok sign-off entry for the commit phase that
      the commit agent wrote before its commit was refused by a pre-commit hook,
    When the drive takes the ticket's completion decision,
    Then the ticket is not recorded done,
    And the drive reports the ticket as not completed, naming the commit phase and
      stating that this drive skipped it after a cross_agent blocker,
    Because a phase the drive itself chose not to finish cannot be finished by an
      entry the drive has every reason to distrust.

  Scenario: The same holds for any skipped phase, not only commit
    Given a drive that skipped ac-fulfillment-gate after a cross_agent blocker,
    And an older ok entry for that phase in the record,
    When the drive takes the completion decision,
    Then the ticket is not recorded done.

  Scenario: A genuine completion is still recorded done
    Given a ticket whose `agents:` map marks every required phase `signed_off` or
      `not_needed`,
    And whose record carries a passing sign-off entry for every required phase,
    And for which this drive skipped no phase,
    When the drive takes the completion decision,
    Then the ticket is recorded done,
    Because the cheapest way to satisfy every refusal above is to stop writing done
      records at all, and BO-400a-2-ii exists to prevent that.

  Scenario: Both drivers decide identically
    Given each of the scenarios above,
    When it is run against the epic driver and against the single-ticket driver,
    Then both reach the same decision.
