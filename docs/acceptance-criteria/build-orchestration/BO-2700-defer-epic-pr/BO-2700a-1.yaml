title: "selectDispatchPhases removes the pull-request phase when isEpicMember is true"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the pure helper selectDispatchPhases(orderedPhases, isEpicMember) exported
    from templates/workflows-js/build-feature.js,
  And orderedPhases is the list of per-ticket phase objects
    [{agent: "test-writer"}, {agent: "python-coder"}, {agent: "commit"}, {agent: "pull-request"}],
  When selectDispatchPhases(orderedPhases, true) is executed,
  Then the returned list contains no phase whose agent equals "pull-request",
  And the returned list has exactly one fewer element than orderedPhases (the
    pull-request phase is the only phase removed).
notes: |
  Testability: build-feature.js is a Workflow-engine script that uses injected
  globals (agent()/parallel()) and is not importable as a plain module, so the
  per-ticket driver itself cannot be executed in a unit test. The filtering
  decision, however, is extracted into the PURE helper selectDispatchPhases,
  which takes plain data (orderedPhases, isEpicMember) and returns plain data.
  This AC is behavioral, not grep-only: a test EXECUTES selectDispatchPhases
  (e.g. via `node`) with the concrete orderedPhases above and asserts the
  returned list. The pre-commit hooks that run during the commit phase are the
  reason pull-request — not commit — is the phase deferred for epic members.
