id: GE-129a-5
title: "A component diagram shows that caller identity enters the commit guard only from the harness, and the three decisions it reaches"
component: guardrail-engine
components:
  - commit_guardian
  - documentation_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the identity rule of GE-129a-2 and GE-129a-3, the parity check of GE-129a-4, and the probe
    findings of GE-129a-1,
  When a reader opens the commit guard's component diagram,
  Then the diagram shows the harness as the only source of caller identity entering the guard,
    labelled with the two identity values the guard reads,
    And it shows the guard's three outcomes for a commit: the commit specialist goes ahead; the
    top-level session is put to the person's permission prompt or refused where no person is
    reached; any other or unidentifiable caller is refused,
    And it shows command text, environment, files in the repository, working directory and
    dispatch prompt outside the decision, each marked as not feeding it,
    And it shows the parity check comparing the installed commit specialist definition with the
    shipped one and with same-named definitions at other scopes,
    And every guard, check and agent named in the diagram exists in the shipped package under the
    name the diagram uses.
