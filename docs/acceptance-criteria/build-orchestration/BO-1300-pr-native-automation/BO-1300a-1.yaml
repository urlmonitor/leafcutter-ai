id: BO-1300a-1
readiness: approved
priority: high
title: "Automated work is committed onto a non-main branch, never onto main directly"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-pr-native-automation/BO-1300a.yaml"
criteria: |
  Given the automation pipeline begins a unit of work on a repository whose default branch is "main"
  When the commit phase of the automation creates the commit(s) for that unit of work
  Then every commit is written onto a working branch whose name is not "main"
  And the branch is one the automation created or checked out for this unit of work (for example an epic or feature branch)
  And no commit for this unit of work is written with "main" as the checked-out branch
depends_on: [BO-1300a]
