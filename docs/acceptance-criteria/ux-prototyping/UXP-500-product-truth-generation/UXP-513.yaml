id: UXP-513
title: "Generator is idempotent and offers --check for CI"
component: ux-prototyping
level: L2
status: active
req_status: approved
work_status: done
criteria: |
  Given the product-truth store,
  When generate_product_truth.py runs a second time with no source change,
  Then it writes nothing (the derived data is byte-stable across runs),
  And running with --check computes everything, writes nothing, and exits non-zero if and
  only if any derived file would change,
  So CI and pre-commit can gate on stale derived data.
depends_on:
  - UXP-590
