notes: |
  SUPERSEDED 2026-09-08 by IT PO v3, stage 3 of PO -> BA -> IT-PO. Split into
  ACD-400e-1a (documentation-expert — the written account and the shape that
  makes it machine-readable) and ACD-400e-1b (python-coder — the checker that
  builds a store from each statement and asks the queue). The criteria below are
  UNCHANGED and are reproduced verbatim across the two successors: 1a holds the
  Given plus the first Then, 1b holds the Given plus the When, second Then and
  closing And. Their union is this text.

  WHY: two deliverables in two file types owned by two agents (a Markdown
  reference page and a Python verification harness), plus a circular dependency
  — this AC's closing clause requires a disagreement REPORT that nothing builds
  until ACD-400e-3, which itself depends on this AC completing. The split
  removes both. Full reasoning is in ACD-400e-1a's notes.

  --- ORIGINAL BA NOTES, RETAINED ---

  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Decomposes ACD-400e.

  THIS AC DISCHARGES ACD-400e'S reference-doc DOCUMENTATION TRIGGER. ACD-400e declares
  documentation_triggers: [reference-doc]; this is that deliverable. No separate
  documentation AC is authored, because a second record describing the same page would
  recreate the divergence this tree exists to end — which is the same reasoning ACD-400c
  and ACD-400d give in their own documentation_rationale. The agent that reads naturally
  here is documentation-expert; assignment is the IT PO's to set.

  HOW THIS AVOIDS BEING A DOC NOBODY READS — the anti-vacuity constraint in ACD-400e's
  notes, taken literally. The criteria do not ask whether the account exists, whether it
  mentions the fields, or whether particular words appear on the page. They ask whether a
  store built from what the account SAYS produces the answer the account PREDICTS. That
  construction has three properties worth stating because each kills a different cheap
  pass: prose that is present but wrong fails; prose that is absent fails for want of a
  statement to build a store from; and prose that is correct today but drifts tomorrow
  fails at the point of drift rather than at the point somebody notices.

  WHY FIVE STATEMENTS AND NOT ONE PARAGRAPH. ACD-400e's notes enumerate exactly what the
  account must cover, so the BA does not scope it to a summary. The five are reproduced in
  the criteria as separately checkable items rather than as a list in a note, because a
  single "the account is complete and correct" clause is unfalsifiable and would let an
  implementer satisfy the AC with a paragraph covering the two easy verdicts.

  ORDER-OF-APPLICATION IS PART OF TWO OF THE FIVE, DELIBERATELY. Which tests are applied
  is nearly useless to a reader without the order they are applied in: it is the order
  that explains why work failing admission is reported nowhere (ACD-400c-1-i), and the
  order of the ordering keys is the exact thing three records in the store get wrong.

  THE NEITHER-LIST ITEM IS A STATEMENT OF CURRENT BEHAVIOUR AND NOT A COMMITMENT TO
  CHANGE IT. ACD-400e's notes say so explicitly. Making the queue report its exclusions is
  the ACS-1100-shaped follow-up flagged to the user in ACD-400c's notes, and nothing in
  this AC asks for it.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L2.
