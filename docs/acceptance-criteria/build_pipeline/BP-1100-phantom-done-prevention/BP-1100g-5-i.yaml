assigned_agent: python-coder
estimated_complexity: M
declares_side_effect: false
it_requirements:
  - "THE READER IS NEW. completion_manifest has ZERO code readers today — grep over scripts/ returns no occurrences; it is parsed only by the supervisor LLM. scripts/commit_guardian/_signoff_parity_checks.py already parses a ticket's ## Sign-offs section and is the natural host, but it does not parse the ## Comments block. Extend it rather than adding a second ticket parser."
  - "THE ANTI-GREP CLAUSE IS BINDING. Cardinality must be established from the records the run ACTUALLY EMITTED. A test asserting that the writing side was told to answer, or that a call to record the answer is present in the source, passes on an implementation that never records anything. Assert over emitted records, never over source presence."
  - "CARRY BO-1000b-1-i's TRAP FORWARD: its double-recording defect survived because a count-guard regex matched only quoted-string first arguments and was blind to template-literal calls. Do not implement or test the answered-twice case by pattern-matching call sites."
  - "The three shortfall kinds must be distinguishable BY NAME in the output — reasonless, absent, answered-more-than-once. Detecting all three needs three different mechanisms: presence for absent, a required (not merely permitted) reason for reasonless, and cardinality for answered-twice. An implementation commonly gets one or two."
  - "A reasoned negative must never be reported. False shortfalls have exactly one natural remedy — weakening the check until they stop — so the valid case is as load-bearing as the invalid ones."
  - "NO RECORD AND A BAD RECORD ARE DIFFERENT STATES. A run that stopped before a piece of work was handed on produced no record for it and must not be reported as reasonless or contradictory. Same carve-out discipline as BO-2900f-2-i."
  - "LEGACY COMPATIBILITY: pre-epoch sign-offs carry no completion_manifest at all, and the signoff SKILL explicitly accepts that absence. Those must fall in the no-record state, not the absent-answer shortfall, or the check false-fails every historical ticket on its first run."
  - "Must be reachable through the deployed hook path (python .leafcutter/scripts/commit_guardian/run_hook.py .leafcutter/scripts/commit_guardian/check_ticket_signoff_parity.py) and registered in scripts/commit_guardian/commit_guardian.json. Any new module it imports must be in the build deploy manifest."
  - "The report is a record-shape observation, not a verdict about any test. It must not consult a test file, a test result, or a coverage record."
delivers_to:
  - agent: pr-reviewer
    contract: "Per work item, zero or one shortfall record: {work_item_id, kind: 'reasonless' | 'absent' | 'answered_more_than_once', detail}. A conforming answer and a work item with no record at all both produce nothing."
expects_from:
  - ac_id: BP-1100g-5
    contract: "One completion_manifest key per work item under a single fixed token, in one of two conforming shapes (covered, naming producing and consuming side; or not-applicable with a non-empty reason). The token is what makes this reader buildable."
test_spec:
  - name: test_bp_1100g_5_i_four_records_produce_three_named_shortfalls_and_no_report_for_w
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "Records W/X/Y/Z from the criteria: W produces no report; X, Y and Z each produce exactly one shortfall whose kind is reasonless, absent and answered-more-than-once respectively."
  - name: test_bp_1100g_5_i_records_are_parsed_from_real_ticket_files_written_by_the_signoff_recipe
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Build the four ticket files on disk with the project's own writer (yaml.safe_dump into the ## Comments block per the signoff SKILL recipe) rather than hand-typed markdown, then parse them. Hand-typed fixtures reproduce the indentation bias that hid the files_touched parser no-op through seven green sign-offs."
  - name: test_bp_1100g_5_i_cardinality_is_counted_per_work_item_across_two_items_and_a_halted_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: boundary
    description: "Zero / one / two answers for one work item, two work items in one run each with their own answer, and a run halted before hand-off leaving no record — the halted case yields nothing, not a reasonless or contradictory report."
  - name: test_bp_1100g_5_i_shortfalls_are_reported_through_the_deployed_signoff_hook
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT: run `python .leafcutter/scripts/commit_guardian/run_hook.py .leafcutter/scripts/commit_guardian/check_ticket_signoff_parity.py <staged ticket paths>` as a subprocess against the four real ticket files and assert the three shortfalls appear by name in the hook's output, and that the hook id is registered in scripts/commit_guardian/commit_guardian.json."
test_rationale: |
  Three of the four risks are invisible to a hand-built-record unit test. The
  real-artifact test exists because a hand-typed fixture already hid a parser no-op
  through seven green sign-offs in this repo. The boundary test exists because
  BO-1000b-1-i shipped exactly the answered-twice defect and its structural test was
  blind to it. The deployed-hook test exists because a reader that is not reachable from
  a registered hook reports to nobody, which is the same inertness the fast-lane runner
  shipped. A single unit test over four dicts would pass on all three.
