criteria: |
  Given a copy of the worktree setup step placed in a directory that is not inside
    any git repository,
  And two or more git repositories exist among the immediate subdirectories of
    that directory,
  When the setup step is executed from that directory with no repository location
    supplied by the caller,
  Then it exits with a failure status and creates no worktree under any of the
    candidate repositories,
  And its failure names every candidate it found and states that it will not
    choose between them,
  And no branch and no directory is left behind in any candidate repository by the
    attempt.
