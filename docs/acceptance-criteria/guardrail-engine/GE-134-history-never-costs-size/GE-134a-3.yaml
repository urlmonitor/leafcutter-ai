    standard quoted
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_134a_3_stated_rule_follows_the_rule_in_force
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: 'The statement is generated by probing the measure in force: rebinding count_content_lines
    to the pre-change rule removes "comments of every style" from describe_measurement_rule(), so the
    sentence is never hard-coded (GE-127d-2 / GE-127d-5).'
  proves_clause: the rule leaves the decision-history block out, and the author arrives at the length the
    standard quoted
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
