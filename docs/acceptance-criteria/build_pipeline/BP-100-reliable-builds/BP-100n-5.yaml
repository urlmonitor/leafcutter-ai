notes: >-
  MEASURED IN THIS WORKTREE, 2026-09-01, BY SCANNING THE WHOLE STORE — NOT TAKEN ON
  TRUST, AND BROADER THAN REPORTED. The brief named two contradicted records; a
  store-wide sweep of every record carrying an it_requirements.config_schema_fragment
  whose reference_file_path names commit_guardian.json found more. The file holds 36
  top-level parts. Among records whose work_status is done and whose fragment keys are
  part names:

    CONTRADICTED (4) — the named part is absent from the file:
      BP-100k-4     hook_trigger_reachability                 readiness approved
      BP-100k-4-i   hook_trigger_reachability_indeterminate   readiness approved
      GE-122d-6     check-identifier-uniqueness               readiness approved
      BO-2500b-1    proof_of_done_precommit_hook              readiness draft

    CONFORMING (1) — the positive control, and the reason the distinction is measurable:
      BP-1100b-5    presence_only_assertion_guard             readiness approved

  GE-122d-6 fails in a second way worth naming: check-identifier-uniqueness is a hook id,
  not a top-level part, so the declaration is not merely wrong about the file's contents
  but about what kind of thing the file's top level holds.


  WHY THE UNFINISHED RECORDS ARE DELIBERATELY EXCLUDED, AND WHY THAT IS NOT A LOOPHOLE.
  Eleven further records name parts absent from the file — eight under BO-2900, plus
  BO-2500c-1-i and others — and every one is todo. For unfinished work a declaration of
  an absent part is the correct and useful statement: it says what the work will add.
  The defect is a FINISHED record claiming a configuration that is not there, which is
  phantom-done in its purest form: the work says it added a key, and the key is not in
  the file. Scoping to finished work is what makes the finding actionable rather than a
  wall of noise, and it is also why the check must read work_status rather than readiness
  — three of the four contradicted records are approved, so approval is not the signal.


  ANTI-GREP, AND THE SPECIFIC TRAP HERE. A criterion satisfied by asserting that the
  fragment parses, that it is a mapping, or that its keys are strings is exactly the
  incumbent behaviour restated. The observable is a lookup performed against the named
  file as it stands on disk, and the discriminator is the added-record clause: the stated
  number of parts looked up must MOVE. An implementation carrying a literal list of
  known-bad record ids satisfies every other clause and fails that one, which is why it
  is written last and must be built first.


  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSE. "A record naming a part the file does
  contain is not reported in any class" asserts an absence and is green on arrival today,
  because nothing is reported at all. INJECTION: build the set of the file's parts from
  its metadata keys only — the two beginning with a double underscore and the comment key
  — rather than from the whole document's top level. Under that injection BP-1100b-5,
  which names a part that genuinely exists, is reported as contradicted; this clause must
  go RED naming it, and must return to green on revert. That single conforming record is
  the only control the store currently offers, so the mutation must be run rather than
  described.


  DAY-ONE BLAST RADIUS IS FIVE REPORTS AND THAT IS THE CORRECT OUTCOME. The check fails
  on the commit that lands it until each contradicted record is reconciled — the key added
  to the file, or the declaration corrected to name what the work actually produced, or
  the record's work_status corrected because the work is not in fact finished. Landing the
  check green by pre-suppressing its findings proves nothing. Reconciling BP-100k-4 and
  BP-100k-4-i in particular changes what the store says is done about the reachability
  guard, which BP-100n-4 is actively extending; sequence accordingly.
