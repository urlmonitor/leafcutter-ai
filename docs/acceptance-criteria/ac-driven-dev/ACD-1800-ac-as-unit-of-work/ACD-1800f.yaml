criteria: |
  The proof of an observable promise travels with the requirement itself.

  When a requirement promises an effect a person can actually observe, the
  requirement states what to invoke and what should be seen as a result -- not
  a separate document that may or may not have been filled in. The check runs
  identically whether that requirement is built on its own or bundled with
  others into a larger feature, and a requirement that promises something
  observable but says nothing about how to observe it is surfaced as
  incomplete rather than passing on an empty check.
