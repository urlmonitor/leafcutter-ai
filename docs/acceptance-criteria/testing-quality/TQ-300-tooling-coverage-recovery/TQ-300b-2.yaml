assigned_agent: python-coder
estimated_complexity: S
test_required: true
test_spec:
  - name: test_satisfied_dsl_returns_true
    target_dir: tests/
    framework: pytest
    type: unit
    description: "A DSL condition the ticket_context satisfies makes evaluate return True."
  - name: test_unsatisfied_dsl_returns_false
    target_dir: tests/
    framework: pytest
    type: unit
    description: "A DSL condition the ticket_context does not satisfy makes evaluate return False."
  - name: test_and_or_composition_follows_declared_logic
    target_dir: tests/
    framework: pytest
    type: unit
    description: "AND / OR composition yields the declared boolean outcome (AND binds tighter than OR)."
  - name: test_llm_condition_raises_llm_evaluation_required
    target_dir: tests/
    framework: pytest
    type: unit
    description: "A condition with type 'llm' makes evaluate raise LLMEvaluationRequired."
it_requirements:
  - "Author fresh unit tests in tests/test_selection_criteria_evaluator.py (new file). Write from scratch and verify run-to-green before sign-off."
  - "This is NOT the affected-agent eval gate (scripts/evals/eval_selector.py) — that is unrelated code. The unit under test is scripts/selection_criteria_evaluator.py, the DSL that decides which agent fits a task; it is currently untested and eval_selector.py does not import it."
  - "Functions under test (scripts/selection_criteria_evaluator.py): evaluate(trigger_condition, ticket_context) and the LLMEvaluationRequired exception. A condition is a dict {type: 'dsl'|'llm', expression: str}; the 'candidate' is the ticket_context dict (keys: files_touched, title, description, components). Import by bare module name after adding scripts/ to sys.path."
  - "API GAP — do NOT author the salvage's 'negation of individual criteria' sub-case: the DSL grammar supports only the AND/OR combinators and the operators contains/equals/matches — there is NO negation/NOT operator. Cover AND/OR only. If NOT support is genuinely wanted it is a separate production feature, not part of this coverage-recovery AC; flag it rather than asserting unsupported syntax (which cannot go green)."
  - "No production change is expected for the four scenarios as written — they cover existing behavior."
