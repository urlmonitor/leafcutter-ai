criteria: |
  The mandated route into new work is open from wherever you are working.

  Every new piece of work is supposed to begin the same way: describe what it
  must do, have that reviewed, and only then build it. When that route will not
  start, the work does not stop -- it simply goes around, and the triage, the
  approval points and the safe staging that the route exists to provide are all
  skipped. Nobody notices, because going around still produces something. This
  goal is met when starting new work succeeds from any working location; when a
  check that could not run says so plainly instead of blaming a setting that is
  already correct; when every decision the route records as yours is one you
  actually made; and when all of that holds in the copy installed in a project
  rather than only in the source it was fixed in.
