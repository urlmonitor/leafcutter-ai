it_requirements:
  - "THE EXCLUSION LIST MUST BE SOURCED FROM THE AC STORE, NOT FROM TICKET FRONTMATTER. Replace the frontmatter extraction in templates/agents/change-scope-reviewer.md Step 1.1 with a call into scripts/ac_store/scope_boundary.py over the AC ids the change is being built for. This is a change of SOURCE only -- the three-tier adjudication ladder is existing behaviour and must not be re-specified."
  - "GRAIN INVARIANCE IS ONLY SATISFIABLE OFF THE STORE, AND THAT IS THE POINT OF THE FOURTH THEN CLAUSE. scripts/build_orchestration/fast_lane.py builds a single AC with no ticket file, so a frontmatter-sourced implementation has nothing to read there. Requirement: the same AC id set plus the same pending changes must produce byte-identical findings whether the adjudication is invoked with a ticket path or with a bare list of AC ids."
  - "PRESERVE TIER 2's SECOND CLAUSE UNCHANGED. Verified 2026-08-17: Tier 2 blocks on EITHER 'the file's top-level directory or component is listed in out_of_scope' OR 'the file belongs to a fundamentally different top-level component from every file in files_touched'. Only the first clause changes source here. Silently dropping the second while rewiring the first would remove the only block condition that works today."
  - "Every finding must name the crossed path AND the AC id whose boundary it crossed. Extend the existing hard-violation record and the Step 4 'Hard violations' bullet format in templates/agents/change-scope-reviewer.md to carry the AC id; do not invent a parallel report structure."
  - "THE CLEAN CASE MUST STAY CLEAN. A diff wholly inside the boundary produces zero findings and the existing (status: ok) path with no new output. An implementation that surfaces something on every run passes the positive test and fails the requirement."
  - "The adjudication logic must live in Python (scripts/ac_store/scope_boundary.py) and be callable independently of the agent, so it can be executed by a test. Adjudication expressed only as prose instructions inside the agent template cannot be verified behaviourally, which is what makes this the one leaf in ACD-1600g that could ship as unverified dead prose."
  - "PROMPT-SURFACE CAVEAT: templates/agents/change-scope-reviewer.md is an agent template. Edit the canonical templates/ copy only (ADR-001) and rebuild via ./build-self.sh so the deployed .claude/agents/ copy matches. If this repository routes prompt-surface edits to llm-expert, that file is the hand-off; the Python surface remains python-coder's."
  - "Performance budget: adjudication of a 200-file diff against a 20-member bundle completes in under 500 ms -- it runs on the phase-agent path between the coder and pr-reviewer."
  - "A boundary the store cannot supply must fail VISIBLY via the ACD-1600g-4 announcement, never be silently treated as empty. Per the project error-handling policy, a read failure is caught by exception type, logged at WARNING or higher, and converted into an announced outcome -- never swallowed."
  - "Deploy-manifest first (ADR-026 rule 2): if adjudication becomes a commit-guardian hook dependency, add its module to the build_ac_store deploy_map in scripts/build_phases.py (~line 794) in the same change and verify from the deployed layout."
delivers_to:
  agent: change-scope-reviewer
  contract: "Scope findings from scripts/ac_store/scope_boundary.py: { findings: [ { path: str, ac_id: str, tier: 'hard'|'soft'|'ambiguous', reason: str } ], undeclared_members: [ac_id], verdict: 'clean'|'soft'|'question'|'blocker' }. Rendered by templates/agents/change-scope-reviewer.md Step 4 and consumed unchanged by the fast lane's no-ticket path. `verdict` maps onto the reviewer's existing Step 5 status table; no new status values are introduced."
expects_from:
  ac_id: ACD-1600g-2
  contract: "compose_boundary(members) -> { paths: { <path>: { excluded_by: [ac_id] } }, undeclared_members: [ac_id] } -- the composed bundle boundary with per-path provenance. The provenance is what makes the second Then clause (naming the requirement) satisfiable without re-reading the members."
test_spec:
  - name: test_pending_change_outside_the_boundary_is_surfaced_and_names_the_path_and_the_requirement
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Stages a diff touching the excluded release workflow in a temp git tree with a real on-disk AC record declaring it excluded, runs the real adjudication, and asserts a hard finding whose text contains both the path and the AC id."
  - name: test_change_inside_the_boundary_produces_no_finding
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Same harness, diff wholly inside the declared surface: asserts zero findings and a clean verdict. Run alongside the positive case so a surface-everything implementation cannot pass."
  - name: test_same_requirement_produces_the_same_outcome_alone_and_inside_a_five_member_bundle
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Identical pending changes adjudicated twice -- once for the single AC, once with four additional member ACs that neither exclude nor change the release workflow -- and asserts byte-identical findings. This is the grain-invariance clause."
  - name: test_adjudication_runs_with_no_ticket_file_present
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Invokes the adjudication with a bare AC id list and no ticket anywhere on disk (the fast-lane shape) and asserts the same findings as the ticket-bearing run. A frontmatter-sourced implementation cannot pass this."
  - name: test_component_mismatch_still_blocks_after_the_source_is_rewired
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "A file in a wholly different top-level component from every file in the change surface, with no exclusion declared at all, still yields a hard finding -- Tier 2's second clause survives the rewiring."
test_rationale: "This is the leaf that makes the boundary do anything, and it is also the leaf most exposed to the failure this repository was rebuilt around: an assertion that the agent template contains the string `out_of_scope` passes on a reviewer that reads the field and ignores it, exactly as the fast-lane runner's structural tests passed on gates it never executed. Every test therefore drives a real staged diff in a real temp git tree against a real on-disk AC record and asserts the emitted findings. The negative case runs in the same harness because a reviewer that blocks on everything satisfies the positive case alone. The no-ticket test is the only assertion in this list that can distinguish an AC-store-sourced implementation from a frontmatter-sourced one -- in every ordinary run the two read the same value and agree, so grain invariance would otherwise be untested in practice. The last test exists because the natural way to implement this rewiring is to replace the whole Tier 2 condition rather than only its first clause, which would remove the block path that works today and would be invisible to the other four tests."
