id: KM-400a-1-xvii
title: Test properties preserve reference provenance without inventing execution results
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
work_status: done
priority: medium
parent: KM-400a-1
criteria: |
  Given an existing Test reference records a canonical identity, pinned source revision and properties, and several requirement relationships may identify different tests within that reference
  When its native fields are exposed in the repository graph
  Then its canonical_id, kind, title, summary, complete source reference and properties retain their original values
  And source repository_id, source_sha, path, locator and content_hash remain attributable to the pinned reference even when the current checkout differs
  And any supplied surface, missing, canonical, registry_identity and future nested properties preserve their types, order, nulls, empty values and omissions
  And an empty title, summary, locator or hash remains empty, without deriving replacements from current test contents
  And per-relationship test anchors remain separate from node source provenance and do not create additional Test identities
  And no file inspection, test discovery, test execution, content rehash or component inference manufactures a pass/fail result, execution time, duration or coverage assertion
  And repeated enrichment excludes only its three defined projection-helper fields while preserving unrelated similarly named source properties and independent nested copies
  And a non-Test input or invalid source provenance fails explicitly without inspecting the referenced file
depends_on: [KM-400a-1]
