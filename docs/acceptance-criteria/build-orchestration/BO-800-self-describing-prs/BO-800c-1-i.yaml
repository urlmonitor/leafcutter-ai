criteria: |
  Given a ticket's source_ac is BO-500a (level: L1)
    and the AC store contains NO child ACs under BO-500a
    (no files with depends_on containing BO-500a and level L2 or L3),
  When the pull-request agent assembles the PR body's Test plan section,
  Then the Test plan section is present but contains the text:
    "No L2/L3 acceptance criteria defined for this feature."
  And the section is NOT omitted entirely (the heading still appears)
  And no error is raised during PR assembly.
