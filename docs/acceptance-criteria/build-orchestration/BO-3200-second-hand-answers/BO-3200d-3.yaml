  - ac_id: BO-3200d-2
    contract: "The caller-supplied handover location and the rule that the reply is never an input to the verdict — the two structural facts the diagram must draw."
test_spec:
  - name: test_bo_3200d_3_diagram_declares_two_separate_arrows_and_no_reply_to_verdict_edge
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "Parse the declared interactions: assert the result placement and the reply are separate arrows, the reply is marked as carrying no content, the handover location originates from the consumer's side, and no declared edge runs from the reply to the verdict."
  - name: test_bo_3200d_3_diagram_matches_a_real_149kb_run
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "THE COHERENCE CHECK AT THE REAL SIZE. Drive a real run producing and consuming at least 149 KB; assert every declared interaction occurred in the order shown, and that the reply in that run contained no part of the result's content."
  - name: test_bo_3200d_3_diagram_page_passes_repo_doc_gates
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: deployed
    description: "The repository's real doc front-matter and component-vocabulary checks pass over the new page."
test_rationale: |
  The arrangement this diagram replaces looked correct in every drawing, at every size, because
  the single arrow that did both jobs is a perfectly reasonable thing to draw. The failure only
  appears above a size threshold — so the coherence check is pinned to a run at the real 149 KB
  size, and a diagram validated against a small payload cannot pass.
  Making the carries-no-content property declared data rather than a line style is what allows
  the check to assert it against a real reply; a dashed arrow conveys the intention and proves
  nothing.
  Deliberately NOT covered: layout and legibility, which are human judgement.
