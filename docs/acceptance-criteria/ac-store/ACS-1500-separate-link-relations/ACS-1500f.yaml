notes: |
  WHY THIS IS AN L1 AND NOT JUST THE L0'S CRITERIA. Every other L1 here can land
  green and leave the motivating population exactly as stuck as it is today,
  because none of their acceptances mention it. This record is the handback, and
  it is the one a reviewer should check first when asking whether the tree was
  worth building.

  IT DOES NOT PERFORM THE REPAIR, AND MUST NOT GROW INTO ONE. Completing parent
  lists is ACS-1400c's job, it has an adjudicated pass being specified for it,
  and there is already an unadjudicated tool (fix_ac_orphans.py) one command
  away that would do it wrongly. This L1 proves the blocker is gone. The BA will
  feel the pull to make it also do the repair while it is in there — refuse it,
  the same way ACS-1300a-3 refused the mirror-image temptation.

  'DONE' IS NOT ZERO ORPHANS, AND NO CRITERION MAY SAY IT IS. ACS-1400's L0 is
  explicit: six records (KM-200a–f) must NEVER be repaired, and a store
  reporting labelled deliberate exclusions is healthy. Binding this L1's success
  to an orphan count of zero forces six wrong repairs and reverses a decision
  the store paid a hook bypass to make. The success condition is that the
  ABSTENTION REASON is unreachable, not that the report is empty.

  THE POPULATION AND ITS DENOMINATOR (ACS-1100, inherited). 25 orphaned children
  across 10 parents whose coverage lists resolve to nothing, of 47 orphans
  across 22 parents store-wide, measured 2026-09-08. KM-KGS-100e-6 is an
  eleventh parent in the same tree with the same underlying cause but an
  entirely EMPTY list, so it classifies with the empty-list group of 12 instead
  — ACS-1400c-2's notes carry that correction and it applies here unchanged. All
  figures provisional; the count has already moved once (26 to 25) and no
  criterion may pin one.

  THE NEGATIVE IS THE PROOF. 'The verdict did not move' is trivially satisfied
  by not performing the write. Assert it in the same run as a completion that
  genuinely happened — the pairing discipline inherited from ACS-1300a-3 and
  restated in ACS-1400c-2's third Then, which that record explicitly says must
  not be split out.
