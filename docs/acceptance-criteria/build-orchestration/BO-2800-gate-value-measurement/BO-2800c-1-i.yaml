title: "An override of an unlabelled finding is still recorded, flagged as unattributed"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a gate has raised a blocking finding that carries no defect identifier — for example
    a historical prose-only blocker recorded before problem kinds were declared,
  When the work proceeds past that finding anyway,
  Then an override record is still created and is still attributed to the overruling of that
    named gate,
  And the record is flagged as unattributed at the problem-kind level, naming the absent
    defect identifier as the reason,
  And that record contributes to the per-gate override count but is excluded from every
    per-problem-kind override rate,
  And any report presenting per-problem-kind rates states how many override records were
    excluded as unattributed, so the gap in the denominator is visible rather than silent.
