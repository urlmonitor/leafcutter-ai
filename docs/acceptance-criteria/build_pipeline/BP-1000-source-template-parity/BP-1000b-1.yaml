it_requirements:
  - "Insert the parity gate as a new step in templates/workflows-js/finalize-feature.js BETWEEN the merge-origin/main step (Step 2) and the PR-merge step (Step 4), co-located with the test-regression gate (Step 3). The gate must run against the post-merge worktree state (i.e. after origin/main has been merged in) so it evaluates the exact tree that would land on main."
  - "This AC owns WHERE/WHEN the gate fires (workflow position), not the diff comparison itself. The byte-level comparison and per-pair verdict come from BP-1000a-1; do not re-implement comparison logic here — consume the verdict object."
  - "Keep distinct from BP-1000a-2/-3, which own the block-on-drift and pass-on-clean verdict semantics. This AC asserts only that the gate exists at the correct enforcement point in the finalize-feature workflow ordering, mirroring the test-regression HALT placement."
  - "finalize-feature is a workflow (.js), not a dispatchable ticket-phase agent; the workflow-body edit plus any Python glue is python-coder work."
delivers_to:
  agent: python-coder
  contract: "A parity-gate step wired into finalize-feature.js at the pre-merge enforcement point (after merge-origin/main, before PR-merge). The step invokes the BP-1000a-1 verdict and exposes its pass/fail outcome to the HALT-or-continue logic implemented by BP-1000b-2 (halt-on-drift) and BP-1000b-3 (continue-on-pass)."
expects_from:
