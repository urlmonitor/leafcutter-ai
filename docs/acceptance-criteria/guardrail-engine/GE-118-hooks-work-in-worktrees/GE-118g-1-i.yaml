id: GE-118g-1-i
title: "Run from inside a worktree, the pre-flight judges that worktree's pending changes and not the clone's or a sibling's"
component: guardrail-engine
components:
  - commit_guardian
  - doc_compliance
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a checkout of this repository and two linked git worktrees of it, A and B,
  And a new decision record claiming an unclaimed number is staged in worktree A
    and in no other tree,
  And a different new decision record claiming an already-claimed number is
    staged in worktree B and in no other tree,
  When the author runs the collision pre-flight with worktree A as the working
    directory and no argument naming a repository,
  Then it completes successfully and reports no collision — worktree B's staged
    collision is not attributed to worktree A,
  And when the author runs it with worktree B as the working directory,
  Then it does not complete successfully and names the collision staged in B.

  And given a worktree whose administrative git data lives outside the worktree
    directory, as a linked worktree's does,
  When the pre-flight is run with that worktree as the working directory,
  Then it reads that worktree's own pending changes — the tree it reports about
    is the one the author is standing in, not the directory the shared
    administrative data lives under.
depends_on:
  - GE-118g-1
