id: BP-1500g-1
title: "A capability the adopter added themselves is still there, and still runs, after the ordinary everyday build"
component: build-pipeline
components:
  - build_pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
declares_side_effect: false
criteria: |
  Given a project that has the package installed, and the adopter has added one
    capability of their own -- something the package does not ship and has never
    shipped -- placed so that the tool which runs capabilities in that project
    discovers it by name,
  When that project is rebuilt with the ordinary everyday command and no options
    of any kind,
  Then the adopter's capability is present when the run ends, with its contents
    unchanged byte for byte,
  And the tool which runs capabilities in that project still discovers it by that
    same name and runs it, so it survives usable rather than merely undeleted,
  And this holds for a capability the adopter added after the last build as well
    as one that was already there before it, because an adopter adds their work
    between builds, not during one.
depends_on:
  - BP-1500g
