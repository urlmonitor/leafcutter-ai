notes: |
  THE KNOWN-ISSUE ENTRY NAMES THE WRONG GATE, AND THE CORRECTION CHANGES THE SIZE OF THE DEFECT.
  KI-ACD-012 attributes the rejection to templates/hooks/ticket_frontmatter_guard.py and counts
  six missing fields. Verified 2026-08-25: that script is registered in templates/settings.json
  under PostToolUse with matcher "Edit|Write" — it is an authoring-session tool hook, so it
  cannot fire on a file the generator writes through its own file I/O. It never saw the artifact.

  The gate that actually rejects the commit is the pre-commit doc-frontmatter validation, which
  is registered in the hooks manifest with a files pattern covering tickets/**/*.md. Its
  configured ticket_frontmatter.required_fields is exactly
  ["title", "status", "components", "created", "depends_on"]. The generator emits epic_name,
  created, status, components and source_ac. Intersecting those leaves TWO required fields
  missing — "title" and "depends_on" — not six. The other four the register lists
  (requires_diagram, requires_adr, change_target, risk_surface) are demanded by the session hook
  only. The two keys the generator does emit beyond the overlap, epic_name and source_ac, carry
  no weight with either gate.

  BOTH GATES ARE STILL IN SCOPE, FOR DIFFERENT REASONS. The commit-time one is what blocks the
  commit today and is the one whose required set is stated above from the configuration itself.
  The authoring-time one is what a person or agent meets the moment they open the file to edit
  it, which is why the second clause exists — but its required set is deliberately NOT enumerated
  here. This BA read the commit-time configuration directly and did not independently verify the
  session guard's field set; the register's account of that guard has already proved unreliable
  once. Read it from the guard at implementation time, not from the register and not from this
  record.

  THE STATUS VALUE IS A SEPARATE MATTER AND IS NOT IN THIS CRITERION. The second occurrence also
  corrected status from in_progress to todo, because no ticket in the generated epic had been
  started. That is a correctness defect in what the generator claims, not a gate failure —
  in_progress is in the gate's allowed_statuses and passes. It needs its own record if it is to
  be fixed; folding it in here would make this criterion pass or fail for two unrelated reasons.

  WHY THE ANTI-DRIFT CLAUSE IS THE LOAD-BEARING ONE. The producer and the gate are maintained
  independently and each is individually correct, which is precisely the condition under which a
  divergence goes unnoticed — it went unnoticed here through two occurrences. A fix that only
  adds today's two fields restores the artifact and leaves the drift mechanism intact.

  WHY THIS IS NOT AUTHORED AS ACD-1200a-7. scripts/goal_to_epic.py cites ACD-1200a-7 three times
  as the governing criterion for Master_Plan generation, and no record with that id exists in the
  store — the same is true of ACD-1200a-6 with six citations. Verified 2026-08-25 by searching
  all git refs: no AC record declaring either id has ever been committed, yet both ids were
  genuinely ISSUED — tickets 06 and 07 of EPIC-AcParentChildLinkEnforcement carry them as
  source_ac, were implemented, reviewed and closed under them, and a live record in the
  testing-quality component still cites ACD-1200a-6 as a worked example of an id-shaped string.
  So these are neither free ids nor retired ones: they are records that were lost before they
  ever reached the shared history, while their ids stayed in live use meaning what they always
  meant. Minting them now for these two new promises would leave nine live citations resolving
  confidently to the wrong criterion, which the store's own convention (docs/reference/ac-schema.md,
  and ADR-029's neither-a-file-nor-a-citation rule) exists to prevent. Restoring the two ORIGINAL
  criteria at those ids is the right repair and is store reconciliation rather than L2/L3
  authoring — it is reported to the caller, not performed here.
