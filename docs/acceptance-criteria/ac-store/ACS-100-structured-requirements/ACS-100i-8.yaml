id: ACS-100i-8
components:
  - ac_store
  - precommit_hooks
title: "A package surface cannot come into existence without a record that declared it"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a change that adds a new entry to a package registry — one of the files
    the build reads to decide what a consumer project receives, such as the
    agent registry, the skill registry, the hook registry or the path registry —
  And the acceptance criteria that change cites, whether through the ticket it
    is being built from or through its commit message,
  When the change is evaluated at commit time,
  Then the change is refused unless at least one cited record carries
    `package_surface: true`,
  And the refusal names the registry file, the key of the entry being added, and
    every acceptance criterion the change cited.

  And given the same change, where one cited record carries
    `package_surface: true`,
  When it is evaluated,
  Then the change is allowed.

  And given a change that edits the value of an entry already present in a
    package registry, or removes one, and adds no new entry,
  When it is evaluated,
  Then the change is allowed with no declaration required — the obligation
    attaches to bringing a surface into existence, not to maintaining one.

  And given a change that touches no package registry at all,
  When it is evaluated,
  Then it is allowed, and the check reports that it had nothing to evaluate
    rather than reporting a pass.
depends_on:
  - ACS-100i
  - ACS-100i-6
doc_links:
  - path: config/agent_registry.json
    relationship: describes
    status: exists
    relevance: "One of the package registries. An entry added here is what makes an agent reachable in a consumer project — the registration event this check watches for."
  - path: config/skill_registry.json
