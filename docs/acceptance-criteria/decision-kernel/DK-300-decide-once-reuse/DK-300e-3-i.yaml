it_requirements:
  - 'Precedent is evidence, never authority (ADR-060): no score, however high, resolves a decision,
    changes routing or changes a threshold.'
  - 'Only a human answer may approve, choose or reuse (ADR-053, ADR-060): no path may let Jev, a host
    or the kernel resolve or approve on a person''s behalf.'
  - 'During a run the kernel only reads the repository (ADR-060): no file under the repository root
    may change; the configured run root is the only place a run writes.'
  - Deciding anew never edits the older record during the run; the correction is applied only by an
    explicit publish --correct.
  - 'No real decision record has been superseded yet (2026-10-02): tests build their own fixture records;
    the ids in the criteria fix the expected shape, not the test data.'
  - 'No kernel code change is in scope of TICKET-20261002-DecisionLifecycleACs: a behaviour gap that
    needs kernel code is closed through its own ticket. Adding covers tags or a missing test does
    not change kernel code.'
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
