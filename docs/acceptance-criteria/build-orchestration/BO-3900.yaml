estimated_complexity: L
it_requirements:
  - "Scope is every script under templates/workflows-js/ that resolves, joins or compares ticket, epic, worktree or store paths, or derives a name from one: at authoring time build-feature.js (every call site of its worktree-path helper, including the ticket-path, epic-path, depends_on and result ticket_path sites), plan-feature.js and build-epic.js. A site fixed in one script but left unfixed in another leaves this record not done."
  - "Path handling must be plain string logic that runs inside the workflow body. The E2 engine injects no module loader (ADR-030; KI-BO-028), so the fix must not require or import Node's path, os or fs modules, and must not depend on a helper file outside the script. A fix that throws, or silently falls back, when run under the engine is a failed fix."
  - "Classification, containment and resolution must not consult the host operating system, the host path module, or any environment variable: the same input string yields the same result on Windows and on POSIX (pinned by BO-3900a)."
  - "One output spelling rule applies at every call site: exactly one root, one separator spelling throughout, and '.' and '..' segments applied. A relative input is joined onto the resolved worktree exactly once, and an absolute input is never joined onto anything."
  - "Every path comparison in a script (worktree containment, depends_on predecessor matching, and BO-4000a's instructed-versus-reported location check) uses one equivalence rule. Separator spelling and trailing separators are ignored, and letter case is ignored for drive-lettered and UNC forms only; POSIX paths compare case-sensitively (pinned by BO-3900b)."
  - "depends_on predecessors are resolved by the same rule that produces the dispatched ticket path, so for every accepted spelling a predecessor's resolved form equals the path it is dispatched under. A spelling mismatch must never be reported as a reference to a ticket the run does not have."
  - "A name derived from a path (epic name, last segment, store-relative reference) must split on both separators and must be identical for backslash, forward-slash and mixed spellings of the same path."
  - "Where the engine forces each script to carry its own copy of the path rules, all copies must reach identical outcomes for identical inputs. Each script's own harness run is the guard, and no copy is exempt from it."
  - "If a changed site lies inside driveTicketPhases, the build-ticket.js twin must receive the identical change (agent_delivery_workflows.md section 4), and build-ticket.js then needs its own harness proof under this record's 'script found later' clause."
  - "If unit_tests/_workflow_engine_harness.py cannot yet run the top-level bodies of plan-feature.js or build-epic.js with mocked agent globals, extending the harness is in scope for this record. The extension must not change the outcome of any existing harness-driven test."
  - "Test inputs must be literal Windows-shaped strings, never paths built from the host separator or a host path join (BO-3900a; KI-BP-20260907-0812)."
  - "POSIX-spelled inputs keep the outcomes they had before the change."
  - "Existing agent result and prompt fields consumed downstream (for example ticket_path and worktree_path) must not be renamed or removed; only their path values change."
  - "The canonical source is templates/workflows-js/. The deployed .claude/workflows/ copies are build outputs regenerated by 'python scripts/build.py' and are never hand-edited (ADR-001). The build's dual-engine transform must still accept every changed script (ADR-030)."
delivers_to:
  agent: python-coder
  contract: "Platform-independent path rules, available inside each affected workflow script's own body with no module loader, consumed by BO-4000 and BO-4000a. (1) Classify a string as absolute (drive-lettered in either letter case with either or mixed separators, UNC, or leading '/'), relative (no root and no drive), or unrecognised (drive-relative 'C:foo', rooted-without-drive '\\foo', empty or blank, or carrying a second root after its first segment). (2) Equivalence: separator spelling and trailing separators ignored, '.' and '..' applied, case-insensitive for drive-lettered and UNC forms only. (3) Containment: true only at a whole-segment boundary under that equivalence; a path equal to the root counts as the root itself. (4) Resolve onto a root: returns one absolute path string in the single output spelling, or an unrecognised-form result that carries the input value verbatim. It never joins an absolute path onto anything."
expects_from: null
