  - testing_quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Naming a requirement satisfies the rule only when the requirement exists.

  A test meets the standard by naming a requirement that is really in the
  project's record. A name that resolves to nothing is treated as a missing
  declaration rather than a satisfied one, so the standard can never be met in
  bulk by manufacturing names — the cheapest way to clear the backlog is the one
  way that must not work. Clearing the backlog stays a matter of declaring tests
  honestly, one at a time, as the work reaches them.
