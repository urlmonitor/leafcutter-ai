notes: |
  Before this change there was one remedy, so a message naming the rule was
  enough. After it there are two, and a developer who cannot tell which applies
  will reach for the third, wrong one — the skip — which is the habit this whole
  goal exists to break. Hence the explicit clause forbidding the message from
  offering the skip.

  The "only when deliberately not broken down yet" clause matters: without it the
  message reads as offering a mute button for any inconvenient block.
