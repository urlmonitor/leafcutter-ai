notes: |
  A group that fails part way is the state in which a stuck marker is most likely to be
  left, and a member stuck as being worked on is invisible until somebody tries to build
  it again and is told it is already in hand. The parent criterion says the run does not
  claim a partial delivery; this one says the run does not poison the retry either.

  THE SECOND SCENARIO IS THE REAL TEST. The first can be satisfied by a run that cleans
  up but also blocks the group in some other way. Asserting that the retry SUCCEEDS is
  the only version of this that cannot be faked by tidying.

  Worth noting for whoever implements it: a mixed run has more places to fail than a
  code-only run, because it dispatches more crafts, and the crafts that produce pages,
  diagrams and screens are the ones with the least exercised failure paths. This is not
  an exotic scenario; it is the expected one for the first months after this tree lands.
