id: ACD-400a-5
components:
  - ac_driven_dev
readiness: reviewed
priority: high
title: "A prerequisite that can itself be built still holds back its dependant, even when it also sits above it in the hierarchy"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the store holds a unit of work "P" that is buildable in its own right — it
    carries criteria of its own, the work it describes is work one builder does, and it
    reaches a completed state by being built rather than by the things beneath it
    reaching one — and P has not been completed,
  And the store also holds a composite "C" that is never handed to a builder as it
    stands and only reaches a completed state by the things beneath it reaching one,
  And a refinement "R" that sits directly beneath P in the store's hierarchy names P
    as the prerequisite it refines, and P's own record acknowledges R among the things
    beneath it — so P both has work of its own AND has something beneath it,
  And a separate refinement "S" that sits directly beneath C names only C as its
    prerequisite,
  And the store also holds "Q", buildable in the same sense as P and equally
    uncompleted, but with nobody yet named to build it, and a refinement "T" directly
    beneath Q naming Q as the prerequisite it refines,
  When the scanner is asked which work is ready to be picked up,
  Then R is not offered as ready, and the account of what is holding R names P,
  And S IS offered as ready, and nothing in the account of held work names C as
    holding S,
  And T is not offered as ready either, and the account of what is holding T names Q —
    a unit that reaches completion by being built holds its dependant whether or not
    anyone has yet been named to build it,
  And the only thing holding R is that P is not finished — R's position beneath P in
    the hierarchy neither adds a reason to hold R nor removes one.
depends_on: [ACD-400a, ACD-400a-3]
