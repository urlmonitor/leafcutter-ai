assigned_agent: python-coder
estimated_complexity: M
declares_side_effect: true
it_requirements:
  config_schema_fragment:
    fast_lane_producibility_verdict:
      type: object
      description: "Producibility verdict carried on the resolver's output and read by a guard sitting between the Resolve step and the claim step: {producible: bool, unproducible: [{ac_id: str, declared_producer: str|null, declared_proof: str|null, reason: str}]}. Every downstream step — claim, test-writer, coder, review, commit, pull request — is unreachable when producible is false. The terminal payload of a refusing run echoes each unproducible entry verbatim."
  reference_file_path: "templates/workflows-js/fast-lane-ship.js"
  n_location_rule: "2"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "The check runs on the resolved set, before the claim step (BO-2400f-7) and before the test-writer dispatch. Placing it later — after the claim, or after any agent dispatch — fails the criterion even if the message is identical, because the operator has already paid and the store already carries in_progress claims that must then be released."
    - "Do NOT presuppose a documentation phase. The producible predicate is 'some phase in this run's roster produces this member's declared deliverable and its declared proof', evaluated against the roster as it stands. If a documentation phase is added later (KI-BO-013 fix direction 1), doc-only members become producible and the refusal stops firing with no change to this criterion. Hard-coding 'documentation ACs are refused' would have to be undone by that work."
    - "Refusing is not skipping. The unproducible member must not be dropped from the set, must not be marked done, and must not be marked in_progress. There is no partial build: the run refuses the set it resolved, whole."
    - "The refusal is a distinct terminal outcome, not an 'ok' carrying a warning and not the pull-request outcome (BO-2400f-4-vi asserts a pull request exists; a refusing run opened none). Follow the single-construction-site precedent of buildFastLaneDeliveryOutcome so the refusal payload cannot drift between return sites."
    - "Fail closed on an unreadable verdict, by the same plain-falsy read the red-baseline gate_passed key already uses: a missing key, a null, or an unparseable resolver reply takes the refusing branch and reports that producibility could not be determined. No default-true, no `|| true`."
    - "Because the refusal precedes the claim, the run holds no claims and must NOT invoke the release step (BO-2400f-10) — a release on a run that claimed nothing would flip ACs another run legitimately holds."
    - "Covering tests must EXECUTE the lane under unit_tests/_workflow_engine_harness.py (run_workflow_under_e2 with label_responses), or run the resolver as a real subprocess, and assert on the recorded dispatches and the real store on disk. A test that greps fast-lane-ship.js or fast_lane.py for a phase name, a message string, or source-text ordering is NOT acceptable evidence and must be rejected at review: it passes on dead code, and this same lane already shipped a runner whose gates never executed behind exactly that kind of test (CLAUDE.md, 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep')."
delivers_to:
  agent: python-coder
  contract: "A producibility verdict computed with the resolved set and read by a guard before the claim step. Every later phase is reachable only on a verdict that lists no unproducible members; otherwise the run's terminal outcome is a refusal naming each unproducible member, its declared deliverable, and the absent phase."
expects_from:
  ac_id: BO-2400f-1
  contract: "The resolved connected build set — the dependency-ordered list of leaf AC ids, with each member's declared producer and declared proof obligation readable from the store."
test_required: true
test_spec:
  - name: test_unproducible_member_refuses_before_any_dispatch
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Executed under the E2 harness against a store whose resolved set contains one member the roster cannot produce, the run records no test-writer, coder, claim, commit or pull-request dispatch, and returns a refusal."
  - name: test_refusal_names_each_unproducible_member_and_the_absent_phase
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "The refusing run's terminal payload carries, for every unproducible member, its id, the deliverable or producer it declares, and that no phase in the roster produces it — not a count and not a stale-todo message."
  - name: test_refusal_is_not_reported_as_success_or_as_a_pull_request
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "The refusing run's terminal payload is a refusal outcome; it is neither an ok status carrying a warning nor an outcome asserting a pull request was opened."
  - name: test_refusal_does_not_build_the_producible_remainder
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "With a resolved set of three members of which one is unproducible, no coder dispatch occurs for the other two and the terminal payload reports no partial success — the set is refused whole, not trimmed."
  - name: test_unreadable_verdict_refuses_rather_than_proceeding
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "With the resolver stubbed to return a payload missing the producibility verdict, the run refuses and states that producibility could not be determined; it does not proceed to dispatch."
  - name: test_resolver_reports_unproducible_members_on_the_real_store
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Run as a real subprocess against an on-disk fixture store written the way the store is actually serialised, the resolver's own output lists the unproducible member with its declared producer and proof — proving the verdict is derived from real records, not from a hand-built dict."
test_rationale: |
  Every covering test here must EXECUTE the lane (run_workflow_under_e2 under
  unit_tests/_workflow_engine_harness.py) or run the resolver as a real subprocess
  against an on-disk store, and must assert on recorded dispatches, the terminal
  payload, and the files on disk. Grep-shaped tests over fast-lane-ship.js or
  fast_lane.py are explicitly forbidden for this criterion and must be rejected at
  review — they are not weaker evidence, they are no evidence: they pass unchanged when
  the guard is defined and never reached. This lane has already shipped exactly that
  failure once (CLAUDE.md, 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep'),
  and a second time in this family, where roughly 25 green unit tests plus a grep test
  stayed green for a month while the bundle layer never ran.

  The load-bearing test is the first one. A guard that computes a correct verdict and
  then dispatches the test-writer anyway satisfies every other assertion in this list.
