notes: |
  Satisfies the how-to entry in TQ-600a's documentation_triggers.

  THE CLAUDE.md CLAUSE IS THE URGENT HALF, NOT AN ADDENDUM. The standing rule is the
  surface that actually reaches authors today — it is loaded into every agent's
  context and it is where a human looks before adding a test. It currently ends with
  "Until that fixture exists, the prohibition alone applies", which is a promise about
  a future. The instant TQ-600a-1 lands, that sentence describes a repository that no
  longer exists, and the rule starts teaching authors to do nothing rather than to
  declare. A guide published beside an unreconciled rule leaves two accounts, and the
  louder one is wrong. This is why the clause is written as an absence — the sentence
  is gone — rather than as "the rule is updated": an absence is checkable and an
  update is a matter of opinion.

  WHY THE CRITERIA ARE READER OUTCOMES RATHER THAN "A GUIDE EXISTS". A file with the
  right name and the right headings satisfies a presence check while teaching nobody
  anything. Every clause here is something an author must be able to DO or SAY after
  reading, and the two that are fully mechanical — the missing CLAUDE.md sentence and
  the copy-runnable declaration — are the floor under the rest.

  WHAT IS NOT DECIDED HERE. Which file carries the guide. unit_tests/README.md and
  docs/testing/README.md are both plausible and both already exist; the CLAUDE.md
  reconciliation is required either way. That choice, and the sequencing after
  TQ-600a-1 and TQ-600a-5 land, are it-po decisions — a guide written ahead of those
  deliveries documents an intention, and a plausible intention is indistinguishable
  from a correct account until a reader tries the declaration.
