id: BP-1100g-4-ii
components:
  - build_pipeline
title: "A plan is not yet a hand-off: work still declared as only planned is not refused for a proof it has not reached the point of owing, and anything that cannot be read as still-planned is"
component: build-pipeline
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: critical
roadmap_phase: phase_1
criteria: |
  Given a piece of work whose plan promises a kind of proof,
  And that work declares itself as still only planned — not started, not
    offered for hand-off,
  And no test yet claims the promised kind,
  When the promise-versus-claim check runs over it,
  Then it is not refused, and the outcome states that the work was passed over
    because it is still a plan, so being passed over is distinguishable in the
    output from having been examined and found complete,
  And given the same work, with the same promise and the same absent claim, now
    declaring itself as started or as offered for hand-off,
  When the check runs again,
  Then it is refused exactly as before, naming the piece of work, the stated
    behaviour and the unclaimed kind — the point at which a claim falls due
    moves, and nothing about what counts as a claim moves with it,
  And given work whose declaration of its own state is absent, unreadable, or
    otherwise cannot be established,
  When the check runs,
  Then it is examined rather than passed over, because a state that cannot be
    read is not evidence of being early — the same posture this check already
    takes when it cannot read the work at all,
  And given work offered for hand-off whose every promised kind is claimed,
  When the check runs,
  Then it is not refused,
  And in no case does the outcome describe a piece of work that was passed over
    as one whose proofs were reached.
depends_on:
  - BP-1100g-4
