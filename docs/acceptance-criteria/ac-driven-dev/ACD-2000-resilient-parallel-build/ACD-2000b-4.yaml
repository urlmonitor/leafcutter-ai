id: ACD-2000b-4
components:
  - ac_driven_dev
readiness: draft
priority: medium
title: "Requirements whose change footprints overlap never build at the same time, and an unknown footprint conflicts with everything"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given four requirements available to build, where the first and second both
    change the same file, the third changes only files nothing else touches, and
    the fourth has no discernible change footprint at all,
  When an effort chooses what to build at the same time,
  Then it does not build the first and second together,
  And it may build the first and third together,
  And it does not build the fourth alongside anything, because its footprint
    cannot be established,
  And two separate efforts, running at the same time and choosing
    independently, likewise never end up building two requirements whose
    footprints overlap.
depends_on: [ACD-2000b, ACD-2000b-1, ACD-2000b-2]
