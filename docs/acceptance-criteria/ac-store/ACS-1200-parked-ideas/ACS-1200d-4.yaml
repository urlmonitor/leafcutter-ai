    description: "The document states that a parked record's child list must not be repaired without a decision to un-park the tree."
  - name: test_howto_describes_each_store_health_report_state
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    description: "Every state the orphan scan can emit is described, so a parked tree and a broken one can be told apart from the report alone."
