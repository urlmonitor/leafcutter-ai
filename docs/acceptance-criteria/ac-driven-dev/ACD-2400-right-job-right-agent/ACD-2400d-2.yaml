title: "The reference file a piece of work should follow is chosen by a step that opened it"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given a package-surface requirement assigned to python-coder whose work must follow the
    pattern of an existing file,
  When the file-aware step runs on it,
  Then the requirement names a reference file that exists at that moment,
  And the reference file is of the same file type as the deliverable and lives in the same
    area of the repository,
  And the step states in one sentence why it chose that file,
  And the technical planner's output for that requirement names no reference file.
