notes: |
  This L1 is the user's "also into neo4j" for OUTCOMES. Category records hold no
  outcome or success statistics. Those live only as derived, rebuildable Neo4j
  aggregates keyed by the published category id (ADR-065). Usage counts are
  generated from published records and freshness-checked, like
  docs/decisions/index.json, and are never hand-written.

  Optional store. Without a configured Neo4j store, or with
  LEAFCUTTER_SELF_LEARNING=false, outcome statistics are off and nothing else
  changes (phase_colony_1_collect exit criteria). The usage count does not
  depend on the store.

  NON-GOAL. These statistics do not change which categories DK-300d offers or
  in what order. That would be influence, which comes after held-out evaluation
  (ADR-056 section 3, phase_colony_4_influence).

  Depends on the DK-300d open question: counts are only as good as the record
  of which decisions reused which category.

  COMPONENT DRIFT. This L1 belongs in colony_memory too (docs/components.json
  lists it). It is omitted only because the components enum in
  config/ac_store_schema.json does not contain colony_memory, so the validator
  rejects it. Add colony_memory here once the schema enum is brought back in
  line with docs/components.json.
