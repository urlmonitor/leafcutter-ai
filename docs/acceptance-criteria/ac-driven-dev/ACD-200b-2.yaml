id: ACD-200b-2
components:
  - ac_driven_dev
  - ac_store
readiness: approved
priority: high
title: "The documentation-trigger names are declared in one list that the schema, the record check and the rule check all read"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the five documentation-trigger names how-to, reference-doc, sequence-diagram,
    state-diagram and component-diagram,
  When an L1 record declares documentation_triggers [reference-doc, api-guide],
  Then the store's schema check, the commit-time record check and the requirement rule check
    each reject "api-guide" as an unknown trigger name and accept "reference-doc",
  And the trigger names are declared in exactly one list, which the schema check and the
    record check both read, and the rule check's single trigger-to-specialist map has
    exactly one entry for each name in that list,
  And given a sixth name "api-guide" is added to that one list and given a specialist in the
    rule check's map, with no other edit,
  When the same record is checked again,
  Then all three checks accept "api-guide",
  And given a name is in the list but has no entry in the map, or has a map entry but is not
    in the list,
  When the project's tests run,
  Then a test fails naming that trigger name and the side it is missing from.
depends_on:
  - ACD-200b
  - ACD-2500a-2-v
