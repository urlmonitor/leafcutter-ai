created_by: "docs/acceptance-criteria/build-orchestration/BO-2200-documentation-coverage-guarantee/BO-2200a.yaml"
criteria: |
  Given the agent-side AC schema validator with both the enum-value check and the new
    L1-only check active,
  When it validates an L2 AC whose `documentation_triggers` contains only values that
    are themselves valid enum members (for example `reference-doc`),
  Then validation still fails, because the field is present on a non-L1 AC — a valid
    enum value does not exempt an off-level AC from the L1-only rule.
  And when it validates an L1 AC whose `documentation_triggers` contains an invalid
    value (for example `tutorial`), validation fails on the enum check even though the
    level is permitted.
  And the two rules are independent, so neither masks the other.
depends_on: [BO-2200a-5]
