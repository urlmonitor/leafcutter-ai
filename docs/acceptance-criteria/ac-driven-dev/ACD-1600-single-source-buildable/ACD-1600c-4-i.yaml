notes: |
  WHY THE ASYMMETRY. "Neither present nor marked" is a claim that cannot be true of any
  repository state, so it refuses. "Marked to be created but present" is often a stale
  marker or a name collision, but it can also be legitimate mid-build (the file was created
  by the work in progress), so it is reported, not refused. Finished work is exempt from the
  report entirely: the marker records intent at authoring time, and the work fulfilling it
  must not turn every later commit touching the record into noise.

  OPEN (for the user, see BA sign-off): a FINISHED requirement that declares an existing file
  which has since been deleted by other work -- refuse, report, or ignore. Not specified here.
