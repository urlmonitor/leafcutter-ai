id: ACS-1200c-3
components:
  - ac_store
  - commit_guardian
title: "A childless tree with no marker is still caught, because absence is not a decision"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200c.yaml
criteria: |
  Given a tree with the exact shape of a parked stub except for the marker: a
    root record at readiness: draft whose covered_by is an empty list, and two
    child records that it does not list, with no record in the tree carrying
    parked or parked_reason,
  And all three files staged for commit,
  When the parent-back-link check is executed as a process against that staged
    set,
  Then the process exits non-zero and reports a violation for each of the two
    children, naming each child and the root as its parent,
  And when the store-wide orphan scan is executed over a store containing that
    tree, both children are reported as orphans and the root is absent from the
    parked section,
  And neither surface treats an empty covered_by, a readiness of draft, a
    childless root, or any combination of the three as evidence of a deliberate
    decision,
  And adding the marker to the root — and nothing else — flips both verdicts,
    which is the only difference between this tree and a parked one.
depends_on:
