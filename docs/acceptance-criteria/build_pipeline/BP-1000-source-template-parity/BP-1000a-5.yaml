notes: |
  Root cause: commit 83737a44 (#164) git-untracked scripts/feedback/ without
  relocating its canonical source to a tracked templates/ home. The feedback
  manifest builder and the feedback deploy phase still read the gitignored
  scripts/feedback/, so a fresh clone / CI has no feedback source and the
  build's broken-reference preflight aborts. This AC moves the canonical source
  to the tracked templates/scripts/feedback/ mirror, matching commit_guardian
  (tracked templates/scripts/commit_guardian/) and doc_compliance (tracked
  templates/doc-compliance/).
  SCOPE BOUNDARY (do not conflate): this is about the build's READ source-of-
  truth for feedback. It is distinct from BP-1200a-1, whose Approach 1 keeps the
  DEPLOYED build-output directory scripts/feedback/ gitignored and bridges it to
  tests via a shim. Source-of-truth (tracked, templates/scripts/feedback/) and
  deployed output (gitignored, scripts/feedback/) are different directories with
  different lifecycles; no contradiction with BP-1200a-1.
change_target: pipeline
risk_surface: contract_boundary
