it_requirements:
  - "Assert from BOTH the deployed agent-template frontmatter AND config/agent_registry.json that find-structural-smells resolves to model 'sonnet' and find-design-smells to 'opus' — the two sources must agree."
  - "Assert each leaf agent invokes exactly two skills — the shared core review-for-code-smells plus its own bucket catalogue — parsed from skills_invoked in the registry and consistent with the template; a third skill or a wrong bucket fails."
test_required: true
