roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement moves between being attempted, reworked, escalated and
    resolved as its budget is consumed,
  When the architecture documentation for the requirement's adjudication
    lifecycle is consulted,
  Then a state diagram shows each state a requirement can be in with respect to
    its attempts, and every transition between them,
  And each transition names what causes it -- an attempt failing, a budget being
    exhausted, a person recording a decision,
  And the diagram shows the escalated state and the transition back out of it
    that a person's decision causes,
  And the diagram distinguishes a requirement that has never been attempted from
    one whose budget is spent, so the two are not read as the same resting state,
  And a reader can trace the path from a first failure to an escalation and back
    without consulting any other document.
