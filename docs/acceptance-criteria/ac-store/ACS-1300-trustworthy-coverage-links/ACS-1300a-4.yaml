  - "NO COUNTS, NO MEASUREMENTS. Provisional figures live in the ACS-1300 L0 notes with their method and denominator. A how-to pinned to a number rots on the next commit that changes it; this repository already carries a hand-typed '244 of 607' in the artifact map as the worked example."
