id: BO-202
components:
  - build_orchestration
readiness: reviewed
priority: medium
title: "Auto-fix work_status and implemented_by/covered_by when diff evidence exists"
component: build-orchestration
status: active
created_by: "tickets/99_done/TICKET-20260605-ACFulfillmentGate.md"
criteria: |
  Given an AC YAML file referenced in ac_traceability has work_status: todo
  And the branch diff contains file paths that intersect with the ticket's files_touched
  When the ac-fulfillment-gate agent detects this matching evidence
  Then, when the AC is a leaf (its covered_by lists no child AC ids),
    it sets work_status to done in the AC YAML file
  And it populates implemented_by with file paths from the diff
    that intersect with files_touched
  And it populates covered_by with test file paths from the diff
    that contain a "# covers: <AC-ID>" tag matching this AC's ID

  Given an AC YAML file referenced in ac_traceability whose covered_by lists
    one or more child AC ids (a composite, at any level from L0 to L3)
  And the branch diff contains file paths that intersect with the ticket's files_touched
  When the ac-fulfillment-gate agent detects this matching evidence
  Then it sets work_status to done only when every child AC is done and proven
    done by the same rule the commit-time done-proof check applies to a done
    composite
  And when the composite has work_status: todo or in_progress and any child is
    not yet done and proven, it sets work_status to in_progress
    and the sign-off comment names each unfinished child
  And when the composite already has work_status: done and any child is not
    done and proven, it refuses the update with a report naming each unfinished
    child, and it never lowers work_status silently

  Given an AC YAML file already has entries in implemented_by or covered_by
  When the auto-fix runs
  Then it appends new entries without overwriting or removing existing entries
    (append-only behavior)

  Given the auto-fix has already been applied to an AC YAML file
  When the ac-fulfillment-gate agent runs again on the same diff
  Then no duplicate entries are added (idempotent behavior)
  And the resulting YAML passes check_ac_schema.py validation

  Given the auto-fix modifies one or more AC YAML files
  When the ac-fulfillment-gate agent signs off
  Then the sign-off comment lists each auto-fix action performed
    (AC ID, fields updated, values added) for auditability
level: L2
work_status: todo
origin_agent: BrainCandy
notes: |
  REOPENED 2026-08-25 (was work_status: done). Filed as KI-ACD-003 and KI-ACD-019.

  The criterion says the gate "populates covered_by with test file paths from the diff that
  contain a '# covers: <AC-ID>' tag matching this AC's ID". It carries no L2-only qualifier
  and no directory qualifier, and it says FROM THE DIFF. Two independent reasons the
  implementation cannot honour it, both in templates/agents/ac-fulfillment-gate.md:

    :227-229  "### 3c. Auto-fix covered_by (L2 ACs only)"
    :201      "L3 ACs: skip this check (empty covered_by is permitted)"
    :232      the tag search is  grep -r "# covers: <AC-ID>" tests/

  So an L3 AC is skipped outright, and for anything else only tests/ is searched. Observed on
  ACD-1900b-5-i, which is L3: the gate returned ok, left covered_by: [], and all six of its
  "# covers:" tags were in unit_tests/ac_driven_dev/ -- a directory the grep never visits.
  done_proof.verify_done_eligible independently returned eligible: True with all five test
  node-ids listed, so the proof existed and was discoverable; the gate simply did not write it.

  Why it survived: BO-202's only covered_by entry, tests/test_ac_fulfillment_gate.py, holds 18
  tests and every one of them is a frontmatter or registry assertion -- test_model_is_sonnet,
  test_priority_is_11_7, and so on. Not one exercises the auto-fix this criterion is about.

  BO-201 is NOT falsified by the same defect and should not be reopened alongside it: its
  equivalent clause explicitly exempts L3 ACs, so it is honestly satisfied. Closing BO-202
  means either extending the gate to L3 and to unit_tests/, or narrowing this criterion to
  match BO-201's wording -- and stating which was chosen.
superseded_by: null
amended_by:
  - date: 2026-10-06
    agent: business-analyst
    reason: "user decision 2026-10-06, flag F6 (build-tooling fix design, sections 5 and 8; delivered by ticket T6). Field evidence: the gate set DK-400a-1 from todo to done on diff evidence alone, while its covered_by held only child AC ids (DK-400a-1-i, DK-400a-1-ii). The gate treated only L0/L1 as composite and counted any non-empty covered_by as coverage. The first scenario's done rule now applies to leaves only, which is today's behaviour. A scenario was added for composites, defined as in the commit-time done-proof check: covered_by holds child AC ids, at any level. A composite is set done only when every child is done and proven by that check's rule. A todo or in_progress composite with an unfinished child goes to in_progress and the sign-off names the unfinished children. An already-done composite with an unproven child is refused, never silently downgraded. This is consistent with approved BO-2500b-1-ii. The implemented_by, covered_by, append-only, idempotence and audit scenarios are unchanged. readiness (reviewed) and work_status (todo, reopened 2026-08-25) were left untouched. The reopen question in notes (extend the gate to L3 and unit_tests/, or narrow the covered_by clause) is still open and is not settled by this amendment."
  - date: 2026-10-06
    agent: it-po
    reason: "it-po-build-tooling-fix: user decision 2026-10-06, flag F6 (build-tooling fix design, sections 5 and 8; ticket T6). Criteria untouched. Added doc_links and assigned_agent python-coder. The executable surface is scripts/ac_store/mark_ac_done.py, the one writer the gate calls; the edit to templates/agents/ac-fulfillment-gate.md is a companion llm-expert surface named in it_requirements. Also added estimated_complexity M and a structured it_requirements object, required because this AC is package-surface (python-coder + build-orchestration). It names mark_ac_done.py as the one writer, the composite helper shared with check_done_proof (_composite_child_ids / _unproven_composite_children), the gate's Step 3a call (mark_ac_done.py --ac <id> --test-root .), the composite outcomes, leaf preservation, anchored writes, idempotence and ADR-001 parity. Also added test_required true, a seven-case test_spec from design section 5, and test_rationale. readiness (reviewed), work_status (todo), change_target, covered_by and implemented_by untouched. Gap reported to the coordinator, not authored here: finalize-feature.js and build-ac call mark_ac_done without --test-root. No existing AC covers that; BO-2500b-1-ii is the commit-time check and ACD-600a is the script's own --ac/--ticket contract."
