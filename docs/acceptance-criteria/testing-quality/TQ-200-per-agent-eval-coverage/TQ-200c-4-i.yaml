notes: |
  THE THREE FAILURES ARE ONE OBSERVABLE. An orphaned set, a dangling registration and
  an untriggerable set all produce the same thing: nothing ever runs and nothing ever
  fails. That reads identically to full coverage from outside, which is why each is
  named as its own gap in the criteria rather than left to be caught by a general
  "the runner should find it" statement.

  THE THIRD CLAUSE IS THE NON-OBVIOUS ONE AND THE MAIN REASON THIS L3 EXISTS. Verified
  2026-08-18: eval selection is glob-driven. TQ-200b-3 (done) intersects a change's
  file list against each agent's `triggers` in scripts/evals/agent_eval_config.json,
  and only affected evals run. Registration and reachability are therefore separate
  properties: an entry can be perfectly well-formed, point at a real non-empty set,
  and still be selected by nothing, because its trigger globs do not cover the
  agent's own template or the material its rows depend on. Compare the three
  configured agents — every one of them lists its own template first in `triggers`.
  An entry added without that line is invisible to every run and looks green forever.

  WHY THIS IS NOT ALREADY COVERED BY TQ-200b-4. TQ-200b-4 makes a missing or stale
  result a hard failure for a TRIGGERED agent, and its own criteria say the affected
  agents are enumerated deterministically from the trigger manifest. Everything it
  guarantees is downstream of being in that enumeration. The failures here are
  failures to be in it at all, so b-4's guarantee is vacuously satisfied by them.
  Recorded here so an implementer does not close this L3 by citing b-4.

  WHY NOT COVERED BY TQ-200a-1 EITHER. a-1 reports an in-scope agent with NO set as a
  gap. All three cases here have something on disk that a naive coverage count would
  accept — a file of rows, or a config entry, or both. The extension is deliberate
  and stated in the doc_link so the two rules stay one idea rather than drifting.

  THE FOURTH CLAUSE PREVENTS PER-AGENT ROUNDING. Coverage reported per agent rather
  than per set lets one reachable row mask an unreachable sibling. Given that
  scripts/evals/agent_eval_config.json holds one entry per agent today, per-agent
  reporting is the natural implementation and the natural bug.

  BOUNDARY. This L3 reports gaps. It does not decide whether a gap blocks a merge —
  that is TQ-200b-4's territory — and it does not create rows or sets, which is its
  parent's.
