notes: |
  WHY THIS IS ITS OWN RECORD RATHER THAN A CLAUSE OF ITS PARENT. Every arm of GE-127g-1
  uses the directory exactly as a regeneration leaves it, which exercises whichever
  comparison the gate happens to reach first. This record is the only place the two
  comparisons are driven separately, with a document chosen for each. Its named mutation
  reddens this record alone and leaves every parent arm green, which is the asymmetry that
  earns a separate file.

  WHY THE OBSERVED SYMPTOM LANDS ON THE GROWTH ARM AND NOT THE CROSSING ARM, AND WHY THE
  FIRST ARM'S NUMBERS ARE REAL RATHER THAN ILLUSTRATIVE. Three of the 65 generated
  documents were already above the limit as last committed — 2,525, 635 and 340 — and this
  worktree was found with all three ALREADY rewritten longer by a regeneration that ran
  during provisioning, to 2,809, 639 and 355, before any record in this subtree existed and
  carrying only unrelated records' assignment lines. For those three, no commit can satisfy
  a crossing check because they have already crossed; the only comparison that applies is
  the ratchet, and the only way a regeneration passes it is to leave them no longer than it
  found them — which a regeneration sweeping in unrelated accumulated work cannot do. So a
  fix that only exempts the crossing check leaves the reported halt in place for exactly the
  three documents that caused the report. The first arm's 2,525 and 2,809 are that
  observation, not an invented example.

  THE SECOND ARM IS PROSPECTIVE AND IS STATED ANYWAY. No generated card crossed the limit in
  the observed regeneration; the nearest went 268 to 276, and the generated roadmap mirror
  stands at 286 against the same 300. The arm exists because the crossing refusal is a
  separate comparison with a separate exemption point, and because both of those documents
  will cross on a later regeneration. A record that covered only the live arm would have to
  be reopened then.

  NOTE ON THE NUMBERS FOR WHOEVER WRITES THE TESTS: 2,525 / 268 / 340 are the lengths as
  last committed and 2,809 / 276 / 355 the lengths after that regeneration, both measured in
  this worktree on 2026-10-09 as raw line counts with no exclusions. Do not pin any of them
  as a constant — the population and its lengths move every time an agent or an assignment is
  added, which is GE-127g-1's second arm. What must be preserved is the SHAPE: already over
  and growing, under and crossing, each driven separately.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM.

  (1) THE HALF FIX. MUTATION: consult the set-aside membership test only before the
      crossing comparison, leaving the growth comparison to run on every document.
      MUST GO RED: the second arm only.
      MUST STAY GREEN: the first and third arms, every arm of GE-127g-1, and every arm of
      GE-127g-3. This is the mutation most likely to ship by accident and the one no other
      record in this subtree catches.

  (2) THE MIRROR HALF FIX. MUTATION: consult the membership test only before the growth
      comparison.
      MUST GO RED: the first arm only.
      MUST STAY GREEN: the second and third arms and the parent's arms. Stated so the
      implementer sees that each arm has its own independent mutation and neither is
      decorative.

  (3) THE OVER-WIDE EXEMPTION. MUTATION: set both comparisons aside for every document
      under docs/.
      MUST GO RED: the third arm, and every arm of GE-127g-3.
      MUST STAY GREEN: the first and second arms. The third arm is this record's negative
      control and the reason it names which document must be reported rather than only
      that the commit is refused.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect.
