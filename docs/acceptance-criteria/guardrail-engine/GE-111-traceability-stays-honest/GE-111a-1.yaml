notes: |
  GE-111a owns the BLOCK-the-commit enforcement action. The detection verdict
  (what counts as a broken link) comes from GE-111b; the message wording comes
  from GE-111e; the scope of which links are evaluated comes from GE-111c. This
  AC asserts the enforcement consequence: a drift verdict blocks, a clean verdict
  proceeds.

  IT-PO enrichment (2026-06-22): this is the single hook entry point. The
  hook script orchestrates GE-111c (scope) -> GE-111b (verdict) -> GE-111a
  (block decision) -> GE-111e (message). One script, single non-zero/zero exit.
change_target: code
