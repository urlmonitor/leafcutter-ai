  note: >-
    Unnamed-referent defect on an irreversible deletion, found by a store-wide
    scan for the shape that damaged BO-2900g-3. "The five identifiers" were named
    nowhere an implementer is required to look: the criteria say only "five
    identifiers", and the one constraint that points at a scope list read "SCOPE IS
    THE FIVE THE CRITERIA NAME" — pointing at a list that does not exist there. The
    five appear only in `notes`, which is commentary. An implementer following that
    pointer, finding nothing, and re-deriving the set from a fresh scan gets a
    DIFFERENT set (GE-122a-2's own it_requirements record that the count depends on
    an identifier rule that is still open, and the record already knows an
    epic-qualified rule surfaces EPIC-MoveOnMainOnly as a sixth) — and then deletes
    ticket files, irreversibly, outside the scope the user set. Fixed by pinning the
    scope in it_requirements rather than in the criteria, because the criteria are
    deliberately written in the store's abstract register and five literal filenames
    do not belong there, whereas it_requirements is where this store already carries
    file-level specifics. The constraint now enumerates all five and says the LIST,
    not a scan, is the scope, with a fresh scan that disagrees to be reported rather
    than repaired. One criteria clause added to make the same rule behavioural and
    therefore testable, and a matching negative-control test_spec descriptor added.
    Nothing else changed; the survivor rule, the content-preservation clause and the
    out-of-scope cases are untouched.
