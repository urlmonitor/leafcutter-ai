id: INF-600b-3
title: "A card is a picture of its agent and of nothing else, so adding an acceptance criterion moves no card"
component: infrastructure
components:
  - infrastructure
  - build_pipeline
  - agent_registry
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the build produces one card document per agent, assembled from that
    agent's own declared facts — the description it carries, the facts table
    naming its model and tier and whether it is portable and sign-off capable,
    the agents it is dispatched by, its knowledge channels, its input and
    output contract, the tools it may use, the skills it uses and its spawn
    diagram,
  And the acceptance-criteria store holds records that name an agent in their
    assigned_agent field,
  When a build regenerates every card and each resulting document is read,
  Then no card names an acceptance criterion anywhere in it, and no card
    carries a section listing the criteria assigned to its agent.

  And given that same regeneration held as the comparison point,
  When one acceptance criterion naming an existing agent in its assigned_agent
    field is added to the store, nothing else in the project changes, and the
    build runs again,
  Then every card document is byte-for-byte identical to the one the preceding
    build produced, and the number of cards the build reports as changed is
    zero — so a change confined to the acceptance-criteria store moves no card.

  And given instead that one acceptance criterion already naming that agent is
    retitled, a second is removed from the store, and a third has its
    assigned_agent changed from one existing agent to another, with nothing
    else in the project changing,
  When the build runs again,
  Then every card document is again byte-for-byte identical to the preceding
    build's — so what is established is the card's independence from the store
    in all three directions, and not merely that one added record happened not
    to reach it.

  And given the same regeneration as the first scenario,
  When each card is read in full,
  Then every card still states its agent's description, still carries the
    facts table naming its model and tier, still lists the tools it may use
    and the skills it uses, and still carries its spawn diagram,
  And the longest card stands below the length the size standard applies to a
    document a person writes, where three cards stood above that length before
    — so a card is shorter because one derived section is gone, and not
    because the agent's own facts went with it.

  And given an agent whose template description is amended, with nothing in
    the acceptance-criteria store changing,
  When the build runs again,
  Then that agent's card differs from the preceding build's and every other
    card is byte-for-byte identical — so the card still follows its agent, and
    none of the scenarios above is satisfied by a build that stopped producing
    cards at all.
