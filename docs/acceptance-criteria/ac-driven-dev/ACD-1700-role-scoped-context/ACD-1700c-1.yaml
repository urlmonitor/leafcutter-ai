    target_dir: unit_tests/ac_driven_dev/
    framework: pytest
    type: unit
    description: "Rendered brief contains the three labelled sections: role template, reproducible shared channels, AC-graph task context."
  - name: test_ac_graph_context_includes_all_relationship_groups
    target_dir: unit_tests/ac_driven_dev/
    framework: pytest
    type: unit
    description: "AC-graph task context includes parent chain, dependencies, dependents, siblings, and linked docs for the target AC."
  - name: test_graph_traversal_uses_canonical_derive_parent_id
    target_dir: unit_tests/ac_driven_dev/
    framework: pytest
    type: unit
    description: "Parent-chain traversal uses the canonical derive_parent_id() helper rather than a re-implemented parent rule."
