risk_surface: safety
test_required: true
it_requirements:
  - >-
    THE ENTRY MUST GO IN THE SAME CHANGE THAT MAKES THE REFERENCE RESOLVE. The excusing entry is
    the string "scripts/scaffold/new_arch_doc.py" in EXTERNAL_DEPENDENCY_ALLOWLIST
    (scripts/build_propagation_audit.py, with the inline comment conceding the absence "causes a
    hard user-visible failure"). Removing it earlier breaks the build; removing it later leaves a
    window in which the guard is excusing a reference that needs no excuse, and that window is
    what the last criterion forbids.
  - >-
    MEASURED — _suggest_action WILL LIE UNLESS ITS PREFIX TUPLE IS UPDATED TOO.
    _PREFIXES_WITH_EXISTING_DEPLOY_PHASE is currently exactly
    ("scripts/ac_store/", "scripts/feedback/", "scripts/commit_guardian/"). Once a scaffold
    deploy phase exists, "scripts/scaffold/" must be added to that tuple in the same change.
    Without it, a future absence of this source reports the untruthful action "add a deploy
    phase in build_phases.py" when the deploy phase already exists and the real fault is a
    missing or untracked source. The guard reporting the wrong remedy is a quieter version of
    the guard not reporting at all.
  - >-
    BOTH RUNS ARE MANDATORY AND MUST BE ONE OBSERVATION WITH SHARED SETUP. Delivered → silent,
    and withheld → reported. A test asserting only the silent run is passed identically by a
    guard that was removed, renamed, never executed, or still carrying the excusing entry — so
    it is a no-op dressed as a gate. This is the same movement construction INF-1200c-1 and
    BP-900c-4-i already settle for other subjects; reuse it rather than reinventing it.
  - >-
    THE WITHHELD RUN MUST WITHHOLD THE MEANS, NOT THE REFERENCE. Suppress the deploy phase's or
    the manifest helper's contribution so the path leaves the deployable set. Deleting the
    reference from the authoring surfaces instead would make the guard silent for the opposite
    reason and would prove nothing — it is the inverse experiment wearing the same green.
  - >-
    THE TWO RUNS MUST DIFFER IN EXACTLY ONE INPUT. Any second difference between them makes the
    contrast unattributable and the observation worthless.
  - >-
    STATE MUST BE RESTORED AFTER THE OBSERVATION, INCLUDING ON FAILURE. The allowlist, the
    deploy phase and the manifest must be byte-identical to their committed form when the test
    completes. Use the framework's teardown, never trailing statements that an assertion failure
    skips past.
  - >-
    KNOWN_UNDEPLOYED_ALLOWLIST MUST STAY EMPTY. This reference must not be relocated there as a
    way of keeping the guard quiet. That set's own comment states an entry in it is a regression
    and not a fix: it means shipping an agent that cannot run. Moving the entry rather than
    deleting it satisfies the letter of the last criterion and inverts its purpose.
  - >-
    SCOPE FENCE — GUARD-LEVEL RESOLUTION IS NOT RUNTIME REACHABILITY. The audit resolves
    references in a layout-agnostic "scripts/<rel>" key space, so a resolving key does NOT
    establish that the path the arrived instruction states resolves from where an adopting
    project's authors work. That is INF-1300e-2's, and it is measurably still false as of
    2026-09-14. This record must not be read, tested, or signed off as covering it.
  - >-
    DO NOT AMEND BP-900b-1-1. It owns the allowlist and is already work_status: done. The edit
    is booked under this record; the placement question is raised in the enrichment report for
    the user, not decided by the implementer.
test_spec:
  - name: test_guard_is_silent_on_the_scaffold_reference_when_the_means_is_delivered
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: criterion
    description: >-
      With the means deployed and no excusing entry present, the propagation audit reports
      nothing about scripts/scaffold/new_arch_doc.py. Half of the movement, worthless alone.
  - name: test_guard_reports_the_scaffold_reference_when_the_means_is_withheld
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: failure
    description: >-
      Changing exactly one input — withholding the means from the deployable set — and running
      the same unchanged guard again makes it name this reference. This is the half that
      distinguishes a watching guard from a blind one.
  - name: test_no_excusing_entry_for_the_scaffold_reference_remains_in_either_allowlist
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: criterion
    description: >-
      The string scripts/scaffold/new_arch_doc.py is absent from BOTH
      EXTERNAL_DEPENDENCY_ALLOWLIST and KNOWN_UNDEPLOYED_ALLOWLIST — closing the relocate-rather-
      than-delete evasion — and KNOWN_UNDEPLOYED_ALLOWLIST is still empty.
  - name: test_withheld_scaffold_source_is_reported_with_the_commit_under_templates_action
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: boundary
    description: >-
      The report entry from the withheld run carries the truthful remedy — commit the source
      under templates/scripts/ — rather than "add a deploy phase", proving
      _PREFIXES_WITH_EXISTING_DEPLOY_PHASE gained scripts/scaffold/.
test_rationale: >-
  The contract is a movement, not a state, because the state is ambiguous: once the means ships,
  a guard that watches this reference and a guard that cannot see it produce byte-identical
  silence. Descriptors 1 and 2 are therefore one test in two halves and neither is meaningful
  alone — descriptor 1 is exactly the evidence shape this repository has repeatedly recorded as
  a check that examined nothing, and it is passed by deleting the guard. Descriptor 3 exists
  because the last criterion has a cheap evasion the first two cannot see: relocating the entry
  to KNOWN_UNDEPLOYED_ALLOWLIST keeps the guard quiet while both runs behave, so the allowlists
  must be read directly and both of them. Descriptor 4 covers the quieter failure where the
  guard does report but names the wrong remedy, which is a measured consequence of
  _PREFIXES_WITH_EXISTING_DEPLOY_PHASE not gaining the new prefix and is invisible to a test
  that only asks whether an entry was emitted.
delivers_to: null
expects_from:
  ac_id: INF-1300e-1
  contract: >-
    A propagation-audit manifest key of exactly "scripts/scaffold/new_arch_doc.py", contributed
    by a manifest helper that mirrors the new deploy phase, plus a documented way to suppress
    that single contribution so the withheld run can be constructed by changing one input. The
    removal here is only correct if this exact key is what resolves the reference; if the
    delivered key differs in any character the entry must NOT be removed, and the mismatch is a
    blocker to be raised rather than papered over.
