notes: >-
  Observed 2026-09-14: roughly 150 live workspaces and no stated way to judge any one of
  them. The five triggers are listed as independently sufficient because each is a
  separate way work has been lost -- a commit that never left the branch, and a stash
  belonging to a workspace nobody could attribute, are different losses with different
  detections. Coverage of the WHOLE live set is asserted rather than the verdict for one
  workspace, because a per-workspace answer that nothing calls for all 150 leaves the
  accumulation exactly where it was.
