    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-016-ci-fresh-clone-test-dependencies.md
    relationship: describes
    status: exists
assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - "The proof-of-done CI job must be added to the protected-branch required status checks (the `require-ci-lint` ruleset on main, id 17810993 — see project memory: main required checks = ruleset), so a failing verdict blocks merge."
  - "The required check must not be author-bypassable (unlike the local pre-commit hook), and auto-merge must not land a PR while the check is failing/pending."
  - "The check name registered in the ruleset must exactly match the CI job name emitted by BO-2500b-2, or the required-status wiring silently never gates."
delivers_to: null
expects_from:
  ac_id: BO-2500b-2
  contract: "The named CI proof-of-done job whose status is promoted to a required, non-bypassable status check on the protected branch."
