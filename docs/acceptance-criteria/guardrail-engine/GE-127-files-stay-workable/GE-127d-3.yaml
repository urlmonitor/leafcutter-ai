it_requirements:
  - >-
    THE FIX IS A STRING-AWARE SCANNER, NOT A LANGUAGE PARSER, AND MUST STAY
    PROPORTIONATE. Replace the three bare module-level regexes
    (_TRIPLE_DOUBLE_QUOTE_RE, _TRIPLE_SINGLE_QUOTE_RE, _BLOCK_COMMENT_RE) with
    a single-pass, state-tracking scanner that recognises exactly four kinds
    of span while walking the content once: a triple-quoted string (either
    Python quote style, discarded), a block comment (discarded), and a
    single-quoted, double-quoted or backtick-delimited string literal (kept
    verbatim, navigated over so a delimiter-lookalike sequence inside it is
    never mistaken for a real discard-region start). Do not attempt to
    tokenize a full language grammar (no operator precedence, no nested
    template-literal expression awareness, no regex-literal detection) — this
    is a measurement helper and the scope is bounded to the three flavours
    named in the criteria plus the two Python quote styles already in force.
  - >-
    A SINGLE/DOUBLE-QUOTED LITERAL TERMINATES AT AN UNESCAPED CLOSING QUOTE OR
    AT AN UNESCAPED NEWLINE, WHICHEVER COMES FIRST; A BACKTICK LITERAL NEVER
    TERMINATES AT A NEWLINE. Backslash-escaped characters (an escaped quote,
    an escaped backslash) are consumed as a pair so an escaped quote can never
    end the literal early. This asymmetry matters: JS/Python single- and
    double-quoted strings cannot legitimately contain a raw, unescaped
    newline, so terminating at one is a safe heuristic; a JS template literal
    legitimately spans many lines and must not be truncated by one.
  - >-
    PYTHON DOCSTRINGS MUST KEEP WORKING, UNCHANGED, FOR EVERY FILE THAT
    CONTAINS NO STRING-EMBEDDED DELIMITER-LOOKALIKE. This same counter
    measures every tracked .py file, and the overwhelming majority of the
    guard's own population (200+ files already in GE-127b-1's ratchet) is
    Python with no JS-style string content at all. The fix must be verified to
    produce the IDENTICAL count to the pre-fix implementation on every such
    file — a regression here would newly refuse or newly permit commits on the
    guard's own largest population for a reason nobody asked for. Do NOT
    additionally discard '#' comments or count discarded regions differently
    from GE-127d-2's published rule; only the string-awareness changes.
  - >-
    A REAL, UNTERMINATED TRIPLE-QUOTE OR BLOCK COMMENT (ONE WITH NO CLOSING
    DELIMITER ANYWHERE IN THE FILE) IS DISCARDED TO END OF FILE, MATCHING THE
    OLD IMPLEMENTATION'S OBSERVABLE OUTCOME ON A MALFORMED FIXTURE AS CLOSELY
    AS A SCANNER CAN. This is a corner case on malformed source and is not
    separately tested; it is named so an implementer does not "fix" it into a
    different behaviour as a side effect of the string-awareness change.
  - >-
    BLAST RADIUS MUST BE MEASURED AND REPORTED, NOT ASSUMED. The corrected
    counter is STRICTER wherever a file was being under-measured due to a
    phantom-discarded span, so some files' quoted length may increase. Measure
    every tracked .py/.js/.sql/.ts/.tsx/.sh file with the OLD and the NEW
    counter, report how many files' count changes at all, which change by more
    than 5 lines, and which newly cross their configured per-extension limit
    in commit_guardian.json as a result. This record's own notes record the
    measured figures at authoring time; a later re-measurement that finds a
    different population is not a contradiction, it is drift to be recorded
    fresh.
  - >-
    HOST, LAYERING AND THE BUILD. The scanner lives inside
    templates/scripts/commit_guardian/_file_size_ratchet.py, the same module
    GE-127b-1 and GE-127d-2 already modify — build_commit_guardian copies that
    directory whole, so no scripts/build_phases.py deploy entry is needed.
    templates/scripts/commit_guardian/ is canonical and tracked;
    scripts/commit_guardian/ is an UNTRACKED build output regenerated by
    build.py and must not be hand-edited.
  - >-
    ONE MEASUREMENT FUNCTION, EVERY CALL SITE UNCHANGED. count_content_lines's
    signature and every existing caller (measure_current_length,
    get_previous_length, resolve_previous_lengths, and
    describe_measurement_rule's category probes) must not change — only the
    internal stripping mechanism does. GE-127b-1's ratchet, GE-127a-1's
    threshold comparison and GE-127d-2's published-statement generation all
    inherit the fix with no call-site change required.
  - >-
    THE INDEPENDENT RE-DERIVATION ENGINE IN
    unit_tests/commit_guardian/_ge_127d_2_fixture.py IS DELIBERATELY OUT OF
    SCOPE. It is coded with its own regexes, on purpose, so that GE-127d-2's
    reproducibility descriptors prove agreement between two independent
    implementations rather than calling the same function twice. None of its
    existing fixtures embed a string-delimiter-lookalike sequence, so it is
    unaffected either way; do not "fix" it as part of this record.
  - >-
    Must follow the repo error-handling policy. The scanner and its helpers
    are pure functions over an in-memory string with no I/O, no external
    service calls and no shared-state mutation, so per Rule 4 they must NOT be
    wrapped in try/except — a malformed or unusual string is handled by the
    scanner's own heuristics (terminate at newline, run to end of file), never
    by catching an exception that pure string indexing cannot raise here.
test_spec:
  - name: test_ge_127d_3_a_block_comment_opener_inside_a_js_template_literal_does_not_discard_real_lines
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      THE RED BASELINE AND THE EXACT REAL-ARTIFACT SHAPE — WRITE THIS ONE
      FIRST. Build content reproducing templates/workflows-js/fast-lane-ship.js's
      own shape: a backtick template literal containing the substring
      "changelogs/*.md", followed by several lines of real code, followed by a
      genuinely separate real block comment that closes with "*/", followed by
      more real code. Call count_content_lines() directly. The returned count
      must equal the number of lines that are not part of the REAL block
      comment — every line between the template literal and the real block
      comment must be counted, not silently discarded. Genuinely RED against
      the pre-fix implementation: the pre-fix regex opens a phantom span at the
      template literal's "/*" and swallows every line up to and including the
      real block comment's own "*/", undercounting by the number of lines in
      between.
  - name: test_ge_127d_3_a_block_comment_opener_inside_a_double_quoted_js_string_does_not_discard_real_lines
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      The same shape as the template-literal descriptor, with the "/*"
      -carrying string written as an ordinary double-quoted JS string literal
      instead of a backtick one. The returned count must equal the number of
      non-discarded lines; genuinely RED against the pre-fix implementation
      for the same reason.
  - name: test_ge_127d_3_a_block_comment_opener_inside_a_single_quoted_js_string_does_not_discard_real_lines
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      The same shape again, with the "/*"-carrying string written as a
      single-quoted JS string literal. The returned count must equal the
      number of non-discarded lines; genuinely RED against the pre-fix
      implementation for the same reason.
  - name: test_ge_127d_3_a_triple_quote_lookalike_inside_a_js_string_does_not_discard_real_lines
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Guards the symmetric hazard the criteria name but the three descriptors
