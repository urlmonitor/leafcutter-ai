criteria: |
  Given the persona context injection involves: harness startup, persona directory scan, summary generation, agent spawn, and optional on-demand detail loading
  When the architecture diagram author produces the sequence diagram
  Then the diagram shows the following interactions:
    - Harness reads docs/personas/ directory at startup
    - Harness generates a persona summary from each persona.yaml identity section
    - At agent spawn, harness checks if the agent ID is in persona_injection_agents
    - If yes, harness injects the summary into the agent's context
    - During execution, agent may invoke persona-detail skill for full content
    - Skill reads the requested persona.yaml and returns formatted content
  And the diagram is a Mermaid sequence diagram placed in docs/architecture/
