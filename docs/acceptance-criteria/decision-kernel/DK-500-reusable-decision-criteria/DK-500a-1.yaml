notes: |
  USER REQUIREMENT (2026-10-02, decided directly by the user; no decision record exists for it): mining reads BOTH published decision records AND the Langfuse run history of kernel runs, including failed, cancelled, waiting and never-published runs. It is an OFFLINE job that produces CANDIDATES only. Do not drop either source.
  Flow node: leafcutter/criteria-library step mine. Data: mock leafcutter/criterion-categories, record cat-1dc11c5a2ffa7310 (its mined_from entries are the sightings named above).
  Deliberately NOT asserted here: how sightings become one candidate (that is grouping, DK-500b) and the minimum number of sightings that makes a question "recurring" (open; see the run's open questions). The trigger in this AC is a person starting the job on demand, as the flow's acceptance scenario says; whether it is also scheduled is open.
  Where candidates are kept between the mining run and a person's review is open: the mock data keeps them out of both the run root and Git (run_id, staged_path and record_path are null while candidate).
  FLOW BACK-LINK (for step.implements, to be applied by the store owner): leafcutter/criteria-library: mine.
  Authored by the business-analyst stage of /plan-feature (route strategic) under decision dec-93c1c730463c1f3c; readiness draft, no product approval implied.
  IT PO (2026-10-05): settled for this AC, as IT PO defaults to confirm with the user: the recurrence threshold (Q4: at least 2 distinct occurrences, config key) and where candidates wait (Q5: the machine-local mining store .leafcutter/criteria-mining/, outside Git and the run root). The trigger stays on demand (python -m kernel criteria mine); no scheduler is added. Grouping of sightings follows dec-a070edfb6465bced.
