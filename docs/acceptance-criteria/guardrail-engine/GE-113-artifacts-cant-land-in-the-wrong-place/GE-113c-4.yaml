assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- Canonical source templates/scripts/commit_guardian/check_mermaid_parent_link.py.
- The check gets the project root only through the shared resolver of GE-113c-1-iv; no Path(__file__).parents[N]
  root remains in it.
- The proof runs the built, installed copy the way .pre-commit-config.yaml invokes it, in a temporary
  repository with staged fixture documents, independent of the developer's working tree.
- The 'read none of its targets' outcome reuses GE-120a-4's mechanism; no second implementation.
- Canonical sources only; deployed and installed copies are regenerated by the build and never hand-edited
  (ADR-001).
- Before merge, run the working check once over every existing architecture document. c2-001 to c2-006
  are fixed by GE-113c-4-i (land together, or record a known issue pointing at GE-113c-4-i). Any other
  refusal, such as the c2-fast-* diagrams' bare-name parent, is fixed or filed as a known issue naming
  the document.
- Resolve docs/known-issues/commit-guardian/open-high-ki-cg-20261016-mermaid-parent-link-root-inside-package.md
  in the same change.
declared_files:
- path: templates/scripts/commit_guardian/check_mermaid_parent_link.py
  state: existing
delivers_to: null
expects_from:
  ac_id: GE-113c-1-iv
  contract: The single shared project-root resolver (templates/scripts/commit_guardian/_resolve_root.py,
    git rev-parse --show-toplevel with a safe fallback) returns the project root as a path, the same root
    from the package source copy and from the installed copy.
test_intent:
- clause: each run refuses the commit and names both c2-901-example.md and c1-901-parent.md and the missing
    child entry
  needs_test: true
  reason: Refusing a broken link from both copies is the behaviour that is inert today.
- clause: when c1-901-parent.md is corrected to list c2-901-example.md, both runs pass
  needs_test: true
  reason: A corrected link must pass, or the repaired check would block valid commits.
- clause: the check reads the staged documents from the project root, obtained through the one shared
    root resolver of GE-113c-1-iv, not from a folder computed from where the check's own file sits
  needs_test: true
  reason: Reading from the wrong root is the defect, and only a run from the installed layout shows it.
- clause: a run that was offered staged architecture documents and could read none of them does not report
    a pass (the outcome GE-120a-4 defines)
  needs_test: true
  reason: An empty read must not pass, or the check can go inert again silently.
- clause: the proof is a test that runs the installed copy against a staged broken document, not only
    the package source copy
  needs_test: true
  reason: The clause itself requires the installed-copy test as the proof.
- clause: every existing architecture document the now-working check refuses is either fixed in the same
    change or recorded as a known issue naming the document, and the check is not narrowed, exempted or
    made to warn to let that change through
  needs_test: false
  reason: A one-time sweep of existing documents during the change, verified by that commit, not by a
    lasting test.
