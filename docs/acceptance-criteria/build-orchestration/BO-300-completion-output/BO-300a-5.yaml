id: BO-300a-5
components:
  - build_orchestration
title: "The epic's work is re-read before the drive reports, and work the drive did not build is named as not built, with a cause stated only where the drive can establish one"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an epic whose set of work is enumerated once, when the drive fixes its plan,
    And at the end of that drive the epic contains three pieces of work that the plan
      was not built from and that the drive did not build,
  When the drive produces its completion output,
  Then the epic's set of work is read again at that moment and compared with the set
    the plan was built from, by identity and not by count,
    And each of the three is named in the output as not built,
    And a cause is stated for a piece of unbuilt work only where the drive can
      establish that cause from what it holds: work the plan WAS built from and that
      did not finish is reported as started and not finished,
    And because nothing the drive holds records what the epic contained at the moment
      the plan was fixed, each piece the plan was not built from is reported with its
      cause not determined, and is not reported as work added to the epic after the
      plan was fixed,
    And the output does not state that the epic is complete,
    And the output states what the operator should do about the work that was not built,
  So an epic that ends with work the drive did not build never loses that work from
    the built list and the outstanding list at once, and the operator is never sent
    after a cause the drive did not establish.
