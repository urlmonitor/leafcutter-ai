id: AR-200a-2
components:
  - agent_registry
title: "An agent told to hand work onward is told to sign off completely, not partially"
component: agent-registry
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the set of agent templates the build can dispatch as a ticket phase,
    And the sign-off protocol requires a dispatched agent to record its outcome in
      three places at once -- the frontmatter agents map, the Sign-offs checklist
      line with its timestamp, and the Comments section,
    And some of those templates carry a section instructing their agent, in a named
      situation, to hand work to a sibling by emitting a handoff status tag instead
      of an ordinary completion tag,
  When each such handoff instruction is read on its own -- as it is in practice,
    because it is the procedure the agent follows for exactly that situation,
  Then the instruction states that all three places are still written,
    And it does not describe handing off merely as substituting one status tag for
      another, because an agent that reads it that way updates the frontmatter and
      the comment and leaves the checklist line unchecked,
    And where a neighbouring rule relaxes one obligation for the handoff case, the
      instruction names precisely what is relaxed, so the exemption cannot be read
      as making the whole path lighter,
    And the check derives both sides from the templates themselves, so a newly
      added phase agent whose handoff instruction is incomplete is reported without
      anyone editing the check,
  So a ticket's record never comes back internally inconsistent -- asserting in its
    frontmatter that a phase signed off while its own checklist still shows that
    phase unchecked -- and a drive is never halted at the completion write by a
    contradiction the agent was told to create.
depends_on:
  - AR-200a
