criteria: |
  Given the delivery-boundary behaviour specified by BO-1800f-1, BO-1800f-1-i,
    BO-1800f-2 and BO-1800f-2-i,
  When a reader looks for the picture of what happens when finished work leaves its
    copy for the shared branch,
  Then they find one sequence diagram in the project's architecture-diagram
    collection, carrying the collection's own naming, levelling and notation for a
    component-level sequence, with its sequence number allocated by the collection's
    allocator rather than chosen by hand,
  And the diagram shows three decision points in order rather than one straight
    path: reading the state the shared branch is in at that moment, replaying the
    copy's commits onto that state, and adjudicating what the replayed result would
    take away,
  And the state the adjudication is shown comparing against is carried across from
    the read step, so the diagram cannot be read as comparing against the state the
    copy was originally made from,
  And the diagram has exactly three end points, each reached by its own branch:
    the shared branch's state could not be read, so nothing leaves the copy and the
    copy is left as it was found; the replayed result would take away content on a
    path no commit in the delivery declared, so nothing leaves the copy and that
    path is named; and every path the result takes content away from was declared,
    or it takes nothing away, so the delivery leaves the copy,
  And the adjudication branch is drawn as a decision taken per path against what was
    declared, not as one yes-or-no over the whole delivery,
  And no branch exists in which the delivery leaves the copy after the shared
    branch's state could not be read,
  And each of those three end points and each of the two decision branches is
    labelled with the identifier of the acceptance criterion that specifies it, and
    the diagram lists BO-1800f-1, BO-1800f-1-i, BO-1800f-2 and BO-1800f-2-i among
    its related documents, so that a criterion added, amended or withdrawn under
    BO-1800f leaves an identifiable gap in the diagram rather than a silent one,
  And the diagram stays inside the collection's complexity limits for a sequence and
    carries the collection's parent link in both directions.
depends_on: [BO-1800f, BO-1800f-1, BO-1800f-1-i, BO-1800f-2, BO-1800f-2-i]
