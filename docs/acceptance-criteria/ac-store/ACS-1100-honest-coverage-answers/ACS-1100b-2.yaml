title: "A counter that may not be duplicated still reports what it examined and excluded"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/ac-store/ACS-1100-honest-coverage-answers/ACS-1100b.yaml
criteria: |
  Given the AC-tree child-limit counter, which ACS-100h-7a requires to remain exactly
    one shared implementation with no second independent traversal,
  When it is invoked and returns its set of limit violations,
  Then the same callable also reports, alongside that violation set, how many parent
    records it examined and each child it left out of the count paired with the ground
    for leaving it out — for example children excluded on the ground that their status
    is superseded, per ACS-100c-6,
  And this self-report is what satisfies the coverage requirement for this surface, so
    no second traversal of the AC tree is written to produce a total for it,
  And when the callable is invoked over a narrowed set of parents it also reports the
    number of parents under the store root, so a staged-scope invocation reads as a
    scoped figure against a store figure rather than as a complete picture,
  And both callers of the shared callable — the commit-time path and the scaffold-time
    path — receive the same examined count and the same exclusion list, so the two
    enforcement points cannot report different coverage,
  And the self-report is returned to the caller as part of the answer, not emitted only
    as an operator warning.
depends_on:
