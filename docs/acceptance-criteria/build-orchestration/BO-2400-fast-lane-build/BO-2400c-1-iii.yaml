amended_by:
  - agent: BrainCandy
    date: "2026-08-25"
    reason: "Transport amendment plus a work_status correction, following KI-BO-019 and the Product Owner's decision of the same day. WORK_STATUS RESET done -> in_progress. This criterion has two halves and only one of them was ever built. The GATE half is done and fired correctly on run wf_bd4984e8-438: the lane checked the value it held for the breakpoint marker, did not find one, and halted fail-closed rather than dispatching an unbundled prompt. That is exactly right and is not being changed. The TRANSPORT half has never worked once. As written before this amendment the criterion constrained what the dispatched AGENT receives and said nothing about what the LANE receives, and that gap is the hole the run fell through: the assembling agent returned a 47-character pointer, `file:/tmp/bo2400f13-bundle/bundle_output.txt`, for a bundle that was on disk and well-formed at 148,891 bytes with the marker at line 958. The gate was right; the contract was unsound. WHAT THE AMENDMENT ADDS: (1) a lane-receives contract — what comes back is content in the lane's hands, because the E2 engine has no filesystem access and cannot follow a location it is handed; (2) reference-rejection — a value that is a path or a file: URI is refused AS A REFERENCE, distinguishably from nothing having come back; (3) the size expectation stated to the producer; (4) the three-way halt message the Product Owner specified, since today's message leads with 'was not obtained' while its own attached Detail block reads \"obtained\": true and 'Bundle assembled successfully'. WHAT IT DELIBERATELY DOES NOT ADD: the primary mechanism. Reference-rejection is a cheap belt on a payload already cut by construction in the new sibling BO-2400c-1-vi, which drops the two duplicate layers and takes the bundle from ~149 KB to ~20 KB. Specifying the belt as though it were the mechanism would be fighting the model instead of fixing the design. Also deliberately not added: the general rule that a halt must not state a reason its own evidence denies. That is a property of outcome construction, not of bundles, and the Product Owner assigned it to the BO-2400f-4-vi family; duplicating it here would give it two owners and no home. NOT re-litigated: accepting a pointer and giving the lane a way to read it (rejected — needs a filesystem primitive the engine does not have, and it destroys the only observable distinguishing a lane that assembled its context from one that did not), and chunking (rejected — buys nothing at 20 KB and adds a lost-or-misordered-chunk failure class). it_requirements and test_spec below are pre-amendment and cover only the first scenario; they need IT PO re-enrichment."
  - agent: it-po
    date: "2026-08-25"
    reason: "TECHNICAL ENRICHMENT ONLY — no criteria, title, depends_on, covered_by, declares_side_effect, work_status or test_rationale text was touched. Re-enriched the it_requirements and test_spec the BA marked STALE, which covered only the pre-amendment first scenario. What changed: n_location_rule 1 -> 3, because the amendment turns one edit site into three (the assembling dispatch prompt where the size expectation is stated, the usability gate where the classification is computed, the halt payload where one of three states is named); config_schema_fragment now carries the four-state classification rather than a two-state obtained flag; delivers_to became a two-entry list, because the bundle has always had TWO consumers with different agent types (test-writer at fast-lane-ship.js:561, python-coder at :635) and a single-entry contract hid the byte-identity obligation between them; expects_from now states that the stdout ITSELF must cross the boundary, which is the clause whose absence caused KI-BO-019. Added constraints the BA could not see: the JS/Python split (this record is JS only; the Python half is BO-2400c-1-vi), the source-vs-generated finding, reference-rejection ordered BEFORE the marker check so a marker-bearing locator cannot masquerade as content, and the belt-not-mechanism rule forbidding truncation or a size cap. VERIFIED WHILE ENRICHING, and it bears on this record's premise: `cache_control` appears nowhere in templates/, scripts/ or config/ — there is no provider cache breakpoint anywhere in the system — and the two consumers run under different agent types, so no provider prompt cache anchoring on an exact prefix from the start of a request could ever span them. The breakpoint marker is a literal HTML comment. That does not weaken this criterion, whose subject is transport and consumption, but it does mean nothing here should be justified by cache-hit reasoning."
