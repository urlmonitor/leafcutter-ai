it_requirements:
  - "IT-PO DECISION — THE DECLARATION MECHANISM FOR A JUDGEMENT PATH. The BA recorded this as the open residual: without it the sweep either false-positives on every judgement dispatch or is quietly narrowed until it means nothing. Settled as follows, and all five parts are required together."
  - "(1) WHERE IT LIVES. Every dispatch site carries an explicit `result_use` field on the dispatch options object itself — the same object the runtime already reads for agent type and label. Permitted values: `fact`, `chore` and `judgement`. `chore` (added 2026-09-16 with BO-3200f-3) marks a side effect such as a claim or a release: it is addressed to the executor like a fact, but it is not a value the build branches on, so this record does not exercise it for a value. A `judgement` declaration must also carry a non-empty `judgement_reason` string. It is NOT a separate registry, allowlist or config file: a second surface drifts from the code, and the drift is invisible because both look correct in isolation."
  - "(2) ABSENCE MEANS `fact`, AND AN UNDECLARED SITE FAILS THE SWEEP. The exemption is opt-OUT by explicit declaration, never opt-in by omission. If a missing declaration were tolerated, the sweep's scope would shrink silently with every dispatch anyone adds — which is precisely how building-epics §2.1-R1 stopped applying to the agent that stalled."
  - "(3) THE DECLARATION IS NEVER INFERRED. Not from the prompt text, not from the agent name, not from the label, not from the returning value's shape. Any of those is the text heuristic the BA correctly rejected."
  - "(4) THE DECLARATION IS VERIFIED, NOT TRUSTED — this is what stops 'declare everything judgement' being the cheap way out. A declared-judgement path is still EXERCISED in the no-judgement environment — only the chartered executor answers, and only as a literal command; every other dispatch fails immediately. It is not required to obtain its value; it IS required to reach a terminal outcome, recording the judgement as unobtained in BO-3200e's vocabulary. If the run cannot terminate without the value, the build BRANCHES on it — so it was a fact, the declaration is contradicted by observation, and the path is reported as a falsely-declared judgement. The declaration therefore selects WHICH assertion applies, never whether the path is examined. Every path is examined either way."
  - "(5) THE EXEMPT SET IS REPORTED ON EVERY RUN, clean or not: the count and the list of declared-judgement dispatches with their stated reasons. A silently growing exemption set is how a sweep is narrowed until it means nothing, and it is invisible unless the exemptions are enumerated."
  - "THE PATH SET MUST BE DERIVED FROM THE DEPLOYED SURFACE, not hard-coded. A path added later must be swept without editing the sweep. The parent L0's count of roughly 69 errand-runner dispatches is evidence to re-measure, never a list to encode."
  - "A VIOLATION MUST NOT BE SUPPRESSED BY SUCCESS ELSEWHERE: per-path verdicts, an aggregate report, no early return, no summarisation that collapses several named paths into one line."
  - "A SWEEP THAT EXERCISED NO PATHS MUST FAIL, not report clean, and a path that could not be exercised must be reported as not-exercised rather than omitted (KI-ACS-001)."
  - "Coverage must use unit_tests/_workflow_engine_harness.py with BO-3200f-1's executor stand-in to produce the no-judgement environment: executor dispatches are answered by running the same capture the real executor issues, and every other dispatch fails immediately with a transport error. Withholding the dispatch surface entirely is no longer the environment -- it makes every read impossible once reads go through the executor."
  - "IT-PO DECISION (2026-09-16) -- A FACT DISPATCH ADDRESSED TO A NON-EXECUTOR PARTY IS NOT A VIOLATION IN ITSELF IN THIS RECORD. This record's verdict is OBSERVATIONAL: a path is reported from what exercising it shows, never from how its dispatch is addressed in the source. The static addressing violation is BO-3200f-3's verdict on the same site in the same report. So a fact dispatch to status-checker is reported twice, for two different reasons -- mis_addressed there (from the source, without running), relayed_fact here (from the run) -- and a correctly addressed path that still relays by another route is caught only here."
  - "SCENARIO 3 -- AN EXACT COMMAND TO THE EXECUTOR IS NOT A RELAY. A path whose resolution dispatches only to the executor, carrying an exact command, and takes its value from a reply that verified as BO-3200f-1's capture, is `completed`. It is recognised from the run's dispatch record -- addressee and verification -- never from the prompt text."
  - "SCENARIO 4 -- A FALLBACK IS A RELAY EVEN WHEN IT SUCCEEDS. A path whose dispatch record for the resolution contains any dispatch to a party other than the executor is reported relayed_fact although it obtained its value. The report distinguishes relay_kind 'direct' (the path could not obtain its value without the judging party) from 'fallback' (it obtained it only after the judging party's dispatch failed), because the remedies differ: build the executor read, versus delete the judging-party attempt."
  - "ONE INVENTORY, SHARED WITH BO-3200f-3. The path set is the fact- and judgement-declared sites of BO-3200f-3's dispatch-site inventory, and the exercise verdict is added to that record's report per site. No second walker and no second report; whichever of the two records lands second extends the first. This is how the path set stays derived from the deployed surface (requirement above) without a second derivation."
delivers_to:
  - agent: python-coder
    contract: "The `result_use` dispatch-site declaration ({result_use: 'fact' | 'chore' | 'judgement', judgement_reason: str}) and the exercise verdict added per site to BO-3200f-3's shared report: {exercise_verdict: 'completed' | 'relayed_fact' | 'falsely_declared_judgement' | 'not_exercised' | 'not_applicable', relay_kind: 'direct' | 'fallback' | null, dispatches_observed: [{addressed_to: str, exact_command: bool, verified: bool}]}, plus exempt: [{name: str, reason: str}] and total: int. 'not_applicable' is used only for chore sites."
  - agent: reference-author
    contract: "The sweep's discriminating rule stated as a question an author can apply to their own dispatch before the sweep does — 'would the build still reach a terminal outcome if nobody could be asked to judge, with only the executor carrying out exact commands' — plus the declaration's field names and its three values, so BO-3200a-3's documentation and this enforcement cannot diverge."
expects_from:
  - ac_id: BO-3200a-1
    contract: "The source-read resolver {value, outcome, source_path, looked_in, uninspectable_reason} whose call path makes only exact-command dispatches to the executor. BO-3200a-1 proves one path requests no judgement; this AC proves no path still relays."
  - ac_id: BO-3200f-1
    contract: "The executor dispatch helper and the harness stand-in that answers executor dispatches through the real capture while every other dispatch fails immediately -- the environment every scenario here runs in."
  - ac_id: BO-3200f-3
    contract: "The shared dispatch-site inventory and report {examined, sites: [{workflow, step, addressed_to, result_use, stated_permission, addressing_verdict}]}, which this record extends with exercise_verdict rather than re-deriving."
test_spec:
  - name: test_bo_3200a_2_every_fact_path_completes_when_no_party_can_be_asked_to_judge
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: "Exercise every fact-declared path from the shared inventory in the no-judgement environment (executor answers through the real capture, every other dispatch fails immediately); assert each obtains its value and proceeds, and that the report accounts for every path with an explicit exercise_verdict."
  - name: test_bo_3200a_2_one_restored_relay_is_named_despite_the_others_passing
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: "THE PARTIAL-FIX TEST. Restore exactly one path to asking a specialist to read or interpret its fact while every other obtains its fact through the executor; assert that path is named relayed_fact with relay_kind 'direct' and the other paths' success does not suppress or summarise the report away."
  - name: test_bo_3200a_2_declared_judgement_path_is_not_reported_as_a_relay
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: boundary
    description: "A path declaring result_use: judgement with a reason, whose returned value the build records rather than branches on, reaches a terminal outcome in the no-judgement environment (recording the judgement unobtained) and is NOT reported. Keeps judgement delegation available."
  - name: test_bo_3200a_2_falsely_declared_judgement_is_caught_by_observation
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: "THE ANTI-ABUSE TEST. A path declares result_use: judgement but actually branches on the returned value, so in the no-judgement environment it cannot reach a terminal outcome. Assert the sweep reports it as a falsely-declared judgement and names it. Without this test, declaring everything judgement empties the sweep."
  - name: test_bo_3200a_2_exact_command_to_the_executor_is_not_reported_as_a_relay
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: boundary
    description: "SCENARIO 3. A path that obtains its fact through one dispatch to the executor carrying an exact command, taking the value from the verified capture, is reported completed and not relayed_fact -- asserted from the run's dispatch record, not the prompt text."
  - name: test_bo_3200a_2_judging_party_first_then_executor_fallback_is_reported
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: "SCENARIO 4. A path first dispatches a specialist to interpret the fact and, when that dispatch fails, obtains the value through the executor. Assert it obtains its value AND is reported relayed_fact with relay_kind 'fallback', named, with both dispatches listed in dispatches_observed -- so scenario 3's exemption does not absorb it."
  - name: test_bo_3200a_2_undeclared_dispatch_site_fails_the_sweep
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: "A dispatch site carrying no result_use field is reported, not silently treated as exempt. Absence must fail, or the swept set shrinks with every dispatch anyone adds."
  - name: test_bo_3200a_2_exempt_set_is_reported_on_a_clean_run
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: "On an all-clean run the report still lists every declared-judgement dispatch and its stated reason. A silently growing exemption set is how a sweep is narrowed until it means nothing."
  - name: test_bo_3200a_2_path_set_is_derived_and_zero_paths_fails
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: "Adding a path to the deployed surface fixture makes it appear in the report with the sweep unmodified; and a sweep that exercises zero paths exits non-zero rather than reporting clean."
test_rationale: |
  Fact-versus-judgement cannot be decided by looking at a dispatch, which is why the observable
  property is "the path still completes when nobody can be asked to judge, with only the executor
  carrying out exact commands". That leaves one residual — a genuine judgement path legitimately
  cannot complete — and the tests here close it from both sides rather than by narrowing the
  sweep.
  Scenarios 3 and 4 are a pair in the same way. The executor-path test keeps the sweep from
  reporting the very reads the chartered-executor decision prescribes; the fallback test keeps
  that exemption from absorbing a path that asks a judging party first and only succeeds by
  falling back -- which passes scenario 1 in this environment and relays in production. Both are
  asserted from the run's dispatch record, since the prompt text of a fallback and of a clean
  executor read can look identical.
  The pair that matters is the declared-judgement test and the falsely-declared test. The first
  keeps judgement delegation available; the second makes the declaration a claim that OBSERVATION
  can contradict, so declaring everything judgement fails rather than exempting. Without the
  second, the declaration is self-certification and the sweep means nothing — which is exactly
  the outcome the BA warned about.
  The undeclared-site test and the exempt-set report are the two ways the swept set shrinks
  silently: by omission at the site, and by an exemption list nobody looks at. Both have
  precedent in this repository.
