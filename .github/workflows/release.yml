# Auto-release workflow for leafcutter-ai.
# Triggers on push to main, computes the next SemVer from changelog entries,
# and stamps + pushes the tag when a new version is detected.
#
# The release script (scripts/release/compute_next_version.py) is the single
# source of truth for version computation. See EPIC-LeafcutterVersioning/03.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compute next version
        id: version
        run: |
          NEXT=$(python scripts/release/compute_next_version.py)
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Computed next version: $NEXT"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.next }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.next }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"
          echo "Tagged and pushed ${{ steps.version.outputs.next }}"
