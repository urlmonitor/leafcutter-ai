notes: |
  Observed 2026-11-16, run wf_1d040da5-d48 (KM-400e-5). The claim command ran, found the
  target in_progress, exited 1 and printed its held outcome. The lane said "The claim was
  never attempted". BO-2400f-7-iii's genuine-contention branch exists, but the real command
  can never reach it: it needs exit status 0 with target_refused true, and the command exits
  non-zero on every refusal. Its test reaches it only by feeding that impossible shape
  (BO-2400f-7-xi).

  Held is recognised from the outcome, whatever the exit status, so the lane reads a held
  refusal correctly from an older deployed command (exit 1) and from BO-2400f-7-viii's
  reserved status alike. A non-success reply with no readable held outcome is ran-and-failed,
  never held, so a held halt can never name nobody.

  The held halt names no owner because the claim records none today. Owner-aware claims, and
  treating an in_progress committed on main (for example after an amendment reopened the
  record, as with KM-400e-5) as not a live claim, are out of scope here and come later. The
  remedy text points the operator at both cases the run cannot tell apart.

  Why held asks for no release: the run claimed nothing. Releasing would put another run's
  members back to todo (BO-2400f-8, the same rule as BO-2400f-12-i).
