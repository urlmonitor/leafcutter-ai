notes: |
  WHY THE ACCEPTANCE IS A REFUSED COMMIT AND NOT A REGISTRATION FACT. The
  cheapest way to "satisfy" this L1 is to assert that the guard appears in the
  gate registry. That assertion is true the moment an entry is typed and says
  nothing about whether an author is ever stopped — and it also duplicates
  BP-100n-4, which owns the census and forbids a second one. Every clause here is
  therefore an outcome of attempting a commit. This is also why the record needs
  no reachability clause of its own: a criterion that cannot pass unless a commit
  is actually refused cannot pass on an unreached gate.

  THE RED BASELINE IS REAL AND SHOULD BE CAPTURED BEFORE ANY WORK STARTS. Clause
  one ("the commit does not complete") fails today, because no commit is refused
  for file length. Capture that failing run first; it is the evidence that the
  later green means something.

  THE SILENCE ARM IS THE ONE THAT IS EASY TO DROP, AND THE L1 SAYS SO. "A file
  comfortably under its limit produces no interruption at all" is what stops the
  criterion being satisfied by warning on everything, which is the same as
  warning on nothing. It is also green on arrival on an implementation that
  reports nothing, which is exactly today's implementation, so it needs a
  mutation rather than a note.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Two clauses here
  assert an absence and both are green on arrival on any implementation that
  reports nothing at all. Each carries an injection that must be run and reverted:

  (1) "the commit completes and nothing about that file's length is reported at
      all" — MUTATION: change the length comparison so that a file at or below
      its permitted length is refused alongside one above it. Under that
      injection the under-limit arm must go RED, failing by the commit outcome as
      well as by the text, and must return to green on revert. This injection has
      a second and deliberate property: it can only turn the descriptor red if the
      guard actually runs at commit time. A mutation that changes nothing is the
      signal that the precondition has not landed — which is how this record
      proves reachability without restating BP-100n-4's census.

  (2) "the file named as being over is the first one only" — MUTATION: include
      every staged file of a covered kind in the reported set regardless of its
      measured length. Under that injection this clause must go RED naming the
      compliant second file, and return to green on revert. Without it, the clause
      is satisfied by a guard that names nothing.

  BOUNDARY WITH GE-127b, DELIBERATE AND LOAD-BEARING. This record's population is
  a file that was UNDER its permitted length before the change and is OVER it
  after. A file already over before the change is GE-127b-1's population and
  appears nowhere here. Do not widen either record to cover the other's
  population; merged, an implementer satisfies whichever half is cheaper.

  BOUNDARY WITH GE-127d. Nothing here specifies WHICH lines are counted, nor
  whether the number quoted back to the author is reproducible. That is GE-127d's
  subject and specifying it in two places produces two rules. This record consumes
  whatever counting rule GE-127d settles.

  BOUNDARY WITH GE-127e. "The outcome names the file, its measured length and the
  permitted length" is the minimum needed to make this record testable. It is NOT
  this record's job to make the refusal actionable — what to split and roughly
  where is GE-127e's promise, and a decomposition that reaches for it here has
  taken work from a record that does not yet exist.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. Those are the IT PO's, and the named
  mutations above are written to be turned directly into test descriptors.
  delivers_to is null because nothing is enriched yet, not because this record is
  terminal.
