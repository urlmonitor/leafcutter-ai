notes: |
  The guardrail against the halt being switched off for over-firing — the same
  no-false-positive posture ACS-900d takes for the deprecation hook.

  The 0-covered clause is the sharp one: "0 covered, everything declared excluded" must
  PASS while "0 covered, nothing declared" must HALT. Both look like an empty answer
  today; the declared exclusions are the only thing that separates them.

  SCOPED PASS CASE ADDED (2026-08-13, expert review). All eight AC pre-commit hooks
  resolve their work set from git diff --cached. The scoped answer is the highest-volume
  pass case in the whole system — it happens on every commit — so it is specified here
  as an explicit non-halting case rather than left to be inferred from the exclusion
  grounds list.

  RECONCILING IS NOT ALL-CLEAR-ELIGIBLE. The final clause is here to stop the natural
  misreading that an answer passing this AC licenses an unqualified all-clear downstream.
  It does not: ACS-1100d-2 caps the verdict separately, and under that cap only
  covered == total with no declared exclusions and no could-not-classify records unlocks
  an unqualified all-clear. The two ACs are consistent by construction — this one governs
  whether the ANSWER halts, d-2 governs what a VERDICT may CLAIM.
