title: "A parametrised covering test proves an AC only when every one of its cases passes"
component: ac-store
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an active AC that is still recorded as not-yet-done,
  And the only test declaring that it covers the AC is parametrised,
  And one of that test's cases passes while another case fails,
  When the done-proof oracle evaluates the AC,
  Then the AC is judged not eligible for done,
  And the refusal names the failing case,
  And the order in which pytest reports the cases does not change the verdict,
  And when every case of the parametrised test passes the AC is still judged eligible,
  And the bug symptom ("a parametrised covering test with one failing case proves the AC done, because only its first reported case is read") must not occur.
