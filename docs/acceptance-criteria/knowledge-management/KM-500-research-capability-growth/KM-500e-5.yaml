it_requirements:
- Maintain one shared reference for the answer contracts, reusing the existing knowledge retrieval documentation
  structure. Document supported, partial, pending and unavailable behavior separately without implying a new API.
- Use the canonical field names and definitions delivered by e-1 through e-4 and the impact/proof/diagnosis contracts;
  show source scope, exact versus known subset counts, source/tested revision distinctions and explicit unknown
  values.
- Retain all twenty-five origin IDs and eight query families from the catalog. Link the twelve initial RQE cases
  as planned specifications and their separately reported actual execution status; documentation presence is not
  coverage proof.
- Review examples against the released behavioral ACs and keep this reference as the definition source for KM-500g-3.
  Resolve conflicting terminology rather than adding a second meaning in a how-to.
