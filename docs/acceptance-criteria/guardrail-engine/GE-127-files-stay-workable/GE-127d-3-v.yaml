id: GE-127d-3-v
title: "A line holding several statements counts once per statement, so joining statements onto fewer lines never lowers a file's measured length"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a covered Python, JavaScript or TypeScript file whose statements each
    stand on their own line,
  And the same file with some of those statements joined onto shared lines
    (`a = 1; b = 2` or `if ready: start()` in Python, `a(); b();` in JavaScript
    and TypeScript),
  When each version is measured,
  Then both versions measure the same length, so joining statements lowers
    the measured length by nothing,
  And a `;` that separates no statements does not split a line: a
    `for (;;)` header, a `;` inside a string, template literal or comment, a
    lambda's or an annotation's `:`, and a docstring on its own header line,
  And SQL and shell lines are measured as before, one per line,
  And given a tracked file already over its limit and a staged change whose
    only effect is joining statements with `;`, or splitting such a joined line
    back into one statement per line,
  When the author performs an ordinary commit,
  Then the commit completes, the outcome states that the change added 0 lines,
    and the quoted length is the same before and after,
  And given the same over-limit file and a staged change that joins
    statements and also writes K new statements onto the joined lines,
  When the author performs an ordinary commit,
  Then the outcome states that the change added K lines and the commit does
    not complete,
  And the published measurement rule states that a line holding several
    statements counts once per statement, naming the languages for which the
    measure does so.
