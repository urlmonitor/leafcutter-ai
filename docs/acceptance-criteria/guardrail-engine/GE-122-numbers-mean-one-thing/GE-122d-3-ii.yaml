notes: |
  THE OPEN DECISION THIS AC CLOSES, and why it is closed the way it is. Two mechanisms could
  make a new adopter's first commit work: (a) the install scaffolds the namespace roots so
  "absent" never occurs, or (b) the pass treats an absent root as an empty namespace. This
  criterion is written so that only (a) satisfies it, and the second block is the reason: under
  (b) a declared root that does not resolve passes silently, and a wrong path is
  indistinguishable from a legitimately absent one at the moment of the check. That
  indistinguishability IS the defect the fail-closed contract exists to prevent. The distinction
  between "knowably empty" and "a blind spot" is a real one, but it is only available to a pass
  that can see the difference — and it can only see the difference if the root is there.

  THE REFINEMENT WORTH HAVING, added rather than substituted. Making the roots exist is
  necessary but leaves one honest gap: a project whose collection legitimately lives elsewhere
  has no way to say so, and today, per KI-CG-13, one of the four roots cannot be declared at all
  because it is written into the check. The third block closes that gap without reopening the
  hole: a project DECLARES where its namespaces live, and a declared root that does not resolve
  still blocks. The opt-out becomes a reviewable line in a configuration file rather than an
  accident of a wrong working directory — the same "declared, data-driven, never hardcoded"
  shape GE-120c-3 already requires of check exemptions. An implementer who reads only the first
  block will hardcode the scaffold; an implementer who reads only the third will make the roots
  optional. Both blocks are required and the second is what holds them together.

  WHY BOTH DISPOSITIONS LIVE IN ONE CRITERION rather than two. Split into a scaffold AC and a
  fail-closed AC, the scaffold AC becomes satisfiable by mechanism (b) plus a scaffold, and the
  pair no longer forbids anything. This is one behaviour — what the pass does about a namespace
  root — observed under the two conditions that distinguish the acceptable implementation from
  the unacceptable one. GE-122d-3-i is written the same way and for the same reason.

  WHAT THIS AC DOES NOT COVER: whether the CI consumer simulation actually exercises an
  adopter's first commit. That is BP-900h-6, and it is the proof that this behaviour holds for
  a real install rather than only in a fixture.

  IT-PO (2026-08-25) — THE DUPLICATED SOURCE IS THE PART THE CRITERIA IMPLY BUT NEVER NAME.
  "Every namespace root is resolved through that same declared configuration, with no namespace
  resolved by a location written into the pass itself" reads as an instruction to ADD a
  config/paths.json key. It is also an instruction to REMOVE the literal the key replaces. An
  implementer who adds architecture_diagrams and keeps the hardcoded path as a fallback has
  satisfied the sentence and preserved the defect: two sources of truth for one root, with the
  quieter one winning whenever the key is missing. That is now an explicit it_requirement, and
  the no-hardcoded-root descriptor in test_spec is what makes it fail rather than pass.

  IT-PO — THIS AC IS THE FIRST LEG OF THE EPIC'S ORDERING. GE-122d-6 now declares this AC in
  depends_on. Registering the commit-time uniqueness hook before this scaffold lands blocks
  every commit in every fresh install, measured on both documented install paths including
  --seed-docs. Nothing in this AC may be deferred out of the registration's critical path.
target_epic: EPIC-TheNumberingGuaranteeHoldsAtEveryStage
