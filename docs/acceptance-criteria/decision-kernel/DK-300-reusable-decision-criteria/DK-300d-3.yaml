roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given a design decision run that reused cat-1dc11c5a2ffa7310 unedited as its criterion crit.small_slice, approved by the person,
  And the run ended with its decision record staged,
  When the decision record is published,
  Then the pair of the new decision id and crit.small_slice joins the members of cat-1dc11c5a2ffa7310 only through a category change that a person publishes and that is reviewed like any other change,
  And the pair never joins while the decision record is only staged, and never by editing the published decision record,
  And once both are published, the usage count of cat-1dc11c5a2ffa7310 rises from 3 to 4,
  And a run whose decision is never published adds no member.
