notes: |
  Two readers exist today: the canonical pattern in the test-enforcement module,
  applied by the done-proof scan, and a separate pattern of its own carried by
  the commit-guardian test-tag check. A change to one that is not mirrored in the
  other is the drift failure this repo has hit before, and TQ-100b-4's narrowing
  is exactly the kind of change that invites it — narrow one reader only and the
  commit-time check and the done-proof verdict start disagreeing about what a tag
  is. Whether the fix is a single shared reader or two readers held in parity is
  an implementation choice; this criterion only requires that their observable
  behaviour over the real tree is identical and that a divergence is named.

  TEST ANGLE: run BOTH readers over the committed tree and diff their outputs. A
  test that compares the two pattern strings, or that asserts one imports the
  other, is a grep-only structural test and proves nothing about behaviour.
