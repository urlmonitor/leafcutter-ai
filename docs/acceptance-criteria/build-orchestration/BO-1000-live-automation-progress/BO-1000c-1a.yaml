id: BO-1000c-1a
components:
  - build_orchestration
title: "Background finalize appends each progress line to a durable, pollable run-progress journal as it happens"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the finalize-feature workflow is running under the E2 engine,
  When the workflow dispatches an agent for a step,
  Then a durable record of that dispatch exists for the run and remains
    readable after the run process has exited,
  And the records preserve dispatch order,
  And the workflow body itself writes no run-progress file and loads no module
    loader or filesystem primitive to do so.
depends_on: [BO-1000c, BO-1000a-1, BO-1000b-1]
doc_links:
  - path: docs/architecture/components/finalize.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-030-dual-engine-workflow-support.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment: null
  reference_file_path: "templates/workflows-js/finalize-feature.js"
  n_location_rule: "all"
  required_skills:
    - "python-coder"
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  notes: |
    Surface: the .js workflow body (templates/workflows-js/finalize-feature.js) —
    python-coder per repo precedent (BP-1000). This is the producer half of the
    split from BO-1000c-1; the launcher/relay half is BO-1000c-1b (llm-expert).
    Policy constraints (state WHAT, coder picks HOW):
    - Every start-of-step (BO-1000a-1) and per-step-outcome (BO-1000b-1) line
      must be appended to a durable run-progress journal at the SAME point it is
      emitted — append-as-you-go, not a single end-of-run flush — so an external
      poller sees lines while the run is in flight.
    - The journal must live at a path the launcher can locate deterministically
      for THIS run (e.g. keyed by worktree/run id), be append-only, and preserve
      emission order (line ordering is the contract BO-1000c-1b relays).
    - Journal writes must follow the project error-handling policy for file I/O
      and must never take down the finalize run: a journal-write failure degrades
      to best-effort (log at WARNING) rather than aborting the workflow.
    - No new config key is introduced by this AC beyond the journal path
      convention. ADR-001 build.py round-trip parity on the template workflow.
delivers_to:
  agent: llm-expert
  contract: >-
    CONTRACT CHANGED 2026-08-18 — see amended_by. The run-progress record is the E2
    engine's own per-run journal at <transcriptDir>/journal.jsonl, NOT a file this
    workflow writes. Each entry is a {"type":"started"} / {"type":"result"} record
    pair per agent() dispatch, in dispatch order, accumulating while the run is in
    flight. Consumers BO-1000c-1b (poll + relay), BO-1000c-2 (over-time delivery)
    and BO-1000c-2-i (halting-step line) must locate the engine journal rather than
    a worktree-keyed path, and must work at per-agent-dispatch granularity: the
    engine journal does not persist log() output, so the human-readable per-step
    narrate()/outcome() text lines are NOT recoverable from it. Those three ACs
    need re-reading against this contract before they are built.
expects_from:
  ac_id: BO-1000b-1
  contract: "The start-of-step (BO-1000a-1) and per-step-outcome (BO-1000b-1) lines as they are emitted, which this AC also appends to the journal."
test_required: true
test_spec:
  - name: test_no_module_loader_or_custom_journal_helper_remains
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "The workflow body contains no require( call, no appendJournal helper and no journalPath declaration — an absence/regression guard against the dead mechanism reappearing."
  - name: test_every_reached_step_has_at_least_one_agent_dispatch
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "Executing the real finalize-feature.js under the E2 harness, every numbered step that is reached produces at least one agent dispatch — the unit the engine journal records."
  - name: test_agent_dispatches_appear_in_step_order
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "Agent dispatches observed from the executed workflow appear in step order, so the engine journal's record order reflects run order."
  - name: test_agent_dispatch_records_are_still_readable_after_the_run_ends
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "Dispatch records remain readable after the workflow subprocess has exited, so the record is durable rather than in-memory only."
  - name: test_renaming_narrate_does_not_change_dispatch_based_coverage
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "Renaming the internal narrate helper throughout a copy of the script leaves dispatch-based coverage unchanged — the coverage does not depend on internal helper naming."
origin_agent: it-po-v3
created: 2026-07-10
amended_by:
  - reason: it-po-test-contract
    note: "Added test_spec (4 behavioral tests derived from the Gherkin Then-clauses) and test_required: true so the approved code AC declares its test contract; criteria and all prior fields unchanged."
  - reason: "redefinition — mechanism was unimplementable as written"
    by: BrainCandy
    at: 2026-08-18
    note: >-
      criteria, test_spec and the delivers_to contract are all REWRITTEN. This is a
      requirement change, not a clarification. The original criteria required the
      workflow body to append each progress line to a durable file it wrote itself.
      That is impossible under ADR-030: the E2 engine injects only
      agent/parallel/pipeline/phase/log/args/workflow/budget into a workflow body —
      no filesystem primitive and no module loader. The shipped implementation
      called require('fs') inside a try/catch that logged a WARNING and let the run
      report success, so the AC was marked work_status: done while the mechanism had
      never once written a line. Confirmed by the vm-sandboxed harness added in the
      same ticket, under which require('fs') throws ReferenceError.
      Decided by BrainCandy on 2026-08-18: delete the custom mechanism and redefine
      the AC onto the journal the engine already writes at
      <transcriptDir>/journal.jsonl. Granularity drops from per-step to per-agent
      deliberately — a live journal was inspected and holds 68 started / 64 result
      records for one run, and no log() output. Rejected alternatives, so this is not
      relitigated: an agent()-dispatched write preserves per-step granularity but
      costs ~18 extra dispatches per finalize run; softening the assertions was
      refused because it leaves the AC unimplemented while marked done.
      Downstream impact: BO-1000c-1b, BO-1000c-2 and BO-1000c-2-i consume this
      contract and must be re-read against it before they are built.
      Full decision record in ticket 09 of EPIC-BuildPipelinePhantomRemediation.
  - reason: "re-scope — the load-bearing clause was untestable at this level"
    by: BrainCandy
    at: 2026-08-25
    note: >-
      criteria NARROWED and work_status reverted to todo. The 2026-08-18
      redefinition above correctly moved the mechanism onto the engine journal,
      but left in place a clause the coverage cannot reach: "readable by a
      caller outside the background run WHILE THE RUN IS STILL IN FLIGHT", and
      "accumulate over the run rather than appearing only once it ends".
      An adversarial review found the AC was marked done on tests that cannot
      verify either phrase — the test module's own docstring states that no
      test in it, or anywhere at the unit level, can execute a real run and read
      back a real journal.jsonl produced by production code. The three
      substitute tests read HarnessResult.agent_calls, which is parsed from a
      single JSON blob AFTER subprocess.run returns; one is named
      test_agent_dispatch_records_are_still_readable_after_the_run_ends. That
      observation model falsifies the in-flight clause rather than verifying it.
      The review also showed the AC was not discriminating: deleting the E2
      engine's journal.jsonl entirely leaves all five tests green, because four
      of them assert only that finalize dispatches agents in monotonic step
      order — true before this work and unrelated to journaling.
      Decided by BrainCandy on 2026-08-25: keep in this AC only what the unit
      layer genuinely proves — durability after process exit, dispatch order,
      and the absence guard on require()/appendJournal/journalPath (the one
      clause that does discriminate against the pre-fix file). The in-flight
      pollability requirement is NOT dropped: it moves to a new sibling AC so it
      stays visible and open rather than being absorbed by a narrowed parent.
      Rejected alternative: building an integration harness that launches a real
      background run and polls journal.jsonl mid-flight. That would verify the
      original clause directly and remains the right long-term answer, but it is
      new test infrastructure and does not belong inside a remediation epic.
  - by: ac-reconcile
    at: 2026-08-26
    note: >-
      work_status set to done from verified evidence, against the NARROWED
      criteria recorded in the 2026-08-25 entry above (durability after process
      exit, dispatch order, and the require()/appendJournal/journalPath absence
      guard — the in-flight pollability clause was moved out to BO-1000c-4 and
      is NOT claimed here). Five tests carrying "# covers: BO-1000c-1a" exist in
      unit_tests/workflows/test_bo_1000c_1a.py and all pass under
      AC_ENFORCE_STRICT=1 (targeted run 2026-08-26; full unit_tests run clean
      apart from the unrelated test_ge_122e_1.py failure from another branch).
      implemented_by extended with the real source file; the pre-existing ticket
      path entry is left in place rather than replaced.
