it_requirements:
    - "SURFACE. The canonical source is templates/scripts/commit_guardian/_ac_schema_validators.py — specifically _DURABLE_EFFECT_RE and derive_declares_side_effect. Per ADR-001 edit the templates/ copy; scripts/ and .leafcutter/scripts/ are build outputs. After editing run `python scripts/build.py --target-dir .` and then `python -m pytest unit_tests/commit_guardian/ unit_tests/ac_store/ -q`, because the hook executes from the deployed layout, not the source tree."
    - "MEASURED BLAST RADIUS, 2026-08-25, against the real store at origin/main. Of the records with a Then clause, 139 derive true under the shipped pattern and 31 under one with the bare `\\bis written\\b` and `\\bare written\\b` alternatives removed. So 108 of 139 positives — 78 percent — rest entirely on those two alternatives. Sixteen of the 108 already carry an authored declares_side_effect: true and would, after the narrowing, DISAGREE with the derivation and fail check-ac-schema the next time they are staged: BO-1500a-1, BO-2600b-2, BO-2900g-1-i, BO-400a-2-ii, BP-1500d-1, BP-600b-2, BP-600b-3, BP-900g-10, BP-900g-8, BP-900h-4-i, GE-122d-6, GE-125d-1, GE-125d-3, INF-400c-4-iii, UXP-612, UXP-614. Re-measure before implementing; the store moves."
    - "NINE RECORDS ALREADY DISAGREED BEFORE THIS CHANGE — EIGHT ARE LEFT FOR THEIR OWNERS. BO-2400g-4, BO-2400g-4-i, BO-2900g-1, BO-2900g-2, BO-2900g-2-i, BO-2900g-4, BP-1100g-4, BP-1100g-4-i and BP-1100g-5-i carried declares_side_effect: true while the derivation returned false BEFORE the narrowing as well as after, invisible only because the check is a forward ratchet over staged records. Eight are pinned in the test allowlist rather than edited; deciding records in trees this change has no business in would be a bulk sweep in the opposite direction. BO-2400g-4-i is the likeliest genuine FALSE NEGATIVE — findings appearing on a pull request is durable, externally visible, and asserted in its Then."
    - "THE NINTH, BO-2900g-2, HAD TO BE RESOLVED, AND HOW IT RESOLVED IS THE USEFUL PART. Adding this AC as its child required staging the parent (the AC-store rule that a parent is staged alongside its child, because the hooks only read the index). The forward ratchet then refused the commit until the pre-existing disagreement was settled — so a record cannot gain a child while it holds a stale declaration, which is a coupling nobody designed and worth knowing before touching any of the other eight. It was set to false for CONSISTENCY, not convenience: its Then clause states what a record CARRIES, exactly the shape of BO-2600b-2's 'that statement appears in the record', which this same change sets false. The rule applied throughout is that the declaration follows what the Then clause STATES, per the parent's own 'obtained from the behaviour that work already states', not what the implementation incidentally writes. Several of the remaining eight will resolve the same way once anyone stages them."
    - "EACH RECORD IS A JUDGEMENT, NOT A SWEEP. For each, decide whether the record truly asserts a durable effect and correct either the authored value or nothing. Do NOT bulk-set them to false to make the gate quiet, and do NOT bulk-keep them true by widening the pattern back. The list spans eight components and other people's trees; a wrong call in either direction is exactly the silent-wrong-value failure this family exists to prevent."
    - "THE THREE SHAPES THAT MUST STOP MATCHING, each observed live on a real record. (1) A stream write: `a notice is written to the error stream` (GE-125d-1, GE-123b-5) — observable, not durable. (2) A REPORTED clause, where the sentence's subject is a document and the write belongs to a different AC: `the reference states that a notice ... is written to the error stream` (GE-123d-4-ii). (3) A relative clause naming a location: `names the file suppressions are written in` (GE-123c-4) — no write is asserted at all."
    - "THE SHAPE THAT MUST KEEP MATCHING: a file or record that outlives the run. Use the parent's own words as the test — 'a file that exists and can be read back afterwards, a record that is persisted, a command that leaves the system in a different state'. The 31 records that survive the narrowing are the regression set; if that count collapses toward zero the pattern has been cut too far."
    - "DERIVED, NOT OPINION — DO NOT SOLVE THE SECOND CRITERION WITH AN OVERRIDE FLAG. The parent's central property is that the value comes from the record's own words rather than from whoever wrote it, and BO-2900g-2-i exists to keep that property from being faked. An escape hatch, a suppression comment, or an `i_know_better: true` field would satisfy the second criterion by discarding the parent's. The second criterion is satisfied by making the derivation right, so that an author who is right and the derivation never disagree in the first place."
    - "SECOND OVER-MATCH, MEASURED AND DEFERRED — DO NOT SILENTLY FOLD IT IN. The derivation reads from the FIRST `Then` to the end of the criteria, so on a multi-scenario record it also reads later Given and When clauses, contradicting its own docstring. Bounding each scenario on a line-initial `Given` was implemented and measured during this work, then reverted: it moves three further records into disagreement — BO-2400c-1-v, UXP-612, UXP-614 — and two of those are arguable rather than wrong, since UXP-612 and UXP-614 genuinely produce a rendered file and happen to say so only in a `When`. Folding it in would breach this AC's own third criterion that disagreements must not rise, and would settle two judgement calls inside a change about a regular expression. The gap is now stated in the function's docstring with those three ids. It wants its own AC, whose real question is not the split but whether a durable effect asserted in a `When` counts."
    - "Verify against the REAL store, not fixtures. Run the before-and-after derivation across every record under docs/acceptance-criteria/ and diff the two result sets; a hand-built fixture reproduces the author's model of the phrasing, which is the bias that produced the shipped pattern."
