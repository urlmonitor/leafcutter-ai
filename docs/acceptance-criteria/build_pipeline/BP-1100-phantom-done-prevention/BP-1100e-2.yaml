assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Default enforcement is ADVISORY / fail-open: a real mismatch is reported but does not hard-block the ticket reaching done. A STRICT mode that blocks on a real mismatch is opt-in via a config key (mirror the existing warn/error configurable-hook precedent, e.g. check_test_ac_tags mode)."
  - "Fail-open on INTERNAL error is orthogonal to the advisory/strict mode: any exception in computing the verdict causes the check to not block (report to stderr, exit non-blocking), so a script error never strands a ticket."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3): specific exception types, log at WARNING or higher, never swallow silently."
  - "PORTABLE per ADR-001: ships to consumers via build.py; the config default (advisory) travels with it and must NOT rely on the leafcutter repo's own root CLAUDE.md."
