id: UXP-300
readiness: approved
priority: medium
title: "Product-truth artifacts live in docs/product-truth with one canonical dataset per entity per component"
component: ux-prototyping
components:
  - ux_prototyping
level: L2
status: active
req_status: approved
work_status: in_progress
criteria: |
  Given the product-truth store,
  When a flow, mock-data, or mockup artifact is authored,
  Then it lives under docs/product-truth/ (flows/, mock-data/, mockups/),
  And each entity has exactly one canonical mock-data artifact per component (extend, never duplicate),
  And flows link to acceptance criteria via step.implements (flow -> AC), while AC -> flow is derived,
  And scripts/validate_product_truth.py passes for the store.
depends_on:
  - UXP-700e
doc_links:
  - path: docs/product-truth/README.md
    relationship: specifies
    status: exists
  - path: docs/product-truth/scripts/validate_product_truth.py
    relationship: enforced-by
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements: |
  The store location and the flow->AC linking direction are conventions enforced by
  the validator and consumed by the Leafcutter Atlas /flows view. Mock data is the
  single source of truth that both populates mockups and seeds test fixtures.
delivers_to: null
expects_from: {}
origin_agent: BrainCandy
created: 2026-07-10
amended_by:
- action: approved
  agent: approve_acs
  date: '2026-09-07'
superseded_by: null
covered_by: []
implemented_by:
- tickets/00_inbox/TICKET-20260909-UXP-300.md
test_required: true
test_spec:
  - name: test_every_registered_artifact_resolves_under_a_declared_store_directory
    target_dir: unit_tests/product_truth/
    description: "Every artifact the index registers resolves to a path under flows/, mock-data/ or mockups/; a registration pointing outside those three is reported, not ignored."
    type: integration
    angle: real_artifact
    framework: unittest
  - name: test_one_canonical_dataset_per_entity_per_component
    target_dir: unit_tests/product_truth/
    description: "No entity is carried by two mock-data artifacts within the same component; a second dataset for an entity already covered is rejected rather than merged, so the store grows by extension and never by duplication."
    type: integration
    angle: real_artifact
    framework: unittest
  - name: test_flow_to_ac_is_authored_and_the_reverse_edge_is_derived
    target_dir: unit_tests/product_truth/
    description: "step.implements is the only authored link direction: an AC's product_truth back-reference is recomputed from the flow steps that name it, and a hand-written back-reference no flow supports is reported."
    type: integration
    angle: seam
    framework: unittest
  - name: test_the_store_passes_its_own_validator
    target_dir: unit_tests/product_truth/
    description: "validate_product_truth.py exits zero against the committed store, and the run states how many artifacts it examined so a pass over an empty store is distinguishable from a real one."
    type: integration
    angle: deployed
    framework: unittest
change_target: config
risk_surface: internal
target_epic: EPIC-TruthfulProjectRecord
