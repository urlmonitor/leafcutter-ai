criteria: |
  Mark a single element with the criterion it shows — inert, greppable, optional.

  When one specific thing on the page is the visible answer to one specific
  criterion, you can say so on that element itself, so a reviewer can go from
  what they are looking at to the requirement behind it. The marker never
  affects how the page looks and never reaches the people using the product.
  It says only that this thing is on screen: it is not a claim that the
  criterion behaves correctly, and it never counts as a test of it.
