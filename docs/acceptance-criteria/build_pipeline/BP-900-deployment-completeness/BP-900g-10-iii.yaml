notes: |
  WHY THIS IS NOT COSMETIC ONCE THE FILE IS DEPLOYED. A working-directory-relative
  read turns a deterministic guardrail into one whose verdict depends on how it was
  launched. It fails in precisely the situations where it is hardest to reason about
  — a hook invoked from a subdirectory, a workflow started from a worktree, an agent
  whose working directory is reset between calls — and it fails by reporting the file
  as absent, which is the same misleading message BP-900g-10-i and -ii exist to
  eliminate. Fixing the semantics of the missing-file report while leaving the
  resolution fragile means the correct new message will still be shown for the wrong
  reason.

  THE TWO-DIRECTORY TEST IS THE WHOLE ASSERTION and it must be a real invocation, not
  a unit test of a resolver function. The resolver almost certainly returns the right
  answer when called with the right arguments; the defect is in the call site that
  passes it a relative path. Run the artifact from two directories and compare.

  BOUNDARY, restated because it will be tempting to widen: ACS-300g-6 owns the
  working-directory-anchored repo-root question. If implementing this AC appears to
  require solving that one, stop and say so rather than absorbing it — the two were
  deliberately separated by the request that produced this AC.
