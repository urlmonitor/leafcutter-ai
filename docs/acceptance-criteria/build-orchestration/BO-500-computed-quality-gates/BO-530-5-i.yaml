created_by: docs/acceptance-criteria/build-orchestration/BO-500-computed-quality-gates/BO-530-5.yaml
criteria: |
  Given a ticket whose changed surface contains no Python files
    (e.g. it changes only frontend files, configuration, or documentation),
  When the sign-off gate evaluates whether the repo-ruff check applies,
  Then the ruff check is skipped as not-applicable,
  And the skip is recorded as "skipped" (no Python files to lint),
    not as a pass and not as a failure,
  And the absence of Python changes does NOT block the sign-off,
  And the sign-off can proceed on its other criteria.
