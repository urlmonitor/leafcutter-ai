agent_id: README
template_file: templates/agents/README.md
proposed_frontmatter:
  pre_flight_reads:
  - source: ticket_path
    required: true
  - source: .agents/agents/<name>/PROJECT_CONTEXT.md
    required: false
    condition: when present
  inputs: []
  outputs:
  - name: completion_report
    type: structured_response
    description: Structured completion payload or sign-off comment
  mutates:
  - name: none
    surface: none
    description: Read-only agent — no filesystem mutations
  behavioral_patterns:
  - name: Conditional Behavior
    trigger: the file is absent
    behavior: 'the agent runs in template-only mode and emits a single debug line:'
    related_agent: null
proposed_registry:
  category: supervisor
  skills_invoked: []
  knowledge_channels:
  - channel: 1
    source: template description field
  - channel: 4
    source: pre-flight file reads
  - channel: 8
    source: PROJECT_CONTEXT.md
