origin_agent: BrainCandy
created: 2026-09-25
amended_by:
  - reason: "business-analyst reconciliation (2026-09-29) against docs/known-issues/ac-driven-dev/open-blocker-ki-acd-20260928-pause-store-dispatched-to-worktree-agent.md: superseded_by set to BO-2300e-2, narrowly, for the six pause-store dispatch clauses only. This record's own notes already named the residual driving this: 'worktree-agent's charter names worktree lifecycle, not pause-store I/O; a dedicated shell-executor agent (KI-BO-20260901-1620 item 4) would be the durable fix.' That agent now exists -- command-step-runner (BO-2400a-1-i), permits_shell: true, chartered to run exactly one given command in one named workspace and hand back its result untouched -- and BO-2300e-2 is the durable fix this residual anticipated. The resolve-worktree-setup-script-path clause is untouched and remains this record's live, governing scope: that dispatch IS worktree lifecycle work and correctly stays on worktree-agent. Criteria left unchanged; see notes below for the full narrowing account and the required test-file update (test_bo_2300a_1_ii.py) that must ship alongside BO-2300e-2. work_status left untouched pending that implementation."
superseded_by: BO-2300e-2
