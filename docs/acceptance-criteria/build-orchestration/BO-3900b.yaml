id: BO-3900b
title: "A path counts as inside the worktree only at a whole-segment boundary, with Windows letter case and trailing separators ignored and POSIX case respected"
component: build-orchestration
components:
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given the resolved worktree `C:\wt\foo`
  When a ticket is named by `C:\wt\foo-bar\07_TICKET-x.md`
  Then the ticket path is judged outside the worktree, because `foo-bar` is not the
    segment `foo`
  And it reaches the phase agents naming `C:\wt\foo-bar\07_TICKET-x.md`, unjoined.

  Given the resolved worktree is spelled `C:/wt/foo/` (trailing separator), `C:\wt\foo`,
    or `c:\WT\Foo`
  When a ticket is named by `C:\wt\foo\tickets\07_TICKET-x.md`
  Then in all three cases the ticket path is judged inside the worktree
  And it reaches the phase agents as the same single path in all three cases.

  Given the resolved worktree `/home/henzeh/wt/foo` on a POSIX system
  When a ticket is named by `/home/henzeh/WT/foo/tickets/07_TICKET-x.md`
  Then the ticket path is judged outside the worktree, because POSIX paths differ by case
  And it reaches the phase agents unchanged.

  Given the resolved worktree `C:\wt\foo`
  When a path is exactly `C:\wt\foo` or `C:/wt/foo/`
  Then it is judged to be the worktree root itself, and is not joined onto the worktree.

  Given the resolved worktree `C:\wt\foo`
  When a ticket is named by `C:\wt\foo\tickets\..\..\other\07_TICKET-x.md`
  Then it is judged outside the worktree once its `.` and `..` segments are applied
  And a ticket named by `C:\wt\foo\tickets\.\07_TICKET-x.md` is judged inside it.
