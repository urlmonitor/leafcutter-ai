id: GE-113c-5
components:
  - commit_guardian
  - precommit_hooks
readiness: approved
priority: high
title: "The decision-record cross-reference check inspects the staged records in every layout it ships in"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given a commit stages docs/architecture/adrs/ADR-901-example.md whose frontmatter lists the
    component "commit_guardian",
    and the cross-reference the check requires between that decision record and the
    component's detail document is missing,
  When the commit-time decision-record cross-reference check runs from its installed copy
    (the copy the project's pre-commit configuration invokes), and again from its package
    source copy,
  Then both runs report the same finding, naming ADR-901-example.md and the missing
    cross-reference, with the severity the check's strict setting gives it,
  And when the cross-reference is added, both runs report no finding,
  And the check reads staged documents, the component registry and the decision-record
    folder from the project root obtained through the one shared root resolver of
    GE-113c-1-iv,
  And a run that was offered staged documents and could read none of them does not report a
    pass (the outcome GE-120a-4 defines),
  And every existing decision record or document the now-working check flags is either fixed
    in the same change or recorded as a known issue naming it, and the check is not narrowed,
    exempted or switched to warn-only to let that change through.
depends_on:
  - GE-113c
  - GE-113c-1-iv
  - GE-120a-4
doc_links:
  - path: docs/acceptance-criteria/guardrail-engine/GE-113-artifacts-cant-land-in-the-wrong-place/GE-113c-1-iv.yaml
    relationship: related
    status: exists
  - path: docs/acceptance-criteria/guardrail-engine/GE-120-green-means-checked/GE-120a-4.yaml
    relationship: related
    status: exists
  - path: docs/architecture/components/commit-guardian.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-001-self-hosting-boundary.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- Canonical source templates/scripts/commit_guardian/check_adr_cross_reference.py.
- The check gets the project root only through the shared resolver of GE-113c-1-iv; no Path(__file__).parents[N]
  root remains in it.
- The proof runs the built, installed copy the way .pre-commit-config.yaml invokes it, in a temporary
  repository with staged fixture documents, independent of the developer's working tree.
- 'The ''read none of its targets is not a pass'' outcome: GE-120a-4 has no shared helper (its rule is
  implemented inside scripts/ac_store/validate_ac_schema.py, which is source-only). The reusable mechanism
  is the shared outcome vocabulary of GE-120a-1, templates/scripts/commit_guardian/check_outcome.py (emit_result
  with OUTCOME_COULD_NOT_CHECK): staged targets named but none readable emits that outcome and does not
  exit as a clean pass; no staged target in scope stays an ordinary pass (GE-120a-4''s boundary). check_outcome.py
  is imported, not changed, so it is not a declared file.'
- Canonical sources only; deployed and installed copies are regenerated by the build and never hand-edited
  (ADR-001).
- Every path the check reads (staged files, docs/components.json, the decision-record folder) resolves
  from that one project root. The check's strict setting is not changed.
- Before merge, run the working check once over every existing decision record. Each finding is fixed
  or filed as a known issue naming the document.
declared_files:
- path: templates/scripts/commit_guardian/check_adr_cross_reference.py
  state: existing
delivers_to: null
expects_from:
  ac_id: GE-113c-1-iv
  contract: The single shared project-root resolver (templates/scripts/commit_guardian/_resolve_root.py,
    git rev-parse --show-toplevel with a safe fallback) returns the project root as a path, the same root
    from the package source copy and from the installed copy.
test_intent:
- clause: both runs report the same finding, naming ADR-901-example.md and the missing cross-reference,
    with the severity the check's strict setting gives it
  needs_test: true
  reason: Equal findings from both copies is the behaviour that is inert today.
- clause: when the cross-reference is added, both runs report no finding
  needs_test: true
  reason: An added cross-reference must clear the finding in both copies.
- clause: the check reads staged documents, the component registry and the decision-record folder from
    the project root obtained through the one shared root resolver of GE-113c-1-iv
  needs_test: true
  reason: Reading the registry and the folder from the wrong root is the defect, and only an installed-layout
    run shows it.
- clause: a run that was offered staged documents and could read none of them does not report a pass (the
    outcome GE-120a-4 defines)
  needs_test: true
  reason: An empty read must not pass, or the check can go inert again silently.
- clause: every existing decision record or document the now-working check flags is either fixed in the
    same change or recorded as a known issue naming it, and the check is not narrowed, exempted or switched
    to warn-only to let that change through
  needs_test: false
  reason: A one-time sweep of existing documents during the change, verified by that commit, not by a
    lasting test.
test_spec:
- name: test_ge_113c_5_installed_copy_reports_missing_cross_reference_for_staged_adr
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: reachability
  description: 'Temporary git repository with docs/components.json mapping commit_guardian to detail_ref
    docs/architecture/components/commit-guardian.md (which does not mention ADR-901-example) and a staged
    docs/architecture/adrs/ADR-901-example.md whose frontmatter lists components: [commit_guardian]; python
    .leafcutter/scripts/commit_guardian/check_adr_cross_reference.py --strict, run as a subprocess with
    cwd at the repository root, exits 1 and its output names ADR-901-example and the missing back-link
    at ERROR severity. The installed layout is made by copying the hook and _resolve_root.py into .leafcutter/scripts/commit_guardian/
    of a temporary git repository, as _ge_113c_1_vi_fixtures.deploy_hook does; no build.py is spawned
    and no POSIX flock is needed, so it runs locally as well as on CI.'
  proves_clause: both runs report the same finding, naming ADR-901-example.md and the missing cross-reference,
    with the severity the check's strict setting gives it
  code_file: templates/scripts/commit_guardian/check_adr_cross_reference.py
- name: test_ge_113c_5_source_and_installed_copies_report_the_same_finding_at_the_strict_setting_severity
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: criterion
  description: 'The source copy and the installed copy produce the same finding text: with --strict both
    exit 1 at ERROR severity; without --strict both exit 0 and print the same finding as a WARNING.'
  proves_clause: both runs report the same finding, naming ADR-901-example.md and the missing cross-reference,
    with the severity the check's strict setting gives it
  code_file: templates/scripts/commit_guardian/check_adr_cross_reference.py
- name: test_ge_113c_5_added_cross_reference_clears_the_finding_in_both_copies
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: criterion
  description: After the detail doc mentions ADR-901-example and is restaged, both copies report no finding
    and exit 0 with --strict.
  proves_clause: when the cross-reference is added, both runs report no finding
  code_file: templates/scripts/commit_guardian/check_adr_cross_reference.py
- name: test_ge_113c_5_registry_and_adr_folder_are_read_from_the_resolved_project_root
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: discrimination
  description: 'A decoy .leafcutter/docs/components.json maps commit_guardian to a doc that already mentions
    the ADR; the installed copy still reports the finding from the real root registry. A second case stages
    only the detail doc with the mention removed: the reverse check finds ADR-901-example through the
    ADR folder at the project root and reports it.'
  proves_clause: the check reads staged documents, the component registry and the decision-record folder
    from the project root obtained through the one shared root resolver of GE-113c-1-iv
  code_file: templates/scripts/commit_guardian/check_adr_cross_reference.py
  must_catch:
  - REPO_ROOT = Path(__file__).resolve().parents[2] kept for COMPONENTS_JSON_PATH, so the installed copy
    reads .leafcutter/docs/components.json
  - the staged-path root fixed but _build_adr_index still globbing the ADR folder under the hook's own
    parents[2], so the reverse check sees no ADRs and reports nothing
- name: test_ge_113c_5_staged_adr_that_cannot_be_read_does_not_pass
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: discrimination
  description: 'Stage ADR-901-example.md, then remove its working-tree copy without staging the deletion;
    the installed copy does not report a pass and states that it inspected nothing, naming the unread
    path (the GE-120a-4 outcome): its stdout carries the line ''RESULT: could_not_check'', printed through
    check_outcome.emit_result(OUTCOME_COULD_NOT_CHECK), and never ''RESULT: ok''. The installed layout
    also copies check_outcome.py, which the hook imports.'
  proves_clause: a run that was offered staged documents and could read none of them does not report a
    pass (the outcome GE-120a-4 defines)
  code_file: templates/scripts/commit_guardian/check_adr_cross_reference.py
  must_catch:
  - _extract_frontmatter's OSError -> {} kept, so check_adr returns no finding and the run exits 0
  - the unread file reported only as a warning in the default (non-strict) mode with exit 0
  - a private 'could not check' message minted in the hook instead of check_outcome.OUTCOME_COULD_NOT_CHECK
- name: test_ge_113c_5_nothing_staged_still_passes
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: criterion
  description: 'With no ADR or docs/ file staged (empty scope), the installed copy exits 0, and its stdout
    carries no ''RESULT: could_not_check'' line.'
  proves_clause: a run that was offered staged documents and could read none of them does not report a
    pass (the outcome GE-120a-4 defines)
  code_file: templates/scripts/commit_guardian/check_adr_cross_reference.py
