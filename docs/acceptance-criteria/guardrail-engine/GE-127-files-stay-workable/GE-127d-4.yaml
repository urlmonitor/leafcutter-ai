assigned_agent: python-coder
estimated_complexity: M
package_surface: false
declares_side_effect: false
declared_files:
  - path: templates/scripts/commit_guardian/check_file_size.py
    state: existing
  - path: templates/scripts/commit_guardian/_file_size_measure/backstop.py
    state: to_be_created
it_requirements:
  - >-
    POPULATION: evaluated only when the previous version's length under the current
    measure is strictly greater than the file's permitted length. Reuse the same
    previous-length value the ratchet computes (GE-127d-3-iii), never a second reading.
  - >-
    The backstop is a canary for gaps in the measure, so it must compare the measured
    length with a count the measure cannot influence: the total number of lines in the
    file. It reuses the previous-version resolution the ratchet already performs; when
    that resolution is INDETERMINATE (GE-127b-1-i) the backstop is not evaluated and the
    existing INDETERMINATE outcome stands.
  - >-
    A refusal here is a reported finding: exit status 1, as for every other size refusal.
  - >-
    "TOTAL LINE COUNT" IS THE MEASURE'S OWN PHYSICAL-LINE SPLIT. Previous and current totals
    use the same split GE-127d-3's measure uses (so a final line without a newline counts
    once and CRLF equals LF), read from the previous content the ratchet already fetched
    (get_previous_content) and the staged content it already read — no second git lookup.
    The trigger is strict on both sides: measured strictly fell AND total strictly rose.
  - >-
    MERGES: mirror the ratchet's most-permissive reasoning. During a merge the backstop
    refuses only when the shape (previous over its limit, measured fell, total rose) holds
    against EVERY parent that has the file; a merge that adopts one parent's already-vetted
    version is never refused by it.
  - >-
    OUTCOME SHAPE. The refusal block carries its own heading, distinct from FILE TOO LARGE and
    FILE GREW WHILE ALREADY OVER ITS LIMIT, and states the file, the measured fall (previous
    -> current) and the total rise (previous -> current) and the separate-commits remedy. When
    the same file also fails the two-for-one check, both refusals are reported, each under its
    own heading; neither suppresses the other.
  - >-
    HOST AND SIZE. Under GE-127d-3's rule check_file_size.py measures about 561 (IT PO
    approximation, trailing DECISION HISTORY string included) against its 400 limit, so it is
    an over-limit file under the ratchet: put the backstop's logic in the measure sub-package
    (declared_files) and keep check_file_size.py's own growth within what the two-for-one
    ratchet allows. Signature contracts other modules depend on are frozen: _classify_file's
    (filepath, previous_lengths) parameters, _print_grown_file's four positional parameters
    and _report_indeterminate. If _classify_file gains a verdict value, audit every consumer in
    the same change (main()'s loop, check_file_size_rule_parity._enforced_applies_to_modified_files,
    and the test fixtures that override main() or mutate _classify_file:
    _ge_127a_1_ordinary_commit_fixture.py, _ge_127e_3_i_fixture.py, test_ge_127d_1.py).
  - >-
    Must follow the repo error-handling policy: specific exceptions around the content reads
    it reuses; a failure to read either version takes the existing INDETERMINATE path.
test_spec:
  - name: test_ge_127d_4_measured_fell_while_total_rose_is_refused_and_named
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      In a temporary git repository, stage a version of a tracked covered file whose
      previous version is over its limit that removes C code lines and adds K comment lines
      with K > C (C and K varied). The hook refuses with exit 1, naming the file and both
      pairs of numbers, which the test computes at run time from the two versions with the
      shared measure and a plain line count, and stating the separate-commits remedy; the two
      commits made separately (the C-line cut, then the K comments) each pass.
    must_catch:
      - "backstop omitted"
  - name: test_ge_127d_4_an_under_limit_file_with_a_code_cut_and_more_comments_passes
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      The same code-cut-plus-more-comments change on a file whose previous version stands
      under its limit, and on one standing exactly at its limit (previous lengths computed
      with the shared measure at run time), completes through the hook with no backstop
      refusal. A file that the pre-2026-10-16 rule measured over its limit but the new rule
      measures at or under it also passes.
    must_catch:
      - "backstop evaluated for every covered file regardless of its limit"
      - "over-limit judged with > replaced by >= (a file exactly at its limit refused)"
      - "over-limit judged from the previous version's length under the pre-2026-10-16 rule"
  - name: test_ge_127d_4_the_backstop_catches_a_measure_gap
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      With the shared measure deliberately replaced in-process by the pre-2026-10-16 rule
      (`#` and `//` counted, /* */ and triple-quoted strings discarded), replay the
      2026-10-13 restyle of build-feature.js (over its 1000 limit under either rule) from the KI (`//` runs rewritten as /* */
      blocks) through the hook's verdict: it is refused by this backstop, naming the
      situation, even though the degraded measure reports the file shorter.
  - name: test_ge_127d_4_honest_shapes_are_not_refused_by_the_backstop
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      On a file already over its limit, measured and total both falling, and measured
      unchanged with total rising (comments only), each pass the hook without this
      refusal; so does a newly added file.
    must_catch:
      - "backstop fires when measured is unchanged and total rose"
      - "backstop fires on a newly added file"
  - name: test_ge_127d_4_a_merge_adopting_a_vetted_parent_is_not_refused_by_the_backstop
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      In a temporary repository with a real merge in progress, the staged version of an
      over-limit file equals the MERGE_HEAD parent's version, which against HEAD shows the
      measured-fell / total-rose shape; the hook does not produce the backstop refusal. The
      same staged content committed as an ordinary (non-merge) commit on HEAD is refused.
    must_catch:
      - "backstop judged against HEAD alone during a merge"
  - name: test_ge_127d_4_a_file_failing_both_checks_reports_both_refusals
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      An over-limit file whose staged change both fails the two-for-one requirement and shows
      the measured-fell / total-rose shape is refused at exit 1 with both refusal blocks, each
      under its own heading.
  - name: test_ge_127d_4_the_backstop_refusal_reaches_the_registered_hook_output
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      Through the registered hook entry point, the backstop refusal and its four numbers
      appear in the hook's own output and the exit status is 1.
test_rationale: |
  Under a correct measure the backstop's honest trigger is "removed code and added more
  comments in one change" on an over-limit file, so the criterion descriptor exercises
  exactly that, and the under-limit descriptor proves the same change on a file at or under
  its limit is left alone (BrainCandy's 2026-10-16 population decision). Its real
  purpose is to catch a FUTURE gap in the measure, which no correct measure can
  demonstrate; the discrimination descriptor therefore degrades the measure to the known-
  gamed rule and replays the real 2026-10-13 restyle, proving the backstop catches what the
  measure missed. The merge descriptor exists because the ratchet it sits beside is merge-aware
  and a HEAD-only backstop would refuse ordinary `git merge origin/main` commits, the defect
  KI-CG-20260908 already fixed once for the ratchet.
delivers_to:
