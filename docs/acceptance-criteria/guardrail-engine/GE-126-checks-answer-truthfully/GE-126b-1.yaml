  agent: python-coder
  contract: "The unconditional pre-exit statement: the resolved root and the number of records examined, emitted on every path out of check_ac_governance before any result is reported, plus a machine-readable outcome value distinct from ordinary success. GE-126b-2 partitions that outcome value into three; GE-126b-3 supplies the resolved root the statement reports; GE-126b-1-i removes any switch that could suppress the statement."
