notes: |
  THE ROOT-CAUSE AC. Framed on the faulty assumption the PO named — "the staged diff is the
  author's change" — not on merges. A merge is where the assumption is loudest, but the
  criterion says nothing about merges: it says the change set is what differs from every
  state the commit is built on. On an ordinary commit there is exactly one such state and
  the answer is unchanged, which is why this narrowing costs nothing on the common path.
  GE-120e-4 carries the operations where the number of such states is not the discriminator.

  DELIBERATE PARALLEL, DIFFERENT SUBJECT, to GE-120b-2. That AC makes the family resolve
  PREREQUISITES through one shared facility; this one makes it derive the CHANGE SET through
  one shared source. Same anti-pattern (fifty-odd private copies of one decision), different
  decision. Do not merge them and do not let an implementer satisfy this one by pointing at
  the resolution facility.

  WHY "one shared source" is in the criteria rather than left to the IT-PO: two checks that
  each narrow their own diff will narrow it differently, and the difference will surface as
  one check blocking a merge the other passed — which reads to the author exactly like the
  defect this AC removes. The PO did not prescribe the mechanism and neither does this AC;
  it prescribes that there is one of it.
