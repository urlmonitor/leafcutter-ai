notes: |
  This is the invariant L1. All four numbered kinds of work belong here, because
  for THIS guarantee they are genuinely the same requirement applied four times —
  splitting them would produce four near-identical ACs. What differs per kind is
  the motive, and the BA should carry that difference into the L2 rationale:
    - requirement numbers and ticket numbers are being REPAIRED — drift exists
      today (see GE-120e for the repair itself);
    - decision-record numbers are currently healthy, so guarding them LOCKS IN a
      good state and protects it from the same erosion. Do not write them up as
      if a defect existed;
    - diagram sequence numbers have no collisions today, but a large opt-out
      population, which is GE-120b's problem, not this one's.

  TWO FAILURE SHAPES, ONE PROMISE. This L1 covers both (a) two unrelated
  artifacts claiming one number and (b) one number appearing on two files in
  different lifecycle locations that are then free to disagree about status. Both
  break the same user-facing promise — "this number identifies one thing" — so
  they belong together even though the mechanics differ.

  THE UNIT OF INSPECTION IS THE POINT. The reason none of this was ever caught is
  that today's validation opens one file at a time. A per-file check cannot, even
  in principle, observe that a second file elsewhere claims the same number. The
  L2 decomposition must change the unit of inspection to the whole collection —
  adding another per-file rule cannot satisfy this AC. The reference-doc trigger
  exists because the numbering rules for all four kinds of work are currently
  scattered or unwritten, and a rule that four namespaces must obey has to live
  somewhere a future author will find it.

  BA DECOMPOSITION NOTE (2026-08-17) — how the two failure shapes were split.
  GE-120a-1 carries the collision shape and covers the three namespaces where it
  is possible: requirement identifiers, decision numbers and diagram sequence
  numbers. GE-120a-2 carries the two-copies shape and covers the work-item
  namespace. The split is not by namespace for its own sake — it is because the
  collision shape is structurally impossible for work items, whose identifier IS
  the filename, so two different work items cannot share one in a folder. The two
  L2s together discharge this L1's four-namespace scope; neither alone does.
  GE-120a-1-i (L3) pins the whole-collection inspection scope against a
  changed-files implementation.
