title: "Ticket with change_type doc_change skips TDD injection entirely"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket has change_type: doc_change
    and the assigned work agent is documentation-expert (produces: documentation),
  When ticket-supervisor computes the agent chain,
  Then the chain does NOT contain test-writer
  And the chain does NOT contain test-runner
  And the chain contains only: documentation-expert, pr-reviewer, commit, pull-request
    (plus any standing agents like ac-fulfillment-gate)

  Given a ticket has change_type: prompt_change
    and the assigned work agent is llm-expert (produces: prompt),
  When ticket-supervisor computes the agent chain,
  Then the chain does NOT contain test-writer
  And the chain does NOT contain test-runner
  And the TDD invariant does not apply because the work agent does not
    produce production_code

  Given a ticket has change_type: doc_change but the work agent is
    python-coder (produces: production_code) because it is editing
    a documentation-generation script,
  When ticket-supervisor computes the agent chain,
  Then the TDD invariant DOES apply because the work agent produces
    production_code regardless of change_type
  And test-writer and test-runner are both injected
