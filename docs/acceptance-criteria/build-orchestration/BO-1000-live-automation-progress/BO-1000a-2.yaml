id: BO-1000a-2
components:
  - build_orchestration
title: "The step count N in the announcements is stable and correct across the run"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the finalize-feature workflow announces "Step X of N" as each step
    begins,
  When the start-of-step progress lines from a single run are collected,
  Then the value of N is identical in every start-of-step line within that run,
  And N equals the number of steps in the finalize sequence that the workflow
    declares it will run,
  And the position X advances monotonically as the run progresses, with no
    duplicated or skipped position number for the steps that actually execute.
depends_on: [BO-1000a]
doc_links:
  - path: docs/architecture/components/finalize.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-030-dual-engine-workflow-support.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment: null
  reference_file_path: "templates/workflows-js/finalize-feature.js"
  n_location_rule: "1"
  required_skills:
    - "python-coder"
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  notes: |
    Policy constraints:
    - N must be derived from a single source of truth for the step sequence
      (one declared list/count), never hard-coded per line, so every
      start-of-step line in a run reports an identical N and N cannot drift from
      the number of steps the workflow actually declares.
    - X must advance monotonically with no duplicate or skipped position for the
      steps that execute (skips are still counted and reported — see BO-1000a-3);
      derive X from the same ordered sequence, not an independent counter.
    - Shares the narration helper introduced in BO-1000a-1.
    - No new config key. ADR-001 build.py round-trip parity.
delivers_to: null
expects_from: null
test_required: true
test_spec:
  - name: test_n_identical_across_all_start_of_step_lines
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "Collecting the start-of-step lines from a single run, the N value in the 'Step X of N' framing is identical in every line."
  - name: test_n_equals_declared_step_count
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "The announced N equals the number of steps in the finalize sequence the workflow declares it will run."
  - name: test_position_x_advances_monotonically_without_gaps_or_duplicates
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "Position X advances monotonically across the executed steps, with no duplicated and no skipped position number."
