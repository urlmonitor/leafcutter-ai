notes: |
  THE CLOSED-LIST DECISION GE-125b ASKED FOR, MADE AND STATED — AND THEN NARROWED
  BY A PRODUCT DECISION ON 2026-08-25. The admitted kinds are .md and .txt, and
  everything else at a listed location is fully checked. This record originally
  admitted four kinds — .md, .yaml, .yml and .txt, deliberately the SAME four
  GE-123d-2 chose, as GE-125b directed — and flagged the .yaml member as an OPEN
  product decision because admitting it kept this repository's own
  acceptance-criteria store unscanned for opaque tokens. That decision has now
  been taken the other way. Both states are recorded below, because the reasoning
  is the record.

  THE DECISION, AND THE EVIDENCE IT WAS TAKEN ON. On 2026-08-25 the product owner
  decided that the acceptance-criteria store SHALL be scanned. The scanner was run
  over all 3,260 store records with the location exemption disabled and the
  TICKET-/EPIC- residual-entropy filter still applying, and it produced 58 findings
  across 48 files — 1.4% of the store — from 7 distinct strings, every one of them
  a file path. The top three are a created_by value naming an acceptance-criteria
  YAML record (20 occurrences), a doc_links path naming a component
  PROJECT_CONTEXT.md (14) and a doc_links path naming an agent PROJECT_CONTEXT.md
  (10). They clear the 4.5 threshold at 4.51-4.56 only because a long
  slash-separated path has high character diversity. A sweep of the same 3,260
  files for real credential markers — AWS, PEM, GitHub, Stripe, Slack, Google, JWT,
  connection strings, Anthropic, OpenAI — returned zero hits. Precedent for
  suppressing the residue already exists: .security-allowlist carries an
  ENTROPY_HIGH:docs/build-dataflow.json:* glob for this exact path-slug
  false-positive class. So the cost is one bounded, well-understood false-positive
  shape with an established remedy, and the benefit is that the store stops being a
  place a real opaque token can be committed unexamined.

  WHY .yaml WAS ADMITTED ORIGINALLY, AND WHY THAT ARGUMENT DID NOT SURVIVE THE
  MEASUREMENT. The argument was that the acceptance-criteria store is one of the
  four listed locations and is written in YAML, so excluding .yaml would strip the
  reduced scrutiny from that whole location as a side effect of a decision about
  executable code. The measurement answered it: the exemption that would be lost is
  worth 58 path-slug findings, not a wall of noise, and it is the only thing
  standing between the store and an unexamined opaque token. Note what the counter
  did NOT depend on — the location gate still answers the original worry about
  configuration secrets, because a configuration file outside the four listed
  locations was never exempt and still is not.

  THE LOCATION LIST IS NOT TOUCHED HERE, AND THE DECISION DID NOT TOUCH IT EITHER.
  GE-123d-2's five locations include the changelog area, which it added
  deliberately. This record governs the EXISTING exemption and its four existing
  locations — the ticket tree, the retrospectives area, the acceptance-criteria
  store and the skill-prompt area. Adopting a kind list is not adopting a location
  list, adding a fifth location to this side would be an unasked-for widening, and
  removing docs/acceptance-criteria/ from the list because its YAML is now scanned
  would be an equally unasked-for narrowing. The store keeps its place: its .md and
  .txt files are still admitted there.

  RULE 2 SURVIVES, AND IT IS WHY THE NUMBER IS 58 AND NOT 625. A line carrying a
  TICKET- or EPIC- token whose residual entropy is below the threshold remains
  exempt everywhere, regardless of location and regardless of kind. That filter is
  not path-gated and this change does not touch it. Nothing in this tree may be
  read as saying that acceptance-criteria lines carrying ticket identifiers now
  report.

  THE DIVERGENCE WITH GE-123d-2, RECORDED RATHER THAN TIDIED — READ THIS BEFORE
  SHARING ANYTHING BETWEEN THE TWO EXEMPTIONS.
    - The two lists are now DIFFERENT. This record (the EXISTING ENTROPY_HIGH
      exemption) admits .md and .txt. GE-123d-2 (the PROPOSED GENERIC_SECRET
      exemption) admits .md, .yaml, .yml and .txt.
    - WHY THEY DIFFER. This record originally matched GE-123d-2's four kinds on
      purpose, so that a later sharing of the location data would be a decision
      someone could take safely. The 2026-08-25 product decision closed the
      acceptance-criteria store to opaque tokens on THIS side only. GE-123d-2
      governs a different rule that has not been built and whose own product
      decision has not been revisited, and its tree is fenced — so the two lists
      diverged rather than moving together.
    - WHAT THAT MEANS MECHANICALLY. GE-123d-4-i requires that if the location data
      is ever shared between the two exemptions, the kind gate must be applied on
      BOTH sides or the sharing must not happen. That requirement still binds, and
      it now carries a second obligation: sharing the location data ALSO requires
      reconciling the two kind lists first, as an explicit decision by whoever
      proposes the sharing. A shared location list under two different ideas of
      what prose is, is the configuration GE-123d-4-i exists to prevent.
    - HOW IT MAY NOT BE RECONCILED. Not by quietly re-widening this list back to
      four kinds, and not by editing GE-123d-2 or anything else in the GE-123 tree
      — those records are fenced and this note is on our side only. No GE-123 file
      was edited to record this divergence and none may be.

  DEFAULT-TO-REPORTED IS THE WHOLE POINT OF THE SHAPE. An open list, or a deny
  list of known-executable kinds, both fail in the unsafe direction: the kinds
  nobody enumerated arrive exempt. The second arm exists to make that difference
  observable, and an implementation carrying a hard-coded deny list of .py, .sh
  and .js satisfies the first arm and fails the second.

  FIXTURE PLACEMENT, STATED AND JUSTIFIED. The five fixtures in the first arm all
  sit inside the skill-prompt area because being at a listed location is the
  precondition of the scenario — the question under test is whether the kind
  alone changes the verdict, so the location must be held constant and must be
  one that is entitled. config.yaml is the member added by the 2026-08-25
  decision: it was silent under the original list and is reported now.
  "scripts/build_probe.py" is the control that keeps the silent README
  meaningful. All files are real files in a throwaway git repository; the token is
  assembled at runtime from fragments; every arm runs through the pre-commit
  secrets check over a staged set rather than through the exemption logic
  directly, and the exact counts in the first arm are not expressible any other
  way.
