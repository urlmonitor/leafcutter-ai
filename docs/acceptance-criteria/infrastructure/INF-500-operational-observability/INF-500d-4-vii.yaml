it_requirements:
  - "Document the mechanism as built, not the notes' rule (c): one absolute log root fixed at build time in <output_root>/config/knowledge_sink.json (operational_log_root and per-stream keys), inherited by per-drive worktrees from the main install, and read rather than discovered at run time. Say plainly that git-common-dir was considered and rejected, and link INF-400c-4's record of why."
  - "State the three coexisting resolution rules — (a) configuration, (b) commit guards, (c) durable logs — and that unifying them reintroduces the defect. A reader must be able to tell why the guard resolver is not reused for logs."
  - "CLAUDE.md's 'Feedback sink reachable' pre-drive check must stop prescribing an append to the relative debugging/logs/agent_telemetry.jsonl. It must probe the declared location obtained through the location query instead. Also update or remove its paragraph on the symlinked-.leafcutter caveat (KI-BP-017 / KI-FC-001), which this change makes obsolete. Coordinate the wording with the BO-100d owner's reconciliation and do not contradict BO-100d's approved criteria before they change."
