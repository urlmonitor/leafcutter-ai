    relationship: related
    status: exists
assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
  - "An A entry has no base path: it is type-checked at the head only and its base multiset is empty. When no changed file has a base path, the base checkout and the base mypy run are skipped entirely."
test_spec:
  - name: test_bp_1300f_1_iv_new_file_with_an_error_fails
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: criterion
    must_catch:
      - "skips files with no base version instead of treating their base as empty"
    description: "Head adds scripts/fresh.py with a return-value error at line 2; exit 1 naming scripts/fresh.py:2 and [return-value]."
  - name: test_bp_1300f_1_iv_clean_new_file_passes
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: criterion
    description: "Head adds a clean scripts/fresh.py; exit 0; summary says 1 file and 0 new errors."
test_rationale: >-
  Proved through a real git repository and the real module, because "did not exist
  at the merge base" is a fact about git history that only a real repository has.
