criteria: |
  Given the business analyst has written L2/L3 ACs to the AC store with readiness: draft,
  When the workflow presents gate 2 to the user,
  Then it displays: the AC ids, titles, criteria text, and the parent L1 each
    L2/L3 decomposes,
  And it offers three actions:
    - "approve" — proceed to the technical planner's enrichment,
    - "edit" — provide feedback text; the business analyst is re-invoked with the feedback
      and rewrites the L2/L3 ACs (loop until approved),
    - "cancel" — abort the pipeline; all ACs remain with readiness: draft,
  And if the user approves, the workflow logs the approval timestamp
    and proceeds to the technical planner (it-po), whose stage has no human gate of its own.
