notes: |
  USER DECISION Q2: the lockstep test must cover BOTH enums (it checks only one
  today). V2 is the case that proves the widening; V1 alone is green on arrival
  and proves nothing (per the TQ-500 rule: an AC whose passes are all controls
  needs an adversarial case in the same Given). The deliberate alteration for
  the implementer to record: remove "discrimination" from G only and show the
  check objects.

  IT-PO ENRICHMENT (2026-09-25)
  INTENDED must_catch: "compare only R with T (today's check)" -> V2 passes, test goes red;
  "subset instead of equality" -> the stray-kind test goes red; "failure message omits the
  list name" -> the naming assertion goes red.
