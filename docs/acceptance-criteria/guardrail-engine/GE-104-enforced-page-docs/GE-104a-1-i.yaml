created_by: "docs/acceptance-criteria/guardrail-engine/GE-104-enforced-page-docs/GE-104.yaml"
criteria: |
  Given a newly added frontend page at site/app/parts/page.tsx
  When the guardrail derives the expected reference doc path for that page
  Then it produces exactly one deterministic path docs/reference/frontend/parts.md
  And the route segment "parts" maps to the doc <name> "parts"

  ---

  Given a newly added frontend page at site/app/parts/page.tsx
  And a different newly added page at site/app/settings/page.tsx in the same commit
  When the guardrail derives the expected reference doc path for each page
  Then it produces docs/reference/frontend/parts.md for the first page
  And docs/reference/frontend/settings.md for the second page
  And the two derivations are independent (one missing doc does not mask the other)
