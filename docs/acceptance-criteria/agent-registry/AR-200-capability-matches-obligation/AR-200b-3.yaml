risk_surface: internal
it_requirements:
  - "ONE CHECK, TWO PAIRS (preferred so the two cannot drift): generalise the slice-4 module scripts/skill_tool_grant_validator.py over (declaration-key, invoking-tool) pairs -- ('skills', 'Skill') and ('spawn_allowlist', 'Agent') -- rather than writing a sibling spawn checker. Same parse of `tools:`, same finding shape, same counts, same refuse path. If generalising is not possible without breaking AR-200b-2's tests, a sibling module in the identical shape is the fallback, and the shared `tools:` parse must still be a single function both import."
  - "WIRING: called from registry_validator.validate_agent_registry exactly as the skills check is. scripts/registry_validator.py is over the 400-content-line limit (count_content_lines), so the wiring must be net-neutral -- one call site serving both pairs, not a second call block."
  - "BOTH SIDES FROM THE AGENT'S OWN FRONTMATTER: the `spawn_allowlist` declaration (the key AR-300c-5 fixes) and the `tools:` line, read by the single frontmatter parse AR-300c-5 delivers. The registry spawn_allowlist field is not consulted."
  - "EXACT TOKEN MATCH: `tools:` is a bare comma-separated string; strip any trailing YAML comment (business-analyst: 'tools: Skill, Read, Write, Edit, Bash  # Write/Edit scoped to ...') before splitting on commas and trimming, then compare whole tokens. `Agent` inside a longer token must not count."
  - "REFUSE: a shortfall is a registry validation error and the build stops. The finding names the agent, its declared sub-agents (macro shown as declared) and the tools it declares, and its suggested action is 'grant the Agent tool' -- never 'remove the permission'."
  - "Report agents examined and agents holding a permission; a zero examined population fails rather than reading as no violations. Populations are derived; build-ac and business-analyst are 2026-10-09 measurements, not constants."
  - "REMEDIATION so the real build does not refuse: add `Agent` to the `tools:` line of templates/agents/build-ac.md and templates/agents/business-analyst.md, editing only that token into the line and preserving business-analyst's trailing comment byte-for-byte. Do not empty either agent's `spawn_allowlist`. Adding Agent (not Edit/Write) does not trigger the requires_verification rule."
test_spec:
  - name: test_agent_with_sub_agents_but_without_agent_tool_is_reported
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    angle: criterion
    description: "An agent declaring a non-empty spawn_allowlist whose tools omit Agent is reported, naming the agent, its sub-agents and its declared tools, and validation refuses."
  - name: test_suggested_action_is_grant_the_agent_tool
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    angle: criterion
    description: "The finding's suggested action is to grant the Agent tool, never to remove the permission."
  - name: test_newly_permitted_agent_is_checked_with_no_edit_to_the_check
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    angle: seam
    description: "Adding a spawn_allowlist to a template without Agent produces a finding with no change to the checker; both sides are read from the frontmatter and editing only the registry changes nothing."
  - name: test_agent_tool_is_matched_exactly_after_stripping_a_trailing_comment
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    angle: discrimination
    description: "A tools line with a longer token embedding 'Agent' does not count; a tools line with 'Agent' followed by a trailing YAML comment does."
    must_catch:
      - "substring match on the raw tools string"
      - "the trailing comment is parsed as part of the last tool token"
  - name: test_counts_examined_and_permitted_and_fails_on_zero
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    angle: boundary
    description: "Both counts are reported; a run over zero agents fails rather than reporting no violations."
  - name: test_skill_and_spawn_pairs_share_one_check
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    angle: discrimination
    description: "The same validator call yields both the Skill-tool and the Agent-tool findings in one result for a template lacking both, with the same finding shape."
    must_catch:
      - "a separate spawn checker with its own tools parse"
  - name: test_real_tree_passes_after_remediation_and_failed_before
    target_dir: unit_tests/agents/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "On a copy of the real templates with the Agent remediation reverted, build-ac and business-analyst are reported; on the real templates, no Agent-tool finding remains."
test_rationale: >-
  An agent lacking the dispatch tool does the delegated work itself and reports
  success, so there is no runtime signal; the evidence must be the static comparison
  over the real definitions. The trailing-comment trap is real data, which is why it
  carries must_catch. The shared-check descriptor encodes the preference for one
  validator over two pairs, so the skills and spawn rules cannot drift.
delivers_to:
  agent: python-coder
  contract: >-
    A grant-versus-invoking-tool verdict over (declaration-key, invoking-tool)
    pairs -- {examined_count: int, holding_count: {skills: int, spawn_allowlist:
    int}, findings: [{agent: str, declaration_key: "skills" | "spawn_allowlist",
    declared: list[str], declared_tools: list[str], missing_tool: "Skill" |
    "Agent", suggested_action: str}]} -- whose spawn boundary cases AR-200b-3-i
    fixes.
expects_from:
  ac_id: AR-300c-5
  contract: "The single frontmatter parse returning both `tools` and `spawn_allowlist_declared` (None when absent, [] when empty, macro verbatim) per agent."
