notes: |
  ACS-500 post-implementation spot-check, GAP B. business-analyst.md §1 Step 7
  detects an existing pattern AC by checking only that pattern_slots is present and
  non-null. The deployed hook check_ac_pattern_refs.py (_has_parameterized_slots)
  recognizes a pattern AC by EITHER non-empty pattern_slots OR a {word}-style
  placeholder in criteria. So a pattern AC that declares its slots only via {word}
  placeholders in criteria is silently skipped by the BA's pattern-first inventory,
  defeating the pattern-first reuse check for that pattern. The fix aligns the BA
  predicate with the hook's _has_parameterized_slots definition. Assigned to
  workflow-architect because the change edits the business-analyst agent template.
