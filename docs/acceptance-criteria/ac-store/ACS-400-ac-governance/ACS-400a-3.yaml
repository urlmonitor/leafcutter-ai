title: "Unauthorized agents are rejected when writing the criteria field"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an AC YAML file is staged for commit with a new or changed criteria field,
  When the committing agent's identity is python-coder, test-writer, commit,
    pr-reviewer, or any agent NOT on the authorized list
    (product-owner-v3, business-analyst-v3, it-po-v3, human user),
  Then the commit is blocked,
  And the error message names the unauthorized agent, the file path,
    and states that only requirement authors may modify the criteria field.
depends_on: [ACS-400a]
