  IT-PO ENRICHMENT (2026-09-28)
  architecture-diagram-author lane, with TQ-500g-5.

  IT-PO ALIGNMENT (2026-10-23): AGAINST MAIN AT ae3a1591c
  Technical fields rewritten from the code; criteria, title, depends_on and
  readiness unchanged. Complexity raised from S to M: seven branches plus the
  precondition block may need a continuation diagram.
  MISMATCHES BETWEEN THE CRITERIA AND THE CODE (the diagram follows the code):
    M1 The criteria's order starts at "the copy of the code as written is taken".
       On main every run step first runs recover_all, resolves the scope and
       makes a baseline run on the code as written; a test not passing there
       stops the run before any wrong version.
    M2 "does not load or changes nothing, and is not run or not counted": a
       version that changes nothing is never run (it is compared before any
       copy is taken). A version that does not load IS run and then not counted.
    M3 The put-back also covers the test database on a database run. A failed
       database put-back stops the drive with its own message, beside the file
       put-back stop.
    M4 The survivor branch stops in the route, not in the runner: the runner
       reports gate_passed false with reason "survivor", and each route halts
       before its commit dispatch.
  OQ-3, decided (see below): as in TQ-500g-5-i (level 3, numbering at write
  time).

  USER DECISIONS (2026-10-23, answered directly by the user in the main
  session's AskUserQuestion): OQ-3 accepted as recommended. Level 3, parent
  docs/architecture/diagrams/c2-fast-vs-heavy-lane-phases.md, and the sequence
  number allocated with scripts/next_diagram_seq.py 3 at write time.
