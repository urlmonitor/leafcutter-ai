notes: |
  ATTRIBUTION SURVIVES COMPOSITION. ACD-1600g-2 defines the bundle boundary as a
  set difference. A set is lossy: once the members' exclusions are merged into
  one collection, the identity of the excluding member is gone unless the
  implementation carries provenance through the composition deliberately. This
  L3 exists to force that.

  WHY IT MATTERS OPERATIONALLY. Today the exclusion is authored on the ticket, so
  "the ticket excluded it" is a complete answer -- there is exactly one author.
  After ACD-1800c the container has N members and the reviewer's output is what a
  person acts on. "This bundle excluded the release workflow" gives the reader no
  way to find the decision or the author; they must open all N requirements. The
  §6-style escalation payloads elsewhere in this repo already learned this
  lesson: a summary that names no owner reads to the user as "no reason given"
  rather than as a defect (see ACD-2000a's hazard 3, same shape).

  RELATIONSHIP TO ACD-1600g-3. The parent asserts that a breach is surfaced and
  names the crossing requirement in the single-requirement case. This L3 asserts
  the harder case: the composed case, where three of the four members are
  innocent and the naive report has no member to name at all.

  DELIBERATELY NOT SPECIFIED HERE: the report's format. The criteria assert what
  a reader can determine, not the shape of the emitted object -- that is the IT
  PO's call and depends on whether the reviewer's existing `[scope-extension]` /
  hard-violation record structure is extended or replaced.

  TESTABILITY. Build the four-member bundle on disk, stage a diff touching the
  excluded path, run the reviewer, and assert the emitted report contains the
  third requirement's id and does not contain the other three. Asserting only
  that a blocker was emitted would pass on an implementation that has lost
  attribution entirely, which is the whole defect.

  2026-08-17 (IT PO enrichment). The deferred format decision is made: EXTEND the
  existing hard-violation record with `excluded_by: [ac_id]` rather than replace
  it. Reason -- the reviewer's Step 4 already renders three separate finding
  sections from one record shape, and a parallel structure would require a second
  renderer that only fires on exclusion breaches. The one case where two
  renderers diverge is the case nobody exercises, which is this one.

  Also promoted from the notes into it_requirements: PROVENANCE IS OWED BY
  ACD-1600g-2, NOT BY THIS LEAF. The BA's analysis is right that the set is lossy,
  and the practical consequence is that this AC cannot be implemented after the
  fact -- retrofitting provenance means rewriting compose_boundary(). The
  requirement is therefore recorded on ACD-1600g-2's it_requirements as well, so
  it is satisfied on the first commit rather than discovered here.
