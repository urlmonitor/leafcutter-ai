notes: |
  The guard-on-the-guard L1, and the reason this goal is not simply "make the
  check quieter". Without it, the cheapest implementation of ACS-1200a — relax
  the rule, or treat every missing back-link as intentional — passes, and the
  safeguard is gone rather than corrected.

  This L1 is the one that must be verifiable in the negative: the evidence for
  it is a decomposed tree with a genuinely missing link STILL being blocked
  after the change, not merely the parked tree being allowed. The BA should
  write it that way round.

  Model the message quality on ACS-400e-1 (name the id, the rule, and the
  remedy) if the block message needs revising to explain the new distinction —
  a developer who hits the block must be able to tell whether the fix is "add
  the link" or "mark this as parked".

  BA DECOMPOSITION (2026-08-14), all four written in the negative as instructed:
  ACS-1200c-1 is the decomposed tree still blocked, proved against the
  pre-change implementation so "still full-strength" is measured rather than
  asserted. ACS-1200c-2 is the two-remedy message (ACS-400e-1 shape, extended
  because there are now two legitimate resolutions), and it forbids naming the
  skip as a third. ACS-1200c-3 is the recognition-not-suppression test: a
  childless tree minus the marker is still caught by BOTH surfaces, and adding
  the marker alone flips both verdicts. ACS-1200c-4 stops the marker being a
  universal mute button — it cannot be applied to a record with L2 descendants
  or to an approved one — with ACS-1200c-4-i pinning the single real record in
  the store (BP-900d) that sits in that contradictory state.
