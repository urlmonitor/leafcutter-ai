title: "Valid skill files deploy cleanly and reviewers catch what the build cannot"
component: build-pipeline
level: L1
status: active
work_status: todo
criteria: |
  The build system's happy path works end-to-end — when all skill files are
  well-formed, they deploy without error. Edge cases like MCP-prefixed tool
  names are accepted correctly. For semantic issues that automated validation
  cannot catch (input/output contracts, naming intent), the PR review template
  includes a skill-file checklist so human reviewers have structured guidance.
