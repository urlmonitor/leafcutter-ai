assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: Split record (DK-400a-1 shape) with found_at 'mid_run', work_item_depth >= 1, trigger null, subject_text
    == the item's own question and kept_routing == the item's own routing result; consumed by DK-400b-3 (origin
    shown), DK-400b-2-i (quote check) and DK-400d-3-iii (kept whole).
expects_from:
  ac_id: DK-400a-1
  contract: The detection gates, bundle question and split record of DK-400a-1, applied to a non-root work item.
it_requirements:
  - Mid-run detection runs in the same route pass and Jev batch as routing for any non-root work item that is routed
    semantically (request kind capability) and passes the DK-400a-1 gates. Kernel-internal typed children (evidence
    requests with planned needs, options, synthesis, human and retrieval requests) are never checked.
  - Parts of an approved split are bound deterministically to their approved child capability and are never checked
    for bundling, so splits do not nest (nesting depth 1). A part that still bundles questions is reworded or left
    out at the gate, or asked again as its own request.
  - The mid-run split's subject_text is the work item's own question normalised by the shared whitespace helper;
    the root goal is never used as subject or for quotes.
  - 'While its split is open the item is waiting: it is neither routed again nor executed as one, and its parent
    stays waiting on it.'
  - A split item below the root reports to its parent one child outcome whose status follows the part-derived rule
    of DK-400e-1 (completed only if every part not left out settled, partial otherwise) and whose result is the
    split record; a parent that cannot use that result treats it as a failed required child (existing rule), never
    as a fabricated single answer.
  - 'Built now and dormant (user decision at the final gate, 2026-10-05): the mid-run path ships with no production
    producer wired, because no capability in today''s kernel proposes a semantically routed capability child below
    the root. It is exercised only through an injected test producer (a scripted capability registered in test code
    under tests/kernel/, never in config/capability_registry.json or the composition root). split.enabled alone
    does not activate it: with split.enabled true and the shipped registry, no run ever starts a mid_run split.'
  - 'Tests enable splitting explicitly: split.enabled true through a config override (false only where a test compares
    with the off switch). None relies on the shipped default, which stays false until E3 merges (dec-9925ebf1895222f4,
    see DK-400a-1). A test asserting that no split starts must run with splitting on, or it passes for the wrong
    reason.'
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_mid_run_decision_question_starts_split_at_depth_one
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: reachability
    description: Through an injected test producer (a scripted capability that proposes a capability child holding
      the split-bounds question), with bundle 0.9 the child gets a split with subject_kind decision_question, found_at
      mid_run, depth 1, trigger null and the child's own question as subject, and the child does not execute.
  - name: test_split_parts_are_never_checked_for_bundling
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: Approved parts are bound to their child capability without a routing Jev call and no bundle question
      is asked for them.
  - name: test_internal_typed_children_never_checked
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: Evidence, options, synthesis and human children of a decision carry no bundle question.
  - name: test_mid_run_path_dormant_without_injected_producer
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: failure
    description: With split.enabled true, the shipped config/capability_registry.json and no injected producer,
      a full decision run creates no capability child below the root and records no mid_run split.
test_rationale: Mid-run detection has no production producer, so the reachability test injects a depth-1 capability
  child through a scripted test capability and drives it through the real scheduler, and a dormancy test proves
  that split.enabled alone never starts a mid-run split.
