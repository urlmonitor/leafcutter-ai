title: "The coder is dispatched on resume when an earlier drive's tests are still on disk"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a code ticket whose Test Requirements section is absent,
    and no test-writer phase is scheduled in this drive because an earlier drive already
    signed test-writing off,
    and the test files that earlier drive wrote for the ticket are still present on disk,
  When the supervisor reaches the point where it would spawn the coder phase,
  Then it spawns the coder,
  And the ticket is not held back for missing tests,
  So a resumed drive is not deadlocked by evidence only the first drive could have supplied.
