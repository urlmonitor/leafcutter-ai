notes: |
  THE FAILURE THIS RECORD ANTICIPATES IS THE ONE THAT ALREADY HAPPENED, ONE LEVEL UP. The
  present defect is an instruction shipped without its means. The natural successor defect is
  an instruction shipped with a means it no longer describes — the arguments were widened,
  the surfaces were corrected in the package, and one of them did not travel. Both produce an
  author who does exactly what they were told and gets an error, and the second is harder to
  diagnose because everything is present.

  THE THIRD CLAUSE IS THE WHOLE RECORD AND IT IS WHY THIS IS NOT A CLAUSE OF INF-1300b-4.
  Comparing the surfaces against the means inside this package is a different observation
  from comparing the copies that arrived. This project's recorded history includes a hook
  whose helper module was not in the deploy list and crashed on import in every consuming
  project while passing every test here, and a validator that was lost from the deployed tree
  and silently disabled all enforcement in every consumer. In both cases the package's own
  copies agreed with each other perfectly.

  FALSIFIABILITY. Adopt the package into an empty project. In that project, extract from each
  arrived surface the invocation it instructs — the path and the arguments — and compare the
  set of arguments each names against the set the arrived means accepts and the set it
  requires. The record is falsified by an argument an instruction names that the means
  rejects, by an argument the means requires that no instruction names, by a path that does
  not hold what the instruction says it holds, and by the two arrived surfaces stating
  different invocations. It is falsified as an OBSERVATION if it is performed against this
  package's files. Note that the comparison must be of the arrived text against the arrived
  behaviour: reading two arrived documents and finding them consistent with each other says
  nothing if neither matches the means.

  A DISAGREEMENT TO SETTLE BEFORE THIS CAN PASS, RECORDED SO IT IS NOT FOUND LATE. The two
  surfaces already state different invocations today — one requires a date argument with a
  stated reason and the other omits it. Whichever way that is resolved, it must be resolved
  on both, and both must then be what arrives.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale, delivers_to and expects_from. Those are the IT PO's.
