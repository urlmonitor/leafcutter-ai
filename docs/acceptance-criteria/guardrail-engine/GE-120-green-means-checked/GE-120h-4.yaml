id: GE-120h-4
title: "The page a reader trusts says which one of its statements switches a check on, so a seriousness rating beside a check's name is never mistaken for protection"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the published index of checks that a reader — or an agent acting for one —
    consults to learn what protects their work,
  When that index is read,
  Then it states which single statement about a check is what causes that check to run,
    and states that a seriousness rating, a settings block, a configuration entry and
    automatic-repair routing are descriptions of a check and that none of them switches
    one on,
  And for every check it lists, it says whether that check is reached on an ordinary
    commit, so a check that is described while nothing runs it is distinguishable from
    one that runs, at the place the reader is already looking,
  And it states that a description of a check is reconciled against the list that runs
    checks and that a disagreement refuses the change — as a rule in force, not as one
    that is forthcoming, optional, or to be supplied by a later pass,
  And what it says about any given check agrees with what that check's entry on the
    running list actually does, so the written index and the executing list agree at the
    one point where they could disagree,
  And a reader who follows the index to decide whether a protection is in place reaches
    the same answer as the reconciliation does — the page is not a second source of truth
    beside it.

  Coverage note: the agreement clause is the one that can be exercised rather than merely
  written: it is a property of two artifacts and it fails when they diverge. The others
  are satisfied by text, which is why the named mutations in the notes must be executed
  rather than described.
depends_on:
  - GE-120h
  - GE-120h-1
  - GE-120h-3
