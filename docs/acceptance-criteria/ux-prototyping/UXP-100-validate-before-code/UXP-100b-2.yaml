criteria: |
  Given the gap report identifies "timeline-view" as a missing component
    needed in the "main content area" of the prototype,
  When the UX designer agent processes the gap report,
  Then the agent dispatches a research request for "timeline-view" that includes:
    the usage context, the visual role it must fill, and any constraints from
    the existing design system (spacing, color palette, typography scale)
  And the agent does not generate a placeholder or ad-hoc markup for the missing component
  And the prototype output marks the position as "pending: timeline-view research"
    rather than filling it with an approximation
