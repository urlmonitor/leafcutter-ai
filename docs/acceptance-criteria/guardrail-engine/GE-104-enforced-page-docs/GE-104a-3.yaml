criteria: |
  Given the page-documentation guardrail capability is delivered (the commit-time
    hook of GE-104a-1 and the planning-time trigger of GE-104a-2)
  When an operator looks for guidance on how to use it
  Then a how-to guide is available that explains how to enable and configure the
    guardrail, including how to choose between "block" mode and "warn-only" mode
  And the how-to explains the deterministic page-to-doc naming convention so the
    operator can predict that a page at site/app/<route>/page.tsx requires a
    reference doc at docs/reference/frontend/<name>.md
  And the how-to explains how an author satisfies a block (create the named
    reference doc) so a blocked commit can be resolved without guesswork

  ---

  Given the page-documentation guardrail enforces at two layers — a planning-time
    documentation-expert trigger and a commit-time hook
  When the operator reads the how-to guide
  Then the guide states that the planning-time documentation-expert trigger exists
    (it raises documentation as expected work when a new page is planned)
  And the guide states that the commit-time hook is the authoritative backstop that
    actually blocks an undocumented new page at commit time
