id: ACD-400a-3-ii
components:
  - ac_driven_dev
readiness: approved
priority: high
title: "A genuine non-ancestor dependency still gates readiness on work_status done"
component: ac-driven-dev
level: L3
status: active
req_status: active
work_status: done
criteria: |
  Given the AC store contains an approved, active, todo L2 "Z-300a-1"
    with depends_on: [Z-300a, W-400b-2], where "Z-300a" is its own parent L1
    (a composite) and "W-400b-2" is an L2 belonging to a DIFFERENT feature
    (not an ancestor of "Z-300a-1"),
  When the scanner is invoked with leaf and todo filters and "W-400b-2"
    has work_status: done,
  Then "Z-300a-1" appears in the ready list and not in the blocked list
    (the ancestor is ignored and the satisfied cross-feature dependency clears),
  And given instead "W-400b-2" has work_status: todo,
  When the scanner is invoked with the same filters,
  Then "Z-300a-1" appears in the blocked list and not in the ready list,
  And the blocked entry for "Z-300a-1" names "W-400b-2" as its blocker
    and does NOT name the ancestor "Z-300a".
depends_on: [ACD-400a-3]
doc_links:
  - docs/reference/ac-schema.md
  - docs/architecture/components/ac-driven-dev.md
  - scripts/ac_store/scan_ac_store.py
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Ancestor exclusion must be surgical: only an AC's own transitive ancestors are dropped from the gating set; genuine non-ancestor depends_on entries must still gate readiness exactly as before (positive control against over-exclusion)."
  - "A non-ancestor dependency gates only while its work_status != done; when it reaches done the leaf must clear to ready (done->ready transition), and while todo the leaf must be blocked (todo->blocked transition)."
  - "A blocked entry must name the real non-ancestor blocker (e.g. W-400b-2) and must NOT name the excluded ancestor (e.g. Z-300a)."
  - "Must remain read-only, O(n), and idempotent; classification must be consistent with ac_prioritizer.py."
delivers_to: null
expects_from:
  ac_id: ACD-400a-3
  contract: "Ancestor-aware classification that excludes ancestors but preserves gating on genuine non-ancestor dependencies"
origin_agent: business-analyst-v3
