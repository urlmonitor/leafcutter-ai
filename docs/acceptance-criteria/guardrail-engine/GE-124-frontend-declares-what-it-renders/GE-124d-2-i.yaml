implemented_by: []
change_target: code
risk_surface: contract_boundary
notes: |
  The PO's line: "An empty reason is not a reason. 'N/A', blank, or a bare
  marker with no text must be rejected, or the opt-out becomes a one-token
  bypass and this AC has delivered nothing."

  All three forms are scenarios because they are three different code paths — a
  marker with no value at all, a value that is a placeholder token, and a value
  that is only whitespace. An implementation that checks only "is the reason
  key present" passes the first, and one that checks only "is the string
  non-empty" passes the second and third.

  Mock-data invariant: verdict == 'pass-with-reason' implies a non-empty visible
  reason string.

  DELIBERATE NON-REQUIREMENT: no minimum length, no required author name, no
  required date. A quality bar the check cannot judge would be theatre; the
  visibility of the reason in the diff is what makes it accountable, and a
  reviewer is the judge of whether it is a good reason.
