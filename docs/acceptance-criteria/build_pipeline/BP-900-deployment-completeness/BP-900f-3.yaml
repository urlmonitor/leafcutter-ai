title: "The tracked-source guard generalizes beyond feedback and catches any newly untracked deployable directory on a fresh clone"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900f.yaml"
criteria: |
  Given a deployable directory other than feedback — for example a future
    scripts/doc_compliance/ source whose template-referenced scripts are deployed
  And one of its source files is added to the working tree but left untracked in
    git
  When the build runs the tracked-source guard on a fresh clone state (no leftover
    untracked working-tree files beyond the one under test)
  Then the guard fails the build and names that newly untracked source file,
    without any feedback-specific or directory-specific special-casing
  And when every deployable source across all directories is tracked, the guard
    passes
  And the same guard run on the same committed state yields the same verdict every
    time, independent of which untracked files happen to be present in any local
    working tree
