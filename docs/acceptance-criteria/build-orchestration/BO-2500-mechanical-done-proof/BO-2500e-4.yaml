  - path: docs/architecture/adrs/ADR-003-test-source-of-truth-discipline.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    done_proof_js_mark_done_end_to_end:
      type: object
      description: "End-to-end mark-done for a JS-covered AC: an AC stuck in_progress solely because its only tests are passing '// covers:<id>' vitest tests flows through the SAME mark-done path used for Python-covered ACs and is transitioned to done — no longer blocked for being non-Python."
  reference_file_path: "scripts/ac_store/mark_ac_done.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "The JS-covered AC must flow through the SAME mark_ac_done path used for Python-covered ACs (no separate JS-only transition), so front-end work is marked done end to end via one mechanism."
    - "The mark-done must be gated on the JS eligibility verdict from BO-2500e-2 (genuine passing vitest), never on the mere presence of a '// covers:' tag."
    - "The transition must be idempotent — re-running on an already-done AC is a no-op — and must only touch the target AC's work_status field."
    - "Must unblock the currently stuck UXP-596 / UXP-591 set that sits at in_progress solely for being non-Python."
delivers_to: null
expects_from:
  ac_id: BO-2500e-2
  contract: "Per-AC JS eligibility verdict { ac_id, can_be_done, reason } that gates whether mark_ac_done transitions the AC to done."
test_spec:
  - name: test_js_covered_ac_marked_done_via_shared_path
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    description: "A JS-covered AC stuck in_progress with a passing vitest test is mechanically marked done through the same mark-done path used for Python-covered ACs."
  - name: test_js_mark_done_gated_on_eligibility
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    description: "A JS-covered AC is transitioned to done only when the BO-2500e-2 eligibility verdict holds, not on tag presence alone."
