notes: |
  WHY THIS IS A RECORD AND NOT A CLAUSE OF ITS PARENT. Its named mutation reddens only this
  record. INJECTION: examine each guard by starting it as a command with the known-bad path
  among its arguments and read its exit status as the verdict. Under that injection the
  parent's clauses still hold on any guard that does read a command line, so the parent can
  stay green while this one goes red — which is exactly the asymmetry that makes a separate
  record worth its file. It is also the cheapest wrong implementation available: it needs no
  understanding of how the editor talks to a guard, it runs everywhere, and on day one it
  produces a quiet, green, completely false report.

  ARRIVAL COLOUR: GREEN, VACUOUSLY, and that is the trap. Nothing examines these guards today,
  so nothing wrongly reports a clean exit as a demonstration. The colour must not be read as
  coverage; the mutation above is what gives the clause meaning, and it has to be run.

  THE TWO VALUES ARE NOT INTERCHANGEABLE. Never-asked and could-not-be-run mean different
  things to whoever reads the report: the first says the regime has not got to this guard yet,
  the second says something is in the way. Collapsing them turns a to-do list into a shrug.

  Authored at the BA stage. L3 constraint only. No assigned_agent, no it_requirements, no
  test_spec, no estimated_complexity — the IT PO's.
