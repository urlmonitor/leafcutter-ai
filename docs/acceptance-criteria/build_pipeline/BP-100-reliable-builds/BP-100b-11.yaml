estimated_complexity: M
it_requirements:
  - "Resolve each hooks_manifest entry's script path (handling the run_hook.py wrapper form and any {{config.output_root}} template placeholder) and assert the referenced script file exists in the corresponding tree (template entries resolve against the template tree; deployed entries against the deployed tree)."
  - "Compare the set of hook ids in the deployed registry against the set derivable from the canonical template registry; flag any deployed-only id that has no corresponding template entry."
  - "Concrete grounding defect this AC must catch: the deployed scripts/commit_guardian/commit_guardian.json registers id 'check-ac-limits' (entry scripts/commit_guardian/hooks/check_ac_limits.py) which (a) references a non-existent script and (b) is absent from templates/scripts/commit_guardian/commit_guardian.json, which only declares 'check-ac-tree-limits'. The fix edits the registration (add to template with its script, or remove the deployed entry)."
  - "Exit 0 (fail-open) on unexpected errors such as unreadable directories or malformed JSON; exit 1 only on a detected referential-integrity or template-derivability violation."
  - "Read registry file paths from configuration; do not hardcode them."
