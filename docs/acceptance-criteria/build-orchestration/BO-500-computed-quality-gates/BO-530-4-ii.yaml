id: BO-530-4-ii
title: "Render tooling unavailable in the worktree surfaces clearly and never silently passes"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
created_by: docs/acceptance-criteria/build-orchestration/BO-500-computed-quality-gates/BO-530-4.yaml
criteria: |
  Given a ticket whose changed surface includes frontend files,
    and the tooling needed to perform the dev/route render is not available
    in the worktree (for example the render runner cannot start or its
    dependencies are not installed),
  When the sign-off gate attempts the dev-render smoke check,
  Then the gate does NOT record the smoke check as passed,
  And it records the check as inconclusive, naming the reason the render could
    not be performed (tooling unavailable),
  And the sign-off cannot reach an "ok" verdict on a frontend surface whose
    render was never actually exercised,
  And the inconclusive outcome is surfaced to the supervisor for resolution
    rather than being swallowed silently.
depends_on: [BO-530-4]
