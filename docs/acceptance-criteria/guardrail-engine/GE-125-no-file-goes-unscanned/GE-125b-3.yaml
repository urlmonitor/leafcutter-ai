notes: |
  THE CLOSED-LIST DECISION GE-125b ASKED FOR, MADE AND STATED. The admitted kinds
  are .md, .yaml, .yml and .txt, and everything else at a listed location is
  fully checked. This is deliberately the SAME four kinds GE-123d-2 chose for the
  adjacent problem, as GE-125b directed — there was no reason to differ, and
  there is a positive reason to match, set out below.

  WHY MATCHING THAT LIST IS THE SAFE CHOICE RATHER THAN A LAZY ONE. GE-123d-4-i
  requires that if the location data ever comes to be shared between the existing
  shapeless-value exemption and the proposed keyword-rule exemption, the kind gate
  must be applied on both sides or the sharing must not happen. Two rules holding
  two different ideas of what prose is, over one shared location list, is the
  configuration in which that requirement is hardest to keep. Choosing the same
  four kinds makes the later sharing a decision someone can take safely. It does
  not merge the two records and does not close either one.

  THE LOCATION LIST IS NOT TOUCHED HERE. GE-123d-2's five locations include the
  changelog area, which it added deliberately. This record governs the EXISTING
  exemption and its four existing locations — the ticket tree, the retrospectives
  area, the acceptance-criteria store and the skill-prompt area. Adopting a kind
  list is not adopting a location list, and adding a fifth location to this side
  would be an unasked-for widening.

  WHY .yaml IS ADMITTED, SINCE IT IS THE ONE THAT LOOKS WRONG AT FIRST. The
  acceptance-criteria store is one of the four listed locations and it is written
  in YAML; excluding .yaml would strip the reduced scrutiny from that whole
  location as a side effect of a decision about executable code, which is a
  different change and nobody has asked for it. The counter-worry — that YAML is
  where configuration secrets live — is answered by the location gate, not the
  kind gate: a configuration file outside the four listed locations was never
  exempt and still is not. GE-123d-2 recorded the same reasoning and also
  recorded why a per-area kind list (YAML only in the store, Markdown only in the
  ticket tree) was rejected as over-fitting to today's layout.

  DEFAULT-TO-REPORTED IS THE WHOLE POINT OF THE SHAPE. An open list, or a deny
  list of known-executable kinds, both fail in the unsafe direction: the kinds
  nobody enumerated arrive exempt. The second arm exists to make that difference
  observable, and an implementation carrying a hard-coded deny list of .py, .sh
  and .js satisfies the first arm and fails the second.

  FIXTURE PLACEMENT, STATED AND JUSTIFIED. The four fixtures in the first arm all
  sit inside the skill-prompt area because being at a listed location is the
  precondition of the scenario — the question under test is whether the kind
  alone changes the verdict, so the location must be held constant and must be
  one that is entitled. "scripts/build_probe.py" is the control that keeps the
  silent README meaningful. All files are real files in a throwaway git
  repository; the token is assembled at runtime from fragments; every arm runs
  through the pre-commit secrets check over a staged set rather than through the
  exemption logic directly, and the exact counts in the first arm are not
  expressible any other way.
