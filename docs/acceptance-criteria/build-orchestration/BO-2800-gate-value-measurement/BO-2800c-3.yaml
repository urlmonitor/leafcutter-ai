title: "Recording an override never makes overriding harder or slower"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an operator or supervisor decides to proceed past a blocking finding,
  When the override record is captured,
  Then proceeding requires no approval step, no confirmation prompt, and no additional
    authorisation that was not already required before override recording existed,
  And the only information the decision-maker supplies is the reason they were already
    expected to state in prose,
  And if the override record cannot be written — for example the record store is
    unreachable — the work still proceeds and the failure to record is surfaced as a
    warning naming the gate and the piece of work,
  And no code path causes a failure to record an override to block, halt, or reverse the
    work that was proceeding.
