criteria: |
  Use evidence deliberately and recognize when it is unavailable.

  Agents choose when project knowledge is needed, obtain attributable evidence through their existing working process, and stop once they have enough. The project remains usable when this capability is disabled, and outages or missing prerequisites are never presented as proof that no knowledge exists.
