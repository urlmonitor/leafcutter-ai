expects_from:
  ac_id: BO-2600a-2
  contract: "select_connected --exclude-structural-parent --ac <id> prints the JSON ordered id list of the connected build set."
it_requirements:
  - "Edit Step 2b of templates/agents/build-ac.md so that when the resolved connected build set has more than one member, the coordinator routes to epic generation (reuse the goal_to_epic path already wired for goal-mode) instead of the single-ticket generator."
  - "Epic tickets must be dependency-ordered and cross-wired: reuse goal_to_epic's resolve_leaf_dependencies + topological_sort so each generated ticket's depends_on references co-located ticket files, satisfying ticket_frontmatter_guard (which requires depends_on to reference existing tickets in the same epic folder)."
  - "Do NOT emit flat cross-referencing tickets in tickets/00_inbox — the epic folder is the output shape."
  - "Verify behaviorally: a multi-member set must actually produce an epic folder whose tickets pass ticket_frontmatter_guard, and whose depends_on edges match the resolved dependency order — not a grep-only assertion (CLAUDE.md 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep')."
  - "Real validating case: GE-113c-3 resolves to {GE-113c-3, GE-113c-3-i, GE-113c-3-ii, GE-113c-3-iii, GE-113c-3-iv} (structural parent GE-113c excluded), so /build-ac must emit an epic of those five, not a single ticket."
test_spec:
  - name: test_multi_member_set_generates_epic_folder
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    description: "A connected build set of size >1 produces an epic folder with one ticket per member, not a single ticket"
  - name: test_epic_tickets_dependency_ordered_and_wired
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    description: "Generated epic tickets are ordered prerequisites-first and their depends_on reference co-located tickets so ticket_frontmatter_guard passes"
  - name: test_ge_113c_3_resolves_to_five_member_epic
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    description: "GE-113c-3 (structural parent excluded) yields the target plus its four L3 children as an epic"
