notes: |
  THE ORPHANED KNOB. ACD-2000a's notes: "ADJACENT ORPHAN, same shape:
  SKILL.md §4 (line ~784) makes the test-failure rework cap 'configurable
  per-ticket via `test_failure_rework_cap:` in the TICKET FRONTMATTER'.
  `test_failure_rework_cap` has ZERO occurrences in BOTH
  config/ac_store_schema.json AND scripts/ac_store/generate_ticket_from_ac.py --
  so the knob is unreachable from the AC path today and will be unauthorable
  after the cutover. Design the trail so the cap OVERRIDE has an AC-side home
  too, not just the cap COUNTER."

  TWO SEPARATE THINGS, ONE TREE. ACD-2000a-1 gives the COUNTER a durable home;
  this L2 gives the LIMIT an authorable home. They fail independently: a durable
  counter with no authorable limit means every requirement gets the hard-coded
  default forever (today's state, one layer down); an authorable limit with a
  volatile counter means the number is respected within a run and forgotten
  between runs (today's state exactly). Hence the depends_on edge on both
  siblings.

  THE ZERO CASE (fourth Then) IS THE CLASSIC DEFECT and is why it is written into
  the criteria rather than left to an L3. `cap = ac.get("rework_cap") or DEFAULT`
  reads a declared zero as "unset" and silently restores the default, which is
  the opposite of what the author asked for. A declared zero is a meaningful
  value: "do not rework this, tell me immediately". Any implementation that
  cannot express it has the bug.

  THE FIFTH THEN CLAUSE (visibility) exists because a budget that only manifests
  as behaviour cannot be reviewed. It also makes the AC testable without running
  five failures: the effective budget is readable. Note it says "the budget in
  force" -- i.e. the resolved value including the default -- not merely "the
  override if present".

  SCOPE NOTE: the criteria speak of the rework budget for repeated test failures
  because that is the cap SKILL.md §4 makes configurable. The ladder's other caps
  (§3.1 respawn-same-agent, §3.2 respawn-sibling, §3.3 brainstorm-lead) are
  fixed at 1 today and are deliberately NOT in scope here; if the IT PO
  generalises the mechanism to all four, that is an extension, not a
  reinterpretation of these criteria.

  SCHEMA CONSTRAINT: new optional field; additionalProperties:false is enforced
  today, so ACD-1900a's additive landing gates it. Absence = the standard budget
  (third Then), which is the ADR-026 rule 4 tolerant-reader behaviour.

  TESTABILITY. Drive real failures against a real requirement carrying the
  override and count reworks before the escalation. Asserting that the code reads
  a field named for the cap proves nothing about the number being honoured -- and
  the current code path already reads such a field from a place nothing writes.

  2026-08-17 (IT PO enrichment). Assigned python-coder, complexity M. Scope fence
  respected: only the test-failure rework cap is in scope, and it_requirements adds
  a test that the three fixed caps did NOT become overridable as a side effect.

  THE BA'S ORPHAN FINDING IS TRUE BUT UNDERSTATED, AND THE STRONGER VERSION IS NOW
  IN it_requirements. The BA says the knob "is unreachable from the AC path today".
  Verified across the whole worktree: `test_failure_rework_cap` occurs in exactly
  one non-AC, non-doc file -- templates/skills/building-epics/SKILL.md line 784 --
  plus one done ticket and one test. It is unreachable from EVERY path, not only
  the AC path: no code reads it from ticket frontmatter either, so the "configurable
  per-ticket" sentence has never been true since it was written.

  AND THE KNOB HAS A GREEN TEST OVER IT ALREADY, WHICH IS THE SHARPER PROBLEM.
  unit_tests/test_generate_ticket_from_ac.py line 2218,
  test_bo530_3i_building_epics_documents_test_failure_rework_cap, asserts that the
  §4 row exists in SKILL.md's TEXT. Its docstring is candid: "DOCUMENTATION CHECK
  (not runtime enforcement) ... no Python script reads the cap ... It intentionally
  does NOT assert enforcement, because there is no code path to enforce (M-3)", and
  it invites "a future ticket that makes the cap mechanically enforced ... [to] add
  a separate test that drives that code path". THIS AC IS THAT TICKET. Retargeting
  or superseding that test is therefore a mandatory part of the change and is
  recorded as an it_requirement -- otherwise BO-530-3-i's coverage remains a grep
  that stays green whether or not the new mechanism works, which is precisely the
  phantom-done shape CLAUDE.md's gate/workflow rule exists to stop.
