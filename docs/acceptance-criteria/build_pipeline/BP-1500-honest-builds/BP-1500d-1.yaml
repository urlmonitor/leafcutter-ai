notes: |
  THE LAYOUT AMBIGUITY BP-1500d-3 CORRECTED IN ITSELF IS PRESENT HERE TOO, IN
  THREE FIELDS, AND IS REPORTED RATHER THAN EDITED -- 2026-09-07. It originates
  in this record's own harness description, which is where -3 said it came from.
  All three fields are the IT PO's (test_spec, it_requirements, delivers_to), so
  they are named here with the exact correction each needs rather than rewritten
  by this agent. None of them is a wording nicety: each admits a reading under
  which the fixture is stood up in the one layout ADR-001 says hides this whole
  family of defect, and a fixture built to that reading is green on the exact
  install that shipped broken.

    1. test_spec entry 3's surface_invoked reads
       "python <scratch>/leafcutter-ai/scripts/build.py --target-dir <scratch>".
       With the package copy at <scratch>/leafcutter-ai/, that makes the target
       EQUAL to package_root.parent -- the self-host layout, not the
       out-of-package venue this L1 mandates. It also contradicts this record's
       own it_requirements #2 in the same breath. Correct it to the sibling
       form the other entries and the built harness actually use:
       "--target-dir <scratch>/receiving_project", package at
       <scratch>/leafcutter-ai/. This is the same defect -3's it-po found in
       its own entry 2 on 2026-09-07 and fixed across all four of its entries.

    2. it_requirements #2 and the delivers_to contract to BP-1500d-2 both phrase
       the placement rule as "the target's realpath is NOT under
       package_root.parent". THE LOOSE FORM IS WRONG AND FALSE-FAILS THE CORRECT
       LAYOUT. The forbidden case is target == package_root.parent, an EQUALITY.
       "Under" -- descendant-of -- is not forbidden and must not be: the correct
       sibling layout places the receiving project at <scratch>/receiving_project
       while the package copy sits at <scratch>/leafcutter-ai, so the target IS a
       descendant of that package copy's parent, by construction, in every
       correct run. A precondition written the loose way and evaluated against
       the SCRATCH package copy rejects the only layout that proves anything.

    3. WHY NOTHING IS RED TODAY, AND WHY THAT IS NOT REASSURANCE. The built
       harness evaluates the rule against the REAL producing package's parent --
       the development workspace -- rather than against the scratch copy's
       parent, and against that root the loose and the precise forms happen to
       agree, because the temp-root target is neither equal to the workspace nor
       inside it. So the ambiguity is currently masked by which root the
       implementer chose, not resolved by the specification. The next person to
       read these fields without the harness in front of them can pick the other
       root in good faith and get a precondition that rejects every correct
       fixture, or the other layout and get one that accepts the layout the
       defect hides in. Say EQUALITY, and say WHICH package root, in all three
       places.

  THE MANIFEST-PATH CLAIM IN THIS RECORD'S doc_links WAS STALE AND IS NOW
  CORRECTED IN PLACE -- 2026-09-07, reported by BP-1500d-3 and verified here
  against current source before changing anything. The claim was "manifest_path
  = package_root / '.build_manifest.json' -- always the package, never
  --target-dir". The build resolves the record's directory from the target
  whenever one is supplied. The old text is quoted verbatim inside the corrected
  relevance string so the change is auditable. The same claim also survived in
  KI-BP-011's Symptom paragraph and was corrected there on the same date; that
  entry is a known-issues register rather than an AC, and its Status line still
  reads open against BP-1500d, which its owner should revisit now that a large
  part of what it documents has been fixed underneath it.

  A NEW CHILD WAS ADDED 2026-09-07: BP-1500d-1-ii, for a record entry that is
  keyed to the receiving project and still points outside it. See its own notes
  for why neither this AC's clause nor BP-1500d-3 nor BP-1500d-2 reaches it.

  WHAT THIS CHILD OWNS. Points (a) and (b) of the guarantee stated in BP-1500d's
  notes: the record belongs to the project the build wrote into, and it travels
  with that project. (b) is a consequence of (a) rather than a separate mechanism
  -- once the record is inside the project, copying the project copies it -- so
  the two are kept in one child instead of being split into two that would pass
  or fail together.

  THE EMPTY-RECORD NEGATIVE CONTROL IS NOT PADDING. A record that is filed in the
  right place and accounts for nothing is portable, readable, and useless, and it
  satisfies every other clause here. Without that second breakage the inspection
  can be closed by writing an empty record into the receiving project, which is a
  worse outcome than today because it also silences the two checks while looking
  correct.

  OVERLAP WITH BP-1500a -- flagged, deliberately not owned. Because the record is
  filed with the producing package today, a build aimed at someone else's project
  overwrites the producing package's own record with facts about that other build.
  That consequence is a build leaving an edit in a tree it was not aimed at, which
  is BP-1500a's promise ("a build leaves the repository it is run from exactly as
  it found it"). It is cited here and owned there. No clause above asserts anything
  about the producing package's own tree.

  ORDERING. BP-1500d-2, -3 and -4 all presuppose the record produced by this child.
  depends_on carries only the parent link, as the authoring request specified; the
  it-po should wire the intra-family ordering as delivers_to / expects_from, with
  this AC as the producer of the receiving project's record.

  FOR THE IT-PO. The observable effect here is a file written into a tree outside
  the process, so declares_side_effect is a live candidate on this record. The
  fixture constraint is load-bearing: the scratch project must be created outside
  the producing package's parent folder, because inside it the defect does not
  appear -- that layout is the one place the current behaviour looks correct, which
  is how this survived to now.

  IT-PO RESPONSE, 2026-08-25. declares_side_effect is set TRUE. The schema's test is
  "the Then clause asserts something observable outside the process"; this Then says
  the receiving project HOLDS a record after the build, which is a file in a tree the
  build process does not own. Force-routing user-surface-smoker is not incidental here
  -- it is the only phase agent that runs the real surface end-to-end and inspects the
  result, which is exactly the proof shape BP-1500d's notes make binding on this child.

  package_surface is deliberately NOT set. Per ACS-100i-6 it means the AC registers an
  entry in a registry the build reads to decide what a consumer receives
  (agent_registry.json, skill_registry.json, paths.json, commit_guardian.json). This AC
  registers nothing; it changes where an existing artifact is written. Absent is
  therefore correct and the five-field structured it_requirements object is not owed.

  THE HARNESS IS THIS AC'S WORK, AND THAT IS THE MAIN SIZING FACT. The BA's reuse
  suggestion pointed at BP-900h-1, which turns out to be an unstarted spec: zero
  implementation anywhere in the workspace, no consumer-simulation job in ci.yml, and
  neither function from its own test_spec present. So the out-of-package install has to
  be built here, and it is the bulk of the estimate. It was deliberately NOT added to
  depends_on: doing so would park the entire BP-1500d family behind another epic for a
  fixture this AC must write regardless. The unmet edge is recorded in expects_from
  instead, and the harness is delivered onward to -2, -3, -4 and -5 so none of them
  stands up a second one.

  INTRA-FAMILY ORDERING IS WIRED AS CONTRACTS, NOT depends_on, as the BA asked. This
  AC is the producer for -2, -3, -4 and -5. It also carries an expects_from on -3,
  which looks inverted and is not: -3 is the enforcement floor, and without it a green
  build is not evidence that this AC's record exists. Neither edge was added to
  depends_on, so no ordering cycle is created between -1 and -3.

  BA AMENDMENT, 2026-08-25 -- THE Then CLAUSE WAS MADE CONCRETE, THE SCOPE WAS NOT
  CHANGED. The Then previously read "that project holds its own record of what the
  build put there". It now names the artifact: "a record file is written into that
  project's own tree, so that project holds its own record of what the build put
  there". This is the same guarantee stated more precisely, and it was made for a
  mechanical reason worth recording. declares_side_effect is DERIVED from this AC's
  own Then clause rather than authored by opinion, because it non-overridably routes
  the one phase agent that runs the real surface end-to-end and inspects the resulting
