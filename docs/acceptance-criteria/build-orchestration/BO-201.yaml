id: BO-201
components:
  - build_orchestration
readiness: reviewed
priority: medium
title: "ac-fulfillment-gate phase gate — ok/blocker verdict with per-AC details"
component: build-orchestration
status: active
created_by: "tickets/99_done/TICKET-20260605-ACFulfillmentGate.md"
criteria: |
  Given a ticket with ac_traceability frontmatter referencing AC YAML files
    (e.g. l2: [BO-201, BO-202], ac_path: docs/acceptance-criteria/build_pipeline/)
  When the ac-fulfillment-gate agent runs at priority 11.7
    (after ac-validator at 11.5 and before commit at 12)
  Then it loads each referenced L2/L3 AC YAML file from the ac_path
  And it verifies work_status equals done for each AC
  And it verifies implemented_by contains at least one file path
    present in the branch diff intersected with the ticket's files_touched
  And it verifies covered_by is non-empty for L2 ACs
    (L3 ACs may have empty covered_by)
  And it returns status:ok if all referenced ACs pass verification

  Given a ticket with ac_traceability where a referenced AC has work_status: todo
    and no auto-fix is possible (no matching diff evidence)
  When the ac-fulfillment-gate agent completes verification
  Then it returns status:blocker with per-AC details listing each failing AC ID
    and the specific field that failed (work_status, implemented_by, or covered_by)

  Given a ticket without ac_traceability in its frontmatter
  When the ac-fulfillment-gate agent runs
  Then it signs off with status:ok (no ACs to verify)

  Given an ac_traceability block referencing L0 or L1 ACs
  When the ac-fulfillment-gate agent processes the list
  Then it skips L0/L1 ACs (composite — fulfillment derived from children)
    and only verifies L2/L3 ACs
level: L2
work_status: in_progress
origin_agent: BrainCandy
superseded_by: null
amended_by: []
implemented_by:
  - "templates/agents/ac-fulfillment-gate.md"
  - "templates/skills/building-epics/SKILL.md"
  - "config/agent_registry.json"
covered_by:
  - "tests/test_ac_fulfillment_gate.py"
  # Added by ACD-1900b-5-i, which requires BO-201 to gain its first EXECUTING
  # coverage. The entry above is a read_text() + regex suite over the gate
  # template that asserts only frontmatter fields -- it could never have
  # detected the producer/consumer shape divergence, which is how this AC sat
  # at work_status: done while the gate it specifies resolved zero ACs. The
  # test below carries a "# covers: BO-201" tag and asserts the list form still
  # yields a verified-AC count equal to the number the block named.
  - unit_tests/ac_driven_dev/test_acd_1900b_5_i.py::TestListFormRegression
test_spec:
  - name: test_ac_fulfillment_gate_registered_as_ticket_phase_agent
    target_dir: tests/
    framework: unittest
    type: unit
    description: "config/agent_registry.json parses to an ac-fulfillment-gate entry with is_ticket_phase true, tier phase, role quality, and ticket-supervisor in spawned_by — the data that makes the gate dispatchable at all."
  - name: test_ac_fulfillment_gate_priority_orders_between_ac_validator_and_commit
    target_dir: tests/
    framework: unittest
    type: unit
    description: "Reading all three priorities from the registry, ac-validator (11.5) < ac-fulfillment-gate (11.7) < commit (12), asserted as a relation between the looked-up values rather than as literals in prose."
  - name: test_rendered_phase_ordering_places_gate_between_ac_validator_and_commit
    target_dir: tests/
    framework: unittest
    type: integration
    description: "Calling build_agent_priority_table() from scripts/injection_builders.py — the function that actually renders the canonical phase ordering injected into the supervisor prompt — yields rows whose order puts ac-fulfillment-gate after ac-validator and before commit."
  - name: test_phase_agent_selection_table_lists_gate_with_default_not_needed
    target_dir: tests/
    framework: unittest
    type: integration
    description: "Calling build_registry_block() renders a selection-table row for ac-fulfillment-gate whose default status is not_needed, which is the mechanism by which a ticket with no ac_traceability never triggers the gate."
  - name: test_ac_fulfillment_gate_template_declares_tools_needed_to_verify_and_fix
    target_dir: tests/
    framework: unittest
    type: unit
    description: "The template's YAML frontmatter parses to tools containing Read (load AC YAML), Bash (inspect the branch diff) and Edit (apply the auto-fix), plus signoff true — the declared capabilities the criteria's verification steps require."
test_rationale: |
  Scope boundary, stated explicitly so this contract is not mistaken for full
  coverage. This AC has two halves. The WIRING half — that the gate exists, is a
  ticket phase, and is ordered after ac-validator and before commit — is
  mechanically provable, and the descriptors above prove it by executing the
  real consumers (build_agent_priority_table / build_registry_block in
  scripts/injection_builders.py), which is what the supervisor prompt is
  actually rendered from. That is deliberately chosen over the SKILL.md
  substring/regex assertions currently in tests/test_ac_fulfillment_gate.py
  (TestBuildingEpicsSkillIncludesAcFulfillmentGate), which are grep-only and
  would pass against dead prose.
  The VERDICT half — loading each referenced AC, checking work_status /
  implemented_by-intersected-with-diff / covered_by, and returning ok vs
  blocker with per-AC details — is authored entirely as natural-language
  procedure in templates/agents/ac-fulfillment-gate.md. There is no importable
  module implementing it, so no unit test can execute it; only an end-to-end
  agent run could. That residual gap is NOT covered by this test_spec and
  should not be read as covered.

  Note (post-merge): origin/main independently added
  unit_tests/ac_driven_dev/test_acd_1900b_5_i.py::TestListFormRegression to
  covered_by as BO-201's first EXECUTING coverage, reaching the same conclusion
  about the grep-only suite from the other direction. That test narrows the
  VERDICT gap described above; it does not close it, because it exercises the
  list-form resolution path rather than the full ok/blocker verdict.
