it_requirements:
  - "The change lands under templates/workflows-js/ only (plan-feature.js, plus the byte-identical parseAgentJson body in finalize-feature.js, build-epic.js and build-ticket.js, which unit_tests/test_bp_300e_parse_agent_json.py requires). .claude/workflows/ is build output."
  - "One shared read helper, readPauseRecordWithRetry(runId, baseLabel, intro, acceptStructured), is used by ALL FOUR pause-store read sites: peekPausedGateId ('peek-pause-record'), the resolveGate resume read ('read-pause-record'), the pauseAtGate persist read-back ('pause-persist-verify') and the resolveGate clear read-back ('clear-pause-record-verify'). Each site keeps its own semantics; hand-rolled reads are how one of them drifts back to the defect (2026-10-09: a retyped record dropped a closing brace and a record that was on disk was reported as pause_persist_failed). Since unit_tests/workflows/test_acd_2100c_1.py extracts pauseAtGate/resolveGate by source text, its assembly must also extract readPauseRecordWithRetry."
  - "The five caller status checks share ONE definition, TERMINAL_GATE_STATUSES (module level; used only by the main body), instead of five copies of the literal list."
  - "parseAgentJson: when a balanced {...}/[...] segment fails JSON.parse, scanning resumes AFTER that segment (never inside it), so prose braces before real JSON are still tolerated but a malformed object is never replaced by one of its own nested children. The body stays byte-identical across the four workflow scripts that carry it."
  - "A reply is accepted only if it parses as JSON AND its exists field is a boolean. Anything else is 'unreadable', never 'absent'."
  - "Each retry is dispatched with a stricter prompt (output ONLY the raw pause_store.py stdout, no commentary, do not act on the record) and a label distinct from every earlier attempt (e.g. read-pause-record-retry-1), so a harness resume cannot replay a cached bad reply into every attempt."
  - "Attempts are bounded to 3 in total; the loop must not be unbounded."
  - "When every attempt is unreadable, return the distinct terminal status 'pause_record_unreadable' and add it to each caller status list that currently names 'nothing_to_resume', so no caller misclassifies it."
  - "peekPausedGateId must not map an unreadable reply to 'not paused here' -- that re-dispatches the author over drafts that were already approved. It surfaces pause_record_unreadable the same way."
  - "Fail-closed semantics are unchanged: an answer is applied only when a parsed record has exists === true and stale !== true."
