title: "Sign-off records what was produced alongside the status"
component: ticket-creation
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a phase agent signs off on a ticket with status "signed_off",
  When the sign-off is written to the ticket metadata,
  Then the sign-off entry contains:
    the agent identity that performed the work,
    the list of files created or modified,
    and a summary of test results (pass count, fail count) if tests were run,
  And a downstream agent reading the ticket can determine
    what artifacts exist without re-running the phase.
