it_requirements:
  config_schema_fragment:
    fast_lane_release_outcome:
      type: object
      description: >-
        The result of the release step, returned from each of the nine halting paths and
        read (never discarded) by the halt payload construction in BO-2400f-10-ii:
        {attempted: bool, released: [str], unreleased: [str], executor: str,
        error: str|null}.
        attempted is true only when an executor accepted the request and ran the command;
        a refusal, an unparseable reply, a null reply and a missing key are all
        attempted:false with the ids in unreleased. released holds the ids the store
        actually reports as returned to todo, taken from the command's own JSON stdout
        ({"released": [...]}), never inferred from the fact that the step ran. executor
        names the agentType or command actually used, so a persona mismatch is visible in
        the payload rather than only in a transcript. Fail closed: absent or unreadable
        means NOT released.
  reference_file_path: "templates/workflows-js/fast-lane-ship.js"
  n_location_rule: "9"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "ALL NINE SITES, IN ONE CHANGE. As of 2026-08-25 the release dispatches are at lines 506, 574, 596, 648, 668, 751, 773, 871 and 943 of templates/workflows-js/fast-lane-ship.js, labelled release-on-context-bundle-fail, -test-writer-fail, -red-baseline-fail, -coder-fail, -coverage-fail, -review-fail (twice), -changelog-fail and -commit-fail. Every one passes agentType 'status-checker' and opens its prompt 'You are the release-phase agent.' Fixing one is fixing none: the criterion's own words are that a lane with one released path and eight stranded ones is indistinguishable from a lane that releases."
    - "TWO SITES SHARE ONE LABEL, AND THAT MAKES THEM UNTESTABLE APART. Lines 751 and 773 are both labelled 'release-on-review-fail' (no-verdict, and high-findings). run_workflow_under_e2 keys its stubs on label, so those two paths cannot be stubbed or observed independently as things stand. Give every release site a unique label in this change — e.g. -review-no-verdict-fail and -review-high-findings-fail — otherwise 'all nine paths covered' can only ever be eight. This is a prerequisite for the test_spec below, not a nicety."
    - "THE ENGINE HAS NO COMMAND PRIMITIVE — VERIFIED 2026-08-25, AND IT CONSTRAINS THE PO'S FIX DIRECTION. Across templates/workflows-js/ the only awaited engine primitives are agent(), parallel() and prompt(); every other awaited identifier is a function defined in the same file. So 'the release is a single deterministic command, prefer invoking it directly' cannot be implemented at the JavaScript layer today without first adding a primitive to the engine, which is out of this record's scope. Two admissible shapes remain and the implementer must choose ONE and say which: (a) dispatch an executor whose declared charter in config/agent_registry.json already covers running a command that mutates AC work_status; or (b) obtain a direct-invocation primitive and use it. What is NOT admissible is keeping status-checker: it refuses role reassignment by design, and the same refusal already breaks /plan-feature's gates."
    - "IF SHAPE (a): NO SUCH AGENT EXISTS TODAY. All 60 entries in config/agent_registry.json were read on 2026-08-25 and none declares mutating AC claim state; status-checker is a read-only status reporter. So shape (a) entails ADDING an agent, which means an agent template under templates/agents/*.md, a registry entry, and a build deploy path. A .md agent template is llm-expert's surface, not python-coder's (the registry gives python-coder .py and .js only). This record is deliberately NOT split for that, because splitting it would require inventing criteria the BA did not write — but the single-coder phase IS under-scoped for shape (a) and the implementer must say so at sign-off rather than authoring an agent template silently. If shape (a) is chosen, expect a companion AC for the template."
    - "THE EXECUTOR'S CHARTER IS READ, NOT ASSERTED. Whatever is dispatched, the second scenario is satisfied only if the charter in config/agent_registry.json covers the action. Do not encode the expectation as a hardcoded agent name in the covering test: a hardcoded name becomes a test that passes because it was updated alongside the bug. Read the registry at test time and assert the dispatched agentType's own declared scope covers running a command that changes AC work_status."
    - "'THE STORE THE RUN CLAIMED IN' RESOLVES TO acStoreRoot, THE VARIABLE THE LANE ALREADY HOLDS. It is the same value already interpolated into the claim invocation (fast-lane-ship.js:396) and into releaseInvocation (:436-437), and it points at the run's own isolated worktree copy of the store. Use that one variable. Do NOT introduce a second store path, do NOT resolve it against the repository the run was launched from, and do NOT reach for origin/main."
    - "CARRY THE OPEN PRODUCT QUESTION; DO NOT SETTLE IT. BO-2400f-10's own text says the release is 'landed on mainline', while a run claims in its own workspace copy which is then discarded — which is the only reason the observed failure was harmless. Whether the release must reach mainline at all is a product question BrainCandy has explicitly not answered, and the BA worded this record against 'the store the run claimed in' so it stays true either way. This change must therefore neither implement a push to mainline nor add anything that makes the workspace-only reading permanent. If the implementation forces the question, stop and raise it rather than deciding it in code."
    - "LEAVE THE CLAIM DISPATCH DEMONSTRABLY ALONE. fast-lane-ship.js:393 opens 'You are the claim-phase agent for a fast-lane build.' with agentType 'status-checker' at :402 — the identical persona-mismatch shape. It COMPLIED on the observed run, which is why nobody has noticed, and its failure mode is the worse-shaped one: a silent NON-claim lets two runs build the same AC concurrently. The BA recorded it as a latent sibling belonging with BO-2400f-7 and deliberately did NOT fold it in. Do not expand scope to fix it here. Equally, do not HALF-change it: if a new executor is introduced for the release, the diff must either leave the claim dispatch untouched — verifiable as zero changed lines in that block — or the implementer must flag explicitly that it was touched and why. The hazard is a shared-executor refactor that swaps the release sites and leaves the claim on status-checker with nobody noticing the inconsistency."
    - "FAIL CLOSED ON THE RESULT, following BO-2400f-12's precedent and the review-verdict read at fast-lane-ship.js:737. A missing key, a null, an unparseable reply, or the observed refusal object {\"status\": \"refused\", \"reason\": \"out-of-scope-...\"} all take the not-released branch by a plain-falsy read. No default-true, no `|| true`, no treating 'the dispatch returned' as 'the release happened'."
    - "BEST-EFFORT ACTION IS PRESERVED; BEST-EFFORT REPORTING IS NOT. A failed release must not turn a clean halt into a crash and must not change the run's halting status or its failing_phase. What changes is that the outcome is now READ and carried — which is BO-2400f-10-ii, whose contract this record delivers."
    - "SOURCE VS GENERATED, VERIFIED 2026-08-25. templates/workflows-js/fast-lane-ship.js is source, copied to <output_root>/workflows/ by build_workflow_scripts (scripts/build_phases.py:723-734). scripts/build_orchestration/fast_lane.py is ALSO source — git-tracked, deployed as a whole directory by build_agent_support_scripts, with no templates/scripts/ counterpart — so the 'scripts/ is a build output' trap does not apply to it either. Note the AC's original doc_link named templates/scripts/fast_lane.py, which does not exist; the corrected path is in doc_links. Do NOT add a byte-parity assertion between any template and its deployed copy: unit_tests/build_orchestration/test_fastlane_template_deploy_parity.py deliberately asserts a difference."
    - "NO GREP TESTS, AND HERE IS THE SPECIFIC TRAP: 'a release dispatch exists on the failure path' IS GREEN TODAY. The dispatch exists on all nine paths, it runs, it returns, and it releases nothing. Any test of that shape — asserting a label appears, an agentType appears, a dispatch is recorded, a step is present, or that statements appear in a given order — must be rejected at review, because it passes unchanged on the exact code this record exists to replace. The load-bearing evidence is the STORE: a real on-disk acceptance-criteria store, records flipped to in_progress the way a claim does, a halting run driven, and the records read back off disk expecting todo. Assert on the parsed YAML on disk, never on what the command printed about itself."
delivers_to:
  agent: python-coder
  contract: "A fast_lane_release_outcome object returned from each of the nine halting paths — {attempted, released, unreleased, executor, error} — where released is taken from the release command's own {\"released\": [...]} stdout and never inferred. BO-2400f-10-ii consumes this to name the release's result in the halt payload beside the failure that triggered it; a discarded outcome makes that criterion unimplementable."
expects_from:
  ac_id: BO-2400f-7
  contract: "The ids THIS run flipped to in_progress — claimResult.claimed, already narrowed at fast-lane-ship.js:435 to exclude a concurrent run's claims, which land in excluded_claimed — together with acStoreRoot, the path to the store the claim was made in. Both are already computed in the lane; the release must use those exact values and not re-derive the set from the resolved batch."
test_required: true
test_spec:
  - name: test_release_returns_claimed_not_done_records_to_todo_on_disk
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    surface_invoked: "python3 scripts/build_orchestration/fast_lane.py release"
    description: "Build a real AC store in a temp dir, flip records to in_progress the way a claim does, run the release as a REAL SUBPROCESS, and read the YAML back off disk: every claimed-and-not-done record reads todo. Asserted on parsed on-disk YAML, never on the command's own stdout."
  - name: test_release_leaves_records_claimed_by_another_run_untouched
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Records in_progress but not in this run's claimed list are still in_progress after the release — the excluded_claimed guard at fast-lane-ship.js:432-435 must survive."
  - name: test_release_is_a_status_only_change_to_each_record
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Parse each touched YAML before and after: work_status is the only key whose value changed, and no other field, comment or ordering was rewritten."
  - name: test_every_one_of_the_nine_halting_paths_reaches_a_release_step
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Under the E2 harness, drive each halting path in turn — unusable bundle, test-writer non-ok, red-baseline blocked, coder non-ok, coverage blocked, review no-verdict, review high-findings, changelog failed, commit failed — and assert each records a release step. Parameterised over all nine; a test over one path proves one path, and the defect is that all nine are wrong together."
  - name: test_every_release_site_has_a_unique_label
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "Collect the labels of the release steps recorded across all nine driven paths: nine distinct labels. Today two review paths share 'release-on-review-fail', which makes them unstubbable apart and silently collapses nine-path coverage to eight."
  - name: test_each_release_step_carries_the_ids_this_run_actually_claimed
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "With the claim stubbed to return a claimed list narrower than the resolved set, every recorded release step targets the claimed list — not the resolved batch, and not the excluded ids."
  - name: test_each_release_step_targets_the_store_the_run_claimed_in
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "The --ac-root the release step carries is the same acStoreRoot value the claim step used. Guards against a second store path being introduced, and against the release silently reaching for a repository other than the run's own workspace."
  - name: test_release_executor_charter_covers_mutating_ac_claim_state
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Read config/agent_registry.json at test time, look up the agentType each recorded release step dispatches, and assert its declared charter covers running a command that changes AC work_status. Must not hardcode the expected name — a hardcoded name passes because it was updated alongside the bug."
  - name: test_status_checker_is_not_the_release_executor_on_any_path
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "No recorded release step across the nine paths dispatches status-checker, which refuses role reassignment by design. The concrete regression guard for KI-BO-020."
  - name: test_a_halting_run_leaves_no_record_in_progress_in_a_real_store
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: e2e
    angle: real_artifact
    description: "THE LOAD-BEARING TEST. Real on-disk store, real claim, a driven halt, real release invocation, then read every record back: none is in_progress. This is the only assertion that would have failed on run wf_bd4984e8-438, where the dispatch existed, ran, returned, and left all five records in_progress."
  - name: test_a_run_that_never_claimed_dispatches_no_release_step
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "On a path that halts before the claim, no release step is recorded — releasing on a run holding no claims would flip ACs another run legitimately holds (the BO-2400f-12 precedent)."
  - name: test_the_claim_dispatch_is_not_altered_by_this_change
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "A no-collateral-change guard, asserted on the RECORDED claim dispatch rather than on source text. The claim step at fast-lane-ship.js:393 has the same persona-mismatch shape and belongs to a different record; this pins it so a shared-executor refactor cannot half-change it unnoticed. If the claim is deliberately changed later, this test is updated deliberately too."
test_rationale: |
  NAME THE TRAP FIRST, because the obvious test for this criterion passes today on the
  broken code. A test asserting "a release step exists on the failure path" is green
  right now: the dispatch does exist on all nine paths, it runs, it returns, and it
  releases nothing. Any test of that shape must be rejected at review. So must any test
  that greps templates/workflows-js/fast-lane-ship.js for a label, an agent type, or an
  ordering — a grep passes unchanged on dead code, and this release path has been dead
  for its entire existence.

  The load-bearing evidence is the STORE. Build a real on-disk acceptance-criteria store
  in a temporary directory, flip a set of records to in_progress the way a claim does,
  run the release as a REAL SUBPROCESS the way the lane invokes it, and read the records
  back off disk: every claimed-and-not-done record reads todo, records that reached done
  are left alone, and records another run claimed are untouched. Assert on the parsed
  YAML on disk, never on what the command printed about itself.

  Cover every halting path, not one. Execute the lane under
  unit_tests/_workflow_engine_harness.py with run_workflow_under_e2 and drive each of the
  nine failure paths in turn — unusable bundle, test-writer non-ok, red-baseline blocked,
  coder non-ok, coverage blocked, review blocked on each of its two exits, changelog
  failed, commit failed — and assert each one reaches a release step whose recorded
  request is the release invocation for the ids this run actually claimed. A test
  parameterised over one path proves one path; the defect is that all nine are wrong
  together.

  The second scenario is about who is asked. Prove it by asserting the recorded release
  step names an executor whose declared charter covers running it, read from
  config/agent_registry.json rather than hardcoded in the test — a hardcoded expected name
  turns into a test that passes because it was updated alongside the bug.
