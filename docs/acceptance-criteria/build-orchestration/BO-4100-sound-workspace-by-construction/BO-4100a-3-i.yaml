notes: >-
  Scoped narrowly to the refusal path of BO-4100a-3: a refusal that has already written
  a directory or a branch turns one clean failure into a piece of debris someone must
  later decide about. This is NOT the recovery case in KI-BO-20260831-1331 (a workspace
  that is already half-created and invisible to the tool that lists them); this record
  owns the PREVENTION half -- a refused creation leaves no branch, directory or
  registration behind -- while BO-4100e ("A workspace the list cannot see is still
  accounted for, and still removable") owns the RECOVERY half for that same case. The
  two are complementary and neither should be folded into the other.
