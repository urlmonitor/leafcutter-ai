notes: |
  DECIDED: THE CLUSTERING METHOD (2026-10-04). It is decision
  dec-a070edfb6465bced, option opt.jev_pick_existing, approved by human:user.
  dec-93c1c730463c1f3c settles where groupings are stored; this decision
  settles how they are worked out. In order:
    1. Code groups exact label or criterion-id matches.
    2. For each remaining candidate, Jev answers one bounded choice over ALL
       existing categories (preferred plus alternative labels) plus 'none',
       while the library fits in one choice question. A merge is suggested only
       at p >= 0.8, the trial's 100% precision point.
    3. Candidates Jev leaves unassigned become one-member candidate categories,
       made by code and worded as the candidate.
  No LLM is involved, and grouping makes no broader-link suggestions. At cold
  start there are no categories, so every candidate becomes a one-member
  candidate. Within a decision run, each drafted question gets one Jev choice,
  inside the run's Jev budget. The decision record still calls this
  requirement 'AC DK-300b'; it was renumbered to DK-500b on 2026-10-05.

  SCOPE. Grouping applies in two places:
    1. to mined candidates (DK-500a), and
    2. to questions drafted new for a decision (DK-500e), which may belong to an
       existing category.
  Broader links are not suggested by grouping. A person sets them, and the
  checks on person-set broader values are in DK-500b-1-i. Merges and splits
  that a person makes are DK-500c. This L1 covers only the suggested grouping.
