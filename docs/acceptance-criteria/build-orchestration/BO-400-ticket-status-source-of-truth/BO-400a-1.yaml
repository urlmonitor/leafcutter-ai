id: BO-400a-1
title: "ticket-supervisor sets status to in_progress at drive start"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket file with frontmatter `status: todo`
    and an `agents:` map containing at least one entry with value `needed`,
  When ticket-supervisor begins driving this ticket
    (before spawning the first phase agent),
  Then it invokes set_ticket_status.py with --ticket <path> --status in_progress
  And the script updates the ticket's frontmatter to `status: in_progress`
  And the script stages the modified ticket file via git add
  And the status change is visible to any concurrent reader of the ticket file
    (e.g., ticket-prioritizer scanning the backlog).
