notes: |
  Two wrong versions this record exists to catch: (1) treating every sentinel as an
  unknown agent, which makes the build fail on the shipped [hook] list on day one;
  (2) crediting agents through a sentinel, which silently passes an agent that
  submission would actually reject.

  2026-10-21 amendment (BrainCandy decision): the original draft also specified an
  [all_agents] sentinel resolving to ticket-phase agents. The code shows it was never
  implemented: it appears only in a comment in feedback_categories.yaml, no category
  uses it, and validate_writer only checks literal membership. Rather than build an
  unused sentinel, the all_agents scenario is dropped and the misleading comment is
  removed, so the file documents only sentinels submission really honours.
