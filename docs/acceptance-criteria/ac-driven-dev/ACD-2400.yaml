  control flow assembled for the pt-mockdata-author dispatch -- proving the anchored
  value is consumed, not merely present as a string in the source.
notes: |
  DELIBERATELY STANDALONE, NOT NESTED UNDER ACD-2100. ACD-2100's own notes list
  KI-ACD-007 explicitly under "DELIBERATELY OUT OF SCOPE (named so the BA does not
  absorb them)" -- and its L1 children (ACD-2100a..e) are each independently
  documented as FULL at their 5-child L2 cap. This AC is therefore authored as its
  own root-level record (PREFIX-NNN, no parent per the ID hierarchy's L0/root shape)
  rather than forced into a tree that has explicitly excluded it and has no free
  slot regardless.

  RE-VERIFIED DEFECT (2026-09-23, this worktree, HEAD, before this fix): ptStoreDir
  was declared once as a bare relative literal at plan-feature.js:2693
  (`const ptStoreDir = "docs/product-truth";`) and never reassigned, while acStoreDir
  (the AC store's equivalent) is overridden from wtPayload.ac_store_path -- an
  absolute path inside the authoring worktree -- at :2513. The PT-authoring dispatch
  prompt (~:2762) had no equivalent anchor and no "do not write relative to the
  current checkout" warning, unlike the AC-authoring dispatch prompt (~:3096-3098).

  THE FIX MIRRORS THE AC-STORE TREATMENT, NOT A NEW MECHANISM: ptStoreDir is now
  reassigned via the existing resolvePathOntoRoot() helper (BO-3900) when
  authoringWorktreePath is set -- the same helper already used elsewhere in this
  file to anchor a possibly-relative path onto the worktree root without ever
  double-joining an already-absolute one. Two internal consumers,
  checkProductTruthStorePresent() and runFlowReconciliation(), previously did their
  OWN unconditional `root + ptStorePath` string concatenation assuming ptStorePath
  was always store-relative; both were updated to resolve through the same helper
  instead, so an already-anchored ptStoreDir is never joined onto the worktree root
  a second time. commitStageOutputProductTruth() needed no change: it already used
  ptStorePath directly as a git-add pathspec (fine whether absolute or relative,
  combined with `git -C <worktree>`), never prefixing it with a computed root.

  RED-BASELINE EVIDENCE: the covering test file was run against the unmodified
  source (`git stash` on templates/workflows-js/plan-feature.js only) before this
  fix landed -- 2 of 3 tests failed exactly as this AC's criteria predicts (the
  dispatch prompt named the bare relative literal and carried no anchor warning);
  the no-worktree negative-form test passed unchanged, confirming it was not
  accidentally asserting new behaviour on the fallback path.
