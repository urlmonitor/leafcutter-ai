roadmap_phase: phase_1
criteria: |
  Given a dispatch payload whose keys are all allowlisted but where a pointer value has
    been overloaded to smuggle a prose instruction or a failure premise (for example a
    files_touched entry that embeds a sentence, or a branch value carrying appended text),
  When preflight validates the payload before spawn,
  Then the payload is rejected because the pointer value does not match the expected shape
    for that pointer (a path, a branch name, or a path list),
  And the held-back reason names the malformed pointer,
  And no phase agent is spawned.
