id: BO-1500a-1
readiness: approved
priority: medium
title: "Self-hosting non-regression is proven by recorded command output, never by a bare assertion"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1500-self-protecting-build/BO-1500a.yaml"
criteria: |
  Given a ticket acceptance criterion requires self-hosting non-regression -- that a
    change to a guard, linter, or hook must not newly flag the project's own code when
    the changed rule is run over the real repository
  When the implementing agent marks that acceptance criterion as done
  Then the sign-off for that criterion includes the actual command that was run to apply
    the changed check over the real repository
  And the sign-off includes the actual output of that run showing zero new violations on
    the repository's own code
  And a sign-off that asserts only "self-hosting verified" (or equivalent) with no recorded
    command and no recorded output is rejected: the fulfillment gate treats the
    self-hosting criterion as NOT satisfied and blocks
  And when the recorded output of running the changed check over the real repository shows
    one or more new violations on the repository's own code, the self-hosting criterion
    cannot be marked done until the recorded output shows zero new violations
