notes: |
  WHAT "ROUGHLY WHERE" MEANS, TURNED INTO CLAUSES INSTEAD OF RESTATED AS PROSE. The
  L1's notes set the bar at the point where the author stops investigating and starts
  choosing. Two things follow, and they pull in opposite directions, which is why
  they belong in one record. Downward: everything needed to choose must be present
  at the moment of refusal, or the next step is still research. Upward: nothing may
  be claimed beyond a starting point, or the gate has begun producing a refactoring
  plan and has left this goal.

  THE FIRST ARM IS THE MOST LIKELY REGRESSION AND IT IS NOT A STYLE PREFERENCE. The
  natural shape of a good implementation is to compute a rich analysis, write it to a
  report, and have the refusal point there. That satisfies every clause of GE-127e-1
  and GE-127e-2 and returns the author to exactly the position this L1 exists to end:
  a verdict plus a research task. It is also the shape that quietly relocates the
  obligation into CR-100. Bind the acceptance to reading the refusal and nothing
  else.

  THE FOURTH ARM IS THE ONE MOST EASILY DROPPED, AND WITHOUT IT THE GATE ACQUIRES AN
  OPINION IT WAS NEVER GRANTED. If declining the named division carried any cost — a
  second finding, a note that the suggestion was not followed, a refusal that repeats
  because the file was divided differently — then the gate has stopped offering a
  starting point and started enforcing a design. That is a hard line becoming a
  design mandate, which is the opposite of the L0's concern and squarely INF-800's
  and the author's territory. It is also the arm that keeps this record from being
  satisfiable by a gate that tracks its own advice.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Three arms here assert
  an absence and every one of them is green on arrival against today's refusal, which
  contains nothing to relocate, nothing to overclaim and no advice to decline.
  Written so the IT PO can lift them verbatim into test descriptors.

  (1) "what is in that file and where it divides is already in front of them" —
      MUTATION: relocate the named parts and the division out of the refusal into a
      report written elsewhere during the run, leaving the refusal carrying a pointer
      to it. Under that injection, reading the refusal alone no longer shows what is
      in the file; this clause must go RED, and must return to green on revert. Note
      the property that makes this injection worth running: it leaves GE-127e-1 and
      GE-127e-2 fully satisfied, so it is invisible to every other record in this
      tree.

  (2) "the refusal asserts nothing about the division beyond that" — MUTATION: append
      to the refusal one sentence asserting that the named division preserves what the
      file does, or that nothing depending on the file is affected by it. Under that
      injection this clause must go RED, and must return to green on revert. Without
      the injection the clause is an absence and is satisfied by a refusal that says
      nothing about the division at all.

  (3) "the commit completes, and nothing about that file's length and nothing about
      the division that was declined is reported at all" — MUTATION: report a finding
      whenever a file is brought under its permitted length by a division other than
      the one that was named. Under that injection this clause must go RED, failing BY
      THE COMMIT OUTCOME as well as by the text, and must return to green on revert.
      Without the injection the clause is satisfied by a guard that reports nothing at
      any commit, which is today's implementation exactly.

  BOUNDARY WITH GE-127a-1's SILENCE ARM, WHICH THIS MUST NOT BREAK. That record
  already requires a file under its permitted length to produce no interruption. The
  fourth arm here is narrower and additional: the file was over, the author fixed it
  their own way, and the fact that they ignored the suggestion is itself not a
  finding. Do not merge the two — merged, an implementer satisfies the general
  silence and never notices that advice-adherence became a second axis.

  BOUNDARY WITH GE-127e-3. That record governs whether an offer is honest. This one
  governs whether it arrives in time and whether it overreaches. A refusal can name
  only real, runnable actions and still hand the author a research task; it can also
  be perfectly self-contained while asserting a safety it never established.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity,
  it_requirements, test_spec, test_rationale and declares_side_effect. All three
  mutations above are written to be turned directly into test descriptors.
