  post_write_commands:
    - "python scripts/build.py --target-dir ."
  notes: |
    Policy constraints:
    - The intermediate closure step (between the tests step and the PR-merge
      step) must be included in the single declared step sequence so it receives
      a monotonic position and does not perturb N for the other steps.
    - Pre-flight aborts occur BEFORE the first numbered step: no start-of-step
      line may be emitted for a step that never began. Numbered narration must
      start only once the numbered sequence starts; pre-flight failures use a
      distinct non-numbered message.
    - Reuse the same declared-sequence source of truth as BO-1000a-2 (do not
      introduce a second counter for the closure step).
    - No new config key. ADR-001 build.py round-trip parity.
