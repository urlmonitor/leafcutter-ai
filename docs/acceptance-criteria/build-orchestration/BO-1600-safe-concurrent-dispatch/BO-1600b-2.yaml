created_by: "docs/acceptance-criteria/build-orchestration/BO-1600-safe-concurrent-dispatch/BO-1600b.yaml"
criteria: |
  Given a supervisor is interrupted or fails while updating the shared worktree's
    index or while holding the git-write serialization guard
  When the interrupted supervisor has stopped
  Then the worktree's index is left in a consistent, readable state (a fresh
    status/read succeeds with no index-corruption error)
  And no stale index lock file remains that would block a later commit from
    acquiring the index
  And the git-write serialization guard the interrupted supervisor held is released
    rather than stranded, so a waiting supervisor is not blocked indefinitely
