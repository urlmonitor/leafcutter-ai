criteria: |
  Given the check_secrets guard is invoked by git in a freshly created
    epic/feature worktree (deployed layout) where build.py has deployed the
    hook scripts under .leafcutter/ and the scan_secrets module ships under the
    security-scanner skill, AND separately in the source/main checkout layout,
  When the guard resolves its scripts_dir and project root in order to import
    scan_secrets and run the secret scan over the staged files,
  Then the scripts_dir and project root resolve to the actual checkout
    locations (via `git rev-parse --show-toplevel` with a safe fallback),
    tracking where build.py actually deploys the hook scripts (.leafcutter)
    rather than a hardcoded .claude path,
  And scan_secrets imports successfully with no ModuleNotFoundError,
  And the secret scan runs to completion in both the fresh-worktree deployed
    layout and the source/main checkout layout,
  And the verification exercises a REAL fresh worktree created from origin/main,
    not a synthetic fixture that pre-populates the import path.
