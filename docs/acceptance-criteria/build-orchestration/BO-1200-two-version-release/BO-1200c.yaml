criteria: |
  A release process bundles completed features into a new stable version with AC lineage.

  When you decide to release, the process collects all features that have
  landed in dev since the last stable version, traces each one back to the
  ACs it fulfilled, and produces a new tagged stable release. The release
  notes write themselves from the AC lineage. You know exactly what is in
  each version and why it was built.
