it_requirements:
  - "GAP RESOLUTION (agent assignment): reassigned from workflow-architect to llm-expert. llm-expert is is_ticket_phase:true, its selection_criteria explicitly triggers on `files_touched contains templates/skills/*/SKILL.md`, and its skills_used already includes add-skill-to-package — the same promotion path workflow-architect would take. workflow-architect (is_ticket_phase:false) cannot be dispatched as a ticket phase."
  - "PREREQUISITE DELIVERABLE — the skill registry entry. Promote via the add-skill-to-package skill: create templates/skills/authoring-patterns/SKILL.md AND append {id: authoring-patterns, description, path: templates/skills/authoring-patterns/SKILL.md, internal: false} to config/skill_registry.json using Edit (never Write). A skill directory without a registry entry is not deployed to adopter projects by build.py."
  - "SINGLE SOURCE OF TRUTH — the recurrence threshold value is 3 (rule of three, user decision). Declare it exactly ONCE, in this SKILL.md, on a single canonical, machine-parsable line so the ACS-500g-3-i gate can read the authoritative value instead of hardcoding it. No other file in the repo may carry a numeric recurrence threshold."
  - "The frontmatter must satisfy docs/reference/skill-frontmatter.md: `name: authoring-patterns` matching the directory name, a single-line `description:` (the check-description-field hook rejects an empty or multi-line one), and an `allowed-tools:` line. Portability: no project-specific absolute paths in the body (ADR-013)."
  - "Each of the four rules must be written as a decidable test with a stated pass/fail condition and a named failure label the caller can echo back (e.g. rule-2-not-slot-expressible), so a do-not-promote decision can name the failing rule without prose interpretation."
  - "The parameterised-criteria authoring rule must produce records that satisfy BOTH live detection predicates at once: a non-empty `pattern_slots` list AND at least one matching {word} placeholder in `criteria` (see _has_parameterized_slots in templates/scripts/commit_guardian/check_ac_pattern_refs.py, whose predicate is an OR — emitting both makes the record recognisable to the inventory scan and the hook alike). Detailed in ACS-500g-2-i."
  - "The skill is shared by three readers — the pattern-steward (ACS-500g-1), the business-analyst §3a Pattern-First Check (ACS-500g-3), and the how-to guide (ACS-500g-2-ii). Write it reader-agnostic: no instruction that only makes sense inside one agent's run loop."
  - "Run `python scripts/build.py --validate-only` then `python scripts/build.py --target-dir . --force` after adding the skill, and confirm the skill appears in the deployed .leafcutter/skills/ (or .claude/skills/) layout — an unbuilt skill is invisible to every reader above."
