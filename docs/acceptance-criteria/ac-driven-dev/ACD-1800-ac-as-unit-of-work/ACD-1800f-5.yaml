roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement can declare an observable promise and carry the proof of
    it,
  When an author consults the reference documentation for the requirement
    record,
  Then the documentation describes the declaration, the kinds of observation it
    can request, and the parts of a proof -- what to act on, what to feed it,
    what must be observed, and what would be observed if the promise were
    unimplemented,
  And the documentation states that a declared promise with no proof is reported
    as unproven and never as passed, and explains why an empty set of proofs is
    the dangerous case,
  And the documentation states that proofs are run in isolation from one another
    and that a bundled check reports which requirement's proof failed,
  And an author who has read only this documentation can author a declaration
    and a proof that the observation craft executes, without reading any
    implementation.
depends_on: [ACD-1800f, ACD-1800f-1, ACD-1800f-2, ACD-1800f-3, ACD-1800f-4]
