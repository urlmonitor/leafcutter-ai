title: "A requirement reads as the behaviour to build, not the story of how it was written"
component: ac-driven-dev
level: L1
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Clean specs -- describe the outcome, not the authoring pipeline that produced it.

  An implementation requirement describes the behaviour to build and nothing about
  the process that authored it. It never embeds an upstream precondition about the
  planning pipeline; either the requirement is ready to build or it is not, and a
  builder reads only what to build.
