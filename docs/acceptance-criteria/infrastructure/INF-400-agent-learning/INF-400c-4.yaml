  contract: "A single declared knowledge-emission sink path, distinct from debugging/logs/agent_telemetry.jsonl, that the four shipped emit sites (signoff section 7 step 4 and the S9 blocks of the product-owner, business-analyst and it-po templates) resolve through instead of naming the telemetry sink"
