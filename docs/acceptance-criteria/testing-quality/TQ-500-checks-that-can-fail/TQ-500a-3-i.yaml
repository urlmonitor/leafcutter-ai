id: TQ-500a-3-i
components:
  - testing_quality
  - build_orchestration
title: "An unnamed alteration, an unstated revert, and a revert that did not restore are each named"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given four hand-off records for four pieces of work:
      record R, naming an alteration, the outcome of each test under it, a revert,
        and a post-revert re-run returning the pre-alteration outcomes,
      record S, naming an alteration and the per-test outcomes but stating nothing
        about a revert,
      record T, naming an alteration and a revert whose post-revert re-run did not
        return the pre-alteration outcomes,
      and record U, claiming the substitute evidence while naming no alteration,
  When the four records are read,
  Then record R is not reported, because it is a conforming substitute answer,
    And records S, T and U are each reported, and each report names which of the
      three it is — revert not stated, revert did not restore, or alteration not
      named,
    And each of these findings is established from the records the run actually
      produced: a run in which the writing side was asked for an alteration but
      emitted no record for that piece of work yields no finding for it, rather
      than a report of an unnamed alteration,
    And a piece of work whose answer is of the ordinary before-and-after kind, and
      one whose answer is a reasoned negative, are each left unreported by this
      reading, because neither claims an alteration.
