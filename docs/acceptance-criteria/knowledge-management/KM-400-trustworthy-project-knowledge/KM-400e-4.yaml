id: KM-400e-4
title: "Outages and empty searches remain distinguishable"
component: knowledge-management
components: [knowledge_management]
level: L2
status: active
req_status: active
readiness: approved
priority: medium
work_status: done
parent: KM-400e
criteria: |
  Given separate runs with a completed no-match search, database outage, missing generation, vector outage and tracing outage
  When each run invokes retrieval
  Then no-match is ok with empty evidence
  And database outage is unavailable after bounded retries
  And missing generation is stale or not-ready with available-revision metadata
  And vector outage reports its unsupported or unavailable mode or an explicitly allowed fallback
  And tracing outage preserves the retrieval result while recording telemetry loss
  And required-evidence failure follows the kernel's existing escalation policy
