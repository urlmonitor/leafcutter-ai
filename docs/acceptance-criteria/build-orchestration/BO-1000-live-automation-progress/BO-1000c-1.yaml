criteria: |
  Given the finalize-feature workflow is running in the background while the
    user remains in the main conversation,
  When the workflow emits a start-of-step or per-step-outcome progress line,
  Then that progress line is surfaced into the main conversation where the user
    already is,
  And the user does not have to open or watch the separate live-workflows view
    in order to receive the progress.
