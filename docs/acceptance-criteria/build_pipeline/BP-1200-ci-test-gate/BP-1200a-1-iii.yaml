roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/build_pipeline/BP-1200-ci-test-gate/BP-1200a-1.yaml"
criteria: |
  Given a brand-new checkout obtained by cloning into an empty directory (no
    leftover untracked working-tree files from prior local work are present)
  And the documented CI test command runs the build preparation step that the
    fresh-clone procedure prescribes
  When that build preparation step runs its deployable-script broken-reference
    preflight guard
  Then the preflight guard resolves the feedback deployable scripts from tracked
    source and does not abort the build for a missing or untracked feedback source
  And the build preparation step completes with a non-failing outcome on the fresh
    clone
  And the full suite then runs without any test erroring at collection because the
    build preparation step failed to produce the feedback scripts the suite needs
