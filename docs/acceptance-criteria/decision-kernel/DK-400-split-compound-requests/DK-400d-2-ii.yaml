id: DK-400d-2-ii
title: "A reworded part may carry words the request does not contain, such as a set-aside proposal's question"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the reusable-criteria split at the split gate, with the set-aside proposal "Decide when
    an LLM may generate further categories" shown read-only,
  When the person rewords p3 to "Decide how the reusable categories are clustered, and when an LLM
    may generate further categories" and approves,
  Then p3 is recorded as edited and runs with the person's words, although they are not a quote of
    the goal,
  And p3 keeps its proposed text and its original quote "we must make sure that we are able to
    cluster them somehow",
  And the set-aside proposal itself stays read-only and never runs.
