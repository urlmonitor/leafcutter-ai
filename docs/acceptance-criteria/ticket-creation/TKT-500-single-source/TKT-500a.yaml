title: "Agents read requirements at their source, not from copies"
component: ticket-creation
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  Requirements are read live from the approved AC — never from a duplicated body.

  When an agent begins work, it reads the criteria directly from the AC YAML
  file. No intermediate document duplicates or paraphrases the requirement.
  If the requirement is amended, every agent that reads it next sees the
  amendment immediately — no propagation delay, no sync step.
