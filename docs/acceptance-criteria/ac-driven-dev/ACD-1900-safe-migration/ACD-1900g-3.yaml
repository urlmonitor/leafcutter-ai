title: "Green sign-offs alone don't satisfy dogfood; a real-ticket spot-check is required"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_acbuild_2_cutover
criteria: |
  Given a dogfood run whose per-phase sign-offs are all green but with no recorded
    fresh-process spot-check against a real on-disk ticket,
  When the dogfood done-check is evaluated,
  Then it reports the dogfood as NOT done;
  And when a fresh-process spot-check against a real on-disk ticket is additionally
    recorded, the dogfood done-check passes -- proving green sign-offs alone do not
    satisfy the check.
