it_requirements:
  - "Author fresh unit tests in tests/test_selection_criteria_evaluator.py (new file). Source PR is closed — write from scratch and verify run-to-green before sign-off."
  - "Functions under test (scripts/selection_criteria_evaluator.py): evaluate(trigger_condition, ticket_context) and the LLMEvaluationRequired exception. A condition is a dict {type: 'dsl'|'llm', expression: str}; the 'candidate' is the ticket_context dict (keys: files_touched, title, description, components). Import by bare module name after adding scripts/ to sys.path."
  - "Assert a satisfied DSL expression returns True and an unsatisfied one returns False."
  - "Assert AND / OR composition yields the declared boolean outcome (AND binds tighter than OR)."
  - "API GAP: the DSL grammar supports only the AND/OR combinators and the operators contains/equals/matches — there is NO negation/NOT operator. The 'negation of individual criteria' sub-case cannot be authored run-to-green against the current evaluator; cover AND/OR and flag the negation gap to the BA/coder rather than asserting unsupported syntax."
  - "Assert evaluate raises LLMEvaluationRequired for a condition with type 'llm'."
