notes: |
  WHY THE MOVING FIGURE IS THE WHOLE POINT AND THE STATED FIGURE ALONE IS NOT. A requirement
  to state how many checks were examined is satisfied by printing a number, and a number
  written into the run is a legal answer that proves nothing — it stays correct-looking on a
  run that examined nothing. Requiring the figure to MOVE when the population moves is the
  only form of the requirement a literal cannot satisfy, and it is required in both
  directions: an implementation that adds newly-found checks to a base constant grows
  correctly and never shrinks.

  WHY THE EXAMINED-NONE CLAUSE IS THE MOST LIKELY WAY THIS SHIPS BROKEN. A run that put an
  input through nothing has an empty findings list, and an empty findings list is the
  greenest possible result. That is this regime committing, at the top level, exactly the
  defect it was built to detect — and it is the shape the neighbouring census already
  identifies as its own most likely failure. Reporting nothing wrong is not the same
  statement as finding nothing wrong, and the run must never make the first sound like the
  second.

  NO COUNT OF INSTANCES IS STATED IN THIS RECORD, DELIBERATELY, AND THAT IS WHY THE
  POPULATION FIGURES ARE ABSENT FROM THE GIVEN. Records authored the same day disagree about
  how many instances of this shape exist, and the parent records the figure as disputed and
  forbids one below it. Neighbouring records in this family state their measured populations
  in the Given as house style; that is deliberately not done here, because the population is
  precisely what this run measures and a criterion asserting it would be the thing it is
  meant to establish. Any figure encoded in an implementation of this record is a defect.

  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSE. "A run that put an input through no check
  does not report that no check was found wanting." ARRIVAL COLOUR: GREEN, vacuously — no
  run exists, so none currently misreports an empty examination. INJECTION: derive the run's
  verdict from the findings list alone, so an empty findings list reads as a clean result.
  Under that injection a run over a population naming no checks reports that nothing is
  wrong and hands back acceptance; this clause must go RED, and must return to green on
  revert. This is the one injection that must be executed rather than described, because the
  natural implementation is the defective one.

  SECOND NAMED MUTATION, FOR THE LEAVING-THE-POPULATION CLAUSE. "A check that leaves the
  population appears in none of the reported classes" is absence-asserting and GREEN on
  arrival, vacuously. INJECTION: carry findings forward from the previous run instead of
  rebuilding them from this run's observations. Under that injection a removed check keeps
  appearing and the stated figure does not fall; the clause must go RED. A finding that
  survives its subject is how a stale figure gets quoted as current.

  ARRIVAL COLOURS FOR THE REMAINING CLAUSES. The stated-figure clause, both movement clauses
  and the upper-bound clause are all RED on arrival — no figure is stated today because no
  run exists. The two absence-asserting clauses above are the only greens, and both are
  vacuous greens.

  DAY ONE. On the commit that lands this, the stated figure will be large and almost all of
  it will fall in the never-demonstrated class. That is the correct outcome and must not be
  reduced by narrowing the population — shrinking the denominator is how a figure improves
  without anything improving, which is why the leaving-the-population clause requires the
  fall to be visible in the stated figure rather than silent.
