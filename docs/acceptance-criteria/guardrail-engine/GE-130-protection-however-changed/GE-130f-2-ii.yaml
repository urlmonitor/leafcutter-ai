id: GE-130f-2-ii
title: The guide-read guard refuses the same edit in a linked working copy as in the main one, and a guard
  that refuses in only one layout is named with the layout it failed in
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a linked working copy of the project, in which the links to the gated folders stay inside
    that working copy rather than leading out of it,
  And the known-bad and acceptable inputs GE-130f-2 declares,
  When both inputs are put through the guard's entry point from inside the linked working copy
    and, in the same run, from inside the main working copy,
  Then in both layouts the known-bad edit is not carried out and the acceptable edit is,
  And the run reports the outcome for each layout and each gated folder side by side,
  And a gated folder for which the known-bad edit was carried out in one layout is named
    together with that layout, and the run fails.
