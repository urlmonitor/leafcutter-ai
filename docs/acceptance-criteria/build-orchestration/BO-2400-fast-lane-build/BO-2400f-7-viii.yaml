it_requirements:
  config_schema_fragment:
    claim_exit_status:
      type: integer
      enum: [0, 1, 2, 3]
      description: >-
        Exit statuses of `fast_lane.py claim`. 0 is success (a claim made, possibly with
        non-target members excluded). 3 is reserved for held (the target, and possibly other
        members, already read in_progress) and is used on no other outcome. 1 is every other
        failure (an unknown id, an unreadable store, a write that could not be made, an
        unexpected error caught at the entry point). 2 stays the argument parser's usage
        error. 3 collides with no status the command used before this record (0 and 1, plus
        the parser's 2).
    claim_held_outcome:
      type: object
      required: [claimed, excluded_claimed, target_refused]
      properties:
        claimed:
          type: array
          maxItems: 0
        excluded_claimed:
          type: array
          minItems: 1
          items:
            type: string
          description: Every member read as in_progress, the target included.
        target_refused:
          const: true
  reference_file_path: scripts/build_orchestration/_fl_lifecycle.py
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - >-
      The held status is one named constant, declared once and documented in the command's
      own help or module documentation, so a caller reads it rather than guessing. Exit 3 is
      returned on the held branch and on no other path, including the entry point's
      unexpected-error handler.
    - >-
      The held outcome keeps its field names and its place on standard output exactly as
      today ({claimed: [], excluded_claimed: [...], target_refused: true}). BO-2400f-7-x
      reads the payload observed on 2026-11-16 and an older deployed command that still exits
      1; changing the shape would break both readings.
    - >-
      The held list names the target itself as well as every other member read as in_progress.
      A held outcome that names zero members cannot be produced.
    - >-
      Any existing test that pins the refused claim to exit 1 exactly is updated to the
      reserved status in the same change; tests that require only a non-zero exit keep their
      assertion and gain one on the reserved value. The success path (BO-2400f-8-i, only
      non-target members in_progress) keeps exit 0 and its output unchanged.
    - >-
      A held refusal changes no record, as before: the store is read, never written, on that
      branch.
test_intent:
  - clause: it changes no acceptance criterion
    needs_test: true
    reason: A refused claim that still wrote a record would strand another run's members.
  - clause: it ends with a non-success exit status reserved for "held", which it ends with on no other outcome
    needs_test: true
    reason: The reserved status is the whole point of the record, and today the held branch shares exit 1 with every crash.
  - clause: "its standard output carries its outcome: nothing claimed, XY-100a-1 named as held, and the target marked refused"
    needs_test: true
    reason: The lane reads the held members from this payload, so a missing or moved field silently empties the held halt.
  - clause: it ends with the same "held" exit status and names every member as held
    needs_test: true
    reason: When every member is held the target must still be in the held list, which a filter that drops the target would miss.
  - clause: its exit status is non-success and is not the "held" status
    needs_test: true
    reason: An unknown id, an unreadable store and an unexpected error must not be mistaken for a held claim.
  - clause: it ends in success, claims the todo members and names the in_progress ones as excluded, unchanged from BO-2400f-8-i
    needs_test: true
    reason: The narrowing case must keep exit 0, and a held check that fires on any in_progress member would refuse it.
test_spec:
  - name: test_held_claim_changes_no_record_on_disk
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      Writes a fixture store in a temp directory with yaml.safe_dump (target XY-100a-1 at in_progress, XY-100a-2 at
      todo), snapshots every YAML file's bytes, runs python fast_lane.py claim as a subprocess, and compares every
      file's bytes afterwards. The wrong version it catches is a refusal branch that still writes a record.
    proves_clause: it changes no acceptance criterion
    code_file: scripts/build_orchestration/fast_lane.py
  - name: test_held_claim_exits_with_the_reserved_status_and_no_other_outcome_does
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Runs the claim subprocess for the held case and asserts the exit status equals the one named constant the
      module documents (3). Runs a successful claim, an unknown id, an unreadable store and an entry-point error
      and asserts none of them exits with that constant. The constant is read from the module, not retyped, and the
      existing assertion that pins a refused claim to exit 1 is moved to the reserved value.
    proves_clause: it ends with a non-success exit status reserved for "held", which it ends with on no other outcome
    code_file: scripts/build_orchestration/fast_lane.py
    must_catch:
      - the held branch still exits 1, the same status as a crash
      - the unexpected-error handler at the entry point also returns 3
      - every non-zero claim failure was renumbered to 3
  - name: test_held_claim_prints_its_outcome_on_standard_output_with_the_same_field_names
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      Parses standard output of the held subprocess run as JSON and asserts it equals claimed empty,
      excluded_claimed holding XY-100a-1, target_refused true, with exactly those keys and nothing on standard
      output besides that one object. The wrong version it catches is the payload moved to standard error or its
      field renamed, which would empty the lane's held halt.
    proves_clause: >-
      its standard output carries its outcome: nothing claimed, XY-100a-1 named as held, and the target marked refused
    code_file: scripts/build_orchestration/fast_lane.py
  - name: test_all_members_held_ends_held_and_names_every_member_including_the_target
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Fixture store where every member including the target reads in_progress. Asserts the reserved exit status and
      that excluded_claimed lists every member id with the target among them, and is non-empty.
    proves_clause: it ends with the same "held" exit status and names every member as held
    code_file: scripts/build_orchestration/fast_lane.py
    must_catch:
      - a filter that drops the target from the held list
      - a held outcome that names zero members
  - name: test_other_failures_exit_non_zero_and_are_not_the_held_status
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Three subprocess runs of the claim command, an id the store does not contain, an ac-root that cannot be read
      (a path that is a file), and an entry-point error. Each must exit non-zero and not with the held status, and
      an argparse usage error must still exit 2.
    proves_clause: its exit status is non-success and is not the "held" status
    code_file: scripts/build_orchestration/fast_lane.py
    must_catch:
      - an unknown id reported with the held status
      - the entry-point OSError handler returning the held status
  - name: test_only_non_target_in_progress_members_still_claim_and_exit_zero
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Fixture store where the target and one other member read todo and one non-target member reads in_progress.
      Runs the claim subprocess and asserts exit 0, target_refused false, the todo members claimed on disk (read back
      with yaml.safe_load) and the in_progress member named in excluded_claimed and left unchanged.
    proves_clause: it ends in success, claims the todo members and names the in_progress ones as excluded, unchanged from BO-2400f-8-i
    code_file: scripts/build_orchestration/fast_lane.py
    must_catch:
      - a held check that fires on any in_progress member and so refuses the narrowing case
  - name: test_claim_subcommand_is_reachable_through_the_real_cli_process
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: reachability
    description: >-
      Spawns python scripts/build_orchestration/fast_lane.py claim as a real process with real argv against a fixture
      store in the held state and asserts the process exit status and standard output, so the held status is shown
      to come out of the entry point the lane shells out to and not from a function called directly.
    proves_clause: it ends with a non-success exit status reserved for "held", which it ends with on no other outcome
    code_file: scripts/build_orchestration/fast_lane.py
