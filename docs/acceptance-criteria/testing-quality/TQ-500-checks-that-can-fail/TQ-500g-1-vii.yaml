it_requirements:
- Edit the ticket-level phase algorithm in templates/skills/building-epics/SKILL.md. Change templates/agents/ticket-supervisor.md
  only where it restates that algorithm. Make this one llm-expert change with TQ-500f-3-iv.
- 'Instruction: immediately before dispatching the commit phase, every time, including on resume, dispatch
  the preparer and then the shared runner CLI. Use the same inputs as the other routes: the ticket''s
  source_ac ids, the worktree as test root, the AC store root, the base ref and the manifest path. On
  gate_passed false, report the ticket as blocked with the runner''s JSON verbatim, and do not dispatch
  commit.'
- Call the gate CLI with the record option TQ-500g-1-viii adds, naming this ticket. The CLI ITSELF then
  writes its verdict to the ticket's record under the worktree's git directory. The supervisor never writes,
  edits, paraphrases or summarises that record, and never substitutes its own account of the verdict.
- 'K3 (no source_ac): still call the runner, with no ids, so it writes the not-applicable record the backstop
  requires.'
- Ship in ONE change together with TQ-500f-3-iv / TQ-500g-1-vii (the paired prompt) and TQ-500g-1-viii
  (the backstop). Without -1-viii the instruction names a record option that does not exist. Without the
  instruction, -1-viii blocks every /build-epic commit.
- 'The edit passes prompt-audit: no compound bash, and the spawn_allowlist covers any new dispatch.'
test_required: false
test_rationale: 'Prompt-only. Whether the supervisor follows a runbook instruction cannot be unit-tested
