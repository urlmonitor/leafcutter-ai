  - reason: "Reachability correction (2026-08-18): the criteria named ENTROPY_HIGH findings in .env files, which scan_file can never produce — it short-circuits env-filename paths to a single ENV_FILE finding and returns without scanning content. Both arms were therefore unreachable end-to-end, and the positive arm ('src/config/.env IS suppressed') was empirically false: the surviving ENV_FILE finding is not matched by an ENTROPY_HIGH allowlist entry. Swapped to the scannable filenames and rule_id that the two covering tests actually use. The path-matching behaviour under test is unchanged and was already implemented and green; only the illustrative fixtures were dead."
