    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: "In one copied layout, one TMPDIR and one declared sink: run the real script into a writer refusal, a malformed submission, a facility failure (PyYAML missing), and a destination failure; the fifth is the written-uncited marker built from the vocabulary form after a successful run's recovery file is removed. Each marker is built from that run's own line, parsed with the vocabulary pattern, and the five reasons are all different and together equal the vocabulary ids, using no artefact beyond the markers and the vocabulary."
