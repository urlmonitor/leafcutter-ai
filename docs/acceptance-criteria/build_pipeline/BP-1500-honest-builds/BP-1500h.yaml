notes: |
  USER DECISION 2 (BrainCandy, 2026-10-12), BINDING: an empty file location is
  "not configured", decided in ONE place that every reader uses. The source
  analysis found three readers with three behaviours today -- one joins the
  blank to the project folder and then fails reading it as a file, one skips
  silently, one already treats it as unset. The third is the precedent.

  PLACEMENT. This consumes BP-1500's SEVENTH and last L1 slot (7/7, no
  child_limit_override). f stays reserved, as recorded in BP-1500b,
  BP-1500b-3-i and build_pipeline/PROJECT_CONTEXT.md. Any further BP-1500 L1
  needs a waiver or a new L0 -- including the reserved f, which now can only
  be taken by a waiver or a split. FLAGGED for the user: if the reserved lift
  matters more than this fix, move this record instead (it is small enough to
  sit as an L2 elsewhere). The design names this a small one-off that could go
  straight to /build-ac; it was authored at L1 because the orchestrator asked
  for it in this tree.

  "SAID ONCE" IS DELIBERATE. The opposite of a silent skip is not a warning
  repeated by every reader; that would add exactly the noise AR-400 removes.
