roadmap_phase: phase_kernel_1_founding
criteria: |
  Given you answer reuse to the reuse question for the precedent dec-ef8ddcb79d668a67, which chose
    opt.added.1,
  When the decision resolves,
  Then it takes the precedent's choice opt.added.1,
  And it is approved by you, the current human (approved_by human:user), at the time of your
    answer,
  And a new record, for example dec-7cdc61ea41a206e0, is written to the run's staged decisions
    folder with assessment_basis precedent_reuse, dec-ef8ddcb79d668a67 under related, and the
    precedent noted with action reused,
  And the run changes nothing in dec-ef8ddcb79d668a67.
