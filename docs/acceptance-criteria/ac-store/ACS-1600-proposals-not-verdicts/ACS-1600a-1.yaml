    relevance: >-
      The parent guarantee this makes falsifiable. ACS-1600a states that
      retiring a requirement is on its own enough to put it beyond the reach
      of automation; this record is the first concrete population where that
      was not true. Read the parent for why the guarantee is phrased as
      "which records are in reach" rather than "read this field" — a
      criterion pinned to the fields today's implementation happens to
      consult would be falsified by the next refactor rather than by a
      behaviour change.
