id: DK-400a-3
title: "A single question routing can give to one capability is never split"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a run whose root goal is the single question "Which retention period should the
    kernel's Langfuse traces use?",
  And routing gives it to the decision capability,
  When routing runs on the run's root,
  Then no split is started and the run has no split record,
  And the person is asked no question about splitting,
  And the run goes on as one decision from the precedent step,
  And the run's report has no split section.
