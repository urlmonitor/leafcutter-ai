id: TQ-200c-1-i
components:
  - testing_quality
  - ac_store
title: "A proof word one side knows and the other does not is a failure, not a downgrade"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a proof statement whose kind is written in a word that the side producing
    the plan recognises but the side consuming the plan does not,
  When the plan is produced and handed to the consumer,
  Then the mismatch is reported as an error naming the word and both sides, and no
    plan is handed over,
  And the request is NOT quietly re-read as the nearest kind the consumer does
    understand,
  And in the symmetric case — a word the consumer recognises that the producer
    cannot emit — the same mismatch is reported rather than the request being
    treated as absent,
  And a proof statement carrying no kind at all is not an instance of this failure:
    it keeps the meaning it had before the vocabulary existed.
