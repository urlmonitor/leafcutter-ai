id: GE-130c-2-ii
title: Every change the check could not attribute is kept as a record and listed in the report the drive
  ends with, so a long unattended run does not lose it
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an unattended drive in which the after-the-fact check, on three separate commands, sees a
    protected file changed that it cannot attribute (GE-130c-2-i), each time a different file,
  And the drive continues past each of those statements,
  When each statement is made,
  Then a record is persisted for that finding, naming the file, the protection, the command
    whose check found it, the time, and why attribution failed,
  And the record can still be read after the session that made it has ended,
  And when the drive finishes, the report it ends with lists every such finding from that drive
    with its file, protection and reason, and states how many there were,
  And given the same drive with one more unattributed finding and nothing else changed, the stated
    count is one greater and the added file is listed,
  And a drive with no unattributed finding states in its report that it had none, rather than
    leaving the listing out,
  And a change positively attributed to a caller and stopped (GE-130c-2), and a check that could
    not examine the files (GE-130c-1-i), are not listed among the unattributed findings.
depends_on:
- GE-130c-2
- GE-130c-2-i
