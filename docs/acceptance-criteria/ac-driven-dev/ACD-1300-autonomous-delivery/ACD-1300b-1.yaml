it_requirements:
- Expose an installed CLI entry point with repository-root-explicit operation; require no developer checkout,
  hidden cwd-relative dependency, cloud orchestration service or Postgres for startup/local state.
- Keep executor/harness separate from provider/model/endpoint; retain native Claude-tier registry and
  E2 behavior unchanged for existing paths.
- Use Qwen3.5 9B through a local Ollama implementation endpoint and configurable Codex SDK or Claude Agent
  SDK review; reject incompatible model/executor combinations rather than translating them silently.
- Resolve credentials by reference at invocation time; never persist raw credentials in run checkpoints,
  status or logs.
- The first pilot may diagnose missing runtime/model prerequisites clearly; installation itself must remain
  disabled and must not start inference or review.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
test_spec:
- name: test_background_worker_fresh_install_is_disabled_and_reachable
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: reachability
  description: Invoke the installed CLI from a fresh consumer layout outside the developer checkout; assert
    disabled state, limit one and zero worker/agent starts.
  covers:
  - ACD-1300b-1
  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_enable_persists_validated_distinct_executor_models
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Enable with local implementation plus each SDK reviewer configuration in separate cases;
    restart status and assert selected executors, models and positive capacity persist.
  covers:
  - ACD-1300b-1
- name: test_background_worker_local_runtime_does_not_require_hosted_state_or_quotas
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Start/status with cloud orchestration endpoints unavailable and assert local settings/state
    operate; crossing hypothetical daily/token counts does not block admission.
  covers:
  - ACD-1300b-1
