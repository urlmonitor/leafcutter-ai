test_rationale: >-
  The fixtures make a real artifact genuinely unreadable — permissions removed for the
  cannot-read arm, content invalid in the artifact's own format for the
  cannot-understand arm — rather than injecting an exception into the reader in
  process, because the case this record exists for is a real artifact in a real state
  and an in-process injection leaves exactly that untested. Every clause here asserts
  an absence or a distinction, and an implementation that reports nothing at all
  satisfies all of them, which is why the record's named mutation is itself a test
  case rather than a note: if the mutation does not turn the first arm red the fixture
  is not actually making the artifact unreadable, and no result from that fixture
  means anything. The two arms are tested separately and on different artifacts by
  necessity — commit_guardian.json carries both the executing list and several
  advertising settings sections, so the first arm must be exercised on one of the other
  three places or it will trip the second.
