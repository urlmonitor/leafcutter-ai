title: "A sequence diagram shows one wrong-version run from alteration to put-back, including the ways it can fail"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a reader tracing what happens to the code during a wrong-version run,
  When they open the sequence diagram for the runs,
  Then it shows, in order: the copy of the code as written is taken, the wrong
      version is applied, the tests in scope run, the run is read, the code is
      put back and compared byte for byte, and the verdict is returned to the
      route,
    And it shows the branch where the wrong version does not load or changes
      nothing, and is not run or not counted,
    And it shows the branch where a database suite re-installs the correct
      code and the run is reported invalid,
    And it shows the branch where the run is cut short and the code is put
      back before anything else, or the drive stops naming the copy,
    And it shows the survivor branch stopping the work before commit.
