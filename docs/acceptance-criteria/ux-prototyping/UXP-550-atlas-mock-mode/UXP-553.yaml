estimated_complexity: S
it_requirements: |
  The mock-mode decision in leafcutter-web/lib/data/repo.ts (the UXP-550 seam) reads the
  server-side env var LEAFCUTTER_MOCK as the DEFAULT, then applies any runtime override
  (a cookie or ?mock query-param) which takes precedence over the default. Resolution
  order: production lock (UXP-553-1) > runtime override > LEAFCUTTER_MOCK env default.
  The NEXT_PUBLIC_ badge flag (UXP-552) reflects the resolved decision, it does not make
  it. The runtime override is what enables an in-app toggle; its safety boundary is the
  optional production lock covered by UXP-553-1.
