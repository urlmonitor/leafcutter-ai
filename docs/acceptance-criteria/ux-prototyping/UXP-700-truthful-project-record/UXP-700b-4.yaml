  - documentation_system
level: L2
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a person reading the reference for the record's checker,
  When they look up what an outcome means,
  Then the reference lists every outcome the checker can report, including the outcome for a
    run that examined nothing and the outcome for a run that was degraded by a bad input, and
    states for each what the reader may conclude and what they may not,
  And it states the rule that a sound verdict is reported only when every check that claims to
    have passed read at least one record,
  And it states, with the empty-record run as the worked example, how that rule differs from
    the project's fail-open convention for a check that hit an internal error,
  And it names the checks that are exempt from the rule, if any, and why - so a reader can tell
    an exemption from an omission.
