  - "Point at templates/skills/signoff/SKILL.md §2a for obtaining an id, and at that skill's definition of `feedback-id: (not-a-signoff)` (BO-2000g-2). Restate neither procedure. Quote the refusal's remedy only as GE-123e-3 ships it."
