notes: |
  AN EXPLICIT PER-CASE DISPOSITION DECISION, made here rather than inherited. GE-119a-2
  requires each case to choose between block and announce with no blanket default; this AC
  makes the choice for the set-up path and states the reason.

  The reason it is BLOCK here, while several checks may legitimately be ANNOUNCE: a check that
  announces leaves a human looking at the announcement, in a session where the work is
  happening. Set-up hands over an artifact that is then used for hours by someone who was not
  watching it run. An announcement at hand-over time is read once, if at all; the unprotected
  copy persists. The asymmetry is in who sees the message and when, not in severity.

  OBSERVED: setup_ticket_worktree.py create-ac-worktree warned that verify_precommit_active.py
  and install_pre_commit_shims.py were "not found ... graceful no-op" while creating the very
  working copy this tree was authored in. As the PO put it: a set-up step named "verify
  protection is active" that no-ops when it cannot find itself is the worst case of the whole
  goal — the one check whose job is to catch this failure is itself subject to it.
