it_requirements:
  - "The pass verdict must let the finalize-feature workflow continue to the PR-merge step (Step 4) unchanged — the parity step is additive and must not alter the existing pass-through behavior of any other finalize step."
  - "An all-identical mirrored-pair set yields ok=true (no pairs reported as differing); the gate must NOT emit a warning or noise on the clean path (silent success, consistent with the existing finalize steps)."
  - "A repository state with zero mirrored pairs discovered (no templates/scripts/<group>/ counterpart for any source group) is a vacuous pass, not a failure — the gate guarantees parity over the pairs that exist, and an empty pair set trivially satisfies that."
  - "Must complete in under 5 seconds on the clean path for the current mirrored-pair set."
