id: INF-500e-3
components:
  - infrastructure
  - ac_store
title: "A criterion keeps its identity and its age when it moves to another folder"
component: infrastructure
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the criterion BO-2400f-13 stored directly under its component directory, and
    the same criterion stored inside a feature folder beneath that directory,
  When each location is resolved to the criterion it holds,
  Then both resolve to the identifier BO-2400f-13,
  So that the criterion's identity is the identifier it carries and not the folder it
    happens to sit in.

  Given a criterion recorded as closed at the start of a period at one location, and
    recorded as closed at the end of the period inside a feature folder beneath that
    location, with no other change,
  When the period's criterion movement is computed,
  Then filed is 0, done is 0 and reopened is 0,
  So that reorganising the store does not read as one criterion appearing and another
    disappearing, and does not inflate either the filed count or the closed count the
    trust reading is built on.

  Given the component registry file that sits alongside the criteria in the store,
  When it is resolved to the criterion it holds,
  Then it resolves to nothing, because it is a registry rather than an acceptance
    criterion.

  Given a supporting document in the store that is not a criterion file,
  When it is resolved to the criterion it holds,
  Then it resolves to nothing,
  So that prose files in the store never enter the counts.

  Given a criterion first seen on 2026-08-20 that was unfinished at the start of a
    period and closed by its end on 2026-08-26,
  When the ages of the criteria closed in that period are collected,
  Then the single reported age is 6 days,
  And it is measured from the criterion's first appearance, not from the last time its
    file was written,
  So that a record that moved folders mid-life is not reported as having been closed
    the week it was created.

  Given a criterion that was already closed at the start of the period and is still
    closed at its end,
  When the ages of the criteria closed in that period are collected,
  Then no age is reported for it, because it was not closed during this period.
