test_required: true
test_spec:
  - name: test_the_boundary_diagram_is_named_and_levelled_by_the_collection
    target_dir: unit_tests/docs/
    framework: pytest
    type: unit
    angle: criterion
    description: "Exactly one file under docs/architecture/diagrams/ has diagram_type
      'sequence' and names BO-1800f-1.yaml in related_docs; its filename matches
      c3-NNN-slug.md, its flight_level is L3-Component, and no other file in the collection
      shares its c3-NNN pair. Fails a hand-chosen or colliding number without fixing which
      number is correct."
  - name: test_the_boundary_is_drawn_as_read_tip_then_replay_then_adjudicate_in_that_order
    target_dir: unit_tests/docs/
    framework: pytest
    type: unit
    angle: criterion
    description: "The three decision points appear in the mermaid body in that order. A
      diagram that adjudicates before replaying, or that omits a step, fails."
  - name: test_the_adjudication_compares_against_the_state_carried_from_the_read_step
    target_dir: unit_tests/docs/
    framework: pytest
    type: unit
    angle: seam
    description: "The operand the adjudication is shown comparing against is the value
      produced by the read step, and no cut-time base, merge-base or originally-copied-from
      state appears as that operand. This is the seam BO-1800f-2's it_requirements call the
      plausible wrong implementation."
  - name: test_the_diagram_has_exactly_three_end_points
    target_dir: unit_tests/docs/
    framework: pytest
    type: unit
    angle: criterion
    description: "The terminal outcomes count exactly three, and they are the three named
      dispositions. A happy-path-only drawing (one) and a success-plus-one-failure drawing
      (two) both fail; so does a fourth invented terminal."
  - name: test_no_branch_delivers_after_an_unreadable_shared_branch
    target_dir: unit_tests/docs/
    framework: pytest
    type: unit
    angle: failure
    description: "Walking the alt/else structure, no path that begins at the
      could-not-read-the-shared-branch branch reaches the delivery-leaves-the-copy terminal.
      Asserts the disposition of the unverifiable case, not merely that the case is drawn."
  - name: test_the_adjudication_is_drawn_per_path_not_as_one_verdict_over_the_delivery
    target_dir: unit_tests/docs/
    framework: pytest
    type: unit
    angle: criterion
    description: "The adjudication decision sits inside a per-path construct rather than as a
      single whole-delivery yes-or-no. A diagram drawn the collapsed way teaches the third row
      of BO-1800f-2-i's four-way table and fails here."
  - name: test_each_end_point_and_branch_names_the_criterion_that_specifies_it
    target_dir: unit_tests/docs/
    framework: pytest
    type: unit
    angle: criterion
    description: "All five labelled elements — three end points and two decision branches —
      carry an AC identifier drawn from BO-1800f-1, BO-1800f-1-i, BO-1800f-2, BO-1800f-2-i,
      and all four of those appear in related_docs. An unlabelled or partially labelled
      drawing fails."
  - name: test_every_criterion_the_diagram_names_still_exists_in_the_ac_store
    target_dir: unit_tests/docs/
    framework: pytest
    type: unit
    angle: real_artifact
    description: "Each AC identifier the diagram references resolves against the live AC
      store to a record that exists and is not superseded. A criterion withdrawn, renamed or
      superseded under BO-1800f turns this red by name. This descriptor is the substitute for
      the drift hook that does not cover this genre."
  - name: test_the_diagram_is_reachable_from_its_parent_component_doc
    target_dir: unit_tests/docs/
    framework: pytest
    type: unit
    angle: reachability
    surface_invoked: "docs/architecture/components/build-orchestration.md"
    description: "The diagram declares parent: docs/architecture/components/build-orchestration.md
      and that file's children: list contains the diagram's path, so the link resolves in both
      directions and a reader arriving at the component doc reaches the picture. A diagram
      present in the folder but unreachable from the component doc fails."
test_rationale: |
  This is a documentation record that is nonetheless mechanically checkable, and the test
  contract is what makes that true. Every descriptor reads the REAL artifact on disk — the
  committed Markdown file and, for the last two, the real AC store and the real component doc
  — never a fixture. There is no synthetic-fixture bias to guard against because there is no
  synthetic input: the artifact IS the input.

  The locator is the first design decision and it is load-bearing. The test finds the diagram
  as the unique sequence-genre file whose related_docs names BO-1800f-1.yaml, not by filename.
  The criteria deliberately refuse to fix the sequence number (the free number may move before
  the artifact is written), so any filename-keyed test would either hard-code a number the
  criteria decline to fix or go green-by-vacuity the day the file is renamed — the
  found-nothing-so-passed shape this whole tree exists to remove.

  The enumerations are not restatements of each other. Three distinct wrong diagrams are
  excluded by three distinct counts: the end-point count fails a happy-path-only drawing and a
  success-plus-single-undifferentiated-failure drawing; the branch-labelling check fails a
  drawing whose branches cannot be traced to the criteria they claim to depict; and the
  no-delivery-after-an-unreadable-read check fails a drawing that carries the wrong disposition
  for an unverifiable shared branch. An assertion about the file's existence, its frontmatter
  alone, or its line count satisfies none of the three — which is exactly the weaker shape the
  BA's falsifiability note names and rejects.

  test_the_adjudication_compares_against_the_state_carried_from_the_read_step is the one that
  is easy to mistake for a nicety. It is not. BO-1800f-2's enrichment records that the
  plausible wrong implementation is not 'no check' but 'a check against the wrong reference',
  and BO-1800f's own notes record the neighbouring live instance of that error in BO-900a-1's
  commits-ahead metric. A diagram that draws the adjudication against the cut-time base would
  teach an implementing agent to build precisely that defect, and every other descriptor here
  would stay green while it did.

  test_every_criterion_the_diagram_names_still_exists_in_the_ac_store carries the staleness
  duty on its own. check_mermaid_drift.py does not cover sequence diagrams, and
  check_doc_frontmatter's related_docs existence check fires only on commits that stage the
  diagram. This descriptor runs in CI on every commit and resolves each referenced identifier
  against the live store, so a criterion withdrawn or superseded elsewhere in the tree surfaces
  as a named mismatch rather than as a picture that merely still looks plausible. That is the
  whole of the mechanical staleness defence for this artifact, and it is why the record is not
  test_required: false.

  test_the_diagram_is_reachable_from_its_parent_component_doc is the reachability angle for a
  prose artifact: a diagram nobody can navigate to is the documentation equivalent of a gate
  that is defined and never invoked. check_mermaid_parent_link enforces the same property at
  commit time on the staged file, so the test is not the only defence — but the hook is
  bypassable by [NO-ARCH-UPDATE] in one token and the test is not.
