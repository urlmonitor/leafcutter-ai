superseded_by: null
covered_by: []
implemented_by: []
change_target: pipeline
risk_surface: internal
test_required: true
test_spec:
  - name: test_remediated_probe_lets_the_drive_dispatch
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "A temp install whose real declaration has a live enduring root and an absent log directory; the real location query (sink_resolution.py --print-location telemetry) prints the stream path. build-epic.js runs under the E2 harness over an epic with one ready ticket; asserts the terminal payload is not blocked and the ticket receives its phase dispatches."
    must_catch:
      - "latch a halt on the first-attempt failure even though the re-probe passed"
  - name: test_no_hard_block_message_after_successful_remediation
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Same run: no hard-block operator message and no sink_unreachable field; at most a WARNING-level log of the transient first miss."
  - name: test_exactly_one_probe_line_across_miss_remediation_and_reprobe
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "After the recovered run, the stream at the printed path exists and holds exactly one line, and no file was created at <worktree>/debugging/logs/agent_telemetry.jsonl."
    must_catch:
      - "the failed first attempt leaves a partial line that the re-probe then duplicates"
test_rationale: >-
  The recovered path is a sequence (fail, mkdir, retry, pass) whose only observable
  outcome that matters is that the real workflow dispatches, so every test drives
  build-epic.js's top-level body under the E2 harness over a real temp declaration
  whose target comes from the real location query. The one-line test pins the
  idempotency requirement across the whole sequence, and the latch must_catch is
  the wrong version this record exists to rule out: a gate that remembers the
  first failure and halts despite a passing re-probe.
