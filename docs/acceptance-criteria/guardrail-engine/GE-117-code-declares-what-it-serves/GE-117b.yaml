notes: |
  PO authoring note (for the BA). This L1 owns the PUBLIC FUNCTION/CLASS docstring
  declaration: the docstring must reference the AC the symbol satisfies, and that
  reference must resolve to a real AC id in the store (a valid, existing AC —
  not merely well-formatted text). Scope is diff-only and PUBLIC symbols only:
  new or changed public functions/classes; private/internal helpers and legacy
  symbols are out of scope (mirrors the tail-tag convention). This LAYERS ON TOP
  of GE-100's docstring-presence requirement — do not re-specify that a docstring
  must exist; specify that, given one exists on a public symbol in the diff, it
  must carry a valid AC reference. Enforcement action lives in GE-117d.
  Open question for BA/IT-PO: exact definition of "public" (naming convention vs
  __all__ vs export surface) — do not assume; decide at L2.
  documentation_triggers [how-to] — authors need guidance on where/how to cite
  the AC in a function/class docstring.
