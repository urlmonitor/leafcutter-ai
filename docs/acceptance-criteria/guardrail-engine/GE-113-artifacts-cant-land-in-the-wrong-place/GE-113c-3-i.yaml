notes: "Exploit Path A from the bug report: the current code compares fp_parts against a suffix of itself (not al_parts), causing the guard to always trigger True and fall through to a basename-only fallback. Any file sharing the basename of an allowlisted path-qualified entry is incorrectly suppressed regardless of directory. — .env-family filenames are deliberately excluded from this scenario space: scan_file matches them against _ENV_FILENAME_RE, appends a single ENV_FILE finding and returns before any content rule runs, so no ENTROPY_HIGH / GENERIC_SECRET finding can exist for such a path. Any future author illustrating this AC must use a scannable filename. The ENV_FILE short-circuit itself, including the fact that one allowlist line can collapse .env coverage to zero, is uncovered by this family and needs its own AC."
