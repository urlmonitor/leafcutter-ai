notes: |
  User decision D4, 2026-11-16: ship is prose (templates/skills/ship/SKILL.md), so its change
  is a separate llm-expert record under BO-4400g-4 rather than part of the python-coder work.
  BO-4400g is at its five-L2 cap; BO-4400g-4 had one L3 child (BO-4400g-4-i), so this is the
  second. Technical fields are left for the IT PO.

  Timing follows user decision D2: ship clears after the merge, by the same landed rule the
  landed-work pass uses for one workspace. Today ship's step 8 runs on both of its paths, so
  on the pull-request path it clears a workspace whose work is only pushed. Scenario 2 is the
  wrong version this catches.

  The fixture names "gamma" and "delta" are new on purpose: "beta" in BO-4400g-1 holds unsent
  work, and "feature/beta" in BO-4400g-4 is ship's merged case in the flow-wide proof.
