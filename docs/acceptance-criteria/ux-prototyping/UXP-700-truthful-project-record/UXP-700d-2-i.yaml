test_rationale: |
  UXP-700d-2 is provable against a synthetic fixture, and a synthetic fixture can be built to
  pass while the real store still dispatches plant-shop work. This record pins the assertion to
  the three specific criteria observed in the live store on 2026-09-07, so the fix is verified
  against the actual defect rather than a model of it. The ready-set-size clause is what stops
  the test passing because the scan returned nothing at all.
test_spec:
  - name: test_the_three_known_dispatchable_example_criteria_are_absent_from_the_ready_set
    target_dir: unit_tests/ac_store/
    description: "UXP-210d-4, UXP-210d-5 and UXP-210d-6 are returned by neither the ready nor the blocked scan of the live store."
    type: integration
    angle: real_artifact
    framework: unittest
  - name: test_ready_set_shrinks_by_exactly_the_number_of_example_criteria_removed
    target_dir: unit_tests/ac_store/
    description: "The ready-set size falls by the set-aside count, not to zero and not by more."
    type: integration
    angle: boundary
    framework: unittest
notes: |
  VERIFIED 2026-09-07: the store scanner surfaces UXP-210d-4 ("Order summary is shown before
  payment") and UXP-210d-5 ("Entering payment details creates a Payment record") as READY
  LEAVES, both assigned_agent frontend-coder, both in the ready set alongside 649 real items.
  UXP-210d-6 sits in the blocked set and becomes ready the moment UXP-210d-5 clears. All three
  are level L3, readiness approved, work_status todo. The concrete consequence today: an agent
  can be dispatched to build plant-shop checkout and payment handling inside leafcutter.

  The criteria deliberately describe the three by what they say rather than only by id, so the
  record survives an id change; the ids are pinned in doc_links and test_spec.
