it_requirements:
  - >-
    Edit the source templates only (templates/agents/test-designer.md and templates/agents/test-breaker.md),
    never the deployed copies (ADR-001). Builds that edit test-designer.md (ACD-2500c-1, ACD-2500d-1/-2/-3,
    TQ-500f-2-ii, this AC) must be serialised, as TQ-500f-2-ii requires.
  - >-
    The rule is stated as the one test "can a change to the code under test be this name?", never as a word
    or leading-phrase list: names that mention a fixture, an assertion or a test stay must_catch names when
    the code under test reasons about tests (the C5 control, TQ-500g-3-iii). The prompt must not introduce
    a keyword filter in any form.
  - >-
    A left-out test-defect name is replaced by the code-side wrong version it would let through, without
    adding a name already in the list (exact string after the alias rule's trim and case-fold), and the
    concern stays in that test_spec entry's description; the test designer never writes it to must_catch,
    in_scope_files or declared_replacements.
  - >-
    Backstop in test-breaker.md: a name that describes a defect in a test is answered could_not_prepare
    with a one-line reason that says it names a defect in a test rather than in the code (wording fixed in
    the template, so a reader can tell it from "the code has no such behaviour"). The template's tools stay
    read-only and its reply shape (TQ-500g-1-iv) is unchanged.
  - >-
    The edit passes prompt-audit, keeps each agent's frontmatter valid for registry_validator, and adds no
    new section headings to test-breaker.md's reply contract.
