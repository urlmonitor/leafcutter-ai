notes: |
  USER DECISION Q1 (2026-09-17): both. The before-check refuses only when certain; this record is
  where everything else is enforced. It cannot undo a change -- stopping the run is the
  enforcement (GE-130c notes; stated to the reader by GE-130c-1-ii).

  Concrete inputs: python tools/rewrite.py (writes a watched code file);
  python -c "open('<gated>/x.md','w').write('x')"; make docs.

  The pre-existing-change clause is the one an implementation comparing against the last commit
  instead of the state just before the command fails.

  2026-09-17 (business-analyst, user decision) -- ATTRIBUTION. For the documentation guard and the
  guide-read guard, the stop this record requires is made only when the change is positively
  attributed to this caller (GE-130c-2); a change the check looked at but could not attribute is
  named without a stop (GE-130c-2-i). The task-lock guard's rule named in the Given is unaffected:
  under the build lock it stops any writing command regardless of attribution, except the build
  workflow's own dispatched agents identified by caller identity (GE-130a-4).

  declares_side_effect: false -- the Then clauses name files and stop the run; nothing is
  asserted to be persisted.
