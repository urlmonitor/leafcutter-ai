it_requirements: |
  The mock-data-author agent does not exist yet and must be built. It consumes the classifier
  output (component + entities) plus any existing canonical dataset, and produces a *.mock.json
  conforming to mock-data.schema.json. It must enforce the add-vs-create rule from the store
  README (one canonical dataset per entity per component; extend, never duplicate). A hand-authored
  gold example of its required inputs/outputs lives at
  docs/product-truth/mock-data/pipeline-prompts/draft-mock-data.prompt.json.
