criteria: |
  Given the target AC has a contract with another agent's AC (a delivers_to or expects_from link),
  When the tool renders the task context,
  Then the cross-agent AC is shown as a pointer (its id and a link to its store record),
  And the other agent's full spec is NOT inlined into this agent's brief,
  And the brief remains scoped to the target agent's own requirement.
