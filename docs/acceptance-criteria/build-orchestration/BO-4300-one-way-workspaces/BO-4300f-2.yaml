notes: |
  Migration plan step 9. "Removed rather than left alongside" is the point: the tracked and
  deployed copies of today's script already differ on purpose and a test enforces the drift
  (F13). Script names and the one-release shim decision are IT PO's.

  SAME EPIC (IT PO, 2026-09-25, duplication audit): the ticket-path fix (BO-4300a-1-ii with its
  callers in BO-4300a-1-ib and BO-4300f-2-ia) and the stage-shim fix (BO-4300c-1-ii: ensure installs
  every declared stage's shim and proves each fires) land in the SAME epic as this removal. Removing
  the retiring set-up script before them would drop the only installer of the commit-msg and
  post-merge shims (KI-CG-20260914-post-merge-stage-registers-but-installs-no-shim) and leave
  ticket_path_final as the only ticket location callers have. The census tests above are why no
  fifth recipe can grow back after the cut-over.
