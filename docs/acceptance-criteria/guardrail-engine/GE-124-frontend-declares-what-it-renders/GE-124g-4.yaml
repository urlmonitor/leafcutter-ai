risk_surface: contract_boundary
notes: |
  PLACE 4 OF FOUR, and the one that guards GE-124f outcome 3 specifically. The
  PO's words: a test locating an element by its declaration still has to ASSERT
  something; "the element exists and carries the right marker" is not a test of
  the criterion.

  THE THIRD SCENARIO IS THE CIRCULAR ONE and is the reason this is not a single
  assertion. A test that asserts the marker is present is asserting that the
  declaration exists — it tests the guardrail, not the product. It would pass
  every structural check, agree with GE-124f-3's selector rule, and cover
  nothing. This repo has shipped that exact shape before, in tests that grepped
  for a string rather than executing behaviour.

  The second scenario is here so the rule cannot be discharged by rejecting
  every front-end test. An assertion about the criterion's observable behaviour
  is accepted, and the worked case is the mock-data record `decl-stock-badge`
  with its covering test.

  IT-PO NOTE (2026-08-25). This is the AC in the tree with the widest gap
  between what it promises and what a text scan can decide. The enumerated
  rejection shapes in it_requirements are an attempt to make it implementable;
  if the implementer finds the line cannot be drawn reliably without parsing
  JS, that is a genuine blocker to raise, not something to approximate — a
  mis-classification accepts an empty test or rejects a real one, and either is
  worse than the status quo.
