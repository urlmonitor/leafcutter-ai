criteria: |
  Unclaimed technologies are visible and fixable, not silently guessed at.

  Every kind of work leafcutter can be asked to do is claimed by exactly one
  specialist, and where nothing claims it, that gap is surfaced plainly instead
  of being resolved by whoever seems closest. Nobody has to infer ownership by
  copying what was done last time.
