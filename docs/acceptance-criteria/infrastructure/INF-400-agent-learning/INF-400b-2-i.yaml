declares_side_effect: true
it_requirements:
  - "THE DEFECT, STATED CONCRETELY. scripts/knowledge/harvest_learnings.py `_event_hash` builds its SHA-256 digest from the tuple (ticket, timestamp, destination, entry_kind) — verified at lines 129-135 on this branch. `ticket` is absent from all 28 knowledge_captured records in debugging/logs/agent_telemetry.jsonl (one key set across all 28: event, timestamp, agent, component, destination, entry_kind), so `event.get(\"ticket\", \"\")` yields a constant empty string and one of the four key components carries no information. The effective key is three fields wide, not four."
  - "THE KEY MUST BE BUILT ONLY FROM FIELDS THE RECONCILED SHAPE REQUIRES OF EVERY PRODUCER. Under INF-400b-2-ii's recommended resolution that is (timestamp, agent, component, destination, entry_kind). `ticket` becomes optional and must NOT appear in the key under any spelling — including as a defaulted-to-empty lookup, which is exactly the present bug. If INF-400b-2-ii settles the shape differently, take the required set from that decision; do not re-derive it here and do not land ahead of it."
  - "THE COLLISION IS REACHABLE, NOT THEORETICAL, AND ONLY AFTER THE REPAIR. Verified 2026-08-26: 17 of the 28 records carry a day-resolution timestamp of the form 2026-06-16T00:00:00Z, and the 28 records happen to yield 28 distinct (timestamp, destination, entry_kind) triples — so no collision exists today and no test against the current corpus alone can demonstrate one. The defect becomes reachable the moment emissions resume at volume, which is precisely when INF-700b repairs the capture loop. This AC must therefore ship in the same release as INF-700b-1, not in a follow-up. A repaired loop running against an unrepaired digest silently drops the second learning of any same-day, same-destination, same-kind pair."
  - "PRESERVE IDEMPOTENCY WHILE FIXING IT — these pull in opposite directions and the naive repairs fail one or the other. Widening the key to include a value that changes between runs (a read timestamp, a line number, a file offset, a UUID minted at read time) makes every re-run reprocess everything. Narrowing it, or keying on the whole record including a mutable field, is equally wrong. The key must be a pure function of the record's own persisted content."
  - "AMENDED 2026-10-12 (BrainCandy, INF-400b-2-iii): THE LEARNING TEXT IS NOW PART OF IDENTITY. This replaces the original 'do not key on the learning body' requirement, which let distinct learnings emitted in the same second share a hash (16 distinct snapshot records, 3 hashes) and be lost while marked routed. `ticket` is still never part of identity. State written under the old identity is read by the rule in INF-400b-2-iii."
  - "AMENDED 2026-10-12 (it-po, option A): CHANGING THE KEY MUST NOT SILENTLY INVALIDATE PREVIOUSLY STORED DIGESTS, AND MUST NOT HONOUR AN AMBIGUOUS ONE. Persisted processed-state written before the text joined identity holds legacy digests (the five required fields alone). It must be read by exactly one rule, defined once and shared by every reader of the state: a record is processed iff its current digest is in state, OR its legacy digest is in state AND no other record currently in the sink shares that legacy digest. A legacy digest shared by two or more sink records confirms none of them, so each is dealt with once more — a duplicate, the accepted worst case; a legacy digest must never confirm a record on the strength of an identity it shares with a different learning — a loss, which is forbidden. Only current (text-bearing) digests are minted and written from now on; a legacy digest is read, never newly written. The single definition lives in scripts/knowledge/record_identity.py — `event_hash` (current: required fields plus text), `legacy_hash` (legacy: required fields only), `shared_legacy_hashes` and `is_processed` (the rule) — verified on this branch at df87fc507; harvest_learnings.py and completion_routing_state.py (`load_confirmed`) both load that module and must not carry a second copy of the key or the rule, so the harvester and the completion-routing path cannot disagree about what is processed. The rule and its rationale must stay documented in that module."
  - "SILENCE IS NOT A PASS. If a record is missing a field the key requires, the run must report it with the record's line number rather than substituting an empty string and hashing on. Defaulting an absent required field to \"\" is the mechanism that produced this defect in the first place; reproducing it for a different field would reproduce the defect."
  - "Must handle errors gracefully per the project error handling policy, and must not change the harvester's exit-code vocabulary — the malformed-line handling is KI-KM-011's territory and must not be conflated with this change."
test_spec:
  - name: test_two_same_day_same_destination_same_kind_records_are_both_processed
    target_dir: tests/knowledge/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "THE COLLISION TEST. Two records with an identical day-resolution timestamp, identical destination and identical entry_kind, differing only in the learning they carry, both pass the already-processed decision and are dealt with. Fails against the current (ticket, timestamp, destination, entry_kind) digest, which conflates them."
  - name: test_the_digest_changes_when_any_required_field_changes
    target_dir: tests/knowledge/
    framework: unittest
    type: unit
    angle: seam
    description: "For each field in the required set, a record differing only in that field yields a different digest. This is the test that would have caught the original defect: a key component that contributes nothing cannot pass it."
  - name: test_the_digest_ignores_fields_absent_from_the_required_shape
    target_dir: tests/knowledge/
    framework: unittest
    type: unit
    angle: seam
    description: "Two records identical in every required field and in their learning text, differing only in `ticket` (present versus absent), yield the SAME digest — both when neither carries text and when both carry the same text — proving that optional field was not smuggled back into identity. Two records identical in every required field, one carrying a learning text and one not, yield DIFFERENT digests, because the learning text is part of identity. AMENDED 2026-10-12 (BrainCandy, BA amendment; supersedes the coder's wording on PR #1175): previously asserted that `text` present versus absent also left the digest unchanged; that half was retracted with the criteria and now asserts the opposite."
  - name: test_every_required_key_component_is_populated_across_the_real_corpus
    target_dir: tests/knowledge/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Over tests/fixtures/harvest_learnings/unroutable_corpus_28.json, none of the five required identity fields (timestamp, agent, component, destination, entry_kind) is empty or absent in any record, and the 28 records — none of which carries a learning text — yield 28 distinct digests. Asserts against the real corpus, not a fixture, because the defect is exactly a field that a hand-written fixture would have populated. AMENDED 2026-10-12 (BrainCandy, BA amendment): previously read 'no field the digest reads is empty or absent'; the digest now also reads the learning text, which all 28 records lack, so the population check is restated over the required fields and the textless records are shown still to receive distinct identities. The test's assertions are unchanged."
  - name: test_rerunning_over_an_unchanged_corpus_processes_nothing_twice
    target_dir: tests/knowledge/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Two consecutive runs over the same unchanged corpus deal with every record on the first and none on the second, proving the collision fix did not buy discrimination by sacrificing idempotency."
  - name: test_a_record_missing_a_required_key_field_is_reported_not_silently_hashed
    target_dir: tests/knowledge/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A record lacking a field the digest requires is reported with its line number and is not folded into an empty-string default, closing the substitution path that created this defect."
test_rationale: |
  The first descriptor is the one the known-issue names as mandatory, and it
  is the only descriptor that is red today. Everything else could pass against
  the current implementation.

  The second and third descriptors are the pair that make the fix meaningful
  rather than incidental. The second is the general form of the defect — a key
  component that never varies — and would have failed on `ticket` from the day
  the digest was written. The third guards the over-correction: the tempting
  repair is to hash the whole record, which restores discrimination and then
  breaks idempotency the moment an optional field appears on a re-emitted
  record.

  The fourth uses the real 28-record corpus rather than constructed records
  for a specific reason. A hand-authored fixture reproduces the author's
  assumption that every documented field is present — the assumption that hid
  this defect for two months. Only the real corpus exhibits the always-absent
  field. Note that it cannot demonstrate a collision (all 28 triples are
  distinct, verified), which is why the collision must be constructed in the
  first descriptor and the corpus used only as the population check.

  A test that inspects the digest function's source for which fields it names
  is worthless here and is forbidden by this repository's gate-AC rule: it
  passes on a function whose fields are named correctly and combined wrongly,
  and it passes on dead code.
delivers_to: null
expects_from:
  ac_id: INF-400b-2-ii
  contract: "The reconciled record shape and, from it, the set of fields required of every producer — expected to be (timestamp, agent, component, destination, entry_kind), with `ticket` optional. This AC builds the idempotency digest from exactly that required set plus the record's learning text (`text`, owned by INF-700b-1), and from nothing else — in particular never from `ticket`. Every field of the required set is mandatory for the digest (an absent one is reported, never defaulted); `text` is NOT a required field — a record without it (every record written before text capture) still yields a digest, with the absent text as a distinct value, and is not reported as missing a required field. The legacy digest used only to read pre-amendment state is the required set alone. AMENDED 2026-10-12 (it-po): previously read 'from exactly that required set and from nothing else'."
origin_agent: BrainCandy
created: 2026-08-26
amended_by:
  - reason: "BA amendment, 2026-10-12, on BrainCandy's decision of the same day (option A) on the harvester identity collision. SUPERSEDES THE EARLIER CODER EDIT: PR #1175's python-coder had rewritten this AC's 'do not key on the learning body' requirement and one test_spec description and recorded a one-line amended_by entry here; BrainCandy asked for the change to be made properly by a BA, and this entry replaces that one. WHY: identity was a hash over (timestamp, agent, component, destination, entry_kind) and left out the learning text. In the committed knowledge snapshot reports/knowledge-snapshots/knowledge-emissions-2026-10-12.jsonl (PR #1152), 16 distinct learnings share 3 identities, so routing one record marked its same-second siblings processed and they were never routed — a loss, which INF-700a-5-iii (as amended in PR #1078) forbids: a duplicate is acceptable, a loss is not. The original 'do not key on the learning body' requirement is what made that collision possible once emissions resumed in volume. THE DECISION (option A): identity includes the learning text; when reading existing processed-state, a record counts as processed iff its new identity is in state, OR its old identity is in state AND no other record currently in the sink shares that old identity; colliding records are routed once more, so the worst case is a duplicate; only new identities are written from now on. WHAT CHANGED IN CRITERIA: the Given now states that records carry their learning text and that the two records may share every identity field down to the second; the Then names the identity fields including the text; new clauses state that dealing with one record never marks the other, that a field outside identity (`ticket`) still does not change identity, that a textless record (every record predating text capture) still receives an identity and is not reported as missing a required field, the legacy-state rule above, that old identities are read but never written, and the duplicate-versus-loss asymmetry in INF-700a-5-iii's wording. KEPT because still true: the same-day collision scenario, 'neither is discarded as a repeat of the other', 'no part of that decision rests on a field that is absent from every record the system has ever written' (`ticket`), and the re-run idempotency clause. TITLE unchanged (still accurate). TEST_SPEC: test_the_digest_ignores_fields_absent_from_the_required_shape rewritten — its `text` half now asserts a DIFFERENT digest — and test_every_required_key_component_is_populated_across_the_real_corpus restated over the five required fields (the digest now reads the text, which all 28 corpus records lack); both marked AMENDED 2026-10-12. Test names and the other four descriptors unchanged. WHAT IS NOT ACCEPTED: a learning lost while marked routed — any record treated as processed on the strength of an identity it shares with a different learning, including an old identity shared by more than one record currently in the sink. BOUNDARY WITH INF-400b-2-iii: this AC owns what a record's identity is and how legacy state is read against it; INF-400b-2-iii owns the real-snapshot collision, the one shared implementation used by both the harvester and the completion-routing path, and the executable tests of the legacy-state clauses. SCHEMA: declares_side_effect: true added, derived from the new Then clause that only text-bearing identities are written to the persisted processed-state (check-ac-schema requires it once criteria assert a durable effect). UNCHANGED: work_status (done), readiness (approved), implemented_by, covered_by, depends_on, expects_from, doc_links. FLAGGED TO THE IT PO, not edited because it_requirements are the IT PO's: the coder-authored line 'AMENDED 2026-10-12 ... THE LEARNING TEXT IS NOW PART OF IDENTITY' is consistent with these criteria and is left in place; the line 'CHANGING THE KEY INVALIDATES EVERY PREVIOUSLY STORED DIGEST ... records processed under the old digest are no longer recognised as processed' is now stale against the legacy-state rule, which honours an unshared old identity; and expects_from's contract ('builds the idempotency digest from exactly that required set and from nothing else') no longer states the text."
    by: BrainCandy
    at: 2026-10-12
  - reason: "IT PO follow-up, 2026-10-12, to the BA amendment above (option A), resolving the three IT PO fields the BA flagged. CRITERIA NOT TOUCHED. (1) it_requirements: the line 'CHANGING THE KEY INVALIDATES EVERY PREVIOUSLY STORED DIGEST ... records processed under the old digest are no longer recognised as processed' contradicted the legacy-state rule (an unshared old identity IS honoured) and is replaced by a requirement stating that rule, the duplicate-not-loss asymmetry, read-never-newly-written for legacy digests, and the single shared definition in scripts/knowledge/record_identity.py (`event_hash`, `legacy_hash`, `shared_legacy_hashes`, `is_processed`) loaded by both harvest_learnings.py and completion_routing_state.py `load_confirmed` — verified by reading the code at df87fc507. (2) expects_from.contract: 'from exactly that required set and from nothing else' now reads 'that required set plus the learning text', `ticket` still excluded, and states that a textless record still hashes and is not reported missing a required field. (3) covered_by: tests/knowledge/test_inf_400b_2_iii_identity_includes_text.py added, and `# covers: INF-400b-2-i` added (metadata only, assertions unchanged) to the three tests in it that exercise this AC's legacy-state and write-only-current-identities clauses: test_unambiguous_legacy_hash_is_honoured_and_not_rerouted, test_shared_legacy_hash_routes_each_colliding_record_again, test_second_run_routes_nothing_new_and_state_holds_new_identities. Those tests keep their INF-400b-2-iii tag; the completion-routing parity tests stay -iii only (the shared implementation is -iii's). Reason: the done-proof gate links an AC to tests by `# covers: <id>` tags only — covered_by file paths that are not AC ids are ignored for leaf ACs — so without the tags the new clauses would have had no proof reaching this AC."
    by: it-po
    at: 2026-10-12
