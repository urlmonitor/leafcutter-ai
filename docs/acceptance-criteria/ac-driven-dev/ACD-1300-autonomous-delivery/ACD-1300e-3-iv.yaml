req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given a planning run with no person attached reaches its business-analyst decision point and
    sends its pause-record write,
  And the write's reply says the write succeeded, but the read-back that follows finds no record
    for the run (for example because the record was written to a different pause store),
  When the run ends because the pause could not be confirmed,
  Then its report quotes the write's own reply -- the command's outcome and its output, up to
    2 KB -- and, separately, the read-back's result,
  And it says the write reported success but no record was found, and does not say that the
    store could not be written or that a step was declined,
  And it names the run id and the decision point, says the drafted criteria are on disk, not
    committed and unchanged, and says the run cannot be resumed until a pause is recorded,
  And when instead the write ran and failed, the report quotes the write's error output and says
    the store write failed,
  And when instead the write step was declined, the report quotes the decline and its stated
    reason, says the write was not run, and claims no read-back result for a read-back that was
    not sent,
  And when instead the write's reply is neither a result nor a decline, the report quotes that
    reply as received and says it could not be read as a result,
  And the write is not sent again to any other agent after its reply is reported,
  And the bug symptom (KI-BO-20261022: "the workflow knew what the write returned and threw it
    away, so the report cannot say which of three causes it was"; on 2026-10-25 the decline
    reply survived only in the run's journal) must not occur.
depends_on: [ACD-1300e-3]
