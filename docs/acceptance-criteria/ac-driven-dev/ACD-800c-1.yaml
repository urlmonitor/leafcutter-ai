notes: |
  RETIRED 2026-09-09 with the whole ACD-800 tree. Decision, mechanism and the
  live-code hazard are recorded once, in ACD-800's notes — read those.

  THIS RECORD'S OWN REASON. It is the sentence that states the phantom-done
  write as an acceptance test: "those 2 ACs have their work_status changed to
  done". Read as a spec it instructs an implementer to award a completion badge
  from a text-similarity score, and read as a test it would FAIL any
  implementation that correctly refused to. That inversion — a test that goes
  red when the tool behaves safely — is why this record could not simply be
  amended in place.

  BUILT, DESPITE THE FIELDS. Covered by a green test tagged
  `# covers: ACD-800c-1` in tests/ac_store/test_cross_reference_audit.py, which
  therefore currently asserts that the forbidden write happens.
