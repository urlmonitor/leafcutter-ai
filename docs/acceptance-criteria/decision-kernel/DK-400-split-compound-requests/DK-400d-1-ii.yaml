notes: |
  User approval at the final gate (2026-10-05), from the IT PO's recommended follow-up on
  DK-400d-1: presenting the split gate and relaying the answer is skill-template work
  (llm-expert), while DK-400d-1 keeps the kernel side independent of host wording. It is an L3
  under DK-400d-1, because DK-400d is at its 5-L2 cap.
  Both skills are transport only: they show what the envelope holds and relay what the person
  says, never deciding, merging or rewording on the person's behalf (ADR-053, ADR-060). The
  "split progress block" is the status view the kernel provides for a split (DK-400f-1).
