id: TQ-600a-13-v
components:
  - testing_quality
title: "A post-merge run that did not run to completion is reported as not run, never as green — and a run superseded by a newer one is no verdict at all"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given that the hold passes only on a green post-merge run (TQ-600a-13-vi) and the notice
    is closed only by one (TQ-600a-13-iii),
  And the failure class this repository has documented repeatedly — a check that examined
    nothing reporting the same result as a check that found nothing — which here takes the
    form of a run that broke before it tested anything being read as a run with no
    failures,
  And the coalescing of TQ-600a-13-ii, under which a waiting run that a newer merge
    displaces ends as cancelled without ever having started its tests,
  When a correctness-lane run ends in any of these ways: a setup step before the tests
    fails (for example installing dependencies or the build), test collection errors, the
    population collected is empty, the run is cancelled, the run exceeds its time limit,
    the run cannot start at all because its definition is invalid, or the run's test
    result cannot be read,
  Then the run is not green: its recorded conclusion is not success, the hold reads it as
    did-not-complete, and the notice lifecycle treats it like red — it raises the notice
    when none is open and updates the open one otherwise,
  And the notice, and the held pull request's comment and check output, state that the run
    did not complete, name the stage at which it stopped where that stage is known, and
    are worded differently from a test failure, so a reader can tell "the tests failed"
    from "the tests never ran",
  And no open notice is closed by such a run and no hold is lifted by it,
  And only a run that collected the whole correctness lane, executed it, and ended with
    every test passing — after the single fresh-machine retry of TQ-600a-13-ii — is green,
  And a run whose collected population is empty is never green, however its exit status
    reads,
  And a cancelled run for which a newer run of the same workflow on the main branch
    exists, in any state, is treated as carrying no verdict: the hold and the notice skip
    it and read the next older settled run, so a burst of merges never produces a
    did-not-complete hold or notice by itself, while a cancelled run with no newer run is
    did-not-complete,
  And each ending is demonstrated by producing it — a failing setup, a collection error,
    an empty selection, a cancellation, a superseded cancellation, a timeout, an
    unreadable result — and observing the verdict, the hold and the notice write, never by
    inspecting the workflow's failure handling.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-ii
  - TQ-600a-13-iii
