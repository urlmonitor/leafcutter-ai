notes: |
  FOUR THINGS SATISFY "THE UNTOUCHED FILE IS BYTE-IDENTICAL" ON ITS OWN: a crashed run,
  a disabled write path, a preview-default run nobody passed the flag to, and a run the
  test never invoked. Every one of them is excluded here by requiring, in the SAME
  invocation, that two other records demonstrably changed. Any future amendment that
  splits those clauses into separate scenarios reopens all four.

  THE PREVIEW CLAUSE IS THE OTHER HALF OF THE SAME TRAP, RUNNING THE OTHER WAY. A
  preview that reports less than the apply run turns "nothing changed" into "nothing was
  found", which is how an operator concludes the store is clean. Requiring the two
  reports to name the same findings is what makes the preview usable as a decision.

  IDEMPOTENCE IS ASSERTED ON THE FILES, NOT ON THE LIST. "No duplicate entry" is
  necessary but not sufficient: a second run that rewrites the file with the same
  entries in a different order or with different quoting has changed the store while
  adding no duplicate. The clause therefore requires that no file changes at all.

  ENTRY FORM IS DELIBERATELY UNDER-SPECIFIED HERE. Whether an entry carries a
  ::test_function suffix is a store convention the schema already allows both ways; this
  AC requires consistency with what the record already holds, not a new rule. Pinning
  one form would silently reformat every record that uses the other.
