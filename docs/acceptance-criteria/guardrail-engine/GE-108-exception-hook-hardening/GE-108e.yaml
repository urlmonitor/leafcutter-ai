estimated_complexity: S
it_requirements:
  - "CANONICAL SOURCE, ADR-001. Edit templates/hooks/check_exception_handling_hook.py. The .claude/hooks/ and .leafcutter/hooks/ copies are build.py outputs."
  - "MODULE FORM FIRST, EXECUTABLE AS FALLBACK, in that order — the project's own lint step uses the module form, so it is the one that agrees with the rest of the repo."
  - "A MISSING MODULE DOES NOT RAISE FileNotFoundError. `python -m ruff` with ruff absent exits non-zero and prints 'No module named ruff' to stderr; it does not raise. Detect that case explicitly and fall through to the bare executable. Do NOT treat a non-zero exit as module-absent on its own — a real E722 violation also exits non-zero, and conflating them would make every violation fall through to the second invocation."
  - "PRESERVE THE FileNotFoundError CONTRACT. When the fallback executable is also absent, subprocess raises FileNotFoundError and main()'s existing branch turns it into the install instruction on stderr. _run_ruff must keep letting that propagate; its docstring already documents it."
  - "SELF-CONTAINED. The hook must not import any leafcutter-internal module; it already says so in its header. sys is already imported."
  - "DO NOT CHANGE RUFF_SELECT, the exit codes, the message text, or any skip condition. This record changes how ruff is located and nothing else."
  - "TESTS MUST MANIPULATE THE ENVIRONMENT, NOT MOCK THE LOOKUP. Run the hook as a subprocess with PATH emptied so the console script is unresolvable while the module remains importable — the existing test module already empties PATH for its not-installed arm and that mechanism is the right one to reuse. A test that patches an internal helper proves nothing about what the hook does on the reporter's machine."
test_spec:
  - name: test_importable_ruff_with_no_console_script_is_found_and_reports_the_violation
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "PATH emptied so no ruff executable resolves, but the running interpreter can import ruff. A file with a bare except: is checked; asserts exit 2, E722 on stderr, and that the install instruction is absent. RED today — the hook reports ruff missing."
  - name: test_clean_file_still_passes_when_ruff_is_module_only
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Same environment, clean file: exit 0, both streams empty. RED today for the same reason — the current hook blocks even a clean file when the console script is missing."
  - name: test_truly_absent_ruff_still_reports_the_install_instruction
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Neither module nor executable available (PATH emptied and the module made unimportable for the child). Asserts exit 2 and the install instruction on stderr. GREEN ON ARRIVAL — the regression guard that keeps GE-108d's routing and the not-installed branch alive."
test_rationale: |
  The first two arms are red today and are the criterion. The third is green
  on arrival and is the fence: the cheapest wrong fix is to stop refusing when
  ruff cannot be found, which would make the first two arms pass by removing
  the not-installed branch altogether and silently disable the guard on
  machines that genuinely lack ruff.

  All three arms drive the hook as a subprocess with a real environment rather
  than patching the lookup helper, because the defect is entirely about what
  the process discovers in the environment it is actually given — a patched
  helper would have reported success on the reporter's machine too.
