  - name: test_retired_done_record_passes_staged_done_proof
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "A staged L2 record with status superseded_by, superseded_by [AR-400c-1] (present in a temp store), work_status done and no covers tag gets no refusal from check_done_proof.py in pre-commit mode, run as a subprocess."
    covers: [ACS-900d-4]
  - name: test_retired_done_record_passes_ci_changed_done_proof
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: seam
    description: "The same retired record passes the CI path (check_changed_done_acs and check_all_done_acs), which reads _build_ac_status_map, so the pre-commit and CI verdicts agree."
    covers: [ACS-900d-4]
  - name: test_retired_record_passes_every_forward_gate
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: reachability
    description: "Running check_done_proof.py and check_ac_schema.py on the staged retired record produces no covering-test, test-contract or unfinished-children refusal naming X-1."
    covers: [ACS-900d-4]
  - name: test_retired_record_work_status_unchanged_after_gates
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "After the gates run, the retired record's file is byte-identical to what was staged, and work_status still reads done."
    covers: [ACS-900d-4]
  - name: test_active_twin_still_refused_for_missing_covering_test
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: "A record identical except status active and superseded_by null is refused by check_done_proof.py with the existing missing-covers-tag reason."
    must_catch:
      - "done-proof is skipped for every record"
      - "done-proof is skipped for every record whose superseded_by field is merely present"
    covers: [ACS-900d-4]
  - name: test_deprecated_record_without_successor_still_refused
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: "A status deprecated record at work_status done with no covers tag is still refused by check_done_proof.py, because the exemption is for superseded records only."
    must_catch:
      - "the predicate treats any non-active status as retired"
    covers: [ACS-900d-4]
  - name: test_is_retired_accepts_both_status_spellings_and_successor_forms
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: boundary
    description: "The shared predicate returns True for status superseded_by and for status superseded, with superseded_by given as a string or as a list, when every successor exists. It returns False for status active or deprecated, and it ignores req_status."
    covers: [ACS-900d-4]
  - name: test_single_predicate_definition_drives_all_gates
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: seam
    description: "Patching the shared predicate to return False makes check_done_proof (both paths), the composite rollup and validate_test_contract all refuse the retired record, proving every one of them consults the single definition."
    covers: [ACS-900d-4]
test_rationale: "Test files: unit_tests/commit_guardian/test_acs_900d_4_retired_record_exemption.py (gate tests) and unit_tests/ac_store/test_acs_900d_4_is_retired_predicate.py (predicate unit test). These are gate ACs, so per CLAUDE.md the tests run the real hook entry points (check_done_proof.py and check_ac_schema.py as subprocesses against a temp git repo with the record staged) instead of grepping for predicate calls. The two discrimination tests catch the cheap wrong fix, skipping done-proof wholesale or for every non-active record. The seam test proves there is one predicate, not several copies that could drift apart."
