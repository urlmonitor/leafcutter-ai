criteria: |
  Given the serialized-concurrent-commit behavior described by BO-1600a and its
    behaviors BO-1600a-1, BO-1600a-2, and BO-1600a-3
  When a reader opens the component documentation for this feature
  Then a sequence diagram shows two ticket-supervisors driving in parallel, each
    reaching its commit phase, acquiring and releasing the shared git-write guard
    in turn, and writing to the one shared object store/index serially
  And the diagram makes visible that the second supervisor waits while the first
    holds the guard, then proceeds
  And the diagram distinguishes this shared-store protection concern from BO-100c
    (pre-dispatch file-conflict scheduling) and BO-200 (single-ticket atomic commit)
