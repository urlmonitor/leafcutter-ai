  notes:
    - "A malformed or unavailable mapping source (missing/invalid components.json, sibling module raising on load) must be caught: importing the generator must still succeed and must not raise."
    - "On a genuine load failure the generator must degrade to a logged fallback mapping (empty/minimal) and emit a WARNING naming the failed source; unresolved values then follow the TKT-500f-17 warn-and-surface path."
    - "The fallback must be reached only on a genuine load failure — a well-formed components.json must still load and be used normally (no regression of TKT-500f-18)."
    - "Error handling must follow the project policy: catch a specific exception type, log at WARNING or higher, no bare/blind except."
