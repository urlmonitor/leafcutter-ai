notes: |
  The counterweight to BO-2400f-13. Without it, the cheapest implementation that passes
  BO-2400f-13, BO-2400f-13-i, BO-2400f-13-ii and BO-2400f-13-iii is one that refuses
  every run, and the whole lane stops. Written as a criterion rather than trusted to
  reviewers, on the same reasoning BO-2400f-12-ii is written for the producibility gate.

  The second scenario is the Product Owner's honesty point and it is not decoration. The
  reason an operator must be able to see that the workspace is new is that BO-2400f-3's
  promise — the latest mainline — is invisible from the result. A green run in a carried-
  over workspace looks identical to a green run in a fresh one, and the difference is
  which mainline the result means anything against. Saying it out loud in the first
  phase's report is what makes the absence of a refusal trustworthy rather than merely
  quiet.

  IT enrichment CAVEAT, 2026-08-25 (it-po) — raised, not resolved, because resolving it
  would be rewriting the criterion. This record's first scenario and BO-2400f-3's
  latest-mainline promise are in tension on exactly one state, and that state is the
  common one.

  The residual state is: branch fast-lane/<slug> exists, no worktree is registered for
  it, the location is free. Every finished prior run leaves it behind. This record says
  such a run must NOT be refused. But _create_fastlane_worktree (:529) already handles it
  by the checkout-only form `git worktree add <path> <branch>`, which puts the workspace
  on the OLD BRANCH TIP — not on the latest origin/main. So the run proceeds, as this
  record requires, into a workspace that does not satisfy BO-2400f-3.

  The enrichment does not paper over this. `base_commit` is specified as read FROM the
  workspace (`git -C <worktree> rev-parse HEAD`), never from the commit-ish handed to
  git, and `base_matches_origin_main` is carried explicitly so the divergence is visible
  in the first phase's report rather than discovered from a green result later. That
  makes the criterion's second scenario do real work: it is the mechanism by which this
  tension becomes observable instead of silent.

  What the implementer must NOT do is resolve it unilaterally. Resetting or rebasing a
  reused residual branch onto origin/main would discard a prior attempt's commits, and
  refusing the residual state would contradict this record's first scenario. Whether the
  lane should re-cut, reuse-and-report, or something else is a product decision for
  BrainCandy. Until it is taken, report the fact.
