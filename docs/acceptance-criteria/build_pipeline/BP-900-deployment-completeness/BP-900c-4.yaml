created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900c.yaml"
criteria: |
  Given a package tree in which the deployable script
    scripts/knowledge/harvest_learnings.py has been deleted from the source tree,
  And that exact path is still named, individually, by a deploy declaration the
    build ships from (the knowledge-scripts deploy list),
  And that exact path is still referenced by the deployable template
    agents/knowledge-harvester.md,
  When the build is run against that tree and the broken-reference report is read,
  Then the entry for scripts/knowledge/harvest_learnings.py carries a remediation
    that names the deploy declaration already claiming that path and states the two
    resolutions that exist for it — restore the source at the declared path, or
    remove the path from the declaration,
  And that entry's remediation is NOT the add-a-deploy-phase remediation, because a
    deploy declaration for that exact path already exists and adding a second one
    resolves nothing,
  And in the SAME run and the SAME report, a broken reference to
    scripts/brandnewtool/run.py — a path no deploy declaration names and whose
    source directory does not exist — still carries the add-a-deploy-phase
    remediation, and a broken reference whose source directory and directory-shipping
    phase both already exist still carries the commit-the-source remediation of
    BP-900c-3, so three states are told apart entry by entry inside one report and
    the remediation is demonstrably a function of the entry's state rather than a
    constant,
  And the three entries are read from the report the build itself produced when
    invoked through its real entry point against that tree — a demonstration that
    calls the remediation selector directly does not satisfy this criterion, because
    the selector can be correct in isolation while the report the build emits is not
    the one it produced,
  Because on 2026-08-31 deleting scripts/knowledge/harvest_learnings.py produced the
    entry {missing_path: scripts/knowledge/harvest_learnings.py,
    referencing_template: agents/knowledge-harvester.md, suggested_action: "add a
    deploy phase in build_phases.py"} while a deploy declaration already named that
    exact path. The advice sends the author to declare something already declared,
    and neither resolution that would actually fix it is named anywhere in the
    report. BP-900c-3 and BP-900c-3-i branch on whether a source DIRECTORY and a
    phase that ships that directory exist; a path named INDIVIDUALLY by a deploy
    list is a third state neither branch recognises, so it falls through to the
    default and is diagnosed as a brand-new capability.
