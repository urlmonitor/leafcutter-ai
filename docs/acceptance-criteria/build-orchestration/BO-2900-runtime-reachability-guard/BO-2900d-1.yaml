assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    reachability_exemption:
      type: object
      description: "One entry in config/reachability_exemptions.yaml: { item: '<exact repo-relative module path or surface:capability id>', kind: 'unit'|'capability', reason: '<non-empty string>', recorded: '<YYYY-MM-DD>', recorded_by: '<who>' }. The file is a top-level list under the key `exemptions`. `item` is matched by exact string equality only — no globs, no prefixes, no regex."
  reference_file_path: "scripts/build_phases.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "WHERE AN EXEMPTION IS RECORDED (IT PO decision, see notes): a project-level registry file config/reachability_exemptions.yaml, NOT an in-source marker comment and NOT an AC field. Create the file with an empty `exemptions: []` list and a header comment pointing at the BO-2900d-5 reference."
    - "The registry MUST be added to the build deploy manifest in scripts/build_phases.py so the DEPLOYED hook reads the real file. An undeployed registry makes every exemption invisible at hook runtime — the guard would refuse work that is correctly exempted, which is how a guard gets switched off. Verify by running the deployed hook, not only the unit tests."
    - "MATCHING IS EXACT AND ITEM-SCOPED. Nothing else may confer a pass: not the module's name, not its extension, not its folder, not a sibling's exemption, not a naming convention. Implement matching as equality against the recorded `item` string; do not add glob or prefix support, because the third criteria scenario exists precisely to fail any convention-based shortcut."
    - "THE ACCEPTED EXEMPTION IS ANNOUNCED, NOT ABSORBED: a suppressed finding must still produce output naming the exemption, the item it covers and its reason. An exemption that produces no output is indistinguishable from a check that never ran."
    - "THE RELEASE MUST BE END TO END. The same registry is read by the BO-2900a-3 branch of verify_done_eligible, so an exempted unit's criterion actually becomes eligible to be marked done. Suppressing the guard's report while the done-proof gate keeps refusing leaves the author with no route through at all and is a failed implementation of this AC."
    - "The registry loader lives in the shared seam (scripts/commit_guardian/_reachability_inventory.py or a sibling module imported by both the hook and done_proof.py) so there is exactly one reader; a second parser will drift. Wrap the file read per the error-handling policy — a missing registry means zero exemptions, an unparseable registry is a fail-closed error naming the file."
delivers_to:
  agent: python-coder
  contract: "load_exemptions() -> list[{ item: str, kind: str, reason: str, recorded: str, recorded_by: str }] from config/reachability_exemptions.yaml, plus an is_exempt(item) exact-match predicate. Consumed by the BO-2900a-3 branch of verify_done_eligible, by the BO-2900b-1 forward check, and by BO-2900d-2's inventory listing."
expects_from:
  ac_id: BO-2900a-3
  contract: "The no-way-in refusal ({ eligible: false, refusal_cause: 'no_entry_point_reaches_code', unit: str }) that a recorded exemption releases — the exemption check is applied at that branch so the criterion genuinely becomes eligible."
test_spec:
  - name: test_unit_with_no_way_in_and_no_exemption_is_reported_and_refused
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Runs the real guard over a fixture tree with an empty exemption registry; asserts a non-zero exit and a finding naming the unit."
  - name: test_recorded_exemption_suppresses_the_finding_and_is_announced_in_the_output
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Adds an exemption for that exact item to config/reachability_exemptions.yaml in the fixture tree and re-runs; asserts a zero exit, no finding, and that the output names the exemption, the item and the reason."
  - name: test_exempted_units_criterion_becomes_eligible_to_be_marked_done
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "With the same exemption in place, runs the real verify_done_eligible over a criterion whose implementing code is that unit and asserts eligible True with no other change — the end-to-end release, not just a suppressed report."
  - name: test_sibling_matching_name_extension_and_folder_is_still_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A second unit sharing the exempted unit's name pattern, extension and folder, with no exemption of its own, is reported — any convention-based shortcut fails here."
test_rationale: "Three of the four assertions are about a whole-system effect: that a record in a config file changes the verdict of a gate in a different package, and that nothing ELSE changes it. A direct-import unit test of an is_exempt() predicate would prove string equality and would pass unchanged on an implementation where the registry is never loaded at hook runtime — which is the live failure mode in this repository, since a hook runs from the deployed layout and an undeployed config file silently reads as empty. The tests therefore run the real guard and the real verify_done_eligible over a fixture tree containing a real registry file, and assert the released-criterion case in the ac_store suite so the cross-package release is genuinely exercised."
