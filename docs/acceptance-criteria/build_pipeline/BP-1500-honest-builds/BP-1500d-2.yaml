title: "The record still reads after the project is moved, copied or opened somewhere else"
component: build-pipeline
level: L2
status: active
req_status: draft
readiness: draft
priority: high
roadmap_phase: phase_1
work_status: todo
criteria: |
  Given a project outside the producing package's own parent folder that received a
    real build and carries its own record of what the build put there,
  When the whole project is moved or copied to a different location, the producing
    package is left behind, and the record is read at the new location,
  Then the record reads there without being rebuilt,
  And each of its entries still resolves to the artifact it describes inside the
    project as it now sits, so what the record says is true of the copy in front of
    the reader rather than of the place the record happened to be written,
  And reading is demonstrated to FAIL, before it may be accepted as passing, on a
    deliberately non-portable record -- one whose entries are keyed to the location
    the record was written in -- which must be reported as unreadable at the new
    location, naming the record and the project, rather than being silently accepted
    or read as an empty record,
  And that same deliberately non-portable record still reads at its original location,
    and the good record reads at both locations, so the red is attributable to the
    record's form and not to a project that was already broken by the move,
  And every verdict is reached by relocating a real install and reading it where it now
    sits, never by reading the build's own source for the presence of a
    location-independent form.
