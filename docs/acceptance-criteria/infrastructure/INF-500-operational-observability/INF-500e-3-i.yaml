notes: |
  These two branches sit either side of the same trap. Defaulting an unknown
  first-appearance to the period start would report a fresh 0-day cycle for every
  record the history cannot account for, which is the flattering direction; and
  admitting a negative age would let one bad date quietly cancel out several
  honest ones in the median.

  Skipping is the right answer for the unknown case rather than reporting the
  criterion with a dash, because the cycle figure is an aggregate over a
  population: a criterion with no establishable age is not part of the
  population being measured, whereas INF-500e-2's dash applies to a single named
  figure that was asked for and could not be obtained.
