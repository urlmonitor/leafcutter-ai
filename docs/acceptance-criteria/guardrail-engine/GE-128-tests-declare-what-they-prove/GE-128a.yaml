notes: |
  THE KEYSTONE, AND THE ITEM THAT RESOLVES THE DEADLOCK. The standard cannot be
  turned on as a flat rule: on the measurement in the register, 5,566 test
  functions across 595 of 597 files carry no declaration, so a flat rule refuses
  essentially all test work on day one. The two obvious escapes — leave the gate
  advisory forever, or write the offending files onto a permanent exception list —
  both leave the project exactly where it is. The ratchet is the way out and is
  what makes the setting safe to make deliberate.

  THE BASELINE BEHAVIOUR THE BA MUST BE ABLE TO DERIVE, STATED PLAINLY SO IT CAN BE.
  The comparison is between one file as it stands after the change and the same
  file as it stood before it. The judgement is on the DIRECTION of that comparison.
  Three consequences, each of which should become a scenario rather than be left to
  inference:
    - A file whose undeclared count is HIGHER after the change is refused.
    - A file whose count is the same or LOWER is allowed, even though undeclared
      tests remain in it. This arm is not a concession, it is the mechanism.
      Without it the ratchet is a freeze, and a frozen file never gets improved
      because nobody can touch it.
    - Whether a file with no previous version has a count to compare against is
      NOT settled here. It is GE-128b's subject and must be consumed from there,
      not re-decided. A decomposition that treats "no previous version" as
      "previous count of zero" is making GE-128b's decision by accident.

  MANDATORY NEGATIVE ARM — WITHOUT IT THE CRITERION IS VACUOUS. Every positive
  scenario above is satisfied by an implementation that permits everything. The arm
  that distinguishes a working ratchet from a disabled one is a file with existing
  undeclared tests to which one further undeclared test is added, refused — paired,
  in the same run, with the same file edited in any other way, allowed. Either arm
  alone passes on a stuck answer. Prove it by mutation, not by grep.

  THE SHRINKING-BACKLOG CLAIM IS PART OF THE PROMISE, NOT A SIDE EFFECT. The value
  sold is that the undeclared population is monotonically non-increasing once this
  lands. An implementation permitting it to grow under any routine condition — a
  generated block, a large mechanical edit, a merge — breaks that promise even if
  every hand-written scenario passes. Whether any such condition warrants an
  exception is a decision to be taken explicitly and recorded, never defaulted into
  existence.

  THE CONFIGURATION KEY IS IN SCOPE ONLY AS A CONSEQUENCE, NOT AS A SUBJECT. Today
  the gate resolves to advisory because its key is ABSENT — nobody chose advisory.
  Once the ratchet exists the setting can be made deliberate, and a deliberate
  advisory is a legitimate answer. What must not survive is a mode nobody picked.
  Whether the gate is registered at all is BP-1600a-2's, not this record's; whether
  a check honestly reports its own strength is GE-126's. Neither may be restated
  here.

  PRECONDITION, NOT SCOPE. This gate has never run. Making it run is BP-1600a-2's
  day-one triage, carried on the L0 as a dependency. An L2 here that re-specifies
  the registration census duplicates an approved high-priority record.
