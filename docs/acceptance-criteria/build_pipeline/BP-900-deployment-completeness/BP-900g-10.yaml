id: BP-900g-10
components:
  - build_pipeline
title: "A deployed script that cannot load a dependency it needs stops instead of emitting degraded output"
component: build-pipeline
level: L2
status: active
req_status: active
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g.yaml"
criteria: |
  Given a deployed script whose output depends on data or behaviour it obtains by
    loading another module at runtime,
  And that module being absent, unreadable, or unloadable in the install where the
    script is running,
  When the script runs,
  Then it stops with a non-zero exit and an error naming the dependency it could not
    load and the output it therefore cannot produce,
  And it does NOT continue with a neutral default — an empty mapping, an empty list,
    a passthrough — because a neutral default is indistinguishable in the output from
    a correct result computed against a dependency that had nothing to say,
  And it does not downgrade the condition to a log line, because a warning emitted
    into a build or agent transcript that already carries hundreds of lines is
    observationally equivalent to silence,
  And no artifact is written on the failing path, so a partially-correct artifact is
    never left behind for a later step to consume as if it were complete,
  And the demonstration builds into a temporary target, removes the dependency from
    the deployed tree, invokes the deployed script's real entry point in a fresh
    subprocess against a real on-disk input, and asserts both the non-zero exit and
    the absence of the output artifact — asserting that the loader function returns
    an error when called directly does not satisfy this criterion, because the
    degradation happens in the caller that ignores it,
  Because at HEAD 339b0981c the sibling loader in
    scripts/ac_store/generate_ticket_from_ac.py (~line 328) catches OSError at ~line
    334, logs a WARNING and returns an empty mapping, so in a consumer install every
    generated ticket silently receives the wrong `components` list. The ticket is
    produced, it looks well-formed, and the field that is wrong is precisely the one
    the knowledge graph reads — the failure is durable, downstream, and invisible at
    the point it occurs.
depends_on:
