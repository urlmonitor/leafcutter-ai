notes: |
  OUTCOME 1 of the three the PO wants kept as distinct L2s. The product-truth
  store already resolves a design to its criteria; what is missing is the FIRST
  HOP, from the built page to the design it realises. This AC supplies exactly
  that hop and nothing else.

  The second scenario applies GE-124c's missing-versus-unresolvable distinction
  to the new namespace: a design name that resolves to nothing is a defect of
  the same kind as an unresolvable criterion id. The typo in the scenario is
  deliberate, because that is what the defect looks like in real life.

  This L1 must NOT re-specify the attribute itself — GE-124b owns it, and
  GE-124b should land first.

  IT-PO NOTE (2026-08-25). "Same kind of defect" must not become "same
  resolver". The whole tree pushes towards one shared resolver for AC ids;
  design names are a different namespace living in the product-truth store, and
  folding them in would give that resolver two questions to answer — the exact
  ambiguity GE-124c-2-i removes. Two resolvers, two codes, two remedies.
