notes: |
  "47 ORPHANS" IS TRUE AND ACTING ON IT DIRECTLY WOULD HAVE DAMAGED THE STORE.
  That sentence is the entire argument for this AC. Measured on this branch
  2026-09-08 by running the real scan and then classifying each parent's coverage
  list by whether its entries resolve to real records: 12 of the 47 sit under a
  parent with an empty coverage list (six of those are the deliberate KM-200
  records), 25 sit under a parent whose coverage list holds only entries that
  resolve to nothing, and 10 sit under a parent that already names other real
  children. Those three groups have different correct actions and the current
  report cannot tell them apart.

  A NOTE ON THE FOUR-POPULATION BREAKDOWN IN THE L0, WHICH THIS AC MUST NOT
  HARDCODE. The L0's populations are described as overlapping causes, not a
  partition, and re-measurement confirms they overlap heavily — BP-100b is
  simultaneously a retired record and a coverage-list collision, and its eleven
  children are the only overlap between the L0's two separate groups of 26. The
  classification this AC produces must therefore be derived from signals present
  on the records — the parked signal, the retired status, whether the parent's
  coverage entries resolve — and never from a checked-in list of record ids. A
  hardcoded list is correct on the day it is written and wrong thereafter.

  THE LAST Then IS DELIBERATELY A PROHIBITION. Requiring a breakdown does not stop
  a headline number appearing above it and being the only thing anyone quotes. The
  prohibition is on the aggregate standing alone, which is the form that prompted
  the unsafe repair described in ACS-1400c.

  MEASUREMENTS STAY IN NOTES, NEVER IN A CRITERION — inherited from the L0. Every
  figure here carries its date and branch; a criterion pinned to a number is
  falsified by the next commit that changes it.
