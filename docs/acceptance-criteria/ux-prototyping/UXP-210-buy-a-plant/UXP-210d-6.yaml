estimated_complexity: M
it_requirements: |
  Reads + writes Order and Payment. On capture, flips Order.status pending -> paid and
  Payment.status authorized -> captured, upholding the invariant that a paid Order has
  exactly one captured Payment. Renders the order-confirmation screen.
delivers_to: null
expects_from: {}
test_required: true
test_spec:
  - name: test_capture_sets_payment_status_to_captured
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    description: "When the processor captures an 'authorized' Payment for an in-stock item, the Payment status becomes 'captured'."
  - name: test_capture_sets_order_status_to_paid
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    description: "On successful capture, the associated Order status becomes 'paid'."
  - name: test_confirmation_screen_shows_order_number_and_captured_amount
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    description: "After capture, the confirmation screen is shown with the order number and the captured amount."
