id: UXP-700d-3-ii
title: "An example marker that disagrees with where the content lives is reported, naming both"
component: ux-prototyping
components:
  - ux_prototyping
  - ac_store
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given journeys, screens, datasets and acceptance criteria that may carry `example_product`,
  When the product-truth checker runs,
  Then an artifact whose `example_product` differs from the product root it lives under is
    reported, naming the declared value and the root,
  And an artifact under the example product's root that carries no `example_product` is
    reported as undeclared, naming the root,
  And an `example_product` naming the project's own product is reported wherever it appears,
  And an acceptance criterion is compared against the product roots of its
    implemented-by-step links only, and one with no such link is not reported for lacking a
    root,
  And every finding reaches the checker's existing error channel and outcome, not a new one,
  And which product an artifact belongs to is still decided by where it lives, never by its
    marker.
