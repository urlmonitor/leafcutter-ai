it_requirements:
  - "THE VERDICT MUST BE A RELATION BETWEEN TWO RECORDED OBSERVATIONS of the same project -- one taken before the installer runs and one after. It must not be an assertion about the after-state alone. An implementation that measures only the after-state and compares it to a constant passes on a project that was already broken, which is the one outcome this record exists to exclude."
  - "A PROJECT THAT DOES NOT REACH THE FIRST QUESTION BEFORE THE INSTALL MUST NOT PRODUCE A PASS. The Given is a precondition, so the correct verdict there is precondition-not-met, reported as such and distinguishable in the output from a pass. This is the mechanically checkable form of the requirement above -- it is the single case that separates a real before-and-after from an after-only check wearing its name."
  - "Reuse ACD-2100d-1's harness -- install into a temporary target project and observe how far a run started there gets -- rather than writing a second one. Two harnesses observing 'how far the run got' by different means will eventually disagree, and when they do one of these two records reports green on the condition the other reports red. The temporary target must be created and torn down by the harness so the check is repeatable and leaves nothing behind; it must never be run against a developer's own project."
  - "Both observations must be taken on the same project under the same starting directory conditions. The only variable is that the installer ran in between -- ACD-2100a's behaviours are directory-sensitive and varying two things at once makes a regression unattributable."
  - "The observation must be the run's own recorded stopping point, not its exit code. A run can exit zero having halted at a startup check, and which check stopped it is this record's entire subject."
  - "Both runs must complete their startup path with no network available, so a transport failure in one of the two measurements cannot be read as an install-induced regression."
  - "The finding must be produced by starting a run in the project after the install. An assertion over what the installer copied, a file manifest or a checksum is not evidence -- the same real-artifact rule ACD-2100d-1 is held to, for the same reason."
  - "STANDING GUARANTEE MEANS IT HAS TO KEEP RUNNING. Wire the check where a change to the startup path or to the installer will re-run it, and have its verdict read by whatever decides that change is deliverable. A script that proved the property once and is never invoked again satisfies the words and not the record -- the inert-gate shape this repo keeps rediscovering."
  - "Must satisfy the repository error-handling policy in any harness code that ships under scripts/ or unit_tests/."
  - "Any dependency the check needs at runtime must be in the build deploy manifest. A check that runs only from the source tree is not the check a consumer's install would run, and this record is about what happens to a consumer."
test_spec:
  - name: test_the_route_reaches_the_first_question_before_and_after_the_install
    target_dir: unit_tests/portability/
    framework: unittest
    type: e2e
    angle: criterion
    description: >-
      A temporary target project is measured first -- a run started there reaches the
      first question the route puts to the user -- the installer is then run against
      that same project and the measurement repeated. The assertion is over the PAIR of
      recorded observations; a test that inspects only the second one does not satisfy
      this descriptor.
  - name: test_a_project_already_broken_before_the_install_does_not_pass_the_guarantee
    target_dir: unit_tests/portability/
    framework: unittest
    type: e2e
    angle: boundary
    description: >-
      THE TEST THAT MAKES THE BEFORE-MEASUREMENT LOAD-BEARING. Seed a target project in
      which a run halts at a startup check BEFORE the installer runs, install, and assert
      the verdict is precondition-not-met and is distinguishable from a pass. Assert in
      the same test that an after-state-only assertion over this fixture would have
      reported a pass -- that contrast is the evidence the before-measurement is doing
      work rather than being computed and discarded.
  - name: test_a_startup_halt_the_project_did_not_have_before_the_install_is_reported
    target_dir: unit_tests/portability/
    framework: unittest
    type: e2e
    angle: failure
    description: >-
      THE LIVE HAZARD, RUN THE WRONG WAY ROUND. Install an artifact that carries a
      startup check the project's own copy did not carry, and assert the verdict is a
      regression that names the check that now stops the run. This is the currently-true
      case: the deployed workflow has no charter gate and the source does.
  - name: test_both_findings_come_from_runs_started_in_the_project_not_from_the_copy_list
    target_dir: unit_tests/portability/
    framework: unittest
    type: e2e
    angle: reachability
    surface_invoked: "the route invoked in the temporary target project the way a consumer invokes it, in a fresh process, once before the install and once after"
    description: >-
      Both measurements are taken by invoking the entry point a consumer uses, in a fresh
      process -- so an install whose copied files are impeccable and whose deployed route
      still cannot start fails this test.
test_rationale: >-
  The criteria state a before-and-after guarantee and the before half is the half that
  can be dropped without anything noticing: "the route still starts" is unfalsifiable on
  its own, because an install that keeps an already-broken project broken satisfies it.
  So the contract is written to make the before-measurement mechanically necessary rather
  than merely instructed. The criterion test asserts over the pair; the boundary test
  seeds a project that fails the Given and requires a precondition-not-met verdict, and
  additionally requires the test to show that an after-only assertion WOULD have passed
  the same fixture -- which is the only assertion an after-only implementation cannot
  fake. The failure test is the live hazard stated forwards: the deployed workflow
  currently carries no charter gate while the source does, so installing today ADDS a
  halt to a working project. The reachability test is separate because this record's last
  clause forbids the cheap proof -- inspecting what the installer copied -- and a copied-
  files assertion is indistinguishable from a real one unless something runs the artifact.
delivers_to: null
expects_from:
  - ac_id: ACD-2100d-1
    contract: "A repeatable harness that installs into a temporary target project and starts a run there in a fresh process, returning that run's own recorded stopping point -- reached-the-first-question, or the named startup check that halted it. This record calls that harness twice against one project and compares the two results; the observation vocabulary must therefore be stable enough to compare."
