it_requirements:
  - "The sequence diagram must depict finalize-feature as the driving participant and show the ordered messages: merge-origin/main step -> parity gate -> PR-merge step, with the parity gate placed strictly between the latter two (mirroring the test-regression gate position)."
  - "Show both branches at the parity gate as alt fragments: drift -> HALT + surface drift to user (PR-merge step not invoked); clean -> proceed to PR-merge step. The HALT branch must visually terminate before the PR-merge participant is reached."
  - "Annotate that drift detection happens pre-merge (before the branch lands on main), contrasting with the historical post-merge spot-check that found the KI-2 jscpd drift. Do not depict the byte-diff comparison internals — that mechanism is owned by BP-1000a and its component diagram (BP-1000a-4); this diagram is about gate timing and halt/continue flow."
