it_requirements:
  - "Add `required: [\"status\"]` inside the `if` clause of PHASE_RESULT_SCHEMA in templates/workflows-js/build-feature.js so the conditional applies only when `status` is present and equals 'handoff'. Do not touch the top-level `required: [\"status\"]` or the `then` branch."
  - "Apply the same change to the twin conditional in templates/workflows-js/build-ticket.js (around line 146). This second edit is in scope and approved as part of this fix."
  - "templates/workflows-js/build-feature.js is already over the .js size limit (see the BO-3900 ratchet skip). The change must not increase its line count — fold `required` into the existing `if` object's line(s) rather than adding a new line."
  - "Canonical sources are templates/workflows-js/*.js. The deployed copies under .claude/workflows/ and .leafcutter/workflows/ are regenerated by 'python scripts/build.py' and are never hand-edited (ADR-001)."
expects_from:
  ac_id: BO-3000a
  contract: "PHASE_RESULT_SCHEMA requires `handoff_target` whenever `status` is 'handoff'; this record narrows only when that conditional fires, never whether it fires for a real handoff."
