expects_from:
  ac_id: ACS-1300b-1
  contract: "The classified enumeration and its examined total. This check turns that classification into a verdict something acts on."
test_spec:
  - name: test_acs_1300b_3_a_fully_wired_repository_produces_no_report
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "Over a repository copy in which every delivery path either reaches the link-recording step or carries a stated exemption, the check reports nothing. Asserted first because a guard that fires on everything gets switched off."
  - name: test_acs_1300b_3_an_added_unwired_path_is_reported_while_wired_paths_are_not
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the check's real entry point (hook or CI gate), invoked as a subprocess against a mutated repository copy"
    description: "PAIRING INSIDE ONE RUN. Add one path that neither reaches the step nor carries an exemption, re-run the check, and assert in that single run BOTH that the new path is reported by name with the classification it lacks and what would resolve it, AND that the paths which do reach the step are not reported. Discrimination and detection together — either alone is satisfied by a check that fires on everything or on nothing."
  - name: test_acs_1300b_3_deleting_the_line_that_consumes_the_verdict_turns_the_reported_case_green
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    description: "THE WIRED-GATE MUTATION. Remove the single line in the gate that acts on the check's result, re-run the same unwired-path scenario, and assert the outcome flips to passing. A grep-only assertion that the call string is present passes on dead code and cannot distinguish a wired gate from a computed value nobody reads."
  - name: test_acs_1300b_3_a_path_that_lost_its_hand_off_is_reported_by_the_same_check
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: "REGRESSION, NOT ONLY ADDITION. Take a path currently classified as reaching, remove its hand-off, and assert the same check reports it. A guard keyed only on newly added paths misses the likelier event — a refactor dropping an existing hand-off."
  - name: test_acs_1300b_3_an_enumeration_that_could_not_read_the_repository_does_not_pass
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: failure
    description: "GE-120. Make the enumeration unable to read the repository and assert the check's outcome is distinguishable from the clean-repository outcome in the first test. An empty bypassing set produced by failure must not be reported as a clean result."
  - name: test_acs_1300b_3_the_check_runs_from_the_deployed_layout
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: deployed
    description: "CONDITIONAL ON THE HOOK MECHANISM — required if the check ships as a commit-guardian hook, omit if it ships as a pytest-only gate. Run `build.py` and then invoke the DEPLOYED check, asserting it executes without an import error and that it actually received the files it claims to have checked. Source-tree imports mask the missing-deploy-manifest gap that took `done_proof.py` down."
