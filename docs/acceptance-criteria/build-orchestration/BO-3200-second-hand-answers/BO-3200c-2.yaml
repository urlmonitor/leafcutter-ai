notes: |
  THE FIRST SCENARIO IS THE ONE THAT MATTERS and it is deliberately the harder case. Hardening
  the parser so that refusal-shaped replies are not misread — which is where KI-ACD-005's fix
  direction stops — leaves the door open: the defect is not that the reply was malformed, it is
  that a reply from the wrong source was accepted at all. A well-formed decision from a
  non-person must be rejected precisely because it is well-formed; any implementation that
  validates shape rather than provenance passes the second scenario and fails this one.

  The anchor case is worth reading in full for how convincing the wrong answer looked: the
  specialist replied that approving product-truth artifacts is not its job, named the correct
  fix in its own refusal, and that reply was parsed as an answer of cancel. The specialist was
  right and said so clearly; what failed was that a refusal and a decision were not
  distinguishable to the caller.

  ALREADY SHIPPED — NOT RE-SPECIFIED HERE. PR #565 stopped a refusal defaulting to discard. This
  AC is about provenance, which that change does not address: an approve-shaped reply from a
  non-person would still be honoured.

  The third scenario prevents the criterion being satisfied by a gate that accepts nothing.

  IT-PO ENRICHMENT NOTE (2026-08-26). risk_surface is `auth` because this criterion is literally
  an authentication requirement: the question is whether the party that answered was the party
  authorised to answer. That framing also settles the implementation question — provenance must
  come from the CHANNEL the answer arrived on, never from anything inside the reply. Any
  content-derived marker is forgeable by precisely the thing being excluded, since a dispatched
  agent asked to produce a decision will happily produce a well-formed one.
