title: "A sequence diagram shows the promise, the claim, the refusal, and where the boundary to the observer lies"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the promise-versus-claim path spans the planning side, the test-writing
      side, the hand-off check, and the separate judgement that watches tests run,
  When a reader consults the architecture documentation for how a promised kind of
    proof is answered,
  Then a sequence diagram shows, in order, the plan promising a kind of proof for a
    stated behaviour, the writer answering it with a test that claims that kind,
    the writer recording the way in it resolved and its answer to the seam rule,
    and the hand-off check comparing the promise against the claim,
    And it shows the refusal path, returning to the writer, when a promised kind
      has no claim,
    And it shows the observer that watches tests run as a participant on the far
      side of an explicitly drawn boundary, with no message crossing from the
      hand-off check into it,
    And a reader can tell from the diagram alone which participants exchange
      written declarations and which one derives anything from a running test.
