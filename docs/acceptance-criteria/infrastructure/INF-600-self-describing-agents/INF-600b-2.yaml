notes: |
  RETIRED 2026-10-09. The full grounds are in the final amended_by entry; this is the
  short form for a reader who arrives here first.

  WHAT THIS RECORD REQUIRED. That a per-agent grouping of acceptance criteria, keyed
  on assigned_agent, appear in the generated ticket body or the generated agent card,
  so an agent could see exactly which criteria it owned.

  WHAT HAPPENED TO IT. Two things, and the second is the one worth remembering.

    - The CARD carrier was built, ran from 2026-06-29 to 2026-10-09, and was removed
      deliberately on the latter date. At removal it was 3,787 of 11,526 total card
      lines (33%), across 17 of 64 cards, and was the only part of any card that
      changed between regenerations — which is precisely why it was removed. A query
      cached into a generated document has to be rebuilt whenever anything it reads
      changes, so every build left a dirty tree nobody had authored.
    - The TICKET-BODY carrier was NEVER BUILT. scripts/ac_store/_gtfa_body.py renders
      one line, `Assigned agent: {assigned_agent}`, from the single criterion the
      ticket is generated from. There is no grouping because there is nothing to
      group.

  SO THIS RECORD WAS HALF-SATISFIED FOR ITS ENTIRE LIFE WHILE READING work_status:
  done, WITH covered_by [] AND NO COVERING TEST. (It reads `todo` from 2026-10-09; the
  `done` is what it carried from 2026-06-29 until the retirement.) That is a
  phantom-done instance and it is named as one rather than buried in the retirement.
  The general form is worth carrying away: an acceptance criterion whose When clause
  offers "A or B" and whose work_status is done tells you that one of A and B works.
  It does not tell you which, and nothing will notice when the live one disappears.

  TWO INDEPENDENT REASONS NOTHING NOTICED, WHICH IS WHY IT LASTED FOUR MONTHS. The
  disjunction above is one. The other is that check-done-proof — the gate that would
  have refused a `done` record with no `# covers:` tag — was never given the chance:
  the AC hooks read a commit's INDEX, not the store, and this record was not staged
  again between being marked done and being retired. The condition the gate tests was
  true throughout; the gate simply never saw the file. Its silence was not a pass. That
  is the index-only trap CLAUDE.md records under "AC-store commits — stage the parent
  alongside the child", and this is a live instance of it on a LEAF rather than on the
  stale parent the existing write-up describes.

  THE NEED IS NOT ABANDONED. An agent identifying the criteria it owns is a good
  requirement. It is met by querying the acceptance-criteria store — the source of
  truth, groupable by assigned_agent at read time, never stale — rather than by a copy
  baked into markdown. That is a mechanism, not a criterion, which is why this record
  is `deprecated` with `superseded_by: null` rather than pointed at a successor.

  ==========================================================================
  HOW TO RETIRE AN AC: THE SHAPE IS THREE FIELDS AND NOTHING NAMES IT.
  ==========================================================================
  The most reusable thing this retirement produced, written here because a future
  retirement will arrive at a deprecated record looking for the pattern and there is
  nowhere else to find it.

  THE SHAPE:

      status:        deprecated        (retired; retained for audit)
      work_status:   todo              (NOT done — see below)
      readiness:     reviewed          (NOT approved — see below)
      test_spec:     cleared to null   (content moved to notes — see below)
      test_required: false
      superseded_by: null              unless a real successor CRITERION exists

  Measured against every pre-existing deprecated record in the store on 2026-10-09 —
  ACD-800, ACD-800a, ACD-800a-1, ACD-800a-2, ACD-800b, ACD-800b-1, ACD-800c,
  ACD-800c-1, ACD-800c-2, ACD-800d, ACD-800d-1, FIN-100e-1, FIN-100e-2. readiness is
  `reviewed` on 13 of 13; work_status is `todo` on 11 of 11 that carry the field.

  WHY EACH, ON THE MERITS AND NOT ONLY ON PRECEDENT:
    - work_status is NOT `done` because the schema defines done as "implemented and
      verified", which is a claim about the tree as it now stands. A retired record's
      implementation is generally gone, so `done` is false — and there is no
      "retired" value in the enum, leaving todo as the only honest option.
    - readiness is NOT `approved` because approved means cleared FOR BUILDING, and a
      retired record is the one thing nobody should build.
    - test_spec is CLEARED and test_required set false, because the two are ONE
      declaration and the gate enforces their agreement: a populated test_spec beside
      test_required: false says "no tests are needed" and "here are the tests" in the
      same record. A retired record declares no tests and keeps the historical
      contract in prose. Move the descriptors into notes FIRST — they are usually the
      only surviving account of what the work was meant to prove — then null the
      field. Note that `test_spec: []` is NOT permitted by the schema; use null.
    - No demotion erases history. Every fact — that it was built, that it was
      approved, what its tests were going to assert — belongs in notes or amended_by,
      which can hold the dates and the reasoning that a one-word enum cannot.

  THE SAME ERROR IN THREE FIELDS, WHICH IS WHY THIS BLOCK IS WORTH ITS LENGTH. Each
  of the three demotions above was initially resisted on the same reasoning: the
  field held a TRUE FACT ABOUT THE PAST (the work was done; the record was approved;
  these were the tests) and demoting it looked like denying that fact. That reasoning
  is wrong the same way all three times. These are PRESENT-TENSE fields — what the
  tree contains, what is cleared for work, what test-writer should author next — and
  a present-tense field is not a place to store history. The fix is always: write the
  fact down in prose, then make the field honest. If you find yourself arguing to
  leave a field wrong in order to preserve something true, you are in this trap.

  AND THE PART THAT MAKES THIS WORTH WRITING DOWN AT ALL: GETTING ONE FIELD WRONG IS
  CAUGHT BY A DIFFERENT GATE EACH TIME, AND NO GATE NAMES THE SHAPE.
    - work_status: done on a retired record -> refused by check-done-proof, which
      asks for a `# covers:` tag that cannot honestly exist.
    - readiness: approved on a retired record -> refused by check-ac-schema's
      approved-code-AC rule, which asks for a test_spec that cannot honestly exist.
      (That rule exempts work_status: done, so it only surfaces AFTER the work_status
      field is corrected — the two failures arrive in sequence, never together.)
    - test_required: false beside a populated test_spec -> refused by check-ac-schema
      again, on a different rule: "test_spec lists N test(s) but test_required is
      false — remove test_required: false or clear test_spec". This one surfaces only
      after you reach for test_required at all, which you only do once the readiness
      fix has made you look at the test contract.
    - Each refusal offers remedies that are locally reasonable and globally wrong:
      write a covering test, author a test contract, reclassify the record as
      non-code, or drop test_required and leave the contract live. Every one of them
      is a way of making a retired record look alive. The actual fix is never in the
      direction the message points — it is the adjacent field.

  So a retirement done one field at a time trips one gate, gets fixed, trips the
  next, and each message argues for a different repair than the one needed. THIS WAS
  MEASURED, NOT PREDICTED: retiring INF-600b-2 took three refusals in sequence, and
  retiring TQ-600a-11 and its three children — done afterwards, by someone who had
  just written an earlier version of this block — still took two more, because the
  block was incomplete. Set all four fields together.

  THE SIBLING TO READ NEXT. INF-600b-3 requires the card to be assembled from the
  agent's own declared facts and nothing else, so that adding a criterion to the store
  moves no card. It reads as the opposite of this record because it is: the two are the
  before and after of one decision, not a contradiction. If you are here because
  INF-600b-3 confused you, this record is the half that explains why the property it
  asserts had to be written down at all.
