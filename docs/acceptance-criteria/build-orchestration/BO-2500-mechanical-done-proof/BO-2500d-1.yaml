it_requirements:
  - "The fast lane's phase order must contain no LLM validator agent and no LLM fulfillment-gate agent, and at most one LLM agent whose verdict bears on delivery — today the pr-reviewer dispatch at Phase 4.5 of templates/workflows-js/fast-lane-ship.js."
  - "The exclusion of validator and fulfillment-gate agents must be identified by the agent's role/kind, not by a hard-coded single agent name, so a future opinion-only agent of either kind is excluded by the same rule."
  - "Done-ness in the fast lane is established by exactly three mechanical gates and nothing else: verify_red_baseline, verify_green_and_coverage, and the covers-tag linkage / done-proof check (scripts/ac_store/done_proof.py). The reviewing agent's verdict is not one of them and must never be read at the mark-done site."
  - "The guarantee is DIRECTIONAL, not positional. Do not implement or test it as 'the review phase precedes mark_done' — that is satisfiable by moving code without changing authority. The property is that the set of ACs a run marks done is always a subset of what the mechanical gates alone would have permitted: the reviewer can shrink that set, never grow it."
  - "Do NOT invert the current Phase 4.5 / Phase 5 wiring. Marking ACs done before the review would leave a veto-blocked run with ACs recorded done and nothing committed — precisely the phantom-done shape BO-2500 exists to prevent. The existing order is the correct one."
  - "This change must not alter the heavy-pipeline phase order (see BO-2500d-2), which retains its review, validator and fulfillment-gate agents unchanged."
  - "Covering tests must EXECUTE the lane under unit_tests/_workflow_engine_harness.py (run_workflow_under_e2 with label_responses stubbing the review dispatch and the gate results) and assert on the RECORDED dispatches — which ACs the run's mark-done step was asked to flip. A test that greps templates/workflows-js/fast-lane-ship.js for an agent name, a phase name, or source-text ordering is not acceptable evidence: it passes on dead code, and this exact criterion has been green since 2026-07-21 on grep assertions against a runner nobody invokes (CLAUDE.md, 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep')."
  - "The replacement tests must carry the SAME '# covers:' ids as the assertions they replace, so scripts/ac_store/done_proof.py sees no change in linkage. The existing suite is unit_tests/workflows/test_bo2500d_gate_retirement.py, whose module constant _FAST_LANE_PATH points at the orphan; re-pointing that constant at the live lane is NOT sufficient, because the resulting assertions are still greps."
