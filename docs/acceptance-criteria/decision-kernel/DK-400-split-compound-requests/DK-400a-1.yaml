test_required: true
test_spec:
  - name: test_turned_away_bundled_goal_starts_split_and_waits_for_host
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: reachability
    description: Through RunService with scripted Jev (route __NONE__, bundle 0.9) the reusable-criteria goal ends
      waiting_host on decompose_goal, records no gap, and holds a split record with the goal as subject_text, subject_kind
      goal, found_at routing, depth 0 and trigger jev_none.
  - name: test_bundle_check_adds_no_jev_provider_call
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: 'The bundle question rides the root''s routing batch: the scripted provider records the same number
      of provider calls for the same root with split.enabled true and false.'
  - name: test_split_disabled_restores_todays_turned_away_outcome
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: failure
    description: With split.enabled false the same goal ends blocked with today's unsupported gap, and no recorded
      Jev batch holds a bundle question.
  - name: test_bundle_threshold_boundary_from_config
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: Bundle probability just below split.bundle_threshold records today's gap; at the threshold a split
      starts; the threshold is read from config.
  - name: test_split_record_is_idempotent_across_restart
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: failure
    description: Restarting the process at waiting_host (sqlite checkpointer) and reading the run again yields one
      split record with the same id.
  - name: test_kernel_config_schema_includes_split_section
    target_dir: tests/kernel/config/
    framework: pytest
    type: unit
    angle: real_artifact
    description: The config schema regenerated from the model includes the split section with its defaults and equals
      the committed config/kernel_config.schema.json.
test_rationale: 'Detection must be proven through the real route node and the real Jev batch: a direct call to a
  detector function could pass while routing never asks the question, and the no-extra-call claim only holds if
  the provider call count of a whole run is compared.'
