notes: |
  Authoring evidence (2026-09-21, origin/main 624d39ac):
    - One `python scripts/build.py --target-dir <tmp>` measures 59.8s.
    - 77 `--target-dir` invocation sites across 52 test files.
    - ZERO `scope="session"` fixtures exist in the suite; only 15 are
      module-scoped. Everything else is function-scoped.
    - Two of the three slowest entries in the duration table are fixture
      `setup`, not `call`: 206.74s for a single test in
      unit_tests/portability/test_bp_1500d_1_i.py, and 73.03s in
      unit_tests/portability/test_ge_120c_1.py.

  IMPORTANT BOUNDARY for the BA decomposing this L1: the read/mutate split is
  the whole point and must survive into the children. A shared layout is only
  safe for tests that treat it as read-only. The tests in
  unit_tests/test_bp_900g_8*.py deliberately MUTATE the package copy (withhold
  a dependency, edit build.py's declaration tuples) before building, and then
  assert the build FAILS. Those must keep building their own copy — sharing a
  layout with them would both corrupt the shared copy and destroy the very
  behaviour they exist to prove. A child AC that says "all tests reuse one
  build" is wrong and will be caught in review.
