criteria: |
  The finished-but-unproven backlog is triaged, never grandfathered into silence.

  Every item already marked finished that cannot be proven today is put in front
  of someone with a decision to make — prove it, redo it, or retire it — and
  progress through the pile is visible. Nothing is quietly exempted just for
  being old.
