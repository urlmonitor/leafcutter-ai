title: "At build start, claim the resolved set: flip todo -> in_progress on mainline first"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a connected build set has been resolved for a fast-lane run and it contains
    one or more leaf acceptance criteria whose work_status is todo,
  When the run starts, before any test or code work begins,
  Then each of those acceptance criteria is transitioned from work_status todo to
    work_status in_progress on mainline,
  And because mainline accepts changes only through pull requests, this transition is
    landed as a dedicated status-only change (touching only the work_status field of
    the resolved acceptance criteria) that is opened and merged before the build
    proceeds,
  And the build does not begin its test or code work until that status-only change is
    merged on mainline,
  And once merged, a concurrent fast-lane or heavy-lane run scanning for ready work
    excludes the now in_progress acceptance criteria from its ready set.
