id: BO-2900g-2-i
components:
  - build_orchestration
  - ac_store
  - testing_quality
title: "Work authored after the sweep carries the declaration too, so the hole does not reopen tomorrow"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given every existing work record whose stated behaviour asserts a durable,
      observable change already carries the declaration, because a one-off pass
      has just been run across the whole store,
  When a new leaf piece of work asserting a durable, observable change is
    authored afterwards, by an author who was never told the declaration exists,
  Then that new record carries the declaration,
    And the number of records that assert a durable change without the
      declaration is zero again, with no second pass having been run,
    And the same holds for a record authored through a different authoring route
      than the one used for the first,
    And the same holds when the one-off pass is not run at all, so the guarantee
      does not depend on the sweep having happened.
depends_on:
