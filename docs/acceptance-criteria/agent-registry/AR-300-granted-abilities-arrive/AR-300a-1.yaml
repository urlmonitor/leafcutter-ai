notes: |
  THE EVIDENCE RULE IS THE WHOLE CRITERION. The measured defect is that the
  abilities section is computed correctly per agent and then dropped, for all 60
  compiled prompts, because substitution is gated on a marker token present in 0
  of 60 source definitions. A proof that reads the registry, the computation, or
  the source definition passes today on 31 agents that receive nothing. Only the
  compiled prompt distinguishes the two states.

  WHY THE COUNT IS ASSERTED RATHER THAN IMPLIED. This repository has already
  shipped a check whose glob resolved to zero files, printed a success line and
  exited clean for eight days (KI-ACS-001). A comparison over an empty set of
  compiled prompts is indistinguishable from a passing one unless the population
  it examined is itself part of the assertion. AR-300a-1-i states the failing
  case.

  31 IS THE POPULATION AS MEASURED, NOT A CONSTANT TO HARDCODE. The figure is
  quoted so the criterion can be falsified against the pre-fix tree. The
  comparison must derive the population from the declarations, or the next agent
  granted an ability is outside it -- see AR-300d.
