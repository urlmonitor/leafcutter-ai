notes: |
  Today's single-pass behaviour is immune to a prerequisite loop because it never
  asks a second time. Asking repeatedly introduces the loop as a live hazard, so it
  is specified with the widening rather than after it.

  The third scenario is the containment clause: an unsatisfiable prerequisite must
  not become a reason to abandon the whole run, which would be a regression against
  the 17 pieces today's behaviour does build.
