notes: |
  WHY VISIBILITY IS PART OF THE FEATURE AND NOT AN OPTIONAL EXTRA. Every other
  L1 in this goal defends the same promise from the suppression side: narrowing
  what a check reports must never happen silently. This L1 narrows what the
  check reports too — by exemption rather than by suppression — so the same
  promise applies to it. Without this AC, the widening authored in GE-123d-2 is
  the one narrowing in the whole goal that nobody is told about.

  THE VALUE IS DELIBERATELY WITHHELD from the notice, which is the one departure
  from the GE-113c-3-v warning contract, and the reasoning matters. -v echoes the
  verbatim text of a malformed allowlist line, which is a line the author wrote
  and which contains nothing sensitive. Here the text is a line the check has
  just decided not to report as a credential — and the whole risk of this feature
  is that such a decision is occasionally wrong. Printing the value into a stream
  that lands in build logs would turn each wrong decision into an exposure. File
  path, line number and the granting shape are enough for an author to find the
  line in their own working copy.

  A PER-FINDING PARAGRAPH WAS REJECTED IN FAVOUR OF A SUMMARY. The
  acceptance-criteria store contains thousands of files whose text discusses
  these rules; a multi-line report per exempted finding would reproduce, on the
  error stream, exactly the volume of noise that made this L1 necessary. One
  notice per run, carrying a count and one short line per finding, is the
  proportionate form.

  ANTI-PRECEDENT, load-bearing and cited by two siblings in this component: a
  guard here is documented as automatically dispatching a specialist and does no
  such thing — its remediation path is a placeholder that always reports success.
  A documented-but-dead announcement is worse than none, because authors believe
  they are covered. This AC claims the author is told something, so it needs a
  test proving the notice actually reaches the error stream on the real commit
  path, not a test asserting the message string exists in the source.

  IT-PO NOTE, 2026-08-18, on the count and on the departure. Three separate
  mechanisms remove a finding from a run of this check: a .security-allowlist
  entry, which is applied inside the scanner before the post-filter sees
  anything; the pre-existing file-level high-entropy prose exemption, recorded
  as KI-CG-004; and this feature. Only the third belongs in the count, and that
  is now an it_requirement rather than an inference, because a pooled count is
  not reviewable and reviewability is the entire justification for the notice.
  The departure from GE-113c-3-v is also restated as an instruction rather than
  an observation — a reviewer aligning the two announcement contracts would
  otherwise reasonably add the verbatim text back, which is the one change this
  AC exists to prevent.
