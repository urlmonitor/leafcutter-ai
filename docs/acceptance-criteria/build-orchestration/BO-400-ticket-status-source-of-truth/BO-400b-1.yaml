id: BO-400b-1
title: "set_ticket_status.py accepts a ticket path and target status"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket file at path /path/to/epic/03_some_ticket.md
    with current frontmatter including `status: todo`,
  When the script is invoked as:
    python set_ticket_status.py --ticket /path/to/epic/03_some_ticket.md --status in_progress
  Then the script reads the ticket file
  And it locates the `status:` field in the YAML frontmatter block
    (the content between the first and second `---` delimiters)
  And it replaces the value with `in_progress`
  And it writes the file back preserving all other frontmatter fields unchanged
  And it preserves all content below the frontmatter closing `---` delimiter unchanged
  And it exits with code 0
  And it prints the old and new status to stdout:
    "status: todo -> in_progress"
depends_on: [BO-400b]
