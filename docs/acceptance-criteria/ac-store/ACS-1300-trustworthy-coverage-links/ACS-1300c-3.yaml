    relevance: "An unexplained gap stops the answer instead of passing it on. The final clause here is the arithmetic that keeps this run's report reconcilable under that standing contract: examined equals decided plus abstained, with nothing quietly absent from either side."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "ONE ABSTENTION CHANNEL FOR THE WHOLE TREE, DEFINED HERE. ACS-1300a-2-i (an entry the removal rule cannot classify), ACS-1300a-3 (a coverage list holding child requirement ids) and ACS-1300b-1-i (an unresolved delivery path) all report through this representation. Read `TQ-400e-2` and `TQ-400e-2-i` before choosing the shape, so the adjacent tree and this one do not invent two abstention formats for one concept — the direction differs, the representation should not."
  - "AN ABSTENTION IS A CLASSIFICATION THE DETECTION PASS PRODUCES, NOT AN EXCEPTION THE WRITE STEP CATCHES. A try/except wrapped around the write loop collapses three distinct failures — an unparseable file, a tag naming no record, an unresolvable coverage entry — into one, and it makes 'abstained' indistinguishable from 'crashed partway'."
  - "THE RUN DOES NOT STOP AT THE FIRST UNJUDGEABLE CASE. All abstentions from a single invocation must be reported by that invocation. A run that halts on the first bad record forces one repair run per defect over a store with a measured backlog in the hundreds."
  - "THE PROCESS OUTCOME MUST SAY ABSTENTIONS OCCURRED — NOT ONLY THE BODY OF THE REPORT. An operator reading only the outcome of a run that could not judge part of the store must not conclude the store is fine. This is the same shape as a hook that could not run reporting success, which GE-120 exists to forbid, and it is the clause people drop."
  - "EXAMINED EQUALS DECIDED PLUS ABSTAINED, WITH NOTHING QUIETLY ABSENT FROM EITHER SIDE. An abstention subtracts from what was decided and never from what was looked at. If abstained records dropped out of the examined total the run's own coverage figure would improve every time it understood less — the answer getting more confident as it saw less, which is exactly what ACS-1100 was written against."
  - "NO FILE BELONGING TO AN ABSTAINED-ON RECORD IS OPENED FOR WRITING. This follows structurally from abstention being a detection-pass classification: an abstained record never enters the write set, so ACS-1300c-2's byte and mtime guarantees hold for it without a second guard."
  - "NEVER WRITES THE FINISHED-STATE FIELD, INCLUDING FOR AN ABSTAINED RECORD. The tree-wide refusal applies."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md rules 1-4). Every abstention carries the reason it could not be judged; 'unknown error' is not a reason, and an abstention a reader cannot act on degrades to noise that gets switched off."
delivers_to: null
expects_from:
  ac_id: ACS-1300a-1
  contract: "The finding set, including the records and tags the join could not classify. An abstention is a classification the detection step produces, not an error the write step discovers."
