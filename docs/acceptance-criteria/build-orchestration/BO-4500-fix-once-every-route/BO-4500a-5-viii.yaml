criteria: |
  Given a request to the command-step-runner whose target names the workspace
    /home/u/proj/worktrees/plan-x, the branch plan/x and the run plan-bo-4500-20261012, and
    no acceptance-criterion id,
  When the command-step-runner reads it,
  Then it runs the command once in that workspace and returns its result in the usual shape,
  And it does not decline the request for lacking an acceptance-criterion id.

  Given a request whose target names neither a run nor an acceptance-criterion id,
  When the command-step-runner reads it,
  Then it declines naming the missing run-or-criterion as its reason, and runs nothing.

  Given a request whose target names an acceptance-criterion id and no run, as the fast lane
    sends today,
  When the command-step-runner reads it,
  Then its behaviour is unchanged from before this change.
