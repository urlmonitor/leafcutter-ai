  - reason: "IT PO technical enrichment, 2026-08-26. Resolved the BA's second escalation: the INF-700b-3 and INF-700a counters do not collide and may share a reporting surface, subject to three stated rules (different inputs, different denominators, no derivation of one from the other). Added the second expects_from entry — the criteria's third case needs the nothing-to-record attempt record from INF-700b-1-i, not only the failure record from INF-700b-1-ii, and that dependency was unstated. Forbade sourcing any figure from the harvester's routing counters, which currently report all 28 records unroutable and would mislabel silence as breakage."
