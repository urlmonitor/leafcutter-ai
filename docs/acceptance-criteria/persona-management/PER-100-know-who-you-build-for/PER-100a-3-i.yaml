work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a persona.yaml file containing invalid YAML syntax (e.g., a tab character where spaces are expected)
  When the persona validation script is run against the file
  Then it exits with a non-zero status
  And the error message indicates a YAML parse failure
  And the error message includes the file path and the line number where parsing failed
  And the error is distinct from a schema-validation error (it is reported as a syntax error, not a missing-field error)
