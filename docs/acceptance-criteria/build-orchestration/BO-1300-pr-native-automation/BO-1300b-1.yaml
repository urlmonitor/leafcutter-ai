  - path: "docs/architecture/agent_delivery_workflows.md"
    relationship: "describes"
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "CREATE NEW SHARED HELPER (single source of truth): the wait-for-checks merge gate does not exist today. finalize-feature.js Step 4 merges with `gh pr merge --merge --auto` and the pull-request.md poll gate only inspects mergeable/mergeStateStatus, NOT required-check conclusions. Author ONE deterministic helper (e.g. scripts/pr_merge_gate.py) that, given a PR number + base, reads the repository's branch-protection required status checks (gh api repos/{owner}/{repo}/branches/{branch}/protection/required_status_checks, or gh pr view --json + status-check rollup) and returns the required-check set. Per the IT-PO single-helper rule, both the .js workflow and any agent-prose caller must consume this one helper rather than re-deriving the set."
  - "MUST read the required set dynamically from branch protection; MUST NOT hard-code 'Lint (ruff)' or any check list. 'Lint (ruff)' is only the canonical example to validate against."
  - "Owner/repo and default branch must be resolved dynamically (gh repo view / git remote), not hard-coded."
  - "Error handling per project policy: wrap the gh/git subprocess calls in typed try/except, log at WARNING; if branch protection cannot be read (e.g. token lacks scope), fail-safe by surfacing a blocker rather than assuming an empty required set (which would let a merge through unchecked)."
  - "This helper is the producer for the verdict consumed by BO-1300b-2 / b-2-i / c-1-i; keep its output a structured, testable value (set of required check names + per-check state), not free text."
delivers_to:
  agent: python-coder
  contract: "Structured required-check set for the PR: { required: list[str], states: dict[str, 'pending'|'success'|'failure'|'missing'] } consumed by BO-1300b-2 (wait/merge), BO-1300b-2-i (red), and BO-1300c-1 (blocker naming)"
expects_from:
  ac_id: BO-1300a-2
  contract: "The open PR number + head/base refs whose branch-protection required checks are read"
