id: GE-126d-1-i
title: "A roster entry naming a check that no longer exists is named too"
component: guardrail-engine
components:
  - commit_guardian
  - skills_system
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the roster the autofix loop reads names a check that is absent from the manifest —
    a check that was removed or renamed while its roster entry stayed behind,
  When the registration parity check runs,
  Then it names that roster entry and states that it refers to a check the manifest does
    not contain,
  And it reports this as a warning without blocking so a removal in progress is not
    prevented,
  And in the same run a roster entry that does name a check present in the manifest is left
    unmentioned,
  And the report distinguishes this finding from the missing-membership finding so a reader
    can tell an entry with no check from a check with no entry without comparing the two
    lists by hand.

  Coverage note: covered by running the parity check over a fixture registration set
  carrying one stale roster entry and one sound one and asserting the stale entry is named
  and the sound one is not. The two findings must be distinguishable in the output; a
  single undifferentiated "these do not match" report does not cover this criterion.
