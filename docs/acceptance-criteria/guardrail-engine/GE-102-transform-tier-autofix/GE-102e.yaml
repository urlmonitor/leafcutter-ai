criteria: |
  Given the two new transform-tier hooks (doc-frontmatter and description-field) have been
    added to the commit guardian and registered in the hooks_manifest with tier: transform,
  When an adopter reads the pre-commit hooks how-to,
  Then the how-to lists both new transform hooks by name and explains what each one fixes,
  And it explains the transform tier: that these hooks deterministically fill missing fields
    in place, re-stage the corrected file, and exit clean rather than blocking the commit,
  And it states that the transform hooks run before their matching validator hooks so a field
    is filled before it is validated,
  And it documents the fail-open / no-op-on-absent-docs-layout behavior so adopters in projects
    without a docs/ layout know the hooks stay silent.
