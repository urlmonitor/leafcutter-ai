risk_surface: internal
notes: |
  Backfill of shipped behavior; consistent with the derived-status rule in UXP-411/UXP-412
  and ADR-023 rule 3 (status derived from AC work_status, never hand-edited).
  RECONCILIATION (2026-08-11): work_status flipped in_progress -> done. The earlier IT-PO note
  recorded the decision-diamond tinting as a GAP ("not shipped, fixed amber"); that gap is now
  CLOSED — both the outcome-node tinting AND the decision-diamond tinting are covered by four
  passing vitest tests tagged `// covers: UXP-601` (graph.decisions.test.ts:
  outcome_branch_node_carries_impl_status, decision_diamond_carries_derived_impl_status;
  flow-nodes.decisions.test.tsx: outcome_node_tints_by_derived_impl_status,
  decision_diamond_tints_by_derived_impl_status). The two decision-diamond tests were authored
  as "expected to fail" during the red phase but PASS in the current green suite (41/41),
  confirming the diamond now carries a derived status. it_requirements updated to state the
  diamond-tint requirement as delivered rather than as a gap.
