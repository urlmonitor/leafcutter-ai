assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "PER-FILE ERROR CONTAINMENT. Wrap each file's read-and-parse individually so one failure cannot abort the loop; the component's deliberate fail-open convention (approved as GE-116a-1-iii) is that one unparseable input must not block an unrelated commit. Catch specific exception types per the project error handling policy — never a bare except — and log at WARNING or higher."
  - "SKIPPED-AND-NAMED IS A RECORDED OUTCOME, NOT A LOG LINE THAT SCROLLS PAST. The unreadable file appears in the check's output with the reason (decode error, unterminated construct, whatever the read actually failed on). A file skipped quietly is a permanent hole the author never learns about, and is the shape of a check that passes because it did nothing — GE-120's line."
  - "SKIPPED IS NOT PASSED AND NOT EXAMINED. The unreadable file must not receive a pass record and must not be counted as declared anywhere. It occupies its own outcome, distinct from GE-124c-3's not-examined (never in the staged set) and from a genuine pass."
  - "DISTINCT FROM GE-124c-2-ii, AND THE TWO MESSAGES MUST DIFFER: there the RESOLVER is unavailable and no file can be judged; here one FILE is unreadable and the rest of the run is sound. Merging the two messages would tell an author to check their AC store when the real problem is their markup."
  - "The exit code is decided from the OTHER files' verdicts. An unreadable file contributes nothing to the block decision in either direction — it neither blocks nor rescues a run that would otherwise block."
delivers_to: null
expects_from:
  ac_id: GE-124c-3
  contract: "The proceed branch this edge case extends to a partially-unreadable staged set, plus the pass-record path that must still run for the readable files in that same set"
test_spec:
  - name: test_ge_124c_3_i_unreadable_file_is_named_with_its_reason_and_does_not_block
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "Stage one unparseable file and one correctly declared file, run the hook via subprocess: exit 0, the unparseable path and its reason appear in the output, and the declared file's pass record is present. Assert all three together — exit 0 alone passes on a hook that swallowed the file silently, which is the exact hole this AC closes."
  - name: test_ge_124c_3_i_unreadable_file_receives_no_pass_record_and_is_not_counted_as_declared
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: boundary
    description: "The skipped file appears in the skipped outcome only: no pass record, and it contributes nothing to any declared count. Skipped is its own state, not a quiet success."
  - name: test_ge_124c_3_i_an_unreadable_file_does_not_rescue_a_run_that_would_otherwise_block
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "Stage an unparseable file alongside an undeclared in-scope file: the run still exits non-zero for the undeclared one. An implementation that treats any read failure as 'degrade the whole run to advisory' would turn a malformed file into a universal bypass."
test_rationale: |
  Exit 0 is the wrong assertion on its own here — it is satisfied by the very failure this AC
  exists to prevent, a file swallowed in silence. Every test therefore pairs the tolerance
  assertion with a visibility assertion, and all of them drive the hook from its entry point,
  because 'the run continued and said so' is a property of the process output rather than of
  any function's return value. The third test is the over-correction guard: the shortest path
  to satisfying the first two is to catch broadly and downgrade the whole run, which would let
  anyone bypass the floor by staging one malformed file alongside their undeclared component.
