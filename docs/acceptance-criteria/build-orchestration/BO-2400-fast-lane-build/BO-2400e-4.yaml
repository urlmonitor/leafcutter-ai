    type: behavioral
    angle: real_artifact
    description: "Copies eleven REAL records from the store into a temp tree, drives the build's progress recording through begin/finish for each, and asserts the total textual change across the tree is confined to the progress values. Real records are required: they carry the long notes, block scalars and quoting styles that a hand-written fixture will not reproduce."
  - name: test_progress_recording_preserves_the_record_via_the_real_surface
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "PRODUCTION ENTRY POINT: drive the lane's real progress-recording surface rather than any helper, so a preserving writer that exists but is not the one the lane calls fails here."
test_rationale: "The test an implementer will reach for first — load the record after the update and assert its values are correct — passes on the current, defective behaviour, because a re-keyed record parses to exactly the same mapping. The defect is invisible at the parsed level and visible only in the file's text, so every assertion here is textual. The real-records case matters for the same reason the project's real-artifact rule exists: hand-written fixtures are short, uniformly quoted and free of block scalars, which is precisely the shape that hides serialisation differences; the store's actual records carry long notes blocks, mixed quoting and multi-line criteria, and those are what a re-serialising writer mangles. The entry-point test is separate because adding a preserving writer while leaving one of the three call sites on the old path is the most likely partial implementation, and it would be undetectable from the other three tests."
