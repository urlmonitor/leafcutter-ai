it_requirements:
- Bind the answer atomically to unresolved request ID and run ID; repeated or cross-run answers must not
  dispatch duplicate work.
- Continuation requires enabled admission, revalidation and remaining budget; the answer is data in the
  resumed context, never proof of implementation or review.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300d-1 (data handoff, not an additional build-order prerequisite): InboxItem
  {item_id:string, run_id:string, feature_id:string, ac_id:string|null, request_id:string|null, state:string,
  reason:string|null, required_answer:string|null, evidence_refs:string[], pr_url:string|null, validated_sha:string|null,
  reviewed_sha:string|null}.'
- 'Runtime interface from ACD-1300e-3 (data handoff, not an additional build-order prerequisite): Revalidation
  {run_id:string, admissible:boolean, source_revisions:object, target_sha:string, evidence_revision:string,
  changed_fields:string[], blocker:string|null}.'
- 'Runtime interface from ACD-1300c-1 (data handoff, not an additional build-order prerequisite): ACBudget
  {run_id:string, ac_id:string, attempts_used:integer, implementation_elapsed_ms:integer, remaining_attempts:integer,
  remaining_ms:integer, exhausted:boolean}.'
test_spec:
- name: test_background_worker_valid_answer_reaches_same_resumed_run
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: reachability
  description: Answer QUESTION-1 and continue enabled run with budget; next controlled executor receives
    answer, same worktree, prior evidence and run ID.
  covers:
  - ACD-1300e-1
  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_wrong_or_replayed_answer_cannot_resume
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Unknown, other-run and resolved request IDs each leave current run paused/blocked with
    zero dispatches.
  covers:
  - ACD-1300e-1
- name: test_background_worker_answer_while_disabled_does_not_dispatch
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Persist an explicit answer while disabled and assert no call until enabled and revalidated.
  covers:
  - ACD-1300e-1
