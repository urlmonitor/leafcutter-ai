id: CR-100b-2
title: "When a complexity check stops you, the skill it tells you to use is installed and its numbers are the checker's own"
component: code-review
components:
  - review_system
  - skills_system
  - commit_guardian
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a project the package has been installed into,
    and an author who has been refused by a complexity check (the Python
    per-function check or the SQL per-file check), or told by a refusal or by
    the python-coder instructions to use the complexity-reduction skill,
  When the author looks for that skill by that name in the installed project,
  Then a skill named complexity-reduction is installed there and loads by that name,
  And it states what each of the two checks counts and which constructs carry
    the score,
  And it treats the limits as the project's own settings: it names where they
    are read from and how to print them, and states no limit of its own that
    could disagree with them,
  And every before/after example it gives is labelled with the score the
    shipped checker assigns to it, and every label equals what that checker
    computes for that example,
  And the commands it gives for measuring a score and printing the limits refer
    to checker files that exist in the installed project,
  And it never offers removing logging or RAISE NOTICE statements as a way to
    lower a score,
  So that the fix a refusal names exists, and following it gives correct numbers.
depends_on:
  - CR-100b
doc_links:
  - path: docs/acceptance-criteria/code-review/CR-100-refactoring-guidance/CR-100b.yaml
    relationship: parent
    status: exists
