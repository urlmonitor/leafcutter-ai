title: "A coder's spawn context excludes cross-role authoring content"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given a coder (python-coder) is spawned for a build task,
  When its effective context is assembled at spawn,
  Then the context excludes requirement-authoring memory owned by the BA, PO, and IT-PO roles,
  And it excludes the supervisor and finalize Pre-Drive Checklist,
  And it excludes authoring-pipeline instructions meant for other roles.
depends_on: [ACD-1700a]
doc_links:
  - path: docs/architecture/agent_knowledge_plane.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "The role-scope filter must be data-driven from the agent's role/craft, not a hard-coded per-agent allow/deny list, so a new agent inherits scoping without a code edit."
  - "The content classes excluded for a builder must at minimum be requirement-authoring memory (BA/PO/IT-PO), the supervisor and finalize Pre-Drive Checklist, and authoring-pipeline instructions, enumerated from a single declared role-to-content-class source rather than restated per call site."
  - "Exclusion must be verifiable statically via the effective-prompt render tool so a reviewer can confirm it before a build runs, with no live spawn required."
  - "Must degrade safely: an unknown or unclassified content class defaults to excluded-for-builder rather than leaking, and the tool must not error on an unrecognised channel."
  - "Must not strip channels that carry the builder's own spec (the AC-graph task context, the role template, and the reproducible shared context)."
delivers_to:
  agent: python-coder
  contract: "Role-scoped effective-context assembly (in scripts/render_effective_prompt.py) that, for a builder role, omits authoring memory, the Pre-Drive Checklist, and authoring-pipeline instructions; consumed by ACD-1700a-2's own-context-preserved check and by the ACD-1700a-3/-4 diagram and reference-doc ACs."
