title: "A covering tag is matched to the one test it sits on, so two tests sharing a name never lend each other their result"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given one test run whose results include four covering tests that share a
    name with another covering test —
      T1: unit_tests/ac_store/test_refresh.py, class TestRetryGate,
          test_blocks_when_not_due, tagged as covering TQ-9001, fails,
      T2: unit_tests/ac_store/test_refresh.py, class TestExportGate,
          test_blocks_when_not_due, tagged as covering TQ-9002, passes,
      T3: unit_tests/ac_store/test_config.py, test_loads_defaults, tagged as
          covering TQ-9003, passes,
      T4: unit_tests/build_orchestration/test_config.py, test_loads_defaults,
          tagged as covering TQ-9004, fails,
  When the proof-of-done check evaluates TQ-9001, TQ-9002, TQ-9003 and TQ-9004,
    And the red-baseline check reads the same tags against the same run,
  Then each tag is matched to the test at its full identity — its file path
      within the test root, its class (when it has one) and its function name —
      never by file name and function name alone,
    And TQ-9001 is judged not eligible for done because T1 failed, and TQ-9002
      is judged eligible because T2 passed, although T1 and T2 share a file and
      a function name,
    And TQ-9003 is judged eligible because T3 passed, and TQ-9004 is judged not
      eligible because T4 failed, although T3 and T4 share a file name and a
      function name,
    And the red-baseline check attributes each of the four outcomes to the
      same test the proof-of-done check did, and reports none of the four as
      ambiguous,
    And reversing the order in which the run reports the four tests changes
      none of these verdicts,
    And a parametrised covering test is still judged across all of its cases,
      as ACS-200f-2 requires,
    And a tag that still cannot be tied to exactly one test in the run's
      results is never attributed to a guessed test: the red-baseline check
      refuses it with the reason "ambiguous_test_identity" and the
      proof-of-done check refuses the requirement it covers, naming the tag
      and every candidate test.
depends_on:
  - TQ-500f-3
  - TQ-500f-3-i
  - ACS-200f-2
