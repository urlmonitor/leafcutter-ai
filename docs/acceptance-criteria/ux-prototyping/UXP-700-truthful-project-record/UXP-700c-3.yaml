test_required: true
test_rationale: |
  Registration is the whole subject, so the test must assert the checker is reachable from the
  project's automatic checks as they are actually configured - reading the configuration, not
  calling the checker directly. A test that invokes the checker function proves nothing about
  whether anything ever invokes it, which is the live defect. The last clause needs its own
  negative assertion or the fix is "run it on every change", which is a different, slower
  defect.
test_spec:
  - name: test_record_checker_is_registered_among_the_projects_automatic_checks
    target_dir: unit_tests/product_truth/
    description: "The checker appears in the automatic-check configuration with a file scope that includes the record."
    type: integration
    angle: reachability
    framework: unittest
  - name: test_a_change_to_a_pointed_at_file_runs_the_record_checker
    target_dir: unit_tests/product_truth/
    description: "Offering a change to a file the record points at causes the record's checker to execute."
    type: integration
    angle: seam
    framework: unittest
  - name: test_an_unrelated_change_does_not_run_the_record_checker
    target_dir: unit_tests/product_truth/
    description: "Offering a change touching neither the record nor anything it points at leaves the checker unexecuted."
    type: integration
    angle: boundary
    framework: unittest
notes: |
  OWNERSHIP CALL, recorded because UXP-700b and UXP-700c both flag it and the L1 notes say
  exactly one must own it. It is owned HERE, in UXP-700c, on this reasoning: UXP-700b owns what
  a verdict MEANS; UXP-700c's own benefit statement is "you are told, AT THE TIME IT HAPPENS",
  and timeliness is not a property of a verdict, it is a property of when the check runs. A
  check nobody runs produces no verdict at all, so there is nothing for UXP-700b to be about.
  UXP-700b-4 (the reference doc) should cross-reference this AC rather than restate it.

  EVIDENCE. Searched repo-wide 2026-09-07: the product-truth checker is referenced only by ACs,
  agent cards, ADRs and how-to docs. There is no entry for it in .pre-commit-config.yaml and no
  CI step. It is not wired to anything.

  SECOND-ORDER RISK for the IT PO: the second clause ("the verdict IS the gate's verdict") is
  what stops the checker being wired in as an advisory that prints and always succeeds. That is
  the most likely way this lands green while changing nothing.
target_epic: EPIC-WhatYourProjectSaysAboutItselfIsTrue,And
