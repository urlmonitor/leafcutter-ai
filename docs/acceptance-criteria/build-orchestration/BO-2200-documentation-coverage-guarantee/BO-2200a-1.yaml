it_requirements: |
  A new `documentation_gates` section in the guardrail gates config drives whether
  `documentation-expert` is required, read by the ticket generator when it builds the
  agents map. This is the documentation-specific trigger policy layered on top of the
  BO-500 computed-quality-gate engine — do NOT re-derive the general gate-selection
  engine here. The mapping is data-driven: the triggering `change_target` set is
  {ui, schema, pipeline, docs}.
