priority: medium
title: "A requirement abandoned by a vanished effort becomes available again without that effort's help"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement taken by an effort that then vanished without handing it
    back -- the machine was killed, the workspace was destroyed, the session was
    lost,
  When a later effort comes looking for work,
  Then that later effort can determine, from the requirement alone, that the
    claim has been abandoned,
  And it can take the requirement over, with itself recorded as the new owner
    and the moment updated,
  And a requirement taken by an effort that is still working is not taken over,
  And the takeover is recorded, so that the vanished effort returning later
    cannot silently resume as though it still held the requirement.
