notes: |
  Edge case of BO-2900g-1, and the one that decides whether the parent's fix is an
  improvement or a regression.

  THE TWO WAYS THE OBVIOUS IMPLEMENTATION GOES WRONG. Making the floor universal
  is naturally implemented as "append the request to every plan". Applied to the
  394 records that already author their own plan, that produces (a) a duplicate
  request wherever the author already asked for one, and (b) — worse — a second
  request whose text says the way in is not declared, sitting next to one that
  names it. The doer then has two contradictory instructions for the same proof
  and the more specific one, the human's, is the one that looks redundant.

  WHY THE LAST CLAUSE IS HERE. The floor is two named kinds and no more. An
  implementation that normalises authored plans up to the full taxonomy while it
  is in there converts a targeted rule into a bulk rewrite of 394 human-authored
  test contracts. The parent AC's order-preservation clause and this clause
  bound the change together.

  IT-PO ENRICHMENT NOTE (2026-08-17). The sentinel string is called out as a
  single named constant because BP-1100g-4's promise-versus-claim check has to be
  able to tell "a reachability proof was promised with an unresolved entry point"
  from "a reachability proof was promised naming one", without parsing prose.
  it_requirements uses the package-surface OBJECT form mandated by
  config/ac_store_schema.json's root if/then for python-coder +
  component: build-orchestration.
