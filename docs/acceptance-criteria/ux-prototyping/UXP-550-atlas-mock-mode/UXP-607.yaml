assigned_agent: frontend-coder
estimated_complexity: M
it_requirements:
  - "The badge value must be derived from the single resolved runtime mock decision returned by the data-layer seam in leafcutter-web/lib/data/mock.ts (resolution order production lock > runtime override > LEAFCUTTER_MOCK env default), never from the build-time NEXT_PUBLIC_ mock flag."
  - "The badge component in leafcutter-web/components/shell/sidebar.tsx and the view data must both read from that one resolved decision so they are computed from a single source and cannot diverge."
  - "Resolution must be evaluated per request on the server so a runtime override is reflected in the same response that serves the overridden data (no stale build-time value)."
  - "No fallback code path may re-read the NEXT_PUBLIC_ build-time flag for the badge; the build-time flag must not be able to re-introduce badge/data divergence."
