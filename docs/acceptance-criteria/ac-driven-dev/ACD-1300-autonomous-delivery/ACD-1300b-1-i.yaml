priority: medium
criteria: |
  Given the local model cannot use required tools, the reviewer lacks credentials, or the global limit is zero
  When the user enables the worker
  Then status names the invalid setting or unavailable capability and its required correction
  And no feature is admitted
  And no cloud implementation or different reviewer is silently substituted
