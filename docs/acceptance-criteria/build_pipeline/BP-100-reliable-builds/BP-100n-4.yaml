notes: >-
  VERIFIED DEFECT, 2026-08-31, sourced from KI-CG-20260831-hook-scripts-never-invoked and
  re-measured against this worktree before authoring: 66 check_*.py scripts on disk, 59
  hooks_manifest entries, 5 of them enabled:false (check-mermaid-drift, check-diagram-naming,
  check-duplicate-code, check-diff-coverage, check-surface-components-e2), 60 distinct .py
  filenames named across all entry lines, and 19 scripts on disk named by no entry at all.
  The 19 reconcile exactly with the finding's 24-unreferenced count once the 5 disabled are
  set aside, which is the arithmetic that makes constraint "registered-but-disabled is a
  third state" load-bearing rather than decorative.


  THE GAP IS IN THE ENUMERATION, NOT THE PREDICATE. BP-100k-4's predicate is sound and is
  not being changed. Its input is hooks_manifest.hooks, so a script that was never registered
  is not in the set it walks, and the guard built to find gates that cannot fire is
  structurally blind to the gate nobody wired up. A completeness guard whose input is the
  registry it is meant to be checking cannot detect incompleteness in that registry.


  DAY-ONE BLAST RADIUS IS 19 REPORTS, AND THAT IS THE CORRECT OUTCOME. The check fails on the
  commit that lands it until each of the 19 is registered, deleted, or given a grounded record
  in the non-gate register (BP-100n-4-i). Triaging them is part of the work, not a follow-up:
  a check that lands green because its findings were pre-suppressed has proved nothing. The
  named instance is the ticket sign-off parity script — deployed, documented as live with
  enforcement, invoked by nothing, and load-bearing for BP-1100g-5-i and four TQ-500 criteria
  that pin their reader onto it.


  MUTATIONS FOR THE ABSENCE-ASSERTING CLAUSES. Two clauses here assert that something is NOT
  reported, and both are green on arrival by construction — there is no red baseline for
  either, because today nothing is reported at all. Each needs an injected mutation to have
  any evidential value:

  (1) "a script named by an emitted registry entry is not reported at all" — MUTATION: build
  the invoking set by kebab-casing each script's filename and matching it against registry
  ids, instead of reading the entry lines. This is the precise over-report the finding's
  Method section controls for: check_ac_limits.py runs under the id check-ac-tree-limits and
  would be falsely reported. Under this mutation the clause must fail, naming at least
  check-ac-tree-limits' script.

  (2) "a script named by a registry entry marked not to be emitted is reported as switched
  off and does not fail the run" — MUTATION: build the registered set from the generated
  commit-time configuration alone (the emitted entry lines) rather than from the whole
  registry. The 5 enabled:false scripts then appear as invoked by nothing and the run fails
  on them. Under this mutation the clause must fail with exactly those 5 named. This is the
  five-false-alarms-on-day-one scenario, and false alarms have exactly one natural remedy —
  weakening the check until they stop — so the mutation must be run, not merely described.


  ANTI-GREP, AND HERE IT IS THE WHOLE POINT. Per CLAUDE.md "Gate / Workflow ACs — Verify
  Behaviorally, Not by Grep", and more sharply: an implementation that compares one hardcoded
  list against another reproduces this exact defect one level up, which is how the incumbent
  guard fails. Both sides must be enumerated at run time — the disk side by listing the tree,
  the registry side by parsing the file the commit would actually consume. The added-script
  clause is the decisive discriminator: it cannot pass on any implementation carrying a
  literal list, and it is the clause to write first.
