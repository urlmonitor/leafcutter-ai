test_rationale: |
  The parent's central property is DERIVED, and a record that carries the declaration
  looks identical whether it was derived or set by hand, so a test that inspects one
  record proves nothing. Two shapes are load-bearing here: the real-artifact run over
  the actual 2,888-record store (the exact test EPIC-ComputedQualityGates FP-1 layer 2
  lacked — every test there fed hand-built dicts that already contained the axes), and
  the deployed-hook run, because the source-tree validator and the deployed gate are
  different code paths and only the deployed one runs at commit time.
