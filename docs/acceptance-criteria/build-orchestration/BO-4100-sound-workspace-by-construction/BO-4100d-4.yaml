id: BO-4100d-4
title: "A workspace is created in the tool's own repository, whichever copy of the tool was invoked"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given a copy of the workspace-creation tool that has been deployed to a
    location outside the repository it manages,
  When a workspace is created with that copy,
  Then the workspace is created in the repository the tool belongs to, not in
    whatever repository happens to contain the copy,
  And when the tool cannot determine that repository, it refuses and names the
    location it tried to resolve from,
  And it never reports success for a workspace created in a different
    repository from the one the caller asked about,
  And the symptom ("the deployed copy aborts with a bare git exit status 128,
    or silently resolves the adopter's repository") does not occur.
depends_on: [BO-4100d]
