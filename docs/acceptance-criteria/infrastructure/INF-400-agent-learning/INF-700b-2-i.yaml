notes: |
  Included because this repository has shipped this exact failure twice: a hook
  dependency omitted from the build deploy manifest crashed the deployed hook
  while its unit tests passed against the source tree, and hooks importing a
  helper absent from a consumer layout no-opped silently. A gate that only
  refuses in the package's own checkout does not protect the consumer install
  where the dangling reference was originally reported.
