  - name: test_flag_quotes_offending_clause
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "The flag quotes the offending authoring-pipeline clause verbatim."
  - name: test_flagged_ac_held_for_correction
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A flagged AC is held for correction until the offending clause is removed."
