criteria: |
  Given the pre-inbox-exit premise verification runs captured reproduction commands against
    a clean, CI-equivalent tree,
  When the documentation step runs for this feature,
  Then a sequence diagram is produced showing: ticket capture -> establish clean tree ->
    run reproduction command in clean tree -> compare to captured result -> on match, clear
    the ticket; on mismatch, block; on clean-tree unavailable, hold,
  And the diagram shows the confirm, block, and hold branches,
  And it distinguishes this authoring-time clean-tree verification from the dispatch-time
    re-check (BO-1900b).
