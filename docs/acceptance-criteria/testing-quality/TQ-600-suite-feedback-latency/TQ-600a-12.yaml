test_spec:
  - name: test_tq600a_12_child_sessions_carrying_the_parents_run_identity_run_no_build
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      A parent produces the layout, then starts two child sessions with the parent's
      run identity in their environment. The execution log records exactly one deploy
      — the parent's — and neither child adds one.
  - name: test_tq600a_12_child_sessions_report_the_root_the_parent_produced
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The root path each child reports equals the parent's. NAMED MUTATION: drop the
      run-identity override from the child environment; this test must go RED, which
      is also the proof that the override is what makes the reuse happen.
  - name: test_tq600a_12_a_seeded_private_root_matches_a_built_private_root_entry_for_entry
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      Produce one private root the long way and one from a seed of a real finished
      layout. Compare the entry sets and the file contents. They match, and both
      satisfy the completeness check.
  - name: test_tq600a_12_the_seeded_route_is_at_least_ten_times_cheaper_than_the_built_route
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Time both routes in the same sitting. The seeded route takes at most a tenth of
      the built route. Ratio only; the measured ratio was 23.7, so a tenth leaves
      generous headroom for load.
  - name: test_tq600a_12_the_seventeen_eligible_tests_cost_at_most_a_quarter_of_their_baseline
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Run the three eligible files with seeding off and with seeding on, same machine
      same sitting, and assert the ratio. This is the descriptor that makes the whole
      change worth building, and the only one that measures the population rather
      than a mechanism.
test_rationale: |
  The mechanism half of this change is cheap to prove and the value half is not, so
  the descriptors are split accordingly: two on the shared route, two on the seeded
  private route, and one on the population.

  The run-identity descriptor names its injection because the whole shared half is a
  caller-side change — nothing in the production code moves — and a test that merely
  observes one deploy could be observing a cache hit from an unrelated cause. Removing
  the override must turn it red, or it is not measuring what it claims.

  Content equivalence is asserted against a REAL finished layout rather than a
  synthetic directory tree, because the claim being made is that a copy of a built
  layout is byte-identical to a build — and a fixture tree nobody built cannot test
  that.

  Every timing descriptor is a ratio measured in one sitting. This workspace is a
  shared host under variable agent load; the absolute figures in the criteria were
  taken under load and are upper bounds.
