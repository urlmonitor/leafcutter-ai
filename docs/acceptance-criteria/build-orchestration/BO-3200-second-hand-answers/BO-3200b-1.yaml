        surface withheld entirely"), and no test_spec entry covers the added dispatch-record And;
      - test_spec[5] description "Performing the action inline";
      - test_rationale first paragraph ("Removing the ability to dispatch");
      - estimated_complexity may change now that the release routes through the executor.
    The notes paragraph "THE UNAVAILABLE-SPECIALIST CLAUSE IS THE DISCRIMINATOR" describes the
    SUPERSEDED premise.
