assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    refusal_message:
      type: object
      description: "Every refusal the guard emits is built from one record: { cause: 'proof_not_through_entry_point'|'no_entry_point_reaches_code'|'uncalled_capability'|'stale_invocation', item: str, missing_side: 'proof'|'entry_point'|'caller'|'capability', clearing_actions: [str] }. clearing_actions has exactly one entry for every cause except 'no_entry_point_reaches_code', which has exactly two."
  reference_file_path: "scripts/commit_guardian/commit_guardian.json"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "FOUR CAUSES, FOUR MESSAGES. Build each message from the record above so the item, the missing side and the clearing action are separate fields rather than free text. A single generic sentence with the item interpolated satisfies a rule-shaped requirement and leaves the reader working out which of four things went wrong — that is why the criteria enumerate."
    - "Two of the four causes are produced in the done-proof path (scripts/ac_store/done_proof.py) and two in the reachability hook (scripts/commit_guardian/check_reachability.py). The message-composition function must be SHARED by both so a fifth cause cannot be added on one side with a bespoke message on the other; place it in the shared seam module and import it from both."
    - "ONLY 'no_entry_point_reaches_code' MAY OFFER AN EXEMPTION. Offering one on the other three converts a five-minute fix into a permanent hole; the composer must enforce the one-versus-two clearing-actions cardinality structurally, not by convention."
    - "NO BYPASS IN THE OUTPUT. The emitted text of every refusal must contain no skip flag, no --no-verify, and no environment-variable name that disables the guard. A blocking gate that documents its own off switch at the moment of maximum frustration is an advisory gate."
    - "Every clearing action must be phrased as something the reader does to the CODE (drive the behaviour through the way in; give the unit a way in; add the automation invocation; correct the invocation), never as something they do to the guard or to the AC record."
    - "Emit a link to the BO-2900e-4 refusal-to-action table with every refusal, so the destination is reachable from the output as that AC requires."
delivers_to:
  agent: documentation-expert
  contract: "The four emitted refusal texts and their { cause, item, missing_side, clearing_actions } records — quoted verbatim by the BO-2900a-4, BO-2900b-4 and BO-2900d-4 guides and indexed by the BO-2900e-4 table, so the documentation paraphrases nothing."
expects_from:
  ac_id: BO-2900c-1
  contract: "The four finding records the causes are derived from: BO-2900a-1's and BO-2900a-3's eligibility verdicts, BO-2900b-1's uncalled_capability_finding and BO-2900c-1's stale_invocation_finding, each already carrying the item, the surface/unit and the site."
test_spec:
  - name: test_direct_import_refusal_names_item_missing_side_and_single_action
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Drives the real guard into the direct-import refusal over a fixture and asserts against the TEXT IT EMITTED that it names the code under proof, the un-entered way in, the proof side as missing, and exactly one clearing action."
  - name: test_no_way_in_refusal_is_the_only_one_offering_two_actions
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Drives the guard into all four refusals in turn and asserts the emitted text offers two clearing actions for the no-way-in cause and exactly one for each of the other three — the asymmetry asserted as a set, not per message."
  - name: test_uncalled_capability_and_stale_invocation_refusals_name_the_opposite_missing_sides
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Asserts the third refusal names the capability and the caller side, and the fourth names the script, the invocation site, the unregistered capability name and the capability side — the two are not interchangeable."
  - name: test_no_refusal_text_names_a_skip_flag_or_bypass
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Across all four emitted refusals asserts the absence of 'SKIP=', '--no-verify' and any disabling environment-variable name."
test_rationale: "Asserting that a message template exists in the source proves nothing about which template a run reaches — a cause wired to the wrong template, or to none, passes a template inventory and fails a real user. That is the identical failure this whole tree derives from, so putting a structural test on the remedy would be self-defeating. Every test therefore drives the real guard into the specific refusal over a real fixture and asserts against the text the run actually emitted. The second test is deliberately a whole-set assertion: the one-versus-two clearing-action asymmetry is the substance of the AC, and it is only visible when all four messages are compared in the same run."
