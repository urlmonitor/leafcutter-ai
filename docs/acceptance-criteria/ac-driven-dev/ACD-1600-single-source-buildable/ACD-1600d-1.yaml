criteria: |
  Given an AC whose it_requirements name a file target under a build-output or deployed location
    (for example scripts/workflows/plan-feature.js or a .claude/ path) that has a canonical
    package-source counterpart under templates/,
  When the pointer-quality check evaluates the AC,
  Then the target is flagged as pointing at a generated or deployed copy,
  And the check requires the AC to name the canonical templates/ source that is edited by hand,
  And the flag names both the deployed path and its expected canonical source.
