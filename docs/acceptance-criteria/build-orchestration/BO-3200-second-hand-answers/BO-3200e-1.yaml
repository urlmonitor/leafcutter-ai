notes: |
  SCOPE — THE VOCABULARY ALREADY EXISTS; USING IT DOES NOT. PR #565 introduced a status meaning
  "I could not perform my task" and made the workflow runtime refuse to count it as success.
  Neither is re-specified here. This AC is about the CHECK SITES: what a check may claim when
  the inspection behind it did not happen.

  THE FIRST TWO SCENARIOS TOGETHER ARE THE TEST, and neither works alone. Holding the subject's
  state constant and varying only whether the inspection succeeded is what proves the report
  follows the inspection rather than the fail-closed branch. A test of the failure case on its
  own passes on a check that reports "could not tell" for everything.

  THE THIRD SCENARIO IS THE OTHER DIRECTION, and it is where this differs from the existing
  guarantee GE-120a-1 — that one says a failed inspection must not report a clean pass. KI-BO-018
  records the mirror image: a failed inspection reporting a confident negative. Both directions
  are needed; a check that reports "could not tell" instead of a pass but still reports a
  substantive failure when it cannot look has half the guarantee.

  The observed shape, from KI-BO-018's reusable finding: the inspection failed for a transport
  reason, the surrounding error handling was fail-closed, and fail-closed was implemented as a
  substantive negative verdict rather than an unknown. The verdict then cost more than a halt —
  it misdirected the diagnosis, which is BO-3200e-1-i.

  BOUNDARY: AR-200 covers a specialist being equipped to record a verdict at all. This covers
  what the verdict may claim when the inspection behind it did not happen.

  IT-PO ENRICHMENT NOTE (2026-08-26). This AC's outcome vocabulary is the one three other ACs in
  these two trees reuse: BO-3100b-1 (snapshot could not be taken), BO-3200b-2-i (an action whose
  outcome could not be read) and BO-3200d-2-i (a result that could not be obtained). Those are
  different SITES with the same word. The reuse is stated in each of them and required here, so
  that a single value carries the meaning everywhere and the runtime's existing refusal applies
  to all of them without further work.
