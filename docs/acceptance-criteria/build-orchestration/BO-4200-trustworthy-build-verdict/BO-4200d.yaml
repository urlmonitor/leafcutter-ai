notes: |
  WHY THIS IS A REQUIREMENT AND NOT A NOTE ON BO-4200a. Because the cheapest way to
  satisfy a, b and c is to widen the existing gate in place, and the existing gate runs
  on every attempt of the producing loop. That implementation is correct against all
  three and destroys the reason the quick route exists — the trade BO-2400's own goal
  text is built on ("you stop paying big-job overhead for small-job work"). A
  requirement that is systematically violated by the cheapest implementation of its
  siblings has to be written down, or it will be discovered as a complaint about
  speed after the work has shipped.

  THE SECOND HALF IS ABOUT WASTE, NOT LATENCY, and they are easy to confuse. Placing
  the broad check after the producing loop but before the reading phase is not only
  cheaper for the run; it stops two specific costs the origin entry measured — a
  reading cycle spent on a branch that was already broken, and a delivery that reads
  as ready and is not. A placement that is fast but leaves either cost in place has
  met half of this record.

  NO NUMBER IS STATED, DELIBERATELY. "Once per run" is a shape; the budget, the
  ordering relative to each phase, and what to do when the broad check itself is slow
  are for the Business Analyst and the IT Product Owner. Stating a minute count here
  would fix an implementation at goal level and would be obsolete the first time the
  project's own checks get faster — which is itself active work (TQ-600).
