id: ACS-500g-5-i
components:
  - ac_store
readiness: approved
priority: high
title: "Re-running the sweep reports already-covered behavior instead of proposing a duplicate pattern"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a first sweep promoted the "row-level audit trail" behavior into a pattern
    and converted four ACs to reference it,
  When the sweep is run again over the same store,
  Then that behavior is reported as already covered, naming the existing pattern id,
  And no second pattern proposing the same behavior appears in the candidate list,
  And the four converted ACs are not counted as fresh occurrences that could
    re-qualify the behavior as a new candidate.

  Given a fifth AC has since been written that specifies the audit-trail behavior
    standalone,
  When the sweep runs again,
  Then that AC is reported as a conversion candidate for the existing pattern —
    not as evidence for a new pattern.
depends_on: [ACS-500g-5]
