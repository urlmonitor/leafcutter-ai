id: BO-100d-1b
components:
  - build_orchestration
readiness: approved
priority: high
title: "build-feature.md prose hard-blocks the drive before dispatch when the telemetry sink is unreachable"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Scenario 1 - the declared telemetry stream cannot be written
  Given /build-feature is invoked for an epic that has at least one ready ticket,
  And the install's telemetry location query prints exactly one absolute path,
    the declared telemetry stream (for example
    /home/dev/proj/debugging/logs/agent_telemetry.jsonl),
  And the pre-drive feedback-sink reachability probe attempts to append one probe
    line to that printed absolute path,
  When the append fails (for example the file at that path is not writable),
  Then no ticket-supervisor is dispatched for the epic,
  And the drive halts immediately at the pre-dispatch stage,
  And the operator is shown an actionable message that names the absolute path
    the location query printed,
  And that message states the remediation needed to make the stream writable,
  And no epic tickets are transitioned to in_progress.

  Scenario 2 - the install declares no usable telemetry location
  Given /build-feature is invoked for an epic that has at least one ready ticket,
  When the telemetry location query exits non-zero, or exits zero but prints
    nothing, or prints a path whose enduring log root no longer exists,
  Then no ticket-supervisor is dispatched and the drive halts at the
    pre-dispatch stage,
  And the probe does not fall back to the workspace-relative path
    debugging/logs/agent_telemetry.jsonl or to any other path,
  And the probe creates no file and no directory,
  And the operator message states that the telemetry location is not declared
    (or is stale) and that the remediation is to rebuild the install,
  And no epic tickets are transitioned to in_progress.
depends_on: [BO-100d, BO-100d-1, BO-100d-1a]
