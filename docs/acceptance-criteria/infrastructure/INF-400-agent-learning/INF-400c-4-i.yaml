criteria: |
  Given four shipped surfaces instruct an agent to emit a knowledge_captured
    event — the signoff skill's knowledge-capture section, and the knowledge
    emission sections of the product-owner, business-analyst, and it-po agent
    templates,
  And all four name debugging/logs/agent_telemetry.jsonl as the append target,
  When an agent follows any one of the four surfaces literally and emits a
    record,
  Then the record lands at the declared knowledge-emission sink from
    INF-400c-4, and at no other path,
  And that holds for all four surfaces in the same install, so no install ever
    runs with some agents emitting to one file and some to another,
  And it holds wherever in that install the agent is working: an agent
    following one of these surfaces from inside an isolated working directory
    and an agent following the same surface from the project root append to the
    same file, and the record the first one wrote is still there after its
    working directory has been removed,
  And no shipped surface carries a destination of its own. The sink is an
    absolute path fixed when the package was built into this project, so no
    name a surface could have written into it is correct in two installs — a
    surface that carries one is right only on the machine it was written on and
    wrong everywhere the package is shipped to. Where a surface tells an agent
    where to append, following it reaches the sink this install declares and
    not a file underneath the directory the agent happens to be standing in,
  And no shipped surface instructs an agent to append a knowledge_captured
    event to the operational telemetry stream,
  And the one place that surface text still discusses the telemetry stream —
    the paragraph in the signoff knowledge-capture section that records the
    producer/reader disagreement as unsettled and defers it to INF-400c-4 —
    describes it in the past tense as settled, naming what was settled, rather
    than continuing to tell a reader the question is open,
  And the instruction to emit remains best-effort: a surface states that a
    failed append is logged and the agent still returns its primary output.
