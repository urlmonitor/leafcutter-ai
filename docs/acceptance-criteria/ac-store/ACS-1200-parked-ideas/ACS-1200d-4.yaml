criteria: |
  Given docs/how-to/ac-traceability-store.md,
  When it is read after this feature has landed,
  Then it contains a procedure for parking an idea that names the two fields to
    set, states that the reason must be written, and states that no check is to
    be skipped to record it,
  And a procedure for un-parking that states both halves — remove the marker and
    restore the parent's child list — must land in the same change, and that the
    idea should be broken down as part of that decision,
  And it states the thing not to do: repairing a parked record's child list
    without a decision to un-park the tree,
  And it states what a reader will see for each state in the store-health
    report, so a parked tree and a broken one can be told apart from the report
    alone,
  And any instruction anywhere in the documentation telling a reader to skip the
    parent-back-link check in order to record an idea is removed rather than
    left beside the new procedure.
