notes: |
  WHY REPETITION IS ITS OWN BEHAVIOUR AND NOT AN "AND" ON BP-1500g-1. Two
  distinct failure shapes only appear on a later run. The first is state: a
  repair that works because the first build found the project in a particular
  condition, and stops working once the build has changed that condition. The
  second is the upgrade: the package's own idea of which locations it claims is
  data that changes between versions, so a place that was the adopter's on
  Monday can be claimed on Tuesday by a version that knows about one more
  historical location. Neither is reachable by running the build once, which is
  what a test written from BP-1500g-1 alone would do.

  THE UPGRADE CLAUSE IS THE ONE MOST LIKELY TO BE DROPPED AT ENRICHMENT because
  it needs two package versions in the fixture and the other clauses do not.
  It is also the clause that matches how the defect was actually met: an adopter
  who had been building successfully for months and then was not. Keep it.

  DO NOT SATISFY THIS BY FREEZING THE TREE. The obvious way to make everything
  survive every run is to stop the build changing anything it has already
  written. BP-1500g-3-i exists to make that a failure, and it should be read as
  part of this AC's done-condition rather than as an optional extra.
