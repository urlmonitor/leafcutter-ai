notes: |
  THIS LEAF STATES ITS OWN DERIVATION AND DOES NOT INHERIT AR-200b-1's.

  AR-200b-1's obligation comes from the template BODY: prose that names a
  specific tool as the way to carry out a step the template marks mandatory. It
  therefore needs a detector that distinguishes an instruction from ordinary
  English, and it carries a control case proving benign prose does not fire.

  This leaf's obligation comes from a STRUCTURED DECLARATION: a non-empty grant
  of abilities in the agent's own definition. There is no prose to match, no
  ambiguity between a tool name and an English word, and no control case of that
  kind to write. An agent either declares a grant or it does not. That makes this
  the cheaper and more reliable half of AR-200b's promise, not a variant of the
  harder one.

  WHY THE MUTATING-TOOLS SCOPE IS DELIBERATELY NOT INHERITED. AR-200b-1 carries
  the constraint "SCOPE TO MUTATING TOOLS", justified in its own words: "A body
  naming a read-only tool it does not hold is also a bug, but a harmless one: the
  agent cannot proceed, loudly." That line exists and was read before this leaf
  was authored. Its reasoning is sound for the case it was written against and
  false for this one, and the measurement is what makes the difference:

    - The tool by which an ability is invoked is not state-mutating.
    - An agent lacking it does NOT stop. It falls back to raw text search and
      proceeds -- successfully, silently, and expensively.
    - Over roughly 90,000 recorded agent actions: 33 ability invocations, all
      from the 6 agents that hold the tool, against about 32,600 fallbacks to
      raw text search, including for questions a shipped ability already
      answers.

  So the premise "the agent cannot proceed, loudly" is exactly inverted here: the
  agent proceeds quietly. AR-200b-1's constraint selects for the failures an agent
  cannot hide; this is a failure an agent cannot help but hide. Applying that
  scope would exclude the 25-agent population entirely, which is why the scope is
  restated at the leaf rather than borrowed.

  Consequence for the L1: AR-200b's own criteria derived the obligation from
  "instructions [that] name a specific tool as the way to carry out a mandatory
  step" -- wording that does not reach a declaration-sourced obligation. The L1
  was amended on 2026-09-30 to admit both sources, recorded in its amended_by,
  rather than silently widening this child past its parent's stated promise.

  GRANT THE CAPABILITY, DO NOT DELETE THE GRANT. AR-200b's binding constraint in
  its third form. The cheapest way to make this criterion pass is to empty the
  ability declarations of the 25 agents, which satisfies the comparison and
  leaves every one of them doing raw text search for answers an ability already
  holds. The grant encodes the intended route; it is the thing to preserve.
