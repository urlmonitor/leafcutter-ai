notes: |
  Prove by constructing two real runs whose populations genuinely differ — add a
  passing covering test for one unproven record between the runs — and check the
  stated delta against the arithmetic. A test that asserts a "change" field exists
  in the report passes on a hard-coded zero.

  The explicit no-change statement matters: an omitted comparison is
  indistinguishable from a comparison that failed to compute, which is the same
  silence-equals-pass problem TQ-400a-4-i addresses on the sweep side.

  The final clause is a seam requirement against TQ-400a-4's inventory: reading
  the stored inventory is what stops the trend surface becoming a third
  independent reader of the store, after the oracle and the sweep.

  IT-PO ENRICHMENT NOTE (2026-08-17). The two-sided delta is called out explicitly
  in it_requirements because the criteria say "how many became proven and how many
  lapsed" while a net figure would satisfy a careless reading — and a net figure
  renders the worst possible state (equal numbers moving both ways) as "no change".
