estimated_complexity: S
it_requirements: |
  - TARGET FILE (doc-only): the ONLY file touched is docs/how-to/finalize-feature.md
    (change_target: docs). No source, workflow, agent-template, test, or schema
    change — this AC updates narrative to match already-implemented behavior.
  - STEP 0 EDIT (~L32): the Step 0 "Capture baseline" table row must stop presenting
    "triage will classify all post-merge failures conservatively as regressions" as
    the current consequence of a failed/unavailable baseline capture. Reframe it so
    an unavailable baseline (baseline_failures null) with post-merge failures triggers
    the targeted per-test rerun against main HEAD that recovers a baseline
    (FIN-100c-4/5/6), and the conservative all-regressions path is only the
    rerun-unavailable fallback (FIN-100c-9).
  - STEP 3 EDIT (~L35 row + test_regression halt section ~L68-99): describe the
    targeted rerun of ONLY the failing test IDs against main HEAD (after the same
    build/deploy step, for deploy parity), the recovered baseline supplied to triage
    in place of null, pre_existing-vs-regression classification over that recovered
    baseline, and that only genuine regressions (tests that pass on main) halt
    finalization.
  - FALLBACK NARRATIVE: describe the conservative all-regressions halt as the NARROWED
    rerun-unavailable fallback (main-HEAD checkout or build/deploy step fails per
    FIN-100c-9) and state that this fallback lists each failing test with its
    modified_by_branch flag so a human can adjudicate which failures the branch touched.
  - NO STALE PASSAGE: remove or rewrite any remaining passage that presents
    "null baseline -> all post-merge failures are regressions -> halt" as the CURRENT
    Step 3 behavior, including the misclassification-troubleshooting text (~L91-99)
    that attributes a false regression to a transient baseline failure — that guidance
    must reflect the recovered-baseline / narrowed-fallback model.
  - ACCURACY (no invention): the rewritten narrative must match the behavior actually
    implemented in templates/workflows-js/finalize-feature.js and
    templates/agents/test-failure-triage.md; describe only FIN-100c-4..9 behavior,
    invent nothing beyond it.
  - FRONTMATTER: bump the doc's `last_updated` frontmatter field to the edit date so
    the check-doc-frontmatter hook passes.
test_spec:
  - name: test_howto_step0_drops_blanket_regression_as_current
    target_dir: unit_tests/docs/
    framework: pytest
    type: unit
    description: "The Step 0 narrative in docs/how-to/finalize-feature.md no longer presents an unavailable baseline as causing triage to classify all post-merge failures conservatively as regressions as the current behavior (the stale ~L32 phrasing is gone or reframed as the rerun-unavailable fallback)."
  - name: test_howto_step3_describes_targeted_rerun_recovered_baseline
    target_dir: unit_tests/docs/
    framework: pytest
    type: unit
    description: "The Step 3 row and the test_regression halt section describe the targeted per-test rerun against main HEAD that recovers a baseline and distinguishes pre_existing from regression when the Step 0 baseline is null (mentions the main-HEAD rerun of the failing test IDs and the recovered baseline)."
  - name: test_howto_conservative_halt_narrowed_to_fallback_with_modified_by_branch
    target_dir: unit_tests/docs/
    framework: pytest
    type: unit
    description: "The guide describes the conservative all-regressions halt as the narrowed rerun-unavailable fallback and states it surfaces each failing test's modified_by_branch flag for human adjudication."
  - name: test_howto_has_no_stale_null_baseline_all_regressions_as_current
    target_dir: unit_tests/docs/
    framework: pytest
    type: unit
    description: "No remaining passage in the guide presents the old 'null baseline -> all post-merge failures are regressions -> halt' behavior as the current Step 3 behavior (including the misclassification-troubleshooting text ~L91-99)."
