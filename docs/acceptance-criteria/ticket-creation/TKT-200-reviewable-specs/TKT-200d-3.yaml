criteria: |
  Given the analysis step has revised 2 AC files after documentation was generated,
    and the regeneration step has not yet run,
  When the pipeline attempts to advance to the review checkpoint,
  Then it blocks advancement with a message identifying the 2 stale artifacts,
  And it states which AC files changed that invalidated those artifacts,
  And the pipeline does not reach the review checkpoint until regeneration completes.
