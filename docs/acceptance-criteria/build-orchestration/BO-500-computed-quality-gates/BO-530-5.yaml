notes: |
  User-originated (BrainCandy) process fix. Motivated by a real escape: ruff
  lint failures on new files where pre-commit did not run repo-ruff (the
  worktree pre-commit gap), so the lint errors only appeared in CI. This gate
  moves that detection into the python sign-off, independent of pre-commit.
