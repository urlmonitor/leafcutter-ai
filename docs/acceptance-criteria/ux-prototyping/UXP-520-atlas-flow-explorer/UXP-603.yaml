estimated_complexity: S
it_requirements:
  - "FlowStepNode in leafcutter-web/components/flows/flow-nodes.tsx must render a compact '{acDone}/{acCount} ACs' pill tinted by WORK_STATUS_TONE of the node's derived status."
  - "The node's derived status must roll up from AC work_status via rollupStatus in leafcutter-web/lib/data/flows.ts (all done -> done/green; some done -> in_progress/amber; none done -> not_started/grey), and acDone must be computed in buildFlowGraph (leafcutter-web/lib/data/graph.ts) as the count of referenced ACs with work_status done."
  - "The pill tint must follow the derived aggregate status, never a hand-set colour."
