id: GE-125d-2
components:
  - security_scanner
  - commit_guardian
title: "A caller can tell a reduced run from a clean one without reading the message or the exit code"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a throwaway git repository whose staged set is exactly two files —
    "docs/retrospectives/2026-08-19-incident.md" carrying 2 opaque
    credential-shaped values and
    "templates/skills/example-skill/scripts/helper.py" carrying 1, both under
    locations to which the check applies reduced scrutiny, placed there
    deliberately because the reduction is the subject — and no other file,
  When the staged set is checked on the path a real commit takes,
  Then the run's result carries a reduction record that a caller reads without
    parsing English: a total of 3 findings withheld, and for each of the 2 files
    its repository-relative path, its own withheld count, and the stable name of
    the reduction that applied,
  And the run's exit status is success — indistinguishable from the exit status
    of a run over the same two files with no credential-shaped content in them,
  Because the exit status structurally cannot carry this distinction: the whole
    point of the reduction is that it produces no findings, so a reduced run and
    a clean run both succeed. A caller holding only the exit code cannot tell
    them apart, and a caller matching the message text is reading prose that is
    free to be reworded.

  Given a staged set of two files on locations where no reduced scrutiny applies
    — "src/app.py" and "leafcutter-web/app/page.tsx", chosen because both are
    measured today as ordinary reported paths — containing no credential-shaped
    content,
  When the staged set is checked on the path a real commit takes,
  Then the run's result carries the same reduction record, with a total of 0 and
    an empty list of files,
  Because the record must be present on every run, not only on reduced ones: a
    caller that sees no record cannot tell "nothing was withheld" from "this
    check does not report withholding", and treating absence as a reading is how
    a caller silently keeps trusting a check that stopped answering. The
    human-facing counterpart is the opposite and is governed by GE-125d-3 —
    a person is shown nothing on a run where nothing was withheld.

  Given the 30-file reduced run described in GE-125d-3, in which the printed
    notice lists only some of the affected files,
  When a caller reads the reduction record from the same run,
  Then the record carries every affected file and the full total, with nothing
    truncated,
  Because the abbreviation in the printed notice is a choice about what a person
    can read, and it must never become a loss of information for anything that
    consumes the result.
