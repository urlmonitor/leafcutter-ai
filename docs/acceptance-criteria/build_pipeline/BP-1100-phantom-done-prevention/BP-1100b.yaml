title: "Workflow JavaScript is verified by behavioral-replay tests, not string scans"
component: build-pipeline
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a ticket modifies JavaScript workflow code under scripts/workflows/ or
  templates/workflows-js/,
  When the ticket is classified and its tests are authored,
  Then the ticket is never classified as docs-only or config-only (the test-writer
  phase is never skipped),
  And the tests execute the modified function in a mocked context and assert its
  runtime behavior (e.g. the dispatched agent type, fail-closed handling of bad
  input, the presence of a required flag) rather than merely scanning the source
  text for expected strings.
