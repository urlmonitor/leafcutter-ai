notes: |
  Requested by BrainCandy 2026-10-15 (KI-BO-20260930). Cause (3) of the KI as triaged on
  2026-10-12, confirmed: :1384-1385 stage by directory, and the guard's first allowance
  (:1391, "It starts with 'docs/acceptance-criteria/'") means every dirty AC file in the
  worktree passes the guard. This record is the reason the second scenario says "a ticket or
  an acceptance criterion alike".

  OVERLAP WITH BO-4500a-5-iv, stated so the IT-PO can reconcile rather than build twice.
  BO-4500a-5-iv (todo, approved) requires the closing commit to go through the shared commit
  step naming exactly the records the workflow changed, with two unrelated-epic tickets
  excluded. It explicitly scopes OUT "whether step 3.5 edits unrelated epics' tickets at all".
  This record pins the same commit-content outcome from the Step 3.5 side and adds two things
  BO-4500a-5-iv does not: unrelated uncommitted edits survive untouched, and an out-of-set AC
  path aborts the commit. Whichever is built first should satisfy both; this record is
  phrased to hold whatever commit mechanism is in use.

  Parent records: if the closure legitimately edits a structural parent of a closed AC (per
  the store's covered_by convention), that parent's file is one of "the closed records' own
  files" for this purpose and is named in the run's list (BO-400e-3-vi). Its status still may
  not change (BO-400e-3-iii).
