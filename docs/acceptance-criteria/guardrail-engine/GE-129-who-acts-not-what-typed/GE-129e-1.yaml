criteria: |
  Given the package's shipped surfaces -- project rules, agent definitions, skills, workflow
    scripts and the prompts they send, how-to, reference and architecture documents including
    diagrams, and the messages the guards print -- and a declared list of historical records that
    are exempt, each exemption carrying a stated reason,
  When the retired-token check runs,
  Then it fails, naming file and line, for every occurrence of COMMIT_AGENT_MODE on a shipped
    surface not covered by an exemption, and passes when there is none,
    And run against the tree as it stood at GE-129's authoring it names an occurrence in each of:
    the project rules' Commit Delegation section, section 3.2.1 of the agent conventions, the
    commit specialist's Step 4, the building-epics gated-agent table, the ac-audit skill, the
    fast-lane-ship commit prompt, the fast-lane-build how-to, the agent delivery workflows
    document, the fast lane component and sequence diagrams, and the commit guard's own refusal
    message,
    And adding one occurrence to one shipped surface adds exactly one named finding.
