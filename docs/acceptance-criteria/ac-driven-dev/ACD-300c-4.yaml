notes: |
  Item 1 of the EPIC-RightJobRightAgent follow-up (2026-10-16). Today the final
  apply-approval step in templates/workflows-js/plan-feature.js (~L3235-3244) is a
  status-checker agent told to edit YAML; it bypasses scripts/ac_store/approve_acs.py and
  so skips its append-only amended_by entry, its write-then-reparse check and its
  idempotent no-op. For the IT PO: approve_acs.py today accepts only --goal or a single
  --ac and has no priority option (see its --help), so either the step gains an id-list and
  a priority option, or priority is written by a second deterministic step; the criteria
  only require that no agent edit does it. plan-feature.js is over its size limit and must
  not grow (GE-127b-1).
