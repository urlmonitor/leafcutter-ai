criteria: |
  Given the design code-smell catalogue (the review-for-design-code-smells bucket),
  When its list of named smells is enumerated,
  Then it contains exactly these six named Fowler smells and no others:
    Global Data, Mutable Data, Feature Envy, Data Clumps,
    Primitive Obsession, Shotgun Surgery,
  And each entry is a recognised Martin Fowler code smell (Refactoring, 2nd ed),
  And no entry is a vague or generic warning.
