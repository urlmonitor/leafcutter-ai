  - path: docs/testing/test-angles.md
    relationship: describes
    status: exists
    relevance: >-
      The documented boundary between work that genuinely cannot carry a covering
      test and work that merely has not got one — the judgement the entry must
      equip a reader to make.
  - path: scripts/commit_guardian/_ac_schema_validators.py
    relationship: implements
    status: exists
    relevance: >-
      IT-PO ADDITION. ENFORCEMENT POINT 1, AND IT POINTS THE OPPOSITE WAY.
      Verified 2026-08-18 at ~:515-540: an approved, not-yet-done, leaf CODE AC
      carrying test_required: false is REJECTED outright ("a code AC always needs
      tests"), and test_required: false alongside a non-empty test_spec is
      rejected as a contradiction. The reconciled boundary the entry must state is
      a statement about THIS rule as much as about the check-time one.
  - path: scripts/commit_guardian/check_done_proof.py
    relationship: implements
    status: exists
    relevance: >-
      IT-PO ADDITION. ENFORCEMENT POINT 2 AND 3, AND THEY POINT THE OTHER WAY.
      Verified 2026-08-18 at :463 — `if data.get("test_required") is False:
      continue` — the whole-store sweep honours the declaration UNCONDITIONALLY on
      any done record, with no reason required; :491-495 is the change-scoped CI
      mode doing the same. 37 done records in the store carry it today, so the two
      layers are in live disagreement about those 37 records.
assigned_agent: documentation-expert
estimated_complexity: M
it_requirements:
  - >-
    THIS ENTRY CARRIES A RECONCILIATION OBLIGATION, NOT ONLY A DESCRIPTION — THE
    DEFINING CONSTRAINT ON THIS RECORD. Two shipped layers disagree about the same
    records today, verified 2026-08-18. (a) scripts/commit_guardian/
    _ac_schema_validators.py (~:515-540) REJECTS test_required: false on an
    approved, not-yet-done, leaf CODE AC, and rejects test_required: false
    alongside a non-empty test_spec as a contradiction. (b)
    scripts/commit_guardian/check_done_proof.py:463 HONOURS test_required: false
    unconditionally on ANY done record — `if data.get("test_required") is False:
    continue` — with no reason required; :491-495 does the same in the
    change-scoped CI mode. 37 done records in the store carry it. The entry MUST
    state, in one sentence a reader can apply to the single record in front of
    them, WHICH RECORDS THE RECONCILED RULE LEAVES ELIGIBLE. The boundary the two
    layers currently imply is: non-code records, and records already done. An
    entry that documents either layer alone leaves a record that is legal to one
    layer and illegal to the other, and those 37 records stay in dispute — which
    is the disjoint-vocabulary failure this repo has already shipped once.
  - >-
    NAME ALL THREE ENFORCEMENT POINTS AND SAY WHICH ONE GATES WHAT.
    _ac_schema_validators.py (~:515-540) gates AUTHORING; check_done_proof.py:463
    gates the WHOLE-STORE SWEEP; check_done_proof.py:491-495 gates the
    CHANGE-SCOPED CI mode. A reader who does not know which layer will meet their
    record cannot predict what will happen to it. Each of the three must point at
    this entry rather than carry its own account of the rule.
  - >-
    THE RECONCILED BOUNDARY MUST BE THE ONE TQ-400e-3 ACTUALLY DELIVERS. If the
    delivered code narrows or widens eligibility relative to the boundary above,
    the entry follows the delivery and the divergence is raised against TQ-400e-3
    — never smoothed over. This entry is a description of a shipped rule, not a
    proposal for one.
  - >-
    TARGET DOCUMENT AND SITE — docs/reference/ac-schema.md, extending the EXISTING
    test_required and test_rationale entries into one coherent exemption account.
    Do NOT introduce a third field, a new allowlist, a parallel declaration
    syntax, or a new document: TQ-400e-3's it_requirements already rule that
    minting a second mechanism is the primary risk, and a second DOCUMENT is the
    documentation-layer form of the same defect. The file is 846 lines and already
    over the 300-line advisory budget (check_doc_length, severity warn) — a
    further reason to complete the existing entries rather than add a section.
  - >-
    STATE EXACTLY TWO FIELDS AND SAY SO. The reader must be able to conclude that
    test_required and test_rationale are the whole mechanism and that no third or
    parallel field is involved. That negative statement is load-bearing: it is what
    stops the next implementer inventing one.
  - >-
    THE REFUSAL RULES MUST BE STATED AS A CLOSED SET WITH THE CONSEQUENCE ATTACHED:
    absent, empty and whitespace-only reasons are refused; the reason's WORDING is
    never judged for quality; and a refused record is reported unproven on exactly
    the same terms as one carrying no declaration at all, and is demotable like any
    other — not parked in a separate state. All four facts, explicitly.
  - >-
    STATE THAT NOTHING IS WRITTEN TO AN EXEMPT RECORD. TQ-400e-5 requires an
    honoured exemption to be re-derived each run with the record's file left
    byte-identical. A reader who expects an acknowledgement to appear on the record
    and finds none will assume the exemption was not registered.
  - >-
    DESCRIBE TODAY AND TOMORROW AS TWO DISTINCT STATES, WITH THE MEASUREMENT DATED.
    37 done records carry a reasonless declaration as of 2026-08-17. The entry must
    present them as a BACKLOG — non-compliant but live — not as compliant, and must
    say what happens to them when the hardened rule takes effect. An entry written
    purely against the hardened rule misdescribes the store as it stands.
  - >-
    THE HONOUR/REFUSE ACCOUNT MUST BE WRITTEN AS EXTRACTABLE EXAMPLES. Give the
    valid exemption form and the reasonless form as records a reader could paste,
    so the round-trip criterion can be checked by feeding them to the real check
    rather than by re-reading the prose.
  - >-
    SINGLE STATEMENT, ENFORCED BY LINKING AND BY CHECKING FOR RIVALS.
    docs/how-to/done-proof-enforcement.md currently describes the unguarded
    check-time behaviour for readers; it must be updated to point here in the same
    change. Scan for any other doc that states an exemption rule and convert it to
    a link. Two accounts of who may be exempt is the same drift in prose that the
    three enforcement points have in code.
  - >-
    SEQUENCE AFTER TQ-400e-3, TQ-400e-4 AND TQ-400e-5 LAND. The reconciled
    boundary, the refusal set and the no-write guarantee are all claims about
    shipped behaviour.
  - >-
    The file is a tracked reference subject to check_doc_frontmatter and
    check_doc_links; keep both passing in the same commit.
delivers_to:
  - agent: documentation-expert
    ac_id: TQ-400d-5
    contract: >-
      The single reconciled statement of which records may legitimately carry an
      exemption, published in docs/reference/ac-schema.md. TQ-400d-5's triage guide
      LINKS here for the "legitimately absent from the pile" clause and must not
      carry its own account of who may be exempt.
expects_from:
  - ac_id: TQ-400e-3
    contract: >-
      The honoured-exemption outcome as delivered — the two fields it reads, the
      reported outcome it produces, and the reconciled boundary of which records
      may legally be exempt. This is the boundary the entry states; if the
      delivered boundary differs, the entry follows the delivery.
  - ac_id: TQ-400e-4
    contract: >-
      The refusal rule as delivered — the reason shapes that refuse, the fact
      that content is never judged, and that a refused record is unproven and
      demotable rather than parked in a separate state.
  - ac_id: TQ-400e-5
    contract: >-
      The stability guarantee: an honoured exemption is re-derived each run and
      nothing is written to the record, which the entry must state so no reader
      expects an acknowledgement to appear on the record.
test_spec:
  - name: test_tq400e6_entry_states_two_fields_the_refusal_set_and_the_reconciled_boundary
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      Assert the entry names exactly test_required and test_rationale and states
      that no third field is involved; states all four refusal facts (absent /
      empty / whitespace-only refused, wording never judged, refused record
      unproven on the same terms, refused record demotable); states that nothing
      is written to an exempt record; and states the reconciled eligibility
      boundary as a rule applicable to one record, naming all three enforcement
      points.
  - name: test_tq400e6_stated_boundary_partitions_the_real_store_the_way_both_layers_do
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      THE RECONCILIATION, MADE FALSIFIABLE. Over the REAL store, derive three sets:
      the records _ac_schema_validators.py would reject for carrying
      test_required: false, the records check_done_proof.py:463 currently honours,
      and the records the entry's stated rule declares eligible. Assert the entry's
      rule is consistent with both layers — no record it calls eligible that the
      authoring validator would reject, and no record it calls ineligible that the
      sweep silently honours without the entry saying so is backlog. A one-layer
      check passes on an entry that documents only half the disagreement.
  - name: test_tq400e6_documented_exemption_forms_are_honoured_and_refused_by_the_real_check
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: reachability
    description: >-
      PRODUCTION ENTRY POINT, BOTH POLARITIES. Lift the valid and the reasonless
      exemption examples out of the entry, write them into a temp store, and run
      the sweep through its real invocation: the valid form must be reported
      exempt, the reasonless form must be refused and reported unproven
      (must_block). This is the round-trip criterion — the rules the entry states
      are the rules the check applies — and it is not satisfiable by any
      prose-only assertion.
  - name: test_tq400e6_todays_backlog_description_matches_the_real_store
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      Walk the actual docs/acceptance-criteria/ tree, collect the done records
      carrying test_required: false with no non-empty test_rationale (37 as of
      2026-08-17), and assert the entry's today-versus-hardened statement matches
      what the store actually contains — the figure is dated, and those records are
      characterised as backlog rather than compliant. A hand-built fixture would
      reproduce the author's belief about the store instead of measuring it.
test_rationale: >-
  change_target is docs, and the cheapest satisfying artifact here is two field
  rows and a sentence — which would answer none of the three questions an author of
  an exemption actually has. The clause that makes this AC hard is the
  reconciliation, and it is the clause an author writing to satisfy a presence
  check will omit, so it gets the seam entry: derive both layers' behaviour over
  the REAL store and assert the entry's stated rule is consistent with both. A
  test that read only one enforcement point would pass on an entry documenting only
  half the disagreement, which is the status quo. The round-trip clause is fully
  mechanical and gets a real-invocation entry in both polarities, because "the
  rules the entry states are the rules the check applies" is exactly the claim a
  parallel description satisfies textually and fails behaviourally. NOT
  MECHANICALLY TESTABLE: "they can determine, for a record in front of them,
  whether it may legally carry an exemption" is comprehension. Its proxy is two-
  part and deliberately so — the criterion entry asserts the boundary is stated as
  a rule applicable to ONE record (not as a narrative about two layers), and the
  seam entry asserts that rule is TRUE of both shipped layers. Applicability plus
  correctness is the checkable half; whether a given reader applies it correctly is
  not observable. The today-versus-tomorrow clause is measured against the live
  store rather than asserted, because 37 is a fact about the repository that will
  move, and an entry whose stated figure has silently drifted is one a reader
  learns to distrust.
