criteria: |
  Given the fail-closed isolation gate and the two authoring entry points are implemented,
  When a contributor opens the build-orchestration architecture documentation,
  Then the isolated-authoring sequence diagram shows both the lean entry point and the full
    planning pipeline entering the same workspace setup-and-confirmation step,
  And it shows which participant performs the workspace setup and that this participant is
    permitted to run repository commands,
  And it shows the confirmation decision with both outcomes -- confirmed isolation
    continuing to the first authoring stage, and unconfirmed isolation halting the run
    before any authoring agent is dispatched,
  And it shows that after a halt no interaction reaches the invoking checkout.
