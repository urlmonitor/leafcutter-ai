criteria: |
  Given the acceptance-criteria store,
  When the build-backlog dataflow is exported,
  Then it emits a JSON document listing every leaf (L2/L3) acceptance criterion whose
    work_status is not done, each node carrying its title, component, level, readiness,
    test_required, parent, depends_on, unmet dependencies, and a ready flag,
  And it includes a dependency-ordered build_order (every prerequisite before its
    dependents) and totals for todo/ready/blocked leaves,
  And the export is deterministic — the same store state yields byte-identical JSON so
    the artifact can be committed and re-generated with a clean diff.

  Given a target AC id is supplied,
  When the dataflow is exported in connected scope,
  Then the nodes and build_order are restricted to that AC's connected build set
    (its subtree plus unmet-dependency closure), readiness-agnostic.

  Given a non-existent AC id in connected scope,
  When the export runs,
  Then it fails with a clear error naming the missing id rather than writing an empty
    artifact.
