criteria: |
  Switch the standards on today without fixing thousands of things first.

  A project that takes up this way of working part-way through its life meets a
  wall. Every standard it would like to hold new work to is already broken in
  hundreds of places, so switching one on stops all work, and leaving it off
  protects nothing. Both options are bad and the second is the one everybody
  picks, so the project keeps accumulating exactly the debt the standard exists
  to prevent. After this goal a codebase that was never built under these
  standards can hold new work to them from its first day. What is already there
  is tolerated and stays workable. What is added or changed from now on is held
  to the standard. The tolerated backlog is a counted number that can only go
  down. You are shown what adopting will cost before you commit to it, you take
  the standards up one at a time at whatever pace suits you, and you can put one
  back down without unpicking the rest.
