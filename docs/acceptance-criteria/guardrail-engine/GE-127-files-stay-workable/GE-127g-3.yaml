delivers_to: null
expects_from:
  - ac_id: GE-127g-1
    contract: >-
      The declared set of locations and the single membership test over it. This record
      constrains that one test's extent; it introduces no second test and no deny-list
      alongside it.
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Membership must be decided by the document's repo-relative path against the declared
    paths, and by nothing else — not by its basename, not by its filename suffix, not by
    its frontmatter, not by any resemblance to a generated document. A declared path
    ending in / matches documents beneath it at any depth; a declared path not ending in /
    matches that one document exactly."
  - "The basename comparison at _doc_length_ratchet.is_excluded() (line 207,
    Path(filepath).name in excluded_files) must be REMOVED, and the excluded_files key
    removed from the doc_length section in the same change. It is not a hypothetical
    hazard: measured 2026-10-09, twelve hand-authored README.md documents under docs/ are
    exempt today on the strength of one entry intended for one file."
  - "THE PRICE, AND IT MUST NOT BE SOFTENED. Removing basename matching brings those 12
    hand-authored README.md documents into scope. Two are already over the limit —
    docs/agents/README.md at 569 lines and docs/testing/README.md at 342 (measured
    2026-10-09, raw counts) — so both are grandfathered by the growth ratchet and neither
    may grow again. That is this record's intended effect. Do not add a path entry, a
    basename entry, or a raised limit for either of them."
  - "No second list. The declared set-aside locations are the only mechanism; a deny-list
    of hand-authored paths alongside them would satisfy the named-document arms while
    leaving the boundary undefined, so the next hand-authored document in a resembling
    location is exempt again."
  - "The judged population across docs/ must fall by exactly the number of documents
    inside the declared locations. This is a property of one membership test over one
    declared set, and it must hold without enumeration — if the implementation needs a
    list of affected documents to make it true, the test is in the wrong place."
  - "Must handle errors gracefully per the project error handling policy."
test_spec:
  - name: test_hand_authored_document_with_the_generated_suffix_is_still_judged
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: templates/scripts/commit_guardian/check_doc_length.py
    description: >-
      Arm 1, and the entry that settles the parent's first design question mechanically.
      A hand-authored document OUTSIDE the declared directory, above the limit, whose
      filename carries the same suffix the generated documents carry (.card.md). Stage it
      and invoke the gate; assert it refuses and that the document it names is that one.
      This is the only entry a suffix-based membership rule fails, so it is what makes
      the directory-over-suffix decision falsifiable rather than argued. No build.py
      spawn and no layout fixture, so no marker.
    must_catch:
      - "declare membership by the filename suffix the generated documents carry instead of by their location"
      - "treat a filename resemblance as membership of the declared class"
  - name: test_declared_filename_does_not_exempt_the_same_name_elsewhere
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 2, the present mechanism's own failure mode rather than a hypothetical one. A
      hand-authored document above the limit, outside every declared location, whose
      filename is one the declaration lists as set aside AT ANOTHER location. Assert the
      gate refuses and names it. Use the real shape: a README.md outside a declared
      location while a declared entry names a README.md inside one. No marker.
    must_catch:
      - "keep the present mechanism and match a declared entry against any document sharing its filename at any depth"
      - "leave excluded_files in place alongside the new declaration"
  - name: test_one_over_limit_document_per_hand_authored_directory_is_refused_and_named
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: >-
      Arm 3. Stage one over-limit hand-authored document inside each directory under docs/
      that holds hand-authored documents, derived from the repository's own tree at run
      time rather than from a hardcoded directory list, and assert the gate refuses and
      names ALL of them. Not a census — one document per directory, per the record's own
      scope note. No marker.
    must_catch:
      - "declare the whole of docs/ set aside"
      - "widen a declared directory entry to a parent of itself"
  - name: test_judged_population_falls_by_exactly_the_declared_locations_size
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 4, the closing clause and the only one that stays true as the repository grows.
      Over one staged set spanning the whole of docs/, run the gate twice — once with the
      declaration empty and once with it populated — and assert the judged figure falls by
      exactly the number of staged documents inside the declared locations, computed from
      the tree rather than pinned, and that every document reported as set aside lies
      inside a declared location. Reads the two figures GE-127g-2 requires. No marker.
    must_catch:
      - "keep the present mechanism and match a declared entry against any document sharing its filename at any depth"
      - "satisfy the named-document arms by adding a deny-list of hand-authored paths alongside the declared set-aside locations"
      - "declare the whole of docs/ set aside"
test_rationale: >-
  Every arm here is an ordinary commit that must be REFUSED with the refused documents
  NAMED, which is the only shape a disabled gate cannot satisfy — and this is the record
  where the behavioural rule bites hardest, because the tempting test is one that asserts
  a pattern does not match a path. That is a test of a pattern, not of a gate: it passes
  on a gate that never consults the pattern and on one that never runs.
  The first entry is the load-bearing one and is why it is specified first. The record's
  own notes identify mutation (1), declaring membership by suffix, as the mutation that
  settles the directory-versus-suffix decision mechanically rather than by argument — so
  this entry is not a defensive extra, it is the falsifiability of a design decision the
  parent L1 made. Under the suffix rule it goes red and every other arm in this record and
  in GE-127g-1/-1-i stays green; that asymmetry is the evidence.
  The fourth entry is specified as a DIFFERENCE between two runs rather than as an
  absolute figure, for the reason the notes give: the first three arms name specific
  documents and a lucky implementation satisfies all three while exempting some fourth
  thing nobody tested, and a pinned absolute count goes stale as the repository grows.
  Computing both the expected fall and the directory list from the tree at run time is
  what keeps arms 3 and 4 alive after the next document is added.
  Markers: no entry requests shared_reference_layout and none spawns build.py, so all four
  sit outside the marker-routing mechanism; the deployed-layout proof is paid once by
  GE-127g-1's deployed entry. One note for the test author on fixture realism: arm 2 should
  use README.md specifically, because that is the live instance — twelve hand-authored
  README.md documents under docs/ are exempt today — and a synthetic filename would
  reproduce the shape while losing the evidence.
