id: UXP-700d-2-ii
title: "A real criterion stored beside the example set is still dispatchable"
component: ux-prototyping
components:
  - ac_store
  - ux_prototyping
level: L3
status: active
req_status: approved
work_status: in_progress
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a real acceptance criterion that is ready to be worked on and is stored in the same
    component namespace as the example criteria,
  When the store of work is scanned,
  Then that criterion is returned in the ready set,
  And it is not counted among the criteria set aside as example content,
  And the rule that set the example criteria aside did not depend on the component namespace
    they share with it.
depends_on:
  - UXP-700d-2
