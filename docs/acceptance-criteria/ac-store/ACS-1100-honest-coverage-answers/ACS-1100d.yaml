notes: |
  This is the L1 that stops the defect propagating. Reporting a denominator at
  the source (ACS-1100a) achieves nothing if the next tool in the chain drops it
  and prints "all clear"; the store's own verifiers would go on confirming a
  number nobody computed. Coverage must travel WITH the result through every
  hop, and a verifier's own verdict is capped by the weakest coverage figure it
  consumed.

  Consider this the coverage analogue of the phantom-done family (BO-2500,
  BP-1100): a green verdict over a partial scan is a phantom all-clear. Cite the
  parallel; do not fold this into those trees — they govern proof that WORK is
  done, this governs proof that a QUERY was complete.

  DOCUMENTATION SPLIT (2026-08-13, expert review). The reference-doc trigger that
  used to sit here has moved: the propagation contract and verdict cap are
  documented by ACS-1100e-1, the single consolidated reference-doc AC covering all
  four behavioural L1s (the former ACS-1100d-3 wrote the same file as three sibling
  ACs). The component-diagram trigger STAYS here and is satisfied by ACS-1100d-4 —
  a different artifact in a different target document by a different agent, and
  deliberately not folded into ACS-1100e-1.

  ALREADY SATISFIED, FOR ONE SURFACE ONLY (2026-08-18, PO). KM-ADM-005 applied this
  L1's verdict cap to a hop this tree did not have on its list — a TRUST RATING read
  by a human, rather than a check result consumed by a tool. The chain it repaired
  was: check-done-proof (diff scope) -> "enforced" rating on the test-covers edge ->
  a reader inverting that edge to conclude every done AC is test-proven. The
  laundering happened at the last hop, in a person's head, and the fix was to make
  the rating carry the scope it was earned over.
  Carry this into L2: an "answer" for the purposes of this L1 is not only a machine
  payload. A rendered rating, a badge, a dashboard tile and a legend entry are all
  hops that can drop a coverage figure, and the map is currently the only one of
  them that does not. ACS-1100d-1's enumeration of consuming hops should say so
  explicitly rather than leaving human-read surfaces implicit.
