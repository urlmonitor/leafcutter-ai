test_spec:
  - name: test_tq_400f_3_consistent_parent_is_byte_identical_after_a_full_apply_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      Fixture store built by the project's real serializer. The consistent parent must
      carry Roman-suffixed technical-constraint children (-i, -ii) and they must be
      finished, because an L2 flipped finished while its constraint siblings stay todo
      is the dominant real defect and therefore the shape the implementation is most
      likely to get wrong. sha256 that parent's raw bytes before and after a completed
      subprocess run with apply enabled; equal. Compare bytes, not parsed values.
  - name: test_tq_400f_3_a_different_parent_is_demoted_in_that_same_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      THE POSITIVE CONTROL, AND IT MUST BE THE SAME INVOCATION. In the run whose hashes
      the previous entry compares, the second parent (one unfinished grandchild) IS
      demoted on disk — work_status and demotion_reason changed. Split across two runs
      this entry is void: byte-identity alone is satisfied by a crashed run, a disabled
      write path, a preview-default run nobody passed the apply flag to, and a run the
      test never actually invoked.
  - name: test_tq_400f_3_consistent_parent_appears_in_the_report_with_its_own_verdict
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Assert PRESENCE, not the absence of a demotion: the consistent parent is in the
      run's report and inventory carrying an explicit not-has-unfinished-descendants
      verdict, and the run's evaluated count includes it. "Untouched" and "never
      looked at" produce identical files and are separable only here.
  - name: test_tq_400f_3_an_excused_descendant_does_not_read_as_unfinished_work
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      A PAIR IN ONE RUN. Parent A's descendants are all finished except one the
      oracle classifies as exempt from needing proof; parent B is identical except
      that its one outlier descendant is genuinely unfinished. A is byte-identical and
      carries the not-has-unfinished-descendants verdict; B is demoted. Only the pair
      proves the exempt classification was consulted rather than "not done" being read
      literally — A alone is satisfied by a traversal that found nothing.
test_rationale: >-
  The naive test asserts the good parent's file is unchanged after the run. It stays
  green on every inert implementation there is: a sweep whose write path is disabled,
  a sweep that raised before reaching the apply step, a sweep running in its
  preview-by-default mode because nobody passed the apply flag, and a sweep the test
  never actually invoked. Byte-identity is the easiest assertion in this tree to pass
  for the wrong reason. So every descriptor here is written as a PAIR inside one
  subprocess invocation — something must have been demoted in that same run for the
  untouched record to carry any information at all. The excused-descendant entry
  repeats the pattern one level down for the same reason: "left alone because the
  descendant was correctly excused" and "left alone because the traversal never
  reached it" are indistinguishable from a single record, and only an
  otherwise-identical parent that IS demoted separates them. The hash is taken over
  raw bytes rather than parsed values because the realistic defect — load the store,
  dump it back — preserves every value and rewrites every file.
change_target: code
risk_surface: contract_boundary
notes: |
  This is the negative control for TQ-400f and it inherits TQ-400e's never-cry-wolf
  property directly. A demotion mechanism that fires on a parent which is genuinely
  complete costs more than the twenty bad records it was built to find: it teaches
  every reader to ignore the verdict, and after that the whole sweep is decorative.

  The control is worthless if the thing it controls was inert, which is why the
  third clause is part of the criterion rather than a testing note. Byte-identity
  on a correct parent is satisfied trivially by a sweep with its write path
  disabled, by a sweep that crashed early, and by a sweep that was never invoked.
  Only a demotion landing on a different record in the SAME run rules all three out.

  Note the shape of the fixture in the first Given. The dominant real defect is an
  L2 flipped finished while its Roman-suffixed constraint siblings stay unfinished,
  so the consistent parent here must have those siblings and have them finished —
  otherwise the test never exercises the case the implementation is most likely to
  get wrong.
