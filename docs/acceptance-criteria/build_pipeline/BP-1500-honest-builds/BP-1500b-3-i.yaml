id: BP-1500b-3-i
title: "A sweep that examined nothing says so, and never borrows the wording of a sweep that found nothing"
component: build-pipeline
components:
  - build_pipeline
level: L3
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
declares_side_effect: false
criteria: |
  Given the sweep is pointed at a location holding no installed artifacts at all
    -- because the location does not exist, or exists and is empty, or resolved
    to somewhere other than the installed tree,
  When the install is rebuilt,
  Then the build reports that the sweep inspected nothing, stating the location
    it looked at and a count of zero,
  And it does not present "nothing was left behind" as the finding, because no
    installed artifact was inspected to support that conclusion,
  And a reader shown only the two report texts can tell this run apart from a
    run that walked a populated installed tree and found no orphans in it,
  And this outcome is treated as a fault in the sweep's own setup, surfaced
    where the build's other faults are surfaced, rather than as an ordinary
    quiet result.
depends_on:
  - BP-1500b-3
doc_links:
