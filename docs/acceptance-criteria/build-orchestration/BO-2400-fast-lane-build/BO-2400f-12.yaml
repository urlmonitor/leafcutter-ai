notes: |
  Authored against the 2026-08-24 amendment to BO-2400f, which replaced the
  unconditional promise of a pull request with two honest endings — a pull request, or
  a refusal issued before work begins. Nothing in the tree implemented the second
  ending; this criterion is that ending.

  Relationship to BO-2400f-9 (work_status: done) — tracked, not silent. BO-2400f-9
  states that on a passing run EVERY built acceptance criterion is flipped to done, and
  BO-2400f-9-i makes any un-flipped member an error. Read unconditionally, that pair
  is what produces the KI-BO-013 jam: a doc-only member can never pass the coverage
  gate, so it can never be flipped, so a run that includes one must fail at the finish
  step — after the test-writer and the coder have both been paid for. This criterion
  supersedes that unconditional reading for the undeliverable case only: for a set
  containing a member the roster cannot produce, the correct ending is a pre-work
  refusal and the run never reaches the finish transition, so BO-2400f-9 and
  BO-2400f-9-i apply only to sets every member of which the roster can produce. Where
  the two read differently, this criterion governs. BO-2400f-9 itself is deliberately
  left unedited and its work_status is unchanged — narrowing an already-done criterion
  by rewriting it would erase the record of the conflict, which is the thing worth
  keeping.

  Deliberately NOT decided here: whether the lane acquires a documentation phase.
  KI-BO-013 lists that as fix direction 1 and it is BrainCandy's capability call. The
  producible predicate is written against 'the run's own phase roster' precisely so it
  stays correct either way — add the phase and doc members become producible with no
  amendment to this text; do not add it and they are refused up front instead of
  jamming at the end.

  Blast radius, measured 2026-08-25: 87 not-done acceptance criteria across the store
  carry test_required: false, including members of the BO-2600 and ACD-1800 / ACD-1900
  families. So this is not one awkward criterion — it is a standing property of the
  store that today makes an unknown number of subtrees silently unbuildable by the
  lane. The refusal makes that visible for the price of a resolution instead of the
  price of a full run.
