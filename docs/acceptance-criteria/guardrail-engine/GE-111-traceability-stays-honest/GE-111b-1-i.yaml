assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Anchor parsing must split implemented_by on the FIRST '#' only (paths cannot contain '#'; the remainder is the symbol name). An entry with no '#', or with '#' followed by an empty/whitespace-only string, is anchorless and routes to file-path tier only."
  - "Anchorless detection is the gate that keeps adoption non-breaking for the existing store, where '#anchor' is currently NOT parsed — must not change behavior for any existing anchorless implemented_by entry (regression-safety on the current store)."
  - "Parsing must be a pure helper (no I/O) and therefore MUST NOT be wrapped in try/except per CLAUDE.md Rule 4."
delivers_to: null
expects_from:
  ac_id: GE-111b-1
  contract: "The file-path tier verdict object that is the sole granularity for anchorless entries"
origin_agent: business-analyst
created: 2026-06-22
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  Pins the tier-selection boundary: the symbol tier is opt-in via the presence of
  a meaningful #symbol anchor. Entries without an anchor (the common existing
  case in the store today, where #anchor is currently NOT parsed) keep their
  current file-path-only behavior, so adopting symbol-level detection is
  non-breaking for existing implemented_by entries. An empty anchor ("path#") is
  treated as anchorless.

  IT-PO enrichment (2026-06-22): pinned first-# split rule and the
  pure-function / no-try-except constraint per the error-handling policy.
change_target: code
