title: "A code ticket cannot be authored or dispatched without a test-requirements section"
component: build-orchestration
level: L1
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  No code ticket slips through with an empty test spec.

  A ticket that produces code must carry a populated Test Requirements section. That
  section is DERIVED FROM THE AC (the source of truth) -- generate_ticket_from_ac.py
  builds it from the AC's test_spec field (or, failing that, from the AC's Gherkin
  criteria Then-clauses), never as a hardcoded empty stub and never hand-typed into
  the ticket. An empty or absent section on a code ticket is blocked at authoring with
  a reason, and the supervisor refuses to dispatch the coder phase for such a ticket
  -- so the failure mode where test-writer is skipped and the coder self-writes its
  own tests (producing phantom coverage that violates the test-delegation rule) can no
  longer happen. The skip decision keys on the agent map (is a coder needed?), not on
  the presence of the block. Non-code tickets, and ACs explicitly marked
  test_required: false, keep the documented no-tests skip behavior with an accurate
  reason (never the hardcoded "docs-only / config-only" string on a code ticket).
