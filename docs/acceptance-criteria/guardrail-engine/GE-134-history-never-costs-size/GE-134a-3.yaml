id: GE-134a-3
components:
  - commit_guardian
readiness: approved
priority: high
title: "The published measurement rule says the decision-history block is left out and how its start and end are found"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given the size standard refuses a file that carries a decision-history block and states
    the measurement rule it applied,
  When an author applies that stated rule by hand to the file,
  Then the rule leaves the decision-history block out, and the author arrives at the
    length the standard quoted.
depends_on:
  - GE-134a-1
  - GE-127d-2
