criteria: |
  One tight loop: write the tests for the batch, then make them pass.

  For a cohesive batch of requirements you get a single, low-overhead build loop
  that first writes failing tests for the whole batch, then makes them pass —
  without the layered coordination, repeated cold starts, and split-up steps that
  the heavy path uses for large unattended runs.
