title: "A covers tag pointing at a non-active AC id does not satisfy any AC's done proof"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a test tagged "# covers:<id>" where <id> is not the id of an active AC
    (deprecated, superseded, or nonexistent),
  When linked-test coverage is evaluated,
  Then that tag does not count toward the done proof of any active AC
  And the dangling tag is flagged.
depends_on: [BO-2500a-1]
