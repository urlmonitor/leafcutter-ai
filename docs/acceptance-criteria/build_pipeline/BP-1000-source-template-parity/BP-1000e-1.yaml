id: BP-1000e-1
readiness: draft
priority: medium
title: "Any diff between a workflow source script and its shipped mirror blocks the merge"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-1000-source-template-parity/BP-1000e.yaml"
criteria: |
  Given an epic branch is being finalized for merge
  And a workflow script exists as a canonical source copy and a shipped mirror copy
    (for example templates/workflows-js/finalize-feature.js mirrored by
    scripts/workflows/finalize-feature.js)
  And the parity check compares every such mirrored workflow-script pair by name,
    byte-for-byte
  When the parity check runs as part of the merge gate
  And at least one mirrored workflow-script pair is NOT byte-identical (the
    comparison reports any difference at all -- content, added line, removed line,
    or whitespace)
  Then the parity check fails the merge gate
  And the merge is blocked until every mirrored workflow-script pair is
    byte-identical again
depends_on:
  - BP-1000e
