notes: |
  This is KI-BO-018's secondary observation, and it is the reason the relayed read appeared to
  work at all. The workflow's probes ran with the process location set to the untracked
  workspace parent rather than the repository — evidenced by a sibling probe in the same run
  reporting that it was not in a repository, while reading the registry from that same
  directory succeeded. The registry read succeeded only INCIDENTALLY, because that particular
  parent happened to hold a populated deployed copy. It would not hold for every layout.

  WHY IT IS ITS OWN CRITERION. Replacing the relay with a direct read inherits the same
  location assumption unless it is tested against it, and the failure it produces is worse than
  the one it replaced: an incidental success in the developer's layout and a hard failure on a
  consumer install, which is the deployed-layout trap CLAUDE.md records for hooks that import
  undeployed modules. The two starting locations in the first scenario are chosen to break any
  resolution that walks upward from wherever the process happens to begin.

  THE SECOND SCENARIO KEEPS IT HONEST. Making the read location-independent must not be
  achieved by searching until something plausible is found — a value read from the wrong copy
  is the same defect as a truncated one. Not-found must be reported as not-found, which hands
  off to BO-3200e for how that outcome is expressed.

  IT-PO ENRICHMENT NOTE (2026-08-26). The "parent holds no deployed copy" assertion is added as
  its own test rather than left as a fixture convention. In this workspace the parent directory
  of the repository IS a deployed target (ADR-001's self-hosting boundary), so the accident
  that hid the original defect is the DEFAULT condition for anyone developing here. A fixture
  convention would be forgotten; an assertion fails.
