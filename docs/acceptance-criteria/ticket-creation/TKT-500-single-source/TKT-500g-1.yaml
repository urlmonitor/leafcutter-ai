assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The authored route must not consult any agent classification at all. Adding, removing, or renaming a `produces: production_code` declaration in the agent registry must not change whether an authored demand reaches the work item. This is a policy about which inputs the decision may read, not about how the branch is written."
  - "The store-wide clause is a population obligation, not a fixture obligation: its proof must discover its subjects by scanning the real store rather than naming them, and must stay inside the unit suite's time budget — a per-record subprocess across a ~65-record sweep does not."
  - "The generator's command-line contract (--ac, --ac-root, --dry-run, --verify) must stay stable. The covering proofs and downstream tooling invoke it as a subprocess, so a change to flag names or exit semantics breaks the evidence as well as the callers."
  - "Reporting on a record must not modify it: dry-run generation and verification are read-only with respect to the AC store."
test_spec:
  - name: test_authored_test_spec_survives_a_non_coder_assigned_agent
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "scripts/ac_store/generate_ticket_from_ac.py --ac <id> --ac-root <store> --dry-run (subprocess)"
    description: "Drives the generator's real command-line entry point as a subprocess against a real on-disk record and asserts every authored statement name appears in the emitted proof section."
  - name: test_authored_angles_survive_with_the_descriptors
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "Asserts each authored statement's kind-of-proof label reaches the work item unchanged, rather than the names surviving while the labels are flattened."
  - name: test_test_writer_is_dispatched_when_a_contract_is_emitted
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "Asserts that when a proof section is emitted the phase list records the proof writer as owed, so the section is not a demand with nobody on the hook for it."
  - name: test_test_runner_is_recorded_as_owed_alongside_the_writer
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "The clause names two phases, not one. Asserts the proof runner is also recorded as owed — a work item that writes a proof nobody runs still ends with nothing executed."
  - name: test_every_approved_authored_spec_reaches_its_ticket
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Population sweep: discovers every approved record carrying an authored demand by scanning the real store from disk and asserts none generates a work item without a proof section."
test_rationale: |
  Four of these five already exist in
  unit_tests/ac_store/test_authored_test_spec_survives_generation.py and are named here
  verbatim, so the contract and the covering tests describe the same thing rather than
  two different things. The angles are read off the test bodies, not off the names: the
  first drives the real CLI as a subprocess (reachability), the sweep discovers real
  on-disk records rather than naming them (real_artifact), and the two middle ones assert
  the AC-literal Then clauses on the emitted work item (criterion).

  The fifth, test_test_runner_is_recorded_as_owed_alongside_the_writer, does NOT yet
  exist. The shipped behaviour injects the proof runner as well as the proof writer, but
  no test asserts it, so half of the phase-list clause is built-and-unproven. It is
  recorded as owed rather than quietly assumed — which is the same failure this AC
  exists to prevent, one level up.
delivers_to:
  agent: ticket-supervisor
  contract: "A generated work item whose proof section is present whenever the source requirement authored a demand — independent of who is assigned. This presence is the single input TKT-500g-2's skip decision is allowed to read."
