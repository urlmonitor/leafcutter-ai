criteria: |
  Given a commit that stages no agent definitions at all,
  When the commit is attempted,
  Then the consistency guard performs no inspection and raises no objection,
  And the commit is never slowed down or blocked by this guard,
  And this holds regardless of what other kinds of files the commit stages.
