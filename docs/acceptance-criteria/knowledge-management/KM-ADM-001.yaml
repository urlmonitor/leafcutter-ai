  - path: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100b-5.yaml
    relationship: related
    status: exists
    relevance: >-
      THE THIRD POSITION ON THE SAME SCRIPT, AND THE ONLY ONE THAT READ ITS CODE. TQ-100b-5
      (approved, high) treats check_ac_coverage.py as "R3", a live member of a closed four-rule
