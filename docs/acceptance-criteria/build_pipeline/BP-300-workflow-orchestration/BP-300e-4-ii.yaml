id: BP-300e-4-ii
components:
  - build_pipeline
title: "Every reply-reading point in a run either halts or is a declared register entry — there is no third behaviour"
component: build-pipeline
level: L3
status: active
req_status: draft
readiness: draft
priority: high
work_status: todo
criteria: |
  Given a delivery workflow that reads a structured result from every helper agent
    it dispatches,
  And a run of that workflow is exercised once per reply-reading point, each time
    with a prose-only reply substituted at exactly one of those points and every
    other point replying normally,
  When each of those runs is carried out,
  Then for every reply-reading point the run does one of exactly two things: it
    stops with the typed error naming that stage and agent, or it carries on with
    the substitute value declared for that point in the workflow's declared
    degradation register and records in its account of what happened that the
    stage carried on without a readable reply,
  And no reply-reading point produces a third outcome — a run that carries on with
    a substitute value while reporting nothing, or while presenting the stage as
    having produced the result it was asked for, is a failure of this criterion.

  Given the same sweep over a workflow,
  When it is carried out,
  Then every entry in that workflow's declared degradation register is reached by
    at least one of the runs,
  And an entry that no run reaches is reported, so a register entry left behind by
    a stage that no longer exists cannot sit there granting an exception to
    nothing.

  Given a change that adds a new reply-reading point to a delivery workflow, or
    changes an existing one so that it carries on without a readable reply,
  And that point is not added to the declared degradation register,
  When the sweep is carried out against the changed workflow,
  Then the sweep reports that point as an undeclared degradation, naming the
    workflow and the stage,
  And the report distinguishes it from the points that halt and from the points
    that are declared, so the count of undeclared degradations is readable as a
    single number that a change is not allowed to increase.
depends_on:
  - BP-300e-4
assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "Every claim in this AC must be proved by EXECUTING the workflow body under the E2 workflow harness (run_workflow_under_e2) — one real run per reply-reading point, with the prose-only reply substituted at exactly that one point and every other point replying normally. No part of this AC may be satisfied by reading, grepping or AST-parsing workflow source text: a catch block's presence is not evidence of which branch runs, which is the defect class BP-1100b-5 exists to reject."
  - "The set of reply-reading points must be derived from what a clean baseline run actually does — the dispatches an executed run produces — never from a hand-maintained list inside the sweep. A hand-maintained list silently stops covering the points a later change adds, which is the exact failure this AC is built to prevent."
  - "If any dispatch observed in the baseline run cannot be addressed individually (it carries no stable identifier the sweep can substitute a reply at), the sweep must FAIL loudly naming that dispatch. Silently skipping unaddressable points lets the sweep report full coverage of a subset."
  - "Halt and continue must be distinguished by observed run behaviour, not by the absence of an error string: a halt is evidenced by the run stopping at that point with the typed stage/agent error and no later dispatches occurring; a continue is evidenced by later dispatches occurring, and must additionally be checked against the exact substitute value the register entry declares AND against the run's own reported outcomes for a recorded degradation."
  - "The sweep must report three separately-countable classes per workflow — halting points, declared degradations reached, and undeclared degradations — plus the set of register entries that no run reached. A report that collapses a stale entry or an undeclared degradation into a pass is a failure of this AC."
  - "The undeclared-degradation total must be a single integer asserted against a checked-in baseline, and the assertion must be one-directional: the total may fall, never rise. A change that lowers the observed total must lower the recorded baseline in the same change, so the ratchet cannot be left slack after remediation."
  - "The swept workflow set must be data-driven, not a hard-coded pair: a newly added delivery workflow comes under the sweep automatically, and a workflow whose register is empty is still swept (it simply has no entries to reach) rather than exempted by name."
  - "This AC owns the sweep only — it must not modify any workflow body. If a workflow's register entries or its degradation records are not readable from an executed run, that is an upstream gap in BP-300e-4 and must be raised as a blocker, never worked around by parsing the workflow source."
  - "The sweep runs one Node subprocess per reading point (on the order of 50 across the delivery workflows). It must complete within 5 minutes on CI or be explicitly marked as a slow test, and must not depend on wall-clock time, network access, or a `claude` binary."
delivers_to: null
expects_from:
  ac_id: BP-300e-4
  contract: >-
    The declared degradation register carried in each delivery workflow — the enumerable
    list of reply-reading points permitted to carry on without a readable reply, each
    entry naming its stage, its substitute value and its written reason — together with
    the typed stage/agent error raised at every point not in that list. For this AC to be
    provable, two further properties must hold of that delivery: the register's entries and
    each recorded degradation must be readable from an EXECUTED run under the E2 harness
    (surfaced in the run's reported outcomes), not merely present as a literal in the
    workflow text; and every reply-reading point must carry a stable identifier the harness
    can substitute a single reply at. Anything in that not delivered by BP-300e-4 is an
    upstream blocker for this AC, never a licence to parse workflow source instead.
