criteria: |
  Matching approved categories become a new decision's starting criteria.

  When a new decision is being framed, the approved categories that fit its kind
  and the parts of the project it touches are offered first, in their preferred
  wording, and each reused question stays linked to its category. You still
  review and approve the criteria of every decision, so a reused question gains
  no authority from having been used before.
