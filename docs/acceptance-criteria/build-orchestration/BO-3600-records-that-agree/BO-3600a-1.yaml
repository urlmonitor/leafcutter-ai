notes: |
  MECHANICAL, NOT ADVISORY. Both halves of the pair are already structured — a
  status line, a named requirement id, a work_status field — so the conflict is
  decided by extraction and lookup. Nothing here reduces to "the author should also
  update the other record", which BO-3600's binding constraint requires be rejected
  at L2.

  The second and third scenarios are the specificity controls. A check that fires on
  every open fault, or on every finished requirement, is noise, and BO-3600d's own
  notes record what happens to a detector that produces noise.

  The fourth scenario comes from the register's real shape: entries routinely name
  several requirements, and KI-BO-012 named four while only some were done.

  VERIFY BY EXECUTION over real records. A test asserting that the check contains
  the words "open" and "done" would pass on a check that never runs — the mechanism
  KI-BO-028 itself identifies as dominant in this component.
