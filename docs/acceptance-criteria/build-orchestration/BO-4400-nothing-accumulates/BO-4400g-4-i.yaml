criteria: |
  Given the five flows of BO-4400g-4 are each run as in its first scenario, pull request
    merged and nothing unsent,
  And the clearing door is made to refuse every clearing request during these runs, with
    a refusal stating that the workspace is in use,
  When each flow returns its final result,
  Then every flow's workspace folder still exists, with its files identical to their state
    when the clearing request was made,
  And every flow's final result contains the door's refusal unchanged and reports the
    workspace as kept,
  And no flow retried the clearing with a discard token or by any other route.

  Given the set of flows, skills, commands and agent instructions the install deploys, the
    set being derived from what the install deploys and never from a hand-written list,
  When each is run on its clearing path with the door replaced by a recorder,
  Then every workspace that disappears during the run disappears only after a recorded
    clearing request for it.
