notes: "Verified defect, 2026-08-25, measured against this epic's own worktree; measurement corrected the same day after the first figure was found to double-count symlinked directories. The output-drift gate's own result line reads verified=275, uncomparable=2, exempt=0, gaps=2, drifted=27. Accurate coverage, manifest key counts against files on disk with __pycache__ excluded: agents 59/59, commands 33/33, hooks 12/12, workflows 9/9 and the deployed rules directory 16/16 are all covered; skills 52/54 leaves 2 unrecorded; gemini 94/150 leaves 56; scripts 0/181 leaves ALL 181; config 0/5; the deployed claude directory 0/5; and debugging, paused_runs, the pre-commit config and the settings file contribute 4 more. Total 253 of 528 deployed files unrecorded — 48%, not the 97% first reported. The agent-platform directories are symlinks into the runtime deploy tree, so their files are already covered under their canonical keys and must not be counted twice. THE SHARPER FINDING: only 2 of those 253 produce a GAP line — they happen to sit in a directory the gate already visits. The other 251 sit in directories the scan-set derivation never visits, so they produce no gap, no exemption, and appear in no count at all. The silent-versus-reported split is the phantom shape, not the raw unrecorded number. THE HEADLINE: all 181 deployed script files are policed by nothing, and that directory holds every commit-guardian hook, including the two drift gates themselves. The drift gates do not police the drift gates — a hand-edit to a deployed gate is invisible to every gate, including itself. ROOT CAUSE, in scripts/build_helpers.py: _canonicalize_output_path() returns None when a deployed path's top-level directory has no canonical shim_map entry, and the output is then dropped from output_mappings with no record that it was dropped. A directory misses either by having no shim_map entry (config, debugging, paused_runs) or by having a multi-segment one — the reverse-lookup table is built under a filter excluding any entry containing a path separator, which discards scripts/commit_guardian, scripts/doc_compliance and scripts/feedback despite their being present in shim_map, and that is why all 181 script files vanish. This is the epic's thesis one level up: a mapping step that cannot map something drops it without recording that it could not map it. A verified count with no denominator is the phantom pass in numeric form."
