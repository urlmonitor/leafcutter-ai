test_rationale: "change_target is docs, and normally that means test_required: false. The exception here is that the final criterion clause IS a textual-absence property — 'no surviving occurrence' — so a search is not a proxy for the behaviour, it is the behaviour. The guard is also the only mechanism that stops GE-120d-5, which edits the same document immediately afterwards, from reintroducing the deleted text; that hazard is named explicitly in both ACs' notes and cannot be enforced by review alone."
