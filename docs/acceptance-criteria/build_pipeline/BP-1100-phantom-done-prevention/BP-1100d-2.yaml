title: "pr-reviewer checks the agentType at every commit step in workflow JavaScript"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a pull request whose diff modifies a .js file under scripts/workflows/ or
  templates/workflows-js/ and that diff introduces or changes a workflow step which
  performs a git commit,
  When pr-reviewer reviews that diff,
  Then pr-reviewer verifies the committing step dispatches agentType "commit" (or runs
  under COMMIT_AGENT_MODE=1),
  And pr-reviewer raises a blocking finding when the committing step dispatches any
  other agentType (such as status-checker) or instructs an agent to run a raw git
  commit,
  And pr-reviewer's checklist for workflow .js diffs includes this commit-delegation
  check explicitly.
