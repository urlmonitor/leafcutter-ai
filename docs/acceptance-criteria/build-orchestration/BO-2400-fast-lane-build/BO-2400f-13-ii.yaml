  - name: test_bare_directory_occupant_is_refused_as_foreign
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "THE SHAPE THAT PRODUCED THE DEFECT. REAL SUBPROCESS against a REAL temporary repo where worktrees/<slug> is a plain non-empty directory registered as no worktree at all: the run refuses, classifies occupant foreign with occupant_kind unregistered_directory, and names the path."
  - name: test_registered_worktree_on_another_branch_is_refused_as_foreign
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "A genuinely registered worktree on a different branch occupies the location: refusal classifies it foreign with occupant_kind registered_worktree_other_branch and names the branch that work belongs to."
  - name: test_foreign_and_own_refusals_are_distinguishable_from_the_payload_alone
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "The third execution the rationale demands: arrange the lane's own leftover and a foreign occupant in turn against the same fixture and assert the payloads differ in occupant AND in option set — not merely that both refused."
  - name: test_foreign_refusal_offers_no_destructive_option
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "Every entry in refusal.options carries destructive false, and no option's action names clearing, removing, forcing, moving or pruning the occupant."
  - name: test_unclassifiable_occupant_defaults_to_foreign
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "THE SAFETY DEFAULT. An occupant arranged so branch identity cannot be established — a detached-HEAD worktree at the location, and separately a symlink — is reported foreign, never own_prior_attempt, and is handed no destructive option."
  - name: test_unreadable_worktree_listing_refuses_as_foreign
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "FAIL CLOSED on the lookup itself: with `git worktree list --porcelain` made to fail or return unparseable output, the run refuses with occupant foreign / occupant_kind unclassifiable — it does not report 'no occupant' and proceed to the failing open."
  - name: test_foreign_occupant_refusal_reaches_the_operator_with_no_dispatch
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Under run_workflow_under_e2 with the worktree label stubbed to a foreign refusal, the terminal payload carries the foreign classification and the occupied path through to the operator, and no agent beyond the worktree phase is dispatched."
test_rationale: |
  The foreign case has two shapes that fail differently and must both be executed:
  a bare directory nobody registered as a workspace, and a registered workspace on
  another branch. A lookup that only consults registered workspaces sees the second
  and is blind to the first — and the first is the one that actually produced this
  defect. Only a REAL SUBPROCESS run of the workspace command against a REAL temporary
  repository, with each occupant genuinely arranged on disk, distinguishes an
  implementation that handles both from one that handles the tidy case.

  A third execution must confirm the two refusals differ: arrange the lane's own
  leftover workspace and a foreign occupant in turn and assert the payloads classify
  them differently. Asserting only that some refusal was returned is satisfied by an
  implementation that calls everything foreign, which loses the whole point of the
  split. Grep-shaped tests over the workspace command or the lane are NOT acceptable
  evidence and must be rejected at review — they pass on code that never runs.
