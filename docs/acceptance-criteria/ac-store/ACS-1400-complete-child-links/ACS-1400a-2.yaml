criteria: |
  Given a child record whose structural parent cannot be located anywhere in the
    store,
  And a second child record whose identifier is of a shape from which no
    structural parent can be derived at all,
  And a third child record whose structural parent is present and does name it,
  When a commit staging all three is checked at the moment it lands,
  Then neither of the first two is reported as having passed,
  And each of the first two is reported through the same did-not-run channel the
    check already uses for an unreachable prerequisite, naming the record and
    stating which prerequisite could not be reached,
  And the third is reported as a pass in that same run, so a did-not-run outcome
    is a decision this run reached about specific records rather than the whole of
    what it did.
