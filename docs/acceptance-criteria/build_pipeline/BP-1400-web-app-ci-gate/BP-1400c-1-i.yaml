title: "The /about route is loaded headlessly and a non-200 or render error on it blocks the pull request"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a pull request that changes the web app (under leafcutter-web/), and the
    web app exposes the /about route,
  When the web-app route-render check runs and headlessly loads /about,
  Then a /about response with a non-200 HTTP status, or any console error or
    render error emitted while /about loads, makes the check report a failing
    result and the pull request is reported as not mergeable,
  And when /about loads with a 200 status and no console or render error, the
    check reports /about as passing.
