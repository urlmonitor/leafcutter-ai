title: "Process-feedback recommends faster, more verbose, more structured emission"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the router is emitting a process-finding entry about thin feedback,
  When it composes the recommendation portion of that entry,
  Then the recommendation explicitly asks for emission to be made faster for
    agents to complete,
  And asks for emission to capture more verbose detail,
  And asks for emission to be more structured by requiring richer fields up front
    (for example, requiring a target_file for bug-fix-category entries and a
    non-empty root cause),
  And the recommendation ties each requested change back to the deficiency that
    prompted it, so the improvement directly addresses the gap observed.
