notes: |
  THE DEFECT IS PLACEMENT AND THIS CRITERION IS ABOUT PLACEMENT. The L1 is explicit that
  an implementation which adds a second diagnostic somewhere else has not fixed anything.
  The requirement is that no exit path is reachable without passing the statement first,
  and the two runs above are chosen so that one of them takes the earliest terminating
  path in the check.

  WHY THE REFUSAL CLAUSE IS NOT OPTIONAL. This whole tree exists because a gate reported
  success from a path on which it inspected nothing. A criterion satisfied by a printed
  count would reproduce that defect one level up: the count itself becomes the unverified
  claim. Binding the count of one to a verdict on a record known to violate is what makes
  the number mean something. The L0 bars the bare-diagnostic criterion in as many words
  and this record honours that.

  THE WORKING DIRECTORY WITH NO STORE IS CHOSEN DELIBERATELY AND NOT THE WORKSPACE PARENT.
  KI-CG-018 reached the silent exit from the workspace parent because that directory
  carries a project marker but no store. GE-126b-3 repairs the root resolution so that
  route stops arising. If this criterion had been written against the workspace parent it
  would have been silently satisfied by that repair. Written against a tree that genuinely
  contains no store it stays meaningful afterwards — which is exactly the separation the
  L1 asked for.

  BLOCK VERSUS ANNOUNCE — DECIDED HERE AND STATED EXPLICITLY, as the L0 requires of each
  L2. This criterion is about VISIBILITY only. It does not require either run to block a
  commit. The outcome value must be distinguishable from ordinary success; the exit status
  may remain unchanged. Requiring the no-store run to block would fail every consumer
  repository that has no acceptance-criterion store, which is most of them.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

  ------------------------------------------------------------------------------
  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NOW SET AND IS NOT TERMINAL. Three records in this branch are built on
  what this one establishes: GE-126b-2 partitions its outcome value into three,
  GE-126b-3 supplies the resolved root it reports, and GE-126b-1-i strips any switch
  that could suppress it. The contract is written as the STATEMENT plus the OUTCOME
  VALUE because both are consumed, and a fix that delivers only the first would leave
  GE-126b-2 with nothing to partition.

  expects_from IS NULL AND THAT IS A DECISION. This is the head of the GE-126b chain and
  consumes nothing from another record. Not an unenriched field. DO NOT REFILL.

  SIZED L, AND THAT IS THE ONE ESTIMATE IN THIS TREE WORTH ARGUING ABOUT. The change
  looks like moving two lines above two early returns. It is not: the obligation is
  structural — no exit path reachable without the statement — which means the entry
  point's control flow is restructured, the internal-error fail-open path acquires the
  same obligation, and the examined count must come from the iterated collection rather
  than from a parallel computation. Every one of those is a place the cheap version of
  this fix quietly stops short.

  A WARNING FOR THE CODER ABOUT THE CHEAPEST PASSING IMPLEMENTATION. Moving the existing
  HOOK_COUNT_PARSED line above the early returns satisfies the letter of three of the
  four descriptors while leaving it opt-in. GE-126b-1-i is the record that forbids that,
  and it is a child of this one for exactly that reason - build them together.

