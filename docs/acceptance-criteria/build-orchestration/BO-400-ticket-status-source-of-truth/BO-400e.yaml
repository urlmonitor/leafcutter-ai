criteria: |
  One guarded route to "finished" — no side door that skips the check.

  Marking a piece of work finished is guarded: the guard reads the work's own
  record, and it refuses while any step that record still demands is unaccounted
  for. That refusal is the entire reason "finished" is worth reading. What is
  wrong today is not the refusal — it is that the refusal is optional. There are
  two ways to write the finished state and only one of them passes the guard, so
  the same situation produces a refusal one time and a clean "finished" the next,
  and neither answer tells you anything about the next one.

  The guard keeps reading the record, and keeps refusing. It does not take the
  word of whoever asked it to close the work. Being told "these are the steps
  that mattered, the rest are excluded" by the very party whose behaviour is
  under review is not evidence, and a guard that accepts it has stopped guarding:
  it could no longer catch the case it exists for, which is a run that skipped
  something it should not have. Nothing in this may be satisfied by making the
  guard more agreeable.

  So there is one door. The mechanism that performs the check is the only way the
  finished state is ever written, and the direct-edit route that bypasses it is
  closed rather than discouraged. The blanket override that already exists is not
  the surgical exception it looks like — it switches off the ordering rules along
  with the check — so it cannot become the ordinary way work gets closed. Same
  situation, same answer, every time, and that answer is the strict one: an
  unaccounted-for step means refuse, no unaccounted-for step means write it.

  The consequence is deliberate and is not a shortfall. Work whose record still
  demands a step it never got will now be refused reliably, where before it
  slipped through roughly two times in three. That is more halts, not fewer, and
  it is the correct outcome: the remedy for a record that asks for the wrong
  thing is to correct the record, never to soften the reader. This criterion is
  the reason a correction can be trusted once it is made.
