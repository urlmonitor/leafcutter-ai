test_rationale: "change_target is docs, but two clauses here are textual invariants spanning two ACs that edit the SAME file in sequence: GE-119b-5 removes the manual step and this AC adds new text immediately afterwards. The anti-reintroduction clause is only enforceable by a mechanical absence scan — a reviewer reading this AC's diff sees an addition and has no way to know it restores text the previous AC deleted. This is the narrow case where a text scan IS the behaviour under test rather than a proxy for it."
