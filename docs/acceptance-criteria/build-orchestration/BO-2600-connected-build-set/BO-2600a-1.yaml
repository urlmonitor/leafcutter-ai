  notes: |
    Add a keyword-only `exclude_structural_parent: bool = False` parameter to
    `resolve_connected_build_set(ac_id, *, ac_root, ...)` in
    scripts/build_orchestration/fast_lane.py. Inside the transitive depends_on walk,
    when the flag is True, skip any `dep` where `dep == derive_parent_id(node)`;
    import `derive_parent_id` from scripts.ac_store.ac_parent_id. Default False must
    leave the existing traversal (and every existing caller) unchanged — this is a
    backward-compatibility invariant, cover it with a test. The subtree union
    (traverse_ac_tree) is unaffected; the AC's own children must still appear when
    the structural parent is excluded.
test_spec:
  - name: test_exclude_structural_parent_skips_parent_dep
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "With exclude_structural_parent=True, a dep equal to derive_parent_id(node) is not expanded into the set"
  - name: test_exclude_structural_parent_keeps_peer_deps
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "Genuine (non-parent) depends_on prerequisites are still included when the flag is True"
  - name: test_default_false_preserves_existing_behavior
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "With the default (flag False) the resolved set is identical to the pre-change behavior"
  - name: test_children_present_when_parent_excluded
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "The AC's own subtree children still enter the set even when the structural parent is excluded"
