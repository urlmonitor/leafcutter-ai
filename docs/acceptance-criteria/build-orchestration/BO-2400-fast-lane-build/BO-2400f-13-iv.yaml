id: BO-2400f-13-iv
components:
  - build_orchestration
title: "A free location is never refused, and the run that proceeds says its workspace is new"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the fast lane is pointed at an acceptance criterion whose workspace location is
    free and whose build branch is checked out nowhere,
  When the run's first phase finishes,
  Then no refusal is issued, and the run carries on into resolving the connected build
    set and dispatching its agents exactly as it did before this check existed,
  And it is not refused merely because a branch of that name once existed, or because
    an earlier run for the same acceptance criterion has already ended and left the
    location free.

  Given the same run,
  When the operator reads what the first phase reported,
  Then a workspace opened new for this run is distinguishable from one carried over
    from anywhere else, so the operator never has to guess which of the two they got,
  And the report identifies the mainline point the workspace was cut from, so the
    operator can tell what mainline a later green result was measured against.
depends_on: [BO-2400f-13]
