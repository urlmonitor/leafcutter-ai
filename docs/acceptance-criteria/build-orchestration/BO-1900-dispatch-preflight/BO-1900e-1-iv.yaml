notes: |
  WHY THIS EXISTS. The 2026-08-31 incident was observed on the coding craft only because that
  is the craft that happened to volunteer the information. The reading craft's instructions
  also depend on a capability of their own, and whether its dispatch can invoke it is
  UNVERIFIED as of this record's authoring — that unverified status is precisely what this AC
  forces to an answer instead of leaving to the next chance disclosure. Scoping a fix to the
  coding craft would close the one hole that was seen and leave the others exactly as they
  were.

  THE THIRD CLAUSE IS THE ANTI-ENUMERATION CLAUSE. Requiring that a newly added craft is
  covered without restating the comparison rules out an implementation that hard-codes a list
  of crafts to check. Such a list is correct on the day it is written and silently wrong from
  the next craft onward, and its wrongness is invisible — a craft absent from the list is
  simply never checked, which looks the same as a craft that passed.

  PROOF OBLIGATION. Execute a run over the three crafts and observe a comparison occurring for
  each. The strongest test withholds a capability from a craft OTHER than the coding one and
  asserts it is caught, because an implementation wired only to the observed craft passes every
  test written around that craft.

  BOUNDARY. This AC says nothing about WHICH capabilities any given craft requires — that is a
  property of each craft's own instructions, not of the run. It requires only that the
  comparison ranges over every dispatch the run makes.
