id: TQ-600a-13-vii
components:
  - testing_quality
title: "A held pull request carries one explanatory comment, updated in place, never duplicated, and edited to say the hold lifted when it does"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a pull request that TQ-600a-13-vi holds — because the latest settled post-merge run
    on main is red or did not complete, or because there is no fresh verdict
    (TQ-600a-13-xiv), or because the run history could not be read (TQ-600a-13-ix),
  And the reason the comment exists: a failing status alone tells the author their PR is
    blocked but not that the cause is outside their change, and an author — usually an
    agent here — who cannot see that will start debugging their own diff,
  When the check evaluates the held pull request for the first time,
  Then exactly one comment is created on it, stating which of the held states applies in
    that state's distinct wording, and for a red or did-not-complete run carrying: the
    failing node ids (or the stage at which the run stopped), the date the streak began,
    a link to the run, a link to the notice issue when one describes that run, and the
    commit range that notice carries,
  And when the check evaluates the same pull request again while it is still held — on a
    later push, a description edit, a re-evaluation after a further red run changed the
    failing set, or a change of held state — that same comment is edited to carry the
    current contents, and the number of comments the check has authored on the pull
    request remains one,
  And when a later evaluation passes or grants an exemption, that same comment is edited
    to say the hold lifted, when, and why (a green run, with its link; or the accepted
    exemption), keeping the last held details collapsed beneath — it is neither deleted
    nor left saying the pull request is held,
  And when a passing evaluation finds no earlier comment by the check, no comment is
    written at all,
  And a comment written by anyone else, including another automated comment, is never
    edited or removed by the check,
  And the comment is demonstrated by executing four evaluations of one pull request
    against a recording double of the comment service — held, held after the failing set
    changed, held, then passing — and observing one create, then three edits of that one
    comment, the last saying the hold lifted, and no second create.
depends_on:
