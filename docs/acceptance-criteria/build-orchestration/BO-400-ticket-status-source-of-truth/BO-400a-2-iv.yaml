    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: "The same assertion for a ticket that carries an empty list of phases rather than none -- a distinct shape that reaches the same vacuous decision and would be missed by a guard written against absence only."
  - name: test_a_ticket_whose_every_phase_is_not_needed_is_not_recorded_done
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A ticket naming phases of which every one is marked not needed; assert no done record was written. This is the shape most likely to be judged legitimate by an implementer and waved through."
  - name: test_the_not_completed_reason_names_the_missing_phase_list_not_a_missing_signoff
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Assert the reason the run reports points the operator at the ticket's own list of phases, and does not instruct them to re-run a phase or add a sign-off -- neither of which exists in this case."
  - name: test_a_ticket_signed_off_before_the_drive_still_records_done
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "CONTROL. A ticket naming phases, every one already carrying a sign-off before the drive began and none dispatched during it, must still be recorded done -- so the three refusals above are attributable to the empty required set and not to a driver that stopped writing."
  - name: test_both_drivers_refuse_the_vacuous_completion_identically
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "Run the no-phase scenario against each of the two twin driver scripts as they exist on disk and assert both leave the ticket untouched -- the twin obligation verified rather than asserted in a comment."
test_rationale: |
  The condition is an absence acting on an absence: no phases required, and therefore
  no evidence of failure to find. A source-reading test cannot separate the broken
  driver from the fixed one, because both contain a completion write and both contain
  the phase loop -- the difference is only in what the loop concludes when it never
  runs. Every descriptor therefore executes the real workflow and asserts on the ticket
  record left on disk.

  Three separate negative descriptors exist because the three shapes are three
  different inputs that happen to converge, and a guard written against any one of them
  leaves the other two live. The all-not-needed shape is called out specifically: it is
  the one an implementer is most likely to consider a legitimate completion.

  The control descriptor is load-bearing rather than decorative. The cheapest way to
  pass every refusal above is to stop writing done records at all -- which is the state
  this AC family started in, and which BO-400a-2-ii exists to prevent returning to.

  The last descriptor exists because both drivers must refuse identically and nothing
  today verifies that; the twin obligation is currently carried only by a comment in
  the file headers.
