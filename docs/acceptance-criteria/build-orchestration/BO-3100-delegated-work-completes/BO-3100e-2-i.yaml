notes: |
  ABSENT EVIDENCE MUST NOT READ AS SUCCESS, and this is where a derived expectation
  is most likely to leak: an expectation the build cannot evaluate is trivially not
  falsified, so the tempting default is to let the step pass. That converts every
  hard-to-observe result into a free pass and reproduces KI-BO-007 exactly.

  Nor may it read as failure by default — the second scenario keeps "could not look"
  distinct from "looked and did not find", because the two have different remedies
  and collapsing them makes the report untrustworthy in the other direction.
