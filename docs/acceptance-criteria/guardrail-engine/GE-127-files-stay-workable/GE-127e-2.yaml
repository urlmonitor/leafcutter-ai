notes: |
  THIS IS THE DISCRIMINATOR THE L1's NOTES DEMAND, AND WITHOUT IT THE WHOLE TREE IS
  VACUOUS. "The refusal includes remediation guidance" is satisfied today by a fixed
  sentence pointing at a helper. So is "the refusal describes the file", by any
  description that looks plausible for files of that kind. The only observation that
  separates guidance from a template is a pair of runs whose input differs and whose
  advice must differ with it. Every arm here is therefore stated as a pair, and the
  pass condition is that the value MOVED — not that a particular value appeared.

  THE THIRD ARM IS THE ONE THAT LOOKS REDUNDANT AND IS NOT. The byte-identical copy
  at a different path must produce the SAME advice. It is there for two reasons.
  First, it forbids the cheap way to pass the first two arms — deriving anything at
  all from the path, the file name or a per-run nonce, which makes advice "differ"
  without ever looking at content. Second, it is the arm the named mutation below
  must NOT turn red, which is what proves the other two arms are carrying the
  criterion rather than the copy arm carrying it.

  THE REARRANGEMENT ARM HOLDS MEASURED LENGTH CONSTANT ON PURPOSE. If the rearranged
  file were also allowed to change size, an implementation keyed on the measured
  length alone would pass. Holding the number fixed while the content moves leaves
  content as the only variable that could have produced the change. Whether the
  counting rule makes such a rearrangement possible is inherited from GE-127d, not
  settled here; if the rule makes an exactly-length-preserving rearrangement awkward
  to construct, the arm is satisfied by any rearrangement in which the advice moves
  further than the length does — but the length must be reported unchanged or
  near-unchanged in the fixture, and the fixture must say so.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can
  lift it verbatim into a test descriptor.

  MUTATION: derive the named parts and the named division from the refused file's
  KIND and its MEASURED LENGTH alone, ignoring its content entirely — for example, a
  fixed table of part names per covered kind, apportioned across the measured length.
  Under that injection:
    - the two-different-files arm must go RED, because two files of the same kind now
      receive the same parts;
    - the rearrangement arm must go RED, because the length did not change so the
      advice does not move;
    - the byte-identical-copy arm must STAY GREEN.
  All three outcomes must be observed, and all three must revert. The third is not
  decoration: a mutation that turns every arm red would mean the arms are not
  independent, and the copy arm's staying green is the evidence that this record's
  teeth are in the two moving arms.

  WHAT THIS RECORD DOES NOT REQUIRE, STATED SO IT IS NOT INFERRED. It does not
  require the advice to be good, correct, complete, or the same advice a human would
  give. It requires it to be ABOUT THE FILE. A decomposition that reaches for
  correctness has left this goal and entered CR-100's and INF-800's territory, and
  both are fenced in the doc_links above.

  BOUNDARY WITH GE-127e-3. That record forbids the refusal from promising help that
  does not arrive. This one forbids it from describing a file it did not look at.
  A refusal can be scrupulously honest about a description that is generic, and it
  can be specific about a file while promising a tool that does not exist. Keep the
  two obligations apart.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity,
  it_requirements, test_spec, test_rationale and declares_side_effect. The mutation
  above, including which arm must stay green, is written to be turned directly into
  test descriptors.
