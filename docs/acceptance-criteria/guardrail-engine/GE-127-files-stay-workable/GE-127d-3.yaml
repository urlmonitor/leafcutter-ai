test_rationale: |
  Three of the eight descriptors are the genuine red baseline and are written
  first: the pre-fix implementation is a bare DOTALL regex with no notion of a
  string literal, so a "/*" inside any of the three JS string flavours opens a
  phantom block-comment span that runs to the next real "*/" anywhere later in
  the same content, discarding every real line in between. Each is exercised
  against the exact production shape (a template literal carrying
  "changelogs/*.md", mirroring templates/workflows-js/fast-lane-ship.js line
  1572) rather than an arbitrary string, per this repo's real-artifact
  spot-check convention.

  The triple-quote-lookalike descriptor exists because the criteria name both
  hazards (a block-comment-lookalike and a triple-quote-lookalike sequence
  inside a string) and only three of the eight descriptors exercise the first
  one; without a dedicated descriptor for the second, an implementation that
  special-cases "/*" alone would pass everything above it.

  Two non-regression descriptors exist because the fix must be proportionate:
  it changes ONLY how a delimiter-lookalike-inside-a-string is handled, never
  how a genuine, string-free discarded region is measured. Both compare
  against an independently-computed expectation, never a literal, so the
  descriptor cannot be satisfied by an implementation that happens to agree on
  today's one fixture.

  The repository-wide descriptor is the decisive proportionality check this
  record's own it_requirements demand: the fix must not change the quoted
  length of any tracked .py file that does not contain the hazard, over the
  guard's own real, current population — not a sample of it.

  The final descriptor closes the loop on the concrete artifact the defect was
  found on, read from disk rather than reproduced by hand, per CLAUDE.md's
  "Real-artifact behavioral spot-check" convention and this tree's own
  documented history of synthetic fixtures reproducing the very bias they
  exist to catch.
delivers_to: null
