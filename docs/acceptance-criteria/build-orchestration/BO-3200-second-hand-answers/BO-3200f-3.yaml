notes: |
  STARTING STATE, TO BE RE-MEASURED NOT ENCODED: about 20 shell steps in plan-feature and 3 in
  fast-lane-ship addressed to status-checker; the fast-lane release step addressed to
  python-coder (the KI-BO-020 fix). Under the user's 2026-09-16 decision that release step is
  also mis-addressed -- repointing chores at a party other than the executor was rejected -- so
  the first scenario reports it too.

  PLACEMENT, RECORDED BECAUSE TWO RECORDS POINT ELSEWHERE. AR-200c's notes and
  KI-BO-20260901-1620's status line both say this check belongs under BO-3200a as an extension
  of BO-3200a-2. It was placed here at the user's direction for this decomposition, and the split
  is coherent: BO-3200a-2 (as amended 2026-09-16) proves every FACT path requests no judgement,
  observed by exercising it; this record proves every exact-command dispatch, facts AND chores,
  is ADDRESSED to the executor. Chores are not facts, so BO-3200a-2 cannot catch a claim or
  release sent to a specialist. The two overlap on fact reads only, and there they agree.

  HOW A DISPATCH IS KNOWN TO BE JUDGEMENT-FREE IS THE IT PO'S. BO-3200a-2's IT PO decision
  already puts a result_use declaration on every dispatch site, verified by observation rather
  than trusted. Reusing it is the obvious route and avoids a second declaration surface; a
  prompt-text heuristic was rejected there and should be rejected here.

  THE REPORT QUOTES THE PARTY'S STATED PERMISSION because that is the remedy a reader needs.
  Whether an unstated permission is reported as "unstated" rather than "not permitted" follows
  AR-200c.

  IT-PO DECISION (2026-09-16) -- PLACEMENT AND BOUNDARY WITH BO-3200a-2. The two records OVERLAP
  (both examine fact dispatches) but do not DUPLICATE: they answer different questions about the
  same sites. The boundary, recorded identically in BO-3200a-2's notes:

    - ONE INVENTORY, OWNED HERE. The list of every dispatch site in the canonical workflow
      sources, with its declared result_use and its addressee. Static and complete over the
      source.
    - ADDRESSING VERDICT, OWNED HERE. fact and chore -> executor; judgement -> not the executor;
      undeclared, unresolvable or bypass-carrying -> reported.
    - EXERCISE VERDICT, OWNED BY BO-3200a-2. Every fact path, run in the no-judgement
      environment, obtains its value; a path that relays -- outright or by falling back -- is
      reported by observation.
    - ONE REPORT with both verdicts per site. An implementer builds one walker and one report.

  A fact dispatch addressed to status-checker is therefore reported by BOTH: here as
  mis_addressed (from the source), and there as relayed_fact (from the run). That is intended --
  the addressing verdict catches it without running anything, the exercise verdict catches a
  correctly addressed path that still relays by another route. AR-200c's notes and
  KI-BO-20260901-1620 pointed the sweep at BO-3200a; the user placed the addressing half here,
  and this boundary is what keeps the two from being built twice.

  CHORE IS A NEW result_use VALUE. BO-3200a-2 declared only fact and judgement. A claim or a
  release is neither a value the build branches on nor an opinion, and declaring it `fact` would
  put it in BO-3200a-2's exercise set, where "obtains its value" is meaningless. BO-3200a-2's
  it_requirements are updated to the three-value form in the same pass.

  ORDER OF LANDING -- RECOMMENDED BA EDIT. BO-3200a-2 now consumes this record's inventory but
  its depends_on does not name BO-3200f-3, and the build sequencer reads depends_on only
  (KI-ACD-015). Recommended: add BO-3200f-3 to BO-3200a-2's depends_on. Without it, "whichever
  lands second extends the first" is the fallback rule, stated in both records.

  THE RELEASE STEP (KI-BO-020's fix) IS IN SCOPE, CONFIRMED. It works today, which is exactly
  why it needs naming: under the user's decision a chore addressed to any non-executor party is
  mis-addressed, and python-coder's entry states no shell permission.

  AMENDMENT 2026-09-17 (business-analyst) -- A COMMIT IS NEVER AN EXECUTOR CHORE (GE-129 Q5).
  SEE amended_by.

  WHY AN EXCLUSION AND NOT A REPOINTING. A commit is an exact command whose result nobody judges,
  so the first scenario as written would have pulled it to the executor. Under GE-129 commits are
  authorised by who is calling, and the executor is not the commit agent (GE-129a) -- a commit
  sent there is refused, and a run that relied on it would fail. The step-3.5 closure commit,
  dispatched to status-checker today, is exactly the site a well-meaning repointing under this
  record would have moved to the executor.

  BOUNDARY -- WHAT THIS RECORD DOES NOT CHECK. It does not require a commit dispatch to be
  addressed to the commit agent, and does not report step 3.5's current addressing to
  status-checker. Rerouting commits to the commit agent is GE-129c's, and the static
  "non-commit agent paired with a commit" check is BP-1100d-1's (with BP-1100d-2 at review). Had
  this record reported commit-to-status-checker, its gate would fail on the real sources until
  GE-129c lands, putting a critical phase_1 record behind a draft tree; depends_on is therefore
  NOT extended to GE-129c. If the user wants the addressing verdict to also require the commit
  agent, that is a one-scenario addition plus a depends_on edge on GE-129c.

  declares_side_effect: false -- re-derived after the amendment. The new Then clauses state what
  the check counts and reports; nothing durable is asserted.
