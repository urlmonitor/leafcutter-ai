    a merged closing keyword — must not release the hold; that is now a criterion.
    SUPERSEDED: the record previously left "the hold during that window" untested
    and its notes said "Between a close and the next nightly run there is no open
    flag, so TQ-600a-13-vi passes every PR for up to a day ... Closing that window
    would need the per-PR check to consult something besides the open issue (for example
    the latest nightly verdict), which changes the one-source-of-truth decision and
    is the owner''s to make." The owner has made it. The closing-keyword premise is
    widened from "Fixes #N or Closes #N in the description" to the full verified family
    in descriptions and commit messages (GitHub expert finding 4). (B) `nightly-red`
    -> `post-merge-red`, "night" -> "run". depends_on gains TQ-600a-13-vi. Readiness
    returned to draft for IT PO re-enrichment. Full prior text: commit e79d35ef4.'
