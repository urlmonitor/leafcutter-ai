  notes:
    - "The generated ticket's components LIST must carry the docs/components.json underscore graph id (e.g. build_orchestration) so the ticket passes the Component-vocab CI check (check_component_vocab.py); the current code copies the scalar kebab `component` verbatim into the LIST."
    - "Apply the existing canonical kebab->underscore normalisation (scripts/migrate_component_vocab.py MIGRATION_MAP resolved against docs/components.json) at generation time — or prefer the AC's own `components` LIST, which already holds underscore graph ids — rather than re-deriving a new mapping."
    - "The scalar `component` axis (index.yaml kebab namespace key) must stay unchanged; only the components LIST is normalised (two-axis taxonomy preserved, kebab value never copied into the LIST)."
