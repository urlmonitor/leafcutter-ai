notes: |
  THE CHECKS (user brief item 2, plus one the BA added).
    a. old text occurs exactly once in its file as it now stands  (P2)
    b. the altered file still loads                              (P3)
    c. it still changes bytes                                    (P4)
    d. it changes at least one line a test naming it runs on the
       run on the code as written                                (P5)
    e. ADDED BY THE BA: its file is still in scope for the name in the owed
       list, and still passes the writer's other path refusals (test file,
       outside the repository, inside the version-control folder)  (P6).
       Reason: scope is declared on the entry (in_scope_files) and can change
       after the pin was made; a pin must not widen it.

  NEVER SILENTLY USED, NEVER SILENTLY DROPPED. A failed pin is never applied
  and never falls back to a stored copy (analysis invariant 2), and it is
  never omitted from the report: either a re-preparation runs, or the name is
  unfinished naming the check. The last And clause is the guard against a
  name quietly vanishing.

  "BEFORE ANY WRONG VERSION IS RUN", NOT "BEFORE ANYTHING". Check (d) needs
  the run on the code as written, which TQ-500g-1-i already makes first. Check
  (b) may be decided without running the tests (IT-PO's choice); if it can
  only be decided from the run, the row still reads "did not load", never
  caught or survived (TQ-500g-1-ii).

  NOTHING IS PINNED UNTIL IT PASSES. A fresh preparation becomes a pin only
  after all checks pass, so a first guess that is a no-op is not locked in.
  When re-preparation fails, the earlier pin is kept rather than deleted: the
  next run checks it again (it may pass after a further code change), and the
  reset (TQ-500g-1-xvi) stays the only way to remove a pin.

  IMPLEMENTATION LEFT TO IT-PO: how "loads" is decided before the run, and how
  the executed lines are measured (TQ-500g-1-xiv).

  IT-PO ENRICHMENT (2026-10-23)
  LOADS: decided before the run for Python files (compile, then execute the
  altered module in a child interpreter under the runner's journalled apply and
  put-back). Other languages: decided by the run, as TQ-500g-1-ii does today.
  A load failure that only the run can see (a bad name inside a function body)
  marks the pin with failed_check, so the next run re-prepares it while the
  code is unchanged; the pin is still never dropped.
  EXECUTED LINES: the traced pre-run of TQ-500g-1-xiv, limited to the holder
  tests and the candidate files, made only when a pin or declaration reaches
  check (d). This is one extra pytest run per gate run in that case; the
  runner's own baseline stays the control.
  WHERE: the checks in _wvp_checks.py, called by the plan (_wvp_plan) that the
  list and write steps share.

  USER DECISION (BrainCandy, 2026-10-24, "approved")
  c. "STILL LOADS" EXECUTES. The check runs the altered module in a child
     interpreter; compiling it is not enough. It runs under the runner's
     journalled apply and put-back, so the file is always restored. Now a
     criteria clause. A load failure only a test run can see (a bad name inside
     a function body) is still handled by failed_check, as above.
