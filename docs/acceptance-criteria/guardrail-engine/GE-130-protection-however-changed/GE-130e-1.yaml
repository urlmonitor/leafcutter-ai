notes: |
  CENSUS SOURCE CHECKED, NEITHER SUPPLIES IT (brief: reuse GE-120f or BP-1600a-2 if either can):
    - BP-1600a-2 is scoped by its own first Given to the commit-guardian check-script directory;
      templates/hooks/ is not beneath it (GE-120f amendment 2026-09-07).
    - GE-120f reads the commit-time registration surface and explicitly records that "no AC today
      takes a census of the settings.json / templates/hooks/ surface" -- a finding, not a target.
  So this record specifies the census, scoped to the session-hook surface only; the last clause
  keeps it from forking BP-1600a-2's population.

  Registered-nowhere scripts (measured 2026-09-07: check_ticket_no_branch_move.py,
  check_ticket_state_integrity.py) are reported but do not fail this census -- that they should
  fail is a separate decision not made by GE-130.

