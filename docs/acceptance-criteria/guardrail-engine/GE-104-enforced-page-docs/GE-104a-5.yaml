  ac_id: GE-104a-2
  contract: "The new llm-type trigger_condition added to the documentation-expert entry in config/agent_registry.json (the 'new page added in files_touched without its derived docs/reference/frontend/<name>.md' expression), plus the GE-104a-2-i analysis concluding the v1 DSL grammar cannot express this condition. GE-104a-5 wires the evaluation path so that authored llm-type condition genuinely fires instead of being silently skipped."
