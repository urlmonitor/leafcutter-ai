id: BO-610-5
title: "Unrecognized change_target or risk_surface value is rejected at validation"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket file has change_target set to "database" (not in the enum),
  When the frontmatter validation runs,
  Then it rejects the ticket with an error message:
    "Invalid change_target 'database'. Valid values: code, schema, ui, infra, pipeline, prompt, model, config, docs, dependency"
  And the error names the invalid value and lists all valid alternatives

  Given a ticket file has risk_surface set to "performance" (not in the enum),
  When the frontmatter validation runs,
  Then it rejects the ticket with an error message:
    "Invalid risk_surface 'performance'. Valid values: internal, contract, auth, privacy, safety, cost"
  And the error names the invalid value and lists all valid alternatives

  Given a ticket file has change_target: [code, database] where one value is valid and one is not,
  When the frontmatter validation runs,
  Then it rejects the ticket identifying only the invalid value "database"
  And it does not reject the valid value "code"
