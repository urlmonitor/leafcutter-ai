assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    ac_tree_walk_prebuilt_index:
      type: object
      description: "The tree walk accepts an optional prebuilt id-to-record mapping and uses it when supplied, keeping its self-building path for callers that pass nothing. The connected-set resolver supplies the mapping it already holds — an UNDRAINED view of it — so one resolution parses the store exactly once."
  reference_file_path: "scripts/ac_store/scan_ac_store.py"
  n_location_rule: "2"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "CORRECTNESS TRAP, read before writing any code. The cycle-drain step mutates the resolver's index IN PLACE — it deletes cycle nodes — and the resolver runs it BEFORE it walks the tree. Today each walk rebuilds a pristine index of its own, so each walk still sees cycle-adjacent nodes. Handing the drained index straight to the walk would silently shrink the build set: fewer acceptance criteria, no error, the lane quietly building less than it was asked to. That is a phantom-done regression hiding inside a performance fix. The walk must be given an UNDRAINED view — snapshot the index before the drain, or drain a copy — and the equivalence guard in BO-2400c-6-i must exist before this change lands."
    - "Sweep the other call sites of the same tree walk in the same pass. Anything that walks the tree inside a loop pays the identical re-read, and a fix applied only to the connected-set resolver leaves the defect in place elsewhere while appearing to close it."
    - "Do NOT wire telemetry for this. The lane emits none (KI-BO-012) and standing one up here would be a second unread artifact. The accepted evidence for the cost improvement is a before-and-after wall-clock figure recorded by hand in the changelog entry for this change; the mechanical guard in the test suite is the parse count, not the clock."
    - "Covering tests must EXECUTE the resolver — in-process against a temporary on-disk store, or as a real subprocess — and count real parses or real file opens. A test that greps the resolver or the tree walk for a parameter name, or that asserts the parameter merely exists in the signature, is NOT acceptable evidence and must be rejected at review: it passes unchanged when the argument is accepted and ignored."
delivers_to:
  agent: python-coder
  contract: "A tree walk that reuses a caller-supplied record index, and a connected-set resolver that supplies its own undrained index — one full parse of the store per resolution, with the resolved set unchanged."
expects_from:
  ac_id: BO-2400f-1
  contract: "The connected-set resolution whose answer — the dependency-ordered list of leaf ids — must be identical before and after this change."
test_required: true
test_spec:
  - name: test_one_resolution_parses_each_store_file_at_most_once
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "Against a temporary on-disk store whose target requires two or more composite expansions, the YAML loads (or file opens) of store records during one resolution are counted and no record is parsed more than once."
  - name: test_resolved_set_unchanged_for_a_multi_expansion_target
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "For a target requiring several composite expansions, the resolved ordered id list matches the recorded pre-change answer exactly — same members, same order."
  - name: test_tree_walk_uses_the_supplied_index_instead_of_rereading
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: seam
    description: "When the tree walk is given a prebuilt record index, no additional read of the store directory occurs during the walk — proving the argument is consumed rather than accepted and ignored."
  - name: test_walk_receives_an_undrained_view_after_cycle_removal
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: failure
    description: "On a constructed store containing a cycle, the record set the walk is given still contains the cycle members that the drain removed from the resolver's own working view."
test_rationale: |
  Two things must be proved, and each has an easy wrong proof.

  The cost. The only honest mechanical assertion is a count of parses or opens for one
  resolution. A wall-clock assertion is the obvious alternative and must not be used:
  it flakes on shared CI, and a flaky performance test is deleted long before the
  regression it guards returns. The human-readable cost evidence — a before-and-after
  timing figure — belongs in the changelog entry, not in the suite.

  The correctness. The dangerous outcome of this change is not a crash, it is a
  quietly smaller build set, which no existing test would notice because every existing
  test resolves against an acyclic store. The undrained-view test and the equivalence
  guard in BO-2400c-6-i are therefore the load-bearing coverage. Both must run against
  a constructed fixture: the repository's own store is acyclic today, verified
  2026-08-24 when a timed resolution run captured the resolver's diagnostic output and
  produced no cycle warning at all, so a guard built on the live store would exercise
  nothing while looking thorough.
