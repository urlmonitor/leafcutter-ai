title: "Blocked commit produces a clear, actionable error message"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an unauthorized agent (e.g. python-coder) stages a commit that modifies
    the criteria field of an AC YAML file under docs/acceptance-criteria/,
  When the governance enforcement hook runs,
  Then the commit is blocked before it reaches the repository,
  And the error message includes:
    - the identity of the offending agent
    - the absolute or repo-relative path of the AC file
    - the specific rule being violated
      (e.g. "criteria field may only be written by requirement authors")
    - a list of which agents ARE authorized
  And the error is written to stdout (not only stderr)
    so the agent receives it as feedback.
depends_on: [ACS-400e]
