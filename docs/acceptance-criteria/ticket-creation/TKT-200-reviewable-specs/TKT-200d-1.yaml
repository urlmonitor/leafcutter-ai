id: TKT-200d-1
title: "Changed spec triggers regeneration of its dependent diagram"
component: ticket-creation
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a feature folder contains an L2 AC file and a previously generated diagram,
  When the analysis step revises that AC file (changing its component or depends_on fields),
  Then the documentation step detects that the diagram's source data has changed,
  And it regenerates the diagram to reflect the updated component relationships,
  And the old diagram content is replaced (not appended or duplicated).
depends_on: [TKT-200d, TKT-200a]
