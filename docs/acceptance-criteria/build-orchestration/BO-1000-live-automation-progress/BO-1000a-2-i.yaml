id: BO-1000a-2-i
components:
  - build_orchestration
title: "The intermediate closure step and early pre-flight aborts do not break the X-of-N counting"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the finalize sequence contains an intermediate closure step that runs
    between the tests step and the PR-merge step,
  When the start-of-step positions are announced,
  Then that intermediate step is announced with a position that fits the
    "Step X of N" scheme without breaking the monotonic ordering and without
    making the announced N inconsistent with the other steps' N,
  And when the run aborts during pre-flight before the first numbered step
    begins, no start-of-step line claims a position for a step that never
    started.
depends_on: [BO-1000a-2]
