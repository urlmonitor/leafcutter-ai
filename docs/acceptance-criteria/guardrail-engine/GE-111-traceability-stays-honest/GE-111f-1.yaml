id: GE-111f-1
title: "A replaced skip or a skip in a brand-new test file is not reported as an added skip"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given check_contract_shrinking.py blocks a commit that both changes production code and
    weakens tests, and it detects an added skip or expected-failure by matching each added
    diff line against the skip/xfail weakening patterns
  When a commit modifies an existing test file by replacing one skip with another of the
    same kind — for example removing
    `pytest.skip(f"live Neo4j not reachable: {exc}")` and adding
    `pytest.skip(unreachable_reason(exc))` in the same file, so the file's skip count is
    unchanged
  Then the guard does not report "pytest.skip added" for that file, because per file and
    per kind an added skip/xfail is a weakening only when the added count exceeds the
    removed count
  And when a commit adds a brand-new test file (diff status A) that contains a skip or an
    expected-failure mark, the guard does not report it, because a new file cannot weaken
    a test that existed before
  And the guard still blocks a commit that adds a skip to an existing test file that had
    none of that kind removed in the same diff
  And the bug symptom ("check-contract-shrinking blocks a commit with 'pytest.skip added'
    for (a) a one-for-one REPLACEMENT of an existing skip in a modified test file (8
    violations on PR #1322: pytest.skip(f"live Neo4j not reachable: {exc}") replaced by
    pytest.skip(unreachable_reason(exc)), skip count unchanged) and (b) a skip inside a
    brand-new test file (three live-test builds on 2026-10-14). Every such commit needed
    SKIP=check-contract-shrinking.") must not occur
