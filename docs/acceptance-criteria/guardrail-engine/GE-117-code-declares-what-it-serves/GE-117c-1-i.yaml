superseded_by: null
covered_by: []
implemented_by: []
notes: |
  ENCODES the deferred inheritance decision (resolution #2). An entry inside a public
  symbol that already declares a resolvable AC may inherit it (avoids forcing a
  redundant duplicate tag on every entry, keeping the tail-tag ergonomics the PO
  wanted). It MUST carry its own explicit reference when it records a change serving
  a DIFFERENT AC (scenario 2 shows its own ref wins) or when it is a module-level
  entry with no enclosing declared symbol to inherit from (scenario 3 -> missing).
  Net guarantee: every new entry resolves to SOME valid AC, without redundant tags
  in the common case.
