work_status: todo
criteria: |
  Given the shape-tracking store contains 9 logged occurrences of the shape:
    - directory pattern: "docs/architecture/**"
    - file extensions: [".md", ".mmd"]
  And the specialist agent has access to this store,
  When a 10th commit with the same shape is logged,
  Then the specialist produces a candidate routing entry:
    - group: "architecture-docs" (or similar derived name)
    - path_pattern: "docs/architecture/**"
    - template: a message template inferred from the existing commit messages
      found for this shape in git history
  And the candidate is presented to the user for review,
  And no candidate is proposed at 9 occurrences or fewer.
