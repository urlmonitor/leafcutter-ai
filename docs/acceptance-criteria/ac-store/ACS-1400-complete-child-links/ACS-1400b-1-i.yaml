title: "The scheduled run consumes the existing scan's real verdict rather than re-deciding it"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a store containing at least one child record its parent does not name,
  When the recurring store-wide check runs,
  Then the set of records it reports is exactly the set the existing store-wide
    scan reports for that same store, with no record present in one and absent
    from the other,
  And when the existing scan is made to report a different set for the same store,
    the recurring check's report changes to match it without the recurring check
    being altered,
  And the recurring check reaches its delivered-or-not outcome from the scan's own
    result, so a scan that reported findings cannot be followed by a delivery
    stating there were none.
