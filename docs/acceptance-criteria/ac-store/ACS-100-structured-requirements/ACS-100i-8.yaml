assigned_agent: python-coder
estimated_complexity: L
package_surface: true
it_requirements:
  config_schema_fragment:
    type: object
    description: >-
      The two additions this AC makes to
      templates/scripts/commit_guardian/commit_guardian.json. Both are entry
      keys in the very registry this check watches — WATCHED_REGISTRIES maps
      this file to ("hooks_manifest.hooks", "list_ids") and ("", "mapping_keys")
      — so registering this gate is itself the act the gate governs.
    properties:
      package_surface_declaration:
        type: object
        description: >-
          Top-level config section read by
          check_package_surface_declaration._is_enabled() through
          config.load_config(). An absent section, an absent `enabled` key, or a
          config that cannot be read all leave the gate ON: a check that
          switches itself off when its own configuration is unreadable is the
          failure mode this tree exists to prevent.
        properties:
          _comment:
            type: string
          enabled:
            type: boolean
            default: true
        additionalProperties: false
      hooks_manifest:
        type: object
        description: >-
          The manifest entry build_precommit.py reads to emit this hook into
          .pre-commit-config.yaml; it renders `stages: [...]` verbatim from the
          entry, so the commit-msg stage is carried by this field alone.
        properties:
          hooks:
            type: array
            contains:
              type: object
              required:
                - id
                - name
                - entry
                - language
                - stages
              properties:
                id:
                  const: check-package-surface-declaration
                tier:
                  const: judgment
                name:
                  type: string
                entry:
                  type: string
                  description: >-
                    Invoked through run_hook.py against
                    scripts/commit_guardian/check_package_surface_declaration.py
                    under {{config.output_root}}.
                language:
                  const: system
                stages:
                  const:
                    - commit-msg
                pass_filenames:
                  const: true
                always_run:
                  const: true
  reference_file_path: templates/scripts/commit_guardian/commit_guardian.json
  n_location_rule: >-
    2 — one top-level config section (`package_surface_declaration`) and one
    entry in `hooks_manifest.hooks` (id `check-package-surface-declaration`),
    both inside the single reference file. Registering only the manifest entry
    leaves the gate running unconfigured; registering only the config section
    leaves it never emitted into .pre-commit-config.yaml. There is no second
    copy to update in this repo — `scripts/commit_guardian/` does not exist
    here, so the template file is the only location, and the hook-parity
    manifest list must not be read as implying otherwise.
  required_skills:
    - python-coder
    - test-writer
    - create-hook
  post_write_commands:
    - "python scripts/build.py --target-dir . --force"
    - "pre-commit install --hook-type commit-msg"
delivers_to: null
