criteria: |
  Given the preflight validation stage exists between reading a ticket and spawning its agent,
  When the documentation step runs for this feature,
  Then a sequence diagram is produced showing the ordered interaction:
    supervisor reads ticket -> preflight stage evaluates fitness -> on fit, phase agent
    is spawned; on unfit, the ticket is held back with a reason and no agent is spawned,
  And the diagram shows both the fit (spawn) and unfit (held-back) branches,
  And the diagram uses a standard notation a reviewer can read without tool-specific training.
