criteria: |
  Given the events on disk contain both "component_convention" and
    "component-convention", and both "agent_memory" and "agent-memory" —
    the same concept written two ways, counted as four distinct kinds,
  When an entry_kind is accepted by the emission helper or read by the
    harvester,
  Then the value is normalised before it is compared against the vocabulary,
    by lower-casing it and treating an underscore and a hyphen as the same
    separator,
  And "component_convention", "component-convention", "Component-Convention"
    and "COMPONENT_CONVENTION" all resolve to one canonical member,
  And the canonical spelling — the one form written into the sink and used in
    every report — is the hyphenated lower-case form,
  And normalisation never invents a member: a normalised value that is still
    not in the vocabulary stays out of the vocabulary and is handled as an
    out-of-vocabulary value.
