it_requirements:
  - "The done-branch enforcement must reuse the SAME session-scoped linkage component built in TQ-100b-1 (one shared classifier with two branches), never a second independent store reader — done and not-done are two outcomes of one per-test classification, so they cannot drift."
  - "A done-AC test's failure must drive the process exit status / overall outcome non-passing with no extra per-test marker required (work_status: done is sufficient and authoritative)."
  - "Must be deterministic under pytest-randomly: a done-AC test is always enforced regardless of seed/order."
