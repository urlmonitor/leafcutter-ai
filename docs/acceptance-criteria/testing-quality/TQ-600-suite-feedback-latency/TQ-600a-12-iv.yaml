it_requirements:
  - >-
    THE TWO SHAPES ARE NOT THE SAME OPERATION AND THE CURRENT DESCRIPTION SAYS THEY
    ARE. Cheaper shape: build into an empty directory, 14.81 s. Private-copy route:
    copy 11,651 entries and 96 MB, then build against that populated copy, 48.94 s.
    Correcting the stated account is part of this record's deliverable, not a
    nicety — it is the only warning the next author will see.
  - >-
    THE GATE COMPARES AGAINST THE TEST'S OWN PRIOR COST, NOT AGAINST A FIXED CEILING.
    A fixed threshold is either so loose it never fires or so tight it fires on load
    noise. Record what the test cost before the move and compare the move against
    that figure, with a tolerance wide enough to survive a shared host.
  - >-
    SEEDING MAKES THE ROUTE CHEAP, SO THE GATE MUST DISTINGUISH SEEDED FROM UNSEEDED.
    A seeded private copy is about 2.07 s and is cheaper than the cheaper shape. An
    unseeded one is 48.94 s. Reporting which shape was used is what makes the figure
    interpretable; a bare duration is not.
  - >-
    DO NOT BLOCK THE MOVE OUTRIGHT — REPORT IT AS A FAILURE WITH BOTH FIGURES. The
    route is sometimes the correct destination even at higher cost, for instance for
    a test that genuinely mutates the package. The requirement is that the cost is
    seen and named, not that it is forbidden.
  - >-
    THIS RECORD IS INDEPENDENT OF THE SEED OPTION AND SHOULD NOT WAIT FOR IT. The
    cost bound is worth having whether or not seeding lands, because TQ-600a-8's
    migration can start moving files at any time.
