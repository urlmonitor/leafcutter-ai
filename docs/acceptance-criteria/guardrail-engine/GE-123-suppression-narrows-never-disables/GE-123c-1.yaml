notes: |
  THE DIRECTLY OBSERVED INSTANCE, and the generalisation chosen for it.
  The observed defect is a trailing explanatory note on a suppression line. The
  criterion is NOT written as "support comments" and NOT as "reject comments" —
  it is written as the third option the L1 asked for: detect the entry that can
  never match. The comment is one route in; a decimal typo and the shapes in the
  L3 child are others, and one predicate closes all of them.

  WHY THE LINE-NUMBER FIELD HAS A DECIDABLE PREDICATE AND THE PATH FIELD DOES NOT.
  A suppression matches a finding's line only when the field holds the wildcard or
  the finding's own line number as decimal text; every other value is inert by
  construction, and that is knowable when the entry is read, with no reference to
  any file on disk. The file-path field has no equally clean rule — a path may
  legitimately name a file that does not exist yet — which is why the sibling
  criterion for that field is keyed on a much narrower signal.

  SCOPE FENCE. This is the "cannot ever match" signal, detectable at read time.
  The weaker after-the-fact signal — an entry that could have matched but did not
  during a run — is deliberately NOT reported; see the sibling L3 that fixes that
  boundary.

  NO SECOND WARNING CONVENTION. The announcement here is the one GE-113c-3-v
  already established, extended to a new class of line. A differently-shaped
  warning about the same file from the same loader would be its own defect.

  VERIFICATION STANDARD FOR THIS TREE. A sibling audit in this family found two
  criteria verified only against the matching logic in isolation that described
  situations the real entry point can never produce. Every arm above must be
  exercised with a real temporary allowlist file and real files on disk through
  the multi-file entry point; coverage of the matcher in isolation does not
  discharge it. Examples use ordinary source filenames, never environment-file
  names, per the tree-wide authoring constraint.

  IT-PO TECHNICAL ENRICHMENT, 2026-08-18. The surface is the three-field split
  performed when the allowlist is read; the reachable entry point for every arm is
  the multi-file scan function the pre-commit check imports. Left at python-coder,
  complexity M (one predicate plus its announcement, in one module, with the
  existing warn-and-skip path reused rather than rebuilt).
