notes: |
  Edge case the user's read-only list implies: pytest is read-only for the user's purposes but
  writes __pycache__ and .pytest_cache on disk. An after-the-fact comparison that counts every
  changed path stops every test run. Named mutation that turns ONLY this record red: count every
  changed path under a watched folder. GE-130d-1's own pairing uses printing/listing commands too,
  so the by-product rule is isolated here.

  declares_side_effect: false.
