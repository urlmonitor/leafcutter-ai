notes: |
  Authored 2026-10-21. The observed failure reported only the store's timeout error, which
  names neither the statement nor the batch; the operator's guide says so outright. The
  operator could not tell whether to raise a limit, shrink batches or look for one
  oversized record. Naming the phase, the batch and its size answers that.

  Progress figures in the first scenario count only batches that completed (33 x 250 =
  8,250), which may differ from what an earlier partial attempt left in the store before
  cleanup; the observed run reported 8,237 nodes in the store at abort.
