id: ACD-1200b-5-ii
components:
  - ac_driven_dev
readiness: approved
priority: high
title: "Promotion preserves a multi-line amended_by history, and success is never reported for output the mechanism cannot itself parse"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/ac-driven-dev/ACD-1200-goal-to-epic/ACD-1200b-5.yaml"
criteria: |
  Given a stored leaf AC at readiness: reviewed whose amended_by list already
    holds a multi-line entry — an entry whose value spans several lines and
    contains blank lines between its paragraphs, serialized exactly as the store
    writes such records today (the GE-123a-4 record of 2026-08-31 is one),
  When the approval mechanism promotes that leaf,
  Then the record written to disk parses as a single YAML document,
  And its amended_by list holds every entry it held before the run plus exactly
    one new approval entry,
  And each pre-existing multi-line entry still carries its full text, blank
    lines included,
  And readiness is the only other field whose value differs from the record as
    it stood before the run,
  And the run exits with status 0.

  Given the same reviewed leaf,
  And the text the mechanism is about to store for that leaf does not parse as
    YAML,
  When the approval mechanism runs,
  Then the record left on disk is byte-identical to the record as it stood
    before the run,
  And the run names that record as a failure,
  And the run exits with a non-zero status,
  And no line describing that record as promoted appears anywhere in the run's
    report.
depends_on: [ACD-1200b-5]
