risk_surface: contract_boundary
package_surface: false
criteria: |
  Given /build-feature is started for EPIC-TruthfulProjectRecord and reaches the
    worktree step of Phase 0
  And `scripts/worktree_repo_facts.py` returns correct JSON for both the
    `worktree-facts-resolved` and the `worktree-base` reads
  And the reporting agent that relays those reads answers one level too deep — the
    value it puts in the envelope's `output` field is itself a complete envelope
    `{"output": "<raw stdout>", "exit_code": 0}` rather than the raw stdout
  When the workflow reads those repository facts
  Then it obtains the same facts object it would have obtained from the raw stdout —
    `worktree_base` is present for the base read, and `exists`, `is_linked_worktree`,
    `is_main_checkout` and `same_repository` are present for a facts read
  And the run proceeds past the worktree step on those facts
  And the bug symptom ("Every /build-feature epic run aborts in Phase 0 with
    abort_reason 'worktree-base-unavailable' and builds nothing, although
    scripts/worktree_repo_facts.py returns correct JSON. Reproduced twice on
    2026-09-25 (runs wf_6d6f8dda-97e and wf_f898fd1a-412) against
    EPIC-TruthfulProjectRecord: both the worktree-facts-resolved and worktree-base
    steps succeeded, but the workflow read no fields from them.") must not occur.

  Given the same worktree step
  And the reporting agent answers at the expected depth, so the envelope's `output`
    field holds the helper's raw stdout
  When the workflow reads those repository facts
  Then the facts object is returned unchanged, with no second parse applied to it
  And a facts object that legitimately carries its own `output` or `exit_code`-named
    field is not mistaken for an envelope and stripped.

  Given the same worktree step
  And the value relayed for a read is not parseable as JSON at all, or the relayed
    reply reports a non-zero exit code, or no reply comes back
  When the workflow reads those repository facts
  Then no facts object is produced
  And the run refuses with the existing worktree-undetermined abort rather than
    guessing a worktree base or a worktree location
  And no phase agent is dispatched.
