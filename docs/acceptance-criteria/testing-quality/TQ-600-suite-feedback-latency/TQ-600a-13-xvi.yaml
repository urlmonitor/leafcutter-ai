id: TQ-600a-13-xvi
components:
  - testing_quality
title: "A pull request that declares a fix runs the current red run's failing tests against its own head, and only a pass is evidence"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a red or did-not-complete correctness run on main described by notice N, and a pull
    request whose description declares a fix for N in a form TQ-600a-13-viii accepts,
  And the reason a declaration alone cannot exempt it: every pull request here comes from
    the one account all agents use, so a declaration is something any pull request can
    write about itself, and the commonest defect of a fix is that it does not fix,
  When the declaration is present on the pull request's current head,
  Then a proof run executes, against that head, exactly the correctness-lane tests that
    failed in the current red run — with the same selection, build and strictness as the
    post-merge run — and records whether every one of them passed, and which red run it
    proved against,
  And for a did-not-complete run, which has no failing tests, the proof run executes the
    whole correctness lane against the head and passes only if that run is green by
    TQ-600a-13-ii's and -v's rules,
  And a pull request without a declaration starts no proof run, so the proof's cost falls
    only on the one or two fix pull requests of a red streak,
  And the proof run's completion causes that pull request's hold to be evaluated again
    without a push,
  And a pull request that changes the proof's own harness — the definition that selects
    the tests and judges the result — does not obtain a passing proof from its changed
    harness: the selection and the judgement are those of the main branch,
  And no code from the pull request runs in any job that holds a write-scoped credential
    or any secret,
  And the proof run makes no write to the hosting service other than reporting its own
    result,
  And each of these is demonstrated by executing the proof job's selection and judgement
    against a synthetic project in which the red run's failing tests are made to pass or
    fail at the head, with a head that also alters the harness, never by reading the
    workflow file.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-viii
