test_spec:
  - name: test_docstring_declaration_is_recognised_without_crash
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Scenario 1. Writes a real temp file test_ge128_alpha.py whose only test,
      test_alpha, has no tag above its def and opens with the docstring
      "Checks alpha. covers: GE-128a-1"; runs the real hook CLI
      (sys.executable + templates/scripts/commit_guardian/check_test_ac_tags.py
      <path>) with CHECK_TEST_AC_TAGS_MODE=error on the current interpreter and
      asserts exit 0, no line naming test_alpha as missing a tag, and neither
      "Traceback" nor "AttributeError" in stdout or stderr. RED on the current
      code under Python 3.14 (the docstring branch crashes, exit 1 with
      AttributeError).
  - name: test_undeclared_docstring_test_is_a_violation_not_a_crash
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      Scenario 2. Real temp file whose only test, test_beta, opens with the
      docstring "Checks beta." and carries no declaration anywhere; runs the
      real hook CLI twice. With CHECK_TEST_AC_TAGS_MODE=warn it asserts exit 0
      and a WARNING line naming the file path and test_beta. With
      CHECK_TEST_AC_TAGS_MODE=error it asserts exit 1 and an ERROR line naming
      the file path and test_beta. In both modes it asserts neither "Traceback"
      nor "AttributeError" appears, so the error-mode exit 1 is proven to be a
      refusal and not a crash. RED on the current code under Python 3.14.
  - name: test_non_string_constant_first_statement_is_no_declaration
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      Scenario 3. Real temp file whose only test, test_gamma, has the bare
      expression 42 as its first body statement and no declaration anywhere;
      runs the real hook CLI in error mode and asserts exit 1, an ERROR line
      naming test_gamma exactly as in Scenario 2, and no "Traceback" or
      "AttributeError" in the output. Fails if the string-type guard is
      dropped or if a non-string constant is treated as a declaration. RED on
      the current code under Python 3.14.
  - name: test_hook_source_uses_no_version_specific_constant_accessor
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: real_artifact
    description: >-
      Scenario 4 (version-independence proof on one interpreter). Parses the
      tracked source templates/scripts/commit_guardian/check_test_ac_tags.py
      with ast and asserts it contains no attribute access named s or n (the
      deprecated ast.Constant aliases removed in Python 3.14), so the payload
      is read only through .value, which exists on 3.13 and 3.14 alike. RED on
      the current code, which reads value.s at lines 143-144.
  - name: test_same_verdict_across_modes_is_version_independent
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Scenario 4 (behavioural half). Runs the real hook CLI once per mode over
      the three Scenario 1-3 files together and asserts the reported
      undeclared set is exactly {test_beta, test_gamma} (test_alpha absent),
      the exit code is 0 in warn and 1 in error, and no run emits a traceback.
      Combined with the source-accessor test this pins the verdict to logic
      that is identical on every supported interpreter.
  - name: test_real_km_kgs_100a_3_files_reach_a_verdict_without_traceback
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      Scenario 5. Runs the real hook CLI in warn mode over each of the repo's
      unit_tests/test_km_kgs_100a_3.py, test_km_kgs_100a_3_i.py,
      test_km_kgs_100a_3_v.py, test_km_kgs_100a_3_viii.py and
      test_km_kgs_100a_3_ix.py (resolved from the repo root, asserted to
      exist) and asserts, per file, exit 0 and neither "Traceback" nor
      "AttributeError" in the output. It deliberately does NOT assert which
      tests are declared or undeclared. RED on the current code under Python
      3.14 (every file exits 1 with AttributeError).
test_rationale: >-
  Every behavioural test drives the real hook CLI over real temp or committed
  files because the defect lives in the docstring branch reached only through
  main -> check_file on a parsed file; a helper test on a hand-built AST is the
  shape that hid the bug. Scenario 4 is not run on two interpreters at test
  time: CI is 3.13 and this machine is 3.14, so a dual-interpreter test would be
  unrunnable or skipped in both places. Instead an AST scan of the tracked
  source fails if any .s/.n accessor remains, which together with the
  behavioural tests on the current interpreter proves the verdict cannot vary
  by version. Verdicts are asserted by forcing CHECK_TEST_AC_TAGS_MODE, since
  the configured default is warn (exit 0 either way) and would hide the
  refusal-versus-crash distinction; Scenario 5 uses warn so exit 0 plus no
  traceback is an unambiguous no-crash signal. Fixtures use the simple id
  GE-128a-1 because COVERS_REGEX cannot match compound ids such as
  KM-KGS-100a-3-i (known adjacent defect, out of scope); for the same reason
  Scenario 5 asserts only that a verdict is reached without a traceback or
  AttributeError and never that the KM-KGS-100a-3 files come back as declared.
