notes: |
  WHY THIS IS IN THE GOAL AT ALL, RATHER THAN BEING POLISH. The pressure that
  destroys a size standard is the cost of complying with it at the moment you are
  blocked. Faced with a bare verdict and a deadline, the cheap responses are to
  strip content until the number falls, to raise the limit, or to switch the gate
  off — and the guard's own message already anticipates the first of these by
  telling authors not to do it. Telling people not to take the cheap path is
  weaker than making the expensive path cheap. This criterion is what keeps the
  other four from being eroded in practice.

  THE HONESTY CONSTRAINT — LOAD-BEARING, AND THIS COMPONENT HAS THE SCAR. A
  refusal message may only claim help that actually arrives. There is a recorded
  anti-precedent here: a gate documented as automatically dispatching a triage
  agent does not do so, and every author who read that line believed they were
  covered. Whatever this criterion promises in a refusal must be something a
  reader can act on and a test can prove happens. A message naming a tool that is
  not invoked, or a step that does not run, is worse than a bare verdict, because
  it converts a known gap into a false belief.

  WHAT "ROUGHLY WHERE" MEANS, AND WHAT IT DOES NOT. The obligation is to reduce
  the next step from research to a decision — enough about what the file contains
  and how it divides that an author can see a plausible seam. It is NOT an
  obligation to produce a correct or complete refactoring plan, and a decomposition
  that reaches for one has left this goal and entered CR-100's and INF-800's
  territory. Set the bar at the point where the author stops investigating and
  starts choosing.

  DO NOT SETTLE THIS WITH THE PRESENCE OF TEXT. "The refusal includes remediation
  guidance" is not an acceptance criterion; a fixed sentence pointing at a tool
  satisfies it and is what exists today. Bind the acceptance to the guidance being
  ABOUT THE FILE IN HAND: two different oversized files must not produce the same
  advice, and the advice must change when the file's contents change. That is the
  discriminator between guidance and a template.

  BOUNDARY WITH GE-127d, WHICH IS EASY TO BLUR. That L1 requires the limit and the
  reported size to be true and reproducible. This one requires the refusal to be
  actionable. A gate can be perfectly honest and completely unhelpful, and
  perfectly helpful about a limit it is not enforcing.
