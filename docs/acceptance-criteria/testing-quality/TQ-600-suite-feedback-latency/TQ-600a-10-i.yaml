test_spec:
  - name: test_tq600a_10_i_a_removed_entry_turns_the_affected_test_red_and_names_itself
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "the affected test stays green because its assertion matches any non-zero exit rather than the reason, so a copy short of a required entry is indistinguishable from a correct result"
      - "the test goes red but the message is a generic build failure that does not name the removed entry, leaving the next reader to bisect the copy by hand"
    description: >-
      Remove a required entry from the synthetic copy and execute the build. The
      affected test goes red and the message names the removed entry.
  - name: test_tq600a_10_i_a_missing_path_refuses_rather_than_yielding_a_default
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: discrimination
    must_catch:
      - "the raise is replaced with an empty string or other default, so a missing path flows onward silently — the exact shape this record exists to prevent, and the natural thing to write"
    description: >-
      Ask the copy for a path it does not provide. It raises and names the path.
  - name: test_tq600a_10_i_each_failure_asserting_test_matches_its_own_provoked_reason
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "a failure-asserting test stays green under an injected failure that is not the one its own mutation provokes, which means it asserts only that something went wrong"
      - "the injected unrelated failure is itself a missing path, making the injection and the hazard under test the same event, so the descriptor passes while discriminating nothing"
    description: >-
      For each of the three failure-asserting tests (lines 430, 598 and 723), inject a
      different, unrelated build failure of a DIFFERENT KIND from a missing path, in
      place of its own mutation. The test goes red. THIS IS THE DESCRIPTOR THAT CANNOT
      BE DROPPED: without it, "the build failed" and "the build failed for the declared
      reason" are indistinguishable and the smaller copy is unsafe.
  - name: test_tq600a_10_i_a_sound_copy_leaves_every_test_green
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The paired control. Against an unmodified synthetic copy, all five tests pass.
test_rationale: |
  Shrinking a copy carries a risk that sharing one does not: these tests assert that a
  build fails, so making the build fail for an unrelated reason produces the same green
  result as the behaviour under test. The reason-matching descriptor is the whole
  record; the others support it.

  The unrelated-failure injection is the only way to tell a test that proves something
  from a test that merely observes a non-zero exit. It is deliberately specified as an
  injection rather than as a reading of the assertion text, because an assertion that
  looks specific can still be satisfied by any failure if the matching is loose.

  The control exists because three red-demanding descriptors with no green path would
  be satisfied by a copy that never works.
