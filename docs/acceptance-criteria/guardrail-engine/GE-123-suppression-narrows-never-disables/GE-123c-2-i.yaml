notes: |
  THIS COMPLETES THE FIELD SWEEP. With the line-number field and the file-path
  field covered by the two sibling criteria, the rule-id field is the last place an
  entry can parse cleanly into something unmatchable. Kept as an edge case rather
  than promoted to its own behaviour because it shares the predicate shape and the
  entire announcement with its parent; it earns a place only because the byte-order
  mark and the trailing space are invisible on screen, which makes them the hardest
  instances of this whole class for an author to diagnose unaided.

  THE POSITIVE ARM IS LOAD-BEARING AND MUST TRACK THE RULE SET. The check compares
  against the rules the scanner can actually report, so adding a rule without
  adding it to that comparison would start rejecting valid new suppressions. The
  second arm exists to fail the moment the two drift apart, and it must enumerate
  the rules from the scanner's own rule set rather than a copy written here.

  A LOWER-CASE OR OTHERWISE MIS-CASED RULE ID IS INTENTIONALLY LEFT AS A REJECTION,
  not a case-insensitive match: quietly accepting "entropy_high" would be another
  instance of guessing at intent, which is the habit this L1 removes.

  IT-PO TECHNICAL ENRICHMENT, 2026-08-18. The BA's "enumerate from the scanner's own
  rule set" instruction has a concrete obstacle worth naming: there is no such set
  today. Some rule ids are declared in the module's rule table; the sensitive-filename
  and high-entropy ids are emitted inline by the per-file scan and appear nowhere as
  data. Creating that single canonical set is part of this AC's work, not an
  assumption it can make — hence the first it_requirement.
