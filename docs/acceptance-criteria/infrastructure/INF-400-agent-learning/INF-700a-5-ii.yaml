title: "A record emitted too late for this run to route is counted and named as waiting, and the next completed unit of work picks it up"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
priority: medium
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a-5.yaml"
criteria: |
  Given the declared knowledge-emission sink is an absolute path fixed when the
    package was built into this project rather than a name each process
    resolves against wherever it started, so one sink serves the whole install
    and a record emitted inside an isolated working directory is still in it
    after that directory has been removed,
  And an agent can emit a record after this unit of work's routing step has
    already read the sink, because the phases that publish the work emit too,
  When the unit of work completes and its working directory is removed,
  Then the reported result states how many records were in the sink at the end
    of the unit of work and how many the routing step read, and names the
    difference rather than leaving it implied,
  And a record the routing step never read is not reported as routed, as
    written, or as nothing-to-do,
  And that record is described as waiting for the next completed unit of work,
    and the description is true of the world: the record is still in the sink
    when read from outside the removed working directory, a later completed
    unit of work in the same install routes it, and the learning reaches its
    destination exactly once,
  And the wait is stated as a wait with something a reader can act on attached
    to it — the next completed unit of work in this install — rather than as
    a finished outcome, and no surface calls such a record lost, discarded or
    reclaimed, because none of those describe a record that is still sitting
    where it was written,
  And a record left waiting is genuinely outstanding: it carries learning text
    and a later run writes it, so it counts towards the knowledge waiting to be
    written, and a count that rises while records wait and returns to zero once
    they are written is the rule against a permanently non-empty backlog
    working rather than being broken — that rule forbids retaining records
    nothing can ever write, and these are records the next completed unit of
    work does write,
  And where nothing further completes in that install, the records still
    waiting remain findable by asking, so an indefinitely deferred tail is
    visible to a person standing in that project rather than silent,
  And on a completion path where nothing emits after the routing step has read
    the sink, the difference is zero, so the figure reads as a real signal and
    not as permanent background noise.
