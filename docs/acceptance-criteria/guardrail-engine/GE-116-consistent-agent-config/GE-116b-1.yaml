id: GE-116b-1
components:
  - commit_guardian
title: "Block message names the offending definition and both valid fixes"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
assigned_agent: python-coder
estimated_complexity: S
criteria: |
  Given a commit is blocked because a staged agent definition requires
    verification while granting neither the ability to edit nor to create files,
  When the block message is shown to the person committing,
  Then the message identifies the specific offending agent definition,
  And it states both valid fixes: grant the ability to edit or create files, or
    mark the agent as not requiring verification,
  And the message is specific enough to resolve without searching for which
    definition is at fault.
