assigned_agent: adr-author
estimated_complexity: S
it_requirements:
  - "Edit surface: docs/architecture/adrs/ADR-010-ac-store-as-authoritative-backlog.md only. It is an amendment of ADR-010, not a new ADR: no new ADR number is allocated and no superseding record is written. The ADR index (docs/architecture/adrs/README.md) row for ADR-010 is edited only if the amendment changes a value that row shows (status, title); otherwise it is left untouched."
  - "The store's vocabulary is used verbatim so the ADR reads the same as the records it cites: the field name `declared_files`, the entry markers `existing` / `to_be_created`, the state phrase 'no declared files', the ticket label 'derived, not declared', and the single read seam scripts/ac_store/declared_files.py."
  - "Every link the amendment adds (ACD-1600c-4, TKT-600a-3, TKT-600a-3-i, KI-ACS-002) is a relative Markdown link that resolves from the ADR's own directory to an existing file; the paths are also added to the ADR's frontmatter related_docs list."
  - "Frontmatter stays valid for the project's documentation frontmatter checks: last_updated is set to the amendment date and the existing title, type, status and created values are unchanged."
  - "The original decision text is preserved: outside the amendment section, the only edits are the qualifications (or pointers to the amendment) on the two doc_links -> files_touched statements in Context and Consequences / Positive. No other existing sentence is deleted or reworded."
  - "The amendment states the rule's delivery status truthfully at the time it is written: if TKT-600a-3 / ACD-1600c-4 have not shipped, the rule is stated as decided and pending implementation. In no wording does the ADR say the legacy derivation has been removed."
delivers_to: null
