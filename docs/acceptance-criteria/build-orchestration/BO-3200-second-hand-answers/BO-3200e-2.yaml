id: BO-3200e-2
title: "An undetermined outcome still stops the work — fail-closed is preserved, only its wording changes"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a check that reports it could not tell,
  When whatever depends on that check continues,
  Then the work the check guards does not proceed.

  Given the same check reporting it could not tell,
  When the overall outcome of the run is read by whatever consumes it,
  Then the outcome is not one that means everything checked out.

  Given a check that reports it could not tell,
  When its report is compared with the report it produces when it inspects successfully and
    finds a problem,
  Then both stop the work, and the two reports differ in what they say happened.
depends_on:
  - BO-3200e
  - BO-3200e-1
doc_links:
  - path: docs/known-issues/build-orchestration.md
    relationship: describes
