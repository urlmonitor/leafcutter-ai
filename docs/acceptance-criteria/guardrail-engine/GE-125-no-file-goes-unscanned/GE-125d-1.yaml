it_requirements:
  - "ADR-001 parity is mandatory. The reduction and the notice both live in templates/scripts/commit_guardian/check_secrets.py, which is the canonical copy; scripts/commit_guardian/check_secrets.py and .leafcutter/scripts/commit_guardian/check_secrets.py are build.py outputs and check_hook_parity enforces all four locations. Edit the template, then run `python scripts/build.py --target-dir .` before running the tests. A deployed-copy-only fix is silently reverted by the next build."
  - "MEASURED IN THE CANONICAL COPY ON 2026-08-24, not assumed, and load-bearing: main() returns 0 at the `if not findings` guard BEFORE producing any output, and a run whose only effect was withholding takes exactly that path today. The notice must be emitted on that path. A notice added inside the existing findings-printing block is unreachable in precisely the case this AC is about, and would pass a code review while covering nothing."
  - "The withheld set must be derived at the point the reduction is applied — today _filter_prose_findings is called per staged file inside main(), so the withheld set for a file is exactly what that call removed from that file's findings. Do NOT derive it by re-scanning with the reduction disabled: that path also re-surfaces findings the .security-allowlist had already suppressed inside scan_files, which reintroduces the double count GE-125d-1-ii forbids."
  - "THE NOTICE MUST NEVER CONTAIN THE MATCHED VALUE, THE MATCHED LINE, THE FINDING EXCERPT, OR ANY SUBSTRING OF ANY OF THEM. Repository-relative path, per-file withheld count and the stable reduction name are the WHOLE payload. This is a deliberate departure from the GE-113c-3-v warning contract, which does echo the offending text, and NO LATER REVIEWER MAY HARMONISE THE VALUE BACK INTO THE NOTICE for consistency with the findings report, with GE-113c-3-v, or with any sibling notice. This notice concerns a value the check has just decided NOT to report; printing it writes a candidate credential into the terminal, into CI capture and into any log that retains it, turning each wrong exemption decision into an exposure. Any change that adds the value, the line, or an excerpt of either to this notice is a regression regardless of how the surrounding text is worded."
  - "Announce on EFFECT, never on application. The notice fires only when at least one finding was actually withheld — not whenever the reduction applied to a staged file. The reduced locations include the acceptance-criteria store, the ticket tree and the retrospectives, so announcing on application would print dozens of lines on an ordinary documentation commit and train readers to skim past the one line that mattered."
  - "The notice must not influence the exit status in either direction. Exit status stays decided solely by the findings that were REPORTED, and must be the same decision the check makes today. A withheld finding is evidence of an unexamined region, not of a credential; blocking on it across a store of thousands of prose files would drive people to switch the check off, which is the outcome this goal exists to prevent."
  - "The reduction must be attributed by a stable identifier drawn from a fixed, closed vocabulary defined in exactly one place, identical between two runs over the same input. Not a sentence composed per finding, and not any rendering of the value. Two notices that cannot be compared across runs cannot show anyone that the reduced set has widened, which is the standing purpose of this L1."
  - "CLAUDE.md error-handling policy applies. The notice emitter performs I/O, so its writes are wrapped in a typed except that logs at WARNING or higher and never silently swallows — and a failure to emit the notice must never crash the commit path or change the exit status. Do not wrap the pure withheld-set accounting in try/except (Rule 4)."
  - "The withheld-set accounting must stay O(number of findings) over the already-scanned set and must add no second pass over file contents. This check runs on every commit, over staged sets that routinely exceed a hundred files."
  - "Keep the fixture placement the criteria specify, and keep it repository-relative and explicit: two fixtures under reduced locations because for THIS L1 the reduction is the subject, and src/app.py outside them as the control that makes the counting arm falsifiable. If GE-125a, GE-125b or GE-125c lands first and one of the two reduced paths stops being reduced, swap it for a path that still is — do NOT weaken the arm to 'some file somewhere', and do not drop the control file as redundant."
delivers_to:
  agent: python-coder
  contract: "The per-run set of withheld findings — for each one, the file it was found in, the count per file, and the stable name of the reduction that withheld it — determined without the matched value leaving the check. GE-125d-2 exposes this same set to a caller, GE-125d-3 governs when it is spoken aloud, and neither can be satisfied by a reduction decision that does not carry the granting rule forward."
