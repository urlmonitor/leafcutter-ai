notes: |
  Rules the brief named as deterministic: the file-extension-to-surface table, two-way
  symmetry of producer/consumer contracts, the graph-component list fix-up, readiness
  defaulting, parent back-links, documentation-trigger mapping, and most of the final
  self-check list. Each rule moved here must also be REMOVED from the planner's
  instructions, otherwise the outcome (a shorter, judgment-only planner) is not
  delivered. The BA must first inventory existing store checks (a schema checker is
  already installed by the build) and extend rather than duplicate them.
