title: "Agents cite knowledge-graph findings in their output to support deduplication and cross-referencing"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given any of the three authoring agents (PO v3, BA v3, IT PO v3) has
    received results from a knowledge-query invocation during S1,
  When the agent detects that a knowledge-graph node overlaps with a behavior
    it is about to author or enrich,
  Then it presents the overlap to the user before proceeding, stating:
    the overlapping node's surface, title, and id (e.g., "[agents] python-coder"
    or "[docs] architecture/components/build-orchestration.md"),
  And when the overlap is with an existing AC, the agent includes the
    overlapping AC's id and title in a deduplication warning
    ("ACD-200a-1 already specifies this behavior — skipping or creating a variant"),
  And when the overlap is with a doc or ADR, the agent adds the path to the
    new AC's doc_links field with relationship: "context",
  And if no overlapping nodes are found, the agent logs an assumption:
    "knowledge-query returned no related nodes for <query> — proceeding
    with file-based context only" and does not block.
