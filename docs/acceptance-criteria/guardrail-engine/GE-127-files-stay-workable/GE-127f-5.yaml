notes: |
  WHY THIS EXISTS. GE-127f's obligation assumes a remedy: if a file is too long, move
  code out of it into a companion file. For templates/workflows-js/ that remedy does not
  exist. ADR-030 records, from measurement against the real engine, that an E2 workflow
  is executed as a TOP-LEVEL BODY whose bare `return` is the workflow result. A top-level
  body cannot carry a static import (SyntaxError), and the injected global set contains
  no module loader at all — no require, no import, no fs. A refactor attempt on
  2026-09-30 stopped at this exact wall before changing a byte, and the evidence is
  four-fold: the ADR, the harness's own docstring, the absence of any import site across
  all eight files in that directory, and the fact that plan-feature.js and
  finalize-feature.js DUPLICATE a shared helper across two files and each explain in a
  comment that extraction is impossible.

  There is a deployment trap that makes a half-measure worse than none: build.py globs
  workflows-js/*.js and registers every match as an invocable workflow, so a "helper"
  sibling WOULD be copied next to the lane and WOULD be registered as a workflow, while
  remaining unreachable from it at runtime. Present on disk, unreachable in use — the
  shape this repo files as the deployed-layout no-op trap.

  WHAT THIS IS NOT. It is not a judgement that fast-lane-ship.js is an acceptable size.
  It is 1587 measured lines against a permitted 1000, and that is bad. The point is
  narrower: under GE-127f-2 the gate measures what a change PUT IN rather than net
  growth, and GE-127f-4 enforces a two-for-one obligation, so every change to that file
  must now pay for itself twice over out of a file that cannot be reduced structurally.
  The standard therefore refuses changes that no author can satisfy, which is a different
  failure from a file merely being too long.

  THE HONEST COST, recorded so the next reader can weigh it. This removes the pressure
  that would otherwise force the problem to be confronted. The durable fix is to stop
  expressing orchestration this size in a sandboxed JS body at all — the owner's stated
  mid-term direction is LangGraph. NESTED WORKFLOWS ARE NOT AN INTERIM: an earlier draft of
  this record claimed the engine's workflow() global runs a child workflow inline, one
  level deep. That is false for E2. docs/reference/workflow-authoring-contract.md (Edge 5,
  and its "Workflow nesting" row) and ADR-030 both record that workflow() THROWS when
  called from a running E2 workflow — a leaf-invariant guard, usable only as an
  engine-detection probe — and no script in templates/workflows-js/ calls it. The interim
  that IS available keeps the JS as control flow only and moves the substance out of it:
  deterministic steps into Python scripts the lane runs through command-step-runner (as
  setup_ticket_worktree.py already is for worktree creation), and judgment steps into
  agents. Both are reachable from E2 today, and both are what a later framework's nodes
  would call anyway.

  SCOPE DISCIPLINE. One declaration, templates/workflows-js/, reasoned from the engine
  constraint rather than from the file's length. If a second location is ever proposed,
  the question to ask is the one this record turns on: is the standard's remedy actually
  unavailable there, or merely inconvenient?

  WHY NO CEILING, AND WHY THAT IS AN OPEN QUESTION RATHER THAN A SETTLED ONE. The
  sibling document-side record GE-127g-5 requires every set-aside location to declare a
  size beyond which its contents are REPORTED (never refused), and says flatly that no
  location may be set aside without one. This record ships without one. Three reasons,
  recorded so the asymmetry is reviewable:

    - GE-127g's population is GENERATED. A regenerated document grows because unrelated
      work landed elsewhere, so without a ceiling there is no signal at all that anything
      changed. This record's population is HAND-AUTHORED: every measured line in
      fast-lane-ship.js was typed by someone, and the gate already prints the file's
      measured length and its permitted length on every run that touches it. Runaway
      growth is therefore visible here without a named threshold, which is weaker than a
      ceiling but is not silence.
    - GE-127g is approved and NOT BUILT (work_status todo at the time of writing). Fixing
      this record's shape to an unbuilt sibling's design would guess at a mechanism that
      may change before it ships, and would be a second implementation of it either way.
    - A code-side ceiling is a real decision with a cost — it reintroduces a number
      somebody must maintain for a file nobody can split — and it should be taken
      deliberately, alongside whoever builds GE-127g, rather than inferred here.

  SO: if the two mechanisms are unified, settle the ceiling first and treat GE-127g-5's
  answer as the incumbent. Do not read this record's silence as a judgement that a
  ceiling is wrong; read it as a question left open on purpose.
