change_target: code
risk_surface: contract_boundary
notes: |
  This is the must_block modifier from docs/testing/test-angles.md applied to the
  exemption path: an exemption gate that cannot refuse is inert, and a
  positive-path test alone cannot tell the difference. The known-bad input
  (declaration present, reason absent) must go through the SAME entry point as
  the honoured case in TQ-400e-3 — a separate validator exercised only from a
  unit test would leave the production path unguarded.

  Why this matters concretely: the mechanism as it stands today
  (check_done_proof.py:463) honours test_required: false with no reason
  whatsoever. Without this AC, TQ-400e-3 could be "satisfied" by a system in
  which every unproven record is escaped by adding one field, which would make
  the entire sweep decorative.

  Regression risk to watch: a fail-open implementation that treats an unreadable
  or malformed reason as present. Refusal must be the default when the reason
  cannot be positively confirmed.

  IT-PO ENRICHMENT NOTE (2026-08-17). Three additions. First, the schema permits
  test_rationale: null (config/ac_store_schema.json types it string|null), so
  schema validation alone will never catch a reasonless declaration — the gate has
  to live at the sweep, which is why the entry-point identity is stated as the
  contract rather than as a preference. Second, a third 'refused' outcome sitting
  outside the demotable population is an easy and completely defeating
  implementation, so it is explicitly forbidden. Third, the gate must test
  PRESENCE and not QUALITY: a content heuristic on the reason text would be
  unfalsifiable and trivially gamed, and TQ-400e-3 already puts the reason in the
  report precisely so a human judges it.
