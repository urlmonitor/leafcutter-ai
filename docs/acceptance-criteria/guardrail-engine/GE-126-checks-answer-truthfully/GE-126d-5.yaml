assigned_agent: documentation-expert
estimated_complexity: M
it_requirements:
  - "The reference must render its leg list from the single declaration rather than writing the legs out as prose. A reference that restates them is the third copy of the list and will drift the way the first two did."
  - "No number of legs may appear anywhere - not in the reference and not in the test that covers it. The declaration owns the count and a hardcoded four is a fourth copy of the list wearing a number."
  - "The blocks-versus-repairs sentence must be present and unambiguous. The most damaging misreading available to a reader of the roster is that membership decides whether a check is enforced; it decides whether a repair is attempted. GE-126d-2 pins that behaviourally and this record makes sure the reader is told."
  - "The reference must state that a check absent from the roster with no recorded exclusion is a reported finding rather than a valid state, so a reader meeting the warning knows it names a decision they have not yet made."
  - "The dated observation must be recorded as an observation with its date, and the approved record specified against three legs must be named as an illustration only - not edited, and not made to depend on this work."
  - "Frontmatter and doc-type conventions must satisfy check_doc_frontmatter and check_doc_types_agents at the commit that lands the page."
test_spec:
  - name: test_every_leg_the_reference_describes_is_treated_as_a_leg_by_the_parity_check
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_hook_parity.py"
    description: "Each leg is read out of the shipped reference and, for each, a fixture check omitting exactly that leg is registered and the parity check is asserted to report it. A leg the reference describes that the parity check does not enforce fails here."
  - name: test_the_references_leg_list_moves_when_the_declaration_moves
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: "A leg added to the declaration in a fixture tree appears in the rendered reference with no edit to the reference's text - proving the list is rendered rather than stored."
  - name: test_no_leg_count_appears_in_the_reference_or_in_this_test
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: boundary
    description: "The reference states no number of legs, and the assertions here are written against the declaration's contents rather than against a literal count - the coverage note bars the hardcoded number explicitly."
  - name: test_an_excluded_check_still_blocks_matching_what_the_reference_states
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: failure
    description: "The reference's blocks-versus-repairs sentence is exercised: a fixture check carrying a recorded exclusion is run against input that genuinely violates its rule and still blocks. A reference that stated the opposite would fail against the behaviour rather than pass on a string."
test_rationale: |
  Two failures are available to this page and neither is caught by a presence test. The
  first is describing a leg the parity check does not actually enforce, which the first
  descriptor catches by registering a fixture that omits each described leg in turn. The
  second is stating the blocks-versus-repairs relationship backwards — the single most
  damaging misreading a reader can take from a roster — which the fourth descriptor
  catches by running an excluded check against violating input. The count assertion is
  written negatively and applies to the test as much as to the page: the coverage note
  names a hardcoded leg count in a test as the very second copy this branch exists to
  remove, so the test asserts against the declaration's contents rather than a number.
delivers_to: null
expects_from:
