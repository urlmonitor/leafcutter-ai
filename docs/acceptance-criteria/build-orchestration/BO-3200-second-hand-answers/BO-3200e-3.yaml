notes: |
  The parent L1's scope is exactly this: the vocabulary exists, using it everywhere does not.
  "Every place that can fail to perform its inspection must distinguish 'I looked and found a
  problem' from 'I could not look', and must not report the first when the second is true."

  THE SECOND SCENARIO IS WRITTEN TO FAIL A PARTIAL FIX, the same shape as BO-3100c-2 and
  BO-3200a-2. Correcting the check that caused KI-BO-018 and testing only that one satisfies
  BO-3200e-1 completely while leaving every other site untouched, and the reusable finding that
  entry records — that this generalises past the one case — would go unimplemented.

  THE THIRD SCENARIO GUARDS THE SWEEP AGAINST ITS OWN SUBJECT MATTER. A sweep that silently
  skips the checks it cannot drive is itself a check that could not perform its inspection and
  reported a clean result — the failure this AC exists to prevent, committed by the instrument
  that prevents it. This repository has the precedent on record: the AC-store validator exited 0
  having examined zero files, and was the documented defence against store rot for eight days
  while doing nothing.

  THE FOURTH SCENARIO IS WHAT MAKES IT DURABLE. A sweep written against today's list of checks
  passes on the day it lands and says nothing about the next one added.

  Verification must drive the real checks into the real failure state. Reading a check's source
  for the undetermined vocabulary passes on a check that defines the value and never emits it.

  IT-PO ENRICHMENT NOTE (2026-08-26). Scope warning worth stating plainly: the tempting reading
  of "every check in the system" is "every check in the workflow runtime", because PR #565 is
  fresh in mind and that is where it landed. The larger population is the commit-guardian hooks
  and CI gates, and they matter more — they are the checks that block merges, and they read their
  outcomes outside the runtime's refusal. A sweep scoped to the runtime would be green, cheap,
  and would leave the reusable finding unimplemented at every site that counts.
