id: UXP-591-5
title: "Selecting, drilling into or breadcrumb-clicking a flow adds one Back entry at that flow's canonical address"
component: ux-prototyping
components:
  - ux_prototyping
  - frontend_coding
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given /flows/leafcutter/deliver-a-feature is open with no drawer and the tab has one
    history entry,
  When the person drills into the sub-flow of the 'Build' step, on the node or with
    'Open sub-flow' in its drawer,
  Then a new history entry is added, so the tab has two entries,
  And the address bar shows /flows/leafcutter/how-acs-are-built with no ?step=,
  And the breadcrumb reads "Deliver a feature end-to-end > How a ticket is built (the phase chain)",
  And picking a flow in the flow selector adds an entry at that flow's canonical address with a
    breadcrumb of only that flow,
  And clicking the "Deliver a feature end-to-end" breadcrumb adds an entry at
    /flows/leafcutter/deliver-a-feature, with the trail cut after that flow,
  And an entry added after the person pressed Back discards the entries Forward could have
    returned to.
