criteria: |
  Given the finalize-feature architecture documentation
  When a reader views the changelog-capture state diagram
  Then the diagram shows the three distinct outcomes of the changelog step:
    entry written, clean no-op (empty range), and capture failure
  And the diagram shows the no-op and entry-written outcomes transitioning to the
    PR merge gate
  And the diagram shows the capture-failure outcome branching by configuration:
    warn-and-continue by default, halt-before-merge when changelog is required
  And the diagram shows that a capture failure records a missing-entry condition
    that is reported rather than silently dropped
depends_on:
