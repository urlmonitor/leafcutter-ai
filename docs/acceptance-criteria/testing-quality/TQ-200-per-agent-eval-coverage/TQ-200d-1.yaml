assigned_agent: python-coder
estimated_complexity: L
delivers_to:
  - agent: python-coder
    ac_id: TQ-200d-1-i
    contract: >-
      The produced-tests scoring mode (OQ-1 decided: sibling modules scripts/evals/produced_tests_mode.py
      and scripts/evals/produced_tests_scoring.py). Contract: a row's expected object carries
      "negative" (bool), "fixture" (the fixture project directory the sandbox copies), "gold_output"
      (the recorded output directory --score-gold materialises) and "assertions" (a list of
      {"kind": <registered kind>, ...}); TQ-200d-1-i registers one more kind for the wrong-version
      run. Each scored row is recorded as {"id": str, "negative": bool, "score": {"passed": bool,
      "assertions": [{"kind": str, "passed": bool, "detail": str}], "judge": object|null}}, with
      the sandbox a git repository whose base commit is the fixture project as copied.
  - agent: python-coder
    ac_id: TQ-200d-4
    contract: >-
      agents["test-writer"] in scripts/evals/agent_eval_config.json pointing at the one set
      scripts/evals/sets/test-writer.jsonl (OQ-2 decided), which TQ-200d-4 appends its three
      database-setting rows to, scored by the same mode and assertion kinds.
  - agent: python-coder
    ac_id: TQ-200d-2
    contract: >-
      The same produced-tests scoring_mode value and module for the sql-test-writer set; TQ-200d-2
      adds assertion kinds to the scoring module, never a second mode.
expects_from: null
test_required: true
package_surface: false
it_requirements:
- 'Join the existing harness (TQ-200c-4). Register test-writer in scripts/evals/agent_eval_config.json
  as agents["test-writer"] with the keys the shared loader reads: template (templates/agents/test-writer.md),
  eval_set, scoring_mode, input_field, expected_field, model (sonnet, per the template frontmatter), tools,
  timeout, threshold, triggers and notes. The set is ONE JSONL file of {id, input, expected} rows, at
  scripts/evals/sets/test-writer.jsonl beside the existing restructuring-specialist.jsonl. Fixture projects
  live under scripts/evals/sets/test-writer/projects/ and recorded outputs under scripts/evals/sets/test-writer/recorded/
  (OQ-2 decided).'
- 'Neither existing mode fits. main() in scripts/evals/run_agent_eval.py dispatches only "artifact"
  and "label" and exits 2 on any other scoring_mode. Artifact mode is product-truth specific: copy_sandbox_inputs
  copies docs/product-truth and its contract dependencies, jsonschema is a hard dependency, and scoring
  reads *.mock.json / *.flow.json and runs validate_product_truth.py. Add ONE new scoring_mode for agents
  that produce tests and a report, implemented in sibling modules under scripts/evals/ (OQ-1 decided:
  produced_tests_mode.py and produced_tests_scoring.py; no test_ prefix on these modules). TQ-200d-2 and TQ-200d-4 reuse
  it. No second harness and no third mode.'
- 'run_agent_eval.py measures 1087 counted lines (count_content_lines in scripts/commit_guardian/_file_size_ratchet.py),
  not 1438 as first recorded. It is over the 400-line limit and must not grow: the dispatch for the new
  mode is offset in the same file. Offset is available: run_deterministic_assertions, _check_assertion
  and score_artifact_row have no caller anywhere in the repository. The new module must not create an
  import cycle with the helpers it reuses from run_agent_eval.py (invoke_agent_writer, extract_json_object,
  run_llm_judge, check_eval_set_complete, write_results).'
- 'Each row runs in a fresh temp-directory sandbox: a copy of the small fixture project the row names,
  initialised as its own git repository with one base commit. The agent runs with cwd and LEAFCUTTER_REPO_ROOT
  set to the sandbox, as invoke_agent_writer does today, and the sandbox is removed after scoring. Nothing
  is read from or written to the repository tree, and the repository''s pytest.ini, AC store and tests
  are not in the sandbox.'
- 'load_system_prompt reads the template raw. test-writer.md carries five {{config.output_root}} placeholders,
  including the path to scripts/db_check/, and the existing harness never renders them. The mode renders
  {{config.output_root}} to the sandbox and copies the scripts those paths name into it (scripts/db_check;
  for agents that call the wrong-version runner also scripts/build_orchestration and scripts/ac_store),
  so no path resolves outside the sandbox (OQ-3 decided).'
- '--score-gold must score EVERY row of this set. Today that mode skips any row without expected.gold_target
  and never calls the judge. So each row carries a recorded gold output (the produced test files plus
  the report text) that the mode places in the sandbox as if the agent had written it. Recorded test files
  are stored under a name pytest does not collect, because pytest.ini sets no testpaths and a bare pytest
  at the repository root would collect a test_*.py under scripts/. They are stored with the suffix .py.recorded and get their real name inside the
  sandbox only. Bad outputs for unit tests live under unit_tests/evals/fixtures/ with the same suffix (OQ-2
  decided).'
- 'Score mechanically wherever the outcome is mechanical (OQ-5 decided: deterministic checks everywhere, the judge optional and secondary; the wrong-version run for the refresh gate, and offered for test B). The trap fixture
  must seed cvd_delta_30 with values distinct from cvd; a fixture that seeds only cvd, or seeds cvd_delta_30
  equal to cvd, fails. The empty-window test must assert an exact processed-row count and a non-NULL count.
  The presence test must assert a known value seeded in its fixture. Test B must fail on a wrong result
  from refresh_config(), not at import. Report checks read the completion report''s "Wrong versions the
  tests now catch" list deterministically. A judge rubric is optional and secondary, never a row''s only
  scorer, because gold mode does not call the judge. The refresh-gate row''s test half is a real wrong-version
  run (TQ-200d-1-i).'
- 'The trap row sets expected.negative true. The new mode applies check_eval_set_complete (TQ-200a-4)
  before scoring, as artifact mode does, so a set with no negative row exits 2 as INCOMPLETE.'
- 'Local only (user decision; KI-TQ-20260907). Today eval_selector.py puts any registered agent whose
  triggers a PR touches into the affected set. The "Agent evals (affected)" job in .github/workflows/agent-evals.yml
  then runs it and requires a fresh scripts/evals/results/<agent>.json. Registering test-writer must not
  make that job run it, report it as passed, or demand a fresh result for it. Every result payload and
  printed report of this set carries an explicit local-run marker (OQ-6 decided: agents["test-writer"].local_only true; eval_selector.py keeps local_only agents out of affected and out of --check; the payload carries run_context "local" and the report says so). Nothing claims
  TQ-200b-2.'
- 'unit_tests/evals/test_agent_eval_config_triggers.py pins the exact agent list (_ALL_AGENTS, asserted
  in test_the_config_still_declares_the_three_agents), so registering test-writer means updating it. That
  is an edit to an existing test: name it in the existing-test sweep list (TQ-500g-3), and it may only
  be strengthened.'
- Unit tests never call a live model. Row pickup and scoring are proven through --score-gold with the recorded
  gold outputs, and through the scoring module with recorded bad outputs. No test needs model credentials
  or network.
- 'The live before-score against today''s test-writer is DEFERRED (user decision 2026-10-23): it is not
  part of this build and is recorded later as a separate step the user triggers, after PR #1324 (TQ-500g-3)
  merges, stamped with its trigger_shas (OQ-11 decided). It needs model credentials and is never run in
  CI. The build must leave the set runnable live (python scripts/evals/run_agent_eval.py --agent test-writer),
  but no build step may call a model.'
- 'Any database address in a row, fixture or recorded output is the placeholder postgresql://<user>:<password>@<host>:<port>/<database>.
  scripts/portability/check_shipped_addresses.py (INF-1100d-4) scans only templates/ and config/, so it
  never sees scripts/evals/sets/. The eval''s own test runs that scanner over the set directory.'
- 'Every new or changed .py file stays at or under 400 counted lines, and run_agent_eval.py (1087) must
  not grow. Headroom: eval_selector.py 248, unit_tests/evals/test_agent_eval_config_triggers.py 43. .json
  and .jsonl files, and scripts/evals/README.md (outside docs/), are outside the size gates.'
test_spec:
- name: test_test_writer_set_registered_and_every_row_scored
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: reachability
  surface_invoked: python scripts/evals/run_agent_eval.py --agent test-writer --score-gold --results-file
    <tmp>
  description: run_agent_eval.py, run as a subprocess with --score-gold and no --row, exits 0 and writes
    a results file whose rows are exactly the five ids (refresh gate, new function or existing code, empty
    window, presence is not correctness, input moved to a new column), each with a score.
  must_catch:
  - produced-tests scoring_mode not dispatched by main()
  - rows without gold_target skipped in score-gold mode
  in_scope_files:
  - scripts/evals/run_agent_eval.py
  - scripts/evals/produced_tests_mode.py
- name: test_trap_row_fails_fixture_seeding_only_old_column
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: discrimination
  description: Scored on the real trap row from scripts/evals/sets/test-writer.jsonl, a recorded output
    whose fixture seeds only cvd fails, and so does one seeding cvd_delta_30 equal to cvd. The gold output,
    seeding cvd_delta_30 with values distinct from cvd, passes.
  must_catch:
  - trap row scored on report wording only
  - fixture check accepts cvd-only seeding
  - fixture check accepts cvd_delta_30 seeded equal to cvd
  in_scope_files:
  - scripts/evals/produced_tests_scoring.py
  - scripts/evals/sets/test-writer.jsonl
- name: test_gold_outputs_pass_each_positive_row
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: criterion
  description: The recorded gold outputs for new function or existing code, empty window and presence
    is not correctness each pass their row. An empty-window output whose test does not count non-NULL
    values fails, and so does a presence output that asserts no seeded known value.
  must_catch:
  - empty-window row passes a NULL-skipping check
  - presence row passes a test that asserts no seeded known value
  in_scope_files:
  - scripts/evals/produced_tests_scoring.py
  - scripts/evals/sets/test-writer.jsonl
- name: test_test_b_failing_only_at_import_fails_the_row
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: discrimination
  description: For new function or existing code, a recorded test B that fails only because a name cannot
    be imported fails the row. The gold test B, which reaches refresh_config() and fails on a wrong result,
    passes it.
  must_catch:
  - test B accepted when it fails only at import
  in_scope_files:
  - scripts/evals/produced_tests_scoring.py
- name: test_set_without_negative_row_is_incomplete
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: failure
  description: A copy of the set with the trap row's negative flag cleared, run through run_agent_eval.py
    --config <tmp config> --score-gold, exits 2 as INCOMPLETE and scores no row.
  must_catch:
  - completeness check skipped in the produced-tests mode
  in_scope_files:
  - scripts/evals/produced_tests_mode.py
- name: test_local_result_never_presented_as_ci
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: failure
  surface_invoked: python scripts/evals/eval_selector.py --changed-files templates/agents/test-writer.md
  description: The results payload and the printed report of a score-gold run carry the local-run marker.
    eval_selector.py, given a change to templates/agents/test-writer.md, does not list test-writer as affected,
    and --check does not demand a result for it.
  must_catch:
  - report omits the local marker
  - results payload omits the local marker
  - eval_selector lists test-writer as affected
  in_scope_files:
  - scripts/evals/produced_tests_mode.py
  - scripts/evals/eval_selector.py
  - scripts/evals/agent_eval_config.json
- name: test_test_writer_set_carries_only_placeholder_addresses
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: real_artifact
  surface_invoked: python scripts/portability/check_shipped_addresses.py --build-root scripts/evals/sets
  description: The shipped-address scanner, run over the test-writer set directory, reports no finding.
test_rationale: An eval set is worth something only if bad outputs fail it. Each row is therefore proven
  with recorded good AND bad outputs, through the real runner CLI in --score-gold and through the scoring
  module, with no live model. The trap row, the empty-window and presence rows, and test B carry the must_catch.
  The CI-exclusion test pins the user's local-only decision. Every must_catch names a wrong version of
  this AC's own new code or rows, so the fast lane's wrong-version runs can apply it within in_scope_files.
