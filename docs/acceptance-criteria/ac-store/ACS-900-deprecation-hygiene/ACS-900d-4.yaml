readiness: approved
priority: high
title: "A superseded record naming existing successors is retired and no longer held to the is-it-built-and-tested-now rules"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the AC store contains an active record AR-400c-1,
    And a commit stages an L2 record X-1 with status "superseded_by",
    superseded_by: [AR-400c-1], work_status "done", readiness "approved",
    change_target "code", no test contract, and no test anywhere tagged as
    covering X-1,
  When the AC-store commit gates run on that commit,
  Then the done-proof gate does not refuse the commit on account of X-1
    (no "no covering test found for X-1" refusal),
  And no other gate refuses the commit for a reason that asks whether X-1's
    behaviour is built or tested now (covering test, test contract, unfinished
    children),
  And X-1's work_status still reads "done" after the gates run, exactly as
    authored, because for a retired record work_status records what it was
    when retired,
  And a record identical to X-1 except status "active" and superseded_by null
    is still refused by the done-proof gate for the missing covering test.
