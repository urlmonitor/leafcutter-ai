test_spec:
  - name: test_write_index_emits_lf_utf8_no_bom
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Temp docs tree with a page whose description contains an em dash and ü; calls write_index; reads the file as bytes and asserts no b'\\r', no UTF-8 BOM prefix, the em dash as e2 80 94 and ü as c3 bc, and exactly one trailing b'\\n'. Red on a Windows host if the write uses text-mode newline translation."
  - name: test_transform_hook_writes_lf_utf8_no_bom
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "Runs transform_doc_index.main(repo_root=tmp) on a temp git repo with a staged doc and asserts the same byte-level properties on the docs/INDEX.md it writes."
  - name: test_transform_hook_rewrites_crlf_map
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "Seeds docs/INDEX.md with CR LF line endings but otherwise correct content, runs the hook, and asserts the file on disk now contains zero CR bytes."
  - name: test_map_bytes_independent_of_preferred_encoding
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Patches locale.getpreferredencoding to return cp1252 and asserts write_index output bytes are unchanged."
test_rationale: "Line endings and encoding are only observable in the bytes on disk, so the tests must read files back as bytes; a string-level assertion on generate_index() output cannot see text-mode newline translation. Both write sites are covered because either can produce the committed map."
notes: |
  The committed map on 2026-09-25 contains zero CR characters, so this may
  already hold in practice; the AC pins it so it cannot silently regress
  (e.g. via a text-mode write on a host with a non-UTF-8 default encoding).
  If a test proves it already holds, the implementing agent should record that
  rather than change behaviour.
