id: BO-4500a-2-i
title: "No message, an empty message or an unreadable message file means no commit"
component: build-orchestration
components:
  - build_orchestration
  - git_vcs_operations
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500a-2.yaml"
criteria: |
  Given the caller names a.py (changed) and gives no message file,
  When the shared commit step runs,
  Then no commit is recorded, a.py is not left staged by the call,
  And the answer is refused with a reason stating that a message file is required.

  Given the caller names a.py and a message file that does not exist, or that contains only
    blank lines and spaces,
  When the step runs,
  Then no commit is recorded and the answer is refused with a reason naming the message file
    and stating which of the two conditions applied.

  Given any of these refusals,
  When the step answers,
  Then it has not opened an editor, composed a message of its own, or waited for input.
depends_on: [BO-4500a-2]
doc_links:
  - path: docs/known-issues/build-orchestration/open-low-ki-bo-20260914-commit-agent-rewrites-co-author-trailer.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: XS
package_surface: false
it_requirements:
  - >-
    Codes (BO-4500a-4 enum, policy family): no message file argument is policy_message_missing; a
    path that does not exist is policy_message_not_found; a file that exists but cannot be read or
    decoded is policy_message_unreadable; content of only blank lines and spaces is
    policy_message_empty. The reason names the message file path and the condition.
  - The message is validated before anything is staged and before any check runs.
  - The step never opens an editor, reads standard input or waits for a person on any message path; it must complete without a terminal attached.
delivers_to: null
expects_from:
  ac_id: BO-4500a-2
  contract: "Message-from-file rule."
test_required: true
test_spec:
  - name: test_missing_message_file_argument_is_refused
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "No message file answers refused with policy_message_missing, no commit, a.py not staged."
  - name: test_nonexistent_and_blank_message_files_are_refused_with_distinct_codes
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "A nonexistent file gives policy_message_not_found and a whitespace-only file gives policy_message_empty, each reason naming the file."
    must_catch:
      - "fall back to a default message"
      - "report both conditions with one code"
  - name: test_refusal_never_opens_an_editor_or_waits_for_input
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Run with GIT_EDITOR set to a sentinel script and stdin closed; the sentinel never runs and the step answers within a short timeout."
test_rationale: >-
  The editor sentinel is the observable proof that no message is composed interactively; status
  and code are read from the real step's stdout.
origin_agent: business-analyst
created: 2026-10-12
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  The step never invents a message. Authoring a message when the caller has none is the commit
  agent's job (BO-4500a-5-v), done before the step is called.
