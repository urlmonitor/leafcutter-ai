notes: |
  THE ANTI-REGRESSION CLAUSE FOR THE WHOLE TREE. GE-119c is, in the PO's framing, "the reason
  the other three do not quietly come back." This is the AC that carries that weight: without
  it, GE-119a and GE-119b hold for the eighteen checks that exist on the day they land and for
  none that arrive afterwards.

  Note the symmetry with GE-119a-2-i. That AC stops a new check omitting its cannot-run
  disposition; this one stops a new check omitting its parity coverage. Both are the same
  insight applied at different layers — a family-wide rule that is not mechanically checked
  against the family's own registry decays one addition at a time. The registry, not a
  hand-maintained list, must be the source of the expected set in both.

  The final clause guards the other drift direction: a harness whose case list has outlived
  the checks it names is a sweep that looks thorough and exercises ghosts.

  IT-PO (2026-08-14): the manifest holds 54 entries, and two of its shapes need explicit
  handling — the 6 transform-tier entries and precommit-canary's direct invocation. Any
  exemption must derive from an entry property, never an id. Expose the comparison as a
  callable so GE-119b-4 consumes it rather than reimplementing it.
