criteria: |
  Two clear ways to make a flagged link honest again and unblock your commit.

  When a link is flagged, you can either point the criterion at where the code
  now lives, or confirm that the existing code still satisfies the criterion — and
  once you have done either, the same commit proceeds. The check tells you which
  options apply so reconciliation is a quick, guided step rather than a guess.
