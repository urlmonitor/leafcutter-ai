id: TQ-200c-4
components:
  - testing_quality
  - llm_authoring
title: "A judged proof that was asked for becomes a scorable row in the harness that already exists"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a piece of work that has been asked for a judged proof,
  When that demand is satisfied,
  Then what is produced is a real row in the eval set belonging to the agent whose
    behaviour is in question — an input paired with the outcome expected of it — and
    not a paragraph of prose in a plan that nothing executes,
  And the row is registered where the shared runner already looks for that agent's
    set, so a run of the existing runner picks it up and scores it without anyone
    naming the row by hand,
  And it is scored by the scoring the agent's set already declares, so the demand
    joins the existing harness rather than standing up a second one alongside it,
  And an agent that had no eval set before the demand arrives ends up with one that
    the runner recognises, rather than the demand being dropped because there was
    nowhere to put it,
  And a judged demand that has been satisfied is distinguishable from one that has
    only been written down, so a plan carrying the request is never mistaken for
    proof that the request was met.
depends_on:
  - TQ-200c
  - TQ-200c-1
  - TQ-200a-1
