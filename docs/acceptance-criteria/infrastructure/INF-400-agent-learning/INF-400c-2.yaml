id: INF-400c-2
title: "A harvester agent reads learning emissions and routes each to the correct knowledge surface"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the emission sink (determined by ADR from INF-400c-1) contains
    three knowledge_captured events:
    - Event 1: entry_kind "memory-project", destination "memory/project_infra.md",
      agent "business-analyst-v3", learning text "INF prefix, no parent component"
    - Event 2: entry_kind "per-folder-readme", destination "docs/acceptance-criteria/infrastructure/README.md",
      agent "it-po-v3", learning text "infrastructure ACs use architect-review for ADR work"
    - Event 3: entry_kind "agent-frontmatter", destination ".claude/skills/signoff/PROJECT_CONTEXT.md",
      agent "product-owner-v3", learning text "signoff section 7 does not fire for v3 agents"
  When the harvester process runs,
  Then it reads each unprocessed event from the sink,
  And for each event, it writes the learning text to the file at the destination path
    using the capture-learning write protocol,
  And it marks each processed event so it is not re-processed on the next run,
  And it produces a summary of actions taken: "3 learnings routed: 1 memory, 1 readme, 1 project-context".
