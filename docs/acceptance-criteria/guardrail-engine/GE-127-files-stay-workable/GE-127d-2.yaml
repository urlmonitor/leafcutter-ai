notes: |
  THE RULE ITSELF IS DELIBERATELY NOT PINNED HERE, AND AN AMENDMENT THAT PINS IT
  IS AT THE WRONG ALTITUDE. No clause above says that any particular class of
  content is or is not counted. What is required is that whatever rule is applied
  is published and reproducible by the person subject to it. Which rule is correct
  is a technical decision for the IT PO at enrichment, and every criterion above
  is written to survive that decision going either way and to survive it being
  revisited later. The rule in force at authoring time is recorded in the doc_links
  above so the IT PO does not have to rederive it — recording it there and not in
  the criteria is the point.

  WHY THIS IS NOT COSMETIC. A limit enforced with a number the author cannot
  reproduce cannot be argued with, planned against, or trusted when it blocks a
  commit. The predictable response to a verdict that reads as arbitrary is to look
  for the cheapest way past it, and the parent L1 says so directly: the gate's own
  message tells authors not to delete blank lines, comments or documentation to get
  under the limit, and that instruction only holds if the rule and the limit are
  legible. If they are not, stripping content is the first thing a rational author
  tries, and the guard ends up making files worse rather than smaller.

  THE CONCRETE TRAP, MEASURED AND NOT INFERRED. Under the rule in force, deleting
  blank lines and hash comments DOES reduce the quoted number, and deleting
  docstrings does NOT. The refusal message forbids both in one breath. An author
  who is over the limit, cannot see the rule, and tries the thing the message
  forbids will find that one of the two moves the number and the other does not,
  with no explanation available — which is precisely the "the gate is broken"
  conclusion this record exists to prevent. Whichever rule enrichment settles on,
  the remedy is the same: publish it, and quote numbers that can be arrived at
  from it.

  THREE FIGURES IN CIRCULATION IN THIS TREE, WITH THEIR SCOPES, SO NOBODY READS A
  SCOPE DIFFERENCE AS DRIFT. All three are about the same codebase and none
  contradicts another:
    - 200 — files of the covered kind standing above their applicable limit under
      the measurement rule IN FORCE. Measured in this worktree on 2026-09-01 over
      tracked files. (Assessment recorded "on the order of 190"; this is the
      re-measurement, and it is the figure GE-127b-1 carries.)
    - 314 — files of the covered kind standing above 400 RAW lines, no exclusions.
      Measured in this worktree on 2026-09-01, over ALL TRACKED FILES of that kind.
    - 312 — the L0's figure for the same raw count, taken over a walk of FOUR
      FIRST-PARTY SOURCE DIRECTORIES rather than over all tracked files.
  312 and 314 differ by SCOPE OF THE WALK and are not drift, not a discrepancy, and
  not a correction of one another — do not reconcile them as an error or replace
  one with the other. 200 and 314 differ by the MEASUREMENT RULE, over the same
  scope, and that gap is exactly this record's subject: the same codebase yields
  two defensible answers and today nothing tells an author which one they are being
  quoted.

  THIS RECORD TAKES NO POSITION ON WHICH ANSWER IS RIGHT. Discarding documentation
  blocks before counting may well be the correct rule — a file is hard to work in
  because of how much of it there is to reason about, not how many bytes it holds.
  The obligation here is narrower and survives either answer: publish the rule, and
  quote a number that can be arrived at from it.

  RED BASELINES AND MUTATIONS — READ THE DISTINCTION, IT IS NOT UNIFORM ACROSS THIS
  RECORD. Unlike its siblings, every clause here requires something to be REPORTED,
  so none is green on arrival for the trivial reason that nothing is reported. The
  first, second and fourth arms fail today outright: no commit is refused for file
  length, the measurement rule is published nowhere, and nothing is quoted. Capture
  those failing runs as the baseline. Two hazards remain that a red baseline alone
  does not defend against, and each carries a named injection that must be RUN and
  reverted:

  (1) "the outcome states what the stated length measures" — MUTATION: restore the
      bare presentation, stating the arrived-at number and the permitted number and
      nothing about what the first of them counts. That is the incumbent shape and
      the shape that will be reached for. Under the injection this clause must go
      RED, and the reconciliation clause must go RED with it, then both return to
      green on revert. Without this injection the clause is satisfied by any
      message that happens to contain two numbers.

  (2) "what is published is taken from the rule actually in force rather than
      maintained alongside it" — MUTATION: publish the measurement rule as fixed
      text maintained separately from the rule applied, then change the rule in
      force so it arrives at a different length for one file. Under the injection
      the independently-derived number diverges from the quoted one and the third
      arm must go RED, returning to green on revert. This is the "satisfied by
      editing a sentence" failure the parent L1 names, and this tree has already
      shipped that failure once, exactly that way. A static sentence passes every
      other arm here on the day it is written.

  ASSERT REPRODUCIBILITY BY RE-DERIVATION, NEVER AGAINST A LITERAL. The equality
  clauses must be discharged by applying the published rule to the file at run time
  and comparing the result against the number the standard emitted. A test carrying
  a hard-coded expected length satisfies a reproducibility requirement while proving
  nothing about reproducibility — it asserts the author's belief about today's rule,
  and it stays green when the rule and the published statement drift apart together.
  Vary the file's content between runs and require the quoted number and the
  independently derived number to move together. This is the same by-variation
  construction BP-100n-4-ii requires of its stated counts, and for the same reason.

  THE DEGENERATE ARM IS A BOUNDARY CHECK AND IT SURVIVES A RULE CHANGE. A file
  containing nothing the rule declines to count must be quoted its total number of
  lines. If enrichment later chooses a rule that counts everything, that arm becomes
  the whole behaviour and the divergence arm simply never arises — which is the
  correct outcome, not a gap. Neither arm names what the rule discards, so neither
  needs rewriting if the rule changes.

  BOUNDARY WITH GE-127b. That record's ratchet consumes whatever length this
  measurement rule produces, and the interaction is a real hazard rather than a
  formality: if the rule declines to count some class of content, a change that adds
  only that class registers as no growth and the ratchet allows it. That consequence
  belongs to the rule decision made here and is inherited there. It is named in
  GE-127b-1's notes as well, from the other side, and neither record may settle it
  alone.

  BOUNDARY WITH GE-127e. This record makes the number TRUE and reproducible.
  GE-127e makes the refusal ACTIONABLE. A gate can quote a perfectly reproducible
  number and still leave the author with nothing to do about it. GE-127e has no
  child yet; that gap stays open and deliberately deferred.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. The IT PO owns the rule decision itself,
  where the published statement lives, and whether the measurement rule becomes
  configurable — the criteria above hold under every one of those choices.
