criteria: 'Given separate research scenarios with an incomplete question, no suitable registered query, a successful
  query returning zero matches, an unavailable provider, denied access and exhausted budget

  When research records why it cannot yet answer

  Then each scenario retains its distinct clarification, missing-capability, empty-result, unavailable, denied or
  exhausted outcome

  And only an established absence of a suitable query over supported source data can request a query-capability
  build

  And an unsupported source mapping remains an explicit source limitation rather than a fabricated query implementation
  opportunity

  And a malformed direct operation name remains the existing validation error

  And neither empty results nor outages become evidence that the requested knowledge does not exist.

  '
