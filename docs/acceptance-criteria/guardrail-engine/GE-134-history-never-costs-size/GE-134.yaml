notes: |
  WHY A SEPARATE GOAL. The feature this goal holds was first written as GE-127h, the
  eighth feature under GE-127. The store allows a goal at most seven features, GE-127's
  own record says its cap must not be raised, and the subject is narrow enough to stand
  on its own: GE-127 says how large a file may be, this goal says what is not counted
  toward that size. Moving it changed ids only; no criterion was rewritten.

  The sparse-tree advisory (fewer than three children) applies on day one and is
  accepted: the promise is a single one and is already delivered.

  IDENTIFIER. GE-134 was checked free on 2026-10-22: `git ls-tree` over every remote ref
  and every local branch shows GE-133 as the highest GE root, `git grep GE-13[4-9]` over
  every remote ref has no hits, and a grep of every worktree under the workspace has no
  uncommitted claim. Re-verify at merge time; id allocation in this store is known to be
  unreliable.
