notes: |
  The parent L1 promises a fix that takes minutes rather than an investigation. A guard
  that stops at the first finding breaks that promise arithmetically: four findings
  become four full check cycles, and the author learns to expect another wall after
  every fix. Completeness in one run is not a nicety; it is the benefit.

  THE LAST CLAUSE IS THE REAL ASSERTION and it is what makes this testable rather than
  aspirational. "Fixing all four makes the next run report none, with nothing appearing
  for the first time on that second run" rules out the sequential implementation that
  the other clauses alone permit — one that collects everything the FIRST check produces
  but stops before running the second check when the first found something. That shape
  looks complete (multiple findings, a count, grouping) and still delivers the
  fix-then-discover cycle. Asserting the second run is the only way to see it.

  GROUPING IS SEPARATE FROM LISTING. Two stale invocations of the same renamed
  capability are one cause with one fix; presented as two peers among four, the author
  fixes them as two unrelated problems and misses that the rename also left the new
  capability uncalled. BO-2900c-2 asserts that the two KINDS stay distinguishable; this
  AC asserts that instances of one kind stay grouped. Together they make a rename read
  as one event.

  THE COUNT is what makes progress legible across runs — four, then one, then none. It
  also gives the author a check that they saw the whole list rather than the top of a
  truncated one.

  Verification must EXECUTE the guard twice over a fixture carrying all four findings —
  once before and once after the fixes — and assert both the first output's contents and
  the second's emptiness.
