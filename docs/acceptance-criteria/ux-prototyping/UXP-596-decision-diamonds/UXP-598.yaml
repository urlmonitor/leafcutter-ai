assigned_agent: frontend-coder
estimated_complexity: M
it_requirements:
  - "buildFlowGraph in leafcutter-web/lib/data/graph.ts must emit each edge leaving a decision diamond with a non-empty GraphEdge.label (branch label on the 'yes' edge; 'else'/'continue' on the fall-through) and the correct GraphEdge.sourceHandle ('yes' | 'no')."
  - "GraphEdge.label and GraphEdge.sourceHandle must be defined on the GraphEdge type in leafcutter-web/lib/data/types.ts and consumed by the edge mapper in leafcutter-web/components/flows/flow-explorer.tsx (label -> React Flow edge label; sourceHandle -> React Flow sourceHandle)."
  - "FlowDecisionNode in leafcutter-web/components/flows/flow-nodes.tsx must expose the 'yes' (bottom) and 'no' (right) source handle ids so labelled edges attach to the correct vertices."
  - "No edge leaving a diamond may render without a visible label."
