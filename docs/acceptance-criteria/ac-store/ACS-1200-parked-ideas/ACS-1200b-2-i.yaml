work_status: todo
readiness: draft
priority: medium
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200b-2.yaml
criteria: |
  Given a record whose derived parent id resolves to no file anywhere in the
    store,
  And that record itself carries parked: true with a non-empty parked_reason,
  When the store-wide orphan scan is executed as a process over the store,
  Then the record is still reported as broken, naming the record id and the
    parent id that resolves to no file,
  And it is not listed in the parked section, because no existing parent record
    granted it that state,
  And the same record with the marker removed produces the identical report
    entry, so the marker changed nothing about this verdict.
