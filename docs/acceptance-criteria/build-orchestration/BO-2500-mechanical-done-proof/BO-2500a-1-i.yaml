expects_from:
  ac_id: BO-2500a-1
  contract: "The covers-tag linkage evaluation whose result this edge case constrains (only active-AC tags count toward done proof)."
test_spec:
  - name: test_covers_tag_for_nonactive_ac_does_not_count
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A '# covers:<id>' tag whose id is deprecated, superseded, or nonexistent contributes nothing to any active AC's done proof."
  - name: test_dangling_covers_tag_is_flagged
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A dangling covers tag is reported with its id and originating test location."
