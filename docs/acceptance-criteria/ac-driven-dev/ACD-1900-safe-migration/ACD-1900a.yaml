criteria: |
  Add the new fields when you're ready -- old and new requirements both stay valid.

  The store accepts both the old shape and the new shape of a requirement, every
  requirement carries a version marker, and the rules are never tightened until every
  requirement has moved across -- so nothing in the store is ever rejected mid-migration.
