notes: |
  SATISFIES THE reference-doc LEG of GE-126c's documentation_triggers. It is the only
  documentation trigger this L1 carries.

  ROUTE TO THE BOUNDARY RATHER THAN RESTATING IT. ADR-001 already defines the
  source-versus-deployed boundary. A second statement of it in the reference is the second
  copy of a list that ACS-100i-9 exists to prevent, and it will drift the first time the
  layout changes.

  THE NO-GENERALISATION CLAUSE IS THE L0'S RULE, not a stylistic preference. Until GE-126e
  reports, no record in this tree may state or imply how many copies share this shape. A
  reference that says build-source copies generally cannot run would be an unmeasured
  claim shipped as documentation, which is how this family of defects propagates.

