notes: |
  AUTHORED BECAUSE AR-300c DECLARES A reference-doc DOCUMENTATION TRIGGER, the
  same reason AR-300c-4 exists. It sits as an L3 under AR-300c-5 only because
  AR-300c had no L2 slot left; it is the sub-agent counterpart of AR-300c-4 and
  should be implemented in the same pass over the same two documents.

  THE SWEEP IS THE DELIVERABLE. The sharpest surviving instruction found while
  authoring: llm-expert's review checklist item 4 tells authors that a prompt
  using the Agent tool "must include a `## Your Available Sub-Agents` or
  `## Spawn Allowlist` section ... a table with each sub-agent's id, role, and
  tier". Left as is, the next prompt review re-introduces exactly the
  hand-written table AR-300a-5-i deletes. It must be rewritten to point at the
  declaration (and, if anything, to check that the declaration and the Agent tool
  agree -- AR-200b-3's rule), not deleted silently. The same sweep must cover
  docs/, templates/skills/ and templates/agents/ prose, and report its finding
  list even when empty.

  THE REFERENCE IS ALSO STALE ON MECHANISM. docs/reference/agent-template-frontmatter.md
  says the frontmatter key is resolved "into the {{my_spawn_allowlist}} table
  placeholder when present in the body" and that an empty list may mean "the
  allowlist is managed via the registry only". Both statements become false.

  OVERLAP WITH THE OPEN LLM-EXPERT QUESTION. Decision file item "Open, not
  decided" notes a scope tension around llm-expert and registry edits. Rewriting
  checklist item 4 is a prompt-body edit, not a registry edit, so it does not
  depend on that question -- noted so the IT PO does not block on it.
