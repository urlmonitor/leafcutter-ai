notes: |
  Closes the self-exemption hole. If a record could exempt ITSELF, the marker
  would become a per-file mute switch for any structural complaint, which is the
  suppression outcome the L0 rules out. The exemption is directional: a marker
  on an existing parent excuses that parent's missing back-links to its
  children, and nothing else.

  A dangling parent is a genuinely broken tree, not a parked one — exactly the
  class of breakage the recognition-not-suppression constraint exists to keep
  visible.
