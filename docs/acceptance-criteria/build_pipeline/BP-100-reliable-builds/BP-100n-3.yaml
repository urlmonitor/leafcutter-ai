id: BP-100n-3
components:
  - build_pipeline
title: "The build-equality guard covers every platform the build can emit, taken from the build's own platform set — a guard that proves equality only for the platforms it chose to enable proves nothing about the rest"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the build can emit outputs for more than one target platform,
  And a guard asserts that what the build recorded writing and what the build
    actually wrote are the same set,
  When that guard runs,
  Then it exercises every platform the build is capable of emitting, taken from
    the platform set the build itself reads,
  And no platform is withheld from the assertion by a fixed choice made inside
    the guard,
  And given a platform becomes emittable that was not emittable before,
  When the guard runs,
  Then that platform is covered without the guard being edited,
  And given the guard cannot exercise a platform the build can emit,
  When it runs,
  Then it names that platform as unverified and fails, rather than reporting
    equality for the platforms it did manage to exercise,
  And an output family produced only under a platform that was not exercised is
    never counted as covered by the equality assertion.
depends_on:
  - BP-100n
doc_links:
  - path: "docs/acceptance-criteria/build_pipeline/BP-100-reliable-builds/BP-100n.yaml"
    relationship: parent
    status: exists
