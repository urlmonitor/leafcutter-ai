it_requirements:
  - "The blocking sink-probe gate must be added to templates/workflows/build-feature.md as a mandatory step between Step A (worktree exists) and Step B (dispatch), so the prose path hard-blocks before any ticket-supervisor is dispatched — never after."
  - "The prose gate must invoke the SAME probe semantics defined by BO-100d-1a (append-one-line + mkdir-and-reprobe + genuine-failure classification); the prose must reference the shared probe rather than restate divergent logic, so the two surfaces cannot drift."
  - "Dual-surface parity (the KI-3 lesson): the build-feature.md prose gate and the deterministic build-epic.js gate must BOTH hard-block; a gate that blocks in one path but not the other silently reintroduces the original warn-only bug. The prose must make clear the gate is non-bypassable, not advisory/warn-only."
  - "The abort branch must print an operator message naming debugging/logs/agent_telemetry.jsonl and the concrete remediation, then exit without dispatching any supervisor (mirror the existing Step A worktree-guard abort prose)."
  - "Deployed/template parity (ADR-001 self-hosting): build-feature.md is a package source compiled by build.py; edit the package source and verify the deployed slash-command copy via the build.py round-trip — never edit only one side."
  - "Apply the Prompt-Quality Checklist: keep bash probe snippets single-command per the shell convention; do not introduce inline implementation work that the inline_work_guard.py lock would block."
