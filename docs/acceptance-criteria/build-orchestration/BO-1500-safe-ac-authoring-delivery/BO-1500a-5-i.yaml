title: "A refusal, an out-of-scope reply, or an uninterpretable reply is treated as a failed setup"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500a.yaml
criteria: |
  Given the isolated-workspace setup step returns one of these four outcomes:
    (1) a reply declining the work as outside the responder's scope,
    (2) a reply the workflow cannot interpret as a setup outcome at all,
    (3) an outcome shaped like a success but naming no workspace directory,
    (4) an outcome that reports no failure and names neither a directory nor a branch,
  When the workflow evaluates that outcome,
  Then it classifies each of the four as a failed setup,
  And it halts the run before the first authoring agent is dispatched in all four cases,
  And the message for each case names which of the four it was, so the user can tell a
    refusal apart from an uninterpretable reply.
depends_on:
  - BO-1500a-5
doc_links:
  - path: templates/workflows-js/plan-feature.js
    relationship: modifies
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    setup_failure_kind:
      type: string
      description: "One of refused | uninterpretable | no_workspace_named | silent_success. Recorded on the halt so the four non-confirming outcome shapes are distinguishable in the message and in tests."
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "BA-supplied schema minimum — the IT PO refines this block during technical enrichment."
    - "Cover all four shapes with behavioral tests that drive the real result-handler path; a test that only asserts a string is present in the source cannot distinguish a wired gate from a dead one."
delivers_to: null
expects_from:
  ac_id: BO-1500a-5
  contract: "The confirmation gate whose negative branch these four outcomes must all reach"
test_spec:
  - name: test_each_of_the_four_non_confirming_shapes_halts_before_authoring
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Parametrized over all four outcome shapes — a scope refusal, an uninterpretable reply, a success-shaped outcome naming no directory, and a silent no-failure outcome naming neither directory nor branch. For each, runs plan-feature under the E2 harness and asserts the run halts and no authoring agent label appears in agent_calls. All four are asserted in one parametrized test so a partial implementation covering only the refusal case cannot pass."
  - name: test_halt_records_which_of_the_four_shapes_occurred
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "For each of the four shapes, asserts the halt carries the matching setup_failure_kind value (refused / uninterpretable / no_workspace_named / silent_success) and that the four values are pairwise distinct across the runs. Distinctness is asserted explicitly so an implementation that hardcodes one kind for every failure is rejected."
test_rationale: "The parent AC's constraint is explicit that a source-string test cannot distinguish a wired gate from a dead one, so both tests drive the real result-handler through the harness. The four shapes are parametrized rather than written as four independent tests because the failure mode being guarded is partial coverage — the original handler recognised one shape (a non-zero exit) and let the other three through, and four separate tests make it easy for three to be skipped or deleted without the omission being visible. Asserting the four kinds are pairwise distinct is what makes the message requirement testable at all; without it, 'names which of the four it was' is satisfied by any constant string."
