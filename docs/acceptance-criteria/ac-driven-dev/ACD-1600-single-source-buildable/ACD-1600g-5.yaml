criteria: |
  Given the requirement boundary can be authored on a requirement and composed
    across a bundle,
  When an author consults the reference documentation for the requirement
    record,
  Then the documentation describes the boundary field alongside the change
    surface it qualifies, and states that it is optional and that its absence is
    legacy mode rather than an empty boundary,
  And the documentation states the bundle composition rule as a difference --
    excluded by at least one member and changed by none -- with the worked
    counter-example showing why taking the members' exclusions together would
    block a legitimate bundle,
  And the documentation states what a scope review does when a requirement
    carries no boundary at all,
  And an author who has read only this documentation can author a valid boundary
    and predict the review outcome for a bundle of three requirements without
    reading any implementation.
depends_on: [ACD-1600g, ACD-1600g-1, ACD-1600g-2, ACD-1600g-3, ACD-1600g-4]
