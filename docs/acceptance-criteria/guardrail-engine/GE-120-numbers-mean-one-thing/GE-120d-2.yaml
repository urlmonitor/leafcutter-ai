estimated_complexity: M
it_requirements:
  - "THE REQUIRED-CHECK HALF IS AN OUT-OF-REPOSITORY OPERATION AND MUST BE PLANNED AS ONE. The shared branch's required-check set lives in a GitHub ruleset, not in any file in this repository — verified 2026-08-17: no settings-as-code script exists here, so BP-1200c-1's settings-as-code decision was in practice carried out by hand. Adding this gate means a `gh api` call against the ruleset under the non-EMU `urlmonitor` account with an admin-scoped token. Budget it as a deliberate ops step with recorded evidence, not as something the coder does incidentally."
  - "Because the required-check set is not in the repository, a unit test CANNOT assert it, and a test that silently skips when no token is present is a false green of exactly the kind this tree exists to eliminate. Satisfy the second half with a recorded `gh api` query of the ruleset's required-check names, captured as evidence on the implementing ticket, and treat a skipped or unavailable query as NOT DONE rather than as passed."
  - "The gate's job NAME in ci.yml is the string the ruleset matches, and the match is exact. Choose it at implementation time and never rename it afterwards — the existing test job carries the same warning in its own comment, and a renamed job silently becomes a non-required job that still reports green."
  - "ORDERING IS LOAD-BEARING: do not make this gate required until GE-120e's repair has landed and GE-120e-3 passes. A required whole-collection gate over a collection that still holds the GE-119 collision and the five twice-held work items fails every merge in the repository on day one, and the documented response to that situation in this codebase has twice been to defer or diff-scope the gate."
  - "REPRODUCE THE STAGED-INDEX HANDLING OR THE GATE VALIDATES NOTHING. The `AC store valid` job documents the trap in full: hooks reading from `git diff --cached` see an empty index in a CI checkout, where the PR's files are committed rather than staged, so invoking them naively passes. Its answer is `git reset --soft origin/<base>`, and its comment records verifying both ways — with the reset a malformed record fails, without it the same record passes. Any gate reusing a staged-index reader inherits this, and a false pass here defeats the entire backstop."
  - "Verify the gate by executing its own command against a checkout that genuinely contains the contested pair — not by asserting the job exists in ci.yml. This repository already contains a written, tested, deployed decision-number collision guard that is registered nowhere and has never run; a job block in a YAML file is the same class of evidence."
  - "The inspected-count output on the passing path is not decoration. A CI gate that passes over an empty or unreadable checkout looks identical to one that passed over the whole collection, and this is the stage where nobody is watching the output."
  - "DEPLOY MANIFEST: the CI job runs `python scripts/build.py --target-dir .` before invoking the gate, as the existing AC-store and done-proof jobs do. Every module the gate imports must be in the matching deploy list, or the required gate crashes with ModuleNotFoundError and blocks every merge — the done_proof.py precedent, and the reason this it_requirement appears on every AC in this tree that touches a gate."
test_spec:
  - name: test_ci_gate_fails_on_a_contested_pair_in_a_real_checkout
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    description: "The gate's own command, executed against a checkout that really contains the contested pair, fails and names the contested number and every claimant path."
  - name: test_ci_gate_sees_committed_files_not_only_staged_ones
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    description: "With the contested files COMMITTED rather than staged — the actual CI condition — the gate still fails. Run with and without the reset --soft step so a gate that silently validates nothing is caught, mirroring the both-ways verification the AC store valid job records."
  - name: test_ci_gate_passes_with_per_namespace_inspected_counts
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    description: "On a checkout contesting no number the gate passes AND emits a per-namespace inspected count matching the artifacts present, so a pass over an empty or unreadable checkout is distinguishable."
  - name: test_bypassed_commit_stage_is_still_caught_by_the_build_stage
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    description: "A commit made with the commit-time guards bypassed, carrying a contested number, still fails the build gate — the end-to-end backstop claim, exercised rather than reasoned about."
  - name: test_ci_job_name_matches_the_recorded_required_check_name
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: unit
    description: "The gate's job name in .github/workflows/ci.yml equals the name recorded as required in the ruleset evidence artifact, so a later rename is caught here rather than by a merge that should have been blocked and was not."
test_rationale: |
  This AC is the only one in the tree whose second half cannot be proved from inside the
  repository: the required-check set lives in a GitHub ruleset. That asymmetry is handled
  deliberately — the executable half is covered by four descriptors that run the gate's own
  command, and the ruleset half is satisfied by a recorded gh api query treated as evidence,
  with a skipped query counting as not done rather than as passed. The exact-name descriptor is
  the durable bridge between the two: it fails when the job is renamed, which is the one way the
  required-check binding silently dissolves while every check still reports green. The
  committed-not-staged descriptor is included because the closest structural precedent in this
  repository documents having verified exactly that, both ways, after finding that the naive
  invocation validated nothing.
