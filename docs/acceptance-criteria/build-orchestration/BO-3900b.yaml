assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Containment is decided at a whole-segment boundary, after '.' and '..' segments have been applied to both the worktree root and the candidate path. A raw prefix test with or without a separator is a defect."
  - "The equivalence rule is the single one BO-3900 defines per script. Separator spelling and trailing separators are ignored, letter case is ignored for drive-lettered and UNC paths only, and POSIX paths compare case-sensitively. Lower-casing POSIX paths is a defect."
  - "A '..' that would climb above a path's root must never produce a path judged inside the worktree."
  - "A path equivalent to the worktree root is recognised as the root and dispatched as the root. It is never joined onto the root."
  - "Case-insensitive matching decides containment only. The dispatched path has one deterministic spelling that does not depend on which spelling of the worktree the run received, so the three worktree spellings yield byte-identical dispatched paths."
delivers_to: null
expects_from:
  ac_id: BO-3900
  contract: "BO-3900's per-script equivalence and whole-segment containment rule: separators and trailing separators ignored, '.' and '..' applied, case-insensitive for drive-lettered and UNC forms only, and a path equal to the root counts as the root."
test_required: true
test_spec:
  - name: test_sibling_directory_sharing_a_name_prefix_is_not_inside_the_worktree
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "C:\\wt\\foo-bar\\... is judged outside worktree C:\\wt\\foo."
  - name: test_windows_worktree_spelling_variants_contain_the_same_ticket
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Trailing-separator, backslash and different-case spellings of one Windows worktree all contain the same ticket path and yield one dispatched path."
  - name: test_posix_containment_is_case_sensitive
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A POSIX path differing from the worktree only by letter case is judged outside it."
  - name: test_worktree_root_itself_is_not_joined
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A path equal to the worktree root, with or without a trailing separator, is recognised as the root."
  - name: test_dot_dot_segments_are_applied_before_containment
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A path that escapes the worktree through .. segments is outside, and one that uses a . segment is inside."
  - name: test_containment_boundaries_are_reachable_from_the_workflow_top_level_body
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: templates/workflows-js/build-feature.js
    description: "At least the prefix-sibling and case-variant cases are driven through _workflow_engine_harness.py running build-feature.js's own body."
test_rationale: |
  Each boundary here is a place where a plausible fix for BO-3900 is still wrong. The
  cheapest fix for the incident swaps "/" for either separator in a prefix check, and that
  fix drops the segment boundary. The next cheapest lower-cases everything, and that breaks
  POSIX. Both pass BO-3900's own cases, whose worktree and ticket share a real segment
  boundary and a single letter case. So the boundaries need their own inputs. At least two
  of them go through the harness, because containment is decided at the same call sites
  the incident went through.
