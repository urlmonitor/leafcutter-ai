id: ACD-1000e
title: "Growing scope means tagging more ACs, not restructuring the epic"
component: ac-driven-dev
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Given an epic is open and in progress (not yet shipped),
  When the user wants to add scope to the current batch,
  Then they tag additional L2/L3 ACs with the same target_epic name,
  And the epic absorbs the new ACs without manual rework to the epic folder
    (the folder structure derives from the target_epic tags, not the reverse),
  And once the epic ships and closes, any further scope additions under the
    same L1 goal must use a new epic name — creating a fresh batch,
  So that growing scope is always an additive tagging operation, never a
    restructuring of existing build artifacts.
depends_on: [ACD-1000a]
