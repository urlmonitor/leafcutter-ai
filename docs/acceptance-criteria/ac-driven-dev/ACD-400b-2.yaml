criteria: |
  Given the generator has just written a ticket file for AC id ACS-100a-1,
  When the source AC YAML file is read back after generation,
  Then the implemented_by field contains the relative path of the newly-written
    ticket (e.g. tickets/00_inbox/TICKET-20260605-ACS-100a-1.md),
  And no other fields in the AC YAML were modified (id, title, criteria,
    depends_on, assigned_agent, status, work_status, and all other fields
    retain their original values),
  And the implemented_by list preserves any pre-existing entries
    (appends rather than overwrites).
