    angle: discrimination
    description: "A finished L1 with no own tag whose only AC-id children are retired by a valid supersession stays counted, because the gate's rule falls back to the record's own tag; with an own tag it is tagged, never the new ground."
    proves_clause: 'the composite leaves the count under the ground "proved through its children (tags read, tests not run)" only when all three of these hold: (a) the done gate''s own composite rule, looked up when the ratchet runs and given the set of ids tagged by the done gate''s own covers-tag pattern, finds no unproven child; (b) its covered_by is complete: every live (not superseded) record on disk whose parent is this record is listed in it; (c) it is level L0 or L1, or its change_target is exactly "docs"'
    code_file: scripts/ac_store/untagged_done_count.py
    to_be_created: true
