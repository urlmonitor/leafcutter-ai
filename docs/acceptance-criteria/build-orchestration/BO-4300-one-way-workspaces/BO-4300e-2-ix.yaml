change_target: code
risk_surface: safety
criteria: |
  Given a project "shop" with a ready workspace "ticket/alpha" holding nothing
    that has not reached the shared project, with 300 files in 40 folders
    besides its repository and its workspace record,
  And the clearing of "ticket/alpha" is made to stop with "directory not empty"
    at one of these points, one point per run of the same setup:
    on the very first item it deletes,
    on an item inside the repository after 10 items of the repository were deleted,
    on the workspace record,
    and on the last item it would delete,
  When the clearing request that stopped has answered, and the same clearing
    request is then made again without any discard token, once addressed by the
    workspace's location and, in a second run, by the name of its line of work,
  Then the request that stopped is not answered cleared, and its answer states
    that the clearing stopped part-way and that asking again finishes it,
  And for every stop point the repeated request is answered cleared, and no
    folder or file of "ticket/alpha" remains at its location or anywhere else in
    shop's landing place,
  And for no stop point is the repeated request answered "not found", refused
    for unsent work, or refused because the shared project could not be reached,
  And no item of "ticket/alpha" was deleted before the check for unsent work had
    passed in the request that stopped.
depends_on: [BO-4300e-2, BO-4300e-2-v, BO-4300e-2-viii]
