title: "Emitters and the harvester resolve the same knowledge-emission sink from one declared location"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
priority: high
readiness: draft
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-400c.yaml"
criteria: |
  Given ADR-034 names debugging/logs/knowledge_emissions.jsonl as the sink
    that agents emit knowledge_captured events to and the harvester drains,
  And the emission sink path is declared exactly once, in a single named
    location that both the emitting side and the harvesting side read,
  When the emitting side resolves its sink path and the harvesting side
    resolves its sink path in the same working tree,
  Then both resolve to the identical absolute path,
  And the harvester's own default sink (used when no --sink argument is given)
    is that same declared value rather than an independently-written literal,
  And a check exists that fails when the two sides resolve to different paths,
    naming both resolved paths in its failure output,
  And that check fails today, because the emitting side writes
    debugging/logs/agent_telemetry.jsonl while the harvester defaults to
    debugging/logs/knowledge_emissions.jsonl.
depends_on: [INF-400c, INF-400c-1]
