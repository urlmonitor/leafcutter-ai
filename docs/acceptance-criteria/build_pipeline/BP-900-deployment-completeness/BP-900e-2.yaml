it_requirements:
  - "A registered script is satisfied for THIS check the moment any deploy-source copy exists at its derived templates/scripts/ path — presence is sufficient; content equality is explicitly out of scope (BP-1000a-1 owns byte parity)."
  - "Make the seam against BP-1000 concrete in a test: a registered script whose template copy exists but DIFFERS byte-for-byte must pass this completeness check (and would be caught instead by the BP-1000 parity gate). This check and BP-1000 must not both claim the same finding."
  - "Consume the verdict produced by BP-900e-1's check rather than re-deriving the registered set independently."
