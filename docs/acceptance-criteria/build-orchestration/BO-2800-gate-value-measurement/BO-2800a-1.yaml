title: "The existing completion manifests are mined into a per-agent completion-evidence summary"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a git-tracked ticket corpus in which a sign-off comment carries a
    completion_manifest block with two items — schema_migration_applied recorded as the
    bare value true, and tests_green expanded to result: false with reason "assertion
    200 != 404 on the candles endpoint" and remediation "respawn the coder with the
    failing traceback",
  When the completion evidence is mined across that corpus,
  Then exactly two manifest-item records are produced for that comment — one per item,
  And each record carries the ticket it came from, the signing phase agent, the manifest
    item name, and the recorded item value,
  And the record for tests_green carries the recorded reason and remediation text
    verbatim, neither summarised, truncated, nor discarded.

  Given four manifest items in the corpus written in four different shapes —
    (a) diff_size_verified recorded as the bare value true,
    (b) high_confidence_findings_found expanded to result: false carrying a reason and a
        remediation,
    (c) tests_green recorded as the bare value false with neither reason nor remediation,
    (d) medium_confidence_findings recorded as the number 1 and suppressed_low_findings
        recorded as the number 0,
  When the completion evidence is mined,
  Then (a) is tallied as a true-valued item, (b) and (c) are tallied as false-valued
    items, and (c) is additionally reported as malformed, naming its ticket and its item,
  And (d) is tallied under its own non-boolean-value figure, naming the ticket, the item,
    and the recorded value, and is excluded from both the true-valued and the false-valued
    tallies rather than being discarded,
  And the reported denominator states the non-boolean figure alongside the true and false
    figures, so the boolean tallies are visibly a subset of the items examined rather than
    silently shrinking the population they are drawn from.

  Given three false-valued items in the corpus — high_confidence_blockers_found recorded
    false, escalation_triggered recorded false, and a result: false whose reason states
    that a red baseline was the expected state of a test-first phase,
  When the completion evidence is mined,
  Then each is recorded as an item whose value is false, and none of the three is reported
    as a problem caught by a check,
  And every figure counting false-valued items is labelled as items recorded false with
    their polarity undetermined, and carries the statement that a false value may record a
    desirable outcome, an intentional baseline, or a genuine failure,
  And no figure in the summary is titled or described as a count of problems caught,
    defects found, or checks that fired.

  Given three sign-off comments — (a) one whose declared status is ok and whose
    completion_manifest carries one item expanded to result: false, (b) one whose declared
    status is blocker carrying the same failed item, and (c) one whose declared status is
    ok with every manifest item recorded true,
  When the completion evidence is mined,
  Then comment (a) is recorded as an ok-with-false occurrence attributed to its signing
    agent and its ticket,
  And comments (b) and (c) are not recorded as ok-with-false occurrences,
  And the ok-with-false occurrences are reported under their own figure, separate from and
    not folded into the count of false-valued items,
  And the false-valued item inside comment (a) still appears in the manifest-item records,
    so the two figures are independent views of the same evidence rather than alternatives.

  Given sign-off comments predating the manifest convention that carry no
    completion_manifest block at all,
  When the completion evidence is mined,
  Then those comments produce no manifest-item records and are reported only under a
    separate "no manifest recorded" figure, never as failures and never as passes,
  And the mining run completes and reports its figures without failing, without blocking
    any build or sign-off, and without writing to, reformatting, or back-filling any
    ticket file.

  Given the manifest-item records mined from the whole tracked ticket corpus,
  When the completion-evidence summary is produced,
  Then it reports, for each signing agent, how many items that agent recorded true, how
    many false, how many non-boolean, how many malformed, and how many ok-with-false
    occurrences it produced,
  And it reports the number of sign-off comments examined and the number of those that
    carried a manifest, so every figure is presented against a stated denominator rather
    than as a bare total,
  And it reports no per-manifest-item-name breakdown,
  And re-running the summary over the same corpus produces the same figures,
  And the summary is produced from the tracked ticket corpus alone — no new
    instrumentation is required and no change is made to how sign-offs are written.
