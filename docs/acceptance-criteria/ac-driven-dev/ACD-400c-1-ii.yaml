    relationship: describes
    status: exists
    relevance: "Verified by execution 2026-09-08: a temp store holding leaves recorded as 'APPROVED' and 'approved ' alongside one recorded 'approved' returned only the last id in `ready`, with `blocked` empty. The admission test is an exact string comparison, so it is case-sensitive and whitespace-sensitive. Tagged `describes`, not `modifies`."
