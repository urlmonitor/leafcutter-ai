  - name: test_no_pr_result_carries_branch_and_compare_url_or_command
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      The no-PR terminal result carries the branch plus the compare URL or the
      exact PR-opening command, so the caller can act from the result alone.
    covers:
      - BP-600d-5
  - name: test_pr_opened_and_pr_exists_and_push_failed_paths_unchanged
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      A run that opens a PR, a run where a PR already exists, and a run whose
      push failed each report exactly as before — no outstanding-action marker
      is attached to any of them.
    covers:
      - BP-600d-5
  - name: test_close_phase_still_gates_pr_creation_on_confirmation
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      The Close-phase prompt still requires explicit user confirmation before
      any PR is opened — the fix must not turn the gate into an unattended
      PR creation.
    surface_invoked: templates/workflows-js/quick-fix.js
    covers:
      - BP-600d-5
test_required: true
test_rationale: >-
  A grep for a new string in quick-fix.js would pass on dead code, which is the
  exact phantom-done shape this repo's gate/workflow rule forbids. The tests must
  therefore assert on what a run actually RETURNS in the no-PR case — the terminal
  result object built from a close-phase payload with pr_opened=false and an empty
  pr_url — and must equally assert that the three neighbouring paths (PR opened, PR
  already exists, push failed) return what they return today, since the failure mode
  being fixed is a mis-shaped report rather than mis-shaped work.
