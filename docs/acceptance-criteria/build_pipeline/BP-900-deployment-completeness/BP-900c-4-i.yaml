  reference_file_path: scripts/build_propagation_audit.py
  n_location_rule: "1 — the declared-path resolution feeding the suggested-action selector. It must derive its answer from the deploy declarations in scripts/build_phases.py that the build ships from. Introducing a second location that lists declared paths is the defect this record exists to exclude, not an acceptable implementation of it."
  required_skills:
