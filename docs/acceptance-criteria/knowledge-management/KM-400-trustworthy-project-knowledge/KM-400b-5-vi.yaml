id: KM-400b-5-vi
title: "A publication that fails on the writer's time limit names the phase and the slow batch - label, rows and payload bytes - so the operator can act"
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: done
parent: KM-400b-5
criteria: |
  Given a publication of generation G33 for repository R1 into an empty store
  And node batch 34 of 46 (label AcceptanceCriterion, 250 rows, 3,100,000 bytes of payload) exceeds the writer's 30-second time limit on all 3 of its attempts
  When the publication fails
  Then the result states that the cause is the writer's time limit, and states that limit as 30 seconds
  And the result names the phase as writing nodes
  And the result names the slow batch: label AcceptanceCriterion, batch 34 of 46, 250 rows, 3,100,000 bytes
  And the result states that 3 attempts were made
  And the result states the progress reached: 8,250 of 11,307 nodes and 0 of 28,814 relationships written
  And the result still reports the removal outcome for G33 as required for a failure after storing
  And the result is distinguishable from a failure caused by the store being unavailable or read-only

  Given relationship batch 80 of 116 (relationship kind COVERED_BY, 250 rows, 400,000 bytes) exceeds the time limit on all attempts
  When the publication fails
  Then the result names the phase as writing relationships and names that batch with its kind, ordinal, rows and bytes

  Given every write batch succeeds and the step that makes G33 the active generation exceeds the time limit on all attempts
  When the publication fails
  Then the result names the phase as activation
  And the result states that no write batch was involved, rather than naming a batch or reporting a label, row count or byte count of 0

  Given the time-limit error from the store does not say which statement was slow
  When the publication fails on it
  Then the phase and batch named in the result are those the publication was executing when the error was received
depends_on: [KM-400b-5, KM-400b-5-i, KM-400b-5-iii, KM-400b-5-v]
