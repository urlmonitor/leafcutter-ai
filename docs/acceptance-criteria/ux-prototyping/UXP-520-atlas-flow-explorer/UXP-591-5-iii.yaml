- action: approved
  agent: approve_acs
  date: '2026-10-09'
- reason: "2026-10-14 business-analyst: criteria REPLACED for UXP-617 (flow v6 branch filterRepicksFlow, rewritten in place; the flow keeps the id for this AC link). Owner decision 2026-10-12: a filter change never swaps the drawn flow, replacing owner ruling 3 of 2026-10-09. Old behaviour: the first flow the selector lists under the new filters (leafcutter/define-a-feature) was drawn and the entry replaced with its address. New behaviour: the flow, breadcrumb, drawer and address stay; an 'Outside the current filters' notice shows; no entry is added. Title changed to match. Readiness lowered approved -> draft; it_requirements (re-pick from the selector), delivers_to (the re-pick function) and the whole test_spec describe the rejected behaviour and must be re-authored by IT-PO. The filter change is still written to the current entry in place (filters and notice must return on Back/Forward, UXP-591-5-ii)."
  agent: business-analyst
  date: '2026-10-14'
superseded_by: null
