expects_from: null
it_requirements:
  - "Canonical source: the cutover-readiness check under scripts/ac_store/ (or scripts/). A consumer cutover MUST be blocked until a completed full self-host epic (driven end-to-end thin + AC-side sign-off) is on record; once recorded, the dogfood precondition is satisfied."
  - "The precondition must be evaluated from a real recorded signal (e.g. an epic completion record), not a hard-coded boolean."
  - "Test must EXECUTE the cutover-readiness check with no self-host-epic record (expect blocked) and with one recorded (expect satisfied) -- never grep-only."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file I/O in typed try/except and log-or-reraise; no bare except."
