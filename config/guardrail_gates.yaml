# guardrail_gates.yaml
#
# Machine-readable mapping of (change_target, risk_surface) pairs to mandatory
# guardrail agent names. Consumed by generate_ticket_from_ac.py::_build_agents_map
# to compute the full agent map for generated tickets.
#
# Structure:
#   <change_target>:          # 10 values: code, schema, config, documentation,
#                             #             prompt, test, hook, skill, template, data
#     <risk_surface>:         # 6 values: production, staging, integration, unit, none, all
#       - <agent-name>        # must be a valid is_ticket_phase: true agent from agent_registry.json
#
# Multi-value targets (e.g. a change that touches both code and schema) union
# their gate lists — the caller is responsible for deduplication.
#
# risk_surface semantics:
#   production   - change goes live in production; highest scrutiny
#   staging      - change goes to staging; high scrutiny
#   integration  - integration/E2E environment; medium scrutiny
#   unit         - unit-test scope only; lighter scrutiny
#   none         - no deployment surface (e.g. local-only exploration); minimal
#   all          - superset sentinel: gates that apply regardless of surface
#
# Agent names must match agent IDs in config/agent_registry.json with is_ticket_phase: true.

code:
  production:
    - architect-review
    - test-writer
    - test-runner
    - pr-reviewer
  staging:
    - architect-review
    - test-writer
    - test-runner
    - pr-reviewer
  integration:
    - test-writer
    - test-runner
