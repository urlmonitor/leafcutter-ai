parent: KM-500e
criteria: 'Given a research question requires Test identities reached through declared component membership and
  test coverage

  When the offered query descriptions and available source evidence are checked against that question

  Then an absent matching operation over supported source kinds, relationships and required fields is identified
  as a query-capability gap eligible for the existing governed build process

  And an operation that exists but cannot expose a required canonical field is identified as a field availability
  gap rather than a complete answer or a query-only repair

  And a missing source-kind or relationship mapping is identified as an unsupported mapping before query creation
  is requested

  And a required fact absent from the canonical source is distinguished from a fact present in the source but omitted
  by projection or disclosure when attributable diagnostics establish that distinction

  And when those diagnostics are unavailable the cause remains unknown rather than being guessed

  And completed zero matches, missing input, unavailable services, denied access, stale evidence and exhausted limits
  retain their existing distinct outcomes

  And none of those outcomes independently authorizes query creation, canonical data changes or broader access.

  '
