notes: |
  THE L1 REQUIRED THIS TO BE A SEPARATE L2 WITH ITS OWN OBSERVABLE and this record is that
  separation. Repairing root resolution removes one route to the silent exit; it does not
  remove the silence. GE-126b-1 and GE-126b-2 must hold even when the root resolves
  perfectly, and neither may be closed by this record.

  THE ORDER MATTERS FOR THE OTHER DIRECTION TOO. If this lands first, the workspace-parent
  case that KI-CG-018 reproduced stops arising, and a reader could conclude the defect is
  gone. It is not — it is one working directory further away. That is precisely why
  GE-126b-1's pair is written against a tree that genuinely contains no store.

  DO NOT ADD A NINETEENTH PRIVATE ROOT WALK. This check is one of the files still carrying
  its own walk while a majority of the family already imports the shared resolution. A
  point fix that keeps the private walk and merely corrects it is the fourth patch of a
  shape this component has patched three times already.

  THE UNRESOLVABLE-ROOT CLAUSE IS THE ANTI-FALLBACK CLAUSE. The observed defect depends on
  a silent fallback to a relative location. Reporting the failure to resolve rather than
  substituting a guess is what stops the check answering about a place it never located.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

  ------------------------------------------------------------------------------
  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NOW SET AND CROSSES AN AGENT BOUNDARY. GE-126b-4's criterion "every run
  says what root it resolved" is only a true statement about the shipped system once this
  record lands. That makes it a contract rather than a coincidence of ordering, and it is
  why the contract names the unresolvable-root report as well as the happy path — the
  reference has to describe both.

  THE DELETE-THE-PRIVATE-WALK REQUIREMENT IS THE ONE MOST LIKELY TO BE SOFTENED. Keeping
  the old walk as a fallback looks conservative and is the opposite: it preserves the
  working-directory dependence for precisely the inputs the shared resolution fails on.
  The fourth test descriptor is written to detect a retained fallback specifically, by
  seeding a violating record at the old relative location and requiring it NOT to be
  judged.

  AGENT — python-coder. Ordering lives in depends_on. The expects_from edge is data-shape
  documentation only (KI-ACD-015).

  A DEPLOY-MANIFEST WARNING, NOT A NEW OBLIGATION. If joining the shared resolution adds
  an import to the deployed hook, that module must be in the build deploy map in the same
  change. This repository has already shipped a required gate that crashed with
  ModuleNotFoundError for exactly this reason, and unit tests importing from the source
  tree mask it completely.

  NOT AUTHORED HERE: declares_side_effect (derived per BO-2900g-2, see KI-CG-015).
