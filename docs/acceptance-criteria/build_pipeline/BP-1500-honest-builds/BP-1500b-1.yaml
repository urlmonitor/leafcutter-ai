id: BP-1500b-1
title: "An installed artifact the package can no longer produce is removed, named in the report, and no longer reachable"
component: build-pipeline
components:
  - build_pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
declares_side_effect: false
criteria: |
  Given a project has the package installed, and an earlier install placed the
    workflow named "fast-lane-build" into that project's installed tree,
  And the package no longer carries any source for "fast-lane-build" -- its
    template was deleted on 2026-09-01 and eight workflow templates remain,
  When the install is rebuilt,
  Then the installed copy of "fast-lane-build" is gone from that project's
    installed tree,
  And the build's report for that rebuild names "fast-lane-build" as something
    it removed, rather than reporting only a count of removals,
  And asking the installed project for the workflow "fast-lane-build" by name
    afterwards yields nothing, so the retired capability is no longer offered,
    run, or answered to by name,
  And the eight workflows the package still carries are all still present in the
    installed tree afterwards, byte-for-byte unchanged by the sweep.
depends_on:
  - BP-1500b
