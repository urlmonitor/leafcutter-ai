  ac_id: KM-400b-5-v
  contract: "The KM-400b-5-v retry record for the batch in flight when the publication failed {batch: the KM-400b-5-iii batch descriptor {phase: str, label_or_kind: str, ordinal: int, total: int, rows: int, payload_bytes: int}, attempts: int, attempt_causes: list of str, max_attempts: int}."
