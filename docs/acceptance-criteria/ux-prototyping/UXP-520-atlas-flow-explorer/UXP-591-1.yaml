id: UXP-591-1
title: "A flow's canonical address opens the Atlas on that flow, selected and drawn"
component: ux-prototyping
components:
  - ux_prototyping
  - frontend_coding
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given the flows leafcutter/flow-render-pipeline (source real, kind data),
    fern-and-fig/customer-buys-a-plant (source mock, kind user) and
    leafcutter/product-truth-architecture (source real, kind architecture) exist,
  When a person opens /flows/leafcutter/flow-render-pipeline in a new tab from a link pasted
    into chat, a ticket or a PR,
  Then the Atlas answers 200 and draws leafcutter/flow-render-pipeline as the selected flow
    with no step drawer open,
  And the filters show Source Real, Kind Data and Realization All, so the flow selector lists
    the linked flow instead of the first flow of the default filters,
  And the breadcrumb shows only "How a flow renders in the Atlas", with no parent trail,
  And the address bar keeps /flows/leafcutter/flow-render-pipeline, with the '/' inside the
    flow id a literal path separator rather than %2F,
  And opening /flows/fern-and-fig/customer-buys-a-plant the same way shows Source Mock, Kind User
    and Realization All, and opening /flows/leafcutter/product-truth-architecture shows
    Source Real, Kind Architecture and Realization All.
