notes: |
  WHY THIS IS ITS OWN RECORD. The user request requires that the existing
  parallel-safe capture through standard output keep working unchanged. Standard
  output is per-process, so it was never part of the collision. The risk is a
  regression: a refactor of the recovery-file naming adds a second line to standard
  output, or reorders the writes, and corrupts every caller that captures the id
  directly. That includes FB_ID=$(...) in epic-supervisor and live-surface-tester.

  Run the real entry point as subprocesses and start them concurrently. An
  in-process helper call cannot show a stream mix-up. Use a copied temporary layout
  with its own declared sink, so no test writes into a real sink (INF-500d-4).
