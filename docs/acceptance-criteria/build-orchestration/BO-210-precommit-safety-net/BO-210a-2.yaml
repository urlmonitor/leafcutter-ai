assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "blocking_hook_ids must be the sole gating list — no parallel gating signal"
  - "The candidate gating hook ids must all be present in the array"
  - "Edit the deployed config and its packaged template source together; the build.py round-trip must leave both in parity"
test_spec:
  - name: test_bo_210a_2_the_resolved_gating_set_moves_with_the_one_array_and_is_the_seven_ids
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Resolve the gating set by EXECUTING the reader over the config, never by loading the
      JSON and matching a literal. On the real config the resolved set is exactly the seven
      ids. Single authority is asserted by VARIATION, not by a fixed comparison: add an id to
      blocking_hook_ids and the resolved set gains it; drop one and the resolved set loses it.
      A reader that returns a hard-coded seven-element set passes a fixed-literal assertion
      and must fail this one.
  - name: test_bo_210a_2_no_second_field_can_make_a_hook_gate_or_stop_it_gating
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      NAMED MUTATION (mandatory, run it, do not merely describe it): plant a plausible
      parallel gating signal in the config beside the array — a per-hook blocking/enabled
      style flag asserting gating for an id NOT on blocking_hook_ids, and the same flag
      denying gating for an id that IS on it. The resolved gating set must be unchanged by
      both plants. If either plant moves the set, a second field is independently
      determining gating and this descriptor fails. Green-on-arrival is the risk here: on a
      reader that consults only the array the plants are inert, which is exactly why the
      plants are executed rather than assumed.
  - name: test_bo_210a_2_an_id_absent_from_the_array_does_not_block_a_violating_commit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      With an id removed from blocking_hook_ids, stage a change that violates what that hook
      checks and take it through the commit path. The observable outcome is that the commit
      is not blocked by that hook — non-gating is proven by the commit completing, never by
      the id's absence from a data structure. Restoring the id restores the block, so the
      array's contents and the commit outcome are shown to be the same fact.
  - name: test_bo_210a_2_every_id_on_the_array_blocks_a_real_violating_commit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      git commit through the registered pre-commit surface
      (.pre-commit-config.yaml -> .leafcutter/scripts/commit_guardian/run_hook.py)
    description: >-
      PRODUCTION ENTRY POINT, PARAMETERISED OVER THE ARRAY ITSELF — the cases are generated
      from blocking_hook_ids as read at run time, so an id added to the array later cannot
      escape this descriptor. For each id, stage a change that violates what that hook
      checks and attempt a real commit through the registered surface. Assert the commit is
      BLOCKED — by the exit status, not only by text — and that the blocking hook is named
      in the output. A hook whose script exists on disk but is invoked by no entry line
      completes the commit and fails here; that is the point.
  - name: test_bo_210a_2_an_approved_but_unreached_id_is_named_and_the_read_fails
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      Reading the array to decide which hooks gate a commit must NAME any id that no
      commit-time invocation reaches, and fail. Asserted on the outcome, not on config
      contents: an id is treated as reached only when the commit path can be made to block
      on it. NAMED MUTATION A (mandatory, executable): append a synthetic id to
      blocking_hook_ids that nothing anywhere invokes — the read must fail AND the failure
      text must contain that exact id; removing it returns the descriptor to its prior
      verdict. NAMED MUTATION B (mandatory, executable): make the resolution of which ids
      are reached return an empty result on error instead of an unavailability signal — the
      ordinary fail-open shape. Under B the read reports no unreached ids and succeeds; this
      descriptor must go RED, and by the exit status as well as the text. B is not optional:
      the clause is satisfiable by a check that examines nothing, which is the one way it
      could pass while the dead gates it exists to expose stay dead.
  - name: test_bo_210a_2_the_array_the_commit_actually_consumes_is_the_deployed_one
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After build.py, the gating decision is taken in the DEPLOYED layout against the
      deployed config, in a cold process. Assert the deployed and packaged-template copies
      of blocking_hook_ids agree after the build round-trip, and that the deployed commit
      path blocks on an id read from the deployed copy. An array edited only in the template
      leaves the running commit unchanged, and an array edited only in the deployed copy
      disappears on the next build; both surface here rather than as a green source-tree
      run over a config no commit consumes.
