id: BP-100k-1
components:
  - build_pipeline
title: "Every template artifact the build manages is recorded in the build manifest, so the template-drift gate has something to compare"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the build has just run over an unmodified checkout and written its
    build manifest,
  And a template artifact that the build copies into the package's shipped
    surface is staged for commit — including template families other than the
    agent templates, for example a commit-guardian hook script,
  When the template-drift gate inspects that staged artifact and looks it up
    in the manifest,
  Then the manifest yields a recorded fingerprint for that artifact,
  And the gate reports, for that artifact, either that it matches the recorded
    fingerprint or that it has drifted from it,
  And the gate does not report that artifact as absent from the manifest,
  And the symptom ("the gate announces that a template it inspected is not in
    the manifest, so drift in that template can never be detected") must not
    occur for any template family the build actually produces.
depends_on:
  - BP-100k
