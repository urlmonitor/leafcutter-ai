notes: |
  The core behaviour change. The differential clause (marker removed => six
  violations) is not decoration: it is what separates "the check passed because
  the tree is recognised" from "the check passed because it never ran", which is
  exactly the failure GE-119 exists to close. Without it a fail-open regression
  in this check would read as a green result for this AC.

  The grep-only exclusion is repo convention (CLAUDE.md, "Gate / Workflow ACs —
  Verify Behaviorally, Not by Grep"): a structural test asserting the exemption
  branch exists passes on dead code.

  SEQUENCING WITH GE-119b — recorded here because it belongs on the AC that
  changes the rule. The reciprocal link cannot be written from this tree
  (GE-119b is authored in the guardrail-engine tree); the IT PO or the
  coordinator should add the matching ordering note to GE-119b, or land both in
  one release.

  IT-PO ENRICHMENT (2026-08-14). Verified ground truth carried into
  it_requirements: the hook is live and wired at .pre-commit-config.yaml:294; it
  resolves derive_parent_id via a private fail-open _get_derive_parent_id()
  rather than the shared _resolve_root.py, because scripts/ac_store/ac_parent_id.py
  is not in the build deploy_map. The ACD-1403 conflict is recorded here as a
  prerequisite reconciliation, per the coordinator's instruction not to edit
  ACD-1403 from this tree.
