it_requirements:
  - >-
    Put the page under docs/reference/ (for example docs/reference/shared-blocks.md, name
    provisional) with the repo's doc frontmatter, and register it in docs/INDEX.md through the
    normal doc-index path. Cross-link it from docs/reference/workflow-authoring-contract.md, and
    link to the commit step's reference page (BO-4500a-4-vi) without restating the step's own
    contract. This page covers the CALLER side.
  - >-
    Quote every failure message from the built install's actual output (run against the failing
    fixtures), not paraphrased from the criteria. Give each failure a stable anchor the how-to
    (BO-4500b-4-i) can link to.
  - >-
    State the reason-code families and max_transient_retries in a form a test can match against
    config/commit_step.json: each code listed under its family name, and the ceiling as its key
    and value. The page holds no other copy of configuration values.
  - >-
    The config-agreement test is written by test-writer. documentation-expert writes only the
    page. The test reads config/commit_step.json and the page at test time and fails naming any
    code present in the configuration but missing from the page.
  - >-
    Name the routes that take COMMIT-ANSWER as they stand when the page is written. State that
    build-feature and build-ticket keep BO-3000a phase-loop routing (BO-3800a-1). While the block
    still awaits adoption, say so and name the adopting records.
delivers_to:
  - agent: documentation-expert
    contract: >-
      docs/reference/shared-blocks.md (name provisional) with one stable anchor per install
      failure, which the how-to (BO-4500b-4-i) links to instead of restating the messages.
expects_from:
