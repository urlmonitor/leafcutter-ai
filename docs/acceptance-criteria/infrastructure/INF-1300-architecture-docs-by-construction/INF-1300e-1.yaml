criteria: |
  Given a project that has taken this way of working by the ordinary means of
    adopting it, and which contains no copy of this package's own working tree,
  When an author in that project performs the mandatory step exactly as the
    instruction that project received states it — the same invocation, the same
    arguments, run from where that project's authors work,
  Then the step succeeds there and a document is produced,
  And the adopting project needed to add nothing of its own, and to copy nothing
    from anywhere else, to make that possible,
  And the observation is made in the adopting project's own layout: a success
    obtained in this package's working tree does not satisfy this criterion, and
    neither does one obtained in a project that still has this package's source
    tree beside it,
  And the same holds after the adopting project takes a later version of the
    package by the same ordinary means — the step does not stop working because
    the project updated.
