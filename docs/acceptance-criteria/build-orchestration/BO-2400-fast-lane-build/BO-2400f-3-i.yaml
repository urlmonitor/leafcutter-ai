id: BO-2400f-3-i
components:
  - build_orchestration
title: "The worktree location the run proceeds on is confirmed against the repository the run is operating in"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the run has just opened its worktree for a criterion, on a branch it
    created moments earlier,
  And the probe that reports where git says that worktree is answers from
    somewhere other than the repository the run is operating in, so its answer
    lists worktrees but holds no record for that branch,
  When the run decides which location the remaining phases will use,
  Then the run halts, naming the branch it could not confirm and the location
    the worktree phase had claimed,
  And no later phase runs against the claimed location,
  And given instead a probe that answers from the repository the run is
    operating in and does list that branch, the run proceeds on the location
    git reported,
  And given instead a probe that could not be run at all and returned no
    answer of any kind, the run still proceeds on the claimed location as it
    does today.
depends_on: [BO-2400f-3]
