notes: |
  Flow step split-run. Parallel children are out of scope (DK-400 SETTLED 5).
  Among parts free to start, proposed order decides: the user kept this default on 2026-10-05
  (answer to BA open question Q4). It matches every sample record. The person's preferred order
  is kept only as words in the gate note.
  For the IT PO: the configured bound on child work per run, and the off switch.
  IT PO (2026-10-05): settled the run setup: parts are bound to their approved capability without
  routing; each part gets the budget a stand-alone run of its question would get (so the first parts
  cannot starve the later ones), with child work bounded by split.max_parts_per_run; a split root
  completes from its parts with the split record as its output.
