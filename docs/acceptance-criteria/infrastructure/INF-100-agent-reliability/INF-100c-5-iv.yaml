  Given the package as shipped, with its 24 agent definitions that carry signoff: true,
  When the package build runs the consistency check,
  Then the check reports zero agents that sign off but can write to no category,
  And zero writers that name no registered agent,
  And ac-validator and ac-fulfillment-gate are each listed in the allowed_writers of
