notes: |
  The PO's first failure mode: accidental un-parking, where someone "fixes" a
  parked tree and it silently changes state. Both halves are refused for the
  same reason — a record that is half-parked is a record nobody can read a
  decision off.

  The second case (children listed while still marked parked) is the one that
  would otherwise pass silently: the back-link rule is satisfied, so without an
  explicit contradiction check the tree would sit in the parked section of the
  health report while looking decomposed everywhere else.
