criteria: |
  Given a store holding 180 records and a query whose own filter is misconfigured so
    that its pass reaches only 40 of them,
  When the answer is produced,
  Then the reported total is 180, established by enumerating the records under the
    store root without applying any of the query's own filters, match keys, or join
    keys,
  And the answer therefore reads 40 of 180, not 40 of 40,
  And the same holds when the query's pass reaches nothing: an answer whose join
    matched none of the 31 available records reads 0 of 31,
  And the same holds for a population the query never sees: when 9 records of a given
    kind exist under the store root and the query's pass surfaces none of them, the
    answer reports 9 in scope and 0 observed rather than omitting that kind entirely,
  And a measurement whose own argument handling collects no records from a location
    that holds records reports the count that location holds rather than reporting a
    clean outcome over an empty set: a validation run pointed at a directory holding 21
    requirement records reports 21 in scope, never "no records to validate" with a
    successful outcome,
  And a total produced by applying the query's own filter set, match keys, or join keys
    does not satisfy this criterion, because it carries the same blind spot,
  And a single filter-free enumeration of the store root that yields both the total and
    the result candidates in one traversal DOES satisfy this criterion — the required
    independence is from the query's filters and keys, not from its traversal, and a
    filter-free enumeration has no blind spot for the total to inherit.
