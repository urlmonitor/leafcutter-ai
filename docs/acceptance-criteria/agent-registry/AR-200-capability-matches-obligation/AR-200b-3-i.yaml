risk_surface: internal
it_requirements:
  - "The macro entry `__ticket_phase_agents__` counts as a permission BY ITSELF, judged on the declaration as written -- never resolve the macro first and test the resolved list for emptiness (that makes the verdict depend on the rest of the tree)."
  - "ASYMMETRY, not one normaliser: on the tools side an absent `tools:` line permits nothing (a finding when a permission exists); on the permission side an absent or empty `spawn_allowlist` holds nothing (never a finding, counted as holding no permission). If AR-200b-2-i's shared code already implements this asymmetry for skills, the spawn pair must go through the same code path, not a re-implementation."
  - "Holding the Agent tool with no permission is not a finding."
test_spec:
  - name: test_macro_only_permission_without_agent_tool_is_reported
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    angle: discrimination
    description: "An agent whose spawn_allowlist is only `__ticket_phase_agents__` and whose tools omit Agent is reported, even when no agent is marked ticket-phase on that build."
    must_catch:
      - "the macro is resolved first and an empty resolution exempts the holder"
  - name: test_absent_tools_line_with_a_permission_is_reported
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    angle: boundary
    description: "An agent with a named sub-agent and no `tools:` line is reported."
  - name: test_empty_spawn_allowlist_without_agent_tool_is_not_reported_and_counted_as_none
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    angle: boundary
    description: "An agent with `spawn_allowlist: []` and no Agent tool produces no finding and is counted as holding no permission."
  - name: test_agent_tool_without_permission_is_not_reported
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    angle: failure
    description: "An agent holding Agent with no spawn_allowlist produces no finding."
test_rationale: >-
  The four descriptors are the four Givens. The macro case carries must_catch
  because resolve-then-check is the natural implementation and silently exempts
  ticket-supervisor on an unlucky tree; the two absent/empty cases pin the asymmetry
  a single 'missing means empty' normaliser gets wrong.
