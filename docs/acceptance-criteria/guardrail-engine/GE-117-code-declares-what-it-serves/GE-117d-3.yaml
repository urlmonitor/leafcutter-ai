implemented_by: []
notes: |
  Pins the warn tier as a DELIBERATE OPT-IN only, never the default — mirrors GE-100's
  warn-vs-block config precedent. First scenario locks the default (unconfigured =
  block) so a coder cannot quietly ship warn-as-default; second scenario proves the
  opt-in path still surfaces the same detail. This is the ONLY non-block behavior the
  PO permitted and it is explicitly gated behind deliberate configuration.
