criteria: |
  Given an autonomous drive running in its own clone whose `origin` points at the hub,
  When the agent runs `git push origin main` (or `git push origin HEAD:main`) directly,
  Then the hub rejects the push,
  And `main` on the hub is unchanged,
  And the rejection does not depend on any local hook having fired in the clone.
