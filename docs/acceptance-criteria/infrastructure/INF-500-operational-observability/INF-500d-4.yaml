title: "A report written inside a temporary workspace is still readable after that workspace is gone"
component: infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a drive is running inside a temporary per-drive workspace that will be
    deleted when the drive finishes,
  When an agent in that drive files a report and the write succeeds,
  And the temporary workspace is subsequently removed,
  Then the report is still readable afterwards from the durable location that
    outlives the workspace,
  And the record identifier cited in the drive's ticket resolves to that stored
    record.

  Given reports are filed from two different temporary workspaces belonging to two
    different drives of the same project,
  When both workspaces have been removed,
  Then both sets of reports are readable from the one durable location, without the
    later drive having overwritten or displaced the earlier drive's records.

  Given the same drive also reads its own configuration and also runs commit-time
    guards,
  When the durable report location is determined,
  Then the configuration still resolves to the workspace the drive is actually
    running under, and the commit-time guards still resolve to the tree they are
    judging,
  And the durable report location is determined independently of both, resolving to
    the enduring project location rather than to the workspace root.

  Given the operational log directory also holds the agent-telemetry log and the
    knowledge-emission log, which are written by the same drives with the same
    workspace-relative lifetime and are destroyed the same way,
  When the durable location is adopted for the report sink,
  Then the same durable location is adopted for every log in that directory, so the
    directory is not split across a disposable root and an enduring one,
  And a reader looking for any of those logs after the workspace is gone finds them
    all in one place.
depends_on:
