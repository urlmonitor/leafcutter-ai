assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  - agent: llm-expert
    ac_id: TQ-500f-4
    contract: 'Each generated test requirements entry may carry must_catch: a non-empty ordered
      list of non-blank strings, copied verbatim from the AC''s test_spec item. The test writer
      treats each string as a wrong version its test must go red under.'
  - agent: python-coder
    ac_id: TQ-500f-3-i
    contract: test_spec[].must_catch in the AC record (list[str], minItems 1) is the declared
      signal the red-baseline reader reads, matched to a test by test_spec[].name.
expects_from:
  ac_id: TQ-500f-1
  contract: "The 'discrimination' kind is permitted on both sides, so an entry carrying must_catch can also declare angle: discrimination."
it_requirements:
  - 'must_catch must be added to BOTH config/ac_store_schema.json test_spec[] items and config/test_requirements.schema.json
    tests[] entries with identical constraints: optional; an array with at least one item; each
    item a string containing at least one non-whitespace character. Both schemas reject unknown
    keys today, so a one-sided change produces tickets that violate their own schema (the same
    copy-through coupling ac-schema.md documents for framework and type).'
  - 'The generator''s authored-test_spec route must copy must_catch verbatim: same strings,
    same order, no trimming, case change, dedupe, merge or reformatting. It must emit no must_catch
    key on an entry whose test_spec item has none.'
  - 'must_catch strings must survive a YAML round-trip in the ticket''s Test Requirements block:
    strings containing '':'' or ''('' or quotes read back identical under yaml.safe_load.'
  - The AC record is the single source of must_catch for both lanes. Tickets copy it; the fast-lane
    test writer reads the AC directly. Nothing may derive must_catch from criteria text.
  - 'Enforce on the gate that actually runs: the constraints must fire in validate_ac_schema.py
    (the check-ac-schema commit gate) as well as in the JSON schema. Name both in the change.'
  - 'Additive change: ACs and tickets without must_catch validate and generate byte-identically
    to before.'
test_spec:
  - name: test_validator_cli_accepts_test_spec_with_must_catch
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: scripts/ac_store/validate_ac_schema.py CLI (the check-ac-schema commit
      gate)
    description: The validator CLI accepts an on-disk AC with the two-entry test plan from the
      Given (entry 1 with three must_catch strings, entry 2 without).
  - name: test_generated_ticket_copies_must_catch_verbatim_in_order
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: criterion
    description: A ticket generated by generate_ticket_from_ac.py from that AC carries must_catch
      on test_retry_gate_runs_when_both_conditions_due equal to the three strings, in order,
      character for character, when its Test Requirements block is read back with yaml.safe_load.
  - name: test_entry_without_must_catch_gets_no_must_catch_key
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: boundary
    description: The generated entry for test_retry_gate_idle_when_nothing_due has no must_catch
      key at all (not an empty list).
  - name: test_generated_test_requirements_with_must_catch_conform_to_schema
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: seam
    description: The real generator's emitted Test Requirements block, including must_catch,
      validates against config/test_requirements.schema.json.
test_rationale: The contract is a producer (AC + generator) to consumer (ticket schema, test
  writer) seam. Only the real generator's output, read back and validated against the consumer's
  schema, proves the list arrives verbatim. The example strings were chosen so that sorting
  ('drop' < 'new' < 'revert') or case-folding ('NULL') would change them.
