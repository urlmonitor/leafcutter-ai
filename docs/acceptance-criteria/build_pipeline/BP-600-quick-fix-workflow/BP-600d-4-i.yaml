title: "Quick-fix workflow handles the case when no PR exists for the current branch"
component: build-pipeline
level: L3
status: active
readiness: reviewed
priority: medium
work_status: todo
criteria: |
  Given the commit has completed and the workflow reaches the close phase,
  When no open PR exists for the current branch,
  Then the workflow pushes the commit to origin but does not attempt
    to create a new PR,
  And it reports to the user: "Changes pushed. No open PR found for
    this branch -- create one with /pull-request if needed.",
  And the ticket lifecycle still closes normally with status: done.
