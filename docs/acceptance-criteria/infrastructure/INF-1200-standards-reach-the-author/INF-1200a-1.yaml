assigned_agent: python-coder
estimated_complexity: M
package_surface: false
declares_side_effect: false
it_requirements:
  - >-
    NO PACKAGE SURFACE — MEASURED, NOT ASSUMED. WATCHED_REGISTRIES binds four documents;
    on commit_guardian.json it binds exactly two containers, hooks_manifest.hooks (by id)
    and the document's own top level (by mapping key). This record adds neither: it adds no
    hook, no manifest id, no new top-level section, no agent entry, no skill entry and no
    paths.json surface. It constrains the CONTENT AND SHAPE of what the carrier places in a
    compiled brief. Plain-list spec form, and no config_schema_fragment invented for a key
    that will never exist — the BP-100k-4 / BP-100k-4-i fictional-fragment precedent is
    deliberately not repeated.
  - >-
    THE MATERIAL A SPECIALIST BEGINS FROM IS THE COMPILED BRIEF, AND THAT FIXES WHAT MAY BE
    ASSERTED. build_agents() in scripts/build_phases.py compiles every templates/agents/*.md
    through compile_agent_template() into <target>/.claude/agents/ (and, for active
    platforms, <target>/gemini/agents/). That written file is Channel 6 of
    agent_knowledge_plane.md and is what a dispatched specialist holds before its first
    action. Every arm of this record must be observed by running the build and reading that
    output. A test that reads templates/agents/*.md, or that calls an injection helper and
    inspects its return value, proves nothing about what an agent is told.
  - >-
    ONE SHARED HARNESS FOR THE WHOLE TREE — BUILD IT HERE, CONSUME IT EVERYWHERE. Fourteen
    sibling records need the same thing: a controlled copy of the package tree in which
    templates/scripts/commit_guardian/commit_guardian.json and config/agent_registry.json
    can be varied, `python <pkg>/scripts/build.py --target-dir <target>` run as a real
    subprocess, and the produced <target>/.claude/agents/*.md read back. Build that harness
    once, under unit_tests/prompt_assembly/, and consume it from every sibling. Do not let
    each record grow its own fixture — divergent harnesses are how one arm quietly stops
    exercising the thing it names.
  - >-
    "STATED IN FULL" IS A CLOSURE PROPERTY, NOT A WORD COUNT. The terms a reader would have
    to know in order to comply must be present in the brief: the kind of file the standard
    governs, and the value or rule itself, in a form a reader who has seen only the brief
    can compare against the declaration. Concretely, the brief must contain no instruction
    to open, invoke, resolve, fetch or ask for anything in order to learn what the standard
    is. A sentence naming where standards are declared is the specific prohibited shape and
    is the BA's named mutation.
  - >-
    ATTRIBUTION IS PART OF THE POSITIVE ARM AND IS WHAT DEFEATS A BROADCAST. Each standard
    must be stated AGAINST THE KIND OF FILE IT GOVERNS. A brief that states a figure with no
    kind of file attached, or that states every declared standard undifferentiated, fails
    this even though the figure is present — because the specialist cannot tell which of its
    kinds of file the figure applies to. Measured: sql-coder owns only '.sql' (limit 600) and
    python-coder owns '.py' (limit 400) and '.js'; a brief that states 400 to sql-coder, or
    states both limits to either without attribution, is a failure of this record and not a
    generosity.
  - >-
    THE EXCLUSION ARM IS LOAD-BEARING FOR FOUR OTHER RECORDS AND MUST BE ASSERTED AS AN
    ABSENCE OVER THE WHOLE BRIEF. "Give every specialist every standard" satisfies every
    positive clause here, and also c-1's first arm, d-1's arrival arms and d-2's arrival
    arms, and it silently empties INF-1200e's census because nobody is ever uninformed. The
    absence must be checked across the entire compiled file, not within a standards section
    — a broadcast that adds a "standards you may care about" appendix passes a
    section-scoped assertion. Fifty-seven of sixty registry agents declare no
    owns_file_extensions, so the fixture is real. THE INJECTION THAT PROVES THIS ARM IS NOT
    VACUOUS LIVES ONCE, ON INF-1200c-1, AND IS DELIBERATELY NOT DUPLICATED HERE: that
    descriptor applies the broadcast — every declared standard in every brief — and requires
    THIS record's exclusion arm to redden alongside c-1's exclusion arm and movement-departure
    half, c-2's third arm, d-1's counting arm and e-1's negative arm, while c-1's first-arm
    positive half stays green. One tree-wide injection with six named cross-record outcomes is
    maintainable; four near-identical copies are not. If this arm is ever changed, re-run that
    descriptor.
  - >-
    THE CARRIER MUST NOT INTRODUCE A FIGURE NO SPECIALIST DECLARES. INF-600a-4 is approved
    and requires every figure a brief refers to to be declared by that specialist. Whatever
    supplies standards from outside must keep that true. The disposition recorded on
    INF-1200b-2 applies here unchanged: the specialist declares the derived standards
    CHANNEL once, not a key per standard. If satisfying this record cannot be done without
    either leaving a per-standard key declared or introducing undeclared figures, that is a
    contradiction between two approved records and must be raised, never resolved silently.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around the
    config and registry reads and around every file write; log at WARNING or higher or
    re-raise; no bare or blind excepts. Note the interaction with INF-1200e-2: a swallowed
    read failure that yields an empty standards set produces a brief with no standards in
    it, which is indistinguishable from a specialist that owns nothing — the exact silence
    that record exists to forbid. A failed read must never become an empty audience.
  - >-
    CANONICAL VERSUS BUILD OUTPUT. templates/agents/ and
    templates/scripts/commit_guardian/ are canonical and tracked; .claude/agents/ and
    scripts/commit_guardian/ are untracked build outputs overwritten by build.py. Edit the
    canonical side only and re-run `python scripts/build.py --target-dir .` as part of the
    change (ADR-001). A change written only into a template leaves every deployed brief on
    the old content with no error.
test_spec:
  - name: test_inf_1200a_1_an_owners_compiled_brief_states_every_owned_kinds_standards_in_full
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Run the real build against a temporary target and read the produced
      <target>/.claude/agents/<owner>.md for a specialist the ownership record assigns a
      kind of file that carries a standard. The brief must state, for EVERY kind of file
      that record assigns it, that kind's standards attributed to that kind, with the value
      or rule itself present in the text and comparable against
      templates/scripts/commit_guardian/commit_guardian.json by a reader who has seen only
      the brief. The brief must contain no instruction to open, invoke, resolve, fetch or
      ask for anything in order to learn the standard. Read from the compiled output only —
      never from templates/agents/*.md.
  - name: test_inf_1200a_1_a_specialist_owning_no_covered_kind_has_no_standard_stated_anywhere_in_its_brief
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      THE EXCLUSION ARM, AND IT IS THE ONE THAT MAKES "REACH" MEAN ANYTHING. For a
      specialist the ownership record assigns no kind of file that carries a standard — of
      which the registry holds fifty-seven today, so the fixture is real rather than
      authored — the compiled brief states no standard for any kind of file. Asserted as an
      absence over the WHOLE compiled file, not within a standards section, so a "standards
      you may care about" appendix fails rather than passes. What may remain is an
      obligation on that specialist's own work; what may not is a recital of the project's
      rules.
  - name: test_inf_1200a_1_the_pointer_injection_reds_the_stated_in_full_arm_and_leaves_the_exclusion_arm_green
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      THE BA's NAMED MUTATION, CARRIED VERBATIM AND OBSERVED AS A PAIR. MUTATION: replace
      the stated standards in the brief with a sentence naming where the project declares
      its standards and instructing the specialist to consult that declaration before
      starting work. Under that injection the "stated in full there" arm must go RED,
      because the specialist cannot say what the standard is from the brief alone; and the
      final exclusion arm must STAY GREEN, because a pointer is equally absent from a
      non-owner's brief. Both outcomes must be observed and both must revert. The green half
      is load-bearing: an injection run that reddens both means the arms are not independent
      and the exclusion arm is not carrying what this record needs it to. The mutation is not
      a strawman — a pointer is strictly more informative than today's silence, it is the
      first thing anyone reaches for, and it satisfies every loose reading of "the standard
      reaches the specialist".
  - name: test_inf_1200a_1_the_compiled_brief_a_dispatched_specialist_receives_is_the_one_the_build_wrote
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "python scripts/build.py --target-dir <temporary target root>"
    description: >-
      PRODUCTION ENTRY POINT, ESTABLISHED ONCE HERE FOR THE WHOLE TREE. Run build.py as a
      real subprocess against a temporary target and assert that the file at
      <target>/.claude/agents/<owner>.md — the path the harness resolves an agent from at
      spawn, per Channel 6 of agent_knowledge_plane.md — is what carries the standards, and
      that it is regenerated by that run rather than pre-existing. A standards block
      computed by a function no build phase calls, or written somewhere no dispatch reads,
      is an inert value; that is the defect the whole tree exists to close, and it is
      invisible to every descriptor that inspects a template or a return value.
test_rationale: |
  The cheapest reading of this record's L1 — "the standard arrives" meaning "the standard is
  reachable" — has been satisfied since the day commit_guardian.json was written, because
  anyone can open it. So no descriptor here may be satisfiable by the standard existing
  somewhere. Every descriptor runs the real build into a temporary target and reads the
  COMPILED brief at .claude/agents/, which is the material a dispatched specialist actually
  holds. Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by Grep" and this
  record's own doc_link, a test that asserts templates/agents/python-coder.md contains
  `{{config.file_size_limit_py}}` stays green on a build whose output never reaches anyone —
  and unit_tests/prompt_assembly/test_python_coder_template.py is exactly that shape today,
  which is why the new descriptors live beside it rather than elsewhere.

  The BA's pointer mutation is carried verbatim, with its stay-green half preserved as an
  explicit required observation: a pointer is absent from a non-owner's brief too, so the
  exclusion arm must survive it, and an injection run that reddens both arms is a failure of
  the descriptor rather than a stronger result.

  A SECOND injection is needed here and deliberately does not live here. The BA's mutation
  does not reach the stuck answer this tree is most exposed to — "give every specialist every
  standard" passes the pointer test, passes every positive clause in this record, and is the
  shape that would let a-1, c-1, d-1 and d-2 all be reported satisfied while INF-1200e's
  report is emptied of content. That broadcast injection is authored once, on INF-1200c-1
  whose notes name the stuck answer, and its required outcome includes this record's exclusion
  arm reddening. Duplicating it onto four records would produce four fixtures that drift apart;
  one descriptor with six named cross-record outcomes will not.

  The exclusion arm is asserted as an absence over the whole compiled file rather than
  within a standards section, because the broadcast implementation most reviewers would
  accept adds an appendix rather than editing a section. Its fixture is drawn from reality:
  fifty-seven of the registry's sixty agents declare no owns_file_extensions at all.
