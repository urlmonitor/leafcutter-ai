    framework: unittest
    type: behavioral
    description: "Over a real on-disk work-item tree holding one identifier in the intake folder and in the active folder, and a second in the intake folder and in the completed folder, the pass returns a failing outcome with one finding per contested identifier."
  - name: test_finding_names_every_holding_lifecycle_folder
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Each finding names every lifecycle folder holding a copy of the contested identifier, asserted against the emitted output rather than a helper return value."
  - name: test_finding_reports_both_declared_states_when_they_differ
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "For the pair whose two copies declare different lifecycle states, the finding states both declared states, so a reader can identify the stale copy without opening either file."
  - name: test_identifier_in_one_folder_produces_no_finding_in_any_folder
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "An identifier held in exactly one lifecycle folder produces no finding, exercised once per lifecycle folder so the rule is not accidentally folder-specific."
  - name: test_inspected_identifier_count_is_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The pass reports how many work-item identifiers it inspected, and the count equals the number the fixture tree actually holds."
  - name: test_epic_subitem_prefixes_are_not_reported_as_collisions
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A fixture holding two different epics that each contain Master_Plan.md and 01_*.md produces no finding — the declared identifier rule distinguishes a shared numeric prefix from a shared identifier."
  - name: test_pass_runs_against_the_real_tickets_tree
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "Executed against the repository's actual tickets/ tree, the pass reports the five known twice-held identifiers and no spurious epic-sub-item findings — the real-artifact check a synthetic fixture cannot make."
test_rationale: |
  The declared-state descriptor and the epic-prefix descriptor are the two that a plausible
  implementation fails. Reporting only the folder list leaves GE-120e-2 with no basis to pick a
  survivor, and a bare-basename identifier rule floods the report with every epic's
  Master_Plan.md — verified on the real tree, where bare basenames yield dozens of spurious
  duplicates while TICKET-*.md basenames yield exactly the five. The real-tree descriptor exists
  because this AC's incumbent (check_ticket_state_integrity.py) has full unit-test coverage and
  has still never executed against anything that mattered; only running it over the actual
  collection distinguishes a working pass from a well-tested inert one.
delivers_to:
  agent: python-coder
  contract: "A per-identifier multi-location verdict — identifier, every holding lifecycle folder, and each copy's declared state — consumed by GE-120c-2 for the message and by GE-120e-2 for the repair."
