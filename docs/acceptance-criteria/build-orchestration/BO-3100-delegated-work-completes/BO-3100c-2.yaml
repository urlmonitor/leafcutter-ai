id: BO-3100c-2
title: "No entry point reaches a specialist that coordinates other specialists, and a surviving one fails even when the new path works"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given every entry point through which work can be driven,
  When each is executed to completion over a small piece of real work,
  Then the record of what dispatched what contains no dispatch whose source is a specialist,
    And every dispatch's source is a layer that holds the dispatched step's result before
    continuing.

  Given the same system with one previously-retired coordinating specialist restored and
    reachable from one entry point, while the relocated coordination continues to work
    correctly for every other entry point,
  When every entry point is executed,
  Then the run through the restored coordinator is reported as violating the arrangement and
    names that coordinator,
    And the fact that the relocated coordination works elsewhere does not suppress the report.

  Given an entry point that drives no work because there is nothing to do,
  When it is executed,
  Then it is reported as having been examined, so an entry point that could not be exercised
    is distinguishable from one that was exercised and found clean.
