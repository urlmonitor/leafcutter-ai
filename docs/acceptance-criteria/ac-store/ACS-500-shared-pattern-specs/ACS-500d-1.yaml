estimated_complexity: M
it_requirements:
  - "Pattern resolution must be a reusable function callable by scan_ac_store.py and generate_ticket_from_ac.py"
  - "Resolution must follow implements_pattern references at read time -- no denormalization or caching of pattern criteria into consuming ACs"
  - "Must handle errors gracefully when a referenced pattern AC file is missing (log warning, do not crash)"
  - "Must complete pattern resolution in <100ms per AC for typical stores"
  - "Must be idempotent -- resolving the same AC multiple times produces the same effective behavior"
