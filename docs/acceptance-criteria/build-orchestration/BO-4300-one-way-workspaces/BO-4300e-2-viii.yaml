notes: |
  Observed defect 3 (2026-10-25): the whole-folder deletion treated a file or folder that
  vanished mid-deletion as a failure. The beta arm is the boundary: tolerating a vanished
  item must not swallow a real deletion failure, and the standing post-check (cleared only
  when nothing is left at the location, BO-4300e-2) still governs. The beta arm also keeps
  BO-4300e-2-ii's rule that a partial deletion is never reported as cleared.
