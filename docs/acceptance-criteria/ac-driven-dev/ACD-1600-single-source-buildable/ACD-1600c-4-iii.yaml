notes: |
  WHY. KI-ACS-002's sharpened fix direction: a path inside a build output is either an
  assertion target or a mistake, and in neither case a file the work changes. Declaring
  files by hand removes the doc_links guesswork but not this mistake, so the refusal moves
  with the list. The regenerated-copy roots and their source mapping are whatever the build
  defines; this AC does not enumerate them. Where a regenerated copy has no source the check
  can name, the message still refuses and says so -- it does not guess a source.
