test_spec:
- name: test_cached_validator_raises_the_same_error_as_jsonschema_validate
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: unit
  angle: discrimination
  description: For invalid io_contracts and contract_definition instances, _validate_metadata raises a
    ValidationError whose message, path and validator keyword equal those jsonschema.validate raises.
- name: test_metadata_schema_is_checked_once_per_definition
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: unit
  angle: boundary
  description: Validating many instances against one definition calls check_schema once.
- name: test_yaml_is_read_with_csafeloader_when_available
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: unit
  angle: criterion
  description: _load_yaml hands yaml.load the CSafeLoader when PyYAML provides it.
- name: test_yaml_falls_back_to_safeloader_without_libyaml
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: unit
  angle: boundary
  description: With no CSafeLoader attribute, _load_yaml hands yaml.load the SafeLoader and still parses.
- name: test_python_object_tags_are_refused
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: unit
  angle: failure
  description: A !!python/object/apply document raises yaml.YAMLError through _load_yaml.
test_required: true
