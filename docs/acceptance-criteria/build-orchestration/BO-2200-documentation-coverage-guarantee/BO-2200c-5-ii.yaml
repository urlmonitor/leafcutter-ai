notes: |
  Two failure modes that only appear once selection is driven by relationship (BO-2200c-5-i),
  neither of which exists today.

  1. The ownership relationships were built for `files_touched`, so most entries carrying them
     point at source files. A relationship-driven selector that does not also require a document
     path will happily name a `.py` file as the "target documentation path" -- strictly worse than
     the current first-with-a-slash rule, which at least tends to hit a docs path first.

  2. Killing the computed fallback is the other half of "no owned document, no demand"
     (BO-2200c-5-iii). While a path is always invented, there is always something to demand, and
     the ownership rule cannot express absence. The invented path is also the mechanism behind the
     `docs/(unspecified genre)/acd-400b-6.md` targets already observed in generated tickets.

  The explicit-determination clause exists because this AC is about a gate NOT firing, which is
  the easy kind to satisfy vacuously. An implementation that returns nothing because it crashed
  and an implementation that returns nothing because it correctly found no owned document are
  indistinguishable from the ticket alone; requiring the reason in the run output makes the
  difference observable and gives the test something to assert other than absence.
