amended_by:
  - reason: "A FIFTH STARTUP-CHECK OUTCOME IS IN SCOPE: the party asked to perform the check DECLINED it. The four outcomes decomposed beneath this L1 (registry unreadable -> b-1; registry uninterpretable -> b-2; agent absent and agent denied -> b-3; plus the no-entries-collection case -> b-3-i) do not include a refusal, and on 2026-09-16 a refusal is what actually happened -- twice. Runs wf_6e6de02b-3f9 and wf_82e1655d-e68 both halted at resolve-workspace-setup-permission reporting that the registry could not be READ at .leafcutter/config/agent_registry.json. The file was present and readable at both candidate locations (131 KB, verified by direct ls). What failed was that status-checker, which declares permits_shell false, refused the read as out of scope -- and in run 2 it returned a fabricated exit_code 1 inside its refusal payload, so the workflow reported 'exit code 1, no stdout' and sent the operator to inspect a healthy path. This L1's promise -- 'You are told what could not be checked, never sent to fix a correct setting' -- is therefore NOT met by the four children as authored, because a refusal still renders as an I/O failure. The general rule now lives at BO-3200g ('You are never sent to repair something that is not broken'); this amendment records that THIS tree must obey it on the startup path, and asks the business-analyst for a sixth L2 covering the refusal outcome. Two constraints on that L2, both inherited: it must fail closed exactly as ACD-2100b-4 requires (the objection is to the diagnosis, never to the caution), and ACD-2100b-4's guard must not be written as a branch table keyed to a fixed list of outcomes -- its own it_requirements already warn against that, and this amendment is the second demonstration that the enumeration is not closed. NOTE ON SEQUENCING: ACD-2100b-5 removes the agent round-trip entirely, which removes this cause rather than merely reporting it. That is the better fix and it is already approved and unbuilt. The sixth L2 is still needed, because a refusal remains possible anywhere a party may decline, and because b-5's own Given is itself unbuildable as written -- see below."
    by: product-owner
    at: 2026-09-16
  - reason: "FLAG, NOT A CHANGE -- ACD-2100b-5 CARRIES AN UNBUILDABLE PREMISE. Its first Given is 'an environment in which no agent can be dispatched -- every dispatch attempt fails immediately with a transport error' and its Then requires the check to complete anyway. docs/reference/workflow-authoring-contract.md section 1 enumerates the globals the E2 engine injects into a workflow body -- agent, parallel, pipeline, phase, log, args, workflow, budget -- and there is no filesystem and no subprocess primitive, so a workflow body has no way to read a file except through an agent() call. On 2026-09-16 the user chose a CHARTERED EXECUTOR (an agent whose entire charter is to run one exact command and return its output verbatim, exercising no judgement) over an engine-level primitive, which is upstream in Claude Code and not leafcutter's to add. Under that decision ACD-2100b-5 needs the same reword the user authorised for its sibling BO-3200a-1: from 'no dispatch available' to 'no JUDGEMENT requested'. That is a real narrowing of an approved AC and must be an explicit amendment carrying that framing, never a silent edit. The Product Owner's jurisdiction ends at L1, so the L2 amendment is the business-analyst's to make; it is recorded here so the authorisation is not lost. See BO-3200f's notes for the full rationale and the two rejected alternatives."
