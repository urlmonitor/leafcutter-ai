readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Each drive gets its own independent copy, so parallel work can never corrupt the repo.

  When several features are built at the same time, each one works in a fully
  separate copy of the project rather than sharing one. Because the copies are
  independent, nothing one drive does can damage another's work or the shared
  history -- the class of corruption that used to require manual repair simply
  cannot happen.
