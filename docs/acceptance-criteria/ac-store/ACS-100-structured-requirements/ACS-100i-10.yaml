risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_absent_and_null_are_classified_as_one_state
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: criterion
    description: "Two fixture records differing ONLY in whether the key is missing or present-and-null are classified identically by the query. An implementation reporting only one spelling passes every aggregate count test whenever the other spelling is rare."
  - name: test_report_states_examined_count_alongside_the_answer
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: reachability
    description: "The report carries records_examined next to no_producer_total, and a run over an empty directory reports zero-examined rather than 'no records without a producer' (KI-ACS-001)."
  - name: test_leaf_breakdown_counts_list_valued_change_target
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: boundary
    description: "A fixture leaf declaring change_target as a one-element prompt list and another declaring a code+prompt list are both counted into the prompt bucket. A scalar equality comparison passes the rest of this list and fails only here."
  - name: test_real_store_totals_match_the_remeasured_counts
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "The query is run over docs/acceptance-criteria/ as it exists at the implementing commit and its totals are asserted against counts re-measured at that same commit, following the ACS-100i-7 precedent — the claim is a property of the corpus that no fixture can establish."
  - name: test_fixture_store_totals_are_exact
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: criterion
    description: "A small on-disk store with a known mix of absent, null and declared producers yields exactly the expected counts — the pinnable half of the pair, which separates 'the query is right' from 'the real store happens to contain these numbers'."
  - name: test_generated_ticket_uses_python_coder_and_says_it_was_defaulted
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "One run of the generator against a no-producer record asserts BOTH halves on the written ticket: python-coder appears in the phase list, AND the ticket states the producer was defaulted rather than declared. Asserting only the first passes on today's silent behaviour; only the second passes on a broken fallback."
test_rationale: |
  The claim under test is a count over the REAL store, so a fixture-only test
  cannot establish it — the property is a property of the corpus. Follow the
  ACS-100i-7 precedent: run the query over `docs/acceptance-criteria/` as it
  exists at the implementing commit and assert the reported totals, having
  re-measured them at that commit. Pinning 743 / 506 / 237 / 93 / 4 / 8 without
  re-measuring will fail for the wrong reason as other work lands, and a test
  that fails for the wrong reason gets deleted.

  Pair that with a fixture-store test that CAN be pinned, so the two together
  distinguish "the query is right" from "the store happens to contain these
  numbers": a small on-disk store with a known mix of absent, null and declared
  producers, asserted exactly.

  Assert the absent/null equivalence directly, with two fixture records that
  differ ONLY in whether the key is present-and-null or missing, and assert the
  query classifies them identically. An implementation that reports only one of
  the two spellings passes every aggregate count test if the other spelling
  happens to be rare.

  Assert the examined-count is reported alongside the answer and that a run over
  an empty directory reports zero-examined rather than "no records without a
  producer" (KI-ACS-001 — the store-wide validator reported success from a run
  that checked nothing for eight days, while CLAUDE.md prescribed exactly that
  invocation).

  For the last scenario, execute the ticket generator against a record with no
  declared producer and assert `python-coder` appears in the generated ticket's
  phase list AND that the generated ticket states the producer was defaulted.
  Asserting only the first half would pass on the current, silent behaviour;
  asserting only the second would pass on an implementation that broke the
  fallback. Both halves, one run.
declares_side_effect: false
notes: |
  THE FALLBACK STAYS. 743 records rely on it and removing it would refuse them
  all. This criterion does not touch it — it makes the state the fallback
  papers over askable, which is the prerequisite for ever retiring it.

  FUTURE CRITERION, deliberately not specified here: once the population of
  records with no declared producer is visible and shrinking, the
  `python-coder` default in `generate_ticket_from_ac.py` should be replaced by a
  refusal, so a record that declares no producer cannot become a code ticket by
  omission. That change is only safe after the population has been driven down;
  authoring it now would specify a change that immediately refuses 743 records.

  CORRECTION TO THE BRIEF'S NUMBERS, measured on this branch at 2026-08-25.
  The brief states "~64 leaves with change_target: prompt and ~22 with
  change_target: docs" among the unannotated records. The `docs` figure of 22 is
  right but the "leaves" qualifier is not, and the difference matters:
    - Across ALL 743 unannotated records at every level: 71 declare a prompt
      change, 22 declare a documentation change.
    - Restricted to L2/L3 leaves — the only records the generator ever turns
      into a ticket — there are 93 unannotated records in total, of which just 4
      declare a prompt change and 8 declare a documentation change.
  So the silent `python-coder` default mis-routes 12 buildable records, not 86.
  The remaining 59 prompt-change and 14 docs-change records are L0/L1
  composites, which are never generated into a ticket and for which "no
  producer" is the correct and expected state. That is a far smaller and more
  tractable repair than the brief assumed, and it is the reason this criterion
  reports the leaf breakdown separately rather than reporting one flat total
  that would overstate the problem by seven times.

  Store total is 3,379 records on this branch (the brief said 3,345 — it has
  grown by 34).

  WHAT THIS UNBLOCKS: the fast lane dispatching the producer a criterion names.
  It cannot do that safely while "no producer declared" is a state nobody can
  count, because the size of the population that would silently fall back is
  unknown at the moment the switch is flipped.

  ---
  IT-PO TECHNICAL ENRICHMENT, 2026-08-25.

  RE-MEASUREMENT AT ENRICHMENT TIME (rglob over docs/acceptance-criteria/,
  index.yaml excluded, records carrying an id only):
    - 3,385 records total. The criterion says 3,379; six of the difference are
      the records of this very AC set, which currently declare no producer.
    - 748 declare no producer: 511 by absence, 237 by null. The 237 matches
      exactly; the absent figure is 5 higher than the criterion's 506 and drops
      by 6 the moment this enrichment lands.
    - 18 records set the field to null AND declare no change_target, and 0 of
      those 18 sit at leaf level — reproducing ACS-100i-10-i's measurement
      independently.
  None of these should be pinned in a test without re-measuring at the
  implementing commit.

  THE LEAF NUMBER IS THE ONE THAT DOES NOT REPRODUCE, and it is a definition gap
  rather than a data change. Using "level in (L2, L3) and covered_by empty", the
  no-producer leaves come to 74, not 93, with 2 + 4 prompt-declaring records
  (scalar and list spellings) and 8 docs-declaring records. The docs figure of 8
  matches; the prompt figure matches only once the list spelling is counted. The
  implementer must adopt the scanner's own leaf predicate, state which predicate
  produced the number, and re-measure. The criterion's own instruction to
  re-measure already covers this; it is recorded here so the discrepancy is not
  read as a defect at implementation time.

  change_target BEING LIST-VALUED IS THE LOAD-BEARING DETAIL nobody would guess
  from the criteria. Among the 74 no-producer leaves the field takes nine
  distinct shapes, six of them lists. Any breakdown written against the scalar
  spelling silently reports a smaller, wrong-shaped population — a false-green on
  the very report this criterion exists to produce.
