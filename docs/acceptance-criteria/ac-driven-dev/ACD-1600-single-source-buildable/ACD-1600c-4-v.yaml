roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given the declared-files marker states a PRECONDITION ON THE TREE AT THE MOMENT THIS
    REQUIREMENT'S WORK IS BUILT -- `existing` meaning "the work expects to find this path" and
    `to_be_created` meaning "the work must not assume this path is present" -- so the marker is
    neither a claim that this requirement's own work creates the path, nor a historical note
    about the tree at authoring time,
  And given that a precondition is LIVE while the work is unbuilt and SPENT once the work is
    finished, which is why an unfinished record's unsatisfiable `existing` declaration is
    refused and a finished record's declarations are checked no further,
  And a fixture store in which requirement C, whose work is finished, declares
    scripts/ci/alpha.py marked to be created and whose implemented-by list names
    scripts/ci/alpha.py,
    and nine requirements D1 through D9, each of whose work is finished, each declare the same
    scripts/ci/alpha.py marked to be created and none of whose implemented-by lists names
    scripts/ci/alpha.py,
    and requirement N, whose work is not finished, declares the same scripts/ci/alpha.py
    marked to be created,
    and scripts/ci/alpha.py is present in the fixture repository tree,
  When a change that stages C, D1 and N is checked before it enters the repository,
  Then no refusal message names C, D1 or scripts/ci/alpha.py,
  And no message of any kind names C or D1: a finished record's to-be-created path that now
    exists is neither refused nor reported at commit time, because the declaration was true
    when the record was authored -- not because that record's work is what created the path,
  And N is reported exactly once, naming N and scripts/ci/alpha.py, without being a reason to
    refuse N,
  And N's report states that the path is already declared by a finished record -- naming C --
    so N is reported as a precondition another record has already satisfied and NOT as a stale
    marker,
  And given a further requirement M, whose work is not finished, which declares
    scripts/ci/beta.py marked to be created where scripts/ci/beta.py is present in the tree and
    NO other record in the store declares it at all, M's report names scripts/ci/beta.py as a
    marker no other record accounts for,
  And the two reports are distinguishable by their wording, so a reader can tell a precondition
    satisfied early by sibling work from a declaration that is simply wrong,
  And the store-wide declared-files report lists all ten finished records -- C and D1 through
    D9 -- under the section "declared to be created, now exists (work finished)", one line per
    (record, path) naming both, sorted by record id then declared order,
  And the report states that section's total as 10,
  And each listed line states whether that record's own implemented-by list names the path, so
    the one record whose work created it is separated from the nine whose work did not,
  And those ten entries never make the report command exit non-zero and are never raised at
    commit time,
  And neither the check nor the report removes, re-marks or re-orders any declared-files entry
    on C, on D1 through D9, or on N.

  Given additionally requirement P in the same fixture store, whose status is deprecated and
    whose work status is therefore not finished, declaring scripts/ci/alpha.py marked to be
    created,
  When a change that stages P is checked before it enters the repository,
  Then no message of any kind names P or scripts/ci/alpha.py: a retired requirement's
    preconditions are void rather than live, because the work they condition will never be
    built, and the only action that could clear the report is building work that has been
    deliberately retired,
  And the store-wide declared-files report lists P under the separate section label "declared
    to be created, now exists (requirement retired)", naming P and the path, and states that
    section's total as 1,
  And P is counted in neither the finished section's total of 10 nor the unfinished reports, so
    the three populations are separately countable.
