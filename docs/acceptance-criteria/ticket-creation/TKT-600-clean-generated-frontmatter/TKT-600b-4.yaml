id: TKT-600b-4
title: "The drive never edits a ticket's phase record to make it agree with the drive's own behaviour"
component: ticket-creation
components:
  - build_orchestration
  - ticket_creation_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical   # owner decision at the approval gate, 2026-09-01
roadmap_phase: phase_1
criteria: |
  Given a ticket already on disk whose phase record requires a phase the drive will not
    dispatch for that ticket's location,
  When the drive runs that ticket,
  Then the drive changes no phase status in that ticket's record,
  And the record after the run is identical to the record before it, apart from entries
    written by phases that actually ran,
  And the drive surfaces the disagreement, naming both the phase the record requires and
    the phases the drive will run,
  And the ticket is not recorded complete.

  Given instead a drive that reconciles the disagreement by rewriting that entry to
    match what it decided to dispatch,
  When the ticket is then read,
  Then that is a failure of this criterion even though the drive completed and the
    ticket reads done, and it is observable as the ticket's record differing before and
    after a run by a phase that never ran.

  The reason this remedy is excluded rather than merely unpreferred: the completion gate
  decides whether a ticket is finished by reading the ticket's own record. That decision
  is worth something only while the record is written by someone other than the party
  the gate is checking. A drive that edits the record to agree with itself makes the
  ticket agree by construction, and the gate then confirms nothing. Clearing the observed
  halt this way costs the trustworthiness of every completion decision the gate makes
  afterwards, including the ones about tickets that are genuinely unfinished.
depends_on: [TKT-600b]
