  - reason: "Reachability correction (2026-08-18): both scenarios named ENTROPY_HIGH findings in .env files, which scan_file can never produce — it short-circuits env-filename paths to a single ENV_FILE finding and returns without scanning content. Run end-to-end, scenario 1's 'ALL three findings are suppressed' was zero-of-three: the three findings that exist are ENV_FILE, which an ENTROPY_HIGH allowlist entry does not match. Swapped to the scannable filenames and rule_id the covering tests use, and tightened it_requirements to demand all three depths rather than the single deeply-nested path the test asserted. The suffix-matching behaviour under test is unchanged and was already implemented and green."
