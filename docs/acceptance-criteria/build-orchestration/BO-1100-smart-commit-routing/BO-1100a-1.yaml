id: BO-1100a-1
title: "Staged files are classified into exactly one routing group per file"
component: build-orchestration
level: L2
status: active
readiness: reviewed
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the routing config contains these entries (in order):
    - group: "tickets", path_pattern: "tickets/**/*.md"
    - group: "new-acs", path_pattern: "docs/acceptance-criteria/**/*.yaml"
    - group: "implementation", path_pattern: "scripts/**" AND "templates/**"
  And the following files are staged:
    - tickets/00_inbox/TICKET-001.md
    - tickets/02_in_progress/TICKET-002.md
  When the commit agent classifies the staged files,
  Then both files are assigned to the "tickets" group,
  And no file is assigned to more than one group,
  And the classification uses first-match-wins order from the config array.
depends_on: [BO-1100a, BO-1100c-1]
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: templates/commit-guardian/commit_guardian.json
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Must complete classification in <50ms for typical staged sets (up to 100 files)"
  - "Must handle errors gracefully per the project error handling policy"
  - "Must be importable as a standalone Python module for unit testing"
  - "Must produce deterministic output given the same config and file list"
delivers_to:
  agent: llm-expert
  contract: "JSON classification result: {matched: bool, groups: [{group: string, files: string[], template: string}], unmatched_files: string[], structural_shape: {dir_pattern: string, extensions: string[]} | null}"
expects_from:
