id: BO-1100d-3
title: "Proposed routing rule requires user confirmation before being written to config"
component: build-orchestration
level: L2
status: active
readiness: draft
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the specialist has produced a candidate routing entry:
    - group: "architecture-docs"
    - path_pattern: "docs/architecture/**"
    - template: "docs(architecture): {summary}"
  When the candidate is presented to the user,
  Then the user is shown the full candidate entry in readable format,
  And the user is prompted with at least two options:
    - "Accept" — append the entry to the routing config file
    - "Reject" — discard the candidate (the shape counter is not reset)
  And if the user selects "Accept", the entry is appended to the routing config
    at the end of the array,
  And if the user selects "Reject", the routing config is not modified,
  And the candidate is never auto-applied without explicit user confirmation.
