estimated_complexity: XS
it_requirements:
  - "The unwrapping happens inside repoFactsCall, after the single existing JSON.parse of the envelope's `output`. When the parsed value is itself an envelope — an object carrying a string `output` field alongside an `exit_code` field — parse that inner `output` once more and return the result. One extra level only; no unbounded unwrap loop."
  - "A parsed value that is not an envelope of that shape is returned exactly as parsed. The detection is structural (a string `output` AND an `exit_code` present), never a guess from the value's size or from which read produced it."
  - "The existing guard is preserved end to end: a missing reply, a non-string `output`, a non-zero `exit_code`, or an inner value that does not parse still yields null, and every caller still refuses with its worktree-undetermined abort rather than substituting a default."
  - "templates/workflows-js/build-feature.js is already over the .js size limit (see the BO-3900 ratchet skip). The change must not increase the file's line count — fold it into the existing try/return line rather than adding a new block."
  - "Canonical source is templates/workflows-js/build-feature.js. The deployed copies under .claude/workflows/ and .leafcutter/workflows/ are regenerated by 'python scripts/build.py' and are never hand-edited (ADR-001)."
delivers_to: null
