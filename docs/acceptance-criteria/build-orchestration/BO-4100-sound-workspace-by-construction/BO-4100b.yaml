criteria: |
  Your workspace's supporting material is its own, so nothing borrowed is held against you.

  A workspace carries the supporting material it needs rather than sharing another
  session's, so a check never turns your work away over something you did not
  touch, and putting your own workspace right can never disturb a session someone
  else is running at the same time.
