criteria: |
  Given the path spellings
    `C:\Users\Hendrik\x.md`, `c:/Users/Hendrik/x.md`, `C:\Users/Hendrik\x.md` (mixed),
    `\\fileserver\share\x.md` (UNC), and `/home/henzeh/x.md`
  And the relative spellings `tickets\00_inbox\x.md` and `tickets/00_inbox/x.md`
  When the build workflows' path handling classifies each one on a POSIX host
  And again on a Windows host
  Then the five absolute spellings are classified absolute on both hosts
  And the two relative spellings are classified relative on both hosts
  And resolving each of the seven against the worktree `C:/wt/epic` gives the same
    result on both hosts.

  Given the automated test that proves BO-3900 and this record
  When it runs on a Linux CI runner
  Then it runs, rather than being skipped or conditioned on the host operating system
  And before exercising anything it confirms that its Windows-shaped inputs, as held on
    that runner, contain a drive letter followed by `:` and at least one literal `\`, so
    a fixture assembled from the host's own separator stops the test rather than letting
    it pass
  And run against path handling that recognises an absolute path only by a leading `/`,
    it fails on that Linux runner, not only on a Windows machine.
