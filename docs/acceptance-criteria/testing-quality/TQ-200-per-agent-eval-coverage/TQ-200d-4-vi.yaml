criteria: |
  Given the test-writer "missing-setting-database-work" row, where
      testing_context.db_connection_test is unset,
    And a test-writer report that names testing_context.db_connection_test,
      holds its required red verification run (for example "Ran 2 tests in
      0.004s" and "FAILED (errors=2)"), and says the database tests raised the
      not-configured error in setUp before any connection was attempted,
  When the row's not-run check reads the report,
  Then the check passes,
    And a report saying the database tests "did not run against a database",
      "stopped before any connection" or "never reached the database" passes,
    And the red verification-run lines are not read as a claim that the
      database tests ran.

  Given the same row,
  When the not-run check reads a report that
      (a) says "The database tests ran and passed.", or
      (b) says the tests connected to a database, or
      (c) holds the red verification-run lines but does not say the database
          part stopped before any connection or did not run against a
          database,
  Then the check fails in each case.

  Given the test-runner "missing-setting-database-work" row,
  When its not-run check reads a report,
  Then it applies the same rule as before this change (a report claiming a
      run fails it), with the test-runner template sentence added by
      TQ-200d-4-v.

  Given the kept re-run 1 and re-run 2 test-writer reports for the row,
      recorded as probe fixtures,
  When the row is scored,
  Then both pass all four of the row's checks, and a copy of each with the
      "before any connection" / "before ever reaching" sentence removed fails
      the not-run check (no false green), and the recorded gold outputs of
      the test-writer and test-runner sets still pass.

  Given the change is done,
  Then the database-setting assertion-kind reference page describes the
      test-writer rule (in the report_says_not_run entry or a new entry for a
      new kind), with passing and failing examples, and quotes a sentence the
      test-writer template actually holds, not the test-runner sentence,
    And the drift tests that hold the reference entries equal to the kind
      registry and to the quoted template sentences stay green,
    And the produced-tests section of the evals README states the
      test-writer rule in one line linking the entry,
    And the known issue "test-writer rows check unrequested report wording"
      has its missing-setting part struck with a note naming this AC, and is
      moved to resolved naming TQ-200d-1-vi and this AC once both have
      landed, with the Open/Resolved count of the testing-quality known-issue
      register recounted,
    And one changelog entry names this AC,
    And no glossary term is added except through the glossary-triage flow,
    And the test-writer template is unchanged (user decision 2026-11-02).
