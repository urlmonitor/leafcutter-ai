assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "File-touch intersection must be computed as a set operation (O(n) per pair)"
  - "Tickets with empty or missing files_touched must be treated as touching all files (conservative isolation)"
  - "The conflict check must run before dispatch, never after"
