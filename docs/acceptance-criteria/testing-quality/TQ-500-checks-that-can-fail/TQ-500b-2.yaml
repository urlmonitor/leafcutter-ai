id: TQ-500b-2
components:
  - testing_quality
  - build_pipeline
title: "The missing answer changes the outcome, rather than being printed and passed over"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a run in which one piece of work's hand-off record carries no falsifiability
      answer while every other requirement of that piece of work is met and its
      phase reported itself finished,
  When the run reaches the point at which it decides whether that piece of work is
    finished,
  Then the decision is that it is not finished, and the stated cause names the
    absent falsifiability answer,
    And withholding only the falsifiability finding from that same run, with every
      other input identical, changes the decision to finished — which is what
      establishes that the finding is consulted rather than only printed,
    And a run in which every piece of work carries a conforming answer reaches the
      finished decision, so the finding does not block work that answered,
    And the decision is reached from the findings the run emitted; a run that
      emitted no finding for a piece of work does not have that piece of work
      declared unfinished on the strength of a finding that was never produced.
