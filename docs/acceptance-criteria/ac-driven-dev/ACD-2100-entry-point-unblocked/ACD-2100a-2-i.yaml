  - name: test_refusal_names_every_candidate_it_found
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The failure output contains the location of both candidate repositories and
      states that the step will not choose between them.
  - name: test_ambiguous_refusal_leaves_no_branch_in_any_candidate
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      After the refusal, `git branch` in each candidate repository lists exactly the
      branches it had before the attempt, and no new directory is present in either.
  - name: test_refusal_is_reached_through_the_command_line_entry_point
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "templates/scripts/setup_ticket_worktree.py invoked as a subprocess with real argv from the ambiguous directory"
    description: >-
      The refusal is produced by running the script's real command-line entry point in
      a fresh process, and its non-zero exit status is what the caller observes.
test_rationale: >-
  The dangerous implementation of ACD-2100a-2's fallback is a search that returns its
  first hit: the run succeeds, a worktree appears, and it is in the wrong project. That
  implementation passes every test written for the exactly-one case, so the ambiguous
  case has to be asserted separately or it is not covered at all. The observed workspace
  already holds more than one repository-shaped directory, so this is the normal case
  here rather than a contrived one. The no-residue assertion is separate from the exit
  code on purpose -- an implementation that creates the branch first and discovers the
  second candidate afterwards exits non-zero and still leaves the operator with cleanup
  in a repository they never meant to touch.
