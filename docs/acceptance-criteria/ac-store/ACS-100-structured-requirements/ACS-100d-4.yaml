criteria: |
  Given the AC schema defines origin_agent as a free-form string,
  When a new agent type not yet seen in the codebase writes an AC
    (e.g. origin_agent: "business-analyst-v3" or origin_agent: "custom-pipeline"),
  Then the schema validator accepts the value without error,
  And no schema change is required to support the new agent name,
  And the only constraint is that the value must be non-empty
    (empty string is rejected).
