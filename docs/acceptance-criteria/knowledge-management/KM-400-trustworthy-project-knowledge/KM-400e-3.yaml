it_requirements:
- Adapt to existing Evidence/SourceVersion/CapabilityResult contracts and trusted registry binding; injected
  knowledge port has no access to checkpoint state or lifecycle ownership.
- Follow ADR-062; preserve canonical sources and current kernel contracts. Report unexecuted real-server
  or real-model validation as not run, never passing.
test_required: true
test_spec:
- name: test_km400_e_3_behavior
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Run the actual registered invocation path with a fake port and no database; inspect evidence
    in kernel output/checkpoint, requested/executed metadata and all stop conditions, rejecting sessions/queries/secrets.
  covers:
  - KM-400e-3
  requires_db: false
- name: test_km400_e_3_public_reachability
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Exercise this AC through its intended standalone CLI/service or existing kernel capability
    caller with real-format inputs; prove the result is observable outside the internal helper and optional
    prerequisites are honestly reported.
  covers:
  - KM-400e-3
test_rationale: Behavioral proof uses the public caller and source-format fixture so internal helper tests
  cannot mask missing wiring. Live server gates remain distinct from deterministic fake-provider tests.
