id: DK-600c-5-i
title: "Reference: what a decision record contains"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a decision record staged by a run, for example dec-d53e1c52cd47c832,
  When a reader looks up its contents in the reference,
  Then the reference lists every part of the record: identity, the question, the filters, the
    answer, the evidence, the authority and the provenance, plus the append-only corrections,
  And it states that evidence is held as locators and content hashes, never as text,
  And it states that only a decision a human approved, with an approval time, produces a record,
  And every field it lists is a field of the record schema the kernel validates against, and every
    field of that schema is listed.
