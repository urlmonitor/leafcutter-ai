criteria: |
  Given an existing persona at docs/personas/field-service-engineer/persona.yaml with:
    - goals: ["Minimize equipment downtime", "Complete repairs on first visit"]
    - frustrations: ["Incomplete service history"]
  When the persona expert agent is invoked with: "Add a goal about mobile connectivity and a frustration about documentation gaps"
