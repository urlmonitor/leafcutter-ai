roadmap_phase: phase_1
criteria: |
  Given a set of conflicts of which some are recorded as not yet decided,
  When the reconciliation runs,
  Then it states how many conflicts are undecided,
    And for each, how long it has been outstanding since it was first raised.

  Given a conflict recorded as not yet decided on one run,
  When the reconciliation runs again a month later and no verdict has been recorded,
  Then the time it has been outstanding is reported as longer than on the earlier
    run,
  So deferral accumulates visibly rather than resetting each time it is reported.

  Given a run in which every conflict has a resolution recorded,
  When the reconciliation runs,
  Then the undecided count is zero and no ageing is reported,
  So the ageing report is a consequence of deferral and not a permanent fixture.

  Given a conflict recorded as not yet decided,
  When that state is recorded,
  Then it carries who or what recorded it and when,
  So a deferral is attributable and is not indistinguishable from a conflict nobody
    has looked at.
