assigned_agent: python-coder
estimated_complexity: M
package_surface: false
declares_side_effect: false
it_requirements:
  - >-
    NO PACKAGE SURFACE — MEASURED IN THIS WORKTREE, NOT ASSUMED, WHICH IS WHY THE SPEC
    HERE IS A PLAIN LIST RATHER THAN THE STRUCTURED FIVE-FIELD OBJECT.
    _package_surface_registry.WATCHED_REGISTRIES binds exactly two containers on
    commit_guardian.json: hooks_manifest.hooks (by entry id) and the document's own top
    level (by mapping key, with only "$schema" and "_comment" excluded). Both were read at
    enrichment time. `check-file-size` is ALREADY one of the hooks ids, so no id is added.
    `file_size` is ALREADY one of the top-level keys, and everything this record could
    conceivably want to configure — the permitted lengths it compares against — is
    `file_size.line_limits`, NESTED inside it and therefore invisible to the watcher. This
    record registers nothing. Do NOT mint a config_schema_fragment to satisfy the
    structured-spec validator: BP-1600a-2-ii records that BP-100k-4 and BP-100k-4-i both
    declared keys that were never created and still do not exist. An imaginary key makes
    the machine-checked spec less trustworthy than no spec at all. If GE-127f-3's
    author-versus-specialist threshold eventually needs a configuration home, that is
    GE-127f-3's declaration to make and must not be pre-declared here.
  - >-
    ONE COMPARISON, ONE THRESHOLD — THE ADDRESS IS GE-127b-1's SHIPPED COMPARISON AND
    NOWHERE ELSE. _file_size_ratchet already resolves each staged covered file's previous
    length from its HEAD blob, measures both lengths with the one shared function, and
    judges the direction. What changes is the LENGTH THAT COMPARISON IS JUDGED AGAINST. Do
    not stand up a second gate beside it, a second previous-length source, or a second
    measurement. Express the new threshold as the single end-state value — the less
    demanding of the permitted length and (previous length minus measured lines added) —
    computed once per file and compared once. An implementation that computes a REMOVAL
    QUOTA and then checks it has been met drifts from the criteria on the capped arm and
    on the zero-addition arm, and is the shape to avoid.
  - >-
    THE CAP GOVERNS MORE THAN A THIRD OF THE REAL POPULATION AND IS NOT A COURTESY.
    Measured in this worktree: 988 tracked .py files, 212 above 400 counted lines, 62,524
    excess lines, median oversized file 551 counted lines, and 78 of the 212 standing
    between 400 and 500. The "previous length minus added" half is the memorable half and
    the cap is the half that reads like a rounding concession; dropping it makes the gate
    demand hundreds of lines from files that are twenty over. Both halves are load-bearing
    and the named cap mutation below exists to prove it.
  - >-
    THE FOUR QUANTITIES IN A REFUSAL COME OUT OF THE COMPARISON THAT REFUSED, NOT FROM A
    SECOND DERIVATION. Before-length, after-length, measured lines added, and the required
    length are all already in hand at the moment the verdict is formed; print those four
    values. Recomputing any of them on the way to the message is how the printed arithmetic
    stops reconciling with the verdict, and the author is then handed four numbers that do
    not add up. This record takes no position on how the refusal READS — that is GE-127e's
    — only that those four quantities are present and mutually consistent.
  - >-
    GE-127b-1's DELIVERED BOUNDARY DESCRIPTOR WILL GO RED, AND THAT IS A NARROWING TO BE
    CARRIED IN THE SAME CHANGE — NOT A REGRESSION TO BE DISCOVERED.
    test_ge_127b_1_an_oversized_file_left_at_exactly_its_previous_length_commits is green
    today and asserts that a same-length change to an already-oversized covered file
    commits. This record's third arm refuses exactly that case when the change added 50
    measured lines. After this lands, the delivered descriptor holds for ONE shape only: a
    change that added no MEASURED lines — the surviving shape GE-127f-2's last arm owns
    ("adding only unmeasured content is free"). The reconciliation is GE-127f-2's to
    execute because GE-127f-2 owns what "added" means, and it is written out there: the
    descriptor is NOT deleted and its assertion is NOT weakened, its fixture is pinned to a
    change that adds no measured lines, and its name and description are amended to say so.
    Both records land in one change; whoever implements this one must confirm the amended
    descriptor is green in the same run rather than leaving a mystery failure behind. The
    narrowing is already recorded on GE-127b's amended_by and GE-127b's criteria stay
    untouched.
  - >-
    NO ARM IN WHICH THE COMMIT COMPLETES MAY BE REACHABLE BY STRIPPING BLANK LINES OR HASH
    COMMENTS — THIS IS A FIXTURE CONSTRAINT, NOT A SECOND COUNTING RULE. Measured by probe
    in this worktree: count_content_lines strips triple-quoted regions and block comments
    ONLY. It does NOT strip `#` line comments (three of them count as 3) and does NOT strip
    blank lines (four of them count as 4). So deleting whitespace and hash comments is a
    fully valid, and the cheapest, way to discharge a demand made under this record.
    Reclassifying which lines count is GE-127d's call and MUST NOT be settled here by
    writing a second counting rule into this comparison. What IS required here: every
    fixture whose commit completes must reach its end state by WHOLE CONSTITUENT
    DEFINITIONS leaving the file — never by blank-line or hash-comment stripping — so no
    descriptor can be satisfied by the manoeuvre. A fixture that reaches the number the
    cheap way has failed to exercise the record and must be rebuilt, not accepted.
  - >-
    THE DOCSTRING-ONLY LOOPHOLE IS REAL, IS ACCEPTED, AND MUST BE RECORDED RATHER THAN
    HIDDEN. Because "added" is necessarily counted in the same unit the file's length is
    counted in (GE-127f-2, consuming GE-127d), a change that adds ONLY docstrings or block
    comments has added nothing measured and is therefore free at any size — an arbitrarily
    large docstring-only addition to an already-oversized file commits. That is the honest
    consequence of refusing to write a second counting rule, not an oversight, and the
    alternative (counting additions in a different unit from the file) is forbidden in four
    places in this tree. Whoever implements this must carry that reasoning into the
    module's own DECISION HISTORY beside the threshold, so the next reader meets the
    argument rather than the surprise and does not "fix" it by introducing the second rule.
    Closing it, if it is ever to be closed, is GE-127d's.
  - >-
    THE TRAP THAT BIT THIS REPOSITORY TODAY — IF THIS CHANGE ADDS ANY NEW MODULE IMPORTED
    BY check_file_size.py, BOTH HAND-ENUMERATED FIXTURE LISTS MUST BE UPDATED IN THE SAME
    CHANGE. unit_tests/commit_guardian/_ge_127a_1_ordinary_commit_fixture.py
    (PRODUCTION_MODULES) and unit_tests/commit_guardian/_ge_127c_1_scope_fixture.py each
    copy a hand-maintained list of modules beside check_file_size.py into their temp
    repositories. Nothing checks either list against the real import graph. When GE-127e-1
    added the _file_description import, both lists were silently incomplete and six
    descriptors went red, surfacing as "baseline commit failed" with the actual
    ModuleNotFoundError visible only inside a captured traceback; it was caught only by
    rebasing onto main and running the WHOLE commit_guardian suite. Do that run before
    signing off, whether or not a module was added.
  - >-
    HOST AND LAYERING, AND THE REFLEXIVE HAZARD. Prefer keeping the new threshold inside
    _file_size_ratchet.py beside the comparison it belongs to. If a new module is warranted,
    it goes INSIDE templates/scripts/commit_guardian/, which build_commit_guardian copies
    verbatim, so no scripts/build_phases.py deploy-map entry is needed. A module imported
    from OUTSIDE that directory MUST be added to the deploy map in the same change or the
    DEPLOYED hook raises ModuleNotFoundError at commit time while every source-tree test
    stays green. Note that this guard is subject to its own limit and its own ratchet:
    growing check_file_size.py or _file_size_ratchet.py past 400 counted lines while
    implementing this record makes the gate refuse the very commit that implements it — and
    under this record it will then also demand twice what the change added.
  - >-
    HOOK-RUNNING COMMITS GET THE BUILD-CLASS TIMEOUT, NOT THE SHORT ONE. Any descriptor
    that performs a real `git commit` through a `.pre-commit-config.yaml` must use the
    180-second bound (_HOOK_COMMIT_TIMEOUT_SECONDS), never the 30-second plumbing bound. At
    30s this construction was observed FLAKY in this worktree today — passing at 28.5s and
    timing out at ~30s on the same commit — and a TimeoutExpired reads exactly like a real
    refusal, so the flake is indistinguishable from the behaviour under test. Plain git
    plumbing keeps the short bound.
  - >-
    PROPORTION AND SPLITTING, BECAUSE THIS GATE JUDGES ITS OWN TESTS. The descriptors below
    do not fit one module under a 400-counted-line limit. Split them across focused test
    modules sharing ONE fixture helper — the established shape is
    _ge_127a_1_ordinary_commit_fixture.py (real `git commit` through a one-hook
    .pre-commit-config.yaml) and _ge_127c_1_scope_fixture.py. When a test module reaches
    the limit the precedent is SPLIT plus a shared fixture module, never an exemption.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around any
    read or subprocess; log at WARNING or higher or re-raise; no bare or blind excepts. A
    swallowed error on the added-line input must never become an added-line count of zero —
    that collapses the required length back to the previous length for every file and
    silently restores GE-127b, which is precisely the fail-open GE-127f-2-i exists to make
    impossible. Route it there.
  - >-
    COST BUDGET, BECAUSE THIS RUNS ON EVERY COMMIT. The new threshold may be computed only
    for files already judged to stand above their permitted length, and must read no file
    and run no subprocess that was not already run to measure them. A commit that refuses
    nothing must not become measurably slower than it is today.
  - >-
    CANONICAL VERSUS BUILD OUTPUT, AND THE BUILD IS PART OF THE CHANGE.
    templates/scripts/commit_guardian/ is canonical and tracked; scripts/commit_guardian/
    and the repo-root .pre-commit-config.yaml are untracked build outputs that build.py
    overwrites, and templates/commit-guardian/commit_guardian.json is a decoy needing no
    edit. Edit the canonical template and re-run `python scripts/build.py --target-dir .` —
    config.py resolves commit_guardian.json beside the DEPLOYED script, so an unbuilt change
    leaves the running gate on GE-127b's old threshold while every source-tree test passes.
test_spec:
  - name: test_ge_127f_1_an_oversized_file_given_back_less_than_twice_what_was_added_is_refused_naming_four_quantities
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      In a real temporary git repository with the gate installed, establish a covered file
      standing at 2,677 measured lines against a permitted length of 400, then stage a
      change adding 50 measured lines and leaving it at 2,628, and run an ordinary `git
      commit`. The commit must not complete, and the outcome must state all four
      quantities — the length before, the length after, the lines the change added, and
      the length required — all read from the process output, never compared against a
      literal the test authored beyond the fixture's own construction. Repeat with the
      same file and the same 50 added lines left at exactly 2,677: also refused, because a
      change that adds to an already-oversized file and gives back only what it took is no
      longer sufficient. NAMED MUTATION (mandatory, run it, do not merely describe it —
      the BA's injection 2, THE MULTIPLIER, carried verbatim): "judge the file against its
      previous length alone — GE-127b's shipped comparison, unchanged." MUST GO RED: the
      2,677-line arm left at 2,628, the 2,677-line arm left at exactly 2,677, and the
      410-line arm left at 401. All three commit under the injection and must be refused.
      MUST STAY GREEN: the 2,677-line arm left at 2,627, the 410-line arm left at 400, the
      zero-addition arm, and the under-limit silence arm. This injection is not
      hypothetical — it is the code that ships today. It is the RED BASELINE for this
      record and must be captured before any work starts.
  - name: test_ge_127f_1_an_oversized_file_left_at_previous_length_minus_the_lines_added_commits
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      The same 2,677-line covered file with the same 50 added measured lines, left standing
      at 2,627 — net 50 lines out of the file, the 2x effect — commits cleanly, and is not
      refused for still standing far above its permitted length. The fixture must reach
      2,627 by whole constituent definitions leaving the file, never by deleting blank
      lines or hash comments, which today's measurement rule counts and which would
      discharge the demand while improving nothing; assert the end length from the gate's
      own quoted number so a fixture whose size drifted is visible. This is one of the two
      arms that must STAY GREEN under both of this record's named mutations.
  - name: test_ge_127f_1_the_demand_is_capped_at_the_permitted_length_and_never_asks_for_more
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      A covered file standing at 410 measured lines against a permitted length of 400, with
      a change adding 50 measured lines, commits when it is left standing at exactly 400 —
      sixty lines leave the file, not a hundred — and is refused when it is left at 401.
      Both outcomes are read from the real commit. NAMED MUTATION (mandatory, run it, do
      not merely describe it — the BA's injection 1, THE CAP, carried verbatim): "judge the
      file against the previous length minus the lines added, unconditionally, ignoring the
      permitted length — that is, drop the "less demanding of" and keep only the
      subtraction." MUST GO RED: the 410-line arm left at exactly 400, which commits today
      and is refused under the injection because the injection demands 360. MUST STAY
      GREEN: both 2,677-line refusal arms, the 2,677-line arm left at 2,627, the
      zero-addition arm, the under-limit silence arm, and EVERY arm of GE-127f-2. This is
      the single most likely wrong implementation, because "previous minus added" is the
      memorable half of the rule and the cap is the half that reads like a courtesy. It is
      not a courtesy: 78 of the 212 oversized files in this repository stand between 400
      and 500 measured lines, so the cap governs more than a third of the population.
  - name: test_ge_127f_1_a_change_that_adds_no_measured_lines_to_an_oversized_file_is_free
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      The same 2,677-line covered file, with a change that adds no measured lines and
      removes three, leaving it at 2,674, commits and nothing further is required of the
      change — the outcome asks nothing more of that file. This is the load-bearing free
      case of the whole L1 (the urgent correction in a very large file) and the arm that
      must stay GREEN under both of this record's named mutations and under GE-127f-2's.
      The three removed lines must be whole constituent definitions, not blank lines or
      hash comments.
  - name: test_ge_127f_1_a_file_at_or_below_its_permitted_length_is_not_in_this_population_at_all
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      A covered file standing at 380 measured lines against a permitted length of 400, with
      a change adding 12 measured lines and leaving it at 392, commits AND no line of the
      outcome names that file. Guards the seam with GE-127a-1's silence arm: an over-eager
      end-state rule applied to every file rather than only those already above their limit
      refuses or reports ordinary growth everywhere. Once a file reaches its permitted
      length it leaves this regime entirely and GE-127a-1's threshold governs it alone;
      this descriptor asserts only that this record's comparison does not reach it.
  - name: test_ge_127f_1_the_cap_and_multiplier_injections_red_their_own_arms_and_leave_the_named_siblings_green
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      THE TWO-INJECTION PROOF, RUN AS TWO EXPERIMENTS AND RECORDED AS ONE RESULT. Apply the
      CAP injection, run every arm above AND every arm of GE-127f-2, and record the
      outcomes together; then revert, apply the MULTIPLIER injection, and do the same. The
      REQUIRED OBSERVATIONS, each of which must actually be observed rather than assumed:
      under the CAP injection the 410-at-400 arm is RED while both 2,677 refusal arms, the
      2,627 arm, the zero-addition arm, the under-limit silence arm and EVERY ARM OF
      GE-127f-2 are GREEN; under the MULTIPLIER injection the 2,628 arm, the exactly-2,677
      arm and the 401 arm are RED while the 2,627 arm, the 400 arm, the zero-addition arm
      and the under-limit silence arm are GREEN. The stay-green halves are not decoration
      and are not optional: they are the evidence that the cap and the multiplier are
      separable and that this record is not a duplicate of GE-127f-2. AN INJECTION RUN THAT
      REDDENS EVERYTHING IS A FAILURE OF THIS DESCRIPTOR, NOT A STRONGER RESULT — it means
      the arms were never independent. Both injections must revert cleanly.
  - name: test_ge_127f_1_the_end_state_verdict_reaches_the_registered_hook_output_and_refusal_status
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      PRODUCTION ENTRY POINT. Run the gate through the registered hook path with an
      oversized covered file staged short of its required end state and assert the refusal
      and its four quantities appear in the hook's OWN output stream, in the same per-file
      block as the length finding, under the ordinary finding exit status rather than an
      advisory note. A threshold computed by a function nothing at commit time calls is
      inert, and the shipped gate's comparison is reached only through this path.
  - name: test_ge_127f_1_the_deployed_copy_applies_the_end_state_threshold_in_a_cold_process
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After build.py, the DEPLOYED copy of the gate and every module it imports load and
      run in a cold process, and the refusal arm and the 2,627 allow arm both hold against
      it. A new module placed outside templates/scripts/commit_guardian/ without a
      scripts/build_phases.py deploy-map entry surfaces here as ModuleNotFoundError rather
      than passing, and a threshold written only into the canonical template and never
      built fails here instead of passing on source-tree greenness.
test_rationale: |
  Every descriptor performs an ordinary `git commit` in a real temporary repository over
  real history and reads its assertions out of the process output and the commit outcome.
  Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by Grep" and this record's
  own doc_link, a test that reads the comparison's source, or calls a threshold function
  directly, stays green on a gate whose new threshold is computed and never consulted.

  The BA's two named mutations are carried into descriptors verbatim rather than restated
  as prose. They are load-bearing in opposite directions. The MULTIPLIER injection is not
  hypothetical — it is the shipped code, so it doubles as this record's red baseline and
  must be captured before any work starts. The CAP injection guards the half of the rule
  that reads like a courtesy and in fact governs 78 of the 212 oversized files.

  The dedicated two-injection descriptor exists because the stay-green halves are the
  separability argument, and a stay-green half that is merely asserted in prose is not
  observed. Recording "every arm of GE-127f-2 stayed green under both of this record's
  injections" as a REQUIRED observation is what distinguishes this record from GE-127f-2;
  the coupling runs the other way (GE-127f-2's injection necessarily reddens this record's
  refusal arms, because an input read wrong makes any comparison vacuous) and that
  asymmetry is declared on GE-127f-2 and must be reported there, not suppressed.

  The under-limit descriptor is a seam guard, not a restatement of GE-127a-1's silence: it
  asserts only that this comparison does not reach a file that is not already over. The
  reachability and deployed descriptors are not redundant with each other — reachability
  proves the registered hook path executes the new threshold, deployed proves the BUILT
  copy and its config are what execute, which is where a missing deploy-map entry surfaces.
delivers_to:
  - agent: python-coder
