id: GE-122b-1
title: "A new artifact added where numbers are expected is reported when it takes none"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a declared enrolment rule that names, per namespace, the locations where an artifact is
    expected to carry a number and the locations that are exempt — for the diagram namespace,
    the diagrams location is enrolled while component-description documents, decision records
    and index files in the same tree are exempt,
  When a change set ADDS a file named "self-heal-sequence.md" to the enrolled diagrams location,
  Then the enrolment check terminates with a failing result,
  And its output names that file, states that it carries no sequence number, and states the
    next free sequence number for its level,

  And when a change set instead ADDS a component-description document to an exempt location,
  Then the enrolment check terminates with a passing result and reports nothing for it,

  And when a change set ADDS a file to the enrolled diagrams location whose name carries a valid
    level-and-sequence prefix that no other artifact claims,
  Then the enrolment check terminates with a passing result and reports nothing for it,

  And in every one of these runs the check states which enrolment rule it applied, so a passing
    result cannot be produced by an empty or unloaded rule.

  Coverage note: covered only by a test that executes the check against a real on-disk tree with
  each of these files actually added, and asserts on the result value and the file paths and
  next-free number named in the output. A test asserting that an enrolment table is defined does
  not cover it.
depends_on:
  - GE-122b
