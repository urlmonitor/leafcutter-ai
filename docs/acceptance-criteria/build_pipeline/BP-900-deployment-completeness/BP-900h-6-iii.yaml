notes: "Detection half of the KI-CG-20260831-0713 pair; the gate-side correction is BP-100k-4-ii. The parent BP-900h-6 and its two edge cases are all work_status done, and their criteria are genuinely met — the defect they missed lies outside what they specify, which is why this is filed as a new constraint rather than as a reopening. Measured context on 2026-09-07: the reachability gate is always_run true with pass_filenames false, so it runs on every adopter commit, and two registered conditions select Python files. A fresh TypeScript consumer exits 1 with total=52 unreachable=27 exempt=9. That measurement is superseded: the 2026-09-28 re-measurement recorded in amended_by (exit 0, unreachable=0) is the current state."
