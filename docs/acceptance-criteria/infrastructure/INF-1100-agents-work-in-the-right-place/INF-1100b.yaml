id: INF-1100b
title: "A contradicting hand-off can't send work to the wrong place"
component: infrastructure
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  When a hand-off names a location that disagrees with your config, the config wins.

  If an agent is handed an instruction pointing at a location that contradicts
  the configured one, the agent resolves the correct location from configuration
  and uses it — instead of trusting the contradicting input — so a stray path in
  a hand-off never silently lands work in the wrong folder.
