assigned_agent: llm-expert
estimated_complexity: S
package_surface: false
delivers_to:
- agent: python-coder
  ac_id: TQ-500g-1-viii
  contract: >-
    On /build-epic, for every ticket that reaches a coder or a commit in this drive, including one with
    no source_ac, ticket-supervisor runs heavy_lane_gate with --record "<ticket_key>" (the key from
    build-epic.js's dispatch prompt), so the CLI itself writes
    <git-dir>/leafcutter/gate-verdicts/<ticket_key>/red_baseline.json (git-dir = git rev-parse
    --absolute-git-dir of the worktree). The supervisor never writes, edits or deletes that record.
expects_from:
- ac_id: TQ-500f-3-i
  contract: >-
    The one red-baseline reader, on main: python <worktree>/{{config.output_root}}/scripts/build_orchestration/fast_lane.py
    heavy_lane_gate [--source-ac <comma-separated ids>] --test-root <dir> --ac-root <dir> [--ticket
    <ticket file>]. --source-ac absent or empty means not applicable. It prints one JSON verdict
    ({gate_passed, applicable, verified, outcome, reason, ...}) and exits 0 if and only if gate_passed;
    with no ids, outcome is 'red-baseline reader not applicable: no source requirement'. --ticket
    records a pass in the ticket's frontmatter (red_baseline_gate) and reuses it on a later call, so a
    resumed ticket whose tests are already green is not judged red-less.
- ac_id: TQ-500g-1-viii
  contract: >-
    (a) The record option --record <ticket-key> on heavy_lane_gate (through _fl_cli.py, one keyword in
    fast_lane.py's dispatch, and _fl_heavy_lane_gate.py); NOT on main as of adb0c2e61, added by
    TQ-500g-1-viii in this same change. (b) build-epic.js's dispatch prompt to ticket-supervisor carries
    ticket_key: <ticket file stem, checked against ^[A-Za-z0-9._-]+$>.
it_requirements:
- >-
  Where: the same new subsection of templates/skills/building-epics/SKILL.md that TQ-500g-1-vii adds,
  plus the section 2.1 pseudocode before the first coder spawn. Change templates/agents/ticket-supervisor.md
  only where it restates it (its test-writer paragraph). One llm-expert change with TQ-500g-1-vii.
- >-
  When: once per drive, immediately before the first coder spawn of that drive (python-coder,
  sql-coder or any agent whose produces trait is production_code), including on resume when
  test-writer is already signed_off. When the drive will spawn commit but spawns no coder (a resumed
  ticket whose coders are already signed_off), run it once before the wrong-version sequence instead:
  the --ticket record makes the CLI reuse the pass it recorded earlier, and the backstop needs this
  record (user decision Q1 (a), 2026-10-22).
- >-
  Input check, before the command: ticket_key and every source_ac id must match ^[A-Za-z0-9._-]+$; the
  worktree root and the ticket path must contain none of ", $, backtick, CR or LF. Without ticket_key
  in the dispatch input, use the ticket file's stem and check it the same way. On a failed check run
  nothing, dispatch no coder and return blocked with gate "verify_red_baseline" and the rejected values.
- >-
  Command, exactly one Bash call from the worktree root (no cd, pipe or chain). <root> is the worktree
  root with forward slashes, <ticket> the ticket file's absolute path with forward slashes, <ids> the
  source_ac ids joined by commas. For K3 drop the --source-ac "<ids>" pair:
  python "<root>"/{{config.output_root}}/scripts/build_orchestration/fast_lane.py heavy_lane_gate --source-ac "<ids>" --test-root "<root>" --ac-root "<root>/docs/acceptance-criteria" --ticket "<ticket>" --record "<ticket_key>"
  These are the inputs /build-feature passes (TQ-500f-3-ii), quoted, plus --record.
- >-
  Fail closed: stdout must parse as one JSON object with gate_passed a boolean; otherwise dispatch no
  coder and return blocked with gate "verify_red_baseline" and the raw stdout. On gate_passed false,
  return blocked with message naming the reader's reason and refused tests, gate
  "verify_red_baseline" and gate_verdict = the reader's JSON verbatim; dispatch no coder. The test
  writer's red_baseline_verified claim or sign-off is never a substitute.
- >-
  Outcome: return red_baseline_gate = the verdict's outcome verbatim in the ticket's result payload
  (beside TQ-500g-1-vii's wrong_version_outcome). K3's value is "red-baseline reader not applicable: no
  source requirement"; it continues to the coder and is never reported as verified.
- >-
  The record is the CLI's. The supervisor never writes, edits, paraphrases or deletes anything under
  <git-dir>/leafcutter/. --ticket (frontmatter record, reused on resume) and --record (the backstop's
  record) are both passed; neither replaces the other.
- >-
  Tickets WITH source_ac get every existing halt reason of the shared reader (for example
  no_new_covering_tests). That is the carried-over TQ-500f-3-ii user decision.
- >-
  The reader alters no working file, so it runs outside the commit-phase lock and needs no
  one-ticket-per-chunk rule of its own.
- >-
  Size: no ratchet applies to the two .md templates (see TQ-500g-1-vii); this AC's share of the growth
  is about +20 to 30 lines of SKILL.md and +3 to 6 of ticket-supervisor.md.
- >-
  Ship in ONE change with TQ-500g-1-vii and TQ-500g-1-viii. Without -viii the record option and
  ticket_key do not exist. Without this instruction, -viii's hook blocks every /build-epic commit.
- >-
  The edit passes prompt-audit: one invocation per command, and the spawn_allowlist covers every spawn.
test_required: false
test_rationale: >-
  Prompt-only (change_target: prompt), for the same reasons as TQ-500g-1-vii. The reader is
  deterministic and already tested (TQ-500f-3-i, TQ-500f-3-ii). The code parts are tested in
  TQ-500g-1-viii: heavy_lane_gate writing its own record with --record, the ticket_key in build-epic.js's
  dispatch prompt, and the hook that blocks the commit of a /build-epic ticket whose red-baseline record
  is missing, unreadable or failed. Substitutes for the prompt itself: pr-reviewer against the Then
  clauses, and a live /build-epic drive of a fixture epic with K1 to K3.
