test_required: true
test_spec:
  - name: test_absent_log_directory_is_created_up_to_the_enduring_root_and_reprobed
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "A temp install whose real knowledge_sink.json declares an enduring root that exists while the log directory (and the debugging/ directory between them) does not; the real location query (sink_resolution.py --print-location telemetry) prints the stream path. The shared probe helper is run as a real process against that printed path; asserts the result is pass, the log directory and every missing directory up to the root now exist, and the stream at the printed path holds exactly one probe line."
    must_catch:
      - "hard-fail on the first miss without remediation"
      - "retry more than once"
  - name: test_first_miss_alone_never_produces_the_hard_block
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Same declaration with the log directory absent; build-epic.js runs under the E2 harness over an epic with one ready ticket. Asserts the terminal payload is not blocked, no hard-block operator message appears, and the ticket receives its phase dispatches."
  - name: test_remediation_creates_nothing_outside_the_enduring_root
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Before the remediated probe, snapshot the enduring root's parent directory (paths and mtimes, excluding the root's own subtree); after it, that snapshot is unchanged and the only new paths are the missing directories under the root and the stream file."
  - name: test_absent_enduring_root_is_not_remediated
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "The declared enduring root is deleted after the declaration is written and the real location query is run. The helper must return the stale-declaration failure (BO-100d-1a Scenario 2, remediation 'rebuild') and must not create the enduring root or anything under it; the root still does not exist after the call."
    must_catch:
      - "mkdir -p the full printed path, including the enduring root"
test_rationale: >-
  The remediation branch is a real filesystem effect, so it is proven on a real
  temp tree with the probe target taken from the real location query, never from
  a hard-coded path. Three tests drive the shared helper as a real process because
  the bound "up to and never above the enduring root" is a property of what is
  created on disk, which only a before/after snapshot can check; one test drives
  build-epic.js under the E2 harness to prove the first miss does not reach the
  hard-block path in the real workflow. The stale-root test is the discriminating
  one: a naive mkdir -p of the printed path passes every positive test here and
  silently resurrects a moved or deleted project.
