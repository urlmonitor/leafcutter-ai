it_requirements: |
  The non-suppressibility guard must survive a manual downgrade in the ticket file, exactly
  as the TDD-mandatory guard restores test-writer/test-runner. Re-generation or re-validation
  must re-assert needed rather than trust the on-disk not_needed.
