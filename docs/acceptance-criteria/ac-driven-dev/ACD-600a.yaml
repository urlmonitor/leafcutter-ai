id: ACD-600a
components:
  - ac_driven_dev
readiness: reviewed
priority: medium
title: "mark_ac_done script sets work_status to done for a given AC or ticket"
component: ac-driven-dev
level: L1
status: active
req_status: active
work_status: done
criteria: |
  Given a standalone script accepts --ticket or --ac arguments,
  When invoked with a valid ticket path that has a source_ac field,
    or with a valid AC ID directly,
  Then the referenced AC YAML file is updated to work_status: done,
  And the script validates preconditions (AC exists, AC is active, ticket has source_ac)
    before writing,
  And the script is idempotent (re-running on an already-done AC is a no-op exit 0),
  And all outcomes are logged to stdout/stderr with structured messages.
depends_on: [ACD-600]
