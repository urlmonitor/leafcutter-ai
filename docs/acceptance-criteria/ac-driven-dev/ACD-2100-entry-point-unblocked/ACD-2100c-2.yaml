it_requirements:
  - "The change must land under templates/. The deployed workflow is build output."
  - "The pause record must be durable before the process exits and must be written to the project's own store, not beside the caller. Both properties come from ACD-2100a-4; until it lands this behaviour degrades to a persist failure when run from a worktree, which is where the original loss was observed."
  - "'Waiting' must be established by the record on disk, not by the reported outcome. A run that reports waiting while having written nothing is not paused, it is lost, and it satisfies every assertion made against the return value."
  - "No step after the decision point may run on any path out of an unreachable channel -- including a timeout path. A timeout that proceeds is the same loss with a delay."
  - "The drafted work must be left byte-identical. The pause must not normalise, rewrite or relocate anything the earlier steps produced."
  - "Must satisfy the repository error-handling policy: the record write is external I/O; a failed write must be logged at WARNING or higher and must not be reported as a successful pause."
  - "Must be idempotent: reaching the same decision point twice for the same run leaves one record."
test_spec:
  - name: test_unattended_run_from_a_worktree_pauses_with_a_record_on_disk
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      An unattended invocation with no interactive session, driven from a real git
      worktree of the project with drafted work already on disk; after the process
      exits a record naming the run and the decision point is present in the project's
      store and the run reported that it is waiting.
  - name: test_no_step_after_the_decision_point_runs_when_no_person_can_answer
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the plan-feature workflow driven through the workflow runner as an unattended invocation, with the run's own step record read back afterwards"
    description: >-
      The run's record of the steps it executed ends at the decision point -- no later
      step appears, and no authoring output from a later step exists on disk.
  - name: test_drafted_work_is_byte_identical_after_the_pause
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      The drafted artifacts on disk before the run are compared byte-for-byte with the
      same files after the process exits; nothing was rewritten, relocated or removed.
  - name: test_pause_written_from_the_worktree_is_readable_from_the_project_root
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      A second fresh process started with the project root as its working directory
      lists the run as waiting -- the worktree-written record read by a reader that
      starts somewhere else.
test_rationale: >-
  The worktree Given is not decoration. Pausing is only durable if the record can
  actually be written, and the pause store is reached through three cwd-relative paths
  that ACD-2100a-4 fixes; until then, "pause instead of discard" degrades to a persist
  failure from exactly the working directory where the original loss was observed.
  Evidence gathered from the workspace root only does not close this record, which is
  why the worktree is in the Given rather than in a note. The on-disk assertion after
  process exit is the anti-phantom clause: a run that reports waiting while having
  written nothing passes any assertion made against the return value. The byte-identical
  comparison is stronger than "the files still exist" because the failure that matters
  here is losing reviewed content, not losing filenames.
delivers_to:
  - agent: python-coder
    ac_id: ACD-2100c-3
    contract: "A durable pause record naming the run and the decision point it stopped at, present in the project's own store after the process exits and readable by a later process started from any working directory -- the state ACD-2100c-3 resumes from."
  - agent: python-coder
    ac_id: ACD-2100c-5
    contract: "An unreachable-channel outcome that is a pause: the drafted work remains on disk and the run's recorded outcome is 'waiting', never a stop attributed to a person."
expects_from:
  - ac_id: ACD-2100a-4
    contract: "A pause store whose read, write and read-back all resolve to the project's own store rather than to a location relative to the caller's working directory, with the write durable before process exit and its reported success matching what is on disk."
