readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Guided, confirmation-gated recovery that never touches your repository without your say-so.

  When a parallel drive detects that the shared repository has been left in a
  damaged state and halts (see BO-1600c), you are not left to hand-repair the git
  store yourself. You get a safe, guided path back to a working state: the recovery
  is non-destructive by default, never runs on its own, and always tells you in
  plain terms exactly what it will do before it does anything -- and only proceeds
  once you confirm. Any project that installs leafcutter and runs build.py gets
  this recovery guidance the same way, without relying on notes in the leafcutter
  repository's own setup. This completes the BO-1600 promise that you never have
  to hand-repair a broken git store: BO-1600c stops the drive and tells you it is
  broken; BO-1600d gives you the guided, opt-in way to get unblocked.
