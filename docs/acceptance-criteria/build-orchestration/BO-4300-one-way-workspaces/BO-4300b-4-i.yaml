notes: |
  Reproduced in the DIAGraph adopter (leafcutter v21.0.121, pin d4c0dde5, after #1445 fixed the
  build location): DIAGraph commits .pre-commit-config.yaml as a git symlink (mode 120000) to
  .leafcutter/pre-commit-config.yaml, created by an earlier build under the default "auto" shim
  strategy. The maker builds with LEAFCUTTER_SHIM_STRATEGY=copy (an ordinary file), its restore step
  then puts the committed link back to keep the tree clean, and install_paths_regular refused that
  link: every ensure answered VERIFY_FAILED, so /build-feature could start no epic there.
