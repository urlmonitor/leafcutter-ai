id: BO-300a-5-iii
components:
  - build_orchestration
title: "Work that vanished from the epic is judged against what the drive actually completed, so no output calls the same work both completed and not built"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a drive whose completion-time re-read of the epic's set of work affirmatively
    confirms it read that set, and finds no work added after planning, but finds that
    one or more planned pieces of work are no longer present in the epic,
    And in the first case every piece that is no longer present is one the drive
      itself completed during this drive, and the drive's own record of completed
      work names it,
    And in the second case at least one piece that is no longer present is one the
      drive did not complete, and the drive's record of completed work does not
      name it,
    And in the third case both kinds are present in the same drive,
    And in the fourth case nothing is missing and the epic genuinely finished,
  When the drive produces its completion output -- whether by the return it takes
    when there were no batches to run or by the return it takes at the end of the
    last batch,
  Then in the first case the output names each such piece as no longer present, does
    not describe it as unbuilt or as work that was not done, and still leads with a
    success value and an affirmative epic-complete verdict, because the drive's own
    completed record establishes that the work was done before the piece disappeared,
    And in the second case the output withholds the epic-complete claim exactly as it
      does for work discovered after planning: the leading outcome value is not a
      success value, the epic-complete verdict is not affirmative, the piece that
      neither completed nor remains is named, and the output states what the operator
      should do about it,
    And in the third case the withholding is driven only by the pieces the drive did
      not complete, and the pieces it did complete are still reported as no longer
      present rather than as unbuilt,
    And in the fourth case the output leads with a success value and an affirmative
      epic-complete verdict, with nothing named as missing,
    And in every case no single output ever names the same piece of work both as one
      the drive completed and as one that was not built,
    And in every case the leading outcome value, the epic-complete verdict, and the
      sentence the output states about the epic all agree with one another: none of
      the three reports completion while another denies it,
    And in every case where the output does contradict itself, the suite's own
      epic-outcome contradiction check reports the disagreement rather than passing,
      including when the contradiction is worded as work that was not built rather
      than as an epic that is not complete,
  So a piece of work that moved or was deleted after the drive finished it is
    reported as gone and nothing more, planned work that neither finished nor remains
    still blocks the completion claim, and the completion output can never assert a
    piece of work was both done and not done.
