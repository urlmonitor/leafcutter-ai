it_requirements:
  - "Surface is agent/skill prose: the conflict path already exists in templates/agents/pull-request.md (Merge-State Poll Gate -> CONFLICTING -> conflict-resolver) and finalize-feature.js Step 2 (merge origin/main --no-commit, HALT on conflict). MODIFY the prose so a conflict that cannot be auto-resolved ends in an operator blocker, never a force-merge that discards main's commits."
  - "Forbid main-overwriting resolution: no `git push --force` to the default branch, no `-X ours` strategy that drops main's commits; conflict-resolver may rebase/merge the working branch but must never rewrite main."
  - "The blocker must state the PR conflicts with main and leave the PR unmerged; reuse the existing conflict-resolver escalation path and the building-epics blocker schema."
