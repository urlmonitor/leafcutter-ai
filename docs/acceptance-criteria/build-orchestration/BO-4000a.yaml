id: BO-4000a
title: "A worktree step that reports any location other than the one it was told stops the run before a single phase agent is dispatched"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given the workflow told the worktree-opening agent to open the worktree at
    `C:\Users\Hendrik\Code\leafcutter\worktrees\EPIC-TruthfulProjectRecord`
  When that agent reports it opened the worktree at
    `C:\Users\Hendrik\Code\leafcutter\worktrees\uxp-700-tranche-2\tickets\00_inbox\epics\EPIC-TruthfulProjectRecord`
    (the incident), or at any other location that is not the one it was told
  Then no phase agent is dispatched
  And the run stops with a refusal that names both the location it was told and the
    location it reported
  And the run's worktree is not replaced by the reported location.

  Given the same instruction
  When the agent reports the same directory spelled differently —
    `C:/Users/Hendrik/Code/leafcutter/worktrees/EPIC-TruthfulProjectRecord`, or
    `c:\users\hendrik\code\leafcutter\worktrees\EPIC-TruthfulProjectRecord\`
  Then the report is accepted as the location it was told
  And the run continues with that worktree.

  Given the same instruction
  When the worktree-opening agent returns no readable result at all
  Then no phase agent is dispatched
  And the run stops with a refusal stating that no usable result came back from the
    worktree step
  And that refusal is distinguishable from the wrong-location refusal above.

  Given the run reused the worktree resolved for the target (no worktree was opened)
  When any later agent's result carries a different `worktree_path`
  Then phase agents keep being handed paths rooted in the resolved worktree.
