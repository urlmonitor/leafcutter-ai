  - name: test_both_subcommands_announce_the_searched_repository_on_stderr
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The error stream of each of those subprocesses names the selected repository and
      marks the selection as coming from a search rather than from the script's own
