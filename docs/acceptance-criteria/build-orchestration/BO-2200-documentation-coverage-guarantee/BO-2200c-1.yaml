      type: object
      description: "Ticket-body '## Agent Contracts' -> '### documentation-expert' section placed after '## Acceptance Criteria' and before '## Sign-offs', with globally numbered '- [ ] AC-N:' lines."
  reference_file_path: "scripts/ac_store/generate_ticket_from_ac.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "The generator (_build_ticket_body) emits an '## Agent Contracts' -> '### documentation-expert' block, placed after '## Acceptance Criteria' and before '## Sign-offs' (there is no '## Agent Contracts' section today)."
    - "Lines are globally numbered '- [ ] AC-N:' across the whole ticket, not restarting per subsection."
    - "This block is the single source of truth for both the writer's brief (BO-2200c) and the verifier's checklist (BO-2200b)."
delivers_to:
  agent: python-coder
  contract: "The `## Agent Contracts` -> `### documentation-expert` block (positioned after Acceptance Criteria, before Sign-offs, one globally-numbered AC-N line per documented AC). Consumed by BO-2200c-2/3/4 (line content) and BO-2200c-5 (shared source of truth)."
