it_requirements:
  - "AGENT REASSIGNED FROM workflow-architect TO python-coder — IT PO correction, not a preference. config/agent_registry.json gives workflow-architect is_ticket_phase false, selection_criteria null and spawned_by [user]: it cannot be dispatched as a ticket phase, so a ticket generated from this AC would name an implementer the supervisor never runs. python-coder is the correct owner and the registry says so explicitly: it claims .js ownership with the rationale that Leafcutter's orchestration layer is the workflow JS under templates/workflows-js/ and its covering tests are pytest driving unit_tests/_workflow_engine_harness.py, so the executable contract really is Python. The same correction applies to INF-700a-1-i and INF-700a-1-ii."
  - "THE SURFACE IS templates/workflows-js/, NOT scripts/. The five completion paths are build-epic.js, build-ticket.js, fast-lane-ship.js, quick-fix.js and finalize-feature.js. Changes made only to the deployed .claude/workflows/ copies are overwritten by the next build.py run — a failure mode this repository has hit before. Edit the templates and rebuild."
  - "THE FIVE PATHS DO NOT SIT ON FIVE SURFACES — IT PO correction, and it decides whether INF-700a-1-i can pass. build-epic.js does not call build-ticket.js: its batch loop dispatches the ticket-supervisor AGENT (build-epic.js line 388), which drives phases from templates/skills/building-epics/SKILL.md, whose Canonical Phase Ordering Table (section 2.1.1) is a SECOND, independent copy of the ordering that build-ticket.js keeps in code. So a wiring added only to build-ticket.js covers single-ticket drives and leaves EPIC drives unwired while every test over the single-ticket path stays green. That is the partial-wiring outcome INF-700a-1-i exists to catch, occurring inside the change meant to prevent it. Coverage must be demonstrated for both drive shapes, whichever surface is edited."
  - "TRIGGER POINT — the BA decision the L1 left open, AS REFINED ON 2026-09-07. The routing step runs ONCE PER COMPLETED UNIT OF WORK, in the driver's completion sequence, after the phases that perform the work have returned and BEFORE the phase that publishes the unit of work's own output. Not per phase agent (the emitters are the phase agents, and ADR-011 chose deferred harvest precisely so the write is batched away from them). Not on a schedule (this package ships no scheduler, and a cron a user must install is the manual invocation the L1 rejects, wearing a hat). Not at feature finalization ALONE, because single tickets, the fast lane and quick-fix never finalize — finalization is one completion path among several, covered by INF-700a-1-i. THE REFINEMENT, AND WHAT IT REPLACES: this bullet previously read 'after the LAST PHASE AGENT has returned and before the driver reports its result'. Commit and pull-request ARE phase agents, so that wording placed the routing step after the only publication the path makes, which is irreconcilable with INF-700a-5's requirement that the writes ride a commit the path already makes and that the routing step add no commit of its own. Moving the invocation ahead of the publishing phases reconciles the two. It costs a tail — the publishing phases emit as well, and their records are emitted after the sink has been read — and that tail is a one-run deferral rather than a loss, because the sink now outlives the working directory (INF-400c-4, as rewritten). INF-700a-5-ii owns what the run says about the tail."
  - "THE RESULT MUST BE CONSUMED, NOT MERELY PRODUCED. The routing figures must reach the driver's reported result, which means the driver reads the run's output and branches or renders on it. A fire-and-forget invocation whose output goes nowhere satisfies the words 'the routing step ran' and satisfies nothing this AC is for. This repository has shipped that exact shape twice — fast-lane-build.js invoking gates whose results were never read, and fast_lane.py's select_batch call that was a silent no-op — and both passed their structural tests."
  - "NOT COVERABLE BY GREP. Per this repository's 'Gate / Workflow ACs — verify behaviorally, not by grep' rule, the test must run a completion path and assert on the destination file's contents afterwards, or — where the unit layer cannot run the driver — assert that the routing result is consumed in guarded control flow. A test that asserts a call string is present in a workflow file passes on dead code and does not cover this AC."
  - "IDEMPOTENCE IS INHERITED, NOT REBUILT. INF-400c-3 already requires the routing step not to duplicate a written learning. The 'second run adds nothing further' clause here asserts that property survives being invoked automatically on every completed unit of work — which is the first time it will be exercised repeatedly against the same sink. Do not add a second dedupe mechanism in the driver."
  - "ORDERING AGAINST THE SINK. Wiring this before INF-400c-4 lands gives a caller that reads a file no producer writes to, forever, and reports a confident zero. Wiring it before INF-400c-4-iv lands gives a caller that reports a failure on every tree where nothing has been emitted yet, which is every fresh clone. Both edges are in depends_on for that reason and neither is decorative."
  - "Must handle errors gracefully per the project error handling policy. The failure behaviour itself is INF-700a-1-ii's and must not be re-specified here."
  - "WHICH TREE THE DESTINATION FILES ARE IN — CLOSED 2026-09-07, AND THIS BULLET NO LONGER INSTRUCTS ANYONE TO ESCALATE. It formerly raised, as an open gap, that four of the five completion paths run inside an isolated working directory and that nothing committed the routing step's writes before that directory was reclaimed. The answer is INF-700a-5 (the writes ride the completion path's own existing commit) plus this record's own ordering refinement (the routing step runs before the publishing phases). The escalation is discharged; do not raise it again. WHAT STILL BINDS, unchanged: do NOT resolve anything here by inventing a commit inside the routing step, and treat a build that harvests into a working directory whose contents are never published as not satisfying this AC. THE PER-PATH DISPATCH POINTS LIVE ON INF-700a-5's it_requirements and are named there once; do not re-derive them per path from this bullet."
delivers_to:
  - agent: documentation-expert
    contract: "The settled trigger point and the shape of the routing figures in a driver's reported result, which INF-700a-3's how-to and INF-700a-4's reference describe"
  - agent: python-coder
    contract: "A per-completion invocation of the routing step whose read/written/unwritten figures are consumed by the caller, making the routing side observable per drive rather than only via a store-wide count"
expects_from:
  - ac_id: INF-400c-4
    contract: "The single declared knowledge-emission sink, so the caller reads the file the emitters actually write to"
  - ac_id: INF-400c-4-iv
    contract: "The no-work outcome for an absent sink, so a completion path that harvests does not report a failure on a tree nothing has emitted into yet"
origin_agent: BrainCandy
created: 2026-09-07
amended_by:
  - reason: "BA amendment, 2026-09-07, closing the criteria-level hole the IT PO raised in this record's own it_requirements (the WHICH TREE THE DESTINATION FILES ARE IN entry). One clause added to criteria: the three destination files must still hold the learning text after the working directory the unit of work ran in has been removed. Nothing else in this AC changed and the trigger point is untouched. WHY: as written, 'those three destination files each contain the learning text' was satisfied by a routing step writing into an isolated working directory that finalize-feature removes at step 7, so the criterion held for a few seconds in a directory nobody would read again, the tests passed, and production lost every learning. The IT PO was right to refuse to settle it in an it_requirements line — a durability obligation that lives only in implementation notes is not a criterion and nothing fails when it is missed. The outcome, the publication site, and the rejected alternatives are stated by the new INF-700a-5; this clause only makes the vacuous reading of the clause above unavailable. OPEN, AND DELIBERATELY NOT DECIDED HERE: whether satisfying the new clause is possible AT the driver's completion step as this AC words it, or requires the invocation to sit earlier in the path so its writes ride the path's own commit. That is an ordering question for the IT PO, and if the answer is 'earlier', it is a refinement of the trigger point and must come back to the BA and PO rather than being absorbed as an implementation detail."
    by: business-analyst
    at: 2026-09-07
  - reason: "BA amendment, 2026-09-07, resolving the trigger contradiction this record's own previous amendment left open, on the strength of BrainCandy's approved decision that the sink resolves against the repository and therefore outlives an isolated working directory. THE CONTRADICTION: the trigger bullet said the routing step runs 'after the last phase agent has returned'. Commit and pull-request are phase agents, so that put the routing step after the only publication the path makes — while INF-700a-5 requires the writes to ride a commit the path already makes and adds no commit of its own. Both could not hold. WHAT CHANGED: the When clause and the trigger bullet now place the invocation in the driver's completion sequence BEFORE the phase that publishes the unit of work's own output; a clause was added making a route-after-publication wiring an explicit failure; and a clause was added stating that records emitted after the sink is read are deferred rather than lost. IT CLOSES because the only cost of routing early — that the publishing phases emit after the sink has been read — is now a one-run delay instead of a discard: those records sit in a sink that no longer dies with the working directory, and a later completed unit of work in the same repository routes them. Before the sink change this was the real-loss window that made the option unattractive; the sink change removes it. WHAT IS UNCHANGED: once per completed unit of work, on every path that completes work, with the figures consumed by the driver — and the rejections of per-phase-agent, scheduled and finalization-only triggers all stand on their original reasons. ALSO NOW CLOSED: the IT PO's 'WHICH TREE THE DESTINATION FILES ARE IN' escalation in the it_requirements below. Its answer is INF-700a-5 plus this ordering refinement; its instruction to escalate before implementing has been discharged and no second escalation is owed. Its warning against inventing an unattended commit inside the routing step is NOT discharged and still binds."
    by: business-analyst
    at: 2026-09-07
