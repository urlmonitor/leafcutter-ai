  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NOW SET AND CROSSES AN AGENT BOUNDARY. Both documentation records in this
  branch depend on what an exclusion IS: GE-126d-4 has to tell an author how to record one,
  GE-126d-5 has to state that it never changes enforcement. The contract carries those two
  facts explicitly because they are the two a reader will otherwise guess wrong.

  A DECISION LEFT OPEN ON PURPOSE, AND FLAGGED. Where the exclusion record lives is NOT
  fixed here. It should be decided against GE-126d-3's single declaration rather than
  ahead of it, because inventing a home for it now is how a fifth enumeration gets created
  on the same day the fourth is closed. The fifth it_requirement says so; a coder who
  reaches this record before GE-126d-3 should raise it rather than choose.

  A DEPLOY-MANIFEST WARNING. If the exclusion store is a new file, the build must deploy
  it or the deployed parity check sees no exclusions at all and names every excluded check
  - which is the noise failure this branch is trying to avoid, arriving through the build.

  AGENT — python-coder. Surface is check_hook_parity.py plus whatever data surface the
  exclusion record lands on; both Python-adjacent config, no split warranted.

  NOT AUTHORED HERE: declares_side_effect (derived per BO-2900g-2, see KI-CG-015).
