criteria: |
  Given the hooks reference, which today says in one place that a guard's non-zero ending never
    blocks a session tool call, and in its escape-hatch table that guards block with one,
  When a reader looks up how a session-time guard refuses a tool call,
  Then the reference states one way a guard refuses, and it is the way the repaired
    documentation guard and guide-read guard refuse,
  And no other passage in the reference states a different way,
  And the catalogue entry for the documentation guard states that the folders it watches come
    from the project it is installed in,
  And the catalogue entry for the guide-read guard states that whole-file writes are checked and
    that gated folders are matched in main and linked working copies alike,
  And the reference points to where each guard's liveness record is read, rather than asserting
    in its own words that the guard works.
