# Post-merge suite -- the correctness lane (TQ-600a-13-ii, TQ-600a-13-i).
#
# Runs the tests the default (per-PR) run does not collect: the `manual` tests
# (every `_MANUAL`-suffixed test), minus the `timing_ratio` lane, which has its own
# workflow (post-merge-timing.yml) and never holds a merge. Without this
# cadence the exclusion would silently delete the only quick warning that the
# shared-layout routing has started handing mutators the shared root.
#
# Three jobs, one conclusion:
#   run     executes the lane once, uploads the per-test report and the list of
#           first-run failures. It exits ZERO whenever it produced a report:
#           test failures are data, not a job failure.
#   retry   starts on a FRESH runner, receives ONLY the failure list, checks out
#           and builds for itself, and re-executes exactly those ids once under
#           the SAME `-m` selection. Skipped when there were no failures.
#   verdict reads both reports and the run/retry results, writes
#           post-merge-verdict.json (artifact `post-merge-verdict`), and fails at
#           exactly one of the steps named `Verdict: red` / `Verdict: did not
#           complete` on a non-green run. It runs on EVERY ending, cancellation
#           included (the job and each of its steps are `if: always()`).
#           The run's conclusion IS this job's exit status.
# All decision logic lives in scripts/ci/post_merge_suite.py; these steps only
# prepare the environment and invoke it. Nothing here writes to the repository,
# issues or pull requests, and no run: step carries a dollar-brace expression
# (context arrives through env: and the runner's standard variables).
#
# Coalescing: at most one run in progress and one waiting; a newer waiting run
# replaces an older one (which ends `cancelled` and carries no verdict, see
# scripts/ci/_run_history.py); a run in progress is never cancelled.
#
# Timeouts are bounded at about three times the measured cost of the lane
# (43 tests, ~1,004 s measured by TQ-600a-13 / PR #1050) so a hang ends as
# did-not-complete in bounded time instead of occupying the single slot.

name: Post-merge suite

"on":
  push:
    branches: [main]
  schedule:
    # Heartbeat: every 12 hours, deliberately off the hour (see heartbeat_max_hours
    # in scripts/ci/post_merge_tunables.json) and off the timing lane's minute.
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: post-merge-suite
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      failures: ${{ steps.lane.outputs.failure_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: several tests read repository history via `git -C`.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build
        run: python scripts/build.py --target-dir .

      - name: Run the correctness lane
        id: lane
        env:
          AC_ENFORCE_STRICT: "1"
        run: python scripts/ci/post_merge_suite.py run --report first-run-report.json --failures first-run-failures.txt -- python -m pytest -m "manual and not timing_ratio" tests/ unit_tests/ -p no:cacheprovider --durations=20

      - name: Upload the first-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-run-report
          path: first-run-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the first-run failure list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-run-failures
          path: first-run-failures.txt
          if-no-files-found: ignore
          retention-days: 30

  retry:
    needs: run
    if: needs.run.outputs.failures != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build
        run: python scripts/build.py --target-dir .

      - name: Download the failure list
        uses: actions/download-artifact@v4
        with:
          name: first-run-failures
          path: first-run-failures

      - name: Re-execute the first-run failures once
        env:
          AC_ENFORCE_STRICT: "1"
        run: python scripts/ci/post_merge_suite.py retry --failures first-run-failures/first-run-failures.txt --report retry-report.json -- python -m pytest -m "manual and not timing_ratio" -p no:cacheprovider

      - name: Upload the retry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-report
          path: retry-report.json
          if-no-files-found: ignore
          retention-days: 30

  # ---- the live-database lane (TQ-600a-13-xxi): the whole tests/knowledge_live/ folder against disposable databases.
  # Its own jobs, so a database that never starts cannot take the correctness lane's report down (TQ-600a-13-xxii),
  # and the verdict job can attribute the ending from the job result plus the absent report. The three service
  # instances are the Proof-of-done job's (ci.yml `done-proof`) verbatim -- same image, host ports, credentials and
  # memory -- and the fix proof starts the same ones from scripts/ci/_live_lane.py INSTANCES (a change to one is a
  # change to all). The credentials are the disposable test literals ci.yml already carries; no secret is referenced. All
  # decision logic, including the marker override that selects the whole folder, lives in post_merge_suite.py.
  live_run:
    runs-on: ubuntu-latest
    # Not yet measured on a real run (TQ-600a-13-xxi asks for it): set to the correctness lane's bound until then.
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      failures: ${{ steps.lane.outputs.failure_count }}
    services:
      knowledge-retrieval:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/leafcutter-local-tests
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 17687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p leafcutter-local-tests 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12
      knowledge-domain:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/leafcutter-domain-tests
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 18087:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p leafcutter-domain-tests 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12
      knowledge-native:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/leafcutter-native-tests
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 18088:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p leafcutter-native-tests 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build
        run: python scripts/build.py --target-dir .

      # The lane checks the address is reachable (a probe, then a held first connection) before any test.
      - name: Run the live-database lane
        id: lane
        env:
          AC_ENFORCE_STRICT: "1"
          LIVE_DB_ADDRESS: "127.0.0.1:17687"
          LIVE_DB_STARTUP_LIMIT: "120"
        run: python scripts/ci/post_merge_suite.py run --lane live --report live-first-run-report.json --failures live-first-run-failures.txt -- python -m pytest tests/knowledge_live/ -p no:cacheprovider --durations=20

      - name: Upload the live first-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-first-run-report
          path: live-first-run-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the live first-run failure list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-first-run-failures
          path: live-first-run-failures.txt
          if-no-files-found: ignore
          retention-days: 30

  live_retry:
    needs: live_run
    if: needs.live_run.outputs.failures != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      knowledge-retrieval:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/leafcutter-local-tests
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 17687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p leafcutter-local-tests 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12
      knowledge-domain:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/leafcutter-domain-tests
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 18087:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p leafcutter-domain-tests 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12
      knowledge-native:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/leafcutter-native-tests
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 18088:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p leafcutter-native-tests 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build
        run: python scripts/build.py --target-dir .

      # The ONLY thing received from the first execution is the failure list.
      - name: Download the live failure list
        uses: actions/download-artifact@v4
        with:
          name: live-first-run-failures
          path: live-first-run-failures

      # No folder in the command: the retry runs exactly the listed ids, under the lane's own marker override.
      - name: Re-execute the live first-run failures once
        env:
          AC_ENFORCE_STRICT: "1"
          LIVE_DB_ADDRESS: "127.0.0.1:17687"
          LIVE_DB_STARTUP_LIMIT: "120"
        run: python scripts/ci/post_merge_suite.py retry --lane live --failures live-first-run-failures/live-first-run-failures.txt --report live-retry-report.json -- python -m pytest -p no:cacheprovider

      - name: Upload the live retry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-retry-report
          path: live-retry-report.json
          if-no-files-found: ignore
          retention-days: 30

  verdict:
    needs: [run, retry, live_run, live_retry]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read-only: the verdict counts each test's passed-on-retry runs from the earlier
      # runs' verdict artifacts (TQ-600a-13-xiii), at most 9 requests, never the issues API.
      actions: read
    # EVERY step below is status-agnostic (`if: always()`): a step with no `if:` implies
    # `success()` and is skipped once the run is cancelled, which would leave a cancelled
    # run with no verdict artifact. The step conditions below that read `steps.classify`
    # still only fire when the classify step produced a verdict.
    steps:
      - uses: actions/checkout@v4
        if: always()
        with:
          persist-credentials: false

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download the reports
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The dependency results are what tell a failed setup, a failed retry and a cancellation
      # apart from a run that simply had no failures (TQ-600a-13-v). They arrive through env:.
      - name: Classify the run
        id: classify
        if: always()
        env:
          RUN_RESULT: ${{ needs.run.result }}
          RETRY_RESULT: ${{ needs.retry.result }}
          LIVE_RUN_RESULT: ${{ needs.live_run.result }}
          LIVE_RETRY_RESULT: ${{ needs.live_retry.result }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci/post_merge_suite.py verdict --artifacts artifacts --output post-merge-verdict.json --api-url "$GITHUB_API_URL" --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"

      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-merge-verdict
          path: post-merge-verdict.json
          if-no-files-found: error
          retention-days: 90

      - name: "Verdict: red"
        if: always() && steps.classify.outputs.verdict == 'red'
        run: python scripts/ci/post_merge_suite.py exit-status --verdict-file post-merge-verdict.json

      - name: "Verdict: did not complete"
        if: always() && steps.classify.outputs.verdict == 'did_not_complete'
        run: python scripts/ci/post_merge_suite.py exit-status --verdict-file post-merge-verdict.json
