notes: |
  THIS IS THE PART OF THE L1 THAT CAN BE GOT WRONG WHILE LOOKING RIGHT. The L1
  says the chosen places are "identified from the top of the project down", and
  every scenario in the parent and its siblings assumes one obvious top. This
  repository has a documented reason not to assume it: the same check resolves
  its suppression file from the resolved link target under the enclosing
  workspace rather than from the working copy, so a suppression written in a
  worktree's own copy is silently ignored. That is recorded in the component
  architecture doc as a live trap and in this repository's own conventions. The
  root the check has in reach today is therefore the WRONG one for this purpose,
  and an anchoring change that reuses it converts the cheapest fix in this goal
  into a repository-wide false-positive event: every acceptance-criterion file
  under a secondary working copy would start reporting a credential, and the
  first repair anyone reaches for under that pressure is to widen the entitlement
  again.

  ALL FOUR ARMS ARE RED OR UNTESTABLE TODAY, but not for the same reason as the
  parent's. Today the entitlement is granted by an unanchored text match, so the
  first arm passes by accident — the chosen names appear in the path whatever the
  top is. It stops passing by accident the moment anchoring lands, which is
  precisely when the wrong anchor becomes reachable. Read the first arm as a
  guard that only starts doing work after the parent's change, not as a
  demonstration of it.

  BOUNDARY WITH GE-120b, held deliberately and not to be closed as a duplicate.
  GE-120b is about a check that skips its work in one working copy and does it in
  another, and reports success either way — the subject there is a check that did
  not run. Here the check runs, completes, and reaches a different verdict
  because it measured from a different place. Same symptom family, different
  cause, and the fix for one does not produce the other.

  BOUNDARY WITH GE-125d. The fourth arm asserts only the VERDICT when the top
  cannot be determined: nothing is entitled. Whether the check also says out loud
  that it could not determine the top, and where it says it, belongs to GE-125d
  and is deliberately not asserted here. Do not read this record as settling the
  announcement, and do not close GE-125d against it.

  FOR THE IT PO. The secondary working copy must be a real one made the way this
  project makes them, not a directory that merely looks like one — the trap being
  guarded is about how the top is resolved, and a hand-built lookalike may resolve
  by a different route than the real thing and pass while the real case fails.
  The token is assembled at runtime from fragments, as recorded on GE-125a-1.
