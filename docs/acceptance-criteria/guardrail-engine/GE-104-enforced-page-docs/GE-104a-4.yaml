criteria: |
  Given the page-documentation guardrail capability is delivered across two layers
    (planning-time trigger of GE-104a-2 and commit-time hook of GE-104a-1)
  When someone needs to understand how enforcement flows end-to-end
  Then a sequence diagram is available that depicts the planning-time path: a
    ticket's files_touched listing a new page drives agent selection, which flips
    documentation-expert to "needed"
  And the same diagram depicts the commit-time path: a git staged diff is read, the
    page-to-doc path is derived, a doc-exists check runs, and the commit is blocked
    or warned according to the configured mode

  ---

  Given both enforcement layers rely on the same page-to-doc derivation rule so they
    cannot disagree about which doc a page maps to
  When someone reads the sequence diagram
  Then the diagram makes explicit that the planning-time path and the commit-time
    path share one page-to-doc derivation step
  And the diagram shows that this shared derivation is the single point that keeps
    the two layers from drifting on the mapping rule
