id: BO-2600b-1
components:
  - build_orchestration
title: "The fast lane resolves its build set with structural-parent prerequisites excluded, on every run"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an acceptance-criterion store in which a target leaf criterion lists its own
    structural parent as a prerequisite, that parent lists ITS parent as a prerequisite,
    and two further not-done leaves sit beneath that grandparent,
  When an operator aims the fast lane at the target leaf and the lane resolves the
    connected build set for it,
  Then the resolved set contains the target leaf, the target leaf's own descendants, and
    the target leaf's genuine prerequisites — those that are not simply the criterion it
    hangs beneath,
  And the two further leaves, which are reachable only by walking up through structural
    parent links, are absent from the resolved set,
  And the operator supplies nothing beyond the criterion id to get that scope: the lane
    excludes structural-parent prerequisites on every run, with no second argument, no
    per-run switch, and no way to ask for the wider set from this entry point.
