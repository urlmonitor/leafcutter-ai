      shared runner, with the same inputs the fast lane and /build-feature
      pass": proposed addition "after asking the writer what is owed and, when
      anything is, having test-breaker prepare it from that list unchanged".
    - "And the verdict is the runner's own; the supervisor's summary of it never
      stands in for it": proposed addition "and the supervisor hands the
      preparer's reply on unchanged".
  FOLLOW-UPS OUTSIDE THIS AC: depends_on does not name TQ-500g-1-v (the
  wrapper), -iv or -ix (BA/user to add).
