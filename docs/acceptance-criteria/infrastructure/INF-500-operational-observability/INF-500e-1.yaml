notes: |
  A reopen is the one signal in this report the delivery system cannot award
  itself: it is only ever recorded against the system's own prior claim of
  completion. That is why the trust tier is built on it rather than on the raw
  count of criteria marked done, which has a documented history of being wrong.

  The deletion scenario and the filed-and-closed-in-one-period scenario are the
  two ways this metric would silently drift. Counting a deleted record as a
  reopen would spike the reopen rate on every routine cleanup; refusing to count
  a criterion that was born and closed inside the same period would understate a
  fast week. Both are stated as scenarios so a future change to the movement
  computation has to break a test rather than a reviewer's memory.

  The unknown-when-nothing-closed scenario is deliberately duplicated in spirit
  with INF-500e-2 but not in mechanism: here it is the trust computation itself
  refusing to divide by zero, there it is the rendering layer refusing to print
  an unobtained figure as a digit.
