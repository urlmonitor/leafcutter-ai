criteria: |
  Given an agent template does not declare a default_origin_agent field,
  When the agent creates a new AC file without explicitly setting origin_agent,
  Then the AC file's origin_agent field is populated with the agent's own
    identity name (e.g. an agent named "business-analyst"
    produces origin_agent: "business-analyst"),
  And the fallback derivation uses the agent's registered name,
  And the resulting origin_agent value is always non-empty,
  And schema validation passes.
