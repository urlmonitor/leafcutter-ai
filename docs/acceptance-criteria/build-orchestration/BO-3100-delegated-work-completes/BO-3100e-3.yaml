  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a step whose declaration says nothing at all about the result it produces,
  When the step ends and its completion is judged,
  Then it is not counted as done,
    And the build reports that the step declares no result, naming the step,
  So an omission is never read as a step that was never expected to produce
    anything.

  Given a step that explicitly declares it produces nothing observable and states
    the reason,
    And it ends having produced nothing,
  When its completion is judged,
  Then it is counted as done,
    And the build's record of the run names that step as one that passed on a
      declaration of no observable result, together with its stated reason.

  Given a build in which several steps declare that they produce nothing
    observable,
  When the build's record of the run is read,
  Then it states how many steps passed on such a declaration and names each of
    them,
  So a build in which most steps declare nothing is immediately visible as such,
    rather than reading identically to one in which every step delivered.

  Given a step whose declaration previously named a result and now declares that it
    produces nothing observable,
  When the build is assembled,
  Then the change is surfaced as a reduction in what the step owes, naming the
    result no longer promised,
  So a step cannot be quietly relieved of its obligation in order to get past this
    judgement.
