it_requirements:
  - "CANONICAL SOURCE, ADR-001. Edit templates/scripts/commit_guardian/check_negative_control_liveness.py. scripts/commit_guardian/ and .leafcutter/scripts/commit_guardian/ are build.py outputs."
  - "THE LOAD-BEARING FIX IS NOT WRITING, NOT ensure_ascii. Measured 2026-10-07: `json.dumps(data, indent=2, ensure_ascii=False) + chr(10)` does NOT reproduce the deployed file byte-for-byte — the file carries hand-authored indentation (a block indented 2 where json.dumps emits 4), so a re-render differs from build.py's output by 40 bytes even with ensure_ascii fixed. An ensure_ascii-only change would therefore keep rewriting the file and keep tripping check-output-drift, on indentation instead of em-dashes. Do NOT treat the two halves as alternatives."
  - "DETECT CHANGE ON THE DATA, NOT ON THE RENDERING. Because the rendering never equals the file, a `rendered != current_text` guard is always true and skips nothing. Snapshot the parsed document (e.g. copy.deepcopy) BEFORE _build_records mutates it, compare the mutated document against that snapshot, and write only when they differ."
  - "_build_records MUTATES data IN PLACE — _write_manifest's own docstring says so ('with currently blocks updated in place'). A shallow copy will not isolate the snapshot."
  - "KEEP ensure_ascii=False ANYWAY. It is the second scenario and it is cheap: when a genuine write does happen it must not transliterate prose it was not asked to change."
  - "DO NOT CHANGE THE VERDICT PATH. The records returned by _build_records, the lines printed by _format_result_line, and the exit code must be unchanged. This record governs the write, not the decision."
  - "Error-handling policy per CLAUDE.md: the existing OSError handling on the write path logs and re-raises; keep it. Any new read must not silently swallow."
test_spec:
  - name: test_liveness_run_leaves_an_unchanged_manifest_byte_identical
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A real deployed commit_guardian.json is copied to a temp path, its bytes hashed, the check run against it as a subprocess, and the bytes re-hashed. Asserts the digests match. RED today — the run rewrites it."
  - name: test_liveness_run_preserves_non_ascii_characters
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "After the same run, the manifest still contains its literal non-ASCII characters and zero backslash-u escapes of them. RED today — 110 em-dashes become escapes."
  - name: test_liveness_run_still_reports_its_verdict
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The same run exits 0 and still prints its per-check result lines. GREEN ON ARRIVAL — the scope fence that catches a fix which stops the check doing its job in order to stop it writing."
test_rationale: |
  The first arm is the whole criterion and is the only one red today. It
  asserts on a byte digest rather than on an em-dash count, because the
  measured round-trip difference is partly indentation and an em-dash
  assertion alone would pass a fix that still reformats the file and still
  trips the drift gate.

  The third arm is green on arrival and exists because the cheapest way to
  satisfy the first two is to delete the write entirely, including the case
  where the check genuinely has something to record. It does not fully forbid
  that — a test that forces a real update would — but it does catch a fix that
  breaks the check's output or exit code on the way past.
