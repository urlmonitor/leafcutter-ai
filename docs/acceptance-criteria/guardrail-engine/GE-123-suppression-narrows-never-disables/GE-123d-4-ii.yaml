notes: |
  THIS SATISFIES THE PARENT L1's documentation_triggers OF [reference-doc]. It
  is authored at L3 under GE-123d-4 rather than as a sixth L2 because the L1 is
  already at the five-child hard cap, and because the boundary AC is the one
  whose content the reference records. The parent-child link is honest — the
  reference documents GE-123d-4's lists — so the placement is not a workaround
  of the cap so much as the correct home for it.

  WHY THE REFERENCE IS PART OF THE FEATURE RATHER THAN A FOLLOW-UP. The
  reference that documents the scanner's rules is silent today on what is
  exempt and why. That silence is a direct contributor to the observed cost: the
  accepted forms are learned by imitation, so an author who is blocked has no
  way to tell whether their line is a false positive with a known remedy or a
  genuine finding. Shipping a closed-list exemption without writing the lists
  down reproduces that.

  THE THIRD SCENARIO IS THE LOAD-BEARING ONE. A reference that lists five
  locations reads as an example set unless it says otherwise; the next author
  who wants their directory exempt will add it by analogy. The reference has to
  say the lists are closed and extended only deliberately, which is the
  product-owner's positive-rule constraint carried through into prose.

  A HOW-TO WAS DELIBERATELY NOT AUTHORED. The parent L1 triggers reference-doc
  only. Writing a suppression by hand is a task with a how-to already claimed by
  GE-123c, and duplicating that guidance here would create two places to keep in
  step. If the reference addition grows past the section described above, raise
  a follow-up documentation AC rather than expanding this one.

  IT-PO NOTE, 2026-08-18, on which file and why it is not llm-expert work. The
  reference is templates/skills/security-scanner/SKILL.md, which already carries
  the allowlist format, the path-matching rules, the detection-rule table and a
  false-positive-guidance section — it is the only document that answers "what
  does this scanner do" in one place, and it is silent on exemption today. The
  file sits under templates/skills/, a surface usually owned by llm-expert
  because skill bodies are prompt text; this section is not prompt text but
  reference documentation about a program's behaviour, so documentation-expert
  is the correct owner. The ADR-001 obligation is the same either way: the
  templates/ copy is canonical and the deployed copies are build outputs.
