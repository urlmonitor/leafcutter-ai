assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  reference_file_path: ".github/workflows/ci.yml"
  n_location_rule: "1 — one startup-sweep step in the consumer-simulation job, iterating a derived set. Four hand-written per-executable steps do not satisfy it; the count must come from the deployed tree."
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/portability/ -q"
  config_schema_fragment:
    type: object
    description: "The per-executable startup record the sweep emits, one per executable in the derived set. Recording an outcome per executable — including the not-exercised ones — is what makes the accounting clause checkable; an aggregate count cannot distinguish a clean sweep from a sweep that skipped what it could not start."
    required:
      - executable
      - outcome
      - unresolved_dependency
      - reason
    properties:
      executable:
        type: string
        description: "The deployed path of the executable that was started, so a failure names a thing the adopter can run themselves."
      outcome:
        type: string
        description: "One of: started, unable_to_run, or not_exercised. Three values, not two — collapsing unable_to_run into a generic failure reproduces the misdiagnosis BP-900h-5 exists against, and collapsing not_exercised into started is the vacuous pass this AC's accounting clause forbids."
      unresolved_dependency:
        type: string
        description: "For an unable_to_run outcome: the module, helper, or data file that could not be resolved, and the deployed location searched. Null otherwise. This is the field that turns a red sweep into a remediation list."
      reason:
        type: string
        description: "For a not_exercised outcome: why the harness declined to start it. Null otherwise. Required so that declining to exercise something is a visible decision rather than an absence."
  constraints:
    - "DO NOT SATISFY THIS BY DEPLOYING THE TWO HELPERS. That is the fix that has been applied four times already, each time with a warning comment attached, and the fifth occurrence is the subject of this AC. Deploying them is necessary and is not sufficient; the sweep must independently go red on a tree where any dependency of any already-deployed executable is withheld."
    - "THE SET IS DERIVED FROM THE DEPLOYED TREE, NOT FROM A REGISTRY AND NOT FROM A LIST. The executable in the live instance is invoked by adopters from the command line and by other guardrails as a subprocess; it is in no hook registry, so a set derived from the registry — which is what BP-900h-5 derives — misses it entirely. Walk the deployed output root. A set read from any list, map, allowlist or registry does not satisfy this, and the newly-deployed-executable control is the entry that proves which one was built."
    - "A GENUINELY FRESH PROCESS, WITH THE SOURCE TREE OFF THE MODULE SEARCH PATH. Both halves are load-bearing and both have burned this repository before. Re-importing inside a live interpreter re-executes in an already-populated namespace and cannot observe a first-import failure; leaving the package source tree importable means every sibling resolves and the sweep is green on the install that shipped broken."
    - "ACCOUNT FOR EVERY EXECUTABLE, INCLUDING THE ONES YOU DECLINE TO START. Some deployed executables do real work on invocation or need arguments the harness cannot supply. Skipping them is legitimate; skipping them silently is not, because a sweep that quietly excludes everything it found difficult is a success-shaped result from a run that checked almost nothing. Started plus not-exercised must equal the size of the derived set, asserted."
    - "STARTING MUST NOT DO THE WORK. Prefer a mode that loads the executable and reaches its entry point without performing its side effects, and state in the sign-off which mode was used for each shape of executable. A sweep that runs the real work of every deployed command inside CI will be turned off within a month, and a turned-off sweep is the fifth occurrence again."
    - "UNABLE-TO-RUN IS NOT FAILED. This AC inherits BP-900h-5's three-way outcome and must not collapse it. An executable that cannot start and an executable that ran and rejected its input both exit non-zero, so an exit-code-keyed classifier records the wrong one and points the adopter at their own input — which is exactly how the live instance was first reported."
    - "ENUMERATE THE PRE-EXISTING SET IN THE SAME CHANGE. Turning this sweep on will surface every deployed executable that cannot currently start, not only the one in the register. That is the intended effect. The full set must be listed in the sign-off and each entry resolved or explicitly deferred with a date; parking them behind a skip list reintroduces the hand-maintained list this AC exists to remove."
delivers_to:
  agent: python-coder
  contract: "A startup sweep over a set of deployed executables derived by walking the consumer install's deployed output root: each started in a fresh process with the package source tree off the module search path, each recorded as started, unable-to-run with the unresolved dependency named, or not-exercised with a reason, and a job conclusion that fails when any entry is unable to run."
expects_from:
  ac_id: BP-900h-5
  contract: "The three-way per-entry outcome — passed, failed, unable-to-run — and the job conclusion that fails when any entry is unable to run. This AC reuses that outcome vocabulary for a wider set rather than inventing a second one."
test_spec:
  - name: test_bp_900h_5_ii_every_deployed_executable_starts_in_the_consumer_install_and_the_set_is_derived_from_the_deployed_tree
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Inside the BP-900h-4 consumer-layout install, derive the executable set by walking the deployed output root and start each one, asserting the recorded outcome is started. THREE NON-VACUITY ASSERTIONS ARE MANDATORY, because a for-each over a nearly-empty set is the most likely way this passes while broken: assert the derived set is non-empty and equals the set of executables actually present in the deployed tree; assert it CONTAINS the AC-store schema validator, which is the 2026-08-25 instance and is in no guardrail registry, so a registry-derived set is caught here; and assert that started plus not-exercised equals the size of the derived set, with every not-exercised entry carrying a reason. This entry is expected to be RED at authoring time — the validator cannot currently start in a consumer install — and a green result before any implementation exists means the set is empty or the source tree is still importable."
  - name: test_bp_900h_5_ii_withholding_a_dependency_of_an_already_deployed_executable_turns_the_sweep_red_through_its_real_ci_entry_point
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: reachability
    description: "PRODUCTION ENTRY POINT with the must_block modifier, as a three-run sequence through the SAME subprocess command the CI job invokes — never by importing the sweep. (1) Healthy install: exit 0. (2) Delete one module that an already-deployed executable imports at module scope from the deployed tree and re-run: assert non-zero, assert that executable's recorded outcome is unable-to-run asserted BY VALUE and explicitly not equal to the failed category, and assert the record names the unresolved dependency and the location searched. (3) Restore and re-run: exit 0, which is what attributes the red in run 2 to the deletion rather than to a fixture that had already broken. Then assert the consumption half from the parsed .github/workflows/ci.yml: the step running the sweep carries that identical command and does not carry continue-on-error true. Both the unable-to-run and the failed categories exit non-zero, so an assertion on exit code alone is green on a harness that collapses them."
  - name: test_bp_900h_5_ii_the_deployed_copy_is_started_in_a_cold_process_with_the_package_source_tree_off_the_module_search_path
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: real_artifact
    description: "THE ENTRY EVERY PRIOR OCCURRENCE WOULD HAVE PASSED, and the reason all five stayed green. Start the DEPLOYED copy of the AC-store schema validator in a genuinely fresh interpreter process whose module search path does not include the package source tree, and assert it reaches its entry point. Then assert the harness's own blindness controls, both of which are known to produce a false green here: re-importing the module inside an interpreter that has already imported it must NOT be used, and running the same assertion against the SOURCE tree copy must be shown to pass even on a broken deployed tree — capture that contrast explicitly so the test records why the source-tree form is worthless rather than merely avoiding it. Assert the interpreter's effective search path in the child process contains no path under the package checkout; a sweep launched with the package tree importable is green on the install an adopter cannot run."
  - name: test_bp_900h_5_ii_an_executable_deployed_after_the_sweep_exists_is_swept_without_any_change_to_the_harness
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: deployed
    description: "THE DERIVED-NOT-ENUMERATED CONTROL, and the only entry a hand-maintained list of today's executables cannot pass — which matters because a list is exactly what four prior fixes produced. In the consumer install, place into the deployed output root a new executable that has never existed before, importing a helper that is deliberately NOT deployed, touching no test code and no harness source. Re-run the sweep and assert the new executable appears in the report with outcome unable-to-run and its unresolved helper named. Then deploy the helper and re-run: assert the outcome becomes started. Then remove both and re-run: assert the entry disappears from the report, so its appearance was derived from the tree rather than accumulated. Every other entry in this contract is green on a sweep that iterates the executables that exist today; this one is not."
test_rationale: |
  Five occurrences of one defect stayed green because every test imports these modules from
  the source tree, where the siblings resolve by construction. That single fact determines
  the shape of this whole contract: entry 3 exists to make the cold, source-tree-excluded
  process an asserted property rather than an intention, and it deliberately captures the
  source-tree contrast so the record shows WHY the cheaper form is worthless instead of
  merely omitting it. A future author who reaches for a direct import will find the reason
  written down next to the assertion.

  Entry 4 is the entry that separates this AC from the four fixes that preceded it. Each of
  those added a name to a list, and each list was complete on the day it was written. A
  sweep that iterates the executables present today is indistinguishable from a correct one
  for every input that exists now, and dies only when something new is deployed — which is
  precisely the moment nobody is looking. Introducing an executable the harness cannot know
  about, with the paired removal so its appearance is not a fixture artifact, is the only
  construction that goes red on an enumeration.

  Entry 2's three runs and its by-value outcome assertion carry the inherited three-way
  verdict. An executable that cannot start and an executable that rejected its input both
  exit non-zero; the live instance was first reported as the latter. A contract that asserts
  only a non-zero result is satisfied by a harness that reproduces that misdiagnosis, and
  the CI-consumption half is asserted from parsed YAML because a grep for the script name is
  green on a step marked continue-on-error.

  Entry 1's accounting assertion is not defensive padding. The likeliest way this ships
  broken is not a wrong assertion but an almost-empty derived set: some executables need
  arguments or do real work, declining to start them is legitimate, and a sweep that quietly
  drops each awkward one produces a passing loop over what is left. Requiring started plus
  not-exercised to equal the derived set, with a reason on every not-exercised entry, is
  what makes the exclusions visible.

  Angles: criterion, reachability, real_artifact, deployed — at the cap of four, with
  must_block riding entry 2. failure is not charged separately; the withheld-dependency red
  and its restore control live inside entry 2, where the production entry point already is.
  boundary is not charged because the criterion names no range, count or limit.
