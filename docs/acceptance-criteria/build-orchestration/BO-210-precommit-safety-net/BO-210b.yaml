criteria: |
  When a coder agent's own pre-completion check detects a warn-tier complexity or
  size signal, the coder records a length-capped context capsule inside its sign-off
  comment, capturing the design context a later fixer would otherwise have to
  re-derive: the intent, the rationale per touched file, the consumers already
  checked, the red-baseline test names, and the design constraints. The capsule is
  optional and backward-compatible — consumers tolerate its absence exactly like
  the existing completion manifest.
