  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a store containing a fault entry and a requirement that disagree, where
    neither record has been touched for months and neither is part of the change
    being made,
  When the reconciliation runs,
  Then that pairing is reported,
    And it is reported whether or not any change is in flight.

  Given a run in which nothing at all has been changed,
  When the reconciliation runs,
  Then it still examines every record present and reports the pairings it finds,
  So the reconciliation is not scoped to a change and its silence is not the silence
    of having been given nothing to look at.

  Given any run of the reconciliation,
  When its output is read,
  Then it states how many fault entries and how many requirement records it
    examined,
    And a run that examined none is distinguishable from a run that examined all of
      them and found nothing.

  Given a store whose number of records grows,
  When the reconciliation runs,
  Then the number it reports examining grows with it,
  So coverage is observed to track the store rather than being asserted once.
