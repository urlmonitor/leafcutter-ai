id: GE-126c-3
title: "The refusal follows from what the copy is and not from whether a dependency happened to load"
component: guardrail-engine
components:
  - commit_guardian
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the helper the parent-back-link check needs is placed beside the build-source copy
    by hand so that every one of the copy's dependency-resolution routes now succeeds,
  When the build-source copy is run against a record that genuinely violates the
    parent-back-link rule,
  Then it still refuses to answer and still names the copy to run instead — because being
    a build source is what disqualifies it and a satisfied dependency does not change what
    the copy is,
  And when the helper is then removed again the refusal is unchanged in outcome value and
    in wording so a reader cannot tell the two situations apart and does not need to,
  And in neither case does the build-source copy report a verdict on the record or the
    ordinary success value,
  And the deployed copy run against the same record in both situations blocks naming the
    record so the refusal remains specific to the build-source copy rather than becoming a
    property of the check.

  Coverage note: covered by executing the build-source copy with the dependency satisfied
  and again with it absent and asserting the same refusal in both, paired with the deployed
  copy blocking in both. The dependency-satisfied arm is the whole point: without it this
  criterion is indistinguishable from an instruction to handle an import failure more
  loudly, which is the current fail-open behaviour re-specified.
depends_on:
