id: BP-1500d-4
components:
  - build_pipeline
title: "A check that finds no readable record says so, instead of returning the all-clear it returns when nothing is wrong"
component: build-pipeline
level: L2
status: active
req_status: draft
readiness: reviewed
priority: high
roadmap_phase: phase_1
work_status: todo
criteria: |
  Given a project outside the producing package's own parent folder that received a
    real build, and a check that can only do its job by reading that project's record
    of what the build put there,
  And that project's record is absent, or is present but cannot be read where the
    project now sits,
  When the check runs in that project,
  Then the check reports that it could not read the record file, and names the project
    and the record file it looked for,
  And that report is distinguishable, to a reader and to an automated caller, from the
    all-clear the check gives when it did read the record and found nothing wrong -- so
    a check that is protecting nobody cannot be mistaken for one that has just cleared
    the install,
  And this verdict concerns only whether a record could be read; whether the install
    has fallen behind what the package now holds is a separate judgement that this
    behaviour neither makes nor replaces,
  And the check is demonstrated to FAIL, before it may be accepted as passing, against
    a deliberately non-portable install: starting from an install where the check gives
    the all-clear, the record file being removed from disk must change the result to
    the could-not-read report, a substitute record file written to disk in its place,
    keyed to a location it is not being read from, must do the same, and restoring the
    good record file must return the all-clear -- so each change of verdict is
    attributable to the record and not to an install that was already broken,
  And every run is against a real install produced by a real build into a project
    outside the producing package's own parent folder, never against the check's source
    read for the presence of an error branch.
