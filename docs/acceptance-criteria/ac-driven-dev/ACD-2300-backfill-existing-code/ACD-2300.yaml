notes: |
  ORIGIN (2026-09-09, product-owner, on BrainCandy's brief). This is the second
  half of the request quoted verbatim as: "That would also enable repos to migrate
  to this in an easy way. They could just run the script and then goes through each
  function and backfills ACs, connects to existing ACs, goes through ACs without
  proper test coverage connects or creates, etc." The first half — the floor — is
  ACD-2200 and is a hard prerequisite recorded in depends_on.

  ==========================================================================
  WHERE I DISAGREED WITH THE BRIEF, AND WHY
  ==========================================================================
  BrainCandy sketched four jobs and invited disagreement on the cut. Three
  survived. The fourth did not, and one was substantially reframed.

  KEPT AS SKETCHED — walk existing code and propose criteria for what it does.
  Genuinely unowned. Every authoring surface in this repository writes criteria
  from INTENT: /plan-feature from a request, goal-to-epic from a goal statement.
  Nothing writes criteria from BEHAVIOUR THAT ALREADY SHIPS. That is ACD-2300a.

  REFRAMED — "connect existing tests to existing ACs where the link is merely
  unrecorded". As written this is ACS-1300a, which owns it, has measured it (549
  records), and resolves it by exact mechanical match on an identifier present in
  both places. Re-authoring it here would be a duplicate of an existing tree. The
  part that is NOT owned is the far larger and far more dangerous population: 5,566
  test functions carrying no identifier at all, where there is no join key and the
  link has to be proposed from evidence rather than read off. ACD-2300b is scoped
  to that population only and says so.

  DROPPED — "reconcile store fields (implemented_by, covered_by, work_status)
  against what the repo actually shows". This is not one job, it is three, and each
  is in a different state:
    - covered_by is ACS-1300's, entirely, in both directions of rot.
    - work_status is REFUSED. ACS-1300's L0 states the refusal as a standing
      boundary — "no AC in the tree, at any level, may write the finished-state
      field ... this is a refusal, not a phasing decision" — on the grounds that
      auto-promoting finished state from derived evidence manufactures a done claim
      on the single field the entire phantom-done edifice rests on. That reasoning
      applies here identically and with more force, because this tree's evidence is
      weaker than ACS-1300's. INHERITED, NOT RE-DECIDED. Nothing in this tree writes
      it.
    - implemented_by is the only genuinely open field, and it does not need a
      reconciler. Criteria authored FROM code carry the code they were drawn from
      as a by-product of how they were made. That is ACD-2300a's promise and it is
      strictly better evidence than any after-the-fact matching pass, which is
      exactly why the field is folded there rather than given its own L1.
  So this tree authors NO general store-field reconciler. Building one would be the
  third tool writing the same fields from a third body of evidence, and the two that
  already exist contradict each other.

  ADDED, AND THE USER DID NOT ASK FOR IT — ACD-2300d, the guarantee. See below.

  ==========================================================================
  A CONTRADICTION IN THE STORE THAT THIS AUTHORING SURFACED — FOR THE USER AT THE
  APPROVAL GATE. NOT RESOLVED HERE.
  ==========================================================================
  ACD-800 (this component, readiness reviewed, req_status active, unbuilt since
  2026-06-05) commits in its own L0 criteria to backfilling "(implemented_by,
  work_status)" for matches found "using text similarity and keyword heuristics".
  ACS-1300 (ac-store, authored 2026-09-01) forbids any record in its tree from
  writing work_status at all, and marks that refusal as not to be revisited.

  Both cannot be right. The store currently holds one record promising a heuristic
  tool that awards finished badges and another record whose central safety property
  is that no tool may. Whichever way the user decides, ACD-800 needs amending or
  retiring — and note that ACD-800's method presumes a history of completed TICKETS
  to match against, which an adopting project does not have, so its usefulness for
  the adoption case is limited independently of the safety question.

  I did not amend ACD-800. Raising it is this record's obligation; deciding it is
  not.

  ==========================================================================
  THE TWO TRAPS — WHERE EACH IS ENCODED AND WHY IT IS ENCODED AS A CONSTRAINT
  RATHER THAN AS AN INSTRUCTION
  ==========================================================================
  BrainCandy asked specifically that both be visible in the criteria. They share
  one root cause, stated in the brief and adopted here as this tree's governing
  sentence: AUTOMATION THAT WRITES AN ASSERTION OF PROOF RATHER THAN AN OBSERVATION
  OF EVIDENCE.

  TRAP 1 — a mechanically-generated link is worse than no link. A bulk pass that
  emits thousands of link tags naming criteria that do not exist converts an honest
  gap into a dishonest green, at scale, using the tool built to cure it. Encoded in
  ACD-2300b's criteria as a positive-and-negative pair: a link that is recorded is
  a link that was verified, AND a test whose subject cannot be established stays
  unlinked and is reported as unlinked. The negative arm is the load-bearing one —
  every positive arm is satisfied by an implementation that links everything.
  Encoded again at the goal level above ("left plainly unclaimed rather than filled
  in with a plausible guess") and made falsifiable in ACD-2300d.

  TRAP 2 — the same hazard in the store-write direction. Encoded in ACD-2300d:
  nothing this capability produces marks work finished, and nothing records
  implementation evidence it did not observe. Encoded structurally in ACD-2300a,
  where criteria drawn from code carry their evidence by construction, so the field
  is never populated by inference in the first place.

  WHY ACD-2300d IS ITS OWN L1 AND NOT A NOTE ON THE OTHER THREE. A refusal that
  lives only in prose is not falsifiable, and the cheapest implementation of a, b
  and c satisfies all three perfectly while violating every guarantee in d. It is
  the guard on the guard. The precedent is exact and in-store twice: ACS-1300c
  ("awards nothing, rewrites nothing that is already correct, abstains out loud")
  and TQ-400e ("you can trust what the check takes away — it never cries wolf").
  ACS-1300's notes give the reasoning in these same terms.

  ==========================================================================
  THE MEASURED BACKLOG — THIS REPOSITORY, ONE DAY, ONE COMMIT
  ==========================================================================
  From the census at df1f0cfb5, 2026-09-08. Single measurement pass, unverified by
  a second method except where noted, and bound by ACS-1100 (inherited): 5,566 test
  functions across 595 of 597 test files carry no link tag — only 2 files are fully
  tagged; 499 fixture-bloat violations across 266 files; 252 of 370 code tickets
  with no test-requirements block; 49 of 915 Python files over the complexity limit;
  354 tickets a post-merge write hook would act on.

  Two further figures from ACS-1300's own re-measurement on 2026-09-01, against a
  denominator of 3,749 records carrying an identifier: 856 are named by at least one
  link tag somewhere in the test tree, and roughly 87 distinct tag identifiers name
  a record that does not exist. That last number is the pre-existing rate of exactly
  the defect Trap 1 would mass-produce.

  DO NOT BAKE ANY FIGURE INTO A CRITERIA BLOCK. They describe one repository on one
  day; this capability must work on a repository nobody here has counted. State the
  guarantee in criteria and leave the numbers here.

  ==========================================================================
  ONE L0 OR TWO FOR ADOPTION-BY-OTHERS VERSUS OUR OWN DEBT — DECIDED: ONE
  ==========================================================================
  Argued in full in ACD-2200's notes; the same decision governs this tree. The two
  populations share one mechanism, this repository is the first customer, and its
  numbers above are the acceptance fixture. The dogfood-first framing is inherited
  from ACD-1900g and is not re-authored as a child here.

  ==========================================================================
  ROADMAP — DELIBERATELY UNPHASED, FOR THE USER AT THE APPROVAL GATE
  ==========================================================================
  No roadmap_phase is claimed. phase_1's exit criteria are about clean installs,
  build idempotency and truthful build reporting, and working down an existing
  record backlog does not advance any of them. Its sibling ACD-2200 DOES claim
  phase_1 and argues the claim, because being able to switch standards on in an
  existing codebase is part of "installs into any project". This tree makes the
  weaker claim and says so rather than borrowing its sibling's. ACS-1200 and
  ACS-1300 set the precedent of leaving such a tree unphased; ACS-1300's notes
  record that ACS-1100's phase_1 claim "reads as over-claiming". Either a phase
  claims this tree or it stays unphased backlog.

  No roadmap or vision file was modified while authoring this.

