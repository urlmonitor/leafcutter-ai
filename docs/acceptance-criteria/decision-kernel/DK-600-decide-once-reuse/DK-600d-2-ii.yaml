    type: unit
    angle: failure
    description: 'EXISTS (tests/kernel/memory/test_validate.py::TestRefusals::test_a_filter_outside_the_vocabularies_is_reported): an unknown filter value is reported'
    covers:
    - DK-600d-2-ii
  - name: test_index_regenerates_the_index_and_refuses_an_invalid_record
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: failure
    description: 'EXISTS (tests/kernel/memory/test_publish_cli.py::TestCli::test_index_regenerates_the_index_and_refuses_an_invalid_record): the index command exits 3 on an unknown component'
    covers:
    - DK-600d-2-ii
  - name: test_an_unknown_filter_value_exits_3_names_it_and_the_fixed_record_publishes
    target_dir: tests/kernel/memory/
    framework: unittest
    type: unit
    angle: failure
    description: 'EXISTS (tests/kernel/memory/test_publish_cli.py::TestCli::test_an_unknown_filter_value_exits_3_names_it_and_the_fixed_record_publishes): CLI publish of a record naming no_such_component, then phase_no_such_phase: exit 3, the message names the value, docs/decisions is untouched, and the same command exits 0 once the record names known values'
