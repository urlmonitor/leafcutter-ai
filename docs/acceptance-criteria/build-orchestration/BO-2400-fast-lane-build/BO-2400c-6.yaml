notes: |
  Discharges KI-BO-016 under this L1 because the defect is exactly what the L1 names:
  a step that starts cold and re-derives context an earlier step already worked out.
  The sibling children (BO-2400c-1 through BO-2400c-5) all concern the prompt bundle
  handed to agents; none touches the cost the lane pays before any agent is dispatched,
  so this is an extension of the parent rather than a duplicate of any child.

  On the "and see that it actually happened" half of the parent's promise: the lane has
  no telemetry (KI-BO-012) and this criterion deliberately does not add any. The call
  is to fix the cost first and measure it later. The evidence accepted for now is a
  before-and-after wall-clock figure recorded by hand in the changelog entry — the
  baseline is 178.32 seconds to resolve BO-2400c-1-i against 3,232 files, measured on
  main at ef8c6343. When BO-2400c-2's context-reuse statement or a future per-invocation
  record lands, carry the resolution cost onto that record rather than building a
  separate path for it.

  The parse count, not the clock, is the regression guard. This is a deliberate
  asymmetry: the clock is what the operator feels and the count is what a test can
  hold, and conflating them is how performance guards rot.
