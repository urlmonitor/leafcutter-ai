notes: |
  FINDINGS THIS RECORD CLOSES (GE-130f notes, observed 2026-09-17): the guard signals its block
  in a form a PreToolUse call does not treat as a block, and its folder mapping names another
  project's folders, so nothing in this repository matches. Both must be fixed for the first
  Then clause to hold; the second project clause is the discriminator for the mapping fix (a
  mapping rewritten to this repository's folder names passes the first scenario and fails the
  second -- this is a portable package).

  REUSE, DO NOT RESTATE: the declaration shape, the entry-point rule and the four-value record
  are GE-120f-1's; the separate-working-copy harness is GE-120c-1's. This record only names the
  two inputs for this guard and requires the observed refusal.

  PAIRING: the acceptable input is in the same run on purpose -- a guard repaired into refusing
  every code edit satisfies the first Then clause alone (GE-120f-1-ii's shape).

  declares_side_effect: false -- the Then clauses assert that an edit is or is not carried out
  and what a refusal and a record say; no durable-effect phrase from the derivation list.
