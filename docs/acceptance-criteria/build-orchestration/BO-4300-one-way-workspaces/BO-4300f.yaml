criteria: |
  Every workflow moves over, and no second way is left behind to drift.

  Every workflow, skill, agent and written instruction that makes, finds or clears
  workspaces today uses the one way instead, and the old recipes are removed rather than
  left alongside it. Workspaces made the old way are brought over or retired, so you
  never meet two different kinds of workspace side by side.
