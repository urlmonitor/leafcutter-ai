      - "a local table of check kinds"
  - name: test_bo_2500f_2_check_record_is_verified_through_the_precommit_cli
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "the real check_done_proof.py --mode precommit CLI, as a subprocess"
    description: "Real precommit CLI subprocess in a temporary git repo with BO-2500f-4's switch turned on through its declared mechanism: a staged done test-free record naming a committed check that carries an enforces tag and is wired in the repo's .pre-commit-config.yaml exits 0; with the check file removed, or its tag naming another id, it exits 1 naming the check."
    proves_clause: "the verification holds only if the named check exists and carries a tag \"# enforces: <id>\" naming this record's id, and the check is wired as BO-2500f-2-i requires"
    code_file: templates/scripts/commit_guardian/check_done_proof.py
