title: "Nothing is recorded as proven unless it was actually checked"
component: ac-driven-dev
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  The tool records what it observed and never what it assumed.

  Everything this capability writes can be traced back by a person to the thing
  that was observed. It never marks work finished. It never records proof it did
  not see. When it cannot establish something it says so and writes nothing,
  rather than filling the gap with the most likely answer. What it proposes
  arrives in pieces small enough to genuinely review, so accepting a batch stays
  a real decision instead of a formality.
