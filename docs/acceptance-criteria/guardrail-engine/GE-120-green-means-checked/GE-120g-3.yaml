notes: |
  WHY THIS RECORD EXISTS. The parent carries documentation_triggers [reference-doc] and states
  the reason directly: the guidance a check author reads today describes the declared role as
  routing information, so the opposite of the rule this tree establishes is what is currently
  written down. That is a documentation failure and neither behavioural sibling fixes it. No
  diagram record is produced — the parent triggers only the one type.

  THE AGREEMENT CLAUSE IS WHAT STOPS THIS BEING PROSE. Every other clause is satisfied by
  writing sentences. The agreement clause is a property of two artifacts and can be exercised:
  it fails when the rule a reader is told to follow and the behaviour the checks enforce
  diverge. This component already records the anti-precedent — a check documented as taking a
  remediation action its own code never takes, believed by authors for months. A
  documented-but-dead rule is worse than none, because authors believe they are covered.

  NAMED MUTATION FOR THE AGREEMENT CLAUSE — EXECUTE IT. INJECTION: change the written guidance
  so the obligation is described as recommended rather than required, leaving the enforced
  behaviour unchanged. Under that injection an author following the guidance exactly writes a
  judging check that alters the working copy and is stopped by a rule the guidance did not
  warn them about; this clause must go RED and return to green on revert. The mirror injection
  is equally valid and worth running: leave the guidance as written and relax the enforced
  rule. Either divergence must be caught, because the defect is the gap and not its direction.

  SECOND NAMED MUTATION, FOR THE NO-EXEMPTION CLAUSE — EXECUTE IT. This clause asserts an
  absence and is green on any text that simply says nothing about exemptions. INJECTION: write
  the guidance so it describes a way for a particular check to be excused from the obligation.
  Under that injection every other clause here stays green — the obligation is stated, the
  place is right, the roles are named — and only this clause goes RED. That is the exact shape
  by which a rule with no opt-out becomes a rule with one, and it is the reason GE-120g-1-i
  exists on the behavioural side.

  ARRIVAL COLOURS. Every clause is RED on arrival: no such statement is written anywhere
  today, and the surface currently says the opposite. The final clause — described as in force
  rather than forthcoming — passes trivially the moment the text is written, so it is the one
  to distrust; it exists to stop the guidance landing ahead of the behaviour and describing an
  intention.

  NO COUNT MAY APPEAR IN THE TEXT THIS RECORD PRODUCES. How many judging checks alter the
  working copy by some route has not been measured and the parent forbids assuming it. The
  guidance states the obligation; how widespread the defect is belongs to whatever measures
  it, with the date and the state it was measured at. The population figure that MAY be
  stated, if any is, is the one that has been measured and is dated — 62 registered checks,
  56 judging and 6 fixing, in this worktree on 2026-09-07 — and never GE-120e's stale 54.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
