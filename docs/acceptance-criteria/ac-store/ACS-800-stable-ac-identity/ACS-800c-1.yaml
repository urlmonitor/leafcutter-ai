criteria: |
  Given a requirement with stable UID 42 whose parent-pointer field holds UID 10,
  When it is re-homed under a new parent with UID 25,
  Then the only field that changes on the requirement is its parent-pointer
    field, which now holds UID 25,
  And its stable UID, its name, its criteria, and every other field are
    unchanged,
  And the requirement appears under UID 25 in the tree and no longer under
    UID 10.
