    relevance: >-
      §5's closing requirement, on the surface it was not written for: the run must establish
      that a check SAW its input before its verdict is read, and a clean exit from a check
      that was handed nothing must be recorded as never-attempted or as blocked, never as
      passing. On the commit surface the trap arrives through hooks that ignore their
      arguments and read the index or an environment variable. Here it arrives the other way
      round — through a guard that reads only what the editor sends it and is handed a command
      line instead. Inherited, applied to a different mechanism, not re-argued.
  - path: "docs/acceptance-criteria/guardrail-engine/GE-120-green-means-checked/GE-120f-1-i.yaml"
    relationship: related
    status: exists
    relevance: >-
      THE NEIGHBOUR, AND WHY THIS IS NOT ITS DUPLICATE. GE-120f-1-i refuses a refusal produced
      by REACHING INSIDE a check — importing it, calling its helper — which is recognisable as
      not being a way in at all. What this record refuses looks nothing like that: starting a
      guard script as a command with a file path is an ordinary, legitimate-looking invocation
      that a reasonable implementer would reach for first, and it produces the most convincing
      false green available on this surface, because a guard that has been asked nothing exits
      exactly as a guard that approved of everything does.
