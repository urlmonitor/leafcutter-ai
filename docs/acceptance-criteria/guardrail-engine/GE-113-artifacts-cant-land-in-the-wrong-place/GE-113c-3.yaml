it_requirements:
  - "Fix targets `_is_suppressed` in canonical template `templates/skills/security-scanner/scripts/scan_secrets.py` around line 114 — the buggy comparison `fp_parts != tuple(fp_parts[-len(al_parts):] ...)` compares the finding path against a suffix of itself; replace with a correct segment-by-segment suffix check `al_parts == fp_parts[-len(al_parts):]` when `len(fp_parts) >= len(al_parts)`, else no suffix match."
  - "Path-qualified allowlist entries (containing a path separator) MUST require true segment-suffix match; basename equality alone is insufficient."
  - "Bare-filename allowlist entries (no path separator) suppress findings at any depth by basename equality — this is the intended contract per the current docstring, preserved unchanged."
  - "Wildcard `*` entries (both rule_id and file_path forms) behave as before."
  - "Deployed/template parity (ADR-001): edit the canonical `templates/` copy only; `build.py` propagates to the 16 materialized copies. Do NOT hand-edit the copies under `.claude/`, `.gemini/`, `.leafcutter/`, `EPIC-LiveSurfaceTesting/`, or `worktrees/**`."
  - "Preserve the `_is_suppressed` docstring but tighten it to reflect the corrected semantics: name the three suppression modes (wildcard, exact-path, path-suffix) and note that bare-filename entries suppress by basename."
  - "Two security exploit paths must be closed and covered by direct tests: **Path A** — basename collision across directories (`RULE:src/foo.py:*` must not suppress `deploy/foo.py`); **Path B** — longer allowlist path shadowing shorter finding path (`RULE:src/config/foo.py:*` must not suppress root-level `foo.py`)."
  - "Customer-side tracking: an external consumer created `FIX-Security-Leafcutter-UpstreamAllowlistSuffixMatchFix.md` on their side and reported this as a live security defect."
