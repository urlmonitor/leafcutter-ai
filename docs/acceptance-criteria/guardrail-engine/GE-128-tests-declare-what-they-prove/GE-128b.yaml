roadmap_phase: phase_1
criteria: |
  Rearranging tests you already have is never mistaken for adding new ones.

  Moving, renaming or splitting tests that already exist is not counted as
  introducing undeclared work, so tidying the test suite is never made more
  expensive than leaving it alone. A file that did not exist before is judged on
  what it contains rather than granted an allowance for having no past, so
  starting a new file is not a way of getting undeclared tests in. A refactor is
  not punished, and it is not a route around the rule either.
