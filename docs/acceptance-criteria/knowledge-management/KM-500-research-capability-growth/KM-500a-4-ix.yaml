criteria: |
  Given the kernel-path evaluation and the frozen set S1 exist
  When an operator reads the knowledge retrieval how-to
  Then it shows how to run the scripted variant, and how to authorize and run the real-model variant with 3 repetitions
  And it explains that not_run means a missing prerequisite and is not a failed result, with a worked report excerpt for missing authorization that has no score fields
  And it explains the scripted, mixed, real and synthetic labels, and states that only all-real results give a real-model figure
  And it explains development runs versus holdout runs, and when a holdout result is marked exposed
  And it lists the frozen S1 thresholds and the categories and denominator each one is computed over, including the separate selection_uncertain column
  And it states that comparison representativeness is worked out from the case set and its frozen coverage requirement, not from a flag in the pack
  And every worked example names the evidence label it was produced under and does not present a scripted example as real-model evidence.
