assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - >-
    THE SHARED HALF NEEDS NO PRODUCTION CHANGE, AND THAT WAS VERIFIED AT SOURCE, NOT
    ASSUMED. `run_key()` already prefers PYTEST_XDIST_TESTRUNUID; `_produce()` already
    publishes under the run base; the publish check already returns the published
    layout on a later call with the same key; and `run_child_session()` already
    accepts env_overrides. The parent module produces once and passes the key down.
    If you find yourself editing run_key(), stop — you are solving a different
    problem, and changing it affects every xdist worker.
  - >-
    ONLY `_produce_private_copy()` (and `_produce()`, for the same reason) GAINS THE
    SEED OPTION. Keep the change to one new optional input and one branch. A seeded
    production copies the seed; an unseeded one behaves exactly as today.
  - >-
    THE SEED MUST PASS THE SAME COMPLETENESS CHECK AS A BUILT LAYOUT. `_produce()`
    already inspects the build manifest for completeness before publishing. A seeded
    copy goes through that same check — do not route around it on the grounds that
    the seed was already checked once, because the copy is what the caller receives.
  - >-
    SEEDING IS OPT-IN AND CARRIES AN EXCLUSION LIST. See TQ-600a-12-ii. Do not make
    seeding the default for the private route "because it is faster": the deploy-count
    tests take that route and would pass vacuously.
  - >-
    MEASURE THE 17-TEST FIGURE IN ONE SITTING AND ASSERT A RATIO. 1,069 s was measured
    on a loaded shared WSL host and is an upper bound. Take a before and an after on
    the same machine in the same run and assert at most one quarter; an absolute
    threshold will be flaky and will be disabled.
  - >-
    DO NOT TOUCH THE TWO MARKER SPELLINGS OR THE ROUTING SELECTOR. `_select_route`
    reads markers and nothing else, which is why the seed is invisible to routing.
    TQ-600a-5's undeclared-test safety net and TQ-600a-2's carve-out both depend on
    that, and a seed that influenced routing would quietly break both.
