# Continuous-integration gate for leafcutter-ai.
#
# Runs on every push to main and every PR targeting main. Three jobs:
#
#   lint       — ruff check over scripts/, tests/, unit_tests/ (config: ruff.toml).
#                BLOCKING. The templates/ source tree is excluded (see ruff.toml).
#
#   test       — full pytest suite over tests/ and unit_tests/. INFORMATIONAL
#                ONLY (continue-on-error) FOR NOW. The build step
#                (python scripts/build.py --target-dir .) runs before pytest
#                because build.py's install_shims() creates symlinks at
#                scripts/commit_guardian/, scripts/doc_compliance/, and
#                scripts/feedback/ pointing into .leafcutter/scripts/. Tests
#                import from those paths at startup; without the build step they
#                fail at import on a fresh clone (ADR-016). The shim fix (this
#                job's reason for existing) is complete, but the suite is NOT yet
#                green on a fresh checkout: ~4 collection errors (test files for
#                unbuilt modules: check_test_fixture_bloat, link_feedback,
#                transform_decision_history, known_failing_tests) plus pre-existing
#                failures keep it red. Until those are resolved, this job runs
#                informationally so it surfaces results without blocking merges.
#                Promote to BLOCKING (drop continue-on-error) once the suite is
#                green — that is the BP-1200b deliverable, tracked separately.
#
#   typecheck  — mypy over the .py files changed in a PR (non-strict,
#                --ignore-missing-imports, since the codebase has no type config
#                yet). INFORMATIONAL ONLY (continue-on-error): the codebase is
#                untyped, so touching any file surfaces dozens of pre-existing
#                type errors unrelated to the change. The job surfaces type
#                findings on changed files without blocking the merge. Promote
#                to blocking once the codebase is annotated. On direct pushes
#                there is no diff base, so it is a no-op.
#
# Dependencies are pinned in requirements-dev.txt.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check scripts tests unit_tests

  test:
    name: Test suite (pytest)
    runs-on: ubuntu-latest
    # INFORMATIONAL ONLY until the suite is green on a fresh checkout — see the
    # header note. Drop continue-on-error to make this a blocking gate (BP-1200b)
    # once the pre-existing collection errors and failures are resolved.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build — run install_shims to create scripts/ symlinks
        # Required before pytest: install_shims() creates symlinks at
        # scripts/commit_guardian/, scripts/doc_compliance/, and
        # scripts/feedback/ pointing into .leafcutter/scripts/. Tests
        # add those paths to sys.path at import time (ADR-016).
        run: python scripts/build.py --target-dir .

      - name: Run test suite
        run: python -m pytest tests/ unit_tests/ -q --continue-on-collection-errors

  typecheck:
    name: Type-check changed files (mypy, informational)
    runs-on: ubuntu-latest
    # Informational only — see header. Surfaces type findings without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the PR base commit to diff against.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: mypy on changed Python files
        # On push events github.base_ref is empty and this becomes a no-op.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only --diff-filter=ACM "origin/${{ github.base_ref }}"...HEAD -- 'scripts/**/*.py' 'tests/**/*.py' 'unit_tests/**/*.py')
          if [ -z "$CHANGED" ]; then
            echo "No changed Python files under scripts/, tests/, or unit_tests/ — skipping mypy."
            exit 0
          fi
          echo "Type-checking changed files:"
          echo "$CHANGED"
          # --explicit-package-bases avoids "source file found twice" errors from
          # the flat sys.path-based layout (scripts/ is not an installed package).
          mypy --ignore-missing-imports --explicit-package-bases --no-error-summary $CHANGED
