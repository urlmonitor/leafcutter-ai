assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Stream discipline is a hard boundary, not a preference. The notice goes to the error stream only. The output stream carries the findings report in its existing format, which the hook's own summary text and any log scraper read; a single line of notice text on the output stream corrupts that report. This is the same stream split the allowlist warnings already observe."
  - "The notice must not change the exit status under any circumstances. It is an audit trail, never an input to the verdict, and that must hold in both directions: it appears when the run succeeds, and it appears unchanged when the run is blocked by an unrelated finding."
  - "The notice must never contain the matched value, the matched line, or the finding excerpt. This is the deliberate departure from the GE-113c-3-v warning contract and it must not be harmonised back: the notice concerns a value the check has just decided NOT to report, so echoing it into a stream that lands in build logs would turn each wrong decision into an exposure. File path, 1-based line number and the granting shape name are the whole payload. Everything else in the -v contract — the error stream, the file path, the 1-based line number — is reused as-is."
  - "One notice per run: a header naming the check and the count, then one short line per exempted finding. Not one paragraph per finding — the acceptance-criteria store holds thousands of files whose text discusses these rules, and a verbose per-finding report would reproduce on the error stream exactly the noise this L1 exists to remove."
  - "The count must include only findings exempted by THIS feature. Findings removed by a .security-allowlist entry are suppressed earlier, before the post-filter ever sees them, and findings dropped by the pre-existing file-level high-entropy prose exemption are a different mechanism (KI-CG-004). Folding either into the count makes the number unreviewable, which defeats the purpose of announcing it."
  - "The granting shape must be reported by a stable name drawn from the shape vocabulary, not by a rendering of the value or a description generated per finding, so that the notices can be compared across runs."
  - "Silence when nothing is exempted must be genuine silence on the error stream — no header, no zero count."
  - "Anti-precedent, load-bearing: a guard in this component is documented as dispatching a specialist and does not, because its remediation path is a placeholder that always reports success. A test that asserts the message string exists in the source would repeat that failure exactly. The notice must be observed arriving on the error stream of a real run."
  - "ADR-001 parity: edit the canonical copy under templates/ and verify through the build.py round-trip."
delivers_to: null
expects_from:
  ac_id: GE-123d-2
  contract: "The per-finding exemption decision and the name of the value shape that granted it, which this notice reports. A decision that does not carry the granting shape forward cannot satisfy this AC."
test_spec:
  - name: test_notice_names_the_check_the_count_the_file_and_both_line_numbers
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "A real acceptance-criteria-store file staged in a temporary git repository with exempted credential-shaped lines on its 12th and 40th lines makes the canonical pre-commit check exit 0 and write one error-stream notice naming the check, the count 2, the file path, both 1-based line numbers and the granting shape for each"
  - name: test_notice_never_reproduces_the_matched_value_or_line
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A distinctive marker embedded in each exempted value appears in neither the error stream nor the output stream of the run, and neither stream carries the matched line"
  - name: test_no_notice_when_nothing_is_exempted
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "A staged file producing no exempted findings leaves the error stream free of any notice — no header and no zero count"
  - name: test_notice_and_blocking_finding_occupy_separate_streams
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A staged file with one exempted and one reported finding exits 1, prints the reported finding on the output stream in the existing format, prints the notice on the error stream, and the output stream carries no notice text"
  - name: test_count_excludes_allowlist_suppressions_and_the_entropy_prose_exemption
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "A run whose staged set also contains an allowlist-suppressed finding and a finding dropped by the pre-existing file-level high-entropy prose exemption still reports a count covering only the findings this feature exempted"
  - name: test_notice_is_one_summary_per_run_across_multiple_files
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "Several exempted findings spread across two staged files produce a single notice block with one short line per finding and one count, not a paragraph per finding and not one block per file"
test_rationale: "The claim this AC makes is that an author is told something, and the component already has a guard that claims an announcement it never emits — so the only acceptable evidence is the notice arriving on the error stream of a real run. Each entry therefore runs the canonical templates/ copy of the pre-commit check as a subprocess against real files staged in a throwaway git repository and captures both streams separately; a test asserting the message string appears in the source, or asserting on a formatter's return value, would reproduce the exact anti-precedent the AC's notes cite. The two streams must be captured separately rather than merged, because the stream split is itself part of the contract — a merged capture cannot tell a correct notice from one that corrupts the findings report. The withheld-value entry is asserted positively, by embedding a distinctive marker in each exempted value and requiring its absence from both streams, rather than by matching the expected notice text: an assertion on the expected text passes even when extra text is present. The count entry exists because three separate mechanisms remove findings from this run — the allowlist, the pre-existing file-level high-entropy prose exemption, and this feature — and a count that silently pools them is not reviewable."
