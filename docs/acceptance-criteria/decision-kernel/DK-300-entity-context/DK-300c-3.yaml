notes: |
  New behavioral requirement derived from the user-authorized entity-context concept.
  BA behavior and IT PO technical contracts are reviewed; implementation is verified by the independent strict entity suite and recognition corpus.
  Verification evidence: reports/entity-context-verification.md. No human approval is implied.
  Historical DK-200 direct-gather tests and evaluation reports are preserved.
  Fresh-run wiring criteria were explicitly reconciled to EntityContext on 2026-10-04.
estimated_complexity: L
it_requirements:
  - "Redaction covers every retained/projected metadata field, caller claim, signature, locator and diagnostic; opaque provenance hashes must not expose denied records."
  - "data_policy.send_repo_excerpts_to_jev=false withholds repository meaning metadata as well as former body excerpts; it cannot be bypassed by renaming evidence to entities."
  - "Apply redaction before exact final serialized budget measurement; replacement expansion is charged to the same configured allowance."
  - "The authorized checkpoint preserves original_goal; redacted optional context cannot mutate the submitted task or governing permissions."
test_required: true
test_spec:
  - name: "test_redaction_applies_to_checkpoint_provider_host_and_trace_metadata"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "seam"
    description: "tests/kernel/entity_context/test_permissions.py::test_redaction_applies_to_checkpoint_provider_host_and_trace_metadata: Insert configured protected markers in caller text and permitted identity/title/signature/locator fields; inspect checkpoint optional context, actual provider request, host artifact and captured trace for leaks."
  - name: "test_data_policy_withholds_all_repository_meaning_metadata"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "boundary"
    description: "tests/kernel/entity_context/test_permissions.py::test_data_policy_withholds_all_repository_meaning_metadata: Disable send_repo_excerpts_to_jev and assert external judgment has no source identity/meaning/provenance while separate permitted caller/required task fields remain."
  - name: "test_redaction_expansion_is_measured_in_serialized_budget"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_permissions.py::test_redaction_expansion_is_measured_in_serialized_budget: Use a replacement longer than its input and assert final compact/provider bytes measured as characters stay within limits with limitations and unchanged original goal."
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
