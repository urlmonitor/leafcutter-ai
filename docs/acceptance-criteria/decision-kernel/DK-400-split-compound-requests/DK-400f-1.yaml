assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-400e-1
  contract: Settled parts (DK-400e-1 delivers_to shape) with their outcomes, decision_id or result_ref.
it_requirements:
  - 'The envelope of run, resume and status carries a split progress block whenever a split exists; status needs
    no Jev key and does not resume the run. The block holds subject kind, origin, state and per part: id, text,
    proposed_text when edited, review, outcome, waited_for, stop_reason and the link.'
  - 'Links are absolute paths: a decided part links its staged record (<run_root>/runs/<run_id>/staged/decisions/<dec
    id>.yaml), an answered part its result artifact (<run_root>/runs/<run_id>/artifacts/result-<inv>.json).'
  - 'The outcomes shown are exactly pending, decided, answered, not settled and not run; a left-out part shows not
    run, left out at the split. The kernel never shows settled_by_human or a hand split (DK-400 Q4: hand splits
    are history only).'
  - 'Companion surface outside this AC: presenting the block through the host skills is llm-expert work (recommended
    follow-up AC).'
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_progress_shows_each_part_outcome_and_link
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: While p1 is decided, p2 pending and p3 left out, the envelope's split block shows decided with
      a link to p1's staged record, pending with both texts for p2, and not run, left out for p3.
  - name: test_research_split_progress_links_findings
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: For the reuse-threshold split each answered part links its result artifact.
  - name: test_status_shows_progress_without_resuming
    target_dir: tests/kernel/adapters/
    framework: pytest
    type: integration
    angle: reachability
    description: python -m kernel status on a waiting split run prints the split block without a Jev key and without
      changing the run's state revision.
test_rationale: The person sees progress through status and the envelope, so the reachability test uses the real
  CLI, and the links are checked by opening the files they name.
origin_agent: business-analyst
