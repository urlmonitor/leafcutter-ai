    relationship: describes
    status: exists
  - path: docs/product-truth/flows/leafcutter/explore-flows-in-atlas.flow.json
    relationship: implemented-by-step
    status: exists
assigned_agent: frontend-coder
estimated_complexity: S
it_requirements:
  - "buildFlowGraph in leafcutter-web/lib/data/graph.ts must default its showAcNodes parameter to false and gate all ac-kind node + 'implements' edge creation behind it, so a default build emits only step/branch/decision nodes."
  - "ExplorerInner in leafcutter-web/components/flows/flow-explorer.tsx must initialize showAcNodes to false when no persisted preference exists (see UXP-605/UXP-605a for persistence)."
