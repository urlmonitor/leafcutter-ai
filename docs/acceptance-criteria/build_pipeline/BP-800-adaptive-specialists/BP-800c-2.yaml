id: BP-800c-2
title: "Best-practice knowledge files follow a standard structure"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given the package knowledge layer directory
  When a contributor adds a new best-practice file for a technology (e.g. "rust")
  Then the file must contain the following sections:
    - metadata header with fields: technology_id, version, category (language/framework/database)
    - "style" section covering code formatting and naming conventions
    - "testing" section covering test structure and assertion patterns
    - "idioms" section covering language-specific patterns and anti-patterns
    - "tooling" section covering build tools, linters, and formatters
  And any file missing a required section is rejected by the build with a validation error naming the missing section
  And the file format is plain text with structured headings (not executable code)
