notes: "Authored by /quick-fix. Root cause: both drift hooks compute _MANIFEST_PATH as Path(__file__).resolve().parents[2] / 'leafcutter' / '.build_manifest.json' (check_output_drift.py:54-57, check_build_drift.py:46). Deployed under .leafcutter/scripts/commit_guardian/, parents[2] resolves through the symlink to the workspace root, and the hardcoded 'leafcutter' segment does not match the real package directory (leafcutter-ai), where build_helpers.py:184 writes the manifest. The computed path does not exist, so both gates no-op — in the main checkout as well as in worktrees, not only in worktrees as first suspected."
