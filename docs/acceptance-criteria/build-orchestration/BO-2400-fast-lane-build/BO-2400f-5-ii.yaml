notes: |
  The IT PO chooses the mechanism (a unit test over the lane under the workflow harness, a
  pre-commit hook, or both). The criterion only requires that it fails on the named inputs
  and passes on a lane whose agents are chartered.

  The paired pass case matters. A check that fails on everything also fails on the
  2026-09-25 lane (see memory note on guard liveness: "refuses everything is the regime's
  off switch"). The pass clause stops that from counting as success.

  The added-step scenario is the clause that separates a real check from a list. A check
  that hard-codes "resolve, producibility, claim, release" passes the second scenario and
  fails the third.

  THE UNDECLARED CLAUSE WAS CONFIRMED BY THE USER 2026-09-27. The registry schema says
  "false or absent means read-only", and that reading stands. The release step on
  python-coder (permits_shell absent) fails this check until BO-2400f-5-i moves it to the
  command-step-runner (BO-2400a-1-i).

  ROLE COVERAGE MADE CONCRETE, USER DECISION 2026-09-27 (round 3): "role covers the step" now
  means "the agent's registry step-kinds field lists the step's kind". The field and its
  schema are delivered by BO-2400a-1-iii. A missing field covers nothing, mirroring the
  undeclared reading of permits_shell. The remove-publishes clause proves the check reads the
  kinds per step and not as an all-or-nothing flag.

  THE COMMAND-STEP-RUNNER IS NAMED ONLY IN A TEST INPUT, NEVER IN THE CHECK. The check must not carry
  an allow-list containing "command-step-runner" or any other agent id. The registry-change
  clause is what proves this: a check that allows the command-step-runner by name still passes after
  its permits_shell is removed, and fails that clause.
