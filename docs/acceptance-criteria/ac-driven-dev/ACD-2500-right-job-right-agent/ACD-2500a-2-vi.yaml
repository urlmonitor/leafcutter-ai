    passed silently nor reported as changed, and family_counts counts it under not_evaluated.'
  proves_clause: 'ACD-9990a-3 is listed as "not evaluated: new record" for this family'
  code_file: scripts/ac_store/_rc_protected_fields.py
  to_be_created: true
  convention_test_file: unit_tests/ac_store/test_acd_2500a_2_iv.py
- name: test_readiness_only_snapshot_lists_records_not_evaluated
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: boundary
  description: 'The same stage edits checked with a readiness-only --before-snapshot {id: readiness} instead
    of --before-ref: the ''protected fields'' family lists every record ''not evaluated'' and raises no
    ''needs a decision'' finding, never a pass; the readiness family still judges readiness from the snapshot.'
  proves_clause: 'ACD-9990a-3 is listed as "not evaluated: new record" for this family'
  code_file: scripts/ac_store/_rc_records.py
- name: test_protected_field_list_matches_test_designer_template
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Parity: the module''s one protected-field constant equals the exact list in the clause,
    and equals the fields templates/agents/test-designer.md tells the designer never to touch (the ''Never
    touch these fields'' sentence plus test_required); a field on one side only fails naming it. Behaviour
    half: with a mapping it_requirements, a change to reference_file_path is not reported and a change
    to another it_requirements key is.'
  proves_clause: 'the protected fields are exactly: criteria, test_intent, assigned_agent, implements_pattern,
    pattern_bindings, declared_files, covered_by, delivers_to, expects_from, test_required, and every
    it_requirements key except reference_file_path'
  code_file: scripts/ac_store/_rc_protected_fields.py
  must_catch:
  - a list that omits test_required
  - a list that protects it_requirements as a whole, so filling reference_file_path is reported
  - a second hand-typed copy of the list in requirement_rule_check.py that drifts from the module's
  to_be_created: true
  convention_test_file: unit_tests/ac_store/test_acd_2500a_2_iv.py
- name: test_backlink_repair_in_same_run_not_reported_as_stage_change
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: seam
  description: 'Seam with the back-link family: the committed parent ACD-9990a lacks a child id; the run
    appends it (''fixed'' in ''parent-to-child back-links'') and pass 2 sees the new covered_by entry,
    which must not become a ''protected fields'' finding. Control in the same store: a covered_by entry
    the stage itself added to another record is reported.'
  proves_clause: a covered_by entry that the rule check itself appends in the same run as a parent back-link
    repair is not reported as a change made by the stage
  code_file: scripts/ac_store/_rc_protected_fields.py
  must_catch:
  - exempting covered_by from the protected list altogether
  - comparing pass 2 against the before-state without the run's pending repairs
  to_be_created: true
  convention_test_file: unit_tests/ac_store/test_acd_2500a_2_iv.py
- name: test_protected_fields_reachable_from_cli
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: reachability
  description: 'Entry point: python scripts/ac_store/requirement_rule_check.py as a subprocess (run_cli_subprocess)
    with --stage test-design --location <tmp folder> --before-ref HEAD on the tmp git repo; exit 1, stdout
    is one JSON report holding the criteria finding under ''protected fields''.'
  proves_clause: 'the rule family "protected fields" reports exactly three findings, each with disposition
    "needs a decision": ACD-9990a-1 field criteria, ACD-9990a-2 field assigned_agent and ACD-9990a-2 field
    expects_from, each naming the record''s file, the record id, the field and the stage'
  code_file: scripts/ac_store/_rc_protected_fields.py
  to_be_created: true
  convention_test_file: unit_tests/ac_store/test_acd_2500a_2_iv.py
- name: test_protected_fields_module_in_rule_check_deploy_map
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  angle: seam
  description: RULE_CHECK_DEPLOY_MAP in scripts/build_phases_ac_store_rc.py lists ('scripts/ac_store/_rc_protected_fields.py',
    '_rc_protected_fields.py') and the module is in requirement_rule_check.FAMILIES, so the installed
    check that /plan-feature runs carries the family and can fail the stage. Reads the tuple only; never
    spawns build.py.
  proves_clause: the stage's verdict is failed, so the stage is not reported complete
