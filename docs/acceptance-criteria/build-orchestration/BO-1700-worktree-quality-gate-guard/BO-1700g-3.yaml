it_requirements: |
  The set of stages carrying required hooks is DERIVED from the manifest. If scope
  is limited to pre-commit, the limitation must be surfaced explicitly in output,
  not silently assumed. Implemented in the shared probe helper (BO-1700a-1); ADR-001
  deployed/template parity applies (manifest canonical source is the templates/
  copy).
