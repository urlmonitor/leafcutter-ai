notes: |
  THIS IS THE HIGHEST-VALUE L3 IN THE TREE AND IT IS WRITTEN FROM THREE FILED
  INCIDENTS, NOT FROM CAUTION. The AC-store validator globbed zero files, printed a
  success-shaped message and exited clean for eight days while the documented
  defence against store rot did nothing. The documented feedback-configuration
  check pointed one directory too high, so it reported missing on every worktree
  including correct ones, and a real absence was indistinguishable from the check's
  own error. The merge audit compared against a stale reference and agreed with
  itself. Three different mechanisms, one outcome: examined nothing, looked clean.

  A MISSING RECORD IS THE MOST LIKELY OF THE THREE IN PRACTICE, AND THE MOST
  DANGEROUS. The obvious implementation treats an absent record as "nothing to
  check" and exits clean, which means the guard silently stops guarding the moment
  the record's location changes or a run fails before producing one. Failing
  instead is the only behaviour that keeps the guard honest, and it is why this is
  specified rather than left as a robustness detail.

  THE THREE CASES ARE DISTINGUISHED IN THE OUTPUT BECAUSE THEY HAVE DIFFERENT
  FIXES. An empty record means the run produced nothing; an unreadable one means it
  produced something malformed; an absent one means the wiring is broken. Reporting
  them identically hands the reader the diagnosis problem this whole goal exists to
  remove.
