  SETTLED. Do not re-open these at L2:
    1. The file type is dec-93c1c730463c1f3c, option
       opt.category_records_membership_refs.
    2. Mining reads both sources (the user requirement above).
    3. Mining is an offline job that produces CANDIDATES for human approval.
       The kernel never reads Langfuse on the hot path (ADR-058 section 6,
       ADR-056).

  DECIDED (2026-10-04): the clustering method (DK-500b) is decision
  dec-a070edfb6465bced, option opt.jev_pick_existing, approved by human:user.
  Code groups exact label or criterion-id matches. Jev picks an existing
  category or 'none' per candidate and suggests a merge only at p >= 0.8.
  Leftovers become one-member categories made by code. No LLM is involved, no
  broader links are suggested, and in-run grouping stays within the run's Jev
  budget. See DK-500b's notes.

  GOVERNING DECISIONS. Two decisions now govern this tree (doc_links,
  relationship governs):
    - dec-93c1c730463c1f3c, the file type (category records). All 65 ACs in
      the tree link it.
    - dec-a070edfb6465bced, the grouping method. This L0, DK-500b and the 23
      L2/L3s that rest on grouping link it (25 records as of 2026-10-05).

  DISTINCT FROM PRECEDENT REUSE. The decision-retrieval flow reuses an earlier
  ANSWER: a whole published decision used as precedent. This goal reuses the
  earlier QUESTIONS: the criteria a decision is judged by. The two complement
  each other and neither replaces the other. Like a precedent, a reused category
  is evidence, never authority (ADR-060).

  WORDING MAP FOR BA / IT PO (customer word -> record term):
    - "question" -> a criterion inside a decision record (criteria[].question)
    - "category" -> a criterion category record (kind criterion_category)
    - "preferred wording" / "other wordings" -> pref_label / alt_labels (SKOS)
    - "broader category" -> broader
    - "shared library" -> the published category records
    - "review of past decisions and run history" -> the offline criteria-mining job
    - "learning store" -> the optional Neo4j colony memory store (ADR-065)
    - "project's knowledge graph" -> a Neo4j projection of the reviewed records
      (the ADR-062 knowledge importer; ADR-062 and its native reader registry
      merged to main in PR #998 from feature/knowledge-retrieval-v01, and
      reached this branch, ac-authoring/reusable-criteria-store, with the
      2026-10-05 merge of origin/main)

  ROADMAP ALIGNMENT. Anchored at phase_kernel_2_knowledge ("reusable retrieval
  memory, so evidence is assembled before a specialist model is called"). That
  phase is planned, not active. The active kernel phase is
  phase_kernel_1_founding, and its exit criteria do not mention reusing
  criteria. DK-500f is anchored at phase_colony_1_collect. The PO flagged this
  fit to the user, and the user kept these anchors (2026-10-05). No roadmap
