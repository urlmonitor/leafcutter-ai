notes: >-
  Belt-and-suspenders / defense-in-depth complement to BP-300e-1..5. Those ACs
  make the ORCHESTRATOR side of the contract tolerant of prose around otherwise
  valid JSON; this AC tightens the OTHER side — the dispatched agent templates —
  so machine-parsed producers emit only their structured payload with no
  surrounding prose. The trigger case was the status-checker agent appending a
  "## Anomalies" markdown section after its JSON. This is AGENT-TEMPLATE (prompt)
  work, NOT engine JS — hence change_target: prompt. IT-PO enrichment set
  assigned_agent: llm-expert, estimated_complexity: M (coordinated edit across the
  status-checker template plus the ac-triage / pt-classifier / worktree-agent
  producers and a template-content test), it_requirements, and a template-content
  test_spec. delivers_to/expects_from are null: this AC has no hard contract
  dependency on the parseAgentJson helper (BP-300e-1) — it independently hardens
  the producer side of the same contract.
