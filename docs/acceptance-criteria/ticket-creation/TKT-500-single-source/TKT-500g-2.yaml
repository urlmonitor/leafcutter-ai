assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "The skip rule must be stated once and referenced, not restated three times. Three independently maintained descriptions of one decision is the state that produced this defect: two were changed, one was not, and nothing reported it."
  - "The decision may read exactly one input — whether the work item carries a proof demand. Worker classification, assignee identity, and file-path shape are all prohibited inputs for this decision, even where they would give the same answer on the case at hand."
  - "The reason each route records must name the input it actually used, so a skipped phase and a run phase are distinguishable after the fact from the record alone. A route that records a correct outcome with a wrong reason is a defect, because the reason is what the next reader relies on."
  - "The route enumeration must be exhaustive against the documented dispatch topology, not against the three routes known today. A fourth route added without being held to the single question reopens this defect in silence."
  - "TKT-500f-6-iii-b rewrites the same rule from the opposite input (proof section absent while implementation source is in scope must halt, not skip). Whichever of the two lands second must preserve the other's branch; the combined rule has to answer both inputs, and a rewrite that answers only one is a regression on the other."
test_spec:
  - name: test_every_route_description_states_the_skip_question_as_the_proof_demand
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Reads the three real route sources from disk — the supervisor template, the epic runbook skill, and the per-phase driver — and asserts each conditions the proof-phase skip on the presence of a proof demand. A cross-source shared-vocabulary contract, not a copy of one source."
  - name: test_the_per_phase_driver_runs_the_proof_phase_for_a_non_code_work_item
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "templates/workflows-js/build-ticket.js phase planning, exercised through the existing driver harness"
    description: "Drives a real generated work item that carries a proof demand and no production-code worker through the per-phase driver and asserts the proof-writing phase is dispatched rather than skipped. The one route of the three whose decision is executable code."
  - name: test_no_route_records_the_proof_phase_complete_without_it_having_run
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Negative control with the must-block modifier: a route that skips the phase must not be able to record it as complete. Feeds a skip decision through each route's completion recording and asserts the phase is reported as not run, never as satisfied."
test_rationale: |
  Two of the three routes are prose an agent reads, so their decision cannot be executed
  by a unit test; the only mechanism available for them is parity against a single written
  statement, which is why descriptor 1 reads the REAL sources rather than a convenience
  copy. That check alone would be a Neverfail test — it passes on prose nobody follows —
  so it is paired with descriptor 2, which executes the one route whose decision is code,
  and descriptor 3, the negative control that stops a skipped phase being recorded as
  satisfied. The route where the defect is actually live is the batch route, and that
  reachability obligation is carried separately by TKT-500g-2-i so it cannot be discharged
  by the easier per-phase-driver proof; the drift detector for descriptor 1 is
  TKT-500g-2-ii.
delivers_to:
  agent: test-writer
  contract: "The proof-writing phase is actually reached on every route for a work item that carries a proof section, so an authored demand results in a written proof rather than a signed-off skip."
expects_from:
  ac_id: TKT-500g-1
  contract: "A generated work item whose proof section is present whenever a demand was authored — the single input this decision is permitted to read."
