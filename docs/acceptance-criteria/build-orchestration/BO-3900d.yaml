notes: |
  WHY A GUARD AT ALL. The user asked whether a guard should flag new POSIX-only absolute
  checks. It is warranted. The incident's defect is one expression that looks correct to
  a Linux-hosted reviewer, and the user said the same assumption may already exist in
  sibling workflow scripts. BO-3900's harness proof covers build-feature. Without a breadth
  guard, a sibling or a new script can reintroduce the form with nothing turning red.

  NAMED MUTATIONS:
    M1 — examine a hard-coded list of the 8 scripts. Caught by
         test_every_workflow_script_is_examined_and_the_count_is_derived.
    M2 — match only the double-quoted `startsWith("/")`. Caught by the single-quote,
         index and charAt shapes in the seeded fixture.
    M3 — treat any marker as an exemption, reason or not. Caught by
         test_shared_classification_and_reasoned_marker_are_not_reported.
    M4 — report every leading-slash test, including the shared classification. Caught by
         the same test's acceptable input, and by test_check_passes_on_the_real_workflow_scripts.

  DECIDED 2026-09-14 (user, Q4): a unit test only, as written. No pre-commit hook record is
  to be authored.

  ALREADY-EXISTING OFFENDERS, found by the Q5 grep (see BO-3900 notes). build-feature.js
  line 1483 has startsWith("/"). plan-feature.js has regular expressions anchored on a
  leading slash at 588, 1391 and 1427. This check fails on the repository as it stands
  today. It passes only once BO-3900's fixes land, or once a site that is not a
  file-system path carries a reasoned marker, which is the fourth scenario's "Given
  BO-3900 has landed".

  Assigned to test-writer because the deliverable is a test. If the IT PO prefers a small
  scanning helper that the test calls, that helper is python-coder's, split out at
  enrichment.
