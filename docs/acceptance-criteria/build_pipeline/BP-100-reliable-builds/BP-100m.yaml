title: "No build artifact is ever silently overwritten by another"
component: build-pipeline
level: L1
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
criteria: |
  When two sources would land on the same file, the build stops and tells you — instead of quietly clobbering one.

  If two or more source templates would deploy to the same target output path,
  the build fails loudly with a clear message naming the collision, so a later
  phase can never silently replace an artifact an earlier phase produced. You
  always ship the artifact you intended, not whichever one happened to be
  written last.
