notes: |
  THE REGRESSION THIS PREVENTS IS A 60-SECOND TAX ON EVERY SINGLE-TEST RUN. A
  shared resource created eagerly at the start of every session makes the whole-suite
  case faster and the debugging case — one developer running one test repeatedly —
  measurably worse, by the full measured 59.8s per invocation. That is the exact
  loop TQ-600 exists to protect, so the shared layout must be produced on first
  demand rather than on startup.

  The two-clause form is deliberate: "zero when unused" alone is satisfiable by a
  layout that is never produced at all, which would fail TQ-600a-1 but only in a
  different test. Pinning one-when-used in the same criterion keeps this AC
  self-contained.
