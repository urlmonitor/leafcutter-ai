criteria: |
  Given requirement R, whose work is not finished, declares four files:
      scripts/ac_store/scan_ac_store.py, marked existing, and present in the repository,
      scripts/ac_store/declared_files.py, marked to be created, and absent,
      scripts/ac_store/nowhere.py, marked existing, and absent,
      scripts/ac_store/done_proof.py, marked to be created, and present,
  When R is checked before it enters the repository,
  Then R is refused with exactly one refusal message, naming R and scripts/ac_store/nowhere.py
    as neither present nor marked to be created,
  And scripts/ac_store/done_proof.py is reported as "marked to be created but already exists",
    naming R, without being a reason to refuse R,
  And scripts/ac_store/scan_ac_store.py and scripts/ac_store/declared_files.py produce no message,
  And once scripts/ac_store/nowhere.py is re-marked to be created, R is accepted and only the
    scripts/ac_store/done_proof.py report remains,
  And for a requirement whose work is finished, a file it marked to be created that now exists
    is neither refused nor reported, because the finished work is what created it.
