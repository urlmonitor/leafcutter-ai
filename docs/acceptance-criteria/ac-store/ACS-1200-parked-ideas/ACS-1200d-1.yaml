id: ACS-1200d-1
components:
  - ac_store
  - commit_guardian
title: "Un-parking is one change that removes the marker and restores the child list together"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200d.yaml
criteria: |
  Given KM-200.yaml carries parked: true with a non-empty parked_reason and an
    empty covered_by, and its six children KM-200a through KM-200f exist,
  When a single staged change removes both parked and parked_reason from
    KM-200.yaml and adds all six child ids to its covered_by, and the AC-store
    checks are executed as processes against that staged set,
  Then every one of them exits 0,
  And the store-wide orphan scan run afterwards reports KM-200 in neither its
    orphan list nor its parked section,
  And the six children are reported as normally linked to their parent,
  And no check had to be skipped and no bypass was used to land the transition.
