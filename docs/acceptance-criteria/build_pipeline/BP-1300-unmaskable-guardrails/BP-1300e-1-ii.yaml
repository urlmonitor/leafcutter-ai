      - "omits the predates-this-change explanation"
    description: "unit_tests/c.py is committed with F841 at line 40; a later staged edit changes only line 90 cleanly; the commit is refused naming line 40, F841, and the predates/whole-file/CI sentence."
  - name: test_bp_1300e_1_ii_newly_unused_variable_at_untouched_line_is_not_labelled_preexisting
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: unit
    angle: boundary
    description: "Removing the only use of a variable creates F841 at an untouched line; the refusal reports it WITHOUT the predates label, because HEAD had no such finding."
  - name: test_bp_1300e_1_ii_staged_violation_is_refused_although_working_copy_is_clean
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    must_catch:
      - "reads the working-tree file instead of the index blob"
    description: "Stage a file with E741, then fix it in the working copy without staging; commit is refused."
  - name: test_bp_1300e_1_ii_clean_staged_version_commits_although_working_copy_is_dirty
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "Stage a clean file, then add E741 in the working copy without staging; commit completes."
  - name: test_bp_1300e_1_ii_commit_with_pathspec_is_judged_on_the_temporary_index
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: boundary
    must_catch:
      - "reads .git/index directly or scrubs GIT_INDEX_FILE from the child environment"
    description: "`git commit -m x -- scripts/d.py` where scripts/d.py's working copy carries E741 but the default index holds a clean version: refused (the pathspec commit judges the working-copy content it is committing)."
  - name: test_bp_1300e_1_ii_deletion_only_commit_is_not_linted_and_does_not_error
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "A commit that only `git rm`s an in-scope .py completes; output reports nothing to inspect and no error."
  - name: test_bp_1300e_1_ii_partially_staged_ruff_config_is_could_not_check
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: failure
    description: "ruff.toml has unstaged edits relative to its index version and a staged in-scope .py exists; commit is refused as could_not_check naming ruff.toml."
test_rationale: >-
  Each arm separates the staged content from the working copy in exactly one
  direction, because an implementation that reads the working tree passes any
  test where the two are equal. The pathspec arm exists because GIT_INDEX_FILE is
  invisible in every test that commits with a plain `git commit`, yet it is how
  commits are made into a dirty shared tree here. The newly-unused-variable arm
  pins the HEAD-comparison semantics of the predates label; a hunk-based label
  passes the BA's F841 scenario and mislabels this one. Commit-path tests reuse
  _bp_1300e_lint_gate_fixture.py and declare @pytest.mark.shared_layout_reader
  with @pytest.mark.usefixtures("shared_reference_layout"); the boundary unit
  test may call the labelling function directly.
