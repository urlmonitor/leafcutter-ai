id: BO-2900f-2
components:
  - build_orchestration
  - supervisor_system
title: "Exactly one recorded outcome per requested gate — on the executed path and the skipped path alike"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a work item requests four quality gates — gate A and gate B, which execute,
    and gate C and gate D, which are skipped because they are switched off,
    And the run reaches every one of those four gates' decision points and finishes,
  When the recorded gate results are read,
  Then the number of recorded entries equals four — the number of gates requested,
    And gate A, gate B, gate C and gate D each appear exactly once,
    And gate C and gate D — the skipped ones — appear once each and not twice,
    And no requested gate is left with zero entries.
