test_rationale: >-
  Behavioral, not grep-only, per CLAUDE.md's "Gate / Workflow ACs" rule: the test drives
  the real plan-feature.js top-level body under the E2 stub harness
  (run_workflow_under_e2), configures a worktree-setup response naming a specific fake
