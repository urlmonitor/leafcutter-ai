estimated_complexity: S
test_required: false
test_rationale: >-
  Documentation-only; no executable behaviour. The commands the guide prints are
  the same CLI that BP-1300e-1-i's tests execute, so the guide is verified by
  running each command it shows against a real checkout before sign-off, not by
  a test of its own.
it_requirements:
  - "NEW FILE docs/how-to/fix-a-commit-time-lint-refusal.md with frontmatter that passes check-doc-frontmatter (type: how-to, components including commit_guardian and precommit_hooks) and stays under the doc-length gate's growth ratchet."
  - "READ A REFUSAL using the real format delivered by BP-1300e-1 (path:line:col: CODE message [step: name], the predates suffix, the RESULT line, the ruff version). Copy a real refusal produced by the landed hook, not an invented one."
  - "REPRODUCE BY HAND WITH CI'S EXACT COMMAND: in this repository `python templates/scripts/commit_guardian/check_lint_gate.py --mode full` (what ci.yml's lint job runs); in an adopter project `python <output_root>/scripts/commit_guardian/check_lint_gate.py --mode full`. Never print a raw `ruff check <trees>` command with a tree list -- that is the drifting copy this feature removes."
  - "EXPLAIN THE PREDATES CASE (BP-1300e-1-ii): the whole touched file is judged because CI judges whole files; give the two remedies (fix the old finding in this commit, or split the commit so the file is not touched)."
  - "ONE SECTION PER CANNOT-RUN CAUSE (BP-1300e-1-iii): not installed (module or executable; `pip install -r requirements-dev.txt` here, `pip install ruff` generally), will not start, configuration unreadable, leafcutter-lint.json unreadable, partially staged ruff configuration, configuration outside the project, no repository. State plainly that none of these is ever shown as passed and that SKIP=check-lint-gate is not a remedy -- CI will fail the push."
  - "ADOPTERS: where leafcutter-lint.json lives (git toplevel, tracked, never generated by build.py), its fields, the default when absent, and the one command to put in their own CI."
  - "REPLACE, DON'T SIT BESIDE: (a) update docs/how-to/managing-pre-commit-hooks.md to list check-lint-gate and link this guide; (b) in CLAUDE.md's Pre-Drive Checklist subsection 'Full test suite + ruff at epic-finalize', replace the `ruff check <worktree-root>/scripts <worktree-root>/tests <worktree-root>/unit_tests` line with the full-mode command and state the commit-time check now exists, keeping the full-run instruction as a whole-tree backstop. Touch no other CLAUDE.md subsection (the Error Handling Policy is BP-1300e-2-i's). The 'unestablished worktree ruff hook' phrase in that subsection's 'Why this matters' paragraph describes a hook that never existed (KI-CG-20261009); correct it in the same edit."
