title: "A database test run without the setting stops and names the missing setting"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a database test built on the shipped database-test pattern, and three
    projects —
      P1: db_connection_test not set,
      P2: db_connection_test set to "   " (only spaces),
      P3: db_connection_test set to
          postgresql://app:app@db.internal:5432/app_test,
  When that test is run in each project,
  Then in P1 and P2 the test ends as an error, not a pass and not a skip,
      with a message naming testing_context.db_connection_test as not
      configured, and no database connection is attempted,
    And in P3 the test receives exactly
      postgresql://app:app@db.internal:5432/app_test as its connection,
    And in all three projects the setting is read through the same resolver
      the pre-run test-database checker (INF-1100d-3-i) uses, so exactly one
      piece of code reads the setting and an empty value means "not
      configured" in both places.
