estimated_complexity: M
it_requirements:
  - "Script must be idempotent: re-running on an already-done AC must exit 0 with no changes"
  - "Script must validate the AC exists and is in active status before writing"
  - "YAML write must preserve existing field order and comments (use ruamel.yaml round-trip)"
  - "Script must exit non-zero if the target AC does not exist or has no active status"
  - "All stdout/stderr output must be structured (parseable by downstream tooling)"
