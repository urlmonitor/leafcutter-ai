it_requirements:
- remove never reads stdin or prompts (finalize's teardown deadlock); it classifies unsent work with the
  BO-4100c-1 verdict -- commits on the workspace's branch reachable from neither origin/<branch> nor origin/main
  after a fetch, plus uncommitted and untracked changes -- and refuses UNSENT_WORK listing unsent.commits
  and unsent.files unless discard was authorised up front (BO-4300e-3).
- Deletion removes the whole folder (Windows extended-length path prefix where needed), runs no prune
  and changes nothing in the main checkout; the answer is ok only after a post-check finds nothing left
  at the location.
- The maker never reads stdin and never prompts; every decision it needs arrives as an argument of the
  request, so an unattended caller can never stall on it.
- Answers conform to the result contract delivered by BO-4300c-2 (one JSON object on stdout, status/code/exit
  mapping, workspace_path absent on every non-ok answer).
- Proof runs the DEPLOYED maker -- the copy an install delivers, resolved through the shared test locator
  delivered by BO-4300f-4 -- as a separate process against real temporary git repositories with a real
  bare hub. No mock of git, no import of the maker module, no grep of its source (CLAUDE.md 'Gate / Workflow
  ACs -- Verify Behaviorally, Not by Grep'); a test never falls back to the templates/ source copy.
- All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
  isolated global and system config; afterwards the developer's own repository's branches, registered
  worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_remove_answers_without_waiting_for_input
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: With stdin closed and a timeout, both remove requests return an answer.
- name: test_clean_workspace_is_removed_completely
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: alpha's folder no longer exists and the answer is ok with removed_path.
- name: test_workspace_with_unsent_work_is_refused_naming_commit_and_file
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: beta is refused UNSENT_WORK with unsent.commits containing the unpushed sha and unsent.files
    the uncommitted path.
- name: test_refused_workspace_is_unchanged
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: beta's files and commits are identical before and after.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer, its exit code, and the state of the workspace, the hub and the main copy afterwards.
  A direct-import unit test would pass while the deployed copy is stale or mis-deployed (F13), and a git
  mock cannot show the half-made and occupied states this family exists to handle.
