title: "A record that owns no document is never dispatched a documentation demand -- phase selection, not just rendering"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given two leaf ACs identical in every field including `change_target: pipeline` -- a value that
    triggers a documentation demand under the documentation-gates policy -- except that
    the first owns `docs/how-to/thing.md` (relationship `creates`) and the second owns no
    document at all,
  When a ticket is generated from each,
  Then the first ticket's agents map contains `documentation-expert` and
    `documentation-verifier`, its frontmatter sets `documentation_required: true`, and its
    contract line names `docs/how-to/thing.md`.
  And the second ticket's agents map contains NEITHER `documentation-expert` NOR
    `documentation-verifier`, its frontmatter does not set `documentation_required: true`, and its
    body carries no `### documentation-expert` subsection.
  And so a triggering `change_target` remains necessary for a documentation demand but is no
    longer sufficient: the record must also own a document. This narrows the existing policy
    behaviour, which decides the demand from the classification alone.

  And given the second ticket ALSO carries a `## Agent Contracts` section for its `delivers_to`
    and `expects_from` contracts -- the ordinary case, since those contracts share that section --
  When the documentation-verifier's own detection and parse steps are executed against that
    generated ticket file,
  Then no blocker is produced. Suppressing only the subsection is not sufficient and must be
    shown not to be: a ticket whose `## Agent Contracts` section is present but whose
    `### documentation-expert` subsection is absent is rejected outright by the verifier, as is a
    subsection carrying zero parseable contract lines. The demand must be removed at phase
    selection so the verifier is never dispatched, not removed at rendering and left to the
    verifier to tolerate.

  And given the second ticket is run through its full phase sequence,
  Then it reaches commit with no documentation phase recorded, no documentation blocker, and no
    documentation sign-off -- rather than reaching commit with a documentation blocker that was
    classified cross_agent and skipped while the build still reported success.
