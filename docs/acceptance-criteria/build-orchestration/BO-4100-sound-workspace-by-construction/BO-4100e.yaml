notes: >-
  Evidence: KI-BO-20260831-1331 -- a half-created workspace is invisible to the tool that
  lists them, so it can be neither classified nor removed, and its symptom reads as
  store-wide corruption. That misdiagnosis is part of the harm and belongs in scope: the
  leftover must be reported as a local remnant, not as damage to the shared record, or the
  operator is sent to repair the wrong thing.
  SCOPE -- RECOVERY HALF ONLY. The prevention half is already specified by BO-4100a-3-i
  ("a refused creation leaves no branch, directory or registration behind"). Do not
  re-derive it here. This record covers only what must happen for a leftover that already
  exists, which makes it considerably smaller than it first appears.
  BOUNDARY against BO-4100c -- decided at PO stage after the BA's decomposition, do not
  re-open. All four of BO-4100c's L2 children presuppose that the workspace APPEARS in the
  live set: c-1 assesses that set, and c-2/c-3/c-4 each act on an entry within it. A
  workspace the listing cannot see is outside the domain of all four, and folding this in
  would force every one of them to carry a weaker precondition ("for workspaces the listing
  can see...") and degrade the family. The promises differ too: BO-4100c promises the
  disposability VERDICT is right; this promises the listing is COMPLETE and that something
  unlistable is still recoverable. The observables are completeness and recoverability, not
  verdict correctness.
  Keep enforcement-shaped when decomposing: every Then clause must be observable in what the
  system does -- a workspace surfaced, a leftover cleared, a cause named correctly -- never
  in a document existing or having been read.
