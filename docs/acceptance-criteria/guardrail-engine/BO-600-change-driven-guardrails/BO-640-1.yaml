id: BO-640-1
title: "High-complexity assessment triggers a decomposition challenge before escalation"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket has estimated_complexity: H,
  When the guardrail engine processes the ticket before agent dispatch,
  Then it triggers a complexity challenge step BEFORE routing to the Opus-class tier
  And the challenge step presents the IT PO agent with a structured prompt:
    "This ticket is assessed as high complexity. Can it be decomposed into
     simpler pieces? Can the scope be narrowed to reduce complexity?"
  And the challenge includes the ticket's title, acceptance criteria, and
    files_touched list as context for the IT PO to evaluate

  Given a ticket has estimated_complexity: S or M,
  When the guardrail engine processes the ticket,
  Then the complexity challenge step is SKIPPED entirely
  And the ticket proceeds directly to agent dispatch at the Sonnet-class tier
depends_on: [BO-640, BO-630-2]
