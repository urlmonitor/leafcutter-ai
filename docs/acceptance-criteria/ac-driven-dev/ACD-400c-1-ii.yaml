id: ACD-400c-1-ii
components:
  - ac_driven_dev
title: "An approval that is not recorded in the exact recognised wording does not count as approval"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the store holds two pieces of leaf-level work that are active, still to do
    and waiting on nothing, whose recorded approval reads as approval to a human but
    does not match the recognised wording exactly — one recorded in capitals
    ("APPROVED") and one recorded with trailing whitespace ("approved "),
  And a third such piece whose recorded approval matches the recognised wording
    exactly,
  When the queue is asked which work is ready to be picked up,
  Then only the exactly-matching piece is offered,
  And the two near-miss pieces are withheld, appearing neither among the work
    offered nor among the work reported as held,
  And this outcome is the stated verdict for an unrecognised approval, not an
    accident: an approval whose wording is not recognised is treated as no approval.
depends_on: [ACD-400c-1]
doc_links:
