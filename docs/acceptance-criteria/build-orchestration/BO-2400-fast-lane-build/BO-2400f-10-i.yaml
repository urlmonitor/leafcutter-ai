    date: "2026-08-25"
    reason: "TECHNICAL ENRICHMENT ONLY — no criteria, title, depends_on, covered_by, declares_side_effect, work_status or test_rationale text was touched. declares_side_effect stays true, which the enrichment confirms rather than contradicts: the release mutates work_status in an on-disk store. Set assigned_agent python-coder, estimated_complexity L, it_requirements, delivers_to, expects_from and test_spec; corrected one doc_link and added two. THREE FINDINGS THE ENRICHMENT TURNED UP THAT CHANGE THE WORK. (1) THE ENGINE HAS NO COMMAND PRIMITIVE. Across templates/workflows-js/ the only awaited engine primitives are agent(), parallel() and prompt() — everything else is a local helper — so the Product Owner's preferred direction, 'invoke the deterministic command directly rather than asking an agent', is not expressible at the JavaScript layer today. The second scenario therefore has to be satisfied by WHO is dispatched, and no agent among the 60 in config/agent_registry.json declares mutating AC claim state; status-checker is a read-only reporter. Adding one means an agent template under templates/agents/*.md, which is llm-expert's surface and not python-coder's, so the single-coder phase is under-scoped for that shape. Flagged rather than split, because splitting would require inventing criteria the BA did not write. (2) TWO OF THE NINE RELEASE SITES SHARE A LABEL — lines 751 and 773 are both 'release-on-review-fail'. run_workflow_under_e2 keys its stubs on label, so those two paths cannot be driven or observed apart, and 'all nine covered' is arithmetically impossible until the labels are unique. Making them unique is now a constraint and has its own test. (3) THE DOC_LINK templates/scripts/fast_lane.py DOES NOT EXIST. The real path is scripts/build_orchestration/fast_lane.py (release_claim at 309, CLI at 1471-1486, dispatch at 1660-1664). The dead entry is kept with status planned rather than deleted so the correction is visible. CARRIED, NOT SETTLED, as the BA intended: whether the release must reach mainline or only the workspace store the claim was made in. 'The store the run claimed in' is resolved in the constraints to acStoreRoot — the variable the lane already holds and already passes to the claim — which keeps the record true under either answer, and the implementer is explicitly forbidden from deciding the question in code."
