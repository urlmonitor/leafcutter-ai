it_requirements:
  - "Write the section into docs/reference/ac-schema.md -- the canonical description of the AC record and already the doc_link on ACD-1600g itself. Do not start a new reference file; a second home for the boundary rule is how the two descriptions diverge."
  - "The section must state, for the boundary field: that it sits alongside the change-surface field it qualifies; that it is OPTIONAL; and that its ABSENCE is legacy mode, which is explicitly NOT the same thing as a declared empty boundary. The absent-versus-empty distinction is the fact most likely to be lost in the writing, and it is the fact two of the sibling behaviours depend on."
  - "The section must state the bundle composition rule as a DIFFERENCE -- a path is out of scope for a bundle when at least one member excludes it AND no member changes it -- and must carry the worked three-member counter-example showing why taking the members' exclusions together blocks a legitimate bundle. The counter-example is load-bearing content, not illustration: the naive union is the single most likely defect in this area, and a rule stated without its counter-example gets re-derived wrongly by the next author who reads the field name."
  - "The section must state the mixed-grain cancellation rule -- a member changing one file inside an excluded directory cancels that PATH, not the whole exclusion entry -- or a reader cannot predict the outcome for the directory-grain exclusions that are the common case."
  - "The section must state what a scope review does when a requirement carries no boundary at all: an advisory announcement naming the requirement, not a block, and materially different from the outcome for a declared-empty boundary."
  - "This reference section is the SINGLE NORMATIVE definition that the AC-store schema, the three commit-gating validators, and the change-scope-reviewer agent template all mirror. The mirroring is spec-parity, not code reuse -- a markdown agent template and a Python validator cannot share an import -- so an inaccuracy here propagates into three implementations that each look internally consistent."
  - "Acceptance is comprehension, not presence: the section must be sufficient for an author who has read nothing else to author a valid boundary and predict the review outcome for a three-member bundle. A heading with a field name under it satisfies no clause of the criteria."
  - "Canonical source only: edit the source-tree copy, never a deployed one (ADR-001)."
