criteria: |
  Given a user has the AC-driven development system deployed,
  When they want to learn how to use it,
  Then a how-to guide exists in docs/how-to/ (or docs/) explaining:
    1. How to author new ACs via the PO/BA pipeline
    2. How to review and approve ACs (set readiness: approved + priority)
    3. How to invoke /build-ac to build the next most important AC
    4. How to use /build-ac --ac <id> to target a specific AC
    5. How to check which ACs are ready vs blocked vs draft
    6. How the done-linker closes the loop automatically after merge,
  And the guide follows the Diataxis how-to style (task-oriented, not explanatory),
  And it references the flow diagrams (ACD-100a-1, ACD-100a-2) as visual aids.
