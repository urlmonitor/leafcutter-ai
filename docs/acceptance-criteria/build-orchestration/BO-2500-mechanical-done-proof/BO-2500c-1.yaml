title: "Fixtures for serialized data are produced by the real serializer, not hand-typed"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a test needs input data of a kind that a tool serializes (for example a YAML
    ticket or AC file),
  When the test constructs that fixture,
  Then the fixture is generated by the real producer (for example the actual serializer
    such as yaml.safe_dump, or an existing on-disk artifact)
  And it is not a hand-typed literal standing in for the serialized form.
