it_requirements:
  - "Root cause: _find_nodeid_for_test returns the FIRST nodeid whose function name matches, and _classify_outcomes reads that one nodeid's outcome, so every later parametrised case is ignored"
  - "Every matching case must be considered: same-file matches take precedence over name-only matches exactly as today, and within the chosen match set any non-PASSED case makes the function non-passing"
  - "Keep the helper's return contract (a single nodeid present in pytest_results, or None) so the fast lane's red-baseline caller (_fl_red_baseline_support._resolve_tag_outcome) inherits the fix without edits"
  - "Must not regress ACS-200f/ACS-200f-1: a plain or all-passing parametrised test still passes, a longer sibling name (test_foo_bar) never matches test_foo, no match stays None"
  - "Must follow the repo error-handling policy; this is a pure function, so no try/except"
