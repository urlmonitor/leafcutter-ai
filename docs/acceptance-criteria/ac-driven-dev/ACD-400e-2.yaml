id: ACD-400e-2
components:
  - ac_driven_dev
title: "The three older records that describe the queue wrongly are corrected, and the queue is left alone"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given three existing records — ACD-400, ACD-400a and ACD-400a-1 — each state in
    their own criteria how the queue chooses work, and each disagrees with what the
    queue does: two of them name an order of two keys where three are consulted, and
    all three present the admission tests as a set that omits approval,
  When the statement each record makes is turned into a store built exactly as that
    record describes and the queue is asked which work is ready,
  Then the queue's answer is the one that record predicts, for each of the three
    records in turn,
  And the record that was corrected demonstrably disagreed beforehand: run against
    the same three records as they stand today, the same check reports a disagreement
    for each of them,
  And the correction is a change to what those three records say and not to what the
    queue does — for any store, the work the queue offers and the order it offers it
    in are the same after the correction as before,
  And no lifecycle field on any of the three records is altered: only the wording of
    what each says about selection changes.
depends_on: [ACD-400e, ACD-400e-1]
