it_requirements:
  - "Surface is the pre-dispatch consistency lens in templates/agents/it-po.md (applied before the first coder dispatch): compare the work item's stated intent (assigned implementer + its checking test framework) against the declared surface (files_touched extensions)."
  - "Detect a technology CONTRADICTION where the implementer/checker cannot act on the declared surface (e.g. a Python implementer checked by a Python test framework aimed at a JavaScript surface); surface the mismatch by name before any implementer is dispatched. A matching implementer/surface passes unflagged."
  - "This is DISTINCT from BP-1100a (files_touched contains an executable surface at all) and from BP-1100e-1 (post-change declared-vs-actual reconciliation) — do not re-derive either; check intent(technology)-versus-surface only."
  - "Per the selection_criteria DSL limits (no negation / no derived-path correlation), express this as an llm/judgment lens in the template, not as a DSL trigger; planning-time judgment degrades to advisory, so pair with a commit-time mechanical backstop only if a follow-up python-coder AC is authored (see caveat)."
  - "Portable per ADR-001 — the rule lives in the packaged template and reaches any consumer that runs build.py; verify via the build.py round-trip."
