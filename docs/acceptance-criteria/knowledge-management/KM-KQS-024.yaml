title: "Edges targeting phantom nodes are filtered from output"
component: knowledge-management
level: L2
status: active
work_status: todo
criteria: |
  Given the graph contains edges whose target values are "user" or "__ticket_phase_agents__"
  And neither "user" nor "__ticket_phase_agents__" exists as a node id in the graph
  When the edge list is finalized for output (both JSON and visualization)
  Then edges with target "user" are excluded from the output
  And edges with target "__ticket_phase_agents__" are excluded from the output
  And edges whose target matches a valid node id in the graph are retained
  And the filtering applies in both knowledge_query.py JSON output and visualise_knowledge_graph.py HTML output
