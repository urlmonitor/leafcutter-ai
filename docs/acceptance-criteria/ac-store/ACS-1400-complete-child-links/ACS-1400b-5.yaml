criteria: |
  Given a person who has not worked on the requirement store before and has only
    the written guide,
  When they follow it to run the store-wide check on demand against the real store
    and read what comes back,
  Then they obtain a report without needing to know which script performs the
    detection,
  And for a record classified as a deliberate exclusion they correctly conclude
    that no action is required and can state the reason the author gave,
  And for a record classified as unrecorded drift they correctly conclude that
    action is required and can name the parent whose list is incomplete,
  And they correctly identify, from the report alone, whether the run examined the
    whole store or some subset of it.
