assigned_agent: python-coder
estimated_complexity: L
delivers_to:
  - agent: python-coder
    contract: >-
      Sweep entry point and selection result: one JSON object {status: "ok" | "partial", mode:
      "preview" | "real", removed: [{kind: "workspace" | "scratch" | "outside", location: absolute
      path, bytes: int}], kept: [{kind, location, reason: for a workspace, the landed-work pass's
      own kept reason verbatim (BO-4400g-2: not_on_main | holds_unsent_work | no_own_work | in_use |
      landing_unconfirmed | shared_project_unreachable); for scratch, "not_expired"}], failed:
      [{kind, location, reason: str, bytes: int}]}. Consumed by
      the report (BO-4400d-2), the session-start trigger (BO-4400d-3) and BO-4400f-1-i/-1-ii/-3-i.
  - agent: architecture-diagram-author
    contract: "The sweep's component boundary and the capabilities it calls (the landed-work pass for workspaces, which uses the listing, verdict, in-use check and the one door; the outside-item inventory; the scratch rule) for BO-4400d-5."
expects_from:
  - ac_id: BO-4400g-2
    contract: >-
      The whole-project clear-landed answer (and clear-landed --preview), run once per installed project: cleared
      workspaces with the door's own removed answer, kept workspaces with exactly one reason from not_on_main,
      holds_unsent_work, no_own_work, in_use, landing_unconfirmed and shared_project_unreachable, and
      already_gone.
  - ac_id: BO-4400f-1
    contract: "The scratch age and ownership rule deciding which scratch items are expired."
package_surface: false
it_requirements:
  - >-
    SURFACE: a new sweep, delivered either as a verb of the one maker or as a sibling stdlib-only
    script under templates/scripts/ deployed beside it by a named deploy-manifest entry
    (scripts/build_phases_script_deploy.py and scripts/build_deploy_manifest_helpers.py). It is
    distinct from scripts/worktree/sweep_processes.py (orphan processes) and must not be merged
    into it.
  - >-
    The sweep DECIDES NOTHING ITSELF: the workspace set comes from the maker's list / BO-4100e
    discovery (incl. unregistered leftovers), and which workspaces are cleared or kept, with what
    reason, is the landed-work pass's decision (BO-4400g-2 and its children; ONE RULE, user decision
    2026-11-16), which uses the BO-4100c-1 verdict (no verdict -> kept, BO-4100c-3) and hands a
    record-less leftover to the door's own leftover rule (being specified in PR #1414). Expiry comes from the
    BO-4400f-1 rule and orphaned outside items from BO-4400b-1's inventory. Every workspace removal is a
    request to the one door, made by the pass; the sweep never deletes a workspace folder directly.
  - >-
    IN USE, DECIDED: for workspaces the in-use source is the pass's, which is the door's own program check
    (BO-4300e-2-iv). It runs first on every clear and fails closed, and its refusal is reported as in_use. The
    sweep adds no second in-use signal for workspaces; BO-1800d's promise (housekeeping never disturbs work
    in flight) is met by that check. "active-1" is proven by a real process whose working folder is inside it.
  - >-
    PER PROJECT: the sweep's workspace part runs the deployed maker's clear-landed once for each installed
    project it covers, addressed by that project's --repo-root (and clear-landed --preview for the preview of
    BO-4400d-2). Each project's decision and kept reasons are taken verbatim, and one project's workspaces are
    never judged or reported under another's.
  - >-
    Never prompts, never reads stdin, never passes discard authorisation.
  - >-
    The workspace clears the pass makes for the sweep go through the door's own unsent-work and program
    checks at the moment of removal, so the verdict and the in-use check are both taken again right before
    each removal (BO-4400d-1-i, BO-4400g-2-iii).
  - >-
    BUILD ORDER: the "leftover-1" half of the first test can only pass once the door's rule for a record-less
    leftover matching its merged line exists (being specified in PR #1414, not on main). Until then the pass
    keeps it as landing_unconfirmed, so that test part is written only after that rule lands, with the
    fixture built the way the door's rule matches.
  - >-
    PREREQUISITE: BO-4300c-1-iii (a build restores the tracked files it changes). Without it every
    finished workspace reads holds-work and the sweep reclaims nothing; the sweep must not work
    around this by loosening the verdict.
  - >-
    Must handle errors per the project error handling policy (CLAUDE.md Rules 1-4); one item's
    failure never aborts the sweep (BO-4400d-2-i).
  - >-
    PROOF runs the DEPLOYED sweep as a separate process against real temporary repositories with a
    real bare hub, nine real workspaces in the listed states (merges made on the hub, ages set
    through file modification times), a real scratch location with five
    labelled items (ages set via the label's created time and file mtimes), a real orphaned
    environment folder in a temporary HOME, and a real running process whose working folder is inside
    active-1 (the door's program check). Byte-identity by hashing every file before and after. No mock of git, no import of the
    sweep module, no build.py spawn.
test_required: true
test_spec:
  - name: test_sweep_removes_finished_leftovers_expired_scratch_and_orphan
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "idle-1, idle-2, leftover-1, the three expired scratch items and the orphaned environment are gone after the sweep. The leftover-1 part is written only once the door's record-less leftover rule exists (see the BUILD ORDER it_requirement)."
  - name: test_sweep_keeps_pushed_and_fresh_workspaces_and_reports_the_pass_reasons
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      pushed-1 (pushed to its own line, not merged, a file changed an hour ago) and fresh-1 (no commit of its
      own, made an hour ago) are byte-identical after the sweep. The sweep reports pushed-1 kept as not_on_main
      and fresh-1 as no_own_work. For every kept workspace, the reported reason equals the reason the deployed
      maker's clear-landed --preview gives for that workspace on the same fixture, run by the test beforehand.
    must_catch:
      - "sweep clears by holds-nothing alone instead of the pass's rule (pushed-1 and fresh-1 removed)"
      - "sweep reports a kept reason of its own instead of the pass's reason"
  - name: test_sweep_keeps_unsent_dirty_noverdict_active_and_unexpired_byte_identical
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "unsent-1, dirty-1, noverdict-1, active-1 and the two unexpired scratch items are byte-identical after the sweep."
    must_catch:
      - "sweep selects by age or registration alone, ignoring the verdict"
      - "no-verdict treated as holds-nothing"
      - "in-use check skipped"
  - name: test_sweep_removes_workspaces_only_through_the_door
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Every removed workspace appears with the door's removed answer in the sweep result."
    must_catch:
      - "sweep deletes workspace folders directly"
  - name: test_sweep_asks_nobody_anything
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "With stdin closed and a timeout, the sweep completes."
  - name: test_sweep_workspace_part_runs_the_deployed_clear_landed_verb_once_per_project
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      Grounding added at the test-designer pass (nothing above is weakened). The deployed sweep is run as a separate
      process through its real entry point against two installed projects "shop" and "blog" (each its own real bare hub
      and landing place; make_project fixes the directory names project and hub.git under its tmp, so each project is
      built under its own tmp root). Each project's landed workspace (a real fast-forward merge on its hub) is cleared
      by the deployed maker's clear-landed addressed with that project's --repo-root, the result lists each workspace
      under its own project only, and a recording wrapper first on PATH shows the sweep ran no git push. No record
      declares the sweep's entry point (the SURFACE requirement leaves it a maker verb or a sibling script), so the
      build fixes it and this test is written against the path the build documents.
    code_file: templates/scripts/worktree.py
  - name: test_leftover_1_is_kept_as_landing_unconfirmed_until_the_door_leftover_rule_lands
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      Builds leftover-1 as a record-less folder in the landing place whose repository leftovers (FETCH_HEAD and
      config url) name only this project's shared project, the evidence worktree_remove_half.names_project uses. Until
      the door rule of PR #1414 exists the sweep keeps it, reporting reason landing_unconfirmed, and it is
      byte-identical afterwards. The assertion that it is removed is added only when that rule is on main
      (BUILD ORDER it_requirement), so the first test above stays red for that part and the record cannot be
      marked done before PR #1414.
    code_file: templates/scripts/worktree_remove_half.py
test_design_authorship:
  step: test-designer
