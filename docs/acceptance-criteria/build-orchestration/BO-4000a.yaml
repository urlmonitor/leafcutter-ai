assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The instructed and reported locations are compared with BO-3900's single equivalence rule (separator spelling, trailing separator, and letter case for drive-lettered and UNC forms). Raw string equality is a defect."
  - "The reported location is read only from the worktree step's schema-validated result. A missing, unparseable or schema-failing result counts as 'no usable result'; it never means 'no worktree needed', and the run never falls back to the current directory."
  - "Both refusals end the run before any phase agent is dispatched. Each carries a stable, machine-readable reason discriminator (wrong location versus no usable result) and, for the wrong-location refusal, both locations, so the two can be told apart without parsing message wording (ADR-039 precedent)."
  - "A refusal stops the run only. It does not remove, modify or register anything the worktree agent may have created: cleanup is a separate capability that has not been requested."
  - "Once assigned, the run's worktree is never changed. A worktree_path field in any later agent result is ignored when rooting phase prompts."
  - "When a differently spelled report is accepted, the run keeps the instructed location's spelling for every later phase prompt."
delivers_to: null
expects_from:
  ac_id: BO-4000
  contract: "The exact location string BO-4000 names to the worktree-opening agent (<worktree base>/<target identity>, in BO-3900's output spelling), and the run's worktree as a single assignment made at the worktree step."
test_required: true
test_spec:
  - name: test_reported_location_other_than_instructed_stops_before_any_phase_agent
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "With the worktree stub reporting the incident's nested epic-folder path, no phase agent is dispatched and the refusal names both locations."
  - name: test_same_location_in_another_spelling_is_accepted
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Paired acceptable input: forward-slash, lower-case and trailing-separator spellings of the instructed location are accepted and the run proceeds."
  - name: test_unreadable_worktree_result_refuses_distinguishably_from_wrong_location
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "No usable result and a wrong location both stop the run with different stated reasons."
  - name: test_later_worktree_path_in_an_agent_result_does_not_replace_the_resolved_worktree
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: seam
    description: "In the reuse case, a stray worktree_path in a later result does not change the root of subsequent phase prompts."
  - name: test_worktree_report_adjudication_is_reachable_from_the_workflow_top_level_body
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: templates/workflows-js/build-feature.js
    description: "All cases are driven through _workflow_engine_harness.py running build-feature.js's own top-level body."
test_rationale: |
  BO-4000 makes the workflow name the location. It cannot make an agent obey. The only
  guarantee the workflow can give is to refuse a report that disagrees. Every BO-4000 test
  stays green with a stub that obeys, so disobedience needs its own stubs. The
  other-spelling case is paired with it because the obvious implementation, raw string
  equality, refuses a correct worktree whenever git and the agent spell the path
  differently, which on Windows is the normal case.
