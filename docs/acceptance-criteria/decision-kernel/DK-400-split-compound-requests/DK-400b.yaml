criteria: |
  Research requests and questions found mid-run split the same way.

  The same split is available for your opening request, for a research request
  with several needs, and for a many-sided decision question that only turns up
  partway through the work. Every one of them comes to you through the same
  approval step, and you can see whether a split came from your own request or
  was found along the way.
