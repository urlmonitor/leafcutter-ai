id: TQ-600a-8
components:
  - testing_quality
  - build_pipeline
title: "No test still deploys its own copy merely to read it, and one that does is named and fails the examination"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the suite as it stands, in which tests obtain a deployed copy of the package by
    running a deploy of their own — 77 such invocation sites across 52 test files when
    this was measured on 2026-09-21 — and the shared reference layout of TQ-600a-1,
    which a test that only reads a deployed copy can consume instead,
  When every test that obtains a deployed copy of the package is examined,
  Then each such test is found either to consume the shared reference layout, or to
    carry at the test itself the declaration of TQ-600a-5 saying it must have a copy of
    its own,
    And every test that still runs a deploy of its own while carrying no such
      declaration is named, together with the site at which it runs it, and the
      examination reports a failure rather than a note,
    And the examination reports how many tests it inspected, and separately how many of
      those consume the shared layout and how many keep a copy of their own, so an
      examination that inspected nothing is distinguishable from one that found nothing,
      and a migration that reached its end by declaring every test a mutator is visible
      in those two figures rather than presenting as a clean report,
    And when a test that runs its own deploy without declaring why is deliberately
      introduced into the examined population, the examination names it and fails,
    And the examination is one of the checks a change to this repository must pass, so a
      test added later that runs its own deploy without declaring why is refused when it
      is added rather than found by a measurement months afterwards.
depends_on:
  - TQ-600a
  - TQ-600a-1
  - TQ-600a-5
doc_links:
  - path: CLAUDE.md
    relationship: describes
    status: exists
    relevance: >-
      Carries the standing rule "Tests must not spawn their own build.py — reuse a
      shared deployed layout", which states the read-only reuse obligation as a
      prohibition on NEW sites. A prohibition binds the next author and says nothing
      about the 77 sites already there; this AC is the half that moves the existing
      population, and it is the reason the rule's promise is redeemed rather than
      merely repeated.
  - path: docs/acceptance-criteria/testing-quality/TQ-600-suite-feedback-latency/TQ-600b-2.yaml
    relationship: related
    status: exists
    relevance: >-
      THE SHAPE THIS AC COPIES, DELIBERATELY AND ALMOST CLAUSE FOR CLAUSE. TQ-600b-2
      ratchets over the suite's EXISTING population of scratch-path offenders: it names
      each one, fails rather than notes, and states its inspected count. It cannot be
      closed while an offender remains. Before this record the a-branch had no
      equivalent, which is precisely why every a-branch leaf could be satisfied with
      the 77 sites untouched.
  - path: docs/acceptance-criteria/testing-quality/TQ-600-suite-feedback-latency/TQ-600.yaml
    relationship: related
    status: exists
    relevance: >-
      Holds the measured evidence the Given quotes: 77 `--target-dir` invocation sites
      across 52 test files, one deploy measured at 59.8s, 63% of a 1:29:47 run
      concentrated in 60 of 5318 tests. Note the caveat recorded there — 77 counts
      SITES, not invocations, so no clause here asserts a per-run deploy figure.
  - path: docs/acceptance-criteria/testing-quality/TQ-600-suite-feedback-latency/TQ-600a-5.yaml
    relationship: related
    status: exists
    relevance: >-
      Owns the per-test declaration this examination reads, and owns the deliberate
      decision that an UNDECLARED test is routed safely and named rather than refused
      at run time. That decision is about the running test; this AC is about the
      repository. The two are compatible and must both hold: an undeclared test still
      runs and still passes, and the examination still fails until it is declared or
      moved.
  - path: templates/scripts/commit_guardian/commit_guardian.json
    relationship: related
    status: exists
    relevance: >-
      NAMED IN it_requirement 1 AS THE FILE NOT TO EDIT, and declared here at a
      non-edit-surface relationship so it is suppressed from the generated ticket's
      files_touched rather than read as an instruction. Adding an entry here makes
      this a package surface and triggers ACS-100i-8's refusal; see it_requirement 1
      for the decision and the escape route.
  - path: scripts/build_phases.py
    relationship: related
    status: exists
    relevance: >-
      Named in it_requirement 1 only as part of the escape route that applies IF a
      later pass reverses the not-a-hook decision — a hook's helper modules must be
      added to the deploy map here or the deployed hook raises ModuleNotFoundError.
      Not an edit surface for this AC as scoped, and declared at a non-edit-surface
      relationship so it is suppressed from files_touched.
  - path: config/ac_store_schema.json
    relationship: related
    status: exists
    relevance: >-
      Named in it_requirement 1 only to explain why a package-surface declaration
