notes: |
  Amendment provenance (2026-08-24): amended in place, not superseded, per
  docs/how-to/ac-traceability-store.md.

  PRE-EXISTING GAP, RECORDED NOT ERASED — the "minimal ticket file". The original
  criteria listed a "minimal ticket file" among the staged files. No version of
  /quick-fix ever wrote one: neither the previous in-place workflow nor the
  current templates/skills/quick-fix/SKILL.md and
  templates/workflows-js/quick-fix.js create, stage, or reference a ticket file
  at any phase. The current skill states its scope boundary explicitly — "this
  skill does not create tickets or epics" — and the JS workflow contains no
  ticket path at all. So this clause was never satisfied and was never going to
  be; it was specified and silently dropped at build time, and this record
  asserted it for the whole interval it was marked done. It is removed here
  because a criterion no implementation has ever met is not evidence of
  anything, but the removal must not read as the requirement having been met.
  The same clause appeared on BP-600d-4 and BP-600d-4-i and was removed from
  both on the same date, with the same note. If a ticket artifact is genuinely
  wanted from /quick-fix, that is new scope and needs its own AC — it is not
  recoverable by reinstating this clause.

  Note also that the workflow now produces a SECOND commit after this one, for
  the changelog entry (a required status check). That commit is out of scope
  here; this criterion governs the fix commit only.

  ==========================================================================
  WHY THE 2026-08-25 RESTATEMENT WAS NEEDED, AND WHAT IS STILL TRUE.
  ==========================================================================
  This record is work_status: done, so its criteria are a committed assertion
  about the system. One clause asserted a DEFECT as settled fact — that the AC
  guardian hooks never read the store — and hung the staging requirement off it
  with a "because". Two problems follow from that shape, and only the second is
  hypothetical:

    1. A done record now carries a bug report inside its acceptance criteria.
       The moment the hooks are repaired, this record is false and someone has to
       decide whether the requirement it states survives. Written as it was, the
       obvious reading is that it does not — the reason for staging the parent
       having gone away.
    2. The requirement DOES survive, and for the opposite reason. A hook that
       resolved the parent from the store would find the stale covered_by this
       workflow would otherwise leave behind, and would block the commit. Under
       the current hooks, not staging the parent is invisible; under repaired
       hooks it is fatal. Staging the parent is correct either way, and now says
       so without depending on which regime is in force.

  STILL TRUE AS OF 2026-08-25, VERIFIED, NOT ASSUMED: the hooks are not repaired.
  KI-CG-001 is open with two recorded occurrences, and KI-CG-012 records a third
  mechanism by which check-ac-schema exits 0 having validated nothing. The
  CLAUDE.md workaround ("AC-store commits — stage the parent alongside the child")
  is still the correct instruction and must not be removed.

  WHAT THE 2026-08-25 AC WORK DOES AND DOES NOT COVER — read this before assuming
  the defect is being fixed. ACS-1100b-4 and ACS-1100d-5 were authored the same
  day against the same known issue, but neither makes a hook read the store:
    - ACS-1100b-4 says a scoped check may not exclude the records it did not
      examine on the ground that they pre-date the rule; it must declare its scope
      and report both totals. That constrains what a diff-scoped hook may CLAIM.
    - ACS-1100d-5 says a requirement claiming a population may not be closed on a
      verdict narrower than the claim. That constrains what may be CONCLUDED.
    - ACS-200h owns a whole-store re-check on the protected branch and is honestly
      open (work_status todo, covered_by empty), deliberately unbuilt until the
      store is reconciled.
  NO RECORD ANYWHERE REQUIRES AN AC HOOK TO RESOLVE A PARENT FROM THE STORE WHEN
  THE PARENT IS UNSTAGED. That is the half of KI-CG-001's fix direction with no
  acceptance criterion behind it, and it is unowned as of 2026-08-25. Until one
  exists and is built, this criterion's staging requirement is the only thing
  standing between /quick-fix and a stale back-link.
