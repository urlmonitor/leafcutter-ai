title: "A failed product-truth stage commit aborts the phase before the next agent runs"
component: ux-prototyping
level: L3
status: active
readiness: approved
priority: medium
req_status: approved
work_status: done
criteria: |
  Given an approved product-truth stage is being committed,
  When the commit fails (pre-commit hook rejection, index conflict, or git error),
  Then the workflow aborts with an error identifying the failed stage,
  And the next product-truth agent is never dispatched,
  And the already-drafted files remain on disk,
  And no pull request is opened.
