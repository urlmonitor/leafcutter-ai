notes: |
  DECIDED 2026-09-17 (user) -- AUTO-MODE DISPATCH GAP: REFUSE THAT DISPATCH. Q1 treats a
  dispatched commit specialist as approved by its dispatching run. Unqualified, that let a
  top-level session in auto-accept or bypass-permissions -- refused its own commit by GE-129d-2 --
  dispatch the specialist and commit with no person involved. The user chose to refuse that
  dispatch. Unattended workflow runs (fast lane, ticket-supervisor, finalize-feature) are not
  affected and still commit through the commit specialist (GE-129c). Rejected alternative:
  accepting the dispatch with GE-129c-3's audit record as the only control.

  WHY AN L3 UNDER GE-129d-2. It is that refusal's bypass: the mutation "refuse the session's own
  commit, let its dispatch through" passes GE-129d-2 and fails here. A sibling L2 under GE-129d
  would restate GE-129d-2's mode set; L3s are uncapped.

  THE DISCRIMINATOR. Harness-supplied identity/context only, as recorded by GE-129a-1's third
  scenario. The second scenario pins that a prompt, ticket path, environment variable or command
  text claiming a workflow run changes nothing -- the same caller-mintable signals GE-129a-3
  rules out for identity.

  FAIL CLOSED, HONESTLY. The fourth scenario is the user's rule for an indistinguishable probe
  result. Refusing the session's dispatch then refuses a workflow run's dispatch in that mode too
  (the guard cannot tell them apart), which collides with "workflow runs are not affected". The
  record does not choose a way out; it refuses and returns the finding to the user.

  SUBAGENT HOP. A session that dispatches python-coder which dispatches the commit specialist is
  the same path one level down (probe case (4)); it is refused alike.

  UNKNOWN MODE refused, as in GE-129d-2's third scenario.

  WHERE THE REFUSAL SITS (at the dispatch, or at the specialist's commit call) is the IT PO's.

  declares_side_effect: false -- the Then clauses assert refusal, absence of a commit, and a
  finding returned; nothing durable is asserted.
