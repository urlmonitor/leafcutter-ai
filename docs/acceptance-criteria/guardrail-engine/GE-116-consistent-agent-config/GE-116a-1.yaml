id: GE-116a-1
components:
  - commit_guardian
title: "Verification-required agent with no edit ability is blocked at commit"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
assigned_agent: python-coder
estimated_complexity: M
criteria: |
  Given a staged agent definition whose settings declare that it must verify
    the changes it makes (requires_verification is true),
  And that agent's declared abilities include neither the ability to edit files
    nor the ability to create files (tools lists only read-and-inspect abilities
    such as Read and Bash),
  When the commit is attempted,
  Then the commit is blocked fail-closed,
  And the block is reported as a failure of the consistency guard,
  And the offending agent definition is not committed.
depends_on:
  - GE-116a
doc_links:
  - path: "docs/how-to/managing-pre-commit-hooks.md"
    relationship: related
    status: exists
  - path: "docs/pre-commit-hooks.md"
    relationship: describes
    status: exists
delivers_to:
  agent: documentation-expert
  contract: "New commit_guardian hook check_agent_verification_consistency (source at templates/scripts/commit_guardian/hooks/, mirroring check_agent_spawn_consistency.py) that scans STAGED templates/agents/*.md and exits non-zero fail-closed when frontmatter has requires_verification: true AND tools contains neither Edit nor Write. Delivers the guard rule, the fail-closed block behavior, and the block message that GE-116a-6 documents."
expects_from: null
it_requirements:
  - "Mirror the existing sibling guard templates/scripts/commit_guardian/hooks/check_agent_spawn_consistency.py: same module structure, staged-file scan (git diff --cached), run_hook.py invocation, and non-zero-exit fail-closed convention. Place the new script in the hooks/ subdirectory alongside it (not the commit_guardian/ root)."
  - "Fail CLOSED only on a clearly-detected contradiction (requires_verification: true AND tools lacks both Edit and Write): exit non-zero so the commit is blocked; any consistent or non-target staged set must exit 0."
  - "Scope the scan to STAGED templates/agents/*.md by file identity only; never full-tree scan and never content-grep unrelated files."
  - "Must complete within the interactive pre-commit budget (well under 1s for a typical staged set) so it does not slow commits."
  - "Follow the project error-handling policy: wrap file/git I/O in typed try/except and log at WARNING or higher; the fail-open parse path (GE-116a-1-iii) must never let an exception propagate out of the hook."
test_spec:
  - name: test_blocks_when_requires_verification_true_and_no_edit_or_write
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Staged agent template with requires_verification: true and tools of only Read/Bash → hook exits non-zero (commit blocked fail-closed)."
  - name: test_block_reported_as_verification_consistency_guard_failure
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "The non-zero exit / message identifies the failure as the agent-verification consistency guard and the offending definition is not committed."
