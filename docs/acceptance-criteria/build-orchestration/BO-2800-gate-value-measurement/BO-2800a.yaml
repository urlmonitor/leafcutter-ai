criteria: |
  The completion records you already keep become usable evidence.

  Thousands of structured completion records are already stored with every piece
  of finished work — what passed, what did not, and what was done about it — and
  nothing has ever read them. This turns that existing history into the first
  measurement of what your checks are actually catching, without waiting to
  collect anything new.
