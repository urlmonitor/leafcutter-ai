id: INF-600a-1
title: "Registry declares every skill an agent invokes, with invocation mode"
component: infrastructure
level: L2
status: active
work_status: todo
criteria: |
  Given an agent registry entry for an agent that invokes skills
    (e.g. python-coder, which invokes signoff, doc-enforcer,
     complexity-reduction, and collector-enforcer)
  When the registry entry is read by the card generator
  Then the entry contains a `skills_invoked` array
  And each element in the array has fields:
    - `skill_id` (string matching a skill directory name)
    - `mode` (enum: "always" | "conditional")
    - `condition` (string, required when mode is "conditional",
       describes when the skill is invoked, e.g. "paths under collector/")
  And the array includes every skill the agent references in its
    template body, not only skills declared in the current `skills_used` field
  And the existing `skills_used` field is retained as an alias
    for backward compatibility but is no longer the sole source of truth
depends_on:
  - INF-600i
