  - "Update the frontmatter last_updated, keep the document inside the project's doc-length gate, and keep any links relative and resolvable."
  - "SEARCH ARM SCOPE: shipped instruction surfaces only, meaning templates/agents/, templates/skills/ and the command and workflow prompt templates. Dated history (retrospectives, known issues, changelogs, AC records) is excluded. At enrichment time no shipped prompt names the token; only check_feedback_id.py does, and GE-123e-2 cleans it. So no prompt edit is expected. If one is found, editing that prompt is llm-expert work and needs its own record."
