title: "A failed mixed run leaves no half-state behind for the next run to inherit"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a mixed group whose run failed part way, with some members produced and one not,
  When the backlog is inspected after that run has ended,
  Then no member of that group is marked finished,
  And no member of that group is left marked as being worked on,
  And a later run resolving the same group sees the same group, in the same state, as
    the failed run saw when it started.

  Given the same group,
  When the later run builds it and every member is produced,
  Then that run succeeds — the earlier failure left nothing behind that prevents the
    group from being built again.
depends_on: [BO-3500b-2]
doc_links:
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
    relevance: "Where the claim-and-release behaviour of a run is described. A run that fails between claiming and releasing is the mechanism by which a half-state persists."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "THE MECHANISM IS claim_build_set / release_claim IN scripts/build_orchestration/fast_lane.py, and the half-state is a run that dies between the two. Release must be GUARANTEED on every exit path — a try/finally or equivalent around the whole group, not a release call on the happy path plus one in an except block that a later branch can skip past."
  - "A mixed run has more places to die than a code-only run, because it dispatches more crafts, and the crafts producing pages, diagrams and screens have the least exercised failure paths. Test the crash path, not only the clean-failure path: kill the run between two members' phases and assert the claims are still released."
  - "ASSERT ON THE STORE AS BYTES. Snapshot every member's YAML before the run and compare after; that single assertion covers work_status, an in-progress marker and any incidental field the failure path might have written."
  - "THE SECOND SCENARIO IS THE ONLY ONE THAT CANNOT BE FAKED BY TIDYING. The first is satisfied by a run that cleans up and also blocks the group some other way (a stale lock file, a leftover worktree, a cached verdict). Assert the RETRY SUCCEEDS, in the same test, by running twice."
  - "filter_already_claimed must not treat a released claim as still held; if a claim ledger exists outside the AC records, it is part of the state that must be restored."
  - "NO PRESENCE-ONLY ASSERTIONS. Both scenarios execute runs and read the store from disk."
