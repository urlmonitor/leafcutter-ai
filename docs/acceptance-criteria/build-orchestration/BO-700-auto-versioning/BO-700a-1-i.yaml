title: "Ticket completed without a source_ac produces a placeholder entry"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket file has been driven to completion
    and the ticket frontmatter does NOT contain a source_ac field
    (e.g., a legacy ticket or a manually-created ticket),
  When the changelog emission step runs for this ticket,
  Then a changelog entry is still produced
  And the entry heading is the ticket's frontmatter title field
  And the entry contains a note: "No AC lineage -- entry derived from ticket metadata"
  And the component field is taken from the ticket's component frontmatter
    (or "unspecified" if absent)
  And no error is raised during emission.
