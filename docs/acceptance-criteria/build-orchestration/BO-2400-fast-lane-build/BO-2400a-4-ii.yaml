id: BO-2400a-4-ii
components:
  - build_orchestration
  - testing_quality
title: "The green gate runs the batch's tests with failure-masking switched off, so a failing test is seen as failing"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a batch containing BO-2600b-4, whose work_status is todo for the whole run,
    with 13 newly-added covering tests of which 3 fail on an assertion because their
    fixtures build the wrong store shape and 10 pass,
  And the repository's acceptance-criterion test-enforcement plugin, left at its
    default, reports a failing test as xfailed whenever the criterion that test covers
    is not yet done,
  When the green gate runs the batch's scoped tests after the coder reports ok,
  Then the scoped tests are run with the plugin's downgrading switched off for that run,
    so each of the 3 failing tests is reported as failed, not xfailed,
  And the green verdict is not green, and its failing-test list names those 3 tests,
    each with BO-2600b-4,
  And commit staging is not performed and the run stops at the green gate, before the
    pre-commit review, the commit phase and the mark-done step run.

  Given the same 13 tests after the 3 fixtures are corrected,
  When the green gate runs again,
  Then all 13 are reported passed and the green verdict is green.

  Given the same tree,
  When the green gate is run once with BO-2600b-4 at work_status todo and once with it
    at work_status done,
  Then both runs produce the same verdict and the same failing-test list — a
    criterion's recorded progress has no influence on whether its tests count as
    passing at the green gate.
depends_on: [BO-2400a-4]
