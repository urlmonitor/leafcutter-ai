notes: |
  THIS IS THE ROUTER. The other four children of TQ-200c make the routing decision
  expressible (c-1), simultaneous (c-3), landable (c-4) and honest (c-5). This one is
  the decision itself.

  WHY "APPEND llm-expert TO THE FROZENSET" CANNOT SATISFY THIS AC — THE THREE CLAUSES
  THAT KILL IT, IN ORDER.
    - The second clause (unanticipated producer). A frozenset with one more name in
      it answers correctly for llm-expert and wrongly for the next producer kind
      anyone adds. The clause requires the answer to be correct for a producer that
      is in no enumeration the decision consults AND whose introduction changes no
      enumeration — which is unsatisfiable by any list, however long. It is testable
      exactly the way BO-2900g-1's third-route clause is: introduce a new producer
      kind in the test, do not tell the decision about it, and assert the demand is
      still right.
    - The third clause (rename invariance). If two identically-described pieces of
      work get different demands because their producers are named differently, the
      decision is keyed on identity. A set-membership test is keyed on identity by
      construction, so it fails this clause even when its contents are complete.
    - The fourth clause (no free pass by absence). Today's "no proof required" is
      arrived at purely by the producer's name failing a membership test — the
      generator then records `PASS  non-code AC — no test contract required` at
      line 2773. This clause states that "no proof required" must be reachable only
      from something the WORK says. Extending the list narrows the set of work that
      gets the free pass; it leaves the mechanism that grants it untouched.
  In short: the frozenset is the most visible symptom, not the disease. See the next
  section for why the disease is one level up from where the request located it.

  THE PREMISE CORRECTION THAT SHARPENS THIS AC (verified 2026-08-18, read the files).
  The authoring request stated that no agent declares `produces`, so the registry
  lookup cannot override the fallback frozenset. That is false in this worktree.
  `produces` is populated across config/agent_registry.json — production_code,
  test_artifact, documentation, review_verdict, orchestration, analysis, prompt —
  and llm-expert declares `produces: "prompt"` (line 3127, entry at line 3044). The
  frozenset at generate_ticket_from_ac.py:1073 is only reached when the registry
  cannot be loaded (line 1092 and line 1097). The live defect is therefore at
  line 684: `_load_production_code_agents` collapses that seven-value
  self-description into one set — everything that is not `production_code` is
  discarded, so `prompt` is handled exactly like `orchestration`. The material a
  correct routing decision needs is ALREADY ON DISK and is being thrown away at the
  point of use. This is good news for the AC and bad news for a cosmetic fix: the
  criteria are written against derivation from self-description precisely because
  self-description already partly exists, so "we cannot derive it, there is nothing
  to derive from" is not available as an argument.

  WHAT "WHAT THE WORK SAYS ABOUT ITSELF" DELIBERATELY DOES NOT PIN DOWN. The criteria
  do not name the fields. Whether the derivation reads the registry's `produces`, the
  requirement's own change_target / risk_surface, the surfaces the work touches, or
  some combination, is the it-po's decision, and a good implementation will probably
  use more than one. What the criteria fix is the PROPERTY that separates a real
  router from a lookup table: the answer must survive a producer nobody anticipated
  and must not move when a producer is renamed. Any mechanism with those two
  properties is acceptable; no mechanism without them is, whatever it is built from.

  DERIVED, NOT HAND-DECLARED PER AC — AND WHY THAT IS IN THE FIRST CLAUSE. An
  alternative "fix" is to add a per-requirement field where the author states which
  layers of proof this one needs. That is rejected by the first clause ("derived from
  what the work and its producer already declare"). Hand-declaration reproduces the
  present failure with extra steps: 444 llm-expert requirements would each need an
  author to remember, and the 39 already-done ACs with 85 unwritten named tests are
  the evidence of what happens when the demand depends on someone remembering. Note
  the distinction from c-1: c-1 lets an author STATE a proof's kind, which stays
  legitimate and necessary. What this clause forbids is the ROUTING DECISION — which
  kinds are required at all — being a per-requirement declaration.

  DEPENDENCY REASONING.
    - depends_on TQ-200c-1 is load-bearing and non-negotiable: a router can only emit
      requests the vocabulary can express. Built against today's vocabulary, the only
      demand this decision could produce is "unittest or pytest, or nothing", so it
      would be forced to re-implement the binary it exists to remove. This is the one
      internal edge in the tree that is a hard ordering constraint rather than a
      preference.
    - No edge to c-3, c-4 or c-5. c-3 constrains the SHAPE of an answer that names two
      layers, c-4 constrains where a judged answer LANDS, c-5 constrains what happens
      when an answer cannot be HONOURED. None of them is an input to the decision, and
      all three are testable against a hand-declared routing answer. Sequencing them
      behind this AC would create a four-deep chain with no technical need. Recorded
      so the it-po does not add the edges on aesthetic grounds.

  BOUNDARY. This AC settles WHICH KINDS OF PROOF ARE ASKED FOR. It says nothing about
  whether the proof is any good, produces no verdict, gate or done-state consequence,
  and nothing it emits may be offered as evidence that any work has been proved. It
  also does not enumerate agents — TQ-200a-1 owns which agents get eval sets — and it
  must not be satisfied by an implementation that simply routes every llm-expert AC to
  an eval, which TQ-200c-2-i forbids.
