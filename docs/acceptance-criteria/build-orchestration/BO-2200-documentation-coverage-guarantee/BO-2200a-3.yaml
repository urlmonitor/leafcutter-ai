work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-2200-documentation-coverage-guarantee/BO-2200a.yaml"
criteria: |
  Given the declarative `documentation_gates` policy and the ticket generator building
    the agents map for a leaf AC,
  When the AC's `change_target` is `code` and its `risk_surface` is `internal`,
  Then the generated agents map does NOT include `documentation-expert`.
  And the same negative result holds for `change_target` values `config`, `prompt`, and
    `infrastructure` when paired with `risk_surface` `internal`.
  And no documentation demand is raised for these purely internal refactors, so the
    build imposes no documentation busywork on changes with nothing observable to document.
depends_on: [BO-2200a, BO-2200a-1]
doc_links:
