notes: |
  Cut by WHAT ACTUALLY DIFFERS, per the PO's instruction not to write one L2
  per file type as a matter of course. Two things differ and only two: the
  comment syntax (JS block vs HTML comment) and where "the top of the file" is
  in a single-file component. Everything else — the "@ac" marker, the list
  shape, the separators — is GE-124a-1 and is identical across all five.

  `.html` is included because the L0 scope names HTML alongside the four
  frameworks. The mock-data artifact's `framework` enum carries only the four
  it had records for (react-tsx / react-jsx / vue-sfc / svelte); `html` is a
  fifth value this AC adds. Flagged rather than silently assumed — if the IT PO
  or the user wants HTML out of scope, this is the one place to remove it.

  The SFC placement rule ("above the first block tag") is the answer to the
  PO's "where is the top of the file in a single-file component" question. Its
  negative — a declaration written lower down — is GE-124a-2-i.

  IT-PO NOTE (2026-08-25) — HTML CONFIRMED AS A GAP, NOT AN ASSUMPTION. The
  mock artifact's `framework` field description now lists html as a fifth enum
  value, but its ten FrontendComponent records contain no .html file. The
  implementer therefore has a declared enum value with no worked example. That
  is recorded in it_requirements rather than papered over; the .html fixtures
  are purpose-written for the test contract.
