criteria: |
  Given the new model has not yet been proven on the self-host project (no recorded
    full self-host epic driven end-to-end thin + AC-side sign-off),
  When a consumer cutover to the new model is attempted,
  Then the cutover is blocked;
  And once a completed self-host epic is on record, the dogfood precondition for
    consumer cutover is satisfied.
