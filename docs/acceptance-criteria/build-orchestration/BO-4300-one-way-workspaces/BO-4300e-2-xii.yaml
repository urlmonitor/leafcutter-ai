id: BO-4300e-2-xii
title: "A folder that lost its workspace record but still holds a piece of this project's repository is treated as half-cleared"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a project "shop" whose landing place holds the folder "ac/omega" with no
    workspace record, whose repository is gone except one leftover file inside
    the repository folder that names shop's shared project as the place it last
    fetched from, and which still holds the files "CLAUDE.md" and "README.md",
  And, in a second run, the same folder "ac/omega" whose one leftover
    repository file names a different shared project "blog-hub",
  And, in a third run, the same folder "ac/omega" with no workspace record, no
    repository folder at all, and the files "CLAUDE.md" and "README.md",
  When clearing "ac/omega" is requested in each run with no authorisation to
    lose work,
  Then in the first run the request is refused, stating that the workspace was
    half-cleared and that its remaining files cannot be checked against the
    shared project, the refusal lists "CLAUDE.md" and "README.md" by path and
    returns a one-time token bound to that folder and exactly those two files,
    and the request is not answered "not found",
  And in the first run, clearing again with that token is answered cleared, the
    answer lists both files as discarded, and nothing of "ac/omega" remains at
    its location,
  And in the second and third runs the request is answered "not found" with the
    two files listed and no token, and "ac/omega" is identical before and after,
  And in the second and third runs, a repeated request carrying the token from
    the first run is refused the same way and "ac/omega" is identical before and
    after.
depends_on: [BO-4300e-2, BO-4300e-2-iii, BO-4300e-2-v, BO-4300e-2-vi, BO-4300e-3-i]
