estimated_complexity: M
it_requirements:
  - >-
    THE REAL STORE IS THE INPUT, AND THIS IS THE WHOLE POINT. A hand-authored fixture
    contains none of the four named classes, because an author who knew to put them
    there would not need the comparison. Enumerate the real store. The repository's
    own precedent is the files_touched parser that stayed a no-op through seven green
    sign-offs because every fixture reproduced the author's indentation bias.
  - >-
    DUPLICATE KEYS ARE THE LIKELIEST REAL DIVERGENCE and the cheapest to construct.
    The pure-Python safe parser silently keeps the last value for a duplicate mapping
    key; the C-backed one has its own handling. Do not assume which wins — observe
    it, record what was observed in the test's own docstring, and let the comparison
    decide.
  - >-
    EQUALITY IS DEEP AND TYPE-SENSITIVE. `==` on two nested dicts compares values but
    treats `1` and `True` as equal and `1` and `1.0` as equal. Where a type
    difference would matter to a downstream reader — a date object versus a string is
    the live case in this store, since `created` is accepted in both forms — compare
    types alongside values. A comparison that cannot see a str/date divergence is
    blind to the exact class of difference this record exists to find.
  - >-
    BUDGET: ABOUT 27 SECONDS. One pure-Python sweep (about 25 s) plus one C sweep
    (about 2 s). That is acceptable for a standing guard but it is 27 s on every
    full run, so keep it to ONE test, not one per class, and do not let it sweep the
    store more than twice.
  - >-
    REPORT THE EXAMINED COUNT IN THE FAILURE MESSAGE TOO, not only on success. A
    disagreement message that names the record and the differing field is what makes
    this debuggable; "objects differ" over 4,635 records is not.
  - >-
    DO NOT ADD THE FOUR CLASSES AS PERMANENT STORE RECORDS. If the real store lacks
    an instance of a class, add it to the COMPARED SET in the test's own fixture
    space. Adding a duplicate-key or merge-key record under docs/acceptance-criteria/
    would trip the schema hooks and corrupt the store this change exists to read.
