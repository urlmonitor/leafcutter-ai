notes: |
  ORIGIN (2026-09-27, user-directed /plan-feature run, BA stage). Four ACD-2500 ACs
  (ACD-2500a-3, ACD-2500c-1-i, ACD-2500d-1, ACD-2500d-5-i) were held at readiness: reviewed
  at the final gate pending "a declared-files schema AC (AC-level list of files a piece of
  work changes, with a to-be-created marker)". This is that AC; they now list it in depends_on.

  PLACEMENT. Under ACD-1600c ("buildable means complete -- concrete files to change and a
  test to satisfy") because this is the concrete-files half of that promise, made explicit
  and declarable. No ac-store L1 is about the files a piece of work changes: ACS-100a and
  ACS-100i are both at their overridden caps, and ACS-1500 is about the covered_by relation,
  not files. ACD-1600g (the "what to leave alone" boundary) is the negative-space twin and
  is at its 5-L2 cap; its notes call ACD-1600c the half that names the files to change.

  CONSUMERS (same run, user-approved follow-ups): the ticket generator reads this list for
  files_touched (TKT-600a-3; its fallback for the 'no declared files' state is TKT-600a-3-i),
  and the readiness gate's "missing file targets" reason is keyed on it (ACD-1600c-1, -2 and
  -3 amended 2026-09-27; hold-reason list note in ACD-2500b-2).

  MIGRATION POSTURE (ADR-026): the list is optional; a record without one is in the named
  state 'no declared files' (ACD-1600c-4-ii), never silently back-filled from doc_links.
  Contract is expressed in behavioural terms here; the field name and schema shape are the
  IT PO's to fix. The existing doc_links `status: planned` value is not a substitute for
  the to-be-created marker: it describes documentation that is planned, not a file the work
  creates.

  IT-PO ENRICHMENT (2026-09-27). Field name `declared_files`, not a reuse of `files_touched`:
  the ticket key of that name is today the OUTPUT of the doc_links/prose derivation this AC
  retires, it is a flat list of strings with no marker, and reusing it would let a reader
  mistake a derived ticket surface for a declared one. `declared_files` is also the key the
  file-aware pre-pass report (ACD-2500d-5-i) already uses. Marker key `state`, values
  `existing` / `to_be_created` (the criteria's own words "marked existing" / "marked to be
  created"); the pre-pass report's observed values ('exists' / 'to_be_created' / 'neither')
  are a separate vocabulary on purpose. The load-bearing enforcement point is the
  check-ac-schema commit hook (including its manual fallback); the JSON schema alone would
  block nothing when jsonschema is unavailable. No dependency on ACD-1900a is needed for the
  field itself -- this AC lands its own optional property -- but ACD-1600c-1's
  grandfathering reads schema_version, which ACD-1900a has not landed; until it does, every
  record reads as schema_version 1.
