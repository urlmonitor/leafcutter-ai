    reason: "TECHNICAL ENRICHMENT ONLY — criteria, title, level, depends_on, covered_by, declares_side_effect, change_target, risk_surface, test_required, test_rationale and notes are untouched. Added assigned_agent, estimated_complexity, it_requirements, delivers_to, expects_from, test_spec, one doc_link, and readiness draft -> reviewed. THREE THINGS THE BA COULD NOT SEE AND THIS PASS ADDS. (1) THE RECORD SPANS TWO FILES. The family's convention is a JS half and a Python half in separate records; this one cannot be split that way, because a value the lane compares against must originate where the bytes originate — so scripts/injection_builders.py must state a byte count and a digest over the exact stdout it wrote, on a channel that is not stdout, and templates/workflows-js/fast-lane-ship.js must carry, compare and act on it. n_location_rule counts only the three JS sites; the Python site is named in the constraints. (2) THE INDEPENDENCE REQUIREMENT NEEDED A MECHANISM-LEVEL STATEMENT, not just a property: the stated value must be read from a reply field distinct from the bundle text, must never be recomputed by the lane over the received text, and must never be computed by the TRANSPORTING agent over the text it is about to send — that last shape travels through the same mangling and agrees with it, and it is the plausible-looking way to get this wrong. Paired with it: the stated value must be encoded so the observed corruption cannot touch it (hex survives HTML escaping; a value containing '<' or '&' does not). (3) THE MARKER-RETIREMENT ORDERING, recorded in the constraint named 'PRECONDITION FOR RETIRING THE CACHE FRAMING' and echoed as a doc_link to docs/reference/fast-lane-prompt-caching.md. The lane's only integrity signal today is the CACHE_BREAKPOINT_MARKER check, which detects corruption only by accident of the marker containing '<' — while the caching it exists to serve is demonstrably fictional here. Deleting the marker before this record ships removes the only thing preventing a green run on a mangled prompt. The constraint carries the marker literal so a grep run ahead of that deletion lands on it. NOT CHANGED, DELIBERATELY: implemented_by stays empty. In this family it is a back-reference populated at done (BO-2400c-1-iii and -vi carry it and are both work_status: done); pre-filling it on a todo record would assert an implementation that does not exist."
