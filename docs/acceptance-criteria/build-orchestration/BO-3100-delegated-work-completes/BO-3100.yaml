roadmap_phase: phase_1
criteria: |
  A step that never ran can never be counted as one that passed.

  When you hand work to this system, it breaks that work into steps and gives
  each one to a specialist. Today a specialist can quietly end without doing
  anything, and because it ended calmly rather than with an error, the step is
  recorded as finished. Whole stretches of a build can therefore be reported as
  complete when nothing happened at all.

  This goal removes that possibility. A step that produced nothing is recognised
  as a step that produced nothing — from evidence of what actually changed, never
  from the specialist's own account of itself — and it is retried or surfaced,
  never counted. The arrangement of the work is changed so that the silent
  disappearance becomes impossible rather than merely detectable, and so it stays
  impossible as the underlying tools change.
