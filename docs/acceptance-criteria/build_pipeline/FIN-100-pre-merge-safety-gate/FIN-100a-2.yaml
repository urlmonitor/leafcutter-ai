    by: business-analyst
    entry: >-
      2026-08-17. This AC is the store-resident side B of the conflict with BP-300e-4. The
      in-source comment at templates/workflows-js/finalize-feature.js:841-846 cites "AC-4",
      which is a ticket-body-local label — AC-4 of
      tickets/99_done/EPIC-FinalizeFeatureHardening-2/09_finalize_p2_hygiene.md, delivered
      in commit e76e7fcbd, a ticket that predates AC-store-first authoring and carries no
      ac_coverage mapping. This AC's it_requirements carry the same requirement for the same
      site. The adjudication UPHELD the behaviour: option (b), superseding this AC so the
      baseline site halts too, was rejected because a null baseline already forces triage to
      treat every post-merge failure as a regression (FIN-100c-3), which is the conservative
      direction, so halting would cost availability and buy no safety. criteria are therefore
      UNCHANGED and this AC is NOT superseded. What changed is the fourth it_requirement
      bullet, which now states that the degradation must be a declared register entry rather
      than a bare catch, per the amended BP-300e-4. work_status (done) untouched — the
      required behaviour at this site is unchanged; the register wiring is BP-300e-4 /
      BP-300e-4-ii work, not a reopening of this AC. Grounds are recorded in BP-300e-4 notes.
