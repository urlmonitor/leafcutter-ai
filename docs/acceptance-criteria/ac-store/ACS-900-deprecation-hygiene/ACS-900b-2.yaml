notes: |
  Wiring AC. The block decision (ACS-900b-1) is useless unless the hook is
  registered; this AC pins the commit_guardian.json hooks_manifest entry and
  the AC-store-scoped files pattern, consistent with check-ac-governance and
  check-ac-schema entries already in the manifest.

  IT-PO enrichment (2026-06-22): clarified the load-bearing deploy-path fact —
  the manifest's canonical source is templates/commit-guardian/commit_guardian.json
  (config/commit_guardian.json is a build output), and the hook script's source is
  templates/commit-guardian/. Pinned the exact entry key shape incl. tier:'judgment'
  matching the package-managed siblings, and the build.py drift-guard verification
  (ADR-001 + BO-1400 fresh-install reachability). The criteria's reference to
  config/commit_guardian.json is preserved verbatim (consumer-facing view).
change_target: config
risk_surface: internal
