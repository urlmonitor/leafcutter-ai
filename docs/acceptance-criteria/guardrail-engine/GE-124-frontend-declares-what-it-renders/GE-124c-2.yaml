notes: |
  VERDICT 2 of four. The PO's reasoning, carried verbatim in intent: "you did
  not say" and "what you said is not true" are different mistakes with different
  fixes, and a reviewer who is told the wrong one wastes the whole remediation.
  This is the same distinction GE-117 draws between missing and invalid.

  BOTH SURFACES ARE VALIDATED — the second scenario exists because the element
  pin is optional but, per GE-124b, always validated when present. A check that
  resolved only the component-level ids would let a typo in a pin ship silently,
  and the pin is the surface a test selector is derived from (GE-124f-3), so the
  typo would surface later as a selector that matches nothing.

  Which resolver answers the question is GE-124c-2-i, and it is not a free
  choice.

  IT-PO ENRICHMENT NOTE (2026-08-25), verified in the working tree. The "shared
  resolver" named across this tree exists as a FILE but not as a shared
  ID-RESOLUTION SERVICE: scripts/ac_store/ac_coverage_resolver.py resolves
  TICKETS to their AC coverage and exposes no id-to-record function. The id
  index that actually exists is scripts/commit_guardian/_ac_store_index.py
  (get_ac_index, fingerprint-cached). The work implied by GE-124c-2-i is
  therefore: add a public entry point to ac_coverage_resolver.py over
  _ac_store_index, then migrate GE-111 and GE-117 onto it. That is real work
  and it is larger than "call the existing resolver".
