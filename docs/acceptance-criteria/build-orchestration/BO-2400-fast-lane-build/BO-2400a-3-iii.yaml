change_target: pipeline
risk_surface: internal
notes: |
  This is the exact shape of the live BO-2400g-1 halt: part of the acceptance criterion
  had shipped earlier, so its three covering tests were already present and green, and
  the test-writer appended the two new red tests to the same file. A file-level diff
  would mark all five newly-added, which under the new verdict rule would still pass the
  gate but would misreport three long-standing tests as green_at_baseline noise, and
  would make BO-2400a-3-iv's pre-existing report permanently empty. Function-level
  granularity is what makes the partition mean what it says.
