    relationship: relates-to
    status: exists
    relevance: "The prompt-only /build-epic wiring of the red-baseline reader. This AC is its mechanical backstop."
  - path: docs/acceptance-criteria/testing-quality/TQ-500-checks-that-can-fail/TQ-500g-1-vii.yaml
    relationship: relates-to
    status: exists
    relevance: "The prompt-only /build-epic wiring of the wrong-version runner. This AC is its mechanical backstop."
  - path: docs/architecture/components/build-epic-workflow-dispatch.md
    relationship: describes
    status: exists
    relevance: "build-epic.js hands each ticket to ticket-supervisor, which drives the phases up to and including commit."
  - path: templates/skills/building-epics/SKILL.md
    relationship: relates-to
    status: exists
    relevance: "The supervisor's commit-phase sequence, which the backstop sits in front of."
  - path: docs/acceptance-criteria/testing-quality/TQ-500-checks-that-can-fail/TQ-500g-1-v.yaml
    relationship: relates-to
    status: exists
    relevance: "The finish wrapper (wrong_version_gate.py) whose record pass-through this AC adds."
  - path: docs/acceptance-criteria/testing-quality/TQ-500-checks-that-can-fail/TQ-500g-1-vi.yaml
    relationship: relates-to
    status: exists
    relevance: "The merged twin wiring whose decisions build-epic.js mirrors: drive-head recover, executor and schema copy, quoting and id checks, fail-closed parses, halt keys, one ticket per chunk when a batch owes runs."
  - path: docs/known-issues/build-orchestration/open-high-ki-bo-20261021-unquoted-shell-args.md
    relationship: relates-to
    status: exists
    relevance: "The defect build-epic.js's new command lines must not repeat."
  - path: docs/acceptance-criteria/ac-store/ACS-100-structured-requirements/ACS-100i-8.yaml
    relationship: relates-to
    status: exists
    relevance: "The check-package-surface-declaration commit-msg hook; the new hook's registration is a new entry in a watched registry, hence package_surface true here."
assigned_agent: python-coder
estimated_complexity: L
package_surface: true
delivers_to:
- agent: llm-expert
  ac_id: TQ-500g-1-vii
  contract: >-
    (1) --record <ticket-key> on wrong_version_runner.py run and on wrong_version_gate.py finish, which
    passes it to the runner unchanged and, before calling the writer, removes an earlier
    wrong_version.json for that key, so a writer stop leaves the record missing. (2) build-epic.js's
    dispatch prompt to ticket-supervisor gains the plain fields "ticket_key: <ticket file stem>" (already
    checked against ^[A-Za-z0-9._-]+$) and "runs_alone: true|false" (true when the ticket's chunk holds
    only it). (3) build-epic.js runs recover once at the drive head, so the supervisor runs none. (4) The
    marker files, which the supervisor never touches.
- agent: llm-expert
  ac_id: TQ-500f-3-iv
  contract: >-
    --record <ticket-key> on fast_lane.py heavy_lane_gate (flag in _fl_cli.py, one keyword in
    fast_lane.py's dispatch, the write in _fl_heavy_lane_gate.py), with which the CLI writes its own
    red_baseline.json for every outcome, including not-applicable and a reused --ticket pass; and the
    ticket_key field in build-epic.js's dispatch prompt.
expects_from:
- ac_id: TQ-500f-3-iv
  contract: >-
    On /build-epic the supervisor calls heavy_lane_gate with --record "<ticket_key>" for each ticket
    that reaches a coder or a commit, so the CLI writes <git-dir>/leafcutter/gate-verdicts/<ticket_key>/red_baseline.json:
    {gate: "red_baseline", ticket_key: str, ids: [str], written_at: ISO-8601 UTC, verdict: <heavy_lane_gate
    JSON verbatim>}.
- ac_id: TQ-500g-1-vii
  contract: >-
    On /build-epic the supervisor calls finish with --record "<ticket_key>" before every commit spawn, for
    every ticket including one with no source_ac. The runner, reached through finish, writes
    .../wrong_version.json: {gate: "wrong_version", ticket_key: str, ids: [str], written_at: ISO-8601 UTC,
    base_ref: str, paths: {<worktree-relative POSIX path>: <sha256 hex of its content, null when
    deleted>}, code_digest: str (sha256 hex over the sorted paths map), verdict: <runner run JSON
    verbatim>}.
- ac_id: TQ-500g-1-v
  contract: >-
    The finish wrapper on main (scripts/build_orchestration/wrong_version_gate.py finish: --work-key,
    --reply -, --ac-ids, --ac-root, --test-root, --base-ref; prints {gate_passed, stopped_at, writer,
    verdict}), which this AC extends with the --record pass-through. It holds no rule of its own.
- ac_id: TQ-500g-1-iii
  contract: >-
    The runner's recover step on main: python <worktree>/{{config.output_root}}/scripts/build_orchestration/wrong_version_runner.py
    recover (no flags, worktree root as working directory) prints {restored: [str], ok: bool, copy_dir:
    str|null, detail: str}. It closes EVERY open journal under <git-dir>/leafcutter/wrong-version-runs,
    and every run step starts with the same recovery.
it_requirements:
  config_schema_fragment:
    build_epic_gate_verdicts:
      type: object
      description: "Config section of the new pre-commit hook check-build-epic-gate-verdicts (create-hook Step 3a)."
      required: [_comment, severity]
      properties:
        _comment:
          type: string
        severity:
          const: block
    hooks_manifest.hooks[]:
      id: check-build-epic-gate-verdicts
      tier: judgment
      entry: "python {{config.output_root}}/scripts/commit_guardian/run_hook.py {{config.output_root}}/scripts/commit_guardian/check_build_epic_gate_verdicts.py"
      language: system
      stages: [pre-commit]
      pass_filenames: false
      always_run: true
      change_set_source: self_derived
  reference_file_path: templates/scripts/commit_guardian/commit_guardian.json
  n_location_rule: "2 -- one new top-level key build_epic_gate_verdicts and one new member of hooks_manifest.hooks (id check-build-epic-gate-verdicts) in templates/scripts/commit_guardian/commit_guardian.json. No other key is added, renamed or removed."
  required_skills:
    - python-coder
    - create-hook
  post_write_commands:
    - "python3 scripts/build.py --target-dir . --force"
    - "python3 scripts/registry_validator.py"
    - "python3 -m pytest unit_tests/commit_guardian unit_tests/workflows unit_tests/build_orchestration -k \"gate_verdict or build_epic\""
  constraints:
  - >-
    PLACEMENT (IT-PO decision, unchanged). A blocking pre-commit hook,
    templates/scripts/commit_guardian/check_build_epic_gate_verdicts.py, registered through the create-hook
    procedure: config section and hooks_manifest entry (above), the hook documentation index and
    docs/pre-commit-hooks.md, the config constants step, and the regenerated .pre-commit-config.yaml (build.py).
    No add-agent-to-package or add-skill-to-package step: no agent or skill is added. Rejected placements:
    build-epic.js alone (it never dispatches the commit phase, ticket-supervisor does, so it could only observe
    a commit already made) and a commit-agent precondition (prompt text, the weakness this AC removes).
  - >-
    PACKAGE SURFACE (IT-PO decision 2026-10-21): true. The hook adds a new hooks_manifest.hooks member and a
    new top-level key to templates/scripts/commit_guardian/commit_guardian.json, a registry that
    check-package-surface-declaration (ACS-100i-8, commit-msg stage) watches. That hook refuses a commit adding
    a new entry unless a cited AC declares package_surface true, so the commit message of the combined change
    must cite TQ-500g-1-viii. The command-step-runner spawned_by edit below adds no entry and needs nothing.
  - >-
    RECORDS, one shared module: scripts/build_orchestration/gate_verdict_records.py (public, no leading
    underscore, because the hook in commit_guardian/ imports it). It owns the folder
    <git-dir>/leafcutter/gate-verdicts/<ticket-key>/ (git-dir = git rev-parse --absolute-git-dir in the
    worktree, the same root _wvr_gate uses), the record write, the record read, the marker and the code
    digest. Files: open.json (marker) {ticket_key, ticket_path: repo-relative POSIX, source_ac: [str],
    opened_at}, red_baseline.json and wrong_version.json in the shapes stated in expects_from. They live
    outside the working tree, are private to the worktree, survive a crash, and are never committed.
  - >-
    MARKER SNAPSHOT (review finding H-1, 2026-10-22). open reads the ticket file's frontmatter source_ac
    itself, at open time, before the supervisor runs, and stores it in open.json as source_ac ([] when the
    ticket has none). It never takes the list from the planner's report or the supervisor's arguments. A
    ticket whose frontmatter cannot be read, or whose source_ac is neither absent nor a list of strings,
    is not opened: open fails and build-epic.js does not dispatch the ticket.
  - >-
    PATH NORMALISATION (review finding 2026-10-22). open stores ticket_path normalised exactly as the hook
    normalises staged paths: repo-relative POSIX, backslashes turned into forward slashes, a leading "./"
    stripped. One normalisation function in gate_verdict_records.py serves both sides, so a "./tickets/..."
    path from the planner never causes a false unattributed-commit block.
  - >-
    The ticket key is one plain path segment matching ^[A-Za-z0-9._-]+$ (and not "." or ".."). Every CLI that
    takes --record or --ticket-key refuses any other value, writes nothing, and fails closed (its usual
    failure shape, gate_passed false where it has one). It is the ticket file's stem, the same value the
    supervisor passes to finish as --work-key.
  - >-
    Writes are atomic (temporary file, then replace), so a cut-short write never leaves a truncated record
    that parses. A record write that fails turns the CLI's own result into a failure (gate_passed false,
    reason naming the record), never a silent pass.
  - >-
    Records are written only by the gate CLIs, on every outcome when --record is given: heavy_lane_gate
    (pass, fail, not applicable, reused --ticket pass) and the runner's run step (pass, stop, not applicable,
    internal error). finish passes --record to the run step unchanged and writes no record itself; before the
    writer step it removes an existing wrong_version.json for that key, so when the writer stops the record is
    missing, not stale. --record is optional everywhere: without it every CLI behaves exactly as on main, so
    the fast lane, build-feature.js and build-ticket.js are unaffected.
  - >-
    Code digest: paths = every path changed against the base ref in the working tree (tracked and untracked,
    non-ignored, the set -x's derived scope uses), minus one exclusion constant: the ticket files under
    tickets/, the AC store (docs/acceptance-criteria/) and changelogs/. Each path maps to the sha256 of its
    content (null when deleted). code_digest is the sha256 over the sorted map.
  - >-
    HOOK RULES. No open.json under gate-verdicts in this worktree: exit 0 after one git call and one directory
    listing, reading nothing else, so commits outside /build-epic are unaffected (target under 100 ms). With
    markers open: the commit must stage the ticket file named by an open marker, and that ticket needs both
    records. Missing: block, naming the missing verdict. Unparseable, truncated or wrong shape: block, naming
    it unreadable. gate_passed false in either record: block, naming the reader's reason or the survivors.
    Requirement binding (H-1): for BOTH records, set(record.ids) must equal set(marker.source_ac), else
    block, naming the expected and recorded ids. When marker.source_ac is non-empty, a verdict with
    applicable false blocks (a supervisor that dropped --source-ac / --ac-ids cannot pass). When it is
    empty, applicable false passes and is never reported as verified. A marker with no readable source_ac
    snapshot (key missing, not a list of strings, open.json unparseable) blocks. Code staged while a marker
    is open but no marked ticket file staged: block, because the commit cannot be attributed (H-2); the
    message names every open marker's ticket path and tells the committer to stage that ticket file. It
    prints no runnable close command: closing a marker is the drive's own job (be-gate-marker-close,
    be-gate-marker-close-all) or a human's decision. An error before any marker is found exits 0 with a
    warning; once a marker is found, any error blocks.
  - >-
    PRECOMMIT-AUTOFIX ROUTE (H-2). The check-build-epic-gate-verdicts entry in
    templates/scripts/precommit-autofix.json (description and instruction) says: re-run the missing or
    out-of-date gate for the ticket, or stage the marked ticket file the hook names; never edit, delete or
    close a record or marker by hand. It does not say "close a stale marker with the printed command".
  - >-
    STALENESS (B6), only when the wrong-version verdict has applicable true: every staged CODE path must
    appear in the record's paths with the same sha256 as its staged (index) content; a changed or unrecorded
    one blocks as out of date. Code paths are staged paths whose extension is in commit_guardian.json
    file_size.checked_extensions (read from that configuration, never a second hard-coded list), minus the
    exclusion constant. So knowledge records staged by building-epics section 5.9 after the runs, a sibling's
    leftovers that are not staged, and docs never cause a false block. The red-baseline record has no
    staleness rule: it is taken before the coder.
  - The hook reads records only, never ticket comments, sign-offs or supervisor prose.
  - >-
    BUILD-EPIC.JS, DRIVE HEAD (every drive; there is no fresh-or-resumed signal, because the worktree is
    caller-supplied or found by the ambient check, as in build-ticket.js). After the Worktree Guard resolves
    worktreePath and before the Planner: (1) recover, label be-wv-recover, exactly
    python "<root>"/{{config.output_root}}/scripts/build_orchestration/wrong_version_runner.py recover ;
    ok must be the boolean true, else return blocked with gate "wrong_version_gate", wrong_version_step
    "recover", wrong_version_detail = the reply, and dispatch no ticket. (2) close every stale marker, label
    be-gate-marker-close-all, exactly
    python "<root>"/{{config.output_root}}/scripts/build_orchestration/gate_verdict_records.py close --all --worktree "<root>" ;
    best effort. Recover runs once here and never per ticket: recover closes every open journal in the
    worktree, so a per-ticket recover in a parallel chunk would put back a sibling's in-flight alteration.
  - >-
    BUILD-EPIC.JS, PER TICKET, inside its thunk before the ticket-supervisor dispatch: ticket_key = the ticket
    path's file stem. Input check (the twins' wvBad): ticket_key must match ^[A-Za-z0-9._-]+$; the root and
    the ticket path must contain none of ", $, backtick, CR or LF. Then open the marker, label
    be-gate-marker-open, exactly
    python "<root>"/{{config.output_root}}/scripts/build_orchestration/gate_verdict_records.py open --worktree "<root>" --ticket-key "<ticket_key>" --ticket-path "<ticket path>" .
    A failed input check, or a reply that is not {opened: true, ...}, means that ticket-supervisor is NOT
    dispatched; the thunk returns {status: "blocked", gate: "gate_verdict_marker", marker_step:
    "input-check" | "open", marker_detail: <reply or rejected values>} and the existing halt filter stops the
    batch. After the supervisor returns, close the marker best effort, label be-gate-marker-close, exactly
    python "<root>"/{{config.output_root}}/scripts/build_orchestration/gate_verdict_records.py close --worktree "<root>" --ticket-key "<ticket_key>" .
    <root> is worktreePath with backslashes turned into forward slashes.
  - >-
    BUILD-EPIC.JS, ONE TICKET PER CHUNK WHEN A BATCH OWES RUNS (the user's 2026-10-21 decision for
    TQ-500g-1-vi, applied to this route). build-epic.js today slices each batch into chunks of BATCH_SIZE (12)
    and runs each chunk through parallel(), every ticket-supervisor in the same worktree. The commit lock
    serialises commit phases only, and finish builds "the fix undone" and derived scope from ALL uncommitted
    changes, so a sibling's coder in flight would be judged, reverted or overwritten. Change only the chunk
    step: chunk size 1 for a batch that owes runs, else BATCH_SIZE, decided once per batch. PLANNER_SCHEMA's
    ticket items gain source_ac (array of strings, ALWAYS returned, [] when the ticket has none) and the
    epic-planner prompt gains one sentence asking for it. Fail closed: a missing key or a non-array value
    counts as owing runs. The dispatch prompt gains "ticket_key: <ticket_key>. runs_alone: <true when the
    chunk holds one ticket, else false>." The planner's batching rules are unchanged.
  - >-
    BUILD-EPIC.JS, EXECUTOR. Dispatch every command step (recover, close-all, open, close) as agentType
    command-step-runner with the twins' request shape JSON.stringify({step: <label>, command, target:
    {workspace: worktreePath, run_id: <ticket_key, or "drive-head">}}) and their reply schema copied as text
    (the engine has no module loader); parse JSON.parse(reply.stdout); a decline, throw or non-object is no
    reply. Never status-checker (read-only, has refused shell steps: KI-BO-20260927, KI-BO-20260901-1620).
  - >-
    BUILD-EPIC.JS, RESULTS. TICKET_RESULT_SCHEMA gains the optional keys red_baseline_gate, wrong_version_outcome
    (string or null), gate, wrong_version_step, wrong_version_detail, marker_step and marker_detail; a
    halted_tickets entry copies gate, wrong_version_step / marker_step and the detail unchanged. No rule logic
    in the JS: every decision about verdicts lives in Python.
  - >-
    REGISTRY: command-step-runner's spawned_by becomes ["user", "fast-lane-ship.js", "build-feature.js",
    "build-ticket.js", "build-epic.js"]; regenerate docs/agents/cards/command-step-runner.card.md; update the
    adopter_notes sentence in templates/agents/command-step-runner.md that lists its callers. No other field,
    no new entry.
  - >-
    DEPLOYMENT. build_build_orchestration_scripts (scripts/build_phases_script_deploy.py) already deploys every
    .py in scripts/build_orchestration/, so gate_verdict_records.py ships without a manifest edit. The hook
    must find it in the DEPLOYED layout (<output_root>/scripts/build_orchestration next to
    <output_root>/scripts/commit_guardian), which only the deployed test proves (CLAUDE.md, 'New Hook / Gate
    Dependencies Must Be in the Build Deploy-Manifest').
  - >-
    FILE SIZE (counted lines, _file_size_ratchet.measure_current_length, measured 2026-10-21 at adb0c2e61;
    limits .py 400, .js 1000): build-epic.js 489, expected +55 to 75 (drive-head recover and close-all, the
    executor helper and schema copy, the per-ticket input check, open and close, the chunk step with the
    planner key and sentence, the two prompt fields, the result keys), so about 545 to 565, no skip needed.
    fast_lane.py 391: at most +1 (the record keyword in the heavy_lane_gate dispatch), never past 400.
    _fl_cli.py 268 (+3 to 6), _fl_heavy_lane_gate.py 277 (+8 to 15), wrong_version_runner.py 305 (+6 to 12),
    wrong_version_gate.py 76 (+5 to 10). New gate_verdict_records.py and the new hook each at or under 400.
    Anything well beyond that in the JS means rule logic leaked into it.
  - >-
    Existing build-epic.js workflow tests reach the ticket dispatch, so they now meet the new command
    dispatches: give them passing stubs (recover ok true, close-all ok, open {opened: true}) rather than
    weakening the fail-closed parses. The workflow tests that carry must_catch run build-epic.js as it stands
    in templates/workflows-js/, never a deployed copy.
  - >-
    Residual risk, recorded rather than solved: git commit --no-verify, or a supervisor that deletes the
    marker, bypasses the hook. The threat here is an instruction-following lapse, not an adversary.
  - >-
    Ship in one change with TQ-500f-3-iv and TQ-500g-1-vii. TQ-500g-1-v and -vi are on main (adb0c2e61).
test_spec:
- name: test_hook_verdicts_for_b1_to_b6
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: criterion
  surface_invoked: templates/scripts/commit_guardian/check_build_epic_gate_verdicts.py
  description: >-
    Runs the hook as a real subprocess in a temp git repo with an open marker, a staged fixture ticket and
    B1 to B6 records. B1 and B5 pass. B2 (missing), B3 (truncated), B4 (stop, even with a supervisor summary
    saying ready) and B6 block, each naming its reason.
  must_catch:
  - missing wrong-version record treated as a pass
  - truncated record read as an empty pass
  - stop verdict ignored
  in_scope_files:
  - templates/scripts/commit_guardian/check_build_epic_gate_verdicts.py
  - scripts/build_orchestration/gate_verdict_records.py
- name: test_b6_code_changed_after_runs_is_out_of_date
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: discrimination
  description: >-
    B6: a .py file is changed and staged after the runner's record was written, and the commit blocks as out
    of date. Controls that pass: the same staged content with no change after the record; a knowledge .md
    file staged after the record; an unstaged leftover file that differs from the record.
  must_catch:
  - no staleness check
  - digest computed over the working tree instead of the staged content
  - non-code files staged after the runs block the commit
  in_scope_files:
  - templates/scripts/commit_guardian/check_build_epic_gate_verdicts.py
  - scripts/build_orchestration/gate_verdict_records.py
- name: test_commit_without_open_marker_is_unaffected
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: boundary
  description: >-
    With no open marker, a commit staging code and a ticket file passes without any record. With a marker
    open and no marked ticket staged, a code commit blocks as unattributable; the message names the marked
    ticket path and tells the committer to stage it, and contains no runnable close command.
  must_catch:
  - hook applies to every commit and blocks non-/build-epic work
  - unattributed commit passes while a marker is open
  - unattributed-commit message prints a runnable close command
  in_scope_files:
  - templates/scripts/commit_guardian/check_build_epic_gate_verdicts.py
  - scripts/build_orchestration/gate_verdict_records.py
- name: test_records_bound_to_marker_source_ac_snapshot
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: discrimination
  surface_invoked: templates/scripts/commit_guardian/check_build_epic_gate_verdicts.py
  description: >-
    open is run on a fixture ticket whose frontmatter has source_ac [X-1] and stores source_ac [X-1] in
    open.json, whatever list the caller holds. The hook then blocks when either record has applicable false
    (the supervisor dropped --source-ac / --ac-ids), when a record's ids differ from [X-1], and when open.json
    has no readable source_ac. Controls that pass: records with ids [X-1] and applicable true; a ticket with
    no source_ac whose snapshot is [] and whose records are not applicable.
  must_catch:
  - not-applicable record passes for a ticket that has source_ac
  - record ids not compared with the marker's source_ac snapshot
  - marker source_ac taken from the caller instead of the ticket frontmatter
  - marker without a readable source_ac snapshot treated as a pass
  in_scope_files:
  - templates/scripts/commit_guardian/check_build_epic_gate_verdicts.py
  - scripts/build_orchestration/gate_verdict_records.py
- name: test_marker_ticket_path_normalised_like_staged_paths
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: boundary
  description: >-
    open with --ticket-path "./tickets/EPIC-X/01_a.md" (and a backslash form) stores
    "tickets/EPIC-X/01_a.md"; a commit staging that ticket with B1 records passes and is not blocked as
    unattributable.
  must_catch:
  - leading ./ kept in the marker path, so a correctly staged ticket is blocked as unattributable
  in_scope_files:
  - templates/scripts/commit_guardian/check_build_epic_gate_verdicts.py
  - scripts/build_orchestration/gate_verdict_records.py
- name: test_build_epic_recovers_once_at_drive_head_and_fails_closed
  target_dir: unit_tests/workflows/
  framework: pytest
