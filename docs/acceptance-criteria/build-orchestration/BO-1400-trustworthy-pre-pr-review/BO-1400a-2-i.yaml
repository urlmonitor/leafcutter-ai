assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - "The placement check must classify a changed artifact as either consumer-deliverable or build-output-only before deciding whether the deployable-source requirement applies, so generated/workspace-only outputs do not produce false placement blockers."
  - "Classification should lean on the package's own delivery boundary (what build.py copies into a target project per ADR-001): artifacts that build.py never delivers to consumers are build-output-only and exempt from the deployable-source requirement."
  - "Ambiguous cases resolve toward surfacing a finding for human judgment rather than silently exempting an artifact, consistent with the pr-reviewer's classify-ambiguity-as-not-low convention."
delivers_to: null
