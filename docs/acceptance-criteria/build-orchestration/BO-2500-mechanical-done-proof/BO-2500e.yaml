readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  JavaScript/TypeScript tests count as real proof-of-done, exactly like Python tests do.

  A requirement whose only tests are written in JavaScript or TypeScript can be mechanically
  proven done, the same way a Python-covered requirement is. The proof-of-done check recognises
  a requirement's front-end tests, runs them, and treats a genuine pass as proof — so front-end
  features backed by real, passing tests are no longer stuck "in progress" just because their
  tests are not Python. The trust guarantee of BO-2500 now covers the whole codebase, not only
  its Python half.
