notes: |
  The parent AC establishes the distinction at the gates that exist today. This one keeps it
  true tomorrow, which is the difference between a repair and a guarantee. Three gates were
  patched by PR #565; the fourth was not, and nothing would have noticed a fifth.

  THE THIRD SCENARIO GUARDS THE CHECK AGAINST ITSELF. A check that quietly skips gates it
  cannot reach reports clean while covering a shrinking fraction of them — the zero-file
  success recorded against this repository's own AC-store validator (KI-ACS-001), which printed
  a pass and exited 0 having examined nothing for eight days, and was itself the documented
  defence against store rot the whole time. Reporting the unexercised point is also the same
  requirement BO-3200e makes of every check: an inspection that could not happen says so.

  IT-PO ENRICHMENT NOTE (2026-08-26). The observation-versus-vocabulary requirement is added
  because the cheapest implementation of this check inspects each gate's declared outcome enum
  and passes when both values are present. That is green against a gate which defines both and
  emits only one — the shape a half-migrated gate actually has, and therefore the shape the check
  most needs to catch.
