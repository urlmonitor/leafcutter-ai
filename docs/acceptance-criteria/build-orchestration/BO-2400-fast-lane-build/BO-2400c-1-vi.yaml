  A REGRESSION THIS RECORD EXPOSED IN -iii's GUARD, FIXED HERE. -iii detects an empty layer
  by looking for a run of 4+ newlines, which is what two back-to-back joins produce. That
  only ever occurs for an INTERIOR empty layer. Before this record the last-position case was
  unreachable, because "acs" always sat between the marker and "prior_tests". Removing "acs"
  makes "prior_tests" the entire volatile suffix, so emptying it leaves a single trailing
  "\n\n" that the newline rule cannot see — and prior_tests is precisely the layer most
  likely to arrive empty, since the bundle prompt tells the agent a short placeholder is fine
  when no prior tests exist. classifyContextBundle() now also checks that the text after the
  marker is non-empty. This touches -iii's surface deliberately: shipping the layer removal
  without it would have silently widened a hole -iii had just closed.

