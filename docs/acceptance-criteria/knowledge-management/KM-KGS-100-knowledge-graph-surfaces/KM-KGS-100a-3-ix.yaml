readiness: approved
priority: high
title: "Comment and blank lines between block-list items do not end the list"
component: knowledge-management
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100a-3.yaml"
criteria: |
  Given an acceptance-criterion record whose covered_by field is declared as a block
    list in which two comment lines and one blank line sit between its items, the
    second comment line starting at column zero and holding text shaped like a key,
    followed immediately by the next top-level key with its own block list:
      covered_by:
        - "unit_tests/test_alpha.py"
        # Added by a later criterion; the entry above is kept.
      # covers: KM-EX-010
        - unit_tests/test_beta.py::test_gamma

        - unit_tests/test_delta.py
      implemented_by:
        - scripts/example_module.py#example_function
  When that record's frontmatter is read for relationship extraction
  Then the value obtained for covered_by is the three-item list
    ["unit_tests/test_alpha.py", "unit_tests/test_beta.py::test_gamma",
     "unit_tests/test_delta.py"]
  And no item of that value contains the text of either comment line, and no item
    begins with the # character
  And no item of that value is the empty string
  And the value obtained for implemented_by is the one-item list
    ["scripts/example_module.py#example_function"], with no item of covered_by
    appearing in it and no item of implemented_by appearing in covered_by
  And a record declaring implemented_by as a block list with the same comment and
    blank lines between its items yields all of its items in the same way
depends_on:
  - KM-KGS-100a-3
  - KM-KGS-100a-3-i
