id: UXP-514-4
title: "D4: a step naming a screen with no registered mockup is named, and gates on approval"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a journey step naming a screen for which no screen artifact is registered,
  When the record is checked,
  Then the check reports that step, naming the journey, the step and the unregistered screen,
  And that report is a warning while the journey is not approved,
  And that report stops the work that triggered the check once the journey is approved,
  And a step naming a registered screen is not reported.
depends_on:
  - UXP-514
created_by: "docs/acceptance-criteria/ux-prototyping/UXP-500-product-truth-generation/UXP-514.yaml"
