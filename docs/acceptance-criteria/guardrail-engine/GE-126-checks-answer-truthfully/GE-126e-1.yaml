notes: |
  THE OBSERVABLE IS THE OUTCOME OF RUNNING THE CHECK AND NEVER A PROPERTY OF ITS SOURCE. The
  L1 is unambiguous about this and gives the reason: a census built by searching for an early
  return reports on dead code and will be wrong in both directions. This record makes the
  execution mandatory by making the fixtures' known classifications the assertion.

  THE FIXTURES REPRODUCE THE TWO RECORDED SHAPES RATHER THAN NAMING THE TWO RECORDED CHECKS.
  Naming the real checks would make this criterion expire the moment GE-126a to GE-126c land,
  and would leave the census untested afterwards. Fixtures built to the recorded shapes keep
  the control pair meaningful for as long as the census exists.

  THE FOUR-WAY DISTINCTION IS DELIBERATE. Refused in both, passed in both, could-not-inspect
  in both, and the asymmetric pair are four different facts. Only the asymmetric pair is an
  instance. A check that passes in both runs may simply have had nothing to object to; that
  is a different finding and folding it into the instance count would inflate the first
  measured number, which the L0 forbids being stated at all until it is measured honestly.

  RECORDING THE TWO WORKING DIRECTORIES IS WHAT MAKES THE VERDICT ARGUABLE. A classification
  nobody can reproduce is an assertion. The pair recorded alongside it is what lets a reader
  disagree, which is the property KI-CG-018's own evidence block has and which is why it was
  believed.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

