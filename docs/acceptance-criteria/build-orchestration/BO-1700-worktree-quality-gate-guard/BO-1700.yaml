child_limit_override: 8
criteria: |
  Every commit passes through the same quality checks -- no silent skips, ever.

  When work happens in a fresh, throwaway workspace, the automatic quality
  checks that protect the main line are always active -- never silently
  disabled. If those checks cannot be made to run, the work stops rather than
  slipping through unchecked. You get the same protection in every workspace,
  whether the project is building itself or is installed inside another project,
  and you never have to remember a manual setup step to stay safe.
