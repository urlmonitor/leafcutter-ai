notes: |
  THE SECOND OF THE THREE NAMED COLLISION SOURCES. A repository has exactly one
  index per working tree. Two workers staging at once do not merely interleave —
  they corrupt each other's staged set, and the damage lands in the developer's own
  checkout rather than in a temporary directory. This is the collision source with
  consequences outside the test run.

  IT IS ALSO ALREADY A REAL HAZARD IN THIS WORKSPACE, NOT A HYPOTHETICAL. The
  project's memory records a parallel session removing a worktree mid-drive and a
  shared .git object store corrupted by parallel supervisors. Adding test workers
  to a machine that already runs concurrent agents makes an existing failure mode
  more frequent, so the criterion is written about the checkout's observable state
  rather than about worker count.

  WHY BOTH A CONCURRENCY CLAUSE AND A NAMING CLAUSE. The before-and-after
  comparison detects that something moved; it does not say what. Without the
  offender's name and command, diagnosing a corrupted index across 349 test files
  that spawn subprocesses is exactly the multi-hour investigation TQ-600 exists to
  prevent.

  THE READ-ONLY CARVE-OUT IS DELIBERATELY NOT IN THIS AC — see TQ-600b-3-i. Reading
  tracked content from the real checkout is legitimate and common; stating the
  carve-out here would weaken the clause into ambiguity.
