criteria: |
  Given 36 of the 45 registry entries do not yet declare a field a rule requires,
  And that backfill is under way across several changes while the validator keeps
    running,
  When the validator reports its result during the backfill,
  Then the outstanding entries are declared under a ground that names the backfill,
    states the count outstanding, and states the date that count was measured —
    "36 outstanding, measured 2026-08-25, backfill in progress",
  And the declaration names the record that owns the backfill, so the exclusion is
    traceable to work someone is accountable for rather than standing on its own,
  And the declared count may fall between runs and may not rise: a run reporting 37
    outstanding against a previously recorded 36 reports a failure naming both
    figures and the date of each,
  And a declaration carrying a count with no measurement date, or a date with no
    count, or no owning record, is treated as no ground at all under ACS-1100b-4 and
    the entries it covers are reported as an unexplained shortfall,
  And this ground does not make the verdict an unqualified all-clear: a verdict over
    an answer carrying 36 outstanding is stated as clear for 9 of 45, per ACS-1100d-2,
  And a backfill declaration that has reached 0 outstanding is removed rather than
    left in place reading zero, so a finished backfill cannot be mistaken for a
    standing exemption by the next reader.
