title: "A pull request that changes both a web-app file and a non-web-app file still requires the web-app check to pass"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a pull request that changes at least one file under the web-app directory
    (leafcutter-web/) together with one or more files outside it,
  When the checks run on that pull request,
  Then the web-app build/type-check check runs and its result is required for the
    pull request to merge,
  And a failing web-app check blocks the merge even though non-web-app files were
    also changed.
depends_on:
  - BP-1400a-2
