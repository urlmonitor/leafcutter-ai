notes: >-
  Found 2026-08-14 while restoring build shims after BP-016. A single
  `build.py --force-breaking` run rewrote all 60 files under docs/agents/cards/,
  each diff resetting `created` to the build date and deleting `last_updated`.
  The compare-before-write guard at build_agent_cards() lines 1027-1034 is
  correct and already present; it is defeated because generate_card() emits
  `created: {date.today()}`, so the generated string differs from the file on
  disk on any day after the last build regardless of whether anything
  substantive changed. The guard therefore never fires, every card is rewritten,
  and each rewrite destroys the provenance the transform-doc-frontmatter hook
  had added. The two failures share one cause, which is why they are one AC:
  make the generator carry provenance through instead of inventing it, and the
  existing guard starts working again on its own.
