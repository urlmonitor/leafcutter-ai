notes: |
  L3 edge of ACS-100h-7b (EPIC-CodeQualityHooks KI-4). Covers the case the IT-PO
  hit live while authoring this very tree: ACS-100h was already over the L1 child
  limit, so a naive scaffold under it would be blocked. The product behavior is to
  fail clearly ("split first") rather than silently proceed or attempt an unsafe
  auto-rename. child_limit_override is the documented temporary stopgap (ACS-100h-6
  scenario 3), to be retired once ACS-800e lands.
