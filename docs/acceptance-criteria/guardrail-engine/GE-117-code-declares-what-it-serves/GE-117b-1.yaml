notes: |
  Owns the HAPPY-PATH and MISSING-PATH for the public-symbol->AC surface (GE-117b),
  and ENCODES THE DEFERRED "public" DEFINITION (resolution #1 for the BA): a symbol
  is public when its name does not start with '_', with __all__ authoritative when
  present. Rationale: matches Python's own convention and is determinable in-process
  by ast over the staged blob (no MCP/jcodemunch dependency — see the IT-PO note
  that hooks have no MCP channel). Scope is diff-only and PUBLIC-only: unchanged
  symbols and private symbols are out of scope (third scenario + GE-117b-1-i).
  Presence of the docstring is GE-100's concern, not re-specified. Invalid/multi-ref
  is GE-117b-1-ii; well-formatted-but-nonexistent id is GE-117b-2. Verdict shape is
  the shared spine consumed by GE-117d/e.
