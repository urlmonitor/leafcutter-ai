assigned_agent: frontend-coder
estimated_complexity: S
change_target:
- code
- ui
risk_surface: internal
it_requirements:
- On the 'Flow not found' state, a Source, Kind or Realization change rewrites the current entry with
  the same URL (the unknown ?step= kept) and the new filters through the UXP-591-4 replace path; nothing
  is drawn, the notice stays, and no entry is added.
- The selector re-lists under the new filters with the same filter function the flow page uses.
- When that entry is shown again (Back after a push), its stored filters win over the not-found boundary's
  server-rendered defaults (Real, User, All) while the notice still shows.
- Picking a flow from the not-found selector is the ordinary UXP-591-5 select push.
- Behaviour inferred by the BA (not modelled by flow v6 or dataset v4); it awaits owner confirmation,
  so readiness stays draft.
delivers_to: null
expects_from:
- ac_id: UXP-591-1-ii
  contract: Not-found mode of the Flows view rendered by leafcutter-web/app/flows/[...id]/not-found.tsx
    with the full flow catalogue in the selector and filters real/user/all.
- ac_id: UXP-591-5-iii
  contract: A filter change as a same-URL replace carrying the new filters.
test_spec:
- name: Kind Architecture on 'Flow not found' keeps the notice, the address and one entry, and the selector
    lists only product-truth-architecture
  target_dir: leafcutter-web/__tests__/uxp-591-5/
  framework: vitest
  type: component
  angle: criterion
  must_catch:
  - the filter change draws a flow
  - the unknown ?step=resolve is dropped
  - the filter change pushes an entry
  - the notice is cleared
- name: picking Product-truth in the leafcutter architecture pushes its canonical address with a one-flow
    breadcrumb
  target_dir: leafcutter-web/__tests__/uxp-591-5/
  framework: vitest
  type: component
  angle: criterion
- name: Back from there returns the 'Flow not found' entry with Kind Architecture
  target_dir: leafcutter-web/__tests__/uxp-591-5/
  framework: vitest
  type: component
  angle: seam
  must_catch:
  - the not-found boundary's server defaults overwrite the stored filters
test_rationale: 'The risk is the not-found boundary reasserting Real, User, All on Back; the seam test
  catches it. Tests are vitest under leafcutter-web/__tests__/, run host-side with `npx vitest run` (180
  s timeout). Known gap: the build pipeline''s red-baseline and done-proof checks cannot read vitest tests
  yet, so build by direct phase dispatch with host-run vitest, as the UXP-591 epic was. No Playwright:
  the harness is deferred by the owner.'
test_required: true
declares_side_effect: false
