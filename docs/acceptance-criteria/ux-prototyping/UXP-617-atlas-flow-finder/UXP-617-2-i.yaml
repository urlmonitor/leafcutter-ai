delivers_to: null
expects_from:
- ac_id: UXP-617-2
  contract: replaceFinderEntry(state) and flushPending(), so the finder entry holds its last search before
    a push.
- ac_id: UXP-591-5
  contract: Push-entry path in leafcutter-web/components/flows/flow-history.ts adding one entry at a flow's
    canonical address with {crumbs, filters} under 'leafcutter:flows-view', and the popstate restore.
it_requirements:
- 'Finder and flow view are reachable from one mounted client tree: app/flows/page.tsx and app/flows/[...id]/page.tsx
  mount the same client shell with the data both modes need, so opening a result is a pushState that draws
  the flow client-side, and a popstate onto a finder entry shows the finder, with no router navigation,
  no server request and no page reload.'
- 'The mode is decided from the URL on every load and popstate: a path of exactly /flows is the finder,
  read from its query; anything else is a flow entry, restored as UXP-591-5-ii states. The finder needs
  no stored history state.'
- 'Opening a result first flushes any pending finder address write (UXP-617-2), then pushes through the
  UXP-591-5 push path with view state {crumbs: [flowId], filters: {source and kind of the flow, realization
  ''all''}}, at flowHref(flowId) for a card or flowHref(flowId, nodeId) for a row.'
- A plain primary click is handled in-app; modified clicks (Ctrl, Meta, Shift, middle button) are left
  to the browser's link behaviour. Enter on a focused row or card does the same as a click.
- Search and facet state lives only in the /flows query string; a flow's canonical address (/flows/<product>/<flow>[?step=<id>])
  never carries finder state, and a finder address never carries a flow or step parameter. History is
  written only with window.history.pushState / replaceState through leafcutter-web/components/flows/flow-history.ts
  (view state under 'leafcutter:flows-view', merged beside the App Router's __NA and __PRIVATE_NEXTJS_INTERNALS_TREE
  keys); router.push, router.replace and router.refresh are never used for Flows history.
- The explorer does not remount on pops between flow entries (the UXP-591-4 remount guard stays green).
test_spec:
- name: clicking 'Reuse it, or decide anew?' pushes /flows/leafcutter/decision-retrieval?step=offer-reuse
    with its drawer, Real, Data, All and a one-flow breadcrumb
  target_dir: leafcutter-web/__tests__/uxp-617-2/
  framework: vitest
  type: component
  angle: criterion
  must_catch:
  - opening a result replaces the finder entry
  - opening a result calls router.push
- name: Back returns the finder with the search, the Person chip and the same summary; Forward reopens
    the drawer
  target_dir: leafcutter-web/__tests__/uxp-617-2/
  framework: vitest
  type: component
  angle: seam
  must_catch:
  - a debounced search write lands after the push, so Back shows a stale finder
  - the popstate onto /flows draws a flow
- name: clicking the flow card pushes /flows/leafcutter/decision-retrieval with no drawer
  target_dir: leafcutter-web/__tests__/uxp-617-2/
  framework: vitest
  type: component
  angle: boundary
- name: find-and-open-step session replay from atlas-flows.mock.json
  target_dir: leafcutter-web/__tests__/uxp-617-2/
  framework: vitest
  type: unit
  angle: real_artifact
  description: 'Replays FlowNavigation session find-and-open-step (load, search, facet, open-result, back):
    history_op, history_stack, address_bar, shows, finder_query and page_title per record.'
- name: a Ctrl-click or middle-click on a result row is not intercepted
  target_dir: leafcutter-web/__tests__/uxp-617-2/
  framework: vitest
  type: component
  angle: failure
  must_catch:
  - modified clicks are swallowed by the in-app handler
test_rationale: 'The seam test crosses the finder replace, the push and the pop, which is where a lost
  search shows. Tests are vitest under leafcutter-web/__tests__/, run host-side with `npx vitest run`
  (180 s timeout). Known gap: the build pipeline''s red-baseline and done-proof checks cannot read vitest
  tests yet, so build by direct phase dispatch with host-run vitest, as the UXP-591 epic was. No Playwright:
  the harness is deferred by the owner.'
