  contract: "The declarative documentation_gates policy and generator read-path this behavior extends with the risk_surface trigger dimension."
test_spec:
  - name: test_risk_surface_contract_boundary_triggers_doc_expert
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    description: "change_target=code, risk_surface=contract_boundary yields documentation-expert in the generated agents map."
  - name: test_each_triggering_risk_surface_requires_doc_expert
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    description: "risk_surface in {safety, auth, privacy} each independently triggers documentation-expert even when change_target=code would not."
  - name: test_change_target_and_risk_surface_are_ORed
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    description: "A non-triggering change_target combined with a triggering risk_surface still yields documentation-expert (independent OR evaluation)."
