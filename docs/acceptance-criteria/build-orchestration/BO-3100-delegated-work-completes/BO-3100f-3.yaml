notes: |
  VOCABULARY, INHERITED NOT INVENTED. Skipped means the run decided in advance not
  to run the step. Stopped short means it ran, tried, and could not finish.
  Collapsing them loses the difference between a step nobody expected and a step
  that failed to happen — and the collapse has a direction that matters: filing a
  stop as a skip is how a run's report comes out clean.

  The fourth scenario is the guard against the fix itself introducing drift, which
  BO-2900f-1's notes record happening once already for the word "skipped" at the
  gate layer.

  This record deliberately does not decide whether a skipped step withholds the
  run's success value. KI-BO-007 calls the skips in the anchor run legible and
  correct, and BO-3100f-2 scopes the leading value to steps that stopped short.
