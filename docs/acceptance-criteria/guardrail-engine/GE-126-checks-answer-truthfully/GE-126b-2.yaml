notes: |
  THREE OUTCOMES NOT TWO — the L1 says this is the whole defect and a decomposition that
  only separates pass from fail misses it. Two of the three are legitimately a zero exit
  today and will very likely remain so. What must differ is the outcome value the caller
  reads, not necessarily the exit status.

  THE FOURTH RUN IS WHY THIS IS NOT A LABELLING EXERCISE. Three distinguishable labels can
  be emitted by a check that assigns them from the state of the filesystem without ever
  opening a record. The altered record forces the ordinary success value to be backed by
  a check that would have refused had there been something to refuse.

  BLOCK VERSUS ANNOUNCE — DECIDED HERE, as the L0 requires. All three non-refusal outcomes
  announce and none of them blocks. The no-store outcome in particular must not block:
  the check ships to consumer repositories that have no acceptance-criterion store and
  blocking there would make the goal's fix worse than the defect. Visibility is the unit
  of this rule, not blocking — the component's deliberate fail-open convention is not
  repealed by this record.

  THE RESOLVED ROOT IS MANDATORY IN THE FIRST MESSAGE and the L1 says why: the root is the
  fact that explains the difference between the two zero exits. A message that says only
  "no store found" leaves the reader unable to tell a misconfigured root from a repository
  that genuinely has no store.

