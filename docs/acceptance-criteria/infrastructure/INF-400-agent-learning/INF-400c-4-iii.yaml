amended_by:
  - reason: "BA refresh, 2026-09-07. Three stale premises corrected against the live artefact. (1) 'Given two record shapes exist in this system ... when a drive writes both kinds of record' — no record of the INF-400g-2 phase-telemetry shape has ever been written to debugging/logs/agent_telemetry.jsonl; its 33 lines are 28 knowledge records, 4 probes and 1 non-JSON fragment, and INF-400g-2 is still work_status todo. The Given now describes the file as it is. (2) 'the aggregation surface returns the same results before and after the split, because no telemetry record moved' was vacuously true (there is nothing to aggregate) and therefore untestable. Replaced with the stronger and checkable invariant that the operational stream is byte-identical, which also aligns with INF-700c-2's hard constraint that the shared file must not be mutated. (3) Added the explicit no-fallback clause to the criteria; it existed only in it_requirements, where it did not have to be proven."
    by: business-analyst
    at: 2026-09-07
  - reason: "BA correction, 2026-09-07, on an IT PO finding that the byte-identity clause was vacuous as written. It required the operational stream to be byte-identical 'before and after the change that separates the two'. The stream is a runtime file under a version-control-excluded directory, so it is not carried by any commit and a comparison across a CODE change is not a comparison of anything — a gitignored file is trivially unchanged by editing source, and the clause could not fail. The meaningful invariant, and the one this AC's own third test descriptor was already written against, is byte-identity across a RUN OF THE READER: the reader must never open the operational stream, so no drain, watermark or rewrite may reach it, and that is exercisable in a temp tree with the real 33-line artefact. IT PO's reading confirmed and adopted. The change-time obligation is not discarded, only demoted and restated as what it actually is — an obligation on the separation work not to migrate, filter, rotate, archive or rewrite the stream — rather than as a byte comparison across a code edit. Criteria only; the mechanism, the no-fallback rule and the test descriptors are unchanged."
    by: business-analyst
    at: 2026-09-07
  - reason: "BA amendment, 2026-09-07, following INF-400c-4's rewrite around the approved repository-anchored resolution rule. ONE CLAUSE ADDED, nothing removed or reworded. WHY: this AC's separation clauses are about which KIND of record lands in which file and are all satisfied when each stream fragments into one copy per working directory — a tree where the knowledge sink is anchored on the repository and the operational stream is still resolved against each process's own directory passes every clause here while quietly breaking the argument the separation rests on. That argument is the three named consumers (retrospective-agent, feedback-analyst, INF-700b-3's capture-health report), all of which aggregate the operational stream over time; a stream that exists once per isolated working directory and is reclaimed with it cannot be aggregated by any of them. The byte-identity invariant is also weaker under fragmentation, because the file the reader might reach across to is no longer the file the consumers read. The added clause requires both streams to be reached by the one rule, and the added test descriptor asserts the FILE COUNT as well as the contents, because contents alone cannot distinguish two files from four. The two-lifecycles argument, the no-fallback rule, the byte-identity clause and the do-not-touch-the-operational-stream obligation are unchanged."
    by: business-analyst
    at: 2026-09-07
  - reason: "BA revision, 2026-09-07, same day. Wording only, no change of substance: the one-of-each-per-install clause added in the entry above was written against a repository-anchored rule, and the anchor has since been re-settled as a build-time absolute path in the deployed configuration. The clause now says both streams are declared that way, and reads 'install' and 'project root' where it previously read 'repository' and 'main checkout'. The obligation is identical and so is the test descriptor's assertion: exactly two stream files, not two per working directory. The reason the clause exists is also unchanged and is restated in it — the three named consumers aggregate the operational stream over time, and a stream reclaimed with each working directory cannot be aggregated by any of them."
    by: business-analyst
    at: 2026-09-07
