it_requirements:
  - "THE RULE IS MISSING, NOT THE DATA. Verified: _build_files_touched (scripts/ac_store/generate_ticket_from_ac.py ~line 497) already derives a requirement's footprint. REUSE it -- a second derivation guarantees that the batching rule and the generated ticket eventually disagree about the same requirement's footprint, and the disagreement will be silent."
  - "EMPTY MEANS CONFLICTS WITH EVERYTHING, AND IT MUST BE AN EXPLICIT BRANCH EVALUATED BEFORE ANY INTERSECTION. A naive set intersection inverts the rule -- the empty set intersects nothing, so 'unknown footprint' reads as 'safe to parallelise'. This is ACD-2000b's single most likely defect and it is invisible in code review because the wrong implementation is the shorter one."
  - "DERIVED-EMPTY IS NOT THE SAME AS NO-FILES, AND BOTH ARE CONSERVATIVE. _build_files_touched reads it_requirements path tokens and doc_links whose relationship is an edit surface; doc_links marked describes or related are excluded. So docs-only requirements, prose requirements and EVERY requirement not yet enriched by the IT PO derive an empty footprint. 'The derivation ran and produced nothing' must never be treated as 'this requirement touches nothing'."
  - "NO EXEMPTION BY IDENTITY. If any requirement is ever excused from the empty-footprint rule, the exemption must derive from a property of the record, never from a hard-coded id or path list -- otherwise new cases silently inherit the unsafe default."
  - "THE FOURTH CLAUSE IS NOT SATISFIABLE BY A PLANNER. Two independent choosers can only avoid overlap through shared state, so the footprint test must be applied against the footprints of the requirements CURRENTLY CLAIMED by other efforts, read at take time -- not merely across the members of one planner's own batch. A planner-local antichain satisfies clauses one to three and fails this one, and that partial pass is the likely outcome if this constraint is not stated."
  - "RE-VERIFY AT TAKE TIME, mirroring the pre-dispatch re-check the ticket-grain rule already performs (templates/skills/building-epics/SKILL.md ~lines 150-153). The set of claimed requirements changes between planning and dispatch; a check performed only during planning is stale by the time it matters."
  - "DO NOT REWRITE THE TICKET-GRAIN RULE IN THIS CHANGE. templates/skills/building-epics/SKILL.md stays authoritative for tickets until ACD-1800c lands; the two rules run side by side during the migration and must not disagree. Reconciling them is that AC's scope, and the prose surface belongs to a different craft."
  - "PERFORMANCE AND DETERMINISM. The comparison runs over the ready set on every selection: index the store once (the _build_ac_id_to_path_index precedent, ~line 71) rather than re-walking per pair, and preserve select_batch's documented guarantee that the same store state always yields the identical ordered result."
  - "Follow the project error handling policy (Ruff E722/BLE001/TRY): typed except around store reads, log-or-reraise, no bare except. A footprint that cannot be derived because of a read error is UNKNOWN, and unknown conflicts with everything -- it must never degrade to empty-and-safe."
delivers_to:
  agent: python-coder
  contract: "The requirement-grain contention test: conflicts(a, b) -> bool, true when the derived footprints intersect AND true whenever either footprint is empty or underivable, plus the take-time check of a candidate against the footprints of currently claimed requirements. Consumed by the selection path and by ACD-2000b-5's operator documentation."
expects_from:
  - ac_id: ACD-2000b-1
    contract: "The claim record, which is how a chooser learns which requirements another effort currently holds and therefore whose footprints it must avoid."
  - ac_id: ACD-2000b-2
    contract: "The atomic take, so the take-time footprint re-verification and the take itself cannot be separated by a window in which another effort takes an overlapping requirement."
test_spec:
  - name: test_two_requirements_touching_the_same_file_are_not_offered_together
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Builds a real four-requirement store and runs the real selection; asserts the first and second are never returned in the same batch."
  - name: test_disjoint_requirements_may_be_offered_together
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Asserts the first and third ARE offered together, so the rule above is about overlap and not a blanket serialisation."
  - name: test_requirement_with_no_derivable_footprint_is_never_offered_alongside_another
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "The fourth requirement, whose footprint derivation yields nothing, is never returned in a batch with any other requirement -- including the disjoint third."
  - name: test_unenriched_requirement_is_treated_as_unknown_not_as_touching_nothing
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "A requirement with no it_requirements and only describes-relationship doc_links -- the shape every un-enriched record has -- is treated as conflicting, proving derived-empty is not read as safe."
  - name: test_two_concurrent_choosers_never_take_an_overlapping_pair
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Two real processes select and take from the same store simultaneously, repeated; asserts no round ever ends with both holding requirements whose footprints intersect."
test_rationale: "Asserting that an intersection helper returns the right answer proves nothing about the clause most likely to be wrong: the empty case, where the mathematically correct intersection gives the operationally wrong verdict. So the empty-footprint case is driven through the real selection path twice -- once with a deliberately footprint-less requirement, once with the shape an un-enriched record actually has on disk -- and the disjoint pair is asserted alongside, so a serialise-everything implementation cannot pass. The fourth criterion is only observable with two real concurrent choosers: a single-planner test passes on a design that computes a perfect antichain and then fails the moment a second drive runs, which is precisely the state of the system today."
