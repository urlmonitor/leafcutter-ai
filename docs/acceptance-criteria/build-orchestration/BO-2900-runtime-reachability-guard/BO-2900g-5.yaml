title: "Reference documentation states the one set of words for a required proof and what is always asked for"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the single definition of how a required proof is described is in place,
  When a reader who has to author, produce, or read a required-proof description
    consults the project's reference documentation,
  Then one reference page states the permitted kinds of proof and, for each kind,
    the facts a description of it must carry,
    And it states that a request for a reached-the-real-way proof is attached to
      every piece of work regardless of how that work's plan was produced, and
      that no route grants an exemption,
    And it states how a work record's declaration that it changes something real
      is obtained from the behaviour that work already states, and that the
      declaration is not a field an author fills in by opinion,
    And it names the retired older name for the reached-the-real-way kind and what
      replaced it, so a reader who meets the old name in an existing description
      knows what it became and that no synonym is accepted,
    And it states that everything on the page is about what is ASKED FOR before
      any test exists, and names where the question of whether a proof was
      ACHIEVED is settled instead, so the page is never cited as evidence of
      completion.
