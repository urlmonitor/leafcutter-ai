test_spec:
  - name: test_gate_judges_new_tests_with_the_worktree_venv
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "Real git fixture whose conftest imports a package installed only in the worktree's .venv. heavy_lane_gate and verify_red_baseline, launched by the bare interpreter, both pass with the new test red, and the verdict's interpreter is the .venv interpreter."
  - name: test_gate_uses_the_configured_python_command_first
    target_dir: unit_tests/build_orchestration/
