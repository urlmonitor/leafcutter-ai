assigned_agent: documentation-expert
estimated_complexity: M
it_requirements:
  - "The reference must route to ADR-001 and ADR-013 for the source-versus-deployed boundary rather than restating it. A second statement of the boundary is the second copy ACS-100i-9 exists to prevent and it will drift the first time the layout changes."
  - "The statement about which copy enforces must be written so a test can read the two copy identities out of the shipped document and drive each one. A prose paragraph that alludes to the distinction cannot be walked and the coverage note demands that it is."
  - "The reference must name exactly one check as structurally incapable of running from the build-source tree and must make no claim about build-source copies in general. Only one instance has been observed; GE-126e is what would measure the rest and the L0 standing rule forbids the wider claim."
  - "The reason the named copy can never run there must be stated as a property of the copy, matching what GE-126c-3 makes true. A reference saying it 'usually cannot' would be describing an import-keyed implementation, which is the decomposition GE-126c-3 exists to forbid."
  - "The pre-repair workaround must be recorded with the dated observation so a reader who meets the old behaviour in an older copy recognises it, rather than being left to rediscover the same manual back-link read."
  - "The removal clause is a deletion obligation: assert that no statement remains describing a warning followed by a zero exit as an acceptable response to a permanently unsatisfiable dependency."
  - "Frontmatter and doc-type conventions must satisfy check_doc_frontmatter and check_doc_types_agents at the commit that lands the page."
test_spec:
  - name: test_the_copy_identities_are_read_from_the_reference_and_both_are_driven
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: "docs/architecture/components/commit-guardian.md enforcing-copy statement"
    description: "The test extracts the two copy identities the reference names and runs each by subprocess against one record that genuinely violates the parent-back-link rule; it does not retype the paths."
  - name: test_the_named_build_source_copy_refuses_and_the_named_enforcing_copy_blocks
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: criterion
    description: "The copy the reference calls a build input returns the refusal outcome; the copy it calls the enforcing one blocks and names the record. A reference that names them the wrong way round fails here and passes every string assertion."
  - name: test_reference_makes_no_general_claim_about_build_source_copies
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: boundary
    description: "The reference names exactly one check as structurally incapable of running from the build-source tree and asserts nothing about build-source copies as a class - the L0 no-widening rule enforced mechanically."
  - name: test_warn_then_zero_exit_advice_is_absent_and_the_boundary_is_not_restated
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: failure
    description: "No statement remains describing a warning followed by a zero exit as acceptable for a permanently unsatisfiable dependency, and the source-versus-deployed boundary is routed to ADR-001 rather than restated in the reference's own words."
test_rationale: |
  The specific failure available to this page is naming the two copies the wrong way
  round, or naming a path the build no longer writes — and every string assertion passes
  in both cases. Extracting the two identities from the shipped document and driving each
  one is the only form that catches it, which is why the first two descriptors are
  integration tests rather than docs unit tests. The third descriptor turns the L0's
  no-widening rule from a reviewer's memory into an assertion, and it matters here more
  than anywhere else in the tree: this is the page where a general claim about
  build-source copies would look most natural and would be least measured. The fourth
  covers two deletions, both invisible to an addition test.
delivers_to: null
expects_from:
  - ac_id: GE-126c-2
    contract: "The refusal wording and the runnable route it names. The reference describes the message a reader will actually meet and records the workaround that preceded it."
  - ac_id: GE-126c-3
    contract: "The fact that the refusal is keyed to what the copy is rather than to a dependency. The reference's sentence about why that copy can NEVER run there is only accurate once this holds."
