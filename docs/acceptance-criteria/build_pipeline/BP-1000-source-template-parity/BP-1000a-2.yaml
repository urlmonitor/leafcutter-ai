id: BP-1000a-2
readiness: approved
priority: high
title: "A source script edited during the drive whose template copy was not updated is reported as drift and blocks"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-1000-source-template-parity/BP-1000a.yaml"
criteria: |
  Given an epic branch modified a canonical source script (for example
    scripts/commit_guardian/check_duplicate_code.py) so that it now contains
    logic the shipped template copy does not have
  And the corresponding shipped template copy
    (templates/scripts/commit_guardian/check_duplicate_code.py) was NOT updated
    to match the source change
  When the parity check runs at the merge gate
  Then the parity check reports the pair as drifted
  And it fails the merge gate
  And the merge stays blocked until the shipped template copy is brought back
    byte-for-byte into agreement with its source
depends_on:
  - BP-1000a
  - BP-1000a-1
