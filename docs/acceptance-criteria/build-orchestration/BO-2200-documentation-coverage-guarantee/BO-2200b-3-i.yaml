it_requirements: |
  Placeholder detection must key on placeholder SIGNATURES (heading-only, residual tokens,
  TODO/TBD), not on length. A legitimately short doc must pass; brevity is not a stub.
  Avoid a naive minimum-character rule that would false-fail concise real docs.
