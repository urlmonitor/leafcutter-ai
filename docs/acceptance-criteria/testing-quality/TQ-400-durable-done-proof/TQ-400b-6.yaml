notes: |
  Satisfies the state-diagram entry in TQ-400b's documentation_triggers.

  The load-bearing fact is that today the lifecycle has no exit from finished:
  the promotion path writes one direction only and nothing anywhere writes a
  record back. The diagram's value is entirely in making the new edge — and its
  conditions — legible, so nobody has to read the sweep to learn that "done" is
  now revocable.

  Written as reader outcomes rather than "a diagram exists" because a state
  diagram is the artifact most easily satisfied by drawing an obvious happy path.
  The clauses that carry the weight are the ones an idealised drawing gets wrong:
  which outcomes do NOT move a record, what the demotion edge writes, and the
  no-op on re-entry. A diagram that omits those is technically a state diagram
  and answers none of the questions a reader arrives with.

  The current-behaviour clause is deliberate. The promotion half already exists
  and already has refusals; drawing it as a clean single arrow would misdescribe
  live behaviour in the same artifact that introduces new behaviour, which is how
  a diagram stops being trustworthy.

  IT-PO ENRICHMENT NOTE (2026-08-18) — TWO AXES, ONE STORE, AND A DIAGRAM
  ALREADY EXISTS FOR THE OTHER ONE. docs/architecture/diagrams/
  c2-003-ac-readiness-states.md is a live state diagram over the READINESS axis.
  A second state diagram over the WORK_STATUS axis is correct and necessary — the
  demotion edge belongs to work_status, not readiness — but unless the new file
  says so in its first line and links to the old one, a reader who finds one will
  reasonably assume the other is stale. That is a documentation-layer version of
  the same two-readers problem TQ-400a-3 prevents in code.
