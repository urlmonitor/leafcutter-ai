created_by: "docs/acceptance-criteria/ticket-creation/TKT-500-single-source/TKT-500f-6-iii.yaml"
criteria: |
  Given a leaf AC whose files_touched list contains an implementation
    .py file (for example "scripts/ac_store/generate_ticket_from_ac.py"),
  When a ticket is generated from that AC by an AC-to-ticket generator,
  Then the generated ticket body contains a "## Test Requirements" section so that
    the section's presence is the authoritative signal that the test-writer phase
    is required for that ticket.

  Given a leaf AC whose files_touched list contains only docs, .yaml, .json,
    or tickets-path files and no implementation .py file,
  When a ticket is generated from that AC by an AC-to-ticket generator,
  Then the generated ticket body contains no "## Test Requirements" section so that
    its absence is the authoritative signal that a docs/config-only skip is legitimate.
depends_on: [TKT-500f-6-iii, TKT-500f-6]
