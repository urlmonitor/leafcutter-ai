notes: |
  THE FALSIFIABLE HALF OF "EVERY CHANGE TO ONE IS LISTED" (TQ-500g criteria).
  W2 is the control: a check that stops every piece of work that touches an
  existing test would pass W1 and bring back the blanket ban.

  TECHNICAL DETAIL FOR IT-PO: "existed before the work began" is the file at
  the merge base the routes already use. Granularity (file or test function) is
  IT-PO's call; the criteria name tests, so a function-level comparison is the
  intent. Which route runs it: all of them, through one shared check (the
  both-lanes rule); wiring can ride the same step as the wrong-version runs.
