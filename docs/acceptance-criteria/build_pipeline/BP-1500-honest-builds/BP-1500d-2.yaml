expects_from:
  - ac_id: BP-1500d-1
    contract: "The out-of-package consumer-simulation harness (scratch project under a system temp root, realpath asserted NOT under package_root.parent, package copy at <scratch>/leafcutter-ai/, target otherwise empty apart from a minimal skills_config.json) AND the record written into that project's own root with a non-empty entry set. This AC relocates that exact artifact; it neither produces the record nor builds a second harness. If -1 has not landed, this AC cannot be started -- the relocation has nothing to relocate."
  - ac_id: BP-1500d-3
    contract: "A build whose exit status is unsuccessful when the record cannot be produced, so the pre-relocation state of this AC's fixture is known-good rather than merely known-green."
test_spec:
  - name: test_bp_1500d_2_record_reads_at_the_new_location_after_the_project_is_moved_without_the_package
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Build into the shared out-of-package harness, then MOVE the whole project to a different depth under the temp root, leaving the package copy behind. Assert as fixture preconditions that the package is absent from the new tree and from every ancestor of it, and that the new path's depth and parent both differ from the original -- a same-depth sibling move passes a broken implementation. Then read the record at the new location without rebuilding and assert it reads. Expected RED at authoring time: today's keys are anchored to package_root.parent and carry the package directory's name as a prefix."
  - name: test_bp_1500d_2_every_entry_still_resolves_to_the_artifact_it_describes_in_the_relocated_tree
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: real_artifact
    description: "Parse the relocated record from the bytes the real build serialized, in a cold process, and assert TWO non-vacuity properties because a for-each over an empty record is green on a broken install: the entry set is non-empty and equal in size to the pre-move set, and every entry resolves to a file that exists under the relocated project root. Assert resolution against the NEW root specifically -- an entry that resolves because an absolute path still happens to point at the original location must fail, so delete or rename the original tree before resolving."
  - name: test_bp_1500d_2_the_record_is_read_through_the_real_reader_entry_point_in_a_process_that_cannot_see_the_package
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "the deployed drift readers (check_build_drift.py / check_output_drift.py) run from the relocated install"
    description: "PRODUCTION ENTRY POINT. Read the relocated record by invoking the deployed reader as a SUBPROCESS from inside the relocated project, with a working directory that is not the package tree and an interpreter search path containing no path under the package checkout; assert those properties of the child process rather than assuming them. Importing the reader from scripts/ verifies it in the one layout where the package is always present, which is the layout the defect cannot appear in. Assert both that the read succeeds and that its result is consumed in the reader's control flow -- a reader that parses the record and then returns the same verdict regardless is inert."
  - name: test_bp_1500d_2_a_location_keyed_record_is_reported_unreadable_at_the_new_location_and_still_reads_at_the_original
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: failure
    description: "THE NEGATIVE CONTROL THE CRITERION DEMANDS, as a four-run matrix rather than a single red. Two records (good, and one deliberately keyed to the location it was written in) crossed with two locations (original, relocated): (1) good record at original -- reads; (2) good record at relocated -- reads; (3) location-keyed record at original -- STILL READS, which is what proves the fixture and the move are sound; (4) location-keyed record at relocated -- reported UNREADABLE, naming the record and the project. Assert the report names both, and assert specifically that run 4 is not silently accepted and not read as an empty record: an implementation that returns zero entries in run 4 satisfies a naive red-check while being the exact fail-open this AC exists against. Run 3 is the load-bearing entry -- without it a red in run 4 is indistinguishable from a move that broke the project for an unrelated reason."
  - name: test_bp_1500d_2_readability_holds_in_the_producing_workspace_under_a_differently_named_package_directory
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: deployed
    description: "The no-regression half, and a second live instance of the same defect. Parameterise the harness by package-directory name and assert the record reads for at least two distinct names, because today the key prefix is the package directory's own name -- a record written from a checkout named 'leafcutter-ai' and one written from a worktree named something else produce different key shapes, and the reader finds no expected key in the second. Assert on the resolved entry set, not on exit code: a reader that returns 0 while reporting a count of 0 is the observed present-day behaviour and must not pass."
test_rationale: |
  This child's failure is distinct from BP-1500d-1's in a way that is easy to collapse
  and expensive to collapse: a record can be filed correctly inside the receiving
  project, travel with it, and still be meaningless the moment the project moves,
  because its entries are keyed to where the producing package happened to sit. The
  file arrives; the meaning does not. So every entry here asserts on RESOLUTION at the
  new location, never on the record's presence -- presence is -1's and asserting it
  again would let this AC pass on a record that arrived and says nothing.

  Entry 4 is the load-bearing one and is written as a four-run matrix, not a
  break-and-fail pair. The criterion itself demands the read-at-origin control, and the
  reason is precise: a two-run move-and-fail cannot separate a working readability
  check from a relocation that broke the project for some unrelated reason. Only
  showing that the deliberately non-portable record STILL READS at its original
  location attributes the red to the record's form.

  The 'not silently read as an empty record' assertion inside entry 4 is the one most
  likely to be dropped, and it is the one that matters most. The present-day reader
  already exhibits exactly that degradation -- it looks for a key shape the writer did
  not produce in a differently-named layout and reports a count of 0 rather than an
  error. An implementation that returns an empty entry set for an unresolvable record
  passes a naive red-check while preserving the fail-open verbatim.

  Entry 5 is not padding either. The differently-named-package-directory case is not
  hypothetical: it is already observable in this repo's own worktrees, where keys carry
  the worktree's directory name. It doubles as the no-regression guard for the
  producing workspace and as a second, independently-reachable instance of the same
  root cause.

  Entry 3 exists because a reader verified by import is verified in the only layout
  where the package is guaranteed present. The relocated consumer has the deployed
  install and nothing else, so the read must be proved in a process that cannot see
  the package at all.

  Angles: criterion, reachability, real_artifact, deployed -- at the cap of four --
  plus failure, which is conditional and consumes no slot. seam is not charged
  although the writer/reader boundary is real: it is charged once, on BP-1500d-4,
  where the verdict contract between them is the subject rather than a means.
