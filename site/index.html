<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="leafcutter — a portable, self-hosting agentic software-delivery pipeline. How it works today and where it's going.">
  <title>leafcutter — agentic delivery pipeline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a href="#main" class="skip-link">Skip to content</a>

      <div class="brand" role="banner" aria-label="leafcutter">
        <!-- Leafcutter ant logo — ant carrying a leaf, inline SVG -->
        <svg class="brand-logo" viewBox="0 0 56 56" width="44" height="44"
             role="img" aria-label="leafcutter ant logo" focusable="false">
          <!-- Leaf held aloft (upper right) -->
          <ellipse cx="41" cy="10" rx="11" ry="7" fill="#8FBF6B" transform="rotate(-22 41 10)"/>
          <line x1="34.5" y1="15" x2="48" y2="5.5" stroke="#4E7A3E" stroke-width="1.3" stroke-linecap="round"/>
          <!-- Arm holding leaf -->
          <path d="M28,21 Q34,15 39,11" stroke="#33552B" stroke-width="2" fill="none" stroke-linecap="round"/>
          <!-- Antennae -->
          <path d="M19,14 Q13,7 10,4" stroke="#33552B" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <circle cx="10" cy="4" r="1.8" fill="#33552B"/>
          <path d="M25,13 Q30,7 33,4" stroke="#33552B" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <circle cx="33" cy="4" r="1.8" fill="#33552B"/>
          <!-- Head -->
          <circle cx="22" cy="19" r="6.5" fill="#33552B"/>
          <!-- Thorax -->
          <circle cx="22" cy="30" r="5" fill="#1F2A1E"/>
          <!-- Legs (3 per side from thorax) -->
          <path d="M18,27 L7,22" stroke="#1F2A1E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M17,30 L5,30" stroke="#1F2A1E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M18,33 L7,39" stroke="#1F2A1E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M26,27 L37,22" stroke="#1F2A1E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M27,30 L39,30" stroke="#1F2A1E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M26,33 L37,39" stroke="#1F2A1E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <!-- Abdomen (petiole + gaster) -->
          <circle cx="22" cy="38" r="3" fill="#1F2A1E"/>
          <ellipse cx="22" cy="47" rx="6.5" ry="8" fill="#1F2A1E"/>
        </svg>

        <div class="brand-text">
          <span class="brand-name">leafcutter</span>
          <span class="brand-tag">agentic delivery pipeline</span>
        </div>
      </div><!-- /.brand -->

      <nav class="view-toggle" aria-label="Toggle between current and future view">
        <div class="toggle-track" role="group" aria-label="View">
          <button class="toggle-btn" id="btn-today"
                  aria-pressed="true" data-view="today">
            How it works today
          </button>
          <button class="toggle-btn" id="btn-future"
                  aria-pressed="false" data-view="future">
            Where we're going
          </button>
          <span class="toggle-indicator" aria-hidden="true" id="toggle-indicator"></span>
        </div>
      </nav>

    </div><!-- /.header-inner -->
  </header>

  <main id="main">
    <section id="view-today" class="view" aria-label="How leafcutter works today">
      <!-- Rendered by app.js from window.LEAFCUTTER_DATA -->
    </section>
    <section id="view-future" class="view is-hidden" aria-label="Where leafcutter is going — vision preview">
      <!-- Rendered by app.js from window.LEAFCUTTER_DATA.future -->
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
