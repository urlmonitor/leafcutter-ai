notes: |
  FIELD EVIDENCE — workflow run wf_4d8a1c41-0b9, 2026-09-21, driving
  EPIC-WorkIsOnlyEverMarkedFinishedThroughThe. The run returned
  `worktree-base-unavailable` with zero phase agents spawned. The worktree was present in
  `git worktree list`, healthy, correctly located and on the right branch the whole time;
  three agents ran and none of them was a phase agent.

  Reproduced by hand from the workspace parent: `facts <worktree>` answered
  `same_repository: null` with `exists`, `is_linked_worktree` and `is_main_checkout` all
  correct, and `base` answered `{main_checkout: null, worktree_base: null, layout: null}`.
  Adding a reference drawn from the resolved epic path turned both answers correct from the
  same directory.

  NAMED MUTATIONS (each turns only this record's tests red):
    M1 — drop the reference from any one of the four invocations. Caught by
         test_every_worktree_repo_facts_invocation_in_the_driver_is_anchored, which names
         the offending subcommand.
    M2 — pass a fixed literal reference instead of one derived from the resolved target.
         Caught by the same test's interpolation check.
    M3 — make the reuse guard accept a null same_repository rather than fixing the
         question. Caught by test_unanchored_answers_abort_the_run_and_anchored_answers_do_not,
         which requires the degenerate pair to STILL abort.
    M4 — decide absoluteness with `startsWith("/")`. Caught by BO-3900d's
         test_check_passes_on_the_real_workflow_scripts, which scans the real scripts and
         names the file and line. This mutation was actually written during this record's
         own implementation and the scanner caught it; on Windows it would have left the
         defect fully intact while every test here stayed green.

  M3 is the tempting wrong fix and is worth stating plainly: the guard's fail-closed posture
  is correct and is not what broke. Relaxing it would convert a loud, honest abort into a
  step that proceeds on an unanswered question — the shape this component keeps having to
  undo. The question was wrong, not the refusal to guess at its answer.
