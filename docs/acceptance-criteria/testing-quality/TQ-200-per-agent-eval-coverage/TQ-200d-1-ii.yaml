assigned_agent: documentation-expert
estimated_complexity: L
delivers_to:
  agent: python-coder
  contract: >-
    Four family pages under docs/reference/produced-tests-eval-assertion-kinds-<family>.md (test-writer,
    database-setting, sql-test-writer, test-designer) and the hub docs/reference/produced-tests-eval-assertion-kinds.md.
    Each kind has exactly one entry on exactly one family page, headed '### `<kind>`', holding labelled
    parts: Used by (agent sets), Reads, Passes when, Fails when, Passing example, Failing example, Template
    sentence (a blockquote of the exact sentence followed by '- templates/agents/<agent>.md'). Two drift
    tests in unit_tests/evals/tq200d1ii/ hold the headings to produced_tests_scoring.KINDS and each quote
    to its template. TQ-200d-2-i, -2-ii, -4-i and -4-iv edit their kind's entry in the same change as
    their scorer edit; TQ-200d-4-ii and -4-iii update a quote when they change a quoted template sentence.
expects_from: null
