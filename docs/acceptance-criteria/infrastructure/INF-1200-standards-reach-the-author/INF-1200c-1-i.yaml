notes: |
  WHY THIS IS AN L3 AND NOT AN L2. It adds no behaviour of its own. It constrains how
  INF-1200c-1's already-specified derivation behaves on the one input where the
  ownership record has nothing to say — which is the exact seam where a join between
  two independently-maintained records goes wrong, and the exact seam where the
  temptation to be helpful does the most damage.

  THE THREE WRONG ANSWERS, IN THE ORDER AN IMPLEMENTER REACHES FOR THEM. (1) Crash, so
  one unassigned kind of file stops every other specialist being told — a fail-closed
  delivery that turns AR-100's paperwork gap into a project-wide outage. (2) Guess, by
  matching the kind of file against a specialist's name or falling back to a default —
  the worst of the three, because it is invisible and it is confident. (3) Swallow, so
  the condition never surfaces anywhere — which is this project's documented signature
  failure and the reason INF-1200e exists at all. The three arms exclude them in that
  order.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift
  it verbatim into a test descriptor.

  MUTATION: when the ownership record assigns a covered kind of file to no specialist,
  fall back to the specialist that owns the largest number of kinds of file. Under that
  injection:
    - the no-invented-owner arm must go RED, because a specialist is told the standards
      for a kind of file it does not own;
    - the delivery-completes arm must STAY GREEN, because the fallback is exactly what
      keeps the run finishing;
    - INF-1200c-1's exclusion arm must ALSO go RED, since a non-owner has been told.
  All three must be observed and all must revert. The green outcome is the point of
  running it: the fallback is attractive precisely because it makes everything else
  look healthier, and only this arm can see the cost.

  A SECOND MUTATION FOR THE THIRD ARM. MUTATION: treat an unassigned covered kind of
  file as fully handled and report nothing about it. Under it the first two arms stay
  green and the distinguishability arm goes RED. This is the cheapest implementation of
  all and it is what "nothing to do here" looks like from the inside.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. Both
  mutations above are written to be turned directly into test descriptors.
