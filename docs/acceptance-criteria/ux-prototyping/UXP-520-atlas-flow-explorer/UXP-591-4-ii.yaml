work_status: todo
readiness: draft
priority: medium
criteria: |
  Given the 'Build' drawer is open at /flows/leafcutter/deliver-a-feature?step=build,
  When the person closes it with its X button, or by clicking the canvas beside it,
  Then the drawer closes and the address bar becomes /flows/leafcutter/deliver-a-feature with
    no query,
  And the number of entries in the tab's history is unchanged,
  And when the person afterwards drills into the 'Build' sub-flow and presses Back,
    leafcutter/deliver-a-feature returns at /flows/leafcutter/deliver-a-feature with no drawer
    open,
  And a drawer opened from the bare /flows entry closes to /flows/leafcutter/deliver-a-feature,
    never back to /flows.
