  - FIN-200c-2
  - FIN-200c-3
  - FIN-200c-1-i
assigned_agent: architecture-diagram-author
estimated_complexity: S
it_requirements: |
  - The state diagram must depict exactly the three changelog-step outcomes:
    entry-written, clean no-op (empty range), and capture-failure — matching the
    discrimination defined in FIN-200c-1-i
  - entry-written and no-op must transition to the merge_pr gate; capture-failure
    must branch by the changelog_blocks_merge config: warn-and-continue (default,
    FIN-200c-1) vs halt-before-merge (FIN-200c-3)
  - The diagram must show that a capture failure records the missing-entry
    condition (FIN-200c-2) that is reported, not silently dropped
  - The diagram must reflect only the implemented outcome handling (depends on
    FIN-200c-1/2/3/1-i) and use the project's standard state-diagram notation/location
