criteria: |
  Given a test project whose root contains a uv lock file, on a machine where uv is not
    available and Poetry and plain Python are,
  When a workspace is requested from the one workspace maker,
  Then the answer is a refusal that names uv as the missing tool and the uv lock file
    as the declaration that requires it,
  And the refusal carries no workspace location,
  And no Python environment was created inside or outside a workspace by the request,
  And no folder, branch or registration for the requested workspace remains afterwards.
