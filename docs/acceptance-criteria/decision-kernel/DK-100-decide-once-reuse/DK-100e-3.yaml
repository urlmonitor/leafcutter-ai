notes: |
  FLOW BACK-LINKS (add this AC id to each node's implements list):
    leafcutter/decision-retrieval  step    offer-reuse
    leafcutter/decision-lifecycle  step    reuse

  DERIVATION. Scenario offer-reuse (a decision point; screen
  decision-reuse-or-decide-anew), and the "never resolves a decision on its own"
  clause of the journey scenario decision-lifecycle/reuse. 0.95 is the score at
  which dec-ef8ddcb79d668a67 was reused by dec-7cdc61ea41a206e0.

  PLACEMENT OF THE evidence-only BRANCH. Branch evidence-only leaves from step cite,
  but its three conditions are exactly the cases in which this question is NOT
  asked, so its L3s (DK-100e-3-ii, -iii, -iv) sit here, beside the question they
  suppress. The back-links in those files still name the branch.

  STANDING RULE carried from DK-100e (ADR-060 section 4): precedent is evidence,
  never authority; auto-reusing a high-scoring precedent is a rejected alternative.

  IT-PO BUILD STATUS (2026-10-02, unverified): built and tested, including the exact-0.8
  boundary. Pointers: amended_by.

  TRUE STATUS (2026-10-02): work_status in_progress. Its own clauses are built and its own
    tests carry # covers: DK-100e-3 tags and pass, but a composite is done only when every direct
    child is done (the L0 rule, enforced by check-done-proof). Not yet done: DK-100e-3-i, DK-100e-3-ii. Mark it done
    through scripts/ac_store/mark_ac_done.py once they are.
