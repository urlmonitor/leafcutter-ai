notes: |
  ==========================================================================
  LOAD-BEARING CONSTRAINT — this AC is its single home. The parent L1
  (INF-500d) carries a one-line pointer here rather than a second copy.
  IT PO: copy this block into this AC's it_requirements when enriching. A BA
  or IT PO who "unifies the resolvers" here will faithfully re-create the
  defect.
  ==========================================================================
  The sink resolves into the per-drive worktree, which is deleted at the end
  of the drive, so the records go with it.

  THREE resolution rules coexist DELIBERATELY. They are not duplication:

    (a) CONFIG  -> the worktree's OWN .leafcutter/ directory.
        Required by INF-100c-1-i (approved). Correct, and unchanged. A drive
        must read the configuration it is actually running under.

    (b) COMMIT GUARDS -> the worktree root, via `git rev-parse --show-toplevel`.
        Required by GE-113c-1-iv (approved). Correct for guards, which must
        judge the tree they are committing.

    (c) DURABLE RECORD SINK -> the MAIN CLONE, i.e. the shared git directory
        that survives worktree removal (`git rev-parse --git-common-dir`),
        NOT the worktree toplevel.

  Rule (b) returns the worktree root — the exact directory that gets deleted.
  Adopting the shared guard resolver for the sink therefore PRESERVES this
  bug rather than fixing it. Any L2 that collapses (a), (b) and (c) into one
  resolver is a REGRESSION dressed as a cleanup and must be rejected in
  review. State the required behaviour as a testable invariant: a record
  written from inside a worktree is still readable after that worktree has
  been removed.
  ==========================================================================

  MEASUREMENT — approximate, re-measure before quoting. Counted in this workspace
  on 2026-08-13: about 2,290 distinct record identifiers are cited across the ticket
  store; 131 of them are present in the main clone's record sink, and about 297 are
  present if every sink discoverable on disk (main clone, deployed tree, and two
  surviving worktrees) is searched together. That is roughly 87-94% of cited records
  unresolvable, depending on how hard the reader is willing to look — and the reader
  should not have to look in four places at all, which is the second scenario. These
  figures are deliberately in the notes and not in the criteria: they move every
  drive, and a criterion that quotes a live count fails for reasons unrelated to the
  behaviour under test.

  SCOPE — THE DIRECTORY, NOT THE ONE FILE (fourth scenario). The report sink shares
  its directory with the agent-telemetry log and the knowledge-emission log. All
  three are written by the same drives, resolve the same workspace-relative way, and
  are destroyed by the same workspace removal. Fixing only the report sink would
  split one directory across two roots and leave two of the three logs still being
  lost — and would guarantee a second, near-identical AC later. The scenario is
  therefore written for the directory.

  This is the one place where this AC can contradict already-approved work, so state
  it plainly rather than discovering it in review: BO-100d-1a, BO-100d-1b and
  BO-100d-2a (all readiness: approved, work_status: todo) name the telemetry sink by
  the relative path string debugging/logs/agent_telemetry.jsonl in their criteria and
  it_requirements, and their pre-drive probe appends to it from the worktree. Moving
  the directory changes what that string resolves to. Two consequences for whoever
  enriches this: (1) the durable location must still be probe-able before a drive
  starts, or BO-100d's pre-drive gate becomes meaningless; (2) if their owner
  declines the directory-wide move, narrow the fourth scenario to the report sink and
  record the split explicitly — do not leave it ambiguous. BO-2400d-1 imposes no path
  constraint of its own and is not an obstacle.

  Reviewer note: GE-113c-1-iv's mandate is scoped to the commit_guardian guard
  set. The record sink is not a guard and is therefore outside that mandate —
  but the sink's resolver must not be presented as a fourth divergent copy of
  the guard resolver either. It is a different rule serving a different
  lifetime, and the third scenario above exists so that a reviewer can prove
  all three rules still hold simultaneously.

  Durability here means durability of LOCATION, not of version control: the
  sink path is git-ignored, so the records are never carried to safety by a
  commit. Where they are written is the only thing that keeps them.
