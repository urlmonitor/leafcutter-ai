    description: "Against the same store, the fast lane's whole-store batch selection returns only the approved id, matching the backlog queue — so the account cannot claim the fast lane is indifferent to approval as a whole."
  - name: test_the_account_states_the_difference_and_confines_it_to_the_connected_set
    target_dir: unit_tests/ac_store/
