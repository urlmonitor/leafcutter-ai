test_spec:
  - name: test_red_run_report_that_stopped_before_any_connection_passes
    target_dir: unit_tests/evals/tq200d4vi/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      A report naming testing_context.db_connection_test, holding 'Ran 2 tests in 0.004s' and 'FAILED (errors=2)',
      and saying the tests raised the not-configured error in setUp before any connection was attempted passes the
      row's not-run check; so do 'did not run against a database', 'stopped before any connection' and 'never reached
      the database'.
    must_catch:
      - revert the fix (the row still checks report_says_not_run)
      - the red verification-run lines read as a claim that the database tests ran
    in_scope_files:
      - scripts/evals/produced_tests_reports.py
      - scripts/evals/sets/test-writer.jsonl
  - name: test_run_claims_and_a_bare_red_run_fail
    target_dir: unit_tests/evals/tq200d4vi/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Each fails: (a) 'The database tests ran and passed.'; (b) a report saying the tests connected to the test
      database; (c) the red verification-run lines with no sentence that the database part stopped before any connection
      or did not run against a database.
    must_catch:
      - '''The database tests ran and passed.'' accepted'
      - a connected-to-the-database claim accepted
      - the red verification run alone accepted as stopped-before-the-database
    in_scope_files:
      - scripts/evals/produced_tests_reports.py
  - name: test_test_runner_row_keeps_report_says_not_run
    target_dir: unit_tests/evals/tq200d4vi/
    framework: pytest
    type: unit
    angle: boundary
    description: >-
      The test-runner missing-setting-database-work row still lists report_says_not_run; a report claiming a run
      fails it and the relayed not_configured block (with TQ-200d-4-v's sentence) passes it, with the same details
      as before this change.
    must_catch:
      - report_says_not_run itself widened
      - the test-runner row moved to the new kind
    in_scope_files:
      - scripts/evals/produced_tests_reports.py
      - scripts/evals/sets/test-runner.jsonl
  - name: test_kept_test_writer_reports_pass_and_weakened_copies_fail
    target_dir: unit_tests/evals/tq200d4vi/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The run1 and run2 probes under unit_tests/evals/fixtures/tq200d-rerun/test-writer/missing-setting-database-work/
      pass all four of the row's checks; a copy of each without its 'before any connection' / 'before ever reaching'
      sentence fails the not-run check.
    must_catch:
      - a kept report without its stop sentence passes (false green)
    in_scope_files:
      - scripts/evals/produced_tests_reports.py
  - name: test_test_writer_and_test_runner_gold_still_pass_after_the_new_kind
    target_dir: unit_tests/evals/tq200d4vi/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: >-
      python scripts/evals/run_agent_eval.py --agent test-writer --score-gold --results-file <tmp>
    description: >-
      The real CLI replays the test-writer and the test-runner (--agent test-runner) gold outputs and every row
      passes.
  - name: test_new_kind_entry_quotes_a_test_writer_sentence
    target_dir: unit_tests/evals/tq200d4vi/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The report_says_stopped_before_database entry quotes a sentence found in templates/agents/test-writer.md (not
      test-runner.md), its named example files score as stated, report_says_not_run's Used by no longer names the
      test-writer row, and the README bullet links the new entry.
    must_catch:
      - the entry quotes the test-runner sentence
      - report_says_not_run still lists the test-writer row
    in_scope_files:
      - docs/reference/produced-tests-eval-assertion-kinds-database-setting.md
      - scripts/evals/README.md
test_rationale: >-
  The test-writer must run its tests red, so the old not-run rule could never pass a truthful report; the new kind
  accepts a red run that stopped before the database. Its risk is a false green, so the three user-named failing
  cases each have a probe, the test-runner row is pinned to the unchanged rule, and the kept reports with their
  stop sentence removed prove the pass depends on that sentence.
