id: BP-100b-11
readiness: approved
priority: high
title: "Registry referential integrity: every commit-guardian hook entry points at a script that exists, and the deployed registry is derivable from the canonical template"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-100-reliable-builds/BP-100k.yaml"
criteria: |
  Given the canonical template commit-guardian hook registry (the template
    commit_guardian.json that the build system reads when deploying to a
    consumer project) declares a hooks_manifest with these registered hooks:
    - id "check-ac-tree-limits", entry referencing check_ac_limits.py
    - id "check-ac-schema", entry referencing check_ac_schema.py
  And every entry's resolved script path exists in the template tree
  When the registry referential-integrity check runs at pre-commit time
  Then it exits with code 0 and reports no violations

  And given the deployed commit-guardian hook registry
    (scripts/commit_guardian/commit_guardian.json) declares a hooks_manifest
    entry with id "check-ac-limits" whose entry references the script
    scripts/commit_guardian/hooks/check_ac_limits.py
  And no file exists at scripts/commit_guardian/hooks/check_ac_limits.py
  When the registry referential-integrity check runs at pre-commit time
  Then the commit is blocked with exit code 1
  And the error message names the hook id "check-ac-limits"
  And the error message names the missing script path
    scripts/commit_guardian/hooks/check_ac_limits.py
  And the error message states that the entry references a script that does
    not exist on disk

  And given the deployed registry registers a hook id "check-ac-limits" that
    is absent from the canonical template registry (the template registers only
    "check-ac-tree-limits")
  When the registry referential-integrity check runs at pre-commit time
  Then the commit is blocked with exit code 1
  And the error message names "check-ac-limits" as a deployed-only hook id that
    the canonical template registry does not contain and cannot regenerate
  And the message states the deployed registry must be derivable from the
    canonical template — either add the hook (and its script) to the template,
    or remove the entry from the deployed registry
