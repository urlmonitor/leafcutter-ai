criteria: |
  Given every go criterion otherwise passes but exactly one no-go signal is present --
    a required gate is red, OR a deployed-hook import error occurs, OR a shadow check
    shows a gate that verified zero ACs,
  When the cutover is evaluated,
  Then the cutover is blocked and the specific no-go signal is named in the refusal;
  And this holds independently for each of the three no-go signals.
