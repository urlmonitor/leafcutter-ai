criteria: |
  Given an author of a new route, or of a route on another orchestration framework, needs to
    call the shared commit step,
  When they open its reference page,
  Then the page lists every input the step accepts -- the files to commit, the message file,
    supervised mode, and the run or criterion it commits for -- with what each is for,
  And it lists every key of the answer and, for each of the four statuses, which keys are
    filled and what a caller must do next,
  And it states the rules a caller can rely on: only named files and their edited structural
    parents are committed, the message lands unchanged, checks always run with exactly one
    retry, main, master, the default branch and a detached checkout are refused,
  And it shows one complete example answer for each of the four statuses,
  And it names no workflow engine, agent framework or model as a requirement for calling the step.
depends_on: [BO-4500a-4]
doc_links:
  - path: docs/analysis/2026-09-25-duplication-clusters-that-produce-known-issues.md
    relationship: describes
    status: exists
  - path: docs/architecture/agent_delivery_workflows.md
    relationship: describes
    status: exists
    relevance: "Link the reference page from here."
assigned_agent: documentation-expert
estimated_complexity: S
it_requirements:
  - >-
    Place the page under docs/reference/ (e.g. docs/reference/shared-commit-step.md, name
    provisional) with the repo's doc frontmatter, and link it from
    docs/architecture/agent_delivery_workflows.md and docs/architecture/components/build-orchestration.md.
  - >-
    The page documents the reason_code enumeration and its family partition from the step's own
    published source as built, and states the caller rule per family: policy_* -> stop, do not
    retry, fix the request; step_* -> the step could not finish, the caller may retry (the step
    never does); check_* on hook_failed -> act on remedy.disposition; nothing_changed ->
    nothing_to_commit, never read as a success where work was expected. It must not copy an enum
    that drifts from the step: it is written from the built step, and a reviewer checks every code
    on the page against the step's listing.
  - >-
    It documents remedy and handoff as the BO-3800a payload produced by remedy_handoff.py (one
    shape), and the layering: the step answers; the commit agent relays; the depth-0 caller engages
    a specialist on a handoff at most once and re-offers the identical path list and message file.
  - The four example answers are real outputs captured from the built step, not hand-typed JSON.
  - Written after the step is built (BO-2200d timing); names no workflow engine, agent framework or model as a requirement.
