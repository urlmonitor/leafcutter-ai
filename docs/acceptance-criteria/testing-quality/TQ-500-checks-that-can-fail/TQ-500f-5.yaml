criteria: |
  Given a reader opens the test-angle taxonomy to learn why a green test that
    reaches the real code can still be useless,
  When they read the taxonomy and its failure catalogue,
  Then they find a discrimination-shaped failure family beside the existing
      wiring-shaped one, with one catalogue entry for each of the adopter's
      incidents 1, 2, 3, 4 and 8, each giving the mechanism, the cost, and
      which of the three questions or checklist items would have caught it,
    And they find "discrimination" in the taxonomy table as a conditional
      angle, with when it fires (the work fixes a bug, or adds or changes a
      condition of a gate or guard, or a test entry carries must_catch), the
      question it answers (would this test go red under a named plausible
      wrong version, not only when the code is absent), and the rule that it
      never takes one of the four slots by default and may share a test with
      criterion,
    And every count of angles on the page reads eight, so no sentence
      contradicts the lists of permitted kinds,
    And the page states that incidents 5, 6 and 7 belong elsewhere — 5 to
      skip hygiene, 6 to process, 7 to where the test database address comes
      from — rather than leaving them out without a word,
    And the catalogue says the incidents come from one adopter's written
      record and were not re-verified against its history,
    And the requirement-schema reference lists "discrimination" among the
      permitted test kinds and describes must_catch: optional, a non-empty
      list of non-empty strings, copied word for word onto the generated
      work's test requirements, and expected on bug-fix and gate requirements.
