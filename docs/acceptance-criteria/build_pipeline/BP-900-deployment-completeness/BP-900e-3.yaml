title: "A source-only script that is neither registered nor referenced is never flagged"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: not_started
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900e.yaml"
criteria: |
  Given the source tree contains package-development-only scripts such as
    scripts/build.py and scripts/epic_lock.py
  And neither script is registered in the commit-guardian hook registry
  And neither script is referenced by any deployable agent or skill template
  And neither script has a copy under templates/scripts/
  When the registry-completeness check runs at the finalize merge gate
  Then neither scripts/build.py nor scripts/epic_lock.py appears in the
    promised-but-undeployed list
  And the check does not fail the merge gate on account of these source-only
    scripts
  And the only scripts ever evaluated by this check are those that are
    registered in the hook registry OR referenced by a deployable template —
    a script that is promised by neither source is out of scope and is never
    flagged
depends_on:
