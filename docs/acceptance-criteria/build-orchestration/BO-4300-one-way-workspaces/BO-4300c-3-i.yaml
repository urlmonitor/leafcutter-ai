  contract: The workflow acceptance predicate.
package_surface: false
it_requirements:
- plan-feature fails when the workspace step reports success with output that is not one JSON object (the
  incident's script path), quoting the output; the parse failure is never caught into 'no workspace'.
- The main-copy check snapshots a real temporary project's working files and branches around the harness
  run.
- Proof runs the workflow under unit_tests/_workflow_engine_harness.py -- the deployed copy the build
  produces, so the build's workflow transform is exercised -- with label-scripted agent replies, and asserts
  on the RECORDED dispatch list, never on workflow source text. The harness must be able to model a workspace
  step that declines its task, answers in prose, answers exit 0 with a non-JSON path, or answers JSON
  without status (F13); extending the harness for this is in scope of the first AC that needs it.
- Workflow edits are made in templates/workflows-js/*.js and reach .claude/workflows/ only through the
  build; the deployed copy is what the tests run.
test_required: true
test_spec:
- name: test_success_with_script_path_output_ends_plan_feature_in_failure
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: Started from the workspace parent with a workspace step returning exit 0 and a file path,
    plan-feature ends with status error naming 'no valid answer' and quoting the path.
- name: test_invalid_answer_is_not_treated_as_no_workspace_needed
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: No recorded dispatch runs in the current checkout or omits a workspace location.
- name: test_main_copy_working_files_unchanged_after_the_session
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: real_artifact
  description: The temporary main copy's working files and branches are identical before and after.
- name: test_no_authoring_dispatch_is_recorded
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: The dispatch list contains no product-owner, business-analyst or it-po dispatch.
test_rationale: The 2026-09-25 incident was a perfect-enough maker with a caller that carried on, and
  every source grep of plan-feature.js would have passed. So the assertions are made on the recorded dispatch
  list of a real workflow run with scripted hostile answers, which is the only place 'no later step was
  dispatched' can be observed.
