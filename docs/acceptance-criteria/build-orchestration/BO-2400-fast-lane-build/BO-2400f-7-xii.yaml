notes: |
  Raised by the BA's own follow-up on the 2026-11-16 records: docs/how-to/fast-lane-build.md
  covers the gate halts only, so an operator meeting the 2026-11-16 halt shapes has no page
  that says what each means or what to do.

  NOT A DUPLICATE OF BO-2400a-6-i. That record (todo) documents the command-step-runner, the
  declined-step halt and its remedy, and launching from any checkout. This record documents the
  three halts BO-2400f-7-vii and BO-2400f-7-ix add beside it, and the reconciliation of
  BO-2400f-10-iv. It depends on BO-2400a-6-i so the declined-step section exists before these
  are written next to it.

  PLACEMENT. Under BO-2400f-7, the claim step whose children define these halts. L2 records
  carry no child cap, so a twelfth child is allowed; BO-2400f is at its child override (13) and
  BO-2400a-6's sibling tree is about a different change.

  Document only what is built. Halt-kind names and field names are taken verbatim from the built
  lane, never from these records' drafts.
