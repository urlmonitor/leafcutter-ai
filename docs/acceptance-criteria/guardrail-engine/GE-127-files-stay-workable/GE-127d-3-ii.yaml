id: GE-127d-3-ii
title: "A file that cannot be read as its own language is reported as could-not-measure and refused, never measured raw or as zero"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a staged covered file whose content cannot be split into the tokens of its
    language — a JavaScript file ending inside an unclosed `/*`, a Python file
    ending inside an unclosed triple-quoted string, a SQL file ending inside an
    unclosed dollar-quoted body, or a shell file ending inside an unclosed quote,
  When the author performs an ordinary commit,
  Then the outcome carries an INDETERMINATE line naming the file and stating that
    its content could not be read as that language, the run exits with status 2,
    and the commit does not complete,
  And no length is stated for that file, it is not listed among files within
    their permitted length, and it is not measured by counting every line or by
    counting none,
  And the outcome is distinguishable from the refusal of a file measured and found
    over its limit,
  And given the previous version of a covered file cannot be read as its
    language while the staged version can,
  When the author performs an ordinary commit,
  Then the previous length is reported as unresolvable in the same vocabulary used
    when no previous length can be established, and the commit does not complete,
  And given the same file is corrected so its content can be read as its language,
  When the author performs an ordinary commit,
  Then the file is measured and judged by the ordinary rules,
  And given a covered file written in syntax its language accepts — a JavaScript
    template literal nesting another template literal inside `${ }`, optional
    chaining, a regular-expression literal containing `/*`, or a Python f-string
    holding `#` inside a replacement field,
  When its length is measured,
  Then a length is stated and no INDETERMINATE line is produced.
depends_on:
  - GE-127d-3
  - GE-127a-1-i
  - GE-127b-1-i
doc_links:
  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127d-3.yaml
    relationship: parent
    status: exists
  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127a-1-i.yaml
    relationship: related
    status: exists
    relevance: >-
      THE VOCABULARY TO REUSE. A file whose length cannot be established is refused and
