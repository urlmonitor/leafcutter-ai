test_rationale: >-
  The defect is a conflation of two different facts -- 'I could not read the record' and
  'there is no record' -- so every test is built to tell them apart by driving the real
  workflow code with a stubbed agent() rather than grepping the template for a status
  string. The prose-then-JSON case proves the retry recovers a live run; the prose-always
  case proves the unreadable outcome is distinct and fail-closed; the exists:false case is
  the discrimination guard that keeps a genuine absence reporting nothing_to_resume; the
  distinct-labels case is what defeats the harness cache that made the live failure repeat
  deterministically; and the peek case covers the second call site, whose unreadable reply
  would otherwise re-dispatch the author over approved drafts.
