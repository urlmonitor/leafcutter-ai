risk_surface: contract_boundary
test_required: true
test_rationale: |
  A warning period with no defined end is a warning forever, and a warning period ended by a
  date is ended whether or not the backfill happened. The load-bearing assertion is the refusal
  case: with one artifact left on the old version, tightening must be refused and must name that
  artifact. Asserting only the success case would pass against an implementation that always
  tightens.
test_spec:
  - name: test_tightening_is_refused_while_any_artifact_is_on_the_older_version
    target_dir: unit_tests/product_truth/
    description: "With one artifact left on the older shape version, the attempt to tighten is refused and names that artifact."
    type: integration
    angle: failure
    framework: unittest
  - name: test_tightening_is_permitted_once_every_artifact_declares_the_new_version
    target_dir: unit_tests/product_truth/
    description: "With the backfill complete, the bound tightens and an exceeding artifact stops the caller."
    type: integration
    angle: criterion
    framework: unittest
  - name: test_a_date_alone_does_not_tighten_a_bound
    target_dir: unit_tests/product_truth/
    description: "Advancing the clock past any configured date does not tighten a bound while artifacts remain on the older version."
    type: unit
    angle: boundary
    framework: unittest
notes: |
  Named mutation for the last clause: replace the population test with a date comparison. The
  first two tests still pass on a store that happens to be fully backfilled; only the third
  turns red. That is why the clause is asserted separately.
