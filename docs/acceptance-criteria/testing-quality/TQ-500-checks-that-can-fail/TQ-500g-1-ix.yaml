test_rationale: Every clause is deterministic, so every entry runs the real writer against a hand-written
  reply fixture. The fixture is a temp git repo holding refresh_config.py ("if refresh_due and retry_due"
  once, "retry_due" three times), settings.py and tests/test_refresh_config.py, plus a temp AC store whose
  entries for TQ-9101 owe the nine names, "revert the fix" and "the fix undone", with in_scope_files putting
  refresh_config.py and the test file in scope for every name and settings.py for "retry on a timeout" only,
  and whose entries for TQ-9102 carry no must_catch. Assertions cover the manifest entries, the altered
  copy byte for byte, the list's JSON, and git status. No LLM is involved. The discrimination, failure and
  seam entries carry the non-obvious rules (computed diff, exact owed names, claim stripping, out-of-scope
  refusal, one shared reading for list, write and runner). The two reachability entries go through the
  CLI steps the routes call; the write one hands the printed path to the runner. The criteria clause "the
  route sends this list to the preparer unchanged" is route wiring; its test belongs to TQ-500g-1-v, -vi
  and -vii, and no entry here tests it. Red baseline caveat. The writer is a new module, and an entry
  with must_catch has an ImportError/AttributeError-only red refused by the red-baseline reader. Follow
  the convention TQ-500g-1-i's build used for its new module, so these entries go red on behaviour.
