assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "Implemented as a slash-command skill (SKILL.md under templates/skills/) following the existing plan-feature/create-ac workflow pattern; if a deterministic resolution step is needed it lives in a depth-0 workflow body, not inline in a sub-agent."
  - "Scope resolution must accept all three target forms (epic folder path, feature branch name, changed-file set) and normalize them to one resolved-scope shape that the dispatch step consumes."
  - "Resolved scope must capture changed files relative to the repo root (absolute or repo-root-relative paths), never paths dependent on a transient working directory."
  - "Must not invoke /build-feature, a build supervisor, or any test-authoring agent as part of resolving or running the review."
  - "Must surface a human-readable confirmation of the resolved scope before dispatch so the user can see what will be reviewed."
delivers_to:
  agent: llm-expert
  contract: "Resolved review scope object: { feature_id|epic_folder, changed_files: [repo-root-relative path], behavior_summary: string }, consumed by the three-reviewer parallel dispatch step (BO-1300a-2)."
