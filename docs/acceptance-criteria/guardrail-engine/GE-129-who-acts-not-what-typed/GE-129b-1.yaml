notes: |
  (a) and (c) are the two observed false positives, verbatim in shape. (e) carries the fast lane's
  own commit form as text, so a fix to GE-129b-2 that recognises `git -C <path> commit` anywhere in
  the string reddens this record. (g) is a git subcommand whose name begins with "commit" but does
  not record a commit; a prefix match reddens it.

  The second scenario matters because GE-129d turns every recognised top-level commit into a
  person's prompt. A mention mistaken for a commit there costs a prompt on every search, which is
  the regime that gets switched off.

  Where the quoted text is run by a shell (`bash -c '...'`) it is a commit, not a mention:
  GE-129b-2-i.

  declares_side_effect: false -- the Then clauses assert that commands run and nothing is refused.
