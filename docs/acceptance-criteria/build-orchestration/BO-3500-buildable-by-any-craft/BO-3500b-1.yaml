notes: |
  THE CRITERION THE WHOLE L0 IS MEASURED BY. Routing every member correctly
  (BO-3500a-1) and proving every non-code deliverable (BO-3500c) are both necessary
  and neither is visible to an operator. This is the one an operator can check: aim at
  a mixed area, get a pull request containing all of it.

  WHY THE SINGLE PULL REQUEST IS PART OF THE CRITERION AND NOT AN IMPLEMENTATION
  CHOICE. A run that produced the page in one pull request and the code in another
  would satisfy "every member was produced" while destroying the property the operator
  wanted: that the documentation and the code it documents are reviewed, merged and
  reverted as one thing. Splitting them re-creates the drift this component keeps
  finding — a page describing code that never landed, or code landing without the page
  that was asked for.

  THE SECOND SCENARIO is the anti-quiet-narrowing clause. Its sibling BO-3500b-2 covers
  what happens when a member fails; this one covers a member that simply does not
  appear in the ending at all, which is how a dropped member actually looks from
  outside. BO-2400f-12 makes the same point for the refusal path ("a member removed
  from the set and left todo is indistinguishable, from the store, from a member that
  was never asked for"); the same is true of a member removed from a run that
  succeeded, and there it is far harder to notice.

  TESTABILITY. Execute a run over a store fixture whose resolved group genuinely mixes
  kinds, then assert on the artifacts on disk and on the contents of the single pull
  request the run opened. Counting hand-offs is not sufficient evidence for this
  criterion — it is the artifacts arriving together that is being claimed.
