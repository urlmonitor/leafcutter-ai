assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "GAP RESOLUTION (where the gate lives) — five touchpoints, all mandatory, per the create-hook skill: (1) hook script templates/scripts/commit_guardian/check_pattern_rule_duplication.py; (2) a top-level config section `pattern_rule_duplication` in templates/scripts/commit_guardian/commit_guardian.json; (3) a hooks_manifest.hooks entry with id `check-pattern-rule-duplication` and entry `python {{config.output_root}}/scripts/commit_guardian/run_hook.py {{config.output_root}}/scripts/commit_guardian/check_pattern_rule_duplication.py`; (4) constants for every config key in templates/scripts/commit_guardian/config.py; (5) a row in the README commit-guardian hook table."
  - "DEPLOY-MANIFEST RULE (repo-wide, non-negotiable). build_commit_guardian() in scripts/build_phases.py rglob-copies every file under templates/scripts/commit_guardian/, so a self-contained hook deploys automatically. But ANY module the hook imports from OUTSIDE that directory — e.g. anything in scripts/ac_store/ — MUST be added to that phase's hardcoded `deploy_map` in scripts/build_phases.py, or the deployed hook dies with ModuleNotFoundError at commit time. This is the exact failure done_proof.py hit. Prefer keeping the hook self-contained; if a shared helper is unavoidable, put it in templates/scripts/commit_guardian/ as a leading-underscore module."
  - "Verify every name in the hook's `from config import ...` line exists in BOTH templates/scripts/commit_guardian/config.py and the live scripts/commit_guardian/config.py (create-hook Step 5a). A missing constant is an ImportError at hook startup in every adopter project."
  - "THE GATE MUST NOT HARDCODE THE THRESHOLD. It reads the canonical value from templates/skills/authoring-patterns/SKILL.md's single declaration line and flags any OTHER file declaring a recurrence threshold. A hook that hardcodes 3 becomes the second copy it exists to prevent, and would keep passing after the skill changes to 2."
  - "Scope of scanned files must be data-driven, not a hardcoded filename list: the config section declares the guarded globs (templates/agents/*.md, templates/skills/*/SKILL.md, templates/workflows/*, docs/how-to/*.md) and the single exempt path (the authoring-patterns skill). A new agent template must inherit the rule automatically."
  - "The three criteria scenarios are three distinct verdicts — reject / accept-skill-edit / accept-plain-reference. The reference case is the false-positive risk: a line that merely names the skill, or a load instruction, carries no rule value and MUST pass. Discriminate on the presence of a rule VALUE (a number, or a stated test condition), not on the presence of the words."
  - "Run only over staged files (git diff --cached --diff-filter=ACMRT), as a forward ratchet — the hook must not retroactively fail the existing store. Precondition: ACS-500g-3 removes the pre-existing 'two or more pages' threshold copy in templates/agents/business-analyst.md §3a step 3 before this gate is switched on."
  - "Error-handling policy applies (CLAUDE.md rules 1-4, enforced by ruff E722/BLE001/TRY): wrap the subprocess and file reads, never bare-except, log-or-reraise. Exit 0 clean / 1 on violations; the message must name the duplicated rule, the offending file, and the skill as the one place it belongs."
  - "After adding the manifest entry run `python scripts/build.py --target-dir . --force` and confirm `check-pattern-rule-duplication` appears in the regenerated .pre-commit-config.yaml — an entry present in commit_guardian.json but absent from the generated config is an inert gate."
delivers_to:
  agent: llm-expert
  contract: "A deployed pre-commit gate `check-pattern-rule-duplication` that fails when a pattern-worthiness rule VALUE appears in any guarded file other than templates/skills/authoring-patterns/SKILL.md, and passes for skill-only edits and for value-free references to the skill. This is the mechanical guarantee that the ACS-500g-3 single-source arrangement cannot silently drift."
expects_from:
  - ac_id: ACS-500g-3
    contract: "The single-source arrangement: rule values removed from templates/agents/business-analyst.md and templates/agents/pattern-steward.md, leaving value-free load-the-skill references, so the gate can be enabled without pre-existing violations."
  - ac_id: ACS-500g-2
    contract: "A single canonical, machine-parsable recurrence-threshold declaration line in templates/skills/authoring-patterns/SKILL.md that the hook parses as the authoritative value instead of hardcoding it."
