test_spec:
  - name: test_backslash_link_in_adr_table_is_refused_with_line_and_text
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "Temp git repo with a staged docs/INDEX.md whose ADR row is [docs\\architecture\\adrs\\ADR-001-self-hosting-boundary.md](docs\\architecture\\adrs\\ADR-001-self-hosting-boundary.md); runs the check; asserts a non-zero exit and that the output names docs/INDEX.md, the row's line number, the offending text, the word '/' requirement and the regenerate command."
  - name: test_absolute_and_file_url_targets_are_refused
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Parametrised over C:/Users/alice/project/docs/glossary.md, /home/alice/project/docs/glossary.md and file:///C:/x: each as a link target is refused."
  - name: test_forward_slash_relative_map_passes
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "A map whose every link is a forward-slash relative path exits 0."
  - name: test_check_reads_staged_map_not_working_tree
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "Stages a backslash map, then overwrites the working-tree file with a clean map; asserts the check still refuses (it judged the staged version)."
  - name: test_hook_registered_after_transform_doc_index
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Loads templates/scripts/commit_guardian/commit_guardian.json and asserts the new hook entry exists, is not fail-open, matches docs/INDEX.md, and appears after transform-doc-index in hooks_manifest order."
test_rationale: "The behaviour is a commit refusal over the STAGED map, so the core tests run the hook against a real temp git index; a pure-function test of the link parser would pass while the hook reads the wrong version or runs before the refresh. The manifest-order test pins the after-refresh clause."
notes: |
  Must inspect the map as it will be committed — i.e. after the automatic
  refresh — otherwise a stale committed map passes while the refreshed one is
  broken. Whether this lives in the existing refresh step or as a separate
  check is the IT PO's call (per KM-300c notes). Must ship after or with
  KM-300a-1, or it refuses every commit made on Windows.
