    relationship: constrains
    status: exists
    relevance: "The AC that narrows this one. It rules that an explicitly authored proof demand outranks any inference drawn from the shape of files_touched, so this criterion governs only the no-authored-demand case. Read it before implementing the omit branch."
  - path: docs/architecture/components/ac-driven-dev.md
