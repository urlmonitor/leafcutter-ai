notes: |
  This is the seam between the two L1s, made explicit. GE-120b removes the REASON a check
  could not run; GE-120a governs what happens when it still cannot. There is a case that
  GE-120b cannot fix by resolution alone — a workspace with nothing to resolve TO — and this
  AC pins that the case falls through to GE-120a rather than through a crack between them.

  Without this AC, an implementer could satisfy GE-120b-1 by making resolution succeed in the
  linked and buildable cases and leave the bare case exiting 0 exactly as before, with both
  parent ACs' letter met.

  IT-PO (2026-08-14): the never-built vs built-but-incomplete classifier is shared with
  GE-120d-2-i, which draws the same line on the set-up side. Build it once.
