id: TQ-600a-13-ii
components:
  - testing_quality
title: "The nightly run executes the excluded tests and re-runs only the failures, once, before calling the night red"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the tests the default run does not collect — the population TQ-600a-13 and
    TQ-600a-13-i define, which this record references and does not redefine,
  And the measured reason that population runs on a schedule rather than on every pull
    request: TQ-600a-9's sixteen verification tests cost about 667 s per run while the
    refactor they verify saves about 190 s, so on the per-PR path they make the suite
    about 477 s slower, and they are expensive because they are honest — one builds a
    second worktree at the merge-base to get a same-sitting ratio — so they cannot be
    made cheap without becoming vacuous,
  And the property that makes a single failure weak evidence: several of those tests
    assert same-sitting timing ratios on a shared, variably loaded host, and a nightly
    run that goes red on noise is ignored within a week, which is coverage deleted by a
    different route,
  And the opposite property that makes a silent retry dangerous: TQ-600a-13-i records
    that the shared-layout tests in this population guard a corruption that presents
    nondeterministically, so a failure that disappears on retry may be the defect itself,
  When the scheduled run starts once per day with no human action, executes that
    population, and some of its tests fail on the first execution,
  Then it executes again exactly the tests that failed — each once, and no test that
    passed on the first execution,
  And a test that fails on both executions makes the night red, and the night's result
    names that test by its full node id,
  And a test that fails and then passes leaves the night green, and the night's result
    names it as passed-on-retry, so it is distinguishable from a test that passed the
    first time rather than absorbed into the green total,
  And a night with no first-execution failure is green and performs zero re-executions,
  And the scheduled run's own conclusion is failure on a red night and success on a green
    one, which is the "turns the invoking job red" that TQ-600a-13-i requires of the
    cadence,
  And each of those outcomes is demonstrated by executing the run's selection-and-verdict
    behaviour against a population whose tests are made to pass, fail, or fail-then-pass,
    never by reading the workflow definition for a retry setting.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-i
