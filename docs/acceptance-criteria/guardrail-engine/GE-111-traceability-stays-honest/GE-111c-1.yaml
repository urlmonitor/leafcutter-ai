notes: |
  Mirrors the established staged-files-only scoping precedent in the GE/ACS hooks
  (check_ac_circular_deps reports only cycles involving a STAGED AC;
  check_ac_schema Phase 2 inspects diff-filter M staged files; ACS-400e-2 "only
  staged AC YAML files are inspected"). The trigger set is the source files in the
  commit; the ACs to evaluate are those whose implemented_by references one of
  those files (or a symbol within one of them).

  IT-PO enrichment (2026-06-22): pinned the scope-membership rule (file portion
  of implemented_by, anchor stripped, pre-rename old path included) and the
  read-only single-pass store scan within the latency budget.
