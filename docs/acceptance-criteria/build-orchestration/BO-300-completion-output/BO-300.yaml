criteria: |
  Given a build workflow (build-epic.js or build-single-ticket) completes successfully,
  When the completion output is displayed to the user,
  Then the output contains a clear summary of what was built,
  And the worktree path where the changes live,
  And concrete suggestions for manual testing,
  And a copy-pastable /finalize-feature command with the branch or epic name pre-filled,
  So the user never has to guess what happened, where to look, or what to type next.
