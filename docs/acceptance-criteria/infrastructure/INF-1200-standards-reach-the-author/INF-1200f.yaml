    relevance: >-
      THE HARDEST BOUNDARY IN THIS TREE — READ BEFORE DECOMPOSING. GE-127d owns
      one gate's self-description: its published account of what it covers and
      how it measures matches what it does. This owns a different pair of
      surfaces — the figure sitting in a specialist's own working brief versus
      the figure applied to the result. They come apart cleanly in both
      directions: accurate published documentation alongside a stale figure in
      a brief satisfies GE-127d and fails this; a faithfully carried figure
      whose published description is stale fails GE-127d and satisfies this.
      Neither may be closed as a duplicate of the other.
