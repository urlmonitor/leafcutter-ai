it_requirements:
  - "THE KIND SET IS READ FROM config/diagram_types.json AT RUN TIME, BY BOTH THE MEANS AND THE OBSERVATION. No list of kinds may be written into either. A hard-written list is correct on the day it is written, survives review, and stops discriminating the moment the vocabulary moves — and this vocabulary has already moved once, which is how it came to contain a deprecated alias. The falsifying arm is a movement test: add a kind to the declaration the run resolves, change nothing else, and the covered set must grow by itself."
  - "THE DEPRECATION MARKER IS DATA, NOT A NAME. `dataflow` carries `_deprecated: true` and is described as a legacy alias for `data_flow`. Treat 'superseded' as the presence of that marker, never as a match on the literal string `dataflow`, so a future alias inherits the rule automatically. The alias is COVERED by producing the document its successor's rules require — including the successor's `requires_frontmatter` obligation — never by skipping it. Note the declaration's own inconsistency: `dataflow` declares `requires_frontmatter: []` while `data_flow` declares `[related_code]`, so reading the obligation off the alias rather than off its successor silently drops the obligation."
  - "`none` IS IN THE DECLARATION AND IS NOT A DIAGRAM KIND. Decide explicitly whether the enumeration excludes it, and derive that exclusion from a data property of the entry rather than from its name. An enumeration that silently skips it by literal name is the same defect as a hard-written list, one entry wide."
  - "MEASURED — THE OBLIGED-FIELD CLAUSE CANNOT BE OBSERVED THROUGH THE CHECK SET AND MUST BE ASSERTED DIRECTLY. `requires_frontmatter` is declared per kind in config/diagram_types.json (data_flow requires related_code, user_flow requires related_surfaces, agent_flow requires related_agents) and is enforced by NOTHING. Verified in this worktree: the identifier `requires_frontmatter` appears in exactly one place outside the JSON — a docstring in templates/scripts/commit_guardian/diagram_type_validators.py — and `validate_diagram_type` validates the kind NAME against the vocabulary and returns. So a document of an obliging kind that simply omits the field passes the entire check set today, and an observation built on 'the checks passed' reports a green that says nothing about the third clause. Assert the clause against config/diagram_types.json directly. Closing the enforcement gap is the guardrail surface's work and is outside INF-1300's fence; this record must not close it by adding a check."
  - "THE SWEEP IS OVER KIND x TIER PAIRS, NOT KINDS. check_mermaid_complexity applies DIFFERENT metrics and thresholds per mermaid diagram family — nodes and edges for flowchart and C4, participants for sequence, and separate counts for erd, state and class. A skeleton comfortably inside one family's threshold can exceed another's, which is the concrete reason acceptance does not generalise from the demonstrated kind. Enumerate the reachable pairs from the tier structure and the kind declaration, and fail rather than skip when a pair cannot be produced correctly."
  - "A KIND THAT CANNOT BE PRODUCED CORRECTLY IS A FAILURE, NOT AN OMISSION. The sweep must report per-pair results and must not be able to report 'all passed' while some pairs were never attempted; the count of pairs attempted must equal the count derived from the declaration."
  - "All of INF-1300a-1's vacuous-green guards apply to every hook invocation in the sweep, and matter more here because the sweep runs the same hooks many times: a harness misconfiguration that silences one hook silences it for every pair at once."
  - "Error handling per the project error-handling policy (CLAUDE.md rules 1-4)."
