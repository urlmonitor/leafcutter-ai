id: TQ-500f-3-v
components:
  - testing_quality
  - build_orchestration
title: "A gate's real answer is read even when the relayed text carries a log line before it or an exit line after it, and a reply with no answer still halts"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a build route (/build-feature, the single-ticket route, or /build-epic)
    runs a command step through an executor agent, and the command prints
    exactly one JSON object as its answer on one line,
  When the executor relays the command's output to the route as one of these
    texts:
      R1: the answer alone,
          '{"gate_passed": true, "verified": true, "red": [3 tests]}',
      R2: the same answer followed by a line "exit: 0",
      R3: a log line "base ref HEAD: 0 names declared, 14 derived" followed by
          the answer '{"owed": [14 items], "error": null}',
      R4: a log line before the answer and "exit: 0" after it, with the answer
          line ending in a carriage return,
  Then in each of R1 to R4 the route reads that one line as the step's answer
      and acts on it exactly as it acts on R1 today:
        a red-baseline answer with gate_passed true dispatches the coder,
        a wrong-version list answer with an owed array and error null goes on
          to the next wrong-version step with that owed array unchanged,
    And the lines around the answer are never read as part of it, and the
      "exit: N" line never stands in for, or overrides, the answer's own
      fields,
    And the same relayed text gives the same reading in /build-feature and in
      the single-ticket route, and for the wrong-version recover step and the
      gate-marker steps also in /build-epic, which has no list step.

  Given the relayed text holds a real answer that is a failing verdict, for
    example a log line followed by
    '{"gate_passed": false, "reason": "absence_only_red", ...}' and "exit: 1",
  When the route reads it,
  Then the ticket halts with that verdict's own reason and the tests it names,
      exactly as it does when the same verdict arrives alone,
    And the halt does not say the reply could not be verified.

  Given the relayed text carries no JSON object answer:
      N1: a refusal in prose ("Running arbitrary shell commands is not my
          role"), with no JSON line,
      N2: empty text,
      N3: a line that is a JSON array, '[{"gate_passed": true}]',
      N4: a truncated object, '{"gate_passed": tru',
      N5: an answer that shares its line with other text,
          'result: {"gate_passed": true}',
      N6: two different lines that are each a JSON object,
  When the route reads it,
  Then no answer is read, and the route halts that ticket fail-closed exactly
      as it does today: for the red-baseline step no coder is dispatched and the
      halt says the red-baseline gate reply could not be verified; for the
      wrong-version list step no later wrong-version step and no commit follows,
      and the halt names the list step,
    And none of N1 to N6 is ever read as gate_passed true, as an empty owed
      list, or as "nothing owed".
