title: "Child-count limit checks count children from parent-pointer metadata"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given a parent requirement with UID 10 that has four children, each declaring
    parent-pointer UID 10,
  When the child-count limit check runs,
  Then it reports the parent as having exactly four children, counted by the
    number of requirements whose parent-pointer field holds UID 10,
  And the count is not derived by parsing requirement names,
  And after one of those children is re-homed under a different parent (its
    parent-pointer changed away from UID 10), the next check reports UID 10 as
    having three children with no rename of any requirement.
