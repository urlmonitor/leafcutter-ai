notes: |
  REVISED 2026-10-09: the party is the restructuring specialist, no longer python-coder.
  This record is now blocked on INF-800f-1, through BO-3800b-3, as the restructuring
  instance always was.

  THE THIRD ARM IS WHY THIS IS SEPARATE FROM BO-3800d-1. Complexity has escape hatches that
  file size does not: skip the hook, raise the limit, or rewrite the baseline the ratchet
  compares against. Any of them makes arm one pass with the function unchanged.

  WHAT THIS DOES NOT CLAIM. That every function can be brought under its ceiling. The
  promise is an honest stop.

  NAMED MUTATIONS.
  (1) THE QUIET SKIP: retry with check-complexity skipped. MUST GO RED: arm three. MUST
      STAY GREEN: arm two.
  (2) THE MOVED GOALPOST: record plan_batches' previous committed score as 31. MUST GO
      RED: arm three. MUST STAY GREEN: arm two.
  (3) THE SPENT QUOTA: engage the specialist bound times before re-judging. MUST GO RED:
      arm one's "not engaged again".
