it_requirements:
  - >-
    NO PACKAGE SURFACE — MEASURED, NOT ASSUMED, AND THE MEASUREMENT MATTERS TWICE HERE. This
    record adds no hooks_manifest.hooks id and no new top-level key on commit_guardian.json. Note
    the shape of its own fixtures: the transition arms EDIT hooks_manifest.hooks — adding an id to
    stage "the check begins to be reached", removing or disabling one to stage "no longer reached"
    — but those edits are made in a controlled copy for the duration of a paired run and reverted,
    never landed in the tracked declaration. A LANDED hooks_manifest addition WOULD be a watched
    list_ids entry; if any implementation here ends up adding one permanently, it has also
    answered BP-1600a-2's approved record and must be re-declared package_surface: true. It should
    not; registering a check is fenced out of this tree in both directions.
  - >-
    THE PROHIBITION, STATED OVER THE CARRIER'S INPUTS. The set of standards carried outward must
    be computed from the declaration and the ownership record alone. hooks_manifest.hooks, the
    emitted .pre-commit-config.yaml, any per-entry `enabled` flag, any exemption registry, and any
    census of which scripts are wired must not be inputs to it, directly or transitively. This is
    the single most likely coupling a competent implementer introduces in good faith: faced with a
    declaration containing standards, the obvious question is "which of these are real" and the
    obvious answer is "the ones with a check wired up". That filter is one condition long, it is
    defensible in review, and it silently reduces the audience of the whole capability to the
    standards that already had a gate — which is one cell of the grid, which is where the project
    started.
  - >-
    IT IS ALSO THE COUPLING THAT REBUILDS THE FAILURE THE TREE EXISTS TO FIX. If you are only told
    about standards whose gate runs, then the set of things you know is the set of things that can
    stop you, and "you find out when you are stopped" has been rebuilt one layer up with better
    manners. State this as the reason for the prohibition in the implementation notes so a later
    reader does not remove the constraint as redundant.
  - >-
    THE TRANSITION ARMS MUST BE CONTROLLED CHANGES, NOT OBSERVATIONS OF TODAY'S ACCIDENT — AND THE
    ACCIDENT IS MEASURED AND TEMPORARY. Measured in this worktree: hooks_manifest.hooks holds
    sixty-two ids, among which check-file-size appears and check_complexity, check_sql_complexity
    and check_folder_density do not — so one of the four standards with configured thresholds has a
    reached check and three have none. That asymmetry gives the first arm teeth today, and
    BP-1600a-2 is approved and will remove it. Build both transition arms as controlled edits to
    reachability made by the test, so the record stays able to fail after that lands.
  - >-
    WHAT IS STATED ABOUT A STANDARD MUST BE UNCHANGED ACROSS BOTH TRANSITIONS, ASSERTED AS CONTENT
    EQUALITY. Not "still present" — equal. A carrier that states the standard either way but adds
    "(enforced at commit time)" when the check is reached has made the telling depend on
    reachability in exactly the way this record forbids, and it passes a presence check.
  - >-
    FENCED IN BOTH DIRECTIONS, AND THE SECOND DIRECTION IS THE ONE THAT GETS FORGOTTEN. Nothing
    here may be discharged by registering anything: BP-1600a-2 owns whether a check is reached and
    it is approved and high-priority. Equally, nothing here may be made to WAIT on that work — the
    whole content of this record is that the telling is independent of it. An implementation that
    satisfies this record by causing the unreached checks to run has answered someone else's
    approved record and left this one untested.
  - >-
    CONSISTENT WITH INF-1200f-1 AND WITH INF-1200a-2, AND NEITHER MAY BE WEAKENED TO ACCOMMODATE
    IT. f-1 requires the figure in the brief and the figure applied to be one figure; it does not
    require that a figure be applied at all, so telling a specialist a standard whose check is
    unreached is one figure and no measurement, not two figures. a-2 fixes that what a specialist
    is told does not depend on anything HAVING HAPPENED and takes an unreached check as one such
    given; this fixes that the SET of standards carried does not depend on which checks are
    reachable, and adds the two transitions. One purity property in the carrier must satisfy both
    records rather than two conditions written in two places.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around the
    declaration and registry reads; log at WARNING or higher or re-raise; no bare or blind excepts.
    A manifest that cannot be read is irrelevant here by construction — if reading it can affect
    this code path at all, the prohibition above has already been violated.
test_spec:
  - name: test_inf_1200d_3_a_standard_with_a_reached_check_and_one_without_are_carried_alike
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      With two standards declared for two kinds of file that each have an assigned owner, where the
      project reaches a check for the first and reaches none for the second, build into a temporary
      target and read both owners' compiled briefs. Each has the standard governing its own kind of
      file stated, and the two are carried alike — same shape of statement, no qualifier attached to
      one and not the other. The unreached state is set up by the test rather than read off today's
      configuration.
  - name: test_inf_1200d_3_a_check_beginning_to_be_reached_does_not_change_what_its_owner_is_told
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Capture the owner's brief with the second standard's check unreached; make that check reached
      by a controlled edit to hooks_manifest.hooks in the copied package, leaving its declaration
      unchanged; rebuild and capture again. What the brief states about that standard is UNCHANGED
      — asserted as content equality, not as still-present, so a carrier that appends "(enforced at
      commit time)" fails here rather than passing.
  - name: test_inf_1200d_3_a_check_ceasing_to_be_reached_does_not_change_what_its_owner_is_told
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      The symmetric transition. Make the first standard's check no longer reached — by removing its
      manifest entry or disabling it, both of which are real reachability mechanisms in this project
      — with its declaration unchanged, rebuild, and assert content equality against the earlier
      brief. Two transitions in opposite directions are what make the independence observable once
      today's declared-but-unreachable fixture disappears.
  - name: test_inf_1200d_3_the_reachability_filter_injection_reds_all_three_arms_and_leaves_every_arm_of_d_1_green
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      THE BA's NAMED MUTATION, CARRIED VERBATIM AND OBSERVED AS ONE FOUR-WAY EXPERIMENT. MUTATION:
      carry outward only those standards whose check the project currently reaches. Under that
      injection: the first arm must go RED, because the standard whose check is unreached does not
      reach its owner while the other does; the begins-to-be-reached arm must go RED, because what
      the owner is told CHANGES when the check starts running; the no-longer-reached arm must go
      RED, because what the owner is told changes again when it stops; and every arm of INF-1200d-1
      must STAY GREEN, provided the newly declared standard used there has a reachable check. All
      four outcomes must be observed together and all must revert. THE GREEN OUTCOME MATTERS: this
      mutation produces a delivery that is fully general over standards, walks the declaration
      properly, and is still wrong — which is precisely why the coupling cannot be left to be
      noticed. An injection run that also reddens d-1 is a FAILURE of this descriptor.
  - name: test_inf_1200d_3_the_three_unreached_standards_reach_their_owners_against_the_real_configuration
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      AGAINST THE PROJECT AS IT STANDS, WHILE THE FIXTURE LASTS. Three standards with configured
      thresholds have no entry among the sixty-two ids in hooks_manifest.hooks and are therefore
      reached by nothing; one, the size limit, is reached on every commit. After a real build, the
      three unreached ones are stated to the owners of the kinds of file they govern exactly as the
      reached one is. This descriptor is expected to lose its fixture when BP-1600a-2 lands and must
      then be retired in favour of the two transition arms — record that expiry in the test's own
      docstring rather than letting it silently become a tautology.
test_rationale: |
  A single run cannot distinguish "carries all declared standards" from "carries the reachable ones"
  unless a declared-but-unreachable standard happens to be present. Three are today — the
  cyclomatic-complexity score, the database-code score and the folder-crowding count all have
  configured thresholds and no entry among the sixty-two hooks_manifest ids — so the first arm has
  teeth immediately. But BP-1600a-2 is approved and will make them run, at which point that fixture
  evaporates and only the transition arms remain able to fail. Both transitions are therefore built
  as controlled edits to reachability made by the test, and the descriptor that uses today's
  configuration carries its own expiry note.

  The transition arms assert CONTENT EQUALITY rather than continued presence. That is the difference
  between this record and "the standard is carried either way": a carrier that states the standard
  in both states but appends an enforcement qualifier when the check is reached has made the telling
  depend on reachability, and it passes every presence check.

  The BA's mutation is carried verbatim and its stay-green half — every arm of d-1 — is asserted
  explicitly. That green is the reason this is a separate record rather than a line in d-1: the
  injected delivery is fully general over standards, walks the declaration properly, and is still
  wrong. An injection run that reddens d-1 too means the fixture is not isolating the coupling and
  is a failure of the descriptor.

  No descriptor inspects whether a carrier function consults a manifest. Per CLAUDE.md "Gate /
  Workflow ACs — Verify Behaviorally, Not by Grep", a source read stays green on a carrier that
  reaches the same fact transitively, and the transitive route is the one a good-faith implementer
  actually takes.
