notes: |
  THE TWO SIGNALS, DELIBERATELY NOT CONFLATED. The parent L1 named two candidate
  ways to detect a suppression that is not doing what its author thinks: the shape
  of the entry, decidable when it is read, and the fact that it matched nothing
  during a run, decidable only afterwards. This L1 acts on the first and
  deliberately declines the second, and this criterion is where that decision is
  written down and made testable rather than left as an omission a later change
  could quietly reverse.

  WHY THE SECOND SIGNAL IS REJECTED FOR NOW, in three parts: it is not evidence of
  an error at all (a stale suppression is untidy, not wrong); the base rate is
  overwhelming, because a commit-time scan looks at a handful of staged files while
  the allowlist covers the whole repository, so nearly every entry would report
  every time; and a warning that is usually wrong destroys the credibility of the
  warning next to it that is always right.

  NOT CLOSED FOREVER. A periodic report of entries that have not matched in a long
  time, run deliberately rather than on every commit, is a reasonable separate
  feature. It is not this one, and it must not be delivered through this warning.

  THE THIRD ARM IS THE DISCRIMINATOR. Both other arms are satisfiable by a
  do-nothing implementation. Placing an unmatchable entry and two never-matched
  entries in the same run, with no findings anywhere, is what proves the rule keys
  on the entry rather than on the outcome.

  IT-PO TECHNICAL ENRICHMENT, 2026-08-18. The scope fence is enforceable at the
  level of state, not just of intent: if the loader never carries per-entry match
  state, the rejected signal is not merely undelivered — it is unavailable, and a
  later change cannot add it by accident. That is the strongest form of this fence
  and is recorded as an it_requirement.
target_epic: EPIC-SuppressionNarrowsNeverDisables
