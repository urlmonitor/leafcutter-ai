it_requirements:
  - "Before computing or executing any repair, detect shallow (a shallow marker is present) and bare (no working tree) clones and refuse with a clear message; the assumptions of the refetch/reflog/worktree steps do not hold for these clone shapes."
  - "The refusal is a pre-plan guard: no repair action runs in the shallow/bare case."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
