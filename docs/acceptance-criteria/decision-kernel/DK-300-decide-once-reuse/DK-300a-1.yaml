notes: |
  FLOW BACK-LINKS (add this AC id to each node's implements list):
    leafcutter/decision-forming    step    ask
    leafcutter/decision-forming    step    classify

  DERIVATION. Two forming steps folded into one L2 because DK-300a owns seven
  steps under a five-L2 cap (one slot is the sequence diagram). Scenario ask: the
  kernel receives the question as the goal of a new run. Scenario classify: one Jev
  question, five intents, a decision goal starts the decision graph. Both are the
  intake of the same round and are delivered by the same hand-off.

  OUTSIDE THIS AC, NOT IN THE FLOW. When Jev is unsure the run asks a
  clarification question and reclassifies (intent.max_clarifications), and an
  explicit requested_output_schema bypasses the classification
  (docs/how-to/run-the-decision-kernel.md, Step 3). Neither has a flow node, so
  neither is specified here; the "clears the configured intent thresholds" clause
  scopes this AC to the confident path.

  IT-PO BUILD STATUS (2026-10-02, unverified until the evidence phase): built and
  tested. Intake, the one-question intent classification and the routing of each of the
  five kinds are implemented in kernel/intent/ and the CLI/service, with unit and
  integration tests under tests/kernel/intent/ and tests/kernel/adapters/. Pointers: the
  it-po entry in amended_by. None of those tests carries a DK covers tag yet.
