estimated_complexity: S
it_requirements:
  - "THIS IS THE STATE THE REPOINT CREATES, not a hypothetical. Today the reader's default names debugging/logs/knowledge_emissions.jsonl, which has never existed anywhere; after INF-400c-4-i moves the emitters, that file still does not exist until the first agent emits into it. INF-700a's caller will therefore meet an absent sink on its very first run in every tree. If that run returns an error status, whoever wires the caller will turn the wiring off, and the loop stays open for the same reason it has been open since June."
  - "EXIT-CODE EQUALITY WITH THE EMPTY-SINK CASE is the testable form of 'the same outcome'. Assert equality against the empty-sink run rather than asserting == 0 on its own, so a future change to the empty case moves both together. This mirrors the equality INF-700c-2 asserts for the ineligible corpus."
  - "MUST NOT CREATE THE SINK OR ITS PARENT. The reader is a reader. A mkdir-on-read turns a misconfigured path into a silently-created empty file, and the next run over the correct path then looks identical to the run over the wrong one."
  - "NO WIDENING FALLBACK, restated because it is the tempting fix. An absent sink must not cause a search of the operational stream, of a sibling filename, or of a legacy path. INF-400c-4-iii forbids the reader touching the operational stream at all; this AC forbids absence being the trigger that makes it."
  - "The path looked for must appear in the run's report on the absent-sink path specifically. A no-work outcome that does not name the path it checked is indistinguishable from a no-work outcome over the wrong path, which is exactly how the knowledge_emissions.jsonl / agent_telemetry.jsonl divergence survived three months."
  - "Must handle errors gracefully per the project error handling policy — an absent file is not an error here, but an unreadable one (permissions, a directory in the file's place) still is, and must keep its existing distinct status."
  - "EXACTLY WHAT CHANGES IN THE SHIPPED EXIT CODES — IT PO decision, reconciling this AC against the enumeration INF-700c-3 documents (0 clean, 1 sink unreadable, 2 state file corrupt, 3 unroutable records remain, 4 write or state-persist failure, outranking 3). ONE thing changes: the ABSENT case is split out of the exit-1 branch and joins the exit-0 no-work outcome. Today absent and unreadable are the same branch and both return 1; after this AC, absent returns whatever the empty-sink run returns and unreadable keeps 1."
  - "WHAT MUST NOT CHANGE, stated so it is not collateral. Exit 1 keeps its number and narrows its meaning to a sink that EXISTS and cannot be read — permissions, a directory in its place, a decode failure. Exits 2, 3 and 4 keep their numbers and their meanings unchanged, and 4 keeps outranking 3. NO NEW EXIT CODE IS INTRODUCED. A dedicated code for the absent case (a hypothetical 5) recreates precisely the defect this AC closes: every caller would have to special-case it, and the first caller that forgets treats a fresh clone as a failure and gets the wiring switched off."
  - "THE COLLAPSE IS AT THE STATUS LEVEL ONLY, NEVER IN THE DATA. Absent and empty must share an exit status and must remain distinguishable in the run's reported output — the report says the sink was absent and names the path it looked for. Collapsing them in the report too would make a misconfigured path indistinguishable from an unemitted-to one, which is the condition that let the knowledge_emissions/agent_telemetry divergence survive three months."
  - "A DOCUMENTATION LINE FALLS OUT OF THIS AND MUST BE FOLLOWED THROUGH. INF-700c-3's it_requirements enumerate exit 1 as sink unreadable, which becomes imprecise the moment this lands. Notify INF-700c-3 and INF-700a-4 (both documentation-expert, both amending docs/architecture/agent_knowledge_system.md) so the reference reads sink present but unreadable. A code change that leaves the reference describing the old branch is half the fix."
delivers_to:
  agent: workflow-architect
  contract: "A routing step that returns the no-work outcome, not an error, when its declared sink has never been written to — the precondition for INF-700a-1 wiring it into a completion path without that path reporting a failure on every fresh tree"
expects_from:
  ac_id: INF-400c-4
  contract: "The single declared knowledge-emission sink path, which the reader resolves and reports even when nothing has been written to it"
