priority: medium
roadmap_phase: phase_1
criteria: |
  Retire the approval-granting review steps; a review that stays can only hold work back.

  Because completion is now proven mechanically, the extra review steps whose only
  contribution was a green opinion are removed from the fast lane — cutting time and
  cost from every build. What the fast lane keeps is a single reviewer that can stop
  a change from being delivered when something looks wrong. It can withhold; it can
  never grant. Done-ness is still established by the mechanical proof alone, so the
  guarantee that a feature marked done is genuinely done is unchanged.
