id: UXP-591-2-ii
title: "Opening a real drawer after 'Step not found' clears the notice and replaces the unknown step in place"
component: ux-prototyping
components:
  - ux_prototyping
  - frontend_coding
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given /flows/leafcutter/python-coder-internal?step=lint is open with the 'Step not found'
    notice and no drawer, and the tab has one history entry,
  When the person clicks the 'Doc-enforcer' step,
  Then the notice disappears and the 'Doc-enforcer' drawer opens,
  And the address bar becomes /flows/leafcutter/python-coder-internal?step=docenforce,
  And the tab still has one history entry,
  And after the person then picks "How a flow renders in the Atlas" in the flow selector and
    presses Back, the Atlas shows /flows/leafcutter/python-coder-internal?step=docenforce with
    the 'Doc-enforcer' drawer open, never ?step=lint and never the 'Step not found' notice.
depends_on:
  - UXP-591-2
  - UXP-591-2-i
  - UXP-591-4
doc_links:
  - path: docs/product-truth/flows/leafcutter/explore-flows-in-atlas.flow.json
    relationship: implemented-by-step
    status: exists
  - path: docs/product-truth/mock-data/leafcutter/atlas-flows.mock.json
    relationship: specifies
    status: exists
  - path: docs/product-truth/mockups/leafcutter/atlas-flows-canonical-url.html
    relationship: describes
