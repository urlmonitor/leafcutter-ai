  - path: docs/architecture/agent_knowledge_system.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-034-knowledge-write-ownership.md
    relationship: constrains
    status: exists
  - path: docs/architecture/components/knowledge-system.md
    relationship: describes
    status: exists
assigned_agent: architecture-diagram-author
estimated_complexity: S
it_requirements:
  - "TARGET SURFACE: the diagram belongs in docs/architecture/agent_knowledge_system.md, which currently documents the Option A pipeline ADR-034 rejected. Adding a correct diagram beside stale prose leaves the document self-contradicting; the prose amendment is INF-700b-5's, so the two must land together or the diagram must be placed after the amendment."
  - "The two branch outcomes the diagram must show are now concrete: the success branch ends at a knowledge record carrying `text` (INF-700b-1), the cannot-complete branch ends at a failure record naming the missing target on the operational telemetry stream (INF-700b-1-ii). They terminate at DIFFERENT artefacts on DIFFERENT streams — a diagram that shows one sink for both would contradict INF-400c-4-iii's two-stream split."
  - "The retired names route-learning and capture-learning must not appear as participants, messages, notes or artefacts (ADR-034 section 2 item 3). Note that a Mermaid participant name is prose and is NOT reachable by scripts/check_skill_refs.py even after INF-700b-2 wires it — that guard scans imperative skill-path references, not diagram labels. The 'names no retired step' clause is therefore enforced by review here, not by the gate."
  - "The routing-step boundary must be drawn as the end of the agent's obligation, with no arrow, note or activation implying when routing runs. ADR-034: 'Until the harvester has a caller, capture is not automatic and any documentation implying otherwise is wrong.' The trigger is INF-700a's and is unsettled."
  - "Must satisfy the repository's existing diagram gates: the mermaid-complexity hook and the diagram-naming hook both run at commit time on docs/*.md. Keep participant count within the complexity budget rather than discovering it at commit."
test_required: false
test_rationale: |
  A Mermaid sequence diagram in a Markdown document produces no executable
  behaviour, so there is nothing for test-writer to make fail. The mechanically
  checkable clauses of the criteria are already covered by gates rather than by
  tests: the mermaid-complexity and diagram-naming pre-commit hooks check the
  diagram's form, and the 'every artefact exists under the name given' clause is
  a review obligation because diagram labels are prose that no reference guard
  parses. test_required is set explicitly rather than left absent so test-writer
  skips with an accurate reason rather than the omission being read as an
  unauthored contract.
delivers_to: null
expects_from:
  - ac_id: INF-700b-1
    contract: "The settled capture path and the knowledge record shape (including `text`) that the success branch terminates at"
  - ac_id: INF-700b-1-ii
    contract: "The failure record and the stream it lands on, which the cannot-complete branch terminates at"
