assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "THE DISCRIMINATOR IS THE STATUS LETTER, NOT MEMBERSHIP. git diff --cached --name-status reports the kind of each entry. Admit A. Do not admit M: a modification cannot introduce a path the root did not already hold, which is the entire defect. The existing inline comment ('just in case') is evidence the letter was added defensively rather than deliberately — remove it with the condition, do not leave a comment claiming behaviour the code no longer has."
  - "R IS A SEPARATE JUDGEMENT AND MUST NOT BE DROPPED REFLEXIVELY. A rename whose DESTINATION is a root path the root did not previously hold genuinely is an addition and should still be objected to; a rename whose destination is not at the root is not. Note that for R the name-status line carries TWO paths (R100<TAB>old<TAB>new) and the current code takes parts[-1], which happens to be the destination — preserve that, and decide R on the destination path only."
  - "TEMPLATE/DEPLOYED PARITY (ADR-001). The change lands in templates/scripts/commit_guardian/check_root_files.py and reaches scripts/commit_guardian/ only through build.py, which rglob-copies the whole directory. Never edit the deployed copy: the next build overwrites it and the fix disappears silently."
  - "THE CONTROL CASE IS PART OF THE FIX, NOT OF THE TESTS ONLY. Deleting the gate, widening the allowlist, or returning early all make the first clause pass. The implementation must keep a genuinely new non-allowlisted root path refused with a non-zero exit."
  - "OUT OF SCOPE — DO NOT BUNDLE. Adding requirements-dev.txt to root_files.allowed_files in commit_guardian.json is a separate change (three deployed copies of the manifest would need mirroring) and is made unnecessary by this fix, because the change in question is an M. Record it as a follow-up rather than shipping it here."
  - "ERROR-HANDLING POLICY APPLIES TO THE GIT CALL. The subprocess call keeps its specific-exception handling; a git failure must not degrade into admitting every staged path, which would reinstate the defect on exactly the commits where git is under stress."
test_spec:
  - name: test_ge120e1ii_editing_an_existing_non_allowlisted_root_file_is_not_blocked
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "In a real git repository whose root already tracks a non-allowlisted file, a staged one-line content change to that file makes the check exit 0 and name the file nowhere in its output."
  - name: test_ge120e1ii_adding_a_new_non_allowlisted_root_file_is_still_blocked
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The control: a brand-new non-allowlisted path staged at the root in the same repository makes the check exit non-zero and name that path, so the fix cannot pass by disabling the gate."
  - name: test_ge120e1ii_rename_into_the_root_is_judged_on_its_destination
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A staged rename whose destination is a new non-allowlisted root path is still objected to, while a rename whose destination is inside a subdirectory is not."
  - name: test_ge120e1ii_allowlisted_root_file_passes_whether_added_or_edited
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A path named in the allowlist exits 0 in both the added and the modified shape, confirming the narrowing did not move the allowlist's own verdict."
test_rationale: "The defect is a single status letter, so a source-reading test would assert the absence of a substring and would pass against any rewrite that reintroduces the behaviour by another route — the grep trap CLAUDE.md names. All four tests therefore execute the check as a process against a real repository standing in the relevant state and assert only on exit status and reader-facing output. The second test is the red-baseline control: without it, deleting the gate turns the suite green, which is the failure mode this AC's L1 parent exists to prevent. They live in unit_tests/commit_guardian/ alongside the other per-hook behavioural suites rather than in unit_tests/portability/, because the subject is what this one check refuses, not whether the deployed layout resolves."
