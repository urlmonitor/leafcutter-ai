assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  reference_file_path: "scripts/ac_store/generate_ticket_from_ac.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/ac_store/ -q"
  config_schema_fragment:
    type: object
    description: "The per-demand legibility rule for the emitted plan. The container already exists — test_spec is a list — so nothing new is stored. What is constrained is that the KIND travels with each entry rather than with the plan, because a plan-level kind cannot express a mixed demand and is the shape the current code already has."
    properties:
      demands:
        type: array
        minItems: 1
        description: "One entry per demanded proof, each carrying its own kind. The kind is a property of the ENTRY, never of the plan or of the requirement. A plan-level kind flag satisfies the single-kind cases and makes the mixed case unrepresentable."
        items:
          type: object
          required:
            - proof_mode
          properties:
            proof_mode:
              type: string
              enum:
                - asserted
                - judged
              description: "Which kind this one demand is, as defined by TQ-200c-1. Read per entry by the consumer so that one plan can address two different parties."
  constraints:
    - "The proof kind must be a property of each demand, not of the plan or the requirement. A plan-level flag passes both single-kind cases and makes the mixed case structurally unrepresentable — the failure this AC exists to prevent."
    - "Adding a judged demand must leave every pre-existing deterministic demand byte-identical in content, wording and ORDER. Re-deriving or normalising the plan to accommodate the new demand discards a human's authored contract to satisfy a mechanical rule; the store holds 124 named contracts on prompt work that must arrive alongside whatever routing adds, not instead of them."
    - "Both demands must SURVIVE TRANSIT into the written plan. Two demands sitting in one record prove nothing. The current code drops the whole test-contract section at once behind the is_code_ac gate; the plausible half-fix moves the drop to the judged entries only, which looks like progress and is still a drop. Assert on the written ticket, not on the in-memory structure."
    - "A mixed demand must be carried by ONE requirement. Splitting into two requirements, one per kind, is forbidden: it makes the number of requirements a function of how many kinds of proof a behaviour needs, fragments the store, doubles parent/child bookkeeping and lets the halves drift about what behaviour they prove."
    - "Must not require both kinds. TQ-200c-2-i forbids over-demand, and an implementation that always emits a pair satisfies this AC and fails that L3. Every cardinality from one kind to two must be reachable on the same path."
delivers_to:
  agent: python-coder
  contract: "A written plan in which each demanded proof carries its own kind, so one requirement can address two parties at once: the deterministic entries reach the test author unchanged in content and order, and the judged entries survive alongside them for TQ-200c-4 to land in the eval harness. The guarantee is on the emitted ticket, not on the in-memory answer."
expects_from:
  ac_id: TQ-200c-1
  contract: "The single-sourced proof-kind vocabulary (test_spec[].proof_mode, values {asserted, judged}) attached to a test_spec ENTRY rather than to the record, which is what makes two kinds legible in one list. Without it the best available plan is two entries that both say pytest, which fails this AC's second clause by construction."
test_required: true
test_spec:
  - name: test_one_requirement_yields_a_plan_carrying_both_kinds_of_demand
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: criterion
    covers: [TQ-200c-3]
    description: "A single record needing a registry-parity assertion and a model-behaviour judgment produces one written plan containing both demands, each labelled with its own kind. Asserted on the ticket the real generator wrote, over a COPY of a store."
  - name: test_each_demand_is_legible_as_its_own_kind_in_the_written_plan
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: boundary
    covers: [TQ-200c-3]
    description: "The deterministic entry must not read as judged and the judged entry must not read as deterministic. A plan-level kind flag passes the both-present test and fails here, which is the whole point of separating the two assertions."
  - name: test_adding_the_judged_demand_leaves_the_deterministic_demands_byte_identical
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: real_artifact
    covers: [TQ-200c-3]
    description: "ORDER PRESERVATION. Generate the plan for a record with an authored multi-entry deterministic contract, then again with a judged demand added, and diff: the pre-existing entries must be identical in content, wording and order. An implementation that re-derives or normalises the plan passes every presence check and fails here."
  - name: test_neither_demand_is_dropped_in_transit_to_the_written_ticket
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: reachability
    covers: [TQ-200c-3]
    description: "PRODUCTION ENTRY POINT: the real generation command line over a COPY of a store; both demands must be present in the ticket file on disk. Today the whole section is dropped behind the is_code_ac gate; the plausible half-fix drops only the judged entries, and only an on-disk assertion separates the two."
  - name: test_a_mixed_demand_does_not_require_the_work_to_be_split_in_two
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: boundary
    covers: [TQ-200c-3]
    description: "Exactly one ticket is produced for the mixed record, and no second requirement is created in the store copy. Forbids the plausible dodge of making the requirement count a function of the number of proof kinds."
  - name: test_a_single_kind_requirement_still_yields_a_single_kind_plan
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: failure
    covers: [TQ-200c-3]
    description: "NEGATIVE CONTROL for TQ-200c-2-i. An implementation that satisfies simultaneity by always emitting both kinds passes every other test here and fails this one. The pair of tests is what pins 'both are possible' apart from 'both are mandatory'."
test_rationale: |
  Every assertion is made on the WRITTEN TICKET produced by the real generator over a copy
  of a store, never on an in-memory routing answer. The fourth criterion clause is
  explicitly about transit, and the failure it names — a mixed plan authored correctly whose
  judged half evaporates because nothing downstream knows what to do with it — is invisible
  to any test that inspects the structure before it is emitted.
  Presence and legibility are separate tests because a plan-level kind flag satisfies the
  first and fails the second, and it is the natural first implementation: the existing code
  already carries exactly one plan-level boolean, so the cheapest change is to make that
  boolean tri-state. Order preservation is a diff test rather than a set-membership test
  because the defect it catches is a re-derivation that produces the same demands in a
  different form — a set comparison is blind to it and 124 authored contracts are the
  population at risk.
  The single-kind negative control is mandatory: this AC and TQ-200c-2-i are a pair, and an
  always-both implementation satisfies the letter of every other test in this contract while
  making 'judged' carry no information. The no-split test guards a dodge that is a design
  decision rather than a bug, and would otherwise be caught by nobody.
