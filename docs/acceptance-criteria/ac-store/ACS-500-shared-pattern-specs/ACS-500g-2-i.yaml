id: ACS-500g-2-i
components:
  - ac_store
readiness: approved
priority: high
title: "A newly promoted pattern is recognised as a pattern by both the authoring scan and the commit-time check"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given the authoring-patterns skill's parameterised-criteria rule is applied to
    promote a behavior with the varying values filter_field and export_format,
  When the pattern record is written,
  Then it declares both slots in its pattern_slots list,
  And each declared slot also appears as the matching named placeholder inside the
    criteria body,
  So that a pattern-first inventory scan that recognises patterns by declared slots
    AND a commit-time check that recognises patterns by placeholders in criteria
    both classify the new record as a pattern.

  Given an author writes a pattern record that declares slots in only one of those
    two places (placeholders in criteria with no declared slot list, or a declared
    slot list with no matching placeholder),
  When the record is checked before it is written,
  Then it is rejected with a message naming the slot that is present in one place
    and missing from the other,
  And the record is corrected to declare the slot in both places before it enters
    the store.
depends_on: [ACS-500g-2]
