amended_by:
  - reason: >-
      THE END-TO-END THRESHOLD WAS ARITHMETICALLY UNREACHABLE AND IS CORRECTED, after
      the implementation measured 4.33x against a demand for 5x. This is not the
      target being relaxed because it was missed; the original number was derived
      wrongly and could never have been met. The record asserted that the two
      headline consumers "spend about 95% of their time inside the parser" and then
      applied the parser's own 13.25x ratio to an end-to-end figure. Measured at
      implementation time the parser is 81.8% of the validation run, not 95% —
      24.68s of parsing inside 30.16s, leaving a 5.48s floor of globbing, schema
      checking and process start-up that no parser choice touches. By Amdahl that
      caps the end-to-end gain at 30.16/5.48 = 5.50x even with an INSTANTANEOUS
      parser, so the old "one fifth" sat within 10% of an unreachable ceiling and
      would have required parsing to become 3.4x faster than the C loader already
      is. The implementation reached 6.96s against a predicted 7.34s — it BEAT its
      own prediction and still could not pass. Corrected two ways: the criterion now
      pins the parse portion at a tenth or better, which is the part this change
      actually governs and where the real 13x lives, and keeps an end-to-end clause
      at a quarter as a REGRESSION FLOOR rather than a target. The premise sentence
      is corrected from 95% to the measured 81.8% so the same mis-derivation cannot
      be repeated from this record. Evidence: unit_tests/ac_store/test_tq_600a_11.py
      measured forced-pure=30.16s, fast=6.96s with 13 of its 14 sibling assertions
      green at the same commit.
    by: claude-opus-5
    at: 2026-10-05
  - reason: >-
      THE SCOPE WAS NARROWED FROM "EVERY ENTRY POINT" TO ONE CALL SITE, AND THREE
      CLAUSES ARE STRUCK. This is a retraction of intent, not a relaxed threshold, and
      one of the three clauses now requires the OPPOSITE of what it said. The full
      store-wide migration this record demanded WAS built — ~113 call sites across 67
      files — and then produced 12+ real defects across two verification rounds. The
      cause was uniform and is not a speed question at all: CSafeLoader and the
      pure-Python SafeLoader differ in ERROR behaviour, and several sites depended on
      that difference. CSafeLoader accepts inputs SafeLoader rejects — `"key: [\t]\n"`
      returns `{'key': []}` where SafeLoader raises ScannerError — so a fail-open
      `except yaml.YAMLError` guarding "skip this malformed file" silently became
      "accept it as valid", which is the phantom-done class this repository's
      guardrails exist to prevent. Every call site was then re-tested against four
      conditions, ALL of which had to hold (measured benefit on the real store; no
      error-path dependence; no equivalence contract with the pure-Python parser; not a
      guardrail BLOCK/PASS decision point). 83 of 85 call sites were REVERTED on
      2026-10-07; two remain, both in scripts/generate_agent_cards.py.
      STRUCK CLAUSE 1 — "in each of the two headline consumers the parsing itself drops
      to at most a tenth of its pure-Python cost". One of those two consumers is the
      store-wide schema validation behind a required pull-request check. It was
      reverted to pure-Python deliberately: its `except` branch turns a parse failure
      into a REPORTED VIOLATION rather than a skipped file, and the C parser's
      permissiveness erodes exactly that detection. ERROR FIDELITY WAS CHOSEN OVER
      SPEED THERE. Its parsing now drops by 1.00x and no speedup for it is claimed.
      STRUCK CLAUSE 2 — "each of those consumers finishes end to end in at most a
      quarter of its own same-sitting baseline". Same cause. The covering test
      test_tq600a_11_the_required_store_validation_check_beats_a_quarter_of_its_baseline
      currently FAILS in CI (forced-pure=28.81s, fast=28.78s, 1.00x) because both arms
      are now identical code. The test descriptor is renamed, not softened: the
      threshold moves to the site where the claim is true, and a new discrimination
      test makes the gate's pure-Python choice itself enforced.
      STRUCK CLAUSE 3 — "no entry point in the package names the pure-Python safe
      parser directly". This one is REVERSED, not merely unmet: roughly 81 source
      files now name the pure-Python parser DELIBERATELY, by design, at 83 reverted
      call sites. The seam test's _DOCUMENTED_EXCEPTIONS frozenset in
      unit_tests/ac_store/test_tq_600a_11.py is the wrong shape for that reality — an
      allowlist of exceptions cannot describe a world where the exception is the rule.
      The criterion is inverted: naming the pure-Python parser is the DEFAULT and needs
      no justification; resolving the C-backed parser is the EXCEPTION, admissible only
      against the four-part test and only from a small DECLARED set. The seam test
      becomes "no UNDECLARED call site resolves the C parser", which is a bounded list
      of three rather than an unbounded list of eighty-one.
      WHERE THE CLAIM IS REPOINTED: scripts/generate_agent_cards.py's
      `_scan_ac_assignments` / `_scan_all_ac_assignments` — ONE whole-AC-store walk per
      build.py run. Measured twice in separate sittings on the real store: ~1.7-2.1s
      through the accessor vs ~20.6-22.7s forced pure-Python (~10-13x), output
      byte-identical both times; non-gating documentation generation, no equivalence
      contract, no error-path dependence. Expressed as a RATIO against a same-sitting
      baseline with the floor at five, never as an absolute second count — this host
      documents 3.8x-10.74x variation with zero code change, and the first amendment to
      this very record was caused by reasoning from absolute figures taken in another
      sitting. The sibling `_parse_frontmatter` in that same file — one small template
      at a time — was reverted, which is why the criterion now tests VOLUME rather than
      files: the same file earns different verdicts at different volumes. Also recorded
      for the next reader: a realistic 5-file staged-commit batch shows only an ~18ms
      difference between the two parsers, noise against process start-up, and that is
      what nearly every commit-guardian hook parses — which is why almost nothing else
      qualified.
      FIELDS CHANGED: title (it named the retracted half-minute claim); criteria
      (rewritten; struck text preserved verbatim in notes); doc_links (reverted sites
      demoted or removed, scripts/generate_agent_cards.py and
      scripts/ac_store/yaml_safe_loader.py added as the real edit surface,
      scripts/build_phases.py repointed to scripts/build_phases_ac_store.py, the
      analysis doc's status corrected from planned to exists); declared_files (narrowed
      to the four files that actually change); it_requirements (the "adopt everywhere"
      and "deploy manifest" items superseded; a DO-NOT-RE-MIGRATE item and an
      error-fidelity item added); test_spec and test_rationale (two descriptors
      renamed/repointed, one added, one retired). delivers_to and expects_from are
      UNCHANGED — the accessor is still the artefact TQ-600a-11-ii compares.
      NOT DONE HERE, FLAGGED INSTEAD: the children TQ-600a-11-i / -ii / -iii were not
      edited. -ii's "four classes of input on which the two parsers are known to
      differ" is now demonstrably non-exhaustive — the tab-in-flow-sequence case is a
      fifth, and it is the one that caused the defects — and its scope is now one call
      site rather than the whole package. TQ-600a-9's test_spec cites "3.8x to 10.74x
      variance ... recorded in TQ-600a-11", but that figure was not in this record
      until now; it is recorded in the criteria and in this entry so the citation
      resolves.
