criteria: |
  Given the agent has proposed AC id ACS-101a-1 to the user,
  And the user answers "yes" to the confirmation prompt,
  When the agent proceeds,
  Then generate_ticket_from_ac.py is called with --ac ACS-101a-1,
  And the generated ticket file path is captured from the script's output,
  And the build pipeline is invoked on the generated ticket path
    (single-ticket mode, not epic mode),
  And after the build pipeline completes successfully,
    mark_ac_done.py is called with --ticket <generated-ticket-path>,
  And the AC's work_status transitions from todo to done.
