id: ACD-1700b-1
components:
  - ac_driven_dev
readiness: reviewed
priority: medium
title: "An assigned_agent that mismatches the deliverable surface is flagged"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given an AC with a deliverable surface (file path + extension) and an assigned_agent,
    and a surface->craft map that resolves each surface to the craft that owns it
    (path-aware, not extension-alone),
  When the assignment-quality check evaluates the AC,
  Then the assignment is flagged as a mismatch ONLY when assigned_agent differs from the
    craft the surface->craft map resolves for that deliverable surface,
  And a legitimate mapping is NOT flagged — in particular a .js/.mjs WORKFLOW body under
    templates/workflows-js/ assigned to python-coder passes (Node orchestration is
    python-coder's craft per project convention),
  And a genuine mismatch (e.g. a frontend .jsx/.tsx/.vue/.svelte deliverable assigned to
    python-coder, or a .sql deliverable assigned to python-coder) IS flagged,
  And the flag names the deliverable surface, the craft the map resolved, and the
    mismatched agent,
  And the AC is held for reassignment before dispatch.
depends_on: [ACD-1700b]
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "CONFIG HOME (IT-PO decision, 2026-08-12): the surface->craft map lives in a dedicated ordered config file, config/surface_craft_map.yaml, as a path-aware, FIRST-MATCH-WINS list of {glob -> craft} entries. It is NOT expressed as per-agent surface globs on config/agent_registry.json, because per-agent extension lists cannot encode first-match path precedence (e.g. templates/workflows-js/**/*.js -> python-coder must override a generic web *.js -> frontend-coder)."
  - "config/surface_craft_map.yaml is the SINGLE source of truth read by the check AND by any generator/assignment tooling; the check must not inline or duplicate any glob->craft rule, and a duplicated rule is a defect to delete."
  - "A mismatch is flagged ONLY when assigned_agent differs from the craft the map resolves for the deliverable surface; the flag payload names the deliverable surface, the resolved craft, and the mismatched agent."
  - "config/surface_craft_map.yaml must be added to the build deploy manifest (deploy_map in scripts/build_phases.py) so the check reads it from the DEPLOYED layout, not only the source tree (done_proof.py ModuleNotFoundError precedent)."
  - "A deliverable surface that matches no glob must produce an explicit unresolved/advisory outcome, never a silent pass and never a false mismatch."
  - "Holding for reassignment is advisory-then-blocking per ADR-026 warn-before-required rollout: ship enabled/non-strict, promote to blocking only after the green self-host window."
delivers_to:
  agent: python-coder
  contract: "Per-AC assignment-quality verdict {ac_id, surface, resolved_craft, assigned_agent, verdict: match|mismatch|unresolved}, computed from config/surface_craft_map.yaml; consumed by the split-detection edge case ACD-1700b-1-i and the pass case ACD-1700b-2."
