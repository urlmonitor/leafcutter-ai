it_requirements:
  - >-
    ONE REGISTER VOCABULARY ACROSS BOTH SURFACES, KEYED ON A SCRIPT. The commit-gate surface's
    register is a list of records each naming a script and stating a ground, and it is keyed on
    a script rather than on an identifier precisely because an unwired script has no identifier
    to be keyed by. Reuse that record shape here. Two independently-maintained exemption
    vocabularies will disagree, and an exemption declared for one surface must never silently
    apply to the other — if the two registers share a storage location, each record states which
    surface it applies to and an unscoped record is refused rather than defaulted to both.
  - >-
    WHERE THE REGISTER LIVES IS OPEN AND HAS A PACKAGE-SURFACE CONSEQUENCE. It must not live in
    the settings surface itself, for the reason stated in that doc_link. If it is placed inside
    the commit-guardian registry it becomes a watched package surface and this record's parent
    must then declare package_surface before it can be committed; if it is placed in a new file
    beside the census it does not. Decide before implementing and amend the parent if the choice
    is the former. Wherever it lands, it must be present in every installed layout the census
    runs from, or the census reads an empty register and reports every grounded script as run by
    nothing.
  - >-
    THE GROUND MUST BE MACHINE-CHECKABLE AT THE CITATION LEVEL ONLY, AND THAT LIMIT IS
    DELIBERATE. The census verifies that the cited record exists and that it names the script;
    it does not and must not assess whether the cited disposition is wise, current, or being
    worked on. Anything more turns the census into an arbiter of other records' correctness,
    which is not its job and would couple it to the shape of every record it might be pointed at.
    Anything less — accepting free text — reproduces the blank-ground failure with more
    characters.
  - >-
    THE CENSUS MAY NOT RECOMMEND A DISPOSITION, AND THIS IS A HARD LINE. It reports the state and
    quotes the ground. A message of the form "register this script" or "this script should be
    wired" is a false statement about at least one of the two scripts on this surface today,
    whose approved disposition is dissolution rather than registration. The wording of the
    reported classes must therefore be descriptive — run by nothing, deliberately unwired,
    refused, stale, redundant — and never imperative.
  - >-
    ADD THE THIRD NUMBER TO THE EXISTING SUMMARY LINE, NOT A SECOND LINE. BP-1600a-1-i
    establishes the summary with the examined and wirings-read counts; this criterion extends
    the same line with the deliberately-unwired count. Two summary lines can disagree about
    whether the same run was determinate.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around reading and
    parsing the register and around resolving a cited record; log at WARNING or higher or
    re-raise; no bare or blind excepts. A register that cannot be read is an unresolved
    condition under BP-1600a-1-i's contract, not an empty register — an empty register read from
    a failure reports every grounded script as run by nothing, which is an avalanche, and a
    swallowed failure that yields "everything is grounded" is the opposite and worse.
test_spec:
  - name: test_bp_100n_6_iii_a_grounded_record_reports_the_script_as_deliberately_unwired_and_does_not_fail
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      A fixture register record naming an unwired script, with a ground citing a record that
      exists and names that script, causes the executed census to report the script as
      deliberately unwired, quote the ground, omit it from the run-by-nothing class, and — with
      no other finding present — exit zero.
  - name: test_bp_100n_6_iii_a_blank_or_postponing_ground_is_refused_and_the_script_stays_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      Two fixture records — one with an empty ground, one whose ground states only that a
      decision has not yet been taken and cites nothing — are each reported as refused, their
      scripts are counted among those run by nothing, and the run exits non-zero. This is the
      suppression path and it is the whole reason the register can be trusted; a register that
      accepts a postponement is an allowlist with a longer field.
  - name: test_bp_100n_6_iii_a_ground_citing_a_record_that_does_not_name_the_script_is_refused
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      A ground citing a record that does not exist, and separately a ground citing a record
      that exists but does not name the script, are both reported as refused. Distinguishes a
      real citation from a citation-shaped string, which is the failure a citation requirement
      invites.
  - name: test_bp_100n_6_iii_the_census_never_states_what_should_be_done_with_a_reported_script
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Over a fixture holding a script whose owning record disposes of it by folding its
      detection into another check, the census's output describes its state and quotes its
      ground and contains no instruction to wire, register or delete it. Asserted over the
      emitted output. Protects an approved sibling record whose disposition for a real script on
      this surface is not registration.
  - name: test_bp_100n_6_iii_a_stale_record_and_a_redundant_record_are_each_named
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      A record naming a script absent from the hook directory is reported as stale, and a record
      naming a script that a wiring does execute is reported as redundant while the script
      itself is reported as run. Keeps the register from accumulating cover nobody needs.
  - name: test_bp_100n_6_iii_the_deliberately_unwired_count_appears_in_the_same_summary_line
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      The run summary states the deliberately-unwired count alongside the examined and
      wirings-read counts established by BP-1600a-1-i, in one line, and the number moves when
      the register's contents change. Goes red on a second summary printed elsewhere and on a
      hard-coded count.
  - name: test_bp_100n_6_iii_an_unreadable_register_is_an_unresolved_run_not_an_empty_register
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      With the register made genuinely unreadable at run time, the census reports an unresolved
      run naming that reason and exits non-zero — it does NOT proceed with an empty register
      (which reports every grounded script as run by nothing) and does NOT proceed as though
      everything were grounded. Exercised by breaking the read for real.
  - name: test_bp_100n_6_iii_the_register_is_readable_from_the_installed_layout
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After a real build, the deployed census reads a register with the same contents as the
      authored one. A register present only in the project's own tree leaves the installed
      census measuring against nothing, which under this criterion is an unresolved run and
      under a careless implementation is a clean one.
test_rationale: |
  The register is the part of this design most likely to become the thing it was built to
  prevent. Every mechanism that lets a check tolerate a known finding is one edit away from
  being an allowlist, and the edit is always made under pressure on the day the check first goes
  red. So the descriptors here are weighted towards the refusal paths rather than the
  acceptance path: a blank ground, a postponing ground, a ground citing nothing, and a ground
  citing something that does not name the script are four separate descriptors, while the happy
  path is one.

  The citation requirement is stronger than the sibling surface's plain stated-ground rule, and
  the reason is concrete rather than stylistic: both scripts this census will name on its first
  run already have approved records deciding their fate, and neither decides it by wiring. A
  ground that must name such a record is satisfiable today, honestly, for both — and is not
  satisfiable by "we will look at this later", which is what a stated-ground rule alone permits.

  The never-recommend descriptor exists because the obvious wording for a census finding is an
  instruction, and the obvious instruction is wrong here. One of the two scripts is scheduled for
  dissolution into a shared pass by an approved record; a census that tells an implementer to
  register it is not merely unhelpful, it contradicts the store.

  Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by Grep", every descriptor
  executes the census as a process over a fixture register and asserts on its emitted output and
  exit status; none is satisfied by reading the register or the census source as text.
