notes: |
  WHY THE TWO REFUSALS ARE NON-NEGOTIABLE. This repository has repeatedly shipped
  gates that could never refuse. Arms 2 and 3 are the evidence that what was switched
  on can say no, through the real commit path: a real `git commit` in a scratch repo
  whose pre-commit config is the build-generated stanza pointed at the deployed
  scripts. One input per population: 30 to 31 exercises the ratchet, a new 16
  exercises the door; a new 16 alone would pass against a registered copy of
  today's checker. Reading the manifest as text proves nothing.

  DAY-ONE ARM IS REAL CONTENT. Arm 1 uses the real tracked build_helpers.py because
  synthetic fixtures are what hid defects on this component before. Measure the
  score at test time and assert only that it is over the limit; do not hard-code 65.

  DEPLOYED LAYOUT. The check will import from _file_size_ratchet.py. Running arms 2
  and 3 against the deployed scripts proves the helper is deployed beside it.
  Reuse the shared_reference_layout fixture (@pytest.mark.shared_layout_reader); no
  new build.py spawn.

  REGISTRATION SHAPE (the IT PO may refine): tier judgment, run_hook.py-wrapped,
  pass_filenames false (the script reads the staged set itself), always_run true,
  change_set_source handed_by_commit_path, and no files/types/exclude filter, which
  check_hook_trigger_reachability reports as a self-contradiction alongside
  always_run.

  PACKAGE SURFACE. Adding a hooks_manifest member is watched by
  check-package-surface-declaration, so the IT PO must set package_surface: true at
  enrichment (the schema then requires it_requirements alongside it, which is why
  this BA pass leaves both out).

  OUT OF SCOPE: the other four scripts in the unregistered baseline.

  TEST BUDGET: 4 new tests (one per arm; arm 4 via the reachability census output),
  plus the existing inventory ratchet test, which goes red if the entry is added
  without removing the baseline line.
