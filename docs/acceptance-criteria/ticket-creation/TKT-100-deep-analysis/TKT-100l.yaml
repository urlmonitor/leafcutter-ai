criteria: |
  Requirements describe observable outcomes in business language, never code details.
  The analyst writes what the user should see and experience — not which files,
  scripts, or functions make it happen. Technical implementation details are
  added later by a separate technical review step, keeping business requirements
  clean and readable by non-engineers.
