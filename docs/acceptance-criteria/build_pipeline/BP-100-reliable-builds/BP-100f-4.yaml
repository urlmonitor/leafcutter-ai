test_spec:
  - name: test_success_does_not_crash_on_cp1252_stdout
    target_dir: unit_tests/build_guards
    framework: pytest
    type: unit
    description: "With sys.stdout replaced by a cp1252 (errors='strict') text stream, build_colors.success() and the other print helpers write the message with unencodable characters replaced instead of raising UnicodeEncodeError; on a UTF-8 stream the ✓ glyph is written unchanged."
