id: TQ-400c-2
components:
  - testing_quality
title: "The verdict appears where the team already looks, not behind a command"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a scheduled whole-store sweep has completed,
  When anyone opens any pull request and reads its check list — the same list of
    checks that already carries the proof-of-done coverage entry — without running
    anything themselves and without opening a job log,
  Then that check list carries an entry for the honesty sweep, and the summary the
    reader sees in the list itself states the sweep's headline verdict: how many
    finished records are proven, how many are not, and how many are exempt, as
    three separate counts,
  And that same summary names the dated occurrence the figures came from and how
    old they are, so a reader can judge the age of what they are reading without
    opening anything,
  And the entry never blocks the pull request: whatever the figures say, it does
    not turn the pull request red and does not gate the merge, so records the pull
    request never touched cannot stop it merging,
  And the figures are the ones the most recent completed occurrence already
    computed rather than a sweep run for this pull request: opening a pull request
    causes no sweep, and two pull requests opened between the same pair of
    occurrences show identical figures,
  And when the most recent occurrence did not complete, the entry shows that
    occurrence's failed state as TQ-400c-4 defines it — never a clean verdict, and
    never the preceding occurrence's figures presented as current,
  And when the most recent completed occurrence is older than the cadence the
    schedule sets, the entry says so in that same summary as a state of its own,
    distinguishable at a glance from a fresh clean verdict,
  And when a further occurrence completes with different figures, the entry read
    on any later pull request shows the new figures attributed to the new
    occurrence, with nobody republishing them by hand.
depends_on:
  - TQ-400c
  - TQ-400c-1
