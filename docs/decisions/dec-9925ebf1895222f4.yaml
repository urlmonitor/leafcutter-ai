rationale:
  text: 'Design decision settled by a human. Kernel ranking (Jev''s per-criterion judgement, evidence not authority; stopped
    researching because design_judgement after 1 research round(s)): 1. [opt.added.1] Step 0 prerequisites, then DK-400 in
    3 and DK-500 in 4 dependency-checked epics, one at a time (required mean 0.81, 1/4 passed); 2. [opt.l1_epics_dk400_first]
    one epic per L1, DK-400 first, then DK-500, one epic at a time (required mean 0.52, 0/4 passed); 3. [opt.l1_epics_dk500_first]
    one epic per L1, DK-500 first, then DK-400, one epic at a time (required mean 0.39, 0/4 passed); 4. [opt.two_full_epics_sequential]
    one epic per tree, DK-500 then DK-400 (required mean 0.27, 0/4 passed); 5. [opt.two_full_epics_parallel] one epic per
    tree, both trees in parallel (required mean 0.19, 0/4 passed). human:user chose option [opt.added.1] Step 0 prerequisites,
    then DK-400 in 3 and DK-500 in 4 dependency-checked epics, one at a time (kernel rank 1 of 5).'
