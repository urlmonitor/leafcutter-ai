title: "A reviewer sees where a flow forks and on what condition, as decision diamonds"
component: ux-prototyping
level: L1
status: active
req_status: draft
work_status: in_progress
criteria: |
  As a person reviewing a flow in the Atlas /flows view, I see each conditional fork
  drawn as a decision diamond in standard flowchart form — the question at the fork with
  labelled yes/no/else edges leading to each outcome (the branch outcome on "yes", continue
  to the next step on "no") — so I can tell at a glance where the journey branches and on
  what condition, instead of a decision looking like just another ordinary step. When a fork
  has several outcomes it reads as a chain of simple diamonds (diamond -> diamond -> happy
  path) rather than one tangled node, so even a many-way fork stays readable.
