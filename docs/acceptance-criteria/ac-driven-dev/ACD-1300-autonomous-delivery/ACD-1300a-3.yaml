id: ACD-1300a-3
title: Keep a claimed feature together through delivery or a blocker
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given the worker has claimed feature STATUS with two required leaves
  And an unrelated lower-urgency feature becomes eligible after the first leaf passes
  When the worker chooses its next action
  Then it continues the remaining STATUS work in the same feature run through validation and review
  And it releases that feature from active execution only on delivery, a blocker or the user's stop request
  And priority edits affect unclaimed selection without preempting this healthy run
  And a delivered run awaiting human disposition is not selected again merely because its AC records remain todo before merge
