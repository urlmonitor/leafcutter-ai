notes: |
  WHERE A JUDGE IS NOT NEEDED (TQ-200d notes): "the produced test goes red under
  the wrong version" is a wrong-version run. A judge reading the test would be
  the opinion TQ-500g exists to replace. The judge is kept for the report half
  (does it name the wrong version).

  O2 IS INCIDENT 1 ITSELF — a test that says it catches the regression and does
  not. A judge persuaded by the report would pass it; the run does not.
  O3 is the control that the two halves are scored apart.

  SEPARATE L3 BECAUSE IT DEPENDS ON TQ-500g-1-i. TQ-200d-1 can ship with a
  judge-scored row first; this L3 swaps the test half to a run once the runner
  exists, without holding the whole set back. The fixture refresh module and
  its wrong version live in the row's sandbox, not in the project's code.
