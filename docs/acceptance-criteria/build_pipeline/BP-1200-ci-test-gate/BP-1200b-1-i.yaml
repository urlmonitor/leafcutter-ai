    relationship: describes
    status: exists
  - path: .github/workflows/ci.yml
    relationship: implements
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Exercises the FAILING path of the blocking test job added in BP-1200b-1: a PR introducing a deliberately-failing test must drive the test check to a failing (red) conclusion, and the check failure must mark the PR not-mergeable. This is the negative acceptance scenario for the ci.yml test job, not a permanent test added to the suite."
  - "The deliberately-failing test must be transient/scoped to the verification (e.g. a throwaway PR or a temporary test removed before merge) so it does not become a standing red in the suite — the AC verifies the GATE blocks, it does not ship a failing test."
  - "Not-mergeable enforcement here assumes BP-1200c-1 branch protection (settings-as-code, decided) requires this check; the blocking outcome of THIS AC is the check reporting failure, with merge-blocking provided by the required-status-check wiring."
delivers_to: null
