criteria: |
  Every block names the criterion, the link that broke, and what changed.

  When the check stops a commit, the message identifies the affected acceptance
  criterion, the source it pointed to, and what happened to that source (moved,
  renamed, or deleted) — so you know what to reconcile without hunting through the
  diff.
