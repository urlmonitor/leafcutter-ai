title: "Every command you run can reach what it calls"
component: build-pipeline
level: L1
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
criteria: |
  Deployed commands never point at something that isn't there.

  Every invocation a deployed command makes — the workflow or skill it hands
  off to — resolves to a real path that actually exists in a consumer install.
  If a command references a target that would not resolve after deployment, the
  build catches it before it reaches consumer projects, so commands never fail
  with a "nothing there" dead end.
