notes: |
  Refusing to proceed is only half the value; a refusal the reader cannot act on gets worked
  around, and the workaround is what re-creates the unprotected copy by hand.

  The two causes have completely different remedies — build the workspace once, versus
  investigate a missing artifact — and today they produce the same message. This is the same
  distinction GE-119b-1-i draws on the check side, which is why both are L3 rather than
  separate L2s: they are the discrimination edge of their parents, not new behaviours.
