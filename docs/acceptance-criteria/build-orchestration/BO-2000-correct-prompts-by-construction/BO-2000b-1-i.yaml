roadmap_phase: phase_1
criteria: |
  Given a pre-commit hook written under the python-coder fail-open rule,
    and the hook hits an unexpected OSError during its run (for example a file it
    expected to read is unreadable),
  When the hook executes,
  Then it emits a diagnostic on the error stream naming the failure,
  And it exits with code 0,
  And the commit is not blocked by that unexpected error.
