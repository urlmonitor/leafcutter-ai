id: ACD-1300b-2
title: All concurrent agent calls share one configured global limit
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given two feature runs can execute and the configured global agent-call limit is one
  When implementation, review or nested agent work requests execution
  Then at most one agent call is running across all features and roles
  And pending calls wait for capacity rather than bypassing the limit
  And finishing or failing a call makes its slot available to the next eligible call
