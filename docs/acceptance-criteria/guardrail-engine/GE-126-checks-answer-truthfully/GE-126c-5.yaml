notes: >-
  RE-DERIVED IN THIS WORKTREE, 2026-09-01, NOT TAKEN ON TRUST. The two-copy structure
  the finding describes is present here: scripts/commit_guardian is a symlink to
  ../.leafcutter/scripts/commit_guardian, while templates/scripts/commit_guardian holds
  the canonical source. `ls -ld` on both was the check. This matters because it is the
  reason inspection cannot reveal which copy an alteration landed in: after any build the
  two are byte-identical, and the link makes the deployed one look like an ordinary
  directory.


  WHY THIS IS THE MOST CORROSIVE INSTANCE IN THE SET. Every other guard-liveness defect
  fails by staying quiet. This one fails by producing a confident, wrong, ACTIONABLE
  answer: an injection that does not land looks exactly like a test that cannot fail, so
  the proof manufactures a false positive for the very defect it exists to detect. The
  finding records the natural next step from that false positive — rewriting tests that
  were already correct. An escape hatch that lets the author assert which copy was
  altered reproduces the defect, because the author's belief about the copy is precisely
  what was wrong.


  ANTI-GREP. No clause here is satisfiable by asserting that a path constant is correct,
  that a helper exists, or that the proof procedure is documented. Instance 8 of this
  bleed (readme_read_guard) is a correct-looking, greppable constant that never matched
  anything; a criterion satisfied by reading a constant reproduces it. The observable is
  the loaded module's own reported location, obtained from the process that loaded it,
  and the discriminator is that the verdict MOVES when the alteration lands and does not
  when it does not.


  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSE. "The proof counts as evidence only
  when the alteration was made to a copy named in that statement" implies that a landed
  alteration is NOT reported as a landing failure — green on arrival today, because
  nothing is reported at all. INJECTION: build the statement of loaded copies from the
  path the author passed in rather than from the loaded module's own reported location.
  Under that injection the wrong-copy case reports as a successful proof and the landed
  case is indistinguishable from it; the clause must go RED, and must return to green on
  revert. Run it, do not describe it — and run it against the copy the test loads, which
  is this AC's own subject.


  A WEAKER TELL, RECORDED SO IT IS NOT MISTAKEN FOR THE CRITERION. The finding notes the
  run times: 0.24s for the injection that did not land, 33.5s for the one that did. That
  is a useful smell for a human and must not become the assertion — a timing threshold is
  a proxy measurement reported as a verdict, which is mechanism M8.


  FALSE-GREEN CATALOGUE. This shape is not in docs/reference/false-green-mechanisms.md.
  M2 covers the crash-shaped version of two-copy divergence, not the silent-shaped one.
  Recommend a new entry; do not fold it into M2, whose defeat ("run the deployed hook")
  is already satisfied by the run that produced the false positive.
