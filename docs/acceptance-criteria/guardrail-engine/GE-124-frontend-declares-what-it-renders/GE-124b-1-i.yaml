amended_by:
  - "2026-08-25 [it-po]: technical enrichment. Required exact attribute-name matching (not prefix or substring) and attribute-wise tag parsing, because real pinned elements carry class values with framework interpolation that defeats a whole-tag regex. Extended the constraint past the reader to every downstream surface. criteria untouched."
superseded_by: null
