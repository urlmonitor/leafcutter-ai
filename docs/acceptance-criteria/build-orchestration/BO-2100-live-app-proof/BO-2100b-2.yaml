criteria: |
  Given a project `skills_config.json` whose `live_surface_testing.enabled` is `true`
    And a ticket whose frontmatter sets `live_surface_test: false` or omits the field
  When the ticket is authored and driven
  Then no `live-surface-tester` phase is added to the ticket's `agents:` map
    And the live-app check is skipped for that ticket.
