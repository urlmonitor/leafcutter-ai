    description: "Produce all five cases against the same permitting registry and assert the five reported reasons are pairwise different -- the KI-ACD-009 defect was four causes printing one message."
  - name: test_bo_3200f_1_i_permitting_registry_is_never_reported_denied_on_any_failure
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: "Drive the real plan-feature startup check under the harness with a permitting registry and each executor failure injected in turn; assert the run never reports the agent as denied and stops as could-not-tell (KI-BO-018's false verdict)."
test_rationale: |
  Every scenario holds the registry constant and permitting and varies only how the executor
  dispatch failed, so a report that still says 'denied' or 'unreadable' can only come from the
  failure path -- the KI-BO-018 and KI-ACD-009 shape. The decline test uses the real refusal
  payload, fabricated exit_code 1 included, because that exact payload is how a refusal became
  'exit code 1, no stdout' in production.
  The guardrail test is added beyond the four written scenarios because an executor that cannot
  decline makes guardrail blocks the most likely non-transport stop, and without its own reason
  it would be reported as the executor declining -- pointing the reader at a charter that did
  nothing wrong.
  The pairwise-distinct test closes the cheap implementation: one honest-sounding 'could not
  check' message for every case, which satisfies each single-case test and recreates the
  one-message-for-four-causes defect.
