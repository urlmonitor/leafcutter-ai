title: "Bare-filename allowlist entries suppress all findings with that basename regardless of directory"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: critical
criteria: |
  Given the security allowlist contains the entry "GENERIC_SECRET:secrets.py:*"
    where the path component "secrets.py" is a bare filename (no path separator),
  And the secrets scanner detects GENERIC_SECRET findings in the files:
    - "secrets.py" (root level)
    - "src/secrets.py"
    - "deploy/prod/secrets.py"
  When the scanner evaluates whether the allowlist entry suppresses each finding,
  Then ALL three findings are suppressed,
  Because the allowlist path is a bare filename and a single-segment path is
    always a suffix of any finding path that shares that basename.

  Given the security allowlist contains the entry "GENERIC_SECRET:config/secrets.py:*"
    where the path component "config/secrets.py" is path-qualified (contains a separator),
  And the secrets scanner detects GENERIC_SECRET findings in the files:
    - "config/secrets.py"
    - "src/config/secrets.py"
    - "deploy/secrets.py"
  When the scanner evaluates whether the allowlist entry suppresses each finding,
  Then the findings at "config/secrets.py" and "src/config/secrets.py" ARE suppressed,
  And the finding at "deploy/secrets.py" is NOT suppressed,
  Because "config/secrets.py" is a segment-by-segment suffix of "config/secrets.py"
    (exact) and "src/config/secrets.py" (suffix match), but NOT of "deploy/secrets.py".
