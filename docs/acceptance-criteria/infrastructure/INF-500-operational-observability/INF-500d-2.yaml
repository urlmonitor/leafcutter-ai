title: "The documented catch-all writer switch is removed, and any unrecognised writer value is refused at load time"
component: infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the permitted-writer configuration documents an "all_agents" sentinel as the
    supported way to say "every phase agent may write this category",
  And the writers of the general-purpose categories are now derived from the live
    agent roster, which is what the sentinel was reaching for and makes it redundant,
  When the configuration as shipped is inspected,
  Then the sentinel appears nowhere in the configuration or its documentation.

  Given a permitted-writer configuration in which some category names the removed
    sentinel — or any other writer value the submission path does not honour —
  When that configuration is loaded,
  Then loading is refused with an error naming the unrecognised writer value and the
    category it appears in,
  And no report is written under that configuration,
  So that an author who copies the sentinel from an old ticket or an archived config
    is told immediately rather than re-introducing a silent no-op.

  Given the configuration's documentation as shipped,
  When the documented writer values are compared against the writer values the
    submission path actually honours,
  Then every writer value the documentation describes is one the submission path
    honours, and no documented value is silently ignored,
  So that an author who follows the documentation cannot end up believing a
    category is open when every write to it is in fact refused.
