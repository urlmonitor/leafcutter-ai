criteria: |
  Given three expired scratch items, the second of which contains one file that is
    read-only to the current user,
  When the sweep runs for real,
  Then the first and third items are removed,
  And the report states two items removed and one failed, names the failed item's
    location and the reason, and does not count the failed item's bytes as freed,
  And the sweep's outcome is distinguishable from a fully successful sweep in its
    final status.
