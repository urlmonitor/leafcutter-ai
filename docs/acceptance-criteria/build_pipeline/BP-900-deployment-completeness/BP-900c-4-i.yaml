notes: |
  WHY THIS IS A SEPARATE RECORD RATHER THAN A CLAUSE IN BP-900c-4.

  BP-900c-4 constrains WHAT the report says for a given tree. This constrains WHAT
  THE SELECTOR READS, and the two are independently satisfiable: a hard-coded set of
  the paths that happen to be declared today makes every BP-900c-4 assertion pass and
  is wrong the first time someone edits a deploy declaration. The only observation
  that separates them is a run BEFORE and a run AFTER a declaration edit, with the
  tree otherwise untouched — which is a different fixture from BP-900c-4's, so it is
  a different test, so it is a different record.

  THE DECLARATION-SHAPE CLAUSE IS NOT DECORATION. BP-900g-9's sign-off enumerated
  five declared-entry deploy loops of at least three shapes: a mapping table, several
  hardcoded file lists, and a single declared path. A predicate written against the
  shape that produced the observed defect — the knowledge-scripts file list — passes
  every other clause in this AC and leaves the identical hole in the mapping-table
  and single-path declarations. That is the EPIC-BOPhantomDoneRemediation T03 shape
  (a guard present in one check and absent from its structurally identical twin, all
  tests green), and it is why the third run is specified against a second shape.

  THE ADMISSIBLE OBSERVABLE IS THE EMITTED FINDING SET, AND IT CHANGES. Not the
  presence of a string, and not a log line: the current build already logs the missing
  path accurately, and the record it emits for it is well-formed and machine-parseable
  — it is the VALUE of one field that is wrong. So every clause here compares the
  emitted record across two runs that differ only in the declaration, and the pass
  condition is that the value moved. A test whose assertion holds on a single run
  cannot fail on the implementation this AC exists to exclude.

  GLOB-DERIVED PHASES ARE OUT OF SCOPE. BP-900g-9's sign-off records three deploy
  loops that iterate a glob of what exists on disk rather than a declaration; a glob
  cannot name an absent path, so no path is ever "already declared" by one and no
  remediation branch is owed to them. Do not manufacture a fourth state for them.
