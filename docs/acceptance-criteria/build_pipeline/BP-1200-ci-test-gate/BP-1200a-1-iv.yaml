criteria: |
  Given a brand-new checkout in which the deployed scripts/commit_guardian/*
  directory is not present (a plain clone omits the gitignored build output)
  And the documented CI test command runs the build preparation step (build.py +
  install_shims shim bridge) before the suite
  When tests/commit_guardian/test_check_ac_done_on_merge.py and
  unit_tests/commit_guardian/test_check_ac_schema.py run
  Then neither test errors at collection or execution for want of a deployed
  commit_guardian script
  And both tests run and report a passing result
  And the outcome is identical whether or not a stale local scripts/commit_guardian/
  working copy happens to be present.
