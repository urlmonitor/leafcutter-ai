notes: |
  THIS IS WHERE THE L1'S DEFERRED DECISION IS TAKEN: recording a deliberate exclusion is a
  durable record attached to the check that names the decision, not a suppression comment
  and not silence. The L1 asked for the shape to be decided at L2 and said the criterion is
  that the choice becomes explicit.

  THE LAST CLAUSE FENCES OFF THE MOST DANGEROUS MISREADING. Exclusion from the autofix
  roster means no fixer is dispatched. It has never meant the check stops blocking. An
  implementation that treats an exclusion record as a way to make a check non-gating would
  turn a friction fix into a hole, and this record forbids it with a behavioural assertion
  rather than a note.

  THE REMOVE-AND-RERUN ARM IS WHAT BINDS THE SILENCE TO THE RECORD. A parity check that
  never names anything also produces the silence in the first arm. Only the paired run
  where the record is absent distinguishes a working suppression from a check that is not
  looking.

  AN EXCLUSION FOR A CHECK THAT DOES NOT EXIST IS NOT A SUPPRESSION and is named for the
  same reason GE-126d-1-i names a stale roster entry: an enumeration whose entries are
  never checked against reality drifts in both directions.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

