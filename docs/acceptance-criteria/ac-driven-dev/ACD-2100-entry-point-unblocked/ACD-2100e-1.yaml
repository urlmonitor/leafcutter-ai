it_requirements:
  - "TARGET FILE -- a NEW sequence diagram at exactly docs/architecture/diagrams/c3-006-plan-feature-decision-gate-sequence.md. ACD-2100c-1, c-2, c-4 and c-5 all link that exact path as planned. c3-005 is the highest c3 number in the directory so c3-006 is free, and the name satisfies check_diagram_naming's ^c[1-4]-NNN-[a-z0-9-]+.md filename pattern."
  - "NOTHING IN THIS REPOSITORY WILL CATCH A WRONG PATH -- check-doc-links IS NOT THE NET THE STORE NOTES ASSUME. check_doc_links validates DOC_LINKS declared in Python and SQL files only, and it is advisory: its own docstring states every failure is a warning and it always exits 0. No hook validates a markdown-to-markdown link at all. So the four inbound planned links and every outbound link this diagram carries are unguarded in both directions. Publishing at the exact path above is the entire defence."
  - "MERMAID COMPLEXITY IS THE BINDING CONSTRAINT AND IT WILL BITE -- DECIDE THE COMPOSITION BEFORE DRAWING. check_mermaid_complexity caps a sequence diagram at 8 participants, 25 interactions and 4 boundaries. Five decision points each shown with three exits is at least fifteen arrows before a single setup or return message. The cap must NOT be met by dropping an exit or a decision point: the closed-set clause and the three-exits clause are the whole criterion. If the depiction cannot be expressed within the cap, raise it as a finding -- a second diagram would need its own record, and four inbound links point at this one."
  - "THE PARENT LINK IS A BLOCKING BIDIRECTIONAL COMMIT-TIME REQUIREMENT AND NO ELIGIBLE PARENT EXISTS TODAY. check_mermaid_parent_link (exit 1 on violation) requires every doc under docs/architecture/ to declare parent: or root: true, the parent file to exist, the parent's flight_level to be STRICTLY higher than the child's, the parent's children: list to contain this file, and a markdown link to the parent below the first mermaid fence. docs/architecture/components/ac-driven-dev.md is itself flight_level L3-Component, so it is NOT eligible as the parent of an L3 diagram. Resolve this before authoring rather than at commit time: either declare a strictly-higher parent and add this file to that parent's children: list in the SAME commit (docs/architecture/components/interactive-pause-resume-substrate.md is the precedent shape at L2-Container but is tagged build_orchestration), or declare root: true (docs/architecture/diagrams/c3-005-artifact-knowledge-graph.md is the precedent inside this component)."
  - "FRONTMATTER components: MUST BE THE UNDERSCORE GRAPH ID ac_driven_dev -- NOT the kebab ac-driven-dev. check_doc_frontmatter validates every components entry against the keys of docs/components.json, which are the underscore ids. That declaration is the mechanically checkable half of the last Then clause. ACD-2100d-4's equivalent requirement states the kebab form; that wording is wrong and must not be copied."
  - "docs/INDEX.md IS GENERATED. Register the diagram by running the build and committing the regenerated index -- do not hand-edit it. A hand-edited index is reverted by the next build."
  - "LENGTH IS A REAL CONSTRAINT -- check_doc_length caps a non-ADR document at 300 lines and 25 sections. Link out to ADR-024 and to the adjacent diagrams rather than absorbing either."
  - "TWO ADJACENT DIAGRAMS EXIST AND BOTH MUST BE LINKED RATHER THAN RESTATED. c3-002-interactive-pause-resume-sequence.md is the ADR-024 substrate at message level -- resolveGate, the persist/read exchange, the pending-question store, resumeFromRunId -- and c3-001-interactive-pause-resume-run-lifecycle.md is the same substrate as a state diagram. Both are tagged build_orchestration and both hang off interactive-pause-resume-substrate.md. Neither depicts which decisions the route stops at or what each exit costs, which is this diagram's subject: they document how a pause is mechanically effected. If on reading them the author concludes c3-006 would duplicate them, that is a finding to raise -- not a licence to merge, because four inbound links point here."
  - "DO NOT DRAW ANY PART OF THIS FROM KI-ACD-005's FIX DIRECTION. That known issue's stated root cause and stated fix are both out of date -- resolveGate already pauses on an unparseable answer and the observed loss came from a well-formed one -- so a path drawn from it is wrong on the day it is published. templates/workflows-js/plan-feature.js is likewise not the source: it is being replaced underneath this page by the very records in depends_on. The source for every depicted path is the delivered behaviour of ACD-2100c-1, c-2, c-4 and c-5."
delivers_to:
  - agent: documentation-expert
    ac_id: ACD-2100e-2
    contract: "ORDERING GAP -- SEE NOTES. The published diagram at docs/architecture/diagrams/c3-006-plan-feature-decision-gate-sequence.md. ACD-2100e-2's how-to links that exact path as planned and sends an operator there to learn how their run came to be waiting, so this record is that link's target. The link is plain markdown and no hook in this repository validates a markdown-to-markdown link, so if the how-to is published first the link is dead and nothing reports it."
expects_from:
  - ac_id: ACD-2100c-1
    contract: "The final set of decision points and the channel each is put on, which the sequence diagram depicts rather than re-derives from the source."
  - ac_id: ACD-2100c-2
    contract: "The unreachable-channel exit: no step after the decision point runs, a record naming the run and that decision point survives the process, and the run reports that it is waiting. This is the second of the three exits the diagram shows on every decision point."
  - ac_id: ACD-2100c-4
    contract: "The refused-answer exit: an answer that cannot be attributed to the person is not carried out and the run stays at the decision point still waiting. This is the third exit."
  - ac_id: ACD-2100c-5
    contract: "The closed set of ways a run ends holding drafted work -- which of them discard it and which do not -- so the diagram can show discarding on exactly one path and attribute that path to the person."
test_required: false
test_rationale: >-
  The deliverable is a mermaid sequence diagram with no executable surface a test could
  drive. Every path it depicts is owned and enforced elsewhere by tests that execute: the
  closed set of decision points and the human-only channel by ACD-2100c-1, the
  unreachable-channel exit by ACD-2100c-2, the refused-answer exit by ACD-2100c-4 and the
  single-discard-path invariant by ACD-2100c-5. A test over this page could only assert
  that certain labels appear in it, which is the presence-shaped proof this whole tree
  exists to discredit -- it would pass on a diagram that shows all five decision points in
  the wrong relationship, or that gives a gate one exit instead of three, or that depicts a
  decision point the route no longer presents. The two mechanically checkable clauses in
  the criteria are already covered by live commit gates rather than being untested: the
  component declaration by check-doc-frontmatter and the index reachability by the
  generated docs/INDEX.md, with check_diagram_naming guarding the filename and
  check_mermaid_parent_link guarding reachability from the diagram tree. A bespoke unit
  test would duplicate a running gate rather than add coverage. Recorded explicitly so
  test-writer skips with an accurate reason rather than silently.
