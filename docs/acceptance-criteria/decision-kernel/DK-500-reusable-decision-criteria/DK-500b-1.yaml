id: DK-500b-1
title: A grouping suggestion has one preferred wording, its other wordings and at most one broader category, and changes nothing until accepted
component: decision-kernel
components:
- decision_kernel
level: L2
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given the candidate wordings "Maintainability: does it keep working with little upkeep as decisions and the harness evolve?", "Maintainability: does it keep working with little upkeep as the kernel and its traces evolve?" and "Maintainability: does it keep working with little upkeep as decisions, components and the harness evolve?",
  And the published categories cat-1dc11c5a2ffa7310, cat-d15d52392d7aa94c, cat-52b16c7b5a23106f, cat-d6ce5f78c181ebd1 and cat-1df63b670163b54e,
  When groupings are suggested, by whichever method is chosen,
  Then each suggestion has exactly one preferred wording, a list of other wordings that does not repeat the preferred one, and either no broader category or exactly one,
  And no wording is suggested into a category while it is a label of another staged or published category, so "Can it be put in place with a small change?", a label of cat-1dc11c5a2ffa7310, is never suggested into a second one,
  And no candidate, published category or decision record changes until a person accepts the suggestion.
depends_on:
- DK-500b
- DK-500a-1
covered_by:
- DK-500b-1-i
implemented_by: []
assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: 'Grouping suggestion: {suggestion_id, wording: string, sightings: [sighting], placement: <existing non-retired category id>|none, pref_label: string, alt_labels: [string], broader: category id|null, reason: {kind: exact_label|criterion_id|jev|new_candidate, probability: number|null, matched_label: string|null}}. Inert until a person accepts it (DK-500c-1, DK-500b-4).'
expects_from:
  ac_id: DK-500a-1
  contract: Mining result candidates with mined_from sightings.
change_target: code
risk_surface: internal
it_requirements:
- A grouping suggestion is an inert proposal held only in the mining store (offline) or in the run's state (in a run). Creating, listing or discarding suggestions writes nothing under docs/, under any run's staged area or to any decision record.
- 'Each suggestion carries one pref_label, alt_labels that never repeat the pref_label, broader null or one category id, placement (an existing non-retired category id, or none) and a reason: exact_label, criterion_id, jev (with its probability) or new_candidate. Wording equality (''exact match'', ''identical'', ''repeat'', label uniqueness) is one shared rule for every caller (offline grouping, in-run grouping, publish label checks, drafted-repeat removal, edit detection): Unicode NFC, trimmed, internal whitespace collapsed to one space, case-folded; punctuation and word order stay significant. No caller may apply a looser or stricter rule of its own.'
- Under dec-a070edfb6465bced the method never suggests a broader category, so method-made suggestions carry broader null. A broader value appears only when a person sets one while changing a suggestion; DK-500b-1-i validates it.
- Label uniqueness against staged and published categories is a deterministic check applied before any suggestion is offered. A wording that is already a label of a live category is placed there by exact match and never suggested into a second category.
- Suggestions are presented for acceptance only in a review run (DK-500c-1) or at a decision run's approval of proposals (DK-500b-4); nothing applies a suggestion automatically.
test_required: true
test_spec:
- name: test_suggestion_has_one_pref_label_and_no_repeated_alt_label
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: For the three maintainability wordings, each suggestion has one pref_label and alt_labels that do not repeat it.
- name: test_broader_is_null_or_one_id
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Every suggestion has broader null or exactly one category id; method-made suggestions have null.
- name: test_live_label_never_suggested_into_second_category
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: '''Can it be put in place with a small change?'', a label of cat-1dc11c5a2ffa7310, is never suggested into another category.'
- name: test_nothing_changes_until_accepted
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Suggesting groupings leaves candidates, docs/criteria/, docs/decisions/ and the run root byte-identical.
test_rationale: Drive the grouping through its public entry point with a controlled Jev provider that replays recorded probabilities and counts calls, plus a recording host port that fails on any request; assert placements, reasons and call counts, not internal helpers.
