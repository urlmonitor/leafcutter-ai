amended_by:
  - reason: behaviour-change-restatement
    by: business-analyst
    at: '2026-08-24'
    note: >-
      Two of the four original clauses are kept verbatim and remain true: the
      workflow still never dispatches worktree-agent and never invokes the
      feature skill. The clause "it never calls git worktree add" is narrowed
      rather than deleted — a hand-rolled bare git worktree add is still
      forbidden; only the canonical setup_ticket_worktree.py create-only route
      is permitted, and only when BP-600a-1 Case B applies. The clause "no
      isolation infrastructure from the full build pipeline is used" is
      withdrawn, since the canonical script IS that infrastructure and is now
      the required tool. The distinction is load-bearing, not pedantic: the
      script bootstraps build.py and the .pre-commit-config.yaml symlink, and a
      bare worktree gets neither, so every package pre-commit hook is silently
      skipped for the whole run — the failure documented in CLAUDE.md under
      "Worktree pre-commit config". Title amended to match. work_status left
      done.
