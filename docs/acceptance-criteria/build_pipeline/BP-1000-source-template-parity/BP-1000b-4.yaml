criteria: |
  Given the parity gate's enforcement position and halt semantics described by
    BP-1000b and its behaviors BP-1000b-1, BP-1000b-2, and BP-1000b-3
  When a reader opens the component documentation for this feature
  Then a sequence diagram shows the finalize-feature workflow stepping in order
    through the merge-origin/main step, then the parity gate, then (only on a
    pass) the PR-merge step
  And the diagram shows two outcome branches at the parity gate: a drift branch
    where the workflow HALTs and surfaces the drift to the user (never reaching
    the PR-merge step), and a clean branch where the workflow proceeds to the
    PR-merge step
  And the diagram places the parity gate in the same enforcement position as the
    existing test-regression gate (after merge-origin/main, before PR-merge), so
    the timing is unambiguous
  And the diagram makes clear that drift is caught before merge, contrasting with
    the post-merge spot-check that previously found such drift (the KI-2 origin)
