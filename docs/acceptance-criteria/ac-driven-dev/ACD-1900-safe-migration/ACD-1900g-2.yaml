  contract: "The dogfood-precondition signal (recorded self-host epic) as one of the go/no-go criteria; the evaluator also reads the strict-validation, green-merge-count, spot-check, render, deploy-manifest, consumer-upgrade, and rollback-rehearsed signals."
it_requirements:
  - "Canonical source: the go/no-go cutover evaluator under scripts/ac_store/ (or scripts/). The evaluator MUST refuse the final legacy-removal cutover if ANY single criterion is unmet and name the unmet criteria; it permits the cutover only when every criterion holds (ADR-026 Go/No-Go section)."
  - "Every criterion must be evaluated from a real signal source (strict store validation = 0; >=10 consecutive green required-CI self-host merges under enforce:true; a recorded fresh-process real-ticket spot-check; render comprehension test pass; every gate script present in scripts/build_phases.py deploy_map; >=1 consumer/consumer-sim upgraded green; rollback rehearsed) -- no criterion may be stubbed to a constant pass."
  - "Test must EXECUTE the evaluator with each criterion independently unmet (expect refusal naming it) and with all met (expect permitted) -- never grep-only."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file/subprocess I/O in typed try/except and log-or-reraise; no bare except."
test_spec:
  - name: test_cutover_refused_when_any_criterion_unmet_names_unmet
    target_dir: unit_tests/ac_driven_dev/
