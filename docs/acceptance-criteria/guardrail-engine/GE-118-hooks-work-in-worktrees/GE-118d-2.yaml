notes: |
  ID SHAPE. Numbered GE-118d-2 rather than GE-118d-ii for the reason recorded in
  GE-118d-1's notes: the store's id grammar requires a numeric segment before any
  roman one, so GE-118d-ii is rejected by config/ac_store_schema.json. This is an
  L3 technical constraint on GE-118d, not a second L2.

  WHY THIS EDGE IS WORTH ITS OWN RECORD. Accepting both shapes (GE-118d) opens a
  hole that rejecting one would not have: once a mapping is a legal entry, the
  resolver has to answer "which value is the path?" for a mapping that offers
  more than one. Both plausible answers are wrong in a way nobody will notice.
  Taking the first value silently drops a declared relationship — which is
  KM-KGS-100d-3-i's failure mode arriving through the front door. Taking every
  value turns one entry into several, so the guard and the knowledge map disagree
  about how many relationships the document declared, and GE-118f's agreement
  property fails for a reason that has nothing to do with GE-118f.

  Refusing is the only answer that stays honest, and it costs the adopter
  nothing: the reported convention labels each entry with one Diataxis genre, so
  a two-key entry is not a shape anyone is using — it is a shape the permissive
  fix would quietly invent.

  A ZERO-KEY MAPPING, AND A ONE-KEY MAPPING WHOSE VALUE IS NOT A STRING, ARE
  GE-118d-1's SUBJECT AND NOT THIS ONE'S. They are refused there as unaccepted
  shapes. This record is specifically about the entry that looks accepted and is
  ambiguous, which is why it needs its own arm rather than folding into the open
  set of unaccepted shapes.
