  - name: test_tests_deliverable_records_delivering_artifact
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A completed requirement records, for its tests deliverable, the concrete artifact that delivered it."
  - name: test_backref_resolves_to_canonical_source
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "Each recorded per-deliverable reference resolves to the canonical source per ACD-1600d, not a build-output copy."
  - name: test_backref_navigable_both_ways
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "Following the reference connects the requirement to its delivering artifact, and the artifact back to the requirement it satisfied."
