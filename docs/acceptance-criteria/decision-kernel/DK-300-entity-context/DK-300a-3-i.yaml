id: DK-300a-3-i
title: "Absent and malformed explicit IDs preserve different unresolved states"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given one explicitly referenced ID is valid under its owner's syntax but absent from the permitted store,
  And another explicit reference violates that owner's syntax,
  When recognition resolves those references,
  Then the first is unknown_id and the second is invalid_reference,
  And neither result claims artifact existence, a source title or a fabricated definition,
  And parent derivation alone cannot establish that either ID is valid or present.
