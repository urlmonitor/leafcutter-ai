it_requirements:
  - "DECIDED DIRECTION (final gate, to be recorded in ADR-016 authored during the build): APPROACH 1 — CI runs the build step AND install_shims' shim_map is EXTENDED to bridge .leafcutter/scripts/... -> scripts/... for scripts/commit_guardian, scripts/doc_compliance, and scripts/feedback. Implement this approach; do NOT implement the rejected alternatives (Approach 2 repoint-tests, Approach 3 stop-gitignoring which conflicts with ADR-001). The ADR-016 doc is still authored during the build to record the rationale, but the design direction is fixed."
  - "The fresh-clone state to satisfy is the absence of the gitignored build-output directories scripts/commit_guardian/, scripts/doc_compliance/, and scripts/feedback/, which ~36 tests import from and which a plain clone omits (per ADR-004 these are written under .leafcutter/scripts/ by build.py, not the scripts/ paths the tests read). Approach 1 closes the gap by running build.py in CI and bridging the shim."
  - "SHARED-CONTRACT VALIDATION (retained): install_shims shim_map and the build output layout are consumed by CONSUMER-project installs, not just the self-build. The shim_map extension MUST be validated against a consumer install (build.py --target-dir into a clean external project), not only against the leafcutter self-build, before sign-off. A change that fixes the self-build but breaks consumer installs is a regression."
  - "Must preserve ADR-001/ADR-004 self-hosting boundary: scripts/commit_guardian/, scripts/doc_compliance/, scripts/feedback/ remain build outputs (gitignored); Approach 1 bridges via shim, it does NOT commit generated outputs into source control."
  - "Must complete the prepare-then-test sequence deterministically: a repeated fresh-clone run with the same documented command (build step + shim + suite) produces the same green outcome (idempotent build/shim step)."
  - "Must keep parity between the deployed shim/build behavior and its templates/scripts/ package source per ADR-001 (build.py round-trip) where the fix edits any deployed/templated script — never edit one side only. install_shims.py and its shim_map change are part of this parity surface."
  - "Errors during the build/shim preparation step must surface clearly (fail loudly, non-zero exit) rather than leaving a partially-prepared tree that produces misleading test collection errors, per the project error-handling policy."
