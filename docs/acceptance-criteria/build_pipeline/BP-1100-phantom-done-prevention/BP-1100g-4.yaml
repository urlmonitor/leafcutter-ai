id: BP-1100g-4
components:
  - build_pipeline
  - testing_quality
  - ticket_lifecycle
title: "A kind of proof that was promised and never claimed is refused by name"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a piece of work whose plan promised two kinds of proof for one stated
      behaviour — one for the behaviour itself and one for being reached the way
      the product is really used,
    And the tests written for it carry a claim for the first kind only,
  When the work is offered for hand-off,
  Then it is refused, and the refusal names the piece of work, the stated behaviour,
    and the kind of proof that was promised and never claimed,
    And a second piece of work whose every promised kind has a matching claim is
      not refused,
    And a kind of proof that was never promised for a piece of work is never named
      in a refusal for it, because a proof nobody asked for is not a proof that is
      missing,
    And both sides of the comparison are statements someone wrote — what the plan
      promised, and what a test claims — with nothing else consulted to reach the
      outcome.
depends_on:
  - BP-1100g
  - BP-1100g-3
