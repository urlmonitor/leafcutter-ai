    relationship: relates
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The entry point's read-only status probe can fail precisely because the store is corrupt (e.g. a corrupt current-branch tip makes 'git status' exit non-zero). A failed probe MUST be treated as a corruption signal — report it and continue to planning — NOT as a fatal abort. Planning is read-only and makes no repository change."
  - "PORTABLE SURFACE: lives in the same standalone recovery script (templates/scripts/git_recovery.py); ADR-001 deployed/template parity applies."
delivers_to: null
expects_from:
  ac_id: BO-1600d-3
  contract: "The plan-computation path that must still run after a probe failure."
