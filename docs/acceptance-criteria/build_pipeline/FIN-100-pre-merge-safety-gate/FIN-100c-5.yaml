title: "The main-HEAD rerun is scoped to only the failing test IDs so it completes in bounded time"
level: L2
component: finalize
status: active
parent: FIN-100c
criteria: |
  Given the full-suite baseline run timed out, leaving baseline_failures null
  And the post-merge run reports exactly K failing test IDs
    (K = 3 in the 2026-07-15 case)
  When the workflow performs the main-HEAD rerun
  Then the rerun executes only those K specific test IDs and no others
  And it does NOT re-run the full test suite
  And the rerun therefore completes even when the full-suite baseline did not
