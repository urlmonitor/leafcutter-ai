id: GE-129e-4
title: "The limit of the commit protection is stated where the protection is promised, and no surface promises more"
component: guardrail-engine
components:
  - commit_guardian
  - documentation_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the project rules' Commit Delegation section, section 3.2.1 of the agent conventions, the
    commit specialist's instructions and the hooks reference,
  When a reader looks for what the commit protection guarantees,
  Then the hooks reference states that a commit is recognised as the commit specialist's from the
    agent identifier and agent name the harness supplies together, never from anything the caller
    types, sets or says,
    And it states that this protects against automation taking a shortcut, and not against someone
    who can change the project's agent definitions, who could equally change or remove the guard,
    And it states that the parity check for divergent or duplicate commit specialist definitions
    narrows that gap and does not close it,
    And it states that a commit made by a program a command starts is not recognised from the
    command text,
    And it states that the protection covers the `commit` subcommand only: pushing and opening
    pull requests are not covered, and these git subcommands, which also add or rewrite commits,
    are not guarded: merge, pull, cherry-pick, revert, rebase, am, commit-tree, stash, notes,
    fast-import, filter-branch and replay,
    And the project rules, the agent conventions and the commit specialist's instructions each
    describe the top-level session's commit as going to the person's permission prompt and being
    refused where no person is reached, and each link to that statement of the limit,
    And none of the four says a commit is impossible for any other caller without that link.
