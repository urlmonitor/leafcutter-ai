notes: |
  THE FAILURE MODE THIS AC IS AGAINST is not "five files were forgotten". It is that
  every guard in the family is phrased in terms of scripts, so no guard was capable
  of having an opinion about a JSON file. The four existing deployment-completeness
  axes — BP-1000 byte parity, BP-900b preflight references, BP-900e registry
  completeness, BP-900f tracked-in-git — are each about scripts, and each of them was
  green on 2026-08-18. Widening the vocabulary is the work; deploying the five named
  files is not.

  DO NOT SATISFY THIS BY ADDING THE FIVE FILES TO THE DEPLOY MAP. That makes the
  symptom vanish and leaves the mechanism exactly as it was — the same failure
  BP-900g-5 records for script references and BP-900g-8 records for modules, where
  three warning comments accumulated in a hand-maintained map while a fourth instance
  shipped. The named files are the regression set the guard must be shown to catch,
  not the deliverable.

  THE DERIVATION IS HARDER THAN THE MODULE CASE and that is where a weak
  implementation will hide. An import is a declaration a static reader can see; a
  data read is an ordinary function call against a path that may be constructed. Two
  consequences worth stating up front: whatever cannot be derived statically must be
  reported as underivable rather than silently omitted, and a path built at runtime
  is exactly the case BP-900g-10-i/-ii/-iii cover at runtime — the two layers are the
  backstop for each other's blind spots, which is why both exist.
