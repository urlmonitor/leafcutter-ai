notes: |
  2026-09-16 (business-analyst) -- PREMISE NARROWED, READ THIS FIRST. The environment changed
  from "dispatching a specialist is impossible" to "no party can be asked to judge anything"
  (only a chartered executor of exact commands is dispatchable), and two scenarios were added: an
  exact-command dispatch to that executor is not a relay, and a judging-party-first fallback is.
  Authorised by the user on 2026-09-16; the old wording, the reason and the list of now-stale
  technical fields are in amended_by. Where the paragraphs below speak of "specialists
  unavailable" or "no specialist available", they describe the SUPERSEDED premise; read them as
  "no one available to judge".

  COMPOSITION WITH BO-3200f-3, added 2026-09-16. This sweep proves every FACT path requests no
  judgement, by exercising it. BO-3200f-3 proves every exact-command dispatch -- facts AND
  chores -- is addressed to the executor. They overlap on fact reads only.

  The parent L0 records the starting state to be re-measured rather than trusted: roughly 69
  dispatches currently use a read-only reporting specialist as a general-purpose errand runner.
  This AC is the absence half — BO-3200a-1 proves one path reads directly; without this one, a
  system with sixty-eight remaining relays passes it.

  THE SECOND SCENARIO IS WRITTEN TO FAIL A PARTIAL FIX, in the same shape as BO-3100c-2. A
  working direct read somewhere must not mask a surviving relay elsewhere, and the report must
  name the path so the remaining work is enumerable rather than estimated.

  THE THIRD SCENARIO IS THE SCOPE LINE THE PARENT DRAWS: "Judgement is the only thing worth
  asking a specialist for." A sweep that reports every dispatch would be trivially satisfied by
  deleting all delegation, which is not the goal and would be reverted. The distinguishing
  property is whether the build BRANCHES on the returned value — that is what makes a
  paraphrase, a truncation or a pointer able to change the outcome.

  A NOTE ON WHERE THIS IS HARD, recorded for the IT PO rather than hidden: fact-versus-judgement
  is easy to state and awkward to decide mechanically. The formulation above deliberately makes
  the observable property "the path still completes with no specialist available" rather than
  "the dispatch looks like a fact request", because the former is executable and the latter is
  a text heuristic. A path that needs a judgement will legitimately be unable to complete
  without a specialist, and must therefore be identified as out of scope by its contract before
  the sweep runs, not inferred from its prompt.

  IT-PO DECISION (2026-08-26) — THE DECLARATION MECHANISM, answering the BA's residual. Full
  specification is in it_requirements; the part worth restating is the one that makes it more
  than a self-certification:

  THE DECLARATION SELECTS THE ASSERTION, NOT WHETHER THE PATH IS EXAMINED. Every path is
  exercised with specialists unavailable, always. A path declared `fact` must obtain its value
  and proceed. A path declared `judgement` must reach a terminal outcome recording the judgement
  as unobtained. If a declared-judgement path CANNOT terminate without the value, the build was
  branching on it — the declaration is contradicted by observation and the path is reported.

  That is what closes the loophole the BA identified. A declaration that merely removed a path
  from the sweep would be narrowed to meaninglessness within a few sprints, one honest-looking
  exemption at a time; a declaration that changes which assertion is applied cannot be, because
  the false declaration fails DIFFERENTLY rather than silently. The reported exempt set is the
  second line of defence: even a correctly-declared judgement path stays visible and countable,
  so growth in the exemption set is something a reader can notice.

  IT-PO RE-ENRICHMENT (2026-09-16) -- READ WITH THE BA'S PREMISE NOTE AT THE TOP. Where the two
  paragraphs above say "specialists unavailable", the environment is now: only the chartered
  executor answers, as a literal command, and every other dispatch fails immediately. The
  declaration mechanism is unchanged except for a third value, `chore`.

  BOUNDARY WITH BO-3200f-3 -- ONE SWEEP, TWO VERDICTS (recorded identically in BO-3200f-3's
  notes, so an implementer builds one sweep, not two).
    - ONE INVENTORY, owned by BO-3200f-3: every dispatch site in the canonical workflow sources
      with its result_use and addressee, static and complete over the source.
    - ADDRESSING VERDICT, owned by BO-3200f-3: fact and chore -> executor; judgement -> not the
      executor; undeclared, unresolvable or bypass-carrying -> reported.
    - EXERCISE VERDICT, owned HERE: every fact path, run in the no-judgement environment,
      obtains its value; a path that relays -- outright or by falling back -- is reported by
      observation; a judgement declaration is verified by observation.
    - ONE REPORT with both verdicts per site.
  AR-200c's notes and KI-BO-20260901-1620 pointed the whole routing sweep at this record. The
  user placed the addressing half under BO-3200f-3; this boundary is the reconciliation.

  THE BA'S OPEN QUESTION, ANSWERED. Is a fact-declared dispatch to a party other than the
  executor a violation in itself? Not in THIS record: this verdict is observational, which is
  what lets it catch a correctly addressed path that relays by another route. It IS a violation
  in itself in BO-3200f-3, statically. In the no-judgement environment such a dispatch always
  fails and is always in the dispatch record, so here it surfaces as relayed_fact (direct or
  fallback) whenever the path is exercised.

  CONFIRMING `relayed_fact` COVERS SCENARIO 4: yes, with a new relay_kind field distinguishing
  'fallback' from 'direct', because a path that succeeded only by falling back needs a different
  fix from one that cannot succeed at all.

