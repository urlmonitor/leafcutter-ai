notes: |
  PLACEMENT DECISION (the BA was asked to consider whether this belongs here). It does.
  The surface differs from the other GE-119a children — this is an agent-side validator
  invoked by hand, not a commit-time check — but the defect is the same one the L1 names:
  a tool reports success for an inspection it never performed. Grouping it under a
  different L1 would split one defect class across two parents for a reason that is about
  invocation mechanics rather than behaviour.

  OBSERVED IN-SESSION during this very pipeline: validate_ac_schema.py given a DIRECTORY
  argument printed "No YAML files to validate" and exited 0 instead of erroring on the
  argument form. The instruction to pass explicit file paths is a live workaround for this
  defect, exactly as the manual layout-link step is the live workaround for GE-119b.

  SEVERITY NOTE for the IT-PO: CLAUDE.md's "AC-store hygiene — bulk pre-flight" section
  tells operators to run this validator with a directory argument before a finalization
  drive. That documented pre-flight therefore currently inspects nothing and reports
  success — the pre-flight designed to surface AC violations in bulk is itself a silent
  pass. Fixing this AC without also correcting or removing that instruction leaves the
  operator with a green pre-flight they should not trust.
