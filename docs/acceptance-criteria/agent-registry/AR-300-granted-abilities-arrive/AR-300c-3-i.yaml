notes: |
  THIS IS INF-600a-1-i's REQUIREMENT, RE-HOMED AND NOT REINVENTED. That record
  already asked for exactly this resolution and exactly this two-way
  distinction, against the central field. When the declaration becomes the
  source, the same obligation has to point at the declaration or it stops
  reaching anything. The wording is deliberately close so the IT PO can see they
  are one requirement in two homes rather than two requirements.

  WHY IT SITS UNDER AR-300c-3. Both are the same act: comparing a grant against
  something outside it. AR-300c-3 compares the declaration against the derived
  copy; this compares it against the set of abilities that actually exist. An
  implementation that resolves one population will resolve the other in the same
  pass.
