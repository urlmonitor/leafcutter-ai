it_requirements:
  - "REGISTRATION TARGET, stated exactly because getting it wrong produces the defect this AC describes. `.pre-commit-config.yaml` is a BUILD OUTPUT: `scripts/build_precommit.py` strips every `@package-managed` block and re-renders it from `hooks_manifest.hooks` in `templates/scripts/commit_guardian/commit_guardian.json`. The canonical edit is that manifest; then run `python scripts/build.py --target-dir .` and commit the regenerated `.pre-commit-config.yaml`. A hand-added entry in `.pre-commit-config.yaml` passes locally and is STRIPPED in CI, because the CI jobs run build.py before invoking any hook — the gate would then be green everywhere and enforcing nothing."
  - "Registration must be VERIFIED BY EXECUTION, not by observing the entry. Run the deployed hook against a staged contested pair and assert it fails; `templates/scripts/commit_guardian/check_adr_collision.py` is written, tested, deployed and registered nowhere, and has never run — a file's existence and a manifest line are both things a dead guard also has."
  - "The shared-build gate inherits the staged-index trap documented on the `AC store valid` job: hooks that read their file set from `git diff --cached` see nothing in a CI checkout, where the PR's files are committed rather than staged, and therefore pass while validating nothing. If the gate reuses any staged-index reader it MUST reproduce the `git reset --soft origin/<base>` step, and the test must prove a deliberately contested pair fails the job — the same both-ways verification that job's own comment records."
  - "The CI job NAME is a stable external contract referenced by the branch's required-check set (see the note on the existing test job). Choose it once, and do not rename it after GE-120d-2 adds it to the required set."
  - "The negative clause is the honesty constraint and must be asserted as an absence, not inferred: the output must contain no statement that any agent, specialist or automated process will renumber. Assert against the actual captured text, including any shared message header, so a helper that appends a dispatch line cannot slip past."
  - "Both stages must render from GE-120a-1's single verdict via one shared message renderer. Two renderers is the drift the BA merged these two stages into one AC to prevent, and GE-120d-1 forbids a second definition of the rule."
  - "Self-containment is testable as written and must be tested that way: capture the output and assert the other claimant's literal path and the target identifier are present. At the moment of the block the author usually does not know which other artifact claims the number — an output that omits it converts a block into an investigation."
  - "The which-artifact-moves statement must match the per-namespace rule documented by GE-120a-3. A block message and a reference document giving different answers is worse than either alone, because the author has to adjudicate between them under time pressure."
  - "DEPLOY MANIFEST: any module the hook or the CI gate imports must be in the matching build deploy list before the gate is registered, or the deployed hook raises ModuleNotFoundError. Once GE-120d-2 makes the CI gate required, that crash blocks every merge — the done_proof.py precedent."
  - "Error handling per CLAUDE.md Rules 1-4, with the dispositions GE-120d-3 and GE-120d-3-i set: unreadable collection blocks at commit and fails the build; internal defect after a complete read announces and permits the commit but fails the build."
test_spec:
  - name: test_commit_stage_blocks_and_names_every_claimant
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Executing the commit-time gate against a real contested collection produces a blocking result whose captured output contains the contested identifier and the literal path of every claimant."
  - name: test_commit_stage_output_states_author_performed_remediation
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The captured output names which artifact is expected to move and how to obtain a free identifier, and the named mover matches the per-namespace rule the reference document states."
  - name: test_output_promises_no_automated_renumbering
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Neither stage's captured output contains any statement that an agent, specialist or automated process will renumber on the author's behalf — asserted as an absence over the whole emitted text including shared headers."
  - name: test_ci_stage_fails_on_the_same_contested_pair
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    description: "The shared-build gate's own command, run against a checkout that really contains the contested pair, fails and emits the same three elements as the commit stage."
  - name: test_ci_stage_sees_committed_pr_files_not_only_staged_ones
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    description: "In a checkout where the contested files are COMMITTED rather than staged — the real CI condition — the gate still fails. Run both with and without the reset --soft step so a gate that silently validates nothing is caught, exactly as the AC store valid job's comment records verifying."
  - name: test_both_stages_render_from_one_message_renderer
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Given one verdict, the commit-stage and build-stage outputs carry identical contested-identifier, claimant-path and remediation content, so the two stages cannot drift into two messages."
  - name: test_registered_gate_actually_executes_after_build
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "After build.py regenerates .pre-commit-config.yaml from the manifest, invoking the gate through pre-commit on a staged contested pair fails — proving registration survived the build and the gate runs, rather than proving a manifest line exists."
test_rationale: |
  The coverage note forbids asserting on a message template, so every descriptor executes a
  stage and asserts on captured output. Two descriptors exist for defects this repository has
  already shipped rather than for completeness: the committed-not-staged descriptor reproduces
  the trap the AC store valid job documents (a staged-index reader in a CI checkout passes while
  validating nothing, and the job's own comment records verifying it both ways), and the
  after-build registration descriptor exists because .pre-commit-config.yaml is regenerated on
  every build, so an entry that is present in the working tree can be absent in CI. The
  no-automated-renumbering descriptor must be an assertion over the whole emitted text rather
  than over the message body alone, since the failure mode is a shared header or helper
  appending a promise the stage cannot keep.
