readiness: reviewed
priority: medium
title: "At enforce, the gate's absent-coverage skip flips from ok to blocker"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2b_ticket_demotion
criteria: |
  Given ac_unit_of_work.enforce = true AND zero in-flight fat (legacy) tickets remain,
  When the ac-fulfillment-gate encounters a ticket with no ac_traceability whose
    source_ac coverage cannot be resolved or is unmet,
  Then the gate's former "absent -> ok" path returns a blocker for that ticket
    instead of ok;
  And given ac_unit_of_work.enforce = false, OR one or more in-flight fat tickets
    still remain,
  When the same absent-coverage case is encountered,
  Then the gate falls back to the dual-read / advisory behaviour and does not block
    (the skip path is retained until the enforce stage after fat tickets drain).
depends_on:
  - ACD-1900c
  - ACD-1900b-5
  - ACD-1900c-3
