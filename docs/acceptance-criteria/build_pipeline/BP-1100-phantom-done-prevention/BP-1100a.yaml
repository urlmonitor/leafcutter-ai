amended_by:
  - reason: child-added
    by: business-analyst
    at: 2026-08-18
    note: "Added BP-1100a-5 to covered_by — the follow-up documentation AC that BP-1100a-3's
      and BP-1100a-4's it_requirements both ask for and both deliberately exclude from their
      own surface. Added documentation_triggers: [how-to]. That field is NOT what schedules
      the work — documentation-expert is added to a generated ticket by
      config/guardrail_gates.yaml's documentation_gates, keyed on the leaf's change_target,
      and BP-1100a-5 carries change_target: docs so its ticket gets the phase either way.
      What the field does is supply the Diataxis genre: generate_ticket_from_ac.py resolves
      the genre for a documentation-expert contract line from the PARENT L1's
      documentation_triggers (_resolve_genres_from_parent), and with the field absent it
      logs a warning and emits the literal marker '(unspecified genre)' onto the ticket. So
      the trigger is set to stop BP-1100a-5's ticket shipping an unlabelled documentation
      contract, not as a statement that every future child of this L1 needs a how-to.
      Updated the child-cap note: four slots were free-standing before, five are used now
      and this L1 is at the cap. criteria, title and level untouched."
