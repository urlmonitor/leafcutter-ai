id: KM-400a-1-ix
title: Glossary term metadata retains its complete definition without inheriting file-level fields
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
priority: medium
work_status: done
parent: KM-400a-1
criteria: |
  Given a glossary contains authored term headings for create-ticket.js and ticket creation pipeline
  And their definitions include multiline prose, links, lists, nested headings and fenced examples
  When GlossaryTerm metadata is exposed from the selected source revision
  Then each real term exposes its case-preserving term text and complete exact Markdown definition
  And term identity uses the established lowercase trimmed name while preserving punctuation and internal spaces
  And identities and source locations remain stable when unrelated terms are inserted or reordered
  And an empty authored definition remains empty without a generated summary
  And glossary-file frontmatter is available separately as file context rather than as authored status, components or dates on each term
  And definitions do not acquire synonym, canonical-link or triage fields absent from the canonical glossary

  Given the glossary includes apparent term headings inside comments, code fences or indented examples
  When term boundaries are recognized
  Then those examples neither create terms nor truncate the definition of a real term
  And a real level-one, level-two or level-three heading ends the preceding definition while a nested lower-level heading remains part of it
  And two real headings with the same lowercase trimmed name fail explicitly rather than losing a definition
  And an empty or absent optional glossary produces no placeholder term
depends_on: [KM-400a-1]
