notes: |
  WRITE THE MIXED-LIST CASE FIRST. NOT LAST, NOT AS AN EDGE CASE. Measured
  2026-09-08 on the whole store: of 1,739 records holding coverage entries,
  76 hold BOTH relations in one list — child ids and test paths together. That
  is legal per ac-schema.md and nobody had counted it before this tree.
  Examples to build the L2 against: BP-1100e-1 (seven child ids plus one test
  path), BP-100k-5 (one child id plus five test paths), UXP-603 (one child id
  plus five vitest node ids), ACD-1200a-11 (one child id plus one test path).
  A migration that assumes each list is wholly one thing mangles all 76
  silently, and every one of them is a record with real children.

  THE DENOMINATORS, so no descendant reports a bare number (ACS-1100,
  inherited). 3,925 records carry an id; 1,739 hold coverage entries; 2,186 hold
  none. Of the 1,739: 1,302 resolve-only, 361 unresolve-only, 76 mixed. At entry
  level, 552 unresolvable entries are path-shaped and exactly one is id-shaped.
  All figures 2026-09-08, branch ac/coverage-field-split, no sampling.
  Provisional — re-measure before implementing and expect the numbers to have
  moved; no criterion may pin one.

  THE ONE DISAGREEMENT IS THE WHOLE ARGUMENT FOR ABSTENTION. ACD-300f lists
  ACD-300f-5, which does not exist. Resolution says 'test link'; shape says
  'child link'; the author plainly meant a child. Two proxies, one record, and
  the safer-sounding rule is the one that loses the link. There will be more of
  these after the next few hundred commits. The pass must abstain on the class,
  not adjudicate it.

  EVERY SAFETY GUARANTEE HERE IS SATISFIED BY A TOOL THAT DOES NOTHING.
  'Byte-stable', 'left the ambiguous ones alone', 'changed no verdict' are all
  trivially true of a no-op. Each must be asserted in the SAME invocation as a
  conversion that genuinely happened — copy ACS-1300a-3's pairing test shape,
  which exists for exactly this reason.

  THIS L1 DOES NOT REPAIR ANYTHING. It moves existing meaning into its new
  place. Completing an incomplete parts list is ACS-1400c's job and stays there;
  conflating the two would make this pass both migrate and repair in one
  unreviewable sweep, which is how fix_ac_orphans.py got dangerous.
