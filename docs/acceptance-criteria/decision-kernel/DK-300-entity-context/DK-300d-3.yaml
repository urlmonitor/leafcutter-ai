estimated_complexity: L
it_requirements:
  - "Only resolved permitted canonical references become optional retrieval hints; ambiguous/unknown entries cannot act as direct evidence references or permission grants."
  - "Later retrieval re-applies current source/read policy and creates ordinary task evidence with independent source snapshot/provenance; meaning cards cannot populate supporting_evidence_ids."
  - "Canonical native YAML/JSON field references, including acceptance-criterion path.yaml#/criteria references emitted by the real index and recognizer, remain usable after intent. Explicit retrieval resolves the selected value, preserves the canonical pointer in evidence provenance, and excludes sibling fields even when they share a source line. Nested mapping/sequence selectors and escaped key tokens resolve exactly; missing, invalid or scalar-descendant selectors produce an explicit limitation with no whole-record fallback."
  - "Host artifacts and later native judgments preserve caller-claim/meaning/evidence distinctions and fit their own configured output limits."
  - "Live-availability claims require observations and approval-dependent decisions still require a human actor under ADR-053/ADR-060."
test_required: true
test_spec:
  - name: "test_routed_capability_consumes_canonical_hints_after_intent"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "reachability"
    description: "tests/kernel/entity_context/test_continuation.py::test_routed_capability_consumes_canonical_hints_after_intent: Drive supported native work with a real resolved reference and recording retrieval boundary; assert hints affect task evidence lookup only after intent and bodies are absent before routing."
  - name: "test_downstream_judgments_and_host_artifacts_keep_meanings_separate"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "seam"
    description: "tests/kernel/entity_context/test_continuation.py::test_downstream_judgments_and_host_artifacts_keep_meanings_separate: Inspect real native/host inputs for explicit caller/meaning/evidence labels, independent evidence IDs/provenance and configured host bounds."
  - name: "test_meaning_only_context_cannot_settle_liveness_or_human_approval"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "discrimination"
    description: "tests/kernel/entity_context/test_continuation.py::test_meaning_only_context_cannot_settle_liveness_or_human_approval: Execute live-availability and approval-dependent workflows using only cards; assert missing observation remains unresolved and human approval pause survives."
  - name: "test_native_ac_reference_reaches_task_evidence_through_service"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "reachability"
    description: "tests/kernel/entity_context/test_native_pointer_retrieval.py::test_native_ac_reference_reaches_task_evidence_through_service: Build a real native AC index and recognize its ID, then run the public service through evidence intent and real retrieval; require explicit-locator evidence containing only its criteria, with the emitted canonical pointer and content hash. Lexical fallback cannot satisfy this assertion, and criteria remain absent from initial intent."
  - name: "test_invalid_native_pointer_never_falls_back_to_whole_record"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "discrimination"
    description: "tests/kernel/entity_context/test_native_pointer_retrieval.py::test_invalid_native_pointer_never_falls_back_to_whole_record: Feed the actual recognizer's AC locator through real retrieval with no lexical terms. Missing, scalar-descendant and malformed pointer variants return no evidence and an explicit limitation; the valid control must return the selected criteria. Catch blanket refusal and fragment-dropping whole-record fallback."
  - name: "test_structured_pointer_selects_nested_value_without_same_line_siblings"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "boundary"
    description: "tests/kernel/entity_context/test_native_pointer_retrieval.py::test_structured_pointer_selects_nested_value_without_same_line_siblings: Retrieve a nested mapping value through a sequence index and escaped slash/tilde tokens in real serialized single-line JSON and YAML. Assert exact selected content, canonical provenance and content hash, excluding adjacent sibling and root fields."
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
