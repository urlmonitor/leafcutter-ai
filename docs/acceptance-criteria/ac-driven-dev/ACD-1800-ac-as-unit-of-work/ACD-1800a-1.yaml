criteria: |
  Given a requirement that will change source code and must ship the tests and a
    how-to update that go with it,
  When the requirement is inspected,
  Then the requirement carries an explicit deliverable checklist,
  And the checklist enumerates one item per artifact the requirement needs -- a
    code item, a tests item, and a how-to documentation item,
  And each checklist item names its kind (one of code, tests, docs, diagram, or
    config) and the craft responsible for producing it,
  And the full scope of the requirement is readable from the checklist alone,
    without consulting any other artifact.
