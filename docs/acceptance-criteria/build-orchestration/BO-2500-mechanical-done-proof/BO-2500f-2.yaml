    angle: boundary
    description: "A check present but carrying no enforces tag, one tagging a different id, and a JS check using '// enforces:' for this id: the first two fail with a reason naming the check and the missing tag, the JS one holds."
    proves_clause: "a named check with no enforces tag for this id fails the verification, naming the check and the missing tag"
    code_file: scripts/ac_store/_enforces_tags.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_2_enforces_tags_share_the_covers_scan_and_the_graph_carries_the_link
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: seam
    description: "Scanning a tree holding covers tags and enforces tags returns covers results identical to the same tree without the enforces tags (no fork of the scanner), tag_type 'enforces' entries appear from the same scan, deployed copies (.leafcutter/, scripts/commit_guardian/) are not scanned so no tag counts twice, and the link graph carries a check-enforces edge from each tagged check to its record."
    proves_clause: "enforces tags are collected by the same scan that collects covers tags, so the link graph carries a check-enforces link from each tagged check to the record it names"
    code_file: scripts/ac_store/done_proof.py
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_2_check_enforces_edge_is_declared_in_the_graph_json_and_the_data_map
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: criterion
    description: "The graph JSON has an edge with id check-enforces (source check, target ac, rel ENFORCES) whose note says it is checked at mark time only, and the data-map doc has the matching row; the doc and JSON agree on its enforcement rating."
    proves_clause: "enforces tags are collected by the same scan that collects covers tags, so the link graph carries a check-enforces link from each tagged check to the record it names"
    code_file: docs/reference/artifact-knowledge-graph.graph.json
    convention_test_file: unit_tests/docs/test_artifact_graph_doc_parity.py
  - name: test_bo_2500f_2_dangling_enforces_tag_is_reported_with_id_and_check
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: failure
    description: "An enforces tag naming an id that is not an active record counts toward no record and is reported as dangling with the id and the check file it was found in, in the same report and message shape as a dangling covers tag, each labelled by tag kind."
    proves_clause: "an enforces tag naming an id that is not an active record counts toward no record and is reported as dangling, with the id and the check it was found in, exactly as a dangling covers tag is (BO-2500a-1-i)"
    code_file: scripts/ac_store/done_proof.py
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
  - name: test_bo_2500f_2_check_of_a_weaker_proof_class_than_the_kind_requires_does_not_verify
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: discrimination
    description: "For a record whose declared files derive a kind with a comparing proof (BO-3500c-2 derive_proof_kind class), a check that only reads does not verify it, while a comparing check does; the class comes from the derivation and no list of check kinds is kept here. Depends on BO-3500c-2 (draft), red until it lands."
    proves_clause: "where the record's deliverable is of a kind for which BO-3500c-2 defines a proof, the check must be the instrument of that kind's proof, and a check whose class of proof is weaker than that kind requires does not verify the record"
    code_file: scripts/ac_store/_enforces_tags.py
    to_be_created: true
    convention_test_file: unit_tests/ac_store/test_bo_2500a_7.py
    must_catch:
