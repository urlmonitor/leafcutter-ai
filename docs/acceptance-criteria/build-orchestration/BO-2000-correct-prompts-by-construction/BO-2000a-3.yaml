id: BO-2000a-3
title: "Sign-off degrades safely when the feedback sink is unreachable"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a phase agent submitting feedback during sign-off per the sign-off block,
    and the feedback sink is unreachable,
  When the feedback submission fails,
  Then the agent records a submit-failed marker for that submission,
  And the agent continues and completes its sign-off,
  And the phase is not hard-failed solely because the feedback submission could not
    be delivered.
