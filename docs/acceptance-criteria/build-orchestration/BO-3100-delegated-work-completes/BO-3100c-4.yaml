  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a build driven with the setting that makes dispatched work run in the background
    turned on,
  When the build is driven end to end,
  Then every step's result is held by the layer that dispatched it before that layer
    continues, and the build's outcome is the same as when the setting is off.

  Given the same build driven in an environment where the option to choose foreground or
    background dispatch has been removed altogether,
  When the build is driven end to end,
  Then it completes with the same outcome, and no step is reported as complete without its
    result having been held.

  Given the build driven in an environment where that option has been removed,
  When any part of the system attempts to select foreground or background dispatch,
  Then the build does not fail because the option is absent.
