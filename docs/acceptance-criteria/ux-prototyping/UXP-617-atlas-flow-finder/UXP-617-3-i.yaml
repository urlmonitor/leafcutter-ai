criteria: |
  Given /flows/leafcutter/flow-render-pipeline is open with no drawer and the tab has one
    history entry,
  When the person tabs to the card named
    'Step 2 of 3: Resolve each step to its AC's live work_status (Code)' and presses Enter,
  Then the 'resolve' drawer opens and the address bar becomes
    /flows/leafcutter/flow-render-pipeline?step=resolve,
  And the tab still has one history entry, exactly as a click on the card gives,
  And when the person then tabs to the drawer's close button, which is named
    'Close step details', and presses Enter,
  Then the drawer closes and the address bar becomes /flows/leafcutter/flow-render-pipeline
    with no query,
  And the tab still has one history entry, exactly as a click on that button gives,
  And every step and branch card can be reached with the Tab key.
