id: ACS-1200c-4-i
components:
  - ac_store
title: "An approved requirement with nothing under it is reported as a contradiction, not quietly parked"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200c-4.yaml
criteria: |
  Given BP-900d.yaml — a feature-level record at readiness: approved with an
    empty covered_by and no descendants — carrying no parked marker,
  When the store-wide orphan scan is executed as a process over the real store,
  Then BP-900d is still reported, and it is reported as an approved requirement
    with nothing under it rather than as a parked record or as an ordinary
    orphan,
  And the report names its id and its readiness so the contradiction is legible
    without opening the file,
  And when a parked marker is added to BP-900d while its readiness remains
    approved, the validator rejects the record per ACS-1200c-4,
  And the record only becomes validly parkable once its readiness is lowered
    from approved.
depends_on:
  - ACS-1200c-4
