created_by: "docs/acceptance-criteria/build_pipeline/BP-1000-source-template-parity/BP-1000d.yaml"
criteria: |
  Given a maintainer needs to know exactly which scripts the merge-gate parity
    check enforces and which it deliberately ignores
  When the maintainer opens the reference documentation for this feature
  Then it states the rule that only a source script with a shipped template
    counterpart is checked, and that source-only tooling is exempt
  And it enumerates the mirrored source-template directory pairs that define the
    parity scope
  And it explains how a newly added source script enters scope (by gaining a
    shipped template counterpart) so the scope rule stays unambiguous over time
