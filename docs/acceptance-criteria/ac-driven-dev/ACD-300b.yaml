work_status: in_progress
criteria: |
  A JavaScript workflow script (create-ac.js) receives the triage routing
  decision and dispatches the correct authoring agents in sequence. The script
  handles three routing paths (strategic, behavioral, technical) and one
  short-circuit path (covered). Each agent is called as a sub-agent, receives
  the user's original request plus any ACs produced by prior agents, and writes
  its output to the AC store. The workflow script itself never writes ACs —
  it only orchestrates agents and presents confirmation gates.
