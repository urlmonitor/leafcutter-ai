notes: |
  Satisfies the component-diagram entry in BO-3100c's documentation_triggers.

  This is the diagram a future author consults before adding coordination somewhere, which
  makes "no dispatch arrow between two specialists" the load-bearing element: it states the
  durable invariant as a shape rather than as a rule to remember. The invariant behind it, in
  the user's words, is that a subagent must never depend on the result of anything it spawns —
  if it needs the result it must not delegate.

  The second scenario checks the drawing in both directions against a real drive, which is
  what makes it a coherence check rather than an illustration. A diagram that omits a dispatch
  that actually happens is exactly how the belief drifted away from the behaviour in the first
  place.

  Sequenced after c-2 because the absence claim it draws must be true before it is drawn.

  IT-PO ENRICHMENT NOTE (2026-08-26). Splitting "dispatches" from "awaits" into two declared
  attributes is deliberate. The broken arrangement also dispatched; what it could not do was
  await. A diagram that marks the coordinating layer only as "the one that dispatches" would be
  equally true of the arrangement being removed, and would teach the wrong lesson to the reader
  it exists for.
