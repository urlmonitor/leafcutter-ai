it_requirements:
  - >-
    FORM. The lint is a unit test under unit_tests/prompt_assembly/. It is not a commit hook and
    not a deployed script, so it gets no hooks_manifest entry and no deploy-map entry. It runs in
    the ordinary pytest suite, which includes CI's required pytest check. Its enumeration and
    verdict logic lives in one importable support module, shared with BO-2000g-3-i, BO-2000g-3-ii
    and BO-2000g-4, so the lint and the proof cover one population.
  - >-
    THE POPULATION IS DERIVED ON EVERY RUN. The lint walks templates/agents/ and
    templates/skills/ to any depth (every .md file) and never holds a list of files or examples.
    It reports two counts, examples examined and examples exempted. It fails when the examined
    count is zero, when either tree is missing, or when a file cannot be decoded as UTF-8. A
    vacuous pass is a defect (KI-ACS-001).
  - >-
    THE EXTENT OF AN EXAMPLE IS DEFINED ONCE, in the support module, because BO-2000g-4 appends
    exactly that extent. Suggested rule: the heading line plus the lines that follow it, up to the
    first blank line, the end of the fenced block, the next heading, or a line indented less than
    the heading, whichever comes first. The example's own leading indentation is removed. The rule
    must hold for the nested and pseudocode layouts in test-writer ~:273, status-checker ~:230,
    ticket-supervisor ~:373 and building-epics ~:457, :546.
  - >-
    ONE HEADING PATTERN WITH THE HOOK. A concrete-date line counts as a heading for the lint
    exactly when the commit-time check (templates/scripts/commit_guardian/check_feedback_id.py)
    treats it as a sign-off heading. Take the check's pattern by import, or from a shared constant
    that both read, never by retyping it. The lint adds only the placeholder date and time
    spellings (`YYYY-MM-DD HH:MM`, `<today> <time>`). A test asserts on concrete samples that the
    lint and the check agree, so the two cannot drift. If sharing the pattern needs an edit to
    check_feedback_id.py, that edit must leave the check's behaviour unchanged and be coordinated
    with GE-123e, which edits the same file. The IT PO has not read the check's source (ADR-009),
    so the coder confirms whether the pattern can be imported.
  - >-
    ONE SOURCE FOR EACH ACCEPTED VALUE, NO COPIES. (a) The real-id placeholder spellings and the
    heading-schema-illustration mark are read from the signoff skill's template source
    (templates/skills/signoff/SKILL.md), where BO-2000g-1 defines them. (b) `(not-a-signoff)` is
    read from the subsection BO-2000g-2 defines. (c) The concrete id shape and the failure
    fallback are read from INF-500d-3's vocabulary file,
    templates/scripts/feedback/submit_failure_reasons.json. That file supplies the real-id
    pattern, the reasoned-marker pattern (its group 1 is checked against the file's reason ids)
    and the legacy bare pattern. If a value cannot be found where it is defined, the lint fails
    and names what is missing. It never falls back to a built-in value.
  - >-
    TRANSITION FOR THE FALLBACK. Until the vocabulary file exists (that is, until INF-500d-3
    lands), the lint accepts two things: the bare `(submit-failed)`, which is the form signoff
    §2a step 4 documents today, and the concrete id shape the criteria state (`fb_`, a
    YYYY-MM-DD date, `_`, then eight lowercase hex characters). In this state it also emits a
    visible pytest warning that names the missing file. Once the file exists in the repository,
    reading it is mandatory. The bare form is then accepted only through the file's legacy
    pattern, and an unreadable file, or one missing a pattern, fails the lint. Whether a newly
    added bare marker is refused at commit is the check-feedback-id change's decision, not this
    lint's.
  - >-
    THE FIRST BODY LINE IS EXACT (BO-2000g-3-i). It is the line directly under the heading, with
    the example's own indentation removed. A blank line, or any other line, in that position
    fails, whatever follows it. The lint never copies the hook's two-line window.
  - >-
    AN EXEMPTION COMES FROM THE MARK ONLY (BO-2000g-3-ii). It is never inferred from
    placeholders, from a status tag that lists several values, from the end of a fenced block, or
    from where the heading sits in its block or file. The mark exempts only the one heading it
    annotates. A heading quoted in the middle of a sentence, rather than at line start after
    indentation, is not an example.
  - >-
    REPORT. Each failure names the repo-relative file, the 1-based line number of the heading,
    and the first body line exactly as found (or says it is blank). All failures are reported in
    one run; the lint never stops at the first. The status tag matches any value, not only the
    signoff skill's four, so a heading with an unlisted value (as live-surface-tester.md ~:323
    `(status: skipped)` had until BO-2000g-1 changes it to ok) is still examined.
  - >-
    PRE-CORRECTION ARM. The clause about the templates "as they stand before BO-2000g-1 and
    BO-2000g-2" is proven against a frozen copy of the pre-correction text of the four named
    examples, kept as test data: python-coder ~:332, test-writer ~:273, commit ~:302 and signoff
    ~:880, as of 2026-11-16. The lint function runs over that copy on the same code path as the
    live run. Checking out history is not used.
  - >-
    The synthetic files for the second scenario are written to a temporary copy of the skill
    tree, never into templates/skills/.
  - >-
    PERFORMANCE. The lint reads about 130 Markdown files. It must finish in under 5 s, and it
    spawns no subprocess and no build.py.
test_intent:
  - clause: "it examines every Comments-heading example in those files. A Comments-heading example is a line that begins, after any indentation and inside or outside a fenced block, with `### `, then a date slot and a time slot, then ` — ` (em-dash), then an agent name and a `(status: ...)` tag. The date and time slots may be digits (`2026-05-08 14:30`), the `YYYY-MM-DD HH:MM` placeholder, or angle-bracket placeholders (`<today> <time>`)"
    needs_test: true
    reason: "A recogniser keyed only on the `YYYY-MM-DD HH:MM` spelling passes the three building-epics `<today> <time>` entries unexamined, two of them proxy sign-offs, and one keyed on unindented lines misses the examples nested in list items."
  - clause: "it passes an example only when the line directly under the heading is a `feedback-id:` line whose value is one of:"
    needs_test: true
    reason: "A lint that checks only that some feedback-id line exists, or that the value is not blank, copies the hook's weakness and lets `TBD` through."
  - clause: "a concrete feedback id: `fb_`, a date, `_` and eight lowercase hex characters (`fb_2026-05-08_aa112233`)"
    needs_test: true
    reason: "A concrete-id rule that accepts uppercase hex, fewer than eight characters or a missing date would accept invented ids."
  - clause: "a real-id placeholder spelling that the signoff skill documents"
    needs_test: true
    reason: "A placeholder list hard-coded in the lint drifts away from the signoff skill, and a lint that accepts any `<...>` text accepts spellings the skill never lists."
  - clause: "the failure fallback exactly as the signoff skill documents it (today `(submit-failed)`)"
    needs_test: true
    reason: "Hard-coding `(submit-failed)` breaks on the day INF-500d-3 changes the documented form, and accepting any text in parentheses would accept `(skipped)`."
  - clause: "`(not-a-signoff)`"
    needs_test: true
    reason: "The value must be accepted exactly, and a close variant such as `(not a signoff)` or the bare word without parentheses must fail."
  - clause: "it fails on any other example, including one whose feedback-id value is empty, `TBD` or `none`, and it names the file, the line number of the heading, and the text it found on the first body line"
    needs_test: true
    reason: "A report without the heading's line number or the text found cannot be acted on, and treating `none` as a fallback is a plausible wrong version."
  - clause: "run against the templates as they stand before BO-2000g-1 and BO-2000g-2, it fails and names at least the python-coder red-baseline example, the test-writer skip entry, the commit audit entry and the signoff skill's failed-path pr-reviewer entry"
    needs_test: true
    reason: "A lint that passes the known violators is vacuous, which is the wrong version this arm exposes."
  - clause: "it fails and names that file and that heading's line number"
    needs_test: true
    reason: "A lint that scans a fixed file list instead of walking the skill tree never sees a newly added file."
  - clause: "when the line `feedback-id: (not-a-signoff)` is inserted directly under the same heading, the lint passes that file"
    needs_test: true
    reason: "This shows the previous failure came from the missing line and not from some other rule tripping on the synthetic file."
  - clause: "it passes"
    needs_test: true
    reason: "The lint must pass on the corrected tree, or it fails every pytest run once it is merged."
  - clause: "no template that already opened its examples with `fb_<date>_<short-hash>` or `<fb_id>` fails unless that template is rewritten to a documented spelling in the same change"
    needs_test: true
    reason: "A lint that accepts only one placeholder spelling would fail the four templates that already comply, which the criteria forbid unless they are rewritten in the same change."
delivers_to:
  - agent: python-coder
    contract: >-
      Consumed by BO-2000g-4. A function in the support module that returns the examined,
      non-exempt examples, derived on each call from templates/agents/ and templates/skills/. Each
      record is {file: repo-relative POSIX path, heading_line: int (1-based), heading: str, body:
      list[str] (the example's extent with its indentation removed)}. The module also provides
      the accepted-value reader (placeholder spellings, (not-a-signoff), fallback patterns), so
      the proof fills placeholders from the same list the lint accepts.
  - agent: python-coder
    contract: >-
      Consumed by BO-2000g-3-i and BO-2000g-3-ii. A lint entry point that takes a root directory
      (the real trees or a temporary copy) and returns {examined: int, exempted: int, failures:
      [{file: str, heading_line: int, first_body_line: str | null}]}. first_body_line is null
      when the first body line is blank.
expects_from:
  - ac_id: BO-2000g-1
    contract: >-
      Corrected phase sign-off examples, plus two definitions in the signoff skill: the
      documented real-id placeholder spellings (code spans in one subsection) and the explicit
      heading-schema-illustration mark (a literal token).
  - ac_id: BO-2000g-2
    contract: >-
      The (not-a-signoff) value, defined in one subsection of the signoff skill, and the note
      examples that open with it.
  - ac_id: INF-500d-3
    contract: >-
      templates/scripts/feedback/submit_failure_reasons.json, holding the real-id pattern
      ^fb_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9a-f]{8}$, the reasoned-marker pattern
      ^\(submit-failed:([a-z][a-z0-9-]*):([^\s:()]+)\)$ whose group 1 is one of the file's reason
      ids, and the legacy bare pattern ^\(submit-failed\)$. The lint reads the file when it is
      present. The file does not exist until INF-500d-3 lands; the transition rule is in
      it_requirements.
