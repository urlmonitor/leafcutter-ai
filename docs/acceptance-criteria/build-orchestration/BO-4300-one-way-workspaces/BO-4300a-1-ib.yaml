assigned_agent: llm-expert
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: 'args.workspace on every workflow invocation that can know its work identity up front: the
    maker''s ensure answer as a JSON object, unmodified (BO-4300c-2 shape). The workflow applies the BO-4300c-3
    acceptance predicate to it.'
expects_from:
  ac_id: BO-4300a-1
  contract: 'CLI of the one maker. Deployed at <install-root>/scripts/worktree.py (source templates/scripts/worktree.py;
    the name is provisional until this AC is built, after which that path is the contract every caller
    names). Stdlib-only Python, run as `python <absolute path> <verb> ...` from ANY cwd. Verbs: `ensure
    --kind {ticket|feature|ac|fastlane|epic|scratch} --slug <work identity> [--repo-root P] [--allow-stale-base]
    [--config-path P]` -- the only creating verb, idempotent, always fetch + build + canary; `locate (--kind
    K --slug S | --path P | --branch B) [--repo-root P]` -- read-only; `list [--repo-root P]` -- read-only
    scan of the landing place''s markers, never git worktree list; `verify --path P [--kind K --slug S]
    [--repo-root P]` -- read-only readiness re-check; `remove --path P [<up-front discard authorisation;
    flag or token, Q8 open>] [--delete-remote-branch] [--repo-root P]`; `where` -- prints the maker''s
    own absolute path. There is no --reset-existing (BO-4300d-4 resumes), no --no-bootstrap (decision
    2), and no flag that skips a readiness ingredient.'
package_surface: false
it_requirements:
- 'Entry surfaces to change: templates/commands/plan-feature.md (today calls Workflow without the pre-flight,
  so that entry always stops with ''MISSING pre-flight''), templates/skills/plan-feature/SKILL.md, templates/commands/build-feature.md,
  templates/commands/fast-lane-build.md, templates/commands/quick-fix.md and templates/skills/quick-fix/SKILL.md,
  templates/commands/finalize-feature.md, templates/skills/build-single-ticket/SKILL.md, and templates/skills/feature/SKILL.md.'
- Exactly one skill is THE workspace skill. Prefer repurposing the existing `feature` skill (one maker
  invocation, stop on a non-zero exit, relay the JSON answer) so no new package surface is registered;
  if a new skill is created instead, it must be registered in config/skill_registry.json and the feature
  skill reduced to a pointer.
- Each entry runs the maker as ONE command with an absolute path (the path `worktree.py where` prints,
  or the resolved install path) -- never a cwd-relative `python scripts/...` and never a compound shell
  command (prompt-audit checklist). On a non-zero exit it stops and does not invoke the workflow; on exit
  0 it passes the parsed answer verbatim as args.workspace.
- Entries that cannot know the work identity before the workflow resolves it (e.g. build-feature's epic
  resolution) leave the workspace to the workflow's one verbatim dispatch (BO-4300a-1-ia); the skill text
  must not describe any other way.
- No surface keeps its own step-by-step recipe (clone, worktree add, symlink or copy of .leafcutter /
  .pre-commit-config.yaml, manual build); the epic recipe in the feature skill and its project-specific
  'import settings' check are deleted.
- Skill and command templates reach consumers only through the build; edit templates/, never .claude/
  directly.
- 'TICKET LOCATION (KI-BO-20260925-build-single-ticket-treats-ticket-path-final-as-worktree-path; routed
  from BO-4300a-1-ii, lands in the SAME change set as it): templates/skills/build-single-ticket/SKILL.md''s
  step 1 runs the maker with --ticket <the ticket''s main-copy path> and maps TICKET_PATH ONLY from ticket_path_in_worktree
  of the ok answer. The ''ticket_path_final -> TICKET_PATH (the ticket''s path inside the worktree)''
  mapping is deleted, and no step of the skill reads, edits or moves the ticket at the path it was given.'
- 'Commit spelling (KI-CG-20260925-commit-delegation-hook-misses-git-dash-c): no entry surface this record
  rewrites spells a commit as `git -C <path> commit` (build-single-ticket, quick-fix and plan-feature
  skills carry that spelling today); commits are delegated to the commit agent per CLAUDE.md Commit Delegation.
  -C is acceptable only for non-commit git verbs.'
test_required: true
test_spec:
- name: test_command_published_by_each_deployed_entry_skill_runs_the_maker
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: deployed
  description: The single maker command each deployed entry skill/command publishes, executed as written
    against a temporary project, yields exactly one JSON object with status ok from the deployed maker.
- name: test_deployed_workspace_skill_publishes_no_alternative_recipe
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: unit
  angle: criterion
  description: The deployed workspace skill's text contains the one maker invocation and no clone, worktree,
    symlink, copy or build steps of its own (the text is this record's subject, so reading it is the behaviour).
- name: test_build_single_ticket_step1_command_yields_ticket_inside_the_workspace
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: deployed
  description: The step-1 maker command the deployed build-single-ticket skill publishes, executed as written
    against a temp project whose hub holds a ticket, returns an ok answer whose ticket_path_in_worktree
    is inside workspace_path and names an existing file; the skill's text maps TICKET_PATH from that field
    and from no other.
- name: test_no_deployed_entry_surface_spells_a_commit_with_dash_c
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: unit
  angle: criterion
  description: No deployed entry skill or command this record lists contains `git -C <path> commit` (the
    text is the subject; the commit-delegation hook matches only the literal 'git commit').
test_rationale: The skill text is the deliverable, so the proof executes exactly the command it publishes
  from the deployed copy -- a skill that names a wrong path or a cwd-relative path fails here rather than
  in a drive.
