package_surface: false
it_requirements:
  - "WHERE AND WHAT (IT PO decision). The declaration lives in the folder_density section of
    templates/scripts/commit_guardian/commit_guardian.json, beside max_files_per_folder and
    excluded_dirs, under the key set_aside_locations: a list of objects, each with a
    repo-relative directory `path` and a non-blank `ground` string. No new configuration
    file. Ship exactly two entries: (1) path docs/acceptance-criteria/, ground 'Holds
    acceptance-criteria records that tools read and write and nobody navigates by hand. It
    is flat by design, one folder per feature family, and its folders are bounded by the
    AC store''s tree limits rather than by a file count.'; (2) path docs/decisions/, ground
    'Holds kernel decision records, one file per decision, written and read by the
    kernel''s publish, index and precedent tools; people review records in PRs, not by
    browsing the folder.' Each ground ships as worded here; inside a quoted ground, ''
    stands for one apostrophe. No size bound on either entry (dropped by BrainCandy,
    2026-10-12)."
  - "SHARED WITH GE-127g: SHAPE AND KEY NAME, NOT THE LIST. Use the same key name, entry
    shape and blank-ground rule GE-127g's L1 pins for the doc_length section, so one
    configuration file expresses a set-aside one way. Keep a separate list in
    folder_density: a location set aside from the length standard is not thereby set aside
    from the density standard, and the reverse. GE-133 must NOT depend on GE-127g being
    built: if a shared parsing helper already exists on main when this is built, reuse it;
    otherwise implement locally. Either way, any new helper module lives in
    templates/scripts/commit_guardian/ so the build's rglob of that directory deploys it
    with no deploy-map edit."
  - "MATCHING. A staged file's folder is set aside when that folder equals a declared path
    or lies beneath it, compared by whole path components (a trailing slash on the entry is
    optional and normalised). Never by directory name at any depth, never by plain string
    prefix: docs/acceptance-criteria-archive/ and templates/acceptance-criteria/ are not
    inside docs/acceptance-criteria/. The existing name-matched excluded_dirs list keeps its
    current members and must not gain acceptance-criteria."
  - "WHICH LOCATIONS ARE SET ASIDE COMES ONLY FROM THE DECLARATION. No path is built into the
    check, and nothing in the check or in config.py supplies a default set_aside_locations:
    an absent key must reach the check as absent. Adding a feature folder under a declared
    location requires no edit to any file, and the check never writes to its configuration."
  - "UNREADABLE IS NOT EMPTY, AND IS NOT FAIL-OPEN. Three distinct states, each reported
    differently: (a) key absent -> judge every folder and state that the set-aside
    declaration could not be read, naming the configuration file and key it looked in;
    (b) key present but malformed (not a list, an entry that is not an object, a path that
    is missing, empty, absolute, contains '..', or names the repository root, a ground that
    is missing or blank) -> judge every folder and state that the declaration could not be
    interpreted, naming each offending entry; one bad entry voids the whole declaration
    rather than honouring its siblings; (c) present and empty -> judge every folder and say
    nothing about unreadability. None of (a)-(c) may take the component's fail-open path for
    internal errors or exit clean on its own account (GE-127's convention covers a check
    that cannot judge; this check can still judge)."
  - "Set-aside determination must be pure path computation over the folders the check
    already collects: no additional git subprocess per folder, and no measurable change in
    the check's run time on a commit touching 100 folders."
  - "templates/scripts/commit_guardian/ is the SOURCE; scripts/commit_guardian/ and
    .leafcutter/ copies are build outputs. Edit only the templates."
  - "TESTS. Every test drives a real git commit in a scratch repository whose pre-commit hook
    runs the DEPLOYED check taken from the shared_reference_layout fixture (marker
    @pytest.mark.shared_layout_reader). The fixture is read-only: copy what the test needs out
    of it and vary the declaration only in the scratch copy. No test spawns build.py; the
    file adds zero build.py invocations."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md, rules
    1-4)."
  - "POST-WRITE COMMANDS (from the worktree root): ruff check
    templates/scripts/commit_guardian/; python -m pytest
    unit_tests/commit_guardian/test_folder_density_set_aside.py -q; python
    scripts/ac_store/validate_ac_schema.py
    docs/acceptance-criteria/guardrail-engine/GE-133-directories-stay-findable"
test_spec:
  - name: test_store_crossing_and_new_family_commit_without_declaration_edit
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: scripts/commit_guardian/check_folder_density.py
    description: >-
      Arm 1. RED today. Parent revision has a store feature folder at 15 files; the commit
      adds 4 (to 19) and creates a new feature folder under a store component folder with
      20 files. Assert git commit exits 0 AND the configuration file holding the
      declaration is byte-identical before and after the commit.
    must_catch:
      - "name the over-limit store folders individually in the configuration instead of declaring the location"
      - "append a newly seen store folder to the declaration at run time"
  - name: test_lookalike_folders_outside_store_are_still_judged
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: scripts/commit_guardian/check_folder_density.py
    description: >-
      Arm 2. RED today. templates/acceptance-criteria/, unit_tests/acceptance-criteria/ and
      docs/acceptance-criteria-archive/ each go 15 -> 16 while the store folder goes 15 ->
      19. Assert the commit is refused and the folders named as too dense are exactly those
      three at 16, with the store folder not named.
    must_catch:
      - "add acceptance-criteria to the name-matched excluded_dirs list"
      - "treat a folder as inside the location when its path string starts with the declared text"
      - "disable the check or skip every folder under docs/"
  - name: test_absent_or_malformed_declaration_judges_and_says_so
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: failure
    surface_invoked: scripts/commit_guardian/check_folder_density.py
    description: >-
      Arm 3. RED today on the statement clauses. With the key removed, then with a single
      entry naming no location: assert the commit is refused, the store folder is named too
      dense at 19 and not as set aside, and the output states the declaration could not be
      read naming where it looked (absent case) or names the uninterpretable entry
      (malformed case).
    must_catch:
      - "treat an absent or uninterpretable declaration as set everything aside, or exit clean"
      - "report an unreadable declaration the same way as an empty one"
      - "supply a default set_aside_locations from config.py so absence is never seen"
  - name: test_empty_declaration_judges_without_claiming_unreadable
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: scripts/commit_guardian/check_folder_density.py
    description: >-
      Arm 4, the negative control. GREEN today by design. set_aside_locations is an empty
      list; assert the commit is refused with the store folder named too dense, and the
      output does not state that the declaration could not be read.
    must_catch:
      - "hard-code docs/acceptance-criteria/ in the check and ignore the declaration"
      - "report an empty declaration as unreadable"
  - name: test_set_aside_follows_the_declared_location_not_a_built_in_path
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: scripts/commit_guardian/check_folder_density.py
    description: >-
      Arm 5. RED today. The declaration names only records/criteria/; the store folder goes
      15 -> 19 and a folder under records/criteria/ goes 15 -> 19. Assert the commit is
      refused and the only folder named too dense is the store folder.
    must_catch:
      - "hard-code docs/acceptance-criteria/ in the check and ignore the declaration"
  - name: test_shipped_declaration_sets_aside_both_record_stores
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: deployed
    surface_invoked: scripts/commit_guardian/check_folder_density.py
    description: >-
      The shipped declaration, not a scratch one. RED on origin/main e93eda09a, which ships
      only the docs/acceptance-criteria/ entry. The scratch repository uses the deployed
      commit_guardian.json copied UNMODIFIED out of shared_reference_layout. At the parent
      revision docs/decisions/ holds 15 countable files and a store feature folder holds 15;
      the commit adds 2 decision records to docs/decisions/ (to 17) and 4 records to the
      store folder (to 19). Assert git commit exits 0 and the outcome names both folders as
      set aside, each with the ground the first it_requirement words for its entry.
    must_catch:
      - "ship only the docs/acceptance-criteria/ entry"
      - "add decisions to the name-matched excluded_dirs list instead of declaring the location"
      - "ship a ground other than the one the first it_requirement words for that entry"
test_rationale: >-
  Every entry is a real git commit in a scratch repository whose pre-commit hook runs the
  deployed check copied out of the session-scoped shared_reference_layout, so the tests
  prove the deployed copy reads the declaration and add no build.py spawn (each is marked
  @pytest.mark.shared_layout_reader). A test that asserts the key is present in
  commit_guardian.json passes on a check that never reads it, so none is written. The
  must_catch lists are the BA's named mutations (1)-(7), distributed to the arm that
  catches each. Red/green today: arms 1, 2, 3 and 5 RED; arm 4 GREEN by design as the
  negative control that a switched-off or hard-coded check fails. The sixth entry
  (added 2026-10-12, dec-e34583d93c00584f) is the only one that runs the SHIPPED
  configuration unmodified: it proves the two shipped entries and their grounds by a real
  commit, not by a presence test.
delivers_to:
  agent: python-coder
  contract: >-
    Per run, the folder_density check holds the declaration read from
    templates/scripts/commit_guardian/commit_guardian.json (deployed copy at run time) as:
    state (one of absent | malformed | empty | ok); the configuration file path and key it
    looked in; for malformed, the list of offending entries as written; for ok, the
    honoured entries as (path: str, repo-relative POSIX directory, normalised without
    trailing slash; ground: str, non-blank). A folder's membership answer is (set_aside:
    bool, ground: str or null), computed by whole-path-component containment. GE-133a-2's
    report consumes this; it must not re-read configuration.
