it_requirements:
  - "NORMALISATION IS APPLIED TO BOTH SIDES OF THE JOIN, AT ONE PLACE. The store-side id and the tag-side captured token must pass through the same normalisation before comparison. A second copy of the rule on the tag side is the drift shape ACS-1300a-1's final clause forbids. Note the two sides need it for different reasons: the store side is already normalised in practice because the reader parses YAML (measured: all six quoted ids resolve), while the tag side is raw text straight out of `(\\S+)`."
  - "CORRECTED 2026-09-01, AND THIS SUPERSEDES THE EARLIER 'MUST NOT TRIM A TRAILING PUNCTUATION CHARACTER' REQUIREMENT, WHICH WAS WRONG AND CONTRADICTED ITS OWN NEIGHBOUR. A trailing separator MUST be trimmed — `BO-560,` must normalise to `BO-560` — because two real records depend on it. What must NOT happen is widening: no case-folding, no truncation of a hierarchy suffix, no trimming of a character that is part of an id. Trim the separator, keep the id intact."
  - "A MULTI-ID TAG NAMES EVERY RECORD ON THE LINE, NOT JUST THE FIRST. This is a capture change, not only a normalisation one: `(\\S+)` stops at the first whitespace, so `# covers: BO-560, BO-560-1` never sees BO-560-1 at all. Whether that is solved by splitting the captured token on separators or by widening the capture is an implementation choice; both ids must end up matched either way, and whichever is chosen must keep ACS-1300a-1's no-fifth-reader clause satisfied."
  - "SEQUENCING IS BINDING, NOT ADVISORY: THIS LANDS BEFORE TQ-100b-4 OR IN THE SAME CHANGE, NEVER AFTER — CHECK BEFORE STARTING. TQ-100b-4 narrows the canonical reader so that a capture resolving to no record must be id-SHAPED, and it requires only that the narrowing 'removes nothing from the resolved list'. `BO-560,` is not id-shaped and was never in the resolved list, so TQ-100b-4 is FULLY SATISFIED by discarding it. Nothing about TQ-100b-4 is wrong; the ORDER is the hazard, and it is asymmetric — landing this first costs nothing, landing it second costs everything. Afterwards the two records stay missed permanently AND the unresolvable token disappears from the phantom-tag list, which is the only observable trace the miss leaves, so the defect becomes unfindable by the measurement that found it. PRE-FLIGHT, BEFORE WRITING ANY CODE: determine whether TQ-100b-4 has already landed. If it has, this AC's first test is no longer red for the original reason and a quiet phantom-tag list is NOT evidence of health — re-establish the signal, or measure the miss directly against `unit_tests/test_generate_ticket_from_ac.py:71` and `:308`, before proceeding."
  - "THIS AC WRITES NOTHING. It constrains a key-normalisation step inside the read-only detection pass; no code path reachable from it may open a store file for writing or assign work_status."
  - "Must handle errors gracefully per the project error handling policy. A token that normalises to the empty string is a reported abstention (ACS-1300c-3), never a silent drop and never a match."
