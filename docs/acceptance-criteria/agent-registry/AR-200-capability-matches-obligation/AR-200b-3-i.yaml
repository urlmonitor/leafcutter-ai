id: AR-200b-3-i
title: "A permission held only through the ticket-phase entry still requires the dispatch tool, an absent tools line is a shortfall, and an empty permission is not"
component: agent-registry
components:
  - agent_registry
  - supervisor_system
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an agent whose declaration permits sub-agents only through the "every
    ticket-phase agent" entry and whose tools omit the dispatch tool,
    And a second agent that permits a named sub-agent and declares no tools at
      all,
    And a third agent whose sub-agent declaration is present but empty, and
      which does not hold the dispatch tool,
    And a fourth agent that holds the dispatch tool and declares no sub-agents,
  When the comparison of permissions against permitted tools runs,
  Then the first agent is reported, because that entry counts as a permission
    regardless of how many agents it resolves to on that build,
    And the second agent is reported, because an absent tools declaration is
      not read as permitting everything,
    And the third agent is not reported, and is counted as holding no
      permission rather than an unknown one,
    And the fourth agent is not reported, because holding the means without a
      permission is not a shortfall,
  So the check cannot be escaped by expressing a permission as a rule or by
    omitting the tools line, and it stays quiet on agents with no one to call.
