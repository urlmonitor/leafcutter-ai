it_requirements:
  - "ONE SLOT, KINDED -- this is the load-bearing constraint and the whole reason the AC exists. Add exactly ONE new optional AC field, `observable_effect`: absent/null means the requirement promises nothing observable; when present it is a non-empty list of unique kind strings drawn from the closed set {smoke_surface, live_surface}. An empty list is rejected so there is no ambiguous third state."
  - "NO SECOND SLOT, EVER. `declares_side_effect`, `user_facing_surface` and `live_surface_test` must all be DERIVED from `observable_effect` by reader helpers in scripts/ac_store/, and must remain unauthorable on an AC record (additionalProperties:false already rejects them -- do not add them as schema properties). A parallel per-craft boolean is a second slot in disguise and re-creates the three-orphaned-triggers state this AC exists to remove."
  - "Land the field OPTIONAL and additive in config/ac_store_schema.json (ADR-026 safety rule 1); absence is legacy mode -- derive nothing, never fail (rule 4). additionalProperties:false at config/ac_store_schema.json line 15 IS enforced today via jsonschema.Draft7Validator (scripts/ac_store/validate_ac_schema.py ~line 152, and the same mechanism in the commit hook), so this schema slot is a hard prerequisite for every other AC in the ACD-1800f family, including ACD-1800f-2's proof content."
  - "MIRROR VALIDATION INTO EVERY ENFORCEMENT POINT THAT ACTUALLY GATES A COMMIT, and know which one is load-bearing: scripts/commit_guardian/check_ac_schema.py, its manual-validation fallback scripts/commit_guardian/_ac_schema_validators.py (the authoritative branch whenever jsonschema is unavailable), and the agent-side scripts/ac_store/validate_ac_schema.py. A kind-enum rule added only to the JSON schema is a no-op on the fallback branch."
  - "REPOINT THE DEAD ROUTING INPUT RATHER THAN LEAVING A DUPLICATED SOURCE. scripts/ac_store/generate_ticket_from_ac.py carries `declares_side_effect: bool = False` (line ~659), propagation of the key into ticket frontmatter (~lines 1914-1920), and two extraction sites reading `ac.get('declares_side_effect')` (~2772, ~2809) -- a key no AC can legally carry. Every one of these must read the derived accessor over `observable_effect` in the same change. Leaving the old parameter beside the new field is a duplicated source with exactly one live branch, which is the defect being corrected."
  - "Reader accessors must be exported from canonical source under scripts/ac_store/ so that no consumer re-implements the derivation. Never edit a deployed .claude/ copy or the workspace-parent build-output mirror (ADR-001, ADR-026)."
  - "DEPLOY-MANIFEST FIRST: any NEW module that a commit-guardian hook or done_proof.py imports MUST be added to build_ac_store's deploy_map (scripts/build_phases.py, ~line 794) in the same change, or the deployed hook and the required CI done-proof job crash with ModuleNotFoundError (CLAUDE.md, 'New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest')."
  - "Advisory before required (ADR-026 rule 3): the new shape rule must be diff-scoped so the ~2000 pre-existing ACs that carry no declaration never retroactively fail a required gate."
delivers_to:
  agent: python-coder
  contract: "AC-record field `observable_effect: null | [\"smoke_surface\" | \"live_surface\", ...]` (non-empty and unique when present), plus reader accessors exported from scripts/ac_store/: `declares_observable_effect(ac) -> bool` and `observation_kinds(ac) -> set[str]`. Consumed by ACD-1800f-1-i (craft routing), ACD-1800f-2 (proof content keyed to the declaration), ACD-1800f-3 (the declared-but-unproven verdict), ACD-1800f-4 (bundle composition) and ACD-1800f-5 (the reference doc)."
expects_from:
  ac_id: ACD-1900a
  contract: "The additive-optional-field landing in config/ac_store_schema.json: a new AC property may be declared optional without tightening additionalProperties, and a legacy AC carrying none of the new fields still validates. Until that lands, authoring `observable_effect` on any AC is rejected at commit time with 'Additional properties are not allowed'."
test_spec:
  - name: test_requirement_declaring_an_observable_effect_passes_the_real_store_validator
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Writes a real AC YAML record carrying observable_effect: [smoke_surface] into a temp store and runs the actual scripts/ac_store/validate_ac_schema.py entry point over an explicit file glob; asserts exit 0. Today that record is rejected with 'Additional properties are not allowed', so this is a genuine currently-failing assertion, not a tautology."
  - name: test_requirement_with_no_declaration_validates_and_reports_no_observable_effect
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "A legacy AC record with the field absent validates, and the reader accessor returns False with an empty kind set -- legacy mode derives nothing and never fails (ADR-026 rule 4)."
  - name: test_unknown_observation_kind_is_rejected_at_all_three_enforcement_points
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "An AC carrying observable_effect: [screenshot_diff] is rejected by scripts/ac_store/validate_ac_schema.py, by scripts/commit_guardian/check_ac_schema.py, AND by check_ac_schema.py with jsonschema forced unavailable so the _ac_schema_validators.py manual branch is the one that runs. Asserting only the JSON-schema path passes on a no-op fallback gate."
  - name: test_empty_kind_list_is_rejected_so_there_is_no_ambiguous_third_state
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "observable_effect: [] fails validation; only absence/null expresses 'no observable promise'. Prevents an empty declaration from being read as a declared-and-satisfied promise."
  - name: test_no_second_slot_the_three_legacy_trigger_names_stay_unauthorable
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "AC records carrying declares_side_effect, user_facing_surface or live_surface_test directly are each still rejected by the real validator after the change, while the same requirement expressed through observable_effect validates. This is the mechanical guarantee that a second declaration slot was not introduced -- without it, 'one slot' is a design intention nothing checks."
test_rationale: "The defect this AC corrects is a field name that lives in routing code and in the agent registry while being unauthorable on the record that routing reads, so a test that greps config/ac_store_schema.json for the key would pass on precisely the dead-ended state the store is in today. Every descriptor therefore writes a real AC record to disk and runs the real validator entry point, asserting its exit status and the value a reader gets back. The accepted and the rejected cases are asserted in the same suite so an accept-everything change (dropping additionalProperties) cannot pass, and the enforcement-point descriptor deliberately forces the jsonschema-absent branch because that is the branch that actually gates a commit when the dependency is missing."
