assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Classify each files_touched entry: a path qualifies as an implementation .py when it ends in .py AND is not under docs/ AND is not a .yaml/.json file AND is not under tickets/ AND its basename does NOT match test_*.py or *_test.py. The Test Requirements section is emitted when one or more qualifying entries exist."
  - "Emit the '## Test Requirements' heading and at least one stub line per qualifying implementation file. Implement the classification + emission in a SINGLE shared helper so the two generators cannot drift — do not inline or duplicate the predicate in either generator. As built in 4dcfd87c that owner is scripts/ac_store/_gtfa_impl_py.py (is_implementation_python_path), called by _gtfa_body.py for the emission gate and _gtfa_tests_section.py for stub annotation, and re-exported on the generate_ticket_from_ac.py shell. The goal path is NOT a second import site: epic_tickets.py shells out to generate_ticket_from_ac.py as a subprocess and so reaches the same predicate through the same code — read that absent call site as a decision, not an omission."
  - "The stub entry text must name the implementation file path so a downstream reader (the ticket-supervisor test-writer gate) can map the requirement to the file in scope."
  - "The classification predicate has no portable code path into the ticket-supervisor template (the supervisor is markdown prose, not Python). Reconcile the generator's predicate and the supervisor's notion of 'implementation .py in scope' by SPEC PARITY: state the rule once normatively (ac-schema.md) and keep both sides matching it — never assume a shared import across the .py/.md boundary."
delivers_to:
  agent: ticket-supervisor
  contract: "A generated ticket whose presence-or-absence of a '## Test Requirements' section is the authoritative signal for whether the test-writer phase is required (read by the ticket-supervisor test-writer skip rule, templates/agents/ticket-supervisor.md)"
