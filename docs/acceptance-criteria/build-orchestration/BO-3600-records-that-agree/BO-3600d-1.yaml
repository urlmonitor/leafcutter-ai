notes: |
  WITHOUT AN IDENTITY THERE IS NOTHING TO DECIDE AGAINST. A verdict has to attach to
  something that persists, or every run raises fresh anonymous findings and the
  disposition path BO-3600d requires cannot exist. This record is the precondition
  for BO-3600d-2 and BO-3600d-3 and is why it comes first.

  The second scenario is the whole L1 in one clause: what must be impossible is the
  conflict vanishing with no state at all. Note it requires presence in the output,
  not just persistence in a store — a conflict recorded somewhere nobody reads has
  vanished for every practical purpose.

  The fourth scenario is the exit, and it is deliberately narrow: agreement between
  the records, not a decision to stop reporting. Leaving by suppression is
  BO-3600e-4's subject and is forbidden there.
