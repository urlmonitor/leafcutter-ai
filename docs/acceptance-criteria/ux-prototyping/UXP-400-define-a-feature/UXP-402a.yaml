id: UXP-402a
title: "If the person rejects the drafted flow at review, no acceptance criteria are generated"
component: ux-prototyping
level: L3
status: active
req_status: approved
work_status: todo
criteria: |
  Given a drafted flow under review,
  When the person rejects it outright rather than approving,
  Then no acceptance criteria are generated from the flow,
  And the flow remains in a draft (unapproved) state,
  And nothing is written into the acceptance-criteria store for that flow.
