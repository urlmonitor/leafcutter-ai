notes: |
  THIS IS THE ONLY CLAIM ABOUT THE SPECIALIST THAT IS TRUE AND PROVABLE, AND IT IS
  DELIBERATELY NOT THE STRONGER ONE. BO-3800's notes and BO-3800b's notes both fix this and
  neither may be widened at decomposition: separation of duties is invisible at delivery
  time — one change, one identity, and nothing distinguishes a hundred lines removed by the
  author from a hundred removed by a specialist. NO CLAUSE ABOVE ASSERTS THAT THE
  RESTRUCTURING WAS PERFORMED BY THE SPECIALIST, and none may be added. What is asserted is
  a SEQUENCING property about the run: the specialist is engaged, and engaged before the
  retry. That is reachability-shaped, it is observable, and it is the weakest claim that
  still cannot be satisfied by a system which does nothing.

  THE SECOND ARM IS NOT BO-3800e IN DISGUISE. The author-clearable arm here holds the
  refusal fixed and moves ONE field — the disposition — and requires the engagement to move
  with it. Without that pairing, a single-run assertion that "the specialist was engaged" is
  satisfied by an implementation that engages one on every refusal, which is the single most
  likely wrong build in this tree. BO-3800e-1 makes a different claim about the same
  population: that the author-clearable route is the one that ships TODAY, unchanged, with
  its own parties and its own outcome. This arm says only that the engagement MOVED. The
  construction is BP-900c-4-i's, reused via GE-127e-2 rather than reinvented: a test whose
  assertion holds on a single run cannot fail on the implementation the record exists to
  exclude.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Written so the IT PO can
  lift them verbatim into test descriptors.

  (1) THE INERT ASK — THIS REPOSITORY'S OWN SCAR, REPRODUCED ON PURPOSE. MUTATION: on a
      refusal whose disposition names the specialist, write the specialist's name and the
      demand into the run's output and continue straight to the second delivery attempt
      without engaging anyone.
      MUST GO RED: the engagement-actually-took-place arm and the engagement-precedes-the-
      retry arm.
      MUST STAY GREEN: every arm of BO-3800a-1 — the change is still held and still
      re-offered — and both arms of BO-3800e-1 and BO-3800e-2. That green half is the
      evidence that this record's teeth are in the ASK and not in the hold.
      WHY THIS ONE IS MANDATORY: it is the exact shape of fast-lane-build.js, which passed
      its grep-only structural tests while never executing its gates. A descriptor that goes
      GREEN under this injection is not covering this record, whatever else it proves.

  (2) THE LATE ASK. MUTATION: attempt delivery a second time first, and engage the
      restructuring specialist afterwards.
      MUST GO RED: the engagement-precedes-the-retry arm.
      MUST STAY GREEN: the engagement-took-place arm, the party-is-the-specialist arm, every
      arm of BO-3800a-1's hold, and BO-3800e-1/e-2. An ask that arrives after the answer was
      due is a report, not a handoff, and the ordering is the only thing that separates the
      two.

  (3) THE DISPOSITION IGNORED. MUTATION: engage the restructuring specialist on every
      refusal, without reading the stated disposition.
      MUST GO RED: the author-clearable arm above, and both arms of BO-3800e-1.
      MUST STAY GREEN: the first three arms of this record, and every arm of BO-3800a-1,
      BO-3800c-1 and BO-3800d-1 — all of which the over-broad build satisfies. That is
      precisely why BO-3800e exists, and recording this injection here is how the two
      records prove they are not restatements of one another.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's, which runs
  after this pass.
