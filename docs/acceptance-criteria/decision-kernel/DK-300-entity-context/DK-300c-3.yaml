id: DK-300c-3
title: "Data policy and redaction cover every interpretation-context output"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given supplied caller text and permitted entity metadata contain values covered by configured redaction,
  And the data policy forbids repository context in external judgments,
  When interpretation context is retained or projected into provider requests, host work or traces,
  Then protected values are removed according to policy before each disclosure,
  And forbidden repository meaning content is withheld from the external judgment,
  And names, signatures, definitions and provenance fields receive the same policy treatment as other context text,
  And redaction expansion and omission still respect each applicable serialized bound with stated limitations,
  And the admitted goal remains the original request in its authorized checkpoint channel.
depends_on: [DK-300c]
