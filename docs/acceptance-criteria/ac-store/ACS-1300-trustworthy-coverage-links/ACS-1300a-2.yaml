test_spec:
  - name: test_acs_1300a_2_apply_repairs_two_records_while_the_correct_one_stays_byte_identical
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "THE CENTRAL TEST, AND THE PAIRING MUST STAY INSIDE IT. One out-of-process apply invocation over a real on-disk three-record store built with the project's real serializer. In that single run assert ALL THREE facts together: the missing-link record now holds the naming test's path in the entry form it already used; the absent-file claim is gone from the second record; and the already-correct record's file is byte-for-byte identical (sha256 of raw bytes) to its pre-run content. DO NOT SPLIT THESE INTO SEPARATE SCENARIOS — a crashed run, a disabled write path, a run nobody passed the flag to, and a run the test never invoked each satisfy the byte-identity clause alone. The two demonstrable changes in the same invocation are the only thing that excludes all four."
  - name: test_acs_1300a_2_preview_writes_nothing_and_names_the_same_findings_as_apply
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Run the tool twice over identical copies of the same starting bytes — once with no apply request, once with it. Assert (a) after the preview run no file under the store differs by a single byte, and (b) the preview report names the same missing link and the same absent-file claim the apply report names. Both halves in one test: the comparison against a demonstrably live apply run is what stops a preview that reports nothing from passing as a preview that changed nothing."
  - name: test_acs_1300a_2_second_apply_run_changes_no_file_and_reports_the_repaired_records_as_correct
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "IDEMPOTENCE ASSERTED ON FILES, NOT ON LIST CONTENTS. Re-invoke apply against the store the first apply produced. Assert no file's bytes change at all, no duplicate entry appears, and the two previously repaired records are reported as already correct rather than as still broken. Hash every file, not just the two: a re-run that reorders or re-quotes entries adds no duplicate and has still churned the store."
  - name: test_acs_1300a_2_appended_entry_follows_each_record_s_existing_entry_form
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: "One apply run over a store holding one record whose coverage entries are bare test paths and one whose entries carry a ::test_function suffix, each missing a link. Assert each gains an entry in the form it already used, and — in the same invocation — that a third, already-correct record is byte-identical. Pins 'consistent with what the record holds' rather than a globally pinned form, which would silently reformat half the store."
  - name: test_acs_1300a_2_the_apply_request_is_a_real_cli_switch_the_write_path_reads
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the coverage-link repair CLI under scripts/ac_store/, invoked as a subprocess with and without the apply request"
    description: "Invoke the production command-line entry point as a subprocess twice against identical store copies, differing only in the apply request. Assert the filesystem outcomes differ. A preview/apply distinction that exists only as a keyword argument no CLI path reads is the computed-verdict-nobody-consumes shape this repository has already shipped once in fast-lane-build.js."
