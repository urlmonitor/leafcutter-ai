notes: >-
  The second arm of BO-4100d, and separately failable from the first: creation could make
  the right thing and still describe it from the request, in which case the next defect of
  this shape is invisible again. BP-600a-2 already tells a caller to read the branch name
  out of the tool's own reported output, which is no help when the reported output is
  itself the thing that is wrong -- so the comparison asserted here is between the request
  and the branch that exists, with the report derived from the latter.
