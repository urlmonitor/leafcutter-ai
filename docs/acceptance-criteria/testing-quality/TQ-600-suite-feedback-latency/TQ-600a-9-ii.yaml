it_requirements:
  - >-
    THE CLONE WITH NO LOCAL HARDLINKS IS A SAFETY PROPERTY, NOT A DETAIL. It is what
    stops a build inside the clone corrupting the real repository's object store. Reuse
    the cached clone; do not replace the clone step with anything cheaper.
  - >-
    DO NOT MAKE THIS BUILD DIRECTED. It is the single file in the set where
    self-targeting is correct, and converting it would exercise a different code path
    from the one the originating ticket exists to cover. This is the conversion the
    parent record's boundary descriptor is aimed at.
  - >-
    THE SECOND BUILD MUST STILL FOLLOW A FIRST. Sharing the cached clone is only sound
    because the cached clone has already been built once. If the caching is ever changed
    so the clone is handed out unbuilt, the idempotence assertion becomes vacuous.
  - >-
    ABOUT 43 s IS THE PRIZE AND IT IS A SINGLE BUILD. Do not reach for a second saving
    in this file; there is not one that preserves what it proves.
  - >-
    THE BUILDER TO INSTRUMENT IS `_run_build()` AT LINE 29, AND IT IS THIS FILE'S OWN.
    Unlike the six adopter files, which share `run_build()` in
    unit_tests/portability/_bp1500g1_harness.py, this file defines its own three-line
    builder that calls subprocess.run on the CLONE's scripts/build.py (line 30). The
    count descriptor below needs `emit_execution_signal` from
    scripts/suite_performance/_shared_layout_coordination.py called there. Note the
    builder runs the clone's build.py, not this worktree's — so the signal must be
    emitted from the calling test process, not from inside the built tree.
  - >-
    THE MODULE-LEVEL CACHE IS ALREADY THERE; FIND IT BEFORE ADDING ONE. The criteria say
    a cycle "the same module already performs and already caches". Reuse that cache.
    Adding a second caching mechanism beside it gives the file two notions of "the
    clone" and reintroduces the duplicate this record exists to remove.
  - >-
    THE COUNT IS TAKEN IN ONE PROCESS. The cache is process-scoped and CI shards this
    suite with pytest-split (.github/workflows/ci.yml lines 405-410) at per-test
    granularity. Count from a single child session with no --splits, or "two builds, not
    three" is a statement about which shard you happened to look at.
