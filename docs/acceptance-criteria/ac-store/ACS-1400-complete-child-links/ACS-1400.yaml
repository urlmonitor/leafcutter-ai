criteria: |
  A requirement counts as finished only against every part it actually has.

  When a requirement is made of smaller parts, whether it is finished depends
  entirely on which parts get counted. Today a part can exist while the thing it
  belongs to holds no record of it, so a finished claim can be measured against a
  smaller set than really exists and still look completely convincing. This goal
  makes the recorded set of parts match the real one, so a finished claim is
  judged against everything it covers. Where a record is deliberately incomplete,
  that is recognised as a decision rather than repaired as a fault.
