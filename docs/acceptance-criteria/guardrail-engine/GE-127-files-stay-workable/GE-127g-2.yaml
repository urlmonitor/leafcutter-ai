id: GE-127g-2
title: "Every document set aside is reported as set aside and on which stated ground, and the two populations are counted separately"
component: guardrail-engine
components:
  - commit_guardian
  - doc_compliance
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a commit staging 5 documents of which 2 are inside a declared set-aside
    location and 3 are hand-authored documents the standard judges, all 5 within
    their permitted length,
  When the author performs an ordinary commit,
  Then the commit completes, and its outcome states that 3 documents were judged
    and 2 were set aside,
  And it names each of the 2 set-aside documents together with the stated reason
    its declared location carries,
  And neither of the 2 appears among the documents reported as within their
    permitted length — a document that was never measured is reported as
    set aside and never as compliant.

  And given the same commit with one further hand-authored document staged,
  When the author performs an ordinary commit,
  Then the judged figure it states is 4 and the set-aside figure it states is 2.

  And given instead the same commit with one further document inside a declared
    set-aside location staged,
  When the author performs an ordinary commit,
  Then the judged figure it states is 3 and the set-aside figure it states is 3,
    and the newly staged document is among those it names — so each figure moves
    with its own population and neither is a fixed number.

  And given a commit in which every staged document is inside a declared
    set-aside location,
  When the author performs an ordinary commit,
  Then the commit completes, and its outcome states that 0 documents were judged
    — it does not report that no document exceeded its permitted length, because
    none was measured.
depends_on:
  - GE-127g
