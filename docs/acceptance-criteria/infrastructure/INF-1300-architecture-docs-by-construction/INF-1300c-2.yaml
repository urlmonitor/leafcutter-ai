created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300c.yaml"
criteria: |
  Given a project whose architecture collection has no index at the place the
    authoring instructions name — docs/architecture/README.md,
  When a document is produced with its listing requested,
  Then an index is created at that place and it carries the new document's entry,
  And the created index states the collection's conventions by referring to where
    they are already stated rather than by repeating them, so there is one
    statement of each convention and not two,
  And the existing statement of the naming convention, which today refers the
    reader onward to this index, now refers to a document that exists,
  And the created index itself satisfies the project's own document checks,
  And when an index is already present at that place, it is used as it stands and
    is not replaced, re-created, or reordered.
