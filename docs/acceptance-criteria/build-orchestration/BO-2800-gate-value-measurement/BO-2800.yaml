criteria: |
  See which checks catch real problems and which only cost you time.

  Every build runs a set of checks, and right now nobody can say what any of them
  is worth: the problems they catch exist only as prose, the times they are
  overruled exist only as a passing remark, and the evidence already sitting in
  your own records is never read. So no check can be justified and no check can
  ever be retired — the set only grows. This goal makes the value of each check
  visible: problems caught are counted, overrides are counted, and the record you
  already keep starts being used, so keeping a check or dropping it becomes a
  decision backed by numbers instead of a guess nobody wants to make.
