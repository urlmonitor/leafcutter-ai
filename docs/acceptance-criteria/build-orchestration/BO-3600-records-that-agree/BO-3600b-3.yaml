notes: |
  BO-3600b's boundary note, written as behaviour: retiring a fault entry is NOT the
  same as demoting a requirement, and the two must not share one mechanism by
  accident. The accident is easy to have — both are triggered by the same detected
  conflict, so a single "resolve" path that touches both records is the obvious
  implementation and the wrong one. Once bundled, a mistaken verdict cannot be
  partly undone, and the asymmetric cost of a wrong retirement becomes unavoidable.

  The fourth scenario is the reuse clause. A second way of taking a finished badge
  away would itself be two records of one thing that can disagree — the failure this
  entire goal exists to end, recreated by its own remedy.
