criteria: |
  Given the project's pre-drive instructions currently direct the reader to link the deployed
    layout into a fresh working copy by hand, and warn that all package checks are otherwise
    silently skipped for the entire drive,
  When the parity behaviour of GE-119b-1 through GE-119b-4 is in place,
  Then that manual instruction is removed from the pre-drive instructions rather than left in
    place alongside the fix,
  And the how-to states instead what a reader should now expect — that the checks reach the
    same verdict from any working copy — and gives the one command that confirms it for the
    copy in front of them,
  And no remaining instruction anywhere in the documentation set tells a reader to create the
    layout link by hand as a prerequisite for the checks to run,
  And the related latent-hazard note about a suppression file resolving through the layout
    link is either removed with it or rewritten to describe the behaviour that now holds,
  And the removal is verified by searching the documentation set for the instruction and
    finding no surviving occurrence.
