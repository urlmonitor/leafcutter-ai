id: TQ-600a-13-xi
components:
  - testing_quality
title: "Neither the post-merge runs, the notices, the re-evaluation nor the hold ever changes the repository's code"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given that the tests the post-merge runs execute exist to catch silent corruption, that
    some of them are guardrail tests, and that an unreviewed automated change to a
    guardrail test is the riskiest change in this repository to automate,
  And the owner's decision that triage may be automated in a later piece of work and that
    fixing may not,
  When the correctness run, the timing run, the notice job, the re-evaluation job, the fix
    proof and the hold check each run along every path they have — green, red,
    did-not-complete, superseded, stale, disabled, never-run, held, pass, exempt, failed
    read, verdict change, proof passed, proof failed,
  Then none of them creates a commit, pushes or deletes a branch or tag, opens, edits,
    approves or merges a pull request, or modifies any file tracked by the repository,
  And the only writes they make to the hosting service are: creating, editing the
    description of, commenting on, closing (including as a duplicate) and reopening
    issues labelled `post-merge-red`, `post-merge-timing` or `post-merge-flaky`; creating
    and editing the hold check's own marked pull request comment; re-running a run of the
    hold workflow itself; reporting each job's own result; and, by the hold's evaluation
    job alone using the dedicated hold App's credential (TQ-600a-13-vi), creating and
    completing a check run named exactly `Post-merge suite status` on the head commit of
    the pull request being evaluated,
  And the dedicated hold App's credential makes no other write, and no other job of the
    family creates or edits a check run or a commit status,
  And the fix proof makes no write to the hosting service at all,
  And this is demonstrated by running each path against a recording double of the hosting
    service and a real scratch repository with a local bare origin, and observing that
    the recorded writes are a subset of the list above and that the repository's
    branches, tags and working tree, and the origin's refs, are unchanged,
  And adding a step that pushes a change, opens a pull request, edits a tracked file,
    dispatches, cancels, disables or re-runs any other workflow to any of these paths
    makes that demonstration fail.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-ii
  - TQ-600a-13-iii
  - TQ-600a-13-vi
