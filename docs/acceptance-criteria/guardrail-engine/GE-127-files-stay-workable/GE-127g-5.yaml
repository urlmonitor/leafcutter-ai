id: GE-127g-5
title: "A set-aside location is still a bounded place: each declares the size beyond which its documents are reported, and no location may be set aside without one"
component: guardrail-engine
components:
  - commit_guardian
  - doc_compliance
  - agent_registry
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a declared set-aside location whose entry declares, alongside its stated
    ground, a ceiling many times the limit the standard applies to a document a
    person writes,
  And a generated document inside that location standing above the authored
    limit and below its location's declared ceiling at the parent revision,
  When a regeneration leaves that document longer than it stood at the parent
    revision but still below its location's declared ceiling, and the author
    performs an ordinary commit,
  Then the commit completes,
  And the document is reported as set aside from the authored limit and is not
    reported as judged against it — a generated document that merely grew is
    still not something any author is asked to act on.

  And given the same location and the same declared ceiling,
  When a regeneration leaves that document above its location's declared
    ceiling, and the author performs an ordinary commit,
  Then the commit still completes — nobody is refused for a length they did not
    write and cannot shorten,
  And the outcome states that the document stands above the ceiling its location
    declares, states the size it measured and the ceiling it measured that size
    against, and names the source its location's stated ground identifies as
    producing the document — so what is reported is addressed to whoever owns
    that source rather than to whoever happened to stage the file.

  And given a document inside a declared location standing above its location's
    declared ceiling at the parent revision,
  When a regeneration leaves it shorter than it stood at the parent revision and
    still above that ceiling, and the author performs an ordinary commit,
  Then the commit completes, and the outcome still states that the document
    stands above the ceiling its location declares — standing above the bound is
    reported for as long as it is true, and not only on the commit that crossed
    it.

  And given that same staged content with its location's declared ceiling raised
    above the size the document measures,
  When the author performs an ordinary commit,
  Then the outcome does not state that the document stands above its ceiling,
    and it names no document as standing above any ceiling.

  And given instead that ceiling held where it was and the document regenerated
    larger again,
  When the author performs an ordinary commit,
  Then the size the outcome states is the size newly measured from the staged
    content, and the headroom it states against the declared ceiling is smaller
    by the amount the document grew — each figure read from the tree at run time
    and neither one a fixed number.

  And given a commit that declares a new set-aside location whose entry carries
    a stated ground and no ceiling,
  When the author performs an ordinary commit,
  Then the commit does not complete, and what it reports names that entry and
    states that a location may be set aside only together with the size beyond
    which its documents are reported — so no commit can create a place where a
    document grows and nothing notices.
depends_on:
  - GE-127g
  - GE-127g-1
  - GE-127g-2
doc_links:
  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127g.yaml
    relationship: parent
    status: exists
  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127c.yaml
    relationship: related
    status: exists
    relevance: >-
      THE LINEAGE, AND THE STRONGEST GROUND THIS RECORD HAS. GE-127c is not merely
      adjacent: its criteria already promise that holding work to a workable size means
      the project "does not silently create a place where files can grow without limit".
      The parent L1 creates exactly such a place — a declared location whose documents
      are exempt entirely and forever — so this record is not a new principle but the one
      GE-127c already states, applied to the exemption the parent introduces. GE-127c is
      work_status: done and cannot host a child (see the parent's notes for the mechanical
      reason), which is why its sentence is honoured here rather than there. Note the
      direction of the debt: GE-127c would not fail without this record, because its own
      coverage is about which KINDS are in scope and says nothing about which documents
      escape — so the erosion is invisible from there and this is the only place it is
      caught.
  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127g-1.yaml
    relationship: depends_on
    status: exists
    relevance: >-
      DEFINES WHAT THIS RECORD BOUNDS, AND THE RECORD THIS ONE MUST NOT RE-BREAK.
      GE-127g-1 establishes membership by declared location and the no-edit property. This
      record adds one field to each declared entry and takes no position on membership: it
      introduces no second membership test, no additional location, and no change to which
      documents are set aside. Its first arm's final clause is the negative control that
      fails if the bound is obtained by judging set-aside documents against the authored
      limit after all — which would be GE-127g-1's own mutation (2) reinstated.
  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127g-2.yaml
    relationship: depends_on
    status: exists
    relevance: >-
      THE REPORTING SURFACE THIS RECORD WRITES INTO, AND THE BOUNDARY THAT MATTERS MOST.
      GE-127g-2 requires every set-aside document to appear in EXACTLY ONE of two counted
      populations and never among those found within their permitted length. The
      over-ceiling statement here is an additional thing said ABOUT a document that is
      already counted among the set aside — it is NOT a third population, NOT a
      reclassification, and must not move the document out of the set-aside count or into
      the judged count. An implementation that satisfies this record by promoting
      over-ceiling documents into the judged population breaks GE-127g-2's first arm and
      this record's first arm together.
  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127g-3.yaml
    relationship: related
    status: exists
    relevance: >-
      THE OTHER HALF OF THE SAME WORRY, AND NOT A DUPLICATE. GE-127g-3 bounds WHICH
      documents may be set aside; this record bounds HOW LARGE a document may become once
      it is. GE-127g-3's own notes state its limit explicitly — it bounds the population
      and not its size — so a declaration that is exactly as narrow as GE-127g-3 requires
      still leaves every document inside it unbounded. Neither record may be closed as a
      duplicate of the other, and neither is satisfied by the other.
  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127g-2-i.yaml
    relationship: related
    status: exists
    relevance: >-
      ADJACENT IN SHAPE, DISTINCT IN SUBJECT, AND A WARNING FOR ENRICHMENT. That record
      requires an entry whose stated GROUND is absent, empty or whitespace-only to be
      rejected rather than honoured. This record's last arm requires the same of an entry
      with no declared CEILING. The two are one validation step in all likelihood, but
      they must stay distinguishable in what the refusal SAYS: a single message that
      cannot tell a missing ground from a missing ceiling leaves the author of the
      declaration unable to act, which is the diagnostic failure GE-127g-2-i's own third
      arm exists to prevent one level up.
  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127g-4.yaml
    relationship: related
    status: exists
    relevance: >-
      THE PUBLISHED HALF OF THIS RECORD'S MECHANISM, AND THE BOUNDARY IS EXACT IN BOTH
      DIRECTIONS. As first authored, GE-127g-4 enumerated what the published description
      must state — the declared locations, each stated ground, what a run reports for an
      unjudged document, the no-edit property, and the limit that applies to everything
      else — and it predated the ceiling, so a deliverable satisfying it exactly would have
      published an exemption with no stated bound: the reader's question "how large may one
      of these get?" would have had no published answer. That gap was raised here as a
      named follow-up and has since been DISCHARGED. On 2026-10-09 GE-127g-4 gained a third
      criteria arm requiring the published description to state that a bound applies to a
      set-aside location, that a document standing above it is reported while the commit
      still completes, and that declaring a location requires declaring the size as well as
      its ground; it also gained GE-127g-5 in depends_on and a reciprocal doc_links entry.
      That amendment was not made by this record — this author amended nothing in it, and
      its criteria and readiness remain outside this author's reach. THE BOUNDARY, WHICH
      THE DISCHARGE DOES NOT BLUR: this record owns the MECHANISM — the ceiling each entry
      declares, the report that names the size, the ceiling and the source while the commit
      completes, and the rejection of an entry declaring no ceiling — and GE-127g-4 owns the
      PUBLISHED ACCOUNT of it. Neither discharges the other: a gate that implements the
      ceiling perfectly and publishes nothing fails GE-127g-4, and published text describing
      a ceiling no gate consumes fails this record. This record's criteria do not restate
      any clause of GE-127g-4 and were not changed by the discharge.
  - path: templates/scripts/commit_guardian/_doc_length_ratchet.py
    relationship: modifies
    status: exists
    relevance: >-
      WHERE THE BRANCHING THIS RECORD'S ARMS EXERCISE LIVES, AND THE SOURCE OF THE TRAP A
      SIBLING RECORD FELL INTO. classify_dimension(current, previous, limit) at lines
      293-314 routes `previous is not None and previous > limit` to the GROWTH branch,
      which returns "grew" only when current > previous and otherwise "pass"; everything
      else goes to the CROSSING branch, which returns "over" only when current > limit.
      Read it before implementing: this record's arms deliberately exercise BOTH branches
      against the declared ceiling, and the notes state which arm is which. The same
      document sits in different branches depending on whether it is measured against the
      authored limit or against its location's ceiling, and confusing the two is how the
      third arm gets silently dropped. This is the SOURCE; scripts/commit_guardian/ and
      .leafcutter/scripts/commit_guardian/ are build outputs regenerated from it.
  - path: templates/scripts/commit_guardian/check_doc_length.py
    relationship: modifies
    status: exists
    relevance: >-
      Where the run's outcome is produced and where the over-ceiling statement joins the
      two populations GE-127g-2 requires. This is the SOURCE; the deployed copies are
      build outputs.
  - path: templates/scripts/commit_guardian/commit_guardian.json
    relationship: modifies
    status: exists
    relevance: >-
      Holds the declaration each entry of which must now carry a ceiling as well as a
      ground. The sibling file_size section is still the precedent being followed — whole
      kinds declared out of scope "each for a stated reason, not by omission" — and this
      record extends the same not-by-omission principle to the bound: a ceiling that may
      be left out is a bound that will be left out.
  - path: scripts/generate_agent_cards.py
    relationship: related
    status: exists
    relevance: >-
      THE SOURCE WHOSE OWNER THE SECOND ARM'S REPORT IS ADDRESSED TO. Cited so "names the
      source its location's stated ground identifies" has a concrete referent for the
      largest declared population: the cards are a function of templates/agents/ and of
      this generator, and a card at ten times its present length is a fault in one of
      those two and in nothing the committing author did. This record changes neither and
      no criterion here is about either.
  - path: CLAUDE.md
    relationship: describes
    status: exists
    relevance: >-
      Two passages bind, and the first outranks any test_spec. "Gate / Workflow ACs —
      Verify Behaviorally, Not by Grep": every arm here is an ordinary commit with the
      verdict and the figures read out of the commit's own outcome, and a test asserting
