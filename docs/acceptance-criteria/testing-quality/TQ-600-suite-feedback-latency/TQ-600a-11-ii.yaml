criteria: |
  RETIRED 2026-10-09 WITH ITS PARENT TQ-600a-11. This record is, in its own words,
    "THE ACCEPTANCE CRITERION FOR TQ-600a-11" — the evidence that licenses substituting
    the C-backed parser for the pure-Python one. No substitution is being made: the one
    call site the parent admitted is the agent-card generator's whole-AC-store walk, and
    that walk goes when agent cards become static. A record-by-record agreement proof
    between two parsers, only one of which is used anywhere, licenses nothing. Note the
    standing correction in the parent's notes before reusing any of this: the "four
    classes of input on which the two parsers are known to differ" below is NOT
    exhaustive — a tab inside a flow sequence is a fifth and is the one that caused the
    defects. Text below is preserved verbatim for audit.

  Given the acceptance-criteria store exactly as it stands on disk — every record of
    it, 4,635 of them at the time of measurement — and the fact so far established
    about the C-backed parser being only that it parses all of them without raising,
    which is a weaker claim than the objects matching,
  And four classes of input on which the two parsers are known to differ in general:
    a mapping with a duplicate key, a timestamp scalar, numeric scalars in the forms
    the two resolve differently — leading-zero, underscore-separated, sexagesimal,
    and hexadecimal — and a merge key,
  When every record is parsed twice, once with the pure-Python safe parser and once
    through the shared accessor, and the two resulting objects are compared for
    equality,
  Then every record in the store compares equal,
  And the comparison reports how many records it examined, and that count equals the
    number of record files on disk, so a run that examined nothing is distinguishable
    from a run that found no disagreement,
  And the comparison exits non-zero when the counts differ, rather than reporting a
    clean result over a population it failed to enumerate,
  And each of the four named input classes is represented in the compared set —
    either because the real store already holds an instance, which the comparison
    reports by record id, or because an instance is added to the compared set and
    named in the report,
  And a record that only one of the two parsers rejects counts as a disagreement and
    not as a record to skip,
  And the comparison is part of the suite as a standing guard rather than a one-off
    performed by hand, so it re-runs against the store as the store changes.
