it_requirements:
  - >-
    SURFACE: the pass is a new verb of the one maker, clear-landed (with --preview for BO-4400g-3, the same
    convention as migrate-legacy --preview). Its assessment and decision live in a new sibling module,
    templates/scripts/worktree_landed.py. It is registered like every maker module: a named entry in
    scripts/build_phases_script_deploy_standalone.py, a primary_code entry of worktree_manager in
    docs/components.json, and a row in the module table and the entry-points table of
    docs/architecture/components/worktree-manager.md. It is not merged into scripts/worktree/sweep_processes.py.
    The routine sweep's workspace part runs this verb and takes its decision and kept reasons (ONE RULE, user
    decision 2026-11-16; BO-4400d-1, BO-4400d-2); this record does not build the sweep's scratch,
    outside-item or report jobs.
  - >-
    ONE DOOR: every clear the pass makes is the door's own remove request by work name (the BO-4400g-1
    form), running the same checks a single request runs. The pass never deletes a folder itself, never
    passes a discard token, never passes --delete-remote-branch, never pushes, and never stops or signals a
    program. A door refusal is relayed as kept with the door's reason (PROCESS_HOLDS_FILES as in_use,
    UNSENT_WORK as holds_unsent_work with the door's commits and files) and is never retried another way.
  - >-
    SCOPE: the workspaces come from this project's own workspace records in its landing place, the set the
    maker's list reads, filtered to records that name this project. The main checkout and other projects'
    workspaces are never assessed, never cleared and never appear in the answer. The door's own-project
    scope check (BO-4300e-2-iii) still applies to every clear.
  - >-
    RECORD-LESS LEFTOVERS IN SCOPE: besides the records, the pass walks the workspace positions (kind/slug) of
    this project's own landing place by the landing rule, and finds each folder there that has no workspace
    record. Such a folder counts as this project's only on the evidence the door already uses for a
    record-less folder (BO-4300e-2-xii: its leftover repository files name only this project's shared
    project, compared the way the maker compares origin with the hub), never by its folder name or position
    alone. A folder with no such evidence is not reported at all. The pass never judges a leftover by the
    landed rule; it hands it to the door by the name its position gives (BO-4400g-1 resolves a name to the
    position even when the record is gone) and reports the door's answer, under the HALF-CLEARED requirement
    below.
  - >-
    LANDED RULE, DECIDED ONCE: one decision function, shared by the real pass, the preview and the per-work
    mode below, clears a workspace only when the door's own unsent-work check (BO-4300e-2, with the content
    check below) finds nothing unsent, and one of these holds. (a) The workspace has commits of its own
    (commits on its line that are not on the base commit its record names), and all of them are on the shared
    main line by identifier or by content. (b) It has no commit of its own, and no file in it has changed for
    at least the no-own-work threshold. (c) All its own commits are on its own line on the shared project but
    not all on the main line (pushed but unmerged; BO-4400g-2-v), and no file in it has changed for at least
    the pushed-unmerged threshold. Any other workspace is kept with exactly one reason from the closed set
    not_on_main, holds_unsent_work, no_own_work, in_use, landing_unconfirmed and shared_project_unreachable. A
    pushed but unmerged line younger than its threshold reads as not_on_main.
  - >-
    PER-WORK MODE (the one command every flow sends; user decisions D2 and Q2, 2026-11-16): clear-landed
    naming one work (--kind/--slug or --branch, through the BO-4400g-1 resolver) applies the same decision
    function to that one workspace with no idle threshold at all. Branch (a) clears it through the door. A
    workspace with no commit of its own and nothing unsent is cleared at once (BO-4400a-1-i). Pushed but
    unmerged work is kept as not_on_main whatever its age, because branch (c) never applies in this mode.
    The answer has the same shape as a whole pass, with that one work in cleared, kept or already_gone; work
    that has no workspace is answered in already_gone with the BO-4400g-1-i no-workspace answer. A whole-project
    pass (no work named) always applies both thresholds.
  - >-
    CONTENT, NOT IDENTITY: a squash merge leaves no per-commit counterpart on the main line, so containment
    by content is judged for the workspace's own commits taken together, never commit by commit (a per-commit
    patch match of the close-worktree kind misses a squash of several commits). When containment cannot be
    shown positively, the workspace is kept as landing_unconfirmed (BO-4400g-2-i).
  - >-
    THE DOOR MUST AGREE: the door's unsent-work check must count a content-equivalent commit as on the main
    line (BO-4100c-1, BO-4100c-1-i). Today it compares commits only by identity against the workspace's own
    line and the main line, so a squash-merged workspace whose line was deleted on the shared project is
    refused UNSENT_WORK, and the pass could never clear it without a token. The containment primitive has
    one home, used by both the door's check and the pass. It is introduced once in the maker here, judging
    the workspace's own commits together, and BO-4100c-1 reuses it later (user decision D3, 2026-11-16).
  - >-
    FRESH MAIN LINE ONLY: the pass decides against the shared project's current main line, confirmed by
    contacting the shared project at the start of the pass, never against a remembered or stale main line.
    When the shared project cannot be reached, nothing is cleared and the one answer says so (BO-4400g-2-i).
  - >-
    ASSESSMENT WRITES NOTHING: assessing writes, renames or deletes nothing in any workspace folder, its
    repository included, and changes no branch, index or working file of the main checkout. The preview uses
    the same assessment (BO-4400g-3). Only the door's own clear request, made for a workspace the pass
    decided to clear, writes.
  - >-
    IDLE AGE: measured from the newest modification of any entry in the workspace folder (ignored files and
    the repository's internals included), read before the pass or the door touches the workspace. A
    timestamp that cannot be read, or lies in the future, counts as just changed. There are two thresholds,
    each one named default kept in one place in worktree_landed.py: no-own-work, 7 days (user decision
    2026-10-29), and pushed-unmerged, 14 days (user decision 2026-11-16, BO-4400g-2-v). They are the pass's
    alone. The per-work mode, the flows, the sweep and the docs never repeat either value, and the two are
    never merged into one.
  - >-
    LINES OF WORK ARE NEVER DELETED (user decision 2026-10-29): the refs of the shared project, its main line
    included, and the local branches of the main checkout are byte-identical before and after a pass.
  - >-
    UNATTENDED: the pass never reads stdin and never prompts, it answers with exactly one JSON object under
    BO-4300c-2, and every git and process call it makes is bounded in time so the pass never hangs. One
    workspace's failure never aborts the rest of the pass. An internal error while assessing a workspace keeps
    that workspace as landing_unconfirmed and never clears it (CLAUDE.md error-handling rules 1 to 4).
  - >-
    RE-CHECKED AT THE DOOR: the assessment is never the only check. The door's own program check and
    unsent-work check run again at the moment of each clear (BO-4400g-2-iii), and concurrent passes are safe
    through the maker's existing per-work mutual exclusion, with no second lock scheme (BO-4400g-2-iv).
  - >-
    ONE TEST SEAM: the pass has exactly one documented seam between its assessment and its clearing step, for
    example an environment-provided barrier file that the pass waits on only when that variable is set. It is
    inert otherwise and bounded in time. BO-4400g-2-iii and the sweep's race record BO-4400d-1-i (the sweep
    runs this pass) both use it, so the write between assessment and clear is made the same deterministic way,
    never by a sleep race. Its name and behaviour are documented in worktree-manager.md beside the verb.
  - >-
    HALF-CLEARED AND RECORD-LESS LEFTOVERS (BO-4300e-2-ix..xii) in this project's landing place are not
    judged by the landed rule (user decision 2026-11-16, ONE RULE owned by the door): the pass hands each to
    the clearing door, which clears it only under the door's own rule for a record-less leftover matching its
    merged line (being specified in PR #1414). Until that door rule exists, they are left untouched and listed
    as kept with reason landing_unconfirmed.
  - >-
    FILE SIZES: worktree.py (425 lines) and worktree_remove.py (485 lines) take wiring only, with a net line
    count that does not grow. All new logic goes into worktree_landed.py. No limit is raised.
  - >-
    Must log at info level one line per workspace with its decision and reason, and at warning level any door
    error. A discard token never appears in a log line.
  - >-
    Edit the template sources under templates/scripts/ only (ADR-001). The change reaches the deployed maker
    through the normal build.
  - >-
    PROOF RUNS THE DEPLOYED MAKER: the deployed maker runs as a separate process against real temporary
    repositories with a real bare hub (unit_tests/build_orchestration/_workspace_maker_fixtures.py), with real
    fast-forward, merge-commit and squash merges made on the hub and a second project in the same parent
    folder. No git mock, no import of a maker module for the asserted behaviour, no build.py spawn (the shared
    reference layout), and isolated HOME and git config. Ages are set through file modification times.
    Fixture note: make_project in _workspace_maker_fixtures.py fixes the directory names (project, hub.git)
    under its tmp folder, so the second project ("blog") is built under its own tmp root beside the first.
test_required: true
test_intent:
  - clause: '"ff-1", "mc-1", "sq-1" and "idle-1" are cleared, each through the same clearing door a single clearing request uses, and no folder of them remains'
    needs_test: true
    reason: Each of the four reaches the main line or goes idle in a different way, and a rule that misses any one leaves the pile-up in place.
  - clause: '"open-1", "landed-dirty", "landed-plus" and "fresh-1" are each identical before and after'
    needs_test: true
    reason: Each is a distinct wrong-clear risk (pushed but unmerged, dirty, an extra unsent commit, a just-made workspace), so each must be snapshotted.
  - clause: 'blog''s "ff-9" and shop''s main checkout are identical before and after, and neither appears in the pass''s answer'
    needs_test: true
    reason: A pass that walks the shared parent folder or the main checkout would clear or report another project's work.
  - clause: every line of work on the shared project, and the shared main line, are identical before and after
    needs_test: true
    reason: The user decided the pass never deletes lines on the shared project, and only a comparison of the hub's refs shows it held.
  - clause: 'the pass ends with exactly one answer, without asking any question, which lists each cleared workspace by work name and location, and each kept workspace by work name, location and reason: "open-1" as not yet on the main line, "landed-dirty" as holding unsent work naming the file by path, "landed-plus" as holding unsent work naming the commit by identifier, and "fresh-1" as carrying no work of its own yet and idle for less than seven days'
    needs_test: true
    reason: Every kept reason is computed from a different check, and the unattended caller acts only on this one answer.
test_spec:
  - name: test_pass_clears_ff_mc_sq_and_idle_workspaces_through_the_door
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Fixture of the criteria on real repositories: project "shop" (make_project) with workspaces made by the
      deployed maker's ensure; commits pushed from each workspace to its own line on the bare hub; then on a
      scratch clone of the hub a real fast-forward merge (ff-1), a real merge commit (mc-1) and a real squash
      merge of the three commits as one (sq-1) are pushed to main, and the squashed line is deleted on the hub
      (the normal end of a pull request). idle-1 is made from an earlier main commit, carries no commit, and every
      file and directory in it has its mtime set (os.utime) eight days back, read before the pass runs. The test runs
      python <deployed worktree.py> clear-landed --repo-root <shop> as a separate process, with stdin closed. The
      four are in cleared with the door's own remove answer verbatim (removed_path equal to the location), and
      os.path.lexists is false for each. This needs the squash content check that the door lacks today (the
      door's _unsent_commits in worktree_remove.py compares by identity only), so sq-1 is red until the build.
    proves_clause: '"ff-1", "mc-1", "sq-1" and "idle-1" are cleared, each through the same clearing door a single clearing request uses, and no folder of them remains'
    code_file: templates/scripts/worktree_landed.py
    to_be_created: true
    convention_test_file: unit_tests/build_orchestration/test_bo_4300e_2.py
  - name: test_pass_keeps_open_dirty_plus_and_fresh_workspaces_identical
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      On the same run, open-1 (two commits pushed to its own line, a file changed an hour ago), landed-dirty (landed
      commits, one uncommitted change to a tracked file), landed-plus (first commit landed, one further commit on
      neither its own line nor main) and fresh-1 (made from the tip an hour ago, no commit) are each byte-identical
      before and after (files with .git, refs, mtime-sensitive fresh-1 compared by content hash). The pass reads
      the idle age before it or the door touches any workspace.
    proves_clause: '"open-1", "landed-dirty", "landed-plus" and "fresh-1" are each identical before and after'
    code_file: templates/scripts/worktree_landed.py
    to_be_created: true
    convention_test_file: unit_tests/build_orchestration/test_bo_4300e_2.py
  - name: test_pass_never_touches_another_project_or_the_main_checkout
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      A second real project "blog" (its own bare hub and clone in the same parent folder, built by a helper that
      calls make_project with its own tmp root, since make_project fixes the directory names project and hub.git
      and derives the landing place from the project directory name) has workspace ff-9 whose commits reached its
      main. After the pass for shop, ff-9 and shop's main checkout (branch, index, files, refs) are identical, and
      neither the ff-9 path nor the checkout path nor blog appears anywhere in the answer. The pass runs with
      --repo-root shop and the blog project exists as a sibling that the maker's project search could mistake.
    proves_clause: 'blog''s "ff-9" and shop''s main checkout are identical before and after, and neither appears in the pass''s answer'
    code_file: templates/scripts/worktree_landed.py
    to_be_created: true
    convention_test_file: unit_tests/build_orchestration/test_bo_4300e_2.py
  - name: test_pass_deletes_no_line_of_work_and_never_moves_the_main_line
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      The refs of the bare hub (git for-each-ref on the hub, main line included) and the local branches of shop's
      main checkout are byte-identical before and after the real pass, although it cleared four workspaces. The pass
      is run with a git wrapper on PATH that fails the test if git push is ever invoked, so a push of any kind
      (including --delete) is caught, not only a changed ref.
    proves_clause: every line of work on the shared project, and the shared main line, are identical before and after
    code_file: templates/scripts/worktree_landed.py
    to_be_created: true
    convention_test_file: unit_tests/build_orchestration/test_bo_4300e_2.py
  - name: test_pass_answer_lists_cleared_and_each_kept_reason_with_commits_and_files
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Stdout is exactly one JSON object, status ok, verb clear-landed, preview false. cleared lists the four by
      kind, slug, branch and absolute location, sorted by kind then slug. kept lists open-1 as not_on_main,
      landed-dirty as holds_unsent_work with files naming the tracked file by workspace-relative path,
      landed-plus as holds_unsent_work with commits holding the full 40-character id of the extra commit, and
      fresh-1 as no_own_work. blog and the main checkout appear in no list. The process is run with stdin as a real
      open pipe nobody writes to (Popen with wait, not communicate(), the WorkspaceCase.cli(stdin='open') trap) and
      ends within a timeout, so no question is asked.
    proves_clause: 'the pass ends with exactly one answer, without asking any question, which lists each cleared workspace by work name and location, and each kept workspace by work name, location and reason: "open-1" as not yet on the main line, "landed-dirty" as holding unsent work naming the file by path, "landed-plus" as holding unsent work naming the commit by identifier, and "fresh-1" as carrying no work of its own yet and idle for less than seven days'
    code_file: templates/scripts/worktree_landed.py
    to_be_created: true
    convention_test_file: unit_tests/build_orchestration/test_bo_4300e_2.py
  - name: test_clear_landed_is_reachable_through_the_deployed_maker_cli
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      main() with real argv: python <deployed worktree.py> clear-landed --repo-root <shop> is dispatched by the
      maker's verb table (worktree.py _DISPATCH today has no such verb and answers USAGE exit 64) and, once built,
      clears ff-1 through worktree_remove.cmd_remove. It also runs the per-work form clear-landed --kind feature
      --slug sq-1 and clear-landed --branch feature/ff-1 on fresh workspaces and asserts the same one-work answer
      (cleared, or kept not_on_main for a pushed unmerged one with no idle threshold applied).
    proves_clause: '"ff-1", "mc-1", "sq-1" and "idle-1" are cleared, each through the same clearing door a single clearing request uses, and no folder of them remains'
    code_file: templates/scripts/worktree.py
