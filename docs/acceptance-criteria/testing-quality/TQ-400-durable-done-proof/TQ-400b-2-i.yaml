test_spec:
  - name: test_two_demotions_in_one_run_carry_different_reasons
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      One store, one apply run, two unproven records (no covering test / failing
      covering test). Their demotion_reason values are not equal, and neither is
      a generic lapse statement. A constant-string implementation fails here.
  - name: test_failing_test_reason_names_the_real_nodeid
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      The fixture's covering test is a real test file that really fails when
      run; the second record's reason contains that test's actual pytest nodeid,
      and the first record's reason names the missing coverage tag by AC id.
  - name: test_reasons_survive_the_real_apply_run_to_disk
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    description: >-
      Read both reasons out of the files after a subprocess apply run rather
      than from an in-memory decision object, so a reason computed correctly but
      written generically is caught.
test_rationale: >-
  Under this repo's TDD order the coder's contract is literally "make the red
  baseline green", so a criterion requiring only that a reason exists is most
  cheaply satisfied by one constant string on every demoted record — worthless
  to whoever picks the work up and indistinguishable from no reason at all.
  Requiring two demotions in ONE run to carry different, cause-specific text is
  what makes that implementation fail, and asserting on a real failing test's
  real nodeid is what stops the second reason degrading to "test failed".
change_target: code
risk_surface: internal
notes: |
  Kills the cheapest green. Under this repo's TDD order the coder's contract is
  literally "make the red baseline green", so a criterion that only requires "a
  reason is present" is most cheaply satisfied by writing one constant string onto
  every demoted record — which is worthless to whoever picks the work up, and
  indistinguishable from no reason at all.

  Requiring two demotions in ONE run to carry different, cause-specific text makes
  the constant-string implementation fail. The distinction is available for free:
  the existing oracle already returns distinct causes — "no linked test found for
  <id>" versus "linked test non-passing: <nodeid>" (done_proof.py:899 and :962).
  The reason should carry that cause through rather than restate it.
