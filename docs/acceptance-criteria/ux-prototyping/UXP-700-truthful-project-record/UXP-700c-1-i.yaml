id: UXP-700c-1-i
title: "A pointer the checker cannot classify is reported as unresolvable, never as sound"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given a pointer whose target lies outside the kinds of target the checker knows how to
    resolve,
  When the record is checked,
  Then that pointer is reported as not resolvable, naming the artifact that holds it and the
    reason the target could not be classified,
  And it is excluded from the stated count of pointers resolved,
  And it is not reported as a broken pointer,
  And the run's outcome is not the outcome for a record that was checked and found sound while
    any pointer is unresolvable.
