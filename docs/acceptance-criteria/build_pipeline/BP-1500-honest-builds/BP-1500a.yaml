id: BP-1500a
components:
  - build_pipeline
title: "Building the tool never changes your work behind your back"
component: build-pipeline
level: L1
status: active
req_status: draft
readiness: reviewed
priority: high
roadmap_phase: phase_1
work_status: todo
criteria: |
  Run the build, and the only changes in your tree are the ones you made.

  A build leaves the repository it is run from exactly as it found it, so you are
  never handed edits you did not make and cannot safely commit. Where a generated
  file is deliberately kept under review, a rebuild that would change it fails a
  check that names the file -- it is never silently rewritten.

  A build step still produces every file it produces today. Where a step writes
  into this repository, what it writes is generated from this repository's own
  sources -- the place it reads from and the place it writes to are the same
  place -- so the content is a function of the sources being written from and
  never of wherever the build happens to be deploying. A step that leaves the
  tree clean by writing nothing, generating nothing, or excluding its output from
  review does not satisfy this: the file is still generated, still reviewable, and
  now correct.

  The check that enforces this is computed over every tracked generated artifact
  in the repository, not over the subset of them appearing in the change under
  review. The artifact that has drifted is by definition never in that subset --
  a source changes and the file generated from it does not -- so a verdict
  computed over the change alone reports clean on precisely the case this promise
  exists to catch, and a check of that shape does not satisfy this.
