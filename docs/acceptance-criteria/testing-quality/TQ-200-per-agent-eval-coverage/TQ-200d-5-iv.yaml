    Troubleshooting gains '### A temp folder left behind': what the warning looks like, that the run's scores are
    complete, and that the folder can be deleted by hand once the process holding it has ended. The how-to's last_updated
    is bumped.
  - >-
    DOC-DRIFT TEST: the warning wording the README and the how-to quote is the text the helper logs.
  - >-
    KNOWN ISSUE: git mv docs/known-issues/testing-quality/open-low-ki-tq-20261102-eval-temp-cleanup-error-crashes-the-run.md
