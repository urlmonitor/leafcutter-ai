req_status: superseded
work_status: todo
criteria: |
  Given a ticket markdown file has YAML frontmatter containing
    change_type: schema_change (a value not in the defined enum),
  When ticket-supervisor validates the ticket before dispatch,
  Then it rejects the ticket before spawning any phase agent
  And the error message identifies the invalid value:
    "Invalid change_type 'schema_change'"
  And the error message lists all valid values:
    "Valid values: flow_change, data_change, doc_change, prompt_change, config_change"
  And no agents are spawned and no files are modified

  Given the ticket_frontmatter_guard hook is enabled,
  When a developer commits a ticket file with change_type: schema_change,
  Then the hook rejects the commit with the same error message
  And the commit is blocked until the value is corrected
