notes: |
  THE CONSUMER-SIDE READ. ACD-1600g-1 gives the boundary a home and ACD-1600g-2
  composes it; this L2 is the one that makes it do anything. Without it the
  field is authored, validated, composed -- and never consulted, which is the
  exact dead-code shape CLAUDE.md warns about.

  VERIFIED CONSUMER: templates/agents/change-scope-reviewer.md.
    - Step 1.1 (~lines 73-74) extracts `files_touched` and `out_of_scope` from
      TICKET FRONTMATTER.
    - Step 1.3 (~line 92) computes `unexpected = actual - expected` from the
      staged diff.
    - Tier 1 "soft / continue with tag" (~lines 109-110) requires the file NOT be
      named in `out_of_scope`.
    - Tier 2 "hard / block" (~lines 120-122) fires when the file's top-level
      directory or component IS listed in `out_of_scope`, and returns
      `(status: blocker)`.
  So the adjudication ladder already exists; what this L2 changes is WHERE the
  exclusion list comes from -- the requirement, not the container.

  THE THIRD AND FOURTH THEN CLAUSES ARE THE LOAD-BEARING ONES.
    - "concludes without surfacing anything" pins the negative case, so a
      reviewer that blocks on everything cannot pass this AC.
    - The grain-invariance clause (same outcome bundled or alone) is the whole
      reason the boundary moved to the requirement. It is also the clause that a
      ticket-frontmatter-only implementation cannot satisfy, because the fast
      lane (scripts/build_orchestration/fast_lane.py) builds a single AC with no
      ticket at all -- there is no frontmatter to read.

  ORDERING. Per ADR-026's "read-side before write-side" invariant and
  ACD-1600g's own ordering note, this read-side change must land BEFORE the
  ticket is demoted to a container (ACD-1800c). If it lands after, the reviewer
  spends the whole cutover window with an empty exclusion list -- see
  ACD-1600g-4, which is the same failure in its quiet form.

  TESTABILITY. Drive the reviewer over a real staged diff in a real worktree with
  a real on-disk AC record and assert the emitted status and the named file. A
  test that asserts the template contains the string "out_of_scope" is a grep
  test: it passed on the fast-lane runner that never executed its gates
  (CLAUDE.md, fast-lane precedent, 2026-07-22) and it would pass here on a
  reviewer that reads the field and ignores it.

  2026-08-17 (IT PO enrichment). Three decisions, and one caveat raised to the
  user rather than resolved here.

  - THE ADJUDICATION MUST BE PYTHON, NOT PROSE. The criteria describe a review
    outcome, and the natural implementation is to rewrite the agent template's
    Step 1.1. That implementation is unverifiable: an LLM template cannot be
    executed by a unit test, so the AC would be signed off on a grep. Splitting
    the adjudication into scripts/ac_store/scope_boundary.py -- with the template
    reduced to calling it and rendering the result -- is what makes the four
    behavioural tests possible at all, and it is simultaneously what makes the
    no-ticket fast-lane case work. One decision satisfies both clauses.

  - TIER 2 HAS TWO CLAUSES AND ONLY ONE OF THEM CHANGES. This is not in the
    criteria and is easy to lose: today's Tier 2 also blocks on a file belonging
    to a wholly different top-level component, and that clause is the only block
    condition that fires at all while `out_of_scope` is absent everywhere. An
    implementer rewriting "the Tier 2 condition" would delete it. Added as an
    it_requirement and a fifth test.

  - CAVEAT RAISED, NOT RESOLVED (mixed surface). The declared change surface for
    this leaf spans Python (scripts/ac_store/) and one agent-template markdown
    file (templates/agents/change-scope-reviewer.md). python-coder can act on
    both extensions, so this is not a technology contradiction -- but the
    template is a PROMPT surface that this repository conventionally routes to
    llm-expert. No split was made: ACD-1600g is at the five-L2 cap and ACD-1600
    at the seven-L1 cap, so a split would require a tree restructure, which is
    the user's call. Recorded in this pass's report as a recommended follow-up
    AC for the prompt-surface half.
