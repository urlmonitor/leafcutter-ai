id: GE-113c-4
components:
  - commit_guardian
  - precommit_hooks
readiness: reviewed
priority: medium
title: "The architecture parent-link check inspects the staged documents in every layout it ships in, and refuses a broken link"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given a commit stages docs/architecture/diagrams/c2-901-example.md, whose frontmatter
    declares the parent docs/architecture/diagrams/c1-901-parent.md,
    and c1-901-parent.md exists but does not list c2-901-example.md among its children,
  When the commit-time parent-link check runs from its installed copy (the copy the
    project's pre-commit configuration invokes), and again from its package source copy,
  Then each run refuses the commit and names both c2-901-example.md and c1-901-parent.md
    and the missing child entry,
  And when c1-901-parent.md is corrected to list c2-901-example.md, both runs pass,
  And the check reads the staged documents from the project root, obtained through the one
    shared root resolver of GE-113c-1-iv, not from a folder computed from where the check's
    own file sits,
  And a run that was offered staged architecture documents and could read none of them does
    not report a pass (the outcome GE-120a-4 defines),
  And the proof is a test that runs the installed copy against a staged broken document,
    not only the package source copy,
  And every existing architecture document the now-working check refuses is either fixed in
    the same change or recorded as a known issue naming the document, and the check is not
    narrowed, exempted or made to warn to let that change through.
depends_on:
  - GE-113c
  - GE-113c-1-iv
  - GE-120a-4
