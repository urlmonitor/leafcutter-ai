notes: |
  Hierarchy expressed in metadata: a parent pointer (e.g. parent_uid), the level
  (L0/L1/L2/L3), and an order value among siblings. These are EXAMPLE field names —
  the BA/IT-PO will finalize exact field names at L2 and add them to the schema. The
  parent relationship is expressed by a metadata pointer to the parent's stable UID
  (from ACS-800a), so a child no longer depends on its name to know its parent.
