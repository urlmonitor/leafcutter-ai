id: GE-130c-2
title: The after-the-fact check stops a caller only for what that caller's command changed, never for
  another agent working in the same copy
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given two agents working in the same working copy,
  And while this caller's command, which the before-check could not judge, is running, the other
    agent changes a watched file in a way its protection's rule refuses, and this caller's
    command changes no watched file,
  When this caller's command finishes,
  Then this caller's run is not stopped for that change, and no statement names this caller as
    having made it,
  And given, in the same run, this caller's command itself changes a different watched file in a
    way the rule refuses while the other agent's change is also present,
  When this caller's command finishes,
  Then this caller's run is stopped naming this caller's file, and the other agent's file is not
    named in this caller's stop.
