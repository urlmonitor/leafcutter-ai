id: KM-400a-1-iv
title: Agent metadata preserves registry declarations and template context independently
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
priority: medium
work_status: done
parent: KM-400a-1
criteria: |
  Given a registered agent declares its id, name, tier, role, portable flag, spawning declarations, ticket-phase flag, template reference and skills_used
  And it also declares selection criteria, invoked skills, knowledge channels, document links, behavioral patterns or other optional fields
  When the Agent record is exposed as graph metadata from the selected source revision
  Then the complete authored registry entry is retained, including nested condition expressions and each nested object's associated fields
  And fractional priority such as 11.5, false flags, explicit nulls and empty lists retain their values and types
  And any referenced template's complete frontmatter and body are exposed separately with that template's own source provenance
  And differences between registry and template name, description, model, tools, verification requirements or behavioral patterns remain inspectable without overwriting either source
  And a missing or null template reference does not create fabricated template fields
  And condition expressions, configuration references and prompt instructions remain stored data rather than actions performed during exposure

  Given there is an unregistered agent template or the registry contains duplicate agent IDs or an unavailable referenced template
  When agent metadata is prepared
  Then an unregistered template cannot create an Agent record on its own
  And duplicate identities or unavailable declared templates are reported explicitly rather than producing silently incomplete records
