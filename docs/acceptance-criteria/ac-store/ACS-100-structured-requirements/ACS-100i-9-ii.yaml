assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    agent_registry_check_state:
      type: object
      description: "Three-state run outcome the shared helper returns alongside its errors, so a caller can never collapse 'nothing wrong' into 'nothing checked': {state: 'checked' | 'not_checked', reason: str|null, registry_path: str, records_examined: int}. state='not_checked' carries a non-null reason naming the resolved path and the failure (absent, unreadable, unparseable, or parsed-but-carrying-no-agent-ids). Both entry points must render reason on stderr; neither may treat state='not_checked' as a pass."
  reference_file_path: "scripts/ac_store/validate_ac_schema.py"
  n_location_rule: "2"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python scripts/ac_store/validate_ac_schema.py docs/acceptance-criteria"
  constraints:
    - "FAIL CLOSED ON REPORTING, FAIL OPEN ONLY ON THE VERDICT. An unreadable registry must produce an explicit did-not-run result, never a silent pass and never a default-true. The producer-name verdict is suppressed so one broken registry cannot block every commit, but the SUPPRESSION ITSELF IS REPORTED — once per run, on stderr, naming the resolved registry path and the reason."
    - "COPY THE EXISTING RUN-WIDE-SKIP PRECEDENT, NOT THE SILENT ONE. validate_ac_schema.py::main() lines 375-389 already print one WARNING for an unimportable jsonschema instead of a per-file silent pass; the registry skip goes in the same place and the same shape, loaded once for the whole run beside `registry_ids = load_registry_ids()` (line 368). Do NOT copy _ac_components.components_field_errors's `if registry_ids:` guard verbatim — it is correct and mute, and the muteness is the defect."
    - "THREE STATES MUST BE DISTINGUISHABLE IN THE OUTPUT: checked-and-clean, checked-and-refused, and not-checked-because-<reason>. A reader of the run's summary must be able to tell them apart without inspecting the exit code, because the first and the third share an exit code of 0."
    - "AN EMPTY OR NON-CONFORMING REGISTRY IS 'NOT CHECKED', NOT 'EVERY NAME IS INVALID' AND NOT 'EVERY NAME IS VALID'. A file containing an empty object, a file whose top-level agents key is absent, and a file that parses to a non-list all take the not_checked branch with a distinct reason. Do not let a successfully-parsed-but-empty registry silently reduce to an empty allow-list that refuses every record."
    - "EXAMINED-COUNT STILL APPLIES. A skipped producer-name check must not suppress the run's record count: the run still reports how many records it examined, so a not-checked run over 295 records is distinguishable from a not-checked run over zero (KI-ACS-001). The skip message must never be produced by a run that simply had no input."
    - "DO NOT RELAX THE REAL-VIOLATION POSTURE. This criterion loosens the response to an INTERNAL ERROR only. ACS-100i-9's refusal of a genuinely unregistered producer must stay a refusal and must not become a warning. The two are orthogonal, and collapsing them is the failure mode to guard against during implementation (ac-store PROJECT_CONTEXT)."
    - "ERROR HANDLING POLICY, MECHANICALLY ENFORCED. The registry read is external I/O: try/except on the specific exceptions (OSError, ValueError / json.JSONDecodeError) with a WARNING log naming the path and the exception. No bare except (Ruff E722), no blind except Exception (BLE001), no except block that only sets a flag without logging (TRY family). Returning an empty set on failure is acceptable ONLY because the helper also returns the state object — a bare empty set is what makes the failure inaudible."
    - "THE COMMIT-TIME SIDE MUST STILL EXIT 0 ON THIS GROUND ALONE. An unreadable registry adds a stderr line and contributes no error string to the hook's error list. Verify the hook's other checks — test contract, declares_side_effect, pattern bindings — are unaffected by the skip."
delivers_to:
  agent: python-coder
  contract: "The not_checked run-state signal on the shared helper — {state, reason, registry_path, records_examined} — rendered on stderr by both entry points. Any later consumer of the producer-name rule (the fast lane's roster work under ADR-035) must read this state rather than inferring a pass from a zero exit."
