notes: |
  REQUESTED BY BRAINCANDY, 2026-10-25 ("quick-fix each of the still open items"), closing the
  three residues GE-127d-3-v accepted.

  MEASURED IMPACT, 2026-10-25, over every tracked covered file against main's measure: 50 of
  3558 files measure higher, all JS/TS from one-line blocks (largest +120
  templates/workflows-js/plan-feature.js, already over its limit; most others +2), none crosses
  its limit. No tracked SQL or shell file holds joined statements. Both independent oracles
  (ast for Python, the TypeScript compiler's tokens for JS/TS) agree with the measure on every
  tracked file: 3347 .py, 205 JS/TS, 0 disagreements.

  KNOWN RESIDUE, ACCEPTED. Keys match the expanded form only when the file indents in the
  language's usual unit; a file indented otherwise still measures the same, and only the
  repayment diff can differ. A JavaScript statement without a `;` (relying on ASI) inside a
  one-line block does not make the braces a block.

