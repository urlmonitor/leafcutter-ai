notes: |
  Satisfies the sequence-diagram half of BP-1100g's documentation_triggers.

  WHY A SEQUENCE DIAGRAM IS THE RIGHT FORM HERE AND NOT DECORATION. This L1's
  central risk is a boundary being widened by someone who cannot see it. The
  producer/consumer split runs across four participants and two trees
  (BO-2900g plans, BP-1100g records, BO-2900a judges), and the one thing a reader
  must take away is that no message crosses from the hand-off check into the
  observer. An absent arrow between two drawn participants states that far more
  legibly than a paragraph can.

  THE THIRD CLAUSE IS THE WHOLE DIAGRAM. Everything else on it is context for it.

