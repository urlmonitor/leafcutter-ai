change_target: code
risk_surface: safety
test_required: true
it_requirements:
  - "The listing flag must gate the index write only. No other output of the run may vary with it - not the produced document's bytes, not the parent's reciprocal entry, not any log-driven side effect that writes to disk."
  - "The run must write nothing outside the produced document and the single reciprocal entry in its parent: no temporary or lock files left behind, no sequence-number cache, no touched neighbour frontmatter, no created directories beyond the document's own destination directory."
  - "Any scratch file the implementation needs must be created outside the project tree or removed before the run exits, since the observable is a whole-project difference and not a list of expected paths."
  - "The producing script's source must live under templates/scripts/ so the flag's semantics are the same in a consumer install as here."
  - "Errors on the no-listing path must follow the project error handling policy in CLAUDE.md and must not leave partial output behind."
test_spec:
  - name: test_whole_project_difference_is_only_the_document_and_its_parent_entry
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Hash every file in a git-initialised temporary project, run the real CLI without the listing flag, hash again, and assert the difference is exactly the new document plus the single added line in its parent. Enumerate the difference from the snapshots, never from a list of paths the test expected to change."
  - name: test_no_index_is_created_when_the_listing_is_not_requested
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: criterion
    description: "In a project with no docs/architecture/README.md, run without the listing flag and assert the file still does not exist; then in a project that has one, assert its bytes are unchanged."
  - name: test_produced_document_is_identical_with_and_without_the_listing_flag
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Run the same request into two fresh copies of the same starting project, one with the listing flag and one without, and assert the two produced documents are byte-identical. Pins the flag to exactly one effect."
  - name: test_no_stray_files_survive_the_run
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "From the same whole-tree snapshots, assert no file was added anywhere other than the destination - including temporary files, lock files, caches and empty directories - and that no existing file's mtime-independent content changed."
test_rationale: >-
  The criteria state the whole-project comparison explicitly, and the reason survives into
  the test contract: an observation that checks only the index has already assumed it knows
  where a stray write would land, and the writes worth catching are the ones nobody
  predicted. A snapshot difference costs no more than the narrow check and can see a
  temporary file, a touched neighbour and a cache written somewhere unexpected. The
  identical-document descriptor cannot be replaced by reading the source for a conditional
  around the index write: that conditional can be present and reached on both paths, which
  is exactly the grep-shaped false green CLAUDE.md warns about for gate and workflow ACs.
