  post_write_commands:
    - "python scripts/build.py --target-dir ."
  notes: |
    This is the ordering guarantee of BO-1000a-1 stated as an edge case; same
    surface (templates/workflows-js/finalize-feature.js), same python-coder owner.
    Policy constraints:
    - The start-of-step line must be flushed/emitted before the step dispatches
      its sub-agent, so a subsequent error or malformed-result return cannot
      pre-empt it. The in-flight step must be recoverable from the progress
      stream WITHOUT relying on the error branch printing its own line.
    - Applies to every step that dispatches a sub-agent or otherwise can fail,
      including the intermediate closure step (see BO-1000a-2-i).
    - No new config key. ADR-001 build.py round-trip parity.
