id: INF-600c
title: "See where each agent gets its knowledge"
component: infrastructure
level: L1
status: active
criteria: |
  A per-agent knowledge flow diagram showing what this agent knows at startup.

  Each agent card includes a diagram that maps which of the system's
  knowledge channels feed this specific agent: which skills it auto-loads,
  which PROJECT_CONTEXT files it reads, which CLAUDE.md sections apply,
  which folder READMEs it sees, and any ticket-scoped context it receives.
  You can see the full knowledge picture for one agent without reading the
  system-wide architecture doc.
