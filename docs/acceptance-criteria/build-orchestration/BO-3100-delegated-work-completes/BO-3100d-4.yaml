id: BO-3100d-4
title: "A planning agent can pull every criterion in an area and re-read it for contradictions before adding another"
component: build-orchestration
components:
  - ac_store
  - ac_driven_dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a planning agent about to add or amend a criterion in an area,
  When it invokes the coherence re-read for that area,
  Then it receives every criterion in that area,
    And what it receives matches the area's contents on disk at that moment.

  Given an area containing two criteria that contradict each other,
  When the re-read is invoked over that area,
  Then both are present in what the agent receives, so the contradiction is available to be
    noticed.

  Given an area too large to present whole,
  When the re-read is invoked,
  Then it reports that it could not present the area whole, naming what it omitted,
    And it does not return a silently reduced set.

  Given the re-read invoked over any area,
  When it completes,
  Then it makes no claim about whether the criteria it returned are consistent with one
    another.
depends_on:
  - BO-3100d
  - BO-3100d-2
