notes: >-
  WHY THE ESCAPE HATCH IS MANDATORY AND WHY IT MUST BITE. Some checks are genuine census
  or measurement and have no input they could be asked to refuse; a regime with no honest
  exemption gets switched off the first time it is right about something inconvenient.
  That is not a hypothetical here — KI-CG-017 records a detector that already existed,
  reported five unreachable checks, and was skipped rather than acted on because its
  verdict arrived as a commit blocker. So the hatch exists. But an unjustified exemption
  is the whole regime's off switch, which is why a groundless one is reported and fails,
  and why a postponement is treated as groundless. Those two rules are what stop the hatch
  from being the answer to every day-one finding.


  THE CONTRADICTED-EXEMPTION CLAUSE IS THE ONE THAT MAKES THIS MORE THAN PAPERWORK. An
  exemption is a claim about the check — that it has no refusal to demonstrate. That claim
  is falsifiable: feed the check a known-bad input and watch it refuse. Without this clause
  the exemption is self-certified, and a self-certified exemption is exactly the
  well-formed declaration nobody checked against reality that this bleed's fifth instance
  consists of.


  NAMED MUTATION FOR THE FIRST ABSENCE-ASSERTING CLAUSE. "A grounded exemption is not
  counted among the checks whose refusal has not been demonstrated, and does not by itself
  cause the run to fail" is green on arrival. INJECTION: drop the exempt disposition and
  treat any check without an observed rejection as not-demonstrated. Under that injection
  every census-shaped check appears as never-demonstrated and the run fails on them; this
  clause must go RED naming those checks, and return to green on revert. This is the
  false-alarms-on-day-one scenario, whose one natural remedy is weakening the check until
  the alarms stop — so run the mutation rather than describing it.


  NAMED MUTATION FOR THE POSTPONEMENT CLAUSE. INJECTION: accept any non-empty ground
  string, which is what the schema's own minLength: 1 permits today. Under that injection
  a ground reading "deferred" is honoured and the check disappears from every failing
  class; this clause must go RED, and return to green on revert. Write the postponement
  vocabulary as data the fixture can extend, not as a literal set the test also hardcodes,
  or the test and the implementation will agree with each other and with nothing else.


  NAMED MUTATION FOR THE CONTRADICTED-EXEMPTION CLAUSE. INJECTION: skip feeding the
  known-bad input to any check that declares itself exempt — the obvious efficiency, and
  the one that makes the exemption unfalsifiable. Under that injection a check that
  demonstrably refuses keeps its exemption and this clause must go RED. This mutation is
  the reason the exemption must not short-circuit the run.
