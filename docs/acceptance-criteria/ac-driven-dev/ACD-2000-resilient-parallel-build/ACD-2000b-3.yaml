it_requirements:
  - "THE EXISTING RELEASE PATH DOES NOT SATISFY THIS AC. Verified: release_claim (~line 224) runs only on a graceful non-success exit. A SIGKILL, a destroyed worktree, a lost shell or a host reboot never reaches it, and the current record carries neither owner nor instant, so nothing afterwards can tell a live claim from an abandoned one. Reclaim is not merely unimplemented -- it is currently impossible to express."
  - "RECLAIM MUST BE DECIDABLE FROM THE REQUIREMENT RECORD ALONE, by a process unrelated to the owner. No supervisor must be alive, no external registry consulted, and no cooperation from the vanished effort required. Any design that needs the original effort to return, or a coordinator process to survive, fails the criteria outright."
  - "THE STALENESS THRESHOLD IS A NAMED, CONFIGURABLE VALUE WITH A CONSERVATIVE DEFAULT -- not a literal buried at the comparison site. The default must exceed the longest realistic single-requirement build: fast-lane runs execute whole pytest suites, so the honest unit is minutes, not seconds. Under-setting it is the failure mode the third Then clause exists to catch."
  - "NEVER JUDGE LIVENESS BY PROCESS ID ALONE. A pid is reused, and it is meaningless when the owner ran on another host or in a destroyed worktree -- exactly the scenarios in the Given. If a heartbeat is used, it must be refreshed by the same shared helper that performs the claim, or a long quiet build will be reclaimed out from under itself; if pure age is used, say so and state the age."
  - "THE TAKEOVER IS RECORDED ON THE RECORD -- previous owner, new owner, and the moment -- so the question 'am I still the owner?' is answerable. Pair this with the enforcement half: a claimed-owner write must re-check ownership before it proceeds. Without that check, reclaim converts a visibly stuck requirement into an invisible concurrent double-build, which is a strictly worse failure than the one being fixed."
  - "THE TAKEOVER ITSELF GOES THROUGH ACD-2000b-2's ATOMIC TAKE. Two reclaimers judging the same claim stale at the same moment must not both take over -- the reclaim path is a claim, and inherits the same exclusion rather than reimplementing one."
  - "RECLAIM IS A STATE TRANSITION ON THE RECORD ONLY. It must not delete, clean up, or otherwise touch the vanished effort's worktree, branch, or files; a zombie owner that resumes must find its workspace intact so it can be diagnosed."
  - "RECLAIM MUST COVER A PARTIALLY-TAKEN SET, using the set identity ACD-2000b-2-i stamps on each member -- that is how the interrupted-mid-set clause is satisfied without the interrupted effort tidying up."
  - "Follow the project error handling policy (Ruff E722/BLE001/TRY): typed except, log-or-reraise, no bare except. A failed staleness read must not default to 'stale' -- fail closed, leave the claim alone, and log."
delivers_to:
  agent: python-coder
  contract: "The reclaim rule and its verdict: for a claimed requirement, { abandoned: bool, owner, claimed_at, threshold_applied } plus the takeover operation that atomically installs a new owner and records the previous one. Consumed by ACD-2000b-2-i (partial-set residue), ACD-2000b-3-i (the state diagram's reclaim edge) and ACD-2000b-5 (the operator's manual-release procedure)."
expects_from:
  - ac_id: ACD-2000b-1
    contract: "Owner identity and claim instant on the record -- the two inputs without which staleness cannot be judged at all."
  - ac_id: ACD-2000b-2
    contract: "The atomic take, reused unchanged for the takeover so two simultaneous reclaimers cannot both succeed."
test_spec:
  - name: test_requirement_claimed_by_a_sigkilled_process_becomes_takeable
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "A real child process takes a requirement and is SIGKILLed so no cleanup handler runs; a fresh process then determines the claim abandoned and takes it over, with itself recorded as owner and the moment updated."
  - name: test_live_owner_within_the_threshold_is_not_taken_over
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "The same scenario with the owner still alive and its claim inside the threshold; asserts no takeover occurs and the original owner is intact."
  - name: test_takeover_records_the_previous_and_the_new_owner
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "After a takeover, asserts the record names both the vanished owner it displaced and the effort that took over, with the moment of the takeover."
  - name: test_returning_original_owner_cannot_resume_after_a_takeover
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "A fresh process re-using the displaced owner identity attempts to proceed against the reclaimed requirement; asserts it is told it no longer holds the claim rather than writing as though it did."
  - name: test_two_concurrent_reclaimers_yield_exactly_one_new_owner
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Two real processes judge the same abandoned claim stale simultaneously, repeated; asserts every round installs exactly one new owner."
test_rationale: "Each half of this rule passes on the opposite broken implementation, so both must be asserted in the same suite: the abandoned case alone passes on a rule that reclaims everything, and the live case alone passes on a rule that reclaims nothing. Abandonment must be produced by SIGKILLing a real child process, because the whole point is the path where no finally, atexit or signal handler runs -- a test that simulates abandonment by calling release() exercises precisely the graceful path a vanished effort never reaches, and would pass on today's code. The zombie clause is tested by a fresh process re-using the displaced owner identity, since the killed process cannot literally return; that is the observable form of 'cannot silently resume'. The concurrent-reclaimer test is present because the takeover is itself a claim and would otherwise be the one claim path that skipped ACD-2000b-2's exclusion."
