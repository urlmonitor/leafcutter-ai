notes: |
  BLOCKS EVERY SIBLING. Every other GE-129 L2 lists this record in depends_on (user decision,
  2026-09-17, recorded on GE-129a). GE-129 L3s reach it through their parent L2.

  WHY THREE ATTEMPTS PER CALLER. A value that is present once is not an identity rule; the probe
  must show whether agent_id / agent_type are stable for the same caller. A single observation
  cannot distinguish a documented field from an incidental one.

  WHY THE SECOND SCENARIO LIVES HERE AND NOT UNDER GE-129d. GE-129d's notes ask for the permission
  prompt's behaviour per mode to be decided by observation "as part of GE-129a's live probe". It
  is the same scratch-repository run, and GE-129d-2's refusal set is defined by this finding
  rather than by a list of mode names.

  THE STOP RULE. Case (3) carrying no identity makes GE-129c unmeetable as framed: a workflow's
  commit specialist would be indistinguishable from the top-level session and refused wherever
  no person is reached. The criterion does not choose a fallback; it returns the decision to the
  user. Cases (2)/(4) missing identity would have the same effect on the Agent-tool path and are
  also reported, but the user's stop rule names case (3).

  CASE (6) IS THE INPUT TO GE-129a-4. If a user- or plugin-scope definition of the same name
  arrives with an agent_type indistinguishable from the package's, name-based identity cannot
  tell them apart at run time, and the parity check is the only safeguard (the stated limit,
  GE-129e-4).

  THE DISPATCH SCENARIO (added 2026-09-17, user decision). GE-129d-2-i refuses a top-level
  session's dispatch of the commit specialist in a no-person mode and leaves workflow runs'
  dispatches alone. Only this scenario can supply the value that tells the two apart. If it
  records that none does, GE-129d-2-i fails closed (the session's dispatch is refused -- which in
  that mode also refuses the workflow run's) and the finding goes back to the user.

  declares_side_effect: true -- derived from the first Then ("a findings record is written").

  ASSIGNMENT (BA proposal, IT PO to confirm): python-coder -- the probe is a scripted capture
  harness around a registered guard. Where the findings record lives is the IT PO's.
