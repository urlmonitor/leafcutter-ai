id: BO-2000e-2-iii
components:
  - build_orchestration
title: "The coder stays held back when the evidence that tests exist is missing, empty or stale"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a code ticket whose Test Requirements section is absent,
    and no usable evidence that tests exist is available for it -- the test-writer phase
    reported that it wrote no test files, or reported no test-writing outcome at all, or
    no test-writer phase is scheduled for the ticket, or the test files recorded by an
    earlier drive are no longer on disk,
  When the supervisor reaches the point where it would spawn the coder phase,
  Then it does not spawn the coder,
  And it holds the ticket back with a reason stating that tests must exist first,
  So missing, empty or stale evidence never counts as tests existing and the guard fails closed.
depends_on:
  - BO-2000e-2
