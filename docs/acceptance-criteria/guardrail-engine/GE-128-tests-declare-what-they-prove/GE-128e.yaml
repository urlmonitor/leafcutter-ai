criteria: |
  The refusal names the test and hands you the next step.

  Being stopped identifies which test is missing a declaration and what a
  declaration looks like, and it distinguishes the two problems that look alike —
  no declaration at all, and a declaration naming something that does not exist.
  Where no suitable requirement exists yet, being stopped points at how one is
  created, so the only ways forward are never just inventing a name or switching
  the rule off.
