notes: |
  Retrospective refinement of KM-400a-3-i. Test is the existing immutable
  reference specialization, not an execution result or newly discovered test
  inventory. The reader receipt reports 23 passing cases and ten caught
  mutations. Supplied arbitrary result-like properties remain source data;
  enrichment has no authority to manufacture runtime outcomes or freshness.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
estimated_complexity: S
it_requirements:
- Only supplied Test entities may be enriched; test discovery, execution and current filesystem observations cannot
  supply new outcomes or freshness.
- Exclusions are exactly the top-level properties keys _native_projection, _native_identity and _native_source_path;
  existing result-like properties remain attributed source data and are not interpreted as new execution proof.
