notes: |
  Satisfies the how-to trigger on ACS-1200d. Written as a REPLACEMENT rather
  than an addition: the last clause removes any surviving instruction to skip
  the check when recording an idea, which is the habit the whole goal exists to
  end. A new procedure sitting next to the old workaround leaves the workaround
  in circulation.

  Scope line: the fields and their validity rules are documented once in the
  reference (ACS-1200a-3); this how-to is the procedure and the decision, and
  links to the reference rather than duplicating it.

  IT-PO ENRICHMENT (2026-08-14). A test_spec is set rather than
  test_required: false because the load-bearing clause is a REMOVAL, and removal
  clauses are what silently rot. The one real risk of that clause is
  over-application: PROJECT_CONTEXT.md's account of the historical bypass is
  evidence, not instruction, and is named as an explicit non-target.
