assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: >-
    The stage canary's verdict, as read by the workspace maker's readiness canaries
    (templates/scripts/worktree_canaries.py, BO-4300c-1-ii), per run of
    `precommit_canary.py --stage <stage>`: exit 1 with `PRECOMMIT_CANARY_REJECTED (<stage>)` on stdout
    = the stage fired; exit 0 with no marker = input not reserved, or nothing merged (ORIG_HEAD absent);
    exit 1 with no marker and one stderr line `precommit_canary: git <args> exited <rc>: <git stderr>`
    = git ran and failed, which the maker counts as not fired (HOOKS_INACTIVE). The maker needs no
    change: its own canary flow sees git exit 0 throughout. Carrying the git report into the
    HOOKS_INACTIVE answer is out of scope (see notes).
expects_from:
- ac_id: BO-4300c-1-ii
  contract: >-
    stage_canaries in the commit_guardian.json beside the running canary: pre-commit.path and
    post-merge.path (repo-relative POSIX path strings), commit-msg.message (one line, no newline).
    The generated .pre-commit-config.yaml registers `python <output_root>/scripts/commit_guardian/precommit_canary.py --stage <stage>`
    for each stage, pass_filenames false for pre-commit and post-merge, true for commit-msg (the
    message file path is the last argument).
- ac_id: BO-4300f-4
  contract: >-
    unit_tests/build_orchestration/_workspace_maker_fixtures.py: ensure_deployed_layout() -> Path of
    the session-cached deployed layout (deployed canary at
    .leafcutter/scripts/commit_guardian/precommit_canary.py, commit_guardian.json beside it, generated
    .pre-commit-config.yaml at the layout root); _workspace_maker_builders._isolated_git_env() -> env
    dict with isolated HOME/USERPROFILE, GIT_CONFIG_GLOBAL and GIT_CONFIG_NOSYSTEM.
package_surface: false
it_requirements:
- >-
  SCOPE: the code change is confined to templates/scripts/commit_guardian/precommit_canary.py, the
  only tracked source (scripts/commit_guardian/ and .leafcutter/ are gitignored build outputs), plus
  the test modules named in test_spec. worktree_canaries.py, worktree_readiness.py and
  commit_guardian.json need no change: in the maker's own canary flow every git call already exits 0,
  so healthy repositories see no behaviour change. No registry entry is added (package_surface false);
  refreshing the existing `_comment` text of the three precommit-canary-<stage> members to mention
  failing closed is allowed and adds no key or member.
- >-
  GIT RAN AND FAILED == GIT COULD NOT START (BO-1700b-1, KI-CG-20260901): when a git call the canary
  relies on exits with a status that does not mean "nothing to report", the canary fails closed exactly
  like the existing "git could not start" path -- non-zero exit, no PRECOMMIT_CANARY_REJECTED marker
  anywhere in its output -- and the failure is never read as an empty change set. Settled approach
  (2026-10-09 investigation): the failing git call prints one line
  `precommit_canary: git <args> exited <rc>: <git stderr>` to stderr and raises
  subprocess.CalledProcessError, which run_stage's existing OSError/SubprocessError handler already
  maps to exit 1 with no marker.
- >-
  REPORT SHAPE: the stderr report names the git command as run (its arguments), git's exit status and
  git's own stderr text, trimmed of surrounding whitespace and never discarded or paraphrased. Re-running
  the named command in the same directory and environment reproduces the reported status. The marker
  never appears in the report.
- >-
  POST-MERGE, ONLY A MISSING RECORD IS "NOTHING MERGED": before listing what a merge added, the
  canary probes for ORIG_HEAD. Only the absence of the ORIG_HEAD record (git's quiet-verify exit 1)
  means nothing was merged, which gives exit 0 with no report. Every other outcome of the probe (for
  example 128 when GIT_DIR names a folder that is not a repository) and every non-zero exit of the
  listing call is a git failure under the rule above. Evidence (git 2.52.0.windows.1, checked
  2026-10-10): `git rev-parse -q --verify ORIG_HEAD^{commit}` ALSO exits 1 when ORIG_HEAD is present
  but names an object that does not exist, while the unpeeled `git rev-parse -q --verify ORIG_HEAD`
  exits 0 there and the listing call then fails with 128 ("bad object"). So the absence probe must not
  peel, or a dangling record is reported as "nothing merged"
  (test_after_merge_canary_fails_closed_on_dangling_orig_head). This refines the coordinator's
  suggested `ORIG_HEAD^{commit}` probe.
- >-
  COMMIT-MSG COMPARES BYTES, NEVER DECODES: the message file is read as raw bytes. Its first line
  (bytes.splitlines()[0] with any trailing b"\r" removed) is compared for exact equality with the
  declared reserved line encoded as UTF-8. A message with no lines (an empty file) is "not reserved".
  Nothing decodes the message, so a cp1252 or other non-UTF-8 message can neither crash the canary nor
  block an ordinary commit, and a reserved first line followed by a non-UTF-8 body is still rejected
  with the marker. A message file that cannot be read stays inside the existing fail-closed handling
  (exit 1, no marker).
- >-
  NAME LISTS COMPARE BYTES TOO (IT PO addition: same defect class as the commit-msg crash, reproduced
  on the current deployed canary on 2026-10-10): git's NUL-separated name list (pre-commit and
  post-merge) is read as raw bytes and split on NUL. The membership test uses the declared reserved
  path encoded as UTF-8. Reading git's output as locale text crashes the canary (exit 1 with a
  traceback). It does so on an ordinary staged path whose UTF-8 bytes include 0x81 (for example the
  city name Lodz spelled with its Polish letters, U+0141 first) under a cp1252 locale, where byte 0x81 is
  undefined, and on any non-UTF-8 staged path under a UTF-8 locale, so ordinary work is blocked.
  git's stderr is captured as bytes and decoded only for the report, with undecodable bytes replaced.
  The decode never raises.
- >-
  UNCHANGED CONTRACTS: the no-argument PRECOMMIT_CANARY_OK path is byte-for-byte unchanged
  (unit_tests/commit_guardian/test_precommit_canary.py). The "git could not start" path keeps exit 1
  and its `precommit_canary: git failed for <stage>` stderr line, so
  unit_tests/build_orchestration/test_bo_4300c_1_canary_git_failure.py stays green unmodified. The
  reserved inputs still come only from the stage_canaries entry of the commit_guardian.json beside the
  running canary (BO-4300c-1-ii), never hard-coded. Exit 1 with the marker stays the only "fired"
  signal (worktree_canaries._hook_rejected).
- >-
  The canary stays stdlib-only, well under the 400-line .py limit (100 lines today) and within the
  commit-guardian complexity limits. check-exception-handling IO-001 stays satisfied: every git call
  and every file read sits inside the fail-closed handling.
- >-
  PROOF RULES (BO-4300c-1-iii, BO-4300f-4): every test runs the DEPLOYED canary,
  `ensure_deployed_layout() / ".leafcutter/scripts/commit_guardian/precommit_canary.py"` with the
  deployed commit_guardian.json beside it, resolved through the shared locator
  unit_tests/build_orchestration/_workspace_maker_fixtures.py. It runs as a separate process
  (sys.executable plus the absolute path), never as an import of the module, and never from the
  templates/ or scripts/ copy. No mock of git and no grep of source (CLAUDE.md "Gate / Workflow ACs --
  Verify Behaviorally, Not by Grep").
- >-
  Tests must not spawn the package's own scripts/build.py (CLAUDE.md "Tests must not spawn their own
  build.py"): the deployed copy comes from ensure_deployed_layout()'s one session-cached build.
- >-
  ISOLATION: all temporary projects live under the test's temp directory. Every fixture git call and
  every canary run uses an isolated global and system git config (reuse
  _workspace_maker_builders._isolated_git_env: HOME/USERPROFILE, GIT_CONFIG_GLOBAL,
  GIT_CONFIG_NOSYSTEM). Each starts from an environment with the inherited repository-locating
  variables removed (GIT_DIR, GIT_WORK_TREE, GIT_INDEX_FILE, GIT_COMMON_DIR, GIT_OBJECT_DIRECTORY,
  GIT_ALTERNATE_OBJECT_DIRECTORIES, GIT_PREFIX), so a suite run from inside a git hook can neither read
  nor write the developer's repository. A test that needs a non-repository sets GIT_DIR to an empty
  folder under the temp dir and GIT_CEILING_DIRECTORIES to the temp dir's parent. Afterwards the
  developer's own repository's branches, registered worktrees and local git config are unchanged
  (BO-4300f-4-i, F14, KI-TQ-012).
- >-
  Git spelling (KI-CG-20260925-commit-delegation-hook-misses-git-dash-c): every commit, merge and
  canary run in the tests sets git's working directory through cwd=, never `git -C <path> commit` or
  `git -C <path> merge`.
- >-
  REPLACED TEST: unit_tests/build_orchestration/test_bo_4300c_1_real_install.py::test_registered_canary_hooks_are_inert_for_ordinary_input
  is removed. It runs outside any repository, where git falls into --no-index mode and lists nothing,
  so it cannot fail. Its replacement is
  test_registered_canaries_are_inert_for_ordinary_commit_and_merge_in_a_real_repo. The removal lands
  in a test-only change (the red-baseline commit) and is never staged together with the
  precommit_canary.py change, because check-contract-shrinking refuses a test deletion staged with
  production code.
- >-
  MUTANT ARMS CHECK THEMSELVES: the reject-everything mutant is a temp-dir copy of the deployed
  canary, with the deployed commit_guardian.json beside it, changed only so every listed path counts as
  reserved. It never edits templates/, scripts/ or the shared deployed layout. The test first asserts
  that the mutant rejects the ordinary input with the marker, so a mutation that did not apply, or a
  mutant that cannot start, fails loudly. Only then does it assert that the inert proof fails for the
  mutant.
- >-
  FILE SIZE: each new test module stays under the 400-line .py limit, which check-file-size applies
  to unit_tests/. Scenarios 1-4 go in test_bo_4300c_6.py; scenario 5 and its mutant arm go in
  test_bo_4300c_6_real_install.py. Shared repo-building helpers, if any, go in a leading-underscore
  helper module (for example _bo_4300c_6_fixtures.py) instead of growing
  test_bo_4300c_1_real_install.py (188 lines) or _workspace_maker_fixtures.py (340 lines).
test_required: true
test_spec:
- name: test_commit_time_canary_fails_closed_on_corrupt_index_with_git_report
  target_dir: unit_tests/build_orchestration/
  covers: [BO-4300c-6]
  framework: unittest
  type: behavioral
  angle: failure
  surface_invoked: python <deployed layout>/.leafcutter/scripts/commit_guardian/precommit_canary.py --stage pre-commit
  description: >-
    test_bo_4300c_6.py. Two arms in a real temp repo, one with the declared reserved pre-commit path
    staged and one with only an ordinary file staged; .git/index is then truncated. The deployed canary,
    run with cwd = the project, exits non-zero. PRECOMMIT_CANARY_REJECTED is absent from stdout and
    stderr. stderr carries one `precommit_canary: git <args> exited <rc>:` line whose non-zero rc is
    reproduced by re-running `git <args>` in the same cwd and env, and git's own "index file smaller
    than expected" text.
  must_catch:
  - git's non-zero exit read as an empty staged-file list, so the canary exits 0 -- the shipped defect,
    "the reserved file is not staged"
  - the git failure reported with PRECOMMIT_CANARY_REJECTED, so readiness counts it as the stage firing
  - git's stderr discarded, so the report names neither the exit status nor git's message
- name: test_commit_time_canary_fails_closed_when_git_dir_is_not_a_repository
  target_dir: unit_tests/build_orchestration/
  covers: [BO-4300c-6]
  framework: unittest
  type: behavioral
  angle: failure
  surface_invoked: python <deployed layout>/.leafcutter/scripts/commit_guardian/precommit_canary.py --stage pre-commit
  description: >-
    test_bo_4300c_6.py. Same two arms (reserved path staged / only an ordinary file staged) with
    GIT_DIR set to an empty folder under the temp dir and GIT_CEILING_DIRECTORIES set to the temp dir's
    parent. The canary exits non-zero with no marker. Its stderr report names a git command and a
    non-zero status that re-running the command reproduces, and includes the first line of git's own
    stderr from that re-run.
  must_catch:
  - git's non-zero exit (129 under a non-repository GIT_DIR) read as an empty staged-file list (exit 0)
  - the git failure reported with PRECOMMIT_CANARY_REJECTED
- name: test_after_merge_canary_passes_when_nothing_was_merged
  target_dir: unit_tests/build_orchestration/
  covers: [BO-4300c-6]
  framework: unittest
  type: behavioral
  angle: boundary
  surface_invoked: python <deployed layout>/.leafcutter/scripts/commit_guardian/precommit_canary.py --stage post-merge
  description: >-
    test_bo_4300c_6.py. Two arms: a fresh `git clone` of a temp source repo, and a fresh repo with one
    commit. Precondition: `git rev-parse -q --verify ORIG_HEAD` exits 1 in each. The deployed post-merge
    canary, run by hand with cwd = the project, exits 0 with no marker and no
    `precommit_canary: git ... exited` report on stderr.
  must_catch:
  - a missing ORIG_HEAD treated as a git failure, so a hand run in a fresh clone exits 1
- name: test_after_merge_canary_fails_closed_when_git_dir_is_not_a_repository
  target_dir: unit_tests/build_orchestration/
  covers: [BO-4300c-6]
  framework: unittest
  type: behavioral
  angle: failure
  surface_invoked: python <deployed layout>/.leafcutter/scripts/commit_guardian/precommit_canary.py --stage post-merge
  description: >-
    test_bo_4300c_6.py. After a real --no-ff merge (so ORIG_HEAD exists), the canary runs with GIT_DIR
    pointing at an empty non-repository folder and GIT_CEILING_DIRECTORIES at the temp dir's parent. It
    exits non-zero with no marker, and never exits 0. The stderr report names the failing git command,
    a non-zero status that re-running the command reproduces, and git's own "not a git repository"
    text.
  must_catch:
  - every failure of the ORIG_HEAD probe or of the merge listing treated as "nothing was merged" (exit 0)
  - the git failure reported with PRECOMMIT_CANARY_REJECTED
- name: test_after_merge_canary_fails_closed_on_dangling_orig_head
  target_dir: unit_tests/build_orchestration/
  covers: [BO-4300c-6]
  framework: unittest
  type: behavioral
  angle: discrimination
  surface_invoked: python <deployed layout>/.leafcutter/scripts/commit_guardian/precommit_canary.py --stage post-merge
  description: >-
    test_bo_4300c_6.py. After a real --no-ff merge, .git/ORIG_HEAD is overwritten with a well-formed
    object id that names no object, so the record is present but broken. The canary exits non-zero with
    no marker, and its stderr report names the failing git command, its non-zero status and git's
    own "bad object" text.
  must_catch:
  - an absence probe that peels the record (ORIG_HEAD^{commit}), which exits 1 for a dangling record as
    well as for a missing one, so a broken repository is reported as nothing merged
- name: test_commit_msg_canary_lets_non_utf8_and_empty_messages_through
  target_dir: unit_tests/build_orchestration/
  covers: [BO-4300c-6]
  framework: unittest
  type: behavioral
  angle: boundary
  description: >-
    test_bo_4300c_6.py. A real repo whose .git/hooks/commit-msg shim runs the deployed canary as
    registered (`--stage commit-msg "$1"`). Two arms: `git commit -F <file>` with the bytes
    b"Gr\xf6\xdfe\n" (cp1252), and an empty message with --allow-empty-message, each run with cwd =
    the project. Each commit exits 0 and advances HEAD. stdout and stderr contain neither the marker
    nor "Traceback". `git cat-file commit HEAD` of the first arm still contains b"Gr\xf6\xdfe".
  must_catch:
  - the message file decoded as UTF-8, so a cp1252 message raises UnicodeDecodeError, exits 1 with a
    traceback and blocks an ordinary commit -- the shipped defect
  - the first line taken without guarding an empty message (IndexError crash)
- name: test_commit_msg_canary_rejects_reserved_first_line_with_lf_or_crlf
  target_dir: unit_tests/build_orchestration/
  covers: [BO-4300c-6]
  framework: unittest
  type: behavioral
  angle: discrimination
  surface_invoked: python <deployed layout>/.leafcutter/scripts/commit_guardian/precommit_canary.py --stage commit-msg <message file>
  description: >-
    test_bo_4300c_6.py. The deployed canary, run as the hook runner runs it with the message file path
    as the last argument, reads message files whose bytes the test fixes. Three files are rejected with
    exit 1 and the marker: reserved + b"\n"; reserved + b"\r\n" + b"body\r\n"; and reserved + b"\n\n" +
    b"Gr\xf6\xdfe\n" (non-UTF-8 body). Two near misses exit 0 with no marker: reserved + b" x\r\n", and
    b"subject\r\n" + reserved + b"\r\n". A real `git commit -F` of the LF reserved message is
    rejected and HEAD is unchanged.
  must_catch:
  - the first line compared without dropping a trailing carriage return, so a CRLF reserved line passes
  - the whole message decoded before comparing, so a reserved first line with a non-UTF-8 body crashes
    instead of being rejected with the marker
  - a byte comparison that matches a prefix or any line instead of exactly the first line
- name: test_ordinary_non_ascii_and_non_utf8_paths_never_crash_the_canary
  target_dir: unit_tests/build_orchestration/
  covers: [BO-4300c-6]
  framework: unittest
  type: behavioral
  angle: boundary
  description: >-
    test_bo_4300c_6.py (IT PO addition under "never blocks ordinary work"). Index entries for
    b"\xc5\x81\xc3\xb3d\xc5\xba.txt" (Lodz with its Polish letters in UTF-8; contains byte 0x81) and
    b"Gr\xf6\xdfe.txt" (not UTF-8) are staged through
    `git update-index --index-info` with bytes on stdin, which works on every platform. The deployed
    pre-commit canary exits 0 with no marker and no "Traceback". With the reserved path also staged,
    it exits 1 with the marker. A --no-ff merge of a branch adding that UTF-8 Lodz file leaves the post-merge
    canary at exit 0 with no marker.
  must_catch:
  - git's name list read as locale text, which raises UnicodeDecodeError on byte 0x81 under cp1252 or on
    a non-UTF-8 path under a UTF-8 locale, so an ordinary commit is blocked
- name: test_registered_canaries_are_inert_for_ordinary_commit_and_merge_in_a_real_repo
  target_dir: unit_tests/build_orchestration/
  covers: [BO-4300c-6]
  framework: unittest
  type: behavioral
  angle: deployed
  surface_invoked: the precommit-canary-pre-commit and precommit-canary-post-merge entries of the deployed generated .pre-commit-config.yaml
  description: >-
    test_bo_4300c_6_real_install.py. Replaces test_registered_canary_hooks_are_inert_for_ordinary_input.
    Each registered entry is read from the deployed layout's generated .pre-commit-config.yaml and run as
    [sys.executable, <deployed canary absolute path>, *its arguments after the script], with cwd = a
    real temp repo. Preconditions: `git diff --cached --name-only` lists the staged ordinary file;
    after `git merge --no-ff` of a branch adding an ordinary file, `git rev-parse -q --verify ORIG_HEAD`
    exits 0 and the ORIG_HEAD..HEAD added-file list holds that file. Both canaries exit 0 with no
    marker and no git-failure report.
  must_catch:
  - the inert check run outside any git repository, where git falls into --no-index mode and lists
    nothing, so a canary that rejects everything still passes -- the replaced test
- name: test_registered_canaries_reject_reserved_inputs_in_the_same_repo
  target_dir: unit_tests/build_orchestration/
  covers: [BO-4300c-6]
  framework: unittest
  type: behavioral
  angle: criterion
  description: >-
    test_bo_4300c_6_real_install.py. In the same repo and through the same registered entries,
    staging the declared reserved pre-commit path makes the pre-commit canary exit 1 with the marker.
    After a --no-ff merge of a branch adding the declared reserved post-merge path, the post-merge
    canary exits 1 with the marker.
- name: test_reject_everything_canary_fails_the_inert_proof
  target_dir: unit_tests/build_orchestration/
  covers: [BO-4300c-6]
  framework: unittest
  type: behavioral
  angle: discrimination
  description: >-
    test_bo_4300c_6_real_install.py. A temp-dir copy of the deployed canary, with the deployed
    commit_guardian.json beside it, is altered so every listed path counts as reserved. The test first
    checks that the mutant exits 1 with the marker on the ordinary staged file and on the ordinary
    merge, so the mutation applied. It then checks that the inert proof shared with
    test_registered_canaries_are_inert_for_ordinary_commit_and_merge_in_a_real_repo raises
    AssertionError for the mutant, at both the pre-commit and the post-merge stage.
  must_catch:
  - a canary that rejects every staged file
  - a canary that rejects every file a merge brings in
test_rationale: >-
  Every assertion is made on what the deployed canary did in a real temporary git repository when run
  as its own program, the way the hook runner runs it: its exit status, whether the rejection marker
  appears, its stderr report, and the repository afterwards. The replaced test shows why that matters.
  It ran outside any repository, where git lists nothing, so a canary that rejected everything passed it.
  Each scenario therefore carries a discrimination arm in the same repository: a precondition that
  git really lists the ordinary file, the reserved input rejected in that repository, and a
  reject-everything mutant shown to fail the proof. Each git-failure arm re-runs the command the report
  names, which proves the reported status is git's own and not invented. A direct-import test with a
  mocked git could pass while the deployed copy is stale (F13). It also cannot produce git's real
  failure statuses: 128 on a corrupt index, 129 or 128 under a non-repository GIT_DIR, 1 for a missing
  ORIG_HEAD, and 128 for a dangling one.
