notes: |
  Amendment provenance (2026-08-24): amended in place, not superseded, per
  docs/how-to/ac-traceability-store.md.

  UNRESOLVED CONTRADICTION WITH THIS RECORD'S OWN CHILD. BP-600c-3-i
  (work_status: done) requires the green phase to run not only the new test but
  also existing tests that import or reference the fixed file, and to halt on
  any newly-broken related test before committing. The shipped green phase runs
  the single new test file and nothing else, so a fix that repairs its own test
  while breaking a neighbour reaches the commit phase unchallenged. The
  mutation proof added above does not close this: it proves the test is coupled
  to the fix, which is a different question from whether the fix broke anything
  else. Left stated rather than amended away, for the same reason as
  BP-600c-2-i — this is an unbuilt requirement, not an obsolete one.
