id: GE-126e-1
title: "Every check is classified by running it and not by reading it"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given two fixture checks enrolled alongside the real ones — the first written to reproduce
    a recorded shape by terminating with the ordinary success value when the place it needs
    cannot be located and the second written to refuse whenever it cannot reach what it
    needs,
  And for each check something that genuinely violates the rule that check enforces,
  When the census runs each check twice out of process — once from a working directory where
    its prerequisites resolve and once from a working directory where they do not — and
    records for each of the two runs which of three outcomes it produced: the work was
    refused the check said it could not inspect or the check reported a clean pass,
  Then it classifies the first fixture as an instance because it refused in the first run and
    reported a clean pass in the second,
  And it classifies the second fixture as not an instance because it never reported a clean
    pass from a run in which it inspected nothing,
  And for every check it classifies as an instance it records the two working directories and
    the two outcomes so a reader can re-run the pair by hand and see the same difference,
  And a check that refuses in both runs and a check that passes in both runs are classified
    differently from each other and neither is classified as an instance,
  And no classification is assigned to any check from the content of its source.

  Coverage note: covered only by running the census over a fixture set whose expected
  classification is known in advance and asserting each classification. The two fixtures are
  the control pair: a census that classifies everything as an instance passes on the first
  and fails on the second, and a census that classifies nothing does the reverse. A census
  that derives classifications by searching source text does not cover this criterion — it
  reports on dead code and is quietly wrong in both directions.
