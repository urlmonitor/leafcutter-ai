assigned_agent: python-coder
estimated_complexity: M
it_requirements: |
  Each eval result persists the git SHAs (or content hashes) of its trigger inputs;
  a result is stale when any recorded input SHA differs from the current revision's.
  A staleness check enumerates affected agents deterministically from the trigger
  manifest (TQ-200b-3) and fails hard when a triggered agent has a missing OR stale
  result — reusing the coverage-gap error semantics of TQ-200a-1, never a skip/pass.
  Two enforcement surfaces: (1) a REQUIRED CI status check runs the live eval and
  compares to threshold/baseline (builds on TQ-200b-2); (2) a fast local pre-commit
  guard that compares recorded input SHAs to the working tree and BLOCKS on
  missing/stale WITHOUT a model call (cheap, deterministic). Threshold comparison
  (TQ-200b-1/-2) absorbs sub-threshold LLM noise so a passing-but-noisy run is not a
  false failure; only a drop below threshold or a missing/stale result fails.
