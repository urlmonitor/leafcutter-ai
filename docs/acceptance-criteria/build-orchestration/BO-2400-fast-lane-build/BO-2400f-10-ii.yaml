notes: |
  The sibling BO-2400f-10-i makes the release work. This one makes its failure visible,
  and the two are separable on purpose: a release can be fixed and then quietly break
  again, and without this criterion the second breakage is as invisible as the first was.

  The whole reason KI-BO-020 took a month to surface is in the second clause of the first
  scenario. The lane treats the release as best-effort and discards its reply, so
  "released" and "refused" produce identical runs. Verified 2026-08-25: after run
  wf_bd4984e8-438, the release agent had run and returned a well-formed refusal, and
  nothing anywhere in the run's output mentioned it. The run reported a clean halt on the
  context bundle, which was true, and said nothing about the five acceptance criteria it
  had just stranded, which was also true and considerably more urgent.

  Best-effort is a defensible posture for the ACTION and is kept — a failed release must
  not turn a clean halt into a crash. What is not defensible is best-effort REPORTING.
  The distinction this record draws is between "try, and carry on if it fails" and "try,
  and never find out". Only the second one is the defect.

  The second scenario's ordering clause is deliberate. The obvious implementation replaces
  the halt message with the release problem, which trades one hidden fact for another. An
  operator needs both: why the run stopped, and what it left behind for the next one.

  ENRICHMENT NOTE, it-po, 2026-08-25 — THIS RECORD IS BUILDABLE BEFORE ITS SIBLING, AND
  THAT IS USEFUL. The dependency on BO-2400f-10-i is real for the SUCCESS path, which
  cannot be observed for real until an executor exists that actually releases. The REFUSAL
  path, which is the load-bearing one, is exercisable against today's lane exactly as it
  stands — the release genuinely does refuse. So if the two are built in sequence rather
  than together, build this one first or at least test its refusal path first: it is the
  only one of the pair whose primary case can be proved against the live defect rather
  than against a stub.
