id: GE-127g-2-i
title: "A declaration that cannot be read is said so and the documents are judged, never set aside on the strength of a declaration nobody could read"
component: guardrail-engine
components:
  - commit_guardian
  - doc_compliance
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the declaration of set-aside locations is absent,
  And a commit stages one generated document standing at 2,809 lines that would
    be set aside were the declaration present,
  When the author performs an ordinary commit,
  Then the commit does not complete, and what it reports states that the
    declaration could not be read and names it,
  And the document is reported among those judged and over their permitted
    length — it is not reported as set aside, and it is not reported as within
    its permitted length.

  And given instead that the declaration is present but malformed, so its
  entries cannot be interpreted,
  When the author performs an ordinary commit staging the same document,
  Then the commit does not complete, and what it reports states that the
    declaration could not be interpreted and names it, and the document is again
    reported among those judged.

  And given the declaration is present and readable but contains no entries at
  all,
  When the author performs an ordinary commit staging the same document,
  Then the commit does not complete and the document is reported among those
    judged, and what it reports does NOT state that the declaration could not be
    read — an empty declaration is a decision that nothing is set aside, and is
    reported differently from a declaration that could not be read.
depends_on:
  - GE-127g-2
