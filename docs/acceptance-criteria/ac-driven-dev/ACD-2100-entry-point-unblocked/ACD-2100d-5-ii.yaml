    target_dir: "unit_tests/workflows/"
    framework: "unittest"
    type: "integration"
    angle: "discrimination"
    description: "plan-feature.js started with the request text only (workspace_setup_permission passed as None) returns status error with zero agent dispatches, so no authoring agent runs and no workspace or branch is made."
    proves_clause: "it stops before any authoring agent is dispatched and before any workspace or branch is made"
    code_file: "templates/workflows-js/plan-feature.js"
    must_catch:
      - "drop the args.workspace condition"
      - "the gate always allows"
  - name: "test_report_names_each_missing_argument"
    target_dir: "unit_tests/workflows/"
    framework: "unittest"
    type: "integration"
    angle: "criterion"
    description: "The report names args.workspace as missing and mentions args.workspace_setup_permission only as needed for a start without the maker's answer."
    proves_clause: "its report names each argument that was missing"
    code_file: "templates/workflows-js/plan-feature.js"
  - name: "test_every_remedy_in_the_report_exists_in_the_installed_copies"
    target_dir: "unit_tests/workflows/"
    framework: "unittest"
    type: "integration"
    angle: "real_artifact"
    description: "Each command, step or argument the report tells the operator to run or supply is found in the installed /plan-feature command or skill, and the maker script path the report gives exists in the installed copy at <output_root>/scripts/worktree.py."
    proves_clause: "every step, command or argument the report tells the operator to run or supply is one the installed /plan-feature command or skill contains at that moment, or a script present in the installed copy at the path the report gives"
    code_file: "templates/workflows-js/plan-feature.js"
  - name: "test_report_names_no_skill_section_the_skill_lacks"
    target_dir: "unit_tests/workflows/"
    framework: "unittest"
    type: "integration"
    angle: "criterion"
    description: "Every skill section the report names (for example sec. WS.1) is a heading of the installed skill; sec. WSP and the permission pre-flight are not named."
    proves_clause: "the report does not name a skill step or section that the installed skill does not contain"
    code_file: "templates/workflows-js/plan-feature.js"
  - name: "test_report_makes_no_permission_or_registry_claim"
    target_dir: "unit_tests/workflows/"
    framework: "unittest"
    type: "integration"
    angle: "criterion"
    description: "The report contains no statement that a permission was denied or that the agent registry is misconfigured."
    proves_clause: "the report does not say that a permission was denied or that the agent registry is misconfigured"
    code_file: "templates/workflows-js/plan-feature.js"
  - name: "test_following_the_report_and_only_that_reaches_triage"
    target_dir: "unit_tests/workflows/"
    framework: "unittest"
    type: "integration"
    angle: "reachability"
    description: "Doing what the report says (the maker step of the installed command, then the start with workspace set to the answer) and nothing else, driven through the E2 harness, reaches triage."
    proves_clause: "when the operator does what the report says, and only that, and starts the run again, it reaches triage"
    code_file: "templates/workflows-js/plan-feature.js"
    surface_invoked: "templates/workflows-js/plan-feature.js driven through unit_tests/_workflow_engine_harness.py run_workflow_under_e2"
  - name: "test_stale_preflight_halt_text_symptom_does_not_recur"
    target_dir: "unit_tests/workflows/"
    framework: "unittest"
    type: "integration"
    angle: "discrimination"
    description: "The report does not contain the text that the plan-feature skill's pre-flight (scripts/worktree/check_workspace_setup_permission.py) must run before the workflow is invoked."
    proves_clause: "the bug symptom (KI-ACD-20261022: the halt says \"the plan-feature skill's pre-flight (scripts/worktree/check_workspace_setup_permission.py) must run BEFORE this workflow is invoked\", but the skill replaced that pre-flight on 2026-10-10, so the operator cannot fix the run from the docs) must not occur"
    code_file: "templates/workflows-js/plan-feature.js"
    must_catch:
      - "revert the fix"
      - "the report names the retired skill pre-flight again"
