criteria: |
  The route finds its own files no matter which folder you launched it from.

  Whether you start from the top of your project or from inside a side working
  copy makes no difference: the route locates everything it needs and gets as
  far as asking you what you want to build. It never fails at the very first
  step because it looked for one of its own files in the wrong place.
