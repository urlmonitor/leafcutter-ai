title: "A set of requirements that cannot be taken whole leaves none of them taken"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given an effort that needs to take four requirements together in order to
    build them as one set,
  And the third of those four is already taken by another effort,
  When the effort attempts to take the set,
  Then it ends up holding none of the four,
  And the first two, which it briefly took, are available again to anyone else,
  And it is told which requirement of the set was unavailable,
  And an effort that is interrupted part-way through taking a set leaves none of
    that set taken by it, without needing the interrupted effort to tidy up
    after itself.
