notes: |
  NOT BUILT. This is the missing half of the f3ac950c / PR #536 fix, and it is
  the half that decides whether anything actually happens. The work-item side
  now hands every one of the 85 affected records a proof section and marks the
  proof writer owed; the supervisor route then skips the phase anyway, because
  it asks a different question.

  THE THREE SURFACES AND WHAT EACH ANSWERS TODAY, VERIFIED BY READING THEM:
    1. The supervisor template skips when no production-code worker is needed.
       Wrong for all 85.
    2. The epic runbook keys on the proof section: absent then skip; present
       with entries then dispatch. Correct post-fix, with one residual branch
       (present-but-empty list plus no code producer) that still consults worker
       classification.
    3. The flattened per-phase driver applies no production-code skip at all and
       dispatched the proof writer correctly in a real run.
  The requirement is not three independently patched skip rules. It is one
  question, stated once, that all three ask.

  REACHABILITY IS WHAT SETS THE SEVERITY. The epic route dispatches the
  supervisor for every item in a batch; the single-feature route does not. So
  surface 1 is live, and any requirement built inside an epic still loses its
  proof phase. A fix demonstrated only against the per-phase driver proves
  nothing about the route where the defect lives — see TKT-500g-2-i.

  BOUNDARY. Nothing here judges whether the written proof is any good, or
  whether it reaches the running product. That is BO-2900's observer, and it is
  out of scope.

  IT-PO NOTE 2026-08-25 — WHY THIS CARRIES A TEST CONTRACT DESPITE change_target: prompt.
  Two of its three surfaces are prose, but the AC's observable is not "the prose was
  edited" — it is "the phase runs". One route is executable JavaScript and one negative
  control is mechanically checkable, so test_required: false would understate what can
  be proven here. The residual judgement (does an agent reading the prose actually
  behave this way) is carried by TKT-500g-2-i's live batch-route obligation, not waived.
