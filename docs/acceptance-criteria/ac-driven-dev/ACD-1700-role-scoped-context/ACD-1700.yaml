criteria: |
  Right context, right specialist, no cross-role noise -- verifiable up front.

  When work is dispatched, each agent receives exactly the context its role needs
  and none that belongs to someone else -- a builder is not buried in planning
  memory, review checklists, or authoring instructions meant for other roles. Each
  requirement is routed to the specialist whose craft actually matches the thing
  being built. And before a rebuild lands, a person or an agent can assemble and
  read the complete brief any agent will receive, and confirm it is both complete
  and appropriate. The result is less noise, fewer mis-assignments, and confidence
  that every agent has what it needs before it starts.
