id: TKT-200b-3
title: "Boundary doc for a new component is created; existing component doc is updated"
component: ticket-creation
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a feature introduces ACs under a component that has no existing boundary document,
  When the boundary documentation step runs,
  Then a new boundary document is created for that component,
  And given a feature also touches a component that already has a boundary document,
  Then the existing document is updated to reflect the new responsibilities
    added by the feature's ACs,
  And the update preserves existing content that is not contradicted by the new ACs.
