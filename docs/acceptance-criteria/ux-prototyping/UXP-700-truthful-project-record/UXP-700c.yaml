criteria: |
  The record tells you when it has fallen behind the product — you never discover it.

  As the product changes, the written record stops matching it. When that
  happens you are told, at the time it happens, in terms you can act on —
  instead of finding out much later from a customer, a review, or a decision you
  made on the strength of something that stopped being true months ago.
