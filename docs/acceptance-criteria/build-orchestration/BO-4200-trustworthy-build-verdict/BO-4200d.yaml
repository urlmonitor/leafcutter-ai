criteria: |
  Broad proof once per run, placed where it saves the most wasted effort.

  The project-wide check is paid for once in a run, not over and over as the work
  is shaped, and it happens early enough that a broken change never consumes a
  reading cycle or arrives as a delivery that looks ready. You still get the quick
  route you chose; what you stop getting is a fast answer that is wrong.
