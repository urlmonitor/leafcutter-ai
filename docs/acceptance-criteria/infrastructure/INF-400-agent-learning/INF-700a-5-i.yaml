test_spec:
  - name: test_a_refused_publication_reports_the_records_unwritten_and_names_the_destinations
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Drive a completion path with two routable records and force the publication to be refused by a gate. Assert the reported result counts both records unwritten, names both destination paths, and states the refusal as the reason. Assert specifically that the count is not the written count — a run that writes into the working directory and reports two written is the exact defect."
  - name: test_a_conflicting_destination_change_is_dropped_and_the_work_still_publishes
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Make the routing step's change to a destination conflict with the merged tree's version of the same file, then drive the path. Assert the unit of work's own output is published, that the conflicting destination change is not in it, and that the record is reported unwritten. A run in which the work fails to publish because of a knowledge write fails this test — fail-open means the knowledge step cannot block the work."
  - name: test_the_teardown_step_names_every_learning_absent_from_the_merged_tree
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "Reach the removal step with one learning published and one not. Assert the removal step's output names the unpublished destination and its learning text, does not name the published one, and that the working directory is removed in both cases. Assert also that the output states whether the record behind the unpublished write is still eligible, and that it says eligible in this fixture — the record is in a sink the whole install shares, so it outlives this removal. The announcement is the whole point and the removal proceeding is the fail-open half; a test that asserts only one of the two lets the other regress."
  - name: test_exit_status_and_failure_count_are_equal_with_a_failed_and_a_successful_publication
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Drive the same unit of work twice, once with every publication succeeding and once with the routing publication refused; assert the driver's exit status and failure count are EQUAL between the runs. Equality between runs rather than equality to success, so the clause also holds for work that failed on its own merits."
  - name: test_the_unpublished_record_is_written_by_a_later_run_exactly_once
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Fail the publication, remove the cause, drive a second unit of work over the same sink; assert the merged tree now holds the learning and holds it once. Asserts the retention INF-400c-2-ii already requires survives a publication failure as well as a write failure, without the driver re-implementing retention."
test_rationale: |
  The announcement clause is the one that cannot be checked any other way. A
  publication failure inside a teardown sequence is silent by construction:
  the work merged, the driver reported success, and the directory is gone, so
  there is no artefact left to inspect and no exit status that differs. The
  only observable is what the removal step said before it removed anything,
  which is why the third descriptor asserts on the removal step's own output
  and asserts both halves — that it names the unpublished learning AND that it
  still removes the directory. Testing only the naming would permit an
  implementation that blocks teardown on a knowledge step, which violates the
  package's fail-open rule; testing only the removal would permit the silence
  this AC closes. The equality descriptors are written as equality between two
  runs rather than equality to zero for the reason INF-700a-1-ii gives.
notes: |
  BOUNDARY, three ways, because this is the third failure record in the family
  and they are easy to confuse.

  INF-700b-1-ii owns the receipt when an AGENT's capture attempt fails — the
  emitting side, at sign-off time.

  INF-700a-1-ii owns the receipt when the ROUTING STEP cannot finish — the sink
  will not read, or a destination will not take a write. At that point nothing
  has been written and the driver knows it.

  This AC owns the case where the routing step SUCCEEDED and its writes were
  never carried out of the working directory. It is the worst of the three,
  because every figure the driver reports says the learning was written. Only
  the merged tree disagrees, and by the time anyone looks, the directory that
  held the evidence has been reclaimed.

  WHY THE ANNOUNCEMENT SITS AT THE REMOVAL STEP RATHER THAN AT THE DRIVER'S
  COMPLETION. On finalize-feature the two are four steps apart: the pull
  request merges at step 4 and the working directory is removed at step 7. A
  learning that is not in the merged tree at step 4 is recoverable at step 5;
  after step 7 it is not. The last moment at which the loss is preventable is
  the moment before removal, so that is where the criterion puts the sentence.
