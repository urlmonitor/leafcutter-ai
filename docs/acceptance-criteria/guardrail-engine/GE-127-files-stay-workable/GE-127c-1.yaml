id: GE-127c-1
title: "The outcome states which kinds of file it measured, so a kind that was never measured is not read as having passed"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a commit stages files of several kinds, of which some kinds are within
    the size standard's scope and at least one kind is not,
  When the author performs an ordinary commit,
  Then the outcome states which kinds of file the standard measured on this run,
    and states that files of the remaining staged kinds were not measured,
  And a staged file of a kind that was not measured is never reported as being
    within its permitted length, and is never counted among the files found to be
    within their permitted length,
  And given the set of kinds in scope is changed so that a kind previously
    outside it is now within it, and nothing else in the repository changes,
  When the author performs an ordinary commit staging one file of that kind,
  Then the kinds the outcome states it measured include that kind, and that file
    is measured — establishing that what the outcome states is taken from the
    scope actually in force on the run rather than from a set written into the
    standard itself,
  And given a file is refused for exceeding its permitted length,
  When the refusal offers advice on how to divide the file,
  Then for every distinct form of dividing advice the standard is capable of
    producing there is a kind of file it measures that produces it — the standard
    carries no advice for a kind it can never refuse.
depends_on:
  - GE-127c
