change_target:
- code
- pipeline
- config
risk_surface: contract_boundary
it_requirements:
- Reuse the canonical validator and propagate its failure status through both configured gate routes;
  a printed failure followed by success is unacceptable.
- Keep pre-commit trigger scope aligned with the checker-declared bounded dependencies, including schema,
  model and receipt changes; preserve staged-content isolation and out-of-scope skipping.
- Maintain canonical hook manifest and deployed configuration parity. The local gate stays scoped while
  CI contract validation is unconditional.
- CI must retain full frontend type checking and the focused contract display suites; excluding failing
  files or using a production-only type configuration does not satisfy this check.
expects_from:
  ac_id: UXP-300-3
  contract: The canonical validator reports contract failure and explicit gap details with a nonzero failure
    status for malformed metadata; source definitions, receipts and generated presentation are checked
    together.
delivers_to: null
test_spec:
- name: test_ci_uses_same_validator_and_propagates_schema_only_failure
  target_dir: unit_tests/product_truth/
  description: Read the configured CI validator command and demonstrate a source-schema-only failure blocks
    it.
  framework: unittest
  type: integration
  angle: reachability
- name: test_real_precommit_checks_staged_schema_despite_unstaged_repair
  target_dir: unit_tests/product_truth/
  description: Run the deployed pre-commit path against real staged invalid schema even when the working
    tree contains an unstaged repair.
  framework: unittest
  type: integration
  angle: deployed
- name: test_real_precommit_ignores_unstaged_invalid_schema_and_restores_it
  target_dir: unit_tests/product_truth/
  description: Valid staged data is checked separately from an unstaged invalid version, which is preserved.
  framework: unittest
  type: integration
  angle: boundary
- name: test_real_precommit_skips_out_of_scope_changes
  target_dir: unit_tests/product_truth/
  description: The configured local gate does not execute for unrelated staged changes.
  framework: unittest
  type: integration
  angle: boundary
- name: test_atlas_ci_registration_includes_executable_contract_regressions
  target_dir: unit_tests/product_truth/
  description: The configured unconditional Atlas CI job dispatches full frontend type checking and the
    real contract display suites; executable display and type-check results are recorded separately.
  framework: unittest
  type: integration
  angle: criterion
test_rationale: Actual configured entry commands and a real temporary Git/pre-commit run prove blocking
  and staging behavior. Configuration labels alone cannot demonstrate that either gate runs or propagates
  failure.
test_required: true
declares_side_effect: false
