id: INF-1200d-1-i
title: "A standard that reached nobody is not counted as delivered"
component: infrastructure
components:
  - infrastructure
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a standard is declared for a kind of file that the ownership record
    assigns to no specialist, so that its audience is empty,
  When the declared standards are carried outward,
  Then the outcome of that run does not represent that standard as having
    reached its audience,
  And the outcome names that standard and the kind of file it governs as one
    whose audience was empty,
  And given instead a standard whose audience is not empty and every one of
    whose owners is told,
  When the same run is examined,
  Then no empty-audience statement is made about it,
  And given a run in which every declared standard has an empty audience,
  Then the outcome does not read as a successful delivery.
depends_on:
