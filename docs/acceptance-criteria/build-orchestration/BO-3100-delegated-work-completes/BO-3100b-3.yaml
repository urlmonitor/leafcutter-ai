notes: |
  The other failure mode the parent L1 names explicitly: "a step that legitimately changes
  nothing must be distinguishable from a step that did nothing because it vanished. Without
  this, the guard blocks honest work and gets switched off — the same fate BO-2900d was
  added to prevent."

  THE THIRD SCENARIO IS THE ONE THAT MATTERS, and it is lifted deliberately from the
  BO-2900d-1 exemption pattern, where the same drift is recorded: every declared exemption
  starts as an explicit list and decays into a heuristic — steps of a certain kind, in a
  certain position, or with a certain name are let through. The moment that happens the
  guard stops guarding, because a vanished step of that kind is indistinguishable from an
  honest one. This scenario is written to be failed by any convention-based shortcut and is
  cheap to run.

  THE PASS IS ANNOUNCED, NOT ABSORBED. A legitimate no-op that produces no record is
  indistinguishable from a check that did not run, so the stated reason must reach the
  build's record rather than being silently accepted.

  Deliberately left to the IT PO: where a step's no-op declaration is recorded. The criterion
  constrains only that it is explicit, attached to that step, carries a reason, and is
  visible in the record — not the medium.

  IT-PO DECISION (2026-08-26). The medium is the step's dispatch contract — the options object
  the coordinating layer already passes at dispatch — carrying `may_produce_no_change` and
  `no_change_reason`. Three properties made this the choice over a config file or a registry
  of step kinds: it provably exists before the step runs, which is BO-3100b-3-i's hard
  requirement; it is per-dispatch rather than per-kind, which is the third scenario's hard
  requirement; and it needs no new lookup surface that could later be defaulted or inherited.

  NOTE ON SCOPE AFTER THE BO-3100b-1 DECISION. Because untracked additions now count as work,
  this exemption is needed only for steps that genuinely produce nothing at all — a skip, or an
  already-satisfied condition. That is a much smaller set than it would have been under a
  tracked-only surface, which is a good thing: the fewer declared exemptions exist, the less
  there is to decay.
