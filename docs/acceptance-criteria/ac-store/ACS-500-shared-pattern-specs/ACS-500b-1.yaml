title: "A consuming AC declares pattern reference and page-specific bindings"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a page-level AC needs to use the "sortable-table" shared pattern,
  When the AC is authored with:
    implements_pattern: "ACS-500a-1"
    pattern_bindings:
      entity_type: "invoices"
      columns: ["number", "date", "amount", "status"]
      default_sort: "date descending"
  Then the AC's own criteria field contains ONLY page-specific behavior
    (e.g. "Given the invoices page loads, When the user clicks 'Export',
    Then a CSV download begins"),
  And all shared sortable-table behavior (column sorting, sort indicators,
    keyboard navigation) is inherited from the referenced pattern AC,
  And the AC does NOT restate any behavior already defined in the pattern.
