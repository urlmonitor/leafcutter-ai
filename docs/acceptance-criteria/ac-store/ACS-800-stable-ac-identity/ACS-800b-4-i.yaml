title: "A child whose level does not sit one below its parent is rejected"
component: ac-store
level: L3
status: active
req_status: approved
work_status: todo
criteria: |
  Given a parent requirement at level L1,
  When an edit sets a child of that parent to level L3 (skipping L2),
  Then the edit is rejected with an error naming the child, its declared level
    L3, the parent UID, and the parent level L1,
  And the same rejection occurs when a child is set to the same level as its
    parent, or to a level above its parent.
