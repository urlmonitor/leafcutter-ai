notes: |
  SILENCE IS THE FAILURE MODE THE WHOLE TREE IS EXPOSED TO AND THIS L1 IS THE ONLY ONE
  THAT CLOSES IT. Today a specialist that was told nothing and a specialist for which no
  standard exists produce identical evidence: nothing. Every other criterion here can be
  reported satisfied by something that covers one pairing and stops — which is precisely
  the state the project is in now, and it has looked fine for as long as it has existed.

  THE NEGATIVE ARM IS MANDATORY AND IT IS THE ONE CARRYING THIS RECORD. Every positive
  arm is satisfied by an examination that names every pairing all the time. Such a thing
  is trivially correct on the positive arm, is never wrong, and means nothing. Whether
  the report is worth reading is decided entirely by whether it can decline to name
  someone.

  THE FOURTH ARM IS THE SUBTLE ONE AND IT IS NOT REDUNDANT WITH THE OTHERS. There are two
  places the truth could be read from: the material the specialist actually begins work
  from, and the carrier's own record of what it emitted. They agree until they do not —
  a compilation step that drops content, a deployment that ships a stale brief, a
  template that fails to resolve a value. Reading the carrier's account is easier, it is
  what an implementer reaches for because the data is already in hand, and it produces a
  report that is a restatement of the delivery's intentions. This project's own history
  is the argument: it records three separate defences that reported clean for days or
  weeks each while examining nothing, and each time the clean result was believed
  because it came from the thing that was supposed to know.

  THE POSITIVE CONTROL IS NOT OPTIONAL AND THE FIXTURES ARE REAL. Measured 2026-09-09 in
  this worktree: three standards are fully configured with thresholds and have no
  audience at all; one further kind of file carries a distinct configured limit and its
  owner is told nothing; exactly one pairing of a kind of file and a specialist is
  correctly informed. The examination must find the uninformed ones and must not name the
  informed one, against the project as it stands, before a clean result from it is worth
  anything.

  A DECISION THIS RECORD DELIBERATELY LEAVES OPEN, PER THE L1. Whether an uninformed
  pairing should merely be reported or should actually stop something is not settled
  here, and there is no blanket default in this project. Decide it explicitly at
  enrichment, per surface, and record the reasoning. What is not open is visibility: the
  condition must be nameable, and it must be nameable one pairing at a time.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Written so the IT PO can
  lift them verbatim into test descriptors.

  (1) MUTATION: name every pairing of a specialist and a kind of file it owns,
      regardless of what that specialist's material states. Under that injection the
      first arm must STAY GREEN, the negative arm must go RED, and the partially-told
      arm must go RED. Both greens and both reds must be observed and all must revert.
      This is the report that says "everyone" and means nothing, and it is what an
      examination degenerates into the first time somebody makes it pass in a hurry.

  (2) MUTATION: decide whether a specialist counts as told by consulting the carrier's
      own record of what it emitted, rather than the material the specialist begins work
      from. Under that injection the first three arms must STAY GREEN — the carrier's
      account is accurate whenever nothing downstream has gone wrong — and the fourth arm
      must go RED. Both outcomes must be observed and both must revert. An injection run
      that reddens the first three means the fixture is not exercising a healthy
      delivery and the result is not the one this mutation is for.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. Both
  mutations above, including which arms must stay green, are written to be turned
  directly into test descriptors.
