id: UXP-700b-3
title: "An every-record rule with no records to test reports that it was not exercised"
component: ux-prototyping
components:
  - ux_prototyping
level: L2
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a check phrased as a rule that must hold of every record of some kind,
  And a project record in which no record of that kind exists,
  When the check runs,
  Then it reports that it was not exercised, naming the kind of record it needed,
  And it does not report that the rule holds,
  And the run's overall outcome is not the outcome for a record that was checked and found
    sound while any such check reports it was not exercised.
