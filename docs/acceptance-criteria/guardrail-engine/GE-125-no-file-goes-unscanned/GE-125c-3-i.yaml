notes: |
  WHY THIS IS ITS OWN RECORD. The parent asserts that a value far past the
  shortening point reaches the same verdict as one at the start. It does not
  exercise the boundary itself, and the boundary is where an off-by-one lives: an
  implementation that judges 120 characters, or 121, or that slices the line before
  matching rather than after, can satisfy the parent's clear-cut cases and still
  mangle a value that lies across the cut. The straddling case is the sharp one,
  because the failure it produces is not a missed value but a MISJUDGED one — a
  fragment of an ordinary identifier looks like an unexplained value, so the
  visible symptom is a false report rather than a silence.

  THE SECOND SCENARIO IS THE OTHER HALF OF THE PARENT'S INVARIANT and is stated
  here rather than there because it is about the value rather than about its
  position: a value longer than the shortened copy can never be judged whole from
  that copy. It also carries the one output constraint this subtree needs to state
  — the report must not print the value back in full. That constraint belongs to
  GE-125d for reduced-scrutiny notices generally; it is repeated here only for the
  finding itself, because a 160-character credential is the case where a report
  that echoes what it found is most obviously a disclosure. Do not read this as
  deciding GE-125d's notice format.

  FIXTURE PLACEMENT — STATED, NOT INHERITED. Every fixture must be a real file
  created inside a tempfile-backed throwaway project root, with the ticket area
  constructed INSIDE that root and the check run against that root. No fixture may
  be created under this repository's own `tickets/`, `docs/retrospectives/`,
  `docs/acceptance-criteria/` or `templates/skills/` trees. The test module belongs
  under `unit_tests/commit_guardian/`.

  OFFSETS ARE PART OF THE FIXTURE CONTRACT and must be constructed and then
  asserted before the verdicts are asserted: build the padding programmatically,
  assert that the identifier ends at, begins at and straddles the intended
  character positions, and only then assert the verdicts. A boundary fixture whose
  offset silently drifts is a green test that proves nothing, and eyeballing a
  200-character line is not verification.

  VERIFY BY EXECUTION, NEVER BY READING THE SOURCE. Every arm runs the real
  pre-commit secrets check over real staged files and asserts the process exit
  status and the reported findings. Credential-shaped fixture strings are assembled
  at runtime from concatenated fragments rather than written as source literals.
