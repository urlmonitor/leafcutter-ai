id: GE-124a-3-ii
readiness: approved
priority: high
title: "Stories, tests and generated files are excluded by a named rule, not by directory guesswork"
component: guardrail-engine
components:
  - frontend_coding
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124a.yaml"
criteria: |
  Given the staged set contains `components/coverage/gaps-callout.stories.tsx`,
    `components/coverage/gaps-callout.test.tsx` and
    `components/generated/icon-set.tsx` whose first line is the generated-file
    marker comment
  And each of the three files contains rendered markup
  When the frontend declaration reader decides which staged files are screen
    components
  Then all three files are out of scope
  And no declaration verdict of any kind is recorded for any of them
  And each file's recorded reason names the exclusion rule that matched —
    story-file suffix, test-file suffix, or generated-file marker

  Given the staged set contains `components/atlas/detail-drawer.tsx`, which
    lives in a directory that also contains excluded files
  When the frontend declaration reader decides which staged files are screen
    components
  Then `components/atlas/detail-drawer.tsx` is in scope
depends_on:
  - GE-124a-3
