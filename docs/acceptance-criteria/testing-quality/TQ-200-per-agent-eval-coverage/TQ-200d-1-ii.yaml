    relationship: modifies
    status: planned
    relevance: "New reference page created by this AC. Later L3s (TQ-200d-2-i, TQ-200d-2-ii, TQ-200d-4-i, TQ-200d-4-iv) update the entries for the kinds they change or add."
  - path: scripts/evals/README.md
    relationship: modifies
    status: exists
    relevance: "Its 'Produced-tests mode (local only)' section lists kind names inline (and only the test-writer ones). Replace the list with a link to the page."
