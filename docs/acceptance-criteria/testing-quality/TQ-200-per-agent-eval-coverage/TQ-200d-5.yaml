it_requirements:
  - >-
    Scope against origin/main as it is now: TQ-200b-1-i already passes the template through a prompt file
    for label runs (--system-prompt-file) and for artifact and plain produced-tests runs (--append-system-prompt-file)
    via run_agent_eval._run_cli. This AC (a) moves that logic out of run_agent_eval.py into the shared
    builder in scripts/evals/agent_launch/command.py, (b) routes produced_tests_transcript.invoke_with_transcript
    through it, so the test-runner path stops passing --append-system-prompt <template> on argv, and (c)
    moves the row input of all three invokers from the -p positional to stdin.
  - >-
    Route decision (IT PO, 2026-10-30): instructions go through --system-prompt-file (label: replaces
    the default instructions) or --append-system-prompt-file (artifact, produced-tests and transcript
    runs: appended), and the row input goes on stdin. Both file flags were confirmed on the installed
    claude CLI 2.1.205 on Windows 11 by a call with a missing file, which each rejects with 'System prompt
    file not found' / 'Append system prompt file not found' rather than 'unknown option'. Stdin delivery
    of the input with -p and no positional prompt is confirmed by the implementer with one fake-free local
    call before merge, and the README records the confirmed CLI version.
  - >-
    No command line the harness builds may exceed 32,767 characters, whatever the length of the instructions
    or the row input, on every platform. The instructions and the input reach the agent byte for byte:
    UTF-8, no newline translation, quotation marks and the rendered sandbox path intact.
  - >-
    The prompt file is written to the OS temp directory, never into the row sandbox or the project tree,
    and is removed whether the call succeeds, exits non-zero, times out or fails to start.
  - >-
    Repository limits: scripts/evals/ holds 15 non-markdown files, the folder-density cap, so every new
    module goes in the new sub-package scripts/evals/agent_launch/ (imported like designer_eval and sql_test_writer_eval).
    Every new or changed .py file stays at or under 400 counted lines (docs/reference/source-file-length-measurement.md),
    and run_agent_eval.py must not grow: code that moves into the sub-package leaves run_agent_eval.py
    smaller. unit_tests/evals/ is one file below the cap, so this AC's tests go in the new folder unit_tests/evals/tq200d5/.
  - >-
    Unit tests never call a live model; they use a fake claude program on PATH (or a patched process start)
    that records its argv, its stdin and any prompt file it is given. Tests prove: the joined command
    line (subprocess.list2cmdline) for the real test-writer template rendered over a long Windows-style
    sandbox path, with a row input of at least 40,000 characters, is under 32,767 characters for all three
    invokers; the fake receives the instructions and the input byte for byte; label runs still replace
    and the others still append; no prompt file remains after any outcome. Existing tests that pin the
    old argv (unit_tests/evals/test_tq200b1i_prompt_file.py, the transcript tests) are updated in the
    same change and listed in the consumer-test sweep with the reason.
  - >-
    DOCUMENTATION (hard requirement, part of done) - scripts/evals/README.md gains the section 'How a
    live run starts the agent', which must state: the instruction flag per scoring mode (label replaces
    with --system-prompt-file; artifact, produced-tests and recorded-commands runs append with --append-system-prompt-file),
    that the row input goes on stdin, why (the 32,767-character Windows command line; the test-writer
    template is about 67,700 characters), the claude CLI version the route was confirmed on, that the
    prompt file lives in the OS temp directory and is removed after every row, and a link to docs/how-to/run-a-live-agent-eval.md.
  - >-
    DOCUMENTATION (hard requirement, part of done) - docs/how-to/run-a-live-agent-eval.md is created (type
    how-to, frontmatter title, description, components [testing_quality], related_docs, per docs/how-to/documentation/write-how-to.md)
    and must state: prerequisites (model credentials, a working claude CLI), the --score-gold offline
    command and the live command for each of the four produced-tests agents (test-writer, sql-test-writer,
    test-designer, test-runner) and for one label and one artifact agent, that the four produced-tests
    agents are local only and print LOCAL RUN, where the results file is written and how to read a row
    (score, per-assertion detail, error), and that the instructions travel in a file and the input on
    stdin, so template length is no longer a Windows limit. It has stub headings that TQ-200d-5-i ('Reading
    a launch failure'), -5-ii ('Finding claude on Windows') and -5-iii ('A run that stops as a harness
    failure') fill.
  - >-
    DOCUMENTATION - docs/INDEX.md is regenerated by build.py's doc-index phase and restaged so the new
    how-to appears; it is not hand-edited. CLAUDE.md and docs/reference/README.md need no change (neither
    lists how-tos or eval mechanics).
  - >-
    DOC-DRIFT TESTS (part of done): (1) the README section names the same two instruction flags and 'stdin'
    that the shared builder uses, read from the builder rather than from a hand-kept list; (2) neither
    the README nor the how-to says the instructions or the input go on the command line; (3) every '--agent
    <name>' in the how-to is an agent in scripts/evals/agent_eval_config.json and every run_agent_eval.py
    flag it shows is one the script's argument parser accepts; (4) the README links the how-to and the
    link resolves.
  - >-
    KNOWN ISSUE: git mv docs/known-issues/testing-quality/resolved/resolved-low-ki-tq-20261025-eval-harness-system-prompt-exceeds-windows-command-line.md
    to docs/known-issues/testing-quality/resolved/resolved-low-ki-tq-20261025-eval-harness-system-prompt-exceeds-windows-command-line.md;
    set its Status line to 'RESOLVED <date> by TQ-200b-1-i (template through a file for label and artifact
    runs) and TQ-200d-5 (shared builder, transcript invoker, row input on stdin)' with the proving test
    files; in docs/known-issues/testing-quality.md move its row from Open to Resolved and recount the
    Open/Resolved line from the directory (ls open-* / resolved/*), naming the date.
  - >-
    CHANGELOG: one entry for TQ-200d-5 written with scripts/changelog/emit_entry.py (type manual, components
    [testing_quality]) into changelogs/, naming the shared launch builder, the README section, the new
    how-to and the resolved KI. The entry is written in the same change as the code.
  - >-
    GLOSSARY: new terms used in the docs this AC writes ('live run', 'before-score', 'prompt file') reach
    docs/glossary.md only through the check-glossary-coverage hook and the glossary-triage flow. No entry
    is added by hand (CLAUDE.md).
  - >-
    Proof of the live claim is a separate user-triggered step: after merge the user runs 'python scripts/evals/run_agent_eval.py
    --agent test-writer' live on Windows; the result is reported as a local result and is not a merge
    gate.
test_spec:
  - name: test_long_instructions_and_input_keep_every_command_line_under_the_windows_limit
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: unit
    angle: boundary
    description: >-
      For each of the three invokers, with the real test-writer template rendered over a long Windows-style
      sandbox path and a 40,000-character row input, the command line the fake claude records, joined
      with subprocess.list2cmdline, is under 32,767 characters.
    must_catch:
      - row input passed as the -p command-line argument
      - transcript invoker passes the instructions with --append-system-prompt on the command line
    in_scope_files:
      - scripts/evals/agent_launch/command.py
      - scripts/evals/produced_tests_transcript.py
      - scripts/evals/run_agent_eval.py
  - name: test_agent_receives_instructions_and_input_byte_for_byte
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      The prompt file the fake reads equals the rendered template byte for byte, including quotation marks,
      CRLF/LF newlines and the substituted sandbox path, and its stdin equals the row input byte for byte.
    must_catch:
      - prompt file written with platform newline translation
      - prompt file written in the locale encoding instead of UTF-8
      - row input stripped or re-quoted on the way to stdin
    in_scope_files:
      - scripts/evals/agent_launch/command.py
  - name: test_label_runs_replace_and_other_runs_append
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      invoke_via_cli passes --system-prompt-file and never --append-system-prompt-file; invoke_agent_writer
      and invoke_with_transcript pass --append-system-prompt-file and never --system-prompt-file.
    must_catch:
      - label runs switched to the append flag
      - artifact or transcript runs switched to the replace flag
    in_scope_files:
      - scripts/evals/agent_launch/command.py
      - scripts/evals/run_agent_eval.py
      - scripts/evals/produced_tests_transcript.py
  - name: test_no_prompt_file_left_after_any_outcome
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: unit
    angle: failure
    description: >-
      After a success, a non-zero exit, a timeout and a failed start, no prompt file remains in the OS
      temp directory, the row sandbox or the project tree, and the prompt file was never created inside
      the sandbox.
    must_catch:
      - prompt file not removed when the process start raises
      - prompt file written inside the row sandbox
    in_scope_files:
      - scripts/evals/agent_launch/command.py
  - name: test_all_three_invokers_go_through_the_shared_builder
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: unit
    angle: seam
    description: >-
      With the shared builder's process start patched, each of invoke_via_cli, invoke_agent_writer and
      invoke_with_transcript reaches it; none calls subprocess.run directly.
    must_catch:
      - an invoker builds and starts its own command
    in_scope_files:
      - scripts/evals/run_agent_eval.py
      - scripts/evals/produced_tests_transcript.py
  - name: test_live_test_runner_row_reaches_fake_claude_with_a_short_command_line
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: >-
      python scripts/evals/run_agent_eval.py --agent test-runner --row configured-database --results-file
      <tmp>
    description: >-
      The real CLI, live mode, with a fake claude first on PATH that records its call and replies with
      a recorded transcript: the recorded command line is under 32,767 characters, holds no template text,
      and the row is scored and written to the results file.
  - name: test_readme_names_the_route_the_builder_uses
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The README section 'How a live run starts the agent' names both instruction flags and 'stdin' as
      read from the builder, links the how-to (link resolves), and neither the README nor the how-to says
      instructions or input go on the command line.
  - name: test_how_to_commands_name_configured_agents_and_real_flags
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      Every '--agent <name>' in docs/how-to/run-a-live-agent-eval.md is a key of agent_eval_config.json
      agents, and every run_agent_eval.py option it shows is accepted by the script's argument parser.
test_rationale: >-
  The defect is a platform limit, so the boundary test measures the real joined command line for the real
  largest template rather than trusting a flag name. The byte-for-byte and replace/append tests carry
  the wrong versions a refactor into a shared builder most plausibly introduces. One reachability test
  drives the real CLI against a fake claude, and the doc-drift tests hold the README and how-to to the
  builder and the config, because the user made those documents part of done.
