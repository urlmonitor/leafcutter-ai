id: BO-3800b-2
title: "The coder that authored the work is not engaged to discharge a demand the refusal handed to a specialist, and nobody is engaged in its place"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a ticket is being driven whose implementing work was produced by a coder
    of a known type, and that coder appears in the ordered record of parties the
    run engaged,
  And delivery is refused with an outcome that names one file, states a demand of
    120 measured lines against it, and states that a demand of that size is handed
    to a restructuring specialist rather than to the author inside this change,
  When the run adjudicates that refusal,
  Then between the refusal and the second delivery attempt, the record of parties
    the run engaged contains the restructuring specialist and does NOT contain the
    coder that authored the work,
  And it contains no other party engaged to take lines out of the named file in
    that coder's place,
  And given the same run with the refusal changed in one respect only — it states
    that the demand is one the author may discharge inside this change,
  When the run adjudicates that refusal,
  Then the record of parties engaged between the refusal and the second delivery
    attempt contains the coder that authored the work and does NOT contain the
    restructuring specialist,
  So which party is engaged MOVED when the disposition moved, and follows from the
    disposition the refusal states rather than from the file, from how far the
    file stands above its permitted length, from the ticket, or from which party
    the run engaged last.
depends_on:
