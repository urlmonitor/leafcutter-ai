it_requirements:
  - "Every assertion must be made against the copy the build deploys under .leafcutter/. A result obtained by running the templates/ source copy is not evidence for this criterion (ADR-001, ADR-013)."
  - "Coverage must reach the check through its process entry point rather than through the direct-function-call seam the existing check_ac_governance test module uses by design."
  - "The mixed-target run must complete its inspection of every target that DID resolve. An implementation that returns at the first unresolvable target satisfies the single-target arm and converts a fail-open into a fail-closed that still inspects nothing - which is this goal's defect with the sign reversed."
  - "The unresolved-target outcome value must be distinct from BOTH the ordinary success value and the refusal value, so a caller can tell 'your input was wrong' from 'your work was refused' without parsing prose."
  - "Must not change the exit status of any commit-time invocation that passes today. The component's deliberate fail-open-on-internal-error convention (GE-116a-1-iii) is not repealed."
  - "Must add no measurable latency to a commit-time run with an empty derived scope; this check runs on every commit in the repository."
  - "Error handling must follow the four rules in CLAUDE.md. An unresolvable path is a caller error and an expected condition, not an internal error, and must not be routed through the fail-open warning path."
test_spec:
  - name: test_single_unresolvable_argv_target_is_reported_and_not_passed
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "Deployed check run by subprocess with one argv target that does not exist on disk names that target verbatim and returns an outcome value that is not the ordinary success value."
  - name: test_unresolvable_target_run_inspects_no_record_in_the_store
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "In the unresolvable-target run the reported examined count is zero and no record in the surrounding store - including one seeded violating record that is NOT named - is reported as inspected."
  - name: test_mixed_targets_refuse_the_violator_and_name_the_unresolved_one
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "One run naming two targets, one a record that genuinely violates the rule and one a nonexistent path, produces BOTH the refusal naming the violating record and the unresolved-target report naming the missing path - an implementation that aborts at the first unresolvable target fails this."
  - name: test_unresolved_refused_and_clean_are_three_distinct_outcome_values
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: "Three runs of the deployed copy - unresolvable target, violating record, clean record - return three values a caller distinguishes without matching message text."
test_rationale: |
  The single-target arm alone is satisfiable by an implementation that aborts on any
  unresolvable input, which stops the check inspecting the records it could have
  reached — a fail-closed variant of the same abstention. The mixed-target descriptor
  is the only one that forces both facts out of one run, and it is the descriptor a
  test suite will omit by default because it looks like a duplicate of the first. The
  zero-inspected assertion is separate from the outcome-value assertion on purpose: a
  check can report an unresolved target and still claim to have examined the store.
delivers_to:
  agent: python-coder
  contract: "The unresolved-target outcome: a third machine-readable outcome value, distinct from both ordinary success and refusal, together with the verbatim target string that failed to resolve. GE-126a-3 must produce the identical value from the environment seam, and GE-126a-2-i depends on it NOT being produced when no target was named at all."
expects_from:
  ac_id: GE-126a-1
  contract: "The resolved-target collection for check_ac_governance, populated from argv, with the obligation that each member is judged rather than counted. This record adds the case where a named member resolves to no file."
