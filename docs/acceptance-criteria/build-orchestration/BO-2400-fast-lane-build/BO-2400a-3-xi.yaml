id: BO-2400a-3-xi
components:
  - build_orchestration
  - testing_quality
title: "A backfill whose tests survive every break, or that has nothing to break, stops the run with a named reason"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given UXP-511 is classified as a test backfill with newly-added tests T1, T2 and T3,
  When the mutation proof finds T1 and T3 proven, but T2 still reported passed against
    every broken version tried,
  Then the run halts before the coder is dispatched and before anything is staged,
    with reason tests_survive_mutation,
  And the halt report names T2, UXP-511, and every broken version T2 survived,
  And T1 and T3 being proven does not change that verdict.

  Given a criterion classified as a test backfill whose newly-added tests exercise no
    code that existed before this run, because they assert only on values the tests
    build themselves or on code added during this run,
  When the mutation proof runs,
  Then the run halts with reason no_existing_implementation_to_mutate, naming the
    criterion and its tests, because a test that is green with no implementation behind
    it proves nothing.

  Given a criterion classified as a test backfill where every broken version leaves
    its newly-added tests inconclusive (skipped or errored),
  When the mutation proof runs,
  Then the run halts with reason mutation_inconclusive, naming each test with its raw
    outcome under each broken version.

  Given any of these three halts,
  When the run ends,
  Then the halt is a structured blocker result of the same shape as the red-baseline
    halts of BO-2400a-3-i, and the criterion's work_status is unchanged.
depends_on: [BO-2400a-3, BO-2400a-3-x, BO-2400a-3-i]
