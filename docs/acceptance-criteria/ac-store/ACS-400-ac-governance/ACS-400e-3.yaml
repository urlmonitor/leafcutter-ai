title: "Non-AC files in the same commit are not affected by governance rejection"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a commit is staged that includes:
    - a Python source file (e.g. scripts/build.py) with valid changes
    - an AC YAML file with an unauthorized criteria modification,
  When the governance enforcement hook runs and detects the violation,
  Then the entire commit is blocked (git pre-commit hook semantics),
  And the error message refers only to the AC governance violation,
  And the error does NOT suggest that the Python file has any problem,
  And after the agent removes the AC file from staging (git reset),
    a subsequent commit of only the Python file succeeds.
depends_on: [ACS-400e]
