notes: |
  ONE COMPARISON, EXPRESSED AS AN END STATE, NOT A REMOVAL QUOTA. The whole of this
  record is a single inequality: the file must end at or below the LESS DEMANDING of
  (a) its permitted length and (b) the length it stood at before the change minus the
  measured lines the change added. Everything the user settled falls out of that one
  expression and none of it needs a second rule:
    - 2,677 with 50 added → 2,627. Net 50 lines leave the file. The 2x effect.
    - 410 with 50 added → the less demanding of 400 and 360 is 400. Sixty lines leave
      the file, not a hundred. The demand is capped at the size standard and nobody
      refactors two hundred lines when twenty would clear it.
    - 0 added → the previous length. Free.
    - at or below the permitted length → out of this regime entirely; GE-127a-1's
      threshold governs and this comparison must not reach the file at all.
  An implementation that computes a REMOVAL QUOTA and then checks it has been met will
  drift from this on the capped arm and on the zero-addition arm, and is the shape to
  avoid.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Written so the IT PO can
  lift them verbatim into test descriptors. Each names the arms that must go RED and the
  arms that must STAY GREEN; a mutation run that reddens everything is a FAILURE of the
  descriptor, not a stronger result, because it means the arms are not independent.

  (1) THE CAP. MUTATION: judge the file against the previous length minus the lines
      added, unconditionally, ignoring the permitted length — that is, drop the "less
      demanding of" and keep only the subtraction.
      MUST GO RED: the 410-line arm left at exactly 400, which commits today and is
      refused under the injection because the injection demands 360.
      MUST STAY GREEN: both 2,677-line refusal arms, the 2,677-line arm left at 2,627,
      the zero-addition arm, the under-limit silence arm, and EVERY arm of GE-127f-2.
      This is the single most likely wrong implementation, because "previous minus
      added" is the memorable half of the rule and the cap is the half that reads like a
      courtesy. It is not a courtesy: 78 of the 212 oversized files in this repository
      stand between 400 and 500 measured lines, so the cap is the arm that governs more
      than a third of the population.

  (2) THE MULTIPLIER. MUTATION: judge the file against its previous length alone —
      GE-127b's shipped comparison, unchanged.
      MUST GO RED: the 2,677-line arm left at 2,628, the 2,677-line arm left at exactly
      2,677, and the 410-line arm left at 401. All three commit under the injection and
      must be refused.
      MUST STAY GREEN: the 2,677-line arm left at 2,627, the 410-line arm left at 400,
      the zero-addition arm, and the under-limit silence arm.
      This injection is not hypothetical — it is the code that ships today. It is the
      red baseline for this record and should be captured before any work starts.

  WHY THE SAME-LENGTH ARM IS HERE AND WHAT IT NARROWS. GE-127b-1 is delivered and green,
  and one of its boundary descriptors asserts that a change leaving an already-oversized
  file at exactly its previous length commits, pinning the boundary at strictly
  greater-than. The third arm above refuses exactly that case when the change added 50
  lines. This is a deliberate narrowing recorded on GE-127b's amended_by, not a
  regression, and the full reconciliation — including the one shape under which
  GE-127b-1's descriptor still holds unchanged — is written on GE-127f-2, which owns
  what "added" means. Read it before touching that descriptor.

  THE ASYMMETRY WITH GE-127f-2, STATED SO IT IS NOT READ AS DUPLICATION. This record
  owns the comparison; GE-127f-2 owns one of its inputs. Both of this record's named
  mutations leave every arm of GE-127f-2 green, which is the evidence that the cap and
  the multiplier are this record's subject alone. GE-127f-2's named mutation, by
  contrast, reddens this record's refusal arms as well as its own — necessarily, because
  an input read the wrong way makes the comparison vacuous whatever the comparison says.
  That direction of coupling is the reason GE-127f-2 exists as its own record rather
  than being inferred from this one passing.

  THE GAMING ROUTE THIS RECORD MAKES URGENT, NAMED RATHER THAN INHERITED SILENTLY, AND
  NOT CLOSED HERE. Verified by probe in this worktree: the measurement rule discards
  triple-quoted regions and block comments ONLY. Three hash-comment lines measure as 3
  and four blank lines measure as 4. So deleting blank lines and hash comments is a
  fully valid way to satisfy a demand made under this record, it improves nothing, and
  it is the CHEAPEST available response to a demand of 50 or 100 lines. Three things
  follow and all three are deliberate:
    - No arm above is satisfied by that manoeuvre. Every arm in which the commit
      completes reaches its end state by whole constituent definitions leaving the file,
      never by stripping blank lines or hash comments, and any fixture that reaches the
      number the cheap way has failed to exercise the record.
    - Closing it mechanically would require reclassifying which lines are measured, and
      that is GE-127d's call. It must NOT be settled here by writing a second counting
      rule into this comparison. This record is the reason the question becomes urgent
      and that is the whole of its claim on it.
    - The structural answer the user chose is GE-127f-3: a demand above the
      author-clearable threshold is discharged by a restructuring specialist rather than
      by an author racing a gate, and a specialist optimising for structure does not
      answer "remove a hundred lines" by deleting a hundred blank ones. That protection
      is real and it is not mechanical. Do not write an acceptance clause that pretends
      otherwise.

  THE SHUFFLING EXPOSURE, AND THE PART OF IT THAT IS ALREADY COVERED. Moving a hundred
  existing lines into a neighbouring file satisfies this comparison and improves
  nothing; moving NEW work into a home of its own is the desired behaviour, and a diff
  shows the two identically. One half is already fenced by inheritance and should not be
  re-specified: if the receiving file is itself already oversized, GE-127b refuses the
  commit, and if the receiving file crosses its limit, GE-127a-1 does. The residual
  exposure is existing content moved into a NEW file, which has no mechanical backstop
  at all and rests entirely on GE-127f-3's separation of duties.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. The two
  named mutations above, including which arms must stay green, are written to be turned
  directly into test descriptors. delivers_to is null because nothing is enriched yet,
  not because this record is terminal.
