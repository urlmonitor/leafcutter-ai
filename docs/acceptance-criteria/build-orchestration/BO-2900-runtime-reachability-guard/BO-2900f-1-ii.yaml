test_rationale: |
  This AC is now about a verdict, not about a file, and the distinction decides every
  descriptor. The earlier version asserted that the record ends with one entry per
  gate; that is unsatisfiable from the driver, whose only channels over the record are
  append, a status-line rewrite and whole-record deletion -- none of which can remove
  a single heading -- and it would be wrong even if it were possible, because the
  heading belongs to another agent's audit trail. So the cardinality-on-disk
  assertions are retired here and re-stated on BO-2900f-2-ii, where the writer that
  actually produces the duplicate can be held to them.
  What survives is the part that was always the driver's: given a record it did not
  write, produce the right verdict from it. The two ordering descriptors are the
  load-bearing pair -- either alone is passed by an implementation that selects on
  outcome instead of recency, and selecting on outcome is the cheapest wrong fix. The
  untouched-record descriptor is the guard against the retired requirement creeping
  back in as an implementation detail: a driver that quietly deletes the older heading
  would pass every other descriptor here.
origin_agent: BrainCandy
created: 2026-08-18
amended_by:
  - "2026-08-18 BrainCandy: restated as an adjudication-only criterion and the write-side half split out to BO-2900f-2-ii. The original required the on-disk record to end with exactly one entry per gate. The driver cannot satisfy that -- its entire mutation surface over the record is append, a status-line rewrite and whole-record deletion, none of which removes a single entry -- and it should not: the duplicate originates at the agent that writes the entry, so making the driver delete it means one agent rewriting another agent's audit history to cover a write-side bug. Production evidence: ticket 03 of EPIC-DeploymentCompleteness carries two `commit (status: ok)` entries ten minutes apart, both written by the commit agent. Retired from this AC: exactly-one-entry-on-disk, no-second-entry-appended, and entry-count-equals-gate-count. Retained and sharpened: latest entry decides the verdict in both orderings, duplicates are counted and surfaced. Added: the driver must not rewrite or delete entries it did not write, stated positively as a design constraint."
