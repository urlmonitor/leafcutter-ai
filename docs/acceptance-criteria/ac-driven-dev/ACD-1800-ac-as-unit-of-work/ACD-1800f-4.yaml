notes: |
  COMPOSITION AND GRAIN-INVARIANCE. Note the deliberate contrast with ACD-1600g:
  exclusions compose by DIFFERENCE, proofs compose by UNION. A bundle must
  satisfy every member's proofs -- that part is the easy half, and it is the first
  Then clause.

  THE HAZARD IS ORDER AND ISOLATION, NOT COMPOSITION (ACD-1800f notes, verified):
    - user-surface-smoker Step 1 BLOCKS on a dirty worktree ("Pre-smoke worktree
      has staged changes").
    - Step 5 runs `git restore .` UNCONDITIONALLY after every stanza.
  Unioning N members' proofs into one run therefore interleaves N unconditional
  restores with N invocations that may each mutate the tree. The failure is not
  hypothetical: member A's proof legitimately leaves an uncommitted artefact,
  member B's proof restores the tree, and A's observation is destroyed -- or,
  worse, B's restore makes A's assertion pass for the wrong reason. The second
  Then clause ("a starting state unaffected by the other proof's run") is the
  behavioural statement of the fix; ACD-1800f-4-i drives the destructive case
  explicitly.

  THE THIRD THEN CLAUSE (attribution) exists because the aggregation the smoker
  uses today -- "if ALL stanzas PASS: emit ok" -- is set-shaped and loses stanza
  identity. Under ACD-1800c the bundle has N members and "the feature's smoke
  check failed" tells the reader nothing about which requirement to reopen. Same
  shape as ACD-1600g-3-i for boundaries.

  THE FOURTH THEN CLAUSE (grain-invariance) is the whole point of moving the
  proof to the requirement, and it is the clause a ticket-body implementation
  cannot satisfy: the fast lane
  (scripts/build_orchestration/fast_lane.py) builds a single AC with no ticket at
  all, so there is no body to hold a `## Smoke Fixture` block. It also means this
  AC's test must exercise BOTH paths -- bundled and standalone -- or it proves
  half the criterion.

  WHAT IS DELIBERATELY NOT SPECIFIED: how isolation is achieved (per-proof
  worktree, scoped restore of only the paths a proof touched, stash/restore
  discipline). That is the IT PO's decision; the criteria constrain the observable
  outcome, not the technique. Note only that "keep the unconditional `git restore
  .` and run the proofs sequentially" does NOT satisfy the second Then clause,
  since it is exactly the behaviour that destroys a sibling's uncommitted effect.

  TESTABILITY. Run the check over a real three-member bundle in a real worktree
  where one proof genuinely mutates the tree, and assert both proofs ran, the
  outcome names the failing member, and the standalone run of that member agrees.
  Any test that stubs the invocation away also stubs away the entire hazard.

  2026-08-17 (IT PO enrichment).

  ISOLATION TECHNIQUE LEFT OPEN, AS THE BA INTENDED -- but one boundary condition
  is added that the criteria do not state and an implementer will otherwise miss:
  the dirty-worktree PRE-CHECK must also be per-proof. It is not enough to scope
  the cleanup. Step 1 refuses to start on a dirty tree, so with a shared tree and
  a scoped restore, member A's legitimately-retained artefact still aborts member
  B before B's proof runs. Both halves of the collision have to move to the
  per-proof baseline together; fixing only the restore converts a destruction
  failure into a refusal failure, which ACD-1800f-4-i's fourth Then clause
  explicitly forbids.

  GRAIN-INVARIANCE: VERIFIED GAP, LARGER THAN THE BA COULD SEE. The BA's note
  says the fast lane "builds a single AC with no ticket at all", which is true and
  is the argument. The stronger verified fact is that the fast lane has no
  observation step of ANY kind: templates/workflows-js/fast-lane-ship.js declares
  a fixed five-phase order (Worktree, Resolve, Test Writer, Coder, Commit) and
  scripts/build_orchestration/fast_lane.py has ZERO occurrences of
  user-surface-smoker. So the fourth Then clause is not merely unproven on the
  standalone path -- the standalone path currently marks ACs done without ever
  looking at an observable promise. A store-side resolver does not fix that on
  its own; a phase has to be added.

  MIXED SURFACE -- PARTIAL FLAG (S2.8, BP-1100f-3-i), and it is widest on this AC:
    - MATCHED (python-coder / pytest): scripts/ac_store/*.py (union, isolation
      harness, attributed aggregation), scripts/build_orchestration/fast_lane.py
      (the standalone entry point and the done-accounting gate).
    - UNMATCHED: templates/workflows-js/fast-lane-ship.js (`.js`, jest/vitest) and
      templates/agents/user-surface-smoker.md (prose). A python-coder checked by
      pytest cannot modify a workflow engine file or an agent template.
  Mitigation recorded in it_requirements: expose the standalone check as a
  callable/CLI surface in fast_lane.py so the Python half is independently
  drivable and testable, leaving the JS phase insertion a thin call. No split was
  made -- ACD-1800f is at its 5-L2 cap and ACD-1800 at 6 of 7 L1, so a split is
  the user's call and is recommended rather than taken.

  ADJACENT REGRESSION THE MIGRATION INTRODUCES (from the component context, and
  it lands squarely on this AC): fast_lane.mark_done_built_acs() marks ACs done on
  test coverage alone. Once an observable promise can be `unproven`, that becomes
  phantom-done in the tool with the strongest done proof in the repo. The fifth
  test descriptor exists to pin it.
