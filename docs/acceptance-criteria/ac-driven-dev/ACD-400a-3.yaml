    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    covers: [ACD-400a-3]
    description: "Builds a fixture tree with L1 composite 'X-100a' (work_status not done) and leaf L2 'X-100a-1' whose only depends_on is [X-100a]; runs the scanner with leaf+todo filters and asserts 'X-100a-1' is in the ready list and NOT in the blocked list."
  - name: test_ancestor_never_named_as_blocker
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    covers: [ACD-400a-3]
    description: "Runs the scanner over the same fixture tree and asserts no blocked entry lists 'X-100a' as a blocker of 'X-100a-1' (ancestor excluded from the gating dependency set)."
  - name: test_prioritizer_consistent_with_scanner_on_ancestor_dep
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    covers: [ACD-400a-3]
    description: "Runs ac_prioritizer over the same ancestor-only-dependency fixture and asserts its ready/blocked classification matches the scanner's (no divergent blocking logic)."
