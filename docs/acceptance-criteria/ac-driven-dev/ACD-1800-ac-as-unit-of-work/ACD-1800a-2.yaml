criteria: |
  Given a requirement whose change surface indicates it modifies code,
  When the requirement's deliverable checklist is validated against that change
    surface,
  Then a checklist that lists a code item but no tests item is reported as
    incomplete,
  And the report names the missing deliverable kind (tests),
  And a checklist that includes every deliverable kind implied by the change
    surface is reported as complete.
