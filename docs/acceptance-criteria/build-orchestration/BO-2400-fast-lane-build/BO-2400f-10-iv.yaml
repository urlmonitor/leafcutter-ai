id: BO-2400f-10-iv
components:
  - build_orchestration
title: "A claim whose outcome is unknown is reconciled against the store and released, so a run never strands a claim it may have made"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run has resolved a set of five acceptance criteria, three of them
    reading todo and two already reading in_progress before the claim was asked for,
  And the claim step ends as "state unknown" (BO-2400f-7-vii) or as a claim command that
    ran and failed (BO-2400f-7-ix),
  When the run ends,
  Then before it reports, the run reads the work_status of each of the five in the store it
    claimed in, changing none of them,
  And each of the three that now reads in_progress is released back to todo through the
    run's release step (BO-2400f-10-i), with the release outcome reported as BO-2400f-10-ii
    requires,
  And neither of the two that already read in_progress before the claim is released,
  And the halt names the members the reconciliation found claimed and released, and the
    members it found unchanged.

  Given the same run, in which the claim had changed nothing before it stopped,
  When the reconciliation reads the store,
  Then no release is asked for,
  And the halt says the reconciliation found nothing claimed.

  Given the reconciliation cannot read the store, or its own reply is "state unknown",
  When the run reports,
  Then the halt names each of the three todo members as possibly left at in_progress, and
    says a later run aimed at them will be refused while they stay there (BO-2400f-8),
  And it does not report them as released or as unclaimed.

  Given a run that ended after a reconciled release,
  When the operator starts a new run for the same acceptance criterion from that store,
  Then the new run is not refused or narrowed on the ground that any of the three is
    already claimed.
depends_on: [BO-2400f-10, BO-2400f-10-i, BO-2400f-10-ii, BO-2400f-7-vii, BO-2400f-7-ix]
