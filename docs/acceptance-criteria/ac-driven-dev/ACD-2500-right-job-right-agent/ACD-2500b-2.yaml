amended_by:
- reason: it-po-technical-enrichment
  date: '2026-09-25'
  by: it-po
superseded_by: null
covered_by:
  - ACD-2500b-2-i
implemented_by: []
change_target: code
risk_surface: contract_boundary
notes: |
  READINESS CONFLICT (ACD-2500 notes) - RESOLUTION CHOSEN: the design must exist BEFORE
  approval (user decision 1: test-planner runs before the build, before approval). The
  rule in ACD-1600c-1/-2 and the check-ac-schema guard ("an approved leaf code AC carries
  a test contract") is NOT weakened: intent is not a contract. What is added is a
  distinct, named not-yet-approvable state ("test design pending") so the gap is visible
  instead of surfacing as a generic missing-contract error.

  AMENDMENT NEEDED: ACD-1600c-1 promises the flag names "which of {file targets, test
  contract} is missing". This tree adds a third reason ("test design pending", plus
  "reference file pending" from ACD-2500d-2-i). Amend ACD-1600c-1 to allow the added
  reasons; its two existing reasons are unchanged. ACD-1600c-3 (reference doc) should
  list them too.
