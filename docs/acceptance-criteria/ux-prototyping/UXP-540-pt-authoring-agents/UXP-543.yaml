id: UXP-543
components:
  - ux_prototyping
title: "Only the artifact-agents the classifier calls for are run"
component: ux-prototyping
level: L2
status: active
readiness: approved
priority: medium
req_status: approved
work_status: done
criteria: |
  Given a request classified by the product-truth classifier,
  When the authoring pipeline runs,
  Then only the artifact-agents the classifier calls for are dispatched,
  And a mockup-only request runs the mockup agent but not the mock-data or flow agents,
  And a mock-data-only request runs the mock-data agent but not the mockup or flow agents,
  And a mockup+data request runs the mock-data and mockup agents but not the flow agent,
  And a request classified 'none' drafts no product-truth artifacts and goes straight to normal AC authoring.
