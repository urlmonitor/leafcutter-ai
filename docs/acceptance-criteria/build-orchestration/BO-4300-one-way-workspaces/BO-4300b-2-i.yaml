  ac_id: BO-4300b-2
  contract: Per-project landing-place rule.
package_surface: false
it_requirements:
- 'Q5 (DECIDED user 2026-09-28): each project''s landing root is its own sibling folder, <parent>/<project-dir-name>-worktrees/,
  so shop''s and blog''s alpha land in different folders by construction. The marker still carries project_root
  and locate/list filter by it, so a shared explicit --landing-root override cannot mix them either: a
  request whose location already holds another project''s workspace is refused OCCUPIED (occupant kind
  other-project, BO-4300d-3) and that workspace is left untouched.'
- Proof runs the DEPLOYED maker -- the copy an install delivers, resolved through the shared test locator
  delivered by BO-4300f-4 -- as a separate process against real temporary git repositories with a real
  bare hub. No mock of git, no import of the maker module, no grep of its source (CLAUDE.md 'Gate / Workflow
  ACs -- Verify Behaviorally, Not by Grep'); a test never falls back to the templates/ source copy.
- 'Tests must not spawn the package''s own scripts/build.py (CLAUDE.md ''Tests must not spawn their own
  build.py''): the deployed maker comes from the shared deployed layout, and fixture projects carry a
  minimal stub build entry point that installs a real, rejecting hook in well under a second. A test that
  must mutate the package and build its own copy says so and justifies it in its ticket.'
- All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
  isolated global and system config; afterwards the developer's own repository's branches, registered
  worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_same_slug_in_two_projects_gives_two_distinct_workspaces
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: alpha in shop and alpha in blog yield two different workspace_path values, each a clone
    of its own project.
- name: test_shops_workspace_is_unchanged_by_blogs_request
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: shop's alpha workspace (files and HEAD) is identical before and after blog's request.
- name: test_locate_returns_each_projects_own_workspace
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: locate alpha run in shop returns shop's path and in blog returns blog's.
- name: test_two_projects_land_in_their_own_sibling_folders
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: shop's alpha is under <parent>/shop-worktrees/ and blog's under <parent>/blog-worktrees/.
- name: test_shared_landing_root_override_refuses_rather_than_collides
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: With both requests given the same valid --landing-root, blog's alpha is refused OCCUPIED
    with occupant kind other-project, and shop's alpha workspace is byte-identical before and after.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer, its exit code, and the state of the workspace, the hub and the main copy afterwards.
  A direct-import unit test would pass while the deployed copy is stale or mis-deployed (F13), and a git
  mock cannot show the half-made and occupied states this family exists to handle.
