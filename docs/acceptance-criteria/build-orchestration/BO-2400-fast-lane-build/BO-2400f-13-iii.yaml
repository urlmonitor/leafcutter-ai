notes: |
  This references BO-2400f-12-i's standard rather than restating it, on purpose: the two
  refusals must be inert in the same way, and writing the property out twice invites the
  two copies to drift. What is new here is the second scenario. BO-2400f-12-i is about
  the acceptance-criteria store; this is about the occupant, which BO-2400f-12-i never
  had to consider because its refusal has nothing sitting in front of it.

  The release trap is inherited too, and it is subtle. Every other pre-commit halt in
  this family MUST release (BO-2400f-10); this branch must NOT, because it precedes the
  claim by two whole phases. An implementer copying the sibling pattern will add the
  release call and it will look right in review — it is only wrong in the presence of a
  concurrent run, which is exactly the situation an occupied workspace signals.

  "No new branch exists as a result of the run" is the trace worth naming explicitly. The
  natural shape of a fix is to work out the branch, then check the location; a fix that
  gets those the wrong way round leaves a branch behind on every refusal, and nobody
  notices until the branch list is unreadable.

  IT enrichment note, 2026-08-25 (it-po). Two code-level facts make the no-new-branch
  clause concrete. First, _create_fastlane_worktree (:503) creates the branch AND the
  worktree in a single `git worktree add -b` call, so there is no partial state to worry
  about — but equally, reaching that function at all on a refusing path is already a
  violation. Occupancy must be decided upstream of it, in cmd_create_fastlane_worktree.
  Second, that command calls `worktrees_dir.mkdir(parents=True, exist_ok=True)` at :1284
  BEFORE the lookup at :1289. Creating the shared worktrees/ parent is pre-existing and
  idempotent and is not what this criterion is about; creating the per-slug directory is,
  and the before/after comparison will catch a fix that does it speculatively.

  One further write worth forbidding by name, because it is the reflex an implementer
  reaches for when a registration looks stale: `git worktree prune`. It is a write. It
  deregisters worktrees whose directories are momentarily unreachable, and it is exactly
  the kind of small trace the repeatability test exists to catch — correct-looking on the
  first run, a different world on the second.
