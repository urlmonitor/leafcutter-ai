assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "This is the guard that keeps the ACS-200f fix honest: the cheapest way to make ACS-200f pass is to stop reading test outcomes at all, and this AC fails if that is what happens"
  - "The three refusal cases must be distinguishable in the tool's message — genuinely failing covering test, no covering test, genuinely non-passing (skipped / independently xfailed) covering test — because they call for different operator actions"
  - "The third case is the boundary with BO-2500a-2-i: an outcome that is non-passing on its own merits must remain non-passing, while an outcome the enforcement plugin produced solely by masking a passing not-yet-done AC must not"
  - "Refusal must leave the AC YAML byte-identical; a refused run that has already rewritten part of the record is a worse failure than the refusal itself"
  - "Verify behaviorally — run the real tool in a fresh process against a real store containing one AC with a deliberately failing covering test, one with no covering test, and one with an independently skipped covering test, and assert three distinct non-zero refusals and zero store writes; do not grep the tool's source"
  - "Must follow the repo error-handling policy: specific-exception try/except around subprocess, file and YAML I/O, log at WARNING or higher or re-raise; no bare or silent excepts"
