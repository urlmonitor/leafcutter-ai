id: ACD-1800a-1
components:
  - ac_driven_dev
  - ac_store
readiness: reviewed
priority: medium
title: "A requirement carries an explicit deliverable checklist naming each artifact's kind and responsible craft"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement that will change source code and must ship the tests and a
    how-to update that go with it,
  When the requirement is inspected,
  Then the requirement carries an explicit deliverable checklist,
  And the checklist enumerates one item per artifact the requirement needs -- a
    code item and a how-to documentation item,
  And each checklist item names its kind and the craft responsible for producing it,
  And the kind is drawn from the vocabulary this store already uses to declare what a
    requirement changes, extended by one value for a diagram -- no second vocabulary of
    artifact kinds is introduced for the checklist,
  And a test is not one of the kinds: the obligation to test the code item travels with
    that item and never occupies a deliverable slot of its own,
  And the full scope of the requirement is readable from the checklist alone,
    without consulting any other artifact.
depends_on: [ACD-1800a]
