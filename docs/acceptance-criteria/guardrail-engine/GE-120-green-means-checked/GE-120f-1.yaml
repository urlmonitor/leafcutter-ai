notes: |
  WHAT THIS RECORD OWNS THAT ITS SIBLINGS DO NOT. GE-126b-5 requires the datum to exist,
  to be carried, and to be reported with four distinguishable values. It is silent on
  where the value comes from, and a well-formed declaration read back as its own answer
  satisfies every clause it states. This record closes that: the value is produced by
  putting the declared input through the check and watching, and a declaration standing
  alone yields the never-attempted value and nothing better.

  ANTI-GREP IS THE WHOLE SUBJECT, AND HERE IS THE PRECISE TRAP. A criterion satisfied by
  asserting that a declaration is present, that it parses, or that a field is populated
  reproduces this defect one level up — the declaration becomes the new thing nobody
  checks. The discriminator is the alter-and-revert pair: the declaration is held constant
  and the check's behaviour is changed, so the recorded value must MOVE. No implementation
  that reads the declaration can pass it, because the declaration never changes.

  ALSO NOTE, BEFORE THE ALTERATION IS PERFORMED: the canonical guard sources and the copies
  a run loads are not the same files here, and one is reached through a link. An alteration
  applied to a copy the run does not load fails GREEN, which is instance one of this same
  family — that is GE-126c-5's subject and it is a precondition of this clause being
  evidence rather than theatre.

  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSE. "No part of the record is taken from the
  declaration; a check whose declared input has not been put through it carries the value
  that the attempt has never been made." ARRIVAL COLOUR: GREEN, vacuously — today no record
  is written for any check, so no check is wrongly recorded as demonstrated. INJECTION:
  write the record from the declaration — treat a well-formed declaration naming an input
  and a rejection as the rejection having been observed. This is the efficiency a hasty
  implementation reaches for precisely because it makes the first run quiet. Under that
  injection every check carrying a declaration reads as demonstrated, the never-attempted
  class empties, and this clause must go RED naming at least one check that was never fed
  anything; revert must restore it.

  ARRIVAL COLOURS FOR THE REMAINING CLAUSES, stated so a green is not mistaken for progress.
  The Then that requires the input to be put through the entry point is RED on arrival —
  nothing puts anything through anything today. The alter-and-revert pair is RED on arrival
  for the same reason. Only the absence-asserting clause above starts green, and only
  because nothing is reported at all.

  DAY-ONE BLAST RADIUS IS THE CORRECT OUTCOME. On the commit that lands this, most checks
  will carry the value that the attempt has never been made, because it has not been made.
  That is the true state of the repository and must not be pre-suppressed by seeding
  records or by writing exemptions ahead of the first run. The natural remedy for the
  resulting noise — weakening the rule until it goes quiet — is the failure mode to design
  against.

  NO COUNT OF INSTANCES IS STATED OR IMPLIED IN THIS RECORD, DELIBERATELY. Records authored
  the same day disagree about how many instances of this shape exist, and the parent records
  the figure as disputed and forbids one below it. The population is what a census measures,
  not what a criterion asserts.

  BOUNDARIES — four adjacent owners, none of them sufficient. Enumeration (which guards are
  in the set at all) is BP-100n-4's. Reachability of a registered gate whose trigger can
  never match is BP-100k-4's. A deployed guard that nothing invokes is GE-120c-6's.
  Falsifiability of TESTS is TQ-500's; this tree owns falsifiability of GUARDS. The worked
  example passes all four and still cannot refuse, which is why none of them may be closed
  as a duplicate of this tree, nor the reverse.
