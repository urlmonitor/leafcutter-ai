title: "A loop that has never run is distinguishable from a loop with nothing to do"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a.yaml"
criteria: |
  Given the count of knowledge waiting to be written reads zero in a project
    where the routing step runs after every unit of work, and also reads zero
    in a project where it has never run at all — because a record carrying no
    learning text is not outstanding, and every record retained today carries
    none,
  When a person asks whether captured learnings are reaching their surfaces,
  Then an answer is available that states when the routing step last completed
    in this tree, and over which sink, reported separately from how many
    records are waiting,
  And a tree in which the routing step has never completed is reported as
    never having run, not as having nothing to do and not as an error,
  And where that answer rests on state that version control does not carry,
    the absence of that state is reported as no run recorded in this tree,
    rather than as a stale figure or as a zero indistinguishable from a
    healthy one,
  And the answer states, for the sink it names, whether that sink exists —
    so a routing step running happily against a path no producer writes to is
    visible as that, and not as a quiet success,
  And the answer names no figure that is also produced by the capture-health
    report, and says which of the two a reader should consult for which
    question.
