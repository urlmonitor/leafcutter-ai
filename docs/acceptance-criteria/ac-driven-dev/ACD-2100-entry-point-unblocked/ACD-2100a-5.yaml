it_requirements:
  - "The change must land under templates/. This record's evidence must be gathered against the source copy; ACD-2100d-1 is where the deployed copy is exercised."
  - "The class must be closed by a single resolution used by every support-file access on the startup path -- not by five per-site repairs. A per-site repair leaves the sixth site to be added the same way the last five were written."
  - "The last Then clause must be established from what the process actually did -- the files it opened or the commands it issued, as recorded by the run itself or by the operating system -- never from a source scan. A scan for the literal string passes on a path that is never executed and fails on a correct path built by concatenation."
  - "All three runs must complete their startup path with no network available, so a transport failure cannot be mistaken for a resolution failure."
  - "Must satisfy the repository error-handling policy across every resolution site touched."
  - "The startup path must reach its first question in under 2 seconds from each of the three directories on a cold run, so that a resolution built on a filesystem search does not become the new startup cost."
test_spec:
  - name: test_startup_reaches_the_first_user_question_from_three_working_directories
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The same run is driven three times -- project root, a real worktree, and an
      unrelated directory holding neither the project nor any installed support files --
      and all three reach the first question the route puts to the user.
  - name: test_no_startup_run_halts_on_a_missing_file_or_a_non_repository_directory
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      None of the three runs terminates before the first question with a
      file-not-found or not-a-git-repository outcome; the assertion is on the run's
      recorded outcome, not on the absence of an exception.
  - name: test_every_support_file_opened_before_the_first_question_is_inside_the_project
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the plan-feature workflow driven through the workflow runner, with the set of files opened and commands issued captured from the run itself"
    description: >-
      For each of the three runs, every support-file location the process actually
      opened or executed before the first question resolves to a path inside the
      project it was pointed at -- collected from observed process behaviour, not from
      reading the workflow source.
test_rationale: >-
  The third run is the sharp one. The project-root case passes today, and the worktree
  case is what KI-ACD-009 reproduces, but the unrelated-directory case cannot be
  satisfied by any accident of layout -- there is nothing there to resolve against, so a
  surviving relative path has nowhere to hide. The last assertion is deliberately built
  from observed process behaviour rather than a source scan: a scan for the literal
  support-directory string passes on a dead code path and fails on a correct path
  assembled by concatenation, which is the exact inversion that makes grep-based
  evidence worthless for this class (CLAUDE.md, "Gate / Workflow ACs -- Verify
  Behaviorally").
