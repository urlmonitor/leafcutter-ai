roadmap_phase: phase_1
criteria: |
  Given a ticket whose motivating claim is "build X fails", captured with the exact
    reproduction command and the observed failing result,
    and the build now succeeds when that command is re-run at dispatch time,
  When the preflight premise re-check runs before the phase agent is spawned,
  Then the re-check observes that the reproduced result no longer matches the captured
    result,
  And the dispatch is halted with a held-back reason that names the stale premise and
    shows the captured-vs-current results,
  And no phase agent is spawned.
