estimated_complexity: S
it_requirements:
  - "Acceptance must derive from MEMBERSHIP of the declared supported-kind set, never from a hard-coded name list in the refusal path. A fifth kind added to the declared set must become acceptable with no edit here -- the same data-driven rule BO-4100d-1 establishes, read rather than duplicated."
  - "No fallback kind may exist anywhere on the creation path. An implementation that maps an unknown kind onto a default IS the defect this record closes, and it will reproduce the 2026-09-14 failure on the fifth kind while passing every test written for the four."
  - "The listed honourable kinds must be rendered FROM the declared set, so the list cannot go stale when the set changes."
  - "The refusal must be inert -- no branch, no directory, no registration entry -- and must reach that guarantee through BO-4100a-3-i's no-debris refusal behaviour rather than re-deriving it."
  - "The refusal must be a discriminated structured outcome in the shape ADR-039 established, distinguishable from the unreadable-shared-line refusal of BO-4100a-3 and from the post-condition failure of BO-4100a-2."
  - "Template and deployed copies change together and are verified in parity via the build.py round-trip (ADR-001)."
delivers_to: null
expects_from:
  ac_id: BO-4100d-1
  contract: "The declared supported-kind set. Membership of that set is the sole acceptance rule here, and the set is also what the refusal renders as the list of honourable kinds."
test_required: true
test_spec:
  - name: test_an_unsupported_kind_is_refused_and_no_workspace_is_created
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A kind outside the declared set is requested; creation refuses, and the branch list and worktree list are unchanged."
  - name: test_no_workspace_is_created_under_a_different_kind_from_the_one_requested
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "After the refusal, no branch exists carrying ANY kind for the requested slug. This is the assertion that fails against a fallback-to-default implementation, which the previous test's 'refuses' clause alone does not catch if the fallback still reports a warning."
  - name: test_the_refusal_names_the_requested_kind_and_lists_the_honourable_ones
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Both values are present in the refusal, and the listed kinds equal the declared set exactly."
  - name: test_extending_the_declared_set_makes_a_previously_refused_kind_acceptable_with_no_other_edit
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A fifth kind is added to the declared set in the fixture; the same request that was refused now succeeds, and the refusal's printed list has grown by one. This is what distinguishes a data-driven rule from a hard-coded four-name check, and it is the clause that closes the defect class rather than the four observed cases."
test_rationale: |
  BO-4100d-1 closes four cases; this record closes the class. The difference is only
  observable if the supported-kind set can be varied at test time, which is why the fourth
  test extends it and asserts both the acceptance and the printed list change together.
  Without that test, an implementation that hard-codes the four current kinds in the
  refusal passes everything here and reproduces the original silent substitution the first
  time a fifth kind is introduced.
  The second test is stated separately from the first because "creation refuses" is
  ambiguous about a fallback that warns and proceeds -- exactly the shape of the original
  defect. Asserting that no branch exists under any kind removes the ambiguity.
