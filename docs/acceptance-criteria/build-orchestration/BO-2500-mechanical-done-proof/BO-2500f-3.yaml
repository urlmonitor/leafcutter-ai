    state: to_be_created
  - path: scripts/build_phases_ac_store.py
    state: existing
it_requirements:
  - 'Fingerprint = the git blob sha (the sha-1 object id git hash-object computes), as the
    brief proposed; confirmed. Each layer fingerprints the version it decides on: the pre-commit
    check uses the staged index entry, the CI changed-records check uses the PR head tree,
    and the mark command hashes the working-tree file with the repository''s own clean filters
    (git hash-object --path semantics), so a Windows CRLF checkout yields the committed blob''s
    sha.'
  - Compare every listed file and report every difference in one refusal (not first-failure),
    each with its recorded and current sha; a missing path is reported as missing.
  - 'No clock: no date or age is read for this verdict.'
  - Called only at mark time, for the record being marked done. The whole-store CI sweep over
    finished records does not re-compare (TQ-400a/b, and TQ-400e-5's open question).
  - git unavailable, not a repository, or a sha that cannot be computed gives 'could not evaluate'
    (BO-2500f-4-i), never 'holds'. Paths are repo-root-relative POSIX; a path escaping the
    repo root is refused.
  - The verdict also carries BO-2500f-3-i's approval result, so the shared rule receives one
    inspection verdict.
  - Every new module under scripts/ac_store/ is added to build_ac_store's deploy_map in scripts/build_phases_ac_store.py,
    and its import is proven in the DEPLOYED .leafcutter/ layout, not only the source tree
    (the BO-2500a-1-ii ModuleNotFoundError precedent).
  - 'Must handle errors gracefully per the project error handling policy: every failure path
    logs at WARNING or higher and resolves to a refusal, never to a waiver.'
test_required: true
test_intent:
  - clause: each listed file is fingerprinted as it stands in the version being marked done
      and compared with its recorded fingerprint
    needs_test: true
    reason: The fingerprint must be of the version being decided; staged and working-tree
      content that differ show which one is read.
  - clause: when both fingerprints match, the inspection holds
    needs_test: true
    reason: The positive case shows an unchanged inspection is honoured, so the rule does
      not refuse everything.
  - clause: when either differs, marking done is refused with the verdict "re-inspection needed",
      naming each changed file with its recorded and its current fingerprint
    needs_test: true
    reason: 'Decay is the point of this record: a changed file must refuse with both fingerprints
      named.'
  - clause: a listed file that no longer exists at its recorded path refuses marking done
      in the same way, reported as missing rather than as changed
    needs_test: true
    reason: A deleted or moved file is a separate failure that a lookup error could turn into
      a crash or a pass.
  - clause: 'this comparison is made at every layer that decides done for a record being marked
      done: the mark command, the commit-time done check and the CI check over changed records'
    needs_test: true
    reason: Each layer must reach the same verdict, and only one record run through the mark
      command, pre-commit and the CI changed check shows that they agree.
  - clause: the inspection's age plays no part in the verdict, so an inspection of unchanged
      content holds however old it is
    needs_test: true
    reason: An old inspection of unchanged content must still hold, and an old record guards
      against a clock creeping in.
  - clause: re-checking records that are already finished, and demoting those whose inspected
      content has since changed, is not done here; it belongs to TQ-400a and TQ-400b
    needs_test: false
    reason: This states what is out of scope (TQ-400a/b own re-checking finished records),
      and there is nothing here to run.
delivers_to:
  - agent: python-coder
    ac_id: BO-2500f-4
    contract: 'inspection_verdict(record, repo_root, layer) -> {ac_id, holds: bool, reason,
      changed: [{path, recorded, current}], missing: [path], review_date: str|None}, never
      raising.'
  - agent: python-coder
    ac_id: BO-2500f-3-i
    contract: 'The inspection under evaluation: verified_by.gate_run, verified_by.inspected
      [{path, blob}] and the record''s id, for a record being marked done.'
  - agent: python-coder
    ac_id: BO-2500f-3-ii
    contract: The blob fingerprint function (git blob sha of a path's working-tree content
      with the repository's clean filters), reused by /inspect to compute the fingerprints
      it shows.
expects_from:
