roadmap_phase: phase_1
scope: standing
criteria: |
  Every answer states how much of the whole it actually looked at.

  Today a question about your requirements comes back with results and no sense of
  scale, so an answer that quietly saw a fraction of them looks exactly like one
  that saw all of them — and every check built on top of that answer confidently
  agrees with it. This goal ends silent partial answers: every result arrives with
  a total it was measured against and a plain statement of what was counted and
  what was left out. When the two do not add up and nobody can explain the
  difference, the answer stops instead of being passed on as a clean bill of health.
