  - name: test_the_inputs_the_census_read_are_byte_identical_afterwards
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "The registration data and every check source the census read are hashed before and after the run and are unchanged - asserted by comparing bytes, never by believing the report. This is what separates reporting from repairing."
  - name: test_no_commit_is_gated_on_the_censuss_findings
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: e2e
    angle: reachability
    surface_invoked: "git commit in a scratch repository with the deployed pre-commit chain installed"
    description: "With the census's findings non-empty, a commit of unrelated work completes; the census is absent from the blocking hook set and is not invoked by the chain."
  - name: test_each_instance_is_individually_identified_and_re_runnable
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "Every instance in the heavily seeded run is named with the two working directories and two outcomes that produced its classification, so a reader can re-run any one of them by hand rather than receiving only a total."
test_rationale: |
  Two opposite failures are available here and each is invisible to the other's test. The
  first is treating a large finding as a failed run, which is the natural instinct when a
  quality measurement returns a big number and which would make the baseline unusable —
  the heavily seeded fixture set is what forces the question. The second is the census
  quietly repairing what it finds, which would make the next run's number meaningless;
  that is asserted by hashing the inputs before and after, deliberately not by reading a
  claim in the report, because the report is the thing under suspicion. The e2e commit
  descriptor exists because this component has a recorded case (KI-CG-017) of a working
  detector being bypassed purely because its verdict arrived as a commit blocker, and a
  unit test cannot show that the census is absent from the chain.
