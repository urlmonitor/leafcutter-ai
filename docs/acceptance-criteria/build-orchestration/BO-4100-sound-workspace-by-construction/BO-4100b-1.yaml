notes: >-
  The last clause is the decisive one and comes straight from the 2026-09-14 observation:
  the identical commit was refused while behind and accepted after the main line was
  merged in, which is proof the verdict was a function of the branch's position rather
  than of the work. Polarity warning carried down from BO-4100b: this is a check that
  wrongly FIRES. BO-1700's family is about a check that wrongly stays SILENT, so nothing
  under BO-1700 covers this and BO-1700h must not be cited as if it did.
