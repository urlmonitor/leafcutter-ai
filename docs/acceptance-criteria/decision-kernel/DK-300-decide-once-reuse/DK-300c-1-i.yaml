id: DK-300c-1-i
title: "A decision without a human approval leaves nothing to publish"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a run whose decision was resolved by the host alone, or whose decision carries no human
    approval (approved_by naming jev, host or the kernel, or no approved_by at all),
  When the run ends,
  Then the run's staged decisions folder holds no record for the decision,
  And the run's result names no staged record and gives no publish command.
