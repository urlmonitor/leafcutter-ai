criteria: |
  Given the how-to for resuming a paused planning run,
  When an operator follows it for a run that pauses at two decision points in sequence,
  Then the guide shows how to read which decision the record currently names, supply the
    answer for that decision, and repeat for the next decision after the run pauses again,
  And it states that one resume carries the answer for exactly one decision and that an
    answer for a later decision is refused until the run is waiting on it,
  And it states that a resumed run does not treat the criteria it committed itself as
    existing coverage, so no covered-route decision appears for them,
  And it states what the operator sees when recording a pause fails because the store
    could not be written, and how to retry,
  And every status value named in the guide is one the route actually reports.
