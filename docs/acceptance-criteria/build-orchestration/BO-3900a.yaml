it_requirements:
  - "Absoluteness is decided from the string's form alone. No host platform value, host path module or environment variable takes part in classification or resolution, so the both-hosts outcome holds by construction rather than by a per-host branch."
  - "Absolute: drive-lettered forms (either letter case, backslash, forward slash or mixed), UNC forms, and leading '/'. Relative: forms with no root and no drive. Drive-relative ('C:foo') and rooted-without-drive ('\\foo') forms are in neither class; they belong to BO-3900c's refused set."
  - "The Windows-shaped cases run unconditionally on the Linux CI runner. No skip, expectedFailure or platform condition may guard them, and a non-zero skip count in this test module is a review failure."
  - "Fixture strings are written as literals and shape-checked (a drive letter, then ':', then at least one literal backslash) before they are used. A fixture that fails the shape check fails the test; it does not skip it."
  - "Resolving the seven spellings against 'C:/wt/epic' must return byte-identical strings whichever host platform value the test presents."
