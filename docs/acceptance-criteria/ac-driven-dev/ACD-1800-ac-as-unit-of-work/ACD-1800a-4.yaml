it_requirements:
  - "KIND VOCABULARY DECISION (IT PO, the choice the BA deferred): add ONE new deliverable kind covering the whole product-truth family with a sub-type, not three sibling kinds. Flows, mockups and mock data share one store, one authored direction and one evidence mechanism; adding them one at a time reproduces the three-orphaned-triggers pattern documented on ACD-1800f, where near-identical declaration slots were introduced separately and two of them ended up wired to nothing."
  - "THE AUTHORED OBLIGATION AND THE DERIVED BACK-REFERENCE MUST BE SEPARATE KEYS. Verified 2026-08-17 in config/ac_store_schema.json: the existing `product_truth` field is TOOL-OWNED, generated as the inversion of every flow step or branch whose `implements` list contains this AC id, and is NEVER hand-edited. The product-truth validator errors on any mismatch against the by_ac inversion, so the first hand edit breaks it. The new checklist item must never be written into that field."
  - "THE CYCLE CUT -- the load-bearing constraint. Satisfaction is judged from the STRUCTURAL fact that a flow node's `implements` names this AC, and from nothing else. The implementation must NEVER read the node's `impl_status`, because the flow schema derives impl_status from the work_status of every AC in `implements`; feeding it back into the AC's own completeness closes the loop AC.work_status <- flow.impl_status <- AC.work_status."
  - "THERE ARE TWO WAYS TO READ THE STATUS WRONGLY, NOT ONE. Verified: the flow schema also defines `expands_to` on a step -- when set, that step's impl_status is derived from the CHILD FLOW's rollup, TAKING PRECEDENCE over `implements`. So a naive 'read the step's impl_status' is wrong on two independent derivation paths and would appear correct on whichever one the first fixture happened to use. State the rule positively to close both: read `implements` membership only, never impl_status on any path."
  - "PREFERRED EVIDENCE SOURCE: the derived product-truth back-reference already on the AC record. It records exactly the node linkage (flow, node, node_kind, screen, mock_data, entities, source, asof) and carries NO status field of its own, so reading it for link content is structurally incapable of closing the cycle. If the implementation instead walks the flow artifacts directly it must select `implements` only and must not deserialise impl_status into the decision at all."
  - "PURELY ADDITIVE. A requirement declaring no product-truth deliverable must produce byte-identical validation output and checklist behaviour before and after this change, or it collides with ACD-1800a-2's checklist-versus-change-surface validation and ACD-1800a-2-i's missing-kind reporting."
  - "The item's `craft` must resolve to a real agent id in the agent registry -- for this kind the product-truth authoring crafts (flow-author, mockup-author, mock-data-author), never a coder. Reject an unknown craft, and reject a coder craft on a product-truth item, or the surface-to-craft map ACD-1700b establishes is bypassed at exactly the point it was added to protect."
  - "Validate the extended enum at EVERY enforcement point that gates commits: scripts/commit_guardian/check_ac_schema.py plus its manual-validation fallback scripts/commit_guardian/_ac_schema_validators.py (the load-bearing gate when jsonschema is absent), mirrored by scripts/ac_store/validate_ac_schema.py. A rule added only to config/ac_store_schema.json is a partial gate -- the same finding recorded on ACD-1800a-1."
  - "Tolerant reader: absence of the checklist is legacy mode -- derive or skip, never fail (ADR-026 rule 4). Canonical source only: the store schema and the modules under scripts/ac_store/, never a deployed .claude/ copy (ADR-001)."
  - "Error handling per the project policy: reading the flow store crosses a filesystem boundary, so a missing or malformed flow artifact must be caught by exception type and logged at WARNING or higher, and must resolve to 'not yet delivered' -- never to 'delivered' and never to a swallowed exception. Failing open here would mark a product-truth deliverable done because its evidence could not be read."
delivers_to:
  agent: python-coder
  contract: "Deliverable checklist item of the new product-truth kind: { kind: <product-truth kind>, subtype: flow|mockup|mock_data, craft: flow-author|mockup-author|mock-data-author }, plus a satisfaction predicate derived ONLY from flow-node `implements` membership (evidence: the derived product-truth back-reference entries {flow, node, node_kind}). Consumed by ACD-1800b-1a's per-deliverable sign-off store and by ACD-1800a-2's checklist-versus-change-surface validation, which must treat the new kind as satisfied by a product-truth artifact rather than by a code path."
expects_from:
  ac_id: ACD-1800a-1
  contract: "The deliverable checklist field, its {kind, craft} item shape, and the kind enum {code, tests, docs, diagram, config}. This AC EXTENDS that enum and item shape; it must not introduce a second checklist field or a second item shape."
test_spec:
  - name: test_product_truth_deliverable_reads_as_delivered_once_a_flow_node_implements_the_ac
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Writes a real AC record declaring the deliverable and a real flow artifact whose step `implements` names it, runs the real product-truth generator to produce the back-reference, and asserts the deliverable reads as delivered."
  - name: test_deliverable_stays_delivered_when_the_flow_step_reports_not_started
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "THE CYCLE TEST. Same fixture with the flow step's impl_status forced to not_started: the deliverable is still delivered. This is the assertion that fails on the naive implementation and the reason the AC exists."
  - name: test_deliverable_stays_delivered_when_the_step_carries_expands_to
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "A step with `expands_to` set, whose child-flow rollup is not_started, still satisfies the deliverable -- closing the SECOND, precedence-taking derivation path that the previous test does not reach."
  - name: test_ac_with_no_product_truth_deliverable_is_unchanged
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Validation output and checklist behaviour for a requirement declaring no product-truth item are byte-identical before and after the change -- the no-regression clause."
  - name: test_declaring_the_obligation_does_not_corrupt_the_derived_back_reference
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Runs the real product-truth validator after the obligation is declared and asserts the by_ac inversion equality check still passes -- proving the authored key and the tool-owned key stayed separate."
  - name: test_unreadable_flow_store_resolves_to_not_delivered
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "A missing or malformed flow artifact yields 'not yet delivered' with a logged warning, never 'delivered' and never an unhandled exception -- the fail-closed guard on the evidence read."
  - name: test_product_truth_item_rejects_a_coder_craft
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A product-truth checklist item whose craft is a coder agent is rejected by the gating validators, including on the manual-validation fallback path with jsonschema forced unavailable."
test_rationale: "The whole AC turns on a distinction that is invisible to inspection and to any direct-import unit test: 'satisfied because a flow node names this AC' versus 'satisfied because the flow node reports done'. In every ordinary fixture those two facts agree, so both implementations pass -- the only way to separate them is to force the linkage and the reported status to DISAGREE, and then assert on the linkage. That is the second test, and it is why a predicate handed a pre-built dict proves nothing: the fixture would carry whatever status the test author chose, and the trapped implementation would read it and be right by accident. The third test exists because `expands_to` gives impl_status a second derivation path that takes precedence over `implements`; an implementation that correctly ignores the implements-derived status can still read the child-rollup-derived one, and test two alone cannot see that. The fifth test runs the real product-truth validator rather than asserting on the record shape, because the failure it guards -- the authored obligation leaking into the tool-owned back-reference -- is only observable as the by_ac inversion equality check breaking, which no shape assertion would catch. The last test asserts on the manual-validation fallback as well as the jsonschema path, since the fallback is the branch that actually gates the commit when jsonschema is absent."
