implemented_by: []
notes: |
  BA INTERPRETATION OF "a supervised mode" (question Q2 in the sign-off): supervised means the call
  is made on behalf of a run with no person present. It therefore (a) never waits for a person and
  (b) must say which run or criterion it serves, so an unattended commit is always attributable --
  the property KI-CG-20260907 says the delegation rule actually protects. Plan-feature and finalize
  have no AC id (L1 constraint 1), hence "run OR criterion". The 60-second figure is a placeholder
  for the IT PO to set; the testable fact is that the wait ends and is reported, not its length.
  The confirmation gate a person sees stays in the commit agent and is not moved into the step.
