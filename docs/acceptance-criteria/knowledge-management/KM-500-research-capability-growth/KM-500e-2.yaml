criteria: 'Given the selected project revision records an AC with lifecycle status active, implementation work status
  todo and a canonical criterion distinguishing query execution from answering the question

  When research requests that AC''s work status and exact governing criterion

  Then the evidence exposes each requested available field under its own declared meaning with the AC identity,
  source revision and supporting locator

  And the work-status answer is todo rather than active, and a source quotation preserves the canonical clause rather
  than presenting a generated paraphrase as exact text

  And lifecycle status, requirement status, implementation work status and readiness remain distinct even when their
  names or values resemble one another

  And an absent, undisclosed or truncated required field is named in a structured unresolved-answer outcome instead
  of being filled from a similarly named field or hidden source inspection

  And an available partial answer identifies which requested facts are supported and which remain unresolved

  And a suggested duplicate or conflicting requirement cites the compared canonical clauses and labels interpretation
  separately from the recorded facts

  And similarity alone neither makes two requirements equivalent nor chooses authority between contradictory sources.

  '
