implemented_by: []
notes: |
  Owns the FAIL-CLOSED headline guarantee (user-confirmed, do NOT re-litigate): the
  DEFAULT action on any missing/invalid in-scope declaration is BLOCK. Aggregates
  verdicts from all three surfaces (GE-117a-1 / GE-117b-1 / GE-117c-1) and enumerates
  ALL offenders (never first-only), mirroring the enumerate-all-drifted-pairs
  precedent. The actionable message content (naming file + what's missing) lives
  here as the block report; GE-117e renders the routes OUT of the block. Scope of
  what triggers the block is diff-only, inherited from a/b/c — not redefined here.
  Warn tier is a deliberate opt-in only (GE-117d-3), never the default.
