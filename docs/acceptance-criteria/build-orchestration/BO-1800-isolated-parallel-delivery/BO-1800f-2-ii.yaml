notes: |
  This is the criterion that turns a count into something a reader can act on. The
  two cases are indistinguishable by counting absent lines, and they call for
  opposite responses:

    - taken away by the copy's own commits -- a decision for whoever owns the copy.
      It may be exactly what the work set out to do, in which case declaring it is
      the answer and putting it back is the error CLAUDE.md already records.
    - absent because the starting state predates it -- never the copy's to take
      away, and always the defect this tree exists to prevent.

  Reporting both as one number is how a reader arrives at the wrong response, in
  either direction, and it is why the existing manual audit needs a human to
  interpret its output before it means anything.

  Falsifiability. One fixture carries both cases at once. An implementation that
  reports only a count, or that labels both cases the same way, fails on the
  separation assertion even though it correctly identifies that something is absent
  -- so a behaviour that detects removals but cannot explain them does not satisfy
  this record.
