notes: |
  FIELD EVIDENCE — 2026-09-23, closing BO-400e-5, the documentation ticket of
  EPIC-WorkIsOnlyEverMarkedFinishedThroughThe. The commit was refused with 24 undeclared
  source files, every one of which was already listed in that ticket's out_of_scope. The
  hook's own parser read them correctly — _parse_yaml_list_field returned 25 entries
  against the staged blob — and they were discarded one line later by:

      if is_docs_only_or_config_only_ticket(files_touched):
          return set()

  The remedy the hook prints ("add the above files to files_touched or out_of_scope") was
  therefore the one thing that could not work. The only other routes were to list source
  files the ticket had not touched, which is a false record of exactly the kind this
  component exists to prevent, or to skip the hook. It was skipped twice, under protest,
  with the reason recorded in both commit messages.

  It is not an edge case: it fires for every documentation ticket in every epic that also
  contains implementation tickets, because the changed-file set is computed over the branch
  range. A docs ticket is usually last in such an epic, so it meets the whole branch's
  accumulated source diff.

  NAMED MUTATIONS (each turns only this record's tests red):
    M1 — restore `return set()`. Caught by
         test_docs_only_ticket_honours_its_out_of_scope_declaration.
    M2 — delete the docs-only branch entirely, so files_touched is unioned too. Passes M1's
         test but is caught by test_docs_only_ticket_with_no_out_of_scope_is_unchanged only
         if files_touched ever contained source — so the real guard against over-fixing is
         test_docs_only_ticket_still_flags_a_file_it_declared_nowhere.
    M3 — return every changed file as declared. Caught by the same middle test.
