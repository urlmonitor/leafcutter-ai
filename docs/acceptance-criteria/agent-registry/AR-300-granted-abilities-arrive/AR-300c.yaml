  - skill_registry
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  One record of a specialist's abilities, sitting next to its permissions.

  A specialist's abilities are declared in a single place, alongside the
  declaration of what it is permitted to use, so the two can be read together
  and checked against each other. Any other copy of that list is derived from
  the one declaration, never typed in again -- so two records of the same grant
  can no longer disagree, and nobody has to know which one to believe.
