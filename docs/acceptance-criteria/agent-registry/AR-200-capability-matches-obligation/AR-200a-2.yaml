  post_write_commands:
    - "python -m pytest unit_tests/commit_guardian/test_handoff_signoff_completeness.py -v"
  constraints:
    - "THE AGENT GAINS AN INSTRUCTION; THE CHECKLIST DOES NOT LOSE AN ENTRY. Do not close this by relaxing the three-place parity rule, by making the Sign-offs line optional on the handoff path, or by teaching the completion write to tolerate the mismatch. The parity guard is what caught this, and the record's internal consistency is what the BO-400 family exists to make authoritative."
    - "DO NOT DELETE THE TWO-READERS EXPLANATION. Test Delegation step 2 explains that the ticket prose tells the NEXT AGENT what to do while `handoff_target` tells the DRIVER whom to dispatch, and that dropping either leaves its reader with nothing to act on. That paragraph is load-bearing (BO-3000a) and must survive the edit intact."
    - "NAME WHAT THE EXEMPTION ACTUALLY COVERS. The signoff skill's §1.5 step 3 relaxes exactly one thing for handoff -- the OTHER agent's task checkboxes. The amended instruction must say so explicitly, because the observed failure is an agent generalising that single exemption into 'the handoff path is lighter overall'."
    - "VERIFY BY RULE, NOT BY PHRASE. A test asserting that python-coder.md contains the words 'atomic sign-off' passes on any wording that happens to include them and protects only the file already fixed. Derive both sides from the templates, per AR-200a-1's own precedent."
