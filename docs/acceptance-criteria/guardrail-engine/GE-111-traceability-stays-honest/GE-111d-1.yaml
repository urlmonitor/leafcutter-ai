it_requirements:
  - "The update route requires NO new write-mechanism from this hook — the developer (or an implementation agent) edits implemented_by directly, which ACS-400b-2 already permits implementation agents to do, so it does not collide with the check_ac_governance write-lock. The hook's only behavior is to re-evaluate the re-staged AC and return clean when the new entry resolves."
  - "Re-evaluation must read the re-staged AC YAML from the staged index (the AC file itself is now staged), and re-run GE-111c scope + GE-111b verdict against the updated entry — no special-case update path; correctness falls out of re-running the same pipeline."
  - "The updated implemented_by value must be accepted in the exact 'path#symbol' anchor form GE-111b-3 suggests, so applying a suggested location is a verbatim copy with no transform."
  - "Must follow the project error handling policy (CLAUDE.md Rules 1-4)."
