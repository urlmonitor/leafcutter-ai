criteria: |
  Given a total of 180 records, an answer covering 148 of them, and declared exclusions
    of 24 deprecated records and 8 non-requirement records, each with its ground stated,
  When the reconciliation runs,
  Then 148 plus 24 plus 8 equals the total of 180, the answer is returned, and no halt
    is raised,
  And the returned answer still carries its total, its covered count, and its declared
    exclusions, so passing reconciliation never strips the coverage figure,
  And an answer covering every record — 180 of 180 with no exclusions declared — also
    passes without a halt,
  And an answer that legitimately matched no records but enumerated all 180 — 0 covered,
    180 declared excluded with grounds — passes, distinguishing a genuine empty result
    from the unaccounted-for shortfall of ACS-1100c-1,
  And a scoped answer passes on the same terms: 3 covered against a store total of 2,784
    with 2,781 declared excluded on the ground that they are outside the requested scope,
    with the scope named and both totals reported, reconciles and is returned,
  And passing reconciliation is not itself an all-clear: each of these returned answers
    still caps what a downstream verdict may claim under ACS-1100d-2, so no answer that
    passes here may be read as licensing an unqualified all-clear.
depends_on:
