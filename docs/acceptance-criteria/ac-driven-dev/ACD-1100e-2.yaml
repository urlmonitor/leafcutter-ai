criteria: |
  Given config/version.json contains version "2.0.0",
  When the build script (scripts/build.py) is executed with a target directory,
  Then the build output includes a reference to version "2.0.0" in at least
    one of: a deployed version file, a build log message, or a generated
    CLAUDE.md section,
  And a user examining the deployed output can determine they are running
    leafcutter v2.0.0 without reading the source package directly.
