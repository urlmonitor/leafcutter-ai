title: "A database run in which the suite quietly re-installs the correct code is caught, and never counts as the test noticing"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a database test suite for fn_refresh_due that re-installs every stored
    procedure from the project's database source files each time it starts,
    and the wrong version "drop the retry_due condition" of fn_refresh_due,
  When two wrong-version runs are made —
      D1: the wrong version is put into the test database only, and the
          source file is left as it is,
      D2: the wrong version is put into the source file the suite installs
          from,
  Then for each run the runner checks which definition of fn_refresh_due the
      database held while the tests ran,
    And D1, where the database held the correct definition because the suite
      re-installed it from the unchanged source file, is reported as "invalid:
      the suite put the correct code back before the tests ran", and the wrong
      version is neither caught nor survived by D1,
    And an invalid run leaves the work unfinished until the wrong version has
      had a valid run,
    And D2, where the database held the wrong version while the tests ran, is
      a valid run and its outcome counts,
    And after each run both the source file and the test database hold the
      code as written again.
