title: "The router never auto-commits on a protected branch"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the current git branch is main (a protected branch),
  When the router would otherwise route an entry to a path that auto-commits,
  Then it does NOT perform any commit on main,
  And it parks the affected entry for human handling rather than committing,
  And the same protection applies when the current branch is master,
  And when the current branch is a non-protected working branch, the route is
    allowed to proceed normally.
depends_on: [ACD-1500d]
