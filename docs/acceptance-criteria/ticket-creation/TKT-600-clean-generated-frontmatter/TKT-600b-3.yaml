id: TKT-600b-3
title: "A ticket generated outside an epic keeps its own pull-request phase and cannot finish without it"
component: ticket-creation
components:
  - ticket_creation_pipeline
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical   # owner decision at the approval gate, 2026-09-01
roadmap_phase: phase_1
criteria: |
  Given an acceptance criterion whose generated ticket will be written to a standalone
    location outside any epic folder,
  And the drive dispatches the pull-request phase for a ticket in that location, because
    no epic-level pull request covers it,
  When the ticket is generated,
  Then the pull-request agent's entry in the record reads "required",
  And the pull-request agent has a row in the ticket's sign-off checklist,
  And no phase is marked excluded that the drive would dispatch for that location,
  And driving that ticket dispatches the pull-request phase and records its sign-off,
  And the ticket cannot be recorded complete while that phase is still outstanding.

  Given a change that makes the record mark the pull-request phase excluded for every
    location,
  When a standalone ticket is generated and driven,
  Then that is a failure of this criterion, observable as a standalone ticket reaching
    done with no pull request opened for it.
depends_on: [TKT-600b]
doc_links:
