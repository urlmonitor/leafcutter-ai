criteria: |
  Given the onboarding wizard is running its hook configuration step
  And the diff-cover binary IS detected on the system PATH
  When the wizard reaches the diff-coverage hook configuration prompt
  Then it asks the user whether to enable the diff coverage check
  And if the user accepts, it sets diff_coverage.enabled to true in
    the project's commit_guardian.json
  And if the user declines, it leaves diff_coverage.enabled as false
  And it does NOT prompt for min_coverage_percent or compare_branch
    (uses the defaults: 80% and origin/main)

  ---

  Given the onboarding wizard is running its hook configuration step
  And the diff-cover binary is NOT detected on the system PATH
  When the wizard reaches the diff-coverage hook configuration step
  Then it silently skips the prompt entirely
  And it adds "diff-cover (test coverage gating)" to the post-onboard
    checklist of optional tools the user can install later
