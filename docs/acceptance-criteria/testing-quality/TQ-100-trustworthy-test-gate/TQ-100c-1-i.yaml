it_requirements:
  - "Must prove the asymmetry: a not-done link can soften a test (run 1 informational), but removing the link can only ever HARDEN it (run 2 enforced) — there is no test-file edit that silences a test by dropping its link."
  - "Drive the two runs by editing ONLY the test's `# covers:` tag (present -> removed); the AC store is unchanged between runs."
