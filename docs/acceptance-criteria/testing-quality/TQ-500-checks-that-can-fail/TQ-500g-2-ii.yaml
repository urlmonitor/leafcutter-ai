roadmap_phase: phase_1
criteria: |
  Given a gate fix whose guarding tests are two database tests, DB1 and DB2,
    whose entries name must_catch ["drop the retry_due condition"],
    and the database test writer's hand-off names "treat a NULL retry_due as
    true" as a wrong version to run later,
  When the wrong-version runs are made for that fix in three projects —
      P1: the test database setting names a reachable database,
      P2: the test database setting is not set,
      P3: the test database setting names a database that cannot be reached,
  Then in P1, DB1 and DB2 are run against "drop the retry_due condition",
      against "the fix undone" and against "treat a NULL retry_due as true",
      on the database the setting names and on no other,
    And in P1 "treat a NULL retry_due as true" is reported with its own
      outcome for DB1 and DB2, like the wrong versions the requirement named,
    And when "treat a NULL retry_due as true" survives DB1 or DB2, that is
      reported by name and does not by itself stop the work, while a survivor
      of "drop the retry_due condition" does,
    And in P2 the database runs are reported as not run for want of
      configuration, naming testing_context.db_connection_test — never as
      caught, never as passed — and the work stays unfinished,
    And in P3 the database runs are reported as not run because the
      configured database could not be reached, and the work stays unfinished,
    And in no project does any run connect to an address the runner chose
      itself.
