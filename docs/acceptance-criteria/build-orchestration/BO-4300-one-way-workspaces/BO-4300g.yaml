documentation_rationale: >-
  Clearing a workspace by hand, including authorising the loss of unsent work, is already
  documented under BO-4300e's how-to trigger (BO-4300e-5). This family changes who may ask
  for a removal (the dispatching workflow), not the user-facing steps.
change_target: pipeline
risk_surface: safety
notes: |
  ORIGIN: user request via /plan-feature, 2026-10-23, against
  KI-BO-20260921 (fast-lane workspace agent acts on leaked conversation).

  Created by a Pattern C split (user decision, 2026-10-24): BO-4300e reached eight L2s and
  check-ac-tree-limits caps an L1 at five, so the three caller-authorization L2s were moved
  here and renumbered BO-4300g-1..3. BO-4300e keeps its original five.

  Relationship to BO-4300e: BO-4300e says clearing never loses unsent work (the Q8 one-time
  discard token, BO-4300e-3) and that finalize's teardown asks no interactive question
  (BO-4300e-2). This family adds a separate, earlier guard -- may this agent remove at all --
  and never widens the discard token (BO-4300g-1-iii). Hence depends_on BO-4300e.

