notes: |
  Backfill of shipped behavior. Complements UXP-602 (nodes off by default): this is the opt-in
  that turns them back on. The "no role/identity system" clause is deliberate — persistence is a
  plain client view preference. Persistence across reload is captured in child UXP-605a.
  IT-PO enrichment (2026-08-11): implemented_by verified (toggle + handleToggleShowAcNodes +
  localStorage 'flows:showAcNodes' in ExplorerInner; showAcNodes gate in buildFlowGraph).
  RECONCILIATION (2026-08-11): work_status flipped in_progress -> done. Test-backed by two
  passing vitest tests tagged `// covers: UXP-605` (show_acs_toggle_defaults_off,
  show_acs_toggle_on_renders_wired_ac_nodes in flow-nodes.decisions.test.tsx), appended to
