id: TQ-200a-3-i
components:
  - testing_quality
title: "Golden cases are reverse-engineered from the gold artifacts and guard against regression"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the hand-walked gold artifacts in the product-truth store are the eval
    oracle,
  When a golden case is authored for an agent,
  Then its input and expected outcome are reverse-engineered from a gold artifact
    the agent must be able to reproduce,
  And scoring a golden case asserts the agent reproduces an artifact of at least
    the shape and quality of the gold reference,
  And a golden case that once passed and later fails is treated as a regression.
depends_on:
  - TQ-200a-3
