notes: |
  Emitting the record is necessary but not sufficient. A `skipped` entry that any
  downstream roll-up folds into "all gates green" reproduces the original defect one
  layer up — the artifact exists but still reads as a pass. This AC is the consumer
  side of BO-2900f-1's producer side, and it is the clause that makes the L1 title
  literally true.

  Testable discriminator for the implementer: two runs whose only difference is that
  one gate passed versus was skipped must produce summaries that differ observably.
  If they do not, the guarantee has not landed regardless of what the record file
  contains.

  RESOLVED 2026-08-13 — DOES A SKIPPED GATE BLOCK? YES. The earlier draft said this
  was "deliberately NOT specified", while the criteria simultaneously required the
  pass-requirement to be reported UNMET; against the signoff skill's done rule —
  done-eligible iff every entry is in `{not_needed, signed_off}` — an implementer
  could not tell whether an UNMET requirement stops the work item or merely
  annotates it. The answer is that it stops it: `skipped` is in neither member of
  the done-eligible set, so a requested gate recorded as skipped leaves the work
  item not done, and the ONLY ways out are running the gate to a pass or an
  explicit re-classification (the supervisor's `not_needed` path, which requires
  user approval). The skip can never clear itself. Per-gate policy still governs
  WHETHER a gate carries a pass-requirement at all — that stays with the gate's own
  requirement — but once it does, this AC fixes the consequence.

  2026-08-14 (IT PO enrichment). Three things the enrichment fixes that the
  criteria leave to the implementer:

  - A FOURTH OUTCOME GROUP. The criteria contrast `passed` with `skipped`, but
    BO-2900f-2-i introduces a third non-passing state — a gate the run never
    reached. Merging it into `skipped` would attribute a configuration cause to a
    run-termination event and would send the reader to change a setting that is
    not the problem. The roll-up therefore partitions into four groups, and only
    `passed` may be counted as passing.
  - THE LOAD-BEARING ENFORCEMENT POINT IS THE HOOK, NOT THE SKILL. The done rule
    appears twice: mechanically in scripts/commit_guardian/_signoff_parity_checks.py
    and in prose in templates/skills/signoff/SKILL.md. Only the first blocks. Both
    must be updated, and the commit should say which one is the gate.
  - SELF-CLEARING IS THE ATTRACTIVE WRONG IMPLEMENTATION. Inferring not_needed
    from the fact that the disabling config is off is a small, reasonable-looking
    change that reverses the AC entirely. It is called out as a constraint and
    tested negatively with a repeated assessment, because it is the only failure
    here that passes every positive test.

  WHY THIS AC IS THE ONE THE SURFACE DECISION TURNS ON. The done rule already reads
  the work item's own agents map. On the git-tracked ticket surface the record and
  the rule are the same artifact, so the not-done clause is enforced by machinery
  that exists and blocks today. On a JSONL surface they are two artifacts and a new
  consumer has to join them — and the failure mode of that join is that an
  unreadable sink yields the permissive verdict, which is the original defect with
  extra steps. If the JSONL option is chosen, the join must fail closed.
