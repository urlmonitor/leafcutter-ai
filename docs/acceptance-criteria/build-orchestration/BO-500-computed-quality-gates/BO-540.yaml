criteria: |
  Changes to how the system works require design review and docs before implementation.

  When a unit of work is classified as a flow change, the system requires
  architecture review and documentation-first phases before any code is written.
  No one needs to remember to add these agents -- the change-type classification
  triggers them automatically. The coder cannot start until the design is
  reviewed and the documentation captures the intended behavior.
