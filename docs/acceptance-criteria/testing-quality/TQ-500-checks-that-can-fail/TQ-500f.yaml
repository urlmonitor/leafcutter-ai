roadmap_phase: phase_1
criteria: |
  Every guarding test is aimed at a named wrong answer the work could ship.

  A requirement can say which believable mistakes its tests must catch — the fix
  quietly undone, one condition of a check dropped, a new input left empty — and
  that list reaches whoever writes the tests unchanged. The people writing
  ordinary and database tests alike are taught to ask what small wrong change
  would keep their test green, and a test that failed only because the code did
  not exist yet is never accepted as proof that it guards code that already does.
