criteria: |
  Given the target AC (or members of its connected set) have readiness draft or
    reviewed rather than approved,
  When the connected build set is resolved,
  Then those not-done leaves are still included — pointing at the AC is the operator's
    go-ahead, so readiness does not filter the set (unlike the normal ready-batch scan).

  Given every AC in the connected set is already work_status done,
  When the command runs,
  Then it reports "nothing to build" and exits cleanly (no worktree churn, no empty
    PR, non-error).
