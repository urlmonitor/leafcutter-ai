notes: |
  A BUILT-IN FALLBACK IS HOW THE SINGLE SOURCE OF TRUTH STOPS BEING ONE. It is the
  helpful-looking default that quietly makes TQ-600c-3's second clause untestable in
  production: the record can be deleted, moved or emptied and the guard carries on
  reporting verdicts against a number nobody agreed to, with no signal that the
  record it was supposed to read is gone. The failure this prevents is not the
  guard crashing — it is the guard continuing.

  THE LAST CLAUSE IS THE STRICT ONE AND IT IS INTENTIONAL. A bare number with no
  baseline, no date and no headroom beside it cannot be checked, defended or
  revised by anyone who was not present when it was chosen — which, six months out,
  is everybody. Refusing to act on one is what keeps TQ-600c-3's derivation rule
  from decaying into a magic number over time.

  COMPLEMENTARY TO TQ-600c-2-i, NOT OVERLAPPING. That AC covers a missing or
  unreadable COST record — nothing to measure. This one covers a missing or
  untraceable BUDGET record — nothing to measure against. Both end in a failing
  status, for different reasons, and each must say which.
