title: "related_agent in a behavioral pattern is not constrained to the agent's spawn_allowlist"
component: infrastructure
level: L3
status: active
work_status: todo
criteria: |
  Given an agent template where a behavioral_patterns entry has
    related_agent set to an agent that is NOT in the template's
    spawn_allowlist
    (e.g. python-coder's "Stop-and-Ask" pattern references
     "sql-coder" as the related_agent, but python-coder does not
     spawn sql-coder — it halts and reports that sql-coder is needed)
  When the build system validates the agent template
  Then validation passes without error
  And the related_agent field is not cross-checked against
    spawn_allowlist (because the relationship is "defers to"
    or "reports need for", not "spawns")
  And the card generator renders the related_agent as a
    cross-reference link in the Behavioral Patterns table
    regardless of whether a spawn relationship exists
