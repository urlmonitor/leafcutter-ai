id: GE-117c-1-i
readiness: draft
priority: medium
title: "A new decision-history entry may inherit its enclosing symbol's AC unless it serves a different one"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-117-code-declares-what-it-serves/GE-117c.yaml"
criteria: |
  Given the staged commit adds a new decision-history entry inside a public symbol
  And that symbol already declares an acceptance-criterion reference that resolves
    to a real AC id
  And the new entry carries no acceptance-criterion reference of its own
  When the declaration check evaluates the newly added decision-history entry
  Then the check produces a satisfied verdict for the entry by inheriting the
    enclosing symbol's resolved AC reference

  Given the staged commit adds a new decision-history entry inside a public symbol
    that declares AC "AC-A"
  And the new entry carries its own acceptance-criterion reference "AC-B" that
    resolves to a real AC id different from the enclosing symbol's
  When the declaration check evaluates the newly added decision-history entry
  Then the check produces a satisfied verdict using the entry's own reference "AC-B"

  Given the staged commit adds a new decision-history entry at module level with no
    enclosing symbol
  And the new entry carries no acceptance-criterion reference of its own
  When the declaration check evaluates the newly added decision-history entry
  Then the check produces a missing-declaration verdict, because there is no
    enclosing symbol reference to inherit
depends_on:
  - GE-117c-1
doc_links:
