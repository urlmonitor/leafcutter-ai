id: GE-120h-1
title: "A check the package presents as protecting you is reconciled against the one list that causes it to run, and one that is advertised while nothing runs it is named and refused"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the places a reader consults to learn that a check protects their work — the
    published index that lists checks and how serious each one is, the settings a
    check's behaviour is read from, the configuration entry that tunes it, and the
    routing that says what is done automatically when it objects,
  And the one list whose entries are what actually cause a check to run when work is
    committed,
  When the reconciliation runs,
  Then the advertisements it examines are obtained by reading each of those places at
    run time, so neither the places consulted nor the checks found advertised on them
    is a set written into the reconciliation itself,
  And every check advertised in at least one of those places that no entry on the
    executing list names is reported by name, together with each place that advertises
    it and the statement that nothing runs it,
  And the run fails,
  And a check that an entry on the executing list names is not reported at all,
  And the run states how many advertisements it reconciled,

  And given one further advertisement is added — one check named in one of those
    places and on no entry of the executing list — and nothing else in the repository
    changes,
  When the reconciliation runs again,
  Then that check is among those reported, and the number of advertisements the run
    states it reconciled is exactly one greater than the number it stated before,
  And the same holds whichever of those places the advertisement is added to, so a
    place that is consulted for one kind of claim and passed over for another cannot
    carry a claim nobody reconciled.

  Coverage note: cover this by executing the reconciliation as a process against a real
  repository and asserting over the set it reports and the counts it states — never
  against a literal list of the names that disagree today, which passes forever and
  catches nothing on the day the next check is advertised (CLAUDE.md, "Gate / Workflow
  ACs — Verify Behaviorally, Not by Grep"). The added-advertisement arm is the decisive
  one: no implementation holding a written-in list of advertising places or of
  advertised names, however that list is spelled, can pass it.
depends_on:
  - GE-120h
