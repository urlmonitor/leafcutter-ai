id: BO-3500d-1-i
components:
  - build_orchestration
  - agent_telemetry
title: "The report reads the backlog once, reports its own cost, and is never produced as a side effect"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a backlog of several thousand requirements,
  When the buildability report is produced,
  Then the backlog is read once for that report, however many requirements the report
    classifies,
  And classifying one more requirement does not cause the backlog to be read again.

  Given the same report,
  When it has been produced,
  Then it states how long it took to produce,
  And that figure is measured by the report rather than asserted, so the cost of the
    report is a number its reader can see.

  Given a build run, a commit, and the project's routine checks,
  When each of them runs,
  Then none of them produces the buildability report as a side effect,
  And none of them waits for it — the cost of the report is never added to the wait
    before a build starts.
depends_on: [BO-3500d-1]
doc_links:
  - path: docs/known-issues/build-orchestration.md
    relationship: related
    status: exists
    relevance: "KI-BO-016 measures the constraint this criterion is written against: one full read of the backlog costs roughly thirty to forty seconds and still scales with total backlog size. The entry's residual is explicit that a single read is now the floor, not that reading is cheap."
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "ASSERT THE NUMBER OF READS, NEVER A DURATION. KI-BO-016's own fix was tested with a parse-count assertion for exactly this reason; a wall-clock bound is flaky by construction and will be quarantined within a month. Instrument the store-open/parse call and assert the count is 1 regardless of how many records the report classifies."
  - "SELF-TIMING IS MEASURED, NOT ASSERTED. Wrap the report's own work in a monotonic clock and emit duration_seconds as a field. The TEST must not assert the value — it asserts the field is present and is a measured number, with the read-count asserted separately. The clause exists because the cost will drift: KI-BO-016's residual says plainly that the single-read floor scales with backlog size."
  - "THE MEASURED FLOOR, FOR SIZING: one full read cost roughly 90 s before BO-2400c-6 and 27-39 s after, over 3,232 records. Affordable: one report, produced when asked, costing one read. NOT affordable and therefore not to be built: the figure computed on every build run, on every commit, on a routine check, or as anything a gate consults — each multiplies a thirty-second cost by the frequency of the thing it hangs off."
  - "NO SIDE-EFFECT PRODUCTION. No build run, no commit hook and no routine check may produce the report or wait for it. Establish this by EXECUTING those paths and asserting the report entry point was never invoked — not by scanning source for the absence of a reference, which proves nothing about behaviour and is the evidence shape this component rejects."
  - "The one-read property must survive the starting-point figure of BO-3500d-3, which is the expensive one: reachability is computed over the graph already in hand, never by resolving each starting point."
  - "NO PRESENCE-ONLY ASSERTIONS. Every test instruments and counts, or executes a path and checks a call was not made."
