notes: |
  ONE AC BECAUSE IT IS ONE DELIVERABLE. This is a single retrospective pass over frozen
  history producing one static report — a reviewer reproduced the whole of the original
  five-AC a-series in about ninety lines on the first attempt. Splitting the read, the
  shape classification, the tolerance rules and the summary across four ACs added AC
  boundaries without adding testable behaviour, so they were collapsed here. Every clause
  of BO-2800a-2, -3 and -4 survives; only their file boundaries were dropped.

  MEASURED YIELD, and it is far thinner than the original tree assumed. Roughly 2,741 to
  2,812 completion_manifest blocks parse cleanly across the corpus, but the population is
  overwhelmingly positive: on the order of 9,400 true-valued items against roughly 113
  nested-false, 56 bare-false and 66 ok-with-false occurrences. This is frozen history —
  the figures do not grow. Size the implementation to that reality, not to the block count.

  THREE ITEM SHAPES WERE SPECIFIED; THERE ARE FOUR. About 272 of 9,844 items (2.8%) carry
  a non-boolean value — see `medium_confidence_findings: 1` and `suppressed_low_findings: 0`
  in tickets/99_done/EPIC-BOPhantomDoneRemediation/04_bo400_donefolder_parity.md around
  lines 150-151. The original enumeration (absent / bare-false / well-formed) left these
  as neither true nor false, so they silently shrank the denominator. They now have their
  own figure and are named in the denominator.

  A FALSE VALUE IS NOT A CAUGHT DEFECT, and conflating them would have produced exactly
  the false precision this goal exists to eliminate. Three unrelated things share the
  value: an item whose name is negatively polarised, where false is the GOOD outcome
  (`high_confidence_blockers_found: false`, `escalation_triggered: false`,
  `high_findings: false`); an intentional test-first red baseline (see
  tickets/TICKET-20260715-BuildPipelineAuditFindings.md around line 176); and a genuine
  failure. Item polarity is not declared anywhere in the corpus and cannot be inferred
  from the name, so this AC requires the tally to state that polarity is undetermined
  rather than guess. Determining polarity per item name is a separate, later question.

  NO PER-ITEM-NAME TABLE. The corpus carries roughly 3,902 distinct manifest item names
  across about 10,051 items, of which some 3,205 appear exactly once, and about 95.4% of
  all values are true. A per-item-name breakdown of that distribution is a table of
  singletons — noise, not measurement. Per-agent figures (22 agents) are the useful cut
  and are what this AC requires.

  Retrospective only: the manifest format is the INPUT to this AC, never the deliverable.
  The record shape produced here is the baseline that BO-2800b extends with identity and
  category; b must not invent a parallel format.
