notes: |
  UXP-513 and UXP-514 (2026-10-12..14) committed on their branches and failed at push with
  403 "Permission denied" under the environment token; both were pushed by hand with the
  stored login. The third scenario carries the portability rule from the 2026-09-25 known
  issue (no account name shipped in the lane), so the fix is not a second hard-coded
  account switch. The existing parent clause about a REST fallback when the CLI path is
  blocked is untouched: it must use the same credential.
