  - name: test_genuine_completion_with_every_phase_signed_off_is_still_recorded_done
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "CONTROL. Every required phase signed_off in frontmatter with a passing entry, nothing skipped; assert recorded done. Catches a fix that stops writing done altogether."
  - name: test_both_drivers_reach_the_same_decision
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "Run the failed-frontmatter and cross_agent-skip scenarios against build-feature.js and build-ticket.js as they exist on disk; assert identical decisions."
test_rationale: |
  The defect is a disagreement between two pieces of evidence in the same record,
  resolved the wrong way. A test must therefore present both pieces at once: the
  failure signal (frontmatter failed, or this drive's cross_agent skip)
  and a passing entry that contradicts it. A test with only a blocker entry passes
  on the current code, which is how BO-400a-2-iii was closed with this case open.

  The control is load-bearing: refusing every completion satisfies every negative
  test. The twin test exists because both drivers must decide identically and the
  obligation is otherwise carried by a comment.
