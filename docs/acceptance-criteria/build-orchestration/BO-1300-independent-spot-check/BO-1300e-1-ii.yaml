id: BO-1300e-1-ii
readiness: approved
priority: high
title: "Duplicate findings across reviewers are deduplicated to one ticket per distinct issue"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-independent-spot-check/BO-1300e.yaml"
criteria: |
  Given two or three reviewers independently reported what is the same underlying problem
    with the feature (for example, the same broken seam surfaced from both the integration
    angle and the usability angle)
  When the spot-check pass records the findings as tracked work
  Then it writes exactly one ticket for that distinct issue, not one ticket per reviewer
  And the single ticket notes that the issue was surfaced by more than one reviewer angle
  And genuinely different findings still each get their own ticket (deduplication merges only
    findings that describe the same underlying problem)
