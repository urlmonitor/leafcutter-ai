  agent: approve_acs
  date: '2026-10-01'
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  THE PARTIAL CASE IS THE ONE THE MEASUREMENT COULD NOT SHOW. Today both
  undelivered preparations fail for all 60 agents at once, so per-agent
  granularity makes no observable difference to the current tree. It makes the
  difference on the tree that exists the day after the repair, when delivery is
  conditional on something per-agent -- a declaration, a flag -- and the
  condition is mis-evaluated for a subset.

  ONE SAMPLE IS HOW A CHECK GETS CHEAP. The cheapest implementation of
  AR-300b-1 confirms each kind of preparation landed somewhere. That
  implementation reports clean on a tree where 59 of 60 agents received
  nothing.
