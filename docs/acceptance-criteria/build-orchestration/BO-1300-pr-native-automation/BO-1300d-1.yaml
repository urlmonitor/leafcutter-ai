it_requirements:
  - "This is an end-to-end verification that exercises the integrated PR-native path (commit -> push working branch -> open/update PR -> green-check gate -> PR merge) with branch protection enabled. The exercising surface is the finalize-feature.js / building-epics flow plus the BO-1300b-1/b-2 merge-gate helper — python-coder owns wiring the verification."
  - "Must run with 'require a pull request before merging' actually enabled on the target branch (or a faithful test fixture / sandbox repo) — verifying behavior with protection OFF does not satisfy this AC."
  - "Must assert the two negatives: zero direct pushes to the default branch occurred during the run, and the branch rule was never disabled/bypassed (no --admin, no protection toggle)."
  - "Must depend on the prior families being in place (a/b/c); do not stub the gate. Reuse FIN-100's post-merge test gate rather than re-spec'ing it."
  - "Prefer a repeatable harness over a one-off manual run so it can be re-verified (per the user convention that post-epic spot-checks run via agents)."
