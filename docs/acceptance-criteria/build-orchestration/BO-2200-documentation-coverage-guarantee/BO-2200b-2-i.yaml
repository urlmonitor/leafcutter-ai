it_requirements: |
  Extend the documentation-verifier template instructions so the agent evaluates EACH
  required doc independently and fails if ANY is missing, reporting precisely which ones.
  One satisfied doc must not mask an unsatisfied sibling. This is template-prompt
  hardening of the diff-presence behavior authored in BO-2200b-2.
