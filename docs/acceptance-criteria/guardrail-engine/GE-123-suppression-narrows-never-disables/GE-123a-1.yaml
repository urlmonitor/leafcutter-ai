assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: "A per-file scan in which filename recognition contributes a finding without terminating the content scan, so that every downstream AC in this tree can assume an env-named file has more than one suppressible finding."
expects_from: null
it_requirements:
  - "The canonical edited source is templates/skills/security-scanner/scripts/scan_secrets.py per ADR-001. The deployed copies are build.py outputs and must never be edited directly; verify source-to-deployed parity with a build.py round-trip before sign-off."
  - "templates/skills/security-scanner/SKILL.md must be updated in the same change. Its Secrets Detection Rules table presents the rules as applied in order and says nothing about the filename rule ending the scan, so after this change the skill body must state that a filename match ADDS a finding and the content rules still run."
  - "Every arm must be exercised through the multi-file entry point scan_files, with real files written into a tempfile-backed directory. Coverage of the per-file scan called directly, or of the filename-matching logic in isolation, does not discharge any arm of this criterion."
  - "Exit-status arms must run the scanner's CLI entry point in a fresh subprocess with the fixture directory as the working directory, and must assert the process exit code. A returned list of findings is not an exit status."
  - "Test fixtures must assemble every credential-shaped string at runtime from concatenated fragments rather than writing it as a source literal. unit_tests/commit_guardian/test_scan_secrets_suppression.py already does this deliberately so that no PRIVATE_KEY or AWS_KEY suppression is needed anywhere in this repository. Do not collapse the fragments back into literals, and do not add an allowlist entry so that literals can be committed — suppressing the two highest-signal detectors on a real source file would create a genuine blind spot in exactly the file most likely to accumulate credential-shaped fixture data."
  - "Each of the four content-rule lines in a fixture must produce exactly one finding. Verify the chosen values do not cross-trigger a second rule: a token shorter than twenty characters cannot reach the entropy threshold, and the quoted value on the password line must stay long enough for the keyword rule while staying short enough to avoid the entropy rule."
  - "The module under test must be loaded from the canonical templates/ path via importlib.util.spec_from_file_location, never from a deployed copy, which can be stale."
  - "No test may write a .security-allowlist to any real project root. Allowlist fixtures live only inside tempfile-backed directories."
  - "Fixture files must not be placed under tickets/, docs/retrospectives/, docs/acceptance-criteria/ or templates/skills/. The pre-commit consumer check_secrets.py post-filters entropy findings for those path prefixes, so a fixture under one of them would measure the exemption rather than the scanner."
  - "The set of filename forms the sensitive-filename rule recognises must not change as a side effect of this work. Any narrowing is a regression, and it is guarded by GE-123a-3."
  - "Content-scan results for ordinary source files must not regress. The existing end-to-end arm in unit_tests/commit_guardian/test_scan_secrets_suppression.py that asserts four findings on an ordinary .py fixture must stay green."
test_spec:
  - name: test_env_named_file_reports_filename_finding_plus_four_content_findings
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Through scan_files over a real on-disk env-named fixture carrying the four recognised lines, exactly five findings are returned for that file — the filename rule plus one finding per content rule — all present in the same returned result."
  - name: test_env_named_and_ordinary_file_report_the_same_content_findings
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "An env-named fixture and an ordinary .py fixture holding byte-identical content are scanned in one scan_files call; the set of content-rule ids reported is equal for both files and the only difference is the extra filename finding on the env-named one."
  - name: test_cli_exit_status_reports_findings_for_the_two_file_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: e2e
    angle: reachability
    description: "The scanner CLI, run in a fresh subprocess with the fixture directory as its working directory, exits non-zero over the same two fixtures and its report accounts for nine findings across the two files."
test_rationale: "The verification standard for this whole tree is the reason for the shape of this contract. A sibling audit in the GE-113c-3 family found two criteria that passed unit-level tests while describing situations the real entry point can never produce — precisely because the per-file scan short-circuits env-named paths. Every descriptor here therefore drives scan_files (or the CLI above it) against real files on disk; none calls the per-file scan or the filename matcher directly, and a suite that did would not discharge this criterion however green it ran. RED-VS-GREEN HONESTY, so a later TDD-order check does not misread the baseline: test_env_named_file_reports_filename_finding_plus_four_content_findings and test_env_named_and_ordinary_file_report_the_same_content_findings are RED today (an env-named file currently yields one finding, never five, and reports zero content findings). test_cli_exit_status_reports_findings_for_the_two_file_run is SPLIT — its nine-findings assertion is RED today (the current run produces five), but its exit-code assertion alone is GREEN on arrival, because the ordinary .py file already produces four findings and so the run already exits non-zero. Assert both halves; do not cite the exit code alone as evidence the fix landed. The second descriptor is the negative control that stops the first from being satisfied by inflating findings on env-named files specifically: it pins the two files to the SAME content-rule set, so the only permitted difference is the filename finding."
