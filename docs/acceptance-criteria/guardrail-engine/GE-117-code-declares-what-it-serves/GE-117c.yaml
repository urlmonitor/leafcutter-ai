notes: |
  PO authoring note (for the BA). This L1 EXTENDS the existing DECISION HISTORY
  tail-tag mechanism (which already carries a ticket reference) to ALSO carry an
  AC reference on every NEW entry. Scope is diff-only and NEW entries only:
  pre-existing decision-history entries are never retrofitted (this is the core
  of the tail-tag convention — only entries added in the diff are checked). The
  AC reference must resolve to a real AC id. Do NOT respecify the existing
  ticket-tag format or ticket traceability — that already exists; this adds the
  AC dimension on top. Enforcement action lives in GE-117d.
  Open question for BA/IT-PO: whether a new entry may satisfy this via the same
  AC named on the enclosing function/class, or must carry its own explicit
  reference — do not assume; decide at L2.
  documentation_triggers [how-to] — authors need the updated tail-tag format
  guidance (ticket + AC).
