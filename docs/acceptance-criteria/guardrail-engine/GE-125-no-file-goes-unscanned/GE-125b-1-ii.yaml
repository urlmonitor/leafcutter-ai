notes: |
  THIS IS AN INVARIANCE FENCE, NOT A NEW BEHAVIOUR, and it is deliberately
  written as a before-and-after claim about THIS change rather than as an
  absolute claim about the end state. KI-SEC-001 records the scope of the
  existing exemption precisely: it gates the shapeless-value rule only, while the
  fixed-prefix rules, the exchange-key rule and the keyword-based rule all still
  fire at these paths. This criterion pins that scope across the repair, so the
  repair cannot quietly become a widening or a narrowing of which rules the
  entitlement covers.

  IT IS ALSO THE FENCE WITH GE-123d-4-i, WRITTEN FROM THIS SIDE. GE-123d-4-i's
  own contract carries the mirror of this: it requires that its work leave the
  existing shapeless-value exemption unchanged at the same path. This record
  requires that this work leave the keyword-based rule's verdict unchanged at the
  same path. The two records therefore agree at their boundary and neither one
  crosses it.

  READ THE FIRST ARM CORRECTLY. It says the keyword-based rule's verdict is the
  same before and after THIS change. It does not say that verdict is permanent.
  GE-123d proposes to change exactly that verdict for exactly these locations,
  and that proposal is out of scope here and is not contradicted here. If it
  lands, this criterion is re-baselined against the behaviour of the day, not
  cited as an objection to it. Neither record closes the other; neither may be
  recorded as a duplicate of the other; and no depends_on edge into the GE-123
  tree may be added from here.

  FIXTURE PLACEMENT, STATED AND JUSTIFIED. Both files sit at listed locations on
  purpose — an invariance claim about listed locations is unmeasurable anywhere
  else. Real files in a throwaway git repository, staged and driven through the
  pre-commit secrets check. Every credential-shaped line, including the four in
  the first arm, must be assembled at runtime from fragments: this fixture
  carries a private-key header and a cloud-access-key shape, and writing either
  as a source literal would force an allowlist entry that suppresses the two
  highest-signal detectors on a real file in this repository.

  ONE ARM IS GREEN ON ARRIVAL AND MUST NOT BE CITED AS EVIDENCE THE FIX LANDED.
  The first arm passes today, before any change — that is what makes it a
  characterisation fence. Only the second arm's fifth finding is red today.
