notes: |
  Durability means the pause outlives the workflow process; resume happens via
  the harness resumeFromRunId replay which preserves committed prior stages, with
  the record persisted/read via an agent() dispatch (the E2 body has no fs
  access). This is the reliability backbone for "come back minutes or hours later".
