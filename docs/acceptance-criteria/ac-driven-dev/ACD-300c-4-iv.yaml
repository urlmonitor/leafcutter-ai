id: ACD-300c-4-iv
components:
  - ac_driven_dev
  - ac_store
readiness: reviewed
priority: medium
title: "The scripted authoring workflow approves only through the approval step and only what the hold report releases"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the scripted AC-authoring workflow (the Python driver that dispatches the product
    owner, business analyst and technical planner) reaches its approval with the records
    ACD-9990a-1 and ACD-9990a-2,
    and the approval-hold report returns ACD-9990a-2 as held with the reason
    "test design pending",
  When that workflow approves,
  Then ACD-9990a-1 reads readiness "approved" and has gained one approval entry in amended_by,
  And ACD-9990a-2 still reads readiness "reviewed",
  And the value "approved" reaches a record's readiness only through the store's one
    approval step, so this workflow writes no readiness value of its own,
  And its result lists ACD-9990a-2 as held with the reason "test design pending".
depends_on:
  - ACD-300c-4
doc_links:
  - path: docs/acceptance-criteria/ac-driven-dev/ACD-300c-4.yaml
    relationship: parent
    status: exists
  - path: docs/acceptance-criteria/ac-driven-dev/ACD-1405.yaml
    relationship: related
    status: exists
    relevance: Names the scripted authoring workflow and the agents it dispatches.
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- scripts/ac_store/create_ac_workflow.py calls the store's approval step (ACD-300c-4's id-list mode) instead
  of writing readiness. Its result carries the step's held list unchanged; the reason is a HOLD_REASONS
  member, and 'test design pending' is the exact spelling.
- No code path in the scripted workflow writes a readiness value itself.
declared_files:
- path: scripts/ac_store/create_ac_workflow.py
  state: existing
delivers_to: null
expects_from:
  ac_id: ACD-300c-4
  contract: 'scripts/ac_store/approve_acs.py gains an id-list mode and a priority option: given ids [str]
    and priority (critical|high|medium|low) it writes, for each id it does not hold, readiness approved,
    that priority and one appended amended_by approval entry, as one field-targeted write per record followed
    by a read-back. --json prints {approved: [id], held: [{id, file, reason}]} (reason in HOLD_REASONS),
    plus an additive already_approved: [id] list; --dry-run --json prints the same report without writing.
    Exit is non-zero when any written record fails read-back, and that record is restored to its pre-write
    bytes.'
test_intent:
- clause: ACD-9990a-1 reads readiness "approved" and has gained one approval entry in amended_by
  needs_test: true
  reason: The released record must be approved, with its audit entry, through the step.
- clause: ACD-9990a-2 still reads readiness "reviewed"
  needs_test: true
  reason: The held record must stay reviewed, which today's direct write ignores.
- clause: the value "approved" reaches a record's readiness only through the store's one approval step,
    so this workflow writes no readiness value of its own
  needs_test: true
  reason: A single path to approved is the invariant, and a leftover direct write would bypass every hold.
- clause: its result lists ACD-9990a-2 as held with the reason "test design pending"
  needs_test: true
  reason: The result's held list is what the caller acts on, and its reason must come through unchanged.
origin_agent: business-analyst
