criteria: |
  Every agent's capabilities, relationships, and knowledge sources are
  discoverable without reading source code.

  Contributors, operators, and peer agents can look up any agent and
  immediately see its inputs, outputs, spawn relationships, knowledge
  channels, and category — assembled automatically from template metadata
  during the build. No manual doc maintenance required.
