notes: |
  PROMPT-ONLY — NO DETERMINISTIC TEST IS POSSIBLE. The deliverable is
  instruction text in two agent templates. The reports it produces are
  observable, and an eval over the incident-1 Given can judge them, but no unit
  test can show an LLM asked the questions well. A unit test asserting the
  questions appear in the template text is the forbidden text-search proof.
  IT-PO: state this in test_rationale; if an eval harness exists for agent
  prompts (TQ-200), route the incident-1 case there.

  RELATION TO TQ-500a. The wrong version the writer names under Q1 is the
  natural candidate for TQ-500a's deliberate alteration. This AC does not add a
  second record: the report lists it; the falsifiability answer (TQ-500a-1)
  remains the one machine-checkable record.

  RELATION TO TQ-500g. Nothing here runs the named wrong versions against
  finished code. The writer's answers are reasoning at writing time; the runs
  that decide are TQ-500g's.

  SINGLE AGENT, TWO TEMPLATES. Both edits are llm-expert prompt work with the
  same content; kept as one AC so the two writers cannot drift apart.
