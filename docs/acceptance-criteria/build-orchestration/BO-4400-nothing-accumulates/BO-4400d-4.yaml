id: BO-4400d-4
title: "How-to: previewing, running and reading the routine sweep, and changing its interval"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: docs
risk_surface: internal
declares_side_effect: true
criteria: |
  Given the routine sweep (BO-4400d-1, BO-4400d-2, BO-4400d-3) is in place,
  When a person reads the how-to guide for the routine sweep,
  Then the guide shows the command to run a preview and the command to run a real
    sweep, each with an example report naming the count per kind and the bytes freed,
  And the guide lists every reason an item is kept -- for a workspace, the landed-work
    pass's reasons (not yet on the main line, holds unsent work, no work of its own yet, in
    use, landing could not be confirmed, shared project unreachable), and for scratch, not
    yet expired -- and what the person can do about each,
  And the guide states that a workspace with no work of its own is cleared once no file in
    it has changed for 7 days, and that one whose work is pushed but never merged is
    cleared once it holds nothing unsent and no file in it has changed for 14 days, its
    work staying on its line on the shared project,
  And the guide states where the sweep's durable report log is written,
  And the guide shows the setting that controls the interval between automatic sweeps
    and its default of 24 hours.
depends_on: [BO-4400d, BO-4400d-1, BO-4400d-2, BO-4400d-3, BO-4400g-2-v]
