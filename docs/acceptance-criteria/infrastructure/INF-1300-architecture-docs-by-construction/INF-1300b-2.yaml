it_requirements:
  - "THERE IS NO CANONICAL LEGEND TO REPRODUCE AND NONE MAY BE INVENTED AS ONE. Verified in this worktree: ADR-015 is ADR-015-guard-honors-noqa-ble001.md, about honouring an inline suppression of an exception-handling rule, and no ADR in the directory defines a diagram key. The corpus carries three unrelated shapes under `## Legend` — a C4 element key, a flowchart shape key, and per-diagram edge-trust tables. Any implementation that emits one fixed block, from any source, is wrong on the merits and not merely unsourced: a key correct above a C4 component picture is simply wrong above a flowchart. Do not author a 'canonical legend' file as a way of making a verbatim rule implementable."
  - "THE KEY IS DERIVED FROM THE NOTATION THE EMITTED SKELETON ACTUALLY USES, per kind, at run time. The correspondence must be exact in both directions: one entry for each notation element the skeleton uses, and no entry for notation it does not. That bidirectionality is what prevents the derivation degrading into a per-kind constant that happens to be right today and drifts the moment a skeleton changes."
  - "GENERAL MEANING IS PRODUCED; PER-ELEMENT MEANING IS AUTHORED. Each entry states what that element of the notation means for any document of that kind — what a boundary encloses, what an arrow asserts, what a lifeline stands for. No entry may name an identifier that appears only in this document's own skeleton body; that is content the author supplies, and INF-1300b-3 owns marking the place where they supply it."
  - "NO PRODUCED TEXT, AND NO INSTRUCTION SHIPPED ALONGSIDE IT, MAY ATTRIBUTE THE KEY TO A SOURCE THAT DOES NOT DEFINE ONE. Concretely: the produced document must not cite ADR-015 for the key. Retiring the same false attribution from the two authoring surfaces is INF-1300b-4's, and the two must land in the same change — correcting the instruction without building the derivation leaves an accurate description of nothing, and building the derivation without correcting the instruction leaves the next author reading that the key comes from a document about exception handling."
  - "THE DERIVATION MUST BE OBSERVABLE AS A DERIVATION, NOT INFERRED FROM READING THE CODE. A producer holding one hard-written block per kind and a producer deriving each key from the declaration are indistinguishable by inspection. They are distinguished by adding a kind to the declaration and observing the key follow — the same movement construction INF-1300a-3 and INF-1300a-4 use, and the arm INF-1300d-1-i owns in full."
  - "THE KIND SET COMES FROM INF-1300a-4's SINGLE RUN-TIME ENUMERATION, never a list written into this emitter or its tests."
  - "Deterministic: the same kind yields a byte-identical key on every run."
  - "Error handling per the project error-handling policy (CLAUDE.md rules 1-4)."
