roadmap_phase: phase_1
criteria: |
  One command turns an L0 or L1 AC into a complete epic folder with tickets for every leaf AC underneath it.

  When you invoke the command with a goal-level AC ID, the system walks the
  AC tree, collects all leaf-level ACs beneath that goal, generates a ticket
  for each one, and assembles them into a named epic folder ready for the
  supervisor to drive.
