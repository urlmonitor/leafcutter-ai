notes: |
  THIS EXISTS BECAUSE THE CHEAPEST FIX IS BLIND TO IT. The reported defect is only ever
  observed on epic tickets, so a fix and its tests will naturally be written against
  epic tickets. Suppressing the pull-request phase unconditionally passes every such
  test while silently removing the pull request from every standalone ticket the project
  builds — a much larger regression than the blocker it clears, and one that surfaces as
  work quietly never reaching review rather than as a halt.

  IT IS THE MIRROR OF AN ALREADY-DELIVERED CRITERION ON THE DRIVER SIDE. BO-2700a-3 and
  BO-2700a-4 established the same asymmetry for dispatch: the epic call site opts into
  deferral, the single-ticket call site does not, and single-ticket behaviour is
  unchanged. This is that guarantee restated for the generated record, so the two sides
  are protected symmetrically rather than one of them being trusted to stay correct
  while the other moves.

  THE SECOND SCENARIO IS DELIBERATELY WRITTEN AS AN OBSERVABLE OUTCOME, not as a rule
  about the code, so it can be tested by generating and driving rather than by reading
  the change.
