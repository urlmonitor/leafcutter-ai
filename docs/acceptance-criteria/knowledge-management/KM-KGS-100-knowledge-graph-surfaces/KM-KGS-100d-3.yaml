notes: |
  THIS IS NOT THE COMMIT-GUARDIAN DEFECT IN ANOTHER FILE, AND IT MUST NOT BE
  FOLDED INTO IT. The two failures share a cause — one field, two consumers,
  neither told what shape an element takes — and nothing else. The guard's
  failure is a crash: loud, blocking, impossible to miss, and the reason the
  field's shape became a question at all. This failure produces a correct-looking
  map with a relationship missing from it. No exception, no message, no count
  that moves. A reader gets an answer and has no way to tell it is short.

  That asymmetry is the whole reason for two records. The guard's fix is complete
  when the crash stops; this one's is complete when a relationship a document
  declares is a relationship the map contains. An implementer working from one
  merged record will fix the crash — it is the visible half — and the graph will
  stay quietly wrong, which is the failure this repository has recorded most
  often.

  SCOPE, DELIBERATELY NARROWER THAN GE-118d's. GE-118d covers related_docs,
  related_code and architecture_diagrams because validate_paths() reads all three
  from one list. Only related_docs is declared in edge_fields today, so only
  related_docs reaches this consumer. The criterion is therefore phrased against
  "a surface whose configuration declares the field" rather than against a fixed
  field name — per KM-KGS-100c, declaring a new surface or a new edge field is a
  configuration change with no code change, and an implementation that special-
  cases related_docs would break that the first time someone declares
  related_code as an edge field.

  WHY THE BARE-FORM COMPARISON IS IN THE CRITERION. Asserting only "two edges
  exist" passes on an implementation that emits an edge whose target is the
  mapping's label, or its repr, or the whole element. The edge has to be the SAME
  edge the bare form would have produced, or the map gains a node named
  "reference" and the defect changes shape rather than closing.

  INHERITED, NOT RESTATED: KM-KGS-100d-2 already requires every edge to point at
  a node that exists, and KM-KGS-100d-2-i already settles what happens when one
  does not. This record adds edges to the candidate set; it does not touch the
  membership filter those two own, and an implementation that bypasses the filter
  to make a labelled entry's edge survive is satisfying this record by breaking
  its siblings.
