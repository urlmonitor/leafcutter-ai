id: BP-100k-4-ii
components:
  - build_pipeline
title: "A trigger that matches nothing because the project holds no file of that kind is a gate with nothing to do, not a gate that cannot fire — the two are told apart by what a checkout could ever produce, never by what it holds today"
component: build-pipeline
level: L3
status: active
req_status: active
work_status: todo
readiness: approved
priority: critical
roadmap_phase: phase_1
criteria: |
  Given a commit gate is registered with an activation condition that selects
    staged paths by their kind — the shape of the file rather than a location in
    the tree,
  And the project being committed to holds no file of that kind at all, though
    nothing prevents it from holding one,
  When the registry's own reachability check runs,
  Then that gate is not reported unreachable and does not fail the run, because
    a condition nothing currently matches is a gate with no work to do, while an
    unreachable gate is one no checkout of the project could ever activate,
  And the run states which gates it placed in that category and why, so the
    classification can be audited rather than inferred from the absence of a
    complaint,
  And given a second gate in the same registry whose condition names a location
    no checkout of the project can ever produce, or every one of whose named
    locations is excluded from version control,
  When the same run evaluates both gates,
  Then the second gate is still named, still reported unreachable, and still
    fails the run — the distinction narrows what counts as unreachable without
    weakening the verdict for anything that genuinely is,
  And given a project that holds no file of any kind that any registered
    condition selects,
  When a first commit is attempted in that project,
  Then the commit completes, because no registered gate is reported unreachable
    on the ground that the project has not yet acquired the kind of file it
    watches for,
  And given the same registry evaluated in a project that does hold files of
    that kind,
  When the check runs,
  Then the verdict for that gate is the same as it was in the project that held
    none — a well-formed condition's reachability does not move with the file
    census of the day it is evaluated.
