id: DK-300d-3-i
title: "A correction is appended to the older record and changes nothing else in it"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a staged record dec-bcae2c02f17508c1 that supersedes the published record
    dec-dfb0b8d1eb88ec16,
  When publish runs with --correct dec-dfb0b8d1eb88ec16 and a reason,
  Then dec-dfb0b8d1eb88ec16 gains one correction entry holding the correction time, corrected_by
    human:user, the reason, superseded_by dec-bcae2c02f17508c1 and the new selected option
    opt.reuse_at_0_8,
  And its superseded_by list gains dec-bcae2c02f17508c1,
  And every other field of dec-dfb0b8d1eb88ec16 keeps its exact earlier value, and no earlier
    correction entry changes.
depends_on:
  - DK-300d-3
