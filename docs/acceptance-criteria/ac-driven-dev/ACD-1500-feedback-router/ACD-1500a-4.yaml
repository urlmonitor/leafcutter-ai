id: ACD-1500a-4
readiness: approved
priority: medium
title: "Classification of the same entry is deterministic across runs"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given an unresolved feedback entry F1 whose fields do not change between runs,
  When the router classifies and routes F1 on run A,
  And the router classifies and routes the same unchanged F1 on run B,
  Then run A and run B produce the same work type, the same size,
    and the same routing destination for F1,
  And the confidence score recorded for F1 is the same on both runs,
  And no run produces a destination for F1 that a prior run did not, given
    identical input fields.
depends_on: [ACD-1500a, ACD-1500a-2, ACD-1500a-3]
