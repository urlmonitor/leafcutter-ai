notes: |
  This is the policy L1 — one rule, applied across the whole family of checks,
  not a per-check patch. The reference-doc trigger exists because a rule that 18
  checks must obey has to be written down somewhere a future author will find it;
  today the opposite rule (fail open quietly) is the one that is documented.

  SCOPE BOUNDARY the BA must preserve (see GE-119 notes for the full argument):
  this is NOT "never fail open". Fail-open on one bad input while the check still
  ran remains correct and is an approved behaviour elsewhere (GE-116a-1-iii).
  What must stop is reporting SUCCESS for a check that never executed. Whether a
  cannot-run condition also BLOCKS the commit, or only announces itself
  unmissably, is a per-check decision to be made explicitly at L2 — do not
  assume one answer for all 18.

  Known surfaces (illustrative, not exhaustive — the BA should enumerate from
  the manifest rather than from this list): check_ac_parent_covered_by.py
  (observed skipping on a failed helper import), check_ac_schema.py (observed
  degrading to manual field validation when the schema file is unreachable).
