assigned_agent: python-coder
estimated_complexity: M
it_requirements: |
  Check D is the AUTHORITATIVE "does the chain actually fire" proof and the whole
  reason this feature exists: the production silent-skip bug is exactly a config
  that looks installed but runs zero hooks (a fresh worktree with pre-commit
  running under PRE_COMMIT_ALLOW_NO_CONFIG=1). Check D must run the canary via the
  resolved config at the manual stage and assert the token in captured output;
  token absence is a FAIL regardless of A/B/C outcomes (fail closed, per
  BO-1700b-1). Implemented ONLY in the shared probe helper (BO-1700a-1); ADR-001
  deployed/template parity applies.
