notes: |
  THE THREE ARMS ARE ONE CRITERION AND MUST NOT BE SPLIT ACROSS THREE RECORDS. The L1 says
  so and gives the reason: an implementer who is handed only the first arm satisfies it by
  making the build-source copy exit non-zero unconditionally, which passes the test and
  fixes nothing. The comparison is the criterion.

  THIS IS THE ONE PLACE THIS GOAL TAKES A POSITION ON BLOCK VERSUS ANNOUNCE and it does so
  deliberately rather than deferring to a per-check disposition. The build-source copy's
  failure is guaranteed rather than conditional, so passing is correct on none of its runs.
  The component's deliberate fail-open convention covers a check that ran and hit one bad
  input; it has never covered a check-shaped object that can never check.

  THE WORKSPACE IS FULLY BUILT IN THE GIVEN AND THAT IS DELIBERATE. GE-120b-1-i requires a
  cannot-run message to name an unbuilt workspace. That diagnosis is wrong here and would
  send the reader to fix something that is not broken. Running this criterion's first arm
  in a fully built workspace is what makes the two records distinguishable and is why
  neither closes the other. Do not add a dependency edge into the GE-120 tree — its folder
  is byte-frozen by a guard test.

  THE CLASS IS ONE FILE HERE AND STAYS ONE FILE. Only one instance of this shape has been
  observed. GE-126e is what establishes how many build-source copies share it. Do not widen
  this criterion to every build-source copy in anticipation.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

  ------------------------------------------------------------------------------
  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NOW SET AND IS NOT TERMINAL. All three siblings build on the refusal
  outcome this record introduces: GE-126c-2 gives it a message, GE-126c-3 fixes what it is
  keyed to, GE-126c-1-i fences where it may appear. The contract is written as a VALUE
  because that is what the three consume; a contract phrased as "the templates copy
  refuses" would be satisfied by any non-zero exit and would leave the three siblings
  without the third state they each need.

  expects_from IS NULL AND THAT IS A DECISION. Head of the GE-126c chain; consumes nothing
  from another record. Not an unenriched field. DO NOT REFILL.

  BUILD GE-126c-1 AND GE-126c-1-i IN ONE PASS — this is the strongest sequencing advice in
  the branch. The natural implementation of arm one is a guard at the top of the canonical
  file, and the build copies that file verbatim to every enforcing location. Landing arm
  one alone refuses every commit in the repository. The L3 is a child of this record
  precisely so a driver batching by depends_on picks them up together.

  AGENT — python-coder. The change spans templates/ and the build's notion of deployed
  locations, both Python surfaces; no split is warranted.

  NOT AUTHORED HERE: declares_side_effect (derived per BO-2900g-2, see KI-CG-015).
