id: DK-200b-2-i
title: "An exhausted time allowance prevents further discovery and reports the limitation"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: draft
req_status: draft
priority: high
work_status: done
criteria: |
  Given the initial gathering time allowance is exhausted before source searching begins,
  When enrichment considers the sources still awaiting examination,
  Then those sources are not searched,
  And the result reports the exhausted time allowance without claiming those sources were examined.
depends_on: [DK-200b-2]
covered_by:
  - "tests/kernel/enrichment/test_context_enrichment.py::TestContextEnrichmentBoundaries::test_expired_budget_prevents_search_and_reports_what_was_not_examined"
