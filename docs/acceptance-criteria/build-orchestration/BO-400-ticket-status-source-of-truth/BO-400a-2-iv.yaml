assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/workflows-js/build-feature.js
  n_location_rule: "2 -- the ticket-completion decision in build-feature.js and its twin in build-ticket.js, which must stay identical"
  required_skills:
    - python-coder
  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_ticket_done_recording.py"
  constraints:
    - "GUARD THE DECISION, NOT THE ROUTE. A guard placed where the drive notices it has no phases to run only covers the one route that reaches the vacuous decision by that path; the decision itself is reachable from every route, and a second route into it already exists (BO-1900a-4-ii). The refusal must live at the point where completion is decided, so that no caller can reach a done write through an empty required set regardless of how it got there."
    - "AN EMPTY REQUIRED SET IS NOT A SATISFIED ONE. The natural implementation collects the phases that failed to prove themselves and treats an empty collection as success. Over an empty required set that collection is empty for the opposite reason. These two states must be distinguished before the verdict is formed, not repaired afterwards -- an implementation that computes the same verdict and then overrides it is one refactor away from the defect returning."
    - "VERIFY BY EXECUTION, NOT BY GREP. Per CLAUDE.md 'Gate / Workflow ACs -- Verify Behaviorally, Not by Grep', a test that finds the guard in the source passes on a guard that is computed and ignored. Each case must be driven through the real workflow via unit_tests/prompt_assembly/harness_build_ticket_guard.mjs and asserted on the ticket record left on disk and the payload the run returned."
    - "THE HARNESS CANNOT REACH THIS CASE YET. The harness synthesises the ticket's needed phases from the fixture's real frontmatter, so it currently cannot present the drive with an empty required set at all. Extending it to drive a ticket that names no phase is part of this work, not a prerequisite someone else supplies; without that extension every descriptor below is unwritable and the AC would be closed on a test that never exercised the condition."
    - "THE REASON MUST BE ACTIONABLE. The existing not-completed message tells the operator to re-run the outstanding phase or add the sign-off it owes. With no phase at all that instruction names nothing the operator can do, and sends them looking for a phase failure that never happened. The no-phase case needs its own wording, naming the ticket's list of phases as the thing to fix, and that wording must be asserted."
    - "THE ALREADY-SIGNED-OFF TICKET MUST STILL RECORD DONE. BO-400a-2-ii's behaviour is the boundary this refusal must not cross: a non-empty required set whose every phase carries a real sign-off is a genuine completion and must keep writing. A fix that suppresses the write whenever no phase ran during THIS drive breaks every resumed drive."
    - "BOTH TWINS IN ONE CHANGE."
delivers_to: null
