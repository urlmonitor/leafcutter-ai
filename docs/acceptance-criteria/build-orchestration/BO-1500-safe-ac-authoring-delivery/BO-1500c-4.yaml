criteria: |
  Given the reviewed-PR delivery path for AC authoring is implemented,
  When a user wants to understand how their approved requirements reach main,
  Then a how-to guide exists that walks through invoking /create-ac or
    /plan-feature, approving each stage, giving final approval, and following the
    resulting pull request to merge,
  And the guide states that the user does not hand-build a branch or open the PR,
  And the guide explains what happens if they cancel before approval (draft ACs
    remain, no PR) and how to resume.
