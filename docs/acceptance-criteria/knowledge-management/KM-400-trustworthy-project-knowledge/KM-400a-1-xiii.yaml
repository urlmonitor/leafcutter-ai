id: KM-400a-1-xiii
title: Changelog properties preserve historical values and disclose compatibility parsing
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
work_status: done
priority: medium
parent: KM-400a-1
criteria: |
  Given current and legacy changelog entries contain event metadata, Markdown bodies, historical omissions and the three reviewed malformed writer outputs
  When their native fields are exposed in the repository graph
  Then each source entry retains its full repository-relative identity and all authored title, date, time, type, components, summary and description values that are present
  And authored epic, ticket, pr, adrs, diagrams, tickets, commits, breaking, migration_steps, scope, merge_commit, acs, created, last_updated, status and additional fields remain queryable
  And historical type fix, an absent description, a numeric time or commit value, an explicit null and an empty list retain their distinct source meanings without applying current-writer defaults
  And exact original frontmatter and body remain available separately from the parsed fields
  And only an actually failing literal description escape or simple literal migration list receives the reviewed compatibility interpretation, with the original fragment, parse error and named recovery rule retained
  And the two reviewed description failures and one reviewed migration-list failure remain identifiable as compatibility parses, while valid migration mapping values keep their mapping shape
  And malformed shapes outside those narrow recovery rules fail with the affected source and reason instead of dropping entries or guessing content
  And configured and legacy sources remain distinct, overlapping source discovery does not duplicate entries, and source records are not rewritten
depends_on: [KM-400a-1]
