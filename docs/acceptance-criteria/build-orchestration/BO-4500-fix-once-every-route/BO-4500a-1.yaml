notes: |
  MIGRATION RULE (BO-4500 standing rule) applied at the source: the staging rule is taken from the
  HARDENED copy -- commit.md's stage-by-name -- not from the fast lane's add -A or
  precommit-autofix's add -u, which are the weaker siblings here. KI-BO-029's regression test runs
  against this step (BO-4500a-5-i).

  The consolidation spec names the step commit_changes.py; the criteria say "the shared commit step"
  so they do not pin a filename.
