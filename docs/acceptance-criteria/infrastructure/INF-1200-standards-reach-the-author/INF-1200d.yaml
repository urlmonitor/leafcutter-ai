notes: |
  User-authored intent: BrainCandy. Framed by product-owner-v3, 2026-09-09.

  THIS IS THE SECOND AXIS OF THE GRID, AND THE ONE THAT MAKES THE CAPABILITY
  WORTH BUILDING RATHER THAN PATCHING. INF-1200c generalises across
  specialists; this generalises across standards and across time. The user
  asked for their example to work, but the value is that the standard AFTER
  their example works too, without them asking.

  THE FUTURE CASE IS NOT HYPOTHETICAL — MEASURED 2026-09-09. Three standards
  besides the size one are already fully configured with thresholds: one for
  how tangled code may get, a separate one for database code, and one for how
  crowded a folder may become. No specialist anywhere is told any of their
  figures. These are simultaneously the concrete "guardrails we add later" case
  and INF-1200e's silent-gap case, which is why the two records cite the same
  evidence from different sides.

  THE HAZARD THAT WILL BE MISSED: A STANDARD IS NOT ALWAYS A NUMBER. The
  existing standards are thresholds, and a decomposition shaped around
  thresholds will deliver a mechanism that cannot carry a standard expressed as
  a rule, a prohibition or an exclusion. State the obligation over standards
  generally; if enrichment decides to constrain the shape of what can travel,
  that must be an explicit, recorded decision rather than an artefact of the
  first three examples.

  THE ACCEPTANCE SHAPE WITH TEETH. "The standards that exist today all reach
  their audiences" is a snapshot and is satisfied once by hand. What discharges
  this is that a standard which did not exist before reaches its audience
  without anyone having touched the delivery. The falsifying case to keep in
  view is a standard declared and in force whose audience is empty.
