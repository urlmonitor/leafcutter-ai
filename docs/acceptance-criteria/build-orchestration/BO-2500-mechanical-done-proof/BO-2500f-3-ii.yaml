notes: |
  Wave 2. User decision 2026-10-25 (IT PO stage, point 3): a dedicated /inspect
  workflow, independent of plan-feature.js, which is to be replaced. Given an AC
  id and its verification-record inspection draft (statement and inspected
  paths), it computes and shows each file's current blob and the statement and
  asks the person approve or reject. On approve it writes the approval file and
  fills gate_run plus the blobs into the record's verified_by. On reject or an
  unreadable answer it writes nothing.

  This workflow is the ONLY path that creates an approval file with the answer
  "approve" (BO-2500f-3-i). The residual trust is accepted and recorded there: an
  agent with shell access could still write one by hand.

  The slash-command name /inspect is the user's; the IT PO confirms the surface
  and the craft. The record id, statement and paths in the Given are examples.

  Unasked-for clauses, kept deliberately: stop before asking when the draft is
  incomplete or a path is missing (otherwise a person approves fingerprints of
  nothing), and refuse a change_target that rules inspection out (otherwise the
  workflow manufactures an approval the done gate must later refuse).

  Contract for the IT PO to wire both ways (left out of delivers_to so the rule
  check's symmetry family stays clean until BO-2500f-3-i declares the matching
  expects_from): this record delivers to BO-2500f-3-i the approval file
  docs/acceptance-criteria/_inspections/<run_id>.json {run_id, gate_id, answer,
  answered_at, ac_id, inspected: [{path, blob}]} and the completed inspection
  (gate run reference plus fingerprints) on the record.
