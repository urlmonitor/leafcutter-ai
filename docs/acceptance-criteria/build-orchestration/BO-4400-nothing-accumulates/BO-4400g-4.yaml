notes: |
  User request item (3). The five flows are the user's list. BO-4400a-1 already covers the
  single-ticket build, epic build, quick fix, requirements authoring, fast lane and backlog
  build at PR-open time; this record adds ship and finalize, and makes the request carry the
  work's name.

  TIMING CONFLICT (flagged, not resolved -- user decision needed): BO-4400's approved framing
  clears at PR OPEN (pushed counts as sent). The request says clear once MERGED, else leave
  to the landed-work pass. The criteria above are written to hold under BOTH: scenario 1
  uses flows whose PR is merged before return; scenario 2 starts from whatever the door kept
  at flow end. If the user picks "merged", BO-4400a-1's PR-open clause needs amending (and a
  workspace with an open PR becomes a "kept, not yet on main" answer); if "PR open" stands,
  scenario 2 still covers halted or refused cases.

  OUT OF SCOPE: whether a workflow agent is authorized to perform finalize's removal, and how
  finalize step 7 names that authorization, is owned by a separate record family (another
  session). This record only requires that the request names the work and goes through the
  door.
