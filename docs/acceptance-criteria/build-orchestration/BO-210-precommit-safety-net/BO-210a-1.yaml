criteria: |
  Given the pre-commit auto-fix routing config currently contains only an empty
    routes object and does not match the documented schema,
  When the config is reconciled,
  Then the resulting config is a single document containing a defaults section
    (a model and an agent), a commit_review section (an enabled flag, a model, and
    an agent), and a rules list,
  And each rule entry names a hook_id, a category, a model, and an agent,
  And the empty routes object is removed,
  And a reader loading the config finds no fields outside the documented schema.
