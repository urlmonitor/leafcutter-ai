it_requirements: |
  Deterministic assertions: the mockup validates against the mockup schema, renders
  without error, and its bound values resolve to the named mock records (the same
  records the flow's steps reference). The visual judge evaluates the rendered
  screen against the gold mockup for layout/quality per a declared rubric. Both
  gates must pass.
