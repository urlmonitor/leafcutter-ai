it_requirements:
  - >-
    PROMOTION BLOCKER. Reconcile with BO-2400c-1-viii (approved, todo) first. With a
    path hand-off the lane never holds the bundle text, so c-1-viii's lane-side
    comparison against the producer-stated value has to move to the reader. Either
    c-1-viii is amended to allow a reader-side comparison or this record is reshaped.
    Neither is built on top of the other until that is decided.
  - >-
    Mixed surface. The lane and the producing commands are python-coder's work. The
    reply form in the command-step-runner template is llm-expert's. Split it at
    promotion, before a test contract is written.
  - >-
    The limit L is stated once, in one lane-level declaration, and every step reads it
    from there. The hash algorithm is stated by the producing command, and the reader
    rejects an algorithm it does not recognise rather than skipping the check.
  - >-
    Hand-over files live in a run-scoped location inside the workspace that the commit
    and PR steps can never pick up, because the location is excluded mechanically and
    not by instruction. They are removed or left untracked at the end of the run.
  - >-
    A reader's integrity decline uses BO-2400f-5-iii's declined_step form, adding the
    path, the expected hash and the hash it found.
  - >-
    The test contract is deferred until promotion. The record stays draft, and the
    approval gate requires test_spec only on approved records.
