id: TQ-100b-4-iii
components:
  - testing_quality
title: "The tag gate reads a docstring-first test function on every supported Python version without crashing"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a staged test file containing a test function whose first body statement is a
    docstring
  And the check-test-ac-tags hook running on Python 3.14, where `ast.Constant` no
    longer has the removed `.s` alias
  When the hook evaluates the file
  Then it reaches a verdict on that function instead of raising
  And a covers tag the hook already recognises in that position is still recognised
  And the verdict is the same one the hook reaches on Python 3.13
  And the bug symptom ("AttributeError: 'Constant' object has no attribute 's'", exit 1)
    must not occur
