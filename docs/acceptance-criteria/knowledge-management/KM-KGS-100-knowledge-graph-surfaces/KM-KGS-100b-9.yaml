notes: |
  Fail-open safety: the index is never a source of truth, so its absence or
  corruption degrades to slower-not-wrong (live parse), never to an error or a
  stale answer. Reinforces the KM-KGS-100d never-a-dead-end / always-real invariant.
change_target: code
risk_surface: contract_boundary
