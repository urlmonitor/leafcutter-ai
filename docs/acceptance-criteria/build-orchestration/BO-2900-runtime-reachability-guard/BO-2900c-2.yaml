id: BO-2900c-2
components:
  - build_orchestration
  - build_pipeline
title: "Renaming a capability reports every stale caller and the newly uncalled capability as separate findings"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the capability `mark-done` is registered and is invoked by two automation
    scripts,
    And a change renames the registered capability to `finalise` and updates neither
      automation script,
  When both directions of the connection are checked,
  Then each of the two automation scripts is reported for invoking `mark-done`, which
    is no longer registered,
    And `finalise` is separately reported as a registered capability that nothing runs,
    And the two kinds of finding are distinguishable from each other rather than
      merged into one count,
    And when the same change also updates both automation scripts to invoke `finalise`,
      no finding is reported,
    And when the change removes the capability entirely and updates neither script,
      both scripts are still reported and no uncalled-capability finding is produced.
depends_on:
  - BO-2900c
  - BO-2900c-1
