id: TQ-600a-13-iii
components:
  - testing_quality
title: "A red post-merge run raises one post-merge-red notice, a further red run updates it, and a green run closes it — as a notice for people, never as the gate"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the run verdict TQ-600a-13-ii produces for each completed correctness-lane run on
    the main branch — green, red or did-not-complete, with the failing node ids, a link to
    the run's log and the head commit the run tested,
  And the decision that the per-PR hold takes its verdict from the run history and NOT
    from this issue (TQ-600a-13-vi), so this issue is the human-facing notice: it tells
    people what failed, since when, and which commits are suspect, and nothing it does or
    fails to do changes whether a pull request is held,
  And the fact that the repository has never had an issue and the labels this family uses
    do not yet exist, so this is a new surface with no prior convention to inherit,
  When a completed run's verdict is applied to the notice, with the issue service
    replaced by a recording double that serves a stated set of existing issues,
  Then on a red run with no open issue labelled `post-merge-red`, exactly one issue is
    created carrying that label, and the issue returned by the service is checked to
    actually carry the label — an issue created without it is reported as a failed write,
    never accepted silently,
  And the notice's description holds the CURRENT state — every failing node id, the link
    to that run's log, the list of commits merged to the main branch since the last green
    run, and the time the streak began — and that description is rewritten on every
    later red run, so a reader of the description alone sees the latest run,
  And on a red run with one open `post-merge-red` issue, no issue is created, the
    description is rewritten to the new state, and one comment is added recording that
    run, so the history of the streak survives in the comments,
  And on a green run, every open `post-merge-red` issue is closed with a comment linking
    the green run, and no issue is created,
  And on a green run with no open `post-merge-red` issue, the issue service receives no
    write request at all,
  And when two or more open issues carry the label, the lowest-numbered one is the
    canonical notice: a red run updates only that one and closes each of the others as a
    duplicate with a comment pointing at the canonical one,
  And the commit list is every commit reachable from the red run's head commit and not
    reachable from the head commit of the most recent green run, and when no green run is
    on record the notice says so in words rather than showing an empty list,
  And a run that tested any ref other than the main branch, or a cancelled run that a
    newer run superseded, writes nothing to the notice,
  And issues without the `post-merge-red` label, and pull requests carrying it, are never
    read as the notice and never written to,
  And when every write to the notice fails, the run's verdict and the hold it drives are
    unchanged — shown by refusing every write in the double and observing that the run's
    recorded conclusion and TQ-600a-13-vi's verdict for the same run history are what they
    were with the writes accepted.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-ii
