id: BO-2400f-10-i
components:
  - build_orchestration
title: "The release actually releases, on every path that halts after the claim"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: critical
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run has flipped its connected set to in_progress,
  And the run then halts at any point after that — the context bundle is unusable, a
    phase agent returns something other than ok, the red-baseline gate blocks, the
    green-and-coverage gate blocks, the review verdict blocks, the changelog step fails,
    or the commit step fails,
  When the run ends,
  Then every acceptance criterion that run claimed and did not carry through to done is
    back at work_status todo, and that change is persisted in the acceptance-criteria
    store the run claimed in,
  And this holds on every one of the run's halting paths, not only on whichever one was
    exercised first — a lane with one released path and eight stranded ones is
    indistinguishable, from any single run, from a lane that releases.

  Given the release is carried out on the run's behalf by some executor,
  When that executor is asked to perform it,
  Then the request falls inside what that executor will do, so it is never declined as
    a role that is not its own — a release asked of a party that will not perform it
    leaves the acceptance criteria exactly as stranded as asking nobody.

  Given someone wants evidence that the release works,
  When they look for it,
  Then the evidence is the content of a real acceptance-criteria store after a run that
    halted, and the mere presence of a release step in the run is not evidence: that step
    has been present on every halting path throughout the entire period in which no run
    ever released anything.
depends_on: [BO-2400f-10]
