criteria: |
  Given the ac_store_schema.json defines origin_agent as type "string",
  When a new agent type not yet seen in the codebase writes an AC
    (e.g. origin_agent: "business-analyst-v3" or origin_agent: "custom-pipeline"),
  Then check_ac_schema.py accepts the value without error,
  And no code change to the JSON schema is required to support the new agent name,
  And the only constraint is minLength: 1 (empty string is rejected).
