notes: |
  THE STATIC HALF OF "NONE MAY BE WEAKENED" (TQ-500g criteria), added on the
  user's answer to Q1 (2026-10-22). TQ-500g-3-ii sees weakenings a run can see
  (skipped, expected to fail, gone). This AC sees the ones a run cannot: a test
  that still passes but asserts less, compares more loosely, or tolerates more.

  J IS THE CONTROL: adding an assertion, even a loose one, beside the existing
  strict one is strengthening and must pass. A check that stops every changed
  test brings back the blanket ban.

  LISTING DOES NOT EXEMPT. Every changed existing test is compared, listed or
  not; the list's 'strengthened' claim is the thing being checked.

  ACCEPTED STRICTNESS: a behaviour-preserving rewrite that lowers the count
  (for example two asserts merged into assert (a, b) == (1, 2)) also stops the
  work. There is no exemption entry; the writer keeps the assertions as they
  were or hands the test back. Revisit only if it proves noisy.

  NOT SEEN HERE (left to pr-reviewer): a widened expected literal under the same
  operator (== 200 becoming == 2000), a weakened helper or fixture that the test
  calls (fixture edits must be listed under TQ-500g-3-i but are not compared),
  and a tolerance that is not a plain number on both sides.

  TECHNICAL DETAIL FOR IT-PO (user's stated design, 2026-10-22)
  - Deterministic, static, AST-based; no pytest run, no LLM. Same check step as
    TQ-500g-3-i, same JSON object and exit code; no second CLI. Runs after -i's
    comparison and before -ii's runs (it needs no pytest).
  - Scope: every test (function or Class::method) present at --base-ref and
    in the working tree whose source changed, in the changed existing test
    files -i already computes.
  - Assertion count: assert statements + self.assert*(...) calls +
    pytest.raises(...) + pytest.approx(...) calls inside the test. Stop when the
    count drops.
  - Loosened comparison: a strict comparison (== or is inside an assert, and
    the strict self.assert* family such as assertEqual / assertIs) that is
    replaced by in, >=, <=, != (or is not / assertIn / assertGreaterEqual and
    similar) or removed. Suggested rule: per test, the count of strict
    comparisons must not drop; IT-PO to pin the matching rule and the strict
    and loose method lists.
  - Tolerance: for pytest.approx calls with rel= or abs= given as numeric
    literals on both sides, matched in source order within the test, stop when
    either grows. Adding rel/abs where the base had none counts as widened when
    the new value exceeds pytest.approx's default (rel 1e-6, abs 1e-12).
  - A test whose source does not parse on either side is already inconclusive
    under TQ-500g-3-i.

  USER APPROVAL (2026-10-22): criteria approved by user 2026-10-22 as written,
  answered directly by the user in the main session's AskUserQuestion;
  readiness set to approved.

  IT-PO ENRICHMENT (2026-10-22): THE MATCHING RULE, PINNED
  Count (a): assert statements + assertion calls (assert*-named callees,
  self.fail, pytest.fail/raises/warns/deprecated_call); pytest.approx is not
  counted. Loosened (b): strict comparisons (== / is in an assert, the strict
  assert* and mock *_with methods) are matched PER SUBJECT (the non-literal
  operand, unparsed), as a multiset per subject; a subject with fewer strict
  comparisons now than at the base stops. Per-subject matching catches an
  operator swap with equal counts (a multiset or count rule would not) and lets
  an inserted assertion pass (a per-position rule would not). Tolerance (c):
  approx calls paired by expected argument, rel/abs literal or pytest default,
  stop on any increase. Result: F, G, H, K, I, L stop; J passes.
  NOT SEEN (add to the pr-reviewer list): a dropped match= on pytest.raises, a
  widened places/delta on assertAlmostEqual, a non-strict form swapped for a
  looser non-strict form (>= 1 becoming >= 0), and everything listed above.
  ACCEPTED STRICTNESS (added): renaming the subject variable stops the work,
  like merging two asserts.

  USER DECISION (2026-10-22): per-subject matching stays. A renamed asserted
  variable stopping the work is accepted strictness; revisit only if it proves
  noisy.
  USER DECISION (2026-10-22): a dropped match= on pytest.raises, a wider
  places/delta on assertAlmostEqual, a looser non-strict form (>= 1 becoming
  >= 0) and a widened expected literal stay known gaps, left to pr-reviewer.
