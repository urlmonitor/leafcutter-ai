id: BO-3800e-1
title: "A refusal that asks for no craft engages no restructuring specialist and recovers exactly the way it does before this capability exists"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a ticket is being driven and delivery is refused with an outcome stating
    that the demand is one the author may discharge inside this change,
  When the run adjudicates that refusal,
  Then no restructuring specialist appears anywhere in the ordered record of
    parties the run engaged,
  And the parties engaged, the order they were engaged in, and the outcome of the
    delivery are the same as they are for that same refusal on the same ticket
    before this capability exists,
  And given instead delivery is refused by a standard whose outcome states no
    disposition at all — the shape every standard that refuses today has, naming
    no craft,
  When the run adjudicates that refusal,
  Then no restructuring specialist appears in the record of parties the run
    engaged,
  And the parties engaged, their order, and the outcome of the delivery are the
    same as they are for that refusal before this capability exists — so a
    standard that has never heard of a disposition is not made to behave
    differently by this capability's arrival.
depends_on:
