  - path: templates/agents/it-po.md
    state: existing
  - path: scripts/evals/agent_eval_config.json
    state: existing
  - path: scripts/evals/sets/it-po.jsonl
    state: to_be_created
  - path: scripts/evals/fixtures/it-po.before-bo-2500a-8-ii.md
