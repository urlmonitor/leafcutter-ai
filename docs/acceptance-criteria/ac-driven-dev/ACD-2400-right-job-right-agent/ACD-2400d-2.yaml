id: ACD-2400d-2
components:
  - ac_driven_dev
  - agent_registry
readiness: approved
priority: high
title: "The reference file a piece of work should follow is chosen by a step that opened it"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given a package-surface requirement assigned to python-coder whose work must follow the
    pattern of an existing file,
  When the file-aware step runs on it,
  Then the requirement names a reference file that exists at that moment,
  And the reference file is of the same file type as the deliverable and lives in the same
    area of the repository,
  And the step states in one sentence why it chose that file,
  And the technical planner's output for that requirement names no reference file.
depends_on:
  - ACD-2400d
  - ACD-2400d-1
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-2000-correct-prompts-by-construction/BO-2000d-1.yaml
    relationship: related
    status: exists
  - path: docs/acceptance-criteria/build-orchestration/BO-2000-correct-prompts-by-construction/BO-2000d-3.yaml
    relationship: related
    status: exists
assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
- The code-aware step writes the reference file into the reference_file_path key of the structured it_requirements
  object only (field-targeted); the planner's other four keys stay as written.
- Existence, same file type and same area are checked by the pre-pass script (ACD-2400d-5-i); the agent
  chooses among qualifying candidates and records its one-sentence reason in the file-findings output.
- The planner-side change (planner names no reference file) is owned by ACD-2400e-2; BO-2000d-3 must be
  amended first (see caveats).
delivers_to:
  agent: python-coder
  contract: 'reference_file_path filled on a package_surface: true record and the ''reference file pending''
    marker cleared; five-field validation then runs (ACD-2400d-2-i).'
expects_from:
  ac_id: ACD-2400d-5-i
  contract: 'Pre-pass report (JSON, deterministic, sorted): {batch: [ac_id], records: [{id: str, declared_files:
    [{path: str, state: ''exists''|''to_be_created''|''neither''}], test_dirs: [{path: str, exists: bool}],
    reference_files: [{path: str, exists: bool, same_type: bool, same_area: bool}]}]}; paths repo-root-relative
    POSIX. Non-zero exit and no report on error.'
test_required: false
origin_agent: business-analyst
created: 2026-09-25
amended_by:
- reason: it-po-technical-enrichment
  date: '2026-09-25'
  by: it-po
superseded_by: null
covered_by:
  - ACD-2400d-2-i
implemented_by: []
change_target: prompt
risk_surface: internal
notes: |
  AMENDMENT NEEDED: BO-2000d-3 promises that the IT PO template states the obligation to
  supply five package-surface fields including the resolved reference-file path. After
  this AC the reference-file path comes from the file-aware step; amend BO-2000d-3 so the
  planner's obligation covers the other four fields and the reference file is attributed
  to the file-aware step. BO-2000d-1 (validation fails when any of the five is missing) is
  unchanged in substance but its TIMING changes - see ACD-2400d-2-i.
  TKT-300a-2 (no implementation prescriptions in it_requirements) sits uneasily with a
  planner-written file path today; moving the choice out removes that tension.
