notes: |
  PHASE B PLAN ITEM g-4. BUILD ORDER: this AC is built BEFORE TQ-500g-1 (the
  wrong-version runs read their runs through the reading fixed here; without it
  a wrong version caught only inside a sub-case would be reported as surviving).
  TQ-500g-1 and TQ-500g-1-i carry depends_on TQ-500g-4 to enforce the order.

  WHY BOTH DIRECTIONS MATTER. At red baseline the defect errs safe (a red test
  is read green, so the gate refuses). At done proof it errs dangerous (a
  failing test is read passed and can support a done verdict). This AC closes
  both with one change, which is why it belongs to no single route.

  S2 IS THE CONTROL. A fix that reads every test that has sub-cases as failed
  passes S1 and breaks S2. S3 pins today's behaviour for tests without
  sub-cases.

  TECHNICAL DETAIL FOR IT-PO (from the KI, not verified against source by the
  BA): pytest 9 prints "<nodeid> PASSED" for the parent and reports sub-case
  failures on separate "SUBFAILED(<params>) <nodeid> - <error>" lines, which the
  shared outcome regex does not recognise. The KI's suggested fix is to downgrade
  the node id to FAILED on any SUBFAILED line and keep SUBPASSED as
  informational. Reuse, do not fork: the parser is shared by done_proof and the
  red-baseline reader (TQ-500f-3-i's single-reader rule); TQ-500f-3-iii (on main
  via PR #926) is moving tag-to-test matching into its own shared module — the
  implementer should rebase onto that and keep the {nodeid: outcome} contract.

  TESTABILITY: behavioural. Real pytest output from a fixture test module with
  self.subTest() cases, fed through the production CLI of each check, is the
  natural proof; a hand-typed stdout string alone would hide exactly the line
  format that regressed.
