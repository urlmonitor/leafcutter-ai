id: KM-500a-4-vi
title: A sealed quarter of S1 is never used while iterating, and stops counting as clean once its configuration changes
component: knowledge-management
components:
- knowledge_management
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-500a-4
criteria: |
  Given S1 holds a sealed holdout of 25% of its cases, rounded up, in which every category with at least 4 cases has at least one holdout case
  When a development run is made while host instructions, prompts or catalog descriptions are being changed
  Then the holdout cases are not executed and their content is not shown in the development report, which states only the sealed holdout count
  And holdout membership is fixed by hash together with the case file, so moving a case into or out of the holdout invalidates the set as in the S1 hash rule
  And a holdout run states the configuration identity it was scored under: host instruction and prompt identifiers, catalog descriptor digests and the threshold set
  And after a holdout run, any change to that configuration identity marks later holdout results as exposed, not clean holdout evidence
  And development results and holdout results are never combined into one figure.
depends_on:
- KM-500a-4
- KM-500a-4-iv
- KM-500a-4-v
- KM-500a-4-x
