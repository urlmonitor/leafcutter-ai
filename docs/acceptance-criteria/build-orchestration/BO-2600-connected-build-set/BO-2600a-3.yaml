expects_from:
  ac_id: BO-2600a-2
  contract: "select_connected --exclude-structural-parent --ac <id> prints the JSON ordered id list of the connected build set."
it_requirements:
  - "Edit Step 2b of templates/agents/build-ac.md so the leaf path first resolves the connected build set by calling the select_connected CLI with --exclude-structural-parent, parsing the JSON id list."
  - "When the parsed set has exactly one member (the target AC), fall through to the existing generate_ticket_from_ac.py single-ticket flow with no behavioral change — this is the critical backward-compat path."
  - "Because build-ac is an LLM agent template, this AC is verified by asserting the template instructs the single-member fall-through explicitly AND by a behavioral check that a single-member set yields one ticket and no epic folder (do not rely on a grep-only test — see CLAUDE.md 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep')."
test_spec:
  - name: test_single_member_set_generates_one_ticket
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    description: "A connected build set of size 1 drives the single-ticket generator and produces exactly one ticket, no epic folder"
  - name: test_single_member_output_matches_baseline
    target_dir: unit_tests/agents/
    framework: unittest
    type: unit
    description: "The single-ticket output for a size-1 set is identical to the pre-change generate_ticket_from_ac output"
