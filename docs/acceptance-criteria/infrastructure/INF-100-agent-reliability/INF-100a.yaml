id: INF-100a
title: "Pull requests are created under the right account with consistent quality"
component: infrastructure
level: L1
status: active
criteria: |
  The PR agent switches to the correct account and follows project writing standards automatically.

  When the pull-request agent runs, it automatically uses the correct
  GitHub identity (no EMU auth failures) and applies the project's PR
  writing conventions, so every pull request is well-formed on the first
  attempt without manual account switching or style corrections.
