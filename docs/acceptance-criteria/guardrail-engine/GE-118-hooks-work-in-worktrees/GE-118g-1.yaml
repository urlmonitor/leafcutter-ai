notes: |
  WHY THE WRONG-DIRECTORY ARM IS REACHABLE RATHER THAN HYPOTHETICAL, MEASURED
  2026-10-09. The directory this workspace's agent sessions start in is not a git work
  tree — `git -C /home/henzeh/projects/leafcutter rev-parse --show-toplevel` exits 128 —
  and it DOES contain a deployed `scripts/commit_guardian/`. So the procedure's bare
  relative command does not fail to start there; it starts, finds the program, and then
  cannot read git state. That combination is what makes this a wrong-answer defect rather
  than a missing-program one, and it is why the second Given above specifies a
  non-repository directory that nonetheless holds a deployed copy. A test harness that
  invokes from an empty temporary directory reproduces a DIFFERENT condition (nothing to
  run) and proves nothing about this one.

  THIS IS A CONTEXT-RESOLUTION RECORD, NOT A TRUTHFULNESS ONE. The program as it stands
  is honest: "could not read the decision-number sequence" is precisely what happened.
  No clause above asks it to be more honest. Every clause asks it to resolve the
  repository it belongs to and then answer about that repository. The fourth arm is the
  one most likely to be misread as a truthfulness clause; it is not. It is the clause
  that stops the fix being implemented as "swallow the failure and report a clean
  verdict", which would turn today's visible wrong answer into an invisible one.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM.

  (1) THE DEFECT ITSELF. MUTATION: restore the staged-set read without the
      working-directory argument, so git inherits the process working directory.
      MUST GO RED: the first arm (collision named from the non-repository directory) and
      the third (clean pass from the non-repository directory).
      MUST STAY GREEN: the second arm, run from the repository root — it passes both
      before and after, which is exactly why it cannot be the only arm. An implementation
      verified only from the repository root is indistinguishable from the defect.

  (2) THE SWALLOW. MUTATION: on a read that cannot be performed, return an empty pending
      set and report no collision.
      MUST GO RED: the fourth arm only.
      MUST STAY GREEN: arms one through three, and every arm of GE-118g-2. That asymmetry
      is the evidence that the fourth arm is its own behaviour and not a restatement.

  (3) THE FIXED LIST. MUTATION: replace the staged-set read with the set of numbers
      observed at implementation time.
      MUST GO RED: the fifth arm (the set grows when a second colliding record is
      staged) and the third (a non-colliding record must pass).
      MUST STAY GREEN: the first arm, which a fixed list containing 68 satisfies exactly.
      The fifth arm exists because a stated verdict alone is satisfiable by a literal.

  WHAT THIS RECORD DOES NOT CLAIM, SO NOBODY CLOSES IT BY DOING THESE INSTEAD.
    - It does not require the program to be registered in any hook manifest. It is
      registered nowhere today and the criteria are invocation-based for that reason.
    - It does not address the empty-set-on-error return recorded in KI-CG-022 beyond the
      fourth arm's refusal to present no-answer as a clean answer.
    - It says nothing about which reference the claimed-number sequence is read from.
      KI-CG-022's fresh-install blocker (an absent origin/main) is a different condition
      with its own filed fix direction, and no clause above is discharged by addressing
      it.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. Those are the IT PO's. The three named
  mutations above, including which arms must stay green, are written to be turned
  directly into test descriptors.
