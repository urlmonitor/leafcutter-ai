work_status: todo
readiness: approved
priority: medium
created_by: docs/acceptance-criteria/build-orchestration/BO-500-computed-quality-gates/BO-570.yaml
criteria: |
  Given a ticket whose changed surface includes Python files,
    and the ruff tooling needed to lint them is not available in the worktree
    (for example ruff is not installed, or the repository ruff configuration
    cannot be located from the worktree root),
  When the sign-off gate attempts the repo-ruff check,
  Then the gate does NOT record the ruff check as passed,
  And it records the check as inconclusive, naming the reason the lint could
    not be performed (tooling or config unavailable),
  And the sign-off cannot reach an "ok" verdict on Python files that were
    never actually linted,
  And the inconclusive outcome is surfaced to the supervisor for resolution
    rather than being swallowed silently.
depends_on: [BO-570-4]
