roadmap_phase: phase_1
criteria: |
  Every unresolved entry is classified and routed to its best next step -- no manual sorting.

  The platform reads the unresolved feedback and judges each entry by what it is
  (a bug fix, a feature, an improvement) and how big it is (a quick single-file
  change versus a larger effort). Small, well-targeted fixes go straight to the
  fast fix path; larger or feature-shaped items go to the refinement path so they
  become proper acceptance criteria. You no longer hand-sort the pile.
