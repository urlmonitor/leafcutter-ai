title: "jscpd hook reports duplicate code blocks that overlap with staged files"
component: guardrail-engine
level: L2
status: active
req_status: active
work_status: done
created_by: "docs/acceptance-criteria/guardrail-engine/GE-100-code-quality-hooks/GE-100.yaml"
criteria: |
  Given the commit guardian configuration has the duplicate_code section with:
    enabled: true
    strict: false
    min_lines: 5
    min_tokens: 50
    threshold_percent: 5
    checked_extensions: [".py", ".ts", ".js", ".tsx", ".jsx", ".sql"]
  And the jscpd binary is installed and reports version 3.x
  And a developer has staged a Python file containing a 10-line block that is
    duplicated verbatim in another file in the working tree
  When the duplicate code hook runs at pre-commit time
  Then the hook emits a human-readable warning listing the duplicate pair:
    source file path, line range, and destination file path, line range
  And because strict is false, the hook exits with code 0 (warn-only)
  And the warning output identifies both files by path and line numbers
