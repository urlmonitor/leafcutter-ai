    relationship: describes
    status: exists
    relevance: "The defect. Verified 2026-08-17, function _update_ac_work_status at lines 98-125 opens the record's file for writing and then serialises into it — the file is emptied at the moment it is opened, so anything that goes wrong between that moment and the end of the write leaves a zero-length record behind. It is called three times per requirement per run (line 203 in_progress, line 261 todo, line 376 done)."
