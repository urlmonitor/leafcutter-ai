notes: |
  Anchor case (KI-BO-019, blocker, open): the fast lane asked its bundle
  specialist to return ~149 KB of text as a field inside a structured reply. The
  specialist assembled the bundle correctly, wrote 148,891 bytes to disk, and
  returned a pointer to it along with a plain description of what it had done.
  The gate then checked the 47-character path for a marker, did not find one, and
  halted. The bundle was well-formed and the marker was present at line 958.

  THE GATE IS NOT THE BUG. Its fail-closed posture is correct and must be
  preserved — do not let this criterion be decomposed into loosening it. What
  failed is the contract: "return 149 KB of text as a string field" is not
  something a specialist reliably honours, and the specialist was not evasive
  about it, it simply answered a different question than the schema asked.

  Related to BO-3200a but distinct, and both are needed. BO-3200a removes the
  cases where a specialist should never have been the source at all. This
  criterion covers the cases where a specialist legitimately IS the source — it
  did real work and produced a real finding — and only the handover is at fault.
  A fix to either one leaves the other class open.

  IT-PO DECISION (2026-08-26) — WHAT THE AGREED HANDOVER IS. The BA left this open
  on BO-3200d-2; it is settled there in full, and the shape is recorded here because
  it binds all three children:

  THE CALLER SUPPLIES THE PATH AT DISPATCH; THE PRODUCER DOES NOT CHOOSE IT AND
  DOES NOT REPORT IT. The coordinating layer allocates a run-scoped artifact path,
  passes it in the dispatch, and reads the file at that path when the dispatch
  returns. This is the decision that makes the criteria structurally true rather
  than conventionally true: if the caller already knows the path, the reply cannot
  be the transport for it, there is no pointer to be truncated or paraphrased, and
  a reply carrying none of the content is the normal case rather than a special one.
  A producer-chosen path returned in the reply is the SAME defect as returning the
  content — a value the build depends on, arriving second-hand.
