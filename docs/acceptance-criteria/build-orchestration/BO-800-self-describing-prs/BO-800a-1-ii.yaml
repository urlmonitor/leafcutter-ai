criteria: |
  Given a ticket's source_ac references an L1 AC with title:
    "Automatically detect and resolve circular dependencies in the build graph at startup"
    (84 characters),
  When the pull-request agent assembles the PR title,
  Then the PR title is truncated to 70 characters: "Automatically detect and resolve circular dependencies in the build..."
  And the truncation preserves whole words (does not cut mid-word)
  And the ellipsis ("...") is appended as the final 3 characters
  And the full untruncated title appears in the PR body's summary section.
