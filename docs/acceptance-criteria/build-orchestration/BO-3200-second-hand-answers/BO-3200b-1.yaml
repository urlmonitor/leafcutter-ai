id: BO-3200b-1
title: "A run that stops after claiming work releases the claim in the store that outlives it, from every failure point"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a run that has claimed work in a store that outlives the run,
    And the run then stops because a later step failed,
    And an environment in which dispatching a specialist is impossible,
  When the run ends,
  Then every item it claimed is back in its unclaimed state in that same store.

  Given that ended run,
  When a new run selects work from that store,
  Then it is able to claim the same items, so the failed run did not make its own target
    unbuildable.

  Given a run driven separately to each distinct point at which it can stop after the claim,
  When it ends at each of those points in turn,
  Then every item it claimed is back in its unclaimed state after each one.
