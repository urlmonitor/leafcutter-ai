notes: |
  THE BEHAVIOURAL PROOF FOR THE WHOLE L1. INF-1100d-2 and -3 are mostly prompt
  text; this check is what makes "nothing leafcutter installs carries a
  ready-made database address" deterministic and permanent.

  The third Then clause is the adversarial case: a check that scans the wrong
  tree, or matches only the one literal, passes on the fixed sources and proves
  nothing. It must be shown to fail on the pre-fix sources. Of the PO's seven source
  files, five are shipped and scanned: templates/agents/test-writer.md,
  templates/agents/test-runner.md, templates/workflows/test.md,
  config/skills_config.default.json, config/skills_config.schema.json. The other
  two (docs/reference/skills-config-fields.md, docs/testing/README.md) are
  leafcutter's own docs. They are not shipped, and INF-1100d-5 cleans them by
  hand.

  "Shipped" means what a build puts into an install, not the whole repository —
  see INF-1100d-4-i for what is deliberately out of scope.

  IT-PO ENRICHMENT (2026-09-25)
  EIGHTH SOURCE FOUND: docs/agents/utility/test-runner.md carries port-5403 prose, and
  docs/testing/README.md:214 carries postgresql://myuser:mypass@localhost:5432/mydb, which
  this check's own rule (a concrete host plus port) flags. Both need owners: INF-1100d-5 for
  docs.
  INTENDED must_catch: "match only the one literal" -> the mysql case goes red; "scan only
  templates/" -> the pre-fix test does not name the two config/ files, test goes red; "exclude
  docs/analysis by path" -> INF-1100d-4-i S7 goes red; "zero-file scan exits 0" -> the reachability
  count assertion goes red.

  SHIPPED SCOPE (user decision at the IT-PO gate): shipped = what build.py
  copies into installs, i.e. templates/ (templates/docs/ included) and config/.
  Leafcutter's own docs/ tree (docs/reference, docs/testing, docs/analysis,
  docs/agents, the AC store) is NOT shipped and NOT scanned. The docs/ sources
  named in the IT-PO enrichment above (docs/testing/README.md:214,
  docs/agents/utility/test-runner.md) are still cleaned by hand under
  INF-1100d-5, but this check does not guard them.

  IT-PO PASS 2 (2026-09-25): it_requirements and test_spec aligned to shipped =
  templates/ + config/. The pre-fix proof now names five shipped sources instead of seven, and
  the docs/ exclusion is covered by INF-1100d-4-i. must_catch "scan only templates/" -> the pre-fix
  test misses the two config/ files and goes red.
