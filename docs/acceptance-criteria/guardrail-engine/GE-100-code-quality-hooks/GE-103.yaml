criteria: |
  Given the commit_guardian package is deployed into a consumer project
  When the pre-commit pipeline imports check_doc_frontmatter.py (which imports
       frontmatter_validators, which imports diagram_type_validators)
  Then the import must succeed without ModuleNotFoundError
  And doc-frontmatter enforcement (required fields, type/status/flight_level
      enums, components-exist-in-registry) must run rather than being silently
      disabled by an import crash

  And given any module file in commit_guardian/ matching check_*.py or *_validators.py
  When a package import smoke test imports each one
  Then every module imports cleanly, so a missing-module regression fails the
      test suite instead of silently disabling a hook in every consumer repo

  And the bug symptom ("ModuleNotFoundError: No module named 'diagram_type_validators'")
      must not occur
