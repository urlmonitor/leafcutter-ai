title: "When a shared check changes, every existing test that leans on it is listed, and may be strengthened but never weakened"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a change to the shared helper is_refresh_due() so that it also reads
    retry_due, and four existing tests that call it —
      E1 test_refresh_runs_when_due and E2 test_refresh_skips_when_not_due,
         whose fixtures set refresh_due but never retry_due,
      E3 test_retry_backoff_caps_at_five,
      E4 test_status_page_shows_next_refresh,
  When the test writer hands on its work for that change,
  Then its report lists E1, E2, E3 and E4 by name, each marked either
      strengthened, saying what was added, or unaffected, with a one-line
      reason,
    And E1 and E2 are strengthened so their fixtures set retry_due with values
      distinct from refresh_due, instead of being left to pass for the wrong
      reason,
    And no edit to an existing test removes an assertion, widens an expected
      value, adds a skip or an expected-failure mark, or deletes the test,
    And every edit to an existing test appears in the report, including edits
      to tests outside E1 to E4,
    And an existing test that could be made to pass only by weakening it is
      reported by name and handed back, not weakened.
