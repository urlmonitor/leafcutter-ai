criteria: |
  Given the traceability reconciliation check has blocked a commit because a
    refactor broke an AC-to-code link
  When a developer opens the how-to guide for this guardrail
  Then the guide explains what the block means (a recorded implemented_by link
    points at source that moved, was renamed, or was deleted)
  And the guide shows the developer how to read the block message to identify the
    affected criterion and the broken link
  And the guide describes both reconciliation routes (update the link, or confirm
    the code still satisfies the criterion) with a worked example of each
  And the guide states that blocking is the default behavior and how to opt into
    the warn-only tier
