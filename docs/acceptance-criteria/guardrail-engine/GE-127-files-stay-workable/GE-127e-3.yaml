notes: |
  THIS COMPONENT HAS THE SCAR, AND IT IS ALREADY WRITTEN DOWN TWICE. A gate here is
  published as automatically bringing in a triage specialist and does not; its
  dispatch path stamps every input with a placeholder reason and it returns success
  unconditionally. Every author who read that line believed they were covered. The
  L1's notes name this as load-bearing and they are right: a message naming a tool
  that is not invoked is WORSE than a bare verdict, because a bare verdict leaves a
  visible gap while a false promise closes it in the reader's head.

  WHY THE LAST ARM SAYS "SATISFIED" AND NOT "INSUFFICIENT". Read alone, this record
  is passed by a refusal that offers nothing — and that is deliberate, because the
  alternative is a criterion that pressures an implementer to add a sentence in order
  to have one, which is how the incumbent message came to exist. The substance
  obligation lives in GE-127e-1 and the specificity obligation in GE-127e-2. This
  record is the ceiling, not the floor, and stating the ceiling as a permission is
  what makes deleting an unkeepable sentence the compliant move rather than a
  regression.

  THE FIRST APPLICATION IS NOT HYPOTHETICAL AND MUST BE PERFORMED. The refusal that
  ships today names a refactoring helper. Run it, as the message says to run it, from
  where the message says to run it. If it works as described, the sentence stays and
  the record is satisfied by evidence rather than by assumption. If it does not, the
  sentence is deleted. There is no third disposition — softening the wording to
  "consider" leaves the reader in the same place and is the failure mode GE-122c-1
  records as indistinguishable from a dead dispatch from the author's point of view.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM. Every arm of this
  criterion asserts an absence or a property of text that may not be present, and all
  of them are green on arrival against a refusal that names nothing. Written so the
  IT PO can lift them verbatim into test descriptors.

  (1) "the action can be carried out as stated, and it produces the thing the
      refusal says it produces" — MUTATION: append to the refusal one sentence naming
      a helper that the run does not invoke and that cannot be carried out as written
      — the exact shape of the recorded anti-precedent, e.g. a sentence stating that
      a refactoring specialist has been engaged for this file. Under that injection
      this clause must go RED, and must return to green on revert. Without this
      injection the clause is satisfied by a refusal that names nothing, which is
      today's state for every sentence except the helper pointer.

  (2) "the refusal contains no statement that anything will be done on the author's
      behalf after the refusal is issued" — MUTATION: append a sentence stating that
      the file has been queued for follow-up, or that a report will be produced for
      it. Under that injection this clause must go RED, and must return to green on
      revert. This is the future-tense version of the same defect and it is the one
      most likely to be added in good faith by an implementer who has built the
      queueing but not the consuming end.

  THE EVIDENCE BAR, STATED SO IT IS NOT NEGOTIATED DOWN AT ENRICHMENT. "The action
  can be carried out" is evidenced by carrying it out in the test, from a real
  refusal produced by a real commit attempt. It is NOT evidenced by asserting the
  refusal contains a path that exists on disk, nor by asserting a helper is
  registered somewhere, nor by asserting the text matches an approved list of
  sentences. GE-122c-1's coverage note rules out that entire family of assertions for
  the same reason, in the same component, and its reasoning transfers unchanged: each
  of them passes on a guard that delivers nothing.

  BOUNDARY WITH GE-127d, WHICH IS EASY TO BLUR AND THE L1 SAYS SO. GE-127d requires
  the limit and the quoted length to be TRUE and reproducible. This record requires
  the OFFER OF HELP to be true. A gate can quote a perfectly accurate number and
  still promise a tool that does not exist, and it can offer scrupulously honest help
  about a limit it is not enforcing.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity,
  it_requirements, test_spec, test_rationale and declares_side_effect. Both mutations
  above are written to be turned directly into test descriptors.
