roadmap_phase: phase_1
criteria: |
  Proof that work is wired in is demanded up front, not hoped for afterwards.

  Whenever a piece of work is planned, the plan itself asks for proof that the
  finished work is reached the way people actually use the product — not only proof
  that it produces the right answer when called directly. That demand reaches every
  piece of work, including work that arrived with a hand-written plan of its own, so
  no route into the system quietly skips it. Work that changes something real is
  pointed at the check that confirms the change really happened, automatically,
  because the work record says what kind of work it is. And there is exactly one set
  of words for describing a required proof, so what the plan asks for means the same
  thing to everyone and everything that reads it.
