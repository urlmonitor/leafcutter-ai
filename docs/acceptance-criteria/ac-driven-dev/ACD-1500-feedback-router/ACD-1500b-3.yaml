roadmap_phase: phase_1
criteria: |
  Given entry F1 has category: blocker,
  And F1 was classified with confidence 0.95 (well above the floor),
  When the router decides what to do with F1,
  Then F1 is parked for human /feedback-review,
  And F1 is NOT dispatched to /quick-fix or /create-ac despite its high confidence,
  And the parked record states the reason "blocker category always requires human handling",
  And the blocker rule is applied before the confidence-floor gate so a high
    confidence score can never override it.
