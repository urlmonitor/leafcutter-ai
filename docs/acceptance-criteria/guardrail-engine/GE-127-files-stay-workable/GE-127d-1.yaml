notes: |
  THIS IS NOT A DEFECT AC AND MUST NOT BE READ AS ONE. Every fact below was read
  from source in this worktree on 2026-09-01 and is stated at the confidence it
  was read at:
    - The behaviour is correct and deliberate. The guard's recorded change history
      entry of 2026-05-01 states that limits were extended to all changed files,
      not just new ones, to drive progressive refactoring. Nobody should "restore"
      the new-files-only exemption on the strength of the stale documentation.
    - The two published statements are stale by four months: the gate's entry in
      the guard family's reference documentation, and the comment on its own
      configuration section. Both independently claim new-files-only with an
      exemption for modifications to existing large files.
    - The per-file verdict accepts a fact about whether the file is newly added
      and does not use it. The same fact IS used elsewhere, to label a passing
      file as new or modified. A record, ticket or test asserting that the flag is
      unused would be false; the accurate statement, and the one the last clause
      makes, is that it is accepted as an input to the VERDICT and makes no
      difference to the verdict.

  THIS RECORD WAS PROPOSED AS AN L3 AND IS AUTHORED AS AN L2, FOR TWO REASONS.
  Mechanically, the store's id regex admits no roman-suffixed child of an L1, so a
  `GE-127d-i` would fail the id-format check and an L3 would need an L2 parent
  that does not exist. Semantically it is the first-order statement of GE-127d's
  own promise rather than an edge case of some other behaviour. Recorded rather
  than silently changed.

  TWO OBLIGATIONS IN ONE RECORD, AND WHY THEY ARE NOT SPLIT. Clauses one to three
  govern the published surfaces; the last clause governs an accepted input. They
  are the same obligation at two depths — the rule as declared is the rule as
  operated — and a fact the standard says it takes and then ignores is the same
  lie as a sentence describing a rule it does not apply, one level down. The
  single-behaviour-per-record convention argues for splitting them; the pairing
  was approved deliberately and is recorded here so the IT PO can split it at
  enrichment if the test descriptors turn out to have nothing in common.

  THE ACCEPTANCE SHAPE THAT HAS TEETH, AND THE ONE THAT DOES NOT. A criterion
  satisfied by editing a sentence is satisfied again the next time the behaviour
  changes and the sentence does not — this defect has already happened here,
  exactly that way, and correcting today's wording is necessary and not
  sufficient. What discharges this record is a check evaluated against BOTH the
  published statement and the enforced behaviour, so that a future change to
  either without the other is caught at the commit that makes it.

  NAMED MUTATIONS — MANDATORY, EXECUTE THEM IN BOTH DIRECTIONS. The first three
  clauses have a genuine red baseline today (the two published statements
  contradict the behaviour, and no check compares them), so the injections below
  are not there to manufacture a red — they are there to prove the check is
  bidirectional and reaches every published surface, which the red baseline alone
  does not establish:

  (1) DOCUMENTATION SIDE: change one published statement alone so that it names a
      different set of covered kinds than the set in force, changing nothing else.
      The commit must be refused, naming the disagreement.

  (2) BEHAVIOUR SIDE: revert (1), then change the enforced scope alone so it no
      longer matches the published statements, changing no wording. The commit
      must be refused again. A check that catches only the first direction lets the
      behaviour drift away from correct documentation, which is the more dangerous
      of the two.

  (3) SECOND-SURFACE MUTATION, for the clause requiring every published place to
      be compared: bring one published statement into agreement with the behaviour
      and leave the other stale. The commit must still be refused, naming the stale
      one. Without this injection the clause passes on a check that reads whichever
      surface the implementer happened to think of.

  THE DIRECTION OF THE FIX IS NOT DECIDED HERE AND MUST NOT BE ASSUMED. For the
  new-files-only contradiction, two reconciliations exist — correct the
  documentation to match the behaviour, or restore the behaviour to match the
  documentation — and they are materially different products. The second is
  largely superseded by GE-127b: a ratchet delivers the incremental-refactor path
  the stale documentation was promising, without reintroducing the exemption.
  Whichever is chosen must be chosen explicitly and recorded, and the decision
  must leave the rule stated in a way that cannot drift apart again. The last
  clause admits the same two-way freedom by construction: the accepted fact must
  either start mattering or stop being accepted, and this record forbids only the
  present state in which it does neither.

  DELIBERATELY OUT OF SCOPE HERE, AND NOT YET AUTHORED ANYWHERE — FLAGGED, NOT
  SMUGGLED IN. GE-127d carries a second subject this record does not cover: that
  the number the author is quoted for a file is one they can arrive at themselves
  from the published counting rule. Today the counting rule discards documentation
  blocks before counting and is published nowhere, which is why the same
  repository measures 200 files over their limit under the guard's rule and 314
  over the same raw number of lines. That behaviour needs its own record under
  GE-127d and was not in the set approved for this run. It is named here so its
  absence is visible rather than assumed covered.

  BOUNDARY WITH GE-127c-1. That record requires a run to state which kinds it
  measured. This one requires the published description of the scope and the scope
  enforced to agree. A run that announces its measured kinds perfectly while the
  documentation describes a different set fails this record; a perfectly
  documented scope whose runs say nothing about what they looked at fails that
  one.

  BOUNDARY WITH GE-127e. This record is about the rule being TRUE. GE-127e is
  about the refusal being USEFUL. A gate can quote an accurate limit and an
  accurate count and still leave the author with nothing to do.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. The IT PO will need to decide whether
  the comparison check lives beside the size guard or as its own gate, and whether
  the correction of the stale wording is a separate documentation record — the
  three named mutations above are written to survive either choice.
