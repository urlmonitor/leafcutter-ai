delivers_to:
  agent: python-coder
  contract: "The preserved entitlement invariant: after GE-125a-1's anchoring change the chosen-location set still has exactly its four members (tickets, docs/retrospectives, docs/acceptance-criteria, templates/skills), and the exemption still removes ENTROPY_HIGH only, leaving AWS_KEY, PRIVATE_KEY, EXCHANGE_API_KEY and GENERIC_SECRET firing at those paths. GE-125a-2-i consumes this invariant and settles which repository root the four are measured from. Note the acceptance-criteria member is demonstrated with a .md fixture, not a store .yaml record: the LOCATION keeps its entitlement while the KIND gate GE-125b adds excludes store YAML."
expects_from: null
it_requirements:
  - "THIS RECORD ADDS NO PRODUCTION CODE. It is a control suite over the behaviour GE-125a-1 delivers. If satisfying it requires a production change, that change belongs to GE-125a-1 or is a defect in it — do not implement new behaviour under this record."
  - "NOT ADMISSIBLE AS EVIDENCE THAT GE-125a-1 LANDED, and this is a hard instruction to whoever runs the gates. All four arms are GREEN ON ARRIVAL by design: at these four paths today's behaviour is already the wanted behaviour. A red-baseline check must therefore NEVER be satisfied by this record — a green run here says only that the entitlement has not been destroyed, never that anchoring was implemented. Take the red baseline for this L1 from GE-125a-1's reused-name arms. Symmetrically, GE-125a-1 is not evidence that the entitlement survived."
  - "CLOSE AS A PAIR WITH GE-125a-1. Neither record may be marked done while the other is unfinished. The cheapest wrong implementation of this L1 narrows the entitlement to nothing, which passes every arm of GE-125a-1 and is indistinguishable from deleting the reduced scrutiny; this suite is the only thing that catches it. Per the AC-store commit convention, stage the parent GE-125a alongside both children when their work_status changes."
  - "NOTHING HERE SHOULD EVER GO RED. If any arm of this record goes red at any point during implementation, that is the over-narrowing failure occurring in real time — stop and treat it as a blocker on GE-125a-1, not as a test to be adjusted. Do not weaken or delete an arm of this control to make a GE-125a-1 change pass."
  - "THE FIXTURE TRAP IS AT ITS SHARPEST ON THIS RECORD, because these arms assert that a file IS exempt. A fixture written under this repository's own tickets/, docs/retrospectives/, docs/acceptance-criteria/ or templates/skills/ would be exempt by way of THIS repository's list no matter what the change under test did — it would report success while measuring nothing, which is the exact false-green this control exists to prevent. Every fixture must live in a throwaway tempfile-backed root that is the scenario's own project root."
  - "EVERY CHOSEN-LOCATION FIXTURE MUST BE OF AN ADMITTED PROSE KIND — `.md` OR `.txt` — AND THAT LIST IS NARROWER THAN IT WAS. Do not add an executable fixture to 'strengthen' this record: GE-125b is heading for the answer that an executable file at a chosen location LOSES the entitlement, so an assertion here that a .py under templates/skills/ stays exempt would freeze the behaviour its sibling exists to change and the two would collide. THE SAME NOW APPLIES TO `.yaml` AND `.yml`. This record originally used a store record, `docs/acceptance-criteria/guardrail-engine/GE-999.yaml`, as its acceptance-criteria fixture. On 2026-08-25 the product owner decided that the acceptance-criteria store SHALL be scanned for opaque credentials and the admitted-kind list GE-125b-3 fixes shrank to `.md` and `.txt`, so that fixture would have asserted a silence GE-125b-1-i now asserts is a finding. It has been replaced with `docs/acceptance-criteria/guardrail-engine/PROJECT_CONTEXT.md` — a real shape of prose file that lives in the store, at the same chosen LOCATION, of a kind that is still admitted. Every fixture here is prose of an admitted kind so that every arm stays true both before and after GE-125b lands."
  - "CREDENTIAL FIXTURES ARE ASSEMBLED AT RUNTIME FROM FRAGMENTS, following unit_tests/commit_guardian/test_scan_secrets_suppression.py, and this applies with extra force to the fourth arm's three additional shapes. A private-key header and a cloud-access-key-shaped value are the two highest-signal detectors in the scanner; committing either as a source literal would require suppressing them on a real source file, creating a genuine blind spot in the file most likely to accumulate credential-shaped data. This tree must need no allowlist entry at all."
  - "IN THE FOURTH ARM, EACH OF THE FOUR LINES MUST PRODUCE EXACTLY ONE FINDING FROM EXACTLY ONE RULE. Verify no cross-triggering: the password line's quoted value must be long enough for GENERIC_SECRET but short enough to stay under the 4.5 entropy threshold, or the arm cannot distinguish 'entropy suppressed' from 'entropy fired via another line'. Assert on the rule identifiers reported, not merely on the finding count."
  - "EXECUTE THE CHECK, and against the BUILT result. Drive the real multi-file entry point over real files with the prose post-filter applied as the pre-commit consumer applies it. A grep of check_secrets.py for the four chosen names would pass whether the entitlement still applied or not, which is precisely the distinction this record exists to make. Run `python scripts/build.py --target-dir .` first for any assertion about deployed behaviour."
  - "THE EXIT-STATUS ASSERTION IN THE FOURTH ARM MUST RUN A PROCESS — the command-line entry point in a fresh subprocess with the throwaway root as working directory. Note it is green on arrival for a trivial reason (the three non-entropy findings already make the run exit non-zero), so it is a reachability guard and nothing more."
  - "Error-handling policy per CLAUDE.md applies to any test helper that performs I/O: specific exception types, no bare except, no silently swallowed error."
test_spec:
  - name: test_tickets_at_project_root_still_exempts_the_opaque_token
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "CONTROL, GREEN ON ARRIVAL. tickets/00_inbox/note.md in a throwaway root, holding a runtime-assembled 5.17-entropy token, yields no ENTROPY_HIGH finding and does not block the run. Fails only if the anchoring change destroyed the entitlement it was supposed to preserve."
  - name: test_all_four_chosen_locations_still_exempt_the_opaque_token
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "CONTROL, GREEN ON ARRIVAL. docs/retrospectives/2026-08-19-retro.md, docs/acceptance-criteria/guardrail-engine/PROJECT_CONTEXT.md and templates/skills/example-skill/SKILL.md are all unreported. Catches an implementation that anchored the first chosen name and dropped the other three — which the single-location arm alone would not. The acceptance-criteria fixture is Markdown, not a store .yaml record: after the 2026-08-25 decision that the store shall be scanned, a .yaml fixture here would assert a silence GE-125b-1-i asserts is a finding."
  - name: test_entitled_set_has_exactly_four_members_after_the_change
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "CONTROL, MIXED RUN, PARTLY GREEN ON ARRIVAL. All four chosen-location fixtures plus src/app.py and leafcutter-web/tickets/app.py staged together in one invocation: the four are exempt and the two are reported. The exempt half is green today; the leafcutter-web/tickets/app.py half is RED today and is the one assertion in this record that moves when GE-125a-1 lands — it is duplicated from GE-125a-1 to keep the no-members-gained half of the invariant inside the control, and must not be cited as this record's own evidence."
  - name: test_entitlement_removes_only_the_opaque_token_rule
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "CONTROL, GREEN ON ARRIVAL. tickets/00_inbox/incident.md carrying four runtime-assembled lines yields no ENTROPY_HIGH finding but does yield PRIVATE_KEY, AWS_KEY and GENERIC_SECRET findings, asserted by rule identifier and one finding per line; the CLI run exits non-zero. Catches a change that anchored the match and, in passing, widened the entitlement to every rule."
test_rationale: |
  READ THIS BEFORE ANY GATE DECISION ABOUT THIS RECORD. Three of the four
  descriptors are GREEN ON ARRIVAL by design and the fourth is split. That is not
  a gap in the contract, it is the contract: at these four paths the current
  behaviour is already the wanted behaviour, so a control's job here is to fail if
  the change goes too far, never to demonstrate that the change happened. It
  follows that this record is NOT ADMISSIBLE as evidence that GE-125a-1 landed, and
  a red-baseline or TDD-order gate must never be satisfied by a green run of this
  suite. The red baseline for this L1 comes from GE-125a-1's reused-name arms.
  Symmetrically, GE-125a-1 is not admissible as evidence that the entitlement
  survived. The two must be read, and closed, as a pair.
  The one exception is the third descriptor, which is deliberately split: its
  four-exempt half is green today, while its leafcutter-web/tickets/app.py half is
  red today because that path is measured EXEMPT in KI-SEC-001. That half is
  carried over from GE-125a-1 on purpose, so that the no-members-gained side of the
  four-member invariant is asserted inside the control rather than only across
  siblings. It is still GE-125a-1's evidence, not this record's — do not cite it
  here.
  WHY THE CONTROL IS NEEDED AT ALL: the cheapest wrong implementation of this L1
  narrows the entitlement to nothing. That passes every measured row of GE-125a-1,
  closes the reported symptom, and is indistinguishable from deleting the reduced
  scrutiny outright — which brings back the false positives GE-123d exists to
  remove, and with them the pressure that makes people write suppressions. Only
  this suite can tell the two apart.
  THE FOURTH DESCRIPTOR IS THE SECOND HALF OF THE CONTROL. Preserving WHO is
  entitled is not the same as preserving WHAT the entitlement removes. A change
  that anchored the match at the project root and simultaneously widened the
  exemption from ENTROPY_HIGH to every rule would pass the first three descriptors
  while opening a hole far larger than the one it closed. It asserts on rule
  identifiers rather than finding counts, because a count can be satisfied by the
  wrong rule firing twice.
  EVERY FIXTURE IS PROSE OF AN ADMITTED KIND, deliberately and permanently.
  GE-125b is heading for the answer that an executable file at a chosen location
  loses the entitlement; an executable fixture here would freeze the behaviour that
  sibling exists to change. Since the product owner's decision of 2026-08-25 that
  the acceptance-criteria store shall be scanned, the same is true of .yaml — so
  the acceptance-criteria fixture is a PROJECT_CONTEXT.md rather than a store
  record. Keeping every fixture to .md or .txt is what makes all four arms remain
  true after GE-125b lands as well as before.
