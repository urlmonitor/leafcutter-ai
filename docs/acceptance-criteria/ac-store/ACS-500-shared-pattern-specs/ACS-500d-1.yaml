id: ACS-500d-1
readiness: approved
priority: high
title: "Updating a pattern AC's criteria changes effective behavior for all consumers"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given three page-level ACs each have implements_pattern: "PTN-001"
    referencing a pattern that defines "paginated-collection" with
    criteria including "displays total count above the table",
  When the pattern AC (PTN-001) is amended to change the criteria to
    "displays total count below the table",
  Then each consuming AC inherits the updated behavior without any
    modification to its own YAML file,
  And an agent reading any of the three consuming ACs resolves the
    effective behavior by following the implements_pattern reference
    to retrieve the current pattern criteria,
  And no migration ticket or manual update to the three consuming
    ACs is required.
depends_on: [ACS-500d, ACS-500b-1]
