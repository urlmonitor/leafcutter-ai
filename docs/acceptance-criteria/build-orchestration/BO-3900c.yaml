criteria: |
  Given the resolved worktree `C:\Users\Hendrik\Code\leafcutter\worktrees\uxp-700-tranche-2`
  And a batch of three tickets, one of which is named by one of:
    `C:tickets\07_TICKET-x.md` (drive-relative),
    `\tickets\07_TICKET-x.md` (rooted, with no drive),
    an empty or blank string,
    or an already-joined value carrying a second drive root, such as
    `C:\Users\Hendrik\Code\leafcutter\worktrees\uxp-700-tranche-2\tickets/C:\Users\x\07_TICKET-x.md`
  When the workflow resolves the batch's paths for dispatch
  Then no phase agent is dispatched for that ticket
  And the ticket is reported blocked with a reason that reproduces its path value
    verbatim and states that the value is not a recognised absolute or relative path
  And that value is not joined onto the worktree, not trimmed into some other path, and
    not guessed at
  And the other two tickets, whose paths are well-formed, are dispatched as usual.

  Given one ticket blocked for an unrecognised path form and another blocked because its
    well-formed path names a file that does not exist
  When the run reports its blocked tickets
  Then the two reasons can be told apart — the first says the path's form was not
    recognised, the second says the file it names was not found.
