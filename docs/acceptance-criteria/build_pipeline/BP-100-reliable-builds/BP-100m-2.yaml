it_requirements:
  - "The collision verdict per target must carry the FULL set of contributing sources so the message can name all of them; a two-source-only representation is insufficient when three or more sources collide."
  - "Detection spans all artifact phases that write into the deployed tree, not just build_commands and build_workflows — any two phases writing the same path collide."
