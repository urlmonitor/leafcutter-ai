id: BP-600d-3
components:
  - build_pipeline
title: "Quick-fix commits child AC, parent AC, test and fix together in one commit"
component: build-pipeline
level: L2
status: active
readiness: reviewed
priority: medium
work_status: done
criteria: |
  Given the green-phase verification has passed and the mutation proof has held
    — the test is green with the fix applied, red again with the fix reverted,
    and green once more with it restored,
  When the workflow reaches the commit phase,
  Then it dispatches the commit agent (never calls git commit directly),
  And the commit stages at least four files: the new child AC YAML, the parent
    AC YAML whose covered_by was back-linked to that child, the test file, and
    the fixed source file,
  And the parent AC YAML is in that same commit rather than a later one, so the
    parent's covered_by is correct in the very commit that changes the tree and a
    reviewer reads parent and child together,
  And that staging requirement holds whatever the guardian hooks can see, so it
    does not lapse when their scope changes: as observed on 2026-08-25 the AC
    guardian hooks derive their file set from the commit's index and do not read the
    store, so an unstaged parent is never examined and their silence is not a pass —
    and were a hook later to resolve the parent from the store regardless of staging,
    staging it would remain required, because that hook would then BLOCK this commit
    on a covered_by the workflow had left stale rather than passing it,
  And before staging, the child AC's work_status is flipped from todo to done
    and the green test is recorded in its covered_by, in that same commit rather
    than as a follow-up,
  And no file outside that set is staged, so unrelated build-output drift in the
    worktree stays out of the commit,
  And the commit message references the AC ID created during the
    AC-creation phase, and every claim it makes is verifiable in the staged diff.
depends_on:
  - BP-600d
  - BP-600c-3
