criteria: |
  Reviewers can trace from the PR to the L0 goal in one click.

  Every PR includes a reference to the L0 goal it advances, so a reviewer
  who wants to understand the broader context -- why this change matters,
  what strategic outcome it serves -- can navigate there without asking
  the author or searching the AC store.
