test_spec:
  - name: test_finalization_closes_through_the_checking_mechanism
    target_dir: unit_tests/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Step 3.5's prompt instructs set_ticket_status.py --status done for each open ticket."
  - name: test_no_step_writes_the_finished_state_directly
    target_dir: unit_tests/
