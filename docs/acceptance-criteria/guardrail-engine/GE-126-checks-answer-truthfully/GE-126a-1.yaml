it_requirements:
  - "Every assertion must be made against the copy the build deploys under .leafcutter/. A result obtained by running the templates/ source copy is not evidence for this criterion (ADR-001, ADR-013)."
  - "Coverage must reach the check through its process entry point. unit_tests/commit_guardian/test_check_ac_governance.py states in its own module docstring that it calls the hook's internal functions directly rather than by subprocess; that seam does not satisfy this criterion and must not be reused for it."
  - "Must not change the exit status of any commit-time invocation that passes today. The refusal-versus-pass distinction is carried by the machine-readable outcome value; the component's deliberate fail-open-on-internal-error convention (GE-116a-1-iii) is not repealed by this record."
  - "The outcome value must be readable by a caller that parses no prose - a caller must be able to tell refusal from pass without matching on message text."
  - "The violating fixture record must be serialised by the same writer the real store uses rather than written as a hand-indented literal, because an indented-versus-column-zero difference has already produced a parser that was a no-op on every real record (CLAUDE.md, 'Real-artifact behavioral spot-check before declaring done')."
  - "Any module newly imported by the check must be added to the build deploy manifest in the same change and the deployed copy exercised afterwards; a source-tree-only import raises ModuleNotFoundError at hook runtime (CLAUDE.md, 'New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest')."
  - "Error handling must follow the four rules in CLAUDE.md. An except block that neither logs at WARNING or higher nor re-raises is the silent-abstention shape this record exists to remove, reintroduced inside the fix."
test_spec:
  - name: test_argv_named_record_missing_origin_agent_is_refused
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "Deployed check run by subprocess with one AC path as its only argv target, that record new to the index and carrying no origin_agent, reports a refusal whose text names that exact path and the rule broken."
  - name: test_argv_named_clean_record_is_an_ordinary_pass
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The same invocation with a valid origin_agent on the named record reports the ordinary success outcome - the discriminating control that stops the refusal being unconditional."
  - name: test_argv_target_is_judged_when_the_staged_set_is_disjoint_from_it
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "With the violating record named on argv and the git index holding only unrelated clean files, the run still refuses the named record - an implementation that reads the staged set and discards argv cannot pass this."
  - name: test_refusal_and_pass_differ_in_the_deployed_copys_outcome_value
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: "Both runs are executed against the build-deployed copy and are told apart by the returned outcome value alone with no message-text matching."
test_rationale: |
  A direct-import unit test of the target-resolution function would be green against
  the code as it stands on 2026-08-25, because that code resolves targets correctly
  from the staged set — the defect is that argv never reaches the resolver. Only a
  subprocess run whose argv and whose staged set disagree can tell the two apart, and
  only a violating record can prove the resolved target was actually read. The
  disjoint-staged-set descriptor is the load-bearing one: a check that quietly ignores
  argv passes every other descriptor in this list.
delivers_to:
  agent: python-coder
  contract: "The resolved-target set for check_ac_governance: the ordered collection of acceptance-criterion record paths a run will judge, populated from argv when argv names targets. GE-126a-2 extends the same collection with a target that resolved to nothing, and GE-126a-3 populates it from the environment seam. Both consumers require that a member of this collection is judged rather than counted."
