id: GE-126e-4
title: "A diagram shows where the census sits and what it reads to decide who is in scope"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader trying to understand what the census covers and what it does not,
  When they consult the component documentation for the check family,
  Then a diagram shows the census as a participant beside the check family the registration
    data and the surface a reader invokes it from,
  And it shows that the population the census examines is derived from the registration data
    rather than held by the census so a reader can see why a newly registered check is enrolled
    automatically,
  And it shows the census reading and reporting without any arrow into the checks it examines
    so the reporting-not-repairing boundary is visible rather than only written,
  And it shows the relationship to the existing parity comparison including whether the
    execution machinery is shared so the two are not mistaken for one another,
  And every element the diagram names corresponds to something that exists when the diagram
    ships rather than to a planned one.

  Coverage note: covered by a check that every element named in the diagram resolves to a real
  participant in the delivered system and that no participant the census actually reads is
  missing from it. A diagram accepted on inspection alone is the documentation equivalent of a
  check nobody ran.
depends_on:
  - GE-126e
  - GE-126e-1
  - GE-126e-2
  - GE-126e-3
