id: GE-128a-5
title: "How-to: work on a test file that already holds undeclared tests without being refused"
component: guardrail-engine
components:
  - commit_guardian
  - testing_quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a developer whose commit to a test file was refused by the
    test-declaration check's per-file ratchet,
  When they open the how-to guide for the test-declaration ratchet,
  Then the guide states, as numbered steps, how to read the refusal (the file,
    its undeclared count before and after the change, and the named tests that
    raised it),
  And it shows the two ways to make the same change commit: declare the
    requirement on each new test, or bring the file's undeclared count back to
    or below its previous value,
  And it states that the tests already undeclared in the file never need to be
    fixed before the file can be changed,
  And it states that bulk, generated and merge changes get no implicit exemption,
  And every rule it states matches the behaviour specified in GE-128a-2,
    GE-128a-2-i and GE-128a-3.
