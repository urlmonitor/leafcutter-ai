id: BP-1100g-4-i
components:
  - build_pipeline
  - testing_quality
title: "A claim is taken at face value: the promise-versus-claim check never judges whether a test does what it says"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a piece of work whose plan promised a proof that the work is reached the
      way the product is really used,
    And the only test claiming that kind is a pre-existing test of the stated
      behaviour, which imports the unit directly and was given the claim without
      being changed in any other respect,
  When the promise is compared against the claim at hand-off,
  Then the work is NOT refused, because a promise was made and a claim was made,
    And the outcome is identical to the outcome for a piece of work whose claiming
      test does invoke the way in, so the two are indistinguishable to this check,
    And no part of reaching that outcome opens, reads, parses, tokenizes, imports
      for inspection, or pattern-matches the body of the claiming test,
    And the outcome is reported as "promised and claimed" and never as reached,
      proven, verified, or done, so nothing downstream can read it as evidence
      that the work is wired in.
depends_on:
  - BP-1100g-4
