criteria: |
  Given on the store as measured on 2026-10-13, 102 of the 306 stored steps and branches, in 9
    flows, have an input or output that is not defined yet, and the overview's
    'I/O not yet defined' shows 9,
  When a person ticks 'I/O not yet defined' on /flows, or opens /flows?io=gap,
  Then the summary reads '9 flows, 102 steps match',
  And each listed flow's matching steps are exactly its steps and branches with an undefined
    input or output, none more and none fewer,
  And the chip reads 'I/O not yet defined' and never 'I/O: I/O not yet defined',
  And adding 'AI agent' under Actor, at /flows?actor=llm&io=gap, narrows the list to
    '6 flows, 8 steps match',
  And among those the step 'Build a candidate query' is listed, and opening it goes to
    /flows/leafcutter/retrieval-query-build?step=author.
