  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: seam
  description: Inspect the actual dispatched discovery context for supplied decisions, conditional read-only
    inspection, precise human questions and inspection-failure reporting; pair needs_input and error replies
    through existing durable blocker routing.
  covers:
  - ACD-1300c-2
- name: test_adapter_failure_blocks_graph_once_and_persists_diagnostics
