id: INF-400c-4-iv
components:
  - infrastructure
  - knowledge_system
title: "A declared sink that has not been written to yet is a no-work run, not a failure and not a reason to look elsewhere"
component: infrastructure
level: L3
status: active
req_status: active
work_status: done
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-400c-4.yaml"
criteria: |
  Given the declared knowledge-emission sink is created by its first write and
    lives under a directory that version control excludes, so no clone of this
    repository and no newly provisioned install has ever contained it,
  And the routing step will be invoked at the end of every completed unit of
    work once its trigger exists, including on trees where no agent has yet
    emitted anything,
  When the routing step runs and the declared sink is absent,
  Then it reports zero records read and zero records outstanding,
  And the outcome it reports, and the status it exits with, are the same
    outcome and status it reports for a sink that exists and contains no
    records — the no-work outcome, not an error,
  And it creates neither the sink nor the directory holding it as a side
    effect of finding them absent,
  And it opens no other file in place of the absent one: run in a tree where
    debugging/logs/agent_telemetry.jsonl holds 28 knowledge records and the
    declared sink is absent, it still reports zero records read,
  And it says which path it looked for, so a person reading the run's report
    can tell an unemitted-to sink from a misconfigured one without guessing.
depends_on: [INF-400c-4]
