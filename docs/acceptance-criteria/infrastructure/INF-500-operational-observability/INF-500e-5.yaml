id: INF-500e-5
components:
  - infrastructure
title: "The weeks compared are whole calendar weeks, oldest first, ending with the one in progress"
component: infrastructure
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a report asked for 4 weeks relative to Wednesday 2026-08-26,
  When the reporting periods are constructed,
  Then exactly 4 periods are produced,
  And every period begins on a Monday,
  So that week-over-week comparison is between like calendar weeks rather than
    between arbitrary seven-day windows that shift with the day the report is run.

  Given a report asked for 3 weeks relative to Wednesday 2026-08-26,
  When the reporting periods are constructed,
  Then the last period begins on Monday 2026-08-24 — the week containing the
    reference date,
  And that period is therefore the current, still-incomplete week rather than the
    last completed one,
  So that an operator asking today about this week is answered about this week.

  Given a report asked for 3 weeks relative to 2026-08-26,
  When the reporting periods are constructed,
  Then they are ordered oldest first,
  So that the direction of every trend in the report is read left to right without
    the reader checking which end is recent.

  Given a report asked for 1 week relative to Monday 2026-08-24,
  When the reporting periods are constructed,
  Then the single period begins on 2026-08-24 itself,
  So that a reference date that is already a Monday is not pushed back into the
    previous week.

  Given a report asked for 0 weeks,
  When the reporting periods are constructed,
  Then exactly 1 period is produced,
  So that a nonsensical request yields the smallest meaningful report rather than an
    empty one that would leave the report with no most-recent period to describe.
