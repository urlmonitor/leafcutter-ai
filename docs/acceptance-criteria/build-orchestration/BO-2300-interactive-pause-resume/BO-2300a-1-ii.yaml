    status: exists
  - path: docs/known-issues/build-orchestration/open-high-ki-bo-20260901-1620.md
    relationship: related
    status: exists
it_requirements:
  - "The executor agent id is defined once in plan-feature.js and reused by every listed dispatch; it is not repeated as a literal per call site."
  - "The parseAgentJson `agent` labels on those dispatches name the same executor, so a refusal is attributed to the agent that actually replied."
  - "Scope is plan-feature.js only. The identical pause-store dispatches in finalize-feature.js are a known residual, filed separately, not fixed here."
