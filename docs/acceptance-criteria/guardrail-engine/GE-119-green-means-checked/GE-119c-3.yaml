assigned_agent: test-writer
estimated_complexity: M
it_requirements:
  - "The expected set is read AT RUN TIME from templates/scripts/commit_guardian/commit_guardian.json -> hooks_manifest.hooks[] (54 entries today). Never a hand-maintained id list. This is the same rule GE-119a-2-i applies to dispositions, and the reason both ACs exist: a family-wide rule that is not mechanically checked against the family's own registry decays one addition at a time."
  - "COMPARE IN BOTH DIRECTIONS and report each by name: (a) a manifest entry with no harness case is UNCOVERED; (b) a harness case naming a check absent from the manifest is a GHOST. The second guards the other drift direction — a case list that has outlived the checks it names is a sweep that looks thorough and exercises ghosts."
  - "Uncovered or ghost implies the sweep FAILS. A warning is insufficient; coverage that only warns is a convention, not a rule."
  - "EXERCISE WITH A MANIFEST FIXTURE containing an entry that has no harness case. A test asserting the current 54 entries are all covered passes forever and catches nothing on the day check 55 is added, which is the day this AC exists for."
  - "Transform-tier entries (6 today) and the direct-invocation entry (precommit-canary, which does not go through run_hook.py) are in the manifest and therefore in the expected set. If any entry is genuinely not sweepable, the exemption must be DATA-DRIVEN from a property of the entry — for example a declared marker or the tier value — never a hard-coded id, or check 55 inherits the exemption by resemblance."
  - "Expose the comparison as a CALLABLE, not as an assertion buried inside one test: GE-119b-4's parity sweep consumes this as its completeness guarantee and must not reimplement it. Two independent completeness rules will disagree, and the disagreement will be resolved by whichever is quieter."
  - "This comparison is also what GE-119c-1-i's exercised-count clause is measured against — the count is meaningful only relative to the manifest set, not to a constant."
