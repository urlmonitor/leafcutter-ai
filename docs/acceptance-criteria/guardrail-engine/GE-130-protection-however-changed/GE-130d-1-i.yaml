id: GE-130d-1-i
title: Cache files a reading command or a test run leaves behind never stop the run, while a source file
  changed in the same folder does
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a folder a protection watches,
  When the test suite is run and, as a by-product, compiled-code caches and test-runner caches are
    created or updated inside that folder,
  Then the run is not stopped and no cache file is named,
  And given, in the same run, a command changes a source file in that same folder in a way the
    protection's rule refuses,
  When that command finishes,
  Then the run is stopped naming that source file, and no cache file is named beside it.
