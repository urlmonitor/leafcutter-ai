  - path: templates/scripts/commit_guardian/check_sql_complexity.py
    relationship: related
    status: exists
  - path: templates/agents/python-coder.md
    relationship: related
    status: exists
    relevance: "Requires the complexity-reduction skill to exist in .claude/skills/ and invokes it for every function over the threshold."
  - path: docs/acceptance-criteria/guardrail-engine/GE-120-green-means-checked/GE-120h-5.yaml
    relationship: related
