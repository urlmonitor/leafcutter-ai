id: UXP-100b-1
title: "Gap detection produces a named list of missing components with usage context"
component: ux-prototyping
level: L2
status: active
readiness: draft
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the component library catalog contains "navigation-bar", "data-table",
    and "form-panel",
  When the UX designer agent composes a prototype for a feature that requires
    a "timeline-view" and a "progress-indicator" (neither in the catalog),
  Then the agent produces a gap report listing each missing component by name:
    "timeline-view", "progress-indicator"
  And each gap entry includes the context of where the component would be used
    in the prototype (e.g. "main content area, showing event sequence")
  And the agent does not substitute an improvised replacement for any missing component
