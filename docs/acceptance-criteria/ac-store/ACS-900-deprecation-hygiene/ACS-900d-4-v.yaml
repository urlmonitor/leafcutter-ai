criteria: |
  Given the real store records INF-600g-3 (L2, work_status "done") and
    INF-600g-3-i (L3, work_status "done", no test tagged as covering it),
    which specify the advisory skills_invoked cross-reference that AR-400c-1
    deleted,
    And AR-400c-1 exists in the store,
  When both records are changed to status "superseded_by" with
    superseded_by: [AR-400c-1], leaving work_status "done", readiness
    "approved" and change_target "code" untouched, and the change is staged
    together with their parent INF-600g,
  Then every AC-store commit gate passes on that staged set with no refusal
    naming INF-600g-3, INF-600g-3-i or INF-600g,
  And neither record gains a test contract, a covering-test tag, or a changed
    readiness or change_target in order to pass.
