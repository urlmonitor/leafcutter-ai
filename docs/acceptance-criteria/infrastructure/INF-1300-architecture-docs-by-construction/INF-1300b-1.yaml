criteria: |
  Given documents produced for two different kinds of picture at two different
    tiers,
  When the produced documents are compared section by section,
  Then they carry the same named sections, in the same order, and each named
    section appears exactly once in each document,
  And no produced document omits a section another produced document has, and
    none carries a section the others do not,
  And the only differences between them are the values taken from the request,
    the picture skeleton belonging to the kind, and the explanatory key belonging
    to the kind,
  And this holds across every kind the project's vocabulary declares as current,
    enumerated from that declaration rather than from a list written into the
    observation.
