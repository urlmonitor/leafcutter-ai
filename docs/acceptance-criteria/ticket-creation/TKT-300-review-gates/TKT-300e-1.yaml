criteria: |
  Given an L2 AC whose criteria describe a behavior that requires
    changes to file types owned by two different agents
    (e.g., backend logic and frontend rendering),
  When the IT PO evaluates the AC for enrichment,
  Then it determines that a single assigned_agent cannot implement
    the full criteria,
  And it initiates the split procedure to produce one child AC per agent.
