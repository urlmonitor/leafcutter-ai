req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  A commit that dies partway leaves no debris behind in the shared repository.

  If a delivery is interrupted or fails midway during a parallel drive, it does
  not leave a half-written object or a poisoned index for the next delivery to
  stumble over -- the shared workspace is returned to a clean, usable state.
