roadmap_phase: phase_1
criteria: |
  One command, one AC id, a PR back — no other input.

  An operator names any single acceptance criterion and the fast lane does the rest:
  it opens a fresh isolated worktree from the latest mainline, works out everything
  that AC is connected to (the whole subtree beneath it plus the genuine prerequisites
  it is waiting on that are not yet done — belonging to the same parent is not itself
  a reason to be included, see BO-2600b), builds that set in dependency order through
  the lean two-agent loop, and opens a pull request. The operator does not create a
  worktree, list a batch, or open the PR by hand. Pointing at the AC is the go-ahead,
  so a not-yet-approved AC is still built.
