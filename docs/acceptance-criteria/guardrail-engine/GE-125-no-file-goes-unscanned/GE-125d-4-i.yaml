it_requirements:
  - "ONE DEFINITION, TWO READERS. The set of reduced locations must have exactly one definition in the canonical copy — today the _PROSE_FILE_PREFIXES tuple in templates/scripts/commit_guardian/check_secrets.py — and BOTH the reduction decision (_is_prose_exempt) and the self-description must read it. Adding, removing or renaming a location in that one place must change the answer with no other edit anywhere. A second list, a docstring copy, or a constant duplicated for rendering is the defect, not an implementation detail."
  - "The condition must be derived, not transcribed. It is not enough for the answer to list the location names; it must state the condition as the check applies it. Today the test is a substring test against the whole path, so the answer must not describe the set as four root-anchored directories. If a sibling changes the matching rule, the answer must change with it for the same reason the location list must — one definition, two readers."
  - "Drift must be unreachable in BOTH directions. Over-reporting what is unexamined trains a reader to discount the answer and ends in the same place as under-reporting, so the removal arm is not a symmetry nicety — it is the arm that fails an implementation that appends to the answer without ever pruning it."
  - "VERIFICATION EXECUTES BOTH HALVES. Ask for the answer, then check a path, then compare. A test that reads the source and observes that both come from one place reproduces exactly the verification method this goal exists to replace, and would pass on a refactor that reintroduced a second list one release later. The anti-precedent is load-bearing and already cited twice in this component: a guard here is documented as automatically dispatching a specialist and does not, because its remediation path is a placeholder that always reports success — a documented-but-dead promise is worse than a missing one, because authors believe they are covered."
  - "Exercise the fifth-location and removed-location changes INSIDE the test — by patching or parameterising the single definition for the duration of the run, against a throwaway repository — and never by editing the real canonical file at test time. A test that mutates templates/scripts/commit_guardian/check_secrets.py on disk leaves the working tree dirty and can leak a widened exemption into a real commit."
  - "No fixture under an existing reduced location is needed here, and one should not be added. The subject is the answer, not a scan. Where a path is required to confirm the classification, use an ordinary source path inside the throwaway repository that the change under test makes reduced or not reduced, so the arm measures the change rather than the pre-existing set."
  - "ADR-001 parity: the single definition lives in the canonical copy under templates/. Run `python scripts/build.py --target-dir .` and confirm the derived answer is identical in the deployed copy; check_hook_parity enforces all four locations, so a divergence between the definition and the rendering would surface there as a parity failure rather than as a wrong answer."
