  contract: "The shared reading-class instrument with a per-source-form extractor table: extract_references(path) -> [{element_id, claimed_as_project_part: bool}], plus the two-way registry comparator lifted out of check_agent_spawn_consistency.py. Consumed by BO-3500c-2-i (written page), by this record (diagram), and back by the check_agent_spawn_consistency commit hook, which must call it rather than keep its own copy."
