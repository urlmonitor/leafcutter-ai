title: "A phase agent is not dispatched into a run that withholds the capabilities its own instructions require"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run is about to dispatch a phase agent whose own instructions require it to
    invoke two named quality capabilities on every source file it changes,
  When the run prepares that dispatch and compares the capabilities the agent would be
    able to invoke against the capabilities its instructions require,
  Then a dispatch that would leave either required capability out of reach is held back
    before the agent is spawned,
    And the run states which required capability was out of reach and which agent
      required it,
    And a dispatch in which both required capabilities are within reach proceeds, and
      once the agent returns, the run can show that each of the two capabilities was
      actually invoked during that dispatch,
  So a craft is never asked to perform a check the run has already made impossible.
