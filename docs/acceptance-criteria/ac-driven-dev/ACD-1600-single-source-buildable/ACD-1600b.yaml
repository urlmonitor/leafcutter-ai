title: "Agents read their spec straight from the store, not a ticket copy"
component: ac-driven-dev
level: L1
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Every builder pulls the authoritative requirement from one place.

  Each phase agent -- the one that writes tests, the one that writes code, the one
  that validates -- gets its authoritative requirement by following a reliable
  pointer to the store, rather than trusting a copy pasted into the ticket. What
  the agent builds against is always the live, single-source requirement.
