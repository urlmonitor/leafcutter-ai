      readiness AND test_spec CORRECTED 2026-10-09, AFTER THIS ENTRY FIRST KEPT
      approved. approved means cleared FOR BUILDING, which a retired record never is;
      the fact that this record was approved from 2026-10-05 to 2026-10-09 is
      preserved by saying so here rather than by a field that invites work. test_spec
      is CLEARED to null, with test_required: false, and its three descriptors moved
      into notes under "THE RETIRED TEST CONTRACT". A first attempt kept the
      descriptors in test_spec behind per-entry "RETIRED — DO NOT AUTHOR" markers;
      check-ac-schema refused it, because test_required and test_spec are one
      declaration and "no tests needed" plus "here are three tests" is a
      contradiction. The gate was right, and the underlying error was the same one
      made on work_status and readiness: a present-tense field being used to carry
      history. Write the history down; let the field be honest. The four-field
      retired-record shape is on INF-600b-2's notes under "HOW TO RETIRE AN AC"; the
      parent TQ-600a-11 carries the same correction.


      THE THIRD DESCRIPTOR CARRIES A POINTER WORTH KEEPING. The portability risk this
      record covers — an adopter whose PyYAML was built without libyaml — is real and
      permanent, and after this change the only site resolving the C class is the
      pre-existing guarded inline form in scripts/render_effective_prompt.py. Its
      marker says where that concern would have to live if anyone wants it asserted
      rather than assumed.


      WHY. This record covers one branch of one function: the shared accessor's choice
      of the pure-Python parser when the C class is absent from the yaml module. Its
      own expects_from names that accessor as "the single place the fallback decision
      is made and therefore the only place this record has to check". The accessor's
      one production caller is the agent-card generator's whole-AC-store walk, which
      the static-cards change deletes. A fallback on a decision nobody makes is not a
      smaller requirement, it is no requirement.


      ONE CLAUSE SURVIVES AND IS ALREADY SATISFIED ELSEWHERE, SO IT IS NOT LOST BY
      RETIRING THIS RECORD. The portability concern — an adopter whose PyYAML was built
      without libyaml must not get an ImportError or AttributeError at module load — is
      real and permanent. After this change the only site in the package that resolves
      the C class at all is the pre-existing inline
      `getattr(yaml, "CSafeLoader", yaml.SafeLoader)` in
      scripts/render_effective_prompt.py, which is ALREADY the guarded form this record
      demands and which predates the accessor by some margin. So the risk this record
      was written against is closed by construction rather than by a test, and that is
      a weaker guarantee than this record wanted. If the user wants the guarded form
      asserted rather than assumed, it belongs on a record about that one inline site,
      not on a record about an accessor with no callers.


      ARTIFACT NOTICE, SAME AS THE PARENT'S. unit_tests/ac_store/test_tq_600a_11_i.py
      exists on origin/main despite this record reading work_status: todo. It must be
      retired or re-pointed deliberately with the code change, not left to go red.
