risk_surface: contract_boundary
notes: |
  Why this is NOT a duplicate of BP-1100b-1 or BP-1100b-2. Those two are authoring
  instructions scoped to one trigger and one actor: -1 makes ticket-supervisor
  dispatch test-writer when a workflow .js file is in files_touched, and -2 tells
  test-writer what kind of test to author for a modified workflow function. Both
  are advisory-by-construction — they constrain an agent's behavior at authoring
  time, and both only fire when a ticket modifies workflow JavaScript.

  This AC is a DETECTION rule over the change itself. It fires on the assertion
  shape irrespective of author (test-writer, a coder, or a human), and
  irrespective of whether the change touched the workflow source at all — which is
  exactly how both confirmed grep-only tests reached main.

  THREE CORRECTIONS FROM THE 2026-08-13 EXPERT REVIEW. Each replaced a clause that
  looked precise but was not implementable as written:

  1. "GUARDRAIL-GATE SOURCE FILE" COLLIDED WITH EXISTING VOCABULARY. In this
     repository that phrase already denotes `config/guardrail_gates.yaml` — a
     config that maps change_target/risk_surface to injected agents (see
     `scripts/ac_store/generate_ticket_from_ac.py` L202, L566, L701). It contains
     no gate logic and is not a plausible target of a presence assertion. An
     implementer reading the old wording would have scoped the rule at the wrong
     file. The criteria now name path globs instead of a category noun. If the
     glob set is wrong, amend the globs — do not reintroduce a category name.

  2. THE OLD EXEMPTION WAS NOT STATICALLY DECIDABLE. It exempted an assertion
     "accompanied in the same change by a test that executes that symbol's
     behavior". Deciding that requires call-graph reasoning across a
     JavaScript/Python boundary. Every implementer would approximate it as "some
     test in the change mentions the symbol" — which every incumbent violation
     already satisfies, so the rule would report nothing. It is replaced by an
     explicit `# presence-only: <reason>` waiver: a decision a human writes down,
     which is greppable, reviewable, and countable. The FIN-100c-14 precedent
     (thin smoke checks alongside real coverage) is preserved by that waiver, not
     by inference.

  3. WHOLE-FILE SCANNING WOULD MAKE THIS UNMERGEABLE. A reviewer counted 46
     pre-existing violations across `unit_tests/workflows/` and
     `unit_tests/commit_guardian/`. As a blocking whole-file gate the rule fires
     46 times on its own introducing commit. Staged-hunks-only makes it a
     ratchet: the backlog is cleaned by the sweep below, and nothing new lands.

  DEAD-TEST INVENTORY for the follow-up sweep (NOT in this AC's scope — recorded
  so it is not rediscovered). `unit_tests/workflows/test_bo2400a_runner_wiring.py`
  class `TestIntegrationReferencesNotDormant` holds THREE identical presence
  assertions, not one:
    - `test_h1_choose_lane_referenced_in_runner` (~L351) — choose_lane
    - `test_h1_emit_agent_telemetry_referenced_in_runner` (~L373) — emit_agent_telemetry
    - `test_h1_assemble_context_bundle_referenced_in_runner` (~L394) — assemble_context_bundle
  Each asserts only that the symbol's name appears in `fast-lane-build.js`. Two of
  the three backing modules — `scripts/build_orchestration/path_selection.py` and
  `scripts/injection_builders.py` — have no `__main__` entry point, so the JS
  cannot invoke them as scripts and the symbols cannot be reached from the runner
  at all. Fixing one of the three and leaving two is the likely failure mode of a
  sweep that has not read this note.

  NAMED NON-TARGET: `unit_tests/workflows/test_bo_1000a_2_i.py` (~L166) asserts
  that the literal string "BO-1000a-2-i" appears in `finalize-feature.js`. That is
  the correct test for a documentation-marker requirement — the AC it covers asks
  for the policy to be documented in the source — and the rule must not report it.
  Any implementation that flags it has over-matched.

  Deliberately left open for it-po: the enforcement surface. "Checked before the
  change is accepted" is satisfiable either by a mechanical pre-commit gate over
  the staged test diff or by a pr-reviewer checklist item; the criteria constrain
  the outcome, not the mechanism. A mechanical gate is the stronger reading given
  that the incumbent instances survived review — and note the staged-hunks
  scoping in the criteria already assumes a diff-aware checker.

  IT-PO DECISION (2026-08-17) on that open question: MECHANICAL PRE-COMMIT GATE.
  Grounds: (a) both confirmed incumbent instances passed human review, so a
  reviewer checklist item is the mechanism already shown not to work here;
  (b) the criteria's staged-hunks scoping presupposes a diff-aware checker, which
  a checklist item is not; (c) a checklist item cannot produce the machine-readable
  waiver listing the second scenario requires. The gate is registered in
  templates/scripts/commit_guardian/commit_guardian.json in BOTH locations — the
  per-hook config key and the hooks_manifest entry — because the config key alone
  is inert and the manifest entry is what actually runs. Verification must exercise
  the DEPLOYED copy under scripts/commit_guardian/ after build.py; a templates-only
  edit leaves the running gate unchanged.

  Calibration constraint worth carrying into implementation: the rule must match
  both the substring form and the regular-expression declaration form.

  Tree note: BP-1100 (L0) has one L1 slot remaining (a-f of 7); no new L1 was created.

  `delivers_to: null` IS A DECISION, NOT AN OMISSION — DO NOT REFILL IT (2026-08-25).
  A later enrichment pass will find this field empty and be tempted to set
  `agent: python-coder`, which is what it held before. It was removed on purpose.

    - This gate is TERMINAL. A reverse index over all 3,376 records found nothing
      declaring `expects_from: BP-1100b-5` and nothing listing it in `depends_on`.
      No AC consumes its output. The sweep that will clean the 46 pre-existing
      violations is named in these notes as out of scope and HAS NO AC ID — it is
      not a consumer, because it does not exist.
    - Its output is a refusal. The interface is the exit status; the report text is
      for a human. THERE IS NO PROGRAMMATIC CONSUMER OF THE REPORT TEXT, so do not
      design a machine-readable schema for it and do not treat its format as a
      stability obligation.
    - The field's only live readers are `pr-reviewer` (Cross-File Contract Tracing)
      and `ac-validator` (§2d). Both are instructed to OPEN THE CONSUMING FILE named
      in the contract. `agent: python-coder` sent them to open the file the coder had
      just written, to confirm it contains what the coder had just put in it — a
      tautology that consumed a review pass which would otherwise catch something
      real. Naming no consumer is more honest than naming a false one.
    - Self-reference itself was NOT the problem, and that is worth recording because
      it is the obvious wrong lesson to draw. 502 of the 786 records with a populated
      `delivers_to` (64%) name their own `assigned_agent`; it is the store's majority
      idiom, and in the rest of the BP-1100 family it is deliberate — the agent slot
      means "the next AC is also a python-coder job" while the CONTRACT TEXT names the
      consumer by id (BP-1100a-3 -> a-4, BP-1100e-1 -> e-2, BP-1100g-3 -> g-4). This
      record was in the ~110-record minority that names a counterparty while having
      none.
    - Considered and rejected: `agent: commit`, on the BP-1100g-4 precedent. Defensible
      — same tree, same refusal-plus-exit shape — but `commit` does not read the ticket
      body either, so it buys a trace only in the sense of pointing a reviewer at
      templates/agents/commit.md. The refusal criterion added above covers the same
      risk mechanically, which is stronger than covering it by review.

  OPEN, NOT ADDRESSED HERE: the hook will not be in `blocking_hook_ids`. That closed
  7-hook allowlist in templates/scripts/precommit-autofix.json is what the
  precommit-autofix skill consults; a hook absent from it is treated as NON-GATING and
  skipped entirely, no fixer dispatched. Nothing in this record's it_requirements,
  constraints or doc_links mentions that file, so as specified this ships a gate the
  autofix loop ignores. It is a FOURTH registration leg the three-way create-hook
  procedure does not cover, and it is a general gap rather than one specific to this
  AC — filed as a known issue against commit-guardian rather than patched in here.
