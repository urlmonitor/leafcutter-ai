it_requirements:
  - "THIS IS THE ONLY PLACE IN THE TREE THAT MUTATES AN EXISTING DOCUMENT, so the write into the parent must be SURGICAL: insert one entry into the parent's `children:` sequence and change nothing else. A whole-file rewrite, a YAML round-trip that reflows the parent's frontmatter, or a re-serialisation that reorders keys or normalises quoting is a failure even when the resulting document still passes every check. Verify by line-level diff of the parent before and after, not by re-parsing it."
  - "IDEMPOTENT ON THE PARENT: naming the same parent twice must not add a duplicate children entry, and a re-run must leave the parent byte-identical."
  - "MEASURED — THE CHECK DEMANDS THREE THINGS, NOT THE TWO SKILL.md SECTION 6a DESCRIBES. check_mermaid_parent_link requires (1) a `parent:` frontmatter field, whose absence is its own named violation ARCH-PARENT-MISSING on any document containing a mermaid fence, (2) the prose link, found by searching for the parent's BASENAME anywhere after the first mermaid fence's closing delimiter (ARCH-MARKDOWN-LINK), and (3) the parent's `children:` list containing this file's basename or path (ARCH-BIDIRECTIONAL). It additionally refuses a parent that does not exist (ARCH-PARENT-NOTFOUND) and one whose flight_level is not strictly higher (ARCH-LEVEL-ORDER). Every scaffolded document carries a fence, so all of this fires immediately."
  - "THE CRITERIA ARE STRICTER THAN THE CHECK AND THE STRICTER PART MUST BE ASSERTED DIRECTLY. _validate_markdown_link only requires the parent's basename to appear somewhere after the fence, so a bare filename, a path in a URL, or a link whose visible text is the filename all satisfy the hook. The criterion 'naming it by the human-readable title the parent gives itself' is therefore invisible to the hook: assert that the link's visible text equals the parent document's own frontmatter `title:` value."
  - "PROSE LINK PLACEMENT: the hook searches only the region AFTER the first mermaid fence closes. A `Parent:` line emitted above the diagram satisfies a human and fails the check. Emit it below the first fence, with the case-sensitive `Parent: ` prefix SKILL.md section 6a pins."
  - "REFUSAL LEAVES NOTHING BEHIND: when the named parent is absent or not at a strictly higher tier, no file is written at --output, no directory is created, and the parent is not touched. The shape and wording of the refusal is INF-1300d-3's; this record requires only that the refusal happens and that the filesystem is unchanged afterwards."
  - "All of INF-1300a-1's vacuous-green guards apply unchanged and are load-bearing here, because check_mermaid_parent_link is the single hook most able to exit 0 having examined nothing: its REPO_ROOT is `Path(__file__).resolve().parents[2]`, a module-level constant from the hook's own location, while its file list comes from the cwd repo's staged index. Use a-1's scratch harness; never a bare tmpdir."
  - "Error handling per the project error-handling policy (CLAUDE.md rules 1-4). Reading and rewriting the parent is external I/O and must be wrapped with named exception types; a partial write that leaves the parent truncated is the worst outcome available here and must be impossible (write-then-replace, never truncate-then-write)."
