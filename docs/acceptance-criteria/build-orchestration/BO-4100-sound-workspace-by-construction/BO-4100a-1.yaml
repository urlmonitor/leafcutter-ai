  - worktree_manager
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
package_surface: false
criteria: |
  Given the machine's local copy of the main line is 39 commits behind the
    shared main line,
  When a workspace is created through each of the supported creation paths --
    the general-purpose path, the acceptance-criteria authoring path, and the
    fast-lane path --
  Then the commit each newly created branch is rooted at is the current tip of
    the shared main line,
  And the commit each newly created branch is rooted at is not the machine's
    local main-line copy,
  And this holds identically for all three paths, with no path producing a
    different rooted commit from the others.
