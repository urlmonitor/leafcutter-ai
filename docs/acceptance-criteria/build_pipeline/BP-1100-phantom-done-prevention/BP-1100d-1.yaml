id: BP-1100d-1
title: "A pre-commit guard blocks workflow JavaScript that pairs git commit with a non-commit agent"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a staged .js file under scripts/workflows/ or templates/workflows-js/ that
  contains a workflow step assigning an agentType of "status-checker" (or any agent
  other than "commit") in proximity to a git commit instruction,
  When the pre-commit guard runs on the staged files,
  Then the commit is blocked,
  And the guard's message names the offending file and the prohibited
  agentType/git-commit pairing,
  And a workflow step that dispatches agentType "commit" for its git commit, or runs
  under COMMIT_AGENT_MODE=1, is not blocked.
depends_on:
  - BP-1100d
