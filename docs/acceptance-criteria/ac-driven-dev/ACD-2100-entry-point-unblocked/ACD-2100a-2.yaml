notes: |
  THE SECOND LAYER, separate from the path. Verified by the PO on 2026-08-25:
  `_git_toplevel()` in templates/scripts/setup_ticket_worktree.py defaults its
  anchor to `Path(__file__).resolve().parent` with no fallback. For the deployed
  copy that directory is `<workspace>/.leafcutter/scripts/`, and `<workspace>` is
  untracked -- the git root is `leafcutter-ai/`, one level DOWN -- so `rev-parse`
  exits 128. Reproduced:

    $ git -C /home/henzeh/projects/leafcutter/.leafcutter/scripts rev-parse --show-toplevel
    fatal: not a git repository ...

  The function's own docstring names this exact layout as the thing it protects
  against and then asserts "the script always lives physically inside the
  repository it operates on", which under self-hosting is false.

  WHY EXISTING TESTS MISS IT ENTIRELY -- READ BEFORE WRITING THE TEST. Unit tests
  for this script invoke it from a `tmp_path` fixture that IS a git repository, so
  the default anchor always resolves and the fallback is never exercised. Per
  CLAUDE.md "Gate / Workflow ACs -- Verify Behaviorally", the Given here must be
  built for real: a directory that is genuinely not a repository, with the script
  copied outside the repository it is pointed at. A test that greps for a
  resolution helper, or that reuses the repo-shaped tmp_path fixture, proves
  nothing. Same fixture bias as the check_secrets root-resolution defect fixed in
  GE-118a-1.

  THE STDERR CLAUSE IS DELIBERATE. A silent fallback is indistinguishable from the
  anchor having worked, so the next person to debug a wrong-repository worktree has
  no signal. The 2026-08-18 hand-patch of the deployed copy warned on stderr when
  the fallback fired; that instinct was right even though the patch itself
  evaporated on the next build.

  AMBIGUITY IS NOT COVERED HERE. Exactly one candidate is the Given. Two or more is
  ACD-2100a-2-i, and it must refuse rather than pick -- guessing a repository is
  worse than failing, because the worktree lands in the wrong project.

  2026-08-25 (it-po): the delivers_to contract to ACD-2100a-2-i is written as "the
  search returns its full candidate set" on purpose. If the resolver's internal
  contract is "return the repository", the ambiguous case has nowhere to live and
  a-2-i becomes unimplementable without re-opening this record. The shape of the
  return value is the coder's choice; that it can represent more than one candidate
  is not. Search bounding is stated as a policy constraint rather than an algorithm --
  an unbounded upward walk is the obvious first implementation and it is the one that
  reaches unrelated repositories on a developer machine.
