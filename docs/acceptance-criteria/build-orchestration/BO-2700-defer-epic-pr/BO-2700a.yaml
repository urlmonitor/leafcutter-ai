criteria: |
  As the build system, when driveTicketPhases runs for a ticket that is part of an
  epic drive, I want it to exclude the pull-request phase from the dispatched
  phases (so no PR is opened per ticket), while leaving standalone single-ticket
  behavior unchanged — so an epic produces exactly one PR, opened by finalize.
