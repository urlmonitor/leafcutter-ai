notes: |
  WHY ALL THREE RUN KINDS. Each reports step outcomes through a different surface (fast-lane-ship,
  ticket-supervisor's comment/status protocol, finalize-feature's step log). A fix in one does not
  carry to the others.

  (c) is the pre-reroute state of step 3.5: under identity enforcement without GE-129c-1, this is
  what must happen -- a visible failure, never the closure quietly skipped. It is the Q6 coupling
  seen from the failure side.

  The general "every step really runs or visibly fails" rule is BO-3100's; this record pins the
  commit refusal as an instance and does not restate BO-3100's retry or evidence rules.

  declares_side_effect: false -- the Then clauses assert a failure report and an unchanged working
  tree.
