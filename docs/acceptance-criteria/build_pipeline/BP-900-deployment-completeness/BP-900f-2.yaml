criteria: |
  Given the tracked-source guard has classified the deployable-script source set
    and found two scripts whose source is untracked:
    scripts/feedback/submit_feedback.py and scripts/feedback/aggregate.py
  When the guard completes during the build
  Then the build exits with a non-zero exit code
  And the build does not produce a successful output and writes no partial
    deployment to the target
  And the failure report names each untracked source path
    (scripts/feedback/submit_feedback.py and scripts/feedback/aggregate.py)
  And the report is written to stderr
  And when the deployable-script source set contains no untracked source, the
    guard does not affect the exit code and the build proceeds
