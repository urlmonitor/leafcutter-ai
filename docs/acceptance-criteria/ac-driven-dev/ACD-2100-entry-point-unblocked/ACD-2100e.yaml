criteria: |
  Where the route stops to ask you and how to answer it are both written down.

  The points at which the route waits for a decision are set out in one place,
  together with what becomes of the run when nobody answers. Someone who finds a
  run waiting can see what it is waiting for and get it moving again from the
  documentation rather than by working it out from the program itself.
