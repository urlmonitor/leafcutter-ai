risk_surface: safety
criteria: |
  Given a workspace "alpha" holding nothing unsent, whose line of work exists on
    the shared project, and a shared project that refuses to delete that line,
  When clearing "alpha" is requested together with deletion of its line on the
    shared project,
  Then the request ends with a failure naming the deletion on the shared project
    as the step that failed,
  And "alpha"'s folder and files are identical before and after,
  And the line of work on the shared project is identical before and after.
