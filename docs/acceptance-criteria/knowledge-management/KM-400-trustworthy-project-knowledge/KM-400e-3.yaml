criteria: |
  Given a fake retrieval port supplies one attributable result through the registered capability
  When a kernel run requests that knowledge
  Then the existing invocation path consumes the compact evidence and records retrieval and evidence references
  And the run succeeds without a database in this proof
  And follow-up disclosure stops when sufficient, unchanged, unsupported, unavailable or budget-exhausted
  And no backend session, executable query or credential enters kernel state
