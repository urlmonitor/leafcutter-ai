notes: |
  THE BIGGEST UPSIDE AND THE THINNEST EVIDENCE IN THE SET, AND THOSE ARE THE SAME FACT.
  The analysis this record is specified against marks this item explicitly as "not
  reliably quantifiable" — the copy was never instrumented. Copying over eleven thousand
  files instead of about five hundred, eight times per run, is very unlikely to be free,
  but the only honest form for that sentence in an acceptance criterion is a requirement
  to measure, which is what the criteria say.

  WHY THIS SITS UNDER THIS L1 AT ALL. The parent's subject is expensive preparation paid
  for once rather than repeatedly. This record is a cheaper-preparation lever rather than
  a shared-preparation one, which is the same imperfect fit the parent already records
  for TQ-600a-11 and accepts for the same reason: the preparation in question is a
  package copy made so a build can run against it, which is squarely this L1's cost
  centre. If a product-owned split of the TQ-600 tree creates a home for cheaper-work
  levers, re-parent this record alongside TQ-600a-11.

  WHAT IS NOT HERE. The sibling file that also uses the smaller helper has its own
  identified saving of about 37 s, by merging three mutation shapes so that one execution
  serves both the message assertions and the produced-tree assertion. That is deliberately
  excluded — see TQ-600a-9's notes for the reasoning. This record changes copy size in one
  file and nothing else.
