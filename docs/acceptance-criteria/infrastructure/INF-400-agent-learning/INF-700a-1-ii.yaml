id: INF-700a-1-ii
components:
  - infrastructure
  - knowledge_system
  - build_orchestration
title: "A routing step that cannot finish says so where the work is reported, and changes nothing about the work"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a-1.yaml"
criteria: |
  Given a unit of work has completed successfully and the routing step that
    follows it cannot finish — the declared sink cannot be read, or a
    destination file cannot be written,
  When the driver reports the unit of work finished,
  Then the reported result names the routing step as having not completed and
    states what it could not do,
  And the outcome the driver reports for the work itself, and the status the
    driver exits with, are the same as they would have been had the routing
    step written every record — so no unit of work is failed, retried or
    blocked by a knowledge step,
  And a record the routing step could not write is not recorded as written: a
    later run, once the cause is removed, writes it,
  And a unit of work during which the routing step did not run at all is
    reported as a third case, distinct both from a routing step that ran and
    wrote nothing because there was nothing to write, and from one that ran and
    failed,
  And a unit of work that FAILED still reports which of those three cases its
    routing step fell into, so a failed drive is not also a silent one.
depends_on: [INF-700a-1]
