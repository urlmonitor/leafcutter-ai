id: BP-1200b-1
components:
  - build_pipeline
title: "A blocking test check runs the full suite on every pull request and fails when any test fails"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the continuous-integration configuration for the repository,
  When a pull request is opened or updated,
  Then a dedicated test check runs the full test suite automatically using the
    documented CI test command
  And the check reports a failing (non-passing, blocking) result whenever one or
    more tests fail
  And the check reports a passing result only when the entire suite passes
  And the check is a hard, blocking check — not an advisory or informational one
    that a pull request can be merged despite.
depends_on:
  - BP-1200b
  - BP-1200a-1
