id: BO-4000d
title: "The worktree step asks about the repository using a reference drawn from the target it resolved, so a healthy worktree is never called unavailable because of where the run was launched"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given a linked worktree for the target that exists, belongs to this repository, sits at
    the location the workflow named, and is on the target's own branch
  When the worktree step runs from a working directory that is not inside any git
    checkout — as a phase agent does in the dev self-hosting layout, where the process
    directory is the workspace parent rather than the package clone
  Then the step still recognises that worktree as this repository's own
  And the run proceeds to dispatch phase agents
  And it does not stop with `worktree-base-unavailable`.

  Given the same run and the same working directory
  When the step asks the repository-facts mechanism any question — whether a candidate path
    is this repository's linked worktree, where new worktrees belong, or how a branch stands
    against the mainline
  Then every one of those questions carries a repository reference the step derived from the
    target it has already resolved
  And none of them is left to be answered relative to the process's own directory.

  Given a run whose resolved target is not an absolute location, so no reference can be
    drawn from it
  When the worktree step asks those same questions
  Then it falls back to the previous behaviour rather than inventing a reference
  And the run's outcome is no worse than it was before this record.

  Given a worktree that genuinely is absent, foreign, or occupied
  When the step asks with a correctly derived reference
  Then the existing refusals still fire on their own terms
  And this record widens nothing about which worktrees are accepted.
