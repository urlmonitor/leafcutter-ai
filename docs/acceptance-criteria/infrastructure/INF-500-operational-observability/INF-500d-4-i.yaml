it_requirements:
  - "WHAT 'CANNOT BE DETERMINED' MEANS UNDER THE ADOPTED MECHANISM. The enduring location is the build-time declaration (INF-500d-4, rule (c) as superseded), so it is undeterminable exactly when <output_root>/config/knowledge_sink.json is absent, unreadable or unparseable, lacks the feedback_sink or operational_log_root key, holds a value that is not absolute, or is STALE in INF-400c-4-v's sense (the declared directory's enduring project root no longer exists). Each of these must take the refusal branch. Version control plays no part in resolution any more: a project with no repository, or a caller with no git on PATH, resolves normally from its declaration. The criteria's first-scenario examples ('not under version control', 'tooling unavailable') are therefore exercised as SUCCESS cases that land in the declared location — the caller confirms it is not the disposable workspace from INF-500d-4-ii's '[submit_feedback] sink: <path>' line — and the refusal branch is exercised through the declaration cases above. See caveat: the Given wording should be updated by the BA."
  - "NO SILENT FALLBACK, IN ANY FORM. In every undeterminable case the writer must not write to a path derived from __file__ (the _find_project_root walk for .claude/ that KI-FC-001 identifies as the root cause), from the current working directory, or from the worktree root. Nothing is written anywhere."
  - "THE REFUSAL MUST BE LOUD AND LEGIBLE: one stderr line naming the expected declaration path and which condition failed (absent, unreadable, missing key, not absolute, stale), a non-zero exit, nothing on stdout, and no sidecar id file. An empty stdout is what stops every FB_ID=$(...) caller from mistaking a refusal for a captured id."
  - "The refusal reason must map to INF-500d-3's 'the destination could not be written' reason, or to a distinct closed-set reason if INF-500d-3 adds one. It must never present as 'written but the identifier was not captured', because nothing was written: that keeps the submission eligible for INF-500d-5's hold queue, where a written-but-uncited record must never go."
  - "THE VERDICT IS STILL DELIVERED (bounded by INF-500d-3). A refusal must not raise into its callers: emit_hook_finding.py's in-process call must stay failure-isolated, and the signoff path's existing submit-failed marker route must keep working unchanged."
  - "DO NOT CONJURE THE ENDURING ROOT. The writer may create only the final log directory beneath an enduring project root that already exists (the ordinary first-write case). It must never create the project root or any directory above the log directory, because that turns a stale install into a healthy-looking empty one (INF-400c-4-v)."
  - "SECOND SCENARIO, NO SECOND LOCATION. A plain-checkout install's build declares <target_root.parent>/debugging/logs, and a worktree-based drive of that install inherits the same recorded value (INF-500d-4-iii), so both resolve to one location without any branch on whether worktrees are in use. The writer must not contain a worktree-detection branch."
  - "An explicit --jsonl override stays the caller's responsibility and is never refused (the same rule as the harvester's --sink), and INF-500d-4-ii's sink line still reports where it went."
  - "templates/scripts/feedback/submit_feedback.py is over the 400-line check-file-size limit (637 lines): resolve and refuse through an extracted helper or a shared declaration reader, leave the file within the ratchet, and never SKIP check-file-size."
  - "Must handle errors gracefully per the project error handling policy: wrap the declaration read in typed except, report at WARNING or above, and never swallow silently."
test_spec:
  - name: test_absent_declaration_refuses_and_writes_no_file_anywhere
    target_dir: unit_tests/feedback/
    framework: pytest
    type: behavioral
    angle: failure
    surface_invoked: "the deployed-layout copy of submit_feedback.py run as a subprocess"
    description: "Copy the script into a temp deployed layout with no config/knowledge_sink.json and run it with cwd inside a temp worktree-shaped directory. Assert a non-zero exit, empty stdout, one stderr line naming the expected declaration path, and that no feedback.jsonl or sidecar file exists anywhere under the temp root."
    must_catch:
      - "falling back to the __file__ walk for .claude/ (KI-FC-001's root cause)"
      - "falling back to debugging/logs/feedback.jsonl relative to the current directory"
      - "printing a feedback id on stdout although nothing was written"
  - name: test_unreadable_keyless_or_relative_declaration_each_refuses
    target_dir: unit_tests/feedback/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Parametrised over a malformed-JSON declaration, one missing feedback_sink and operational_log_root, and one whose values are relative. Each must refuse like the absent case, with the stderr reason naming which condition failed."
  - name: test_stale_declaration_refuses_without_creating_the_enduring_root
    target_dir: unit_tests/feedback/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Declare a log root whose project root does not exist. Assert refusal, and assert afterwards that neither the project root nor any directory on the way to the log root was created."
    must_catch:
      - "mkdir(parents=True) on the declared directory, which turns a stale install into a healthy-looking empty one"
  - name: test_project_without_version_control_writes_to_the_declared_root
    target_dir: unit_tests/feedback/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "With no .git anywhere above the temp layout and PATH stripped of git, a valid declaration still yields a successful write. The sink line names the declared feedback_sink, which lies outside the directory the caller ran from."
    must_catch:
      - "an implementation that still shells out to git and refuses when git is unavailable"
  - name: test_plain_checkout_and_worktree_drive_resolve_the_same_sink
    target_dir: unit_tests/feedback/
    framework: pytest
    type: integration
    angle: seam
    description: "Write a declaration the way the build phase does for a plain checkout, and another the way the bootstrap does for a worktree of the same install by inheriting the recorded root. Run submit_feedback from each layout and assert both sink lines name the identical absolute file."
  - name: test_refusal_keeps_the_verdict_path_and_uses_a_legible_reason
    target_dir: unit_tests/feedback/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "Call emit_hook_finding.emit_finding in-process against a layout with no declaration. Assert it returns without raising and that the reason it surfaces is the destination-could-not-be-written reason, not the written-but-uncited one."
test_rationale: "The defect this record guards against is a fallback that nobody exercises, so every refusal case runs the real script as a subprocess from a copied deployed layout and asserts that NO file appeared anywhere: a test that only checks the exit code passes on an implementation that refuses after writing to the disposable root. The no-version-control case is a positive test on purpose. Under the build-time mechanism the criteria's version-control examples must succeed, and a test asserting refusal there would bless the rejected git-based design. The plain-versus-worktree seam test compares two real resolutions, because each one is correct on its own and the defect is the difference between them."
delivers_to: null
expects_from:
  - ac_id: INF-500d-4-iii
    contract: "<output_root>/config/knowledge_sink.json carrying operational_log_root (absolute directory) and feedback_sink (absolute file directly under it), with the worktree bootstrap writing the main install's recorded root rather than the worktree's own. Absence, unreadability, a missing key, a relative value or a stale root are the conditions this AC refuses on."
  - ac_id: INF-500d-3
    contract: "The closed reason set for a failed submission. This AC's refusal maps to 'the destination could not be written' (or a dedicated reason if INF-500d-3 adds one) and never to 'written but the identifier was not captured'."
