notes: |
  WHY THIS GOAL EXISTS NOW (user decision, BrainCandy, 2026-09-17). The user chose
  on 2026-09-16 that the executor's live scenarios are proven by an opt-in harness
  that asks the real registered agent (BO-3200f-2-ii), and on 2026-09-17 chose to
  give that mechanism a testing-quality home NOW rather than wait for a second
  consumer. The product-owner recommended waiting; the user decided otherwise. This
  goal is that home.

  PLAINLY: ONE L1 TODAY, AND THAT IS DELIBERATE. The 3-7 L1 guideline is not met and
  the tree-limits hook will print a sparse-parent advisory; that is expected, not an
  error. No L1s were invented to pad it. What else belongs here as it arrives:
    - a second agent whose instructions make a promise only the real agent can show
      (the next charter needing live proof is the trigger to decompose further);
    - proving an agent under the model the project actually ships it with, when that
      model changes;
    - a recurring, deliberately scheduled run of real-agent proofs, if the user ever
      decides such a run should exist (no automated job exists or is planned today —
      user decision 2026-09-17, no CI job now);
    - citing a real-agent record as done-proof, as and when TQ-400 decides how
      recorded evidence keeps its standing over time.
  If none of these arrive, this goal should be folded rather than kept as a shell.

  PLACEMENT — WHY A NEW L0 AND NOT AN L1 UNDER AN EXISTING GOAL. Checked 2026-09-17
  against every testing-quality L0 and its cap (7 L1s per L0):
    - TQ-100 (5/7) — which tests gate main. This goal is opt-in and must NEVER gate by
      default; the opposite axis.
    - TQ-200 (3/7) — "guarded by an eval set": scored sets against a threshold, a
      required merge gate. Asking the real agent here is pass/fail per case and never
      runs by default. TQ-200c (amended the same day) says which kind of proof work
      needs; it does not run anything, and it is at 5 of 5 L2s anyway.
    - TQ-300 (3/7) — tests for the package's own tooling. Wrong subject.
    - TQ-400 (5/7) — done-proof re-checked over time. The evidence record this goal
      leaves behind is an input TQ-400 may use; TQ-400 is not where the proof is taken.
    - TQ-500 (5/7) — a pass counts only once the test is shown able to fail. The
      closest neighbour: the harness's changed-instructions scenario IS such a
      demonstration. But TQ-500 is a check ON proofs; this goal is a new way of TAKING
      a proof. Filing it there would make TQ-500 own a proof surface it only audits.
  Litmus: the goal still matters if the executor, the harness or the switch were
  swapped for any other way of asking the real agent — its subject is generic.

  BOUNDARIES.
    - Not an eval. No scores, thresholds, rows or aggregate. A behaviour that needs a
      score across many examples is judged and belongs to TQ-200.
    - Not a reliability rate. One passing run is one observed answer; how often an
      agent passes across many runs is a scored question (TQ-200).
    - Not pre-approval. The user decided on 2026-09-16 that nothing the real agent
      asks to do is pre-approved; an unattended run that meets a permission request
      fails by name.
    - Not the retired proof kind live_dispatch (BO-2900g-3).

  RELOCATION IS BA WORK, NOT DONE HERE. BO-3200f-2-ii stays where it is until the BA
  pass. See TQ-600a notes for the exact list.
