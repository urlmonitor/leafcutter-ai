id: BO-100a-4
title: "Cycle detection halts the epic with a diagnostic naming all cycle members"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an epic contains tickets A, B, C where A.depends_on=[C],
    B.depends_on=[A], and C.depends_on=[B] (cycle A->B->C->A),
  When detect_cycle(graph) is called,
  Then it returns a non-None list containing at least the nodes [A, B, C]
    forming the cycle path,
  And the returned list starts and ends with the same node (closed path),
  And /build-feature halts with exit code 1,
  And the error message written to stderr contains the string "CYCLE DETECTED"
    followed by the arrow-separated cycle path (e.g. "A -> B -> C -> A"),
  And no ticket-supervisor is dispatched (dispatch step is never reached).
