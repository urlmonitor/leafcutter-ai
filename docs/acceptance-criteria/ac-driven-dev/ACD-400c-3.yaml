notes: |
  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Decomposes ACD-400c.

  THIS BEHAVIOUR WAS NOT IN THE PO'S BRIEF AND WAS FOUND BY PROBING THE QUEUE. The PO
  specified the approval gate as it applies to the ready-batch question. Running the
  queue across its full argument surface showed the requirement is unconditional: asking
  for every level and every completion state still returns only approved work. That is a
  separately changeable decision — a reasonable person could argue the gate belongs on
  the build-selection question and not on an inventory question — and nothing anywhere
  records which it is. So it is silent in exactly the way ACD-400c exists to fix, and it
  belongs under ACD-400c rather than being noticed and dropped.

  WHY IT MATTERS MORE THAN IT LOOKS. The narrow question is asked by the build loop,
  which only ever wants approved work, so the gate is invisible there. The broad question
  is asked by a person trying to find out what is in the store — and that is the reader
  who will be misled, because they asked for everything and received a filtered subset
  with no indication of filtering. The four draft records in the criteria are chosen so
  that each would have been returned by the broad question for a different reason had the
  approval requirement not applied.

  THE LAST CLAUSE IS DELIBERATELY UNIVERSAL RATHER THAN ENUMERATED. Naming today's exact
  argument spellings would freeze a command-line detail into a behavioural requirement and
  would go stale the moment an argument is renamed or added. What must remain true is that
  no question reaches behind the approval requirement. A test satisfies it by exercising
  every question the queue accepts, which is a small closed set; the IT PO owns how that
  set is enumerated.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L2.
