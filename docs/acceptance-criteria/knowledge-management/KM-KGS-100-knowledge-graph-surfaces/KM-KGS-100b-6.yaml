roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100b.yaml"
criteria: |
  Given the read index is enabled and holds a per-file manifest recording, for each
    surface source file, its last-modified time and size at index-build time
  When an index-backed read is requested
  Then before any indexed node or edge is returned, the read performs a freshness
    check that stats the surface source files and compares each file's current
    modified time and size against the manifest entry
  And the check reads only file metadata (stat), not file contents, to decide freshness
  And no index-backed read returns data without first completing this freshness check —
    there is no path that trusts the index without the check having run
