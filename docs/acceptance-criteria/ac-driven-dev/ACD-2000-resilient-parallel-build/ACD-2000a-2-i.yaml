notes: |
  THE LOCKSTEP LEAF. ACD-2000a's hazard 3: "CHANGE THE ESCALATION PAYLOAD IN
  LOCKSTEP. The §6 payload builder distils `blocker_summary` from the latest
  `## Comments` body. If the trail becomes structured on the AC, that derivation
  must be repointed in the same change -- otherwise escalations silently degrade
  to empty summaries, which reads to the user as 'no reason given' rather than as
  a defect."

  VERIFIED SOURCE (do not re-investigate):
  templates/skills/building-epics/SKILL.md §6, `blocker_summary` (~line 1062), is
  "a single sentence (<=120 chars) lifted or distilled from the latest
  `## Comments` body". That derivation has exactly one input, and ACD-1800c-1
  removes it. This is not a nice-to-have follow-up: the moment the container
  stops carrying `## Comments`, the payload builder reads nothing and produces
  nothing, and the failure surfaces to the USER as an unexplained halt.

  WHY THIS IS AN L3 UNDER THE STOP CONDITION rather than a peer L2: the stop
  condition (ACD-2000a-2) is the behaviour; the quality of what the person then
  sees is a property of that same behaviour's output. Splitting it out keeps
  ACD-2000a-2's criteria focused on retry-vs-escalate while making the
  degradation mode independently testable -- an escalation that fires with an
  empty reason passes ACD-2000a-2 completely.

  THE THIRD AND FOURTH THEN CLAUSES ARE THE WHOLE POINT. It is trivially easy to
  satisfy "the summary comes from the trail" with a lookup that returns empty
  string when the field is absent -- and empty string is precisely the silent
  degradation being guarded against. So the criteria demand that the MISSING case
  produce a distinguishable message. This is the same distinction ACD-1600g-4
  draws for an absent boundary and ACD-1800f-3 draws for an empty proof set: in
  all three, "nothing to read" must never be presented as "nothing wrong".

  WHAT IS NOT SPECIFIED HERE: the 120-character limit, the payload's field names,
  and whether the sentence is lifted verbatim or distilled. Those are the
  runbook's current choices and belong in it_requirements; the criteria constrain
  what reaches the person.

  TESTABILITY. Drive a real escalation from a real requirement whose trail has a
  reason, and again from one whose latest entry has none, and assert on the two
  messages produced. A test that asserts the payload builder references the trail
  field is a grep test -- it passes on a reference whose result is discarded.

  2026-08-17 (IT PO enrichment). Assigned python-coder, complexity M, same
  reasoning as ACD-2000a-2: the payload builder must be executable for the
  criteria to be testable, and the SKILL.md §6 wording change rides along in the
  same commit. The BA's "what is not specified here" list is taken up verbatim as
  it_requirements -- the 120-character ceiling, the key name `blocker_summary` and
  the lift-or-distil choice are all now recorded as constraints to PRESERVE rather
  than as choices to make.

  ONE FINDING ADDED BY THIS PASS. `blocker_summary` is not emitted only from §6.
  SKILL.md also emits it at line 67 (feedback sink unreachable), line 110
  (pre-commit hook probe failed) and line 472 (ac_coverage incomplete). Those three
  halt paths construct the key directly and do not read the comment log at all, so
  they survive the cutover unchanged -- which is precisely the risk: repointing
  only the §6 derivation leaves four emitters of one key with two different
  provenances and no single enforcement point for the no-blank rule. Hence the
  it_requirement that the no-blank check live at a single emit point that every
  halt path routes through, rather than at the new derivation alone.
