title: "A legacy requirement with none of the new fields still validates"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given an AC YAML file that omits deliverable_checklist, per-deliverable sign-offs,
    and schema_version (a legacy v1 record),
  When the AC schema validation is run against that file,
  Then it exits 0 (accepted) and the record is treated as schema_version 1,
  And the absence of any new field is not reported as an error.
depends_on:
  - ACD-1900a
doc_links:
  - path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
    relationship: describes
    status: exists
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
delivers_to:
  agent: python-coder
  contract: "schema_version default-to-1 semantics in scripts/ac_store/validate_ac_schema.py and config/ac_store_schema.json: a record missing schema_version validates and is read as version 1. Consumed by the v1-count logic in ACD-1900a-3-i and ACD-1900c-3."
expects_from: null
it_requirements:
  - "Canonical source: config/ac_store_schema.json (the schema) and scripts/ac_store/validate_ac_schema.py (the validator). The new fields (deliverable_checklist, per-deliverable sign-offs, schema_version) must be OPTIONAL — a record omitting all of them validates and is treated as schema_version 1 (legacy default)."
  - "Absence of any new field must NOT be reported as an error; do not tighten additionalProperties as part of this AC (that is gated by ACD-1900a-3-i)."
  - "Fix the known-wrong docstring on validate_ac_schema.py as part of this L1's scope (ADR-026 non-negotiable rule 1)."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file/YAML I/O in typed try/except and log-or-reraise; no bare except."
test_spec:
  - name: test_legacy_v1_ac_without_new_fields_validates_exit_zero
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A YAML record omitting deliverable_checklist, per-deliverable sign-offs, and schema_version validates and the validator exits 0."
  - name: test_missing_schema_version_treated_as_version_1
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A record with no schema_version is read as schema_version 1 (legacy default), and absence of new fields raises no error."
