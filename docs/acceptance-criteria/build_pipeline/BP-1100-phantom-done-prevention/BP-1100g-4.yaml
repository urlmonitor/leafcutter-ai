notes: |
  GAP E of BP-1100g, second half, and the forcing function without which the tag
  axis decays to the 0% the side-effect declaration sits at today. USER DECISION,
  2026-08-17, DO NOT RE-LITIGATE: scope was widened exactly this far and no
  further.

  IN SCOPE: presence and parity between two AUTHORED declarations. Did the plan
  promise a kind of proof for a stated behaviour, and is there a test claiming to
  give it? If not, refuse and name the missing kind.

  OUT OF SCOPE: any correctness verdict. Whether the claiming test actually
  reaches the work the real way is execution-derived and belongs exclusively to
  BO-2900a's observer.

  THE THIRD CLAUSE IS THE DENOMINATOR RULE AND IT IS NOT OPTIONAL. Without it the
  check degenerates into demanding all seven kinds on every piece of work, which
  buries the signal it exists to raise and gets the check switched off. The
  promise set is the denominator; a kind absent from it is absent from the
  refusal. This is BO-2900f-1's gate D clause, in a different registry.

  THE REFUSAL MUST NAME THE MISSING KIND, NOT JUST REFUSE. "Proof requirements
  not met" is unactionable and is the message an implementer writes first. The
  reader has to be able to go and write the specific test that is missing, which
  means the piece of work, the stated behaviour, and the kind all appear in the
  message.

  BOUNDARY vs BO-2900f. BO-2900f guarantees that a requested GATE which did not
  run still leaves a record saying so. This is not a gate record: it is a
  comparison between a plan and a suite, with a different producer and a
  different artifact. Neither may be folded into the other.

  IT-PO ENRICHMENT NOTE (2026-08-17). The claim/verdict boundary is expressed as
  an INPUT RESTRICTION rather than a prohibition on a technique, because the
  distinction the implementer needs is precise: reading a test file to collect
  its tag is the scanner's permitted job; reading a test body to decide what it
  does is forbidden. declares_side_effect is true — a commit-time refusal is a
  command that leaves the system in a different state, and the refusal message is
  exactly the kind of user-facing output user-surface-smoker's placeholder
  negative control exists to check ("proof requirements not met" is the
  placeholder to fail on). reference_file_path names commit_guardian.json because
  the primary new hook module does not exist yet and the field must resolve to a
  real path; the registration edit there is genuinely mandatory.
