notes: |
  RETIRED 2026-09-09 with the whole ACD-800 tree. Decision, mechanism and the
  live-code hazard are recorded once, in ACD-800's notes — read those.

  THIS RECORD'S OWN REASON, AND IT IS THE WEAKEST EVIDENCE IN THE TREE. The
  join is "two or more shared title keywords after stop-word filtering, plus a
  component overlap". Two words in common between two titles is not evidence
  that one implements the other; on a store of thousands of records with a
  shared vocabulary it is close to a coincidence detector. Retirement reason 2
  applies in full — the match target is a done ticket an adopting project does
  not have — and reason 1 applies at one remove: this pass produces the
  "medium" confidence label, and the tree's own design keeps medium out of the
  auto-write path precisely because this evidence was known to be too weak to
  act on. A signal explicitly too weak to write on is not worth building a
  discovery capability around.

  BUILT, DESPITE THE FIELDS. Implemented as `_pass2_keyword_overlap` in
  scripts/ac_store/cross_reference_audit.py.
