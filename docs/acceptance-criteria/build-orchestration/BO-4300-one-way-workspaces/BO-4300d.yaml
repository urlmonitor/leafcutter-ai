notes: |
  Origin: F5 in the sandbox -- bootstrap failed, the re-run exited 0 with "created: false"
  on a workspace holding only three files, because reuse skipped set-up entirely; and
  KI-BO-20260831-1331, a half-made fast-lane workspace git did not list. Decision 2 means
  the install is rebuilt on every request, reused or not, so "handed back" always means
  "re-readied", never "trusted as last seen".

  Neighbours: BO-1700c repairs ONLY missing check set-up; this record repairs readiness as
  a whole. BO-4100e surfaces an invisible remnant and keeps it clearable (recovery via the
  listing); this record completes it when the same work is asked for again.
  BO-1500f's "never take over someone else's space" is the AC-authoring instance of the
  last sentence -- cite, do not duplicate. BO-4300c defines what "fully ready" means.

  documentation_triggers: state-diagram -- a workspace moves between absent, half-made,
  ready and occupied-by-other-work with explicit transitions on each request.
