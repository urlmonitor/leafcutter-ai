test_rationale: >-
  The deliverable is a prose reference page. Every behaviour it states is owned and tested by
  the record that delivers it -- the capture and literal execution by BO-3200f-1, the reasons by
  BO-3200f-1-i, permission and containment by BO-3200f-2 -- and the criteria's second scenario
  ('the executor behaves as the documentation states') is satisfied by requiring each statement
  to name its delivering record, whose tests are the check. A test over the page could only
  assert words appear in it, the presence-shaped proof this tree rejects. Frontmatter, length and
  links are covered by live commit gates.
