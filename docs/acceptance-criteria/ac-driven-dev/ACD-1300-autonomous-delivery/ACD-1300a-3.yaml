it_requirements:
- Persist a delivered reservation by repository, target and feature identity across restarts. An open or closed-unmerged proposal prevents fresh automatic selection until explicit user recovery; changed scope is surfaced for that decision, never silently rebuilt.
- Run identity and feature ownership survive scheduling iterations; priority changes cannot alter the
  current run's ordered scope.
- No two writers may concurrently mutate the same accumulating feature worktree, even when the global
  model-call limit exceeds one.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300a-2 (data handoff, not an additional build-order prerequisite): Selection
  {feature_id:string|null, ordered_ac_ids:string[], effective_priority:string|null, reasons:[{ac_id:string|null,
  reason:string}], snapshot_revision:string}.'
- 'Runtime interface from ACD-1300b-4 (data handoff, not an additional build-order prerequisite): WorkspaceClaim
  {claim_id:string, owner_id:string, run_id:string, feature_id:string, canonical_worktree_path:string,
  branch:string, target_ref:string, target_sha:string, source_revision:string, generation:integer}.'
- 'Runtime interface from ACD-1300e-2 (data handoff, not an additional build-order prerequisite): RunCheckpoint
  {schema_version:integer, run_id:string, feature_id:string, source_revision:string, target_sha:string,
  workspace_claim:object, settings_revision:string, next_step:string, ac_evidence:object[], ac_budgets:object[],
  review_count:integer, in_flight_action:object|null, publication:object|null}.'
test_spec:
- name: test_background_worker_delivered_feature_is_not_reselected_before_merge
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: 'Deliver a draft PR with ACs still todo, rescan and restart: no new feature run or duplicate
    PR; closing it unmerged still requires explicit user recovery.'
  covers:
  - ACD-1300a-3
- name: test_background_worker_new_lower_priority_feature_does_not_preempt_claim
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: reachability
  description: After first STATUS leaf passes, add a lower-urgency feature and assert next dispatch remains
    STATUS in the same worktree through review.
  covers:
  - ACD-1300a-3
  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_claim_releases_only_on_terminal_or_pause_transition
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Drive delivery, blocker and explicit off paths; assert new selection follows the permitted
    lifecycle transition rather than a priority edit.
  covers:
  - ACD-1300a-3
