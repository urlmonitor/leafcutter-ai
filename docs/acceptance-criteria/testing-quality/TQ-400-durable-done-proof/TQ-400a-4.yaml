id: TQ-400a-4
components:
  - testing_quality
  - ac_store
title: "The sweep leaves a durable inventory that later steps read without re-running it"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the honesty sweep has run to completion over the whole store,
  When the run finishes,
  Then a durable record of that run exists, holding for every finished record
    evaluated its identifier, its verdict, and the stated cause where it is not
    proven,
  And a separate later process reads that inventory and reproduces the run's
    per-record verdicts without re-running the sweep and without re-running any
    test,
  And the number of records in the inventory equals the number the run reports
    having evaluated,
  And the inventory identifies which run produced it, so a stale one is not
    mistaken for the current one.
depends_on:
  - TQ-400a
  - TQ-400a-1
doc_links:
  - path: docs/testing/test-angles.md
    relationship: describes
    status: exists
    relevance: >-
      The seam and real_artifact angles, and the writer/reader schema-mismatch
      incident (EPIC-AcPipelineDeployGaps inbound gap 4) this artifact repeats
      if its shape is not contract-tested.
  - path: templates/scripts/commit_guardian/check_done_proof.py
    relationship: implements
