notes: |
  BO-3600c's criteria say the point is that a finding does not quietly rot into a
  wrong instruction. A flag reading "this no longer exists" for something that
  simply moved is a new wrong instruction issued by the check that was supposed to
  prevent them — and, worse, one carrying the authority of automation.

  The third scenario is the honesty bound: not-found-where-we-looked is a weaker and
  true claim, and it names the search so the reader can widen it. Asserting deletion
  would require having looked everywhere, which the check has not done.
