  constraints:
    - "The assembly must emit exactly one cache breakpoint marker with the static boilerplate (role, standing instructions, schema) strictly before it and all request-variable content (batch ACs, prior-phase outputs) strictly after it."
    - "The stable prefix must contain no request-variable data, so it is byte-identical across invocations that intend to share the cache (paired constraint for the churn detection in BO-2400c-1-i)."
    - "Companion authoring constraint for llm-expert: agent template bodies contributing to the stable prefix must hold only stable content (role/instructions/schema), never per-request data — flagged as a caveat for template-side review."
