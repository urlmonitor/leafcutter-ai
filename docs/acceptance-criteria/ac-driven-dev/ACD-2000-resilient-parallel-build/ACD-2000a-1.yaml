readiness: draft
priority: medium
title: "Every attempt at a requirement is appended to that requirement's trail, and nothing may rewrite an earlier entry"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement whose first build attempt failed with a test failure and
    whose second attempt failed for the same reason,
  When the requirement is inspected,
  Then the requirement carries two attempt records, in the order they happened,
  And each record states who made the attempt, when, at which stage of the work,
    what the outcome was, and what was decided about it,
  And recording a third attempt leaves the first two records exactly as they
    were,
  And no way exists to shorten or rewrite the trail as part of recording a new
    attempt -- an entry that corrects an earlier one is itself a new entry.
depends_on: [ACD-2000a]
