test_spec:
  - name: test_all_four_deployed_emit_surfaces_resolve_to_the_declared_sink
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: deployed
    description: "Run build.py into a temp target, then run the sink-parity check over the DEPLOYED copies of the signoff skill and the product-owner, business-analyst and it-po templates; assert it passes and that it reports having inspected exactly four surfaces, so a check that silently found none cannot report agreement."
  - name: test_one_unrepointed_surface_out_of_four_blocks_the_check
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Partial-repoint negative control. In the deployed temp target, revert exactly one of the four surfaces to name debugging/logs/agent_telemetry.jsonl; assert the check exits non-zero and names that surface. Repeat for each of the four so no surface is left uncovered by the guard."
  - name: test_a_surface_followed_from_an_isolated_working_directory_reaches_the_same_sink_as_from_the_project_root
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: seam
    description: "Build into a temp project with an isolated working directory added. Perform the append each surface describes twice — once from a process whose current directory is inside the isolated working directory, once from the project root — then remove the isolated working directory and assert both records are present in one file at the project root, and that no sink file was left where the removed directory used to be. A surface that hands the agent a bare relative name passes every other test here and fails this one."
  - name: test_no_deployed_surface_carries_a_sink_path_of_its_own
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Build the same package into TWO temp projects at different absolute locations. Assert that following each surface in each project appends to that project's own declared sink, and that neither project's records land in the other. A destination written into a surface can only be correct in one of the two, so this pair fails on any surface that carries one — including a surface that carries the right answer for the machine the change was authored on."
  - name: test_the_settlement_scope_note_is_not_read_as_an_append_instruction
    target_dir: unit_tests/portability/
    framework: pytest
    type: unit
    angle: criterion
    description: "The signoff knowledge-capture section legitimately names the telemetry stream once, in the paragraph recording what was settled. Assert the check classifies that paragraph as prose and the append line as an instruction, by confirming the check still passes with the historical paragraph present and still blocks when the append line is reverted."
test_rationale: |
  This is a prompt AC and would normally carry test_required: false, but the BA
  deliberately restated its criteria as a property of WHERE A RECORD LANDS
  rather than of what the shipped text says, precisely to escape grep-shaped
  coverage. No test can run an LLM, so the honest mechanical form is the
  deployed-layout parity check: build.py into a temp target and exercise the
  check against the deployed copies, which is a behavioural run of a real gate
  and not a string search. The per-surface negative control is what makes
  partial repoint — four surfaces, one missed, corpus split across two files —
  a red test rather than an undetected outcome. The third test exists because
  the naive guard (forbid the telemetry path anywhere near the string
  knowledge_captured) would delete an honest historical note; it pins the
  distinction the criteria draw deliberately.
change_target: prompt
risk_surface: contract_boundary
