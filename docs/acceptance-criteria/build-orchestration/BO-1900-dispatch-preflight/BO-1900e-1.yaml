notes: |
  ORIGIN — OBSERVED LIVE, 2026-08-31 (BrainCandy). A fast-lane run reached its coder
  phase. The coding craft returned, unprompted, in its own sign-off: its dispatch granted
  it no means to invoke the two quality capabilities its own instructions mandate on every
  source file it touches, so it performed manual substitutes and flagged the substitution
  for supervisor awareness. That agent behaved well. The system did not.

  WHY THIS IS A DISPATCH-FITNESS DEFECT AND NOT A CODER DEFECT. The agent's instructions
  and the run's grant disagreed, and nothing in the run compared them. The disagreement
  was discoverable only because one agent volunteered it; a less careful craft would have
  proceeded silently. The failure is therefore located at the moment the dispatch is
  prepared, under the goal's governing principle: nothing is spawned against a dispatch
  that has not been proven fit.

  THE CLAUSE THAT MAKES THIS PROVABLE. The third Then clause — that a well-formed dispatch
  proceeds AND the run can afterwards show each capability was actually invoked — is
  load-bearing and must not be dropped in decomposition. Without it the AC is satisfiable
  by a check that reads instructions and grants as text and never establishes that anything
  ran. This repository rejects presence-only assertions as coverage: the proof obligation
  here is to EXECUTE a dispatch and observe what the agent could and could not do. A test
  that asserts a capability name appears in a template or a grant list proves nothing about
  a run.

  SCOPE — NOT LANE-SPECIFIC, DELIBERATELY. The defect was observed on the fast lane, but the
  instructions that mandate the capabilities are the craft templates themselves, which the
  heavy pipeline dispatches too. Wording this against one lane would leave every other
  dispatch unchecked and would make the AC unprovable for the coding craft, which performs
  no reading. BO-1900e-1-iv states the per-craft coverage obligation explicitly.

  BOUNDARY vs BO-2400g-2. That AC requires the fast lane's reading to be substantive and to
  declare examinations it could not perform. Same SHAPE — a check that is present but inert
  is worse than an absent one, because it reads as coverage — but a different cause: there
  the reader lacks a ticket to bind to; here the craft lacks the means to invoke a
  capability. An implementer who satisfies one and marks the other done has closed half the
  hole.

  PLACEMENT — SETTLED 2026-08-31, DO NOT RE-OPEN. Authored as BO-1900a-5 (+ four L3s) under
  the preflight L1, with the promotion question deliberately left to the product owner. The
  call was made the same day: PROMOTED to a first-class capability contract at L1 as
  BO-1900e, with this L2 renumbered BO-1900e-1 and its four L3s renumbered accordingly.

  THE REASON WAS THE TREE'S OWN DECOMPOSITION AXIS, not the free slot. BO-1900 divides into
  one L1 that establishes the preflight stage exists and runs (BO-1900a) and one L1 per
  DIMENSION OF FITNESS the stage examines: the ticket's premises (BO-1900b), the fit of the
  assigned agent to the work (BO-1900c), the shape of the hand-off (BO-1900d). BO-1900a's
  other four L2s are all stage mechanics -- pass-through, target resolution, hold-back-with-
  a-reason, the flow diagram. This record is not stage mechanics; it is a fourth dimension of
  fitness, and it sat under BO-1900a only because that is where the observation landed. Two
  further reasons carried weight: BO-1900e-1-iii constrains what a sign-off may claim AFTER a
  dispatch has already happened, which no L1 titled "no agent starts on an unfit ticket" can
  honestly cover; and under the old placement a future capability-provisioning requirement
  had nowhere to go, since BO-1900a was full at five L2s and such a requirement is not about
  the stage anyway. BO-1900a returning to four L2s is a CONSEQUENCE of the move, not its
  justification.

  RENUMBERING WAS FORCED, not preferred. Parentage in this store is derived positionally from
  the id string (scripts/ac_store/ac_parent_id.py), so a record keeping the id BO-1900a-5
  would resolve to parent BO-1900a no matter what its depends_on said, and the covered-by and
  child-cap hooks would silently check the wrong parent. The criteria text of this record and
  of all four L3s is unchanged from the business analyst's authoring; only ids, depends_on,
  covered_by, and these notes moved.

  NOT SETTLED HERE — IT PO TERRITORY. How a craft's required capabilities become declarable
  and readable before dispatch (a field on the craft's own declaration, a registry entry, or
  a run-side grant table) is a mechanism choice, not a behaviour. BO-1900e-1-i states only
  that an undeclared requirement must read as unconfirmed rather than as satisfied.
