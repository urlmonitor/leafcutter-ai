it_requirements:
  - >-
    The check stays structural on the produced test; no database is available to the eval. Two forms pass:
    (a) the SQL form already accepted (count(*) and count(<column>) or equivalents in executed SQL), and
    (b) the Python form: rows fetched from the row's view, an equality assertion on their number against
    a fixed or seeded number, and an equality assertion on the number of non-None values of the row's
    column. Both assertions must be equalities; '>= 0' over values, 'at least one row', or only one of
    the two counts fails.
  - >-
    Unit tests never call a live model; recorded outputs and probe fixtures only. The live test from the
    KI symptom is a recorded positive probe; each failing case in the criteria has a recorded negative
    probe.
  - >-
    Every changed .py file stays at or under 400 counted lines; run_agent_eval.py is not touched; no new
    module is added at the top of scripts/evals/ (15-file density cap). Tests go in unit_tests/evals/tq200d2/.
  - >-
    DOCUMENTATION (part of done) - the sql_counts_rows_and_non_null entry on docs/reference/produced-tests-eval-assertion-kinds-sql-test-writer.md
    must state both accepted forms with one example each, the four failing forms from the criteria, and
    the quoted template remedy. The entry names its passing and failing examples by the recorded probe
    files that the unit tests score, so a doc-drift test can score the named files and check each gives
    the result the page states.
  - >-
    DOCUMENTATION (part of done) - scripts/evals/README.md produced-tests section gains (or updates) one
    line for sql_counts_rows_and_non_null: the exact processed-row count and the non-NULL count may be
    computed in SQL or asserted on the fetched rows; a '>= 0' or 'at least one row' assertion is not a
    count, with a link to the kind's entry on the reference page. It states the rule in one sentence and
    does not restate the entry.
  - >-
    DOC-DRIFT TEST: the example files named on the entry score as the entry says; the TQ-200d-1-ii drift
    tests stay green.
  - >-
    KNOWN ISSUES: git mv docs/known-issues/testing-quality/open-low-ki-tq-20261025-sql-test-writer-eval-rejects-valid-live-outputs.md
    to docs/known-issues/testing-quality/resolved/resolved-low-ki-tq-20261025-sql-test-writer-eval-rejects-valid-live-outputs.md;
    Status 'RESOLVED <date> by TQ-200d-2-i (part a) and TQ-200d-2-ii (part b)' with the proving test files;
    move its row in docs/known-issues/testing-quality.md to Resolved and recount the Open/Resolved line
    from the directory. In docs/known-issues/testing-quality/open-low-ki-tq-20261025-sql-test-writer-eval-residual-misreads.md
    strike any misread this change fixes (for example fetchall now read as an executing call) with a note
    naming TQ-200d-2-ii.
  - >-
    CHANGELOG: one entry for TQ-200d-2-ii written with scripts/changelog/emit_entry.py (type manual, components
    [testing_quality]) into changelogs/, naming the Python-side count form, its reference entry and the
    resolved KI.
test_spec:
  - name: test_python_side_counts_on_fetched_rows_pass
    target_dir: unit_tests/evals/tq200d2/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      The recorded live test (fetches buy_volume rows, asserts len(rows) == seeded and the non-None count
      == seeded) passes sql_counts_rows_and_non_null.
    must_catch:
      - revert the fix
      - only SQL aggregates accepted as counts
    in_scope_files:
      - scripts/evals/sql_test_writer_eval/evidence_kinds.py
      - scripts/evals/sql_test_writer_eval/sql_resolve.py
  - name: test_sql_aggregate_counts_still_pass
    target_dir: unit_tests/evals/tq200d2/
    framework: pytest
    type: unit
    angle: boundary
    description: >-
      A test that runs 'select count(*), count(buy_volume) from buy_volume_window' and asserts both still
      passes.
    must_catch:
      - SQL aggregate form dropped when the Python form was added
    in_scope_files:
      - scripts/evals/sql_test_writer_eval/evidence_kinds.py
      - scripts/evals/sql_test_writer_eval/sql_resolve.py
  - name: test_weak_python_side_checks_fail
    target_dir: unit_tests/evals/tq200d2/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Each fails: only '>= 0' over fetched values; only 'at least one row'; an exact row count with no
      non-None count; a non-None count with no exact row count.
    must_catch:
      - '''>= 0'' over fetched values accepted as a count'
      - '''at least one row'' accepted as an exact count'
      - row count accepted without a non-None count
      - non-None count accepted without an exact row count
    in_scope_files:
      - scripts/evals/sql_test_writer_eval/evidence_kinds.py
      - scripts/evals/sql_test_writer_eval/sql_resolve.py
  - name: test_sql_test_writer_gold_still_passes_after_count_change
    target_dir: unit_tests/evals/tq200d2/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: >-
      python scripts/evals/run_agent_eval.py --agent sql-test-writer --score-gold --results-file <tmp>
    description: >-
      The real CLI replays the recorded gold outputs and the empty-window-database-shape row passes.
  - name: test_count_entry_examples_score_as_stated_and_remedy_unchanged
    target_dir: unit_tests/evals/tq200d2/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The example files named on the sql_counts_rows_and_non_null entry score as the entry says, and the
      template still holds 'assert an exact count of processed rows plus a non-NULL count'.
test_rationale: >-
  The fix widens a check, so most of the weight is on the negative probes: each names one weak test that
  the widened check could let through, which is the incident-2 failure the row exists to catch. The SQL
  form keeps its own boundary test so the widening cannot replace it.
