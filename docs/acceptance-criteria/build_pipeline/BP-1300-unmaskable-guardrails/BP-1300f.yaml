title: "CI's type check stops a pull request for the type errors it adds, never for the ones it inherited"
component: build-pipeline
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  New type errors are caught before they land; old ones never block your change.

  A pull request that adds a type error, or adds a comment that silences one, gets a
  red type check that names each new error, where it is and how to fix it. Type
  errors a file already had before the pull request touched it are never charged to
  the pull request, however far the lines around them moved, and errors it fixes are
  counted in its favour. When the check had nothing to look at, or could not run, it
  says so instead of looking like a clean result.
