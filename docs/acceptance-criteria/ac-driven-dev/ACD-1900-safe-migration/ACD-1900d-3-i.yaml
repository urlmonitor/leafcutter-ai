criteria: |
  Given a gate marked required whose backing script is NOT in the build deploy-manifest,
  When the gate is exercised from the DEPLOYED layout (not the source tree),
  Then the missing dependency is detected and the promotion or config validation blocks
    it before the gate can run against real merges,
  And the failure is reported as a configuration error naming the un-deployed script,
    never as an import error that silently blocks every merge.
