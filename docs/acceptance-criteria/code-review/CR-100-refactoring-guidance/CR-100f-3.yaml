roadmap_phase: phase_1
criteria: |
  Given the code-smell-review orchestration (skill and /code-smell-review command),
  When a review is run,
  Then it dispatches both leaf reviewers, find-structural-smells and
    find-design-smells, in parallel rather than one after the other,
  And it waits for both to return before producing the report,
  So the full catalogue is covered without paying the deep-analysis time on the
    mechanical smells.
