notes: >-
  The anti-accumulation arm: 150 live workspaces only comes down if a disposal that is
  allowed actually finishes. The completeness clauses are there because a half-disposal
  that removes the directory but leaves the registration produces an entry that can never
  be assessed again, which is the state BO-4100c-3 then has to refuse forever. Says
  nothing about disposal running while a drive is in progress -- that constraint is
  BO-1800d's and is deliberately not restated here.
