readiness: approved
priority: high
title: "Any diff between a source script and its shipped template copy blocks the merge"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-1000-source-template-parity/BP-1000a.yaml"
criteria: |
  Given an epic branch is being finalized for merge
  And the source tree contains a directory of canonical scripts (for example
    scripts/commit_guardian/) that is mirrored by a shipped template directory
    (for example templates/scripts/commit_guardian/)
  And the parity check compares every mirrored pair recursively, byte-for-byte
  When the parity check runs as part of the merge gate
  And at least one mirrored pair is NOT byte-identical (the comparison reports
    any difference at all — content, added line, removed line, or whitespace)
  Then the parity check fails the merge gate
  And the merge is blocked until every mirrored pair is byte-identical again
