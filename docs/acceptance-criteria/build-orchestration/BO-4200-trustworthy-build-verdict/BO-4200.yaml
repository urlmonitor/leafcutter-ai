title: "Know that an automated build's verdict on your change is the truth"
component: build-orchestration
level: L0
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  An all-clear covers the whole project; a refusal is about your work, not the tooling.

  When work is built for you without you watching, the only thing you have is what
  the run says about it. Today that sentence can be wrong in both directions: an
  all-clear can be given while parts of the project the work never touched have
  stopped working, and a refusal can be handed back blaming the work when the
  run was simply never in a position to judge it. Both leave you worse off than
  no verdict at all, because you act on them. After this goal, an all-clear means
  the project as a whole still works and says plainly how far it looked; a
  refusal means the work, and anything the run genuinely cannot judge is named as
  such instead of being failed. You get this without giving up the speed that
  made you choose the quick route in the first place.
