title: "Both live coverage-tag readers recognise the same tags over the real tree"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100b.yaml
criteria: |
  Given the repository carries two independently defined coverage-tag readers —
    the canonical one the done-proof verdict uses, and a second, separately
    written one carried by the commit-time test-tag check — and the unit-test
    tree exactly as committed,
  When both readers are run over that same on-disk tree,
  Then each produces the same set of records of (file, test function, captured
    value), including the same verdict on every capture: recognised tag,
    rejected non-tag, or malformed tag
  And any capture that one reader recognises and the other does not is reported
    as a disagreement naming the captured value, the file, and which of the two
    readers accepted it
  And the comparison is made from the two readers' output over real files, not
    from comparing their two pattern strings, so two patterns that read
    differently but behave identically are not reported and two patterns that
    read similarly but behave differently are.
depends_on:
  - TQ-100b
  - TQ-100b-4
