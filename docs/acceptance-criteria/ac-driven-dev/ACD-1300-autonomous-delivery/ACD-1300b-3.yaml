it_requirements:
- The persisted enabled state must gate every transition that starts feature work, including validation/publication
  and SDK/nested calls, not only initial selection.
- Handle off-versus-dispatch races so work either began under the prior admission decision or remains
  pending; persist the completed in-flight result before exposing a safe paused checkpoint.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300b-1 (data handoff, not an additional build-order prerequisite): WorkerSettings
  {enabled:boolean, max_agent_calls:integer>=1, implementation:{executor:string, provider:string, model:string,
  endpoint:string, credential_ref:string|null}, reviewer:{executor:codex-sdk|claude-agent-sdk, provider:string,
  model:string, credential_ref:string|null}, settings_revision:string}.'
- 'Runtime interface from ACD-1300b-2 (data handoff, not an additional build-order prerequisite): CapacityLease
  {lease_id:string, run_id:string, call_id:string, role:string, settings_revision:string, acquired_at:string,
  released_at:string|null}.'
- 'Runtime interface from ACD-1300e-2 (data handoff, not an additional build-order prerequisite): RunCheckpoint
  {schema_version:integer, run_id:string, feature_id:string, source_revision:string, target_sha:string,
