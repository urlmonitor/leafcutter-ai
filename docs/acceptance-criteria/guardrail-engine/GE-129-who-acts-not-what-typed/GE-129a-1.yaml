id: GE-129a-1
title: "A live probe records which caller identity the commit guard actually receives in six calling situations, and whether a permission prompt reaches a person in each unattended mode"
component: guardrail-engine
components:
  - commit_guardian
  - git_vcs_operations
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a scratch repository with the package installed, its commit guard registered and a
    staged change,
    And a probe that keeps, for every commit attempt, the caller identity the harness hands the
    guard with that tool call -- the agent identifier (agent_id) and the agent name
    (agent_type) -- exactly as received, including their absence,
  When `git commit -m "chore: identity probe"` is attempted three times from each of six callers:
    (1) the top-level session,
    (2) a subagent dispatched through the Agent tool,
    (3) an agent dispatched by a workflow script's agent() call,
    (4) a subagent dispatched by another subagent,
    (5) a top-level session launched with --agent set to the commit specialist's name,
    (6) an agent carrying the commit specialist's name that is defined at user scope, and
        separately one defined by a plugin, rather than by the package,
  Then a findings record is written that states, for each of the six callers, whether agent_id
    was present, the agent_type value received or its absence, and whether either value differed
    between the three attempts from that caller,
    And for case (6) it states whether the agent_type received distinguishes the user-scope and
    plugin definitions from the package's definition of the same name,
    And every entry names the Claude Code version it was observed under.

  Given the same scratch repository, a top-level session, and a commit attempt for which the guard
    asks Claude Code to put the decision to the person at its permission prompt,
  When the attempt is made once in each of four modes: the default interactive mode, auto-accept
    of edits, bypass-permissions, and a headless non-interactive print run,
  Then the findings record states, for each mode, whether a permission prompt was shown to a
    person, whether the command ran without a person answering, and the permission mode value the
    guard received with the call.

  Given the same scratch repository and a staged change,
  When the commit specialist is dispatched to commit that change once in each of the same four
    modes, by each of three dispatchers:
    (i) a top-level session, through the Agent tool,
    (ii) a subagent that a top-level session dispatched,
    (iii) a workflow script's agent() call, in a run started in that mode,
  Then the findings record states, for each dispatcher in each mode, the identity and context the
    harness hands the guard with the dispatch (where the guard receives the dispatch at all) and
    with the commit call that follows -- agent_id, agent_type, the permission mode, and any field
    naming the dispatching session or run -- exactly as received, including their absence,
    And it states, per mode, whether any of those harness-supplied values tells (i) and (ii) apart
    from (iii), or records that none does.

  Given the findings show that case (3), an agent dispatched by a workflow script, arrives with no
    agent_id or with no agent_type,
  When the probe completes,
  Then the probe reports that GE-129c cannot be met as framed,
    And the GE-129 tree stops: no other GE-129 record is started, and the finding is returned to
    the user for a decision before any further decomposition or build.
