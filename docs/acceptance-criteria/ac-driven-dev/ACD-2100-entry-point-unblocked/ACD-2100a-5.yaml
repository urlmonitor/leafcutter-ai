notes: |
  THE ANTI-REGRESSION, authored in preference to a per-site duplicate exactly as
  ACD-2100a's sizing note asks. Its subject is the CLASS -- a support file resolved
  against the caller's working directory -- not any one of the five sites, which
  ACD-2100a-1 through -4 already own.

  WHY IT IS WORTH A SLOT. Five sites were found; the count reached five only because
  someone went looking past the two the known issues named. The sixth site is
  whichever one is added next, and it will be added by someone who fixed a
  cwd-relative path the same way the last five were written. Only a behaviour that
  exercises the whole startup path from an arbitrary directory fails on it.

  THE THIRD RUN IS THE SHARP ONE. The project-root case passes today. The worktree
  case is what KI-ACD-009 reproduces. The unrelated-directory case is the one that
  cannot be satisfied by any accident of layout -- there is nothing there to
  resolve against, so a surviving relative path has nowhere to hide.

  HOW TO OBSERVE THE LAST CLAUSE WITHOUT GREPPING SOURCE. Take it from what the
  process actually did -- the files it opened or the commands it issued, as recorded
  by the run itself or by the operating system -- and assert each resolved location
  is inside the project. A source scan for the string `.leafcutter` is not evidence:
  it passes on a path that is never executed and fails on a correct one built by
  concatenation.

  DEPENDS_ON CARRIES ORDERING, NOT PARENTAGE. The four siblings are listed because
  this behaviour cannot pass until they do. Structural parentage is derived from the
  id, so listing them does not affect the child count under ACD-2100a.

  2026-08-25 (it-po): all four expects_from edges have a depends_on mirror already in
  place, so the build sequencer will honour them (KI-ACD-015 is not a hazard here).
  The 2-second startup budget is stated because the natural implementation of
  ACD-2100a-2's fallback is a filesystem search, and a search re-run at every one of
  the five sites turns a resolution fix into a startup regression that nobody would
  attribute to this tree.
