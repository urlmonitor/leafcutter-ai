criteria: |
  Given an acceptance criterion whose implementing code is the handler for the action
    named `mark-done` on a unit's command surface,
    And the criterion's proof-of-done test invokes that command surface and passes,
    And the action the test invokes is `report`, whose handler never calls the
      `mark-done` handler,
  When the criterion is evaluated for eligibility to be marked done,
  Then the criterion is rejected as not eligible,
    And the rejection states that the way in was entered but the code under proof was
      not reached during the run,
    And a proof test that invokes the same command surface with the `mark-done`
      action makes the criterion eligible.
