criteria: |
  Given a newly produced document, which is by definition not yet settled,
  When its listing is requested,
  Then it appears in the index and its entry shows that it is not yet settled, so
    a reader meets it in the ordinary course of looking and can see what it is,
  And it is not omitted from the index on the ground of not being settled,
  And when the document's state later changes, its existing entry can be brought
    into agreement with the document without a second entry appearing,
  And an entry's stated state always matches the state the document itself
    declares: a document that says one thing about itself and whose entry says
    another is a failure of this criterion.
