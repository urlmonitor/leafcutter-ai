amended_by:
- reason: it-po-technical-enrichment
  date: '2026-09-25'
  by: it-po
superseded_by: null
covered_by: []
implemented_by: []
change_target: code
risk_surface: contract_boundary
notes: |
  The paired acceptable input exists so this rule cannot be satisfied by a check that
  fails everything (memory: guard-liveness, "refuses everything is the off switch").
