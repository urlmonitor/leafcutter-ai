title: "A run-and-report task assigned to test-writer is caught as a mis-assignment"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a ticket whose task asks to "run the existing suite and report the results"
    and whose assigned phase agent is test-writer,
    and the agent registry describes test-writer's charter as authoring new tests and
    test-runner's charter as executing an existing suite and reporting,
  When the preflight charter check runs before spawn,
  Then it compares the task verb ("run and report") against the assigned agent's charter,
  And it returns an unfit verdict because test-writer's charter does not cover run-and-report,
  And the held-back reason names the assigned agent, the task verb, and the agent whose
    charter does fit (test-runner),
  And no phase agent is spawned.
