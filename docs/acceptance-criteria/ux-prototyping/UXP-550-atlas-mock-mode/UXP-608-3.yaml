title: "Outside production, runtime overrides are honored without an explicit opt-in"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given a non-production (dev or preview) deployment that is unlocked and has NOT set an explicit
    override opt-in,
  When a request arrives carrying ?mock=1,
  Then the override is honored and the deployment serves bundled fixtures with the mock badge,
  So the default-deny behavior is scoped to production only — the in-app toggle keeps working
    out of the box in dev and preview.
