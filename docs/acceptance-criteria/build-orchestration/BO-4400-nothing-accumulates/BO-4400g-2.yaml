notes: |
  User request item (2). "Landed" = every commit of the workspace's own line is on the main
  line (by identifier, or by content for squash merges) AND the workspace holds nothing
  unsent. Stricter than BO-4100c-1's holds-nothing, which also accepts "open-1" (pushed,
  unmerged).

  "fresh-1" is an unasked-for boundary: a just-made workspace with no commits of its own is
  trivially "contained in main". Without this clause an hourly pass would delete workspaces
  a run has just been given. It is kept with reason no-own-work while it is younger than
  seven days idle.

  USER DECISION (2026-10-29, BA gate): a workspace with no commits of its own, nothing
  uncommitted and no file changed for seven days is abandoned and is cleared ("idle-1").
  Idle is measured from the newest change to any file in the workspace, not from when it
  was made, so a run still writing to it is never cleared.

  USER DECISION (2026-10-29, BA gate): the pass never deletes lines of work on the shared
  project -- the request is about disk space on this machine; deleting merged lines on the
  shared project stays an explicit, per-request choice on a single clearing request.

  BOUNDARY vs BO-4400d (routine sweep): BO-4400d-1 removes workspaces "holding nothing
  unsent", which includes pushed-but-unmerged ones; this pass removes only landed ones. If
  the sweep is built on top of this pass, BO-4400d-1's "idle-1"/"idle-2" fixture must be
  checked against the stricter rule. Flagged, not resolved.
