id: TQ-200d-5-iii
components:
  - testing_quality
title: "A live run whose agent cannot be started stops as a harness failure instead of reporting a 0% score"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a live eval run of an agent with 8 rows on a machine where the agent
      CLI cannot be started (no claude is found, or the operating system
      refuses to start it),
  When the first row's launch fails,
  Then the run scores no further row and stops with one message that names
      the launch failure and its operating-system reason,
    And the run ends with an exit status different from the one a run that
      scored below its threshold ends with,
    And the results file marks the run as a harness failure and carries no
      accuracy or pass-rate figure, so nothing in it reads as a 0% score,
    And a run in which the agent started and then failed on a row (a timeout,
      a non-zero exit after start, a reply that cannot be read) still scores
      every row as before, with that row counted as failed.
