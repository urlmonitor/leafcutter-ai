notes: |
  AUTHORED 2026-09-08 by PO v3 at BrainCandy's request, as stage 1 of PO -> BA -> IT-PO.
  Placed under the EXISTING ACD-400 — placement reasoning is in the ACD-400e notes.

  THIS ONE IS WORSE THAN THE APPROVAL GATE, AND THE DIFFERENCE MATTERS FOR THE BA.
  The approval rule (ACD-400c) is UNSPECIFIED — the store is silent about it. The
  ordering rule is MIS-specified — the store speaks about it, and what it says is
  false. Both ACD-400a and ACD-400a-1 describe a two-key sort (complexity, then id).
  The shipped code has sorted on a three-key sort (priority, then complexity, then id)
  since the priority tier was added. A test written faithfully from ACD-400a-1 would
  fail against the code that ships; a test written from the code contradicts an AC in
  the store. Neither test exists today, which is the only reason the contradiction has
  survived. Confirmed by grep: `priority` appears in `unit_tests/ac_store/` only as
  fixture boilerplate; nothing asserts an ordering.

  FOUR DECISIONS BURIED IN `_sort_ready` THAT EACH DESERVE THEIR OWN L2 — the BA should
  not collapse these into one "sorts correctly" scenario, because each is separately
  changeable and separately silent:
  - The RANKING ITSELF: critical before high before medium before low.
  - THE ABSENT-PRIORITY DEFAULT: a record naming no priority is ranked as `medium`
    (`ac.get("priority", "medium")`). Note this is the OPPOSITE posture to the absent-
    readiness default in ACD-400c, which excludes. Absent priority is treated
    generously; absent readiness is treated harshly. Both are defensible, neither is
    written down, and the inconsistency between them is exactly the kind of thing a
    stated rule surfaces and an implicit one hides.
  - THE UNRECOGNISED-VALUE SENTINEL: a priority string outside the four known values
    scores 99 and sinks below `low`. Same sentinel is used for unrecognised complexity.
    A typo therefore demotes work silently rather than failing loudly. Whether that is
    the wanted behaviour is a product question the L2s must put to the user rather than
    inherit from the code.
  - THE TIE-BREAK CHAIN AND ITS FINAL KEY: complexity, then id ascending. The id
    tie-break is what makes the queue deterministic across runs; ACD-400a's
    it_requirements already demand idempotent output, so this key is load-bearing for
    an existing requirement even though nothing connects the two today.

  SCOPE FENCE — SPECIFY, DO NOT REDESIGN. The job is to state and prove the order the
  system already uses. Changing the ranking, adding a new sort key, or making priority
  configurable are all product decisions that need BrainCandy, not a coder. If the BA
  concludes any current behaviour is wrong (the silent demotion on a typo is the most
  likely candidate), raise it as a question at the gate rather than authoring the
  changed behaviour into an L2.

  DO NOT TOUCH THE FAST LANE. BO-2400f-12-ii forbids priority from appearing in the
  fast lane's producibility decision. This L1 governs the ready-batch scan only.
