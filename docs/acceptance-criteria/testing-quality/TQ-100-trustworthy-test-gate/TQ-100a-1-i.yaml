assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Must reproduce the exact import-of-a-missing-module failure mode (ModuleNotFoundError at collection time) and assert the other two files still run — verifying the isolation, not just that pytest accepts the flag."
  - "Must be deterministic under pytest-randomly: the missing-import file is always the single reported collection error regardless of seed/order."
