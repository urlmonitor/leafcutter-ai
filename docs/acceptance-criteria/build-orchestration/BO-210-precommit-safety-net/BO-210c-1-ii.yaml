created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  Given a commit fails a judgment-tier gating hook,
  And the ticket contains NO context_capsule for the originating agent (for example the
    coder never tripped a warn-tier signal, or the ticket predates this feature),
  When the auto-fix path attempts the originator re-dispatch,
  Then it does not raise an error and does not block the commit path,
  And it emits a warning that no capsule was found and proceeds,
  And it still re-dispatches the originating agent type parsed from the hook output, passing
    an empty capsule,
  And the missing capsule is handled exactly like a missing completion_manifest — warn and proceed,
    never block.
