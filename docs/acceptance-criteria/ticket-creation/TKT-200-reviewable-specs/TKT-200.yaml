criteria: |
  Complete picture before anyone reviews — diagrams, component docs, and reference materials appear automatically.

  After the analysis step writes detailed specifications, the system automatically
  generates the supporting materials reviewers need: architecture diagrams showing
  how pieces fit together, component documentation explaining boundaries and
  responsibilities, and assembled reference packages that let a technical reviewer
  see the full picture in one place. No spec reaches the review checkpoint without
  its supporting documentation being ready.
