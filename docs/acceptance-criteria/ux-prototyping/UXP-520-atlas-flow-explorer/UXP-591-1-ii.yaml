risk_surface: contract_boundary
it_requirements:
  - 'The 404 is a real HTTP status: leafcutter-web/app/flows/[...id]/page.tsx calls notFound() from next/navigation
    for a two-segment id missing from the loaded flow set and for any segment count other than two, and
    the ''Flow not found'' state renders from the route-segment boundary leafcutter-web/app/flows/[...id]/not-found.tsx.
    No loading.tsx or Suspense boundary may wrap the segment above the notFound() call, because a streamed
    response commits a 200 first.'
  - Next.js 14 passes no params or searchParams to not-found.tsx, so the requested id (the path after
    /flows/, verbatim and still percent-encoded as requested) reaches it through a request-scoped channel,
    e.g. a request header set in leafcutter-web/middleware.ts and read with headers(). The quoted id is
    in the server-rendered 404 HTML, not filled in after hydration. UXP-591-1-iii reuses this channel.
  - The notice copy is the leafcutter/atlas-flows dataset's two variants, chosen by the shape of the requested
    id (two segments matching ^[a-z0-9-]+/[a-z0-9-]+$, or not), never by comparing against example ids.
  - 'The requested id is attacker-controlled: render it as React text only, never through dangerouslySetInnerHTML
    and never into an href (the action link is the fixed /flows).'
  - The not-found state hosts the Flows view's own selector and filter controls with the full flow catalogue
    at Real/User/All, so UXP-591-5-v can re-pick a flow from it. It never draws a fallback flow and ignores
    any ?step= (no drawer, no 'Step not found').
delivers_to:
  agent: frontend-coder
  contract: 'Not-found state: HTTP 404 from notFound() in leafcutter-web/app/flows/[...id]/page.tsx, rendered
    by leafcutter-web/app/flows/[...id]/not-found.tsx as the Flows view in not-found mode {requestedId:
    string (raw path after /flows/), noticeVariant: ''two-segment'' | ''not-product-and-flow'', flowId:
    null, crumbs: [], filters: {source: ''real'', kind: ''user'', realization: ''all''}, step: null},
    with the full flow catalogue in the selector. Consumed by UXP-591-1-iii, UXP-591-2-v, UXP-591-5-ii
    (Back onto the entry) and UXP-591-5-v (a filter change from it).'
expects_from:
  ac_id: UXP-591-1
  contract: leafcutter-web/app/flows/[...id]/page.tsx resolving a two-segment id against the loaded flow
    set, and the edge-safe address module parsing the requested path.
test_spec:
  - name: catch-all flows route calls notFound() for leafcutter/flow-render-pipline, for leafcutter alone
      and for leafcutter/flow-render-pipeline/resolve
    target_dir: leafcutter-web/__tests__/
    framework: vitest
    type: integration
    angle: reachability
    surface_invoked: default export of leafcutter-web/app/flows/[...id]/page.tsx with next/navigation
      notFound observed
    must_catch:
      - an unknown id falls back to leafcutter/deliver-a-feature with a 200
      - a three-segment path resolves its first two segments to leafcutter/flow-render-pipeline
  - name: '''Flow not found'' notice quotes the requested id verbatim in the two-segment or the product-and-flow
      wording with an ''Open the Flows view'' link to /flows'
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: criterion
  - name: '''Flow not found'' state shows the selector at Real, User, All with an empty breadcrumb, no
      drawn flow, and no drawer or ''Step not found'' notice for ?step=resolve'
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: boundary
  - name: every not-found FlowRoute in atlas-flows.mock.json renders its notice title, detail and action_href
    target_dir: leafcutter-web/components/flows/__tests__/
    framework: vitest
    type: component
    angle: real_artifact
    description: Replays route-unknown-typo, route-unknown-product-only, route-unknown-step-suffix and
      route-unknown-flow-with-step from the dataset.
test_rationale: notFound() at the route is what produces the 404 status; a component test of the notice
  alone stays green while the route silently falls back to the default flow. The dataset replay pins the
  approved copy for all four not-found records.
test_required: true
declares_side_effect: false
