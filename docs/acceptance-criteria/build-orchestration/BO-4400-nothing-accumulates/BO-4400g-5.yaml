criteria: |
  Given clearing by work name (BO-4400g-1), the landed-work pass (BO-4400g-2) and its
    preview (BO-4400g-3) are in place,
  When a person opens the existing how-to guide for clearing a workspace,
  Then it shows how to ask for a workspace to be cleared by naming the work -- by kind and
    short name, by line-of-work name, and by an older spelling -- and states that asking
    again after it is gone is answered "no workspace exists", not an error,
  And it shows how to preview the landed-work pass and how to run it, with one example
    answer listing a cleared workspace and a kept workspace with its reason,
  And it lists every reason a workspace is kept -- not yet on the main line, holds unsent
    work, no work of its own yet, in use, landing could not be confirmed, shared project
    unreachable -- and what the person can do about each,
  And it shows how to run the pass unattended from a timer or at session start,
  And it states that the pass never touches another project's workspaces, the main
    checkout, or lines of work on the shared project,
  And there is still exactly one how-to guide for clearing a workspace.
