notes: |
  Mock invariant: "A trace sighting is evidence for a proposal, never a member"; only published-record sightings can become (decision id, criterion id) membership.
  The last clause is the positive control: the rule keys on whether the decision is PUBLISHED, not on which source the sighting came from. Mutation it must catch: proposing every sighting that names a decision id as a member (that turns the dec-e4c6a3e133b9694b clause red while the published case stays green).
