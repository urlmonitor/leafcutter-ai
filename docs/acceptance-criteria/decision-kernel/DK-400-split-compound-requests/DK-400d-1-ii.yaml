assigned_agent: llm-expert
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-400d-1
  contract: The split-gate HumanQuestion in the waiting_human envelope (subject_text verbatim; offered parts with
    id, text, covers, depends_on and child_capability in proposed order; dropped[] and not_covered[] read-only with
    reasons; the four answers) and leafcutter.split_answer.v1, which the gate declares as its response schema (answer
    approved | rejected; parts one per offered part on approval, empty on rejection; note | null). The status progress
    block comes from DK-400f-1.
change_target: prompt
risk_surface: contract_boundary
it_requirements:
  - 'Edits only the two transport skill templates, kernel/adapters/claude_code/SKILL.md (/leafcutter) and kernel/adapters/codex/SKILL.md
    ($leafcutter), in one change so they stay in parity. Installed copies are rendered from these templates by python
    -m kernel install-skill (install.py; --force replaces an existing different file); there is no build.py output,
    no copy under templates/, and no entry in config/agent_registry.json, config/skill_registry.json or another
    watched package registry, so this AC declares package_surface: false.'
  - 'The skills stay transport only (ADR-053, ADR-060): they show what the split-gate interaction holds and relay
    what the person says. They never answer the gate, never choose a default, and never decide, merge, reorder or
    reword a part, a note or the answer.'
  - 'The split gate is presented from the packet alone: the subject verbatim, every offered part with its quote,
    dependencies and capability, and every set-aside and not-covered entry read-only with its reason. When the host''s
    question widget cannot hold every part or answer (Claude Code AskUserQuestion has a small option limit), the
    skill shows all of them in the question text and collects the answer over more than one question; it never drops,
    merges or summarises a part to fit.'
  - 'The relayed answer uses leafcutter.split_answer.v1 (ADR-067 §4.4, DK-400d-1) exactly: response_schema_id leafcutter.split_answer.v1;
    answer approved or rejected; parts with exactly one {id, review kept | edited | left_out, text only when edited,
    in the person''s own words} per offered part on approval and an empty list on rejection; the note verbatim;
    no other field; actor {kind: human, id: human:<name>}, relayed_by the host id. Not-covered and set-aside entries
    are never named in the answer.'
  - Each skill takes response_schema_id from the pending HumanQuestion's declared response schema (leafcutter.split_answer.v1
    at the split gate; leafcutter.human_answer.v1, the default, everywhere else) instead of hard-coding leafcutter.human_answer.v1
    for every human answer.
  - Each skill carries one complete split-answer submission example (JSON) that a test validates against leafcutter.split_answer.v1,
    so the prompt and the contract cannot drift apart.
  - On a kernel refusal of a split answer (exit 3), the skill shows the kernel's message to the person and asks
    again; it never repairs a human answer on the person's behalf (the one-repair rule is for host work only).
  - 'For status, the skill shows the envelope''s split progress block (DK-400f-1): each part with its outcome and
    link, and that a decided part''s record is staged and published by the person with the publish command, which
    the skill never runs.'
  - 'Host work for decompose_goal needs no new skill text: the skills follow the packet''s goal, output_requirements
    and output_json_schema as for every host operation; no operation-specific host instructions are added.'
  - 'Both skills keep their existing allowed-tools and command scope: no new kernel command is pre-approved (resume
    and status already are), and the Codex prefix rules are unchanged.'
package_surface: false
test_required: true
test_spec:
  - name: test_skills_present_split_gate_from_packet
    target_dir: tests/kernel/adapters/host_skills/
    framework: pytest
    type: integration
    angle: deployed
    description: Both skills rendered through install-skill into a temporary target state that a split gate is shown
      with the subject verbatim, every offered part with quote, dependencies and capability, and set-aside and not-covered
      entries read-only with their reasons, and that no part may be dropped or merged.
  - name: test_skills_relay_split_answer_unchanged_as_the_person
    target_dir: tests/kernel/adapters/host_skills/
    framework: pytest
    type: unit
    angle: criterion
    description: Both rendered skills state that the split answer is relayed unchanged (approve, per-part edit,
      left out, reject, note) with actor human:<name> and the host only as relayed_by, and that the skill never
      answers the gate or chooses a default, and that response_schema_id is taken from the pending question's declared
      schema.
  - name: test_skill_split_answer_example_validates_against_kernel_schema
    target_dir: tests/kernel/adapters/host_skills/
    framework: pytest
    type: unit
    angle: seam
    description: The split-answer submission example in each rendered skill parses as JSON and validates through
      leafcutter.split_answer.v1, and an example naming a not-covered entry is refused.
  - name: test_skills_show_split_progress_on_status
    target_dir: tests/kernel/adapters/host_skills/
    framework: pytest
    type: unit
    angle: criterion
    description: Both rendered skills state that on status the split progress block is shown per part with outcome
      and link, and that publishing a staged record is left to the person.
  - name: test_skills_keep_allowed_tools_and_codex_rules
    target_dir: tests/kernel/adapters/host_skills/
    framework: pytest
    type: unit
    angle: failure
    description: The rendered Claude Code allowed-tools line and the Codex prefix rules are unchanged by the split
      text.
test_rationale: This is a prompt-only change, so its executable proof is a skill-contract test over the skills as
  install-skill renders them (the installed artifact, not the template source) plus a seam test that the skill's
  own example answer validates against leafcutter.split_answer.v1. Whether a live host obeys the text cannot be
  asserted offline; that stays a manual check with a real /leafcutter run.
