it_requirements:
  - "THE TWO NOTICES PARTITION THE REMOVALS AND MUST STAY PARTITIONED. The count here must include ONLY findings removed by the location-based reduction. GE-123d-5 in the adjacent goal explicitly excludes this reduction from its own count; this record counts exactly that mechanism. Do not merge the two totals, do not let either become a general 'findings removed' number, and do not close either record as a duplicate of the other. This is a prose citation only: add NO depends_on edge into the GE-123 tree, and do not edit any GE-123 file."
  - "MEASURED IN THE CANONICAL COPIES ON 2026-08-24, and the reason the at-most-once property holds naturally: .security-allowlist suppression is applied inside scan_files in templates/skills/security-scanner/scripts/scan_secrets.py, BEFORE the hook's per-file reduction post-filter (_filter_prose_findings in templates/scripts/commit_guardian/check_secrets.py) ever sees a finding. An allowlist-suppressed finding therefore never enters the set the reduction can withhold. PRESERVE THAT ORDERING. Any implementation that re-scans with suppression disabled in order to compute the withheld set reintroduces exactly the double count the third arm forbids, and would do so while looking more thorough."
  - "The reduction must be attributed by an identifier drawn from a closed vocabulary defined in exactly one place. Two runs over the same input must produce byte-identical attribution strings. Not a sentence composed per finding, not a rendering of the matched value, and not the raw prefix that happened to match — a stable vocabulary term is what lets two runs be compared, and comparing runs is how a widening of the reduced set becomes visible."
  - "The announced total must never exceed the number of findings actually removed by this mechanism. A count that over-reports makes the protection gap look larger than it is; a number that cannot be trusted upward stops being read, and an unread number is the silence this L1 exists to remove."
  - "When a sibling (GE-125a, GE-125b or GE-125c) introduces a per-finding narrowing, it must arrive with its OWN vocabulary entry rather than being folded into the location-based term. The vocabulary is the mechanism by which the notice stays reviewable as removal mechanisms multiply; collapsing two mechanisms onto one name is the same defect as pooling two counts."
  - "The reduction name must not encode any part of the matched value, the matched line, the excerpt, or the filename of the value's source beyond the repository-relative path the notice already carries. The never-echo rule of GE-125d-1 extends to the attribution field and must not be harmonised away on the grounds that a more specific name would be more helpful."
  - "Write .security-allowlist fixtures INSIDE the throwaway repository only. Writing one into a real project root changes the behaviour of the repository the test runs in. Note the standing hazard recorded in CLAUDE.md: the deployed hook resolves the allowlist from the workspace-root symlink target rather than the worktree root, so an allowlist file placed in the wrong root is either ignored or applied far more widely than intended — a test that does not control which allowlist is in force is measuring an unknown."
  - "ADR-001 parity: the counting and attribution live in templates/scripts/commit_guardian/check_secrets.py, the canonical copy. Run `python scripts/build.py --target-dir .` and verify the deployed copy before trusting the tests; check_hook_parity enforces all four locations."
