- path: docs/acceptance-criteria/build_pipeline/BP-1600-counted-from-reality/BP-1600a-2.yaml
  relationship: context
  status: exists
  relevance: The commit-time gate census this check joins by taking a hooks_manifest entry. Naming
    it check_*.py puts it in that census, which then requires the manifest entry - decide the name
    deliberately.
- path: docs/known-issues/commit-guardian/open-blocker-ki-cg-021.md
  relationship: describes
