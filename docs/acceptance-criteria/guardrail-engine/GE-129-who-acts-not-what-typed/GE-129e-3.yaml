id: GE-129e-3
title: "Every outcome the hooks reference states for a caller or an example command is checked against what the commit guard actually decides"
component: guardrail-engine
components:
  - commit_guardian
  - documentation_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the hooks reference's caller table (GE-129e-2) and example-command table (GE-129b-3),
    each row stating a caller or a command and an outcome,
    And the hook catalogue in the same reference, and the hooks registered in the package's shipped
    settings,
  When the rules-agreement check runs,
  Then every caller row is put to the commit guard with that caller's identity and permission
    mode and `git commit -m "x"`, and every command row is put to the guard as issued by a subagent
    named python-coder,
    And a row whose stated outcome differs from the guard's decision fails, naming the row, the
    stated outcome and the guard's decision,
    And a hook registered in the shipped settings with no entry in the hook catalogue fails,
    naming the hook,
    And changing one row's stated outcome, with no change to the guard, produces exactly one
    failure naming that row.

  Given the project rules' Commit Delegation section, section 3.2.1 of the agent conventions and
    the commit specialist's instructions,
  When the same check runs,
  Then each of the three links to the caller table, and a link that does not resolve to that
    table fails, naming the surface.
