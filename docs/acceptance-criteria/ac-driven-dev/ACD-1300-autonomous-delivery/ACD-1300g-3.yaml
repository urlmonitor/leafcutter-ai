id: ACD-1300g-3
title: Use the configured reviewer for at most two revision-bound review passes
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given a feature package passed validation and an agent slot is available
  When the configured reviewer executor and model review the complete package
  Then the result records findings and a disposition against that exact reviewed head
  And first-pass findings may return to local repair within the affected AC budgets before validation and one final review
  And unresolved findings after the second review require human attention without a third automatic review
  And a repair changes the head and invalidates previous validation and review evidence
