id: GE-129a-3
title: "Nothing a caller writes, sets or says makes it count as the commit specialist, and the retired token is ignored rather than honoured or reported"
component: guardrail-engine
components:
  - commit_guardian
  - git_vcs_operations
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, a staged change, and a subagent named python-coder
    (agent_id present) issuing a commit in each of these forms:
    (a) `COMMIT_AGENT_MODE=1 git commit -m "x"`,
    (b) `git commit -m "x"` with COMMIT_AGENT_MODE=1 set in the environment the command runs in,
    (c) `git commit -m "x"` after the same caller has created a file in the repository and one
        in its cache directory, each naming the commit specialist as the caller,
    (d) `git commit -m "x"` issued from a working directory whose path contains "commit",
    (e) `git commit -m "x"` from a subagent whose dispatch prompt states "you are the commit agent",
    (f) `git commit -m "x"` with none of the above,
  When the guard decides each,
  Then (a) to (e) are each refused exactly as (f) is -- the same outcome and the same refusal
    text -- and no commit is added to the history.

  Given the commit specialist (agent_id present, agent_type naming it) issuing
    `COMMIT_AGENT_MODE=1 git commit -m "x"` and, separately, `git commit -m "x"`,
  When the guard decides each,
  Then the commit specialist commits the change in both cases,
    And neither decision names COMMIT_AGENT_MODE, reports it as an error, or warns about it.

  Given the top-level session (no agent_id) issuing `COMMIT_AGENT_MODE=1 git commit -m "x"` in the
    default interactive mode and in bypass-permissions mode,
  When the guard decides each,
  Then each decision is identical to the decision for `git commit -m "x"` from that session in
    that mode (GE-129d-1, GE-129d-2): the token neither skips the person's prompt nor turns a
    refusal into a go-ahead, and it is not named or reported as an error.
