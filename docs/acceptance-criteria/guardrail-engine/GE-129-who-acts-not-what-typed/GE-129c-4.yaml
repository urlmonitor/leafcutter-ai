id: GE-129c-4
title: "A commit refused inside an unattended run fails that step visibly, and the run does not report the work as complete"
component: guardrail-engine
components:
  - commit_guardian
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, a staged change, and an unattended run whose commit is
    refused, in three forms:
    (a) a fast lane run whose commit step issues the commit from an agent other than the commit
        specialist,
    (b) a ticket-supervisor drive whose commit phase is refused because the caller identity cannot
        be established (GE-129a-2-i),
    (c) a finalize-feature run whose closure step issues the commit from the status checker,
  When the run reaches that commit,
  Then the step is reported as failed, naming the step, the agent that was refused and the
    guard's refusal text,
    And the run does not report the acceptance criterion, ticket or feature as complete,
    And no later step that requires the commit runs,
    And the staged change is still present in the working tree, neither added to the history nor
    discarded.
depends_on:
