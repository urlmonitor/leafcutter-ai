criteria: |
  Given the project's declared vocabulary of kinds of picture, a document produced
    for each kind it declares as current, and a reference describing what an
    architecture document is made of,
  When the reference's per-kind entries are read against that declaration and
    against the produced documents,
  Then the reference holds one entry for each kind the declaration lists as a kind
    of picture and no entry for a name it does not list, with the set of kinds
    taken from the declaration at the moment of the reading rather than from a
    list written into the reference or into the observation,
  And each entry's account of the notation that kind's explanatory key covers
    matches the key the produced document of that kind actually carries, element
    for element in both directions — notation described but not produced, and
    notation produced but not described, are both failures,
  And each entry states, for every part of a produced document of that kind,
    whether it arrives already written or is left for the author to complete, and
    that statement matches what the produced document of that kind actually leaves
    open,
  And each entry names the further fact that kind obliges the author to supply, or
    states that the kind obliges none, in agreement with the declaration — and for
    a name the declaration marks as retired, in agreement with the declaration for
    the name that replaced it,
  And when a kind is added to the declaration, or retired in it, or the notation a
    kind's picture uses is changed, and nothing else is altered, the reference is
    reported as out of step rather than continuing to read as complete,
  And nothing the reference states about the invocation, about how to start a
    document, or about how to verify one is a second copy of what an authoring
    surface already publishes: each is referenced, so a correction made on that
    surface cannot leave a stale duplicate standing here.
