title: "Parity guard rejects commits that move ticket files into epic subfolders"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a staged commit that includes a git mv (or equivalent add+delete)
    moving a ticket .md file from an epic folder root
    into a subfolder named done/ within that epic folder
    (e.g., from EPIC-Foo/03_ticket.md to EPIC-Foo/done/03_ticket.md),
  When the pre-commit hook check_ticket_signoff_parity.py runs,
  Then it detects the path change as a prohibited done-folder move
  And it exits with code 1
  And it prints an error message identifying the offending file:
    "Prohibited: ticket file moved into done/ subfolder.
     Use set_ticket_status.py --status done instead.
     File: EPIC-Foo/done/03_ticket.md"
  And the commit is blocked.

  Given a staged commit that modifies a ticket's frontmatter
    to set `status: done` without moving the file,
  When the pre-commit hook check_ticket_signoff_parity.py runs,
  Then the done-folder-move check passes (no path change detected)
  And the hook evaluates the existing parity rules
    (the new rule: tickets with `status: done` must not have
     `needed` or `failed` entries in the agents: map)
  And the commit proceeds if parity holds.
