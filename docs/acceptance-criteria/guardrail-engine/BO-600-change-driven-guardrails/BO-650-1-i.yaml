criteria: |
  Given the architect agent is processing a ticket for a component
    named "guardrail-engine",
  And the docs/architecture/components/ directory contains NO file matching
    "guardrail-engine.md" or any variant of that component name,
  When the architect completes its discovery scan,
  Then it flags the gap in its output:
    "Missing architecture documentation: no component doc found for 'guardrail-engine'
     in docs/architecture/components/"
  And it produces a new component architecture document as part of its artifact output
  And the new document is added to docs/architecture/components/guardrail-engine.md

  Given the architect agent is processing a ticket for a component
    named "build-orchestration",
  And docs/architecture/components/build-orchestration.md exists but was last
    updated more than 6 months before the ticket's created date,
  When the architect completes its discovery scan,
  Then it flags the staleness:
    "Stale architecture documentation: docs/architecture/components/build-orchestration.md
     last updated <date>. Consider refreshing."
  And it reviews the existing doc for consistency with current system behavior
