id: INF-600a-5
title: "Agent frontmatter declares structured pre-flight reads"
component: infrastructure
level: L2
status: active
work_status: todo
criteria: |
  Given an agent template file that instructs the agent to read
    specific documents before starting work
    (e.g. python-coder reads: ticket body, cited ADRs,
     docs/conventions/*.md files)
  When the frontmatter is parsed
  Then it contains a `pre_flight_reads` array
  And each element in the array has fields:
    - `source` (string: a path pattern or description,
       e.g. "ticket_path", "docs/conventions/*.md",
       "cited ADRs from ticket body")
    - `required` (boolean: true if the agent must always read this,
       false if conditional)
    - `condition` (string, required when `required` is false,
       e.g. "when ticket references ADR files")
  And the array includes every document the agent's Pre-Flight Reads
    section instructs it to read
  And the card generator can produce the "Pre-Flight Self-Reads" row
    in the Knowledge Flow table from this array without parsing
    the template prose body
