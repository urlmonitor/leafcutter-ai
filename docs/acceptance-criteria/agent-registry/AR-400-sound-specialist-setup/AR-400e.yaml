notes: |
  USER DECISION 3 (BrainCandy, 2026-10-12), BINDING: RETIRE the older derived
  field in this round -- not normalise both. One derived field remains
  (skills_invoked). Every reader moves to it.

  THE READERS ARE THE TEST. The source analysis names the readers that pick
  one field each (briefing, diagram, knowledge graph edges, validation, cards,
  the done verdict, the migration helper). Removing the field while one reader
  still looks for it silently empties that view -- the opposite of this
  promise. Evidence must show each view's list for every specialist, not that
  the field is gone.

  THE WRITER THAT RE-SPLITS IT. A helper that proposes a specialist's
  self-description currently writes the derived list from prose (and adds a
  default ability). Left as is, it reintroduces a second source the next time
  it runs. Retarget it to the specialist's own declaration.

  WHY THIS IS NOT JUST "FINISH AR-300c". It could be argued as a defect in a
  done record. It is authored as a new L1 because AR-300c is done with its L2
  slots full, re-opening it would turn an approved done record into a
  composite with unfinished work, and the benefit here (every VIEW agrees) is
  stated from the reader's side, which AR-300c never did.

  2026-10-21: test contract (test_spec, test_rationale) added for composite
  closure, at the user's decision ("Add parent tests, then close"), so this
  parent can be proven done by covering tests of its own. Criteria, readiness
  and every requirement-defining field are unchanged.
