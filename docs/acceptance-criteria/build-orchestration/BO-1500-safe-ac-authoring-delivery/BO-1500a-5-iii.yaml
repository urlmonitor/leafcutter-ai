notes: |
  Authored by /quick-fix. Root cause: the workflow parses the whole reported output as one JSON document instead of the JSON payload line; it must parse the last non-empty line of output (the script's documented single-line JSON payload) so progress lines before it, on either stream, cannot break setup. Keep the change line-neutral or shrinking: the file is over the size ratchet (fold the 3-line `if (...) { wtPayload = JSON.parse(...); }` into one line) -- never SKIP check-file-size.

  Placement: BO-1500a is at its cap of 5 L2 children. This is a technical constraint on how
  BO-1500a-5's existing gate interprets the setup outcome (the gate already exists and fails closed;
  this pins which part of the reported output is the outcome), so it is an L3 under BO-1500a-5 next
  to -i and -ii rather than a new L2.

  Reconciliation with BO-1500a-1-ii: that record's fourth it_requirement says to fix the producer,
  not the consumer, and names last-line parsing as the thing not to do, on the grounds that a
  tolerant parse would hide the next stdout leak. The producer fix has landed, and the halt still
  happens because the setup agent's shell merges the command's stderr into the output it reports --
  a relay the producer cannot control. Last-line parsing does not hide a producer leak: BO-1500a-1-ii's
  own tests (unit_tests/build_orchestration/test_bootstrap_child_stdout_to_stderr.py) parse the
  command's WHOLE stdout and stay the guard for that channel. This record narrows that
  it_requirement to the producer's channel; BO-1500a-1-ii itself is not edited here, and an
  amended_by note on it is a follow-on for whoever owns that record.
