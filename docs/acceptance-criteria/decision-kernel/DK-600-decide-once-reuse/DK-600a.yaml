criteria: |
  Every option is weighed against each criterion, with the evidence cited.

  Your question is researched in your own project, and every option, including
  any you named yourself, is assessed against every criterion with the evidence
  cited, so the comparison rests on what is actually there rather than on general
  opinion. When there is no room left for another round of research, you are asked
  early and told plainly that the comparison rests on limited evidence.
