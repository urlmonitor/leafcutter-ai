notes: |
  WHY A DECLARED MARKER AND NOT A SHARPER PROXY — evidence measured on the store
  at 9b16d013, all 2,900-odd records, index.yaml excluded.

  The present trigger is `assigned_agent: python-coder` AND `component` in
  {build_pipeline, build-orchestration}. It is wrong in both directions at once:

  - OVER-MATCH. 280 records fail schema validation store-wide; 243 of them fail
    on this one rule. Most register no config key. The three records that
    *define* the rule — BO-2000d-1, BO-2000d-2, BO-2000d-1-i — are themselves in
    the failing set. A rule its own specification cannot satisfy is not a rule
    about package surfaces; it is a rule about a spelling.

  - UNDER-MATCH. `component` is the AC-store namespace key from
    docs/acceptance-criteria/index.yaml, where the namespace is declared as
    `build-pipeline` (kebab). The trigger enum lists `build_pipeline`
    (underscore), which is a docs/components.json graph id — a different axis.
    Consequence: 440 records carry `component: build-pipeline` and are invisible
    to the rule, while 65 stragglers spelling it `build_pipeline` are caught.
    239 python-coder records sit in the kebab namespace and 215 of those carry
    no structured spec at all. The gate has never once fired on them.

  - THE PROXY IS NOT EVEN TRUE OF THE COMPLIANT SET. 245 records carry the
    object form; 73 of them set `config_schema_fragment: null`. Nearly a third
    of the population that satisfies the rule registers no config key and had to
    write an explicit null to get through. "python-coder in these components"
    and "registers a package surface" are simply different sets.

  SCOPE BOUNDARY — read before extending this AC. This tree specifies the
  trigger narrowing ONLY. The backfill of the 243 already-failing records into
  the object form is deliberately NOT in scope: it is a separate epic and it
  must depend on TICKET-20260710-ITPOv3-StructuredItRequirements.md, so the
  authoring agent stops emitting list-form implementation requirements before
  the backfill begins. Backfilling first would be rework.

  WHAT DOES NOT CHANGE. The five-field completeness requirement is already
  carried by the `it_requirements` object branch itself, independently of the
  trigger — any record using the object form is held to all five fields today
  and must still be. Narrowing the trigger removes the *coercion into* the
  object form; it must not relax the object form's own shape. ACS-100i-6-i
  pins that.
