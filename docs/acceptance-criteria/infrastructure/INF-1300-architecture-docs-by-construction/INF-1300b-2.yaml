id: INF-1300b-2
title: "The explanatory key explains the notation this kind of picture uses, and is the same for every document of that kind"
component: infrastructure
components:
  - documentation_system
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/infrastructure/INF-1300-architecture-docs-by-construction/INF-1300b.yaml"
criteria: |
  Given a document is produced for a given kind of picture,
  When its explanatory key is read against the picture skeleton produced with it,
  Then the key has one entry for each notation element the skeleton uses, and no
    entry for notation the skeleton does not use,
  And each entry states what that element of the notation means in general — what
    a boundary encloses, what an arrow asserts, what a lifeline stands for — and
    not what any particular box or arrow in this document stands for, which is
    left for the author,
  And producing a second document of the same kind yields a key with the same
    entries, while producing a document of a different kind yields a key with
    different entries, so the key follows the kind of picture rather than being
    one fixed block reproduced in every document,
  And the key's content is derived from the project's own declared vocabulary of
    kinds and the skeletons it publishes for them: no part of the produced key,
    and no instruction accompanying it, attributes the key to a source document
    that does not define one.
