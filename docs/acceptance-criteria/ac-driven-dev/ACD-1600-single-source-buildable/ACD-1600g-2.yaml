notes: |
  THE COMPOSITION RULE -- the single most likely defect in this L1, called out
  explicitly in ACD-1600g's notes and again in the component PROJECT_CONTEXT.md.

  THE RULE, STATED AS SET ALGEBRA:
    bundle.boundary = (UNION over members of member.out_of_scope)
                      MINUS (UNION over members of member.files_touched)
  It is a DIFFERENCE. `bundle.out_of_scope = union(members' out_of_scope)` is
  WRONG and produces a false blocker on essentially every real bundle, because
  one member's exclusion is routinely another member's change surface -- that is
  precisely what a bundle is for. The three Given clauses above are constructed
  so that a naive-union implementation fails the second Then and only the second
  Then, which makes the defect diagnosable from the test name alone.

  WHY THE RULE IS NEEDED AT ALL. Under ACD-1800c the ticket becomes a grouping
  container whose scope is the union of its member ACs, so a per-ticket
  `out_of_scope` becomes undefinable -- there is no single author of the bundle's
  exclusions and any value written at container level is an assertion nobody
  owns. Composition therefore has to be DERIVED from the members, and the
  derivation rule is this one.

  THE INPUTS ALREADY EXIST ON ONE SIDE. `files_touched` is already derived
  AC-side by `_build_files_touched()` (scripts/ac_store/generate_ticket_from_ac.py
  ~line 497) as the union of (1) it_requirements reference_file_path / path
  tokens scraped from prose bullets and (2) doc_links whose `relationship` is in
  `_EDIT_SURFACE_RELATIONSHIPS` (constrains / creates / implements / modifies /
  specifies; `describes` and `related` are excluded). That derivation is the
  minuend of the difference and must not be re-implemented here. Note the
  practical consequence: a member whose it_requirements are still null (every AC
  this pass authored, pre-IT-PO) derives an EMPTY files_touched, so before
  enrichment the difference degenerates to the union. State that in the
  implementation; do not let it surprise a reviewer.

  MATCHING GRAIN IS AN OPEN IMPLEMENTATION QUESTION FOR THE IT PO, NOT A GAP IN
  THIS AC. change-scope-reviewer's Tier 2 rule matches on "the file's top-level
  directory or component is listed in out_of_scope", i.e. prefix/component grain,
  while `files_touched` is exact paths. The subtraction must compare like with
  like or an exact-path change will fail to cancel a directory-grain exclusion.
  ACD-1600g-2-i covers the behaviour; the chosen normalisation is a technical
  decision.

  TESTABILITY. Execute the composition against three real on-disk AC records and
  assert the resulting set. A test that asserts "the code calls difference() and
  not union()" is a grep test in disguise and proves nothing about the result.

  2026-08-17 (IT PO enrichment). Three technical decisions, one of which the BA
  explicitly deferred here.

  - THE GRAIN QUESTION IS ANSWERED IN ACD-1600g-2-i, NOT HERE. What this AC owes
    that leaf is a SINGLE normalisation seam. The realistic failure is not picking
    the wrong normalisation -- it is normalising in two places (once when unioning
    the exclusions, once when subtracting the change surfaces) and having the two
    disagree. That defect passes every test in this AC's own list and only shows
    up as an intermittent false blocker on directory-grain exclusions.

  - PROVENANCE IS A REQUIREMENT OF THIS AC, EVEN THOUGH ITS CONSUMER IS
    ACD-1600g-3-i. A set of paths is lossy: once the members' exclusions are
    merged, the identity of the excluding member is unrecoverable without redoing
    the composition. Retrofitting provenance later means rewriting this function,
    so the composed result carries `excluded_by` per path from the first commit.

  - REUSE OF `_build_files_touched()` IS PROMOTED FROM A NOTE TO A CONSTRAINT,
    with a test of its own. The BA's note says it "must not be re-implemented
    here"; nothing in the criteria makes that observable, so a copy would ship
    green. The added test mutates one member's it_requirements prose and asserts
    the composed result changes, which only holds if both sides share one
    derivation.
