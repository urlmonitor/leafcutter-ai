readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a fault entry whose headline makes a claim about how the system behaves —
    a claim no lookup can settle — and whose every structured reference resolves
    correctly,
  When the register is checked,
  Then the entry is not flagged,
    And the entry is not reported as verified, checked or up to date.

  Given any run of the check,
  When its output is read,
  Then it states which kinds of staleness it looked for,
    And it states which kinds it does not look for, naming claims about behaviour as
      one of them,
  So a reader knows what a clean result covers before relying on it.

  Given a run in which no entry was flagged,
  When the output is read,
  Then it states how many entries it examined and how many references it resolved,
    And a run that examined no entries is distinguishable from a run that examined
      all of them and found nothing.

  Given the kinds of staleness the check does look for,
  When each is compared against what the check actually decides,
  Then every kind it claims to look for is one it decides,
    And no kind it decides is missing from the claim,
  So the stated scope cannot drift from the implemented scope in either direction.
