id: UXP-700e-2-ii
title: Contract labels are derived from the metadata and never written into a step description
component: ux-prototyping
components:
- ux_prototyping
level: L3
status: active
req_status: active
work_status: done
readiness: reviewed
priority: medium
criteria: 'Given a node''s structured contract metadata is authoritative and its description is one authored
  sentence of what happens,

  When the Product Truth generator runs after a field or example changes,

  Then the updated flow artifact is written with compatibility input and output labels derived from that
  metadata,

  And the description is left unchanged, with no generated contract text added to it,

  And a second generation without a source change leaves the generated content unchanged,

  And the validator rejects a hand-edited compatibility label that disagrees with the canonical rendering,

  And the validator rejects a step or branch description that is longer than the declared bound, holds
  more than one sentence, or contains code-shaped content such as file paths, identifiers, ids, build-status
  words or generated contract text, while plain-English sentences pass,

  And it rejects a step whose actor kind is missing or is not one of deterministic, jev, llm or human.'
depends_on:
- UXP-700e-2
