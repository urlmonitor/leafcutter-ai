notes: |
  Behaviour (d) of the four the parent BO-400e names, and the second one the parent warns a
  decomposition drops.

  A SINGLE-TICKET TEST CANNOT SEE THIS DEFECT AT ALL. Either branch looks correct in
  isolation: the refusal is defensible on its own, and the done write is defensible on its
  own to anyone who did not read the record. The defect IS the disagreement between two
  tickets, so any test covering this record must carry several tickets in the identical
  state through ONE run and compare their answers to each other. Four separate single-
  ticket runs, each asserted independently, reproduce nothing -- they are the same blind
  spot that let the original observation look like agent caprice.

  THE FOURTH TICKET IS THE CONTROL AND IS NOT OPTIONAL. Without it, a run that refuses
  every close satisfies every clause about agreement and strictness. "All the same answer"
  is a property that a completely broken writer holds trivially; only the contrast with a
  ticket that IS written finished makes the three refusals attributable to the missing
  sign-off.

  ORDER-INDEPENDENCE IS IN THE CRITERIA DELIBERATELY. The observed split was ticket 01
  refused, tickets 03 and 20 written -- an outcome that correlates with position in the
  run. An implementation whose answer depends on how far into the run the ticket sits has
  not converged; it has moved the disagreement somewhere harder to see.

  VERIFY BY EXECUTION, NEVER BY GREP. Nothing about this record is observable in the
  source: the broken driver and the fixed one both contain completion code, a phase list
  and a parity check. Only reading back the four records a single run produced can tell
  them apart.

  BOTH TWINS IN ONE CHANGE, per BO-400a-2-ii's standing constraint.
