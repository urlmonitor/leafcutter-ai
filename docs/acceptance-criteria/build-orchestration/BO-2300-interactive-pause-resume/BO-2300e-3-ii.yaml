    relationship: describes
    status: exists
it_requirements:
  - "The peek/read reply parser must treat 'no reply', a transport/exception error, and a reply that fails to parse as JSON or lacks the exists/record shape as the same 'could not determine' category as a refusal (BO-2300e-3-i) -- never coerced to the empty-result default."
  - "Any exception encountered while parsing or transporting the dispatch reply must be handled per the project error-handling policy (typed except, WARNING+ log, no silent swallow) on the way to producing the 'could not determine' outcome -- it must not itself be swallowed into a default empty result."
  - "In the current code, `await agent(...)` for both peek-pause-record (peekPausedGateId) and read-pause-record (resolveGate) sits OUTSIDE the existing try/catch -- only the subsequent parseAgentJson(...) call is wrapped. A transport/execution error raised by the dispatch itself therefore currently propagates uncaught rather than reaching any classification logic at all; the fix must additionally wrap the dispatch call itself (or equivalent) at BOTH sites, or this AC's transport-error scenario cannot be reached in normal execution."
  - "This must hold independently at BOTH call sites: peekPausedGateId()'s peek-pause-record dispatch and resolveGate()'s read-pause-record dispatch."
  - "TEST STRATEGY: via unit_tests/_workflow_engine_harness.py run_workflow_under_e2(plan-feature.js), stub the peek/read dispatch to (a) return no reply, (b) raise a transport error, and (c) return non-JSON/malformed data in turn, and assert each is classified as 'could not determine' -- exercised against both the peek-pause-record and read-pause-record labels."
  - "FILE-SIZE and REACHABILITY: this AC's own fix and cost are accounted for under its parent BO-2300e-3's it_requirements (the KI-CG-20260923 net-content-line constraint, including the try/catch-around-the-dispatch-itself change this AC specifically requires, and the shared-classification-helper recommendation); this record contributes no independent lines of its own, only the failure-shape test coverage. Reachability (BO-2900a-3) is proven the same way as the parent -- via run_workflow_under_e2(plan-feature.js) actually executing the failure-classification branch (including the transport-error path, which requires the dispatch call itself to be reachable inside a try/catch) on a real run, never a synthetic classifier-function fixture."
test_spec:
  - name: test_no_reply_reported_as_could_not_determine
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Via the harness, a peek-pause-record or read-pause-record dispatch that returns no reply at all is classified as 'could not determine' (checked for both labels)."
  - name: test_transport_error_reported_as_could_not_determine
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Via the harness, a peek-pause-record or read-pause-record dispatch that raises a transport/execution error from the agent() call itself (not just from parsing its reply) is classified as 'could not determine', with the error handled per the project error-handling policy rather than propagating uncaught or being silently swallowed. Checked for both labels."
  - name: test_malformed_reply_reported_as_could_not_determine
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Via the harness, a peek-pause-record or read-pause-record dispatch reply that is not valid JSON or lacks the expected exists/record shape is classified as 'could not determine' (checked for both labels)."
