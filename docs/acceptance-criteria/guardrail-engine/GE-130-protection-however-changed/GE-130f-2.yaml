id: GE-130f-2
title: The guide-read guard is seen to stop an edit to a gated folder whose guide has not been read, through
  the way a session invokes it
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the guide-read guard's declared known-bad input, in the declaration form GE-120f-1
    defines: an edit made with the editing tools to a file inside a folder the guard gates,
    whose nearest guide has not been read in this session, with no guide-check override in
    effect,
  And its declared acceptable input: the same edit made after that guide has been read in this
    session with the reading tool,
  When both inputs are put through the entry point a Claude Code session invokes the guard by,
    in the main working copy of a project where the gated folders are reached through links
    into the installed copy of the package, in the way GE-120c-1's harness runs checks,
  Then the known-bad edit is not carried out and the refusal names the file and the guide that
    must be read first,
  And the acceptable edit is carried out with no refusal, in the same run,
  And the guard's liveness record, as GE-120f-1 defines it, says the rejection was observed,
  And every folder the guard gates is either present in the project it is installed in or named
    by the run as gating nothing in that project, so a gated folder that matches no path is
    never counted as protection.
depends_on:
- GE-130f
- GE-120f-1
- GE-130f-1
