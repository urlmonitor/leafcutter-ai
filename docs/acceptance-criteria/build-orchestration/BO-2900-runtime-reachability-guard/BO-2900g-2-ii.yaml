title: "The declaration is not handed out for merely mentioning a write, so an author is never asked to choose between two false statements"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a leaf piece of work whose stated behaviour is that some text reaches a
      stream a person watches, and nothing outlives the run,
    And a second whose stated behaviour is that a document SAYS something happens,
      where the happening is another piece of work's job and this one only has to
      describe it,
    And a third whose stated behaviour merely names where something lives — the
      place entries of a certain kind are kept,
  When each is asked whether it changes something real,
  Then none of the three is said to,
    And a fourth, whose stated behaviour is that a file exists and can be read
      back after the run, still is,
  Because the parent asks for a durable, observable change and names what it
    means by one; a line on a screen that is gone when the terminal closes is not
    that, a sentence describing someone else's write is not that, and the name of
    a folder is not that.

  Given an author who has read their own record and can see it changes nothing
      real, while the check insists it does,
  When they try to record what is true,
  Then they can, and the record is accepted,
  Because today they cannot: the value is rejected when it disagrees with the
    check, so the only two moves available are to declare an effect the work does
    not have, or to reword the requirement until the check stops objecting.
    Both put a false statement in the store, and the second quietly edits a
    requirement to satisfy a tool. An author who is right must not be forced to
    be wrong.

  Given the change to what counts is being made,
    And some records already in the store carry the declaration on the strength
      of the old, looser reading,
  When the change lands,
  Then every record the change itself turns into a contradiction is corrected in
    the same change,
    And the number of records whose recorded answer disagrees with the check does
      not go up,
    And a record that already disagreed before the change, and still disagrees
      for the same reason afterwards, is left alone and written down instead,
  Because a stricter reading that leaves new contradictions behind converts one
    wrong answer into a queue of broken builds on other people's work — while
    quietly rewriting records that were already wrong, in trees this change has
    no business in, hides an unrelated fault instead of fixing it.
