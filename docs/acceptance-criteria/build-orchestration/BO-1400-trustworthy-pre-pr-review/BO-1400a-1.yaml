assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "Detection of a bulk/quantitative claim is a review-checklist judgment in the pr-reviewer agent template: recognize universal/quantitative language in the ticket's ACs (all / every / none / no record / N records / a percentage of records) that asserts something about a whole body of stored data."
  - "When such a claim is detected, the review must execute the asserted validation against the real data store rather than accepting a reported count — the actual validation invocation (e.g. running the schema validation over every real record) is a helper concern, not an LLM judgment."
  - "The review must report observed pass/fail counts in its findings and raise a high-confidence blocking finding when the observed result contradicts the claim."
  - "A clean verdict on the claim is only reachable when the real-data run was actually performed; a sample-only or self-reported basis must not yield a clean verdict on that claim."
delivers_to:
  agent: python-coder
  contract: "Deterministic all-records validation runner (suggested home: scripts/pr_review/realdata_verifier.py). Input: the validation the AC asserts (e.g. a JSON-schema / validator invocation) plus the real store location. Output: { total: int, passed: int, failed: int, failing_ids: list[str] } over EVERY real record (no sampling). The reviewer (llm-expert pr-reviewer template) consumes these observed counts to decide PASS vs BLOCKER and to populate its reported figures; the helper performs no judgment. The reviewer cannot reach a clean verdict on the claim without this runner having been executed."
