test_rationale: >-
  Reading the producer cannot settle this record. A producer holding one hard-written key
  per kind and a producer deriving each key from the declaration emit identical output on
  every single run and are indistinguishable by inspection; only adding a kind separates
  them, which is why the movement descriptor is present here and not left entirely to
  INF-1300d-1-i. The different-kinds comparison is the second irreplaceable arm and the one
  the present authoring instruction would have failed: the surfaces say the key is a fixed
  block reproduced verbatim, and the six documents in the corpus that carry a key carry at
  least three different shapes, so "emit a fixed block" is not merely unsourced but the
  wrong requirement. The bidirectional notation-coverage assertion is what keeps a derived
  key honest after the skeletons move; a one-directional check passes on a key that has
  grown stale entries.
