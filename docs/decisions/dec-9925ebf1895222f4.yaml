question: 'How should we build the two approved Decision Kernel AC trees with /build-ac and then /build-feature: DK-500 reusable
  decision criteria (57 leaf ACs) and DK-400 split compound requests (50 leaf ACs)? Decide the build order, the epic size
  (one epic per tree or one epic per L1), whether the trees run in parallel, and what must happen before the first build starts.'
