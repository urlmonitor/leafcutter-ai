criteria: |
  Given the automatic end-of-build spot-check pass has run and at least one reviewer
    reported a blocking issue
  When /build-feature produces its completion output for the feature
  Then the completion output explicitly surfaces the blocking spot-check findings rather
    than declaring the feature cleanly done
  And the completion output states how many blocking findings were raised and by which
    reviewer angle
  And the completion output points to where the findings were recorded as tracked work
