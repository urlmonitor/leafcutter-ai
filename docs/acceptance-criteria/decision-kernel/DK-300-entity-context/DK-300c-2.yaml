notes: |
  New behavioral requirement derived from the user-authorized entity-context concept.
  BA behavior and IT PO technical contracts are reviewed; implementation is verified by the independent strict entity suite and recognition corpus.
  Verification evidence: reports/entity-context-verification.md. No human approval is implied.
  Historical DK-200 direct-gather tests and evaluation reports are preserved.
  Fresh-run wiring criteria were explicitly reconciled to EntityContext on 2026-10-04.
estimated_complexity: L
it_requirements:
  - "Use the intersection of configured source IDs, task source IDs, read_repo permission, read roots, global/source deny patterns and resolved-path/symlink policy before matching/counting."
  - "Broad-cache records denied by a narrower run must not influence uniqueness, candidates, counts, fingerprints, errors, provider/host projection or telemetry."
  - "Absent read_repo yields no cached repository cards or content-derived fingerprint; direct canonical-reference hints cannot bypass the same read policy."
  - "Initial recognition performs zero repository writes, external/network/model/embedding calls, host operations and human interactions."
test_required: true
test_spec:
  - name: "test_narrow_scope_filters_broad_cache_before_matching_and_counts"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_permissions.py::test_narrow_scope_filters_broad_cache_before_matching_and_counts: Prepare a broad cache, restrict sources/read roots/deny globs, and assert only permitted cards, scope-derived counts/fingerprint and no denied name/title/path/signature/hash anywhere."
  - name: "test_resolved_paths_and_symlink_escapes_cannot_leak_metadata"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "boundary"
    description: "tests/kernel/entity_context/test_permissions.py::test_resolved_paths_and_symlink_escapes_cannot_leak_metadata: Exercise ../ references and a symlink escape through real policy and cached/direct lookup paths; assert no escaped entity metadata."
  - name: "test_no_read_repo_and_forbidden_side_effects_stay_blocked"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "discrimination"
    description: "tests/kernel/entity_context/test_permissions.py::test_no_read_repo_and_forbidden_side_effects_stay_blocked: Run recognition without read_repo and with spies on forbidden APIs; assert empty repository meanings/fingerprint, zero forbidden calls and unchanged source files."
    must_catch: ["Filtering denied cards only after ambiguity and counts have been computed.","Allowing a cached card to bypass missing read_repo."]
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
