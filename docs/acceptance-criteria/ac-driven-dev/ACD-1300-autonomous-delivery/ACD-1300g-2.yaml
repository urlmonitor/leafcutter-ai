id: ACD-1300g-2
title: Validate the accumulated feature before submitting complete evidence to review
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given every planned required AC has local evidence in one accumulated feature worktree
  When the feature's required project checks run
  Then only a passing result produces a review package containing the exact head revision, full feature diff, per-AC evidence and source references
  And failed combined checks return to local repair within the affected AC budgets or produce a validation blocker
  And evidence covers every required L1, L2 and L3 behavior, including parent positive behavior above executable negative leaves
  And no failing or incomplete package is presented as ready for review
