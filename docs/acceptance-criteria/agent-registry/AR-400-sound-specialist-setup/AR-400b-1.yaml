id: AR-400b-1
title: "An instruction to use an ability the specialist's own definition does not grant stops the build, naming both sides"
component: agent-registry
components:
  - agent_registry
  - skills_system
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a package tree in which the ability "knowledge-query" exists,
    And the definition of a test specialist "probe-agent" grants only "signoff"
      and, on line 88 of its instructions, says "load the `knowledge-query`
      skill to search the graph",
  When the build runs over that tree,
  Then the build stops with a failing result naming "probe-agent",
    "knowledge-query", the file and line 88, classified as "ability exists but
    is not granted",
    And the finding states the abilities "probe-agent"'s own definition grants
      ("signoff"), so both sides of the mismatch are on one line,
    And adding "knowledge-query" to "probe-agent"'s own definition makes the
      same build pass with no finding about it,
    And, as a control, a specialist whose own definition grants "signoff" and
      whose instructions say "load the `signoff` skill" produces no finding,
      including when the derived central registry entry for that specialist does
      not list "signoff" at all.
depends_on:
  - AR-400b
  - AR-400a-1
doc_links:
  - path: docs/acceptance-criteria/agent-registry/AR-300-granted-abilities-arrive/AR-300c.yaml
    relationship: related
    status: exists
    relevance: "The own declaration is the truth; the central registry copy is derived. The comparison is against the declaration."
  - path: docs/acceptance-criteria/infrastructure/INF-600-self-describing-agents/INF-600g-3.yaml
    relationship: related
    status: exists
    relevance: "SUPERSEDED by this record (its template->registry direction) and AR-400c-1 (its registry->template direction). It compared prose against the derived registry and warned."
  - path: docs/reference/agent-template-frontmatter.md
    relationship: describes
    status: exists
    relevance: "The `skills:` declaration read as the grant side."
  - path: docs/architecture/components/agent-registry.md
    relationship: describes
    status: exists
    relevance: "The derived registry copy that this check must NOT read."
assigned_agent: python-coder
estimated_complexity: M
change_target: code
risk_surface: internal
package_surface: false
it_requirements:
  - "NEW MODULE: the grant comparison lives in scripts/agent_skill_ref_grants.py (design name), a pure function over (recognised references, parsed declarations). It does no I/O of its own; validate_agent_registry is the I/O boundary that reads templates and calls it."
  - "GRANT SIDE = THE SPECIALIST'S OWN `skills:` FRONTMATTER, parsed by agent_ability_verdict.normalize_entries (the single declaration parser). config/agent_registry.json (skills_invoked or skills_used) is never consulted for this comparison -- not as the primary source, not as a fallback, not as a union."
  - "The 'not granted' line states both sides: the subject, the referenced ability, file:line, and the full list of abilities the own declaration grants (or 'nothing')."
  - "A malformed declaration is not 'grants nothing': it is reported by the existing malformed-declaration path (agent_declaration_shape) naming the value, and the grant comparison for that specialist is skipped with that stated, never silently computed against an empty set."
  - "descriptive_only registry entries play no part (they are registry-side and the registry is not read)."
test_spec:
  - name: test_ungranted_existing_ability_fails_naming_both_sides
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: criterion
    description: "Copied package slice: probe-agent grants only signoff and line 88 says 'load the `knowledge-query` skill to search the graph'; the validator CLI fails with one 'ability exists but is not granted' finding naming probe-agent, knowledge-query, file, line 88 and the declared grant list ['signoff']."
  - name: test_adding_grant_to_own_declaration_clears_the_finding
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: discrimination
    description: "Add knowledge-query to probe-agent's `skills:` frontmatter in the copy; the same run passes with no finding about it."
  - name: test_granted_signoff_with_registry_lacking_it_produces_no_finding
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: discrimination
    description: "Control: a specialist whose frontmatter grants signoff and whose body says 'load the `signoff` skill', with its registry entry edited to omit signoff from every ability field, produces no finding."
    must_catch:
      - "the comparison reads registry skills_invoked"
      - "the comparison reads registry skills_used"
test_rationale: >-
  The control descriptor is the 2026-10-12 real false positive
  (live-surface-tester, business-analyst, it-po): it fails on any
  implementation that reads the derived copy, which is the defect this record
  ends.
delivers_to:
  agent: python-coder
  contract: "Grant-coverage verdict per (agent, referenced ability): granted | ungranted, computed from the agent's own frontmatter declaration only; consumed by the registry validator and the build (AR-400b-4). Shape: list[{'subject': str, 'ability': str, 'file': str, 'line': int, 'kind': 'ungranted', 'declared': list[str]}], appended to the AR-400a-1 findings list."
expects_from:
  ac_id: AR-400a-1
  contract: "The per-reference findings pass this record extends with the 'ungranted' kind."
origin_agent: BrainCandy
created: 2026-10-12
created_by: docs/acceptance-criteria/agent-registry/AR-400-sound-specialist-setup/AR-400b.yaml
amended_by: []
superseded_by: null
covered_by:
  - AR-400b-1-i
implemented_by: []
notes: |
  THE CONTROL CLAUSE IS THE REAL-TREE FALSE POSITIVE. On 2026-10-12 the build
  warned that live-surface-tester, business-analyst and it-po reference
  "signoff" without declaring it -- yet each one's own definition grants it.
  The warning came from comparing against the derived central copy, in which
  those agents carried only the older derived field. Under this record those
  three produce no finding.

  WHICH SIDE TO FIX IS PER INSTANCE (AR-400b notes). The check only names the
  mismatch; AR-400b-3 decides each real one.
