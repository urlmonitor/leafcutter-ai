criteria: |
  Catch an unfit dispatch before it burns a run -- fitness is checked at spawn.

  When a supervisor is about to spawn a phase agent, a fast fitness check runs
  first. It confirms the ticket's stated premises still hold, that the agent about
  to receive the work is the right one for it, that the hand-off carries only a
  safe, minimal pointer, and that the agent can actually reach the checks its own
  instructions oblige it to perform. A dispatch that fails the check is held back
  with a clear reason instead of being spawned, running, and then failing. You
  stop paying for doomed runs and retry loops caused by problems that were visible
  before the first token was spent. This stage sits between reading a ticket and
  spawning its agent -- distinct from BO-100 (which only decides the ORDER tickets
  run in), BP-300b (which keeps the planner on fresh sign-off state), and BO-100d
  (which checks the telemetry sink once per drive).
