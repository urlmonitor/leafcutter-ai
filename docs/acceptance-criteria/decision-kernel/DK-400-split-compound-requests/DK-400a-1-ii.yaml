notes: |
  Keeps gap counts honest in both directions (DK-400 ROADMAP ALIGNMENT): a compound request
  is not counted as a gap, and a real gap is not hidden behind a split.
  OPEN (reported to the user): whether a gap is recorded when the person REJECTS the split of a
  turned-away request (DK-400d-3-i). The person may be saying "this is one question", and then
  the kernel still cannot meet it. This AC deliberately covers only the approved case.
