id: GE-127f-3
title: "Any addition engages the rule, and the outcome states how much must leave the file and whether the author may take it out or a restructuring specialist is asked to"
component: guardrail-engine
components:
  - commit_guardian
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a threshold, separating a demand an author may discharge inside the same
    change from one that is handed to a restructuring specialist, is settled at
    technical enrichment and is at least one measured line,
  And a tracked file of a kind the size standard covers stands at 2,677 measured
    lines before the change, against a permitted length of 400,
  And a change is staged that replaces one measured line of that file with one
    different measured line, so the file still stands at 2,677,
  When the author performs an ordinary commit,
  Then the commit does not complete — there is no size of addition small enough
    for an already-oversized file to be exempt from the rule,
  And the outcome states that one measured line must leave the file, and states
    that a demand of that size may be discharged by the author inside this change,
  And given the same change with one further measured line taken out, leaving the
    file at 2,676,
  When the author performs an ordinary commit,
  Then the commit completes,
  And given instead the same 2,677-line file and a change whose demand exceeds
    that threshold,
  When the author performs an ordinary commit,
  Then the commit does not complete, and the outcome states how many measured
    lines must leave the file and states that a demand of that size is handed to a
    restructuring specialist rather than to the author inside this change,
  And given a tracked covered file standing at 410 measured lines against a
    permitted length of 400, refused with a demand that exceeds the threshold,
  When the author reads the outcome,
  Then it states that this demand too is handed to a restructuring specialist,
  And given the 2,677-line file refused with a demand of one measured line,
  When the author reads the outcome,
  Then it states that this demand may be discharged by the author — so which of
    the two the author is told follows from the size of the demand alone, and
    never from how large the file is or how far above its permitted length it
    stands.
