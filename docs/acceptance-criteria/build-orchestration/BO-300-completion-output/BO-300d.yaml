criteria: |
  A run that did part of the job says how much is left and what to do about it.

  When a run ends with work still unbuilt, its closing report states how many
  pieces were not built, names them, and says for each one why it was left — a
  cause only where the run can establish that cause from what it holds, and an
  explicit "cause not determined" where it cannot — together with the action that
  finishes it. A run that built part of the work can never read as one that
  finished it, and you never have to compare what ran against what exists to find
  out the difference.
