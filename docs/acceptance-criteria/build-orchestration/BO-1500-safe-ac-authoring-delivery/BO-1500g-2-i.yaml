notes: |
  Reproduces the reported incident end to end: two concurrent sessions wrote into one
  checkout, the two copies of the store subtree drifted, and one session's pull request
  carried the other session's in-flight drafts.

  Re-homed 2026-08-14 from BO-1500a-7-i to BO-1500g-2-i by the Pattern C intermediate
  split of BO-1500a. Criteria text is unchanged. The narrowing obligation recorded on
  BO-1500f-2 against this AC's feature_key notion is preserved and restated in the
  constraints above so it is not lost across the f/g boundary.
