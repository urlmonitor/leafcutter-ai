notes: |
  REVISED 2026-10-09: the party is now the restructuring specialist (BrainCandy's
  decision), no longer python-coder. BO-3800c's L1 was amended the same day so that "what
  the standard demands" covers a complexity ceiling as well as lines to remove.

  THE THIRD ARM IS THE ONE A FIRST BUILD MISSES. One commit can refuse several functions,
  each with its own ceiling. A function already over the limit is held to its previous
  score, a new one to the limit itself. A brief carrying only the first function, or one
  shared ceiling, sends the specialist to fix half the refusal. The retry is then refused
  again, which spends BO-3800d-3's bound on a defect of the brief.

  NAMED MUTATION. THE FIRST LINE ONLY: carry only the first refused function.
  MUST GO RED: arm three. MUST STAY GREEN: arms one and two, and every arm of BO-3800b-3.
