id: INF-400b-3
title: "V3 agent knowledge-capture prompt is domain-appropriate for specification work"
component: infrastructure
level: L2
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
criteria: |
  Given the standard signoff section 7 prompt is designed for phase agents doing
    implementation work ("Did you discover anything during this ticket..."),
  When the v3 agent knowledge-capture step (INF-400b-1) fires for a PO, BA, or IT PO,
  Then the prompt is adapted to the specification domain, asking about:
    - Component conventions discovered while reading standing ACs or component docs,
    - User framing preferences discovered while translating user requests to L0/L1,
    - Cross-component relationships discovered while traversing the component tree,
    - Naming patterns or structural rules discovered while reading the AC store,
  And the prompt does NOT ask about code patterns, test strategies, or implementation details
    (since v3 agents never read source code),
  And the prompt provides 2-3 concrete examples of learnings worth capturing
    to help the agent distinguish signal from noise.
depends_on: [INF-400b, INF-400b-1]
