id: TQ-600a-13-x
components:
  - testing_quality
title: "The hold is rolled out advisory first, becomes required only after its prerequisites and correct verdicts are observed, is demoted on repeated false reds, and is described as advisory whenever it is not required"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given that a failing status check blocks a merge only when the main branch's ruleset
    (`require-ci-lint`, id 17810993) lists it as required, that the ruleset is edited by
    hand by the owner, and that on 2026-10-08 it listed six required checks, all sourced
    from GitHub Actions, of which `Post-merge suite status` was not one,
  And the platform facts that make the order of rollout matter: a check triggered by
    `pull_request_target` does not run on the pull request that introduces it; GitHub
    will block `pull_request_target` by default in public repositories from 2026-11-02
    unless an explicit Actions event policy allows it, and this repository had no such
    policy on 2026-10-08; and a required check that never reports leaves every pull
    request waiting on it forever,
  And the defect this record exists to prevent in two directions: "the check exists and
    fails" being read as "merges are held", and a required check that cannot report — or
    that holds on noise — freezing every merge,
  And the owner's decision of 2026-10-09 that the required context is sourced from the
    repository's dedicated hold App (App ID 5249547), not from GitHub Actions, because any
    Actions job — including one a pull request adds — can report under any name, and the
    ruleset's source pin is the only thing that tells the two apart,
  When the hold is moved from advisory to required, or described as protecting the main
    branch, or kept required,
  Then it is added to the ruleset only after each of these has been observed on the real
    repository and recorded with its date and evidence, in this order: the correctness
    workflow has at least one completed run on main; the labels the family uses exist; an
    Actions event policy explicitly allowing `pull_request_target` exists, read back from
    the repository; the App's credential is stored where only the hold's evaluation job
    on the default branch can read it, and a workflow added by a pull request from a
    branch of this repository has been observed unable to read it; the check run
    `Post-merge suite status` has been observed posted by App 5249547 — the creating app
    read back from the check run itself — on a pull request opened after the hold
    workflow reached main, on pull requests touching only documentation, only tests, and
    only a workflow file, and on opened, synchronize and edited events; a re-evaluation by
    TQ-600a-13-xv has been observed, including one of a head commit that already carried
    an App verdict, where the pull request's merge status follows the newer App check
    run; the owner's break-glass procedure of TQ-600a-13-xvii is documented; and an
    advisory period of at least 7 days has produced at least 20 hold evaluations whose
    verdict matched the run history, including at least one hold and one lift,
  And the ruleset entry for `Post-merge suite status` is added with its source set to the
    dedicated hold App's integration id (App 5249547), never to GitHub Actions (15368) or
    to any source, unlike the other six,
  And after the entry is added, with the run red, a pull request carrying no exemption is
    observed reported unmergeable by the hosting service, and the observation is recorded,
  And after the entry is added, with the run red, a pull request that adds its own
    workflow with a job named `Post-merge suite status` that exits zero is observed
    reported unmergeable by the hosting service, its passing same-named check
    notwithstanding, and the observation is recorded,
  And until that last observation is recorded, and at any time the entry is absent, every
    description of the hold — in this family's closure, in documentation, in a change note
    — states that the hold is advisory,
  And while required, the hold is demoted to advisory (the entry removed and the removal
    recorded) when more than one in three red verdicts in the first 14 days, or three red
    verdicts in any later 14 days, are not reproduced at the same commit — that is, a red
    run on main is followed by a green run with the same head commit — and that count is
    reported where the owner reads the notice,
  And the dedicated App reports the hold under the single name `Post-merge suite status`
    on every pull request that targets the main branch, whatever files it changes,
  And the enforcement state is reported as enforced only when the ruleset lists
    `Post-merge suite status` pinned to the dedicated App; the same context pinned to
    GitHub Actions or to any source is reported as advisory, naming the spoofable source
    as the reason,
  And the name, source and every-pull-request clauses are demonstrated by observing a
    check run under exactly that name, created by App 5249547, on the real pull requests
    named above, never by reading the workflow's triggers.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-vi
