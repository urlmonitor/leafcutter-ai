notes: |
  Authored as an L3 because the fallback path is where the original defect will
  reappear. A resolver that prefers the enduring location but falls back to the
  current working directory when it cannot determine one lands back inside the
  disposable workspace in exactly the situation nobody tests — and does so
  silently, which is how ~95% of records were lost without anyone noticing.

  The second scenario guards the opposite error: a fix written only for the
  worktree case must not give plain single-checkout consumer projects a different
  sink, or reports become split across two locations depending on how the drive
  happened to be launched.

  The refusal branch is bounded by INF-500d-3: refusing the write is only
  acceptable because the verdict still lands and the reason is legible.
