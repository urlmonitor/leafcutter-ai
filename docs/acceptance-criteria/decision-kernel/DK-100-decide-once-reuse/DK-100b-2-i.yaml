id: DK-100b-2-i
title: "An option you add at the ranked choice is assessed and ranked before you are asked again"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the ranked-choice question showing 3 ranked options,
  When you add an option of your own instead of choosing,
  Then all 4 options, yours included, are assessed and ranked again,
  And you are asked to choose again from the new ranking,
  And the decision does not resolve on the earlier ranking.
