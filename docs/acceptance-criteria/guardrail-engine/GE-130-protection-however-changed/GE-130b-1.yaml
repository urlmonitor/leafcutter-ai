notes: |
  REUSE: BO-3200f-2-iii's it_requirements own "one declared set of bypass variables, read by every
  enforcement point"; this record adds the path-parity behaviour only and creates no second list.

  DECIDED 2026-09-17 (user): the last clause. On the editing path an override can only come from
  the environment; on the shell path a caller can also type it in front of the command. For a
  caller the override is honoured for, typing it is equivalent to setting it (the caller controls
  both). Not chosen: refusing text-set overrides for everyone, which is closer to GE-129's "no
  typed word opens it" and would narrow today's escape hatches. A caller for whom the override is
  refused (GE-130b-2) gains nothing by typing it.

  declares_side_effect: false.
