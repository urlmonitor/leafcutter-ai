notes: |
  This is the alternative route to coverage honesty for the ONE surface exempted from
  the independent-total rule (see ACS-1100a-3). The exemption exists because
  ACS-100h-7a is approved and forbids a second traversal; nothing here re-opens that.

  Extending the existing callable's return value with an examined count and a declared
  exclusion list is an addition to the single implementation, not a fork of it — the
  child-counting and limit RULE stays exactly where it is. Independence applies to the
  denominator, never to the rule applied per record.

  ACS-100h-7a's delivers_to contract already fixes the violation-set shape; the
  examined/excluded self-report is an additive field on that same return value, which
  the IT PO should express as an amendment to the contract rather than a new callable.

  DEPENDENCY (2026-08-13, expert review). ACS-100h-7a is readiness: approved but
  work_status: todo. The single shared callable this AC extends DOES NOT EXIST YET —
  the child-counting logic is still two copies of check_ac_limits.py (675 and 637
  lines). "Both callers receive the same examined count" is unimplementable against two
  divergent copies, so ACS-100h-7a has been promoted from doc_links into depends_on.
