it_requirements:
  config_schema_fragment:
    type: object
    description: "Durable, cross-process resumable pause state at .leafcutter/paused_runs/<run_id>.json."
    properties:
      persisted: {type: boolean, description: "record survives the workflow process exiting"}
      run_id: {type: string}
      question: {type: object}
      context: {type: object}
      pause_point: {type: object, description: "harness resumeFromRunId marker"}
    required: [persisted, run_id, pause_point]
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "all"
  required_skills:
    - llm-expert
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "SURFACE: implemented in the E2 workflow ENGINE (JavaScript) plus agent-mediated persistence. The record is written/read via an agent() dispatch to .leafcutter/paused_runs/<run_id>.json (the dispatched agent may use a small Python helper), and cross-process resume replays committed agent() calls via the harness resumeFromRunId contract. Not a standalone Python module."
    - "FEASIBILITY (E2 body has no filesystem access per docs/reference/workflow-constraints.md): durability is achieved by the persist agent() dispatch writing to the on-disk store and, on resume, a new process supplying the answer via args (or a resume agent() reading the store); the workflow body itself performs no direct fs I/O and holds no in-memory state across process exit."
    - "The pending-question record, its context snapshot, and the run's pause point must survive the workflow process exiting (durable on-disk .leafcutter/paused_runs/<run_id>.json, not in-memory); a fresh process must be able to load it and resume."
    - "Resume in a new process must use the harness resumeFromRunId replay so committed prior stages are carried forward, not redone."
    - "Durable-store access performed by the dispatched agent (and any Python helper it invokes) is external I/O and must follow the project error-handling policy (typed except, WARNING+ log, no silent swallow)."
    - "E2 bans wall-clock/random in the workflow body (ADR-030): any staleness timestamp must be written into the record at pause (by the persist agent) or passed via args, never computed with Date.now() in the body."
    - "Deployed/template parity via the build.py round-trip (ADR-001)."
    - "TEST STRATEGY: drive the real JS engine via unit_tests/_workflow_engine_harness.py run_workflow_under_e2(plan-feature.js): a first harness run pauses and persists; a SECOND harness invocation (new process) supplies the answer via args and resumes from pause_point via resumeFromRunId, with committed stages carried forward (not re-dispatched in agent_calls). Do NOT test a standalone Python module."
delivers_to:
  agent: llm-expert
  contract: "Durable, cross-process resumability: pending question, context, and pause_point held in .leafcutter/paused_runs/<run_id>.json (written via the persist agent() dispatch) after the workflow process ends; a new process supplying a valid answer via args (or via a resume agent() read) resumes from pause_point via harness resumeFromRunId with committed stages carried forward. Consumed by idempotency (BO-2300e-1-i), no-op-resume (BO-2300e-1-ii), and stale-pause (BO-2300e-1-iii)."
expects_from:
  ac_id: BO-2300a-1
  contract: "The pending-question record and its .leafcutter/paused_runs/<run_id>.json store; this AC guarantees that record (question, context, pause_point) survives process exit and is loadable by a fresh process (via a resume agent() read / resume args) for resume."
test_spec:
  - name: test_pending_state_survives_process_exit
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via run_workflow_under_e2(plan-feature.js), after the first harness run pauses and ends, the pending question, context, and pause point remain in the .leafcutter/paused_runs store."
  - name: test_new_process_resumes_from_pause_point
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via a SECOND run_workflow_under_e2 invocation (new process) supplying a valid answer in args, the run resumes from the pause point (resumeFromRunId)."
  - name: test_committed_stages_carried_forward_across_process
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the two-invocation harness sequence, stages committed before the process ended are carried forward and not re-dispatched (absent from the second run's agent_calls)."
