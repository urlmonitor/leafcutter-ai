title: "Every place that declares what runs is checked against what is really there, and anything nothing runs is named"
component: build-pipeline
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Anything present that nothing invokes is reported by name, never quietly skipped.

  Each surface that declares which scripts the project runs is compared against
  the scripts that are actually present, with both sides read at the moment the
  check runs. Anything present that no declaration accounts for is reported by
  name and fails the run, and the check states how many things it examined so a
  population that silently shrank to nothing cannot look like a clean result.
