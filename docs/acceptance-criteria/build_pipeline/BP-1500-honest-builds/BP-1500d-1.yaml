estimated_complexity: XL
declares_side_effect: true
it_requirements:
  - "THE OUT-OF-PACKAGE HARNESS DOES NOT EXIST AND THIS AC BUILDS IT. BP-900h-1 is an unstarted spec (work_status not_started, zero test hits across the workspace, no consumer-simulation job in ci.yml). Nothing may be reused from it. The harness is in this AC's scope and is the reason its complexity is XL; treating it as pre-existing is how this AC gets estimated at a one-line change and then stalls. Build it to satisfy BP-900h-1's specification so that AC can later adopt it rather than stand up a second one, and parameterise the package-directory name and the deployed output root as inputs rather than constants, because BP-900h-4 and BP-900h-4-i both need to vary them."
  - "THE HARNESS TARGET MUST BE UNDER A SYSTEM TEMP ROOT, AND A PATH BESIDE THE DEVELOPMENT CHECKOUT IS A FALSE GREEN. Measured 2026-08-25: the REAL package_root is <workspace>/leafcutter-ai and the code anchored on package_root.parent, so a scratch target placed at a SIBLING path under <workspace>/ relativized SUCCESSFULLY and produced 154 mappings -- it exercises the passing path and is green on the exact install that shipped broken. A target under the system temp root raised ValueError instead. Use tempfile / tmp_path (verified safe: pytest.ini declares no --basetemp and no conftest overrides tmp_path_factory). THE PRECONDITION IS TWO RULES AGAINST TWO DIFFERENT PACKAGE ROOTS, AND CONFLATING THEM IS ITSELF A FALSE-GREEN VECTOR. CORRECTED 2026-09-07: this requirement previously read 'assert as a fixture precondition that the target's realpath is NOT under package_root.parent' -- one loose rule naming no particular package root, which taken against the scratch copy forbids the only layout that proves anything. State EQUALITY where equality is meant, and name the root each rule is evaluated against. (1) AGAINST THE REAL PRODUCING PACKAGE -- the development checkout this suite is running from: the target's realpath must be neither EQUAL TO nor a DESCENDANT OF that package root's parent directory. 'Not under', in the equal-or-descendant sense, is CORRECT here and is exactly what the 2026-08-25 measurement above establishes; a target reachable through the development workspace is not an arbitrary consumer install. (2) AGAINST THE SCRATCH PACKAGE COPY the build is actually invoked from (<scratch>/leafcutter-ai): the forbidden case is EQUALITY ALONE -- target == <scratch>, which is target == the scratch package copy's parent, the self-host layout ADR-001 identifies as the one place this whole family of defect looks correct. DESCENDANT-OF IS REQUIRED HERE, NOT FORBIDDEN: the correct layout puts the receiving project at <scratch>/receiving_project as a SIBLING of the package copy (neither nested in the other), so the target IS a descendant of the scratch package copy's parent, by construction, in every correct run. Applying rule (1)'s 'not under' form to the scratch root rejects every correct fixture; applying rule (2)'s equality-only form to the real root admits a target sitting beside the development checkout. Both assertions are load-bearing rather than defensive, and each must name the root it is evaluated against -- an implementation that satisfies the letter of one rule against the other root satisfies neither's intent. LIVE RE-MEASUREMENT 2026-09-07, reported alongside this correction: a real out-of-package build now writes 471 output mappings and 174 template entries into the receiving project with a truthful relative package_root, and the drift gate reads verified=174 where it previously read BLOCKED verified=0. Rule (1) therefore now rests on live evidence as well as the archived measurement, and the archived 2026-08-25 numbers above are KEPT, dated, as the evidence for WHY the rule exists rather than as a description of current behaviour. Note what the live numbers change about the risk: the temp-root venue is now a working, verifiable install, so a fixture misplaced beside the development checkout can no longer be told apart from a correct one by its outcome -- it must be excluded by this precondition, which is the only thing left that distinguishes them. ONE DISCREPANCY, RESOLVED 2026-09-07 AND RECORDED WITH ITS REAL CAUSE: BP-1500d-3 records 472 mappings and 175 template entries where this requirement records 471 and 174. THE FIRST EXPLANATION OFFERED HERE WAS WRONG, AND IS RECORDED AS WRONG BECAUSE IT WAS PLAUSIBLE: it read 'the two counts were taken under different fixture states', the guess being that the harness's own config file was counted in one run and not the other. It was not. Measured against the current tree into a fresh temp target holding NO config file at all: 472 output mappings, 175 template entries, package_root '../../<workspace>/worktrees/followups' -- which is -3's pair exactly, from a target with no config in it. THE ACTUAL CAUSE IS DULLER AND WORSE FOR ANYONE QUOTING A NUMBER: main gained one template and one output BETWEEN the two measurements. 471/174 was taken in the bp-1500d-1 worktree and 472/175 in a later tree, with several PRs merging on that single day. Both counts were accurate when taken. NEITHER IS A GENERAL FACT, and a third measurement an hour later may differ again. THE CONCLUSION IS UNCHANGED AND THE CORRECTED CAUSE SUPPORTS IT BETTER THAN THE GUESS DID: do not copy either count into an assertion. Assert a non-vacuity floor -- the record is non-empty and every entry resolves inside the receiving project -- and re-measure locally if an exact number is ever genuinely needed. A test asserting 471, or 472, is a hostage to the week it was written. WHAT THIS IS AN INSTANCE OF, STATED PLAINLY BECAUSE IT IS THE FOURTH ON ONE DAY: a figure that was TRUE WHEN MEASURED AND FALSE WHEN READ. The other three on 2026-09-07 were the '20 composites' sweep figure in CLAUDE.md carried forward from a six-week-old count; a '549 of 856' ratio shipped by pairing a freshly re-measured numerator with an inherited denominator; and two concurrent branches recounting the known-issues index to 224 and to 237 when the truth at merge was 239. Same failure, four surfaces, one day. Treat EVERY count in this record as dated evidence for a claim and never as a value to assert on -- including the 2026-08-25 archive above, and including this paragraph's own numbers."
  - "The harness layout is a COPY of the package at <scratch>/leafcutter-ai/ with the TARGET itself empty apart from a minimal config at <target>/.claude/skills_config.json. Note that BP-900h-1's own constraint text ('built from an empty directory, NOT from a copy of this repository') reads ambiguously -- it constrains the TARGET, not the package, which must be present as a copy for the build to run at all. Do not silently pick a reading; record which one the harness implements. CONFIG LOCATION NAMED 2026-09-07, AND IT IS LOAD-BEARING RATHER THAN INCIDENTAL. This requirement previously read 'a minimal skills_config.json' with no path at all, and that silence is what licensed a fixture that configures nothing. The build auto-detects its config ONLY at <target>/<platform_dir>/skills_config.json, iterating .claude, .gemini, .cursor, .github, .cline -- verified at source 2026-09-07, scripts/config_loader.py -- with NO top-level fallback. A config written to <target>/skills_config.json is therefore INERT, and a build run against it uses built-in defaults throughout. WHY AN INERT CONFIG WENT UNNOTICED, WHICH IS THE PART WORTH CARRYING FORWARD: the minimal config sets output_root to the value the build already defaults to (.leafcutter), so a config that was never read and a config that was read produce identical builds. There is no error, no warning, and nothing in the result that differs -- a fixture that configures nothing is indistinguishable from a correctly configured one for exactly as long as the configured value matches the default. THE CONSEQUENCE IS NOT COSMETIC: it_requirements #1 requires the deployed output root to be a PARAMETER of the harness so BP-900h-4 and BP-900h-4-i can vary it, and a caller who varies it through a top-level config is silently ignored -- the harness reports the caller's value while the build uses the default, which is a false green in the harness itself rather than in the code under test. WRITE THE CONFIG TO <target>/.claude/skills_config.json AND PROVE IT WAS READ, not merely written: set at least one value that DIFFERS from the shipped default and assert the build's own output reflects that value. An assertion that the file exists proves nothing this defect does not also satisfy."
  - "The record must be written into the project the build was aimed at -- the build's declared target root. A record written anywhere else does not satisfy this AC, whatever else it contains."
  - "The record must account for the receiving install: for an out-of-package target it must be non-empty. Measured 2026-08-25: the same build that yields 154 mappings for an in-parent target yields output_mappings {} for a temp-root target, and still exits 0. An install whose record names zero artifacts is portable, readable and useless while satisfying every other clause here, so this is the constraint most likely to be closed accidentally. GLOSS TIGHTENED 2026-09-07 -- NON-EMPTINESS IS A FLOOR, NOT THE MEASURE OF 'ACCOUNTS FOR', AND THIS SENTENCE IS NOT A LICENCE FOR AN EXISTENCE-ONLY PROOF. As written it pinned the criterion's 'accounts for the receiving install' clause to a property of QUANTITY (the entry set is non-empty) when the clause is also about LOCATION (each entry names something in THAT project). The two come apart, and the way they come apart is not hypothetical: joining an entry key onto the receiving project's root and asserting the result is_file() answers True for a key that steps back out of the project with a relative parent segment, because the joined path resolves to a real file outside the project whenever the intermediate directories exist -- verified out of process 2026-09-07. So an implementation may satisfy every word of the original sentence with a record whose entries do not describe the receiving install at all. WHAT THIS AC OWES AND WHAT IT DOES NOT: non-emptiness plus per-entry resolution inside the receiving project is the floor this requirement sets on any proof written for it, and a check whose only discriminating power is 'a file exists at the joined path' does not meet it. Whether an entry POINTS OUTSIDE the project it was written into is the subject of BP-1500d-1-ii, authored 2026-09-07, and must NOT be re-specified or re-asserted here; the correction above repairs this requirement's own misleading gloss and adds no behaviour to this AC."
  - "Every path derivation on the record-writing path must be anchored to a root that exists for an arbitrary consumer install. Anchoring to the producing package's parent directory is the defect itself; keeping that anchor and adding a fallback for the case that currently raises is not a fix, because the fallback inherits the same unrepresentative assumption."
  - "The build must not write, modify or delete the producing package's own record when it is aimed at a different project. This is BP-1500a's guarantee and is a hard constraint on this AC's implementation, not a behaviour this AC asserts. The record is gitignored, so a regression here shows in no git status and must be asserted directly."
  - "CALL-SITE AUDIT IS MANDATORY, AND BOTH READERS ARE IN IT. check_build_drift.py and check_output_drift.py each resolve the record from a list of plausible roots derived from the PACKAGE. Relocating the write target without updating both moves the fail-open from consumer installs into this repo. Name every reader in sign-off and state, for each, where it now looks."
  - "Must be idempotent: two consecutive builds into the same unchanged project produce a byte-identical record. Verify by running the build twice and diffing, not by reasoning about the writer."
  - "Must not regress the build's existing time budget. The record is written on every build, so any added cost must scale with the number of deployed artifacts and with nothing else."
  - "Must handle a missing or unwritable target directory per the project error handling policy. Note that the current handler at build_helpers.py ~201-213 catches broadly and downgrades a real failure to a warning; this AC must not add a second instance of that shape. What the build's exit status must become is BP-1500d-3's subject and must not be re-specified here."
delivers_to:
  - agent: python-coder
    ac_id: BP-1500d-2
    contract: "TWO things, because the second does not yet exist. (1) The out-of-package consumer-simulation harness: a scratch project under a system temp root at <scratch>/receiving_project, holding only a minimal config at <scratch>/receiving_project/.claude/skills_config.json, SIBLING to a copy of the package at <scratch>/leafcutter-ai/ with neither nested in the other, built via the real build command line as 'python <scratch>/leafcutter-ai/scripts/build.py --target-dir <scratch>/receiving_project'. PLACEMENT RULE, CORRECTED 2026-09-07 -- it previously read 'whose realpath is asserted NOT to be under package_root.parent', which names no particular package root and, read against the scratch copy, forbids the sibling layout it exists to require: the target's realpath must be neither EQUAL TO nor a DESCENDANT OF the REAL producing package's parent directory, and must not be EQUAL TO the SCRATCH package copy's parent (<scratch>). Against the scratch copy the forbidden case is EQUALITY ALONE; descendant-of is required, because the sibling target is a descendant of <scratch> in every correct run. Consume the rule in that two-rooted form -- see it_requirements #2 -- and do not re-derive it from the single loose sentence this contract used to carry. (2) A record file written into that project's own root carrying a non-empty set of entries naming artifacts present under it. BP-1500d-2 relocates that record and reads it at the new location; it neither produces the record nor builds a second harness. CONFIG PATH NAMED 2026-09-07: this contract previously said only 'holding only a minimal skills_config.json', with no path. The build auto-detects its config ONLY under a platform directory (.claude, .gemini, .cursor, .github, .cline) beneath the target and has NO top-level fallback (verified at source, scripts/config_loader.py), so a config at <target>/skills_config.json is inert and -- because the minimal config's value matches the build's own default -- produces a build byte-identical to a correctly configured one. BP-1500d-2 must consume the harness with the config at <target>/.claude/skills_config.json and must not infer from a passing build that the fixture's config was read; see it_requirements #3."
  - agent: python-coder
    ac_id: BP-1500d-3
    contract: "The same harness, plus the ability to place it in a state where the record CAN be produced. BP-1500d-3's paired success run needs exactly that state to prove its failure verdict is attributable to the unproducible record rather than to a build that refuses every out-of-package target."
  - agent: python-coder
    ac_id: BP-1500d-4
    contract: "The same harness and record artifact, serving as BP-1500d-4's all-clear baseline. BP-1500d-4 deletes and substitutes the record against this fixture to drive its three-run attribution control."
  - agent: documentation-expert
    ac_id: BP-1500d-5
    contract: "The concrete on-disk location of the receiving project's record, expressed relative to that project's own root, and the shape of its entries -- plus the harness itself, which is the real out-of-package install BP-1500d-5's reference must be followed against."
expects_from:
  - ac_id: BP-900h-1
    contract: "NOT SATISFIED, AND DELIBERATELY NOT A depends_on. BP-900h-1 specifies the empty-project consumer-simulation install but is work_status not_started with zero implementation anywhere in the workspace, so there is nothing to receive. This AC therefore CONSTRUCTS that harness rather than consuming it (see it_requirements) and delivers it onward to -2, -3, -4 and -5. The edge is recorded here as an unmet specification to conform to, not as a satisfied dependency; adding it to depends_on would block the whole BP-1500d family behind an unrelated epic for a fixture this AC has to write anyway."
  - ac_id: BP-1500d-3
    contract: "A build whose process exit status is unsuccessful whenever the record cannot be produced. Without it, 'the receiving project holds no record' and 'the build succeeded' remain simultaneously observable, and this AC's positive fixture cannot treat a green build as evidence the record exists. Recorded as a contract rather than a depends_on so the two can be built in either order; if -1 lands first its fixture must assert the record's presence directly rather than inferring it from exit 0."
test_spec:
  - name: test_bp_1500d_1_out_of_package_harness_target_is_not_under_the_package_parent
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: deployed
    description: "THE FIXTURE PRECONDITION, asserted as a test because the harness is new and an incorrectly placed one is silently green. Stand up the harness and assert three properties of the layout itself: the scratch target's realpath is NOT under package_root.parent, a copy of the package exists at <scratch>/leafcutter-ai/, and the target contains nothing but a minimal skills_config.json. Measured 2026-08-25: a target at a sibling path under the workspace parent relativizes successfully and yields 154 mappings, so a harness placed there exercises the passing path. Pair the assertion with its control -- run the same relativization against a deliberately sibling-placed target and assert it succeeds -- so the test proves the placement rule discriminates rather than merely holding."
  - name: test_bp_1500d_1_real_build_writes_the_record_into_the_out_of_package_receiving_project
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Build into the harness target and assert a record file exists at that project's own root. Assert the negative half in the same test: the producing package's own record is byte-unchanged by this build (hash it before and after), because today's write target makes a consumer build clobber it. A test that only asserts presence in the target is green on an implementation that writes to both. Expected RED at authoring time -- build_helpers.py:185 writes to package_root unconditionally."
  - name: test_bp_1500d_1_the_record_is_produced_through_the_real_build_command_line_not_an_imported_helper
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "python <scratch>/leafcutter-ai/scripts/build.py --target-dir <scratch>/receiving_project"
    description: "PRODUCTION ENTRY POINT, and the entry that cannot be replaced by a cheaper test. write_build_manifest ALREADY accepts a target_root parameter, so a direct-import unit test that passes it the scratch path passes today against the unfixed build -- the defect is that build.py never routes the target to the manifest path. Invoke the build as a SUBPROCESS through the command line a consumer runs, with a working directory that is not the package tree and an interpreter search path containing no path under the package checkout, and assert that property of the child process rather than assuming it. Then assert the record appears in the target. LAYOUT CORRECTED 2026-09-07: this entry's surface_invoked read '--target-dir <scratch>' alongside a package copy at '<scratch>/leafcutter-ai/', which makes the target EQUAL to the scratch package copy's parent -- the self-host layout ADR-001 identifies as hiding this whole family of defect, not the out-of-package venue this L1 mandates, and a direct contradiction of this record's own it_requirements #2. It now reads the sibling form the other entries and the built harness use: package copy at <scratch>/leafcutter-ai/, target at <scratch>/receiving_project, neither nested in the other. Same defect BP-1500d-3's it-po corrected across all four of its own entries on the same date."
  - name: test_bp_1500d_1_record_entries_name_artifacts_actually_present_in_the_receiving_project
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: real_artifact
    description: "Parse the record the real build serialized -- the actual bytes on disk, in a cold process, never a hand-authored fixture -- and assert TWO non-vacuity properties, because a for-each over an empty record is green on a broken install: the entry set is non-empty, and every entry resolves to a file that exists under the receiving project. Then assert the converse on a representative sample of the deployed tree, so a record naming one artifact out of hundreds cannot pass. Measured 2026-08-25: this build emits output_mappings {} for a temp-root target while exiting 0, so this entry is expected RED at authoring time; if it is green before any implementation lands, the harness target is not actually out-of-package."
  - name: test_bp_1500d_1_a_copy_of_the_project_taken_without_the_producing_package_still_carries_the_record
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "The (b)-travels-with-it half. Copy the built scratch project ALONE to a second location under the temp root, leaving the package copy behind entirely, and assert the record is present in the copy and byte-identical to the original. This asserts only that the record ARRIVES; whether its entries still RESOLVE at the new location is BP-1500d-2's subject and must not be re-asserted here."
  - name: test_bp_1500d_1_inspection_goes_red_on_a_record_filed_with_the_package_and_on_a_record_that_accounts_for_nothing_then_green_again
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: failure
    description: "THE NEGATIVE CONTROL THE CRITERION DEMANDS, and the load-bearing entry of this contract. Five runs of the SAME inspection against the SAME harness: (1) good install, clean; (2) move the record out of the receiving project into the package copy -- assert red, naming the project that has no record; (3) restore, clean again; (4) replace the receiving project's record with one that is well-formed and accounts for nothing -- assert red, naming the empty record rather than reporting a clean install; (5) restore, clean again. Runs 3 and 5 are what make each red attributable to its own breakage rather than to a fixture that was already broken. Without breakage 4 this AC can be closed by writing an empty record into the receiving project, which is worse than today because it also silences both readers while looking correct."
test_rationale: |
  The layout under test is the whole subject of this AC, and the harness that
  establishes it does not exist -- BP-900h-1 specifies it and has never been built.
  That makes the fixture the largest and riskiest part of this contract, which is why
  entry 1 asserts the layout itself before any entry asserts behaviour.

  The placement rule is not a detail. Measured on 2026-08-25: with package_root at
  <workspace>/leafcutter-ai, a scratch target at a SIBLING path under <workspace>/
