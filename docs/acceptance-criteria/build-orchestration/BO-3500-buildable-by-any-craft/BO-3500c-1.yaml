estimated_complexity: L
it_requirements:
  - "WHERE THE RECEIPT IS STORED (the open question this record left the IT PO). It is a `receipt` sub-object on the per-deliverable sign-off slot ACD-1800b-1a defines: `deliverables[].signoff.receipt`, on the AC record itself. Never in a grouping ticket body, never in a side file, never in run telemetry only — a proof written somewhere the store does not read is a record nothing counts. Declare it additive and OPTIONAL in config/ac_store_schema.json and do not tighten additionalProperties pre-backfill (ADR-026 rule 1)."
  - "SLOT INDEPENDENCE MUST SURVIVE (ACD-1800b-1a's second it_requirement). Writing one deliverable's receipt must not mutate, clear or re-order any sibling slot."
  - "RECEIPT SHAPE, DISCRIMINATING BY CLASS. Common to every receipt: {instrument, invocation, outcome, at}. A COMPARING-class proof adds {condition_a, condition_b, difference} — all three required, `difference` non-empty, and condition_a != condition_b. A READING-class proof carries NONE of those three. There is NO `class` field on the receipt: the class is derived (BO-3500c-2) and the shape is validated against the derived class, so a reader tells the class from the shape and an author cannot choose it."
  - "TWO WRITE-TIME REJECTIONS, AND THEY NEED NO RUN AT ALL. (a) A comparing-class receipt whose two conditions are equal, or whose `difference` is empty, is rejected at the moment of writing. (b) A reading-class receipt carrying any of condition_a / condition_b / difference is rejected at the moment of writing. Both are pure shape checks over a candidate record — implement and TEST them as such. They are the cheapest real tests in this tree and must not be specified as end-to-end runs."
  - "ENFORCE AT EVERY GATE THAT ACTUALLY RUNS, AND KNOW WHICH IS LOAD-BEARING: config/ac_store_schema.json (the JSON-schema path), templates/scripts/commit_guardian/_ac_schema_validators.py (the manual-validation fallback — the authoritative branch when jsonschema is absent), templates/scripts/commit_guardian/check_ac_schema.py, and the agent-side scripts/ac_store/validate_ac_schema.py. A rule added only to the JSON schema is a partial/no-op gate; the receipt tests must assert the rejection through the fallback as well."
  - "THE CLASS CHECKED AGAINST IS THE DERIVED ONE (user decision D4), resolved by BO-3500c-2's registry table from the deliverable's path — never a value read off the record. If a record carries a proof-class field, report it as a defective declaration in the BO-3500a-2 reason-code family; do not honour it, and do not silently ignore it either."
  - "THE LAST SCENARIO NEEDS ITS OWN TEST WITH THE PROOF FORCED TO FAIL. An implementation that establishes proofs correctly and then marks the member finished regardless satisfies every other assertion on this record. The reason given must name the member and the proof that failed — never 'missing test', which sends the reader looking for a test that was never supposed to exist (the KI-BO-013 vocabulary cost)."
  - "'No test to point at' must not be reachable as a reason to finish the member, to drop it from the group, to stop producing it, or to pass over it silently. Those are three different doors and all three are open today."
  - "DEPLOY MANIFEST: any new module the receipt validator adds and a hook imports MUST be added to AC_STORE_DEPLOY_MAP in scripts/build_phases.py, or the deployed check_ac_schema hook raises ModuleNotFoundError and — once required — blocks every merge. Verify by running the DEPLOYED hook; the unit tests import from the source tree and mask the gap."
  - "NO PRESENCE-ONLY ASSERTIONS (check_presence_only_assertions.py is a live ratchet). The rejection tests execute the validator; the run-level tests execute a run and read the real store on disk afterwards."
delivers_to:
  agent: python-coder
  contract: "deliverables[].signoff.receipt on the AC record: {instrument: str, invocation: str, outcome: str, at: 'YYYY-MM-DD HH:MM'}, plus — for a COMPARING-class proof only — {condition_a: str, condition_b: str, difference: str}, with difference non-empty and condition_a != condition_b. A READING-class receipt carries none of those three. No class field. Consumed by BO-3500c-3's hollow-artifact guard (a degenerate comparison IS a hollow artifact), by the done gate, and by any later audit that must tell what was checked without re-running it."
expects_from:
  ac_id: ACD-1800b-1a
  contract: "deliverables[].signoff = {status: needed|signed_off|not_applicable, by, at, reason?} — independent per-deliverable slots stored on the AC record itself, onto which `receipt` attaches as an additive sub-object. Slot independence is a property this record must preserve, not re-derive."
test_spec:
  - name: test_comparing_receipt_with_identical_conditions_is_rejected_at_write
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: failure
    description: "NO RUN. Hand the validator a candidate record whose comparing-class receipt has condition_a == condition_b; assert the write is refused and the reason states that a comparison recording no difference is not a comparison."
  - name: test_comparing_receipt_with_empty_difference_is_rejected_at_write
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: failure
    description: "NO RUN. A comparing-class receipt whose `difference` is empty or absent is refused at write time."
  - name: test_reading_receipt_carrying_a_second_condition_is_rejected_at_write
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: failure
    description: "NO RUN. A reading-class receipt carrying condition_a, condition_b or difference is refused at write time."
  - name: test_receipt_rejections_fire_in_the_manual_validation_fallback
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: deployed
    description: "Run the same three degenerate receipts through _ac_schema_validators.py with jsonschema unavailable, and assert each is refused — the JSON-schema path alone is not the gate that runs."
  - name: test_receipt_class_checked_is_the_derived_one_not_a_declared_one
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: seam
    description: "A record whose deliverable path derives to the comparing class but which declares itself reading-class is validated against the comparing shape, and the declaration is reported as a defect."
  - name: test_member_not_marked_done_when_its_proof_fails
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "Run with the proof forced to fail; assert the member is not done on disk. An implementation that derives proofs correctly and marks done regardless passes every other test here and fails only this one."
  - name: test_run_does_not_report_success_when_a_proof_fails
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "The run's terminal outcome is failure and the reason names the member and the proof — not a missing test."
  - name: test_finished_non_code_member_carries_a_receipt_readable_after_the_run
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "After a successful run, read the member's YAML from disk and assert the receipt carries instrument, invocation, outcome and at, with the class-appropriate condition fields."
  - name: test_receipt_write_leaves_sibling_slots_untouched
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: seam
    description: "Write a receipt onto one deliverable slot and assert the sibling slots are byte-identical, still present and still unsigned."
  - name: test_absent_test_is_not_a_reason_to_finish_or_to_drop_the_member
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "For a member with no possible passing test, assert it is neither marked done without a proof nor removed from the resolved group — the two distinct doors of the first scenario, closed in one test."
