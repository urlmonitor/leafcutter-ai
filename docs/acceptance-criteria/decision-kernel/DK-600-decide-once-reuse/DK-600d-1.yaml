id: DK-600d-1
title: "Publishing starts only when you ask for it"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Scenario: Nothing reaches docs/decisions/ until a person runs publish
    Given run run-f0f15b38791a428f completed with the decision record dec-d53e1c52cd47c832 staged
      and reported the command python -m kernel decisions publish --run-id run-f0f15b38791a428f,
    When no person has run that command yet,
    Then no file under docs/decisions/ has been created or changed, and docs/decisions/index.json
      has no entry for dec-d53e1c52cd47c832,
    And once a person runs that command, docs/decisions/dec-d53e1c52cd47c832.yaml is written.

  Scenario: The kernel skill shows the publish command and never runs it
    Given the kernel skill as installed for Claude Code (/leafcutter) and for Codex ($leafcutter),
    When a run the skill drives ends with the limitation "decision record staged: <path>; publish
      with: python -m kernel decisions publish --run-id run-f0f15b38791a428f",
    Then the skill's instructions direct it to tell the user the record is ready, show that
      command, and not run it,
    And the skill's instructions name decisions publish as a command for the user to run, never
      for the skill,
    And neither skill pre-approves decisions publish: the only kernel commands either skill
      pre-approves are run, resume and status.
