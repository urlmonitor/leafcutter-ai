notes: |
  Satisfies the component-diagram entry in GE-119c's documentation_triggers. The PO's reason,
  preserved: the trigger is for the new verification surface itself, which is a new
  architectural piece and not a change to an existing one.

  The in-process-versus-out-of-process clause is the point of the diagram. The reason this
  defect class survived is that a reasonable engineer looked at a directory full of passing
  tests for these checks and concluded they were covered. A diagram that shows the two test
  paths side by side, and marks which one is blind to layout, is what stops the next engineer
  reaching the same conclusion.

  Sequence after GE-119c-1 is built. Drawing the harness before it exists produces a diagram
  of the author's intention, which then has to be corrected — and in practice is not.
