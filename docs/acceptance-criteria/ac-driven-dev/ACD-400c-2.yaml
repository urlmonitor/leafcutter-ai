it_requirements:
  - "Every pytest invocation used to run or verify this test must set AC_ENFORCE_STRICT=1, or a red result is masked as an xfail and reads green."
  - "The verdict must be obtained by executing the scanner over a temporary store through its real command surface; no assertion about the source text of scan_ac_store.py satisfies this AC."
  - "The absent-field fixture must omit the approval key entirely from the written record. A record written with an empty string, a null, or the key present-but-blank tests a different input than the one the criteria name, and the population of ~30% of the real store this AC speaks for is the key-absent shape."
  - "The same-answer clause must be tested by building two stores that differ in exactly one field and comparing the two full answers, not by asserting each store's answer against a separately-written expectation. Comparing the answers is what forbids a future implementation that gives the absent case a tier of its own."
  - "This AC authorises no change to the default. The inconsistency it records against ACD-400d-3 — absent approval is treated harshly, absent urgency generously — was RULED ON by BrainCandy 2026-09-08: KEEP BOTH DEFAULTS AS THEY SHIP. The asymmetry is accepted deliberately, not tolerated pending a decision. The implementation must still not resolve it in either direction, and the reason is now stronger rather than weaker: changing either default would contradict a ruling instead of pre-empting an open question. This AC and ACD-400d-3 are the paired written account of that accepted asymmetry."
test_spec:
  - name: test_a_record_with_no_recorded_approval_is_withheld
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --ac-root <tmp> --json"
    description: "Two identical ready leaves, one recorded approved and one with the approval key absent from the file: only the approved id is offered, and the key-absent id appears in neither returned list."
  - name: test_absent_approval_and_draft_approval_yield_the_identical_answer
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --ac-root <tmp> --json"
    description: "Two stores differing only in whether the record omits the approval field or records it as draft produce byte-identical scanner answers — pinning absent as rejected rather than as a distinct third state."
  - name: test_writing_an_approved_value_onto_the_bare_record_admits_it
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --ac-root <tmp> --json"
    description: "Adding an approved approval to the previously field-less record, changing nothing else, puts that id into the offer on the next ask."
test_rationale: "A test that only asserts the key-absent record is withheld passes on any implementation that withholds it for any reason. Comparing two whole answers across a one-field difference is the cheapest construction that pins the specific verdict and kills the family of near-misses that give the absent case its own tier."
