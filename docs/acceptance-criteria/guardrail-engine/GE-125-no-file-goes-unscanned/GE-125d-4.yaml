estimated_complexity: M
it_requirements:
  - "MEASURED ON 2026-08-24, and it sizes the work: templates/scripts/commit_guardian/check_secrets.py has NO command-line surface at all. main() takes no arguments, there is no argparse and no sys.argv handling, and the pre-commit framework invokes it with the staged set discovered from `git diff --cached`. Asking the check what it declines to examine therefore requires ADDING a query surface. Adding one must not change the behaviour of the existing zero-argument invocation path, which must keep discovering the staged set and returning the same integer exit code it returns now."
  - "The answer must be DERIVED from the same data the reduction consults, never from a hand-written list maintained beside it. GE-125d-4-i makes drift unreachable in both directions and is the constraint child of this requirement; satisfying this AC with a printed paragraph that happens to be accurate on the day it is written fails that child by construction."
  - "Each entry must name three things, and the third is not decoration: the detection rule removed, the condition under which it is removed, and WHICH DETECTION RULES STILL APPLY where the reduction applies. Measured today the reduction gates ENTROPY_HIGH only — AWS_KEY, PRIVATE_KEY, EXCHANGE_API_KEY and GENERIC_SECRET still fire in reduced locations — so the surviving-rules field is what tells a reader exactly how much protection is left, and an answer omitting it overstates the gap."
  - "The answer must describe what the check DOES, not what it was meant to do. Measured today the location test is a substring test against the whole path — `(\"/\" + prefix) in path_str` — so the four intended directory prefixes behave as four directory NAMES matching at any depth in any subtree. An answer stating 'four prose directories' describes the intent and the second arm must correctly fail it. If GE-125a lands first and anchors the match at the repository root, the answer must then describe the anchored behaviour — the requirement is fidelity to the behaviour in force, not fidelity to today's specific wording."
  - "Asking the question must be free of side effects: no change to any exit status, no commit blocked, no file written, no scan performed. It is a question a person asks, not a gate a person trips."
  - "The answer must contain no credential-shaped value, no matched line and no content from any file. It describes policy rather than reporting findings, which is exactly what makes it safe to print anywhere — and that property must not be eroded by adding an illustrative example drawn from real content."
  - "The agreement arm must EXECUTE both halves. Obtain the answer, classify the two paths using only the conditions it states, then actually check each path on the path a real commit takes with an opaque credential-shaped value in it, and compare. Reading the source to confirm the answer and the decision agree reproduces the exact verification method this whole goal exists to replace — the original exemption was perfectly visible to anyone reading the source, and that was not enough."
  - "Keep the path pair a pair that genuinely differs at the time the test runs. src/vendor/tickets/handler.py (measured exempt, never intended) and src/app.py (measured reported) are today's pair; if GE-125a anchors the match the first stops being exempt, in which case choose another pair that still differs. The arm asserts AGREEMENT, not a fixed verdict, and MUST NOT be weakened to a single path — any answer classifies a single path correctly half the time by accident."
  - "The query surface must work in the DEPLOYED layout, not only in the source tree. Per CLAUDE.md, any module the hook imports must be present in the build deploy manifest, or the deployed hook raises ModuleNotFoundError at commit time — and this hook is a required gate, so that crash blocks every commit. Run `python scripts/build.py --target-dir .` and exercise the deployed copy before trusting the tests, which import from the source tree and mask the gap."
  - "ADR-001 parity: edit the canonical copy under templates/ and verify through the build round trip. check_hook_parity enforces all four locations; a deployed-copy-only change is reverted by the next build."
  - "CLAUDE.md error-handling policy applies. Producing the answer is pure derivation over the reduction's own data and must NOT be wrapped in try/except (Rule 4); only the I/O that renders it is wrapped, with a typed except that logs at WARNING or higher and never silently swallows."
