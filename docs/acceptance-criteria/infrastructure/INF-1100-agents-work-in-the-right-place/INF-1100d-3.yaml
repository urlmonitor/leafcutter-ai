  INF-1100d-3-ii covers a DB test run without the setting ending in an error that names it,
  through the one shared resolver. INF-1100d-4 proves no shipped template carries an address
  it could point at. The remaining substitute is a recommended test-writer/test-runner eval
  over W1/W2 (follow-up AC) plus pr-reviewer against the Then clauses.'
