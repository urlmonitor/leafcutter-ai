notes: |
  This is the fail-safe direction clause. Narrowing the reader without this
  criterion converts a false-positive problem into a false-negative one, which is
  strictly worse: a typo'd tag would silently stop being anybody's problem while
  the test it sits on quietly detaches from its acceptance criterion. Position is
  load-bearing here — a shape-invalid capture in tag position is a malformed tag
  (reported), whereas the same shape-invalid capture inside prose or a string
  literal is not a tag at all (not reported, per TQ-100b-4).

  TEST ANGLE: the malformed tag must be planted in a real file inside the tree the
  reader actually walks and the reader invoked over that tree; asserting against
  a hand-constructed input string to the pattern proves nothing. The removal run
  is the negative control and must go through the same entry point.
