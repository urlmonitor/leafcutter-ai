change_target: code
risk_surface: contract_boundary
notes: 'RQ8; ITPO-04, ITPO-05, QA-05; RQE-06. Reuse existing publication and failure semantics; no new runtime-event
  store or universal automated root-cause inference. Draft authored from the user-requested BA template pass; no
  real provider, database or tracing call was performed. PO review refinement: QA-05 scope-mismatch diagnosis requires
  attributable expected/observed values, contract citation and a bounded justified rerun, not an unproved smallest
  rerun.'
it_requirements:
- Preserve immutable source provenance, bounded registered read-only queries and existing authorization, budgets
  and retries. No arbitrary Cypher, new network endpoint, source-write permission, independent telemetry store or
  automatic activation is added.
- Join diagnostics only by matching request/attempt and source/generation. Keep current workspace, requested/published
  source and historically tested revision as separate optional values.
- Record evidenced failure class, supporting diagnostics, known expected/observed repository/revision/query/permission
  scope and governing contract locator. Missing comparison values stay unknown and cannot come from another attempt.
- Distinguish required-field/projection/disclosure gaps, retrieval outages and zero matches. Credentials/network/provider/transformation
  causes need matching specific diagnostics; absent or conflicting diagnostics produce unresolved/unknown cause.
- Next actions identify a bounded case and why it addresses the limitation. No proven-minimality claim, automatic
  publication/rollback, expanded permission or new data transfer follows from diagnosis.
- RQE-06-P/N source-oracle expectations judge actual responses but cannot supply diagnostic evidence missing from
  those responses.
test_required: true
test_rationale: Planned criterion and public-interface proof covers real producer/consumer and serialized boundaries
  with named wrong outcomes. Offline/scripted checks cannot establish real-provider, remote-ingestion or deployment
  readiness; unavailable live prerequisites remain not_run.
test_spec:
- name: test_public_diagnosis_distinguishes_field_gap_and_retrieval_failure
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Exercise RQE-06-P/N through public research using actual envelopes; assert evidenced missing work_status
    in one and retrieval unavailable/unknown cause in the other, never zero ACs.
  must_catch:
  - Treating failed retrieval as no records or inventing a specific outage cause.
  covers:
  - KM-500g-2
  requires_db: false
  surface_invoked: Existing kernel research run/resume entry point using retrieve.repository
- name: test_scope_diagnosis_cites_expected_observed_values_and_contract
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Supply attributable scope mismatch diagnostics; assert known expected/observed repository/revision/query/permission
    values, governing contract and justified bounded rerun, retaining unknown comparison values.
  must_catch:
  - Reconstructing absent values from another run or claiming an unproved smallest rerun.
  covers:
  - KM-500g-2
  requires_db: false
- name: test_diagnosis_rejects_cross_attempt_and_cross_revision_evidence
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: seam
  description: Pass current, historical and conflicting diagnostics through the real correlation/diagnosis boundary;
    assert only matching evidence supports causes and workspace/publication/tested SHAs remain distinct.
  must_catch:
  - Mixing historical success and current workspace into a fabricated current cause.
  covers:
  - KM-500g-2
  requires_db: false
- name: test_diagnosis_uses_no_oracle_backfill_or_implicit_permission
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: Provide a golden source answer beside unavailable tool output and a missing-provider diagnostic;
    assert no oracle value becomes actual evidence and next steps retain original permissions.
  must_catch:
  - Filling a failed response from the oracle or using diagnosis as provider authorization.
  covers:
  - KM-500g-2
  requires_db: false
