test_rationale: The verified catalog supplies exact existing reader-function anchors, including source-fixture,
  boundary and failure checks. Only catalog-confirmed type-specific integration links are added. Shared lossless
  property encoding, physical Neo4j publication, readback and retained-generation behavior remain covered by KM-400a-3-i;
  these focused tests do not claim 17 independent live database journeys. This is retrospective traceability over
  dated implementation receipts, not a newly performed TDD sequence. Subsequent strict execution is separately recorded
  in reports/native-fields/ac-linked-strict.xml (388 passed, one skipped); no database test was rerun for these
  annotation-only changes.
