criteria: |
  Given the project's reference material currently describes this check's
    reduced scrutiny as applying to four prose directories, and says nothing
    about what an author is told when it applies,
  When the reference material is next published,
  Then exactly one section of it describes reduced scrutiny for this check, and
    that section states, for every reduction: which detection rule is removed,
    where the reduction applies, which detection rules still apply there, and
    what the author is told when it withholds something,
  And no other document in the project describes the same behaviour,
  Because all four features of this goal change that one description, and four
    separately-written accounts of a single behaviour disagree with each other
    within a release — the reference-doc trigger carried by each of the four
    features is discharged once, by this section, and not four times.

  Given that section and the answer the check gives when it is asked what it
    declines to examine,
  When the two are compared,
  Then the section describes the same set of reductions the check reports, under
    the same names,
  Because a reference page free to drift from the behaviour it documents
    recreates in prose exactly the invisibility this goal removes from the
    output, and the reader has no way to tell which of the two is lying.

  Given a narrowing of the reduction that has been specified but not yet built,
  When the reference material is published,
  Then the section describes the behaviour in force and does not present the
    planned narrowing as though it had landed,
  Because a reference that overstates the protection is the failure this whole
    goal exists to correct, and it does more harm on a security surface than
    saying nothing: it converts a gap into a false assurance.
