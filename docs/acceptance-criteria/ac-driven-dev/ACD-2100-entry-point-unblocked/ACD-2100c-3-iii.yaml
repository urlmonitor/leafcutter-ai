readiness: approved
priority: high
title: "Resuming a paused run never treats that run's own waiting drafts as leftovers"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given a run paused at a decision point whose durable pause record exists on disk, is
    not stale, and lists in its context the ids of the drafts that run produced and is
    waiting to have approved, with those drafts still uncommitted in the authoring
    worktree,
  When the route is started again freshly (same run id, the person's answer supplied for
    that decision point, no harness resume) and the partial-run recovery scan runs,
  Then the drafts listed in that run's own pause record are not offered as leftovers from
    a crashed earlier session, no leftover-recovery decision is raised for them, and the
    person's answer is applied to the decision the run is paused at exactly as
    ACD-2100c-3 requires,
  And any uncommitted draft NOT listed in that pause record is still offered as a leftover
    as it is today,
  And when no answer is supplied the recovery scan behaves exactly as it does today,
  And the existing pause record is never rewritten to name a different decision point
    during a resume; if the record cannot be read the run ends with the existing
    "pause_record_unreadable" status rather than falling through to the leftover decision,
  And the bug symptom ("Resuming a paused /plan-feature run freshly (same run_id, args.resume_answer for gate-ba, no harness resumeFromRunId) on 2026-10-09 (run_id pf-workspace-scratch-cleanup-20261009) did not apply the approval: the Partial-Run Recovery scan classified the run's OWN 42 business-analyst drafts (origin_agent business-analyst, readiness draft, uncommitted in the authoring worktree) as orphans from a crashed prior session and paused at gate 'resolve-orphans-choice'. That pause OVERWROTE the run's existing durable pause record for gate-ba (.leafcutter/paused_runs/<run_id>.json now named resolve-orphans-choice), so the person's gate-ba approval could never be applied and the run burned 2.1M tokens for nothing.") must not occur.
depends_on: [ACD-2100c-3, ACD-2100c-3-ii]
