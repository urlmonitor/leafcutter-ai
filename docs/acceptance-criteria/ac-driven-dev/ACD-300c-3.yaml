id: ACD-300c-3
components:
  - ac_driven_dev
readiness: reviewed
priority: medium
title: "Final gate after the test-design stage allows the user to set priority and promote to approved"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the technical planner has enriched the AC batch and set readiness: reviewed,
    and the test-design stage has then completed for the batch,
  When the workflow presents the final gate to the user,
  Then it displays: all ACs in the batch with their enriched fields
    (assigned_agent, estimated_complexity, delivers_to, expects_from) and their test design,
  And it prompts the user to set a priority (critical/high/medium/low)
    for the batch,
  And it offers three actions:
    - "approve" — the approval is applied as ACD-300c-4 specifies: readiness: approved and
      the chosen priority on every AC the approval-hold report releases, held ACs stay
      reviewed; the pipeline completes successfully,
    - "edit" — provide feedback; the test-design stage is re-invoked with the feedback
      (loop until approved),
    - "defer" — set readiness: reviewed but do NOT promote to approved;
      ACs stay in store but are not scanner-eligible,
  And if the user approves, the workflow reports the count of ACs approved and the count held.
depends_on: [ACD-300c]
doc_links: []
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- The approve action runs the approval step of ACD-300c-4; the workflow writes no readiness or priority
  itself.
- Defer leaves every record byte-identical.
- 'templates/workflows-js/plan-feature.js is over its size limit and its measured length must not grow
  (GE-127b-1 growth ratchet): lines added are paid for by lines removed or by rationale comments moved
  to docs/reference/plan-feature-workflow-rationale*.md. Build after GE-127h-1 so decision-history lines
  are free.'
- Canonical sources only; deployed and installed copies are regenerated by the build and never hand-edited
  (ADR-001).
declared_files:
- path: templates/workflows-js/plan-feature.js
  state: existing
delivers_to: null
expects_from:
  ac_id: ACD-300c-4
  contract: 'scripts/ac_store/approve_acs.py gains an id-list mode and a priority option: given ids [str]
    and priority (critical|high|medium|low) it writes, for each id it does not hold, readiness approved,
    that priority and one appended amended_by approval entry, as one field-targeted write per record followed
    by a read-back. --json prints {approved: [id], held: [{id, file, reason}]} (reason in HOLD_REASONS),
    plus an additive already_approved: [id] list; --dry-run --json prints the same report without writing.
    Exit is non-zero when any written record fails read-back, and that record is restored to its pre-write
    bytes.'
test_intent:
- clause: 'it displays: all ACs in the batch with their enriched fields (assigned_agent, estimated_complexity,
    delivers_to, expects_from) and their test design'
  needs_test: true
  reason: The gate is where the user judges the test design, and omitting it would make the approval blind.
- clause: it prompts the user to set a priority (critical/high/medium/low) for the batch
  needs_test: true
  reason: The priority prompt feeds the approval step, and a missing prompt would approve with no priority.
- clause: '"approve" — the approval is applied as ACD-300c-4 specifies: readiness: approved and the chosen
    priority on every AC the approval-hold report releases, held ACs stay reviewed; the pipeline completes
    successfully'
  needs_test: true
  reason: Approve must route through the approval step with only released ids, which is the gap this change
    closes.
- clause: '"edit" — provide feedback; the test-design stage is re-invoked with the feedback (loop until
    approved)'
  needs_test: true
  reason: Edit must re-invoke the test-design stage, not the planner, now that the gate follows test design.
- clause: '"defer" — set readiness: reviewed but do NOT promote to approved; ACs stay in store but are
    not scanner-eligible'
  needs_test: true
  reason: Defer must leave records unapproved and unchanged, and a regression would make them scanner-eligible.
- clause: if the user approves, the workflow reports the count of ACs approved and the count held
  needs_test: true
  reason: The approved and held counts are computed from the approval step's report and can be wrong.
origin_agent: BrainCandy
