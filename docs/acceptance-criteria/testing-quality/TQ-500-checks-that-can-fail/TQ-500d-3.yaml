notes: |
  THE FALSE-OBLIGATION CONTROL FOR THE WHOLE TREE. Every other AC here adds something a
  writer must do. The predictable overshoot is a check that demands a substitute of all
  work, which turns a targeted question into a tax on every piece of work in the
  repository — and a tax whose only natural remedy is to switch the check off. The vast
  majority of work has an ordinary red baseline and must be untouched by this.

  THE LAST CLAUSE IS THE ANTI-CLASSIFIER CONSTRAINT SEEN FROM THE OTHER SIDE. TQ-500a-1-i
  forbids inferring that a piece of work owes a substitute; this forbids the inference
  surviving as a demand made of work that already answered. An implementation that reads
  an absence-shaped requirement and asks for a substitute anyway, despite a captured red
  baseline, fails here even if it passes there.

  BOUNDARY. Placed under TQ-500d because it is the boundary the guidance must draw:
  TQ-500d-2 presents the substitute as what to do when the ordinary evidence is
  impossible, and this is the observable form of that sentence.
