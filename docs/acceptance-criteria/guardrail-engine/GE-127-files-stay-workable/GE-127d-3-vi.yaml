work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a covered JavaScript or TypeScript file holding a block written on one
    line (`if (x) { a(); b(); }`, `function f() { return 1; }`,
    `xs.forEach((x) => { a(x); b(x); })`, a type literal `{ a: string; b: number }`),
  When it is measured,
  Then it measures what the same block measures with its opening brace, each
    statement and its closing brace on lines of their own,
  And an object literal or destructuring pattern on one line (`{ a: 1, b: 2 }`,
    `const { a, b } = o`), an empty block, and braces inside a string are not
    split,
  And given a covered SQL file holding several statements on one line, inside or
    outside a dollar-quoted function body,
  When it is measured,
  Then each statement counts as a line, and a `;` inside a string, identifier or
    comment does not split a line,
  And given a covered shell script holding several commands on one line
    (`a; b`, `if x; then y; fi`, `for i in 1 2; do echo $i; done`),
  When it is measured,
  Then it measures what the same script measures with one command per line,
    while a `&&` or `||` list, a `;` inside a quote or substitution, and the words
    `then`, `do` or `else` used as arguments (`echo do it`) do not split a line,
  And given a tracked file already over its limit and a staged change whose only
    effect is joining a Python compound body onto its header (`if x: y`), writing
    a JavaScript block on one line, or joining SQL or shell statements, or the
    reverse of any of these, with the file indented in its language's usual unit
    (four spaces in Python, two elsewhere),
  When the author performs an ordinary commit,
  Then the commit completes, the outcome states that the change added 0 lines,
    and the quoted length is the same before and after,
  And the published measurement rule names SQL and shell among the languages that
    count a line once per statement.
