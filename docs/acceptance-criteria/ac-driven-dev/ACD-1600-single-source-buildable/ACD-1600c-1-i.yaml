it_requirements:
  - "Canonical source to change: scripts/ac_store/scan_ac_store.py (the leaf-readiness/completeness gate; source-only Python, no templates/ counterpart)."
  - "Fixtures for these two real ACs must be exercised via a temp store copy — the gate must flag each with the reason \"missing file targets\" and exclude it from the ready/dispatch set."
  - "The held-back decision must be data-driven -- the record is in the 'no declared files' state per the declared-files seam (ACD-1600c-4) -- not keyed on the specific AC ids and not on what their it_requirements or doc_links say."
  - "The fixture asserts its precondition (neither copied record carries declared_files) rather than assuming it, so a later declaration on the real records fails the fixture loudly instead of silently changing the verdict."
  - "Both real records read as schema_version < 2, so under the default advisory mode they are reported with 'missing file targets' but not held (ACD-1600c-1 migration requirement); the held-back and not-dispatched assertions run with the gate in enforce mode on the temp store."
