id: ACD-2500a-3-ii
components:
  - ac_driven_dev
  - ac_store
readiness: approved
priority: high
title: "A documentation link saying the work modifies a file missing from the declared list needs a decision, and the file is never added automatically"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given record P declares the files scripts/x.py, marked existing, and
      unit_tests/ac_store/test_x.py, marked to be created,
    and P's documentation links name scripts/x.py as a file the work modifies,
      scripts/y.py as a file the work modifies,
      and docs/reference/ac-schema.md as describing the work,
    and record S is in the "no declared files" state and its documentation links name
      scripts/build.py as a file the work modifies,
  When the requirement rule check runs,
  Then P gets exactly one finding of this kind, with disposition "needs a decision", naming
    P and scripts/y.py and stating that a documentation link says the work modifies a file
    P's declared list does not contain,
  And neither scripts/x.py (declared and linked as modified) nor docs/reference/ac-schema.md
    (linked as describing) is named in a finding of this kind,
  And after the run P's declared list is still exactly scripts/x.py and
    unit_tests/ac_store/test_x.py, in that order -- scripts/y.py is not added and no link is
    removed,
  And S gets no finding of this kind; S is listed as "not evaluated: no declared files" for
    this rule and is not counted as passed.
depends_on:
  - ACD-2500a-3
  - ACD-1600c-4
  - ACD-1600c-4-ii
