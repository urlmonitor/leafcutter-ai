assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment: null
  reference_file_path: scripts/build_orchestration/fast_lane.py
  n_location_rule: "1 (resolve_connected_build_set's structural-parent test; scope: non-parent deps with absent / non-AC covered_by)"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py"
  policy:
    - "Structural-parent recognition = id-shape rule (derive_parent_id) OR recorded edge (the dep's covered_by contains the node id); the recorded edge is added to, never substituted for, the id-shape rule"
    - "Recorded-edge check reads the dep's covered_by from the store record already loaded for the walk; it must not add a second store scan per dependency (resolution stays linear in the number of ACs reached)"
    - "Tolerant of absent, null, or non-list covered_by and of non-AC entries (test-file paths, ticket paths): such entries never match and never raise"
    - "Default exclude_structural_parent=False stays byte-identical in membership and order for every existing caller (BO-2600a-1 invariant)"
    - "Edit the tracked source scripts/build_orchestration/fast_lane.py only; the deployed .leafcutter/scripts mirror is regenerated by scripts/build.py, never hand-edited"
test_spec:
  - name: test_dep_not_listing_node_walked_with_descendants
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "Q (covered_by [Q-1, Q-2], not listing T) is included and its not-done descendants Q-1, Q-2 enter the set"
  - name: test_dep_without_covered_by_walked_without_error
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "R with no covered_by field is included as a genuine prerequisite and resolution does not raise"
  - name: test_dep_with_test_file_covered_by_not_parent
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "S whose covered_by holds only test-file paths is included, not treated as structural parent, and does not raise"
  - name: test_recorded_parent_excluded_alongside_genuine_deps
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "P (recorded parent of T) is excluded while Q, R, S are all included"
