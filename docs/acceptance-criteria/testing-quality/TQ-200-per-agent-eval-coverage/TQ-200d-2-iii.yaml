it_requirements:
  - >-
    Code change in scripts/evals/sql_test_writer_eval/evidence_kinds.py, counts_rows_and_non_null (:101-117): classify
    each executed query over the view on its own instead of only the joined text (:112 joins every query with spaces,
    which would let a 'col IS NOT NULL' in one statement qualify a COUNT(*) in another). A query whose count(*)
    or count(1) sits in a statement whose WHERE clause holds '[<alias>.]<column> is not null' (as the first predicate
    or after AND) is a non-NULL count of the column; it is NOT also the processed-row count (ROW_COUNT_RE :29 must
    not count it), so the exact processed-row count must come from another query or from the Python-side form (_python_side_counts
    :90-98). 'is null', another column's 'is not null', and a predicate in a different statement do not count. non_null_re
    (:68-72) keeps its three existing forms.
  - >-
    A filtered COUNT(*) counts only when the value it fetches is asserted with an equality (assert ==, assertEqual/assertEquals)
    against a fixed or seeded number: the assertion that reads that query's fetched result (fetchone()/fetchall()
    after its execute and before the next execute in the same test function, directly or through a name assigned
    from it). A '>= 0' or 'at least one row' assertion on it fails. If pairing an execute with its assertion needs
    sql_resolve.py (:172 executed_queries returns strings only), the pairing helper goes there; both files stay
    at or under 400 lines.
  - >-
    The row empty-window-database-shape in scripts/evals/sets/sql-test-writer.jsonl is unchanged; its gold output
    and the TQ-200d-2/-2-ii probes in unit_tests/evals/fixtures/tq200d2/ keep their results.
  - >-
    Unit tests never call a live model; they score recorded outputs and probe fixtures only. Kept live outputs are
    copied by the test-writer from the kept-outputs folder of the 2026-11-02 runs (<session scratchpad>/kept_runs/run1|run2/<set>/<row>/,
    local to the run machine, as the known issue names it) into unit_tests/evals/fixtures/tq200d-rerun/<set>/<row>/run1|run2/
    as flat '<name>.py.recorded' files plus report.md (and transcript.jsonl where the row reads commands), the gold-output
    form place_outputs reads, so a bare pytest never collects them. Absolute local paths in a copied file (for example
    a sys.path line naming a user temp folder) are replaced with a neutral placeholder and nothing else is changed.
    No committed file names the scratchpad path. If another TQ-200d re-run AC has already created a needed fixture
    file, it is reused, not copied again. Probe fixture for this AC: sql-test-writer/empty-window-database-shape/run1
    (test_buy_volume_window.py.recorded plus report.md; line 16 holds a sys.path to a local temp folder and is neutralised).
    The copy with 'AND buy_volume IS NOT NULL' removed and the other negative variants are built by the test from
    the fixture.
  - >-
    Every changed .py file stays at or under 400 counted lines; run_agent_eval.py is not touched and does not grow;
    no new module is added at the top of scripts/evals/. unit_tests/evals/ is at its density cap, so this AC's tests
    go in their own subfolder (named in test_spec) with an __init__.py, like unit_tests/evals/tq200d1ii/. Tests
    go in unit_tests/evals/tq200d2iii/.
  - >-
