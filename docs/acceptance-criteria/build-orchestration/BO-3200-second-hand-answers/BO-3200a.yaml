roadmap_phase: phase_1
criteria: |
  What the system knows comes from the real thing, not from a retelling.

  When the build needs to know something about your project — a setting, a file,
  the state of your repository — it reads it directly. No fact it depends on is
  obtained by asking a specialist to look and report back, so a shortened,
  reworded or partial retelling can never be mistaken for the fact itself.
