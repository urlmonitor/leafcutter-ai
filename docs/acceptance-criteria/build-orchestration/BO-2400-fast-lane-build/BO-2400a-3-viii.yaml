id: BO-2400a-3-viii
components:
  - build_orchestration
  - testing_quality
title: "Re-running the red-baseline gate on an unchanged worktree reproduces the partition and the verdict"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the red-baseline gate has run once against a worktree and produced a newly-added
    set, a pre-existing set, a per-test red / green / inconclusive classification and a
    verdict,
  When the gate is run a second time against the same worktree with no file changed, no
    commit made and no branch moved between the two runs,
  Then the second run's newly-added set, pre-existing set, per-test classification,
    verdict and halt reason (where one is present) are identical to the first run's,
  And each set is reported in the same order in both runs,
  And the second run leaves every file in the worktree unmodified.
depends_on: [BO-2400a-3, BO-2400a-3-ii, BO-2400a-3-v]
