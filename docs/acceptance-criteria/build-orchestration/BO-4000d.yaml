test_rationale: |
  The helper was already correct and its own tests were already green — that is exactly
  why the incident was invisible. The defect lives only in the caller's reading of the
  reply, so a test of worktree_repo_facts.py proves nothing here, and a test of an
  extracted parse helper proves only that the copy under test unwraps. What has to be
  shown is that build-feature's own body, given the observed double-wrapped reply,
  reaches the worktree decision instead of aborting. That is a dispatch fact, visible
  only through _workflow_engine_harness.py. The failure entry is paired with the
  criterion entry deliberately: the cheapest wrong fix is to unwrap whatever it can and
  fall back to a default base, which would turn this refusal into a silent guess.
