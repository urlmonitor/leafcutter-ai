it_requirements:
  - "No value in the map, including front matter, may come from the wall clock, file modification or creation time, the user name, the host name, or an absolute path; created/last_updated keep coming from the existing committed map (KM-DBF-014)"
  - "Covers both refresh paths: the generator CLI and the transform-doc-index pre-commit hook (tracked source templates/scripts/commit_guardian/transform_doc_index.py)"
  - "This AC asserts the sum of KM-300a-1, KM-300b-1 and KM-300b-2; if it is still red once those are green, the remaining host-dependent input must be fixed here and named in the DECISION HISTORY"
  - "The proof must not need two operating systems: it must compare against a host-neutral golden map stored as test data (LF, forward slashes, fixed order), so every CI host checks the same bytes"
  - "check-file-size ratchet: scripts/generate_doc_index.py is 480 lines against the 400-line .py limit (already over). The change must leave it no longer than at HEAD (net-zero or shrink). If new logic does not fit, extract it to a new module and add that module to every deploy list that already names generate_doc_index.py (scripts/build_deploy_manifest_helpers.py, scripts/build_phases_knowledge.py, scripts/build_phases_workflows.py) so the deployed transform-doc-index hook can still import it"
