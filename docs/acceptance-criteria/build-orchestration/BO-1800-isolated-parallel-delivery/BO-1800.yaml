notes: |
  Strategic capability from ADR-018 (agent isolation topology). Intended to
  supersede the shared-workspace model behind BO-1600 (safe-concurrent-dispatch):
  BO-1600 protects one SHARED store when many deliveries land at once; BO-1800
  removes the sharing entirely by giving every drive its own isolated copy, and
  adds a server-side guarantee that main changes only through the gated workflow.
  Supersession of BO-1600 is handled separately -- do NOT edit BO-1600 here.
