id: BO-3200c-3
title: "At every decision point, no answer available and the person answering no are different outcomes with different consequences"
component: build-orchestration
components:
  - ac_driven_dev
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given every point in a run at which only the person can decide,
  When each is driven to the state where no answer can be obtained,
  Then each reports an outcome that means no answer was obtained.

  Given the same points,
  When each is driven with the person answering that they decline,
  Then each reports an outcome that means the person declined, and that outcome differs from
    the no-answer outcome at the same point.

  Given any one of those points,
  When the two outcomes are compared by what follows them,
  Then after the no-answer outcome the authored work is present and the run can be resumed at
    that question, and after the declined outcome the run follows the person's instruction —
    so the two are not interchangeable.
depends_on:
  - BO-3200c
  - BO-3200c-1
