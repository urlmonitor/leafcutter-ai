readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a raised conflict decided as the fault having already been fixed,
  When the retire outcome is applied to the fault entry,
  Then the fault entry reads as retired,
    And no requirement record's finished-or-unfinished state changes,
    And no requirement record is modified at all by that act.

  Given a raised conflict decided as the finished claim having been false,
  When the demotion is applied to the requirement,
  Then the requirement reads as unfinished with its reason recorded,
    And no fault entry is retired by that act,
    And no fault entry is modified at all by it.

  Given a conflict where both records need changing,
  When both outcomes are applied,
  Then each is applied as its own act against its own record,
    And each is separately visible in the history of what was changed,
  So two changes are never bundled into one that cannot be undone separately.

  Given the demotion of a requirement,
  When the transition it uses is compared against the transition used when a
    requirement's proof lapses,
  Then it is the same transition,
  So there is one way for a requirement to lose its finished state and not two.
