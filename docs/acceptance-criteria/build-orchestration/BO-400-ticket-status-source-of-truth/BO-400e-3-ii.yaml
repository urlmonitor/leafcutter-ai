notes: |
  Requested by BrainCandy 2026-10-15 to close KI-BO-20260930. Authored by the business-analyst
  on the user's behalf; readiness draft -- the user approves before build.

  WHY THIS IS STILL OPEN AFTER ae5f9db9c (2026-07-08, "scope step 3.5 ac-closure to epic branch
  only"). Confirmed against templates/workflows-js/finalize-feature.js on origin/main at the
  time of authoring:
    (1) The scoping is prose, not a computed result. The whole of sub-steps B-E is a prompt
        string handed to a status-checker agent (:1340-1427, dispatched at :1427). "Only close
        tickets that this branch explicitly changed" (:1350) and "DO NOT walk the whole ticket
        store" (:1351) are instructions an agent may or may not follow; nothing in the workflow
        computes the set or checks the agent stayed inside it. This is why the last scenario
        pins "settled before any record is written ... cannot add a record to it".
    (2) The comparison is whole-tree. :1354 instructs `git diff --name-only origin/main HEAD`,
        the two-dot form, which lists every path that differs between the two trees --
        including every ticket main changed since the branch point. For a single-ticket branch
        SCOPE_PREFIX is empty (:1335-1337), so nothing filters those out; for an epic branch
        they leak whenever main changed a ticket inside the epic's own folder (e.g. a scaffold
        that reached main after the branch was cut). :1355 (`log origin/main..BRANCH
        --diff-filter=A`) is branch-relative but only catches added files.
    (3) Staging is by directory -- see BO-400e-3-v.

  "Touched" vs "delivered" -- DECIDED by BrainCandy 2026-10-15: NARROW. On a single-ticket
  branch the closable set is only the ticket the branch was built for (provided the branch
  changed it) plus that ticket's source AC; a ticket edited in passing is never closed. On an
  epic branch the set is the epic-folder tickets the branch changed plus their source ACs.
  In both cases a record must satisfy BOTH bounds: built-for/epic-folder AND changed by the
  branch since its merge base with main.

  HOW "THE TICKET THE BRANCH WAS BUILT FOR" IS IDENTIFIED TODAY -- there is NO reliable
  source finalization can read. Open item for the IT-PO; not invented here.
    - finalize-feature.js receives only a target branch/worktree (args.target /
      args.target_branch, :442) and derives BRANCH and WORKTREE_ROOT from preflight
      (:514-515). It takes no ticket argument. Its Step 6b scope probe (:1892-1907) asks an
      agent to "Search tickets/ tree for ticket files referencing this branch" -- a guess,
      the same prose-scoping weakness as cause (1).
    - scripts/setup_ticket_worktree.py `setup-ticket` names the branch feature/<slug>
      (:1729), where the slug comes from _derive_slug (:1512-1527): strip
      "TICKET-YYYYMMDD-", lowercase, "_" to "-". That mapping is lossy (the date is dropped,
      so two tickets with the same title on different days collide, and case is folded), so
      the branch name cannot be turned back into one ticket path reliably. It is also
      overridable with --branch (:1696-1697), which breaks the link entirely; `create-only`
      (:1736-1775) makes a feature/ branch with no ticket at all.
    - The ticket path IS known at setup time: setup_ticket_worktree.py prints it as
      ticket_path_final in its JSON payload (:1730), and build-single-ticket consumes it as
      TICKET_PATH (templates/skills/build-single-ticket/SKILL.md:79). But nothing found
      persists it in the worktree, on the branch, or in the ticket's frontmatter, so it is
      gone by the time finalization runs.
  Options for the IT-PO: persist the built ticket's path at setup (a marker in the worktree
  or on the branch), pass it into finalization as an argument, or record the branch on the
  ticket. Until one exists, the "cannot be identified" scenario applies: close nothing and say
  so -- never fall back to "every ticket the branch changed".
