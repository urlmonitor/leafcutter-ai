test_spec:
  - name: test_uncalled_registered_capability_is_reported_and_the_check_exits_nonzero
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Invokes check_reachability.main(['--mode','precommit',...]) as the real entry point over a fixture surface registering claim/release/mark-done/report with automation invoking only the first three; asserts a non-zero return code and that the emitted output names `report` and the surface it is registered on."
  - name: test_called_capabilities_are_not_reported_in_the_same_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Same run as above: asserts claim, release and mark-done appear nowhere in the findings, so a report-everything implementation fails alongside the positive assertion."
  - name: test_inventory_comes_from_the_built_parser_not_the_source_text
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A fixture surface whose source mentions an `add_parser('ghost')` call inside a branch that is false at build time, and which registers a capability through a loop over a table, is inventoried by running the check: `ghost` is absent from the findings and the loop-registered capability is present."
  - name: test_failure_output_does_not_name_a_skip_or_bypass_flag
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Asserts the text emitted on the refusing run contains neither 'SKIP=' nor '--no-verify', so the blocking gate never documents its own off switch."
test_rationale: "This AC is a gate, and the defect it exists to prevent is a gate that is defined but never reached — fast_lane.py's own structural tests were green while its gates never executed. A direct-import unit test of an inventory helper would prove set arithmetic and nothing about whether the hook runs, exits non-zero, or ever consults the built parser. Every test therefore invokes check_reachability.main() as a process-level entry point over a fixture surface and asserts the exit code and the emitted text. The third test is the decisive one: it can only pass on an implementation that genuinely builds the parser, because a source-scanning implementation gets both the ghost capability and the loop-registered capability wrong in opposite directions."
