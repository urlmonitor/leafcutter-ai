notes: |
  Why this record exists now and not earlier. BO-1800f carries
  documentation_triggers [sequence-diagram, reference-doc] and its notes record that
  both slots were held on purpose: a documentation criterion written before the
  behaviour's shape was settled documents the wrong thing. The shape is now settled —
  BO-1800f-2's IT PO enrichment fixed the declaration mechanism as a `Removes:` commit
  trailer unioned across the delivery set, and named the boundary it wanted drawn as
  read-tip -> replay -> adjudicate -> refuse-or-push. This record is the
  sequence-diagram slot. The reference-doc slot is BO-1800f-4 and is authored
  separately; the two must not be merged, because the reference doc's subject is the
  declaration's syntax, scope and error cases, while this one's subject is the order
  and the branching of the boundary.

  Why the criteria bind content and not existence. "A diagram exists" is satisfied by
  an empty fence, by a diagram of a different flow, and by a diagram that draws only
  the path where everything works. All three would be indistinguishable from a correct
  one under an existence check, and the last is the likeliest outcome: a delivery
  boundary is easy to draw as a straight line from finished work to an open pull
  request, which is precisely the picture that hides both refusals. The criteria
  therefore fix the two decision points, both their outcomes, and the count of end
  points, so that the artifact cannot be produced without depicting the behaviour the
  L1 is about.

  Why the end points are counted rather than listed loosely. There are exactly three,
  and enumerating them is what rules out the two degenerate drawings that a looser
  wording admits: a diagram with one end point (everything succeeds) and a diagram
  with two (success and a single undifferentiated failure). The second is the more
  dangerous of the two, because collapsing "could not read the shared branch" into
  "refused" in the picture is the same collapse BO-1800f-1-i exists to forbid in the
  behaviour — a check that examined nothing reported in the same shape as a check that
  found nothing.

  Why the per-path clause is stated separately. BO-1800f-2-i's four-way table shows
  that a single whole-delivery "were removals declared?" decision looks correct and is
  not; a diagram drawn that way would teach the reader — and any agent reading it as
  context — the third row of that table. Drawing the adjudication as a per-path
  decision against the declared set is what makes the picture agree with the record.

  Falsifiability. The criteria are checked by reading the artifact and enumerating,
  not by confirming it is present. Three distinct enumerations each fail a distinct
  wrong diagram: the end-point count fails a happy-path-only drawing; the
  branch-labelling requirement fails a drawing whose branches cannot be traced to the
  criteria they claim to depict; and the prohibition on a proceed-branch after an
  unreadable read fails a drawing that carries the wrong disposition for an
  unverifiable shared branch. Each of the five labelled elements is checked against a
  named acceptance criterion, so when a criterion under BO-1800f changes, the element
  bearing its identifier either changes with it or is demonstrably out of date; the
  failure surfaces as a named mismatch rather than as a diagram that merely looks
  plausible. An assertion about the diagram's existence, its frontmatter alone, or its
  line count satisfies none of these.

  Authoring-time observations for whoever enriches or implements this record, recorded
  rather than acted on:
    - Staleness is NOT mechanically detected for this diagram type. The repository's
      mermaid drift check hashes related files and compares them against an embedded
      marker, but it applies only to the data-flow and user-flow coverage genres and
      unconditionally skips sequence diagrams, which have no related-code contract. So
      the branch-labelling and related-documents clauses above are the whole of the
      staleness defence here; there is no hook behind them. Whether to extend the drift
      genres to cover this diagram is a separate decision and is deliberately not
      assumed by this record.
    - The two vocabularies for diagram genre do not match. The frontmatter validator
      accepts `dataflow`, while the drift check keys on `data_flow` and `user_flow`.
      Harmless for this record, since a sequence diagram is skipped either way, but it
      means a future attempt to bring sequences under drift checking will hit a
      vocabulary mismatch first.
    - The authoring procedure mandates scaffolding via a script that is not present in
      this tree (the procedure's own scaffold step), while the sequence-number
      allocator it also names is present and answers 8 for a component-level diagram at
      authoring time. The criteria above require the number to be allocated rather than
      chosen, and do not fix it at 8, because the free number may move before the
      artifact is written. The missing scaffold script needs resolving before the
      artifact can be produced by the documented path.

  -- IT PO, 2026-09-14 (technical enrichment; nothing above this line was altered) --

  ALL THREE BA OBSERVATIONS WERE VERIFIED INDEPENDENTLY AND ALL THREE HOLD.

  1. THE MISSING SCAFFOLD SCRIPT. Confirmed: scripts/scaffold/new_arch_doc.py exists
     nowhere in the tree and the scripts/scaffold/ directory itself does not exist, while
     scripts/next_diagram_seq.py is present and answers 8 for level 3 (highest existing
     c3 is c3-007). The absence is not a discovery — it is a KNOWN gap the package
     already tracks: scripts/build_propagation_audit.py lists the path in its
     EXTERNAL_DEPENDENCY_ALLOWLIST so the broken-reference guard does not block, with an
     inline comment recording that the absence 'causes a hard user-visible failure in
     write-c4-diagram' and that 'a separate authoring ticket is required to create and
     deploy this script' (DECISION HISTORY, 2026-06-17, EPIC-BuildGuardFalsePositive/03).
     BP-900b-1-1 owns that allowlist, is already work_status done, and names this very
     path as one of the five references that resolve only via the allowlist — so the
     record that touches the problem is the one that HIDES it, not one that fixes it.

     Handled as an it_requirement naming the two permitted resolutions (author the script
     first, or an explicitly user-authorised scaffold-free pass that copies frontmatter and
     Legend verbatim from an existing same-tier sequence), NOT as a depends_on edge.
     Rationale for that choice: no AC in the store owns creating the script, so a
     dependency edge would point at nothing and would park this record indefinitely
     behind a prerequisite no one is scheduled to build. Recorded as a blocker at
     sign-off instead, so it is resolved by a human decision before dispatch rather than
     discovered by the diagram author mid-task.

  2. DRIFT COVERAGE. Confirmed: check_mermaid_drift.py declares
     _COVERAGE_GENRES = {data_flow, user_flow} and returns early for any other
     diagram_type, so sequences are skipped unconditionally. DECISION: accept
     review-only enforcement AT THE HOOK LAYER and do not extend drift coverage here —
     that is separate work with its own vocabulary-reconciliation prerequisite, and
     folding it into a documentation record would make a diagram AC secretly a
     guardrail-engine AC. But 'review-only' is NOT left as the whole answer, because a
     clause with no mechanism behind it is the shape of defence this tree exists to
     remove. The substitute is mechanical and ships with this record:
     test_every_criterion_the_diagram_names_still_exists_in_the_ac_store resolves each
     identifier the diagram references against the live store on every CI run. It is
     narrower than a content-hash drift check — it catches a criterion withdrawn,
     renamed or superseded, not a criterion silently reworded — and that narrowing is
     stated here rather than glossed.

  3. TEST CONTRACT. Set test_required: true with a nine-descriptor test_spec, NOT
     test_required: false. A sequence diagram in this repo is a committed text artifact
     with parseable frontmatter and a parseable mermaid body, so 'no pytest-shaped
     assertion is possible' is false here: every clause of the criteria that is not
     already covered by a commit hook is expressible as an assertion over that file plus
     the AC store. Leaving it false would have left the content clauses — the three
     decision points, the three end points, the per-path adjudication, the absent
     proceed-branch, the five labels — enforced by nothing at all, which is precisely the
     unfalsifiable documentation AC the BA wrote these criteria to avoid.

     The routing concern that would normally argue for false does not apply: the assigned
     agent's registry produces value is 'documentation', so the produces-trait TDD
     guardrail does not fire, but generate_ticket_from_ac.py adds test-writer and
     test-runner to the agents map whenever an authored test_spec is present, and emits
     the ## Test Requirements block on that ground independently of produces. Verified in
     the generator source at enrichment time.

  4. change_target / risk_surface. change_target: docs — present in both enums
     (config/ac_store_schema.json and the top-level sections of config/guardrail_gates.yaml).
     risk_surface: contract_boundary, NOT the siblings' 'safety', and the divergence is
     deliberate. guardrail_gates.yaml maps docs/safety to an EMPTY mandatory-agent list,
     so copying the siblings' value would produce a documentation record whose computed
     gate set is zero agents — a check that examined nothing, on the record whose whole
     subject is not examining nothing. docs/contract_boundary maps to
     [documentation-expert, pr-reviewer], which is the right pair: this diagram is the
     shared picture that the implementers of all three delivery workflows read as context,
     so an error in it propagates into code. BO-1800f-4, enriched independently by another
     agent, reached docs/contract_boundary as well.

     Note for whoever reads ADR-017 next: its risk_surface table (core_logic,
     data_integrity, user_facing, integration, observability, none) is STALE and does not
     match the enforced six-value enum in config/ac_store_schema.json
     (internal, contract_boundary, auth, privacy, safety, cost) or the lookup keys in
     config/guardrail_gates.yaml. The config files are authoritative; the ADR needs
     reconciling, which is not this record's work.

  5. depends_on. Added BO-1800f-1, BO-1800f-1-i, BO-1800f-2 and BO-1800f-2-i to the
     existing [BO-1800f]. The governing reason is BO-1800f's own: a documentation
     criterion written against an unsettled shape documents the wrong thing, and it is
     the IMPLEMENTATION, not the record, that is still unsettled. Nothing detects
     divergence between this diagram and the code it depicts — there is no drift hook for
     sequences and the conformance test checks the diagram against the CRITERIA, not
     against the implementation — so a diagram landed before the behaviour is built can
     be silently wrong from the day the coder deviates, with no mechanism to say so. The
     cost is real and is accepted with eyes open: it delays the picture past the code it
     could have informed, and it pulls an L and an M python implementation into any
     connected build set resolved from this record. BO-1800f-4 took the same edge to its
     own two sources independently.

     The edges are ORDERING, exactly as BO-1800f-2's notes say of its own edge to
     BO-1800f-1 — they are not nesting, and this record remains a direct child of
     BO-1800f.

  6. delivers_to is null and that is a finding, not an omission. The diagram's consumers
     are human readers and agents reading context; it produces no data another AC
     ingests. expects_from names BO-1800f-2 because that is the record whose enrichment
     SETTLED the shape being drawn, and the contract is written to make explicit that
     what is consumed is the recorded decision, not a runtime output.

  7. declares_side_effect deliberately left absent. The record does write a durable file,
     but the field's effect is to force-route user-surface-smoker, which exercises a
     running application — meaningless for a Markdown diagram. The equivalent
     'is it actually wired to anything' question for a prose artifact is reachability from
     its parent component doc, and that is covered by
     test_the_diagram_is_reachable_from_its_parent_component_doc plus
     check_mermaid_parent_link.

  CAVEATS RAISED TO THE BA — not acted on, because criteria are the BA's:

  A. BO-1800f-1-ii LOOKS LIKE A FOURTH END POINT AND THE CRITERIA FIX THE COUNT AT THREE.
     BO-1800f-1-ii is 'A replay that cannot complete cleanly stops the delivery and
     restores the copy' — a distinct terminal disposition of this same boundary, and not
     reducible to either of the two refusal end points the criteria enumerate (the read
     failed; an undeclared removal was found). The criteria name four sibling records and
     three end points; BO-1800f-1-ii and BO-1800f-2-ii are behavioural siblings the
     criteria do not mention. Either the diagram will omit a real branch of the boundary
     it claims to draw, or the count is short by one. This needs a BA decision: amend to
     four end points and six or seven labelled elements, or state in the criteria that the
     replay-failure disposition is out of this diagram's scope and why. Until then the
     test_spec asserts EXACTLY THREE, faithfully to the criteria as written — which means
     that if the BA amends, the end-point descriptor must be amended with it.

     This is also why the staleness descriptor is written as a liveness check (every
     referenced identifier still resolves) rather than as a completeness check (every
     behavioural leaf under BO-1800f is referenced). The completeness form is the more
     useful of the two and it is what the criteria's purpose clause reaches for, but
     authored today it would be red on arrival against BO-1800f-1-ii and BO-1800f-2-ii,
     and a knowingly-red-forever test is worse than a narrower green one. Revisit when
     caveat A is resolved.

  B. THE BA'S HOUSE-STYLE REFERENCE HAS A NON-CONFORMING FILENAME.
     docs/architecture/diagrams/c3-done-proof-evaluation-sequence.md is a good model for
     branch annotation and the walk-through section, and it is kept in doc_links for that.
     But its filename does not satisfy check_diagram_naming.py's c[1-4]-NNN-slug.md
     pattern, and it declares no parent: field, which check_mermaid_parent_link now
     requires. Both hooks examine only STAGED files, so the pre-existing file is
     untouched and untouchable by them — but a new diagram copying its shape would be
     blocked at commit. c3-007-promise-versus-claim-sequence.md has been added to
     doc_links as the conforming model to copy instead.
