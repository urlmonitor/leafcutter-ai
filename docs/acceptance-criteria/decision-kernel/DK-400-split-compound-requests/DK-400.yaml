req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Ask a many-sided question and get every part answered, with you in charge.

  Today a request that bundles several questions into one is turned away, and
  someone has to split it by hand before any of it is answered. After this goal,
  such a request is recognised and divided into a few clearly bounded parts that
  you approve, and each part is answered in a sensible order, with earlier
  answers informing later ones. The same works for a research request with
  several needs and for a many-sided question that only turns up partway
  through, and nothing is divided or worked on without your approval.
