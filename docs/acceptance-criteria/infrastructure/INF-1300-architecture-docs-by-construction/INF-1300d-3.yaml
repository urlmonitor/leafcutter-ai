criteria: |
  Given any request that cannot be satisfied correctly, for any reason,
  When it is refused,
  Then the refusal states both what about the request was wrong and what to supply
    instead, in terms the author can act on without opening another document,
  And after the refusal the project is in exactly the state it was in before the
    request: no document at the destination, no entry in any index, no change to
    any other document, and no partially written file anywhere,
  And a refusal is distinguishable from a success by the outcome of the run alone,
    before and without reading anything it said,
  And no refusal ends with the author holding a document: if what was asked for
    cannot be produced in a form the project would accept, nothing is produced,
  And this holds for every reason a request can be refused in this tree, each
    reason observed rather than assumed to behave like the others.
