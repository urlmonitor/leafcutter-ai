notes: |
  The decision to keep or clear follows the workspace's state (the landed rule), not the
  run's success flag. Named wrong versions: (1) clearing on the pushed but unmerged line --
  first half red, the folder is gone; (2) the run's failure replaced by the clearing answer --
  first half red; (3) "clear on any post-PR failure" without consulting the verdict -- the
  second half is still protected by the door's refusal, so the run must report the refusal as
  work kept, naming the commit, not as a clearing error.

  AMENDED 2026-11-16 (user decision Q3, merged timing D2): the first half used to clear,
  because a pushed line counted as sent. It now keeps the workspace for the landed-work pass
  (BO-4400g-2).

  AMENDED 2026-11-16 (user decision, plan-feature gate): a second scenario has a step fail
  after the pull request has merged. The workspace is cleared and the run is still reported
  failed, so the named wrong version (4) "only clear on success" -- folder left behind holding
  nothing -- is caught here again.
