notes: |
  EVIDENCE LABELS — carry them through unchanged.
    - OBSERVED: check_ac_schema.py cannot resolve config/ac_store_schema.json from a
      separate working copy and silently degrades to manual field validation. The fallback
      sits at templates/scripts/commit_guardian/check_ac_schema.py:623.
    - REPORTED BY A PARALLEL SESSION, NOT VERIFIED: that 26 schema-violating files
      consequently looked clean. This AC does NOT assert that number. Producing a measured
      figure is GE-120c-4's job; cite 26 only with the "reported, not verified" label until
      GE-120c-4 has run.

  REPEAT-DEFECT CONTEXT: GE-112 already fixed an adjacent defect in this same file (the
  manual validator running on the jsonschema SUCCESS path). This is the second defect in
  one file in one area. That is the argument for satisfying this AC via the generalised
  behaviour of GE-120a-1-ii plus the shared resolution facility of GE-120b-2, rather than a
  third patch local to this file. An implementation that changes only this file, and would
  not have prevented the neighbouring instances, has met the letter of this AC and missed
  its point — flag that at review.

  NOTE the visibility/parity split: making the check ANNOUNCE the degrade is this AC.
  Making the schema document actually resolvable from a worktree is GE-120b-3. Both are
  needed; neither substitutes for the other.

  IT-PO (2026-08-14): the GE-112 schema_validated flag (DECISION HISTORY ~lines 29-37) is
  the existing field the three-state model maps onto — reuse it rather than adding a
  parallel indicator. check_ac_schema.py is confirmed to be in the un-migrated set that
  still carries a private root walk.
