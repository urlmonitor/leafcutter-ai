id: BO-2000a-2
title: "A bare self-hosting-verified claim with no recorded command or output is rejected with an actionable message"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a self-hosting non-regression claim that asserts "self-hosting verified"
    with no recorded command and no recorded output attached to it,
  When the fulfillment gate / validator evaluates the claim,
  Then the claim is rejected,
  And the rejection message is actionable: it states that a recorded command and
    its captured zero-new-violations output are required to substantiate the claim,
    and that a bare assertion is not accepted as evidence.
