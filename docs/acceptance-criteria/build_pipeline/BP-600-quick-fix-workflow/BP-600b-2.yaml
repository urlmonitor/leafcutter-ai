created: 2026-06-05
amended_by:
  - reason: behaviour-change-restatement
    by: business-analyst
    at: '2026-08-24'
    note: >-
      The criterion described a flat per-component id sequence — "IDs BP-001
      through BP-006 ... its numeric suffix is the next available sequential
      integer" — which is the scheme the hierarchical store retired. The
      workflow now mints child ids by extending the parent (an integer L2
      sibling under an L1, or a Roman-numeral L3 under an L2), so the "next
      available integer for the component" rule would produce an id that does
      not correspond to any position in the tree. Two original clauses are
      kept: the prefix still comes from the component's entry in the AC-store
      index, and an id is still never reused. The no-reuse rule is strengthened
      to state explicitly that a superseded or deprecated record permanently
      occupies its slot, which the flat wording only implied. A clause was
      added requiring the chosen id to agree with the file's position in the
      hierarchy, because those are now two separate decisions that can
      disagree — and a record whose name and location disagree is how a child
      becomes unreachable from its parent. Found during the BP-600 sweep, in
      the same class as BP-600b-1 and missed only because the original brief
      scoped to that record. Title amended. work_status left done.
