id: BP-300d-3-ii
components:
  - build_pipeline
title: "The runtime's version is read correctly from the Claude Code CLI's real output, so an unsupported runtime is actually detected"
component: build-pipeline
level: L3
status: active
req_status: draft
readiness: approved
priority: medium
work_status: done
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/build_pipeline/BP-300-workflow-orchestration/BP-300d-3.yaml"
criteria: |
  Given no CLAUDE_CODE_VERSION override is set and the build probes the installed
    Claude Code CLI with `claude --version`, which prints e.g. "2.1.294 (Claude Code)",
  When the workflow-script phase decides whether the runtime is supported,
  Then the version is read from the first dotted version number in that output
    (2.1.294), not from its last word,
  And a version at or above the minimum installs the workflow scripts with no
    "version unknown" warning,
  And a version below the minimum is detected as unsupported: the scripts are
    skipped with the minimum-version warning (the BP-300d-3 fallback),
  And only output that contains no version number at all is treated as unknown
    (warn and install, fail-open, unchanged),
  And the bug symptom ("Claude Code version unknown. Installing workflow scripts
    (fail-open)." on every build with the CLI installed) must not occur.
depends_on:
  - BP-300d-3
