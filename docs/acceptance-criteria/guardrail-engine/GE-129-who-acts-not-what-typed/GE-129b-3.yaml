criteria: |
  Given the commands and outcomes specified in GE-129b-1, GE-129b-2, GE-129b-2-i and GE-129b-2-ii,
  When a reader looks up the commit guard in the hooks reference,
  Then the reference holds one table of example commands in which every command from those four
    records appears once, each with its outcome for a subagent that is not the commit specialist:
    runs, refused as a commit, or refused as not ruled out,
    And the table sets each quoted-argument example beside its shell-run counterpart,
    And the reference states that a commit made by a program the command starts -- a script file,
    a git alias configured outside the command, a build-tool target -- is not recognised from the
    command text, and that the project's pre-commit checks still run on such a commit,
    And the reference states that only the `commit` subcommand is recognised, and names each of
    these git subcommands, which also add or rewrite commits, as not guarded by the commit guard:
    merge, pull, cherry-pick, revert, rebase, am, commit-tree, stash, notes, fast-import,
    filter-branch and replay.
