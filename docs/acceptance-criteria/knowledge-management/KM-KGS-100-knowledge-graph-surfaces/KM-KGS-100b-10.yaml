id: KM-KGS-100b-10
components:
  - knowledge_management
readiness: approved
priority: medium
title: "With the feature flag off (default), behavior is identical to today's live parse"
component: knowledge-management
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100b.yaml"
criteria: |
  Given the read-index feature flag in skills_config.json is disabled, which is its
    default state
  When any knowledge query read happens
  Then the query performs a live full parse of every declared surface exactly as it
    does today, returning the same nodes and edges
  And the index is neither read nor written during that query — no index file is
    consulted and none is created or updated
  And the observable output and side effects are indistinguishable from the current
    (pre-index) behavior
depends_on:
  - KM-KGS-100b
  - KM-KGS-100b-5
