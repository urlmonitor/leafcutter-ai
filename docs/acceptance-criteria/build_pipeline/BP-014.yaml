title: "live-surface-tester runs real HTTP requests against a dev server and asserts status/body/headers"
criteria: |
  Given a ticket that sets live_surface_test: true and declares a
    ## Live Test Fixtures block, and live_surface_testing.enabled is true in
    skills_config.json,
  When the build pipeline reaches the live-surface-tester phase (priority 11.8,
    after user-surface-smoker at 11.5 and before commit at 12),
  Then live-surface-tester starts a development server on a port allocated via
    the port registry,
  And it issues each declared HTTP request against the running server,
  And it asserts each response's status code, body, and headers against the
    fixture,
  And it tears the server down after the assertions complete,
  And the phase emits status: skipped (not failed) when live_surface_test is not
    true or live_surface_testing is disabled.
