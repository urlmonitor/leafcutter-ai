assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-400a-1
  contract: The routing-time split start (DK-400a-1 shape) with subject_kind 'research_request' and trigger 'ambiguous'.
it_requirements:
  - subject_kind research_request is set when the root's requested or classified output is leafcutter.evidence_bundle.v1,
    and the decomposition request then allows only the child capability research.
  - 'Allowed child capabilities by subject kind: goal -> decision or research; research_request -> research; decision_question
    -> decision.'
  - 'A host proposal that names a capability outside the allowed set for any part (decision for a part of a research
    request) is a contract violation: the answer is refused with a message naming each offending part id, and the
    host may repair it within host.max_repair_attempts. The kernel never re-labels a part''s capability itself.
    Exhausted repairs follow DK-400c-1-ii.'
  - The split gate, its four answers and the answer validation are one code path for every subject kind; there is
    no research-specific gate.
  - 'Tests enable splitting explicitly: split.enabled true through a config override (false only where a test compares
    with the off switch). None relies on the shipped default, which stays false until E3 merges (dec-9925ebf1895222f4,
    see DK-400a-1). A test asserting that no split starts must run with splitting on, or it passes for the wrong
    reason.'
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_ambiguous_research_request_split_into_research_parts
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: The reuse-threshold request (evidence output, routing needs-context, bundle 0.9) yields a split
      with subject_kind research_request and trigger ambiguous, and a gate whose every part names research.
  - name: test_decision_part_in_research_split_refused_for_repair
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: failure
    description: A host answer naming decision for p2 of the research request is refused naming p2, state is unchanged,
      and a corrected answer is then accepted.
  - name: test_research_split_uses_common_gate
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: seam
    description: The gate interaction of the research split offers the same four answers as the gate of a goal split.
test_rationale: Refusal versus re-labelling is a contract decision at the host boundary, so it is tested through
  a real host submission and its rejection.
