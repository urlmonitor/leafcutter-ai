notes: |
  Guard #2 of BP-1100f. Surface for IT-PO to pin: the pr-reviewer agent's
  dispatch-review lens — it should flag an agent()-style dispatch whose first
  argument is not a non-empty instruction string. Complements (does NOT duplicate)
  the harness-level detection in BP-1100f-4: this AC reviews a PROPOSED dispatch,
  BP-1100f-4 is the workflow test harness refusing to silently accept an
  instruction-less first argument. State the check in PORTABLE terms per ADR-001 —
  any project that installs leafcutter and runs build.py must get it; it must NOT
  rely on the leafcutter repo's own root CLAUDE.md. Origin RCA Failure #2
  (bare-object dispatch, no instruction, no consumer), /tmp/phantom-rca-bo2300.md.
