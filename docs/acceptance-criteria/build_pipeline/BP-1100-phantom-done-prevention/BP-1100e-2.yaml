id: BP-1100e-2
readiness: approved
priority: high
title: "The reconciliation is advisory and fails open by default; strict blocking is opt-in"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-1100-phantom-done-prevention/BP-1100e.yaml"
criteria: |
  Given the pre-done reconciliation produces a verdict that a ticket changed source
    files not present in its declared files_touched UNION out_of_scope
  When the reconciliation runs in its default configuration
  Then it reports the mismatch as an advisory (it names the undeclared source files
    and does not hard-block the ticket from reaching done) — the default is fail-open
  And when the strict mode is explicitly opted into via configuration, the same
    verdict blocks the ticket from being marked done until the scope is reconciled
  And when the reconciliation itself cannot run (an internal error computing the diff
    or reading frontmatter), it fails open — it does not block the ticket on account
    of its own failure
