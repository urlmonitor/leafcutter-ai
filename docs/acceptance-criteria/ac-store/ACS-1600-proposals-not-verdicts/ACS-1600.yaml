id: ACS-1600
title: "Automation can tell you what it found, but never decide what is finished"
component: ac-store
components:
  - ac_store
level: L0
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  What a tool puts into your requirements record is what it observed.

  Tools that install alongside this project can edit the record of what the
  project must do and what of it is finished. Some of them choose what to change
  by noticing that two pieces of text resemble one another. A resemblance is a
  reason to look closer, not an observation, and the finished-state of a piece
  of work is the single fact every other honesty check in the project reads as
  proof. After this goal, automation of that kind may examine, report and
  propose — and may not award a finished badge, may not act on a requirement
  that has been retired, may not alter anything without being asked to, and may
  not record a conclusion it was unable to establish. Whatever it could not
  establish is reported as unestablished rather than filled in with the most
  plausible answer.
