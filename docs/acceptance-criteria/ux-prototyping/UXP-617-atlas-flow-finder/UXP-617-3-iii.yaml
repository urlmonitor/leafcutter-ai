criteria: |
  Given the step 'resolve' of leafcutter/flow-render-pipeline implements UXP-411 and UXP-411a,
  When the person opens /flows/leafcutter/flow-render-pipeline?step=resolve and clicks the
    'UXP-411' chip in its drawer,
  Then the drawer shows one chip per linked criterion, UXP-411 then UXP-411a in stored order,
    each with that criterion's title,
  And the 'UXP-411' chip links /atlas?ac=UXP-411,
  And following it opens the Atlas with UXP-411 selected and its detail open, rather than the
    component overview,
  And opening /atlas?ac=UXP-411a directly in a new tab likewise opens UXP-411a selected with its
    detail open.
