id: INF-500e-2
components:
  - infrastructure
  - agent_telemetry
title: "A figure the report could not obtain reads as unknown, while a measured zero still reads as zero"
component: infrastructure
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reporting week whose merged pull-request count could not be obtained, in a
    row that also carries genuinely measured figures — 69 commits, 6435 lines of
    production code,
  When the machine-readable tab-separated rendering is produced,
  Then the pull-request column for that week is empty rather than 0,
  And the column recording whether pull-request data was available reads False,
  And the commits column still reads 69,
  So that one unobtainable figure does not cast doubt on the measured ones beside it.

  Given a reporting week in which the pull-request count was genuinely obtained and
    was zero, and in which no criterion was closed so there is no cycle time to
    report,
  When the machine-readable tab-separated rendering is produced,
  Then the pull-request column reads 0,
  And the median-cycle column is empty,
  So that "nothing merged" and "not measured" occupy visibly different cells in the
    same row.

  Given a count of 0 and a count that is unknown,
  When each is formatted for the human-readable report,
  Then the 0 renders as "0" and the unknown renders as a dash.

  Given a ratio whose numerator is unknown, and a ratio whose denominator is unknown,
  When each ratio is computed for display,
  Then both are unknown,
  And a ratio of 5 over 10 is computed as 0.5,
  So that an unknown input propagates through a derived figure instead of being
    silently treated as zero part-way down the calculation.

  Given a telemetry sink holding two recorded events, neither of which is a lane-run
    start event,
  When the autonomy section is summarised,
  Then the section reports itself unavailable,
  And the completion rate is unknown rather than 0%,
  And the summary states that the sink holds 2 events but none are lane-run events,
  So that an unwired emitter is never presented as runs that were attempted and all
    failed.

  Given no telemetry sink exists at the configured location,
  When the autonomy section is summarised,
  Then it reports itself unavailable with a reason stating the sink is absent.

  Given a telemetry sink holding two lane-run starts, one run that reached a merged
    pull request, and one halt,
  When the autonomy section is summarised,
  Then it reports itself available with 2 starts, 1 success, 1 halt and a completion
    rate of 50%,
  So that the unavailable path is a genuine absence of data and not the only path the
    summary can take.

  Given a telemetry sink in which one line is not parseable as a record, sitting
    between one lane-run start and one successful run,
  When the autonomy section is summarised,
  Then the unparseable line is skipped, the summary reports 1 start and 1 success, and
    no error is raised.
