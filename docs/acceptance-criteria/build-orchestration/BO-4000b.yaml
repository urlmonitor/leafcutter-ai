notes: |
  NAMED MUTATIONS:
    M1 — reuse an existing local branch without comparing it to origin/main (the incident).
         Caught by test_behind_branch_with_no_unique_commits_starts_the_worktree_from_origin_main.
    M2 — measure only commits ahead, the BO-900a-1 shape. Caught by
         test_behind_and_ahead_are_measured_on_a_real_repository and by the 47-behind cases.
    M3 — compare against the local main rather than origin/main. A stale local main
         hides the gap. Caught by the real-repository test, whose local main is left
         behind its origin.
    M4 — move a branch with unique commits onto origin/main, discarding them. Caught by
         test_behind_branch_with_unique_commits_stops_and_names_both_counts, which
         asserts the branch's commits are unchanged.
    M5 — treat an unfetchable origin as 0 behind. Caught by
         test_unfetchable_origin_main_refuses_an_existing_branch.

  DECIDED 2026-09-14 (user, Q2): keep the policy below. A behind branch with no commits of
  its own starts from origin/main, and the run reports how far behind it was. A branch with
  commits of its own stops the run. A failed origin/main fetch also stops the run.

  Background to that decision. The user's requirement is "not silently reused when
  behind main". The policy above is one reading. It starts a no-unique-commit branch from
  origin/main and reports it, and it refuses a branch with unique commits. Alternatives
  are to always refuse any behind branch (strictest; costs a manual step when nothing
  could be lost), or to rebase a branch with unique commits automatically (rejected: a
  rebase with conflicts in an unattended run is the silent-corruption shape BO-1800f's
  notes warn about). The unfetchable-origin refusal also blocks offline runs that target
  an existing branch. The user accepted that trade-off on 2026-09-14.

  The first scenario moves where the new worktree starts. It does not say whether the
  local branch ref itself is moved to origin/main or a fresh branch is cut. That is left
  to IT PO enrichment. Both satisfy the criterion, and neither loses a commit, because the
  scenario is limited to branches with no unique commits.
