title: "The fast lane's change is read before it is committed, and the reading has something real to read against"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run has built the five requirements it resolved and its changes
    are complete but not yet committed,
  When the change is read for defects,
  Then the reading happens after the work is built and before any commit for that run
    exists,
  And the reader is given the five requirements the run resolved and the changes the
    run actually made, and its findings name which requirement a concern relates to
    and which changed file it was found in,
  And the reading needs no per-work ticket to exist anywhere on disk in order to
    produce those findings,
  And every examination the thorough path performs by consulting a ticket is either
    performed here from those two inputs, or is named in the run's result as an
    examination that was not performed and why — an examination that is quietly
    skipped is not permitted.
