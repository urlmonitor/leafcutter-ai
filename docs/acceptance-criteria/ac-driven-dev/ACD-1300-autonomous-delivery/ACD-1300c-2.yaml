it_requirements:
- Commit the durable blocker and evidence before releasing execution capacity; a blocked feature retains
  claim identity but cannot hold a model slot indefinitely.
- Store diagnostic evidence without credentials, and separate waiting capacity from blocked-for-human
  states so unchanged blockers cannot spin.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300c-1 (data handoff, not an additional build-order prerequisite): ACBudget
  {run_id:string, ac_id:string, attempts_used:integer, implementation_elapsed_ms:integer, remaining_attempts:integer,
  remaining_ms:integer, exhausted:boolean}.'
- 'Runtime interface from ACD-1300b-4 (data handoff, not an additional build-order prerequisite): WorkspaceClaim
  {claim_id:string, owner_id:string, run_id:string, feature_id:string, canonical_worktree_path:string,
  branch:string, target_ref:string, target_sha:string, source_revision:string, generation:integer}.'
- 'Runtime interface from ACD-1300e-2 (data handoff, not an additional build-order prerequisite): RunCheckpoint
  {schema_version:integer, run_id:string, feature_id:string, source_revision:string, target_sha:string,
  workspace_claim:object, settings_revision:string, next_step:string, ac_evidence:object[], ac_budgets:object[],
  review_count:integer, in_flight_action:object|null, publication:object|null}.'
test_spec:
- name: test_background_worker_blocker_preserves_all_progress_and_releases_slot
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: reachability
  description: Inject implementation and validation failures; reopen state and assert worktree/checkpoint/AC/counters/check
    evidence/action retained and another feature can acquire capacity.
  covers:
  - ACD-1300c-2
  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_unchanged_blocker_does_not_retry
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Repeat scheduler ticks on unchanged blocked run; assert zero new calls and unchanged attempts
    until explicit valid recovery.
  covers:
  - ACD-1300c-2
