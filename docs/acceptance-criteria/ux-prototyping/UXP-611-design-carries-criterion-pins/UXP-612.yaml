readiness: draft
priority: medium
title: "A rendered mockup pins a criterion to the element that shows it, in the same attribute and grammar as the built page"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given mockup-author is rendering a screen whose design shows the criteria
    UXP-100d-2 and UXP-100d-3
  When the rendered HTML file is written
  Then the element that shows each criterion carries a `data-ac` attribute
    naming that criterion
  And the attribute name is exactly `data-ac` — the same attribute the built
    page uses, never a CSS class, never a variant spelling, never a comment

  Given a single element in the design that shows two criteria
  When the rendered HTML file is written
  Then both ids appear in ONE `data-ac` attribute on that element, separated by
    whitespace, in the authored order, as `data-ac="UXP-100d-2 UXP-100d-3"`
  And the value contains no comma and no separator other than whitespace

  Given a rendered mockup with elements that show no criterion of their own
  When the file is written
  Then those elements carry no `data-ac` attribute
  And their bareness produces no finding of any kind
