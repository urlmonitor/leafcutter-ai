notes: |
  THE L0'S ONE HARD REFUSAL, MADE FALSIFIABLE ON THE RECORD WHERE IT WILL BE MOST
  TEMPTING. The L0 states it as an inherited refusal so it is not rediscovered;
  this AC turns it into something a test can fail. Without a criterion, a refusal
  stated only in notes is a suggestion.

  THE TEMPTATION IS SPECIFIC AND THE BA FELT IT. The motivating investigation was
  a sweep of composites marked finished with unfinished children, so the moment
  this pass completes a parent's child list, the obvious next line is "now
  recompute the badge". It is refused. Correcting the count and re-judging the
  claim are two acts, and only the first belongs here. Doing both would manufacture
  a finished claim on the one field the whole phantom-done edifice rests on, using
  evidence the pass had itself just written — a closed loop.

  THE LAST Then IS WHAT STOPS THIS READING AS TIMIDITY. Leaving the finished-state
  alone is not the same as leaving the problem alone. A repaired child list makes
  a previously unreachable disagreement visible to the reader whose job it is, and
  that visibility is the product. This clause requires the pass to hand that over
  rather than to swallow it.

  A NOTE ON WHY THE SECOND Then IS STORE-WIDE. Restricting the assertion to the
  repaired parent would allow a run that leaves its target alone and adjusts a
  neighbour. The refusal is on the whole run.
