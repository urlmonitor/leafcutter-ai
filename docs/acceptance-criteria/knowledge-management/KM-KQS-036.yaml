id: KM-KQS-036
readiness: draft
priority: medium
title: "Agent Protocol specifies mandatory-invocation rule preventing agents from skipping the query"
component: knowledge-management
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the knowledge-query SKILL.md contains an "Agent Protocol" section,
  When a consuming agent reads the Agent Protocol to determine whether
    the knowledge-query invocation is optional or required,
  Then the protocol contains an explicit mandatory-invocation rule stating:
    "Agents MUST invoke knowledge-query during their knowledge-acquisition
    phase even if prior file reads appear to provide sufficient context",
  And the protocol provides the rationale: file reads cannot detect
    cross-component overlap, recently-registered agents/skills, or
    ACs authored in sibling components since the last template update,
  And the protocol states that the only acceptable reason to skip the
    invocation is when the script itself fails (in which case the
    error handling rules from the protocol apply),
  And the protocol does NOT specify WHEN in the workflow to invoke
    (that is agent-specific and remains in each agent template),
  And the protocol does NOT specify WHICH surfaces to query
    (that is agent-specific and remains in each agent template).
