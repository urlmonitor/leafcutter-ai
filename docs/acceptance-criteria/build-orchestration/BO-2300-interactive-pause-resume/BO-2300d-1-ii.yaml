  - name: test_cancel_keeps_committed_stages
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the harness, earlier committed stages remain present and unchanged after cancel."
  - name: test_cancel_opens_no_pr
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Via the harness, no PR-opening agent() is dispatched (absent from captured agent_calls) as a result of the cancellation."
