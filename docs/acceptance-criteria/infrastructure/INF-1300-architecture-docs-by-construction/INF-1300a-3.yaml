it_requirements:
  - "EVERY EMITTED VALUE MUST TRACE TO EXACTLY ONE OF TWO ORIGINS: a request input, or a project declaration read at run time (config/diagram_types.json, docs/components.json, the tier structure). No third origin — no literal baked into the emitter that duplicates something a declaration already states, no value derived from ambient filesystem state, no value derived from the wall clock when --date was supplied."
  - "THE PLACEHOLDER PROHIBITION IS ABSOLUTE FOR PATH-VALUED FIELDS, AND IT IS MEASURED. check_doc_frontmatter blocks on any entry in `related_docs`, `related_code` or `architecture_diagrams` that does not exist on disk. A sample path written to make the document 'look complete' converts an acceptable document into a refused one. The correct behaviour when a value is unavailable is to omit the field, or to refuse (INF-1300d-4) where the kind obliges it — never to invent an entry."
  - "A NON-PATH-VALUED REQUIRED FIELD IS NOT EXEMPT FROM THE SAME RULE, AND THERE IS ONE MEASURED CASE. `description:` is required on every `docs/**/*.md` by check_description_field and is NOT in SKILL.md section 6's frontmatter checklist. Because it is not path-valued, any non-empty string passes the hook — so the hook cannot protect this record's no-placeholder clause here. Decide explicitly and record the decision: either the value is derived from a request input (and the movement pair below must show it moving with that input), or it is an author prompt marked per INF-1300b-3. An unmarked constant stub satisfies every check and violates this record."
  - "COMPONENT VALIDATION IS A REFUSAL, NOT A WARNING. Every value written to `components:` must be an id declared in docs/components.json (canonical ids plus documented aliases, matching how check_doc_frontmatter's load_components_registry reads that file). A component the registry does not declare produces nothing and exits non-zero. A document declaring an unknown component reads correctly and is wrong about what it describes, which is worse than a refusal."
  - "TIER AGREEMENT IS ONE ASSERTION, NOT TWO. The tier digit in the emitted filename and the emitted `flight_level` value must be derived from the SAME single source — the `--tier` input — so they cannot disagree. check_diagram_naming compares them (`c<digit>-` against its flight-level map) and each is independently plausible on its own."
  - "DATES: `created` and `last_updated` are both the supplied `--date`, and neither may exceed it. Never read the wall clock when `--date` is supplied; the agent runtime may be in UTC while the project convention is the local date, which is the stated reason SKILL.md section 4 makes the flag required."
  - "THE MOVEMENT PAIR IS THE LOAD-BEARING OBSERVATION AND IT MUST BE RUN PER INPUT, NOT ONCE. Produce twice, differing in exactly one input, and require the two documents to differ in exactly the places that input controls and nowhere else. A producer that writes a constant, or that derives a value from something other than the input it claims to derive it from, passes every single-run assertion and fails this pair. Reuse the construction INF-1200c-1 and BP-900c-4-i already settle; do not reinvent it."
  - "All of INF-1300a-1's vacuous-green guards apply to any hook invoked by this record's observations."
  - "Error handling per the project error-handling policy (CLAUDE.md rules 1-4)."
