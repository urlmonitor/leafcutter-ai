notes: |
  Not hypothetical. Line 19 of the live sink is the literal string
  "</content>" — free-hand appending by agents has already put a non-parseable
  line into the file, and a well-formed knowledge record sits on the line
  immediately after it. Any reader that aborts on the first parse error would
  silently drop everything below line 19 while reporting a clean short run.
