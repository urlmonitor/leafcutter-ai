readiness: draft
priority: medium
title: "The product-truth record is produced and kept truthful by the system, not maintained by hand"
component: ux-prototyping
level: L0
status: active
req_status: active
work_status: in_progress
criteria: |
  As a product owner, I want the product-truth record to be produced and maintained by
  the system itself — where the artifacts live, which of them a given request actually
  warrants, which agents draft them, and the derived links that say which steps are
  built — so that the record I later review exists without anyone hand-maintaining it,
  and so a link that has gone stale fails a check rather than quietly misleading me.

  This is the production side of product truth. Its sibling UXP-490 is the consumption
  side: reviewing flows, mock data and mockups and seeing which steps are built. What
  UXP-490 renders, this goal writes and keeps honest.
