notes: |
  Edge case of DK-400a-1. ADR-053 section 6: an uncertain routing answer never passes
  silently, so the ambiguity must not be resolved by running the top candidate on the whole goal.
  A goal whose parts need different capabilities (here one decision part and one research part)
  is a normal split; each part names its own capability (DK-400c-1).
