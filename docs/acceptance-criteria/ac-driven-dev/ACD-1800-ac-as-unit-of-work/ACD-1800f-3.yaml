id: ACD-1800f-3
components:
  - ac_driven_dev
readiness: draft
priority: medium
title: "An observable promise with no proof is reported as unproven, never as passed"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement that declares it has an observable effect,
  And the requirement states no proof of that effect at all,
  When the observable promise is checked,
  Then the outcome is that the promise is unproven, and the requirement is named
    in it,
  And the outcome is not a pass,
  And the requirement cannot be counted as complete on the strength of that
    check,
  And a run that executed three proofs and observed all three reports an outcome
    that a reader can distinguish from a run that executed none.
depends_on: [ACD-1800f, ACD-1800f-1, ACD-1800f-2]
