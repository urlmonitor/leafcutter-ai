req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an active AC that has at least one test tagged "# covers:<id>" and every such
    test passes in the current test run,
  When the done-status of that AC is evaluated,
  Then the AC is eligible to be marked done.
depends_on: [BO-2500a]
