criteria: |
  Given the reference documentation an author consults before adding a check to the
    guardrail engine,
  When that author reads it,
  Then it states the no-silent-pass rule in the form this tree defines it: a check that
    could not perform its inspection reports a could-not-check outcome rather than success,
  And it states the boundary against the existing fail-open convention explicitly — failing
    open on one bad input while the check still ran remains correct and is not repealed —
    and cites GE-116a-1-iii as the approved example,
  And it states the third state as well: a check that fell back to a reduced inspection
    labels its clean result as not authoritative,
  And it states that the cannot-run disposition, block or announce, is recorded per check
    with no implicit default, and names where it is recorded,
  And the existing documentation that records only the fail-open convention, without its
    limit, is corrected in place rather than contradicted by a second document,
  And the AC-parent-covered-by reproduction is included as the worked example of the
    difference between "nothing wrong here" and "I never looked".
