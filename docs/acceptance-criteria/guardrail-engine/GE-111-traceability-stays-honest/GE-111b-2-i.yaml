title: "Symbol tier fails open when tooling is unavailable; the file-path floor still applies"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-111-traceability-stays-honest/GE-111b.yaml"
criteria: |
  Given an acceptance criterion AC-X has implemented_by entry
    "src/foo.py#process_order"
  And the staged commit keeps "src/foo.py" present in the staged tree
  And the symbol-analysis tooling is unavailable (the binary is missing) OR the
    file's language is unsupported by that tooling
  When the traceability reconciliation check evaluates AC-X
  Then the symbol tier does not produce a drift verdict for AC-X
  And the check emits an advisory message stating the symbol could not be
    resolved and the symbol-level check was skipped for AC-X
  And the file-path floor verdict for "src/foo.py" still applies (clean, because
    the file survives), so AC-X is not blocked on the unresolved symbol alone

  Given an acceptance criterion AC-Z has implemented_by entry
    "src/gone.py#helper"
  And the staged commit deletes "src/gone.py"
  And the symbol-analysis tooling is unavailable
  When the traceability reconciliation check evaluates AC-Z
  Then the file-path floor still produces a drift verdict for AC-Z naming the
    change kind as deleted
  And AC-Z is blocked on the file-path floor verdict despite the symbol tier
    being unavailable
