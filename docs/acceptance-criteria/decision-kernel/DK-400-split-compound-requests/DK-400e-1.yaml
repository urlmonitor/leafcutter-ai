assigned_agent: python-coder
estimated_complexity: L
delivers_to:
  agent: python-coder
  contract: 'Per part, updated when the part ends: outcome ''pending'' | ''decided'' | ''answered'' | ''not_settled''
    | ''not_run''; settled_order: integer 1..n in settling order, null unless decided or answered; run_id: this
    run''s id for every part that ran; decision_id: ''dec-'' + 16 hex of the staged record iff decided; result_ref:
    ''inv-'' + 16 hex iff answered (artifact result-<inv>.json in the run''s artifacts); findings: string iff answered;
    stop_reason: ''budget_stop'' | ''blocked'' | ''capability_gap'' | ''cancelled'' iff not_settled; waited_for:
    part id iff not_run because a dependency did not settle. Split state moves approved -> in_progress -> completed
    | ended_partial; run status completed iff every part not left out settled, partial otherwise. Consumed by DK-400e-2,
    DK-400e-3, DK-400e-4, DK-400f-1 (progress) and DK-400f-2 (report).'
expects_from:
  ac_id: DK-400d-1
  contract: 'The approved split (DK-400d-1 delivers_to shape): parts with review kept, edited or left_out, their
    depends_on after releases, and gate_by and gate_at.'
it_requirements:
  - Approved parts run as work items of the same run (children of the split item), never as new runs, and strictly
    one at a time whatever limits.max_concurrent_native allows.
  - 'Order: dependency order computed by one shared ordering function (Kahn''s order over depends_on, taking the
    free part with the lowest proposed index first), the same function the five-part cut uses (DK-400c-1-i). A part
    starts only after every part it depends on has settled; settled_order counts 1..n without gaps.'
  - Parts are bound deterministically to their approved child_capability (decision or research) without a routing
    Jev call.
  - 'Per-part budgets: each part runs with its own allowance equal to what a stand-alone run of that question would
    get from config (Jev calls, host operations, work items, active seconds, and depth headroom measured from the
    part''s own work item), configurable under split. A part''s unspent allowance is not lent to other parts, and
    the root''s pre-gate spend (routing, decomposition) is charged to the root. No part may be stopped by a run-level
    guard that a stand-alone run of its question would have passed.'
  - Child work per run is bounded by split.max_parts_per_run (default 5, counting every part offered by every split
    in the run), so a run's total spend stays bounded by that count times the per-part allowance plus the root's
    own.
  - 'The split item''s terminal status is derived from its parts: completed iff every part not left out settled,
    partial otherwise. finalize''s root-completion rule is extended for a split root only: its output is the split
    record under leafcutter.decomposition.v1 (ADR-067 §4.3, §9), and the envelope''s decision_ids list every decided
    part''s record. No decision_report.v1 is produced for the bundle as a whole.'
  - 'Restart and cancellation safety: a restart between parts neither re-runs a settled part nor skips a pending
    one; cancelling stops at the next safe point and the running part ends not_settled with stop_reason cancelled.'
  - 'Handle failures per the project error handling policy: catch specific exceptions, log at WARNING with the run,
    work item and split ids involved, and never swallow a failure silently; a rejected submission leaves run state
    unchanged.'
  - 'Carries the build-slice flip (dec-9925ebf1895222f4): split.enabled returns to its approved default on, in config/kernel_config.default.json
    and as the config model''s default, with config/kernel_config.schema.json regenerated. E3 merges as one unit,
    so main turns splitting on only once the whole DK-400 tree is in; E1 and E2 ship it false (DK-400a-1).'
  - 'Tests enable splitting explicitly: split.enabled true through a config override (false only where a test compares
    with the off switch). None relies on the shipped default except test_shipped_split_default_is_on, which pins
    it: batch order inside E3 does not guarantee that DK-400e-1''s flip lands first, and a later default change
    must not silently flip a test (dec-9925ebf1895222f4).'
  - leafcutter.decomposition.v1 (ADR-067 §4.3, §9) is registered in SCHEMA_CATALOG and KNOWN_SCHEMA_IDS, with its
    exported schema file and fixtures, by this AC. It is the output of a split root or split item, and it carries
    none of the mock dataset's hand-split-only values (proposed_by claude_code, the outcome settled_by_human, the
    part field human_answer), confirming ADR-067 §4.3 (Open Question 6a).
  - 'Part payload (ADR-067 Open Question 5, settled by the IT PO): each approved part''s work item carries exactly
    what a stand-alone run of its question would carry. That is a leafcutter.goal_request.v1 payload whose goal
    is the part''s text as approved, request kind capability, requested_output_schema leafcutter.decision_report.v1
    for a decision part or leafcutter.evidence_bundle.v1 for a research part, and a binding pinned at creation to
    the approved child_capability from the run''s pinned registry snapshot, so the part is never routed, intent-classified
    or bundle-checked. It is not a typed leafcutter.decision_request.v1 (a part has no caller options or criteria)
    or leafcutter.research_request.v1 (research plans the needs, as for a stand-alone goal). This matches the per-part
    budget rule (a part is treated as a stand-alone run of its question).'
change_target:
  - code
  - config
risk_surface: cost
test_required: true
test_spec:
  - name: test_parts_run_one_at_a_time_in_dependency_order
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: For p1 and p4 free and p2 and p3 waiting for p1, the event timeline shows the parts settle in the
      order p1, p2, p3, p4, numbered 1 to 4, with never two parts in progress at once.
  - name: test_parts_are_work_items_of_the_same_run
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: Every part's run_id is the splitting run's id and no new run is created.
  - name: test_part_budget_not_starved_by_earlier_parts
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: With run limits that one decision fits, four decision parts each receive their own allowance and
      all settle.
  - name: test_split_root_completes_from_its_parts
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: seam
    description: When every part settled, finalize marks the run completed, its output is the split record and the
      envelope lists every decided part's record; no decision report covers the whole goal.
  - name: test_restart_between_parts_resumes_next_part
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: failure
    description: A process restart after p1 settles resumes with p2 and never re-runs p1.
  - name: test_shipped_split_default_is_on
    target_dir: tests/kernel/config/
    framework: pytest
    type: unit
    angle: real_artifact
    description: load_kernel_config() with no override has split.enabled true, and the committed config/kernel_config.default.json
      and config/kernel_config.schema.json both show true.
test_rationale: Ordering, budgets and root completion are scheduler behaviour, so the tests run whole split runs
  through RunService with scripted Jev and host answers and read the event timeline.
