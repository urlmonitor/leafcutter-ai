id: BO-4300e-2-iv
title: "A program whose current folder is inside a workspace stops clearing before anything is deleted"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: critical
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a project "shop" with a ready workspace "ticket/alpha" holding nothing
    unsent,
  And a shell is running whose current folder is "ticket/alpha" itself, holding
    no file of it open,
  And a second ready workspace "ticket/beta" holding nothing unsent, with a shell
    whose current folder is the sub-folder "docs" of "ticket/beta",
  When clearing "ticket/alpha" is requested, and then clearing "ticket/beta" is
    requested,
  Then each request is refused, and the refusal names the running shell by its
    process identifier and program name and states that it is working inside the
    workspace,
  And for each workspace its repository, its workspace record and every one of
    its files are identical before and after the refused request,
  And no fetch, push or deletion reached the shared project for either workspace,
  And after both shells have exited, clearing "ticket/alpha" again is answered
    cleared and nothing of it remains at its location.

  Given a project "shop" with a ready workspace "ticket/gamma" holding nothing
    unsent,
  And the maker cannot check which programs are working inside a workspace,
    because its program check is missing or fails to load,
  When clearing "ticket/gamma" is requested,
  Then the request is refused, and the refusal states that the program check is
    unavailable,
  And the repository, the workspace record and every one of the files of
    "ticket/gamma" are identical before and after the refused request,
  And no fetch, push or deletion reached the shared project for "ticket/gamma".
depends_on: [BO-4300e-2, BO-4300e-2-ii]
