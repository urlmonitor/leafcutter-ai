test_required: true
test_spec:
  - name: test_shipped_config_states_the_mode_and_the_check_runs_in_it
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: deployed
    description: "Scenario 1. Using the shared_reference_layout fixture (marked shared_layout_reader), loads the DEPLOYED commit-guardian configuration as JSON and asserts the test-declaration check's mode entry is present with value warning or error; then runs the deployed hook with no environment override over a temp repo staging one new undeclared test and asserts the outcome matches that mode (exit non-zero for error, exit 0 with a warning for warning)."
    must_catch:
      - "mode key absent from the shipped configuration"
      - "configured mode read but not applied"
  - name: test_explicit_warning_mode_is_reported_with_its_source
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Scenario 2. The real hook runs against a temp copy of the configuration with the mode set to warning and no environment override, over a staged file adding one undeclared test; asserts exit 0 and output stating warning mode is in force and was explicitly configured."
  - name: test_absent_mode_entry_is_reported_as_not_chosen
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Scenario 3. Same run against a temp configuration with the mode entry removed; asserts the output states no mode has been chosen for this check and does not contain the explicitly-configured wording used in Scenario 2."
    must_catch:
      - "report the fallback mode as configured"
  - name: test_reported_source_tracks_the_real_configuration_change
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "In one process, the real hook runs three times over the same staged file against configurations set to warning, set to error, and absent: the three outputs report three different mode/source pairs and the exit codes are 0, non-zero and the fallback's code respectively, so a hard-coded report string fails."
test_rationale: >-
  Scenario 1 is a claim about what a fresh install ships, so it reads the deployed
  configuration from the shared reference layout and then runs the deployed hook
  to prove the stated mode is the mode in force; parsing the JSON alone would pass
  on a key the hook ignores. Scenarios 2 and 3 are claims about the hook's output,
  so they run the real hook against real configuration files with any environment
  override cleared, because the override would otherwise mask the configured
  source. The discrimination test varies only the configuration across three runs
  so a hook that prints a fixed source string, or ignores the key, fails.
