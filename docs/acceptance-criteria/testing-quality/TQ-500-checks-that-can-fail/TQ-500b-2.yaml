notes: |
  THE SECOND CLAUSE IS THIS AC'S OWN SUBSTITUTE EVIDENCE, WRITTEN INTO THE
  REQUIREMENT. Withholding the finding and requiring the decision to flip is a named,
  repeatable alteration of the guarded behaviour — precisely the shape TQ-500a-3
  asks writers to record. It is here because the first clause on its own is
  satisfiable by a run that computes the finding, prints it, and decides on other
  grounds, which is the inert-report failure this repository has shipped before: the
  fast-lane runner passed its structural tests while never executing its own gates.

  THE FOURTH CLAUSE PREVENTS THE OPPOSITE ERROR. A decision that treats "no finding"
  as "unfinished" would fail every piece of work covered by TQ-500b-1-i's no-record
  carve-out, and the natural remedy for that flood of false blocks is to switch the
  whole check off.

  BOUNDARY. This AC decides nothing about whether a test is any good. It consumes one
  record-shape observation and lets it reach the completion decision.
