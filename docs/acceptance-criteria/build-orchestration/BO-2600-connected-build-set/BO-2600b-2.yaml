notes: |
  BO-2600b's L1 promises the operator "can tell from the run what that scope is before it
  starts". This criterion is the half of that promise that BO-2600b-1 does not deliver:
  BO-2600b-1 makes the scope right, this makes it visible.

  The placement of the statement was chosen against what the run can actually be observed
  to do. The lane's log() is stubbed to a no-op in the workflow engine harness, so a
  console announcement is untestable under the one vehicle CLAUDE.md permits for this
  lane; the two observable surfaces are the dispatched prompts and the terminal payload,
  and the criterion uses both — the dispatch for "before", the payload for "afterwards
  without replaying".
