criteria: |
  Findings are handed over intact, so size never becomes a false failure.

  When a specialist produces a substantial result, that result reaches the rest
  of the build complete and unaltered. Size alone never causes a good result to
  arrive shortened or replaced by a note about where to find it, so a build never
  fails, halts, or reports a problem that exists only in the handover.
