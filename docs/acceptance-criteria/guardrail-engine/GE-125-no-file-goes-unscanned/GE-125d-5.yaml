test_spec:
  - name: test_section_names_every_reduction_the_check_reports_under_the_same_names
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "The set of stable reduction names in the check's own answer (GE-125d-4) and the set named in the SKILL.md section are equal — neither a name in the answer missing from the section nor a name in the section the check does not report"
  - name: test_exactly_one_section_in_the_project_describes_the_reduction
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "A repository-wide search finds the reduction described in exactly one section of one document; any other file mentioning it links to that section rather than restating the behaviour — the arm that fails the four-documents outcome the goal forbids"
  - name: test_section_states_the_surviving_detection_rules_for_reduced_locations
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The section names the removed rule and every rule that still fires in reduced locations, and the surviving set matches what the check's answer reports — so a reader cannot conclude that reduced locations are unscanned"
  - name: test_section_contains_no_credential_shaped_value_or_withheld_value_example
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The section trips no detection rule when scanned, and contains no example notice showing a withheld value — the documentation must not model the output shape GE-125d-1 prohibits"
  - name: test_section_is_present_in_the_deployed_skill_after_the_build
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: "After `python scripts/build.py --target-dir .`, the deployed .claude/skills/security-scanner/SKILL.md carries the same single section as the canonical templates/ copy, so a deployed-only or template-only edit cannot pass"
test_rationale: "This is a documentation record whose second arm is mechanically checkable, which is exactly why it must not be given test_required: false — the AC's own claim is that the section and the check agree, and agreement between two artefacts is a set comparison a test can make. The parity entry is a seam test rather than a criterion test because the producer is the check's answer and the consumer is the published section: comparing name sets term for term is the only evidence that the section will not drift, and a human review pass is the failure mode this record exists to replace. The single-section entry is a repository-wide search, which is the correct instrument here rather than a smell: the claim IS about which files contain a description, so presence and absence across the tree is the property, not a proxy for behaviour. The no-example entry runs the detection rules over the section itself, because a documentation example is the most durable route by which a prohibited output shape is reintroduced — someone copies the example into the implementation. The deployed entry exists because SKILL.md ships through build.py and an edit to the deployed copy alone is reverted by the next build. The tests live in unit_tests/commit_guardian/ alongside the check whose answer they compare against, so the parity assertion has both artefacts in reach."
