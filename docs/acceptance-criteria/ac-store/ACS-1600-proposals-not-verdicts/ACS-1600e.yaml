notes: |
  PARTLY GREEN ON ARRIVAL — CHECK BEFORE ASSUMING A RED BASELINE. The governed
  tool already produces a persistent report of each run; that behaviour was
  specified by one of the records being retired and the code for it survives the
  retirement. This record re-homes the guarantee rather than commissioning it.
  Decomposition must establish which half is already true before writing a test
  that comes up green and proves nothing. The two halves are not equally likely to
  be present: an account of what a run FOUND is common, an account of what it
  WOULD CHANGE, produced before the change, is the part that usually is not there.

  THE LOAD-BEARING HALF IS THE BEFORE, NOT THE AFTER. An after-the-fact log makes a
  change auditable. A before-the-fact account makes it REFUSABLE, and refusable is
  the property that turns ACS-1600c's opt-in from a formality into a decision. If
  decomposition can only carry one, carry the before.

  DO NOT SPECIFY A FORMAT IN A CRITERIA BLOCK. Where the account lives, what shape
  it takes and whether it is machine-readable are technical enrichment decisions.
  A criterion naming a file location or a serialisation is at the wrong altitude
  and must be rewritten rather than approved.

  MANDATORY NEGATIVE ARM. A tool that examines nothing produces a perfectly honest
  empty account. The arm that distinguishes a real account from a vacuous one is a
  run over a store with known changes pending: the account names them, the count
  matches what a subsequent applying run actually alters, and neither figure is
  reported without its denominator.
