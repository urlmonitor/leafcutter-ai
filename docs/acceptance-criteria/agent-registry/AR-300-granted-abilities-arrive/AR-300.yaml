criteria: |
  Grant an ability, and the specialist really has it -- or you hear why not.

  You decide what each specialist is allowed to draw on. That decision is only
  worth something if the specialist is actually told about it when it starts
  work. Today a grant can be recorded, prepared, and then quietly go nowhere:
  the specialist works without an ability you believe it has, the system reports
  success, and nothing anywhere says otherwise. The specialist is not broken and
  does not complain -- it simply solves the problem the long way round, and you
  pay for capability you are not receiving.

  After this goal, an ability you grant is an ability that arrives. It is
  recorded in one place rather than two that can disagree, it reaches every
  specialist it was granted to, it keeps arriving for specialists and abilities
  added later, and a grant that fails to arrive is a reported failure rather
  than a silent one.
