notes: |
  BUG-19, observed in run wf_cc2b46d9-f6f.

  THE OBSERVED STATE. The batch plan was computed once at drive start and enumerated
  ten pieces of work. Three more were committed to the epic branch twenty-six minutes
  after planning. They were never built -- which is defensible -- AND never appeared
  in the final output's halted or skipped lists, which is not: the drive would have
  reported the epic complete having never seen them. The additions were invisible in
  both directions at once.

  WHY THE CONTRACT IS DETECT-AND-REPORT RATHER THAN BUILD. Extending the running plan
  to absorb new work gives the drive no termination condition: work added during a
  drive can itself add more, and a fifteen-hour run would become an open-ended one.
  Reporting is also the honest contract, because the operator who added the work
  during the drive is the one who knows whether it belongs in this drive at all.
  The cost of reporting is a second read of a set the drive already knows how to
  enumerate.

  WHY IT SITS UNDER BO-300a. The harm is entirely in the completion output: the drive
  told the operator it knew what had been built, and it did not. That is the promise
  BO-300 makes.

  ---

  AMENDMENT 2026-08-26 -- KI-BO-026. WHAT CHANGED AND WHY.

  This record originally required each unbuilt piece to be named "as discovered after
  planning and not built". That single phrase conflates two different facts: "absent
  from the plan" and "added to the epic after the plan was fixed". The drive can
  establish the first and cannot establish the second. It holds the set the plan was
  built from and the set present at completion; it holds NO record of what the epic
  folder contained at the moment planning ran. From those two sets, work the planner
  never selected and work added mid-drive are indistinguishable.

  So a FAITHFUL implementation of the original wording necessarily mislabels one as
  the other -- which is exactly what shipped, and is registered as KI-BO-026. On the
  37-ticket drive, twenty tickets that had been in the epic folder before launch were
  reported as having been added after the plan was fixed. The operator following that
  sentence goes looking for a change that never happened, and the real defect
  (KI-BO-025, the planner scheduling only the first ready wave) stays hidden behind an
  explanation that sounds complete. Fixing the code without amending this criterion
  would have put the code out of conformance with its own AC, which is why the
  amendment comes first.

  ONLY THE CAUSAL ATTRIBUTION CHANGED. The load-bearing half of this record is
  untouched and remains binding, verbatim in effect:
    - the epic's work set is re-read at reporting time and compared with the set the
      plan was built from;
    - the comparison is of SETS, by identity, NOT of counts;
    - each unbuilt item is NAMED in the output;
    - the output does NOT state the epic is complete;
    - the output states what the operator should do.
  That guard is why KI-BO-025 was caught rather than shipping as a false-complete, and
  weakening any part of it would be a regression, not a fix.

  THE SHAPE CHOSEN, AND WHY. Not a single unattributed bucket, because one distinction
  IS genuinely available and is worth keeping: work the plan WAS built from that did
  not finish is knowably "started and not finished" -- the plan membership and the
  completed record are both in hand. What is not available is any split of the
  not-in-the-plan set. So the criterion permits a cause only where the drive holds the
  evidence for it, and makes "cause not determined" the default for everything else.
  An unattributed "not built" is honest; "discovered after planning" asserted on no
  evidence is not, and is worse than an acknowledged gap because it stops the reader
  looking.

  SATISFIABLE WITHOUT A PLAN-TIME SNAPSHOT -- this is a constraint on the fix, not an
  oversight. Nothing in the amended criterion requires capturing what the epic folder
  contained at plan time. POSSIBLE FUTURE DIRECTION, NOT SPECIFIED HERE: such a
  snapshot would make "never selected" and "added mid-drive" separable and would let
  the undetermined bucket shrink. If it is ever introduced, the undetermined bucket
  must survive as the answer whenever the snapshot is absent or stale -- on a resumed
  or cached run, for instance. Silently falling back to one of the two definite labels
  is precisely how the current fabricated cause arose.

  RELATIONSHIP TO BO-300d. BO-300d (L1, authored 2026-08-26) sits ON TOP of this guard
  and explicitly forbids re-specifying it. It buys three deltas this record does not
  cover: a COUNT of unbuilt work, an honest REASON vocabulary, and a per-reason NEXT
  ACTION. This amendment is consistent with it and does not encroach: it removes a
  false cause from this record rather than specifying BO-300d's reason vocabulary or
  its count. Where BO-300d says the run "must not assert [a cause] it cannot
  establish" and that the honest output "says the cause is undetermined", this
  amendment is that same principle applied to the one sentence this record owns.

  RESIDUAL, NOT FIXED HERE -- reported rather than resolved unilaterally. The phrase
  "discovered after planning" still appears in the criteria and notes of the child
  records BO-300a-5-i and BO-300a-5-iii, where it is used to refer to this record's
  output section rather than to assert a cause. Those are separate approved records
  and were out of scope for this surgical amendment; they should be re-worded to
  "not built" for consistency when they are next opened.
