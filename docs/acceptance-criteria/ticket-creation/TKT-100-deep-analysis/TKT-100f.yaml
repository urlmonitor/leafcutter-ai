criteria: |
  An analyst decomposes each feature into precise, testable behaviors and edge cases.
  Starting from the approved feature goals, the analyst reads all related context,
  iterates with you until behaviors are clear, and writes one specification per
  testable outcome — each with specific inputs, actions, and observable results.
  Edge cases and failure modes are captured separately so nothing is overlooked.
