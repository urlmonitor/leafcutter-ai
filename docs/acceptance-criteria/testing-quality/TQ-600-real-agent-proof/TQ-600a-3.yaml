title: "How-to: run proofs that ask the real agent, deliberately, and read what they leave behind"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given the behaviour defined by TQ-600a-1 (switched on, the real agent is asked as shipped),
    TQ-600a-1-i (switched off, nothing is asked), TQ-600a-1-ii (unable to ask, the case fails
    by name) and TQ-600a-2 (the evidence record),
  When an operator who has never run such a proof follows the how-to guide for it,
  Then the guide tells them how to switch it on for one run and how to confirm it is off
    by default,
    And it lists the access the run needs -- model-service credentials, and permission
    settings of their own under which the cases' requests are allowed, since nothing is
    pre-approved --
    And for each of the four named failures it says what the operator sees and what to
    change before running again,
    And it tells them where the run's evidence record is kept and how to tell from it
    whether each case passed, failed or was not run,
    And it states that each run costs model usage and that no CI job runs these proofs.
