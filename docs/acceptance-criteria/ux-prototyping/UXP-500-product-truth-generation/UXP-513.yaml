    relationship: implemented-by-step
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements: |
  Every write step compares the newly serialized text against the current file text and
  only writes on difference; --check short-circuits the write and returns exit code 1 when
  changed is True.
