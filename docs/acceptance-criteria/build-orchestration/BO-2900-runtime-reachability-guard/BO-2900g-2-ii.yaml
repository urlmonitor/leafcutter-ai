notes: |
  WHY THIS IS A CONSTRAINT ON BO-2900g-2 RATHER THAN A DEFECT REPORT AGAINST IT. The
  parent is right and its implementation is wider than its own words. BO-2900g-2's
  criteria define a durable change as "a file that exists and can be read back
  afterwards, a record that is persisted, a command that leaves the system in a
  different state". None of those is a line on standard error. The shipped
  _DURABLE_EFFECT_RE nonetheless accepts a bare "is written" and "are written", and
  78 percent of everything it currently marks depends on exactly those two alternatives.
  The function's docstring says it was calibrated to mark "a STRICT subset ... ~3.6% of
  records with a Then clause (114 of 3148)"; the same measurement today gives 139, so the
  drift is visible in the code's own terms.

  HOW IT WAS FOUND, WHICH IS THE PART WORTH KEEPING. Four records tripped this gate in one
  day — GE-125b-4, GE-123d-4-ii, GE-123b-5, GE-123c-4 — and every one was a false positive.
  The first two were resolved by rewording the criteria, each recorded in the record's own
  amended_by, and the second of those carries an explicit instruction that a third
  occurrence should fix the derivation instead. The third and fourth arrived within the
  hour. Rewording a requirement so a regular expression stops objecting is not a fix; it
  is a slow edit of the specification by a tool that is wrong, and it leaves no trace
  anywhere except in the record that was quiet enough to change.

  THE SECOND CRITERION IS THE ONE THAT MATTERS MOST AND IS EASIEST TO MISREAD. It is not a
  request for an override. validate_declares_side_effect rejects an authored value that
  disagrees with the derivation, in either direction, which is correct and is the parent's
  whole point. The consequence, unnoticed until a false positive appeared, is that on a
  false positive there is NO WAY TO STATE THE TRUTH: declaring true asserts an effect the
  work does not have, and declaring false is rejected. The way out is a derivation that
  does not produce false positives, not a way to disagree with it.

  A FALSE POSITIVE HERE IS NOT COSMETIC. declares_side_effect: true force-routes
  user-surface-smoker into the generated ticket and BP-1100f-5 makes that routing
  non-overridable. On a documentation record the phase agent looks for a user-facing
  surface, finds none, and is fail-closed. So the gate does not merely mislabel the
  record; it blocks work that was correct.

  SCOPE FENCE. This AC narrows what counts and reconciles the records that were marked on
  the old reading. It does NOT touch the routing (BP-1100f-5), the non-overridability, the
  authoring-time enforcement (BO-2900g-2-i), or the schema property itself. A coder who
  finds themselves editing generate_ticket_from_ac.py has left this AC's scope.
