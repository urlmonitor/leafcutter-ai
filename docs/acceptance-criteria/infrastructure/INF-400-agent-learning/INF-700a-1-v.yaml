it_requirements:
  - "WHERE IT RUNS: templates/workflows-js/build-feature.js, inside driveTicketPhases' phase loop, at the generic phase dispatch when the phase is commit. build-feature.js moves from excluded to wired in knowledge_routing_wiring."
  - "SERIALISATION: build-feature.js starts every ticket of a batch chunk concurrently, so the stage, commit and observe of one ticket run inside a drive-level lane (a promise chain) that admits one ticket at a time. Phases other than commit are not serialised by it. This is the in-workflow counterpart of the commit-phase lock ticket-supervisor holds (INF-700a-1-iv)."
  - "SHARED CODE: the E2 engine injects no module loader (ADR-030), so the classifier and the lane live in build-feature.js itself, as fast-lane-ship.js, quick-fix.js and build-epic.js each carry their own copy. The CLI call reuses the file's existing repoFactsCall envelope reader."
  - "Fail-open per ADR-034."
