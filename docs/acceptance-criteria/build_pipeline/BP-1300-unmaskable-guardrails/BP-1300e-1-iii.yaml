id: BP-1300e-1-iii
components:
  - precommit_hooks
  - commit_guardian
title: "When the linter cannot run, the commit is refused with the reason and how to fix it — it is never shown as passed"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Scenario: The linter is not installed
    Given the linter is neither importable as a module nor available as a command,
    And a staged change to an in-scope Python file,
    When the commit is attempted,
    Then the commit is refused,
    And the refusal states that the lint check could not run because the linter
      is not installed, and gives the install instruction,
    And no output of the commit presents the lint check as passed.

  Scenario: The linter is installed but cannot start
    Given the linter is present but exits with a startup error before inspecting
      any file,
    When the commit is attempted with a staged in-scope Python file,
    Then the commit is refused, naming the startup error.

  Scenario: The lint configuration cannot be read
    Given the repository lint configuration is present but malformed,
    When the commit is attempted with a staged in-scope Python file,
    Then the commit is refused, naming the configuration file and that it could
      not be read,
    And the check does not fall back to the linter's built-in default rules,
      because a verdict under different rules is not CI's verdict.

  Scenario: Nothing in scope is staged
    Given a staged change that touches no in-scope Python file,
    When the commit is attempted,
    Then the commit completes,
    And the check reports that it had nothing to inspect, never that it inspected
      files and found them clean,
    And this holds even when the linter is not installed, because there was
      nothing for it to examine.

  Scenario: An internal defect in the check itself is visible
    Given the check's own logic fails for a reason unrelated to the linter (for
      example, it cannot list the staged files),
    When the commit is attempted,
    Then the output states that the lint check could not check this commit and
      why,
    And it never states that the lint check passed.
