estimated_complexity: L
it_requirements:
  - "TaskInput, GoalPayload, exported goal_request schema, CLI input, host/direct adapters, intent projection and effective-goal handling must consistently admit 1..16000 characters."
  - "Goal preservation includes leading/trailing whitespace and Unicode; inherited string stripping or legacy 4000-character slicing must not rewrite an admitted goal."
  - "Resume clarification remains a separate channel; it must not prepend-and-truncate the original goal or silently drop a required clarification."
test_required: true
