estimated_complexity: S
it_requirements:
  - "The two-toggle check must read the live toggles at authoring time (feature frontmatter live_surface_test AND project skills_config live_surface_testing.enabled); it must not hardcode an assumption about either."
  - "Must mirror the existing user-surface-smoker: needed insertion rule so the two gating patterns stay structurally consistent and maintainable."
  - "Must add the entry only when BOTH toggles are true; no partial-toggle combination may produce it."
  - "The emitted agent key must be spelled exactly `live-surface-tester`, in parity with the ticket-supervisor Spawn Allowlist (BO-2100a-2) and the build-ticket.js phaseOrder (BO-2100a-3)."
