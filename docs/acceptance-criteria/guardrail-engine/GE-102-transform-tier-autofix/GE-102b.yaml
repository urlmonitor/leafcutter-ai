created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  Given a staged file whose frontmatter has a title but no description field,
  When the description-field transform hook runs at pre-commit time,
  Then it writes a stub description derived from the title in place,
  And it re-stages the corrected file,
  And it exits with code 0 so the commit proceeds,
  And when a description is already present it makes no change and exits clean,
  And it never blocks the commit.
