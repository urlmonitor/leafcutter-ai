notes: |
  FLOW NODES: split-report (step); split-reject (branch) for the plain rejected
  report.

  SETTLED: outcomes shown are pending, decided, answered and not run, each with a
  link to its child decision record or research result. The run report's split
  section has one line per part, starting with the part id and naming its
  outcome. Edited and left-out parts are visible as such.

  OPEN, for the PO (flow-author open point c): the hand split. The progress
  mockup and the mock record dcp-reusable-criteria-by-hand show a split made
  by hand outside the kernel (proposed_by claude_code), including a part
  "settled by a human". The flow has no node for it. Its report_lines are [],
  because the run report knows nothing of a split made outside the kernel. The
  PO recommends treating the hand split as historical evidence only: the kernel
  does not record hand splits, and settled_by_human is not offered in the kernel
  path unless the user asks for it. If the user wants hand splits recorded or
  shown, the flow-author must add a node first.

  DOCS: reading split progress and the report section belongs in the kernel
  how-to (how-to).
