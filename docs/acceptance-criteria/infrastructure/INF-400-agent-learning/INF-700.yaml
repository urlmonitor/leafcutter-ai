title: "Raw agent emissions are routed, recorded, and available for analysis"
component: infrastructure
level: L0
status: active
criteria: |
  The plumbing that turns agent output into structured, queryable records.

  Agents emit learnings and telemetry through a standard channel. A dedicated
  harvester routes each emission to the correct knowledge surface. The
  telemetry emission script is deployed and functional, and supervisor
  templates call the feedback pipeline at every adjudication point. The
  result: a complete, machine-readable record of what happened during every
  drive — available for trend analysis, retrospectives, and continuous
  improvement.
