notes: |
  THE USER'S INSTRUCTION, VERBATIM IN SUBSTANCE AND ENCODED AS A PROPERTY RATHER
  THAN AS GUIDANCE: the warning is the live-code hazard staying visible, and it is
  resolved by deciding the tool's fate — never by removing the declarations. A rule
  that lives only in prose is not falsifiable, and the cheapest way to make this
  notice stop is precisely the forbidden one. That asymmetry is the whole reason
  this is its own record.

  WHY THIS IS NOT GE-128c. A name resolving to NOTHING is a missing declaration
  (GE-128c). A name resolving to a RETIRED requirement resolves to something, and
  to something the project deliberately decided about. Collapsing the two makes the
  correct response to a retired requirement "delete the name", which is the exact
  outcome this record forbids. Keep them apart at decomposition.

  THE LIVE INSTANCE, AND IT IS THE MOTIVATING ONE. Six declarations in the test
  file for a store-writing tool point at records being retired in an open, unmerged
  pull request. Once that lands the notice fires. The code is not dead — it is
  deployed into every consumer project — so the honest answer is the third one:
  give it a current requirement. ACS-1600 is that requirement and the two trees
  touch here and nowhere else.

  THE GENERAL RULE WORTH CARRYING BEYOND THIS TREE. Retiring a specification is not
  the same act as retiring the thing it specified. When the two come apart, some
  signal has to survive the gap, and the declaration on a test is often the only
  one. Anything that makes such a signal cheap to extinguish converts a decision
  the project still owes into a decision nobody remembers was pending.

  WHAT THIS RECORD DOES NOT DEMAND. It does not demand the notice BLOCK. Whether a
  retired-requirement declaration refuses a commit or announces itself is a
  per-stage decision to be taken explicitly at decomposition — this component has a
  standing rule that there is no blanket default on block-versus-announce, and the
  unit of THIS rule is visibility, not blocking. What it does demand is that the
  notice cannot be ended by editing the test, and that whatever channel carries it
  is one a person actually sees rather than one that scrolls past.

  MANDATORY NEGATIVE ARM. Every positive reading is satisfied by a gate that
  announces nothing and by one that announces everything forever. Assert in one
  run: a test naming a retired requirement produces the notice; the same test with
  the declaration DELETED does not make the project quieter — it registers as an
  undeclared test under GE-128a, so the two records compose and the escape is
  closed from both sides. That composition is the real acceptance and should be
  written as one scenario rather than two.
