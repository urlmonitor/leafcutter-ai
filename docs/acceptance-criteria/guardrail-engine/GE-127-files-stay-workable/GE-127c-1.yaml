notes: |
  NO EXTENSION IS NAMED HERE, AND THAT IS A USER DECISION OF 2026-09-01, NOT AN
  OMISSION. Which kinds of file to cap was escalated as a scope call and the
  decision was to author the principle and pin the concrete list at technical
  enrichment. This record therefore says that the measured kinds are DECLARED and
  DISTINGUISHABLE FROM PASSING; it does not say which kinds. An amendment that
  substitutes a list of extensions into any clause above is at the wrong altitude
  and must be rewritten rather than approved. The same rule governs the doc_links
  above, which is why none of them names one either.

  THIS RECORD WAS PROPOSED AS AN L3 AND IS AUTHORED AS AN L2, FOR TWO REASONS.
  Mechanically, the store's id regex admits no roman-suffixed child of an L1, so a
  `GE-127c-i` would fail the id-format check outright and an L3 would need an L2
  parent that does not exist. Semantically it is not an edge case of anything: it
  is the first-order discoverability arm of GE-127c's own promise. Recorded rather
  than silently changed.

  WHAT THE THIRD CLAUSE IS FOR, AND WHY IT IS THE ONE TO BUILD FIRST. It is the
  only clause here that cannot pass on an implementation whose scope is written
  into itself, however that set is spelled — it changes the scope in force and
  requires the stated set to move with it. Everything else here is satisfiable by
  a well-written constant. The failure mode this whole L1 is designed against is a
  scope list written when the project used two kinds of file and never revisited
  as the project grew into others, with the gap invisible because a file nobody
  checks produces no finding. A criterion that fixes today's gap by naming today's
  kinds recreates that failure the next time a kind is added.

  NAMED MUTATION — MANDATORY, EXECUTE IT. "A staged file of a kind that was not
  measured is never reported as being within its permitted length" asserts an
  absence, and on today's implementation — which reports nothing at any commit —
  it is green on arrival. MUTATION: report every staged file in the
  within-permitted-length summary regardless of whether its kind was measured.
  Under that injection this clause must go RED, naming the out-of-scope file, and
  return to green on revert. Without the injection the clause is satisfied by a
  standard that reports nothing about anything.

  THE FOURTH CLAUSE HAS A REAL RED BASELINE AND NEEDS NO MUTATION. It is false
  today: the standard carries a branch of dividing advice for a kind of file that
  its configured scope does not contain, so no refusal can ever produce that
  branch. Assert it by enumerating the distinct forms of advice the standard can
  produce and requiring each to be produced by some file of a measured kind. Two
  reconciliations satisfy it — bring the kind into scope, or remove the advice —
  and this record deliberately takes no position on which. It only forbids the
  present state, in which the advice exists and can never be reached, because
  advice that cannot be reached is a claim of coverage that is not there. That is
  the same anti-precedent this component already carries a scar from, in which a
  gate documented as dispatching a triage agent does not, and every author who
  read the line believed they were covered.

  THE ARM MOST LIKELY TO BE DROPPED, RECORDED SO IT IS NOT. Anything genuinely NOT
  first-party — content the project did not author and does not maintain — stays
  out of scope, and the exclusion must be stated positively rather than left to a
  path pattern nobody revisits. It is not written as a clause here because it
  belongs with the scope decision the IT PO pins, and a criterion asserting it
  would have to name paths to be testable. Flagged as an obligation on that
  decision, not as work absorbed into this record.

  BOUNDARY WITH GE-127d, WHICH IS THE EASIEST ONE IN THIS TREE TO BLUR. This
  record is about the run STATING what it measured, so that unchecked is not read
  as passed. GE-127d-1 is about the PUBLISHED description of the scope and the
  scope actually enforced agreeing. A run that states its measured kinds perfectly
  while the reference documentation describes a different set still fails
  GE-127d-1; a perfectly documented scope whose runs say nothing about what they
  looked at still fails this one. Neither closes the other.

  BOUNDARY WITH GE-127b. Adding a kind of file to scope activates GE-127b-1's
  ratchet over a population that has never been measured against any limit. That
  is a consequence of the enrichment decision and belongs in it; it is not a
  behaviour of this record.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect.
