notes: |
  Scope boundaries honoured. INF-400b-1 owns that a mandatory capture step
  exists in the v3 templates and fires before exit; this AC owns that the step
  it fires resolves to something and produces content. INF-400b-2 owns the
  event's field schema as it stands; this AC adds the requirement that the
  record carry the learning text, which today's six-field receipt does not —
  flag for governance rather than a silent contradiction. INF-400c-4 owns
  which file the record lands in, so no sink path appears here. INF-400c-5
  owns the entry_kind vocabulary, so no kind values appear here.

  Current state (verified 2026-08-26): the step's steps 2 and 3 direct the
  agent to load route-learning and capture-learning, neither of which exists
  in templates/ or .claude/, so the warning branch is the only reachable path.
  ADR-034 section 2 item 3 retired both names; satisfying this AC requires
  that strike, and must not reintroduce either name.
change_target: prompt
