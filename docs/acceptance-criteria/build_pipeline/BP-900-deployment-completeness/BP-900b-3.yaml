notes: |
  DEMOTED done -> todo by ac-audit, 2026-08-17. The previous covered_by claim
  ("unit_tests/test_build_guard_real_package.py") did not hold up.

  The implementation IS present and wired: _check_script_reference_guard is
  called from scripts/build.py main() at lines 1518-1520, before _run_phases,
  so no output is written when it trips. What is missing is any test that
  asserts it.

  Every test that touches the guard at build level MOCKS it to return 0
  (unit_tests/test_build_package_version.py,
  unit_tests/test_build_version_wiring.py), so they stay green whether or not
  the `return 1` propagation exists at all. The analogous wiring test,
  test_main_calls_tracked_source_guard_when_sources_untracked, mocks the
  sibling tracked-source guard (BP-900f), not this one.
  test_guard_exits_1_on_broken_ref covers the guard function's own return value
  but not the build-level exit code, and nothing asserts the AC's "no partial
  deployment is written to the target" clause.

  Delete the main() wiring today and the suite stays green — which is the
  definition of the phantom-done this AC is supposed to prevent.

  To close: assert build.py main() returns non-zero (without mocking the guard)
  when a template references an undeployable script, and assert the target
  directory receives no deployed output on that path. See this AC's test_spec.
