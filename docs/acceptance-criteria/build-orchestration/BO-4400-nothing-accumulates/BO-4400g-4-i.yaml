it_requirements:
  - >-
    NO FALLBACK AFTER A REFUSAL: once the door refuses, a flow stops clearing. It does not retry with a
    discard token, a forced or by-location request or --delete-remote-branch, and it does not delete the
    folder directly, run git worktree remove or send another agent. The door's refusal object appears
    unchanged in the flow's final result, and the workspace is reported kept. The one relay lives in the
    shared helper of templates/workflows-js/_shared/workspace-answer.js.
  - >-
    DERIVED SET: the flows, skills, commands and agent instructions checked are derived from what the install
    deploys (the deployed layout), never from a hand-written list, and no surface is exempted by name.
    Workflows are run under the engine harness. Prose surfaces are exercised by executing the clearing
    command they publish, the pattern BO-4400a-3 uses.
  - >-
    RECORDER DOOR: the door is replaced by a recorder that logs each request and can be told to refuse. It
    covers every maker verb that clears (remove, and the per-work clear-landed of BO-4400g-2 that flows send).
    A workspace that disappears without a recorded request for it fails the check, naming the surface and the
    step.
  - >-
    BUILDS ON, DOES NOT DUPLICATE: BO-4300g-2-i checks that every removal-capable dispatch carries an
    authorization, and BO-4400a-3 checks that the hand-run surfaces publish only the door's command. This
    record adds only the outcome checks: nothing vanishes without a recorded door request, and refusals are
    never worked around. It extends the same harness (recorded dispatch payloads) and the same deployed-set
    derivation instead of forking them.
  - >-
    THE CHECK PROVES IT CAN FAIL: a fixture flow that deletes its folder directly, and one that retries with a
    discard token after a refusal, are each reported. The real flows are not.
  - >-
    The check reads the deployed layout as a shared_layout_reader (the shared reference layout), spawns no
    build.py and makes no live model call, so it runs in CI.
test_required: true
test_intent:
  - clause: 'every flow''s workspace folder still exists, with its files identical to their state when the clearing request was made'
    needs_test: true
    reason: A flow that falls back to its own deletion after a refusal removes the folder, which only the disk shows.
  - clause: 'every flow''s final result contains the door''s refusal unchanged and reports the workspace as kept'
    needs_test: true
    reason: A refusal that is paraphrased or reported as success hides the unsent work from the person.
  - clause: no flow retried the clearing with a discard token or by any other route
    needs_test: true
    reason: A token retry turns a safe refusal into a loss of work, and the recorder shows every request made.
  - clause: every workspace that disappears during the run disappears only after a recorded clearing request for it
    needs_test: true
    reason: This is the falsifiable form of "no flow carries its own deletion logic", across every deployed surface.
test_spec:
  - name: test_every_flow_keeps_its_folder_when_the_door_refuses_in_use
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      The five flows of BO-4400g-4 are each run under run_workflow_under_e2 as in that record's first scenario
      (pull request merged, nothing unsent), with the shell-runner stand-in replacing the door by a recorder that
      logs every request and answers PROCESS_HOLDS_FILES (workspace in use) to each. After each flow returns the
      workspace folder exists and every file hash equals the snapshot taken when the request was recorded. Needs the
      additive exec bridge of unit_tests/_workflow_engine_harness.py named in BO-4400g-4 (the harness only replays
      static label_responses today), declared in this record's declared_files.
    proves_clause: 'every flow''s workspace folder still exists, with its files identical to their state when the clearing request was made'
    code_file: unit_tests/_workflow_engine_harness.py
    must_catch:
      - a flow that deletes its folder directly after a refusal
      - a flow that retries with git worktree remove or another agent
  - name: test_every_flow_relays_the_refusal_unchanged_and_reports_kept
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      HarnessResult.result of each flow holds the recorder's refusal object equal to the object it sent (all keys, no
      paraphrase) and reports the workspace as kept, not as success. The one relay lives in the shared helper of
      _shared/workspace-answer.js, which shellStepReply and workspaceAcceptAnswer already parse for the ensure step.
    proves_clause: 'every flow''s final result contains the door''s refusal unchanged and reports the workspace as kept'
    code_file: templates/workflows-js/_shared/workspace-answer.js
  - name: test_no_flow_retries_with_a_token_or_another_route_after_a_refusal
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      The recorder holds exactly one request per flow: no second request, no --discard-token, no
      --delete-remote-branch, no by-location (--path) request and no dispatch to any other agent after the refusal.
      Note workspace-answer.js workspaceRemoveCommand today appends --force (which the maker accepts and ignores):
      the recorder classifies it by the maker's own parser, so an accepted-and-ignored --force never reads as a
      forced retry of the name-based request, and the assertion text says so.
    proves_clause: no flow retried the clearing with a discard token or by any other route
    code_file: templates/workflows-js/_shared/workspace-answer.js
    must_catch:
      - a flow that re-sends the clearing with the discard token returned in the refusal
  - name: test_workspaces_disappear_only_after_a_recorded_request_across_the_deployed_set
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: behavioral
    angle: criterion
    description: >-
      Marked @pytest.mark.shared_layout_reader and requesting shared_reference_layout (no build.py spawn). The
      flows, skills, commands and agent instructions are derived from the deployed layout (never from a list, no
      surface exempted by name, ship's SKILL.md included by executing the clearing command it publishes). Each
      workflow is run under the harness with a recorder door and a real temporary workspace per surface. For every
      workspace that vanishes the recorder has a request for it before it vanished; a failing case names the
      surface and the step. Fixture flows prove the check can fail: one that rmtree()s its folder directly and one
      that retries with a discard token after a refusal are each reported, and the real flows are not.
    proves_clause: every workspace that disappears during the run disappears only after a recorded clearing request for it
    code_file: unit_tests/_workflow_engine_harness.py
    must_catch:
      - a flow that deletes its folder directly (fixture flow)
      - a flow that retries with a discard token (fixture flow)
  - name: test_refused_flow_run_is_reachable_through_the_deployed_workflow
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      run_workflow_under_e2 on the deployed quick-fix.js (the shortest flow) with the refusing recorder reaches the
      clearing dispatch and relays the refusal, proving the relay is wired and not merely defined.
    proves_clause: 'every flow''s final result contains the door''s refusal unchanged and reports the workspace as kept'
    code_file: templates/workflows-js/quick-fix.js
