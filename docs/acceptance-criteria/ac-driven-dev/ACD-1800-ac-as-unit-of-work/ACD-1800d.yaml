notes: |
  CARRY-FORWARD of the still-valid ACD-400b-2 ("generator writes an implemented_by
  back-reference into the source AC"). ACD-400b-2 remains ACTIVE and is NOT
  superseded; this L1 reframes the same guarantee so it attaches to AC-level work
  derivation rather than to ticket wiring. Under the AC-as-unit-of-work model the
  back-reference points from the AC to whatever delivered it (per Concept A/B), not
  from a wired ticket. Keep ACD-400b-2 as the concrete L2 behaviour; this L1 records
  its home under the new model.
