notes: |
  THIS IS THE HIGHER-LEVEL STATEMENT, AND IT IS NOT THE ACD-400b ONE. A narrow,
  generator-local requirement — "never silently discard an authored test_spec" — is
  being authored concurrently under ACD-400b by another author. Assume it exists and
  assume it stays generator-local. The two are related and neither substitutes for
  the other:
    - Theirs is about ONE FIELD inside ONE PROGRAM: an authored test_spec must not be
      thrown away.
    - Mine is about the ROUTING DECISION AS A WHOLE: whatever kinds of proof were
      decided to be necessary, if the pipeline cannot carry one of them through, that
      must be announced and must not be reported as readiness. It bites on demands
      nobody authored a field for — including a judged demand the vocabulary cannot
      yet express and a judged demand with no harness entry to land in.
  The fifth clause exists specifically to keep the two from being collapsed: an
  implementation that stops discarding authored test_spec entries and stops there
  still fails, because a judged kind can go uncarried while the authored
  deterministic field survives perfectly. An implementer must not close one and mark
  the other done.

  WHY THE FOURTH CLAUSE IS THE SHARPEST ONE. Verified 2026-08-18: the readiness
  report's checks #4 (line 2776) and #5 (line 2783) are gated on `is_code_ac`, so for
  judged work they are not failed — they are never attempted, and their absence is
  invisible in the output. The verdict at line 2801 is derived from the lines that
  were recorded, so a report missing half its checks still reads READY. An
  un-attempted check that leaves no trace is indistinguishable from a passed one,
  which is the identical failure BO-2400g-2 names for review phases: a check that is
  present but inert reads as coverage and is worse than an absent one. The remedy is
  the same — name what was not performed, and why.

  WHY THE THIRD CLAUSE IS NOT REDUNDANT WITH c-2. c-2 governs how the answer is
  DERIVED. This clause governs how a particular answer — "none required" — may be
  REPORTED. They fail independently: a correctly derived "none required" that the
  report cannot distinguish from "we never asked" leaves the operator with today's
  green light, and a badly derived answer reported with perfect transparency is still
  the wrong answer. Today the pipeline fails both, at the same line.

  WHY THIS IS AN L2 AND NOT AN L3 UNDER c-2. It is not an edge case of the routing
  decision; it is a separate obligation on the pipeline's reporting, and it applies to
  demands c-2 never made — for instance a judged demand a human authored by hand
  before any routing exists. It also has to hold while c-2 is unbuilt, which an L3
  under c-2 could not.

  DEPENDENCY REASONING.
    - depends_on TQ-200c-1: "a demanded kind of proof was not carried through" is only
      a statable finding once kinds exist. Before c-1 there is one kind and the
      finding degenerates.
    - No edge to c-2, c-3 or c-4, deliberately. This AC must hold for demands from any
      source, including hand-authored ones, and is testable with a hand-authored
      unhonourable demand. Making it depend on the router would leave the loudness
      guarantee unbuilt for exactly the period in which half-built routing is most
      likely to drop things quietly. Recorded so the it-po does not add the edges on
      aesthetic grounds.

  BOUNDARY. This AC produces a REPORT, not a merge gate. Whether an announced gap
  blocks CI belongs to TQ-200b-4; whether an unreachable eval set is a gap belongs to
  TQ-200c-4-i. What is required here is that the pipeline stops describing the absence
  of a proof demand as a passing check.
