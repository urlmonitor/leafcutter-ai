notes: |
  A bare total is not enough: 180 of 180 means nothing if the scope silently skipped a
  whole folder. Deliberate exclusions are legitimate and expected — the requirement is
  that each be DECLARED with a ground, not that they be eliminated.

  The sum clause is what makes the method mechanically checkable and is the input to
  the reconciliation in ACS-1100c-1: covered + declared exclusions must equal the
  total, and any residue is the shortfall.

  SCOPED CALLERS (2026-08-13, expert review). All eight AC pre-commit hooks resolve
  their work set from git diff --cached. Without the outside-the-requested-scope ground
  every commit would trip the ACS-1100c-1 halt with roughly 2,783 records unaccounted
  for. The ground makes them honest rather than broken — but ONLY together with the
  dual-total clause. A scoped answer that reported "3 of 3" without the store total
  would be the exact defect ACS-1100 exists to remove, wearing a scope label. Both
  figures, always.

  The "travels with the answer" clause exists because a method written only to a log
  cannot be inherited by a downstream verifier (ACS-1100d-1).

  ==========================================================================
  STALENESS RULING (2026-08-18, BA) — THIS L1 OWNS IT. ACS-1100c DOES NOT.
  ==========================================================================
  The question the PO left open on ACS-1100b (2026-08-18 notes: "the AGE of the figure
  is declared but nothing acts on it ... decide at L2 whether staleness is a b-concern
  or a c-concern. Do not leave that unassigned.") is settled here: STALENESS IS A
  b-CONCERN. The method record must declare the age; nothing halts on it. The matching
  negative is recorded ONCE, in ACS-1100c's notes — deliberately in one place, because an
  unowned question between two L1s is exactly how this stayed unowned for five days.

  Four reasons, in order of weight:

  1. ACS-1100c's trigger set is deliberately singular and has already been defended
     once. ACS-1100d-1's notes record the identical decision on the identical pressure:
     a missing coverage figure "does not type-check" as an ACS-1100c-1 halt because
     c-1's only trigger is an arithmetic shortfall, and rather than widen that trigger
     set the BA gave d-1 its own halt. Age is a third, TIME-based trigger with no
     arithmetic to fail. Routing it to c would repeat the mistake that was already
     rejected, and would blur the reconciliation contract ACS-1100c-2 mirrors.

  2. A stale figure is not a violation, and c's posture is halt-on-a-REAL-violation. A
     recorded constant measured five days ago may be exactly right. Halting on it would
     withhold a correct, fully reconciled answer on the strength of a clock.

  3. Any halt needs a threshold, and there is no defensible number. Whatever is chosen,
     every consumer of a static recorded figure trips it eventually with no way to clear
     it at read time — a reader of a prose note cannot re-measure. That is the same
     "constant noise, so it gets switched off" failure ACS-1100c-1-i argues against for
     the could-not-classify bucket. Declaring the age costs nothing and never has to be
     switched off.

  4. Age is definitionally part of the method: b's subject is what was counted, how, and
     under what rule. "As of when" belongs beside "over what root" and "under what
     inclusion rule", not in a separate gate.

  WHAT THE RULING DOES NOT SAY. It does not forbid a future consumer from deciding that
  a figure of a given age is unusable — a verdict cap on an old figure would be an
  ACS-1100d concern (what a downstream verdict may claim), not an ACS-1100c one. It is
  not authored here and must not be assumed.

  Evidence the clauses are grounded, not hypothetical: KM-ADM-005 reports 244 of 607
  (2026-08-13, all levels, identifiers quote-stripped before joining); TQ-400 reports
  240 of 641 (2026-08-17, finished L2/L3 records only); TQ-400d-1's own scale note
  reports 259 of 641 (2026-08-17). Three figures for one pile. Every one of them is
  defensible; none of them is reproducible from what is written next to it. Provenance
  plus inclusion rule plus normalisation is precisely the missing set.
