notes: 'EXECUTED BY THE DRIVING SESSION, NOT BY A TICKET-PHASE AGENT. The S1 data run is an explicit build step the
  driving session performs itself: (1) one isolated case-drafting dispatch writes the case and holdout files with no
  expected outcomes; (2) two independent reviewer dispatches, each started from a fresh context with no shared
  transcript, read Git bytes at the pinned SHA and each write one judgment file; (3) a disagreement goes to the user as
  adjudicator, or the case is dropped; (4) the deterministic merge writes the oracle; (5) after the composition check
  (KM-500a-4-iv) and the provenance check (KM-500a-4-v) pass or are explicitly limited, the set lock is written and
  committed before any scored run. No ticket-phase agent can do this: sub-agents run at depth 1, and the coder and
  test writer that build the runner are not independent of it. Until this run is done, KM-500a-4-iv and KM-500a-4-v
  cannot be marked done, because their tests must pass on the real S1 files, not on fixtures. That gating runs in the
  opposite direction to depends_on (this record needs the check code from -iv and -v first), so it is stated here and
  not as a depends_on edge, which would form a cycle. Adjudication is by the user only; KM-500a-4-v it_requirements
  also allow a third separate dispatch as adjudicator, a difference the IT PO should reconcile. The file names in
  KM-500a-4-iv and KM-500a-4-v declared_files (cases.json, holdout.json, reviews/reviewer-a.json,
  reviews/reviewer-b.json, adjudication.json, oracle.json, set.lock.json) are the files meant here. assigned_agent and
  technical fields are left to the IT PO. Draft. IT PO 2026-11-17: reconciled. Adjudication is by the user only, and
  the third-dispatch option was removed from KM-500a-4-v it_requirements. The seven data files moved from the
  declared_files of KM-500a-4-iv and KM-500a-4-v to this record, because those records only read them; policy.json stays
  with KM-500a-4-iv, which transcribes the stated minimums and thresholds. assigned_agent research-agent names the
  dispatched agent type, not a ticket phase; the driving session runs the step. KM-500a-4-vi, -vii and -viii now expect
  the frozen files from this record (the BA adds the matching depends_on edges). The proof of this record''s clauses is
  the KM-500a-4-iv and KM-500a-4-v check code run over the real committed files; the test design is left to the
  test-designer. BA 2026-11-17: change_target is config, the closest enum value for committed non-executable data files read by the checks; code would route test-writer and test-runner onto a record that writes no code, and no other value names data.'
