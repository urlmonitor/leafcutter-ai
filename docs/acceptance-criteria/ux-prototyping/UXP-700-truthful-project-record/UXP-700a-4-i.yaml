  - ux_prototyping
level: L3
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the build's from-scratch record check is passing,
  When exactly one file that the checker reads before checking begins is removed from what the
    install writes,
  Then the build fails and the failure names that file,
  And no other check in the build changes its verdict,
  And restoring the file returns the build to passing with no other change.
