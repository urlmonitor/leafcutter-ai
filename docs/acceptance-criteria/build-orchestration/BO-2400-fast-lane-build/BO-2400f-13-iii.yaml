id: BO-2400f-13-iii
components:
  - build_orchestration
title: "The occupied-workspace refusal costs one check, holds no claim, and touches neither store nor occupant"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run that refused because the workspace it resolved to was already
    occupied,
  When the run's ending is inspected,
  Then it meets the same inertness standard BO-2400f-12-i already states for the
    pre-work refusal — the acceptance-criteria store is left as it was found, no
    acceptance criterion is claimed, nothing needs releasing, and the release step
    (BO-2400f-10) is not reached,
  And it meets that standard from an earlier point in the run than BO-2400f-12-i does,
    because this refusal comes before the connected set is even resolved: at the
    moment it is issued, no agent has been dispatched, no set has been resolved, and
    the operator has paid for one check.

  Given the same refusing run,
  When the occupant that was sitting at the location is examined afterwards,
  Then it is exactly as the run found it: the run did not enter it, alter it, or take
    it away,
  And the branch that occupant had checked out is still checked out in the same place,
  And no new branch, and no new workspace, exists anywhere as a result of the run.

  Given the same refusal issued twice against unchanged conditions,
  When the two endings are compared,
  Then both name the same occupant for the same reason, and nothing about the
    repository differs between them — refusing is not a transition, and repeating it
    costs only the check.
depends_on: [BO-2400f-13]
