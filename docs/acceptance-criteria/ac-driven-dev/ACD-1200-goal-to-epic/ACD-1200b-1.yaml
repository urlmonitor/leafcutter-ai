criteria: |
  Given goal ACD-050 has 5 leaf ACs beneath it:
    - ACD-050a-1 (readiness: approved)
    - ACD-050a-2 (readiness: approved)
    - ACD-050a-2-i (readiness: draft)
    - ACD-050b-1 (readiness: reviewed)
    - ACD-050b-2 (readiness: approved)
  When /build-ac is invoked with --ac ACD-050,
  And the tree traversal completes,
  Then the system outputs a readiness report:
    "3 of 5 leaf ACs are approved. 2 ACs need approval:
      - ACD-050a-2-i (readiness: draft)
      - ACD-050b-1 (readiness: reviewed)"
  And the report appears BEFORE any ticket generation begins
  And the user is prompted with a choice before proceeding.
