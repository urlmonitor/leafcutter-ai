title: "Reference documentation states what a claimed kind of proof does and does not mean"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the kind-of-proof claim and the promise-versus-claim check are in place,
  When a reader consults the project's reference documentation for them,
  Then one reference page states how a test states which kind of proof it was
    written to give, and that this axis sits alongside the existing coverage
    statement on the same tests rather than replacing it,
    And it states the two consequences separately and side by side: the existing
      axis decides which FAILING tests are treated as blocking, and the new axis
      causes a refusal only when a promised kind has no test claiming it,
    And it states in its own words that a claim is evidence a proof was PROMISED
      and ANSWERED and is never evidence that the work is reached when the product
      runs, naming where that question is settled instead,
    And it states that a claim pasted onto an unrelated test is accepted by the
      check by design, and why closing that hole here would be the wrong place to
      close it,
    And it states that the seam rule's answer, including the reasoned "no seam
      applies", is a required part of the hand-off record.
