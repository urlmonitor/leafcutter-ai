criteria: |
  Given 4 leaf ACs form a chain:
    - ACD-050a-1 (no AC-level depends_on to other leaves)
    - ACD-050a-2 (depends_on includes ACD-050a-1)
    - ACD-050a-3 (depends_on includes ACD-050a-2)
    - ACD-050a-4 (depends_on includes ACD-050a-3)
  When tickets are generated for all 4,
  Then the ticket for ACD-050a-2 depends_on the ticket for ACD-050a-1
  And the ticket for ACD-050a-3 depends_on the ticket for ACD-050a-2
  And the ticket for ACD-050a-4 depends_on the ticket for ACD-050a-3
  And the numeric prefixes on ticket filenames reflect this order:
    01 < 02 < 03 < 04
  And the supervisor can build them sequentially without consulting the AC store.
