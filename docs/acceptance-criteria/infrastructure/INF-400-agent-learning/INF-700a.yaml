id: INF-700a
readiness: draft
priority: medium
components:
  - infrastructure
title: "Captured learnings reach their knowledge surface without a manual run"
component: infrastructure
level: L1
status: active
work_status: todo
criteria: |
  Capture completes on its own -- and says so plainly when it has not.

  A learning an agent captures becomes readable knowledge on its surface as a
  normal consequence of the work finishing, with nobody having to remember to
  run anything. The routing step has a defined, owned point at which it runs.
  Which point that is -- the end of a drive, finalization, a schedule, or
  something else -- is a design decision for the BA and IT PO and is
  deliberately not fixed by this criterion.

  When it has not run, that is something a person can find out by asking,
  rather than something discovered months later. A loop that is quiet because
  every learning has already been written down and a loop that is quiet
  because nobody ever set it going must not look alike: anyone standing in a
  project can establish whether captured learnings have in fact been reaching
  their surfaces there, and "this has never happened here" is an answer the
  system gives plainly rather than dressing it up as a clean result. Until the
  trigger exists, every surface that documents this loop states plainly that
  capture is manual: no document may imply an automatic capture that does not
  happen (ADR-034, "Until the harvester has a caller, capture is not automatic
  and any documentation implying otherwise is wrong").

  Note for BA: scope here is the invocation/trigger question only. The sink-path
  mismatch, the entry_kind vocabulary, and silent-discard behaviour are already
  covered by the INF-400c L2/L3 set -- do not restate them. In particular
  INF-400c-2-ii covers one individual event that cannot be routed, whereas the
  visibility wanted here is whether the routing step has run in this project at
  all. That visibility must not be re-sited onto the count of learnings still
  waiting: since INF-700c-1 and INF-700c-2, a record carrying no learning is not
  outstanding, so that count reads the same for a healthy loop and for one with
  no caller -- and it is produced only by a run, which a loop with no caller
  never has. Recreating a non-zero waiting count to carry the signal is
  forbidden by INF-700c's hard constraint.
