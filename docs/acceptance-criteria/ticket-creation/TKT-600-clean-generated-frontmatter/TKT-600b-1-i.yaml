risk_surface: contract_boundary
notes: |
  WHY THIS IS NOT PARANOIA. TKT-600b-1 makes the phase record a function of the ticket's
  location. That is only sound while the location is known when the record is written.
  This project has already shipped the opposite: TKT-600a-1's own amendment records that
  the dangling ticket depends_on references came from a later step renaming generated
  files to their NN_ prefix AFTER depends_on had been written, filed as KI-ACD-018. The
  identical seam would silently defeat TKT-600b-1: the generator writes a correct record
  for the location it was told about, a later step moves the file into an epic folder,
  and the drive halts exactly as before while every test of TKT-600b-1 stays green.

  A LOUD REFUSAL IS PREFERRED TO A DEFAULT. Defaulting to the non-epic answer reproduces
  today's blocker; defaulting to the epic answer would strip the pull-request phase off
  standalone tickets, which TKT-600b-3 forbids. There is no safe guess, so refusing is
  the behaviour, and it surfaces the ordering problem at generation time instead of at
  drive time.

  LEFT FOR THE IT PO. Whether "settled" is established by the caller passing a resolved
  destination, by generation being moved after placement, or by a post-move
  re-derivation is a technical choice this criterion does not make. The doc_link to the
  ac-driven-dev register is marked `exists` on the assumption KI-ACD-018 is filed there;
  if that register lives elsewhere the link should be re-pointed, not dropped.
