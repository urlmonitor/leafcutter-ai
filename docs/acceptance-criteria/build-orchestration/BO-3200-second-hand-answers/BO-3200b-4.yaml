id: BO-3200b-4
title: "A sequence diagram shows the failure path performing its cleanup and reading the outcome"
component: build-orchestration
components:
  - documentation_system
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader tracing what happens to claimed work when a run stops early,
  When they open the sequence diagram for the failure path,
  Then it shows, in order: the claim being recorded in a store that outlives the run, a later
    step failing, the release being performed by the layer that must guarantee it rather than
    by a specialist, the outcome of that release being read, and both the triggering failure
    and the release outcome appearing in the halt report.

  Given the diagram,
  When it is compared against a real run driven to a failure after the claim,
  Then every interaction it shows occurred in that run, in the order shown, and no specialist
    appears in it as the performer of the release.
