id: UXP-511
title: "Generator inverts flow->AC edges into a by_ac index and rebuilds the reverse indexes"
component: ux-prototyping
level: L2
status: active
req_status: approved
work_status: done
criteria: |
  Given the authored flow->AC edges (step.implements) across every flow,
  When generate_product_truth.py runs,
  Then it inverts those edges into a by_ac map (ac_id -> sorted list of back-references
  carrying flow, node, node_kind, flow_kind, screen, mock_data, entities, source, asof),
  And it rebuilds index.json by_component / by_entity / by_flow from artifacts[] plus the
  flows and mocks on disk,
  And each flow artifact's impl_summary in index.json is synced to the recomputed rollup.
