  - path: templates/scripts/commit_guardian/check_file_size.py
    relationship: modifies
    status: exists
    relevance: >-
      THE CODE IS RIGHT AND THIS IS NOT A DEFECT RECORD ABOUT IT — READ THIS
      BEFORE TREATING ANY CLAUSE ABOVE AS A BUG REPORT. Its recorded change
      history entry of 2026-05-01 states that the check was updated to enforce
      limits on ALL changed files rather than only new ones, deliberately, to
