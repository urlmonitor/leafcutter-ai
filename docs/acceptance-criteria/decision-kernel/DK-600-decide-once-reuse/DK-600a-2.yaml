level: L2
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a decision goal, for example the decision-record question in DK-600a-1,
  When grounding research runs,
  Then evidence is retrieved from the repository, each item carrying an explicit locator: the
    repository-relative file path plus the section or line range it was taken from,
  And Jev reranks the retrieved items before any of them is used as grounding evidence,
  And every grounding evidence item names its locator, so the passage it rests on can be opened
    from the locator alone.
