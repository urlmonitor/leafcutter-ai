test_rationale: |
  The example clause is the only clause in this record that stays alive after the page is
  first written, and it has exactly one honest mechanism: extract the examples from the
  page and run them through the real adjudication. An assertion that named strings appear
  on the page cannot distinguish a correct page from one that was correct a month ago,
  which is the failure mode the clause exists for, and CLAUDE.md's "Gate / Workflow ACs —
  Verify Behaviorally, Not by Grep" forbids it for the behaviour this page documents; it
  would be incoherent to exempt the documentation of that same behaviour. The harness runs
  the engine BO-1800f-2 builds, over git fixtures it builds from the page's own stated
  removal sets, and compares the observed verdict against the recorded one.

  Three of the five descriptors exist because the harness itself is the thing most likely
  to be false-green, and each kills a different way of being so:

    - always passes ............. killed by test_a_page_whose_recorded_outcome_disagrees_
                                  with_the_behaviour_fails, which mutates a recorded
                                  outcome and requires the mismatch to be reported
    - examines nothing .......... killed by test_the_example_harness_fails_when_no_
                                  examples_are_extracted; a page with no parseable block
                                  must fail, not pass quietly
    - examines a biased subset .. killed by test_the_documented_examples_exercise_every_
                                  failure_mode_and_one_delivery, which requires the
                                  OBSERVED outcomes to span all three refusal kinds and an
                                  acceptance

  The fourth is the same pairing argument BO-1800f-2's rationale makes and it is made here
  from run results rather than from page text on purpose: asserting that the page mentions
  three failure modes is a grep; asserting that running its examples produces three kinds
  of refusal and one delivery is a behavioural statement about the documented examples.

  WHAT IS DELIBERATELY NOT TESTED, AND WHERE IT IS ADJUDICATED INSTEAD. The lookup-form
  clause and the enumerated fact list are NOT encoded as string-presence assertions. A
  test asserting that a heading or a phrase appears would be satisfied by a page that
  contains the words in the wrong genre, in the wrong order, or contradicting the
  behaviour — it would convert two clauses that a reviewer can actually judge into a green
  check that certifies nothing, adding a false-green surface rather than coverage (see
  docs/reference/false-green-mechanisms.md). Those clauses are adjudicated by the
  documentation-verifier phase and pr-reviewer reading the page against the criteria, which
  is the correct instrument for "can this be scanned to" and "does this tell the author
  what happened". The record is not weakened by this: its most perishable clause is fully
  machine-checked, and the failure-list clause is partly machine-checked by the coverage
  descriptor above.

  Every fixture needs a real git repository in a tmpdir. The examples must be materialised
  as actual commits carrying actual trailers — a hand-built dict of "declared paths" would
  bypass the trailer parser, which is one of the two surfaces the page documents and the
  one a contributor types by hand.
