id: GE-117e-1
readiness: approved
priority: medium
title: "Guided autofix inserts the correct declaration so the corrected commit proceeds"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-117-code-declares-what-it-serves/GE-117e.yaml"
criteria: |
  Given a commit was blocked because a new file's module docstring does not name a
    component
  And the file's location matches exactly one registered component's directory
    pattern
  When the developer invokes the guided autofix for that file
  Then the autofix inserts the matched component name into the module docstring
  And re-running the guardrail on the corrected staged commit produces a satisfied
    verdict for that module-component declaration

  Given a commit was blocked because a new public symbol or a new decision-history
    entry does not reference an AC
  And the workspace maker recorded the ticket the current branch is being built for
  And that ticket's declared source ACs (its `source_ac` field) name exactly one AC
    id, for example "GE-117e-1"
  And that AC id exists in the AC store
  When the developer invokes the guided autofix for that item
  Then the autofix inserts the reference "GE-117e-1" into the symbol's docstring or
    into the new decision-history entry
  And re-running the guardrail on the corrected staged commit produces a satisfied
    verdict for that declaration

  Given a commit was blocked because a new public symbol or a new decision-history
    entry does not reference an AC
  And the workspace maker recorded the ticket the current branch is being built for
  And that ticket's declared source ACs name no AC id, or name two or more AC ids,
    or name one AC id that does not exist in the AC store
  When the developer invokes the guided autofix for that item
  Then the autofix inserts no AC reference on its own
  And it follows the prompt-instead-of-guessing behaviour of GE-117e-1-i

  Given a commit was blocked because a new public symbol or a new decision-history
    entry does not reference an AC
  And the workspace maker recorded no ticket for the current branch, or the
    recorded ticket file is not present in the workspace
  And the commit message or the branch name mentions an AC id that exists in the
    AC store
  When the developer invokes the guided autofix for that item
  Then the autofix inserts no AC reference
  And it does not take the AC id from the commit message or the branch name
  And it reports that no declared record of the change's AC exists for this
    workspace
depends_on:
  - GE-117e
  - GE-117d-1
