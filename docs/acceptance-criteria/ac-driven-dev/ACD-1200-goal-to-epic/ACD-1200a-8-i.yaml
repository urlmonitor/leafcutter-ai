created_by: "docs/acceptance-criteria/ac-driven-dev/ACD-1200-goal-to-epic/ACD-1200a-8.yaml"
criteria: |
  ACD-1200a-8 requires that a Master_Plan be written and that it carry certain CONTENT. This AC
  adds the requirement that the artifact be committable: the generator must not emit a file that
  the repository's own gate for that kind of file rejects.

  Given the epic generator has produced an epic folder and its Master_Plan, with no hand editing
    of any kind,
  When that Master_Plan is staged and the commit-time frontmatter validation for ticket files
    runs over it,
  Then the validation accepts it,
  And in particular it is not rejected for a missing "title" or a missing "depends_on" — the two
    fields that gate requires and the generated frontmatter omits today.

  And Given the same freshly generated Master_Plan,
  When it is subsequently opened for editing in an authoring session, so the authoring-time
    ticket guard runs over it,
  Then that guard accepts it too, for whatever its own required set is at the time — the artifact
    satisfies every gate that guards a hand-written file of its kind, not only the first one it
    meets.

  And Given a new field is added to a gate's required set,
  When the acceptance above is evaluated again,
  Then it fails until the generated frontmatter carries that field as well — so the generator and
    the gates cannot drift apart unnoticed a second time.

  And the acceptance is never obtained by weakening a gate, by removing a field from a required
    set, or by exempting generated files or Master_Plan files from validation. The artifact is
    what changes.

  Coverage note: covered only by a test that generates a real epic and then RUNS the real gate
  over the real generated file. A test that compares the generated frontmatter against a list of
  field names written into the test is a second copy of the requirement, and it falls behind the
  gate exactly as the generator already has — which is the whole defect. The third clause is what
  makes the coverage durable, and it is unsatisfiable by any test that holds its own field list.
