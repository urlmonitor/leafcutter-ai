assigned_agent: python-coder
estimated_complexity: M
declares_side_effect: true
it_requirements:
  - >-
    BLOCKED ON AN ESCALATED ADJUDICATION — DO NOT IMPLEMENT UNTIL IT IS SETTLED, AND
    DO NOT SETTLE IT FROM HERE. TQ-400b-1's it_requirements state verbatim: "Must not
    demote L0/L1 composite records: the population is leaf L2/L3 records, and
    composites never legitimately reach work_status done." This AC's population IS
    composites, and the second clause is contradicted on the record by BO-2500a-6 —
    itself work_status: done and readiness: approved, criteria opening "Given a
    work_status: done composite AC" — plus the twenty composites measured finished at
    439b9076f. Both records were read and verified during enrichment. The contradiction
    is escalated to the product owner. This AC is enriched on the assumption that
    TQ-400b-1's exclusion scopes to the LAPSED-PROOF cause only (a composite has no
    direct test of its own to lapse, so evaluating it on that axis is meaningless) and
    does not bar demotion on the UNFINISHED-CHILDREN cause. If the adjudication goes
    the other way this AC is BLOCKED, not narrowed. Do not amend TQ-400b-1 from this
    ticket and do not quietly widen TQ-400b-1's exclusion to cover this cause.
  - >-
    REUSE TQ-400b-2'S TWO EXISTING DEMOTION FIELDS — demotion_reason (string) and
    demotion_date (YYYY-MM-DD). No third field, no composite-specific parallel field,
    no list. TQ-400b-4's already-demoted guard reads "demotion_reason present" as the
    signal and must keep working unchanged for a parent demoted on this new cause; a
    parallel field would make every re-run re-demote the parent.
  - >-
    THE RECORDED REASON MUST NAME EVERY UNFINISHED DESCENDANT BY IDENTIFIER, in a
    deterministic order, with none elided. "Has unfinished children" sends the reader
    back to re-derive the tree, which defeats the only purpose the recorded reason
    has. The reason must remain a single scalar string that validate_ac_schema.py
    accepts; if a length cap is unavoidable it must state the total count and must
    still carry every id.
  - >-
    ONE FORMATTING SITE. The reason written to the record and the cause reported for
    that same ac_id in the run report and the inventory must be produced from one
    value at one site (TQ-400b-2's rule), so the record and the report can never
    disagree about why a badge was taken away.
  - >-
    WRITE DISCIPLINE IS TQ-400b-1'S, UNCHANGED: a targeted single-field line rewrite
    (the mark_ac_done.py:164-181 pattern), atomic via temp file then rename, never a
    whole-file yaml.safe_dump round trip. Every field other than work_status,
    demotion_reason and demotion_date must be byte-identical after the write, and
    that must be VERIFIED by diffing the file before and after, not assumed.
  - >-
    NO DESCENDANT FILE MAY BE OPENED FOR WRITING BY THE PARENT'S DEMOTION. The write
    set for one parent verdict is exactly one file. This must hold by construction —
    the writer addresses exactly the single path recorded on the inventory entry —
    not as a check applied afterwards. The tempting shortcut is a tree-wide fix-up of
    the whole branch; it would demote children on no verdict at all, and it is
    unrecoverable.
  - >-
    THE APPLY PATH IS TQ-400b-1'S, behind the same explicit apply flag with preview as
    the default (TQ-400b-5). Do not create a second command and do not add a second
    store walk.
  - >-
    THE DEMOTED PARENT MUST STILL PASS scripts/ac_store/validate_ac_schema.py
    immediately after the write, and a fresh process using the store's own loader must
    return it as unfinished work. The schema root is additionalProperties:false, so a
    sweep whose own output fails the store validator blocks every commit in the
    repository.
  - >-
    ORDERING HAZARD: this behaviour must not ship ahead of TQ-400b-2's schema edit.
    demotion_reason and demotion_date must already be declared in
    config/ac_store_schema.json, and every enforcement point with its own field
    vocabulary must already accept them, before any parent is written.
  - >-
    DOCUMENTATION OBLIGATION, ATTACHED HERE RATHER THAN AS A SIXTH CHILD. The L1's
    child cap is hard and its documentation_triggers are deliberately unset, so this
    obligation rides on the record that creates it. In the SAME change,
    docs/reference/ac-schema.md must describe the unfinished-children cause alongside
    TQ-400b-2's lapsed-proof cause, and must state that a COMPOSITE record can now
    carry demotion_reason — a reader told the field has one cause, and that composites
    are never demoted, will misread every parent this sweep touches.
  - >-
    Must handle errors gracefully per the project error handling policy: a write
    failure on one parent is reported as an error for that parent and must never leave
    the run reporting a successful demotion.
delivers_to:
  - agent: python-coder
    ac_id: TQ-400b-3
    contract: >-
      A demoted parent on disk with work_status todo and status / readiness /
      priority / level untouched, carrying demotion_reason (naming each unfinished
      descendant) and demotion_date, so it satisfies scan_ac_store.py's eligibility
      predicate unchanged and the reason travels with the work into the pickable
      backlog.
  - agent: python-coder
    ac_id: TQ-400f-3
    contract: >-
      A live, discriminating write path in the same run. TQ-400f-3's byte-identity
      control is vacuous unless some record was demonstrably demoted in the very same
      invocation, so this AC owns the positive half of that pair.
  - agent: python-coder
    ac_id: TQ-400f-5
    contract: >-
      The same live write path, for the same reason: TQ-400f-5's refusal to promote is
      only observable in a run whose write path was demonstrably enabled.
expects_from:
  - ac_id: TQ-400f-1
    contract: >-
      Verdict entries {ac_id, path, outcome, unfinished_descendants: [ac_id, ...]}.
      The writer demotes exactly these entries, addresses each by its recorded path,
      carries the named descendants into the reason verbatim, and re-runs no traversal
      and no verdict of its own.
  - ac_id: TQ-400b-1
    contract: >-
      The demotion write site itself — the targeted single-field, atomic rewrite — and
      the apply-flag entry point hanging off the sweep. This AC adds a new CAUSE to
      that mechanism and must not add a second mechanism. Subject to the escalated
      adjudication recorded in this record's first it_requirement.
  - ac_id: TQ-400b-2
    contract: >-
      demotion_reason and demotion_date, already declared in
      config/ac_store_schema.json and already documented in
      docs/reference/ac-schema.md, plus the one-formatting-site rule for the cause.
      This AC writes those same two fields with a different cause; it introduces
      neither a field nor a second recording convention.
  - ac_id: TQ-400e-1
    contract: >-
      The standing false-positive guarantee that authorises any demotion at all: only
      records the sweep reports unproven may be written, one record at a time, leaving
      every other file byte-identical.
