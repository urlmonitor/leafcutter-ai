created_by: "docs/acceptance-criteria/build_pipeline/BP-300-workflow-orchestration/BP-300d.yaml"
criteria: |
  Given a build for a supported Claude Code runtime (config workflows enabled)
    where two source templates define the /build-feature command:
    - templates/commands/build-feature.md (the workflow-invoking command body)
    - templates/workflows/build-feature.md (the 21KB stale prose flow)
  When build.py deploys the command set for the supported runtime,
  Then the deployed commands/build-feature.md is the workflow-invoking body
    (it hands off to the deterministic build-feature workflow),
  And the deployed commands/build-feature.md is NOT the 21KB prose flow from
    templates/workflows/build-feature.md.
