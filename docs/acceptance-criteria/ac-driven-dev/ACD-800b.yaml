criteria: |
  Given an AC has work_status: todo and implemented_by: [],
  And a done ticket shares >= 2 significant title keywords with the AC title,
  And the ticket's components overlap with the AC's component field,
  When the cross-reference audit runs in read-only mode,
  Then it reports the match with confidence: medium,
  And the reason field explains which keywords matched and which component overlapped.
