implemented_by: []
notes: |
  CONTRADICTION FLAGGED, NOT RESOLVED HERE: BO-200b-3 (readiness reviewed, todo) says "retries at
  most 3 times". BO-210c-2 (approved) and the C6 spec say exactly once. This record follows exactly
  once; BO-200b-3 needs an amendment or supersession by its owner.

  MIGRATION RULE: the retry budget is taken from the hardened copy -- precommit-autofix's single
  retry as BO-210c-2 fixed it -- and its regression tests (BO-210c-2-i) run against this step.

  "Fixing" vs "judging" is the check tier the hooks manifest already declares (transform vs
  judgment, GE-102c / GE-120g). Workspaces where the checks cannot run at all are BO-1700's
  (fail closed; graceful no-op where a project has none) and are not re-specified here.

  IT PO 2026-10-14 -- RECONCILED WITH BO-3800a (BrainCandy instruction 2). The single
  fix-and-retry inside one call is the mechanical-autofix class only (a fixing check rewrote a
  named file). A judgement failure handed back whole (BO-4500a-3-iii) IS the BO-3800a handoff:
  the answer carries remedy_handoff.py's remedy sub-object and, for engage-specialist, its full
  payload, so there is one answer shape and one payload builder. LAYERING: shared step =
  deterministic staging, checks and answer; commit agent = runs the step and relays the answer,
  applying an own-context mechanical fix or relaying the handoff (BO-4500a-5-v); depth-0 caller
  (commit.js for /commit, each workflow for its own commits) = engages the specialist on a
  handoff, at most once, then re-offers the same commit (BO-3800a).
