id: GE-120h-1-i
title: "A place the reconciliation could not read is reported as unread, never counted as agreement"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given one of the places a reader consults to learn that a check protects them cannot
    be read, or can be read but cannot be understood, at the moment the reconciliation
    runs,
  When the reconciliation runs,
  Then it names that place and states that it could not reconcile the claims that place
    carries,
  And no check is treated as being in agreement on the strength of a place that was
    never read,
  And the number of advertisements the run states it reconciled excludes the claims of
    that place, so the stated figure never describes work that did not happen,
  And the claims of every place it could read are still reported as usual, so one
    unreadable place does not discard the findings of the others,
  And the run's outcome is distinguishable by whoever reads its output from a run that
    read every place and found them in agreement,

  And given instead that the one list whose entries cause checks to run is itself the
    thing that cannot be read or understood,
  When the reconciliation runs,
  Then the change is refused, because with that list unreadable no claim anywhere can be
    reconciled and a clean result would describe a comparison that was never made.

  Coverage note: exercise both arms by executing the reconciliation as a process against
  a repository in which the named artifact has been made unreadable — permissions removed
  for the cannot-read arm, and content that is not valid in the artifact's own format for
  the cannot-understand arm. Assert on what the process wrote and on its outcome. A test
  that injects an exception into the reader in-process leaves untested the case this
  record exists for, which is a real artifact in a real state.
depends_on:
