options:
  - id: opt.l1_epics_dk500_first
    title: one epic per L1, DK-500 first, then DK-400, one epic at a time
    description: 'Generate an epic per L1 with goal_to_epic.py --ac <L1>: 7 for DK-500 (a-g), then 6 for DK-400 (a-f). Build
      them one after another, each as its own worktree and PR (7 to 12 tickets each), merged before the next starts. ADR-067
      is written by adr-author before the DK-400c epic. Each later epic starts from a main that already holds the earlier
      ones, so shared kernel/capabilities and flow changes never conflict.'
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: human:user
  - id: opt.l1_epics_dk400_first
    title: one epic per L1, DK-400 first, then DK-500, one epic at a time
    description: As the first option, but ADR-067 first, then the 6 DK-400 L1 epics, then the 7 DK-500 L1 epics. The split
      machinery lands first; criteria reuse then runs inside parts that already exist.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: human:user
  - id: opt.two_full_epics_parallel
    title: one epic per tree, both trees in parallel
    description: Generate the two full epics (57 and 50 tickets) and build them at the same time in two worktrees, one PR
      each. ADR-067 is written before the DK-400c tickets run. The trees share kernel/capabilities, kernel/memory, the capability
      registry and the decision-forming flow, so the second PR to merge re-merges main.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: human:user
  - id: opt.two_full_epics_sequential
    title: one epic per tree, DK-500 then DK-400
    description: Generate the two full epics and build DK-500 (57 tickets) to a merged PR first, then write ADR-067, then
      build DK-400 (50 tickets) as a second PR.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: human:user
  - id: opt.added.1
    title: Step 0 prerequisites, then DK-400 in 3 and DK-500 in 4 dependency-checked epics, one at a time
    description: 'Step 0, its own small PR: ADR-067 by adr-author (number re-checked free on main and remotes), main''s failing
      tests recorded by node id, and test_every_host_capability_of_the_design_has_an_operation (in the file DK-400c-1 extends)
      fixed or ticketed. Then DK-400 first (active roadmap phase) in 3 dependency-checked epics built with goal_to_epic --ids:
      E1 = DK-400a + DK-400c without c-5 (17 tickets, merged with split.enabled false); E2 = DK-400b + DK-400d without d-5
      + c-5 (18); E3 = DK-400e + DK-400f + d-5 (15), after which split.enabled returns to the approved default on. Then DK-500
      in 4 epics: E1 = DK-500a without a-3 + b-1, b-1-i, b-2, b-2-i, b-3, b-3-i (13); E2 = DK-500c + DK-500d without d-4 +
      a-3 (17); E3 = DK-500e + b-4, b-4-i, b-5 + d-4 (12); E4 = DK-500f + DK-500g with the live Neo4j tests (15). The DK-500
      build adds a test that a split part run as a decision child goes through reuse-first criteria and charges its grouping
      Jev calls to the part''s budget. One PR per epic, one epic at a time, each merged with the user''s confirmation before
      the next epic''s worktree is created.'
    assumptions: []
    evidence_ids: []
    proposed_by: human:user
    approved_by: human:user
