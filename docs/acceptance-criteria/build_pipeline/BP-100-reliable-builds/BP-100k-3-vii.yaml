    relevance: "The known issue this fixes. It names .claude/.cache only; nested worktrees under .claude/worktrees/ are the larger population (79,338 of 79,365 GAPs in DIAGraph, 2026-10-12)."
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
    - "Ask git for ignored paths with ONE directory-level call (git ls-files -z --others --ignored --exclude-standard --directory). Do not use per-file git check-ignore: it exits 128 'beyond a symbolic link' on consumer layouts whose .claude/agents etc. are tracked symlinks."
    - "Do not switch to a git ls-files allow-list: files reached through tracked symlinks would silently drop out of GAP detection."
    - "Recorded-key reconciliation (drifted / missing / unreadable) must be unaffected; only the unrecorded-file census narrows."
    - "Verify behaviorally: run the gate as a subprocess over a synthesized git workspace and read its GAP lines, RESULT line and exit status."
test_spec:
  - name: test_bp_100k_3_vii_gitignored_and_nested_worktree_paths_are_not_gaps
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "With .claude/.cache/ and .claude/worktrees/ gitignored and .claude/settings.json recorded, unrecorded files under both produce no GAP line and the run exits 0."
  - name: test_bp_100k_3_vii_nested_worktree_skipped_without_git
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "In a non-git workspace, a subdirectory holding a .git file is skipped by the census; files inside it produce no GAP."
  - name: test_bp_100k_3_vii_unignored_stray_still_gaps
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "An unrecorded, non-ignored file under .claude/ is still reported as a GAP and the run exits 2."
  - name: test_bp_100k_3_vii_ignored_dir_holding_recorded_key_still_censused
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "An ignored dir containing a recorded key is still walked: an unrecorded stray beside it is a GAP, and drift on the recorded key is still reported."
  - name: test_bp_100k_3_vii_tracked_symlink_layout_does_not_crash
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A tracked directory symlink under a scanned dir does not crash the gate (no traceback, exit status is a verdict)."
