assigned_agent: llm-expert
estimated_complexity: S
declares_side_effect: false
it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/agents/test-runner.md
  n_location_rule: "all -- every agent template that carries a sign-off obligation; FIVE violate it today (test-runner, live-surface-tester, user-surface-smoker, research-agent, worktree-agent), and the check must be derived rather than enumerated so the sixth is caught on arrival"
  required_skills:
    - llm-expert
  post_write_commands:
    - "python -m pytest unit_tests/commit_guardian/ -q"
    - "python scripts/build.py --target-dir . --force-breaking"
  constraints:
    - "GRANT THE CAPABILITY, DO NOT REMOVE THE OBLIGATION. The tempting fix is to drop the sign-off requirement from these three templates. That converts a loud, correct blocker into a silent gap -- a phase that returns cleanly and leaves no record -- which is the exact phantom-done signature KI-BO-007 and the BO-2900f-1 family exist to detect. The agents must gain the ability to write."
    - "REQUIRES_VERIFICATION IS MANDATORY WITH EDIT. Per CLAUDE.md, any template declaring Edit or Write must also declare requires_verification: true, or registry_validator.py rule A fails build.py's install_shims step -- which in CI blocks the required pytest gate BEFORE any test executes, presenting as a build failure rather than a template error."
    - "DERIVE BOTH SIDES, DO NOT HARDCODE THE THREE NAMES. A test naming test-runner, live-surface-tester and user-surface-smoker passes forever and would not have caught any of them before they shipped. Obligation and capability must both be read from the templates, so the check has something to say about a template that does not exist yet."
    - "VERIFY VIA THE BUILD, NOT ONLY THE UNIT SUITE. The registry validator runs inside build.py's install_shims phase; unit tests import from the source tree and can pass while the build fails."
    - "THE AGENT'S CONDUCT WAS CORRECT. test-runner completed all its work, refused an unsafe mutation the global shell rules forbid, and failed closed with full evidence. Nothing in the fix should discourage that behaviour."
delivers_to: null
expects_from: null
test_spec:
  - name: test_every_signoff_obligated_agent_template_declares_a_write_capable_tool
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Derive the obligated set and the declared tools from templates/agents/*.md and assert no template carries a sign-off obligation without a write-capable tool. Must fail against the pre-fix tree naming all three violators."
  - name: test_the_rule_reports_a_synthetic_template_that_violates_it
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: "Feed the rule a synthetic template that is sign-off-obligated and read-only, and assert it is reported by name. Proves the check can still fail once the three real instances are fixed -- without it the suite goes permanently green and stops constraining anything."
  - name: test_a_read_only_template_with_no_signoff_obligation_is_not_reported
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "CONTROL. A genuinely read-only, non-phase agent must not be flagged, so the rule cannot be satisfied by demanding Edit on every template in the repository."
test_rationale: |
  The defect is a contradiction between two halves of one file, and it survived
  because nothing ever compared them. A test that reads the templates and
  compares obligation against capability is therefore the fix's real deliverable;
  editing three tools: lines is the smaller half.

  The synthetic-violator descriptor is load-bearing. Once the three instances are
  corrected the primary assertion passes trivially and can never fail again, so
  without a case that still exercises the failure path the suite would record a
  rule it no longer checks -- the grep-only failure mode in CLAUDE.md, one level
  up. The control descriptor bounds the other side, preventing a fix that simply
  demands Edit everywhere.
