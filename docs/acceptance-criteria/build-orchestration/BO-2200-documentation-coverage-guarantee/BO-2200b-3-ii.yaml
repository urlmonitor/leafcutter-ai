notes: |
  WHY THIS IS A SEPARATE RECORD RATHER THAN AN AMENDMENT TO BO-2200b-3. That record's
  criteria are about signature-vs-length judgement -- whether a short doc is a stub. This
  one is about context: whether text that mentions a marker is carrying one. They are
  different boundaries and the second was not contemplated by the first.

  THE MEASUREMENT CLAUSE IS THE POINT. Filed alongside KI-CG-033, which records that the
  claim of "no repo-wide false-positive cost" for TODO/FIXME/"Replace with" was measured on
  PLACEHOLDER alone. A per-marker scan of 5,634 md/yaml files gives todo: 31, todo 16,
  <!-- question: 16, replace with 3, placeholder 2 -- so TODO accounts for 47 of 68 hits and
  PLACEHOLDER for 2, and the tightening landed on PLACEHOLDER.
