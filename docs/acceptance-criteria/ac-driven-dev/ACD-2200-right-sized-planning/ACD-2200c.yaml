criteria: |
  What makes the result valid is checked when work is saved -- not by following steps.

  Whatever route produced it and whoever was driving it, work is verified at the
  moment it is recorded and again before it is accepted. A shortcut cannot
  produce an invalid result and a skipped step cannot produce a silent one.
