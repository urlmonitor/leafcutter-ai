[pytest]
# strict_markers is set as a direct ini key, NOT as `--strict-markers` inside
# addopts. Measured on pytest 9.0.3: the flag has NO effect from addopts -- an
# unregistered marker only raises PytestUnknownMarkWarning and the run exits 0.
# The same flag on argv, via PYTEST_ADDOPTS, or as this ini key all correctly
# fail collection. This file carried the addopts spelling and therefore enforced
# nothing, which matters because a misspelled shared_layout_reader would be
# silently ignored, the test would count as undeclared, and it would quietly pay
# a real ~59.8s private deploy -- the exact cost TQ-600 exists to remove.
# Covered behaviourally by test_tq600a_5_the_marker_is_registered_so_a_misspelled
# _declaration_is_not_silently_ignored; do not move this back into addopts.
strict_markers = true
addopts = --continue-on-collection-errors -m "not manual and not timing_ratio" -p scripts.ac_store.pytest_ac_enforcement -p scripts.suite_performance.pytest_shared_reference_layout -p scripts.suite_performance.shared_layout_integrity -p scripts.suite_performance.pytest_manual_deselect
markers =
    manual: auto-applied (by scripts/suite_performance/pytest_manual_deselect.py) to every test whose name ends in _MANUAL (TQ-600a-13); deselected by default via the -m selection in addopts, opt in with -m manual.
    shared_layout_reader: declares a test a read-only consumer of the shared_reference_layout fixture (TQ-600a-5); routed to the one shared deployed package root.
    shared_layout_mutator: declares a test must have its own private, unshared copy of the deployed package from the shared_reference_layout fixture (TQ-600a-5); never routed to the shared reference layout root.
    timing_ratio: asserts a wall-clock ratio; runs in the timing lane, reports, never holds
pythonpath = .
