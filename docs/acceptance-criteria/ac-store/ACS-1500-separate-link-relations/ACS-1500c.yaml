priority: medium
roadmap_phase: phase_1
criteria: |
  Existing records keep the meaning they were written with, including the ones
  that say both things at once.

  Records already in the store are carried across as what their author meant,
  never as what a tool guessed. A record holding both kinds of link keeps both.
  Where the meaning genuinely cannot be established, the record is reported and
  left untouched rather than assigned one.
