    relevance: "Owns the declared sink. The submission runs here write to a declared sink in a temporary directory, never to the repository's feedback log."
assigned_agent: python-coder
estimated_complexity: S
declares_side_effect: true
declared_files:
  - path: unit_tests/feedback/test_bo_2000g_2_i.py
    state: to_be_created
it_requirements:
  - >-
    This record only adds a test; no production file changes. If a clause can pass only by
    changing either categories file or submit_feedback.py, stop and report it, because it means
    BO-2000g-2 was carried out the wrong way.
  - >-
    The assertions run on each copy of the categories file separately
    (config/feedback_categories.yaml and templates/config/feedback_categories.yaml), so a change
    to one copy alone is caught.
  - >-
    BASELINE, NOT ABSENCE. ticket-supervisor ALREADY appears in several categories'
    allowed_writers (config/feedback_categories.yaml ~:124, :157, :190 and :204, verified
    2026-11-16). The check is therefore "no category's allowed_writers changed", never
    "ticket-supervisor appears nowhere". The baseline is each category's allowed_writers as it
    stands on origin/main just before BO-2000g-2 lands. It is kept as data in the test, together
    with the commit it was taken from. When a later change edits writers on purpose, it updates
    the baseline in the same change, and the test's failure message says so.
  - >-
    The "no mention" clause is checked as: the text `not-a-signoff` does not occur anywhere in
    either file. This is deliberately stricter than the criteria. Any mention in a categories
    file amounts to documenting a sentinel, which INF-100c-5-ii forbids.
  - >-
    SUBMISSION ARM. Run the real entry point, templates/scripts/feedback/submit_feedback.py, as a
    subprocess from a copied temporary layout. scripts/feedback/ is not tracked in this checkout,
    so the template is the source. Each run gets its own declared sink and a confined TMPDIR
    (ADR-069, INF-500d-4), so the repository's feedback log is never written. Reuse INF-500d-3's
    temporary-layout helper if it exists.
  - >-
    "Refused in the same way" is judged against a control call in the same run that uses a
    different unregistered writer (or a different unknown category). Both calls must exit with
    the same status, both must leave stdout empty and the sink unchanged, and their stderr must
    be identical once the offending value is masked. The test therefore stays valid after
    INF-500d-3 adds its 'submit-failed:<reason>:<category>' line.
  - >-
    No build.py. Four submission runs plus file reads, all within 10 s.
test_intent:
  - clause: "`not-a-signoff` appears in no category's allowed_writers and is the name of no category"
    needs_test: true
    reason: "The wrong version is the rejected design itself: registering not-a-signoff as a writer or category so that note entries could carry a real id."
  - clause: "neither copy mentions `(not-a-signoff)` in a comment or note as a writer or category value"
    needs_test: true
    reason: "A comment in either file that documents (not-a-signoff) as a sentinel violates INF-100c-5-ii, and only a text search over both copies catches it."
  - clause: "every category's allowed_writers list is identical to its list before BO-2000g-2, so ticket-supervisor has been added to none of them"
    needs_test: true
    reason: "Adding ticket-supervisor to complete or to another category so that proxy sign-offs can submit is the wrong version the person rejected, and it changes nothing else a test would see."
  - clause: "each call is refused in the same way as any other unregistered writer or unknown category, and no feedback record is written, So the value cannot become a way to file feedback, or a sentinel that submission honours"
    needs_test: true
    reason: "A submission path that special-cases not-a-signoff, by accepting it or by exiting 0 without writing, would turn the value into a sentinel, and only running the real entry point beside a control value shows it is treated like any other."
delivers_to: null
expects_from:
  ac_id: BO-2000g-2
  contract: "The (not-a-signoff) value as defined in the signoff skill. This record proves the value stays out of the feedback submission vocabulary."
