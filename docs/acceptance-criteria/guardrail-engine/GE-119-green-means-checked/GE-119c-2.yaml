estimated_complexity: M
it_requirements:
  - "THE DELIVERABLE IS THE RECORDED RED RESULT, not a passing test. Capture it as a durable artifact — the harness's own output, together with the commit SHA of the pre-fix tree — BEFORE any GE-119b implementation begins, and reference it from this AC's sign-off. A green harness proves the harness runs; only the red result proves it constrains anything."
  - "TWO RED BASELINES ARE REQUIRED, not one: (a) check_ac_parent_covered_by exiting 0 after printing the cannot-import-derive_parent_id fail-open line from a copy without the deployed layout; (b) the check_ac_schema degradation to manual field validation, which is GE-119b-3's case. One red result does not license the other case."
  - "SEQUENCING IS THE SUBSTANCE OF THIS AC: GE-119c-1 and this AC land FIRST, red is recorded, THEN GE-119b is implemented. If the harness is written after the fix, or by the same agent in the same pass, the evidence is worth much less. Per CLAUDE.md 'TDD Order — test-writer Must Precede python-coder', a harness found already green before the coder phase is an ORDERING VIOLATION to be documented, not a pass."
  - "A harness case with no observed red result must be REPORTED AS UNPROVEN — a distinct, machine-readable state, not an ordinary green. Reuse the shared outcome vocabulary from GE-119a-1 rather than inventing a second three-state model for the test layer; this is the same distinction GE-119a draws for the checks themselves."
  - "The pre-fix behaviour must be reproduced from the REAL pre-fix code at a real commit, never from a hand-written stub that imitates it. A stub reproduces the author's belief about the defect, which is how this defect class survived a full suite of passing tests for its entire life."
  - "This AC's own value is destroyed if it is scheduled after GE-119b. Record the ordering constraint wherever the build sequencer reads it, not only here."
test_spec:
  - name: test_ge119c2_parent_covered_by_case_fails_against_prefix_behaviour
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Run against the real pre-fix code at its commit, the AC-parent-covered-by harness case FAILS."
  - name: test_ge119c2_parent_covered_by_case_passes_against_corrected_behaviour
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The same harness case passes once the corrected behaviour is in place."
  - name: test_ge119c2_schema_degradation_case_has_recorded_red_and_green
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The AC-schema degradation case of GE-119b-3 has both a recorded red result and a passing green result."
  - name: test_ge119c2_case_without_observed_red_is_reported_as_unproven
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "A harness case for which no failing result was ever observed is reported in the unproven state, distinguishable from an ordinary green."
test_rationale: "This AC exists because the GE-119 defect class was invisible to a full suite of passing tests for its entire life: the suite was green and the checks were not running. A test that only asserts the harness passes today would repeat that outcome exactly. The evidence is therefore procedural — a red result captured against the real pre-fix code before the fix exists — and the unproven-state assertion is what stops an un-reddened case from being silently counted as coverage."
