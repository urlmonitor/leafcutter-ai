title: "A check that nothing runs verifies nothing"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a check carrying an enforces tag for a record, and the record stating that
    the check runs as commit-time hook "check-skill-refs" or as build phase
    "docs-lint",
  When the wiring is evaluated as part of the record's done-status,
  Then the verification holds only if the hook is registered in the project's
    active commit-time hook configuration and that registration invokes this check,
    or the build phase is one the build pipeline dispatches and that phase invokes
    this check,
  And a check named only in text, such as a comment, a document or a disabled
    registration, is not wired, because only an actual invocation counts
    (BO-2900b-3),
  And a check registered under a hook id other than the one the record states fails
    the verification, naming both hook ids,
  And a check that was wired when the record was written and has since been
    unwired fails the next time that record's done-status is evaluated, naming the
    missing registration,
  And re-checking the wiring of records already finished, on a schedule and without
    a change to them, is not done here; it is TQ-400a's.
depends_on: [BO-2500f-2]
