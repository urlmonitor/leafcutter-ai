criteria: |
  Given the /build-feature workflow definition,
  When the structural regression check runs against it,
  Then it asserts the flattened build-ticket driver is reachable and invoked from /build-feature
    (build-ticket is not orphaned),
  And it asserts /build-feature routes per-ticket phase execution through that driver
    rather than executing all phases inline in a single supervisor agent,
  And the check passes for a correctly wired /build-feature.
