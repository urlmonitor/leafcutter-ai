assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "THREE DISTINGUISHABLE STATES, NOT TWO BOOLEANS. Carry observation: 'watched'|'unwatched' separately from reached_through: 'reached'|'not_reached'|'undecidable'. When observation is 'unwatched', reached_through MUST be 'undecidable'. The existing fail-closed dict (scripts/ac_store/done_proof.py, the observation_ok False mapping around line 588) sets reached_through False alongside observation_ok False — that co-occurrence IS the defect this AC removes, because it hands a plausible negative to a caller that reads only the verdict."
  - "NO CONSUMER MAY DERIVE unwatched FROM not_reached, AND NO CODE PATH MAY MAP unwatched ONTO EITHER VERDICT. The refusal path must require the literal 'not_reached', never falsiness of a boolean. Keep observation_ok available as a derived alias (observation == 'watched') only so existing call sites do not silently change meaning — and forbid any new consumer from deriving a verdict from it."
  - "DISPLACEMENT MUST BE DETECTED ON PURPOSE, IN AN ATEXIT HANDLER, PER PROCESS. At process exit compare the currently-installed callback against the function the observer installed (sys.getprofile(), or sys.monitoring's registered callback on 3.12+). A mismatch means a launched program installed its own tracer and evicted the observer: that process is unwatched with cause observer_displaced, and every record whose ancestry chain passes through it becomes undecidable. This is a named ship blocker — eviction leaves a WELL-FORMED record that is silent about the code under proof and is otherwise indistinguishable from an honest not_reached."
  - "THE CAUSE VOCABULARY IS CLOSED AND ENUMERATED: non_python_child, isolated_interpreter (a child started with -S, -E or -I), observer_displaced, recorded_nothing, propagation_failed, and unknown. Each is a distinct value, each resolves to unwatched, none resolves to a refusal. An unrecognised condition takes cause 'unknown' and is unwatched — never watched. Adding a cause that resolves to not_reached violates this AC."
  - "RECORDED-NOTHING IS PER PROCESS. The observer must confirm it observed at least one frame in each process it claims to have watched; a process that installed the observer and recorded zero frames is unwatched with cause recorded_nothing. BO-2900a-2's self-validation constraint already requires this for one process and is restated only because a tree makes it a per-process property — an observer that recorded nothing anywhere makes every proof look like a direct import and blocks the whole store."
  - "EVERY UNWATCHED RECORD IS ANNOUNCED, THROUGH THE SAME COUNTABLE FINDING CHANNEL BO-2900a-1-ii DEFINES, naming the proof nodeid and the cause. Silence on an unwatchable proof is the phantom-done vector this AC exists to close: it is a failure of this AC even when the verdict itself is correct, because a pure-spawn proof that nothing judged is today marked done with no reachability evidence at all."
  - "NO UNWATCHED ANNOUNCEMENT MAY NAME A CLEARING ACTION. BO-2900e-1 requires every refusal to give an action the reader can carry out on the code; an unwatched run has none, which is exactly why it must not be phrased as a refusal. The announcement states what could not be watched and why, and asks for nothing. 49 criteria hold the wrong version of this message today."
  - "A CRITERION WHOSE EVERY LINKED PROOF IS UNWATCHED CONTRIBUTES NOTHING TO ELIGIBILITY. The verdict must equal, in every key, the verdict the same evaluation returns with the reachability rule not invoked. This is an equality property to be asserted by comparison — not a flag to be inspected."
  - "THE COVERAGE CEILING IS ACCEPTED, NOT ENGINEERED AROUND. Non-Python children and interpreters started with -S/-E/-I are genuinely unobservable and must not be made observable by rewriting the child's command line, injecting arguments, or refusing to run it. Count them and name them."
delivers_to:
  agent: python-coder
  contract: "A third answer — the run was not watched — carried separately from reached and not-reached, together with what made it unwatchable. Concretely: observation: 'watched'|'unwatched' plus unwatchable_cause: 'non_python_child'|'isolated_interpreter'|'observer_displaced'|'recorded_nothing'|'propagation_failed'|'unknown'|null, with reached_through forced to 'undecidable' whenever observation is 'unwatched'. Consumed by BO-2900a-1's rule as a no-verdict input, and by BO-2900a-1-iii's corpus exercise as an acceptable outcome for a shape the observation cannot cover."
expects_from:
  ac_id: BO-2900a-2-i
  contract: "The process-tree observation whose blind spots this AC classifies: the per-nodeid processes list of {pid, ppid, program_file, spawned_under_entry_point} and the reached_code set. Every way that observation can fail to span a run — a child it cannot enter, a child that evicts it, a child it could not be carried into — is a case that resolves here, into an unwatchable_cause, and not into a reachability answer."
test_spec:
  - name: test_a_displaced_observer_is_reported_unwatched_and_never_unreached
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: "scripts/ac_store/done_proof.py::_run_pytest_and_parse"
    description: "Produces the blind spot for real: a fixture proof spawns a child that installs its own sys.setprofile part-way through and exits 0 without reaching the code. Asserts observation unwatched, cause observer_displaced, reached_through undecidable — and in the SAME test asserts a genuinely unreached proof (observer intact, child never touches the code) is watched and not_reached, because the only thing separating the two is that the mechanism noticed it was blind."
    must_catch:
      - "a mechanism that reports not_reached for a displaced observer"
      - "a mechanism that reports unwatched for every child, unable to tell displacement from an honest miss"
      - "a test that presets an unwatched flag, which proves the branch and not the detection"
  - name: test_a_non_python_child_and_an_isolated_interpreter_are_unwatched_with_distinct_causes
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Two real proofs: one spawning a non-Python program, one spawning the unit with python -S. Asserts both are unwatched, that their causes are distinct and drawn from the closed vocabulary, and that neither yields reached or not_reached."
    must_catch:
      - "collapsing both ceiling cases into one undifferentiated cause"
      - "an isolated interpreter reported as not_reached because no frames arrived"
  - name: test_an_observer_that_recorded_no_frames_reports_unwatched_not_unreached
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: failure
    description: "With the observer unable to install in the runner process, asserts observation unwatched with cause recorded_nothing and reached_through undecidable — rather than every proof in the run reading as not_reached, which would block the whole store."
    must_catch:
      - "an inert observer reported as a store-wide set of honest misses"
      - "an observer that reports watched because it installed successfully but observed nothing"
  - name: test_a_criterion_whose_only_proof_is_unwatched_gets_the_eligibility_it_would_get_with_the_rule_absent
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Drives the real verify_done_eligible twice over the same fixture — once with the reachability rule wired, once with it not invoked — and asserts the two verdicts are equal in every key. Separately asserts the announcement count for that run is non-zero, so an implementation that never reached the rule (which would also produce equal verdicts) fails."
    must_catch:
      - "an unwatched record that refuses the criterion"
      - "an unwatched record that credits the criterion"
      - "a rule that is never reached at all, making the equality assertion pass vacuously"
  - name: test_every_unwatched_record_is_announced_with_its_own_cause
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Over a fixture set producing each enumerated cause at least once, asserts the set of announced causes equals the set of causes the records carry, and that the announcement count equals the unwatched-record count. No cause may be produced and left unannounced, and no announcement may name a clearing action."
    must_catch:
      - "a cause that is recorded internally and never announced, so the population stays uncountable"
      - "an announcement phrased as a refusal with an action for the author to take"
test_rationale: "A test that hands the rule a pre-set unwatched flag proves the branch and not the detection, and detection is the hard half. Displacement in particular leaves a well-formed record that is silent about the code under proof and reads exactly like an honest not_reached, so the first test PRODUCES the eviction for real — a child that installs its own tracer — and asserts it alongside a genuinely unreached proof in the same run, because the verdicts are only distinguishable if the mechanism noticed it was blind. The absence guarantee in this AC is that no verdict is contributed, and test four states explicitly how correctly-silent is separated from never-ran: it asserts verdict equality against a not-invoked baseline AND a non-zero announcement count, so an implementation that never reached the rule fails the pair even though it would satisfy the equality alone. This repository has three recorded cases of a defence that examined nothing and reported clean; the announcement-count assertion is the guard against becoming the fourth."
