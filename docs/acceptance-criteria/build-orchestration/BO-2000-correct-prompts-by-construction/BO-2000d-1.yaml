it_requirements:
  - "Add a machine-checkable validation rule: for ACs where assigned_agent == python-coder AND component in {build_pipeline, build-orchestration}, it_requirements MUST carry the config-schema fragment, resolved reference-file path, N-location rule, required_skills, and post-write commands."
  - "Test coverage: a package-surface AC missing any of these fields fails validation with a message naming each missing field; a fully-populated one passes."
  - "Timing: the five-field rule is enforced after the file-aware step (ACD-2500d-2), not at IT PO write time. Between the planner stage and the file-aware step the explicit, schema-declared 'reference file pending' marker (ACD-2500d-2-i) excuses reference_file_path only; absence of the key alone never excuses it."
  - "All enforcement points of this rule move together (validate_ac.py, the object branch of config/ac_store_schema.json via check_ac_schema.py / validate_ac_schema.py, and the stage-end rule check) — the change is owned and built by ACD-2500d-2-i."
