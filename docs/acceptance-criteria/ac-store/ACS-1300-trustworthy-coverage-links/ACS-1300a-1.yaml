it_requirements:
  - "TAG RECOGNITION COMES FROM THE CANONICAL SEAM, NEVER FROM A NEW PATTERN. The occurrence set must be obtained through `done_proof._scan_test_root_for_covers_tags`, which applies `COVERS_TAG_RE` at `scripts/ac_store/test_enforcement.py:57` — `(?:#|//)\\s*covers:\\s*(\\S+)` — declared canonical by BO-2500e-1. VERIFIED DISQUALIFIED 2026-09-01: `templates/scripts/commit_guardian/check_ac_coverage.py:41` collapses every suffixed id to its L0 root and is blind to `//`. A join built on that rule writes entries onto the WRONG record, which is strictly worse than the missing evidence it replaces."
  - "SEQUENCING WITH TQ-100b-5, WHICH IS A NOTE AND DELIBERATELY NOT A DEPENDENCY. TQ-100b-5 owns four-way parity across the four existing tag-recognition rules; this AC's final clause is the complement — it forbids a fifth. The two are independent: binding this run's occurrence set to done_proof's by observed output is correct whether or not the other three readers have been reconciled. If TQ-100b-5 later widens what the canonical rule recognises, the correct response is to RE-RUN this repair, which ACS-1300a-2's idempotency clause makes cheap and safe — not to have waited for it."
  - "`scripts/ac_store/cross_reference_audit.py` IS A READ-SIDE REUSE CANDIDATE ONLY, and the anti-duplication advice in this tree's L0 must be read with that ceiling attached. Safe to reuse: `_detect_worktree_root`, `_load_ac_yamls`, `_write_report`. Its matching layer is difflib text similarity against ticket bodies and is not this join. Its `_apply_backfill` is disqualified outright — verified 2026-09-01, it sets `ac_data[\"work_status\"] = \"done\"` at line 457 and re-serialises the whole record, violating the finished-state refusal and byte stability in a single call."
  - "THIS AC PRODUCES NO WRITES AT ALL. Detection is read-only: no file under the store may be opened for writing on any path reachable from this AC, and in particular no code path may assign `work_status`. That refusal is inherited from the L0, is refused rather than deferred, and no strength of evidence licenses an exception."
  - "THE JOIN IS A COMPOSITION OF TWO EXISTING READERS, NOT A THIRD TRAVERSAL. `done_proof._scan_test_root_for_covers_tags` already walks the test tree (both comment forms, with the node_modules / .next / dist / coverage / .git / __pycache__ / .venv exclusions) and `done_proof._build_ac_status_map` already enumerates the store. Writing a new walk over either side is the drift shape the final criterion clause forbids."
  - "A COVERAGE ENTRY IS CLASSIFIED ON ITS PATH PORTION, AND NO ENTRY MAY BE CALLED ABSENT BECAUSE ITS SUFFIX FORM WAS NOT THE ONE THE PARSER EXPECTED. Measured 2026-09-01, the field carries three dialects — child record ids (3,586 entries), `path::Class::test` (162) and bare file paths (365) — plus GE-107, which writes `path.py:Class::test` with a SINGLE colon. A parser that splits on `::` reads that one entry as four dead links. Both `::` and `:` must therefore be recognised as suffix introducers, and an entry that resolves to no path at all is a reported abstention (ACS-1300c-3), never an absent-file finding. The mechanism is the implementer's choice; all four measured forms classifying correctly is not. THIS IS A SAFETY REQUIREMENT, NOT A FIDELITY ONE: a false absent-file finding is precisely the input ACS-1300a-2-i's removal rule consumes, so a misparse here does not stay a wrong line in a report — it becomes a destructive write one AC downstream."
  - "EVERY FIGURE THE REPORT STATES CARRIES ITS DENOMINATOR AND ITS EXCLUSIONS, in ACS-1100's existing vocabulary. Do not introduce a second vocabulary for stating a total, and do not hard-code any expected count anywhere in the tool or its tests."
  - "A RUN THAT COULD NOT DO ITS WORK MUST NOT PRODUCE A CLEAN-LOOKING RESULT (GE-120). An unreadable store root, an unreadable test tree, or a scan that returned zero occurrences because it failed must be distinguishable — in the report and in the process outcome — from a store that genuinely has nothing to report."
  - "THE TOOL MUST HAVE A REAL OUT-OF-PROCESS ENTRY POINT. Every clause of this criterion is written as 'invoked once, out of process'; a helper only a unit test imports cannot satisfy them. This repository has already shipped a runner whose gates were computed and never executed, so the entry point is the requirement, not the packaging."
  - "Must complete one whole-store, whole-test-tree pass in a single invocation on a developer machine WITHOUT executing the test suite — the join is a static tag scan over roughly 3,700 records, not a test run. Latency budget: under two minutes."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md rules 1-4), and must fail toward reporting rather than toward silence: an input this pass cannot classify becomes a reported abstention (ACS-1300c-3), never a swallowed exception."
delivers_to:
  agent: python-coder
  contract: "The finding set for one run: per record, a classification of missing-link / absent-file-claim / already-correct / untagged, each naming the record id and the path involved, plus the run's examined and read totals. ACS-1300a-2 consumes this and writes; it must not recompute the join."
