roadmap_phase: phase_1
parent: KM-KGS-100d
criteria: |
  Given a document on a surface whose configuration declares related_docs among
    its edge fields, and whose related_docs holds one bare entry naming
    docs/explanation/architecture.md and one labelled entry
    `reference: docs/reference/configuration.md`,
  When the knowledge map is built,
  Then the map holds one related_docs edge from that document per entry — two
    edges, not one,
  And the edge derived from the labelled entry carries the same edge type and
    resolves to the same target as it would have carried had that entry used the
    bare form,
  And this holds for every surface whose configuration declares the field, not
    only for the first surface the builder reads.
