it_requirements:
  - "AGENT REASSIGNED FROM workflow-architect TO python-coder for the reason given on INF-700a-1: workflow-architect is is_ticket_phase false with null selection_criteria and cannot be dispatched as a ticket phase; python-coder is the registry's declared owner of templates/workflows-js/ and of its pytest-over-Node-harness coverage."
  - "WHERE THE RECEIPT IS STORED — IT PO decision, three layers in priority order, answering the gitignore problem directly. LAYER 1, PRIMARY AND ALWAYS PRESENT: the driver's returned result payload. The three-case value is a field on the object the driver reports, in band, structured, requiring no filesystem and no directory. This is literally what the criteria ask for (the reported result names the routing step as having not completed), so the storage question mostly dissolves. LAYER 2, DURABLE AFTER PROCESS EXIT: the run journal in the run's transcript directory, which the workflow engine already writes per ADR-024 and which BO-1000c-1a establishes is readable after the run process exits and is NOT written by the workflow body itself. The routing outcome rides the existing per-step outcome record; nothing new is created. LAYER 3: nothing. There is no third file."
  - "THE RECEIPT MUST NOT LIVE IN debugging/logs/ AND MUST NOT CREATE A DIRECTORY. That directory is gitignored (.gitignore:60) and absent from every fresh clone and every consumer install. That absence is the correct answer for the SINK and for INF-700a-2's last-run marker, where no run recorded in this tree is a true statement. It is the wrong answer for a receipt: a receipt whose absence is indistinguishable from a step that never had one is the precise silence this AC closes. If the transcript directory is unavailable for any reason, degrade to layer 1 — never to nothing, and never by creating a directory to have somewhere to write."
  - "FAIL-OPEN IS MANDATORY AND IS NOT A LICENCE TO BE SILENT. The package's standing rule is that a knowledge step never blocks an agent's primary output (INF-700b-1's requirement, ADR-034's fail-open branch). The defect this AC closes is the OTHER half of that rule: the fail-open branch in signoff section 7 has been the only reachable path since the feature shipped, and it left no countable trace, so nobody knew. Proceeding must leave a receipt."
  - "THE THREE CASES ARE A PARTITION, decided by data rather than presentation: (a) the routing step ran and completed — figures reported; (b) it ran and could not complete — figures reported plus what failed; (c) it did not run — reported as not run. Case (c) must not be rendered as (a) with zeros, which is precisely how an unwired pipeline reads as a healthy one."
  - "EXIT STATUS EQUALITY IS THE TESTABLE FORM of 'the same as they would have been'. Assert the driver's status for a unit of work with a failing routing step equals its status for the same unit of work with a succeeding one — not that it equals success, because the clause must also hold for work that failed on its own merits."
  - "DO NOT ADD THE ROUTING STEP'S FAILURE TO THE UNIT OF WORK'S FAILURE COUNT or to any gate that decides whether the work merges. The routing step's own exit statuses (a sink that cannot be read, a destination write that failed) already exist and are documented by INF-700c-3; consume them, do not re-derive them."
  - "'NOT RECORDED AS WRITTEN' IS ALREADY THE ROUTING STEP'S BEHAVIOUR — INF-400c-2-ii requires an event it could not handle to stay out of the idempotency record so a later run sees it again. This AC asserts the property end to end from the driver, and must not re-implement retention in the driver."
  - "Must handle errors gracefully per the project error handling policy"
delivers_to:
  agent: documentation-expert
  contract: "The three routing outcomes a driver can report (completed / could not complete / did not run) and the guarantee that none of them changes the unit of work's own outcome — described by INF-700a-4's reference"
expects_from:
  ac_id: INF-700a-1
  contract: "The routing figures in the driver's reported result, which this AC extends with the two non-success cases"
