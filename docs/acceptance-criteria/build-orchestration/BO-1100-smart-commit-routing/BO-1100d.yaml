criteria: |
  Unrecognized file groupings are not ignored -- they trigger pattern analysis.

  When staged files do not match any known routing pattern, a specialist
  examines recent commit history for structurally similar commits. After 10
  occurrences of the same unmatched shape, a new routing rule is proposed for
  addition to the configuration. The system gets smarter with use without
  requiring manual rule authoring.
