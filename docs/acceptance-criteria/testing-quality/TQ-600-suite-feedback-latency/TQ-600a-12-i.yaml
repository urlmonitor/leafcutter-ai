notes: |
  This is the guard that makes the seed route defensible at all. The objection to
  seeding — "you are handing the test a layout the harness made rather than one a
  build produced" — is answered by the seed being byte-equivalent to a built layout.
  That answer is only worth anything if a seed that is NOT byte-equivalent is refused
  rather than used.
