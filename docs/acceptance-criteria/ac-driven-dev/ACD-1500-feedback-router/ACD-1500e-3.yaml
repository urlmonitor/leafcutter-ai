assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "No special-casing: a router-emitted process-finding entry must be a first-class unresolved entry that aggregate.py --unresolved returns, so it flows through the same queue-build -> classify -> route -> resolve pipeline as any other entry"
  - "When acted on, P1 resolves with a back-reference via resolve_feedback.py exactly like any other entry (reuses the ACD-1500c-1 contract)"
  - "The recursion guard from ACD-1500e-3-i must still apply: routing P1 must not itself emit a new process-finding about P1; the router-generated source marker is how the classifier/router recognizes its own output"
