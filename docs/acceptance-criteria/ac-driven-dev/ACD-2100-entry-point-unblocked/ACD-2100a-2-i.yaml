notes: |
  WHY THIS IS ITS OWN RECORD AND NOT A CLAUSE ON ACD-2100a-2. The fallback added by
  ACD-2100a-2 is a search, and a search that returns the first hit is the easiest
  thing to write and the hardest failure to notice: the run succeeds, a worktree
  appears, and it is in the wrong project. The observed workspace already holds
  more than one repository-shaped directory, so the ambiguous case is the normal
  case here, not a contrived one.

  THE FAILURE MUST NAME ALL CANDIDATES. A bare "could not determine the repository"
  sends the operator back to the same search by hand. Naming the candidates is what
  makes the message actionable, and it is also the only way a test can tell a
  refusal-to-guess apart from a resolver that simply failed.

  THE NO-RESIDUE CLAUSE IS LOAD-BEARING. A partial attempt that creates a branch in
  candidate A before discovering candidate B leaves the operator with cleanup in a
  repository they never meant to touch, and a rerun then sees a branch that already
  exists. Assert the absence on disk in every candidate after the failure -- not the
  exit code alone.

  2026-08-25 (it-po): the no-residue clause is restated in it_requirements as an
  ordering constraint (resolve fully before writing anything) because that is the only
  way it is satisfiable by construction rather than by cleanup-on-error, and a
  cleanup-on-error implementation is itself a new failure path that can leave residue
  when it crashes.
