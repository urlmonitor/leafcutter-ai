notes: |
  Retrospective refinement of KM-400a-3-i. The reader receipt reports 18 passing
  cases and two canonical datasets containing eight entity descriptions and 48
  samples, including one unregistered dataset. These are measured observations,
  not fixed population criteria. Full product-truth schema conformance stays
  with its canonical validator; field exposure must never silently discard data.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
estimated_complexity: M
it_requirements:
- Dataset samples, invariants and field descriptions remain inert data; extraction cannot create project AC/Test
  identities or execution evidence from sample names.
- Discovery and registration validation must preserve canonical unregistered datasets while rejecting duplicate
  identities, conflicting registrations and snapshot escapes.
