notes: |
  Edge case of ACD-1800b-2: "done means every item accounted for". A not-applicable
  deliverable must be an explicit, attributed state -- not an absence -- so that
  "done" still proves nothing was quietly missing.

  IT-PO enrichment (2026-08-12): done-computation + schema surface in scripts/ac_store/;
  the marking action is the signoff-skill split (ACD-1800b-1b). Added ac_store to graph
  components.
