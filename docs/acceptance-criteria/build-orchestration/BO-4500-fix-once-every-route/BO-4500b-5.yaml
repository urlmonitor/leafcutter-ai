it_requirements:
  - >-
    Allocate the diagram id with scripts/next_diagram_seq.py at publish time, never from this
    record or a ticket (repo CLAUDE.md, "sequential resource paths go stale"). Follow the
    write-c4-diagram skill's conventions.
  - >-
    Link the diagram from docs/architecture/components/build-orchestration.md, and cross-link it
    with the commit step's diagram (BO-4500a-5-ix), which links here for the mechanism rather
    than redrawing it.
  - >-
    Show the identity check reading the installed routes in every deployed location, and the
    commit step's configuration feeding the install, not the routes at run time. Route bodies
    read no files at run time (ADR-030).
  - >-
    Draw the components as built. If the block sources location or a consuming route's name
    differs from the criteria's wording when the diagram is drawn, the built names win, and the
    difference is noted in the diagram's notes.
