title: "Unknown dependency references are treated as satisfied (not blocking)"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an epic contains ticket A with depends_on=["nonexistent-ticket.md"],
  When the dependency resolver constructs the graph and computes the ready set,
  Then "nonexistent-ticket.md" is not present as a node in the graph,
  And the dependency edge from A to the unknown node is silently ignored,
  And ticket A appears in the ready list (the unknown dep is treated as
    satisfied because it is absent from the graph),
  And no error or warning is raised for the missing dependency reference.
