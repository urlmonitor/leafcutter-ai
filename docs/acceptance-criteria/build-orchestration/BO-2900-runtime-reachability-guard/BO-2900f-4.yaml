id: BO-2900f-4
components:
  - build_orchestration
  - supervisor_system
title: "The skipped record is derived from the requested-gate set, so a newly added gate is covered without bespoke wiring"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the set of quality gates a work item may request is extended with a new gate
    that has no recording logic written specifically for it,
    And a work item requests that new gate,
    And the new gate does not execute because a setting that governs it is switched
      off,
  When the work item's gate results are recorded,
  Then the new gate has exactly one recorded entry with outcome `skipped` and a
    reason naming the setting that switched it off,
    And that entry is produced by the same mechanism that records every other
      requested gate, with no gate-name-specific branch added for it,
    And removing that gate from the requested set removes its entry, with every
      other gate's entry unchanged,
    And no gate in the project is exempt from the rule by virtue of not being
      enumerated anywhere.
depends_on:
