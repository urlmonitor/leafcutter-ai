  - "/about must be an actual route the harness enumerates — verify it is covered by the route-enumeration source (leafcutter-web/app/about) so it cannot be silently dropped from the swept set."
  - "Any deliberately-broken /about used to verify the failing direction must be transient/scoped to the verification (throwaway PR or temporary edit removed before merge) so it does not become a standing red; this AC verifies the GATE, it does not ship a broken /about."
  - "Not-mergeable enforcement assumes the required-status-check wiring in BP-1400a-4."
