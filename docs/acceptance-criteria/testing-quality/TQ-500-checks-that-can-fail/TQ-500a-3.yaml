    relationship: describes
    status: exists
    relevance: >-
      KI-TQ-010 Fix direction item 1 states the substitute in exactly three parts —
      name the mutation, show the test red under it, show it green after revert.
      This AC covers the first and third; the second is TQ-500c-1.
  - path: templates/agents/test-writer.md
