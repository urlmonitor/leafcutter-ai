notes: |
  THE FALSIFIABLE HALF OF TQ-500f-3 (the TQ-500 pattern: the writer-must-state
  AC is prompt; its L3 is the reader that refuses a bad statement).

  DECLARED, NOT INFERRED. "Guards existing code" is not guessed from the
  requirement text (TQ-500's non-goal). The declared signal is must_catch or
  angle: discrimination on the test's own requirement entry. T3 is the control:
  a check that refuses every import-error red passes T1 and breaks all ordinary
  new-code work.

  BOTH LANES, ONE READER (user direction at the BA gate). The rule is added to
  the existing verify_red_baseline reader
  (scripts/build_orchestration/fast_lane.py with
  scripts/build_orchestration/_fl_red_baseline_support.py). No second reader.
  This AC owns the RULE inside that reader. Making /build-feature actually run
  that reader is a distinct behaviour, owned by TQ-500f-3-ii.

  IT-PO ENRICHMENT (2026-09-25)
  INTENDED must_catch (gate):
    - "accept every red as before" -> T1 accepted, tests 1/4 red
    - "refuse every import-error red" -> T3 refused, test 2 red
    - "honour must_catch only, ignore angle: discrimination" -> test 3 red
    - "classify from the AC's criteria wording" -> the wording variant in test 4 red
    - "trust the writer's red_baseline kind label" -> test 4 (the label is absent from the fixture) red
  [RESOLVED at the IT-PO gate, see USER DECISION below] OPEN QUESTION: with T1 refused and T2/T3 red, today's rule ("at least one
  newly-added test red") still passes the gate, so a declared absence-only test rides on its
  siblings. IT-PO recommends that any refused declared test fails the gate (fail closed);
  the criteria state only that T1 is refused and named.
  ORDERING CAVEAT [RESOLVED: TQ-500f-1 and TQ-500f-2 added to depends_on]: the reader reads
  test_spec.must_catch / angle: discrimination, which those two ACs introduce. The fast lane
  already skips the structural parent TQ-500f-3 (--exclude-structural-parent).
  COLLECTION-ERROR CAVEAT: a module-level ImportError makes pytest report the file as a
  collection ERROR, which today's reader buckets as inconclusive, not red. Fixtures should
  cover both function-level and module-level absence. Whether an undeclared module-level
  absence counts as red (T3 in that shape) is today's BO-2400a-3-vi behaviour and must
  not change silently.

  USER DECISION AT THE IT-PO GATE (fail closed): if ANY declared test
  (must_catch or angle: discrimination) is refused as absence-only red, the
  whole red-baseline gate fails, however many sibling tests are properly red.
  Now a Then clause. For IT-PO's test_spec: the T1+T2+T3 fixture must assert
  gate_passed false, and a T2+T3-only fixture must assert gate_passed true (the
  control).

  IT-PO PASS 2 (2026-09-25): fail-closed gate verdict added to it_requirements. test_spec gains
  the T1+T2+T3 -> gate_passed false case and the T2+T3 -> gate_passed true control.
  Added must_catch: "refuse T1 but still pass the gate because another test is red" -> the
  T1+T2+T3 test goes red.
