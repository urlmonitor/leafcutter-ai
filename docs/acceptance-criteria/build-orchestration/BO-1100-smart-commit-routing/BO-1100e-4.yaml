title: "History filter is invoked by the learning pipeline and enforces a positive commit bound"
component: build-orchestration
level: L2
status: active
readiness: reviewed
priority: medium
req_status: active
work_status: todo
criteria: |
  Given an unmatched shape with directory pattern "docs/architecture/**" has reached
    the proposal threshold (10 occurrences),
  And the learning pipeline is evaluating whether to propose a new routing rule,
  When the pipeline prepares historical commit data for pattern inference,
  Then the pipeline invokes the history-filtering function with the directory pattern,
  And the filtering function returns a bounded list of candidate commits,
  And the pipeline uses these candidates to infer a message template for the proposed rule,
  And the filtering function is NOT bypassed or duplicated by inline git queries.

  Given the history filter is invoked with a maximum-commits bound of 50,
  And a repository has 200 commits touching the target directory,
  When the filter queries git history,
  Then the filter returns at most 50 commits (most recent first),
  And the bound is enforced regardless of how many matching commits exist.

  Given the history filter is invoked with a maximum-commits bound of 0,
  When the filter validates the bound,
  Then the filter rejects the invocation with an error stating the bound must be
    a positive integer,
  And the filter does NOT query git history with an unbounded or unlimited request.
