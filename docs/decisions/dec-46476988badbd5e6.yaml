decision_type: design
question: Ticket 08 (BO-2600a-5) makes goal_to_epic order an epic by expects_from edges as well as depends_on. On the real
  AC store that exposes cycles that depends_on alone never had. What should ticket 08 ship for an expects_from edge that closes
  a cycle, and what follow-up work (if any) goes into separate tickets?
