id: ACS-800c-3
readiness: approved
priority: high
title: "A re-home keeps both ends of the parent-child link consistent and is auditable"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given a requirement with UID 42 whose parent is UID 10, where UID 10 lists 42
    among its children and UID 25 does not,
  When UID 42 is re-homed under UID 25,
  Then after the move UID 25 lists 42 among its children and UID 10 no longer
    lists 42,
  And the child's parent-pointer field and both parents' child lists end in a
    mutually consistent state (no requirement claims 42 as a child unless 42
    points back to it),
  And the move is recorded as a single auditable amendment entry on the moved
    requirement naming the old parent UID and the new parent UID.
