id: TQ-600a-13-xiv
components:
  - testing_quality
title: "The hold fails, and says which, when the post-merge verdict is stale, the workflow is disabled, or no run has ever completed"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given that the hold passes on the latest settled correctness run on main
    (TQ-600a-13-vi), and that a run which never happens produces no red to hold on,
  And the platform facts that make "never happens" real here: GitHub disables scheduled
    workflows in a public repository after 60 days without repository activity, without
    a documented notification, and anyone with write access — which every agent in this
    repository has — can disable a workflow silently,
  And the heartbeat of TQ-600a-13-ii, at most 12 hours apart, plus a run after every
    merge, which together make a verdict older than 30 hours a sign that runs have
    stopped rather than a normal gap,
  When the check `Post-merge suite status` evaluates a pull request,
  Then when the correctness workflow's state is anything other than active, the check
    fails with output that says the workflow is disabled and names the state reported,
    whatever the latest run concluded,
  And when the workflow is active and no run of it on main has ever settled, the check
    fails with output that says no post-merge run has ever completed, so there is no
    verdict,
  And when the workflow is active and the latest settled run started more than 30 hours
    before the evaluation, the check fails with output that says the verdict is stale,
    giving that run's start time and age, even if that run was green,
  And each of these, together with red, did not complete and could not read, has
    wording distinct from all the others, and every one of them says the cause is not the
    pull request's change and how to restore a verdict,
  And a fresh green run on an active workflow passes, so the check is not satisfied by
    failing on everything,
  And these outcomes come from the same reads the verdict already makes — the workflow's
    state and its run history — with no further request,
  And each is demonstrated by executing the check against a double serving each workflow
    state, an empty run history, and a latest run aged 29 and 31 hours, never by reading
    the workflow file's schedule.
depends_on:
