it_requirements:
  - "Resolving this AC means DELETING the hand-written sub-agent account from the BODY of the six templates in templates/agents/ -- the table section of the five (business-analyst, frontend-coder, test-writer, python-coder, architect-review) and ticket-supervisor's fenced list under '### Spawn Allowlist (is_ticket_phase agents)' (BrainCandy decision, 2026-10-09) -- the contiguous account section only (heading, lead-in sentence and table or fenced list); no other body prose changes and no compiled prompt is edited. Suppressing delivery is not an acceptable route to one account."
  - "ORDER: the deletion runs only AFTER the AR-300c-5-i consolidation has written the union into each template's `spawn_allowlist` declaration (and, for architect-review, after AR-300c-5-iii's decision-10 remediation). Deleting first loses python-coder's table-only test-runner permission, which BrainCandy decided (decision 11) it keeps. For ticket-supervisor, its permission must already be carried by its declaration (the `__ticket_phase_agents__` shorthand, AR-300c-5) before the fenced list goes, so no agent it may spawn today is lost."
  - "ONE DETECTOR: detecting a hand-written sub-agent account must generalise the existing in-place-account detector (scripts/agent_inplace_abilities.py, which detects a hand-written abilities account) over the kind of account, not add a parallel spawn detector. It anchors on the generated section's emitted structure (AR-300a-5 defines it once) and on a table OR a list (bulleted, numbered or fenced) that states the agent's OWN permitted sub-agents -- never on counting a heading string, which llm-expert's checklist prose contains (the control case; AR-200b-1 records what a heading-string detector costs this component). A detector that recognises only tables misses ticket-supervisor's shape and fails this AC."
  - "Equality is a two-way set comparison between the sub-agents named in the surviving (delivered) account and the declaration after macro resolution."
  - "The single-account property is asserted over EVERY compiled prompt in every platform root under the declared output root, with the count reported and failure on zero -- not just the six known instances (the five tables plus ticket-supervisor's fenced list)."
  - "File-size ratchet: generalising the detector must not push its module over the 400-content-line limit (count_content_lines); split into a new module if needed. scripts/template_compiler.py and scripts/injection_builders.py may not grow."
test_spec:
  - name: test_six_formerly_hand_written_agents_carry_exactly_one_sub_agent_account
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: deployed
    description: "The compiled prompts of business-analyst, frontend-coder, test-writer, python-coder, architect-review and ticket-supervisor (both roots) each contain exactly one sub-agent account, and it is the delivered section; ticket-supervisor no longer carries the '### Spawn Allowlist (is_ticket_phase agents)' fenced list."
  - name: test_single_account_names_exactly_the_declared_sub_agents
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "The surviving account equals the declaration in both directions; python-coder's names test-runner."
  - name: test_a_hand_written_table_planted_in_another_template_is_caught
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: discrimination
    description: "Planting a hand-written sub-agent table in a different template makes the whole-population assertion fail, naming that agent."
    must_catch:
      - "the assertion iterates only the six known templates (the five with tables plus ticket-supervisor)"
  - name: test_a_hand_written_sub_agent_list_planted_in_another_template_is_caught
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: discrimination
    description: "Planting a hand-written LIST (ticket-supervisor's former fenced-list shape) of the agent's own permitted sub-agents in a different template makes the whole-population assertion fail, naming that agent."
    must_catch:
      - "the detector recognises only tables, not lists"
      - "the assertion iterates only the six known templates"
  - name: test_single_account_property_counts_every_compiled_prompt
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: boundary
    description: "The assertion reports how many compiled prompts it examined across both roots and fails on an empty population."
  - name: test_prose_mention_of_sub_agent_tables_is_not_a_second_account
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: unit
    angle: failure
    description: "A body that mentions the '## Your Available Sub-Agents' heading in checklist prose without stating its own sub-agents (llm-expert's shape) is not counted as a second account."
test_rationale: >-
  Two of the five tables already disagree with the registry, so the planted-table
  descriptor is load-bearing: without it the assertion only ever runs on a repaired
  tree and proves a loop runs. The prose descriptor guards the opposite failure, a
  detector that fires on ordinary prose and gets switched off.
