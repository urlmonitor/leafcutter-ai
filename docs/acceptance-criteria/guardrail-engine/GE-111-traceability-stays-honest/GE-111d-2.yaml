criteria: |
  Given the traceability reconciliation check has flagged criterion AC-X because
    a structural change moved the source AC-X points to
  And the developer records a durable confirmation against AC-X that the existing
    code still satisfies AC-X despite the structural change
  And the confirmation records which version of the source it affirms (so a later
    change to that source can tell the confirmation is stale)
  When the traceability reconciliation check runs again at pre-commit time
  Then the check produces a clean verdict for AC-X
  And the same commit is allowed to proceed

  Given AC-X carries a confirmation affirming source version V1
  And a later commit changes that source from version V1 to version V2
  When the traceability reconciliation check runs on that later commit
  Then the stored confirmation no longer clears AC-X
  And AC-X is flagged again for re-reconciliation
