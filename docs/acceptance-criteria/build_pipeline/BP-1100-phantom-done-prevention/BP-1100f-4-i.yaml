notes: |
  L3 edge for BP-1100f-4: a test author must not be able to hide an instruction-less
  dispatch by stubbing the mock to "succeed". This is the exact BO-2300 failure shape —
  a topology-controlling mock that made an absent behavior look done — pushed down to
  the harness contract.
