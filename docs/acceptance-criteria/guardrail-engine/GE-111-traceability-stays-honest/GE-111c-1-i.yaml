it_requirements:
  - "This is a negative-scope guarantee: an AC whose implemented_by file portion is NOT in the staged trigger set must be excluded BEFORE any drift evaluation runs — never evaluated-then-suppressed. The exclusion is a direct consequence of the GE-111c-1 scope-membership rule; no separate suppression logic."
  - "Out-of-scope pre-existing broken links are the boundary the IT-PO must NOT conflate with a store-wide scan: surfacing pre-existing breakage across the whole store is a SEPARATE, out-of-scope surface (recorded as a caveat). The commit-time gate stays staged-scoped."
  - "Must follow the project error handling policy (CLAUDE.md Rules 1-4)."
