notes: |
  Derived from flow leafcutter/explore-flows-in-atlas v5, step 'acStepLink' (FlowAppearance
  records in the leafcutter/atlas-flows dataset). Replaces the link form UXP-524 introduced:
  today the AC detail emits /flows?flow=<percent-encoded id>&step=<node id>, which the Flows
  view does not read, so the link opens the default flow instead of the linked flow and step
  (see the flow's 'cross' step). Old links in that form are covered by UXP-591-2-iii.
