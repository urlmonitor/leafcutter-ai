title: "A durable-change dispatch that carries no instruction is flagged before it is accepted"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
criteria: |
  Given a workflow step dispatches an automated helper to produce a durable change
    (a file written to disk, or an equivalent lasting artifact),
  And the dispatch request's first argument is a bare data payload — an object or an
    empty value — carrying no instruction text,
  When the pre-implementation dispatch review examines the step,
  Then the step is flagged and is not accepted, and the finding names the dispatch as
    carrying no actionable instruction,
  And a dispatch whose first argument is a non-empty instruction string describing the
    change to make passes this review unflagged.
