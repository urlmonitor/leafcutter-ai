notes: >-
  Test contract intent: unit-testable against the tolerant agent-reply reader with a
  prose-only input string, asserting it raises a typed error (not a generic crash and
  not a silent None/skip) whose message carries the failing stage/agent identity passed
  in by the caller. Also coverable by a workflow-level integration test that dispatches a
  stubbed agent returning prose-only output and asserts the run halts with the named
  error rather than proceeding. This AC is the "never blind" guarantee — the deliberate
  boundary between tolerated cosmetic wording (BP-300e-1..3) and a genuinely unusable
  reply.
