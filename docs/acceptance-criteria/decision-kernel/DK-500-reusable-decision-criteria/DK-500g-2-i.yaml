id: DK-500g-2-i
title: An empty answer is distinct from a graph that could not answer
component: decision-kernel
components:
- decision_kernel
- knowledge_management
level: L3
status: active
readiness: approved
req_status: draft
priority: high
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given dec-5e7445182eaec1f2, which no published category lists as a member,
  When a person asks which categories it used against a published generation,
  Then the answer is an empty list, marked as a complete answer from that generation,
  And when no knowledge graph is configured, the same question answers "disabled", and when the configured graph cannot be reached it answers "unavailable", each with its reason and never as an empty list.
depends_on:
- DK-500g-2
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500g-2
  contract: Registered query get_decision_categories.
change_target: code
risk_surface: internal
it_requirements:
- 'Reuse ADR-062''s distinct non-answers: backend none gives disabled, a configured but unreachable backend gives unavailable, a missing generation gives stale, each with a reason and never as an empty list. An empty list is returned only for a decision known in the generation that has no memberships, with answer.completeness.complete true.'
test_required: true
test_spec:
- name: test_no_memberships_returns_complete_empty_list
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Asking about dec-5e7445182eaec1f2 returns an empty list marked complete for that generation.
- name: test_disabled_and_unavailable_are_not_empty_lists
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: With no knowledge graph configured the answer is disabled, with an unreachable graph unavailable, each with a reason and never an empty list.
test_rationale: Build real generations through the knowledge sync and registered-operation entry points from a fixture commit (offline fixture backend), and assert node identities, links and answers against the category records of that commit; a live Neo4j test proves server compatibility. Unit tests of the reader alone would not prove that the Decision kind is unchanged in a full generation.
