id: BO-2900e-2
components:
  - build_orchestration
  - commit_guardian
title: "One run reports every unreachable thing it found, so the fix list is complete the first time"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a change in which two automation scripts invoke a capability that is not
    registered, one registered capability has no automation that runs it, and one unit
    of code has no way in and no exemption,
  When the guard runs,
  Then all four findings appear in the output of that single run,
    And each finding carries its own item, its own missing side, and its own clearing
      action,
    And the findings are grouped so the two of the same kind are recognisable as one
      cause,
    And the output states how many findings there are,
    And fixing all four makes the next run report none, without any finding appearing
      for the first time on that second run.
depends_on:
  - BO-2900e
  - BO-2900e-1
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-2900-runtime-reachability-guard/BO-2900c-2.yaml
    relationship: related
    status: exists
    relevance: "The rename case, which produces findings of two kinds at once and is the scenario where completeness matters most."
  - path: docs/architecture/components/build-orchestration.md
    relationship: related
    status: exists
    relevance: "The component page describing the guard's single-run report."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    guard_report:
      type: object
      description: "{ findings_by_kind: { stale_invocation: [...], uncalled_capability: [...], no_entry_point_reaches_code: [...], proof_not_through_entry_point: [...] }, total_findings: int, exemptions: exemption_inventory_report }. One report per run, assembled AFTER every check has run to completion."
  reference_file_path: "scripts/commit_guardian/commit_guardian.json"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "RUN EVERY CHECK BEFORE REPORTING. Control flow must be collect-then-report: no early return, no short-circuit, no 'if the first check found something, skip the rest'. The sequential shape — collect everything the first check produces, then stop — looks complete (several findings, a count, grouping) and still delivers the fix-then-discover cycle."
    - "GROUP BY KIND, COUNT ACROSS KINDS. Two stale invocations of the same capability are one cause with one fix and must appear together; the stated total counts all findings across all kinds so progress is legible run to run (four, then one, then none)."
    - "The total must be derived from the assembled report, not incremented as findings are produced, so a check that is skipped cannot leave the count consistent with a truncated list."
    - "The second-run emptiness is the acceptance property and it must be exercised as a real second invocation over the fixed tree, not simulated. Any finding that appears for the first time on the second run is a failure of this AC even if the first run's output looked complete."
    - "This AC assembles findings produced by BO-2900a-1/-3, BO-2900b-1 and BO-2900c-1; it must not re-derive any of them or add a fifth kind. If a cause is missing from the report the defect is in the assembly, not in the producing check."
delivers_to:
  agent: python-coder
  contract: "guard_report as specified in config_schema_fragment — the single per-run structure carrying findings grouped by kind, the total across kinds, and the exemption inventory. Consumed by the guard's output layer and by BO-2900e-3's per-cause message checks."
expects_from:
  ac_id: BO-2900e-1
  contract: "The per-finding refusal_message records ({ cause, item, missing_side, clearing_actions }) that this AC groups, counts and emits together in one run."
test_spec:
  - name: test_one_run_reports_all_four_findings_grouped_by_kind_with_a_total
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Builds a fixture tree carrying two stale invocations, one uncalled capability and one no-way-in unit, runs the real guard ONCE and asserts all four findings appear, that the two stale invocations are grouped together, that each carries its own item, missing side and clearing action, and that the stated total is 4."
  - name: test_second_run_after_fixing_all_four_reports_none_and_reveals_nothing_new
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Applies the four fixes to the same tree and runs the guard a second time; asserts a zero exit, zero findings, and that no finding kind appears that was absent from the first run's output."
  - name: test_a_failing_first_check_does_not_suppress_later_checks
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "With a finding present in the earliest-running check, asserts the later checks' findings are still present in the same output — the short-circuit implementation fails here and passes every other test in this file."
test_rationale: "The clause that carries this AC — nothing appears for the first time on the second run — is a statement about CONTROL FLOW across a whole run, and it is invisible to any test that calls the individual checks directly: each one returns its findings correctly whether or not the runner ever reaches it. Only running the real guard twice over a real fixture tree, before and after the fixes, can establish it. The third test isolates the short-circuit shape specifically because it satisfies every other clause here (multiple findings, grouping, a count) while still delivering the fix-then-discover cycle the AC exists to prevent."
