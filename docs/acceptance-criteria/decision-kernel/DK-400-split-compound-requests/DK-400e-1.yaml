id: DK-400e-1
title: "Approved parts run one at a time, in dependency order, inside the same run"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the reusable-criteria split approved with p1 and p4 waiting for no part, and p2 and p3
    waiting for p1,
  When the parts run,
  Then each part runs as a work item of the same run, not as a new run,
  And at no moment are two parts in progress at once,
  And p2 and p3 start only after p1 has settled,
  And the parts settle in the order p1, p2, p3, p4 (dependency order, taking the parts that are free
    to start in proposed order), numbered 1 to 4 with no gaps.
