id: INF-1200d-2
title: "A standard that is not a number travels in the terms it was declared in"
component: infrastructure
components:
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a standard for a kind of file that is not a threshold — a rule, a
    prohibition or an exclusion, declared without any figure — and a specialist
    the ownership record assigns that kind of file,
  When that standard is declared in the one place standards are declared and the
    specialist then begins work,
  Then that standard is stated in its material in the terms it was declared in,
  And it is not reduced to a figure, not accompanied by a figure nobody declared,
    and not omitted for having none,
  And given a threshold standard is declared for the same kind of file alongside
    it,
  When the specialist begins work,
  Then both are stated, each in its own terms, and neither displaces the other,
  And given the non-threshold standard's declared wording is then changed with
    nothing else altered,
  When the specialist begins work again,
  Then the changed wording is what is stated, so a standard expressed as words is
    carried with the same fidelity as one expressed as a number.
