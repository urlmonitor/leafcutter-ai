id: BO-2300a-2
components:
  - build_orchestration
title: "Paused-awaiting-input is a distinct state, separable from cancelled"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run that has paused at an interactive decision point with a pending
    question,
  And a separate run that reached an interactive decision point but was
    genuinely cancelled,
  When the state of each run is inspected,
  Then the paused run reports status "paused awaiting input" and the cancelled
    run reports status "cancelled",
  And the two states are distinguishable from each other,
  And only the "paused awaiting input" run is eligible to be resumed by
    supplying an answer.
depends_on: [BO-2300a]
assigned_agent: llm-expert
estimated_complexity: S
