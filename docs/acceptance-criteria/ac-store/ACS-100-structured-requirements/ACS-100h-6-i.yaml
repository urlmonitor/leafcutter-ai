notes: |
  Edge case for ACS-100h-6. A moved L2 rename is not a local edit: the old ID
  may be referenced from depends_on, covered_by, delivers_to, expects_from,
  superseded_by, or amended_by entries on completely unrelated AC files. The
  skill must require a before-and-after store-wide grep of each old ID so no
  stale reference survives the rename.
