it_requirements:
  - "CORRECT IN PLACE, do not add a second document. The document to correct is docs/reference/ac-schema.md, which today records the fail-open convention (including the unlimited form, that any unexpected exception causes the hook to exit 0) without stating its limit. Adding a new document while the old one still says the opposite leaves the next author with two rules and no ordering between them — that is the failure the criterion names."
  - "Sweep the other surfaces that state the same unlimited rule and reconcile them in the same change: docs/acceptance-criteria/guardrail-engine/PROJECT_CONTEXT.md (its FAIL-OPEN CONTRADICTION section) and docs/how-to/creating-a-claude-code-hook.md, which is what a new check author actually reads."
  - "Name the disposition storage location EXACTLY as GE-120a-2 implements it — a new key on each entry of hooks_manifest.hooks[] in templates/scripts/commit_guardian/commit_guardian.json (canonical; templates/commit-guardian/commit_guardian.json is the legacy mirror and config/ copies are build outputs). Verified: there is no pre-existing mode field to describe. SEQUENCE THIS AFTER GE-120a-2 LANDS so the location documented is the one that exists, not one the author guessed at."
  - "Use the same names for all three states that the shared outcome module actually defines (ordinary success, degraded-but-ran / not authoritative, could-not-check). Documentation that invents its own vocabulary for a machine-readable enum is drift on day one."
  - "Cite GE-116a-1-iii by id as the approved fail-open example that is NOT repealed, and state the boundary as the unit of visibility rather than blocking, matching GE-120 and GE-120a notes."
  - "Use the check_ac_parent_covered_by reproduction as the worked example with its evidence label intact (DIRECTLY OBSERVED AND REPRODUCIBLE: same check, same repo, same staged files, opposite verdicts decided purely by workspace layout). Do NOT cite the 26-schema-violating-files figure — it is REPORTED, NOT VERIFIED until GE-120c-4 runs."
  - "docs/reference/ac-schema.md is an existing tracked document: edit it, do not replace it, and keep it passing check_doc_frontmatter, check_doc_length and check_doc_links in the same commit."
test_required: false
test_rationale: "change_target is docs: the deliverable is corrected reference prose with no executable behaviour of its own. The mechanical guarantees this document describes are asserted by GE-120a-2 (the disposition field is populated and governs) and GE-120a-2-i (an omission fails), so a test here would duplicate their coverage rather than add any."
