readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  A promised kind of proof cannot quietly go unmade.

  Whoever writes a piece of work's tests is told, in the same words its plan uses,
  what each kind of proof means, so the plan's request can be acted on rather than
  guessed at. Each test then states which kind of proof it was written to give, and
  every practice the process insists on leaves a trace of its own, so nothing that
  was demanded is left without a visible answer. Before the work can be handed on,
  what was promised is checked against what was claimed: a kind of proof that was
  asked for and never written is refused by name, instead of going unnoticed. That
  check only compares the two statements — it never judges whether a test truly does
  what it says it does. Whether the work is genuinely reached when the product runs
  is settled by watching it run, and a claim on its own is never evidence that
  anything was reached.
