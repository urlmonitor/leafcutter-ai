notes: "Authored by /quick-fix. Root cause: Both dispatch prompts tell the agent to 'Return a JSON result with at minimum { \"status\": ... }', describing the reply as JSON text, while the driver enforces PHASE_RESULT_SCHEMA through the reply tool, whose fields are the schema's properties. An agent that takes 'return a JSON result' literally serialises its JSON and passes it as one string, which is the failure observed. The prompts also omit `handoff` from the status values and never name `handoff_target`, the field the driver routes handoffs on. Fix: in both prompts, replace that sentence so it tells the agent to fill the reply tool's fields directly — `status` (ok | blocker | failed | handoff), `message`, and `handoff_target` naming the next phase agent when status is handoff — and never to pass the reply as a JSON string or inside an `input` field. Edit the existing string lines in place so build-feature.js does not grow: it is already over the .js size limit. The declared twin templates/workflows-js/build-ticket.js carries the same dispatch sentence; it needs the same change, and that edit is expected and approved as part of this fix.."
