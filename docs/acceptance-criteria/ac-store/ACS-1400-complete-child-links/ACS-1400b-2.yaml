criteria: |
  Given a store containing a deliberately parked tree carrying the author-set
    parked signal, a parent whose coverage list resolves to no record at all, a
    parent that is itself retired, and a parent that simply omits a child it has,
  When the store-wide check reports on that store,
  Then every reported record carries a stated classification distinguishing a
    deliberate exclusion from unrecorded drift,
  And the parked tree's records are classified as deliberate exclusions naming the
    reason their author gave, not as findings to act on,
  And the report states the total number of records it measured against and which
    records it excluded from that total,
  And the report does not present a single aggregate count of records to act on
    without the per-classification breakdown alongside it.
