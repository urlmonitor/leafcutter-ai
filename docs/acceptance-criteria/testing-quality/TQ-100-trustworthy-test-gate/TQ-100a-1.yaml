assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The collection-error isolation must apply to the canonical CI test invocation (the `test` job in .github/workflows/ci.yml runs `python -m pytest tests/ unit_tests/`); prefer a durable config home (pytest ini addopts or a conftest hook) over a hand-typed CLI flag so the isolation cannot be lost when pytest is invoked without the flag."
  - "Must not measurably slow a clean run — collection-error isolation adds only per-file collection-time handling, never a per-test cost."
  - "Must handle the uncollectable-file case per the project error handling policy (CLAUDE.md Rules 1-4): the collection error is reported, never silently swallowed."
  - "If the isolation logic lives in deployable conftest/plugin code, the templates/ package source and the deployed copy must be edited together and kept in parity via the build.py round-trip (ADR-001 self-hosting boundary)."
  - "Must be deterministic under pytest-randomly: the partition of collectable vs uncollectable files must not depend on test ordering or seed."
delivers_to:
  agent: test-runner
  contract: "A test-run invocation that isolates per-file collection errors (--continue-on-collection-errors) so a single uncollectable file never aborts the session; the rest of the suite collects, runs, and reports."
