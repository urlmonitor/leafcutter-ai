id: AGC-100c-2
title: "How to build and verify Codex-native Leafcutter agents"
component: agent-compatibility
components: [agent_registry, build_pipeline, template_compiler, skills_system]
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given an operator or developer needs to enable Codex-native Leafcutter agents
    in a fresh or existing consumer project,
  When they follow the Codex compatibility how-to from beginning to end,
  Then the guide states the prerequisites and normal Leafcutter build command,
  And it shows how to verify AGENTS.md, the .codex/agents identity set, and the
    .agents/skills catalog,
  And it shows how to confirm the 59-identity baseline and separately verify
    architect-review-deep and conflict-resolver-deep,
  And it includes a real Codex spawn check that proves the selected specialist
    received its intended instructions and declared skill,
  And it gives one schema-valid project override example and shows how the report
    identifies the override's provenance,
  And it shows how to remove the override and return to package defaults,
  And it provides remediation for unknown aliases, missing skills, invalid TOML,
    stale identities, and Windows symbolic-link denial with copy fallback.
depends_on: [AGC-100c, AGC-100a-3, AGC-100b-3, AGC-100c-1, AGC-100d-2, AGC-100f-1]
