id: PER-100e-1a
title: "Persona expert agent template orchestrates persona creation from user input"
component: persona-management
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a user provides the request: "Create a persona for a field service engineer who maintains industrial equipment on-site"
  When the persona expert agent processes the request
  Then it derives persona attributes from the user's description:
    - identity.name: "Field Service Engineer"
    - identity.role: derived from the user's description
    - identity.archetype: a one-line summary of the persona's core motivation
    - goals: at least 2 goals inferred from the user's description
    - frustrations: at least 2 frustrations inferred from the user's description
    - context: environment and tool constraints inferred from the description
  And it invokes the persona creation script to write the persona.yaml file
  And the generated persona.yaml passes the persona validation script
