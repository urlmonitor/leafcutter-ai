criteria: |
  Every builder and every check reads the spec from the store, falling back safely to the ticket.

  Before any ticket is slimmed down, every agent and every quality check already knows how to
  read the requirement from the store and falls back to the ticket copy when a new field is
  absent -- a missing new field means "old style", never "nothing to check", so a build can
  never look green while actually verifying nothing.
