it_requirements:
  - "Covers the bare-filename suppression contract. Test fixture: allowlist entry `GENERIC_SECRET:secrets.py:*` vs findings at root `secrets.py`, `src/secrets.py`, `deploy/prod/secrets.py` — all three must be suppressed. The test must assert ALL THREE depths (root, 1-segment, 2-segment); asserting only a deeply-nested path leaves the root-level case — the one most likely to regress — unproven."
  - "Corresponding test function: `test_bare_filename_suppresses_any_depth` in `unit_tests/commit_guardian/test_scan_secrets_suppression.py`."
  - "Contrast case: path-qualified `config/secrets.py` must NOT suppress `deploy/secrets.py` — validates that path-qualified entries still require segment-suffix match. Test: `test_path_qualified_does_not_degrade_to_basename`."
  - "Filenames and rule_id in the criteria are the literal fixtures the two named tests use. Do NOT reintroduce `.env` paths here — see notes."
