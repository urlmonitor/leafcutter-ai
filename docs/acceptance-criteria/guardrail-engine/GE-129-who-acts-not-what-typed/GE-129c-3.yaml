notes: |
  WHY (b) AND (c). The existing audit entry lives in a ticket's Comments, so runs without a ticket
  file -- the fast lane on an acceptance criterion, a closure over many tickets -- would leave
  none. That is the gap this record closes.

  WHY "AFTER THE WORKTREE IS REMOVED". A record kept only in the worktree disappears at
  finalize-feature's last step, which is exactly when step 3.5's commit happens.

  FOR THE IT PO. Where the records live, and whether they are also written into the commit
  itself (trailer) or kept beside it, is not decided here.

  DECIDED 2026-09-17 (user) -- THE GAP Q1 OPENED IS CLOSED BY REFUSAL. "Dispatched means
  unattended, approved by its dispatching run" also covered a top-level session dispatching the
  commit specialist through the Agent tool in auto-accept or bypass-permissions mode. The user
  chose to refuse that dispatch (GE-129d-2-i) rather than accept it with this audit record as the
  only control. This record's three runs -- all unattended workflow runs -- are unaffected.

  declares_side_effect: true -- derived from "an audit record is persisted".
