id: DK-500b-3-i
title: A wording that matches a retired category's label is placed in its live replacement
component: decision-kernel
components:
- decision_kernel
level: L3
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given cat-40cc613f737e3323 is retired with replaced_by cat-d15d52392d7aa94c,
  And its preferred wording "Is every record that enters docs/decisions authorised by a person, either per decision or by a standing rule the person approved in an ADR, and never by a record or a precedent?" is also an other wording of cat-d15d52392d7aa94c,
  When a new sighting with exactly that wording is grouped,
  Then it is placed in cat-d15d52392d7aa94c and never in cat-40cc613f737e3323,
  And when a replacement is itself retired, the placement follows replaced_by until it reaches a category that is not retired,
  And when the retired category was split into several replacements, the wording gets "none", naming the replacements for a person to choose.
depends_on:
- DK-500b-3
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500b-3
  contract: Deterministic placement against category labels, including retired categories' replaced_by.
change_target: code
risk_surface: internal
it_requirements:
- Exact-match placement resolves a retired category's label through replaced_by to the first non-retired category. A chain is followed to its end, and a cycle in replaced_by is a validation error, never an endless loop.
- A retired category with more than one replacement yields none, with a reason naming every replacement id; nothing is guessed (precision first).
- Retired categories are never offered to Jev as options.
test_required: true
test_spec:
- name: test_retired_label_placed_in_live_replacement
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A sighting with cat-40cc613f737e3323's preferred wording is placed in cat-d15d52392d7aa94c, never in the retired category.
- name: test_replacement_chain_followed_to_live_category
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: When the replacement is itself retired, placement follows replaced_by to the first non-retired category.
- name: test_split_retired_label_gets_none_naming_replacements
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A label of a category split into several replacements gets none, naming the replacements.
test_rationale: Drive the grouping through its public entry point with a controlled Jev provider that replays recorded probabilities and counts calls, plus a recording host port that fails on any request; assert placements, reasons and call counts, not internal helpers.
