  - ac_store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader deciding whether a particular disagreement would be caught,
  When they open the component diagram for the reconciliation,
  Then it shows the fault register and the requirement store as two separate
    inputs to one comparison,
    And it shows the comparison producing conflicts as its only output,
    And it shows no arrow by which the comparison writes to either input.

  Given the diagram,
  When it is compared against what the reconciliation actually reads and writes,
  Then every input it shows is one the reconciliation reads,
    And no input the reconciliation reads is missing from it,
    And the absence of a write path is true of the running reconciliation.

  Given the diagram,
  When a reader looks for where a conflict goes once it is raised,
  Then the diagram shows the place a verdict against it is recorded as a distinct
    element, separate from the comparison,
  So the picture cannot be read as one in which detection and disposition are the
    same thing.
