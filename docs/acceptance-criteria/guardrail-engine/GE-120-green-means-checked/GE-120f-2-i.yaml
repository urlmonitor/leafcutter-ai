notes: |
  WHY THIS IS A SEPARATE RECORD AND NOT A CLAUSE OF ITS PARENT. The parent requires the
  checks to be named and the run to fail. An implementation can satisfy the naming half
  perfectly and lose the failing half at the boundary — printing every finding and handing
  back success — and the parent's clauses about naming stay green throughout. That is not a
  hypothetical shape in this repository: it is the documented-as-live, always-returns-success
  remediation path this component already shipped once, where the guard is described in the
  project's own instructions as taking an action it does not take. A documented remediation
  path that does nothing is worse than none, because authors believe they are covered.

  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSE. "No run hands back an acceptance carrying
  a note that some check's refusal was not observed." ARRIVAL COLOUR: GREEN, vacuously — no
  run exists, so none currently hands back a mislabelled acceptance. INJECTION: make the run
  always hand back an acceptance and print its findings. Under that injection the parent's
  clauses all stay green — every check is still named, with its declared input and declared
  rejection — and only this record goes RED. That asymmetry is the entire reason this file
  exists, and it is the fail-open reflex this component reaches for by habit, so run the
  mutation rather than describing it.

  SECOND NAMED MUTATION, FOR THE UNRESOLVED CLAUSE. INJECTION: treat a check whose attempt
  produced no answer as one whose rejection was not observed. Under that injection the run
  still fails and the check is still named, so the parent stays green and the earlier clauses
  here stay green; only the unresolved clause goes RED. The two conditions have opposite
  remedies — repair the check, against repair the run — and a reader who cannot tell them
  apart will repair the wrong one and conclude the tooling is unreliable.

  THIRD NAMED MUTATION, FOR THE ACCEPTANCE CLAUSE. "A run that examined at least one check
  and found every examined check's rejection observed or accepted-exempt hands back an
  acceptance." ARRIVAL COLOUR: RED — no run exists. This clause is not decoration: without
  it the requirement is satisfiable by a run that always refuses, which is the same inert
  shape one level up and is the subject of GE-120f-1-ii. INJECTION: hand back a refusal
  unconditionally; the clause must go RED.

  THE EXAMINED-AT-LEAST-ONE QUALIFIER IN THE ACCEPTANCE CLAUSE IS DELIBERATE and belongs to
  GE-120f-3, which owns the stated figure and the requirement that a run examining none fails
  as unresolved. It is written into the acceptance clause here so that this record cannot be
  satisfied by a run that examines nothing and accepts; the figure itself, and its movement
  under a varying population, are not restated here.
