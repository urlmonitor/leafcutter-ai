id: GE-117d
readiness: draft
priority: medium
title: "Get stopped before committing code that hides why it exists or where it belongs"
component: guardrail-engine
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  A commit is blocked when in-scope code fails to declare its requirement and its component.

  When new or changed code lacks a valid requirement reference or a valid
  component reference where one is required, the commit is stopped with a clear,
  actionable message naming the file and what is missing — so undeclared code can
  never silently reach the repository.
