title: "Source AC chain with no L0 ancestor produces a summary from L1 criteria only"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket's source_ac is BO-500a (level: L1)
    and BO-500a.yaml has criteria: "Computed quality gates for agent sign-offs..."
    and the depends_on chain of BO-500a does NOT lead to an L0 AC
    (e.g., depends_on is empty or points only to other L1 ACs),
  When the pull-request agent assembles the PR body's Summary section,
  Then the Goal subsection states: "(No L0 goal in AC lineage)"
  And the Feature subsection contains the L1 criteria text verbatim
  And the PR is still created successfully without error
  And the Summary section is not left empty.
