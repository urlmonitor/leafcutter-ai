criteria: |
  Given the changelog directory contains 3 entry files created after the last git tag:
    - entry-A.md with frontmatter ac_id: BO-100a (whose AC YAML has level: L1)
    - entry-B.md with frontmatter ac_id: BO-200a-1 (whose AC YAML has level: L2)
    - entry-C.md with frontmatter ac_id: BO-300a-1-i (whose AC YAML has level: L3)
  When the version computation step reads all post-tag changelog entries
    and resolves each ac_id to its AC YAML file to determine the level field,
  Then it identifies L1 as the highest flight level in this release
  And it outputs "minor" as the bump magnitude
  And it records the determining AC ID (BO-100a) in its output.
