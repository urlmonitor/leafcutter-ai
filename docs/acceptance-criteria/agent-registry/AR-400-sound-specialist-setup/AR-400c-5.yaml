notes: |
  USER DECISION 6 (BrainCandy, 2026-10-12), BINDING: the mechanical case raised
  as an open question in AR-400c-2's notes is adopted as a refusing check.
  AR-400c-2 removes the real instance (product-owner); this record stops the
  next one.

  PLACEMENT. AR-400c ("everything the build reports about a specialist's
  abilities is a real problem" -- dead grants are named there) is the natural
  host; AR-400b is at its 5-L2 cap.

  INTERPRETATION RECORDED. "Declaring signoff: false" is read literally: an
  absent `signoff:` key is not a declaration. Measured 2026-10-12: sql-coder,
  sql-function-creator, sql-index-creator, sql-procedure-creator, sql-query,
  sql-table-creator, sql-test-writer and sql-view-creator carry no `signoff:`
  key and grant signoff; product-owner and epic-supervisor carry
  `signoff: false` and grant signoff. If the user intends absent to mean false,
  the fifth clause inverts and the eight sql-* definitions need a decision.

  RESOLVED 2026-10-12 (user decision 9): supervisor-tier agents are exempt
  (epic-supervisor is tier supervisor), and an explicit `signoff: false` is the
  only trigger -- the reading above is confirmed.
