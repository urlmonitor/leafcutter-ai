id: KM-400a-1-xi
title: Mockup properties distinguish screen metadata from supporting renders
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
work_status: done
priority: medium
parent: KM-400a-1
criteria: |
  Given a canonical Mockup named fern-and-fig/cart has screen cart, authored summary and provenance, and a registration entry with different summary and tags
  When the Mockup's native fields are exposed in the repository graph
  Then its id, component, screen, title, summary, entities, source, renders, status, readiness, version and provenance retain their authored values
  And any authored example_product, realization, superseded_by, shape_version, tags and mock_data_ref remain queryable without filling omitted fields
  And every provenance entry retains its associated action, author, date string and note in source order
  And registration metadata remains separate and cannot replace the Mockup's identity, summary or tags
  And an explicitly null renders value remains distinguishable from a safe declared render that is missing, without guessing a render for the null value
  And an existing declared render remains an exact supporting source with its path and content hash, without executing its content or creating another Mockup
  And canonical unregistered Mockups remain visible, while duplicate identities, conflicting registered paths, malformed sources and render references outside the selected repository fail explicitly
  And optional omissions, explicit nulls, empty collections and future nested fields retain their source meaning
depends_on: [KM-400a-1]
