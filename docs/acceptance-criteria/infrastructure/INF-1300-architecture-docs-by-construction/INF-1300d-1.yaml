assigned_agent: python-coder
estimated_complexity: M
change_target: code
risk_surface: contract_boundary
test_required: true
it_requirements:
  - "Acceptance is decided by membership in the declared vocabulary and by nothing else. No fuzzy, prefix, edit-distance or closest-match resolution may be applied to an undeclared name, however near it is to a declared one."
  - "Normalisation before the membership decision is limited to case folding and stripping surrounding whitespace. Separator folding is forbidden - a name differing only in how its words are joined is a different name, which is precisely how the retired alias and its replacement differ."
  - "A declared name carrying the deprecation marker is accepted and the document is produced under the current name it names. The substitution must be stated on the run's own output, at a severity that is not suppressed by default; a silent correction is the plausible-looking wrong document one level down."
  - "The replacement for a retired name must be derived from the declaration rather than from a mapping held in the producer, so retiring a second name later needs no code change."
  - "A refusal for an undeclared name must write nothing anywhere, must quote the value that was asked for, must say it is not declared, and must list the declared names - read from the declaration at that moment, not from a message template."
  - "The refusal's message must distinguish 'not declared' from other failure reasons, so an author can tell a vocabulary problem from an occupancy or missing-field problem without reading source."
  - "Reading the declaration must follow the project error handling policy in CLAUDE.md. A declaration that cannot be read is a refusal, never a fallback to a built-in list of names: diagram_type_validators.py's own recorded history is that such a fallback once silently disabled enforcement everywhere."
test_spec:
  - name: test_current_declared_name_is_produced_as_asked
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: criterion
    description: "Request a document for a name the declaration carries without a deprecation marker; assert a document is produced and declares that name."
  - name: test_retired_alias_is_produced_under_the_current_name_with_the_substitution_stated
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Request a document for the declared-but-retired name. Assert a document is produced, that its frontmatter declares the CURRENT name, and that the run's output states the substitution and names the value used. Falsified by a refusal, by the retired name appearing in the document, or by a silent substitution."
  - name: test_near_miss_name_is_refused_and_nothing_is_written
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: failure
    description: "Request a name one character away from a declared one. Snapshot the whole temporary project before and after and assert the difference is empty; assert the refusal quotes the asked-for value, says it is not declared, and lists the declared names."
  - name: test_near_miss_and_retired_alias_are_exercised_against_the_same_run
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: boundary
    description: "In one test, against one built implementation, request the retired alias and then the one-character-off name. Assert the first is produced-with-substitution and the second is refused. This pairing is the record's content: a rule that passes either alone defeats the other."
  - name: test_declared_name_in_wrong_case_or_with_whitespace_is_accepted
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: boundary
    description: "Request a declared name in upper case and again with surrounding whitespace; assert both are produced. Then request the same name with its separator changed and assert it is refused."
test_rationale: >-
  The falsifying property is a relationship between two requests, not a property of one, so
  the fourth descriptor is the record rather than an extra: an implementation that
  closest-matches passes the alias arm, an implementation that accepts only current names
  passes the near-miss arm, and only running both against the same build can reject either.
  The refusal arms snapshot the whole project rather than checking the destination, because
  a refusal that has already written something elsewhere is exactly the failure INF-1300d
  exists to exclude and a destination check cannot see it. A direct-import unit test over a
  validate-name function would satisfy none of these: it cannot observe that nothing was
  written, and it cannot observe what the document that was produced actually declares.
