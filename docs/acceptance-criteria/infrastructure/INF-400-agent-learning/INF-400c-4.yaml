it_requirements:
  - "The sink path must be declared once and read by both sides — two literals kept in sync by convention do not satisfy this AC"
  - "The parity check must compare resolved paths, not source strings, so a relative-vs-absolute difference is caught"
  - "Must handle errors gracefully per the project error handling policy"
  - "Must not silently create the sink file as a side effect of resolving its path"
