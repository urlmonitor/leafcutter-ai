id: KM-KGS-100d-2
components:
  - knowledge_management
readiness: approved
priority: high
title: "Every edge points to a node that actually exists"
component: knowledge-management
level: L2
status: active
req_status: draft
work_status: in_progress
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100d.yaml"
criteria: |
  Given a knowledge map built from all declared surfaces, including the acs surface
  When the map's edges are validated
  Then every edge has both a source node and a target node that exist in the node set
  And no edge points to a target that is not a real node (no dead-end connections)
  And this holds for edges contributed by any declared surface, checked against the
    full node set rather than a hand-maintained allow-list of target ids
depends_on:
  - KM-KGS-100d
  - KM-KGS-100d-1
doc_links:
  - path: scripts/knowledge_query.py
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Edge validation must check both source_id and target_id against the full node-id set (including synthetic component hub nodes created during _collect_all), exactly as the existing phantom-edge filter does — no hand-maintained allow-list of target ids may be introduced"
  - "Component-membership edges target synthetic hub nodes that are created before the filter runs; the validation ordering must preserve that hubs exist in the node set at filter time so legitimate component edges are not dropped as dead ends"
  - "Validation must apply uniformly to edges from every declared surface, including the new acs surface, with no surface-specific exemption"
test_spec:
  - name: test_every_edge_source_exists_in_node_set
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: criterion
    description: "In a knowledge map built from all declared surfaces including acs, the source id of every validated edge, of every edge type, is present in the full node-id set"
  - name: test_non_deferred_edge_targets_exist_in_node_set
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: criterion
    description: "In the same map, the target id of every validated edge whose type is not implemented_by or covered_by (e.g. depends_on, component_membership and the other declared edge types) is present in the full node-id set, including synthetic component hub nodes; the excluded types come from one named constant marked pending the deferred decision"
  - name: test_component_membership_edges_reach_hub_nodes_after_validation
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: seam
    description: "An acs node's component_membership edge survives validation and targets a hub node that exists in the node set at validation time"
  - name: test_missing_target_dropped_uniformly_for_non_acs_surface
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: boundary
    description: "A declared non-acs surface fixture with one node-to-node edge naming a non-existent id and one naming an existing node of another surface keeps only the resolvable edge, with membership judged against the full built node set rather than an allow-list"
test_required: true
test_rationale: >-
  The criteria's every-edge-hits-a-real-node property is entangled with the deferred raw-path vs
  resolved-node decision for file-path AC edges. This contract asserts it for edge sources of all
  types and for targets of every edge type except implemented_by and covered_by, and explicitly
  excludes those two targets until the decision is made. The exclusion is test-side only, and no
  test asserts either that those edges are kept or that they are dropped. Uniform full-node-set
  membership is pinned with a non-acs surface fixture, so this does not duplicate the depends_on
  drop case owned by KM-KGS-100d-2-i.
delivers_to: null
expects_from:
  ac_id: KM-KGS-100d-1
  contract: "Per-declared-surface edge validation that checks each surface's edges against the full node set"
origin_agent: business-analyst
created: 2026-06-22
notes: |
  2026-09-16 measurement: this criterion was marked work_status: done but is not
  satisfied. The AC store declares 1454 implemented_by values and the knowledge map
  emits 641 edges; it declares 4541 covered_by values and emits 4333. Root cause is in
  the block-list reader used by the acs surface: column-zero list items are read as an
  empty list (841 files disagree with a reference reader for implemented_by, 394 for
  covered_by) and quoted items keep their quote characters (281 implemented_by, 324
  covered_by). The existing checks did not catch either, because they exercise a single
  indented-and-unquoted fixture and largely bypass the reader with a pre-built field
  dictionary. Reset done -> in_progress pending KM-KGS-100a-3-i..-viii.
