id: UXP-550
readiness: draft
priority: medium
title: "One repoRoot() seam swaps the entire Atlas to the fixture repo when mock mode is active"
component: ux-prototyping
components:
  - ux-prototyping
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given every Atlas loader resolves the paths it reads through repoRoot() (via repoPath()),
  When mock mode is active,
  Then repoRoot() returns the bundled fixture repo root instead of the live repo root,
  And because repoRoot() is the single resolution seam, all 8 Atlas views (home, /atlas,
  /coverage, /flows, /now, /pipeline, /roadmap, /architecture) render from fixtures at
  once, with no per-page and no per-loader mock branch anywhere in the code,
  And when mock mode is inactive repoRoot() returns the live repo root exactly as it does today.
depends_on:
  - UXP-593
