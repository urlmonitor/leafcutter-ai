notes: |
  ACS-500 post-implementation spot-check, GAP C edge case. Widening the id pattern
  and adding pattern_slots must not over-correct into a permissive schema. The id
  pattern must still reject genuinely malformed ids, and additionalProperties must
  stay closed (false) so typos and invented fields are still caught — only the
  known pattern_slots property is newly admitted.
