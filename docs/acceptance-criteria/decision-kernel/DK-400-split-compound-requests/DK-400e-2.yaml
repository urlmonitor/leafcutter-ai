criteria: |
  Given the split-bounds split approved with p1 kept, p2 reworded to "Decide how many child
    decisions one run may start, counting every split in the run", and p3 left out,
  When p1 and p2 each go through their own decision steps and the person approves each choice,
  Then p1 and p2 each have their own decision record staged in the run,
  And p2's record asks the reworded question, not the proposed text,
  And each record shows the split and the part it answers: dcp-split-bounds-mid-run part p1, and
    dcp-split-bounds-mid-run part p2,
  And p3 has no decision record.
