test_spec:
- name: test_ge_134a_3_stated_rule_says_a_history_block_is_not_counted
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: 'NAME KEPT, PROMISE CHANGED (GE-127d-3 supersedes the history sentence). describe_measurement_rule()
    states that comments (of every style) and standalone strings are not counted -- the general statement
    that covers a decision-history block in line-comment or trailing-string form.'
