notes: |
  THE PRODUCT OWNER'S FIRST DEFERRED QUESTION, ANSWERED HERE AND IN THE FIVE CHILDREN.
  The warning was precise: KI-BO-013's suggestion is a defensible floor for a written
  page and clearly insufficient for a screen or a prompt, and the floor for the easiest
  deliverable must not become the ceiling for all of them. This criterion states that
  as a rule; each child defines one kind's instrument.

  STRUCTURE, AND WHY THE FIVE ARE CHILDREN RATHER THAN SIBLINGS OF THIS RECORD. A
  requirement's children are capped at five, and BO-3500c already needs four for the
  invariant, the per-kind rule, the hollow-artifact guard and the undefined-kind
  refusal. One record per kind at that level would exceed the cap and force either a
  waiver or a split of a tree that is one day old. Below it there is no cap, and the
  five belong together anyway: they are five instantiations of one rule, and a reader
  who wants to know how proofs work should find them in one place.

  THE FIVE KINDS ARE CHOSEN BY WHERE THE BACKLOG ACTUALLY IS, not by symmetry. Measured
  on 2026-08-31 over not-yet-done requirements declaring a craft outside the current
  roster: prompts 463, written pages 152, diagrams 119, screens 80, workflows 44. Those
  are the five children, plus configuration, which is small in count but is the kind
  most likely to be finished on a hollow proof because a setting that nothing reads
  looks identical to a setting that works.

  THE SEAM DEFECT FOUND WHILE WRITING THIS IS NOW RESOLVED — user decision, 2026-08-31,
  and it went the other way from what this record originally assumed. The record said
  ACD-1800a-1 fixes a five-value kind enum (code, tests, docs, diagram, config) with no
  value for a screen and none for a prompt, and that either that enum grows or proof
  selection is keyed off something else. The user's answer is the second, and the reason
  is that the enum was never the right place to look:

    - DO NOT MINT A NEW KIND VOCABULARY (D1). A fifth-and-parallel artifact vocabulary is
      what that enum would have been. The store ALREADY carries a change-target
      vocabulary of ten values, carried by 3,381 of 3,694 records, and it already has a
      value for a screen and a value for a prompt and a value for a schema. Verified
      counts in live use: code 1241, pipeline 884, prompt 449, docs 260, config 90,
      schema 73, infrastructure 32, ui 10. Proof selection keys off that.
    - ADD ONE VALUE (D2). A diagram is the one kind genuinely missing from it, and the
      user's reason for needing it changes the diagram proof itself — see BO-3500c-2-ii.
    - DROP `tests` (D3). It is a proof, not an artifact. The lane's red-baseline check
      already IS the differential applied to a code deliverable, and — the load-bearing
      reason — with ACD-1800b-1a's independent per-deliverable sign-off slots, a `tests`
      kind lets one record hold a signed-off code deliverable beside an unstarted tests
      deliverable. That is a code deliverable declared finished with its own proof
      unwritten: the exact phantom-done shape, encoded in the field meant to prevent it.
      A code deliverable's test obligation already has its own home on the record.

  THE FOURTH SCENARIO IS D4 AND IS THE ONE MOST LIKELY TO BE DROPPED AS PEDANTRY. If the
  class of proof is a field an author types, the second scenario of this criterion — the
  load-bearing one, the whole point of the record — is defeated by typing: declare the
  screen deliverable to be a reading-class one and the written-page proof becomes the
  correct proof for it by declaration. So the class is DERIVED from where the deliverable
  sits and which registry claims it, and a contrary declaration is a defect to report,
  not an override to honour. Which registries those are is named in this tree's
  discussion and is the IT PO's to make concrete; the criterion states only that the
  answer is computed, never typed.

  TESTABILITY. The second and fourth scenarios are the load-bearing ones and they fail
  against different cheap implementations. The second fails the implementation that
  applies the written-page proof to everything and calls the kinds a documentation
  matter — test it by producing a screen member whose file exists and changed, and
  asserting the member is NOT finished. The fourth fails the implementation that reads a
  proof-class field off the record — test it by authoring a screen member that declares
  itself reading-class and asserting the screen proof is still the one applied.
