test_spec:
  - name: test_tq_400f_1_unfinished_grandchild_is_named_in_the_parents_verdict
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci"
    description: >-
      Subprocess the production sweep over a temp store whose finished parent has a
      finished direct child and an UNFINISHED GRANDCHILD beneath it. The parent
      receives the has-unfinished-descendants outcome and the output names that
      grandchild by id. A one-level-down traversal passes a direct-child fixture and
      fails here, which is why the fixture is a grandchild — thirteen of the sixteen
      measured L2 cases are exactly this shape.
  - name: test_tq_400f_1_store_wide_run_judges_parents_the_change_scoped_run_never_sees
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci"
    description: >-
      THE ANTI-FALSE-GREEN CONTROL, AND IT IS NOT NEGOTIABLE. Over ONE identical
      store and ONE identical git index in which neither parent is staged as
      added/modified and one parent is staged only as a RENAME (git mv), run --mode
      ci and --mode ci-changed as separate subprocesses: ci produces a verdict for
      both parents, ci-changed produces a verdict for neither. The rename limb is
      what makes KI-CG-20260826-1612 falsifiable rather than merely cited.
  - name: test_tq_400f_1_parent_and_child_verdicts_are_distinct_and_composites_are_counted
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci"
    description: >-
      In one real invocation, each parent carries its own verdict entry distinct from
      its children's; a parent all of whose descendants are finished receives a
      verdict in that same run that is NOT has-unfinished-descendants; and the run's
      reported evaluated count over that store is strictly greater than the count of
      done LEAF records in it, proving the population actually widened rather than
      being renamed.
  - name: test_tq_400f_1_traversal_reads_real_serialized_records_and_errors_on_duplicate_ids
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      Build the fixture store with the project's real serializer (yaml.safe_dump,
      column-0 block lists) or by copying real records verbatim out of
      docs/acceptance-criteria/, including one L2 with Roman-suffixed -i/-ii children
      and one feature-folder nesting level; read it in a fresh subprocess and assert
      every parent is evaluated. Add two records sharing one id (the live KI-ACD-008
      shape) and assert both are reported as an error rather than one silently
      winning the id-to-record map.
  - name: test_tq_400f_1_sweep_outcome_equals_the_per_record_oracle_outcome
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      For EVERY record in the store, the outcome the sweep reports equals the outcome
      verify_done_eligible returns for that same record — asserted per record, never
      as matching totals, because matching totals hide two offsetting
      misclassifications and offsetting misclassifications are exactly how a second
      verdict reader drifts undetected.
test_rationale: >-
  The naive test imports the traversal helper and asserts it returns the unfinished
  child for a two-level fixture. It would stay green on the defect three separate
  ways. First, on a traversal that looks only one level down, because the fixture is
  one level — and one level down misses thirteen of the sixteen measured L2 cases.
  Second, on a walker nothing invokes: a helper is reachable by import even when
  --mode ci never calls it, which is the BO-2300 phantom-build shape. Third, and this
  is the one that produced the twenty bad parents, on a verdict computed from the
  staged set, because a direct-import test has no git index at all and so cannot tell
  a store-wide sweep from the existing index-scoped check under a new name. Hence
  every descriptor runs the production CLI as a subprocess, the unfinished record is
  a grandchild rather than a child, and one descriptor compares the ci and
  ci-changed populations over one identical store with one parent present only as a
  staged rename. The duplicate-id limb is there because the store on main already
  holds duplicate ids that the required store gate does not detect, so the naive
  id-to-record map is wrong today rather than hypothetically; the oracle-agreement
  entry is there because the cheapest way to add a second verdict is to write a
  second reader.
change_target: code
risk_surface: contract_boundary
notes: |
  Measured population this must be able to see: a store-wide sweep of all 3,146
  records at 439b9076f found 20 parents marked finished with at least one
  unfinished descendant. Sixteen of the twenty sit at L2, and in thirteen of those
  every unfinished descendant is a Roman-suffixed technical-constraint sibling.
  That shape is why the traversal clause says "at any depth" and why the fixture
  in the first Given is a grandchild rather than a direct child: a check that
  looks only one level down misses the dominant real case entirely.

  The last clause is the anti-false-green control and is not negotiable. Comparing
  the store-wide run against the change-scoped run over one identical store is the
  only assertion that distinguishes a genuinely store-wide verdict from the
  existing index-scoped check under a new name — and the index-scoped version is
  precisely the implementation that would change nothing.

  Scope boundary: this AC produces the verdict only. Writing it back to the record
  is TQ-400f-2, and the interaction with the existing coverage verdict for the
  same parent is TQ-400f-1-i.
