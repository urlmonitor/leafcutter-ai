notes: |
  This is the edge case that most exposes a lazy fix. Three wrong resolutions, all of
  which would make the immediate symptom disappear:

  1. Skip the guardrail whenever the canonical location is absent, silently. That is
     indistinguishable from the guardrail not existing, and it disables the check in
     the package's own repository the first time a canonical path is mistyped.
  2. Fail closed unconditionally, per BP-1300b-1-i read out of context. In a vendoring
     consumer the canonical side is ALWAYS absent, so this blocks every consumer
     commit forever.
  3. Point the canonical resolution at the deployed copy when the source copy is
     absent. That compares a file with itself and passes always — BP-1300b-2 covers
     precisely why a deployed copy must not stand in for the canonical one.

  The correct shape is a stated applicability decision that is itself observable in
  the report, which is why the criterion demands the guardrail say WHICH location it
  looked for rather than merely returning a status.
