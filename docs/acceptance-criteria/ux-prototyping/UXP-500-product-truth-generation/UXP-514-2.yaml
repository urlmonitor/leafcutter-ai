test_required: true
test_rationale: |
  The two failure directions - a back-reference that should not be there, and one that should be
  and is not - have different causes and different fixes, so an implementation that reports them
  through one message is not actionable. They therefore need separate fixtures and separate
  assertions. Testing against the live store is useless here for the same reason as D1: the
  generator writes what the validator inverts.
test_spec:
  - name: test_stale_back_reference_is_reported_with_held_and_inverted_values
    target_dir: unit_tests/product_truth/
    description: "A criterion holding a back-reference to a step that no longer names it produces a finding stating both values."
    type: integration
    angle: failure
    framework: unittest
  - name: test_missing_back_reference_is_reported_separately_from_a_stale_one
    target_dir: unit_tests/product_truth/
    description: "A criterion named by a step but holding no back-reference produces a distinct missing-back-reference finding."
    type: integration
    angle: failure
    framework: unittest
  - name: test_agreeing_back_reference_is_not_reported
    target_dir: unit_tests/product_truth/
    description: "A criterion whose back-reference equals the inversion produces no D2 finding."
    type: integration
    angle: boundary
    framework: unittest
notes: |
  D2 of the four checks UXP-514 names. The separate-reporting clause is new relative to UXP-514,
  which folds "differs" and "carries one no flow references" into a single And; they are
  different defects and the split is deliberate.
