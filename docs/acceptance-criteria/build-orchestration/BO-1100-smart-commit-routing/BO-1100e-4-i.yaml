id: BO-1100e-4-i
title: "Negative max_commits value is rejected before querying git history"
component: build-orchestration
level: L3
status: active
readiness: reviewed
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the history filter is invoked with max_commits set to -1,
  When the filter validates its input parameters,
  Then the filter rejects the invocation with an error stating that max_commits
    must be a positive integer greater than zero,
  And the filter does NOT pass -1 to the underlying git query
    (which would silently return unlimited history),
  And no git subprocess is spawned for this invocation.

  Given the history filter is invoked with max_commits set to -100,
  When the filter validates its input parameters,
  Then the same rejection occurs as for -1,
  And no git subprocess is spawned.
