notes: |
  Keeps gap counts honest in both directions (DK-400 ROADMAP ALIGNMENT): a compound request
  is not counted as a gap, and a real gap is not hidden behind a split.
  DECIDED (user answer to BA open question Q1, 2026-10-05): when the person REJECTS the split
  of a turned-away request, the run still records the capability gap, as today. That case is
  DK-400d-3-i (mock-data v5 capability_gap_recorded). This AC covers the approved case, where no
  gap is recorded for the request.
