created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500b-3.yaml"
criteria: |
  Given the commit step's configuration sets the transient-retry ceiling to 3 and the package is
    installed,
  And four consecutive commit agent replies for the same commit each carry commit_answer.status
    refused with reason_code step_index_locked,
  When the COMMIT-ANSWER block's decision is taken after each reply,
  Then the decisions are retry, retry, retry, report, in that order,
  And every retry offers the same path list and message file as the first attempt,
  And the report names all four answers in the order they arrived.

  Given the same ceiling of 3,
  And the first two replies carry reason_code step_vcs_error and the third carries status committed,
  When the decision is taken after each reply,
  Then the decisions are retry, retry, continue.

  Given the commit step's configuration is changed to set the ceiling to 1 and the package is
    installed again, with no change to the block's source,
  When two consecutive replies each carry reason_code step_index_locked,
  Then the decisions are retry, report.

  Given the commit step's configuration does not set a transient-retry ceiling,
  When the package is installed,
  Then the install fails with a message naming the missing setting,
  And no installed route carries a ceiling the configuration did not supply.
depends_on: [BO-4500b-3]
