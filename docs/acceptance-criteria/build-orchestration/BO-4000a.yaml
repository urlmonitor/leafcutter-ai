notes: |
  NAMED MUTATIONS (each turns only this record's tests red):
    M1 — adopt whatever path the worktree agent reports (the incident behaviour). Caught by
         test_reported_location_other_than_instructed_stops_before_any_phase_agent.
    M2 — compare instructed and reported locations by raw string equality. Caught by
         test_same_location_in_another_spelling_is_accepted.
    M3 — treat an unreadable result as "no worktree needed" and continue in the current
         directory. Caught by test_unreadable_worktree_result_refuses_distinguishably_from_wrong_location.
    M4 — let any later agent result's worktree_path overwrite the run's worktree. Caught by
         test_later_worktree_path_in_an_agent_result_does_not_replace_the_resolved_worktree.

  Refusing after the agent has already run cannot undo a nested checkout it may have
  created. This record stops the run from building on one. It does not remove the nested
  checkout. Stating that plainly so no one reads the refusal as a repair. Cleaning up
  after a disobedient agent would be a separate, explicitly requested capability.
