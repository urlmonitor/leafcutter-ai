title: "A mock-data agent drafts or extends the one canonical dataset for the classified entities"
component: ux-prototyping
level: L2
status: active
readiness: approved
priority: medium
req_status: approved
work_status: todo
criteria: |
  Given a classified request naming a component and its entities,
  When the mock-data agent (mock-data-author) runs,
  Then it searches the product-truth store for an existing canonical dataset for those entities,
  And it extends that dataset in place (bumping version, appending provenance) when one exists,
  And it creates a new *.mock.json only when none exists,
  And it never creates a second dataset for an entity a component already has.
