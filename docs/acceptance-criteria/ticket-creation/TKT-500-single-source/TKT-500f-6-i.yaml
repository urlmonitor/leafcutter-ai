created_by: "docs/acceptance-criteria/ticket-creation/TKT-500-single-source/TKT-500f.yaml"
criteria: |
  Given a leaf AC whose files_touched list contains a mix of paths:
    one implementation file "scripts/ac_store/generate_ticket_from_ac.py",
    one documentation file "docs/reference/ac-schema.md",
    and one configuration file "config/agent_registry.json",
  When a ticket is generated from that AC by an AC-to-ticket generator,
  Then the generated ticket body contains a section headed "## Test Requirements",
  And that section contains at least one test stub entry for the
    "scripts/ac_store/generate_ticket_from_ac.py" implementation file,
  And the documentation and configuration files do not suppress the section.
depends_on: [TKT-500f-6]
doc_links:
  - path: scripts/goal_to_epic.py
    relationship: constrains
    status: exists
    relevance: "Facade only since the 2026-09-14 decomposition. The goal-path generator this AC constrains is now scripts/ac_store/epic_tickets.py, below."
  - path: scripts/ac_store/epic_tickets.py
    relationship: constrains
    status: exists
    relevance: "Owns _call_generate_ticket_from_ac and generate_tickets_for_leaves — the goal-path half of the two generators this AC constrains."
  - path: scripts/ac_store/generate_ticket_from_ac.py
    relationship: constrains
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The section-required decision is triggered by the presence of ANY qualifying implementation .py entry, regardless of how many docs/config entries accompany it (logical OR over qualifying entries, not a unanimity check)."
  - "Use the same shared classification helper as TKT-500f-6; the mixed-list case must exercise the same branch, not a separate code path."
delivers_to: null
