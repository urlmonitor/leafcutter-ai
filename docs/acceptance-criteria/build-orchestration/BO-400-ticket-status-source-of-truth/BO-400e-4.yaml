test_spec:
  - name: test_four_tickets_in_one_run_receive_one_answer_three_refused_one_written
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: boundary
    description: "Drive FOUR tickets through the real workflow in ONE run: three in the identical state (same phases named needed, every one signed off except the same single phase in all three, which has no sign-off) plus a fourth whose every needed phase is signed off. Assert the three receive the same answer as each other, that the answer is refusal -- no recorded state changed, the same outstanding phase named in each -- and that the fourth is written finished. FOUR SEPARATE SINGLE-TICKET RUNS DO NOT REPRODUCE THIS: the defect is the disagreement between tickets inside one run, so per-ticket assertions gathered from independent runs pass on the broken driver."
  - name: test_answers_do_not_vary_with_the_order_the_run_reaches_the_four_tickets
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: criterion
    description: "Re-drive THE SAME four-tickets-in-one-run fixture with the tickets permuted -- including runs in which the control ticket is reached first and last -- and assert each ticket's answer is unchanged by its position. The observed split correlated with position in the run (ticket 01 refused, 03 and 20 written), so an answer that moves with order has relocated the disagreement rather than removed it. Must reuse the one-run fixture: permuting four independent single-ticket runs proves nothing."
  - name: test_a_second_run_over_the_same_four_tickets_produces_the_same_four_answers
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: criterion
    description: "Restore the same four tickets to the same state and drive a SECOND full run, asserting the four answers match the first run's four answers exactly. Covers the criteria's second-run clause; combined with the control ticket it also proves the repeatability is not the trivial repeatability of a writer that refuses everything."
  - name: test_one_answer_per_condition_is_reachable_from_a_real_workflow_run
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: reachability
    description: "REQUIRED -- invoke the production entry point: load and execute the real workflow script via unit_tests/prompt_assembly/harness_build_ticket_guard.mjs, carrying all four tickets in one run, and assert the per-ticket record writes the run actually performed. Do NOT satisfy this by importing the completion helper and calling it four times: that is the single-ticket shape the record's own rationale rules out, and it passes on the broken driver. AUTHORED DELIBERATELY (it-po): because this record carries an authored test_spec, the ticket generator's own reachability floor would otherwise append a generic sentinel whose text asserts 'the AC authored no test_spec, so the entry point is not declared' -- false here, and misleading on precisely the record whose entry point and run shape are load-bearing."
test_rationale: |
  Authored here as a deliberate single exception to it-po's ownership of test_spec, at the
  coordinator's instruction; it is NOT precedent, and every other record in this family
  leaves test_spec unauthored for it-po.

  The reason is mechanical rather than editorial. The parent BO-400e is explicit that a
  single-ticket test cannot see this defect at all, because either branch looks correct in
  isolation -- the defect IS the disagreement between two tickets. That constraint is
  carried in this record's criteria, notes and harness doc_link, and none of those three
  survive into the generated ticket's Test Requirements section: the generator derives that
  section from test_spec, falling back to one descriptor per Gherkin Then clause. Under the
  fallback a test-writer could satisfy every Then with a per-ticket assertion, produce four
  independent single-ticket tests, and look correct while proving nothing. The descriptor
  above is the only place the four-tickets-one-run shape becomes a mechanical requirement
  at ticket-generation time.

  The angle is boundary rather than criterion. The taxonomy's boundary question is
  empty / one / many, and cardinality is exactly what is load-bearing here: at one ticket
  the behaviour is indistinguishable between the broken and fixed driver, and only at many
  does the property under test -- one answer per condition -- become observable at all.
  Tagging it criterion would describe it as an ordinary Then-clause check and lose the one
  fact that makes the test valid.

  ADDENDUM (it-po, 2026-09-07) -- three descriptors APPENDED, the authored one above
  untouched. The paragraphs above are the coordinator's and stand verbatim; the first
  descriptor is unmodified. Three were added after it, and none of them dilutes it,
  because each is bound to the same four-tickets-in-one-run fixture rather than to a
  ticket in isolation.

  Two of the three cover Then clauses the authored descriptor does not assert: that the
  answers do not vary with the order the run reaches the tickets, and that a second run
  over the same four produces the same four answers. Both are separate clauses in the
  criteria, and both are properties of a RUN, so neither can be folded into a descriptor
  about a single pass without changing what that descriptor asserts.

  The third is a reachability descriptor, and it is here for a mechanical reason that has
  changed since the rationale above was written. Under BO-2900g-1 the reachability floor
  is no longer attached inside the criteria-derived fallback alone -- _ensure_reachability_
  floor now runs at the single point every finalised test plan passes through, so an
  authored test_spec DOES receive a generator-appended entry. But the appended sentinel
  carries fixed text stating that the AC authored no test_spec and that the entry point is
  therefore undeclared. On this record both halves are false, and the instruction to go and
  resolve an entry point is precisely the invitation to write the single-ticket test the
  rationale above exists to forbid. Authoring the reachability entry explicitly takes the
  dedupe-by-angle branch, so the sentinel is never appended and the entry point -- the real
  workflow script driven through harness_build_ticket_guard.mjs with all four tickets in one
  run -- is named where the test author will read it.
