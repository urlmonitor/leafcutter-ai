id: BO-1600d-1
readiness: approved
priority: high
title: "Recovery is human-invoked and confirmation-gated — it never runs inside the automatic drive loop"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
created_by: "docs/acceptance-criteria/build-orchestration/BO-1600-safe-concurrent-dispatch/BO-1600d.yaml"
criteria: |
  Given the corruption-detection halt from BO-1600c has stopped a parallel drive
    and reported that the shared repository is in a damaged state
  When a parallel drive loop is running
  Then the drive loop never invokes the guided recovery on its own — recovery is
    only ever started by an explicit human action (a person running the recovery
    entry point), never by the orchestrator continuing automatically
  And when the recovery entry point is started, it takes no action that changes the
    repository until the human confirms; absent a confirmation it makes no git write
  And the halt path from BO-1600c only reports the damage and points the human at the
    recovery entry point — it does not chain into running recovery itself
  And even when the explicit execute flag is supplied, recovery refuses to run in a
    non-interactive context (no attached terminal): it prints that an interactive
    terminal is required and makes no git write, so a stray execute flag in an automated
    script or drive loop can never run the destructive plan unattended
