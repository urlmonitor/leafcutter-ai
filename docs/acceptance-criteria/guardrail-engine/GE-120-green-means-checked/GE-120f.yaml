notes: |
  WHAT THIS L1 ADDS THAT ITS FOUR SIBLINGS DO NOT. GE-120a is about a check that
  KNOWS it could not run and must say so. GE-120b is about the same check reaching
  the same verdict from any working copy. GE-120c is about proving that sameness by
  running the real checks. GE-120e is about a block being attributable to something
  you actually did. Every one of them presumes a check whose refusal is reachable and
  asks whether its verdict is CORRECT. The shape here is the one none of them can
  see: a check that is right on every input it is ever given, because it has no
  reachable refusal at all. It never reports a degraded outcome, because it never
  degrades. It reaches the same verdict everywhere, because it reaches the same
  verdict on everything.

  PARENT CHOICE — GE-120, deliberately, over GE-126.
    GE-120's L0 sentence is "Trust that a green check actually checked something",
    and its criteria draw the line at green meaning it was checked rather than that
    it could not run. A guard with an unreachable refusal is that failure in its
    purest form: it is green on every input including the ones it exists to stop.
    GE-126's L0 is the INTERROGATION surface — what you get back when you hand a
    check your own file, run a copy of it, or follow the procedure for adding one.
    That is a narrower reader. The worked example fails during ordinary editing, with
    nobody interrogating anything, so filing it under the interrogation goal would put
    the general condition beneath a specific way of noticing it. GE-120 is the right
    parent and this record does not restate any of GE-120a..e.

  WHY A NEW L1 AND NOT MORE L2s — CAPACITY, MEASURED, NOT PREFERENCE.
    As of 2026-09-01 every L1 under both GE-120 and GE-126 is at the five-L2 cap
    (GE-120c already carries a live child_limit_override: 6 and sits at 6). Both L0s
    hold five L1s against a cap of seven, so the two free slots at L1 are the only
    room in this family. The alternative — a sixth child under an existing L1 — needs
    a child_limit_override, the same temporary waiver this store keeps having to
    discharge; BP-100k's was DISCHARGED rather than raised in the 2026-08-26 split, so
    do not read its history as headroom.

  THE FREEZE ON THIS FOLDER HAS EXPIRED — VERIFIED, NOT ASSUMED.
    GE-126's L0 notes (written 2026-08-26) state that
    unit_tests/commit_guardian/test_ge_122e_1.py asserts
    `git diff origin/main -- <this folder>` is EMPTY, so neither a new child file nor
    an appended covered_by entry is possible here. That claim is STALE and was already
    stale when it was written. The module was amended 2026-08-18 to an id-stability
    set-difference: it asserts every id the folder claimed at the baseline is still
    claimed, and every yaml under the folder declares an id beginning GE-120. Its own
    docstring says the check "remains one-directional on purpose: ADDING a record to
    the tree is ordinary growth ... and must not fail", and records that the freeze,
    not the merits, is what closed this parent to the GE-118c record a day earlier.
    Both assertions were re-read in full before this file was written, and this record
    satisfies both. Standing rule from this component holds and is reaffirmed: read the
    guard test over a candidate parent, never a note describing it.

  BOUNDARIES FOR THE BA — four adjacent owners, none of them sufficient, and the
  worked example is the proof of that.
    - BP-1600a-2 (approved) owns ENUMERATION FOR THE COMMIT-GUARDIAN SURFACE ONLY:
      which guards are in that set at all. Its criteria are scoped by their own
      first Given to "one place" — the directory where the commit-guardian's check
      scripts live — so its census reaches that surface and no other.
    - BP-100k-4 owns REACHABILITY for a REGISTERED gate whose trigger can never match.
    - TQ-500 owns falsifiability of TESTS. This L1 owns falsifiability of GUARDS.
    - GE-120c-6 owns a deployed guard that nothing invokes. (Subordinated to
      BP-1600a-2 by user decision 2026-09-07 — the two specify the same census; see
      both records. That subordination does not change this boundary: neither
      reaches the surface described next.)
    readme_read_guard is registered, invoked, reachable and running on every edit —
    and unable to refuse. It passes all four and is the thing this L1 exists to
    catch. Do not let decomposition close any of the four as a duplicate of this
    one, and do not let this one be closed as a duplicate of them.

    CORRECTED 2026-09-07 — THIS NOTE PREVIOUSLY SAID readme_read_guard WAS
    "ENUMERATED", AND THAT WAS FALSE. It is wired in templates/settings.json, a
    registration surface BP-1600a-2 never lists and structurally cannot reach: that
    AC's population is "every gate script held anywhere beneath" the commit-guardian
    directory, and templates/hooks/readme_read_guard.py is not beneath it. So the
    worked example passes the enumeration boundary not because a census looked at it
    and found it present, but because NO CENSUS LOOKS AT IT AT ALL. That single word
    is why the second surface reads as covered when nothing covers it.

    NO AC TODAY TAKES A CENSUS OF THE settings.json / templates/hooks/ SURFACE, and
    it is not a small surface. Measured 2026-09-07: templates/hooks/ holds 13
    scripts and templates/settings.json wires 11 of them. The two named by nothing
    anywhere are check_ticket_no_branch_move.py and check_ticket_state_integrity.py
    — both already OBSERVED as unwired in GE-122a-2:65 ("registered in no
    settings.json entry, no hooks_manifest, no CI job, and no git post-merge
    installer, so it has never run in anger") and GE-122e-2:68 ("it is currently
    registered nowhere, so it will not fire today") — and demanded by no
    requirement. That gap is a finding for the store, not a decomposition target for
    this L1: this L1 owns whether a guard can refuse, not whether a guard is in the
    set. It is recorded here so the next reader does not infer coverage from the
    corrected sentence's silence, as the previous reader could infer it from the
    false one.

  THE REGIME IS SPLIT ACROSS TWO GOALS, AND THE SPLIT IS A CAPACITY ARTIFACT.
    Four records of this regime were authored on 2026-09-01 under GE-126b and GE-126c
    (GE-126b-5, GE-126b-5-i, GE-126c-5, GE-126c-5-i) plus two under BP-100n. They land
    in the same commit as this L1 and MUST NOT be re-authored, restated or duplicated
    beneath it. This L1 is the home for the remaining three to five behaviours of the
    regime. Two consequences the BA should carry rather than resolve silently:
      - Cross-link in both directions when decomposing, so neither half reads as the
        whole rule.
      - Whether the GE-126b-5 / GE-126c-5 records should eventually be re-homed under
        this L1 is a USER decision, not a BA one. It is worth raising precisely because
        part of the reason they went to GE-126 was the expired freeze recorded above.
        Do not move them as part of decomposing this record.

  EVIDENCE, WITH CONFIDENCE LABELS — carry them through and do not upgrade them.
    - DIRECTLY OBSERVED AND RE-DERIVED IN THIS WORKTREE, 2026-09-01, using the guard's
      own gating helper: templates/hooks/readme_read_guard.py gates nothing. Three of
      its four prefixes resolve through symlinks into the deployed tree and stop
      matching; the fourth names alembic/, which this repository does not contain.
      The inertness arises by TWO different mechanisms depending on layout — an
      exception in the main workspace, a plain failed prefix match inside a worktree —
      so a repair that handles only the first leaves every worktree inert, and
      worktrees are where the drives run.
    - COUNT IS DISPUTED AND MUST NOT BE CITED. The brief for this record states nine
      instances of this shape in roughly 36 hours; GE-126b-5, written the same day,
      states eight. No criterion below this record may state or imply a figure. The
      individually named instances stand on their own; the population is exactly what
      GE-126e's census exists to measure, and until it has run there is no number.
    - READ FROM SOURCE, NOT DISPUTED: config/verification_flow.schema.json states the
      principle and models the vocabulary, and has no code reader. The vocabulary was
      invented, one instance document was produced, and the validator was never built.

  ANTI-GREP, AND IT IS THE WHOLE SUBJECT — restate this in every L2 below this record.
    A criterion satisfiable by asserting that a declaration exists, that a list has an
    entry, or that a function is defined reproduces this defect one level up. The
    declaration must be READ BACK: feed the stated known-bad input through the check's
    real entry point and require the stated refusal to be observed. Note also that
    templates/scripts/commit_guardian is canonical and scripts/commit_guardian is a
    symlink into the deployed tree — a mutation proof applied to the copy the test does
    not load fails GREEN, which is instance one of this same family.

  DAY-ONE BLAST RADIUS IS THE CORRECT OUTCOME. On the commit that lands this, most
  guards will report that no refusal has ever been demonstrated, because none has.
  That is the true state. It must not be pre-suppressed by seeding records, and the
  natural remedy for the resulting noise — weakening the rule until it goes quiet — is
  the failure mode to design against. An honest exemption for guards that genuinely
  count or measure rather than accept or reject is required; a postponement is not a
  ground for one.

  documentation_triggers is [reference-doc] because a rule the whole family must obey
  has to be written where the next check author will find it, and because what is
  currently written down is a vocabulary with no reader. No component-diagram trigger:
  the execution surface is GE-120c's and should be extended, not duplicated.

  Authored at the PO stage; L1 only. No L2, no L3, no test_spec, no it_requirements,
  no assigned_agent — the BA and IT PO own those.
