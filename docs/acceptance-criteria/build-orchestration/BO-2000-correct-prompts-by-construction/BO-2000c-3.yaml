  - name: test_resolved_path_reaches_the_ticket_via_the_generator_cli
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "In test_reference_pattern_resolution.py::TestResolvedPathReachesTicketViaCli. PRODUCTION ENTRY POINT: runs generate_ticket_from_ac.py as a subprocess against a real on-disk AC YAML (yaml.safe_dump-serialised) and reads the Implementation Notes out of what the CLI actually emitted — asserting the concrete path is present and the raw glob is not. Guards against a fix correct in the helper that never reaches the artifact."
