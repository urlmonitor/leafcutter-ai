notes: |
  Sibling of BO-530 under the BO-500 quality-gates tree. depends_on follows the
  sibling-chain convention observed across BO-510..BO-560 (BO-530 chains via
  [BO-510, BO-610]; BO-560 via [BO-510, BO-610]) -- L1 siblings chain through the
  trait registry (BO-510) and change-type taxonomy (BO-610) rather than pointing
  at the BO-500 L0 directly. The hook (check_ac_limits) counts L0->L1 children by
  id-derivation; a root-form BO-NNN id derives to no parent, so this L1 (like its
  siblings) is not attributed to BO-500 by the hook and cannot breach the L0 cap.

  Pattern C note: the four moved L2s were RENAMED (BO-530-4a/4b/5a/5b ->
  BO-570-1/2/3/4) and their five L3s renamed transitively. Renaming is mandatory
  because check_ac_limits attributes children by id-derivation, not depends_on --
  keeping the old BO-530-* ids would leave BO-530 at 7 L2 children and the commit
  would still be blocked. See the ac-tree-split skill, Pattern C step 6.
change_target: prompt
