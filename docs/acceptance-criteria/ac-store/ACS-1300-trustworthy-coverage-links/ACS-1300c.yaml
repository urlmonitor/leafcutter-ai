title: "A repair that fixes the record without deciding what is finished"
component: ac-store
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  It restores evidence, reports what it could not judge, and awards nothing.

  Recording that a test proves a requirement never promotes that requirement to
  finished — that judgement stays where it already lives, behind its own evidence.
  A record with nothing to repair is left exactly as it was, and evidence the tool
  cannot trust produces a stated abstention rather than a silent skip or a guess.
