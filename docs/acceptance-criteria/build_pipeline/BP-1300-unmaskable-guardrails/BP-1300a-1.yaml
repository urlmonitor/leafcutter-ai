assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The check must resolve each skills_invoked skill_id against the canonical source (templates/skills + registry), not the deployed .claude/skills tree."
  - "An unresolvable skill_id must fail the build with a non-zero exit and a message naming the skill_id and the referencing entry."
  - "The verdict must be deterministic and environment-independent (identical local and CI)."
  - "Resolution must extend the build's existing skill-pointer handling in scripts/build.py / scripts/build_phases.py, keeping a single source of truth for skill resolution rather than adding a parallel checker."
