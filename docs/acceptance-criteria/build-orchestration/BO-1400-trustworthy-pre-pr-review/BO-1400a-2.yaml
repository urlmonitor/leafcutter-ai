title: "Pre-PR review confirms a delivered artifact lands in the deployable package source, not only a build-output tree"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1400-trustworthy-pre-pr-review/BO-1400a.yaml"
criteria: |
  Given a ticket under pre-PR review whose diff adds or modifies an artifact that is
    meant to ship to consumers (for example a pre-commit hook, a script, or a template
    that a fresh install is supposed to receive)
  When the pre-PR self-review reviews that diff
  Then the review confirms the artifact is present in the deployable package source that
    a clean install copies from (the package source tree, e.g. under templates/)
  And the review raises a blocking finding when the only copy of a consumer-facing
    artifact lives in a build-output tree that a clean install does not copy from
    (e.g. a gitignored or generated scripts/ output), so the artifact would not survive
    a fresh build-and-install
  And the review cannot return a clean verdict on the delivery while the artifact exists
    only in the build-output tree and not in the deployable package source
