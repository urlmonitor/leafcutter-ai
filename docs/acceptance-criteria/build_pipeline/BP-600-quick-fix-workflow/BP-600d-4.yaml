id: BP-600d-4
components:
  - build_pipeline
title: "Quick-fix pushes its commits to origin and closes the run"
component: build-pipeline
level: L2
status: active
readiness: reviewed
priority: medium
work_status: done
criteria: |
  Given the commit phase has completed successfully and the changelog entry has
    been committed,
  When the workflow reaches the close phase,
  Then it pushes every commit this run produced — the fix commit and the
    changelog commit — to the active branch's remote,
  And if the push fails the workflow halts and says the work is committed
    locally but not visible on the remote, giving the recovery command, rather
    than reporting the run as closed,
  And if a PR already exists for the active branch, the push updates that PR
    with the new commits automatically and the workflow reports its URL without
    opening a second one,
  And if no PR exists for the active branch, the close phase follows BP-600d-4-i,
    which opens one only behind an explicit user confirmation,
  And the workflow reports a completion summary naming the AC, the test, the
    fixed file, the changelog entry, the worktree, the branch, and the PR URL or
    its absence,
  And it does not merge the PR.
