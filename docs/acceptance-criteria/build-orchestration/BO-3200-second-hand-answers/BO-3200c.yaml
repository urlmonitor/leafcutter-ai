notes: |
  SCOPE — READ BEFORE DECOMPOSING. Half of this is already fixed and must not be
  re-specified. PR #565 (88c6395e) stopped the gates defaulting to discard, so a
  refusal no longer destroys authored work. The REMAINING value is that the
  question genuinely reaches a person, and that no reply from anything other than
  that person can be read as their answer.

  Anchor case (KI-ACD-005, blocker, open): gates documented as user decision
  points were dispatched as prompts to a reporting specialist. It replied that
  approving these artifacts is not its job. That reply was parsed as an answer of
  "cancel" and the pipeline discarded already-authored work. Note the specialist
  was right and said so clearly; the defect is that a refusal and a decision were
  not distinguishable to the caller.

  The distinction the BA must make explicit: "no answer available" and "the user
  answered no" are different outcomes with different consequences, and they were
  collapsed into one. They must remain distinguishable at every gate, not just
  the three that were patched.

  Known constraint from KI-SS-001, relevant to how this can be built: the ability
  to put a question to the user is not available to a specialist — the harness
  removes it. So the gate has to be raised at a level that still has it. This is
  the same structural point as BO-3100c and the two should be sequenced together.

  IT-PO ENRICHMENT NOTE (2026-08-26). risk_surface is `auth` for this L1 and for
  c-1, c-2, c-3 and c-3-i: the property under test is the PROVENANCE of an answer
  that settles a consent gate — whether the reply came from the party authorised to
  give it. BO-3200c-2's first scenario is literally an authentication requirement
  (a well-formed, permitted-value decision from a non-person must be rejected
  BECAUSE of who sent it, not because of how it is shaped). c-4 and c-5 are
  documentation and carry `internal`.

  BUILD ON THE EXISTING PAUSE SUBSTRATE. ADR-024 and scripts/pause_store.py already
  provide a resumable pause record; BO-3200c-1 must extend that rather than author a
  second pause mechanism. Two pause stores would be two places for a resumable record
  to be lost, and the AC's third scenario — the resume that finds the work unchanged
  — is what would silently stop holding.
