id: TQ-600a-12
components:
  - testing_quality
  - build_pipeline
title: "The shared-layout fixture's own tests stop producing the layout twenty-three times to run twenty-seven tests"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the 27 tests under unit_tests/suite_performance/, 1,535 s between them and
    29% of all measured suite time, each of which starts a child pytest session in a
    separate operating-system process,
  And the shared layout's run identity, which prefers the run-identifier environment
    variable the parallel runner sets and otherwise falls back to a value generated
    once per operating-system process — so a child session, inheriting no such
    variable, resolves a run identity of its own, finds no layout at it, and produces
    one from scratch, roughly 23 times across the 27 tests,
  And the measured cost of one production: 3.58 s to copy the source tree, 11,651
    entries and 96 MB, plus 45.36 s for the self-targeting build against that copy,
    48.94 s in total — against 2.07 s to copy a layout that already exists, a ratio
    of 23.7,
  And the already-verified fact that the helper starting those child sessions
    already assembles an environment dictionary and applies caller overrides to it,
    so the shared route needs no production change at all,
  When a parent test module produces the layout once and starts each of its child
    sessions carrying that same run identity in the child's environment,
  Then every child session resolves the one layout its parent already produced and
    runs no build of its own,
  And the layout root each child reports is the one the parent produced,
  And for a caller that needs a private root rather than the shared one, the
    private-copy route accepts a seed directory and copies that finished layout,
    instead of copying the source tree and running a build against the copy,
  And a private root obtained from a seed is indistinguishable in content from one
    obtained the long way: the same entries, the same bytes, and the same
    completeness record the private route already requires before it hands a root
    back,
  And the elapsed time for the 17 eligible tests named in TQ-600a-12-ii falls to at
    most one quarter of their measured 1,069 s, compared against a baseline taken on
    the same machine in the same sitting.
