title: "Knowledge capture does not block agent exit if route-learning or capture-learning is unavailable"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
criteria: |
  Given a v3 agent's post-work knowledge-capture step fires,
  And the agent has discovered a learning worth persisting,
  But the route-learning skill is not available (e.g., the skill file is missing
    from the deployed .claude/skills/ directory),
  When the agent attempts to invoke route-learning,
  Then the agent logs a warning: "route-learning skill unavailable; learning not persisted",
  And the agent proceeds to exit without the learning being captured,
  And the agent's primary output (AC YAML files) is not affected,
  And no error is returned to the calling supervisor or pipeline.
