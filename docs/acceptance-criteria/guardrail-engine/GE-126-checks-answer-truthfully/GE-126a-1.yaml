id: GE-126a-1
title: "A record you name on the command line is the record that gets judged"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the deployed AC-governance check is invoked out of process with the path of
    one acceptance-criterion record named as its only command-line target,
  And that record genuinely violates the rule the check enforces — it is a record new
    to the index that carries no originating-agent field at all,
  When the check finishes,
  Then the check refuses that record: the outcome it reports is a refusal and the
    accompanying text names the record by the path that was handed to it and names
    the rule it broke,
  And a second invocation identical in every respect except that the named record
    carries a valid originating-agent field reports an ordinary pass,
  And the refusal and the pass are told apart by the outcome value alone without any
    caller having to read prose,
  And the behaviour recorded on 2026-08-25 — the ordinary success outcome returned by
    a run that never read the file whose path it was given — is no longer producible
    on this path with any command-line target.

  Coverage note: covered only by a test that executes the deployed check in a separate
  process against a record known to violate the rule and asserts on the outcome. A test
  that hands the check a clean record does not cover this criterion, because a check
  that discarded the argument entirely also passes that test. A test that searches the
  check's source for argument handling does not cover it either — a grep-only test
  passes on dead code (CLAUDE.md, "Gate / Workflow ACs — Verify Behaviorally, Not by
  Grep").
