amended_by:
  - reason: "amend (not supersede), 2026-08-18: the delivery obligation is widened from 'a PR is opened' to 'a landable PR is opened'. Withdrawn wording: 'And the operator does not run commit or open the PR by hand,' — retained and extended to 'And the operator does not run commit, write a changelog entry, or open the PR by hand,'; a new clause requires the PR to satisfy the repository's required merge checks, including a changelog entry when and only when the change requires one. Nothing in the pre-amendment criterion was wrong: the shipped code commits, opens the PR, and keeps the operator's hands off both, exactly as written. It under-specified. The gap is a blocker in practice — the lane's first end-to-end PR (#465) opened with 5 of 6 required checks green, 'Changelog entry present' failing and mergeable_state blocked, and had to be completed by hand in b3124ff25 (KI-BO-001). Requiring the operator to hand-write a changelog before the PR can merge defeats this criterion's evident intent — hands-off delivery — even though it does not break its letter, so the intent is now stated rather than implied. Decomposed into BO-2400f-4-i (requirement decision tracks the merge check's own rule), -ii (exempt-only run writes nothing), -iii (the run emits the entry through the repo's emitter, committed before the PR), -iv (breaking is never guessed: emitted not-breaking and declared undetermined for review — an earlier draft deriving it from risk_surface was rejected before authoring, because risk_surface marks where a criterion sits rather than whether callers break, and a wrong true auto-cuts an uncorrectable MAJOR release tag), -v (failure to produce a required entry is a named halt, not a warning), -vi (a reported success means no known-failing required check). Reset to work_status in_progress: the commit and PR behaviour is shipped, the landability guarantee is not. Change of intent authorised by BrainCandy."
