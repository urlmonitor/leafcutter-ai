criteria: |
  Given the skipped-gate record contract is in place,
  When a reader consults the project's reference documentation for gate outcomes,
  Then a reference document states the shape of the record written for a requested
    gate that did not run — the gate's name, the outcome value `skipped`, and the
    reason including the setting or precondition that prevented it,
    And it states the one-entry-per-requested-gate rule, including that a gate the
      work item never requested produces no entry,
    And it states that a skipped outcome is never counted as a pass in any roll-up,
    And it names the finalize-workflow per-step record as the sibling guarantee on a
      different surface, so a reader does not treat the two as one mechanism,
    And it records the double-recording trap — that a skip-branch record requires the
      pre-existing unconditional record to be conditionalized — so the next
      implementer does not repeat it.
