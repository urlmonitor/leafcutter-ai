roadmap_phase: phase_1
criteria: |
  Given entry F1 was in the unresolved work queue at scan time,
  And before the router reaches the routing step for F1, a concurrent process
    sets resolved_at on F1 in the feedback corpus,
  When the router re-checks the live resolution state of F1 immediately before
    acting on it,
  Then it observes F1 is now resolved,
  And it skips F1 without routing it to /quick-fix or /create-ac,
  And it records that F1 was dropped because it was resolved after scan,
  And no artifact is created for F1.
