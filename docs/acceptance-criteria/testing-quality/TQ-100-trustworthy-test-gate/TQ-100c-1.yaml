title: "A test with no covers tag is enforced by default, requiring no backfill"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100c.yaml
criteria: |
  Given a test function that carries no "# covers: <AC-ID>" tag at all,
  When the suite is run and that test fails,
  Then the test is enforced (its failure counts as a real failure and drives the
    overall run outcome non-passing)
  And no tag has to be added to the test for it to be enforced
  And turning the AC-status-gated enforcement on does not require any bulk
    re-tagging of the existing untagged suite for those tests to keep blocking.
