notes: |
  Holds whichever way Q5 goes. If workspaces live inside each project it is automatic; if
  they live in a folder shared by every project in the parent (the deployed copy's current
  behaviour), the location or naming must still keep the two apart. Flagged as a constraint
  on Q5's option (b).
target_epic: EPIC-EveryPieceOfSeparateWorkGetsItsWorkspace
