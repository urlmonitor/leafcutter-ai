notes: |
  TWO QUESTIONS, AND THEY MUST NOT BE CONFLATED — THIS IS THE USER'S DECISION OF
  2026-09-14, TAKEN AFTER THE PRODUCT OWNER RAN AND SETTLING THE EDGE THE L1's NOTES
  LEFT OPEN.
    (1) DOES THE RULE APPLY? Always, on any addition. There is no threshold below which
        an already-oversized file may be added to for free. The Product Owner was right
        that "zero addition is free" is literally true only of a change that adds
        nothing, and that under gross counting a one-line correction which REPLACES a
        line adds one. The user did not close that gap by exempting small changes.
    (2) MUST A SPECIALIST DO THE WORK? Only above a threshold. Below it the author takes
        the lines out inside the same change. This is what keeps the rule from
        dispatching a restructuring specialist to delete two lines for a typo fix, which
        is a real cost and not a rounding error.
  An implementation that answers (1) with (2)'s threshold has deleted the rule for every
  small change, and that is the named mutation below. An implementation that answers (2)
  with "always the specialist" has made the urgent one-line correction expensive in the
  way the L1's second decision exists to prevent.

  THE THRESHOLD'S VALUE IS AN ENRICHMENT DECISION, FOLLOWING THIS TREE'S PRECEDENT. The
  criteria fix three things only: a threshold exists, it is at least one measured line
  (otherwise the author-clearable band is empty and decision (2) does not exist), and
  the disposition follows from the size of the DEMAND rather than from the size of the
  file. Pinning the number is the IT PO's, exactly as GE-127c authors the principle and
  leaves the concrete list to enrichment. Two measured facts belong in that decision
  rather than in the criteria: the median oversized file in this repository stands at
  551 measured lines, and 78 of the 212 oversized files stand between 400 and 500, so
  the capped arm of GE-127f-1 puts a large share of real demands in the tens rather than
  the hundreds.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM.

  (1) THE LOOPHOLE. MUTATION: exempt a change from the end-state rule entirely when its
      measured addition is at or below the threshold, rather than only routing the work
      to the author.
      MUST GO RED: the one-line replacement arm, which must be refused and commits under
      the injection.
      MUST STAY GREEN: every above-threshold arm here, and both refusal arms of
      GE-127f-1, whose additions of 50 measured lines sit above any threshold enrichment
      can defensibly pin.
      EXPECTED COUPLING, TO BE REPORTED RATHER THAN SUPPRESSED: if enrichment pins the
      threshold at five measured lines or more, GE-127f-2's five-line replacement arm
      also reds under this injection. That is a true consequence of the injection and
      not a defect in either record; record which threshold value the run used.

  (2) THE BAND. MUTATION: hand every demand to the restructuring specialist, removing
      the author-clearable band entirely.
      MUST GO RED: the one-line disposition arm, which must state that the author may
      discharge it.
      MUST STAY GREEN: every above-threshold arm here, and EVERY arm of GE-127f-1 and
      GE-127f-2, neither of which says anything about who removes the lines. That green
      half is the evidence that the disposition is this record's subject alone and that
      the three records are not restatements of one another.

  WHAT IS NOT MECHANICALLY ENFORCEABLE HERE, STATED PLAINLY RATHER THAN PAPERED OVER.
  Two things, and both were named by the Product Owner:
    - SEPARATION OF DUTIES CANNOT BE CHECKED AT COMMIT TIME. A commit is one diff under
      one identity, and nothing in it distinguishes a hundred lines removed by the
      author from a hundred removed by a specialist. No clause above asserts that the
      restructuring WAS performed by the specialist, and none may be added. What is
      checkable is what the refusal states: the demand, and which party it is handed to.
      A test that proves separation of duties by inspecting a prompt file, an agent
      template or a workflow definition is a grep-shaped test on a workflow property and
      is forbidden by CLAUDE.md; it would stay green on a gate that never runs.
    - THE ANTI-SHUFFLING PROTECTION HAS NO MECHANICAL BACKSTOP. Moving NEW work out of
      an oversized file into a home of its own is the desired behaviour; moving EXISTING
      content out purely to make a number fall is the failure; a diff shows both
      identically. The protection rests entirely on the specialist's judgement, which is
      precisely the user's stated reason for requiring one. The same is true of the
      cheaper manoeuvre named on GE-127f-1 — deleting blank lines and hash comments,
      which today's measurement rule counts and which therefore discharges a demand
      while improving nothing. This record's band is the only structural answer to
      either: above the threshold the author is not the one who does the work, and a
      specialist optimising for structure does not answer a demand by stripping
      whitespace. That answer is real, it is the user's, and it is a matter of who is
      asked rather than of what a gate can detect. Do not write an acceptance clause
      that implies otherwise.

  THE SEAM WITH BUILD-ORCHESTRATION, NAMED AND NOT CROSSED. The RULE — the comparison,
  the refusal, the demand and the disposition — is the guardrail tree's and is what this
  subtree delivers. The HANDOFF — author hits the rule, work passes to the specialist,
  the specialist restructures, the commit is retried — is a sequencing property of the
  supervisor layer, provable only by a reachability-angle test that the specialist is
  actually dispatched on the refusal path. It is expressed above as an expects_from
  contract on build-orchestration and is NOT decomposed here, because authoring ACs in
  another component's tree is not this agent's to do. A separate Product Owner pass is
  needed for that half, and until it lands the disposition this record emits is a
  statement nobody acts on. That is a known, deliberate partial delivery, not an
  oversight.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. The two named mutations above,
  including which arms must stay green and which coupling is expected, are written to be
  turned directly into test descriptors.
