criteria: |
  Given a request that names the document above the new one,
  When the new document is produced,
  Then three separate things are true without any further step: the new document
    declares that document as the one above it; the new document carries, in its
    prose, a reference to that document placed where the project requires it to
    be and naming it by the human-readable title the parent gives itself rather
    than by its filename; and the parent document's own list of the documents
    below it has gained the new document,
  And the parent document is otherwise untouched: every document already listed
    below it is still listed, and nothing else in the parent is rewritten,
  And the project's check on the two-directional link passes over the new
    document and the parent together, run as the project runs it, with no manual
    step performed between production and the check,
  And the parent named must be a document that exists and that sits above the new
    one in the tiers: a request naming a parent that is absent, or that sits at or
    below the new document's tier, produces nothing and is refused.
