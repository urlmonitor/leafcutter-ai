  contract: "The point in BO-4000's worktree step, reached only when no worktree is reused, at which a branch is chosen for the new worktree at the named location, and the target's single branch name used there."
test_required: true
test_spec:
  - name: test_behind_branch_with_no_unique_commits_starts_the_worktree_from_origin_main
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The incident's 47-behind, 0-ahead branch yields a worktree started from origin/main, and the report states the 47."
  - name: test_behind_branch_with_unique_commits_stops_and_names_both_counts
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A 47-behind, 3-ahead branch opens no worktree, dispatches no phase agent, and the refusal names the branch, 3 ahead, 47 behind and three choices."
  - name: test_up_to_date_branch_is_used_without_a_staleness_report
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A 0-behind branch is used as it stands and the report carries no staleness statement."
  - name: test_unfetchable_origin_main_refuses_an_existing_branch
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "When origin/main cannot be fetched, an existing local branch is not used and the refusal says its standing could not be checked."
  - name: test_behind_and_ahead_are_measured_on_a_real_repository
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "On a temporary real repository with a bare origin, a branch really 2 behind and 1 ahead is reported as 2 behind and 1 ahead, not as 1 ahead only."
  - name: test_branch_staleness_decision_is_reachable_from_the_workflow_top_level_body
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: templates/workflows-js/build-feature.js
    description: "The criterion, failure and boundary cases are driven through _workflow_engine_harness.py running build-feature.js's own top-level body."
test_rationale: |
  The store already holds a divergence measurement that cannot see this condition.
  BO-900a-1 counts commits ahead of origin/main, and a branch 47 behind with 0 ahead reads
  0 on that measure. So the real-artifact entry has to build a branch that is really both
  behind and ahead, and assert both numbers. Every other entry goes through the workflow
  body, because the defect was a decision the run made (check the branch out as it stood),
  not a wrong number returned by some helper.
