test_spec:
  - name: test_existing_fractional_agents_are_scored_unchanged
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Score a label-mode run for an agent configured at threshold 0.70 (the real pt-classifier entry) and assert the verdict and exit code match the pre-change behaviour — the backward-compatibility pin, executed rather than asserted from source."
  - name: test_seeded_gap_mode_is_opt_in_per_agent
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Score the same run for an agent entry with and without scoring_mode seeded_gap; assert the seeded-gap rules apply only to the opted-in entry and the other keeps the fractional outcome."
  - name: test_round_passes_only_when_every_seeded_item_is_reported
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Compute round verdicts for 4-of-4, 6-of-6 and 4-of-5; assert pass, pass, fail, and that the failing round's result names the unreported item."
  - name: test_no_threshold_below_one_can_pass_a_partial_round
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Score a 4-of-5 round for a seeded_gap agent whose config also sets threshold 0.8; assert the round is still fail — the fractional threshold is ignored, not reinterpreted."
  - name: test_overall_verdict_is_fail_when_any_round_fails
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Compute the overall verdict for rounds 4/4, 6/6, 4/5 (14 of 15 seeded items, 93%); assert fail, and assert no percentage or averaged score appears as a passing figure in the result record."
  - name: test_overall_verdict_requires_all_three_rounds_to_pass
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Assert [pass, pass, pass] is the only overall pass; assert [pass, pass, fail] and [pass, fail, pass] are fail — two-of-three is never a pass."
  - name: test_unseeded_findings_never_turn_a_fail_into_a_pass
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Score a round with 4 of 5 seeded items reported plus 10 unseeded findings; assert the round is fail and the extras land in a list disjoint from the seeded items."
  - name: test_round_with_visible_seeded_items_is_invalid_not_pass
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Score a round whose material exposed the recorded seeded items (or their count) and whose agent reported all of them; assert the round status is invalid, and that invalid is a distinct third value from pass and fail in the persisted record."
  - name: test_overall_verdict_is_not_pass_while_any_round_is_invalid
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Compute the overall verdict for [pass, pass, invalid]; assert it is not pass, and assert the invalid round's earlier record still exists after the round is re-run on cleaned material."
  - name: test_harness_exits_non_zero_when_the_overall_verdict_is_not_pass
    target_dir: unit_tests/evals/
    framework: unittest
    type: behavioral
    description: "Run the harness entrypoint for a seeded_gap run in a fresh process for three cases — all rounds pass, one round fail, one round invalid — and assert exit status 0, non-zero, non-zero respectively, so the run is usable as a gate."
