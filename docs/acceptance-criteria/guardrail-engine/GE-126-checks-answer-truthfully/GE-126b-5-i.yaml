id: GE-126b-5-i
title: "A check with nothing it could be asked to refuse says why, and a claimed exemption whose ground is that the demonstration has not been done is refused like one with no ground at all"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given a check whose work is to count or to measure rather than to accept or reject,
    so that no input exists which it could be required to refuse,
  And that check declares itself exempt from carrying a known-bad input, together with
    a stated ground for the exemption,
  When the run reports,
  Then that check is reported as exempt with its stated ground shown, is counted under
    a figure of its own that is stated alongside the other figures, is not counted among
    the checks whose refusal has not been demonstrated, and does not by itself cause the
    run to fail,
  And a check declaring itself exempt while stating no ground is reported by name as an
    exemption without a ground, is counted among the checks whose refusal has not been
    demonstrated, and the run fails,
  And a check whose stated ground is that the demonstration has not been done yet, is
    deferred, is planned, or is pending, is reported in exactly the same way as one that
    states no ground at all — a postponement is not a ground,
  And given a check that genuinely accepts or rejects declares itself exempt with a
    ground, when its known-bad input is fed through its real entry point and the stated
    rejection is observed, then the exemption is reported as contradicted by that
    observation and the run fails.
