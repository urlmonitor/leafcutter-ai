notes: |
  PROMPT-ONLY. /build-epic dispatches ticket-supervisor, which follows the
  building-epics skill (prompt text), so the wiring is an instruction, not code.
  It cannot be unit-tested without a template text search (forbidden). The rule
  itself is deterministic and tested in TQ-500g-1-i; this AC only makes the
  supervisor call it and act on its verdict. Substitute: pr-reviewer against the
  Then clauses, and a live /build-epic drive of a fixture epic with K1 to K3.
  MECHANICAL BACKSTOP (user decision Q3 at the BA gate): TQ-500g-1-viii stops
  the commit of any /build-epic ticket for which this runner's verdict is
  missing, unreadable, stop, or older than the code. This AC must therefore
  leave the runner's own verdict on record in a form that check can read.

  PAIR WITH TQ-500f-3-iv. Both add a shared gate call to the same
  ticket-supervisor phase sequence (the red-baseline reader between the test
  writer and the coder; the wrong-version runs before commit). They may be built
  together in one llm-expert change, but each keeps its own AC and can pass or
  fail on its own.

  IT-PO ENRICHMENT (2026-09-28)
  llm-expert lane. Ship in one PR with TQ-500f-3-iv and TQ-500g-1-viii (see
  it_requirements).
