priority: medium
roadmap_phase: phase_1
criteria: |
  A protection on your files holds however the file gets changed.

  The safeguards that watch over your files today only notice a change made one
  particular way, so the same change made another way walks straight past them.
  After this goal, a protection that applies to changing a file applies whichever
  way the change is made, its override rules are the same whichever way the
  change is made, and when a protection cannot tell what a change touched it says
  so instead of staying quiet. Looking at your files is never mistaken for
  changing them.
