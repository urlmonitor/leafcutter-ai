roadmap_phase: phase_acbuild_2b_ticket_demotion
criteria: |
  Given the go/no-go criteria set (strict store validation = 0; 10 consecutive green
    required-CI self-host merges under enforce: true; a full self-host epic
    spot-checked on a real ticket in a fresh process; render comprehension test
    passes; every gate script in the deploy-manifest; at least one consumer or
    consumer-sim upgraded green; rollback rehearsed),
  When the final legacy-removal cutover is evaluated and any single criterion is unmet,
  Then the cutover is refused and the unmet criteria are named;
  And when every criterion holds, the cutover is permitted.
