id: BP-1100g-3-ii
components:
  - build_pipeline
  - testing_quality
title: "The set of taught proof kinds resolves to the same set wherever the scanner runs from"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the check that reports a test whose declared kind is not one of the taught
      kinds,
    And two ways of reaching that check that the product really uses — from the
      working copy, and from the installed copy the commit-time and merge-time
      checks actually run,
  When a test declaring a taught kind is examined by each,
  Then neither reports it, and the set of kinds each one recognises is the same set,
    And a test declaring a kind that is genuinely not taught is still reported by
      each, so the two agree about what is wrong as well as about what is fine,
    And if the taught set cannot be read at all, that is reported as the failure it
      is, rather than being treated as a set with nothing in it.
