it_requirements:
  - >-
    A remove request that names work which has no workspace (never made, or already cleared) gets a
    definite no-workspace answer that a caller can tell apart from a clear and that is not a failure, since
    every caller stops on any non-ok answer (workspace-maker-answer.md, caller rule 1). Decided (user
    accepted the default, Q3, 2026-11-16): status ok, exit 0, code OK, no removed_path, an additive field
    absent set to true, and a message naming the work. A --path request for a location that holds nothing keeps today's
    answer.
  - >-
    An older spelling and the current kind and short name resolve to the same single workspace (BO-4300a-2).
    Neither ever reaches a second workspace for the alias, nor the neighbouring work whose name extends it
    ("Files Stay Workable Two").
  - >-
    The no-workspace decision is read-only: it creates, writes, renames or deletes nothing, takes no lock
    that outlives the answer, and makes no network call.
  - >-
    Repeated requests are idempotent: the second and every later request for the same name change nothing
    anywhere and give the same answer.
  - >-
    Locate keeps its own NOT_FOUND answer for work with no workspace (BO-4300e-1); only remove's answer is
    added. Any new field is additive and the schema version stays.
  - >-
    File sizes: worktree_remove.py (485 lines) takes wiring only, with a net line count that does not grow;
    the logic lives beside the shared resolver of BO-4400g-1. No limit is raised.
  - >-
    PROOF RUNS THE DEPLOYED MAKER as a separate process against real temporary repositories with a real
    bare hub (unit_tests/build_orchestration/_workspace_maker_fixtures.py). No git mock, no import of a maker
    module for the asserted behaviour, no build.py spawn, and isolated HOME and git config.
test_required: true
test_intent:
  - clause: the one workspace of "Files Stay Workable" is answered cleared and no folder of it remains
    needs_test: true
    reason: An older spelling must resolve through the one identity rule to the real workspace, which a resolver that only knows current names would miss.
  - clause: the workspace of "Files Stay Workable Two" is identical before and after
    needs_test: true
    reason: A prefix match on the epic name would clear the neighbouring epic, so the neighbour must be snapshotted.
  - clause: a lookup of the epic by its current kind and short name then answers that no workspace exists for it
    needs_test: true
    reason: A clear that removed only an alias twin would leave the real workspace for the current name, which only a lookup afterwards shows.
  - clause: each request is answered with a definite statement that no workspace exists for that work, not with a failure
    needs_test: true
    reason: Flows and the landed-work pass both clear, so a repeat that answers as a failure would halt the second caller.
  - clause: every remaining workspace of the project is identical before and after
    needs_test: true
    reason: A repeat request that resolves loosely when the workspace is gone could reach another workspace, which a snapshot catches.
delivers_to: null
expects_from:
  ac_id: BO-4400g-1
  contract: >-
    remove accepts the work's identity (--kind/--slug or --branch, older spellings included) through the one
    resolver that locate uses, and answers exactly as a --path request for the resolved location.
