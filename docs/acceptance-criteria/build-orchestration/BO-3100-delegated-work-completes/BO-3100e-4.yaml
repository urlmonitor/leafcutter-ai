id: BO-3100e-4
title: "A sequence diagram shows the step's own declared result being looked for after the step ends"
component: build-orchestration
components:
  - documentation_system
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader trying to understand why a step that reported success was not
    counted as done,
  When they open the sequence diagram for the per-step result check,
  Then it shows, in order: the step's declaration being read, the step being
    dispatched, the step returning a report and recording a positive verdict, the
    declared result being looked for directly, the result being absent, and the step
    not being recorded among the completed steps,
    And it shows the step's own report as an input the judgement does not read when
      deciding.

  Given the diagram,
  When it is compared against a real build in which a step reported success without
    producing its declared result,
  Then every interaction the diagram shows occurred in that build, in the order
    shown,
    And the diagram shows no interaction that did not occur.

  Given the diagram,
  When a reader looks for where the expected result comes from,
  Then the diagram shows it being read from the step's own declaration and from
    nowhere else,
  So the diagram cannot be read as describing a checker that holds a list of steps.
