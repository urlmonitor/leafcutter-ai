criteria: |
  Given a component entry has an exposed_interfaces element with
    type: "random_string" (a value not in the allowed set),
  When the validator checks the type field,
  Then the entry is rejected with an error naming the invalid type value
    and listing the 7 allowed values:
    file_contract, json_schema, function_signature, cli_command,
    hook_protocol, event, data_shape.
  And the error identifies the component ID and interface name
    where the violation occurred.
