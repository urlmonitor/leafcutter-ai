notes: |
  TQ-200d SUGGESTED SPLIT, ITEM 4 (test-writer and test-runner, the database
  setting). The test writer's rows join TQ-200d-1's set (one set per agent,
  TQ-200a-1); the test runner gets a set of its own. depends_on TQ-200d-1 is a
  real ordering edge: the rows have a set to join.

  NEGATIVE CASE (TQ-200a-4) FOR BOTH SETS: W2. The likely failure is an
  over-eager warning on every piece of work once the agent has been taught to
  report the missing setting.

  ADDRESSES IN ROWS. Rows must never carry a real-looking address (INF-1100d-4
  scans shipped files). Configure the setting in the row's sandbox to the
  placeholder postgresql://<user>:<password>@<host>:<port>/<database> (which
  INF-1100d-4-i allows) and score whether the produced test reads the setting,
  rather than whether it repeats a literal. Scoring "names no address of its
  own" is a structural check on the produced files where possible, a judge
  otherwise.

  LOCAL ONLY (user decision at the PO gate): see TQ-200d-1 notes.

  IT-PO ENRICHMENT (2026-09-28)
  Lane: fast lane, after TQ-200d-1 (depends_on).
  IT-PO TECHNICAL ALIGNMENT (2026-10-23, against origin/main)
  Criteria, title, depends_on and readiness untouched. Mismatches with the
  earlier enrichment:
    - "Checked structurally on the produced files" cannot apply to
      test-runner, which writes no files. Its configured-database row is
      read from the commands it ran (OQ-7).
    - The placeholder address makes scripts/db_check/checker.py report
      invalid, never reachable. The test-runner "configured database" row
      therefore proves the setting was used through the checker and that no
      address of its own appears. It cannot prove a reachable database
      (OQ-8).
    - test-writer's DB pattern is resolve_test_db_address(Path.cwd()) from
      scripts/db_check (Step 2b). The configured row checks for that and for
      the absence of any literal.
    - INF-1100d-4's scanner does not cover scripts/evals/sets/.
  estimated_complexity raised M -> L because OQ-7 option A (a
  transcript-capturing invoker) was chosen.

  USER DECISIONS (2026-10-23, answered in the main session; all IT-PO
  recommendations accepted)
    OQ-1  A: one new produced-tests scoring_mode in sibling modules
          scripts/evals/produced_tests_mode.py, produced_tests_scoring.py and
          (TQ-200d-1-i) produced_tests_runs.py; run_agent_eval.py dispatches
          it and offsets the lines by moving out the unused text-assertion
          scaffold. No test_ prefix on these modules.
    OQ-2  Sets at scripts/evals/sets/<agent>.jsonl, fixture projects and
          recorded outputs under scripts/evals/sets/<agent>/{projects,recorded}/,
          recorded test files with the suffix .py.recorded; bad outputs for
          unit tests under unit_tests/evals/fixtures/ with the same suffix.
    OQ-3  A: render {{config.output_root}} to the sandbox and copy the scripts
          the template names (scripts/db_check; for runner callers also
          scripts/build_orchestration and scripts/ac_store) into it.
    OQ-4  The scorer writes the sandbox AC record after the agent runs, from
          its # covers: tagged tests, with the must_catch from the row. The
          agent works on the pre-fix code; the scorer installs the fix and
          calls the runner with base_ref at the pre-fix commit.
    OQ-5  Deterministic report and fixture checks everywhere, the judge
          optional and secondary; the runner-backed check for the refresh
          gate, offered for test B.
    OQ-6  A: config key local_only: true; eval_selector.py keeps such agents
          out of affected and out of --check; payload run_context "local".
    OQ-7  A: the mode's own invoker captures a stream-json transcript and
          scores Bash tool-call inputs structurally.
    OQ-8  Accepted: the placeholder makes the checker report invalid; no row
          reaches a database.
    OQ-9  Structural check of produced SQL; a live run is optional later work.
    OQ-10 TQ-200d-1 and TQ-200d-1-i are built in one fast-lane run.
    OQ-11 The live before-score is DEFERRED: recorded later as a separate
          step the user triggers, after PR #1324 merges, stamped with
          trigger_shas. No build step calls a model.
