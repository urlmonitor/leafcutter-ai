id: TQ-600c-6
components:
  - testing_quality
title: "A contributor the cost guard has just failed can find out where the limit came from and what to do about it"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a contributor whose change has just been failed by the suite-cost guard, who
    has the project's written guidance and nothing else — no access to the guard's
    source and nobody to ask,
  When they follow it,
  Then they can say where the limit that failed them came from: that it was derived
    from a measured run rather than chosen, by the procedure the guidance states, and
    what would have to happen for it to be derived again,
    And they can reach the recorded limit, and the run record their run was compared
      against, at the locations the guidance gives, without searching the repository
      for them,
    And they can read their own run's record and name the tests responsible for the
      cost, distinguishing time spent preparing for a test from time spent inside the
      test itself, so they do not begin by optimising a test whose cost is repeated
      preparation,
    And they can state the responses available to them and say which one their case
      calls for — making the work cheaper, or having the limit derived again from a
      new measured baseline with that derivation recorded — and can say which response
      is not available to them: suppressing the guard, or editing the recorded limit
      without a measurement behind it,
    And the guidance states no limit of its own anywhere in it: the number lives only
      in the record the guard reads, and a reader who wants to know it is sent there,
      so the guidance cannot come to disagree with the guard it explains,
    And every location and every command it gives works as written against the
      repository at the time it is published.
depends_on:
