expects_from:
  ac_id: ACD-1900a-2
  contract: "schema_version field on each record so the store-wide pass can detect the presence of any schema_version < 2 record and stay permissive."
it_requirements:
  - "Canonical source: config/ac_store_schema.json and scripts/ac_store/validate_ac_schema.py. While any store record has schema_version < 2, additionalProperties MUST remain untightened so both shapes validate and zero records are rejected."
  - "The permissive-vs-strict decision must be data-driven from the store's actual schema_version distribution (an emergent 'any v1 present' property), never a hard-coded flag or record name (ADR-026 non-negotiable rule 1)."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file/YAML I/O in typed try/except and log-or-reraise; no bare except."
test_spec:
  - name: test_store_with_v1_present_additionalprops_not_tightened
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "With at least one schema_version < 2 record present, the store-wide validation does not tighten additionalProperties and both shapes validate."
  - name: test_mixed_store_zero_records_rejected
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A store-wide run over a mixed v1/v2 store rejects zero records."
