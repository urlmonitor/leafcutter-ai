criteria: |
  Given a reader holding a run that stopped with a message about a file the route
    could not find or a directory that is not a repository,
  When they open the project's reference documentation,
  Then a page states which copy of each route file runs when the route is started
    from the project root from a worktree and from a directory outside the project,
  And it states which directory a repair must land in for an install to carry it
    and which directories are regenerated by the installer,
  And it names the startup checks that can stop a run before the first question and
    what each of their reports means,
  And the page is reachable from the documentation index and carries the same
    component as this criterion.
depends_on: [ACD-2100d, ACD-2100a-5, ACD-2100b-3, ACD-2100b-4, ACD-2100d-1, ACD-2100d-2]
