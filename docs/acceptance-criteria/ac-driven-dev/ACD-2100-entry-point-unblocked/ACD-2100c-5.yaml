it_requirements:
  - "The change must land under templates/. The deployed workflow is build output."
  - "State this as an invariant over every exit path, not as a repair to the one known destructive default at line 2086. That path is unreachable today, which is exactly why a test written against the line would be deleted with it at the next refactor and the invariant would silently lapse."
  - "Discarding must remain reachable from an explicit person's choice -- the feature is not being removed, only its use as a fallback."
  - "The run's record must attribute a discard to the person who chose it. Attribution is what makes a legitimate discard distinguishable from a fallback discard afterwards, and without it this invariant is unverifiable in production."
  - "The survival of the drafted work must be observed on disk after the process has exited. A run that returns a non-destructive result and then removes the worktree or resets the branch on the way out satisfies every in-process check and still loses the work."
  - "This record does not specify the status vocabulary of a cancelled run and must not change the cancellation return path (KI-ACD-006 is out of scope for this tree). It constrains only the attribution and the on-disk outcome."
  - "Must satisfy the repository error-handling policy: a failure on the way out must not become an unattributed discard."
test_spec:
  - name: test_drafted_work_survives_every_non_person_exit
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Three runs -- no answer arrives, the channel is unavailable, an unattributable
      answer arrives -- and in each the drafted work is present on disk and
      byte-identical after the process has exited.
  - name: test_no_non_person_exit_records_the_person_as_having_chosen_to_stop
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      In each of those three runs the recorded outcome carries no attribution of a stop
      to the person.
  - name: test_person_chosen_stop_discards_and_records_the_person_as_the_source
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      A stop chosen by the person on the person's channel discards the drafted work and
      the run's record attributes that choice to the person -- the feature is preserved,
      only the fallback is removed.
  - name: test_work_survives_a_missing_gate_result_on_the_real_exit_path
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      With the gate resolution made to yield no result at all, the run exits without
      discarding and without attributing a stop -- the invariant holds on the path the
      residual destructive default sits on, driven through the real workflow rather
      than by calling the fallback expression.
test_rationale: >-
  The destructive default at line 2086 is stated here as a property rather than as a
  line edit on purpose: the present code path is unreachable, the next refactor makes it
  reachable again, and a test written against the line would have been deleted along
  with it. So the assertion has to be over exit paths, and the fourth test drives the
  unreachable one through the real workflow by making the gate resolution yield nothing.
  Observing the files rather than the return value is the other half -- a run that
  returns a non-destructive result and then removes the worktree or resets the branch on
  the way out satisfies every in-process check and still loses the work. The third
  assertion keeps the feature: discarding is a legitimate outcome a person may want, and
  attribution is what makes the two cases distinguishable afterwards.
