criteria: |
  Given the tree of BP-900c-4 — scripts/knowledge/harvest_learnings.py deleted from
    the source tree, still named individually by the knowledge-scripts deploy
    declaration, still referenced by agents/knowledge-harvester.md,
  When the build is run against that tree through its real entry point and the entry
    for that path is read from the report it produced,
  Then that entry carries the declaration-already-exists remediation,
  And when that one path is then removed from the deploy declaration, nothing else
    in the tree is changed, and the build is run again, the entry for that same path
    carries the add-a-deploy-phase remediation instead — so the advice tracks the
    declaration and is not attached to the path,
  And when the source file is restored at the declared path and the declaration is
    left naming it, the run produces no report entry for that path at all,
  And the same three runs are repeated with a path named by a different declaration
    shape — one declared through a mapping table rather than a file list — and
    produce the same three outcomes, so the remediation is keyed on being declared
    rather than on which declaration happens to hold the path,
  Because a selector that consults a second list of known-declared paths maintained
    beside the deploy declarations satisfies the first clause and fails the second:
    editing the real declaration leaves the advice unchanged, and the two lists drift
    apart silently, which is the same hand-maintained-map staleness BP-900g-8 and
    BP-900g-9 exist against, reproduced inside the guard that reports it. Only the
    declaration-edit run distinguishes the two implementations; asserting the
    corrected text appears cannot, because both emit it.
