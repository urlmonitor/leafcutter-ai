    state: to_be_created
it_requirements:
  - >-
    Exercise the failure by feeding genuinely untokenizable content, never by asserting
    that an error branch exists in the source (BP-1600a-2-ii's standing constraint, as
    GE-127a-1-i applies it).
  - >-
    The accepted-syntax arm guards the opposite failure: a strict lexer turning valid
    code into a refused commit. Python f-string tokenization depends on the interpreter
    running the hook (nested same-quote f-strings are valid only from 3.12); the IT PO
    pins whether an f-string the running interpreter cannot tokenize is INDETERMINATE or
    measured with a fallback that still never counts a comment.
  - >-
    PINNED (IT PO, 2026-10-16, answering the requirement above): INDETERMINATE, no fallback.
    Content the running interpreter's tokenizer rejects is this record's could-not-measure
    outcome, and for Python the reason names the running interpreter's major.minor version
    so an author on 3.11 holding a PEP 701 f-string can see the cause. A fallback measure
    would be a second rule. CI runs 3.13, where every accepted construct the criteria list
    tokenizes; the accepted-syntax descriptor runs on whatever interpreter the suite runs on
    and needs no version skip. A `#` inside an f-string's text or a replacement field's string
    tokenizes on every supported interpreter.
  - >-
    ONE VOCABULARY, THREE CARRIERS, NO NEW TOKEN. Current content that cannot be tokenized
    joins GE-127a-1-i's current-content refusal; a previous version that cannot be tokenized
    joins GE-127b-1-i's "could not be interpreted" previous-length refusal; either side failing
    while establishing the measured lines a change added (GE-127f-2) joins the existing
    added-lines INDETERMINATE. The reason text names the file path and the language by name
    (Python, JavaScript, TypeScript, SQL, shell) and states that the content could not be read
    as that language. Exit status 2; nothing printed for that file on stdout; the run's PASSED
    list never names it.
  - >-
    ONLY TOKENIZATION FAILURE IS COULD-NOT-MEASURE. A Python file that tokenizes but does not
    parse (a syntax error a linter would reject) is measured, not INDETERMINATE: which of its
    strings are standalone (uncounted) and which are used (counted) is read from the token
    stream, per GE-127d-3's 2026-10-20 rule, so no parse is needed. A SQL dollar-quoted body that closes but cannot be
    lexed as SQL is a closed string literal and is measured (GE-127d-3-i).
  - >-
    SECONDARY CALLERS MUST NOT TURN A TOKENIZER FAILURE INTO A CRASH OR A VERDICT CHANGE.
    _file_description's per-part segment measurement, reached only for a file already refused
    by length, maps a segment the tokenizer rejects to GE-127e-3-i's DESCRIPTION UNAVAILABLE
    line inside the same exit-1 refusal. check_file_size_rule_parity's
    _enforced_applies_to_modified_files probe (it calls check_file_size._classify_file on a
    throwaway file) must keep using tokenizable probe content.
  - >-
    The component's fail-open convention for bugs in the gate itself (internal error warns and
    exits 0) is NOT the path for untokenizable content: the tokenizer failure is caught by
    specific type and routed to INDETERMINATE; a blind catch that would also swallow a lexer
    bug is not permitted (Ruff BLE001).
test_spec:
  - name: test_ge_127d_3_ii_untokenizable_content_is_indeterminate_exit_2_with_no_length
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      Through the hook in a temporary git repository, each of the four untokenizable
      files the criteria name produces an INDETERMINATE line naming the file and its language,
      exit 2, no stated length and no within-limit listing; the Python case's reason names the
      running interpreter's major.minor (read from sys.version_info at run time, not a
      literal). The corrected file is then measured and judged normally. The INDETERMINATE
      outcome is distinguishable from an over-limit refusal of a measured file (different
      token, different exit status).
    must_catch:
      - "tokenizer error caught and the raw line count used instead"
      - "tokenizer error caught and the length reported as 0"
      - "tokenizer error routed to the fail-open internal-error path (warn, exit 0)"
  - name: test_ge_127d_3_ii_an_untokenizable_previous_version_is_reported_unresolvable
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      With HEAD holding an unclosed block comment and the staged version valid, the hook
      reports the previous length unresolvable in GE-127b-1-i's vocabulary and refuses.
  - name: test_ge_127d_3_ii_valid_modern_syntax_is_always_measured
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      Files carrying the accepted constructs the criteria list are measured with a
      stated length and no INDETERMINATE line: a template literal nested inside `${}` of
      another, optional chaining (`a?.b`, `a?.[k]`, `a?.()`), a regex literal containing
      `/*`, and a Python f-string holding `#` inside a replacement field's string. A .py file
      that tokenizes but does not parse is also measured.
    must_catch:
      - "template literal nesting inside ${} rejected as unterminated"
      - "a Python syntax error treated as could-not-measure"
  - name: test_ge_127d_3_ii_a_refused_file_whose_part_cannot_be_tokenized_says_description_unavailable
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      An over-limit .sql file whose CREATE-split segment cannot be lexed on its own is refused
      at exit 1 with the ordinary over-limit block and a DESCRIPTION UNAVAILABLE line naming
      the cause; the hook does not crash and does not exit 2.
test_rationale: |
  Both failure descriptors break the read for real by staging untokenizable content and
  observe the hook's output and exit status. The boundary descriptor exists because a
  tokenizer that refuses valid code converts this record's safety property into a commit
  blocker on correct files. The seam descriptor covers the one secondary caller of the
  measure that runs after a verdict is already decided, where a tokenizer failure must be
  reported without moving that verdict.
delivers_to: null
expects_from:
  ac_id: GE-127d-3
  contract: >-
    A distinct failure signal from the shared measure for content that cannot be tokenized,
    carrying the language name and a reason string (and for Python the running interpreter's
    major.minor) — never a count.
