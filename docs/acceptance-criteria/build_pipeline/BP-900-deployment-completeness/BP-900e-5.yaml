it_requirements:
  - "Wire the registry-completeness check into the finalize-feature merge flow (templates/workflows-js/finalize-feature.js) at the same position as the BP-1000 parity gate: after the merge-origin/main step and before the pull-request merge step. On violation, HALT and surface to the user; do not reach the PR-merge step. Mirror the existing finalize HALT shape (the Step 3 test-regression HALT) for the abort path."
  - "This is a MERGE-GATE check, deliberately distinct from BP-900b's build.py preflight script-reference guard. The preflight guard reads template references only and does NOT read commit_guardian.json; this check adds the registry source of truth at the merge gate. Do not relocate BP-900b's preflight, and do not duplicate its template-reference scan here beyond the registry axis."
  - "The registry-completeness check shares the finalize merge gate's invocation point with the BP-1000 parity gate but emits its findings as a separate, distinctly-LABELLED class so a reader can tell a missing-copy failure (this check) from a byte-drift failure (BP-1000). When both gates emit structured (JSONL) gap/drift reports, the two report streams carry distinct class labels and must not be merged into one undifferentiated failure list."
