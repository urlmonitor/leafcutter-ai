id: DK-100b-2-ii
title: "Answering the ranked choice in your own words leads to a new ranking before you choose"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: in_progress
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the ranked-choice question showing 3 ranked options,
  When you answer in your own words instead of picking an option, for example "pick the first one,
    but only if it keeps the record diffs reviewable",
  Then the options are assessed and ranked again before you are asked to choose,
  And the decision does not resolve on your words alone.
