id: DK-500e-1-ii
title: A person who adds a criterion after a no-gap verdict leaves a traceable disagreement
component: decision-kernel
components:
- decision_kernel
level: L3
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given Jev's verdict that nothing is missing beside five reused criteria,
  When the person adds the criterion "Does it keep secrets out of the published records?" at the approval of proposals,
  Then the run's outcome keeps both the no-gap verdict and the added criterion, marked as added by the person after that verdict,
  And in a run where the person adds nothing after a no-gap verdict, no disagreement is marked.
depends_on:
- DK-500e-1
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500e-1
  contract: Gap verdict and the approval of proposals.
change_target: code
risk_surface: internal
it_requirements:
- 'IT PO answer to the BA''s open point: the disagreement is kept both in the run report (decision report artifact) and as a trace event on the existing tracer (one event per added criterion, with run id, verdict and the added wording). It is not stored in the decision record, whose schema stays unchanged.'
- It is recorded only. No code path reads it to change Jev's behaviour, because influence is out of scope (ADR-056 section 3).
test_required: true
test_spec:
- name: test_added_after_no_gap_marked_as_disagreement
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Adding 'Does it keep secrets out of the published records?' after a no-gap verdict marks it as added by the person after that verdict in the report and the trace events.
- name: test_no_disagreement_when_nothing_added
  target_dir: tests/kernel/capabilities/
  framework: pytest
  type: behavioral
  angle: criterion
  description: A run where the person adds nothing after a no-gap verdict marks no disagreement.
test_rationale: Run the decision capability through the public run/resume boundary with a scripted Jev provider and a recording host port over a fixture category library; assert the approval payload, the run report, trace events and call counts rather than internal helpers.
