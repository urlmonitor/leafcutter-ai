estimated_complexity: M
it_requirements:
  - "Extract each command's Workflow(...) and Skill(...) handoff targets from the deployed command bodies, then resolve each target against the actual post-deploy layout. A path-form target must resolve to a real deployed artifact path; a bare .js path under scripts/workflows/ does NOT resolve, because build_workflow_scripts() deploys the workflow .js files to <output_root>/workflows/ (reachable via the .claude/workflows shim, per BP-811), not under scripts/workflows/. Resolve against the true deployed location, not the literal scripts/workflows/ prefix in the reference."
  - "The live regression fixture is Workflow(\"scripts/workflows/build-feature.js\") in the build-feature command; a test must pin that this target is flagged as unresolvable in the current tree."
  - "Distinct from BP-811, which owns .claude/workflows shim reachability for the deployed workflow .js files. This AC is the COMMAND-SIDE analogue (the command's reference resolving), not the shim. Do not modify or re-parent BP-811."
delivers_to:
  agent: python-coder
  contract: "A command-reachability verdict listing each unresolvable handoff target: { command: str, target: str, kind: 'workflow'|'skill', reason: str }; ok=true iff empty. Non-empty fails the build."
