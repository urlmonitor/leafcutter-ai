criteria: |
  Given the environment variable `PRE_COMMIT_ALLOW_NO_CONFIG` is set when the
    probe runs, and the worktree has no firing hook chain,
  When the probe runs Check D,
  Then Check D still requires the canary to actually fire; the probe exits
    non-zero, `canary` is false in the JSON result, and stderr states that the
    canary did not fire.
  And a workspace whose only "pass" would come from pre-commit being told to
    allow a missing config is reported FAIL, not trusted.
depends_on: [BO-1700b]
