id: TQ-600a-13-ii
components:
  - testing_quality
title: "The post-merge run executes the correctness lane after every merge to main, and re-runs only its failures once on a fresh machine before calling the run red"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the tests the default run does not collect — the population TQ-600a-13 and
    TQ-600a-13-i define, which this record references and does not redefine — and, within
    it, the CORRECTNESS LANE that TQ-600a-13-xii separates from the timing lane: the
    tests whose failure is a real defect, such as the shared-layout corruption guards,
    and not the wall-clock ratio assertions,
  And the measured reason that population runs off the per-PR path: TQ-600a-9's sixteen
    verification tests cost about 667 s per run while the refactor they verify saves
    about 190 s, and they are expensive because they are honest, so they cannot be made
    cheap without becoming vacuous,
  And the reason the run follows every merge rather than once a day: on a repository
    merging about ten pull requests a day, a once-daily run detects a regression up to
    about 24 hours late and leaves about ten suspect commits, while a run after each
    merge detects it in about 30 to 60 minutes and leaves one to three,
  And the property that makes a single failure weak evidence and a same-machine retry
    weak evidence too: a retry on the same machine shares the load that may have caused
    the first failure, so its result is not independent of it,
  And the opposite property that makes a silent retry dangerous: the shared-layout
    guards in this population catch a corruption that presents nondeterministically, so
    a failure that disappears on retry may be the defect itself (TQ-600a-13-xiii),
  When a commit lands on the main branch, or the scheduled heartbeat fires, or a person
    starts the run by hand, and the run executes the correctness lane,
  Then runs triggered by successive merges are coalesced: at most one run is in progress
    and at most one is waiting, a newer waiting run replaces an older waiting one, and an
    in-progress run is never cancelled to make room,
  And the heartbeat fires on a schedule with no human action, at intervals of no more
    than 12 hours and off the hour, so a repository with no merges still produces a fresh
    verdict within the staleness bound of TQ-600a-13-xiv,
  And when some correctness-lane tests fail on the first execution, exactly those tests
    are executed again — each once, and no test that passed — in a separate job that
    starts on a fresh machine and receives nothing from the first job except the list of
    tests to re-execute,
  And a test that fails on both executions makes the run red, and the run's result names
    that test by its full node id,
  And a test that fails and then passes does not by itself make the run red, and the
    run's result names it as passed-on-retry, distinguishable from a test that passed the
    first time, for TQ-600a-13-xiii to track,
  And a run with no first-execution failure is green and performs zero re-executions,
  And the run's own conclusion as recorded by the hosting service is success exactly when
    the run is green and failure otherwise, and nothing in the run except the verdict can
    make it fail on a green outcome — in particular, writing the human-facing notice is
    not part of this run, so a failure to write the notice can neither turn a green run
    red nor a red run green,
  And each of those outcomes is demonstrated by executing the run's selection, retry and
    verdict behaviour against a population whose tests are made to pass, fail, or
    fail-then-pass, with the first execution and the retry executed as two separate jobs
    that share only the handed-over list, never by reading the workflow definition for a
    trigger, a concurrency setting or a retry setting.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-i
