change_target: code
risk_surface: contract_boundary
notes: |
  DIFF-SCOPING, NOT A CUTOFF. This AC answers the introduction-path risk the PO
  flagged — switching the gate on against today's store would otherwise fail on
  every already-finished user-interface criterion at once — and it answers it the
  way the house already does elsewhere rather than by inventing a dated
  exemption.

  HOUSE PRECEDENT, matched deliberately:
    - `check_done_proof --mode ci-changed --base origin/main`, whose own
      docstring gives this exact reason: it "makes it safe to promote to a
      required gate without failing on legacy done ACs that predate the
      covers-tag mandate". GE-124e is the declaration-shaped twin of that gate,
      so it should be scoped the same way.
    - the component-vocabulary CI job: diff-scoped on pull requests, whole-tree
      only on push to main.
    - GE-111c-1, "Only links whose source the commit staged are evaluated".
    - the presence-only-assertion check, a staged-hunks ratchet for the same
      reason.

  THE SUBJECT-TYPE TRANSLATION IS THE SUBTLE PART. This tier's subjects are
  criterion ids, not file paths (GE-124e-3), so "changed files" does not select
  anything on its own. The evaluated set is therefore defined by TWO routes into
  the diff — the criterion's own record changed, or a changed front-end file
  declares or pins it — and scenarios 1 and 2 are those two routes. An
  implementation that takes only the first would never evaluate a criterion
  whose record is stable while its screen churns, which is the common case.

  NOT EVALUATED IS NOT A STATE. Scenario 3's last clause is the difference
  between this and the cutoff model it replaces: there is no exempt population,
  no deferred list and no counter, because there is nothing to size. Coverage
  grows monotonically as files are touched, and an untouched criterion is simply
  absent from the run.

  SCENARIO 4 GUARDS THE OTHER READING. "Not evaluated" must not be reported as
  "passed", for the same reason GE-124e-1 refuses to record a non-user-interface
  criterion as passing and GE-124g-3 refuses to fold declarations into a
  coverage figure: a figure that counts the unexamined as satisfied is the
  friendlier face of the same defect.

  WHAT THE USER GAINS, in their words: "we can backfill this whenever we touch
  existing files." Nothing is scheduled, nothing expires, and no permanent hole
  is created — the first change to a legacy screen brings its criteria into the
  gate, and the commit tier (GE-124c-1) makes that same change declare.

  IT-PO ENRICHMENT NOTE (2026-08-25) — WHERE AN IMPLEMENTATION WILL CUT THE
  CORNER. Route A is what every precedent in this repo does and it is what
  "diff-scoped" means everywhere else here. An implementer who ships route A
  alone produces a gate that is internally consistent, well tested against
  scenario 1, and evaluates almost nothing — because an AC record changes once
  and its screen changes for years afterwards. The route-B test in this
  contract is written specifically to fail on that implementation, and the
  delivers_to contract states the union so a coder reading only the contract
  still cannot miss it.
