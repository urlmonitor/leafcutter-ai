             fail, or gone stops the work                       python-coder

  GUARDRAIL. The blanket ban exists to stop tests being weakened to go green.
  This sweep replaces the ban only because -i and -ii make weakening visible
  and blocking. Do not ship this L2 without -i and -ii: a sweep that only asks
  the writer to behave well reopens what the ban closed.

  PROMPT-ONLY. Finding the consumer tests and choosing how to strengthen them is
  agent conduct. Substitutes: -i and -ii (deterministic), pr-reviewer against the
  Then clauses, and a test-writer eval row (incident 2 shape) in TQ-200d-1.
  Loosened assertions that neither -i nor -ii can see (for example a widened
  tolerance) are left to review and to the wrong-version runs.

  RELATED, NOT DUPLICATED: TQ-100c (protection cannot be quietly removed through
  links or the allowlist).

  IT-PO ENRICHMENT (2026-09-28)
  llm-expert lane. Ship in the same PR as -3-i and -3-ii (the guardrail).

  IT-PO ALIGNMENT (2026-10-22): AGAINST MAIN AFTER TQ-500g-1-v/-vi
  WHERE THE LIST LIVES: <git-dir>/leafcutter/work/<work-key>/consumer_sweep.json,
  beside the writer's alterations manifest. Only the record step of
  consumer_sweep.py (built by -3-i) writes it, from the list the test-writer
  pipes in; it adds a per-entry fingerprint computed from the working tree. The
  writer's own claims, including any fingerprint, are ignored.
  WHO WRITES IT: the test-writer, once, after its last edit to an existing test.
  No route JS change: the fast lane's TEST_WRITER_SCHEMA accepts the extra reply
  field, and the check reads every list in the worktree's work folder, so the
  work key need not match finish's.
  BAN LOCATION: the ban moved from ':949' to the ## Constraints list (line 1115).

  BA AMENDMENT (2026-10-22): USER ANSWERS Q1-Q4
    -iii     a changed existing test with fewer assertions, a loosened
             comparison or a wider approx tolerance stops the work, listed
             or not                                             python-coder
  Q1: weakened assertions get a deterministic stop (TQ-500g-3-iii), static,
  no LLM, inside the same check. Listing a test as strengthened does not
  exempt it. What remains for review: a widened expected literal.
  Q2: fixture, helper, constant and pytestmark edits in existing test files and
  conftest.py are listed; an unlisted one stops (TQ-500g-3-i).
  Q3: strict. Only the test-writer records; a later coder or remedy edit to an
  existing test stops the work visibly and the ticket is re-driven.
  Q4: accepted. In a shared-worktree parallel /build-feature batch a sibling's
  unlisted edit can stop another ticket; listed sibling edits pass because the
  check reads every recorded list (see TQ-500g-3-i notes).

