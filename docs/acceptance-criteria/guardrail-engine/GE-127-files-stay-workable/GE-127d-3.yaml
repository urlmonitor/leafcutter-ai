notes: |
  DECISION RECORDED (BrainCandy, 2026-10-16): no comment counts toward a file's length, in
  any style. `#`, `//`, `--` and `/* */` are stripped alike, docstrings stay uncounted as
  GE-127d-2 published, and stripping is lexically correct (a per-language tokenizer, not a
  regex). Blank lines keep today's treatment: the rule published by GE-127d-2 and carried in
  commit_guardian.json file_size._comment counts "every remaining line -- including blank
  lines", so blank lines outside comments stay counted.

  WHY AN L2 UNDER GE-127d AND NOT A NEW L1. GE-127 holds 7 of 7 L1s with no
  child_limit_override, so no eighth L1 is possible without a split. The subject is
  GE-127d's own promise — the number you are quoted is one you can reproduce and that a
  formatting choice cannot move — so GE-127d is the right parent on the merits. GE-127d had
  2 of 5 L2s; this run takes it to 5 of 5 (d-3, d-4, d-5). GE-127d was work_status done and
  is reopened to todo in the same commit, with an amended_by entry, so the ACD-400a
  falsely-done-composite shape is not staged.

  TWO DECISIONS TAKEN HERE THAT THE CALLER DID NOT SPELL OUT. Confirm or reverse before
  approval:
    (1) DOCSTRING MEANS DOCSTRING POSITION. GE-127d-2's published rule discarded EVERY
        triple-quoted string. A lexically correct rule cannot call an assigned SQL template
        a comment, so only a string literal that is the first statement of a module, class
        or function is uncounted; any other triple-quoted string counts as code. This
        RAISES the measured length of files with large embedded strings. Default if
        unanswered: as written.
    (2) A BLANK LINE BETWEEN TWO LINE COMMENTS IS A BLANK LINE. With blank lines counted,
        `# a / (blank) / # b` measures 1 while the same text as one block comment with a
        blank line inside measures 0. The restyle invariant in the criteria is therefore
        stated for comment text whose every line carries the marker, which is how `//`, `#`
        and `--` runs are normally written. Removing this residue needs blank lines to stop
        counting, which the decision kept. Default: keep, and accept a one-line-per-gap
        difference.

  LINES THAT ARE NOT COMMENTS EVEN THOUGH THEY START WITH A MARKER: GE-127d-3-i. A shebang
  and a Python encoding line ARE `#` comments lexically and are uncounted.
