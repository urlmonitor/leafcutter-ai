notes: |
  Quick-fix for KI-CG-20260925-signoff-parity-enforces-only-under-done-folder.
  BO-400c-3's second scenario already names the rule "status: done implies no
  needed or failed in agents", but the hook only applied it (and only
  auto-enforced) when the path contained /done/. BO-400c-1 retired the done/
  move, so the rule was unreachable for every new ticket. This L2 pins the
  status-keyed behaviour so it cannot regress to a folder-keyed check.
