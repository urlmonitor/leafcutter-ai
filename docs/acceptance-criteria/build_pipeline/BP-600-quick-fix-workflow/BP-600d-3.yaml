  - reason: durability-restatement
    by: business-analyst
    at: '2026-08-25'
    note: >-
      The staging clause asserted the index-scoping defect as a bare, undated
      fact and made the staging requirement depend on it, so the record would
      have become false the day the hooks are repaired and the requirement would
