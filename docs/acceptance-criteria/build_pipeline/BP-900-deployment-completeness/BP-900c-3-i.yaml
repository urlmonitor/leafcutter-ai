title: "When the source directory itself is absent, the suggested action still points to a deploy phase, not to committing source"
component: build_pipeline
level: L3
status: active
req_status: active
work_status: not_started
readiness: approved
priority: high
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900c-3.yaml"
criteria: |
  Given the build-time broken-reference guard has detected a broken reference to
    scripts/brandnewtool/run.py
  And neither the source directory scripts/brandnewtool/ nor any deploy phase that
    ships it exists in the build
  When the guard emits the error report entry for this reference
  Then the suggested_action tells the author to add a deploy phase for the new
    directory (the genuinely-new-capability case)
  And the suggested_action does NOT use the missing-or-untracked-source text,
    because that text applies only when the source directory and its deploy phase
    already exist
  And a separate broken reference whose source directory and deploy phase already
    exist still receives the missing-or-untracked-source action in the same report,
    so the two states are distinguished entry by entry
