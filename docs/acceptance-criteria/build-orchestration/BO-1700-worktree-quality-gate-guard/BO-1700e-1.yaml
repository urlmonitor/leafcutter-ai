it_requirements: |
  build.py deploys verify_precommit_active.py, precommit_canary.py, and
  ensure_precommit_config.py from templates/scripts/commit_guardian/ to
  scripts/commit_guardian/ like every other package hook (ADR-013 portable
  deployment boundary). ADR-001 parity: the canonical source is the templates/ copy;
  the scripts/ copy is a build output — the two are verified in parity via the
  build.py round-trip. This is the deployment producer the other e-family ACs
  (completeness e-3, subdir discovery e-1-i) consume.
