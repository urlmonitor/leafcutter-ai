notes: |
  BOTH LANES, SHARED SCRIPTS (user direction at the Phase A BA gate,
  2026-09-25): an ADDITIONAL guard beside verify_red_baseline and
  verify_green_and_coverage, never a replacement and never a lane-specific
  copy. Build one shared command constructor with TQ-500g-1-vi so the routes
  cannot drift (the TQ-500f-3-ii precedent).

  F3 IS THE CONTROL. Most fast-lane work names no wrong version; it must not be
  slowed or stopped, and it must never be reported as verified by runs that
  never happened.

  TESTABILITY: drive fast-lane-ship.js under the workflow-engine harness and
  assert on the recorded dispatches (runner invoked after the green check and
  before commit; the verdict consumed in control flow). A grep of the workflow
  source for the runner's name is not acceptable (CLAUDE.md, Verify
  Behaviorally, Not by Grep).

  IT-PO ENRICHMENT (2026-09-28)
  Placement refined: before commit AND after Review. So a review-driven
  change can never follow the runs.
  Lane: fast lane (python-coder) after -1-i, -1-ii, -1-iii and -1-iv. The JS
  ratchet decision is open (see the growth it_requirement).
