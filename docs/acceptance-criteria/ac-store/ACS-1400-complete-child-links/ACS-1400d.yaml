criteria: |
  What a requirement is made of, and what proves it, are recorded separately.

  Recording the tests that prove a requirement can no longer displace the record of
  the parts it is made of, and neither has to be guessed at from the shape of the
  other — so the same drift cannot quietly re-accumulate once it has been cleared.
