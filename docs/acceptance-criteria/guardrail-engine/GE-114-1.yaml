criteria: |
  Given a staged ticket .md file that has no `## Agent Contracts` section
  And the ticket body contains more than 20 lines matching `- [ ] AC-N:`
  When the ticket-body check_ac_limits hook analyses the file
  Then the ticket is not marked skipped
  And the total AC count is computed from the flat `- [ ] AC-N:` lines across the whole body
  And a total-cap violation is recorded because the count exceeds 20
  And the hook exits 1 (hard-block).
