title: "The retry that succeeded is counted in the epic's rework figures"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a completed epic in which python-coder failed once and passed on its
    second attempt, pr-reviewer failed twice and passed on its third, every
    other agent passed first time, and every agent ended the drive `signed_off`,
  When the epic's per-agent rework figures are produced,
  Then python-coder is reported with 2 attempts and 1 failure,
  And pr-reviewer is reported with 3 attempts and 2 failures,
  And every other agent is reported with 1 attempt and 0 failures,
  And those figures are computed from each ticket's `prior_failures:` list and
    its terminal agent states — the failure count being the number of entries
    for that agent, and the attempt count that number plus one when the agent
    ended `signed_off`,
  And for a ticket written before `prior_failures:` existed, the same figures
    are read from that ticket's append-only `## Comments` blocker entries, each
    of which names the failing agent in its heading,
  And for a second epic in which no agent ever failed, every agent is reported
    with 0 failures and an empty failure history,
  So that a reported 0 means "no failure happened" and can no longer be produced
    by a failure that was overwritten.
