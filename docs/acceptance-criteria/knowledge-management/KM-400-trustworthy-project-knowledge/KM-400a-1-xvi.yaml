id: KM-400a-1-xvi
title: SourceFile properties preserve pinned reference evidence without refreshing it
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
work_status: done
priority: medium
parent: KM-400a-1
criteria: |
  Given an existing SourceFile reference records a canonical identity, source revision, content hash and missing observation that may differ from the current checkout
  When its native fields are exposed in the repository graph
  Then its canonical_id, kind, title, summary, complete source reference and properties remain queryable with their original values
  And source repository_id, source_sha, path, locator and content_hash retain the pinned evidence even when the current checkout differs
  And authored surface, missing, canonical, registry_identity and future nested properties remain present exactly when supplied, preserving absent, false, null and empty values
  And a canonical identity distinct from the source path is not renamed, and file-reference anchors remain distinct from source provenance
  And no current file inspection, existence refresh, content rehash, directory enumeration or component inference changes the reference
  And repeated enrichment excludes only its three defined projection-helper fields while retaining unrelated similarly named source properties
  And changing the returned nested metadata cannot change the original reference, or vice versa
  And a non-SourceFile input or an invalid source path or revision fails explicitly without rereading the referenced file
depends_on: [KM-400a-1]
