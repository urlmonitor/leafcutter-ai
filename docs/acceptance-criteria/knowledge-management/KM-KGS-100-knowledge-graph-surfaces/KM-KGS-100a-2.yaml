criteria: |
  Given the "acs" surface points at a directory containing three acceptance-criterion
    YAML files whose id fields are KM-EX-001, KM-EX-002, and KM-EX-003
  When the knowledge map is built
  Then the node set contains exactly one node per acceptance-criterion file,
    with node ids KM-EX-001, KM-EX-002, and KM-EX-003
  And each such node carries surface "acs"
  And each node's title is taken from the criterion's title field
