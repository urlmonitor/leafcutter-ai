notes: |
  REQUEST ITEM 4. The red baseline is a mutation test with one mutant ("the code
  is absent"); an import error satisfies it for any new name regardless of what
  the test asserts. For a regression test of EXISTING code that is not evidence
  at all — the existing code was never reached.

  COORDINATION WITH TQ-500d-1. TQ-500d-1 changes the same zero-exit row for work
  whose tests are correct from the moment they are written (a pass on arrival is
  expected there, and the substitute answer is owed). This AC's last clause
  governs only the other cause of a pass on arrival: a test that asserts too
  little. The implementer must keep both readings in the one row; a row that
  says "always strengthen until red" reopens the exit TQ-500d-1 closes.

  MOSTLY PROMPT. The writer's conduct is instruction text. The one observable,
  mechanically checkable part — the kind of red on each red baseline entry — is
  delivered to TQ-500f-3-i, which carries the falsifiable test contract.

  IT-PO ENRICHMENT (2026-09-25)
  CONTRACT CORRECTED. The BA's delivers_to said the reader consumes a machine-readable kind
  written by the writer. That contradicts TQ-500f-3-i ("uses only what the test requirements
  declare and the outcome of the run") and TQ-500f-3-ii ("does not take the test writer's word
  for it"). The reader classifies from the run; this AC delivers only the shared definitions.
