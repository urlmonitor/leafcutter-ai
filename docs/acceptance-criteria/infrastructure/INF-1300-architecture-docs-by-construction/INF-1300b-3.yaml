  - name: test_description_field_is_in_exactly_one_of_the_two_states
    target_dir: unit_tests/docs/
    framework: pytest
    type: integration
    angle: boundary
    description: "check_description_field exits 0 over the unfilled produced document, and the emitted description: value is classified into one of the two states by the same partition the rest of the document uses — never an empty value and never an unmarked constant stub."
test_rationale: >-
  Reading the emitter cannot establish either half of this record. The partition is a
  property of the artifact, and the third clause is a property of the artifact's STRUCTURE
  rather than its labels: marking the open parts is worth nothing if filling them breaks a
  check, and only a fill-then-run-the-real-checks observation can catch a prompt placed
  where completing it pushes the mermaid block past its per-family complexity threshold or
  writes a non-resolving entry into a path-valued field. The fill must be realistic for the
  same reason — a one-word substitution leaves every threshold untested. The distinct-prompt
  descriptor exists because the cheapest implementation, one repeated marker everywhere,
  satisfies the first three clauses completely and returns the author to copying a sibling,
  which is the propagation failure the L1 records as already under way.
