criteria: |
  Given an L2 AC file written by the BA with a criteria field containing
    a three-clause Gherkin scenario,
  When the IT PO enriches that AC file,
  Then the criteria field in the enriched file is byte-identical
    to the criteria field in the original BA output,
  And the IT PO logs a caveat instead of rewriting
    when criteria are ambiguous for implementation purposes.
