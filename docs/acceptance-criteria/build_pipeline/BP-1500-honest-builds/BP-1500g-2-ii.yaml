assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "THE CARRY TARGET MUST BE DECIDED FROM WHAT THE PACKAGE ITSELF WROTE ON THAT SURFACE, NOT FROM A DIRECTORY NAME. `<output_root>/gemini/<output_rel>` is the antigravity mirror for agents, skills and hooks. For `workflows` it is a different family: the antigravity copy of the commands-family workflow markdown. The Claude Code workflow scripts in `<output_root>/workflows` have no antigravity mirror. A contested name is carried to the sibling surface only when the package's own output there already holds an item of that name. That is the only case in which there is a package version on that surface for the adopter's version to win over."
  - "THE ADOPTER-WINS GUARANTEE OF BP-1500g-2-i MUST STAY TRUE ON EVERY SURFACE THAT REALLY MIRRORS THE ITEM. A contested skill (or agent, or hook) still ends with the adopter's bytes under `<output_root>/gemini/<family>/<name>`."
  - "NO HARDCODED NAME LIST AND NO EXEMPTION ENTRY. The files are build-determined. Adding them to drift_gate_exemption_registry would hide every future foreign file in `.gemini/workflows/`."
  - "Must follow the project error handling policy and must not add output on the ordinary no-collision path."
test_spec:
  - name: test_bp_1500g_2_ii_a_contested_workflow_script_is_not_carried_into_the_gemini_workflows_family
    target_dir: unit_tests/portability/
    framework: pytest
    type: unit
    angle: criterion
    description: "Real filesystem, real merge_capability_items. A real `.claude/workflows` container holds a non-empty `<minted>.js`. The package output holds `workflows/<minted>.js` and an unrelated `gemini/workflows/<other>.md`. After the merge, `gemini/workflows/<minted>.js` does not exist."
    must_catch:
      - "_sibling_capability_dir returns <output_root>/gemini/<output_rel> whenever that directory exists, so every contested .js is copied into gemini/workflows"
  - name: test_bp_1500g_2_ii_a_contested_skill_is_still_carried_to_its_real_gemini_mirror
    target_dir: unit_tests/portability/
    framework: pytest
    type: unit
    angle: failure
    description: "Over-correction control. The package wrote `skills/<minted>/SKILL.md` and `gemini/skills/<minted>/SKILL.md`, and the adopter's own `.claude/skills/<minted>/SKILL.md` collides. After the merge, the gemini copy holds the adopter's bytes."
    must_catch:
      - "propagation to sibling surfaces removed entirely (no carry for any family)"
  - name: test_bp_1500g_2_ii_a_maker_layout_rebuilt_after_a_plain_build_has_no_gemini_workflows_gap_but_a_foreign_file_is_still_one
    target_dir: unit_tests/portability/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "LEAFCUTTER_SHIM_STRATEGY=copy build.py, then plain build.py, then LEAFCUTTER_SHIM_STRATEGY=copy build.py, then the deployed check_output_drift.py"
    description: "The reported sequence end to end, in a scratch project. After the three builds the deployed hook reports no GAP under `.gemini/workflows/`. A hand-planted `.gemini/workflows/<minted>.js` is then reported as a GAP by name."
    must_catch:
      - "_sibling_capability_dir returns <output_root>/gemini/<output_rel> whenever that directory exists, so every contested .js is copied into gemini/workflows"
test_rationale: |
  The two unit entries pin the decision both ways. A contested script is not
  carried into a family it does not belong to, and a contested skill still is,
  so the fix cannot become "never carry anything". The integration entry runs
  the reported sequence (maker copy build, plain build, maker copy build) and
  the deployed hook. It also includes the control that a real foreign file is
  still a gap, so the hook cannot pass this AC by going quiet. That entry
  builds its own scratch project three times. It is a mutator: it switches the
  shim strategy between builds, and the shared reference layout cannot show
  that.
