assigned_agent: python-coder
estimated_complexity: M
package_surface: false
declares_side_effect: false
it_requirements:
  - >-
    POPULATION: evaluated only when the previous version's length under the current
    measure is strictly greater than the file's permitted length. Reuse the same
    previous-length value the ratchet computes (GE-127d-3-iii), never a second reading.
  - >-
    The backstop is a canary for gaps in the measure, so it must compare the measured
    length with a count the measure cannot influence: the total number of lines in the
    file. It reuses the previous-version resolution the ratchet already performs; when
    that resolution is INDETERMINATE (GE-127b-1-i) the backstop is not evaluated and the
    existing INDETERMINATE outcome stands.
  - >-
    A refusal here is a reported finding: exit status 1, as for every other size refusal.
test_spec:
  - name: test_ge_127d_4_measured_fell_while_total_rose_is_refused_and_named
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      In a temporary git repository, stage a version of a tracked covered file whose
      previous version is over its limit that removes C code lines and adds K comment lines
      with K > C (C and K varied). The hook refuses with exit 1, naming the file and both
      pairs of numbers, which the test computes at run time from the two versions with the
      shared measure and a plain line count.
    must_catch:
      - "backstop omitted"
  - name: test_ge_127d_4_an_under_limit_file_with_a_code_cut_and_more_comments_passes
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      The same code-cut-plus-more-comments change on a file whose previous version stands
      under its limit, and on one standing exactly at its limit (previous lengths computed
      with the shared measure at run time), completes through the hook with no backstop
      refusal. A file that the pre-2026-10-16 rule measured over its limit but the new rule
      measures at or under it also passes.
    must_catch:
      - "backstop evaluated for every covered file regardless of its limit"
      - "over-limit judged with > replaced by >= (a file exactly at its limit refused)"
      - "over-limit judged from the previous version's length under the pre-2026-10-16 rule"
  - name: test_ge_127d_4_the_backstop_catches_a_measure_gap
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      With the shared measure deliberately replaced in-process by the pre-2026-10-16 rule
      (`#` and `//` counted, /* */ and triple-quoted strings discarded), replay the
      2026-10-13 restyle of build-feature.js (over its 1000 limit under either rule) from the KI (`//` runs rewritten as /* */
      blocks) through the hook's verdict: it is refused by this backstop, naming the
      situation, even though the degraded measure reports the file shorter.
  - name: test_ge_127d_4_honest_shapes_are_not_refused_by_the_backstop
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      On a file already over its limit, measured and total both falling, and measured
      unchanged with total rising (comments only), each pass the hook without this
      refusal; so does a newly added file.
    must_catch:
      - "backstop fires when measured is unchanged and total rose"
      - "backstop fires on a newly added file"
  - name: test_ge_127d_4_the_backstop_refusal_reaches_the_registered_hook_output
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      Through the registered hook entry point, the backstop refusal and its four numbers
      appear in the hook's own output and the exit status is 1.
test_rationale: |
  Under a correct measure the backstop's honest trigger is "removed code and added more
  comments in one change" on an over-limit file, so the criterion descriptor exercises
  exactly that, and the under-limit descriptor proves the same change on a file at or under
  its limit is left alone (BrainCandy's 2026-10-16 population decision). Its real
  purpose is to catch a FUTURE gap in the measure, which no correct measure can
  demonstrate; the discrimination descriptor therefore degrades the measure to the known-
  gamed rule and replays the real 2026-10-13 restyle, proving the backstop catches what the
  measure missed.
