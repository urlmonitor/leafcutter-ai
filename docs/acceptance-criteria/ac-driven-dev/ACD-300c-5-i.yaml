it_requirements:
- 'Word-only edits: no line is added or removed in templates/workflows-js/plan-feature.js. Every ''Why why''
  there is a rationale pointer comment, at 15 sites (L1660, 1694, 1721, 1734, 1806, 2299, 2344, 2365, 2370,
  2401, 2581, 2912, 2957, 3079, 3189); all 15 are corrected.'
- Canonical sources only; deployed and installed copies are regenerated by the build and never hand-edited
  (ADR-001).
declared_files:
- path: templates/workflows-js/plan-feature.js
  state: existing
delivers_to: null
expects_from: null
test_intent:
- clause: every rationale pointer comment reads "Why" once, with the rest of its line unchanged character
    for character
  needs_test: true
  reason: Fifteen hand edits can drop or alter a character on a line, and only a per-site comparison catches
    that.
- clause: no line of the workflow source contains "Why why" in any letter case
  needs_test: true
  reason: A case-insensitive sweep of the whole source catches a missed site and stops the typo coming back.
test_spec:
- name: test_rationale_pointers_read_why_once
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Reads plan-feature.js: for each rationale pointer that read Why why (including those at
    about L1660, L1694 and L1721), the line now reads // Why followed by the same rest of the text, character
    for character.'
  proves_clause: it reads "Why" once, with the rest of the message unchanged character for character
  code_file: templates/workflows-js/plan-feature.js
- name: test_no_producible_text_says_why_why
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: reachability
  description: Runs plan-feature.js under run_workflow_under_e2 to the final gate and through a cancel;
    no returned message, agent prompt or logged line matches why why in any letter case.
  proves_clause: no message the workflow can produce contains the words "Why why" in any letter case
  code_file: templates/workflows-js/plan-feature.js
- name: test_workflow_source_has_no_why_why
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: discrimination
  description: A case-insensitive scan of the whole plan-feature.js source finds no why why.
  proves_clause: no message the workflow can produce contains the words "Why why" in any letter case
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - only the three named lines are fixed while the other Why why lines stay
  - the check is case-sensitive, so a WHY why or why Why survives
