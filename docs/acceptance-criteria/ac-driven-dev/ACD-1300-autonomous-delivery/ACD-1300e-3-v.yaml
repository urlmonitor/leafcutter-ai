criteria: |
  Given run R paused at its business-analyst decision point, with its pause record on disk and
    eleven drafted criteria on disk that are not committed,
  When the route is started again for run R with the person's answer for that decision point,
    and the step that looks up or reads the pause record declines to run on every attempt (it
    replies that it did not run the command, and gives a reason),
  Then the run does not end as "nothing to resume" and does not continue as though run R were
    not paused,
  And no authoring agent is sent to write or rewrite criteria for that stage,
  And the person's answer is not applied, and no approval or priority is recorded,
  And the run ends as "pause record unreadable", and its message says the step was declined,
    names the step and the agent that declined it, quotes the stated reason, says the record is
    still on disk and was not examined, and says the resume can be started again with the same
    answer,
  And the message does not say the record is damaged, malformed or absent,
  And the declined step is not sent to any other agent,
  And the pause record and the eleven drafted criteria are byte-identical afterwards,
  And when the route is then started again for run R with the same answer and the step runs,
    the answer is applied to that decision point exactly as ACD-2100c-3 requires,
  And the bug symptom (run wf_4a8567df-505, 2026-10-30: the look-up replied "I did not run this
    read. Reading the pause record is not one of the two actions this agent handles"; a declined
    look-up read as no record sends the author back over drafts the person had approved) must
    not occur.
