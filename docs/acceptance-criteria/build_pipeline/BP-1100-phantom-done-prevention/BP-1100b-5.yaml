id: BP-1100b-5
components:
  - build_pipeline
title: "A newly added presence-only assertion over workflow or gate source is rejected before the change is accepted"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a change whose staged hunks add a test assertion whose only check is that
  a named symbol appears in the text of a file matched by one of the scanned-source
  globs — `templates/workflows-js/**/*.js`, `scripts/workflows/**/*.js`,
  `templates/scripts/commit_guardian/**/*.py`, or `scripts/commit_guardian/**/*.py`
  — for example an assertion that the string "emit_agent_telemetry" is contained
  in that file's contents, or a regular-expression match that a function of a
  given name is declared there,
  And the added assertion carries no waiver comment,
  When the change is checked before it is accepted,
  Then the assertion is reported as a violation that names the test file, the
  asserted symbol, and the source file the assertion scans,
  And the report states that a presence-only assertion over workflow or
  commit-guardian source stays green on unreachable code and therefore is not
  coverage,
  And the report names the waiver comment as the way to accept the assertion
  deliberately.

  Given a change whose staged hunks add the same shape of assertion,
  And the added assertion is preceded by a waiver comment of the form
  `# presence-only: <reason>` carrying a non-empty reason,
  When the change is checked before it is accepted,
  Then the assertion is not reported,
  And the waiver comment and its reason are listed in the check's output so the
  waivers accumulated in the repository are readable in one place.

  Given a change whose staged hunks add a presence-only assertion over a file
  matched by none of the scanned-source globs,
  When the change is checked before it is accepted,
  Then the assertion is not reported.

  Given a repository that already contains presence-only assertions over the
  scanned sources, and a change that touches none of them,
  When the change is checked before it is accepted,
  Then no pre-existing assertion is reported, because the check reads the staged
  hunks and not whole files,
  And the check reports a violation on a newly added presence-only assertion
  regardless of who authored it and regardless of whether the same change also
  modified the source file the assertion scans.
