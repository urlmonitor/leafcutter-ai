notes: |
  THIS IS THE L1's PROMISE STATED AT ITS PLAINEST AND IT IS NOT A RESTATEMENT OF INF-1300a.
  a's subject is what the produced document is like; this record's subject is whether the
  production can happen where the instruction lands. A producer can satisfy every criterion
  under a, b, c and d in this repository and reach no adopting project at all — which is
  precisely the present state of the instruction it accompanies.

  THE FALSIFIABILITY CONSTRUCTION, AND WHY THE NEGATIVE HALF IS PART OF IT. Create an empty
  project with none of this package's source. Adopt the package into it the way an adopter
  does, taking nothing else. Read the instruction as it arrived in that project, and run
  exactly what it says, from where that project's authors would run it. The record is
  falsified if the step fails, if it requires the adopter to supply or copy anything, or if
  the invocation the arrived instruction states is not one the arrived means accepts. It is
  ALSO falsified by an observation performed anywhere this package's working tree is
  reachable — that is the negative half, and it is not pedantry: the L1 says in terms that
  verifying in the source tree proves nothing about the deployed one, and this repository's
  recorded history contains several artifacts that passed in the source tree and were
  missing, or crashed on import, in a consuming project. An observation that cannot tell the
  two layouts apart has not tested this record.

  THE LAST CLAUSE IS ABOUT THE SECOND INSTALL, WHICH IS THE ONE NOBODY TESTS. An artifact can
  arrive on a first adoption through a path that a later update does not repeat, leaving
  projects that updated worse off than projects that did not. Requiring the step to still
  work after the adopting project takes a later version is what makes the delivery durable
  rather than a one-time placement.

  FENCED, AND THE FENCE IS THE L1's OWN. This record is about the means being PRESENT AND
  USABLE where the rule lands. It is deliberately not about build phases, manifests or
  deployment mechanics — those are the how, and the L1 warns against writing criteria about
  them. Whether the two surfaces and the means agree about the invocation is INF-1300e-2's;
  whether the document produced there survives that project's own checks is INF-1300e-3's;
  whether the guard that should have caught all this tells the truth is INF-1300e-4's.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale, delivers_to and expects_from. Those are the IT PO's.
