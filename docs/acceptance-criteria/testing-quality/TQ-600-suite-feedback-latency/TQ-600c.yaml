criteria: |
  How long the suite takes is measured on every run, held to an agreed limit,
  and reported by name when something crosses it.

  Today nobody knows what the suite costs until they sit through it, and there
  is nothing that would notice it getting worse — which is how it reached an
  hour and a half without any single change ever looking like the culprit.
  Speeding it up once only helps if it stays fast. After this, every run
  records what it cost and where, exceeding the agreed limit is a failure
  rather than a note, and the report names the specific tests responsible so
  the next person does not have to repeat the investigation from scratch.
