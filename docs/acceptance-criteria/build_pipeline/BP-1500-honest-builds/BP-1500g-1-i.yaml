notes: |
  WHY THIS IS AN L3 UNDER BP-1500g-1 AND NOT A SIBLING L2. It is the same outcome
  -- the adopter's work survives -- reached down a second route. Splitting it to
  its own L2 would have implied two guarantees an implementer could deliver
  separately, and the observed defect is precisely that they cannot be: closing
  one route while leaving the other open leaves the adopter with no safe placement,
  which is the status quo. The third Then clause states that pincer directly and
  is the clause to check an implementation against.

  THE LAST CLAUSE IS NOT A NICETY. A destructive mode whose only means of
  observation is to perform the destruction cannot be verified by the people most
  exposed to it, and it is why the first half of KI-BP-009 sat unconfirmed for six
  days while the reporter -- rightly -- declined to run it. It is written as an
  outcome ("can find out what would be removed") rather than as a named option, so
  the implementer chooses the surface.
