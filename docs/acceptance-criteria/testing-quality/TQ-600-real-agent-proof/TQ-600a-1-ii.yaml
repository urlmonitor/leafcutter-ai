notes: |
  RELOCATED FROM BO-3200f-2-ii SCENARIO 5 (user decision, BrainCandy, 2026-09-17). The
  first scenario is carried over with "the executor is not registered" generalised to
  "the agent the case names is not registered" and "the three live scenarios" to "the cases
  that ask a real agent". The four causes and the three outcomes are unchanged.

  WHAT WAS ADDED. The second scenario moves BO-3200f-2-ii's IT PO decision that a launch
  or parse failure must never reach a scenario's check as an empty reply into criteria.
  Reason: the transport this mechanism reuses already has that defect (false-green M6,
  KI-TQ-20260908-0900), so it is the most likely way the first scenario is quietly broken,
  and it is an observable outcome rather than a design choice.

  WHY A SKIP IS A FAILURE HERE. Switched on and unable to ask is the case test frameworks
  most often report as a skip, because that is what they do with missing credentials. A
  skip under an explicit switch is a silent pass by another name.

  WHY THE PERMISSION CAUSE IS LISTED. Nothing is pre-approved (user decision 2026-09-16):
  no permission-skipping flag, no allowed-tools list, no settings overlay. An unattended
  run WILL meet permission requests. It must fail naming them, at once, rather than wait.

  CLASSIFICATION IS MECHANICAL. Causes are told apart from the request's own signals,
  never by scanning the agent's prose for words (BO-3200f-2-ii IT PO decision; for the IT
  PO to carry over).
