  - "When required fields exactly fill the allowance, optional omission is recorded in checkpoint/trace diagnostics outside that full request; diagnostic additions must not make the outbound payload oversized."
test_required: true
test_spec:
  - name: "test_required_envelope_overflow_rejects_before_provider_call"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "boundary"
    description: "tests/kernel/entity_context/test_projection.py::test_required_envelope_overflow_rejects_before_provider_call: Choose a cap below serialized required {state,questions}, assert JevPayloadTooLarge/explicit rejection, zero recording-provider calls and unchanged full goal."
    must_catch: ["Measuring only state while ignoring question/envelope serialization overhead.","Truncating the goal to make a receiver limit pass."]
  - name: "test_exact_fit_required_envelope_omits_optional_context_safely"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_projection.py::test_exact_fit_required_envelope_omits_optional_context_safely: Set cap to exact required serialization length; assert request succeeds without optional fields, external omission diagnostics exist and no hidden extra byte exceeds the cap."
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
