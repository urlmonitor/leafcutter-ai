id: ACS-300i-2
components:
  - ac_store
title: "Components with no external interfaces have an empty array"
component: ac-store
level: L2
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given a component is purely internal (it exposes no contracts
    consumed by other components),
  When the component entry is written to docs/components.json,
  Then exposed_interfaces is set to an empty array [],
  And it is never omitted or set to null.
  And the validator rejects any entry where exposed_interfaces
    is absent or null, requiring an explicit empty array for
    components that have considered and found no external interfaces.
depends_on: []
doc_links:
  - path: docs/components.json
    relationship: extends
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Must reject null and absent values for exposed_interfaces (same pattern as agent_affinity)"
  - "Must treat empty array [] as a valid explicit declaration"
delivers_to: null
expects_from: null
test_spec:
  - name: test_acs_300i_2_every_registry_entry_declares_exposed_interfaces
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: real_artifact
    description: "Load the REAL docs/components.json and assert every entry declares exposed_interfaces, with [] accepted as an explicit declaration. Measured 2026-08-25: 45 entries, 9 declaring — this must be RED on HEAD. The criteria say the validator rejects ANY entry where the field is absent or null; a validator accepting 36 such entries does not."
  - name: test_acs_300i_2_empty_array_is_accepted_and_null_is_not
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: boundary
    description: "The distinction the criteria turn on: [] means 'considered, none found' and passes; null and absence each fail by name. Collapsing the three cases is the likely wrong fix, because it makes the whole registry pass without anyone considering anything."
  - name: test_acs_300i_2_validator_reports_the_registry_total_not_just_its_scope
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "Same scope-honesty assertion as its sibling ACS-300h-1: a run over a change containing one compliant entry must state both what it examined and the registry total, so a narrow verdict can never be read as a registry-wide all-clear."
test_rationale: |
  Identical failure shape to ACS-300h-1 and it must not be closed the same way twice.
  The existing covering test exercises validator logic on synthetic entries; it passes
  regardless of the real registry's state, which is why 36 violations sat under a done
  record.

  The real-artifact descriptor is expected RED on HEAD. The boundary descriptor exists
  because the cheapest way to turn the first one green is to stop distinguishing [] from
  absent — which would satisfy the letter of the count while destroying the property the
  AC is about.
origin_agent: business-analyst-v3
created: 2026-06-05
amended_by: [it-po-v3]
superseded_by: null
covered_by:
  - unit_tests/commit_guardian/test_check_components_integrity.py::TestValidateExposedInterfacesAcs300i1Acs300i2
implemented_by:
