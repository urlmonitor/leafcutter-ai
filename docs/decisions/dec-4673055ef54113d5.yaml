    title: Native read-only GitHub source for facts that feed decisions, with host handoff only for anything beyond reading
    description: Facts the kernel decides on (is CI green, how long checks take, which PRs are open and what they touch) come
      from a native read-only GitHub source as verifiable evidence; anything that is not a read (merging, commenting, re-running
      CI) stays outside the kernel and goes to the host as host work or is reported as a capability gap.
