estimated_complexity: S
it_requirements:
  - "_parse_yaml_list_field must match block sequences with ZERO-OR-MORE leading whitespace ([ \\t]* not [ \\t]+) in both the outer field pattern and the item findall, so PyYAML-default column-0 dashes parse. The original [ \\t]+ requirement made the hook a silent no-op on every real ticket (files_touched dumped at column 0)."
  - "When the block-sequence pattern does not match, fall through to a flow-sequence branch that parses files_touched: [a, b]; split items quote-aware (only on commas outside a quoted span) so a quoted item containing a comma stays one item."
  - "Strip each parsed item via _strip_yaml_value: remove surrounding matching single/double quotes FIRST (a quoted value's interior is returned verbatim, including a legitimate ' #' inside the quotes), then strip a trailing inline YAML comment (space-hash rule) only for unquoted values."
  - "PORTABLE SURFACE: this parsing lives in the same hook (templates/scripts/commit_guardian/hooks/check_files_touched_reconciliation.py) pinned in BP-1100e-1; ADR-001 build.py round-trip parity applies."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
