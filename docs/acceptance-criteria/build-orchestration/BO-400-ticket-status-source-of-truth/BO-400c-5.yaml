  - name: test_done_status_all_signed_off_passes
    target_dir: unit_tests/commit_guardian
    framework: pytest
    type: unit
    description: "A status: done ticket with every phase signed_off exits 0."
  - name: test_done_status_other_violation_stays_warn_only
    target_dir: unit_tests/commit_guardian
    framework: pytest
    type: unit
    description: "A status: done ticket whose only violation is a Sign-offs parity gap (no needed/failed agent) exits 0 and still prints the warning."
  - name: test_done_status_crlf_line_endings_blocks
    target_dir: unit_tests/commit_guardian
    framework: pytest
    type: unit
