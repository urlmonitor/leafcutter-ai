assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The set of files staged by the stage commit must be derived from the AC store's actual working-tree changes made during the stage, not solely from the list of files the stage agent reports as written; the agent report is an input, not the authority"
  - "An AC file in the AC store that the stage did not create or modify must never be staged, even if it is a sibling or ancestor of a reported file"
  - "Must not alter the git index state of any file outside the AC store directory"
  - "Must not re-stage AC files already committed by a previous stage of the same run"
  - "When the stage commit is rejected by a pre-commit hook, the hook name and its output must be surfaced to the user and the workflow must not advance (per ACD-300g)"
  - "At least one test must reproduce the defect: a stage whose agent reports only the child while the parent's covered_by edit exists on disk; this test must fail against the current reported-files-only staging behaviour"
delivers_to: null
expects_from:
  ac_id: ACD-300g-2
  contract: "The stage commit step in the /plan-feature workflow that stages AC store files for the completed stage and commits them; this AC extends its staged-file set to include modified parent AC files"
test_spec:
  - name: test_stage_commit_includes_parent_whose_covered_by_was_updated
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    description: "Agent reports only the child AC as written; parent covered_by edit exists on disk; the stage commit contains both child and parent files (red against current code)"
  - name: test_stage_commit_passes_parent_covered_by_hook
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    description: "With the parent covered_by edit present, the stage commit is not rejected by check-ac-parent-covered-by"
  - name: test_stage_commit_excludes_unmodified_sibling_ac
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    description: "An AC file in the store that the stage did not modify is not staged"
  - name: test_stage_commit_excludes_files_outside_ac_store
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    description: "An uncommitted change outside the AC store is not staged and remains uncommitted after the stage commit"
