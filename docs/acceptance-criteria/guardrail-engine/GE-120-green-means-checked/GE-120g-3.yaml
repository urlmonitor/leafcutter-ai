id: GE-120g-3
title: "The guidance a check author reads states what declaring a role commits the check to, and states that a refusal comes from an objection"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the published guidance an author of a new check is directed to before
    declaring which role that check takes,
  When that author reads what the roles mean,
  Then the guidance states the obligation each role carries — that a check declaring
    the judging role must leave the working copy exactly as it found it, and that a
    check needing to alter anything declares the other role instead,
  And it states that the obligation follows from the declared role alone, with no
    per-check exemption and no list to be added to,
  And it states that a refusal an author meets comes from some check's objection and
    never from the act of a check having run,
  And it no longer presents the declared role as only an input to deciding which
    failures may be repaired for the author automatically,
  And an author who follows the written guidance exactly meets the behaviour the
    checks actually enforce, so the written rule and the enforced rule agree at the
    point where they could disagree,
  And it describes the obligation as in force rather than as forthcoming, optional,
    or as something a later pass will supply.
depends_on:
