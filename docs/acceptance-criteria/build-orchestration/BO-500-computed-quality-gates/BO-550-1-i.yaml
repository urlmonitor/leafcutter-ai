id: BO-550-1-i
title: "IT PO modifying agents map for testing is rejected in favor of test_constraints"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given the computed agent chain system (BO-560) derives the agents map
    from change_type and produces traits,
  And the IT PO attempts to manually add test-writer or test-runner
    to the agents map with a non-standard status or position,
  When the ticket enters the build system,
  Then the manually-authored agents map is overwritten by the computed chain
  And the IT PO's manual test-agent additions are discarded
  And the system uses the change_type and produces trait to determine
    whether TDD agents are needed (not the IT PO's manual additions)

  Given the IT PO wants integration tests instead of unit tests,
  When the IT PO sets test_constraints: { isolation: integration }
    instead of manually adding agents,
  Then the computed chain still includes test-writer (because the work agent
    produces production_code)
  And test-writer reads the test_constraints to write integration tests
  And the IT PO's intent is honored without touching the agents map

  Given a validation check runs on ticket frontmatter before dispatch,
  When an agents map contains manually-added test-writer or test-runner
    entries that conflict with the computed chain,
  Then a warning is emitted:
    "agents map will be recomputed -- manual test agent entries will be overridden.
    Use test_constraints to control testing strategy."
depends_on: [BO-550-1, BO-560-3]
