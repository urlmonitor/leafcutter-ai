notes: |
  THE TWO WRONG OUTCOMES THE L1 SEPARATES, AND WHY THIS RECORD HOLDS BOTH. The plausible-
  looking wrong document is excluded by the fourth clause: nothing is produced that the
  project would refuse. The bare failure is excluded by the first: a refusal that does not
  say what to supply puts the author back to improvising, and the L1 is explicit that
  building the success path and leaving the failure path to a written instruction is how
  this gap was created in the first place. A criterion holding only one of the two would
  leave the other, and the other is what happens today.

  THE SECOND CLAUSE IS ATOMICITY AND IT IS THE HARDEST TO GET RIGHT. A refusal discovered
  late — after the document has been written and while the parent's list of children is
  being updated — leaves a document the author did not ask for, a half-updated neighbour, or
  both. The state afterwards must be the state before, whichever step the refusal was
  discovered at. That is a real constraint on how production is ordered, not a message
  requirement, which is why it is stated as an observation about the project rather than
  about the run.

  THE THIRD CLAUSE EXISTS BECAUSE THIS TREE WILL BE CONSUMED BY MACHINERY AS WELL AS PEOPLE.
  A refusal whose outcome is indistinguishable from success until someone reads the prose is
  a refusal that an automated caller will treat as a success — and both authoring surfaces
  instruct an agent, not only a human. The outcome has to carry the verdict.

  THE LAST CLAUSE IS WHAT STOPS THIS BECOMING A CLAIM ABOUT ONE REFUSAL. Refusal paths are
  written one at a time and diverge immediately: the first is careful, the third is an early
  return that leaves a file behind. Requiring every reason in the tree to be observed
  separately is what makes this a contract rather than an example.

  FALSIFIABILITY. Enumerate every reason a request is refused across this tree — an
  undeclared kind, an occupied destination, a tier-and-number collision, a parent that does
  not exist or sits at the wrong tier, a component the registry does not declare, a missing
  field a kind obliges. For each: snapshot the whole scratch project, make the request,
  snapshot again, and require the difference to be empty; require the run's outcome to say
  failure without reference to its message; and read the message for both halves — what was
  wrong AND what to supply. The record is falsified by any reason whose difference is
  non-empty, by any refusal whose outcome reads as success, and by any message that states
  only the problem. It is also falsified by an observation that exercises one reason and
  generalises: that is the construction this record's last clause exists to forbid.

