id: GE-113c-3-i
components:
  - commit_guardian
title: "A path-qualified allowlist entry does not suppress findings at a different directory with the same basename"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: critical
criteria: |
  Given the security allowlist contains the entry "GENERIC_SECRET:src/foo.py:*",
  And the secrets scanner detects a GENERIC_SECRET finding in the file "deploy/foo.py",
  When the scanner evaluates whether the allowlist entry suppresses the finding,
  Then the finding at "deploy/foo.py" is NOT suppressed,
  Because the allowlist path segments ["src", "foo.py"] are not a suffix
    of the finding path segments ["deploy", "foo.py"]
  And basename equality ("foo.py" == "foo.py") is not sufficient when the allowlist
    entry is path-qualified.

  Given the security allowlist contains the entry "GENERIC_SECRET:src/config/secrets.py:*",
  And the secrets scanner detects a GENERIC_SECRET finding in the file "src/config/secrets.py",
  When the scanner evaluates whether the allowlist entry suppresses the finding,
  Then the finding at "src/config/secrets.py" IS suppressed,
  Because the allowlist path segments match the finding path segments exactly.
