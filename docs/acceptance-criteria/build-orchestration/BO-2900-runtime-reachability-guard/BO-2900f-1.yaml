work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a work item requests three quality gates — gate A, gate B and gate C —
    And gate B is not executed because a project-level setting that governs it is
      switched off,
    And gate C is not executed because a precondition it needs is absent,
    And gate D exists in the project but this work item did not request it,
  When the work item's gate results are recorded,
  Then the recorded results contain an entry for gate B whose outcome is `skipped`
    and whose reason names the setting that switched it off and where that setting
    is read from,
    And an entry for gate C whose outcome is `skipped` and whose reason names the
      absent precondition,
    And an entry for gate A carrying the outcome gate A actually produced,
    And NO entry for gate D, because a gate the work item never requested is not a
      gate that failed to run.
