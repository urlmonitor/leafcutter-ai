id: FIN-100c-3
readiness: reviewed
priority: medium
components:
  - finalize
title: "Null baseline causes all failures to be treated as regressions"
level: L3
component: finalize
status: superseded_by
parent: FIN-100c-2
criteria: |
  Given Step 0 failed to capture a baseline (baseline_failures is null)
  And the post-merge test run reports one or more failing tests
  When the triage agent receives baseline_failures=null
  Then it cannot distinguish pre-existing from new failures
  And it classifies ALL post-merge failures as "regression" (conservative path)
  And blocks_finalization is set to true
  And the triage summary explains that classification is conservative due to missing baseline
origin_agent: "business-analyst-v3"
created_by_ticket: "tickets/99_done/TICKET-20260604-FinalizeFeatureStepReorder.md"
assigned_agent: "test-failure-triage"
estimated_complexity: S
it_requirements: |
  - Must detect baseline_failures === null as the trigger for conservative classification
  - Must classify ALL post_merge_failures as "regression" (no exceptions)
  - Must set blocks_finalization=true immediately and return
  - Triage summary must explain that classification is conservative due to missing baseline
  - This is the Step 1 early-return path in the triage algorithm
delivers_to:
  - agent: "finalize-feature-workflow"
    contract: "provides triage_report with blocks_finalization=true and all failures as regressions"
expects_from:
  - agent: "finalize-feature-workflow"
    contract: "provides baseline_failures=null (indicating failed baseline capture)"
doc_links:
  - path: "templates/agents/test-failure-triage.md"
    relevance: "Step 1 — Handle null baseline (immediate conservative classification)"
  - path: "docs/how-to/finalize-feature.md"
    relevance: "Step 0 graceful degradation and its downstream consequence on triage"
depends_on:
  - FIN-100a-2
superseded_by: FIN-100c-9
amended_by:
  - reason: "it-po-reconciliation"
    entry: "SUPERSEDED by FIN-100c-9. This AC specified the conservative null-baseline path (baseline null -> ALL failures regression, HALT) as the PRIMARY/only behavior, which directly contradicts the new FIN-100c-4 primary path (baseline null -> targeted main-HEAD rerun to recover a baseline instead of blanket regression). Reconciliation chosen: Option (b) — supersede FIN-100c-3 by FIN-100c-9 rather than narrow its criteria trigger (narrowing the trigger would require editing the BA-owned criteria field, which is out of IT-PO lane; superseding is a metadata operation). FIN-100c-9 is the narrowed successor: it preserves the exact conservative behavior described here (all failures regression, blocks_finalization=true, triage Step 1) but fires ONLY when the targeted main-HEAD rerun cannot be performed, and additionally surfaces modified_by_branch per failing test. The triage agent template's Step 1 null-baseline behavior is unchanged and is now reached only via the FIN-100c-9 fallback. Set status: superseded_by and superseded_by: FIN-100c-9. Criteria and it_requirements left intact for lineage."
    by: it-po
covered_by:
  - "unit_tests/workflows/test_finalize_pre_merge_safety_gate.py"
implemented_by: []
change_target: pipeline
risk_surface: contract_boundary
work_status: done
