id: INF-400h
title: "Supervisor templates execute feedback emission at every adjudication point"
component: infrastructure
level: L1
status: active
work_status: todo
criteria: |
  Every supervisor adjudication decision is recorded as a feedback entry.

  The epic-supervisor and ticket-supervisor templates contain imperative
  instructions (not example code) that call submit_feedback.py at each
  adjudication point — mechanical retries, cross-agent rework, brainstorm
  escalations, and exhausted adjudication ladders. The emission happens
  before any retry or escalation, ensuring the feedback corpus captures
  the full decision history of every drive.
