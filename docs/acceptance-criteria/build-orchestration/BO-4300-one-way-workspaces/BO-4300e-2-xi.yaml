notes: |
  Observed 2026-11-02: leafcutter-ai-worktrees/feature/assemble-bundle-utf8-stdout keeps its
  record (state "ready") and its full working files, but its repository lost its pack objects
  (139 of its files left), so every retry fetched and failed FETCH_FAILED "pack has
  unresolved deltas". This record makes such a folder count as half-cleared, so the existing
  BO-4300e-2-vi flow (list the remaining files, one-time token, finish with it) applies to it
  instead of a fetch that can never succeed. After this ships, that real folder is finished by
  asking the maker again with the token from its refusal (operational check, not a CI test:
  the folder exists only on the user's machine).

  Safety: a damaged repository can hold commits nobody can read any more, so the refusal must
  say that commits cannot be checked -- the token then authorises the loss of whatever the
  folder holds, and the person is told so. The "feature/eta" arm is the boundary: an intact
  repository with unsent commits keeps the normal UNSENT_WORK check of BO-4300e-2 and is never
  treated as half-cleared; recognition must not be loose enough to skip the commit check.

  Files the project's ignore rules exclude (build outputs, the installed tools) are treated
  the same way as BO-4300e-2-vi treats them; this record does not change which files are
  listed. Whether remaining files whose exact content the shared project already holds may
  be finished without a token is an open question (Q2 in the BA sign-off) and is NOT part of
  these criteria.

  Interaction with BO-4300e-2-ix: a clearing that stops inside the repository under the new
  maker is finished without a token by -ix. This record covers leftovers that carry no sign
  of a clearing that passed the unsent-work check -- such as the observed folder, left by the
  older maker, or a repository damaged by other means.
