change_target: code
risk_surface: contract_boundary
test_required: true
test_rationale: |
  This check has two outcomes decided by the journey's approval state, so a single fixture
  cannot prove it: the same unregistered screen must be shown to warn under one approval state
  and to block under the other. Asserting only the blocking case would pass an implementation
  that always blocks, which would stop work on every draft journey.
test_spec:
  - name: test_unregistered_screen_on_an_unapproved_journey_warns
    target_dir: unit_tests/product_truth/
    description: "A step naming an unregistered screen in a draft journey produces a warning and does not stop the caller."
    type: integration
    angle: boundary
    framework: unittest
  - name: test_unregistered_screen_on_an_approved_journey_stops_the_caller
    target_dir: unit_tests/product_truth/
    description: "The same step in an approved journey produces a blocking finding naming the journey, the step and the screen."
    type: integration
    angle: failure
    framework: unittest
  - name: test_registered_screen_is_not_reported
    target_dir: unit_tests/product_truth/
    description: "A step naming a registered screen produces no D4 finding under either approval state."
    type: integration
    angle: criterion
    framework: unittest
notes: |
  D4 of the four checks UXP-514 names.

  INTERACTION WITH UXP-700d. Today the only registered screens are the 10 fern-and-fig example
  mockups. Once example content is separated from a project's own record (UXP-700d-1), a step in
  a project-owned journey must not resolve its screen against the example product's registry, or
  D4 will pass by pointing at plant-shop screens. Whoever builds UXP-700d-1 must re-check this
  record.
