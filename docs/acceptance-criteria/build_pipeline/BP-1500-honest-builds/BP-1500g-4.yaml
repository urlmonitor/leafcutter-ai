    agent: it-po
    date: '2026-09-08'
    reason: "Added assigned_agent (how-to-author), estimated_complexity (S), it_requirements, test_required, test_rationale and expects_from. Criteria, title, depends_on and doc_links UNCHANGED; readiness remains draft. NOTES ON THE CHOICES. (1) assigned_agent is `how-to-author`, the registry's leaf documentation author for `docs/how-to/`, rather than the `documentation-expert` that the it-po template's documentation_triggers table nominates for the how-to trigger. Both are in `config/agent_registry.json` and `how-to-author` is `is_ticket_phase: true` with `spawned_by` including documentation-expert, so the coverage the S7b gate checks for is present; the leaf author is named directly because documentation-expert dispatching a specialist and returning before it finishes is a known hazard in this repo. Flagged rather than done silently. (2) test_required: false, with the reasoning recorded, because this AC produces prose and no executable behaviour. The test_rationale additionally names a reading to REFUSE: the runnable check the page must contain is CONTENT of the deliverable, not coverage of it, and adding a suite test that runs it would re-test BP-1500g-1 under this AC's name while leaving this AC unverified. (3) The it_requirements make the ordering dependency a HARD GATE -- if the honest answer is still `nowhere safe` when this is picked up, stop and say so; publishing the least-bad option as guidance is worse than the current silence, because it tells adopters to put work somewhere a later build reclaims. (4) The enumeration of build invocations is required to be read off the argument parser at authoring time rather than recalled; as of origin/main 1cce5b48a the modes with distinct consequences for adopter content are the plain run, the opt-in removal mode, the no-shims variant and the dry-run/report path."
