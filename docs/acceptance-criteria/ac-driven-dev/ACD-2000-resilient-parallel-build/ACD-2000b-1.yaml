notes: |
  EXTEND THE EXISTING PRIMITIVE -- DO NOT INVENT A SECOND ONE. ACD-2000b's notes
  are explicit: "Any L2 that proposes a lockfile, a separate registry, or a
  second status vocabulary is the wrong answer -- extend claim_build_set /
  release_claim."

  VERIFIED, ALREADY IMPLEMENTED (do not re-investigate), in
  scripts/build_orchestration/fast_lane.py:
    - `claim_build_set()` (~line 128) flips every named AC whose work_status is
      `todo` to `in_progress`, detects an already-`in_progress` AC (~line 193)
      and reports it via `error` without double-flipping.
    - `release_claim()` (~line 224) returns claimed-but-not-done ACs to `todo`
      "on a non-success run exit so no AC is permanently stuck in in_progress
      blocking future runs (BO-2400f-10)".
  So "visibly taken" and "handed back on a clean exit" already work for one
  caller. WHAT IS MISSING is everything in the second and third Then clauses.

  THE ACTUAL GAP IS OWNER AND TIMESTAMP (ACD-2000b hazard 1, verified):
  `work_status: in_progress` records THAT a requirement is taken but not BY WHOM
  or SINCE WHEN. Without those two facts nothing can ever distinguish a live
  claim from an abandoned one, which is why ACD-2000b-3's reclaim rule is
  impossible to state until this AC lands. That is the dependency shape to keep
  in mind: owner+timestamp are not metadata niceties, they are the inputs to the
  promise the L1 makes ("never stuck as somebody else's unfinished business").

  THE THIRD THEN CLAUSE IS THE GENERALISATION, and it is the whole reason this L1
  exists. Today the fast lane claims and the supervisor does not look -- two
  concurrent drives have no shared notion of who owns what. A test that exercises
  only the fast lane passes on the status quo. The AC therefore requires the
  general build path to participate in the SAME record, not merely to have its
  own equivalent.

  HAZARD 4 IS A DECISION THIS AC DELIBERATELY DOES NOT MAKE FOR THE IT PO, but
  must not be left implied: `in_progress` currently doubles as a human-facing
  lifecycle value AND as the lock. Every other writer of work_status (mark-done
  flows, scanners, reconciliation passes, hand edits) can therefore steal or
  silently drop a lock, and the readiness scanner cannot distinguish "a machine
  has claimed this" from "a person is working on it". Either introduce a separate
  claim field or keep the overload and enumerate every writer -- ACD-2000b-1-i
  asserts the behaviour that either choice must produce.

  INTERACTION WITH ACD-2000a: every claim and release rewrites the whole AC
  record via `_update_ac_work_status()` (~lines 113-125), so the trail passes
  through a yaml round trip on every operation this AC performs. See
  ACD-2000a-1-i, which owns that assertion.

  TESTABILITY. Take and hand back a real requirement through both callers and
  assert what a third reader observes at each point. Asserting that a field is
  written is insufficient -- the L1's promise is about what an OBSERVER can see,
  and today the supervisor is an observer that does not look.

  2026-08-17 (IT PO enrichment). HAZARD 4 DECIDED: a dedicated claim record, not
  a further overload of `work_status`. A lifecycle value may be set by anyone; a
  lock may be released only by its holder. The two access rules are
  irreconcilable on one field, and the enumerate-every-writer alternative is
  strictly more work and strictly more fragile.

  THE DUAL-WRITE IS THE NON-OBVIOUS CONSEQUENCE OF THAT DECISION, and it is
  recorded as an it_requirement because an implementer who moves the lock off
  `work_status` cleanly will introduce a regression: `scan_ac_store`'s ready
  filter (`_matches_work_status`, ~line 148, default `todo`) is the ONLY thing
  that currently hides a claimed requirement from the general drive. Stop
  flipping `work_status` and every claimed requirement becomes ready again. Keep
  both writes until the `enforce` stage.

  THE THIRD THEN CLAUSE SPANS TWO CRAFTS AND IS DELIBERATELY NOT SPLIT. Making
  the general drive participate could be read as editing
  `templates/skills/building-epics/SKILL.md` (prose, llm-expert) or the epic
  workflow JS. It is scoped here to Python on purpose: the claim read must sit
  inside the shared store-level helper both entry points already call, so the
  drive cannot select a requirement WITHOUT consulting the claim. A runbook step
  is unenforceable, and an unenforceable step is what produced this gap. The
  operator-facing description of that obligation is ACD-2000b-5's job.
