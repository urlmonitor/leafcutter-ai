criteria: |
  The v3 authoring agents drop their version suffixes and become the
  canonical names.

  product-owner-v3 becomes product-owner, business-analyst-v3 becomes
  business-analyst, and it-po-v3 becomes it-po. The agent registry,
  template filenames, and all internal references (skill files, workflow
  scripts, command templates) use the new names. No agent in the registry
  carries a version suffix.
