title: "AC with implements_pattern but empty criteria is valid"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a page AC has implements_pattern: "PTN-001" and
    pattern_bindings: {entity_type: "users", columns: ["name", "email"]},
  And the page has NO unique behavior beyond what the pattern provides,
  When the AC is authored with an empty criteria field
    (criteria: "No page-specific behavior — all behavior inherited from pattern."),
  Then the schema validator accepts the AC without error,
  And the AC is valid despite having no Given/When/Then in its own criteria,
  And the effective behavior is entirely derived from the referenced pattern.
