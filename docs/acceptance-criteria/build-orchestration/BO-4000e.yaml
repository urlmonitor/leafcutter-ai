risk_surface: contract_boundary
package_surface: false
criteria: |
  Given a run whose worktree has been established
  When target resolution hands back the epic or ticket as an absolute path inside the
    MAIN CHECKOUT, rather than inside that worktree
  Then the path is re-rooted onto the worktree before it reaches the planner
  And no agent the run dispatches is given a path inside the main checkout
  And the work the drive plans is the work as it stands in the worktree, including
    everything the branch has already committed.

  Given the same run
  When resolution instead hands back a repo-relative path, or a path already inside the
    worktree
  Then both still land on the worktree copy
  And a path that is already worktree-resident is returned unchanged, never joined onto
    itself a second time.

  Given the drive has re-rooted the target
  When a phase agent writes to the ticket record
  Then the write lands in the worktree
  And the main checkout's own copy of that ticket is left untouched.
