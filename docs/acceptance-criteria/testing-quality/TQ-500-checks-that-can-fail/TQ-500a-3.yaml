notes: |
  WHY THE REVERT CLAUSE IS NOT CEREMONY. The substitute evidence is the only
  procedure in the pipeline that deliberately breaks working behaviour. A revert
  that is not confirmed leaves the alteration in the tree, where it is a live
  defect introduced by the very act of proving the tests would catch defects. And a
  revert that is confirmed only by re-reading the change, rather than by re-running
  the tests, does not establish that the tree is where it started.

  WHY "SPECIFICALLY ENOUGH TO APPLY AGAIN". "Broke the behaviour and the tests went
  red" is unfalsifiable prose: nobody can check it, and it reads identically whether
  the alteration was the one the requirement guards or something incidental that
  happened to break the suite. Naming the alteration to the point of repeatability
  is what makes TQ-500e's later reader able to judge the evidence rather than take
  it on faith.

  DELIBERATELY OUT OF SCOPE: whether the alteration was a good choice — whether it
  is the leak the requirement actually forbids. No record can establish that, and
  claiming it could would be the self-certified non-vacuity KI-TQ-010 warns about.
  What this tree can establish is that the tests discriminate against a named,
  repeatable alteration, and that a later reader can see which one.
