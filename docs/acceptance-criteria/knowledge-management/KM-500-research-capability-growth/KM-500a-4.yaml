assigned_agent: python-coder
estimated_complexity: L
it_requirements:
- Reuse existing ask_jev, provider secret loader and reserve-before-use task budgets through the public KernelService/run
  interface; deterministic explicit operation selection must make zero additional semantic calls.
- Use independently reviewed cases covering ready, missing typed input, supported missing query, unsupported
  source, ambiguous selection and provider failure. Record provider/model and prompt/settings identifiers,
  source SHA, catalog descriptor digests, expected/actual outcome, calls, latency and unresolved cases without
  credentials or unnecessary raw context.
- Require explicit authorization for real external context transfer before opt-in evaluation. Missing authorization
  or credentials is not_run, distinct from failed quality. Scripted controls remain separately labeled; this
  AC authoring does not authorize a provider call.
- Freeze quality thresholds and evaluation cases before scoring the proposed planner; count unavailable/denied/exhausted
  cases explicitly rather than relabeling them successful capability gaps.
test_required: true
test_rationale: Planned public-interface and separately labeled real-artifact proof covers the full observable
  obligation. Existing mechanism tests are reusable but do not establish real-agent, provider or deployment
  readiness. No planned test is represented as existing coverage.
expects_from:
  ac_id: KM-500a-2
  contract: Reuse the existing bounded implementation and canonical contracts; add only this explicit lifecycle
    or readiness obligation.
