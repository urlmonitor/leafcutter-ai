readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a project previously installed via build.py and has:
    - .claude/agents/frontend-coder.md (old agent template)
    - .claude/skills/frontend-design/SKILL.md (old separate skill)
  When the adopter runs "python leafcutter-ai/scripts/build.py --target-dir ."
    with the new package version containing the unified agent
  Then the file .claude/agents/frontend-coder.md is overwritten with the
    unified template (containing embedded design principles)
  And the directory .claude/skills/frontend-design/ is removed
  And no manual configuration edits are required by the adopter
  And the build output reports the migration was performed
