notes: |
  USER GATE (2026-10-15): the user approved this AC as written, including
  the runner's own scope check (IT-PO decision e), at the review gate.

  USER DECISION (2026-10-15). TQ-500g-1-ix (done, merged) makes the
  writer's list and write steps take each owed name's in-scope files from
  the in_scope_files of the AC test entries naming it. Only 23 of the 738
  declared test entries carry that field. Without a fallback every unscoped
  name has no in-scope file, the preparer can prepare nothing for it, and
  every work whose ACs carry such names stops before commit once the routes
  are wired (TQ-500g-1-v, -vi, -vii). The user chose:
    - When no in-scope file is declared for a name on any entry naming it,
      its scope is the non-test files the work changed relative to the base
      ref, worked out by code from version control.
    - Never from the route or from the preparer.
    - Declared in_scope_files still wins whenever present.
    - Test files, paths outside the repository and the version-control
      folder stay refused.
    - A name with no declared scope in a work that changed no non-test file
      has an empty scope (fail closed).

  THIS REVERSES ONE TQ-500g-1-ix it_requirement. Its "Per-name scope" entry
  says scope is never inferred from changed files and an unscoped name has
  files []. That stays true for names with declared files; for unscoped
  names this AC replaces it. TQ-500g-1-ix is done and is not edited here.

  CLAUSES THE BA ADDED BEYOND THE BRIEF, with reasons.
    - "Declared" means declared on ANY entry naming the name ("retry only
      once"). The -ix scope rule is a union over entries; mixing declared
      and derived files for one name would make its scope depend on which
      entry happens to carry the field.
    - A file the work added counts as changed (retry_policy.py); a file it
      deleted does not (legacy_refresh.py), since there is nothing left to
      alter. Changes count whether committed or not, because the per-ticket
      routes run the gate before their commit with HEAD as the base ref.
    - The list shows "declared" or "derived" per name, so a reader of a
      stopped work can tell a missing declaration from a missing change.
    - An unknown base ref stops the list with an error. Silently treating
      the changed set as empty would fail closed but hide the cause;
      treating it as the whole repository would fail open.

  OPEN POINTS FOR THE IT-PO (the BA did not decide these):
    1. How the base ref reaches the list and write steps (a new flag taking
       the value the route passes to the runner) and the JSON field that
       carries "declared" / "derived" in the owed list.
    2. Renamed files: whether a rename counts as the new path changed.
    3. Whether the runner itself needs the derived scope, or only agrees
       with it through the shared reader.
    4. test_spec, test_rationale and the matching TQ-500g-1-ix contract text
       (delivers_to says the write step derives scope "itself"; still true).

  CROSS-REFERENCE. This AC supersedes the "scope is never inferred from
  changed files" clause of TQ-500g-1-ix it_requirements "Per-name scope", for
  owed names with no in_scope_files on any entry naming them. Names with a
  declaration keep the -ix rule unchanged. -ix is done and stays unedited; a
  reader of -ix should follow this AC for unscoped names.

  IT-PO ENRICHMENT (2026-10-15). python-coder, L. The open points, decided
  (details in it_requirements):
    1. Base ref: a new --base-ref flag on both list and write, default HEAD,
       the value the route passes to the runner. Owed-list field: an
       additive third key, scope: "declared" | "derived", on each owed item.
       The write stdout and the manifest are unchanged.
    2. Renames: --no-renames, as in the runner's fix undone. The new path is
       added (in scope) and the old path deleted (not in scope).
    3. The runner enforces the scope too. It computes each name's files
       through the same owed_names and refuses a manifest entry that alters a
       file outside them. Without that, "the runner gives every name the same
       in-scope files" would hold only by convention, and a hand-made or
       stale manifest could run an out-of-scope alteration. This is the one
       runner behaviour change; the TQ-200d-1-i eval fixtures must still pass.
    4. TQ-500g-1-ix's write contract ("derives each name's in-scope files
       itself") stays true. The route now also passes --base-ref.
  Additional decisions: untracked non-ignored files count as added (the
  per-ticket routes run before the commit with base HEAD, so a new file is
  often not staged yet); the AC store is excluded, as in the fix undone; a
  name whose declaration lists only test files stays "declared" with [];
  the changed files are worked out lazily, only when some name is
  unscoped, so declared-only stores need no resolvable base ref. Route
  follow-up: TQ-500g-1-v's gate wrapper must forward its --base-ref to the
  write step, not only to the runner.
