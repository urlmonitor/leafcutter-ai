title: "Recorded urgency is the first thing the queue consults, ahead of size"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given four pieces of work are ready to be picked up, recording urgencies of
    critical, high, medium and low respectively,
  And their recorded sizes are chosen so that size alone would order them the other
    way round — the critical piece is the largest and the low-urgency piece the
    smallest,
  When the queue is asked which work is ready,
  Then they are offered critical first, then high, then medium, then low,
  And size does not disturb that order anywhere in the list, so the offer is not
    ordered by size with urgency applied afterwards, nor by size at all.
