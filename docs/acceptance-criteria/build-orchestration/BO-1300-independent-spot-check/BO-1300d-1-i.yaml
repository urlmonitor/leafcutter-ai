it_requirements:
  - "Completion output must read the consolidated result's blocking findings (BO-1300b-2 shape) and render: a non-clean status, the count of blocking findings, the angle that raised each, and the inbox ticket location(s) where they were recorded."
  - "When blocking findings exist the output must not present the feature as cleanly done; the distinction between clean-done and done-with-blocking-findings must be unambiguous to the user."
  - "The ticket references in the output must match the actual inbox ticket paths written by BO-1300e-1 so the user can navigate to the tracked work."
