notes: |
  THE DESTRUCTIVE-INTERFERENCE CASE, spelled out because it is invisible to any
  test that runs one proof.

  THE TWO VERIFIED MECHANISMS THAT COLLIDE
  (templates/agents/user-surface-smoker.md):
    - Step 1 refuses to start when the worktree has staged changes
      ("Pre-smoke worktree has staged changes").
    - Step 5 runs `git restore .` unconditionally after every stanza.
  Run N members' proofs in one pass and these two produce three distinct
  failures, all of which this AC forbids:
    1. DESTRUCTION -- member A's proof produces an uncommitted artefact as its
       observable effect; member B's stanza-end restore wipes it before A is
       checked. A false FAIL that looks like a real defect in A.
    2. FALSE PASS -- the symmetric case, where the restore returns the tree to a
       state in which B's assertion holds for a reason unrelated to B's change.
       Worse than (1) because nobody investigates a pass.
    3. REFUSAL -- member A's proof leaves the tree dirty and member B's Step 1
       pre-check aborts the whole run. Reads to the operator as an environment
       problem, not as a design flaw in the aggregation.
  The fourth Then clause names case (3) explicitly so an implementation cannot
  satisfy this AC by making the run abort cleanly.

  THE ORDER-INDEPENDENCE CLAUSE is the actual specification. Isolation is hard to
  assert directly; "the same two outcomes in either order" is observable, is
  exactly what isolation buys, and fails loudly on every shared-tree
  implementation. It also rules out the tempting shortcut of ordering members so
  the destructive one runs last, which works until membership changes -- and
  membership changing without revalidation is the core argument for moving the
  proof to the requirement in the first place (ACD-1800f notes).

  IMPLEMENTATION SPACE (IT PO's call, not constrained here): a fresh worktree per
  proof; a restore scoped to only the paths that proof declared; or capturing the
  observation before cleanup rather than after. Any of these satisfies the
  criteria; the current unconditional whole-tree restore satisfies none.

  TESTABILITY. This must be driven in a REAL git worktree with a proof that
  really writes a file. A mocked invocation removes the `git restore .` from the
  picture and the test then passes on the broken implementation -- the same
  synthetic-fixture bias that let EPIC-PhantomDoneFilesTouched ship a hook that
  was a no-op on every real ticket (CLAUDE.md, "Real-artifact behavioral
  spot-check before declaring done").

  2026-08-17 (IT PO enrichment).

  TECHNIQUE STILL LEFT OPEN, but two constraints are added that the criteria do
  not state and that every listed technique must satisfy:
    (a) the observation is captured BEFORE any cleanup runs. A proof whose
        observable effect is an uncommitted file cannot be judged after a
        restore, whichever restore is used.
    (b) the dirty-worktree PRE-CHECK moves to the per-proof baseline alongside
        the cleanup. Scoping only the cleanup converts failure mode (1) into
        failure mode (3) -- a clean abort -- which the fourth Then clause was
        written to forbid. This is the single most likely partial implementation.

  FAILURE MODE (2) NEEDS ITS OWN TEST, and it is the one an implementer will
  leave out. Modes (1) and (3) are loud; (2) is a pass. A suite that asserts only
  "both proofs are observed" is satisfied by an implementation in which B's
  assertion happened to match the restored baseline -- which is the false green
  the whole ACD-1800f tree exists to remove, reproduced inside its own fix. The
  fourth test descriptor exists solely for it.

  HARNESS SELF-VALIDATION, added by analogy with BO-2900a-2's observation_ok
  flag: an isolation harness that silently fails to establish a baseline makes
  every proof look isolated. An unavailable baseline must be a distinct reported
  outcome, never a successful observation.
