created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  Given a commit fails a gating hook that is listed in blocking_hook_ids and whose
    tier is the judgment tier,
  And the hook output includes a line naming the originating agent (e.g. an
    "AUTOFIX_AGENT: python-coder" line emitted by the hook),
  And the ticket contains a context_capsule for that agent,
  When the auto-fix path runs between parsing the failing hook ids and dispatching a fixer,
  Then it reads the originating agent id from the hook output (never a hard-coded role literal),
  And it loads the latest context_capsule for that agent from the ticket,
  And it dispatches the SAME agent type, passing the ticket path, the context_capsule,
    the failing hook ids, and the raw hook output,
  And the dispatched agent is instructed to fix only what satisfies the hooks, honor the
    capsule rationale, and reuse the capsule's consumers_checked rather than looking them up again.
depends_on: [BO-210c, BO-210a-2, BO-210b-1, GE-102c, GE-102d]
