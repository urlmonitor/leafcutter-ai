id: TQ-600a-13-xi
components:
  - testing_quality
title: "Neither the nightly nor the hold ever changes the repository's code"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given that the tests the nightly runs exist to catch silent corruption, that some of
    them are guardrail tests, and that an unreviewed overnight change to a guardrail test
    is the riskiest change in this repository to automate,
  And the owner's decision that triage may be automated in a later piece of work and that
    fixing may not,
  When the nightly run, the flag lifecycle, and the hold check each run along every path
    they have — green night, red night, did-not-complete night, hold, pass, declared fix,
    failed read,
  Then none of them creates a commit, pushes or deletes a branch or tag, opens, edits,
    approves or merges a pull request, or modifies any file tracked by the repository,
  And the only writes they make to the hosting service are creating, commenting on,
    closing and reopening issues labelled `nightly-red`, creating and editing the hold
    check's own pull request comment, and reporting check results,
  And this is demonstrated by running each path against a recording double of the
    hosting service and a real scratch clone of the repository, and observing that the
    recorded writes are a subset of the list above and that the clone's branches, tags
    and working tree are unchanged,
  And adding a step that pushes a change, opens a pull request, or edits a tracked file
    to any of these paths makes that demonstration fail.
