change_target: code
risk_surface: internal
notes: |
  "Worked through, not written off" is only checkable if the remaining count moves
  and the movement matches the decisions actually taken. Prove it across two real
  cycles with real decisions recorded in between, then check the arithmetic —
  do not assert that a counter field exists.

  The no-return clause guards a specific regression: a naive implementation
  recomputes the pile from the sweep each cycle and, because a decided-but-not-yet
  -fixed record is still unproven, drags it straight back into the awaiting pile.
  That makes the remaining count permanently flat and the whole exercise look
  futile even while people are working it.

  The unchanged-count clause keeps a zero-progress cycle honest and visible rather
  than silently skipped.

  IT-PO ENRICHMENT NOTE (2026-08-17). One interaction the criteria do not name and
  that would otherwise misreport progress: new arrivals. A cycle in which three
  records are decided and three others newly lapse leaves the remaining count
  unchanged, which reads as zero progress under a single-figure implementation
  even though the exactness clause was satisfied. it_requirements therefore
  require decided and newly-arrived to be reported as separate components.
