title: "Re-home a requirement with a single change"
component: ac-store
level: L1
status: active
req_status: approved
work_status: todo
criteria: |
  Move a requirement under a new parent without renaming it or touching anything that points to it.

  Reorganizing the tree — splitting an overcrowded branch, rebalancing, or moving a
  requirement to a better home — is a single change to where it says its parent is.
  The requirement keeps its name, and every existing dependency, coverage, contract,
  and supersedes link keeps working untouched.
