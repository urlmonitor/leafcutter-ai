id: BO-4400a-1-i
title: "A run that ends with nothing to deliver still clears the workspace it was given"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
criteria: |
  Given three runs, each in a workspace obtained from the one workspace maker, that end
    without opening a pull request because there is nothing to deliver:
    - the fast lane pointed at a requirement whose whole build set is already built, so
      its build set resolves to zero items,
    - the build of an epic whose every ticket is already marked done,
    - requirements authoring where the person stops at the first gate before anything
      is drafted,
  When each run returns its final result,
  Then for each run no folder remains at the location its workspace occupied,
  And the clearing was performed by the one shared clearing door, whose answer appears
    in the run's final result,
  And each run's final result states that there was nothing to deliver, so a
    no-op is distinguishable from a delivery,
  And no branch was pushed and no pull request was opened by any of the three runs.
depends_on: [BO-4400a-1]
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-4300-one-way-workspaces/BO-4300e-2.yaml
    relationship: constrains
    status: exists
  - path: docs/how-to/fast-lane-build.md
    relationship: describes
    status: exists
    relevance: The fast lane's empty-set path, which today returns early.
assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: BO-4400a-1
  contract: "The route-end clearing call, reused on the early-return path."
package_surface: false
declared_files:
  - path: templates/workflows-js/fast-lane-ship.js
    state: existing
  - path: templates/workflows-js/build-epic.js
    state: existing
  - path: templates/workflows-js/build-feature.js
    state: existing
  - path: templates/workflows-js/plan-feature.js
    state: existing
it_requirements:
  - >-
    HARNESS PREREQUISITE: the proof runs the real maker through the exec bridge that BO-4400g-4 adds to
    unit_tests/_workflow_engine_harness.py, so it is built after that bridge (through BO-4400a-1's depends_on
    BO-4400g-4).
  - >-
    The three early-return exits -- fast-lane-ship.js when the build set resolves to zero items,
    build-epic.js / build-feature.js when every ticket is already done, plan-feature.js when the
    person stops at the first gate before anything is drafted (ACD-2100c-5 discard semantics) --
    reach the SAME route-end clearing step BO-4400a-1 delivers. The step is shared, not copied per
    exit, so a new exit path cannot skip it.
  - >-
    The final result carries delivered: false and an explicit nothing-to-deliver reason alongside
    the door's answer, so a no-op is machine-distinguishable from a delivery without parsing prose.
  - >-
    No push dispatch and no pull-request dispatch is issued on these paths. The clearing request is still
    the route's one name-based per-work clear-landed command of BO-4400g-2, sent to shell-runner (ADR-030,
    ADR-070; user decision D1), with no discard authorisation. With no commit of its own and nothing unsent,
    that command clears the workspace at once through the door, with no idle threshold (user answer Q2,
    2026-11-16).
  - >-
    PROOF as BO-4400a-1: deployed workflows under unit_tests/_workflow_engine_harness.py, maker
    executed for real against temporary repositories and a bare hub, assertions on the recorded
    dispatch list, the final result and the disk -- never on workflow source text. Same isolation
    and no-build.py rules.
test_required: true
test_intent:
  - clause: for each run no folder remains at the location its workspace occupied
    needs_test: true
    reason: An early return is where a clearing call is classically skipped, which only the disk after each no-op run shows.
  - clause: 'the clearing was performed by the one shared clearing door, whose answer appears in the run''s final result'
    needs_test: true
    reason: A no-op path that deletes by its own means leaves no door answer.
  - clause: 'each run''s final result states that there was nothing to deliver, so a no-op is distinguishable from a delivery'
    needs_test: true
    reason: A caller must tell a no-op from a delivery without parsing prose, and the result field is checkable.
  - clause: no branch was pushed and no pull request was opened by any of the three runs
    needs_test: true
    reason: A no-op that still pushes or opens a pull request leaves work on the shared project, which the hub's refs show.
test_spec:
  - name: test_fast_lane_with_empty_build_set_clears_its_workspace
    proves_clause: for each run no folder remains at the location its workspace occupied
    code_file: templates/workflows-js/fast-lane-ship.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Fast lane pointed at a fully built requirement returns with no folder left at its workspace location and the door's answer in its result."
    must_catch:
      - "clearing wired only on the pull-request path (early return skips it)"
  - name: test_epic_with_every_ticket_done_clears_its_workspace
    proves_clause: for each run no folder remains at the location its workspace occupied
    code_file: templates/workflows-js/build-epic.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Epic build whose tickets are all done returns with its workspace removed through the door."
  - name: test_authoring_stopped_at_first_gate_clears_its_workspace
    proves_clause: for each run no folder remains at the location its workspace occupied
    code_file: templates/workflows-js/plan-feature.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "plan-feature with the first gate answered stop returns with its workspace removed through the door."
  - name: test_no_op_result_states_nothing_to_deliver
    proves_clause: 'each run''s final result states that there was nothing to deliver, so a no-op is distinguishable from a delivery'
    code_file: templates/workflows-js/_shared/workspace-answer.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Each of the three results carries delivered false and the nothing-to-deliver reason."
  - name: test_no_op_runs_push_nothing_and_open_no_pull_request
    proves_clause: no branch was pushed and no pull request was opened by any of the three runs
    code_file: templates/workflows-js/fast-lane-ship.js
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The recorded dispatch list of each run contains no push and no pull-request step; the hub has no new branch."
  - name: test_nothing_to_deliver_workspace_made_minutes_ago_is_cleared_at_once
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      Grounding added at the test-designer pass (nothing above is weakened). A workspace made minutes ago by the real
      deployed maker, with no commit of its own and nothing unsent, is cleared by the per-work command
      clear-landed --kind K --slug S (the route's one clearing command) with no idle threshold, while the whole
      pass over the same project keeps it as no_own_work (its newest file is minutes old). The test runs both
      against the deployed maker in a subprocess, so the two behaviours are told apart on one fixture.
    proves_clause: 'the clearing was performed by the one shared clearing door, whose answer appears in the run''s final result'
    code_file: templates/scripts/worktree.py
  - name: test_fast_lane_empty_build_set_exit_reaches_the_shared_clearing_step
    proves_clause: 'the clearing was performed by the one shared clearing door, whose answer appears in the run''s final result'
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      The deployed fast-lane-ship.js with a requirement whose build set resolves to zero items returns early through
      its empty-set path; the recorded dispatches contain the clearing dispatch (shell-runner, per-work clear-landed)
      and no push or pull-request dispatch. Needs the live shell stand-in the harness lacks today.
    code_file: templates/workflows-js/fast-lane-ship.js
  - name: test_epic_all_tickets_done_exit_reaches_the_shared_clearing_step
    proves_clause: 'the clearing was performed by the one shared clearing door, whose answer appears in the run''s final result'
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      The deployed build-epic.js with every ticket already done returns early and still sends the clearing command.
    code_file: templates/workflows-js/build-epic.js
  - name: test_authoring_stopped_at_the_first_gate_reaches_the_shared_clearing_step
    proves_clause: 'the clearing was performed by the one shared clearing door, whose answer appears in the run''s final result'
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      The deployed plan-feature.js with the person stopping at the first gate (nothing drafted) returns and still
      sends the clearing command; the workspace folder is gone.
    code_file: templates/workflows-js/plan-feature.js
