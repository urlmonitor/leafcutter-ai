id: GE-127h-3
components:
  - commit_guardian
readiness: approved
priority: high
title: "The published measurement rule says the decision-history block is left out and how its start and end are found"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given the size standard refuses a file and states the measurement rule it applied,
  When an author reads that stated rule,
  Then it says that a decision-history block is not counted,
  And it says that the block starts at a comment whose whole text is "DECISION HISTORY"
    (together with a rule line of "=" characters directly above it, if there is one), and
    ends at the first line that is not a comment line,
  And it says that ordinary comments are still counted,
  And an author who applies the stated rule by hand to the Python example of GE-127h-1
    arrives at 80 lines.
depends_on:
  - GE-127h-1
  - GE-127d-2
doc_links:
  - path: docs/acceptance-criteria/guardrail-engine/GE-127-files-stay-workable/GE-127d-2.yaml
    relationship: related
    status: exists
    relevance: >-
      Requires the published rule to be taken from the rule in force and to reproduce the
      quoted length; this record states only WHAT the rule must now say. Do not restate GE-127d-2.
assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
- The stated rule is produced from the rule in force (GE-127d-2), and every published place that the rule-agreement
  check (GE-127d-1) compares is updated in the same change as GE-127h-1.
- describe_measurement_rule probes the rule in force, so it gains a 'decision history' probe category,
  and the GE-127d-2 test fixture's parse_discard_categories gains the same category. GE-127d-1's agreement
  check compares the covered file kinds, not the measurement rule, so it does not require the published
  surfaces to change. The only stale copy of the rule is the prose in commit_guardian.json's file_size._comment,
  which is corrected in the same change so it no longer says every hash comment line is counted.
  templates/scripts/commit_guardian/README.md needs no change (it points to describe_measurement_rule
  and states no rule); it stays declared as a published rule surface that must stay free of a restated
  rule.
declared_files:
- path: templates/scripts/commit_guardian/_file_size_ratchet.py
  state: existing
- path: templates/scripts/commit_guardian/README.md
  state: existing
- path: templates/scripts/commit_guardian/commit_guardian.json
  state: existing
- path: unit_tests/commit_guardian/_ge_127d_2_fixture.py
  state: existing
delivers_to:
  agent: documentation-expert
  contract: The published measurement-rule sentence, exactly as the size standard states it in its refusals
    and published-rule output, for GE-127h-4's reference doc to quote verbatim.
expects_from:
  ac_id: GE-127h-1
  contract: 'The size standard''s measured length of a file (int >= 0) leaves out each line-comment DECISION
    HISTORY block: a comment whose whole text is DECISION HISTORY, an optional ''='' rule line directly
    above it, through the last consecutive comment line. Every other line counts as before; before- and
    after-lengths use the same rule.'
test_intent:
- clause: it says that a decision-history block is not counted
  needs_test: true
  reason: The stated rule is generated text that must now name the exclusion.
- clause: it says that the block starts at a comment whose whole text is "DECISION HISTORY" (together
    with a rule line of "=" characters directly above it, if there is one), and ends at the first line
    that is not a comment line
  needs_test: true
  reason: The start and end conditions must be stated so an author can apply them by hand.
- clause: it says that ordinary comments are still counted
  needs_test: true
  reason: Saying ordinary comments still count keeps the rule from being misread as wider.
- clause: an author who applies the stated rule by hand to the Python example of GE-127h-1 arrives at
    80 lines
  needs_test: true
  reason: Reproducing the quoted length by hand is the published-rule promise of GE-127d.
test_spec:
- name: test_ge_127h_3_stated_rule_says_a_history_block_is_not_counted
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: describe_measurement_rule() states that a decision-history block is not counted.
  proves_clause: it says that a decision-history block is not counted
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_127h_3_stated_rule_follows_the_rule_in_force
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Rebinding count_content_lines to the pre-change rule removes the history sentence from
    describe_measurement_rule(): the sentence is generated by probing, never hard-coded (GE-127d-2).'
  proves_clause: it says that a decision-history block is not counted
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_127h_3_refusal_measures_line_states_the_history_exclusion
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: reachability
  description: 'Stage an oversized Python file and run the fixture copy of check_file_size.py as a subprocess;
    the Measures: line of the refusal states the history-block exclusion. Uses _ge_127d_2_fixture.build_fixture_tree
    (a copy of the production modules in a temporary git repository, no build.py, no POSIX flock).'
  proves_clause: it says that a decision-history block is not counted
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_127h_3_published_config_rule_states_the_history_exclusion
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Reads the shipped commit_guardian.json: the MEASUREMENT RULE sentence of file_size._comment
    (a published_rule_surfaces entry) says a decision-history block is not counted and no longer says
    every hash comment line is counted without exception.'
  proves_clause: it says that a decision-history block is not counted
  code_file: templates/scripts/commit_guardian/commit_guardian.json
- name: test_ge_127h_3_stated_rule_names_where_the_block_starts_and_ends
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: The stated rule says the block starts at a comment whose whole text is DECISION HISTORY,
    with a directly-above '=' rule line if there is one, and ends at the first line that is not a comment
    line.
  proves_clause: it says that the block starts at a comment whose whole text is "DECISION HISTORY" (together
    with a rule line of "=" characters directly above it, if there is one), and ends at the first line
    that is not a comment line
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_127h_3_stated_rule_says_ordinary_comments_still_count
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: The stated rule says ordinary comments are still counted.
  proves_clause: it says that ordinary comments are still counted
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_127h_3_applying_the_stated_rule_by_hand_gives_80
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: criterion
  description: 'An independent counter that reads the Measures: line (as _ge_127d_2_fixture.parse_discard_categories
    does, extended with the history category) and applies it to the GE-127h-1 Python example arrives at
    80, the length the check quotes.'
  proves_clause: an author who applies the stated rule by hand to the Python example of GE-127h-1 arrives
    at 80 lines
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
