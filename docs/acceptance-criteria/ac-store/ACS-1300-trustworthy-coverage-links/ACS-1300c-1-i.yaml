id: ACS-1300c-1-i
components:
  - ac_store
title: "Reusing an existing backfill that promotes finished state does not satisfy the refusal"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given an existing store tool whose apply step writes both a traceability link and the
    finished-state value for every record it matches,
  And a store on disk holding records that need a coverage entry restored,
  When a build of the repair that reaches its write path by calling that apply step is
    run out of process against that store,
  Then the finished-state check fails, naming each record whose finished state changed
    and the value it changed to,
  And when a build of the repair that writes the coverage entry without calling that
    apply step is run out of process against a copy of the same store from the same
    starting bytes, the finished-state check passes,
  And both runs restored the same coverage entries, so the difference in verdict is
    attributable to the write path and not to a difference in what was repaired or in
    what the two runs were given.
depends_on:
  - ACS-1300c-1
doc_links:
  - path: scripts/ac_store/cross_reference_audit.py
    relationship: relates-to
    status: exists
    relevance: "THE CONCRETE TRAP, MEASURED 2026-09-01. _apply_backfill sets work_status to done for every high-confidence match it applies and logs the promotion as it goes. This tool is a named anti-duplication candidate for this tree, so an implementer told to reuse it will find a working apply path that does the right thing and one forbidden thing alongside it. Reuse its enumeration helpers — _detect_worktree_root, _load_ac_yamls, _write_report; never its apply."
  - path: docs/acceptance-criteria/ac-driven-dev/ACD-800c.yaml
    relationship: relates-to
    status: exists
    relevance: "The criterion that tool's apply path implements — 'implemented_by receives the ticket path, work_status becomes done' — stated as a requirement. It is correct for its own tree and incompatible with this one, which is why ACD-800 was rejected as a parent. Reusing the code inherits the criterion."
  - path: scripts/ac_store/backfill_components.py
    relationship: relates-to
    status: exists
    relevance: "THE REUSE THAT IS SAFE, offered so this AC is not read as forbidding reuse generally. It writes one field by targeted line insertion, touches no finished state, and skips files already satisfying the condition — the shape the repair's write path should follow."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "THE VIOLATION USED AS THE FIXTURE IS REAL AND IS IN THIS REPOSITORY. Verified 2026-09-01: `scripts/ac_store/cross_reference_audit.py::_apply_backfill` sets `ac_data[\"work_status\"] = \"done\"` at line 457, logs the promotion, and re-serialises the record — violating the finished-state refusal and byte stability in one call. Do not substitute a hand-written stub that merely sets the field; the point of this record is that the violation is a WORKING apply path an implementer is actively advised to reuse."
  - "THE FINISHED-STATE CHECK MUST BE AN INDEPENDENT ARTEFACT, NOT AN ASSERTION INSIDE ONE TEST. It has to be runnable against an arbitrary build of the repair, because this AC's whole content is running it twice against two builds. A check that exists only as a line in a test function cannot be pointed at a second build."
  - "TWO BUILDS, ONE STARTING STATE. Both runs begin from byte-identical copies of the same store, and both must restore the SAME coverage entries. Asserting only that the forbidden build fails leaves open a check that fails on everything; asserting only that the permitted build passes leaves open a check that fires on nothing. The equal-repairs clause is what isolates the write path as the only difference."
  - "THE FORBIDDEN BUILD IS A TEST FIXTURE AND MUST NOT BE SHIPPED OR IMPORTABLE FROM PRODUCTION CODE. It is the repair's write step pointed at the other apply function, constructed for the duration of the test and no longer. Nothing in `scripts/` may retain a reachable path to `_apply_backfill`."
  - "THE FAILURE MESSAGE MUST NAME EACH RECORD WHOSE FINISHED STATE CHANGED AND THE VALUE IT CHANGED TO. A check that reports only 'finished state was written' leaves the implementer to find which of ~3,700 records, and an unactionable failure gets suppressed rather than fixed."
  - "THIS AC ITSELF WRITES NO `work_status` OUTSIDE THE DELIBERATE FIXTURE. The forbidden build writes it by construction, inside a temporary store, so the test asserts the check catches it. No production path may."
  - "Must handle errors gracefully per the project error handling policy. The check must fail closed: if it cannot read a record's finished state before or after, that is a failure of the check, never a pass — a check that cannot detect a violation is indistinguishable from a check confronted with none, which is the exact weakness this record exists to close."
