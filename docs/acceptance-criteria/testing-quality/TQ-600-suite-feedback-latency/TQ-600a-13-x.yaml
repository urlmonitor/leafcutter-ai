risk_surface: internal
notes: |
  The ruleset name and id are the requester's; the BA did not read the ruleset. Whether
  the automation's credential can READ the ruleset (as opposed to edit it) is not known
  here; if it cannot, the enforcement observation is a human step and is recorded by
  hand.

  The "every pull request, whatever it changes" clause is not in the approved design. It
  is a consequence of making the check required: a required check whose workflow does not
  run on some pull requests blocks those pull requests forever.
