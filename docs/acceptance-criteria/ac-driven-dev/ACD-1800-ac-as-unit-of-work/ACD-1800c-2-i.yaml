  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-026-ac-driven-build-v2-phased-migration.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Group membership is by AC id reference ONLY (ties to ACD-1600a thin-ticket single-source); the generator MUST NOT copy the requirement's criteria, deliverable checklist, or sign-offs into the ticket body."
  - "Enforce single-source at the commit gate rather than adding a new mechanism: reuse the ACD-1600a / check_ac_schema.py duplicate-criteria detection so a ticket that restates a grouped requirement is caught."
  - "Canonical source: scripts/ac_store/generate_ticket_from_ac.py."
delivers_to: null
expects_from:
  ac_id: ACD-1800c-1
  contract: "Thin grouping ticket that enumerates member AC ids by reference; this edge case constrains that reference to never restate the referenced requirement's content."
test_spec:
  - name: test_ticket_refers_to_requirement_by_id
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "A grouped requirement appears in the ticket only as an id reference."
  - name: test_ticket_does_not_restate_criteria_or_checklist
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "The ticket body does not restate the requirement's criteria, deliverable checklist, or sign-offs."
  - name: test_requirement_is_single_authoritative_copy
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    description: "The requirement record remains the single authoritative copy of that content."
