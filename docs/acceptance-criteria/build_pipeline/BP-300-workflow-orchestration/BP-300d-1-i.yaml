criteria: |
  Given a build for a supported Claude Code runtime,
  And a command whose only source is a prose skill body with NO deterministic
    workflow counterpart (it is not one of the primary delivery commands
    build-feature, create-ticket, finalize-feature),
  When build.py deploys the command set,
  Then that prose-only command deploys its prose body unchanged,
  And the supported-runtime routing rule does NOT flag it and does NOT require it
    to hand off to a workflow.
