notes: |
  THIS IS THE BINDING CONSTRAINT OF THE WHOLE L1, expressed as a behaviour no
  text-reading implementation can pass. The first two scenarios hold the returned text
  constant and vary only the project state; if the verdict differs, the judgement is being
  made from evidence. If an implementation reads the reply at all, the two scenarios must
  produce the same verdict and one of them fails. The third scenario closes the opposite
  door — a reply that describes work that does not exist.

  The exact reply text in the first scenario is the one recorded in KI-SS-001 from
  2026-08-18. It is confident, well-formed and entirely wrong, and it is what the parked
  agent actually returned. Using the real text rather than a synthetic stand-in follows
  CLAUDE.md "Real-artifact behavioral spot-check": a hand-authored fixture reproduces the
  author's own assumptions about what a parked reply looks like.

  On 2026-08-18 the stall was caught only by comparing the project's tracked state against
  the agent's report. That comparison is the mechanism this AC makes mandatory rather than
  discretionary.

  WHAT "the project's working state" MEANS is deliberately left open here: the criterion
  requires that the comparison is of observable project state before and after, not which
  surface is inspected. Choosing the surface (tracked changes, untracked additions, or
  both) is an IT PO decision, and the choice interacts with BO-3100b-3 — a step whose only
  legitimate output is untracked would otherwise read as empty.

  BOUNDARY: BO-1900 dispatch-preflight fires BEFORE a specialist is spawned; this fires at
  exit. BO-1300 independent spot-check judges the QUALITY of work that was done; this
  judges only whether any was. BO-2500 and BO-2900 are the artifact layer — is the code
  real, tested and reached. Keep all four distinct.

  IT-PO DECISION (2026-08-26) — the surface question the BA left open is answered in
  it_requirements above: BOTH tracked and untracked, over content hashes, minus a declared
  volatile exclusion set. Two things are worth restating because they are easy to lose:

  1. The exclusion set is not housekeeping, it is the difference between a guard and a
     no-op. Every agent in this repository appends to debugging/logs/agent_telemetry.jsonl.
     If that counted, every parked agent would be judged to have produced work and this
     entire L1 would ship green and do nothing — the exact success-shaped nothing it exists
     to remove. It is therefore specified as a single declared, enumerable, reported set,
     not as an ad-hoc filter at the call site.
  2. The concurrency clause is a real open risk, not boilerplate. BO-3100c-3 requires
     independent steps to run at the same time. If a step's snapshot spans the whole project
     while a sibling is writing to it, a parked step inherits the sibling's work and passes.
     The implementer must choose per-step scoping or serialised judgement and cover the
     choice with a test; either is acceptable, silence is not.
