title: "Your own work in your own project survives every build"
component: build-pipeline
level: L1
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
criteria: |
  The build only ever removes what the build put there.

  Running a build never costs you a file, a folder, or an edit you made
  yourself. Anything in your project that leafcutter did not create is still
  there afterwards, unchanged, whichever way you ran the build -- the plain
  everyday command included, not only the careful one. Today the plain command
  is the dangerous one, which is the opposite of what anyone would assume.

  And there is somewhere in your project for the things you add yourself. If
  you write your own helper alongside the ones leafcutter ships, it keeps
  working and it keeps existing: the next build does not quietly reclaim the
  space you put it in, and neither does the next upgrade. Being told after the
  fact would not be enough -- an adopter who has to restore from backup has
  already lost, however clear the message was.

  Making room for your work must not cost you leafcutter's. An outcome where
  your helper survives because the package's own capabilities silently stopped
  arriving is not this outcome; both have to work at once, in the same project,
  after the same ordinary build.
