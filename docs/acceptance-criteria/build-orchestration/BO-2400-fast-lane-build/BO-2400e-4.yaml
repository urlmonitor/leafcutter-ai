notes: |
  GAP 3 OF THE 2026-08-17 FAST-LANE PASS, PART TWO OF TWO. Twin of BO-2400e-3. Both are
  properties of one write; they are separate ACs because survival and noise are
  different guarantees and an implementation can deliver either alone. Note the
  sequencing: this AC depends on BO-2400e-3 because whatever durable-write design lands
  there is the mechanism that must also preserve the record's shape. Landing this one
  first would specify the shape of a writer that BO-2400e-3 then replaces.

  RESOLVED 2026-08-18. SUPERSEDES THE ORIGINAL EVIDENCE BLOCK — READ THIS FIRST.
  The block that stood here was headed "VERIFIED EVIDENCE (2026-08-17, do not
  re-investigate)" and quoted a yaml.safe_dump round-trip at lines 98-125 with call
  sites at 203/261/376. Every one of those pointers is now wrong, and the
  "do not re-investigate" instruction actively produced the wrong answer when this
  record was next read (2026-08-25). It is replaced rather than annotated for that
  reason. Original text, for history:

      with yaml_path.open("w", encoding="utf-8") as fh:
          yaml.safe_dump(data, fh, allow_unicode=True)

  CURRENT STATE. _update_ac_work_status is at lines 130-210 and performs a targeted
  text edit of the single column-0 work_status line; the three call sites are at 288
  (in_progress), 346 (todo) and 461 (done). Measured on a real 177-line record: 2
  changed lines, against 305 for safe_dump(sort_keys=False) and 387 for the default
  dump. Eleven real records driven through all three call sites: 22 changed lines
  total, none outside work_status, 71 bystander records byte-identical. The targeted
  edit is also ~24-27x FASTER than the round-trip, so the performance constraint is
  met with room to spare.

  HOW IT CAME TO BE SATISFIED, AND WHY THAT MATTERS. This AC was not built. The same
  defect was independently recorded as known-issue KI-BO-003 one day after this record
  was authored, and fixed under that id on 2026-08-18. Two registries tracked one
  defect and neither closed the other, so this AC sat at work_status: todo for a week
  while the behaviour it demands was already shipped — and the fast lane kept selecting
  it as ready work. Worth remembering the next time a KI and an AC look like the same
  thing: they were.

  COVERAGE IS PARTIAL AND THE GAP IS THE DANGEROUS HALF. The 14 tests in
  unit_tests/build_orchestration/test_ki_bo_003_ac_yaml_preservation.py now carry
  `# covers: BO-2400e-4` alongside their original KI tag, which is what makes this AC
  done-eligible. They supply two of the four test_spec entries. Still missing: the
  eleven-record real-artifact case, and the `reachability` case that drives
  claim_build_set / release_claim / mark_done_built_acs rather than the private helper.
  Every existing test calls _update_ac_work_status DIRECTLY, so if BO-2400e-3's durable
  write introduces a NEW writer and repoints the three call sites at it, this suite goes
  on testing an orphaned function and stays green while the guarantee is gone. That is
  precisely the "two writers will drift" outcome constraint 3 warns about, and it is
  live right now because e-3 is being built after e-4 rather than before, inverting the
  order this AC's depends_on was written to enforce. Tracked as a TODO in
  docs/known-issues/build-orchestration.md.

  THE GUARANTEE HOLDS BECAUSE THE STORE IS UNIFORM, NOT BECAUSE THE CODE ENFORCES IT.
  A review on 2026-08-25 executed the function against constructed edge cases and found
  several inputs that break the "nothing else changes" property: a CRLF record is
  rewritten LF end-to-end (154 changed lines) while still parsing to the right value;
  `work_status:` followed by its value on the next line corrupts to 'done todo'; and
  `work_status : todo` or a quoted key silently appends a duplicate key. A scan of all
  3,257 store records found zero instances of any of these today, so all are latent.
  The CRLF one is filed separately — this repo is developed under WSL2 across /mnt/c,
  where a single Windows-tool write would make it live.

  WHY THIS IS WORTH AN AC AND NOT JUST A TIDY-UP. Three compounding consequences:
    - It buries the real change. A reviewer looking at a fast-lane commit sees a record
      reshuffled from top to bottom and cannot tell that one value moved. BO-2400e-2
      requires that each commit's claims be verifiable in its diff; this behaviour makes
      that impossible for every progress commit the lane produces.
    - It manufactures conflicts. Whole-file rewrites of shared store records collide
      with any concurrent authoring in the same folder — a recurring hazard in this
      workspace, where requirement authoring routinely runs alongside builds.
    - It multiplies the blast radius of BO-2400e-3's defect. A write that rewrites every
      line is a write with far more to lose when it is interrupted.

  STATED AS BEHAVIOUR ON PURPOSE. The criteria describe what the record looks like
  before and after, and say nothing about serialiser options, round-trip loaders or
  in-place editing. Any of those may be the right answer; that is the IT PO's call.

  TESTABILITY WARNING — THIS IS THE ONE THAT WILL BE FALSE-GREENED. A test that loads
  the record after the update and compares parsed values passes on the current
  behaviour, because a re-keyed record parses to an equal mapping. The assertion must be
  textual, and the fixtures must be real records copied from the store, for the reason
  CLAUDE.md's real-artifact rule records: synthetic fixtures reproduce the bug-hiding
  bias. A short, uniformly-quoted hand-written record survives re-serialisation almost
  unchanged; the store's actual records, with their block-scalar notes and mixed
  quoting, do not.

  IT-PO ENRICHMENT NOTE (2026-08-17). The IT PO's call the notes invite, recorded
  explicitly: `safe_dump(..., sort_keys=False)` is NOT an acceptable answer. It fixes the
  alphabetical re-keying — the most visible symptom — while still normalising block
  scalars, quoting and comments, so it would pass a key-order assertion and fail the real
  records in the eleven-member case. The acceptable designs are a round-trip-preserving
  loader or a targeted in-place edit of the single value; the constraint is written that
  way rather than naming one, because both satisfy the criteria. Assigned python-coder
  (single surface, no mixed-surface caveat); object-form it_requirements is mandated by
  the schema's root if/then for python-coder + build-orchestration.
