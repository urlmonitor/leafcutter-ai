it_requirements:
  - "The preflight stage must be invoked unconditionally between the ticket-read step and the phase-agent spawn step of the dispatch loop, for every ticket."
  - "An unfit verdict must short-circuit the spawn: the phase agent is never dispatched for a held-back ticket."
  - "The held-back record must carry the ticket id and the identifier of the failing check so the operator can act without re-running the drive."
