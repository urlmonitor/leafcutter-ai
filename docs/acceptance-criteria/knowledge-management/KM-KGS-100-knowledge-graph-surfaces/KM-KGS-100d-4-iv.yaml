criteria: |
  Given the project of KM-KGS-100d-4: criteria KM-EX-010, KM-EX-011, KM-EX-011-i
    and KM-EX-012, ticket T-1 at tickets/T-1.md, and the files scripts/foo.py and
    unit_tests/test_foo.py,
  When the knowledge map is built restricted to the acceptance-criteria surface,
  Then the map holds the criterion nodes KM-EX-010, KM-EX-011, KM-EX-011-i and
    KM-EX-012 and the files-surface nodes "scripts/foo.py" and
    "unit_tests/test_foo.py",
  And the implemented_by edge from KM-EX-010 ends on "scripts/foo.py" with anchor
    "_check_limits", and the covered_by edge from KM-EX-011 ends on
    "unit_tests/test_foo.py" with anchor "test_limits",
  And the covered_by edge from KM-EX-011 to KM-EX-011-i still ends on that
    criterion's node,
  And the implemented_by edge from KM-EX-012 ends on a files-surface node
    "tickets/T-1.md", because ticket T-1 is not on the restricted map,
  And the map holds no tickets-surface node and no files_touched edge,
  And every edge on the restricted map ends on a node on the restricted map,
  And the machine-readable export of a query restricted to the acceptance-criteria
    surface lists the files-surface nodes and these edges.
  Given the same project,
  When the knowledge map is built with no restriction,
  Then the implemented_by edge from KM-EX-012 ends on ticket T-1's node and no
    files-surface node "tickets/T-1.md" exists, as KM-KGS-100d-4 states.
