id: ACS-500g-5
components:
  - ac_store
readiness: approved
priority: high
title: "A retrospective sweep over the existing store seeds the first patterns and ends the cold start"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a store that already holds hundreds of ACs, contains zero patterns, and
    contains zero ACs that reference a pattern — so every pattern-first check comes
    up empty and another standalone AC is written,
  When the retrospective sweep runs across the whole store as a deliberate pass,
  Then it returns a list of pattern candidates ranked by recurrence count, highest
    first,
  And each entry names the behavior, the ids of the ACs it recurs in, the count, and
    the proposed slots,
  And on approval of the top-ranked candidates at least one pattern is written into
    the store and its source ACs are converted to reference it,
  And after the sweep the store contains at least one pattern and at least one AC
    that references a pattern,
  So that the next pattern-first check runs against a non-empty inventory instead of
    an empty one.
depends_on: [ACS-500g, ACS-500g-1, ACS-500g-2]
