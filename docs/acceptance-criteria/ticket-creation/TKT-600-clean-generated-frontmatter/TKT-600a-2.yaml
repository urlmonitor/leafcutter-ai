id: TKT-600a-2
title: "A path the record itself declares as non-edit-surface is not harvested from its own prose"
component: ticket-creation
components:
  - ticket_creation_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an AC record whose doc_links declare
    "templates/scripts/commit_guardian/check_secrets.py" at relationship modifies
    and "docs/known-issues/commit-guardian.md" at relationship related,
  And one of that same record's list-form it_requirements bullets also names
    "docs/known-issues/commit-guardian.md" in its prose text,
  When a ticket is generated from that record,
  Then the generated ticket's files_touched is exactly
    ["templates/scripts/commit_guardian/check_secrets.py"],
  And "docs/known-issues/commit-guardian.md" is absent from files_touched,
  Because the record has already stated, in its own structured declaration, what
    that file is to this work — context, not a surface — and a prose repetition of
    a path the record itself declared as non-edit-surface cannot promote it.

  Given an AC record whose list-form it_requirements contains the bullet
    "Modify scripts/goal_to_epic.py to ...",
  And that record's doc_links contain no entry whose path is
    "scripts/goal_to_epic.py" at any relationship,
  When a ticket is generated from that record,
  Then files_touched contains "scripts/goal_to_epic.py",
  Because with no structured declaration to contradict it, a real source path
    named in a prose bullet is still a real source path — this is the behaviour
    TKT-500f-8-i requires and it must remain unchanged.

  Given an AC record whose doc_links declare
    "scripts/ac_store/generate_ticket_from_ac.py" at relationship modifies,
  And one of that record's prose it_requirements bullets also names
    "scripts/ac_store/generate_ticket_from_ac.py",
  When a ticket is generated from that record,
  Then files_touched contains "scripts/ac_store/generate_ticket_from_ac.py"
    exactly once,
  And no duplicate entry for that path appears.

  Given an AC record whose doc_links declare
    "docs/architecture/components/ticket-lifecycle.md" at relationship describes,
  And one of that record's prose it_requirements bullets also names that path,
  When a ticket is generated from that record,
  Then "docs/architecture/components/ticket-lifecycle.md" is absent from
    files_touched,
  Because describes and related are both non-edit-surface relationships and the
    suppression is decided by the relationship being outside the edit-surface set,
    not by any single relationship value.

  Given an AC record that declares the SAME path
    "scripts/ac_store/generate_ticket_from_ac.py" twice in its doc_links — once at
    relationship related and once at relationship modifies,
  And one of that record's prose it_requirements bullets also names that path,
  When a ticket is generated from that record,
  Then files_touched contains "scripts/ac_store/generate_ticket_from_ac.py",
  Because an explicit edit-surface declaration anywhere in the record wins over a
    non-edit-surface declaration of the same path — the suppression applies only
    to paths the record declares as non-edit-surface and declares nowhere as an
    edit surface.
