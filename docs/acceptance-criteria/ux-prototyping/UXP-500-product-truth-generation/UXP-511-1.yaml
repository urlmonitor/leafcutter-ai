criteria: |
  Given product-truth flow files are loaded on any supported operating system,
  When generate_product_truth.py derives the by_flow index paths,
  Then every stored flow path uses forward slashes in repository-relative form,
  And a Windows rebuild must not report unchanged product-truth data as stale
  because the host pathlib representation uses backslashes.
