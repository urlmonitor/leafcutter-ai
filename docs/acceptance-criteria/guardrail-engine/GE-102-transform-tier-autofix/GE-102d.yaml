  - "Line format must match the AUTOFIX_AGENT lines already emitted by check_complexity and check_doc_length so a single parser handles all of them"
  - "Emission occurs only on the violation path, not on a clean pass"
  - "Edit the deployed check_exception_handling.py and its packaged template source under templates/commit-guardian/ together; the build.py round-trip must leave both in parity"
