assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "Evidence must come from executing the deployed artifact in the deployed layout in a fresh process. A file diff, a checksum comparison or a build-manifest assertion is explicitly not evidence and does not satisfy this record."
  - "The installer must be run into a temporary target rather than against a developer's own project, so the check is repeatable and leaves nothing behind."
  - "Both runs must be started under the same directory conditions. The only variable is which copy is running -- ACD-2100a's behaviours are directory-sensitive and varying two things at once makes a failure unattributable."
  - "Both runs must complete their startup path with no network available, so a transport failure in one run cannot be read as a parity difference."
  - "This record must not restate what ACD-2100a, b or c require. Its subject is that the copy the user runs is the copy that does it; a child that reads as 'sibling behaviour X but in the deployed layout' duplicates coverage and splits one behaviour's evidence across two L1s."
  - "Must satisfy the repository error-handling policy in any harness code that ships under scripts/ or unit_tests/."
  - "Any dependency the deployed route needs at runtime must be in the build deploy manifest. A dependency that is not deployed raises at runtime while every source-tree test passes -- this repo has that failure twice over in CLAUDE.md."
test_spec:
  - name: test_installed_and_source_copies_both_reach_the_first_user_question
    target_dir: unit_tests/portability/
    framework: unittest
    type: e2e
    angle: deployed
    description: >-
      The installer is run into a temporary target project; a run started there against
      the installed copy and a run started in the source checkout against the source
      copy, under identical starting directory conditions, both reach the first
      question the route puts to the user.
  - name: test_neither_copy_halts_at_a_check_before_the_first_question
    target_dir: unit_tests/portability/
    framework: unittest
    type: e2e
    angle: failure
    description: >-
      Neither run's recorded outcome is a halt at a startup check, and the assertion is
      made against each run's own recorded outcome rather than against its exit code
      alone.
  - name: test_parity_finding_is_produced_by_running_both_copies_not_by_diffing_them
    target_dir: unit_tests/portability/
    framework: unittest
    type: e2e
    angle: reachability
    surface_invoked: "the installed route invoked in the temporary target project the way a consumer invokes it, in a fresh process"
    description: >-
      The deployed copy is invoked through the entry point a consumer actually uses, and
      the run advances past the startup checks -- so a deployed artifact that is
      byte-identical and still cannot run fails this test.
test_rationale: >-
  The deployed workflow is currently a different program from the source one -- it
  carries no charter gate at all -- and nobody noticed because nothing compares their
  behaviour. A test that diffs the two files would have caught that particular
  divergence and will not catch the next one: a deployed artifact can be byte-identical
  and still fail to run because a dependency was not copied, or because a path resolves
  differently in the deployed layout. This repo has that failure twice over in CLAUDE.md,
  and docs/testing/test-angles.md records BP-811 as the cleanest statement of it -- an AC
  that asserted the copy tier and never the reachability tier. So the evidence has to be
  the deployed artifact running in the deployed layout in a fresh process, invoked the
  way a consumer invokes it.
delivers_to:
  - agent: python-coder
    ac_id: ACD-2100d-3
    contract: "A repeatable harness that installs into a temporary target project and starts a run there against the installed copy, observing how far the run gets -- the measurement ACD-2100d-3 takes before and after an install."
  - agent: documentation-expert
    ac_id: ACD-2100d-4
    contract: "The confirmed behaviour of the installed copy on the startup path, which the reference page states as fact rather than as an expectation."
