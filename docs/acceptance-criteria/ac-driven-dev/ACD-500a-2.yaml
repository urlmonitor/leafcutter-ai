criteria: |
  Given AC "ACS-100a-1" appears in the ready AC list from the AC store scanner,
  And a ticket file "TICKET-20260605-ACS-100a-1.md" exists in the ticket backlog
    with frontmatter field source_ac: ACS-100a-1,
  When the prioritizer runs with --include-acs enabled and --json output,
  Then the ready array does NOT contain an entry for ACS-100a-1 with source: ac,
  And the ready array DOES contain the ticket entry for
    TICKET-20260605-ACS-100a-1.md with source: ticket,
  And the total entry count reflects the deduplication (one fewer than the
    sum of raw ticket + AC counts).
