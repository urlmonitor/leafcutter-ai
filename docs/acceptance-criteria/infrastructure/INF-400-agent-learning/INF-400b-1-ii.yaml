id: INF-400b-1-ii
title: "Duplicate learnings are not persisted twice across consecutive runs"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
criteria: |
  Given the business-analyst-v3 agent discovered during run N that
    "the infrastructure component has no parent in index.yaml"
    and persisted it to memory/project_infrastructure_conventions.md,
  When the same agent runs again (run N+1) in the same component
    and its knowledge-capture step fires with the same or near-identical
    learning text ("infrastructure has no parent component"),
  Then route-learning Step 0 (duplicate detection) identifies a match
    with Levenshtein ratio >= 0.85 against the existing memory file entry,
  And route-learning returns {duplicate: true} without invoking capture-learning,
  And no duplicate entry is appended to the memory file,
  And no knowledge_captured telemetry event is emitted for the duplicate.
