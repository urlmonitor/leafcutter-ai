notes: |
  THE LOOPHOLE-CLOSING CRITERION. Every other record in BO-3500c constrains the kinds
  that have a defined proof. Without this one, the way to make any awkward requirement
  pass is to declare its artifact to be a kind nobody has defined a proof for — and
  then "no proof defined" quietly becomes "no proof needed", which is the phantom-done
  the whole L0 was written to avoid, reached by declaration rather than by argument.

  THE FOURTH SCENARIO CLOSES THE LOOPHOLE IN THE LOOPHOLE-CLOSER (added 2026-08-31, user
  decision D4). The first three scenarios are all about what happens once a member's kind
  is known — and they are worth nothing if the member gets to say what its kind is. That
  is the cheapest route to an exemption in this whole tree, cheaper than any of the ones
  already forbidden: not an argument, not an implementation shortcut, just a value typed
  into a record. Deriving the kind from where the deliverable sits and which register
  claims it is what makes this criterion's refusal reachable only by the truth about the
  artifact. It is the same decision recorded on BO-3500c-2's fourth scenario and on
  BO-3500c-1's last one; all three are the same rule seen from three angles, and an
  implementation that derives in one place and reads a field in another has not
  satisfied any of them.

  THE SECOND SCENARIO IS THE EXTENSIBILITY HINGE and mirrors BO-3500a-3's. The pair
  make the same promise about two different axes: adding a craft makes the requirements
  declaring it buildable, and defining a proof makes the requirements of that kind
  provable, in both cases with nothing edited but the automation. An implementation
  that keeps a list of refused kinds satisfies the first scenario and fails this one,
  and it is the likely implementation.

  THE THIRD SCENARIO exists because "no proof is defined" and "the proof is defined but
  cannot be run here" will be conflated, and they behave differently. A screen proof
  needs a running surface; a run without one has a defined proof it cannot establish.
  The correct answer is the same — refuse before work — and the reason must differ,
  because one is fixed by defining something and the other by provisioning something.
  Getting this wrong reproduces KI-BO-013 exactly: work is done, and the refusal
  arrives at the end.

  RELATIONSHIP TO BO-2400f-12, which is done. That criterion's refusal already covers a
  member whose declared proof is not a passing test. What is added here is the case it
  cannot see: a member whose proof obligation is well formed and simply has no
  instrument behind it. Its constraint that the verdict be computed against the run's
  own capabilities is preserved and extended to proofs.
