id: INF-600l
title: "An agent's card can never quietly disagree with how the system actually wires that agent"
component: infrastructure
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  The generated agent card always agrees with the agent registry -- mismatches are caught automatically.

  The whole point of an agent card is that you can trust it to describe an agent
  without reading its source. That trust breaks the moment the card says one thing
  and the underlying registry says another -- for example the card shows one agent
  can start another, but the registry has no such connection (or the reverse). This
  makes the card's self-description silently wrong. The system automatically checks
  the generated card against the registry and catches any disagreement, so the card
  a reader relies on can never drift out of step with how the agent is really wired.
  Any project that installs leafcutter and runs build.py gets this consistency
  guarantee the same way. This differs from INF-600k (which teaches the registry
  validator to accept legitimate external callers) -- INF-600l guarantees the card
  and the registry tell the same story.
depends_on: [INF-600]
