criteria: |
  Set-up finishes your protection, or tells you exactly what it could not do.

  When a fresh working copy is prepared for you, the checks are fully in place
  — and if any part of that cannot be established, set-up names the missing
  part instead of carrying on quietly and handing you an unprotected copy.
