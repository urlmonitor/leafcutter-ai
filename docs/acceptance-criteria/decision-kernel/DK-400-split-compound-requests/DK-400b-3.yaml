id: DK-400b-3
title: "Every split comes to the same gate and says whether it came from your request or was found along the way"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given three proposed splits: the reusable-criteria goal (found at routing, trigger jev_none),
    the reuse-threshold research request (found at routing, trigger ambiguous) and the
    split-bounds decision question (found mid-run at work-item depth 1),
  When each is shown at the split gate,
  Then each offers the same four answers: approve as shown, reword a part, leave parts out, and
    reject,
  And each names what was split: a goal, a research request or a decision question,
  And the first two say the split came from the person's own request, and the third says it was
    found along the way at work-item depth 1,
  And the split's progress view shows the same origin for each.
depends_on:
  - DK-400b
  - DK-400b-1
  - DK-400b-2
