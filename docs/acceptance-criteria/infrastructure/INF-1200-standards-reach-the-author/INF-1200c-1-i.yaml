id: INF-1200c-1-i
title: "A kind of file the ownership record assigns to nobody gets no invented owner and stops nothing"
component: infrastructure
components:
  - infrastructure
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a kind of file that carries a standard and which the project's ownership
    record assigns to no specialist at all,
  When the audience for that kind of file's standards is determined,
  Then no specialist is told that kind of file's standards — no owner is
    inferred from a specialist's name, from a neighbouring kind of file, from a
    configured default, from the specialist that owns the most kinds of file, or
    from any source other than the ownership record,
  And every other kind of file's standards reach their owners in the same run, so
    an unassigned kind of file does not halt the delivery or reduce what anyone
    else is told,
  And the condition — a standard whose kind of file has no assigned owner — is
    distinguishable in what the run reports from a kind of file that has an owner
    and whose owner was told.
depends_on:
