id: BO-500
title: "The right quality gates happen automatically based on what you are changing"
component: build-orchestration
level: L0
status: active
req_status: draft
work_status: todo
criteria: |
  Declare what kind of change you are making, and the system assembles the full
  team of agents -- reviewers, testers, documenters -- without anyone curating
  a list by hand.

  When a unit of work enters the build system, the only human decisions are:
  what agent does the work, and what type of change is this. From those two
  inputs, the system derives every quality gate that applies -- TDD for code,
  architecture review for flow changes, documentation-first for new capabilities,
  validation for config. The result is a build workflow where nothing slips
  through because someone forgot to add an agent to a list.
