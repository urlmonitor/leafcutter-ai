title: "A dangling registry skill pointer fails the build against the canonical source"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the registry references a skill_id in a skills_invoked entry, and no skill with
    that id exists in the canonical source (templates/skills plus the registry),
  When the build's skill-pointer check runs,
  Then the build fails with a non-zero exit,
  And the failure names the dangling skill_id and the registry entry that referenced it,
  And the verdict is the same whether the build runs locally or in CI.
