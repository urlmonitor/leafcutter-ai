id: ACS-500g-3
components:
  - ac_store
readiness: approved
priority: critical
title: "Producer and consumer decide 'is this a pattern?' from one shared source that cannot drift"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the authoring-patterns skill states the recurrence threshold as 3 distinct
    occurrences,
  And the business-analyst's pattern-first check and the pattern-steward's
    store-wide scan both decide pattern-worthiness,
  When the threshold in the skill is changed from 3 to 2 and nothing else changes,
  Then the business-analyst's next pattern-first check treats a behavior with 2
    occurrences as pattern-worthy, with no edit made to the business-analyst
    instructions,
  And the pattern-steward's next scan qualifies candidates at 2 occurrences, with no
    edit made to the pattern-steward instructions,
  And neither the business-analyst nor the pattern-steward carries its own copy of
    the recurrence threshold, the slot-expressible-variance test, the
    genuine-vs-incidental test, or the slot naming rules — each defers to the skill
    for all four.

  Given a behavior that the skill's rules classify as incidental similarity,
  When the business-analyst evaluates it during authoring and the pattern-steward
    evaluates it during a store-wide scan,
  Then both reach the same do-not-promote decision and both cite the same failing
    rule.
