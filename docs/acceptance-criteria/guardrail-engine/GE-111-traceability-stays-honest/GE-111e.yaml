notes: |
  PO authoring note (for the BA). This mirrors ACS-400e-1 ("Blocked commit
  produces a clear, actionable error message") for this hook. Load-bearing
  message contents to preserve at L2: (a) the AC id, (b) the implemented_by
  entry that broke, (c) the kind of change (moved / renamed / deleted; and at
  symbol level, the symbol name and — when known via GE-111b/jcodemunch — its
  new location), and (d) a pointer to the GE-111d reconciliation options. Keep
  this as a distinct L1 so message quality is independently testable rather than
  buried inside the GE-111a enforcement behavior.

  BA decomposition resolution (2026-06-22): single L2 GE-111e-1 asserts the
  message contains all four load-bearing fields plus the change kind and (at
  symbol tier) the symbol name and located new location. No documentation AC
  (rationale set; the user-facing how-to lives on GE-111a / GE-111d).
