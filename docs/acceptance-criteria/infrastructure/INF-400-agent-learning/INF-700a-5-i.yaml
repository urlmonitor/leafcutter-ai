amended_by:
  - reason: "BA correction, 2026-09-07, following the approved repository-anchored sink decision. ONE CLAUSE REWORDED, nothing added or removed. The announcement clause called the teardown 'the moment it becomes a loss', which contradicted this record's own preceding clause — the records stay eligible and a later completed unit of work writes them — and the contradiction got worse under the sink decision, because the record behind an unpublished write now demonstrably survives the teardown in a sink shared by the whole repository. A publication failure is a retry unless its cause persists, and describing it as a loss invites an implementation that stops looking. The clause now sites the announcement at the last moment anything can be done in THIS unit of work, which is the true reason it sits at teardown, and additionally requires it to say whether the record behind the write is still eligible — which is the distinction a reader actually needs and which the old wording asserted the wrong answer to. The fail-open half, the never-block-the-work clause, the exit-status equality and every test descriptor are unchanged."
