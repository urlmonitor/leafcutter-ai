estimated_complexity: S
it_requirements:
  - "Every allowlist read here is READ-ONLY. The verification must never create, modify or delete a .security-allowlist at any real project root, workspace root or worktree root — the live file is what the commit hook actually reads, so a stray write would disable the real gate as a side effect."
  - "An absent allowlist is a normal checkout state, not a failure: the verification skips with a reason rather than failing when the file is missing."
  - "The set of allowlist copies to check must be DISCOVERED by walking the working tree, never enumerated as a hard-coded list of paths, so a copy added later inherits the guard automatically."
  - "The expected entry count must be DERIVED from the file — the number of lines that are neither blank nor whole-line comments — and never written as a literal. A literal count goes stale the first time an entry is added and turns a live guard into a maintenance chore that gets deleted."
  - "The third clause is not satisfied by counting warnings. Assert the loaded entry set itself, and assert that the findings those entries cover are still suppressed, so an implementation that achieves silence by loading nothing fails."
  - "Ignoring the whole file, or falling back to loading nothing, is never an acceptable response to an entry the rule dislikes: the disposition is per-line skipping, and this criterion is the measurement that the file as a whole survives."
  - "Edit the canonical template at templates/skills/security-scanner/scripts/scan_secrets.py and propagate with build.py; never edit a deployed copy (ADR-001)."
test_spec:
  - name: test_repository_allowlist_loads_every_entry_with_no_warning
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Reading this repository's own allowlist verbatim from disk, the loader emits nothing on the error stream and the number of entries loaded equals the number of lines that are neither blank nor whole-line comments, counted from the file itself; skips with a reason when the file is absent."
  - name: test_every_allowlist_copy_in_the_working_tree_loads_without_warning
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Each allowlist copy discovered by walking the working tree — including the copies carried in the package templates and in each worktree — loads with an empty error stream, because the same file ships to every installation."
  - name: test_live_entries_still_suppress_what_they_suppress_today
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Scanning the files this repository's live entries name, every finding those entries suppress is still suppressed — the discriminator that stops the two silence assertions from being satisfied by a loader that loads nothing."
test_rationale: |
  This is the paired positive arm for the whole L1 and the arm that decides whether
  the change is safe to ship, because the check runs on every commit here and in
  every project the package is installed into. It has to be the real file: a
  hand-written fixture reproduces the author's own idea of what an entry looks
  like, which is exactly the bias that let a sibling defect in this component
  survive a full suite of synthetic fixtures while no-oping on every real artifact.
  The third descriptor exists because silence is trivially satisfiable by loading
  nothing, so the count of entries loaded and the suppressions they still perform
  are asserted alongside it — and both are derived from the file rather than
  written down, so the guard tracks the allowlist as it grows.
