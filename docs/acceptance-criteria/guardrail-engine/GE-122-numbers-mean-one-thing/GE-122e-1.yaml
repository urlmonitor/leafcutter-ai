it_requirements:
  - "CORRECTED 2026-08-17 — THE TAG COUNT IS FIFTEEN, IN TWO FILES, NOT NINE IN ONE. Measured: `unit_tests/commit_guardian/test_ge_119_contract_shrinking_rename_aware.py` carries 9 `# covers: GE-119` comments and `unit_tests/commit_guardian/test_contract_shrinking_ignores_mentions.py` carries 6 more, all fifteen written for the parentless record. The BA and IT PO both recorded nine-in-one-file; the second module was missed because its filename does not name the identifier. This correction is load-bearing: the done-proof oracle resolves these tags, so repairing only the nine that live in the obviously-named file would leave six silently re-pointed at the goal record — manufacturing exactly the false coverage claim this AC exists to prevent, inside the repair itself. Enumerate tags by grepping the whole test tree for the identifier, never by trusting a filename."
  - "The identifier chosen must satisfy ADR-029's operative rule as applied to this namespace: free means NEITHER a file NOR a citation, not merely 'no file exists'. Reusing a number that text still cites converts a dangling reference into a confidently wrong one, which is worse than the ambiguity being repaired."
  - "WHEN LISTING TAKEN IDENTIFIERS, scan the loose files as well as the folders. Verified 2026-08-17: `GE-114-1.yaml` through `GE-114-4.yaml`, `GE-115.yaml` and the `GE-119.yaml` being moved all sit at the namespace root alongside the feature folders, so a folder-only listing under-reports what is taken and is a plausible way to mint a second collision while repairing the first. GE-121 is free by both tests as of 2026-08-17."
  - "PARENT SELECTION — THE OBVIOUS CHOICE IS FORBIDDEN, AND THE AC FORBIDS IT ONLY IMPLICITLY. The most natural semantic parent for a record about the contract-shrinking guard is GE-119 itself (`Trust that a green check actually checked something`, 4 children against a cap of 7): a gate so false-positive-prone that it must be bypassed with SKIP is precisely a green check that stopped checking. It is nonetheless RULED OUT, because parenting under it requires adding the child to GE-119.yaml's covered_by, and GE-119.yaml is one of the 33 files this AC requires to be byte-identical afterwards. Verify the survivor set is untouched BEFORE assuming a parent is available. Verified 2026-08-17, guardrail-engine L0s and their child counts against the cap of 7: GE-104 (1), GE-111 (5), GE-113 (3), GE-116 (3), GE-117 (5), GE-118 (2), GE-119 (4, excluded), GE-122 (5, this tree — GE-120 at the time this was written; renumbered after an independent identifier collision with origin/main). Leading candidate is GE-111 `Refactoring can never silently break the link between your requirements and your code` — the contract-shrinking guard exists to stop a refactor from silently removing test coverage, and the record documents that guard misfiring — but the choice is the implementer's to justify against the criterion, not a directive."
  - "TAKE A SUFFIX-SHAPED IDENTIFIER, NOT A NEW ROOT — this supersedes the GE-121 guidance in the notes below. Discovered while writing the tests: `check_ac_parent_covered_by.py` and `scan_ac_orphans.py` both derive a record's parent STRUCTURALLY from its own id format, and neither reads the documented `parent:` escape-hatch field. A root-shaped id (`GE-121`) therefore has NO derivable parent, so the store's own back-link gate cannot police the parent link this AC requires — the record would satisfy the criterion only on paper, with no mechanical enforcement, which is the failure mode this whole tree exists to end. A suffix-shaped id under the chosen parent is policed natively. `GE-111f` is verified free by ADR-029's both-tests rule as of 2026-08-17 (zero files, zero citations repo-wide) and GE-111 has five children against a cap of seven, so it has room. Prefer it. If a different parent is justified, take that parent's next free suffix rather than a new root number."
  - "The AC-store gates will police the move and must be satisfied, not bypassed: `check-ac-schema`, `check-ac-parent-covered-by` (the new parent must list the moved record in `covered_by`), `check-ac-tree-limits` (the chosen parent must have room under the child cap), `check-ac-circular-deps` and `check-done-proof` all run on `docs/acceptance-criteria/**/*.yaml` at commit time and again in the `AC store valid` CI job. Choosing a parent that is already at its child cap turns a one-file move into a tree restructure."
  - "Rewrite citations with the three-way treatment `scripts/adr_refs.py` already implements rather than a blanket search-and-replace: qualified citations are rewritten mechanically, bare ambiguous ones are examined individually because a bare 'GE-119' today returns citations meaning BOTH records, and dated historical records are deliberately left alone because repointing them would make the record claim something that did not happen. A blanket replace across the repository would rewrite the release note that legitimately means the goal record."
  - "Changelog entries and release notes are dated historical records. The one meaning the moved record gets a clarifying note stating the new identifier rather than a rewritten citation; the one meaning the goal record is untouched."
  - "Idempotency: re-running any scripted portion of this repair over the already-repaired tree must make no further change and must not re-rewrite an already-rewritten citation. Verify by running twice and diffing."
  - "Do not delete either claimant. Both describe real, wanted work — the goal record is an active five-child tree, the parentless record documents a live defect covered by fifteen passing tests."
  - "This AC's ONLY prerequisite is GE-122e; it does not depend on the pass being built. Doing it first makes GE-122a-1's own store clean, and it supplies GE-122c-3 with a real repair to write its procedure from."
test_spec:
  - name: test_old_identifier_has_exactly_one_claimant_after_repair
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Over the merged, repaired tree, ZERO records claim GE-119 — the identifier is retired, having been vacated both by this repair's move (to GE-111f) and by the goal record's independent renumbering to GE-120 — and the whole-collection uniqueness pass reports no finding for GE-119, GE-120 or GE-111f."
  - name: test_moved_record_claims_a_free_identifier_with_a_real_parent
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The moved record claims an identifier no other artifact claims and that no citation refers to, declares a parent that exists, and appears in that parent's covered_by list."
  - name: test_goal_records_thirty_three_files_are_unchanged
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Every file in the goal record's folder is byte-identical to its pre-repair content — the cheap direction was actually taken."
  - name: test_every_coverage_tag_resolves_to_exactly_one_record
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The test tree is grepped for coverage tags naming either identifier; all fifteen (9 in test_ge_119_contract_shrinking_rename_aware.py, 6 in test_contract_shrinking_ignores_mentions.py) name the moved record's new identifier, and each resolves to exactly one record. The test discovers tags by scanning, so it fails if a tag exists in a module nobody thought to look in — an assertion hard-coded to one filename would have passed the defective nine-tag repair."
  - name: test_no_citation_of_either_identifier_resolves_to_zero_or_many
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A repository-wide citation resolution finds no LIVE citation of the retired GE-119, and no citation of GE-120 or GE-111f resolving to zero records or to more than one — the assertion the coverage note says a rename alone does not satisfy."
  - name: test_dated_historical_records_are_not_repointed
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The release note that legitimately means the goal record is unchanged, and the one meaning the moved record carries a clarifying statement rather than a rewritten citation — so a blanket search-and-replace fails this test."
test_rationale: |
  The coverage note is explicit that asserting the rename does not cover this AC, because the
  references are where a renumbering does its damage — so five of the six descriptors assert on
  citations rather than on files. The coverage-tag descriptor is the highest-value one: those tags
  are machine-resolved by the done-proof oracle, so leaving any behind does not merely mislead a
  reader, it silently re-points passing tests at a tree they do not exercise, manufacturing exactly
  the false coverage claim this repository's guardrails exist to prevent.
  The dated-historical-records descriptor is written to FAIL on a blanket search-and-replace,
  which is the fast implementation and the one that would rewrite the release note that
  legitimately means the goal record.

  WHY THAT DESCRIPTOR NOW SCANS RATHER THAN NAMES A FILE (corrected 2026-08-17). Both the BA and
  the IT PO recorded the tag population as "nine, in one file", and both were wrong: there are
  fifteen, across two modules. The six that were missed sit in a file whose name does not contain
  the identifier, so every human and agent who looked for them by filename missed them — twice,
  independently, on the AC whose entire subject is citations that resolve to the wrong thing. The
  descriptor is therefore written to DISCOVER tags by scanning the test tree, not to assert against
  a named file: an assertion hard-coded to the obviously-named module would have gone green over a
  repair that left six tags pointing at the wrong record. Treat this as the worked example of why
  this AC's coverage note refuses file-shaped evidence.
