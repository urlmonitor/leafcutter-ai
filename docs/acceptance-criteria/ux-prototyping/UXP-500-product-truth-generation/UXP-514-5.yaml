test_required: true
test_rationale: |
  Every clause of UXP-514 is universally quantified ("errors if ANY X differs"), so all four are
  vacuously satisfied when their input set is empty - which is the state a freshly installed
  record is in. The only way to prove this is a fixture per check with that check's input set
  emptied while the others stay populated; a wholly empty store would leave all four unexercised
  at once and could not distinguish independent reporting from a single global flag.
test_spec:
  - name: test_each_drift_check_reports_not_exercised_on_its_own_empty_input
    target_dir: unit_tests/product_truth/
    description: "Four fixtures, each emptying one check's input set, each producing a not-exercised report naming that input."
    type: integration
    angle: boundary
    framework: unittest
  - name: test_unexercised_drift_check_does_not_report_no_drift_found
    target_dir: unit_tests/product_truth/
    description: "The not-exercised report replaces, and does not accompany, a no-drift-found statement."
    type: integration
    angle: criterion
    framework: unittest
  - name: test_three_exercised_and_one_unexercised_is_distinguishable_from_four_exercised
    target_dir: unit_tests/product_truth/
    description: "Emptying one check's input changes only that check's reported state."
    type: integration
    angle: boundary
    framework: unittest
notes: |
  THE ANTI-VACUITY SIBLING. This is the instance, for these four specific checks, of the general
  rule in UXP-700b-3. It is recorded here as well as there because UXP-700b-3 states the rule
  the record's checks are held to, while this record is what an implementer working on UXP-514
  will actually read.

  DIRECTLY OBSERVED 2026-09-07: an empty store produced "OK: 0 flows, 0 mock-data, 0 mockups,
  eval + index + derived data valid (0 warnings)" and exit 0 - a clean pass produced by all four
  of these checks being vacuously true.
