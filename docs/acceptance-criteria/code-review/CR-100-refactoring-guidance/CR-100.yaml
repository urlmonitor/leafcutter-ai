criteria: |
  Prioritised, plain-English refactoring guidance you can act on with confidence.

  When you want to improve code, you get one ranked report that tells you what is
  wrong, why it matters, and the exact move that fixes it — in plain English.
  Every finding is named and justified, so you can prioritise the highest-value
  refactors first instead of guessing or wading through low-signal warnings. You
  spend your time fixing real problems, not triaging a wall of noise.
