  - name: test_genuine_contention_still_reports_contention_and_names_the_members
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: criterion
    description: "The non-regression arm: a claim that is attempted and finds members
      already held still reports contention, and the held members appear. Fails any
      fix that turns every claim failure into 'not attempted'."
  - name: test_a_contention_report_naming_no_held_member_is_impossible
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: boundary
    description: "The exact 2026-09-23 shape — contention language with an empty held
      set — cannot be produced by any input. This is the assertion that distinguishes
      a real fix from one that only relabels the message."
  - name: test_the_claim_is_attempted_by_a_performer_permitted_to_change_the_store
    target_dir: unit_tests/workflows/
    framework: pytest
    type: integration
    angle: seam
    description: "The claim step's performer is not the one whose declared charter
      forbids changing the store. Asserted on the dispatch actually made, not on a
      constant read from the source."
test_rationale: |
  The third and fourth descriptors are the pair that makes this falsifiable. A fix that
  relabels every claim failure as "not attempted" passes the first two and fails the
  third; a fix that changes nothing passes the third and fails the first two. Only a fix
  that tells the two conditions apart passes all four.

  The fourth exists separately from the second because they fail differently: the second
  checks the wording of one halt, the fourth checks that a whole class of payload is
  unreachable. The observed defect was not bad wording — it was a payload asserting
  contention while carrying an empty held-set, which no amount of rephrasing prevents.

  The fifth asserts on the dispatch the run actually makes rather than on a constant in
  the source, because a constant naming the right performer proves nothing about which
  performer the claim step passes to. This file's own history is the argument: the
  release path's executor was corrected to a different performer and the claim path was
  left unchanged in the same file, and nothing detected the divergence.

  These run through unit_tests/_workflow_engine_harness.py with stubbed responses, the
  vehicle unit_tests/workflows/test_bo2400f_13_workspace_refusal_workflow.py and
  test_bo2400f_3_i_worktree_verify_workflow.py already use. A test that greps the
  workflow for the performer's name satisfies nothing here — the defect is a dispatch
  that was present, correct-looking and wrong.
