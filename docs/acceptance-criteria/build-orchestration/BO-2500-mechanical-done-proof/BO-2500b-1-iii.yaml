title: "Any done AC with a non-empty covered_by is proven by its children, whatever its level"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a done acceptance criterion at level L2 (or any level) whose covered_by is
    non-empty, and whose every child listed in covered_by is itself done and carries a
    "# covers: <child-id>" or "// covers: <child-id>" tag somewhere under the test root,
  When the pre-commit proof-of-done check scans that staged record,
  Then the check treats the AC as a composite proven by its children and reports no
    violation for it, without demanding a covers tag naming the AC's own id,
  And a done AC with a non-empty covered_by whose children are NOT all done-and-covered
    is still reported as a violation naming the unproven children,
  And a done AC with an empty covered_by (a true leaf) still requires its own covers tag,
    reported with the unchanged message,
  And the bug symptom ("A done L2 AC with a non-empty covered_by (e.g. UXP-700d-3, whose
    children UXP-700d-3-i and -ii are both done and covered) is refused by
    check-done-proof as lacking its own '# covers: <id>' tag, so an L2 composite can
    never be committed as done; check-ticket-ac-status-parity then also blocks its ticket
    from closing.") must not occur,
  And a covered_by entry that is a test-file path (identified by a path separator, a
    file extension, or by not resolving to an AC record in the store) is never treated
    as an AC-id child: it does not make an otherwise-leaf AC a composite, and it is
    never reported as an unproven child — an AC whose covered_by holds only such
    test-path entries is a leaf and still requires its own covers tag
