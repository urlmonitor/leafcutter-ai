estimated_complexity: S
it_requirements:
  - "EXIT CODES: 0 = pass, or nothing inspected (stated); 1 = new errors or new type-ignores; 2 = could not check (git failed, mypy exited with a status other than 0 or 1, a file could not be read or tokenized, bad arguments)."
  - "SUMMARY ON PASS: 'mypy ratchet: <n> file(s), <k> new error(s) (<m> existing error(s) untouched, <r> removed), <t> new type-ignore(s)'; on failure the same counts follow 'mypy ratchet FAILED:'."
  - "NOTHING INSPECTED: 'mypy ratchet: NOTHING INSPECTED -- 0 changed Python files in scope ...; no type check ran. This is not a pass on content.' -- printed instead of the summary, exit 0 (a pull request that touches no Python must not go red), and mypy is not invoked."
  - "COULD NOT CHECK: 'mypy ratchet: COULD NOT CHECK -- <reason>', mypy's stdout and stderr relayed, exit 2. The pass summary never appears on this path."
  - "STATUS 1 IS NOT ENOUGH: `python -m mypy` with mypy absent exits 1, the same status as 'errors found'. Before the first run the check probes `<python> -m mypy --version` and prints the answer ('Type checker: mypy <version>'); a probe that fails or does not answer 'mypy ...' is could-not-check. A mypy run with status 1 and no error line in its output is could-not-check too. (Found on this record's own pull request: the first CI run passed in under two seconds and its log gave no evidence that mypy had run, which is how the hole was noticed.)"
  - "ERROR-HANDLING POLICY (CLAUDE.md Rules 1-4): every git and mypy subprocess call and every file read is wrapped in a specific except (OSError, subprocess.SubprocessError, tokenize.TokenError, SyntaxError, UnicodeDecodeError), logged at WARNING and converted to the could-not-check outcome; pure parsing and comparison functions carry no try/except."
test_spec:
  - name: test_bp_1300f_1_vi_pass_summary_names_files_new_existing_and_ignores
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: criterion
    description: "One changed file with 2 inherited errors and no additions: exit 0 and the exact summary line."
  - name: test_bp_1300f_1_vi_nothing_in_scope_says_nothing_was_inspected
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: failure
    must_catch:
      - "prints the '0 new errors' pass summary when no file was inspected"
    description: "Head changes docs/notes.md and tools/x.py (outside the pathspecs); exit 0; output says NOTHING INSPECTED and that no type check ran; no '0 new errors' text."
  - name: test_bp_1300f_1_vi_mypy_that_cannot_finish_is_could_not_check
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: failure
    must_catch:
      - "treats mypy exit status 2 as 'errors found' and compares a partial error list"
      - "treats mypy exit status 2 as success"
    description: "Head introduces a syntax error so mypy exits 2; the module exits 2, says COULD NOT CHECK, relays mypy's syntax message, and prints no pass summary."
  - name: test_bp_1300f_1_vi_missing_or_silent_mypy_is_could_not_check
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: failure
    must_catch:
      - "reads mypy exit status 1 with no error line as 'errors found, none in the inspected files' and passes"
    description: "A stub mypy package on PYTHONPATH (the real environment manipulated, the module untouched): one answers --version but exits 1 with no output, one answers every call with 'No module named mypy' and exit 1; both give exit 2, COULD NOT CHECK naming the cause, and no summary."
  - name: test_bp_1300f_1_vi_unresolvable_base_is_could_not_check
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: failure
    description: "--base names a missing ref; exit 2; output says COULD NOT CHECK and names the ref."
test_rationale: >-
  Each arm is about what the real CLI prints and returns, so each runs the real
  module against a real temporary git repository; the could-not-check arm uses a real
  mypy exit status 2 (a syntax error), not a stub.
