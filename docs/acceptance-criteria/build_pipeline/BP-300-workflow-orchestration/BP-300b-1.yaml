criteria: |
  Given a ticket whose YAML frontmatter agents map contains
    "python-coder: needed",
  And the ticket body "## Sign-offs" section contains the checked line
    "- [x] python-coder --- 2026-06-01 14:30",
  When build-ticket.js Step 1 runs the planner agent,
  Then the planner returns ordered_phases with python-coder having
    status "signed_off",
  And drift_warnings contains at least one entry naming the
    frontmatter/Sign-offs discrepancy for python-coder.
