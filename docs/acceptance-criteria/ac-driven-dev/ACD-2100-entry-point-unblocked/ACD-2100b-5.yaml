it_requirements:
  - "The change must land under templates/. The deployed workflow is build output and does not carry this step at all today."
  - "The verdict must be a function of the registry contents alone. It must be identical whether dispatch is available or not -- 'skip the check when dispatch is unavailable' is a fail-open regression wearing this record's clothes and is explicitly forbidden."
  - "The startup path must reach this check and pass it with no network available."
  - "Removing the round-trip must not remove the halt: the four outcomes ACD-2100b-1 through -3 specify still stop the run, and ACD-2100b-4 still holds over them."
  - "If a helper that dispatches for this purpose remains in the source for another caller, this behaviour is not satisfied by its absence from the file -- what must be observable is that no dispatch is made on the check's behalf during a run."
  - "Must satisfy the repository error-handling policy: the local read replaces a network call, so its failure paths are the ones ACD-2100b-1 and ACD-2100b-2 own and must not be swallowed."
  - "Must not add a per-run cost beyond a single local file read -- this record removes latency from startup and must not reintroduce it elsewhere."
test_spec:
  - name: test_startup_check_passes_with_every_dispatch_attempt_failing
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Dispatch made impossible -- every attempt fails immediately with a transport
      error -- and a registry that permits the worktree-creation agent; the check
      completes with the permitted verdict and the run proceeds to the next step.
  - name: test_no_dispatch_is_made_on_the_checks_behalf_during_a_run
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the plan-feature workflow driven through the workflow runner, with the run's own dispatch record read back afterwards"
    description: >-
      The run's record of what it dispatched contains no entry attributable to the
      startup check -- observed from the record the run produced, not from the absence
      of a call in the source.
  - name: test_verdict_is_identical_with_and_without_dispatch_available
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      The same registry produces the same verdict in two runs, one with dispatch made
      impossible and one with dispatch available -- so the verdict comes from the file
      rather than from the transport.
  - name: test_removing_the_round_trip_does_not_remove_the_halt
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      With dispatch impossible and a registry that withholds permission, the run still
      stops at the check -- the local read is not a bypass.
test_rationale: >-
  Making dispatch impossible and requiring the run to get past the check anyway is the
  only Given that cannot be satisfied by a source scan. A test that greps for the
  absence of a dispatch call passes on a call that is present but unreachable, and fails
  on a correct implementation that keeps the helper for another purpose -- so the
  evidence has to be the run's own dispatch record. The third assertion is what stops
  the fix being "skip the check when dispatch is unavailable": the verdict must be the
  same either way because it comes from the file, not from the transport. The fourth
  keeps the halt, because a local read that always returns permitted would pass the
  first three.
