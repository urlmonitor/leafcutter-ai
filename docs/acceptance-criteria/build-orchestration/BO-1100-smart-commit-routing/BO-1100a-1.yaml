id: BO-1100a-1
title: "Staged files are classified into exactly one routing group per file"
component: build-orchestration
level: L2
status: active
readiness: draft
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the routing config contains these entries (in order):
    - group: "tickets", path_pattern: "tickets/**/*.md"
    - group: "new-acs", path_pattern: "docs/acceptance-criteria/**/*.yaml"
    - group: "implementation", path_pattern: "scripts/**" AND "templates/**"
  And the following files are staged:
    - tickets/00_inbox/TICKET-001.md
    - tickets/02_in_progress/TICKET-002.md
  When the commit agent classifies the staged files,
  Then both files are assigned to the "tickets" group,
  And no file is assigned to more than one group,
  And the classification uses first-match-wins order from the config array.
