test_spec:
  - name: test_bo3800a2_drive_commit_refusal_engages_specialist_between_refusal_and_retry
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "unit_tests/prompt_assembly/_driver_harness.py executing build-feature.js (TWIN_DRIVERS)"
    description: "Arm 1. The commit phase's stub returns the payload the REAL helper produced from real check-complexity output (plan_batches, 31, 30). The dispatch record reads commit, then restructuring-specialist, then commit. The author's change is byte-identical across the hold. RED TODAY."
  - name: test_bo3800a2_interactive_commit_agent_handoff_is_consumed_by_depth0_dispatcher
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: discrimination
    surface_invoked: "the new interactive commit workflow script, executed through unit_tests/_workflow_engine_harness.py"
    description: "Arm 2. Outside any drive, the stubbed commit agent returns the same payload. The dispatcher engages restructuring-specialist after the refusal and before the second commit attempt, in the same position as arm 1. RED TODAY: no such dispatcher exists."
    must_catch:
      - "ONE ROUTE WIRED: bring the specialist in only from the drive's commit step"
  - name: test_bo3800a2_direct_commits_engage_nobody_and_show_declared_next_step
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: boundary
    surface_invoked: "real `git commit` in a scratch repo through the generated stanza (shared_reference_layout, @pytest.mark.shared_layout_reader)"
    description: "Arm 3. The commit is made once with no env marker and once with CLAUDECODE=1. No handoff artifact is written, the index and working tree are unchanged, and the refusal text carries 'complexity 31, only 30 allowed', restructuring-specialist and complexity-reduction. RED TODAY on the text."
test_rationale: >-
  A real nested agent spawn cannot be unit-tested. What a test can see is the payload the
  helper returns and a depth-0 dispatcher consuming it, both executed for real: the driver
  harness in a drive, the workflow-engine harness outside one. Arm 3 is a real commit with no
  dispatcher in the loop. Three tests, all red today.
