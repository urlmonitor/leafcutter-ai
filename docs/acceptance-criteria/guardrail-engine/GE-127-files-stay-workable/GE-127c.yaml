id: GE-127c
title: "Every language the project is written in is held to the same standard"
component: guardrail-engine
components:
  - commit_guardian
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  The size standard follows the project, not a list someone wrote once.

  Wherever first-party work is authored, it is held to a workable size — so
  adopting a new language, or moving work into one the project already uses,
  does not silently create a place where files can grow without limit. Which
  kinds of file are in scope is a stated, reviewable decision rather than an
  accident of what happened to be listed first.
