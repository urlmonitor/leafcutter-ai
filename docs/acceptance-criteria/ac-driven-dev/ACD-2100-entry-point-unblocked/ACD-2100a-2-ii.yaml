notes: |
  Authored by /quick-fix. Root cause: _git_toplevel() anchors on
  Path(__file__).resolve().parent. In the ADR-001 self-hosting dev layout
  <repo>/.leafcutter is a symlink to the untracked workspace parent's .leafcutter/, so
  resolve() lands outside any git repository and git exits 128. ACD-2100a-2 already
  added _resolve_repository_with_search_fallback() to this same file for exactly this
  deployed-outside-the-repo case (anchor first, then a bounded search of the immediate
  subdirectories of cwd, announcing a search-based hit on stderr at WARNING and raising
  on zero-or-multiple candidates), but it was wired into cmd_create_only() ONLY.
  cmd_create_ac_worktree() and cmd_create_fastlane_worktree() still call bare
  _git_toplevel(). The fix is to replace the bare _git_toplevel() call in those two
  handlers with _resolve_repository_with_search_fallback(), matching cmd_create_only()'s
  existing usage -- no new helper is needed, and callers whose anchor already resolves
  are unaffected because the anchor remains the first choice. Coverage must be
  behavioural: exercise each subcommand's resolution path with the script's own
  directory outside any git repository and assert it resolves via the bounded search
  and announces on stderr. A test that merely greps the file for the helper name would
  pass on dead code and must not be accepted.

  WHY THIS IS AN L3 ON ACD-2100a-2 RATHER THAN A SIXTH L2. ACD-2100a is at the L2 hard
  cap of 5 (ACD-2100a-1 .. ACD-2100a-5) and its own sizing note records that the cap is
  full on purpose. This record is not a new behaviour: it is a technical constraint on
  the behaviour ACD-2100a-2 already specifies -- that the ordered resolution contract
  holds at every worktree-creating entry point of the script, not only at the one site
  the original ticket happened to change. No child_limit_override was added; that is an
  audited waiver and is not a bug-fix decision.

  CALL SITES AS OF 2026-09-30 in templates/scripts/setup_ticket_worktree.py:
    - 1866  cmd_create_only()             -> _resolve_repository_with_search_fallback()
    - 1943  cmd_create_ac_worktree()      -> _git_toplevel()                   [defect]
    - 2043  cmd_create_fastlane_worktree()-> _git_toplevel()                   [defect]
    - 1809  cmd_setup_ticket()            -> _git_toplevel(ticket_path.parent) [anchored
            on the ticket path, a caller-supplied location; out of scope here]

  THE BLAST RADIUS IS BOTH ENTRY POINTS. The same hole disables /plan-feature Stage 0
  and the fast lane's worktree creation, which is why the symptom reads as two separate
  outages and is one substitution.
