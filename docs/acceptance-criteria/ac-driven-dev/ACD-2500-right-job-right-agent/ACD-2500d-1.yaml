it_requirements:
- Procedure lives in the code-aware agent template (ACD-2500d-5); serialise with ACD-2500c-1 (same file).
- 'Writes the file-findings record (File-findings record on the AC (schema-declared, closed): list of
  {file: str, verdict: ''consistent''|''describes, does not implement''|''absent, not to-be-created''|''behaviour
  found elsewhere'', line_range: str|null, found_in: str|null, reason: str (one sentence), decision: null|{choice:
  ''reassign''|''split''|''assignment stands'', reason: str, by: ''it-po''}} plus the list of files opened.
  Written by the code-aware agent (decision null); decision filled only by the technical planner''s next
  pass.), separate from the test design.'
- Existence and to-be-created facts come from the pre-pass report (ACD-2500d-5-i); the agent judges only
  whether the file holds the behaviour.
- Every file opened is listed; no verdict on a file that was not opened.
- 'Tools per ADR-033 §2.6: no Grep/Glob/MCP search. Behaviour outside the declared files is located from
  candidate paths in the pre-pass report or research delegated by the depth-0 workflow.'
- Never edits declared files, assigned_agent, splits, contracts, criteria or it_requirements (except reference_file_path,
  ACD-2500d-2).
