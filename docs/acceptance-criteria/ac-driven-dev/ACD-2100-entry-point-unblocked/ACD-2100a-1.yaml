assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The change must land under templates/. A repair applied to the deployed copy under .leafcutter/ is regenerated away by the next build and does not count as delivered (see ACD-2100d)."
  - "The resolved script location must be absolute at the point it is handed to the process launcher -- the run must not rely on the caller's working directory to complete the path."
  - "The run's own diagnostic record must carry the resolved absolute location it invoked so a wrong-copy execution is diagnosable after the fact without re-running."
  - "The resolution must be shared with the other four cwd-relative sites (ACD-2100a-3 and ACD-2100a-4) rather than patched here alone; a per-site fix is what left three sites standing after the known issues were filed."
  - "Must satisfy the repository error-handling policy: the resolution is external I/O, so a failure to resolve must raise a typed error or log at WARNING and re-raise -- never be swallowed into a silent fallback."
  - "Must not change the setup step's existing command-line contract; callers that already pass an explicit location must behave exactly as they do today."
  - "The startup path up to and including this step must complete with no network available."
test_spec:
  - name: test_worktree_step_runs_the_in_repo_copy_from_an_untracked_cwd
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Two distinguishable copies of the setup step on disk (one inside the target
      repository, one in an untracked parent); the workflow is driven from the
      untracked parent and the marker emitted by the in-repository copy -- not the
      parent copy -- appears in the captured output.
  - name: test_worktree_step_invocation_is_reached_from_the_workflow_entry_point
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the plan-feature workflow's worktree-creation step, driven through the workflow runner rather than by importing a helper"
    description: >-
      Driving the real workflow entry point produces the worktree on disk under the
      target repository with the expected branch checked out, and the recorded
      command string is an absolute path rooted inside that repository.
  - name: test_wrong_copy_execution_is_observable_and_blocks
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      With only the untracked-parent copy present and no copy inside the target
      repository, the step fails and names the location it could not resolve -- it
      does not silently fall back to the parent copy.
test_rationale: >-
  A single copy of the setup step on disk makes the criterion unfalsifiable: whichever
  path is resolved, the same file runs and the test passes against unfixed code. Two
  observably different copies is the only fixture shape in which the Then clause can
  fail. Asserting the recorded command string separately is what catches an
  implementation that resolves correctly by accident of the caller's cwd -- the string
  must be absolute, not merely correct on this machine.
delivers_to:
  - agent: python-coder
    ac_id: ACD-2100a-5
    contract: "An absolute repository-anchored location for a named support file under the route's installed support directory, derived from the repository being operated on and not from the caller's working directory. The same resolution ACD-2100a-3 and ACD-2100a-4 consume for the registry and the pause store."
