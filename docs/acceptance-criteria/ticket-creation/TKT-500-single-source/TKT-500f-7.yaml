title: "Docs-and-config-only tickets omit the Test Requirements section"
component: ticket-creation
level: L2
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/ticket-creation/TKT-500-single-source/TKT-500f.yaml"
criteria: |
  Given a leaf AC whose files_touched list contains only paths that are under a
    docs/ directory, or are .yaml configuration files, or are .json configuration
    files, or are under a tickets/ directory
    (for example "docs/reference/ac-schema.md" and "config/agent_registry.json"),
  And the files_touched list contains no path that qualifies as an implementation
    .py file,
  When a ticket is generated from that AC by an AC-to-ticket generator,
  Then the generated ticket body contains no section headed "## Test Requirements",
  And ticket generation completes without recording a warning about a missing
    Test Requirements section.
depends_on: [TKT-500f, TKT-500f-6]
doc_links:
  - path: scripts/goal_to_epic.py
    relationship: constrains
