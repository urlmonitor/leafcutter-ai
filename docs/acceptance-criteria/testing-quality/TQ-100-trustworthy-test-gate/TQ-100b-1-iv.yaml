id: TQ-100b-1-iv
components:
  - testing_quality
title: "A masked failure is reported in pytest's own expected-failure form, so every reader classifies it as an expected failure"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a test that covers an acceptance criterion whose work_status is not done,
    and the test fails on an assertion while masking is on (AC_ENFORCE_STRICT unset),
  When the enforcement plugin downgrades that failure to informational,
  Then the test's report uses pytest's own expected-failure form: outcome "skipped" with
    the masking reason in its wasxfail attribute, never an outcome value pytest does not
    define,
  And the terminal shows it as an expected failure: status letter "x", verbose word
    "XFAIL", counted under "xfailed" in the session summary, with the session exit status
    unchanged,
  And the JUnit XML records it as a skipped test of type pytest.xfail carrying the masking
    reason, and counts it in the suite's tests and skipped totals,
  And it is classified the same way when the session is distributed over pytest-xdist
    workers, and it never counts toward --maxfail,
  And each reader of a test run gives the verdict it gave before: the shared pytest -v
    outcome reader reads XFAIL, the fast lane's red-baseline gate counts that as red, the
    post-merge fix proof labels it xfailed, and a run under AC_ENFORCE_STRICT=1 still
    reports the failure as FAILED,
  And the post-merge lane report records it as skipped, the status it already gives
    pytest's own expected failure, instead of passed.
