criteria: |
  One source of truth for every component in the system — no duplicates, instant retrieval.

  When you need to find out who owns a subsystem, what it connects to, or which agent
  works on it, that answer lives in a single registry. Nothing is defined twice, nothing
  is scattered across tribal knowledge or stale documents. This structure also lays the
  groundwork for a navigable knowledge graph — once every component knows its neighbors
  and interfaces, you can traverse the system's architecture as easily as following links.
