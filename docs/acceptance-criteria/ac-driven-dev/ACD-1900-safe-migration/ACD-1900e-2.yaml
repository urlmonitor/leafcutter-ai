it_requirements:
  - "Canonical source: scripts/ac_store/backfill_schema_version.py. With --dry-run, the backfill reports the changes it would make and writes NOTHING -- the store is byte-identical before and after (verify by diffing the whole store dir)."
  - "The dry-run preview must be computed from the same infer-then-validate path that the real run uses, so the preview accurately reflects what a real run would write."
  - "Test must EXECUTE the backfill with --dry-run against a real on-disk store fixture and assert non-empty preview + byte-identical store -- never grep-only."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file/YAML I/O in typed try/except and log-or-reraise; no bare except."
