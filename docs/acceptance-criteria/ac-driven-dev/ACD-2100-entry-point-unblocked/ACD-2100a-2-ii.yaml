  - name: test_subcommands_fail_when_resolution_is_left_anchored_only
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "the bare _git_toplevel() call is left in place in cmd_create_ac_worktree() and only cmd_create_fastlane_worktree() is changed"
      - "the bare _git_toplevel() call is left in place in cmd_create_fastlane_worktree() and only cmd_create_ac_worktree() is changed"
      - "the source merely mentions _resolve_repository_with_search_fallback() in a comment, docstring or an unreached branch while the executed call is still the bare anchor"
    description: >-
      The behavioural assertions go red under each named half-fix and under a
      name-present-but-unreached implementation, so a grep-shaped test cannot stand in
      for the proof.
  - name: test_explicit_repository_location_still_bypasses_the_search_in_both_subcommands
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      With an explicit repository location supplied, each subcommand uses it even when
      the search would find a different candidate, and emits no search announcement.
test_rationale: >-
  ACD-2100a-2 built the resolver and proved it through cmd_create_only(); that proof
  says nothing about the two subcommands that never call it, which is exactly how this
  regression reached origin/main with the AC green. The coverage therefore has to be
  per-subcommand and behavioural: the Given must be built for real -- a directory that
  is genuinely not a repository, with no repository among its ancestors and the script
  copied outside the repository it is pointed at -- because the existing tmp_path
  fixture IS a git repository, so the anchor always resolves and the fallback is never
  reached. Running each subcommand as a subprocess through its own argv is what makes
  the reachability claim real: an imported resolver can be correct while the
  command-line path still anchors on __file__. The discrimination entry is not
  optional here; the cheapest passing implementation is a one-site substitution, and a
  test that greps the file for the helper name would pass on dead code and on either
  half-fix (CLAUDE.md, "Gate / Workflow ACs -- Verify Behaviorally").
