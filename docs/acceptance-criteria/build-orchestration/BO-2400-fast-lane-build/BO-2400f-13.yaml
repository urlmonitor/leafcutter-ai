assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  config_schema_fragment:
    fastlane_workspace_outcome:
      type: object
      required: [outcome]
      description: "The single JSON line `setup_ticket_worktree.py create-fastlane-worktree <slug>` prints, discriminated by `outcome`. THE PAYLOAD SHAPE IS THE DEFECT: today an occupied location yields `{\"worktree_path\": \"\"}` — a present field with a blank value — which the lane reads as a shaped-but-empty success. The refusal must therefore NOT be expressible as an empty version of the success shape: on `outcome: refused` the `worktree_path` key is ABSENT, not blank and not null. The lane's Phase 1 guard branches on `outcome === \"opened\"` and on nothing else."
      properties:
        outcome:
          type: string
          enum: [opened, refused]
          description: "Discriminant, always present. Any other value — a missing key, a null, an unparseable reply, or a legacy `{\"worktree_path\": \"\"}` from a stale deployed copy — takes the refusing branch by a plain-falsy read (fail closed)."
        worktree_path:
          type: string
          minLength: 1
          description: "Present ONLY on `opened`, and non-empty. Absent on `refused`."
        branch:
          type: string
          description: "`fast-lane/<slug>`. Present on both outcomes — the operator needs it on a refusal to inspect the occupant."
        ac_store_path:
          type: string
          description: "Present only on `opened`. The lane already re-derives this rather than trusting it; it stays for the CLI's own callers."
        created:
          type: boolean
          description: "Present only on `opened`. True when this run made the workspace (BO-2400f-13-iv)."
        base_commit:
          type: string
          description: "Present only on `opened`. The 40-hex origin/main commit the workspace was cut from (BO-2400f-13-iv)."
        refusal:
          type: object
          description: "Present ONLY on `refused`."
          required: [reason, ac_id, occupant, options, message]
          properties:
            reason:
              type: string
              enum: [workspace_occupied, branch_checked_out_elsewhere, occupancy_undetermined]
              description: "The two occupancy conditions are distinct and fail differently: the PATH is occupied, or the BRANCH is checked out elsewhere. `occupancy_undetermined` is the fail-closed value."
            ac_id: {type: string}
            occupied_path:
              type: [string, "null"]
              description: "Absolute path. Null only when reason is occupancy_undetermined."
            occupant:
              type: string
              enum: [own_prior_attempt, foreign]
              description: "Deliberately two-valued: there is NO `unknown`. An occupant that cannot be classified with confidence is reported as `foreign` (BO-2400f-13-ii)."
            occupant_branch: {type: [string, "null"]}
            uncommitted_changes:
              type: [boolean, "null"]
              description: "Null means could not be determined — never rendered to the operator as 'clean'."
            published:
              type: object
              properties:
                pushed: {type: [boolean, "null"]}
                pr_url: {type: [string, "null"]}
                pr_lookup: {type: string, enum: [ok, unavailable, not_attempted]}
            options:
              type: array
              minItems: 1
              items:
                type: object
                required: [action, description, destructive]
                properties:
                  action: {type: string}
                  description: {type: string}
                  destructive:
                    type: boolean
                    description: "Per-option, machine-readable. Clearing empty residue and throwing away unsaved work must never be offered as the same gesture, so the flag lives on the option, not in the prose."
            message:
              type: string
              description: "One operator-facing sentence naming BOTH the acceptance criterion and the occupied location. It must contain none of git's own diagnostic text (`fatal:`, `is already used by worktree at`, `contains modified or untracked files, use --force`)."
  reference_file_path: "templates/scripts/setup_ticket_worktree.py"
  n_location_rule: "3 in templates/scripts/setup_ticket_worktree.py — the _worktree_exists definition (:232), the fast-lane call site (:1289), and the payload construction in cmd_create_fastlane_worktree (:1311) — PLUS the 3 other _worktree_exists call sites audited (:1078, :1124, :1220) and 2 in templates/workflows-js/fast-lane-ship.js (WORKTREE_SCHEMA, and the Phase 1 guard at :277). Partial application is the defect: fixing the lookup without the caller, or the caller without the payload, leaves the lane exactly where it is."
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/build_orchestration/ unit_tests/workflows/ -q"
  constraints:
    - "SOURCE/DEPLOY SPLIT. The fix lands in templates/scripts/setup_ticket_worktree.py and is mirrored to scripts/setup_ticket_worktree.py by running build.py. scripts/ is a BUILD OUTPUT — a change made only there is silently reverted on the next build, and KI-BO-015 records that BOTH copies carry the bug (_worktree_exists is called at :1289 in the template and :1398 in the deployed copy). Do NOT hand-edit the deployed copy, and do NOT assert byte-parity between the two: they legitimately differ today (probe_failure), and test_fastlane_template_deploy_parity.py enforces that difference."
    - "SIGNATURE-EXTENSION CALL-SITE AUDIT (CLAUDE.md, mandatory). _worktree_exists has FOUR call sites: :1078 (cmd_setup_ticket, bare slug, feature/), :1124 (cmd_create_only, bare slug, feature/), :1220 (cmd_create_ac_worktree, bare slug, ac-authoring/), :1289 (cmd_create_fastlane_worktree, the broken one). Whatever shape the fix takes — an optional `prefixes` argument, a `full_branch=` overload, or passing the full branch name — every one of the four must be examined and either updated or explicitly recorded in the docstring as an intentional backward-compatible path, IN THE SAME COMMIT. The three bare-slug callers must keep working. A fix that changes the signature and updates only the fast-lane caller is a defect, and a direct unit test of _worktree_exists will not notice."
    - "TWO DISTINCT OCCUPANCY CONDITIONS, both mandatory. (A) The PATH worktrees/<slug> is occupied. (B) The BRANCH fast-lane/<slug> is checked out in some worktree, wherever that is. They fail differently and a fix can easily handle one and not the other. Verified live on 2026-08-25 in a throwaway repo: `git worktree add <newpath> fast-lane/probe` while that branch was checked out elsewhere exits 128 with `fatal: 'fast-lane/probe' is already used by worktree at '<path>'`. Condition B must be checked even when the path is free."
    - "PATH OCCUPANCY IS 'EXISTS AND IS NOT AN EMPTY DIRECTORY'. Verified live on 2026-08-25: `git worktree add` into an EXISTING EMPTY directory succeeds. Treating any existing path as an occupant would false-refuse on stale empty residue and break BO-2400f-13-iv. Occupied = the path exists AND (it is not a directory, or it contains at least one entry). A dangling symlink or an unreadable path is occupied and unclassifiable, therefore foreign."
    - "ORDER OF OPERATIONS: check occupancy BEFORE creating anything. The natural shape of a fix is to work out the branch and then check the location; a fix that gets those the wrong way round leaves a branch behind on every refusal (BO-2400f-13-iii). No branch, no worktree, no directory may exist as a result of a refusing run."
    - "FAIL CLOSED, by a plain-falsy read, following BO-2400f-12's precedent. An unreadable or malformed occupancy verdict takes the REFUSING branch: a missing `outcome` key, a null, an unparseable reply, a `git worktree list --porcelain` call that fails or parses to nothing, all produce `reason: occupancy_undetermined` and say so. No default-true, no `|| true`, no `?? \"opened\"`."
    - "SINGLE CONSTRUCTION SITE. Build the refusal payload in ONE function (Python side) and read it through ONE guard (JS side), following the buildFastLaneDeliveryOutcome precedent at fast-lane-ship.js:210. Multiple return sites are how a refusal drifts into looking like a success. On the JS side the new guard must sit AHEAD of the existing `if (!worktreeResult || !worktreeResult.worktree_path)` check at :277, and WORKTREE_SCHEMA (:58) must stop requiring `worktree_path` — a refusal legitimately has none."
    - "TWO LANGUAGES, ONE RECORD — do not let the single-coder phase be silently under-scoped. The Python half (occupancy determination, classification, refusal payload) is in templates/scripts/setup_ticket_worktree.py; the JS half (Phase 1 guard, schema, terminal refusal outcome instead of the generic `status: error`) is in templates/workflows-js/fast-lane-ship.js. python-coder owns BOTH: config/agent_registry.json explicitly lists '.js' under python-coder's owns_file_extensions for exactly this orchestration layer, so this is not an intent-vs-surface contradiction (BP-1100f-3) — but the coder must budget for both files."
    - "NO GIT DIAGNOSTIC TEXT REACHES THE OPERATOR. The refusal is composed by this code, not relayed. `fatal: ...`, `is already used by worktree at ...`, and `contains modified or untracked files, use --force to delete it` are the three strings that leak today; none may appear in the operator-facing message, and the process must not surface a raw exit 128."
    - "The refusal precedes the claim step by two whole phases, so the run holds no claims and must NOT invoke the release step (BO-2400f-10). See BO-2400f-13-iii — this is the sibling trap an implementer copying the BO-2400f-12 pattern will get wrong."
    - "Covering tests must EXECUTE. A test that greps either file for a branch prefix, a message, or statement ordering is NOT acceptable evidence and must be rejected at review: it passes unchanged on dead code, and the reuse branch at :1294-1296 has never once executed. A unit test asserting _worktree_exists returns True for a fast-lane/ branch is explicitly SUPPLEMENTARY only — it would pass while the caller still fell through to the failing open."
delivers_to:
  agent: python-coder
  contract: "A discriminated workspace outcome on stdout from `create-fastlane-worktree <slug>`: `{outcome: \"opened\", worktree_path, branch, ac_store_path, created, base_commit}` or `{outcome: \"refused\", branch, refusal: {reason, ac_id, occupied_path, occupant, occupant_branch, uncommitted_changes, published, options[], message}}` — with `worktree_path` ABSENT on the refusing branch. Consumed by the fast-lane-ship.js Phase 1 guard, which reaches Phase 2 (Resolve) only on `outcome === \"opened\"` and otherwise returns the refusal as the run's terminal outcome."
expects_from:
  ac_id: BO-2400f-3
  contract: "The `create-fastlane-worktree <slug>` subcommand, the `fast-lane/<slug>` branch name from _fastlane_branch (:487), and the `<worktrees_base>/worktrees/<slug>` location convention — both derived from the acceptance criterion id alone, with no per-run discriminator."
test_required: true
test_spec:
  - name: test_occupied_workspace_refuses_before_any_dispatch
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "LOAD-BEARING. Executed under run_workflow_under_e2 with label_responses stubbing 'fastlane-worktree' to a refusal payload, the run's recorded agent_calls contain ONLY the worktree dispatch — no resolve-connected, no test-writer, no coder, no review, no commit, no pull-request — and the terminal payload is a refusal."
  - name: test_occupied_path_yields_a_refusal_payload_in_a_real_repository
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "create-fastlane-worktree run as a REAL SUBPROCESS against a REAL temporary git repo whose worktrees/<slug> is a real occupied location prints outcome 'refused', names the AC id and the absolute occupied path, and carries NO worktree_path key at all."
  - name: test_branch_checked_out_elsewhere_refuses_even_when_the_location_is_free
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: "The second occupancy condition: fast-lane/<slug> is checked out at some other path and worktrees/<slug> does not exist. The real subprocess refuses with reason 'branch_checked_out_elsewhere', naming the holding path — it does not attempt the add and hit exit 128."
  - name: test_existing_empty_directory_is_not_treated_as_an_occupant
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: "git worktree add succeeds into an existing EMPTY directory (verified live 2026-08-25), so an empty worktrees/<slug> must yield outcome 'opened', not a refusal — the over-eager-gate failure this pins down."
  - name: test_refusal_carries_no_git_diagnostic_text_and_no_exit_128
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "The refusing subprocess's stdout payload and stderr contain none of 'fatal:', 'is already used by worktree at', or 'use --force to delete it', and the process exit status is the command's own refusal status, never a relayed 128."
  - name: test_refusal_options_each_declare_whether_they_discard_work
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "Every entry in refusal.options carries an explicit boolean `destructive`; the inspect option is false and any clear option is true, so clearing residue and discarding unsaved work are never the same gesture."
  - name: test_two_runs_on_one_criterion_resolve_to_the_same_location
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "With the first run's workspace still held, a second real-subprocess invocation for the same AC id refuses naming the SAME path, and no second directory for that criterion (suffixed, timestamped or otherwise) exists anywhere under worktrees/ afterwards."
  - name: test_blank_or_missing_outcome_refuses_rather_than_proceeding
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "FAIL CLOSED. With the worktree label stubbed in turn to the legacy {\"worktree_path\": \"\"}, to {}, and to a payload whose outcome key is null, the lane refuses and states that occupancy could not be determined; in none of the three does it dispatch the resolver."
  - name: test_other_worktree_lookup_call_sites_still_resolve_a_bare_slug
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: seam
    description: "THE CALL-SITE AUDIT, executed. Against a real temporary repo with registered feature/<slug> and ac-authoring/<slug> worktrees, setup-ticket, create-only and create-ac-worktree each still find and reuse their existing worktree from a bare slug after the _worktree_exists signature change."
  - name: test_deployed_copy_refuses_an_occupied_workspace
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: deployed
    description: "The SOURCE/DEPLOY guard: the copy the lane actually invokes — scripts/setup_ticket_worktree.py, regenerated by build.py — is the one run as a real subprocess against the occupied fixture, proving the fix reached the deployed layout and was not left only in templates/."
  - name: test_lane_invokes_the_workspace_command_through_its_real_entry_point
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "scripts/setup_ticket_worktree.py create-fastlane-worktree <slug>"
    description: "The refusal is reachable from the argv the lane actually composes: the CLI subcommand is invoked exactly as fast-lane-ship.js spells it, and returns the discriminated payload rather than an argparse error."
  - name: test_worktree_lookup_matches_the_fast_lane_prefix
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: boundary
    description: "SUPPLEMENTARY ONLY, never primary evidence: _worktree_exists resolves a fast-lane/<slug> branch. On its own this passes while the caller still falls through to the failing open — it exists to localise a failure the executing tests above have already caught."
test_rationale: |
  Every criterion in this family is a workflow gate, and this one sits on code that
  is unreachable today. A test that greps the lane or the workspace command for a
  branch prefix, a message, or the order of two statements is NOT acceptable evidence
  and must be rejected at review: it passes unchanged on dead code, which is exactly
  the defect being fixed — the reuse branch has never once executed, and every
  structural test in the world would still be green.

  Note the specific trap. A test asserting that the occupancy lookup returns true for
  a fast-lane branch would pass while the caller still fell through to the failing
  open, because the lookup and the caller are different code. That test is worth
  nothing on its own.

  Covering tests must EXECUTE. Either run the lane under
  unit_tests/_workflow_engine_harness.py (run_workflow_under_e2 with label_responses)
  and assert on the recorded dispatches and the terminal payload, or run the workspace
  command as a REAL SUBPROCESS against a REAL temporary repository with a REAL
  occupied location, and assert on the actual payload and the actual state on disk.

  The load-bearing test is the end-to-end one: an occupied location produces a
  refusal payload and no dispatch. Everything else in this criterion is satisfiable
  by an implementation that computes a correct verdict and then proceeds anyway.
