notes: |
  Today (templates/agents/it-po.md frontmatter): `produces: analysis` and
  `mutates: [{name: none, surface: none}]`, while its tools include Write and Edit and its
  body writes AC YAML. The description still lists "the test contract (test_spec /
  test_required)" as its output.
  Tactical and independent: ACD-2500e notes say this can ship first, so this AC depends
  only on its parent, not on ACD-2500a/b/d. The description clause (clause 3) should land
  with ACD-2500e-2 if shipped early.
  Amended 2026-10-15 (G5 architect review, ticket 41 comment 2026-10-14 19:36, D4; user
  chose Option A): produces is `requirement_records`, added to the closed vocabulary by
  ticket 41; the registry has no mutates, so registry = template on produces and
  description, card = template on outputs and mutates. Ticket 41 grows from config-only
  to config plus a vocabulary token in Python: complexity M, and python-coder joins
  llm-expert (the record has a single assigned_agent field, so it stays llm-expert).
