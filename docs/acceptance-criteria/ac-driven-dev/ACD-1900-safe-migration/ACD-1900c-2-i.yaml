readiness: reviewed
priority: medium
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given ac_unit_of_work.enforce = true and a build that is red because a gate requires
    the new AC shape,
  When enforce is flipped to false in a single configuration commit with no code
    revert,
  Then the next run of that gate returns ok (dual-read/advisory),
  And the only change between the red run and the green run is the enforce flag value.
