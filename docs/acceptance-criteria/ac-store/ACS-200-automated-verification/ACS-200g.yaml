notes: |
  Gap this closes (verified 2026-08-14 in this worktree): nothing in continuous
  integration reads the requirements store. The pipeline's checks cover linting,
  the component vocabulary, the test suite, proof-of-done coverage, changelog
  presence, and an informational type-check; none of them looks at the store.
  The schema validator does run in the fixture-drift pipeline, but only over the
  web-app fixture set, never over the real store. The only enforcement is six
  local commit-time guardrails, and those are environment-dependent — a freshly
  created worktree can be missing them entirely and commit with the guardrails
  silently absent. The store is also exempt from the changelog gate, so a
  store-only pull request currently faces no store-aware scrutiny at all.
  Shape deliberately mirrors the existing, correctly specified pipeline gate
  BP-1200b-1 (a blocking check that runs on every pull request and fails when
  the thing it guards is wrong). Making the check a required status check in
  branch protection is OUT OF SCOPE here — that is a repository-administration
  act already covered in spirit by BP-1200c-1.
  PLACEMENT: the ACS-200 root record is absent from the store, and the folder's
  only L1 (ACS-200d, ticket source_acs) is a different subject, so this record
  takes a letter slot as an L2 — the same slot shape its siblings ACS-200e and
  ACS-200f occupy, per the reasoning recorded in ACS-200f-1.
