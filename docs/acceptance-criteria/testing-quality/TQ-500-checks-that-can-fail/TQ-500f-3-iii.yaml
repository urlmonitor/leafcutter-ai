delivers_to: null
expects_from:
  - ac_id: TQ-500f-3-i
    contract: "The red-baseline reader refuses, with the stable reason 'ambiguous_test_identity', a covering tag it cannot tie to exactly one test; this AC relies on that refusal remaining as the safety net."
  - ac_id: ACS-200f-2
    contract: "Tag-to-test matching considers every case of a parametrised test; any non-passing case makes the test non-passing."
it_requirements:
  - 'One matcher, two readers. The tag-to-test matching (today inside scripts/ac_store/done_proof.py)
    moves OUT into its own new module under scripts/ac_store/. done_proof.py and the red-baseline
    reader (scripts/build_orchestration/_fl_red_baseline_support.py and scripts/ac_store/done_proof_kind_support.py,
    the latter merged by TQ-500f-3-i in #923) both call that module. No copy of the matching
    logic stays in either reader, so a given run and tag set cannot be attributed differently
    by the two lanes.'
  - 'Full identity: a covering tag is matched on the tagged test''s path relative to the test
    root, its class chain (when it has one) and its function name. The identity is compared
    after normalising paths between the tag scanner''s view and pytest''s nodeid rootdir. Matching
    on file basename + function name, or on function name alone, must not decide a verdict when
    more than one test shares that name.'
  - 'Order-independent and collision-safe. The verdict for each tag is a pure function of the
    set of results. Reordering the run''s reported results changes nothing, and no
    first-wins or last-wins rule decides between two tests that share a name.'
  - 'ACS-200f-2 is preserved: every case of a parametrised covering test is considered, and
    any non-passing case (FAILED, ERROR, SKIPPED, XFAIL, XPASS, or not found) makes that test
    non-passing. Parametrised case ids are matched to their own test''s full identity, never
    to a same-named test in another class or file.'
  - 'Inherited tests (found in the final PR #923 review). A test method defined once in a mixin
    or base class and inherited, not overridden, by two collected test classes carries ONE covers
    tag but yields TWO pytest nodeids (for example TestA::test_shared and TestB::test_shared).
    The tag resolves to the full set of nodeids that inherit that exact definition, and each is
    judged. The tag counts as passing only if every inheriting nodeid (and every parametrised
    case of each) passed. In the red-baseline reader, a declared test (must_catch or angle: discrimination)
    whose inherited nodeids include any absence-only red is refused. The nodeids are never collapsed
    onto one subclass, never picked by order, and never refused as ambiguous merely because
    the one definition is collected more than once. A subclass that overrides the method is
    a different definition and is not part of this set.'
  - 'Fail closed, never guess. A tag that still cannot be tied to exactly one test is refused.
    The red-baseline reader reports the stable reason ambiguous_test_identity, and the done-proof
    check refuses the covered requirement and names the tag and every candidate nodeid. If the
    TQ-500f-3 build has not landed that refusal, this AC adds it. Removing the refusal because
    full identity makes collisions impossible violates this AC.'
  - 'File-size ratchet (user direction): the counted length of scripts/ac_store/done_proof.py,
    measured by scripts/commit_guardian/_file_size_ratchet.py measure_current_length (the
    same function the GE-127 ratchet gate uses), must end strictly BELOW its value at the
    merge base. At 10986ebf it is 1307 counted lines (2355 raw). The new module must be under
    its own size cap, and _fl_red_baseline_support.py (185 counted lines at 10986ebf) must
    not cross its cap.'
  - 'Deploy: register the new module in the build deploy map (build_ac_store deploy_map in
    scripts/build_phases_ac_store.py, next to done_proof.py and _done_proof_phase_helpers.py),
    with a comment naming the two importers. The deployed check_done_proof hook and the deployed
    fast_lane.py verify_red_baseline must both import it without ModuleNotFoundError (CLAUDE.md,
    New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest).'
  - 'Contracts kept: done_proof''s {nodeid: outcome} parsing contract, its CLI and hook output
    shapes, and verify_red_baseline''s existing report keys (gate_passed, reason, red, green_at_baseline,
    inconclusive, preexisting, plus TQ-500f-3-i''s refused list) keep their meaning. Both gates
    still make a single pytest run each. Both stay read-only (no writes to the AC store).'
  - 'Behaviour-preserving for unambiguous tags: moving the matcher must not change any verdict
    for a tag that resolved to one test before. The existing done_proof and red-baseline suites
    stay green without edits, except tests that asserted the collision behaviour this AC removes.'
test_spec:
  - name: test_full_identity_matching_separates_same_name_tests
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: criterion
    must_catch:
      - match by file basename + function name
      - match by bare function name, ignoring the class
      - last result wins on collision
      - first result wins on collision
    description: 'Feeding the shared matcher the T1..T4 results (T1/T2 same file, two classes,
      same function; T3/T4 same basename test_config.py under unit_tests/ac_store/ and unit_tests/build_orchestration/)
      gives TQ-9001 not eligible, TQ-9002 eligible, TQ-9003 eligible, TQ-9004 not eligible,
      and none ambiguous.'
  - name: test_done_proof_entry_point_judges_colliding_tags_by_full_identity
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: done_proof's production entry point, as invoked by the check_done_proof commit-guardian
      hook, run as a subprocess
    must_catch:
      - done_proof keeps its old in-file matcher and never calls the shared module
      - match by file basename + function name
    description: 'In a temp repo with real test files at the four Given paths (T1 and T4 failing,
      T2 and T3 passing) and a temp AC store holding TQ-9001..TQ-9004, the real pytest run through
      the done-proof entry point yields the four verdicts from the criteria. Also charges real_artifact:
      the nodeids come from real pytest output, never a hand-typed dict.'
  - name: test_red_baseline_reader_attributes_same_tests_as_done_proof
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: seam
    surface_invoked: python scripts/build_orchestration/fast_lane.py verify_red_baseline (subprocess)
      against the same fixture repo and run as the done-proof test
    must_catch:
      - red-baseline reader keeps its own copy of the matching
      - red-baseline reader still matches by file basename + function name
      - red-baseline reader reports a colliding pair as ambiguous_test_identity
    description: Over the same T1..T4 fixture, the red-baseline reader attributes each of the
      four outcomes to the same nodeid the done-proof check did (compare the attribution maps),
      and none of the four carries reason ambiguous_test_identity.
  - name: test_deployed_done_proof_and_fast_lane_import_shared_matcher
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: integration
    angle: deployed
    must_catch:
      - new matcher module missing from the build deploy map
    description: build.py into a temp target; in a fresh subprocess, the DEPLOYED done_proof
      entry point and the DEPLOYED fast_lane.py verify_red_baseline both run over the T1..T4
      fixture without ModuleNotFoundError and give the same verdicts as the source tree.
  - name: test_verdicts_unchanged_when_run_reports_tests_in_reverse_order
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: discrimination
    must_catch:
      - order-dependent verdict
      - last result wins on collision
      - first result wins on collision
    description: The T1..T4 results fed in forward order, in reversed order, and with only T1/T2
      swapped give identical verdicts and identical attributions for all four tags.
  - name: test_parametrised_same_name_tests_judged_per_identity_across_all_cases
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    angle: boundary
    must_catch:
      - only the first reported parametrised case is read (ACS-200f-2 regression)
      - cases of the same-named test in the other class are counted toward this tag
    description: 'Two parametrised tests with the same function name in two classes of one file:
      class A has one failing case among passing ones, class B''s cases all pass. Only A''s requirement
      is refused, naming the failing case; B''s requirement is eligible.'
  - name: test_inherited_test_judged_across_every_inheriting_class
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    must_catch:
      - inherited test judged by only one subclass
      - inherited nodeids collapsed onto one result (first or last wins)
      - inherited test refused as ambiguous_test_identity although it has one definition
      - absence-only red in one inheriting class ignored for a declared test
    description: 'In a temp repo, test_shared is defined once in a mixin with one covers tag and
      inherited (not overridden) by TestA and TestB, run through real pytest. (a) TestA passes
      and TestB fails: the done-proof check judges the covered requirement not eligible, naming
      TestB::test_shared. (b) Both pass: eligible. (c) The entry declares must_catch and TestB''s
      only red is an ImportError while TestA''s is an AssertionError: verify_red_baseline refuses
      it. In no case is the reason ambiguous_test_identity.'
  - name: test_tag_without_unique_identity_is_refused_never_guessed
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    must_catch:
      - guess instead of refusing an ambiguous tag
      - remove the ambiguous_test_identity refusal
      - refuse without naming every candidate test
    description: 'A tag whose tagged test matches two result nodeids at full identity (for example
      the same file collected under two roots) is refused by verify_red_baseline with reason
      ambiguous_test_identity, and the done-proof check refuses the covered requirement, naming
      the tag and both candidate nodeids (must_block: the gate does not pass).'
test_rationale: 'This is a bug fix in a gate shared by two readers, so a unit test of the matcher
  alone is not enough. The seam test runs both production CLIs over one real pytest run and
  proves they attribute each outcome to the same test. The deployed test covers a failure
  done_proof has already shipped once (missing from the deploy map). The collision fixtures
  (two classes in one file, two same-named files in different packages) reproduce the exact
  collapse. Each must_catch names a wrong version the test must go red under: basename matching,
  first-wins/last-wins, order dependence, and guessing instead of refusing. The ratchet requirement
  is enforced by the GE-127 commit gate itself, not by a test here.'
