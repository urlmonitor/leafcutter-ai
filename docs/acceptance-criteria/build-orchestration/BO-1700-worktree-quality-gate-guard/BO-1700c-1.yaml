  - path: docs/architecture/components/commit-guardian.md
    relationship: describes
    status: exists
  - path: docs/architecture/components/worktree-manager.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-001-self-hosting-boundary.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements: |
  New script scripts/commit_guardian/ensure_precommit_config.py with a
  templates/scripts/commit_guardian/ mirror; deployed and template copies edited
  together and verified via the build.py round-trip (ADR-001). The
  config-establishment logic (symlink .leafcutter from main via the shared
  git-common-dir resolver in BO-1700e-2, else copy) is folded INTO this hook — do
  NOT create a separate extract-helper AC. This is the SINGLE live
  config-establishment path (single producer); it supersedes the interim one-file
  feature/SKILL.md slice (see BO-1700e-2 / L0 notes) so no two competing
  establishment paths remain. The manifest order is asserted so the heal is the first
  hook after the stage canaries (BO-4300c-1-ii) and runs before any other hook
  (canonical manifest source is the templates/ copy).
test_spec:
  - name: test_manifest_index_0
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      Reads the commit-guardian manifest and asserts that every entry before
      ensure-precommit-config is one of the stage canaries BO-4300c-1-ii places first
      (precommit-canary-pre-commit, then precommit-canary-commit-msg) and that the first
      entry that is not a canary is ensure-precommit-config.
    must_catch:
      - "another hook is registered between the stage canaries and the self-healing hook"
      - "the self-healing hook is moved ahead of the stage canaries, or the canaries are removed"
  - name: test_config_present_subprocess_exits_0
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: >-
      The self-healing hook run through its own command-line entry point in a worktree whose
      .pre-commit-config.yaml resolves exits 0; the re-materialization paths are proved by
      the children BO-1700c-1-i .. BO-1700c-1-iv.
delivers_to:
  agent: python-coder
  contract: "A self-healing hook registered first after the stage canaries (BO-4300c-1-ii) that guarantees a resolvable .pre-commit-config.yaml before any other hook runs; consumed by the create-time gate (BO-1700d-1)."
expects_from:
  ac_id: BO-1700e-2
  contract: "The shared-git-dir -> main-checkout resolution used to locate the main tree's .leafcutter for re-materialization."
