notes: |
  THE CHEAP L1, AND THE ONE MOST LIKELY TO BE MISTAKEN FOR THE WHOLE JOB. Adding
  a place to put the second answer is a schema edit. Everything expensive in this
  tree is in b, c and d. Do not let the L2 budget concentrate here.

  WHAT SHAPE THE SEPARATION TAKES IS AN L2 DECISION, NOT AN L1 ONE. A second
  field, a structured entry, or a discriminated list are all live options and
  this record deliberately does not choose. The BA should choose against the
  readers rather than against elegance — and specifically against the two
  readers that consult the field's EMPTINESS rather than its contents
  (ac_coverage_resolver.py `_CHECKED_FIELDS`, and _ac_schema_validators.py's
  `bool(assigned_agent) and not covered_by` leafness proxy), because under any
  shape that leaves one of the two relations able to be empty, 'no parts' and
  'no proof' become distinguishable states for the first time and those readers
  must be told which they meant.

  ADDITIVE FIRST. The new slot must be OPTIONAL when it lands, or the whole
  store fails validation on the commit that introduces it. That is not a
  nicety — additionalProperties:false is enforced today by jsonschema in both
  the standalone validator and the commit hook, so the schema change and the
  first record carrying the field cannot be reordered.

  ONE MEASUREMENT THIS L1 MUST BE DESIGNED AGAINST (2026-09-08, whole store,
  3,925 records): 76 records already hold BOTH relations in one list. Any shape
  that assumes a record expresses one relation at a time is wrong on first
  contact with the store. See ACS-1500c.
