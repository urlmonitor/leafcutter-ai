id: INF-600
title: "Understand any agent without reading its source"
component: infrastructure
level: L0
status: active
child_limit_override: 12  # pre-existing overcrowding (10 children before INF-600k); waiver pending a proper INF-600 split (EPIC-FinalizeFeatureHardening retro KI-4)
criteria: |
  Every agent template carries standardized metadata that the build enforces.

  Agent templates follow a consistent self-description contract so that
  automated tooling can extract profiles without hand-written docs. Templates
  that fail to declare required metadata are rejected at build time, ensuring
  the system's agent catalog is always complete and accurate.
