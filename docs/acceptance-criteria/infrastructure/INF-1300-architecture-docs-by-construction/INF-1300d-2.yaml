it_requirements:
  - "Occupancy must be tested before anything is written. The destination must never be opened in a mode that truncates or creates it as part of deciding whether it is free."
  - "The collision test is the tier-and-number pair over the whole collection, matching the rule docs/architecture/diagrams/README.md states, not path existence. A free path at an occupied pair is still occupied."
  - "The free number reported must be computed over the whole collection including every sub-folder. scripts/next_diagram_seq.py already does this recursively after BP-1401; reuse that allocation rather than re-deriving it, and do not reintroduce a single-folder scan. Reporting a number that turns out to be taken is worse than reporting none, because the author will use it."
  - "Both refusals must leave the project byte-identical: no partially written file at the destination, no reciprocal entry in the intended parent, no index entry, no temporary file. A zero-length file at an occupied destination has already destroyed the document that was there."
  - "The occupied-destination refusal must name the destination; the pair-collision refusal must name the document already holding the pair and the free number. Both must be distinguishable from a vocabulary refusal and from a missing-field refusal without reading source."
  - "Filesystem errors while scanning the collection must follow the project error handling policy in CLAUDE.md, and a scan that cannot complete must refuse rather than report a free number it could not establish."
  - "The collection scan must report how many documents it inspected, per ADR-037's mandatory inspected count, so a scan that resolved zero files cannot be mistaken for a scan that found no collision."
test_spec:
  - name: test_occupied_destination_is_refused_and_its_contents_are_untouched
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: failure
    description: "Place a document at the destination and record its bytes. Request production there. Assert the destination's bytes are unchanged, that the refusal names the destination and says it is occupied, and that a whole-project snapshot difference is empty."
  - name: test_tier_and_number_collision_under_a_different_slug_is_refused
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: failure
    description: "Leave the requested path free but place a document at the same tier and number under a different slug, in a sub-folder of the collection. Request production; assert it is refused and the refusal names the colliding document. A producer that only checks path existence passes everything else and fails here."
  - name: test_reported_free_number_is_free_across_the_whole_collection
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Take the number the refusal reports as free and scan every document in the temporary collection, including every sub-folder, for that tier-and-number pair. Assert no document uses it. Seed the collection with documents at several depths so a single-folder scan produces a wrong answer."
  - name: test_neither_refusal_writes_anything_anywhere
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "For both occupancy conditions, hash every file in the temporary project before and after the run and assert the difference is empty - no new file, no changed parent, no index entry, no zero-length file at the destination."
  - name: test_free_number_claim_matches_the_projects_own_allocator
    target_dir: unit_tests/scaffold/
    framework: pytest
    type: integration
    angle: seam
    description: "Run the project's real scripts/next_diagram_seq.py against the same temporary collection and assert the number the refusal reported agrees with it, so the two answers to 'which number is free' cannot drift apart."
test_rationale: >-
  This is the only failure in the tree that destroys someone else's work, so the observation
  cannot stop at the refusal message: a refusal that says the destination is occupied while
  having already truncated the file there is a passing message over a destroyed document.
  Hence the whole-project snapshot on both arms. The second arm has to seed a collision at a
  different depth under a different slug, because the obvious implementation - check whether
  the destination file exists - passes every other clause in this record and fails only
  there. Comparing the reported free number against the project's real allocator rather than
  against a number the test computed itself is what stops the test and the producer sharing
  a single wrong idea of where the collection is.
