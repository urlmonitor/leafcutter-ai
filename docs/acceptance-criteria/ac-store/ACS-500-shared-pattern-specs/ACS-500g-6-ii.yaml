id: ACS-500g-6-ii
components:
  - ac_store
readiness: approved
priority: high
title: "The agent under test is never told which items are seeded, or how many"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given round 2 of an evaluation seeds 6 known defects into the task material,
  When the round's task is handed to the agent under test,
  Then the material it receives carries no marker on the seeded items, no count of
    how many were seeded, and no answer key,
  And the material is otherwise indistinguishable from work the agent would receive
    in normal operation.

  Given a round in which the recorded answers were visible to the agent under test
    (for example the seeded items were listed in the task it was given),
  When the round is scored,
  Then the round is reported as invalid rather than pass,
  And the overall verdict cannot be pass while any round is invalid,
  And the round is re-run with material the answers have been removed from.
depends_on: [ACS-500g-6]
