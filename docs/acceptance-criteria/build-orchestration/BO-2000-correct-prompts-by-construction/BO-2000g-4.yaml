it_requirements:
  - >-
    NO BUILD PER TEST. Mark the test `@pytest.mark.shared_layout_reader`. It takes what it needs
    from the one shared deployed layout (the `shared_reference_layout` fixture,
    scripts/suite_performance/pytest_shared_reference_layout.py): the deployed check-feedback-id
    hook and its deployed sibling modules, the deployed submission script (scripts/feedback/) and
    the categories config. It copies these into its own temporary scratch repository and never
    writes into the shared layout. It spawns no build.py (CLAUDE.md, "Tests must not spawn their
    own build.py").
  - >-
    The proof fails, never skips, when it cannot find the shared layout, the deployed hook or the
    deployed submission script. A broken symlink reads as an empty directory.
  - >-
    THE REAL HOOK, RUN BY GIT. Install the check in the scratch repository so that `git commit`
    itself runs it as a pre-commit hook, with the entry and arguments that the layout's hook
    manifest declares for check-feedback-id (read from the manifest, not retyped). None of these
    count as evidence: calling the check function directly, or hand-writing COMMIT_EDITMSG or
    GIT_COMMIT_MSG (FP-7).
  - >-
    NO BYPASS ANYWHERE. Every commit runs without --no-verify, and with SKIP,
    PRE_COMMIT_ALLOW_NO_CONFIG, GIT_COMMIT_MSG and any hooks-path override removed from its
    environment. No commit message in the scratch history contains [NO-FEEDBACK-CHECK],
    including the initial commit. The bypass reads the previous commit's message
    (KI-CG-20260901).
  - >-
    TICKET LOCATION. The scratch ticket sits at a path the check inspects, for example
    tickets/00_inbox/TICKET-demo.md as GE-123e-3 uses. Its frontmatter and Comments section go
    in the initial commit. Each example is then appended and staged, so each commit adds exactly
    one heading. The check judges added headings only (KI-CG-20261116).
  - >-
    REACH IS PROVEN FOR EACH EXAMPLE. For every example, the harness also commits the same filled
    entry with its feedback-id line removed, and that commit must be refused. An example whose
    heading the check does not recognise therefore fails the proof by name (file and heading
    line) rather than passing vacuously. Watch two examples in particular: live-surface-tester.md
    ~:323 (its heading carries `(status: ok)` once BO-2000g-1 lands; before that it carries
    `(status: skipped)`, which the check may not recognise) and write-c4-diagram ~:62
    `<agent-name>`. If the check does not recognise those headings, the proof reports them.
  - >-
    ONLY PLACEHOLDERS ARE FILLED; NOTHING IS TYPED. Three things are filled: (1) the heading's
    date and time, with the current local time in the check's format; (2) an agent-name slot
    (for example `<agent-name>` in the write-c4-diagram skill's question entry), with the name of
    an agent that uses that template or skill, taken from data the repository already holds (the
    template's own name, or for a skill an agent that loads it), never a name typed into the
    proof for one example; (3) a documented real-id placeholder, with
    the id that a real run of the deployed submit_feedback.py printed on stdout in the same test
    run. When that run fails, (3) is filled instead with the fallback built from that run's own
    output, exactly as the signoff skill documents it. The placeholder spellings come from the
    same reader the lint uses (BO-2000g-3). Concrete ids in examples and
    `feedback-id: (not-a-signoff)` are committed exactly as written. The proof records where each
    committed value came from (template text or run output) and asserts it.
  - >-
    SUBMISSION RUNS ARE CONFINED. Each run gets a declared sink and a TMPDIR inside the test's
    temporary directory (ADR-069, INF-500d-4). The repository's own feedback log and the shared
    layout are never written. A run uses --phase set to the example's agent and --category
    complete. A refused writer, for example research-agent, is a genuine failure and takes the
    fallback path.
  - >-
    THE SAME POPULATION AS THE LINT. The examples come from BO-2000g-3's enumeration function,
    called in the same run. The proof asserts that the number proven equals the number examined
    minus the number exempted, and that the number is not zero. It holds no list or count of its
    own.
  - >-
    THE FALLBACK FORM FOLLOWS INF-500d-3. Before INF-500d-3 lands, the fallback is the bare
    `(submit-failed)`. After it lands, the fallback is `(submit-failed:<reason>:<category>)`,
    taken from the run's 'submit-failed:' stderr line and checked against
    submit_failure_reasons.json. The proof needs no edit when that change lands.
  - >-
    ONE HARNESS FOR THE HOOK. If GE-123e's scratch-repository commit harness exists when this
    record is built, reuse it. Otherwise, write this harness as the reusable support module, so
    the two records do not grow two harnesses for one hook.
  - >-
    RUNTIME. Each example costs one submission run and two commits, with no rebuild or re-clone
    per example. The whole proof must finish within 60 s on a CI runner for the current
    population: about 25 examples on 2026-11-16, a figure that must not appear in the test.
test_intent:
  - clause: "every commit succeeds with the feedback-id check having run and passed, with no bypass token in the commit message and the check not skipped"
    needs_test: true
    reason: "A harness that never runs the hook, puts the ticket outside the inspected path or leaves SKIP set passes every example, so each success must be paired with proof that the check ran."
  - clause: "no feedback-id value in any committed entry was typed by hand: each one is the template's literal text or the submission step's printed output"
    needs_test: true
    reason: "Filling a placeholder with a made-up id such as fb_2026-01-01_00000000 makes every commit pass today and breaks once the hook checks values, and that is the wrong version this clause rules out."
  - clause: "the number of examples proven equals the number of examples the lint examined and did not exempt, so adding one more conforming example to a template adds one more proven case with no change to the proof"
    needs_test: true
    reason: "A proof with its own hard-coded list of blocks matches the count today and silently stops covering the next example added to a template."
delivers_to:
  agent: python-coder
  contract: >-
    Consumed by BO-2000g-4-i. The scratch-repository harness in
    unit_tests/prompt_assembly/_bo_2000g_4_support.py. create(tmp_path, layout) returns a
    repository with the real hook installed and the ticket committed. append_and_commit(entry_lines:
    list[str], message: str) returns {committed: bool, exit_code: int, hook_output: str,
    head_before: str, head_after: str}. A refused commit leaves the working tree and index as they
    were before the append.
expects_from:
  - ac_id: BO-2000g-3
    contract: >-
      The enumeration function returning the examined, non-exempt examples as records {file,
      heading_line, heading, body}, and the accepted-value reader for placeholder spellings. The
      proof iterates over the same set.
  - ac_id: INF-500d-3
    contract: >-
      The fallback form for a failed run. Before INF-500d-3 lands it is the bare
      "(submit-failed)". After, it is "(submit-failed:<reason>:<category>)", built from the run's
      single 'submit-failed:<reason>:<category>' stderr line, with <reason> one of the ids in
      scripts/feedback/submit_failure_reasons.json in the deployed layout.
