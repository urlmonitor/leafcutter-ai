test_rationale: >-
  The two measured disagreements are the criterion's teeth, so they are asserted on a
  pre-migration snapshot of the real data rather than fixtures: after the real tree is
  migrated and remediated, architect-review no longer holds architect-review-deep and
  a test against the live tree could not see the union. The macro descriptor carries
  must_catch because expansion is the natural, wrong migration. Byte-stability and
  insert-only exist because a whole-file rewrite of 60 templates is the backfill hazard.
