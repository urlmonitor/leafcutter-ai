title: "Resuming a run with no pending pause is a no-op"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run that has no pending question (it is running, already completed, or
    was cancelled),
  When an answer or a resume is submitted for that run,
  Then no paused step is resumed and no answer is applied,
  And the run's existing state is left unchanged,
  And the submission is reported as having nothing to resume rather than causing
    an error.
depends_on: [BO-2300e-1]
assigned_agent: llm-expert
