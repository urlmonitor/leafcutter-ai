test_spec:
  - name: test_docs_only_ticket_honours_its_out_of_scope_declaration
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "A docs-only files_touched plus an out_of_scope naming the changed source file yields a declared scope containing that file."
  - name: test_docs_only_ticket_still_flags_a_file_it_declared_nowhere
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: failure
    description: "A source file in neither list is still absent from the declared scope, so the guard is narrowed and not removed."
  - name: test_docs_only_ticket_with_no_out_of_scope_is_unchanged
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "BP-1100e-1-iii's own case: declaring nothing out of scope still yields an empty declared scope."
test_rationale: |
  The three cases are the whole of the change: the one that was broken, the one that must
  stay broken-on-purpose (an undeclared source file is still flagged), and the one that
  BP-1100e-1-iii already owned and that must not regress. They call the hook's own
  declared-scope function against real ticket text rather than asserting on the source,
  because the defect was precisely that the function's behaviour diverged from the
  criterion its own comment cited.

  The middle case is the one that makes this a narrowing rather than a removal. Without it,
  a fix that simply deleted the docs-only branch would pass the other two.
