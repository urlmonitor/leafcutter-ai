id: DK-500g-2
title: Asking which categories a decision used names each category and the criterion that links them
component: decision-kernel
components:
- decision_kernel
- knowledge_management
level: L2
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given a published generation built from a commit holding cat-1dc11c5a2ffa7310, cat-d15d52392d7aa94c and the decision dec-d53e1c52cd47c832,
  When a person asks which categories dec-d53e1c52cd47c832 used,
  Then the answer names cat-1dc11c5a2ffa7310 through crit.small_slice and cat-d15d52392d7aa94c through crit.human_authority, and no other category,
  And the answer comes from a registered query that takes the decision id as its parameter and is pinned to one named generation,
  And it matches the members recorded in the category records of that commit,
  And after a publish adds a member of dec-d53e1c52cd47c832 to a third category, the answer from the next generation names three categories.
depends_on:
- DK-500g
- DK-500g-1
covered_by:
- DK-500g-2-i
implemented_by: []
assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-500g-1
  contract: CriterionCategory nodes and membership links in a published generation (DK-500g-1 delivers_to).
change_target: code
risk_surface: contract_boundary
it_requirements:
- 'Registered as a built-in registered graph operation beside get_entities and get_ac_descendants (IT PO default name: get_decision_categories, argument decision_id), with the standard request shape (repository_id, revision, disclosure_level, budget). It is pinned to one generation, and the response reports generation_id and source_sha. It is not added through the optional authored query catalog (query-verify / query-register), so it works with knowledge.query_catalog_root unset.'
- 'Answer fields: [{category_id, pref_label, lifecycle_stage, criterion_id, question}] plus answer.completeness. The operation is parameterized and bounded, and executes no model-supplied Cypher.'
- Tests cross-check the answer against the category records of the same commit.
test_required: true
test_spec:
- name: test_answer_names_both_categories_through_criteria
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Asking about dec-d53e1c52cd47c832 names cat-1dc11c5a2ffa7310 through crit.small_slice and cat-d15d52392d7aa94c through crit.human_authority, and no other category.
- name: test_registered_operation_pinned_to_generation
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The answer comes from get_decision_categories with decision_id as its parameter and reports the generation it is pinned to.
- name: test_answer_matches_category_records
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The answer equals the members recorded in the category records of that commit.
- name: test_third_category_appears_in_next_generation
  target_dir: tests/knowledge/
  framework: pytest
  type: behavioral
  angle: boundary
  description: After a publish adds a member of dec-d53e1c52cd47c832 to a third category, the next generation's answer names three categories.
test_rationale: Build real generations through the knowledge sync and registered-operation entry points from a fixture commit (offline fixture backend), and assert node identities, links and answers against the category records of that commit; a live Neo4j test proves server compatibility. Unit tests of the reader alone would not prove that the Decision kind is unchanged in a full generation.
