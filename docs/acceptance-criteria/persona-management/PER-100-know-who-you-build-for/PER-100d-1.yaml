id: PER-100d-1
title: "Persona summary is injected into PO and BA agent context at spawn"
component: persona-management
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a project with two defined personas:
    - docs/personas/field-service-engineer/persona.yaml (with identity.name: "Field Service Engineer")
    - docs/personas/product-manager/persona.yaml (with identity.name: "Product Manager")
  When the product-owner-v3 or business-analyst-v3 agent is spawned
  Then the agent's context includes a persona summary block containing:
    - Each persona's name and one-line archetype
    - The total count of personas available ("2 personas defined")
  And the summary is derived from the identity section of each persona.yaml
  And the summary does not include the full persona detail (no goals, frustrations, or phase sections)
depends_on:
  - PER-100d
  - PER-100a-1
doc_links:
