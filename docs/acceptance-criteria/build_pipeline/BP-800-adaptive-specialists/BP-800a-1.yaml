  - "Must ignore directories listed in .gitignore (vendor/, node_modules/, .venv/, etc.)"
  - "Must handle errors gracefully per the project error handling policy when manifest files are unreadable"
  - "Must produce deterministic output — same project state yields identical detection results"
  - "Must not require any runtime dependencies beyond the Python standard library and packages already in the leafcutter dependency set"
