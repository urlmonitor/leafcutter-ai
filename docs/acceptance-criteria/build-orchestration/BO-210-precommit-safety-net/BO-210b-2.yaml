title: "Consumers tolerate an absent context_capsule exactly like an absent completion_manifest"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  Given a sign-off comment that contains no context_capsule block (for example a
    sign-off authored before this feature, or one where no warn-tier signal tripped),
  When a consumer that reads sign-offs (the supervisor or the auto-fix re-dispatch logic)
    processes that comment,
  Then it proceeds without error and without blocking,
  And it treats the missing capsule identically to a missing completion_manifest:
    it emits at most a warning and continues,
  And the documented sign-off skill states that the capsule block is optional and
    backward-compatible-absent.
