title: "Gate after BA v3 shows L2/L3 ACs and offers approve, edit, or cancel"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given BA v3 has written L2/L3 ACs to the AC store with readiness: draft,
  When the workflow presents gate 2 to the user,
  Then it displays: the AC ids, titles, criteria text, and the parent L1 each
    L2/L3 decomposes,
  And it offers three actions:
    - "approve" — proceed to IT PO v3 enrichment,
    - "edit" — provide feedback text; BA v3 is re-invoked with the feedback
      and rewrites the L2/L3 ACs (loop until approved),
    - "cancel" — abort the pipeline; all ACs remain with readiness: draft,
  And if the user approves, the workflow logs the approval timestamp
    and proceeds to IT PO v3.
