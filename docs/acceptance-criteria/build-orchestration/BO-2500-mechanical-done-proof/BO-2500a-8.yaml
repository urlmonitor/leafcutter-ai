id: BO-2500a-8
components:
  - build_orchestration
  - ac_store
title: "A test-free declaration is complete when written and honoured when marked done"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a requirement no test can prove, declared with test_required false,
  When the declaration is written, documented, planned and later marked done,
  Then the declaration carries a reason written for that record from the moment
    it is authored, and a declaration without one is refused by the commit-time
    record check when the record is added or changed (BO-2500a-8-i),
  And the technical planner's instructions produce the declaration and its reason
    together (BO-2500a-8-ii),
  And a reference page for test-free declarations explains the declaration and
    states the reason field's two meanings apart, linking to the single exemption
    rulebook, and the guides a person reads point to that page (BO-2500a-8-iii),
  And every unfinished record already declared test-free without a reason gets a
    reason written for it and approved by the user, or is listed for the user's
    decision (BO-2500a-8-iv),
  And a reason identical, after normalising, to another record's reason is
    refused, so one reason cannot be copied across records (BO-2500a-8-v),
  And for any record, the authoring side and the done gate (BO-2500a-1-ii) agree
    on whether its declaration is complete, so a record the authoring side accepts
    is never refused at done because its reason is missing.
depends_on: [BO-2500a, BO-2500a-1-ii]
