criteria: |
  Given an AC that is not a package-surface AC (for example assigned to
    documentation-expert, or in a component other than build_pipeline or
    build-orchestration),
    and its it_requirements does not carry the config-schema fragment, reference-file
    path, N-location rule, required-skills list, or post-write commands,
  When the AC is validated,
  Then validation passes,
  And the mandatory-spec-field rule is not applied to it.
