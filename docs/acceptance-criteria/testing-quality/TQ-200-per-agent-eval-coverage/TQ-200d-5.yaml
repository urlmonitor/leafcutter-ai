assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: >-
    One way of building the agent launch that all three invokers share, which
    TQ-200d-5-i (launch-failure cause in the results file), TQ-200d-5-ii
    (resolving the installed claude launcher on Windows) and TQ-200d-5-iii
    (stopping a run whose agent cannot start) build on.
expects_from: null
test_required: true
package_surface: false
it_requirements:
  - >-
    Scope: all three invokers named in the known issue change together:
    run_agent_eval.invoke_via_cli (label evals, currently --system-prompt on
    argv), run_agent_eval.invoke_agent_writer (artifact and produced-tests
    evals, currently --append-system-prompt on argv) and
    produced_tests_transcript.invoke_with_transcript (currently
    --append-system-prompt on argv). The KI suggests one shared builder so the
    three stay in step; the IT PO decides the module. run_agent_eval.py is over
    the 400-counted-line limit and must not grow.
  - >-
    Route of the instructions and the row input: the IT PO picks between the
    CLI's prompt-file flags (--system-prompt-file / --append-system-prompt-file,
    named by the CLI's --bare help but not listed on their own; the KI asks for
    one confirming call before relying on them) and stdin. Whichever is picked
    is confirmed against the installed CLI version and that version is written
    into the README section.
  - >-
    Unit tests never call a live model. They use a fake claude on PATH that
    records its argv, stdin and any prompt file it is given, and prove (a) the
    joined command line for the real test-writer template rendered over a long
    Windows-style sandbox path is under 32,767 characters, (b) the instructions
    the fake receives equal the rendered template byte for byte, (c) label
    evals still replace and the others still append, (d) no prompt file
    remains after the row.
  - >-
    DOCUMENTATION (hard requirement, part of done): scripts/evals/README.md
    gains a section on how a live run starts the agent (the route, why, what is
    cleaned up); docs/how-to/run-a-live-agent-eval.md is created (frontmatter
    with title/description/components per the doc conventions so build.py
    indexes it); the README links the how-to.
  - >-
    DOC-DRIFT TEST (the README and how-to make a checkable claim): a unit test
    reads the README section and asserts it names the same instruction route
    the shared builder uses (the flag name or 'stdin'), and that neither the
    README nor the how-to says the instructions go on the command line.
  - >-
    KNOWN ISSUE: move
    docs/known-issues/testing-quality/open-low-ki-tq-20261025-eval-harness-system-prompt-exceeds-windows-command-line.md
    to docs/known-issues/testing-quality/resolved/resolved-low-ki-tq-20261025-eval-harness-system-prompt-exceeds-windows-command-line.md
    (git mv), set its Status line to "RESOLVED <date> by TQ-200d-5" with the
    tests that prove it, and move its row in docs/known-issues/testing-quality.md
    from Open to Resolved with the counts recounted from the directory.
  - >-
    CHANGELOG: one entry for this AC through scripts/changelog/emit_entry.py
    (changelogs/), naming TQ-200d-5, the README section, the new how-to and the
    resolved KI.
  - >-
    GLOSSARY: any new eval term in the README or how-to goes through the
    check-glossary-coverage hook and glossary-triage; no hand-added entries.
  - >-
    Proof of the live claim: the before-score is a separate user-triggered
    step (TQ-200d-4 notes, OQ-11). After merge, the user runs
    run_agent_eval.py --agent test-writer live on Windows; the result is
    reported as a local result.
