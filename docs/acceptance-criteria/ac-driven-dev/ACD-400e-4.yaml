notes: |
  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Decomposes ACD-400e.

  A CORRECTION TO THE INHERITED FRAMING, FOUND BY EXECUTING BOTH SELECTORS. The PO's
  notes and the project context both say, correctly, that the fast lane and the backlog
  queue have deliberately opposite approval rules and must not be unified. What neither
  says is that the fast lane has TWO selectors with DIFFERENT postures. resolve_connected
  _build_set ignores approval, as BO-2400f-2 describes. select_batch does not — it
  requires an approval of approved, exactly as the backlog queue does, and its own
  docstring says so. An account written from the folklore would state a blanket contrast
  that is false of half the surface it describes, and would be the next ACD-400a-1. The
  final clause of the criteria exists solely to prevent that, and the fixture proves the
  distinction rather than asserting it.

  THIS AC PINS THE DIFFERENCE; IT DOES NOT NARROW IT. BO-2400f-12-ii holds as a hard
  constraint that approval, urgency, requirement status and status must not appear
  anywhere in the fast lane's producibility decision, and BO-2400f-2 is approved and done.
  Nothing here changes either selector's behaviour, and the criteria are satisfied by the
  code exactly as it ships today. A reading of this AC that harmonises the two selectors
  contradicts an approved criterion in another component and is wrong.

  WHY ONE STORE AND NOT TWO. Asking both selectors the same question about the same two
  records in a single run is what makes the difference an observation rather than two
  separate claims a reader has to hold side by side. It also makes the assertion robust to
  someone "fixing" the apparent inconsistency: unify the two and this AC goes red
  immediately, which is the outcome the fast-lane ACs want.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L2. Note
  for that pass: this AC deliberately spans two components' code without editing either.
  The deliverable is an account plus a demonstration, so `modifies` is tagged on neither
  selector.
