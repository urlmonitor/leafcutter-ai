notes: |
  2026-09-27: reset from done to in_progress (user-approved). On 2026-09-25 a
  one-command fast-lane run could not complete without hand-driving: resolve and
  producibility are dispatched to status-checker (permits_shell: false), the claim
  step was refused as off-role and reported as a concurrent claim, and the
  context-bundle step was refused as misrouted when launched from a sibling
  worktree. New children BO-2400f-5-i, -ii and -iii specify the fix. Return this
  criterion to done once they are built and covered.
