  - "2026-10-22 [it-po, user-approved (BrainCandy)]: aligned technical fields with the amended criteria. it_requirements[0] now names the AC source (branch.<branch>.leafcutterTicket, then that ticket's source_ac, single value or list) and the per-case behaviour. test_ge_117e_1_i_no_single_contextual_ac_inserts_nothing_and_asks now scripts the candidate-selection step for the two-id run (mirroring the component multi-match test) and adds runs for no recorded ticket, a missing ticket file and an unresolvable single id. readiness draft -> approved on the user's approval. criteria, title, depends_on and req_status untouched."
