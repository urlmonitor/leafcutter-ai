assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-400a-1
  contract: 'The detection gate of DK-400a-1: a bundle answer below split.bundle_threshold leaves the no_match path
    untouched.'
it_requirements:
  - 'A single question that routing gives no capability records today''s capability gap and blocked report unchanged.
    ''Today'' is pinned by the same run with split.enabled false: same gap fields, same report.md text, same envelope
    status and limitations.'
  - 'A deterministic no_match (no candidate matched kind or schema, so routing makes no Jev call) is never checked
    for bundling: no Jev question is added only to check.'
  - The split gate is never opened, and report.md has no split section and no rejected-split line.
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_single_unsupported_request_matches_split_disabled_outcome
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: The release-notes request with route __NONE__ and bundle 0.1 yields the same gap observation and
      report.md as the split.enabled false run, and no split record.
  - name: test_deterministic_no_match_adds_no_jev_call
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: A root whose requested output no capability produces makes no Jev call with split enabled, as today.
test_rationale: Equality with the off-switch run is the precise meaning of 'as it does today' and keeps the test
  independent of today's report wording.
