notes: |
  WHY THIS IS A SEPARATE BENEFIT FROM GE-120a. A correct rule that can be skipped
  is not a guarantee. GE-120a says what must be true; this L1 says how strongly
  it is held. The user asked explicitly for all three stages, and each earns its
  place for a different reason:
    - authoring time — earliest and cheapest, and the only stage that can hand
      the problem to someone who can fix it (see GE-120c);
    - commit time — stops the clash entering local history, but is skippable on
      purpose by anyone who chooses to bypass the commit checks;
    - the shared build — precisely because the commit-time stage IS skippable,
      this is the backstop that makes the guarantee real. It is the only
      unskippable one, and it is what stops a clash reaching everyone else.

  INHERITED STANDING RULE (do not restate it as a new rule, and do not contradict
  it). This project has a deliberate convention that a guard hitting an internal
  error should not hard-block an unrelated commit, and a sibling goal already
  establishes that a check which cannot run must SAY so rather than report
  success. Both apply here unchanged. The specific hazard for this AC is that a
  whole-collection check has more ways to be unable to run than a per-file one
  (it needs to see the whole collection, not one staged file), so "I could not
  read everything, therefore everything is fine" is the exact failure to design
  against. Decide per stage, explicitly at L2, whether a cannot-run condition
  blocks or only announces itself — there is no blanket answer.

  The component-diagram trigger covers the three-stage arrangement and which
  stage owns which promise; the reference-doc trigger covers the bypass rules, so
  that "which stage can I skip and what still catches me" is written down rather
  than folklore.
