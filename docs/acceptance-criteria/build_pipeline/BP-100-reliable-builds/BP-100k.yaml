criteria: |
  Drift detection, parity testing, and pre-commit hooks guard compiled outputs.

  If a compiled workflow file is manually edited, the drift detection hook
  catches it before commit. A parity test cross-validates all four
  infrastructure layers so that no category can fall out of sync silently.
