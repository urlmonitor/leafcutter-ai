change_target: pipeline
risk_surface: internal
test_required: true
test_spec:
  - name: test_writable_external_stream_lets_the_drive_dispatch
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "A temp install whose real knowledge_sink.json declares an absolute operational_log_root outside the worktree, with a writable stream; the real location query (sink_resolution.py --print-location telemetry) prints that path. build-epic.js runs under the E2 harness over an epic with one ready ticket; asserts the ticket receives its phase dispatches per the planner reply and the terminal payload carries no sink_unreachable field."
    must_catch:
      - "gate that blocks unconditionally"
  - name: test_success_path_shows_no_pre_drive_sink_error
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Same writable run: no operator message or log line at WARNING or above refers to the sink, the telemetry stream or a pre-drive probe failure."
  - name: test_success_path_appends_exactly_one_probe_line
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "The declared stream is pre-seeded with three known lines. After the gate passes, the stream holds exactly four lines and its first three are byte-identical to the seed, so the probe added only its single probe line and rewrote nothing."
    must_catch:
      - "probe rewrites the stream instead of appending"
      - "probe appends twice (first probe plus an unconditional re-probe)"
  - name: test_success_path_touches_no_worktree_relative_telemetry_file
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "After the writable run, <worktree>/debugging/logs/agent_telemetry.jsonl does not exist and a snapshot of the worktree (excluding files the harness itself writes) is unchanged by the gate, while the declared external stream gained one line."
    must_catch:
      - "probe the workspace-relative path debugging/logs/agent_telemetry.jsonl"
  - name: test_deployed_build_epic_js_proceeds_on_writable_stream
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: deployed
    description: "Using the shared_reference_layout fixture (marked shared_layout_reader), runs the DEPLOYED build-epic.js under the E2 harness against a writable external declared stream and asserts dispatch proceeds and exactly one probe line was appended."
test_rationale: >-
  The success path is only meaningful if the real workflow continues to dispatch
  after the gate, so every test runs build-epic.js's top-level body under the E2
  harness and observes dispatches, with the probe target taken from the real
  location query over a real declaration rooted outside the worktree. The
  worktree-relative telemetry check is the discriminating test: the defect this AC
  closes (KI-BO-20261009) was a probe that passed by writing a worktree file, a
  false green that a dispatch-only assertion would not catch. The pre-seeded
  stream proves "only its single probe line" by byte comparison, not by a
  line count alone.
