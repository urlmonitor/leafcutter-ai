criteria: |
  Given the AC-schema check, whose unresolvable prerequisite is a schema document rather than
    an importable helper module,
  And a fixture of staged AC YAML files of which a known number violate the authoritative
    schema,
  When the check is executed against those identical staged files from the main checkout and
    again from a separate working copy,
  Then both runs load the authoritative schema document,
  And both report the identical set of violating files,
  And neither run substitutes the reduced manual field validation,
  And the degradation to manual field validation observed today when running from a separate
    working copy no longer occurs,
  And the same holds for at least one further prerequisite kind beyond a schema document — a
    configuration document read at runtime — so the resolution facility is shown to handle
    data files generally and not one path special-cased.

  Coverage note: covered by executing the check from a real second working copy through the
  GE-119c-1 harness and comparing the two reported violation sets. A test that asserts the
  schema path resolves to a non-empty string does not cover it — the observed defect produced
  a path that was wrong, not a path that was empty.
