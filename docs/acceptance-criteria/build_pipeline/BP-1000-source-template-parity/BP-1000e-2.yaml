criteria: |
  Given a branch updated templates/workflows-js/finalize-feature.js
  And it did NOT apply the same change to the mirror scripts/workflows/finalize-feature.js
  When the workflow-script parity check runs at the merge gate
  Then the verdict reports that pair as not byte-identical and includes the diff
    between the source and the stale mirror
  And the merge gate fails, blocking the merge until the mirror is updated to match
