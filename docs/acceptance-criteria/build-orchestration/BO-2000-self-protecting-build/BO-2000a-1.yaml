it_requirements:
  - "Implement as prompt rules in templates/agents/ac-fulfillment-gate.md and templates/agents/ac-validator.md: the gate/validator accepts a self-hosting non-regression claim only when an evidence bundle is present containing (a) the exact command run and (b) its captured output, and the output reports zero new standards violations."
  - "Define the required evidence-bundle shape once and reference it consistently across both templates so the accept path here and the reject paths (BO-2000a-1-i, BO-2000a-2, BO-2000a-2-i) agree on the same required fields."
  - "The accepted result must retain an inspectable reference to the command and its captured output; evidence must not be discarded on acceptance."
  - "Edit the templates/ source and keep the deployed agent copies (.claude/agents/ac-fulfillment-gate.md, .claude/agents/ac-validator.md) in parity per ADR-001 (build.py round-trip); never edit the deployed copy alone."
