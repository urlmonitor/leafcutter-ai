notes: |
  WHY "RECOGNISED AS A COMMIT". The fast lane's token has been inert because `git -C <path>
  commit` was never recognised (GE-129b notes). A fast lane that "still commits" after this change
  could be doing so only because the guard still misses its form. The clause makes this record go
  red unless GE-129b-2 is in force too -- the Q6 "ship together" coupling, stated as a test.

  WHY END TO END. Both committers already dispatch the specialist. What could break is the token
  leaving their command text and the guard switching to identity; only a real run shows the
  commit still lands.

  The inventory claim ("these are all the committers") is checked mechanically in
  GE-129c-2-i, not trusted from the GE-129c notes.

  declares_side_effect: true -- derived from "commits the change".
