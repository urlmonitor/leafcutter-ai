notes: |
  THE PROMISE THE L1 MAKES AND THE CODE DOES NOT KEEP. ACD-2000b's criteria say a
  requirement is "never stuck" as somebody else's unfinished business; hazard 1
  records that this is NOT satisfied today and explains exactly why.

  VERIFIED (do not re-investigate): `release_claim()`
  (scripts/build_orchestration/fast_lane.py ~line 224) returns claimed-but-not-
  done ACs to `todo` "on a non-success run exit". It is a graceful-exit path. A
  hard kill (SIGKILL, crashed worktree, lost shell, host reboot) never calls it,
  and because the claim carries no owner and no timestamp
  (`work_status: in_progress` and nothing more), nothing afterwards can
  distinguish a live claim from an abandoned one. The requirement is then stuck
  as someone else's forever, and the only remedy is a human editing YAML.

  A RECLAIM RULE A SECOND PROCESS CAN APPLY IS THE ONLY THING THAT MAKES THE
  PROMISE TRUE. ACD-2000b's hazard 1 states it plainly: "graceful release alone
  does not". That is why the criteria are written from the LATER effort's point
  of view -- the recovering actor must be able to act unilaterally, using only
  what is written on the requirement. Any design that needs the vanished effort
  to come back, or needs an external supervisor to be alive, fails.

  THE THIRD THEN CLAUSE IS THE COUNTERWEIGHT AND IS EASY TO LOSE. A reclaim rule
  that is too eager is worse than none: it hands a live build's requirement to a
  second builder, producing exactly the double-work the L1's first promise
  forbids, and it does so silently. The staleness judgement therefore has to be
  conservative, and the AC requires the live case to be tested alongside the
  abandoned one.

  THE FOURTH THEN CLAUSE COVERS THE ZOMBIE. A killed shell's process can outlive
  its supervisor, or a hung machine can resume. On return it believes it still
  holds the requirement. Recording the takeover gives the returning effort
  something to notice; combined with ACD-2000b-1's owner field it means "am I
  still the owner?" is an answerable question. Without it, reclaim converts a
  stuck requirement into a concurrent double-build -- trading a visible failure
  for an invisible one.

  DEPENDS ON OWNER+TIMESTAMP: staleness cannot be judged without the two facts
  ACD-2000b-1 introduces, which is why that edge is a real prerequisite and not
  just sequencing. What counts as stale (a fixed age, a heartbeat, a liveness
  probe on the owning process) is the IT PO's decision; the criteria constrain
  the outcome, not the technique.

  TESTABILITY. Take a requirement in a real second process, SIGKILL that process
  so no cleanup handler can run, and assert a fresh process can determine the
  abandonment and take over. Then repeat with the owner alive and assert it does
  NOT take over. Both halves are required; either alone passes on a broken rule.

  CHILD NOTE: ACD-2000b-3-i, the state-diagram deliverable for ACD-2000b's
  `documentation_triggers`, is parented here because the reclaim transition is
  the one edge in the claim lifecycle that no action by the state's owner causes
  -- and because ACD-2000b's L2 cap of 5 is already full. See ACD-2000b-5's notes.

  2026-08-17 (IT PO enrichment). THE TECHNIQUE IS LEFT OPEN, AS THE BA INTENDED,
  BUT TWO OPTIONS ARE FENCED OFF because they look correct and are not:

  - PID LIVENESS ALONE. A pid is reused and is meaningless across hosts and
    destroyed worktrees -- the exact scenarios in the Given. It can only ever be
    corroborating evidence, never the rule.
  - A HEARTBEAT WRITTEN BY THE CALLER RATHER THAN BY THE SHARED HELPER. A long,
    quiet build then looks abandoned and is reclaimed out from under itself,
    which fails the third Then clause in the most damaging direction.

  THE ENFORCEMENT HALF OF THE FOURTH CLAUSE IS EASY TO SHIP HALF-DONE. Recording
  the takeover is only half the guarantee; the other half is that a write by a
  claimed owner re-checks ownership first. Without it the record faithfully
  documents a double-build nobody reads. Both halves are it_requirements, and the
  returning-owner test asserts the second.

  THE THRESHOLD IS THE ONE NUMBER OPERATORS WILL SEE. It must be named and
  configurable, because ACD-2000b-5's diagnostic clause obliges the reference doc
  to quote its default and say where it lives -- a literal at the comparison site
  makes that documentation impossible to keep true.
