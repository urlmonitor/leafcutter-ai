notes: |
  The id-shape test in TQ-100b-4 accounts for all 64 of the measured non-id
  artifacts, but it cannot remove a false positive whose captured value happens to
  be well-formed — a tag-mechanism test that builds the literal string
  "# covers: <some-id>" as fixture input is indistinguishable from a real tag on
  shape alone. That is why position is a second, independent recognition rule and
  gets its own criterion rather than being folded into TQ-100b-4.

  Residual-risk note for the implementer and for whoever later remediates the 16:
  some of the 16 currently-id-shaped unresolved values (AC-1 through AC-6 read
  like invented fixture ids) may themselves be literal-position artifacts that
  this criterion removes. TQ-100b-4 therefore bounds the surviving list at "at
  most 16" rather than "exactly 16". Confirming which of the 16 are genuine is
  remediation work and is out of scope here.

  TEST ANGLE: assert by running the reader over a real tree containing the
  literal, then over the same tree with the text relocated to tag position. The
  flip between the two real runs, through one entry point, is the proof; a test
  that feeds two strings to the pattern proves nothing.
