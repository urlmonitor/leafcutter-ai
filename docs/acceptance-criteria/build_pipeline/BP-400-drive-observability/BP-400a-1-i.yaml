work_status: todo
created_by: "tickets/00_inbox/TICKET-20260528-WireSupervisorFeedbackEmission.md"
criteria: |
  Given emit_event.py is invoked with --log pointing to a path where the
    file system denies write permission (e.g. a read-only mount),
  When the script attempts to append the JSON line,
  Then it prints a warning to stderr describing the write failure,
  And it exits with code 0 (not code 1),
  And it does NOT raise an unhandled exception.

  This ensures that callers using "|| true" receive consistent behavior:
  telemetry failures never interrupt the drive.
