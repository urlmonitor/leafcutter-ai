id: BP-100n-4
components:
  - build_pipeline
title: "The population of commit gates the reachability check walks is taken from the gate scripts present on disk, so a script the registry never mentions is reported as invoked by nothing — a guard whose input is the registry cannot see what the registry omits"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the repository keeps its commit-gate scripts together in one place, and
    at the time of writing that place holds 66 of them,
  And the gate registry from which the commit-time gate configuration is
    generated holds 59 entries, of which 5 are marked not to be emitted,
  And 19 of the scripts present on disk are named by no registry entry at all —
    including one that the gate family's own reference documentation describes as
    a live gate running with enforcement,
  When the reachability check runs,
  Then the population it examines is obtained by listing the gate scripts
    actually present in that place, and the invoking population is obtained by
    reading the registry actually in effect at commit time, so neither side of the
    comparison is a set written into the check itself,
  And every script present on disk that no registry entry names is reported by
    name, together with the statement that nothing invokes it, and the run fails,
  And a script that a registry entry names but that the generated commit-time
    configuration invokes on no entry line is reported the same way — the question
    the check answers is whether the script is reached at commit time, not whether
    it is mentioned somewhere,
  And a script named by a registry entry that is marked not to be emitted is
    reported as deliberately switched off and does not fail the run — registered
    and switched off is a third state, distinct both from being invoked and from
    being absent from the registry,
  And a script named by a registry entry that is emitted is not reported at all,
  And given one new gate script is added to that place and nothing else in the
    repository changes,
  When the check runs again,
  Then the newly added script is among those reported as invoked by nothing, and
    the number of scripts the check states it compared is one greater than the
    number it stated before — establishing that the population was enumerated
    from the tree rather than recited from a list.
