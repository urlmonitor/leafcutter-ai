assigned_agent: python-coder
estimated_complexity: M
it_requirements:
- Changed in the one measurement function of the size standard (templates/scripts/commit_guardian/_file_size_ratchet.py).
  Every gate that measures length (crossing, growth ratchet, published-rule agreement) picks the change
  up; there is no second implementation.
- Lands in the same change as GE-127h-3, so the published rule and the measurement change together; otherwise
  the rule-agreement check of GE-127d-1 fails.
- A file whose measured length drops because of this change is not reported as a violation, and no stored
  baseline needs a hand edit.
- 'IT PO decision on the comment-prefix source: the measurement takes no language, and the config holds
  only checked_extensions and limits, so the line-comment prefixes (#, //, --) are held once as a constant
  in templates/scripts/commit_guardian/_file_size_ratchet.py. A block starts at a line whose text after
  one of those prefixes is exactly DECISION HISTORY and continues over lines that start with the same
  prefix as its heading, so no per-extension mapping is needed and every checked extension is covered.
  The published rule names the three prefixes.'
- 'A block does not need ''='' rule lines: about 50 of the headings in the repository have none.'
- Measuring stays linear in file length.
declared_files:
- path: templates/scripts/commit_guardian/_file_size_ratchet.py
  state: existing
delivers_to:
  agent: python-coder
  contract: 'The size standard''s measured length of a file (int >= 0) leaves out each line-comment DECISION
    HISTORY block: a comment whose whole text is DECISION HISTORY, an optional ''='' rule line directly
    above it, through the last consecutive comment line. Every other line counts as before; before- and
    after-lengths use the same rule.'
expects_from: null
test_intent:
- clause: the Python file measures 80 and the JavaScript file measures 120
  needs_test: true
  reason: The exclusion is computed by the measurement, and both the Python and JavaScript forms must
    be proven.
- clause: the same holds for the line-comment form of every other language the standard covers (for example
    "-- DECISION HISTORY" in SQL and "# DECISION HISTORY" in shell)
  needs_test: true
  reason: Every covered language must get the same exclusion, and a missed comment syntax would go unnoticed.
- clause: every line outside the block is measured exactly as it was before this change, including ordinary
    comments, docstrings, JSDoc and blank lines
  needs_test: true
  reason: Lines outside the block must keep their old count, or the exclusion would widen silently.
- clause: a file with no decision-history block measures the same length as before this change
  needs_test: true
  reason: Files without a block must measure as before, which guards against a broken scanner.
- clause: a decision-history block that sits inside text the rule in force already leaves out (a module
    docstring or a block comment) is not subtracted a second time, so that file measures what it measured
    before this change
  needs_test: true
  reason: Double subtraction is a computed edge case that would under-count files.
test_spec:
- name: test_ge_127h_1_python_and_javascript_history_blocks_are_not_measured
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: Write the 80-line Python file plus its 25-line '#' history block (rule, heading, rule,
    22 entries) and the 120-line JavaScript file whose header carries a 15-line '//' block with no rule
    lines; measure_current_length gives 80 and 120.
  proves_clause: the Python file measures 80 and the JavaScript file measures 120
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_127h_1_history_block_is_left_out_of_the_length_the_size_check_quotes
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: reachability
  description: 'Stage the 80-line Python file with its 25-line block under a limit of 80 and run the fixture
    copy of check_file_size.py as a subprocess: it exits 0 and lists the file at 80 lines; the same file
    with one more code line exits 1 quoting Lines: 81. Uses _ge_127d_2_fixture.build_fixture_tree (a copy
    of the production modules in a temporary git repository, no build.py, no POSIX flock).'
  proves_clause: the Python file measures 80 and the JavaScript file measures 120
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_127h_1_line_comment_block_is_left_out_in_every_covered_language
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Parametrised over every extension in the shipped file_size.checked_extensions, each with
    its line-comment prefix from the one prefix constant in _file_size_ratchet.py (''#'' for .py and .sh,
    ''//'' for .js, .mjs, .ts and .tsx, ''--'' for .sql): a file of N measured lines plus a history block
    whose heading is ''<prefix> DECISION HISTORY'' measures N. The constant is exactly (''#'', ''//'',
    ''--''). A ''#'' heading followed by ''//'' lines ends the block at the first ''//'' line, which is
    counted.'
  proves_clause: the same holds for the line-comment form of every other language the standard covers
    (for example "-- DECISION HISTORY" in SQL and "# DECISION HISTORY" in shell)
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
  must_catch:
  - only the '#' form recognised, so '-- DECISION HISTORY' in a .sql file is still counted
  - a per-extension prefix mapping that leaves out a checked extension such as .mjs
  - the block continued over lines with any comment prefix instead of its heading's prefix
  - a second copy of the prefixes kept beside the constant (for example in the published rule text)
- name: test_ge_127h_1_lines_outside_the_block_measure_as_before
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: A file with ordinary '#' and '//' comments, a docstring, a JSDoc /** */ block, blank lines
    and a history block measures exactly its pre-change count (pinned) minus the block's lines.
  proves_clause: every line outside the block is measured exactly as it was before this change, including
    ordinary comments, docstrings, JSDoc and blank lines
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_127h_1_file_without_a_history_block_measures_as_before
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: Representative Python, SQL and JavaScript files without a block measure the same pinned
    length the pre-change rule gives (the existing GE-127d-2 counts stay green).
  proves_clause: a file with no decision-history block measures the same length as before this change
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_127h_1_block_inside_a_docstring_or_block_comment_is_not_subtracted_twice
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: discrimination
  description: A module whose history sits inside a trailing triple-quoted string (the form _file_size_ratchet.py
    itself uses) and a JavaScript file whose history sits inside a /* */ header each measure what they
    measured before this change.
  proves_clause: a decision-history block that sits inside text the rule in force already leaves out (a
    module docstring or a block comment) is not subtracted a second time, so that file measures what it
    measured before this change
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
  must_catch:
  - the block scan run on the raw text before docstrings and block comments are stripped, so the embedded
    block's lines are subtracted a second time
  - '''# DECISION HISTORY'' text inside a docstring treated as a line-comment block'
