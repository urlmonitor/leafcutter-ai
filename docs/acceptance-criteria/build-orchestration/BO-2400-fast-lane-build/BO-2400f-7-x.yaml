assigned_agent: python-coder
estimated_complexity: S
declares_side_effect: false
declared_files:
  - path: templates/workflows-js/fast-lane-ship.js
    state: existing
it_requirements:
  config_schema_fragment:
    claim_outcome_source:
      type: string
      enum: [stdout, stderr, none]
      description: >-
        Which stream the claim reader took the claim outcome from. Standard output is read
        first; standard error is read only when standard output holds no readable claim
        outcome; none means neither did, and the reply is then classified without a held
        outcome (ran and failed on a non-success exit).
  reference_file_path: templates/workflows-js/build-ticket.js
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - >-
      A READABLE CLAIM OUTCOME IS A WHOLE OBJECT. On either stream, the outcome counts only
      when a complete JSON object with the claim outcome's fields (claimed, excluded_claimed,
      target_refused) can be read from it. Ids that merely appear in a traceback, a warning or
      other text never make a held outcome.
    - >-
      Standard output wins when both streams hold an outcome. A warning or other text on
      standard error never changes the halt kind of a reply whose standard output holds the
      outcome.
    - >-
      The fallback to standard error is a tolerance of a relay fault (BO-2400a-1-i says both
      streams are relayed verbatim), not a new contract. It must not change how any other
      command step reads its reply, and the relay fault itself is not fixed here.
    - >-
      The reply used for the first scenario is the one copied from the 2026-11-16 journal
      (run wf_1d040da5-d48), exit status 1, kept as a fixture byte for byte.
test_intent:
  - clause: it halts as held, naming KM-400e-5 (BO-2400f-7-ix)
    needs_test: true
    reason: The observed relay put the outcome on standard error, and a reader of standard output alone turns this held claim into a wrong halt.
  - clause: it does not say the claim was never attempted
    needs_test: true
    reason: The never-attempted wording is exactly what the 2026-11-16 run printed for this reply.
  - clause: the held outcome is taken from standard output, the halt names XY-100a-1, and the warning text does not change the halt kind
    needs_test: true
    reason: A stream fallback that prefers standard error, or reads the warning as an error, would misclassify a correct reply.
  - clause: it does not report a held halt naming no member
    needs_test: true
    reason: The reserved held status with no readable outcome is the shape most likely to produce an empty held halt.
  - clause: it halts as a claim command that ran and failed, quoting what came back
    needs_test: true
    reason: Without a readable outcome the only honest halt is ran and failed, and the quote is what the operator acts on.
test_spec:
  - name: test_the_2026_11_16_relayed_on_standard_error_reply_halts_as_held_naming_km_400e_5
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Gives the claim step the reply copied byte for byte from the 2026-11-16 journal (run wf_1d040da5-d48), exit
      status 1, empty standard output, the held outcome with KM-400e-5 on standard error, stored as a fixture file
      and loaded in the test. Runs it through the workflow-engine harness and asserts halt_kind claim_held naming
      KM-400e-5. The wrong version it catches is a reader of standard output alone, which turns this held claim into a
      claim command failed halt.
    proves_clause: it halts as held, naming KM-400e-5 (BO-2400f-7-ix)
    code_file: templates/workflows-js/fast-lane-ship.js
    must_catch:
      - a reader that parses standard output only and so never sees the outcome
      - a reader that finds the outcome on standard error but still ends in the never attempted halt
  - name: test_relayed_on_standard_error_held_halt_does_not_say_never_attempted
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Same journal reply. The terminal payload text, lower-cased, must contain none of the never attempted markers
      of test_bo2400f_7_iii_claim_refusal_workflow.py, the wording the 2026-11-16 run printed for this reply.
    proves_clause: it does not say the claim was never attempted
    code_file: templates/workflows-js/fast-lane-ship.js
    must_catch:
      - the old never attempted message kept on the held halt
  - name: test_standard_output_outcome_wins_over_a_warning_on_standard_error
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Builds a fixture store with XY-100a-1 at in_progress, runs the real claim command as a subprocess to capture
      its exit status and standard output, and adds a one-line deprecation warning as standard error. The lane's halt
      must be claim_held naming XY-100a-1, taken from standard output, with a halt kind unchanged by the warning.
      A second case puts a different complete outcome on standard error and asserts the standard output one is the
      one named.
    proves_clause: the held outcome is taken from standard output, the halt names XY-100a-1, and the warning text does not change the halt kind
    code_file: templates/workflows-js/fast-lane-ship.js
    must_catch:
      - a fallback that prefers standard error over standard output
      - a warning on standard error read as an error that overrides the held outcome
  - name: test_held_status_with_no_readable_outcome_never_gives_a_held_halt_naming_nobody
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Feeds the reserved held exit status with both streams empty, with a traceback on standard error that merely
      mentions XY-100a-1, and with an incomplete JSON fragment, and asserts no payload carries halt_kind claim_held.
      Ids that only appear in a traceback or warning must never make a held outcome.
    proves_clause: it does not report a held halt naming no member
    code_file: templates/workflows-js/fast-lane-ship.js
    must_catch:
      - a regex that pulls ids out of free text and calls them held
      - the reserved status alone taken as proof of a held outcome
  - name: test_held_status_with_no_readable_outcome_halts_as_ran_and_failed_quoting_what_came_back
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      Same three replies. Each payload must carry halt_kind claim_command_failed with the exit status and a quote of
      what came back, or the literal no reply wording where both streams were empty.
    proves_clause: it halts as a claim command that ran and failed, quoting what came back
    code_file: templates/workflows-js/fast-lane-ship.js
  - name: test_the_standard_error_fallback_does_not_change_how_other_command_steps_read_replies
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Gives the resolve-connected command step a reply with exit status 0, empty standard output and a JSON list of
      ids on standard error, and asserts the run still ends in the resolver error it ends in today, because the
      fallback is scoped to the claim step.
    proves_clause: it halts as held, naming KM-400e-5 (BO-2400f-7-ix)
    code_file: templates/workflows-js/fast-lane-ship.js
    must_catch:
      - the standard error fallback added to the shared reply reader and so applied to every command step
  - name: test_relayed_held_outcome_is_reachable_through_the_workflow_dispatch
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    angle: reachability
    description: >-
      Runs fast-lane-ship.js as the engine does (run_workflow_under_e2 with args ac) with the claim-connected label
      answered by the journal reply and asserts the run's terminal return value is the held halt.
    proves_clause: it halts as held, naming KM-400e-5 (BO-2400f-7-ix)
    code_file: templates/workflows-js/fast-lane-ship.js
