it_requirements: |
  The flow-author agent does not exist yet and must be built. It consumes the classifier output,
  the drafted mock data, and the drafted mockups, and produces a *.flow.json conforming to
  flow.schema.json — steps wired to screen ids, reads/writes over registered entities, and one
  acceptance_scenario per node. It must follow the add-vs-create rule (extend an existing journey
  rather than duplicate). A hand-authored gold example lives at
  docs/product-truth/mock-data/pipeline-prompts/draft-flow.prompt.json.
