    reason: "Promise made entry-point-agnostic, and BO-2600b added to carry it into the fast lane. The tightness guarantee ('structural parent links are not mistaken for prerequisites') was already stated here, but the only L1 beneath it, BO-2600a, is scoped to /build-ac by its own title and opening line. The fast lane was therefore never covered: templates/workflows-js/fast-lane-ship.js:307 builds the select_connected command and never passes --exclude-structural-parent, so the capability delivered by BO-2600a-1 and BO-2600a-2 (both done) has no production caller on that lane. Measured 2026-08-18: aiming the lane at the leaf BO-2400c-1-v resolves to the whole BO-2400c subtree (5 ids), where the flag plus target BO-2400c-1 resolves to the intended 3. Amended so the goal states the guarantee holds for every entry point, not just the one that happened to be built first."
