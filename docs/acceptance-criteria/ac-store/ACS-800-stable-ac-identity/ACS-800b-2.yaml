title: "A requirement's level is recorded as an explicit field"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given a requirement that is a feature-level item,
  When it records where it sits in the tree,
  Then it stores an explicit level field holding the value L1,
  And the level is read directly from that field rather than inferred from the
    shape of the requirement's name,
  And the level field accepts only the values L0, L1, L2, and L3.
