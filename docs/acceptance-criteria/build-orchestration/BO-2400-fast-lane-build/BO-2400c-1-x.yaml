notes: |
  WHY SIZE GETS ITS OWN RECORD RATHER THAN A CLAUSE. Size has been the wrong answer twice in
  this family's history and the wrong answer has been load-bearing both times. Occurrence
  one produced "the contract is unsound at this size", which licensed a fix aimed at making
  the payload smaller. The payload was made smaller — BO-2400c-1-vi cut it from 148,891
  bytes to roughly 20 KB, correctly and for good independent reasons — and occurrence two
  then failed at 18,190 bytes. Recording the size-independence of the guarantee as its own
  criterion is what stops the next reader reaching the same conclusion a third time from the
  same evidence.

  THIS RECORD DOES NOT ASK FOR A SIZE LIMIT, AND SPECIFICALLY DOES NOT ASK FOR THE PAYLOAD
  TO BE SMALLER. BO-2400c-1-vi owns composition and states plainly that smallness must be a
  consequence of what the bundle contains and never of a cap, a truncation or a
  summarisation step. Nothing here contradicts that: the third scenario is about detecting
  and naming a shortfall that has already happened, not about imposing one.

  WHAT THE THIRD SCENARIO IS ACTUALLY FOR. Nobody currently knows whether a ceiling on what
  can cross the boundary exists or where it is. If one does, a run that meets it today
  produces a truncated reply that reads as corrupted content, and the finding would be filed
  as a third occurrence of the same mystery. Requiring the quantities to be reported turns
  an unknown limit into a measurement the first time it is hit. That is the difference
  between a wall that has been moved and a wall that has been located.

  ON THE 2026-08-31 SIZE READING. The reply reported 18,190 bytes for a bundle the design
  targets at roughly 20 KB, so the producer was operating exactly where it was asked to. The
  corruption was introduced by the transport, not by volume — the source document on disk
  contains no escaped entities at all, confirmed at the time. Any future criterion in this
  family that reasons from size should cite that measurement before it does.
