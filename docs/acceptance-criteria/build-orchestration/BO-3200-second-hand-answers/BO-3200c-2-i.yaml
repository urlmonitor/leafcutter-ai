notes: |
  SCOPE — FINALIZE INSTANCE ONLY, BUILDABLE ON ITS OWN. A call-site fix in
  templates/workflows-js/finalize-feature.js. It does NOT introduce a shared gate module or a
  marker-delimited GATE-ANSWER block, and does NOT change plan-feature.js (a runtime decision for
  plan-feature is pending under ADR-078). The generic BO-3200c tree (c-1, c-2, c-3) is unchanged;
  this child neither waits on nor alters them. The only edit to an existing record made alongside
  this AC is adding BO-3200c-2-i to BO-3200c-2's covered_by.

  Fixes KI-BO-20260925-finalize-gate-accepts-agent-answers (blocker), both halves:
  (1) the step-4 merge gate accepts any {action|choice}-shaped live reply — the KI-ACD-005 shape on
  the most destructive step in the package; (2) the read-pause-record and pause-persist dispatches
  go to status-checker (permits_shell: false), and with no persist verification a refused write
  still yields paused_awaiting_input, i.e. a pause no later run can resume.

  WHY ONE AC CARRIES BOTH HALVES. Requested as a single narrow child. The halves are coupled: once
  agent replies stop settling the merge gate, every headless run takes the pause path, so the pause
  path must actually persist — otherwise the provenance fix converts "merges on an agent reply" into
  "reports a pause that cannot be resumed". Splitting them would ship the first half into the
  second half's defect.

  THE DECLINE SCENARIO IS THE ANTI-VACUUM CLAUSE. A gate that never merges satisfies scenarios 2 and
  3; scenario 1 (person proceeds -> merge) and scenario 4 (person declines -> halt, distinct from
  pause) stop the fix being satisfied by a gate that accepts nothing, and keep "no answer" and
  "the person said no" distinguishable as BO-3200c requires.

  ORDERING NOTE FOR THE IT PO: the shell-runner agent named by ADR-070 must exist in the deployed
  registry before the pause-store dispatches can route to it. If it does not yet exist at build
  time, that is a depends_on to add, not a reason to keep status-checker.
