id: INF-1100a-2-i
title: "A configured test_root other than the default is honored verbatim"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given the project configuration declares a non-default test location
    (for example test_root: "qa/tests/" in skills_config.json),
  When an agent resolves where a test for the etl area must go,
  Then the resolved location is "qa/tests/etl/" — the configured root joined
    with the source area subpath,
  And the resolution does not substitute the built-in default "tests/".
