notes: |
  GAP 1 OF BO-2400g. PLANNING-TIME ONLY — READ THIS FIRST. This AC settles what is
  ASKED FOR before a test exists. It never decides whether anything was achieved, it
  describes no verdict, no gate, no block and no done-state consequence, and nothing
  it produces may be offered as evidence that any work is reached (BO-2900a-2's
  prohibition, inherited via BO-2900g). The consequence half of BO-2400g lives in
  BO-2400g-2 through g-4 and is deliberately separate.

  VERIFIED EVIDENCE (2026-08-17, do not re-investigate).
    - templates/workflows-js/fast-lane-ship.js phases: Worktree, Resolve, Claim,
      Test Writer (line 327), Coder (line 395), Commit (line 471), Pull Request
      (line 539). No ticket exists anywhere in the lane; its docstring says "No
      per-ticket supervisor chain, no planner (BO-2400f)".
    - The reachability floor from PR #451 lives in exactly two ticket-shaped places:
      scripts/ac_store/generate_ticket_from_ac.py (which the lane never calls —
      grepping BOTH fast-lane workflows for generate_ticket_from_ac / test_spec /
      angle / reachability returns ZERO hits), and templates/agents/test-writer.md
      lines ~216-227, whose entry condition at line 206 is "Code ticket (a coder agent
      is needed)" with the skip rule at line 188 deciding on the AGENT MAP, not the
      Test Requirements block. The lane supplies no source_ac frontmatter, no agents
      map and no '## Test Requirements' block, so the condition never evaluates true.
    - What test-writer actually receives is the ad-hoc prompt at
      fast-lane-ship.js:333.

  THE BOUNDARY WITH BO-2900g-1, IN BOTH DIRECTIONS. BO-2900g-1 is titled "The demand
  for proof-of-wiring reaches every piece of work, including work that arrived with a
  plan of its own" and looks like it already covers this. It does not.
    - Its implementation surface is reference_file_path
      scripts/ac_store/generate_ticket_from_ac.py with n_location_rule "1" — "the
      single return path that produces the ## Test Requirements descriptor list" — and
      its discriminating test introduces "a third descriptor-producing route", still
      inside that program. It closes the gap between two plan-producing routes within
      one program. Built exactly to its own spec, it leaves the fast lane uncovered:
      the fast lane is not a route that produces a weaker plan, it is a lane that
      produces no plan at all and never loads that program.
    - In the other direction: satisfying THIS AC does not satisfy BO-2900g-1. Nothing
      here addresses the authored-test_spec exemption inside the generator, the
      third-route attachment point, or generator idempotency. An implementer who does
      one and marks the other done has closed half the hole.

  WHY THE depends_on EDGE TO BO-2900g-1 IS REAL AND NOT DECORATIVE. The second and
  third Then clauses require the lane to inherit the SAME demand rather than grow a
  private copy. BO-2900g-1 is the AC that moves the floor to a single attachment point
  where a plan is finalised for a piece of work; landing this AC first would force the
  lane to hard-code its own wording, which is precisely the outcome the third clause
  forbids and which would then have to be unpicked. This is the ADR-026
  "read-side before write-side" instinct applied to a shared demand: establish the one
  source, then teach the second consumer to read it.

  DESIGN HAZARD FOR THE IT PO. The tempting fix is to loosen test-writer's line 188
  agent-map skip rule so the mandate fires without an agents map. That changes the
  THOROUGH lane's behaviour as a side-effect and puts the floor back into an LLM
  template where no test can execute it. The demand should reach the lane as data the
  lane hands to the test-writer, not as a relaxed condition inside the agent prompt.

  THE MULTI-MEMBER CASE IS NOT HERE. The lane resolves one AC id into a connected
  build set (resolve_connected_build_set, scripts/build_orchestration/fast_lane.py:498),
  so "the work" is routinely several requirements. That case is BO-2400g-1-i, kept
  separate because an implementation that asks only for the AC named on the command
  line satisfies every clause above.
