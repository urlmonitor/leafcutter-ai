notes: |
  WHY A NAMED REAL INSTANCE RATHER THAN A FIXTURE. The parent L1 requires this to
  go red on a real orphan, and "fast-lane-build" is one, reproducible on the
  reporting machine at the time of authoring. A criterion demonstrated only
  against a synthetic fixture is the weaker claim, because the fixture is built
  by the same person who builds the check and inherits their assumptions.

  THE EVIDENCE ON DISK, 2026-09-07, re-verified during decomposition rather than
  taken from the brief:
    - leafcutter-ai/templates/workflows-js/ holds EIGHT scripts. No
      fast-lane-build.js.
    - TWO genuinely distinct installed trees each hold NINE, the extra being
      fast-lane-build.js:
        /home/henzeh/projects/leafcutter/.leafcutter/workflows/
          (surfaced as .claude/workflows via a build-created link)
        /home/henzeh/projects/leafcutter/leafcutter-ai/.claude/workflows/
    - The second tree's OTHER workflows carry mtimes of 2026-09-07 16:30, so
      builds have demonstrably run against it since the template was deleted on
      2026-09-01, and left the orphan in place each time. This is stronger than
      "six days passed": it is builds that ran, examined, and reported clean.

  THE "BY NAME" CLAUSE IS NOT DECORATION. The parent's amendment is explicit
  that the harm is the dead capability remaining SELECTABLE, not merely a file
  sitting on disk, and warns against collapsing the outcome back into "the file
  is removed". The third Then clause is that outcome stated as an observation.

  A REACHABILITY RESIDUE THIS AC DOES NOT CLOSE -- FLAGGED, NOT TAKEN. Found
  during decomposition: templates/commands/fast-lane-build.md STILL EXISTS in
  source, and the installed command copy is therefore legitimately deployed and
  is NOT an orphan by any deployed-versus-source comparison. So after this sweep
  removes the workflow script, the project still offers a "/fast-lane-build"
  command by name whose runner is gone. That is a shipped command needing an
  absent artifact -- the DECLARED-BUT-ABSENT direction, which is BP-900g-8-ii's
  subject, not this one. It is recorded here so the boundary is not mistaken for
  an omission: removing the orphan is necessary for the parent's reachability
  clause and, for this particular capability, not on its own sufficient. See the
  report accompanying this decomposition.
