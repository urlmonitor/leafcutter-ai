criteria: |
  A workspace that is unmistakably yours -- never shared, never taken over.

  Starting to author requirements reliably gets you a space of your own, even when
  you or a colleague start several sessions on the same day or on the same part of
  the product. If a space is already there, it is continued only when it is yours;
  work someone else left in progress is reported to you and left alone, never
  quietly absorbed into your session.
