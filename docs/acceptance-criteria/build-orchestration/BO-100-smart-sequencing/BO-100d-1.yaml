title: "An unreachable telemetry sink hard-blocks the drive before any dispatch"
component: build-orchestration
level: L2
status: superseded_by
req_status: active
work_status: todo
criteria: |
  Given /build-feature is invoked for an epic that has at least one ready ticket,
  And the pre-drive feedback-sink reachability probe attempts to append one probe
    line to the telemetry sink at debugging/logs/agent_telemetry.jsonl,
  When the probe returns a non-zero result (the append fails — for example the
    path is not writable),
  Then no ticket-supervisor is dispatched for the epic,
  And the drive halts immediately at the pre-dispatch stage,
  And the operator is shown an actionable message that names the failing sink
    path (debugging/logs/agent_telemetry.jsonl),
  And that message states the remediation needed to make the sink writable,
  And no epic tickets are transitioned to in_progress.
