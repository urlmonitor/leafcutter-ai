id: BP-600c-2-i
components:
  - build_pipeline
title: "Quick-fix workflow halts when a test errors out rather than failing cleanly"
component: build-pipeline
level: L3
status: active
readiness: reviewed
priority: medium
work_status: todo
criteria: |
  Given the test-writer has produced a test file,
  When the workflow runs the red-phase test,
  And the test runner returns an ERROR (import failure, syntax error,
    fixture not found, or a selection that ran no tests at all) rather than
    a FAILED assertion,
  Then the workflow halts with a message distinguishing the error from
    an expected test failure,
  And it reports the specific error to the user rather than treating
    it as the expected red phase,
  And it does not proceed to the fix-application phase,
  And the error outcome is examined BEFORE the pass/fail verdict is read,
    because a run that never reached its assertions reports "did not pass" —
    so a workflow that checks the boolean first reads the error as a good red
    phase and applies the fix anyway,
  And the same distinction is made on the green side: an error there is
    reported as a test that could not run, not as a fix that did not work,
    and the message states that the fix is still applied so no one goes
    looking for lost work.
depends_on:
  - BP-600c-2
doc_links:
  - path: docs/architecture/agent_delivery_workflows.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-006-flatten-supervisor-chain.md
    relationship: describes
    status: exists
  - path: templates/workflows-js/quick-fix.js
    relationship: implements
    status: exists
    relevance: >-
      The runner result schema carries an outcome tri-state
      (passed/failed/error) alongside the boolean, and both the red and green
      phases branch on outcome === 'error' before reading the boolean. The
      halt reasons are red_phase_error and green_phase_error.
assigned_agent: workflow-architect
estimated_complexity: S
it_requirements:
  - "Must operate at depth 0 per ADR-006 — phase agents dispatched at depth 1 via the Agent tool"
  - "Requires Claude Code >= 2.1.154 for JS workflow script support"
  - "Must handle errors gracefully per the project error handling policy"
  - "Must distinguish ERROR (test infrastructure failure) from FAILED (assertion failure) in test-runner output"
  - >-
    The boolean pass/fail field cannot carry this distinction on its own — an
    error and a failure both report "did not pass". A separate outcome value is
    required, and it must be a required field of the runner result so a runner
    that omits it cannot be silently read as a clean failure.
  - >-
    The error branch must be evaluated before the pass/fail branch on both the
    red and green sides. Ordering is the whole guard: placed after, it is
    unreachable for the red case it exists to catch.
