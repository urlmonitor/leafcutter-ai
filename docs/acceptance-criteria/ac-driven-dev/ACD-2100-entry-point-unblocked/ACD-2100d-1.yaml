criteria: |
  Given a project into which the route has been installed by running the installer
    from the current source,
  When a run is started in that project using the installed copy and a second run
    is started in the source checkout using the source copy under the same starting
    directory conditions,
  Then both runs reach the same point -- the first question the route puts to the
    user,
  And neither run stops at a check performed before that point,
  And the finding rests on what the two runs did rather than on any comparison of
    the two files.
