notes: |
  THE MEASURED DEFECT. The rule asks the observation the reached-through question
  while naming no code under proof. Nothing can match an unnamed subject, so the
  reached-through answer is negative for every proof that has ever been judged,
  and the rule is left reading the only other fact available: whether the way in
  was entered at all. That is how a proof that enters the way in for an unrelated
  action and then calls the code directly is ACCEPTED, while an honest proof that
  executes the behaviour by import is REFUSED. Both verified by execution.

  WHY THIS IS AN OBSERVATION AC AND NOT A RULE AC. The rule's mistake is visible
  in what it asks, but the durable repair is on the answering side: a question
  with no subject must come back undecidable rather than negative. As long as an
  unnamed question can return a plausible negative, every future caller can make
  the same mistake and no test of the caller will catch it.

  WHERE THE NAME COMES FROM, stated deliberately. No field anywhere in the store
  names a piece of code — every candidate names a file, and one of them is
  defined by the schema as a registration edit-surface rather than the unit under
  proof. Asking the store for a name it does not hold is how the empty question
  arose in the first place. The subject of the question is therefore the code
  belonging to the named unit, derived from the run, not a name looked up in a
  record. An implementer who reaches for a new store field to hold a function
  name has recreated the problem with more ceremony.

  THE PARENT'S CONTRACT CANNOT EXPRESS THIS TODAY and needs amending rather than
  replacing — one named piece of code and one pair of booleans per record, which
  cannot carry either a set of code reached or a third undecidable state. The
  parent's criteria are right; the record shape underneath them is the part that
  is short. Flagged here for the IT PO pass rather than decided here.

  BOUNDARY. What the observation spans is BO-2900a-2-i; what happens when it can
  see nothing is BO-2900a-2-ii; which unit the question is about is
  BO-2900a-1-iv; what the answer is used for is BO-2900a-1 and BO-2900a-1-i. This
  AC covers only the well-formedness of the question and the three-way shape of
  the answer.

  VERIFICATION MUST EXECUTE BOTH HALVES IN ONE RUN. The unnamed-question half is
  what fails on today's code; the named-question half is what stops the fix being
  "always answer undecidable". A test handed pre-computed answers proves neither
  — it is the same shape of evidence that let the empty question ship.
