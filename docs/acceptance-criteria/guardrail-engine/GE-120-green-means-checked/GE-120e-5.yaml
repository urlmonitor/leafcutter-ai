it_requirements:
  - "SEQUENCE AFTER GE-120e-1, GE-120e-2 AND GE-120e-4 HAVE LANDED. The document must name the shared source's real module and import path, and the real per-entry field name and its location in hooks_manifest.hooks[]. Writing it from these ACs' placeholder wording documents behaviour that does not exist, which is the failure mode GE-120d-5 was sequenced to avoid."
  - "SAY WHICH COPY OF THE MANIFEST AN AUTHOR EDITS. build_commit_guardian() deploys commit_guardian.json to BOTH scripts/commit_guardian/ and config/commit_guardian/; the source of truth an author edits is templates/scripts/commit_guardian/commit_guardian.json, and build.py produces the other two. A reader who edits a deployed copy loses the change at the next build."
  - "SHARED-FILE HAZARD: docs/how-to/managing-pre-commit-hooks.md is also edited by GE-120b-5 and GE-120d-5. RE-READ the file as they left it immediately before editing — do not work from a copy taken earlier — and do not re-introduce the manual layout-link step GE-120b-5 removed, in any wording."
  - "THE RULE AND ITS LIMIT MUST BE IN THE SAME SECTION, not merely in the same document. Stated alone, 'a check reports only the author's changes' reads as licence to exempt merges — which is the one failure this L1 could itself produce."
  - "QUOTE THE OBSERVED MESSAGES, DO NOT PARAPHRASE THEM. The worked example must carry the text check-contract-shrinking and check-doc-frontmatter actually emitted on the observed merge, so a reader can match what they see against what is written. A paraphrased error message is unmatchable and rots invisibly."
  - "THE LAST CLAUSE IS SATISFIED BY CONFIRMING, NEVER BY INVENTING A TARGET. Search docs/how-to/, docs/reference/ and the component doc for merge-time override guidance. At authoring time none was found on a documentation surface — the guidance the observed session followed lives in operational notes outside this store. If the search still finds nothing, record that finding in the sign-off; do not manufacture a passage to correct, and do not extend the correction into operational notes outside the documentation surfaces."
  - "ADD THE ATTRIBUTION RULE AND ITS LIMIT TO docs/acceptance-criteria/guardrail-engine/PROJECT_CONTEXT.md, beside the fail-open boundary, so it is loaded as a standing convention by agents working this component rather than only found by a reader who opens the how-to."
  - "Both target documents are tracked surfaces subject to check_doc_frontmatter, check_doc_length and check_doc_links. Edit in place and keep them passing in the same commit."
test_spec:
  - name: test_ge120e5_attribution_rule_and_its_limit_appear_in_the_same_section
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    description: "The how-to states the attribution rule and its limit — author's own resolution still counts, a merge is never grounds to skip — within one section, not merely in one file."
  - name: test_ge120e5_howto_names_the_shared_source_and_the_recorded_manifest_field
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    description: "The document names the shared authored-change source and the per-entry field in hooks_manifest.hooks[] where each check's change-set source is recorded."
  - name: test_ge120e5_no_merge_time_override_guidance_remains_on_documentation_surfaces
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    description: "A scan of docs/how-to/, docs/reference/ and the commit-guardian component doc finds no guidance instructing a reader to override these checks when merging."
test_rationale: "change_target is docs and assigned_agent is documentation-expert, so the check-ac-schema test-contract gate does not require a contract here at all — this one is authored deliberately rather than to satisfy the gate. The last criterion is an ABSENCE claim across a set of documentation surfaces, and an absence is the one thing a reviewer reading this AC's diff cannot verify: the diff shows what was added, never what still stands elsewhere. Only a mechanical scan can fail on it, which is the same narrow case GE-120d-5 already established in this tree for its anti-reintroduction clause. Setting test_required: false instead would drop the scan entirely — test-writer would skip, and the AC's own coverage note calls that clause 'the one that can be quietly skipped'. The behavioural criteria of this L1 are covered by GE-120e-3 and its children; nothing here duplicates them."
