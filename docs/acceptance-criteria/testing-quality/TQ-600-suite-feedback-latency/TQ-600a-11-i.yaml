title: "An installation whose YAML library lacks the C extension still works, just slower"
component: testing-quality
level: L3
status: deprecated
req_status: superseded
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  RETIRED 2026-10-09 WITH ITS PARENT TQ-600a-11. The shared parser accessor whose
    fallback branch this record exists to exercise has exactly one caller — the
    agent-card generator's whole-AC-store walk — and that walk is removed when agent
    cards become static. With no caller, there is no fallback decision to make and no
    store-reading entry point that behaves differently with or without the C
    extension. Read the amended_by entry before reinstating anything; one clause of
    this record remains true of a DIFFERENT site and is named there. Text below is
    preserved verbatim for audit.

  Given a Python environment whose installed YAML library was built without the
    libyaml C extension, so the C safe parser class is absent from the module
    namespace — the configuration an adopter of this package can legitimately have,
    and which this development workspace does not have, since the library here
    reports the C extension as present,
  When any store-reading entry point in the package is invoked in that environment,
  Then it runs to completion and yields results equal to the ones it yields where
    the C extension is available,
  And it raises no import error at module load, and no attribute error at the point
    the parser is chosen,
  And the shared accessor picks the pure-Python safe parser in that environment and
    the C-backed one where the extension is available, having made the choice by
    handling the class's absence rather than by inspecting a version string or a
    platform name,
  And the absence case is exercised by a check that simulates it — the class removed
    from the module namespace for the duration of the check — rather than by reading
    the accessor's source and agreeing that it looks safe.
