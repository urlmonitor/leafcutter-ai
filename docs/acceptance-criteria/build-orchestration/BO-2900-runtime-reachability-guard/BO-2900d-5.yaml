it_requirements:
  - "Create docs/reference/reachability-exemptions.md as a REFERENCE, not a second how-to. The audience is a reviewer deciding whether an accumulated set of exemptions is acceptable; the author-facing decision and procedure live in BO-2900d-4 and must not be duplicated here."
  - "Document the record shape exactly as implemented: config/reachability_exemptions.yaml, top-level `exemptions:` list, entries { item, kind: unit|capability, reason, recorded, recorded_by }, matched by exact string equality on `item` — no globs, no prefixes, no regex."
  - "Document the three exemption states and their consequences: in_force (suppresses the finding, counted in the total), reasonless (does NOT exempt, reported distinctly, not counted), stale (item no longer resolves — reported, NOT counted, and non-refusing on its own per the IT PO decision on BO-2900d-3). State that a stale entry whose item reappears is reported as re-armed."
  - "Document the output contract from BO-2900d-2: every exemption in force with its reason, plus the stated total, appear on EVERY run of the guard including runs that report no findings."
  - "State precisely which refusals an exemption releases — code that nothing reaches (BO-2900a-3) and a registered capability deliberately not driven by automation (BO-2900b-1-i) — and which it does NOT: a proof that reached its code by direct import, and an automation invocation naming a capability that does not exist. Offering an exemption on those two converts a short fix into a permanent hole."
  - "Include one paragraph distinguishing this exemption from BP-1100b-5's in-source `# presence-only: <reason>` assertion waiver: different medium (a project registry file versus an in-source comment), different subject (a unit or capability versus a single assertion), different scope, and separate namespaces that must never be merged. Do not edit BP-1100b-5 or its side of the documentation from this tree."
  - "Register in docs/INDEX.md and satisfy check-doc-frontmatter, check-doc-length and check-doc-index."
