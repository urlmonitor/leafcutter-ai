criteria: |
  Workflow scripts land in the right place after every build — no manual wiring needed.

  When a workflow script is compiled by the build system, it is automatically
  registered in all four infrastructure layers so that agents can discover
  and execute it without manual intervention. A parity test catches any
  future omission before it reaches users.
