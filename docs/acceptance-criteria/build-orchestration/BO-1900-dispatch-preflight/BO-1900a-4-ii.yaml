assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/workflows-js/build-feature.js
  n_location_rule: "2 -- the per-ticket planning step in build-feature.js and its twin in build-ticket.js, which must stay identical"
  required_skills:
    - python-coder
  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_ticket_plan_holdback.py"
  constraints:
    - "AN ABSENT REPLY IS NOT AN EMPTY PLAN. The reduction that substitutes a blank record for a missing reply, and then a blank list for a missing list, is what converts a dead planner into a completion claim. Those two substitutions in sequence are the defect; neither is defensible on its own and the pair must be replaced by an explicit unusable-reply branch, not by a safer default value."
    - "ABSENCE OF A CLAIM IS NOT A CLAIM. The reply schema does not require the ordered list, so a reply that simply omits it is legal and validates. Test for the affirmative presence of the list and treat everything else as unusable -- not for an explicit failure with everything else treated as usable. A check written against the failure takes the usable branch on a partial reply, which is the shape a truncated or degraded planner actually produces. This mirrors the correction already made to the epic-level re-check in BO-300a-5-i; make the two read the same way."
    - "THE LEGITIMATELY-FINISHED TICKET MUST NOT BE STRANDED. A usable reply that does state its list, where every phase in it is already signed off or not needed, is a normal and common outcome -- every resumed drive produces it. It must flow to the completion decision untouched. Without this half the fix converts a phantom-done defect into a drive that can never finish anything, and the negative cases alone cannot detect that."
    - "HOLDING BACK MEANS WRITING NOTHING. A held-back ticket must leave the drive with its recorded state exactly as found. An implementation that holds back the dispatch but still routes the ticket through the completion decision re-creates the defect one step later, and will look correct in a test that only counts dispatches."
    - "VERIFY BY EXECUTION, NOT BY GREP. Per CLAUDE.md 'Gate / Workflow ACs -- Verify Behaviorally, Not by Grep', a source-searching test passes on a guard that is computed and ignored. Each case must be driven through the real workflow via unit_tests/prompt_assembly/harness_build_ticket_guard.mjs and asserted on the dispatch record and the ticket record left on disk."
    - "THE HARNESS CANNOT REACH THIS CASE YET. The harness derives the phase list from the fixture's frontmatter, so there is no planner reply for a test to withhold or corrupt. Giving the harness control of the plan reply is part of this work; without it every descriptor below is unwritable and the AC would close on a test that never exercised the condition."
    - "BOTH TWINS IN ONE CHANGE."
