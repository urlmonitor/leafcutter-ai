criteria: |
  Given someone facing a list of outstanding conflicts,
  When they follow the how-to for working them down,
  Then it takes them from running the reconciliation, through reading one reported
    conflict, to recording a verdict against it and seeing the outstanding count
    fall.

  Given the how-to,
  When someone who has not worked on this before follows it end to end against the
    real store,
  Then each step produces the result the how-to says it will,
    And they finish with one conflict decided and can see the decision recorded,
  So the guide is verified by being followed rather than by being reviewed.

  Given the how-to,
  When a reader reaches the point of choosing between the verdicts,
  Then it states how to tell the three resolutions apart, and states that leaving a
    conflict not yet decided is a legitimate choice that keeps it outstanding,
  So nobody records a resolution merely to clear a row.

  Given the how-to,
  When a reader looks for what to do when the reconciliation reports an incomplete
    run,
  Then it says to treat that as a failure to check rather than as a clean store,
    and what to do about it,
  So the guide does not teach the habit this goal exists to break.
