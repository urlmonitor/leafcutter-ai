readiness: reviewed
priority: medium
title: "The signoff skill records each deliverable's sign-off onto the requirement, not the ticket body"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2_cutover
criteria: |
  Given a requirement whose deliverable checklist lists a code item, a tests item,
    and a documentation item,
  When the craft responsible for the code item completes and signs off that
    deliverable,
  Then it records the code deliverable's sign-off on the requirement itself,
  And it does not record the sign-off in the body of the grouping ticket,
  And it leaves each of the other two deliverables' slots untouched and still
    unsigned.
depends_on: [ACD-1800b, ACD-1800b-1a]
