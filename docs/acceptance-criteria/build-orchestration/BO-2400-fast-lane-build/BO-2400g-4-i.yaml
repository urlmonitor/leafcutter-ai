notes: |
  WHY THIS IS A SEPARATE L3. BO-2400g-4 draws the line between findings that stop the
  run and findings that do not. It says nothing about what happens to the second group,
  and the cheapest reading of it is "nothing" — print them and proceed. On this lane
  that means they are gone: the run is the only place they existed, both smell readers
  return their findings rather than writing them anywhere, and the pull request is the
  single durable artifact the lane produces. A finding that a person never sees is
  indistinguishable from a finding that was never made, which puts the advisory half of
  the whole review capability back at zero.

  THE OPERATOR CONTEXT MATTERS. This lane is for scoped, interactive work with a human
  close at hand (BO-2400's L0), so it is tempting to argue the operator saw the output
  live. They did — once, in a scrolling transcript, at the moment they were waiting for
  a pull request. The reviewer of the pull request, possibly the same person a day
  later, did not.

  DO NOT INVENT A SECOND PR CONVENTION. BO-800 ("self-describing PRs") already owns
  what a pull request must tell its reader. Whatever presentation is chosen here should
  extend that convention rather than bolt a fast-lane-only format onto the side; two
  formats means two renderers, and the one that drifts is the one that fires least.

  BOUNDARY. This AC is about findings that did NOT stop the run. Findings that did stop
  it never reach a pull request, because BO-2400g-4 requires that no pull request
  exists in that case — the operator-facing message for a stop is that AC's fourth
  clause, not this one's.

  IT-PO ENRICHMENT NOTE (2026-08-17). declares_side_effect is TRUE: the observable is a
  pull-request body submitted to a durable, user-facing surface outside the process —
  the only durable artifact this lane produces. Standing caveat from BO-2400g's notes:
  the fast lane does not dispatch user-surface-smoker today, so the flag records the
  claim correctly but produces no routing on this lane. Complexity is S rather than M
  because the change is confined to the Pull Request phase's body composition
  (fast-lane-ship.js:539) and the two upstream contracts already exist — but that is
  conditional on BO-800's existing renderer being extensible; if BO-800's leaves turn out
  to mandate a renderer this lane does not use, re-estimate to M. Assigned llm-expert on
  the same workflow-js convention as its siblings.
