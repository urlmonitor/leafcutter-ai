roadmap_phase: phase_1
criteria: |
  Given some of the scripts kept alongside the commit gates are deliberately not
    gates — a shared module the gates import, a script superseded by another and
    kept for reference, a tool that runs only in continuous integration,
  And there is a register of deliberate non-gates in which each record names one
    script and states the ground on which that script is not a gate,
  When the reachability check runs,
  Then a script whose record states a ground is reported as a declared non-gate,
    quoting that ground, is not counted among the scripts nothing invokes, and
    does not fail the run,
  And given a record that names a script but states no ground,
  When the check runs,
  Then that record is reported as refused, and the script it names is counted
    among the scripts nothing invokes and fails the run — a blank ground is not a
    ground,
  And given a record naming a script that is not present on disk,
  When the check runs,
  Then that record is reported as stale and named, so the register cannot
    accumulate cover for scripts that no longer exist,
  And the number of declared non-gates is stated in the run's summary alongside
    the number of scripts compared and the number reported, so the size of the
    register is visible in every run rather than only on inspection,
  And given a script is present on disk, is invoked by the commit-time
    configuration, and also carries a record in the register,
  When the check runs,
  Then it is reported as invoked and the redundant record is named, so the
    register does not silently retain cover for a script that no longer needs it.
