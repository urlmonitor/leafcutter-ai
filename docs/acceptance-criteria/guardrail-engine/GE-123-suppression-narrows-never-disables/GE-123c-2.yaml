title: "A note written after a two-field suppression is reported rather than absorbed into the file path it follows"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the security allowlist's second line is
    "GENERIC_SECRET:scripts/commit_guardian/check_paths_integrity.py  # regex literal, not a secret" —
    a recognised rule id and a real file path followed by a trailing explanatory
    note, with no line-number field,
  And that file contains a quoted value assigned to a field named secret which
    the GENERIC_SECRET rule reports,
  When the file is scanned through the multi-file entry point the pre-commit
    secrets check calls, with that allowlist in force,
  Then the GENERIC_SECRET finding is still reported — the entry suppressed
    nothing,
  And a warning is emitted on the error stream naming the allowlist file, the
    1-based line number 2, and the verbatim text of that line,
  And the entry is skipped rather than loaded,
  Because with no line-number field present the note is absorbed into the file
    path itself, so the entry as loaded names a file called
    "check_paths_integrity.py  # regex literal, not a secret", which no scanned
    path can ever end with.

  Given the security allowlist's second line is the same entry with the note
    removed —
    "GENERIC_SECRET:scripts/commit_guardian/check_paths_integrity.py" —
  And that file contains the same reported value,
  When the allowlist is loaded and the file is scanned,
  Then the finding IS suppressed,
  And no warning is emitted,
  Because a two-field entry with nothing after the path is the ordinary form that
    exempts every line of that file, and the note is the only thing that made the
    first version inert.

  Given the security allowlist contains an entry whose file path is
    "docs/notes#1.md" — a path segment that legitimately contains the comment
    marker with no whitespace before it,
  And that file contains a high-entropy token the ENTROPY_HIGH rule reports,
  When the allowlist is loaded and the file is scanned,
  Then the finding IS suppressed and no warning is emitted,
  Because the signal that a note has been appended is a comment marker preceded
    by whitespace inside a field, not the marker alone — treating every marker as
    a note would make real paths unsuppressible.
