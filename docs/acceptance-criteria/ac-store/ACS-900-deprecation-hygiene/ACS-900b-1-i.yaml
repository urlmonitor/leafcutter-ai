title: "An internal hook error fails open and never hard-blocks the commit"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given the deprecation-hygiene hook encounters an unexpected internal error
    during execution (e.g. a staged AC YAML file has invalid YAML that raises a
    parse exception, the git command used to read the HEAD version fails, or an
    implemented_by path cannot be read),
  When the hook catches the exception,
  Then it exits with code 0 (fail-open per project convention),
  And the commit is NOT blocked by the deprecation-hygiene hook,
  And a diagnostic message is printed to stderr that names the hook and the
    nature of the error,
  And no block decision is emitted to stdout for that error.
