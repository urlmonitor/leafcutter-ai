created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500e.yaml
criteria: |
  Given the active gh CLI account has silently reverted to an Enterprise Managed
    User (EMU) account that cannot open pull requests,
  When the authoring workflow reaches the PR-creation step,
  Then it switches the active gh account to the account authorized to create the
    PR immediately before attempting creation,
  And if the CLI create path is still blocked, it creates the pull request via the
    REST API fallback,
  And the pull request is opened to main by one of these paths,
  And the workflow surfaces the resulting PR number and URL (per BO-1500d-1)
    rather than failing the delivery.
depends_on: [BO-1500e, BO-1500c-1]
doc_links:
  - path: templates/skills/build-single-ticket/SKILL.md
    relationship: models
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements: |
  Switch to the authorized account (e.g. `gh auth switch --user <acct>`) and verify
  with `gh auth status` before create/merge. On the EMU GraphQL block, fall back to
  the REST endpoint `gh api -X POST repos/<org>/<repo>/pulls`. Both paths are
  documented in CLAUDE.md Pre-Drive Checklist.
