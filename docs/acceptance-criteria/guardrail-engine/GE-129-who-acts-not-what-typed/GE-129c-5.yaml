criteria: |
  Given the behaviours of GE-129c-1, GE-129c-2, GE-129c-3 and GE-129c-4,
  When a reader opens the unattended-commit sequence diagram,
  Then it shows, for the fast lane, a ticket-supervisor drive and finalize-feature's closure step,
    the run dispatching the commit specialist, the specialist issuing the commit, the guard
    receiving the caller identity from the harness, the guard's go-ahead, and the audit record,
    And it shows the refused path: a non-specialist caller's commit refused by the guard and the
    run reporting the step as failed,
    And no message in the diagram carries a token or an environment setting as authorisation,
    And the existing fast lane sequence diagram agrees with it on the commit step.
