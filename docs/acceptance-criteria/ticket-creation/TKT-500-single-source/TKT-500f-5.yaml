assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Read the is_ticket_phase boolean for the AC's assigned_agent from config/agent_registry.json; treat a true value as eligible and a false value as ineligible for emission as a ticket phase agent."
  - "Apply the substitution in BOTH generators via a single shared helper so the two emission points cannot drift. Concretely, after the 2026-09-14/2026-09-22 decompositions: the AC-store generator's emission point is scripts/ac_store/_gtfa_agents_map.py and the goal path is scripts/ac_store/epic_tickets.py (scripts/goal_to_epic.py is a facade only). NOTE the precedent set by TKT-500f-6 in 4dcfd87c: the goal path already shells out to generate_ticket_from_ac.py as a subprocess, so it reaches a shared predicate through the SAME code — adding an import in epic_tickets.py would create a second entry point, which this constraint forbids. Verify which of the two shapes applies before writing a second call site."
  - "Substitution rule: choose llm-expert when the AC's work surface is agent/skill templates (templates/agents/*, templates/skills/*); choose python-coder otherwise. Both substitutes must themselves have is_ticket_phase: true in the registry."
  - "Emit the warning through the project logger at WARNING level; the message must include the original assigned_agent, the substitute, and the AC id. Wrap registry-file I/O per the project error handling policy."
delivers_to:
  agent: python-coder
  contract: "Generated ticket whose phase agent is guaranteed to be a registry entry with is_ticket_phase: true"
