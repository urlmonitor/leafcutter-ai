notes: |
  WHAT THIS CHILD OWNS. Point (c) of the guarantee in BP-1500d's notes: the record
  stays readable wherever the project is later opened, moved or copied. This is a
  distinct failure from BP-1500d-1's: a record can be filed correctly inside the
  receiving project, travel with it, and still be unreadable the moment the project
  moves, because its entries are keyed to where the producing package happened to
  sit on disk when it was written. The file arrives; the meaning does not.

  WHY THE READ-AT-ORIGIN CONTROL IS IN THE CRITERIA. A two-run move-and-fail pair
  cannot separate a working readability check from a relocation that broke the
  project for some unrelated reason. Reading the deliberately non-portable record at
  its original location -- where it must still read -- is what makes the red at the
  new location attributable to the record's form.

  SAME FAILURE FAMILY AS BP-016 / BP-017, one layer deeper: build output keyed to
  one machine's directory layout and useless anywhere else. The difference is that
  those broke loudly at the point of use, whereas this degrades into an unreadable
  record, which the checks that read it currently treat as nothing to do.

  UNREADABLE IS NOT THE SAME AS FALLEN BEHIND. This child says nothing about whether
  the install matches what the package now holds -- that is BP-1500c's guarantee and
  is not re-derived here. This is BP-1500c's prerequisite: there is nothing to
  compare against until a record can be read in the project being checked.

  ORDERING. Presupposes the record produced by BP-1500d-1. depends_on carries only
  the parent link, as the authoring request specified; the it-po should express the
  producer/consumer edge as expects_from BP-1500d-1.

  IT-PO RESPONSE, 2026-08-25. The expects_from edge on BP-1500d-1 is wired as asked,
  and it is a hard start-order constraint rather than a hint: this AC relocates an
  artifact -1 produces, so it cannot begin before -1 lands. It was not added to
  depends_on because the BA scoped that field to the parent link only; the contract
  carries the same fact in the field the it-po owns.

  THE HARNESS COMES FROM -1, NOT FROM BP-900h-1. The BA cited BP-900h-1 as prior art
  for the consumer-simulation install. It is an unstarted spec -- zero implementation
  anywhere in the workspace, no consumer-simulation job in ci.yml. BP-1500d-1 now
  constructs the harness and delivers it here. This AC must relocate that shared
  harness and must not stand up a second one.

  package_surface is deliberately NOT set: per ACS-100i-6 it means the AC registers an
  entry in a registry the build reads to decide what a consumer receives. This AC
  changes the form of an existing artifact and registers nothing.

  BA AMENDMENT, 2026-08-25 -- THE Then CLAUSE WAS MADE CONCRETE, THE SCOPE WAS NOT
  CHANGED. "Then the record reads there without being rebuilt" now names the artifact
  it was always about: "Then the record file written to disk inside that project by
  the build reads there without being rebuilt". The reason is mechanical and worth
  recording. declares_side_effect is DERIVED from this AC's own Then clause rather
  than authored by opinion, because it non-overridably routes the one phase agent that
  runs the real surface end-to-end and inspects the resulting tree -- which is exactly
  how this criterion insists its verdicts be reached. The customer-language phrasing
  described a durable file without naming one, so the derivation read false while the
  record declared true, and the schema check refuses that disagreement. Naming the file
  is the honest fix. Nothing about scope moved: this child still asserts READABILITY
  after relocation only, presence stays with BP-1500d-1, freshness stays with
  BP-1500c, the four-run read-at-origin control is intact, and every it-po field --
  including declares_side_effect: true -- is as the it-po left it.
