amended_by:
  - date: 2026-08-31
    agent: business-analyst
    reason: "Finding F2 — the prompt is the expensive kind, not the screen, and the original single-form criterion hid two cases with different costs and different endings. Verified: 463 records declare this craft, and only three of sixty registered crafts have an evaluation set; a model-consumed instruction's differential needs live model calls, is non-deterministic, and needs a credential. Three scenarios added: the deterministic-consumer case (cheap, repeatable, no credential), the model-only case (live call, cost stated in the run), and the model-only case that cannot be established here (refused up front, never finished on the load check alone), plus a clause requiring the two to be distinguishable in what the run reports. The measurement of how many of the 463 have a deterministic consumer is in progress and deliberately not blocking: it changes the size of each case, not the specification of either."
