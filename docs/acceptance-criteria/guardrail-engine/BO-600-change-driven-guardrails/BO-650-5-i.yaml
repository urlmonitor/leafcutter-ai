id: BO-650-5-i
title: "Architect's model tier follows the same complexity routing as all other agents"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given the architect agent is triggered for a ticket with estimated_complexity: M,
  When the guardrail engine routes the architect to a model tier,
  Then the architect runs on the faster model tier (Sonnet-class)
  And the routing logic is the SAME logic that routes python-coder, test-writer,
    and all other agents -- no special-case routing for the architect

  Given the architect agent is triggered for a ticket with estimated_complexity: H
    that has passed the complexity challenge gate,
  When the guardrail engine routes the architect to a model tier,
  Then the architect runs on the deeper-reasoning model tier (Opus-class)
  And this is the same tier assignment any other agent would receive for H complexity

  Given the architect is triggered at L0/L1 level where no estimated_complexity
    field exists yet (because L0/L1 ACs do not carry that field),
  When the guardrail engine determines the model tier for the architect,
  Then it defaults to M complexity (faster model tier) per the same default
    rule applied to all agents (BO-630-1-i)
