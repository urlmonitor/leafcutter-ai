id: FIN-100c-13
readiness: draft
priority: medium
components:
  - finalize
title: "Stale recovery worktree is reclaimed by the recovery path before it creates its own worktree"
level: L3
component: finalize
status: active
parent: FIN-100c-4
criteria: |
  Given a prior interrupted finalize run left a recovery worktree at the
    deterministic recovery path (the Step-0 baseline path suffixed with
    "-recovery")
  And a new finalize run reaches the null-baseline recovery attempt, which reuses
    that same deterministic recovery path
  When the recovery attempt prepares to create its temporary main-HEAD worktree
  Then it first reclaims any pre-existing worktree registered at that recovery
    path and deletes the leftover directory, before creating the new worktree
  And the reclaim is performed by the recovery path itself, not left to rely on
    the Step-0 stale-baseline glob incidentally matching the recovery path
  And the subsequent worktree creation therefore succeeds, rather than failing
    with a path-already-exists error that would be misreported as a checkout
    failure and trigger a false conservative halt (FIN-100c-9)
depends_on:
  - FIN-100c
  - FIN-100c-4
assigned_agent: "python-coder"
estimated_complexity: S
it_requirements: |
  - SURFACE: templates/workflows-js/finalize-feature.js — the recovery agent's
    Step A (~L793-798), immediately BEFORE `git -C "${WORKTREE_ROOT}" worktree
    add --detach "${recoveryWorktreePath}" origin/main`. The recovery path is
    deterministic (`${baselineTmpPath}-recovery`, ~L782) and is reused on resume.
  - SELF-RECLAIM BEFORE ADD: the recovery path must, as its own explicit step,
    reclaim any pre-existing worktree registered at recoveryWorktreePath and
    delete the leftover directory before the `git worktree add` — mirror Step 0's
    Step-A0 stale-worktree reclaim (~L438-444), e.g. `git -C "${WORKTREE_ROOT}"
    worktree remove "${recoveryWorktreePath}" --force 2>/dev/null || true` then
    `rm -rf "${recoveryWorktreePath}" 2>/dev/null || true`.
  - NO RELIANCE ON INCIDENTAL OVERLAP: the reclaim MUST be performed by the
    recovery path itself and must not depend on the Step-0 stale-baseline glob
    incidentally matching the -recovery path (that overlap is not guaranteed and
    is not a self-contained safeguard).
  - OUTCOME: after the self-reclaim, the subsequent `worktree add` succeeds on
    resume rather than failing with a path-already-exists error that Step A would
    return as {status: "checkout_failed"} and thereby trigger the FIN-100c-9
    conservative halt falsely.
  - ERROR HANDLING: the reclaim commands are best-effort (|| true) and must not
    themselves abort the recovery; any genuine add failure after a clean reclaim
    still routes to the existing checkout_failed fallback per the error-handling
    policy.
delivers_to: null
expects_from: null
test_spec:
  - name: test_recovery_reclaims_stale_recovery_worktree_before_add
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    description: "Behavioral (run_workflow_under_e2): the step-3-targeted-rerun agent prompt instructs a worktree remove/rm of ${recoveryWorktreePath} that precedes the `git worktree add` for that same path, so a pre-existing recovery worktree is reclaimed before creation."
  - name: test_recovery_reclaim_is_self_contained_not_step0_glob
    target_dir: unit_tests/workflows/
    framework: pytest
    type: unit
    description: "Behavioral/structural: the reclaim of the -recovery path is issued within the recovery path's own Step A and does not depend on the Step-0 stale-baseline glob matching the recovery path."
