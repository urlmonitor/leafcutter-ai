criteria: |
  Given a component entry has an exposed_interfaces element with
    path: "config/nonexistent_schema.json",
  When the validator checks path reachability,
  Then the validator emits a warning (not a blocking error) that the path
    is unreachable on disk,
  And the entry is still accepted (the contract may describe a future file
    or a runtime artifact not committed to the repo).
  And the warning includes the component ID, interface name, and the
    unreachable path value.
