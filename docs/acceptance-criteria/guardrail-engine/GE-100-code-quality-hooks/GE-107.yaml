it_requirements: "Two narrow fixes in the canonical template templates/commit-guardian/check_exception_handling.py (the scripts/commit_guardian/ copy is gitignored build output; rebuild via build.py to sync). (1) In _call_matches_io_boundary, the cursor boundary currently matches .execute/.executemany/.callproc on ANY ast.Name receiver, flagging unrelated objects (Command, workflow, query-builder, concurrent.futures executor). Narrow the receiver match to a recognised set of cursor identifiers (e.g. cursor, cur, crsr, db_cursor, _cursor) so non-cursor receivers are not flagged, while keeping true cursor.execute detection. (2) In main(), the analyse_file call is wrapped only in except SyntaxError; path.read_text in analyse_file raises OSError (IsADirectoryError, PermissionError) on unreadable paths, producing an uncaught traceback and exit 1. Add except OSError alongside the existing except SyntaxError, print a 'file not readable' skip message to stderr, and continue — mirroring check_placeholder_defaults' OSError handling and bringing the hook into compliance with its own Error Handling Policy Rule 1. Symptom fix scope only; the broad log-name heuristic and subprocess-boundary gaps are pre-existing and out of scope."
