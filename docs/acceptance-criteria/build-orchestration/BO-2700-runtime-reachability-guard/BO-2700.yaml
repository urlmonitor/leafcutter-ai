roadmap_phase: phase_1
criteria: |
  Nothing counts as delivered until it is genuinely wired into how the product runs.

  It is still possible to finish work, pass every check, and ship something that
  nothing ever calls — a capability that exists on paper but is never reached when
  a person actually uses the product. This goal closes that gap: proof of completion
  must come from running the work the way it is really used, and every capability
  the product advertises must be genuinely connected to the automation that runs it,
  in both directions. Anything stranded is caught the moment it is introduced, with
  a clear explanation of what is unreachable, so a stranded feature can never quietly
  reach customers.

  This is the third honesty axis of proof-of-done, alongside BO-2500a ("a real test
  passes") and BO-2500c ("the test uses real data"): the test must also be reached
  through the real caller. It is the mechanical, gate-level counterpart to the
  ticket-level and epic-level phantom-done prevention in BP-1100.
