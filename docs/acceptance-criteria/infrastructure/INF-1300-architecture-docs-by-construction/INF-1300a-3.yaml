test_rationale: >-
  Acceptance and fidelity are different properties and no check observes the second: the
  project's checks never see the request that produced the document, so a valid document
  describing the wrong component, at the wrong tier, bearing a date nobody supplied passes
  all of them. Only a comparison against the request can catch that, and a single-run
  comparison still cannot: a producer that writes a constant, or derives a value from
  something other than the input it claims, satisfies every value-by-value assertion on one
  run. The movement pair is therefore irreplaceable and is run once per input rather than
  once overall. The placeholder clause needs an executed check rather than an inspection
  because its harm is measured at the hook: check_doc_frontmatter blocks on a path-valued
  entry that does not exist, so a helpful sample path inverts this tree's promise — while
  for the non-path-valued `description:` field no hook can distinguish a real value from a
  constant stub, which is why that descriptor routes through the movement pair instead.
