notes: |
  Documentation AC produced for the reference-doc trigger on ACD-1800a. Documents the
  behaviour authored in ACD-1800a-1 / ACD-1800a-2.

  IT-PO enrichment (2026-08-12): test_required: false (docs surface, no executable
  behaviour); serves as the normative spec-parity source for the schema + skill.

  2026-08-31 (BA). Being the normative spec-parity source is exactly why this record
  had to change. A wrong list here does not stay here -- the schema and the signoff
  skill are specified to mirror it, so it propagates into every surface and each copy
  is then correct against the wrong original. The fix is to make this section a POINTER
  to the store's existing change-target vocabulary rather than a second definition of
  the same thing. Note that this does not weaken spec-parity: the schema and the skill
  still mirror one definition, they just mirror the one that already exists and is
  already carried by the overwhelming majority of records, instead of a list authored
  here. See amended_by, and the stale it_requirements entry flagged there.
