notes: |
  AUTHORED 2026-09-08 by BA v3, stage 2 of PO -> BA -> IT-PO. Decomposes ACD-400d.

  RULED 2026-09-08 BY BrainCandy: KEEP THE SHIPPED BEHAVIOUR. Ruling (a) of the three
  named below. The question recorded here is now CLOSED, and this AC is the written
  account of a behaviour that is chosen rather than merely observed. Nothing in the
  criteria changes — they already described what ships — but their standing does: an
  implementation that adds case-insensitive matching, whitespace trimming, a warning on
  an unrecognised value, or vocabulary validation on this path now contradicts a
  decision rather than pre-empting an undecided one. The it_requirement forbidding those
  four additions stands unamended and is the enforcement of this ruling.

  The reasoning below is kept verbatim rather than deleted, because a ruling that
  discards the argument it ruled on cannot be revisited by anyone who was not present
  for it. Read it as the case that was considered and decided, not as a live question.

  ORIGINAL FRAMING, AS ESCALATED — OPEN PRODUCT QUESTION, WRITTEN AGAINST OBSERVED
  BEHAVIOUR, NOT AGAINST A POLICY.

    An author who means "critical" and types "Critical" gets work that sorts BELOW
    everything marked low. The mistake is silent in both directions: the queue reports
    nothing, and the offer still contains the work, so nothing looks wrong. The failure
    is maximally misleading precisely because it inverts the author's intent — the one
    value a typo is most likely to hit is the one where being demoted matters most.

    THE CRITERIA ABOVE STATE CURRENT BEHAVIOUR, and they state it explicitly rather than
    leaving it to fall out of arithmetic, so that whichever way this is ruled the record
    says what was chosen. Three answers are coherent and this AC endorses none:
      (a) KEEP IT. Unrecognised means unranked; sinking to the bottom is a safe default
          and the work is never lost. Amend nothing — this AC already says so.
      (b) REJECT IT LOUDLY. An unreadable urgency is an authoring error and should be
          reported rather than absorbed. Amend this AC's third and fifth clauses; note
          that a loud rejection is a change to what the queue OUTPUTS and would need to
          be reconciled with the ACS-1100-shaped follow-up flagged in ACD-400c's notes.
      (c) MATCH LENIENTLY. Treat "Critical" as critical by ignoring capitalisation and
          surrounding whitespace. Amend the fourth clause. Note this would make the
          urgency field's matching rule differ from the approval field's, which is an
          exact match today (ACD-400c-1-ii) — so ruling (c) here should be ruled on both
          fields together or the inconsistency simply moves.

    UNTIL IT IS RULED, this AC is the honest record: it says what the queue does, and it
    fails if the queue quietly starts doing something else.

  WHY THE TWO UNRECOGNISED VALUES ARE BOTH IN THE FIXTURE. One is nonsense and one is a
  near miss. Together they make the fourth clause testable and they make the product
  question concrete: nobody types "urgent" by accident in a store whose vocabulary is
  fixed, but "Critical" is exactly what a careful person writes when nobody told them the
  wording is case-sensitive.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L2.
