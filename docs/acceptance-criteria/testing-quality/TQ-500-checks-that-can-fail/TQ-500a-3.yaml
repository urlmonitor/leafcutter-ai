id: TQ-500a-3
components:
  - testing_quality
  - build_orchestration
title: "The substitute names the alteration precisely and confirms the behaviour was put back"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a piece of work whose writer takes the substitute evidence — alter the
      guarded behaviour on purpose, re-run the tests, then put the behaviour back,
  When that piece of work is handed on,
  Then its hand-off record names the alteration specifically enough for another
    person to apply the same alteration without asking the writer: which behaviour
    was changed, and what it was changed to,
    And the record states that the alteration was reverted, and that the tests were
      re-run after the revert and returned to the outcomes they held before the
      alteration was applied,
    And a record naming an alteration but stating nothing about the revert is
      distinguishable from one stating both,
    And a record claiming the substitute evidence while naming no alteration at all
      is distinguishable from one that names it.
depends_on:
  - TQ-500a
doc_links:
