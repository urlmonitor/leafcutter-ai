title: "Every eval set contains at least one negative / failure case"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given an eval set for an agent,
  When its rows are validated for completeness,
  Then the set contains at least one negative / failure case — an input the agent
    is expected to reject, refuse, or flag as an error rather than produce a
    well-formed artifact for,
  And the negative case's expected outcome asserts that the agent handles the bad
    input correctly (e.g. declines to duplicate an existing dataset, reports an
    unresolved reference, or returns none for a request that needs no artifact),
  And an eval set with no negative case is reported as an incomplete set rather
    than passing.
depends_on:
  - TQ-200a
