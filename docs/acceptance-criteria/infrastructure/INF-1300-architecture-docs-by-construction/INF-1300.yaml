title: "Writing an architecture document costs you the thinking, not the conventions"
component: infrastructure
level: L0
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Start from a correct document; spend your effort on what it says.

  When you set out to document a part of this system, you are handed a document
  that already satisfies everything the project asks of a document of that kind:
  correctly named, filed where such documents live, carrying the shared
  explanatory key, and already shaped for the kind of picture you are about to
  draw. What is left for you is the only part that ever needed a person -- saying
  what is true about the system. The project's conventions stop being a body of
  knowledge each author has to hold and re-apply by hand, and the project's own
  instruction to work this way stops being an instruction that cannot be
  followed.
