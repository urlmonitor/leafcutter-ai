notes: |
  Negative acceptance scenario for the web-app build/type-check gate. The
  deliberately type-erroring change is transient/scoped to the verification (a
  throwaway pull request or a temporary edit removed before merge) so it does not
  become a standing red — this AC verifies the GATE blocks, it does not ship a
  broken web app. Merge-blocking is provided by the required-status-check wiring
  covered by BP-1400a-4.
