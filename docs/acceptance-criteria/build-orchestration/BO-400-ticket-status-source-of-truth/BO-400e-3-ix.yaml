test_required: true
test_spec:
  - name: test_setup_ticket_records_the_ticket_against_the_branch
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Run the real setup-ticket against a scratch clone (bootstrap stubbed only where it would spawn build.py); `git config --get branch.feature/close-x.leafcutterTicket` returns tickets/00_inbox/TICKET-20261015-Close_X.md, and `git -C <worktree> status --porcelain` shows no change caused by the record."
  - name: test_record_round_trips_into_the_derivation_under_a_branch_override
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "setup-ticket with --branch my-fix, commit a sign-off edit to the ticket on feature/my-fix, then run the real finalize_closable_set.py derive: built_for_ticket is the setup path and the set is that ticket plus its source AC."
  - name: test_same_slug_different_ticket_is_refused_and_record_kept
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "Set up TICKET-20261001-Close_X.md, then TICKET-20261015-Close_X.md (same slug); the second exits non-zero naming feature/close-x and the first ticket, the record is unchanged, and no second worktree exists."
    must_catch:
      - "reuse the existing worktree for whatever ticket maps to the same slug"
      - "overwrite the branch record with the newest ticket"
  - name: test_repeat_setup_is_idempotent
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Running setup-ticket twice for the same ticket leaves exactly one value under the key (`git config --get-all` returns one line)."
  - name: test_ticketless_subcommands_record_nothing
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "create-only, create-fastlane-worktree and create-ac-worktree leave no leafcutterTicket key on the branch they create."
  - name: test_pre_existing_branch_without_record_is_not_guessed
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A branch feature/close-x made with plain git worktree add (no record) that changed TICKET-20261015-Close_X.md: derive returns undeterminable / built_for_unknown with empty records, although the slug would reverse to that ticket."
    must_catch:
      - "reverse the feature/<slug> branch name into a ticket path"
test_rationale: >-
  The record is a contract between two programs written at different times, so the load-bearing
  test is the seam test: the real setup command writes it and the real derivation reads it, under
  the --branch override that breaks every name-based approach. The pre-existing-branch test uses a
  branch whose slug WOULD reverse to the right ticket, so a name-parsing fallback cannot pass it by
  luck. The collision test covers the lossy-slug defect the BA identified, where two tickets share
  one branch name.
