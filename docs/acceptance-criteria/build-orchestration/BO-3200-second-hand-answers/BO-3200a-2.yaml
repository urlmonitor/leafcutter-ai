id: BO-3200a-2
title: "Every path that needs a project fact still works with specialists unavailable, and one that does not is named"
component: build-orchestration
components:
  - build_orchestration
  - agent_registry
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given every path through which a build resolves a fact about the project that it then
    branches on,
  When each is exercised in an environment where dispatching a specialist is impossible,
  Then every one of them obtains its value and proceeds.

  Given one such path restored to obtaining its fact by dispatching a specialist, while every
    other path reads directly,
  When all paths are exercised in that same environment,
  Then the restored path is reported as depending on a relayed fact and is named,
    And the fact that every other path succeeds does not suppress the report.

  Given a path that dispatches a specialist for a judgement rather than for a fact — the value
    it returns being an opinion the build records rather than a value it branches on,
  When the paths are exercised,
  Then that path is not reported, so asking a specialist for judgement remains available.
