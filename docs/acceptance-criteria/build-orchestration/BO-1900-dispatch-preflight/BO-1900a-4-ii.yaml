test_rationale: |
  A dead planner and a finished ticket are the same value by the time the drive reads
  them -- an empty list -- so no test that inspects the drive's internal phase list can
  tell them apart. Only a run in which the reply itself is controlled, asserted against
  what the run dispatched and what it left on disk, distinguishes the two. Every
  descriptor is therefore behavioral.

  The omitted-list descriptor is the one that decides whether the fix is real. A suite
  in which every failed planner returns an explicit failure and every successful one
  returns a full list can never separate a fail-open check from a fail-closed one: both
  pass, for two reasons that cannot be told apart. Only a reply that says nothing
  either way separates them, which is why that descriptor must first assert the reply
  really did omit its list.

  The control descriptor is not optional. Holding back on an empty list is a one-line
  change that passes every negative case here and strands every resumed drive -- a
  failure that is slower to notice than the one being fixed and far more disruptive.

  The done-record descriptor is included even though BO-400a-2-iv covers the completion
  decision directly, because the two records must hold independently: closing only one
  leaves the defect reachable by the other route, and a test that proves the route is
  closed is cheaper than an argument that it is.
