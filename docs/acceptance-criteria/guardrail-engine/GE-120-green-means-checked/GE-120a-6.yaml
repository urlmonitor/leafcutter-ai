id: GE-120a-6
title: "A check that could not be started at all names what could not be started, in the reader's own words, and the commit does not complete"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a registered check whose declared way of being started names a program that
    cannot be started at all — the named program is absent from the location it is
    named at, or it is present and the working environment will not run it,
  And a change is staged that every registered check would otherwise accept,
  When the author performs an ordinary commit — no extra command, no extra flag, and
    nothing invoked by hand,
  Then the commit does not complete,
  And what the attempt reports names the check that could not be started and names
    the program that could not be started,
  And it reports that in the reader's own terms: a reader who sees only what the
    attempt printed can tell that this check never ran, and what could not be started,
    without being handed the machinery's own unhandled crash report and without having
    to read a call stack to find either fact,
  And nothing in what the attempt reports presents the staged change as having been
    found acceptable by the check that never started,
  And given the same unstartable condition arranged for a different registered check
    instead,
  When the author performs an ordinary commit,
  Then the same outcome is produced and it names that other check — the guarantee is a
    property of the way checks are started, not of any one check,
  And given instead the identical staged change with every registered check's declared
    way of being started able to start,
  When the author performs an ordinary commit,
  Then the commit completes, and nothing about a failure to start is reported at all —
    no warning, no note, and no line naming any check.
