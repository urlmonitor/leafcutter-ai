notes: |
  Refinement of the AC-driven build model (2026-08-11, origin_agent: BrainCandy).
  This L0 captures two paired concepts that reframe what a "unit of work" is:
    CONCEPT A (ACD-1800a, ACD-1800b) -- the AC is the unit of work (a mini-ticket):
      it enumerates its own deliverables as an explicit checklist and each
      deliverable is signed off ON THE AC by the responsible agent; the AC is done
      only when every deliverable is signed off. This moves phase sign-offs off the
      ticket body and onto the AC.
    CONCEPT B (ACD-1800c) -- the ticket is a grouping/scoping container, not the
      unit of work: it groups a coherent set of ACs into a valuable feature, carries
      no per-phase sign-offs, and is done when its grouped ACs are done.
  RELATIONSHIP TO EXISTING ACs:
    - REFINES/COMPLETES the thin-ticket direction of ACD-1600a (ticket references
      AC, no copy) and ACD-1600b (agents pull the spec from the store). ACD-1800 is
      the deeper reframing that those thin-ticket L1s are a symptom of; complementary,
      not overlapping -- ACD-1600 governs single-source spec quality, ACD-1800
      governs the unit-of-work grain and done-accounting.
    - REPLACES the premise of ACD-400b (generator produces a fully WIRED ticket with
      a per-ticket agents map + sign-offs that an agent completes). See ACD-1800c
      (supersession intent recorded) and ACD-1800b (supersedes ACD-400b-4's
      sign-offs-in-ticket clause). ACD-400b is NOT edited here -- governance handles
      the amend/supersede step separately.
    - CARRIES FORWARD the still-valid ACD-400b-2 (implemented_by back-reference ->
      ACD-1800d) and ACD-400b-3 (idempotency / no duplicates -> ACD-1800e), now
      attached to AC-level work derivation rather than ticket wiring. Those two old
      L2s remain active; the new L1s reframe them, they do not supersede them.
  COMPONENT NOTE: the sign-off-recording mechanism (Concept A) touches the signoff
  skill / supervisor sign-off machinery, which may also implicate `infrastructure`
  or the build-orchestration surface -- kept in ac-driven-dev to keep the goal
  cohesive; flagged for IT-PO / the user.
