work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the test-writing side works under a rule that applies to every piece of
      work: decide whether the work sits at a boundary between two layers and, if
      it does, write a test that feeds the real producer's real output into the
      real consumer and asserts what the consumer observably does,
  When the test-writing side hands a piece of work on,
  Then its hand-off record carries exactly one answer to that rule for that piece
    of work — either the seam it covered, naming the producing side and the
    consuming side, or a statement that no seam applies together with the reason
    none applies,
    And the answer sits in the same hand-off record that already carries the
      writer's other machine-checkable statements, not in prose a reader has to
      interpret,
    And a hand-off record carrying no answer to the rule at all is distinguishable
      from one that answered it,
    And a second piece of work handed on in the same run carries its own single
      answer, so the answers are per piece of work and not per run.
