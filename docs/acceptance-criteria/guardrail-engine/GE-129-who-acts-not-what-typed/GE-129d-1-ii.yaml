id: GE-129d-1-ii
title: "A session launched under the commit specialist's name is still your own session and is asked like one"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, a staged change, and a top-level session launched with
    --agent set to the commit specialist's name, whose tool calls carry agent_type naming the
    commit specialist and no agent_id,
  When the session issues `git commit -m "x"` in the default interactive mode,
  Then the permission prompt is shown to the person and the command does not run before the person
    answers, exactly as for a session launched without --agent.

  Given the same launch in each mode GE-129a-1 found to reach no person,
  When the session issues the same command,
  Then the commit is refused as in GE-129d-2 and no commit is added to the history.
