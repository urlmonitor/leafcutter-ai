notes: |
  A REGRESSION INTRODUCED BY REMEDIATION, and the third in this batch. The same
  status-inversion the per-ticket fix in this very diff corrected one level down --
  a payload that reports success while its own detail says the work is not complete --
  was reintroduced one level up, in code from the same change. The per-ticket lesson
  was learned and applied per ticket; the epic wrapper was not revisited.

  THE OBSERVED SHAPE. Both epic completion returns fix the overall outcome value as a
  success before merging the re-check's fields in beside it. Those fields can carry a
  not-complete verdict and an unverified-set marker, and the message is already
  branched to say the epic is NOT complete. The result is one payload asserting three
  things, two of which contradict the first. Two conditions reach it today: work added
  to the epic after planning and never built, and a work set that could not be
  re-read at completion time -- which is to say, exactly the two conditions
  BO-300a-5 and BO-300a-5-i were authored to make visible. The information they add is
  correct and present, and the field a machine reads contradicts it.

  WHO IS MISLED, AND WHEN THAT CHANGES. Today, only the human reading the drive's
  output -- and the prose is unambiguous, so a careful reader is safe. The moment any
  script, gate or wrapper routes on the outcome value, an unfinished epic reads as a
  finished one, and it does so on precisely the runs where something went wrong. The
  cost of fixing it now is one value; the cost of fixing it after a consumer exists is
  the consumer's own failure mode plus this one.

  WHY IT IS EPIC-ONLY. The single-ticket driver has no epic path and no epic completion
  return, so there is no counterpart to correct in the twin. That is recorded here
  explicitly because every other AC in this batch requires the change to land in both
  drivers, and an implementer following that pattern here would be looking for code
  that does not exist.
