title: "IT PO v3 queries the knowledge graph during S1 to discover agent capabilities and architecture relationships"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the it-po-v3 agent has reached S1 (Knowledge Acquisition)
    and has read the L2/L3 AC files it was given for enrichment,
  When the agent executes its knowledge-acquisition steps,
  Then it invokes knowledge-query with a surface filter of "agents" to list
    all registered agents and their descriptions,
  And it invokes knowledge-query with a surface filter of "skills" to list
    all registered skills and their descriptions,
  And it invokes knowledge-query with the component name to discover
    architecture docs, ADRs, and hook registrations related to the component,
  And it uses the returned node list to inform:
    (a) assigned_agent selection — matching AC behaviors to agent capabilities
        discovered in the graph rather than relying solely on agent_registry.json,
    (b) delivers_to/expects_from contract design — identifying existing
        inter-agent contracts in sibling ACs that the new contracts must align with,
    (c) doc_links population — adding architecture docs and ADRs discovered
        via the graph that the implementing agent will need to read,
  And the agent does not skip the query even if the S1 registry reads
    return sufficient context on their own.
depends_on: [ACD-300e, ACD-300e-1]
