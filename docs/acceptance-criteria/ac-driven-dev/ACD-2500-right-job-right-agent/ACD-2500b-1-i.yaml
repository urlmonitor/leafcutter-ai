id: ACD-2500b-1-i
components:
  - ac_driven_dev
  - testing_quality
readiness: approved
priority: high
title: "An outcome clause with no test-intent entry, or an entry for a clause that no longer exists, is reported"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given a record whose criteria carry 4 outcome clauses and whose test intent has entries
    for only 3 of them,
  When the requirement rule check runs,
  Then one finding names the record and quotes the clause that has no entry,
  And when a test-intent entry names a clause whose text no longer appears in the criteria,
    a finding reports that entry as stale,
  And after a fifth outcome clause is added to the criteria, the next run reports the
    fifth clause as having no entry,
  And a record whose every outcome clause has exactly one entry produces no finding for
    this rule.
depends_on:
  - ACD-2500b-1
  - ACD-2500a-1
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
- Delivers the schema registration of test_intent in config/ac_store_schema.json (closed items, all three
  keys required) and the field row in docs/reference/ac-schema.md, in the same change.
- Outcome clauses are identified by the same Then/And clause splitter the ticket generator uses for its
  per-clause fallback; no second clause parser.
- The clause-matching rule (exact or whitespace-normalised) is stated once in docs/reference/ac-schema.md
  and applied identically.
- Reports through the ACD-2500a-1 contract under rule family 'test intent coverage'; findings are 'needs
  a decision' and are never repaired.
- Evaluates only records carrying test_intent; legacy records (test_spec, no test_intent) are not evaluated
  by this family (ACD-2500b-3).
delivers_to:
  agent: llm-expert
  contract: 'test_intent schema property: test_intent: list of {clause: str (the outcome clause text,
    verbatim from criteria), needs_test: bool, reason: str (one sentence)}; exactly one entry per Then/And
    outcome clause; no test names, directories, frameworks, types, angles or strategy.'
expects_from:
  ac_id: ACD-2500a-1
  contract: 'Requirement rule-check report: JSON on stdout, exit 0 iff verdict is passed. Shape: {verdict:
    ''passed''|''failed'', location: str (the path given, repo-root-relative POSIX), records_checked:
    int, findings: [{file: str (repo-root-relative POSIX), record_id: str|null (null only when the file
    could not be read), rule_family: str (human family name, e.g. ''producer/consumer contract symmetry''),
    disposition: ''fixed''|''needs a decision''|''failed''|''not evaluated'', message: str, line: int|null,
    detail: object|null}]}. Findings sorted by file then rule_family; at most one finding per (file, record_id,
    rule_family, subject).'
test_spec:
- name: test_clause_without_intent_entry_reported_with_quote
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: 4 clauses and 3 entries yields one finding naming the record and quoting the missing clause.
- name: test_stale_intent_entry_reported
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: An entry whose clause text no longer appears in criteria is reported stale.
- name: test_added_fifth_clause_reported_next_run
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: After a fifth clause is added, the next run reports it as having no entry.
  angle: boundary
- name: test_full_coverage_no_finding
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: A record with exactly one entry per clause produces no finding for this family.
- name: test_schema_accepts_intent_and_rejects_unknown_key
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: config/ac_store_schema.json accepts a well-formed test_intent and rejects an item with
    an undeclared key.
  angle: real_artifact
origin_agent: business-analyst
created: 2026-09-25
amended_by:
- reason: it-po-technical-enrichment
  date: '2026-09-25'
  by: it-po
superseded_by: null
covered_by: []
implemented_by: []
change_target: code
risk_surface: contract_boundary
notes: |
  Why this is a check and not planner prose: a silently skipped clause becomes "no test
  needed" by omission, which is exactly the untested-Then gap the test contract exists
  to close. Reports through the ACD-2500a-1 finding contract.
