notes: |
  SITES 3 4 AND 5 OF 5 -- the three the known issues never named. Verified by the
  PO on 2026-08-25 in templates/workflows-js/plan-feature.js: the pause store is
  read at 1552, written at 1625 and read back at 1642, all through a cwd-relative
  `{{config.output_root}}/scripts/pause_store.py`.

  WHY THIS IS LOAD-BEARING FOR ANOTHER L1, not housekeeping. ACD-2100c replaces a
  destructive default with "pause instead of discard". A pause that cannot be
  written is not a pause -- it degrades to `pause_persist_failed`, and the run is
  back to losing work, from exactly the working directory where the original
  failure was observed. Closing only the two sites named in the known issues leaves
  ACD-2100c half-broken and its evidence unfalsifiable.

  THE SECOND AND FOURTH THEN CLAUSES ARE THE ANTI-PHANTOM PAIR. A writer that
  reports success while writing nowhere, or that writes a record under the caller's
  working directory where the resuming run will never look, passes any test that
  only checks the return value. Assert the file's location on disk, assert the
  absence of a stray record beside the caller, and assert that the report matches
  what is actually there.

  READ-BACK FROM A DIFFERENT DIRECTORY IS THE POINT. Writing and reading from the
  same working directory passes even when both resolve to the wrong place. The
  resume in ACD-2100c-3 is a separate process started later, quite possibly from
  the project root rather than the worktree, so the record has to be findable from
  either.

  DO NOT AUTHOR OVER: two commits on worktrees/pf-gate-fix (c6087fae, 5a3eae6d) add
  pause-persist verification and fix dropped `edit` feedback. They address the
  verification step, not the path resolution underneath it. Assume they land.

  2026-08-25 (it-po): this is the one cross-L1 delivery in the tree that the build
  sequencer can actually see -- ACD-2100c-2 already carries ACD-2100a-4 in its
  depends_on, so the expects_from edge on that side has a depends_on mirror and will
  not be scheduled out of order (KI-ACD-015). The pf-gate-fix commits harden the
  verification step; if they land first, the fourth Then clause here is partly served
  and the remaining work is the resolution underneath it. That does not make this
  record smaller -- the verification is only honest once it is verifying the right
  location.
