it_requirements:
  - "PROMPT-never-fabricate is the safety floor for autofix: multi-candidate match => present candidates and insert only after selection; no match => report inability and ask the developer to supply the value; no single confident contextual AC => ask the developer for the AC. Never invent a component name or AC id."
  - "Given the GE-117e-1 component-inference PREREQUISITE (components.json has no directory_patterns; index.yaml patterns are a different id namespace), the module-component autofix's DEFAULT path today is the no-confident-inference PROMPT specified here — i.e. until a components.json pattern-inference lands, the module-component branch always reaches this prompt behavior rather than the GE-117e-1 auto-insert branch."
  - "AC-ref prompt-on-ambiguity is independent of that prerequisite and applies whenever commit context does not yield a single resolvable AC."
  - "Edit templates/commit-guardian/ source AND scripts/commit_guardian/ deployed copy together; verify via build.py round-trip (ADR-001)."
