criteria: |
  Given a build for an UNSUPPORTED Claude Code runtime (one that cannot execute
    the deterministic workflow scripts),
  When build.py deploys the primary delivery command set,
  Then the deployed body for each of build-feature, create-ticket, and
    finalize-feature is the prose fallback (from templates/workflows/<name>.md),
  And the workflow-invoking command body is NOT the deployed default on that
    unsupported runtime.
