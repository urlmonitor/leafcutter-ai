id: AR-200b-1
title: "An agent template that names a mutating tool as the way to do a mandatory step declares that tool"
component: agent-registry
components:
  - agent_registry
  - ac_store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the set of agent templates the build can dispatch,
    And a template whose body instructs its agent to use a named state-mutating
      tool to carry out a step the template marks mandatory,
  When each such template's declared tools are compared against the tools its own
    body instructs it to use,
  Then every template declares each mutating tool its body instructs it to use,
    And a template that instructs a tool it does not declare is reported, naming
      the template, the tool, and the tools it does declare,
    And the comparison derives BOTH sides from the templates themselves, so a
      newly added template with the same mismatch is reported without anyone
      editing the check,
    And prose that merely discusses the underlying action -- "do not edit the
      file" -- is not read as an instruction to use the tool of that name, so the
      check does not flag every template in the registry,
  So an instruction naming the safe route is one the agent can actually follow,
    rather than one it silently substitutes a riskier route for.
depends_on:
  - AR-200b
