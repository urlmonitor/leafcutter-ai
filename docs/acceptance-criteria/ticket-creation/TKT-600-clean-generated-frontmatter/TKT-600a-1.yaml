amended_by:
- reason: criteria-narrowed-to-what-is-mechanically-decidable
  date: '2026-09-01'
  by: safety-security-expert
  entry: 'CRITERIA CHANGED. The files_touched clause is restated as a filesystem
    question ("is this path an existing FILE?") instead of an intent question ("is
    this path illustrative?"). depends_on clauses, title, level, test_spec and
    priority are unchanged.

    WHY: as written, this AC contradicted TKT-500f-8-i, which is readiness: approved,
    work_status: done, priority high, and whose criteria require the opposite —
    "Then the generated ticket''s files_touched contains scripts/goal_to_epic.py (the
    source path extracted from the prose bullet)". Both cannot hold unless a real
    surface named in prose can be told from an illustrative one, and that distinction
    is only available in the English phrasing.

    Two attempts confirmed it is not available there. A nine-pattern cue blocklist
    (recorded below) fired on no cue in the real failing bullet and silently dropped
    real surfaces elsewhere. Dropping prose harvesting altogether made this AC pass
    and falsified TKT-500f-8-i, turning its covering test red; the proposed remedy at
    the time was to retire that test, which would have left an approved AC claiming
    done for behaviour the code no longer had — phantom-done produced by the fix for
    a phantom-done defect.

    WHAT THE NEW WORDING BUYS, measured 2026-09-01 against the shipped function:

      real GE-123a bullet (three bare directories)  -> [scan_secrets.py]   FIXED
      "Modify scripts/goal_to_epic.py to ..."       -> [goal_to_epic.py]   TKT-500f-8-i intact
      "a path like src/foo.py"  (does not exist)    -> []                  excluded

    WHAT IT GIVES UP, stated rather than hidden: an illustrative path that BOTH has a
    file extension AND happens to exist is still harvested — e.g. a bullet reading
    "Do not edit templates/skills/security-scanner/SKILL.md here; it is context only."
    still yields that file. Separating that case needs authorial intent read out of
    prose. The old criteria demanded it; nothing delivered it in two attempts, and a
    false exclusion (silently dropping a real edit surface) is the worse of the two
    errors. If that case is later judged worth solving, it belongs in its own AC with
    a mechanism that is not phrase-matching — not as an unmet clause here.

    The one test asserting the given-up case is retained and marked xfail(strict)
    citing this entry, rather than deleted — so the gap stays visible in test output,
    and so that if some later change does start excluding it, the strict marker turns
    the run red and forces this note to be revisited.'
- reason: reopened-phantom-done
  date: '2026-08-31'
  by: safety-security-expert
  entry: 'REOPENED. work_status done -> todo. criteria, title, level, depends_on,
    it_requirements and test_spec are all UNCHANGED — this record still asks for exactly
    what it asked for, and it is reopened because that has not been delivered, not because
    the requirement moved. covered_by gains the four tests that were already tagged
    "# covers: TKT-600a-1" but never linked.

    HALF OF THIS AC WAS NEVER IMPLEMENTED, AND ITS TEST CANNOT DETECT THAT. The
    files_touched half is unfixed: _build_files_touched still harvests every slash-bearing
    token out of prose it_requirements. Measured directly against the shipped function on
    2026-08-31:

      the test fixture (src/foo.py, deploy/foo.py — do NOT exist on disk)  -> []
      the same shape with paths that DO exist  -> [docs/acceptance-criteria,
                                                   docs/retrospectives, templates/skills]
      "Do not edit templates/skills/security-scanner/SKILL.md here; it is context only."
                                              -> [templates/skills/security-scanner/SKILL.md]

    The four tagged tests pass. What removes the fixture paths is the ON-DISK EXISTENCE
    GATE, not the restriction this AC asks for — so the test passes identically on unfixed
    code and is vacuous. The last line is the sharpest: an it_requirement written to say
    "this file is context, do not edit it" makes that file the declared edit surface.

    THE CONSEQUENCE WAS OBSERVED, NOT PREDICTED. The unfixed extractor produced the
    surfaces for EPIC-SuppressionNarrowsNeverDisables: 10 of 27 tickets unusable — 4 empty,
    3 carrying only bare directories, 1 mixed, and 2 pointed at
    docs/known-issues/commit-guardian.md, a live document, as the file to modify. The
    /build-feature drive was stopped mid-run before any coder phase executed.

    THE depends_on HALF IS DIFFERENT AND SHOULD NOT BE RE-DONE BLINDLY. Its two tests are
    sound and generate_ticket_from_ac is correct in isolation. The dangling references seen
    in the epic come from goal_to_epic renaming files to their NN_ prefix AFTER depends_on
    is written — filed as KI-ACD-018, a seam this AC does not own. Whoever picks this up
    should re-verify rather than assume both halves are broken.

    WHAT CLOSING THIS NOW REQUIRES, beyond the original criteria: the files_touched test
    must use fixture paths that EXIST, so the existence gate cannot pass it by proxy, and
    the fix must be mutation-proved — reverting it must turn the test red. Recorded as
    KI-TQ-010 occurrence 2 and as the second occurrence of KI-ACD-023.'
