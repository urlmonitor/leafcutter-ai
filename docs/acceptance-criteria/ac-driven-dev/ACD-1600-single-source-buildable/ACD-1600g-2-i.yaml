criteria: |
  Given a feature that bundles two requirements,
  And the first requirement excludes the whole build-orchestration directory,
  And the second requirement names one single file inside that directory as part
    of the surface it changes,
  When the boundary of the bundle as a whole is computed,
  Then the one file the second requirement changes is not in the bundle's
    boundary,
  And a sibling file in the same directory that no member changes remains in the
    bundle's boundary,
  And changing that one file during the build is not surfaced as a boundary
    breach, while changing the sibling file is.
