  note: |
    A REAL CHANGE TO AN APPROVED AC, NOT A WORDING TIDY-UP. Authorised by the user (BrainCandy)
    on 2026-09-17, explicitly for this record, following the chartered-executor decision
    recorded in BO-3200f's notes; the same treatment BO-3200a-1 and BO-3200b-1 received on
    2026-09-16. readiness demoted approved -> draft so the approval gate is re-run rather than
    silently inherited (ACS-1300a-1-i / ACS-1300a-1 precedent: criteria changed on an
    already-approved record). Title unchanged -- it never carried the "rather than a
    specialist" wording.

    WHAT THE CRITERIA SAID BEFORE (verbatim):
      Given a reader tracing what happens to claimed work when a run stops early,
      When they open the sequence diagram for the failure path,
      Then it shows, in order: the claim being recorded in a store that outlives the run, a later
        step failing, the release being performed by the layer that must guarantee it rather than
        by a specialist, the outcome of that release being read, and both the triggering failure
        and the release outcome appearing in the halt report.

      Given the diagram,
      When it is compared against a real run driven to a failure after the claim,
      Then every interaction it shows occurred in that run, in the order shown, and no specialist
        appears in it as the performer of the release.

    WHAT THEY SAY NOW. First scenario: the ordered sequence is unchanged except that "rather than
    by a specialist" is removed from the release step, and ONE And is added -- where the
    guaranteeing layer performs the release by dispatching an exact release command to the
    chartered executor, the diagram shows that as the guaranteeing layer performing the release,
    with the executor carrying the command out on its behalf, not as delegation to a specialist.
    Second scenario: "every interaction occurred, in order" and "no specialist appears as the
    performer of the release" are unchanged (split into separate clauses); ONE And is added --
    neither the diagram nor the real run contains a dispatch asking any specialist to decide or
    interpret the release, while an exact-command dispatch to the executor does not fail the
    criterion.

    WHY. The E2 workflow engine gives a workflow body no filesystem or subprocess access
    (docs/reference/workflow-authoring-contract.md section 1), so the release BO-3200b-1 requires
    reaches the store through an agent() dispatch to the chartered executor (BO-3200b-1 as
    amended 2026-09-16; BO-3200f-3 addresses every release there). Read literally, the old
    "rather than by a specialist" would have been failed by the only buildable design, or would
    have pushed the diagram author to hide the executor dispatch. BO-3200's standing rule --
    only JUDGEMENT is delegable to a specialist -- is unchanged, and is now stated as the
    criterion: a specialist asked to decide or interpret the release still fails it.

    WHAT THIS RECORD STILL PROVES. Unchanged: the full ordered failure path, the outcome read as
    its own interaction, both facts reaching the halt report, two-way coherence with a real
    failure run, and no specialist drawn as the performer of the release. Added: the drawing
    cannot hide the executor dispatch, and a run whose release asks a specialist for a decision
    fails even when the claim ends up released.

    DEPENDS_ON. BO-3200f-1 added: the criteria now rely on the chartered executor it defines
    (the party that carries out one exact command verbatim with no judgement), and the build
    sequencer reads depends_on only (KI-ACD-015). check_ac_circular_deps.py was run after the edit.

    CRITERIA-ONLY CHANGE -- THE TECHNICAL LAYER IS NOW STALE AND IS THE IT PO'S TO REDO. Not
    edited here (outside the BA's remit):
      - it_requirements[3] "NO SPECIALIST MAY APPEAR AS THE PERFORMER OF THE RELEASE" -- still
        true, but silent on how the executor is drawn and on the new no-decide-or-interpret
        dispatch clause;
      - expects_from[0].contract (BO-3200b-1) "release performed inline" -- the trace now carries
        an executor dispatch; and there is no expects_from on BO-3200f-1 for the executor's
        identity the drawing and the coherence test must recognise;
      - test_spec[0] test_bo_3200b_4_diagram_declares_the_full_ordered_failure_path -- does not
        assert the executor dispatch is drawn as the guaranteeing layer's release;
      - test_spec[1] test_bo_3200b_4_no_specialist_performs_the_release_in_the_drawing -- must
        now classify the executor as not a specialist, and no test_spec entry covers the added
        "no dispatch asks a specialist to decide or interpret the release" clause over the real run;
      - test_spec[2] test_bo_3200b_4_diagram_matches_a_real_failure_run -- its real run is now
        the executor-dispatching release path (BO-3200f-1's harness stand-in);
      - doc_links carry nothing for the executor (BO-3200f-1 or its reference page);
      - test_rationale and notes paragraph "The clause forbidding a specialist as the performer"
        read against the old wording.
