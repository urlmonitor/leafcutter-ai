criteria: |
  Given the command-side reachability check (this BP-900g tree) and the existing
    BP-811 check (workflow .js files reachable via the .claude/workflows shim),
  When both run over the same consumer install,
  Then a deployed command's unresolvable HANDOFF TARGET is reported by the
    BP-900g check,
  And a deployed workflow .js file that is orphaned because no shim points at it
    is reported by BP-811,
  And a single underlying gap that surfaces on both axes is reported once per
    surface with its origin stated, never merged into one ambiguous finding,
  And this AC does not modify or re-parent BP-811 — the two checks are coordinated
    complements at distinct surfaces.
