notes: |
  Retrospective type-specific refinement of KM-400a-3-i. Registry and template are
  separate authorities; identical field names are not interchangeable. Optional
  ownership, output and condition declarations are preserved when authored, not
  inserted when absent. The receipt compares all registered agents and template
  sources. IT PO review and criterion-specific test links are recorded; user approval and fresh execution are separate.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
estimated_complexity: M
it_requirements:
- Template references must resolve inside the selected source snapshot, with missing declared sources reported explicitly;
  no environment/configuration resolution or prompt execution occurs during extraction.
- Returned registry and template metadata must be independent copies, preserving the ownership boundary between
  the two authored sources.
