criteria: |
  Background runs pause to ask you, then finish — instead of cancelling.

  Today, automation you launch in the background gives up the moment it needs a
  decision from you: it reaches a point where it would normally ask "approve,
  edit, or cancel?", "which priority?", or "how should this look?", cannot reach
  you, and quietly cancels — leaving the work half-done. This goal turns those
  dead ends into real conversation points. When a run needs your input, it pauses,
  shows you enough context to decide, asks a clear question, waits for your answer,
  and then picks up exactly where it left off. The result is automation you can
  trust to run start-to-finish on its own and still involve you at the moments
  that genuinely need a human. This is distinct from BO-1000, which surfaces
  one-way progress WHILE a run works; BO-2300 is two-way — the run asks, you
  answer, and it resumes.
