id: TQ-200a-3
title: "Registry injection into templates is covered by tests"
component: testing-quality
level: L2
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a valid registry and a template that declares a registry-injection
    placeholder,
  When the injection builder in injection_builders.py produces the injection
    payload and template_compiler.py compiles the template,
  Then the compiled output contains the registry-derived content in place of the
    placeholder and the placeholder token no longer appears in the output.

  Given a template that declares no registry-injection placeholder,
  When template_compiler.py compiles it,
  Then the output is unchanged and no registry content is injected.

  Given a registry-injection placeholder that references registry data which is
    absent or empty,
  When the injection builder runs,
  Then it fails with an error naming the missing registry section rather than
    emitting an empty or partially rendered injection.
