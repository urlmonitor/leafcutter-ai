id: ACS-900c-1
readiness: approved
priority: high
title: "Block message names the retired AC, the surviving files, and the two remedies"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the deprecation-hygiene hook blocks a commit because a retired AC still
    has surviving implemented_by entries,
  When the hook emits its block message,
  Then the message includes:
    - the id of the retired AC,
    - the new retired status it transitioned into,
    - the specific source file path(s) still claiming to implement it
      (one line per surviving implemented_by entry),
    - a statement of the violated rule
      (retired AC must not leave live implementing code behind),
    - the two remedies: (a) remove the orphaned code, or
      (b) re-point implemented_by to the successor AC,
  And the message is written to stdout (not only stderr) so the committing
    agent receives it as feedback.
depends_on: [ACS-900c, ACS-900b-1]
