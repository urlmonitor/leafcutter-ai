id: BO-2400f-13-i
components:
  - build_orchestration
title: "Refusing on the lane's own leftover workspace says what is in it and whether that attempt shipped"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the fast lane is pointed at an acceptance criterion it has already built or
    already attempted,
  And that earlier attempt's workspace for the same criterion is still there,
  When the run refuses,
  Then the refusal identifies the occupant as this lane's own earlier attempt at the
    same acceptance criterion, rather than as an unexplained obstruction,
  And it reports whether that workspace holds changes the earlier attempt never
    committed, so the operator knows before choosing whether clearing it loses
    anything,
  And it reports whether that earlier attempt got as far as opening a pull request,
    naming it when one exists, so the operator can tell the residue of a finished run
    from the debris of a run that died,
  And the options it offers cover at least three: look inside the workspace, clear it
    and re-run, or aim the lane elsewhere — with the clearing option marked as
    throwing away whatever that workspace holds.

  Given the same leftover workspace,
  When the run refuses,
  Then it does not step back into that workspace, does not build in it, and does not
    clear it on the operator's behalf, however empty it looks,
  And it does not bring it up to date against the current mainline either, because
    what the operator is owed is a workspace cut from the latest mainline
    (BO-2400f-3), and an earlier attempt's workspace is not that.
depends_on: [BO-2400f-13]
