it_requirements:
  - "No special case for surplus fields or for a drive letter: both shapes must be caught by the parent's single predicate, and a branch that names either shape explicitly is a defect — a new way to produce the same inert value would then escape."
  - "Exactly one message per offending line, never one per surplus field: the per-line announcement contract inherited from GE-113c-3-v is what the assertion protects."
  - "A Windows-style absolute path is rejected, not repaired. Do not add drive-letter or separator translation here; making such paths suppressible is a separate change with its own matching semantics."
  - "Edit the canonical template at templates/skills/security-scanner/scripts/scan_secrets.py and propagate with build.py; never edit a deployed copy (ADR-001)."
  - "Warn-and-skip stays non-fatal and stays on the error stream; the findings report the pre-commit check parses must remain free of diagnostics."
  - "Tests must never create, modify or delete a .security-allowlist at any real project root, workspace root or worktree root; every fixture allowlist lives under tmp_path/tempfile."
  - "Fixture files must use ordinary source filenames — the per-file scan short-circuits environment-named files and never reads their content."
test_spec:
  - name: test_windows_drive_letter_entry_warns_once_and_suppresses_nothing
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A tempfile-backed allowlist whose second line is a pasted Windows absolute path leaves the high-entropy finding reported, produces exactly one warning naming the allowlist path, line 2 and the verbatim text, and loads no entry for that line."
  - name: test_four_field_entry_emits_exactly_one_warning_for_the_line
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: boundary
    description: "An entry with one field more than the grammar allows produces one warning for its line, not one per surplus field, and is skipped."
  - name: test_two_and_three_field_entries_load_silently
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: boundary
    description: "Ordinary two-field and three-field entries with nothing surplus load with an empty error stream and are present in the loaded set."
test_rationale: |
  Both offending shapes are already inert for the parent's reason, so the value of
  these tests is that they must pass with no code written specifically for them —
  if either needs its own branch, the parent's predicate is too narrow. The
  one-warning-per-line assertion is written explicitly because the natural
  implementation of a surplus-field check emits one message per surplus field,
  which would silently fork the announcement contract inherited from GE-113c-3-v.
  All three arms use a real tempfile-backed allowlist; the drive-letter arm also
  scans a real file on disk, because the claim is that the finding survives.
