id: BO-2300e-1-i
components:
  - build_orchestration
title: "Applying the same answer twice is idempotent and never double-applies"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run that was paused on a pending question and has already received and
    applied a valid answer,
  When the same answer is submitted again for that already-answered question
    (for example a duplicate submission, or a second resume of the same run),
  Then the answer is not applied a second time,
  And the run's later stages are not re-executed as a result,
  And the run's state matches the state produced by applying the answer exactly
    once.
depends_on: [BO-2300e-1]
assigned_agent: python-coder
estimated_complexity: S
