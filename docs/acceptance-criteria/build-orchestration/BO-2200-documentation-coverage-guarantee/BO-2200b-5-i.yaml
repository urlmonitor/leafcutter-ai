      type: object
      description: "Re-generation/re-validation must re-assert documentation-expert and documentation-verifier to needed rather than trust an on-disk not_needed."
  reference_file_path: "scripts/ac_store/generate_ticket_from_ac.py"
  n_location_rule: "1"
