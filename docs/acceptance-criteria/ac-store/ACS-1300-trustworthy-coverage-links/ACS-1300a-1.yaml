id: ACS-1300a-1
components:
  - ac_store
title: "One pass reports both directions of rot, against a stated total"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a requirements store on disk containing four records: one named by a coverage
    tag in a test file whose path its coverage list does not hold; one whose coverage
    list names a test file that is not present on disk; one whose coverage list already
    holds every test file that names it; and one that no coverage tag names anywhere,
  And a test tree on disk carrying those tag occurrences in both the Python "#" comment
    form and the JavaScript "//" comment form,
  When the repair tool is invoked once, out of process, against that store and that tree,
  Then the first record is reported as a missing link, naming the record's id and the
    path of the test file that names it,
  And the second record is reported as a claim to a file that is absent, naming the
    record's id and the absent path,
  And the third record appears in the report as examined and already correct, so a
    record the run left alone is distinguishable in the report from a record the run
    never reached,
  And the fourth record appears in the report as examined and carrying no tag,
  And, given a fifth record whose coverage list carries one entry in each of the
    dialects the store actually uses — a child record id, a path with a
    double-colon class-and-function suffix, a bare file path, and a path whose
    class-and-function suffix is introduced by a SINGLE colon — every entry that
    names a file present on disk is classified as present, and no entry of any
    dialect is reported as naming an absent file merely because its suffix form
    was not the one the parser expected,
  And the report states how many records were examined, how many tag occurrences were
    read, and what the run excluded, so each finding arrives with the total it was
    measured against,
  And the set of tag occurrences the run acts on is identical, occurrence for
    occurrence, to the set the existing done-proof scan produces over that same tree —
    including the "//" occurrences — so the run recognises tags by the rule already
    established for that purpose rather than by a rule of its own.
