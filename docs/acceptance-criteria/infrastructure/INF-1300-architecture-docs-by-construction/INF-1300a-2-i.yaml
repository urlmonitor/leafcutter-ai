    relevance: >-
      The check offers exactly one way out of the parent requirement — a document that
      declares itself root — and treats a missing parent on any other document carrying a
      picture as a named violation. Those two facts together are why the last clause here
      matters: declaring root is not merely an alternative, it is a claim, and a producer
      that reaches for it whenever no parent was supplied would make every document at
      every tier pass the check while destroying the hierarchy the check exists to protect.
