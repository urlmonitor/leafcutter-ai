notes: |
  The "match the findings" clause is what keeps this how-to from asserting a mode's behaviour the
  probe did not observe. The absence of token wording is checked mechanically by GE-129e-1.

  The how-to does not recommend dispatching the commit specialist from a no-person mode: the user
  decided on 2026-09-17 that this dispatch is refused (GE-129d-2-i), so it is not a workaround.
  Amended the same day: the how-to is now required to say so, why, and what to do instead.

  OPEN ON THE PROBE: if GE-129a-1 finds no harness value telling a workflow run's dispatch from the
  session's (GE-129d-2-i fourth scenario), that finding goes to the user before GE-129d-2-i is done;
  the how-to's per-mode statements follow whatever the probe and that decision settle, by the
  "match the probe findings" clause.

  declares_side_effect: false -- the Then clauses describe how-to content.
