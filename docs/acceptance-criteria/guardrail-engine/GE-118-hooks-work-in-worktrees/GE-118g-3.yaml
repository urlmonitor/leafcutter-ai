notes: |
  WHY THIS IS AN L2 UNDER THE L1 AND NOT AN L3 UNDER EITHER SIBLING. It constrains BOTH
  tools. An L3 hangs off exactly one parent, so filing it under GE-118g-1 would leave the
  audit uncovered and filing it under GE-118g-2 would leave the pre-flight uncovered. The
  two tools share one promise here and it is stated once.

  WHY IT IS NOT A DUPLICATE OF ITS SIBLINGS, EXPRESSED AS THE ASYMMETRY. GE-118g-1 and
  GE-118g-2 both have a repository to find; every arm of each is about finding the right
  one. This record's first three arms are about there being none. An implementation that
  resolves correctly whenever resolution is possible satisfies both siblings completely
  and fails every arm here if it falls back to the working directory when resolution
  fails — which is the most likely shape of a hasty fix, because a working-directory
  fallback looks like robustness.

  THE FOURTH ARM IS NOT A NO-REPOSITORY CLAUSE AND IS HERE ON PURPOSE. Both siblings
  require the tools to work from a directory that is not the repository; a test harness
  therefore needs a way to point a tool at a repository other than the one it is standing
  in. If an explicit instruction were merged with, or overridden by, the working
  directory, the siblings' harnesses would be untestable and any green they reported would
  be about the harness rather than the tool. Stating the precedence here once keeps that
  out of three records.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM.

  (1) THE FALLBACK. MUTATION: when no repository can be established, treat the working
      directory as the repository and report the result.
      MUST GO RED: the first and second arms — the pre-flight would report a verdict about
      68, and the audit would report 68 as claimed.
      MUST STAY GREEN: every arm of GE-118g-1 and GE-118g-2.

  (2) THE SILENT SUCCESS. MUTATION: on an unestablishable repository, report an empty
      claimed set and complete successfully.
      MUST GO RED: the second arm only.
      MUST STAY GREEN: the first, third and fourth, and both siblings. This is the
      narrowest mutation here and the reason the "reports no claimed set and no unclaimed
      set" clause is stated separately from "does not complete successfully".

  (3) THE MERGE. MUTATION: when a repository is named explicitly, union its contents with
      the working directory's.
      MUST GO RED: the third and fourth arms.
      MUST STAY GREEN: the first and second. A union looks harmless and is the shape that
      would make every other record in this subtree unverifiable.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect.
