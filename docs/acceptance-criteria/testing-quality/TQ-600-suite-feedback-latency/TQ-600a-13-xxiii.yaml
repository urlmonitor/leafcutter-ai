id: TQ-600a-13-xxiii
components:
  - testing_quality
  - knowledge_management
title: "In the live-database lane a skipped test is never a passed test, and a skip for an unreachable database means the lane is broken"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given that the live-database tests skip, rather than fail, when no database is reachable,
    which is correct in the per-PR shards that start no database,
  And that the live-database lane of TQ-600a-13-xxi exists precisely to supply a database,
    so in that lane a skip for an unreachable database does not mean "not applicable here"
    but "the lane failed to do its one job",
  And that a lane in which every test skipped executes nothing, which a verdict built only
    from failures would read as green,
  When the live-database lane's tests are executed and one or more of them skips,
  Then no skipped test is counted as passed, in the verdict or in any count the run reports,
  And a test that skips with a reason stating that no database was reachable makes the run
    did-not-complete, with the stage named as the live-database lane having had no
    reachable database, and the result names each such test by its full node id,
  And a test that skips for any other reason is named in the run's result with that reason,
    as skipped, separately from both the passed and the failing tests, so a skip is visible
    rather than absorbed,
  And a live-database lane in which no test executed to a pass or a failure — every test
    skipped, or the folder collected nothing — is never green, whatever the reasons,
  And a test that skips for an unreachable database on the retry's fresh machine, after
    failing on the first execution, is not passed-on-retry and makes the run did-not-complete,
  And this rule applies only to the live-database lane: the same tests skipping in the
    per-PR shards, which start no database, change nothing there,
  And each of these is demonstrated by executing the lane against a synthetic population in
    which tests pass, fail, skip for an unreachable database and skip for another stated
    reason, observing the verdict and the named lists, never by searching the test files for
    a skip call.
