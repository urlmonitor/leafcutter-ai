criteria: |
  No specialist is left working from instructions the requirement has outgrown.

  When a requirement starts carrying its own proof, its own boundary and its own
  checklist, every specialist that acts on that requirement is updated to look
  there -- and each one is confirmed to actually do so before the change counts
  as finished. That confirmation comes from inspecting the complete brief a
  specialist receives and from watching a real run reach the check, not from
  trusting that a document was edited. Nothing is left quietly consulting the old
  source while the new one sits unread.
