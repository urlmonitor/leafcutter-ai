id: AR-300a-1
title: "Every agent with a declared ability grant has those abilities named in its compiled prompt"
component: agent-registry
components:
  - agent_registry
  - template_compiler
  - skills_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the set of agents whose own definition declares a non-empty grant of
    abilities -- 31 agents on the tree this criterion was authored against,
    among them workflow-architect, whose grant is the four abilities that
    constitute its entire documented purpose,
  When the working instructions each of those agents actually receives after the
    build has compiled them are read,
  Then each of those compiled instructions carries a section that names that
    agent's granted abilities,
    And every ability on that agent's declaration appears in that agent's
      section, so the section is the whole grant and not a sample of it,
    And the evidence is taken from the compiled instructions alone -- never from
      the central registry record and never from the source definition -- since
      all 31 agents already satisfy a comparison made against either of those
      while receiving nothing,
    And the comparison enumerates every agent the build compiled instructions
      for rather than a list of agent names, and states how many it examined, so
      a comparison that examined nothing cannot present as one that found
      nothing wrong,
  So an ability that was granted is an ability the agent knows it holds before
    it begins, instead of one it solves around.
depends_on:
  - AR-300a
