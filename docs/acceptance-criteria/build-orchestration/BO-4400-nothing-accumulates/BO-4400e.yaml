notes: |
  Gap G5. Under WSL the check must include the Windows host drive as well as the Linux
  volume (the virtual disk grows on the host and cannot be capped after creation -- user
  memory reference_wsl_disk_size_cap). Thresholds are configurable (warn vs refuse); the
  refusal is a "clear no" in the sense of BO-4300c, so callers halt rather than carry on
  without a workspace. Total-space-used report reuses the BO-4100e listing.
  how-to: reading the space report and adjusting the thresholds.
