notes: |
  USER DECISION (2026-10-03, verbatim): "neo4j fully works. so also add the importer so we can see which decision uses which categories for its decision". DK-500g is in scope now, not deferred.
  The ADR-062 knowledge projection is on origin/main (PR #998 and later), not yet on this branch. Its native reader registry is finite, so criterion_category needs a new reviewed native kind (dec-93c1c730463c1f3c crit.projectable_as_native_kind; the chosen option scored 0.34 there, so this is the riskiest part of the goal). ADR-062: Git is canonical, a generation is built from one immutable commit, validated and published atomically, and a failed build leaves the active generation untouched.
  How a criterion is represented in the graph (its own node or a property of the decision node) is for the IT PO; the AC asserts the link decision -> criterion -> category, which the two queries need.
  Note for the IT PO: the BA did not read the importer source (BA scope excludes source code); this AC rests on ADR-062, the knowledge-retrieval component doc and the how-to on origin/main.
  FLOW BACK-LINK (for step.implements, to be applied by the store owner): leafcutter/criteria-library: import-to-graph.
  Authored by the business-analyst stage of /plan-feature (route strategic) under decision dec-93c1c730463c1f3c; readiness draft, no product approval implied.
