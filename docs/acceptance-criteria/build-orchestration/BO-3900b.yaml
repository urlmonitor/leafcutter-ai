notes: |
  NAMED MUTATIONS (each turns only this record's tests red; BO-3900's cases stay green):
    M1 — containment as a raw prefix test with no separator boundary. Caught by
         test_sibling_directory_sharing_a_name_prefix_is_not_inside_the_worktree.
    M2 — containment compared case-sensitively for drive-lettered paths. git on Windows
         reports `C:/...`, and agents and users type `c:\...`. Caught by
         test_windows_worktree_spelling_variants_contain_the_same_ticket.
    M3 — lower-case every path before comparing, POSIX included. Caught by
         test_posix_containment_is_case_sensitive.
    M4 — compare without applying `..` first. Caught by
         test_dot_dot_segments_are_applied_before_containment.

  ASSUMPTION, logged. Drive-lettered and UNC paths are compared case-insensitively
  throughout, not only on the drive letter. That matches the default Windows file-system
  behaviour. Risk if wrong: a Windows directory set to be case-sensitive (per-directory
  case sensitivity is available on NTFS) could have two distinct folders judged the same.
  No build orchestration layout depends on that.
