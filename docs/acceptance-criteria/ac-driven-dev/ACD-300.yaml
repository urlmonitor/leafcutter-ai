title: "New requirements flow into the AC store through a single command"
component: ac-driven-dev
level: L0
status: active
req_status: active
work_status: todo
criteria: |
  Given a user has a new feature idea, a behavioral addition, or a technical constraint,
  When they invoke a single command (/plan-feature),
  Then the system triages their request and routes it through the correct authoring stages
    in sequence (product owner, business analyst, technical planner, then the test designer),
  And the output is written to the AC store (docs/acceptance-criteria/<component>/),
  And duplicate or already-covered requirements are surfaced rather than re-authored,
  And the user confirms the product owner's and the business analyst's output before the
    next stage begins, and approves the batch at one final gate after the test design,
  And no stage's output advances while its requirement rule check fails.
