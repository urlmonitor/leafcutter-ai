    description: "From the same cwd, `branch-standing <worktree branch> --repo <ticket file>` answers exists true, and the whole answer equals the folder-anchored one, so BO-4000b's stale-branch refusal is evaluated rather than skipped."
  - name: test_facts_on_the_ticket_file_itself_is_still_not_a_checkout
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "`facts <ticket file>` still answers exists true, is_git_toplevel false, is_linked_worktree false, same_repository null and branch null — the inspected path is classified as itself, not as its folder."
  - name: test_directory_missing_and_out_of_repo_references_answer_as_before
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A folder reference answers exactly as it did; a non-existent reference (e.g. a not-yet-created file under the linked worktree) and a real file outside every repository both still yield the null answers for base and same_repository null for facts."
  - name: test_file_anchored_answers_let_a_single_ticket_run_reuse_its_worktree
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: real_artifact
    surface_invoked: templates/workflows-js/build-feature.js
    description: "The real script answers obtained with a ticket-FILE anchor from the non-git cwd, fed to build-feature.js's own top-level body for a single-ticket target, reuse the existing worktree and dispatch phase agents; the run does not abort worktree-base-unavailable."
  - name: test_file_anchoring_is_applied_to_every_reference_argument_and_only_there
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: discrimination
    must_catch:
      - "the file is resolved to its folder for base's start only, leaving facts --reference answering same_repository null or branch-standing --repo reporting the branch absent"
      - "the folder resolution is also applied to facts' own candidate path, so the ticket file is classified as (or compared through) its folder"
      - "a path is replaced by its parent unconditionally (Path.parent without an is_file test), so a missing location or a directory reference starts answering about a different directory"
      - "the fix is made only in build-feature.js by passing the ticket's folder, leaving worktree_repo_facts.py answering null whenever it is handed a file"
    description: "Every assertion runs the real script as a subprocess with real argv from the non-git cwd, so each named half-fix leaves at least one of the per-subcommand or boundary assertions red; no assertion inspects the source text."
test_rationale: |
  BO-4000f's suite already runs the real script, from a real non-git directory, against a
  real linked worktree — and it is green while every single-ticket build aborts, because
  its only anchor is an epic FOLDER. The defect lives exclusively on the one input shape no
  fixture supplied: a reference that names a file, which is exactly the shape the driver
  passes for a single ticket. So the coverage must hand the real script a real tracked
  ticket file, from a cwd that is genuinely not a checkout (otherwise git's own cwd answers
  and the file is never consulted), and compare each answer against the folder-anchored
  answer that BO-4000f already proves correct.

  The three subcommands are covered separately because the fix site is three arguments,
  and a fix to `base` alone would turn the abort into a quieter failure — the worktree
  never reused, or the stale-branch refusal silently skipped. The boundary entries are
  paired with them deliberately: the cheapest passing implementation is an unconditional
  `.parent`, which would also re-anchor directories and not-yet-existing locations, and
  would misclassify the file when applied to facts' own candidate path. The real_artifact
  entry then closes the loop on the reported symptom: the per-subcommand answers are right,
  AND the driver given those answers for a single ticket reuses its worktree instead of
  aborting — a dispatch fact visible only through the workflow harness.
