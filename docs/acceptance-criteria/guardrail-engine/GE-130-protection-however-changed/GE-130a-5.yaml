id: GE-130a-5
title: The hooks reference shows each of the three guards covering editing tools and shell commands, matching
  the shipped settings
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the hooks reference catalogue and the shipped hook settings,
  When a reader looks up the documentation guard, the guide-read guard or the task-lock guard,
  Then each catalogue entry's matcher shows the editing tools and shell commands, identical to
    the matcher that guard is registered with in the shipped settings, established by reading
    both,
  And each entry states which command forms it refuses before they run,
  And the documentation guard's and the guide-read guard's entries each state that a command whose
    effect cannot be told beforehand runs and is examined afterwards, with three outcomes: a change
    to a protected file positively attributed to this caller's command stops the run; a changed
    protected file the examination cannot attribute is named, with the reason whose change it was
    could not be told, is recorded and listed at the end of the drive, and the run continues; and
    when the files could not be examined at all, the run stops,
  And the guide-read guard's entry states that a guide printed by a shell command counts as read
    and that listing or naming it does not,
  And the task-lock guard's entry states that, under the lock, commands that only look at files are
    not refused; that a writing command is refused unless its caller is one of the build workflow's
    own dispatched agents; that this exemption is decided only from the caller identity the harness
    supplies with the call, never from command text, environment or prompt; and that a writing
    command whose caller identity cannot be established is refused,
  And the task-lock guard's entry does not state that whose change it was affects whether a writing
    command under the lock is refused,
  And each entry states which rollout stage, warn-only or blocking, the guard is in on the
    command path.
