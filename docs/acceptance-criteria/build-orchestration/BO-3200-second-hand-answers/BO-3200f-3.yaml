id: BO-3200f-3
title: "Every workflow step that carries out an exact command with no judgement is sent to the executor, and one sent anywhere else is named"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
  - agent_registry
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given every dispatch in the workflows shipped with the package whose request is an exact
    command to carry out and whose result is used without anyone's judgement over it -- reads of
    recorded project state, and chores such as claiming or releasing work -- other than a
    dispatch whose request records a commit in the project's history,
  When the routing check examines them,
  Then every one is addressed to the chartered executor,
    And the check lists each by workflow and step together with the party it is addressed to.

  Given one such dispatch addressed to a party other than the executor -- the reporting
    specialist status-checker, as measured on 2026-09-16 -- while every other is addressed to
    the executor,
  When the routing check runs,
  Then that dispatch is reported by workflow and step, with the party it is addressed to and the
    permission that party's registry entry states,
    And every other dispatch being correct does not suppress the report or merge it with any
    other.

  Given a dispatch that asks a specialist to read, decide or interpret, whose returned opinion
    the build records rather than branches on,
  When the routing check runs,
  Then that dispatch is not reported, and is not required to be addressed to the executor.

  Given a dispatch whose request records a commit in the project's history -- including
    finalize-feature's step-3.5 closure commit, addressed to status-checker as measured on
    2026-09-17 --
  When the routing check runs,
  Then that dispatch is never counted as a chore and is never listed among the dispatches that
    must be addressed to the executor, because commits go to the commit agent (GE-129c),
    And the same dispatch addressed to the chartered executor is reported by workflow and step
    as a commit sent to the executor, whatever result declaration it carries.

  Given a workflow step added after the check was written that sends an exact command to a party
    other than the executor,
  When the check runs with nothing in it changed,
  Then the new step is named.

  Given a run of the routing check that examined no dispatches,
  When it reports,
  Then it reports a failure, not a clean result.
