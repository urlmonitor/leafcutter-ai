title: "The /build-feature epic-batch path runs each ticket's phases through the flattened driver, not an inline supervisor"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given /build-feature resolves its argument to an epic with one or more ready tickets,
  When it drives a ready ticket in a batch,
  Then it executes that ticket's phases through the flattened script-driver semantics
    -- each needed phase is dispatched as its own phase agent under that phase's template
    (build-ticket driver semantics),
  And it does NOT hand the whole ticket to a single agent that runs every phase inline.
