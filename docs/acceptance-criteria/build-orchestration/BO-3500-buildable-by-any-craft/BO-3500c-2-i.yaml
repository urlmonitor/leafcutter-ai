notes: |
  THE FLOOR, WITH THE TWO CHEAPEST WAYS PAST IT CLOSED. KI-BO-013 suggests "the named
  doc file exists and changed in the diff", which is defensible and is where this
  starts. Two things defeat it and both have happened in this repository: a page
  created as an empty stub, and a page written about something other than what was
  asked for. The content clause and the subject clause close them.

  THE REACHABILITY CLAUSE is the one that will be argued about, so the reason is worth
  stating. An unlinked page is not documentation; it is a file. A build that writes pages
  nobody can reach would raise the count of finished documentation requirements while the
  documentation gets no better — a coverage figure improving with no benefit is exactly
  the failure BO-3500d exists to prevent, arriving through the mechanism meant to fix it.

  BUT THE FIRST VERSION OF THAT CLAUSE WAS CIRCULAR, and the correction is the second
  scenario (amended 2026-08-31, finding F3). It asked that the page appear in the
  project's documentation index. That index is GENERATED, by the same build the run
  executes — so the proof and the thing proved share a producer, and the check passes
  because the build ran rather than because anybody can find the page. Worse, the
  known-issues register carries a live instance of that index being overwritten with an
  empty stub by a mis-rooted build, which means the same check can also FAIL for a reason
  that has nothing to do with the page. Both directions are noise.

  SO REACHABILITY IS FROM A HAND-AUTHORED SURFACE: a back-link from a page a person
  maintains, a documentation reference carried by a requirement, or a project instruction
  file. Those are written deliberately and are not regenerated by the run being proved.
  This is strictly cheaper than the generated-index check as well as being honest — it is
  a read of files already in the change.

  THE SUBJECT CLAUSE IS DELIBERATELY MODEST. It asks that the subject the requirement
  named is addressed, which a machine can check. It does not ask that the page is good,
  which a machine cannot. Judging quality belongs to review, and a criterion that
  demanded it would be untestable and would be quietly satisfied by anything.

  BOUNDARY vs BO-2200, which demands and enforces documentation on the thorough path.
  This is not a second documentation gate. It is the proof instrument for one kind of
  artifact in a lean run that until now could not produce that kind at all. If the
  checks BO-2200 already performs are the right ones, reuse them — that is a merit,
  not a duplication.
