title: "'Done' is impossible until the documentation actually exists"
component: build-orchestration
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  No phantom docs -- the build cannot be marked complete on a promise.

  When a change requires documentation, the build cannot report the work as
  complete unless the documentation was genuinely produced. A documentation step
  can no longer "pass" having written nothing, so "done" reliably means the docs
  are really there -- the same trust the build already earns for tests.
