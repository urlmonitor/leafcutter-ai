criteria: |
  Given the reusable-criteria split where p4, "Decide whether to mine the reusable categories
    from Langfuse as a start", runs after p1 was decided,
  When Jev judges p1's record to apply to p4's question below the applicability threshold,
  Then p4's record names p1's record as considered and not applicable,
  And p1's record is not used as evidence for p4's options or criteria.
