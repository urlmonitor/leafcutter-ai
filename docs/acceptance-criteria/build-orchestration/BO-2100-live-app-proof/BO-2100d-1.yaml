  notes: |
    Absence of the `requests` prerequisite must fail fast — before the startup polling
    loop — with a clear message that names `requests` and a non-zero exit status. The
    failure must be distinguishable from a genuine readiness timeout: it must not
    degrade into a generic 'did not become ready' result when the real cause is a
    missing prerequisite. Error handling must follow the project error-handling policy
    (typed/named exception path, logged at appropriate severity, not silently
    swallowed).
