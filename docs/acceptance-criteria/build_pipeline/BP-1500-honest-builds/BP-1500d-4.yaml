notes: |
  WHAT THIS CHILD OWNS, AND WHY IT IS NOT BP-1500c. BP-1500d's own criteria state it:
  "The checks that exist to tell you whether anything has drifted or been altered all
  read that account, so wherever it is missing or unreadable they protect nobody --
  and say nothing about it." That sentence is the subject here. The judgement being
  demanded is about the READABILITY of the record, not about what the record, once
  read, says. BP-1500c owns "an installed copy that has fallen behind is reported" and
  is deliberately not restated: BP-1500d is its prerequisite, because drift cannot be
  reported against a record that was never written in the project being checked.

  A check can satisfy BP-1500c perfectly in the producing package's own workspace and
  be entirely inert in a consumer install. That is evidence point 4 of BP-1500d's
  notes, and it is the reason BP-1500c must not be accepted on evidence gathered only
  inside this workspace.

  THE THREE-RUN CONTROL IS LOAD-BEARING. Remove the record, see the could-not-read
  report; substitute a location-keyed record, see it again; restore, see the all-clear.
  A single red proves the check can fail; it does not prove that the red was caused by
  the record. The restore run is what attributes it. This mirrors the discipline
  already applied in BP-900h-4 and BP-900h-1.

  THE DISTINGUISHABILITY CLAUSE IS THE ONE TO GUARD AT IMPLEMENTATION TIME. An
  implementation that logs "no record found" and then returns the same clean verdict
  satisfies the wording of the reporting clause and changes nothing that matters. The
  criterion therefore requires the two outcomes to be distinguishable to an automated
  caller, not only to a human reading output.

  ORDERING. Presupposes the record produced by BP-1500d-1 and the readability
  guarantee of BP-1500d-2 for its positive case. depends_on carries only the parent
  link, as the authoring request specified.
