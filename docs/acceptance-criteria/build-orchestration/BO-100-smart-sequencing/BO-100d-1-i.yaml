  ac_id: BO-100d-1a
  contract: "The shared pre-drive sink probe helper exposing the first-probe attempt, the mkdir-and-reprobe remediation step (creates debugging/logs/ with parents, retries once), and the directory-absent-vs-genuine-failure classification. This L3 specifies the directory-absent remediation branch of that helper."
