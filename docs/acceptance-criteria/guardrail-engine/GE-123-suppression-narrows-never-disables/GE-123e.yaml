id: GE-123e
title: "A sign-off without its feedback record is always caught, and no message can wave it through"
component: guardrail-engine
components:
  - commit_guardian
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  A missing feedback id is refused every time; no message can switch that off.

  Whether a person or an agent makes the commit, a ticket change that adds a
  sign-off without its feedback id is refused, and the refusal says how to get a
  real id; nothing written in this commit's message, and nothing left behind by
  an earlier one, can quietly turn the check off. Finishing a merge is never
  blocked by sign-offs that arrived unchanged from the other branch.
