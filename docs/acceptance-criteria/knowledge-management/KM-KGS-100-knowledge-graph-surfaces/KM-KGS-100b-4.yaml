criteria: |
  Given the act of following an acceptance criterion to its connected code, tests,
    dependencies, and component
  When a reader opens the sequence diagram for that traversal
  Then the diagram shows the steps from naming a criterion, to building the map
    from the declared surfaces, to reading the criterion's outbound edges
  And it shows the four edge kinds being resolved to their target nodes
  And it ends with the answer "which code file delivers this criterion?" returned
    to the reader
