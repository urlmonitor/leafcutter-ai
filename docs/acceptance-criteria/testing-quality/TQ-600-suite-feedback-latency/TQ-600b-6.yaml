assigned_agent: documentation-expert
estimated_complexity: S
it_requirements:
  - >-
    BOTH SURFACES ARE NAMED BY THE CRITERIA AND ONE OF THEM CANNOT GROW. Verified
    at enrichment: `check-doc-length` refuses a commit in which a file already
    over the 300-line limit grows, and passes one that shrinks or holds steady.
    `docs/testing/README.md` is 326 lines; `unit_tests/README.md` is 228 and has
    room. The docs/testing/README.md half must therefore be an in-place, net
    non-growing edit — its existing run-command material is where the statement
    goes, replacing rather than appending. The gate is PRE-COMMIT ONLY and runs
    in no CI job, so a violation appears as a local refusal and nowhere else.
  - >-
    QUOTE THE INVOCATION TQ-600b-5 ACTUALLY DELIVERS, including whether the plain
    `python -m pytest` form inherits the parallel default. A guide naming a flag
    the runner does not accept is worse than no guide, because the reader
    concludes the suite is broken rather than the sentence.
  - >-
    AGREEMENT IS SATISFIABLE BY A LINK, AND A LINK IS PREFERRED. Given the
    constraint above, the full account belongs in `unit_tests/README.md` — which
    already carries a "Running the suite" section — and `docs/testing/README.md`
    states the command and links to it. What the criteria forbid is two accounts
    naming different commands; they do not require two accounts.
  - >-
    THE ESCAPE HATCH IS SHOWN BESIDE THE PARALLEL COMMAND, NOT IN ANOTHER
    SECTION, and it is the request TQ-600b-5 actually kept reachable, quoted
    verbatim. A contributor staring at interleaved output does not go looking in
    a second document for the way back.
  - >-
    DOCUMENT NO SPEED FIGURE. The measured wall clock on this workspace is
    contaminated by shared-host load, so a stated saving is a number nobody can
    reproduce — and the first contributor who fails to reproduce it discounts the
    rest of the page. The guidance documents the command, not the saving.
  - >-
    CROSS-LINK RATHER THAN RESTATE: TQ-600a-7 owns declaring a test, TQ-600b-2
    owns the per-test scratch-space rule this AC's fourth clause sends the reader
    to. Restating either half here creates the second account that the agreement
    clause exists to forbid.
  - >-
    VERIFY THE GATES FROM INSIDE THE WORKTREE. Commit-guardian hooks resolve
    their target set from the current working directory; invoked with absolute
    paths from elsewhere they examine nothing and exit 0, which is
    indistinguishable from a pass. Use `env --chdir=<worktree>` with
    worktree-relative paths and read silence as "it examined nothing".
