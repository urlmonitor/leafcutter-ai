criteria: |
  Given the user's request describes a new capability, a product goal, or a
    strategic change that does not map to any existing L1 AC in the store,
  When the Haiku triage agent evaluates the request against the AC store,
  Then it classifies the route as "strategic",
  And the classification signal includes: no matching L1 parent found,
    request describes user-observable outcome or new system capability,
    request does not reference specific existing components or ACs,
  And the routing decision dispatches to: PO v3 -> BA v3 -> IT PO v3
    (full pipeline).
