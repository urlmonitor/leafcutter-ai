notes: |
  Sibling of BO-2300e-3-i: that AC covers a well-formed refusal being
  misread as empty; this one covers the remaining ways a read can fail to
  produce a usable result (silence, transport error, garbled reply) without
  being a refusal at all. Both must resolve to "could not determine", never
  to the empty-result default, or the defect reappears through whichever
  branch was left uncovered.
