id: TQ-500g-5
components:
  - testing_quality
  - build_orchestration
title: "A reference page explains the wrong-version runs: what runs, what each verdict means, and what stops the work"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a reader whose work was stopped with the report "drop the retry_due
    condition survived test_refresh_gate",
  When they open the reference page for the wrong-version runs,
  Then they find which tests are in scope (only those whose entry names
      must_catch or declares the discrimination angle) and which wrong
      versions are run (each named one, plus the fix undone),
    And they find every verdict a run can give — caught, survived, did not
      load, not applied, invalid because the suite put the correct code back,
      not run, not applicable — with what each means and whether it stops the
      work,
    And they find that each test answers for the wrong versions its own entry
      names, so a sibling's catch does not cover it,
    And they find that the code is put back byte for byte after every run, and
      what to do when the drive reports that it could not be,
    And they find that every build route — the fast lane, /build-feature, a
      single ticket and /build-epic — uses the same runner, and where in each
      it runs,
    And they find the consumer-test sweep: what must be listed, what counts as
      weakening, and the one exit for tests removed with the code they tested,
    And they find that a test which failed in any of its sub-cases is read as
      failed, and that a run which reports failure with no identifiable failed
      test is inconclusive,
    And they find how to strengthen the test that let the wrong version
      through, rather than how to silence the runs.
depends_on:
  - TQ-500g
  - TQ-500g-1
  - TQ-500g-2
  - TQ-500g-3
  - TQ-500g-4
