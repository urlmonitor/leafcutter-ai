readiness: approved
priority: medium
title: "Text that quotes a marker is not the same as text that carries one"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: not_started
created_by: "docs/acceptance-criteria/build-orchestration/BO-2200-documentation-coverage-guarantee/BO-2200b.yaml"
criteria: |
  Given placeholder-marker detection running over a markdown file,
  When a marker word appears inside a fenced code block -- the block form of the inline-code
    exemption the detector already applies to backticks,
  Then it is not reported, because a fenced block is quoted material and quoting a marker is
    not carrying one.

  And given a marker word appearing in a markdown heading,
  When it sits after other heading text rather than at the start of the heading,
  Then it is not reported, because it is part of a title rather than a scaffolding marker --
    and when it DOES open the heading text, it is still reported, so a genuinely stubbed
    heading is not excused.

  And given the PLACEHOLDER positional rule, which requires a preceding list bullet,
  When the character before the word is a markdown emphasis marker rather than a list bullet
    -- `*Placeholder*` -- then it is not reported; the rule must key on a bullet FOLLOWED BY
    WHITESPACE, so that emphasis and list syntax are distinguished rather than conflated.

  And the false-positive cost of every change here is measured PER MARKER and recorded next
    to the rule, never as a single aggregate figure across all markers.

  Coverage note: the last clause is the load-bearing one and is why this AC exists as a
  separate record. The defect being corrected was not primarily a bad regex -- it was a
  measurement taken for one marker (PLACEHOLDER, 2 repo-wide hits) and asserted for all six,
  which left the marker responsible for the overwhelming majority of hits untightened while
  the comment claimed there was no cost to leave it alone. A fix that corrects the regexes
  and repeats the aggregate measurement has reproduced the defect in a new place.
