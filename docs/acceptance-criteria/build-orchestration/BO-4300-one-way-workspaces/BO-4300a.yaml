notes: |
  The load-bearing record of the goal. Decision 4 is its subject: one standalone means,
  identical behaviour, agents run it from a skill, workflows receive its result, and no
  workflow step ever sends workspace creation to an agent as free-form shell work
  (failure modes F1 and F12 -- an agent refusing a shell step outside its charter; an
  agent acting on leaked conversation instead of creating the workspace). Decisions 1-3
  define what "the same shape" means: a per-feature clone landing in worktrees/<slug>,
  real install files built inside it, branched from origin/main after a fetch.

  OPEN, NOT DECIDED HERE: Q4 one naming scheme. The customer intent is only that the same
  piece of work is recognised as the same workspace whoever started it, so a re-run never
  abandons one workspace for a freshly named twin (F10, KI-BO-20260921 "abandons the epic
  worktree branch"). Which scheme achieves that is for BA/IT PO with the user.

  Distinct from BO-4100d (the account of what was made is truthful): 4100d is honesty
  about one workspace; this record is that there is only one maker.

  documentation_triggers: how-to (how any agent or person gets a workspace -- the single
  replacement for every retired recipe under BO-4300f), component-diagram (a new
  standalone component and who calls it), reference-doc (the result every caller
  receives and must act on).
