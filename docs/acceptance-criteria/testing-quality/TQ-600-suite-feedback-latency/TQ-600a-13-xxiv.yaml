notes: |
  WHY A REGRESSION RECORD AT ALL. The cheapest way to implement TQ-600a-13-xxi is to lift the
  database start-up out of the Proof-of-done job into something shared — and the cheapest way
  to break the Proof-of-done path is that same refactor. The user answered the question
  explicitly ("If that's easily possible, yes" to keeping Proof-of-done's live run); this
  record makes that answer checkable rather than a remembered intention.

  If keeping the two database start-ups identical turns out to need a shared definition,
  that is fine — the criterion is about what Proof-of-done selects and decides, not about
  whether the start-up is duplicated.
