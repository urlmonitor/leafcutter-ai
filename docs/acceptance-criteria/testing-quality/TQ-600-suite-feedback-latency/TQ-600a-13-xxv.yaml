estimated_complexity: M
it_requirements:
  - >-
    AGENT CONFIRMED: python-coder (scripts/ci/ module plus workflow glue, as TQ-600a-13-xvi).
  - >-
    THE TRUST MODEL OF TQ-600a-13-xvi IS UNCHANGED. Workflow-level `permissions: {}`; the job
    that runs pull-request code holds no permission and the workflow references no
    `secrets.`; harness, pytest.ini and selection plugin come from the default branch;
    `PYTEST_DISABLE_PLUGIN_AUTOLOAD=1`. Starting database service containers adds no
    credential: the NEO4J_AUTH values are the same non-secret test literals ci.yml already
    carries, and the instances are disposable and discarded with the job.
  - >-
    WHICH TESTS. The live-database ids come from the current red run's `post-merge-verdict`
    artifact, object `live_database` (`failing`; or the whole lane when its `verdict` is
    did_not_complete), as defined in TQ-600a-13-xxi's delivers_to — never from the notice
    body and never from anything in the pull request. The correctness-lane ids keep coming
    from the top-level `failing` list, unchanged.
  - >-
    SAME SELECTION, BUILD AND STRICTNESS AS THE LIVE LANE. The proof executes live-database
    ids with the live lane's marker override (the whole-folder expression, not
    `-m "manual and not timing_ratio"`), the same build and `AC_ENFORCE_STRICT=1`; a whole-
    lane proof collects `tests/knowledge_live/` fresh. Re-running live ids under the default
    addopts would deselect them and prove nothing.
  - >-
    THE SAME DATABASES, AND ONLY WHEN NEEDED. When live-database tests are to be proven, the
    proof starts the same three instances as the live lane (same image, host ports,
    credentials, memory settings), defined so it cannot drift from the lane's definition.
    When the red run's failures are correctness-lane only, no database starts. How the
    start is made conditional is the implementer's choice (GitHub service containers are
    declared per job, so this likely means a separate job or an explicit start step).
  - >-
    ONE PROOF RESULT FOR THE HOLD. The hold (TQ-600a-13-viii) reads the conclusion of the
    job named exactly `Post-merge fix proof`. If the live-database proof runs in a separate
    job, either the `Post-merge fix proof` job's conclusion must be success only when every
    required part proved, or the hold's reader is updated in the same change; a live part
    that is skipped, not run, or failed must never leave the hold reading success.
  - >-
    SKIP IS NOT PROOF, BY THE SHARED RULE. Live-database results are judged by the
    classification TQ-600a-13-xxiii delivers (any skip is never a pass; an unreachable skip
    is did_not_complete), imported, not re-implemented. A database that never became
    healthy, or refuses the first connection, ends the proof as not proven (job conclusion
    not success).
  - >-
    TEST COST: under 1.2 s of the family's 15 s default-run budget, reusing -xvi's
    two-job seam and synthetic project; producing an unreachable database needs only an
    address that never answers. A real graph database is not started in the default run.
delivers_to: null
expects_from:
  - ac_id: TQ-600a-13-xvi
    contract: >-
      The proof run's selection of the current red run's failing tests and its judgement.
  - ac_id: TQ-600a-13-xxi
    contract: >-
      The verdict artifact naming failing tests as belonging to the live-database lane, and
      the disposable database start-up to reuse.
  - ac_id: TQ-600a-13-xxiii
    contract: >-
      The importable live-lane skip classification (passed / failed / unreachable_skips /
      skipped-with-reason), under which any skip is never a pass and an unreachable skip is
      did_not_complete.
test_intent:
  - clause: 'the proof run starts the same disposable database instances as the live-database lane and executes those failing live-database tests against the pull request''s head, with the same selection, build and strictness as the post-merge run'
    needs_test: true
    reason: A proof that drops the live marker override or reads ids from the wrong field executes nothing and could release the hold.
  - clause: 'for a run whose live-database lane did not complete, the proof run executes the whole live-database lane against the head and passes only if that lane is green by TQ-600a-13-xxi''s, -xxii''s and -xxiii''s rules'
    needs_test: true
    reason: A did-not-complete run has no failing ids, so a proof keyed only on failing ids would select nothing and could pass.
  - clause: 'a live-database test that skips in the proof run, for any reason, is not a pass, and the proof does not pass while any such test skipped'
    needs_test: true
    reason: A skip-blind judgement passes every live test run without a database, which is the hole this record closes.
  - clause: 'a proof run whose database never became healthy is reported as not proven, never as passed, and the hold stays'
    needs_test: true
    reason: A proof job whose live part never ran could still conclude success and release the repository-wide hold.
  - clause: 'a declared fix for a run whose failing tests are all correctness-lane tests starts no database, as before this change'
    needs_test: true
    reason: Starting databases unconditionally would change the cost and the job graph of every existing correctness-only proof.
  - clause: 'each of these is demonstrated by executing the proof''s selection and judgement against a synthetic project in which a failing live-database test is made to pass, to fail and to skip at the head, and one in which the database is not started, never by reading the proof workflow for a service definition'
    needs_test: false
    reason: This clause prescribes how the other clauses are demonstrated rather than stating an outcome of its own.
test_spec:
  - name: test_tq_600a_13_xxv_the_proof_executes_the_red_runs_live_failures_with_the_live_marker_override
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: seam
    surface_invoked: "the `Prepare fix proof` and `Post-merge fix proof` jobs of post-merge-fix-proof.yml executed verbatim by the shared workflow-step executor over real child pytest sessions, with a served red-run artifact whose live_database.failing names a default-deselected live test, a synthetic head in which it passes, and the database address reachable through a local stand-in listener"
    description: The ids come from the artifact's live_database object, the live test executes under the whole-folder marker expression and passes, and the proof records the red run id.
    proves_clause: 'the proof run starts the same disposable database instances as the live-database lane and executes those failing live-database tests against the pull request''s head, with the same selection, build and strictness as the post-merge run'
    code_file: scripts/ci/post_merge_fix_proof.py
    must_catch:
      - "the proof reads live ids from the top-level failing list so none are found"
      - "the proof keeps the correctness selection `manual and not timing_ratio` so the live test is deselected, executes nothing and the run is reported passed"
      - "the ids are taken from the notice body or the pull request instead of the artifact"
  - name: test_tq_600a_13_xxv_a_did_not_complete_live_lane_is_proved_by_the_whole_folder
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "the same two jobs executed against a served red artifact whose live_database verdict is did_not_complete and whose failing list is empty, with heads where the whole synthetic live folder is green and where one test fails"
    description: The whole folder executes against the head and the proof passes only for the green head and fails for the head with a failing, skipped or missing test.
    proves_clause: 'for a run whose live-database lane did not complete, the proof run executes the whole live-database lane against the head and passes only if that lane is green by TQ-600a-13-xxi''s, -xxii''s and -xxiii''s rules'
    code_file: scripts/ci/post_merge_fix_proof.py
    must_catch:
      - "a did-not-complete run has no failing ids so the proof selects nothing and passes"
      - "the whole-lane proof judges only failures and ignores the lane's empty or all-skipped endings"
  - name: test_tq_600a_13_xxv_a_live_test_that_skips_in_the_proof_is_not_a_pass
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: discrimination
    surface_invoked: "the proof's judge in scripts/ci/post_merge_fix_proof.py (and the imported live-lane classification) fed recorded head reports in which a wanted live test passes, fails, skips with the no-database reason and skips with another reason"
    description: Only the passing report is a pass; every skipped wanted live test, whatever its reason, yields a problem line and fails the proof.
    proves_clause: 'a live-database test that skips in the proof run, for any reason, is not a pass, and the proof does not pass while any such test skipped'
    code_file: scripts/ci/post_merge_fix_proof.py
    must_catch:
      - "a skip-blind judgement passes every live test run without a database"
      - "the proof re-implements the classification and treats an other-reason skip as passed"
  - name: test_tq_600a_13_xxv_a_proof_whose_database_never_became_healthy_is_not_proven_and_the_hold_stays
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: failure
    surface_invoked: "the proof jobs of post-merge-fix-proof.yml executed by the shared workflow-step executor with the live database address set to a port nothing listens on, then the conclusion of the job named exactly `Post-merge fix proof` read as the hold reads it"
    description: The proof is reported as not proven, the named job's conclusion is not success, and a live part that is skipped, not run or failed never leaves that conclusion reading success.
    proves_clause: 'a proof run whose database never became healthy is reported as not proven, never as passed, and the hold stays'
    code_file: scripts/ci/post_merge_fix_proof.py
    must_catch:
      - "the live part never ran yet the job named `Post-merge fix proof` still concludes success and releases the hold"
      - "an unreachable database is read as a skip and a skip as a pass"
  - name: test_tq_600a_13_xxv_a_correctness_only_red_run_starts_no_database
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: boundary
    surface_invoked: "the two proof jobs executed by the shared workflow-step executor with a served red artifact whose failing ids are all correctness-lane tests and whose live_database object is green, recording whether any database probe or live job step ran"
    description: The proof runs exactly the correctness ids as before, no live job step or database probe executes, and the existing TQ-600a-13-xvi outcomes are unchanged.
    proves_clause: 'a declared fix for a run whose failing tests are all correctness-lane tests starts no database, as before this change'
    code_file: scripts/ci/post_merge_fix_proof.py
    must_catch:
      - "the live part starts unconditionally so every correctness-only proof pays the database start-up"
      - "the correctness-only proof now also runs the live folder"
  - name: test_tq_600a_13_xxv_the_proof_workflow_is_reachable_and_reports_the_named_job_conclusion
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "post-merge-fix-proof.yml run through its real entry point, `python scripts/ci/post_merge_fix_proof.py prepare`, `verify` and `prove`, by the shared workflow-step executor on a served red run with a declared fix"
    description: A declared fix of a live-database red run reaches the prove step and the job named `Post-merge fix proof` concludes success only when the live proof passed.
    proves_clause: 'the proof run starts the same disposable database instances as the live-database lane and executes those failing live-database tests against the pull request''s head, with the same selection, build and strictness as the post-merge run'
    code_file: scripts/ci/post_merge_fix_proof.py
