assigned_agent: workflow-architect
estimated_complexity: M
it_requirements:
  - "Ticket-supervisor's read-ticket step must apply the same behavioral-vs-documentation classification of acceptance criteria used by the refinement lens (BP-1100a-1)."
  - "When a behavioral criterion has no executable surface in files_touched, ticket-supervisor must emit a blocker (named ticket + reason) and must not advance to the coder phase."
  - "This is a second, independent enforcement point from BP-1100a-1 so a ticket that bypassed refinement is still caught at drive time."
