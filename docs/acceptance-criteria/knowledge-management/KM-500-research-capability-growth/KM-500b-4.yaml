it_requirements:
- Reuse host.query_build, canonical gap records and typed query_candidate delivery through existing host transport
  and kernel run/resume. Do not introduce a parallel scheduler or accept host success as admission proof.
- Bind actual coding-agent delivery identity, interaction revision and authored candidate digest to the original
  need, immutable source and authorized scope. Preserve the host packet catalog, expected result and shared
  remaining budget.
- Trusted QueryAdmission must independently compile and execute verification on the actual scoped backend;
  only the dedicated catalog activation capability may persist it under write_query_catalog.
- An authored candidate generated for the issued gap is required for live-agent proof; BA-authored fixtures
  test mechanics only. Real host/provider unavailability or missing authorization remains not_run. No arbitrary
  submitted Cypher/Python execution.
- After matching admission, reopen checkpoints and a separate process catalog and prove same-need evidence
  plus fresh-run reuse. Denied activation, invalid candidates and replay must not dispatch another bypassing
  host.
- 'Before claiming guide-compliant real-agent readiness, explicitly resolve the architecture tension: the original
  guide prohibits inventing a graph query language, while the implemented bounded recipe compiler is a later
  selected design. Record the approved authoring boundary and its rationale; neither this AC nor existing fixture
  proof retroactively establishes original-guide compliance or authorizes arbitrary Cypher.'
test_required: true
test_rationale: Planned public-interface and separately labeled real-artifact proof covers the full observable
  obligation. Existing mechanism tests are reusable but do not establish real-agent, provider or deployment
  readiness. No planned test is represented as existing coverage.
