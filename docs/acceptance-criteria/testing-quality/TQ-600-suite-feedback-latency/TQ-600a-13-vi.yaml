notes: |
  UNDER-SPECIFIED, NOT INVENTED: PULL REQUESTS THAT ARE NOT PUSHED AFTER THE FLAG GOES UP.
  The approved design evaluates on open and on every push, which catches PRs opened after
  the failure. It does not catch a PR that was opened before the failure, passed, and is
  not pushed again: its last reported verdict is the earlier pass, and if that is what the
  required check reads, it is mergeable while the nightly is red. "Hold immediately" is
  therefore only true for PRs that are evaluated again. Closing this needs something that
  re-evaluates open PRs when the flag is raised (for example the nightly re-requesting the
  check on each open PR), which needs permissions and a design decision this record does
  not take. Flagged rather than written as a criterion.

  The "two or more open flags fails" clause is the safe direction for the consolidation
  question TQ-600a-13-iii leaves open.
