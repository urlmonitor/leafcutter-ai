notes: |
  ALREADY BUILT — DO NOT RE-IMPLEMENT. Shipped in f3ac950c / PR #536 without an
  AC to cite; this criterion is the retro-fit. work_status is left at todo only
  because its four covering tests still carry the stray BP-1100g-1 tag. Flip it
  to done in the same commit that re-points those tags, not before — a done
  claim whose covering tests cite a different AC is exactly the phantom-done
  shape this tree exists to prevent.

  MEASURED POPULATION AT 06ce1c43 (from the parent L1): 85 records with an
  authored demand and a non-code assignee, 308 discarded descriptors, 65
  approved, 37 approved-and-todo. By assignee: llm-expert 43, test-writer 13,
  documentation-expert 12, unassigned 9, business-analyst 4,
  test-failure-triage 2, architecture-diagram-author 2. The last Then clause
  ("every approved requirement in the real store") is a population sweep, not a
  fixture: a fixture-only proof reproduces the bias that hid this defect.

  WHY THE PHASE-LIST CLAUSE LIVES HERE AND NOT WITH THE DISPATCH AC. Naming the
  proof writer as owed is an act of the generation step and is built. Whether
  the named phase actually runs is TKT-500g-2 and is NOT built. Keeping them in
  one AC would hide the half that is missing.

  IT-PO NOTE 2026-08-25 — THE FIFTH DESCRIPTOR IS NOT ONE OF THE SEVEN. Four
  existing tests are named verbatim in test_spec so the re-tagging commit and the
  contract agree. test_test_runner_is_recorded_as_owed_alongside_the_writer is a
  new obligation: the generator does inject the proof runner, but nothing asserts
  it, so the phase-list clause is half-proven. Do not read the four re-tagged
  tests as discharging the fifth.
