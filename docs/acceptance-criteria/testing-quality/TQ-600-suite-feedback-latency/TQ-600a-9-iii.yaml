test_spec:
  - name: test_tq600a_9_iii_the_installer_file_starts_five_builds_not_eight
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "run_child_session() over unit_tests/build_guards/test_acd_2100d_2_i.py, no --splits, LEAFCUTTER_SHARED_LAYOUT_EXECUTION_LOG set"
    description: >-
      Run the file in ONE child session with the execution log set, and count the
      `deploy_executed` lines emitted by `_run_build()` at line 115. The count is 5, and
      all four classes pass.
  - name: test_tq600a_9_iii_one_classs_mutation_is_absent_from_every_other_copy
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "the four classes are handed one shared directory instead of four copies, so a mutation by one class is visible to the others — this is the author's recorded objection, and the test exists to answer it by execution"
      - "the copies are made by symlink or by reference rather than by content, so a write through one reaches the others"
    description: >-
      Mutate the copy one class holds, then inspect the copies the other three hold.
      None carries the mutation.
  - name: test_tq600a_9_iii_the_four_classes_agree_across_three_run_arrangements
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "run_child_session(), one child pytest session per arrangement (declaration order, reverse, each class alone)"
    description: >-
      Declaration order, reverse order, and each class alone, in SEPARATE child
      sessions so no arrangement inherits another's memoised install. Identical
      verdicts in all three. THIS IS THE DESCRIPTOR THAT DISCHARGES THE WRITTEN
      DECISION; without it the revision rests on an argument rather than a result.
  - name: test_tq600a_9_iii_each_class_still_fails_on_its_own_broken_announcement
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "breaking one class's announcement property leaves that class green, because the copied install supplies the property regardless of the behaviour under test"
      - "breaking one class's announcement property reddens more than one class, which means the four runs shared an install rather than each taking its own copy"
    description: >-
      Four runs, each in its own child session, each breaking only the announcement
      property one class names. Exactly one class is red in each run.
  - name: test_tq600a_9_iii_the_package_root_and_target_root_still_coincide
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    must_catch:
      - "the target root is pointed at a sibling of the package root, which makes the output-mapping computation fail and return an empty mapping — the exact condition this file inspects, so the file would pass for the wrong reason"
    description: >-
      Read the emitted install invocations — `_run_build()` takes package root and
      workspace as separate arguments, so the two are recoverable from the record — and
      assert the two roots resolve to the same tree.
test_rationale: |
  This file is the one place in the set where the cheap change contradicts something a
  previous author deliberately wrote down. The descriptor set is therefore built around
  discharging that objection in its own terms rather than around the saving: the
  independence descriptor and the three-arrangement descriptor together say precisely
  what the author's sentence says, and say it by running rather than by construction.

  The coinciding-roots descriptor is here because this file's expensive shape is
  mandatory, not accidental. A future reader optimising it will see a self-hosting
  build and reach for a directed one; that change makes the output mapping empty, which
  is the condition the file is looking for, so the file would pass for exactly the
  wrong reason.
