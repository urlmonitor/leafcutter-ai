it_requirements: |
  - Must wrap each create-ticket dispatch in try/catch — errors are non-fatal
  - On catch: log console.warn with test_id and error.message
  - Must push null into created_tracking_tickets as a sentinel for failed dispatches
  - Must also handle missing ticket_path in successful responses (push null + warn)
  - Loop must continue processing remaining entries regardless of individual failures
