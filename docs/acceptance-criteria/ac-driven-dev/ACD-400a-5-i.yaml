test_spec:
  - name: test_mixed_prerequisites_report_only_the_buildable_one_as_holding
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: boundary
    covers: [ACD-400a-5-i]
    description: "Writes a real on-disk C -> P -> R fixture chain where R lists both P (buildable, not done) and C (composite) as prerequisites, runs the real scanner entrypoint, and asserts R is held, that P is named as holding it, and that C is named nowhere in R's held account."
  - name: test_mixed_prerequisites_hold_is_not_lifted_by_the_composite_entry
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: failure
    covers: [ACD-400a-5-i]
    description: "Over the same fixture, asserts R is absent from ready — an implementation that decides per RECORD instead of per prerequisite (dropping the whole gate the moment any ancestor appears in the list) returns R as ready and fails here while passing every single-prerequisite test."
test_rationale: |
  This case exists because it is the only one that separates all three candidate
  implementations by their observable output, and because the two ways of getting it
  wrong are invisible in the parent's fixtures. The present code returns R as ready. A
  fix that deletes the ancestor exclusion returns R as held but names both P and C. A fix
  that narrows the exclusion correctly but applies it per RECORD rather than per
  PREREQUISITE — dropping the whole gate as soon as any ancestor appears in the list —
  also returns R as ready, and passes every single-prerequisite test the parent
  specifies. Only a per-entry rule passes both assertions here.
  The assertions are on the named blockers in the scanner's real output over a real
  on-disk fixture, never on the source text: the discriminating difference between the
  three implementations is one condition inside a comprehension and is invisible to any
  structural test.
notes: |
  WHY THIS IS AN L3 AND NOT A CLAUSE OF ACD-400a-5. The parent states the rule for a
  refinement whose prerequisite list is homogeneous — all buildable (R) or all composite
  (S). This case is the mixed list, and it is where the rule's GRANULARITY is decided: the
  exclusion has to be evaluated per prerequisite entry, because one record can name both
  kinds at once. That granularity is not derivable from the parent's clauses, which is
  exactly the test of whether an edge case deserves its own record.

  THE CHAIN IS REALISTIC, NOT CONTRIVED. A refinement that lists both its immediate parent
  and a composite further up is a shape the authoring agents produce today: ACD-400a-4
  itself carries depends_on [ACD-400a, ACD-400a-3] — a composite and a buildable
  prerequisite side by side, one level up from this exact chain.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L3; the IT
  PO sets assigned_agent, it_requirements, estimated_complexity and the contracts.
