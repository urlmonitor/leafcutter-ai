id: INF-700c-2-ii
components:
  - infrastructure
  - knowledge_system
title: "The waiting count stays truthful in the other direction — a real unwritten learning still raises it"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
priority: medium
readiness: approved
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700c-2.yaml"
criteria: |
  Given the count of knowledge still waiting to be written,
  And a record carrying real learning text that has been emitted and not yet
    written to any knowledge surface,
  When the count is produced,
  Then that record is counted, and the count is greater than zero,
  And a run over an input holding exactly one such record together with any
    number of honoured or content-free records reports exactly one outstanding,
  And the count reaches zero only when no record carrying learning text remains
    unwritten,
  And after the honoured body has been brought to its resting state, emitting
    one new record carrying learning text raises the count from zero to one on
    the very next run,
  And once that record has been written to its surface, the count returns to
    zero.
