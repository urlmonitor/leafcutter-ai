assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "CANONICAL SOURCE, ADR-001. The edit belongs in templates/hooks/check_exception_handling_hook.py. The deployed copies under .claude/hooks/ and .leafcutter/hooks/ are build.py outputs; a fix applied to a deployed copy alone is reverted by the next build."
  - "CHANNEL ONLY — DO NOT CHANGE WHAT IS DETECTED OR WHAT IS REFUSED. The RUFF_SELECT rule set, the exit codes, the message TEXT, and the skip conditions (non-.py, missing path, absent file, malformed payload) must all be byte-for-byte unchanged. The only behavioural difference is which stream the two blocking messages are written to."
  - "THE DOCSTRING IS PART OF THE DEFECT, NOT A SEPARATE TIDY-UP. The module docstring's 'PostToolUse hook contract' block states 'Exit 2 with text on stdout = block the next step and show the text'. That sentence is the reason the code was written this way, so correcting the code without correcting the sentence leaves the next author a documented instruction to reintroduce the bug. Fix both in the same change."
  - "TESTS MUST EXECUTE THE HOOK AS A PROCESS. Assert on the CompletedProcess's .stdout and .stderr separately, from a real subprocess invocation with a JSON payload on stdin — the existing _run_hook helper in unit_tests/commit_guardian/test_exception_hook.py already does exactly this. A test that greps the hook source for 'file=sys.stderr' passes on dead code and cannot tell a routed message from an unrouted one."
  - "TWO EXISTING TESTS ENCODE THE DEFECT AND MUST BE CORRECTED IN THE SAME CHANGE: test_bare_except_triggers_block asserts 'E722' in result.stdout, and test_ruff_not_found_produces_install_message asserts the install text in result.stdout.lower(). Both must move to result.stderr. They are not collateral damage — they are why the defect survived, and leaving them would make the fix fail its own suite."
  - "ASSERT THE EMPTY STDOUT, not only the populated stderr. An implementation that writes the message to BOTH streams satisfies a stderr-only assertion while leaving the discarded duplicate in place; the stdout assertion is what forbids it."
  - "Error-handling policy per CLAUDE.md applies: the existing OSError fail-open branch must keep its specific exception type and must continue to exit 0, not 2."
delivers_to: null
expects_from:
  ac_id: GE-108
  contract: "The two sys.exit(2) branches of main() in templates/hooks/check_exception_handling_hook.py — the FileNotFoundError (ruff absent) branch and the returncode != 0 (violations found) branch — each of which currently calls bare print() for its message."
test_spec:
  - name: test_violation_block_message_goes_to_stderr_not_stdout
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A temp .py file holding a bare `except:` is named in a PostToolUse payload and the hook runs as a subprocess with ruff available. Asserts exit code 2, 'E722' present in result.stderr, and result.stdout empty. RED today — the message is on stdout."
  - name: test_ruff_not_found_install_message_goes_to_stderr_not_stdout
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The hook runs as a subprocess with PATH emptied so ruff cannot be found. Asserts exit code 2, the install instruction present in result.stderr, and result.stdout empty. RED today — the instruction is on stdout."
  - name: test_clean_and_skipped_files_stay_silent_on_both_streams
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A clean .py file and a .md file each produce exit 0 with both stdout AND stderr empty. GREEN ON ARRIVAL — a regression guard proving the channel change did not start emitting noise on the silent paths, not evidence the fix landed."
test_rationale: |
  Every arm runs the hook as a real subprocess and reads the two streams
  separately, because the whole content of this record is WHICH STREAM a
  message lands on — a distinction that is invisible to any test asserting on
  combined output, and invisible to any test that reads the hook's source.

  Each refusal arm asserts BOTH that stderr carries the message AND that
  stdout is empty. The second half is not redundant: writing to both streams
  would satisfy a stderr-only assertion while leaving the discarded copy in
  place, which is a plausible and wrong implementation of "route it to
  stderr".

  RED-VS-GREEN HONESTY. The two refusal arms are RED today. The
  silence arm is GREEN on arrival and is a regression guard by design — a
  red-baseline gate for this record must be satisfied by one of the two
  refusal arms, never by the silence arm.
