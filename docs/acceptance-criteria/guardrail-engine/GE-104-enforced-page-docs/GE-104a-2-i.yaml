it_requirements:
  - "OPEN QUESTION RESOLVED -> option (b): express as an llm-type condition. Rationale: the DSL evaluator (scripts/selection_criteria_evaluator.py) parses only atoms of the form '<field> <op> <value>' where op in {contains, equals, matches} over {files_touched, title, description, components}, combined with AND/OR. It has NO negation operator and NO mechanism to correlate one files_touched entry (a page) with the absence of a DERIVED second entry (its doc). Therefore the negated/derived-path relationship is NOT expressible as a dsl-type expression today. Option (c) extend-the-grammar is rejected as disproportionate to a single trigger (it would add negation + a page->doc derivation primitive to a shared, version-pinned evaluator)."
  - "Author the documentation-expert trigger as { type: 'llm', expression: <natural-language judgment> } in config/agent_registry.json. The expression must instruct the judge to fire iff files_touched adds a NEW site/app/**/page.tsx AND the page's derived docs/reference/frontend/<name>.md (per the shared derivation rule from GE-104a-1-i / GE-104a-1-ii) is NOT present in files_touched."
  - "Behavioral equivalence requirement: regardless of mechanism, the observable outcomes must be: (1) new page + no derived doc in files_touched -> documentation-expert resolves to 'needed'; (2) new page + its derived doc both in files_touched -> this trigger does NOT fire; (3) no new page -> this trigger does NOT fire."
  - "The llm-type condition relies on the LLM-judgment evaluation path. Per selection_criteria_evaluator.py, llm-type conditions currently raise LLMEvaluationRequired and the business-analyst caller falls back to default_status (not_needed) when the LLM path is unwired. Note this as a known limitation: until the LLM evaluation path is wired, the planning-time trigger degrades to not-firing (the commit-time hook GE-104a-1 remains the hard backstop). The commit-time enforcement is the authoritative guarantee; planning-time is advisory."
  - "DEFERRED SPIKE (genuinely open): if the 'new-page-without-derived-doc' pattern recurs for other artifact types, evaluate adding a first-class DSL primitive (e.g. a 'derived_missing' operator or a NOT combinator) to selection_criteria_evaluator.py and documenting it in ADR-018. Out of scope for GE-104; do not extend the grammar as part of this work."
