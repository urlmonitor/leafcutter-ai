criteria: |
  A single two-stage control with an instant, one-commit rollback.

  One control governs the rollout in two safe stages -- first the new tickets and sign-offs are
  produced, then the checks begin to require them -- and the stricter stage can only be switched
  on once no old-style requirements remain. If anything goes wrong, flipping the control back
  restores the previous behaviour in a single commit, with no code to unwind.
