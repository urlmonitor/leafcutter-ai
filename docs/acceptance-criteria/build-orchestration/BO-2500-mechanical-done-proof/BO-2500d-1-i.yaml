roadmap_phase: phase_1
criteria: |
  Given a change proposes removing an opinion-only gate agent from the fast-lane phase
    order while its mechanical proof-of-done replacement is not yet present in that
    phase order,
  When the phase-order change is validated,
  Then the removal is rejected
  And the rejection states that the mechanical replacement gate must exist in the fast
    lane before the opinion-only gate can be removed.
