expects_from:
  - ac_id: INF-500d-3
    contract: "The vocabulary file templates/scripts/feedback/submit_failure_reasons.json (deployed to <output root>/scripts/feedback/submit_failure_reasons.json): five objects {id: string, meaning: string, record_written: boolean, detected_by: 'script' | 'caller'} with ids writer-not-allowed, malformed-submission, facility-unavailable, destination-unwritable, written-uncited. On every failure exit the script controls, the error stream carries one line 'submit-failed:<reason>:<category>', standard output stays empty and the exit status is non-zero. A successful run carries no such line. The marker form is 'feedback-id: (submit-failed:<reason>:<category>)', with <category> the --category value or '-'. Capture precedence: stdout id; id in the recovery file named by the run's own 'sidecar:' line; the run's 'submit-failed:' line; written-uncited when a 'sidecar:' or '[submit_feedback] sink:' line exists but no id was recovered; otherwise facility-unavailable. Must land in the same PR as this record or before it."
  - ac_id: INF-500d-3-ii
    contract: "Per-run error-file naming rule: /tmp/feedback_err_<ticket_basename>_<agent_name>.txt, with <ticket_basename> the ticket file's name (for example 03-add-parser.md). A fixed-phase surface writes its phase as a literal, and an event-kind surface adds _<event-kind> (for example /tmp/feedback_err_<ticket_basename>_ticket-supervisor_halt.txt). The name is one path component and is checked by unit_tests/feedback/_inf_500d_3_ii_check.py. Each recovery search reads that same per-run file and nothing else. Done; the shared sign-off block and python-coder are not yet under the rule."
  - ac_id: INF-500d-3-vi
    contract: "epic-supervisor's cross-ticket pattern submission is a runnable shell command whose error stream goes to /tmp/feedback_err_<ticket basename placeholder>_epic-supervisor_cross-ticket-pattern.txt, where the ticket is the same affected ticket the --ticket argument names. No epic-supervisor step sends a submission's error stream to /dev/null."
