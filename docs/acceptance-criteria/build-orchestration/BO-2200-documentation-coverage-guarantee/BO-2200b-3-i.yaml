    status: exists
assigned_agent: llm-expert
estimated_complexity: S
it_requirements: |
  Refine the documentation-verifier template so placeholder detection keys on placeholder
  SIGNATURES (heading-only, residual tokens, TODO/TBD), not on length. A legitimately short
  doc must pass; brevity is not a stub. Avoid instructing any naive minimum-character rule
  that would false-fail concise real docs.
