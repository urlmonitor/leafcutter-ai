criteria: |
  Given the build-time guard has detected 3 broken script references,
  When the guard emits the error report,
  Then all error output is written to stderr (not stdout)
  And the output is structured as one JSON object per line (JSONL format)
  with keys "missing_path", "referencing_template", and "suggested_action"
  And the process exits with a non-zero exit code
  And stdout contains no error output (so piped build output is not polluted)
