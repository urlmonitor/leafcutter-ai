criteria: |
  Open any screen component and it names the requirement it serves.

  Every file that builds part of a screen carries, in its own words, the
  acceptance criterion or criteria it exists to satisfy — so a reviewer opening
  it knows immediately what it was supposed to prove, whichever front-end
  technology it happens to be written in.
