risk_surface: internal
notes: |
  Authored to satisfy TQ-500e's reference-doc documentation trigger, and standing in for
  the same trigger on TQ-500a, TQ-500b, TQ-500c and TQ-500d. All five ask for a
  reference to one record format and one set of states; five copies would drift, and the
  drift would land on the reader trying to check an answer. Recorded here rather than by
  amending the L1s, whose text is the product owner's.

  THIS AC'S DELIVERABLE IS THE DOCUMENT, AND ONLY THE DOCUMENT. It is deliberately not a
  proxy for any behavioural check in this tree. No behavioural AC here may be closed by
  pointing at this reference, and a state being named in it is not evidence that anything
  produces that state.

  THE FOURTH CLAUSE IS UNUSUAL FOR A REFERENCE AND IS DELIBERATE. A record format
  documented without the failure that motivated it is followed while the reason is
  convenient and dropped when it is not. The incident is short, concrete, and the only
  thing in the corpus that makes the per-test requirement look necessary rather than
  fussy.
