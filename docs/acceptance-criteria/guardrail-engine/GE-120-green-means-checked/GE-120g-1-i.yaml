notes: |
  WHY THIS IS ITS OWN RECORD AND NOT A CLAUSE OF THE PARENT. Both mutations below turn ONLY
  this record red; the parent stays green under each. That asymmetry is the test for whether
  a candidate belongs in its own file, and it holds here: an implementation can hold every
  judging check to the rule (parent green) while either breaking the six checks that fix as
  they go, or quietly growing a waiver list.

  FIRST NAMED MUTATION — EXECUTE IT. For the clause "the alteration that check makes is not
  reported as a breach". This clause asserts an absence and is green on any implementation
  that enforces nothing. INJECTION: apply the leave-it-as-you-found-it requirement to every
  registered check regardless of the role it declares. Under that injection an ordinary
  commit of a change that a fixing check repairs must be REFUSED, this record must go RED,
  and the parent must stay GREEN. Revert must restore the completed commit. This is the
  cheap over-correction a hasty implementation reaches for — a blanket rule over all 62 —
  and it breaks six working checks in a way no clause of the parent can see.

  SECOND NAMED MUTATION — EXECUTE IT. For the clause "there is no entry, flag, list or
  ground by which one can be". INJECTION: add a place where a check may be named as exempt
  from the rule and put one judging check on it, leaving its declared role unchanged. Under
  that injection the exempted check may alter the working copy during an ordinary commit
  while still declaring that it judges; this record must go RED naming that check, and must
  return to green on revert. Without this injection the clause is satisfied by an
  implementation that has simply never been asked for an exemption.

  SEEDING APPLIES HERE TOO AND IS NOT REPEATED IN FULL. Both mutations need the fixture the
  parent describes — the fresh-install shape with nothing excluded from version control, and
  the byproducts made tracked content by running one check FIRST and adding afterwards. This
  repository cannot be that fixture as it stands. Read the parent's notes before building
  either descriptor; a mutation run against an unseeded working copy passes and means
  nothing.

  WHY THE SECOND CLAUSE IS NOT A PER-CHECK WAIVER IN DISGUISE. The parent's rule is scoped by
  a declaration the manifest already carries, and this record is what keeps that scoping
  honest in both directions: a fixing check is out of scope because of what it declares, and
  a judging check cannot be taken out of scope by anything at all. An exemption registry is
  precisely the silent opt-out the tier cut was chosen to close, and this component already
  has two such registries for other purposes — which is why the injection is realistic rather
  than hypothetical.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. Those are the IT PO's.
