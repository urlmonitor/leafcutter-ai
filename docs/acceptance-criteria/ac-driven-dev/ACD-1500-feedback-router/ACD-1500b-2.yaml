id: ACD-1500b-2
readiness: approved
priority: medium
title: "Classifications below the confidence floor are parked, not auto-acted"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the configurable confidence floor is set to 0.75,
  And entry F1 was classified with confidence 0.60,
  And entry F2 was classified with confidence 0.90,
  When the router applies the confidence-floor gate,
  Then F1 (below the floor) is parked for human /feedback-review and is NOT
    dispatched to /quick-fix or /create-ac,
  And F2 (at or above the floor) is allowed to proceed to its routing destination,
  And the floor value is read from configuration rather than hard-coded,
  And each parked entry records the reason "confidence 0.60 below floor 0.75".
depends_on: [ACD-1500b, ACD-1500b-1]
doc_links:
  - path: docs/architecture/feedback-lifecycle.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-006-flatten-supervisor-chain.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "CONFIG PREREQUISITE: the confidence floor must be read from a NEW config file config/feedback_router.yaml under the key confidence_floor (a float, default 0.75). This config file does not exist yet and must be created as part of this AC; do NOT hard-code the floor in feedback-router.js"
  - "The gate lives in feedback-router.js and runs AFTER the blocker override (ACD-1500b-3) so a high confidence can never bypass a blocker park"
  - "A parked entry must record a reason string naming the actual confidence and the floor (e.g. 'confidence 0.60 below floor 0.75') and must NOT call resolve_feedback.py (parking leaves the entry unresolved per ACD-1500b-4)"
delivers_to: null
