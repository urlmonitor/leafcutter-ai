notes: |
  This is the gap through which the entire guard is defeated in one line. If the finishing
  specialist can declare its own step a no-op, a parked specialist declares itself one — and
  it will, because "there was nothing for me to do" is exactly the shape of reply a parked
  specialist produces. The verdict would then be read from the reply again, which is the
  precise failure BO-3100b-1 exists to end, re-entering through the exemption instead of
  through the judgement.

  THE DECLARATION MUST PRE-DATE THE RUN. The second scenario says "before the step runs" for
  that reason: a declaration that can be added at exit time is the same hole with an extra
  step. Whatever medium the IT PO chooses under BO-3100b-3, it must be fixed at the point the
  step is dispatched.

  Verification must run the real step lifecycle twice with the same unchanged project state
  and different declaration provenance, and compare the outcomes. A test that inspects how a
  declaration is parsed passes on an implementation that also accepts one from the reply.

  IT-PO ENRICHMENT NOTE (2026-08-26). "Fixed at the point the step is dispatched" is made
  mechanical by requiring the judgement to read a dispatch-time SNAPSHOT of the contract rather
  than the live object. Without that, the medium chosen under BO-3100b-3 satisfies the letter
  of "declared on the contract" while remaining writable by the running step — the same hole
  the BA identified, one indirection further in.
