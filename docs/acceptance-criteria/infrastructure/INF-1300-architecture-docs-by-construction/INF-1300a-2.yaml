test_rationale: >-
  Every other record in INF-1300a is about what is written at the destination; this one
  writes into a neighbour, and the failure modes of writing into a neighbour — clobbering
  the other children, reflowing the parent's frontmatter, editing the wrong parent, leaving
  a truncated parent behind a crash — are invisible to any child-only inspection. A
  producer that emits a perfect child and never touches the parent passes a unit test on
  the emitter and fails the real check. Two of this record's descriptors are therefore
  whole-file diffs of the PARENT, and one is a negative control that exists solely to prove
  the parent-link hook resolved the pair at all: its REPO_ROOT is a module-level constant
  taken from the hook file's own grandparent, so in a tmpdir scratch repo it returns an
  empty violation list and exits 0 without reading either document.
delivers_to:
  agent: python-coder
  contract: "The parent-link writer: given a produced document path and a parent path, it emits `parent: <repo-relative-path>` into the child's frontmatter, a `Parent: [<parent frontmatter title>](<relative-path>)` line placed after the first mermaid fence closes, and inserts one entry into the parent's existing `children:` sequence in place. Refusal contract: on an absent or not-strictly-higher-tier parent it writes nothing anywhere and exits non-zero. Consumed by INF-1300a-2-i, which constrains the same writer on the no-parent input."
expects_from:
  ac_id: INF-1300a-1
  contract: "The generator CLI and the in-tree scratch harness described in INF-1300a-1's delivers_to — specifically the per-hook {hook_id, exit_code, examined, stderr} record, without which a parent-link pass cannot be distinguished from a parent-link no-op."
notes: |
  WHY THIS IS A SEPARATE RECORD AND NOT A CLAUSE OF INF-1300a-1. It is the only place in
  this tree where producing a document CHANGES A DOCUMENT THAT ALREADY EXISTS. Everything
  else in INF-1300a is about what is written at the destination; this writes into a
  neighbour, and the failure modes of writing into a neighbour — clobbering the other
  children, rewriting the parent's frontmatter, editing the wrong parent — do not exist
  anywhere else in the tree and cannot be observed by a-1's criteria.

  FALSIFIABILITY. In a scratch collection, stage a parent document that already lists two
  children. Produce a new document naming it as parent. Then run the project's
  two-directional link check over both files as the project runs it, and read the parent:
  the record is falsified if the check reports anything, if either of the two existing
  children has gone, if any other line of the parent differs, or if the new document's
  prose reference names the parent's filename rather than the title the parent declares
  for itself. It is also falsified by an observation that checks only the new document —
  the reciprocal half lives in the parent, and a producer that writes a perfect child and
  never touches the parent passes any child-only inspection while failing the real check.
  Do not accept a pass from a check invoked with the file as an argument without first
  confirming the check actually examined it; the hooks in this project read the staged
  index, and a check that examined nothing exits zero.

  THE WIDENED INPUT, STATED PLAINLY. The pinned invocation has no argument for the parent.
  This record requires one, and INF-1300a's notes record why that is the honest route
  rather than bounding the promise: the author already knows which document sits above,
  the authoring surface already obliges them to identify it, and a producer that emits a
  document which fails the parent check on its first commit attempt has reproduced the
  present situation with extra steps. The seven pinned arguments are unchanged; this is an
  addition, and INF-1300b-4 and INF-1300e-2 are the records that keep the two authoring
  surfaces in agreement with it.

  DELIBERATELY NOT OWNED HERE: what the refusal for an absent or wrongly-tiered parent
  says and what state it leaves behind. That contract is INF-1300d-3's, and this record
  requires only that the refusal happens rather than a document being produced.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
