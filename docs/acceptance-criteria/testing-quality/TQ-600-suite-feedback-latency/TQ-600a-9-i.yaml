notes: |
  A correct 60-second test beats a fast wrong one. This record is where that principle
  becomes checkable: it is the only place in this branch of the tree that can detect
  the failure in which the suite gets faster and quieter at the same time.

  The four-way group in the colliding-capability file is the worked example throughout
  because its four assertions are the most plausibly collapsible in the set — survival,
  message, declared winner, cross-platform winner, all read off one produced tree. If
  the discrimination holds there, it holds for the two-way and three-way groups.
