notes: |
  Bound to ACD-300a-3 (triage detects already-covered requests): this narrows "existing
  ACs" to exclude the resuming run's own output; it does not change how coverage by other
  runs is detected. Sibling of ACD-2100c-3-iii, which made the leftover-recovery scan
  exclude a run's own UNCOMMITTED drafts; this is the same defect for COMMITTED criteria
  at the triage step. Run-ownership evidence must survive a crash that left no pause
  record -- see ACD-1300e-1-i.
