title: "Half-succeeded artifact creation must not mark the entry resolved (atomicity)"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given entry F1 was routed to /create-ac,
  When the artifact creation does not complete successfully (no usable artifact
    id is produced, or resolve_feedback.py itself fails),
  Then the router does NOT set resolved_at on F1,
  And F1 remains in the unresolved set so a future run or a human can address it,
  And the router records the failure with enough detail to retry,
  And there is never a state where F1 is marked resolved while pointing at an
    artifact that was not actually created.
depends_on: [ACD-1500c-1]
