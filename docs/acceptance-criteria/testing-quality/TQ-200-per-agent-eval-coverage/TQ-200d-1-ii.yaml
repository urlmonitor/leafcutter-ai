it_requirements:
  - >-
    The registry of kinds is produced_tests_scoring.KINDS (scripts/evals/produced_tests_scoring.py), which
    spreads in produced_tests_db.KINDS (itself spreading produced_tests_commands.KINDS and produced_tests_reports.KINDS),
    sql_test_writer_eval.KINDS and designer_eval.KINDS. 31 kinds are registered on 2026-10-30. The drift
    test imports that mapping; it never reads a hand-kept list.
  - >-
    Layout decision (IT PO, 2026-10-30, pending the user's answer to the page-split OQ): the document-length
    standard refuses a page over 300 lines or 25 sections, and 31 entries with two examples and a quote
    each need roughly 700 lines. The reference is therefore one hub page plus four family pages with the
    shared prefix, following the kernel-request-splitting and knowledge-retention precedent in docs/reference/.
    Each kind is assigned to the family page of the module that registers it. Each page stays within 300
    lines and 25 sections.
  - >-
    Entry format: heading '### `<kind>`'; labelled parts Used by, Reads (one of: produced test files,
    the completion report, the recorded commands, the to-run-later file, the edited requirement record,
    a wrong-version run verdict), Passes when, Fails when, Passing example, Failing example, Template
    sentence. The template sentence is a blockquote of the exact sentence from templates/agents/<agent>.md
    followed by the template path, so the test can find and match it. A kind that checks no template sentence
    says 'Template sentence: none' and why.
  - >-
    DOCUMENTATION (this AC's deliverable) - the hub page (type reference, frontmatter title, description,
    components [testing_quality], related_docs) must state: what an assertion kind is, that a row's expected.assertions
    lists kinds by name, that every kind is deterministic and none calls a model, the four family pages
    with the agents each serves, and that the drift tests keep the pages equal to the registry and the
    quotes equal to the templates. Each family page carries the same frontmatter shape and links back
    to the hub.
  - >-
    DOCUMENTATION - scripts/evals/README.md's 'Produced-tests mode (local only)' section replaces the
    inline list of kind names with a link to the hub page, and keeps its other bullets. docs/reference/README.md
    gains one line for the hub page under 'Testing, Proof & False-Green Discipline' and its '22 files'
    count sentence is corrected to the real count. docs/INDEX.md is regenerated by build.py and restaged.
    CLAUDE.md needs no change.
  - >-
    DOC-DRIFT TESTS (part of done), in unit_tests/evals/tq200d1ii/ (unit_tests/evals/ is one file below
    the density cap): (1) the union of '### `<kind>`' headings over the four family pages equals KINDS.keys(),
    with no kind on two pages; (2) every quoted template sentence appears verbatim (whitespace-normalised)
    in the template it names; (3) every entry has all seven labelled parts; (4) the README links the hub
    and lists no kind names; (5) the reference index lists the hub exactly once.
  - >-
    GLOSSARY: new terms in the docs this AC writes ('assertion kind', 'produced-tests mode', 'family page')
    reach docs/glossary.md only through the check-glossary-coverage hook and the glossary-triage flow;
    no entry is added by hand (CLAUDE.md).
  - >-
    CHANGELOG: one entry for TQ-200d-1-ii written with scripts/changelog/emit_entry.py (type manual, components
    [testing_quality]) into changelogs/, naming the hub page, the four family pages and the README change.
test_spec:
  - name: test_every_registered_kind_has_exactly_one_entry
    target_dir: unit_tests/evals/tq200d1ii/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The set of '### `<kind>`' headings over the four family pages equals produced_tests_scoring.KINDS.keys(),
      and no kind has an entry on two pages.
    must_catch:
      - kind registered with no entry on any page
      - entry left on a page for a kind no longer registered
      - one kind given entries on two family pages
    in_scope_files:
      - docs/reference/produced-tests-eval-assertion-kinds-test-writer.md
      - docs/reference/produced-tests-eval-assertion-kinds-database-setting.md
      - docs/reference/produced-tests-eval-assertion-kinds-sql-test-writer.md
      - docs/reference/produced-tests-eval-assertion-kinds-test-designer.md
      - scripts/evals/produced_tests_scoring.py
  - name: test_quoted_template_sentences_appear_verbatim
    target_dir: unit_tests/evals/tq200d1ii/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      Every blockquoted template sentence on the family pages appears, whitespace-normalised, in the template
      file the entry names.
    must_catch:
      - quoted sentence reworded on the page but not in the template
      - quote attributed to the wrong template
    in_scope_files:
      - docs/reference/produced-tests-eval-assertion-kinds-test-writer.md
      - docs/reference/produced-tests-eval-assertion-kinds-database-setting.md
      - docs/reference/produced-tests-eval-assertion-kinds-sql-test-writer.md
      - docs/reference/produced-tests-eval-assertion-kinds-test-designer.md
  - name: test_every_entry_has_all_required_parts
    target_dir: unit_tests/evals/tq200d1ii/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      Each entry carries Used by, Reads, Passes when, Fails when, Passing example, Failing example and
      Template sentence.
  - name: test_evals_readme_links_the_hub_and_lists_no_kind_names
    target_dir: unit_tests/evals/tq200d1ii/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      scripts/evals/README.md links the hub page (link resolves) and contains no registered kind name
      in its produced-tests section outside the per-rule lines that link an entry.
    must_catch:
      - README still lists the kind names inline
    in_scope_files:
      - scripts/evals/README.md
  - name: test_reference_index_lists_the_hub_once
    target_dir: unit_tests/evals/tq200d1ii/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      docs/reference/README.md links produced-tests-eval-assertion-kinds.md exactly once and each family
      page links back to the hub.
test_rationale: >-
  This AC's deliverable is documentation whose value is that it cannot drift, so every test reads the
  real pages, the real registry and the real templates. The 2026-10-25 scorer defects were each a check
  stricter than the template sentence it checks; the quote test makes that sentence visible next to the
  rule, and the registry test keeps every kind documented as later ACs add or change kinds.
