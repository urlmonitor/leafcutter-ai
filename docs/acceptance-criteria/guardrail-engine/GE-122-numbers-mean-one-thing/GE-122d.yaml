criteria: |
  Caught as you write, again when you commit, and once more with no way around it.

  The same numbering rule is applied while the work is being authored, again when
  the work is committed, and a final time in the shared build that nobody can
  skip — so a clash is caught at the earliest, cheapest moment, and cannot reach
  the shared history by taking a shortcut past the earlier stages.
