created_by: "docs/acceptance-criteria/build-orchestration/BO-1600-safe-concurrent-dispatch/BO-1600a.yaml"
criteria: |
  Given supervisor A holds the git write guard and is partway through writing its
    commit's objects and index update
  And supervisor B reaches its own commit phase and requests the git write guard
  When supervisor B requests the guard while A still holds it
  Then supervisor B blocks (waits) without writing any git object or touching the
    index until A releases the guard
  And when A releases the guard, B acquires it and performs its full commit
  And both commits are present in the repository history afterward with neither
    commit lost nor overwritten
