criteria: |
  Given feedback.jsonl contains entries spanning at least 14 days,
  When trend_report.py is run with --trend week,
  Then the output includes a trend indicator for each category:
    "rising" when the current 7-day count exceeds the previous 7-day
      count by more than 20 percent,
    "falling" when the current 7-day count is more than 20 percent
      below the previous 7-day count,
    "stable" when the difference is 20 percent or less.
