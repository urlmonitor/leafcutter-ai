estimated_complexity: M
it_requirements:
  - "WHERE THE FIELD GOES. One new key per entry of hooks_manifest.hooks[] in templates/scripts/commit_guardian/commit_guardian.json. build_commit_guardian() deploys that manifest TWICE — to scripts/commit_guardian/commit_guardian.json (the runner's copy) and to config/commit_guardian/commit_guardian.json (the authoritative copy). Both are generated from the one template: edit the template only, then run build.py and confirm both deployed copies carry the field."
  - "PASS_FILENAMES IS NOT THE DISCRIMINATOR AND MUST NOT BE USED AS ONE. 52 of the 54 entries in today's manifest carry pass_filenames: false while only a handful derive a diff at all. A predicate built on it sweeps in dozens of checks with no change set to narrow and still misses a check that is handed filenames and derives a diff anyway. The source is a declared value, full stop."
  - "EVERY ENTRY MUST CARRY THE FIELD; ABSENT IS NOT A DEFAULT. An entry with no recorded source is a determination FAILURE, so the next hook added without one is blocked when it is added rather than silently classified. Defaulting the field is the same decay this AC exists to stop, one release later."
  - "DO NOT BREAK THE MANIFEST'S EXISTING CONSUMERS. scripts/build_precommit.py generates .pre-commit-config.yaml from these entries and templates/scripts/commit_guardian/check_hook_parity.py compares the generated config back to the manifest. After adding the key, run build.py and confirm .pre-commit-config.yaml is unchanged apart from intended edits, and that check-hook-parity still passes."
  - "THE DETERMINATION MUST ACCEPT AN EXPLICIT MANIFEST PATH AND HONOUR IT. Without that, this AC's own coverage note — exercise against a fixture manifest, not today's — is untestable. This repository has a recorded history of AC hooks that ignore argv and read only the installed artefact, which makes them fail open and impossible to exercise; do not repeat it."
  - "REUSE GE-120c-3'S MANIFEST-READING CALLABLE. Two manifest readers will disagree and the disagreement will be settled by whichever is quieter. One reader, two questions."
  - "DO NOT HARD-CODE THE ENTRY COUNT ANYWHERE — not in the code, not in a test, not in a docstring. It was 54 when this AC was written and moves with every addition; a pinned number fails for the wrong reason and gets edited to match rather than investigated."
  - "FAILURE OUTPUT NAMES THE OFFENDERS. The determination exits non-zero and names each check whose recorded source is missing or contradicted, not just a count."
  - "LATENCY BUDGET. This runs at commit time. A full manifest pass must complete in under 200 ms and must not spawn a subprocess per entry."
test_spec:
  - name: test_ge120e2_candidate_set_is_read_from_the_manifest_at_run_time
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Run against a fixture manifest, the determination's candidate set is exactly that fixture's entries — no hand-written check list."
  - name: test_ge120e2_recorded_source_decides_membership_not_pass_filenames
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A fixture entry with pass_filenames false but a recorded handed-its-files source is excluded from the governed set."
  - name: test_ge120e2_entry_with_no_recorded_source_is_named_and_fails
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A fixture entry missing the field makes the determination report a failure naming that entry — absent is not a default."
  - name: test_ge120e2_self_deriving_entry_not_using_the_shared_source_is_named_and_fails
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A fixture entry recorded as self-deriving whose check obtains its change set by other means is named and the determination exits non-zero."
  - name: test_ge120e2_determination_honours_an_explicit_manifest_path
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Given a fixture manifest path the determination reads that file and not the installed manifest — the fail-open argv trap is absent."
  - name: test_ge120e2_result_is_independent_of_the_number_of_manifest_entries
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Fixtures with different entry counts produce correct results — no count is hard-coded."
  - name: test_ge120e2_added_field_leaves_precommit_config_generation_and_hook_parity_intact
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "With the new per-entry key present, build_precommit produces the same .pre-commit-config.yaml and check_hook_parity still agrees."
test_rationale: "The manifest fixture is the criterion, not a convenience: a test run against today's manifest asserts that the checks registered today are correctly recorded, which is true on the day it is written and can never fail on the day the next self-deriving check is added — the day this AC exists for. So every case drives the determination with an explicit fixture manifest path, which is also why 'honours the path it is given' is itself a test: this repository has shipped AC hooks that ignored argv and read the index instead, and such a determination is both fail-open and unexercisable. The last case is a regression guard rather than a criterion clause — adding a key to hooks_manifest.hooks[] feeds two other generators, and a green determination beside a corrupted .pre-commit-config.yaml would disable the whole hook family."
