id: BO-4300e-2-iii
title: "Clearing removes only this project's own workspaces, and stops before deleting when the shared line cannot be removed"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given project P with a ready workspace "alpha" whose line of work also exists on
    the shared project,
  And a folder outside P's landing place for workspaces that carries a copy of a
    workspace record naming P,
  And a ready workspace that belongs to another project Q,
  When clearing is requested for P, naming the outside folder by its location and
    then Q's workspace by its location,
  Then both requests are refused as not one of P's workspaces,
  And the outside folder and Q's workspace are identical before and after,
  And when "alpha" is cleared together with its line on the shared project while
    the shared project refuses to delete that line, the request is refused naming
    that step,
  And "alpha" and its line on the shared project are both identical before and
    after that refusal.
depends_on: [BO-4300e-2, BO-4300b-2-i]
