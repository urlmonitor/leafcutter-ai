criteria: |
  Each requirement links to the work that fulfilled it -- traceable both ways.

  When work is derived from a requirement, the requirement records a link back to
  what delivered it, so provenance is traceable in both directions. You can always
  get from a requirement to the work that fulfilled it, and back again.
