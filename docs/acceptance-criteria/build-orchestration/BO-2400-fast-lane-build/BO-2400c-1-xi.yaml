risk_surface: internal
notes: |
  Authored by /quick-fix. Root cause: The bundle is written with print() to sys.stdout, whose encoding is the locale code page (cp1252) on Windows when stdout is a pipe; bundle text containing characters outside cp1252 (emoji in agent/skill docs) cannot be encoded. The bundle must be written to stdout as UTF-8 regardless of locale (e.g. sys.stdout.buffer.write(bundle.encode('utf-8')) or reconfiguring stdout to utf-8 before printing), keeping the byte-for-byte output contract (bundle and nothing else on stdout) unchanged..

  Placed as an L3 under BO-2400c-1 because the L1 BO-2400c is at its raised cap of 6
  L2 children and this is a technical constraint on the already-specified command
  surface (BO-2400c-1-ii), not a new L2 behaviour.
