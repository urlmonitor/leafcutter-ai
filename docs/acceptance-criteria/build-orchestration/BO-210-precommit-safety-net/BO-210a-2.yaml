id: BO-210a-2
components:
  - build_orchestration
readiness: approved
priority: high
title: "A blocking_hook_ids array is the single authority on which hooks gate a commit"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  Given the reconciled routing config,
  When a reader inspects it for the list of gating hooks,
  Then the config contains exactly one blocking_hook_ids array,
  And that array lists the gating hook ids: check-complexity, check-docstrings,
    check-exception-handling, check-file-size, check-ac-schema, check-ac-limits,
    and check-contract-shrinking,
  And no other field in the config independently determines whether a hook gates a commit,
  And a hook id absent from blocking_hook_ids is treated as non-gating by any reader,
  And given each id on that array is offered to a reader as a hook that gates a
    commit,
  When a change that violates what that hook checks is committed,
  Then the commit is blocked by that hook — an id earns its place on this array by
    being reached at commit time, never merely by appearing on it,
  And given an id on the array that no commit-time invocation reaches,
  When the array is read to decide which hooks gate a commit,
  Then that id is named as approved-but-unreached and the discrepancy fails — an
    id this array approves as gating, while nothing invokes it, is never left
    sitting on the list indistinguishable from the ids that do block a commit.
depends_on: [BO-210a, BO-210a-1]
