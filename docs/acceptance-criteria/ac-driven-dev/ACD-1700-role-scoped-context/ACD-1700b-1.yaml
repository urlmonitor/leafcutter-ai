notes: |
  Recurring documented failure (memory/feedback_itpo_agent_assignment_by_surface.md):
  the BA tends to stamp python-coder uniformly. Positive mapping in ACD-1700b-2.

  DECISION RESOLVED (2026-08-11, BrainCandy) — the check is MAP-based, not
  extension-based, to avoid false-flagging legitimate python-coder .js-workflow ACs.
  Pinned surface->craft map (path-aware; first match wins):
    - *.py                                             -> python-coder
    - templates/workflows-js/**/*.{js,mjs}             -> python-coder  (Node workflow/orchestration)
    - *.sql                                            -> sql-coder
    - *.jsx, *.tsx, *.vue, *.svelte                    -> frontend-coder
    - web *.js/*.ts/*.css/*.html under a web-app path  -> frontend-coder
    - templates/agents/*.md, templates/skills/**/SKILL.md, workflow/command prose -> llm-expert
  Criteria above reframed to reference this map. Home for the map to be pinned by IT-PO at
  enrichment: a dedicated config (e.g. config/surface_craft_map.yaml) or surface globs on
  each agent in config/agent_registry.json, so the check and any generator/assignment
  tooling read one source. This is the ACD-1700b resolution of the "just-a-.js" tension.

  IT-PO enrichment (2026-08-12): CONFIG HOME PINNED to config/surface_craft_map.yaml (dedicated
  ordered file, first-match-wins), NOT surface globs on agent_registry.json — see it_requirements
  for the rationale (per-agent extension lists cannot express first-match path precedence).
