notes: |
  The PO's "The check tells you which options apply so reconciliation is a quick,
  guided step rather than a guess." This is the routes-presentation behavior; the
  full message assembly (AC id, broken entry, change kind, pointer) is GE-111e-1.

  IT-PO enrichment (2026-06-22): pinned the route-applicability rule (confirm not
  offered on a deleted-file verdict, aligning with the GE-111d-2 boundary) and
  the structured {update, confirm} content shape consumed by GE-111e.
change_target: code
risk_surface: contract_boundary
