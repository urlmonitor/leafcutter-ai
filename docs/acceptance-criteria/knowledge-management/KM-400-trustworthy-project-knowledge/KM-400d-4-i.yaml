assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: "Consumed by KM-400d-4-iii. Every name lookup made inside the graph adapter's own calls is an identifiable step, separate from connect, that reports per retrieval request: elapsed lookup time in integer milliseconds (int, never null once a lookup ran) and whether the address came from the process-lifetime remembered lookups (bool). Lookups outside the adapter's calls are not counted. Delivered in-process (no file, no wire format)."
expects_from: null
declared_files:
  - path: knowledge/adapters/neo4j_backend.py
    state: existing
  - path: knowledge/config.py
    state: existing
it_requirements:
  - "The IPv4-first behaviour must be scoped by call site (only while the graph adapter's own session work runs on the calling thread), never by host name, so that both the configured server name and every routing-table name the driver resolves are covered."
  - "Every name lookup outside that scope, on any thread and from any library in the same process (the kernel process imports the adapter in-process), must reach the original resolver with unchanged arguments and an unchanged result."
  - "Installing the behaviour must be idempotent: creating the adapter more than once in one process must not stack wrappers or change lookup results."
  - "Must not depend on a private or undocumented neo4j driver API, and must work on the currently pinned driver without adding a new version pin."
  - "Must not weaken TLS: certificate hostname verification and SNI for neo4j+s connections must continue to use the server name, never an IP literal."
  - "LEAFCUTTER_NEO4J_ADDRESS_FAMILY must be read through the knowledge runtime's single configuration path, with exactly two recognised values: ipv4-first (default) and any."
  - "Remembered lookups must live in process memory only, keyed by (server name, port), must be safe under concurrent worker threads, and must never be written to disk."
  - "A failed IPv4-only lookup that falls back to the normal lookup must be handled per the project error handling policy (logged, never silently swallowed) and must not surface as an unavailable result."
  - "The behaviour must be observable through the public retrieve CLI in a fresh process, not only through an internal helper."
  - "Must not change deadline_ms defaults or limits, and must not move connect time outside the deadline."
test_intent:
  - clause: the request returns status ok with its evidence
    needs_test: true
    reason: A cold call that still times out on a stalled IPv6 lookup is the defect this requirement exists to remove.
  - clause: stats.duration_ms is below 10000
    needs_test: true
    reason: The duration is the measured proof that the cold connect fits the default deadline rather than succeeding by luck.
  - clause: both server names (configured server and reader) were looked up IPv4-first
    needs_test: true
    reason: Host-name scoping would silently leave the reader lookup on the slow path, so both names must be checked.
  - clause: the adapter connects using the address from the normal lookup
    needs_test: true
    reason: The fallback path is computed behaviour that would break IPv6-only clients if it were missing.
  - clause: the request is not reported unavailable because of the failed IPv4 lookup
    needs_test: true
    reason: A fallback that raised instead of recovering would turn a reachable server into a false outage.
  - clause: that lookup asks for the address family the caller requested, with no IPv4-first step
    needs_test: true
    reason: The lookup replacement is process-wide, so leakage into other clients is a real and silent regression risk.
  - clause: its result is not served from the adapter's remembered lookups
    needs_test: true
    reason: Serving other callers from the adapter's memory would change their results without their knowledge.
  - clause: every graph server name lookup asks for any address family, exactly as with no IPv4-first behaviour
    needs_test: true
    reason: The opt-out is the only remedy for a client with an IPv4 record but no IPv4 route, so it must demonstrably restore the normal lookup.
  - clause: an unrecognised value such as "ipv6" is reported as a configuration warning in the result and treated as the default "ipv4-first"
    needs_test: true
    reason: Parsing the switch is branching logic whose wrong default would silently change lookup behaviour.
  - clause: each distinct (server name, port) pair is looked up at most once in that process
    needs_test: true
    reason: The remembered-lookup key and its reuse are computed behaviour that a wrong key would silently defeat.
  - clause: the configured server name and the reader name may each be looked up once
    needs_test: false
    reason: This clause only permits two lookups and adds no outcome beyond the at-most-once and both-names clauses, which are tested.
  - clause: a second, new process looks each name up again (nothing is stored on disk)
    needs_test: true
    reason: A disk cache would carry stale addresses across processes, which the requirement forbids.
test_spec:
  - name: test_km_400d_4_i_cold_retrieve_returns_ok_when_ipv6_lookup_stalls
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: "python -m knowledge retrieve run as a fresh subprocess (real argv, real knowledge.__main__.main, real KnowledgeService and Neo4jBackend._transaction) through a shared support module in the style of tests/knowledge/_km_400e_8_support.py; the subprocess installs a fake name resolver as socket.getaddrinfo that answers IPv4-only lookups in 0.05 s and blocks 15 s (time.sleep, not cancellable) for family=0, and replaces neo4j GraphDatabase.driver with a fake driver whose session work looks up the configured name and then a different reader name from the transaction's worker thread"
    description: With LEAFCUTTER_NEO4J_ADDRESS_FAMILY unset and the default deadline_ms the printed answer has status ok with its evidence.
    proves_clause: the request returns status ok with its evidence
    code_file: knowledge/adapters/neo4j_backend.py
    must_catch:
      - "the adapter installs no IPv4-first step so the 15 s family=0 lookup outlasts the deadline and the answer is unavailable"
      - "the IPv4-first step covers only the configured server name so the reader lookup still stalls"
  - name: test_km_400d_4_i_cold_retrieve_duration_is_below_the_default_deadline
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: criterion
    surface_invoked: "the same fresh-subprocess python -m knowledge retrieve run with the fake resolver (15 s for family=0, 0.05 s for IPv4-only) and fake driver, reading stats.duration_ms from the printed JSON"
    description: The printed stats.duration_ms is below 10000 and the subprocess wall time is well under the 15 s stall.
    proves_clause: stats.duration_ms is below 10000
    code_file: knowledge/adapters/neo4j_backend.py
  - name: test_km_400d_4_i_both_server_names_are_looked_up_ipv4_first
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: "the same fresh-subprocess python -m knowledge retrieve run; the fake resolver appends each lookup (name, requested family, calling thread) to a JSON-lines record file that the parent test reads back"
    description: The record shows an IPv4-only lookup first for both the configured server name and the different reader name, and no family=0 call made before them.
    proves_clause: both server names (configured server and reader) were looked up IPv4-first
    code_file: knowledge/adapters/neo4j_backend.py
    must_catch:
      - "the flag is keyed to the configured host name so the reader name is looked up with family=0"
  - name: test_km_400d_4_i_failed_ipv4_lookup_falls_back_to_the_normal_lookup_address
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: failure
    surface_invoked: "the same fresh-subprocess python -m knowledge retrieve run where the fake resolver raises socket.gaierror for the IPv4-only lookup of the server name and returns an IPv6 address for the family=0 lookup; the fake driver records the address it was handed"
    description: The fake driver receives the address returned by the family=0 lookup after the IPv4-only lookup failed.
    proves_clause: the adapter connects using the address from the normal lookup
    code_file: knowledge/adapters/neo4j_backend.py
    must_catch:
      - "no fallback exists so the connect receives the gaierror instead of the IPv6 address"
  - name: test_km_400d_4_i_failed_ipv4_lookup_is_not_reported_unavailable_and_is_logged
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: failure
    surface_invoked: "the same fresh-subprocess python -m knowledge retrieve run with the gaierror-then-IPv6 resolver; the test reads the printed JSON status, the exit code and the subprocess stderr log"
    description: The printed status is ok with exit code 0, and a WARNING-or-higher log line names the failed IPv4 lookup so it is not silently swallowed.
    proves_clause: the request is not reported unavailable because of the failed IPv4 lookup
    code_file: knowledge/adapters/neo4j_backend.py
    must_catch:
      - "the gaierror propagates and the request is reported unavailable"
      - "the fallback happens but the failed lookup is swallowed with no log"
  - name: test_km_400d_4_i_lookups_outside_the_adapter_keep_the_callers_family
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: "a fresh child process that builds a real Neo4jBackend (fake driver factory, resolver installed as socket.getaddrinfo beforehand), runs one adapter transaction, then calls socket.getaddrinfo with family=0 from the main thread and from a second thread, for an unrelated name and for the graph server's own name, while a transaction is running on another thread; the resolver records each call's requested family"
    description: Every lookup made outside the adapter's own calls reaches the original resolver with family=0 unchanged, with no IPv4-only call preceding it.
    proves_clause: that lookup asks for the address family the caller requested, with no IPv4-first step
    code_file: knowledge/adapters/neo4j_backend.py
    must_catch:
      - "the flag is process-global so lookups on other threads become IPv4-first"
      - "the flag is never cleared after the adapter's session work so later lookups on the same thread become IPv4-first"
      - "the wrapper rewrites the family for the graph server's own name regardless of call site"
  - name: test_km_400d_4_i_outside_lookup_is_not_served_from_remembered_lookups
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: "the same child-process harness: after an adapter transaction has remembered the server name, code outside the adapter looks the same (name, port) up again with a resolver that now returns a different address, and the test compares the returned address and the resolver call count"
    description: The outside lookup returns the resolver's new address and increments the resolver's call count instead of returning the remembered address.
    proves_clause: its result is not served from the adapter's remembered lookups
    code_file: knowledge/adapters/neo4j_backend.py
    must_catch:
      - "the memory is consulted for every lookup, not only inside the adapter's own calls"
  - name: test_km_400d_4_i_opt_out_any_restores_family_zero_lookups
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: boundary
    surface_invoked: "python -m knowledge retrieve as a fresh subprocess with LEAFCUTTER_NEO4J_ADDRESS_FAMILY=any and the fake resolver that answers family=0 immediately; the resolver record file is read back"
    description: Every recorded lookup of both server names asks family=0 and no IPv4-only call appears.
    proves_clause: every graph server name lookup asks for any address family, exactly as with no IPv4-first behaviour
    code_file: knowledge/config.py
    must_catch:
      - "the opt-out value is ignored and the lookups are still IPv4-first"
  - name: test_km_400d_4_i_unrecognised_family_value_warns_and_acts_as_ipv4_first
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: boundary
    surface_invoked: "python -m knowledge retrieve as a fresh subprocess with LEAFCUTTER_NEO4J_ADDRESS_FAMILY=ipv6 and the fake resolver (15 s for family=0); the printed JSON warnings and the resolver record are read back"
    description: The printed result carries a configuration warning naming the setting and the lookups are IPv4-first, so the answer is ok within the deadline.
    proves_clause: an unrecognised value such as "ipv6" is reported as a configuration warning in the result and treated as the default "ipv4-first"
    code_file: knowledge/config.py
    must_catch:
      - "an unrecognised value is treated as any so the lookups stall"
      - "an unrecognised value is treated as ipv4-first but no warning is reported in the result"
  - name: test_km_400d_4_i_each_name_and_port_is_looked_up_at_most_once_over_three_requests
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: boundary
    surface_invoked: "a fresh child process that builds one retriever through knowledge.config.build_retriever and runs three retrieve requests (fake driver, recording resolver)"
    description: The resolver record holds at most one IPv4-first lookup per distinct (server name, port) after three requests.
    proves_clause: each distinct (server name, port) pair is looked up at most once in that process
    code_file: knowledge/adapters/neo4j_backend.py
    must_catch:
      - "the memory key is the name alone so a second port is wrongly served from it"
      - "no memory exists so each request looks the names up again"
  - name: test_km_400d_4_i_a_second_process_looks_each_name_up_again_and_writes_no_file
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: real_artifact
    surface_invoked: "python -m knowledge retrieve run twice as two fresh subprocesses sharing one scratch working directory, home and temp directory, with the recording resolver; the test lists the scratch tree before and after the runs"
    description: The second process records its own lookups of both names again and the scratch tree gains no file other than the test's own record and output files.
    proves_clause: a second, new process looks each name up again (nothing is stored on disk)
    code_file: knowledge/adapters/neo4j_backend.py
    must_catch:
      - "the remembered lookups are written to disk and the second process skips its lookups"
  - name: test_km_400d_4_i_ipv4_first_is_reachable_through_the_retrieve_cli
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "python -m knowledge retrieve --backend neo4j run as a fresh subprocess with real argv (the harness entry script only pre-installs the fake resolver and fake driver factory, then calls knowledge.__main__.main)"
    description: Through the real CLI entry point the first lookup recorded for the graph server name is IPv4-only and the process exits 0 with status ok.
    proves_clause: the request returns status ok with its evidence
    code_file: knowledge/__main__.py
    convention_test_file: tests/knowledge/test_km_400e_8.py
