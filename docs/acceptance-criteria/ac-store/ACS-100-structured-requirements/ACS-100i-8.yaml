notes: |
  THIS IS THE CRITERION THAT KEEPS THE NARROWING FROM BEING A SWITCH-OFF, AND
  IT IS THE WEAKEST LINK IN THE TREE. Read the concessions below before building
  it.

  The problem it answers: once the obligation is keyed off a declaration, an
  author who registers a package surface and simply does not write
  `package_surface: true` escapes the gate entirely. At authoring time there is
  no signal in the AC record that contradicts them — the record is a statement of
  intent, and intent is exactly what the author controls. Searched for one and
  found none: `doc_links.relationship` is a free-form string, so a `modifies`
  link is not dependable; `change_target` is optional, so it is as omissible as
  the marker itself; and `components` is a membership axis, not a surface axis.

  The signal that is NOT under the author's control is the registration itself.
  A package surface does not exist because an AC said so; it exists because an
  entry appears in a registry the build reads. That entry is in the diff, it is
  enumerable, and it cannot be omitted without also failing to ship the feature.
  So the check runs against the registration, not against the record.

  CONCESSION 1 — detection moves from authoring time to landing time. BO-2000d
  set out to validate the spec "before it can ever be handed to an agent". This
  check fires when the registration lands, by which point a coder has already
  worked from a thin spec. That is a genuine reduction in the gate's reach and
  should be recorded as such rather than glossed. What survives is the guarantee
  that the surface cannot reach a consumer undeclared.

  CONCESSION 2 — it needs a change-to-record link, and that link is itself a
  known-weak surface in this repo. The check can only reconcile against
  acceptance criteria a change cites. The uncited-change hole is specified in
  ACS-100i-8-i; note it is a pre-existing hole, not one this narrowing opens.

  CONCESSION 3 — the registry list is a maintained enumeration, so it can go
  stale. A new kind of registry added later is unwatched until someone adds it
  to the list. Pair the list with the deploy-manifest invariant already stated in
  CLAUDE.md ("New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest")
  so the two enumerations are checked against each other rather than drifting
  independently.

  Last scenario is deliberate: a check that reports "pass" when it examined
  nothing is the failure mode KI-ACS-001 documents, and it would make this
  criterion unfalsifiable.
