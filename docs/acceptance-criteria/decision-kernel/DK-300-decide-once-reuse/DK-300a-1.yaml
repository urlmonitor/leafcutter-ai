it_requirements:
  - Intent thresholds and the clarification limit come from config.intent; no threshold is hard-coded.
  - The goal travels as data (stdin or --input-file), never on a command line, and the CLI prints
    exactly one JSON document on stdout.
  - A confident classification costs exactly one Jev call, replaces the routing question and counts
    against limits.max_jev_calls.
  - A goal classed change or out_of_domain ends blocked with a plain limitation and is never recorded
    as a build opportunity.
  - 'Done-marking evidence (KI-ACS-004, done_proof): implemented_by names an existing kernel/... file
    plus symbol, and every covering test under tests/kernel/ carries a `# covers: <this AC id>` tag
    and passes under pytest. No kernel test carries a DK covers tag yet, so tagging comes before any
    done-marking.'
