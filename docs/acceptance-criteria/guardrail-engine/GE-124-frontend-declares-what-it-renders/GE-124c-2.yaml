id: GE-124c-2
readiness: approved
priority: high
title: "An id that resolves to nothing is reported as its own verdict, not as a missing declaration"
component: guardrail-engine
components:
  - commit_guardian
  - ac_store
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124c.yaml"
criteria: |
  Given the staged set contains `components/coverage/coverage-explorer.tsx`
  And its component-level declaration names KM-200f and UXP-609-3
  And UXP-609-3 resolves to no criterion in the acceptance-criteria store
  When the commit-tier declaration check runs
  Then the commit is rejected
  And a finding is reported with the code "unresolved-ac-id", not
    "missing-component-declaration"
  And the finding names the unresolvable value "UXP-609-3"
  And the finding names the ids that did resolve, so the author can see the
    declaration was read

  Given a staged screen component whose component-level declaration resolves
    fully
  And one of its element pins names an id that resolves to no criterion
  When the commit-tier declaration check runs
  Then the commit is rejected
  And a finding is reported with the code "unresolved-ac-id" naming the element's
    line number and the unresolvable value
depends_on:
  - GE-124c
  - GE-124a-1
  - GE-124b-1
