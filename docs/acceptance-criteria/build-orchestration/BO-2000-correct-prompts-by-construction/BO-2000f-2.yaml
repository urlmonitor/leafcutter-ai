criteria: |
  Given /build-feature resolves its argument to a single standalone ticket (not part of an epic),
  When it drives that ticket,
  Then it executes the ticket's phases through the flattened script-driver semantics
    -- each needed phase is dispatched as its own phase agent under that phase's template
    (build-ticket driver semantics),
  And it does NOT hand the whole ticket to a single agent that runs every phase inline.
