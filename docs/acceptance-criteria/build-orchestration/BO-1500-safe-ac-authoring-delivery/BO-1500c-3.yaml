id: BO-1500c-3
components:
  - build_orchestration
readiness: approved
priority: high
title: AC files are never committed directly onto main during authoring
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: in_progress
created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500c.yaml
criteria: |
  Given the AC-authoring workflow runs from start through final delivery,
  When the run is complete,
  Then no commit produced by the workflow was placed directly on the main branch,
  And every AC YAML commit the workflow produced lives on the authoring branch,
  And the approved AC files reach main only by merging the authoring pull
    request,
  And this holds whether the user invoked /create-ac or /plan-feature.
depends_on:
- BO-1500c
- BO-1500c-1
doc_links:
- path: templates/skills/create-ac/SKILL.md
  relationship: modifies
  status: exists
- path: scripts/workflows/plan-feature.js
  relationship: modifies
  status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- 'Negative invariant: the in-place ''commit AC YAML on the current checkout'' behavior of the legacy
  create-ac / plan-feature flows must be removed. All AC commits target the authoring branch; main is
  reached only via the PR merge.'
- Holds for both /create-ac and /plan-feature.
- This behavior must be implemented in BOTH surfaces -- /create-ac (templates/skills/create-ac/SKILL.md
  prose) and /plan-feature (scripts/workflows/plan-feature.js) -- preferably via a shared worktree/PR
  helper reused from build-single-ticket (scripts/setup_ticket_worktree.py) and the pull-request machinery;
  keep the two surfaces in sync. The create-ac prose edits are an llm-expert follow-on within the same
  ticket.
- 'Follow the project Error Handling Policy (CLAUDE.md): wrap all external I/O (git subprocess, gh CLI/REST
  calls) in explicit error handling; no bare except; surface a user-visible warning/error rather than
  silently swallowing.'
test_spec:
- name: test_main_head_is_unmoved_after_a_full_authoring_run
  target_dir: unit_tests/workflows/
  framework: unittest
  type: integration
  description: In a fixture repo, main's HEAD sha and tree are identical before and after a complete authoring
    run through delivery.
- name: test_every_ac_yaml_commit_lands_on_the_authoring_branch
  target_dir: unit_tests/workflows/
  framework: unittest
  type: integration
  description: Every commit in origin/main..<authoring-branch> that touches docs/acceptance-criteria/ is
    reachable only from the authoring branch, and no such commit is reachable from main.
- name: test_stage_commit_aborts_when_the_target_worktree_is_on_main
  target_dir: unit_tests/workflows/
  framework: unittest
  type: behavioral
  description: When the branch check reports "main", the stage-commit step returns a safety refusal, issues
    no `git commit`, and leaves HEAD unmoved — the guard actually gates rather than only logging.
- name: test_stage_commit_aborts_when_the_branch_cannot_be_confirmed
  target_dir: unit_tests/workflows/
  framework: unittest
  type: behavioral
  description: Fail-closed control — when the branch-check command fails or returns empty, the stage commit
    is refused rather than proceeding on an unverified branch.
