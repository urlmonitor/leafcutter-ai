id: KM-KGS-100b-1
components:
  - knowledge_management
readiness: approved
priority: high
title: "Answer which code file delivers an acceptance criterion by following its edges"
component: knowledge-management
level: L2
status: active
req_status: draft
work_status: in_progress
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100b.yaml"
criteria: |
  Given the knowledge map contains a node for acceptance criterion KM-EX-010 and
    that criterion's implemented_by, covered_by, depends_on, and components fields
    each produced their edges
  When the knowledge map is exported in machine-readable form and a reader collects
    the outbound edges of node KM-EX-010
  Then the implemented_by edges name the source files that deliver the criterion
  And the covered_by edges name the tests that prove it
  And the depends_on edges name the other criteria it depends on
  And the component_membership edge names the part of the product it belongs to
  And no extra outbound relationship kind is returned beyond these four
depends_on:
  - KM-KGS-100b
  - KM-KGS-100a-3
doc_links:
  - path: scripts/knowledge_query.py
    relationship: describes
    status: exists
  - path: templates/skills/knowledge-query/SKILL.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The machine-readable export (JSON form) must expose each edge with its source id, target id, and edge_type so a reader can collect a node's outbound edges and group them by type without parsing display text"
  - "An acs node's outbound edge set must contain exactly the four declared edge kinds for criteria (implemented_by, covered_by, depends_on, component_membership) and no other outbound relationship type — edge production must stay bounded by the surface's declared edge_fields"
  - "The query path that scopes to a single criterion id must remain available through the existing knowledge-query interface (filter/select by node id) without a new bespoke command, so the how-to AC can reference a stable invocation"
test_spec:
  - name: test_json_export_edges_expose_source_target_and_edge_type
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: criterion
    description: "Every edge in the machine-readable (JSON) export carries source id, target id and edge_type as separate fields, so outbound edges can be collected and grouped without parsing display text"
  - name: test_ac_node_outbound_edge_kinds_equal_four_declared_kinds
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: criterion
    description: "For KM-EX-010 with all four relationship fields populated, in a temp project whose config/paths.json is a byte copy of the real one, the set of edge type values across its outbound edges in the JSON export (shipped CLI, --format json --project-root <fixture>) EQUALS {implemented_by, covered_by, depends_on, component_membership}: each of the four appears and no other kind appears"
  - name: test_ac_node_implemented_by_and_covered_by_edges_present_with_node_targets
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: criterion
    description: "In the same JSON export, KM-EX-010 has an implemented_by edge whose target is 'scripts/foo.py' and a covered_by edge whose target is 'unit_tests/test_foo.py'. Each target is the id of a node in payload['nodes'] with surface 'files', so the reader follows the edge to a real node naming the source file and the test"
  - name: test_ac_node_depends_on_and_component_membership_grouped_by_kind
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: criterion
    description: "Grouping KM-EX-010's exported outbound edges by edge_type puts the edge to KM-EX-009 under depends_on and the edge to the build-pipeline hub under component_membership"
  - name: test_single_criterion_selection_returns_only_its_outbound_edges
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: reachability
    description: "Selecting node KM-EX-010 by id through the existing knowledge-query interface returns edges whose source is KM-EX-010 only, with no new bespoke command"
  - name: test_real_repository_ac_outbound_kinds_are_the_four_and_file_targets_are_nodes
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "The shipped CLI's JSON export of the real repository (--format json --project-root <repo root>, module-scoped). The outbound edge types of every acs-surface node are a subset of the four kinds, and their union across all acs nodes equals all four. Every implemented_by and covered_by edge from an acs node has a target that is a node id in the export. The implemented_by edge count is greater than 0 and is stated in the failure message. A missing repo root FAILS; it is never skipped"
test_required: true
test_rationale: >-
  The contract checks the export shape, that an AC's outbound kinds are exactly the four declared
  kinds (all four present, no extra kind, now exact equality instead of a subset), grouping for
  the two node-to-node kinds, and single-node selection through the existing interface. The
  raw-path vs resolved-node decision is settled (user-approved 2026-09-25, KM-KGS-100d-4):
  implemented_by and covered_by edges end on path-keyed files-surface nodes. So the contract now
  asserts that those edges are present in the export and that their targets are nodes, which is
  what lets a reader answer 'which code file delivers this criterion' by following edges. A
  real-repository arm checks the same properties over every AC in the store. The node-target test
  and the real-repository arm describe the target state and are RED until the KM-KGS-100d-4 epic
  is built (today 1,608 of 1,609 implemented_by targets are not nodes). The equality test may
  already pass, because the exemption keeps those edges today. Its job is to stay green once the
  exemption is retired, so file-path edges are kept by resolution and not by the exemption.
delivers_to:
  agent: documentation-expert
  contract: "A stable knowledge-query invocation that selects one acs node by id and returns its outbound edges grouped as implemented_by (source files), covered_by (tests), depends_on (criteria), component_membership (component hub) in the machine-readable export"
expects_from:
  ac_id: KM-KGS-100a-3
  contract: "The four acceptance-criterion edge types attached to each acs node (implemented_by, covered_by, depends_on, component_membership)"
origin_agent: business-analyst
created: 2026-06-22
notes: |
  2026-09-16 measurement: this criterion was marked work_status: done but is not
  satisfied. The AC store declares 1454 implemented_by values and the knowledge map
  emits 641 edges; it declares 4541 covered_by values and emits 4333. Root cause is in
  the block-list reader used by the acs surface: column-zero list items are read as an
  empty list (841 files disagree with a reference reader for implemented_by, 394 for
  covered_by) and quoted items keep their quote characters (281 implemented_by, 324
  covered_by). The existing checks did not catch either, because they exercise a single
  indented-and-unquoted fixture and largely bypass the reader with a pre-built field
  dictionary. Reset done -> in_progress pending KM-KGS-100a-3-i..-viii.
