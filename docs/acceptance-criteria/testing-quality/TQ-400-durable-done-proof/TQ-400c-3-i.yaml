notes: |
  The empty-history boundary. Two wrong answers are both plausible cheap
  implementations and both are actively misleading on the very first real run: a
  zero-change claim implies the backlog is stable when nothing is yet known, and
  differencing against an assumed empty previous population reports the entire
  641-record finished set as newly proven or newly lapsed — a spectacular false
  signal on the report the team sees first.

  The follow-on clause confirms the no-predecessor path is a genuine special case
  and not a permanently disabled comparison.

  IT-PO ENRICHMENT NOTE (2026-08-17). Added a third failure mode to it_requirements
  that the criteria do not name and that would otherwise land silently: "no
  predecessor exists" and "the predecessor exists but is unreadable" must not
  collapse into the same branch. If they do, a corrupted inventory renders as a
  first run, which resets the trend and hides the corruption at the same time.
