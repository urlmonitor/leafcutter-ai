level: L2
status: active
req_status: active
readiness: approved
priority: medium
work_status: todo
parent: KM-500d
criteria: 'Given approved source material exceeds the supported unchunked embedding size and its source mapping
  permits semantic retrieval

  When the supported chunking process prepares that material at an immutable source revision

  Then bounded chunks are reproducible from the same content and chunking policy and retain the canonical parent
  identity, source revision and exact supporting locator

  And only approved source fields are included rather than complete traces, secrets or unrelated code

  And cache reuse distinguishes changed content, chunking policy and embedding model so old vectors cannot
  stand in for changed text

  When several chunks from one entity match a bounded semantic or hybrid request

  Then they collapse to one canonical entity result while retaining the supporting chunk locators and revision

  And repeated chunks do not inflate entity counts, evidence relevance or downstream expansion budgets

  And deeper disclosure returns the selected source material within its content budget

  And missing chunking support or incompatible vectors remains an explicit limitation rather than silently
  omitting the long record or claiming semantic readiness

  And fixture-only proof remains labeled synthetic until an approved real corpus and authorized model evaluation
  substantiate broader usefulness.'
