assigned_agent: python-coder
estimated_complexity: M
it_requirements: |
  The required hook ID set is DERIVED from the commit-guardian manifest, not
  hardcoded, so it tracks the manifest as hooks are added or removed. A truncated
  config missing the security hooks must fail even though it still has ">=1 hook".
  Implemented in the shared probe helper (BO-1700a-1); fail closed (BO-1700b-1);
  ADR-001 deployed/template parity applies (manifest canonical source is the
  templates/scripts/commit_guardian/ copy).
