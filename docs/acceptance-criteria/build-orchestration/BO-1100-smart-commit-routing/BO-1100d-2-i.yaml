  And the specialist presents the finding to the user:
    "Shape 'docs/architecture/**' has reached 10 occurrences but historical
    messages show no consistent pattern. Manual rule authoring recommended."
  And the user is shown the 3-4 most common subject line prefixes found
    to aid their manual authoring decision.
