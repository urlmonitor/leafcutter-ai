id: GE-117e-1
readiness: draft
priority: medium
title: "Guided autofix inserts the correct declaration so the corrected commit proceeds"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-117-code-declares-what-it-serves/GE-117e.yaml"
criteria: |
  Given a commit was blocked because a new file's module docstring does not name a
    component
  And the file's location matches exactly one registered component's directory
    pattern
  When the developer invokes the guided autofix for that file
  Then the autofix inserts the matched component name into the module docstring
  And re-running the guardrail on the corrected staged commit produces a satisfied
    verdict for that module-component declaration

  Given a commit was blocked because a new public symbol or a new decision-history
    entry does not reference an AC
  And the surrounding commit context supplies a single AC the change is being made
    for
  When the developer invokes the guided autofix for that item
  Then the autofix inserts that AC reference into the docstring or entry
  And re-running the guardrail on the corrected staged commit produces a satisfied
    verdict for that declaration
depends_on:
  - GE-117e
  - GE-117d-1
doc_links:
  - path: "docs/acceptance-criteria/guardrail-engine/GE-117-code-declares-what-it-serves/GE-117e.yaml"
    relationship: parent
    status: exists
  - path: "docs/components.json"
    relationship: related
    status: exists
    relevance: "Each component's primary_code list (file paths and directory prefixes ending in '/') is the path data the component inference reads."
  - path: "docs/architecture/components/commit-guardian.md"
    relationship: describes
    status: exists
  - path: "docs/acceptance-criteria/guardrail-engine/GE-124-frontend-declares-what-it-renders/GE-124c-2-i.yaml"
    relationship: related
    status: exists
assigned_agent: python-coder
estimated_complexity: M
change_target: code
declared_files:
  - path: templates/scripts/commit_guardian/check_declaration_traceability.py
    state: to_be_created
it_requirements:
  - "Component inference resolves to a docs/components.json id (the validity namespace) from that registry's existing primary_code paths: an entry ending in '/' covers every file under it, any other entry covers that exact file. A file covered by exactly one component is a confident single match. NEVER infer from docs/acceptance-criteria/index.yaml directory_patterns — those ids ('guardrail-engine') are a different namespace from components.json ids ('commit_guardian')."
  - "This supersedes the earlier enrichment note that component inference was a PREREQUISITE because components.json had no path field: primary_code is that path data, and the first criteria scenario requires auto-insertion on a single match, which a prompt-only reading would make unsatisfiable. Matching must use primary_code exactly as registered; do not add a second path field or a components.json<->index.yaml bridge for this."
  - "AC-reference inference (public symbol / decision-history entry): the 'surrounding commit context' must be a declared, machine-readable source of AC ids for the change in progress (for example the AC ids the active ticket or worktree records), never text guessed from a commit message or branch name. Exactly one id that resolves through the shared GE-124c-2-i resolver is a confident match; zero or several is the prompt path of GE-117e-1-i."
  - "The autofix EDIT is applied to the working tree and re-staged, touching only the offending item (module docstring gets the component name; symbol docstring or new decision-history entry gets the AC ref) and leaving every other byte of the file unchanged. The observable success criterion is behavioral: re-running the guardrail on the corrected staged commit yields a satisfied verdict for that item."
  - "The autofix is reachable from the block report (GE-117d-1 names how to invoke it) and acts on the report's item shape {file, surface, kind, declared_value}; it may be a mode of the declaration hook or a sibling entry point, but it must share the hook's parse and resolvers rather than re-implement them."
  - "Ambiguous / no-confident-inference paths (multi-match, no-match, no single contextual AC) PROMPT and never fabricate — specified in GE-117e-1-i."
  - "Fail-open on INTERNAL error without writing a partial edit. Edit only templates/scripts/commit_guardian/ (ADR-001); verify via the deployed entry point after a build.py round-trip."
delivers_to:
  agent: python-coder
  contract: "The applied-declaration edit (components.json id into the module docstring; resolved AC id into the symbol docstring or new decision-history entry), re-staged, that turns a blocking verdict into a satisfied one on re-check"
expects_from:
  ac_id: GE-117d-1
  contract: "The block report items {file, surface: 'module-component'|'symbol-ac'|'decision-history-ac', kind: 'missing'|'invalid', declared_value} that the autofix acts on"
test_spec:
  - name: test_ge_117e_1_single_primary_code_match_inserts_component_and_recheck_passes
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "In a temp repo whose docs/components.json gives one component primary_code ['pkg/alpha/'], stage pkg/alpha/new_mod.py with a component-less docstring, confirm the hook blocks, invoke the autofix for that file, then re-run the hook on the re-staged index: the docstring now names that component and the module-component verdict is 'satisfied'."
  - name: test_ge_117e_1_single_contextual_ac_is_inserted_and_recheck_passes
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "With the commit context declaring exactly one AC id present in the temp store, invoke the autofix for a blocked public function and for a blocked new decision-history entry: each gains that AC reference and the re-run hook reports 'satisfied' for both."
  - name: test_ge_117e_1_inference_never_uses_index_yaml_directory_patterns
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: discrimination
    description: "Stage a file under a path covered by an index.yaml directory_patterns entry but by no components.json primary_code entry: the autofix inserts no component, and in particular never writes the index.yaml id."
    must_catch:
      - "infers from docs/acceptance-criteria/index.yaml directory_patterns and inserts an AC-store component id such as 'guardrail-engine'"
  - name: test_ge_117e_1_autofix_changes_only_the_offending_item
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Copy a real templates/scripts/commit_guardian/ module into the temp repo (CRLF-free, with a DECISION HISTORY block), strip its component, and run the autofix: the git diff of the result is confined to the inserted declaration lines."
    must_catch:
      - "rewrites or reformats the whole file (for example via ast.unparse) instead of inserting the declaration"
  - name: test_ge_117e_1_commit_message_text_is_not_an_ac_source
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "With no declared commit-context AC but a commit message or branch name mentioning a real AC id, the autofix does not insert that id."
    must_catch:
      - "scrapes AC ids from the commit message or branch name"
test_rationale: |
  The criteria define success behaviourally: after the autofix, the same guardrail passes. So
  every criteria test runs the real loop of block, fix, re-stage and re-check. A test that only
  inspects the edited text could pass on an insertion that the checker does not accept. The
  discrimination test guards against the two-registry error this tree already made once,
  inferring from index.yaml and writing an id that is not valid for the module-component
  check. The real-artifact test runs the autofix on a real module, because synthetic
  two-line fixtures never show a whole-file rewrite. The boundary test closes the guessy AC
  source the criteria rule out.
origin_agent: business-analyst
