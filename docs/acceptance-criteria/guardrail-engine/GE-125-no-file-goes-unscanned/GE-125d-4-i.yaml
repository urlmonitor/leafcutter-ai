test_spec:
  - name: test_adding_a_fifth_location_in_one_place_changes_the_answer
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "With the single definition parameterised to include a fifth location and no other file edited, the answer includes that location and a path under it is classified reduced both by the answer and by the check's actual treatment in a throwaway repository"
  - name: test_removing_a_location_in_one_place_removes_it_from_the_answer
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "With one location removed from the same single definition, the answer no longer lists it and a path under it is thereafter treated normally — the arm that fails an implementation which appends to the answer but never prunes"
  - name: test_disagreement_between_answer_and_behaviour_is_reachable_by_executing_both
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "For each of a set of paths, the classification derived from the answer and the treatment observed from a real check agree; the comparison is made by executing both halves, never by inspecting the source"
  - name: test_answer_states_the_condition_as_applied_not_as_intended
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A path that matches a reduced location name at depth rather than at the repository root is classified identically by the answer and by the check, so an answer describing four root-anchored directories while the code substring-matches is caught"
  - name: test_derived_answer_is_identical_in_the_deployed_copy
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: "After `python scripts/build.py --target-dir .`, the deployed scripts/commit_guardian/check_secrets.py derives the same answer from the same single definition, so no rendering diverges across the four copies check_hook_parity holds identical"
test_rationale: "The claim is that the description and the decision cannot diverge, and the natural way to check that — read the code and see that both come from one place — is precisely the verification method this goal exists to replace: the original exemption was fully visible in the source and stayed unnoticed for the life of the check, and a source-reading test would also pass on a refactor that reintroduces a second list a release later. Every entry therefore executes both halves: it asks for the answer through the check's own query surface and separately observes the check's treatment of a path in a throwaway repository, then compares. The two mutation entries are seam tests because the producer is the single definition and the consumers are the decision and the rendering; changing the producer once and observing both consumers move is the only evidence that they share a source. They are run by parameterising the definition for the duration of the test rather than editing the canonical file on disk, which would dirty the working tree and could leak a widened exemption into a real commit. The condition entry exists because listing the right location names while describing the wrong matching rule is a partial drift that the two mutation entries would not see. No fixture is placed under an existing reduced location: the subject is the answer, and a pre-existing reduced path would let an arm pass on the old set rather than on the change under test."
