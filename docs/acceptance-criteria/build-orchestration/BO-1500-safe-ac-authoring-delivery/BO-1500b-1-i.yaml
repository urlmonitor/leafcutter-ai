id: BO-1500b-1-i
readiness: approved
priority: high
title: The fresh authoring worktree is bootstrapped so pre-commit hooks do not silently skip
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500b.yaml
criteria: |
  Given a freshly created authoring worktree that does not yet have the
    pre-commit configuration the package hooks need (no .pre-commit-config.yaml
    and no .leafcutter link),
  When the authoring workflow is about to make its first stage commit on the
    authoring branch,
  Then it first establishes the pre-commit configuration in the authoring
    worktree,
  And the AC schema and parent-link hooks actually run against the staged AC
    files instead of being silently skipped,
  And a stage commit that would violate an AC hook is blocked rather than
    landing unchecked.
