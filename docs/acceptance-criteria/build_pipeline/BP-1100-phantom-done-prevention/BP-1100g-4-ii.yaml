notes: "Found on 2026-09-07 by the gate refusing a ticket that had just been generated from an approved AC: TICKET-20260907-BP-100k-4-ii.md, status todo, no implementation, refused for a 'reachability' proof whose test is by mandate the next phase's output. The gate landed on main the same day in #702, so the collision with the /build-ac path appears not to have been exercised before merge. Every AC-generated ticket carrying a reachability promise is blocked identically, which makes the documented ADR-012 path — /plan-feature then /build-ac — unusable end to end. Note that BP-1100g-4 is work_status done: what it specifies is right, and its own criteria already say the refusal belongs at hand-off; the shipped implementation simply never honoured that clause. It is left at done rather than flipped, with the unfinished work carried by this child."
