title: "Two reviewers may not collapse onto the same angle"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-independent-spot-check/BO-1300b.yaml"
criteria: |
  Given three reviewers have been seeded with the three distinct angles
  When a reviewer assigned the integration-and-error-handling angle begins its probe and is
    tempted to instead re-check edge cases already owned by the edge-case reviewer
  Then the reviewer stays within its assigned angle and does not duplicate another
    reviewer's angle
  And if the consolidated result shows two reviewers reported only against the same single
    angle, the spot-check pass treats that as a defect in the review (a missing perspective),
    not as a clean signoff
depends_on:
  - BO-1300b-1
