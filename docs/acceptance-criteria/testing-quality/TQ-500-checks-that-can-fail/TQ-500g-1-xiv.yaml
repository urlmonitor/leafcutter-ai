notes: |
  WHY ITS OWN AC. It applies to every alteration (pinned, fresh or declared),
  not only to pins, and it is the KI's runner fix. TQ-500g-1-xiii uses it as
  one of the checks a pin must pass; the per-test row here is what a reviewer
  reads.

  PER TEST, NOT PER NAME. A name held by two tests can be reachable from one
  and not the other (T1 and T2). TQ-500g-1-i holds each test to the names its
  own entry lists, so reachability is judged per test too. Consequence: T2's
  entry is mis-assigned for that name, and the gate says so (unfinished,
  not executed) instead of calling T2 weak. This is exactly the round-III
  case: the "naive chain" claim was moved to a test that never generates a
  sitecustomize.

  NOT TRACEABLE != NOT EXECUTED. Database wrong versions (TQ-500g-2) change SQL
  files, and other non-Python files may be altered too. Treating "cannot
  trace" as "not executed" would make every such wrong version unfinished and
  stop all database work. So an untraceable file keeps today's behaviour, with
  the row saying the check could not be made.

  WHAT THIS DOES NOT CATCH. An alteration whose changed line runs but whose
  effect is equivalent on the test's inputs (analysis 3(d), propagation round
  III) still reads as a survivor. That is the KI's "Triage, optional"
  direction and is out of scope here.

  RESULT VOCABULARY. TQ-500g-1-i's result list gains one unfinished value
  (working name not_executed); IT-PO to amend that contract and the TQ-500g-5
  reference page.

  IT-PO ENRICHMENT (2026-10-23)
  The working name not_executed is kept as the result word. TQ-500g-1-i's
  delivers_to result enum and TQ-500g-5's it_requirements were amended in this
  pass; the reference page docs/reference/wrong-version-runs.md does not exist
  yet (planned by TQ-500g-5), so it is written with the new word from the
  start. templates/agents/sql-test-writer.md lists the runner's result words
  and needs not_executed added (documentation follow-up).
  TRACING: standard library only (no coverage.py), via a pytest plugin in the
  runner's existing baseline run.
  DECISION FOR THE BA (caveat): a line run at import time (collection) counts
  as run by every test of the run. Otherwise every module-level wrong version
  would read not_executed for every test. The criteria's "another test running
  it does not count" is kept for lines run inside a test.

  USER DECISION (BrainCandy, 2026-10-24, "approved")
  d. IMPORT-TIME LINES COUNT FOR EVERY TEST. A line executed at import or
     collection time counts as executed by every test in that run. The caveat
     above is accepted and is now a criteria clause; the per-test rule applies
     only to lines run inside a test.
