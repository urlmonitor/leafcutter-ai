id: ACS-500g-6-i
components:
  - ac_store
readiness: approved
priority: critical
title: "An agent passes evaluation only when it catches every seeded item in all three rounds"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a run of the agent-evaluation protocol in which round 1 seeds 4 known
    defects, round 2 seeds 6, and round 3 seeds 5,
  When the agent under test reports its findings for a round,
  Then the round passes only if the agent reported every seeded item recorded for
    that round,
  And a round in which one or more seeded items go unreported fails, and the round
    result names each missed item,
  And findings the agent reports that were not seeded are recorded separately as
    additional findings and never turn a failing round into a pass.

  Given rounds 1 and 2 passed and round 3 left one of its 5 seeded defects
    unreported,
  When the overall verdict is computed,
  Then the verdict is fail — the three rounds are not averaged, scored as a
    percentage, or treated as two-out-of-three,
  And the agent is not treated as verified while the verdict is fail.

  Given a failed agent is then changed and re-run,
  When the re-run is scored,
  Then it uses a fresh set of seeded items rather than the set the agent already
    missed,
  And the earlier failing verdict remains on record alongside the new one.
depends_on: [ACS-500g-6]
