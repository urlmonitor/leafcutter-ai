notes: |
  This is the shape that made KI-BO-020 invisible for as long as it lasted. The reply was
  well-formed, honest and clearly a refusal — "I did not run the requested command" — and it
  simply was not read. The lesson recorded there generalises: "dispatching an agent under a role
  name that is not its own is not a prompt-style choice — the agent will refuse, and a caller
  that ignores the reply turns that refusal into a silent no-op."

  ONLY AN AFFIRMATIVE SUCCESS COUNTS AS SUCCESS. Everything else — refusal, silence, an
  unrecognised shape — is the action not having happened. Writing the criterion this way round
  matters: a caller that enumerates known failure shapes will always be one shape short, and the
  shape it misses is read as success.

  THE TWO REPORTS MUST DIFFER because they mean different things to whoever reads the halt. A
  refusal means the action was routed to something that will never do it, which is a wiring
  defect that will recur on every run. An uninterpretable outcome may be a transport problem
  affecting this run only. Sending both to the same line costs the reader the diagnosis, which
  is the misdirection KI-BO-018 records as the expensive part of a false verdict.

  RELATED BUT DISTINCT: BO-3200e covers a CHECK that could not perform its inspection. This
  covers an ACTION whose outcome could not be read. The vocabulary for "could not tell" is the
  same and should be reused rather than reinvented; the sites are different.

  IT-PO ENRICHMENT NOTE (2026-08-26). The vocabulary reuse is now an it_requirement rather than
  a suggestion, because two spellings of "could not tell" would be a slow-motion restoration of
  the collapse BO-3200e exists to end — each site correct on its own and jointly unreadable.
