criteria: |
  Given a finalize-feature run named finalize-epic-x-20261012 closing an epic whose three
    tickets and four acceptance-criterion records changed status,
  And the inbox also holds two tickets of an unrelated epic with uncommitted edits,
  When the workflow records its closing commit,
  Then it calls the shared commit step in supervised mode naming the run and exactly the three
    tickets and four records,
  And the commit contains those seven files plus any edited structural parent record, and
    neither of the unrelated epic's tickets,
  And the workflow proceeds only on a committed answer and otherwise stops before any merge,
    reporting the answer's status and reason.

  Given finalize-feature's commit before this change and the shared step after it,
  When the migration is reviewed,
  Then no protection the finalize copy had and the shared step lacked is lost,
  And the regression tests behind every known issue fixed in finalize's commit path run against
    the shared step and pass.
