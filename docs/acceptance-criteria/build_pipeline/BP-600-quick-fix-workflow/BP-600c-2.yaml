    relationship: describes
    status: exists
    relevance: >-
      The xfail downgrade this criterion defends against. It applies to any
      failing test whose covers-tag names an AC that is not work_status: done —
      which a brand-new quick-fix AC never is.
  - path: templates/workflows-js/quick-fix.js
    relationship: implements
    status: exists
    relevance: >-
      Phase 2. The strict_command_run field is required by the runner's result
      schema and the workflow blocks with halt_reason "strict_flag_missing"
      when it does not contain the strict prefix — that guard is the
      load-bearing part of this criterion, not the prose instruction.
assigned_agent: workflow-architect
estimated_complexity: M
it_requirements:
  - "Must operate at depth 0 per ADR-006 — phase agents dispatched at depth 1 via the Agent tool"
  - "Requires Claude Code >= 2.1.154 for JS workflow script support"
  - "Must handle errors gracefully per the project error handling policy"
  - >-
    Must require the runner to report the exact command it ran, and must
    verify that report carries the strict enforcement prefix before reading
    the pass/fail verdict. Instructing the agent to use the prefix is not
    sufficient on its own — the check on the returned command is what makes
    the requirement enforceable rather than advisory.
  - >-
    Must halt the workflow (not just warn) if the test passes before the fix is
    applied, and must halt separately, with a distinct reason, when the strict
    prefix is unverifiable. The two halts have different remedies and must not
    be collapsed.
delivers_to:
  agent: workflow-architect
  contract: "Red-phase result: { passed: boolean, strict_command_run: string, output_summary: string|null, failure_message: string|null }. passed must be false to continue. strict_command_run must evidence the strict enforcement prefix or the result is rejected. The failure text is also consumed by the root-cause divergence check."
expects_from:
  ac_id: BP-600c-1
  contract: "Test file absolute path (string) written by the test-writer agent"
origin_agent: business-analyst-v3
created: 2026-06-05
amended_by:
  - reason: behaviour-change-restatement
    by: business-analyst
    at: '2026-08-24'
    note: >-
      Two original clauses are kept: the workflow still dispatches test-runner
      against the new test file, and it still halts when the test unexpectedly
      passes. What was false by omission is now stated — "the test-runner
      reports at least one FAILED result" was accepted unqualified, and an
      unqualified failure verdict is exactly what pytest_ac_enforcement's xfail
      downgrade makes unreliable for a brand-new AC. The workflow now requires
      the runner to report the command it ran and rejects the verdict when that
      command does not carry the strict enforcement prefix. The verbatim halt
      string was replaced with a description of what the halt must convey: the
      quoted text never matched the string the workflow actually emits, so as
      written the criterion was unsatisfiable by the implementation it governs
      while appearing precise. The delivers_to contract was corrected — it
      declared an outcome enum of FAILED/PASSED/ERROR and an assertion_location
      field, neither of which exists in the shipped result shape, and omitted
      strict_command_run, which is the field the gate actually turns on.
      Title amended. work_status left done.
