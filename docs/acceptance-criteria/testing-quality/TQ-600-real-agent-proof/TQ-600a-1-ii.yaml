readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given the live-dispatch switch set, and a request to a real agent that cannot be made --
    because no credentials for the model service are available, because the agent the case
    names is not registered, because the request fails in transit, or because a permission
    request is raised that no one is present to answer --
  When the cases that ask a real agent run,
  Then each case that could not ask its agent is reported as failed, naming which of those
    four stopped it,
    And none of them is reported as skipped, not run or passed,
    And the run as a whole is reported as failed.

  Given the live-dispatch switch set, and a request whose agent could not be launched or
    whose reply could not be read,
  When the case's own check would otherwise run,
  Then the case is reported as failed naming the cause that stopped the request,
    And its check is not run against an empty reply, so the failure is never reported as
    the check accepting or rejecting an answer the agent did not give.
