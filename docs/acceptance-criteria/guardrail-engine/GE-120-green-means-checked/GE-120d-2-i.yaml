    relevance: "Defines the built workspace; the never-built case is its absence, and the resolving action is the build command this ADR specifies."
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "DEFINE THE TWO CAUSES PRECISELY. NEVER-BUILT: no .leafcutter/ directory and no scripts/ build outputs in the workspace — only templates/. BUILT-BUT-INCOMPLETE: the layout exists and one expected artifact is genuinely absent. DISCRIMINATE ON THE PRESENCE OF THE LAYOUT, not on the absence of whichever single file happened to be looked up first — that is the mistake that produces one generic message for two causes."
  - "The never-built message names the SINGLE resolving action — 'python scripts/build.py --target-dir <workspace>', or ./build-self.sh in the package's own workspace. The built-but-incomplete message names the ABSENT ARTIFACT by path. The two messages must not share a template string, or they will converge again the next time someone edits one."
  - "BOTH CONDITIONS STILL FAIL THE SET-UP. The distinction is in the message and the remedy, never in whether set-up proceeds — a refusal the reader cannot act on gets worked around, and the workaround is what re-creates the unprotected copy by hand."
  - "SHARE THE CLASSIFIER WITH GE-120b-1-i, which draws the identical never-built vs built-but-incomplete line on the check side. Two independent classifiers for one distinction will drift, and they will drift in the direction of whichever surface is edited more often."
  - "ADR-001 deployed/template parity across all three copies of setup_ticket_worktree.py: edit templates/scripts/, run 'python scripts/build.py --target-dir .', confirm scripts/ and .leafcutter/scripts/ match."
test_spec:
  - name: test_ge120d2i_never_built_workspace_reports_build_cause_and_action
    target_dir: unit_tests/setup/
    framework: unittest
    type: behavioral
    description: "Set-up run in a workspace with no deployed layout and no build outputs reports the not-built cause and the single resolving command."
  - name: test_ge120d2i_built_but_missing_artifact_names_that_artifact
    target_dir: unit_tests/setup/
    framework: unittest
    type: behavioral
    description: "Set-up run in a built workspace with one expected artifact absent produces a different message naming that artifact by path."
  - name: test_ge120d2i_generic_not_found_message_not_used_for_either_cause
    target_dir: unit_tests/setup/
    framework: unittest
    type: behavioral
    description: "Neither condition produces the generic not-found message that leaves the two causes indistinguishable."
  - name: test_ge120d2i_both_conditions_still_fail_the_setup
    target_dir: unit_tests/setup/
    framework: unittest
    type: behavioral
    description: "Both the never-built and the built-but-incomplete condition fail the set-up rather than proceeding."
test_rationale: "The criterion is that two causes are TOLD APART, so a single run against either one cannot demonstrate it — both must be exercised in the same suite and their messages compared. Simulating never-built by deleting one file from an otherwise built layout produces the built-but-incomplete condition instead, which would pass while the real never-built path still emits the generic message."
