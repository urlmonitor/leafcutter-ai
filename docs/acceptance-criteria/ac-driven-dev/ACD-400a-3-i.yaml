test_spec:
  - name: test_grandparent_ancestor_does_not_block_leaf
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    covers: [ACD-400a-3-i]
    description: "Builds a three-level fixture (L1 'Y-200a' -> L2 'Y-200a-1' -> L3 'Y-200a-1-i', both composites not done); runs the scanner with leaf+todo filters and asserts 'Y-200a-1-i' is in the ready list and NOT in the blocked list."
  - name: test_no_transitive_ancestor_named_as_blocker
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: unit
    covers: [ACD-400a-3-i]
    description: "Runs the scanner over the three-level fixture and asserts no blocked entry names either 'Y-200a-1' (parent) or 'Y-200a' (grandparent) as a blocker of the L3 leaf."
