criteria: |
  Given the harvester (INF-400c-2) routes a learning with entry_kind "per-folder-readme"
    and destination "docs/acceptance-criteria/infrastructure/README.md",
  When the harvester's capture-learning write executes,
  Then if the README.md does not exist, it is created with a standard header:
    "# infrastructure — Accumulated Domain Context" followed by a blank line,
  And the learning is appended as a new bullet under a "## Learnings" section,
  And each bullet is prefixed with the date and originating agent
    (e.g., "- 2026-06-05 [business-analyst-v3]: INF prefix, no parent component"),
  And subsequent writes append new bullets without overwriting existing content.
