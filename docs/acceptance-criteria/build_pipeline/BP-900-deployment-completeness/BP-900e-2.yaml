created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900e.yaml"
criteria: |
  Given the commit-guardian hook registry registers a hook whose entry resolves
    to scripts/commit_guardian/check_ac_schema.py
  And a deploy-source copy exists at
    templates/scripts/commit_guardian/check_ac_schema.py
  And every other registered hook also has a deploy-source copy under
    templates/scripts/
  And no deployable template references a script that lacks a template copy
  When the registry-completeness check runs at the finalize merge gate
  Then the check reports no registry-completeness violations
  And check_ac_schema.py does not appear in any promised-but-undeployed list
  And the merge gate is not blocked by this check
  And the check does NOT inspect whether the existing template copy is
    byte-identical to its source (that comparison is owned by BP-1000a-1, not
    by this check)
depends_on:
