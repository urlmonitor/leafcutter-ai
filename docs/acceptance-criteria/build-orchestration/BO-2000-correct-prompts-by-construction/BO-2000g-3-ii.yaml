covered_by: []
implemented_by: []
notes: |
  Wrong versions this record catches:
  (1) Inferring the exemption from placeholders (`<agent-name>`, `ok|blocker|...`). Every
  real template example also uses placeholders (`YYYY-MM-DD HH:MM`, `<sha>`), so an
  inferred rule ends up exempting the very examples the lint exists to check.
  (2) A file-wide or block-wide exemption. One mark in the signoff skill would then
  exempt all of its §6 examples, which are the known violators.
  (3) Treating the inline mention in the shared sign-off block (_signoff_block.md:19,
  "exactly `### YYYY-MM-DD HH:MM — <your-name> (status: ok)`" inside a sentence) as an
  example. That would force a feedback-id line into prose.
  The clause "the mark exempts that heading alone" was not asked for. It is what stops
  the exemption from swallowing the fix.
test_spec:
  - name: test_the_three_marked_illustrations_do_not_fail_the_lint
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      The mark token is read from its definition in the signoff skill (fail loudly when absent). Runs the
      lint on the real files as shipped and names each illustration by file: signoff skill heading-schema
      block, ticket-authoring Comments heading line, building-epics routing illustration. Each must be
      found and counted as exempted, so a run where one is missing fails rather than passing on the
      other two.
    proves_clause: 'it does not fail on any of the three illustrations'
    code_file: unit_tests/prompt_assembly/_bo_2000g_3_support.py
    to_be_created: true
    convention_test_file: unit_tests/prompt_assembly/test_signoff_block_protocol.py
  - name: test_removing_the_mark_makes_the_signoff_illustration_fail
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      On a tmp_path copy of the signoff skill the mark is taken out of the heading-schema illustration
      only. The lint fails on that heading although its agent slot is <agent-name>, its status tag lists
      four values and nothing follows it inside its fenced block. Templates are never edited.
    proves_clause: 'it fails on that illustration. An example is not exempted because its agent slot is a placeholder, because its status tag lists several values, or because nothing follows it inside its fenced block'
    code_file: unit_tests/prompt_assembly/_bo_2000g_3_support.py
    to_be_created: true
    convention_test_file: unit_tests/prompt_assembly/test_signoff_block_protocol.py
    must_catch:
      - an exemption inferred from a placeholder agent slot
      - an exemption inferred from a status tag that lists several values
      - an exemption inferred from nothing following the heading inside its fenced block
  - name: test_the_mark_exempts_only_the_one_heading_it_annotates
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      One tmp_path skill file holds a marked illustration and, further down, an unmarked
      ### 2026-05-08 15:25 — pr-reviewer (status: blocker) followed directly by a prose line. The lint
      fails on the unmarked example and names its 1-based line number. A second case puts the unmarked
      heading inside the same fenced block as the marked one.
    proves_clause: 'it fails on the unmarked example and names its line number. The mark covers only the heading it annotates, never the rest of its fenced block or its file'
    code_file: unit_tests/prompt_assembly/_bo_2000g_3_support.py
    to_be_created: true
    convention_test_file: unit_tests/prompt_assembly/test_signoff_block_protocol.py
    must_catch:
      - a file-wide exemption once one mark appears in the file
      - a block-wide exemption covering the rest of the marked fenced block
      - an exemption that reads the mark from any line near the heading rather than the annotated heading
  - name: test_a_heading_quoted_mid_sentence_is_not_an_example
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      The real sentence in templates/agents/_signoff_block.md (item 3, exactly
      ### YYYY-MM-DD HH:MM — <your-name> (status: ok) inside prose) is run through the lint, and so is a
      synthetic sentence. Neither is examined: examined does not count it and no failure names it.
    proves_clause: 'that quotation is not treated as an example and is not examined'
    code_file: unit_tests/prompt_assembly/_bo_2000g_3_support.py
    to_be_created: true
    convention_test_file: unit_tests/prompt_assembly/test_signoff_block_protocol.py
    must_catch:
      - a recogniser that matches ### anywhere in a line rather than at line start after indentation
      - a lint that demands a feedback-id line inside the prose of _signoff_block.md
  - name: test_exemption_is_reached_through_a_fresh_interpreter_run_over_the_real_tree
    target_dir: unit_tests/prompt_assembly/
    framework: pytest
    type: unit
    angle: reachability
    description: >-
      Runs the lint entry point in a fresh python -I subprocess from the repo root over the real
      templates tree, prints the result as JSON, and asserts exit 0, exempted of at least three, and no
      failure naming any of the three illustration files at its illustration heading.
    proves_clause: 'it does not fail on any of the three illustrations'
    code_file: unit_tests/prompt_assembly/_bo_2000g_3_support.py
    to_be_created: true
    convention_test_file: unit_tests/prompt_assembly/test_signoff_block_protocol.py
