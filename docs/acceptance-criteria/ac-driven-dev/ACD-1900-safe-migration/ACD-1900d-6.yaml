title: "emit=true is refused unless the dual-read resolver and migrated read-side templates are deployed"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given the dual-read spec resolver and the migrated read-side agent and gate templates
    are NOT all present in the deployed layout,
  When ac_unit_of_work.emit is set to true,
  Then the flip is refused with an error naming each missing read-side surface,
  And ac_unit_of_work.emit remains false;
  And given the dual-read resolver and the migrated read-side agent and gate templates
    ARE present in the deployed layout,
  When ac_unit_of_work.emit is set to true,
  Then the flip is accepted.
depends_on:
  - ACD-1900d
  - ACD-1900b-1
  - ACD-1900c-1
