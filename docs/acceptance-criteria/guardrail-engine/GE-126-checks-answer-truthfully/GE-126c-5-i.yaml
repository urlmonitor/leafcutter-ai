id: GE-126c-5-i
title: "A verdict that did not move under an applied alteration is reported as an alteration that changed nothing, and is distinguishable from one that never reached the code"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
  - testing_quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given a guard whose refusal of its known-bad input has been observed and recorded,
  And an alteration intended to remove that refusal has been applied to a copy that
    the run names among the copies it loaded,
  When the proof runs and the guard's verdict on the known-bad input is unchanged,
  Then the run reports that the alteration reached the code and changed nothing,
    names the copy altered and the copies loaded, and fails,
  And it does not report the unchanged verdict as a proof that succeeded,
  And given the identical alteration is applied instead to a copy the run does not
    name among the copies it loaded,
  When the proof runs,
  Then the reported reason distinguishes the two cases by name — an alteration that
    reached the code and changed nothing, against an alteration that never reached
    the code — and a reader of the report can tell which occurred without opening
    either copy.
