change_target: pipeline
risk_surface: contract_boundary
notes: "Verified defect, 2026-08-13. Today both gates emit an INFO line for an artifact they cannot compare ('not in manifest (new template — run build.py before committing built outputs)' in check_build_drift.py; 'not in output_mappings (intentional one-off or newly added output; run build.py to register it)' in check_output_drift.py) and then exit as if the run were clean, so a deliberate exemption and an accidental omission are indistinguishable and both read as success. Complements GE-118b, which covers the whole-manifest-missing case; this AC covers the per-artifact case."
