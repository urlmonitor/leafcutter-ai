id: INF-500a
title: "Retrospective facts are accurate even after the epic folder has been archived"
component: infrastructure
level: L1
status: active
work_status: todo
criteria: |
  Moving an epic to done never breaks the retrospective's ability to find its history.

  When extract_epic_facts.py runs against an epic folder that has been moved
  from its original path to tickets/99_done/, it detects the rename via git
  history, resolves the original path, and produces non-zero commit counts
  and populated dates. When no commits can be found after all fallback
  attempts, the script exits non-zero with a clear warning — never silently
  returning null dates. Manual SHA overrides are available for edge cases
  where git history is genuinely ambiguous.
