it_requirements:
  - "THE DISPATCH POINT IS NAMED PER PATH SO IT IS NOT RE-DERIVED FIVE TIMES. The contract in every case is the same sentence — immediately before the commit the path already makes, on the same branch, in the same working directory — and the sites are: fast-lane-ship.js, before the commit dispatch that begins at line 1371 (its agentType: commit is at line 1392); quick-fix.js, before the FIRST commit dispatch, the fix commit whose options object is at line 918, and NOT before the changelog commit at line 988; finalize-feature.js, before step 3.5's closure commit, whose command is composed at line 1646; build-ticket.js, inside the sequential phase loop that begins at line 1258, immediately before the iteration whose phase name is commit, guarded to fire at most once per drive. Line numbers locate the site; they are not the contract, and a builder who finds them shifted should re-anchor on the named commit rather than on the number."
  - "DO NOT WIRE build-ticket.js BY ADDING knowledge-harvester TO THE phaseOrder ARRAY — IT PO correction, and this one is load-bearing rather than stylistic. phaseOrder (lines 201-226) is a SORT KEY, not a dispatch list: line 1181 sorts orderedPhases filtered to status needed, and orderedPhases comes from the TICKET's own agents: frontmatter map. An agent absent from that map is never dispatched however it sorts. config/agent_registry.json gives knowledge-harvester is_ticket_phase false and selection_criteria null, so no ticket generator will ever emit it into an agents map. A phaseOrder entry therefore routes nothing while making the wiring look present in a diff and in any structural test — which is the precise shape (a gate defined, ordered and never executed) this repository shipped in fast-lane-build.js and that this whole family exists to close. If the entry is added anyway to silence the PHASE-ORDER GAP diagnostic at line 255, it is cosmetic and must not be counted as the wiring."
  - "THE EPIC PATH DOES NOT INHERIT THE build-ticket.js CHANGE. build-epic.js line 388 dispatches the ticket-supervisor AGENT rather than calling build-ticket.js, and that agent drives phases from templates/skills/building-epics/SKILL.md, whose Canonical Phase Ordering Table in section 2.1.1 is a second independent copy of the ordering. Whichever surface is edited, coverage must be shown for the epic drive as well as the single-ticket drive; a green single-ticket test over an unwired epic path is the partial wiring INF-700a-1-i names."
  - "THE HARVESTER MUST RETURN A MACHINE-READABLE MANIFEST OF THE PATHS IT WROTE. This is the load-bearing gap in the whole decision — larger than the choice of carrier, because every carrier fails without it. scripts/knowledge/harvest_learnings.py returns an int exit code (0/3/4) and prints result.summary() as prose; nothing in its output enumerates the files it touched. The commit agent stages BY NAME and is forbidden from git add -A (templates/agents/commit.md line 412), so with no manifest it cannot learn what to stage, the routing writes are left in the working directory, and the run reports them written while no merged tree ever receives them — which is this AC's defined failure, produced by the implementation of this AC. REQUIRED PROPERTIES: a list of paths in a parseable form, on a channel the caller reads; every destination ACTUALLY written, not every destination attempted; and an EMPTY list rather than an absent field when nothing was written, so 'nothing to stage' is distinguishable from 'the manifest is missing'. TWO NEAR-MISSES THAT ARE NOT SUBSTITUTES: building-epics SKILL.md section 5.9 requires the commit agent to sweep in-scope modifications before committing, but in-scope means the ticket's files_touched and no ticket names memory/*.md or a knowledge documentation surface; and fast-lane-ship.js's commit prompt does instruct git add -A at line 1384, in contradiction of the agent template it dispatches under, so that ONE path would work by accident. Neither generalises and neither should be relied on."
  - "THE HARVESTER NEEDS AN EXPLICIT WORKING-DIRECTORY PARAMETER. It accepts --sink, --state, --dry-run and --verbose only, and resolves everything else against the invoking process's current directory. It is moving from a standalone tool to a step invoked mid-sequence by four orchestrated workflows, each of which already holds the worktree path as a variable. Requiring the caller to pass it explicitly is what stops the routing step writing into whichever directory the driver's shell happened to be standing in — the same defect class INF-400c-4 is closing one layer down for the sink, and it would be an odd outcome to fix the sink's resolution and leave the destinations' resolution implicit."
  - "THE HARVESTER'S STATE FILE IS A THIRD UNDECLARED RELATIVE PATH — RAISED, NOT SETTLED HERE. --state defaults to debugging/logs/harvest_state.json. INF-400c-4 declares the sink at build time and INF-400c-4-iii extends that to the operational stream; neither names the state file. It is the bookkeeping this AC's own criteria forbid outliving the publication they rode, and the bookkeeping INF-700a-5-iii arbitrates over. Left relative it fragments per working directory — which happens to satisfy this AC's bookkeeping clause by accident, because a per-branch mark dies with the branch, while breaking idempotence across drives so completely that every fresh working directory re-routes the entire sink. Do not solve the bookkeeping clause by leaving the state file relative; that is a coincidence, not a design."
  - "finalize-feature STEP 3.5 IS ACCEPTED AS A CARRIER AND IS THE ARCHITECTURALLY WEAKEST OF THE FOUR. Its closure commit has a recorded history of operating store-wide rather than epic-scoped — the workflow carries a SCOPE VIOLATION abort at line 1682 for exactly that reason — so folding knowledge writes into it widens the blast radius of any future recurrence from acceptance criteria to curated memory and documentation files. It is accepted because the only alternative available under this AC's own rejected-alternatives list is a new unattended commit inside the routing step, which is worse. RECOMMENDED FOLLOW-UP, to be raised as its own AC and NOT absorbed here: evaluate a narrow purpose-scoped commit on the finalize path carrying only the routing writes. It is a follow-up rather than an it_requirement because it is in direct tension with this record's own same-number-of-commits clause, which such a commit would fail as written — so it cannot be adopted without amending a criterion, and that is the BA's decision, not mine."
  - "DO NOT ABSORB THE REVIEW-SEMANTICS PROBLEM INTO THIS FAMILY. The 15 inconsistent entry_kind values in the existing corpus are cited on INF-400c-4 as evidence for keeping learnings inside a reviewed pull request, and it is tempting to read them as an argument about WHICH publication path to choose. They are not: no publication path solves them. A separate pull request carrying only knowledge writes attracts exactly as little scrutiny as a paragraph inside a feature pull request, so the choice of carrier buys nothing here in either direction. What fixes them is validation BEFORE the write, on the emitting and writing side, and it belongs in its own AC there — INF-400c-5's validating emission helper is the nearest existing home. Nothing in this record makes the routing step responsible for record quality, and no it_requirement here may be read that way."
  - "THE PUBLICATION MECHANISM IS NOT UNIFORM ACROSS THE FIVE PATHS — verified, so that no constraint written here assumes it is. templates/agents/pull-request.md step 1 reads git log origin/<base>..HEAD and takes no alternate-branch parameter, so it can only ever describe the CURRENT branch; and quick-fix.js's Close phase (lines 1010-1044) inlines git push and gh pr create in a prompt with no agentType at all, so it does not use that template. Neither blocks the decision recorded here, because the requirement is that the writes ride a COMMIT the path already makes and every path makes one. What it does mean is that any requirement phrased in terms of 'the pull request' is false on at least one path, and any verification written against the pull-request agent covers at most three of the five. Phrase constraints and tests against the commit."
  - "Must handle errors gracefully per the project error handling policy. A routing failure, a manifest failure or a staging failure must never fail the unit of work; the fail-open behaviour and its reporting are INF-700a-5-i's and must not be re-specified here."
