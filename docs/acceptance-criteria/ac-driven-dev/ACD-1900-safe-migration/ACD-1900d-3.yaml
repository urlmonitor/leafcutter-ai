it_requirements:
  - "Canonical source: scripts/build_phases.py (the deploy_map / deploy-manifest) and the gate-promotion check. Promotion of a gate to a required check MUST be refused with an error naming the missing deploy-manifest entry when its backing script is absent from the deploy_map, and permitted when present (ADR-026 non-negotiable rule 2, deploy-manifest-first; the done_proof.py ModuleNotFoundError precedent)."
  - "The check must read the actual deploy_map in scripts/build_phases.py, not a duplicated list; a script's presence must be determined from that single source."
  - "Test must EXECUTE the promotion check with the script absent from and present in the deploy_map and assert refused/permitted -- never grep-only."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file I/O in typed try/except and log-or-reraise; no bare except."
test_spec:
  - name: test_promotion_refused_when_absent_from_deploy_manifest
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Promotion of a gate whose backing script is absent from the build deploy-manifest is refused with an error naming the missing entry."
  - name: test_promotion_permitted_when_in_deploy_manifest
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Promotion is permitted when the gate script is present in the deploy-manifest."
