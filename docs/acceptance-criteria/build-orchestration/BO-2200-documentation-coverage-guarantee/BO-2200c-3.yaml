criteria: |
  Given the generator is building the contract line for a leaf AC and the generator has
    loaded only that single leaf AC record,
  When it determines the Diataxis genre for the line,
  Then it resolves the leaf AC's parent L1 via the parent/`depends_on` link and reads the
    parent L1's `documentation_triggers` field to source the genre.
  And when the parent L1 declares multiple `documentation_triggers` (for example
    `[how-to, sequence-diagram]`), the contract reflects each declared genre.
