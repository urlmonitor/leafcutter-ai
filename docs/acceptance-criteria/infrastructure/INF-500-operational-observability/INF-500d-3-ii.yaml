notes: |
  SOURCE. KI-FC-002 half (2). The signoff skill tells every agent to save the error
  stream to the same fixed file in the shared temporary directory and then search
  that file. With per-submission recovery files (INF-500d-3-i) alone, agent X can
  still read agent Y's recovery line if Y's submission overwrote the shared file
  between X's submit and X's search. Both halves are needed.

  SCOPE IS WIDER THAN THE SIGNOFF SKILL (found while reading the instruction
  surfaces, 2026-10-25). The same shared fixed name is also copied verbatim into
  documentation-verifier and user-surface-smoker. live-surface-tester uses a
  workspace-relative fixed name. A fix limited to the signoff skill leaves three
  copies of the defect.

  THE "EXISTING CONVENTION" IS NOT PARALLEL-SAFE EITHER. The user request and the KI
  cite ticket-supervisor's per-name files as the model to follow. Those names are
  keyed on the EVENT KIND (mechanical-retry, cross-agent-rework,
  brainstorm-escalation, halt), not on the ticket. Under /build-feature, one
  supervisor runs per ticket in a batch, so two supervisors halting at the same time
  share a file. The second scenario covers that. Follow the convention's shape (a
  distinguishing suffix), but key it on ticket and phase as well.

  Why ticket + phase is enough: one ticket never runs two instances of the same
  phase at the same time. If the IT PO finds a surface where that is false (for
  example a retried phase overlapping its predecessor), add a further distinguishing
  part to the name. Do not weaken the criteria.

  Keep each instruction a single shell command (shell convention). The recovery
  search must read the same per-run file the submit step wrote. A mismatch between
  the two names makes the search find nothing, so it fails safe, but every agent
  would then lose its id.

  Behavioural, not grep-only (CLAUDE.md "Gate / Workflow ACs"): the check in the
  fourth scenario must fill in the prescribed names for two concrete runs and assert
  they differ. A scan that only checks a suffix exists is not enough.
