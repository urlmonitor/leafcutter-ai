criteria: |
  Day one: a working record that honestly says it is empty.

  When the tooling is installed into a project that has never used it, that
  project comes away with a genuine, working, empty record — one that reports
  itself as empty and behaves correctly from the first day, rather than arriving
  broken, arriving pre-filled with somebody else's content, or appearing to work
  because there is nothing in it yet.
