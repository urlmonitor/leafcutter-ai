title: "One run tells you every problem the build can see, not just the first one"
component: build-pipeline
level: L1
status: active
req_status: draft
readiness: draft
priority: medium
roadmap_phase: phase_1
work_status: todo
criteria: |
  The whole list in one pass -- and every item says which check found it.

  A build's preflight checks all get to run, and their findings arrive together,
  so a single run hands you the complete set of things to fix instead of
  revealing them one repair at a time. You stop paying a full build for each
  problem, and you can see at a glance whether you are looking at one fault or
  five.

  Every finding names the check that made the judgement. Today a problem is
  described by whichever check happened to reach it first, which may be a check
  that does not understand it -- so the advice you are given can be for a
  problem you do not have, and following it does not help. Naming the source of
  each finding is what makes the advice trustworthy and what lets you tell two
  findings apart when they describe the same file.

  Where a check genuinely cannot give a verdict after an earlier one has failed,
  the run says that check did not run. It is never left to look like a check
  that passed, because a check that was skipped and a check that was satisfied
  are the two things an operator must never confuse.
