id: BO-400a-2-iii
components:
  - build_orchestration
title: "A ticket with any needed phase skipped, blocked or unrecorded is never recorded done"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given three tickets carried by one drive --
      the first has a needed phase that was held back and never dispatched,
      the second has a needed phase that was dispatched and reported a blocker,
      the third has a needed phase that was dispatched and reported success but
        whose sign-off is absent from the ticket's record,
  When the drive finishes each of the three,
  Then none of the three has its recorded lifecycle state changed to done,
    And each ticket's record still names the phase that is outstanding,
    And the drive's report lists each of the three as not completed and names the
      outstanding phase,
    And a drive that cannot read a ticket's record back at all leaves that ticket's
      state untouched and reports it as not completed, rather than assuming the
      earlier phases were enough,
  So missing, blocked and unreadable evidence all read as not done, and only evidence
    that is present and positive can produce a done record.
depends_on:
  - BO-400a-2
