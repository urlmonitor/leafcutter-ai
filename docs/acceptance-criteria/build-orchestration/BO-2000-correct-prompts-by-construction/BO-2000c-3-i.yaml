title: "An unresolvable reference pattern is surfaced as an authoring error"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an AC whose reference pattern matches no file (or matches more than one),
  When a ticket is generated from that AC,
  Then generation surfaces an authoring error that names the AC id and the
    unresolvable pattern,
  And it does not silently emit the raw pattern or a broken path into the ticket body.
