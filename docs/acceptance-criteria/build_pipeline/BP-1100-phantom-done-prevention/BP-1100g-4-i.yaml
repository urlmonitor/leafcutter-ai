assigned_agent: python-coder
estimated_complexity: S
declares_side_effect: true
it_requirements:
  reference_file_path: "scripts/commit_guardian/commit_guardian.json"
  n_location_rule: "0 — no registration change; this AC constrains the behaviour and the wording of the hook BP-1100g-4 registers"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/commit_guardian/ -q"
  config_schema_fragment:
    type: object
    description: "The success outcome's wording contract. Byte-identical for a pasted claim and a genuine one, and free of any execution vocabulary."
    required:
      - outcome
    properties:
      outcome:
        type: string
        const: "promised and claimed"
      forbidden_substrings:
        type: array
        items:
          type: string
          enum:
            - reached
            - proven
            - verified
            - done
        description: "None of these may appear in the success wording — a comparison of two strings must not report an execution fact."
  constraints:
    - "NOTE ON reference_file_path: this AC modifies no file of its own; it constrains the hook BP-1100g-4 creates and registers. commit_guardian.json is named because the field must resolve to a real path, and n_location_rule is zero for the same reason it is zero on a negative control."
    - "THE MECHANISM CONSTRAINT IS TESTABLE AS AN INVARIANCE, AND MUST BE IMPLEMENTED SO IT HOLDS: the outcome for a pasted claim must be byte-identical to the outcome for a genuine one, and must STAY identical when the claiming test's body is replaced wholesale with an unrelated body carrying the same tag. No text-inspecting implementation can satisfy that, which is the point."
    - "No path to the outcome may open, read, parse, tokenize, import-for-inspection or pattern-match the BODY of the claiming test. Collecting the tag via BP-1100g-3's scanner is the permitted read; anything beyond the tag is not."
    - "THE WORDS GOVERN, AND ARE WHERE THE WIDENING WILL ACTUALLY HAPPEN. The output must say 'promised and claimed'. The strings reached, proven, verified, and done must not appear in the success wording. A check reporting 'reachability verified' for a pasted tag has made a claim about execution from a comparison of two strings, and the next reader to build on that output will believe it."
    - "DO NOT ADD PASTE DETECTION, and do not author a sibling that tries to. Detecting the paste requires deciding from the test's text whether it does what it claims, which is exactly what BO-2900a-2 prohibits. The lie is caught downstream by BO-2900a's execution observer, which is the only mechanism that can catch it."
    - "This accepted outcome must be documented on the reference page BP-1100g-6 produces, in the reader's words, so the hole is visibly deliberate rather than looking like an oversight someone should close."
delivers_to: null
expects_from:
  - ac_id: BP-1100g-4
    contract: "An outcome computed from exactly two inputs — the promised kinds from the plan and the claimed kinds from the tag scanner — with the success wording under this AC's control."
test_spec:
  - name: test_bp_1100g_4_i_pasted_claim_is_not_refused_and_is_worded_as_promised_and_claimed
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "A promise answered only by a pre-existing direct-import test that was given the tag and nothing else is NOT refused, and the reported outcome contains 'promised and claimed' and none of reached / proven / verified / done."
  - name: test_bp_1100g_4_i_outcome_is_byte_identical_under_a_wholesale_body_swap
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Write two real test files to disk carrying the same tag — one a genuine entry-point test, one an unrelated body — run the check against each, and assert the outcome bytes are identical. Then replace the claiming test's body wholesale a third time and assert the bytes are still identical. Any implementation that inspects the body fails this."
  - name: test_bp_1100g_4_i_invariance_holds_through_the_deployed_hook
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT: run `python .leafcutter/scripts/commit_guardian/run_hook.py .leafcutter/scripts/commit_guardian/<hook>.py <staged paths>` as a subprocess for the pasted-claim case and the genuine case and assert identical exit codes and identical output — the invariance must hold on the path that actually gates a commit, not only in the library."
test_rationale: |
  This AC's content is an invariance, and invariances are only observable by comparing two
  runs. The discriminating shape is the wholesale body swap: the claiming test's source is
  replaced entirely while the tag stays, and the outcome must not move by a single byte.
  No text-inspecting implementation survives that, which is why it is the test rather than
  an assertion that the code contains no regex. The deployed-hook variant is included
  because the invariance has to hold where the commit is actually gated.
