title: "status-checker close-out calls set_ticket_status.py instead of git mv"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket that has been driven to completion by ticket-supervisor
    (all agents in {signed_off, not_needed})
    and status-checker is dispatched for the two-pass close-out,
  When status-checker verifies the ticket is done-eligible,
  Then it invokes set_ticket_status.py with --ticket <path> --status done
  And it does NOT invoke git mv to move the ticket into a done/ subfolder
  And it flips pull-request: needed -> signed_off in the agents map
    (per the existing epic convention: one PR per epic, not per ticket)
  And the ticket file remains at its original path after close-out.
