it_requirements:
- A folder qualifies as half-cleared only when it sits at a workspace position inside this project's own
  landing place, its repository is gone, and it holds nothing but at most a workspace record naming this
  project and empty folders; the decision derives from the folder's contents, never from a name list.
- A folder in another project's landing place, or whose record names another project, is never touched
  (BO-4300e-2-iii rule unchanged), even when it carries no record at all.
- Finishing a half-cleared folder makes no network call to the shared project.
- If the hub branch named by a half-cleared record still exists, it is handled by the same unsent-work
  rule as a normal clear; finishing never deletes a branch holding commits that are not on the shared
  main line.
- 'Repeated requests on the same half-cleared folder converge: each either finishes it or leaves it unchanged,
  never in a new partial state.'
- Must log at info level that a half-cleared workspace was finished, with its path.
- Edit the template source under templates/scripts/, never a deployed build output (ADR-001); the change
  must reach the deployed maker through the normal build.
- Must keep the existing answer envelope and existing answer codes backward compatible; any new answer
  field or code must be additive.
- Must stay within the project's file-size and complexity limits for the maker modules; if the remove
  module would exceed them, the new logic moves into a sibling maker module rather than raising a limit.
- Every refusal must leave the workspace folder, its repository and its workspace record unmodified (no
  write, rename or delete of any item), consistent with the standing never-delete-unsent-work rule.
test_intent:
- clause: each of shop's three requests is answered cleared, and no folder or file of it remains at its
    location
  needs_test: true
  reason: Recognising the three half-cleared shapes and finishing them is new computed behaviour.
- clause: none of shop's three requests is answered "not found"
  needs_test: true
  reason: The observed defect answered not found for exactly this case, so the regression must be pinned.
- clause: the request for blog's "ticket/alpha" is refused, stating that shop has no workspace at that
    location, and that folder is identical before and after
  needs_test: true
  reason: The project boundary is a safety rule that a too-broad half-cleared test would silently break.
- clause: no fetch or push reached the shared project of either project
  needs_test: true
  reason: A network call during finishing would reach the shared project, which a test can observe.
delivers_to: null
