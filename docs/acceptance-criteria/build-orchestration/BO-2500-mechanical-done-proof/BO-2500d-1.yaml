assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
  - "Remove the opinion-only LLM gate agents (pr-reviewer / code-review-architect, ac-validator, ac-fulfillment-gate) from the fast-lane phase order in the workflow layer (templates/workflows-js/build-ticket.js and the computed agents-map in scripts/ac_store/generate_ticket_from_ac.py)."
  - "The exclusion must be identified by the agent's role/kind (review / validator / fulfillment-gate), not by a hard-coded single agent name, so future opinion-only agents are excluded by the same rule."
  - "After removal, the only completion arbiters in the fast-lane order are the mechanical proof-of-done gates (red-baseline, green+coverage, covers-tag linkage)."
  - "This change must not alter the heavy-pipeline phase order (see BO-2500d-2)."
