id: TQ-200b-1-i
components:
  - testing_quality
title: "The eval runner hands an agent's template to the CLI through a file, so a large template runs on every platform"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the agent eval runner (scripts/evals/run_agent_eval.py) runs an agent whose
    template is larger than the platform's command-line limit (for example
    templates/agents/it-po.md at 51,263 bytes, above the Windows limit of about
    32,767 characters),
  When it invokes the claude CLI for a row, in label mode or in artifact mode,
  Then the template text reaches the CLI through a file passed with
    --system-prompt-file (label mode) or --append-system-prompt-file (artifact
    mode), and never as a command-line argument,
  And the file holds exactly the template text the runner would otherwise have
    passed inline,
  And the file is removed after the call, whether the call succeeded, failed or
    raised,
  And the bug symptom ("claude CLI could not be launched" on every row, score 0%,
    for a template over the command-line limit) must not occur.
depends_on: [TQ-200b-1]
