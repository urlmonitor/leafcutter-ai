priority: medium
roadmap_phase: phase_1
criteria: |
  Ask the whole family which of its members can still abstain silently.

  How many checks can return a clean answer from a path on which they inspected
  nothing is a question you can put to the system and get a measured answer to —
  not something discovered one check at a time by whoever happened to look. The
  answer says how many checks were examined alongside how many were found so a
  run that examined nothing cannot report nothing wrong.
