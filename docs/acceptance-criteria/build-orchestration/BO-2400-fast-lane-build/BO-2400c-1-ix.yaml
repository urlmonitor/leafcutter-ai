notes: |
  SCOPE AGAINST BO-2400c-1-iii. That record owns three causes — nothing came back, a
  reference came back, incomplete content came back — and owns the rule that each halt names
  its own cause and only its own. This record adds a fourth cause to that set and requires
  it to join distinctly. It does not restate the three, and it does not relocate ownership
  of them: if the two records ever disagree, -iii governs its three and this one governs the
  fourth and the ordering between the fourth and the incomplete-content case.

  THE ORDERING CLAUSE IS THE LOAD-BEARING PART, and it mirrors an existing decision rather
  than inventing one. -iii already requires reference-rejection to be evaluated before the
  landmark check, for exactly this reason: evaluated after, a locator that happens to
  contain the landmark is misfiled as incomplete content and two states collapse into one.
  The same collapse happens here in the other direction — corrupted content whose landmark
  did not survive is misfiled as incomplete content — and it is worse, because incomplete
  content implicates assembly, which is working.

  WHY THIS IS WORTH A CRITERION AT ALL. On 2026-08-31 the landmark check was the only thing
  that noticed anything was wrong, and it noticed by luck of shape: the landmark happened to
  contain a character the corruption happened to alter. Its report named the landmark. An
  operator reading that report goes to look at how the bundle is composed, which is
  correct, complete, and not the problem. Every hour spent there is a cost this criterion
  removes, and it is a cost that recurs on every occurrence.

  DELIBERATELY NOT IN SCOPE: the general rule that a halt must not state a reason its own
  evidence denies. That belongs to the BO-2400f-4-vi family, as -iii already records. This
  record specifies one instance of truthful diagnosis, not the rule.
