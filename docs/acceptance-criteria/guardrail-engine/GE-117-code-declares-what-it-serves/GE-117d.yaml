notes: |
  PO authoring note (for the BA). This L1 owns the ENFORCEMENT ACTION for the
  three declaration requirements (GE-117a module→component, GE-117b public
  symbol→AC, GE-117c new decision-history entry→AC). User-confirmed decision:
  FAIL-CLOSED / BLOCKING by default — the commit is REJECTED when an in-scope
  declaration is missing or invalid. This is the headline guarantee; do NOT
  decompose warn-only as the default behaviour at L2. A configurable warn tier
  may exist as a deliberately-opted-into behaviour (mirroring GE-100's
  warn-vs-block config), but the default and headline behaviour is BLOCK.
  Scope of what triggers the block is diff-only (new/changed code), inherited
  from GE-117a/b/c — this L1 does not redefine scope, only the action taken when
  those requirements are violated. The error message must name the file and the
  specific missing/invalid reference so it is actionable. The escape hatch that
  keeps this block from being a dead end is GE-117e — keep the two separate:
  GE-117d = the block; GE-117e = the opt-out/autofix route out.
  documentation_triggers [how-to, sequence-diagram] — a new commit-time guardrail
  behaviour authors must understand (how-to) plus a multi-actor commit-time
  interaction (developer -> hook -> AC store / component registry -> commit
  decision) that warrants a sequence diagram.
