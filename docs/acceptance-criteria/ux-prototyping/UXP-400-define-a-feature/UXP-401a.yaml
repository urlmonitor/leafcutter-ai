id: UXP-401a
readiness: reviewed
priority: medium
title: "When the person requests changes to the draft, the system revises the flow before ACs are generated"
component: ux-prototyping
level: L3
status: active
req_status: approved
work_status: todo
criteria: |
  Given a drafted flow, mock data, and mockups presented for review,
  When the person requests changes instead of approving,
  Then the system revises the draft flow (and its mock data and mockups) to reflect the requested changes,
  And no acceptance criteria are generated until a revised draft is approved,
  And the review can repeat until the person is satisfied.
