notes: |
  Split out of INF-500d-4 by the IT PO, 2026-10-09. The criteria are INF-500d-4's
  third scenario and the first two clauses of its fourth, copied verbatim. This
  record owns the part of those scenarios that is decided before any process
  starts: what the build writes, and what the worktree bootstrap tells the build.

  Why this is its own record: under the build-time anchor, durability depends on
  how a working directory is provisioned (INF-400c-4-v notes, 'WHAT IT COST'). The
  package's own worktree bootstrap runs the build inside every new worktree, so
  until this lands every drive declares a disposable root. That applies to the
  knowledge sink too, which INF-400c-4 records as done.
