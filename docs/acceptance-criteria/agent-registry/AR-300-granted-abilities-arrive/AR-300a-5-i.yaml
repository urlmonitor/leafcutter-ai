id: AR-300a-5-i
title: "No compiled prompt carries a hand-written sub-agent account -- table or list -- beside the delivered one"
component: agent-registry
components:
  - agent_registry
  - template_compiler
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the six agent definitions whose bodies carry a hand-written account of
    the sub-agents they may dispatch -- five as a table (three that agree with
    the central record and two that disagree with it) and one, ticket-supervisor,
    as a fenced list under "### Spawn Allowlist (is_ticket_phase agents)",
  When their compiled prompts are read after delivery is in place,
  Then each contains exactly one account of the agent's permitted sub-agents,
    and it is the delivered one,
    And the sub-agents named in it are exactly those its declaration permits --
      none named that it was not permitted, none permitted that go unnamed,
    And the same single-account property holds for every agent the build
      compiled, counted and reported, so a hand-written sub-agent account --
      a table OR a list -- added to any other definition later is caught
      rather than accumulated,
    And a definition that merely mentions sub-agent tables or lists in prose,
      without stating its own permitted sub-agents, is not counted as a second
      account,
  So an agent reading its own instructions is never choosing between two lists
    of who it may call on.
