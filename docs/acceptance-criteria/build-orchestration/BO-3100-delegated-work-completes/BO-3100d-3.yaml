readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an author deciding whether a new piece of work may be delegated,
  When they open the reference documentation for delegation,
  Then it states the constraint as: a dispatched agent must never depend on the result of
    anything it dispatches — if it needs the result it must do the work itself, or not be the
    one coordinating,
    And it states the reason: a dispatched agent has no idle state, so emitting text without
    acting ends that agent and the text becomes its result, and there is no waiting operation
    available to it,
    And it does not state that delegation is constrained by how many levels deep a dispatch is.

  Given the reference documentation,
  When each statement it makes about what a dispatched agent can and cannot do is exercised
    against the running system,
  Then the observed behaviour matches the statement.

  Given an author who follows the documentation's guidance for a piece of work that needs a
    result,
  When they apply it,
  Then the guidance directs them to the coordinating layer, and the arrangement they arrive
    at passes the sweep that BO-3100c-2 performs.
