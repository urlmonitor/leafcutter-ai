criteria: |
  Run-and-report goes to the test-runner, not the test-writer -- the fit is checked, not assumed.

  The dispatch confirms that the assigned phase agent's charter matches what the
  task actually asks for -- not merely that the agent is a valid name in the
  agents map. A mis-assignment (for example, a "run the existing suite and report"
  task handed to a test-writer) is caught before it triggers an inevitable
  completion-manifest failure and retry loop.
