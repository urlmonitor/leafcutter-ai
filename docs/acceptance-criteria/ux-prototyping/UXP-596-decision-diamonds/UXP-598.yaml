  - frontend_coding
readiness: reviewed
priority: medium
title: "Decision edges are labelled: the branch outcome rides the 'yes' edge, 'no'/else continues to the next step"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: done
criteria: |
  Given a decision diamond drawn for a conditional fork,
  When the graph renders the edges leaving that diamond,
  Then the edge leading to the branch's outcome is labelled with the branch outcome (the "yes" edge),
  And the fall-through edge that continues to the next ordered step is labelled "no"/else,
  And every edge leaving the diamond carries a visible label, with no unlabelled decision edges.
