notes: |
  A FASTER SUITE THAT ANSWERS DIFFERENTLY IS NOT A FASTER SUITE, IT IS A DIFFERENT
  SUITE. Sharing setup changes what each converted test sees: it no longer gets a
  layout deployed moments ago by itself, but one deployed once, earlier, possibly
  by a different working directory and certainly with different neighbours. That is
  a real behavioural change and it can flip an outcome.

  THE THIRD CLAUSE IS THE LOAD-BEARING ONE. Comparing totals is the tempting cheap
  check and it is worthless: the measured baseline is 5292 passed / 2 failed, and a
  conversion that breaks one test while accidentally fixing another leaves those
  totals identical. Per-test comparison is the only form that cannot cancel out.

  THE BASELINE IS DIRTY AND THAT IS FINE, PROVIDED IT IS RECORDED AS-IS. The
  measured run has 2 failures, 5 skips, 19 xfails and 96 collection errors. The
  criterion is preservation of each test's own outcome, not that every test passes
  — an already-failing test must still fail, or the conversion has changed
  something it should not have. Do not clean up the baseline before recording it.

  BOUNDARY AGAINST TQ-600b-1. That AC compares a serial run against a parallel one;
  this one compares a run before the shared layout against a run after it. Two
  different changes, two different equivalence claims, and the two must not be
  merged into one AC — a single "nothing changed" test would pass while one of the
  two changes silently broke something the other happened to mask.
