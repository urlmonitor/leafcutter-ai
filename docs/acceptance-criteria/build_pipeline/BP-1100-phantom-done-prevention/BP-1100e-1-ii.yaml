title: "Path comparison is normalized for separators and case so NTFS/APFS paths are not false-flagged"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-1100-phantom-done-prevention/BP-1100e.yaml"
criteria: |
  Given a ticket declares files_touched: ["scripts/build_phases.py"]
  And the actual diff reports the same file with a backslash separator
    "scripts\\build_phases.py" (as on Windows/NTFS) or with differing case
    "Scripts/Build_Phases.py" (as on a case-insensitive APFS/NTFS filesystem)
  When the pre-done reconciliation compares the actual path against the declared set
  Then it normalizes path separators (backslash vs forward slash) and applies
    case-folding on case-insensitive filesystems before comparing
  And it treats the actual path as matching the declared entry — it does NOT flag it
    as an undeclared source file merely because of separator or case differences
depends_on:
