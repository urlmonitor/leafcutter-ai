notes: |
  User decision 1: "delete python-coder's collector-enforcer section (trading
  residue)". AR-400d criteria: "Package-specific content that belonged to another
  project is removed instead of being dressed up this way."

  THE SETTING CLAUSE NEEDS THE IT PO. Removing a declared setting from a
  specialist may ripple to the settings schema and to any consumer config that
  sets it; the IT PO must enumerate readers of that setting before it goes.
