id: GE-108d
components:
  - commit_guardian
title: "The authoring-time exception hook's refusal reaches the agent that is being refused"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  The PostToolUse exception-handling hook
  (templates/hooks/check_exception_handling_hook.py) is the authoring-time
  sibling of the commit-time guard this L1 otherwise covers. It already builds
  a full explanation for each of its two refusals, and already exits 2 to
  block. What it does not do is put that explanation where the blocked party
  can read it.

  Claude Code surfaces a PostToolUse hook's blocking feedback from the hook's
  STDERR. Anything the hook writes to STDOUT is discarded. So a refusal
  written to stdout is a block with no stated reason: the agent is stopped and
  told nothing, which is the "false confidence / misleading message" failure
  this L1 exists to remove, in its most complete form — not a message that
  misleads, but no message at all.

  Scenario: A ruff violation is refused with its reason visible
    Given a Python file containing a bare `except:` clause (ruff E722),
    And ruff is available on PATH,
    When the hook is invoked with a PostToolUse payload naming that file,
    Then the hook exits 2,
    And the violation explanation — including the rule code `E722` and the
      offending file's path — is present on the hook's STDERR,
    And the hook's STDOUT is empty,
    Because a blocked edit whose explanation went to a discarded stream is
      indistinguishable, to the agent being blocked, from a block with no
      reason at all.

  Scenario: A missing ruff is refused with its install instruction visible
    Given ruff is not present on PATH,
    When the hook is invoked with a PostToolUse payload naming a Python file,
    Then the hook exits 2,
    And the install instruction is present on the hook's STDERR,
    And the hook's STDOUT is empty,
    Because this refusal is the one the reader is least equipped to diagnose
      unaided: nothing about a silent block suggests "ruff is not installed".

  Scenario: The passing and skipping paths are unchanged
    Given a clean Python file, and separately a non-Python file,
    When the hook is invoked with a PostToolUse payload naming each,
    Then the hook exits 0 in both cases,
    And writes nothing to STDOUT and nothing to STDERR,
    Because this criterion moves which stream a refusal is written to; it
      changes neither what is refused nor what is allowed through silently.
