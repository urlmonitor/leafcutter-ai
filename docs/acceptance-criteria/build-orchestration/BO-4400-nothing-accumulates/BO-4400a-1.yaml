notes: |
  Gap G1 (success path). finalize-feature is NOT the cleanup point (BO-4400 key framing
  decision); finalize may still clear, but no route in the list may rely on it.

  VERDICT WORDING CONFLICT (flagged, not resolved here): BO-4100c-1's criteria say a
  workspace holds work when "its branch carries a commit not reachable from the shared main
  line". Read literally, every workspace with an open, unmerged pull request holds work and
  this record can never be satisfied. BO-4300e-2's it_requirements already use the wider
  "reachable from neither its own pushed line nor the shared main line" definition. The last
  And-clause above states the definition this record relies on; BO-4100c-1 needs an amendment
  (owner: PO / BA of BO-4100) to match before this is buildable.

  Proof must drive each route to its end state and inspect the disk afterwards (repo
  CLAUDE.md: gate/workflow ACs are verified by running them, never by grep).

  Named wrong versions this must catch: (1) a route that never calls the door (folder
  remains); (2) a route that removes the folder by its own means (result lacks the door's
  answer); (3) clearing placed before the push (door refuses, folder remains, or the PR is
  missing commits).
