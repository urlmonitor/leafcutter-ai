estimated_complexity: M
it_requirements:
  - "The exclusion must be a durable record attached to the check, carrying who decided and why. A suppression comment in a config file, a naming convention, or an entry in a second list are all rejected: the first two are not readable as data and the third is another enumeration to drift."
  - "An exclusion must never place its check on the roster. The roster stays closed and an exclusion is the opposite of membership - an implementation that satisfies the silence by adding the check to the roster has inverted the record."
  - "An exclusion must never change what its check enforces. Exclusion means no fixer is dispatched; it has never meant the check stops blocking. An implementation that lets an exclusion make a check non-gating turns a friction fix into a hole and this record forbids it behaviourally rather than by note."
  - "An exclusion naming a check absent from the manifest must itself be reported. An enumeration whose entries are never checked against reality drifts in both directions, which is the same reasoning that produced GE-126d-1-i."
  - "The exclusion store must be data the parity check reads, and it must not become a fifth registration leg with its own separate enumeration. Where it lives should be decided against GE-126d-3's single declaration rather than ahead of it."
  - "If the exclusion store is a new file the build must deploy, it must be added to the build deploy manifest in the same change and the DEPLOYED parity check exercised against it. A source-tree-only file makes the deployed check silently see no exclusions at all."
  - "Every run must be out of process over an isolated fixture tree; the repository's own manifest, roster and exclusion records must not be read or written by the tests."
  - "Error handling must follow the four rules in CLAUDE.md."
test_spec:
  - name: test_the_check_with_no_recorded_exclusion_is_named_and_the_other_is_not
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_hook_parity.py"
    description: "Two fixture checks both off the roster, one carrying a recorded exclusion: the parity check names the one without and does not name the one with."
  - name: test_removing_the_exclusion_record_causes_that_check_to_be_named
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "The exclusion is removed and nothing else changed; the previously silent check is now named. This binds the silence to the record - a parity check that names nothing also produces the first descriptor's silence."
  - name: test_an_exclusion_for_a_check_absent_from_the_manifest_is_itself_named
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "An exclusion record naming a check the manifest does not contain silences nothing and is reported in its own right."
  - name: test_an_excluded_check_still_blocks_input_that_violates_its_rule
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    surface_invoked: "the excluded fixture check's own script"
    description: "The excluded fixture check is run out of process against input that genuinely violates its rule and still blocks, and it is confirmed absent from the roster - exclusion changed what the autofix loop attempts and nothing about enforcement."
test_rationale: |
  The first descriptor is silence, and silence is what a parity check that is not
  looking also produces — so on its own it is satisfied by the defect. The second
  descriptor is the whole coverage: remove the record, change nothing else, and the
  check must be named. The fourth descriptor guards the most dangerous available
  misreading, that an exclusion makes a check non-gating, and it is asserted
  behaviourally by running the excluded check against real violating input rather than
  by a note in the record, because a note cannot fail. The third descriptor closes the
  drift direction that GE-126d-1-i establishes for the roster and that applies equally
  to any second list of names.
delivers_to:
  agent: documentation-expert
  contract: "The deliberate-exclusion record: what it is, where it lives, what it must carry (who decided and why), and the two facts a reader must be told about it - that it never adds its check to the roster and never changes what its check enforces. GE-126d-4 tells an author how to record one and GE-126d-5 states what each leg buys."
expects_from:
  ac_id: GE-126d-1
  contract: "The roster as a fourth registration leg the parity check reads, and the finding it emits for a check absent from it. This record supplies the exclusion route that finding is required to name."
