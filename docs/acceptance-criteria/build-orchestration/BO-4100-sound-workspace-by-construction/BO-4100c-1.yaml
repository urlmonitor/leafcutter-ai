notes: >-
  Observed 2026-09-14: roughly 150 live workspaces and no stated way to judge any one of
  them. The five triggers are listed as independently sufficient because each is a
  separate way work has been lost -- a commit that never left the branch, and a stash
  belonging to a workspace nobody could attribute, are different losses with different
  detections. Coverage of the WHOLE live set is asserted rather than the verdict for one
  workspace, because a per-workspace answer that nothing calls for all 150 leaves the
  accumulation exactly where it was.

  AMENDMENT 2026-10-12 (approved by BrainCandy on 2026-10-12) -- WHY. The original wording made a
  workspace hold work whenever "its branch carries a commit not reachable from the shared
  main line". Read literally, every workspace with an open, unmerged pull request holds
  work. BO-4400a-1 clears a workspace right after its pull request is opened (work pushed,
  so nothing unsent), and BO-4400a-2 expects a halted workspace to flip to holds-nothing
  once its work is pushed by hand; under the old wording neither could ever fire. The
  BO-4400 IT-PO recorded on 2026-10-09 that this record must be amended to "reachable from
  neither its pushed line nor main" before BO-4400a-1 and a-2 can be built. BO-4300e-2's
  it_requirements already used that wider definition; this amendment brings the criteria
  into line with it.

  AMENDMENT -- THE 2026-10-09 DECISION THIS RELIES ON. BrainCandy decided (BO-4300 Q8,
  recorded in BO-4400.yaml notes): clearing a workspace whose verdict is holds-nothing
  needs no confirmation token -- the verdict IS the safety check. Unsent work is discarded
  only with up-front permission (BO-4300e-3). Because the verdict is now the only thing
  standing between an unattended clear and lost work, the holds-nothing side is defined
  narrowly (both conditions must hold) and holds-work is "everything else", naming what
  produced it.

  AMENDMENT -- WHAT DID NOT CHANGE. Content-equivalent (squash-merged) commits still count
  as on the shared main line (BO-4100c-1-i). Staged changes, non-ignored untracked files
  and stash entries still each produce holds-work on their own. A commit whose pushed
  line was deleted after merging is still caught by the main-line / content check.

  AMENDMENT -- BUILD-OUTPUT DIRT IS NOT FIXED HERE. A modified tracked file still produces
  holds-work unless the build-output rule owned by BO-4300c-1-iii identifies it as changed
  by a build. This record does not invent its own idea of build output (no file-name list,
  no heuristic); until BO-4300c-1-iii is built, a build-dirtied tracked file reads as
  holds-work, which is the safe direction. BO-4300c-1-iii is added to depends_on so that
  sequencing is explicit.

  AMENDMENT -- OPEN FOR IT PO. (1) This record's it_requirements say the assessment must not
  fetch; BO-4300e-2's say "after a fetch". Pushing from the workspace updates this machine's
  knowledge of its own line, so the clear-on-PR case works without a fetch, but which
  view of the pushed line the verdict reads needs one stated answer. (2) it_requirements
  item 3 and the test_spec entry for the five triggers still describe the commit trigger
  as "unreachable from the shared main line"; they need the pushed-line wording, a
  pushed-unmerged discrimination test, and a build-output exemption test.

  IT-PO FOLLOW-UP 2026-10-12. Item (2) is done: it_requirements now state reachability
  against the workspace's own pushed remote branch OR main (patch-equivalent counts as on
  main, BO-4100c-1-i's rule kept), the build-output exemption is delegated wholly to
  BO-4300c-1-iii, and test_spec carries one test per named scenario (pushed, squashed,
  rebuilt, unsent). Item (1) is NOT decided: it_requirements state the verdict reads the
  locally known remote-tracking ref of the workspace's own branch, updated by its own push,
  and does not fetch; reconciling that with BO-4300e-2's "after a fetch" remains open for
  the user.
