notes: |
  THIS CARRIES A DECISION THE USER HAS ALREADY TAKEN. The abilities move into the
  specialist's own definition, beside the declaration of what it is permitted to
  use. The central record's ability fields become derived and validated. Do not
  re-open the placement question at decomposition; do state the migration.

  THE 12 ARE THE TEST OF THIS CRITERION. Twelve specialists appear only in the
  second of the two rival fields. A migration that consolidates onto either
  field's population alone silently drops or invents grants, and would leave
  those twelve receiving nothing even after delivery is repaired. Any acceptance
  evidence must account for the union and name what it did with each side.

  ONE DECLARATION IS NOT THE SAME AS ONE CORRECT DAY. A design in which every
  specialist happens to be correct after a round of hand edits satisfies nothing
  here. The guarantee is that there is one place to change, and that every other
  copy follows from it without anyone visiting it.
