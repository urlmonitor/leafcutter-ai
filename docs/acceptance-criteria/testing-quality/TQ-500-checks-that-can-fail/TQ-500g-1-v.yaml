test_rationale: >-
  A workflow gate is only proven by driving the workflow and asserting that its replies control the
  next dispatch; a grep of the workflow source is forbidden (CLAUDE.md). The harness entries prove
  the order (recover, list, test-breaker, finish, commit), that the owed list reaches test-breaker
  unchanged, and that every halt is fail-closed. One entry runs the recorded finish command in a
  real shell, because only that shows the reply reaching the writer byte for byte. The wrapper's own
  entries run the real writer and runner against a temp repo and prove that the wrapper adds no rule:
  its verdict is the runner's JSON, and a writer stop never reaches the runner. Every must_catch entry
  names its in_scope_files, so this AC's own wrong-version runs have files to alter.
  Cross-route verdict identity is proven once, by the TQ-500g-1 seam test.
