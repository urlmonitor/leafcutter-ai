  contract: "Compiled agent instructions in which {{config.testing_context.test_root}} is replaced by the literal resolved test root (e.g. 'tests/'), with no remaining placeholder token; the test-authoring agent prose (INF-1100a/b) consumes this resolved value as its test base location."
