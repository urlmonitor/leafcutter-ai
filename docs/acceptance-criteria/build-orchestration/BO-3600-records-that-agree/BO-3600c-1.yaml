notes: |
  THE MOST DECIDABLE CLASS, and therefore the one to build first. Both halves are
  structured: an id in a fixed format on one side, a record keyed by that id on the
  other. Nothing beyond extraction and lookup is needed.

  The second scenario matters because ids are never reused in this store, so a
  reference to a retired record is a different problem from a reference to nothing —
  the finding is still reachable, it has just moved. Collapsing the two would send
  the reader looking for a record that is sitting right there.

  The third and fourth scenarios are the precision controls. A check that flags the
  entry rather than the reference makes a five-subject entry as much work to triage
  as it was before the check existed.
