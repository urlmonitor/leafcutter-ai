id: TQ-600a-13-xxii
components:
  - testing_quality
  - knowledge_management
title: "A live-database lane whose database never became healthy is reported as did-not-complete, never as green and never as test failures"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the live-database lane of TQ-600a-13-xxi, which starts disposable graph-database
    instances before it executes any test,
  And the failure class TQ-600a-13-v already refuses for the correctness lane — a run that
    broke before it tested anything being read as a run with no failures — which here takes
    two further forms: a database that never starts reads as "nothing failed", or every
    test erroring on connection reads as a list of genuine regressions,
  When any of the disposable database instances does not report healthy within the lane's
    start-up time limit — on the first execution or on the retry's fresh machine — or
    reports healthy and then cannot be connected to by the first test,
  Then the post-merge run is not green, and its verdict is did-not-complete with the stage
    named as the live-database start-up, worded differently from both a test failure and
    the correctness lane's own did-not-complete stages,
  And no live-database test is reported as failing by node id for that run, so the notice,
    the held pull request's comment and the hold's output say "the live-database tests
    never ran" and never show a "failing tests" heading over connection errors,
  And a database that fails to become healthy only on the retry's fresh machine makes the
    run did-not-complete, never green and never "passed on retry",
  And the notice lifecycle treats this ending as TQ-600a-13-v treats every did-not-complete
    ending: it raises the notice when none is open, updates the open one otherwise, closes
    no notice and lifts no hold,
  And a correctness lane that was green in the same run does not turn the run green while
    the live-database lane did not complete,
  And each of these is demonstrated by producing the ending — a database instance that is
    started and never answers, and one that answers its health probe and then refuses the
    first connection — and observing the verdict, its stage and the notice write, never by
    reading the workflow's health-check settings.
depends_on:
