id: BO-800a-1
title: "PR title is set to the L1 AC title referenced by the ticket's source_ac field"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a ticket file has frontmatter source_ac: BO-200a
    and the AC file BO-200a.yaml has:
      level: L1
      title: "Atomic commit for multi-file deliveries"
    and the ticket is at the pull-request phase,
  When the pull-request agent assembles the PR title,
  Then the PR title is set to: "Atomic commit for multi-file deliveries"
  And the title is taken verbatim from the L1 AC's title field
  And no additional prefix, suffix, or reformatting is applied
  And the title is NOT derived from the branch name, commit messages, or diff.
