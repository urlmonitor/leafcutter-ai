notes: |
  THE LOAD-BEARING BEHAVIOUR OF THIS L1, AND THE ONE INDEPENDENTLY RE-MEASURED.
  The PO's claim that the dependency-list hatch swallows 26 of the 47 was
  verified by running the real hook once per orphan child through
  HOOK_TEST_FILES (not by reading the source): 21 orphans block, 26 are silent,
  and every one of the 26 is silent through this hatch. The claim is exactly
  right.

  A CORRECTION THE IMPLEMENTER MUST NOT INHERIT WRONG. The L0 notes report two
  different populations that both happen to number 26 — this hatch's population,
  and the "parent holds only test paths" population — in a way that reads as one
  set. They are near-disjoint. Their only overlap is BP-100b's eleven children.
  The 26 this AC governs are: the BO-100d family (7), BP-100b's children (11),
  FIN-100h (1, via the empty-dependency-list shape), TKT-100a and TKT-100f (2),
  and UXP-400a/410a/412a/420a/421a (5). So closing this hatch newly surfaces the
  DRIFT and RETIRED populations — the ones ACS-1400c can mostly act on — and does
  not touch the schema-collision population at all. The six deliberate KM-200
  records are already reported today and are unaffected by this AC.

  WHY THE SECOND Given IS NOT OPTIONAL. Removing the hatch outright is the
  obvious implementation and it reintroduces the false positives the original
  comment was written to prevent. BP-100b's eleven children each name their
  SUCCESSOR in their dependency list — a coherent authoring choice — and a check
  that reads any non-parent dependency as a violation would be as wrong in the
  other direction. The discrimination is the behaviour; the strictness alone is
  not.

  ONE GUARD, NOT TWO. The L1 refuses a second check on this field, and this AC
  inherits that refusal. Two readers of the same evidence drift apart, which this
  repo has already paid for once.
