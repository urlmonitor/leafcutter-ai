notes: |
  Retrospective type-specific refinement of the native-field contract in
  KM-400a-3-i. The reader receipt verifies 23 cases and ten canonical Mockups,
  including one unregistered record and five null render declarations.
  Those dated observations do not make registration or render existence a
  universal requirement. This reviewed specification makes no new user-approval claim.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
estimated_complexity: M
it_requirements:
- Supporting render reads must stay within the selected source snapshot and must not fetch external URLs or execute
  HTML/render content.
- A safe missing declared render is a separately reported supporting-source gap; it cannot remove the canonical
  Mockup or manufacture a render for an explicit null.
