it_requirements:
- 'One reference page under docs/reference/ with reference frontmatter (check_doc_frontmatter must pass). It lists the suggestion fields as built in the DK-500b-1 contract (placement: category id or none, pref_label, alt_labels, reason with its kind and Jev probability) and states that broader is never suggested and is present only when a person set it.'
- 'It describes the method exactly as dec-a070edfb6465bced decided it and DK-500b-3 builds it, including the parts the criteria leave implicit: the shared wording normalisation (Unicode NFC, trimmed, whitespace collapsed, case-folded, punctuation significant), criterion-id placements shown with reason criterion_id, the one-choice-question bound (reason library_exceeds_choice_bound, never a shortlist), the configured 0.8 threshold and the cold start with no Jev call.'
- Precision, recall and the none share are defined exactly as the evaluation command computes them (DK-500b-2). The trial figures and caveats come from the committed trial summary (linked in doc_links) and are linked rather than restated loosely.
- Write it only after DK-500b-1 to DK-500b-4 are implemented. The reference documents behaviour and closes no behavioural AC.
