id: TQ-600a-13-i
components:
  - testing_quality
title: "Choosing to exclude a test from the default run does not quietly delete it"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the branch of the parent record in which real deselection is implemented rather
    than the documents corrected,
  And what the suffixed tests in the suite-performance directory actually cover: the
    routing that decides whether a test is handed the one shared layout or a private
    copy of its own, which when it breaks hands a mutator the shared root and corrupts
    every reader nondeterministically,
  And the asymmetry that makes a careless exclusion worse than today's false claim: a
    false claim costs the run some seconds it did not expect to spend, while an
    exclusion with no invoked alternative costs the only quick warning of a corruption
    that makes unrelated tests fail for unrelated-looking reasons,
  And the owner's reading (2026-10-08) that a failure which fails the build is one that
    blocks merges,
  And that a test asserting a wall-clock ratio between two measurements taken on the
    same host fails on shared-runner noise — measured at 3.8x to 10.74x with no code
    change — so such a test is placed in the timing lane only by a reviewed change that
    applies the timing marker to it (TQ-600a-13-xii),
  When a test is excluded from the default collection — a suffixed test, or a test
    carrying the timing marker,
  Then a named opt-in exists that collects it, and that opt-in is invoked on a stated
    cadence,
  And an excluded test that fails under its opt-in turns the invoking job red, shown by
    making one fail and observing the job's outcome,
  And a failure of an excluded test that does not carry the timing marker blocks merges
    to main through the required `Post-merge suite status` check, shown by making one
    such test fail and observing that check fail on a pull request evaluated afterwards,
  And a failure of an excluded test that carries the timing marker is the one stated
    exception: it turns its own timing run red and is named on the `post-merge-timing`
    notice, and it does not block merges, shown by making one such test fail and
    observing its run red, the notice naming it by node id, and `Post-merge suite
    status` unchanged on a pull request evaluated afterwards,
  And the opt-ins are shown to collect every test the default collection excluded, so
    the default collection and the opt-in collections together are the whole suite and
    nothing falls between them,
  And when no such invoked opt-in is in place, the exclusion is refused rather than
    applied, so the deselection cannot land on its own ahead of the thing that
    compensates for it.
depends_on:
  - TQ-600a-13
