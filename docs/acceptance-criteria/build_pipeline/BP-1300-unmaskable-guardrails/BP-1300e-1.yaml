id: BP-1300e-1
components:
  - precommit_hooks
  - commit_guardian
title: "A commit carrying a violation either step of CI's required lint check would reject is refused, naming the file, line and rule"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Background:
    Given this repository's required CI lint check runs two steps:
      step 1 — the repository lint configuration over the trees scripts/, tests/,
        unit_tests/ and kernel/,
      step 2 — the error-handling rule set E722, BLE001 and TRY over kernel/ only,
    And the commit is an ordinary commit — no extra command, flag or manual step.

  Scenario: A step-1 violation outside the error-handling set is refused
    Given a staged change to a file under unit_tests/ that introduces a variable
      named `l` (rule E741, ambiguous variable name) at line 12,
    When the commit is attempted,
    Then the commit is refused,
    And the refusal names that file's path, line 12 and rule E741,
    Because this is the exact escape observed on PR #1058, where every
      commit-time check accepted two E741 sites and the required CI check rejected
      them after push.

  Scenario: A step-2 violation in kernel/ is refused
    Given a staged change to a file under kernel/ that introduces an
      `except Exception:` handler (rule BLE001) at line 30,
    When the commit is attempted,
    Then the commit is refused,
    And the refusal names that file's path, line 30 and rule BLE001.

  Scenario: The kernel-only rule set is not applied outside kernel/
    Given a staged change to a file under scripts/ that introduces the same
      `except Exception:` handler (rule BLE001),
    And the file has no violation under the repository lint configuration,
    When the commit is attempted,
    Then the commit completes,
    Because CI's second step covers kernel/ only, and refusing here would be a
      commit-time verdict CI does not share — the reverse half of the parity this
      L1 promises.

  Scenario: Both steps' findings are reported together
    Given one staged commit that carries the E741 change under unit_tests/ AND the
      BLE001 change under kernel/,
    When the commit is attempted,
    Then the commit is refused,
    And the refusal names both findings, each with its path, line and rule,
    So that fixing one does not reveal the other only on the next attempt.

  Scenario: A clean change commits
    Given a staged change to files under scripts/ and kernel/ that carries no
      violation under either step,
    When the commit is attempted,
    Then the commit completes and the lint check reports that it inspected the
      staged files and found nothing to object to.
