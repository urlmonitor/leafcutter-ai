id: BO-1100e-2
title: "Filtering skill returns at most a bounded number of candidate commits"
component: build-orchestration
level: L2
status: active
readiness: draft
priority: medium
req_status: active
work_status: todo
criteria: |
  Given a repository has 500 commits touching files under "docs/architecture/**",
  When the filtering skill is invoked with pattern "docs/architecture/**",
  Then the skill returns at most 50 candidate commits (most recent first),
  And the skill does NOT return all 500 commits,
  And the bound (50) is configurable but has a sensible default,
  And the skill completes without consuming unbounded tokens or memory.
