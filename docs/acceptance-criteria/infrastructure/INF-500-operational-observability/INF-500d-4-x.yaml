notes: |
  Reported 2026-10-22: a Copilot review on the ai-commons repository flagged
  .leafcutter/config/knowledge_sink.json carrying /home/henzeh/projects/ai-commons/...
  paths. ai-commons commits its whole .leafcutter/ tree. Making the paths relative or
  letting the resolver accept another machine's root were both rejected: they break
  ADR-069's absolute durable root and its stale rule. Copies that a repository has
  already committed stay tracked until that repository runs `git rm --cached` once;
  this AC covers only what the build does from now on.
