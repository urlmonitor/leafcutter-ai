criteria: |
  Given the ticket generator injects `documentation-expert` for a doc-triggering ticket,
  When it decides through which path to add the agent,
  Then `documentation-expert` is added via the per-surface (canonical-order) path, which
    orders it after the coder -- not via the pre-coder flow-change gate slot.
  And `documentation-expert` is absent from all four flow-change-gate mandatory-agents
    lists.
  And `architect-review` remains present in the pre-coder flow-change-gate lists (the
    removal of documentation-expert is surgical and does not remove other pre-coder gates).
depends_on: [BO-2200d, BO-2200a-1]
