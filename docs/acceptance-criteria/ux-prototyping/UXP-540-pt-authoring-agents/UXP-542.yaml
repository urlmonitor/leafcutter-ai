work_status: todo
criteria: |
  Given drafted mock data and mockups for a multi-step request,
  When the flow agent (flow-author) runs,
  Then it assembles a *.flow.json whose steps are ordered and each wired to its screen,
  And each step declares the entities it reads and writes,
  And each step carries an acceptance_scenario the business-analyst can turn into ACs,
  And it extends an existing journey rather than creating a new flow when the screen belongs to one.
