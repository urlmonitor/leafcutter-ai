notes: |
  Added 2026-08-13 as a fourth L1 under INF-500 "You can see what happened and
  why" (tree now a–d, cap 7). PLACEMENT NOTE: this L1 was first drafted as
  INF-100d and deliberately re-parented to INF-500 before decomposition.
  INF-100's axis is "the agent has what it needs to start"; this work's axis is
  "what the agent produced survives to be read", which is INF-500's axis and
  matches its existing children (INF-500a retrospective facts survive archival,
  INF-500b/c the feedback pipeline). Do not move it back.

  This L1 merges two separately-reported problems that share one benefit ("the
  report actually lands"): the writer-acceptance problem and the durability
  problem. Four concrete defects sit underneath it — decompose each as its own
  L2, do NOT re-cut this at L1.

  1. STALE WRITER VOCABULARY. The set of agents permitted to write a report is a
     closed, hand-maintained list. Four current gate agents are absent from it,
     so their writes are rejected outright. BOUNDARY vs INF-100c-3 (readiness:
     approved, work_status: done): INF-100c-3 enumerated the phase agents that
     existed when it was written — a SNAPSHOT, and it is genuinely done. Adding
     four more names by hand would just re-run that snapshot and go stale again.
     INF-500d's requirement is STRUCTURAL: the permitted-writer set must derive
     from the live agent registry rather than a hand-curated duplicate. Do not
     re-author or re-open INF-100c-3, and do not mark INF-500d a duplicate of it.
     TWO CONSTRAINTS ON HOW IT DERIVES, both carried in INF-500d-1: the predicate
     is plain roster membership and nothing narrower (a ticket-phase predicate
     would revoke two supervisors that write three categories each today), and
     derivation applies to the general-purpose categories only (the three
     deliberately restricted lists stay literal — see INF-500d-1-i).

  2. DOCUMENTED-BUT-DEAD ESCAPE HATCH. An `[all_agents]` sentinel is documented
     as a way to permit every agent, and is not implemented. A documented switch
     that silently does nothing is worse than no switch: authors use it and
     believe they are covered. This L1 originally left the resolution open
     (implement it, or remove it). It is now CLOSED TO REMOVAL — see INF-500d-2.
     Once defect 1 derives the writer set from the live roster the sentinel has
     no remaining job, and the "implement it" branch was defined on a predicate
     that would have revoked live writers. An unresolved either/or also leaves
     test-writer nothing to author a red test against.

  3. UNDIFFERENTIATED FAILURE. A failed write emits a single generic marker with
     no reason, so a rejected writer, a missing config, and an unwritable path
     are indistinguishable to the caller. BOUNDARY vs INF-100c-4: that AC covers
     ONE specific submit-side message (missing config path). INF-500d requires
     the CALLER-VISIBLE failure marker to name the cause in every case, not just
     that one. Complementary, not duplicative. The reason set must include the
     case where the write SUCCEEDED but the identifier was not captured — the
     dominant observed cause, and the one that must never be retried; see
     INF-500d-3.

  4. RECORDS DESTROYED WITH THE WORKSPACE — and the resolver trap.
     The sink resolves into the per-drive worktree, which is deleted at the end
     of the drive, so the records go with it. Roughly nine in ten cited records
     are unresolvable today (measured 2026-08-13; the figure moves every drive,
     so re-measure before quoting).

     THE LOAD-BEARING CONSTRAINT — the three deliberately coexisting resolution
     rules, and why unifying them re-creates the defect — LIVES IN INF-500d-4's
     notes and is NOT duplicated here. Read it there before touching any resolver;
     it is where the IT PO lifts it into it_requirements.

  DECOMPOSITION (business-analyst, 2026-08-13): defect 1 -> INF-500d-1 (+ L3
  INF-500d-1-i, restricted categories stay literal and exempt from derivation);
  defect 2 -> INF-500d-2 (removal branch only); defect 3 -> INF-500d-3
  (reason-coded marker, five reasons) and INF-500d-5 (hold/flush plus a batch gate
  at the workspace-removal boundary); defect 4 -> INF-500d-4 (+ L3 INF-500d-4-i,
  unresolvable enduring location).
