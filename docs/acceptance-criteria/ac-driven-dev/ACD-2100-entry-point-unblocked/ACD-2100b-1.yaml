it_requirements:
  - "The change must land under templates/. The deployed workflow is build output and today carries no charter gate at all (see ACD-2100d-3)."
  - "Fail closed: the run still stops. The objection is to the diagnosis, not to the caution -- relaxing this outcome to a warning reintroduces the hazard the BO-1500f-1 gate was built for, and that AC is work_status: done."
  - "The reported location must be the location actually attempted, taken from the resolution that ran -- not a constant reproduced in the message. A hard-coded path in the message is wrong the moment the resolution changes and is exactly what made the current message misleading."
  - "The reported reason must distinguish 'no file at that location' from 'permission refused'; these have different remedies and collapsing them recreates the defect one level down."
  - "The report must not name a permission setting, and must not assert anything about any agent's permission. This is a negative constraint on observable output and must survive as one -- a test that asserts only that some message was printed restates the bug."
  - "Must satisfy the repository error-handling policy: the failed read is external I/O and must be logged at WARNING or higher before the halt."
  - "Must not emit the registry's contents or the process environment in the report -- the location and the failure reason only."
test_spec:
  - name: test_absent_registry_is_reported_as_unreadable_with_the_location_tried
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      No file at the resolved registry location; the run stops and its report contains
      that location and states the read failed because nothing is there.
  - name: test_unreadable_registry_report_contains_no_permission_verdict
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The same report contains no statement about any agent being permitted or not
      permitted to run repository commands and does not name a permission setting --
      asserted as an absence, because the buggy code also prints a message.
  - name: test_permission_refused_registry_reports_a_different_reason_than_absent
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: boundary
    description: >-
      A registry file present but with read permission withheld from the process
      produces a report naming the location and a reason distinct from the
      nothing-is-there reason.
  - name: test_unreadable_registry_halts_the_run_at_the_check
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the plan-feature workflow driven through the workflow runner to its startup charter check"
    description: >-
      Driving the real workflow with the registry unreadable stops the run at the check
      -- no step after the check runs -- and the halt is what the caller observes.
test_rationale: >-
  The last two Then clauses are negative and they are the actual defect: the current
  code already prints a message, so a test asserting that some message appeared passes
  against unfixed code. The evidence has to be the absence of the permission text in
  this outcome. The two read-failure reasons are asserted as a pair because the cheap
  implementation of "report honestly" is one catch-all message, which leaves the
  operator unable to tell a wrong location from a locked file -- two different remedies.
  The halt is asserted by driving the real workflow rather than by reading the source
  for a return statement, which proves nothing about whether the check is reached.
