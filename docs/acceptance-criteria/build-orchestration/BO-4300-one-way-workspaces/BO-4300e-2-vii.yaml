it_requirements:
- Finding the workspace to clear by its location must not depend on the repository being on a branch;
  ownership is decided from the workspace record and the location.
- 'The unsent-work verdict covers both the current (detached) commit and the record''s own line of work:
  commits reachable from either and from neither the line on the shared project nor the shared main line
  count as unsent.'
- Any branch handling during clearing uses the line of work named by the workspace record, never the checked-out
  branch.
- The discard token binds the detached commit identifier as part of the unsent work, so a moved current
  commit invalidates it.
- Commit identifiers in answers are full identifiers.
- Edit the template source under templates/scripts/, never a deployed build output (ADR-001); the change
  must reach the deployed maker through the normal build.
- Must keep the existing answer envelope and existing answer codes backward compatible; any new answer
  field or code must be additive.
- Must stay within the project's file-size and complexity limits for the maker modules; if the remove
  module would exceed them, the new logic moves into a sibling maker module rather than raising a limit.
- Every refusal must leave the workspace folder, its repository and its workspace record unmodified (no
  write, rename or delete of any item), consistent with the standing never-delete-unsent-work rule.
test_intent:
- clause: no request is answered "not found"
  needs_test: true
  reason: The observed defect answered not found for a detached workspace, so the regression must be pinned.
- clause: '"ticket/alpha" is answered cleared and nothing of it remains at its location'
  needs_test: true
  reason: Clearing a detached workspace with nothing unsent is the main success path of the fix.
- clause: '"ticket/beta" is refused, the refusal names commit "c1" by identifier as unsent and states
    that the workspace is not on its line of work, and "ticket/beta" is identical before and after'
  needs_test: true
  reason: A commit that exists only at the detached position is the work the old check would lose.
- clause: '"ticket/gamma" is refused, the refusal names commit "c2" by identifier as unsent, and "ticket/gamma"
    is identical before and after'
  needs_test: true
  reason: Checking only the detached commit would miss unpushed commits on the own line, which this arm
    catches.
- clause: clearing "ticket/beta" again with the one-time token its refusal returned is answered cleared,
    listing "c1" as discarded
  needs_test: true
  reason: The token path for a detached workspace must bind and discard the detached commit correctly.
delivers_to: null
expects_from:
  ac_id: BO-4300e-2
  contract: The unsent-work verdict used by clearing (commits reachable from neither the line on the shared project nor the shared main line, plus uncommitted and untracked changes).
