    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: ACD-1800b-1a
  contract: "The AC-side per-deliverable sign-off record on the requirement: deliverables[].signoff = {status: needed|signed_off|not_applicable, by, at, reason?}. The parity gate resolves this from the grouped ACs and accepts it in lieu of a body '## Sign-offs' section on a thin ticket."
it_requirements:
  - "Canonical source: templates/scripts/commit_guardian/check_ticket_signoff_parity.py and its helper templates/scripts/commit_guardian/_signoff_parity_checks.py (the deployed scripts/commit_guardian/ copies are build output per ADR-001; never hand-edit them). The parity validator MUST NOT require a body \"## Sign-offs\" section on a thin (v2) grouping ticket."
  - "On a thin ticket with no body \"## Sign-offs\", the validator resolves the sign-off record from the grouped ACs' AC-side per-deliverable sign-offs (the deliverables[].signoff records defined in ACD-1800b-1a) and passes when they satisfy parity; a legacy fat ticket's body \"## Sign-offs\" MUST still be honoured during the dual-record window (dual-read, not replace)."
  - "Reconcile this gate BEFORE it is promoted to required (ADR-026 rule 3) -- it closes the exact parity concern flagged in ACD-1800c-1's it_requirements (\"the ticket sign-off parity gate must not REQUIRE a ## Sign-offs section on a grouping ticket\"), else a thin ticket blocks every commit."
  - "Gate/workflow AC (CLAUDE.md 'verify behaviorally, not by grep'): the test MUST EXECUTE the parity gate against a real thin ticket (AC-side sign-offs, no body ## Sign-offs) and a real legacy fat ticket and assert BOTH pass, plus a thin ticket with unresolvable/unmet AC-side sign-offs and assert it is BLOCKED (proving the verdict is not a fixed pass) -- never grep-only."
  - "Must follow the project error handling policy (Ruff E722/BLE001/TRY): wrap file/YAML I/O in typed try/except and log-or-reraise; no bare except."
test_spec:
  - name: test_thin_ticket_with_ac_side_signoffs_passes_without_body_section
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Executing the parity gate against a thin ticket that has no body '## Sign-offs' but whose grouped ACs carry AC-side per-deliverable sign-offs passes the parity check."
  - name: test_legacy_fat_ticket_body_signoffs_still_pass
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Executing the same gate against a legacy fat ticket with a body '## Sign-offs' section listing needed agents signed off still passes (body sign-offs honoured during the dual-record window)."
  - name: test_thin_ticket_with_unmet_ac_side_signoffs_blocked
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Executing the gate against a thin ticket with no body '## Sign-offs' and unresolvable/unmet AC-side sign-offs is blocked, proving the verdict tracks the sign-off state and is not a fixed pass."
