notes: |
  FOURTH HONESTY AXIS — deliberately distinct from the three already recorded in
  TQ-400's notes. Do not fold this work into any of them:

    - BO-2500 (mechanical done proof) asks IS THERE A PASSING TEST, on real data,
      at the moment work is declared done. It never asks whether that test has a
      failure mode.
    - BP-1100 (phantom-done prevention) asks DOES THE DELIVERED CHANGE ACTUALLY
      EXECUTE before a ticket is called done. Same mark-time question, one
      altitude up; still says nothing about the test's discriminating power.
    - TQ-400 (durable done proof) asks DOES THE PROOF STILL HOLD later. It
      presupposes the proof was worth something on day one.
    - TQ-500 (this goal) asks WOULD THE TEST EVER SAY NO. A test that cannot fail
      satisfies all three neighbours perfectly and forever: it is present, it
      passes, the code it names runs, and it will still pass at every future
      re-check. This is the one question none of them is shaped to ask.

  WHY THIS IS THE FOUNDING DEFECT, INVERTED. This repository exists to stop work
  being marked done that never runs. A check that cannot fail is that same defect
  living inside the instrument built to detect it, and it is self-concealing in
  the worst way: it is green, it stays green, and its greenness is later cited as
  evidence the rule it names is being kept.

  SEVERITY SIGNAL — THE REGISTER UNDERSTATES IT. KI-TQ-010 records one
  occurrence. Three are known, all within a single day, and the last two occurred
  AFTER the issue was filed and were produced by someone actively looking for the
  pattern. Do not read the recorded count as a measure of rarity; read it as
  evidence that knowing about the pattern does not prevent it. Correcting the
  register is out of scope for this AC tree.

  DELIBERATE NON-GOAL — DO NOT SPECIFY AUTOMATIC CLASSIFICATION. The source entry
  is explicit that the family of work this applies to cannot be reliably spotted
  from the text of a requirement; every candidate signal is suggestive and none
  is dependable. The obligation is therefore declared by whoever does the work
  (TQ-500a), not inferred. A downstream author who reintroduces automatic
  detection as the primary mechanism has reopened the defect.

  NAMESPACE RATIONALE. Filed under testing-quality (test-suite trustworthiness)
  as a sibling of TQ-100 (which tests gate main), TQ-300 (does the tooling have
  tests at all) and TQ-400 (does the evidence still hold). The subject is whether
  a green result is worth anything as evidence — not drive-time sequencing, which
  is build-orchestration's charter. Searched the store first for an existing L0
  or L1 covering "a test that proves what it claims": the nearest neighbours are
  BO-2500c ("tests check the real thing, not convenient fakes" — fixture realism,
  not failure capability) and BO-2900 ("work only counts as done when it is
  actually reachable" — reachability of the code, not sensitivity of the test).
  Neither hosts this without distorting its own subject. TQ-500 was the next free
  id in the namespace.
