criteria: |
  Given a consumer project runs build.py but has no
    docs/acceptance-criteria/ directory (the project does not use the AC store),
  When the governance enforcement hook runs during a commit,
  Then it exits with no violations and no warnings,
  And it does not create the docs/acceptance-criteria/ directory,
  And the commit proceeds as if the governance hook were absent.
