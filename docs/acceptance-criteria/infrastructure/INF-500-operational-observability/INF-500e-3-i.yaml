    relevance: "Calls the age collection with an empty birth index and with a birth date after the period end, asserting the returned list of ages in both cases."
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Both branches live in scripts/agent-health/weekly_health.py::collect_cycle_times. An identifier absent from the births index must be SKIPPED — the loop continues and appends nothing — and must never fall back to the period start, the period end, or any other default. A default would report a fresh 0-day cycle for every record the history cannot account for, which is the flattering direction and the reason this record is an L3."
  - "The two unknown treatments in this feature are deliberately different and must not be unified. An unestablishable age is OMITTED from the population, because the cycle figure is an aggregate; the dash owned by INF-500e-2 applies to a single named figure that was asked for and could not be obtained. Do not add a None entry to the returned list to make the two look alike — the list is list[int] and a None in it would break the median."
  - "A birth date later than the period end must clamp to 0, not produce a negative age and not raise. One out-of-order or clock-skewed record must not be able to cancel out several honest ages inside the median."
  - "The function must remain pure over its four arguments — no git call, no clock read — so both branches are executable from literal inputs; the birth index is supplied by INF-500e-3's ac_birth_dates."
  - "Whatever count of criteria is skipped, the median must be computed over the surviving ages only, and an empty list must render as unknown through INF-500e-2's formatter rather than as 0."
test_spec:
  - name: TestCollectCycleTimes::test_criterion_with_no_known_birth_is_skipped_not_zero
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: failure
    description: "A criterion closed in the period with an empty births index yields an empty age list — it contributes no age at all, and specifically not a 0."
  - name: TestCollectCycleTimes::test_birth_after_period_end_clamps_to_zero
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "A birth of 2026-08-30 against a period ending 2026-08-26 yields the single age 0 rather than a negative number, and raises nothing."
test_rationale: |
  Asserting the returned LIST rather than an aggregate is what makes the first
  descriptor meaningful: a skipped criterion and a criterion entered as 0 produce
  medians that can coincide, so a test on the median alone would pass on the
  defect this record exists to prevent. The empty-list assertion distinguishes
  them unambiguously. Both descriptors are direct-import unit tests because
  collect_cycle_times is pure over its arguments — the births index is injected,
  so the unknown-history branch is reachable deterministically without
  constructing a repository whose log happens to be missing a record.
