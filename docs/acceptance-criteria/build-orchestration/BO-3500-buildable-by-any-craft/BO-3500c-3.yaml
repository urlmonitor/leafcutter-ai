notes: |
  THE ADVERSARIAL CRITERION OF THIS L1, and the one that decides whether the tree is
  worth building. Its siblings define what each proof checks; this one asserts that the
  proofs actually reject the artifact a hurried craft produces when it has nothing to
  say. Without it, every per-kind proof can be implemented as a formality that has
  never once returned false, and nobody would notice, because a proof that always
  passes and a proof that is correct look identical on a healthy backlog.

  WHY IT IS STATED ACROSS ALL FIVE KINDS AT ONCE rather than as a clause in each. The
  failure mode is not per-kind — it is that whoever implements the five proofs will
  implement the first one carefully and the remaining four by analogy, and analogy from
  the written-page proof produces four existence checks. Testing all five hollow cases
  in one place is what catches that.

  THE SECOND SCENARIO is a message requirement and is not decoration. This component's
  own register records the cost of a correct refusal reported in the wrong vocabulary:
  the current jam says a member is stale, which sends the reader looking for a missing
  test that was never supposed to exist. "Produced but empty" and "not produced" have
  different causes and different fixes, and conflating them wastes exactly the time this
  tree is meant to save.

  THE THIRD SCENARIO ties this to BO-3500b-2 so the two cannot be satisfied separately:
  a hollow member is a member that was not produced, for the purposes of the group's
  ending, and the sound members are not delivered without it.

  TESTABILITY. Deliberately construct each hollow artifact and assert the proof returns
  false. This is the one place in the tree where the covering tests must be written
  from the attacker's side — the question is not "does the proof pass on good work" but
  "what is the cheapest artifact that passes it", and if a test cannot answer that, the
  proof is not specified tightly enough yet.
