notes: |
  The fail-closed and no-false-alarm boundary for BUG-19's fix (BO-300a-5).

  Two ways the fix fails. It can fail open -- a re-read error yielding an empty set,
  or a re-read reply that never claims it read anything being taken as a verified
  read, either of which reads exactly like an epic that did not grow and restores the
  reported-complete defect at the moment the store is least readable. Or it can fail
  loud -- naming already-complete or removed work as unplanned additions on every
  drive, at which point the section is noise and the operator stops reading it, which
  is the same outcome as not emitting it.

  The removal case is included deliberately: BUG-19 is an omission defect, and
  silently dropping a piece of work that vanished from the epic is the same omission
  with the sign reversed.
