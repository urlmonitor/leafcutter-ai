assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    type:
      - string
      - "null"
    description: "Declared-durable-side-effect selector for the user-surface-smoker trigger. Routing must key off a declared side-effect (data-driven), not an opt-in flag. The exact declared field is pending a user/BA decision (see caveat) — candidates: broaden the existing user_facing_surface selector, or add a declared durable-side-effect axis."
  reference_file_path: "config/agent_registry.json"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py"
  constraints:
    - "The user-surface-smoker trigger currently fires on `user_facing_surface != null` (an opt-in frontmatter flag). Change routing so the observable-side-effect smoke check is selected by a DECLARED durable observable side-effect (data-driven), not an opt-in flag — new side-effect-declaring items inherit the routing automatically."
    - "The smoke check must run automatically in the work item's verification phase and produce a smoke result; the work item cannot reach a done state with the smoke check unrun or silently skipped (mandatory, not advisory)."
    - "Scope-narrowing (BP-1100f-5-i): an item declaring no durable side-effect (for example a docs-only change) is NOT force-routed through the smoke check; the exemption derives from the ABSENCE of a declared side-effect (a data property), never from a hard-coded item name."
    - "Enforce on every point that actually gates: the agent_registry.json selection_criteria (round-tripped by build.py), the ticket agents-map computed by scripts/ac_store/generate_ticket_from_ac.py, and the drive/verification routing in templates/workflows-js/build-ticket.js must agree on the same selection — do not update one enforcement point and leave the others stale."
    - "Portable per ADR-001 — a consumer project that runs build.py gets the automatic routing, not only the leafcutter repo; verify via the build.py round-trip."
test_spec:
  - name: test_side_effect_item_routes_to_smoker_automatically
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    description: "Generate a ticket (via generate_ticket_from_ac) from an AC that declares a durable side-effect; assert the computed agents map emits user-surface-smoker as a needed verification phase, selected by the declared side-effect rather than an opt-in flag."
  - name: test_smoke_check_cannot_be_silently_skipped_before_done
    target_dir: unit_tests/
    framework: pytest
    type: behavioral
    description: "Drive the verification phase for a side-effect-declaring work item; assert it cannot reach a done state with the smoke check unrun or silently skipped."
delivers_to:
  agent: user-surface-smoker
  contract: "A work item declaring a durable, observable side-effect is emitted in the ticket agents map with user-surface-smoker as a needed verification phase, selected by the declared side-effect (data-driven), so the smoke check runs automatically and gates the done state."
expects_from: null
