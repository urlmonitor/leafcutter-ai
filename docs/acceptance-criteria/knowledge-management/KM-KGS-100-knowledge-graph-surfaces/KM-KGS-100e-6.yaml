criteria: |
  Given the store has component membership populated on its criteria and the
    knowledge map has been built from it
  When a specific component that has at least one criterion is queried through the
    knowledge map
  Then the result includes that component's acceptance criteria
  And, by following each returned criterion's implementing and covering links, the
    result reaches the source files and test files that deliver that component
  And the result for that component is not empty
