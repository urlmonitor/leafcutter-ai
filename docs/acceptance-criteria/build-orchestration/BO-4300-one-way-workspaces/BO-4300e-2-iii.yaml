criteria: |
  Given a project "shop" with a ready workspace "alpha" in shop's landing place,
    a project "blog" beside it with a ready workspace "alpha" in blog's landing
    place, and a folder "stray" outside both landing places that holds a copy of
    a workspace record naming shop,
  When clearing is requested from shop for blog's "alpha", and for "stray",
  Then each request is refused, stating that shop has no workspace at that
    location,
  And blog's "alpha" and "stray" are identical before and after,
  And clearing shop's "alpha" from shop is still answered cleared.
