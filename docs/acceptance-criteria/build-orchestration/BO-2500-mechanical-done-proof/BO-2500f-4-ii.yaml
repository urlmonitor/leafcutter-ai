id: BO-2500f-4-ii
components:
  - build_orchestration
  - testing_quality
  - ac_store
title: "Finished test-free records with no covering test are each verified or sent back to in progress before the new rule takes effect"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the finished test-free records that no test tags, measured 2026-10-24 as 63
    (31 with a stated reason, 32 without), plus any added to that population before
    the migration starts,
  When the migration is carried out,
  Then each record ends in exactly one of two states: carrying a verification
    record that holds under BO-2500f-4, or returned to in_progress through the
    demotion path TQ-400b defines, with the reason and the date recorded on it,
  And each record is entered in TQ-400d's worked list with its decision (prove it,
    redo it, or retire it), so progress on this population is counted where the
    unproven-finished pile is already counted,
  And no verification record is produced from a template: an inspection is
    recorded only through a review approved as BO-2500f-3-i requires, and a check
    only where a wired check carries an enforces tag for the record,
  And while any record in the population is still finished with no verification
    record that holds, the new done rule (BO-2500f-4) does not take effect, and the
    change that would switch it on is refused, naming the remaining records,
  And finished test-free records that a test does tag are left as they are, since
    their covering test proves them,
  And the run reports the count in each end state, with the population's
    measurement date and inclusion rule.
depends_on: [BO-2500f-4]
doc_links:
  - path: docs/acceptance-criteria/testing-quality/TQ-400-durable-done-proof/TQ-400d.yaml
    relationship: related
    status: exists
    relevance: "Owns triage of the finished-but-unproven pile; the migration records its decisions there."
  - path: docs/acceptance-criteria/testing-quality/TQ-400-durable-done-proof/TQ-400b.yaml
    relationship: related
    status: exists
    relevance: "Owns the path that returns a finished record to unfinished work, with reason and date."
  - path: docs/architecture/adrs/ADR-076-verification-methods-for-non-test-requirements.md
    relationship: describes
    status: exists
    relevance: 'The decision this record implements: wave 1 (section 1) or wave 2 (section 2)
      of the verification-method rule.'
assigned_agent: python-coder
estimated_complexity: L
declared_files:
  - path: scripts/ac_store/migrate_verification_records.py
    state: to_be_created
  - path: scripts/ac_store/_done_proof_waiver.py
    state: to_be_created
  - path: templates/scripts/commit_guardian/check_done_proof.py
    state: existing
it_requirements:
  - Measure the population at the start by the stated rule (finished, active, test_required
    false, no covers tag by the shared scanner) and report it with its date and rule. The
    63 of 2026-10-24 is the expected figure, not an input.
  - Two end states only. Demotion goes through TQ-400b's write path (TQ-400b-1's single-field
    write; TQ-400b-2's demotion_reason and demotion_date); this record never writes work_status
    itself. TQ-400b-1 and -2 are approved but not built, so this record waits for them.
  - 'Decisions are recorded in TQ-400d''s worked list (TQ-400d-1), which is not built yet:
    wait for it, or the user picks an interim (open question).'
  - 'No templated verification records. The script never writes a verified_by it has not verified:
    an inspection only after a qualifying approval exists (BO-2500f-3-i), a check only after
    the enforces tag and the wiring hold (BO-2500f-2, -2-i). It proposes, and nothing is written
    without the user''s approval per batch, as in BO-2500a-8-iv.'
  - 'Targeted YAML writes: insert only the target keys, never a load-and-dump rewrite. Idempotent:
    a second run writes nothing (verified by running twice and diffing).'
  - 'Switch guard: committing BO-2500f-4''s switch turned on is refused while any record in
    the population lacks a verification record that holds, naming them.'
  - Tagged records are excluded by the shared scanner, never by a hand-kept list.
  - 'Must handle errors gracefully per the project error handling policy: every failure path
    logs at WARNING or higher and resolves to a refusal, never to a waiver.'
test_required: true
test_intent:
  - clause: 'each record ends in exactly one of two states: carrying a verification record
      that holds under BO-2500f-4, or returned to in_progress through the demotion path TQ-400b
      defines, with the reason and the date recorded on it'
    needs_test: true
    reason: The two-end-state invariant is computed by the script, and a record left in neither
      state is the failure to catch.
  - clause: each record is entered in TQ-400d's worked list with its decision (prove it, redo
      it, or retire it), so progress on this population is counted where the unproven-finished
      pile is already counted
    needs_test: true
    reason: Each decision must reach the worked list, and a case for each end state shows
      the entry is written.
  - clause: 'no verification record is produced from a template: an inspection is recorded
      only through a review approved as BO-2500f-3-i requires, and a check only where a wired
      check carries an enforces tag for the record'
    needs_test: true
    reason: The script must refuse to write a verification record it has not verified; with
      no approval and no wired check nothing must be written.
  - clause: while any record in the population is still finished with no verification record
      that holds, the new done rule (BO-2500f-4) does not take effect, and the change that
      would switch it on is refused, naming the remaining records
    needs_test: true
    reason: 'The ordering guard is the safety interlock: turning the switch on with one record
      left must be refused, naming it.'
  - clause: finished test-free records that a test does tag are left as they are, since their
      covering test proves them
    needs_test: true
    reason: A tagged record entering the migration would be demoted or rewritten for nothing,
      so a tagged record must come out untouched.
  - clause: the run reports the count in each end state, with the population's measurement
      date and inclusion rule
    needs_test: true
    reason: The report's counts are computed and must sum to the measured population.
delivers_to: null
expects_from:
  - ac_id: TQ-400b-1
    contract: 'The demotion path: the record''s file no longer reads finished, every other
      field unchanged.'
  - ac_id: TQ-400b-2
    contract: The demoted record carries the reason it was knocked back and the date.
  - ac_id: TQ-400d-1
    contract: The worked list with a fixed decision per record and a declared population.
  - ac_id: BO-2500f-4
    contract: is_done_proof_waived and its single declared switch, off until this migration
      turns it on.
test_spec:
