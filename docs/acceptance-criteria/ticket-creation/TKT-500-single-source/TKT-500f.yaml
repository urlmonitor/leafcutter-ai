id: TKT-500f
readiness: approved
priority: medium
title: "Ticket generation from ACs is trustworthy and migration-safe"
component: ticket-creation
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  The machinery that turns acceptance criteria into tickets can be trusted to
  emit valid, buildable work and to be adopted without breaking what came before.

  When the AC-to-ticket generators produce a ticket, the work assignments they
  emit are always valid ticket-phase agents — a non-phase assignment is caught
  and substituted rather than silently producing a ticket no agent can sign off.
  When the new AC-driven dispatch pipeline is introduced alongside the existing
  ticket pipeline, both can run, they produce equivalent outcomes on the same
  acceptance criterion, and the older pipeline keeps working until migration is
  complete. The dispatch boundary and the migration path are documented so the
  team can reason about the cut-over.
