    relationship: describes
    status: exists
assigned_agent: documentation-expert
estimated_complexity: S
it_requirements:
  - "The documented command sequence MUST be byte-for-byte reproducible from the steps the CI test job in .github/workflows/ci.yml actually runs (install dev deps from requirements-dev.txt -> the build step + install_shims shim bridge -> pytest over the integration + unit test directories). The doc and the workflow must not drift: state the command once and have the doc reflect the workflow, treating the workflow as the source of truth for the executed steps."
  - "Must be written for a reader on a brand-new clone with NO local build outputs present — every prerequisite must be explicit; do not assume scripts/commit_guardian/ or other gitignored build outputs already exist (they are produced by the documented build+shim step, per the decided Approach 1)."
  - "The preparation step is DECIDED (final gate): the documented sequence includes the build step that produces .leafcutter/scripts/ plus the install_shims shim bridge to scripts/. Document that step explicitly rather than leaving it abstract."
  - "Place the canonical command where a newcomer looks first (project README / CONTRIBUTING / the build-pipeline reference doc) and cross-link it so there is exactly ONE authoritative location, not duplicated divergent copies."
delivers_to:
  ac_id: BP-1200a-1
  contract: "The single authoritative documented command sequence (install dev deps -> build step + install_shims shim bridge -> run full suite over the integration + unit test directories) that BP-1200a-1 asserts runs green on a fresh clone, mirroring the steps in .github/workflows/ci.yml"
