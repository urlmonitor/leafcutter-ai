notes: |
  BO-2400a-3 it_requirements[4] already required the gate to be idempotent, but that was
  written when the gate's only input was a fixed test collection. Deriving the partition
  from git introduces two new ways to lose determinism — an unstable diff ordering, and
  a query that mutates or advances repository state (for example a fetch that moves
  origin/main mid-run). Restating idempotency over the new inputs, with stable ordering
  and a no-write guarantee, makes it independently testable rather than an inherited
  assumption.
