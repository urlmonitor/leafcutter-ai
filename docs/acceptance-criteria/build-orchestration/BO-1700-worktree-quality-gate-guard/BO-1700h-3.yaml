criteria: |
  Given the repository sets a `core.hooksPath` git config value that redirects
    hook resolution away from the default shared hooks directory,
  When the probe runs Check C,
  Then it resolves the shared pre-commit hook from the effective hooks path
    (honoring the override), and if that effective path holds no sentinel-bearing
    pre-commit hook, Check C fails, `git_hook` is false, and the probe exits
    non-zero.
  And when the override points at a directory that does contain the
    sentinel-bearing pre-commit hook, Check C passes.
depends_on: [BO-1700h, BO-1700a-1]
