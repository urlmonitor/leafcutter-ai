notes: |
  WHY THE SECOND SCENARIO. The old interactive path (commit.md Step 3) was an assistant-rendered
  "Commit this? (yes / edit / cancel)" -- a question the assistant, or a relayed reply, can
  answer. The L1 requires a confirmation "the assistant cannot answer on your behalf". Only a
  harness-rendered prompt meets that; this scenario is the one a conversational gate fails.

  WHY THE THIRD. Approval of one commit must not become standing approval for the session.

  A standing allow rule or "don't ask again" answer: GE-129d-1-i. A session started by name as the
  commit specialist: GE-129d-1-ii. Modes where no prompt reaches a person: GE-129d-2.

  declares_side_effect: true -- derived from "the session commits the change".
