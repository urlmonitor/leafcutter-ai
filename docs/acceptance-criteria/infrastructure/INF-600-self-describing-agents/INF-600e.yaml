title: "See what goes in and what comes out"
component: infrastructure
level: L1
status: active
criteria: |
  A per-agent input/output contract diagram for every agent.

  Each agent card includes a diagram showing what the agent receives when
  invoked (ticket path, structured payload, config values), what it produces
  (files written, sign-off status, structured response), and what it mutates
  (ticket frontmatter, AC store, knowledge surfaces). You can understand an
  agent's contract without reading its full prompt.
