assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  reference_file_path: "scripts/build_phases.py"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/ -q"
  config_schema_fragment:
    type: object
    description: "The per-reference classification the closure must make before it can decide anything. The three clauses of this AC are the three verdicts, and conflating any two of them is how a closure stops being right."
    required:
      - verdict
    properties:
      verdict:
        type: string
        description: "One of: OURS_DEPLOYED (intra-package, present in the deployed tree — no finding); OURS_MISSING (intra-package, absent from the deployed tree — build failure naming it, at any hop depth); NOT_OURS (standard library, installed third-party distribution, or host-project path — no finding, and never a candidate for deployment); UNRESOLVABLE (a dynamic reference static analysis cannot decide — reported for a human, never silently classified NOT_OURS)."
      hop_depth:
        type: integer
        description: "The distance from the deployed script at which the reference was found. Carried so a second-hop failure names the module that is actually missing rather than the top-level script, and so a closure that silently stops at depth 1 is observable as such."
  constraints:
    - "THE NEWLY-ADDED-MODULE TEST IS THE ONE THAT CANNOT BE FAKED, AND IT IS THE ACCEPTANCE TEST FOR 'DERIVED'. It must add a real module to the package tree inside the test, have an already-deployed script resolve it, edit NO manifest, list, or allowlist, and re-run the build. Every other clause of this AC can be satisfied by a sufficiently complete enumeration; this one cannot. If it is dropped, weakened, or replaced by a fixture that pre-registers the module, the derivation requirement of BP-900g-8 has not been met regardless of what else is green."
    - "A CLOSURE THAT STOPS AT DEPTH 1 MUST BE OBSERVABLE AS SUCH. 'Check the siblings' is where a naive implementation stops, and the ac_store package is exactly the module cluster where one helper imports another. The second-hop failure message must name C, not A — an author told the top-level script is broken goes looking at the wrong file."
    - "OUT-OF-PACKAGE IS A FALSE-POSITIVE CONTROL, NOT A COURTESY. A closure that demands the build ship the standard library gets an allowlist within a week, and an allowlist is a hand-maintained list wearing a different name — which returns the whole feature to the state BP-900g-8 exists to leave. Cover all three out-of-package forms: stdlib, an installed third-party distribution, and a host-project path such as the debugging/scripts/... form that BP-900g-4 mis-normalised and BP-900g-5 had to spend a clause undoing. BP-900g-6's negative-control tests fence this and must stay green."
    - "UNRESOLVABLE IS A FOURTH VERDICT, NOT A SYNONYM FOR NOT_OURS. Where static analysis cannot decide what a dynamic reference resolves to, report it. Folding the undecidable case into 'not ours' is the same fail-open this whole L2 subtree is closing, relocated into the classifier."
    - "REUSE BP-900g-8'S HARNESS; DO NOT BUILD A SECOND ONE. The temp-target build harness is delivered by BP-900g-8 and is also consumed by BP-900g-10. Three private copies of a deployed-tree harness will drift, and the copy that is not exercised by the blocking test is the one that will be wrong."
    - "The three shapes must be asserted against the produced target directory, never against the deploy declaration. 'Read the manifest and agree with it' is explicitly disqualified by the criterion and is the exact shape of a test that passes while the tree ships broken."
delivers_to: null
expects_from:
  ac_id: BP-900g-8
  contract: "Two things, both delivered by BP-900g-8 and consumed unchanged here: (1) the derived transitive closure function over the package tree, returning per deployed script the intra-package modules it resolves, plus the build-time containment check against the deploy declaration; (2) the deployed-tree harness that runs `python scripts/build.py --target-dir <tmp>` into a temporary target and exposes the produced tree for inspection. This AC adds no new closure and no new harness — it drives three surface shapes (second hop, newly added module, out-of-package) through both."
test_spec:
  - name: test_bp_900g_8_i_second_hop_missing_dependency_fails_the_build_naming_the_inner_module
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: boundary
    description: "The depth boundary: deployed script A resolves B, B resolves C, C is withheld from the deploy. Build into a temp target and assert non-zero exit and that the failure names C — specifically assert C appears and that naming only A is a failure. A closure that stops at depth 1 passes a one-hop test and fails here; that is the whole point of the entry."
  - name: test_bp_900g_8_i_out_of_package_modules_produce_no_finding
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: boundary
    description: "The false-positive control across all three out-of-package forms in one run: a stdlib import, an installed third-party distribution import, and a host-project path of the debugging/scripts/... form that BP-900g-4 mis-normalised into a deploy key. Build into a temp target and assert zero findings for all three and a zero exit. A closure that flags these gets an allowlist, and an allowlist is the hand-maintained list this feature exists to remove."
  - name: test_bp_900g_8_i_newly_added_module_is_covered_with_no_manifest_edit
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT with the must_block modifier, and the acceptance test for 'derived'. Inside the test, write a new module D into the package tree and make an already-deployed script resolve it. Edit NO manifest, list, or allowlist. Run `python scripts/build.py --target-dir <tmp_target>` as a subprocess and assert the outcome is either (a) D present in the deployed tree, or (b) non-zero exit naming D. A run that exits zero with D absent from the deployed tree FAILS this test — that outcome means the closure is still reading a list. This is the only construction that distinguishes derivation from enumeration."
  - name: test_bp_900g_8_i_all_three_shapes_asserted_against_the_produced_target_tree
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: deployed
    description: "For each of the three shapes, the assertion reads the DEPLOYED target directory produced by build.py — file presence and cold module resolution in the temp target — and never the deploy declaration in build_phases.py. A test that reads the manifest and agrees with it is green on a tree that ships broken, which is explicitly disqualified by the criterion's last clause."
test_rationale: |
  Three shapes, three distinct ways a closure that is right today stops being right,
  and each needs its own failure mode available to the test.

  The second hop is where a "check the siblings" implementation stops. It is not depth
  for its own sake: scripts/ac_store/ is exactly the module cluster where one helper
  imports another, and the live instance at HEAD is a sibling resolution. A one-hop
  test is green on a depth-1 closure, so the entry has to withhold the module at
  depth 2 and assert the inner module's name appears.

  The newly-added module is the temporal case and it is the only entry here that can
  fail an otherwise-complete enumeration. An implementer can satisfy every other clause
  of BP-900g-8 by writing a correct list today; the defect then returns on the next
  module, which is precisely the history the criteria cite — three instances fixed one
  at a time, each annotated with a warning, and a fourth live. This entry adds a module
  inside the test and forbids touching any list, so the only implementation that passes
  is one that reads the code.

  The out-of-package case is the false-positive control, and it is load-bearing rather
  than tidy: a closure that demands the build ship the standard library acquires an
  allowlist, and an allowlist is a hand-maintained list under a different name. It also
  re-fences BP-900g-5's narrowed prefix bound, which existed because BP-900g-4
  mis-captured a host-project path.

  The fourth entry charges `deployed` explicitly so the assertion surface is pinned:
  every one of the three shapes is judged from the produced target directory. Reading
  the manifest and agreeing with it would pass all three shapes on a tree that ships
  broken, and the criterion disqualifies it in so many words. Three distinct angles are
  charged (boundary, reachability, deployed) against a cap of four; the fourth slot is
  deliberately left unspent rather than duplicating the parent's criterion entry.
