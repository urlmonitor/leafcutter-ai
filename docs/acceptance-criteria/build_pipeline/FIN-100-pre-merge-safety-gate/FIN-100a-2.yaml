notes: >-
  Side B of the 2026-08-17 BP-300e-4 adjudication. This AC's degradation is the ONE
  reading point the adjudication confirmed as legitimately exempt from the halt rule, and
  it is the calibration case for an admissible register entry: the substitute value it
  continues with (a null baseline) steers the run toward MORE checking, because triage
  then treats every post-merge failure as a regression. Contrast the negative case named
  in BP-300e-4 — the AC-authoring reading point in plan-feature.js, whose substitute lets
  the stage report success with its product missing, and which the register may never
  admit. The full adjudication, both positions and the grounds are in the notes of
  BP-300e-4; do not re-open the question from this end.
