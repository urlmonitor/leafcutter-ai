notes: |
  FOUR TIMES IS A PATTERN, NOT AN ACCIDENT. This component has now shipped four guards that are
  written, tested, deployed and registered nowhere. GE-122d's coverage matrix documented the
  third one — check_adr_collision.py — and named the trap explicitly, and the very next guard
  built in this epic fell into it anyway, with a green suite and six adversarial reviews behind
  it. A rule that is documented, understood, and then violated by the people who documented it
  is not a knowledge problem. This AC is the mechanical interlock that makes the fourth time the
  last time.

  WHY IT SITS UNDER GE-120c AND NOT UNDER GE-122. GE-120c is the anti-regression L1 — in the
  PO's words, "the reason the other three do not quietly come back" — and it is the only place
  in the store where a rule about the whole family of guards belongs. Filed under GE-122 it
  would protect the numbering guard alone, which is precisely the mistake that produced four
  instances of the same defect: each was fixed for one guard and for no other.

  WHY IT IS NOT GE-120c-3 RESTATED. The two are mirror images and neither subsumes the other.
  GE-120c-3 asks: is every REGISTERED check exercised by the harness? This asks: is every BUILT
  check registered at all? A guard that is deployed and unregistered is outside GE-120c-3's
  expected set by construction, so GE-120c-3 is green today while four such guards exist. Both
  drift directions need their own answer, and the deployed-registry axis is the one that has
  actually failed four times.

  A GUARD THAT SHIPS UNREGISTERED IS WORSE THAN NO GUARD, which is why this fails rather than
  warns: it appears in every inventory as coverage, so it does not merely fail to protect — it
  actively stops anyone from noticing that nothing is protecting.

  IT-PO (2026-08-25) — THE SHARED EXEMPTION VOCABULARY IS WHERE THE TWO SWEEPS COULD STILL
  MERGE BY ACCIDENT. The BA correctly required reuse of GE-120c-3's exemption mechanism rather
  than a second one. Reuse of the MECHANISM is right; reuse of the VERDICT is the merge this AC
  must not suffer. If a declaration is stored without recording which sweep it applies to, then
  exempting a shared helper from 'must be exercised' silently also exempts it from 'must be
  registered' — and the two directions collapse into one after all, quietly, through the
  exemption store rather than through the comparison. Scoping each declaration is what keeps one
  vocabulary from becoming one sweep.

  IT-PO — STORE-HYGIENE FINDING, NOT ACTIONED HERE. scripts/epic_lock.py does not exist in this
  worktree; it survives only as a reference in docs/components.json and
  templates/skills/building-epics/SKILL.md. Both this AC's criteria and BP-900e-3's approved
  criteria name it as a package-development script. Neither set of criteria has been changed.
  The consequence for the implementer is captured as an it_requirement: do not write a
  regression assertion whose subject is a path that cannot exist, because it passes on a broken
  sweep. The dangling reference itself is worth a separate ticket against whichever component
  owns docs/components.json.
