  contract: "The store-only resolver `resolve_observation_proofs(ac_ids, *, ac_root)` returning per-requirement proof records tagged with ac_id and proof_index. Because the resolver takes AC ids and no ticket path, the same call serves the bundled and standalone paths -- which is what makes the fourth Then clause achievable at all."
