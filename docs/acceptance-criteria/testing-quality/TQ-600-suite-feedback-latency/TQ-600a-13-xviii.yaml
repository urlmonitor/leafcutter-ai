test_rationale: |
  NO DEFAULT-RUN UNIT TEST, BY DESIGN. The criteria's demonstration — present each runbook
  a recorded pull-request state and observe the decision — is an evaluation of a model's
  behaviour: it needs model calls, is nondeterministic, and costs far more than this
  family's 15 s default-run budget allows. A unit test that searched the runbooks for the
  rule's sentence would be the grep-only form CLAUDE.md forbids. So the done-proof is a
  RECORDED SCENARIO EVALUATION, run by the implementer after editing: for each runbook in
  the final inventory, two recorded states as `gh pr checks --json name,state,link`
  output — (A) `Post-merge suite status` the only failing check; (B) it fails beside a
  real `Test suite (pytest)` failure — given to an agent dispatched under that runbook,
  with the decision recorded in this record's notes (expected: A reports an external hold
  and stops; B treats the pytest failure as its own and the hold as external). Fixtures
  live beside the notes, not in the default suite. If the owner wants a repeatable
  harness, that is a separate evaluation-tooling record.
