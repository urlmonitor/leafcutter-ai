it_requirements:
  - "Both check_output_drift.py and check_build_drift.py must resolve the manifest the same way — the identical hardcoded path exists in both, so fixing one alone leaves the sibling gate inert"
  - "Manifest resolution must not hardcode a package-directory name; derive it from the hook's own deployed location or search the plausible roots"
  - "A missing manifest must produce a visible warning naming the paths tried, never a silent success"
  - "Must follow the repo error-handling policy: specific-exception try/except around file and JSON I/O, log at WARNING or higher or re-raise; no bare or silent excepts"
  - "Verify behaviorally — execute each hook against a synthesized layout and assert it finds the manifest; do not grep the hook source"
