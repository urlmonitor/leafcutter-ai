criteria: |
  Given the legacy convention moves completed tickets to an epic's done/ subfolder,
  When the new frontmatter-driven lifecycle is active,
  Then ticket-supervisor no longer performs git mv to done/,
  And all gates and queries that previously checked done/ now check status: done,
  And the parity guard mechanically prevents new done/ folder moves,
  And existing epics with tickets already in done/ continue to work correctly
    (backward compatibility during the transition period).
