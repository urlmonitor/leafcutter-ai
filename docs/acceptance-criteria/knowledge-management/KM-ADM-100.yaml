title: "Rely on the map of how your project fits together, because it admits what it cannot prove"
component: knowledge-management
level: L0
status: active
req_status: draft
readiness: draft
priority: medium
criteria: |
  Every connection on the map says how far you can trust it.

  Before changing anything you need to know what else it touches, and today that
  answer arrives with the same confidence whether it rests on a rule that is really
  enforced or on nothing at all. After this goal the map describes itself: each
  connection states what backs it and how much of the project that backing actually
  covered, the connections the project does not have appear as visible gaps rather
  than silent absences, the links that matter most when deciding what a change will
  break are ones you can follow, and every copy of the map tells the same story. You
  can act on what it says — or see plainly that you cannot.
