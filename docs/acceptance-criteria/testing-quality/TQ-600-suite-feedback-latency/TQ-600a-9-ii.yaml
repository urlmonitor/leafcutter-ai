notes: |
  This record exists mostly to say no. The originating hypothesis for this whole branch
  of work was that the slow files self-target and should be converted; this is the one
  file where that is true, and it is also the one file where the conversion would be
  most damaging. Recording the refusal as a criterion with a named mutation is the only
  form in which the refusal survives the next person who reads the timing table and
  reaches for the obvious fix.
