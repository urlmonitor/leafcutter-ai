test_rationale: |
  Every existing BO-3900 and BO-4000 test stubs resolution with a bare epic name or a
  repo-relative path, so toWorktreePath's relative branch runs and the tests are green.
  The defect lives exclusively in the absolute branch, on the one input shape no fixture
  used — which is the shape the real resolver actually returns. That is why a whole family
  of path-handling ACs could be done and correct while the drive silently built the clone.

  The assertion is therefore written over the dispatches rather than over the helper: a
  unit test of the helper would have to assume which call sites use it, and the incident
  was precisely that the call sites were all present and all no-ops. Reading the prompts
  the driver really emitted, from the driver's own top-level body, is the only form that
  could have failed on the broken code.

  The negative and positive are deliberately paired. "No prompt names the clone" is
  satisfied by a run that dispatches nothing at all, which is how a fix that aborts early
  would look identical to a fix that works.
