title: "A learning that could not be published is said out loud before the place it was written is removed"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a-5.yaml"
criteria: |
  Given the routing step wrote learning text into destination files inside the
    working directory a unit of work ran in, and the publication that would
    carry those files into the merged tree does not carry them — the commit is
    refused by a gate, carrying the change conflicts with the merged tree, or
    the path stops between the write and the publication,
  When the driver reports the unit of work finished, and again when the step
    that removes that working directory runs,
  Then the reported result counts those records as unwritten, names each
    destination that did not reach the merged tree, and states which of the
    three reasons applied,
  And the records stay eligible: once the cause is removed, a later completed
    unit of work puts each learning in the merged tree, and puts it there once,
  And the working directory is not removed quietly while a learning written
    during that unit of work is absent from the merged tree — the removal step
    names each such destination and the learning text it holds, announced at
    the last moment anything can be done about it in this unit of work, and
    says whether the record behind it is still eligible so a reader can tell a
    write that will be made again from one that will not,
  And the announcement does not stop the removal and does not stop the work:
    the unit of work's own outcome, its failure count, and the driver's exit
    status are identical to the run in which every publication succeeded,
  And a routing write is never the reason a unit of work's own publication
    fails: where the destination change cannot be carried, it is left out of
    the publication and reported unwritten, and the work publishes without it.
depends_on: [INF-700a-5]
