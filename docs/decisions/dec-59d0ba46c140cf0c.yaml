options:
  - id: opt.move_to_e2
    title: move ticket 08 out of E1 into E2, after DK-400d-1 and DK-400d-3
    description: Remove ticket 08 from E1 (and from E1's Master_Plan) and take DK-400a-1-ii into E2's AC set, so E2's generator
      orders it after DK-400d-1 and DK-400d-3 and next to DK-400d-3-i. Its red test leaves E1's index and is kept with the
      ticket for E2 (not committed on E1). E1 resumes at once with 10, 11, 13, 15, 16, 17. Amends dec-9925ebf1895222f4's E1/E2
      composition by one AC; a short note records why.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
  - id: opt.pull_d_into_e1
    title: pull DK-400d-1 and DK-400d-3 (with their L3 children) into E1 ahead of ticket 08
    description: Generate tickets for DK-400d-1, DK-400d-1-i, DK-400d-1-ii, DK-400d-3, DK-400d-3-i..iii into E1 and make ticket
      08 depend on them. E1 grows by about six tickets and takes most of DK-400d out of E2; the gate outcomes are built before
      E1's remaining propose-side tickets finish.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
  - id: opt.widen_08
    title: widen ticket 08 to build a minimal approve outcome itself
    description: Ticket 08's scope grows to include consuming the gate's approve answer and releasing parts, just enough for
      its tests. DK-400d-1 in E2 then has to reconcile with or replace that partial implementation.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
  - id: opt.defer_08_in_e1
    title: keep ticket 08 in E1 as deferred, commit its red test, and re-ticket DK-400a-1-ii in E2
    description: Set ticket 08 to deferred with a note naming DK-400d-1/DK-400d-3, commit its red test on E1 (it shows as
      xfail while the AC is not done), and generate a fresh ticket for DK-400a-1-ii when E2 is planned. E1 resumes at once
      and archives with 08 deferred.
    assumptions: []
    evidence_ids: []
    proposed_by: claude_code:host_proposed
    approved_by: user
