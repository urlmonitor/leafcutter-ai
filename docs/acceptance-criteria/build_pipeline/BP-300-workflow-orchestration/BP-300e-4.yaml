id: BP-300e-4
components:
  - build_pipeline
title: "A reply with no recoverable structured result stops the run with a clear error naming the stage and agent"
component: build-pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: high
work_status: todo
criteria: |
  Given a workflow run dispatches a helper agent to return a structured result,
  And that agent's reply contains no recoverable structured result at all
    (prose only, with no valid JSON object or array anywhere in it),
  And the point in the run that reads that reply is not named in the workflow's
    declared degradation register — the single, enumerable list, carried in the
    workflow itself, of the reply-reading points that are allowed to carry on
    without a readable reply, each entry naming the stage it covers, the
    substitute value the run carries on with, and a written reason,
  When the workflow reads the agent's reply,
  Then the run stops with a clear, typed error that names the stage and the agent
    whose reply could not be understood,
  And the failure is neither silently skipped nor swallowed — the user is told a real
    problem occurred rather than the run appearing to succeed with missing output.

  Given the same unreadable reply,
  And the point that reads it IS named in the workflow's declared degradation
    register,
  When the workflow reads the agent's reply,
  Then the run carries on using exactly the substitute value that register entry
    declares, and no other,
  And the run's own account of what happened records that the named stage carried
    on without a readable reply, so a run that finishes never presents that stage
    as having produced the result it was asked for.

  Given a reply-reading point where the reply IS the product the stage exists to
    deliver — for example the stage that authors requirements, whose reply carries
    the list of requirements it wrote,
  And that stage's agent returns a prose-only reply,
  When the workflow reads the agent's reply,
  Then the run stops with the typed error naming that stage and that agent,
  And it stops whether or not that point appears in the declared degradation
    register, because a substitute that lets a stage report success while its
    product is missing is not an admissible degradation — the register admits only
    substitutes that steer the run toward more checking, never toward an unearned
    success.
