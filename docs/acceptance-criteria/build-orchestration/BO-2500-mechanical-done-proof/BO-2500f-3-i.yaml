notes: |
  Wave 2. User scope change 5 (PO gate 2026-10-25), then the user's decisions of
  2026-10-25 at the IT PO stage: (1) the identity an agent cannot forge is a
  person's approval at an interactive inspection gate; (2) that approval is KEPT
  as a small retained JSON file in a tracked folder,
  docs/acceptance-criteria/_inspections/<run_id>.json, committed together with
  the record, so CI and every machine read the same evidence. It is NOT the
  gitignored ADR-024 pause/resume store, and it is never cleared.

  Folder choice, checked 2026-10-25: tracked JSON files already live under the AC
  store (the TQ-600a-13-xviii scenario fixtures, merged in #1149), and the record
  scanner keeps only YAML suffixes and skips the registry file, so a JSON file in
  _inspections/ is not read as a record. No alternative path is needed. If a
  scanner that walks component folders by name reports _inspections/ as an
  unknown component, that scanner should skip folders starting with "_"; the
  IT PO confirms.

  Why not a GitHub pull-request approval (an earlier draft): GitHub never lets a
  PR's author approve it, and the user is a solo maintainer. Why not the commit
  author: agents commit under the user's own git identity.

  RESIDUAL TRUST, accepted by the user and stated plainly: approval files are
  written only by the inspection gate's own code path, and no CLI or general
  write command creates an "approve". Even so, an agent with shell access could
  still write a forged approval file by hand. Nothing in this record prevents that.
  A later upgrade to signed commits for approval files stays possible and is not
  ruled out by this design.

  The run id and record id in the Given are examples.
