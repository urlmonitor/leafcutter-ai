risk_surface: contract_boundary
notes: |
  REVERSES inherited ACD-400b ("the ticket body contains the AC's Gherkin criteria
  verbatim") and ACD-400b-1 ("the ## Acceptance Criteria section contains the AC's
  criteria field verbatim"). If ACD-1600 is approved, ACD-400b and ACD-400b-1 must
  be amended or superseded by governance so the two rules do not conflict. Flagged
  by the PO in ACD-1600 notes; surfaced here for the IT-PO / user.

  IT-PO enrichment (2026-08-12): canonical generator surface
  (scripts/ac_store/generate_ticket_from_ac.py), aligned with sibling ACD-1600a-2 and
  edge child ACD-1600a-1-i; gated behind ac_unit_of_work.emit per ADR-026.
