criteria: |
  Given deterministic embedding fixtures for decisions D1, D2 and D3 and a request for two candidates
  When similarity search runs in the authorized scope
  Then at most two candidates are returned in deterministic ranked order
  And each identifies the embedding model and retrieval method
  And scores are described as ranking signals rather than probabilities of correctness
  And text similarity alone creates no canonical relationships
