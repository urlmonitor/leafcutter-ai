notes: |
  WHY THIS IS AN L1 AND NOT A NEW L0. BO-3200 already owns the principle, in the
  user's own words on the L0: "only JUDGEMENT is delegable to a specialist. I/O,
  control flow, and consent are not." Nothing here restates that. This L1 supplies
  the CAPABILITY that rule presumes: a sanctioned way for every workflow to get its
  routine reads and chores done, when the workflow body itself has no filesystem and
  no subprocess of its own.

  TWO ACCEPTED ROUTES, AS OF 2026-09-30. Routine mechanical work goes to one of them,
  never to an agent whose charter lets it decline:

    - A FACT KNOWABLE BEFORE THE RUN STARTS is resolved before the run starts and
      passed in through args. ACD-2100b-5 is the worked example: the plan-feature
      skill, which has real shell and file access, runs
      scripts/worktree/check_workspace_setup_permission.py before the workflow starts
      and passes the verdict in (e4ee392d, on main via PR #864 on 2026-09-22;
      ACD-2100b-5 is work_status done), and the workflow fails closed when a caller
      supplies no verdict. docs/reference/workflow-authoring-contract.md section 5,
      Edge 1 already uses the same route for timestamps.
    - A COMMAND STEP DURING A RUN goes to the chartered executor,
      command-step-runner (templates/agents/command-step-runner.md and its
      config/agent_registry.json entry, permits_shell true; BO-2400a-1-i, on main
      2026-09-28). It runs exactly one given command, once, in a named workspace and
      returns the output verbatim, or declines a request outside that role. It
      exercises no judgement over the command, so the only thing it declines is a
      request that was never its job. It was built under BO-2400 for the fast lane;
      this record adopts it and does not specify a second executor.

  Which route fits a given site is the BA's call at L2. The rule of thumb: a fact
  fixed before the run starts can be resolved then; anything that depends on what the
  run has already done, or that changes the repository, is a command step.

  DECISION HISTORY -- MADE 2026-09-16, PARTLY REVERSED 2026-09-30. Kept so a later
  reader neither re-derives it nor mistakes the reversal for an oversight.

    - 2026-09-16, STANDS: the user chose a CHARTERED EXECUTOR -- one agent whose
      entire charter is to carry out one exact command and return its output
      verbatim, exercising no judgement. command-step-runner is that executor.
    - 2026-09-16, STANDS: AN ENGINE-LEVEL READ/EXEC PRIMITIVE was rejected as
      UPSTREAM. The E2 workflow engine is Claude Code's, not leafcutter's, so adding a
      filesystem or subprocess global to the workflow body is not a change this
      project can make.
    - 2026-09-16, REVERSED 2026-09-30: PRE-RESOLVING THE FACTS INTO args BEFORE THE
      RUN STARTS was rejected as "second-hand by another route", on the grounds that
      it moved a load-bearing read into an LLM-mediated prelude in the slash-command
      wrapper, the same class of relay this L0 exists to eliminate. Main had
      meanwhile built ACD-2100b-5 by exactly that route, and on 2026-09-30 the user
      chose "Keep main's approach". What the objection feared -- a read relayed by a
      specialist that can paraphrase, truncate or decline -- is not what was built:
      the read is done by a script the user's own session runs, and the workflow
      fails closed if the verdict does not arrive. Pre-resolution is therefore an
      accepted route for facts knowable at start.
    - 2026-09-16, WITHDRAWN IN FULL 2026-09-30: on the strength of that rejection this
      record authorised the BA to narrow two approved ACs, BO-3200a-1 and
      ACD-2100b-5, from "no dispatch" to "no judgement requested", called both
      unbuildable as written, and said more broadly that five approved L2s across two
      components were written against a runtime that could not satisfy them (only
      those two were ever named). Neither is unbuildable -- ACD-2100b-5 is built --
      and neither needs any amendment on account of this record. BO-3200a-1 is back to
      its approved wording, and ACD-2100b-5 and its parent ACD-2100b are back to
      main's versions (0ac98ffd). This record places no constraint on either.
    - 2026-09-16, STANDS: repointing the dispatches at worktree-agent and widening
      permits_shell were both rejected outright. The first loads unrelated errands
      onto a charter scoped to creating and removing worktrees; the second
      contradicts this L0's standing rule. The sites already moved to worktree-agent
      as a stopgap are inside this record's scope for that reason.

  WHAT REMAINS FOR THIS L1, 2026-09-30. Both routes exist; the value still
  undelivered is coverage. Routine mechanical work in every workflow goes to one of
  the two routes instead of to an agent that may decline. The open inventory is
  docs/known-issues/build-orchestration/open-high-ki-bo-20260927-status-checker-runs-workflow-shell-commands.md:
  about 40 shell, git and script dispatches across plan-feature, build-feature,
  build-ticket, build-epic, fast-lane-ship and finalize-feature still go to
  status-checker, which is registered permits_shell false. They include git reset
  --hard, git restore and rm. Fast-lane routing is tracked separately as
  BO-2400f-5-i, so this record does not decompose fast-lane-ship's sites again.

  WHY critical, RE-STATED 2026-09-30. The 2026-09-16 rationale was a total halt: the
  /plan-feature startup check stopped every run before any authoring agent, and since
  ADR-012 makes /plan-feature the only sanctioned entry point and CLAUDE.md mandates
  ticket-driven change, all new work was blocked. ACD-2100b-5's pre-flight removed
  that halt. What remains is intermittent rather than total: any of the ~40 sites can
  fail whenever status-checker declines, most sites read the decline as a real answer
  ("no orphans", "branch unknown", "store absent"), and some of them reset, restore or
  delete. Priority is left at critical as set on 2026-09-16; whether it still
  warrants critical is the user's call at approval.

  EVIDENCE, 2026-09-16: two reproductions of the /plan-feature halt (wf_6e6de02b-3f9,
  wf_82e1655d-e68), both stopping at resolve-workspace-setup-permission before any
  authoring agent was dispatched, zero ACs produced. Roughly 20 shell steps in
  plan-feature.js were dispatched to status-checker, which declares permits_shell
  false and refuses by charter. Exactly 1 of 60 registered agents declared
  permits_shell true, and it was worktree-agent.
  RE-MEASURED 2026-09-30: the resolve-workspace-setup-permission dispatch is gone
  (ACD-2100b-5). 2 of 61 registered agents declare permits_shell true: worktree-agent
  and command-step-runner. Across the six workflows above, 58 dispatch lines still
  name status-checker as the agent type (plan-feature 21, finalize-feature 20,
  build-feature 8, build-ticket 5, build-epic 2, fast-lane-ship 2); the KI counts
  about 40 of them as shell, git or script commands and the rest as within that
  agent's charter.

  BOUNDARIES -- neighbours this must not absorb:
    - BO-3200a -- facts are read at the source. That is the RULE. This is the MEANS.
      An implementer who satisfies one has not satisfied the other.
    - BO-3200b -- required actions are performed. Same relationship.
    - ACD-2100b-5 -- built by the pre-resolve route; the worked example of this
      record's first route. This record neither changes it nor depends on it.
    - BO-2400a-1-i -- owns command-step-runner itself: its charter, its registry
      entry, its verbatim result and its decline shape. This record adopts the
      executor and must not re-specify it.
    - BO-2400f-5-i -- routes the fast lane's command steps to command-step-runner.
      Those sites are counted there, not here.
    - INF-600k-1 -- lets the registry accept any workflow filename as a legitimate
      caller (today fast-lane-ship.js and finalize-feature.js are admitted by name).
      Each workflow that starts dispatching command-step-runner needs that; the
      capability is INF-600k-1's, not this record's.
    - BO-3800 -- a GUARDRAIL refusal summoning a craft. Different refusal, different
      layer, and it depends on INF-800f rather than on this.
