id: BO-2000e-2
components:
  - build_orchestration
title: "The supervisor refuses to dispatch the coder before tests exist for a code ticket"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a code ticket in the dispatch loop whose Test Requirements are absent and for
    which no test-writer red-baseline has been produced,
  When the supervisor reaches the point where it would spawn the coder phase,
  Then it does not spawn the coder,
  And it holds the ticket back with a reason stating that tests must exist first,
  So the coder cannot proceed to self-write its own tests (phantom coverage).
