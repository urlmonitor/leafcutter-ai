notes: |
  Regression origin: the setup step was dispatched to a status-reporting agent that
  refused it as out of scope. The refusal was not an execution failure, so the run
  continued with no workspace. Adjacent-but-distinct: BO-1900c covers charter-vs-task
  matching for TICKET dispatch; this AC covers a workflow-internal step dispatch and
  must not be folded into that tree.

  Re-homed 2026-08-14 from BO-1500a-4 to BO-1500f-1 by the Pattern C intermediate split
  of BO-1500a. Criteria text is unchanged. BO-1500a-5 and BO-1500a-8 remain under
  BO-1500a and now depend on this AC across the f/a boundary.
