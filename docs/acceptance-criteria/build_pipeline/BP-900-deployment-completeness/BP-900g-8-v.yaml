id: BP-900g-8-v
components:
  - build_pipeline
title: "A template's parsed frontmatter is exactly what the pure-Python YAML parse of its text gives, for every real template"
component: build-pipeline
level: L3
status: active
req_status: active
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g-8.yaml"
criteria: |
  Given every real frontmatter block under templates/ (agents, skills, workflows and
    docs) and a set of synthetic edge cases (dates, quoted strings, multi-line
    scalars, empty frontmatter, YAML that does not parse, non-mapping YAML, text with
    no frontmatter at all),
  When template_compiler.parse_frontmatter parses each text, including a second
    parse of the same text in the same process,
  Then the returned (frontmatter, body) pair is equal to the pair the reference parse
    gives, where the reference is yaml.load(<frontmatter text>, Loader=yaml.SafeLoader)
    applied with parse_frontmatter's own splitting rules,
  And the value types are the reference's types (a date stays a datetime.date, a
    number stays an int, a boolean stays a bool),
  And the mapping's key order is the reference's key order,
  And YAML that does not parse still gives an empty frontmatter dict with the body
    split off, and a first and a second parse of it agree,
  And a caller that mutates the frontmatter it was handed cannot change what a later
    parse of the same text returns,
  Because a parse that is reused rather than recomputed is only a speed-up if no
    caller can tell the difference, and the build parses the same template text
    about nine times over.
depends_on:
