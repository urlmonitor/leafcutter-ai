id: BO-3200d-2-i
title: "A result that was never produced reports as not obtained, distinct from empty and from bad"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a specialist that fails before producing its result, so nothing is available at the
    agreed handover,
  When the step that reads the result runs,
  Then it reports that the result could not be obtained, and the run halts.

  Given a specialist that produces an empty result deliberately, so the handover carries
    content of zero length,
  When the step that reads the result runs,
  Then it reports that the result was empty, and that report differs from the could-not-obtain
    report.

  Given a specialist that produces a complete result that fails the reading step's requirement,
  When the step runs,
  Then it reports that the result was inadequate, and that report differs from both of the
    above.
depends_on:
  - BO-3200d-2
