readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a code ticket (it has a coding phase agent in its agents map) driven via /build-feature,
  When its phases are executed through the flattened driver,
  Then the test-writer phase is dispatched as its own agent that produces the failing test baseline first,
  And the coder phase is dispatched as a separate agent afterward,
  So neither phase is collapsed into one agent that writes both the tests and the code
    (preserving the TDD separation and the phantom-test guards carried by those templates).
