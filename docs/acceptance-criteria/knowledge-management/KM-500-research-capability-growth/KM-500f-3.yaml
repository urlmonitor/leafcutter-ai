id: KM-500f-3
title: Explain readiness recommendations with an explicit policy and missing inputs
component: knowledge-management
components:
- knowledge_management
level: L2
status: active
req_status: active
work_status: in_progress
readiness: approved
priority: medium
parent: KM-500f
criteria: 'Given a person asks which candidate requirement should be built next or whether a promised benefit is
  ready

  And the request identifies a decision policy and supplies some combination of recorded priority, readiness, work
  status, dependencies and proof

  When research provides its recommendation

  Then it cites the available source facts and identifies the policy used to compare the candidates or assess the
  benefit

  And recommendation or interpretation is labeled separately from canonical priority and recorded status

  And missing prerequisites, unresolved dependency evidence and absent execution or deployment proof remain visible
  for each affected conclusion

  And a requirement marked done is not described as available to users without evidence for the requested environment

  And if the ranking policy or required source facts are unavailable, the response requests the missing decision
  input or reports that the ranking cannot be established

  And no recommendation silently changes canonical priorities, readiness or work status.

  '
