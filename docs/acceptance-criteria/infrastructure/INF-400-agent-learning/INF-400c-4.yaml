test_spec:
  - name: test_emitting_and_reading_sides_resolve_the_same_absolute_path
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: seam
    description: "Resolve the sink from the reading side (the harvester CLI with no --sink argument) and from the emitting side (the path literal in each of the four shipped surfaces) in one working tree; assert all resolved absolute paths are equal and that the check reports having inspected four emitting surfaces, so a run that resolved none cannot report agreement."
  - name: test_parity_check_blocks_when_the_two_sides_resolve_to_different_paths
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "the sink-parity check invoked through its production entry point via subprocess"
    description: "Failure branch 1, negative control. In a temp tree where one emitting surface names a different path, run the check through its real entry point; assert non-zero exit and that the message names both resolved paths and which side produced each."
  - name: test_parity_check_blocks_when_the_declared_value_is_the_operational_telemetry_stream
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Failure branch 2, the settlement discriminator. In a temp tree where BOTH sides agree and the agreed value is debugging/logs/agent_telemetry.jsonl, run the check; assert non-zero exit. This is the branch that rejects the one-line argparse-default settlement, and it must fail even though branch 1 is satisfied."
  - name: test_resolving_the_sink_path_creates_neither_the_file_nor_its_directory
    target_dir: tests/knowledge/
    framework: pytest
    type: unit
    angle: criterion
    description: "Resolve the declared sink in a temp tree containing no debugging/ directory; assert afterwards that neither the sink file nor debugging/logs/ was created."
  - name: test_the_declaration_reads_the_same_from_an_isolated_working_directory_and_from_the_project_root
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: seam
    surface_invoked: "the reader's production entry point, run as a subprocess twice with two different current directories"
    description: "Build the package into a temp project, add an isolated working directory to it, then read the declaration twice as separate processes — once with the current directory inside the isolated working directory and once at the project root. Assert the two paths are EQUAL, that both are absolute, and that neither lies underneath the isolated working directory. Two separate processes started in two different directories is the whole test: a single in-process read cannot distinguish a build-fixed absolute path from a relative name."
  - name: test_a_record_written_from_an_isolated_working_directory_is_still_there_after_it_is_removed
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: real_artifact
    description: "Append one record at the declared path from a process whose current directory is inside an isolated working directory; remove that working directory; then read the declared path from the project root and assert the record is present and byte-identical. Read the file after the removal, never before — a check that reads it first passes on the exact defect."
  - name: test_parity_check_blocks_a_relative_declared_value_and_a_directory_dependent_read
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Failure branch 3, the resolution discriminator, in two variants. Variant A: BOTH sides agree on a name and that name is a knowledge-only stream — so branches 1 and 2 are satisfied — but the declared value is relative; assert the check exits non-zero. Variant B: the declaration is read from two different current directories and yields two different paths; assert non-zero and that the message names both values and the directory each was read from. This is the branch that rejects a settlement made by editing one default string, and both variants must fail even though the other two branches are green."
  - name: test_two_units_of_work_emitting_at_once_lose_no_record_and_interleave_none
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "The shared-sink appending case. From two concurrent processes in the same install — one with its current directory inside an isolated working directory — append a known number of records each, then read the sink once both have finished. Assert the total line count equals the sum, that every line parses on its own, and that no line contains fragments of two records. Concurrency is now the ordinary case for this file, so a run of one writer proves nothing about it."
test_rationale: |
  The three failure branches are the whole AC, and each needs its own negative
  control run through the real entry point — a single positive-path test passes
  on a check that is defined and never executed, which is the shape this
  repository shipped in fast-lane-build.js. Branch 2's test is the one that
  cannot be satisfied by the first rejected settlement: it holds both sides in
  agreement and still requires a block, so an implementation that repoints the
  reader at agent_telemetry.jsonl goes red rather than green. Branch 3's test
  is the same trick one layer down and is the newer of the two: it holds both
  sides in agreement AND on a knowledge-only name, so branches 1 and 2 are both
  green, and still requires a block, so an implementation that settles the
  question by editing a default string while each process keeps resolving the
  name against its own directory goes red. Without branch 3 the AC is
  satisfiable by the change that reproduces the defect. The
  inspected-surface count in the first test exists because a resolver that
  finds zero emitting surfaces would otherwise report perfect agreement. The
  two-process, two-current-directory shape of the resolution tests is not
  incidental: resolution is a function of where a process starts, so a test
  that resolves twice inside one process from one directory cannot fail.
notes: |
  WHICH SETTLEMENT, AND WHY (BA decision, 2026-09-07). The criteria require the
  emitters to move onto a knowledge-only stream. The reader is not repointed at
  debugging/logs/agent_telemetry.jsonl. Four pieces of evidence, each checkable:

  1. The shared file is not a knowledge file. At 2026-09-07 it holds 33 lines:
     28 knowledge_captured records, 4 pre-drive writability probes with no
     `event` key (written by the probe this repository's own CLAUDE.md pre-drive
     checklist prescribes), and 1 line that is not JSON at all. A reader pointed
     at it inherits all three shapes forever.
  2. Another consumer owns it. ADR-011's backward-compatibility section names
     retrospective-agent and feedback-analyst as consumers of the operational
     stream, and INF-700b-3's capture-health report is a third. Those three
     named consumers are the whole of this point. An earlier version of it also
     cited INF-700c-2's it_requirements as making the file byte-immutable; that
     citation is withdrawn as of 2026-09-07 because INF-700c-2 is work_status
     done and its constraint was scoped to the duration of that AC, so it holds
     nothing in place now. The forward-looking invariant lives with
     INF-400c-4-iii, which requires the operational stream to be byte-identical
     across a run of the knowledge reader. Cite that, not the closed AC.
  3. Two lifecycles would share one file. A knowledge record is drained once and
     watermarked; an operational record is appended and aggregated forever.
     INF-400c-4-iii records why one file with a type discriminator was rejected.
  4. Reversing the direction would need an ADR amendment nobody has commissioned.
     ADR-011's Decision and ADR-034's "consequences that follow mechanically"
     both name the four emit sites as the thing that moves.

  WHAT THIS AC DOES NOT DECIDE. The retained 28 records are not migrated,
  copied, marked or deleted by this repoint. They stay in the operational stream
  and stay at rest by INF-700c-2's eligibility rule, which is sink-agnostic by
  construction. INF-400c-4-ii proposed carrying them across and is withdrawn;
  nothing here reopens it.

  COORDINATION. Two other ACs edit the same four emit surfaces. INF-700b-1 adds
  the `text` field to them, and INF-400c-5 replaces the hand-written JSON append
  with a validating emission helper. This AC constrains only which sink the
  append resolves to, and is satisfied whether the append is hand-written prose
  or a helper call, provided the path comes from the single declaration.

  THE ANCHOR, AND THE OPTION THAT WAS TRIED AND DROPPED (BA, 2026-09-07,
  recording the settled decision as evidence rather than as instruction).
  The build already receives the project root as an argument, in both install
  shapes, and it is unambiguous there in a way nothing computed later is. So
  the build fixes the sink to an absolute path and writes it into the
  configuration it deploys, and both sides read it from there.

  AN EARLIER FORM OF THIS DECISION ANCHORED ON THE REPOSITORY'S COMMON GIT
  DIRECTORY AND WAS DROPPED, and the reasons are worth keeping because they are
  the shape of failure to watch for in any replacement. First, "the repository"
  is ambiguous in a consumer install: the package subdirectory is a clone in
  its own right nested inside the consumer's, so the answer depended on where
  the asking process stood, and both answers looked plausible. Second, the
  common directory is reported as a RELATIVE name from a main checkout and an
  ABSOLUTE one from an isolated working directory — verified in both directions
  on 2026-09-07 — so the obvious implementation reproduced the original
  relative-path defect in exactly the layout a developer would test in, while
  working correctly in the layout they would not. Neither hazard can arise here
  because nothing walks up anything: the path is absolute before any process
  starts.

  WHAT IS BOUGHT AND WHAT IS PAID. Bought: no discovery, no ambiguity, one
  written-down answer both sides read. Paid: the path is a property of the
  BUILD rather than of the tree, so an install moved by hand, or a second build
  pointed somewhere else, changes it. INF-400c-4-v owns both consequences and
  the case that matters most here — a build pointed at an isolated working
  directory of an already-installed project.

  TWO CALL SITES DEFAULT TO A BARE RELATIVE NAME AND BOTH MUST STOP: the
  emit-side event script's log default, and the harvester's sink default. A
  change that edits one default string and leaves it relative satisfies
  branches 1 and 2 and reproduces the defect, which is why branch 3 exists and
  why it now blocks a non-absolute declared value outright.

  SUPERSEDED IT-PO DECISION — READ THIS BEFORE FOLLOWING THE it_requirements
  BELOW. The bullet placing the declaration in config/paths.json was decided
  before the anchor was settled and no longer fits: that file is a tracked,
  reviewed, PROJECT-RELATIVE paths SSOT, and what is declared here is an
  absolute path that differs per machine and per install and is produced by the
  build. The two cannot be the same artefact. The declaration is now the
  configuration the build deploys. The four properties that bullet argued from
  still hold and are still the right test for any alternative home; three of
  them (single SSOT, ships through the build so a consumer install sees the
  same value, readable without importing the reader) are satisfied by the
  deployed configuration, and the fourth — project-relative — is the one the
  decision deliberately gives up. The permitted-absent requirement moves with
  it: whatever existence checking applies to the deployed configuration must
  not require the sink FILE to exist, for the reason INF-400c-4-iv gives.

  ONE STREAM ANCHOR, NOT TWO. The operational stream sits beside the knowledge
  sink under the same excluded directory. Fixing only the knowledge sink at
  build time would leave the operational stream fragmenting into one file per
  working directory, which breaks aggregation for its three named consumers.
  INF-400c-4-iii carries that clause; it is named here so the two are not
  implemented against different anchors.

  CONCURRENCY IS SPLIT ACROSS TWO RECORDS, DELIBERATELY. A shared sink means
  simultaneous writers, and the two halves have different owners because they
  have different failure modes. The APPENDING half is here: appends must not
  lose, truncate or interleave records, which is a property of how the file is
  written. The ROUTING half is INF-700a-5-iii: two routing steps reading the
  same sink at once must not both route the same record onto two different
  branches, which is a property of the state beside the sink, not of the sink.
  Append-only writing is the easy half and is close to free; the state is where
  this breaks.
change_target: code
risk_surface: contract_boundary
