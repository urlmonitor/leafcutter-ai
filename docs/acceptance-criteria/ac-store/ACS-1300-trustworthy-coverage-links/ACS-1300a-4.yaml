notes: |
  SATISFIES ACS-1300a's documentation_triggers: [how-to]. One guide, for the one command
  a person deliberately runs.

  THE FIREWALL, STATED SO IT CANNOT BE USED AS A SHORTCUT: this AC's deliverable is the
  document and nothing else. No behavioural AC in this tree may be closed by pointing at
  the guide. A guide describing a preview that does not exist reads exactly like a guide
  describing one that does, which is the prose-presence proxy every other criterion here
  is written to avoid.

  THE GUIDE MUST SAY WHAT THE REPAIR DOES NOT DO — added 2026-09-01, and this is the
  single most important thing the doc author can get wrong. Restoring a coverage link does
  NOT change any record's mark-done eligibility and never did: verify_done_eligible reads
  the direct tag first and consults the coverage list only on the composite path, so 527 of
  549 rotted records were already eligible before the repair existed. An operator who runs
  this expecting work to become unblocked will conclude the tool is broken when nothing
  moves. The guide must state plainly that the repair fixes the record of what proves what,
  that this unblocks nothing, and that the separate population of records eligible-but-
  unmarked is cleared by a different sweep. The existing clause about the finished state
  never changing covers the mechanism; this covers the expectation, and the two fail
  differently.

  WHY THE CRITERION IS SHAPED AS A WALKTHROUGH RATHER THAN A CONTENTS LIST. "The guide
  mentions the preview flag" is satisfied by a sentence; "a reader following the guide
  produces the preview report and reads the four outcome classes off it" is satisfied
  only by a guide that is actually usable, and it fails when the tool's real output does
  not carry one of the four. That makes the doc AC a second, weak check on the report
  format — deliberately, because a report nobody can read is a report nobody uses.
