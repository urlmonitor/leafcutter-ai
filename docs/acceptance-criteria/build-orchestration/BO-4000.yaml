it_requirements:
  - "The workflow body decides the worktree outcome (reuse the resolved worktree, reject the resolution, or name a new location) from structured facts. The decision is never left to an agent's judgement, and the worktree-opening agent is given the exact location with no discretion over it."
  - "Whether a path is the top-level directory of a linked worktree, and whether it is the main checkout, is established from facts git reports about the repository, returned in a schema-validated result. It is never inferred from the path's spelling or folder name, and never taken on the resolver's word: RESOLVE_SCHEMA accepts any string (KI-BO-027)."
  - "Those repository facts come from a deterministic helper on the worktree-manager surface that queries the repository (see worktree-manager.md entry points), not from free-form agent prose. The real-artifact test can then exercise the same decision inputs against a temporary real repository without an LLM."
  - "The worktree base is derived from the repository's main checkout, found through git's shared common directory, using the existing layout resolution in agent_delivery_workflows.md section 9. It is never derived from the current directory's own top-level, which inside a linked worktree is that worktree (BO-4000c M1). No second base-derivation rule is introduced."
  - "The new location is <worktree base>/<target identity>. For an epic, the identity is its folder name, derived with BO-3900's separator-independent name rule. The same inputs name the same location on every run, with no suffix, counter, timestamp, random or session component."
  - "Checks that keep the location off the target folder, the dev-layout main checkout and every linked worktree use BO-3900's platform-independent containment, so they hold when the paths are spelled with different separators or letter case."
  - "Consumer-layout placement is out of scope (user decision Q1, 2026-09-14). The never-under-the-main-checkout rule applies to the dev layout only, and the consumer layout's <consumer_root>/worktrees convention (BO-1500e-2) is not changed."
  - "The run's worktree is assigned once, at the worktree step, and every later phase prompt is rooted in it."
  - "The real-artifact test works only on temporary repositories and leaves no worktree, branch or directory behind in the host repository."
  - "KI-BO-027 is not claimed closed: the resolver's own output is unchanged by this record, and only the workflow's handling of a bad resolution changes."
  - "Canonical sources are templates/workflows-js/build-feature.js and templates/scripts/setup_ticket_worktree.py (or whichever templates/scripts/ file the helper lands in). Deployed copies are regenerated by 'python scripts/build.py' and never hand-edited (ADR-001). The changed worktree-step agent call must remain an E2-valid call with a schema (ADR-030)."
delivers_to:
  agent: python-coder
  contract: "For BO-4000a, BO-4000b and BO-4000c. (1) The exact location string the workflow names to the worktree-opening agent: <worktree base>/<target identity>, spelled with BO-3900's output rule. (2) The run's worktree as a single assignment made at the worktree step. (3) Repository facts for a candidate path, as a schema-validated object: { path: string, exists: boolean, is_git_toplevel: boolean, is_linked_worktree: boolean, is_main_checkout: boolean, same_repository: boolean | null (null when the path is not a git checkout), branch: string | null (null when not a checkout or detached) }."
expects_from:
  ac_id: BO-3900
  contract: "BO-3900's platform-independent containment and equivalence (whole-segment boundary; separators and trailing separators ignored; case-insensitive for drive-lettered and UNC forms only), plus its separator-independent name derivation for the target identity."
test_required: true
test_spec:
  - name: test_run_inside_the_resolved_worktree_dispatches_no_worktree_creation
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Incident replay: with the resolver reporting uxp-700-tranche-2 as the target's worktree, no worktree-opening agent is dispatched and every phase prompt is rooted there."
  - name: test_resolved_path_that_is_not_a_worktree_top_level_is_not_reused
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: failure
    description: "A resolver reporting the epic folder, or the main checkout, as the worktree does not become the run's worktree."
  - name: test_new_worktree_location_is_named_by_the_workflow_and_is_a_child_of_the_base
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "The worktree-opening agent's prompt carries the exact location worktrees/EPIC-TruthfulProjectRecord, and two runs for the same target carry the same location."
  - name: test_new_worktree_location_is_never_under_the_target_or_any_checkout
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Across Windows- and POSIX-spelled layouts, the named location is never at or under the target folder, the dev-layout main checkout, or any linked worktree."
  - name: test_worktree_decision_on_a_real_repository_with_a_linked_worktree
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "Against a temporary real git repository with a linked worktree and a tracked epic folder, the reuse and named-location decisions match the scenarios, and no tracked file of either checkout is reported deleted afterwards."
  - name: test_worktree_placement_is_reachable_from_the_workflow_top_level_body
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: templates/workflows-js/build-feature.js
    description: "All scenarios are driven through _workflow_engine_harness.py running build-feature.js's own top-level body."
test_rationale: |
  The location was decided by an agent reading a prompt that left it open. Nothing in the
  workflow checked what came back. So a test of a location-computing helper proves nothing
  unless the workflow body really hands that location to the agent, and really declines to
  open a worktree when one was already resolved. Both are dispatch facts. They are visible
  only by running build-feature's own body through _workflow_engine_harness.py and reading
  which agents were dispatched with which prompts. The real-artifact entry exists because
  "top-level directory of a linked worktree" and "tracked content" are facts about a real
  git layout that string fixtures can only imitate. The incident's visible damage (46
  tracked ticket files shown as deleted) is a git-status fact.
