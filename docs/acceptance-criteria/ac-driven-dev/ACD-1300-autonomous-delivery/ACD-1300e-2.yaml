title: "A run that needs several decisions can be resumed through each of them in turn"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given a planning run R with no person attached that paused at its first decision point
    (decision D1) with a durable record naming D1, and whose remaining route contains a
    second decision point (decision D2, for example the final approval),
  When the route is started again for run R supplying the person's answer for D1,
  Then the D1 answer is applied to D1 and the run continues past it,
  And when the run reaches D2 with still no person attached it pauses again and the
    durable record for run R now names D2 (not D1),
  And the report from that resume says the run is waiting on D2,
  And when the route is started again for run R supplying the person's answer for D2,
    that answer is applied to D2 -- it is not refused as naming a different decision,
  And the criteria committed before D1 and between D1 and D2 are carried forward
    unchanged through both resumes,
  And after the run moves past D2 no waiting record for run R remains on disk,
  And the same holds for a run with three or more decision points: each resume that
    supplies the answer for the decision currently named in the record advances the
    run to its next decision point or to completion.
