it_requirements:
  - "TARGET FILE -- a NEW how-to at exactly docs/how-to/resume-a-paused-plan-feature-run.md. ACD-2100c-3 and ACD-2100c-3-i both link that exact path as planned, and ACD-2100c-3 carries a delivers_to contract naming this id and documentation-expert."
  - "NOTHING IN THIS REPOSITORY WILL CATCH A WRONG PATH -- check-doc-links IS NOT THE NET THE STORE NOTES ASSUME. check_doc_links validates DOC_LINKS declared in Python and SQL files only, and its own docstring states every failure is a warning and it always exits 0. No hook validates a markdown-to-markdown link at all. So the two inbound planned links and every outbound link this page carries are unguarded in both directions. Publishing at the exact path above is the entire defence."
  - "THE OUTBOUND LINK TO c3-006 MAY POINT AT A FILE THAT DOES NOT EXIST YET. ACD-2100e-1 authors docs/architecture/diagrams/c3-006-plan-feature-decision-gate-sequence.md and is NOT in this record's depends_on, so the sequencer may build this page first (KI-ACD-015: expects_from orders nothing). Combined with the previous requirement -- no hook validates a markdown link -- publishing first would ship a live page pointing at nothing, silently. Before publishing, either confirm the ordering edge has been added (recommended in the notes) or confirm the diagram exists; do not hard-link a file that is not there."
  - "TITLE AND OPENING MUST DISTINGUISH THIS PAGE FROM docs/how-to/approval-gate.md. That page already exists, is about the goal-to-epic readiness gate and its yes / review-all / cancel choices, is not resumable and is none of the five decision points -- and it declares components: [ac_driven_dev, build_orchestration], so it lands in the same component view and the same how-to index as this page. An operator searching for \"gate\" reaches it first. Name the route and the waiting-run situation in the title and in the first sentence, and link approval-gate.md once as explicitly not this gate. Neither page absorbs the other."
  - "FRONTMATTER components: MUST BE THE UNDERSCORE GRAPH ID ac_driven_dev -- NOT the kebab ac-driven-dev. check_doc_frontmatter validates every components entry against the keys of docs/components.json, which are the underscore ids. That declaration is the mechanically checkable half of the last Then clause. ACD-2100d-4's equivalent requirement states the kebab form; that wording is wrong and must not be copied. Follow the sibling how-tos for the rest of the block: type: how-to with a matching category: how-to, as docs/how-to/approval-gate.md does."
  - "docs/INDEX.md IS GENERATED. Register the page by running the build and committing the regenerated index -- do not hand-edit it. A hand-edited index is reverted by the next build."
  - "QUOTE THE INVOCATION AND EACH OF THE THREE OUTCOME REPORTS VERBATIM, never a paraphrase. The operator is matching a message on their screen against this page; a paraphrase they cannot match sends them away believing the page does not cover their case, which is the moment they escalate or re-run the route. Take every quoted string from the delivered behaviour of ACD-2100c-3 and ACD-2100c-3-i, not from an expectation."
  - "THE LISTING STEP AND THE RESUME STEP MUST BOTH WORK FROM THE PROJECT ROOT AND FROM A WORKTREE. ACD-2100a-4's contract is a waiting record whose location is a function of the project rather than of the caller's working directory. Do not publish a path or an invocation that only resolves from one of them -- a working-directory-dependent path is the exact defect family this L1 sits in, and a page that reproduces it would send an operator to look for a record that is findable only from where the run happened to start."
  - "DO NOT WRITE ANY OF THIS FROM KI-ACD-005's FIX DIRECTION. That known issue's stated root cause and stated fix are both out of date -- resolveGate already pauses on an unparseable answer and the observed loss came from a well-formed one -- so a procedure written from it would be wrong on the day it was published."
  - "LENGTH IS A REAL CONSTRAINT -- check_doc_length caps a non-ADR document at 300 lines and 25 sections. Link out to ADR-024 and to c3-006 for how a run came to be waiting rather than absorbing either; this page is a procedure with an outcome, not an explanation of the gate flow."
delivers_to: null
