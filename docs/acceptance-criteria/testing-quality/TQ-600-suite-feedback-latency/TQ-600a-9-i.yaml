estimated_complexity: M
it_requirements:
  - >-
    COPY-ON-WRITE, NOT SHARE-AND-HOPE. The cheap implementation is to share one
    directory and rely on the members being well behaved. Do not. A member that writes
    gets a copy of the finished artifact; the copy is cheap precisely because the build
    already happened.
  - >-
    THE DISCRIMINATION CHECK IS THE POINT OF THIS RECORD. One build plus four
    assertions is only worth the same as four builds plus four assertions if each
    assertion can still fail on its own. Prove it by breaking each subject in turn, not
    by reasoning about it.
  - >-
    ORDER INDEPENDENCE IS CHECKED BY RUNNING, NOT BY INSPECTION. Run the group
    forwards, run it reversed, and run each member alone. Three arrangements, same
    verdicts.
  - >-
    A MEMBER THAT WILL NOT GO RED IS A FINDING, NOT A PASS. If breaking a member's own
    subject leaves it green, the sharing has hollowed it out and the member must be
    restored to its own build rather than left in the group.
  - >-
    THE COPY IS A FILESYSTEM COPY OF A FINISHED TREE, AND ITS COST IS THE WHOLE REASON
    THIS IS WORTH DOING. A directed build measures about 13.3 s; a copy of the finished
    adopter tree is a fraction of that. If the copy approaches the build in cost — which
    is plausible for the self-hosting shapes, where the produced tree runs to roughly
    11,675 files against roughly 775 for a directed one, as recorded in
    scripts/suite_performance/README.md — then the group is not worth sharing and should
    be left alone. Measure the copy against the build in the same sitting before
    committing to a group, and report the ratio.
  - >-
    THE THREE ARRANGEMENTS MUST RUN IN THREE SEPARATE PROCESSES. Order independence is
    meaningless inside one process that has already memoised the artifact: a reversed
    run that reuses the forward run's cache is not a reversed run. Use
    `run_child_session()` at unit_tests/suite_performance/_test_helpers_tq_600a_5.py
    line 44, one child session per arrangement, and make each one produce its own
    preparation.
  - >-
    THE DISCRIMINATION RUNS MUST NOT SHARE A PREPARATION WITH EACH OTHER. Four runs that
    each break one subject are four separate child sessions. If they share one produced
    tree, run two inherits run one's breakage, more than one member goes red, and the
    descriptor fails for a reason that has nothing to do with the property under test —
    which reads as a real finding and will cost an afternoon.
