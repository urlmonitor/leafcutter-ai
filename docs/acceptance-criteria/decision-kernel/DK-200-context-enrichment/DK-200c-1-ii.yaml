id: DK-200c-1-ii
title: "An unreadable source is distinguished from a successfully searched empty source"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: draft
req_status: draft
priority: high
work_status: done
criteria: |
  Given an allowed source cannot be read,
  When initial enrichment attempts to consult it,
  Then the result reports the unavailable source and its limitation,
  And the failure is not represented as a successful search with no matches.
depends_on: [DK-200c-1]
covered_by:
  - "tests/kernel/enrichment/test_context_enrichment.py::TestContextEnrichmentBoundaries::test_failed_source_is_reported_as_unavailable_not_as_a_successful_empty_search"
implemented_by:
  - "kernel/enrichment_sources.py"
  - "kernel/context_enrichment.py"
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Read failures must remain explicit unavailable or partial context with their source limitation, rather than successful empty search results."
  - "An unreadable source must not trigger a broader read permission or an invented evidence result."
delivers_to: null
expects_from: null
test_required: true
test_spec:
  - name: test_failed_source_is_reported_as_unavailable_not_as_a_successful_empty_search
    target_dir: tests/kernel/enrichment/
    framework: pytest
    type: unit
    angle: failure
    description: "An actual search boundary PermissionError produces unavailable context, zero examined files/evidence and the failure reason in limitations."
test_rationale: "A deliberate I/O failure proves failure classification; a missing keyword in a readable source would exercise a different branch."
