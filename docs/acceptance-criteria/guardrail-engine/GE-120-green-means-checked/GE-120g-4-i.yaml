it_requirements:
  - "CANONICAL SOURCE, ADR-001. Edit templates/scripts/commit_guardian/check_negative_control_liveness.py (and, only if the helper is placed there, templates/scripts/commit_guardian/_negative_control_pairing.py). scripts/commit_guardian/ and .leafcutter/ are build.py outputs; never edit them."
  - "ONE PURE 'SAME VERDICT' COMPARISON, implementing the criterion's definition exactly and nothing else: stored and new `state` equal; `evidence` lists of equal length; for every position, equal `command` and equal `exit_code`. `output` and `observed` are never compared. A stored `currently` that is absent, not a dict, or whose `evidence` is not a list compares as NOT the same verdict (it is then replaced, as today) -- the helper must not raise on such a record."
  - "BLOCKED RECORDS, DECIDED: an evidence entry's `exit_code` is compared as present-or-absent. Absent on both sides is EQUAL (a `blocked` record re-observed with the same commands and the same missing exit code(s) is the same verdict and is kept); absent on one side and present on the other is a CHANGE. This covers every blocked shape `_examine` builds: `_blocked()` (one entry, no exit_code), `ncp.blocked_pair_currently()` for the declaration-level cannot-discriminate case (one entry, no exit_code, acceptable command folded into `output`), `ncp.no_entry_disposition()` (same shape), and the failed-second-invocation case (entry 0 with exit_code, entry 1 without). The schema (config/verification_flow.schema.json $defs/currently.evidence) makes exit_code optional, so absent is a legitimate value, not an error."
  - "KNOWN CONSEQUENCE, accepted by the criterion's definition: in the declaration-level cannot-discriminate blocked record the acceptable command lives only in `output`, so changing ONLY the declared acceptable command of a still-non-discriminating pair does not count as a change. Do not widen the comparison to cover it -- that would contradict 'output text is NOT part of the verdict'. Record it in the DECISION HISTORY entry."
  - "KEEP THE STORED BLOCK BY NOT ASSIGNING. In `_build_records`' examined branch, assign `negative_control['currently'] = currently` only when the new `currently` is NOT the same verdict as the stored one. When it is the same, leave the stored dict object untouched (do not copy fields across, do not refresh `observed`, do not replace evidence), so `main()`'s existing `data != before_sweep` deepcopy comparison sees no change and does not call `_write_manifest`. `_examine` itself still runs both subprocesses every time; only the assignment is conditional."
  - "THE `_unverified` PATH IS UNCHANGED. It is reached only when the hook is excluded by `--check-id` AND has no stored `currently`, so there is never a stored verdict to compare against and it writes, as today. The excluded-with-record branch is also unchanged (already writes nothing)."
  - "DO NOT CHANGE `main()`'s WRITE DECISION OR THE RENDERING. GE-120g-4's data-not-rendering comparison (`copy.deepcopy` snapshot before `_build_records`, write only when `data != before_sweep`) and `_write_manifest`'s `ensure_ascii=False` stay exactly as they are; this record changes only what `_build_records` puts into `data`."
  - "PRINTED LINES AND EXIT CODE UNCHANGED. `_build_records` reads the record's `state` from `negative_control['currently']['state']` after the (now conditional) assignment; that equals the newly observed state in both branches (kept only when states are equal), so `_format_result_line` output and `_exit_code_for` are unaffected. `demonstration`, `discrimination` and `entry_point` keep coming from this run's `_examine` result, never from the stored block."
  - "ERROR-HANDLING POLICY (CLAUDE.md Rule 4): the comparison helper is pure -- no try/except, no logging inside it. Existing OSError/JSONDecodeError handling on load/write and the subprocess wrapping in `_run_negative_control_command` stay as they are."
  - "FILE SIZE: the liveness module has historically sat near its 400-counted-line limit (DECISION HISTORY entries for GE-120f-1-ii/-i). If the helper does not fit, place it in `_negative_control_pairing.py` (the established split precedent; deployed wholesale with the commit_guardian tree, no deploy-map change) and call it as `ncp.<name>`. Do not compress existing code to make room."
  - "ADD A DECISION HISTORY ENTRY to the module docstring of every file touched, dated, tagged GE-120g-4-i: the calendar-driven rewrite measured on 2026-10-12; the 'same verdict' definition; `observed` now meaning first-observed; the blocked missing-exit_code decision; the acceptable-command-in-output consequence above."
  - "NO TEMPLATE CONFIG CHANGE. templates/scripts/commit_guardian/commit_guardian.json already stores `observed: 2026-10-12` on check-lint-gate's `currently`, which under the new meaning is its first-observed date. Its stored evidence `command` fields are written in deployed-resolved form (`python .leafcutter/scripts/...`), matching what `_examine` records from the resolved declaration in a built layout -- spot-check that by running the deployed check twice against a freshly built layout's manifest with the stored date backdated, and confirming the file is untouched."
test_spec:
  - name: test_same_verdict_on_a_later_day_leaves_manifest_bytes_identical
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Fixture (shared by every test in test_ge_120g_4_i.py): a temp dir holding probe.py, outcomes.json and commit_guardian.json. probe.py takes one arg (`bad` or `accept`), reads outcomes.json from cwd, prints that role's `text` and exits with that role's `exit`; commands stay textually constant so only outcomes.json varies between runs. The manifest has one hook: id `probe-hook`, entry `<py> probe.py`, command `<py> probe.py accept`, negative_control.command `<py> probe.py bad` (`<py>` = shlex.quote(sys.executable), so identity resolves to `probe` on both sides -> demonstration=entry_point). It is serialised with indent=4 (NOT json.dumps(indent=2)), so ANY rewrite changes the bytes. The stored currently is state passing, observed 2026-10-11 (a fixed past date -- no clock mocking), evidence [bad cmd/exit 1/text X, accept cmd/exit 0/text Y]. Run the check as a subprocess with cwd=tmp dir and --manifest <tmp>/commit_guardian.json; outcomes bad exit 1 text X, accept exit 0 text Y. Assert sha256 of the manifest bytes unchanged. RED today: the fresh record is stamped with today's date, so data != snapshot and the file is rewritten."
  - name: test_reworded_output_with_same_exit_codes_keeps_stored_record
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Same fixture; outcomes.json changes the bad probe's text to a different wording, exit codes unchanged (1 / 0). Assert bytes unchanged AND, parsed, the stored record still has observed 2026-10-11 and the OLD output text X. RED today (rewritten with today's date and the new text)."
  - name: test_passing_to_failing_is_recorded_with_new_date_and_evidence
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Same fixture; outcomes.json makes the bad probe exit 0 (new text Z). Assert the parsed record reads state failing, observed == date.today().isoformat(), evidence == this run's [bad cmd/exit 0/text Z, accept cmd/exit 0/text Y], and the file bytes differ from before. GREEN ON ARRIVAL (current code always rewrites); it is the regression guard against the cheapest fix -- never writing -- which the notes name."
  - name: test_every_direction_of_state_change_is_recorded
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "subTest per row of the direction table: (passing->failing), (failing->passing), (unverified->passing), (unverified->failing). Each row seeds the stored record in the stored state (unverified seeded in the shape `_unverified` builds: one entry, no exit_code) with observed 2026-10-11, sets outcomes.json to produce the newly observed state, runs the check, and asserts stored state == new state, observed == date.today().isoformat(), evidence == this run's. GREEN ON ARRIVAL for the same reason as the previous test; guards against a fix that keeps the stored record too eagerly."
  - name: test_same_state_different_exit_code_is_recorded
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Stored record state failing, observed 2026-10-11, known-clean (accept) evidence exit_code 1 with bad exit 1 (refuses_without_discriminating). Run with accept exit 2, bad exit 1 -- state still failing. Assert evidence carries exit_code 2 for the accept entry and observed == date.today().isoformat(). GREEN ON ARRIVAL; guards against a comparison that looks only at `state`."
  - name: test_blocked_record_reobserved_unchanged_is_kept
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Hook with NO acceptable `command` (declaration-level cannot-discriminate: blocked, no subprocess run). Stored record is the blocked shape the check itself produces (one evidence entry: the negative_control command, an output string, no exit_code) with observed 2026-10-11 and DIFFERENT output text from what this run produces. Assert manifest bytes unchanged. RED today. Pins the decision that a missing exit_code on both sides is equal."
  - name: test_printed_lines_and_exit_code_match_the_observed_verdict
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Scope fence. For the same-verdict fixture assert exit 0 and stdout is exactly one line `NEGATIVE_CONTROL_RESULT check_id=probe-hook state=passing entry_point=probe demonstration=entry_point discrimination=discriminates command=<negative_control.command>`; for the passing->failing fixture assert exit 1 and the same line with state=failing discrimination=n/a. GREEN ON ARRIVAL -- these are what current code prints; the test catches a fix that alters output or exit code on the way past."
test_rationale: |
  The first, second and sixth arms are the ones red today, and together they are
  the criterion: the same verdict seen on a later day, with or without reworded
  output, and in the blocked shape whose evidence has no exit code, must leave the
  file alone. They assert on a byte digest of a manifest deliberately serialised
  with indent=4, so a fix that still rewrites (even with identical data) cannot pass.

  The third, fourth and fifth arms are green on arrival and exist because the
  cheapest way to satisfy the red arms is to stop writing altogether, or to compare
  only `state`. GE-120g-4's own rationale named that hole ("a test that forces a
  real update would"); these are those tests. A green-on-arrival arm is not
  evidence the fix landed; it is the fence that keeps the fix honest.

  The fixture controls probe outcomes through outcomes.json in the run's cwd rather
  than through the command text, because the definition counts a changed command
  as a change: varying the command to vary the result would test the wrong rule.
  Dates are controlled by a stored past `observed`; "today" is asserted against
  date.today(), so no clock mocking is needed.

  The seventh arm is the scope fence, green on arrival.
