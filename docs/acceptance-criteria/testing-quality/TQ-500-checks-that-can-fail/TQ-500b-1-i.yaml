id: TQ-500b-1-i
components:
  - testing_quality
  - build_pipeline
title: "No record and a bad record are different states, and the carve-out is not a blanket silence"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given four pieces of finished work:
      piece D, handed on before the falsifiability answer existed anywhere, whose
        hand-off record carries no machine-checkable answers of any kind,
      piece E, whose run stopped before the work was handed on, leaving no hand-off
        record for it,
      piece F, whose record carries a reasoned negative answer,
      and piece G, whose record carries the other machine-checkable answers the run
        requires but no falsifiability answer,
  When those records are read,
  Then none of D, E or F is reported as a shortfall,
    And D and E are each placed in the no-record state rather than the answer-owed
      state,
    And F is placed in the answer-taken state, because a reasoned negative is an
      answer,
    And G is reported as answer owed and absent,
    And the fourth result is what shows the carve-out for D and E is a boundary
      rather than a blanket silence: the same reading, over the same run, still
      reports a piece of work whose record exists and omits the answer.
depends_on:
  - TQ-500b-1
doc_links:
