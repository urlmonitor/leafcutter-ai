notes: |
  Boundary for anyone decomposing this L1 (recorded 2026-08-18):

  IN scope — the fast lane. Exactly one review agent is permitted in it, and its
  verdict is a delivery veto only. The property to specify is directional, not
  positional: removing the reviewer must never turn a not-done AC into a done one,
  and no LLM verdict may be the reason an AC reaches done. Today's wiring already
  satisfies this, and the ordering it uses (review at Phase 4.5, mark_done at
  Phase 5) is the CORRECT one and must not be inverted — marking ACs done before
  the review would leave a veto-blocked run with ACs recorded done and nothing
  committed, which is precisely the phantom-done shape BO-2500 exists to prevent.

  OUT of scope — BO-2500d-2, which covers the heavy pipeline. The heavy pipeline
  retains its review, validator, and fulfillment-gate agents unchanged. Nothing in
  this amendment touches it.
