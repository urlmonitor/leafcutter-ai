notes: |
  "Never silently treated as buildable" (user brief). The ticket generator today falls
  back to one descriptor per Then clause when test_spec is null (ac-schema.md, test_spec
  row). For a record with test intent that fallback is exactly the silent path, so clause
  3 forbids it. Named alteration: remove the intent exclusion from the fallback -> clause
  3 goes red while b-2 stays green.
