criteria: |
  Given the criteria mining (DK-500a-1), approval and staging in a kernel run (DK-500c-1), publish (DK-500c-2) and merge, split and retire (DK-500c-3) exist,
  When a person who has never built the library follows the how-to guide,
  Then the guide takes them, in this order, through running the mining, reviewing candidates and grouping suggestions in a kernel run, accepting, changing or rejecting each one, publishing the staged records and reviewing the change, and merging, splitting or retiring a published category,
  And each step names the action the person takes and the result they check before the next step,
  And the guide states that the mining never approves anything, that only published categories are offered to decisions, and that published decision records are never edited,
  And the guide lists what the person sees when the run history could not be read during mining.
