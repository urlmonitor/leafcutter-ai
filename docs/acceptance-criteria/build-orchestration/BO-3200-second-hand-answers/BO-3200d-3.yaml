notes: |
  Satisfies the sequence-diagram entry in BO-3200d's documentation_triggers.

  Drawing the reply and the result as two separate arrows is the correction. The arrangement
  this replaces had one arrow doing both jobs, and every diagram of it looked correct at any
  size — the failure only appears when the payload is large, which is exactly the case nobody
  draws. Showing the reply explicitly as carrying no content records the decision where the next
  author will see it before re-merging the two.

  The second scenario checks the diagram against a run at the real size, so a diagram drawn
  against a small-payload run cannot pass.

  IT-PO ENRICHMENT NOTE (2026-08-26). One addition follows from BO-3200d-2's settled decision:
  the diagram must show the handover location originating from the CONSUMER'S side. A drawing in
  which the producer chooses the location and returns it depicts the arrangement that was
  explicitly rejected, and this is the diagram a future author consults before designing the next
  handover — so it would be re-implemented from the picture.
