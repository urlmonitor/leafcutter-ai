criteria: |
  Given a requirement whose parent-pointer field holds the UID 999, and no
    requirement with UID 999 exists in the store,
  When the store is validated for hierarchy integrity,
  Then the validation reports the requirement as having an orphaned parent
    pointer,
  And the report names the offending requirement and the missing UID 999,
  And a root requirement (one with no parent pointer set) is NOT reported as
    orphaned.
