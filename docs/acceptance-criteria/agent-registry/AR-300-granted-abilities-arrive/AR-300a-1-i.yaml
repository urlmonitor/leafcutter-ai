notes: |
  WHY THIS IS NOT PARANOIA. The defect this whole tree exists for is a correct
  computation whose result reached nobody while the build reported success. The
  repair is a check, and a check is the same class of artifact: this repository
  shipped one whose directory argument matched nothing, printed a success line
  and exited 0 for eight days (KI-ACS-001), and a marker-registration setting
  that had no effect for as long as the file existed. A rule that resolves to
  nothing passes forever.

  THE PARTIAL CASE IS THE LESS OBVIOUS HALF. Zero is easy to notice. A
  comparison that reached 6 of 60 compiled prompts because the rest were read
  from a stale location also reports clean, and looks like a working check.
