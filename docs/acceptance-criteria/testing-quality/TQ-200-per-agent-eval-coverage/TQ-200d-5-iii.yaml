delivers_to: null
expects_from:
  ac_id: TQ-200d-5-i
  contract: >-
    A launch failure distinguishable from every post-start failure by its error class, with the message
    'agent CLI could not be launched: <ExceptionType>: <str(exc)>', which the stop message repeats.
test_required: true
package_surface: false
declared_files:
