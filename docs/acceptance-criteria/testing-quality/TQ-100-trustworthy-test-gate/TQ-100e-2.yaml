criteria: |
  Given the three-stage rollout behavior defined by TQ-100e-1 and its edge cases,
  When a reference document is authored for the enforcement rollout,
  Then it lists each enforcement mode (report-only, exclude-unbuilt, blocking)
    and states precisely what each one does to the run outcome
  And it documents the controlling configuration (how to set the mode, the valid
    values, and the no-config safe default of report-only)
  And a maintainer promoting enforcement can consult it to know exactly which
    configuration value selects which stage and what changes when they switch.
