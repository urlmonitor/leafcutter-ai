id: BO-2400f-7-vi
components:
  - build_orchestration
title: "Every command step the lane asks for states its time budget, and the store-wide steps are given at least 600 seconds"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run driven through every command step it has, from resolve to opening
    the pull request,
  And a second run that halts after its claim and asks for a release,
  When each command-step request either run sends is read,
  Then every request states a time budget in seconds,
  And the requests for resolve, producibility, claim, release and marking acceptance
    criteria done — the steps that read the whole acceptance-criteria store — each state a
    budget of no less than 600 seconds,
  And no command-step request leaves its budget to the runner's or the shell's default.

  Given a command step is added to the lane after this record,
  When the run sends its request,
  Then that request states a time budget as well.
