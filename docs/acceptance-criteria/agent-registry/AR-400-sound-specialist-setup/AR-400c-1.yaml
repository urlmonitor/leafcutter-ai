created_by: docs/acceptance-criteria/agent-registry/AR-400-sound-specialist-setup/AR-400c.yaml
amended_by: []
superseded_by: null
covered_by:
  - AR-400c-1-i
implemented_by:
  - scripts/registry_validator.py
  - config/agent_registry.schema.json
notes: |
  REMOVED, NOT QUIETED (AR-400c: "A message nobody acts on is the defect, however
  quietly it is printed"). The second clause guards against the over-correction:
  removing the message must not be implemented by removing the grant.

  THE ELEVEN LINES THIS REMOVES (rebuild log 2026-10-12, lines 306-307, 313-317,
  321-324): find-structural-smells, find-design-smells, workflow-architect x4,
  adr-author/doc-enforcer, llm-expert x2, product-owner x2. Two of them --
  adr-author/doc-enforcer and product-owner/signoff -- happen to be real dead
  grants; that fault is AR-400c-2's, found by the user, not by this message.

  The old two-direction warning check is deleted in the same change (design
  PR-2); the third clause is the observable proof.
