  - "Verify the fresh worktree reads cleanly (no cache-tree error) as the success condition."
  - "PORTABLE SURFACE: this fresh-worktree fallback lives in the same standalone recovery script (templates/scripts/git_recovery.py) pinned in BO-1600d-1/BO-1600d-4; ADR-001 deployed/template parity applies."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
