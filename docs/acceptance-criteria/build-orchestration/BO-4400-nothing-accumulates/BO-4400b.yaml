notes: |
  Gap G2. Known side artifacts that today outlive the workspace folder (BA to turn into
  a declared, tested inventory -- one list, so a new artifact cannot be forgotten):
  - ac_store_index_cache.json under the git-dir
    (templates/scripts/commit_guardian/_ac_store_index_disk.py)
  - Poetry virtualenvs in ~/.cache/pypoetry/virtualenvs
  - Turbopack .next/dev/cache
  - the workspace's branch (local) and its registration
  Must still respect BO-4300e: nothing is removed while the workspace holds unsent work,
  and a branch whose commits never reached the shared project is never deleted.
  reference-doc: the inventory of what a workspace creates outside itself, and how each
  is reclaimed.
