it_requirements:
  - "NO CARRY-OVER: no state left by an earlier commit may influence this commit's verdict. That covers the commit-message file in the git directory, the previous commit's message, and anything cached by an earlier hook run."
  - "TEST EVIDENCE (binding): git itself produces the stale COMMIT_EDITMSG, through a real successful first commit. One arm makes that commit with inline -m, the other through the shared commit step with a message file. Writing that file by hand is not evidence (FP-7). The precondition in the criteria (the file now holds the token) is asserted after the first commit, so the test cannot pass vacuously on a git version or route that leaves no such file behind."
  - "Both commits of each arm run in one scratch repository with the hook installed, so the second commit really follows the first. Expected test home: unit_tests/commit_guardian/, reusing GE-123e-1's harness."
  - "CONFIDENCE LABEL: the silent skip stays DERIVED. It follows from the directly observed stale file but has not been seen as a wrong outcome. Tickets, changelogs and the KI closure must not upgrade it."
  - "CANONICAL SOURCE: templates/scripts/commit_guardian/check_feedback_id.py (ADR-001). The deployed copies are build outputs."
test_intent:
  - clause: the second commit is refused and the branch tip stays at the first commit
    needs_test: true
    reason: The clause appears in two scenarios, the inline route and the shared commit step's message-file route, and each carry-over path needs its own proof because the stale file must come from a real prior commit on that route, not from a file the test wrote.
  - clause: no output of the second attempt says that the check was skipped
    needs_test: true
    reason: A silent skip honoured from the previous message is exactly the hole, and the skip line is its only trace.
  - clause: the second commit succeeds, Because a check that refuses whenever the previous message carried the token passes the two refusal arms while still reading the wrong commit's message
    needs_test: true
    reason: This negative control fails a check that still reads the previous message and refuses on the token.
test_spec:
  - name: test_ge_123e_2_i_second_commit_refused_after_token_commit
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "Two real commits in ONE scratch repo with the hook installed, per route. Route A: first commit inline -m Tidy notes [NO-FEEDBACK-CHECK] editing ticket prose only; second inline Add python-coder sign-off appending the id-less heading. Route B: both through commit_changes.py with message files (token in the first file's body line). After the first commit assert the COMMIT_EDITMSG file git wrote in the git directory holds the token (precondition, so the test cannot pass vacuously). The second commit is refused and HEAD stays at the first commit. RED today (derived): the stale file is read and the check is skipped."
    proves_clause: 'the second commit is refused and the branch tip stays at the first commit'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
  - name: test_ge_123e_2_i_second_attempt_never_says_skipped
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: "On both routes the second attempt output (stdout plus stderr, shared-step route from hook_output) contains neither the word skipped nor the phrase escape hatch. The stale file is produced by git's own first commit, never written by the test."
    proves_clause: 'no output of the second attempt says that the check was skipped'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
    must_catch:
      - the check still reads the previous commit's message from the git directory and skips silently
      - the check reads the previous message and refuses but prints the skip line
  - name: test_ge_123e_2_i_second_commit_with_id_succeeds_after_token_commit
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: "After either first commit, the second commit appends the heading followed by feedback-id: fb_2026-11-16_a1b2c3d4 and succeeds, with HEAD advancing by one. Fails a check that refuses whenever the previous message carried the token."
    proves_clause: 'the second commit succeeds, Because a check that refuses whenever the previous message carried the token passes the two refusal arms while still reading the wrong commit''s message'
    code_file: templates/scripts/commit_guardian/check_feedback_id.py
    must_catch:
      - a check that refuses whenever the previous commit's message held the token
      - a check that skips when the previous commit's message held the token
  - name: test_ge_123e_2_i_shared_step_two_commit_sequence_is_reachable
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: reachability
    description: "Run commit_changes.py as a subprocess twice in one scratch repo (first answer committed, second answer hook_failed with HEAD still at the first sha)."
    proves_clause: 'the second commit is refused and the branch tip stays at the first commit'
    code_file: templates/scripts/commit_changes.py
