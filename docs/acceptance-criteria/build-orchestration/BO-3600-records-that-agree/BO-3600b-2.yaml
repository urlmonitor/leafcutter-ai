notes: |
  THE FORGOTTEN DIRECTION, and the one with a measured cost: a week of a build lane
  repeatedly selecting work that had already shipped. A tree that only demoted false
  finished claims would make the store more pessimistic rather than more true and
  would leave this waste untouched.

  The second scenario is deliberately "shown alongside", not "blocked". Blocking
  would make an undecided conflict able to stop work entirely, which is how a
  detector gets switched off. Showing it makes the waste impossible to repeat
  unknowingly, which is what BO-2400e-4 actually cost.

  The third and fourth scenarios are the controls: ordinary unfinished work is
  untouched, and the annotation disappears when the disagreement is resolved rather
  than persisting as decoration.

  The verdict that resolves the conflict belongs to BO-3600d; this record only
  requires that the conflict travels with the work while it stands.
