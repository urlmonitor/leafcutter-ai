notes: |
  WHY THIS RECORD EXISTS (user decision, BrainCandy, 2026-09-17). TQ-200c was amended so
  that a proof's kind follows how its pass is decided, not whether a model is involved.
  The collision it resolved was BO-3200f-2-ii: the executor's live scenarios ask whether
  its charter gets a command carried out, and each passes or fails on one definite check
  of the real reply. Under the old wording a router could reasonably send that work to
  the eval harness only. This L3 makes the corrected routing testable.

  WHY AN L3 AND NOT A CLAUSE OF TQ-200c-2-i. TQ-200c is at 5 of 5 L2s. TQ-200c-2-i is
  about OVER-DEMAND (work needing one kind is not made to carry the other); this record
  is about CLASSIFICATION (which kind charter work proved on a real reply is). The two
  fail independently: a router can avoid over-demand and still classify this work as
  judged-only.

  WHY "NOT JUDGED PROOF ALONE" AND NOT "NEVER JUDGED". Charter work can need both: one
  definite check that the agent carried out a command in one case, and a score for how
  reliably it does so across many. TQ-200c-3 allows both at once. What this record
  forbids is replacing the definite check with a score. The second scenario is the
  negative control so an implementer cannot satisfy the first by routing all charter
  work to asserted only.

  BOUNDARY. This record decides what is ASKED FOR. Running an asserted proof against the
  real agent is TQ-600a's. No proof kind, angle or schema value named live_dispatch may
  be introduced (BO-2900g-3).

  ASSUMPTION. The router can tell "one definite check on the real reply" from "a score
  across many examples" from what the work says about itself (TQ-200c-2's derivation
  rule). If it cannot, that is a gap in TQ-200c-2's self-description signals, to be
  raised by the IT PO, not solved by a per-AC routing field (which TQ-200c-2 forbids).
