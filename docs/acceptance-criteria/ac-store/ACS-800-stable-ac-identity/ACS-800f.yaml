notes: |
  Prompt / skill-body / agent-template surface (llm-expert per the IT-PO
  agent-assignment-by-surface convention: text that tells an agent or skill what to
  DO/SAY is template/skill work, not python-coder). Templates/skills that today
  describe the OLD id-derivation mechanic and would silently contradict reality once
  ACS-800 lands:
    - the ac-tree-split skill (templates/skills/ac-tree-split/SKILL.md) — today frames
      a "move" as a rename + reference cascade and leans on horizontal/intermediate
      splits; must be updated to describe a re-parent as a single metadata change, and
      to note that the routine manual tree-split it documents is no longer the primary
      remedy for saturation.
    - product-owner and business-analyst agent templates — the parent-derivation /
      "id encodes position" guidance and the parent covered_by update protocol that
      references derive_parent_id() id-string logic.
    - docs/reference/ac-schema.md prose (the ID Format / Parent Derivation sections).
  This L1 also captures retiring references to child_limit_override as a stopgap once
  ACS-800 has landed.
