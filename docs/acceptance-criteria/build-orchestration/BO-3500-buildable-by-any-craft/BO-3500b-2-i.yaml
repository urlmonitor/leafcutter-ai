  - name: test_claims_released_when_the_run_dies_between_phases
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "Force an abrupt termination between two members' phases and assert every claim is released — the crash path, not the clean-failure path."
  - name: test_retry_after_the_failure_succeeds
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: seam
    description: "THE LOAD-BEARING TEST. In one test, run and fail, then run again with the craft un-stubbed; assert the second run resolves the same group and reaches a successful ending. A run that tidies but blocks the retry fails only here."
