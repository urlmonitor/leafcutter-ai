notes: |
  ABSENT EVIDENCE IS NOT SUCCESS — the second case is the one that matters and the
  one a naive re-plan gets wrong: re-reading state and finding no record for A is
  indistinguishable, to a loose implementation, from finding A complete. Making
  eligibility require an affirmative successful outcome is what stops the widened
  loop from becoming a way to build work whose prerequisites failed.

  This is an eligibility rule, not a reporting rule. What the run SAYS about the
  withheld work at the end is BO-300d.
change_target: pipeline
risk_surface: internal
