    type: behavioral
    description: "Generate a ticket from a docs-only AC that declares no durable side-effect; assert user-surface-smoker is NOT forced into the agents map, while a side-effect-declaring AC in the same run still routes to it (proving the narrowing does not weaken the mandatory case)."
