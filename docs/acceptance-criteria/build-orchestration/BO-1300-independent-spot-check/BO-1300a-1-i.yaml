title: "Spot-check command with no resolvable target is rejected before dispatch"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-independent-spot-check/BO-1300a.yaml"
criteria: |
  Given the user invokes the standalone spot-check command without naming any target,
    or names a target that does not resolve to a finished feature (for example an epic
    folder that does not exist, or a branch with no merged changes)
  When the command attempts to resolve the review scope
  Then the command stops before dispatching any reviewer agent
  And it reports that the target could not be resolved and names what it expected
    (a finished feature, epic folder, branch, or changed-file set)
  And no spot-check reviewer agents are dispatched
