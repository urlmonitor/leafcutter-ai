amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
change_target: pipeline
risk_surface: internal
notes: |
  Motivating case: /plan-feature authored PO ACs (an early stage) then hit the PO
  gate; resuming must not discard or redo the already-committed PO stage.
