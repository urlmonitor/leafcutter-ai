id: BO-1900a-4
components:
  - build_orchestration
title: "Resolving an epic target says the isolated working copy is not yet determined, never a stand-in location"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a request to drive an epic, identified only by where that epic's work is kept
    in the work store,
  When the target is resolved, before any isolated working copy has been created or
    chosen for the drive,
  Then the resolved target states that the isolated working copy is not yet
    determined,
    And it does not carry the epic's own work-store folder, nor any other existing
      location, in place of that working copy,
    And a consumer reading the resolved target can tell not-yet-determined apart from
      a real location, without comparing it against the epic's work-store folder to
      discover that the two are the same,
    And once a later step establishes the isolated working copy, the resolved target
      carries that location and no longer reads as undetermined,
  So no later step can send a phase agent to work in the shared clone while believing
    it is working in the epic's own copy.
depends_on:
  - BO-1900a
