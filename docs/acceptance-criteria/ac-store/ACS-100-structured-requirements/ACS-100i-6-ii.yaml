title: "How a record spells its component no longer changes whether the spec obligation applies"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given two records that are byte-identical except that one carries
    `component: build_pipeline` and the other carries `component: build-pipeline`,
    both assigned to `python-coder`, and neither carrying `package_surface: true`,
  When the AC-record validator evaluates both,
  Then both are accepted, and the two verdicts are identical.

  And given the same pair, both now carrying `package_surface: true` and both
    supplying implementation requirements as a list of strings,
  When both are validated,
  Then both are refused, and the two refusal messages are identical apart from
    the file path.

  And given a record carrying `package_surface: true` whose `component` is a
    namespace unrelated to the build — for example `ac-store` — and whose
    implementation requirements are a list of strings,
  When it is validated,
  Then it is refused: the obligation follows the declaration into any namespace,
    because a package surface can be registered from any component.
