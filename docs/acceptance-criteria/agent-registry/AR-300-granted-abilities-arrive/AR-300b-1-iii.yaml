id: AR-300b-1-iii
title: "Once the sub-agent section is delivered, a compiled prompt missing it fails the build through the same gate as a missing abilities section"
component: agent-registry
components:
  - template_compiler
  - build_pipeline
  - agent_registry
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a tree on which sub-agent permissions are delivered,
    And an agent whose declaration permits at least one sub-agent, whose
      compiled prompt in one platform lacks the section naming them, while its
      declaration and the central record are both correct,
  When the build finishes,
  Then the build reports failure, naming that agent, the sub-agent preparation
    and the platform,
    And that failure comes from the same check that reports a missing abilities
      section, with no check written for the sub-agent section alone,
    And a build in which every permitted agent's compiled prompt carries its
      sub-agent section reports no failure for that preparation, while still
      counting it among the preparations examined,
    And an agent permitted no sub-agents is not reported for lacking the
      section,
  So the second dead preparation measured when this goal was framed is guarded
    from the moment it is repaired, not merely counted as broken until then.
depends_on:
  - AR-300b-1
