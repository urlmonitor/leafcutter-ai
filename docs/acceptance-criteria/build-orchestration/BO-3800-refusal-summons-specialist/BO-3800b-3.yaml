notes: |
  REVISED 2026-10-09 ON BRAINCANDY'S DECISION: complexity and file size share ONE craft,
  the restructuring specialist, which applies complexity-reduction for a complexity
  demand. An earlier draft of this record named python-coder as complexity's handler. That
  is withdrawn, and with it the earlier note explaining why BO-3800b-2's type-based arm
  could not apply to complexity. It now applies, because the specialist is not the
  authoring coder. BO-3800b's L1 text was amended the same day to say so.

  RECONCILIATION THE BUILD MUST DO. check-complexity is in BO-210's population today: it
  is a structural-category hook, and the originating coder is re-dispatched with its
  context. Declaring the specialist for it moves it into this tree's population, so
  BO-210c's re-dispatch must not also fire for it. If it does, both run: BO-3800b-2's
  belt-and-braces mutation, one check over. Arm one's third And catches exactly that.

  FOR FILE SIZE, no skill is named. The specialist's own restructuring approach governs,
  as BO-3800b-1 and INF-800 already state.

  NAMED MUTATIONS.
  (1) THE AUTHOR AGAIN: route complexity to python-coder as today, as well as or instead
      of the specialist. MUST GO RED: arm one. MUST STAY GREEN: arms two and three.
  (2) THE ALWAYS-ON SKILL: tell the specialist to apply complexity-reduction on every
      engagement. MUST GO RED: arm two. MUST STAY GREEN: arms one and three.
  (3) THE OVER-BROAD SUMMONS: engage the specialist on every refusal. MUST GO RED: arm
      three and both arms of BO-3800e-1.
