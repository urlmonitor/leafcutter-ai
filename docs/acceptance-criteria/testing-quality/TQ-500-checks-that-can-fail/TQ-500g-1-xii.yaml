id: TQ-500g-1-xii
components:
  - testing_quality
  - build_orchestration
title: "Only a name that is new to the work, whose pinned old text no longer matches, or whose wording changed goes to the preparer; every other name comes from the pin"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the work 07_TICKET-refresh-gate holds pinned replacements, from an
    earlier run, for four names of test T1's entry —
      N1 "drop the retry_due condition": its old text still occurs exactly
         once in refresh_config.py,
      N2 "the gate always allows": its old text
         "return refresh_due and retry_due" no longer occurs in
         refresh_config.py, because the coder rewrote that line,
      N3 "retry only once": the entry now spells it "Retry only once "
         (only its case and a trailing space differ),
      N4 "skip the refresh when the cache is warm": the entry now names
         "skip the refresh when the cache is cold" in its place,
    and the entry now also names N5 "refresh on every call", for which the
    work holds no pin,
  When the gate runs for that work,
  Then the preparer is sent exactly three names, N2,
      "skip the refresh when the cache is cold" and N5, each with the files
      the owed list puts in scope for it, and no other name,
    And N1 and N3 are applied from the pin, unchanged, and N3's verdict row
      spells the name as the entry now spells it, "Retry only once ",
    And N2's pinned replacement is not applied, no altered copy from an
      earlier run is applied in its place, and its row says
      "re-prepared: target changed",
    And the replacement pinned for "skip the refresh when the cache is warm"
      is never applied to "skip the refresh when the cache is cold", whose row
      says "prepared: not pinned", as N5's does,
    And the pin for "skip the refresh when the cache is warm" is neither run
      nor reported while no entry names it, and is applied again, after the
      checks of TQ-500g-1-xiii, if a later entry names it again,
    And a name whose wording differs from its pin by anything other than
      surrounding spaces and letter case counts as changed wording, however
      small the difference.
depends_on:
  - TQ-500g-1
  - TQ-500g-1-xi
