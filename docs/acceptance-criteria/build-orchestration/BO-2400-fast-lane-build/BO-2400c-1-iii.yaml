estimated_complexity: L
it_requirements:
  config_schema_fragment:
    fast_lane_context_bundle:
      type: object
      description: >-
        Bundle payload obtained once per run, before the Test Writer phase, and
        classified by the lane into one usable state or one of three disjoint failure
        states. Shape read from the assembling dispatch:
        {bundle: str, obtained: bool, bytes: int|null, location: str|null, message: str}.
        USABLE — obtained is truthy AND bundle is a non-empty string AND that string is
        not a locator AND it carries the breakpoint marker. Only in this state is the
        bundle string sent, verbatim, as the prefix of every build-context-carrying
        dispatch.
        NOT_OBTAINED — obtained is falsy, absent, null, or the reply is unparseable:
        nothing came back.
        OBTAINED_BUT_A_REFERENCE — obtained is truthy but the returned value is a
        filesystem path, a file: URI, or any other locator standing in for the content.
        The halt for this state states that the assembly SUCCEEDED, echoes the bytes and
        the location that were reported, and says the lane cannot follow a reference
        because it cannot read a filesystem.
        OBTAINED_BUT_INCOMPLETE — obtained is truthy and the value is content rather than
        a locator, but the breakpoint marker is absent or a layer is empty.
        Each of the three failure states ends the run with the context-bundle phase named
        and with a message naming that state and only that state. None of them falls back
        to a prompt composed some other way.
  reference_file_path: "templates/workflows-js/fast-lane-ship.js"
  n_location_rule: "3"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "SCOPE — THIS RECORD IS THE JAVASCRIPT HALF ONLY. The three locations in templates/workflows-js/fast-lane-ship.js are: (1) the bundle-assembling dispatch prompt and its schema, currently lines 450-480, where the size expectation and the return-the-text-itself instruction are stated; (2) the usability gate, currently lines 490-498, where the classification is computed; (3) the halt payload, currently lines 508-521, where exactly one of the three failure states is named. NOTHING in scripts/injection_builders.py belongs to this record — the Python half (dropping the duplicate layers, and with them two required CLI arguments) is BO-2400c-1-vi. State the split in the sign-off, because a single-coder phase that quietly does both loses the ability to tell which record a later regression came from."
    - "SOURCE VS GENERATED, VERIFIED 2026-08-25. templates/workflows-js/fast-lane-ship.js is the SOURCE and the only file to edit. build_workflow_scripts copies templates/workflows-js/*.js into <output_root>/workflows/ (scripts/build_phases.py:723-734), so the deployed copy is a build output and an edit made there is erased by the next build. There is no templates/scripts/ counterpart for this file, so the inverse trap (a scripts/ file that is itself a build output regenerated from templates/) does not apply to it. Do NOT add or extend a test asserting byte-parity between a template and its deployed copy: unit_tests/build_orchestration/test_fastlane_template_deploy_parity.py deliberately asserts a template DIFFERS from the deployed layout, so parity is not the invariant and a new parity assertion would contradict an existing one."
    - "The bundle is obtained once per run through a single agent-mediated command dispatch (the surface added by BO-2400c-1-ii) and the returned text is threaded into the later prompts. The workflow body cannot read the layer sources itself, and re-deriving the bundle per dispatch is what would break the byte-identity BO-2400c-1-iv asserts."
    - "The returned bundle text is inserted into the dispatched prompt unaltered. No trimming, no re-wrapping, no interpolation inside the stable region, no per-dispatch preamble prepended ahead of it. Anything the phase agent additionally needs goes after the breakpoint, with the volatile layers."
    - "Mentioning is not wiring. Adding the layer's name to a comment, to a phase list, to an agent instruction, or dispatching it and discarding the result does not satisfy this criterion. The single observable that counts is the prompt text the dispatched agent received."
    - "LANE-RECEIVES: the value the lane holds must BE the content. Reference-rejection is a deterministic test on the returned string — a 'file:' (or other) URI scheme, a leading '/' or a drive-letter root, or any other locator form — evaluated by the lane itself. It is never a judgement call delegated to an agent, never a plausibility heuristic, and never a length threshold: a 47-character path and a 47-character bundle fragment must be separable by the rule. The observed failure value was exactly 'file:/tmp/bo2400f13-bundle/bundle_output.txt'. A locator that also happens to contain the breakpoint marker is still refused as a reference — reference-rejection is evaluated before the marker check, or the two states collapse."
    - "STATE THE SIZE EXPECTATION TO THE PRODUCER, IN THE DISPATCH PROMPT: the assembling step is told plainly that the ask is roughly twenty kilobytes of text returned AS TEXT, not a path to it. This instruction is a BELT and must not be implemented as a mechanism: no truncation, no summarisation, no chunking, and no size cap anywhere in this record's three locations. The payload is made small by composition in BO-2400c-1-vi. If that record is not yet built when this one lands, the belt will still refuse a 149 KB pointer and the run will still halt — correctly — so do not compensate by loosening the refusal."
    - "Fail closed on every read: obtained is read with the same plain-falsy check the red-baseline gate_passed key already uses (fast-lane-ship.js:590) and the review verdict_obtained check already uses (fast-lane-ship.js:737), so version skew, a null reply and an explicit failure behave identically. No default-true, no `|| true`, no `|| ''` turning an unreadable bundle into an empty-but-truthy string, and no optional read yielding undefined-as-empty that lets an unbundled prompt through."
    - "The three failure messages are constructed at one site and are mutually distinguishable — each names its own state and no other, and no message is a superset of another that would satisfy all three string checks at once. Deliberately NOT in scope: the general rule that a halt must not state a reason its own evidence denies. The BA assigned that to the BO-2400f-4-vi family and duplicating it here would give it two owners and no home. Implement the instance, not the general rule."
    - "NO GREP TESTS. Every criterion in this record is a workflow gate sitting on code that has never once executed correctly — the transport has never carried a real bundle. A test that searches fast-lane-ship.js for the layer's name, a label, an agentType, a message fragment or a statement ordering passes UNCHANGED on dead code, so it is not weaker evidence, it is no evidence. This feature's own history is the proof: roughly 25 green unit tests plus a reference doc across a month in which the layer never ran, and the grep test at unit_tests/workflows/test_bo2400a_runner_wiring.py:401 asserting the layer's NAME appeared in an orphaned file, which kept a dead reference looking alive."
    - "THE SPECIFIC TRAP FOR THIS RECORD: stubbing the bundle label with a well-formed inline string proves nothing about the real path. A hand-written 200-byte stub containing the marker satisfies every gate assertion while the actual ~20 KB CLI stdout has still never been fed through the gate once. At least one covering test must therefore run scripts/injection_builders.py's assemble-bundle subcommand as a REAL SUBPROCESS against real on-disk layer files and push its ACTUAL stdout through the gate and into the recorded prompts. Harness-only tests are necessary for the halt wording and insufficient for the transport."
    - "Covering tests execute the lane under unit_tests/_workflow_engine_harness.py (run_workflow_under_e2 with label_responses keyed on 'fastlane-context-bundle') and assert on HarnessResult.agent_calls prompt text and on HarnessResult.result, the terminal payload. Both instruments are needed: agent_calls proves what an agent received, .result proves what the operator was told."
delivers_to:
  - agent: test-writer
    contract: "The assembled context bundle, delivered verbatim as the prefix of the 'test-writer-connected' dispatch prompt — stable layers, exactly one cache breakpoint marker, then this run's volatile layers. Delivered only in the USABLE state; on any of the three failure states this dispatch does not occur at all."
  - agent: python-coder
    contract: "The same bundle string, byte-identical to the one delivered to the test-writer, as the prefix of the 'coder-connected' dispatch prompt. Byte-identity across the two is BO-2400c-1-iv's property and is what forbids re-assembling per phase."
expects_from:
  ac_id: BO-2400c-1-ii
  contract: "A command an agent can run in one Bash call — python3 <worktree>/<output_root>/scripts/injection_builders.py assemble-bundle — whose stdout is the assembled bundle text and nothing else (all diagnostics on stderr), plus a non-zero exit and a named reason when a layer cannot be read. The lane requires the stdout ITSELF to cross the agent boundary in the reply's bundle field; a path to a file holding that stdout does not satisfy the contract and is refused as a reference."
