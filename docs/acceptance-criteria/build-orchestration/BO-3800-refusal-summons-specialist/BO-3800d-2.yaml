id: BO-3800d-2
title: "The stop accounts for itself — what was asked, what was done, where the file now stands and that nothing was delivered — and the three ways the handoff can end are told apart"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a run has stopped because the restructuring specialist was engaged up to
    the bound and the named file still does not meet the demand,
  When the account the run produced is read,
  Then it names the file that was at issue and states the demand that was asked of
    it,
  And it states that the restructuring specialist was engaged, and how many times,
  And it states where the file now stands against that demand, including the case
    in which the file was improved without reaching it,
  And it states that whatever the specialist changed in the file is still there and
    has not been undone,
  And it states that the change was not delivered,
  And given instead a run that stopped because the restructuring specialist could
    not be engaged at all, or was engaged and returned nothing usable,
  When that account is read,
  Then it says which of those two happened, and it is not the same account as the
    one above — a file that resists restructuring is never reported as broken
    machinery, nor the reverse,
  And given instead a run in which the specialist met the demand and delivery
    completed,
  When the run is read,
  Then neither of those accounts is produced,
  So the three endings — the demand met, the specialist fell short, the specialist
    could not be engaged or produced nothing usable — are three things a reader can
    tell apart from the account alone, without inspecting the repository.
