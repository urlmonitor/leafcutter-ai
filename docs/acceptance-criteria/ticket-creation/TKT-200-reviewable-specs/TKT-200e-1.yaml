title: "A motivating claim missing its command or result is flagged before the ticket leaves the inbox"
component: ticket-creation
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a ticket whose body states a motivating factual claim ("build X fails")
    but does not pair it with both an exact reproduction command and an observed result,
  When the premise-capture check runs on the ticket before it may leave the inbox,
  Then the check flags the ticket,
  And the violation quotes the claim text and states whether the reproduction command,
    the observed result, or both are missing,
  And the ticket is not cleared to leave the inbox until the capture is completed.
