notes: |
  WHAT THIS CHILD OWNS. Point (d) of the guarantee in BP-1500d's notes, which that
  L1 flags as the one that must not be dropped: (a) through (c) implemented over a
  build that still reports success when it gives up leaves the whole family
  unenforceable, silently, exactly as today. This child is therefore the enforcement
  floor for its three siblings, not an extra.

  HOW THE MANDATED NEGATIVE CONTROL LANDS HERE. In the other children the check must
  be shown to go red on a deliberately non-portable record. Here the check IS the
  build's own verdict, so the deliberate breakage is the unproducible record and the
  demanded red is the build's failure. The second run -- the same build succeeding
  once the record can be produced -- is what stops the requirement being satisfied by
  a build that simply refuses every out-of-package target, which would be a
  regression dressed as a fix.

  THE OUTCOME CLAUSE IS SEPARATE FROM THE MESSAGE CLAUSE ON PURPOSE. A build that
  prints a loud, well-worded failure and still reports a successful outcome leaves
  every automated caller exactly where it is today. Both must be asserted; neither
  substitutes for the other.

  ORDERING. This child gates the acceptance of BP-1500d-1 and -2 in practice: an
  install that received no record because the build gave up is indistinguishable from
  one that was never built. depends_on carries only the parent link, as the authoring
  request specified; the it-po should record the gating relationship in the contract
  fields.

  IT-PO RESPONSE, 2026-08-25. The gating relationship is recorded as delivers_to
  edges onto -1, -2, -4 and -5 rather than as depends_on, so it does not impose a
  build order in the opposite direction from the harness dependency. The reciprocal
  expects_from on -1 covers only the harness and the producible-record state this
  AC's paired success run needs. Neither edge went into depends_on, so no cycle
  exists between -1 and -3; they can land in either order.

  SUPERSEDED 2026-09-07 -- "EITHER ORDER" WAS WRONG, AND THIS RECORD ALREADY SAID
  SO. Read the paragraph above only as history. BP-1500d-1 is now in depends_on.
  The "either order" conclusion analysed one of the two orders: BP-1500d-1.yaml's
  reciprocal contract spells out the -1-first case ("if -1 lands first its fixture
  must assert the record's presence directly rather than inferring it from exit
  0") and says nothing about the -3-first case, which is the broken one. Meanwhile
  this AC's own expects_from BP-1500d-1 block, three clauses above the paragraph it
  contradicts, already stated the outcome: "without it only the failure verdict is
  observable and the AC can be satisfied by a build that refuses every
  out-of-package target." Two fields of one record disagreed for thirteen days,
  the wrong one was acted on, and nothing in the store compares fields against each
  other. When an expects_from names a capability as load-bearing, an ordering
  conclusion that does not address it is incomplete, whatever depends_on says.

  TRIGGER REBASED 2026-09-07 -- READ THIS BEFORE THE FOUR PARAGRAPHS BELOW, WHICH
  ARE NOW HISTORY. Everything below about "the package is outside the target" being
  the failing condition is superseded. That layout is now a SUCCESS case and is
  retained only as the venue the L1 mandates. What is unchanged and remains the
  whole point of this AC: a build that cannot produce the record must report failure
  and exit non-zero, and must not warn once and report success.

  THE NEW TRIGGER, AND THE EVIDENCE IT IS GENUINELY REACHABLE. The record is an
  account, expressed as positions INSIDE the receiving project, of the files this
  build put there. It is unproducible exactly when a file the build manages has no
  such position -- when the build is configured to place that file somewhere outside
  the project it is aimed at. Verified live on this branch's HEAD, three real
  subprocess builds through the ordinary command line into a sibling out-of-package
  scratch project under a system temp root:

    (1) BASELINE, nothing unusual: exit 0, record written into the RECEIVING project,
        472 output mappings, 175 template entries, package_root "../leafcutter-ai",
        empty failure field. This is what BP-1500d-1 bought and it is why the old
        trigger is dead.
    (2) NEW TRIGGER, one managed file configured to an ABSOLUTE location outside the
        receiving project (the config key is named for the it-po below, deliberately
        not in the criteria): the record computation raises, EVERY mapping is
        discarded, the manifest is written with zero mappings and a non-empty failure
        field reading "ValueError: '<outside path>' is not in the subpath of
        '<target>'", and the build prints the original fail-open warning verbatim.
        This is the same fail-open shape the AC was written against, reached from a
        condition -1 does not resolve -- and must not: giving the record's own lookup
        keys a not-inside-the-project fallback would poison the very base the drift
        readers resolve files against. (-1's fallback is on the diagnostic-only
        template key, a different field.)
    (3) PAIRED SUCCESS, identical command line and identical out-of-package venue with
        that one file placed back inside the project: exit 0 and the record present on
        disk with a full mapping set. The attribution control survives intact.

  CANDIDATES EXAMINED AND REJECTED, so nobody re-walks them. An unreadable package
  registry fails the build long before the record step (traceback, no record verdict
  at all) -- not a record trigger. A manifest destination pre-occupied by a directory
  does reach the record step and does exit non-zero, but by uncaught traceback, and it
  ALREADY exits non-zero on origin/main -- so it cannot distinguish this AC's fix from
  its absence and would give a green test against unpatched code. An unreadable
  template tree and a target that vanishes mid-build both require mutating state
  between the deploy phases and the record step, which no caller can do deterministically.

  A SECOND FAIL-OPEN FOUND WHILE PROBING, NOT COVERED BY THIS AC, FILE IT SEPARATELY.
  The same escape expressed RELATIVELY ("../elsewhere/<file>") does NOT fail: measured
  exit 0 with a full 472-entry record and an empty failure field, because the path
  library does not normalise ".." and the relativization therefore succeeds, writing a
  record key that points outside the project it claims to describe. That is a record
  that is produced and untruthful rather than one that could not be produced, so it is
  a different guarantee from this AC's and belongs to a sibling. This AC's trigger is
  deliberately specified on the absolute form, which is verified unproducible.

  THE TESTS SHIPPED WITH -3 ARE A REGRESSION LOCK AGAINST -1, NOT A COVERAGE ASSET.
  Whoever builds BP-1500d-1: test_bp_1500d_3_build_exits_nonzero_when_the_record_
  cannot_be_produced_for_an_out_of_package_target asserts, in one test, all three of
  returncode != 0, output_mappings == {}, and a non-empty output_mappings_error --
  the latter two labelled "setup sanity" but hard asserts all the same. Every one of
  the three goes red the moment -1 makes the record producible for an out-of-package
  target, because that is what -1 IS. The paired-success test
  (..._the_identical_build_succeeds_and_leaves_the_record_in_place_once_it_can_be_
  produced) reintroduces the unproducible condition in its run 3 and asserts non-zero
  again, so it locks the same shape a second time. These must be RE-BASED onto the
  post--1 world, not "fixed" one assertion at a time -- their trigger condition, not
  their verdict, is what was wrong. The exit-code verdict this AC specifies survives
  intact; re-basing the trigger is a separate decision that HAS NOW BEEN TAKEN -- see
  the rebase paragraphs above and the assertion-by-assertion inventory below.

  WHICH ASSERTIONS ARE NOW INVALID, NAMED ONE BY ONE. The four tests in
  unit_tests/portability/test_bp_1500d_3_build_manifest_failure_verdict.py are
  test-writer's to change, not this record's; this is the specification of WHAT is
  wrong with them, not an edit. Measured on this branch: 92 passed, 3 xfailed (the
  three are masked only because this record was corrected back to work_status todo;
  under strict enforcement they are three real failures). The 18 outcomes across 6
  files that the original -3 implementation regressed are gone.

    Test 1 (exits non-zero when the record cannot be produced). Its exit-code
    assertion is invalid AS TRIGGERED -- the out-of-package build it fires on now
    correctly succeeds. Re-point the fixture, keep the assertion verbatim. Its two
    "setup sanity" assertions are worse than invalid, they are INVERTED, and they are
    the regression lock proper: an empty output mapping set and a non-empty
    record-failure field are no longer the defect being reproduced, they are the
    FIXED state's opposite -- 472 mappings and an empty failure field are what a
    healthy out-of-package build now produces. Asserting the old pair pins -1 as
    broken. Under the new trigger those same two assertions become valid again and
    should be kept, because the new trigger genuinely does empty the record.

    Test 2 (the verdict reaches an automated caller). Its exit-code assertion is
    invalid AS TRIGGERED, same fix as test 1. Its second half -- parsing the CI
    workflow as YAML and asserting no build step carries continue-on-error and none
    pipes the build into another command -- is trigger-independent and must survive
    untouched. Minor, non-blocking: its `"|" not in run_cmd and "||" not in run_cmd`
    check is redundant in its second half, since any "||" is already a "|".

    Test 3 (the report names the record and the project). It currently PASSES, and
    that is the finding, not a reprieve: it passes VACUOUSLY. Both strings it looks
    for -- the record's name and the target path -- appear in the SUCCESS line of a
    build that produced the record perfectly. It cannot presently distinguish the
    report it exists to check from its opposite. Re-point it onto the new trigger AND
    give it the new criteria clause: the report must be distinguishable from a
    successful one. Note while doing so that the failing run prints a manifest
    success tick immediately before the failure line.

    Test 4 (the attribution control). Run 1 and run 3's non-zero assertions are
    invalid AS TRIGGERED. Run 2's three assertions -- exit 0, a non-empty record on
    disk, an empty failure field -- are correct and must be kept; only the MECHANISM
    by which run 2 "resolves the condition" changes, from re-nesting the package
    inside the target (now a no-op, since run 1's layout already succeeds) to placing
    the escaped managed file back inside the project. The three-run structure, and
    the reason run 2 exists at all, are unchanged.

  WHAT THIS RECORD NEEDS FROM THE IT PO, WHO OWNS it_requirements AND test_spec AND
  IS EXPECTED TO RE-PASS AFTER THIS. None of the following was changed here.
    1. test_spec's four entries still describe the old trigger in their descriptions
       ("this exact run emits '... is not in the subpath of ...', writes a manifest
       with output_mappings {} (154 entries to 0), and exits 0"). Every one of those
       located facts is now false for the layout named. Re-point the descriptions, do
       not relax the assertions.
    2. The concrete reachable trigger, for the test_spec description: the build's
       config key `precommit_autofix_config_path` (equally
       `changelog_categories_path`) set to an ABSOLUTE path outside --target-dir.
       Config is read from <target>/.claude/skills_config.json, NOT <target>/
       skills_config.json -- a probe that writes the latter silently configures
       nothing and returns a false green. Use the absolute form; the relative
       "../" form is a different, non-failing defect (see above).
    3. The scope bound in it_requirements ("do not satisfy this AC by making the
       record always producible; that is -1's work") is now SAFE to keep and should
       be kept -- with -1 landed, it no longer forbids the only available remedy. It
       was the trap that produced the regression; it stops being one in this order.
