id: TKT-100f-3
readiness: reviewed
priority: medium
title: "BA v3 applies weasel-word self-check to all L2 and L3 criteria"
component: ticket-creation
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the BA v3 has drafted an L2 AC with criteria containing
    the word "appropriate" (e.g., "Then the system takes appropriate action"),
  When the weasel-word self-check runs,
  Then the BA v3 rewrites the criterion to replace "appropriate" with
    a specific, measurable outcome
    (e.g., "Then the system logs a warning at severity WARNING
    and returns exit code 1"),
  And the self-check scans for all banned words:
    "appropriate", "properly", "correctly", "as expected", "relevant",
    "suitable", "reasonable", "adequate", "sufficient", "necessary",
    "fast", "efficient", "clean", "good", "robust", "maintainable",
    "scalable", "intuitive", "simple", "easy",
  And no L2 or L3 AC is emitted with any banned word remaining
    in its criteria field.
