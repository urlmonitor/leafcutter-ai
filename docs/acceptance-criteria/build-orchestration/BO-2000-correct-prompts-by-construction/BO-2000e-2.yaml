it_requirements:
  - "The deterministic dispatch loop (templates/workflows-js/build-ticket.js, a .js workflow body -- python-coder surface per the repo convention) must not spawn python-coder/sql-coder for a code ticket lacking Test Requirements and a test-writer red-baseline; it holds the ticket back with a reason."
  - "The gate is the run-time backstop for the authoring-time guard in BO-2000e-1; it must stay a depth-1 dispatch decision and must NOT chain a build supervisor inline (ADR-006)."
  - "Test coverage: simulate a code ticket with no Test Requirements / no red-baseline and assert the coder phase is not dispatched and a held-back reason is recorded."
