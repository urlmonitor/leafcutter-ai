criteria: |
  Given the routing configuration file does not exist at the expected path
    (e.g. fresh project install, or the file was deleted),
  When the commit agent is invoked with staged files,
  Then the agent does not crash or abort,
  And the agent falls back to its existing message-generation behavior
    (the LLM-based commit message composition that existed before the router),
  And the agent logs a single warning indicating the config file was not found
    and that default behavior is being used.
