id: TQ-600a-13-vi
components:
  - testing_quality
title: "Every pull request is held while the latest settled post-merge run on main is not green, by a check that reads the run history, runs no tests, cannot be edited by the pull request it judges, and is published by a dedicated App so that no pull request can impersonate it"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the run history of the correctness-lane workflow on the main branch
    (TQ-600a-13-ii), in which each settled run's recorded conclusion is success exactly
    when the lane was green (TQ-600a-13-v defines "settled"),
  And the decision, reversing the earlier one, that this run history — and not any issue
    — is the source of the verdict, while the `post-merge-red` issue is only the notice
    for people (TQ-600a-13-iii),
  And the owner's decision to hold immediately, with no grace period,
  And the reason this check exists at all: the expensive tests were taken off the per-PR
    path to remove their cost from it, so a per-PR check that runs any of them, or builds
    anything, defeats the change it belongs to,
  When the check named `Post-merge suite status` evaluates a pull request targeting the
    main branch that carries no accepted exemption (TQ-600a-13-viii covers those that do),
    with the hosting service replaced by a double serving a stated workflow state, run
    history and set of issues,
  Then when the latest settled run concluded success, and is fresh and its workflow active
    (TQ-600a-13-xiv), the check passes,
  And when the latest settled run concluded anything else, the check fails, and its output
    names that run by link and conclusion, says whether the tests failed or the run did
    not complete, and links the notice issue when one describes that run,
  And the verdict for a given run history is the same whether the notice issue is open,
    closed by a person, closed by a merged closing keyword, duplicated, or was never
    written because the job that writes it failed — so neither closing nor failing to
    write the notice releases the hold,
  And the verdict is computed from a fresh read on every evaluation and never from a
    stored earlier verdict: a pull request that passed before a red run fails on its next
    evaluation, and one opened after a red run fails on its first,
  And the check is evaluated when a pull request is opened, reopened, pushed to, or has its
    description edited, and when TQ-600a-13-xv re-evaluates it after the verdict changes,
  And one evaluation makes a small fixed number of reads of the hosting service that does
    not grow with the number of issues, runs or commits in the repository, starts no test
    session and no build, and neither checks out nor executes any code from the pull
    request — shown by counting the requests the double receives, the processes the
    evaluation starts and the files it opens,
  And the check that decides the verdict is the one on the main branch: a pull request
    that edits the hold's workflow or its module is judged by the main branch's unedited
    copy, and its edit has no effect on its own verdict — shown by evaluating a pull
    request whose head carries a hold module that always passes and observing the main
    branch's verdict,
  And the pass and fail outcomes are shown by executing the check against the double for
    each run-history state, never by reading the workflow file for the request it makes,
  And the verdict is published as a check run named exactly `Post-merge suite status`,
    created by the repository's dedicated hold App (App ID 5249547) and not by the
    Actions job, on the pull request's head commit as named in the triggering event —
    never on the commit the workflow itself ran from, which under this trigger is the
    tip of main,
  And that check run's conclusion is success exactly when the verdict is a pass or an
    accepted exemption (TQ-600a-13-viii), and failure for every other state, including
    could-not-read (TQ-600a-13-ix) — never neutral or skipped, both of which the hosting
    service counts as satisfying a required check — and its summary carries the same
    output the verdict computes, naming the run, its conclusion and the notice,
  And the Actions job that computes the verdict is named `Post-merge hold evaluation`,
    so that no check the job itself produces carries the name `Post-merge suite status`,
  And the App's check run is created in progress on the head commit before the verdict is
    computed and completed after it, so that an evaluation that stops part-way leaves a
    check that is not green rather than no check at all,
  And when the App's credential cannot be obtained because a secret is missing or empty,
    the hosting service rejects the App ID or the private key, or the App is no longer
    installed on the repository, then no check run is published, the evaluation job
    concludes failure, and its output names which of those occurred without printing any
    part of either secret — so on a head commit that carries no earlier App verdict the
    required check is absent and the pull request is not mergeable,
  And when creating the in-progress check run is refused or fails, the outcome is the same
    as for a credential that could not be obtained, and the output names the failed write,
  And when completing the check run is refused or fails, the check run is left in
    progress, which is not green, and the evaluation job concludes failure naming the
    failed write,
  And when the verdict computation raises, or the job is cancelled or killed, after the
    in-progress check run exists, that check run is left in progress, which is not green,
  And when any of those failures occurs on a re-evaluation of a head commit that already
    carries an earlier App verdict, the evaluation job concludes failure and its output
    states that the verdict published on that commit could not be refreshed and names the
    commit, rather than reporting success,
  And the App's credential is obtained afresh in every evaluation, is never written to
    any file in the checkout or the runner workspace, to the job's environment or output
    files, or to any log, and is used only for the hold's own check-run writes,
  And the App's credential is reachable only by the hold's evaluation job running from
    the default branch: no job that checks out or executes pull-request content (the fix
    proof of TQ-600a-13-xvi) references it, and no workflow that a pull request adds or
    edits, under any trigger, can read it — the last shown by the recorded observation of
    TQ-600a-13-x, because it is a property of where the hosting service stores the secret,
  And the no-pull-request-code invariant above holds unchanged with the App in place,
  And the publication and failure clauses are demonstrated by executing the evaluation
    job against a recording double of the hosting service for each verdict state and each
    failure above, observing the check-run requests the double receives — name, head
    commit, creating identity, status and conclusion — and afterwards scanning the
    scratch workspace, the job's environment and output files and the captured logs for
    the credential, never by reading the workflow file for the steps it declares.
depends_on:
  - TQ-600a-13
  - TQ-600a-13-ii
  - TQ-600a-13-v
