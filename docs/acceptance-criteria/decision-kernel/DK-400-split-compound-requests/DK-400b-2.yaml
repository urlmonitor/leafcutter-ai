  Flow branch split-mid-run. Left to the IT PO: what tells the kernel, partway through, that a
  work item holds several questions (apply the ADR-053 order, as on DK-400a). Also left to the IT
  PO (DK-400 Q6): whether a part of an approved split may itself be split again, and how deep.
  IT PO (2026-10-05): settled nesting (DK-400 Q6): parts of an approved split are never split again
  (nesting depth 1). Mid-run detection rides the same routing batch for semantically routed non-root
