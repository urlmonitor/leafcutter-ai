  - name: test_failed_mixed_run_leaves_no_member_marked_in_progress
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "No member is left claimed or in-progress; the claim taken by the failed run is released."
  - name: test_store_bytes_identical_after_the_failed_run
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
