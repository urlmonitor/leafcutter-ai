options:
  - id: opt-no-new-classifier
    title: 'No new classifier: keep the current record fields and Jev''s per-question precedent applicability'
    description: Decision records stay as they are; precedent lookup keeps matching as today, and whether a decision binds
      customers stays implicit in its text.
    assumptions:
      - Per-question applicability keeps Leafcutter-internal decisions out of customers' projects well enough.
    evidence_ids:
      - ev-5e30cba917bb4d5c
      - ev-2a1c5346fab0f00c
    proposed_by: host.generate_options
    approved_by: human:user
  - id: opt-audience-classifier
    title: One audience classifier (leafcutter_only / customer / both), chosen by Jev from described candidates, with a user-set,
      risk-specific human-in-the-loop threshold
    description: Each record gets an audience label, mirroring the shipped-versus-internal line components already carry ('leafcutter-ai
      only; not shipped to adopters'). Jev selects it from fixed candidates whose descriptions are the criteria; at or above
      the configured threshold (default 0.9) the label is applied and recorded as Jev's classification with its probability,
      below it the human decides. The record itself still needs human approval. Precedent lookup in a customer's project offers
      only customer and both records.
    assumptions:
      - The threshold is calibrated on representative cases rather than read as a probability of correctness.
    evidence_ids:
      - ev-a297882a8da2c395
      - ev-c1f97a54cc4a0bb3
      - ev-5e30cba917bb4d5c
    proposed_by: host.generate_options
    approved_by: human:user
  - id: opt-audience-plus-binding
    title: Audience plus a binding classifier (must_rule / default / preference)
    description: 'As the audience option, plus how binding a record is: a must_rule, a default that applies unless overridden,
      or a human preference that is never applied silently. The spec says unknown trade-offs need analysis or human preference
      rather than a forced classifier judgement, so separating preferences from rules keeps them from being reused as rules.'
    assumptions:
      - Separating rules from preferences changes how precedent is offered.
    evidence_ids:
      - ev-c1f97a54cc4a0bb3
      - ev-28d22bf100a5b212
      - ev-a297882a8da2c395
    proposed_by: host.generate_options
    approved_by: human:user
  - id: opt-classifier-framework
    title: 'A declared classifier framework: classifier dimensions in config, each a described candidate list with its own
      risk-specific threshold; start with audience'
    description: 'Classifiers are data in the kernel config, as retrieval sources already are: each dimension lists described
      candidates and its own human-in-the-loop threshold (default 0.9, user-settable, risk-specific). Jev classifies every
      dimension in one batch when a record is staged; below threshold the human decides. New dimensions are added in config.
      Ship audience first.'
    assumptions:
      - More dimensions will follow, so a generic mechanism pays off.
    evidence_ids:
      - ev-c1f97a54cc4a0bb3
      - ev-760b2e37dfb53f38
      - ev-a297882a8da2c395
    proposed_by: host.generate_options
    approved_by: human:user
