delivers_to:
  - agent: llm-expert
    contract: "Consumed by INF-500d-3-iv. The vocabulary file <output root>/scripts/feedback/submit_failure_reasons.json (source templates/scripts/feedback/submit_failure_reasons.json) lists five reasons as objects {id: string kebab-case, meaning: string, record_written: boolean, detected_by: 'script' | 'caller'}: writer-not-allowed, malformed-submission, facility-unavailable, destination-unwritable, written-uncited (record_written true for written-uncited only; detected_by caller for facility-unavailable and written-uncited). A failed run's own error file holds exactly one line 'submit-failed:<reason>:<category>'; the agent records 'feedback-id: (submit-failed:<reason>:<category>)'. Capture precedence: stdout id; id in the recovery file named by the run's own 'sidecar:' line; the 'submit-failed:' line; written-uncited when a 'sidecar:' or '[submit_feedback] sink:' line exists but no id was recovered; otherwise facility-unavailable. <category> is the --category value or '-'."
  - agent: python-coder
    contract: "Consumed by INF-500d-5 (agent not yet assigned there). The same vocabulary file; a marker value matches ^\\(submit-failed:([a-z][a-z0-9-]*):([^\\s:()]+)\\)$ with group 1 a vocabulary id and group 2 the destined category or '-'. Only reasons whose record_written is false may enter the holding place; the decision reads the flag, never a reason name. The legacy bare '(submit-failed)' carries no reason and must be treated as reason unknown, never as holdable."
  - agent: llm-expert
    contract: "Consumed by INF-500d-3-v. The vocabulary file templates/scripts/feedback/submit_failure_reasons.json (deployed to <output root>/scripts/feedback/submit_failure_reasons.json): five objects {id: string, meaning: string, record_written: boolean, detected_by: 'script' | 'caller'} with ids writer-not-allowed, malformed-submission, facility-unavailable, destination-unwritable, written-uncited. On every failure exit the script controls, the error stream carries exactly one line 'submit-failed:<reason>:<category>' beside any human-readable ERROR lines, standard output stays empty and the exit status is non-zero; a successful run carries no such line. The marker form is 'feedback-id: (submit-failed:<reason>:<category>)', with <category> the --category value or '-'. Capture precedence: stdout id; id in the recovery file named by the run's own 'sidecar:' line; the run's 'submit-failed:' line; written-uncited when a 'sidecar:' or '[submit_feedback] sink:' line exists but no id was recovered; otherwise facility-unavailable. Lands in the same PR as INF-500d-3-v or before it."
  - agent: llm-expert
    contract: "Consumed by INF-500d-3-vi. On every failure exit the script controls, the error stream carries one line 'submit-failed:<reason>:<category>', with <reason> drawn from templates/scripts/feedback/submit_failure_reasons.json (deployed to <output root>/scripts/feedback/submit_failure_reasons.json). Standard output stays empty and the exit status is non-zero. The capture precedence's third step reads that line, which INF-500d-3-vi makes reachable for epic-supervisor by keeping its error stream. Lands in the same PR as INF-500d-3-vi or before it."
  - agent: llm-expert
    contract: "Consumed by BO-2000g-1. The failure-fallback marker form 'feedback-id: (submit-failed:<reason>:<category>)' and the legacy bare '(submit-failed)', both defined in templates/scripts/feedback/submit_failure_reasons.json. BO-2000g-1 names the fallback only by reference to the signoff skill and copies no form of it, so a change of form here needs no change there."
  - agent: python-coder
    contract: "Consumed by BO-2000g-3. templates/scripts/feedback/submit_failure_reasons.json holds the real-id pattern ^fb_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9a-f]{8}$, the reasoned-marker pattern ^\\(submit-failed:([a-z][a-z0-9-]*):([^\\s:()]+)\\)$ whose group 1 is one of the file's reason ids, and the legacy bare pattern ^\\(submit-failed\\)$. The template lint reads the file when it is present; until this record lands the file does not exist (BO-2000g-3's transition rule applies)."
