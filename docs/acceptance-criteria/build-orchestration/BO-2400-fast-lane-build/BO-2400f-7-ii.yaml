title: "Claim step stays readiness-agnostic: draft and reviewed ACs are still flipped"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the resolved connected build set contains acceptance criteria whose readiness
    is draft or reviewed rather than approved,
  When the start-of-run work_status flip to in_progress runs,
  Then those draft and reviewed acceptance criteria are still flipped to in_progress,
  And readiness does not filter which resolved criteria are claimed — pointing at the
    AC is the operator's go-ahead, extending the readiness-agnostic selection
    guarantee (BO-2400f-2) to the new lifecycle-claim step.
depends_on: [BO-2400f-7]
