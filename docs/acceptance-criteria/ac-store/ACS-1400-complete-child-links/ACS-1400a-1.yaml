  - commit_guardian
title: "A child whose dependency list points elsewhere is still checked against its structural parent"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a store containing a child record whose own dependency list names a
    successor record rather than its structural parent, and whose structural
    parent's coverage list does not name that child,
  And a second child record whose dependency list names a sibling in another
    branch and whose structural parent's coverage list does name it,
  When a commit staging both children is checked at the moment it lands,
  Then the first child is reported as a violation naming the child, the structural
    parent, and the entry that is missing from the parent's coverage list,
  And the second child is not reported as a violation in that same run, so the
    check still distinguishes a dependency that deliberately points elsewhere from
    a structural parent link that is unrecorded,
  And the reported violation states which of those two cases it found, rather than
    leaving the reader to infer it from the dependency list.
depends_on:
  - ACS-1400a
  - ACS-1200a
