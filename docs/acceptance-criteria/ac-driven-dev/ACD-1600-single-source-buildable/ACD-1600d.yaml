amended_by:
  - "2026-08-14 sequencing pass: added depends_on ACD-1600c. 1600c guarantees a requirement names concrete file targets; this L1 guarantees those targets resolve to canonical source (templates/...) rather than a build output (scripts/..., .claude/...). Naming a file and naming the RIGHT file are two guarantees in that order — without this one, a buildable-looking spec sends the coder at a generated copy whose edits the next build.py run overwrites."
