  ACs and asking fresh agents whether they could act. They could not: the coder
  received cross-role authoring memory (BA/PO/IT-PO), the supervisor Pre-Drive
  Checklist, and authoring-pipeline instructions. Component note: role-scoping and
  the effective-prompt review surface also touch `infrastructure` (agent context
  injection / agent knowledge plane) -- flagged for the user in case a different
