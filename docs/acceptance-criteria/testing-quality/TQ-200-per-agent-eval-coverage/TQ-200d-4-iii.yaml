  contract: >-
    One sentence in templates/agents/test-runner.md '## Output: Success' stating that PASS is reported
    only when the report quotes a passed-test count greater than zero from the runner's own summary, and
    the '## Output: No Test Ran' block; TQ-200d-4-iv's new kind checks reports against that rule and its
    reference entry quotes the sentence verbatim.
expects_from: null
test_required: true
package_surface: false
declared_files:
  - path: templates/agents/test-runner.md
    state: existing
it_requirements:
  - >-
    Caller-contract decision (IT PO, 2026-10-30): the machine-parsed reply keeps its keys (passed, output,
    failing_tests, anomalies); a run that executed no test sets passed false and names the reason in anomalies.
    No new required key is added, so the callers that parse the reply (build-feature.js, build-ticket.js,
    quick-fix.js, finalize-feature.js, ticket-supervisor, the python-coder inner loop) keep parsing it
    and read the outcome as not passed. The llm-expert confirms from those templates and workflow prompts
    that none treats a non-PASS markdown status other than FAIL as a pass; if one would, that is reported
    before this AC is built.
  - >-
    The '## No-op Rule' (no test-relevant changes, nothing run) is unchanged and stays distinct from 'no
    test ran' (a command ran and executed nothing).
  - >-
    templates/agents/test-runner.md is a shipped template: only the source changes; the deployed copy
    is regenerated by the build.
  - >-
    DOCUMENTATION (part of done) - the template is the primary document. No doc under docs/ lists the
    test runner's report statuses today (checked 2026-10-30); if the implementer finds one, it gains 'NO
    TEST RAN'.
  - >-
    DOC-DRIFT TESTS (part of done), in unit_tests/agents/test_runner_prompt/: the template contains the
    PASS-rule sentence; the No Test Ran block names the command and the two reasons; the machine-parsed
    section says passed is false when no test ran; and, once TQ-200d-4-iv has added its entry, the sentence
    equals the entry's quote (held by the TQ-200d-1-ii quote test).
  - >-
    KNOWN ISSUE: add to the Status line of docs/known-issues/testing-quality/open-low-ki-tq-20261025-test-runner-runs-a-test-file-as-a-script.md
    'no-test-is-not-a-pass part fixed by TQ-200d-4-iii'; TQ-200d-4-iv moves the file.
  - >-
    CHANGELOG: one entry for TQ-200d-4-iii written with scripts/changelog/emit_entry.py (type manual,
    components [testing_quality]) into changelogs/, naming the PASS-needs-a-count rule and the No Test
    Ran report.
  - >-
    GLOSSARY: new terms in the docs this AC writes ('no test ran') reach docs/glossary.md only through
    the check-glossary-coverage hook and the glossary-triage flow; no entry is added by hand (CLAUDE.md).
test_spec:
  - name: test_template_requires_a_quoted_passed_count_for_pass
    target_dir: unit_tests/agents/test_runner_prompt/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      '## Output: Success' states that PASS needs a passed-test count above zero quoted from the runner's
      own summary.
    must_catch:
      - revert the fix
      - exit status 0 alone allowed to report PASS
    in_scope_files:
      - templates/agents/test-runner.md
  - name: test_template_has_a_no_test_ran_report
    target_dir: unit_tests/agents/test_runner_prompt/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      '## Output: No Test Ran' exists, quotes the command run and names both reasons (nothing collected;
      no runner summary).
    must_catch:
      - no-test-ran report drops the command that was run
    in_scope_files:
      - templates/agents/test-runner.md
  - name: test_machine_parsed_reply_is_not_passed_when_no_test_ran
    target_dir: unit_tests/agents/test_runner_prompt/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The machine-parsed section says passed is false when no test ran, with the reason in anomalies,
      and the combined summary vocabulary includes NO TEST RAN.
    must_catch:
      - machine-parsed reply allowed to set passed true when no test ran
    in_scope_files:
      - templates/agents/test-runner.md
test_rationale: >-
  The behaviour is a model's report, so the unit tests hold the template's rules and TQ-200d-4-iv's trap
  row proves the behaviour against recorded outputs. The machine-parsed test guards the caller contract,
  which is where a 'no test ran' run could still be read as a pass.
