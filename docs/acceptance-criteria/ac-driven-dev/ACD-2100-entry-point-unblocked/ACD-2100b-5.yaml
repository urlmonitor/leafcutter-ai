it_requirements:
  - "The check must land as a real executable pre-flight script invoked by the plan-feature skill BEFORE the workflow is invoked -- not as prose instruction in SKILL.md, and not in the workflow body. The E2 engine contextifies the workflow body with exactly the injected globals agent, parallel, pipeline, phase, log, args, workflow and budget, with no module loader and no filesystem primitive reachable (ADR-030; canonical statement in the unit_tests/_workflow_engine_harness.py docstring, ENGINE FIDELITY section). A workflow body therefore cannot read config/agent_registry.json at all -- the agent round-trip exists precisely because the sandbox has no filesystem. The skill runs in the main agent loop with real Bash and Read access, so a script invoked from there can perform the local read."
  - "All source changes must land under templates/ and scripts/. The deployed workflow and the deployed skill are build output."
  - "The verdict must be a function of the registry contents alone. It must be identical whether dispatch is available or not -- 'skip the check when dispatch is unavailable' is a fail-open regression wearing this record's clothes and is explicitly forbidden. There must be no code path anywhere in the check that branches on dispatch availability."
  - "The startup path must reach this check and pass it with no network available."
  - "Removing the round-trip must not remove the halt: the four outcomes ACD-2100b-1 through -3 specify still stop the run, and ACD-2100b-4 still holds over them. Moving the check into the skill must additionally not open a bypass -- the workflow must fail closed when no pre-flight verdict reaches it. A caller that invokes the workflow directly, for example Workflow({scriptPath: '.leafcutter/workflows/plan-feature.js'}), which is a real and currently-used invocation path, supplies no verdict and must be stopped before any authoring agent is dispatched, with a report that names the missing pre-flight rather than asserting a permission cause the run never established."
  - "The verdict must cross from the pre-flight into the workflow through args -- the only injected global that carries caller-supplied data -- and must carry enough structure to keep the outcomes ACD-2100b-1, -2 and -3 own distinguishable from one another. A single boolean collapses them and re-creates the defect those records exist to fix."
  - "The registry-location semantics must not fork. The pre-flight must resolve the registry the same way ACD-2100a-1 and ACD-2100a-3 already established -- repository-anchored, so it reaches the project's real registry when the run starts inside a linked git worktree that holds no .leafcutter/ of its own -- rather than a second, independent, cwd-relative resolution."
  - "If a helper that dispatches for this purpose remains in the source for another caller, this behaviour is not satisfied by its absence from the file -- what must be observable is that no dispatch is made on the check's behalf during a run."
  - "Must satisfy the repository error-handling policy: the local read replaces a network call, so its failure paths are the ones ACD-2100b-1 and ACD-2100b-2 own. Those are external I/O and must be wrapped, must name a specific exception type, and must never be swallowed into an unqualified denial."
  - "A new script under scripts/ that the DEPLOYED skill invokes must be added to the build deploy manifest in the same change. The deployed skill runs against the deployed layout, so a script that exists only in the source tree makes the pre-flight fail at runtime while every source-tree test passes."
  - "Must not add a per-run cost beyond a single local file read -- this record removes latency from startup and must not reintroduce it elsewhere."
test_spec:
  - name: test_preflight_returns_the_permitted_verdict_from_the_registry_alone
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "the pre-flight script executed as a subprocess in a fresh process, against a temporary repository whose config/agent_registry.json lists the worktree-creation agent with permission to run repository commands"
    description: >-
      With no agent dispatch reachable and no network, the pre-flight emits the permitted
      verdict from the registry file alone.
  - name: test_run_reaches_and_passes_the_startup_check_with_every_dispatch_attempt_failing
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "the plan-feature workflow driven through the E2 harness with every agent() call failing immediately with a transport error, and the permitted verdict the pre-flight produced supplied in args"
    description: >-
      Dispatch made impossible; the check completes with the permitted verdict and the run
      proceeds to the next step rather than halting on a transport error.
  - name: test_no_dispatch_is_made_on_the_checks_behalf_during_a_run
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the plan-feature workflow driven through the E2 harness, with the harness's own recorded agent-call list read back afterwards"
    description: >-
      The run's record of what it dispatched contains no entry attributable to the startup
      check -- no call carrying the resolve-workspace-setup-permission label and none whose
      prompt reads the registry. Observed from the record the run produced, never from the
      absence of a call in the source.
  - name: test_verdict_is_identical_with_and_without_dispatch_available
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: seam
    surface_invoked: "the pre-flight script run twice against the same registry -- once in an environment where dispatch is impossible, once where it is available"
    description: >-
      The same registry produces the same verdict in both runs, so the verdict comes from
      the file rather than from the transport, and no path in the check is keyed on dispatch
      availability.
  - name: test_withheld_permission_still_halts_the_run
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    surface_invoked: "the plan-feature workflow driven through the E2 harness with dispatch impossible and the denying verdict the pre-flight produced from a registry that withholds permission"
    description: >-
      The run still stops at the check before any authoring agent is dispatched -- the local
      read is not a bypass.
  - name: test_direct_workflow_invocation_with_no_preflight_verdict_halts
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    surface_invoked: "the plan-feature workflow driven through the E2 harness with NO pre-flight verdict present in args, standing in for a caller that invokes the deployed script directly via Workflow({scriptPath: '.leafcutter/workflows/plan-feature.js'})"
    description: >-
      The run halts before any authoring agent is dispatched, and its report names the
      missing pre-flight rather than asserting a permission cause. Moving the check into the
      skill must not leave the direct-invocation path unguarded.
  - name: test_preflight_is_reachable_and_runnable_from_the_deployed_layout
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: "the deployed layout produced by the build, invoking the pre-flight at exactly the path the deployed SKILL.md names"
    description: >-
      The pre-flight exists at the deployed path the skill invokes and produces a verdict
      when run there -- a source-tree-only script would pass every other test in this set
      and still fail on first real use.
test_rationale: >-
  Making dispatch impossible and requiring the run to get past the check anyway is the
  only Given that cannot be satisfied by a source scan. A test that greps for the
  absence of a dispatch call passes on a call that is present but unreachable, and fails
  on a correct implementation that keeps the helper for another purpose -- so the
  evidence has to be the run's own dispatch record, read back from the harness after the
  run. That is unchanged by the surface move: the check now lives in a script the skill
  runs, but the assertion that no dispatch was made on its behalf is still made against
  the run, not against the file. The seam test is what stops the fix being "skip the check
  when dispatch is unavailable": the verdict must be the same either way because it comes
  from the file, not from the transport. The two failure-angle tests keep the halt -- a
  local read that always returns permitted would pass everything above them, and so would
  a move that quietly exempts the direct-invocation path. The deployed-angle test exists
  because a skill-invoked script is only as real as its deploy manifest entry.
