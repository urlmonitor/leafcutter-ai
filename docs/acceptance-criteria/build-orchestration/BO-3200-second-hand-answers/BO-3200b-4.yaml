notes: |
  2026-09-17 (business-analyst) -- CRITERIA CHANGED, READ THIS FIRST. An exact release command
  dispatched to the chartered executor now explicitly counts as the guaranteeing layer
  performing the release, not as delegation to a specialist; a dispatch asking any specialist to
  decide or interpret the release still fails the criterion. Authorised by the user; the old
  wording, the reason and the stale technical fields are in amended_by. Where the paragraphs
  below say "no specialist as the performer", read "no party exercising judgement over the release".

  Satisfies the sequence-diagram entry in BO-3200b's documentation_triggers.

  Showing the outcome being READ as its own interaction is the point of this diagram. In the
  arrangement it replaces, the release was dispatched and the diagram would have looked
  complete — the missing element was the return arrow nobody consumed, which is invisible
  unless it is drawn. A diagram that stops at "release dispatched" reproduces exactly the
  belief that let KI-BO-020 survive.

  The clause forbidding a specialist as the performer keeps the drawing from being redrawn
  later into the shape this tree removed.

  The second scenario checks the diagram against a real failure run rather than against the
  intended design.

  IT-PO ENRICHMENT NOTE (2026-08-26). Drawing the outliving store as distinct from the run's own
  scratch state is added as a requirement because the observed harmlessness of KI-BO-020 came
  entirely from the claim landing in a throwaway copy. A diagram that shows one undifferentiated
  "store" would teach the reader the accident that contained the damage rather than the rule that
  the claim outlives the run.

  IT-PO RE-ENRICHMENT NOTE (2026-09-17). The paragraph above on "the clause forbidding a specialist
  as the performer" now reads, in the technical layer, as "no party that exercises judgement may
  perform or decide the release": it_requirements[3] declares participant roles so the executor
  is drawn and is not a specialist, and it_requirements[9] checks the new no-decide-or-interpret
  clause on both the drawing and the real run.

  CAVEAT -- ORDERING. The drawing and the coherence test need the executor's registry entry, which
  BO-3200f-2 delivers; depends_on names BO-3200f-1 but not BO-3200f-2 (depends_on is the BA's).
  BO-3200f-2 depends on BO-3200f-1, so the sequencer can schedule this record before the executor
  is registered. Recommended BA edit: add BO-3200f-2 to depends_on.
