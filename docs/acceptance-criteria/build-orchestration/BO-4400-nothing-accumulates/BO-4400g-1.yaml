notes: |
  User request item (1). Today the clearing request accepts only a location, while making
  and looking up accept the work's identity; a caller therefore has to look up, parse and
  re-send a path. Clearing by location keeps working (existing BO-4300e behaviour); this
  record adds the name form. The "alpha" / "alpha-v2" pair is the prefix-bleed check that
  BO-4300e-1 already applies to lookup.
