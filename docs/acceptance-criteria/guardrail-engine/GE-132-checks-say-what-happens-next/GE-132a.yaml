id: GE-132a
title: "Every check that can stop a commit declares what the author does, who helps and with which skill, and a check without that declaration cannot be added"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Each check says up front what happens when it says no.

  For every check that can stop a commit there is one declaration, kept in one
  place, that states three things: what the author should do, which specialist is
  brought in to handle the refusal (or that the author clears it themselves), and
  which skill that specialist applies. When the check refuses, the author is shown
  those instructions. A check registered without a declaration is refused, so the
  undeclared ones can only become fewer. A declaration naming a specialist or skill
  that does not exist is refused, and so is a declaration left behind for a check
  that is no longer registered.
