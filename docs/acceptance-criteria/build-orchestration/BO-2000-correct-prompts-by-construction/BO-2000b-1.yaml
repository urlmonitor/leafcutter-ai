criteria: |
  Given the python-coder template governs how a pre-commit hook is written,
  When a hook it produces encounters an unexpected error while running,
  Then the hook records a diagnostic on the error stream and exits reporting success,
  And it never re-raises the unexpected error to hard-block the commit.
