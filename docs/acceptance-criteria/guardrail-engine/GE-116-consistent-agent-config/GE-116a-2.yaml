id: GE-116a-2
components:
  - commit_guardian
title: "Verification-required agent that can edit files is allowed to commit"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
assigned_agent: python-coder
estimated_complexity: S
criteria: |
  Given a staged agent definition whose settings declare that it must verify
    the changes it makes (requires_verification is true),
  And that agent's declared abilities include the ability to edit files (Edit),
  When the commit is attempted,
  Then the consistency guard raises no objection for that agent definition,
  And the commit proceeds as far as this guard is concerned.
depends_on:
  - GE-116a
doc_links:
  - path: "docs/how-to/managing-pre-commit-hooks.md"
    relationship: related
    status: exists
  - path: "docs/pre-commit-hooks.md"
    relationship: describes
    status: exists
delivers_to: null
expects_from:
  ac_id: GE-116a-1
  contract: "The verification-consistency guard whose allow path (exit 0) this AC exercises for a requires_verification: true agent that has Edit in tools."
it_requirements:
  - "Edit present in the tools list must satisfy requires_verification: true — the hook exits 0 for that file (allow path)."
  - "The allow/block decision is per staged agent definition; a consistent definition must not be blocked because of an unrelated file in the same commit."
test_spec:
  - name: test_allows_when_requires_verification_true_and_has_edit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Staged agent template with requires_verification: true and tools containing Edit → hook exits 0 (allowed)."
origin_agent: BrainCandy
created: 2026-07-20
amended_by: []
