title: "Low and medium complexity tasks route to the faster model tier"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
criteria: |
  Given a ticket has estimated_complexity: S (low),
  When the guardrail engine determines the model tier for any agent working on this ticket,
  Then the agent is routed to the faster model tier (Sonnet-class)
  And this routing applies to every agent in the ticket's agent chain:
    architect, business-analyst, it-po, python-coder, test-writer, pr-reviewer

  Given a ticket has estimated_complexity: M (medium),
  When the guardrail engine determines the model tier,
  Then the agent is also routed to the faster model tier (Sonnet-class)
  And there is no difference in model tier between S and M complexity

  Given two tickets, one with estimated_complexity: S and one with estimated_complexity: M,
  When both are processed by the same agent type,
  Then both agents run on the same model tier
  And the model tier selection is recorded in the agent dispatch metadata
