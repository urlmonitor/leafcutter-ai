assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: >-
    One launch entry point in scripts/evals/agent_launch/ (command.py), used by run_agent_eval.invoke_via_cli,
    run_agent_eval.invoke_agent_writer and produced_tests_transcript.invoke_with_transcript. It owns:
    the program started (bare 'claude' until TQ-200d-5-ii adds the lookup), the instruction flag (replace
    mode -> --system-prompt-file, append mode -> --append-system-prompt-file), the UTF-8 prompt file in
    the OS temp directory (outside the row sandbox and the project tree, removed in every outcome), the
    row input written to stdin with -p and no positional prompt, and the translation of a failed process
    start into the harness's invocation error. Each invoker passes only its own flags (model, tools, output
    format, permission mode), cwd, env and timeout, and gets back the completed process (or its envelope
    result). TQ-200d-5-i (launch-failure text), TQ-200d-5-ii (claude lookup) and TQ-200d-5-iii (stop on
    launch failure) change only this module and the row loops.
