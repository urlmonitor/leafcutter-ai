created_by: "docs/acceptance-criteria/build_pipeline/BP-900-deployment-completeness/BP-900g.yaml"
criteria: |
  Given extract_script_path_refs in scripts/build_referential_integrity.py, which
    feeds the broken-reference guard build.py runs as a preflight,
  And that it scans only `templates/agents/` and `templates/skills/`, and only
    `.md` files, so workflow sources under `templates/workflows-js/` (`.js`) are
    outside the scan entirely,
  When the extractor runs over the package templates,
  Then script references in workflow sources are extracted and normalised to the
    same `scripts/<path>.py` deploy-namespace key as agent and skill references,
    so a workflow invoking a script no build phase deploys fails the build,
  And the output-root prefix bound established by BP-900g-4/BP-900g-5 is preserved
    exactly — only the `{{config.output_root}}/` token or a dot-prefixed root such
    as `.leafcutter/` may precede `scripts/`, so host-project paths
    (`debugging/scripts/...`) and package-development prose
    (`leafcutter/scripts/build.py`) are still NOT captured,
  And the fast-lane workflow's own script invocations resolve in a consumer
    install: templates/workflows-js/fast-lane-ship.js addresses
    build_orchestration/fast_lane.py, setup_ticket_worktree.py and
    ac_store/mark_ac_done.py at the paths the build actually deploys them to,
    rather than at a bare `scripts/...` path,
  Because a consumer project's own `scripts/` directory holds only three shim
    symlinks (commit_guardian, doc_compliance, feedback) — everything else lands
    under the output root — so `${worktreePath}/scripts/build_orchestration/fast_lane.py`
    resolves only inside the leafcutter package repo, where `scripts/` is tracked
    source. /fast-lane-build therefore works for us and dies at its first command
    for every consumer, and the guard cannot see it because workflows are unscanned.
