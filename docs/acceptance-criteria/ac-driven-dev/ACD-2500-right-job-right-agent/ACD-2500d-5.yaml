notes: |
  AUTHORED BY IT-PO under user decision 3 (2026-09-25): one new code-aware agent, Sonnet tier, two
  separate outputs (test design for ACD-2500c, file findings for ACD-2500d), fed by a deterministic
  pre-pass script (ACD-2500d-5-i). Creating and registering the agent is its own L2.

  PLACEMENT: the suggested id ACD-2500c-6 is blocked by the child cap (5 L2 per L1, check_ac_limits.py;
  ACD-2500c already has c-1..c-5 active). It sits under ACD-2500d, whose outcome ('a step that can
  see the repository') it delivers and whose components already include agent_registry. It is
  equally the host for ACD-2500c. The BA should review these criteria (IT-PO-authored) at the final gate.

  ORDERING: build this AC and ACD-2500d-5-i before ACD-2500c-1 and ACD-2500d-1/-2/-3, which write
  their procedures into the template this AC creates. depends_on carries only the hierarchy link; the
  ordering is carried by those ACs' expects_from.
