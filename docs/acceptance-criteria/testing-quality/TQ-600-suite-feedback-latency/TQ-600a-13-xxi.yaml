estimated_complexity: M
it_requirements:
  - >-
    AGENT CONFIRMED: python-coder. The surfaces are a scripts/ci/ module and the workflow
    that calls it; no agent in config/agent_registry.json owns GitHub Actions YAML, and every
    record of this family that edits a post-merge workflow assigns python-coder
    (TQ-600a-13-ii). All decision logic — selection, retry list, per-lane verdict, combined
    verdict — stays in scripts/ci/; workflow steps only prepare the environment and invoke
    the module.
  - >-
    THE DATABASES MATCH PROOF-OF-DONE EXACTLY, AND MUST NOT DRIFT FROM IT. The Proof-of-done
    job in .github/workflows/ci.yml (job id `done-proof`) starts three `neo4j:5.26-community`
    service instances — knowledge-retrieval on host port 17687, knowledge-domain on 18087,
    knowledge-native on 18088, each mapped to 7687, with its own NEO4J_AUTH test credential
    and the same heap / page-cache settings — and sets no address variables, so the tests
    reach them at their default addresses. The lane's first execution and its retry each
    start the same three instances: same image tag, same host ports, same credentials, same
    memory settings. Whether that is achieved by one shared definition or by two identical
    copies is the implementer's choice, but a change to one that is not made to the other
    is a defect; record the choice in notes. Do not edit the `done-proof` job as a side
    effect (TQ-600a-13-xxiv).
  - >-
    THE CREDENTIALS STAY NON-SECRET LITERALS. The three NEO4J_AUTH values are disposable
    test credentials already written in ci.yml. The lane must not introduce a `secrets.`
    reference or a write-scoped token; every job of post-merge-suite.yml keeps the
    `contents: read` (plus `actions: read` on the verdict job) permissions TQ-600a-13-ii
    set.
  - >-
    THE POPULATION IS THE FOLDER, COLLECTED FRESH, AND THE DEFAULT DESELECTION IS
    OVERRIDDEN. The lane collects `tests/knowledge_live/` (the folder path is the only
    pinned input — never a hard-coded list of modules or node ids, never a stored list).
    pytest.ini's addopts carries `-m "not manual and not timing_ratio"`, so the lane must
    pass a command-line marker expression that selects every test in the folder (the
    suite-performance guide documents `-m "manual or not manual"` as the collect-everything
    form; a timing_ratio-marked test in the folder must be included too). The same marker
    override must be carried by the retry: TQ-600a-13-ii measured that re-running node ids
    without the opt-in marker reports "deselected" and executes nothing.
  - >-
    A LIVE-LANE TEST MISSING FROM THE RETRY REPORT IS FAILED ON BOTH EXECUTIONS. As for the
    correctness lane, the retry outcome is read per node id from the retry's own per-test
    report; an id absent from it is never passed-on-retry.
  - >-
    THE LIVE LANE IS ITS OWN JOBS, SEPARATE FROM THE CORRECTNESS LANE'S. The live first
    execution and the live retry run as jobs of their own (job names indicative: `live run`,
    `live retry`), each on a fresh runner with its own database start-up, its own checkout
    and build, and the same strict run conditions as TQ-600a-13-ii (`AC_ENFORCE_STRICT=1`,
    dev dependencies, `python scripts/build.py --target-dir .`). The live retry receives
    only the list of live first-run failures as a named artifact. Separation is required so
    that a database that fails to start cannot take the correctness lane's report down with
    it, and so that the verdict job can attribute a failure to the right lane
    (TQ-600a-13-xxii). The existing verdict job gains the live jobs as dependencies and
    keeps running always.
  - >-
    ONE COMBINED VERDICT, ONE RUN CONCLUSION, NO SECOND HOLD CHECK. The run's verdict is
    green only when both lanes are green; did_not_complete when either lane did not complete
    (TQ-600a-13-v ordering: did-not-complete outranks red); otherwise red. The existing
    `Verdict: red` / `Verdict: did not complete` steps and the run conclusion continue to
    carry the combined verdict, so `Post-merge suite status` (TQ-600a-13-vi) needs no change
    to hold on a red live lane.
  - >-
    THE VERDICT ARTIFACT KEEPS EVERY EXISTING FIELD'S MEANING. Existing consumers (notice
    -iii, fix proof -xvi, pass-on-retry window -xiii, demotion counter -x) read top-level
    `verdict`, `stage`, `failing`, `passed_on_retry`. Top-level `verdict` / `stage` become
    the combined verdict; top-level `failing`, `first_run_failures`, `passed_on_retry` and
    `collected_ids` stay CORRECTNESS-LANE ONLY, so the fix proof of -xvi, unchanged, never
    executes a live-database test without a database (until TQ-600a-13-xxv lands, a fix for
    a live-only red run selects nothing, which -xvi already judges as not proven — the
    conservative direction). The live lane's results go in a new object (see delivers_to);
    bump `schema_version` and update every reader in the same change.
  - >-
    PASS-ON-RETRY TRACKING COVERS THE LIVE LANE. The live lane's `passed_on_retry` ids feed
    the same five-run window and escalation of TQ-600a-13-xiii as the correctness lane's,
    computed in the same verdict job; a node id that appears in both lanes is tracked per
    lane, never double-counted.
  - >-
    THE CORRECTNESS AND TIMING SELECTIONS ARE UNTOUCHED. The correctness lane's command
    (`-m "manual and not timing_ratio" tests/ unit_tests/`) and post-merge-timing.yml are not
    edited. The TQ-600a-13-xii partition check, if it enumerates lanes, must treat the live
    lane as a re-execution of default-run tests and not as a fourth partition member.
  - >-
    BOUNDED TIME. Each live job carries an explicit `timeout-minutes` no greater than three
    times its measured cost (TQ-600a-13-ii rule). Measure the live run job's wall clock
    (database start-up plus the folder) from the first live run and record it in notes
    with the timeout chosen.
  - >-
    THE DEFAULT-RUN TESTS OF THIS RECORD STAY INSIDE THE FAMILY BUDGET. The family's
    default-run test budget is under 15 s total (TQ-600a-13-ii); this record's default-run
    share must not exceed about 1.5 s and must start no build and call no GitHub. Any
    execution against a real database cannot happen in the per-PR shards, which start no
    database; where it does execute must be stated by the test design, and it must never
    skip silently into a pass.
