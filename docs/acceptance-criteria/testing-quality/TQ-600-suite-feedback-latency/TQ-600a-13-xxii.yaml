notes: |
  WHY "HEALTHY, THEN REFUSES" IS ITS OWN CASE. A health probe that passes proves the probe
  passed. A test session that cannot connect after a green probe (wrong port mapping, auth
  mismatch, a container that restarted) would otherwise surface as N connection errors read
  as N regressions — the opposite failure of "never started reads green", and equally
  misleading. Both forms end as did-not-complete.

  NO DELIVERS_TO, DELIBERATELY. The notice of TQ-600a-13-iii consumes this ending through
  the did-not-complete verdict and stage vocabulary it already reads from TQ-600a-13-v; it
  gains one stage value, not a new contract. This record therefore declares no delivers_to
  (TQ-600a-13-iii, an approved record of an earlier run, does not and need not name this
  one in its expects_from). The notice-side wording is stated in this record's own criteria.

  "PRODUCED, NOT SIMULATED" — the IT PO should state, as TQ-600a-13-v does, which of these
  endings can be produced in the unit layer (a database address that never answers is cheap)
  and which only through served conclusions.
