assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    context_bundle_command:
      type: object
      description: "Command-line surface over assemble_context_bundle: a subcommand accepting one argument per layer (architecture, conventions, high_level, acs, prior_tests, optional prior_outputs, optional working_diff, optional breakpoint marker), writing the assembled bundle to stdout and exiting 0. Missing required layer or unreadable input: non-zero exit, diagnostic naming the missing layer on stderr, nothing on stdout."
  reference_file_path: "scripts/injection_builders.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "The entry point wraps the existing pure function; it must not reimplement the layering, the ordering, or the marker placement. Two copies of the ordering rule is two things to drift — the command parses arguments, calls assemble_context_bundle, and prints what it returns."
    - "The command surface must match the way the lane already reaches Python: a single `python3 <script> <subcommand> --args` invocation an agent can run in one Bash call, with the module remaining importable and side-effect-free at import time. The workflow body has no filesystem access (ADR-024, docs/reference/workflow-constraints.md), so any surface that requires the caller to read or write files itself is unusable."
    - "stdout carries the bundle only. Logging, warnings and diagnostics go to stderr. A logger writing to stdout would insert run-varying text into the stable side of the breakpoint and quietly bust the cache this feature exists to hit (paired with BO-2400c-1-iv)."
    - "Fail closed on an unusable invocation: exit non-zero and name what was missing. Never exit zero with an empty or partially-assembled bundle — an assembly that silently drops a stable layer would still look byte-identical to itself and would pass a naive prefix comparison."
    - "The module is already in the build's agent-support deploy manifest (scripts/build_phases.py, AGENT_SUPPORT_SCRIPT_FILES), so the command must work from the DEPLOYED layout at `<worktree>/<output_root>/scripts/injection_builders.py`, not only from the package source tree. Verify by running build.py and executing the deployed copy."
    - "Covering tests must EXECUTE the command as a real subprocess and assert on its exit code and its actual output. Greping the source for `argparse`, `__main__`, or the subcommand name is not acceptable evidence: a grep passes on dead code, which is exactly how this defect survived. This same failure class has now recurred twice in this lane — `fast_lane.py` had no CLI so the runner's `select_batch` call was a silent no-op (CLAUDE.md, 'Gate / Workflow ACs — Verify Behaviorally, Not by Grep'), and KI-BO-005 is the identical defect in this module."
