criteria: |
  Done means every deliverable signed off -- recorded on the requirement itself.

  Every deliverable on a requirement's checklist is signed off, on the requirement
  itself, by the specialist responsible for it. The requirement counts as done only
  when all of its deliverables are signed off -- so "done" can never be claimed
  while something it needs is still missing.
