id: ACD-400a-3-i
components:
  - ac_driven_dev
readiness: approved
priority: high
title: "No transitive ancestor at any depth gates a leaf AC's readiness"
component: ac-driven-dev
level: L3
status: active
req_status: active
work_status: done
criteria: |
  Given the AC store contains a three-level lineage:
    - L1 "Y-200a" (composite, work_status not done),
    - L2 "Y-200a-1" with depends_on: [Y-200a] (work_status: todo),
    - L3 "Y-200a-1-i" with depends_on: [Y-200a-1] (approved, active, todo),
  When the scanner is invoked with leaf and todo filters,
  Then "Y-200a-1-i" appears in the ready list,
  And "Y-200a-1-i" does NOT appear in the blocked list,
  And no blocked entry names either "Y-200a-1" or "Y-200a" as a blocker of
    "Y-200a-1-i" (neither the parent L2 nor the grandparent L1 gates the leaf,
    at any ancestor depth).
depends_on: [ACD-400a-3]
doc_links:
  - docs/reference/ac-schema.md
  - docs/architecture/components/ac-driven-dev.md
  - scripts/ac_store/scan_ac_store.py
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Ancestor exclusion must walk the full transitive parent chain via derive_parent_id() (parent AND grandparent AND beyond), not stop at the immediate parent."
  - "A leaf whose only depends_on entries resolve to transitive ancestors at any depth must classify as ready; the grandparent L1 must not appear as a blocker any more than the parent L2 does."
  - "Must remain read-only, O(n), and idempotent; classification must be consistent with ac_prioritizer.py."
delivers_to: null
expects_from:
  ac_id: ACD-400a-3
  contract: "Ancestor-aware classification that excludes an AC's own transitive ancestors from the readiness-gating dependency set"
origin_agent: business-analyst-v3
