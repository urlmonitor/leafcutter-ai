notes: |
  Repo CLAUDE.md records three defences that turned out to be no-ops because they examined nothing
  and reported clean (feedback_categories.yaml path, the bare-directory AC validator, the stale-ref
  merge audit): "a check that examined nothing must not look like a check that found nothing". A
  parity test run against the wrong install location is exactly that shape. The third scenario
  catches a source whose consumers were all removed after BO-4500b-1-ii's install-time check ran
  against a different layout.
