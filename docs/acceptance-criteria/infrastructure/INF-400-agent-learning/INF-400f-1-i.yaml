id: INF-400f-1-i
title: "If the PO captures no learnings, the BA still runs correctly with baseline context"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
criteria: |
  Given the product-owner-v3 agent runs first in the pipeline,
  And its knowledge-capture step fires but the PO answers "no" (nothing discovered),
  And no new context files are written during the PO run,
  When the business-analyst-v3 agent is spawned next,
  Then the BA's pre-flight step reads only the pre-existing context files
    (which may be empty or from prior pipeline runs),
  And the BA produces its L2 ACs at normal baseline quality,
  And the BA does not emit an error or warning about missing PO learnings.
