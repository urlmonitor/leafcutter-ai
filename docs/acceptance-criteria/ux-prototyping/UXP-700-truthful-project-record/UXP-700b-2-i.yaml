id: UXP-700b-2-i
title: "A check that did not run is listed as not run, and contributes nothing"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a check whose precondition is absent, so the check does not execute,
  When the record's checker reports its outcome,
  Then that check is listed with a stated reason for not having executed,
  And that check contributes no records to any stated examined figure,
  And the outcome reported is not the outcome for a record that was checked and found sound
    while any check is listed as not executed.
