criteria: |
  Given the 40 records the producer-name rule would refuse — 24 that name
    something that is not an agent at all (23 reading `finalize-feature-workflow`,
    which is a workflow script, and 1 reading `create-ticket`, a slash command
    retired by ADR-012) and 16 whose value is a registered agent's name wrapped
    in literal quote characters,
  When the correction is applied,
  Then each of those 40 records is written to disk carrying a producer that the
    agent registry lists, chosen to match the surface that record changes,
  And no other record's producer value is written at all.

  And given the corrected store,
  When every record in it is validated in one pass,
  Then no record is refused for naming a producer the registry does not list,
    and the pass states how many records it examined, so the result cannot be
    an empty run reported as a clean one.

  And given the correction and the rule are part of one change,
  When the rule is applied to the store as it stood before the correction,
  Then it refuses 40 records — which is why the correction is applied first
    within that change, and why the rule is never introduced against a store it
    would immediately reject.

  And given the store-wide sweep that the project's own instructions prescribe
    before a finalization drive,
  When it is run after this change lands,
  Then it reports clean on this rule, and it did so without any record being
    exempted from the rule.
