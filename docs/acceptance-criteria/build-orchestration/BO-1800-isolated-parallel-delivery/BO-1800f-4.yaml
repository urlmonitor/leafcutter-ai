notes: |
  This record satisfies the reference-doc half of BO-1800f's documentation_triggers.
  The sequence-diagram half is BO-1800f-3 and is authored separately; neither record
  covers the other's trigger.

  Why this was held until now, and why it is authorable now. BO-1800f's notes record
  that both documentation slots were deliberately left empty until the behaviour's
  shape was settled, on the grounds that a documentation criterion written against an
  unsettled shape documents the wrong thing. The shape is now settled: BO-1800f-2 and
  BO-1800f-2-i fix the declaration surface as `Removes: <repo-relative path>` commit
  trailers, unioned across the delivery set and adjudicated per path. That is the
  subject this record is written against, and it did not exist when the slot was held.

  Why reference is the right genre, and not a how-to or an explanation. What the
  contributor needs is not a walk-through of delivering work and not the reasoning
  behind choosing trailers over a declaration file -- that reasoning is already
  recorded in BO-1800f-2's notes and belongs in an explanation if it is ever restated.
  What they need is an exact syntax, a normalization rule, a scope rule, and a table
  of refusals: facts looked up one at a time, in the seconds before typing a line.
  That is the reference genre by definition, and the criteria above are phrased to
  require lookup form, so a document that is otherwise complete but written as an
  ordered walk-through does not satisfy them.

  Why the fact list is enumerated rather than summarized. `Removes:` is a syntax the
  author types by hand into free text, and BO-1800f-2-i makes a mistyped path a
  declaration error rather than a silent no-op. Every item in the list above is one a
  contributor can get wrong in a way that produces a refusal: the wrong path base, a
  `./` prefix, a basename where a full path was needed, a glob, two paths on one line,
  or a declaration written after the removal was already committed. BO-1800f-2's own
  notes name free-text fragility and awkward retro-declaration as the two costs the
  chosen mechanism carries; this record is the documentation half of paying them down.
  The concrete harm of getting it wrong is not a missing page -- it is that the gate
  refuses, the author cannot distinguish a typo from a true positive, and they learn
  to distrust the gate, at which point the enforcement this L1 exists to establish is
  routed around by the people it protects.

  Falsifiability. "A reference doc exists" is satisfied by an empty file with correct
  frontmatter, so this record does not ask for one. Each clause above fails a
  different deficient document, and the last clause is what makes drift detectable:

    - an empty, stub, or placeholder page ......... fails every fact clause, because
                                                    no clause is satisfied by the
                                                    page's existence
    - a page that teaches delivery end to end ..... fails the lookup-form clause: the
                                                    facts are present only in reading
                                                    order and cannot be scanned to
    - a page documenting only the accepted form ... fails the failure-list clause,
                                                    which is the clause that carries
                                                    the actual cost of the gap
    - a page whose examples were written against .. fails the example clause, because
      an earlier or an imagined syntax             the stated outcome and the observed
                                                    outcome disagree

  The last row is the one that keeps this record alive after the doc is first written.
  The trailer syntax is new, and the plausible future failure is not an absent page but
  a page that was right once: a page still showing a glob as accepted after globs were
  rejected, or still showing a bare file name matching a nested path. Binding the
  examples to the behaviour turns that drift from an invisible staleness into a
  failing check, and it is checkable by running the documented examples rather than by
  reading the page. No inspection of the page's word count, section count, or presence
  satisfies any clause here.

  For the IT PO. Three things are deliberately left open and are technical calls:
    - Surface and placement. The reference genre's own conventions put cross-cutting
      references on the shared reference surface and component-scoped ones beside
      their component; the delivery boundary spans three delivery workflows, which
      argues for cross-cutting, but the call is the IT PO's to make against the
      placement rule rather than this record's to assert.
    - There is no index page on the reference surface today, though the reference
      genre's authoring procedure directs the author to update one after writing.
      Either the index is created or the step is knowingly skipped; a silent skip
      leaves the page undiscoverable, which is the failure mode the back-link step
      exists to prevent.
    - The example clause needs a mechanism. Extracting the examples from the page and
      running them through the examination is the only form of it that detects drift;
      an assertion that named strings appear on the page does not, and CLAUDE.md's
      "Gate / Workflow ACs -- Verify Behaviorally, Not by Grep" applies to the check
      of this record as much as to the behaviour it documents.

  Parent back-link. BO-1800f's covered_by is being updated centrally once both
  documentation siblings land, rather than by each sibling, because two agents editing
  the same parent concurrently would collide. This record's absence from covered_by at
  the moment of writing is that coordination, not an orphan.

  -- IT PO, 2026-09-14 (technical enrichment; nothing above this line was altered) --

  The three open calls, resolved.

  1. SURFACE AND PLACEMENT: docs/reference/removes-trailer.md. The record's reasoning --
     the boundary spans three delivery workflows, so the reference is cross-cutting -- is
     sound, and it turns out not to be the deciding input. write-reference.md Step 2
     states flatly that all reference docs live at docs/reference/<topic>.md, and its
     Common Mistakes table treats any other location as a defect. The repo has no
     component-scoped reference location; the 22 existing reference docs are all in that
     one directory. So cross-cutting and component-scoped resolve to the same path and the
     question is settled by the rule rather than by the spanning argument. The file name is
     the literal token `Removes:` rather than a task phrase, both because the naming rule
     forbids verb phrases and because the token is the string a contributor searches for.

  2. THE INDEX: not created here, and not silently skipped. docs/reference/README.md was
     verified absent (22 .md files, no README). The genre's authoring procedure does direct
     the author to update an index -- and reference-author Step 5 finishes that sentence:
     "If a README does not exist, note this in the response payload but do not create it
     speculatively." Creating one would contradict the procedure the record cites, and it
     would be a new maintained surface authored as a side-effect of a delivery-gate doc.
     The discoverability worry behind the record's note is real but is already answered by
     a different surface: docs/INDEX.md is auto-generated by scripts/generate_doc_index.py
     and already lists every docs/reference/*.md with its description. The it_requirement
     therefore makes the index regeneration and the Step 9 back-links mandatory, and makes
     the README skip an explicit reported one. One caution is carried into the requirement
     because it has bitten this repo: regenerate with generate_doc_index.py, never with
     scripts/build.py, whose doc-index phase overwrites the tracked index with a `No docs
     found.` stub in this workspace layout (KI-BP-016).
     A standing gap remains and is NOT closed by this record: a reference surface of 22
     pages with no index, and an authoring procedure whose index step is a no-op on every
     run. That is its own piece of work and wants its own record under the documentation
     component; it is raised here rather than absorbed.

  3. THE EXAMPLE MECHANISM: extract and run, never match strings. Set out in
     test_rationale. The short form: the harness parses the page's example block, builds a
     real git fixture per example from the removal set the page states it against, runs the
     adjudication BO-1800f-2 implements, and compares the observed verdict and named paths
     against the recorded outcome. Three further descriptors exist to stop the harness
     itself becoming the false green -- one mutates a recorded outcome and requires the
     disagreement to be reported, one requires an unparseable example block to FAIL rather
     than pass having examined nothing, and one requires the observed outcomes to span all
     three refusal kinds plus an acceptance. The second of those is not defensive padding:
     CLAUDE.md records three separate defences in this repo that reported clean while
     examining nothing, and a doc harness reading a page whose format quietly changed is
     the same shape. The it_requirements carry the other half of this mechanism -- the page
     must keep every worked example inside one extractable block and must record outcomes
     in the verdict vocabulary -- because an unparseable or prose-recorded example is
     invisible to the check and is therefore an uncovered drift hole.

  change_target: docs, risk_surface: contract_boundary -- and the second is a deliberate
  departure from the siblings' `safety`. Both values are legal (ac_store_schema.json
  permits all ten change targets and all six risk surfaces), so the choice is about which
  gates compute. guardrail_gates.yaml's `docs` section maps safety to an EMPTY agent list:
  classifying this record safety, by analogy with its siblings, would route no reviewer at
  all, which is the wrong outcome for the page that defines the accepted input syntax of a
  safety gate. `contract_boundary` yields documentation-expert plus pr-reviewer, and it is
  the honest classification rather than a convenient one: this page IS the contributor-
  facing side of a parse contract. BO-1800f-2's it_requirements treat the trailer as a
  machine-parsed input with an error surface; the page is where a human learns to satisfy
  that parser. A wrong page produces a well-formed refusal the author cannot act on, which
  is the boundary failing, not an internal doc being stale.

  depends_on gained BO-1800f-2 and BO-1800f-2-i. This is a build-ordering fact, not a
  re-parenting: the record remains a direct child of BO-1800f. Both additions are load-
  bearing for different reasons. BO-1800f-2 because the page's subject -- the trailer, its
  union rule and its accepted forms -- does not exist until that record lands, and a page
  written against the intended shape rather than the implemented one is the exact drift
  this record's last clause exists to catch, committed at birth. BO-1800f-2-i because the
  failure list the page must carry is that record's output: per-path adjudication, the
  normalization rule, and the declared-path-matching-nothing declaration error. And the
  example harness cannot run at all before the adjudication entry point exists -- a
  test_spec whose first descriptor imports a module that does not yet exist is not a red
  baseline, it is a collection error.

  assigned_agent is reference-author, not documentation-expert. The registry entry matches
  this record almost verbatim -- "Assign when the ticket requires a new reference document
  in docs/reference/" -- and reference-author is is_ticket_phase: true, so it can be
  dispatched directly. documentation-expert's own registry action is to classify intent and
  dispatch the matching specialist, which for this record is reference-author; routing
  through it adds a hop whose failure mode is recorded in this project's memory as the
  dispatcher returning before its specialist has written anything.

  CAVEAT -- an intentionally one-sided contract. delivers_to names BO-1800f-2's refusal
  text as the consumer of this page's path, and BO-1800f-2 carries no matching
  expects_from. That is not an oversight: BO-1800f-2 is readiness: approved and outside
  this enrichment's scope, and amending an approved sibling to add a back-reference is a
  separate, deliberate call. Whoever implements BO-1800f-2's "states how to declare it"
  requirement should cite this path; if the page has not landed by then, the refusal text
  should carry the syntax inline rather than a dangling link.
