notes: |
  DECIDED DESIGN POINT, carried verbatim from the L1 notes: the category is
  GATE-DECLARED, never inferred from prose after the fact. A text-similarity
  clusterer as the primary dedup mechanism is explicitly rejected — it would leave
  the count as untrustworthy as the prose it replaced.

  WHY THE SCOPE NARROWED. The original AC required EVERY gate to declare a closed
  vocabulary, using pr-reviewer as its worked example. pr-reviewer cannot comply: it
  relays findings produced by the external `pr-review-toolkit:review-pr` skill, and its
  own template's Constraints section forbids modifying that skill or any sub-skill. As
  originally written the AC was unimplementable for the single largest source of signal —
  a census of recorded blockers attributed 46 of 71 to pr-reviewer, about 65% — and the
  downstream ACs quietly routed all of it into the discountable bucket. The requirement
  is now scoped to gates whose prompt templates this project owns, with the relaying gate
  named as an exemption rather than silently failing the rule.

  THE EXEMPTION IS NOT A DISCOUNT. Exempt-gate findings are counted on equal terms via
  BO-2800b-4's unclassified namespace, and BO-2800b-3 reserves the "heuristic" discount
  for prose-only historical records, not for live findings from an exempt gate. If a
  future version of the review toolkit exposes a stable finding identifier, that gate
  moves off the exemption list and its identifiers become declared.
