title: "Two source templates deploying to the same command path fail the build, naming both sources and the target"
component: build-pipeline
level: L2
status: active
req_status: active
readiness: approved
priority: high
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-100-reliable-builds/BP-100m.yaml"
criteria: |
  Given a build for the claude platform where both
    templates/commands/build-feature.md and templates/workflows/build-feature.md
    resolve to the same deployed target path <root>/commands/build-feature.md
    (build_commands deploys templates/commands/*.md to commands/, and for the
    claude platform build_workflows also deploys templates/workflows/*.md to
    commands/),
  When build.py runs,
  Then the build exits with a non-zero status,
  And the failure message names BOTH colliding source templates
    (templates/commands/build-feature.md and templates/workflows/build-feature.md)
    and the shared deployed target path commands/build-feature.md,
  And the same collision is reported for create-ticket.md and finalize-feature.md,
    which are also present in both templates/commands/ and templates/workflows/.
