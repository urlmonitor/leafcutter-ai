  - path: docs/product-truth/classifier/eval.jsonl
    relationship: relates-to
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements: |
  Mirrors the repo error-path discipline (CLAUDE.md Rules 1-4): an eval set proves
  the agent rejects bad input, not just handles good input. Examples of a negative
  case per agent: the classifier's "none" outcome (clf-011/clf-012), a mock-data
  request for an entity that already has a canonical dataset (must extend, not
  duplicate), a flow step whose referenced record does not exist. The completeness
  check asserts >= 1 row flagged negative per set.
