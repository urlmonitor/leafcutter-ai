id: AR-400c-4
title: "A build of the package's own tree prints no ability or hand-off warnings and passes"
component: agent-registry
components:
  - agent_registry
  - skills_system
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the package's real tree after every record under AR-400 is done,
  When the build runs over it into a fresh target,
  Then the build passes,
    And the part of the run that reports on specialists' abilities and hand-off
      permissions contains zero lines at warning severity,
    And each of the 30 such warning lines in the 2026-10-12 rebuild report is
      accounted for by exactly one record under AR-400 that either fixed its
      cause or removed the message, and the mapping is recorded in this record's
      evidence,
    And the run still reports how many specialists the ability and hand-off
      checks examined, and that number equals the number of specialist
      definitions in the tree.
depends_on:
  - AR-400c
  - AR-400a-3
  - AR-400b-3
  - AR-400c-1
  - AR-400c-2
  - AR-400d-1
