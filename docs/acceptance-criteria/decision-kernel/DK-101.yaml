criteria: |
  Given the request "Can you use leafcutter now? I mean run the kernel and know about it?"
  And caller-supplied host identity, capabilities, conversation and observations,
  And relevant permitted repository documentation,
  When context enrichment runs,
  Then the original goal remains verbatim,
  And explicitly supplied caller context stays distinguishable from repository evidence,
  And relevant excerpts carry a source, locator and content hash,
  And workspace identity and registered capabilities ground what the request refers to,
  And registration, documentation or caller claims never become proof of live runtime success.
