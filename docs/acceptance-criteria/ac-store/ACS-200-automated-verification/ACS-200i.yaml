id: ACS-200i
components:
  - ac_store
title: "The rules applied before merge and the rules applied locally are one and the same set"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the set of structural and schema rules the commit-time guardrails apply
    to an acceptance-criterion record,
  When the merge-time acceptance-criteria check evaluates that same record,
  Then it applies that same set of rules, resolved from the same single
    definition of each rule,
  And no record can satisfy the local guardrails and then be failed at merge
    time for a rule the local guardrails never applied,
  And no record can satisfy the merge-time check and then be failed by the
    local guardrails,
  And when a rule is added, changed, or removed, the change takes effect on
    both sides at once — neither side holds a private copy of a rule the other
    does not have,
  And the symptom ("it passed on my machine and failed at merge, or passed at
    merge and blocked my next commit") must not occur.
