id: BP-900f
components:
  - build_pipeline
title: "Build catches deployable scripts whose source is present on disk but not tracked in git"
component: build-pipeline
level: L1
status: active
req_status: active
work_status: not_started
readiness: approved
priority: high
criteria: |
  Given the build determines the set of deployable scripts it must ship from the
    scripts that templates reference (the deployable-script source set produced by
    the existing source-resolution step),
  When a tracked-source guard runs as part of the build,
  Then it verifies that every script path in that set resolves to a file that is
    tracked in git (committed to version control), not merely present in the
    working tree,
  And if any deployable script's source is present on disk but untracked, the
    guard fails the build with a non-zero exit and names each untracked source,
  And the guard never fails for a deployable script whose source is tracked,
  And the guard's verdict is reproducible on a fresh clone, so it cannot pass
    only because leftover untracked working-tree files happen to be present.

  This L1 owns the TRACKED-IN-GIT axis of deployment completeness: a deployable
  script whose source exists on disk but is not committed. It is the deliberate
  complement of BP-900b (build PREFLIGHT that a template-referenced script is in
  the deployable manifest at all), of BP-900e (a registered/referenced script has
  NO template counterpart at all), and of BP-1000a (byte-equality of scripts that
  exist in BOTH source and template). BP-900f checks the orthogonal question:
  does each deployable script's source actually live in version control, so a
  fresh clone / CI has it. The feedback directory (gitignored without relocating
  its source) is the live regression that motivates this guard, but the guard is
  general — it covers any directory that drifts into the untracked-source trap.
