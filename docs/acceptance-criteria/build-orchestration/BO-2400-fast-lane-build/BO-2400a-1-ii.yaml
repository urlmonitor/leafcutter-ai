notes: |
  USER DECISION 2026-09-27 (round 3): stdout stays verbatim for now (BO-2400a-1-i). This is
  the follow-up for large outputs, drafted now and deliberately OUTSIDE the current build's
  dependency chain: no record in the BO-2400f-5 / BO-2400f-3-ii / BO-2400f-10-iii set depends
  on it. Build it only after the user promotes it.

  THE WORKFLOW ENGINE CANNOT READ FILES. Its only awaited primitives are agent(), parallel()
  and prompt() (docs/reference/workflow-constraints.md). So a path hand-off moves the reading
  AND the integrity check to the agent that consumes the file. That is why the reader, not the
  lane, checks the hash here — and why this record conflicts in shape with BO-2400c-1-viii,
  which has the lane compare the bundle text itself. Reconcile before building.

  ONE AGENT. Assigned python-coder for the lane and the producing commands. If the reply form
  must also change in the command-step-runner template, that half is llm-expert's surface and
  the IT PO may split it.

  The limit L is left to the IT PO; the criterion only requires one stated value and the two
  forms either side of it.
