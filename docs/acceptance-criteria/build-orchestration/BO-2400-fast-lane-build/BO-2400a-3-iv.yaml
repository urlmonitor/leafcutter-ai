risk_surface: internal
notes: |
  Excluded-but-reported, not excluded-and-hidden. A partially-implemented acceptance
  criterion legitimately arrives with green covering tests from the earlier slice; those
  tests must not decide the gate, but an operator reading the halt-or-proceed report has
  to be able to see them, otherwise the gate's reasoning is unauditable and a
  misclassified test looks identical to an absent one.
