notes: |
  THIS IS WHERE THE L0's THIRD GAP IS ACTUALLY SETTLED. The L0 records that three things the
  produced document needs are not among the pinned inputs, and that a BA must choose between
  widening the inputs and bounding the promise. Two of the three — the document above, and
  the originating ticket — are widened, because the author already has them at the moment of
  asking (see INF-1300a-2). The third cannot be widened away in the same sense, because its
  value is not an administrative fact but a claim about what the diagram concerns, and the
  request is made before the diagram is drawn. So it is settled by refusal: the fact is a
  required input for those kinds, and without it nothing is produced.

  WHY NOT A STAND-IN, STATED AS A MEASUREMENT RATHER THAN A PREFERENCE. The temptation is to
  write a placeholder so the document exists and the author fills it in. In this project that
  is not merely untidy — the frontmatter check blocks on an entry in a path-valued field that
  points at nothing, so the placeholder converts an acceptable document into a refused one.
  The most helpful-looking implementation produces exactly the outcome INF-1300a exists to
  prevent.

  WHY NOT SIMPLY OMIT THE FIELD, WHICH WOULD PASS TODAY. Measured: no commit-time check
  currently enforces these obliged facts. A document of one of those three kinds that omits
  the fact passes everything. Omission is therefore the cheapest implementation and it is
  invisible — and it is wrong, because the project has declared the obligation, and a
  generator that quietly produces documents violating a declared obligation teaches every
  future author that the obligation is optional. That the enforcing check is missing is a
  real finding and is recorded on INF-1300a-4 as well; closing it belongs to the guardrail
  surface and is outside this L0's fence. This record honours the declaration regardless of
  whether anything polices it, which is also why its observation cannot lean on the check
  set.

  FALSIFIABILITY. For each kind the declaration marks as obliging a fact — enumerated from
  the declaration, not listed here — make two requests. Without the fact: the record is
  falsified if anything is written, if the refusal does not name both the kind and the fact,
  or if a document appears carrying a stand-in. With the fact: falsified if the value does
  not appear, or if the produced document fails any of the project's checks. Then change the
  declaration so a kind that obliged nothing now obliges a fact, change nothing else, and
  repeat: falsified if the request is still accepted without it. That last pair is what
  separates reading the declaration from carrying a private list of three kind names, and the
  private list is correct today and wrong at the next change. Note that the check set cannot
  observe the first arm, since nothing in it enforces the obligation — assert it directly
  against the produced artifact.

