id: ACD-1300a-2
title: Select the least urgent dependency-ready feature with stable ties
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given eligible features STATUS and SUMMARY both have effective priority low, REPORT has medium and ALERT has high
  And STATUS has an unmet external prerequisite while the other features are dependency-ready
  When the enabled worker has capacity to select work
  Then SUMMARY is selected before REPORT and ALERT
  And equal-priority dependency-ready features are ordered by their stable canonical feature identifiers
  And the selection explains its effective priority and the excluded prerequisite
  And this background ordering leaves the ordinary build queue policy unchanged
