notes: |
  Authored by /quick-fix from a field report: the Step 4.2 recipe was followed
  verbatim in a repository where a second session held a stash entry, and the
  unqualified `git stash pop` popped that session's entry. It was recovered from
  the stash commit's SHA, but only because foreign content showing up in the
  working tree was noticed — a silent loss was equally available.

  The parent BP-600c-3 is mechanism-agnostic: it requires the revert and the
  restore, not any particular way of performing them. Nothing in it has to
  change. This record constrains the how.

  The defect existed in two copies of the same instruction — the skill prose and
  the JS workflow's agent prompt — which is why the field report against the
  skill alone would have left the executing path untouched.
