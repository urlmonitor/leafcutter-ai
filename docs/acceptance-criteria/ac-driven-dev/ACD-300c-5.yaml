id: ACD-300c-5
components:
  - ac_driven_dev
readiness: approved
priority: high
title: "Every final-gate message names the test-design stage that now owns the final gate"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given the final gate of a /plan-feature run now follows the test-design stage, not the
    technical planner's stage,
  When the user is shown the final gate, cancels at the final gate, or the final commit fails,
  Then the final gate's heading names the test-design stage as the stage it follows,
  And the cancel message names the final gate as the test-design gate, as in
    "final gate (test design)", and does not contain "IT-PO" or "IT PO v3",
  And the commit-failure message names the stage "test-design", not "it-po",
  And the messages for the product owner, business analyst and technical planner gates are
    unchanged, character for character,
  And the workflow body's measured length after the change is no greater than before it,
  And given the user has chosen "edit" once at the final gate and the test-design stage
    has been re-invoked with the feedback,
  When the user chooses "edit" at the final gate a second time and the run aborts,
  Then the abort message names the test-design stage as the stage that did not produce
    satisfactory ACs after 2 attempts, as in "test-design failed to produce satisfactory
    ACs after 2 attempts. Pipeline aborted.", and the abort message, including its
    max-retries label, does not contain "it-po", "IT-PO" or "IT PO v3",
  And given instead the technical planner's stage fails its requirement rule check on
    its first attempt and again after its one re-invocation,
  When that stage's automatic gate aborts the run,
  Then the abort message still names that stage's agent, character for character
    "it-po failed to produce satisfactory ACs after 2 attempts. Pipeline aborted.",
    with the max-retries label "max-retries abort for it-po".
depends_on:
  - ACD-300c
  - ACD-2500c-2
doc_links:
