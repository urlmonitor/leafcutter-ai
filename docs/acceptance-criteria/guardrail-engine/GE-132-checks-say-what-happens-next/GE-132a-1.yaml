notes: |
  THE EXCUSED LIST is the ratchet that lets the rule land without first writing 49
  declarations. When this lands it holds exactly the checks that can refuse a commit and
  have no declaration (49 by the 2026-10-09 census; re-measure at build time and never
  hard-code the number). The third arm is what stops the list becoming the new place to
  put a check that has no declaration.

  THE STALE ARM WILL FIRE ON TODAY'S TREE. check-docstrings and check-ac-limits are routed
  but not registered. The change that builds this record must remove or correct those two
  rules in the same commit. DECIDED BY BRAINCANDY, 2026-10-09: the check-ac-limits rule is
  renamed to check-ticket-ac-limits. Its text, "per-file AC count limits", is that hook's
  ("Ticket AC Count Limits", hooks/check_ac_limits.py), not check-ac-tree-limits'.
  check-docstrings has no registered hook, so its rule is removed. BO-210a-2's criteria
  listed both stale ids as gating hooks. On BrainCandy's approval of 2026-10-09 they were
  amended through BO-210a-2's own amended_by entry, so blocking_hook_ids holds five ids.
  check-ticket-ac-limits is not added to that list, because the stale id never reached it
  either.

  BUILD NOTE: SAME COMMIT. The rules change, the blocking_hook_ids change,
  _EXPECTED_BLOCKING_HOOKS in unit_tests/commit_guardian/test_precommit_safety_net.py (five
  ids) and templates/skills/precommit-autofix/SKILL.md Step 4 (which lists "the seven
  gating hooks" by name) all land in one commit. The SKILL.md change is llm-expert prose in
  the same ticket.

  WHICH CHECKS COUNT: those that can refuse a commit (the census counts pre-commit
  judgment-tier gates). Checks that only rewrite a file and never refuse are out of
  scope. The tier boundary is the IT PO's to pin down.

  NAMED MUTATIONS.
  (1) THE SILENT DEFAULT: treat a check with no declaration as "author clears it".
      MUST GO RED: the second arm. MUST STAY GREEN: arms one and four, and every arm of
      GE-132a-2.
  (2) THE OPEN DOOR: accept additions to the excused list.
      MUST GO RED: the third arm only.
  (3) THE LEFTOVER: accept a declaration for an unregistered check.
      MUST GO RED: the fourth arm only.
