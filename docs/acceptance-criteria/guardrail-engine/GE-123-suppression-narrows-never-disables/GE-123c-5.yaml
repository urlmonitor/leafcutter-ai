it_requirements:
  - "Edit the canonical source at templates/skills/security-scanner/SKILL.md and let build.py propagate it. The deployed skill copies are build outputs; editing one of those leaves the shipped reference unchanged (ADR-001)."
  - "This document already carries the accepted-forms section that the neighbouring malformed-entry change last amended — extend that section rather than opening a second one, so the grammar has exactly one home."
  - "The rejected-forms list must be organised by the three parts of an entry, matching the way the check itself decides, so a reader can map a message they received onto the part that caused it."
  - "The rejection list must be derived from the shapes the check actually rejects at the time of writing, and the accepted list from the rule ids the scanner can actually report — not from this AC's prose. Where the reference and the implementation disagree, the implementation is authoritative and the disagreement is a defect to raise, not to document."
  - "Keep the grammar and the rejection list here and the task guidance in the sibling how-to. Two copies of a grammar drift."
  - "Examples must use ordinary source filenames and must not contain credential-shaped literals: this file is scanned on every commit, and a realistic-looking example would either trip the check or need a suppression of its own."
  - "Do not use an environment-file name as a generic example — the per-file scan short-circuits those and never reads their content, so the example would be unreachable."
  - "Documentation check for this AC: (1) for each of the three parts of an entry the document names what makes that part unusable, and states that such an entry is reported and ignored rather than silently loaded; (2) it states that an entry which cannot match anything is reported while an entry that merely matched nothing during a run is not, and gives the reason; (3) PARITY, BOTH DIRECTIONS — every rejected form listed is one the check rejects, and every accepted form presented is one the check accepts, checked against the shipped implementation rather than against the sibling ACs."
  - "Verification is by review against the shipped behaviour, not by an automated test. Do not author code tests for this AC."
test_required: false
test_rationale: |
  This AC changes prose only, so it carries no executable behaviour and
  test_required is false rather than test_spec being left empty. Its verification
  is the three-part documentation check recorded in it_requirements, the third part
  of which is a two-directional parity review against the shipped check: a
  reference that under-lists rejections leaves the reader to discover them, and one
  that over-lists them makes a working form look forbidden. Both produce the same
  outcome as the defect this L1 removes. That parity is currently a review
  obligation; mechanising it would need a code AC of its own, which is out of this
  AC's scope and is raised as a recommended follow-up.
