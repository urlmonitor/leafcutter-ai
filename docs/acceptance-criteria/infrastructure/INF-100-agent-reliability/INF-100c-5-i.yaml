criteria: |
  Given the feedback categories file lists "ac-validater" (a misspelling) in the
    allowed_writers of the blocker category,
  And no agent named "ac-validater" exists in the agent registry,
  When the package build runs,
  Then the build output reports "ac-validater" as a writer that names no registered agent,
  And the report names the category it appears in ("blocker"),
  And a writer that appears in three categories is reported once, naming all three
    categories,
  And writers that do name a registered agent (for example sql-coder and epic-supervisor)
    are not reported.
