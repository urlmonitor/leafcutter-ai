notes: |
  THE STRUCTURAL ARGUMENT FOR THIS L1, AND WHY IT IS NOT A DUPLICATE OF ACS-1400a.
  A per-commit check cannot see this class of defect, and no amount of hardening
  will change that. It is handed one commit's staged set; the fact in question is
  a property of the whole store. Even a perfect ACS-1400a is blind to a record
  that nobody is touching today. The two are different instruments, not two
  attempts at the same one.

  THE GAP IS WIRING, NOT CAPABILITY — do not let the BA specify a scanner. The
  scan exists, is correct, and has been correct since 2026-06-08 (ACS-100i-4).
  For fifteen months it has been able to answer this question and has been asked
  it only when a human remembered. That is the whole finding. An L2 that
  re-specifies detection logic is rebuilding working code and will drift from it.

  WHAT IS GENUINELY UNDECIDED, and what the BA should spend the L2 budget on:
  WHERE the answer goes and WHAT MAKES IT ACTIONABLE. A required CI gate that
  blocks merges on 47 pre-existing orphans is unshippable until ACS-1400c has run
  — sequence matters, and a gate that must be bypassed on day one is worse than no
  gate, because the bypass becomes the habit. Consider a reporting posture first
  and a blocking posture after reconciliation, and make that transition explicit
  rather than implied.

  A COUNT ALONE IS NOT AN ACTIONABLE ANSWER, and this tree is the proof. "47
  orphans" is true, and acting on it directly would have damaged the store: six of
  those records must never be repaired and twenty-five more carry a done-proof
  consequence. Whatever this L1 emits must distinguish drift from decision, or it
  will keep prompting exactly the unsafe repair described in ACS-1400c. That
  distinction depends on ACS-1200's parked-state signal existing — note the
  dependency rather than re-deriving a second way to detect deliberateness.

  THE FAILURE MODE TO DESIGN AGAINST IS NOISE, NOT MISSES. A weekly report nobody
  reads is indistinguishable in outcome from the silence we have now, and it costs
  more. Whatever cadence and channel are chosen, the criterion should bind to the
  answer REACHING someone, not to the job having executed.

  DOCUMENTATION: `[how-to]`. A person needs to know how to run the store-wide
  check on demand and how to read what comes back — particularly how to tell a
  deliberate exclusion from real drift, which is the judgement this whole tree
  turns on. No component-diagram: no new architectural layer, just wiring for a
  script that already exists.
