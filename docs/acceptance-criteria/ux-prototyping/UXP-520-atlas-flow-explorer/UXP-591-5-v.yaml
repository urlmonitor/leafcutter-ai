notes: |
  Owner ruling at the AC gate (2026-10-09), decision (2)(c): a Source, Kind or Realization change
  while the 'Flow not found' notice shows removes the notice, selects the first flow the selector
  lists under the new filters and replaces the current history entry with that flow's canonical
  URL. The flow leafcutter/explore-flows-in-atlas v5 does not yet model this behaviour (its
  'filterRepicksFlow' branch records it as not modelled), and the leafcutter/atlas-flows v3
  dataset's filter rule still assumes the previous state shows a graph; so no flow node maps to
  this AC and it carries no flow back-link. The selector order used in the Mock example is the
  dataset's (stored flows in Flow.id order), as in UXP-591-5-iii. Owner ruling 3 still holds: the
  filter change adds no history entry. UXP-591-5-ii's Back-onto-an-unknown-id clause concerns a
  'Flow not found' entry nobody changed a filter on; once a filter change replaces that entry, it
  returns as the re-picked flow.
