criteria: |
  Given 5 tickets have been moved to done/ since the last git tag:
    - ticket-1 with source_ac: BO-100a (changelog entry EXISTS)
    - ticket-2 with source_ac: BO-200a (changelog entry EXISTS)
    - ticket-3 with source_ac: BO-300a (changelog entry MISSING)
    - ticket-4 with source_ac: BO-400a (changelog entry EXISTS)
    - ticket-5 with no source_ac field (changelog entry MISSING)
  When the pre-release validation scan runs,
  Then it reports 2 tickets missing changelog entries:
    - ticket-3 (has source_ac but no corresponding entry file)
    - ticket-5 (has no source_ac and no entry file)
  And the report lists each missing ticket by path and source_ac (or "none")
  And the scan exits with a non-zero status code indicating validation failure
  And the release process does not proceed until the gaps are resolved.
