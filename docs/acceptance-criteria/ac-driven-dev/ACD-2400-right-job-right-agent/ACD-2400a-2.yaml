notes: |
  Mapping to the technical planner's current instructions (templates/agents/it-po.md),
  which ACD-2400e-2 removes once this ships:
    parent back-links             -> it-po "covered_by update protocol" (S3 split / S7)
    graph component list fix-up   -> it-po S7 write rules + S8 item 15
    readiness never approved      -> it-po S7 write rules + S8 item 12
    contract symmetry             -> it-po S5 steps 1-3 (presence of both sides only)
    documentation-trigger mapping -> it-po S7b Documentation Gate
    specialist-versus-surface     -> it-po S2.8 table (ACD-2400a-3, not here)
  "Most of the final self-check list" (L1 notes) is covered by the union of these six
  plus the existing record check; S8 items 6 (no weasel words) and 11 (caveats logged)
  are judgment and stay with the planner.

  SEMANTIC CONTRACT COMPATIBILITY STAYS WITH THE PLANNER (user decision 2 at PO gate;
  TKT-300a-3 "contract descriptions on both sides are compatible"). This check only
  asserts that both sides exist and point at each other.

  Safe-repair definition used here: the repair is fully determined by data already in
  the store and can only restore a documented invariant (append a missing id, fill an
  unambiguous id, restore a prior readiness). Anything else is reported.
