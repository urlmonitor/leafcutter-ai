criteria: |
  Given a project "shop" with a shared project whose main line has been fetched, and these
    workspaces of shop, each made by its workspace maker:
    - "ff-1", whose two commits reached the main line unchanged (fast-forward merge),
    - "mc-1", whose two commits reached the main line through a merge commit,
    - "sq-1", whose three commits reached the main line only as one combined commit with
      the same content under a new identifier (squash merge),
    - "open-1", whose two commits are pushed to its own line on the shared project but
      have not reached the main line (pull request open),
    - "landed-dirty", whose commits reached the main line, holding one uncommitted change
      to a tracked file,
    - "landed-plus", whose first commit reached the main line, carrying one further commit
      that is on neither its own line on the shared project nor the main line,
    - "fresh-1", made from the main line tip an hour ago and carrying no commit of its own yet,
    - "idle-1", made from an earlier main line commit eight days ago, carrying no commit of
      its own, holding nothing uncommitted, with no file in it changed for eight days,
  And a project "blog" in the same parent folder with a workspace "ff-9" whose commits
    reached blog's main line,
  And shop's main checkout, on its main line with nothing uncommitted,
  When the landed-work pass is run for shop with no person available and no input given,
  Then "ff-1", "mc-1", "sq-1" and "idle-1" are cleared, each through the same clearing door a single
    clearing request uses, and no folder of them remains,
  And "open-1", "landed-dirty", "landed-plus" and "fresh-1" are each identical before and
    after,
  And blog's "ff-9" and shop's main checkout are identical before and after, and neither
    appears in the pass's answer,
  And every line of work on the shared project, and the shared main line, are identical
    before and after,
  And the pass ends with exactly one answer, without asking any question, which lists each
    cleared workspace by work name and location, and each kept workspace by work name,
    location and reason: "open-1" as not yet on the main line, "landed-dirty" as holding
    unsent work naming the file by path, "landed-plus" as holding unsent work naming the
    commit by identifier, and "fresh-1" as carrying no work of its own yet and idle for
    less than seven days.
