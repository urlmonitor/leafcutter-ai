it_requirements:
  reference_file_path: "scripts/ac_store/generate_ticket_from_ac.py"
  n_location_rule: "3 enforcement points across 2 executable surfaces, all of which must change.
    In scripts/ac_store/generate_ticket_from_ac.py: (1) the surface derivation (_build_files_touched,
    line 535), which must return a determination rather than a bare list, and (2) the self-check
    that reports it (lines 2790-2793), which today records 'files_touched has N path(s)' as a PASS
    on any non-empty list — a membership fix applied to the derivation alone still reports a partial
    surface as a PASS, which is criterion clause 3's exact target. In templates/agents/build-ac.md:
    (3) EVERY place the coordinator renders a build-approval prompt — Step 3 (line 511), the
    Step 2b.2 connected-set variant (line 468), the Step 2c epic variant (line 499), and the
    post-review re-ask (line 546). Treat (3) as 'all': a statement shown at Step 3 but omitted from
    the post-review re-ask is absent at exactly the moment a cautious approver — the one who chose
    'review' — is asked to commit. templates/skills/build-ac/SKILL.md's §2 and §3 output contracts
    must be updated to match (3), but they are documentation of the prompt, not a fourth
    enforcement point. The load-bearing one is (3): (1) and (2) can both be correct while the
    approver still sees nothing."
  required_skills:
    - python-coder
    - llm-expert
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/ac_store/ -q"
  config_schema_fragment:
    type: object
    description: "The outcome of the surface derivation, made explicit. Today the derivation returns a bare list and the caller cannot distinguish 'this is the surface' from 'this is what I could scrape'. The third criterion clause requires those two to be different observable outcomes, so the derivation must return a determination, not just paths. Nothing is added to any AC record — the ~3,100 existing records and their authoring convention are untouched by this AC; changing what an author may declare is ACD-1600g's, and narrowing what may enter the surface is BP-1100a-4's."
    required:
      - paths
      - determination
    properties:
      paths:
        type: array
        items:
          type: string
        description: "The files the requirement says its work changes. Must contain the runnable file the record names first among the files it changes, and every other file the record says will change. Must not silently absorb paths the record merely references — that negative half is BP-1100a-4's and must not be pre-empted here beyond leaving room for it."
      determination:
        type: string
        enum:
          - determined
          - undetermined
        description: "undetermined is the new outcome and the load-bearing one. It means the record offered no way to tell which of the files it references will change. It is NOT the same as an empty list: an empty list is visible, a confidently wrong four-path list reads as scope. When undetermined, the ticket must say so where a driver reads it before dispatching a coder, and the generator's self-check must not record a PASS."
      undetermined_reason:
        type: string
        description: "Required when determination is undetermined. Names why the surface could not be settled — e.g. no doc_link carries an edit-surface relationship and it_requirements is the prose form — so the author can fix the record rather than guess."
  constraints:
    - "THE RELAY CHANNEL AND THE RELAY OBLIGATION, NAMED (2026-08-19; this is the route chosen for
      criterion clause 2). The generator must emit the undetermined-surface statement AND its reason
      on a channel the coordinator can read without parsing the ticket body — a single, stably
      formatted block on the generator's own stdout, alongside the ticket path the coordinator
      already captures. The coordinator (templates/agents/build-ac.md) must then be obliged to
      reproduce that block IMMEDIATELY ABOVE the 'Build this ticket now? / Build this epic now?'
      question, at every one of the four places it asks. Both halves are required and both are in
      this AC's declared surface: an emitted-but-unrelayed statement and a relay instruction with
      nothing to relay each satisfy exactly half a criterion. Do NOT satisfy the relay by telling the
      coordinator to open and grep the generated ticket — that is 'a further check to go and find
      it', which clause 2 excludes in terms."
    - "The membership rule must be fixed in the DERIVATION, not in the fixture. Retagging BO-2400g-2's doc_links repairs that one record's output and leaves every other all-'describes' record dropping its primary file. The AC's observable is the derivation's behaviour over a record shaped like BO-2400g-2, not BO-2400g-2 itself."
    - "Do NOT widen _EDIT_SURFACE_RELATIONSHIPS. docs/how-to/ac-traceability-store.md states explicitly that 'describes' and 'related' are excluded by design and that the remedy is to re-tag the doc_link, not to edit the constant. Adding 'describes' to that set would pull every reference page into every surface and convert this defect into its mirror image."
    - "An undetermined surface must degrade LOUDLY. The generator's self-check (lines 2790-2793) records 'files_touched has N path(s)' as a PASS and warns only when the list is EMPTY, so a confidently wrong four-path list reports as a pass today. A partial surface presented as complete is worse than an empty one: the empty one is visible, the partial one reads as scope."
    - "The announcement must land where the driver reads it before dispatching a coder — the generated ticket, the generator's own report, AND the coordinator's approval prompt — not only in a log line or a return value. A correct determination nobody sees is the same observable as no determination at all."
    - "THE COORDINATOR RUNS FROM THE DEPLOYED LAYOUT, NOT THE SOURCE TREE. templates/agents/build-ac.md
      and templates/skills/build-ac/SKILL.md are build inputs; the agent that actually renders the
      prompt is the deployed copy under .claude/. Run scripts/build.py before believing the relay
      works, and assert on the deployed artifact — an edit to templates/ alone changes nothing an
      approver will ever see, which is this AC's own failure mode wearing a build-layout costume."
    - "MIXED-TECHNOLOGY SURFACE — assigned_agent is python-coder but two of the three edit-surface
      files are prose agent/skill templates that python-coder does not own. The coordinator and
      SKILL.md edits belong to llm-expert (both are named in required_skills). This was NOT split
      into two ACs: the coordinator change is a handful of lines added to one prompt block and its
      documented contract, and splitting would produce a child AC whose criteria are 'print the line
      the other child computed' — trivial by the S3 test, and it would put the emit and the relay in
      separate tickets, which is precisely the half-satisfaction the constraint above forbids. A
      driver dispatching this ticket must give the coordinator edit to llm-expert rather than let
      python-coder improvise prose in an agent template."
    - "Records that already emit a correct surface must keep emitting it byte-identically. BO-2400e-3's structured form produces exactly scripts/build_orchestration/fast_lane.py today; regenerating it after this change must produce the same single entry. Verify by regenerating a set of real ACs before and after and diffing the files_touched blocks."
    - "Do not pre-empt BP-1100a-4. This AC adds a reliable positive source; narrowing what may enter the surface is the next AC and is ordered after this one deliberately, because narrowing first would produce empty surfaces. An implementation that also strips the prose fallback in this change makes the two ACs indistinguishable and removes the ordering that protects against empty surfaces."
    - "Point any test at a COPY of the store. The generator writes an implemented_by back-reference into the source AC, so a test run against docs/acceptance-criteria mutates the real store."
    - "STALE-DOC CAVEAT, DISCHARGED TO BP-1100a-5. docs/how-to/ac-traceability-store.md documents the current two-source derivation and the --verify count caveat verbatim; once this AC and BP-1100a-4 land, that section is stale. It is deliberately NOT in this AC's surface — the criteria are about the generated ticket and the approval prompt only. BP-1100a-5 owns the page and depends on both."
delivers_to:
  agent: python-coder
  contract: "Two things, and both are consumed. (1) For BP-1100a-4: a surface derivation that returns both the paths the requirement says its work changes and an explicit determined/undetermined outcome with a reason. Narrowing what may enter the surface is only safe once a reliable positive source exists, which is why the two are ordered rather than merged. (2) For the /build-ac coordinator: a stably formatted undetermined-surface block on the generator's stdout, adjacent to the ticket path the coordinator already captures, which the coordinator reproduces verbatim immediately above every build-approval question it asks. The block is the contract — its format must not change without changing the coordinator in the same commit, because the coordinator relays it rather than parsing it."
expects_from: null
test_required: true
test_spec:
  - name: test_the_runnable_file_the_requirement_changes_is_named_in_the_generated_surface
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: criterion
    covers: [BP-1100a-3]
    description: "Over a fixture shaped exactly like BO-2400g-2 — all doc_links 'describes'/'related', list-form it_requirements — the ticket the real generator writes names the primary runnable file in files_touched. Today that file is dropped and the emitted surface is 100% prose-scraped."
  - name: test_every_other_file_the_requirement_says_will_change_is_also_named
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: criterion
    covers: [BP-1100a-3]
    description: "The second changed file is present too, not just the first-named one. Separate from the test above because a fix that promotes only the leading doc_link satisfies the primary-file clause and still drops the rest — BO-2400g-2 loses two files, not one."
  - name: test_an_undeterminable_surface_is_announced_rather_than_assembled
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: boundary
    covers: [BP-1100a-3]
    description: "THE THIRD CLAUSE. A record that offers no way to tell which referenced files change produces a ticket stating its surface could not be determined, in a place read before a coder is dispatched — and does NOT quietly emit a surface assembled from whatever paths it mentioned. Both halves asserted: an announcement alongside a confident four-path list fails."
  - name: test_the_undetermined_statement_reaches_the_approver_not_only_the_ticket_body
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: reachability
    covers: [BP-1100a-3]
    description: "CLAUSE 2, AND THE ONLY DESCRIPTOR THAT FAILS WHEN THE STATEMENT STOPS AT THE TICKET. Two assertions, both required, over an undeterminable fixture. (a) CHANNEL: run the real generator command line and assert the undetermined-surface block and its reason appear on the stdout the coordinator captures — a run whose statement is present in the written ticket but absent from that channel FAILS here while passing test_an_undeterminable_surface_is_announced_rather_than_assembled, which is exactly the gap this descriptor exists to catch. (b) RELAY: assert the DEPLOYED coordinator (.claude/agents/build-ac.md, after scripts/build.py — not the templates/ source) reproduces that block immediately above every build-approval question it renders: Step 3, the Step 2b.2 connected-set variant, the Step 2c epic variant, and the post-review re-ask. A relay wired into Step 3 only fails (b), because the approver who answered 'review' is asked again without it. Do NOT accept an instruction telling the coordinator to open the ticket and look — clause 2 excludes 'a further check to go and find it' in terms, so a relay that reads the ticket body fails (b) even though the text would eventually be visible."
  - name: test_a_partial_surface_is_not_reported_as_a_passing_check
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: failure
    covers: [BP-1100a-3]
    description: "The generator's own self-check must not record a PASS for an undetermined surface. Today lines 2790-2793 pass on any non-empty list, so a confidently wrong four-path list reports green — a fix to the derivation alone leaves that report unchanged and the driver none the wiser."
  - name: test_a_record_that_already_emits_a_correct_surface_is_unchanged
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: real_artifact
    covers: [BP-1100a-3]
    description: "NEGATIVE CONTROL over real records. BO-2400e-3's structured form emits exactly scripts/build_orchestration/fast_lane.py today; after the change it must emit the same single entry. A derivation that fixes the omission by widening what qualifies passes every positive test above and pulls reference pages into every surface."
  - name: test_the_surface_is_asserted_on_the_ticket_the_real_generator_wrote
    target_dir: unit_tests/ac_store/
    framework: pytest
    type: behavioral
    angle: reachability
    covers: [BP-1100a-3]
    description: "PRODUCTION ENTRY POINT: runs the real generator command line over a COPY of a store and reads files_touched out of the frontmatter it actually wrote. A test that calls the derivation directly passes on a corrected function the ticket writer never consults. Use a copy — the generator writes an implemented_by back-reference into the source AC."
test_rationale: |
  The observable is the WRITTEN TICKET, never the generator's source. A test that asserts
  the relationship set contains some value, or that the derivation function mentions a
  field, passes on every variant of this bug — including the variant that widens
  _EDIT_SURFACE_RELATIONSHIPS and thereby converts a dropped-primary-file defect into a
  reference-pages-in-every-surface defect. Every descriptor here therefore asserts on
  frontmatter the real generator emitted over a copy of a store.
  The two positive clauses are split into two tests because they fail independently: a fix
  that promotes only the first-named doc_link satisfies "the primary file is present" and
  still drops the second changed file, and BO-2400g-2 loses two.
  The undetermined clause gets both a ticket-level test and a self-check test because the
  announcement and the verdict are separate surfaces and the natural fix touches only the
  first. Lines 2790-2793 pass on any non-empty list, so a derivation that correctly marks a
  surface undetermined while the self-check keeps printing PASS leaves the driver reading
  exactly today's green report.
  CLAUSE 2 GETS A THIRD, SEPARATE DESCRIPTOR (added 2026-08-19), and the split is not
  cosmetic: the ticket-level descriptor and the self-check descriptor are both satisfiable
  by a change confined to generate_ticket_from_ac.py, and a build approver would still see
  nothing. The approver-facing test therefore asserts on a different surface entirely —
  the generator's stdout channel and the deployed coordinator that relays it — and is the
  only descriptor in this contract that goes red when the statement stops at the ticket
  body. Its two halves are also opposed on purpose: (a) alone passes on an emitted block
  nobody relays, (b) alone passes on a relay instruction with nothing to relay.
  The BO-2400e-3 negative control is mandatory rather than optional. The cheapest way to
  make the primary file appear is to widen what qualifies as an edit surface, which the
  how-to explicitly forbids and which passes every positive test in this contract. Only a
  real record whose correct output must stay identical can reject it.
