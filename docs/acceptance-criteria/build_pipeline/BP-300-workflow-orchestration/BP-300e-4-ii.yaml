test_spec:
  - name: test_every_reading_point_either_halts_or_uses_its_declared_substitute
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "Executing one run per reply-reading point with a prose-only reply substituted at that point only, every point lands in exactly one of two observed states: the run stops with the typed stage/agent error and issues no later dispatch, or it continues and the value carried forward equals the substitute its register entry declares."
  - name: test_no_reading_point_continues_without_recording_the_degradation
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "For every point whose executed run continued, the run's reported outcomes contain a degradation record naming that stage; a run that continued while reporting nothing, or while reporting that stage as having produced its result, fails the assertion — this is the third-behaviour prohibition."
  - name: test_every_register_entry_is_exercised_by_the_sweep
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "Each entry in a workflow's declared degradation register is matched to at least one executed run that actually degraded at that entry's stage, so register coverage is measured by observed degradations rather than by counting entries."
  - name: test_unreached_register_entry_is_reported_as_stale
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "With a register entry naming a stage no run reaches, the sweep reports that entry as stale and names it, and the stale count is reported separately from the pass count, so the sweep cannot go green on a register entry granting an exception to nothing."
  - name: test_undeclared_degradation_is_reported_with_workflow_and_stage
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "A reply-reading point whose executed run continues on a substitute while absent from the register is reported as an undeclared degradation carrying both the workflow name and the stage name, and is not reported as a halting point or as a declared entry."
  - name: test_undeclared_degradation_count_is_one_number_that_cannot_increase
    target_dir: unit_tests/workflows/
    framework: unittest
    type: behavioral
    description: "The sweep yields the undeclared-degradation total as a single integer asserted one-directionally against the checked-in baseline: a run observing more undeclared degradations than the baseline fails, and a run observing fewer fails until the baseline is lowered in the same change."
