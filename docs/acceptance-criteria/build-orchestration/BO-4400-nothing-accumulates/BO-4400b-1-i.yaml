id: BO-4400b-1-i
title: "Clearing one workspace never removes what belongs to another workspace or to the main copy"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given two workspaces "ws-a" and "ws-b" and the project's main copy, each with its own
    stored look-up of the requirements store, its own Python environment in the user's
    shared Poetry environments folder and its own web development server cache, where
    "ws-a" and "ws-b" have names sharing the prefix "ws-",
  When "ws-a" is cleared through the one shared clearing door,
  Then every one of "ws-b"'s and the main copy's items exists afterwards and is
    byte-identical to its state before,
  And "ws-b" still carries the verdict it carried before,
  And the door's answer lists no item belonging to "ws-b" or to the main copy.
depends_on: [BO-4400b-1]
doc_links:
  - path: docs/acceptance-criteria/build-orchestration/BO-1800-isolated-parallel-delivery/BO-1800d.yaml
    relationship: constrains
    status: exists
    relevance: Housekeeping never disturbs work in flight.
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: BO-4400b-1
  contract: "Outside-artifact removal keyed to the cleared workspace."
package_surface: false
it_requirements:
  - >-
    Every inventory matcher selects items by the cleared workspace's exact identity (derived
    environment name, exact path, exact branch); no prefix, glob or project-name match anywhere in
    the remove path.
  - >-
    Removal never touches the main copy's own items or another workspace's items, and never changes
    another workspace's verdict inputs (its branch, index, refs or marker).
  - >-
    PROOF: deployed maker as a separate process; ws-a, ws-b and the main copy each get real items
    (a Poetry-named environment folder per path, an index cache file, a cache folder) in a
    temporary HOME; byte-identity checked by hashing every file of every surviving item before and
    after.
test_required: true
test_spec:
  - name: test_clearing_ws_a_leaves_ws_b_and_main_items_byte_identical
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: "After clearing ws-a, every item of ws-b and of the main copy exists with identical content."
    must_catch:
      - "removing by glob on the project name or the ws- prefix"
  - name: test_ws_b_verdict_unchanged_after_ws_a_cleared
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "ws-b's verdict from the listing is the same before and after."
  - name: test_remove_answer_lists_no_item_of_ws_b_or_main
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: seam
    description: "No entry in the answer's removed_items points into ws-b's or the main copy's items."
test_rationale: >-
  Look-alike names are the trap (Poetry suffixes a hash to the same project name), so only real
  look-alike items side by side show the matcher is exact.
origin_agent: business-analyst
created: 2026-10-09
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
notes: |
  Shared caches are keyed by name or path hash; a prefix or glob match is the plausible wrong
  version (Poetry names environments "<project>-<hash>-py3.x", so several workspaces of the
  same project look alike). Named wrong version: removing by glob on the project name --
  ws-b's environment disappears and this record goes red while BO-4400b-1 stays green.
