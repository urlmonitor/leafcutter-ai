id: TQ-400d-1
components:
  - testing_quality
  - ac_store
title: "The unproven-finished pile is a worked list that declares its population and carries a decision on each item"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a completed sweep that has identified the population of finished records
    which cannot be proven,
  When that population is presented for triage,
  Then every record in it carries either one of the fixed decisions — prove it,
    redo it, or retire it — or is explicitly marked as not yet decided,
  And the number of records awaiting a decision is stated,
  And no record in the sweep's unproven population is missing from the list,
  And records the sweep found proven or exempt do not appear in the list,
  And the list declares the POPULATION it draws from and the INCLUSION RULE by which a
    record entered it — which store root was enumerated, which record levels were
    included, what makes a record count as finished, what makes a finished record count
    as unproven, and the date the population was measured — stated with the list itself
    rather than left to be inferred from the count,
  And the list states which of the already-recorded counts of this same pile it
    continues, and why the others differ, instead of adding another unattributed figure:
    244 of 607 (measured 2026-08-13, all record levels, identifiers quote-stripped before
    joining, recorded by KM-ADM-005 and frozen as the ratchet's high-water mark), 240 of
    641 (measured 2026-08-17, finished L2 and L3 records only, recorded in TQ-400's
    notes) and 259 of 641 (measured 2026-08-17, recorded as this record's own authoring
    scale) are three measurements of one pile whose inclusion rules and dates differ,
  And the join between finished records and the tests that carry their coverage tag is
    made on NORMALISED identifiers — a record whose identifier is written with
    surrounding quotes matches the bare token a coverage tag carries — so no record
    enters the pile on formatting variance alone, and the list names that normalisation
    as part of its inclusion rule,
  And a count of this pile reported without its inclusion rule and its measurement date
    does not satisfy this criterion, the bug symptom being that a second count is read as
    movement: a reader seeing 244 and then 240 cannot tell whether four records were
    proven, whether the denominator changed, or whether one pile was simply counted twice
    under two different rules.
depends_on:
  - TQ-400d
  - TQ-400a-4
  - TQ-400e-3
