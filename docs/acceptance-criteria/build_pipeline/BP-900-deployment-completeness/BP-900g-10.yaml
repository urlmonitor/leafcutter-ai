notes: |
  HOLE B, runtime half — the backstop for everything the build-time guards miss.

  WHY A RUNTIME AC IS NEEDED AT ALL WHEN BP-900g-8 EXISTS. g-8 makes the build refuse
  to ship an incomplete tree. It cannot cover an install that was produced by an older
  build, an install a consumer has edited, or a dependency that is present but
  unreadable. More importantly, the two guards fail independently: g-8 is a static
  closure over what the code appears to resolve, and dynamic loaders are exactly the
  case a static closure is weakest on. If g-8's closure misses a reference, this AC is
  the only thing standing between the miss and a silently wrong artifact.

  THE DISTINCTION THIS AC TURNS ON. CLAUDE.md's Error Handling Policy Rule 3 permits
  an except block to EITHER log at WARNING or re-raise. The live defect satisfies that
  rule and is still a silent-degradation bug, because the choice was made against a
  dependency the output's correctness depends on. This AC narrows the rule for that
  class only: where the caller's output is wrong without the dependency, logging is
  not one of the two acceptable options. It does not disturb Rule 3 for optional
  dependencies, caches, or telemetry, where degrading is correct.

  TEST ANGLES for it-po. Floor: criterion + reachability. `deployed` and
  `real_artifact` are both triggered and are covered by the same subprocess test —
  build into a temp target, delete the dependency, run the deployed entry point cold
  against a real on-disk AC file. `failure` is triggered (the AC names an error path
  and a fail-open/fail-closed contract) and is the load-bearing angle here rather than
  an optional extra. The must_block modifier attaches to the reachability entry.

  THE NEGATIVE CONTROL THAT MATTERS MOST. Assert the artifact is ABSENT on the failing
  path, not merely that the exit code is non-zero. A script that writes the degraded
  ticket and then exits non-zero has satisfied the exit-code assertion while leaving
  the same wrong file on disk for the next step to consume.

  DO NOT SATISFY THIS BY DEPLOYING THE ONE SIBLING. Adding
  _component_migration_map.py to the deploy map makes the live symptom disappear and
  leaves the fail-open loader in place for the next undeployed dependency. That is
  BP-900g-5's failure mode repeated: fixing the instances on the list while the
  mechanism that produced them stays as it was.

  ─────────────────────────────────────────────────────────────────────────────
  IT-PO ENRICHMENT NOTE (2026-08-17).

  ANGLE CAP RESOLUTION. Five angles are genuinely triggered here — criterion,
  reachability, deployed, real_artifact and failure — against a cap of four. `failure`
  is kept because the BA is right that it is load-bearing rather than decorative: the
  AC's whole subject is a fail-open/fail-closed contract, and the live code catches
  OSError, which covers absence and unreadability but not an unloadable module, so the
  three failure modes are not interchangeable. `real_artifact` is the one dropped as a
  LABEL, and its two substantive demands — a genuinely fresh subprocess, and a real
  on-disk AC file as input — are written into entries 3 and 4 as hard conditions and
  repeated in it_requirements.constraints. They are not negotiable; they simply do not
  occupy a slot. This is recorded explicitly so a later reader does not mistake the
  missing label for a dropped requirement.

  declares_side_effect: true IS SET, and this is the only record in the set of seven
  where it is. The distinction from its siblings is not stylistic. BP-900g-7, -8 and -9
  are build-time guards whose observable is a build exit code — force-routing a surface
  smoker at them would be the "a derivation that marks everything is indistinguishable
  from one that marks nothing" failure BO-2900g-2 warns about. This AC's Then clauses
  are about a durable artifact written into a consumer install: a generated ticket file,
  whose `components` list the knowledge graph reads. That is a real observable outside
  the process, on a surface a consumer sees, and the failing-path clause is precisely a
  claim about a file NOT existing. It is exactly what the field is for.

  n_location_rule IS 'all' DELIBERATELY. The Because clause names one loader at ~328/334
  and the temptation is to treat that line as the work. The criterion is a class rule:
  every runtime load in generate_ticket_from_ac.py whose failure is currently absorbed
  into a neutral default must be classified REQUIRED or OPTIONAL and handled per class,
  with the findings enumerated in the sign-off. Point-fixing the named line reproduces
  the history BP-900g-8's criteria cite — three instances fixed one at a time, warning
  comments left behind, and a fourth live at HEAD.
