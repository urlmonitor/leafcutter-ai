id: BO-4100d-3
title: "The account of the workspace is read back off what exists, not repeated from the request"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given creation has finished and is about to report what it made,
  When the report is produced,
  Then the branch name and the kind of work it states are read from the branch
    that now exists, not from the request,
  And given the branch that exists differs in name or in kind from what was
    requested, creation reports failure and states both the requested value and
    the value that exists,
  And no report states success while naming a branch that is absent from the
    branch list.
depends_on: [BO-4100d, BO-4100d-1]
