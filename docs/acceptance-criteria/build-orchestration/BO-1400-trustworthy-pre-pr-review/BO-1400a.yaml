id: BO-1400a
readiness: approved
priority: high
title: "The review checks bold claims against the real data and confirms the work will actually ship"
component: build-orchestration
level: L1
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Sweeping data claims get checked against the live data, and delivered work gets checked for real reach.

  When a change asserts something about a whole body of records (for example "every
  record still fits the new shape"), the review confirms that against the real store
  rather than a sample, and when a change adds something users are meant to receive,
  the review confirms it is placed where a clean install would actually pick it up --
  so a change can never pass while secretly rejecting the bulk of real data or being
  undeployable.
