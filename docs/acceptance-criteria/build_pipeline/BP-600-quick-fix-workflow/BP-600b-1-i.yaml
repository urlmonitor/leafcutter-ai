criteria: |
  Given the AC store already contains BP-001.yaml with criteria describing
    "_resolve_precommit_cmd returns None when no executable is found",
  When the user invokes /quick-fix with a diagnosis that describes the
    same behavioral criterion,
  Then the workflow warns the user that an existing AC (BP-001) appears
    to cover this behavior,
  And it offers to proceed with a new AC or reuse the existing one,
  And it does not silently create a duplicate AC.
