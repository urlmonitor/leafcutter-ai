notes: |
  This record is the carve-out that keeps BO-1800f honest. A rule that refused every
  removal would read as strictly safer and would be wrong in a way this repo has
  already paid for: CLAUDE.md records an occasion where a branch's real, intended
  removal was read as something dropped by accident and was nearly put back, which
  would have silently reversed the change the branch existed to make. Taking things
  away on purpose has to remain possible, or the guarantee is routed around.

  Falsifiability. The single mixed fixture is what makes this record impossible to
  satisfy by accident, because it separates four behaviours that a one-sided fixture
  cannot tell apart:

    - refuse every removal            -- fails, because it names A and blocks the
                                         second delivery
    - allow every removal             -- fails, because it does not name B
    - allow all removals once any one -- fails, because it does not name B
      has been declared
    - adjudicate each removal against -- the only behaviour that passes
      what was declared

  The assertions are on which paths the refusal names and on whether A is absent
  from the delivered result, both observable by running the behaviour over the
  fixture.
