- Commands shown are exactly the deployed maker's CLI as built (BO-4300a-1 / BO-4300c-2); no hand-written
  alternative recipe, no symlink or copy steps.
- 'Location: docs/how-to/clear-a-workspace.md; linked from get-a-workspace.md. Documents locate, remove,
  the UNSENT_WORK refusal lists, delivering work first, and the up-front discard authorisation as decided
  (Q8, user 2026-09-28): the refusal returns a one-time discard_token bound to that workspace and exactly
  the listed unsent work; to discard, repeat the remove with --discard-token <that token>; a token does
  not work for another workspace or once anything unsent changes (ask again for a fresh one); there is
  no environment variable, config setting or remembered answer that authorises a discard.'
