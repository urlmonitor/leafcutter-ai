# Post-merge hold -- the required check `Post-merge suite status` (TQ-600a-13-vi).
#
# A pull request to main is held while the latest settled run of post-merge-suite.yml on
# main is not green. The verdict comes from the run history, read fresh on every
# evaluation; the post-merge-red issue is a notice for people and never the gate.
#
# TRUST MODEL. `pull_request_target` runs THIS FILE FROM THE DEFAULT BRANCH, and the
# checkout below has no `ref`, so it fetches the default branch too: a pull request that
# edits the hold or its module cannot change its own verdict. The job holds write tokens
# on pull requests from forks, so it must never check out, install, build or execute
# anything from the pull request, and no `${{ }}` expression carrying pull-request text
# may appear in a run: line (the only pull-request value used in the workflow itself is
# the number, as a concurrency key, which is safe there). The module reads exactly three
# values from the event file, in Python and never through a shell: the pull request
# number, the head sha (used only when it is 40 lowercase hex characters) and the
# description (looked at only for a declaration of a fix, TQ-600a-13-viii; never echoed).
#
# SHAPE. Exactly one job, named `Post-merge hold evaluation` (NOT the required name: the
# required check `Post-merge suite status` is a check run the dedicated hold App
# publishes on the pull request's head, TQ-600a-13-vi), with no `if`, no `needs`, no
# matrix and no path filter: a skipped job publishes no check at all, and a filtered
# workflow leaves the check pending forever. The job runs in environment
# `post-merge-hold`, which holds the App's two secrets (HOLD_APP_ID,
# HOLD_APP_PRIVATE_KEY); they are named only in the step after the checkout.
#
# PERMISSIONS. `issues: write` (TQ-600a-13-viii records an exemption on the notice) and
# `pull-requests: write` (TQ-600a-13-vii's comment) are fixed by the AC's contract for
# this job. The verdict is computed from reads only; the one write the step then makes
# is its single comment on the pull request (created once, edited in place, TQ-600a-13-vii). After 2026-11-02 GitHub blocks
# `pull_request_target` here unless an Actions event policy allows it (TQ-600a-13-x), so
# this check stays advisory until then.

name: Post-merge hold

"on":
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [main]

permissions: {}

jobs:
  hold:
    name: Post-merge hold evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: post-merge-hold
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    concurrency:
      group: post-merge-hold-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The DEFAULT branch's scripts/ci only (it carries the tunables file too).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
          fetch-depth: 1

      - name: Evaluate the post-merge suite status
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HOLD_APP_ID: ${{ secrets.HOLD_APP_ID }}
          HOLD_APP_PRIVATE_KEY: ${{ secrets.HOLD_APP_PRIVATE_KEY }}
        run: |
          # Sign the App's RS256 JWT (iss = App ID, 9 minutes) with openssl. The key is moved at once into an
          # UNEXPORTED shell variable and unset from the environment, so no child process (openssl, tr, date,
          # python) ever has it; openssl reads it through a process substitution built by the printf builtin
          # (a pipe: no file, no argument). The JWT goes to Python on stdin (printf is a builtin too, so it is
          # in no argument list) and is never in an environment variable, a file or a log.
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          key=$HOLD_APP_PRIVATE_KEY
          unset HOLD_APP_PRIVATE_KEY
          jwt=""
          key_set=0
          if [ -n "$key" ]; then key_set=1; fi
          case "$HOLD_APP_ID" in ''|*[!0-9]*) id_ok=0 ;; *) id_ok=1 ;; esac
          if [ "$key_set" = 1 ] && [ "$id_ok" = 1 ]; then
            now=$(date +%s)
            header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
            payload=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$((now-60))" "$((now+540))" "$HOLD_APP_ID" | b64)
            sig=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign <(printf '%s' "$key") -binary 2>/dev/null | b64)
            if [ -n "$header" ] && [ -n "$payload" ] && [ -n "$sig" ]; then jwt="$header.$payload.$sig"; fi
          fi
          unset key
          printf '%s\n' "$jwt" | HOLD_APP_KEY_SET="$key_set" python3 scripts/ci/post_merge_hold.py --publish
