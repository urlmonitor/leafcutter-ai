it_requirements:
  - "PUBLICATION MUST BE OBSERVED, NOT INFERRED FROM THE COMMIT PHASE'S REPORTED STATUS. This AC's whole subject is the case where the routing step succeeded and its writes were not carried, and the commit phase can report ok while a specific path was never staged — that is exactly what happens when the manifest INF-700a-5 requires is missing or incomplete. So the unwritten determination must come from asking the repository what the commit actually contains for each manifest path, after the commit, rather than from the commit agent's own return value. A run that trusts the reported status cannot detect its own failure mode and will report every record written, forever."
  - "THE TEARDOWN ANNOUNCEMENT HAS EXACTLY ONE HOST TODAY, AND THE OTHER PATHS NEED THE OTHER HALF OF THE CRITERION. Only finalize-feature removes a working directory (its step 7 worktree-agent dispatch at line 2276, after the step 7 probe at line 2250); the fast lane, quick-fix and both ticket drives leave theirs in place. So the removal-step announcement binds on finalize-feature, and on the other four paths the criterion's earlier clause — the reported result at the moment the driver reports finished — is the whole of the obligation. Do not manufacture a teardown hook on a path that has no teardown, and do not read the absence of one as the announcement not being owed."
  - "THE FAIL-OPEN HALF AND THE ANNOUNCEMENT HALF MUST BE IMPLEMENTED AS ONE THING, because each is a plausible way to break the other. An announcement that raises, retries, or gates the removal violates the never-block-the-work clause; a removal that proceeds without the announcement is the silence this record closes. In particular the announcement must not run inside anything that can abort the removal on its own failure — a report that cannot be produced must degrade to a shorter report, never to a halt."
  - "STATING ELIGIBILITY IS A READ OF THE BOOKKEEPING, AND THAT READ MUST NOT MUTATE IT. The criterion requires the announcement to say whether the record behind an unpublished write is still eligible. Answering that question means consulting the same state INF-700a-5-iii arbitrates over, from inside a teardown sequence, possibly while another unit of work is completing. The read must be non-destructive and must not take or hold anything another run waits on."
  - "Must handle errors gracefully per the project error handling policy."
