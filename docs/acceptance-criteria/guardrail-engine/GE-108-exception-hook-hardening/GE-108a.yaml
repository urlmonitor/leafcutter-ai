assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "ADR-FIRST: An accepted ADR documenting the enforcement-scope change (widening the I/O-boundary set to include subprocess.{run,Popen,call,check_call,check_output,getoutput}) and its false-positive tradeoffs MUST exist before implementation begins. The doc_link ADR-014-exception-guard-enforcement-scope.md is currently status: planned; authoring it is a blocking prerequisite for this leaf."
  - "BUILD-CONVENTION: The committable source of truth is templates/commit-guardian/check_exception_handling.py and templates/commit-guardian/commit_guardian.json. The scripts/commit_guardian/ copies are gitignored build output synced by `python leafcutter/scripts/build.py`. The fix MUST edit the template files and then rebuild; do NOT edit scripts/commit_guardian/ directly (ADR-001 self-hosting boundary)."
  - "PARITY: The guard's detected subprocess forms and the commit_guardian.json exception_handling.io_boundary_calls declared list must be kept in lockstep — every detected subprocess form is declared, and every declared form is detected. Verify the parity round-trips cleanly through build.py."
  - "AST-ONLY: Subprocess detection must remain purely AST-based — no regex fallback or text matching."
  - "SELF-HOSTING NON-REGRESSION: After the change, leafcutter's own production code must still commit cleanly — the widened detection must not flag legitimately try/except-wrapped or ADR-exempted subprocess usage in the codebase."
  - "The widened detection must be deterministic and idempotent: repeated analysis of the same file yields the same violations in the same line/col order."
