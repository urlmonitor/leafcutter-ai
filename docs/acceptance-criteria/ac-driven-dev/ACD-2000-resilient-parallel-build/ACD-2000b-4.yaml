test_spec:
  - name: test_two_requirements_touching_the_same_file_are_not_offered_together
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Builds a real four-requirement store and drives the real contention path -- the claim path where the rule is hosted, not a batch helper -- asserting the first and second are never concurrently held. If a requirement-grain batch selector exists by implementation time, assert it there too; if it does not, this test must still run against the live path rather than against a dormant one."
  - name: test_disjoint_requirements_may_be_offered_together
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Asserts the first and third ARE allowed to be held at the same time, so the rule above is about overlap and not a blanket serialisation. Runs against the same live path as the test above; a serialise-everything implementation must fail this."
  - name: test_requirement_with_no_derivable_footprint_is_never_offered_alongside_another
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "The fourth requirement, whose footprint derivation yields nothing, is never held at the same time as any other requirement -- including the disjoint third. Exercised through the live contention path, so a correct-looking intersection helper that is never consulted cannot pass this."
  - name: test_unenriched_requirement_is_treated_as_unknown_not_as_touching_nothing
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "A requirement with no it_requirements and only describes-relationship doc_links -- the shape every un-enriched record has -- is treated as conflicting, proving derived-empty is not read as safe. Note the host's existing default runs the other way (filter_already_claimed sends unknown candidates to to_build), so this test must be red before the change."
  - name: test_two_concurrent_choosers_never_take_an_overlapping_pair
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Two real processes take from the same store simultaneously via the real claim path, repeated; asserts no round ever ends with both holding requirements whose footprints intersect. This is the test that proves the rule fires in production, because the claim path is the one surface the shipping lane actually invokes -- treat it as the primary, not the last, of these five."
test_rationale: "Asserting that an intersection helper returns the right answer proves nothing about the clause most likely to be wrong: the empty case, where the mathematically correct intersection gives the operationally wrong verdict. So the empty-footprint case is driven through the real selection path twice -- once with a deliberately footprint-less requirement, once with the shape an un-enriched record actually has on disk -- and the disjoint pair is asserted alongside, so a serialise-everything implementation cannot pass. The fourth criterion is only observable with two real concurrent choosers: a single-planner test passes on a design that computes a perfect antichain and then fails the moment a second drive runs, which is precisely the state of the system today."
