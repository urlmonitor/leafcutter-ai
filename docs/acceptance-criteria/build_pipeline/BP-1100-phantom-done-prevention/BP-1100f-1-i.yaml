  - "Extends the BP-1100f-1 lens in templates/agents/pr-reviewer.md: a first argument that is an empty string or a whitespace-only string is treated as no instruction, the same outcome as a bare data payload."
  - "A non-empty, non-whitespace instruction string is not flagged on this ground — the guard must not become trivially satisfied by any string."
  - "Maintain spec-parity with BP-1100f-4's empty/whitespace handling and keep the rule portable per ADR-001."
