id: BP-900b-1-1
components:
  - build_pipeline
title: "Allowlisted external scripts do not trigger broken-reference failures"
component: build_pipeline
level: L3
status: active
req_status: approved
readiness: approved
priority: critical
work_status: done
criteria: |
  Given an agent template references a script path "scripts/external_tool.py"
  And that path is listed in the external-dependency allowlist
  (a configuration file or constant that the guard reads),
  When the guard cross-checks references against deployable scripts,
  Then the allowlisted reference is treated as resolved
  And it does NOT appear in the broken-reference list
  And the build exits zero (assuming no other broken references exist)
depends_on: [BP-900b-1]
doc_links:
  - path: scripts/build_propagation_audit.py
    relationship: extends
    status: exists
  - path: docs/architecture/components/template-compiler.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
  config_schema_fragment:
    type: array
    items:
      type: string
    description: "Script paths referenced by templates that are external dependencies and must not be reported as broken references."
  reference_file_path: scripts/build_propagation_audit.py
  n_location_rule: "1 — EXTERNAL_DEPENDENCY_ALLOWLIST and its resolution"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "Allowlist must be configurable — not hardcoded inline in the guard logic"
    - "Allowlist location must be discoverable from the project configuration"
    - "Must handle errors gracefully if the allowlist file is missing or malformed"
  notes: |
    Coverage is real but INCIDENTAL (ac-audit 2026-08-17). Verified empirically:
    five references in the real package — scripts/build.py, scripts/epic_lock.py,
    scripts/inline_adr/append_entry.py, scripts/list_sql_helpers.py and
    scripts/scaffold/new_arch_doc.py — resolve ONLY via the allowlist, so
    deleting the allowlist union turns test_guard_exits_0_on_clean_package red.

    There is no DEDICATED allowlist test: every test that calls
    build_broken_ref_report passes allowlist=frozenset(), i.e. disables the
    feature under test. The malformed/missing-allowlist constraint is unasserted.
    A missing or malformed allowlist must fail loudly, not fail open — failing
    open to an empty allowlist floods the report with false positives, and
    failing open to allow-everything disables the guard entirely.
