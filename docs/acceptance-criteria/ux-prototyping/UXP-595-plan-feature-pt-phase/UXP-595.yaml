criteria: |
  As a product owner running /plan-feature, I want the workflow to author the
  product-truth artifacts a request needs — classifying the request, then drafting
  the mock data, mockups, and flow behind a review gate — before it derives the
  acceptance criteria, so the flow I approved is the reviewable source of truth the
  AC pipeline builds from, and the workflow degrades safely (never silently) when the
  product-truth store is unavailable.
