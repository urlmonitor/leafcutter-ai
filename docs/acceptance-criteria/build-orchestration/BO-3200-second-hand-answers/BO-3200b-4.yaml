assigned_agent: architecture-diagram-author
estimated_complexity: M
change_target: docs
risk_surface: internal
it_requirements:
  - "AGENT CHOICE IS DELIBERATE: architecture-diagram-author, the leaf author, not documentation-expert — the same rule applied to every documentation child in these two trees."
  - "THE OUTCOME BEING READ MUST BE ITS OWN INTERACTION. In the arrangement this replaces, the release was dispatched and the diagram would have looked complete; the missing element was a return arrow nobody consumed, which is invisible unless it is drawn. A diagram that stops at 'release performed' reproduces exactly the belief that let KI-BO-020 survive."
  - "THE STORE MUST BE DRAWN AS ONE THAT OUTLIVES THE RUN, distinct from the run's own scratch state. The observed harmlessness came entirely from the claim landing in a throwaway copy; a diagram that does not distinguish the two teaches the reader the accident rather than the rule."
  - "NO SPECIALIST MAY APPEAR AS THE PERFORMER OF THE RELEASE, as a declared property of the drawing, so it cannot be redrawn later into the shape this tree removed."
  - "BOTH the triggering failure AND the release outcome must appear as reaching the halt report, as two distinct contributions — that pairing is BO-3200b-2's whole content and is the thing a reader comes to this diagram for."
  - "The coherence claim must be enforced by an executable test comparing the diagram's declared interaction sequence, in order and in both directions, against the trace of a REAL run driven to a failure after the claim."
  - "The diagram page must declare its participants and ordered interactions in a machine-readable form so the coherence test reads data, not a picture."
  - "Must satisfy the repository's existing doc front-matter and component-vocabulary rules unchanged."
delivers_to: null
expects_from:
  - ac_id: BO-3200b-1
    contract: "The ordered failure-path trace of a real run — claim recorded in the outliving store, later step fails, release performed inline, per-item outcome produced — obtainable programmatically."
  - ac_id: BO-3200b-2
    contract: "The halt payload carrying both the triggering failure and the required-action outcome, so the diagram's final interactions can be checked against what the report actually contains."
test_spec:
  - name: test_bo_3200b_4_diagram_declares_the_full_ordered_failure_path
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "Parse the declared sequence and assert it contains, in order: claim recorded in the outliving store, later step fails, release performed by the guaranteeing layer, release outcome read as its own interaction, and both facts reaching the halt report."
  - name: test_bo_3200b_4_no_specialist_performs_the_release_in_the_drawing
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "Assert no declared interaction has a specialist as the performer of the release. Keeps the drawing from being redrawn into the arrangement this tree removed."
  - name: test_bo_3200b_4_diagram_matches_a_real_failure_run
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: "THE COHERENCE CHECK. Drive a real run to a failure after the claim, capture the ordered trace, and assert two-way ordered equality with the diagram's declared interactions — including that the outcome-read interaction actually occurred."
  - name: test_bo_3200b_4_diagram_page_passes_repo_doc_gates
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: deployed
    description: "The repository's real doc front-matter and component-vocabulary checks pass over the new page."
test_rationale: |
  The element that matters here is a return arrow that used to exist and was never consumed —
  a thing no reviewer notices, because a diagram missing it looks complete. So the coherence test
  compares the declared sequence against a real failure run and specifically requires the
  outcome-read interaction to have occurred, rather than trusting that the drawing is accurate
  because it is plausible.
  Deliberately NOT covered: layout and legibility, which are human judgement.
