    entries: {record: DecisionRecord (sha256 already checked against its index entry), score: float
    0..1 (overlap coefficient of content words, 4 places, >= memory.min_candidate_score), path: repo-relative
    POSIX ''docs/decisions/<id>.yaml'', superseded_by: tuple[str] derived from the index}; approver
    and approval date are record.approval.approved_by / approved_at; hit.superseded is true when any
    later record supersedes it. Empty list when memory is off, the index is missing or nothing matches.'
