notes: |
  Satisfies the reference-doc half of BO-3100e's documentation_triggers.

  This entry is load-bearing rather than decorative: BO-3100e-2 requires that a step
  nobody enumerated is still checked, which only holds if whoever writes the next
  step knows how to declare its result. An undocumented declaration format is a
  guarantee that steps will arrive undeclared, and BO-3100e-3 then blocks them —
  correct, but avoidably painful.

  The second scenario is the anti-drift clause: the documented format is exercised
  against a real build rather than asserted.

  assigned_agent deliberately unset — the reference surface belongs to the IT
  Product Owner's assignment pass.
