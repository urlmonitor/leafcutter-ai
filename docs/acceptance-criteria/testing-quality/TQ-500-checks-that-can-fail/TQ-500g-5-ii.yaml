notes: |
  Answers TQ-500g's sequence-diagram trigger. Documentation only — see the
  firewall in TQ-500g-5's notes. The branches mirror TQ-500g-1-i (happy path and
  survivor), -1-ii (did not load / not applied), -1-iii (cut short) and -2-i
