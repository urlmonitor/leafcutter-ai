notes: |
  SATISFIES ACS-1300b's documentation_triggers: [sequence-diagram]. The parent's notes
  give the reason for that choice and it is worth keeping in view: the subject is WHERE
  in a multi-actor flow the link gets written and which paths miss that point, which is
  a question only an interaction diagram answers legibly. No how-to here — this is
  behaviour that happens on its own, not a command anyone invokes.

  THE FIREWALL: this AC's deliverable is the diagram and nothing else. No behavioural AC
  in this tree may be closed by pointing at it. A diagram showing a hand-off that does
  not exist looks exactly like a diagram showing one that does.

  THE FOURTH CLAUSE IS THE ONE THAT KEEPS IT HONEST OVER TIME. A diagram drawn from the
  author's reading of the code drifts the moment a path is added; a diagram required to
  match the derived enumeration has a mechanical referent, and the mismatch is findable.

  THE FINAL CLAUSE IS A SCOPE FENCE, not a style note. The stale diagnosis this tree had
  to correct was about what the link-recording step searches. Drawing that detail here
  would re-seed it, and would put the shipped 2026-08-26 fix back on the table as though
  it were still open.
