id: UXP-700e-3-i
title: "A field being reshaped is read in both shapes and written in only the new one"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: approved
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given three journeys in which the expansion reference is written as a single value where a
    list is wanted, and no journey anywhere carries a branch outcome kind,
  When the record is read,
  Then a single value is accepted and read as a list holding one item,
  And a list is accepted as written,
  And an absent branch outcome kind is accepted while that field is being introduced, and is
    reported as a field to be filled rather than as a violation,
  And anything the record writes back uses only the new shape, so the older shape disappears as
    artifacts are rewritten rather than by one migration rewriting them all at once.
depends_on:
  - UXP-700e-3
