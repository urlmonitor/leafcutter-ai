roadmap_phase: phase_acbuild_3_migration
criteria: |
  Opt-in backfill: preview it first, safe to re-run, and it never reverts finished work.

  An optional migration fills in the new fields on an existing store on demand -- you can
  preview it before it changes anything, point it at whichever store you choose, run it more
  than once safely, and it preserves the notes people have written and leaves already-finished
  requirements finished. It never runs on its own during a build, because the store is your
  authored data.
