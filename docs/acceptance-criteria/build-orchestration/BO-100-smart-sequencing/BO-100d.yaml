criteria: |
  Before any ticket-supervisor is dispatched for an epic drive, the system
  verifies that the feedback/telemetry sink can actually be written to.
  If the sink is unreachable, the drive is hard-blocked — no tickets run —
  and the operator is told exactly which sink path failed and how to fix it.
  This prevents a drive from completing while every feedback submission fails
  silently, which would leave the retrospective and post-merge triage with no data.
