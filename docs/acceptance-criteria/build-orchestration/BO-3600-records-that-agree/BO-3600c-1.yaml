work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a fault entry naming requirement id X, and the requirement store holds no
    record with that id,
  When the register is checked,
  Then the entry is flagged as carrying a reference that cannot be resolved,
    And the flag names the entry and names X.

  Given a fault entry naming requirement id Y, where Y exists but has been
    superseded or deprecated,
  When the register is checked,
  Then the entry is flagged as pointing at a record that has been retired,
    And that flag is distinguishable from the flag for a reference that does not
      exist at all,
    And where the retired record names its replacement, the flag names it too,
  So the reader is told what to point at instead rather than only that the pointer
    is wrong.

  Given a fault entry every one of whose named requirements exists and is live,
  When the register is checked,
  Then the entry is not flagged,
  So a clean entry stays clean and the check does not annotate the whole register.

  Given a fault entry naming five requirements of which two cannot be resolved,
  When the register is checked,
  Then both unresolvable references are named,
    And the three that resolve are not,
  So the flag identifies which reference is wrong rather than only which entry
    contains one.
