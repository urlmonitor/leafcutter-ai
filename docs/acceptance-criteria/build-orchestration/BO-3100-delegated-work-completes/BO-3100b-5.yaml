assigned_agent: architecture-diagram-author
estimated_complexity: M
change_target: docs
risk_surface: internal
it_requirements:
  - "AGENT CHOICE IS DELIBERATE: architecture-diagram-author, the leaf author, not documentation-expert — same reason as every other documentation child in this tree."
  - "THE REPLY MUST BE DRAWN, AND DRAWN AS UNUSED FOR THE WORK-HAPPENED DECISION. Omitting it leaves a reader assuming it is read, which is the belief this tree exists to correct; drawing it with an explicit not-used marking records the decision where the next author will see it before undoing it."
  - "THE DIAGRAM MUST DISTINGUISH INPUT-EXISTS from INPUT-USED-FOR-THIS-DECISION, as a declared property of each edge and not merely as a visual style. The coherence test has to be able to tell the two apart from the declared data; a dashed line is not machine-readable."
  - "The working-state snapshot and the no-op declaration must appear as SEPARATE inputs. Collapsing them into one 'step context' box makes it impossible to see that only one of them decides whether work happened."
  - "The coherence claim must be enforced by an executable test that obtains the judgement's real input set (see expects_from) and asserts set equality in both directions with the diagram's declared inputs, so an input added later — the no-op declaration medium being the likely one — is a failing test."
  - "The diagram page must declare its elements and edges in a machine-readable form so the coherence test reads data, not a picture."
  - "Must satisfy the repository's existing doc front-matter and component-vocabulary rules unchanged."
delivers_to: null
expects_from:
  - ac_id: BO-3100b-1
    contract: "The judgement's enumerable input set, each entry marked with whether it is consulted for the work-happened decision — including the reply, present but not consulted."
  - ac_id: BO-3100b-3
    contract: "The no-op declaration fields {may_produce_no_change, no_change_reason} and the fact that they are a separate input from the working-state snapshot."
test_spec:
  - name: test_bo_3100b_5_diagram_declares_three_inputs_with_correct_usage
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "Parse the diagram's declared elements and edges; assert the judgement is a distinct element, the working state is its only input marked as used for the work-happened decision, the reply is present and marked NOT used for it, and the no-op declaration is a separate input."
  - name: test_bo_3100b_5_diagram_matches_the_judgements_real_inputs
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: "THE COHERENCE CHECK. Obtain the judgement's real input set at run time and assert two-way set equality with the diagram's declared inputs, including the used/not-used marking. Adding a fourth input without redrawing must fail."
  - name: test_bo_3100b_5_diagram_page_passes_repo_doc_gates
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: deployed
    description: "The repository's real doc front-matter and component-vocabulary checks pass over the new page."
test_rationale: |
  The interesting claim here is a negative one — the reply is an input the judgement does NOT
  use — and negatives are precisely what review misses and what a rendered diagram cannot
  convey unambiguously. Making the used/not-used flag a declared property lets the coherence
  test assert it against the judgement's real inputs; a dashed-line convention would leave the
  claim unverifiable and would drift the first time someone redraws the picture.
  Deliberately NOT covered: layout and legibility, which are human judgement.
