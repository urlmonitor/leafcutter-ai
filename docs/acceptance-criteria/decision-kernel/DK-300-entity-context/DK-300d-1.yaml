notes: |
  New behavioral requirement derived from the user-authorized entity-context concept.
  BA behavior and IT PO technical contracts are reviewed; implementation is verified by the independent strict entity suite and recognition corpus.
  Verification evidence: reports/entity-context-verification.md. No human approval is implied.
  Historical DK-200 direct-gather tests and evaluation reports are preserved.
  Fresh-run wiring criteria were explicitly reconciled to EntityContext on 2026-10-04.
estimated_complexity: L
it_requirements:
  - "New runs use state.entity_context with EntityContext kind/schema discriminator, never reinterpret legacy EnrichedContext status values as recognition."
  - "Record exactly one context.recognized event after checkpoint creation and before first intent.assessed; an existing entity or legacy interpretation checkpoint prevents repeated initial enrichment."
  - "Keep old gather_context/EnrichedContext public behavior available for historical direct consumers and saved runs; new scheduler runs call recognize_entities."
  - "Classifier construction keeps caller_context and registered_capabilities typed separately from compact entity_context; explicit output schema routing remains authoritative."
test_required: true
test_spec:
  - name: "test_service_checkpoints_entity_context_before_classifier_consumes_it"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "reachability"
    description: "tests/kernel/entity_context/test_wiring.py::test_service_checkpoints_entity_context_before_classifier_consumes_it: Drive RunService with a recording classifier whose response depends on real retained identity; assert saved EntityContext and context.recognized precede intent, exactly one recognition and unchanged goal."
  - name: "test_explicit_output_contract_retains_routing_with_entity_context"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_wiring.py::test_explicit_output_contract_retains_routing_with_entity_context: Run with explicit output contract, capture separately typed entity/caller/registry inputs and assert contract controls routing without initial body evidence."
  - name: "test_pass_statuses_are_versioned_and_truthful"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_wiring.py::test_pass_statuses_are_versioned_and_truthful: Exercise recognized/no_matches/partial/unavailable/disabled outcomes through new model serde and verify none masquerades as gathered/no_evidence or vice versa."
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
