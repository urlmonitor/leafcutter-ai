id: BO-2400e-3-i
components:
  - build_orchestration
  - ac_store
title: "A store that cannot be written is announced, and the build does not carry on as if it had been"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a lean build reaches the point of recording progress on a requirement,
  And the store cannot be written at all — the location is read-only, or there is no
    space left,
  When the build attempts to record the progress,
  Then the failure is announced, naming the requirement it was recording and why the
    write could not be made,
  And no record in the store has been changed,
  And no leftover fragment of the attempted write remains anywhere in the store once
    the attempt has failed,
  And the build does not go on to its next step as though the progress had been
    recorded.
depends_on: [BO-2400e-3]
