  New behavioral requirement derived from the user-authorized entity-context concept.
  BA behavior and IT PO technical contracts are reviewed; implementation is verified by the independent strict entity suite and recognition corpus.
  Verification evidence: reports/entity-context-verification.md. No human approval is implied.
  Historical DK-200 direct-gather tests and evaluation reports are preserved.
  Fresh-run wiring criteria were explicitly reconciled to EntityContext on 2026-10-04.
estimated_complexity: L
it_requirements:
  - "Index preparation is an explicit local CLI/API maintenance operation; runtime recognition must never call build/refresh, including on first use or source changes."
  - "Index binding includes canonical resolved checkout root and source manifest independently from arbitrary task workspace labels; another checkout cannot silently reuse it."
  - "Freshness covers actual dirty content and additions/removals under supported configured roots. Two successive changes to the same already-dirty source invalidate earlier content even with unchanged HEAD/status."
  - "Cache integrity is not source freshness; source policy/config changes and reader/schema incompatibility are independently detected. An unverifiable snapshot yields explicit unavailable coverage."
  - "Refresh writes only the declared derived cache, leaves canonical source records unchanged and retains deterministic identities/projections for unchanged input."
test_required: true
test_spec:
  - name: "test_explicit_index_cli_prepares_consumable_metadata"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "reachability"
    description: "tests/kernel/entity_context/test_index.py::test_explicit_index_cli_prepares_consumable_metadata: Invoke python -m kernel entities build against real canonical fixtures, parse one JSON result, then recognize an indexed term; verify schema/source/reader coverage and physical checkout binding."
  - name: "test_refresh_reflects_additions_changes_and_removals_without_source_writes"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "real_artifact"
    description: "tests/kernel/entity_context/test_index.py::test_refresh_reflects_additions_changes_and_removals_without_source_writes: Build, change/add/remove canonical supported files, explicitly refresh and assert current meanings and hashes, deterministic unchanged projections and unchanged canonical bytes beyond intentional fixture edits."
  - name: "test_second_dirty_edit_changes_snapshot_with_same_head"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_index.py::test_second_dirty_edit_changes_snapshot_with_same_head: Within a local repository edit the same already-dirty source twice and refresh; assert source/snapshot fingerprint differs without HEAD changing and old runtime meanings are stale."
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
