id: KM-500g-1
title: Show execution and original-question fulfillment in the same observable attempt
component: knowledge-management
components:
- knowledge_management
level: L2
status: active
req_status: active
work_status: in_progress
readiness: approved
priority: medium
parent: KM-500g
criteria: 'Given standalone research asks for a work-status breakdown and its execution succeeds while the returned
  evidence omits work status

  And the installation has an authorized configured observation service

  When the attempt finishes and its observation is inspected

  Then the observation identifies the original requested answer, required facts, execution result and unresolved
  question outcome as separate information

  And the missing work-status field and result completeness limitation remain visible even though execution succeeded

  And the request, retrieval attempt, repository, available source revision, generation and selected query are correlated
  with the supporting evidence identifiers

  And the caller receives an attributable observation reference or an explicit statement that remote observation
  was not established

  And a claimed Langfuse reference resolves to the matching recorded attempt rather than merely being an unverified
  locally generated identifier

  And the recorded metadata follows existing privacy and access rules without exposing credentials or unrestricted
  source contents

  And neither query success nor the presence of a trace turns an unresolved question into an answered one.

  '
