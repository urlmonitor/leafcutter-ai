delivers_to: null
expects_from:
  - ac_id: GE-127g-2
    contract: >-
      The run's reporting of judged and set-aside populations. This record adds the two
      further conditions that reporting must be able to express — unreadable and
      uninterpretable — and fixes which verdict each produces.
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Three outcomes of reading the declaration must be distinguishable at the point of
    the read, not reconstructed downstream from how many entries came back: the file
    could not be read, its entries could not be interpreted, and it was read and holds no
    entries. _doc_length_ratchet.resolve_doc_ratchet() already establishes this pattern
    for the previous-value source — classifying by which function raised or what it
    returned, 'never downstream by inspecting how many previous values came back' — and
    that classification point is the precedent to follow."
  - "The error path must be REACHABLE for the absent case. Guarding the read with an
    existence test places the absent case on a branch that never raises, so the
    error-handling code is never entered and nothing is reported — which is exactly the
    miss GE-118c's notes record for the declared document types. Attempt the read and
    handle its failure; do not pre-test for existence."
  - "No built-in set of set-aside locations may exist anywhere in the implementation,
    not even as a last-resort default. Its presence is the substitution the first two
    arms forbid, and a default that is never reached in testing is still a default."
  - "An unreadable declaration must resolve toward JUDGING every staged document, not
    toward exempting any. This is a deliberate departure from the component's fail-open
    convention for this one input, on the ground the record states: an exclusion
    mechanism failing toward exemption turns one unreadable file into a repository-wide
    amnesty, which is a check that never ran reporting success."
  - "The refusal must name the declaration it could not read or interpret. A message that
    states only that something went wrong is the condition CLAUDE.md records being
    misread as a real finding three separate times."
  - "An empty-but-readable declaration must NOT emit the could-not-be-read text. It is a
    completing read whose result is 'nothing is set aside'; the commit still refuses,
    but for the document's length and not for the declaration."
  - "The commit_guardian.json read already happens once for max_lines and the severity.
    Do not introduce a second, separate read of the same file for the declaration — one
    read with one classified outcome, or the two reads can disagree about whether the
    file is readable."
  - "Must handle errors gracefully per the project error handling policy."
test_spec:
  - name: test_absent_declaration_refuses_names_it_and_judges_the_document
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: failure
    surface_invoked: templates/scripts/commit_guardian/check_doc_length.py
    description: >-
      Arm 1, and the arm that proves the error path is reachable. Remove the declaration
      entirely, stage one generated document far above the limit, and invoke the gate.
      Assert non-zero exit; that the output states the declaration could not be read and
      names it; that the document is reported among those JUDGED and over its limit; and
      that it is reported neither as set aside nor as within its permitted length. Four
      assertions kept separate. No build.py spawn and no layout fixture, so no marker.
    must_catch:
      - "on an unreadable or uninterpretable declaration, fall back to a built-in set of set-aside locations and continue"
      - "on an unreadable declaration, set aside every document and complete the commit"
      - "guard the read with an existence test so the error-handling path cannot be reached"
  - name: test_malformed_declaration_refuses_names_it_and_judges_the_document
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: failure
    description: >-
      Arm 2. The declaration present but uninterpretable — truncated JSON, or entries of
      the wrong shape. Same staged document. Assert non-zero exit, that the report states
      the declaration could not be interpreted and names it, and that the document is
      again reported among those judged. Stated separately from arm 1 because an
      implementation can handle the malformed case correctly and never reach the absent
      one. No marker.
    must_catch:
      - "on an unreadable or uninterpretable declaration, fall back to a built-in set of set-aside locations and continue"
      - "on an unreadable declaration, set aside every document and complete the commit"
  - name: test_empty_declaration_judges_without_claiming_an_unreadable_declaration
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Arm 3, the narrowest in the subtree. The declaration present, readable, with zero
      entries. Same staged document. Assert non-zero exit; that the document is reported
      among those judged; and — the point of the entry — that the output does NOT contain
      the could-not-be-read text. The negative assertion is what makes the diagnostic
      usable at all. No marker.
    must_catch:
      - "report an empty declared set with the same could-not-be-read message as an unreadable declaration"
  - name: test_declaration_entry_with_a_blank_ground_is_rejected_not_honoured
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: boundary
    description: >-
      Enrichment's own entry, for the parent L1's requirement that an entry whose ground
      is absent, empty or whitespace-only be rejected rather than honoured silently.
      Declare the cards directory with a blank ground, stage an over-limit generated
      document, and assert the document is JUDGED and the output names the offending
      entry. This is the uninterpretable case at entry granularity rather than file
      granularity, and it is the one an implementation that validates only the file's
      JSON shape lets through. No marker.
    must_catch:
      - "honour a declared entry whose ground is blank or absent"
      - "validate only that the file parses, never that each entry carries a ground"
test_rationale: >-
  Each entry drives one real gate run over a real staged index with the declaration put
  into a specific state, and reads the verdict and the diagnostic out of the run's own
  output. The four entries are not interchangeable: the record's mutations redden disjoint
  subsets — the silent substitution and the quiet exemption both redden arms 1 and 2 and
  leave arm 3 green, the conflation reddens arm 3 alone, and the unreached-error-path
  mutation reddens arm 1 and leaves arm 2 green. That last asymmetry is the whole reason
  the absent and the malformed cases are two entries and not one, and it is also why the
  absent-case entry must be constructed by actually removing the file rather than by
  monkeypatching the loader to raise: a patched loader is entered, so it cannot reproduce
  the existence-test miss it exists to catch. Arm 3's assertion is NEGATIVE — the absence
  of the could-not-be-read text — which is unusual and deliberate: with it, a deliberate
  empty declaration and a real fault are distinguishable; without it, neither can be
  acted on, and the verdict is identical in both cases so the verdict alone proves
  nothing. The fourth entry is enrichment's own; it closes the granularity gap between
  'the file is interpretable' and 'this entry is interpretable', which the record's arms
  reach only at file level. Markers: no entry requests shared_reference_layout and none
  spawns build.py, so all four sit outside the marker-routing mechanism; the
  deployed-layout proof for this family is paid once by GE-127g-2's deployed entry.
