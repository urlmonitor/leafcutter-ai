notes: |
  WHY A SEPARATE RECORD. The documentation guard's defect is exactly this shape: it blocks in a
  form Claude Code does not act on. An observation that reads the guard's own "blocked" text, or
  any non-zero ending, records "observed" for the unrepaired guard and still passes GE-130f-1
  once the guard is repaired. Named mutation that turns ONLY this record red: decide the
  liveness record from the guard's message or ending status instead of from whether the edit
  landed.

