id: BP-100m-3
title: "A later phase can never silently overwrite an earlier phase's artifact — collision is fatal, not last-write-wins"
component: build-pipeline
level: L2
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-100-reliable-builds/BP-100m.yaml"
criteria: |
  Given the artifact phases run in order and an earlier phase (build_commands)
    writes commands/build-feature.md while a later phase (build_workflows, for the
    claude platform) would write the same path,
  When build.py runs,
  Then the later phase does NOT silently overwrite the earlier artifact,
  And the build fails with a non-zero status because the same-target write is
    detected as a collision,
  And no consumer install receives a commands/build-feature.md whose content
    depends on phase ordering (whichever phase happened to run last).
depends_on:
  - BP-100m
