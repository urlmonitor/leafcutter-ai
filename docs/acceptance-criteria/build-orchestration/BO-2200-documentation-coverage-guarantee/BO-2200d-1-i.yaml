it_requirements: |
  Guard against two regressions from the surgical removal: (1) accidentally dropping
  architect-review or another pre-coder gate while removing documentation-expert, and
  (2) leaving documentation-expert in a flow-change list so it is injected twice. Assert
  the flow-change lists retain architect-review and contain no documentation-expert.
