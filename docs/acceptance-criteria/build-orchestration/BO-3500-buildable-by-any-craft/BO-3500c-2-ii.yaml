assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - "ONE INSTRUMENT, PARAMETERISED — NOT A SECOND IMPLEMENTATION (finding F6, user judgement). The diagram proof IS the reading-class check of BO-3500c-2-i with a per-file-type reference extractor; the schema validation is that per-type parameter. Building it separately gives the project two reading instruments that must agree about what a resolvable project element is, kept in step by discipline, which is the shape this repo keeps paying for."
  - "NO RENDERER, AT ALL (finding F4). There is no mmdc binary and no root package.json, and this is a portable package installed into arbitrary repositories that cannot assume a JavaScript runtime. Nothing on this path may shell out to a renderer, and no test may require one."
  - "SCHEMA VALIDATION IS THE PER-TYPE PARAMETER (finding F5). The structured source declares its schema with a `$schema` key; validation resolves that id against a registry of permitted diagram-source schemas held under config/ (alongside config/diagram_types.json, which already governs the diagram_type frontmatter enum and is read at startup by check_doc_frontmatter.py). AN UNRESOLVABLE OR FOREIGN `$schema` IS A FAILURE, NEVER A SKIP — a skip makes the schema clause optional by typing, which is D4's failure mode wearing a different hat."
  - "REFERENCE EXTRACTOR PER SOURCE FORM — one table, one instrument: (a) structured JSON diagram source -> element ids read from the schema-declared node and edge fields; (b) docs/agents/cards/*.card.md mermaid spawn diagrams -> EXTEND the extractor that already exists and already runs, in templates/scripts/commit_guardian/hooks/check_agent_spawn_consistency.py (_MERMAID_SPAWNS_PATTERN, _MERMAID_DISPATCHES_PATTERN, _parse_card_spawn_edges, _node_id_to_agent_id, _check_card_registry_mirror — it already compares card edges against config/agent_registry.json in BOTH directions); (c) any other form, including mermaid embedded in prose, -> NOT extractable, refused up front under BO-3500c-4."
  - "EXTRACT, DO NOT FORK. Lift the extractor and the two-way comparator out of check_agent_spawn_consistency.py into the shared instrument and have the hook CALL it. A copy leaves the repo with two spawn-diagram parsers that drift; the hook keeping its own is how the existing check stops being the working reference this record is built on."
  - "DEPLOY MANIFEST — THIS IS THE HIGH-RISK STEP ON THIS RECORD. Extracting the extractor creates a new module that a commit-guardian hook imports. It MUST be added to the deploy list in scripts/build_phases.py, or the DEPLOYED check_agent_spawn_consistency hook raises ModuleNotFoundError at runtime and — the hook being a commit gate — blocks every merge. That is the done_proof.py incident verbatim. Verify by running the DEPLOYED hook, not the unit tests, which import from the source tree and mask the gap."
  - "RESOLUTION TARGETS ARE THE PROJECT'S OWN REGISTERS: docs/components.json (components[].id), config/agent_registry.json (agents[].id), config/skill_registry.json (skills[].id). Only elements the source CLAIMS are parts of this project must resolve — an external system, a user or an abstraction must not be forced to, or the proof is unsatisfiable."
  - "A CHANGE TO WHAT COUNTS AS A RESOLVABLE PROJECT ELEMENT MUST TAKE EFFECT FOR BOTH PROOFS AT ONCE. One resolver, one registry read, asserted by a test that adds an id to a fixture register and checks both proofs accept it with no second edit."
  - "NO PRESENCE-ONLY ASSERTIONS. Each test builds a real source and executes the proof or the deployed hook."
delivers_to:
