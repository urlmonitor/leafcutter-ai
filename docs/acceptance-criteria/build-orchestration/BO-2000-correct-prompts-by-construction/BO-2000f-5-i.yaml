title: "A ticket is still held until its dependency predecessors complete under the rewired driver"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an epic driven via the rewired /build-feature contains ticket B that depends_on ticket A,
    and A has not yet completed successfully,
  When /build-feature reaches the point where it would drive B,
  Then B is not dispatched to the flattened driver,
  And B is only driven after A has completed successfully,
  So dependency ordering is preserved despite the switch to per-phase flattened dispatch.
