test_rationale: |
  Both functions are pure string classifiers, so a direct-import unit test per
  branch is the strongest available proof and the cheapest: each descriptor
  passes a literal path and asserts the exact returned pair, which means the
  extension table, the extensionless-convention branch, the case fold, the
  unknown suffix and the dotfile are each executed rather than inspected. The
  margins are what matter here — a misattribution at the margin is small in
  volume, permanent in effect, and never audited, because the other row is the
  only place it shows and nobody reads it. The negative descriptors
  (test_unknown_extension_falls_through_to_other, test_dotfile_is_not_read_as_an
  _extension, test_production_module_is_not_a_test) are therefore as load-bearing
  as the positive ones.
