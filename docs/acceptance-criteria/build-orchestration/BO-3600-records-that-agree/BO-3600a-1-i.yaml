readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a fault entry whose status cannot be read — it is absent, or written in a
    form the reconciliation does not recognise — and whose body names requirement R,
  When the two records are reconciled,
  Then the pairing is reported as undecided, naming the entry and stating that its
    status could not be read,
    And it is not reported as agreeing,
    And it is not silently omitted from the output.

  Given a fault entry naming a requirement id the reconciliation cannot look up,
  When the two records are reconciled,
  Then the pairing is reported as undecided, naming the unresolvable reference,
    And it is not reported as agreeing.

  Given a run in which the requirement records could not be read at all,
  When the reconciliation runs,
  Then it reports that it could not perform the comparison, and states why,
    And it does not report that no conflicts were found,
  So a run that examined nothing is never presented as a run that found nothing.

  Given a run in which every pairing was decided,
  When the reconciliation reports,
  Then nothing is reported as undecided,
  So undecided is reserved for pairings the reconciliation genuinely could not
    settle.
