notes: |
  Retrospective refinement of KM-400a-3-i. The reviewed working-tree corpus had
  531 entries: 528 strict parses and three auditable compatibility parses.
  The reader receipt records 20 passing cases and ten caught mutations. The
  immutable Aura publication has a different source scope; this AC does not
  conflate its population with the reviewed working-tree corpus. Current writer
  requirements govern new writes and do not authorize rewriting historical data.
  Final bidirectional traceability and strict test evidence: reports/native-fields/ac-traceability.json.
  Work status reflects linked test outcomes; reviewed readiness does not assert user approval.
estimated_complexity: M
it_requirements:
- Strict parsing remains the first interpretation; compatibility recovery is confined to the two reviewed failure
  rules and preserves sibling fields plus the original diagnostic.
- Compatibility output must be independent of the checkout location, retain exact raw provenance and leave every
  original source file unchanged.
