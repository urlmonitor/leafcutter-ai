assigned_agent: python-coder
estimated_complexity: M
package_surface: false
declares_side_effect: false
it_requirements:
  - >-
    NO PACKAGE SURFACE — MEASURED, NOT ASSUMED. WATCHED_REGISTRIES binds two containers on
    commit_guardian.json: hooks_manifest.hooks (by id) and the document's own top level (by
    mapping key). This record adds neither — it registers nothing at all, because it adds
    no output and no configuration; it constrains what GE-127e-1's description is COMPUTED
    FROM. `check-file-size` is already a manifest id and `file_size` is already a top-level
    key, both read in this worktree. Plain-list spec form, and no config_schema_fragment
    invented to satisfy the structured-spec validator.
  - >-
    THIS RECORD ADDS NO CODE PATH OF ITS OWN, AND THAT IS THE CONSTRAINT, NOT AN EXCUSE.
    There must be exactly ONE description function, the one GE-127e-1 builds, and it must
    take the refused file's CONTENT as its input. A second derivation path added to satisfy
    this record — a "content-aware mode", a per-file override, anything selected at run time
    — leaves GE-127e-1's path unconstrained and is the failure this record exists to
    prevent. The whole of the work here is that the single path reads content, plus the
    paired-run tests that prove it.
  - >-
    NOTHING OUTSIDE THE FILE'S CONTENT MAY REACH THE DESCRIPTION. Not the path, not the
    file name, not the extension beyond choosing HOW parts are recognised, not the measured
    length, not the clock, not a per-run nonce, not a counter, not the position of the file
    in the staged set. The byte-identical-copy arm is what enforces this, and it is
    enforceable only if the description is a pure function of content: given identical
    bytes it must produce an identical description, every time, in any order, at any path.
    Make that determinism a property of the function rather than something the tests happen
    to observe.
  - >-
    KEYING ON THE MEASURED LENGTH IS THE SPECIFIC PROHIBITION, AND IT IS EASY TO DO BY
    ACCIDENT. Apportioning a fixed per-kind inventory across the measured length produces
    output that varies between files, looks derived, and is not — and it passes any
    single-run assertion. The rearrangement arm holds the measured length constant on
    purpose so that content is the only variable left. Do not let the length participate in
    selecting or naming parts; it participates only in the reconciliation arithmetic
    GE-127e-1 pins.
  - >-
    THE PAIRED-RUN CONSTRUCTION IS BP-900c-4-i's AND IS REUSED, NOT REINVENTED. That record
    already settles the epistemics for a guard whose remediation must be read from the input
    it describes: run the guard BEFORE and AFTER changing that input and require the advice
    to MOVE, because a hard-coded selector passes every single-run assertion. Follow it; do
    not invent a second construction, and do not weaken any arm here into an assertion about
    one refusal.
  - >-
    THE REARRANGEMENT FIXTURE MUST STATE ITS OWN LENGTH INVARIANCE. Construct the
    rearranged file so its measured length under count_content_lines is unchanged, and
    assert that invariance IN THE TEST from the gate's own quoted number rather than
    assuming it. If the counting rule GE-127d owns makes an exactly length-preserving
    rearrangement awkward, the fallback the BA permits applies — the advice must move
    further than the length does — but the fixture must report both numbers so a reader can
    see which case was exercised. A silently drifting length turns this arm into a test that
    a length-keyed implementation also passes.
  - >-
    THE COPY ARM IS A REGRESSION FENCE AND MUST NOT BE WEAKENED TO MAKE THE OTHER TWO PASS.
    If an implementation cannot make the two moving arms red-then-green without also
    disturbing the copy arm, the description is not a function of content — it has acquired
    a second input. Resolve that by removing the second input, never by relaxing the copy
    arm to "similar" or "equivalent" advice. The two descriptions must be equal.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around the
    file read and any parse; log at WARNING or higher or re-raise; no bare or blind excepts.
    Note the interaction with GE-127e-3-i: a parse failure on one of a pair of files must
    produce that record's could-not-be-described state, never a fallback description that
    would silently satisfy this record's arms with generic text.
  - >-
    CANONICAL VERSUS BUILD OUTPUT, AND THE BUILD IS PART OF THE CHANGE. Edit
    templates/scripts/commit_guardian/ only — scripts/commit_guardian/ and the repo-root
    .pre-commit-config.yaml are untracked build outputs overwritten by build.py, and
    templates/commit-guardian/commit_guardian.json is a decoy. Re-run `python
    scripts/build.py --target-dir .`; config.py resolves the config beside the deployed
    script, so an unbuilt change leaves the running gate on the old behaviour.
test_spec:
  - name: test_ge_127e_2_two_different_files_refused_in_one_commit_receive_different_parts
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Stage two covered files of the same kind, holding different content, both over their
      permitted length, and run one ordinary `git commit`. The parts named for the first and
      the parts named for the second must not be the same set, and each file's division must
      be stated in terms of that file's own parts. Both sets are read from the single
      refusal's output. NAMED MUTATION (mandatory, run it, do not merely describe it — the
      BA's injection, carried verbatim): MUTATION: derive the named parts and the named
      division from the refused file's KIND and its MEASURED LENGTH alone, ignoring its
      content entirely — for example, a fixed table of part names per covered kind,
      apportioned across the measured length. Under that injection this arm must go RED,
      because two files of the same kind now receive the same parts; it must return to green
      on revert.
  - name: test_ge_127e_2_rearranging_a_file_at_constant_length_moves_the_parts_and_the_division
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Refuse one covered file, capture the parts and the division; rearrange that same file
      so its constituent parts differ while its measured length is exactly what it was
      before; refuse it again. The parts named and the division named must have MOVED. The
      test asserts the length invariance from the gate's own quoted number in both runs, so
      a fixture whose size drifted is visible rather than silently converting this into an
      arm a length-keyed implementation passes. NAMED MUTATION (mandatory, run it — the BA's
      injection, carried verbatim): MUTATION: derive the named parts and the named division
      from the refused file's KIND and its MEASURED LENGTH alone, ignoring its content
      entirely — for example, a fixed table of part names per covered kind, apportioned
      across the measured length. Under that injection this arm must go RED, because the
      length did not change so the advice does not move; it must return to green on revert.
  - name: test_ge_127e_2_a_byte_identical_copy_at_another_path_receives_identical_advice
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Copy the refused file byte for byte to a second path of the same covered kind and
      refuse it there. The parts named and the division named must be EQUAL to those named
      for the original — not similar, not equivalent — so what the author is told follows
      from the file's content and not from its name, its path, its kind or the length it
      happens to measure. THIS DESCRIPTOR MUST STAY GREEN UNDER THE BA's NAMED MUTATION, and
      that is its second job: a kind-and-length-only implementation still gives identical
      advice to identical copies, so a red here under the injection would mean the arms are
      not independent. It is also the arm that forbids the cheap way to pass the other two —
      deriving anything from the path, the file name, or a per-run nonce.
  - name: test_ge_127e_2_the_kind_and_length_injection_reds_both_moving_arms_and_leaves_the_copy_arm_green
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      THE THREE-WAY MUTATION PROOF, RUN AS ONE EXPERIMENT AND RECORDED AS ONE RESULT. Apply
      the BA's injection once — MUTATION: derive the named parts and the named division from
      the refused file's KIND and its MEASURED LENGTH alone, ignoring its content entirely —
      for example, a fixed table of part names per covered kind, apportioned across the
      measured length — then run all three arms above and record their outcomes together.
      The required observation is: the two-different-files arm RED, the rearrangement arm
      RED, and the byte-identical-copy arm GREEN. All three outcomes must be observed, and
      all three must revert. The third is not decoration: a mutation that turned every arm
      red would mean the arms are not independent, and the copy arm's staying green is the
      evidence that this record's teeth are in the two moving arms. An injection run that
      reddens all three is a FAILURE of this descriptor even though it looks like a stronger
      result.
  - name: test_ge_127e_2_both_files_advice_reaches_the_registered_hook_output_in_one_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      PRODUCTION ENTRY POINT. Run the gate through the registered hook path with the two
      differing over-limit files staged and assert that BOTH per-file descriptions appear,
      distinct from each other, in the hook's own output stream under the refusal exit
      status. Two descriptions computed by a function nothing at commit time calls are two
      inert values, and a per-file description that collapses to one shared block when more
      than one file is refused fails here and nowhere else.
  - name: test_ge_127e_2_the_deployed_copy_gives_two_different_files_two_different_descriptions
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After build.py, the DEPLOYED copy and every module it imports load and run in a cold
      process, and the two-different-files arm and the copy arm both hold against it. A
      description module placed outside templates/scripts/commit_guardian/ without a
      scripts/build_phases.py deploy-map entry surfaces here as ModuleNotFoundError rather
      than passing, and a content-derivation change written only into the canonical template
      fails here rather than passing on source-tree greenness.
test_rationale: |
  Every arm of this record is a PAIR of runs whose input differs, and the pass condition is
  that the value MOVED — not that a particular value appeared. That construction is not a
  stylistic choice: BP-900c-4-i settles the identical epistemic problem on a different
  subject and states the general rule plainly — a test whose assertion holds on a single run
  cannot fail on the implementation the record exists to exclude. Today's shipped refusal
  emits the same sentences for every file and would satisfy "the refusal includes remediation
  guidance", and any single-run assertion about a description, on any single fixture.

  The BA's mutation is carried into descriptors verbatim rather than restated, and it is
  carried three times on purpose. It appears on each moving arm stating that arm's required
  RED, and once more in a dedicated descriptor whose whole job is the three-way observation:
  two arms red, the copy arm green. Without that fourth descriptor the three-way property is
  something a careful implementer might notice and a hurried one will not, and a mutation run
  that reddens all three would be recorded as a success while having destroyed exactly the
  independence the BA built in.

  The copy arm asserts EQUALITY rather than similarity, and the rearrangement arm asserts the
  quoted length is unchanged, both read from the gate's own output. Those two constraints are
  what stop the arms being satisfiable by an implementation with a second, non-content input:
  loosen either and a path-derived or nonce-derived description passes the moving arms while
  the copy arm silently stops fencing anything.

  No descriptor reads the description function's source, and none asserts that two direct
  calls return different values. Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not
  by Grep" and this record's own doc_link, both stay green on a gate that never runs and on
  one whose output is fixed; the only admissible evidence is two real commits differing in one
  input.
