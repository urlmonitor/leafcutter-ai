it_requirements:
  - "The disposition must be DERIVED FROM THE READ COUNTS GE-122d-3 already requires, not from the exception type. 'Every namespace completed its read, then something failed' is a state the pass knows; 'this exception class means internal defect' is a guess that a new exception type silently invalidates. Deciding on exception class is the way this boundary quietly inverts eighteen months from now."
  - "Four outcome values are now in play — clean, contested, could-not-establish, terminated-abnormally — and the commit-time disposition differs between the third (block) and the fourth (proceed). The return type must express all four; a boolean or an exit-code-only contract cannot, which is why GE-122d-3 requires a value-typed outcome."
  - "The abnormal-termination path must name the point the pass reached, which means the pass has to record progress as it goes rather than reconstructing it from a traceback. A traceback is not a statement of what was established, and this criterion's whole purpose is to say what was established."
  - "This is the exact place where two standing rules of the component meet, so the implementation must not collapse them into a single try/except at the top of the entry point. A blanket handler makes every failure look like an internal defect and lets the unreadable-collection case through — the precise inversion the BA's notes warn about."
  - "Reproduce the component's established fail-open tail shape for the proceed path — specific exception type, `noqa: BLE001` where the blanket catch is deliberate, stderr-prefixed announcement, clean stdout so the announcement is never mistaken for a violation — rather than inventing a new one. `check_ac_governance.py`'s tail is the reference implementation."
  - "Error handling per CLAUDE.md Rules 1-4 applies to the guard's own code as much as to the collection it reads; a handler on this path must log at WARNING or above, never pass silently."
test_spec:
  - name: test_internal_defect_after_full_read_permits_the_commit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "An error induced in the reporting path AFTER every namespace has been read produces a terminated-abnormally outcome, an announcement naming the point reached, and a commit that is permitted to complete."
  - name: test_unreadable_collection_blocks_the_commit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The GE-122d-3 condition — an artifact that could not be read — blocks the commit in the same test module, so the two dispositions are demonstrated side by side and the boundary is visible as a difference rather than asserted in isolation."
  - name: test_the_two_conditions_yield_distinct_outcome_values
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "could-not-establish and terminated-abnormally are distinct values a caller can tell apart, and neither equals the clean value."
  - name: test_disposition_is_derived_from_read_completion_not_exception_type
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The SAME exception class raised before the read completes blocks, and raised after it completes permits — proving the boundary is drawn on read completion rather than on exception class."
  - name: test_internal_defect_fails_the_shared_build
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    description: "The same post-read internal error fails the build stage, where the guard's own health is in scope and no author is waiting."
test_rationale: |
  The coverage note requires both conditions in one place, because a boundary asserted from one
  side is not a boundary. The fourth descriptor is the one that actually protects the rule over
  time: raising the same exception class on either side of the read and asserting opposite
  dispositions is the only test that fails when someone reimplements the decision as an
  exception-class check — which is the plausible, tidy-looking implementation that silently
  inverts the boundary the first time a new exception type appears. Both directions of failure
  are real and both are recorded in the AC notes: lean fail-open and the unreadable-file case
  stops blocking; lean fail-closed and any bug in a new whole-collection guard blocks every
  commit in the repository until someone fixes it, which is how guards get deleted.
