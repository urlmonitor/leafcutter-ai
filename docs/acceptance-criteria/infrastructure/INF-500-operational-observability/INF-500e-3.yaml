notes: |
  Records move between a component root and its feature folders routinely — the
  fast-lane criteria did exactly this. Keying the report on the path rather than
  the identifier would score each such move as one criterion filed and one
  vanished, and where the moved record was already closed it would also inflate
  the newly-closed count that the whole trust tier is computed from. The metric
  most likely to be trusted is therefore the one most exposed to a purely
  clerical change.

  The same reasoning drives the age index: taking the earliest appearance per
  identifier keeps a moved criterion's true age instead of resetting it to the
  move date and reporting a suspiciously fast week.

  KNOWN LIMITATION, RECORDED NOT SPECIFIED, CORRECTED 2026-08-31 (previous
  wording claimed a renamed record "reads as newly born and understates its
  cycle time" -- disproven, see below). The age index is built by walking the
  history once rather than following each of several thousand records
  individually. Within a SINGLE commit, git's own rename detection folds a
  `git mv` into an R100 diff line, which the birth index's --diff-filter=A
  walk never observes at all -- so a criterion given a new identifier by an
  atomic rename gets NO births entry, and collect_cycle_times SKIPS it from
  the cycle-time sample rather than reading it as freshly born. The bias runs
  the opposite direction from what was previously claimed here: the closure
  vanishes from the reported population instead of skewing the median young.
  This is empirically verified against a real temporary repository (measured
  2026-08-31; see TestAcBirthDates::test_moving_a_criterion_does_not_reset_its_age
  and the matching comment above ac_birth_dates in
  scripts/agent-health/weekly_health.py). The nuance that keeps this from
  being a total blind spot: git only detects a rename WITHIN a single
  commit's diff. A non-atomic move -- deleted in one commit, re-added under a
  new identifier in a LATER commit -- is NOT folded into a rename, so it
  produces two genuine add events and the earliest one wins (see
  test_earliest_of_two_add_records_wins). That residual atomic-rename case is
  a deliberate, out-of-scope cost; specifying rename-following for it would be
  a separate criterion with a very different cost profile.
