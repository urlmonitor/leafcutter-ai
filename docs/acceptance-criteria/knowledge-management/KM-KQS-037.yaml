title: "Agent Protocol deduplication warning distinguishes AC overlap from doc/skill overlap"
component: knowledge-management
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given the Agent Protocol section specifies citation and deduplication formats,
  When a consuming agent finds that knowledge-query returns nodes from
    multiple surfaces (e.g., one AC node and one doc node for the same keyword),
  Then the agent presents each overlapping node using the citation format
    "[<surface>] <title>" grouped by surface,
  And the agent applies the deduplication warning format ONLY to nodes whose
    surface is "acs" or whose id matches the AC ID pattern (e.g., "ACD-200a-1"),
  And the agent applies the doc_links auto-population rule ONLY to nodes
    whose surface is "docs" or "adrs",
  And nodes from other surfaces (agents, skills, hooks) are cited for
    information but do not trigger deduplication warnings or doc_links additions,
  And when a single query returns both an overlapping AC and an overlapping doc,
    the agent presents BOTH the deduplication warning AND adds the doc to
    doc_links in the same confirmation gate output.
