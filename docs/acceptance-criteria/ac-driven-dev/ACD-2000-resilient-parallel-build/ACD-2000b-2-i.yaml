  contract: "The atomic single-requirement take returning granted|already_taken with the current holder. This AC composes that primitive into an all-or-nothing set operation and adds the set identity each member carries."
test_spec:
  - name: test_set_claim_with_one_contended_member_leaves_none_of_the_set_taken
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "A second real process holds the third of four requirements; the set claim runs and all four records are inspected afterwards -- none is held by the claiming effort."
  - name: test_briefly_taken_members_are_available_to_another_effort_afterwards
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "After the failed set claim, a different effort successfully takes the first two members, proving they were genuinely released rather than left in a residual state that merely reads as unowned."
  - name: test_failure_names_the_contended_member
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Asserts the reported failure identifies the third requirement specifically, not just that the set could not be claimed."
  - name: test_sigkilled_mid_set_claim_leaves_the_set_takeable_by_a_fresh_process
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Starts a real set claim in a child process and SIGKILLs it part-way through so no cleanup handler can run; asserts a fresh process can subsequently take the whole set."
  - name: test_two_efforts_taking_overlapping_sets_both_terminate_with_one_winner
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    description: "Two real processes claim overlapping four-member sets simultaneously, repeated; asserts one set is fully taken and the other holds none -- neither process ends up holding a fragment of the other's set."
test_rationale: "A test whose claimer fails through its normal error path exercises the CALLER'S cleanup and therefore passes on an implementation whose correctness depends on the process being alive -- which is exactly what the fourth clause forbids. Only SIGKILL, which runs no finally and no atexit, can tell a genuine all-or-nothing guarantee from a diligent unwind. The contended member is likewise held by a real second process rather than by a pre-set field value, because a hand-written in_progress record does not exercise the take path the contention actually flows through. The overlapping-sets test is included because deterministic take order is an it_requirement the criteria do not name, and an unordered implementation deadlocks only under genuine simultaneity."
