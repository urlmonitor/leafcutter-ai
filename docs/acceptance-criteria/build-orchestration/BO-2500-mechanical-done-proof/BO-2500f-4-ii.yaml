notes: |
  Wave 2. User scope change 6 (PO gate 2026-10-25): sending finished records back
  to in_progress reuses TQ-400b's path. User backfill decision: the 46 finished
  records without a reason go to TQ-400d triage or this migration.

  Population. Of 113 finished test-free records (2026-10-24), 67 have a reason and
  46 do not. Only those no test tags need a verification record: 31 with a reason
  and 32 without (the brief's breakdown of the 240 untagged-done backlog). The 14
  tagged records without a reason are proven by their test and are out of scope.

  The "does not take effect while any remain" clause is the ordering gate between
  this migration and BO-2500f-4; without it the swap would refuse 63 finished
  records on the next CI sweep.
