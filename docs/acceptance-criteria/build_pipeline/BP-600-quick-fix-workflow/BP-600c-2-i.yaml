id: BP-600c-2-i
title: "Quick-fix workflow halts when red-phase test errors out rather than failing cleanly"
component: build-pipeline
level: L3
status: active
readiness: reviewed
priority: medium
work_status: todo
criteria: |
  Given the test-writer has produced a test file,
  When the workflow runs the red-phase test,
  And the test runner returns an ERROR (import failure, syntax error,
    fixture not found) rather than a FAILED assertion,
  Then the workflow halts with a message distinguishing the error from
    an expected test failure,
  And it reports the specific error to the user rather than treating
    it as the expected red phase,
  And it does not proceed to the fix-application phase.
