notes: |
  The user reported the routing as inconsistent (one later run's pause did persist).
  An outcome that varies from run to run is the failure; this edge pins that the outcome
  is the same every time. Compatible with ACD-2100a-4 (failure reported if and only if no
  record is on disk).
