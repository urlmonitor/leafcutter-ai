criteria: |
  Given tests/test_setup_ticket_worktree.py mocks the subprocess/file interactions
  that scripts/setup_ticket_worktree.py's bootstrap logic feeds to json.loads(),
  When the bootstrap tests run,
  Then each mock supplies a real JSON string (not a bare MagicMock) wherever the
  production code calls json.loads(),
  And no test raises `TypeError: the JSON object must be str, bytes or bytearray,
  not MagicMock`,
  And the poetry-manifest, pip-manifest, no-manifest, and install-failure paths are
  each driven to their intended branch and asserted,
  And the tests pass with exit code 0.
