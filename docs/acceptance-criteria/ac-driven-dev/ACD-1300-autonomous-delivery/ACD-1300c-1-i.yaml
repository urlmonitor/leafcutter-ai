id: ACD-1300c-1-i
title: Stopping and restarting do not reset exhausted work budgets
component: ac-driven-dev
components:
- ac_driven_dev
level: L3
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given an AC has consumed three attempts or sixty implementation minutes
  When the worker is disabled, restarted and enabled again
  Then the saved attempt and time totals still exhaust that AC's automatic budget
  And it remains awaiting human resolution without a fourth attempt or a new sixty-minute allowance
