risk_surface: contract_boundary
test_required: true
test_rationale: |
  The current implementation of this check is observed to report only that a lookup "does not
  match a fresh rebuild", with no indication of which entries differ - which on this repository
  produced a fourteen-way mismatch nobody could triage without writing a script. The naming
  clause is therefore the point of the record and has to be asserted on the message content,
  not on the outcome.
test_spec:
  - name: test_differing_derived_lookup_names_the_entries_that_differ
    target_dir: unit_tests/product_truth/
    description: "An index with one edited entry in a derived lookup produces a finding naming the lookup and that entry."
    type: integration
    angle: failure
    framework: unittest
  - name: test_matching_derived_lookup_is_not_reported
    target_dir: unit_tests/product_truth/
    description: "An index equal to a fresh rebuild produces no D3 finding."
    type: integration
    angle: boundary
    framework: unittest
  - name: test_compared_entry_count_rises_with_the_size_of_the_index
    target_dir: unit_tests/product_truth/
    description: "Adding one artifact raises the D3 compared-entry count."
    type: integration
    angle: seam
    framework: unittest
notes: |
  D3 of the four checks UXP-514 names. Its scope is the DERIVED LOOKUP MAPS only. The scalar
  fields the index copies onto each artifact entry are outside it, are unguarded today, and are
  covered by UXP-514-6.

  A separator-only difference between platforms is NOT a D3 finding; see UXP-700c-3-i.
