it_requirements:
  - >-
    NO PACKAGE SURFACE — MEASURED, NOT ASSUMED, AND THE TRIGGER THAT WOULD CHANGE THAT IS
    NAMED. On commit_guardian.json, WATCHED_REGISTRIES binds exactly two containers:
    hooks_manifest.hooks by id, and the document's OWN TOP LEVEL by mapping key. Covering a
    previously-uncovered kind of file is a NESTED addition — a key inside
    file_size.line_limits and a member of file_size.checked_extensions — and file_size is
    already one of this file's thirty-six top-level keys, read in this worktree. Nested
    additions are invisible to the mapping_keys container, which is bound to dotted path ""
    only. So package_surface is FALSE. THE TRIGGER, STATED SO IT IS NOT DISCOVERED AT
    COMMIT TIME: if the chosen design instead declares standards in a NEW top-level section
    of commit_guardian.json, that IS a watched mapping key, check-package-surface-declaration
    will refuse the commit, and this record must be re-declared package_surface: true with a
    real config_schema_fragment before the change lands. Raise it; do not add the key
    quietly.
  - >-
    THIS IS THE KEYSTONE AND IT IS WHERE THE GENERALISED CARRIER IS BUILT. Everything the
    tree needs begins here: a join between the two machine-readable records that exist and
    are read by nothing together — config/agent_registry.json's owns_file_extensions (three
    of sixty agents declare it: python-coder ['.py','.js'], sql-coder ['.sql'],
    frontend-coder ['.tsx','.jsx','.vue','.svelte','.html','.css','.scss']) and
    templates/scripts/commit_guardian.json's per-kind declarations. The incumbent shape to
    REPLACE is scripts/build.py:255-285 `_inject_file_size_limits`, a hand-written step that
    reads file_size.line_limits['.py'] and sets one config key, sitting beside
    `_inject_changelogs_dir` doing the same for an unrelated value. A generalisation that
    leaves either of those per-value steps in place for a STANDARD has not satisfied this
    record.
  - >-
    THE CHANGE-SET ARM IS THE ONE CARRYING THE CRITERION, AND HOW IT IS MEASURED IS THE
    CRUX. It is the set of TRACKED files whose content differs between the state before the
    covering statement and the state after the outcome holds — the whole project, including
    generated and compiled material — MINUS exactly what the build legitimately regenerates
    from templates and config. Fix that subtraction ONCE, from the template-compiler
    component doc's own list of build outputs (.claude/**, gemini/**, scripts/** as deployed
    copies), and never widen it to make the arm pass. Measure over `git status --porcelain`
    on the tracked project, not over a fixture the test authored. If a design makes compiled
    output and authored instruction indistinguishable, that is a finding about the design
    and must be raised rather than papered over.
  - >-
    THE ADMISSIBLE CHANGE SET, ENUMERATED. After the single covering statement, the tracked
    diff must contain exactly one file: templates/scripts/commit_guardian/commit_guardian.json.
    NOT config/agent_registry.json (the owner is assigned already, by the arm's Given), NOT
    any templates/agents/*.md, NOT scripts/build.py, NOT scripts/build_phases.py, NOT
    hooks_manifest.hooks, and NOT a per-kind entry in any mapping the carrier consults. Any
    second tracked file in that diff fails the arm, and widening this enumeration is the
    documented way this record gets quietly discharged.
  - >-
    THE REPETITION ARM IS AN O(1) CLAIM AND MUST BE ASSERTED AS ONE. Cover a second,
    different previously-uncovered kind of file assigned to a DIFFERENT owner, and the
    tracked change set must again be that one file and nothing else. Assert the two change
    sets are equal in shape — same single path, same kind of edit — rather than asserting
    each is small. A special case built for the first covering exercise passes a
    per-exercise smallness check and fails an equality-of-shape check.
  - >-
    THE OUTCOME ARM AND THE CHANGE-SET ARM MUST BE ASSERTED AGAINST THE SAME CHANGE, IN ONE
    RUN. The outcome arm alone is satisfied by every hand-built implementation; the
    change-set arm alone is satisfied by a one-line config edit that achieves nothing. Two
    descriptors that each stage their own change prove neither. One staged change, both
    observations.
  - >-
    THE USER'S OWN EXAMPLE IS THE FIXTURE, AND IT IS NOT COVERED TODAY — MEASURED.
    file_size.checked_extensions is ['.py', '.sql'] and file_size.line_limits is
    {'.py': 400, '.sql': 600}. The kind of file named in the originating request appears in
    neither, and the ownership record already assigns it to frontend-coder, which is told
    nothing. That is exactly the arm's Given, available with no synthetic fixture. The
    specific figure is the user's decision at approval and is not a criterion here — the
    descriptor must read whatever figure the declaration carries rather than asserting a
    literal.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around every
    config and registry read and every brief write; log at WARNING or higher or re-raise; no
    bare or blind excepts. A malformed declaration entry must fail loudly rather than being
    skipped — a skipped entry is a standard that silently stops reaching its audience, which
    is INF-1200e-2's degraded-path failure arriving through the carrier instead of the
    examination.
  - >-
    CANONICAL VERSUS BUILD OUTPUT, AND THE BUILD IS PART OF THE CHANGE. Edit
    templates/scripts/commit_guardian/commit_guardian.json only; scripts/commit_guardian/ and
    .claude/ are untracked build outputs overwritten by build.py, and
    templates/commit-guardian/commit_guardian.json is a decoy with no file_size section. Re-run
    `python scripts/build.py --target-dir .` as part of the change (ADR-001), or the covering
    statement is true in the template and false in every deployed brief.
test_spec:
  - name: test_inf_1200b_1_one_declaration_statement_covers_a_new_kind_of_file_and_its_owner_is_told
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      THE OUTCOME ARM. In a controlled copy of the package, state a standard for a kind of
      file that carries none today — the ownership record already assigns it to an owner —
      in templates/scripts/commit_guardian/commit_guardian.json, alter no other tracked
      material, run build.py against a temporary target, and read the produced
      .claude/agents/<owner>.md. That kind of file's standard is stated in its material,
      attributed to that kind, and the value read matches the declaration rather than a
      literal the test authored.
  - name: test_inf_1200b_1_the_only_tracked_file_that_changed_is_the_declaration
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      THE CHANGE-SET ARM, ASSERTED AGAINST THE SAME STAGED CHANGE AS THE OUTCOME ARM AND IN
      THE SAME RUN. After the outcome above holds, the set of tracked files whose content
      differs — measured over the tracked project, minus exactly what the build legitimately
      regenerates from templates and config — contains one path only:
      templates/scripts/commit_guardian/commit_guardian.json. No specialist's own
      instructions were edited, no per-kind entry was added to any mapping the carrier
      consults, no step or case specific to that kind of file appears in scripts/build.py or
      scripts/build_phases.py, and nothing was registered a second time. The exclusion set is
      fixed from the template-compiler component doc and is asserted as a constant, so
      widening it to make the arm pass is visible in the diff.
  - name: test_inf_1200b_1_a_second_covering_exercise_costs_the_same_change_set_as_the_first
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      THE REPETITION ARM. Repeat the exercise for a further previously-uncovered kind of
      file assigned to a DIFFERENT owner. That owner's brief states the new standard, and
      the tracked change set is again that one declaration file. The two change sets are
      asserted EQUAL IN SHAPE — same single path, same kind of edit — not merely each small,
      because a special case built for the first exercise passes a per-exercise smallness
      check. This is the only form in which "the cost does not grow with the number of kinds
      already covered" is observable.
  - name: test_inf_1200b_1_the_authored_placeholder_injection_keeps_the_outcome_green_and_reds_both_cost_arms
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      THE BA's NAMED MUTATION, CARRIED VERBATIM AND OBSERVED AS ONE THREE-WAY EXPERIMENT.
      MUTATION: alongside the single declaration, also add a reference to the new standard in
      the owning specialist's own authored instructions — a named placeholder for that kind
      of file's standard, filled in from the declaration at build time. This is today's
      shipped design generalised, and it is the design a competent implementer arrives at
      first. Under that injection: the outcome arm must STAY GREEN, because the specialist is
      correctly and faithfully informed; the change-set arm must go RED, because a
      specialist's own instructions were edited to cover a kind of file; and the repetition
      arm must go RED for the same reason on the second kind of file. All three outcomes must
      be observed together and all three must revert. AN INJECTION RUN THAT REDDENS THE
      OUTCOME ARM AS WELL IS A FAILURE OF THIS DESCRIPTOR, NOT A STRONGER RESULT — the whole
      point is that this mutation produces a world in which the specialist is RIGHT and the
      promise is still broken. That world is also exactly what INF-1200f-1 accepts, which is
      why the PO refused to merge b and f.
  - name: test_inf_1200b_1_covering_a_new_kind_of_file_reaches_the_deployed_brief_after_a_real_build
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      The covering statement is written into the canonical template only, build.py is run,
      and the DEPLOYED brief under .claude/agents/ carries the new standard in a cold
      process. A carrier module placed outside the directories the build already copies, and
      omitted from the deploy map in scripts/build_phases.py, surfaces here as an import
      failure rather than passing; and a declaration edit that was never built fails here
      rather than passing on source-tree greenness. config resolution beside the deployed
      artefact is the same trap GE-127a-1 records for the commit-guardian side.
test_rationale: |
  This record has two arms that are individually worthless and jointly decisive, so the
  descriptors are built to hold them together. The outcome arm — "the specialist is told" —
  is satisfied by every implementation including every hand-built one; the change-set arm —
  "and nothing else was touched" — is satisfied by a one-line config edit that achieves
  nothing. They are therefore asserted against the SAME staged change in the same run, and
  the descriptor that carries the BA's mutation observes all three arms at once rather than
  reporting them separately.

  The change-set arm is measured over the tracked project with a FIXED exclusion set read
  from the template-compiler component doc, not with an allowlist that grows until the arm
  passes. The BA's notes name that subtraction as the crux and warn about exactly that
  widening; pinning the exclusion set as a constant makes any widening visible in the diff
  rather than invisible in a test's setup.

  The BA's mutation is carried verbatim and its stay-green half is preserved as an explicit
  required observation, with the failure condition stated: an injection run that reddens the
  outcome arm means the arms are not independent and the record has not been proved. That
  stay-green half is also the proof that b and f are different records — the injected world
  satisfies INF-1200f-1 completely while failing this one, which is the negative case the PO
  recorded when refusing the merge.

  Every descriptor runs the real build into a temporary target and reads the compiled brief.
  Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by Grep", a test that asserts
  a placeholder token appears in a template stays green on a build whose output never reaches
  a dispatched specialist — and would also pass under the very mutation this record exists to
  fail.
delivers_to:
  - agent: python-coder
    ac_id: INF-1200c-1
    contract: >-
      The build-time join between config/agent_registry.json's owns_file_extensions and the
      per-kind standards declared in
      templates/scripts/commit_guardian/commit_guardian.json, as a mapping from (specialist
      id) to the set of (kind of file, standard) pairs that specialist owns — computed at
      the moment the brief is compiled, from the records as they stand, with no
      per-specialist and no per-standard enumeration anywhere in the carrier.
  - agent: python-coder
    ac_id: INF-1200d-1
    contract: >-
      The same join read from the other axis: for each declared standard, the set of
      specialists the ownership record assigns the kind of file it governs. d-1 requires
      this to be produced by walking the declaration as it stands, so a standard the
      carrier has never seen appears in it with no step of its own.
  - agent: python-coder
    ac_id: INF-1200e-1
    contract: >-
      The set of (specialist, kind of file, standard) pairings the join yields, which is
      the DENOMINATOR of e-1's examination. e-1 must judge informedness by reading the
      compiled brief and never by reading this carrier's account of what it emitted; the
      contract supplies only which pairings ought to exist.
