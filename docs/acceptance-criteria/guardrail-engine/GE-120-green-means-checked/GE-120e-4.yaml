it_requirements:
  - "TWO SIGNALS, COMBINED — NEVER A MARKER SWITCH. The derivation takes the states the commit is built on AND the record of the operation in progress. REVERT_HEAD and CHERRY_PICK_HEAD are the operation records this AC is about; MERGE_HEAD is a third of the same kind. Branching on 'is a merge in progress' is explicitly forbidden by the fourth criterion — the question is 'what states is this commit built on', and the operation record is one input to that answer, not a mode selector."
  - "EXTEND GE-120e-1'S SHARED SOURCE, DO NOT ADD A SECOND DERIVATION for these operations. Two derivations will disagree, and the disagreement surfaces as one check blocking what another passed — the defect this L1 removes."
  - "RESOLVE THE GIT DIRECTORY WITH PLUMBING. The operation records live in the git directory, and drives in this repository run inside git worktrees where there is no .git DIRECTORY. Use git rev-parse --git-dir (or equivalent) rather than assuming <root>/.git; a hard-coded path makes the whole derivation a silent no-op in exactly the environment the observed defect was hit in."
  - "THE ORDINARY-COMMIT CLAUSE IS A NEGATIVE CONTROL AND MUST STAY TRUE. With no operation in progress and one state, the change set is the author's entire staged content, byte-identical to today's git diff --cached. The cheapest way to satisfy the first two clauses is a narrowing that also quietly exempts ordinary commits, and nothing else in this L1 would catch that."
  - "SCOPING JUDGMENT — CONFIRMED, WITH A CONSTRAINT ON HOW TO REVISE IT. Treating a straight undo as not-the-author's is accepted here: being blocked on deletions that are inherent to reversing someone else's decision is precisely what teaches the override reflex this L1 exists to remove. If a specific check needs the opposite answer, record it as that check's own behaviour on its manifest entry; do not weaken this rule and do not delete this AC — the copy-of-a-recorded-change half stands regardless."
  - "PERFORMANCE. At most one additional git invocation beyond GE-120e-1's derivation, memoised per process. The derivation must not walk history — an undo of a large mainline merge is precisely the case where a history walk turns a pre-commit into a coffee break."
  - "TEMPLATE/DEPLOYED PARITY (ADR-001): the change lands in templates/scripts/commit_guardian/ and must be verified in the deployed layout after build.py, not only in the source tree."
  - "Error-handling policy applies to the git calls: specific exceptions, logged at WARNING or higher, never swallowed, and never degrading to 'attribute everything to the author'."
test_spec:
  - name: test_ge120e4_undo_of_a_large_recorded_changeset_raises_no_objection
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "A real revert of a mainline merge that added tests stages those deletions; check_contract_shrinking, run as a process, does not object to them."
  - name: test_ge120e4_copy_of_a_change_recorded_elsewhere_raises_no_objection
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "A real cherry-pick of a recorded change is attributed to its source, not to the author, and the check stays silent."
  - name: test_ge120e4_authors_own_edits_on_top_of_the_operation_are_inspected
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Content the author wrote on top of the revert or cherry-pick is in the inspected change set and the check reaches its verdict on it."
  - name: test_ge120e4_ordinary_commit_change_set_is_the_entire_staged_content
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "With no operation in progress the rule narrows nothing — the negative control against a narrowing that quietly exempts ordinary commits."
  - name: test_ge120e4_carried_in_content_excluded_with_no_merge_marker_present
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "On an operation where no merge marker exists at all, carried-in content is still absent from what the check objects to — the load-bearing clause."
test_rationale: "The fourth criterion cannot be covered by any merge fixture, so the contract is built around operations in which no merge marker exists: a real revert and a real cherry-pick, each performed as a repository operation with the check executed as a process against the resulting staged state. An implementation that keys on MERGE_HEAD passes every merge test in this L1 and fails only here, which is why those two cases are non-negotiable. The ordinary-commit case is a negative control rather than a restatement — the cheapest way to make the first two cases green is a narrowing that also exempts ordinary commits, and GE-120e-3's ordinary arm has no operation in progress and would read that as agreement. Direct-import testing of the derivation cannot cover any of this: the signals are git state, and the criterion is what the check does with them."
