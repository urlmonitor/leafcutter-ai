criteria: |
  Given the reuse question for the precedent dec-dfb0b8d1eb88ec16 (scored 0.88, it chose
    opt.reuse_at_0_9),
  When you choose to decide anew,
  Then the forming flow continues with grounding research, and the precedent is kept as evidence
    with action set_aside,
  And when your final choice differs from the precedent's, for example opt.reuse_at_0_8, the staged
    record lists dec-dfb0b8d1eb88ec16 under supersedes and its publish command carries
    --correct dec-dfb0b8d1eb88ec16,
  And when your final choice is the option the precedent chose, the staged record supersedes
    nothing,
  And the run changes nothing in dec-dfb0b8d1eb88ec16.
