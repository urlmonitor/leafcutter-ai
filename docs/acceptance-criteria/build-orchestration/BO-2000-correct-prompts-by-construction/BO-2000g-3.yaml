notes: |
  Why the heading recognition is wider than the KI's wording. The KI says
  "every `### YYYY-MM-DD HH:MM — ` example". The building-epics skill writes three note
  headings as `### <today> <time> — ` (:457, :496, :546), including both proxy sign-offs
  of a skipped phase. A lint keyed only on the YYYY-MM-DD spelling passes them
  unexamined.

  The lint is a shape check. It cannot tell a note from a phase sign-off, so it accepts
  `(not-a-signoff)` on any example. Misuse (a phase sign-off example using it) is
  prevented by BO-2000g-1's last clause and the signoff skill's rule (BO-2000g-2), not by
  this lint.

  Accepting the fallback "as the signoff skill documents it" keeps this record valid
  when INF-500d-3 changes the fallback's spelling. Out of scope: the commit-time hook's
  own value check, and removing the [NO-FEEDBACK-CHECK] bypass (GE-123).

  Observed and NOT in scope: live-surface-tester.md:323 uses `(status: skipped)`, which
  is outside the signoff skill's four status values. The lint keys on `(status: ...)` with
  any value, so it still examines that example.
