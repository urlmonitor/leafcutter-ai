id: GE-120g-4-i
title: "Seeing the same verdict again on a later day is not news, so the liveness check leaves the stored record and the file alone and writes only when a verdict actually changes"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  GE-120g-4 says a run of the liveness check that finds no `currently` block
  needing an update leaves the deployed manifest byte-for-byte identical. On the
  day the manifest was built that holds. On every later day it does not: each run
  builds a fresh `currently` record stamped with today's date and today's
  evidence, so a run that sees exactly what the last one saw still differs from
  what is stored, and the file is rewritten. The next commit then fails
  `check-output-drift` on a file the author never touched — the very defect the
  parent exists to close, reached by the calendar instead of by the rendering.

  This record fixes what "needing an update" means.

  Definition — "the same verdict". A newly observed verdict is the same as the
  stored one when, and only when, all of these hold:
    - its `state` equals the stored `state`,
    - it carries the same number of evidence entries as the stored record,
    - each evidence entry, taken in order, names the same command and ended
      with the same exit code as the stored entry in that position.
  The output text an evidence command printed is NOT part of the verdict, and
  neither is the date. A verdict is a fact about what the probes decided; the
  exit code is that decision. The text around it may legitimately change with
  nothing about the decision changing — a linter upgrade rewords a message, a
  version string in a banner moves from one release to the next — and if text
  counted, every such upgrade would rewrite the deployed file in every built
  layout and break the following commit, which is the defect this record closes.
  A changed command or a changed number of entries does count: the check is then
  examining something different, and the stored record would otherwise describe
  a probe that no longer runs.

  Definition — `observed`. After this change, `observed` is the date on which the
  current verdict was FIRST observed, not the date of the most recent run. It
  answers "since when has this been true?", and it moves only when the verdict
  does.

  Scenario: Re-observing the same verdict on a later day changes nothing
    Given a deployed manifest whose negative control has a stored `currently`
      record with `state: passing`, `observed: 2026-10-11`, and two evidence
      entries — the known-bad probe with exit code 1 and the known-clean probe
      with exit code 0,
    And the check is run on 2026-10-12,
    And on that run the known-bad probe again exits 1 and the known-clean probe
      again exits 0, so the state is again `passing`,
    When the check runs to completion and exits,
    Then the stored record still reads `state: passing` and `observed: 2026-10-11`,
    And its evidence entries, including their output text, are exactly as they
      were stored,
    And the manifest file's bytes are exactly what they were before the run,
    Because nothing the author needs to know has changed, and a file that changes
      every morning for no reason is a file whose changes nobody can trust — and
      here it also blocks the day's second commit.

  Scenario: Different wording around the same decision is still the same verdict
    Given the same stored record as above,
    And on this run the known-bad probe exits 1 and the known-clean probe exits 0,
      but the known-bad probe's printed message is worded differently from the
      stored output text, as it would be after a linter upgrade,
    When the check runs to completion and exits,
    Then the stored record, including the old output text and `observed:
      2026-10-11`, is kept unchanged,
    And the manifest file's bytes are exactly what they were before the run,
    Because the stored evidence is the record of when this verdict was first
      established, not a transcript of the latest run.

  Scenario: A verdict that changes is recorded
    Given a stored `currently` record with `state: passing` and `observed:
      2026-10-11`,
    And on a run made on 2026-10-12 the known-bad probe now exits 0 — the control
      no longer catches what it exists to catch — so the newly observed state is
      `failing`,
    When the check runs to completion and exits,
    Then the stored record reads `state: failing` and `observed: 2026-10-12`,
    And its evidence entries are the ones from this run, with this run's commands,
      exit codes and output text,
    And the manifest file on disk has been rewritten to carry that record,
    Because a check that keeps its file still by never writing it would hide the
      one event this record exists to surface: a control that stopped working.

  Scenario: Every direction of change is a change
    Given a stored `currently` record in one of these states, and a run whose
      newly observed state differs from it:
        | stored     | newly observed |
        | passing    | failing        |
        | failing    | passing        |
        | unverified | passing        |
        | unverified | failing        |
    When the check runs to completion and exits,
    Then for each row the stored record carries the newly observed state, the
      date of that run as `observed`, and that run's evidence,
    Because a recovery is as much news as a failure, and a control's first real
      observation is the most important entry it will ever get.

  Scenario: Same state, different exit code, is a change
    Given a stored `currently` record with `state: failing` whose known-clean
      evidence entry ended with exit code 1,
    And on a later run the state is still `failing` but the known-clean probe now
      ends with exit code 2,
    When the check runs to completion and exits,
    Then the stored record carries this run's evidence and this run's date as
      `observed`,
    Because the exit code is the decision itself; two different decisions that
      happen to fold into the same state are still two different things to have
      seen.

  Scenario: The verdict and the printed result are unaffected
    Given any manifest and any stored `currently` records,
    When the check runs,
    Then the per-check result lines it prints and the exit code it ends with are
      what they would have been before this change,
    Because this record governs what the check writes down, not what it decides
      or reports — the same fence its parent draws.
