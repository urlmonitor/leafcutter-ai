readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Tests run against the real data your tools produce — never hand-typed stand-ins.

  Tests build their inputs from the actual thing the system produces and read back,
  and behaviour is checked against the real on-disk artifact — so a test can never
  pass on tidy hand-made data that never occurs in reality while the feature is
  broken on the data that does.
