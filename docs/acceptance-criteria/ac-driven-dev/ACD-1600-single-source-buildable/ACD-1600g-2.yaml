  contract: "read_boundary(ac_record) -> { declared: bool, paths: list[str] } -- the three-state per-requirement boundary read. The `declared` flag must survive into the composition; collapsing absent into empty at this seam makes ACD-1600g-4 unimplementable."
test_spec:
  - name: test_release_workflow_stays_in_the_bundle_boundary_because_no_member_changes_it
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Composes the boundary over three real on-disk AC records matching the criteria's Given clauses and asserts the release workflow is present in the result."
  - name: test_runbook_excluded_by_one_member_is_cancelled_by_another_members_change_surface
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Same three real records: asserts the build-orchestration runbook is ABSENT from the composed boundary because the third member's derived change surface names it. This is the only test a naive-union implementation fails, so the failure is diagnosable from the test name alone."
  - name: test_bundle_with_no_declared_exclusions_yields_an_empty_boundary
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Three real records none of which declare a boundary: asserts the composed boundary is empty and is NOT the complement of the members' change surfaces."
  - name: test_composition_is_order_independent_and_byte_stable
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Composes the same three members in several permutations and asserts identical serialised output each time."
  - name: test_change_surface_comes_from_the_shared_derivation_not_a_local_copy
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Adds a path token to one member's it_requirements prose and re-composes with no other edit; asserts the newly derived path now cancels a matching exclusion. A second, divergent copy of the change-surface derivation fails this."
test_rationale: "The composition rule is a statement about the RESULT, so the tests must assert the result of a real run. A test that inspects the implementation for a difference operation rather than a union is a grep test in disguise -- it passes on code that computes the difference and then discards it, and it fails on a correct implementation written with a comprehension. A direct-import unit test handed two pre-built Python sets is worse: the minuend is the part most likely to be wrong, because it comes from `_build_files_touched()` scraping prose path tokens out of it_requirements, and a test that supplies the sets itself bypasses exactly that derivation. So every fixture is a real AC YAML record on disk composed through the real entry point. The second test is constructed so that only it fails under a naive union, and the last test exists because a copied change-surface derivation passes every other test in this list on the day it is written and diverges silently afterwards."
