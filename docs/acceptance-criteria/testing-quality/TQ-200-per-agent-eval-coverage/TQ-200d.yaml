documentation_rationale: >-
  Adds eval cases for existing agents to the existing harness; no new command,
  workflow, agent or component, and TQ-200b's documentation already covers how
  eval sets are run.
notes: |
  ORIGIN. Phase B planning of the discrimination initiative (2026-09-28), scope
  item 2. Seven prompt-only ACs set test_required: false and each names an eval
  as the behavioural proof it cannot have as a unit test, "in a follow-up AC":
    - TQ-500f-2-ii  the test designer names wrong versions (must_catch) for a
                    bug fix (R1) and a gate (R2), and none for new behaviour (R3)
    - TQ-500f-3     absence red vs assertion red (test A for a new function,
                    test B a regression of existing code)
    - TQ-500f-4     the three questions and the vacuity checklist, incident-1
                    refresh gate (refresh_due and retry_due)
    - TQ-500f-4-i   the database test writer labels its answers reasoned, not
                    observed, and lists wrong versions "to run later"
    - TQ-500f-4-ii  C1 (buy_volume >= 0 over an all-NULL window) and C2
                    (presence is not correctness)
    - INF-1100d-2   database tests use the configured connection, no other
    - INF-1100d-3   W1 (setting missing, database work) / W2 (no database work)
  This L1 gives those evals one home and one promise.

  PLACEMENT — WHY HERE AND NOT UNDER TQ-500.
    - TQ-500 holds 7 L1s (its cap). TQ-500f is at a 6-L2 override. TQ-500g is
      planned at exactly 5 L2s (see its notes). Each would need a cap raised.
    - The subject is the quality of AI agents, measured by scored cases, which
      is TQ-200's charter ("every AI agent that writes or judges is guarded by an
      eval set"). TQ-200 holds 3 L1s, so a fourth needs no override.
    - TQ-200c-4 already states the general rule; this L1 is its first concrete
      instance, for the agents whose prompt ACs asked for it.
    - An L1 rather than an L2 under TQ-200a: TQ-200a is the generic "every
      in-scope agent has an eval set" and is at 4 L2s; the incident-derived
      cases for four agents are a feature in their own right and will need
      three to four L2s.

  SCOPE WIDENING TO FLAG FOR THE BA. TQ-200a-1-i names seven in-scope agents
  (pt-classifier, mock-data-author, mockup-author, flow-author, product-owner,
  business-analyst, it-po). test-writer, sql-test-writer, test-designer and
  test-runner are not on that list. This L1 adds them. The BA should check
  TQ-200a-1-i is not read as a closed list, and amend it if it is.

  SUGGESTED L2 SPLIT (BA's call), one per agent so each can ship on its own:
    1. test-writer: incident 1 refresh gate (produced test must go red when
       retry_due is left unset, and the report lists that wrong version);
       TQ-500f-3 test A / test B (absence red accepted only for the new
       function); C1 and C2 from TQ-500f-4-ii. Trap: a request whose natural
       fixture seeds only the old input (incident 2, cvd vs cvd_delta_30).
    2. sql-test-writer: a stored-procedure regression test; every answer
       labelled reasoned, none claiming an observed run; the wrong version listed
       "to run later"; C1 in its SQL shape.
    3. test-designer: R1 / R2 / R3 from TQ-500f-2-ii. BLOCKED until the agent
       exists (ACD-2500d-5) and TQ-500f-2-ii is built; carry that dependency on
       this L2, never on this L1 (the fast lane pulls every unmet dependency
       into the build set).
    4. test-writer and test-runner, database setting: INF-1100d-2 (configured
       address used, nothing else named) and INF-1100d-3 W1 / W2 (W2 is the
       trap: no mention of the missing setting when no database work exists).
  Each set carries at least one negative case (TQ-200a-4).

  WHERE A JUDGE IS NOT NEEDED. Several expected outcomes are mechanically
  checkable once the agent has produced a test: "the produced test goes red
  when retry_due is left unset" is a wrong-version run, which TQ-500g-1's
  shared runner performs. The BA/IT-PO should prefer that deterministic check
  over an LLM-judge rubric wherever the row allows it, and keep the judge for
  report wording (reasoned vs observed, the three answers).

  CONSTRAINTS FOR DOWNSTREAM AUTHORS.
    - Rows join the existing harness (scripts/evals/agent_eval_config.json,
      scripts/evals/run_agent_eval.py, artifact scoring), per TQ-200c-4. No
      second harness.
    - Rows are the evidence for their prompt ACs, but the prompt ACs are not
      edited in this pass (TQ-500f-2-ii and TQ-500f-3 have pending amendments on
      branch ac-authoring/tq-500f-2-ii-amend). When this L1's L2s are written,
      each prompt AC's test_rationale should point at its row; do that after
      that branch merges.
    - The cases come from one adopter's written record, not re-verified against
      its history (same caveat as TQ-500f-5).
    - Any database address in a row is the placeholder
      postgresql://<user>:<password>@<host>:<port>/<database>, never a real one
      (INF-1100d-4 scans shipped files).

  KNOWN LIMIT. The CI eval gate has never evaluated an agent
  (KI-TQ-20260907). Until TQ-200b-2 and that issue are fixed, these rows are run
  locally and their results reported by hand; CI will not block on them.
