it_requirements:
  - "The default-deny gate in leafcutter-web/middleware.ts / leafcutter-web/lib/data/mock.ts must be scoped to production only: in a non-production (dev or preview), unlocked deployment with no opt-in, ?mock=1 must be honored and resolve to mock without any configuration."
  - "Production-vs-non-production must be detected from a single, explicit server-side signal (e.g. NODE_ENV / deploy-target env) evaluated server-side, never inferred from untrusted request input; the same signal must be used consistently by the default-deny gate and any documentation."
