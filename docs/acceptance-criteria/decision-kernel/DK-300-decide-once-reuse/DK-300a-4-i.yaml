id: DK-300a-4-i
title: "When the Jev budget runs short you are asked early, on limited evidence"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a run with a Jev call budget of 20 (limits.max_jev_calls),
  And a completed assessment after which the calls left cannot fund another research round plus a
    final assessment,
  When the budget gate checks the next round,
  Then no further research round starts,
  And you are asked the ranked-choice question from the last complete assessment,
  And the question and the run's limitations state that the ranking was made on limited evidence.
