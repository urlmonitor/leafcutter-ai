title: "Broken-reference errors name the file, the referencing template, and the fix"
component: build_pipeline
level: L1
status: active
req_status: approved
readiness: approved
priority: critical
work_status: not_started
criteria: |
  Given the build-time guard (BP-900b) has detected one or more broken script
  references,
  When it prints the error report,
  Then each entry includes:
  (a) the missing script path,
  (b) the template file(s) that reference it,
  (c) a suggested action (e.g. "add a deploy phase in build_phases.py" or
      "add to the external-dependency allowlist"),
  And the report is printed to stderr with a non-zero exit code,
  And the output is parseable by downstream tooling (one finding per line or
  structured JSON).
