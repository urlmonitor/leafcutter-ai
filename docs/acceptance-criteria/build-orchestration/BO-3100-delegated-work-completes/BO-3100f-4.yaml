notes: |
  CLAUSE 3 OF THREE, and BO-3100f says it is the one absent everywhere. It is the
  clause that makes the other two durable: without it, the cheapest way to stop a
  stopped step spoiling the run's verdict is to decide the step was never needed.

  The counted comparison — steps supposed to perform against steps performed — is
  what makes this checkable by executing a run rather than by reading intentions.
  The fourth scenario keeps that comparison honest in the other direction.

  NOT A RELAXATION, binding across this whole tree: no criterion may be satisfied by
  removing an obligation. This record is that constraint written as behaviour.
