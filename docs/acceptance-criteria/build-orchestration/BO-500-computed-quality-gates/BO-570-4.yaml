it_requirements:
  - "The sign-off-gate behavior lives in the python-coder template + signoff skill prose; it invokes the repo-ruff runner (BO-570-3) and gates on its verdict — it must NOT re-implement the ruff invocation in prose."
  - "On a violations verdict the sign-off MUST be failed/blocked, never advisory — lint violations cannot be downgraded to a warning that still allows an 'ok' sign-off."
  - "python-coder must invoke the ruff check as part of its sign-off and must not reach an 'ok' verdict on a Python surface whose ruff verdict is anything other than clean; this gate must not rely on the worktree pre-commit hooks firing."
