assigned_agent: architecture-diagram-author
estimated_complexity: M
it_requirements:
  - "Every element the diagram names must resolve to something that exists in the delivered system at the commit the diagram ships. A diagram that documents an intention creates a belief worse than no documentation, and this component has a recorded instance of exactly that."
  - "The absent arrow is a requirement, not a stylistic choice: the census must have no write path into the checks it examines. The reporting-not-repairing constraint is the one most likely to erode once the census returns a long list, and a picture without the arrow is harder to erode quietly than a sentence in a note."
  - "The population must be drawn as derived from the registration data, not as held by the census. If the diagram shows a census-owned list it documents the design GE-126e-3 forbids."
  - "The census and the adjacent parity comparison must be visibly distinct, and whether they share execution machinery must be shown rather than left for the reader to infer. Two probes that look identical invite the conclusion that one is redundant."
  - "Follow the layout, numbering and naming conventions in docs/reference/architecture-docs-layout.md, and satisfy check_diagram_naming, check_mermaid_complexity, check_mermaid_drift and check_mermaid_parent_link at the commit that lands the diagram. These are enforced mechanically and a diagram that trips them does not land."
  - "The diagram must be covered by a resolution check in both directions - every named element exists, and no participant the census actually reads is missing. A one-directional check passes on a diagram that omits half the system."
test_spec:
  - name: test_every_element_named_in_the_diagram_resolves_to_a_real_participant
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: "the census diagram in docs/architecture/components/commit-guardian.md"
    description: "Each element the diagram names is resolved against the delivered system - script, registration surface or invocation entry point - and every one exists. A named element that does not resolve fails."
  - name: test_no_participant_the_census_actually_reads_is_missing_from_the_diagram
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: seam
    description: "The set of surfaces the census actually reads at run time is collected from an instrumented run and compared against the diagram's participants - the reverse direction, without which a diagram omitting half the system passes."
  - name: test_the_diagram_shows_no_write_path_from_the_census_into_the_checks
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: boundary
    description: "The diagram source contains no edge directed from the census into any check it examines, matching GE-126e-2-i's byte-identical-inputs guarantee. The picture and the behaviour are asserted to agree."
  - name: test_the_census_and_the_parity_comparison_are_distinct_participants
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "The diagram renders the census and the adjacent parity comparison as two participants with their shared-or-separate execution machinery shown, so neither reads as the other."
test_rationale: |
  A diagram accepted on inspection is the documentation equivalent of a check nobody ran,
  and this component has already shipped documentation describing behaviour that never
  existed. Resolving every named element against the delivered system is the forward
  check; the reverse check — collecting what the census actually reads at run time and
  comparing — is the one that catches a diagram that is true as far as it goes and omits
  half the system, and it is the descriptor that would be dropped first. The no-write-arrow
  descriptor is unusual for a diagram test and is deliberate: it asserts that the picture
  and GE-126e-2-i's byte-identical-inputs guarantee agree, so the two cannot drift apart
  when the census returns a long list and someone proposes it start fixing things.
delivers_to: null
