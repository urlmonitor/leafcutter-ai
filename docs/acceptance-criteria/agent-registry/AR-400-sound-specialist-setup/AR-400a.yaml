notes: |
  A FAULT, NOT A WARNING. The user's wording: "failing the build instead of
  printing noise". A reference to a nonexistent ability stops the build.

  THE CHECK THAT ALREADY EXISTS. The source analysis notes a better check is
  already in the repository and wired to nothing (KI-BP-007). Prefer wiring
  that over writing a third check; the BA/IT PO decide.

  SCOPE OF "INSTRUCTIONS". Specialist definitions and the shared guides they
  are pointed at both count -- the README instance is in a shared guide.
  A reference inside a recorded decision history (not an instruction) is not
  a reference; KI-BP-007 already documents that exclusion.

  ABILITIES THE PROJECT SUPPLIES are not "nonexistent" just because the
  package does not ship them -- AR-400d owns that case and this L1 must
  respect it.

  2026-10-21: test contract (test_spec, test_rationale) added for composite
  closure, at the user's decision ("Add parent tests, then close"), so this
  parent can be proven done by covering tests of its own. Criteria, readiness
  and every requirement-defining field are unchanged.
