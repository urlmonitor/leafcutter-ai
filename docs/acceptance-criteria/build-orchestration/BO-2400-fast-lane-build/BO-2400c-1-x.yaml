amended_by:
  - agent: it-po
    date: "2026-09-14"
    reason: "TECHNICAL ENRICHMENT ONLY — criteria, title, level, depends_on, covered_by, declares_side_effect, change_target, risk_surface, test_required, test_rationale and notes are untouched. Added assigned_agent, estimated_complexity, it_requirements, delivers_to, expects_from, test_spec, one doc_link, and readiness draft -> reviewed. What this pass adds. (1) THE ANTI-THRESHOLD RULE IS STATED AS A PROHIBITION ON A CODE SHAPE, not as a property of outcomes: no branch may gate, skip or shortcut the comparison on a size, because a size-gated check is the optimisation most likely to be reached for once the check exists and the payload is usually small — and the 2026-08-31 failure was 18,190 bytes. Paired with a performance statement so nobody has to guess whether the optimisation is needed: a digest over 150 KB costs under a millisecond, so there is no latency argument for making the check conditional. (2) THE SHORTFALL TEST IS BOUNDED BY WHAT THE LANE CAN KNOW. The lane does not hold the produced bytes and cannot prove the received text is a genuine prefix of them; what it can do is compare the stated byte count against the received one and report both. Written the other way, this criterion would be unimplementable within the engine's constraints. (3) The shortfall message is required to be built at the SAME site as BO-2400c-1-ix's four causes, so the two records cannot drift into two sites. implemented_by deliberately left empty — in this family it is a back-reference populated at done."
