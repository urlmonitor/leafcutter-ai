notes: |
  DOCUMENTATION AC, produced because ACD-2000a declares
  `documentation_triggers: [reference-doc, state-diagram]`. This is the
  reference-doc half; ACD-2000a-5 is the state-diagram half. Craft deliberately
  LEFT UNSET this pass (assigned_agent / it_requirements / estimated_complexity /
  contracts are the IT PO's); the intended craft is the documentation surface.
  ACD-1800a-3 is the sibling precedent.

  THE AUDIENCE HERE IS AN OPERATOR, NOT ONLY AN AUTHOR -- and that is why the
  final Then clause is phrased as a diagnostic capability. This trail's reason
  for existing is that somebody picks up stalled work and needs to know how many
  attempts have already been made "without reconstructing it from memory"
  (ACD-2000a's own criteria). Documentation that explains the field shapes but
  not how to read a stuck requirement misses the actual use.

  THE PER-RUN vs PER-LIFETIME SENTENCE IS THE MOST IMPORTANT ONE IN THE DOC.
  ACD-2000a's hazard 2 is that persisting the counter silently changes the
  semantics: "two flaky-infrastructure failures a week apart would become a
  permanent halt". Whichever ACD-2000a-2 settles on, an operator who does not
  know which one is in force will misdiagnose every halt they see. And if it is
  per-lifetime, the clearing procedure is an operational runbook item, not an
  implementation detail -- without it documented, the first exhausted budget
  becomes a support incident.

  THE ZERO-BUDGET SENTENCE is documented for the same reason it is specified in
  ACD-2000a-3: "declared zero" versus "declared nothing" is a distinction that
  readers collapse by default, and collapsing it silently doubles the budget of
  every requirement that asked for none.

  WHY APPEND-ONLY NEEDS ITS "WHY" IN THE DOC, not just its "what": the rule looks
  like bookkeeping fussiness until you know that the trail IS the retry budget,
  so any rewrite is a silent cap reset. A doc that states the rule without the
  consequence produces the next author who "tidies up" the log.

  ACCEPTANCE IS COMPREHENSION, NOT PRESENCE -- verify by having a reader answer
  the diagnostic question, not by checking that a heading exists.

  2026-08-17 (IT PO enrichment). Assigned documentation-expert per the S7b
  documentation-gate mapping for the `reference-doc` trigger and the BA's recorded
  intent. Complexity S: an extension to one existing reference page.

  PLACEMENT DECISION MADE THIS PASS: extend docs/reference/ac-schema.md. It is the
  incumbent field reference for the AC record (43 KB, already the canonical
  description of every slot), and every field this tree adds is an AC-record field.
  Verified there is no existing adjudication or retry-budget reference to compete
  with -- docs/reference/ holds no such page -- so the risk here is forking the
  field reference, not colliding with a peer.

  SEQUENCING FLAG. This AC's depends_on list is not decorative. The second
  criterion cannot be satisfied until ACD-2000a-2 settles per-run vs per-lifetime,
  and the third cannot be satisfied until ACD-2000a-3 fixes the declared-budget
  field name and its zero semantics. Writing this doc early produces a confident
  wrong reference, which for an operator-facing diagnostic guide is worse than an
  absent one.
