id: BO-4400g-4
title: "Every flow that makes a workspace clears it by naming its work once its pull request has merged, and leaves anything kept to the landed-work pass"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
  - build_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: safety
criteria: |
  Given each of these flows is run against a real test project with a real shared project,
    each in a workspace obtained from the one workspace maker, and each driven to the point
    where its pull request has been merged into the main line before the flow returns (for
    ship, its work merged directly into the main line):
    - requirements authoring, for the work "ac/clear-merged-workspaces",
    - the fast lane, for the work "fastlane/tq-200d-3",
    - the feature build followed by finalizing it, for the work "feature/alpha",
    - the quick fix, for the work "ticket/fix-null-slug",
    - ship, for the work "feature/beta",
  When each flow returns its final result,
  Then no folder remains at the location its workspace occupied,
  And the flow's final result contains the clearing door's own answer for that workspace,
    reporting it cleared,
  And the clearing request the flow sent named its work by the same name it used to obtain
    the workspace, and gave no location,
  And the clearing request was made after the work was merged into the main line,
  And no flow other than finalizing dispatched an agent whose registered abilities include
    removing a workspace or deleting a branch: each of their clearing requests was the one
    clearing command, run exactly as given,
  And finalizing's only such dispatch was its step-7 workspace removal, carrying beside its
    clearing request the authorization that names exactly its own workspace and line of work.

  Given the fast lane for the work "fastlane/tq-200d-4" is driven to the point where its
    pull request is open and not yet merged into the main line when the flow returns,
  When the flow returns its final result,
  Then the workspace of "fastlane/tq-200d-4" still exists, identical to its state when its
    pull request was opened,
  And the flow's final result reports that workspace as kept because its work is not yet
    on the main line.

  Given that pull request is afterwards merged into the main line by hand and the workspace
    holds nothing unsent,
  When the landed-work pass is next run,
  Then the workspace of "fastlane/tq-200d-4" is cleared,
  And no step of the fast lane, or of any other flow, was run between the flow's return and
    that clearing.
depends_on: [BO-4400g, BO-4400g-1, BO-4400g-2, BO-4300f-1, BO-4300g-1, BO-4300g-2, BO-4300g-3]
