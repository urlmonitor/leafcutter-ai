title: "Record what a requirement is made of separately from what proves it"
component: ac-store
level: L0
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Two different answers stop competing for one place to be written down.

  What a requirement is made of, and what proves it, are different facts about
  it. Today they share one place with nothing to tell them apart, so every tool
  that looks has to guess which one it is reading — and when the guess comes out
  wrong, the store changes its mind about whether that requirement can be
  finished. That is why correcting an incomplete list of parts is currently an
  edit nobody can safely make. When each answer has a place of its own, a
  finished claim is judged against the kind of evidence that actually settles
  it, and completing a requirement's list of parts becomes an ordinary
  correction with no side effects.
