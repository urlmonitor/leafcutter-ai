id: INF-500e-2-i
components:
  - infrastructure
  - agent_telemetry
title: "A truncated merge history is reported as unknown for the weeks it cannot reach, not as a quiet period"
component: infrastructure
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a merged-pull-request query issued with a budget of 120 results that returned
    exactly 120 — the budget was reached — whose oldest returned merge is dated
    2026-08-17, while the oldest reporting week begins 2026-07-06,
  When the trustworthy reach of that result page is determined,
  Then the page is judged to reach back only to 2026-08-17,
  And the stated reason names the 120-result cap and the date 2026-08-17,
  So that every reporting week starting before that date is rendered as unknown
    instead of carrying a count the query never had the room to collect.

  Given a query issued with a budget of 480 results that returned only 120,
  When the trustworthy reach of that result page is determined,
  Then the page is judged to reach every reporting week and no reason is stated,
  Because a query that came back under its budget has already returned every merge
    there was.

  Given a query that returned exactly its 480-result budget but whose oldest returned
    merge, 2026-07-01, is older than the oldest reporting week of 2026-07-06,
  When the trustworthy reach of that result page is determined,
  Then the page is judged to reach every reporting week and no reason is stated,
  So that hitting the budget is not by itself treated as truncation when the results
    already span the whole reporting range.

  Given a query that returned no merges at all against a budget of 480,
  When the trustworthy reach of that result page is determined,
  Then the page is judged to reach every reporting week and no reason is stated,
  So that a repository with no merged pull requests reports zero rather than unknown.
depends_on:
  - INF-500e-2
