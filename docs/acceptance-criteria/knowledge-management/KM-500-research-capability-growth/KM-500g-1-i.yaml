change_target: code
risk_surface: contract_boundary
notes: RQ8 negative case extending existing telemetry-loss behavior to caller-visible answerability and standalone
  delivery. No new independent telemetry stack or retry policy. Draft authored from the user-requested BA template
  pass; no real provider, database or tracing call was performed.
it_requirements:
- Preserve immutable source provenance, bounded registered read-only queries and existing authorization, budgets
  and retries. No arbitrary Cypher, new network endpoint, source-write permission, independent telemetry store or
  automatic activation is added.
- 'Keep observation optional and failure-isolated: preserve retrieval evidence and fulfillment when disabled, initialization
  fails, export is rejected or final flush fails.'
- Return distinct disabled, attempted-but-unavailable and established delivery states. A correlation ID may exist
  without an accessible trace; warnings remain sanitized and bounded.
- An observation failure cannot repeat retrieval, capability construction, catalog activation or provider calls.
  Existing retries remain attributable, bounded and subject to original authorization.
- 'Late finalization errors are not research errors: successful retrieval with a required-field gap remains unresolved,
  and unavailable retrieval is never a successful empty answer.'
test_required: true
test_rationale: Planned criterion and public-interface proof covers real producer/consumer and serialized boundaries
  with named wrong outcomes. Offline/scripted checks cannot establish real-provider, remote-ingestion or deployment
  readiness; unavailable live prerequisites remain not_run.
test_spec:
- name: test_public_research_survives_disabled_and_unavailable_observations
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Run the same public request with observations disabled and then unavailable; compare identical retrieval
    evidence/fulfillment and distinct caller-visible delivery states.
  must_catch:
  - Failing retrieval because tracing fails or hiding disabled versus unavailable.
  covers:
  - KM-500g-1-i
  requires_db: false
  surface_invoked: python -m knowledge retrieve with the authorized existing observation composition
- name: test_observation_loss_cannot_fabricate_trace_or_answer
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Exercise incomplete and unavailable retrieval under observation loss; assert no accessible trace
    claim, false fulfilled answer or fabricated successful empty search.
  must_catch:
  - Converting missing work_status into completed research after observation loss.
  covers:
  - KM-500g-1-i
  requires_db: false
- name: test_late_observation_failure_does_not_reexecute_research
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: seam
  description: Fail the real observation consumer during final flush and count calls at retrieval/build boundaries;
    assert the existing result returns once with warning and no implicit second retrieval, build or registration.
  must_catch:
  - Repeating a capability build after a telemetry flush error.
  covers:
  - KM-500g-1-i
  requires_db: false
