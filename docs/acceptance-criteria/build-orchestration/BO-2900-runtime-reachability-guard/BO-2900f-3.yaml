id: BO-2900f-3
components:
  - build_orchestration
  - supervisor_system
title: "A skipped gate is reported apart from a passing gate and never satisfies a requirement that it pass"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a work item whose recorded gate results contain gate A with outcome `passed`
    and gate B with outcome `skipped` and a reason,
    And gate B carries a requirement that it must pass before the work item is done,
  When the run's completion summary is produced and the work item is assessed for
    done-ness,
  Then the summary lists gate B under a skipped outcome, separately from the gates
    that passed, and repeats the reason it did not run,
    And gate B is not included in any count or statement that all requested gates
      passed,
    And the requirement that gate B must pass is reported as UNMET, not as satisfied,
    And the work item is assessed as NOT done, because `skipped` is not one of the
      outcomes that make a requested gate done-eligible,
    And the work item becomes done-eligible only when gate B is run and passes, or
      when gate B is explicitly re-classified as not required for this work item —
      never as a consequence of the skip itself,
    And a work item whose only non-passing gate is a skipped one is distinguishable,
      from the summary alone, from a work item on which every requested gate ran and
      passed.
depends_on:
  - BO-2900f
  - BO-2900f-1
