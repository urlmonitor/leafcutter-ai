notes: |
  Satisfies the reference-doc entry in BO-3200e's documentation_triggers.

  THREE ANSWERS, NOT TWO, is the entire content of this document, and stating it as a definition
  an author reads before writing a check is what stops the two-answer habit from being re-created
  at each new site. The habit is not carelessness: fail-closed with a boolean genuinely has only
  two values, so an author reaching for the safe default has nowhere to put "I could not look"
  and puts it in the failure bucket. Naming the third answer gives them somewhere.

  THE THIRD SCENARIO PREVENTS A KNOWN CONFUSION. GE-120a-1 already guarantees the other direction
  — a failed inspection must not report a clean pass — and a reader who finds one of the two
  will reasonably assume the question is settled. Saying explicitly that both are required is
  cheaper than the alternative, which is discovering the gap the way KI-BO-018 was discovered.

  The second scenario makes the definitions executable, so the document cannot drift from the
  behaviour BO-3200e-3 enforces.

  IT-PO ENRICHMENT NOTE (2026-08-26). This page is one of four documentation ACs across the two
  trees that use BO-3100d-1's claim-to-check pairing (the others being BO-3100a-4, BO-3100d-3 and
  BO-3200a-3). That is deliberate: one mechanism, four consumers. Four separately-invented pairing
  schemes would each be correct and jointly unmaintainable, and the first one to be forgotten
  would rot invisibly — which is the failure mode all four exist to prevent.
