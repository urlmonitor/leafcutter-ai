notes: |
  The steward is a STORE-WIDE analyst, not a per-authoring-run consumer. The
  per-run consumer behavior (detect an EXISTING pattern and link to it) is
  ACS-500c and must not be re-specified here. This AC covers detection of
  recurrence across ACs that do NOT yet share a pattern.
