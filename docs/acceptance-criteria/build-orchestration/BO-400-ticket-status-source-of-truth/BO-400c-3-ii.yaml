title: "Branch commit moving a ticket into tickets/99_done/ is blocked (finalize carve-out)"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
criteria: |
  Given the sanctioned completion location tickets/99_done/ is reserved
    for the finalize-feature archive step on main,
  And a staged BRANCH commit moves a ticket from tickets/01_todo/...
    (or an epic folder) into tickets/99_done/...,
  When the pre-commit done-folder prohibition check runs,
  Then the move into tickets/99_done/ IS detected as a prohibited
    done-folder move,
  And the commit IS blocked with a clear message naming the offending
    file and the 99_done destination.

  Given the sanctioned finalize-feature archive step runs its ticket
    reconciliation on main,
  And it moves completed tickets into tickets/99_done/ through the
    finalize path (identified by an explicit context signal — e.g. an
    env flag or an allowlisted invocation),
  When the done-folder prohibition check runs in that finalize context,
  Then the 99_done archive move is exempted and NOT blocked.
