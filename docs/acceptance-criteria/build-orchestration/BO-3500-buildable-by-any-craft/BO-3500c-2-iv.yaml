it_requirements:
  - "SIZING, CASE 1 — DETERMINISTIC CONSUMER. Unit cost: TWO invocations of the consuming surface, once with the instruction present and once with it absent, in-process or as a subprocess. No credential, no model call, repeatable, zero marginal money, seconds of wall clock. WHERE THE COST SURFACES IN A RUN: nowhere special — it sits inside the proof phase's existing wall clock, like any other gate, and needs no separate accounting. This case CAN be a required check."
  - "SIZING, CASE 2 — MODEL-ONLY CONSUMER. Unit cost: 2 x N live model calls per member (N = the repeats needed before the answer is stable enough to be evidence) plus a credential, plus non-determinism. WHERE THE COST SURFACES: it must be a NAMED PER-MEMBER LINE in the run's cost report — the same report BO-2400d already produces — never absorbed into the run total, and the member's outcome bucket must be distinct from case 1's. A run whose price varies by orders of magnitude between two members that look alike from outside is a run nobody can budget for."
  - "SIZING, THE CEILING TODAY. 463 not-yet-done records declare llm-expert, and only 3 of the project's 60 registered agents have an evaluation set to compare against (scripts/evals/agent_eval_config.json: pt-classifier, mock-data-author, flow-author). So most of the model-only bucket has nothing to take a differential against and REFUSES up front under BO-3500c-4 scenario 3 until eval sets exist. That is the honest ending, not a gap in this spec, and it means the model-only path's near-term throughput is bounded by eval-set coverage rather than by budget."
  - "THE SPLIT OF THE 463 BETWEEN THE TWO BUCKETS IS BEING MEASURED SEPARATELY AND IS NOT A BLOCKER. It changes the SIZE of each case, not the specification of either. Do not wait for it, and do not hard-code either bucket's membership from it when it arrives — the membership is derived per the next requirement."
  - "WHICH BUCKET A MEMBER IS IN IS DERIVED, NEVER DECLARED (user decision D4). A member is deterministic-consumer iff a non-model surface loads the prompt; resolve that from the same registries BO-3500c-2's table uses — config/agent_registry.json (agents[].template_path), config/skill_registry.json (skills[].template_path), and the hooks_manifest in templates/scripts/commit_guardian/commit_guardian.json. A record may not put itself in the cheap bucket, and a bucket derived from a typed field is the loophole that makes the whole record ornamental."
  - "LOADED-BY-ITS-SURFACE IS THE CHEAP HALF AND IS NEVER SUFFICIENT ALONE. The differential is mandatory in both cases. An instruction that is loaded and ignored is the second-commonest failure of this kind and the load check cannot see it — this project has shipped exactly that: instructions present in a template that no surface ever loaded, green throughout."
  - "ORPHAN DETECTION IS A REGISTRY LOOKUP, NOT A TEXT SEARCH. 'Nothing consumes it' is established by finding no registry entry claiming the prompt's path — the same resolution BO-3500c-2 performs — not by grepping the codebase for the filename."
  - "DIFFERENTIAL, NOT ABSOLUTE. Asking what an agent PRODUCES from a prompt is not reliably repeatable; asking whether observable behaviour DIFFERS with the instruction present and absent is a comparison, and a comparison can be made stable where an absolute assertion cannot."
  - "COMPARING CLASS. The receipt carries condition_a (instruction absent), condition_b (instruction present) and the observed difference. Identical conditions are rejected at write time by BO-3500c-1 — which is precisely how a model-only member quietly proved by the load check alone is caught after the fact, without re-running anything."
  - "NO PRESENCE-ONLY ASSERTIONS. Every test exercises the consuming surface or asserts a refusal; a test that reads the prompt file's text passes on an instruction nothing loads."
delivers_to:
  agent: python-coder
  contract: "Prompt-proof result and its cost record: {bucket: 'deterministic'|'model_only' (derived, never declared), consumer: <registry entry claiming the prompt path>, receipt: {condition_a, condition_b, difference}, cost: {model_calls: int, currency_amount: number|null}}. The cost element is consumed by the run's cost report (BO-2400d) as a named per-member line; the bucket is consumed by the outcome-reporting split this record's fifth scenario requires."
expects_from:
  ac_id: BO-3500c-2
  contract: "derive_proof_kind(path) resolving templates/agents/*.md and templates/skills/<id>/ paths to kind `prompt`, class `comparing`, claimed by config/agent_registry.json and config/skill_registry.json at positions 1 and 2 of the resolution table — the same lookup that decides which consumer, and therefore which bucket, a prompt is in."
test_spec:
  - name: test_deterministic_consumer_differential_is_repeatable
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "Establish the same deterministic-consumer proof twice and assert identical receipts modulo the timestamp — the repeatability the second scenario claims."
  - name: test_deterministic_consumer_proof_needs_no_credential
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: "With all model credentials unset, the deterministic-consumer proof completes and no model call is attempted."
  - name: test_orphan_prompt_fails_naming_no_consumer
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "A prompt whose path no registry claims fails, with 'nothing consumes it' as the reason — established by registry resolution, not by a text search."
  - name: test_loaded_but_ineffective_prompt_fails_naming_the_expected_change
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "The surface loads the prompt but behaves identically with and without it; assert the proof fails and names the change that was expected and not observed."
  - name: test_bucket_is_derived_from_the_registries_not_declared
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: unit
    angle: seam
    description: "A member declaring itself deterministic while its only consumer is a model still resolves to the model_only bucket; assert the derived value wins and the declaration is reported as a defect."
  - name: test_model_only_member_states_its_cost_as_a_named_line
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    description: "A model-only proof emits a per-member cost line carrying the model-call count; assert it is present in the run's cost report and attributed to that member, not folded into the total."
  - name: test_model_only_member_without_credential_is_refused_up_front
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "With no credential or no stable answer available, the member is refused before any craft is dispatched and is never finished on the load check alone."
  - name: test_the_two_buckets_are_distinguishable_in_the_run_outcome
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: seam
    description: "Run one member of each bucket and assert a consumer branching on the reported bucket separates them — they cost differently and can end differently."
  - name: test_prompt_receipt_with_identical_conditions_is_rejected
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: failure
    description: "NO RUN. A prompt-proof receipt whose two conditions are equal is refused at write time — the after-the-fact catch for a model-only member proved by the load check alone."
