criteria: |
  Today's clashes are cleaned up, so the guarantee starts from a clean slate.

  The numbering problems that already exist are found and resolved as part of
  this work, rather than being quietly accepted as the new normal. When the
  guarantee takes effect, it certifies a genuinely clean state — not a broken one
  that happens to have stopped getting worse.

  Repair here means resolving every case where a number is AMBIGUOUS today: no
  number is claimed by two pieces of work, and no piece of work exists as two
  copies that can disagree. Work that never took a number is deliberately NOT in
  scope for repair — it is not ambiguous, and the rule that stops it recurring is
  a separate promise. Numbering that is already clean is left untouched.
