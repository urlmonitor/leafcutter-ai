id: ACD-1300f-2
title: Honor real prerequisites with same-worktree and target-branch evidence
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given STATUS has leaves COUNTS and JSON with JSON depending on COUNTS
  And an external feature EXPORT depends on JSON
  When COUNTS is implemented and its required checks pass in the STATUS worktree
  Then JSON may execute next in that same worktree
  And EXPORT remains blocked until JSON's required work is complete on the target branch after merge
  And a draft PR or passing checks on another branch cannot satisfy EXPORT
  And structural parent references establish membership without requiring unfinished parents to be implemented first
