notes: |
  FOUND LIVE, NOT BY INSPECTION. Workflow run wf_394d2b76-014, driving
  TICKET-20260825-BP-900g-8, halted here. test-runner completed everything asked
  of it -- 4 target tests passed, full suite 3984 passed / 0 failed, build.py
  exit 0 -- then returned status: blocker with
  result_status: tests_pass_signoff_blocked_no_edit_tool, because it had no tool
  with which to record any of that. The failure ladder escalated through
  mechanical retry to brainstorm-lead and re-dispatched the same agent, which
  could not succeed: the tool allowlist is fixed at dispatch.

  LIKELY A ROOT CAUSE OF KI-BO-007. That entry records the downstream symptom --
  "build-feature counts a phase as completed when the agent halted without doing
  it" -- and the BO-2900f-1 family was built to detect exactly this shape. The
  detection was correct; this is one of the things generating it. A read-only
  agent facing a mandatory write has two exits, and only one of them is loud.

  THE DERIVED RULE FOUND TWO MORE THAN THE REPORT DID. The incident named three
  templates. Writing the check as a rule over all templates -- rather than as a
  test of the three -- immediately surfaced `research-agent` and
  `worktree-agent`, which carry the identical contradiction: frontmatter
  `signoff: true`, the injected `## Sign-off` section, and a read-only toolset.
  That is the argument for constraint 3 stated as evidence rather than as
  principle: an enumerated test would have closed this AC while two live
  instances remained.

  A NAIVE SIGNAL WOULD HAVE BEEN WORSE THAN NONE. Substring-matching "sign-off"
  selects all 13 read-only non-obligated templates, each of which merely
  mentions another agent's sign-off in prose. The two structural signals used
  instead -- frontmatter `signoff: true`, and the injected `## Sign-off` heading
  -- independently select the same five violators and cleanly exclude all five
  correct counter-examples.

  WHY THIS IS ITS OWN L0 RATHER THAN A CHILD OF AR-100. AR-100 is about
  ownership -- whether the right specialist is assigned. This is about
  capability -- whether the correctly-assigned specialist can do what is asked.
  AR-100d ("mis-assignment warnings you can actually trust") is the nearest
  neighbour and is still a different question: here the specialist is right and
  the equipment is missing.
