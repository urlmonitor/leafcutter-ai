it_requirements:
  - "The two outcomes must be distinguishable by the run itself, not merely worded
     differently. 'The claim was never attempted' and 'the claim was attempted and
     lost' are different facts with different remedies — the first is fixed by
     changing who attempts it, the second by waiting or releasing a stale hold.
     A single branch that emits contention language for both is the defect."
  - "A contention report must carry the held members. An empty held-set alongside a
     contention message is self-contradicting on its face, and is the exact shape
     the 2026-09-23 run emitted; it must not be expressible."
  - "Whoever is asked to make the claim must be permitted to change the store. Do NOT
     resolve this by editing config/agent_registry.json or its schema — the
     three-state permits_shell problem behind it is recorded as
     KI-BO-20260901-1620 and must stay open and visible rather than being absorbed
     into this record."
  - "Do NOT write a justifying comment asserting that the chosen performer is
     permitted by the registry schema unless the schema actually says so. KI-BO-020's
     fix did exactly that and KI-BO-20260901-1620 exists because the wrong
     justification was 'written into the code as a comment future readers will copy'.
     State the real reason for the choice, including its known weakness."
  - "This record constrains the claim step only. The same file dispatches the same
     performer at the resolve and producibility steps; both are read-only in effect
     and neither has been observed to decline. Widening to them is a separate change."
test_spec:
