notes: |
  ACCEPTANCE AND FIDELITY ARE DIFFERENT PROPERTIES AND THIS RECORD OWNS THE SECOND.
  INF-1300a-1 requires the produced document to survive the project's checks. A document
  can survive every one of them and still be about the wrong component, carry the wrong
  tier, or bear a date the author never supplied — every one of those values is
  individually well-formed. Nothing in the check set compares the document against the
  request that produced it, because the checks never see the request. Only this record
  does, and without it "accepted first time" is satisfiable by a producer that emits a
  valid document describing something else.

  FALSIFIABILITY. Produce a document from a fully specified request and read the produced
  file against the request, value by value. The record is falsified by any supplied value
  not appearing, by the tier digit in the filename disagreeing with the declared tier, by
  a date later than the one supplied, or by any field holding content the request did not
  supply and the project does not define. The last clause is the one that cannot be
  satisfied by a fixture: produce twice, differing in exactly one input, and require the
  two documents to differ in exactly the place that input controls. A producer that writes
  a constant, or that derives a value from something other than the input it claims to
  derive it from, passes every single-run assertion and fails this pair. This construction
  is not invented here — it is the one INF-1200c-1 and BP-900c-4-i already settle for a
  different subject, and it is reused rather than reinvented.

  THE PLACEHOLDER CLAUSE IS THE SHARPEST ONE AND IT IS MEASURED, NOT ASSUMED. The
  frontmatter check in this worktree blocks on a path-valued field whose paths do not
  exist. A producer that fills such a field with a sample so the document "looks complete"
  produces a document the project refuses. That is worse than leaving the field out, and
  it is what an implementer reaches for when told a field is required and given no value
  for it. The correct behaviour when a kind of picture obliges a field nobody supplied is
  to refuse, and that refusal is INF-1300d-4's — the two records are the two halves of one
  boundary and neither is complete alone.

  DELIBERATELY NOT OWNED HERE: what the refusals in this record's criteria say and what
  they leave behind. INF-1300d-3 owns the shape of every refusal in this tree; this record
  owns only that a refusal is the outcome rather than a wrong document.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale, delivers_to and expects_from. Those are the IT PO's.
