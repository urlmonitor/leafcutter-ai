it_requirements:
  - "Local main sync MUST perform a fetch followed by a fast-forward-only update (--ff-only): no local commits, no merge commits, no rebasing local work onto main (ADR-018 Migration §4)."
  - "If local main has diverged so a fast-forward is impossible, the sync MUST stop with a clear message rather than creating a merge or force-moving main."
  - "The sync surface MUST live on a portable package surface (finalize workflow/skill or a helper under scripts/) deployed by build.py, and MUST handle git errors per the project error handling policy."
