criteria: |
  Given the user's current checkout is on the protected main branch,
  When the user starts /create-ac or /plan-feature,
  Then the workflow proceeds normally by creating the isolated authoring
    worktree and branch off origin/main,
  And it never attempts to commit AC files onto the main branch of the current
    checkout,
  And the run completes through to delivery without the user having to first
    switch off main or create a branch manually.
