id: GE-117c-1
readiness: approved
priority: medium
title: "A new decision-history entry carrying a resolvable AC reference satisfies the entry-AC declaration"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-117-code-declares-what-it-serves/GE-117c.yaml"
criteria: |
  Given the staged commit adds a new decision-history entry to a file
  And that entry carries an acceptance-criterion reference that resolves to a real
    AC id in the store
  When the declaration check evaluates the newly added decision-history entries
  Then the check produces a satisfied verdict for that entry's AC declaration

  Given the staged commit adds a new decision-history entry to a file
  And that entry carries no acceptance-criterion reference and no enclosing symbol
    AC reference is inheritable
  When the declaration check evaluates the newly added decision-history entries
  Then the check produces a missing-declaration verdict naming the file and the
    added entry as lacking an AC reference

  Given a decision-history entry already existed in the file before this commit
  And the staged commit does not modify that pre-existing entry
  And that pre-existing entry carries no acceptance-criterion reference
  When the declaration check evaluates the staged diff
  Then the check produces no verdict for that pre-existing entry
depends_on:
  - GE-117c
  - GE-124c-2-i
