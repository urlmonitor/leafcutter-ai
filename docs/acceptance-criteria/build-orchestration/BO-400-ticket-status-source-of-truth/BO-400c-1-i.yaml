title: "Backward compatibility: old epics with done/ subfolder still work"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
criteria: |
  Given a legacy epic folder at /worktree/tickets/01_todo/EPIC-Legacy/ containing:
    - Master_Plan.md (at root)
    - 04_incomplete.md with status: todo (at root)
    - done/01_first.md with status: done
    - done/02_second.md with status: done
    - done/03_third.md with status: done,
  When /build-feature computes the dependency graph for this epic,
  Then it scans ticket files in BOTH the epic root AND the done/ subfolder
  And it reads `status:` from each ticket's frontmatter
  And it correctly identifies done/01_first.md, done/02_second.md,
    done/03_third.md as completed (status: done)
  And it identifies 04_incomplete.md as the only remaining work
  And the dependency resolver excludes the three done tickets
    from the active graph
  And no error or warning is emitted about the done/ subfolder existing.
