id: UXP-551
readiness: draft
priority: medium
title: "A bundled fixture repo mirrors each loader input's native format so all Atlas views render populated"
component: ux-prototyping
components:
  - ux_prototyping
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the bundled fixture repo at leafcutter-web/fixtures/,
  When the Atlas runs in mock mode and each of the 8 views is opened,
  Then every view renders non-empty, populated content (each view shows records rather
  than an empty state) because the fixture tree contains a curated snapshot for every
  loader input,
  And each fixture input mirrors its real artifact's NATIVE on-disk format so the same
  loaders parse it unchanged — YAML for the AC store (docs/acceptance-criteria/**,
  index.yaml), markdown for tickets/**, and JSON for docs/roadmap.json,
  docs/components.json, config/agent_registry.json and
  docs/product-truth/{flows,mock-data,mockups}/**,
  And the product-truth / entity mock-data RECORDS within the snapshot are plain JSON
  shaped identically to the real artifacts, so they double as test fixtures (see UXP-551-1),
  And the fixtures are a small curated snapshot, not a raw copy of the live repo.
