criteria: |
  Given an epic branch is being finalized for merge
  And for every canonical source script that has a shipped template counterpart,
    the two files are byte-for-byte identical
  When the parity check runs at the merge gate
  Then the parity check passes with no drift reported
  And the merge gate is not blocked by the parity check
  And the merge is allowed to proceed
