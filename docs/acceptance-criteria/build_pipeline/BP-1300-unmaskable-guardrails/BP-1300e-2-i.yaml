test_required: false
test_rationale: >-
  Documentation-only change to CLAUDE.md prose; no executable behaviour is
  added. Its correctness is nevertheless mechanically policed: the commit that
  carries it is judged by check-lint-rule-claims (BP-1300e-2), which refuses any
  rule code in this section that no leafcutter-lint.json step applies. That gate,
  not a test written for this record, is the durable check.
it_requirements:
  - "EDIT ONLY CLAUDE.md's '## Error Handling Policy' section: the opening paragraph and the Rule 2 / Rule 3 headings and sentences that name Ruff codes. Rules 1 and 4, their examples, and the docs.astral.sh links stay as they are apart from the sentence that says all four rules are enforced by Ruff."
  - "STATE WHAT RUNS, MATCHING leafcutter-lint.json AS LANDED. At commit time check-lint-gate applies E722 over the trees of the repository-rules step (as part of ruff.toml's selection) and BLE001 and the TRY family over kernel/ only (the kernel-error-handling step). Read the landed leafcutter-lint.json and ruff.toml before writing; do not copy these values from this record if the landed file differs."
  - "NAME THE ONE LOOKUP. The section must point the reader at leafcutter-lint.json (and the reference doc from BP-1300e-4) as the place every rule-and-tree statement can be checked in one lookup."
  - "SAY WHAT IS NOT LINT-ENFORCED, ACCURATELY. Rules 1 and 4 are explained for understanding; state that they are not enforced by the lint gate. If the text mentions the separately registered AST check (check-exception-handling, templates/scripts/commit_guardian/check_exception_handling.py) or the edit-time hook, verify each statement against the registered hooks_manifest entry and the hook's actual behaviour first -- do not replace one unverified claim with another."
  - "Rule 2's heading ('Ruff E722 blocks the commit on bare excepts') becomes true repo-wide once BP-1300e-1 lands and may stay. Rule 3 must stop attributing BLE001/TRY blocking outside kernel/."
  - "MUST PASS check-lint-rule-claims ON ITS OWN COMMIT: name only codes some declared step applies. Land this in the same PR as, or after, BP-1300e-1 and BP-1300e-2."
  - "Glossary gate: if check-glossary-coverage flags new terms (e.g. 'leafcutter-lint.json'), route them through glossary-triage; do not hand-edit docs/glossary.md."
