id: KM-500c-1
title: Resume the waiting research only after its query becomes usable
component: knowledge-management
components:
- knowledge_management
level: L2
status: active
req_status: active
readiness: approved
priority: medium
work_status: done
parent: KM-500c
criteria: 'Given research is waiting on an attributable query-build child

  When a matching verified activation receipt is delivered through the existing continuation path

  Then the original run, question and evidence need resume with the newly available catalog version selected at
  that continuation boundary

  And the original repository, pinned source revision, input answers and remaining budget are preserved

  And the resumed research invokes the new registered query at most once for that completed build delivery

  And a foreign, stale, duplicate or self-certified child result cannot resume unrelated research or execute an
  unverified candidate

  And building or registering a query does not itself count as retrieved evidence or an answered question.

  '
