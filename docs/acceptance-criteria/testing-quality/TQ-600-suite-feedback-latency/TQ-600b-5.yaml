notes: |
  THIS IS THE ANTI-INERT AC AND THIS REPOSITORY NEEDS IT MORE THAN MOST. The
  documented precedent is exact: a commit hook whose README described it as live
  with enforcement enabled, which appeared nowhere in any manifest and therefore
  ran for nobody. A parallel mode documented in a how-to and never used by the
  command anyone actually types is the same artifact. Every other AC under TQ-600b
  is satisfiable by a parallel path that is never taken.

  INSTALLATION IS IN SCOPE BECAUSE IT IS MEASURABLY ABSENT. The parallel runner is
  not installed and not among the declared development dependencies, so this is a
  dependency decision rather than a configuration flip — which is why the Given
  insists on an environment built only from declared dependencies. An AC satisfied
  only on a machine where somebody once installed the runner by hand is satisfied
  nowhere that matters.

  THE FOURTH CLAUSE PROTECTS TQ-600b-1. If parallel becomes the only available
  mode, the equivalence comparison that justifies parallelism has no baseline to
  compare against, and the justification quietly becomes unfalsifiable.

  DELIBERATELY NOT SPECIFIED: the worker count, and whether it is fixed or derived
  from the machine. The criterion is "more than one, and stated", so the it-po can
  choose without reopening this AC.
