criteria: |
  Given the deprecation-hygiene detection trigger (ACS-900a-1) and the
    implemented_by inspection (ACS-900a-2) are implemented,
  When a contributor needs to understand when and why the check fires,
  Then a how-to guide documents the status transitions that arm the check
    (active to deprecated / superseded_by / superseded), states that an
    unchanged retired status and a brand-new retired file do not arm it, and
    explains how the implemented_by list is inspected,
  And a sequence diagram shows the ordered interaction at commit time:
    staged diff read, HEAD status compared, retired-transition detected,
    implemented_by entries inspected, verdict produced.
