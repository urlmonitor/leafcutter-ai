id: BO-4000b
title: "A local branch that is behind origin/main is never silently checked out into a new worktree"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
  - git_vcs_operations
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given the workflow is about to open a new worktree for EPIC-TruthfulProjectRecord on the
    branch `epic/truthful-project-record`
  And that branch already exists locally
  And it is 47 commits behind `origin/main` as fetched at that moment
  And it carries no commit that `origin/main` lacks
  When the worktree step runs
  Then the new worktree starts from the current tip of `origin/main`, not from the stale
    tip of that branch
  And the run's report states that the branch was 47 commits behind and that the new
    worktree started from `origin/main`.

  Given the same branch is 47 commits behind `origin/main`
  And it carries 3 commits that `origin/main` lacks
  When the worktree step runs
  Then no worktree is opened
  And no phase agent is dispatched
  And the run stops with a refusal naming the branch, its 3 commits ahead and its 47
    commits behind `origin/main`, and the choices open to the user: bring the branch up to
    date themselves, remove the branch, or aim the run at a different branch
  And the branch's commits are left exactly as they were.

  Given the branch exists locally and is 0 commits behind `origin/main`
  When the worktree step runs
  Then the worktree is opened on that branch as it stands, with no report of staleness.

  Given the branch exists locally
  And `origin/main` cannot be fetched at that moment
  When the worktree step runs
  Then no worktree is opened on that existing branch
  And the run stops with a refusal stating that the branch's standing against
    `origin/main` could not be checked.

  Given the run reuses the worktree resolved for the target (BO-4000, first scenario)
  When the worktree step runs
  Then none of the above applies — the reused worktree's branch is not compared, moved,
    or refused here.
