notes: |
  CONFLICT RESOLVED BETWEEN PO CHALLENGES 2 AND 3. Challenge 3 says an unused source fails the
  install. Challenge 2 says this L1 ships the COMMIT-ANSWER source while adoption stays in
  BO-4500a-5-i..iv. Applied literally, the change that lands this L1 would fail its own install,
  because COMMIT-ANSWER has no consumer until the first route migration lands. The resolution is an
  explicit, reported, self-expiring declaration: a block may await adoption only by NAMING the
  records that will adopt it, the install reports it every time, and the declaration fails the
  install the moment a route adopts the block (third scenario), so it cannot rot in place.
  Alternative the user may prefer at the gate: drop the declaration and land the mechanism together
  with the first route migration. That would merge challenge 2's split back together.

  BO-9999a-1/-2 are placeholder ids for the test fixture.
