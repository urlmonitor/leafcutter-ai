criteria: |
  Structural guardrails prevent business-focused agents from touching implementation files.
  The product owner and analyst agents can only access documentation and requirement
  files — any attempt to read or write source code is blocked automatically. This is
  defense-in-depth: even if an instruction is misunderstood, the guardrail prevents
  scope violations. The protection travels with the package to every project.
