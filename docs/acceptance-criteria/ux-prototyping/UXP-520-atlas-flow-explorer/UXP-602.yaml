readiness: reviewed
priority: medium
title: "Individual AC nodes are off by default in the flow graph"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: done
criteria: |
  Given a flow whose steps and branches reference acceptance criteria,
  When the person opens the Atlas /flows view and selects that flow,
  Then the graph shows no per-AC (individual acceptance-criterion) nodes by default,
  And only step, branch, and decision nodes are drawn until the AC-node view is explicitly turned on.
