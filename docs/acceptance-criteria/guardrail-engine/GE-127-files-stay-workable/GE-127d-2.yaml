it_requirements:
  - >-
    THE MEASUREMENT RULE ITSELF — DECIDED, AS THE BA REQUIRED, AND IT IS "KEEP THE RULE, PUBLISH
    IT". The rule in force stays: discard triple-quoted blocks in both Python quote styles and
    C-style /* */ block comments, then count every remaining line, including blank lines and hash
    comments. It is not changed here for two reasons that both point the same way. First, this
    record's own notes concede the rule is defensible on the merits — a file is hard to work in
    because of how much there is to reason about, and a module's docstrings are not that. Second,
    and decisively: changing the rule changes the population. Under the rule in force 200 of 845
    tracked .py files stand above 400; under a raw count 314 do. Adopting the raw count as part of
    this record would add 114 Python files to GE-127b-1's ratchet in the same change that publishes
    the rule, entangling a transparency fix with a scope expansion nobody costed. If the rule is
    later judged wrong, that is its own record with its own measured population.
  - >-
    THE RULE HAS A KNOWN ASYMMETRY THAT MUST BE PUBLISHED, NOT JUST THE RULE'S SHAPE. Under the rule
    in force, deleting blank lines and hash comments DOES reduce the quoted number and deleting
    docstrings does NOT. The refusal message currently forbids both in one breath, naming the action
    that works and the action that does nothing without distinguishing them. Publishing "which lines
    are counted" is not sufficient on its own — the published statement must make that asymmetry
    legible, and the refusal message must stop forbidding an action that cannot help the author
    anyway. This is the concrete shape of the problem the record closes and the reason it is not
    cosmetic.
  - >-
    ONE MEASUREMENT FUNCTION, AND THE PUBLISHED STATEMENT DERIVED FROM IT RATHER THAN MAINTAINED
    BESIDE IT. The same pure function that GE-127a-1's threshold comparison and GE-127b-1's before-
    and-after comparison call must be the one whose behaviour is published and the one the
    reproducibility clauses re-derive against. The published statement must be generated from, or
    mechanically checked against, that function — a hand-written sentence is the "satisfied by
    editing a sentence" failure the parent L1 names and this tree has already shipped once, exactly
    that way. It is also the BA's named injection 2 and the descriptor that catches it.
  - >-
    THE OUTCOME MUST STATE WHAT THE QUOTED NUMBER MEASURES, NOT ONLY THE TWO NUMBERS. The incumbent
    shape prints an arrived-at number and a permitted number and nothing about what the first of
    them counts. That is the shape that will be reached for and it is the BA's named injection 1.
    The refusal must carry enough for an author who counts every line in the file and gets a
    different figure to reconcile the difference from the outcome alone.
  - >-
    NO PACKAGE SURFACE — MEASURED. This record adds no hooks_manifest.hooks id (it changes the
    outcome text of the gate GE-127a-1 registers, and adds a published statement) and no new
    top-level mapping key to commit_guardian.json. IF the measurement rule is later made
    configurable, its keys go NESTED under the existing `file_size` section at line 13, which
    WATCHED_REGISTRIES does not see — the mapping_keys container is bound to dotted path "", the
    document's own top level, only. That is the recommended home if configurability is wanted; a new
    top-level key is not, and would drag a package-surface declaration and the structured five-field
    spec onto this record. Do NOT mint a config_schema_fragment key to clear the validator: the
    BP-100k-4 / BP-100k-4-i precedent BP-100n-4-ii records produced two keys that were never created
    and are still absent from commit_guardian.json's 36 top-level keys.
  - >-
    THE PUBLISHED STATEMENT BECOMES ONE MORE SURFACE GE-127d-1 COMPARES — WIRE IT, DO NOT BUILD A
    PARALLEL CHECK. Whichever of these two records lands second inherits the other's surface. If
    GE-127d-1 lands first, add wherever this measurement statement lives to its configured
    published-surface list in the same change. If this record lands first, its statement must be
    machine-comparable so GE-127d-1 can consume it. Two reconciliation checks over overlapping
    surface sets is the drift both records exist to prevent.
  - >-
    ASSERT REPRODUCIBILITY BY RE-DERIVATION, NEVER AGAINST A LITERAL. Every equality clause must be
    discharged by applying the published rule to the file at run time and comparing against the
    number the gate emitted, with the file's content VARIED between runs so the two numbers must
    move together. A test carrying a hard-coded expected length asserts the author's belief about
    today's rule and stays green when the rule and the published statement drift apart together —
    which is the failure this record exists to forbid. Same by-variation construction BP-100n-4-ii
    requires of its stated counts, for the same reason.
  - >-
    THE DEGENERATE ARM IS A BOUNDARY CHECK THAT MUST SURVIVE A LATER RULE CHANGE. A file containing
    nothing the rule declines to count must be quoted its total number of lines. Implement it as a
    consequence of the rule rather than as a special case: if a later record changes the rule to
    count everything, that arm becomes the whole behaviour and the divergence arm simply never
    arises. Neither arm may name what the rule discards.
  - >-
    HOST, LAYERING AND THE BUILD. The measurement function and the derivation of its published
    statement belong in the same sibling module inside templates/scripts/commit_guardian/ that holds
    GE-127b-1's previous-length resolution — build_commit_guardian copies that directory whole, so
    no scripts/build_phases.py deploy entry is needed; a module imported from outside it does need
    one. templates/scripts/commit_guardian/ is canonical; scripts/commit_guardian/ and the repo-root
    .pre-commit-config.yaml are untracked build outputs; templates/commit-guardian/ is a decoy.
    config.py:19 resolves the config beside the DEPLOYED script, so `python scripts/build.py
    --target-dir .` is part of this change.
  - >-
    Must follow the repo error-handling policy: specific-exception try/except around file I/O and
    any decode; log at WARNING or higher or re-raise; no bare or blind excepts. A file whose length
    cannot be established has no quotable number at all and takes GE-127a-1-i's INDETERMINATE path,
    never a quoted length of zero.
test_spec:
  - name: test_ge_127d_2_the_refusal_states_the_arrived_at_length_the_permitted_length_and_what_is_measured
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      A covered file above its permitted length under the rule in force refuses the commit, and the
      outcome states the length arrived at, the length permitted, AND what the stated length
      measures. NAMED MUTATION (mandatory, run it — the BA's injection 1): restore the bare
      presentation, stating the two numbers and nothing about what the first counts. Under the
      injection this descriptor must go RED and the reconciliation descriptor below must go RED with
      it, then both return to green on revert. Without it the clause is satisfied by any message
      containing two numbers. The unmutated arm fails today outright — nothing is quoted, because no
      commit is refused for file length — so capture that as the baseline.
  - name: test_ge_127d_2_applying_the_published_rule_independently_arrives_at_the_quoted_length
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: >-
      Read the published measurement rule, apply it independently to the same file, and require the
      result to equal exactly the length the gate quoted. Assert by re-derivation with the file's
      content VARIED between runs so both numbers must move together — never against a hard-coded
      expected length, which asserts today's belief and stays green when rule and statement drift
      apart together. Fails today outright: the measurement rule is published nowhere.
  - name: test_ge_127d_2_changing_the_rule_in_force_changes_both_what_is_published_and_what_is_quoted
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Change the measurement rule in force in a way that alters the length arrived at for one
      particular file, changing nothing else, and require that what is published states the changed
      rule AND that applying it independently arrives at exactly the length now quoted. NAMED
      MUTATION (mandatory, run it — the BA's injection 2): publish the measurement rule as fixed text
      maintained separately from the rule applied, then change the rule in force. Under the injection
      the independently-derived number diverges from the quoted one and this descriptor must go RED,
      returning to green on revert. A static sentence passes every other arm here on the day it is
      written; this is the only descriptor that catches it.
  - name: test_ge_127d_2_a_file_with_discarded_content_lets_the_author_reconcile_the_two_quantities
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      For a refused file containing content the rule declines to count — so the quoted length and the
      total number of lines differ — an author who counts every line and arrives at the other
      quantity can tell from the outcome alone which of the two the standard stated, and reconcile
      the difference without inspecting anything else. Assert against both quantities computed at run
      time, not against literals.
  - name: test_ge_127d_2_a_file_with_no_discarded_content_is_quoted_its_total_line_count
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      THE DEGENERATE ARM. A covered file containing nothing the rule in force declines to count is
      quoted a length equal to its total number of lines. Both numbers are computed at run time from
      the same file, so the descriptor survives a later change to the rule: if the rule ever counts
      everything, this becomes the whole behaviour rather than a gap.
  - name: test_ge_127d_2_the_asymmetry_between_removable_and_non_removable_content_is_legible_from_the_outcome
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: >-
      Take one refused file and produce two variants — one with blank lines and hash comments removed,
      one with docstrings removed — and require the quoted length to move for the first and not for
      the second, and require the outcome to be one an author can predict that from. This is the
      concrete trap the record exists to close: the incumbent refusal forbids both actions in one
      breath while only one of them can help, and an author who tries the forbidden thing and finds
      it half-works concludes the gate is broken.
  - name: test_ge_127d_2_the_quoted_length_and_its_measurement_statement_reach_the_registered_hook_output
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: >-
      python .leafcutter/scripts/commit_guardian/run_hook.py
      .leafcutter/scripts/commit_guardian/check_file_size.py
    description: >-
      PRODUCTION ENTRY POINT. Run the gate as a subprocess through the registered hook path and assert
      that the quoted length, the permitted length and the statement of what is measured all appear in
      the hook's own output stream, and that the exit status is the commit outcome rather than an
      advisory note. A number computed by a function nothing at commit time calls is inert.
  - name: test_ge_127d_2_the_deployed_copy_quotes_a_length_reproducible_from_its_deployed_published_rule
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: >-
      After build.py, the DEPLOYED copy and every module it imports load and run in a cold process — a
      helper outside templates/scripts/commit_guardian/ with no scripts/build_phases.py deploy-map
      entry surfaces here as ModuleNotFoundError rather than passing. Over a real oversized tracked
      file, the deployed run quotes a length, and applying the DEPLOYED published rule independently
      arrives at exactly that length. Guards the case where the rule is corrected in the canonical
      template and the published statement ships from a stale build.
test_rationale: |
  Unlike its siblings this record has no green-on-arrival problem for most arms: every clause requires
  something to be REPORTED, and the first, second and fourth arms fail today outright — no commit is
  refused for file length, the measurement rule is published nowhere, and nothing is quoted. Those
  failing runs are the baseline.

  Two hazards survive a red baseline and each carries the BA's named injection, carried into a
  descriptor verbatim. The bare-presentation injection defends "the outcome states what the stated
  length measures", which is otherwise satisfied by any message containing two numbers — and the
  incumbent shape is exactly that message, so it is the shape that will be reached for. The
  static-sentence injection defends the derivation clause and is the only descriptor in this record
  that catches a hand-written published statement: such a sentence passes every other arm here on the
  day it is written, and this tree has already shipped that exact failure once, in the two
  new-files-only statements GE-127d-1 exists to reconcile.

  Every equality clause is discharged by re-derivation with content varied between runs rather than
  against a literal, because a hard-coded expected length asserts the author's belief about today's
  rule and stays green when the rule and the published statement drift apart together — the same
  by-variation construction BP-100n-4-ii requires of its stated counts.

  One descriptor exists that the criteria do not name and that the pinned rule decision makes
  necessary: the asymmetry descriptor. Keeping the rule in force means keeping the property that
  deleting blank lines and hash comments moves the number while deleting docstrings does not, and the
  refusal currently forbids both in one breath. Publishing the rule without making that asymmetry
  legible leaves the trap intact while satisfying the letter of every other clause.

  The deployed descriptor is not redundant with the reachability one: it catches a published statement
  shipped from a stale build, which is the failure mode config.py's resolve-beside-the-deployed-script
  behaviour makes available and which no source-tree test can see.
