expects_from:
  - ac_id: GE-123e-3
    contract: "The final refusal content: what it names and which remedy it gives."
  - ac_id: GE-123e-4
    contract: "The settled relief rule: a heading identical to its copy on either side (HEAD or the incoming state) is not judged, and a heading added or changed during the resolution is judged. The same rule applies to a conflicted merge, revert and cherry-pick through the shared operation-record predicate. It is a check-local exception to the incoming-side-only shared derivation of ADR-038 §4, recorded in ADR-038 Amendment 3."
  - ac_id: GE-123e-4-i
    contract: "The could-not-check disposition. When the incoming side cannot be read while an operation is concluded, the check exits 0, prints a stderr WARNING naming each affected ticket file (its sign-offs were not verified, and the incoming side could not be read), and emits 'RESULT: could_not_check' on stdout. Ordinary commits are never opened by this path."
  - ac_id: BO-2000g-2
    contract: "The single definition of `feedback-id: (not-a-signoff)` in templates/skills/signoff/SKILL.md, which the reference points at by section and does not restate."
