criteria: |
  Given the reference page on the route's layout and startup checks and the workflow's
    rationale notes,
  When a reader looks up what the route needs in order to start and what each startup halt
    means,
  Then the pages list the arguments the installed /plan-feature command and skill pass, and say
    which of them the workflow requires,
  And each startup-halt report the pages quote is word for word what the workflow produces,
  And the pages do not say that the skill runs a permission pre-flight unless the installed
    skill contains that step,
  And the rationale notes say whether the startup verdict is required when the maker's answer is
    supplied, and why, matching what the workflow does,
  And the reference page's row for a run that arrives with no maker's answer and no verdict
    gives the remedy that ACD-2100d-5-ii's report gives.
depends_on: [ACD-2100d-5, ACD-2100d-5-ii]
