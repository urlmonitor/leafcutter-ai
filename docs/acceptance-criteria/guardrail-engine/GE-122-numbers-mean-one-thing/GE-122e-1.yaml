criteria: |
  Given the requirement collection ORIGINALLY contained two unrelated records both claiming the
    identifier "GE-119": a goal-level record owning a folder of 32 files, and a single parentless
    detail-level record at the namespace root whose subject is the contract-shrinking guard,
  And fifteen test functions across two test modules carried a coverage tag naming "GE-119", all
    of them written for the parentless record,
  And a guard source file and two release notes cited "GE-119" — one release note meaning the
    parentless record, the other meaning the goal record,
  When the collision is resolved — the parentless record's renumbering performed as part of this
    tree's own repair, and the goal record's renumbering performed independently by a separate,
    concurrently-landed change,
  Then no record anywhere in the collection claims "GE-119" — the identifier is RETIRED and must
    never be reissued,
  And the former goal record claims "GE-120", with its folder's contents identical to
    origin/main's copy of that folder -- this repair and this reconciliation touch neither
    the count nor the content of any file in it, whatever that count is at merge time,
  And the former parentless record claims "GE-111f", an identifier in the guardrail-engine
    namespace that no other artifact claims and that was not previously claimed by any retired
    artifact,
  And it declares "GE-111" as its parent, and GE-111's own record lists "GE-111f" among its
    children,
  And all fifteen of those coverage tags, in both modules, name "GE-111f", so each tag resolves to
    exactly one record,
  And the guard source citation names "GE-111f",
  And a dated historical record — a changelog entry or release note describing what happened at
    the time it was written — MAY still cite the retired "GE-119", PROVIDED it also states the
    identifier the work now carries; rewriting a dated record's citation outright would make it
    claim an identifier that did not exist at the time the record was written, which is its own
    kind of falsification, so the required fix is a clarifying addition, never a rewrite,
  And no LIVE citation — any citation other than a dated historical record — anywhere in the
    repository still names "GE-119",
  And no citation of "GE-120" or "GE-111f" anywhere in the repository resolves to zero records or
    to more than one.

  Coverage note: covered by executing the whole-collection uniqueness pass and a repository-wide
  citation resolution over the merged, repaired tree, asserting zero claimants for the retired
  identifier, exactly one claimant each for "GE-120" and "GE-111f", and no unresolved or
  multiply-resolved LIVE citation of either. Asserting only that a file was renamed does not cover
  it — the references are where a renumbering does its damage.
