criteria: |
  Given a PROJECT_CONTEXT.md file exists but contains malformed content
    (e.g., binary data, truncated YAML frontmatter, or a file exceeding 50KB),
  When a v3 agent's pre-flight step attempts to read it,
  Then the agent logs a warning identifying the problematic file path,
  And the agent continues execution without the corrupted context,
  And the agent's output is not degraded beyond the loss of that single context source.
