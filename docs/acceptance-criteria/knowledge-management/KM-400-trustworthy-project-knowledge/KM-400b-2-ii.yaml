change_target: code
risk_surface: contract_boundary
notes: |
  Authored 2026-10-14. The count check compared relationships kept (keyed on identity,
  merged on that key, so duplicates fold) against the raw length of the loaded list
  (duplicates counted). Those are two different bases, so any duplicate made every
  publication fail even though every distinct fact was stored. This record pins the
  basis: expected is counted on the same identity the store keys on.

  KM-400b-2-i already removes duplicates before the write, so in the normal path the
  two bases coincide. The second scenario still matters: it is the defence in depth if
  a duplicate reaches the check by a path that bypasses the collapse, and it states the
  basis as a requirement rather than an accident of ordering.

  The third scenario is the discriminating half and is not optional. The easy wrong fix
  for "the count check fails" is to weaken or drop the check, or to compute expected from
  what was stored. Either passes the first two scenarios and reports success for a
  publication that silently lost a relationship.
it_requirements: null
test_required: true
test_spec:
  - name: test_valid_snapshot_with_loaded_duplicate_validates_and_activates
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: real_artifact
    description: Load a fixture revision from real-format AC YAML containing a repeated implemented_by entry, publish through the real publication entry point against a backend double that models merge-on-identity storage, and assert the count check compares like with like, passes, and the new generation is active with expected and kept counts stated.
    covers: [KM-400b-2-ii]
    must_catch:
      - "compute expected from the raw loaded relationship list, so one duplicate fails every publication"
    requires_db: false
  - name: test_genuine_relationship_shortfall_still_fails_the_count_check
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: discrimination
    description: Publish a snapshot of distinct relationships against a backend double that drops one relationship on write; assert the check fails naming relationships, 28,814 expected and 28,813 kept, and the previous generation stays active.
    covers: [KM-400b-2-ii]
    must_catch:
      - "drop or weaken the count check to make publication succeed"
      - "take the expected count from what the store reports keeping"
      - "report a mismatch without naming the kind and both figures"
    requires_db: false
test_rationale: >-
  The existing publish tests never fed a duplicate relationship, so the two counting bases
  always agreed in test and the mismatch only existed in production — which is how a
  one-line data error became a total outage undetected. The first test therefore loads
  from real AC YAML with a repeated list entry and uses a backend double that folds on
  identity the way the real store merges on key; a double that keeps every row as given
  would hide the defect again. The shortfall test exists so that the fix cannot be
  "remove the check": it goes red under any implementation that stops comparing against
  an independent expected figure. Grep-only coverage is forbidden for this record.
