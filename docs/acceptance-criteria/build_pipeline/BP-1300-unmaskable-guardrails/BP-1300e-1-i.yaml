id: BP-1300e-1-i
components:
  - precommit_hooks
  - commit_guardian
  - build_pipeline
title: "The commit-time lint check and CI read one definition of what is linted and by which rules, so changing it in one place changes both"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Scenario: A file CI excludes is not refused at commit time
    Given the repository lint configuration excludes the templates/ tree,
    And a staged change to a Python file under templates/ introduces rule E741,
    When the commit is attempted,
    Then the commit is not refused on account of that file,
    Because CI never lints it, and a commit-time refusal CI would not share is
      the reverse half of the disagreement this L1 forbids.

  Scenario: A file outside every declared tree is not refused
    Given a staged change to a Python file at the repository root, outside
      scripts/, tests/, unit_tests/ and kernel/, that introduces rule E741,
    When the commit is attempted,
    Then the commit is not refused on account of that file.

  Scenario: Widening the declared scope widens both verdicts at once
    Given the single declared lint scope is changed to add one further tree,
      and nothing else is changed,
    When a staged violation inside that tree is committed,
    Then the commit-time check refuses it,
    And CI's required lint check, run on the same content, also fails on it,
    And no second copy of the tree list needed editing for either result.

  Scenario: Changing the kernel-only rule set changes both verdicts at once
    Given the single declared second-step rule set is changed to drop TRY,
    When a staged TRY-only violation under kernel/ is committed,
    Then neither the commit-time check nor CI's second step refuses it.

  Scenario: Every local lint runner reads the same definition
    Given any other local runner that claims to mirror CI's lint check — the
      sign-off gate's lint runner (BO-570-3) and the manual "run CI locally"
      helper included,
    When the declared scope or rule set changes,
    Then each of them applies the changed scope and rule set without its own
      edit,
    And no runner holds a private tree list or rule list that can diverge.
