test_rationale: >-
  The AC is about what a local runner does, so every arm runs the real
  scripts/run_ci_local.py as a subprocess against a real temporary git repository
  holding the real ci.yml and the real scripts/ci/mypy_ratchet.py, with the real mypy.
  The parity arm compares against an extraction of the real ci.yml written in the test,
  not the module's own parser, so a parser that drops a pathspec is caught.
