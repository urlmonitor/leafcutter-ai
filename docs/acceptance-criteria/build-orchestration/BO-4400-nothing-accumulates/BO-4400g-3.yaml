notes: |
  User request item (2), "a dry-run listing what it would clear". The preview and the real
  pass must make the same decision from the same assessment -- the wrong version this
  catches is a preview that uses a looser or separately written rule. Bytes freed are not
  asked for here; BO-4400d-2 owns the space tally.
