notes: |
  Satisfies GE-120b's documentation_triggers: [reference-doc].

  The L1 made this load-bearing: "'Supposed to carry a number' is the load-bearing phrase and it
  is not self-evident — some documents legitimately have no number. Decide the enrolment rule
  per kind of work explicitly at L2 and write it down; do not infer it from the current file
  listing, which is exactly the drifted state being corrected." GE-120b-1 makes the decision;
  this AC is the writing-down half, and the "state WHY each exemption exists" clause is what
  forces it to be a decision rather than a transcription of the drift.

  This is also where the user's scope trim is preserved against a future reader who finds 11
  unnumbered diagrams and assumes they were overlooked. Recording the reasoning is what stops
  that reader re-opening a decision that was made deliberately.
