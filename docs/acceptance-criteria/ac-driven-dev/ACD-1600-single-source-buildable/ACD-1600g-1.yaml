it_requirements:
  - "Add the boundary as a NEW OPTIONAL top-level field on the AC record in config/ac_store_schema.json. Keep the key name `out_of_scope` for continuity with the ticket-frontmatter key templates/agents/change-scope-reviewer.md already reads, so the consumer change in ACD-1600g-3 is a source swap and not a vocabulary change. Shape: a list of repo-relative path or component strings."
  - "HARD PREREQUISITE, VERIFIED 2026-08-17: config/ac_store_schema.json sets top-level `additionalProperties: false` (line 15) and it IS enforced -- scripts/ac_store/validate_ac_schema.py loads the real schema through jsonschema.Draft7Validator and rejects an undeclared field with 'Additional properties are not allowed', exit 1. No AC anywhere in the store can carry a boundary until this slot exists, so this AC gates every other leaf under ACD-1600g."
  - "THE READER MUST RETURN THREE STATES, NOT TWO: absent (no key -- legacy, unmigrated), declared-and-empty (the author positively asserts nothing is excluded), and declared-non-empty. Defaulting the missing key to an empty list at any consumer collapses the first two and is forbidden; ACD-1600g-4's whole guarantee depends on the distinction surviving the read."
  - "Put the read behind ONE seam -- a new module scripts/ac_store/scope_boundary.py -- and make every consumer go through it. A second ad-hoc parse anywhere is where the three-state collapse reappears."
  - "Mirror the shape/type validation into EVERY enforcement point that gates commits, not just the JSON schema: scripts/commit_guardian/check_ac_schema.py AND its manual-validation fallback scripts/commit_guardian/_ac_schema_validators.py (the load-bearing gate when jsonschema is unavailable) AND scripts/ac_store/validate_ac_schema.py. A rule added only to the JSON schema is a partial gate -- the same finding recorded on ACD-1800a-1."
  - "Additive only (ADR-026 safety rule 1): do NOT tighten additionalProperties, and do not make the field required, until the store is 100% backfilled. Absence is legacy mode -- derive nothing, never fail (ADR-026 rule 4)."
  - "Deploy-manifest first (ADR-026 rule 2): if any commit-guardian hook imports the new module, add it to the build_ac_store deploy_map in scripts/build_phases.py (~line 794) in the SAME change, and verify from the deployed layout. The done_proof ModuleNotFoundError precedent is the reason this is a rule and not a reminder."
  - "Canonical source only: the schema and the modules under scripts/ac_store/ in the source tree. Never edit a deployed .claude/ copy or the workspace-parent build-output mirror (ADR-001)."
  - "Error handling per the project policy: a record whose boundary key is present but malformed (a scalar, a list of non-strings) must be reported by the validators as a violation, caught by exception type and logged at WARNING or higher -- never silently normalised into 'absent'. A malformed boundary that reads as absent is the same false-green shape this tree exists to close."
  - "Backward compatibility is testable, not assumed: validating the entire existing AC store after the change must produce zero new violations."
delivers_to:
  agent: python-coder
  contract: "Three-state boundary read from scripts/ac_store/scope_boundary.py: read_boundary(ac_record) -> { declared: bool, paths: list[str] } where declared=False means the key was absent (legacy) and declared=True with paths==[] means the author positively declared an empty boundary. Consumed by ACD-1600g-2 (bundle composition), ACD-1600g-3 (adjudication) and ACD-1600g-4 (absence announcement)."
expects_from:
  ac_id: ACD-1900a
  contract: "The additive-first optional-field landing rule and the schema_version data signal (ADR-026 safety rule 1). Until ACD-1900a's additive slot mechanism is in place, no new top-level AC field can be authored at all -- the store schema's additionalProperties:false is enforced today. Recorded here as a contract rather than a depends_on edge because ACD-1600g deliberately scoped its depends_on to ACD-1600 (see its ORDERING note); the edge itself is the user's call."
test_spec:
  - name: test_ac_declaring_a_boundary_validates_and_the_boundary_reads_back
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Writes a real AC YAML record carrying a boundary to a temp store, runs the real validate_ac_schema entry point over an explicit file glob (exit 0), then calls the real reader and asserts the exact declared paths come back. Fails on a schema-only change that no reader consults."
  - name: test_declared_empty_boundary_is_distinguishable_from_an_absent_one
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Two real on-disk AC records -- one with an explicitly empty boundary, one with no boundary key at all -- both validate, and the reader returns two different three-state results. This is the assertion a default-to-empty-list implementation cannot pass."
  - name: test_legacy_ac_without_the_field_still_validates_unchanged
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    description: "Runs the real validator over pre-existing store records that carry no boundary key and asserts exit 0 with zero new violations -- ADR-026 rule 4, absence is legacy mode and never a failure."
  - name: test_malformed_boundary_is_rejected_by_the_manual_fallback_validator_too
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "An AC whose boundary is a scalar string is rejected by the agent-side validator AND by check_ac_schema with jsonschema forced unavailable so the manual _ac_schema_validators branch runs. Asserts a non-zero exit on both paths."
test_rationale: "Three weaker shapes all pass on a broken implementation here, which is why each test drives a real entry point over a real on-disk record. (1) A test that greps the schema JSON for the key name passes on a key that no reader ever consults -- the exact prohibition in CLAUDE.md's 'Gate / Workflow ACs -- Verify Behaviorally, Not by Grep'. (2) A direct-import unit test of the reader would be handed a dict that some other code already parsed, proving nothing about whether the store validator actually accepts the field; the schema and the reader can disagree while each unit test still passes. (3) Testing only the jsonschema path masks a missing rule in the manual fallback, and the fallback is the branch that actually gates the commit when jsonschema is absent -- so the malformed-input test asserts both enforcement points, not the one that happens to be convenient. The empty-versus-absent pair must be asserted in one run, because an implementation that reports both as 'declared' and one that reports both as 'absent' each satisfy a single-case test."
