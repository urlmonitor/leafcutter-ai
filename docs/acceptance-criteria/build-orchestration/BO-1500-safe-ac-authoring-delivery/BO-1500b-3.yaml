notes: |
  Test contract authored by the IT PO (2026-08-17). Although this AC is
  assigned_agent: llm-expert / change_target: prompt, it is NOT test-free: the
  partial-run-recovery pre-flight it constrains has two executable surfaces —
  scripts/ac_store/scan_ac_orphans.py (scan_draft_orphans_in_worktree, which
  takes a worktree path) and the scanOrphanedAcDrafts step in the plan-feature
  workflow. Both can be exercised behaviourally against a fixture repo, so the
  "no false orphans / scoped to the authoring worktree" guarantee is asserted by
  running the scan, not by grepping prose.

  Caveat for the caller: the doc_link and it_requirement referencing
  templates/skills/create-ac/SKILL.md are stale — that skill no longer exists in
  the tree (/create-ac was retired per ADR-012), so the "both surfaces" clause
  now has only one prose surface. The it_requirements were left unmodified; this
  belongs in a separate reconciliation pass.
