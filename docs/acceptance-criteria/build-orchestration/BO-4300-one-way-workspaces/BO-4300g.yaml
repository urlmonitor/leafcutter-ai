documentation_rationale: >-
  Clearing a workspace by hand, including authorising the loss of unsent work, is already
  documented under BO-4300e's how-to trigger (BO-4300e-5). This family changes who may ask
  for a removal (the dispatching workflow), not the user-facing steps.
change_target: pipeline
risk_surface: safety
notes: |
  ORIGIN: user request via /plan-feature, 2026-10-23, against
  KI-BO-20260921 (fast-lane workspace agent acts on leaked conversation).

  Created by a Pattern C split (user decision, 2026-10-24): BO-4300e reached eight L2s and
  check-ac-tree-limits caps an L1 at five, so the three caller-authorization L2s were moved
  here and renumbered BO-4300g-1..3. BO-4300e keeps its original five.

  Relationship to BO-4300e: BO-4300e says clearing never loses unsent work (the Q8 one-time
  discard token, BO-4300e-3) and that finalize's teardown asks no interactive question
  (BO-4300e-2). This family adds a separate, earlier guard -- may this agent remove at all --
  and never widens the discard token (BO-4300g-1-iii). Hence depends_on BO-4300e.

  USER DECISIONS 2026-10-25 (recorded by IT PO):
  A. Proof for the BO-4300g-1 family: repeated live-dispatch evaluation of the deployed
     worktree-agent, 5 trials per scenario, zero tolerance -- any single unauthorized removal
     fails, and every authorized-path trial must succeed. Live tests are manual-run (_MANUAL,
     -m manual / the informational Agent evals job; no model credential in CI); each has a
     deterministic offline scorer test that runs in CI.
  B. The interactive /worktree path keeps the person's typed "yes" as the caller's
     authorization; the new rule covers workflow dispatches only.
  C. TICKET-20261021-PlanFeatureScriptStepsToShellRunner is superseded by the ticket generated
     from BO-4300g-2.
  D. BO-4300g-1 and BO-4300g-3 are built together in one build.
  E. BO-4300g-1-i "locally" means the main project clone's same-named branch.
  F. Finalize step 7 gets the exact workspace and branch from a NEW maker locate at step 7 (one
     read-only `worktree.py locate` command through shell-runner); the authorization is built
     only from a definite ok answer for the expected branch, and nothing else leads to a removal
     dispatch (BO-4300g-3-i).

