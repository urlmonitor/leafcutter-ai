readiness: draft
priority: medium
title: "New quality checks warn first and never block a build they aren't ready to run"
component: ac-driven-dev
level: L1
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Every new check starts advisory, ships fully installed, and never fails work written before it.

  A new check runs in warn-only mode first and only becomes a build-blocking gate after a
  sustained clean run; it is never made mandatory until it is fully installed and proven from
  the real deployed setup; and new completeness checks judge only what a change actually
  touches, so requirements written before the check existed are never retroactively failed.
