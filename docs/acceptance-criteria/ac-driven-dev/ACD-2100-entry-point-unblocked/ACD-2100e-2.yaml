notes: |
  THE ID AND THE TARGET PATH ARE FIXED FROM THE OTHER SIDE. ACD-2100c-3 and
  ACD-2100c-3-i already carry a planned doc_link to
  docs/how-to/resume-a-paused-plan-feature-run.md, and ACD-2100c-3 additionally
  carries a delivers_to contract naming ACD-2100e-2 and documentation-expert.
  Authoring under a different id or at a different path silently dangles both:
  check-doc-links reports a broken link, never a target that was never created.

  THE READER ARRIVES HOLDING A WAITING RUN. That is what separates this page from
  ACD-2100e-1's diagram, which is for a reader who wants to understand the flow, and
  from ACD-2100d-4's reference page, whose reader is holding a message about a file
  that could not be found. This page is a procedure with an outcome: the run is
  moving again.

  ALL THREE ENDINGS OR THE PAGE IS A TRAP. ACD-2100c-3's contract names three
  observable outcomes and the page must give all three, because the two that are not
  a successful resume are exactly the ones an operator meets when something has gone
  slightly wrong and is most likely to escalate or start over. The
  drafted-work-unchanged clause is there so a mistyped resume does not read as work
  lost -- ACD-2100c-3-i's whole subject is that the run survives it -- and so the
  operator's correct next move is to answer again rather than to re-run the route.

  WHY THE INVOCATION AND NOT A HAND EDIT. The second Then clause insists on the
  invocation the route accepts. A page that told an operator to edit the stored record
  would route them around ACD-2100c-4's provenance check, which is the defect this
  whole L1 family exists to close, and would be a second answer path arriving through
  the documentation rather than through the code.

  BOUNDARY WITH ACD-2100d-4 -- HELD IN BOTH DIRECTIONS. Nothing here restates which
  copy of a route file runs where or what the startup checks report, and this page
  must not be retargeted at
  docs/reference/plan-feature-layout-and-startup-checks.md.

  BOUNDARY WITH AN EXISTING HOW-TO -- FOUND WHILE DECOMPOSING, NOT IN THE PO's NOTE.
  docs/how-to/approval-gate.md already exists and is about a different gate: the
  goal-to-epic readiness report and its yes / review-all / cancel choices, which is
  not resumable and is not one of the five decision points. An operator searching the
  how-to index for "gate" will find it first, so this page needs a title and an
  opening that distinguish it, and neither page should absorb the other.

  DELIVERED BEHAVIOUR ONLY. Every step and every outcome must name the criterion that
  delivers it, and none of it may be written from KI-ACD-005's fix direction -- that
  known issue's stated root cause and stated fix are both out of date, so a procedure
  written from it would be wrong on the day it was published.

  DEPENDS_ON CARRIES THE ORDERING AND NOTHING ELSE DOES. The build sequencer reads
  depends_on only; expects_from edges are invisible to it (KI-ACD-015, open).
  ACD-2100a-4 is named explicitly because it lives under a different L1, so the
  composite edge on ACD-2100e does not reach it -- and it is load-bearing rather than
  tidy: until it lands, pausing degrades to a persist failure when run from a
  worktree, and a page telling an operator their waiting run can be picked up later
  would be promising something that does not happen. ACD-2100c-2 already carries the
  same cross-family edge, which is the precedent. ACD-2100a as a whole is deliberately
  not depended on; only a-4 is load-bearing here.

  FOR THE IT PO: assigned_agent is documentation-expert per ACD-2100c-3's delivers_to
  contract. This is a prose deliverable with no executable surface, so
  test_required: false with an explicit test_rationale is the likely correct call --
  permitted because change_target is docs, with ACD-2100d-4 the precedent in this same
  tree. Do not let that become a grep-for-words test: a test asserting that the three
  outcome names appear in the page passes on a page that gives an invocation the route
  no longer accepts, and presence-shaped proof is what this tree exists to discredit.
  The three outcomes are each proved by executing tests on the records that own them --
  ACD-2100c-3 and ACD-2100c-3-i -- and the two mechanically checkable clauses here are
  already covered by the generated docs/INDEX.md and check-doc-frontmatter.

  2026-08-25 (it-po): CONFIRMED documentation-expert rather than chosen. The assignment
  was already fixed from the other side by ACD-2100c-3's delivers_to contract, which
  names both this id and that agent. Sized M -- one new page plus the regenerated
  docs/INDEX.md, with the work being reconciliation of three quoted outcome reports and
  a two-layout invocation rather than volume of prose. Test contract is
  test_required: false with the reason recorded in test_rationale rather than left to
  inference, following ACD-2100d-4 in this same tree; permitted because change_target is
  docs, which the schema validator allows.

  ORDERING GAP FOUND AND NOT EDITED (depends_on is BA-owned). This page links
  ACD-2100e-1's diagram and sends the operator to it, so e-1 is upstream, but
  depends_on does not name it. Three facts compound: the sequencer reads depends_on only
  (KI-ACD-015, open); expects_from orders nothing; and no hook in this repository
  validates a markdown-to-markdown link -- check_doc_links covers DOC_LINKS in Python and
  SQL files only and always exits 0. So building this record first would publish a live
  page pointing at a file that does not exist and nothing would report it. Recorded above
  as an expects_from contract and mirrored as a delivers_to on ACD-2100e-1, and carried
  into it_requirements as a pre-publication check. The recommended edit before approval is
  depends_on: [ACD-2100e, ACD-2100c-3, ACD-2100c-3-i, ACD-2100a-4, ACD-2100e-1]. Left to
  the BA rather than applied here.

  ONE CHECK THE STORE LEANS ON DOES NOT DO WHAT THE NOTES ASSUME. Several records in this
  tree cite check-doc-links as the reason a wrong target path matters. The conclusion is
  right -- publish at the exact path -- but the stated reason understates the risk: a
  wrong path is not "reported as a broken link", it is not reported at all, on either
  side. Flagged rather than corrected in the BA's own note text.

  FRONTMATTER COMPONENT VOCABULARY -- ONE DEFECT FOUND IN THE PRECEDENT. ACD-2100d-4's
  it_requirements instruct the author to declare the frontmatter component as the kebab
  ac-driven-dev. check_doc_frontmatter validates components entries against the keys of
  docs/components.json, which are the underscore graph ids, so that instruction would
  fail the gate. Both records in this L1 state the underscore form; ACD-2100d-4 is
  already approved and is reported for correction rather than edited here.
