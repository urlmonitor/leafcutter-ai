it_requirements:
  - "The change lands in templates/scripts/worktree_repo_facts.py only. Deployed copies (scripts/, .leafcutter/scripts/) are regenerated by 'python scripts/build.py' and never hand-edited (ADR-001)."
  - "A reference is resolved to the folder holding it ONLY when it names an existing file — one small helper (e.g. `_anchor_dir(p)`: `p.parent if p.is_file() else p`) applied to exactly three arguments: base's `start`, facts' `--reference`, and branch-standing's `--repo`. Directories and paths that do not exist pass through unchanged."
  - "facts' own candidate `path` is never re-anchored. Classifying what a path IS is that subcommand's whole job, and a ticket file is not a checkout's top-level directory."
  - "No answer shape changes: same subcommands, same single-line JSON object, same keys. null still means 'could not be determined', and nothing that was null for a location genuinely outside every repository becomes non-null."
  - "build-feature.js is not changed. Its repoAnchor keeps deriving from the resolved target exactly as BO-4000f requires; the mechanism is made to accept the reference the driver already passes, rather than one caller being taught to pre-digest it."
  - "This narrowly amends BO-4000f's it_requirement that worktree_repo_facts.py is not modified: only the handling of these three reference arguments changes. The cwd default stays, and no refusal in BO-4000a/b/c is weakened or widened."
  - "Pure stdlib; no new CLI flag, configuration key or subcommand."
