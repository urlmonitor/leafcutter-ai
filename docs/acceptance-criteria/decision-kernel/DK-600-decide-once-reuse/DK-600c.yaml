criteria: |
  What was asked, weighed and chosen is kept, ready for you to publish.

  When the work ends, the decision you approved is kept together with everything
  needed to understand it later: the question, the options and criteria, where
  the evidence came from, the ranking you saw, the earlier decisions considered and
  who approved it. Your project stays untouched until you choose to publish, you
  are told exactly how to do that, and only decisions a person actually approved
  are ever kept.
