readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given the evidence record defined by TQ-600a-2 and the failure causes defined by
    TQ-600a-1-ii,
  When the reference page for the evidence record is authored,
  Then the page names every field of the record and what each one holds,
    And it lists every allowed verdict (passed, failed, not run) and every allowed failure
    cause, with the meaning of each,
    And it states when a whole run reads as failed,
    And it shows how a done-proof cites a record and a case within it,
    And it states when a record reads as out of date and that whether an out-of-date record
    keeps its standing is decided by TQ-400,
    And no value on the page is named live_dispatch.
