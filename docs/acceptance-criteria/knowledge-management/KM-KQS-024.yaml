  - "Must not use a hardcoded blocklist — filter by node-existence check only"
  - "Must handle errors gracefully per the project error handling policy"
  - "Must apply the filter consistently in both scripts (knowledge_query.py and visualise_knowledge_graph.py)"
  - "Must not modify the source edge data — filtering is output-stage only"
