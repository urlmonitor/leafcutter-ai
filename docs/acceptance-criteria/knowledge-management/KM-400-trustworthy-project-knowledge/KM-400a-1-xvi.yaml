it_requirements:
- Only supplied SourceFile entities may be enriched; no filesystem operation may replace their recorded source revision,
  existence observation or content hash.
- Exclusions are exactly the top-level properties keys _native_projection, _native_identity and _native_source_path;
  unrelated similarly named and nested properties remain source data.
