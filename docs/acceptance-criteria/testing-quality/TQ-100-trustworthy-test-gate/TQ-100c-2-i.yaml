it_requirements:
  - "DESIGN DECISION (settled): a done AC with zero covering tests is a HARD failure of the pre-pytest integrity check (non-zero exit), NOT a non-blocking warning — scoped strictly to ACs whose work_status is done ('a shipped feature must have a protecting test')."
  - "DESIGN DECISION (settled): there is currently NO check_ac_coverage.py in this repo. Build the zero-coverage detection as a violation class of the TQ-100c-2 integrity check (one module). IF a check_ac_coverage.py is later introduced, EXTEND/REUSE its reverse-direction coverage scan rather than duplicating logic — the done-scoped hard-fail is an added severity tier, not a second coverage walker."
  - "Coverage is determined by scanning test bodies for the `# covers: <AC-ID>` tag (the established convention) — an AC is covered iff at least one collected/known test names it."
  - "The violation message must name the offending AC id; the violation class must be reported distinctly from an assertion failure."
