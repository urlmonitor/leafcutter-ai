title: "A well-formed refusal is not parsed as an empty pause-record result"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a peek-pause-record or read-pause-record dispatch is answered with a
    well-formed refusal -- a reply that is valid, parseable data but states
    that the dispatched agent declined the request (for example, text naming
    the request as outside the agent's charter, such as the historical
    worktree-agent refusal "I'm the worktree lifecycle agent, scoped to two
    actions: create and remove"),
  When the workflow evaluates that reply to decide whether a pause record
    exists,
  Then the reply is classified as "could not determine", not as an empty
    result,
  And this is distinguished from a genuine empty read -- a dispatch that
    actually queried the pause store and found nothing returns
    {"exists": false, "stale": false, "record": null} and that reply still
    correctly reports "no pause record exists".
depends_on: [BO-2300e-3]
