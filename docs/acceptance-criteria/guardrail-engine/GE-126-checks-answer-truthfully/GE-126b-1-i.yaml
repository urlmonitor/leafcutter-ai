notes: |
  THIS PINS THE THREE-WAY AMBIGUITY KI-CG-018 NAMES and it is the reason the instrument
  that already exists did not help anybody. An opt-in diagnostic answers "did you look"
  only for a caller who already suspects the answer is no and knows the switch's spelling.
  Everyone else reads silence as agreement.

  IT IS AN L3 BECAUSE IT CONSTRAINS THE FORM of GE-126b-1's statement rather than adding a
  separate behaviour. It is nonetheless the clause most likely to be dropped: the cheapest
  way to satisfy GE-126b-1 is to move the existing opt-in line above the early returns and
  leave it opt-in. That change would pass GE-126b-1's tests if they happen to set the
  switch and would leave the defect untouched for every caller who does not.

  BACKWARD COMPATIBILITY IS NOT A REASON TO KEEP THE GATE. The switch may continue to
  exist and may continue to add detail. What it may not do is decide whether the check
  says anything at all.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

  ------------------------------------------------------------------------------
  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NULL AND THAT IS NOW A DECISION, NOT AN UNFILLED FIELD. This record is
  TERMINAL: it removes an option. Nothing downstream can consume the absence of a
  suppression switch, and the statement itself is GE-126b-1's deliverable, not this
  record's. DO NOT REFILL.

  AGENT AND SIZE. python-coder, S. Small in code, and deliberately so — the risk here is
  not difficulty, it is that the clause gets dropped as redundant. Build it in the same
  pass as GE-126b-1 or the cheap version of that fix ships.

  THE CLEARED ENVIRONMENT IS THE WHOLE TEST CONTRACT. A suite that runs under its own
  inherited environment cannot distinguish an unconditional statement from an opt-in one
  that happens to be switched on. If a reviewer sees these descriptors implemented
  without an explicit environment clear, the record is not covered whatever the tests
  report.

