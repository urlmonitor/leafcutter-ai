it_requirements:
  - "The finished/unfinished boundary is implemented once, in the declared-files seam (scripts/ac_store/declared_files.py, ACD-1600c-4), extending the ACD-1600c-4-i existence-vs-marker rule rather than adding a second rule. 'Finished' is read from the record's work_status (done) -- data-driven, never keyed on ids or paths."
  - "Commit-time enforcement: the check-ac-schema hook is the load-bearing gate, and in BOTH its jsonschema and manual-fallback branches, and in the agent-side validator (validate_ac_schema.py), a finished record's 'existing' entry that is absent produces no refusal and no warning. An unfinished record with the same entry keeps the ACD-1600c-4-i refusal -- exactly one message, not a second one from this rule."
  - "Store-wide reporting: the 'declared existing, now absent (work finished)' entries are a new section of the store-wide declared-files report defined in ACD-1600c-4-ii, produced through the seam's command-line entry point -- not a second report, script or parser. The section label text is verbatim, one line per (record, path) naming both, sorted by record id then declared order, followed by the section's total."
  - "The section is informational: its entries never make the report command exit non-zero, and they are never raised at commit time."
  - "Read-only: neither the check nor the report writes any record; a finished record's declared_files entry is never removed, re-marked or re-ordered (ACD-1600c-4-ii's no-back-fill rule holds)."
  - "The report stays deterministic (two runs on the same store and tree are byte-identical) and within ACD-1600c-4-ii's budget of 10 seconds for 5,000 records with the section added; existence checks do not spawn a subprocess per declared path."
  - "Tests run against a temporary repository tree and a fixture store, never the live ones, so deleting scripts/ac_store/legacy_helper.py in a fixture never touches the working tree."
