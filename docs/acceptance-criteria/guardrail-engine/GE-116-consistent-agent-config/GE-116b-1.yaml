delivers_to: null
expects_from:
  ac_id: GE-116a-1
  contract: "The fail-closed block path (non-zero exit) of the verification-consistency guard, whose stderr message this AC populates."
it_requirements:
  - "The block message must name the specific offending template path (e.g. templates/agents/pt-classifier.md) and state BOTH valid fixes: add Edit or Write to tools, OR set requires_verification: false."
  - "The message must be self-sufficient — a contributor resolves it without searching for which definition is at fault."
