id: BP-1500a-1
components:
  - build_pipeline
title: "The build writes the documentation map from the same docs folder it writes the map into, and never replaces a populated map with an empty one"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a self-hosting layout: the build target is a workspace folder that has
    no docs/ folder of its own, and the configured docs_root points at a
    package's docs folder inside it (e.g. "leafcutter-ai/docs/")
  And that docs folder contains how-to/x.md with a description in its frontmatter
  When the build's doc-index step runs
  Then the map written to <docs_root>/INDEX.md lists how-to/x.md
  And no section of it reads "No docs found." for a category that has docs
  And the bug symptom ("every build overwrites the tracked
    leafcutter-ai/docs/INDEX.md with a stub where every section reads
    'No docs found.'") must not occur

  Given a consumer layout: the build target has its own docs/ folder and
    docs_root is the default "docs/"
  When the doc-index step runs
  Then docs/INDEX.md is exactly what it was before this change for the same tree

  Given an existing map that lists at least one entry
  And a scan that finds no docs in any category
  When the doc-index step runs
  Then the existing map is left byte-identical
  And the step reports, as a warning, which folder it scanned
  And the step reports that it wrote nothing
