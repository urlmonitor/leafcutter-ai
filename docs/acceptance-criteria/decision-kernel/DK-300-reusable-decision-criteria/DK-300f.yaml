criteria: |
  Usage and outcomes per category show which questions earn their place.

  For every published category you can see how many published decisions used
  it, always counted from the records themselves rather than kept by hand, and,
  where the optional learning store is set up, how the decisions that relied on
  it turned out. Being used often never counts as proof that a category is good,
  and decisions work exactly the same when no learning store is set up.
