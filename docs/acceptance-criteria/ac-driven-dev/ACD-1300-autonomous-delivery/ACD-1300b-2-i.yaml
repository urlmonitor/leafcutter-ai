- ac_driven_dev
level: L3
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given two agent calls are already running with a limit of two
  When the user changes the limit to one
  Then both existing calls may finish
  And no replacement starts until the running-call count is below one
  And status distinguishes the configured limit from the draining calls
