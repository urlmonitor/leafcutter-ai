title: "Criteria change with stale amended_by entry is rejected"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given an existing AC YAML file has its criteria field changed in the staged diff,
  When the amended_by list contains entries but none of them are new
    compared to the previous committed version of the file
    (i.e. the list is identical to the prior version despite criteria changing),
  Then the commit is blocked,
  And the error message states that a new amended_by entry is required
    to accompany the criteria change,
  And the error names the file path and the amended_by field.
