criteria: 'Given a ready research need has no eligible registered query and policy permits building that missing
  ability

  When the research process requests a capability build

  Then the existing gap mechanism records the missing behavior and creates a bounded coding-agent child linked to
  the original run, question and evidence need

  And the child receives the expected result meaning, missing inputs already resolved, authorized repository and
  pinned source revision, available catalog and budget

  And duplicate observations or repeated continuation delivery do not create duplicate active builds for the same
  gap attempt

  And lack of build permission or budget leaves an explicit unresolved outcome without bypassing the normal delivery
  checks.

  '
