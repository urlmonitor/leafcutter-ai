assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Attribution is scripts/agent-health/weekly_health.py::classify_path(path) -> tuple[str, str] returning (language, kind) with kind drawn from exactly code, spec, prose and other. It must be pure over the path string — no filesystem stat, no repository access — so every scenario is executable from a literal path and a file that no longer exists on disk is still attributable from the diff."
  - "The two lookup tables (_EXTENSION_LANGUAGE mapping suffix to language, _LANGUAGE_KIND mapping language to kind) must remain the single source of the mapping, and the kind must be derived from the language rather than restated per suffix. A second per-suffix kind table would drift the moment a language gains an extension."
  - "Extension matching must be case-folded, and the match must be on the final suffix of the FILENAME, not of the whole path. A leading dot is not a suffix: a dotfile whose name has no other dot must fall to (Other, other) rather than having its whole name read as an extension."
  - "The extensionless build-file case must be recognised by filename convention before the suffix lookup runs, so a Dockerfile is not discarded into the unclassified bucket. This is the one convention-based branch permitted; do not extend it into a general filename allowlist without a criterion covering the new names."
  - "An unrecognised suffix must resolve to the explicit (Other, other) pair and must NEVER be folded into a real language's totals. The other row is the audit surface for attribution defects and only works if it is honest — a misattribution here is small in volume and permanent in effect, because nobody audits a language row that looks plausible."
  - "The test-surface predicate is weekly_health.py::is_test_path(path) -> bool and must recognise a nested test directory as readily as a top-level one, so scripts/foo/tests/test_bar.py is a test surface and scripts/agent-health/weekly_health.py is not. The markers must live in one module-level constant (_TEST_PATH_MARKERS) rather than being inlined at the call sites, and the prod_loc and test_loc totals must be disjoint — a line counted as test must not also be counted as production."
