test_spec:
- name: test_retired_workspace_reports_its_deleted_ignored_content
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: A clean legacy worktree holding an ignored .env.local and an ignored build/ folder is retired;
    its folder is gone, its retired entry's ignored_removed lists exactly .env.local and build/, and the
    no-change preview run before it listed the same paths and deleted nothing.
test_rationale: Every assertion is made on what the deployed maker actually did to a real legacy worktree --
  its JSON report and preview, and the folder afterwards. Ignored files are invisible to the unsent-work
  verdict, so only the report shows a person what was lost.
