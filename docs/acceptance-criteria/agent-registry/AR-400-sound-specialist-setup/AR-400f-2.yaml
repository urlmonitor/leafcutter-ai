roadmap_phase: phase_1
criteria: |
  Given ticket-supervisor's definition in the package's real tree, with the
    redundant-entry check of AR-400f-1 in force,
  When the build runs and compiles ticket-supervisor's prompt,
  Then ticket-supervisor's `spawn_allowlist` declaration lists
    `__ticket_phase_agents__` and "brainstorm-lead" and does not list
    "llm-expert",
    And the compiled hand-off list of ticket-supervisor names llm-expert exactly
      once, and names every other agent it named before the change,
    And the build reports no redundant-entry finding for any specialist, and the
      regenerated central registry's spawn_allowlist for ticket-supervisor
      matches the declaration.
depends_on:
  - AR-400f
  - AR-400f-1
