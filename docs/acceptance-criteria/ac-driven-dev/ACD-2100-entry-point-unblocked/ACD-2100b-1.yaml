notes: |
  OUTCOME 1 OF 4. Verified by the PO on 2026-08-25 at
  templates/workflows-js/plan-feature.js:1745-1791:

    const match = entries.find((e) => e && e.id === workspaceSetupAgentId);
    permitsShell = !!(match && match.permits_shell === true);

  `permitsShell` is false for four different reasons and all four print one
  message asserting a permissions problem and pointing the operator at
  `config/agent_registry.json`'s `permits_shell` field. In the observed run that
  field was already correct (`worktree-agent` has `permits_shell: true`,
  agent_registry.json:1368), so the remedy named a field with nothing to fix.

  NAMING THE LOCATION IS THE ACTIONABLE PART. "Could not read the registry" alone
  is barely better than the false verdict: the whole reason the read failed is that
  the location was wrong, and the operator cannot see that without being told which
  location was tried. This is also what makes the behaviour testable against a
  fixture rather than by eye.

  THE LAST TWO CLAUSES ARE THE ACTUAL DEFECT. They are negative on purpose. A test
  that asserts only that SOME message was printed restates the bug -- the buggy code
  prints a message too. What must be observable is that this outcome no longer
  produces the permissions text.

  FAILING CLOSED IS NOT UP FOR TRADE. The run still stops. ACD-2100b-4 is the guard
  that keeps it stopping; the objection is to the diagnosis, not to the caution.

  ORDERING: ACD-2100a-3 makes the read succeed from a worktree, which removes the
  common cause of this outcome. It does not remove the outcome -- a genuinely
  missing or unreadable registry still has to be reported honestly, and this is the
  behaviour that survives the path fix.

  2026-08-25 (it-po): the it_requirement forbidding a hard-coded location in the
  message is the one a coder is most likely to miss. The obvious implementation
  interpolates the same constant the resolution uses, which reads correctly today and
  silently goes stale the first time the resolution changes -- and a stale location in
  a diagnostic is the same class of defect as the permission verdict this record
  removes: a specific claim the check did not establish.
