it_requirements:
- 'Word-only edits: no line is added or removed in templates/workflows-js/plan-feature.js. Every ''Why why''
  there is a rationale pointer comment, at 15 sites (L1660, 1694, 1721, 1734, 1806, 2299, 2344, 2365, 2370,
  2401, 2581, 2912, 2957, 3079, 3189); all 15 are corrected.'
- Canonical sources only; deployed and installed copies are regenerated by the build and never hand-edited
  (ADR-001).
