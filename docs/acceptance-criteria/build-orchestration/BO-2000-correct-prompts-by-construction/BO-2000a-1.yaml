roadmap_phase: phase_1
criteria: |
  Given a phase agent following the shared sign-off block,
    and the agent is running in a deployed consumer project where its skills live in
    the consumer skills location,
  When the agent resolves the sign-off skill,
  Then it loads the skill from the deployed consumer location,
  And when that location is absent (the agent is running in the package source or a
    worktree), it loads the same skill from the package source location instead,
  And the sign-off proceeds using whichever location resolved.
