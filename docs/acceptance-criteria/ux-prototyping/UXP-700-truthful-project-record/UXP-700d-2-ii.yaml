risk_surface: contract_boundary
test_required: true
test_rationale: |
  The example criteria share the ux-prototyping component with every real AC in this feature
  tree, so the most obvious implementation - set aside anything under ux-prototyping - would
  pass UXP-700d-2 and UXP-700d-2-i and silently remove the whole component from the work queue.
  This is the paired acceptable input and the last clause is the assertion that catches that
  specific wrong fix.
test_spec:
  - name: test_a_real_criterion_in_the_shared_namespace_stays_in_the_ready_set
    target_dir: unit_tests/ac_store/
    description: "A ready real criterion under the ux-prototyping component is returned by the scan."
    type: integration
    angle: boundary
    framework: unittest
  - name: test_set_aside_rule_does_not_key_on_the_component_namespace
    target_dir: unit_tests/ac_store/
    description: "Moving a real criterion into the same component as the example criteria does not set it aside."
    type: unit
    angle: seam
    framework: unittest
notes: |
  This is the record that decides the shape of the fix. Component namespace is NOT a usable
  discriminator here, because the 18 example criteria and every AC in the UXP-700 tree share
  component: ux-prototyping. The discriminator has to be the product the criteria describe, as
  UXP-700d-1 establishes for artifacts.
