notes: |
  User-authored intent: BrainCandy. Framed by product-owner, 2026-09-30.
  L0 and L1 only -- no Gherkin, no technical requirements, no test contracts.

  THE MEASURED SHAPE OF THE GAP. Treat these as established facts; they were
  measured across the 60 compiled specialist prompts, not inferred.

    - ZERO of 60 specialists receive a working abilities table. The table is
      computed per specialist and then discarded, because placement is gated on
      a marker token that appears in none of the 60 source templates. No warning
      is emitted. The build reports success and exits clean.
    - The identical silent failure hits a SECOND per-specialist block by the
      same mechanism. Both per-specialist deliveries are dead. Nothing anywhere
      checks that a computed block reached its destination -- which is why
      AR-300b is a guarantee about the delivery mechanism rather than about
      either block.
    - 31 specialists have recorded abilities. None of the 31 received them. The
      only specialist whose instructions mention its abilities has that section
      written by hand rather than delivered.
    - The record of abilities is SPLIT ACROSS TWO FIELDS holding different
      populations -- 32 specialists in one, 40 in the other, 12 present only in
      the second. Repairing delivery alone would leave those 12 receiving
      nothing, which is why AR-300c is not a tidy-up.
    - Observed consequence over roughly 90,000 recorded specialist actions:
      abilities were invoked 33 times, all by the 6 specialists that happen to
      hold the means. Specialists instead fell back to raw text search about
      32,600 times, including for questions a shipped ability already answers.

  THE WORKING PRECEDENT, IN THE SAME STEP. A different block is appended with no
  marker token at all, on the strength of a flag the template declares in its
  own header. That mechanism delivers 23 of 23. The design that works is already
  in the building; the broken delivery simply did not use it. AR-300d exists so
  the fix generalises that precedent rather than reinstating a marker token in
  60 templates -- an outcome that would be correct on the day it ships and rot
  the first time someone adds the 61st specialist.

  THE PRODUCT DECISION ALREADY TAKEN BY THE USER -- carry it down, do not
  re-litigate. A specialist's abilities move INTO the specialist's own
  definition, directly beside the declaration of what it is permitted to use, so
  that what a specialist is allowed to do and what it is told it can do sit
  together and can be checked against each other. The central record's ability
  fields become derived and validated rather than authoritative. AR-300c carries
  this decision.

  A STANDING RECORD CONTRADICTS THAT DECISION -- FLAGGED, NOT SILENTLY
  OVERRIDDEN. INF-600a-1 (level L2, readiness reviewed, work_status todo) is the
  record that CREATED the two rival fields: it makes the newer central field
  authoritative and keeps the older one as a compatibility alias. That is the
  opposite of the direction now chosen, and it explains the split population
  measured above -- a half-completed migration. It is an L2 and therefore not
  this agent's to amend. The Business Analyst or IT PO must reconcile it --
  amend or supersede it explicitly when AR-300c is decomposed. Leaving both
  records active leaves two approved statements about where the truth lives,
  which is the same defect one level up.

  WHAT WAS DELIBERATELY NOT AUTHORED HERE. 25 specialists are recorded as having
  abilities they have no means to invoke. That is a behavioural instance of
  AR-200b ("a specialist told to use a particular tool is given that tool") and
  belongs as a new leaf under it, not as a fifth L1 here. One caveat for whoever
  writes it: AR-200b's existing leaf derives its obligation from the template's
  PROSE naming a state-mutating tool, and this instance derives it from a
  DECLARED ability list naming a non-mutating one. The leaf must state its own
  derivation rather than inherit that one, or it will be written against a rule
  that does not reach it.

  WHY A NEW L0 AND NOT AN AMENDMENT. Four hosts were examined and each is fenced
  in doc_links above rather than quietly left adjacent. AR-200's stated promise
  is equipment for an obligation, and its two L1s are both obligation-matching;
  widening it to cover silent non-delivery of capability declarations changes
  what an approved record promises after the fact. BP-1500 is about the build's
  account of the files it wrote and passes cleanly on this defect. INF-1200 is
  the same plane with a different subject. INF-600 is the reader's view, and is
  additionally at its child cap under a standing waiver.

  THE ALTITUDE TEST THIS GOAL HAD TO PASS. An earlier framing was "specialists
  get their skills table". It was lifted, because the outcome survives swapping
  the thing granted: the second dead delivery measured above is not a skills
  table at all, and it fails identically. The title therefore names no
  particular ability, no particular specialist and no particular mechanism. A
  criterion in this tree that reads as being about one named block is at the
  wrong altitude.

  ROADMAP OBSERVATION, FLAGGED NOT ACTED ON. phase_1's exit criterion
  "build.py --validate-only returns 0 with no template injection errors" is
  satisfied today while two per-specialist injections deliver nothing to anyone
  -- because it measures leftover markers rather than delivered content. The
  criterion as worded may measure the wrong thing. Raised for the user; the
  roadmap was NOT edited, since that requires explicit confirmation.

  PRIORITY AND READINESS ARE AUTHORING DEFAULTS, NOT JUDGEMENTS. Every record in
  this tree is draft/medium. The user sets both at the approval gate.

  IDENTIFIER. AR-300 was confirmed free on 2026-09-30 by a full-text recursive
  search for the literal AR-300 across docs/ and tickets/ in this worktree --
  zero hits. The highest L0 hundred otherwise in use in this component is
  AR-200. Per standing rule, re-verify at merge time; id allocation in this
  store is known-broken (KI-ACD-008).
