  - precommit_hooks
level: L0
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  No function quietly becomes too tangled to follow.

  A function with too many paths through it is where bugs hide and where nobody
  dares to change anything. The package says it stops you committing one, and
  points you at a skill that helps you untangle it. In fact that check has never
  run on a single commit. It cannot simply be switched on either, because the
  project already holds over a hundred functions above the limit, and a flat check
  would stop work on every file that holds one. After this goal, a function that is
  already too complex can still be worked on but never made more complex, no new
  function arrives over the limit, the check runs on every ordinary commit, and
  being stopped tells you which function, by how much, and where to get help.
