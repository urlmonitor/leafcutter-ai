id: TQ-600a-13-xxi
components:
  - testing_quality
  - knowledge_management
title: "The post-merge run executes every live-database test against a disposable database after every merge and heartbeat, and a twice-failing one makes the run red"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the live-database tests — the tests that exercise publication, reclamation and the
    capacity gate against a real graph database and skip when none is reachable — which
    today execute against a database in exactly one place: the pull request's Proof-of-done
    check, and there only the subset covering the acceptance criteria that pull request
    changes,
  And that the per-PR test shards start no database, so those tests skip there, and the
    post-merge run of TQ-600a-13-ii executes only the correctness lane and starts no
    database either,
  And therefore that once the pull request marking a live-database criterion done has
    merged, no later run executes its test against a database, so a later change that
    breaks publication, reclamation or the capacity gate against a real database merges
    unnoticed,
  When a commit lands on the main branch, or the post-merge heartbeat fires, or a person
    starts the post-merge run by hand,
  Then the same post-merge run, under the same triggers and the same coalescing as
    TQ-600a-13-ii, also executes a live-database lane: it starts the same disposable
    graph-database instances, of the same database version and on the same addresses, that
    the Proof-of-done check starts, and executes every test in the live-database test
    folder against them — the whole folder, not only the tests of recently changed
    criteria, including any test in that folder the default run would otherwise deselect,
  And when some live-database tests fail on the first execution, exactly those tests are
    executed again — each once, and no test that passed — on a fresh machine that starts
    its own fresh disposable database instances and receives nothing from the first
    execution except the list of tests to re-execute,
  And a live-database test that fails on both executions makes the post-merge run red, and
    the run's result names that test by its full node id and as belonging to the
    live-database lane,
  And a live-database test that fails and then passes does not by itself make the run red,
    and is named as passed-on-retry exactly as a correctness-lane test is, for
    TQ-600a-13-xiii to track,
  And the post-merge run is green only when both the correctness lane and the
    live-database lane are green, so a red live-database lane holds pull requests through
    the same `Post-merge suite status` verdict the correctness lane feeds, with no second
    hold check,
  And the live-database lane's population is collected afresh on every run from the
    folder itself, never from a stored list, so a live-database test added to the folder
    after this change is executed by the next post-merge run with no other edit,
  And adding this lane changes neither the correctness lane's own selection nor the
    timing lane's, and the partition of TQ-600a-13-xii — every test collected by exactly
    one of the default run, the correctness lane and the timing lane — still holds with the
    live-database lane not counted as a fourth member of it, because the live-database lane
    re-executes default-run tests with a database present rather than taking them out of
    the default run,
  And each of these outcomes is demonstrated by executing the lane's selection, retry and
    verdict behaviour against a synthetic population of live-database tests made to pass,
    fail, or fail-then-pass against a real disposable database, with the first execution
    and the retry run as two separate jobs that share only the handed-over list, never by
    reading the workflow definition for a service, a trigger or a selection.
depends_on:
