estimated_complexity: M
it_requirements:
  - "The criterion-movement computation is scripts/agent-health/weekly_health.py::ac_deltas(before, after). It takes two id -> work_status snapshots and returns exactly the five keys filed, done, reopened, net_done and store_size. It must stay a pure function over the two dicts — no git call, no store read, no clock — so every scenario above is executable from literal inputs and the report's most-trusted figure remains testable without a fixture repository."
  - "The reopen branch must require the identifier to be PRESENT in the end snapshot as well as done in the start snapshot. Counting an absent identifier as a reopen would make every routine store cleanup read as the system retracting its own completed work, and would spike the one metric the whole trust tier is built on."
  - "net_done must be done minus reopened and must be permitted to go negative. Clamping it at zero would erase exactly the weeks this metric exists to expose."
  - "Every division in the trust tier must route through weekly_health.py::safe_ratio, which returns None on a zero denominator instead of raising or substituting 0. composite_score(net_done, done, reopened) must therefore return None — never 0.0 — when nothing was closed, because net_done / (1 + reopen_rate) is undefined there and a 0 would render as a measured perfect-trust week."
  - "Snapshot keys must be criterion identifiers, never store paths. Reuse the identifier derivation specified by INF-500e-3 (weekly_health.py::ac_key, consumed via work_status_at) rather than re-deriving it here; a path-keyed snapshot inflates both filed and done on every folder move."
  - "Must not introduce a raw done-count shortcut alongside the discounted score. Per scripts/agent-health/README.md the tier is deliberately built on reopens because a reopen is only ever recorded against the system's own prior claim of completion, and the store's work_status field has a documented phantom-done history."
test_spec:
  - name: TestAcDeltas::test_counts_filed_done_and_reopened
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "Four criteria a/b/c/d across one period yield filed 1, done 1, reopened 1, net_done 0 and store_size 4."
  - name: TestAcDeltas::test_criterion_filed_and_closed_in_the_same_period_counts_once_as_done
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "A criterion absent at the start and done at the end counts once as filed and once as done, giving net_done 1."
  - name: TestAcDeltas::test_deleted_criterion_is_not_counted_as_reopened
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "A criterion done at the start and absent at the end yields reopened 0, so a store cleanup is not read as a retraction."
  - name: TestAcDeltas::test_empty_snapshots_are_all_zero
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "Two empty snapshots yield net_done 0 and store_size 0 without raising."
  - name: TestCompositeScore::test_clean_week_scores_its_full_net
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "A period closing 40 criteria and reopening none scores its full net verified total of 40."
  - name: TestCompositeScore::test_fully_retracted_week_scores_zero
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "A period closing 40 and reopening 40, leaving net 0, scores 0."
  - name: TestCompositeScore::test_negative_net_produces_a_negative_score
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "36 closed against 47 reopened, net -11, produces a negative score, so a retracting week cannot present as progress."
  - name: TestCompositeScore::test_no_closures_returns_none
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: failure
    description: "A period that closed nothing returns None from composite_score rather than 0, and raises no error."
  - name: TestSafeRatio::test_zero_denominator_returns_none
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: failure
    description: "The reopen rate over a zero closure count is None rather than 0 or a ZeroDivisionError."
  - name: TestSafeRatio::test_zero_numerator_is_zero_not_none
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: boundary
    description: "A genuinely-zero numerator over a non-zero denominator is 0.0, not unknown — the measured-zero half of the same rule."
  - name: TestSafeRatio::test_normal_division
    target_dir: unit_tests/agent_health/
    framework: unittest
    type: unit
    angle: criterion
    description: "safe_ratio(1, 4) is 0.25, so the None branch is a genuine special case and not the only path the function can take."
test_rationale: |
  Every descriptor names a test that already exists and passes in
  unit_tests/agent_health/test_weekly_health.py; this contract binds the criteria
  to that shipped evidence rather than commissioning new coverage. The shape is a
  direct-import unit test because ac_deltas, safe_ratio and composite_score are
  pure functions over literal snapshots — the scenarios are fully executable
  without a fixture repository, so a heavier integration test would add setup cost
  without adding proof. The two measured-value descriptors
  (test_zero_numerator_is_zero_not_none, test_normal_division) are load-bearing
  rather than decorative: without them an implementation that returned None for
  every ratio would satisfy the unknown-when-nothing-closed scenario and quietly
  destroy the metric.
delivers_to:
  agent: python-coder
  contract: "Per-period trust figures consumed by build_report and the two renderers (INF-500e-2): ac_deltas(before: dict[str, str], after: dict[str, str]) -> dict with int keys filed, done, reopened, net_done, store_size, where net_done may be negative; safe_ratio(numerator: float, denominator: float) -> float | None with None on a zero denominator; composite_score(net_done: int, done: int, reopened: int) -> float | None with None when done is 0. Every None in this contract means unknown and must never be coerced to 0 downstream."
expects_from:
  ac_id: INF-500e-3
  contract: "Two work_status snapshots as dict[str, str] mapping the criterion IDENTIFIER (weekly_health.py::ac_key output, e.g. BO-2400f-13) to its work_status value at the period boundary. Keys are identifiers, never store paths, and non-criterion store files (index.yaml, prose) are already excluded from the mapping."
