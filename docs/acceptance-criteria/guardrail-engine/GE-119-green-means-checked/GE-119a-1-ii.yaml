it_requirements:
  - "The vocabulary must carry THREE states, not two: ordinary-success (authoritative instrument, nothing found), degraded-but-ran (reduced instrument, nothing found, NOT authoritative), and could-not-check (never ran). Add the third value to the shared outcome module GE-119a-1 introduces. Do not model it as a boolean bolted onto success — a boolean read by one caller and ignored by another is how the current family diverged."
  - "An existing flag already models half of this: templates/scripts/commit_guardian/check_ac_schema.py carries a schema_validated flag introduced by GE-112 (see that file's DECISION HISTORY, ~lines 29-37, and the manual-validation fallback at ~line 623). Derive the degraded-but-ran state FROM that existing flag rather than adding a parallel indicator — two flags meaning the same thing is precisely how the GE-112 defect arose."
  - "The non-authoritative label must appear on the FINAL reader-facing line, not only in a mid-run warning that scrolls past. The criterion is that a reader who sees only the last line can tell the two runs apart."
  - "The label must appear even when the reduced instrument found NOTHING at all to report. An empty-findings degraded run is the most dangerous of the three states because it renders identically to a real pass; it must not print the same closing line."
  - "Generalise, do not special-case: the third state belongs in the shared vocabulary so any check with an authoritative/reduced pair inherits it. A change confined to check_ac_schema.py would be the fourth point patch in this area (GE-112, GE-118a-1, GE-118b were the first three)."
  - "ADR-001 deployed/template parity: edit templates/scripts/commit_guardian/ then run 'python scripts/build.py --target-dir .'; scripts/commit_guardian/ and .leafcutter/scripts/commit_guardian/ must match (check_hook_parity enforces). Any new shared module must also be added to deploy_map in scripts/build_phases.py or the hook raises ModuleNotFoundError at runtime."
test_spec:
  - name: test_ge119a1ii_degraded_clean_result_labelled_not_authoritative
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Authoritative inspection genuinely unavailable, reduced substitute finds nothing: the clean finding is labelled as reduced and not authoritative, and names the inspection that did not happen."
  - name: test_ge119a1ii_degraded_and_authoritative_results_are_distinguishable
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Same staged files run twice, once with and once without the authoritative inspection: the two result values differ."
  - name: test_ge119a1ii_label_present_when_reduced_run_reports_nothing
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "A degraded run with zero findings still carries the non-authoritative label."
  - name: test_ge119a1ii_final_line_alone_distinguishes_the_two_runs
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Comparing only the closing line of each run is sufficient to tell degraded from authoritative."
test_rationale: "Both runs exit 0, so exit-code assertions cannot separate them; the whole criterion is that the RESULT VALUE and the closing line differ. And the unavailability must be real path unavailability from a second working copy — monkey-patching the loader in-process exercises a different condition from the observed path-resolution failure, and would pass on code that still degrades silently when the file is genuinely unreachable."
