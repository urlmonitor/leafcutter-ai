notes: |
  TWO FAILURES IN ONE MECHANISM, POINTING IN OPPOSITE DIRECTIONS. Both come from
  the same per-file comparison and each is invisible from the other's scenarios.

  FAILURE ONE — THE REFACTOR PUNISHED. A test that already carries a declaration
  moves from one file to another. The destination file's count rises by nothing if
  the test is declared, but a move of an UNDECLARED test raises the destination's
  count while lowering the source's. Under a naive per-file rule the move is
  refused although the project as a whole is unchanged. The consequence is worse
  than an inconvenience: it makes the cheapest response "leave the tests where they
  are", which is the opposite of what the project wants, and it teaches people that
  the gate punishes tidying.

  FAILURE TWO — THE NEW FILE AS A LOOPHOLE, AND THIS IS THE LOAD-BEARING HALF. A
  file that did not exist at the previous version has no previous count. Treated as
  "out of scope because there is nothing to compare against", every new test file
  may be created wholly undeclared forever, and the standard governs only edits to
  files that already existed. That is not a ratchet, it is an opt-out, and it is
  the single most likely way for this tree to ship looking correct while achieving
  nothing. The correct treatment is that a new file is judged on its contents —
  the obligation on new work does not need a previous version to compare against,
  only the count does.

  THE TWO ARE NOT SYMMETRICAL AND MUST NOT BE SOLVED BY ONE RULE. Loosening enough
  to fix the first opens the second. Decomposition must produce a treatment where
  the identity of the tests matters, not only the arithmetic of the counts — the
  question is whether a given undeclared test is NEW to the project, not whether a
  given file's number went up.

  MANDATORY NEGATIVE ARM. Every positive reading is satisfied by a rule that
  permits everything. The two arms that prove this record is live, and they must be
  asserted together with the positive cases in the same run:
    - A brand-new file containing an undeclared test is REFUSED.
    - An existing undeclared test moved verbatim from one file to another is
      ALLOWED, with no declaration added.
  A decomposition that produces only the second is the loophole with a test
  certifying it.

  WATCH THE INTERACTION WITH RECOGNITION. Whether two functions in different files
  are "the same test" depends on how tests are identified, and the declaration
  recogniser is being made uniform under TQ-100b-5. Consume that answer rather than
  inventing a second notion of test identity here.
