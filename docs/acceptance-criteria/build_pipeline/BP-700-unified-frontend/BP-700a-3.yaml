roadmap_phase: phase_1
criteria: |
  Given a project has a PROJECT_CONTEXT.md file for the frontend agent
    containing a design_system key with values:
    - primary_colour: "#1E40AF"
    - font_heading: "Roboto Slab"
    - font_body: "Roboto"
  When the unified frontend agent is dispatched for a ticket
  Then the agent uses "#1E40AF" as the primary colour (not the embedded default)
  And the agent uses "Roboto Slab" for headings (not the embedded suggestion)
  And the agent applies the embedded principles only for aspects not specified
    by the project design system (e.g. negative space, interactive states)
