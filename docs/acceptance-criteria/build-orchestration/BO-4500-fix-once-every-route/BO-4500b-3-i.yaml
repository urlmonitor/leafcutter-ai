created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500b-3.yaml"
criteria: |
  Given the COMMIT-ANSWER block's decision is given, in turn, each of these commit agent replies:
    (a) the paragraph "Committed successfully, all good." and nothing else;
    (b) an object {status: ok} with no commit_answer key;
    (c) an object whose commit_answer is the string "committed";
    (d) an empty reply;
    (e) an envelope with status ok whose commit_answer.status is hook_failed;
    (f) an envelope with status blocker whose commit_answer.status is committed,
  When the decision is taken for each,
  Then every one of them is report, and none is continue, retry or engage,
  And the report quotes what was received, bounded to 2 KB,
  And for (e) and (f) the report names both the envelope status and the commit_answer status.
depends_on: [BO-4500b-3]
