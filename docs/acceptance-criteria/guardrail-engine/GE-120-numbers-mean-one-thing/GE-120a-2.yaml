id: GE-120a-2
title: "One work item cannot exist as two copies free to disagree about its state"
component: guardrail-engine
components:
  - commit_guardian
  - ticket_lifecycle
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the work-item collection holds the identifier "TICKET-20260629-BP-1200a-1-ii" as a file
    in the intake lifecycle folder AND as a file in the active lifecycle folder,
  And it holds "TICKET-20260603-ConfigDrivenBuildPaths" as a file in the intake folder AND as a
    file in the completed folder,
  And the two copies of that second identifier declare different lifecycle states in their own
    content,
  When the uniqueness pass runs over the whole work-item collection,
  Then it terminates with a failing result,
  And it reports one finding per contested identifier, naming every lifecycle folder that holds
    a copy of it,
  And for the identifier whose two copies declare different lifecycle states, the finding also
    states both declared states, so the reader can see which copy is stale without opening
    either file,
  And an identifier held in exactly one lifecycle folder produces no finding, whichever folder
    that is,
  And the pass states how many work-item identifiers it inspected.

  Coverage note: covered only by a test that executes the pass over a real on-disk work-item
  collection containing the two-folder condition and asserts on the result value, the folders
  named, and the declared states reported. Asserting that a comparison helper exists does not
  cover it.
depends_on:
