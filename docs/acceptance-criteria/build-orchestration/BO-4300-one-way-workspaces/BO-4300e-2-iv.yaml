test_spec:
- name: test_shell_inside_workspace_refuses_naming_pid_and_program
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: reachability
  description: "Runs the real maker CLI as a subprocess (remove --path, with --delete-remote-branch). Two ready clean workspaces; a real child program has its current folder at ticket/alpha itself (no file open), another has it in the sub-folder docs of ticket/beta. Each remove is refused PROCESS_HOLDS_FILES (exit 2), the holders list carries that child's pid and program name, the message says it is working inside the workspace, and neither command line nor environment appears. CI needs no root: the holder is a real child python process the test starts itself as the same user (subprocess.Popen with cwd set, stdin/stdout to DEVNULL, a ready-flag file written after the child checks os.getcwd(), no sleep-and-hope); the system reads a same-user process's current folder without elevated rights on Linux and Windows, and the cleanup kills the child before the temp folder is deleted (it locks the folder on Windows). Uses WorkspaceCase from test_bo_4300e_2.py."
  proves_clause: "each request is refused, and the refusal names the running shell by its process identifier and program name and states that it is working inside the workspace"
  code_file: templates/scripts/worktree_remove.py
- name: test_refused_workspaces_are_identical_before_and_after
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: discrimination
  description: "Same fixture; snapshot each workspace with with_git=True (repository, .leafcutter/workspace.json record, every file) before and after the refused request and require equality. This is the observed-defect guard: the old code deleted the repository before refusing."
  proves_clause: "for each workspace its repository, its workspace record and every one of its files are identical before and after the refused request"
  code_file: templates/scripts/worktree_remove.py
  must_catch:
  - "a maker that runs the holder check after the repository or folder deletion has begun"
  - "a maker that counts only programs with an open file and so lets a current-folder-only holder through to deletion"
  - "a maker that terminates the holding shell instead of refusing"
- name: test_refused_clearing_sends_no_fetch_push_or_deletion_to_the_shared_project
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: "Same fixture, both requests carry --delete-remote-branch and the workspace line is pushed to the hub first. Compare hub refs (for-each-ref on the bare hub) before and after both refusals, and the workspace .git digest (FETCH_HEAD, remote-tracking refs) so a fetch would show too."
  proves_clause: "no fetch, push or deletion reached the shared project for either workspace"
  code_file: templates/scripts/worktree_remove.py
  must_catch:
  - "a maker that deletes the hub branch before the holder check refuses"
- name: test_clearing_alpha_again_after_the_shells_exit_is_cleared
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: "After both child programs are killed and waited for, remove of ticket/alpha is answered ok and nothing remains at its location (os.path.lexists is false). Proves the refusal left a clearable workspace and no stale lock."
  proves_clause: "after both shells have exited, clearing \"ticket/alpha\" again is answered cleared and nothing of it remains at its location"
  code_file: templates/scripts/worktree_remove.py
- name: test_unavailable_program_check_refuses_instead_of_carrying_on
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: discrimination
  description: "Copies the deployed maker folder into a temp folder (deployed_maker_path(override=copy) is the existing seam that materialises sibling modules) and runs the copy as a real subprocess three ways: worktree/sweep_processes.py deleted, replaced by a file that raises on import, replaced by one whose sweep() raises. Each remove is refused with a message stating the program check is unavailable (not answered ok, not NOT_FOUND). No real holder is needed, so this is root-free on both platforms."
  proves_clause: "the request is refused, and the refusal states that the program check is unavailable"
  code_file: templates/scripts/worktree_remove.py
  must_catch:
  - "a maker that logs a warning and carries on when the sweep module is missing"
  - "a maker that treats a load error of the sweep module as no holders"
  - "a maker that lets an exception from sweep() become an empty holder list"
- name: test_unavailable_check_leaves_gamma_identical
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: "Same three broken-check variants against a clean ticket/gamma; snapshot with_git=True before and after each refused request and require equality."
  proves_clause: "the repository, the workspace record and every one of the files of \"ticket/gamma\" are identical before and after the refused request"
  code_file: templates/scripts/worktree_remove.py
- name: test_unavailable_check_sends_nothing_to_the_shared_project
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: "Same three variants with --delete-remote-branch and gamma's line pushed; hub refs and the workspace .git digest are unchanged after each refusal."
  proves_clause: "no fetch, push or deletion reached the shared project for \"ticket/gamma\""
  code_file: templates/scripts/worktree_remove.py
- name: test_current_folder_match_is_by_resolved_path_not_name_prefix
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: "Real child with its current folder in a sibling folder whose name only shares the workspace's name prefix (ticket/alpha2 beside ticket/alpha) does not block clearing of ticket/alpha, while one in ticket/alpha/docs does. Exercises the sweep's current-folder test (today a substring test on the resolved path). CI needs no root: the holder is a real child python process the test starts itself as the same user (subprocess.Popen with cwd set, stdin/stdout to DEVNULL, a ready-flag file written after the child checks os.getcwd(), no sleep-and-hope); the system reads a same-user process's current folder without elevated rights on Linux and Windows, and the cleanup kills the child before the temp folder is deleted (it locks the folder on Windows). "
  proves_clause: "each request is refused, and the refusal names the running shell by its process identifier and program name and states that it is working inside the workspace"
  code_file: scripts/worktree/sweep_processes.py
  must_catch:
  - "a sweep that matches the workspace path as a plain substring of the current folder so a name-prefix sibling blocks clearing"
