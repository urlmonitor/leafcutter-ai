test_rationale: >-
  A documentation page is the easiest artifact in this tree to satisfy falsely, because
  every naive observation of one is a search for text it contains, and a search passes on a
  page that is complete about a world that has moved. Both halves of this record are
  derivable from something runnable, so CLAUDE.md's gate-and-workflow rule applies with full
  force: the refusal set is derivable from the shared refusal path, and whether a remedy
  works is decided by the project's own checks. Hence the two irreplaceable arms are a
  both-directions correspondence taken from the means at run time, and an execution of each
  documented remedy through INF-1300a-1's real-hook harness. The published-command arm is
  separate and is not redundant with INF-1300b-4's: this page is a THIRD surface with its own
  audience, and the measured precedent for the failure — a verification command published
  with --files against a script defining --file, unnoticed for months — is exactly what a
  reading test cannot see. The reason-added descriptor exists because a bijection asserted
  once is a claim about today; only reddening on a new reason makes it a contract.
