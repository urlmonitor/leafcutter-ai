it_requirements:
  - "NO SHIPPED SURFACE CARRIES A LOG DESTINATION OF ITS OWN. Every --jsonl, --log or --feedback argument naming debugging/logs/<file> as a workspace-relative path, and every 'append to debugging/logs/...' instruction, must be removed: writers and readers now default to the declared location (INF-500d-4-iv, -v). Where an instruction genuinely needs to state or show the location, it must obtain it from INF-500d-4-iii's location query and must not restate a path. This is INF-400c-4-i's rule for the knowledge surfaces, applied to feedback and telemetry."
  - "The signoff skill's id-capture contract is unchanged: the feedback id is read from stdout, and the sidecar recovery grep 'sidecar:[^ ]*feedback_id_[0-9]*.txt' still applies. INF-500d-4-ii's sink line stays on stderr. Callers that redirect stderr to a file keep doing so."
  - "Telemetry calls in building-epics and the supervisors keep their trailing '|| true'. Telemetry stays best-effort (BP-400a-1-i)."
  - "Reader-facing instructions (feedback-report workflow, feedback-analyst, feedback-review, feedback-analysis, retrospective-agent) must tell the agent to rely on the reader's stated sink and record count (INF-500d-4-v), not to open a hard-coded path."
  - "DO NOT LAND BEFORE INF-500d-4-iv AND INF-500d-4-v. Removing the overrides first sends writes to the old __file__-derived default, which is a third location."
  - "Apply the Prompt-Quality Checklist. Bash snippets stay single-command per the shell convention."
  - "Deployed/template parity (ADR-001): edit the templates and verify the deployed copies through the build round-trip."
test_spec:
  - name: test_no_deployed_surface_names_a_workspace_relative_log_destination
    target_dir: unit_tests/feedback/
    framework: pytest
    type: behavioral
    angle: deployed
    surface_invoked: "the deployed agents, skills, workflows and commands in the shared reference layout"
    description: "Using the shared_reference_layout fixture (reader), scan every deployed agent, skill, workflow and command file. Fail on any --jsonl/--log/--feedback argument, or append instruction, whose value is a relative debugging/logs/<file> path, naming each offending file and line. Also report how many surfaces were inspected and fail if that count is zero."
    must_catch:
      - "ticket-supervisor.md's current --jsonl debugging/logs/feedback.jsonl"
      - "a scan that inspects zero files and reports clean"
  - name: test_signoff_id_capture_contract_survives_the_prompt_change
    target_dir: unit_tests/feedback/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "Execute the deployed signoff skill's submit invocation exactly as written (no --jsonl) against a temp layout with a declaration. Assert the id is read from stdout, the sidecar grep finds exactly one match, and the record is in the declared feedback_sink."
test_rationale: "These are prompt surfaces an LLM follows, so the strongest executable proof is to scan what actually ships, which is the deployed copies and not the templates, and to execute the one invocation whose output a caller parses. The scan reports its inspected-surface count and fails on zero, because a scanner that finds nothing to inspect reports perfect agreement. That failure mode is the one INF-400c-4 built its parity check to reject."
delivers_to: null
expects_from:
  - ac_id: INF-500d-4-iv
    contract: "submit_feedback.py and emit_event.py defaults that resolve to the declared absolute sinks, so an invocation without --jsonl or --log is durable."
  - ac_id: INF-500d-4-v
    contract: "Readers whose default is the declared sink and which print the absolute sink read and the record count on stderr."
