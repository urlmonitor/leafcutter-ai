id: GE-128a-3
title: "A file whose undeclared count goes down is allowed, judged against its own previous count and not a target"
component: guardrail-engine
components:
  - commit_guardian
  - testing_quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Scenario 1 - declaring one existing test lowers the count: allowed
  Given a tracked test file that, before the change, holds 40 test functions of
    which 40 declare no requirement,
  And the test-declaration check is in error mode,
  And a change is staged that adds a declaration to one of those tests and
    changes nothing else, leaving 39 undeclared,
  When the author performs an ordinary commit,
  Then the commit completes,
  And the file is not refused for the 39 undeclared tests it still holds.

  Scenario 2 - a declared test added alongside the backlog: allowed
  Given the same 40-function, 40-undeclared file as it stood before the change,
  And the test-declaration check is in error mode,
  And a change is staged that adds one new test function that declares the
    requirement it proves, leaving the undeclared count at 40,
  When the author performs an ordinary commit,
  Then the commit completes.

  Scenario 3 - removing an undeclared test lowers the count: allowed
  Given the same file as it stood before the change,
  And the test-declaration check is in error mode,
  And a change is staged that deletes one undeclared test function, leaving 39,
  When the author performs an ordinary commit,
  Then the commit completes.

  Scenario 4 - no target is applied
  Given any of the three changes above,
  When the check reaches its verdict,
  Then the verdict depends only on the file's undeclared count before and after
    the change,
  And no project-wide or per-file maximum, percentage or goal for undeclared
    tests is consulted.
depends_on:
