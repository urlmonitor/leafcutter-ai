    description: "Parse skills_invoked in agent_registry.json and assert find-structural-smells invokes exactly {review-for-code-smells, review-for-structural-code-smells} and find-design-smells exactly {review-for-code-smells, review-for-design-code-smells} — no third skill."
    covers:
      - CR-100f-2
