notes: |
  Boundary with BO-2400c-1-iv (done). That criterion asserts the PROPERTY — the prefix
  presented to each of a run's successive dispatches is byte-identical — and requires
  drift to be surfaced at the moment it happens. This criterion is about the RECORD: after
  the drive is over, its own terminal payload states whether the anchor held and across
  how many invocations, unconditionally, on drives where it held as well as drives where
  it did not. A surfaced warning proves nothing about a drive nobody was watching; a
  recorded count is what backs the parent L1's cost claim with evidence instead of hope.
  The two share a fingerprint helper deliberately, so the property and the statement about
  it cannot disagree.

  Why the lane's own terminal payload and not the telemetry sink. BO-2400d's per-invocation
  telemetry record (BO-2400d-1, done) is written by scripts/agent-health/agent_telemetry.py,
  and the only production caller of that emit path is templates/workflows-js/fast-lane-build.js
  — the orphaned runner that BO-2400c-1-v deletes. The LIVE lane, fast-lane-ship.js, contains
  the string "telemetry" exactly zero times. So "add it to the existing run record" resolves,
  today, to the record the live lane actually produces: the terminal payload it already
  returns (target_ac, ac_ids, tests_written, files_modified, changelog_entry_path). This is
  an addition to that record, not a parallel one. It is deliberately NOT folded into BO-2800,
  which is about gate value rather than context reuse.

  A drive that made only one context-carrying invocation reports an invocation count of one
  and a shared count of one. That is honest — one invocation trivially shares its own prefix
  — and a reader can tell it apart from a two-invocation drive by the count itself, which is
  why the count is reported rather than a bare boolean.
