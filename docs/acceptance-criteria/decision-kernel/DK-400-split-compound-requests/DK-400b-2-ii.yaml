id: DK-400b-2-ii
title: "A research request with several needs raised partway through a run is split as a research request"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a research request raised at work-item depth 1 below the run's root, holding three
    needs: "Find which runs staged a decision record last week, which of those records were
    published, and who approved each one.",
  When the run reaches that research request,
  Then a split is started for it with subject kind research_request, found mid-run, work-item
    depth 1 and no routing trigger,
  And every part offered at the split gate names research as the capability that will run it,
  And the research request does not run as one research step while its split is proposed and
    unanswered.
depends_on:
  - DK-400b-2
  - DK-400b-1
