notes: |
  FIELD EVIDENCE — run wf_0e0872f9-453, 2026-09-14, Windows 11, the same run as BO-3900.
  The resolve-target agent correctly reported
  worktree_path: C:\Users\Hendrik\Code\leafcutter\worktrees\uxp-700-tranche-2, because the
  run was already inside a worktree. The next worktree-setup agent was handed only the epic
  FOLDER as its target, with a prompt that left the new worktree's location open
  ("git worktree add <path> ..."). It ran git worktree add AT the epic folder path,
  ...\uxp-700-tranche-2\tickets\00_inbox\epics\EPIC-TruthfulProjectRecord, on a local
  branch epic/truthful-project-record that was 47 commits behind main. The nested checkout
  shadowed all 46 tracked ticket files, which the outer worktree then showed as deleted.
  The resolved worktree path was discarded and replaced by the nested one.

  NAMED MUTATIONS (each must turn at least one test red):
    M1 — keep the location to the agent's judgement (the prompt names no exact path).
         Caught by test_new_worktree_location_is_named_by_the_workflow_and_is_a_child_of_the_base.
    M2 — always open a new worktree, even when one was resolved for the target. Caught by
         test_run_inside_the_resolved_worktree_dispatches_no_worktree_creation.
    M3 — reuse any resolved path without checking it is a linked worktree's top-level.
         The KI-BO-027 epic-folder value would be reused. Caught by
         test_resolved_path_that_is_not_a_worktree_top_level_is_not_reused.
    M4 — derive the location as <target folder> or <current directory>/<slug>. Caught by
         test_new_worktree_location_is_never_under_the_target_or_any_checkout.
    M5 — decide containment with a forward-slash-only prefix test. A backslash-spelled
         location under a forward-slash-spelled checkout is judged outside it. Caught by
         the Windows-spelled layout in the same boundary test (the BO-3900 dependency).

  THE THREE L3s cover the axes whose mutations leave every test above green: a
  worktree step that reports a location other than the one it was told (BO-4000a), a
  stale local branch (BO-4000b), and a run started inside an unrelated worktree or aimed
  at an occupied location (BO-4000c).

  DECIDED 2026-09-14 (user, Q1): consumer-layout placement stays out of scope. The "never under the main checkout" clause applies to the dev layout only.

  CONSUMER LAYOUT — background to that decision. The user asked that a new worktree
  never be created "inside the repository tree". In the dev layout the worktree base is a
  sibling of the repository, and this record states that outright. In the consumer layout
  documented in agent_delivery_workflows.md section 9 (BO-1500e-2), the base is
  <consumer_root>/worktrees. That is under the consumer checkout's top-level directory.
  This record therefore scopes the "never under the main checkout" clause to the dev
  layout, and keeps the universal clauses (never at or under the target folder, never at
  or under any linked worktree). If the user wants the consumer layout moved outside the
  consumer repository too, that is a change to BO-1500e-2's convention and needs its own
  record. This one should not quietly contradict it.

  KI-BO-027 is referenced, not claimed closed. The second scenario covers what the build
  workflow does with a bad resolution. Whether the resolver itself stops producing one is
  still KI-BO-027's.
