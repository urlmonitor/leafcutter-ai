  - docs
risk_surface: contract_boundary
test_required: true
test_rationale: |
  The read-in-isolation clause is the whole point and it cannot be tested through any interface
  that has already resolved the artifact's location - the test has to load the file's own
  content and assert the declaration is in it. The disagreement clause needs a separate
  negative fixture, because a declaration nothing cross-checks is a second hand-maintained
  field, which is the drift surface UXP-700c and UXP-514-6 exist to close.
test_spec:
  - name: test_example_artifact_declares_its_example_product_in_its_own_content
    target_dir: unit_tests/product_truth/
    description: "Loading an example artifact's file content alone reveals the product it belongs to and that the product is an example."
    type: unit
    angle: real_artifact
    framework: unittest
  - name: test_project_owned_artifact_carries_no_example_declaration
    target_dir: unit_tests/product_truth/
    description: "A project-owned artifact read the same way carries no example declaration."
    type: unit
    angle: boundary
    framework: unittest
  - name: test_declaration_disagreeing_with_the_product_root_is_reported
    target_dir: unit_tests/product_truth/
    description: "An artifact declaring the example product while living under the project's root is reported naming both values."
    type: integration
    angle: failure
    framework: unittest
notes: |
  The complaint in the L1 is that the example criteria are "indistinguishable, field for field,
  from genuine work". This AC is the field that makes them distinguishable, and the last clause
  is what stops it becoming a fourteenth hand-written summary: it is cross-checked against the
  location, so the two cannot silently disagree.

  The flow schema already carries a source field with values real and mock, and index.json
  records source: mock for the fern-and-fig artifacts. The IT PO should establish whether that
  existing axis can carry this meaning before minting a second field - but note it is currently
  absent from the acceptance-criteria store entirely, which is the half of the problem that
  matters most here.
target_epic: EPIC-WhatYourProjectSaysAboutItselfIsTrue,And
