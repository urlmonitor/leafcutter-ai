      2026-10-09.)
test_spec:
  - name: test_tq600a_13_x_the_status_is_reported_under_one_name
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: seam
    surface_invoked: "the shared workflow-step executor locating the job in .github/workflows/post-merge-hold.yml by the exact name `Post-merge hold evaluation` and executing it with one synthetic event against the recording fake server acting as the App token and check-run endpoints"
    must_catch:
      - "the App's check run is created under a different name or case"
      - "the evaluation job still carries the name `Post-merge suite status`, so the Actions-sourced check shares the required name"
      - "the job gains a matrix"
      - "the job gains a job-level `if:` or a `needs:`, so the evaluation can be skipped"
    description: >-
      The executor finds exactly one job named `Post-merge hold evaluation`, no job named
      `Post-merge suite status`, and executes it to a verdict; the fake records exactly one
      check-run create named `Post-merge suite status` authorised by the App token; it
      refuses a matrix; the test fails if the executor reports a job-level condition or a
      dependency for this job. Covers the NAME half only; the every-pull-request and
      creating-app halves are recorded live observations.
  - name: test_tq600a_13_x_enforcement_is_claimed_only_from_an_observed_ruleset
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: discrimination
    surface_invoked: "scripts/ci/post_merge_hold.py's enforcement-state reader, in-process, on response bodies shaped like the real branch-rules response"
    must_catch:
      - "the family is closed as protecting main with the ruleset never read"
      - "a near-miss context ('post-merge suite status', a trailing space, a suffix) is accepted"
      - "the context is accepted with source 'any' rather than the hold App's integration id"
      - "the context pinned to GitHub Actions (15368) is accepted as enforced — the spoofable source this amendment exists to retire"
      - "an empty, malformed or unreadable response is reported as enforced"
    description: >-
      The six-context response: advisory. With `Post-merge suite status` pinned to the
      hold App (5249547) added: enforced. The same context pinned to 15368: advisory,
      reason names the spoofable source. Each near-miss, an unpinned entry, an empty list
      and a malformed body: advisory with a reason.
  - name: test_tq600a_13_x_not_reproduced_reds_are_counted_from_run_history
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: criterion
    surface_invoked: "scripts/ci/post_merge_notice.py's demotion counter, in-process, on served run histories"
    must_catch:
      - "a red followed by a green on a DIFFERENT commit is counted as not reproduced"
      - "superseded cancellations are counted as reds"
    description: >-
      History: red at X then green at X (counted); red at X then green at Y (not
      counted); a superseded cancellation (ignored). The count over 14 days is as stated.
  - name: test_tq600a_13_x_thresholds_come_from_the_tunables_file
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: discrimination
    surface_invoked: "scripts/ci/post_merge_notice.py's demotion counter and post_merge_hold.py's staleness bound, in-process, each given a scratch copy of scripts/ci/post_merge_tunables.json"
    must_catch:
      - "a threshold is a literal in code, so changing the config file changes nothing"
      - "a missing or malformed tunables file silently falls back to a built-in default"
    description: >-
      With `demotion_later_count` 3, two not-reproduced reds do not demote; with it set to
      2 in the scratch file, they do. With `staleness_hours` 30 a 31 h run is stale; set
      to 32, it passes. A missing file and a malformed file each fail closed naming the
      file. The real committed file parses and carries exactly the accepted defaults.
test_rationale: |
  Most of this record is not provable by a unit test, because the property lives in the
  hosting service's configuration. That is why it is separate: it is the one place in
  the family whose done-proof is a list of recorded live observations, and the
  2026-11-02 event-policy change makes one of those observations a hard deadline rather
  than a formality. The name, the enforcement reader and the demotion counter are cheaply
  testable and stay tests.
