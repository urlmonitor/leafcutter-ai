id: DK-400e-3
title: "An earlier part's result reaches later parts as evidence whose fit is still judged"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the split-bounds split where p2 waits for p1,
  And p1's decision was approved as "Two to five sub-questions per split",
  When p2's decision checks for precedent,
  Then p1's record is offered to p2 as an earlier decision, with its approver and date,
  And Jev judges how well p1's record applies to p2's question before it is used,
  And p2's record names p1's record among the precedents it considered, with the action that
    judgment led to,
  And p1's answer never becomes p2's answer without the person approving p2's choice,
  And a part that runs after p1 without waiting for it is also offered p1's record as an earlier
    decision.
depends_on:
  - DK-400e
  - DK-400e-1
  - DK-400e-2
