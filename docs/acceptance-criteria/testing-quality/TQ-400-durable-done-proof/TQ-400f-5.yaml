test_spec:
  - name: test_tq_400f_5_all_finished_underneath_parent_is_listed_as_ready_to_close
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      Subprocess run over a store holding a NOT-done parent every one of whose
      descendants at every depth is finished. The run's report names that parent as
      ready to close and states that every descendant beneath it is finished. Modelled
      on BP-1100f (eleven finished descendants, parent still todo), so the fixture has
      real depth rather than one child.
  - name: test_tq_400f_5_ready_to_close_parent_is_not_promoted_under_apply
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      THE NEGATIVE, AND IT MUST STAY NEGATIVE. sha256 of the ready-to-close parent's
      raw bytes before and after the run with apply ENABLED; equal. Then re-read the
      record in a fresh process: work_status is still not-done. A descriptor asserting
      only that the report lists it is satisfied by an implementation that promotes
      AND reports — this entry is what forbids that, and it must be run with apply on,
      because a refusal that holds only in preview is the defect.
  - name: test_tq_400f_5_the_same_run_demonstrably_wrote_to_a_different_record
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      THE POSITIVE CONTROL, SAME INVOCATION. In the run whose hashes the previous
      entry compares, the second parent (done, one unfinished grandchild) IS written to
      — work_status and demotion_reason changed on disk. Without this, the byte-identity
      assertion above is satisfied by a crashed run, a disabled write path and a run
      never invoked, and the refusal is proven by nothing.
  - name: test_tq_400f_5_three_consecutive_runs_never_accumulate_into_a_finished_badge
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      Run the sweep three consecutive times over the unchanged store with apply
      enabled. The ready-to-close parent is byte-identical after each run, is listed as
      ready to close each time, and its work_status is unchanged after the third. This
      guards the specific erosion the L1 names: promoting on the second or third
      sighting on the theory that a repeatedly confirmed result is safe to act on.
  - name: test_tq_400f_5_whole_store_changed_file_set_excludes_every_ready_to_close_id
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      Hash EVERY file in the fixture store before and after the run and compute the
      changed-file set. It must equal exactly the demotion targets, and must contain no
      ready-to-close parent. Separately assert the report's ready-to-close list and the
      inventory's ready-to-close entries are the same set of ac_ids — one derivation,
      not two. The whole-store assertion catches a promotion written by ANY code path,
      including one the report never mentions.
test_rationale: >-
  The naive test asserts the report lists the parent as ready to close. It is
  satisfied perfectly by an implementation that promotes the parent AND reports it —
  which is not a far-fetched failure but the most likely one, because "a parent should
  not read unfinished when everything beneath it is done" reads to any implementer as
  an instruction to fix it, and the L1 refuses exactly that. So the negative has to be
  observable on disk, under apply rather than in preview, in a run that provably wrote
  to something else. It also has to be a WHOLE-STORE changed-file assertion rather
  than a work_status check on the one record the test happens to look at: a promotion
  written by an unnamed code path, or applied to a sibling of the fixture, passes a
  single-field assertion and fails a changed-file-set assertion. The three-run entry
  exists because the refusal a determined implementer erodes first is not "never
  promote" but "never promote on the FIRST sighting"; and the hash is over raw bytes
  because a load-and-dump round trip preserves every value while rewriting every file.
change_target: code
risk_surface: contract_boundary
notes: |
  THIS IS THE HALF THAT IS EASIEST TO BUILD BACKWARDS. The obvious reading of "a
  parent should not read unfinished when everything beneath it is done" is to mark
  it finished. That is refused. It manufactures a claim on the single field the
  entire phantom-done edifice rests on, from arithmetic that says nothing about
  whether the parent's own behaviour works end to end. An implementation that
  closes this AC by promoting has inverted it, and the byte-identity clause is what
  makes that failure detectable rather than a matter of opinion.

  The direction of the asymmetry is what makes it safe. A bug in the demotion half
  costs a false alarm; a bug in a promotion half would cost a false pass, silently,
  on exactly the records nobody re-checks. So the sweep is allowed to reduce a
  claim and never to make one.

  Measured case this exists for: BP-1100f on 2026-08-31 — all eleven descendants
  finished, the parent still unfinished, verified directly. Under-claiming is a real
  and current defect in the plan people read from, and it deserves to be surfaced;
  it just does not deserve to be surfaced by a script writing the badge.

  The re-run clause is here rather than left to the general idempotency rule because
  the specific failure it guards is different: not a duplicated reason, but a
  promotion that a determined implementer might apply on the second or third
  sighting of the same ready-to-close parent, on the theory that a repeatedly
  confirmed result is safe to act on. It is not.
