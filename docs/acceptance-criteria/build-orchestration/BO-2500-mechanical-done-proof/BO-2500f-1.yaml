id: BO-2500f-1
components:
  - build_orchestration
  - ac_store
title: "A test-free record names how it is verified in a typed record, refused when incomplete"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a requirement record with test_required false,
  When the record is marked done, at any layer that decides done (the mark
    command, the commit-time done check, the CI checks),
  Then its verification record must state exactly one method, check or
    inspection, and any other method value is refused, naming the value,
  And a check record must name the check that verifies the requirement and how
    that check runs in everyday work, either as a named commit-time hook or as a
    named build phase, and is refused when either is missing,
  And an inspection record must reference the workflow run whose interactive gate
    recorded the person's approval of the review, a statement of what the review
    confirmed, and every inspected file each paired with the content fingerprint
    of the exact version inspected, and is refused when any of these is missing or
    the file list is empty,
  And a verification record that carries a part belonging to the other method (a gate
    run reference on a check, a hook on an inspection) is refused, naming that part,
  And a record with no verification record at all is refused, naming the missing
    record,
  And each refusal names the record id and the missing or wrong part,
  And a verification record on a record whose test_required is true or absent
    never waives the test that record owes, and is reported as misplaced,
  And the stated reason required by BO-2500a-8-i is still required; the
    verification record is added to it, not substituted for it,
  And none of these refusals is made when a record is checked without being marked
    done: the check of an unfinished record with a missing, incomplete or invalid
    verification record passes, so the roughly 170 unfinished test-free records
    remain editable before they have a verification record.
depends_on: [BO-2500f, BO-2500a-8-i]
doc_links:
  - path: config/ac_store_schema.json
    relationship: constrains
    status: exists
    relevance: "Declares the verification record's fields so the store accepts them. Validity is NOT enforced by a write-time if/then rule here (user decision 2026-10-25); it is decided at mark time."
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-076-verification-methods-for-non-test-requirements.md
    relationship: describes
    status: exists
    relevance: 'The decision this record implements: wave 1 (section 1) or wave 2 (section 2)
      of the verification-method rule.'
assigned_agent: python-coder
estimated_complexity: M
declared_files:
  - path: scripts/ac_store/_verification_record.py
    state: to_be_created
  - path: config/ac_store_schema.json
