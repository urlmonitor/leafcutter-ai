id: DK-300a-2
title: "Python declaration cards explain identity without importing implementation"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given a current permitted index of a Python function, class and method with authored declarations,
  When a request resolves their qualified references,
  Then each card contains its fully qualified identity and a bounded declaration signature,
  And its optional purpose comes only from the first authored docstring sentence,
  And a declaration without a docstring has no invented purpose,
  And no implementation body, callers, relation expansion or repository code execution is used to supply the card.
