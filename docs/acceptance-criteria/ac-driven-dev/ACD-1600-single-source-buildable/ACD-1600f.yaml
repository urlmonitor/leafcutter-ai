criteria: |
  No contradictions between a requirement and the examples it points to.

  When a requirement points at supporting material -- example data, fixtures,
  reference artifacts -- that material is consistent with what the requirement
  specifies. A contradiction between the two is caught automatically before the
  work reaches a builder, so an agent is never handed a spec that disagrees with
  its own examples.
