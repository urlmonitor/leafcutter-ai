notes: |
  CONSOLIDATION (2026-08-13, expert review). This AC replaces four separate reference-doc
  ACs — ACS-1100a-4, ACS-1100b-3, ACS-1100c-3 and ACS-1100d-3 — which all wrote sections
  of docs/reference/ac-schema.md. The build's file-touch parallelism gate would have
  serialised them into four sequential tickets editing one file, and they made up a third
  of the tree's leaves. One file, one agent, one ticket.

  ACS-1100d-4 (component diagram) is deliberately NOT folded in: different artifact,
  different target document, different agent.

  Satisfies documentation_triggers: [reference-doc] on ACS-1100e, and is the AC named in
  the documentation_rationale on ACS-1100a, ACS-1100b and ACS-1100c.

  The closed-but-extensible list of exclusion grounds is the mechanism that stops
  "excluded because the query did not reach it" being laundered into a legitimate ground.
  "Outside the requested scope" IS on the list, and is what lets a staged-scope pre-commit
  hook report honestly rather than halting on every commit.

  The last clause is the acceptance test that matters: the section is not done if a tool
  author still has to read the AC records to build a conforming answer.

  Intended agent is documentation-expert; assigned_agent is deliberately left null in this
  authoring pass per the run's constraints, for the IT PO to set at enrichment.
