    relationship: specifies
    status: exists
  - path: docs/reference/claude-code-hooks.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Must complete in <2 seconds for repositories with up to 500 AC YAML files"
  - "Must only scan staged files, not the entire AC store, for commit-time performance"
  - "Must handle errors gracefully per the project error handling policy"
  - "Diagnostic error messages must name each dangling reference and the file that contains it"
  - "Must be idempotent — re-running on the same staged set must produce the same result"
