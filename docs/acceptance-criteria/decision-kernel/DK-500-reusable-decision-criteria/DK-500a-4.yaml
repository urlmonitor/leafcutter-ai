criteria: |
  Given the criteria mining (DK-500a-1) and the rule that a decision run never reads run history (DK-500a-2),
  When a reader opens the sequence diagram of criteria mining,
  Then it shows a person starting the mining, the mining reading the published decision records and the run history in Langfuse, candidates passing to grouping suggestions, and a person reviewing them in a kernel run,
  And it shows no message from a decision run to the run history or to the mining,
  And it marks the point at which a person's approval is required before anything is staged,
  And it shows the branch in which one source cannot be read.
