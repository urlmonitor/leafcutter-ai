it_requirements:
  - >-
    A remove request that names work which has no workspace (never made, or already cleared) gets a
    definite no-workspace answer that a caller can tell apart from a clear and that is not a failure, since
    every caller stops on any non-ok answer (workspace-maker-answer.md, caller rule 1). Decided (user
    accepted the default, Q3, 2026-11-16): status ok, exit 0, code OK, no removed_path, an additive field
    absent set to true, and a message naming the work. THIS IS A CHANGE: today remove answers such a request
    NOT_FOUND (refused, exit 2). For a name-based request that answer becomes the ok/absent answer, and any
    existing test that pins NOT_FOUND for a by-name request of missing work is updated in the same change. A --path request for a location that holds nothing keeps today's
    answer.
  - >-
    An older spelling and the current kind and short name resolve to the same single workspace (BO-4300a-2).
    Neither ever reaches a second workspace for the alias, nor the neighbouring work whose name extends it
    ("Files Stay Workable Two").
  - >-
    The no-workspace decision is read-only: it creates, writes, renames or deletes nothing, takes no lock
    that outlives the answer, and makes no network call.
  - >-
    Repeated requests are idempotent: the second and every later request for the same name change nothing
    anywhere and give the same answer.
  - >-
    Locate keeps its own NOT_FOUND answer for work with no workspace (BO-4300e-1); only remove's answer is
    added. Any new field is additive and the schema version stays.
  - >-
    File sizes: worktree_remove.py (485 lines) takes wiring only, with a net line count that does not grow;
    the logic lives beside the shared resolver of BO-4400g-1. No limit is raised.
  - >-
    PROOF RUNS THE DEPLOYED MAKER as a separate process against real temporary repositories with a real
    bare hub (unit_tests/build_orchestration/_workspace_maker_fixtures.py). No git mock, no import of a maker
    module for the asserted behaviour, no build.py spawn, and isolated HOME and git config.
test_required: true
test_intent:
  - clause: the one workspace of "Files Stay Workable" is answered cleared and no folder of it remains
    needs_test: true
    reason: An older spelling must resolve through the one identity rule to the real workspace, which a resolver that only knows current names would miss.
  - clause: the workspace of "Files Stay Workable Two" is identical before and after
    needs_test: true
    reason: A prefix match on the epic name would clear the neighbouring epic, so the neighbour must be snapshotted.
  - clause: a lookup of the epic by its current kind and short name then answers that no workspace exists for it
    needs_test: true
    reason: A clear that removed only an alias twin would leave the real workspace for the current name, which only a lookup afterwards shows.
  - clause: each request is answered with a definite statement that no workspace exists for that work, not with a failure
    needs_test: true
    reason: Flows and the landed-work pass both clear, so a repeat that answers as a failure would halt the second caller.
  - clause: every remaining workspace of the project is identical before and after
    needs_test: true
    reason: A repeat request that resolves loosely when the workspace is gone could reach another workspace, which a snapshot catches.
test_spec:
  - name: test_older_spelling_clears_the_one_workspace_of_the_epic
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      Make the epic workspace with the deployed maker's ensure --kind epic --slug EPIC-FilesStayWorkable (older
      spelling) and a second one for "Files Stay Workable Two" (its own slug). Run remove --kind epic --slug
      EPIC-FilesStayWorkable as a subprocess. Answer ok, exit 0, removed_path equals the location ensure answered,
      and no folder remains there (the helper shape of test_bo_4300e_2.WorkspaceCase, KIND overridden to epic).
    proves_clause: the one workspace of "Files Stay Workable" is answered cleared and no folder of it remains
    code_file: templates/scripts/worktree_remove.py
  - name: test_neighbouring_epic_is_identical_after_the_clear
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      Snapshot of the "Files Stay Workable Two" workspace (files with .git and refs) is identical before and after
      the older-spelling request, which cleared its own target in the same run.
    proves_clause: the workspace of "Files Stay Workable Two" is identical before and after
    code_file: templates/scripts/worktree_admin.py
  - name: test_lookup_by_current_name_answers_no_workspace_after_the_clear
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      After the clear, locate --kind epic --slug <current short name> answers NOT_FOUND (locate keeps its own
      NOT_FOUND answer, BO-4300e-1) and the landing place holds no folder for the epic under either spelling, so
      no alias twin was left behind.
    proves_clause: a lookup of the epic by its current kind and short name then answers that no workspace exists for it
    code_file: templates/scripts/worktree_admin.py
  - name: test_repeated_clear_answers_no_workspace_not_a_failure
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      Request the clear again, once by the older spelling and once by the current kind and short name. Each answer
      is status ok, exit 0, code OK, carries no removed_path, an additive field absent true and a message naming the
      work. Today the same request answers NOT_FOUND, refused, exit 2 (cmd_remove finds no record and returns
      NOT_FOUND), so this test is red until the build. A --path request for a location holding nothing keeps
      NOT_FOUND (asserted in the same test, so the old answer is not weakened).
    proves_clause: each request is answered with a definite statement that no workspace exists for that work, not with a failure
    code_file: templates/scripts/worktree_remove.py
  - name: test_repeat_requests_change_nothing_anywhere
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      Snapshot every remaining workspace of the project (files with .git, refs) plus the landing place's directory
      listing and the main checkout's refs before and after the two repeat requests: identical, and a second pair of
      repeats gives the same answers (idempotent). No file or lock is created in the landing place.
    proves_clause: every remaining workspace of the project is identical before and after
    code_file: templates/scripts/worktree_remove.py
  - name: test_repeat_clear_is_reachable_through_the_real_cli
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      main() with real argv in a subprocess: python <deployed worktree.py> remove --kind epic --slug <name>
      --repo-root <project> for work that has no workspace exits 0 with the no-workspace answer.
    proves_clause: each request is answered with a definite statement that no workspace exists for that work, not with a failure
    code_file: templates/scripts/worktree.py
