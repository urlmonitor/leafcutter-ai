risk_surface: internal
notes: |
  Satisfies GE-120b's documentation_triggers: [how-to].

  The L1 states the causal claim this AC answers: "today an author who does not already know the
  mechanism has no path to discover it, which is a large part of why the opt-out population
  exists". That is verifiable — the diagram allocator is cited only from two agent templates, two
  unit tests, a build phase and two changelogs. No how-to, no reference doc, no README mentions
  it. An author who is not an agent has no way to find it.

  QUOTING THE ACTUAL BLOCK WORDING is deliberate and is the clause most likely to be dropped as
  fussy. It is what prevents the common failure where the guide and the guard describe the same
  situation in two vocabularies and the blocked author cannot tell they are related.

  IT PO SEQUENCING NOTE (2026-08-17): this AC cannot be completed before GE-120b-1, because the
  wording it must quote does not exist until then. It can be drafted in parallel, but the quote
  has to be captured from a real run before sign-off.
