notes: |
  EDGE CASE PINNED: the two ways a resolution rule dies.

  Over-wide, and it flags description prose; the first author to hit that adds a
  suppression, and suppressions are permanent. BP-900g-4's over-permissive prefix is
  the in-repo precedent — it accepted any single leading segment and mis-normalised a
  host-project path into a deploy key, which cost BP-900g-5 an entire clause to undo.

  Under-specified, and it merges with the deployment rules into a single "unresolved
  reference" verdict. That is the more expensive failure: the remedy for "does not
  exist" is to write it or delete the reference, and the remedy for "exists but is not
  deployed" is a deploy-map change. An author handed the wrong one edits the deploy
  map, finds nothing to add, and concludes the guard is noisy.

  TEST ANGLES for it-po. `boundary` is the primary angle — zero / one / many /
  malformed-but-parseable over registry entry shapes, all four in one fixture so the
  discrimination is asserted rather than the individual cases. `real_artifact` is
  triggered: the fixtures must be the real config/*.json files, because the prose-vs-
  declaration distinction is a property of their actual structure. Reachability is
  inherited from BP-900g-7's entry point and need not be re-charged.

  ─────────────────────────────────────────────────────────────────────────────
  IT-PO ENRICHMENT NOTE (2026-08-17). One deviation from the BA's hand-off, recorded
  because it changes the test contract: reachability IS charged here rather than
  inherited from BP-900g-7. The behaviour this AC adds is a classification branch, and
  a classification branch is the specific thing that can be correct in isolation while
  the build never consults it. An author only ever sees the build's exit and output, so
  the discrimination has to be asserted there. It costs no slot — three distinct angles
  are charged (boundary, reachability, real_artifact) against a cap of four.

  The four-shape fixture is also the reason `boundary` appears on two entries rather
  than one. Merging the empty/all-resolve case into the four-shape test would let a
  rule that raises on an empty registry stay green, which is exactly the T03 shape
  named in the constraints.
