criteria: |
  Given a reader wanting to know what happens to a conflict once it is raised,
  When they open the state diagram for a conflict's lifecycle,
  Then it shows the states a conflict can be in — raised, not yet decided, and one
    state per recorded resolution,
    And it shows the transition out of each state and what causes it,
    And it shows no transition by which a conflict leaves the diagram without a
      recorded state.

  Given the diagram,
  When it is compared against the states real conflicts occupy and the transitions
    they make,
  Then every state it shows is one a real conflict occupies,
    And every transition a real conflict makes appears in it.

  Given the diagram,
  When a reader looks for how a resolved conflict can become live again,
  Then it shows the transition back from a resolution to raised, and states that it
    is caused by one of the two records changing,
  So the safety valve is documented rather than discovered.

  Given the diagram,
  When a reader looks for a fifth resolution,
  Then the diagram shows none,
  So the closed set of outcomes is legible from the picture.
