criteria: |
  Given a reader trying to understand how a change to the code becomes a drift finding,
  When they open the sequence diagram for the record's freshness check,
  Then it shows the ordered exchange from the change being offered to the automatic checks,
    through the checker resolving pointers and comparing each journey against what it was last
    confirmed against, to the verdict being reported and the behind mark being written,
  And it shows the three verdict outcomes - checked and sound, nothing examined, and not
    checked - as distinct terminations rather than one,
  And each participant in the diagram corresponds to a component named in the project's
    component registry.
