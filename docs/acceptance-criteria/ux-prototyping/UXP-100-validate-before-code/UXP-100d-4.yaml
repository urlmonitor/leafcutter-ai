criteria: |
  Given UXP-100d describes a design-to-implementation handoff via a structured artifact,
  When a sequence diagram is produced for this handoff workflow,
  Then the diagram shows the following actors: UX designer agent, handoff artifact store,
    frontend-coder agent, and component library catalog
  And the diagram shows the sequence: (1) user approves prototype, (2) UX designer
    agent writes handoff artifact with versioned component references, (3) ticket
    references the handoff artifact, (4) frontend-coder agent reads the artifact,
    (5) frontend-coder checks component versions against current catalog,
    (6) implementation proceeds or drift is flagged
  And the diagram distinguishes the version-match path from the version-drift path
