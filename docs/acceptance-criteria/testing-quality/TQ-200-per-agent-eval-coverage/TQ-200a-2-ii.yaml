it_requirements: |
  The deterministic assertions reuse the product-truth validator's existing checks
  (schema conformance, entity-registry membership, add-vs-create / extend-not-
  duplicate, referenced-record resolution, acceptance_scenario presence per
  step/branch) plus a Gherkin-testability check for AC-authoring output. The
  LLM-judge applies a rubric for faithfulness to the input and overall quality; the
  rubric and its threshold are declared per eval set. Both gates must pass.
