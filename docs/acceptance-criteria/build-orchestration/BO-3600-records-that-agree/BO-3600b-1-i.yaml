id: BO-3600b-1-i
title: "An entry naming several subjects is retired only when every one of them is delivered"
component: build-orchestration
components:
  - ac_store
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an open fault entry naming four requirements as its subject, of which three
    read finished with evidence and one reads unfinished,
  When the register is reconciled,
  Then the entry is not retired,
    And the report names the one requirement that is not delivered as the reason the
      entry stays open.

  Given the same entry once the fourth requirement reads finished with evidence,
  When the register is reconciled,
  Then the entry becomes eligible for retirement.

  Given an open fault entry naming four requirements, of which three read finished
    and the fourth cannot be looked up at all,
  When the register is reconciled,
  Then the entry is not retired,
    And the unlookable reference is reported rather than treated as satisfied,
  So a reference the reconciliation cannot resolve never counts towards retirement.
