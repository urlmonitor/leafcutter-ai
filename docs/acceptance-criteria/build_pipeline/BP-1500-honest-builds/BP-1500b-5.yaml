id: BP-1500b-5
title: "Reference documentation lets a reader predict what the sweep removes and what it will never touch"
component: build-pipeline
components:
  - build_pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: medium
roadmap_phase: phase_1
work_status: todo
criteria: |
  Given the orphan sweep behaves as BP-1500b-1 through BP-1500b-4 describe,
  When a reader who has never seen the implementation consults the build
    pipeline's reference documentation,
  Then it states how the sweep decides an installed artifact is an orphan, in
    terms of the package's current sources rather than any stored list of names,
  And it states, by category rather than by filename, what the sweep will never
    remove and why -- adopter-owned files, machine-local run-time state, and the
    link entries the build itself created,
  And it states exactly what the clean result reports, and how a reader
    reproduces that stated scope by hand to check it,
  And it names the two directions apart in one place: residue, which this sweep
    removes, and incompleteness, which the deploy-declaration check already
    refuses to ship, so a reader does not take a fix for one as covering the
    other,
  And, given any one file in an installed tree, that reader can predict from the
    documentation alone whether the sweep would remove it, without reading the
    build's source.
depends_on:
  - BP-1500b
  - BP-1500b-1
  - BP-1500b-2
  - BP-1500b-3
  - BP-1500b-4
doc_links:
