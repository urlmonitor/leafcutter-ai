criteria: |
  See your requirements, code, and tests as one connected map.

  Every acceptance criterion you write becomes part of the same knowledge map
  that already connects agents, tickets, docs, and architecture. You can stand
  on any requirement and ask "what builds this, what proves it, and what does it
  depend on?" — and get an answer without hunting through folders. The map is
  not fixed in size: new sources of knowledge can be added over time, however
  many there are, and the map keeps every connection it promises trustworthy.
