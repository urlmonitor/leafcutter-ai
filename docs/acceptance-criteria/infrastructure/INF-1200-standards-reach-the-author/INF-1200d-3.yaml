notes: |
  WHY THIS IS A SEPARATE RECORD RATHER THAN A LINE IN d-1. It is the single most likely
  coupling to be introduced by a competent implementer acting in good faith. Faced with
  a declaration containing standards, the obvious question is "which of these are real",
  and the obvious answer is "the ones with a check wired up". That filter is one
  condition long, it is defensible in review, and it silently reduces the audience of
  this entire capability to the standards that already had a gate — which is to say, one
  cell of the grid, which is where the project started.

  IT IS ALSO THE COUPLING THAT REINTRODUCES THE FAILURE THE WHOLE TREE EXISTS TO FIX. If
  you are only told about standards whose gate runs, then the set of things you know is
  the set of things that can stop you, and "you find out when you are stopped" has been
  rebuilt one layer up with better manners.

  THE TWO TRANSITION ARMS ARE WHY THIS IS OBSERVABLE AT ALL. A single run cannot
  distinguish "carries all declared standards" from "carries the reachable ones" unless
  a declared-but-unreachable standard happens to be present. Today three are, so the
  first arm has teeth immediately — but that will not last, because BP-1600a-2 is
  approved and will make them run. Once it lands, the first arm's fixture evaporates and
  only the transition arms remain able to fail. They must be built as controlled changes
  to reachability, not as observations of today's accident.

  WHAT THIS RECORD DOES NOT CLAIM, STATED SO IT IS NOT INFERRED. It takes no position on
  whether the three unreached checks should run — they should, and that is BP-1600a-2's
  work. It takes no position on whether a brief should promise that a standard will be
  enforced; a brief that told a specialist it would be refused by a check that does not
  run would be a fidelity defect, and GE-127d and INF-1200f-1 own the surfaces where
  that would be caught.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift
  it verbatim into a test descriptor.

  MUTATION: carry outward only those standards whose check the project currently
  reaches. Under that injection:
    - the first arm must go RED, because the standard whose check is unreached does not
      reach its owner while the other does;
    - the begins-to-be-reached arm must go RED, because what the owner is told CHANGES
      when the check starts running;
    - the no-longer-reached arm must go RED, because what the owner is told changes
      again when it stops;
    - every arm of INF-1200d-1 must STAY GREEN, provided the newly declared standard
      used there has a reachable check.
  All four outcomes must be observed together and all must revert. The green outcome
  matters: this mutation produces a delivery that is fully general over standards, walks
  the declaration properly, and is still wrong — which is precisely why the coupling
  cannot be left to be noticed.

  MEASURED, 2026-09-09, IN THIS WORKTREE. Three standards with configured thresholds —
  code tangledness, a separate one for database code, and folder crowding — have no
  entry in the project's hook manifest and are therefore reached by nothing. One
  standard, the size limit, is reached on every commit. That asymmetry is the fixture
  for the first arm and it is temporary by design.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. The
  mutation above, including which arm must stay green, is written to be turned directly
  into test descriptors.
