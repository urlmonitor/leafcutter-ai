estimated_complexity: L
it_requirements:
  - "TEMPLATE/DEPLOYED PARITY (ADR-001). The change lands in templates/scripts/commit_guardian/ and must be deployed by build.py. build_commit_guardian() in scripts/build_phases.py rglob-copies the WHOLE templates/scripts/commit_guardian/ directory, so a new shared module placed there is deployed with no deploy_map edit. A module placed anywhere else (e.g. scripts/ac_store/) needs an explicit deploy_map entry in scripts/build_phases.py or the deployed hook dies with ModuleNotFoundError at commit time — the failure mode CLAUDE.md records for done_proof.py. Never edit the deployed copy: the next build.py overwrites it and the fix silently disappears."
  - "MIGRATE BOTH OBSERVED CONSUMERS IN THE SAME CHANGE. templates/scripts/commit_guardian/check_contract_shrinking.py line 180 runs git diff --cached; templates/scripts/commit_guardian/check_doc_frontmatter.py line 287 runs git diff --cached --name-status. Migrating one and leaving the other produces exactly the split verdict the last criterion forbids — one check blocking a commit the other passed."
  - "THE SHARED SOURCE MUST SERVE BOTH DIFF SHAPES. git diff --cached is HEAD-to-index, i.e. it compares against ONE state. The two known consumers need different shapes (full text diff, and name-status). If the shared source offers only one shape, the other consumer is driven straight back to a private git call and the single-source clause is defeated in the first week. Serve both from the one derivation."
  - "RETURN THE DERIVATION, NOT JUST THE PATHS. The result must carry the change set AND the states it was derived against, so a consumer's objection text can name what it inspected. GE-120e-3's last clause compares WHAT each arm objected to, not only whether it objected, and it cannot do that if the shared source discards the provenance."
  - "SHAPE IT LIKE _resolve_root.py. templates/scripts/commit_guardian/_resolve_root.py is the family's existing precedent for one shared facility with many importers (27 today). One module in the same package, imported by the checks. Do not satisfy this AC by pointing at _resolve_root.py itself — that facility resolves PREREQUISITES, this one derives the CHANGE SET (see the AC notes)."
  - "ERROR-HANDLING POLICY APPLIES TO THE GIT CALLS. Wrap the subprocess calls in specific exceptions, log at WARNING or higher, never swallow. A git failure must NOT degrade to using the whole staged tree — that silently restores the defect on the exact commits where git is under stress. A derivation that cannot be computed is a could-not-check outcome in GE-120a-1's vocabulary, not a wider change set."
  - "NO BEHAVIOUR CHANGE ON THE ORDINARY COMMIT. Where the commit is built on exactly one state, the derived change set must equal today's git diff --cached output byte for byte. This is the regression budget for the other manifest checks and for every ordinary commit in the repository."
  - "LATENCY BUDGET. This runs inside every pre-commit. Derive once per process and memoise; do not issue one git invocation per consuming check. On a staged tree of ~500 changed files (the observed merge was 479) the shared source must add under 500 ms to the commit."
  - "WORKTREE-SAFE. Drives in this repository run inside git worktrees, where there is no .git DIRECTORY. Resolve the git directory with git rev-parse --git-dir (or equivalent plumbing) rather than assuming <root>/.git; a hard-coded path is a silent no-op in a worktree, which is where the observed defect was hit."
