id: DK-600b-1
title: "Nothing proposed is used until you approve it"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given proposed options and criteria, for example 4 options and 5 criteria,
  When you are asked to approve them and you approve all of them,
  Then exactly those 4 options and 5 criteria go on to the option research round and the
    assessment,
  And no proposed option or criterion is researched or assessed before your approval is recorded.
