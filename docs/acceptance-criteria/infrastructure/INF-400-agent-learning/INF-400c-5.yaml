criteria: |
  Given the classifier that labels a learning offers 16 target-surface values
    (memory-user, memory-project, memory-reference, CLAUDE.md-inline,
    CLAUDE.md-toc, per-folder-readme, agent-frontmatter, adr,
    architecture-doc, how-to, reference, explanation, glossary,
    settings-json, ticket-body, skills-config),
  And the harvester recognises 11 entry_kind values (memory-project,
    per-folder-readme, agent-frontmatter, code-comment, adr, skill-context,
    per-agent-memory, explanation-doc, reference-doc, claude-md,
    retrospective),
  And those two sets overlap on only four values, so a label the classifier
    produces is more often unroutable than routable,
  When the entry_kind vocabulary is defined,
  Then a single declared vocabulary exists in one named location, and both
    the classifier's label set and the harvester's routable set are read from
    it rather than restated,
  And every value the classifier can return is a member of that vocabulary,
  And every member of that vocabulary has a routing rule in the harvester, so
    the set of labels the classifier can produce and the set of kinds the
    harvester can route are the same set,
  And an emitted knowledge_captured event is produced through an emission
    helper that accepts an entry_kind only when it is a member of that
    vocabulary,
  And an event whose entry_kind is outside the vocabulary is never written to
    the knowledge-emission sink.
depends_on: [INF-400c, INF-400c-4]
