id: ACS-1300a-3
components:
  - ac_store
title: "A coverage list holding child requirement ids is left alone, and the run says why"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a store containing a parent record whose coverage list holds the ids of its own
    child records and which is itself named by a coverage tag in a test file,
  And, in the same store, a record whose coverage list holds only test paths and is
    missing one,
  When the repair tool is invoked out of process with the apply request,
  Then the parent record's file is byte-for-byte identical to its content before the run,
  And the parent is reported as an abstention naming the record and stating that its
    coverage list carries child requirement ids,
  And the second record gained its missing test path in that same invocation, so the
    abstention was a decision this run reached rather than the whole of what it did,
  And the classification a done-proof verdict reaches for the parent — deriving its
    proof from its children rather than requiring a test of its own — is the same when
    computed before the run and after it,
  And the back-link check that requires a parent to name each of its children still
    passes for that parent after the run.
depends_on:
  - ACS-1300a
doc_links:
  - path: scripts/ac_store/done_proof.py
    relationship: implements
    status: exists
    relevance: "WHY THIS IS NOT COSMETIC. _has_resolvable_child decides composite-versus-leaf by whether ANY coverage entry resolves to a real record in the store, and verify_done_eligible routes on that decision: a composite derives its proof from its children, a leaf must carry its own tagged test. Appending a test path to a list that holds child ids changes what that list is, and the two 'classification unchanged' clauses are how this AC is falsified if it does."
  - path: templates/scripts/commit_guardian/check_ac_parent_covered_by.py
    relationship: relates-to
    status: exists
    relevance: "THE SECOND READER OF THE SAME FIELD. It requires a parent's coverage list to name each of its children; a repair that rewrites that list is one edit away from tripping the back-link gate on records it was supposed to help. The final clause binds the outcome to this check's real verdict."
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
    relevance: "States the dual purpose outright: the coverage field holds test file paths OR child requirement ids. One field, two meanings, no discriminator — which is the whole reason this AC exists."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "THE COMPOSITE/LEAF DECISION MUST BE THE ONE `done_proof` ALREADY MAKES, NOT A SECOND ONE. `_has_resolvable_child` decides it by whether ANY coverage entry resolves to a real record in the store, and `verify_done_eligible` routes on that decision. Do not re-derive it from the `level` field, from the id string, or from entry shape — a legacy record holds test-file paths where child ids would go, and `derive_parent_id` returns None for bare `PREFIX-NNN` ids, so both proxies are wrong for exactly the records this AC protects."
  - "THE ABSTENTION IS AN OUTCOME OF THE DETECTION PASS, NOT A GUARD BOLTED ONTO THE WRITE PATH. A record classified as carrying child requirement ids must never enter the write set at all, so byte stability for it follows from the file never being opened rather than from a check that declined to change anything."
  - "ABSTAIN, DO NOT DISAMBIGUATE. There is no reliable discriminator between a child-id list and a test-path list, and inventing one writes false evidence. The abstention must name the record and state the reason; it is reported through the single abstention channel ACS-1300c-3 defines, not a second format."
  - "THE OUTCOME IS BOUND TO TWO EXISTING READERS' REAL VERDICTS, NOT TO FILE IDENTITY. Byte identity alone is satisfied by a tool that does nothing. The `done_proof` classification for the parent computed before and after the run must be equal, AND `templates/scripts/commit_guardian/check_ac_parent_covered_by.py`'s verdict for that parent must still pass after the run. Compute both against the real readers on the real post-run store, not against a re-implementation of their rules."
  - "MIND HOW THE BACK-LINK GATE IS ACTUALLY INVOKED. `check_ac_parent_covered_by.py` reads the git index or `HOOK_TEST_FILES` rather than argv, so passing a path on the command line does not make it check that path. Any verification of its verdict must confirm the hook actually saw the parent file — a silent exit 0 from a hook that was handed nothing is not a pass."
  - "NEVER WRITES THE FINISHED-STATE FIELD. A composite whose coverage list holds child ids is precisely the population the originating investigation was about — records marked finished with unfinished children — which makes this the record where reconciling the badge looks most defensible. Refused, not deferred."
  - "THE SCHEMA CHANGE THAT WOULD DISSOLVE THIS IS OUT OF SCOPE. Splitting the field into a child-id field and a test-link field is the real fix and is not in this tree; do not begin it here, and do not add a discriminator field to the schema as a side effect of implementing the abstention."
  - "Must handle errors gracefully per the project error handling policy and must fail toward abstaining: if the composite/leaf classification cannot be obtained for a record, the record is abstained on and reported, never written to."
delivers_to: null
