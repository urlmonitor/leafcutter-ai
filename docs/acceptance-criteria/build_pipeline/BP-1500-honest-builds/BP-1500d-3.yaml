id: BP-1500d-3
components:
  - build_pipeline
title: "A build that cannot produce the record stops and says so, instead of warning once and reporting success"
component: build-pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: done
criteria: |
  Given a real build aimed at a project outside the producing package's own parent
    folder -- the venue in which every child of this feature must be proved, and no
    longer by itself a failing condition -- and given that build is asked to place one
    of the files it manages somewhere outside the very project it is aimed at, so that
    no truthful account of that file, expressed as a position inside that project,
    exists to put in the record,
  When the build runs to completion and its report and outcome are inspected,
  Then the build reports failure,
  And the outcome an automated caller observes is unsuccessful, so a script, a
    pipeline or an install step that reads only the outcome learns that the build did
    not finish its job,
  And the report names the record that could not be produced and the project the build
    was aimed at, so the reader knows which install is unprotected,
  And that report is distinguishable from the report of a build that DID produce the
    record: a reader must not have to arrive at the failure by reading past a line
    announcing that the record was written,
  And a single warning line accompanied by a successful outcome does not satisfy this,
    because the build's own report is the last place this failure currently shows up,
  And the identical build, run against that same out-of-package project once every
    file it manages is again placed inside that project, reports success and leaves the
    record file written to disk in that project with an account of what it put there --
    so the failure verdict is attributable to the unproducible record, and not to a
    build that refuses every target outside its own parent folder, and not to one that
    refuses any project whose configuration it merely dislikes,
  And both verdicts are taken from running the real build against a real project
    outside the producing package's own parent folder and inspecting its reported
    outcome and the resulting tree, never from reading the build's own source for the
    presence of a failure path.
depends_on:
  - BP-1500d
  - BP-1500d-1
