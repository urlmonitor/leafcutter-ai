id: BP-100k-3-v
components:
  - build_pipeline
title: "Excusing a recorded output's drift stays per-key and ground-gated: an exemption never covers a sibling output, and an entry without a ground excuses nothing"
component: build-pipeline
level: L3
status: active
req_status: draft
readiness: reviewed
priority: high
roadmap_phase: phase_1
work_status: done
criteria: |
  Given a build manifest recording two deployed outputs whose content has
    drifted in the same way since the build, identical in kind and differing
    only in whether the exemption registry names them,
  And given the registry holds one entry, with a non-blank ground, naming the
    first output only,
  When check-output-drift runs over that workspace,
  Then the second output is reported as drifted and never as a drift
    exemption,
  And the run blocks the commit, even though its sibling is excused,
  And given instead the registry names the first output with a ground that is
    whitespace only, and names the second output with a non-blank ground,
  When check-output-drift runs over the same workspace,
  Then the gate reports the first entry as a rejected exemption entry, naming
    the output it tried to excuse,
  And the first output is still reported as drifted, with the run summary
    stating drifted=1,
  And the run blocks the commit,
  And every verdict is taken from running the deployed gate as a separate
    process and reading its emitted lines and exit status, so a registry that
    the gate ignored cannot pass for a registry the gate honoured.
