notes: |
  Not in the PO's list; added by the BA. Without it, a start marker with no end is the case most
  likely to be "handled" by filling to end of file or by skipping the route silently -- either ships
  a route that the identity check (BO-4500b-2) cannot even locate a block in. Reporting every
  malformed route in one run avoids a fix-one-rerun-find-the-next loop.
