criteria: |
  Given the isolated-authoring workflow is implemented,
  When a contributor opens the build-orchestration architecture docs,
  Then a sequence diagram exists that shows the participants
    (user, authoring workflow, git, origin/main, authoring worktree)
    and the ordered interactions from workflow start through worktree+branch
    creation off origin/main to the first authoring stage writing into the
    worktree,
  And the diagram makes explicit that no interaction targets the user's
    original checkout or a concurrent worktree.
