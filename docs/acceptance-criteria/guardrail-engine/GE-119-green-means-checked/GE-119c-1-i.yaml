notes: |
  THE HARNESS IS ITSELF SUBJECT TO GE-119a. A verification surface built to catch "reported
  success without checking anything" that can itself report success without checking anything
  is the same defect one level up — and it is the most likely place for it to recur, because
  a harness that stands up infrastructure has far more ways to half-fail than a check does.

  The project has already been bitten by exactly this shape: a green sweep over zero real
  subjects. The fast-lane runner passed its structural tests while never executing its
  red/green gates, and the phantom-done hook passed its unit tests while being a no-op on
  every real ticket. Both were green sweeps over nothing. This AC is the interlock.

  The exercised-count clause matters more than it looks. A failure assertion catches a harness
  that breaks loudly; the reported count catches a harness that silently narrows its own
  subject list — the slower and more common decay.

  IT-PO (2026-08-14): the exercised count must be compared against the manifest set from
  GE-119c-3, not against a constant, or the count itself becomes a number nobody checks.
