criteria: |
  Given the traceability reconciliation check has flagged criterion AC-X because
    its implemented_by entry "src/foo.py#process_order" no longer resolves
  And the developer edits AC-X's implemented_by entry to "src/orders/foo.py#process_order",
    which resolves in the staged tree (with the symbol present at symbol tier)
  And the developer re-stages the AC file and the source change in the same commit
  When the traceability reconciliation check runs again at pre-commit time
  Then the check produces a clean verdict for AC-X
  And the same commit is allowed to proceed
