assigned_agent: documentation-expert
estimated_complexity: M
it_requirements:
  - "THE REFERENCE MUST BE FOLLOWABLE BY A READER WHO HAS ONLY THE DEPLOYED INSTALL. No step may require the producing package's source tree, its scripts/, its templates/, or its workspace layout. If a step cannot be performed without the package, it does not belong in this reference -- an adopter does not have it."
  - "EVERY LOCATION THE REFERENCE NAMES MUST BE GIVEN RELATIVE TO THE READER'S OWN PROJECT ROOT, never to the producing package or to this repository's self-hosted workspace. A path written as it appears in this workspace is the same class of defect the reference is documenting, committed inside the documentation of it."
  - "THE REFERENCE MUST STATE THE OBSERVABLE FORM OF BOTH SILENT OUTCOMES precisely enough for a reader to recognise each in their own terminal: what the build does when it cannot produce the record, and what a check does when it finds no readable record. Quote the actual signals -- exit status and message shape -- not a paraphrase, because the entire point is letting a reader distinguish an inert check from a passing one at a glance."
  - "WRITE AGAINST THE POST-FIX BEHAVIOUR, NOT TODAY'S. The build currently exits 0 when it cannot produce the record, and both checks currently warn and return 0 when they cannot read one. BP-1500d-3 and BP-1500d-4 change exactly those signals. Documenting the present-day behaviour would publish the defect as the contract, so this AC cannot be completed before -3 and -4 have settled their verdicts, and the reference must be re-verified against them rather than against a draft."
  - "EVERY COMMAND AND PATH THE REFERENCE QUOTES MUST BE COPY-PASTEABLE AND MUST HAVE BEEN EXECUTED against a real out-of-package install during authoring. A command that was written from reading source and never run is the grep-shaped acceptance this AC's criteria explicitly refuse."
  - "THE PROCEDURE MUST BE WRITTEN SO IT CAN BE EXECUTED VERBATIM BY A TEST. Give the steps as discrete, individually runnable commands with stated expected signals, rather than as prose a human must interpret. This is what makes the falsifiability clause mechanically checkable instead of a matter of opinion, and it is the reason this documentation AC carries a test_spec at all."
  - "SCOPE BOUND -- the reference must not become a rebuild how-to, and must not restate BP-1500c's drift guarantee. Its subject is where the record lives, what makes it readable elsewhere, and what the two silent outcomes look like from an adopter's side."
  - "Must follow the house shape for a reference document in this repository -- frontmatter and structure per docs/reference/ -- so the doc-frontmatter guardrail accepts it and it is reachable from the documentation index."
