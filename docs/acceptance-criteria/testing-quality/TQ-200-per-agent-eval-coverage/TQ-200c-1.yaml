notes: |
  FIRST IN THE ORDER, AND THE REASON THE ORDER EXISTS. Every other child of TQ-200c
  depends on this one, because a router cannot emit a request the vocabulary cannot
  express, a plan cannot carry both layers at once if only one is sayable, and a
  judged request cannot reach the harness if there is no way to write it down. Build
  the routing first and its only available output is today's binary — which is the
  defect.

  THE GAP, VERIFIED 2026-08-18 (do not re-derive).
    - config/ac_store_schema.json: framework enum ["unittest", "pytest"] at line 401;
      angle enum [criterion, reachability, seam, real_artifact, deployed, boundary,
      failure] at line 411; additionalProperties: false at the root (line 15) AND on
      test_spec items (line 387), enforced. There is no value in either enum that can
      say "this proof is judged", and no side door.
    - templates/agents/test-writer.md: zero occurrences of "eval". Its framework
      choice is unittest or pytest. It has Write, so it CAN author an eval row; it
      has no instruction that would ever lead it to.
  So today a requirement cannot ASK for an eval even when a human wants one. Every
  judged proof in the store is therefore either mis-stated as a deterministic test
  (and then never written — see the L1's 115 missing named tests) or omitted.

  WHY THE CRITERIA DO NOT NAME THE ENUM VALUES. Choosing the exact words, deciding
  whether the distinction rides on the existing test_spec entry or on a sibling
  field, and reconciling with scripts/evals/agent_eval_config.json's `scoring_mode`
  are technical decisions for the it-po. What the criteria DO fix is the property
  that makes the decision correct or not: ONE vocabulary, the same word meaning the
  same thing to producer and consumer. Two coordinated changes that happen to work
  today but can drift — an enum value on one side and a hand-maintained lookup on
  the other — satisfy the letter and not the AC, which is why the shared-meaning
  clause is written as a behaviour (the consumer accepts it without translation) and
  not as a structural claim about where the words are stored.

  WHY THE REJECT-UNKNOWN-WORDS CLAUSE IS HERE AND NOT IN c-5. c-5 is about the
  ROUTING DECISION being loud when it cannot honour a contract. This clause is
  narrower and earlier: a typo or a private synonym at authoring time must fail at
  authoring time, where the author is still present to fix it. The two are testable
  independently — the same implementation can reject unknown words while still
  silently swallowing an unroutable-but-well-formed request, and vice versa.

  BACKWARD COMPATIBILITY IS A CRITERION, NOT A COURTESY. Roughly 2,900 existing store
  records carry deterministic proof statements written before this vocabulary. An
  implementation that requires them all to be re-annotated, or that quietly
  reinterprets an unannotated proof as judged, is refused by the last clause. The
  default for existing records is unchanged meaning.

  BOUNDARY. This AC does not decide WHO gets a judged proof (that is c-2), does not
  require both kinds at once (c-3), does not register anything with the runner (c-4)
  and produces no verdict or gate (c-5). It only makes the sentence sayable.
