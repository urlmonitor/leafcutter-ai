it_requirements:
  - >-
    Cleanup decision (IT PO): scripts/evals/produced_tests_runs.py gains one best-effort delete helper next to remove_tree
    (:133-141) that tries remove_tree a few times with a short pause (at most 3 attempts, under 2 seconds in total,
    the pause patchable so tests do not sleep), returns quietly when the folder is gone, and otherwise logs one
    WARNING on the run_agent_eval logger naming the folder left behind; it never raises. remove_tree itself keeps
    raising (keep_outputs :118-128 relies on it to replace an old copy).
  - >-
    Every temp-folder cleanup of a produced-tests row uses the helper: (1) live_output's finally (produced_tests_mode.py
    :113-114), so a locked agent sandbox never replaces the row's real error (for example the ModelInvocationError
    'agent CLI exited 1: API Error: Connection closed mid-response'); (2) score_row's finally (produced_tests_scoring.py
    :230-231), so a locked scoring sandbox never turns a scored row into an error; (3) the row folder of score_one
    (produced_tests_mode.py :135): tempfile.TemporaryDirectory is replaced by an explicitly created folder (tempfile.mkdtemp
    with the same 'produced-tests-' prefix) removed with the helper in a finally after the row, because TemporaryDirectory.cleanup
    raises outside the row's try. ignore_cleanup_errors=True alone is not enough: it neither retries nor warns.
  - >-
    Unchanged: score_one's except (:145-149) still records any other failure as a failed row with that error; launch_failed
    (:146) still re-raises an AgentLaunchError and run_produced_tests_mode (:194-197) still stops the run as a harness
    failure (exit status 3, TQ-200d-5-iii). No broad OSError catch is added to the row loop. The --score-gold path
    goes through the same score_one / score_row, so it is covered without a separate change.
  - >-
    Tests fake the lock by making the delete raise PermissionError(13, 'The process cannot access the file because
    it is being used by another process') - patch the deletion seen by produced_tests_runs, never rely on a real
    Windows lock - so they run on Linux CI; each test removes what it left behind afterwards. Live rows are simulated
    with a fake agent writer through the harness argument (as unit_tests/evals/tq200d5/ does), never a model call.
  - >-
    Every changed .py file stays at or under 400 counted lines; run_agent_eval.py is not touched and does not grow;
    no new module is added at the top of scripts/evals/. unit_tests/evals/ is at its density cap, so this AC's tests
    go in their own subfolder (named in test_spec) with an __init__.py, like unit_tests/evals/tq200d1ii/. Tests
    go in unit_tests/evals/tq200d5iv/ (unit_tests/evals/tq200d5/ holds 11 files and belongs to TQ-200d-5..-5-iii).
  - >-
    DOCUMENTATION (part of done) - scripts/evals/README.md produced-tests section gains one bullet: 'Temp folders.
    A row's temp folder that cannot be deleted (for example a Windows file-in-use error) is retried, then left behind
