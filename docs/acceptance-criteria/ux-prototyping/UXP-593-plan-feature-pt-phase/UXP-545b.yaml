it_requirements: |
  The PT authoring loop in templates/workflows-js/plan-feature.js checks the
  commitStageOutputProductTruth result and, on status:error, returns immediately with
  the failed_stage set before dispatching the next PT agent — the commit-before-next
  invariant (the BO-1500b-1 analog) applied to the product-truth phase.
