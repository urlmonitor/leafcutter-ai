    relationship: specifies
    status: exists
assigned_agent: frontend-coder
estimated_complexity: S
it_requirements: |
  Graceful degradation in templates/workflows-js/plan-feature.js: a missing/unknown
  outcome or unparseable classifier payload falls through to the AC pipeline without
  raising; when a dispatch array is present it is validated against the outcome and the
  outcome wins on disagreement.
