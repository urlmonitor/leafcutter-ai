notes: "Boundaries for BA decomposition (not requirements): (1) Upstream of BO-210 -- the pre-commit safety net assumes hooks FIRE; BO-1700 guarantees they fire. (2) Distinct from BO-1500e -- that covers the AC-authoring workflow's own worktree; BO-1700 covers general epic/feature build drives. (3) Distinct from BP-100k / BP-1000 -- those govern hook CONTENT/parity; BO-1700 governs hook EXECUTION in a worktree. The minimal one-file epic-path slice was already committed separately -- BO-1700 is the durable, complete hardening. Origin: three-agent investigation into fresh-worktree silent hook-skip (EPIC-AcPipelineDeployGaps: 9 hooks skipped, 14 would-have-blocked findings)."
