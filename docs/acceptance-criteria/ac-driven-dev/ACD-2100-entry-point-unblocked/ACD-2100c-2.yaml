notes: |
  THE WORKTREE GIVEN IS NOT DECORATION. Pausing is only durable if the record can
  actually be written, and the pause store is reached at three cwd-relative paths
  (plan-feature.js 1552, 1625, 1642) covered by ACD-2100a-4. Until that lands,
  "pause instead of discard" degrades to a persist failure when run from a worktree
  -- which is exactly where the original failure was observed. Evidence for this
  behaviour gathered from the workspace root only does not close it, which is why
  the worktree is in the Given rather than in a note.

  THE ON-DISK CLAUSE IS AN ANTI-PHANTOM CLAUSE. A run that reports "waiting" while
  having written nothing is not paused, it is lost, and it passes any assertion made
  against the return value. Assert the record's presence after the process has
  exited.

  THE UNATTENDED INVOCATION IS THE REALISTIC CASE, not a contrived one. It is how
  the route is reached from another workflow, and it is the condition under which
  the observed run was discarded.

  ALREADY IN FLIGHT ELSEWHERE, DO NOT AUTHOR OVER IT: two commits on
  worktrees/pf-gate-fix (c6087fae, 5a3eae6d) add pause-persist verification and fix
  dropped `edit` feedback. They harden the write; they do not decide who may answer
  a gate, which is this L1's subject. Assume they land.

  OUT OF SCOPE: the vocabulary of the returned status when a run is cancelled
  (KI-ACD-006). This record asserts only that the run reports waiting, not what a
  cancelled run reports.

  2026-08-25 (it-po): this is the one cross-L1 ordering in the tree that the build
  sequencer can see -- ACD-2100a-4 is already in depends_on, so the expects_from edge
  written here has its mirror and will be honoured despite KI-ACD-015. Do not build
  this record before ACD-2100a-4; its own Given makes it unfalsifiable if you do,
  because a pause that fails to persist from a worktree cannot be told from one that
  was never attempted.
target_epic: EPIC-StartingNewWorkTheProperWayAlways
