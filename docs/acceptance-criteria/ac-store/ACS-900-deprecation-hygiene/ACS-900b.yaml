id: ACS-900b
readiness: approved
priority: high
title: "Leftover code behind a retired requirement blocks the commit"
component: ac-store
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  Retiring a requirement while its code still lives stops the commit instead of slipping through.

  If a requirement is being retired but the source it claimed still exists and
  still implements the retired behavior, the commit is blocked. Orphaned code
  cannot be left behind silently — the retirement is held until the code is
  removed or correctly reconciled.
