criteria: |
  Given a design decision whose proposals hold the reused criteria of cat-1dc11c5a2ffa7310 and cat-d15d52392d7aa94c and one criterion drafted for a gap,
  When the person reaches the approval of proposals,
  Then each reused criterion is shown with its category id and preferred wording, set apart from the drafted criterion,
  And the person can approve all, approve only some, edit a criterion or add one, for reused and drafted criteria alike,
  And when the person approves only the criterion of cat-d15d52392d7aa94c and the drafted one, the criterion of cat-1dc11c5a2ffa7310 is neither researched nor assessed,
  And no reused criterion is researched or assessed before the person approves it.
