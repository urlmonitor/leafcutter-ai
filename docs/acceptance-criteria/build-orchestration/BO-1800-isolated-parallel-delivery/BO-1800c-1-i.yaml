criteria: |
  Given a task whose steps are inherently sequential (each step depends on the
    previous one),
  When work on that task is scheduled,
  Then it is not split across multiple agents to force artificial parallelism,
  And it runs with a single collaborator (or the minimum the dependencies allow)
    rather than being padded up toward the per-feature cap just because the cap
    permits it.
