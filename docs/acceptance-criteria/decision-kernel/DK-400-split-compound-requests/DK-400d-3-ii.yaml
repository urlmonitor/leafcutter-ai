criteria: |
  Given the decision-records goal, which routing would accept as one decision (trigger
    bundled_accepted), offered as parts p1 to p5,
  When human:user rejects the split with the note "Keep it whole: one record format covers all
    five, so decide it as one.",
  Then the goal goes ahead as one decision from the precedent step, exactly as it would without a
    split,
  And the run is not blocked by the rejection,
  And the split's state is kept whole (rejected_kept_whole) and no part has a work item,
  And once the person approves that one decision, its record asks the goal as submitted, the split
    names that record as the decision the goal was kept whole as, and the record is linked to no
    part.
