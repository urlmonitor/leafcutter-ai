id: DK-300b-2-i
title: "Ambiguous short names never resolve by filename ordering"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given two permitted modules declare the same short symbol name and a third denied module declares that name,
  When the goal mentions the short name without qualification,
  Then its resolution remains ambiguous with at most three permitted candidate identities and an unresolved-ambiguity marker,
  And no first-file winner or denied alternative is disclosed,
  And an explicit permitted path-qualified or module-qualified mention resolves to its exact symbol,
  And a short name resolves automatically only when unique among permitted candidates.
