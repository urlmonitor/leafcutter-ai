             test database only; the "to run later" list is run too
                                                              python-coder

  PROMPT-ONLY. The writer's conduct is instruction text in sql-test-writer.md.
  Behavioural substitute: the sql-test-writer eval set in TQ-200d-2, whose rows
  check that "observed" is claimed only with a quoted run, and that no run is
  claimed when no test database is configured. Deterministic backstop: the
  wrong-version runs (TQ-500g-2-ii) run the tests whatever the writer said.

  RELATION TO TQ-500f-4-i. That AC's Given is "under its current instructions,
  does not run the suite". Once this AC lands the writer runs, so its answers
  may be observed when backed by a run; TQ-500f-4-i's last clause already allows
  exactly that for the ordinary writer. No contradiction, but build TQ-500f-4-i
  first (same template; depends_on).

  "BEFORE THE FIX" FOR A STORED PROCEDURE means the procedure's definition as it
  was before the work began, installed into the test database for that run, then
  replaced by the fixed one. Watch the re-deploy trap (TQ-500g-2-i) here too: a
  suite that re-installs from source files will silently install the fixed
  version.
