    relevance: >-
      ONE OF THE FOUR FALSE SIGNALS. The package's own hook index lists checks
      with a seriousness rating, which reads to any adopter as a statement that
      the check is live. For the affected checks it is not. The other three
      signals point the same wrong way: a populated settings block in config.py,
      a populated entry in commit_guardian.json, and auto-fix routing wired to
      handle the check's failures.
