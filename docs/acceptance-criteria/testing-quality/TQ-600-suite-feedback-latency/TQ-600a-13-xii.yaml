id: TQ-600a-13-xii
components:
  - testing_quality
title: "Only correctness tests hold pull requests; timing-ratio tests run in their own lane that reports and never holds"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the tests the default run does not collect (TQ-600a-13, TQ-600a-13-i), some of
    which assert correctness — the shared-layout corruption guards among them — and some
    of which assert wall-clock ratios between two measurements taken on the same host,
  And the measured host variance on this repository's shared runners of 3.8x to 10.74x
    with no code change, under which a ratio assertion will fail on noise, while each
    false red that holds pull requests freezes roughly ten merges a day,
  And the rule that a test is placed in the timing lane only by a human-reviewed change
    that applies an explicit timing marker to it — never by its name, its directory, or an
    automatic classification,
  When the excluded population is run after a merge to main or on the heartbeat,
  Then it runs in two lanes: the correctness lane — every excluded test not carrying the
    timing marker — whose verdict is the run history the hold reads (TQ-600a-13-ii,
    TQ-600a-13-vi), and the timing lane — every test carrying the timing marker — which
    runs as a separate workflow on the same triggers,
  And a timing-lane test that fails turns the timing workflow's own run red, and is named
    by node id on the open `post-merge-timing` notice (created if none is open), so the
    failure is visible and tracked,
  And no outcome of the timing lane — red, did-not-complete, stale or never run — changes
    the verdict of `Post-merge suite status` on any pull request,
  And every test in the suite is collected by exactly one of the default run, the
    correctness lane or the timing lane — none by two, none by zero — shown by three real
    collections compared with an unfiltered one,
  And a test that has newly entered the timing lane since the previous timing run is
    named on the `post-merge-timing` notice with the commit that added its marker, so a
    correctness test moved out of the holding lane is seen rather than silent,
  And a correctness-lane test whose red was not reproduced at the same commit is named on
    the `post-merge-flaky` notice as a candidate for the timing lane (TQ-600a-13-xiii),
    which is how a timing test left in the correctness lane by mistake is caught,
  And each of these is demonstrated by executing both lanes' selection and verdict
    behaviour against a synthetic population containing correctness tests, marked timing
    tests and an unmarked timing test, never by reading a configuration file for the
    marker.
