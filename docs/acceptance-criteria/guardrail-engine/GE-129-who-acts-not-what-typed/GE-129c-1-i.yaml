notes: |
  WHY AN L3. GE-129c-1 is met by a test that stubs the specialist. The live failure is that the
  specialist's gate, finding no ticket path, takes the interactive branch and waits: the step
  neither commits nor fails. Only this record turns red under "reroute done, gate unchanged".

  Q1 (2026-09-17): a dispatched commit specialist is unattended by definition; approval is the
  dispatching run plus an audit record. The GE-129c notes record that the token only ever
  satisfied the guard, so retiring it does not change the gate -- but routing a new, ticket-less
  caller to the specialist does reach the gate's interactive branch.

  DECIDED 2026-09-17 (user) -- THE GAP Q1 OPENED IS CLOSED BY REFUSAL. A top-level session in a
  mode that reaches no person is refused when it dispatches the commit specialist (GE-129d-2-i);
  how that dispatch is told from an unattended run's is taken from harness-supplied context only
  (GE-129a-1's third scenario). This record stays scoped to an unattended run's dispatch.

  declares_side_effect: true -- derived from "commits the change".

  ASSIGNMENT (BA proposal): llm-expert -- the edit surface is the commit specialist's agent
  definition (its confirmation step).
