assigned_agent: llm-expert
estimated_complexity: M
declares_side_effect: true
it_requirements:
  - "The recording rule changes from append-always to update-if-present: before recording an outcome for a gate, the agent locates its own existing entry for that gate in the work item's record and, if one exists, replaces it; only when none exists does it append. The rule lands once, in templates/skills/signoff/SKILL.md and the shared templates/agents/_signoff_block.md partial that the template compiler injects into every phase agent, never as a per-agent instruction."
  - "MUST BE EXECUTABLE, NOT MERELY WRITTEN DOWN. The AC is satisfied only if there is a recording action a test can invoke twice against a real work-item file and then count the entries the file actually carries. A change consisting solely of prose added to SKILL.md is NOT sufficient evidence: prose is advice to a model, and the defect being fixed is a model that appended twice. The recipe must therefore be stated as a deterministic operation over the parser-strict heading schema -- locate the entry whose gate matches, replace it, otherwise append -- so it can be applied and verified mechanically. NO GREP-SHAPED TEST: a test that searches SKILL.md for the word 'update', or for the presence of the instruction, passes on a change that no agent can actually carry out."
  - "THE UPDATE MUST PRESERVE THE EARLIER ATTEMPT'S INFORMATION. Overwriting the first entry with the second turns a duplicate-record defect into an audit-erasure defect: a gate that failed and was retried would show only the pass, and the failure would leave no trace anywhere. The surviving entry states the later outcome and additionally names that a re-record occurred and what the earlier outcome was. The requirement is one ENTRY per gate, not one FACT per gate."
  - "THE MATCH KEY IS GATE IDENTITY AND OWNERSHIP, NOT POSITION. Locating 'the last entry' and overwriting it collapses two different gates the moment two agents record in sequence. The entry to update is the one whose gate matches the gate being recorded and whose author is the recording agent. An agent still never edits another agent's entry -- that prohibition, already stated in SKILL.md, is unchanged by this AC and is what keeps this rule compatible with BO-2900f-1-ii's read-side constraint on the driver."
  - "DO NOT INTRODUCE THE GAP WHILE REMOVING THE DUPLICATE. BO-2900f-1-i is the sibling defect: a gate that reports success and leaves no entry at all. An implementation that de-duplicates by skipping the write whenever it is unsure whether an entry exists trades one half of the invariant for the other. The first-recording control case is a first-class descriptor, not an afterthought."
  - "THE HEADING SCHEMA IS LOAD-BEARING. scripts/commit_guardian/_signoff_parity_checks.py and the supervisor both parse the entry heading; an in-place update that reformats it, drops the timestamp, or emits a second heading inside the body breaks the parity guard and the supervisor's next-move decision. The updated entry must satisfy the same heading regex as a freshly appended one."
delivers_to:
  agent: python-coder
  contract: "A work-item record carrying exactly one entry per gate that reached an outcome, with the entry stating the latest outcome and naming any earlier attempt. This is the record shape BO-2900f-2's cardinality count is taken over, and the condition under which BO-2900f-1-ii's duplicate report is expected to be empty."
expects_from:
  ac_id: BO-2900f-1-ii
  contract: "The read-side half of the same behaviour, split from it on 2026-08-18. That AC adjudicates from the latest entry when a gate carries more than one and reports the duplication as duplicate_signoff_entries; this AC stops the duplicate being written in the first place. The reported duplicate count is the observable signal that this AC has regressed, so the two must be read and reviewed together and neither may be marked done on the other's evidence."
test_spec:
  - name: test_recording_the_same_gate_twice_leaves_exactly_one_entry
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Apply the recording action to a real work-item file for one gate, then apply it again for the same gate with a different outcome, and count the entries the file carries for that gate. Exactly one. This is the direct reproduction of the two `commit (status: ok)` entries on ticket 03 and must fail on an append-only recipe."
  - name: test_the_surviving_entry_states_the_later_outcome_and_timestamp
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "After the second recording, assert the one remaining entry carries the second outcome and the second timestamp -- not the first, which would make the update a no-op that merely suppressed the append."
  - name: test_the_earlier_attempt_is_still_visible_in_the_surviving_entry
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Record a failure then a pass for the same gate and assert the single entry names both the re-record and the earlier failing outcome. Fails an implementation that satisfies the count by erasing the first attempt."
  - name: test_a_first_recording_still_appends_exactly_one_entry
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Control case against the BO-2900f-1-i gap defect: a gate with no prior entry gets one. A de-duplication that never writes passes the first descriptor and fails this one."
  - name: test_recording_one_gate_does_not_disturb_another_gates_entry
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Record gate A, record gate B, then re-record gate A, and assert gate B's entry is byte-for-byte unchanged. Fails an implementation that matches on position -- 'the last entry' -- rather than on gate identity."
  - name: test_the_rule_holds_for_every_recording_agent_not_just_the_one_that_was_observed
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "Run the twice-recorded scenario once per agent in the canonical phase set, driven off the shared sign-off partial rather than a hand-picked agent, and assert one entry each. The observed duplicate was on the delivery gate; a fix scoped to that agent leaves every other agent able to reproduce it."
  - name: test_the_updated_entry_satisfies_the_same_heading_schema_as_a_new_one
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Feed the twice-recorded work item to the sign-off parity checker and assert it parses and passes -- the in-place update must not produce a heading the parity guard or the supervisor cannot read."
test_rationale: |
  The whole risk on this AC is that it is a prompt-surface change and prompt-surface
  changes are routinely 'verified' by reading the prompt. That evidence is worthless
  here, because the thing being fixed is an agent that had the append recipe in front
  of it and appended twice anyway. Every descriptor therefore performs the recording
  action against a real work-item file and counts what the file ends up carrying,
  which is also the only form of evidence that can distinguish this AC from its
  read-side half: BO-2900f-1-ii's tests can all pass while the duplicate is still
  being written.
  Three descriptors exist specifically to close off cheap wrong fixes. The
  first-recording control blocks a fix that de-duplicates by not writing, which is the
  sibling defect BO-2900f-1-i and the single most likely regression. The other-gate
  descriptor blocks matching on position instead of gate identity, which looks correct
  on a one-gate test and collapses the moment two agents record in sequence. The
  earlier-attempt descriptor blocks satisfying the count by erasing history, which
  would trade a duplicate-record defect for an audit-erasure defect and defeat the
  reason the write side was separated from the driver at all.
