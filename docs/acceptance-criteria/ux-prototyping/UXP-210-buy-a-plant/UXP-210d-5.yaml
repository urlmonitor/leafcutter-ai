criteria: |
  Given the order summary is shown to a signed-in customer,
  When the customer enters valid card details,
  Then a Payment record is created for the order in the 'authorized' state,
  And the Payment is tied to the signed-in customer's order,
  And no Order is yet marked 'paid' (capture has not happened).
depends_on: [UXP-210d]
