title: "Every warning a successful worktree setup prints says it did not stop the setup, and the agent-tool probe's miss is one of them"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the worktree setup checks which version of the agent command-line tool is
    installed, and that tool cannot be found on the search path the setup's own
    commands run with,
  When the setup finishes opening and bootstrapping the worktree,
  Then the setup's result is success,
  And the message about the tool states that the tool was not found on the setup's
    search path, that the setup continued, and that the worktree is usable,
  And the message is labelled as not stopping the setup, in words an operator and an
    agent both read the same way (for example "non-fatal").

  Given a setup that succeeds and prints 2 warnings,
  When its output is read in full,
  Then each of the 2 warnings is labelled as not stopping the setup,
  And the output ends with the setup's success result after the warnings, so no
    warning is the last thing a reader sees.

  Given a setup that does stop because of a problem,
  When its output is read in full,
  Then the problem that stopped it is labelled as stopping the setup, never as
    non-fatal,
  And the setup's result is a refusal or failure naming that problem.
