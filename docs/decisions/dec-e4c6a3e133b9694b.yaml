criteria:
  - id: crit-fixed-described-candidates
    question: Is every classifier a fixed, described candidate list that Jev can select from, without inventing categories?
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-1db7c09667f7fccf
      - ev-d43b797119207ccb
      - ev-c8c6ffd1d45f57c6
      - ev-c24fcfabbe8a475f
      - ev-96d4540ad1325310
  - id: crit-classifier-is-used
    question: Does each classifier change what happens (for example which precedents are offered in a customer's project),
      rather than being metadata nobody reads?
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-d43b797119207ccb
      - ev-9b4625c8e164d3d1
      - ev-94b6373d43d8b841
      - ev-fa9473fedc336810
      - ev-033a89fd552b2dbf
  - id: crit-human-authority-kept
    question: Below the threshold does the human decide, and above it is the label recorded as Jev's classification with its
      probability, so no record self-authorizes?
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-94b6373d43d8b841
      - ev-5e30cba917bb4d5c
      - ev-2a1c5346fab0f00c
      - ev-1db7c09667f7fccf
      - ev-4df9204888d7bbab
  - id: crit-use-existing-solution
    question: 'Use of existing solution: does it build on existing mechanisms (Jev candidate selection, config thresholds,
      the shipped/internal line, the precedent filter)?'
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-77ba37ece29b5261
      - ev-78eb68798826010f
      - ev-a297882a8da2c395
      - ev-28d22bf100a5b212
      - ev-2a1c5346fab0f00c
  - id: crit-maintainability
    question: 'Maintainability: does it keep working with little upkeep as decisions and the harness evolve?'
    priority: required
    kind: design_judgement
    evidence_ids:
      - ev-033a89fd552b2dbf
  - id: crit-user-settable-threshold
    question: Is the human-in-the-loop threshold a user setting (default 90%), risk-specific, and defined on a named number
      (winning probability or confidence)?
    priority: supporting
    kind: design_judgement
    evidence_ids:
      - ev-c1f97a54cc4a0bb3
      - ev-c24fcfabbe8a475f
      - ev-94b6373d43d8b841
      - ev-28d22bf100a5b212
      - ev-063210cdcec0f02c
  - id: crit-covers-both-case
    question: Does it handle a decision that applies to both Leafcutter and customers, such as how to fill product truth?
    priority: supporting
    kind: design_judgement
    evidence_ids:
      - ev-67881beb5eb08a66
      - ev-9b4625c8e164d3d1
      - ev-c7f562f38c7b71a6
      - ev-09c1990469eb0b40
      - ev-0ffbbb03acd632c1
  - id: crit-small-change
    question: Can it be put in place with a small change?
    priority: supporting
    kind: design_judgement
    evidence_ids:
      - ev-5bb3a288faec3b70
      - ev-a8617ef853e08b74
      - ev-952af4390d91a9fa
