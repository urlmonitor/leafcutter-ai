created_by: "docs/acceptance-criteria/build-orchestration/BO-1800-isolated-parallel-delivery/BO-1800f.yaml"
criteria: |
  Given a copy whose work is finished and ready to leave,
    and the shared branch's current state and the copy both changed the same region
    of the same file, so the copy's commits cannot be replayed onto that state
    without a decision being made,
  When the workflow replays the copy's commits onto the shared branch's current state,
  Then no part of the delivery leaves the copy,
  And the copy is returned to the state it was in before the replay began, holding
    the same commits it held beforehand,
  And no tracked file in the copy contains conflict markers,
  And the run stops and names every path whose region could not be replayed,
  And the run does not resolve the overlap on its own.
