criteria: |
  Given an agent registry where "ticket-supervisor" has spawn_allowlist
    containing both "__ticket_phase_agents__" and "llm-expert"
  And the registry entry for "llm-expert" has is_ticket_phase set to true
  When the build validates the registry
  Then validation emits a warning:
    "ticket-supervisor.spawn_allowlist: llm-expert is redundantly listed
     because it is already included in __ticket_phase_agents__
     (is_ticket_phase: true)"
  And the warning identifies the agent with the redundant spawn_allowlist
  And the warning names each individually-listed agent that is already
    covered by the __ticket_phase_agents__ macro
