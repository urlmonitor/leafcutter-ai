notes: |
  A SKIPPED RECORD IS INVISIBLE, AND INVISIBILITY IS THE DEFECT THIS WHOLE TREE EXISTS TO
  REMOVE, ONE LEVEL DOWN. The store forgot proof that existed and nothing said so; a
  repair that quietly passes over what it cannot read reproduces that exact failure inside
  the fix.

  THREE UNJUDGEABLE CASES, NOT ONE, and they are different failures that a single
  try-and-continue block would collapse. An unparseable file is an input problem, a tag
  naming no record is a reference problem, and an unresolvable coverage entry is an
  ambiguity problem — and the third is the common one, because the coverage field holds
  two kinds of thing with no discriminator (see ACS-1300a-3). Naming all three in one
  scenario also enforces the do-not-stop-at-the-first clause, which a single-case
  scenario cannot express.

  EVERY CLAUSE ABOVE THE FOURTH IS AN ABSENCE, so on its own this criterion is green on
  arrival — the easiest green in the tree, satisfied by a tool that does nothing. The
  fourth clause is the adversarial case that makes it fail, and it must stay inside the
  same Given rather than becoming a separate scenario.

  THE FIFTH CLAUSE IS THE ONE PEOPLE DROP. Reporting each abstention in a body of output
  while exiting as though the run were clean means an operator reading only the outcome
  concludes the store is fine. That is the same shape as a hook that could not run
  reporting success, which GE-120 exists to forbid.

  THE SECOND UNJUDGEABLE CASE HAS A MEASURED POPULATION, AND IT IS NOT SMALL. Of 937
  distinct tag ids in the test tree, 850 resolve to a record — so roughly 87 tags name a
  record that does not exist (measured 2026-09-01, whole tree, no sampling). That is the
  mirror of inverse rot and it was uncounted until then. Two things follow for this AC.
  First, done_proof already computes exactly this set as its dangling_tags output, so the
  abstention needs no new traversal — take it from the reader ACS-1300a-1 already uses.
  Second, at that volume the abstention list is the primary output of this AC in practice,
  so its formatting has to be usable in bulk: grouped and named, not 87 undifferentiated
  lines. Verified NOT to be fallout from the BP-100k to BP-100n split — no -6/-7/-8 tags
  survive and every remaining BP-100k-* tag resolves — so this is a standing population,
  not a one-off from a recent rename.

  WHETHER PHANTOM TAGS DESERVE A REPAIR DIRECTION IS OPEN, AND THIS AC MUST NOT SETTLE IT.
  Reporting them as abstentions is right; deciding whether the tag should be deleted, the
  record created, or the tag re-pointed is a judgement none of this tree's records make.
  The L0 records it as undecided. Do not resolve it by quietly widening this AC.

  ONE CAUSE OF PHANTOM TAGS IS A DEFECT THIS TREE IS FIXING ELSEWHERE. A tag written
  `# covers: BO-560, BO-560-1` yields the captured token `BO-560,`, which resolves to no
  record and lands in this abstention list — while BO-560 itself goes unmatched. So some
  of the 87 are artefacts of tag-token capture rather than genuinely missing records, and
  ACS-1300a-1-i's normalisation will reduce the count. Re-measure after it lands rather
  than treating 87 as a fixed target.

  THE FINAL CLAUSE KEEPS THE DENOMINATOR HONEST. If abstained records dropped out of the
  examined total, the run's own coverage figure would silently improve every time it
  understood less — the answer getting more confident as it saw less, which is precisely
  what ACS-1100 was written against.
