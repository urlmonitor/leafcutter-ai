created_by: "docs/acceptance-criteria/build-orchestration/BO-1600-safe-concurrent-dispatch/BO-1600a.yaml"
criteria: |
  Given two ticket-supervisors are driving two different tickets in parallel
    inside one shared git worktree
  And both reach their commit phase at overlapping times
  When each supervisor performs the git write portion of its commit (writing loose
    objects and updating the index/refs)
  Then the two git write portions are serialized so that only one supervisor is
    inside the git write portion at any instant
  And the second supervisor's git write portion does not begin until the first
    supervisor's git write portion has fully completed
  And neither supervisor's non-git work (planning, editing files, running tests)
    is serialized — only the git write portion is mutually exclusive
