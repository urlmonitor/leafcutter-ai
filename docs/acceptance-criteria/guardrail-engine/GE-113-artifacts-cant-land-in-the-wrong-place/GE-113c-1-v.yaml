title: "check-secrets reads the .security-allowlist from the worktree checkout root so worktree-local suppressions are honored"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given the check_secrets guard runs in an epic/feature worktree (deployed
    layout) where the hook scripts are reached via the .leafcutter symlink whose
    target resolves to the workspace parent,
  And the worktree's OWN checkout root contains a .security-allowlist with a
    suppression entry for a staged finding (for example an
    ENTROPY_HIGH:<path>:<line> entry or an ENTROPY_HIGH:<path>:* glob),
  When the guard resolves the location of the .security-allowlist in order to
    decide which findings are suppressed,
  Then it resolves the .security-allowlist from the actual checkout root (the
    worktree root) via the SAME shared root helper mandated by GE-113c-1 /
    GE-113c-1-iv — NOT from the resolved .leafcutter symlink target (the
    workspace parent),
  And the suppression in the worktree's own .security-allowlist is honored so
    the staged finding is not reported, rather than being silently ignored
    because the hook only read the workspace-root copy,
  And the verification exercises a REAL worktree with a worktree-local
    suppression that is currently ignored, asserting it becomes honored after
    the fix rather than relying on a synthetic fixture.
