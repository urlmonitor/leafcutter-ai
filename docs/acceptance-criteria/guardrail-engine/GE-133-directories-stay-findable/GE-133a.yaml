documentation_rationale: >-
  No documentation child is authored, to keep the family to two records, and that leaves
  a real gap rather than none: docs/pre-commit-hooks.md describes check-folder-density as
  refusing any folder that crosses 15, and once this L1 lands it must also state that
  declared locations are set aside and on what ground. Named here as a follow-up so it is
  not mistaken for "no docs needed". GE-127g discharged the same obligation with a
  dedicated child (GE-127g-4); a third L2 on that model is the recommended shape.
