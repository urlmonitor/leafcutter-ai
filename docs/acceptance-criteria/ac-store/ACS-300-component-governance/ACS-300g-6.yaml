assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Derive REPO_ROOT from `git rev-parse --show-toplevel`, not `Path(__file__).resolve().parents[N]`"
  - "Must resolve correctly whether the hook is invoked via the `.leafcutter` symlink or directly from the package source tree"
  - "Must handle errors gracefully per the project error handling policy (wrap the git subprocess call, no bare except)"
  - "Must not regress detail_ref validation for components whose detail_ref is null"
  - "Must complete the root-resolution call in <100ms"
  - "Root discovery must be correct under the environment git itself establishes for a hook — i.e. with GIT_DIR set and GIT_WORK_TREE unset — and must not degrade to `Path(os.getcwd())` in that environment"
  - "Must return a path that is inside a git repository even when the process CWD is not (e.g. CWD=/tmp); a root outside any repository is a failure, not a fallback"
  - "The `__file__`-anchored fallback must not silently yield `<project>/.leafcutter` in a deployed layout; if no repository root can be discovered, fail loudly rather than validating against a wrong root"
delivers_to:
  agent: python-coder
  contract: "REPO_ROOT in check_components_integrity.py derived from the stripped stdout of `git rev-parse --show-toplevel`, used as the base path for resolving every component detail_ref existence check"
expects_from: null
origin_agent: it-po-v3
created: 2026-06-22
notes: |
  REOPENED 2026-08-18. The fix that closed this AC on 2026-07-08 (commit
  4216ddcf) is vacuous: it replaced a `__file__`-anchored root bug with a
  CWD-anchored one and performs no actual root discovery. All of the
  following was re-verified on 2026-08-18 against the worktree.

  1. `_repo_root()` in
     templates/scripts/commit_guardian/check_components_integrity.py calls
     `subprocess.run(["git", "rev-parse", "--show-toplevel"],
     capture_output=True, text=True)` with NO `cwd=` argument and no
     scrubbing of the inherited environment. It therefore runs in whatever
     working directory the parent process happens to have.

  2. Git's documented behaviour: when GIT_DIR is set and neither
     GIT_WORK_TREE nor core.worktree is set, the current directory is
     treated as the top of the working tree. Git ALWAYS sets GIT_DIR when it
     invokes a hook. So in the only environment this AC is about — hook
     context — `git rev-parse --show-toplevel` returns the CWD verbatim and
     `_repo_root()` is exactly `Path(os.getcwd())`. The docstring's claim
     that this is "correct regardless of where the hook file lives" is true
     only by accident, because pre-commit happens to chdir to the top level.

  3. Demonstrated on 2026-08-18:
       env --chdir=/tmp env GIT_DIR=<linked-worktree-gitdir> \
         git rev-parse --show-toplevel
     prints `/tmp` — a directory that is not inside any repository at all.
     The helper will happily return it and every detail_ref will then be
     resolved against `/tmp/docs/...`.

  4. The fallback is `Path(__file__).resolve().parents[2]`, which in a
     deployed layout (`<project>/.leafcutter/scripts/commit_guardian/`)
     yields `<project>/.leafcutter` — i.e. precisely the wrong root this AC
     was written to eliminate. The fallback is not a safety net; it is the
     original defect.

  WARNING — THE OBVIOUS TEST CANNOT FAIL. Setting GIT_DIR while the CWD is
  already the worktree top-level returns the worktree root either way, on
  broken and fixed code alike (verified: the same command with
  --chdir=<worktree-top> returns the worktree top). Any regression test for
  this AC MUST set GIT_DIR *and* place the CWD somewhere other than the
  worktree top-level, or it will pass green against the current broken
  implementation. That exact mistake was made on 2026-08-18 and led to the
  wrong conclusion that the mechanism was sound; it is also the reason the
  defect survived six weeks in `work_status: done`.

  CORRECT PRIMITIVE (for whoever implements this). Derive the root from
  GIT_DIR when it is present: for a linked worktree, read `$GIT_DIR/gitdir`,
  whose content is `<worktree-root>/.git` and whose parent is the worktree
  root (verified: the gitdir file for this worktree contains
  `/home/henzeh/projects/leafcutter/worktrees/acs300g6/.git`). Otherwise take
  the parent of `git rev-parse --git-common-dir`. Alternatively, strip all
  `GIT_*` variables from the subprocess environment before calling
  `--show-toplevel` — this is the `no_git_env` pattern pre-commit itself
  uses. Passing an explicit `cwd=` is not sufficient on its own, because an
  inherited GIT_DIR still overrides the discovery.

  BLAST RADIUS — DO NOT FIX HERE, but do not let it be forgotten. The shared
  helper templates/scripts/commit_guardian/_resolve_root.py carries the
  identical defect and states the false premise verbatim in its docstring
  ("always reports the root of the git repository containing the current
  working directory"). Twenty scripts under
  templates/scripts/commit_guardian/ reference `--show-toplevel`, including
  check_doc_frontmatter.py, whose comments assert the same untrue thing.
  This is a family-wide defect, not a one-file defect, and a fix confined to
  check_components_integrity.py leaves the family broken. A separate AC
  should own the shared-helper remediation.

  The criteria below are unchanged and were always correct — the shipped
  implementation simply never met them. `implemented_by` is left as-is: it
  is an accurate record of which files the vacuous fix touched, not a claim
  that they satisfy the criterion.
