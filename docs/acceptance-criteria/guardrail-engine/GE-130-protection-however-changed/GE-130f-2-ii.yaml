id: GE-130f-2-ii
title: The guide-read guard refuses the same edit in a linked working copy as in the main one, and a guard
  that refuses in only one layout is named with the layout it failed in
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L3
status: active
