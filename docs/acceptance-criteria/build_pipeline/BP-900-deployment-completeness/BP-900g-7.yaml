assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  reference_file_path: "scripts/build_referential_integrity.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/ -q"
  config_schema_fragment:
    type: object
    description: "The shape of a single unresolvable-registry-entry finding emitted by the preflight. It must carry all three facts the criterion requires by name, so a consumer (report, exit message, test) reads fields rather than parsing prose."
    required:
      - registry_file
      - entry_location
      - artifact
      - kind
    properties:
      registry_file:
        type: string
        description: "Repo-relative path of the registry that carries the entry (e.g. config/package_boundary.json)."
      entry_location:
        type: string
        description: "Where inside the registry the entry sits — the key path or list index — so the author can find it without grepping."
      artifact:
        type: string
        description: "The artifact name or path that resolved to nothing."
      kind:
        type: string
        description: "Which of the two concerns this is. Must distinguish 'names an artifact that exists nowhere' from 'names an artifact that exists but is not deployed', because the remedies are different and BP-900g-7-i asserts they report separately."
  constraints:
    - "UNIVERSAL RESOLUTION, NOT A NAME LIST. The set of registries to traverse, and the fields within each that name an executable artifact, must be derived from a data source the build already reads — not hard-coded to config/package_boundary.json and config/test_requirements.schema.json, and never to the name check_test_requirements_refs.py. The criterion is deliberately written so that satisfying it for the live instance alone does not satisfy it: a registry added next month must be subject to the rule with no edit. Any exemption must derive from a data property (e.g. a registry that declares no executable-artifact fields), never from a file name."
    - "NAME EVERY ENFORCEMENT POINT AND SAY WHICH ONE GATES. scripts/build_referential_integrity.py is the natural home, but it is only load-bearing if scripts/build.py actually invokes it on the path the criterion asserts on. Before landing, confirm and state in the sign-off which build step runs the preflight and at what point. A rule written into a module the build never reaches passes source inspection while the build stays green — that is BP-811 in docs/testing/test-angles.md, and it is the exact failure this AC exists to close."
    - "RESOLVE THE LIVE INSTANCE IN THE SAME CHANGE, AND DO NOT PARK IT. config/package_boundary.json:21 and config/test_requirements.schema.json:6 both name check_test_requirements_refs.py, which does not exist. Turning the rule on without resolving both turns the next unrelated build red. Writing the script is NOT required — deleting both references satisfies this AC exactly as well, and BO-2900g-3 explicitly parks the build-it decision out of scope. Parking via an allowlist is not available: KNOWN_UNDEPLOYED_ALLOWLIST was emptied by BP-900g-5 and BP-900g-6 carries a test asserting it stays empty."
    - "DO NOT WIDEN THE OUTPUT-ROOT PREFIX BOUND. BP-900g-5 narrowed BP-900g-4's over-permissive prefix so a host-project path (debugging/scripts/...) is no longer mis-normalised into a deploy key, and BP-900g-6's negative-control tests fence it. This rule must not re-capture host-project or package-dev path forms; those tests must stay green after the change."
    - "TWO CONCERNS, TWO REPORTS. A finding for 'the artifact exists nowhere' and a finding for 'the artifact exists but is not deployed' must be distinguishable in the output, because the first is remedied by writing or deleting and the second by a deploy-map edit. An author handed the wrong one edits the deploy map, finds nothing to add, and concludes the guard is noisy."
    - "The failure must follow the project error handling policy and must not be downgraded to a warning-and-continue. The build's exit code is the observable the criterion asserts on; a run that logs the finding accurately and exits zero is the defect, not the fix (this is the same fail-open shape BP-900g-9 addresses in the deploy loop)."
    - "The pass must complete inside the existing build preflight's time budget: it reads config JSON and stats candidate paths. No network access and no per-entry subprocess."
delivers_to:
  - agent: python-coder
    contract: "A universal registry-entry resolution pass reachable from the build's real preflight entry point (`python scripts/build.py --target-dir <target>`), plus the finding record shape defined in it_requirements.config_schema_fragment: {registry_file, entry_location, artifact, kind}, where `kind` separates 'exists nowhere' from 'exists but undeployed'. Consumed by BP-900g-7-i, which asserts the same pass, through the same entry point, discriminates declaration from prose and never-written from not-deployed."
expects_from: null
test_spec:
  - name: test_bp_900g_7_unresolvable_entry_finding_names_registry_entry_and_artifact
    target_dir: unit_tests/
    framework: unittest
    type: unit
    angle: criterion
    description: "The resolution pass, given a registry entry naming an artifact that exists in neither the source tree, the template tree, nor any deploy target, produces exactly one finding carrying registry_file, entry_location, artifact and kind='missing' — asserted on the finding record's fields, not on a log string."
  - name: test_bp_900g_7_build_subprocess_blocks_on_a_registry_entry_naming_a_nonexistent_artifact
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT with the must_block modifier. Copy the package tree to a temp dir, inject a registry entry naming an artifact that exists nowhere, then run `python scripts/build.py --target-dir <tmp_target>` as a SUBPROCESS from that tree. Assert a non-zero exit and that the combined stdout/stderr names the registry file, the entry location and the artifact. Importing build_referential_integrity and calling its checker directly does NOT satisfy this: the thing under test is whether the build reaches the rule at all."
  - name: test_bp_900g_7_unmodified_package_tree_still_builds_through_the_same_subprocess
    target_dir: unit_tests/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "The paired negative control, through the SAME `python scripts/build.py --target-dir <tmp_target>` subprocess, against the REAL on-disk registries (config/package_boundary.json and config/test_requirements.schema.json read from the repo, never hand-typed dicts) after the two dangling check_test_requirements_refs.py references are resolved: exit zero and zero findings. A guard that flags everything would pass the must_block test alone; this is what distinguishes it."
test_rationale: |
  Two failure modes have to be excluded and only one of them is about the rule's logic.

  The rule can be written and never reached. The defect this AC targets is an ABSENCE —
  there is no file to inspect, so no source-tree assertion can observe it, and a test
  that greps build_referential_integrity.py for the new rule is green over a module the
  build never calls. That is why the second entry is a subprocess through
  `scripts/build.py` and why the criterion explicitly disqualifies reading the guard's
  source. must_block rides that entry because a preflight that cannot block is inert.

  The rule can also be too wide, at which point the first author to hit a false positive
  suppresses it and the suppression is permanent. The third entry is the false-positive
  control and is deliberately run against the real on-disk config files rather than
  fixtures, because the parse shape of those files — declaration lists next to
  human-readable description prose — is precisely what the rule has to survive. The
  finer discrimination (prose vs declaration, missing vs undeployed) is pinned by
  BP-900g-7-i against the same entry point.
