criteria: |
  Given the BP-1100f real-effect / real-intent verification behaviors are implemented,
  When a reader opens the build pipeline's phantom-done-prevention architecture documentation,
  Then a sequence diagram shows the end-to-end flow that proves a durable change by its real
    effect and stated intent — including the pre-dispatch intent-versus-surface consistency
    check (BP-1100f-3), the instruction-carrying dispatch review (BP-1100f-1), the
    harness-level instruction-less-dispatch violation (BP-1100f-4), the real-artifact
    test-evidence requirement (BP-1100f-2), and the automatic side-effect smoke check
    (BP-1100f-5),
  And the diagram shows, for each check, the point at which it gates the work item relative to
    dispatch and to the done state,
  And the diagram distinguishes proof by real effect/intent from proof by dispatch topology.
