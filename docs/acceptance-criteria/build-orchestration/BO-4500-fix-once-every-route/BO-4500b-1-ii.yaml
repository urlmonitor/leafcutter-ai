criteria: |
  Given the package holds a source for BETA-ANSWER,
  And no route template marks a place for BETA-ANSWER,
  And BETA-ANSWER is not declared as awaiting adoption,
  When the package is installed,
  Then the install fails with a message naming BETA-ANSWER as a block no route uses,
  And every installed route is byte for byte as it was before that install began.

  Given the same package, with BETA-ANSWER declared as awaiting adoption by the records
    BO-9999a-1 and BO-9999a-2,
  When the package is installed,
  Then the install completes,
  And its report names BETA-ANSWER as awaiting adoption by BO-9999a-1 and BO-9999a-2.

  Given BETA-ANSWER is still declared as awaiting adoption,
  And route B's template now marks a place for BETA-ANSWER,
  When the package is installed,
  Then the install fails with a message naming BETA-ANSWER's awaiting-adoption declaration as
    stale because route B uses the block,
  And every installed route is byte for byte as it was before that install began.
