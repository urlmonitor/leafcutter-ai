test_spec:
  - name: test_reduced_run_result_carries_total_and_per_file_paths_counts_and_names
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The two-file reduced staged set yields a reduction record with total 3 and, for each of the two files, its repository-relative path, its own withheld count and the stable reduction name — read as structured data, never by parsing the printed notice"
  - name: test_clean_run_result_carries_an_explicit_zero_and_an_empty_file_list
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "A staged set of src/app.py and leafcutter-web/app/page.tsx with no credential-shaped content still carries the record, with total 0 and an empty list — the negative control that fails an implementation attaching the record only when something was withheld"
  - name: test_reduced_run_and_clean_run_are_indistinguishable_by_exit_status
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The reduced run and a run over the same two files with the credential-shaped content removed produce the same exit status, so the record is demonstrably the only thing carrying the distinction"
  - name: test_record_is_complete_when_the_printed_notice_is_abbreviated
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "On the 30-file / 412-withheld run of GE-125d-3, the notice lists ten files plus a remainder line while the record carries all 30 files and the exact total 412 — abbreviation is a display choice and never a loss of information"
  - name: test_record_carries_no_matched_value_line_or_excerpt
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A distinctive marker embedded inside each withheld value appears in no field of the record and on neither stream — the never-echo rule extended to the structured form, which is the one most likely to be serialised and retained"
  - name: test_record_is_not_emitted_as_text_on_either_stream_on_a_clean_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "On the clean run the record is readable in-process while both streams stay empty for this check, proving the record was not delivered by printing structured text and does not collide with GE-125d-3's silence"
test_rationale: "The record's failure modes are absence, derivability only from the exit code, and being a string a caller must match — none of which a test over a formatter's return value can see. Each entry therefore runs the check on the path a real commit takes and reads the record as structured data from the result, not from the printed output. The clean-run zero entry is a negative control of its own kind: an implementation that attaches the record only when something was withheld reads as correct until the day a caller has to distinguish an old check from a quiet one, and no other entry fails it. The exit-status entry is what proves the claim in the AC's own reasoning — that the exit code structurally cannot carry the distinction — by showing the two runs are identical on that channel. The completeness entry crosses into GE-125d-3's 30-file run deliberately, because truncation is only observable where the notice is abbreviated. The marker entry extends GE-125d-1's absence-based assertion to the structured form, which is the shape most likely to be serialised into a build artefact and retained. The last entry is a seam test because the record and the two streams are separate consumers of the same run, and the requirement is precisely that satisfying one does not contaminate the other."
