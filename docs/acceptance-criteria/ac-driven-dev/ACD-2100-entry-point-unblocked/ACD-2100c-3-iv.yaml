readiness: approved
priority: high
title: "Resuming a paused run stays on the route it was paused on instead of re-triaging into a different decision"
component: ac-driven-dev
level: L3
status: active
req_status: draft
work_status: done
roadmap_phase: phase_1
criteria: |
  Given a run paused at a decision point other than covered-route-gate (for example
    final-gate) whose durable pause record exists on disk, and whose own earlier stages
    have already written and committed their AC records to the store, so that a fresh
    triage of the same request would now classify it as 'covered',
  When the route is started again with the person's answer supplied for that decision
    point (args.resume_answer naming the gate the pause record names),
  Then the resumed run reaches that decision point on the route the paused run was on --
    taken from the paused record, not recomputed by a fresh triage against the current
    store -- and applies the person's answer to it exactly as ACD-2100c-3 requires,
  And covered-route-gate is never opened for such a resume,
  And when the run pauses at any gate, the route it is on is recorded in that pause's
    context so a later resume can take it from there,
  And a fresh run (no resume_answer) and a resume of covered-route-gate itself keep
    today's Stage 0 triage behaviour unchanged,
  And the bug symptom ("Resuming a paused /plan-feature run (args.resume_answer set, a durable pause record naming e.g. final-gate) re-runs Stage 0 triage before reaching the paused gate. When the run's own earlier stages have already written and committed their AC records, triage now sees them, classifies the request as 'covered', and the run pauses at covered-route-gate instead of applying the person's answer at the gate it was paused at. Seen 2026-10-21 on run pf-shared-code-inliner-20261021b: the person answered the final gate with approve + priority high, the resumed run returned {status: paused_awaiting_input, gate_id: covered-route-gate}, and the approval was never applied (it had to be applied by hand).") must not occur.
depends_on: [ACD-2100c-3, ACD-2100c-3-ii]
