id: BO-1700c-1-iii
components:
  - build_orchestration
readiness: approved
priority: medium
title: "If any hook other than a stage canary is ordered before the self-healing hook the guard fails closed"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1700-worktree-quality-gate-guard/BO-1700c.yaml"
criteria: |
  Given the manifest is misconfigured so that a hook other than a stage canary (the
    precommit-canary-* members BO-4300c-1-ii places first) is registered before the
    self-healing hook,
  When the ordering is evaluated,
  Then the guard reports the mis-ordering, fails closed, and does not allow a hook
    to run against an unrestored config (a hook that would otherwise run before the
    config is re-materialized).
  And the guard's message names the hook that precedes the self-healing hook.
  And given only the stage canaries are registered before the self-healing hook, the
    ordering is accepted.
depends_on: [BO-1700c-1]
doc_links:
  - path: docs/architecture/components/commit-guardian.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-001-self-hosting-boundary.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements: |
  The first-after-the-stage-canaries registration invariant (BO-1700c-1, amended
  2026-10-21) is verifiable; a violation is a
  FAIL-CLOSED condition, not a warning, because a hook running before the heal would
  run against a possibly-unmaterialized config. Implemented in the self-healing hook
  (BO-1700c-1); ADR-001 deployed/template parity applies (manifest canonical source
  is the templates/scripts/commit_guardian/ copy).
test_required: true
test_spec:
  - name: test_non_canary_hook_before_self_heal_fails_closed_naming_it
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      With a manifest that registers a hook other than a precommit-canary-* member before the
      self-healing hook, the ordering guard fails closed (not a warning), no hook runs against
      the unrestored config, and the guard's message names the hook that precedes the
      self-healing hook.
  - name: test_only_stage_canaries_before_self_heal_is_accepted
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      With a manifest whose only entries before the self-healing hook are the stage canaries,
      the ordering guard accepts the ordering.
delivers_to: null
