notes: |
  THE NEGATIVE CLAUSE, and BO-3100e says it is binding: nothing here may be
  satisfied by loosening what a step owes. Three defences, one per scenario after
  the first — an omission fails rather than passes, every nothing-declaration is
  counted and named so the rule cannot mark nothing while appearing to mark
  everything, and a declaration downgraded to nothing is surfaced as the reduction
  it is.

  BO-2900g-2 records why the third scenario is not optional: a rule that marks
  everything is indistinguishable from one that marks nothing, one gate later. Its
  own finding was a declaration set on 0 of 2,888 records — a correct mechanism
  firing on nothing, which is exactly what the count in that scenario would expose.

  BOUNDARY vs BO-3100b-3: that record asks whether a step may legitimately change
  nothing in the project. This one asks what a step declares its own result to be.
  A step can legitimately change nothing and still owe a specific observable result,
  and a step can change a great deal and owe none.
