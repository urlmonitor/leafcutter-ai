criteria: |
  No orphaned processes or blocked ports left behind after a check.

  Whenever the pipeline starts your app to test it, it reliably stops that app and
  releases the port afterward — even when the feature wraps up or is finalized —
  so repeated runs never accumulate zombie server processes or leave ports stuck.
