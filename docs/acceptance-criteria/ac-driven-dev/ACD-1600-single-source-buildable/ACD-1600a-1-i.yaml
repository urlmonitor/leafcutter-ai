it_requirements:
  - "Canonical source to change: scripts/ac_store/generate_ticket_from_ac.py (source-only Python; no templates/ counterpart)."
  - "On an unresolvable source AC id the generator must abort per the project error-handling policy; the error must name the unresolved AC id."
  - "The abort path must NOT fall back to embedding any partial criteria (or any spec field) into a ticket body."
  - "The operation must be atomic on failure: no ticket file (and no partial ticket file) is left on disk when generation aborts."
