notes: |
  A REGRESSION INTRODUCED BY REMEDIATION. This is not a defect the hardening batch
  found; it is one the hardening batch created. Before the fix, a ticket with no phase
  to run left the drive by a separate route that wrote nothing at all -- harmless.
  The fix made every ticket leave by the single completion exit, which is the right
  shape, and made that exit write-capable. It did not guard the case where the exit is
  reached having verified nothing. So the batch whose entire purpose is preventing
  phantom-done shipped, in the same diff, the purest phantom-done there is: a ticket
  for which zero phases were required, zero were dispatched and zero sign-offs exist,
  recorded as done.

  THE GUARD WAS APPLIED ONE LAYER TOO SHALLOW. The code's own docstring already names
  this hazard -- an empty required set would say yes to every ticket -- and a guard was
  written for it, but placed at the branch where the drive notices it has no phases to
  run, rather than at the decision that turns a required set into a verdict. Anything
  that reaches the decision by another route is unguarded, and BO-1900a-4-ii is exactly
  such a route. Two bugs, one missing guard, and the second one is only reachable
  because the first one exists.

  WHY THIS IS A SEPARATE RECORD FROM BO-400a-2-iii. That sibling covers phases that
  exist and did not prove themselves: skipped, blocked, unrecorded, unreadable. Every
  one of its checks is a check performed per phase. Over an empty set of phases all of
  them pass, and they pass silently. The set being empty is a different condition from
  anything in the set being bad, and it needs its own record or the fix for one will
  keep being read as the fix for both.

  WHAT THE OPERATOR SEES TODAY. Nothing. That is the whole problem: the ticket reads
  done, no phase failed, no message was emitted, and there is no artifact anywhere that
  says the drive verified nothing. The defect is only visible by noticing that a ticket
  marked done has no sign-offs -- which is the manual audit the done record exists to
  make unnecessary.
