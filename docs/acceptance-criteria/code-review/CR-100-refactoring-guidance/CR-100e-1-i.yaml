criteria: |
  Given a developer pastes a code snippet that has no associated file path,
  When /code-smell-review is invoked on that snippet,
  Then the review still runs and produces a report,
  And each finding's file field identifies the source as the pasted snippet
    rather than failing or leaving the field blank.
