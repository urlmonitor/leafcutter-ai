roadmap_phase: phase_1
created_by: docs/acceptance-criteria/build-orchestration/BO-2000-correct-prompts-by-construction/BO-2000g.yaml
criteria: |
  Given the signoff skill,
  When an agent reads its rules for the body of a Comments entry,
  Then the skill defines, in exactly one place, the value `feedback-id: (not-a-signoff)`
    for a Comments entry that does not sign off the writing agent's own phase,
  And it states that this value is written without calling the feedback submission step,
  And it states that the value never stands in for an id on an entry that signs off the
    writing agent's own phase, and never replaces the failure fallback on a phase
    sign-off whose submission failed,
  And no other agent template or skill restates that definition; each one that uses the
    value refers to the signoff skill for it.

  Given the Comments-entry examples that record a note rather than the writing agent's
    own phase sign-off:
      - the commit agent's supervised-path audit entry
        ("Auto-authorized commit gate: subject ...; files: ...");
      - the ticket-supervisor template's test-writer skip entry and its
        contract-shrinking warning;
      - the building-epics skill's produces-trait warning and its contract-shrinking
        warning;
      - every entry in which ticket-supervisor marks a skipped phase signed off on that
        phase's behalf -- in the building-epics skill, the ac-validator skip entry and
        the test-writer skip entry,
  When an agent reads any one of those examples,
  Then the first line of the example's body (the line directly under its heading) is
    exactly `feedback-id: (not-a-signoff)`,
  And it is not a real-id placeholder, an invented id, or the failure fallback.
depends_on:
  - BO-2000g
