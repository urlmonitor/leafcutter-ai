notes: |
  THIS IS THE RECORD THE TREE CANNOT BE BUILT CORRECTLY WITHOUT, AND THE ONE MOST LIKELY TO
  BE DROPPED AS "NOT A REQUIREMENT". Every other record in BO-3800 is satisfied by a system
  that engages a restructuring specialist on EVERY refusal. That system is cheaper to build,
  passes every positive arm of BO-3800a, b, c and d, and is a serious regression in three
  independent ways: it dispatches a restructuring specialist to remove two lines for a typo
  fix; it collides head-on with BO-210's same-agent promise across that promise's entire
  population, which is approved, active and priority high with three approved children; and
  it makes the urgent one-line correction expensive in exactly the way GE-127f's "zero
  addition costs nothing" decision exists to prevent. Without this record the cheapest
  implementation of this tree is the one that breaks the most.

  IT IS ALSO THE SEPARABILITY EVIDENCE FOR THE WHOLE TREE, AND THAT IS A REQUIRED OBSERVATION
  RATHER THAN A CLAIM. Its named mutation below is the one injection in this tree whose
  stay-green half spans every sibling: under the over-broad summons, BO-3800a-1, BO-3800b-1,
  BO-3800c-1, BO-3800d-1 and BO-3800d-2 must ALL stay green while both arms here go red. If
  that run reddens a sibling as well, the siblings were never independent of this one and
  the tree is one promise written several times — which is a FAILURE of the observation, not
  a stronger result. Conversely, every other record in this tree names both arms of this one
  in its own stay-green half, which is the other direction of the same evidence.

  WHAT "EXACTLY AS TODAY" MEANS HERE, SO IT IS NOT READ AS A FREEZE. It means the parties
  engaged, their order, and the delivery outcome are unchanged. It is NOT a claim that no
  code changes, and no clause above is about which files were edited — BO-3800e's notes
  forbid decomposing it that way. The comparison is therefore between two runs of the same
  ticket and the same refusal, one with the capability and one without, which is the only
  construction that makes "as today" observable rather than asserted.

  THE SECOND ARM COVERS THE POPULATION NOBODY WILL THINK TO TEST. Every standard in the
  repository that refuses today states no disposition at all, because the disposition is a
  new fact GE-127f-3 introduces for one rule. An implementation that reads the disposition
  field and treats its ABSENCE as the specialist case — or that treats any refusal reaching
  the new code path as a specialist case — passes the first arm, because there the field is
  present and says "author". Only the second arm catches it, and it is the arm that governs
  every other gate in the guardrail suite.

  THE BOUNDARY WITH BO-3800b-2, STATED SO THE TWO ARE NOT READ AS DUPLICATES. BO-3800b-2's
  paired arm asserts that the party engaged MOVES when the disposition moves; it says nothing
  about whether the author-clearable route still behaves as it did. This record asserts that
  it does — same parties, same order, same outcome as a run without the capability — and adds
  the no-disposition population BO-3800b-2 never touches. A build can pass BO-3800b-2's pair
  and fail both arms here.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift it
  verbatim into a test descriptor.

  THE OVER-BROAD SUMMONS. MUTATION: on any refusal at delivery, engage the restructuring
  specialist, without reading the stated disposition and without requiring one to be present.
  MUST GO RED: both arms of this record.
  MUST STAY GREEN: every arm of BO-3800a-1, BO-3800b-1, BO-3800c-1, BO-3800d-1 and
  BO-3800d-2, and both arms of BO-3800e-2 — the over-broad build satisfies all of them, which
  is the whole reason this record exists. An injection run that reddens any of those is a
  FAILURE of this descriptor even though it looks like a stronger result.
  EXPECTED COUPLING, TO BE REPORTED RATHER THAN SUPPRESSED: BO-3800b-2's paired
  author-clearable arm also reddens under this injection, necessarily, because that arm and
  this record's first arm observe the same run from two angles. Record it; do not suppress it
  and do not treat it as evidence the two records collapse.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's, which runs after
  this pass.
