notes: |
  This is the facet that makes the goal worth having rather than merely tidy. A
  run builds the connected group it resolves, not the one requirement it was
  aimed at, so the fraction of STARTING POINTS that refuse is higher than the
  fraction of records that are unbuildable. Fixing routing alone (BO-3500a)
  without this would leave that unchanged for any group that mixes kinds.

  EXPLICITLY FORBIDDEN AS A SOLUTION, inherited from KI-BO-013 and from
  BO-2400f-12: building the code members and dropping the rest. A member removed
  from a group and left unfinished is indistinguishable, from the store, from a
  member nobody ever asked for. Partial success is not success here, and any
  decomposition that produces one has missed the criterion.
