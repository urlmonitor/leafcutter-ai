it_requirements:
  - "The section is computed from the frontmatter `spawn_allowlist` declaration (AR-300c-5's parse) with `__ticket_phase_agents__` resolved and each sub-agent named once. It is placed by the declaration-driven append that delivers the skills section (scripts/agent_skills_declaration.py append_declared_skills is the precedent) -- NOT by the `{{my_spawn_allowlist}}` body placeholder, which no template carries and which AR-300d-5 forbids."
  - "The existing build_per_agent_spawn_table (scripts/injection_builders.py) renders Agent | Role | Tier but reads the REGISTRY spawn_allowlist; see AR-300c-5 for the reuse-or-replace rule. scripts/injection_builders.py may not grow; new logic goes in a new module, and scripts/template_compiler.py takes only wiring."
  - "COLUMNS (decided by IT PO): the section must name every permitted sub-agent; Role and Tier columns MAY be carried, read from the registry `role`/`tier` fields (these are not part of the permission and remain authored there), but a sub-agent with no registry row (e.g. a project-local agent) is still named, with the extra columns blank -- presentational columns must never gate naming. Nothing in the section is hand-typed."
  - "The section has ONE stable, generated heading/structure, defined once and shared by the producer and by AR-300a-5-i's single-account detector, so the detector anchors on emitted structure rather than on a heading string prose can also contain."
  - "Absent and empty declarations both produce NO section (no heading followed by an empty list), and register no preparation (so AR-300b-1-iii does not report them)."
  - "The compiled section MUST be computed and registered through the slice-3 delivery contract -- compute_preparation('spawn_allowlist', agent, builder) and register_preparation('spawn_allowlist', agent, content, destination_offered=True) in scripts/agent_preparation_delivery.py -- so the AR-300b gate covers it by construction (see AR-300b-1-iii). preparation_name is the literal 'spawn_allowlist'."
  - "Evidence is the compiled prompt in every platform root under the declared output root (<output_root>/agents/ and <output_root>/gemini/agents/). Read-only tests use the session-scoped shared_reference_layout fixture with @pytest.mark.shared_layout_reader; no test spawns its own build.py."
test_spec:
  - name: test_every_permitted_agent_compiled_prompt_carries_one_sub_agent_section
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: deployed
    description: "For every agent whose declaration permits a sub-agent (population derived from declarations), each compiled prompt in both platform roots carries exactly one sub-agent section."
  - name: test_section_names_every_declared_sub_agent_once_with_macro_resolved
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Each section names every declared sub-agent exactly once; ticket-supervisor's names every agent whose is_ticket_phase is true and never the literal macro token."
  - name: test_absent_or_empty_declaration_yields_no_section
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: boundary
    description: "An agent with no declaration and an agent with `spawn_allowlist: []` (ac-triage) carry no sub-agent section and no bare heading."
  - name: test_delivery_evidence_counts_examined_and_permitted_and_fails_on_zero
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: boundary
    description: "The comparison states how many compiled prompts it examined and how many held a permission, enumerates both roots, and fails rather than passing on an empty population."
  - name: test_delivery_is_read_from_compiled_prompt_not_registry
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: discrimination
    description: "With the section stripped from one compiled prompt while the declaration and registry are correct, the delivery assertion fails for that agent."
    must_catch:
      - "the assertion checks the registry or the template instead of the compiled prompt"
test_rationale: >-
  Every agent receives nothing today while the registry and builder look correct, so
  only compiled-prompt evidence discriminates; the stripped-section descriptor carries
  must_catch for that reason. The macro descriptor exists because printing the macro
  token satisfies 'names the declaration' and tells ticket-supervisor nothing. The
  population descriptor guards the universal against an empty or single-root run.
delivers_to:
  agent: python-coder
  contract: >-
    One generated sub-agent section per permitted agent in every compiled prompt,
    and one registered preparation per (agent) via
    register_preparation(preparation_name="spawn_allowlist", agent=<prompt stem>,
    content=<section text>, destination_offered=True) -- consumed by AR-300b-1-iii
    (gate), AR-300a-5-i (single account) and AR-300d-5 (add/revoke).
expects_from:
  ac_id: AR-300c-5
  contract: "Per-agent spawn_allowlist_resolved (macro expanded, deduped) from the single frontmatter parse; None/empty means no section."
