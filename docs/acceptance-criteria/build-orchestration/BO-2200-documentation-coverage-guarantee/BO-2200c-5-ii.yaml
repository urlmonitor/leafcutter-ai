readiness: approved
priority: medium
title: "Owning a source file is not owning a document, and owning no document produces no invented target"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given a leaf AC whose `doc_links` declare ownership over both a source file and a document --
    `scripts/ac_store/generate_ticket_from_ac.py` with `relationship: modifies`, and
    `docs/how-to/generate-a-ticket.md` with `relationship: creates`,
  When a ticket is generated from that AC,
  Then the documentation target named on the contract line is `docs/how-to/generate-a-ticket.md`
    and never `scripts/ac_store/generate_ticket_from_ac.py`, while the source file still appears
    in `files_touched` -- an ownership relationship on a non-document path is an edit surface, not
    a documentation deliverable.

  And given a second leaf AC whose only ownership entries are source files, with no owned
    document among its `doc_links`,
  When a ticket is generated from it,
  Then the generator determines that the record owns no documentation target, and produces no
    contract line for it.
  And no substitute path is invented: the `docs/<genre>/<slugified-ac-id>.md` target that is
    computed today whenever the links yield nothing is not produced, so a record is never handed a
    document that exists nowhere, that no other record references, and that only exists because a
    path had to be filled in.

  And the determination is stated in the generator's run output as an explicit outcome -- naming
    the record and the reason it owns no documentation -- so "this record owns nothing" is
    distinguishable from "the doc_links could not be read". A silent empty result is not
    sufficient: the two cases must be told apart from the output alone.
