notes: |
  Produced for GE-124e's `documentation_triggers: [how-to]`. The PO's reason is
  precise: this failure and a test-coverage failure look superficially
  identical, so the reader has to be told plainly that satisfying this one is
  not the same as proving the criterion.

  The in-progress clause guards the perverse incentive this gate creates in the
  opposite direction from the usual one. A reader who learns that in-progress
  criteria are skipped might reach for that as an escape; a reader who does NOT
  know it might mark something done to make a message go away. Stating the rule
  removes the second, and GE-124e-1 makes the first useless because the
  criterion comes straight back the moment it is finished.

  THE SECOND SCENARIO IS THE COST OF DIFF-SCOPING, paid in documentation. Under
  GE-124e-4 a legacy criterion fails on the day someone first touches its
  screen, which to that person looks like their change broke something. Telling
  them the gate had never examined it — and that its earlier silence was not a
  pass — turns an apparent regression into the backfill it actually is. Without
  this clause the most likely reaction is to look for the "recent change" that
  caused it, and the second most likely is to ask for the gate to be turned off.
