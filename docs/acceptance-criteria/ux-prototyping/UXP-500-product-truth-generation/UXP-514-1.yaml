id: UXP-514-1
title: "D1: a step whose stated implementation status disagrees with its criteria is named"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given a journey in which one step states its implementation status as done while one of the
    acceptance criteria that step names is not done,
  When the record is checked,
  Then the check reports that step, naming the journey, the step, the status the record holds
    and the status recomputed from the criteria the step names,
  And a step whose stated status equals the recomputed one is not reported,
  And the check states how many steps it recomputed, and that figure rises by one when a step
    is added.
