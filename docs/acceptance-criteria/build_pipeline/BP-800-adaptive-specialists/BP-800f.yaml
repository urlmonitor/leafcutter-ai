criteria: |
  The system recognizes and provisions specialists for relational, document, and graph databases.

  When the project uses a NoSQL document store or a graph database, the
  system detects it and generates an appropriate specialist — not just
  agents for relational SQL. Each database paradigm gets its own behavioral
  best practices.
