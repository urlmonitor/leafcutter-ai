criteria: |
  Given someone deciding a conflict for the first time,
  When they read the reference entry for conflict verdicts,
  Then it states the four states a conflict can be in,
    And for each of the three resolutions it states which record changes, what is
      recorded about the change, and what does not change,
    And it states that not-yet-decided is a recorded state that keeps the conflict
      outstanding rather than a way of dismissing it.

  Given the reference entry,
  When each verdict it describes is recorded against a real conflict,
  Then the records change as the entry says they will,
  So the entry is verified against the behaviour rather than against an intention.

  Given the reference entry,
  When a reader looks for what happens after a conflict is resolved,
  Then it states that a resolved conflict is not re-raised while the facts behind
    the decision hold, and is raised again when they change,
  So nobody records a resolution believing it is permanent.

  Given the reference entry,
  When the states it documents are compared against the states a conflict can
    actually be recorded in,
  Then the two sets are the same,
  So a fifth state cannot exist in the system while being absent from the entry,
    nor be documented while unavailable.
