assigned_agent: python-coder
delivers_to: {"agent":"python-coder","contract":"kernel.entity_projection.entity_context_payload(context,send_repo_excerpts=True)->dict returns {schema_version,kind,status,entities,unresolved,coverage,budgets,limitations}; each retained card uses one representative match and occurrence_count. kernel.entity_projection.attach_entity_context(state,context,max_state_chars,send_repo_excerpts=True,*,questions=None) preserves required state and enforces exact canonical serialization of the complete {state,questions} receiver envelope. This is a stronger entity-path policy than legacy provider state-only validation; required overflow raises JevPayloadTooLarge before provider invocation."}
