it_requirements:
  - "The worktree-safety rule is authored into the coder agent templates that may touch package source from inside a worktree: templates/agents/python-coder.md primarily, and the complementary coder templates templates/agents/frontend-coder.md and templates/agents/sql-coder.md if they carry the same build/deploy guidance. State the rule as a standing instruction in the agent body, not as a runtime check."
  - "The rule has three parts, mirroring the criteria: (1) never run build.py or build-self.sh against the worktree root while working inside a feature/epic worktree; (2) when a deploy-output behavior must be exercised, run the build with a disposable target directory outside the worktree (e.g. --target-dir /tmp/<scratch>), never the worktree root; (3) for a dual-tree templated file, edit the package source under templates/ directly and confirm tree parity by comparison, never by running the build to 'sync' from inside the worktree."
  - "This is the complementary half of the existing dual-tree-parity guidance (KI-1, added to python-coder.md): that guidance covers editing both trees in parity; this AC adds the build-invocation-safety rule (never deploy over the worktree; use a disposable --target-dir). Co-locate the two so a coder reads them together."
  - "Grounded in ADR-001 (self-hosting boundary): build.py / build-self.sh deploy the package into a target root by deleting and regenerating tracked build-output directories, the generated cards, and INDEX -- so deploying into a worktree root destroys the working diff. The instruction text must make this consequence explicit so the rule is self-justifying to the agent."
  - "Prompt/template instruction change only: no new flags, scripts, exit codes, or runtime guards are prescribed by this AC. The agent already has access to build.py's --target-dir flag; this AC fixes only the standing behavioral rule (WHAT the coder must and must not do), leaving the HOW of any deploy test to the coder."
