notes: |
  Observed 2026-11-16, run wf_f26bd73c-98c: a claim killed part-way was reported as "never
  attempted" and nothing was released, "because a decline nothing was claimed on". That
  sentence is only true of a decline. A reply that says nothing about whether the command ran
  must not be read as proof that it did not.

  CONTRADICTION WITH A DONE RECORD, FLAGGED NOT FIXED. BO-2400f-5-iii (done) says, in its
  it_requirements, that for a command-step-runner dispatch "a reply without exit_status is a
  decline", and its test_spec treats an empty or unparseable reply as a declined step. This
  record narrows that for command steps: only the runner's explicit decline is a decline;
  every other reply without an exit status is state unknown. For specialist agents
  (test-writer, coder, pr-reviewer) BO-2400f-5-iii is unchanged. BO-2400f-5-iii needs an
  amendment, and its work_status a reset, once this record is approved; the BA does not edit
  another run's record.

  Before the claim (resolve, producibility) a state-unknown step changed no acceptance
  criterion, because those steps only read the store; BO-2400f-10-iii's pre-claim rule (no
  release) still applies. After the claim, BO-2400f-10-iii's release rule still applies.
