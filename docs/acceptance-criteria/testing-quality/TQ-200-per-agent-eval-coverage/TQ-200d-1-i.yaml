id: TQ-200d-1-i
components:
  - testing_quality
  - llm_authoring
title: "The refresh-gate row is scored by running the produced test against the wrong version, not by a judge's opinion of it"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: in_progress
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the test writer's output for the "refresh gate" row is a test and a
    report, and three such outputs are scored —
      O1: a test that passes on the gate as written and fails when the
          retry_due condition is dropped, with a report naming that wrong
          version,
      O2: a test whose fixture sets refresh_due but never retry_due, so it
          passes on the gate as written and also when the retry_due condition
          is dropped, with a report that says it catches that wrong version,
      O3: the same test as O1, with a report that names no wrong version,
  When the row is scored,
  Then the test half of the score comes from running each produced test on
      the gate as written and on the gate with the retry_due condition
      dropped, through the same wrong-version runner the build routes use,
    And O1 passes both halves,
    And O2 fails the test half, whatever its report or a judge says about it,
    And O3 passes the test half and fails the report half,
    And the row's result shows the test half and the report half separately.
depends_on:
  - TQ-200d-1
  - TQ-500g-1-i
