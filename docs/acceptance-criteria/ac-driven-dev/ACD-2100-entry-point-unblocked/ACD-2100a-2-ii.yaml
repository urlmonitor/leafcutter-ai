  - name: test_both_subcommands_reached_through_their_real_command_line_entry_points
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "templates/scripts/setup_ticket_worktree.py invoked as a subprocess with real argv for the create-ac-worktree and create-fastlane-worktree subcommands, cwd set to the non-repository directory and no repository location supplied"
    description: >-
      Each subcommand is exercised in a fresh subprocess through the script's own
