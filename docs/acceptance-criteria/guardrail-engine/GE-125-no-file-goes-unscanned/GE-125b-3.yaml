id: GE-125b-3
components:
  - security_scanner
  - commit_guardian
title: "What counts as prose is a closed list of file kinds, and an unlisted kind is fully checked"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the reduced scrutiny is granted only when both conditions hold together —
    the file is at one of the four listed locations, AND its kind is one of two
    admitted non-executing kinds: Markdown (.md) and plain text (.txt),
  And five files are staged for commit in the skill-prompt area of a throwaway
    git repository, at the repository-relative paths
    "templates/skills/some-skill/scripts/deploy.sh",
    "templates/skills/some-skill/data/fixture.json",
    "templates/skills/some-skill/scripts/entrypoint" — a file with no extension,
    "templates/skills/some-skill/config.yaml",
    "templates/skills/some-skill/README.md",
  And each carries one identical line holding the twenty-four-character opaque
    token used throughout this tree,
  And no suppression entries are in force,
  When the staged set is checked by the pre-commit secrets check,
  Then exactly four shapeless-value findings are reported — one each for the
    shell script, the JSON data file, the extensionless file and the YAML file,
  And no finding is reported for "templates/skills/some-skill/README.md",
  And the check exits reporting findings present, so the commit is blocked,
  Because admission is by presence on the list. A kind that is not on it is fully
    checked, and having no extension to match is not a way onto the list. YAML is
    on no list any more: the product owner decided on 2026-08-25 that the
    acceptance-criteria store shall be scanned, so a .yaml file at a listed
    location is checked like any other unadmitted kind.

  Given a file of a kind this project does not currently use is staged in the
    same area at "templates/skills/some-skill/notes.adoc", carrying the same
    token,
  When the staged file is checked by the pre-commit secrets check,
  Then it IS reported and the commit is blocked,
  Because a file kind arrives fully checked and becomes admitted only by someone
    deliberately adding it to the list. Resembling prose is not admission — if it
    were, the next kind anyone invents would arrive already exempt and nobody
    would have decided that.

  Given a sixth file at "scripts/build_probe.py", whose path contains none of the
    four listed names, is staged in the same run carrying the same token,
  When the staged set is checked by the pre-commit secrets check,
  Then it IS reported,
  Because the one silent file in these scenarios is only evidence of an exemption
    if a file the exemption cannot reach is reported in the same run.
depends_on:
  - GE-125b
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "CANONICAL SOURCE — A DEPLOYED-COPY-ONLY FIX IS REVERTED BY THE NEXT BUILD. The admitted-kind constant and the gate that reads it land in `templates/scripts/commit_guardian/check_secrets.py`, beside `_PROSE_FILE_PREFIXES`, `_is_prose_exempt` and `_filter_prose_findings`. `scripts/commit_guardian/check_secrets.py` and `.leafcutter/scripts/commit_guardian/check_secrets.py` are build outputs per ADR-001, and `templates/commit-guardian/` holds the legacy manifest; `check_hook_parity` enforces all four locations. Run `python scripts/build.py --target-dir .` and re-run the commit_guardian suite before claiming this."
  - "PRODUCT DECISION MADE 2026-08-25 — THE ADMITTED LIST IS `.md` AND `.txt`, AND A CODER MAY NOT SILENTLY RE-WIDEN IT. Build the list exactly as this AC specifies: `.md` and `.txt`, and nothing else. This was an OPEN product decision until 2026-08-25, when THE PRODUCT OWNER DECIDED THAT THIS REPOSITORY'S OWN ACCEPTANCE-CRITERIA STORE SHALL BE SCANNED for opaque credentials — a `.yaml` or `.yml` file no longer inherits the location exemption, so `docs/acceptance-criteria/**.yaml` is scanned by `ENTROPY_HIGH` from now on. THE EVIDENCE THE DECISION WAS TAKEN ON, measured against the real scanner over all 3,260 store records with the location exemption disabled and the `TICKET-`/`EPIC-` residual-entropy filter still applying: 58 findings across 48 files, 1.4% of the store; 7 distinct strings and every one of them a file path, the top three being a `created_by` value naming an acceptance-criteria YAML record (20 occurrences), a `doc_links` path naming a component `PROJECT_CONTEXT.md` (14) and a `doc_links` path naming an agent `PROJECT_CONTEXT.md` (10); they clear the 4.5 threshold at 4.51-4.56 only because a long slash-separated path has high character diversity; a sweep of the same 3,260 files for real credential markers — AWS, PEM, GitHub, Stripe, Slack, Google, JWT, connection strings, Anthropic, OpenAI — returned ZERO hits; and `.security-allowlist` already carries an `ENTROPY_HIGH:docs/build-dataflow.json:*` glob as precedent for suppressing exactly this path-slug false-positive class. TWO THINGS THE DECISION DID NOT CHANGE. The LOCATION list is untouched — `docs/acceptance-criteria/` remains one of the four reduced-scrutiny locations and only the kind gate narrowed. And the `TICKET-`/`EPIC-` residual-entropy filter survives everywhere, regardless of location and regardless of kind; it is not path-gated, it is why the measured number is 58 and not 625, and nothing here may be read as saying that store lines carrying ticket identifiers now report. THE FENCE STAYS AND ONLY ITS SUBJECT CHANGES, FROM UNRESOLVED TO RESOLVED-DO-NOT-REOPEN. A coder, reviewer or test-writer must NOT add a kind back to the list, must NOT remove one, and must NOT edit the list to make a test pass — including re-admitting `.yaml` because the AC store has started producing path-slug findings, which is the expected and already-measured outcome and is handled by a `.security-allowlist` glob rather than by widening the gate. This decision is CLOSED and may be reopened only by the product owner, on the same authority and with the same kind of measurement. If implementation surfaces a reason to change the list, STOP and raise it as a product question."
  - "ONE CLOSED CONSTANT, READ EVERYWHERE, DEFAULTING TO REPORTED. The two kinds are a single named module-level constant that the gate reads; no second copy, and no per-location kind list (a YAML-only rule for the store and a Markdown-only rule for the ticket tree was rejected by GE-123d-2 as over-fitting to today's layout, and that rejection still stands — the store is now closed to YAML everywhere, not closed by a location-specific rule). Admission is membership: absence from the list is exclusion, and there is no third state. An implementation carrying a DENY list of known-executable kinds such as `.py`, `.sh` and `.js` satisfies the first arm and fails the second — that inversion is the whole point of the shape, because the kinds nobody enumerated must arrive fully checked."
  - "THE LOCATION LIST IS NOT TOUCHED BY THIS AC, AND THE 2026-08-25 DECISION DID NOT TOUCH IT EITHER. GE-123d-2's five locations include the changelog area, which it added deliberately. This record governs the EXISTING exemption and its four existing locations — the ticket tree, the retrospectives area, the acceptance-criteria store and the skill-prompt area. Adopting a kind list is not adopting a location list; adding a fifth location on this side would be an unasked-for widening; and REMOVING `docs/acceptance-criteria/` from the location list because its YAML is now scanned would be an equally unasked-for narrowing. The store keeps its place on the location list — its `.md` and `.txt` files are still admitted there."
  - "COORDINATION WITH GE-123d-4-i, NOT A MERGE — AND THE TWO KIND LISTS NOW DIVERGE, WHICH RAISES THE BAR RATHER THAN LOWERING IT. GE-123d-4-i requires that if the location data is ever shared between the existing `ENTROPY_HIGH` exemption and the proposed `GENERIC_SECRET` one, the kind gate must be applied on BOTH sides or the sharing must not happen. This AC originally chose the same four kinds as GE-123d-2 so that a later sharing would be safe. After the 2026-08-25 decision the two lists DIFFER — `.md`/`.txt` here, `.md`/`.yaml`/`.yml`/`.txt` in GE-123d-2 — so sharing the location data now additionally requires reconciling the two kind lists first, as an explicit decision by whoever proposes the sharing. Do NOT reconcile them by quietly re-widening this list, and do NOT reconcile them by editing GE-123d-2: that tree is fenced. If this implementation introduces any structure the other rule could reuse — a shared kind constant, a shared location list, a shared predicate — that requirement binds here too and every call site must go through the gate. Do NOT edit any GE-123 file and do NOT add a depends_on edge into the GE-123 tree."
  - "COORDINATE WITH THE SIBLING L1s RATHER THAN REVERTING THEM. GE-125a re-anchors the same path predicate to a root-anchored segment match and GE-125c moves the decision from the file to the individual finding, both against these same members, concurrently. Reconcile with whatever is in the file at implementation time; do not restore a substring match and do not restore the file as the unit of the decision as a side effect of adding the kind list."
  - "THROWAWAY ROOT, AND ASSERT IT IS NOT ITSELF EXEMPT. All fixtures are real files inside a `tempfile`-backed throwaway git repository with the skill-prompt area constructed INSIDE that root; none may be written under this repository's own `templates/skills/` tree. Because the location match is a substring test (KI-SEC-001), assert as a precondition that the root path ABOVE the constructed directory contains none of the four segment names — otherwise the `scripts/build_probe.py` control falls silent and looks like a broken fixture rather than a re-armed exemption. If the check cannot be pointed at a throwaway root, raise that as a defect against this goal and stop."
  - "VERIFY BY EXECUTION AND BY EXACT COUNT. Stage the files in the throwaway repository, run the pre-commit secrets check as a process, and assert the exit status together with the parsed findings and their 1-based line numbers. The first arm's assertion is an equality — exactly four across five files staged together, with the four named — because an at-least-one assertion is satisfied by an implementation that reports the README as well, which is the deleted-exemption failure. That count is not expressible by calling the exemption logic with path strings."
  - "FIXTURE TOKENS ASSEMBLED AT RUNTIME from concatenated fragments, per `unit_tests/commit_guardian/test_scan_secrets_suppression.py`. No `.security-allowlist` entry may be added for this tree; needing one is the signal the fragments were collapsed into literals. This is distinct from the store-wide `ENTROPY_HIGH` path-slug residue the 2026-08-25 decision knowingly admits — that residue is real store content and is suppressed by a glob on the affected paths, not by an entry for this test tree."
  - "ERROR HANDLING PER CLAUDE.md. Extension extraction and list membership are pure over a path string and must NOT be wrapped in try/except (Rule 4); any file or subprocess access added by the check or its tests is wrapped in a typed `except` that logs at WARNING or re-raises (Rules 1-3)."
  - "PERFORMANCE — THIS RUNS ON EVERY COMMIT. Membership is tested against a module-level frozen set, not a list rebuilt per call, and the extension is derived from the path string with no filesystem access — no `stat`, no read, no subprocess. The check must remain within its current commit-time budget for a staged set of 200 files."
test_spec:
  - name: test_unadmitted_kinds_at_a_listed_location_report_exactly_four
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Five files in the skill-prompt area of a throwaway root — deploy.sh, fixture.json, an extensionless entrypoint, config.yaml and README.md — carrying the identical runtime-assembled token and staged together yield EXACTLY FOUR findings, one each for the shell script, the JSON file, the extensionless file and the YAML file, none for the README, with a non-zero exit. Location held constant so the kind is the only variable; the equality count is what makes it discriminating. The config.yaml finding is the arm the 2026-08-25 product decision added — it was silent under the original four-kind list."
  - name: test_an_unknown_kind_arrives_fully_checked
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "A .adoc file this project does not use, staged in the same area with the same token, IS reported and blocks. This is the arm that separates a closed ADMIT list from a deny list of known-executable kinds: an implementation hard-coding .py/.sh/.js as excluded satisfies the previous descriptor and fails this one."
  - name: test_admitted_kinds_are_one_closed_constant_of_exactly_two
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: seam
    description: "Behavioural drift guard: staged files of kinds .md and .txt at a listed location are silent while a representative sample of other kinds — including .yaml and .yml — is all reported, in one run, so the admitted set is observably exactly those two. Pins the product decision of 2026-08-25 at test level: if this descriptor ever needs editing to pass, the admitted list has changed and that requires a product decision by the product owner, not a test fix."
  - name: test_live_path_control_reported_in_the_same_invocation
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "scripts/build_probe.py in the throwaway root, containing none of the four listed names and holding the identical token, IS reported in the SAME run as the silent README. Without it the one silent file is an absence rather than evidence, and a fixture whose token never reached the entropy threshold looks identical to a working exemption."
  - name: test_closed_kind_list_is_present_in_the_deployed_check_after_build
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: "After running the build, the first descriptor's four-finding outcome is produced by the DEPLOYED scripts/commit_guardian/check_secrets.py and .leafcutter/scripts/commit_guardian/check_secrets.py, not only by the canonical template — the ADR-001 revert hazard, asserted by executing the deployed copy rather than by comparing bytes."
test_rationale: |
  Five descriptors, and the first two are a matched pair aimed at two implementations
  that are indistinguishable from a single assertion. A hard-coded deny list of .py,
  .sh and .js produces exactly the findings the first arm demands and lets the next
  file kind anyone invents arrive already exempt; only the .adoc arm separates them.
  That is why the second descriptor exists as a peer rather than as an edge case
  — default-to-reported is the shape being bought here, not a detail of it.

  The first descriptor holds location and content constant across five files staged in
  one commit so the kind is the only variable, and asserts an equality rather than a
  floor: an at-least-one assertion is satisfied by an implementation that reports the
  README too, which is the deleted-exemption failure the whole subtree guards against.
  Its config.yaml member is the one the 2026-08-25 product decision moved — under the
  original four-kind list it was silent, and it is now the fourth reported file.

  The third descriptor is deliberately a fence rather than a behaviour. The admitted
  list was an OPEN product decision until 2026-08-25, when the product owner closed
  the acceptance-criteria store to opaque tokens and the list shrank to .md and .txt.
  The set must therefore stay observable at test level and expensive to change quietly
  — in either direction, and re-admitting .yaml because the store has started producing
  path-slug findings is the specific quiet change this descriptor exists to catch. It
  is written behaviourally rather than by importing the constant, so it cannot be
  satisfied by a source-level grep and so it also proves the constant is actually wired.

  The fourth is the standing live-path control without which every silent assertion
  here is vacuous, and the fifth covers the ADR-001 revert: a fix in the canonical
  template alone leaves the hook a real commit runs unchanged until the next build.
