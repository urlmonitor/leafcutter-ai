id: BO-4000c
title: "A run started inside an unrelated worktree, or aimed at an occupied location, still never nests a worktree and never picks a second location"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given /build-feature EPIC-OtherEpic is started from inside the linked worktree
    `C:\Users\Hendrik\Code\leafcutter\worktrees\uxp-700-tranche-2`
  And the run's target resolution reports no worktree for EPIC-OtherEpic
  When the worktree step names the location for the new worktree
  Then the location is `C:\Users\Hendrik\Code\leafcutter\worktrees\EPIC-OtherEpic`, a
    direct child of the repository's worktree base
  And it is the same location the run names when started from the main checkout
    `C:\Users\Hendrik\Code\leafcutter\leafcutter-ai`
  And it is not under `C:\Users\Hendrik\Code\leafcutter\worktrees\uxp-700-tranche-2`,
    whether as `uxp-700-tranche-2\worktrees\EPIC-OtherEpic`, as the epic's folder inside
    that worktree, or anywhere else below it.

  Given the named location `C:\Users\Hendrik\Code\leafcutter\worktrees\EPIC-OtherEpic`
    already exists
  And it is the top-level directory of a linked worktree of this repository, checked out
    on the target's branch
  When the worktree step runs
  Then that worktree is reused as the target's worktree, as in BO-4000's first scenario.

  Given the named location already exists
  And it is a plain directory, a checkout of a different repository, or a linked worktree
    of this repository on a different branch
  When the worktree step runs
  Then no worktree is opened, neither there nor at any alternative location
  And no phase agent is dispatched
  And the run stops with a refusal naming the location and what occupies it
  And nothing inside the occupied location is changed.
