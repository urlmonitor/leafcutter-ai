title: "Both test writers ask what small wrong change would keep their test green, and fix the test before handing on"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the ordinary test writer and the database test writer are each asked
    for a test of the same gate change: a refresh that used to run
    "if refresh_due" now runs "if refresh_due and retry_due",
  When each writes its test and prepares its report,
  Then each report answers, for each test that guards the change, three
      questions:
        Q1 what is the smallest change to the production code that keeps this
           test green but brings the bug back,
        Q2 what result would show this assertion can fail, and does the
           fixture produce that result,
        Q3 does the control row pass for a different reason than the negative
           row fails,
    And each report goes through the vacuity checklist for that test, item by
      item: the assertion states an exact count rather than a one-sided bound;
      a control row that must pass is present; every new input the change
      reads is seeded with values distinct from the old inputs; the test
      counts calls on the collaborator the new branch must reach,
    And a checklist item that does not apply is marked not applicable with a
      one-line reason, never left out,
    And when Q1 names a change that would keep the test green — here, a
      fixture that sets refresh_due but never retry_due, so the branch runs
      0 times — the writer strengthens the test until that change would turn
      it red, and lists the named change in its report as a wrong version the
      test now catches,
    And both writers carry the questions and the checklist in their own
      instructions; neither sends the writer to an adopter's test README to
      find them.
