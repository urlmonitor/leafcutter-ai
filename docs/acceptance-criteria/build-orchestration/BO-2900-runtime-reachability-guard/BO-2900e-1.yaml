title: "Every refusal names the stranded thing, which side of the connection is missing, and the one action that clears it"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a proof of completion that reached its code by direct import while the code has
    a runtime way in,
  When the guard refuses,
  Then the refusal names the code under proof and the way in that was not entered,
    states that the proof side of the connection is the one missing, and gives driving
    the same behaviour through the way in as the action that clears it.

  Given code that no way of running the product reaches,
  When the guard refuses,
  Then the refusal names the unit, states that the code has no way in at all, and gives
    giving it a way in, or recording an exemption, as the actions that clear it.

  Given a registered capability that no automation runs,
  When the guard refuses,
  Then the refusal names the capability, states that the caller side is missing, and
    gives adding the automation invocation as the action that clears it.

  Given an automation invocation naming a capability that is not registered,
  When the guard refuses,
  Then the refusal names the automation script, the invocation, and the capability name
    that does not exist, states that the capability side is missing, and gives
    correcting the invocation as the action that clears it.

  And in each of the four refusals the named action is one the reader can carry out on
  the code, and disabling or skipping the guard is not offered as an action.
