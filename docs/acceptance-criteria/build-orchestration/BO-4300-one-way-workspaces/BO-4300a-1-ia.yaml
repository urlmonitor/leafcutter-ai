delivers_to: null
expects_from:
  ac_id: BO-4300a-1-ib
  contract: 'args.workspace: the maker''s ensure answer (a JSON object per BO-4300c-2) passed verbatim
    by the workflow''s entry command or skill; absent when the workflow must obtain the workspace itself
    via one verbatim dispatch.'
package_surface: false
it_requirements:
- 'Workflow bodies run in the E2 engine with no filesystem or process access (ADR-030). They reach the
  maker only through (a) args.workspace -- the maker''s JSON object passed verbatim by the entry command
  or skill (BO-4300a-1-ib) -- or (b) exactly one agent() dispatch, carrying a result schema, to an agent
  whose registry entry has permits_shell: true, instructing it to run one exact absolute command unchanged
  and return stdout verbatim. Never status-checker (permits_shell: false), never free-form set-up steps.'
- 'Remove every free-form workspace instruction from the workflow bodies: build-feature.js''s ''Open a
  NEW git worktree ... Bootstrap it (copy/symlink .leafcutter ...)'' prompt, the resolver and branch-check
  steps plan-feature.js sends to status-checker, finalize-feature.js''s `git worktree add/remove` and
  `rm -rf` prompts, and fast-lane-ship.js''s create prompt. Line numbers in the analysis are hints; verify
  against HEAD.'
- A workspace dispatch's prompt carries only the exact absolute maker command and the instruction to run
  it unchanged and relay stdout verbatim; the agent's reply is parsed with the BO-4300c-2 schema.
- 'ONE SHARED DISPATCH HELPER (duplication audit C3/C2): the workspace dispatch is issued only through
  the dispatch helper in the WORKSPACE-ANSWER block delivered by BO-4300c-3 (build-inlined, byte-identical
  in every consuming workflow). No workflow builds its own workspace dispatch or its own reply parsing.'
- 'Reply handling applies to EVERY step in every workflow that asks an agent to run a shell command, not
  only workspace dispatches: the dispatch carries a result schema; a decline, a prose reply, a non-JSON
  reply, or a reply without the result the step asked for (for the workspace dispatch: JSON without status)
  is an error that ends the workflow, and the error quotes the reply received. No later step of that workflow
  is dispatched after such a reply, and a refusal is never taken as the step having run. For the workspace
  dispatch there is additionally no fallback to the current checkout, the epic folder or the start folder.
  The rule is enforced in one shared place in the workflow runtime (not re-implemented per workflow), so a
  new workflow inherits it.'
- 'REPO-WIDE SHELL-DISPATCH LINT (duplication audit C2; covers EVERY workflow, not only workspace dispatches):
  a test fails when any agent dispatch in any templates/workflows-js/*.js whose prompt instructs the agent
  to run a shell command names an agentType whose config/agent_registry.json entry does not have permits_shell:
  true (absent counts as not permitted). The workflow set is enumerated from the directory and the registry
  is read at test time -- no hard-coded lists. What counts as "a prompt that runs a shell command" is
  one declared, reviewed rule held in one place in the test (e.g. the prompt, including template-literal
  fragments, names a command line starting with git, gh, python/python3, node/npm, pytest, rm, mv, cp,
  bash/sh or pwsh), and the test carries a self-check proving the rule catches a known status-checker
  git dispatch. Each failure names the workflow, the dispatch label or location, the agentType and the
  command seen.'
- 'Blast radius of the lint (verified 2026-09-25): 62 dispatches target status-checker (permits_shell:
  false), and only worktree-agent has permits_shell: true -- commit, test-runner, python-coder and others
  have no permits_shell field at all. The lint therefore goes red on today''s tree. Making it green is
  in scope of this record: each offending dispatch is moved to a shell-permitted agent, or the registry
  entry of an agent that genuinely runs shell by charter gains permits_shell: true with that charter
  change reviewed; no dispatch is exempted by name.'
- 'Commit spelling (KI-CG-20260925-commit-delegation-hook-misses-git-dash-c): no workflow prompt this record
  touches spells a commit as `git -C <path> commit`; commits go through the commit agent per CLAUDE.md
  Commit Delegation.'
- 'The set of workflows under test is every workflow in the deployed workflow set, and the set of shell-permitted
  agents is read from config/agent_registry.json (permits_shell: true) at test time -- neither is a hard-coded
  list, so a new workflow or a changed registry entry inherits the check.'
- Workflow edits are made in templates/workflows-js/*.js and reach .claude/workflows/ only through the
  build; the deployed copy is what the tests run.
- Proof runs the workflow under unit_tests/_workflow_engine_harness.py -- the deployed copy the build
  produces, so the build's workflow transform is exercised -- with label-scripted agent replies, and asserts
  on the RECORDED dispatch list, never on workflow source text. The harness must be able to model a workspace
  step that declines its task, answers in prose, answers exit 0 with a non-JSON path, or answers JSON
  without status (F13), and any other shell-running step that declines, answers in prose or answers
  without its result; extending the harness for this is in scope of the first AC that needs it.
- 'Must handle errors per the project error handling policy: a condition the maker cannot classify is
  an error answer (code INTERNAL_ERROR) whose message names it -- never an ok answer, and never a traceback
  on stdout.'
test_required: true
test_spec:
- name: test_each_workflow_receives_answer_or_issues_one_verbatim_maker_request
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: Every deployed workflow that needs a workspace, run with recording stand-ins, either consumes
    args.workspace or records exactly one workspace dispatch whose prompt is the exact maker command plus
    a verbatim-relay instruction.
- name: test_no_dispatch_asks_an_agent_to_build_a_workspace_by_its_own_steps
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: No recorded dispatch prompt in any workflow run asks an agent to create, copy, set up,
    link or repair a workspace (no clone/worktree/symlink/copy/bootstrap instructions outside the one
    maker command).
- name: test_workspace_requests_only_reach_shell_permitted_agents
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: 'Every recorded workspace dispatch targets an agent whose registry entry has permits_shell:
    true, read from the registry at test time.'
- name: test_every_deployed_workflow_is_covered_without_editing_a_list
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: seam
  description: The workflows exercised are enumerated from the deployed workflow directory, so adding
    a workflow extends the check automatically.
- name: test_every_shell_running_dispatch_in_every_workflow_targets_a_shell_permitted_agent
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: unit
  angle: seam
  description: 'Repo-wide lint over every templates/workflows-js/*.js: each agent dispatch whose prompt
    runs a shell command names an agentType with permits_shell: true in config/agent_registry.json, read
    at test time (an agent with no permits_shell field counts as not permitted), including dispatch sites
    a single run does not reach; each violation is reported by workflow, step (dispatch label or location),
    agentType and the command the prompt asks for.'
- name: test_shell_dispatch_lint_catches_a_status_checker_git_dispatch
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: unit
  angle: failure
  description: Fed a fixture workflow that asks status-checker to run `git reset --hard`, and one that
    asks an agent without a permits_shell field to run a python script, the lint reports both, each report
    naming workflow, step, agent and command; fed the same prompts dispatched to worktree-agent it reports
    neither.
- name: test_refused_non_workspace_shell_step_ends_the_workflow_with_a_quoting_error
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: 'Through unit_tests/_workflow_engine_harness.py, a deployed workflow is run with a NON-workspace
    shell-running step (e.g. a git or test command) scripted to (a) decline, (b) answer in prose, and (c)
    answer without the requested result; in each case the workflow ends with an error whose text quotes
    the scripted reply, and the recorded dispatch list contains no step after the refused one.'
- name: test_workspace_dispatch_goes_through_the_shared_block_helper
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: In each deployed workflow run that issues a workspace dispatch, the recorded dispatch's
    prompt, agentType and schema are exactly those the WORKSPACE-ANSWER block's helper produces for the
    same command.
test_rationale: The 2026-09-25 incident was a perfect-enough maker with a caller that carried on, and
  every source grep of plan-feature.js would have passed. So the assertions are made on the recorded dispatch
  list of a real workflow run with scripted hostile answers, which is the only place 'no later step was
  dispatched' can be observed. The shell-dispatch lint is the one deliberate static check here -- a census
  of every dispatch site, including branches a harness run does not reach -- and it carries its own self-check
  so a rule that matches nothing cannot pass silently.
