test_spec:
  - name: test_valid_card_creates_payment_in_authorized_state
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    description: "Entering valid card details creates a Payment record for the order in the 'authorized' state."
  - name: test_payment_tied_to_signed_in_customers_order
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    description: "The created Payment is linked to the signed-in customer's order (not any other customer or order)."
  - name: test_order_not_marked_paid_before_capture
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    description: "After authorization, no Order is marked 'paid' — capture has not yet happened."
