assigned_agent: python-coder
estimated_complexity: M
it_requirements: |
  PRE_COMMIT_ALLOW_NO_CONFIG=1 is the ROOT CAUSE of the production silent-skip bug:
  a fresh worktree with no config resolves to pre-commit exiting 0 while running
  ZERO hooks. The probe must NOT inherit pre-commit's allow-no-config leniency as a
  pass signal. Check D's token assertion is independent of the env var, and the env
  var being set is itself a signal the chain may be inert. Implemented in the shared
  probe helper (BO-1700a-1); fail closed (BO-1700b-1); ADR-001 deployed/template
  parity applies.
