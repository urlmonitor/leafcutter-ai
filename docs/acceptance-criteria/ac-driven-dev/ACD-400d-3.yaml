  - "The order must be obtained by executing the scanner over a temporary store through its real command surface; neither a source-text assertion nor a direct call to the private sort helper satisfies this AC."
  - "The absent-urgency fixture must omit the field entirely from the written record, not write it empty or null — the population this verdict speaks for, roughly three records in ten of the real store, is the key-absent shape."
