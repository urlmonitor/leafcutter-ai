change_target: code
risk_surface: contract_boundary
notes: RQ8; ITPO-05 and RQE-06. New standalone original-question observability requirement. Use existing owner;
  a local receipt and recorded identifier are not remote-ingestion proof. Draft authored from the user-requested
  BA template pass; no real provider, database or tracing call was performed.
it_requirements:
- Preserve immutable source provenance, bounded registered read-only queries and existing authorization, budgets
  and retries. No arbitrary Cypher, new network endpoint, source-write permission, independent telemetry store or
  automatic activation is added.
- Use the existing observation owner and tracer lifecycle for standalone composition. Execution outcome and original-question
  fulfillment are separate fields derived from actual requirements/evidence; query success or a span cannot satisfy
  a missing field.
- Correlate repository, source SHA/generation/query and evidence IDs from the same request/attempt. Absent provenance
  stays unknown; redact credentials and unrestricted source contents under existing privacy rules.
- Emit final fulfillment, missing required fields and completeness limits after final assessment and before observation
  completion and bounded flush/shutdown. A pre-assessment retrieval span alone is insufficient for the final outcome.
- Return delivery state separately from a locally allocated trace ID. Claim an accessible Langfuse reference only
  after authorized matching remote observation is established; otherwise return available correlation plus explicit
  unverified/untraced state without promising ingestion.
- Actual remote verification is separately opt-in under existing provider/data-transfer permissions. Offline exporter
  checks prove serialization and correlation only; no new replay loop or telemetry stack is authorized.
test_required: true
test_rationale: Planned criterion and public-interface proof covers real producer/consumer and serialized boundaries
  with named wrong outcomes. Offline/scripted checks cannot establish real-provider, remote-ingestion or deployment
  readiness; unavailable live prerequisites remain not_run.
test_spec:
- name: test_standalone_observation_separates_execution_and_question_outcomes
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Invoke the standalone command with RQE-06 evidence of successful retrieval missing work_status; assert
    partial question fulfillment and the same request/query/source/evidence correlation in returned observation
    metadata.
  must_catch:
  - Marking the question answered because retrieval returned ok.
  covers:
  - KM-500g-1
  requires_db: false
  surface_invoked: python -m knowledge retrieve with the authorized existing observation composition
- name: test_observation_metadata_is_bounded_and_attributable
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Assert required facts, completeness limits and available source/generation/query identifiers are
    recorded while credentials and unrestricted excerpts are absent and unknown provenance stays unknown.
  must_catch:
  - Leaking source contents or filling provenance from the current workspace.
  covers:
  - KM-500g-1
  requires_db: false
- name: test_observation_finalizes_after_real_answer_assessment
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: seam
  description: Connect the real assessment producer and observation consumer with a recording exporter at the external
    boundary; assert final missing-field state reaches the event before close/flush.
  must_catch:
  - Finalizing success before the required-field assessment runs.
  covers:
  - KM-500g-1
  requires_db: false
- name: test_authorized_remote_observation_resolves_matching_final_attempt
  target_dir: tests/knowledge_live/
  framework: pytest
  type: integration
  angle: real_artifact
  description: Only when separately authorized/configured, invoke the real standalone path and inspect matching
    Langfuse evidence after finalization; verify returned reference and unresolved outcome, otherwise record not_run
    with prerequisites.
  must_catch:
  - Claiming a local trace ID establishes an accessible recorded Langfuse trace.
  covers:
  - KM-500g-1
  requires_db: false
  surface_invoked: python -m knowledge retrieve with the authorized existing observation composition
