notes: |
  Authored by /quick-fix. Root cause: the select_connected invocation in
  fast-lane-ship.js omits --exclude-structural-parent, so a depends_on entry
  naming a structural L0/L1 parent is treated as a genuine prerequisite and
  expanded into that composite's whole not-done subtree, recursively.

  Found when BO-1500a-5 resolved to fifteen ACs. Reproduced both ways against the
  real store: without the flag the resolver returns fifteen ids; with it, exactly
  three (the target and its two children). A store-wide sweep found 1,560 of 1,776
  not-done leaf targets would resolve to a smaller set with the flag on, and a
  worst case of 56 ACs from a single target in the TKT-500f family.

  Sibling coverage gap this closes: BO-2600a-1 specified the capability, BO-2600a-2
  the CLI surface, and BO-2600a-3/-4/-5 the build-ac consumers. No AC ever required
  the fast-lane consumer to pass the flag, which is why the drift went unnoticed.
