it_requirements:
  - "THE REBUILD-INTO-A-WORKING-DIRECTORY CASE IS REACHED BY OMITTING A FLAG, NOT BY PASSING A WRONG ONE. scripts/build.py line 1899 resolves the target as the --target-dir argument if given and Path.cwd() otherwise. So a bare build invoked from inside an isolated working directory silently declares that directory's own root as the sink's home, with nothing typed and nothing printed. This repository's own pre-drive checklist discusses running the build in a fresh worktree, so the accidental path is the likely path. The criterion's forbidden third outcome — a second sink, no statement — is therefore the CURRENT default behaviour of an ordinary command, which makes this the clause most likely to be implemented as an afterthought and the one that must not be."
  - "THE DECISION ABOUT WHICH ROOT TO USE MUST BE MADE FROM WHAT WAS RECORDED, NEVER FROM WHAT IS AROUND. The nested-fixture criterion is falsifiable only against an implementation that looks at its surroundings, and looking at surroundings is what a builder reaches for first — the nearest repository, the nearest marker file, the parent of the package directory. All three give a plausible-looking answer in a flat layout and the wrong answer in a consumer install. The prior anchor was dropped for precisely this, and the reasons are in the record so they are not rediscovered by shipping."
  - "STALENESS IS A THIRD STATE AND MUST NOT BE DERIVED FROM THE ABSENCE OF THE FILE. A declared path whose directory is gone and a declared path whose file has simply never been written both present as 'no file there'. Distinguishing them means testing the DIRECTORY on the way to the declared path, not the path itself, and reporting the two conditions differently while — per the criterion — introducing no new exit status. Do not conjure the directory to make the distinction go away: creating it turns a broken install into a healthy-looking empty one, which is the worse of the two outcomes."
  - "THE RELOCATION CLAUSE HAS A LIVE INSTANCE THAT CROSSES INTO INF-400c-4-iii AND CANNOT BE CLOSED FROM THIS RECORD. In the development workspace the build target is the workspace root, which has no records directory, while the operational stream's existing lines sit one level down under the package clone. Adopting a build-target declaration therefore points the operational stream's declared location away from the file holding its history, and INF-400c-4-iii requires every existing reader to return identical results before and after. Both cannot hold by doing nothing. This record's obligation is only that the difference is STATED once, naming both locations; the reconciliation itself belongs to whichever of the three options recorded in the notes is chosen, and that choice must be made before either AC lands rather than discovered by someone wondering where the history went."
  - "THE WHERE-IS-THE-SINK QUERY MUST BE SIDE-EFFECT-FREE AND SHOULD BE THE SAME SURFACE INF-400c-4-iv's NO-WORK OUTCOME USES. Asking the question must not create the file, the directory holding it, or a record. Two independently correct answerers will drift, and the drift is invisible because each is right about the value it computes."
  - "Must handle errors gracefully per the project error handling policy."
