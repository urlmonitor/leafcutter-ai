  contract: >-
    The audience derivation for a kind of file — the set of specialists the ownership record
    assigns it, read fresh at compile time. This record constrains its behaviour on the single
    input where that set is EMPTY: no owner inferred from any other source, the run completing
    for every other pairing, and the condition surfaced as a named third outcome rather than
    absorbed into the told/not-told boolean.
