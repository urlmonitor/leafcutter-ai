assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The enforced/informational decision for a done AC must be authoritative from the covering AC's work_status and must override any in-test skip/xfail marker — a marker the test sets on itself cannot downgrade a done-AC test to informational."
  - "This L2 also OWNS the pre-pytest linkage-integrity check surface that TQ-100c-2-i (zero-covering-tests) and TQ-100c-2-ii (done->not-done downgrade) extend; the in-test-downgrade resistance and those two integrity violations are facets of one check, sharing one AC-store loader (reuse scripts/ac_store/scan_ac_store.py's loader, do not copy-paste)."
  - "The integrity check runs BEFORE the pytest session (it is a linkage/coverage gate, not an assertion check) and fails loudly with a message identifying the offending AC/test; its failure class is distinct from a normal test assertion failure."
  - "The integrity check's internal errors must be fail-open per the project error handling policy (CLAUDE.md Rules 1-4): an internal exception is caught with a specific type, logged at WARNING, and must not be mistaken for a linkage violation (mirror the check_ac_governance.py fail-open tail); a REAL violation, however, always blocks."
  - "If the integrity check is a deployable commit-time/CI gate, edit the templates/ package source and the deployed copy together and keep parity via the build.py round-trip (ADR-001)."
delivers_to:
  agent: python-coder
  contract: "A pre-pytest linkage-integrity check (run before the pytest session) that reads the AC store once and detects linkage violations; consumed by TQ-100c-2-i (done AC with zero covering tests) and TQ-100c-2-ii (done->not-done downgrade while failing) and fed the dangling-tag set from TQ-100b-1-ii. Fails loudly (non-zero) naming the offending AC/test."
expects_from:
  ac_id: TQ-100b-2
  contract: "The done-branch enforcement; this AC asserts a done-AC test cannot be self-downgraded to informational from inside the test."
