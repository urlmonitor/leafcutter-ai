notes: |
  Directly addresses the L0 motivating incident: a broken page shipped while
  every check passed, discovered only when a person opened it. This check loads
  each route headlessly and treats a non-200 response OR any console/render error
  as a failure. The enumeration of routes to load and the headless-load mechanism
  are implementation details left to it-po; the OUTCOME (every route verified to
  render without error before merge) is fixed here. /about is anchored explicitly
  in BP-1400c-1-i.
