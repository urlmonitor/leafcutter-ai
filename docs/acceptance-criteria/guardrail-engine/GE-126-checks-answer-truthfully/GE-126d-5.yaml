id: GE-126d-5
title: "What each registration leg buys you is written down beside the list of legs"
component: guardrail-engine
components:
  - commit_guardian
  - skills_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader deciding whether a check they did not write is properly registered or
    trying to understand a finding the registration parity check reported,
  When they consult the reference material for the check family,
  Then it names each registration leg and states what the check gains from that leg and
    what it loses without it,
  And it states that membership of the autofix roster changes whether a repair is attempted
    and never changes whether the check blocks,
  And it states that a check absent from the roster with no recorded exclusion is a
    reported finding rather than a valid state,
  And the leg list the reference shows comes from the single declaration rather than being
    written out again as prose,
  And it records the observation that motivated the fourth leg being added to the
    enumeration together with its date and names the approved record that was specified
    against three legs so a later reader can see the worked example rather than only the
    rule.

  Coverage note: covered by a test that takes each leg the reference describes and asserts
  the registration parity check treats it as a leg, plus an assertion that the reference's
  leg list is rendered from the declaration rather than stored separately. A test that the
  reference mentions four legs does not cover this criterion and hardcodes the number the
  declaration owns.
