  - ac_driven_dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader asking who answers a decision point,
  When they open the sequence diagram for it,
  Then it shows the person as a distinct participant, shows the question travelling from the
    layer that raises it to the person and the answer travelling back, shows no specialist in
    the answering position, and shows the alternative path in which the question cannot reach
    the person: the run pausing, the resumable record being written, and the authored work
    being left in place.

  Given the diagram,
  When it is compared against a real run driven down each of the two paths,
  Then every interaction it shows occurred on the corresponding path, in the order shown.
