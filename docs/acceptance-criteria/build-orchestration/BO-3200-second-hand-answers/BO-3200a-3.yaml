    WHAT THE CRITERIA SAID BEFORE (verbatim):
      Given an author adding a step that needs to know something about the project,
      When they open the reference documentation for obtaining facts,
      Then it states that a value the build branches on is read at its source, states that a
        judgement may be asked of a specialist, gives the test that separates the two — whether the
        build would still work with no specialist available — and states how to read a value
        directly.

      Given the reference documentation,
      When each rule it states about what is permitted is applied to a path and that path is
        exercised with specialists unavailable,
      Then a path the documentation calls permitted completes, and a path it calls forbidden is
        reported by the sweep.
    TITLE: unchanged -- it never carried the premise.

    WHAT IT SAYS NOW. First scenario: the separating test is "whether the build would still work
    if no party could be asked to judge anything, with only the chartered executor carrying out
    exact commands" (was "with no specialist available"), and "how to read a value directly" is
    now "how to obtain such a value with no judgement requested: through an exact command carried
    out by the chartered executor, linking to the reference that describes the executor rather
    than restating it". Second scenario: the environment is the no-judgement premise in the same
    words BO-3200a-1 and ACD-2100b-5 carry (was "with specialists unavailable"). The
    rest of both scenarios is unchanged.

    WHY. The E2 workflow engine injects only agent, parallel, pipeline, phase, log, args,
    workflow and budget into a workflow body (docs/reference/workflow-authoring-contract.md
    section 1) -- no filesystem, no subprocess -- so every read and every chore goes through an
    agent() call and the old premise could never hold. An engine-level primitive was rejected as
    upstream (the engine is Claude Code's); pre-resolving into args was rejected as second-hand
    by another route. See BO-3200f's notes. BO-3200's standing rule -- only JUDGEMENT is
    delegable to a specialist -- is unchanged by this.

    WHAT THIS RECORD STILL PROVES. The page carries BO-3200a-2's sweep's own discriminating
    question, so guidance and enforcement cannot diverge. BO-3200a-2 changed its question on
    2026-09-16; left alone, this page would teach the superseded one and diverge by
    construction. "How to read a value directly" had become advice no author can follow -- a
    workflow body cannot read a file -- and following it literally invites the pre-resolve-into-
    args route BO-3200f rejected. The new link to the executor reference keeps the two pages
    from restating each other: BO-3200f-4 answers "what do I use when no judgement is needed",
    this page answers "which questions may a specialist be asked" (the cross-link BO-3200f-4
    already requires in the other direction).

    DEPENDS_ON. BO-3200f-4 added: the first scenario now links to the page BO-3200f-4 creates,
    so this page cannot land first without a dangling link.

    CRITERIA-ONLY CHANGE -- THE TECHNICAL LAYER IS NOW STALE AND IS THE IT PO'S TO REDO. Not
