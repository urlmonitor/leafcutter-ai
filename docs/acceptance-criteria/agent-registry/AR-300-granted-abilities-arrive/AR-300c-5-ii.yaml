notes: |
  USER DECISIONS CARRIED DOWN (BrainCandy, 2026-10-09, items 5 and 9). The
  build REPORTS a disagreeing registry copy and does not refuse; the derived
  copy is regenerated by the transform-agent-registry pre-commit hook; the
  build never writes the package source tree. Refusing here would break
  AR-300d-5's "takes effect on the next build with no second edit".

  CONTRADICTION FLAGGED, NOT SILENTLY OVERRIDDEN. AR-300c-3 (approved) carries
  an it_requirements constraint, "TRANSFORM SCOPE ... the transform-agent-registry
  hook regenerates ONLY the skills_used / skills_invoked fields ... Every other
  byte of the registry ... is left unchanged", and says it is pinned by
  test_ar_300c_3_ii_registry_transform.py. This criterion requires the same
  hook to also regenerate the spawn_allowlist field. One of the two must
  change: the IT PO should amend AR-300c-3's transform-scope constraint (with an
  amended_by entry) to name spawn_allowlist as well, and the pinning test's
  "every other byte unchanged" assertion moves with it. Left for the IT PO; not
  edited here because AR-300c-3 is an approved L2 from a prior run.
  RESOLVED (IT PO, 2026-10-09): AR-300c-3's transform-scope constraint now names
  the derived declaration fields skills_used, skills_invoked and spawn_allowlist,
  still with no other byte changed (amended_by entry on AR-300c-3, criteria
  unchanged). The pinning test update is a descriptor in this record's test_spec.

  THE MACRO IS COMPARED AS AN ENTRY. Both sides hold the ticket-phase macro as a
  single entry. Comparing one side's macro against the other side's expanded
  names would report a disagreement on every build for ticket-supervisor -- the
  noisy-rule failure AR-200b-1 records in this component.

  ADJACENT FIELD, OUT OF SCOPE, RAISED. The registry also carries `spawned_by`,
  which is the inverse of spawn_allowlist. If it stays authored while
  spawn_allowlist becomes derived, the two can disagree. Not specified here;
  raised as an open item.
