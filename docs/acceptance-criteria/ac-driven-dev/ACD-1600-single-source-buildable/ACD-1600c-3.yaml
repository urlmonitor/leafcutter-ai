criteria: |
  Given the implementation-readiness completeness gate (file targets + test contract),
  When the reference documentation is authored,
  Then it documents what makes an AC buildable (a declared-files list naming at least one file,
    ACD-1600c-4, and a test contract),
  And it states that "missing file targets" is raised for a requirement in the "no declared
    files" state, and that paths named in technical requirements or documentation links do not
    satisfy it,
  And it documents that a requirement missing either is held back for enrichment, not dispatched,
  And it lists every reason in the store's single hold-reason list — "missing file targets",
    "missing test contract", "test design pending", "reference file pending" and
    "file finding undecided" — with the check that raises each one,
  And it names that one list as the only source of hold reasons,
  And it distinguishes this completeness gate from the approval-readiness gate (reviewed -> approved).
