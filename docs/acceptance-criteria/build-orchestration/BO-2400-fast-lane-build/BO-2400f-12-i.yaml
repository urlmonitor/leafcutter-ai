id: BO-2400f-12-i
components:
  - build_orchestration
title: "A refusal leaves the store exactly as it found it, and holds no claim to release"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: done
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run that refused its resolved set because one or more members
    declare a deliverable no phase in its roster produces,
  When the store is read after the run has ended,
  Then every member of the resolved set carries exactly the work_status it carried
    before the run — none is done, none is in_progress, none has been removed from the
    store or from its parent's coverage,
  And the acceptance criterion the operator named is still outstanding, so the next
    run resolves the same set rather than a set silently reduced by the refusal.

  Given the same refusing run,
  When its ending is inspected,
  Then it releases nothing, because it claimed nothing: the release step that returns
    in_progress to todo (BO-2400f-10) is not invoked by this path,
  And a concurrent run holding its own claims on any of these acceptance criteria still
    holds them after the refusal.

  Given the same store and the same target, run twice,
  When both runs refuse,
  Then both refusals name the same members for the same reasons, and the store after
    the second run is byte-identical to the store after the first — a refusal is not a
    state transition and repeating it costs nothing but the resolution.
