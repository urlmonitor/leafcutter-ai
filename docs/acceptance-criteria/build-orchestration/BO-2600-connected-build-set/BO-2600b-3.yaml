  - "It must be authored after BO-2600b-1 and BO-2600b-2 are implemented, so the scope described and the location of the scope statement in the run record both match what shipped."
  - "It must tell the operator how to get the wider set (aim at the parent), since that is the question the tightened scope will immediately raise."
