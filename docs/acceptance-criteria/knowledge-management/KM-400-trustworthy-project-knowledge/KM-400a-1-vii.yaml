id: KM-400a-1-vii
title: Document metadata preserves authored fields and prose without duplicating other native types
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
priority: medium
work_status: done
parent: KM-400a-1
criteria: |
  Given an authored Document has title, description, type, status, created, last_updated and components
  And an architecture document may also declare flight_level, diagram_type, parent, children and labeled relationship references
  And a UI context document may declare nested stack and data_layer values
  When Document metadata is exposed from the selected source revision
  Then the complete authored frontmatter is available, including conditional architecture fields and extension fields
  And labels, order and path values in related_docs or related_code remain associated
  And nested data-layer values, explicit null parent, empty children and false flags retain their source meanings
  And the exact body remains separately available without interpreting arbitrary prose as structured metadata
  And a known issue's prose status cannot overwrite the document lifecycle status
  And derived document-family or display-title information cannot replace authored type or invent missing title or description fields

  Given a legacy prose-only memory document, an ADR, a generated agent card and a generated product-truth view
  When Document records are selected
  Then the legacy memory document remains available with its original body and absent frontmatter fields
  And artifacts owned by other native types and generated views do not appear as duplicate Documents
  And malformed frontmatter on an admitted Document is reported explicitly rather than treated as absent
depends_on: [KM-400a-1]
