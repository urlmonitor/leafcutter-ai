    relationship: related
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "THE PIN SOURCE IS THE ATTRIBUTE NAME `data-ac`, MATCHED EXACTLY. Not a prefix match, not a substring search for an id pattern anywhere in the tag. `className`, `class`, `data-testid`, `data-screen` and any `data-ac-*` variant contribute nothing to ac_ids. The mock-data invariant is absolute: AcDeclaration.attribute == 'data-ac' for every record."
  - "BOTH ATTRIBUTES ON ONE ELEMENT IS THE REAL CASE, NOT THE EDGE CASE. Real pinned elements carry class and data-ac together (mock record `decl-stock-badge`), and class values contain framework interpolation (`stock--{status}`, `${styles.x}`) that must not confuse the attribute scan. Parse the opening tag attribute-wise rather than regexing the whole tag for id-shaped tokens."
  - "This constraint applies to the whole pipeline, not just the reader: no report, selector or store field may reconstruct a pin from a class name. A class-derived marker is mangled by CSS-modules hashing and purged by Tailwind content scanning, so it would produce a traceability link that exists in source and not in the built product — worse than none."
delivers_to: null
expects_from:
  ac_id: GE-124b-1
  contract: "The pin record whose attribute source this edge case pins to data-ac alone — exact attribute-name match, with class/className contributing nothing to ac_ids"
test_spec:
  - name: test_ge_124b_1_i_class_based_marker_alone_produces_no_pin
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "An element whose class contains `ac-UXP-100d-2` and which carries no data-ac attribute yields zero pins for the file. Assert zero, not 'the id is absent from some list' — a reader that records an empty-valued pin would pass the weaker form."
  - name: test_ge_124b_1_i_element_with_both_class_and_data_ac_takes_ids_only_from_data_ac
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: criterion
    description: "The `decl-stock-badge` worked case — `<span class=\"stock stock--{status}\" data-ac=\"UXP-100d-2\">` — yields exactly one pin with ac_ids ['UXP-100d-2'] and nothing drawn from the class value, including its interpolation braces."
  - name: test_ge_124b_1_i_neighbouring_data_attributes_are_not_read_as_pins
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    angle: boundary
    description: "An element carrying data-testid, data-screen and a hypothetical data-ac-note contributes no ac_ids; only an exact `data-ac` attribute does. This is the prefix-match failure a substring scan makes."
test_rationale: |
  The failing implementation this AC guards against is more forgiving, not less: a reader that
  also accepts a class-based marker looks helpful and produces pins that vanish from the built
  output. Testing only the negative (no data-ac means no pin) does not catch it, because such a
  reader would still be wrong in the presence of BOTH attributes — which is the shape every
  real pinned element takes. So the second test is the load-bearing one, and it uses the real
  mock record's markup including its framework interpolation, which is what breaks a
  whole-tag regex. The third test closes the prefix-match variant. All three are pure parse
  questions, observable in the reader; the tier wiring is charged once at GE-124c-1.
origin_agent: business-analyst
