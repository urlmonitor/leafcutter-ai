criteria: |
  Every run leaves an account you can read of what it examined and would alter.

  A run produces a durable account naming what it looked at, what it would change,
  and on what grounds — so the decision to let it proceed is made on evidence you
  have actually read rather than on trust in the tool. The same account is
  available after a change has been applied, so what happened can be checked
  instead of assumed.
