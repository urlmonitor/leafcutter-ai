id: TQ-400d-5
components:
  - testing_quality
  - ac_store
title: "A first-time triager can work a record from the pile to a recorded decision using the guide alone"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a maintainer facing the unproven-finished pile for the first time — at the
    measured starting size of 259 records out of 641 finished ones — with the
    triage how-to and nothing else,
  When they follow that guide,
  Then they obtain the current pile and can state, for any record in it, why the
    sweep could not prove that record,
  And, for one record, they choose between the three decisions — prove it, redo
    it, retire it — using stated criteria for which decision fits which situation,
    rather than being left to judge unaided,
  And they record that decision against that record and then demonstrate it has
    left the awaiting-decision population, using only steps the guide gives,
  And, having attempted to clear a record without recording a decision, they can
    explain from the guide why it was refused and what to do instead — the guide
    states the refusal as designed behaviour, not as a fault to be worked around,
  And they can say where the number of records still awaiting a decision is read
    and how it is expected to change between cycles, so progress through the pile
    is checkable rather than asserted,
  And they can state that a record's age is no part of any decision, and the guide
    offers no route that clears records in bulk without a decision recorded
    against each one,
  And they can say which records are legitimately absent from the pile and why —
    the proven and the reasoned-exempt — so an absent record is not mistaken for
    one that was quietly written off,
  And the steps the guide gives are the ones the delivered triage path actually
    supports at publication: a reader who follows them works a real record to a
    recorded decision without adjusting any step.
depends_on:
  - TQ-400d
  - TQ-400d-1
  - TQ-400d-2
  - TQ-400d-3
