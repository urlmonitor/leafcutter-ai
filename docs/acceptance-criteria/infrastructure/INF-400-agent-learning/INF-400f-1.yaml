criteria: |
  Given the product-owner-v3 agent runs first in the v3 ticket-creation pipeline
    and discovers a user preference during L0/L1 framing
    (e.g., "the user prefers value propositions to start with the problem, not the solution"),
  And the PO's knowledge-capture step (INF-400b-1) persists that learning
    to memory/feedback_l0_framing_preference.md before the PO exits,
  When the business-analyst-v3 agent is spawned next in the same pipeline run,
  Then the BA's pre-flight step (INF-400a-1) reads the memory file that the PO just wrote,
  And the BA's L2 decomposition reflects the PO's learned preference
    (e.g., criteria language mirrors the problem-first framing),
  And no manual hand-off or explicit "pass this to the BA" instruction is required.
