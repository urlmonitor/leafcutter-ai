id: GE-120c-6
title: "A guard cannot ship unregistered — a deployed check that nothing invokes is named and fails the sweep"
component: guardrail-engine
components:
  - testing_quality
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the candidate set of guards, derived at run time from the guard directory convention —
    every check script living where the commit-guardian's check scripts live — and never from a
    list written into the sweep,
  And a real built working copy in which the deployed registry the commit path reads has been
    produced by the install,
  When the harness sweep runs,
  Then every candidate that no entry in that deployed registry resolves to is reported by name,
  And the sweep fails,

  And a candidate is exempt only when a declared opt-out applies to it — a property read from
    the candidate itself or from a declared exemption record — never a match against an
    identifier written into the sweep, so a guard added tomorrow inherits the rule instead of
    inheriting an exemption by resemblance,
  And every exempt candidate is reported together with the declaration that exempts it, so an
    exemption is visible in the sweep's output rather than silent,

  And given a candidate whose registration exists only in a manifest the install does not deploy
    the registry from,
  Then that candidate is reported as unregistered, because a registration the commit path never
    reads is not a registration,

  And given the package-development-only scripts that build the package and hold the epic lock —
    which live outside the guard directory and which no registry entry and no deployable
    template promises — neither appears in the sweep's report in any category, neither as
    unregistered nor as exempt.

  Coverage note: exercise the failing direction with a guard-directory fixture containing a
  check that no deployed registry entry resolves to, and assert the sweep names it and fails. A
  test asserting that today's candidates are all registered passes forever and catches nothing
  on the day guard sixty-three is added, which is the day this AC exists for. The exemption
  clause is covered by adding a candidate carrying a declared opt-out and asserting it is
  reported as exempt with its declaration rather than omitted. The no-false-positive clause is
  covered by a regression assertion pinning the two named package-development scripts out of
  the verdict.
depends_on:
  - GE-120c
  - GE-120c-1
  - GE-120c-3
