title: "New agent type inherits guardrails from its declared produces trait"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the agent registry contains an existing agent "python-coder" with
    produces: production_code that is subject to the standard_tdd guardrail,
  And a new agent "rust-coder" is added to the registry with produces: production_code,
  When the guardrail engine evaluates a ticket assigned to "rust-coder",
  Then the guardrail engine applies the same guardrails as "python-coder" would receive
    for the same (change_target, risk_surface) pair
  And no manual update to the guardrail mapping is required for the new agent
  And the new agent inherits standard_tdd because its produces trait matches
    the trait-to-guardrail rule

  Given a new agent "prompt-engineer" is added with produces: prompt,
  And the guardrail mapping specifies that agents producing prompts require
    red_team_eval when risk_surface is safety,
  When "prompt-engineer" is assigned to a ticket with risk_surface: safety,
  Then it inherits the red_team_eval guardrail automatically
  And no one needs to explicitly add "prompt-engineer" to any guardrail rule
