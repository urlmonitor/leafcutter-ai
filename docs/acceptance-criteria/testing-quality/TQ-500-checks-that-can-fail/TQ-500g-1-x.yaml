test_rationale: >-
  Every clause is deterministic, so every entry runs the real writer (and, where the criteria say so,
  the real runner) on a temp git repo. No LLM is involved. The fixture: a base commit holding
  refresh_config.py, settings.py, legacy_refresh.py and tests/test_refresh_config.py. After the base, the
  work commits a change to refresh_config.py (the gate reads "if refresh_due and retry_due"), then leaves
  uncommitted a change to tests/test_refresh_config.py, the deletion of legacy_refresh.py and a new,
  never-staged retry_policy.py. A temp AC store for TQ-9101, outside the repo or under an AC root the
  derived scope excludes, has covers-tagged entries owing the four names of the criteria, with
  in_scope_files exactly as the Given states. The base ref passed is the base commit, so committed and
  uncommitted changes both count. A second fixture changes only the test file. The criterion entries pin
  the four listed scopes and the marker. The boundary entries carry the decisions the criteria leave to the
  IT-PO: untracked and uncommitted changes count, git-ignored files and the AC store do not, a rename
  scopes only its new path, and an empty derived scope stays empty. The failure entries pin the
  out-of-scope refusal for derived names, the unchanged path refusals, the fail-closed empty scope and the
  missing base ref. The seam entries pin the one function shared by list, write and runner, the unchanged
  fix undone and the unchanged TQ-500g-1-ix contract for declared-only stores. The diff-count entry pins
  the performance budget by counting git diff subprocess calls. Two reachability entries go through the
  CLI steps the routes call, and the write one hands its manifest to the runner with the same --base-ref.
  Route wiring (passing --base-ref, handing owed on unchanged) is tested by TQ-500g-1-v, -vi and -vii.
  Red baseline: the modules exist, so these entries go red on behaviour (the missing scope key, --base-ref
  rejected by argparse, derived names listed with []), never on ImportError.
