criteria: |
  Given an agent proposes splitting an L0 into two groups of L1s,
  When the cluster proposal is ready,
  Then the agent presents the grouping to the user and pauses,
  And no files are created or modified until the user approves the grouping,
  And after file modifications are prepared, the agent presents
    a blast-radius summary (count of new, modified, and rewired files)
    and pauses again before writing,
  And the user can reject at any gate, which aborts the split
    with no files changed.
