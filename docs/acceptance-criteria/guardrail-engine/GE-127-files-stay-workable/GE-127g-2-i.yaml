notes: |
  WHY THE RESOLUTION IS TOWARD JUDGING AND NOT TOWARD EXEMPTING, STATED AS A DECISION AND
  NOT AN INSTINCT. An exclusion mechanism that fails toward exempting turns one unreadable
  file into a repository-wide amnesty, and under a silent failure the amnesty is
  indistinguishable from a clean run — which is the precise composition of the two
  failures this subtree exists to prevent. Judging everything on an unreadable declaration
  is loud, immediately diagnosable, and recoverable by fixing the declaration. The cost is
  that a genuine configuration accident refuses a commit; that is the right cost, and it is
  the direction GE-127a-1-i already chose one level down.

  WHY THE THIRD ARM IS HERE AND IS NOT PEDANTRY. An implementation that reports "could not
  read the declaration" whenever the declared set is empty makes the diagnostic useless: a
  deliberate decision that nothing is set aside is reported as a fault, and a real fault is
  reported identically, so neither can be acted on. This is the same confusion as "0 judged"
  versus "nothing exceeded its limit" that the parent's fourth arm separates — one level
  further out. The verdict is the same in both of this record's and the parent's cases; what
  must differ is what the run says about why.

  WHY THIS IS AN L3 AND NOT A SIBLING L2. It is entirely about what the run REPORTS and
  which population a document is reported in, which is GE-127g-2's subject. Its named
  mutation reddens this record alone and leaves every one of the parent's four arms green,
  because the parent's arms all run with a readable declaration.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM.

  (1) THE SILENT SUBSTITUTION. MUTATION: on an unreadable or uninterpretable declaration,
      fall back to a built-in set of set-aside locations and continue.
      MUST GO RED: the first and second arms.
      MUST STAY GREEN: the third arm, and every arm of GE-127g-1, GE-127g-1-i, GE-127g-2
      and GE-127g-3. This is the GE-118c defect reproduced with the sign reversed, and no
      other record in this subtree catches it.

  (2) THE QUIET EXEMPTION. MUTATION: on an unreadable declaration, set aside every document
      and complete the commit.
      MUST GO RED: the first and second arms.
      MUST STAY GREEN: the third arm and every parent arm. Stated separately from mutation
      one because it is the shape a fail-open convention produces by default, and because
      it is the one that scales a single bad file into a repository-wide amnesty.

  (3) THE CONFLATION. MUTATION: report an empty declared set with the same
      could-not-be-read message as an unreadable declaration.
      MUST GO RED: the third arm only.
      MUST STAY GREEN: the first and second arms and every parent arm. This is the narrowest
      mutation in the subtree and the reason the third arm is stated at all.

  (4) THE UNREACHED ERROR PATH. MUTATION: guard the read with an existence test so the
      error-handling path cannot be reached, as GE-118c records happening for the declared
      document types.
      MUST GO RED: the first arm, where the declaration is absent rather than malformed.
      MUST STAY GREEN: the second arm, where the file exists and parsing fails. The two arms
      are stated separately for exactly this reason: an implementation can handle the
      malformed case correctly and never reach it for the absent one.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect.
