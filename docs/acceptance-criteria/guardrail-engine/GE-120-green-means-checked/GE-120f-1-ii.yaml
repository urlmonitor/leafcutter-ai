notes: |
  THIS IS THE REGIME'S OWN OFF SWITCH AND IT IS WHY THIS RECORD EXISTS. On the commit that
  lands the parent, a large part of the family reports that no refusal has ever been
  observed. There are two ways to make that report quiet. One is to repair the guards. The
  other is to make each guard refuse something — and the cheapest refusal to arrange is one
  that fires on everything, because it needs no understanding of what the guard was for. A
  guard that refuses everything satisfies every clause of the parent, records a demonstrated
  refusal, and is worse than the guard it replaced: it will be switched off within a day and
  the family will be back where it started with a demonstration on file.

  WHY IT IS A SEPARATE FILE. The parent is satisfied by one observation. This record requires
  two and makes the parent's observed value conditional on their difference. An
  implementation can satisfy the parent completely while never once putting acceptable work
  through a check, and the resulting regime cannot tell a discriminating guard from an
  indiscriminate one — the same collapse GE-126b-5 forbids between never-attempted and
  observed, one axis over.

  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSE. "A check that produced the declared
  rejection for both inputs does not have its record say the rejection was observed."
  ARRIVAL COLOUR: GREEN, vacuously — no record is written for any check today, so no
  indiscriminate check is currently certified. INJECTION: record the rejection as observed as
  soon as the declared bad input produces the declared rejection, without putting the
  acceptable input through at all. This is the obvious efficiency — one invocation instead of
  two — and it is the whole defect. Under that injection a fixture check that refuses every
  input records a demonstrated refusal; this clause must go RED naming it, and must return to
  green on revert.

  SECOND NAMED MUTATION, FOR THE DIFFERENT-WORDING CLAUSE. INJECTION: report a check that
  refuses both inputs and a check that refuses neither under one shared wording. Under that
  injection the run still fails in both cases, so the parent's clauses and this record's
  earlier clauses stay green, and only the final clause goes RED. That asymmetry is what
  stops an implementer discharging both findings with one message whose two remedies are
  opposite: widen the guard, or narrow it.

  ARRIVAL COLOURS FOR THE REMAINING CLAUSES. Every Then that requires an invocation or a
  named report is RED on arrival — nothing is put through anything and nothing is reported.
  Only the two absence-asserting clauses above start green.

  A PAIR THAT DOES NOT DISCRIMINATE IS ITS OWN FINDING, NOT AN ERROR IN THE RUN. Declaring
  the same input twice, or two inputs the check cannot tell apart, is the paperwork form of
  the same evasion, and it must be reported rather than rejected as malformed input — a run
  that refuses to proceed on a bad declaration leaves the check unexamined, which is the
  never-attempted state wearing an error message.

  NO COUNT OF INSTANCES IS STATED OR IMPLIED HERE, per the parent's disputed-count rule.
target_epic: EPIC-AGuardThatHasNeverSaidNoIsNotCountedAs
