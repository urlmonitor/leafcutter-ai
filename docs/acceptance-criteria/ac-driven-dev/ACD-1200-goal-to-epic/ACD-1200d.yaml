criteria: |
  The command stamps all ACs in scope with a target_epic tag linking them to the generated epic.

  After the epic is generated, every leaf AC included in the batch carries a
  target_epic value matching the epic folder name. This makes it clear which
  shipping batch each AC belongs to and enables future scope additions to
  land in the right place.
