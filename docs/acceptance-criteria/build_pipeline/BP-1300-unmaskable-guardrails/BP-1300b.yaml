readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Guardrails read the source of truth -- a dirty deployment can't launder a real defect.

  Build and authoring guardrails resolve what they validate from the canonical
  source tree rather than the deployed working copy, so leftover or out-of-date
  deployed artifacts can never mask a defect that would otherwise be caught.
