id: GE-120a-3
title: "The numbering rules for all four namespaces are written down in one place"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a contributor who is about to create a new acceptance criterion, decision record, work
    item, or architecture diagram, and who does not already know this project's conventions,
  When they open the numbering reference document,
  Then it states the one-number-one-artifact rule ONCE, as a single rule that all four
    namespaces obey, rather than as four separately-worded rules,
  And for each of the four namespaces it states: the shape the number takes, where the
    authoritative list of already-claimed numbers lives, and how to obtain a free one,
  And for each namespace it states which artifact is expected to move when two claim one
    number, so the reader is not left to negotiate that at the moment of a block,
  And it states that a number, once published, is never reused — including numbers belonging to
    retired artifacts,
  And the document is reachable from the documentation index,
  And the document does not duplicate the enrolment rule, which GE-120b-4 adds to this same
    document as a distinct section.
depends_on:
  - GE-120a
  - GE-120a-1
  - GE-120a-2
doc_links:
