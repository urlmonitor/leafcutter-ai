criteria: |
  No new workspace when the disk is nearly full -- and a clear view of what they use.

  Before a new workspace is made, free space is checked; when it is running low you
  are warned, and below a firm limit the workspace is refused with a plain reason,
  and at any time you can see how much space all workspaces together are taking.
