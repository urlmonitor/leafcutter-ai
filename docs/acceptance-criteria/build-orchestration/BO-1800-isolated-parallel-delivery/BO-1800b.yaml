criteria: |
  Main changes only through the reviewed, checked workflow -- guaranteed, not just encouraged.

  No agent can alter your main branch outside the proper review-and-checks
  process, however it behaves. The guarantee holds even against a misbehaving or
  over-privileged agent, because it is enforced at the source of truth rather
  than relying on good manners locally.
