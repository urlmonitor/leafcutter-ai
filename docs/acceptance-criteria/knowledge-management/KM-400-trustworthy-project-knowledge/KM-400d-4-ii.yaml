id: KM-400d-4-ii
title: "The retrieval deadline bounds the caller's wait, including a stuck lookup, connect or close"
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-400d-4
criteria: |
  Scenario: a blocking graph call outlives the deadline
  Given a retrieve request with deadline_ms 2000
  And the graph server name lookup blocks for 20 s in a way that cannot be cancelled (not a cancellable sleep)
  When a fresh process runs the knowledge retrieve command
  Then the command prints its JSON answer with status unavailable and the warning "retrieval deadline reached"
  And the process exits with the unavailable exit code
  And the time from the start of the retrieval to process exit is at most 3000 ms (deadline plus 1000 ms)
  And that time is counted on the retrieval clock that stats.duration_ms uses, not from process start

  Scenario: closing the graph connection also blocks
  Given a retrieve request with deadline_ms 2000
  And the graph transaction blocks for 20 s and closing the graph connection blocks for 20 s, neither cancellable
  When a fresh process runs the knowledge retrieve command
  Then the answer is printed and the process exits at most 3000 ms after the start of the retrieval
  And the printed answer is complete, valid JSON

  Scenario: a stuck connect after a fast lookup
  Given a retrieve request with deadline_ms 2000
  And the name lookup returns in 0.05 s but opening the connection blocks for 20 s
  When a fresh process runs the knowledge retrieve command
  Then the answer is printed and the process exits at most 3000 ms after the start of the retrieval

  Scenario: useful evidence produced before the deadline is still reported
  Given a retrieve request with deadline_ms 2000
  And the first query returns one evidence item at 500 ms and the follow-up query then blocks for 20 s
  When a fresh process runs the knowledge retrieve command
  Then the answer states whether useful evidence was produced before the deadline
  And the process exits at most 3000 ms after the start of the retrieval
