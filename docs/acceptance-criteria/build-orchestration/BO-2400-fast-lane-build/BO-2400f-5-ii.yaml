id: BO-2400f-5-ii
components:
  - build_orchestration
title: "A lane step that names an agent not chartered for it fails a structural check before any run can reach it"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the fast lane declares, for every command-running step, the agent it asks and
    the step's kind — one of reads_store, changes_store, changes_repository or publishes,
  And the agent registry declares, for each agent, whether it may run
    repository-changing commands and, in its optional step-kinds field (BO-2400a-1-iii),
    which kinds of step it may run,
  When the structural check runs over the lane,
  Then it fails when any step names an agent whose registry entry declares that it may
    not run commands, and the failure names the step, the agent, and the registry
    declaration that forbids it,
  And it fails when a command step of kind K names an agent whose step-kinds field does
    not list K, and the failure names the step, the agent, K, and the kinds that agent
    does declare,
  And an agent whose registry entry has no step-kinds field is read as covering no kind,
    so every command step naming it fails on this clause,
  And it fails, reported as undeclared rather than as forbidden, when a step that changes
    the store or the repository names an agent whose registry entry says nothing either
    way about running commands — an undeclared permission is not treated as granted,
  And it passes when every step names an agent whose registry entry declares
    permits_shell true and lists that step's kind.

  Given the lane as it stood on 2026-09-25, whose resolve and producibility steps name
    status-checker, which declares permits_shell false,
  When the check runs over that lane,
  Then it fails and names both steps.

  Given the lane as it stood on 2026-09-27, whose release step names python-coder, whose
    registry entry says nothing about running commands,
  When the check runs over that lane,
  Then it fails and reports the release step as undeclared.

  Given a lane whose every command-running step names the command-step-runner
    (BO-2400a-1-i), whose registry entry declares permits_shell true and lists all four
    step kinds,
  When the check runs,
  Then it passes,
  And if that registry entry is changed to declare permits_shell false, or to drop the
    declaration, the same lane fails on every command-running step — the pass comes from
    the registry entry, not from the agent's name,
  And if instead publishes is removed from that entry's step kinds, the same lane fails
    on its publishes-kind steps (push and pull request) and on no other step.

  Given one further command-running step is added to the lane naming status-checker,
  When the check runs,
  Then it fails naming the added step, without the check itself having been edited to
    list that step — the check covers every step the lane dispatches, not a list of the
    steps known when it was written.

  Given the check's verdict about an agent,
  When that agent's registry entry changes,
  Then the verdict follows the registry: the check reads the registry each time it runs
    and holds no copy of which agents are permitted.
