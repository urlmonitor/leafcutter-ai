id: DK-300b-1
title: "Admission preserves the entire goal through every supported input surface"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given a 1000-word request within 16000 characters with an existing artifact ID near its end,
  And a boundary request containing exactly 16000 characters,
  When either request enters through a supported host or direct run input,
  Then the full admitted goal remains verbatim in the run checkpoint and intent request,
  And the late ID is eligible for recognition after scanning the entire admitted goal,
  And the request is neither split into independent intents nor reduced to a prefix.
