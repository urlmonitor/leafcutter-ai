notes: |
  Wave 2. User scope change 4 (PO gate 2026-10-25): a review expiring is checked
  at mark time here; the periodic re-check of finished work stays in TQ-400
  (TQ-400a/b). The brief's fingerprint is the git blob sha; the IT PO confirms.

  The age clause is deliberate: decay is driven by content, not by a clock. That
  matches the ACS-1100b-1 staleness ruling (age is declared, not a halt trigger).
