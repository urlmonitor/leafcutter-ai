id: ACD-200b-1
components:
  - ac_driven_dev
readiness: reviewed
priority: medium
title: "IT PO template acts on the rule check's documentation-coverage finding instead of carrying its own gate"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given templates/agents/it-po.md is the IT PO agent template,
    and the documentation-coverage check is owned by the requirement rule check (ACD-2500a-2-v),
  When the template is read,
  Then it contains no documentation-trigger coverage procedure and no trigger-to-specialist
    table of its own,
  And it names the requirement rule check as the owner of the documentation-coverage check,
  And it instructs the IT PO that when that check reports a documentation trigger with no
    matching documentation AC, the IT PO adds the missing documentation AC for the named
    specialist before any AC in the batch is set to readiness: reviewed,
  And the trigger-to-specialist mapping it relies on is the five-entry one read from the single
    config source named in ACD-2500a-2:
    - how-to -> documentation-expert
    - reference-doc -> documentation-expert
    - sequence-diagram -> architecture-diagram-author
    - state-diagram -> architecture-diagram-author
    - component-diagram -> architecture-diagram-author,
  And the template states: "Batches without documentation coverage for triggered
    categories MUST NOT receive readiness: reviewed."
depends_on: [ACD-200b, ACD-2500a-2-v, ACD-2500e-2]
