criteria: |
  Given the fast-lane phase order,
  When its phases are enumerated,
  Then it contains no LLM review agent, no LLM validator agent, and no LLM fulfillment
    gate agent
  And the only completion arbiters it lists are the mechanical proof-of-done gates.
