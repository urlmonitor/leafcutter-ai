title: "Only captures shaped like an acceptance-criterion id count as coverage tags"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100b.yaml
criteria: |
  Given the repository's own unit-test tree exactly as committed — including the
    test files that exist to test the tagging mechanism, which contain the
    literal text "# covers:" inside fixture strings, docstrings and unrendered
    f-string placeholders — and the AC store exactly as committed,
  When the canonical coverage-tag reader scans that tree and the captured values
    that resolve to no acceptance criterion in the store are listed,
  Then every value in that list has the shape of an acceptance-criterion id (a
    2-6 letter uppercase prefix, an optional second uppercase group, a number,
    and optional hierarchy suffixes) — so ACD-1200a-1, ACD-1200a-6, ACS-100i-4,
    AC-1 through AC-6, FIN-001 and ADR-015 remain listed
  And none of the values that are not id-shaped are listed: the bare characters
    " and ', the unrendered placeholders {ac_id}, {self.child_a_id} and
    {nonexistent_id}, the documentation placeholders <AC-ID>, <id> and
    <deprecated-id>, and the English words the, tag, tags, config, a, fail-open
    and Finding
  And the list is a subset of the 80 values today's reader produces over the same
    tree — no value that today's reader does not produce is newly introduced
  And the list contains at most 16 values, down from today's 80
  And the captured ids that DO resolve to an acceptance criterion (600 of today's
    680 distinct ids, across 2,328 tag records) are unchanged in number and
    content — the narrowing removes non-tags from the unresolved list only and
    removes nothing from the resolved list
  And the same result is produced by invoking the reader as a process over the
    on-disk tree, so a check that only inspects the reader's pattern text cannot
    satisfy this criterion.
