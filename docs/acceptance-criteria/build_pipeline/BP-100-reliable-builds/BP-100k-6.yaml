id: BP-100k-6
components:
  - build_pipeline
title: "A deployed output the build recorded writing but that is absent from disk is reported and fails the run — deletion is the most complete drift there is, and it is the only kind the gate ignores"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a deployed output that the build recorded as having been written,
  And that output has since been removed from the project,
  When the output-drift gate runs,
  Then it names that output, states that the build recorded it and that it is no
    longer present, and fails the run,
  And the missing output is counted in the run summary as its own reported
    condition rather than appearing only as a passing informational remark,
  And the missing output is not counted among the outputs the gate verified,
  And the run is not described as clean and does not exit as though every
    recorded output were present,
  And given the same output is restored unchanged,
  When the gate runs again,
  Then it is reported as matching its recorded source and the run passes.
depends_on:
  - BP-100k
