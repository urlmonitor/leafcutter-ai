assigned_agent: llm-expert
estimated_complexity: S
it_requirements:
  - "Applicability is determined by whether the ticket's changed-file set includes any Python files; an empty Python set yields a skipped (not failed, not passed) outcome."
  - "A skipped ruff check must be distinguishable in the sign-off record from a passed one, so an auditor can tell 'linted clean' apart from 'nothing to lint'."
