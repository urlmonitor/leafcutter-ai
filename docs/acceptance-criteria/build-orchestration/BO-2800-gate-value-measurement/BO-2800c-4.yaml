notes: |
  Satisfies the how-to entry in BO-2800c's documentation_triggers, and absorbs what was
  BO-2800c-5's reference material. The two were separated as how-to and reference, but the
  how-to already had to walk a reader through reading the rate, the per-problem-kind
  breakdown and the unattributed exclusions — so the reference document would have
  restated the same figures a second time, in a second file, for one small record. One
  document with a field table is the cheaper and less divergent shape here.

  Suggested assignee at enrichment time: documentation-expert.

  THE GUIDE MUST NOT POINT AT RETIREMENT RULES. An earlier revision required it to "point
  the reader to the retirement rules that consume these numbers". Those rules do not
  exist — see the BO-2800 L0 notes for the verification. A guide that points a reader at
  BO-2500d for them sends them to a completed fast-lane / heavy-lane agent split that says
  nothing about thresholds. The corrected clause requires the guide to say plainly that the
  decision half is unwritten.
