notes: |
  The PO's instruction was to ENUMERATE the readers rather than fix only the one
  named in the L1 notes — one unpatched reader is enough to keep sending people
  to "repair" a parked tree. This AC makes the enumeration an executable object
  rather than a paragraph: a list the tests read, reconciled against what is
  actually in the tree, so the next reader added to the store cannot join
  silently.

  Deliberately NOT a count. This AC never asserts how many surfaces exist; it
  asserts that the enumeration and the discovered set agree. A fixed count would
  rot on the first new scanner (the ACS-800/KM-KGS count-agnostic precedent) and
  would also start drifting into KM-200c's population-reporting remit.

  The named-surface behaviour for the orphan scan specifically — including what
  it must show instead of hiding the tree — is ACS-1200b-2.

  IT-PO ENRICHMENT (2026-08-14). Complexity raised M -> L: the discovery scan
  found seventeen candidate back-link readers spanning three directories and two
  build phases. Even after triage this is a new registry artifact, a
  reconciliation check, and one executed assertion per surviving surface — well
  beyond a two-or-three-file change. The single highest-value finding is
  scripts/ac_store/fix_ac_orphans.py: an auto-repair WRITER that would perform
  ACS-1200d-2's forbidden half-un-park without anyone deciding to.
