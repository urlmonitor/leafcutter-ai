assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    delivery_refusal_kind:
      type: string
      enum:
      - credential
      - diverged
      - unreachable
      - other
      description: Classification of a refused push or PR creation, made from the remote's own text by
        the BO-2400f-4-vii delivery subcommand and added to each of push / pull_request. Only 'credential'
        produces the credential-failure outcome.
    fast_lane_credential_failure_outcome:
      type: object
      required:
      - status
      - classification
      - refused_step
      - branch
      - commit
      - remote_refusal_text
      - branch_on_remote
      - next_action
      - worktree_path
      properties:
        status:
          const: blocked
        classification:
          const: credential_failure
        refused_step:
          enum:
          - push
          - pull_request_creation
        branch:
          type: string
        commit:
          type: string
        remote_refusal_text:
          type: string
        branch_on_remote:
          type: boolean
        next_action:
          type: string
          description: Push <branch> and open its pull request with a login that can push; do not rebuild.
        worktree_path:
          type: string
        pr_url:
          description: MUST be absent.
  reference_file_path: scripts/build_orchestration/_fl_cli.py
  n_location_rule: '2: (1) the refusal classifier inside the BO-2400f-4-vii delivery subcommand (registered
    in scripts/build_orchestration/_fl_cli.py); (2) the lane''s terminal-outcome construction in templates/workflows-js/fast-lane-ship.js.
    That is the PR-failure return at :2106-2120, which today reports status ''error'' for every failure,
    and buildFastLaneDeliveryOutcome (:438, BO-2400f-4-vi single site).'
  required_skills:
  - python-coder
  post_write_commands:
  - python scripts/build.py --target-dir .
  - python -m pytest unit_tests/build_orchestration/ unit_tests/workflows/ unit_tests/setup/ -q
  constraints:
  - 'CLASSIFY CONSERVATIVELY FROM THE REMOTE''S OWN TEXT. ''credential'' covers authentication and authorization
    refusals: HTTP 401/403, ''Permission denied'', ''Authentication failed'', ''could not read Username'',
    gh''s ''HTTP 403'' / ''Resource not accessible''. ''diverged'' covers non-fast-forward, ''fetch first''
    and ''rejected'' with no auth marker. ''unreachable'' covers DNS, connection and timeout failures.
    Anything unrecognised is ''other'' and never ''credential''. Declare the marker sets once, as data,
    in the delivery module.'
  - A DISTINCT OUTCOME. credential_failure is its own classification, separate from gate-failure halts,
    declined-step halts (buildDeclinedStepHalt, :735), and the BO-2400f-13 refusal. Its status is 'blocked',
    not 'error' and not 'refused'.
  - 'FACTS ARE READ, NOT RECALLED. commit comes from `git -C <worktree> rev-parse HEAD`. branch_on_remote
    is decided from the push result: true when the push succeeded and only PR creation was refused. remote_refusal_text
    is the child''s stderr verbatim. The child already runs without the token (BO-2400f-4-vii), and no
    environment value is echoed.'
  - NEVER CLAIM A PULL REQUEST. A credential failure has no pr_url, and the success message ('PR opened',
    :2141-2143) cannot be reached.
  - THE WORKTREE IS LEFT AS IT STANDS. No step after a delivery refusal removes, resets, cleans, stashes
    or reverts the worktree. The existing PR-failure path releases no claims; keep that, and leave the
    claim-release question to the Product Owner (see notes) instead of deciding it here.
  - ONE CONSTRUCTION SITE. Build the credential-failure outcome through the BO-2400f-4-vi terminal construction,
    or one sibling builder called from one place, never inline at a return.
  - 'JS SIZE: templates/workflows-js/fast-lane-ship.js is over its 1000 counted-line cap (KI-BO-20260930)
    and the check-file-size ratchet refuses any growth. The change to the lane must be a net shrink in
    counted lines: put the logic in Python and replace the existing prompt/branch rather than adding beside
    it.'
delivers_to: null
expects_from:
  ac_id: BO-2400f-4-vii
  contract: 'fast_lane_delivery_attempt: push.ok, push.commit, push.remote_refusal_text, pull_request.attempted,
    pull_request.ok and pull_request.remote_refusal_text, each refusal annotated with delivery_refusal_kind
    by the same subcommand.'
test_required: true
test_spec:
- name: test_permission_denied_push_is_a_blocked_credential_failure
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: discrimination
  description: Under the harness, with delivery stubbed to a push refused with 'Permission denied', the
    terminal payload is status 'blocked', classification 'credential_failure', and not a declined-step
    halt, a gate halt or a refusal.
  must_catch:
  - Every delivery failure is reported as status 'error' (today's behaviour).
  - The credential failure is routed through buildDeclinedStepHalt.
- name: test_credential_failure_names_step_branch_commit_and_remote_text
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: criterion
  description: The same payload has refused_step 'push', branch fast-lane/uxp-514, the run's commit sha,
    and the remote's refusal text verbatim.
- name: test_credential_failure_says_push_by_hand_not_rebuild
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: criterion
  description: next_action tells the operator to push that branch and open its PR with a login that can
    push, and does not tell them to rebuild.
- name: test_credential_failure_never_reports_a_pull_request
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: discrimination
  description: The payload has no pr_url, and its message does not say a PR was opened.
  must_catch:
  - The success message text is still appended on the blocked path.
- name: test_pr_refused_after_push_names_pr_creation_and_branch_already_on_remote
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: criterion
  description: 'With the push ok and pr-create refused with HTTP 403: refused_step is ''pull_request_creation'',
    branch_on_remote is true, and the message says the branch is already on the remote.'
- name: test_worktree_is_intact_clean_and_on_branch_after_credential_failure
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: integration
  angle: real_artifact
  description: 'REAL git: a local bare remote whose pre-receive hook rejects with ''Permission denied''.
    After the delivery subcommand runs, the worktree exists, is on fast-lane/uxp-514, its HEAD sha is
    unchanged, and `git status --porcelain` is empty.'
- name: test_diverged_or_unreachable_push_is_not_a_credential_failure
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: integration
  angle: discrimination
  description: The classifier is fed REAL git stderr from a non-fast-forward push to a local bare remote
    and from a push to an unreachable URL. Each is classified 'diverged' / 'unreachable' rather than 'credential',
    and the remote's text is carried verbatim.
  must_catch:
  - Any non-zero push exit is classified as a credential failure.
