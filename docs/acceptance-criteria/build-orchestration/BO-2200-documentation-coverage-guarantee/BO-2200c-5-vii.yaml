test_spec:
  - name: test_bo_2200c_5_vii_documentation_expert_dispatch_prompt_carries_leaf_mode
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: templates/workflows-js/build-feature.js
    description: "Run build-feature over a doc-required ticket fixture through unit_tests/_workflow_engine_harness.py with a mocked agent(); capture the prompt actually passed to the documentation-expert dispatch and assert it states the dispatch cannot spawn sub-agents, names the specialists, tells the agent to read .claude/agents/<specialist>.md (falling back to templates/agents/<specialist>.md) and author the doc itself, says it overrides the never-author-yourself rule for this dispatch only, and forbids a handoff to a specialist absent from the ticket's agents map."
    must_catch:
      - "build-feature.js dispatches documentation-expert with the same prompt as every other phase (no leaf-mode text)"
      - "the leaf-mode text is defined in build-feature.js but never appended to the prompt sent to the dispatch"
  - name: test_bo_2200c_5_vii_other_phases_do_not_receive_leaf_mode
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: templates/workflows-js/build-feature.js
    description: "Negative control in the same harness run: the prompt captured for pr-reviewer (and every other non-documentation-expert phase) does not contain the leaf-mode instruction."
    must_catch:
      - "the leaf-mode instruction is appended to every phase prompt unconditionally"
test_rationale: |
  Per CLAUDE.md "Gate / Workflow ACs -- Verify Behaviorally, Not by Grep", a grep of
  build-feature.js for the leaf-mode string would pass on a constant that is defined and never
  sent. Both tests therefore execute the real workflow under the existing engine harness and
  assert on the prompt the mocked agent() actually received. The negative control on pr-reviewer
  catches the opposite wrong version, an unconditional append that would tell every phase it may
  override its own template.
