criteria: |
  Given the repository in state one, as it stood when five build-lifecycle functions
    were added with passing proof tests, no registered capability on the command
    surface, and no automation running them,
  When the connection from registered capabilities to the automation that runs them
    is checked,
  Then nothing is reported, because the inventory of registered capabilities is empty,
    And the criteria covering those five functions are nonetheless refused eligibility
      to be marked done, because nothing reaches the code.

  Given the repository in state two, in which the same functions are registered as the
    capabilities `claim`, `release` and `mark-done`, and no automation invokes any of them,
  When the same check runs,
  Then all three are reported as registered capabilities that nothing runs,
    And the change is refused.

  Given the repository in state three, in which the build automation invokes all three
    capabilities,
  When the same check runs,
  Then none of the three is reported and the change is not refused.
