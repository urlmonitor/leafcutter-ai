    relevance: "OWNS BYTE STABILITY AND ITS TEST SHAPE — INHERIT, DO NOT RESTATE. Byte stability means a record needing no change is never OPENED for writing, not that it is rewritten identically: a load-and-dump round trip preserves every value while reformatting quoting, key order and line wrapping. At 3,925 records this is the largest-churn operation the store has contemplated, so this is where the rule earns its keep. Its test shape (raw-byte hash before/after plus an anti-no-op control in the same run) is the one to copy."
