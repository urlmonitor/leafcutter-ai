it_requirements:
- 'Project resolution is performed by the separate resolver module delivered by BO-4300a-1 (duplication
  audit C4; KI-CG-20260925-shared-root-resolver-accepts-non-repo-workspace-parent), in exactly this order:
  (1) --repo-root when given; (2) otherwise the parent of `git rev-parse --path-format=absolute --git-common-dir`
  run from cwd -- and when that folder holds the maker''s own marker record, the project is the marker''s
  recorded project_root, never the workspace clone itself; (3) otherwise a bounded search of cwd''s immediate
  children, then of cwd''s siblings, where a candidate counts only when git itself confirms it is a repository
  (an empty .git folder is not one), a maker-made workspace counts as its recorded project, and candidates
  are de-duplicated by resolved project before exactly one match is required (AMBIGUOUS_REPO with candidates
  on more than one); (4) otherwise NO_REPO naming searched_from.'
- 'A workspace identifies its project ONLY through the maker''s own marker record. The landing-place convention
  (inferring the project from a folder''s position under worktrees/ or any other landing place) is NOT
  a resolution step. When a marker''s recorded project_root is missing or is not a repository, the answer
  is NO_REPO naming the marker -- never the clone itself, never a folder guessed from the path.'
- 'Forbidden in resolution: any anchor on the file location of the maker or resolver (__file__ or equivalent;
  the deployed copy lives outside every repository in the dev layout and inside the consumer project
  in the consumer layout, so either would give a cwd-independent wrong answer); any upward walk that
  accepts a folder because ".git exists" or "CLAUDE.md exists" (the dev-layout workspace parent has both
  and is not a project); any caching of an answer (module global, file, environment) -- every call recomputes
  from its own inputs; and any reuse, import, wrapping or copy of templates/scripts/commit_guardian/_resolve_root.py,
  which does all three.'
- 'The landing place is derived from the resolved project only, never from cwd (F3). git is run with
  its working directory set to the target, or with -C <path> for verbs other than commit only; a commit
  is never spelled `git -C <path> commit` (KI-CG-20260925-commit-delegation-hook-misses-git-dash-c).'
- Answers conform to the result contract delivered by BO-4300c-2 (one JSON object on stdout, status/code/exit
  mapping, workspace_path absent on every non-ok answer).
- Proof runs the DEPLOYED maker -- the copy an install delivers, resolved through the shared test locator
  delivered by BO-4300f-4 -- as a separate process against real temporary git repositories with a real
  bare hub. No mock of git, no import of the maker module, no grep of its source (CLAUDE.md 'Gate / Workflow
  ACs -- Verify Behaviorally, Not by Grep'); a test never falls back to the templates/ source copy.
- 'Tests must not spawn the package''s own scripts/build.py (CLAUDE.md ''Tests must not spawn their own
  build.py''): the deployed maker comes from the shared deployed layout, and fixture projects carry a
  minimal stub build entry point that installs a real, rejecting hook in well under a second. A test that
  must mutate the package and build its own copy says so and justifies it in its ticket.'
- All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
  isolated global and system config; afterwards the developer's own repository's branches, registered
  worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_beta_is_answered_ok_with_same_location_from_every_starting_point
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: From proj's top folder, three levels down, the parent folder, a sibling folder, inside
    W1 and inside the 'beta' workspace, every request for beta is answered ok with the same workspace_path.
- name: test_every_starting_point_resolves_the_same_project
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: Every answer's repo_root is proj.
- name: test_beta_never_lands_inside_the_starting_folder
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: In every case beta's workspace_path is in proj's landing place and is not inside the folder
    the request started from.
- name: test_workspace_parent_with_empty_git_and_claude_md_is_never_resolved_as_the_project
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: 'The dev layout''s workspace parent is built with an empty .git/ folder and a CLAUDE.md
    (git discovery bounded to the temp root via GIT_CEILING_DIRECTORIES). Run from it, the deployed maker
    answers ok with repo_root == proj; with a second child repository added it answers AMBIGUOUS_REPO listing
    both; with proj removed it answers NO_REPO. In no case is repo_root the parent. The same three cases
    are repeated through the deployed resolver module in a separate process.'
- name: test_resolution_never_anchors_on_the_makers_own_location
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: With the deployed maker living inside project A's install, a request started from a temp
    folder that is not in or beside any repository answers NO_REPO naming that folder as searched_from,
    never project A.
- name: test_inside_a_workspace_the_project_comes_from_its_marker_only
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: From three levels inside W1 the answer's repo_root is the project_root W1's marker records;
    with the marker's project_root pointed at a missing folder the answer is NO_REPO naming the marker,
    and never W1 itself nor a folder derived from W1's position under the landing place.
- name: test_resolver_recomputes_on_every_call
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: seam
  description: In one separate process, the deployed resolver module called from proj and then from an
    unrelated second project returns each project in turn -- no answer is carried over between calls.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer, its exit code, and the state of the workspace, the hub and the main copy afterwards.
  A direct-import unit test would pass while the deployed copy is stale or mis-deployed (F13), and a git
  mock cannot show the half-made and occupied states this family exists to handle. The workspace-parent
  fixture carries an empty .git/ and a CLAUDE.md because that is exactly what the shared resolver
  accepts today (KI-CG-20260925-shared-root-resolver-accepts-non-repo-workspace-parent).
