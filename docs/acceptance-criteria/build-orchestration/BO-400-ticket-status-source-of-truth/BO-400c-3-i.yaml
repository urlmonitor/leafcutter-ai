title: "Editing a ticket already residing under done/ (no move) is not blocked"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
criteria: |
  Given a ticket file already resides at EPIC-Foo/done/03_ticket.md
    (a pre-existing location committed in a prior commit),
  And a staged commit modifies that file in place
    (frontmatter or body) without changing its path
    (no add+delete pair and no rename into done/),
  When the pre-commit done-folder prohibition check runs,
  Then no path change into a done/ subfolder is detected,
  And the commit is NOT blocked by the done-folder prohibition,
  And no "prohibited done-folder move" message is emitted for that file.
