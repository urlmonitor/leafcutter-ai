test_spec:
  - name: test_screen_proof_renders_and_drives_the_component
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "The proof invokes run_vitest_and_parse for the member's .test.tsx file under the jsdom environment and reads a PASSED outcome for it; assert the render and the interaction both occurred."
  - name: test_screen_proof_needs_no_server
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: "Establish the proof with live_surface_testing disabled and no listening socket; assert it completes and no HTTP address was contacted."
  - name: test_screen_source_never_rendered_fails_the_proof
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "A screen whose source was produced but which no test loads fails; assert the instrument records the absence of a render rather than inferring one from file existence."
  - name: test_interaction_with_no_observable_result_fails_naming_both
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "A component that renders and accepts the interaction but changes nothing fails, with the interaction and the unobserved result both named."
  - name: test_live_service_requirement_is_refused_up_front
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "A member whose described result needs a live service is refused before any craft is dispatched, and is never finished on the strength of its source existing."
  - name: test_missing_vitest_binary_is_a_refusal_not_a_pass
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: "With the vitest binary absent, JsRunnerUnavailable becomes a proof_unavailable_here refusal; assert the member is not finished and the run does not report success."
  - name: test_screen_receipt_is_comparing_class_with_distinct_conditions
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: seam
    description: "After a passing screen proof, the receipt carries condition_a, condition_b and a non-empty difference; a render-only proof produces identical conditions and is rejected at write time."
