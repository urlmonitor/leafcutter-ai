  PROMPT-ONLY. The writer's conduct is instruction text in sql-test-writer.md.
  Behavioural substitute: the sql-test-writer eval set in TQ-200d-2, whose rows
  check that "observed" is claimed only with a quoted run, and that no run is
  claimed when no test database is configured. Deterministic backstop: the
  wrong-version runs (TQ-500g-2-ii) run the tests whatever the writer said.

  RELATION TO TQ-500f-4-i. That AC's Given is "under its current instructions,
  does not run the suite". Once this AC lands the writer runs, so its answers
  may be observed when backed by a run; TQ-500f-4-i's last clause already allows
  exactly that for the ordinary writer. No contradiction, but build TQ-500f-4-i
  first (same template; depends_on).

  "BEFORE THE FIX" FOR A STORED PROCEDURE means the procedure's definition as it
  was before the work began, installed into the test database for that run, then
  replaced by the fixed one. Watch the re-deploy trap (TQ-500g-2-i) here too: a
  suite that re-installs from source files will silently install the fixed
  version.

  IT-PO ENRICHMENT (2026-09-28)
  llm-expert lane. Build after TQ-500f-4-i (same template).

  IT-PO TECHNICAL ALIGNMENT (2026-10-22, lane fast-lane/tq-500g-2)
  Aligned to what main holds: wrong_version_runner.py (+ _wvr_*), wrong_version_writer.py
  (list/write, --base-ref, declared or derived scope), wrong_version_gate.py finish,
  test-breaker.md, pytest_outcome_reader, done_proof_kind_support / _kind_plugin,
  scripts/db_check/checker.py and sql-test-writer.md Step 4b (TQ-500f-4).
    Q1 shared reader: the writer's two runs are one `wrong_version_runner.py run` without
       --alterations ("the fix undone" is the pre-fix run, the baseline is the post-fix run).
    Q2 test database only: checker.py --target-dir first; anything but reachable fails closed.
    Q3 re-deploy trap: decided by TQ-500g-2-i's catalogue check; an invalid row is never a red.
    Q4 CI: prompt-only; nothing here runs in CI.
    Q5 size: no ratchet on agent templates.
  "--record" is NOT on main at this date: it is in PR #1305 (fast-lane/tq-500g-1-epic). The
  writer never passes it.
  USER DECISIONS (2026-10-22, all the recommended options):
    OQ-1 (A) the to-run-later list lives at <git-dir>/leafcutter/to-run-later/<ac-id>.json;
         no route changes.
    OQ-3 (A) test-first: the pre-fix run goes through fast_lane.py verify_red_baseline
         --ac-root; the post-fix run is reported "not run"; the post-fix wrong-version run
         happens at the normal finish gate before commit.
    OQ-4 (A) the Step 3 example switches to resolve_test_db_address (the test-writer.md
         Step 2b pattern).
  Build order inside the lane: TQ-500g-2-ii, then TQ-500g-2-i, then this prompt. The prompt
  quotes rows only those two produce.
