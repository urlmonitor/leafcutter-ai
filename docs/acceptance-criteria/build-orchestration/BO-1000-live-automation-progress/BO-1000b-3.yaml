estimated_complexity: S
it_requirements:
  config_schema_fragment: null
  reference_file_path: "templates/workflows-js/finalize-feature.js"
  n_location_rule: "all"
  required_skills:
    - "python-coder"
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  notes: |
    Policy constraints:
    - Each step that returns measurable results must surface the concrete data in
      its outcome text (e.g. pre-existing-failure count, PR number, tickets/ACs
      closed and skipped counts, merge result); a step that did real work must
      never record its outcome as only "ok"/"done".
    - Capture the result values from each step's own return payload (not a static
      string), so the outcome and the recap (BO-1000b-2) reflect what actually
      happened this run.
    - This is an invariant over BO-1000b-1's outcome text and BO-1000b-2's recap;
      implement it as a shared expectation on the outcome record, not per-step
      duplicated string logic.
    - No new config key. ADR-001 build.py round-trip parity.
