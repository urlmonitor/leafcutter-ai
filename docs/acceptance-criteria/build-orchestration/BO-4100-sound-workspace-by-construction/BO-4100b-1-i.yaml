id: BO-4100b-1-i
title: "Real drift in material the commit did change is still refused"
component: build-orchestration
components:
  - build_orchestration
  - worktree_manager
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: contract_boundary
package_surface: false
criteria: |
  Given a commit whose changed-file set includes a file belonging to the
    supporting-material tree,
  And that file's content differs from the content the check expects for it,
  When the checks that compare supporting material run,
  Then the commit is refused,
  And the refusal names that file,
  And the refusal names no file the commit did not change.
depends_on: [BO-4100b-1]
doc_links:
