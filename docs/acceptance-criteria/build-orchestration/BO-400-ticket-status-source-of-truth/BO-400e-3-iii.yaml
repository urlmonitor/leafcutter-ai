notes: |
  Requested by BrainCandy 2026-10-15 (KI-BO-20260930).

  The second scenario is deliberate: it is what makes this a guarantee the run checks for
  itself rather than a property only a test can observe. Whether the run performs that
  comparison on every finalize, or only the test suite does, is an IT-PO decision; the
  criterion requires that a leak, if it happens, is reported rather than silent.

  The parent-record clause exists because the AC store rolls children up into composites; the
  store already holds composites falsely marked done (see CLAUDE.md "AC-store commits -- stage
  the parent alongside the child"). Closing one child must not flip its parent.

  Fixture must include all three non-closed statuses (todo, in_progress, done) so that a
  closure that writes "done" over a record already done is not mistaken for a no-op.
