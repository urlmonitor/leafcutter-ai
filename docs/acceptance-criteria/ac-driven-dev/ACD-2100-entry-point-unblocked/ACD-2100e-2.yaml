  - ac_id: ACD-2100c-3-i
    contract: "The mismatched-answer outcome in detail: the answer is not applied, the run remains paused with its record on disk, it reports which decision it is waiting on, and nothing is discarded even when the supplied answer names a destructive choice on another decision."
  - ac_id: ACD-2100a-4
    contract: "A waiting record whose location is a function of the project rather than of the caller's working directory -- so the listing step and the resume step in this page work from the project root and from a worktree alike, and a run that reported itself waiting is actually findable."
  - ac_id: ACD-2100e-1
    contract: "ORDERING GAP -- SEE NOTES. The published sequence diagram at docs/architecture/diagrams/c3-006-plan-feature-decision-gate-sequence.md, which this page links and sends an operator to for how their run came to be waiting -- so that this page can stay a procedure instead of restating the five decision points. depends_on does not carry this edge and no hook validates the markdown link, so building this record first ships a live page pointing at a file that does not exist."
test_required: false
test_rationale: >-
  The deliverable is a prose how-to page with no executable surface a test could drive.
  Every step and every outcome it publishes is owned and enforced elsewhere by tests that
  execute: the resume invocation and its three observable endings by ACD-2100c-3, the
  mismatched-answer ending and the drafted-work-unchanged guarantee by ACD-2100c-3-i, and
  the findability of the waiting record from a worktree by ACD-2100a-4. A test over this
  page could only assert that certain words appear in it, which is the presence-shaped
  proof this whole tree exists to discredit -- it would pass on a page that names the
  three outcomes correctly while giving an invocation the route no longer accepts, which
  is precisely the failure that leaves an operator stranded. The two mechanically
  checkable clauses in the criteria are already covered by live commit gates rather than
  being untested: the component declaration by check-doc-frontmatter and the index
  reachability by the generated docs/INDEX.md. A bespoke unit test would duplicate a
  running gate rather than add coverage. Recorded explicitly so test-writer skips with an
  accurate reason rather than silently.
