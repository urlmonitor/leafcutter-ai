title: "Whichever copy of the map you open, it tells you the same thing"
component: knowledge-management
level: L1
status: active
req_status: draft
readiness: draft
priority: medium
criteria: |
  The written map and the drawn map can never disagree about what is trustworthy.

  The same facts exist in a version people read and a version the tool draws, and the
  two are held in step automatically — so which trust ratings you believe never
  depends on which copy you happened to open.
