id: GE-127f-5
title: "Where the standard's own remedy cannot be performed, the standard says so and stands aside, naming the place and the reason, instead of refusing a change no one can satisfy"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a location is declared, with a stated reason, as one where the remedy this
    standard prescribes — moving code out into a smaller companion file — cannot be
    performed at all,
  And a file in that location already stands above its permitted length,
  When an author stages a change that puts measured lines into that file and performs
    an ordinary commit,
  Then the commit is not refused for the file's length,
  And the file is still measured and its length still reported, because what is
    excused is the refusal, not the measurement,
  And the outcome names the location and states the recorded reason, so a reader sees
    that the standard stood aside and why, rather than seeing nothing.

  Given the same change staged against a file in any location that is NOT declared,
  When the author performs an ordinary commit,
  Then the standard applies unchanged, including the obligation GE-127f-1 and
    GE-127f-4 enforce.

  Given a declared location whose recorded reason is empty or absent,
  When an author stages a change to a file in it,
  Then the declaration grants nothing and the standard applies in full, because a
    place that does not say why it is excused has not been excused.

  Given a file in a declared location that breaks a rule other than its length,
  When the author performs an ordinary commit,
  Then that other rule still refuses the change, because this record excuses one
    obligation in one place and is not a general exemption from the guard.

  Given the outcome of any run that measured at least one file,
  When a reader looks at it,
  Then the set of declared locations in force is stated, including when that set is
    empty, so an exemption can never take effect unseen.
depends_on: [GE-127f, GE-127f-1, GE-127c-1]
