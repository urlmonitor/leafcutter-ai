created_by: "docs/acceptance-criteria/build-orchestration/BO-200-atomic-delivery/BO-200b-3.yaml"
criteria: |
  Given a coder agent (python-coder, sql-coder, or frontend-coder) is finishing a ticket
    and its own pre-completion check reports a warn-tier complexity or size signal,
  When the coder writes its sign-off comment,
  Then the comment body includes a context_capsule block containing exactly these fields:
    intent (one sentence), files_touched_rationale (one line per touched file),
    consumers_checked (reused from the blast-radius results already gathered for the
    contract-shrinkage guard), red_baseline (the red-phase test names), and
    design_constraints (the file-split plan and error-handling decisions),
  And the consumers_checked field is not re-derived but copied from the blast-radius results,
  And when the coder's pre-completion check reports NO warn-tier signal, no context_capsule
    block is written.
