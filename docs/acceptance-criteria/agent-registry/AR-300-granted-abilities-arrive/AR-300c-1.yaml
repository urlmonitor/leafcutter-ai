notes: |
  THIS CARRIES A DECISION THE USER HAS ALREADY TAKEN. The abilities move into the
  agent's own definition, beside the declaration of what it is permitted to use.
  The central record's ability fields become derived and validated. The placement
  question is not re-opened here.

  THE NEGATIVE CLAUSE IS THE TEST OF 'ONE PLACE'. 'The header is authoritative'
  and 'the header is also read' are satisfied by the same implementation. Only
  the clause that edits the central record alone and expects NO change to the
  compiled prompt distinguishes them -- and that clause is the one a reasonable
  implementer would omit, because it looks like a test of nothing happening.

  SUPERSESSION, NOT AMENDMENT. INF-600a-1 is an L2 at readiness reviewed and
  work_status todo. Amending it would leave a reviewed record pointing at a
  registry field as the source of truth while this one points at the header;
  two active approved statements about where truth lives is the same defect one
  level up. The frontmatter grant replaces the registry-field question entirely,
  so the record is superseded. Its own child INF-600a-1-i asserts something
  narrower -- that an unresolvable ability id is rejected -- which is not a claim
  about where truth lives; that obligation is carried forward here by
  AR-300c-3-i and INF-600a-1-i is left active for the IT PO to relocate.
