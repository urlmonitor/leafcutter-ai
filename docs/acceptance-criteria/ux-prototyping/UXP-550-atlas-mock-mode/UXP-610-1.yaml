readiness: reviewed
priority: medium
title: "Probing a CI-only endpoint in production leaks no internal detail"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: done
criteria: |
  Given a production deployment of the Atlas,
  When a client sends a request to /api/drift-guard or /api/mock-toggle-check,
  Then the response is a plain not-found that discloses no filesystem paths, stack traces,
    or other internal details,
  So an attacker cannot probe the absent endpoints to learn anything about the server internals.
depends_on:
  - UXP-610
doc_links:
  - path: docs/architecture/adrs/ADR-022-mockups-are-the-real-app-in-mock-mode.md
    relationship: specified-by
    status: exists
assigned_agent: frontend-coder
estimated_complexity: S
it_requirements:
  - "In production the response to /api/drift-guard and /api/mock-toggle-check must be a plain not-found body with no filesystem paths, stack traces, error messages, or handler-specific detail — indistinguishable from any other absent route."
  - "The not-found must result from the endpoint being absent from the production build (UXP-610), not from a handler that runs and formats an error, so no internal code path can leak detail."
delivers_to: null
expects_from:
  ac_id: UXP-610
  contract: "The production build that excludes the CI-only endpoints; this edge case constrains the observable response (plain not-found, zero internal disclosure) when they are probed."
