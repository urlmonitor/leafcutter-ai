notes: |
  Observed 2026-11-16, run wf_1d040da5-d48: the claim command exited 1 on a held target, the
  same status it would give for a crash. The lane discards every non-zero claim reply as
  "never attempted", so the held halt could not be reached.

  The exact value is the IT PO's choice (the 2026-11-16 analysis suggests 3). It stays
  non-success, so the existing CLI test that requires a non-zero exit on a refused target
  still holds; that test gains an assertion on the reserved value.

  The lane in BO-2400f-7-ix does not rely on this status alone: it also recognises the held
  outcome from its output, because an older deployed command still exits 1. This record makes
  the command honest on its own for any caller, not only the lane.

  Placed under BO-2400f-7 (the claim) rather than BO-2400f-8 (the refusal rule) so that only
  one done parent needs its work_status reset; the behaviour is the claim command's report.
  Owner-aware claims (who holds it, and whether a committed in_progress is a live claim) are
  out of scope here and come later.
