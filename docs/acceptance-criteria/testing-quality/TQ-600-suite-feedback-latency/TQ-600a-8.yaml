notes: |
  WHY THIS IS AN EXAMINATION OVER THE EXISTING POPULATION AND NOT A ROUTING RULE. Every
  other behavioural leaf under TQ-600a describes what happens to a test that is already
  in the new world: it is handed the shared layout, or refused it, or compared against
  its old outcome, or counted. Not one of them says the old world must end. The
  distinction matters because a mechanism can be perfect and unused — that is exactly
  the state the tree was in, and it is the state the suite would have shipped in.

  WHY IT MIRRORS TQ-600b-2 RATHER THAN INVENTING A SHAPE. The b-branch already solved
  this problem for its own population. TQ-600b-2 ("every test that creates scratch files
  is examined... every test still using a fixed shared location is named... the
  examination reports a failure rather than a note... reports how many tests it
  inspected") cannot be closed while an offender remains. TQ-600b-3 does the same for
  version-control sites. The a-branch's lack of an equivalent was the asymmetry, and
  symmetry is the fix: a reader who understands b-2 understands this record without
  being taught a second pattern.

  THE TWO-FIGURE CLAUSE IS THE ANTI-GAMING CLAUSE. An examination that demands "consume
  the shared layout OR declare a copy of your own" is satisfiable by declaring all 77 a
  mutator. Nothing mechanical can distinguish an honest declaration from a lazy one, so
  this AC does not pretend to: it requires both figures to be reported, so the outcome
  of the migration is a pair of numbers a human can read rather than a green tick. A run
  reporting "inspected 52, shared 3, own copy 49" and a run reporting "inspected 52,
  shared 49, own copy 3" both pass the offender clause and are not the same result.

  THE INSPECTED COUNT IS NOT BOILERPLATE. This repository has three documented instances
  of a check that examined nothing and reported the same shape as a check that found
  nothing: the AC-store validator's bare-directory glob (exited 0 for eight days), the
  feedback_categories.yaml path that was one directory too high (reported missing on
  every worktree for months), and the merge audit run against a stale origin/main. The
  count is the cheap defence and it is required by the criteria, not left to the it-po.

  NO PER-RUN DEPLOY COUNT IS ASSERTED HERE. The 77 in the Given counts invocation SITES
  across 52 files, exactly as it does in TQ-600.yaml — a looped or parametrised site may
  deploy more than once, and the true per-run figure was never established. The
  examination's own inspected count is the figure this AC asserts against, and it is
  measured by the examination rather than written into it. The per-run deploy figure and
  its bound live on TQ-600a-6.

  RELATIONSHIP TO TQ-600a-5, WHICH IS NOT A CONTRADICTION. TQ-600a-5 chose fail-safe over
  fail-fast on purpose: an undeclared test runs, gets its own copy, and is named. That is
  the right call for a running test and this record does not reverse it. This record acts
  on the repository rather than on the run: the test still passes, and the examination
  still fails until somebody declares it or moves it. Fail-safe at run time, fail-loud at
  commit time.
