id: ACS-500g-6-iii
components:
  - ac_store
readiness: approved
priority: high
title: "The eval harness scores a seeded-gap evaluation all-or-nothing, per round"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given the eval registry configures an agent by a fractional pass threshold —
    pt-classifier at 0.7 — and that agent does not opt into seeded-gap scoring,
  When the harness scores a run for it,
  Then it is scored exactly as it is today: the fractional threshold decides the
    outcome and the reported result is unchanged,
  And seeded-gap scoring applies only to an agent whose registry entry opts into
    it explicitly, so registering the new mode changes no existing agent's
    outcome.

  Given an agent that opts into seeded-gap scoring, and a run in which round 1
    recorded 4 seeded items, round 2 recorded 6, and round 3 recorded 5,
  When each round is scored,
  Then every round carries its own verdict, computed as "the agent reported
    every seeded item recorded for that round",
  And a round that reported 4 of 4 passes, and a round that reported 6 of 6
    passes,
  And a round that reported 4 of 5 fails, and its result names the seeded item
    that went unreported,
  And no configured threshold below "every recorded item" can make a partial
    round pass.

  Given rounds 1 and 2 passed and round 3 reported 4 of its 5 seeded items —
    14 of the run's 15 seeded items,
  When the overall verdict is computed,
  Then the verdict is fail,
  And 93% is never reported as a passing score: the rounds are not averaged, not
    scored as a percentage, and not treated as two-out-of-three,
  And the overall verdict is a pass only when all three rounds are a pass.

  Given a round that recorded 5 seeded items, and the agent reported 4 of them
    plus 10 further findings that were never seeded,
  When the round is scored,
  Then the 10 unseeded findings are recorded in their own list, separate from
    the seeded items,
  And the round is still a fail — unseeded findings do not substitute for the
    missed seeded item and never turn a failing round into a pass,
  And no count taken over the union of seeded and unseeded findings is used to
    decide any round or the overall verdict.

  Given a round whose recorded seeded items, or their count, were visible in the
    material handed to the agent under test,
  When the round is scored,
  Then its status is invalid — a third status alongside pass and fail, not a
    pass and not a fail,
  And the overall verdict is not a pass while any round is invalid,
  And the invalid round is re-run on material the answers have been removed
    from, with the invalid result retained on record.

  Given an overall verdict that is not a pass — whether because a round failed
    or because a round is invalid,
  When the harness finishes the run,
  Then it exits non-zero, so the run can be used as a gate,
  And it exits zero only when all three rounds are a pass.
