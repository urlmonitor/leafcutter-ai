notes: |
  TQ-200d SUGGESTED SPLIT, ITEM 1 (test-writer). Rows stand in for the unit
  tests the prompt-only ACs TQ-500f-3, TQ-500f-4 and TQ-500f-4-ii cannot have.
  The prompt ACs' test_rationale should point at these rows once
  ac-authoring/tq-500f-2-ii-amend has merged (TQ-200d notes); not edited in
  this pass.

  NEGATIVE CASE (TQ-200a-4): "input moved to a new column" is the trap. It is
  the incident-2 shape: the natural fixture keeps seeding the old input, and
  the test then passes for the wrong reason.

  RUN THE ROWS BEFORE THE PROMPT CHANGES LAND. These rows do not depend on
  TQ-500f-3/-4/-4-ii being built: scored against today's test-writer, they
  should mostly fail — the eval's own red baseline. That is evidence, not a
  defect; record the before-score.

  LOCAL ONLY (user decision at the PO gate, 2026-09-28): the CI eval gate has
  never evaluated an agent (KI-TQ-20260907). The path to CI is TQ-200b-2; this
  AC does not wait for it and does not claim it.

  WHERE A JUDGE IS NOT NEEDED: the "refresh gate" row's test half is scored by
  running the produced test against the wrong version (TQ-200d-1-i). Other rows
  may start judge-scored; prefer a run wherever the expected outcome is a test
  going red.

  CASES COME FROM ONE ADOPTER'S WRITTEN RECORD, not re-verified against its
  history (same caveat as TQ-500f-5).

  IT-PO ENRICHMENT (2026-09-28)
  The existing artifact mode is product-truth specific (mock/flow). Test
  agents need their own scoring type, and it must live in a sibling module
  because run_agent_eval.py is over the ratchet. The BA flag on TQ-200a-1-i
  (in-scope list is not closed) stands.
  Lane: fast lane (python-coder). It can go first in the TQ-200d family.
  IT-PO TECHNICAL ALIGNMENT (2026-10-23, against origin/main after TQ-500g-1,
  TQ-500g-2 and TQ-500g-4 landed; TQ-500g-3 read from PR #1324)
  Criteria, title, depends_on and readiness untouched. Rewritten:
  it_requirements, delivers_to, doc_links, test_spec, test_rationale,
  test_required, package_surface. Mismatches between the earlier enrichment
  and the code as it stands:
    - run_agent_eval.py is 1087 counted lines, not 1438 (still over 400).
    - "gold-scoring mode" is --score-gold. It exists for artifact mode only,
      skips rows without expected.gold_target, skips file-delta assertions
      and never calls the judge.
    - main() knows only "label" and "artifact"; any other mode exits 2.
    - Artifact mode is product-truth specific (store copy, jsonschema,
      validate_product_truth.py), so "a sibling scoring type" means a new
      scoring_mode with its own row loop, not a new artifact_type.
    - No local-run marker exists in the results payload or the report.
      A registered agent with triggers is run by the informational CI job.
    - unit_tests/evals/test_agent_eval_config_triggers.py pins the agent list.
    - test-writer.md has unrendered {{config.output_root}} placeholders.
    - INF-1100d-4's scanner covers templates/ and config/ only, not
      scripts/evals/sets/.
    - test-writer.md already carries Step 4b (three questions, vacuity
      checklist, worked refresh-gate case), so the before-score may not
      "mostly fail" as predicted above. That is still evidence.
  Doc links to .py source were replaced by the config, README and workflow
  they are described by; module names live in it_requirements.
  Module names and the set layout were settled by the user decisions
  below; in_scope_files use them.

  USER DECISIONS (2026-10-23, answered in the main session; all IT-PO
  recommendations accepted)
    OQ-1  A: one new produced-tests scoring_mode in sibling modules
          scripts/evals/produced_tests_mode.py, produced_tests_scoring.py and
          (TQ-200d-1-i) produced_tests_runs.py; run_agent_eval.py dispatches
          it and offsets the lines by moving out the unused text-assertion
          scaffold. No test_ prefix on these modules.
    OQ-2  Sets at scripts/evals/sets/<agent>.jsonl, fixture projects and
          recorded outputs under scripts/evals/sets/<agent>/{projects,recorded}/,
          recorded test files with the suffix .py.recorded; bad outputs for
          unit tests under unit_tests/evals/fixtures/ with the same suffix.
    OQ-3  A: render {{config.output_root}} to the sandbox and copy the scripts
          the template names (scripts/db_check; for runner callers also
          scripts/build_orchestration and scripts/ac_store) into it.
    OQ-4  The scorer writes the sandbox AC record after the agent runs, from
          its # covers: tagged tests, with the must_catch from the row. The
          agent works on the pre-fix code; the scorer installs the fix and
