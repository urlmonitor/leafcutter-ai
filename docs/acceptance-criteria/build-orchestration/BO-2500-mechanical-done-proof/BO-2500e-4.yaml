id: BO-2500e-4
components:
  - build_orchestration
  - testing_quality
title: "A JS-covered AC stuck in progress can be mechanically marked done"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an active AC currently stuck at work_status in_progress solely because its only tests are
    passing "// covers:<id>" vitest tests (e.g. one of the 12 UXP-596 / UXP-591 ACs),
  When the done-proof oracle evaluates it and the mark-done step runs,
  Then the AC is mechanically marked done through the same mark-done path used for Python-covered
    ACs — it is no longer blocked for being non-Python,
  So front-end features backed by real, passing tests can be proven done end to end.
depends_on:
  - BO-2500e
