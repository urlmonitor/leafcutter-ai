notes: |
  The anti-regression clause for GE-119a-2. Without it, the disposition field is a
  convention rather than a rule, and check nineteen inherits the silent-pass behaviour by
  omission — which is precisely how the current family of 18 arrived at the same defect
  independently.

  Note the last clause: the registry validation is itself a check, so it is subject to the
  parity requirement of GE-119b. A registry validator that cannot read the registry from a
  worktree and passes anyway would be the same bug one level up.
