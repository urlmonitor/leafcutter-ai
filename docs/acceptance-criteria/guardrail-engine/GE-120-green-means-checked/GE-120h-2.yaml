id: GE-120h-2
title: "The advertised checks already left unrun are carried as a quantity that can only fall, so the change that adds one is refused and the change that fixes one is required to say so"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a repository in which some checks are advertised as protecting the reader while
    nothing runs them, and a record naming each of those checks as a state already
    accepted,
  When an ordinary commit is made that neither advertises a further such check nor makes
    a recorded one run,
  Then the commit completes, and no check named in that record refuses it — the debt
    already standing does not stop unrelated work,

  And given a change that advertises one further check, in any of the places a reader
    consults, without adding the entry that would cause it to run,
  When that commit is attempted,
  Then it is refused, the newly advertised check is named, and the refusal states that
    the check must be made to run or the advertisement withdrawn,
  And the record is not offered as a place the newly advertised check may be added, so
    the way past the refusal is never to widen the record,

  And given a change that makes one recorded check run, by adding the entry that invokes
    it, while leaving the record as it was,
  When that commit is attempted,
  Then it is refused, the check that is no longer in disagreement is named, and the
    refusal states that the record must be reduced by that check,

  And given a change that both makes a recorded check run and removes that check from the
    record,
  When that commit is attempted,
  Then it completes, and the quantity the record carries is smaller than it was — so the
    only direction the record can move is downward, and resolving today's backlog and
    preventing tomorrow's orphan are one mechanism rather than two.

  Coverage note: exercise all four arms as attempted commits against a real repository,
  asserting on the outcome and the text the author is shown. The two refusal arms are the
  load-bearing ones and neither has a red baseline today: with no such rule in force, both
  changes are accepted silently.
depends_on:
  - GE-120h
  - GE-120h-1
