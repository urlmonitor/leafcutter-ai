  - path: "docs/architecture/adrs/ADR-001-self-hosting-boundary.md"
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    type: object
    description: "Scope-narrowing for the smoke-routing selector — items with no declared durable side-effect are exempt from mandatory smoke routing."
  reference_file_path: "config/agent_registry.json"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py"
  constraints:
    - "A work item that declares no durable observable side-effect (e.g. a documentation-only change) is not mandated through the observable-side-effect smoke check."
    - "The exemption is data-driven (the absence of a declared side-effect), never keyed to a hard-coded item name."
    - "This scope-narrowing must not weaken the mandatory routing for items that DO declare a durable side-effect."
    - "Portable per ADR-001; verify via the build.py round-trip."
test_spec:
  - name: test_docs_only_item_not_force_routed_to_smoker
