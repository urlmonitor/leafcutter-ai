criteria: |
  Given a commit originates from the main tree rather than a linked worktree,
  When the commit-phase gate runs,
  Then it runs the probe and refuses the commit on a non-zero verdict exactly as
    it does for a worktree commit,
  And there is no branch that exempts the main tree from the gate.
