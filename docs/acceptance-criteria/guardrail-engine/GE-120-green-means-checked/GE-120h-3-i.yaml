notes: |
  WHY THIS EDGE CASE NEEDED ITS OWN RECORD RATHER THAN A CLAUSE ON ITS PARENT. The
  obvious, well-intentioned registration is the wrong one. Every one of these five has a
  natural-looking subject — SQL files, scripts under a debugging directory, test fixtures
  — and the natural instinct is to write that subject into the entry as a condition, both
  to be tidy and to save time on unrelated commits. For these five that condition is a
  filter the check never reads, because each resolves its own set; and for the
  debugging-directory case it is worse than useless, because a condition anchored on a
  location this checkout holds no file under is classified as unreachable and fails the
  run. The parent's clauses are all about the checks RUNNING and every one of them can be
  green while a sixth reader of the list is being lied to about what activates them.

  THE THIRD CLAUSE — DECLARING THAT THE CHECK DERIVES ITS OWN CHANGE SET — IS NOT
  DECORATION. Without it the only way to know that a whole-tree entry with no condition
  is correct rather than careless is to read the check's source, which is the habit that
  produced the four-signal problem in the first place. The declaration already exists in
  the list's own vocabulary, so this costs one field and makes the entry self-describing.

  THIS RECORD ADDS NO ENTRY AND REMOVES NONE. It constrains the shape of entries its
  parent adds. If it is built first it has nothing to assert; if the parent is built
  without it, the likely outcome is entries that the existing reachability judgement
  refuses on the same commit — which is a same-day discovery rather than a latent defect,
  but only because that judgement is already registered and already runs.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's fields.

  ---- IT PO ENRICHMENT, 2026-09-14 ----

  THE ONE PLACE THIS RECORD'S TECHNICAL GROUND DIVERGES FROM ITS OWN doc_link, AND HOW
  IT WAS VERIFIED. The doc_link on commit_guardian.json says "The five entries this
  record governs take the derived value". That was measured as the count of the two
  values in use (60 / 2, correct), but the field's SEMANTICS were not: self_derived is
  not a description an author supplies, it is a claim the code checks.
  change_set_source.py was read in full on 2026-09-14 — _SHARED_SOURCE_MARKERS =
  ("get_authored_change", "_authored_change"), and _classify_hook() sends a
  self_derived entry to .failures unless the entry's resolved script text contains one
  of them. All five scripts were then grepped for both markers and none matched; the
  only files under templates/scripts/commit_guardian/ that do are
  check_contract_shrinking.py, check_doc_frontmatter.py, frontmatter_validators.py and
  the shared module itself — which is exactly the two self_derived entries in the
  manifest. GE-120e-2's test_spec names this case directly ("a fixture entry recorded
  as self-deriving whose check obtains its change set by other means is named and the
  determination exits non-zero"), so the rule is asserted, not incidental.

  The criterion is NOT amended for this — criteria are the BA's. The two honest routes
  are recorded in it_requirements and the choice is raised as a caveat for the user,
  because route (b) adds code work to a tree whose parent is explicitly scoped to the
  five checks that need none.

  WHY A change_set_source TEST WAS ADDED BEYOND THE LITERAL CLAUSES. The clause "its
  entry declares that the check derives its own change set" is satisfiable by typing a
  string, and the installed suite would stay green on a false one:
  test_ge_120e_2.py's real-manifest assertion checks only membership in the allowed
  value set, and determine_change_set_sources() is never run over the installed
  manifest. That is the same shape as
  KI-CG-20260831-fictional-config-schema-fragment — a declaration validated for form
  and never against the thing it describes — so the test asserts through the
  determination rather than against the literal value.
