id: BP-300e-2
components:
  - build_pipeline
title: "Valid JSON wrapped in leading and surrounding prose is still parsed and the run continues"
component: build-pipeline
level: L2
status: active
req_status: draft
readiness: approved
priority: high
work_status: done
criteria: |
  Given a /plan-feature run dispatches a helper agent to return a structured result,
  And that agent wraps a complete, valid JSON object in surrounding prose — an
    explanatory sentence or heading BEFORE the opening brace and additional prose
    AFTER the closing brace,
  When the workflow reads the agent's reply,
  Then the workflow recovers the intended JSON object with every field intact,
    disregarding the text before and after it,
  And the run continues to its next stage instead of stopping on the surrounding
    wording.
depends_on:
  - BP-300e
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Edit only the canonical source templates/workflows-js/*.js; rebuild via build.py so the deployed .claude/workflows/*.js copy stays byte-identical (BP-100k drift guard) — never hand-edit the deployed copy."
  - "The tolerant reader is a pure, synchronous, dependency-free function (no I/O); confine try/except to the JSON.parse boundary only, per the project error-handling policy."
  - "Leading prose before the opening brace and trailing prose after the close must both be discarded by the same balanced-scan path — no separate leading-strip heuristic that could diverge."
  - "Behavior must be verified by a runtime behavioral test through the vm.Script replay harness, not a source string-scan."
delivers_to: null
expects_from:
  ac_id: BP-300e-1
  contract: >-
    Inline tolerant reader parseAgentJson(raw, {stage, agent}) that extracts the FIRST
    balanced top-level {...}/[...] (string/escape-aware) from a string, returns
    non-strings unchanged, and throws a typed stage/agent-named error when nothing parses.
doc_links:
  - path: docs/architecture/agent_delivery_workflows.md
    relationship: describes
    status: exists
  - path: docs/build-pipeline.md
    relationship: describes
    status: exists
test_spec:
  - name: test_parse_object_with_surrounding_prose_returns_object
    target_dir: unit_tests/
    framework: unittest
    type: unit
    description: "Reader given '<prose>\\n{\"a\":\"b\"}\\n<prose>' returns exactly {a: b}, discarding text before and after."
  - name: test_run_continues_after_surrounding_prose
    target_dir: unit_tests/
    framework: unittest
    type: integration
    description: "Stubbed agent returns prose-wrapped JSON; the run reaches its next stage rather than stopping."
