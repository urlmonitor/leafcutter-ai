criteria: |
  Real-time visibility into long-running background automation — you always know
  it's working and where it is.

  When automation runs on your behalf over several minutes, today you see almost
  nothing until it finishes, and it's easy to think it has frozen. This goal makes
  such automation observable while it runs: every step announces what it's doing
  and reports how it went, and that progress reaches you as it happens. At any
  moment you know it's actively working, which step it's on, and that nothing has
  silently stalled. This is distinct from BO-300, which gives a post-completion
  recap of what was built and what to run next; BO-1000 is IN-FLIGHT visibility
  WHILE the automation is still running.
