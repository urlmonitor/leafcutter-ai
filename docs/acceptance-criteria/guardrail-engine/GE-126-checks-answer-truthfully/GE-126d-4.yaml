estimated_complexity: M
it_requirements:
  - "The procedure must render its leg list from the single declaration GE-126d-3 introduces and must not enumerate the legs in its own prose. A procedure that lists them in words while the parity check lists them in code is how the fourth leg drifted apart in the first place."
  - "The surface is templates/skills/create-hook/SKILL.md, a skill body rather than an ordinary document. Follow the conventions for skill bodies in that tree and verify the DEPLOYED SKILL.md after a build, because the deployed copy is what an author actually reads (ADR-013)."
  - "Roster membership must be presented as a decision with two recorded outcomes, never as a step an author can leave undone. An omission by default is the current behaviour and is precisely the thing being removed."
  - "The consequence of each choice must be stated in the author's terms - a repair attempt is made or it is not - so the decision is possible without reading the autofix machinery. The author who never reads that configuration is the real reader; the one who does is how KI-CG-020 was found and is not the population being served."
  - "The procedure must route to the component reference for what each leg buys rather than restating it. GE-126d-5 owns that surface and a second statement of it will drift."
  - "The two entry surfaces - the skill procedure and docs/how-to/creating-a-claude-code-hook.md - must both lead an author to the complete leg list. Whichever one they reach first has to be sufficient or the omission simply moves."
  - "Frontmatter and doc-type conventions must satisfy check_doc_frontmatter and check_doc_types_agents at the commit that lands the change."
test_spec:
  - name: test_registering_a_fixture_by_following_the_procedure_yields_no_finding
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: e2e
    angle: reachability
    surface_invoked: "the deployed create-hook procedure followed step by step, then .leafcutter/scripts/commit_guardian/check_hook_parity.py"
    description: "A fixture check is registered by executing the procedure's steps as written in an isolated tree, then the parity check is run and reports nothing about it. This is the direct inverse of the observed KI-CG-020 failure."
  - name: test_omitting_the_roster_decision_produces_the_finding_the_procedure_predicts
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The same exercise with the roster decision skipped produces exactly the finding the procedure told the author to expect - the two are compared to each other, so a procedure that predicts a message the parity check does not emit fails."
  - name: test_the_procedures_leg_list_is_rendered_from_the_declaration
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "A leg added to the declaration in a fixture tree appears in the procedure with no edit to the procedure's text - the procedure carries no second copy of the list."
  - name: test_the_deployed_skill_body_is_what_carries_the_complete_leg_list
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: "scripts/build.py --target-dir <temp>"
    description: "After a real build, the deployed create-hook SKILL.md presents the full leg list, and the adjacent how-to leads to it too - verifying the copy an author reads rather than the template."
test_rationale: |
  The L1 states the disqualifying test directly: asserting the procedure document
  contains a fourth step passes on a sentence nobody reads, and that sentence is exactly
  what a documentation change produces by default. The first descriptor is therefore an
  end-to-end exercise — follow the procedure, then run the parity check — because that
  sequence is the literal inverse of the observed failure, in which an author completed
  the documented procedure, watched the parity check pass, and had landed an
  incompletely registered check. The second descriptor compares the procedure's
  predicted message to the parity check's actual message rather than to a literal, so a
  procedure that promises a warning nobody emits fails. The fourth verifies the built
  skill body, because create-hook is portable and the author reads the deployed copy.
