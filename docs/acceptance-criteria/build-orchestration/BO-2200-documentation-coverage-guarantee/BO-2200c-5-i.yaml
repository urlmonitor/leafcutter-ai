title: "The documentation target is the doc_link the record OWNS, not the first one it mentions"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
criteria: |
  Given a leaf AC whose `doc_links` list holds, in this order,
    1. `docs/reference/plan-feature-layout-and-startup-checks.md` with `relationship: describes`, and
    2. `docs/how-to/run-the-startup-checks.md` with `relationship: creates`,
  When a ticket is generated from that AC,
  Then the target documentation path named on the `### documentation-expert` contract line is
    `docs/how-to/run-the-startup-checks.md` -- the entry whose relationship declares that this
    record produces the document -- and NOT
    `docs/reference/plan-feature-layout-and-startup-checks.md`, which the record only describes
    and which merely happens to appear first.
  And regenerating the same AC with those two entries in the opposite order names the same
    target, so position in the list changes nothing about which document is demanded.
  And the relationships that confer documentation ownership are exactly `creates` and
    `modifies`: an entry carrying `describes`, `related`, `constrains`, `specifies`, or
    `implements` is never selected as the target, at any position, whether or not an owning
    entry also exists.
  And the specific regression that must not reappear: an AC that links
    `docs/reference/ac-schema.md` with `relationship: specifies` -- the shape ~170 records in
    the store already carry -- is NOT given `docs/reference/ac-schema.md` as its documentation
    target, because "this document specifies my behaviour" is a statement about an input the
    record reads, not a claim to produce it.
  And every path that IS selected as the documentation target also appears in the generated
    ticket's `files_touched`, so a document a record is told to write is always declared as a
    file that record will edit -- documentation ownership is a strict subset of edit-surface
    membership, never disjoint from it.
