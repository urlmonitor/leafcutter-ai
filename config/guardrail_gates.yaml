# guardrail_gates.yaml
#
# Machine-readable mapping of (change_target, risk_surface) pairs to mandatory
# guardrail agent names. Consumed by generate_ticket_from_ac.py::_build_agents_map
# to compute the full agent map for generated tickets.
#
# Structure:
#   <change_target>:          # 10 ADR-017 values: code, schema, ui, infrastructure,
#                             #   pipeline, prompt, model, config, docs, dependency
#     <risk_surface>:         # 6 ADR-017 values: internal, contract_boundary, auth,
#                             #   privacy, safety, cost
#       - <agent-name>        # must be a valid is_ticket_phase: true agent from agent_registry.json
#
# Multi-value targets (e.g. a change that touches both code and schema) union
# their gate lists — the caller is responsible for deduplication.
#
# risk_surface semantics (ADR-017 vocabulary):
#   internal          - internal-only change; lower scrutiny
#   contract_boundary - change crosses a public API or system boundary; highest scrutiny
#   auth              - change to authentication or authorisation logic
#   privacy           - change that touches PII or private user data
#   safety            - change that could cause harm, data loss, or irreversible state
#   cost              - change with significant infrastructure cost implications
#
# Agent names must match agent IDs in config/agent_registry.json with is_ticket_phase: true.

code:
  internal:
    - test-writer
    - test-runner
  contract_boundary:
    - architect-review
    - test-writer
    - test-runner
    - pr-reviewer
  auth:
