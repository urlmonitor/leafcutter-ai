notes: |
  THIS L1 SUPERSEDES A LIVE APPROVED REQUIREMENT -- ACT ON IT EXPLICITLY.
  ACD-300g ("Each stage's AC output is committed to git before the workflow
  advances to the next stage") is readiness approved, work_status in_progress
  and implemented_by scripts/workflows/plan-feature.js, with four children
  ACD-300g-1..4. Its criteria mandate one commit per stage and a stage-naming
  commit message. That is the direct opposite of this L1. When this is approved
  ACD-300g and ACD-300g-1..3 must be set status superseded_by with
  superseded_by: ACD-2200d. Do not build this while ACD-300g remains active --
  a store holding both is a store where either outcome can be called correct.

  WHAT ACD-300g WAS BUYING -- BOTH MUST SURVIVE THE COLLAPSE OR THIS IS A
  REGRESSION DRESSED AS A SIMPLIFICATION:
    - ACD-300g-4: cancel commits nothing. Drafts stay on disk uncommitted. With
      one commit at the end this becomes easier rather than harder -- but it
      must still be asserted, not assumed.
    - ACD-300g-2-i: partial-run recovery. Uncommitted AC files left by a crashed
      earlier session are DETECTED. Per-stage commits were the crash-recovery
      mechanism; removing them removes it. Either carry the detection forward or
      have the user accept the loss knowingly. Do not let it lapse by silence.

  PAIRED WITH ACD-2200c -- READ THAT ONE BEFORE DECOMPOSING THIS. The AC
  commit-guardian hooks validate only what is in that commit's index. Changing
  from several small commits to one large one changes what those hooks see. In
  particular a session that adds children to an existing parent must stage the
  PARENT alongside the children or check_ac_parent_covered_by and
  check_done_proof never look at a parent at all -- the exact structural blind
  spot that let ACD-400a drift for five days. A single end-of-session commit
  makes this easier to get right and much worse to get wrong.

  ALSO IN SCOPE: the commit must be surgical. It contains the session's AC files
  and nothing else. This repository has a live trap where an unrelated build
  step rewrites docs/INDEX.md and a broad stage silently commits a ~175-line
  deletion alongside the intended work.
