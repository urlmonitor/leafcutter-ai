title: "Emitted process-feedback is itself routable by a future run so the loop compounds"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the router emitted a process-finding entry P1 during run A and left it unresolved,
  When the router runs again (run B) and builds its work queue,
  Then P1 appears in run B's unresolved work queue like any other entry,
  And the router classifies and routes P1 (for example, as an improvement to the
    feedback-collection tooling routed to /create-ac),
  And when P1 is acted on it is resolved with a back-reference to the artifact it
    produced, exactly as for any other entry,
  And the resulting artifact recommends concrete improvements to feedback emission:
    making it faster for agents to fill in, more verbose, and more structured
    (richer required fields up front).
depends_on: [ACD-1500e, ACD-1500e-1]
