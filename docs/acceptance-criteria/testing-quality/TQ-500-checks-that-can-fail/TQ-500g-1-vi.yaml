it_requirements:
- 'Placement: immediately before the commit dispatch. This is after every pre-commit phase, so no later
  step can change the code the runs judged. It runs on every drive that reaches that point, whatever earlier
  sign-offs say. It is not a phase in the agents map, so there is no sign-off to trust.'
- 'Sequence: (1) dispatch the preparer (TQ-500g-1-iv), passing the ids, the base ref and the manifest
  path; (2) dispatch the shared runner CLI (TQ-500g-1-i) with the same ids, test root, AC store root,
  base ref and manifest path as every other route. A preparer that fails or returns nothing is not a halt
  by itself: the runner reports the missing entries as unfinished.'
- 'Dispatch the command through an executor agent registered with permits_shell: true in config/agent_registry.json
  (for example command-step-runner). Never use status-checker: it is registered read-only and has refused
  shell steps (KI-BO-20260927, KI-BO-20260901-1620).'
- Fail closed on the reply. A null, refused or unparseable reply, or one without a boolean gate_passed,
  halts the work as blocked and never counts as a pass. The commit dispatch is unreachable on any path
  that has not read gate_passed true from the runner's own JSON.
- 'gate_passed false: halt before commit, carrying the runner''s JSON verbatim (survivors or unfinished)
  in the halt payload. applicable false: record the runner''s outcome string and continue. Never record
  ''verified'' for it.'
- 'Resume: on a resumed drive, call the runner''s recovery step (TQ-500g-1-iii) before any other dispatch
  that touches the worktree.'
- Once TQ-500g-3-i and -3-ii exist, the same single before-commit CLI call also carries them. Do not add
  a second dispatch for them.
- 'Edit only templates/workflows-js/ sources. Deployed mirrors regenerate through build.py. Respect the
  E2 leaf invariant and ADR-006: no workflow() call inside the workflow.'
- Change build-feature.js (driveTicketPhases) and its declared twin build-ticket.js together, as the TWIN
  rule in the build-feature.js header requires. Place the call in the per-ticket loop right before the
  commit phase is dispatched, the mirror image of the TQ-500f-3-ii red-baseline block before the first
  coder.
- 'K4: the call runs whenever the commit phase is about to be dispatched, including on resume when every
  earlier phase is already signed_off. The resume recovery call sits at the head of the per-ticket driver.'
- 'K3 (no source_ac): call the runner with no ids, so the runner itself returns the not-applicable outcome.
  Record it on the ticket outcome (as red_baseline_gate is recorded) and continue.'
- 'JS growth: build-feature.js (2816 counted lines) and build-ticket.js (1525) are both over the 1000-line
  .js ratchet. Expected growth is about 35 to 50 lines each. This needs an offsetting shrink or a recorded
  ratchet decision by the user before commit.'
test_spec:
- name: test_build_feature_runs_runner_right_before_commit_dispatch
  target_dir: unit_tests/workflows/
  framework: pytest
  type: integration
  angle: reachability
  surface_invoked: templates/workflows-js/build-feature.js under unit_tests/_workflow_engine_harness.py
  description: Drives build-feature.js under the workflow-engine harness. For K1, the runner execution
    is recorded after the last pre-commit phase and before the commit agent, with the ticket's source_ac,
    worktree, AC root and base ref.
  must_catch:
  - runner placed after the commit phase
- name: test_k2_survivor_never_reaches_commit
  target_dir: unit_tests/workflows/
  framework: pytest
  type: integration
  angle: criterion
  description: 'K2: gate_passed false with a survivor. No commit dispatch, and a blocked result naming
    the test and the wrong version.'
  must_catch:
  - runner verdict ignored
  - a refused reply read as a pass
- name: test_k4_resumed_ticket_reruns_runner_before_commit
  target_dir: unit_tests/workflows/
  framework: pytest
  type: integration
  angle: failure
  description: 'K4: every phase before commit is already signed_off. The resumed drive calls recovery,
    then the runner, and only then commit.'
  must_catch:
  - resumed drive trusts earlier sign-offs and skips the runs
- name: test_k3_records_not_applicable_never_verified
  target_dir: unit_tests/workflows/
  framework: pytest
  type: integration
  angle: discrimination
  description: 'K3 (no source_ac): the outcome ''wrong-version runs not applicable: no source requirement''
    is recorded, commit is dispatched, and nothing says verified.'
  must_catch:
  - K3 recorded as verified
  - K3 halted
- name: test_build_ticket_twin_gates_commit_identically
  target_dir: unit_tests/workflows/
  framework: pytest
  type: integration
  angle: deployed
  description: build-ticket.js, driven with the same K1, K2 and K4 responses, gives the same dispatch
    decisions as build-feature.js. So the twin cannot drift.
  must_catch:
  - build-ticket.js twin not updated
test_rationale: 'Same method as TQ-500f-3-ii, the wiring precedent: drive both twins under the harness
  and assert on the recorded dispatches. K4 is the case a phase-map-based wiring would miss. Verdict identity
  across routes is the TQ-500g-1 seam test, which executes the recorded commands for real.'
