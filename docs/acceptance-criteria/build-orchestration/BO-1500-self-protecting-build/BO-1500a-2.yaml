id: BO-1500a-2
readiness: approved
priority: medium
title: "A build never deploys over the active worktree; deploy tests target a disposable directory"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1500-self-protecting-build/BO-1500a.yaml"
criteria: |
  Given a coding agent is working inside a feature or epic worktree
  When the agent implements a ticket in that worktree
  Then the agent does not run the build (build.py or build-self.sh) against the worktree
    root, because deploying into the worktree root deletes the tracked build-output
    directories and rewrites generated cards and the generated INDEX, corrupting the
    working diff

  And given a deploy-output behavior genuinely needs to be exercised
  When the agent runs the build to test that behavior
  Then the build targets a throwaway directory outside the worktree (a disposable
    target directory such as one under /tmp), and never the worktree root, so the
    working diff is left untouched

  And given the agent needs to change a file that exists in both the package source tree
    and the deployed tree (a dual-tree templated file, for example a commit-guardian hook)
  When the agent makes that change
  Then the agent edits the file in the package source (templates/) directly and confirms
    the two trees agree by comparing them, and does NOT run the build to "sync" the trees
    from inside the worktree
