criteria: |
  Given the server-side main-gating from ADR-018 is implemented,
  When a reader opens the build-orchestration architecture documentation,
  Then a sequence diagram shows the flow: agent opens a PR from its drive clone ->
    required checks run (ruff, full tests, schema-diff) -> merge queue serializes
    and builds against latest main -> queue performs the merge when green,
  And it shows the rejection paths: direct push, force-push, branch deletion, and
    admin/privileged bypass are all refused by the hub,
  And it shows that the agent's authority ends at "open PR" (no agent step performs
    the merge).
