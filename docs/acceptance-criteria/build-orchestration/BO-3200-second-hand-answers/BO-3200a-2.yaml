id: BO-3200a-2
title: "Every path that needs a project fact still works when no one can be asked to judge it, and one that does not is named"
component: build-orchestration
components:
  - build_orchestration
  - agent_registry
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given every path through which a build resolves a fact about the project that it then
    branches on,
  When each is exercised in an environment in which no party can be asked to judge anything --
    the only party that can be dispatched is one chartered to carry out an exact command and
    return its output verbatim, whose charter admits every exact command so it has no grounds to
    decline one, and which gives no answer to a request to look, decide, interpret or summarise;
    every dispatch to any other party fails immediately,
  Then every one of them obtains its value and proceeds.

  Given one such path restored to obtaining its fact by asking a specialist to read, decide or
    interpret it, while every other path obtains its fact with no judgement requested of anyone,
  When all paths are exercised in that same environment,
  Then the restored path is reported as depending on a relayed fact and is named,
    And the fact that every other path succeeds does not suppress the report.

  Given a path that obtains its fact through a dispatch to that chartered party carrying an exact
    command, and takes the value from the output returned,
  When the paths are exercised,
  Then that path is not reported as depending on a relayed fact.

  Given a path that first asks another party to read, decide or interpret the fact and, when that
    dispatch fails, obtains the value through an exact command to the chartered party,
  When the paths are exercised in that same environment,
  Then the path is reported as depending on a relayed fact and is named, although it obtains its
    value and proceeds.

  Given a path that dispatches a specialist for a judgement rather than for a fact — the value
    it returns being an opinion the build records rather than a value it branches on,
  When the paths are exercised,
  Then that path is not reported, so asking a specialist for judgement remains available.
