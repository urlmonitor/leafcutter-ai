criteria: |
  Given a registry of 45 component entries, of which 9 declare a field a rule
    requires and 36 do not,
  And a validator that examines only the entries appearing in the change being
    committed, enforces the rule on those, and accepts the remaining 36 on the
    stated ground that they pre-date the rule,
  When the validator reports its result,
  Then the 36 entries are reported as an exclusion carrying no legitimate ground,
    and therefore as an unexplained shortfall under ACS-1100c-1, rather than as a
    legitimate exclusion,
  And "the record pre-dates the rule", "legacy state is accepted", and every other
    ground whose whole content is the record's age or its position relative to the
    rule's introduction are absent from the published list of legitimate grounds,
    so a run naming one of them reconciles no better than a run naming nothing,
  And the one honest route open to that validator is the ground already published
    for a scoped caller: it declares its scope and reports the scope total and the
    registry total together, reading "1 of 1 in scope, scope = entries appearing in
    the change; registry = 45, 44 excluded as outside the requested scope",
  And a run that reports only that the entry it examined complies, naming no
    registry total and no count of the entries it did not examine, does not satisfy
    this criterion whatever exit status it returns,
  And an exclusion under "outside the requested scope" states which records this
    run looked at and never states that the excluded records comply, so the same 36
    are still counted as unexamined on every later run until a run examines them,
  And the bug symptom this criterion forbids is a rule described as holding for
    every entry in a registry while 36 of the 45 entries break it and every run of
    the validator that governs it reports success.

  Coverage note: exercise this against a fixture registry in which the entry
  present in the change complies and 36 unchanged entries do not, and assert on the
  reported figures — the registry total, the covered count, and the count carried as
  unexamined. A test that asserts only the exit status cannot tell an honest scoped
  verdict from a silent one, because both may legitimately exit 0.
