assigned_agent: python-coder
estimated_complexity: M
declares_side_effect: false
it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/workflows-js/build-feature.js
  n_location_rule: "2 -- the post-dispatch verdict derivation in build-feature.js and its twin in build-ticket.js, which must stay identical"
  required_skills:
    - python-coder
  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_phase_signoff_verification.py"
  constraints:
    - "READ-ONLY OVER THE RECORD -- THIS IS THE LOAD-BEARING CONSTRAINT. The driver adjudicates; it never edits the record to make the adjudication come out tidy. Deleting or rewriting a heading another agent wrote means the driver is editing another agent's audit history to cover a write-side defect, and it is also outside the drive's mutation surface: the record is append-only, and status rewriting and whole-record deletion are the only other channels. Any implementation that removes, merges or renumbers an existing entry fails this AC even if every verdict it produces is correct."
    - "LATEST WINS IN BOTH DIRECTIONS, AND BOTH DIRECTIONS ARE TESTED. Keeping the FIRST entry silently reports a stale failure over a retry's success; keeping the most FAVOURABLE entry silently reports a stale pass over a later failure. Only recency decides. Test the fail-then-pass and the pass-then-fail orders separately -- an implementation that keys on outcome rather than order passes one of them."
    - "RECENCY MUST BE DERIVED FROM THE RECORD'S OWN ORDERING, NOT FROM A CLOCK COMPARISON ALONE. Two entries for one gate can carry the same timestamp to the minute; the append order is the tiebreak. An adjudication that compares timestamps only is non-deterministic on same-minute retries, which is the common case for a fast retry."
    - "SURFACE THE DUPLICATE, DO NOT SWALLOW IT. The count of duplicated entries is reported on the run's own output alongside the verdict (the implementation reports it as duplicate_signoff_entries). A duplicate that only affects which entry was read, and is never named, leaves the write-side defect invisible for as long as the adjudication keeps compensating for it."
    - "SINGLE-ENTRY CONTROL CASE. A gate with one entry must adjudicate from it and must NOT appear in the duplicate report. Without this the AC is satisfiable by an implementation that reports every gate as duplicated."
    - "BOTH TWINS IN ONE CHANGE. A latest-entry rule landed in only one driver produces two drivers that disagree about the verdict for the same record."
delivers_to:
