notes: |
  Gap G7. Evidence: test-logs/wire-700a5-tmp reached 3.4 GB (scratch inside a durable log
  folder) and qf-*-tmp directories were left behind in the project. "Owner" is the run's
  identity; "ended" is decided by the same in-use signal BO-1800d / BO-4400d-1 use. The rule is
  defined here once; the sweep and the route end only consume it.
  The default 24-hour age limit is a BA proposal for the IT PO / user to confirm.
