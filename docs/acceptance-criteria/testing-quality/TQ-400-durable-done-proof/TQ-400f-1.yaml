assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - >-
    POPULATION WIDENING — STATE IT, DO NOT SLIDE IT IN. The sweep's evaluated
    population today is done LEAF L2/L3 records (TQ-400a-1's criterion; TQ-400a-4's
    contract says "one entry per done L2/L3 record"). This AC requires a verdict for
    done records at EVERY level, composites included. Widen the population inside
    check_all_done_acs and report the widened figure as its own count, and restate
    TQ-400a-4's "entries == records_evaluated + records_errored" invariant over the
    wider population in the same change. Widening the walk without restating those
    two assertions makes both of them wrong while both still pass.
  - >-
    ONE TRAVERSAL, CONSUMED FROM AN EXISTING DEFINITION. TKT-500d-2-i already defines
    composite doneness as full-tree traversal to every leaf, with intermediate levels
    that have undone leaves not counting. Consume that definition; do not re-specify
    it. Exactly one descendant-resolution function may exist — TQ-400f-5's
    ready-to-close population and TQ-400f-4's abstention branch must both call it.
  - >-
    THE DESCENDANT RELATION IS THE UNION OF THE TWO LINKS IN THE STORE: the record's
    declared covered_by children AND the id-shape-derived children
    (scripts/ac_store/ac_parent_id.py). covered_by alone is insufficient and unsafe —
    a stale covered_by is a documented live defect (CLAUDE.md, "AC-store commits —
    stage the parent alongside the child": ACD-400a's covered_by was stale by two
    children for five days), and a parent that omits an unfinished child from
    covered_by is precisely the record this AC exists to catch.
  - >-
    NAME THE RESIDUAL BLIND SPOT RATHER THAN HIDING IT. derive_parent_id yields no
    parent for root-shaped and bare PREFIX-NNN ids, so for those records covered_by
    is the only link and a stale list makes a child invisible. Count the records
    whose parent could not be derived by shape and state that figure in the run's
    output. Do NOT abstain on it — the population is large, and an unstated coverage
    hole in the sweep is the same invisibility the parent L0 exists to remove.
  - >-
    DUPLICATE IDS ARE LIVE ON MAIN AND THE REQUIRED STORE GATE DOES NOT DETECT THEM
    (KI-ACD-008 with KI-ACS-001). An id-to-record map built for this traversal must
    not let the last file walked win: an id resolving to more than one record is
    reported as an error for the affected records and routed to TQ-400f-4's
    abstention, never silently collapsed.
  - >-
    STORE-SCOPED, NOT INDEX-SCOPED. Every verdict must come from the whole-store walk.
    No git diff, no --diff-filter, no staged-file set anywhere on this path.
    KI-CG-001 (AC hooks are index-scoped, so parent drift is unreachable) and
    KI-CG-20260826-1612 (the six guardians filter --diff-filter=AM, so even a staged
    parent is invisible when renamed) are the recorded reasons an index-scoped
    implementation would satisfy every other clause and change nothing.
  - >-
    Must not alter the behaviour or scope of --mode precommit or --mode ci-changed.
    The final criterion clause compares the two populations over one store, so the
    change-scoped mode must remain genuinely change-scoped to be a valid control.
  - >-
    THE NEW OUTCOME BELONGS IN THE ORACLE'S CLOSED VOCABULARY in
    scripts/ac_store/done_proof.py, not computed by a second reader inside the
    walker. Two readers of the same evidence drift (TQ-400a-3; the
    EPIC-ComputedQualityGates layer-3 disjoint-vocabulary defect).
  - >-
    EDIT THE PACKAGE SOURCE: templates/scripts/commit_guardian/check_done_proof.py.
    scripts/commit_guardian/check_done_proof.py is a build output of
    build_phases.build_commit_guardian and DOES NOT EXIST in a fresh worktree; it is
    regenerated by build.py in the same change. Do not treat the deployed path as
    source and do not hard-code it in a test.
  - >-
    Traversal cost must stay linear in the store: build the child index ONCE per run
    over the measured baseline of 3,146 records, never by rescanning the store per
    parent (KI-ACD-017 records that shape as a live defect elsewhere in this
    pipeline). Report the traversal's own runtime alongside the sweep's.
  - >-
    Must handle errors gracefully per the project error handling policy: a record
    whose descendant set cannot be resolved must not silently leave the evaluated
    population — it is routed to the abstention outcome owned by TQ-400f-4.
delivers_to:
  - agent: python-coder
    ac_id: TQ-400f-2
    contract: >-
      Per-parent verdict entries whose outcome is has-unfinished-descendants, each
      carrying {ac_id, path (repo-relative), outcome, unfinished_descendants:
      [ac_id, ...] covering every depth in a deterministic order}. The demotion
      writer consumes this list verbatim and re-runs no traversal of its own.
  - agent: python-coder
    ac_id: TQ-400f-5
    contract: >-
      The same traversal's inverse population — records every one of whose
      descendants at every depth is finished — as the ready-to-close input, so the
      two halves cannot disagree about who is complete underneath.
  - agent: python-coder
    ac_id: TQ-400a-4
    contract: >-
      The widened evaluated population (done records at every level, not only done
      leaves) plus the new has-unfinished-descendants member of the verdict
      vocabulary, for serialization into the inventory. The inventory's count
      invariant must be restated over the wider population in the same change.
expects_from:
  - ac_id: TQ-400a-1
    contract: >-
      The whole-store walk and its per-record verdict list of {ac_id, path, ok,
      reason} plus records_evaluated. This AC widens that population to composites
      and adds a second, independent verdict per record; it must not fork the walk
      or introduce a second walker.
  - ac_id: TQ-400a-4
    contract: >-
      The durable inventory as the carrier for the parent verdict. The
      has-unfinished-descendants outcome and its named descendants must be persisted
      there, not only printed, so TQ-400f-2 reads a work list rather than log text.
  - ac_id: TKT-500d-2-i
    contract: >-
      The read-side DEFINITION of composite doneness — full-tree traversal to every
      leaf, intermediate levels with undone leaves not counting. Consumed, not
      restated. If TKT-500d-2-i is implemented independently, the two must share one
      traversal function rather than each owning one.
