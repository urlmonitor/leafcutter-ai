criteria: |
  Given a requirement whose earlier derivation created two of its three deliverable
    items,
  When work is derived from the requirement again,
  Then only the missing third deliverable item is created,
  And the two pre-existing items are left unchanged, including any sign-offs already
    recorded on them,
  And no duplicate of the two existing items appears.
