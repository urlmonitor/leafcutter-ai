title: "Build-output shims under scripts/ are never committed to the repository"
origin_agent: BrainCandy
created: 2026-08-14
criteria: |
  Given install_shims() creates scripts/commit_guardian, scripts/doc_compliance,
    scripts/feedback and .claude/workflows as shims into the consolidated output
    root (ADR-016), exactly as it does for .claude/agents and .gemini,
    and .env is a per-developer environment file,
  When the repository is inspected for tracked files,
  Then no tracked entry anywhere in the repository is a symlink whose target is
    an absolute filesystem path,
  And none of scripts/commit_guardian, scripts/doc_compliance, scripts/feedback,
    .claude/workflows or .env is present in the git index,
  And .gitignore matches each of those paths as git actually stores them — a
    symlink, which is not a directory — so `git check-ignore` reports them
    ignored and a rebuild cannot silently re-add them,
  And the bug symptom ("a clone receives symlinks pointing at
    /home/<user>/... paths that exist only on one developer's machine") must
    not occur.
