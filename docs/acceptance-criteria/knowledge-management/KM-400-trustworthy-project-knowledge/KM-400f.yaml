readiness: approved
priority: high
work_status: done
criteria: |
  Keep only what you said to keep, and be told before there is no room left.

  Project knowledge retains the versions the project declared it should retain, lets go of the superseded ones as part of normal use, and refuses an update it cannot fit instead of filling up and locking itself. How much room is left, what is being kept and why it is being kept are all visible while there is still time to act.
