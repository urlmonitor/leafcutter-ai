notes: |
  ADDED 2026-10-14 as the code-surface sibling named in TQ-600a-13-xviii's FOLLOW-UP
  ("workflows-js/finalize-feature.js and fast-lane-ship.js are deterministic code that
  classifies check failures; they need a sibling code record, agent chosen by file type").

  WHAT THE EVIDENCE CHANGED. The follow-up assumed both scripts classify check failures.
  Read on this branch, neither reads PR checks at all. fast-lane-ship.js stops at opening
  the PR and is therefore out of scope (it_requirements, SCOPE (b)). finalize-feature.js
  does not misread the hold as a regression — its regression halt comes from local test
  runs — but it misreads it the other way: Step 4 records "merged to main" and returns ok
  for a PR the hold kept open. The criteria are written for that real defect, so the
  hold is reported as external instead of as done.

  "TREATS EVERY OTHER FAILING CHECK EXACTLY AS BEFORE" — HOW IT WAS HONOURED. The script
  has no prior handling of PR checks, so "as before" is kept literally for every state in
  which the hold is not failing (Step 4 unchanged). Only in state B, where the hold also
  fails, does a non-hold check get a new treatment (named as the branch's own failure),
  because the merge cannot proceed there and the outcome must distinguish the two. The
  separate false-"merged" defect on the hold-absent path is recorded in it_requirements
  as a finding for its own FIN-family record, not fixed here.

  readiness is draft: the owner approves. Line numbers in it_requirements are from
  origin/main as of 2026-10-14 and are approximate; re-confirm before editing.
