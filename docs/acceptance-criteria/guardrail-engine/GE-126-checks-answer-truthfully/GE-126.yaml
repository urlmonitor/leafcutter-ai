readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Verify a check yourself and its answer means something.

  The checks that protect your work can be interrogated directly — you hand one
  your file, or you run it where its source lives, or you follow the written
  procedure for adding a new one. Today each of those routes can return a clean,
  confident answer from a check that inspected nothing, and that answer is
  indistinguishable from a real one. Three checks are known to behave this way
  because three happened to be looked at; how many of the roughly seventy others
  do is not something anyone can currently find out. After this goal, a check
  handed your work inspects it or refuses, a copy of a check that can never
  enforce anything says so instead of passing, adding a new check tells you when
  its registration is incomplete, and the whole family can be asked which of its
  members are still able to pass without looking at anything.
