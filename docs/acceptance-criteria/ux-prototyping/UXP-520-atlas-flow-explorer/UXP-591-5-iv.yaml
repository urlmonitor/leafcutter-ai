id: UXP-591-5-iv
title: "A filter change that keeps the entry flow leaves the screen and the address unchanged"
component: ux-prototyping
components:
  - ux_prototyping
  - frontend_coding
level: L3
status: active
req_status: active
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given the person drilled from /flows/leafcutter/deliver-a-feature into
    "How a ticket is built (the phase chain)" and opened the 'Coders make it green (prio 6-8)'
    drawer, so the address is /flows/leafcutter/how-acs-are-built?step=code with filters
    Real, User, All,
  When they set the Realization filter to 'Built',
  Then "Deliver a feature end-to-end" stays the entry flow and
    "How a ticket is built (the phase chain)" stays drawn with the breadcrumb
    "Deliver a feature end-to-end > How a ticket is built (the phase chain)" and its drawer open,
  And the address bar stays /flows/leafcutter/how-acs-are-built?step=code,
  And no history entry is added.
