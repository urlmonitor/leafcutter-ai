notes: |
  THE CASE THE L1 CALLS EASY TO MISS, AND IT IS THE ONLY FAILURE IN THIS TREE THAT DESTROYS
  SOMEONE ELSE'S WORK. Every other wrong outcome here produces a bad document or no
  document. Overwriting produces a good document and silently deletes the one that was
  there, and nothing downstream will ever report it.

  THE SECOND CONDITION IS THE ONE AN IMPLEMENTER WILL NOT THINK OF. Checking whether the
  destination file exists is obvious. The collection's rule is stricter and is stated in its
  own README: two documents collide on the tier-and-number pair whatever they are called. So
  a destination that is free as a path can still be a place that is taken, and a producer
  that writes there creates a collision the collection's own convention forbids — which is
  not caught by the naming check, because that check validates the shape of a name and has
  no view of the collection.

  A MEASURED CAUTION ABOUT THE FREE NUMBER. The project's existing sequence allocator once
  scanned only the top of the architecture tree, so it missed every document in the diagrams
  sub-folder and confidently reported numbers that were already in use — a fix recorded in
  its own history. Reporting a free number is therefore a claim about the WHOLE collection,
  and the clause is written that way rather than assuming any one folder is the collection.
  Reporting a number that turns out to be taken is worse than reporting none, because the
  author will use it.

  FALSIFIABILITY. Two scratch collections. In the first, place a document at the destination
  and record its contents; request production there; the record is falsified if the
  destination's contents change at all, if anything is written anywhere, or if the refusal
  does not name the destination. In the second, place a document at the same tier and number
  under a different name, leave the requested path free, and request production; falsified
  if a document is produced, and falsified if the refusal does not name the document already
  holding that pair. Then take the number the refusal reports as free and check it against
  every document in the collection including every sub-folder — falsified if any document
  already uses it. In both collections, snapshot the whole tree before and after and require
  the difference to be empty; a refusal that leaves a zero-length file at the destination has
  overwritten the document that was there, and an observation that only reads the refusal
  message cannot see it.

