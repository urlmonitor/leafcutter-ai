  - "THE DIAGRAM MUST NOT LAND UNDER [NO-ARCH-UPDATE]. Every hook named above —
     check_diagram_naming, check_mermaid_parent_link, check_doc_frontmatter,
     check_structural_change — honours that commit-message token as a blanket bypass, so a
     single token disables the entire mechanical half of this criterion at once. A diagram
     landed under it has been checked by nothing."
  - "NO MECHANICAL DRIFT DETECTION EXISTS FOR THIS DIAGRAM GENRE, AND THIS RECORD DOES NOT
