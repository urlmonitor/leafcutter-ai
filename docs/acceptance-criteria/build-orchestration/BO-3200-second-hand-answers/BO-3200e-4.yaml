test_rationale: |
  A definitions page is exactly the artifact most likely to be covered by a grep, and a grep on
  prose is what the goal's hard constraint rejects. So each rule is bound to an exercised check
  via BO-3100d-1's pairing mechanism and driven against a real check — the page's claims are
  confirmed by behaviour, not by their own presence.
  The both-directions claim gets its own test because it is the one statement whose absence
  caused real cost: a reader who found GE-120a-1 reasonably concluded the question was settled,
  and the mirror direction went unimplemented until KI-BO-018 surfaced it.
  Deliberately NOT covered: whether the definitions are well phrased. Human judgement.
