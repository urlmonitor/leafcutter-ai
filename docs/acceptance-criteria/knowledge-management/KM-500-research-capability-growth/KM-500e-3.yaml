id: KM-500e-3
title: Count the declared population only when enumeration is complete
component: knowledge-management
components:
- knowledge_management
level: L2
status: active
req_status: active
work_status: in_progress
readiness: approved
priority: medium
parent: KM-500e
criteria: 'Given the reviewed TQ-500f example has fifteen distinct L2 and L3 descendants excluding only its root,
  comprising five done and ten todo records

  When an agent requests that explicit population grouped by implementation work status at the example''s pinned
  revision

  Then the answer reports fifteen records, five done and ten todo with the selected root, included levels, relation,
  revision and declared counting method

  And records that themselves have children remain included under that root-only exclusion, while the distinct terminal-leaf
  request identifies its own eleven-record population

  And repeated paths to the same canonical AC do not increase the population

  And any unknown work status remains visible as unknown rather than being dropped, interpreted as todo or substituted
  from lifecycle status

  When enumeration ends with an unresolved child, omitted result or exhausted continuation before completeness is
  established

  Then the answer reports the known distinct records and states that the exact total and any complete status breakdown
  remain unresolved

  And a family count is never presented as a repository-wide count or as proof that the listed work passed tests.

  '
