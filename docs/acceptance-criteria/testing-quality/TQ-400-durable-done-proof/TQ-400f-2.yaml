test_spec:
  - name: test_tq_400f_2_demoted_parent_names_each_unfinished_descendant_on_disk
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      After a real subprocess apply run, DISCARD the run's stdout and its return
      value, then re-read the parent file off disk in a fresh process: work_status is
      todo, and demotion_reason contains the identifier of EACH of the two unfinished
      descendants — one of them a grandchild. Reading the record alone, with the run's
      output gone, is the whole guarantee, so the assertion must be made with the
      output gone.
  - name: test_tq_400f_2_no_descendant_file_is_written_by_the_parents_demotion
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      sha256 EVERY descendant file of the target parent, at every depth, before and
      after the same apply run; all identical. Paired in the same assertion with the
      positive control that the parent's own hash DID change, so a run that wrote
      nothing cannot satisfy it. A tree-wide fix-up passes a work_status assertion on
      the parent and fails here.
  - name: test_tq_400f_2_only_the_state_and_demotion_lines_differ_byte_for_byte
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: >-
      Byte-diff the parent file before and after the run over a store written by the
      project's real serializer: exactly the work_status, demotion_reason and
      demotion_date lines differ. Field order, quoting, block-list indentation at
      column 0, comments and the trailing newline are unchanged. A whole-file
      yaml.safe_dump round trip preserves every value and fails this entry.
  - name: test_tq_400f_2_demotion_happens_only_through_the_real_apply_invocation
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "templates/scripts/commit_guardian/check_done_proof.py --mode ci --apply"
    description: >-
      The demotion is produced by subprocessing the production command with its apply
      flag — never by importing and calling a demote helper. Over the same store
      WITHOUT the flag, every file is byte-identical, so preview is proven to be the
      safe default rather than assumed to be.
  - name: test_tq_400f_2_record_reason_equals_report_reason_and_the_record_still_validates
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: >-
      For the same ac_id, demotion_reason on disk and the cause in the run report and
      inventory are the identical string — one formatting site, not two that can
      drift. Then run scripts/ac_store/validate_ac_schema.py as a subprocess over the
      written parent (must pass) and over the whole untouched store (must still pass),
      because a demoted composite that fails the store validator blocks every commit
      in the repository.
test_rationale: >-
  A descriptor that asserts "the run reported the parent and named its children" is
  satisfied by an implementation that reports perfectly and writes nothing — the
  BO-2300 phantom-build shape, dispatch happened and the on-disk effect did not — so
  every assertion here is made against the file's bytes after a real apply
  invocation, with the run's output explicitly discarded first. A descriptor that
  only asserts work_status == todo on the parent is satisfied by a tree-wide rewrite
  that also demoted every descendant on no verdict at all, which is both wrong and
  unrecoverable; hence a whole-descendant-set hash comparison, paired with the
  parent's own hash change so a no-op run cannot pass it. And a value-level
  comparison would be satisfied by a whole-file YAML round trip, which preserves every
  value while rewriting all 3,146 files, so the field-preservation assertion is a
  byte diff rather than a dict comparison. The validator subprocess is present
  because this is the first cause under which a COMPOSITE record carries
  demotion_reason, and an additionalProperties:false schema turns a mistake there
  into a repository-wide commit block rather than a bad row in a report.
change_target: code
risk_surface: contract_boundary
notes: |
  CONFLICT TO RESOLVE BEFORE BUILDING — RAISED DELIBERATELY, NOT PAPERED OVER.
  TQ-400b-1 carries a technical requirement that the demotion writer "must not
  demote L0/L1 composite records: the population is leaf L2/L3 records, and
  composites never legitimately reach work_status done". This AC demotes exactly
  that population, and the measured evidence contradicts the premise: twenty
  parents ARE sitting finished today, sixteen of them at L2, and BO-2500a-6 —
  already built and marked done — explicitly blesses a finished composite whose
  proof derives from its children. Two positions cannot both stand. The resolution
  this AC assumes is that TQ-400b-1's exclusion is about the LAPSED-PROOF cause
  only (a composite has no direct test of its own to lapse, so evaluating it on
  that axis is meaningless) and does not bar demotion on the UNFINISHED-CHILDREN
  cause. If the IT PO or the product owner disagrees, this AC is blocked rather
  than quietly overriding a sibling's stated requirement.

  Only the reason clause is new. The write discipline, the atomicity, the
  never-rewritten date and the re-run idempotency all come from TQ-400b-1,
  TQ-400b-2 and TQ-400b-4 unchanged, which is why this AC depends on them rather
  than restating them. What it does add is that the reason must be specific enough
  to act on: "has unfinished children" without naming them sends the reader back
  to re-derive the tree, and the whole point of the recorded reason is that the
  record explains itself once the run is gone.

  The no-descendant-is-written-to clause exists because the tempting shortcut is a
  tree-wide rewrite that "fixes up" the whole branch. That would demote children
  nobody judged, on no verdict, and it is unrecoverable.
