criteria: |
  Given a fast-lane run whose workspace was dirtied at bootstrap with four regenerated agent
    cards and docs/INDEX.md,
  And whose coder reported changing scripts/x.py and unit_tests/test_x.py,
  And whose changelog phase wrote changelogs/2026-10-12-1200-x.md,
  And which claimed the acceptance-criterion records BO-9999a-1 and BO-9999a-1-i,
  When the lane reaches its commit phase,
  Then it calls the shared commit step naming exactly those two code files, the changelog
    entry and the two claimed records,
  And the resulting commit contains those five files plus any structural parent record the
    run edited, and none of the four agent cards and not docs/INDEX.md,
  And the lane reads the step's answer, continues to its pull-request phase only on committed,
    and halts reporting the answer's status and reason on any other status.

  Given the fast lane's commit recipe before this change and the shared step after it,
  When the migration is reviewed,
  Then every behaviour the fast lane's copy had been fixed for and the shared step lacked has
    been carried into the shared step before the lane is moved,
  And the KI-BO-029 regression test -- a bootstrap-dirtied workspace whose commit must not
    carry the bootstrap churn -- runs against the shared step and passes.
