id: BP-100k-3-iv
components:
  - build_pipeline
title: "A recorded output whose content drifted, and which carries a grounded exemption entry, is reported as a drift exemption naming its ground and does not block"
component: build-pipeline
level: L3
status: active
req_status: draft
readiness: reviewed
priority: high
roadmap_phase: phase_1
work_status: done
criteria: |
  Given a build manifest recording three deployed outputs, of which one still
    matches its recorded fingerprint and two have been hand-edited since the
    build so their content no longer matches,
  And given the exemption registry is empty,
  When check-output-drift runs over that workspace,
  Then both edited outputs are reported as drifted, the run summary states
    drifted=2 and exempt=0, no output is reported as a drift exemption, and
    the run blocks the commit,
  And given instead the registry holds one entry naming the first edited
    output with the non-blank ground "Hand-maintained consumer file; no build
    phase writes deterministic content to it.",
  When check-output-drift runs over the same workspace,
  Then the first edited output is reported on its own line as a drift
    exemption that names the output and echoes that ground verbatim,
  And that line is distinguishable from the existing verdict for an
    exempted artifact the build never recorded, so a reader can tell "recorded,
    compared and differs, excused" from "never recorded, excused",
  And the run summary states exempt=1, drifted=1 and gaps=0,
  And given instead the registry holds a grounded entry for each of the two
    edited outputs,
  When check-output-drift runs over the same workspace,
  Then the run summary states verified=3, exempt=2, drifted=0, missing=0 and
    the run does not block the commit,
  And every verdict is taken from running the deployed gate as a separate
    process and reading its emitted per-artifact lines, RESULT line and exit
    status.
depends_on:
  - BP-100k-3
