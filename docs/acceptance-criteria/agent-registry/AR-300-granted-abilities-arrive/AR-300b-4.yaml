notes: |
  THE GUARANTEE IS THE SAME CLASS OF ARTIFACT AS THE DEFECT. AR-300b exists
  because correct-looking machinery reached nobody while the build reported
  success. Its remedy is more machinery, gated on a set it derives at run time.
  A derivation that comes back empty produces silence, and silence from this
  guarantee reads as delivery. This repository has shipped exactly that failure
  twice -- a validator whose directory argument matched nothing and exited clean
  for eight days (KI-ACS-001), and a strictness setting that had no effect for
  as long as the file existed.

  THIS IS DELIBERATELY A SIBLING OF AR-300a-1-i, NOT A DUPLICATE OF IT.
  AR-300a-1-i guards the population of the abilities comparison; this guards the
  population of the delivery guarantee, which is derived differently and can be
  empty for different reasons. The two go vacuous independently.
