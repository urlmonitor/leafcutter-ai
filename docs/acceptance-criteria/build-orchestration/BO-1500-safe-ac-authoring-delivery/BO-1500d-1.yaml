criteria: |
  Given the authoring workflow has just opened the delivery pull request to main,
  When the workflow returns control to the user,
  Then it prints the pull request's number and its clickable URL in the final
    output the user sees,
  And the URL points to the pull request that carries the approved AC files,
  And the user does not have to run a separate command or search the repository
    to find the pull request.
