    framework: pytest
    type: integration
    angle: criterion
    description: "Stub reports 0.15.14; docs-only staged change: commit completes; output contains RESULT: nothing_to_inspect, no version-mismatch text and no 'inspected <N>' with N > 0."
  - name: test_bp_1300e_1_v_adopter_pin_governs_not_the_packages
