notes: |
  ID SHAPE. This record is an L3 technical constraint on GE-118d. It is numbered
  GE-118d-1 rather than GE-118d-i because the store's id grammar requires a
  numeric segment between the alpha segment and any roman one — GE-118d-i is
  rejected by config/ac_store_schema.json. GE-118d itself carries an L1-shaped id
  while declaring level L2, following its siblings GE-118b and GE-118c; level and
  id shape are decoupled throughout this folder and no gate enforces the pairing.
  derive_parent_id("GE-118d-1") resolves to GE-118d, so the back-link is
  mechanically policed, which is the property that matters.

  WHY THIS IS AN L3 ON GE-118d AND NOT A CLAUSE INSIDE IT. GE-118d is about
  resolving the two shapes the project accepts. This is about every shape it does
  not — an open set that no accept-list can enumerate, and the arm an implementer
  is most likely to leave as "whatever Python does". Merged, an implementation
  that handles the two accepted shapes and lets anything else fall through to the
  operator satisfies the merged record.

  THE FAIL-OPEN CONVENTION IS NOT REPEALED HERE, AND THIS IS NOT AN EXCEPTION TO
  IT. This component deliberately fails open on an INTERNAL error — a crash, a
  parse failure, a git failure — with a stderr warning, so a script bug never
  blocks an unrelated commit (guardrail-engine PROJECT_CONTEXT; approved as
  GE-116a-1-iii). A frontmatter element in an unaccepted shape is not an internal
  error. It is a finding about the file under inspection, which is the guard's
  subject, so it is reported as a validation error and it refuses. The line
  GE-120 drew applies unchanged: failing open on one bad input while the check
  still ran is fine; this criterion is the stronger statement that the check must
  still RUN, and reach a verdict, rather than terminate mid-pass.

  "NO TRACEBACK ON ANY STREAM" IS LOAD-BEARING AND IS NOT SATISFIED BY A
  try/except THAT SWALLOWS. The observable is a named error plus a refusing
  verdict. An implementation that wraps the loop and continues silently turns a
  loud defect into the silent one KM-KGS-100d-3-i describes on the other side of
  the same field — trading a crash for an invisible gap is not a fix.

  THE REMAINING-WORK CLAUSE IS THE ONE A WEAK TEST MISSES. Asserting only that
  the bad entry is named passes on an implementation that stops at the first
  refusal. The related_code entry in the same document is the control that proves
  the pass completed.
