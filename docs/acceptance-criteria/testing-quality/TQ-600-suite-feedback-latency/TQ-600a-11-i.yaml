notes: |
  Why this is a separate record rather than a clause of TQ-600a-11: the parent is
  measured in this environment, where the C extension is present and the fallback is
  dead code. A record that bundles "it is faster here" with "it still works there"
  is satisfiable by proving only the first, and the second is the one that decides
  whether the package remains installable for adopters.
