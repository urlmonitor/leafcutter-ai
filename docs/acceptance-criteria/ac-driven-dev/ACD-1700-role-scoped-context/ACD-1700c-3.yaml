  Given the effective prompt includes both reproducible and non-reproducible harness channels,
  When the tool renders the brief,
  Then any non-reproducible channel is explicitly labelled as non-reproducible,
  And it is visually distinct from the reproducible channels rather than silently interleaved,
  And a reader can tell which parts of the brief will vary run to run.
