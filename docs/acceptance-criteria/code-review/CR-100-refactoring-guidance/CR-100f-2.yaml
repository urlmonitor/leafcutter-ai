id: CR-100f-2
title: "Tiered leaf reviewers: structural on Sonnet, design on Opus"
component: code-review
components:
  - review_system
level: L2
status: active
req_status: active
work_status: done
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given the two leaf reviewer agents find-structural-smells and find-design-smells,
  When each agent's configuration is inspected,
  Then find-structural-smells runs on the Sonnet model (the fast pass for the
    local, mechanical smells),
  And find-design-smells runs on the Opus model (the deeper pass for the
    judgment-heavy design smells),
  And each agent is configured to invoke exactly two skills: the shared core
    review method and its own bucket catalogue (structural for the structural
    agent, design for the design agent).
depends_on:
  - CR-100f
