    description: "A missing file, a non-JSON file, a JSON array, a file missing keys and a file with a mismatch are each refused naming the run id and what was missing or did not match; an inspection whose own statement and blobs are internally complete never stands in for the file. Nothing raises."
    proves_clause: "when the approval file is missing, cannot be read, or any of the checks above does not match, marking done is refused, naming the run id and what was missing or did not match, and the inspection's own text is never accepted in place of the approval file"
