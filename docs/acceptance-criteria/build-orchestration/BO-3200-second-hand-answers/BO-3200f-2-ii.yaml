  - agent_registry
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Given the test suite run the way it runs by default, and the way continuous integration runs
    it, with the live-dispatch switch not set,
  When the run reaches the three live scenarios -- BO-3200f-2's first scenario and both
    scenarios of BO-3200f-2-i --
  Then no agent is dispatched on behalf of any of them,
    And each is reported as not run because the live-dispatch switch is off, naming the switch,
    And none of them is reported as passed.

  Given the live-dispatch switch set explicitly for one run, locally or in continuous integration,
  When the three live scenarios run,
  Then each dispatches the executor as the repository registers it -- under the charter and the
    registry entry the package ships, not a stand-in, a scripted reply or a copy prepared for the
    test --
    And each scenario passes or fails on the reply that its own dispatch returned.

  Given the executor's charter as the repository holds it, changed so that it declines every
    command,
    And the live-dispatch switch set,
  When the three live scenarios run,
  Then BO-3200f-2's first live scenario fails, and its failure names the decline.

  Given a switched-on run in which the three live scenarios ran,
  When the run ends,
  Then an evidence record is written for that run naming, for each live scenario: the scenario,
    the acceptance criterion it proves, whether it passed or failed, the agent dispatched, the
    model that answered, when it ran, the exact charter and registry entry content it ran under,
    and the reply received,
    And a done-proof that cites that record can tell a scenario that passed from one that failed
    or was not run.

  Given the live-dispatch switch set, and a live dispatch that cannot be made -- because no
    credentials for the model service are available, because the executor is not registered,
    because the dispatch fails in transit, or because a permission request is raised that no one
    is present to answer --
  When the three live scenarios run,
  Then each scenario that could not dispatch is reported as failed, naming which of those four
    stopped it,
    And none of them is reported as skipped, not run or passed,
    And the run as a whole is reported as failed.
