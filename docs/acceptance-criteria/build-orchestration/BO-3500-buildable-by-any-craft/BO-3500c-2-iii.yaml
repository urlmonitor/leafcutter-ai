notes: |
  THE KIND THE PRODUCT OWNER NAMED FIRST as obviously beyond the written-page floor,
  and the reason is worth stating plainly: a screen's whole content is behaviour under
  interaction. Everything a proof could check without running it — that the file
  exists, that it changed, that it mentions the right words — is satisfied by a screen
  that renders as a blank rectangle.

  THIS IS THE SAME RULE THIS REPOSITORY ALREADY IMPOSES ON ITSELF for gates and
  workflows: a criterion about behaviour must be proved by executing the behaviour, and
  a check that inspects source text passes on dead code. The rule has been paid for
  here more than once. A screen is the purest instance of it.

  COST — THE ORIGINAL NOTE HERE WAS WRONG, AND THE CORRECTION MATTERS (amended
  2026-08-31, finding F1). It said this proof needs a running surface which the lean run
  does not have, and treated the screen as the most expensive of the five. Verified, it
  is not: the front-end workspace already has a component test runner, a browser-like
  document environment configured as its default, a component render-and-drive library
  and its matchers all installed; real component tests that render and interact already
  exist; and the store's done-proof machinery already scans front-end sources for
  coverage tags and can run that suite and read its result. Rendering a component,
  driving the described interaction and observing the described result is affordable
  TODAY. Nothing needs provisioning.

  WHAT IS GENUINELY NOT AFFORDABLE is a proof that needs a live service on a network
  address. The project's own default configuration disables live-surface testing, and
  deliberately: a portable package installed into arbitrary repositories must not require
  its consumers to start servers. That is the boundary the second scenario draws, and it
  is drawn as a REFUSAL rather than as a downgrade — a cheaper proof for a screen does
  not prove less, it proves nothing.

  THE INVERSION IS WORTH RECORDING because it redirects the effort. This record assumed
  the screen was the hard kind. It is the prompt that is expensive (BO-3500c-2-iv), and
  it is also the largest by count by a factor of five. An implementer who sequences by
  the original note would start with the cheap one believing it to be the hard one.

  80 not-yet-done requirements declare the screen craft.
