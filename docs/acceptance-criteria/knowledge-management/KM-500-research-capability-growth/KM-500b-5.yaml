it_requirements:
- Extend the neutral catalog/admission lifecycle, not the kernel registry snapshot. Define compatibility using
  descriptor/compiler/mapping versions and verification source baseline; distinguish ordinary data drift from
  incompatible source kinds or query contracts.
- Revalidation uses reviewed new-source expectations and records source SHA/generation plus descriptor digest.
  Do not require obsolete source-A entity IDs to remain the exact answer on legitimate source-B changes.
- Retirement and rollback require the same narrow configured catalog-root authority, atomic compare-and-swap
  and audit provenance as activation; retain immutable versions for pinned readers and return explicit expiry/incompatibility
  when unavailable.
- 'Interrupted-writer recovery may be a tested operator procedure: establish ownership and that no writer remains
  before removing only owned lock/temp state. Never guess a live writer is stale or delete arbitrary paths.'
- Test concurrent lifecycle mutations and process crash/reopen using the actual catalog file boundary; a helper-only
  active-pointer update is insufficient.
test_required: true
test_rationale: Planned public-interface and separately labeled real-artifact proof covers the full observable
  obligation. Existing mechanism tests are reusable but do not establish real-agent, provider or deployment
  readiness. No planned test is represented as existing coverage.
