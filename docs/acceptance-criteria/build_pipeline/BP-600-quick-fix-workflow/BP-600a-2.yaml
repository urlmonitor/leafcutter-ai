id: BP-600a-2
components:
  - build_pipeline
title: "Quick-fix never uses worktree-agent, the feature skill, or a hand-rolled git worktree add"
component: build-pipeline
level: L2
status: active
readiness: reviewed
priority: medium
work_status: done
criteria: |
  Given the quick-fix workflow script exists,
  When it processes a user-provided diagnosis,
  Then it never dispatches the worktree-agent,
  And it never invokes the feature skill,
  And it never creates a worktree by calling git worktree add itself.

  And when the isolation decision of BP-600a-1 takes Case B and a worktree is
    required, the only way the workflow obtains one is by invoking the
    repository's canonical worktree-setup script in its create-only mode,
  And it reads the worktree path and the branch name out of that script's own
    reported output rather than constructing either itself,
  And it refuses to substitute a bare git worktree add for that script even
    though the script calls git worktree add internally — the script also runs
    the build and installs the pre-commit configuration into the new worktree,
    and a worktree made without that bootstrap silently skips every package
    pre-commit hook for the entire run, so the two are not interchangeable,
  And when the script cannot be located, the workflow halts and names the paths
    it tried, rather than falling back to creating a worktree another way.
depends_on:
  - BP-600a
  - BP-600a-1
