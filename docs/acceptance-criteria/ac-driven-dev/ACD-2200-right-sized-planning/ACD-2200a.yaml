criteria: |
  How much requirement you get back matches how much you asked for.

  A one-line correction produces a single testable statement and a short
  exchange. A new capability still produces the full picture. You are never made
  to review a tree of paperwork that is larger than the change it describes and
  never handed a stub for something that genuinely needed thinking through.
