notes: |
  USER DECISION 1 (BrainCandy, 2026-10-12), BINDING:
    - The declaration is per grant: the ability is marked as provided by the
      project.
    - When absent, the build REPORTS and does not refuse.
    - It is looked up ONLY in the project's own abilities area under
      .leafcutter/skills -- never by silently falling back from the package.
    - python-coder's collector-enforcer section is DELETED (trading residue).
    - sql-coder keeps postgres and sql-test, declared this way.

  WHY "REPORT, NOT REFUSE" DOES NOT CONTRADICT AR-400a. A package-supplied
  ability that is missing is a package fault and stops the build. A
  project-supplied one that is missing is the project's choice not to provide
  it yet; the specialist simply does without, and the report says so. The two
  must never be confused in either direction -- a typo in a package grant must
  not be "rescued" by being treated as project-supplied.

  REACH ACROSS SURFACES. The decision note lists every place the declaration
  must be understood (shape check, commit-time check, the done verdict,
  delivery, docs). A declaration understood by some and not others is the
  split-record defect again.
