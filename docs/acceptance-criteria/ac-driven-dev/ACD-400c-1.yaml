estimated_complexity: M
it_requirements:
  - "Every pytest invocation used to run or verify these tests must set AC_ENFORCE_STRICT=1. Without it pytest_ac_enforcement xfail-masks tests that cover not-done ACs, and a suite that is actually red reports green."
  - "The test must reach its verdict by executing the scanner over a purpose-built temporary store and asserting the answer it returns. A test that asserts the presence, absence or ordering of any string inside scan_ac_store.py does not satisfy this AC; this repo has shipped grep-shaped tests that passed on dead code."
  - "The scanner must be driven through the same command surface the build loop uses, in a fresh process, with the temp store supplied as the AC root — not by importing and calling the private admission predicate directly. A test bound to the private helper keeps passing when the helper stops being consulted."
  - "Fixture records must be written to disk as real .yaml files under a temporary AC root, serialised the way the store's own writers serialise. Hand-indented YAML literals and monkeypatched loaders reproduce the bias that let a column-0 parsing defect ship green in EPIC-PhantomDoneFilesTouched."
  - "No change to selection behaviour is authorised by this AC. It pins a rule that already ships; if the test cannot be made green without editing the selector, that is a finding to escalate, not a licence to edit. Making the criterion true by changing the rule is the failure ACD-400e-2 forbids one level up."
  - "Each test must be independent of the live docs/acceptance-criteria/ tree and of the order tests run in — the store it asks about is the one it built."
test_spec:
  - name: test_only_the_approved_leaf_is_offered
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --ac-root <tmp> --json"
    description: "Three otherwise-identical ready leaves recorded approved / reviewed / draft: the offer contains exactly the approved id, and the reviewed and draft ids appear in neither returned list."
  - name: test_flipping_the_record_to_approved_admits_it_on_the_next_ask
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: criterion
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --ac-root <tmp> --json"
    description: "Changing only the recorded approval of the previously-withheld draft leaf to approved, and nothing else in the store, puts that same id into the offer — so the missing approval is the demonstrated cause of its absence, not a coincidence of some other filter."
  - name: test_scanner_command_surface_is_the_one_exercised
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: behavioral
    angle: reachability
    surface_invoked: "python scripts/ac_store/scan_ac_store.py --ac-root <tmp> --json"
    description: "The verdict is obtained by invoking the scanner's real entry point over the temp store and parsing its emitted JSON, proving the admission rule under test is the one the build loop actually reaches."
test_rationale: "A direct unit test on the admission predicate would be insufficient: it would stay green if the predicate stopped being called, which is the exact shape of the defect this AC exists to make impossible. The pinning value comes from asking the entry point the build loop asks."
