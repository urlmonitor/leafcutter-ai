test_required: true
test_rationale: >-
  Same method as TQ-500f-3-ii and TQ-500g-1-v: drive both twins under the harness and assert on the
  recorded dispatches, never on the workflow source. Labels are pinned (bf-wv-*, bt-wv-*) so the tests can
  name each step. K4 is the case a phase-map-based wiring would miss, and its test also proves recover runs
  once at the drive head, before anything reads code, and outside the per-ticket driver where it would
  disturb a sibling. The commit re-dispatch entry covers the remedy loop the fast lane does not have. The
  parallel-batch entry proves the sequence rides inside commitLane for the batches that stay parallel. The
  sibling non-commit hazard is removed by the user's one-ticket-per-chunk rule, and its discrimination
  entry pairs the serial case (including an unreadable source_ac) with a control batch that stays
  parallel, so a rule that serialises everything or nothing both fail. The byte-for-byte entry is
  repeated per twin because each twin carries its own copy of the here-document builder. The wrapper's own
  behaviour (verdict verbatim, writer stop never reaches the runner) is proven once in TQ-500g-1-v and not
  repeated. Every must_catch entry names both JS files in in_scope_files, because a wrong version in either
  twin must be caught by this AC's own runs; no Python is touched. Verdict identity across routes is the
  TQ-500g-1 seam test, which executes the recorded finish commands for real.
