req_status: draft
work_status: todo
criteria: |
  Existing code earns real requirements and real proof — never invented ones.

  A project that has been running for years already does thousands of things and
  none of them is written down as something it must keep doing. Its tests already
  prove a great deal and none of that proof is credited to anything. So the
  record this way of working depends on — what the project must do and what shows
  that it does — starts empty, and the only way to fill it is by hand, thousands
  of times. Nobody does that, so the record stays empty and every guarantee built
  on top of it is guaranteeing nothing. After this goal the work already in the
  codebase becomes that record: behaviour is written up as criteria you accept or
  reject, tests already written are credited to what they prove, and criteria
  that nothing proves are visible instead of quietly assumed. Every one of those
  is a proposal a person confirms. Anything that cannot be established is left
  plainly unclaimed rather than filled in with a plausible guess, because a
  record that says something false is worse than one that says nothing at all.
