  New behavioral requirement derived from the user-authorized entity-context concept.
  BA behavior and IT PO technical contracts are reviewed; implementation is verified by the independent strict entity suite and recognition corpus.
  Verification evidence: reports/entity-context-verification.md. No human approval is implied.
  Historical DK-200 direct-gather tests and evaluation reports are preserved.
  Fresh-run wiring criteria were explicitly reconciled to EntityContext on 2026-10-04.
estimated_complexity: L
it_requirements:
  - "Index availability is per supported family where safe; missing/corrupt/foreign/schema-incompatible/unreadable/stale inputs are explicit unavailable or partial results, never silent empty success."
  - "Freshness verification may use bounded local metadata/fingerprint checks; recognition must not invoke native body readers, repository traversal, lexical search, graph expansion, embeddings or synchronous index rebuild."
  - "Limitations identify only permitted family coverage and generic availability causes; they must not expose excluded cache paths/content."
test_required: true
test_spec:
  - name: "test_unusable_indexes_omit_affected_families_without_fallback"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "failure"
    description: "tests/kernel/entity_context/test_index.py::test_unusable_indexes_omit_affected_families_without_fallback: Parameterize missing, malformed JSON, incompatible schema, unreadable, foreign-root, stale and incomplete-family indexes through production recognize_entities; assert honest status/coverage and zero search/build/body-reader calls."
    must_catch: ["Falling back to legacy gather_context when the cache is missing.","Trusting HEAD alone after an already-dirty file changes."]
  - name: "test_incomplete_index_keeps_only_valid_current_family_cards"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_index.py::test_incomplete_index_keeps_only_valid_current_family_cards: Preserve usable current family metadata while one family is unavailable and verify partial coverage with no stale/fabricated cards."
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
