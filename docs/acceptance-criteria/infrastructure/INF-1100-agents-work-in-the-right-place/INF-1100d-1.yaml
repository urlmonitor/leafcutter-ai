notes: |
  USER DECISION Q3 (binding): no default address anywhere. DELIBERATE CONTRAST
  WITH INF-1100a-1-i, which falls back to a documented default test folder:
  there is no safe default for a database address, so there is no fallback
  here. Do not copy that pattern.

  The last Then clause is the control: a schema change that simply forbids the
  field would satisfy the first two clauses and break every project that
  configures its own test database.
