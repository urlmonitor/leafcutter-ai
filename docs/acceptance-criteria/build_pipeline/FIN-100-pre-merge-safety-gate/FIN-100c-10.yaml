title: "How-to guide describes the null-baseline targeted rerun, not the old blanket-halt"
level: L2
component: finalize
status: active
parent: FIN-100c
criteria: |
  Given the null-baseline targeted-rerun behavior (FIN-100c-4 through FIN-100c-9)
    has been implemented in the finalize-feature workflow
  And the how-to guide at docs/how-to/finalize-feature.md documents Step 0
    (baseline capture) and Step 3 (post-merge test run + regression triage)
  When a reader consults the guide to understand what happens when the Step 0
    baseline is unavailable (baseline_failures is null) and post-merge tests fail
  Then the Step 0 narrative no longer states that an unavailable baseline causes
    triage to "classify all post-merge failures conservatively as regressions"
    as the current behavior
  And the Step 3 narrative (and the test_regression halt section) describes the
    targeted per-test rerun against main HEAD that recovers a baseline and
    distinguishes pre_existing from regression when the Step 0 baseline is null
  And the guide describes the conservative all-regressions halt as narrowed to the
    rerun-unavailable fallback, and states that this fallback surfaces each failing
    test's modified_by_branch flag for human adjudication
  And the guide contains no remaining passage that presents the old
    "null baseline -> all post-merge failures are regressions -> halt" behavior as
    the current Step 3 behavior
depends_on:
  - FIN-100c
  - FIN-100c-4
  - FIN-100c-9
