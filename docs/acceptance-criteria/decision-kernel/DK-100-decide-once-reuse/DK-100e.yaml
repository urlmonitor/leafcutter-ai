notes: |
  DERIVED FROM leafcutter/decision-retrieval (all 8 scenarios):
    steps    lookup, judge, cite, offer-reuse, reuse
    branches not-applicable, evidence-only, decide-anew
  Also leafcutter/decision-forming step precedent (1 scenario) and the journey
  step decision-lifecycle/reuse.

  STANDING RULES TO CARRY INTO L2. Only published records are found. A record
  that was only staged is never precedent; that is DK-100d's keep-staged branch
  seen from this side. The thresholds and limits (applies at 0.5 or more, reuse
  is offered at 0.8 or more, at most 3 candidates judged) come from the kernel
  configuration. L2s should name them as configured values, not as fixed
  numbers. The reuse question is asked only when the decision has no options of
  its own and the precedent is not superseded. Reuse stages a new record that
  cites the precedent. It never edits the old one.

  The reuse step expands back into the staging sub-flow, so a reused decision is
  captured exactly as DK-100c describes. Do not restate staging here.

