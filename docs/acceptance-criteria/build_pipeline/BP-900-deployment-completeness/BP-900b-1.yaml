id: BP-900b-1
components:
  - build_pipeline
title: "Guard extracts script path references from all compiled agent templates and skill files"
component: build_pipeline
level: L2
status: active
req_status: approved
readiness: approved
priority: critical
work_status: done
criteria: |
  Given build.py has compiled agent templates and skill files to the output directory,
  When the post-compile validation phase runs,
  Then it scans every .md file in the compiled agents/ and skills/ directories
  And it extracts paths matching these patterns:
    - "python3 scripts/<path>" and "python scripts/<path>"
    - "sys.path.insert(<N>, 'scripts/<path>')"
    - "sys.path.insert(<N>, \"scripts/<path>\")"
  And the extracted set includes at minimum "scripts/ac_store/ac_prioritizer.py",
    "scripts/ac_store/generate_ticket_from_ac.py", "scripts/goal_to_epic.py"
    when those references exist in the compiled output
depends_on: [BP-900b]
doc_links:
  - path: scripts/build_propagation_audit.py
    relationship: extends
    status: exists
  - path: scripts/build_referential_integrity.py
    relationship: extends
    status: exists
  - path: docs/architecture/components/template-compiler.md
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment: null
  reference_file_path: scripts/build_referential_integrity.py
  n_location_rule: "1 — extract_script_path_refs and its _SCAN_TARGETS"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "Must scan ALL compiled .md files in agents/ and skills/ directories — no partial scanning"
    - "Must handle both single-quote and double-quote variants in sys.path.insert patterns"
    - "Must complete validation in under 5 seconds for typical template sets (fewer than 100 files)"
    - "Must not produce false positives for non-script-path strings that happen to match the regex pattern"
    - "Must follow the existing post-build validation pattern used by build_propagation_audit.py and build_referential_integrity.py"
  notes: |
    TWO SPEC/IMPL DEVIATIONS found by ac-audit 2026-08-17, recorded rather than
    silently accepted:

    1. The criteria say scan the COMPILED agents/ and skills/ output. The
       implementation scans the SOURCE templates/ tree pre-build. Behaviour is
       useful either way, but the AC text and the code disagree — reconcile
       before treating this AC as a specification of record.
    2. The two sys.path.insert regexes are untested AND match nothing in the
       real repo: the only form that actually appears in templates/agents/
       build-ac.md is prefixed with {{config.output_root}}/, which the patterns
       deliberately do not cover. That clause of the AC is currently vacuous.

    The criteria's literal "scripts/goal_to_epic.py" is also stale — the
    extractor yields the deploy path scripts/ac_store/goal_to_epic.py.
delivers_to:
  agent: python-coder
  contract: "set[tuple[str, str]] — set of (template_path, referenced_script_path) tuples extracted from compiled .md files"
