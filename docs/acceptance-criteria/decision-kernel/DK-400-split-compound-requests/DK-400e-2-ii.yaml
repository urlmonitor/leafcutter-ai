    type: integration
    angle: criterion
    description: After human:user approves the split, p1's decision still pauses for its own choice; no record exists
      until that choice is approved, and the record's approval time is that answer's time.
test_rationale: Pins the authority boundary between the two approvals with distinct pinned clock times.
