change_target: [code, config, docs]
risk_surface: contract_boundary
notes: |
  Authored 2026-10-09. Two guessed defaults are wrong for every hosted instance of this
  backend, which names its database and its user after the instance identifier: the
  synchronization workflow substitutes a conventional database name when its variable is
  unset, and the operational instructions state that hosted hosts default to a
  conventional username. Together these produced the database-not-found half of a run of
  60 consecutive synchronization failures — the job has never succeeded.

  A guessed default is worse than an absent one here. The substitution turns a precise,
  immediately actionable error (this required setting is unset) into a connection attempt
  that fails later, further from the cause, and whose message names a database the
  operator never configured. The clause requiring the configuration source to be reported
  alongside a rejected name exists so the operator can tell a wrong declared value from a
  substituted one.
it_requirements: null
test_required: true
test_spec:
  - name: test_unset_required_settings_fail_before_connecting_and_name_themselves
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: criterion
    description: Start the synchronization job with the database name and username unset,
      against a backend double that records connection attempts; assert no connection was
      attempted and the failure names each unset setting individually.
    covers: [KM-400e-8]
    must_catch:
      - "substitute a conventional database name when the setting is unset"
      - "substitute a conventional username when the setting is unset"
      - "fail with a generic message that names neither setting"
      - "attempt the connection first and report only the backend's rejection"
    requires_db: false
  - name: test_only_the_unset_setting_is_named
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: boundary
    description: Leave exactly one required setting unset and assert the failure names
      that one and not the setting that was declared.
    covers: [KM-400e-8]
    must_catch:
      - "report every required setting as unset whenever any one of them is"
    requires_db: false
  - name: test_rejected_database_name_reports_the_name_and_its_source
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: failure
    description: Declare a database name the backend rejects and assert the reported
      failure carries the requested name and the configuration source it came from, and is
      distinguishable from a successful run that found nothing.
    covers: [KM-400e-8]
    must_catch:
      - "surface the rejection as an empty or successful result"
      - "report the rejection without naming the database that was requested"
    requires_db: false
  - name: test_declared_settings_are_used_verbatim_without_credentials_in_output
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: criterion
    description: Declare instance-specific values that differ from every conventional
      name, assert the connection used exactly those values, and assert no credential
      value appears anywhere in the reported output.
    covers: [KM-400e-8]
    must_catch:
      - "override a declared instance-specific value with a conventional one"
      - "include a credential value in the reported output"
    requires_db: false
  - name: test_synchronization_job_runs_end_to_end_with_unset_and_declared_settings
    target_dir: tests/knowledge/
    framework: pytest
    type: integration
    angle: deployed
    description: Execute the synchronization job as the merge event invokes it, once with
      a required setting unset and once fully declared, and assert the observed outcome of
      each run.
    covers: [KM-400e-8]
    must_catch:
      - "fix the resolution in the library while the job keeps its own substitution"
    requires_db: false
test_rationale: >-
  The existing coverage for the synchronization job string-parses the job definition for
  expected text, which is exactly the shape that cannot tell a substitution that is
  configured from one that is reached, and it is why a wrong default survived 60
  consecutive failures. Every entry here therefore runs the job: the pre-connection
  assertion is made by recording calls on a backend double, because a test that reads only
  the returned error cannot distinguish failing before connecting from failing after. The
  final entry executes the job through the same path the merge event uses, because fixing
  the resolution inside the library while the job keeps its own substitution would leave
  every library-level test green and the real failure untouched.
