id: BO-2500a-8-v
components:
  - build_orchestration
  - ac_store
title: "A test_rationale copied from another record is refused, naming the record it duplicates"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a store in which record DK-210b-3, declared with test_required false,
    already carries the test_rationale "Docs-only change; no executable behaviour
    to test.",
  And a record being added or changed, also declared with test_required false,
    carries the test_rationale "docs only change  -  no executable behaviour to
    test",
  When the commit-time record check (check-ac-schema) checks the changed record,
  Then the record is refused, because its test_rationale is identical to
    DK-210b-3's once both are normalised,
  And normalising folds letter case, collapses every run of whitespace to one
    space, ignores punctuation, and trims both ends,
  And the refusal names the changed record, the field test_rationale, and the
    other record that already carries the same text (DK-210b-3),
  And when the same text is carried by more than one other record, the refusal
    names every one of them,
  And a test_rationale that differs from every other record's after normalising
    is accepted, even when it shares most of its words with one,
  And the comparison is made against every record in the store declared with
    test_required false, not only the records in the change being committed,
  And only records declared with test_required false take part: the
    test_rationale of a record whose test_required is true or absent (the
    justification of its test_spec) is never compared and never refused by this
    rule, even when it is identical to another record's test_rationale,
  And two records in the same change that carry the same normalised text are both
    refused, each naming the other,
  And a stored record left unchanged by the commit is not refused by it, even if
    its text duplicates another stored record's; it is refused the first time it
    is itself changed.
depends_on: [BO-2500a-8, BO-2500a-8-i]
