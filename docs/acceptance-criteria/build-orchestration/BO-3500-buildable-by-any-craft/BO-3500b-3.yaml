id: BO-3500b-3
components:
  - build_orchestration
title: "Members are produced in dependency order across crafts, so a page describes the code that run produced"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a mixed group in which the documentation page member depends on the source code
    member it describes,
  When the run builds the group,
  Then the craft that writes the page is dispatched after the craft that produced that
    code has finished,
  And the code as that run produced it is available to the page craft as its input, so
    the page can describe what this run made rather than what stood there before it.

  Given a mixed group in which two members declare different crafts and neither depends
    on the other,
  When the run builds the group,
  Then whichever order those two are produced in, the run reaches the same ending and
    produces the same artifacts — the outcome does not depend on an order the operator
    did not ask for.

  Given a mixed group in which a source code member depends on a configuration member,
  When the run builds the group,
  Then the configuration is produced before the code that depends on it, by the same
    rule — dependency order is read from the requirements themselves and is not a fixed
    sequence of crafts.
depends_on: [BO-3500b]
doc_links:
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
    relevance: "The run's phase order is fixed and code-shaped — tests, then code. Ordering by declared dependency across crafts is a different rule and needs describing alongside it, including where the two interact."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "ORDER COMES FROM THE MEMBERS' OWN depends_on, VIA THE EXISTING _topo_order_build_set IN scripts/build_orchestration/fast_lane.py. Do NOT introduce a fixed craft order (all code, then all docs, then all diagrams). That implementation is right about eighty per cent of the time by accident and the third scenario — a code member depending on a config member — is written to fail it."
  - "THE PAGE CRAFT'S INPUT IS THE WORKTREE AS THIS RUN LEFT IT after the code member's phase, not the base ref and not a cached snapshot taken at run start. The observable being asserted is WHAT THE CRAFT WAS GIVEN — never a judgement about the prose, which would be untestable and would be quietly satisfied by anything."
  - "ORDER-INDEPENDENCE FOR UNRELATED MEMBERS IS WHAT KEEPS THE COVERING TESTS NON-FLAKY. Assert equal ending and equal artifact set under two forced interleavings; never assert one particular interleaving, or the test starts failing the moment anything is parallelised."
  - "The topological order must be computed once over the whole mixed set, including members whose crafts differ. Dependency resolution already exists and is not being re-specified — what is new is that it must survive members being produced by different crafts, so the ordering key must be the member, never the craft."
  - "A cycle across crafts must fail the same way a code-only cycle does today; do not add a craft-based tie-break that silently breaks a cycle."
  - "NO PRESENCE-ONLY ASSERTIONS. Execute runs and assert on the recorded dispatch sequence and on the content handed to each craft."
