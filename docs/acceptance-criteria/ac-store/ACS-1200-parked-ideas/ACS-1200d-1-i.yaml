  - path: docs/reference/ac-schema.md
    relationship: related
    status: exists
  - path: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200b-2.yaml
    relationship: related
    status: exists
    relevance: "The report whose sections this state must be distinguishable within."
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "This is the FOURTH state on the report classification owned by ACS-1200b-2 (orphan / parked / approved-with-nothing-under-it / un-parked-but-not-decomposed). Add it to that structure; do not add a fourth independent branch to scripts/ac_store/scan_ac_orphans.py. States must remain a partition — the tree lands in exactly one."
  - "The state is derived from data properties only: back-links present, no marker, and no descendant at level L2 or below. Descendant discovery must reuse derive_parent_id, the same function ACS-1200c-4 uses, so the two states cannot disagree about what a descendant is."
  - "The buildable-queue guarantee is currently an ACCIDENT of scan selection and must be pinned as intent: scripts/ac_store/scan_ac_store.py's _is_leaf (line 145) matches only L2/L3 and _is_approved (line 189) requires the literal string 'approved'. This AC's value is that a future change to that selection cannot quietly promote every undecomposed stub into the backlog, so the assertion must execute the scan and compare returned sets, not assert the current implementation's shape."
  - "NO SILENT REVERSION: nothing in the implementation may re-apply the marker based on inferred state. The marker is only ever set by an author writing it into the record — a state the system re-applies on your behalf is not a decision anyone made, which is the same reason the marker is positive rather than inferred in ACS-1200a-1."
  - "No duration, age or population field may be introduced here — how long a tree has sat in this state is KM-200c's remit."
test_spec:
