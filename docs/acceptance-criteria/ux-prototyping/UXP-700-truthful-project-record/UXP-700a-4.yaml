test_rationale: |
  A hand-maintained list of required files is exactly the mechanism that failed here: the
  deploy list omitted the store's own inputs and nothing noticed. So the contract cannot be
  proved by asserting the list contains the right names; it has to be proved by a
  varying-population test - add a start-up input to the checker and the stated required count
  must rise by one without any list having been edited.
test_spec:
  - name: test_build_installs_a_throwaway_record_and_runs_its_checker
    target_dir: unit_tests/build_guards/
    description: "The build's record smoke-test deploys into a temp project and executes the checker there."
    type: integration
    angle: deployed
    framework: unittest
  - name: test_required_file_set_is_derived_not_restated
    target_dir: unit_tests/build_guards/
    description: "Adding a start-up input to the checker raises the build's stated required-file count by exactly one with no manifest edit."
    type: integration
    angle: seam
    framework: unittest
notes: |
  ANTI-RECURRENCE AC. The reason build_product_truth() shipped without a scaffold is that
  nothing exercised the thing it produced. A derived required-file set is the only shape that
  cannot silently fall behind again - a restated list is satisfiable by a stale literal, which
  is the current state.

  Mutation proof for the derivation clause lives in UXP-700a-4-i.
