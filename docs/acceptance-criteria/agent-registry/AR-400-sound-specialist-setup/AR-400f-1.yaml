    status: exists
    relevance: "The spawn graph and the __ticket_phase_agents__ covering entry."
assigned_agent: python-coder
estimated_complexity: M
change_target: code
risk_surface: internal
package_surface: false
it_requirements:
  - "READ THE DECLARATION, NOT THE DERIVED COPY: the check reads each specialist's frontmatter `spawn_allowlist` declaration. The registry copy is regenerated by _agent_ability_sync.declared_spawn, which de-duplicates (list(dict.fromkeys(raw))) -- a repeat never reaches the registry, so a registry-based check cannot see AR-400f-1-i. is_ticket_phase is read from the registry (an authored field)."
  - "Convert scripts/spawn_bidirectionality_validator.warn_redundant_phase_agents (~146-173, prints [WARNING], returns None) into a function that RETURNS findings, and append them to validate_agent_registry's errors (registry_validator.py:131 call site). spawn_bidirectionality_validator.py is 121 lines; registry_validator.py may not grow, so the call-site change must be net-neutral."
  - "The finding names the specialist, the redundant entry and the covering entry `__ticket_phase_agents__`, classified 'redundant hand-off entry'; it is an error line, never a [WARNING]."
  - "Delivery de-duplication stays (AR-300c-5): the compiled hand-off list names each agent once; only accepting the redundant declaration ends."
  - "Update AR-300c-5's pinning tests if they assert the warning; the done record's delivery promise is unchanged."
test_spec:
  - name: test_redundant_ticket_phase_entry_fails_both_doors
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: criterion
    description: "Copied package slice; probe-supervisor declares [__ticket_phase_agents__, brainstorm-lead, llm-expert], llm-expert is_ticket_phase true, brainstorm-lead false; the validator CLI and build.py both fail with one redundant-entry finding naming probe-supervisor, llm-expert and __ticket_phase_agents__, and print no [WARNING] for it."
    must_catch:
      - "the check still prints a warning and returns nothing"
      - "the check reads the registry copy"
  - name: test_uncovered_explicit_entry_is_not_a_finding
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: integration
    angle: discrimination
    description: "brainstorm-lead (not ticket-phase) produces no finding in the same run."
  - name: test_removing_redundant_entry_passes_and_delivers_llm_expert_once
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: e2e
    angle: deployed
    description: "Remove llm-expert from the declaration: both doors pass, and probe-supervisor's compiled hand-off list names llm-expert exactly once."
test_rationale: >-
  The registry copy hides repeats, so the descriptors run the doors over a
  frontmatter declaration; the compiled-list descriptor keeps AR-300c-5's
  delivery behaviour pinned.
