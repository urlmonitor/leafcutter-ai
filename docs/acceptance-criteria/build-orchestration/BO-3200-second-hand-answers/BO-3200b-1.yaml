it_requirements:
  - "THE RELEASE IS CARRIED OUT BY THE LAYER THAT MUST GUARANTEE IT AND IS NEVER LEFT TO A PARTY THAT MAY DECLINE OR JUDGE. The guaranteeing layer issues each release as an exact release command to the chartered executor through BO-3200f-1's shared dispatch helper -- the addressing BO-3200f-3 requires of every release -- and reads each result itself. No release dispatch goes to any other party, none asks anyone whether, what or how to release, and there is no path that tries a specialist first and falls back to the executor. Testable only in the environment where no party can be asked to judge: an assertion that the claim was released passes on a run that got lucky with a cooperative specialist."
  - "THE TEST STORE MUST OUTLIVE THE RUN. Asserting against a fast-lane run's throwaway copy proves nothing: that copy being discarded is the accident that made the first sighting cheap, and the parent L1 is explicit that the severity must not be set by it. Exercise a store the run does not own."
  - "EVERY DISTINCT STOP POINT AFTER THE CLAIM MUST BE COVERED, and the set of stop points must be DERIVED from the run's structure rather than listed by hand. KI-BO-020 records nine release dispatches with the same defect; fixing the first found and testing only that one leaves eight live, and a hand-written list of nine will be eight the next time a stop point is added."
  - "RELEASE MUST RUN ON ABNORMAL TERMINATION TOO, not only on the paths that reach an orderly halt. An exception escaping the claim/release region strands exactly the records this AC is about — see KI-BO-022, which is adjacent and not adopted here, but whose shape must not be re-created."
  - "RELEASE MUST BE IDEMPOTENT: releasing an already-unclaimed item is a no-op, not an error. Otherwise a run that releases on both an inner and an outer path fails on the second."
  - "THE ASSERTION MUST REACH RE-CLAIMABILITY, not stop at the field value. A store whose field reads unclaimed but which the selection guard still refuses has not been released in the sense that matters."
  - "The release's outcome must be produced in the shape BO-3200b-2 consumes, so the halt report can state whether it succeeded — performing the action inline does not, by itself, mean anyone read the result."
  - "Coverage must use unit_tests/_workflow_engine_harness.py with BO-3200f-1's stand-in -- executor dispatches answered through the real capture, every other dispatch failing immediately -- and must exercise the real lane rather than a re-implementation of its claim logic. A per-test fake that answers the release dispatch with canned output is forbidden (BO-3200f-1)."
  - "THE ADDED And IS ASSERTED FROM OBSERVATION, NOT SELF-REPORT. Every dispatch attempted while releasing -- including ones that failed -- is taken from the harness's own record of dispatches, with its addressee and whether it carried an exact command, never from the lane's log or its returned text."
  - "A RELEASE THAT CANNOT BE COMPLETED THROUGH THE EXECUTOR IS REPORTED, NEVER ASSUMED. A could-not-complete or non-zero result from a release dispatch makes that item released: false, with BO-3200f-1-i's reason as its reason; it is never counted released and never retried by addressing another party. How partial and per-item failures are constrained stays BO-3200b-1-i's."
delivers_to:
  - agent: python-coder
    contract: "A release operation carried out by the guaranteeing layer through exact-command dispatches to the chartered executor via BO-3200f-1's helper -- never to any other party -- returning a per-item outcome list [{item_id: str, released: bool, reason: str | null}] plus an aggregate {attempted: int, released: int, failed: [item_id]}; reason carries BO-3200f-1-i's uninspectable_reason when a release dispatch could not complete or the command exited non-zero. BO-3200b-2 places this aggregate in the halt report; BO-3200b-1-i constrains its partial-claim and per-item-failure behaviour."
  - agent: architecture-diagram-author
    contract: "The ordered failure-path trace of a real run driven to a failure after the claim -- claim recorded, later step fails, release carried out through exact-command dispatches to the chartered executor, outcome read, halt reported -- with every dispatch made while releasing recorded as {addressed_to: str, exact_command: bool, outcome: str}, so BO-3200b-4's diagram can be compared against it."
expects_from:
  - ac_id: BO-3200f-1
    contract: "The executor dispatch helper {command, cwd} -> {outcome: 'completed', cwd, exit_status, stdout, stderr} | {outcome: 'could_not_complete', reason, detail, blocked_by}, verified; and the harness stand-in that answers executor dispatches through the same capture while every other dispatch fails immediately -- the environment of the first scenario."
  - ac_id: BO-3200f-1-i
    contract: "The could-not-check mapping from a could-not-complete or non-zero release result to one of five distinct reasons (executor_transport_failed | executor_result_incomplete | executor_declined | guardrail_blocked | command_exited_nonzero), carried as the item's release reason."
test_spec:
  - name: test_bo_3200b_1_claim_is_released_when_no_party_can_be_asked_to_judge
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: criterion
    description: "THE DISCRIMINATOR. Drive the real lane against a store that outlives the run, claim items, force a later step to fail, under BO-3200f-1's stand-in (executor dispatches answered through the real capture, every other dispatch failing immediately); assert every claimed item is back in its unclaimed state in that same store."
  - name: test_bo_3200b_1_every_release_dispatch_is_an_exact_command_to_the_executor
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: seam
    description: "From the harness's own dispatch record for the same run, assert every dispatch made while releasing was addressed to the executor and carried an exact command. Negative controls on planted lane copies: a release sent to python-coder, and a release that first sends KI-BO-020's 'You are the release-phase agent' prompt to a specialist and then falls back to the executor, both fail this test -- the second even though the claim ends up released."
  - name: test_bo_3200b_1_released_items_are_re_claimable_by_a_new_run
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: criterion
    description: "After the failed run ends, start a new run selecting from the same store and assert it can claim the same items. Asserts the consequence — the selection guard accepts them — not merely the field value."
  - name: test_bo_3200b_1_every_derived_stop_point_releases
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: seam
    description: "Enumerate the run's stop points after the claim FROM ITS STRUCTURE, drive to each in turn, and assert full release after every one. A hand-written list of nine fails the moment a tenth is added; the derivation is what makes this durable."
  - name: test_bo_3200b_1_release_runs_on_abnormal_termination
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: failure
    description: "Force an exception to escape after the claim and assert the items are still released. The orderly-halt paths are the ones an author remembers; this is the one that strands records."
  - name: test_bo_3200b_1_release_is_idempotent
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    angle: boundary
    description: "Releasing an already-unclaimed item is a no-op rather than an error, so a run that releases on both an inner and an outer path does not fail on the second."
  - name: test_bo_3200b_1_release_that_cannot_complete_through_the_executor_is_reported_not_assumed
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: failure
    description: "With the stand-in failing the release's executor dispatch in transit, and separately returning a release command that exits non-zero, assert each affected item is released: false with BO-3200f-1-i's matching reason, the aggregate counts it failed, and no further dispatch to any other party is attempted."
  - name: test_bo_3200b_1_release_outcome_is_produced_for_the_halt_report
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: integration
    angle: seam
    description: "Assert the release produces the per-item and aggregate outcome BO-3200b-2 consumes. Carrying the release out does not by itself mean anyone reads the result -- that was the second, independent defect in KI-BO-020."
test_rationale: |
  "Carries out the release itself" is a claim about HOW, and a run with a cooperative specialist
  releases correctly too. Removing every party that could decline or judge -- leaving only the
  executor, which carries out exact commands -- is the only shape that can only be passed by a
  run that issues the release itself, the same technique as BO-3200a-1. The dispatch-record test
  closes the one shape that still passes: a specialist asked first, the executor used as the
  fallback. It reads the harness's record rather than the lane's own account, because a lane that
  reports what it meant to dispatch is the self-report this tree does not accept.
  Two choices here are deliberate and load-bearing. Asserting RE-CLAIMABILITY rather than the
  field value ties the test to the actual damage: a stranded claim is permanently excluded from
  selection by a guard that is behaving correctly. And using a store that outlives the run
  refuses the accident that made the first sighting cheap — a test against the fast lane's own
  throwaway copy would pass on a completely broken release.
  Deriving the stop points rather than listing them is what keeps this from being nine fixes and
  a tenth defect.
