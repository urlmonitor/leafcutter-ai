id: TKT-100g
title: "Flight-level router classifies requests before dispatch"
component: ticket-creation
level: L1
status: active
req_status: active
work_status: todo
criteria: |
  Given a user invokes /create-ticket-v3 with a request,
  When the pipeline starts,
  Then a Haiku classifier runs first (before PO or BA) and determines:
    - "strategic" — the user is describing a product goal, a new capability,
      or a feature they want ("I need a dashboard", "users should be able to...").
      Route: PO agent (L0/L1) → user gate → BA agent (L2/L3).
    - "tactical" — the user is describing a specific behavior, a bug fix,
      or a technical change ("this button should validate the form",
      "the API returns 500 when..."). Route: BA agent directly (L2/L3),
      skip PO.
  And the classifier is Haiku (fast, cheap — pure classification, no reasoning).
  And the classifier's output is a structured JSON:
    { "flight_level": "strategic" | "tactical", "rationale": "one sentence" }
  And the IT PO always runs after the BA regardless of flight level
    (every AC needs technical enrichment).
  And the classifier can be overridden by the user:
    "/create-ticket-v3 --strategic" forces PO path,
    "/create-ticket-v3 --tactical" forces BA path.
  And if the classifier is uncertain (confidence < 0.7 or ambiguous phrasing),
    it defaults to "strategic" (PO path) — over-classification is cheaper
    than missing the big picture.
