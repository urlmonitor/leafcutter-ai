documentation_rationale: >-
  No new concept is introduced. KM-ADM-004 changes how an existing view draws a
  relationship that the map's reference documentation already defines, and the
  relationship's own trust record — reachable by clicking it — is the documentation
  the reader needs. The map reference itself is kept correct by KM-ADM-100d.
change_target: ui
risk_surface: internal
notes: |
  One child today, deliberately. The user named requirement-to-requirement dependency
  one of the two most load-bearing relationships in the whole map, "because they would
  tell us what to (not) touch and watch out for when refactoring or enhancing a
  feature" — that is a benefit worth its own L1 even at one child, and it is the
  natural home for the next relation that gets promoted from summary to traversal.

  CARRY THIS CAVEAT FORWARD (from KM-ADM-004): making a relationship visible must not
  make it trusted. The dependency link is enforced but AMBIGUOUS — it multiplexes
  parent, pattern and dependency references, and target existence is unchecked. It
  keeps its "reconcile first" verdict. Sibling KM-ADM-100a owns the rating; this L1
  owns only whether you can follow the link.
