test_spec:
  - name: test_where_filtered_count_star_counts_non_null
    target_dir: unit_tests/evals/tq200d2iii/
    framework: pytest
    type: unit
    angle: criterion
    description: >-
      The criteria's test (exact processed-row count plus 'SELECT COUNT(*) ... AND buy_volume IS NOT NULL' asserted
      with assertEqual(fetchone()[0], len(_SEEDED_ROWS))) passes, and so do 'WHERE buy_volume IS NOT NULL', 'WHERE
      w.buy_volume IS NOT NULL' and COUNT(1).
    must_catch:
      - revert the fix
      - alias-qualified predicate rejected
      - COUNT(1) rejected
    in_scope_files:
      - scripts/evals/sql_test_writer_eval/evidence_kinds.py
      - scripts/evals/sql_test_writer_eval/sql_resolve.py
  - name: test_earlier_non_null_forms_still_pass
    target_dir: unit_tests/evals/tq200d2iii/
    framework: pytest
    type: unit
    angle: boundary
    description: >-
      count(buy_volume), FILTER (WHERE buy_volume IS NOT NULL) and CASE WHEN buy_volume IS NOT NULL still pass,
      and the tq200d2 probes keep their results.
    must_catch:
      - an earlier form dropped when the filtered form was added
    in_scope_files:
      - scripts/evals/sql_test_writer_eval/evidence_kinds.py
      - scripts/evals/sql_test_writer_eval/sql_resolve.py
  - name: test_filtered_count_star_false_greens_fail
    target_dir: unit_tests/evals/tq200d2iii/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Each fails: 'buy_volume IS NOT NULL' in a different statement from its COUNT(*); a COUNT(*) filtered on 'buy_volume
      IS NULL'; one filtered on another column's IS NOT NULL; a filtered COUNT(*) asserted only with '>= 0' or 'at
      least one row'; a filtered COUNT(*) as the only count with no exact processed-row count.
    must_catch:
      - '''is not null'' anywhere in the file accepted for an unfiltered COUNT(*)'
      - '''is null'' accepted as a non-NULL filter'
      - another column's 'is not null' accepted
      - a filtered count asserted with '>= 0' accepted
      - the filtered COUNT(*) counted as the processed-row count too
    in_scope_files:
      - scripts/evals/sql_test_writer_eval/evidence_kinds.py
      - scripts/evals/sql_test_writer_eval/sql_resolve.py
  - name: test_kept_rerun1_output_passes_and_predicate_removed_fails
    target_dir: unit_tests/evals/tq200d2iii/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The run1 probe under unit_tests/evals/fixtures/tq200d-rerun/sql-test-writer/empty-window-database-shape/ passes;
      a copy without 'AND buy_volume IS NOT NULL' fails.
    must_catch:
      - the kept output without its predicate passes (false green)
    in_scope_files:
      - scripts/evals/sql_test_writer_eval/evidence_kinds.py
      - scripts/evals/sql_test_writer_eval/sql_resolve.py
  - name: test_sql_test_writer_gold_still_passes_with_filtered_counts
    target_dir: unit_tests/evals/tq200d2iii/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: >-
      python scripts/evals/run_agent_eval.py --agent sql-test-writer --score-gold --results-file <tmp>
    description: The real CLI replays the sql-test-writer gold outputs and every row passes.
  - name: test_count_entry_lists_the_filtered_form
    target_dir: unit_tests/evals/tq200d2iii/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The entry lists the filtered COUNT(*) form and the new failing forms, every probe file it names scores as
      stated, and the template remedy is unchanged.
    must_catch:
      - entry still lists only three non-NULL forms
    in_scope_files:
      - docs/reference/produced-tests-eval-assertion-kinds-sql-test-writer.md
test_rationale: >-
  A WHERE-filtered COUNT(*) is easy to accept too widely: a predicate anywhere in the file, a NULL test, another
  column or a weak assertion would each turn an unfiltered count into a false green, so each has its own negative
  probe. The kept re-run 1 file is the real output that was falsely red; its copy without the predicate proves the
  widening is tied to the predicate.
