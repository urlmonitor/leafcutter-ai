notes: |
  THE CHAIN IS THE LOAD-BEARING SHAPE, per BO-100e's decomposition warning. A
  scenario in which everything is eligible at the start passes on today's behaviour
  and proves nothing, which is why the third scenario here is a control rather than
  the main case: it exists only so the fix cannot be "ignore prerequisites entirely".

  VERIFY BY EXECUTION. Per CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not
  by Grep", finding a repeated eligibility decision in the source cannot tell whether
  its answer is ever used. The proof is the later layers being taken on in a real
  drive over a real four-piece chain.

  Ordering is on SUCCESSFUL completion, not on the earlier piece's attempt ending;
  that distinction is BO-100e-1-i and is deliberately not restated here.
