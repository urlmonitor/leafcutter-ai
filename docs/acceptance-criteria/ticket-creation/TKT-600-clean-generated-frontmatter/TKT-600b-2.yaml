id: TKT-600b-2
title: "An excluded phase is recorded as excluded, never as signed off, and carries no sign-off row"
component: ticket-creation
components:
  - ticket_creation_pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical   # owner decision at the approval gate, 2026-09-01
roadmap_phase: phase_1
criteria: |
  Given a generated ticket whose phase record marks the pull-request phase as excluded,
    because the drive will not dispatch that phase for this ticket's location,
  When the ticket is read immediately after generation, and again after a drive that
    completes every phase the record requires,
  Then on both readings the pull-request entry's status is "explicitly excluded from
    this ticket",
  And on neither reading is it "signed off",
  And the ticket's sign-off checklist contains no row for the pull-request agent,
  And the ticket's comment log contains no sign-off entry attributed to the
    pull-request agent,
  And the ticket is nonetheless eligible to be recorded complete, because an excluded
    phase is not an outstanding one.

  Given the same ticket with the pull-request entry set to "signed off" instead,
  When the ticket is read,
  Then that is a defect and not an alternative satisfaction of this criterion: no
    pull-request phase ran for this ticket, and a record saying one did is a false claim
    of work performed.

  And all four facts above — excluded status, no signed-off status, no checklist row, no
  comment entry — hold together for every phase the record marks excluded, not for the
  pull-request phase alone.
depends_on: [TKT-600b]
doc_links:
  - path: templates/skills/signoff/SKILL.md
    relationship: describes
    status: exists
    relevance: "States that an excluded agent must not appear in the Sign-offs checklist at all, and that an orphan checklist row is itself rejected by the parity guard."
  - path: docs/known-issues/build-orchestration.md
