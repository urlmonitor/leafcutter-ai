criteria: |
  Given a reader of the decision kernel's architecture,
  When they open the component diagram for splitting a request,
  Then it shows the new host operation that proposes parts as a host handoff beside the existing
    host handoffs,
  And it shows the pieces a split passes through: detection at routing and at a work item, the
    quote check that sets proposals aside, the person's split gate, the scheduler that runs the
    approved parts, and the run report's split section,
  And it shows the split record in the run root and its links to the parts' decision records,
  And every container in it corresponds to one named in the kernel's container overview.
