criteria: |
  Given a change to a parser, validator, or hook,
  When it is verified,
  Then an independent behavioral check runs the component in a fresh process against a
    real on-disk artifact produced by the tool that writes it
  And it asserts the observable behavior on that artifact (not only on synthetic
    fixtures authored inside the test).
