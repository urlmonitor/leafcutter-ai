    Today each run''s criteria are generated per decision and stored only inside docs/decisions/dec-*.yaml records. Options:
    a) one YAML file per criterion in a new docs/criteria/ folder (same style as the decision records, ADR-059 ''YAML now,
    graph later''); b) one catalog YAML of criterion categories, each listing its member criteria; c) keep criteria inside
    decision records and generate a criteria index from them; d) another option grounded in the repository. The format must
