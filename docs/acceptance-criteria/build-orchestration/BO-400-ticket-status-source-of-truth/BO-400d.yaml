criteria: |
  A ticket remembers every attempt it took, not only its final outcome.

  Work that failed, was retried, and eventually succeeded leaves a visible trail
  of each attempt alongside its final state — so rework is something you can see
  and measure instead of something that quietly disappears the moment the work
  finally passes.
