it_requirements:
  - "Name the declaration exactly as AR-300c-5 lands it: the frontmatter key `spawn_allowlist` (a list of agent ids) in the same block as `tools:`, and the literal entry `__ticket_phase_agents__`, which stays one entry and resolves on every build to the agents whose registry `is_ticket_phase` is true (that flag is still authored in config/agent_registry.json)."
  - "Rewrite, do not append to, the stale statements in docs/reference/agent-template-frontmatter.md: the `spawn_allowlist` row and the '`spawn_allowlist` and Registry Injection' section describe resolution into a `{{my_spawn_allowlist}}` body placeholder, an empty list meaning 'managed via the registry only', and 'Keep both in sync'. All three become false. Also correct the 'Relationship Between Frontmatter and Registry' section so spawn_allowlist is shown as declaration -> derived copy."
  - "State the derived-copy consequence concretely: a hand edit to the registry spawn_allowlist is reported by the build, the declaration wins in the compiled prompt, and the transform-agent-registry pre-commit hook regenerates the registry field from the declarations (AR-300c-5-ii)."
  - "State the Agent-tool rule and its enforcement: an agent declaring any sub-agent (the macro included) must list `Agent` in `tools:`, and the build refuses otherwise (AR-200b-3). Also state that a declared sub-agent with no packaged or project-local definition refuses the build (AR-300c-5-iii)."
  - "The SWEEP is the deliverable: search docs/, templates/skills/ and templates/agents/ prose for any instruction to write a sub-agent table into an agent body or to place a marker for the list, and report the finding list even when empty. llm-expert's prompt-review checklist item 4 must be REWRITTEN to point at the declaration and to check that a prompt using the Agent tool has a `spawn_allowlist` declaration (and vice versa), not deleted. This is a prompt-body edit to templates/agents/llm-expert.md, not a registry edit, so it does not depend on the open llm-expert/registry scope question."
  - "State that nothing beyond the declaration is needed for a permission to reach the agent (no registry edit, no marker, no table)."
  - "Agree between docs/reference/agent-template-frontmatter.md and docs/how-to/creating-an-agent-template.md; implement in the same pass as AR-300c-4. Follow the documentation frontmatter rules and the doc-length ratchet (an already-oversized doc may not grow). Do not restate compiler internals."
test_required: false
