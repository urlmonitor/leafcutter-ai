estimated_complexity: M
it_requirements:
  - "THE ONE STATEMENT THAT SWITCHES A CHECK ON IS MEMBERSHIP IN hooks_manifest.hooks IN templates/scripts/commit_guardian/commit_guardian.json. Everything else the page shows is descriptive: a severity rating in the README table, a settings block in templates/scripts/commit_guardian/config.py, a top-level settings section in commit_guardian.json itself, and autofix routing in templates/scripts/precommit-autofix.json. All five artifacts were confirmed present on 2026-09-14. Name them exactly; a paraphrase like 'the hook config' is what makes the four signals interchangeable in a reader's mind."
  - "THE CONFIGURATION-SECTION CASE IS THE COUNTERINTUITIVE ONE AND MUST BE STATED EXPLICITLY. A populated settings section IN THE SAME FILE as the executing list does not switch a check on. Measured 2026-09-14: folder_density, sql_complexity and debug_scripts each hold a populated, commented settings section in commit_guardian.json while no hooks_manifest entry names any of them. A reader who has understood 'the JSON file is the real one' still gets this wrong."
  - "STATE THE RECONCILIATION RULE AS IN FORCE ONLY WHEN IT IS. The criterion requires the page to say the rule is in force, not forthcoming — which means this page must not land before GE-120h-1 does. Both depends_on edges already say so; the practical consequence is that a documentation pass run early produces a page whose central claim is false on the day it ships, and this component has already recorded a check documented as taking a remediation action its code never takes."
  - "DO NOT WRITE A PER-CHECK REACHED/NOT-REACHED COLUMN BY HAND AND DO NOT INVENT A SEPARATE STATUS VOCABULARY. The final clause forbids the page being a second source of truth: whatever the page says per check must be the thing the reconciliation reads and can contradict. Free prose beside an entry is the failure mode the record's second named mutation exists to catch."
  - "NO COUNT IN THE PROSE. Any figure must carry the date and the state it was measured at. The unregistered population moved 18 -> 16 -> 14 in a single day; a page stating how many checks are unreached is stale within the week, while a page stating per check whether it is reached is maintained by its own agreement clause."
  - "THE THREE NEIGHBOURING OBLIGATIONS ON docs/how-to/managing-pre-commit-hooks.md ARE DISTINCT AND NONE MAY BE CLOSED AS ANOTHER. GE-120f-5 requires the registration procedure to state that a check carries a declared known-bad input and that a declaration is not a demonstration; GE-120g-3 requires the guidance to state what declaring a role obliges a check to do; this record requires the INDEX to state which statement causes a check to run. Add a section, do not rewrite theirs."
  - "docs/pre-commit-hooks.md AND templates/scripts/commit_guardian/README.md BOTH EXIST AND BOTH ARE REACHED FIRST BY SOME READERS. Where the statements live is the documentation author's decision; the constraint is that the two do not end up disagreeing with each other, which is the same defect one level down from the one this page is about."
  - "MENTION, FOR THE FIVE GE-120h-3 REGISTERS, THE TWO FACTS A READER WOULD OTHERWISE DISCOVER THE HARD WAY: check-test-fixture-bloat ships REGISTERED BUT UNARMED (its test_fixture_bloat settings key does not exist, so enabled resolves False and every violation path returns 0 — verified 2026-09-14), and check-ac-done-on-merge runs at the post-merge stage, which fires only where the post-merge hook shim is installed. A page that lists both as protecting the reader without those qualifications repeats this tree's own defect in its own remedy."
test_spec:
  - name: test_ge120h4_page_statements_agree_with_the_running_list
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "For every check the index lists, what the page says about whether it is reached agrees with whether a hooks_manifest.hooks entry names it — the two artifacts are compared, not read."
  - name: test_ge120h4_removing_one_entry_from_the_running_list_turns_the_agreement_test_red
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: "The record's first named mutation, executed: with the page unchanged and one of the five entries removed from the manifest, the agreement assertion fails; reverting restores green."
  - name: test_ge120h4_changing_one_page_statement_turns_the_agreement_test_red
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: failure
    description: "The mirror mutation: with the manifest unchanged and one page statement altered, the agreement assertion fails — the gap is caught in both directions."
  - name: test_ge120h4_a_status_stated_in_a_form_the_reconciliation_cannot_read_is_not_counted
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "The second named mutation: a check's status written as free prose the reconciliation does not consult fails this assertion while the others stay green — the page cannot drift back into being a fifth independent signal."
test_rationale: >-
  This record is change_target docs and most of its clauses are discharged by writing
  sentences, so test_required: false would be the reflexive answer — and it would be
  wrong. The BA's own coverage note identifies the agreement clause as the one that can
  be exercised rather than merely written: it is a property of two artifacts and it
  fails when they diverge. That is the clause the component has an anti-precedent for —
  a check documented as taking a remediation action its code never takes, believed for
  months, and a page stating an enforcement level the running entry does not carry — so
  it is the clause that must be machine-held rather than reviewed. The three mutation
  cases are the record's own named injections, promoted to test cases because a
  described mutation is not an executed one, and because each isolates a different way
  the page can be wrong: stale about the list, wrong about a check, or correct in a form
  nothing can contradict.
declares_side_effect: false
