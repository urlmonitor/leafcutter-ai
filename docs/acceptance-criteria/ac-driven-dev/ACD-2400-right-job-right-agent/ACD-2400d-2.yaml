notes: |
  AMENDMENT NEEDED: BO-2000d-3 promises that the IT PO template states the obligation to
  supply five package-surface fields including the resolved reference-file path. After
  this AC the reference-file path comes from the file-aware step; amend BO-2000d-3 so the
  planner's obligation covers the other four fields and the reference file is attributed
  to the file-aware step. BO-2000d-1 (validation fails when any of the five is missing) is
  unchanged in substance but its TIMING changes - see ACD-2400d-2-i.
  TKT-300a-2 (no implementation prescriptions in it_requirements) sits uneasily with a
  planner-written file path today; moving the choice out removes that tension.
