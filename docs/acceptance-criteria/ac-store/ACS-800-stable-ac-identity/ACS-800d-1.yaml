id: ACS-800d-1
readiness: approved
priority: high
title: "Migration assigns a UID and populates hierarchy metadata for every existing requirement"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given the store contains requirements whose hierarchy is today encoded only in
    their position-encoded names (for example ACS-100, ACS-100a, ACS-100a-1,
    ACS-100a-1-i),
  When the one-time migration runs,
  Then every existing requirement is assigned a stable opaque UID,
  And every existing requirement's parent-pointer, level, and order metadata are
    populated from its current position-encoded name (the parent pointer is set
    to the UID of the requirement its old name derived as parent, the level
    matches its old name's depth, and the order reflects its old sibling
    sequence),
  And no two migrated requirements receive the same UID.
