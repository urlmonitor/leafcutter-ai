test_spec:
  - name: test_bo_3200f_2_ii_switch_off_dispatches_nothing_and_reports_not_run_naming_the_switch
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: "Run the three live descriptors through the real test runner in a subprocess with LEAFCUTTER_LIVE_DISPATCH unset, then set to '0', with the shared transport's process launch observed; assert no launch occurred, each descriptor's outcome is skipped with a reason naming LEAFCUTTER_LIVE_DISPATCH, and none is counted passed."
  - name: test_bo_3200f_2_ii_ci_and_default_suite_do_not_set_the_switch
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: real_artifact
    description: "Read the repository's real CI workflow files and default test invocation; assert none sets LEAFCUTTER_LIVE_DISPATCH, so the default and CI runs are the switched-off case the first scenario describes."
  - name: test_bo_3200f_2_ii_unrecognised_switch_value_fails_the_run_naming_it
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: boundary
    description: "LEAFCUTTER_LIVE_DISPATCH set to 'true' fails the run with a message naming the variable and the value; nothing is dispatched and nothing is reported skipped or passed."
  - name: test_bo_3200f_2_ii_dispatch_resolves_the_shipped_charter_and_registry_entry_at_dispatch_time
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: "With the transport's process launch recorded at its boundary (no reply is fabricated; the test ends at the invocation), assert the invocation addresses the agent through the repository's shipped definition and registry entry rather than injected charter text, carries no permission-skipping flag or allowed-tools list, and that editing the charter in a temporary copy of the repository between two dispatches changes what the second invocation uses."
  - name: test_bo_3200f_2_ii_declining_charter_fails_the_first_live_scenario_naming_the_decline
    target_dir: unit_tests/workflows/
    framework: unittest
    type: e2e
    angle: deployed
    surface_invoked: "BO-3200f-2-ii live-dispatch harness, switched on by LEAFCUTTER_LIVE_DISPATCH=1"
    description: "LIVE DISPATCH, THE DISCRIMINATOR. In a temporary clone of the repository, change the executor's charter so it declines every command, switch on, run the three live scenarios; assert BO-3200f-2's first live scenario is failed and its failure names the decline, with no change to the harness."
  - name: test_bo_3200f_2_ii_each_dispatch_failure_cause_is_a_named_failure_never_a_skip
    target_dir: unit_tests/workflows/
    framework: unittest
    type: e2e
    angle: failure
    surface_invoked: "BO-3200f-2-ii live-dispatch harness, switched on by LEAFCUTTER_LIVE_DISPATCH=1"
    description: "Switched on, produce each cause for real in turn -- credentials removed from the environment, the executor removed from a temporary registry copy, the transport pointed at an unreachable service, and settings under which the executor's shell command raises a permission request; assert each affected scenario is failed with its own cause, none is skipped, not run or passed, the run is failed, and the four causes are pairwise distinct."
  - name: test_bo_3200f_2_ii_launch_failure_is_not_scored_as_an_empty_reply
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: failure
    description: "Feed the harness's result classification the shared transport's launch-failure and parse-failure outcomes; assert each yields a named dispatch failure and never an empty reply handed to a scenario assertion (false-green M6)."
  - name: test_bo_3200f_2_ii_evidence_record_carries_every_field_for_every_scenario
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: "Drive the real evidence writer over a run with one passed, one failed and one not-run scenario into a temporary evidence directory; assert one new file whose scenarios each carry scenario, ac_id, verdict, failure_cause, agent, model, ran_at, charter content and digest, registry entry and digest, and reply, overall is failed, and an earlier record is not overwritten."
  - name: test_bo_3200f_2_ii_done_proof_reading_the_record_tells_passed_from_failed_and_not_run
    target_dir: unit_tests/workflows/
    framework: unittest
    type: unit
    angle: boundary
    description: "Given records in which the same scenario is passed, failed, and not run, the record reader a done-proof uses returns three different verdicts; a record whose charter digest differs from the shipped charter is reported out of date."
  - name: test_bo_3200f_2_ii_switched_on_run_that_cannot_write_evidence_fails
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: "With the evidence directory unwritable, a switched-on run is reported failed naming the evidence write, even when every scenario passed."
  - name: test_bo_3200f_2_ii_switched_on_live_run_writes_evidence_for_the_three_scenarios
    target_dir: unit_tests/workflows/
    framework: unittest
    type: e2e
    angle: deployed
    surface_invoked: "BO-3200f-2-ii live-dispatch harness, switched on by LEAFCUTTER_LIVE_DISPATCH=1"
    description: "LIVE DISPATCH. Switched on against the real registered executor, run the three live scenarios; assert each dispatch reached the real agent, each scenario's verdict follows its own reply, and one evidence record naming all three scenarios and the model that answered was written."
  - name: test_bo_3200f_2_ii_eval_runner_behaviour_is_unchanged_by_the_transport_extraction
    target_dir: unit_tests/evals/
    framework: unittest
    type: integration
    angle: seam
    description: "The existing eval runner imports the shared transport module and no private copy remains; its report shape, scoring and exit behaviour for a recorded run are identical before and after the extraction."
  - name: test_bo_3200f_2_ii_shared_transport_resolves_in_the_deployed_layout
    target_dir: unit_tests/evals/
    framework: unittest
    type: integration
    angle: deployed
    description: "Build into a temporary target directory and assert the deployed eval runner imports the shared transport module without ModuleNotFoundError."
  - name: test_bo_3200f_2_ii_no_live_dispatch_proof_kind_value_is_reintroduced
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: real_artifact
    description: "Scan the AC store schema, the test requirements schema and the evidence-record verdict and cause vocabularies; assert none carries 'live_dispatch' as a permitted value (BO-2900g-3)."
test_rationale: |
  The first scenario is proven where it matters -- the default and CI invocations as they really
  are -- because a harness that dispatches by default is only visible in the real CI files. The
  seam test on the invocation is the cheap, deterministic half of the second scenario: it stops at
  the process boundary and fabricates no reply, so it proves the harness addresses the registered
  agent without pretending to prove the agent's behaviour.
  The declining-charter test is the discriminator the BA wrote the third scenario for, and it runs
  in a temporary clone so the repository's own charter is never edited by a test.
  The failure-cause test induces each cause for real rather than mocking the transport, because
  the observed defect in the transport being reused is precisely a real launch failure read as an
  answer; the unit test on classification pins that the shared transport's failure outcomes cannot
  reach a scenario assertion as an empty reply.
  Evidence is tested for content, for no-overwrite and for its own write failure, because a live
  run that leaves nothing behind is indistinguishable from one that never ran.
  The transport extraction carries a regression and a deployed-layout test because reusing the
  runner's transport is the decision most likely to break the runner silently.
  Deliberately NOT covered: how often the executor passes across many runs. That is a reliability
  question, and a scored one; it is outside this record.
