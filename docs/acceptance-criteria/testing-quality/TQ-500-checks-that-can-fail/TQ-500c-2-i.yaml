notes: |
  THE CANONICAL REGRESSION FIXTURE FOR THIS TREE, and the reason the L0 exists. It is
  the only case in the corpus where a test that could not fail was caught, and it was
  caught by hand, after the work had merged, by someone who ran the alteration out of
  curiosity. Nothing in the pipeline would have found it.

  WHY THE LAST CLAUSE MATTERS MOST. Every other clause asserts that something is
  reported. A reading that reports every test as never objecting satisfies all of
  them. The flipped-cell variant is the control that makes this AC able to fail — and
  writing it is the same discipline the AC itself is about, applied to the AC.

  WHY THE FOURTH CLAUSE. Three of the four cells in the incident's last column are
  dashes: those tests were never exposed to the third alteration. A report that
  silently drops unexposed pairs would look complete while hiding the shape of the
  exposure, and a report that renders them as non-objections would mark three sound
  tests inert.

  BOUNDARY. Adds no behaviour of its own. It is satisfied only by a regression test
  over TQ-500c-1's record shape and TQ-500c-2's reading, and must not be closed by a
  change that special-cases this fixture.
