id: BO-400a-2-iv
components:
  - build_orchestration
title: "A completion decision reached with no phase required of the ticket never records it done"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given three tickets carried by one drive, none of which names any phase the drive
    is required to verify --
      the first carries no list of phases at all,
      the second carries an empty list,
      the third names phases of which every one is marked as not needed,
    And for none of the three was any phase dispatched, and none of the three carries
      any sign-off,
  When the drive takes each ticket's completion decision,
  Then none of the three is recorded as done, and each ticket's recorded lifecycle
    state is left exactly as the drive found it,
    And the drive reports each of the three as not completed,
    And the stated reason names that the ticket itself names no phase for the drive to
      verify, and points the operator at the ticket's own list of phases as the thing
      to correct -- not at re-running a phase, and not at supplying a sign-off, neither
      of which exists to act on,
    And a fourth ticket in the same drive, which does name phases and whose every named
      phase already carried a sign-off before the drive began, is still recorded done,
  So a required set with nothing in it reads as nothing was proved, never as everything
    passed.
depends_on:
  - BO-400a-2
