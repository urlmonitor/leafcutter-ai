notes: |
  QUESTION Q4 FOR THE GATE: the C6 spec has four statuses and none means "the step broke". This
  record maps it to refused-with-reason, because the alternative inside the spec (nothing_to_commit)
  is success-shaped. A fifth status "error" would match C2's runCommand vocabulary
  (ok | refused | error) and is the cleaner contract; if the user chooses it, only the status value
  in both Thens changes.
