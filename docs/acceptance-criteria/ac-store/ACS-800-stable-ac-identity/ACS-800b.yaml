criteria: |
  Parent, level, and order are recorded as facts you can read and change.

  Where a requirement sits — which parent it belongs to, whether it is a goal,
  feature, story or sub-task, and its position among its siblings — is captured in
  plain metadata fields rather than buried in its name, so the structure can be read
  directly and adjusted deliberately.
