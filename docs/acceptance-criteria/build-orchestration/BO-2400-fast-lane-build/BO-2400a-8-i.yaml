it_requirements:
  - >-
    Document only what is built. Write it after the depends_on records are done, and
    take agent ids, halt-kind names and field names (command-step-runner, declined_step,
    step_kinds) verbatim from the built lane and registry, never from these ACs' drafts.
  - >-
    The doc's frontmatter last_updated is refreshed and the doc stays within the
    doc-length and doc-compliance hooks. An over-long doc is split by section, not
    trimmed of required content.
  - >-
    Author through the write-c4-diagram skill, keeping the diagram's existing type,
    level and file. Participants and collaborators use the ids the built lane and
    registry use.
  - >-
    The registry is labelled as the source of permits_shell and step_kinds. The
    structural check (BO-2400f-5-ii) is drawn reading both the lane and the registry.
  - >-
    Before drawing status-checker out of the lane, confirm that BO-2400f-5-i removed
    every status-checker dispatch. If a non-command dispatch still uses it, keep it and
    record that in the sign-off, as the record's own note allows.
