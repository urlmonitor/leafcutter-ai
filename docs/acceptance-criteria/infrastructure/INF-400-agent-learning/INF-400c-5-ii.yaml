  - "The mapping is a read-time translation layer, not a rewrite of the retained events; replay against a corrected mapping is the reason the corpus is retained"
  - "This mapping must exist before the harvester is first pointed at the recovered corpus (see INF-400c-4-ii ordering)"
  - "Must handle errors gracefully per the project error handling policy"
