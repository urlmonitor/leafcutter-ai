criteria: |
  Real commits are recognised however they are written; mere mentions pass.

  Opening a pull request whose description quotes the commit rule, searching your
  code for the phrase, or writing about committing is never stopped. A command that
  really does record a commit is recognised however it is spelled, so a reworded
  command cannot slip past unnoticed.
