id: BP-1100e-1-vi
readiness: approved
priority: high
title: "Multi-ticket commits reconcile against the UNION of every staged done ticket's declared scope (no cross-ticket false flags)"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
created_by: "docs/acceptance-criteria/build_pipeline/BP-1100-phantom-done-prevention/BP-1100e.yaml"
criteria: |
  Given a single commit stages two done tickets — ticket A declaring
    files_touched: ["scripts/ta.py"] and ticket B declaring
    files_touched: ["scripts/tb.py"] — and both scripts/ta.py and scripts/tb.py
    are changed
  When the pre-done reconciliation runs over the commit
  Then it compares the changed source files against the UNION of all staged done
    tickets' declared scopes (files_touched UNION out_of_scope across A and B)
  And it does NOT flag scripts/ta.py or scripts/tb.py as undeclared merely because
    each file was declared by a different one of the two staged tickets
  And it still flags a source file changed in the commit that is declared by NONE of
    the staged done tickets
