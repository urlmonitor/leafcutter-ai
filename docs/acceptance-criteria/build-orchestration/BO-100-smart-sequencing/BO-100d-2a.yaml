it_requirements:
  - "On a successful probe the build-epic.js gate must fall through to the normal batch loop (Step 3/4 parallel dispatch) without altering sequencing — the gate is a pass/fail guard, not a sequencing change."
  - "The probe must be idempotent: the success path adds exactly one probe line to the absolute stream path printed by the telemetry location query and must not duplicate or rewrite prior content."
  - "Dual-surface parity (the KI-3 lesson): the success-path behavior in build-epic.js and in the build-feature.md prose gate must match — both proceed only on a genuine exit-0 probe via the same shared helper."
  - "Deployed/template parity (ADR-001 self-hosting): edit the build-epic.js package source (and any helper) and verify the deployed copy via the build.py round-trip — never edit only one side."
  - "The success path must write only to the absolute path the location query printed; it must create and append to no file inside the drive's worktree, including debugging/logs/agent_telemetry.jsonl."
