criteria: |
  Given a reader who wants to follow an approved split to its end,
  When they open the sequence diagram for running a split,
  Then it shows the scheduler starting one part at a time in dependency order, each part's own
    decision or research steps, and the person approving each decided part's choice,
  And it shows an earlier part's record reaching a later part as precedent that Jev judges,
  And it shows a part that cannot be settled, the parts waiting for it marked not run, and an
    independent part carrying on.
