id: GE-128a-2-i
title: "A bulk or mechanical change that raises a file's undeclared count gets no implicit exemption"
component: guardrail-engine
components:
  - commit_guardian
  - testing_quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Scenario 1 - a generated block of undeclared tests
  Given a tracked test file that, before the change, holds 3 undeclared test
    functions,
  And the test-declaration check is in error mode,
  And a change is staged that adds 30 undeclared test functions to that file in
    one mechanical edit (for example a generated block of near-identical tests),
  When the author performs an ordinary commit,
  Then the commit does not complete,
  And the outcome states the file held 3 undeclared tests before the change and
    holds 33 after it, exactly as a one-test increase would be reported.

  Scenario 2 - a merge whose result raises a file's count
  Given a tracked test file holding 3 undeclared test functions on the branch
    being merged into,
  And the test-declaration check is in error mode,
  And a merge is staged whose result leaves that file holding 5 undeclared test
    functions,
  When the author completes the merge commit,
  Then the merge commit does not complete,
  And the outcome names the file and states 3 before and 5 after.

  Scenario 3 - no exemption exists unless one is recorded
  Given no exemption for bulk, generated or merge changes has been explicitly
    configured for the test-declaration check,
  When either change above is evaluated,
  Then the size of the change, its mechanical nature, or its being a merge does
    not alter the verdict.
depends_on:
  - GE-128a-2
doc_links:
  - path: docs/acceptance-criteria/guardrail-engine/GE-128-tests-declare-what-they-prove/GE-128a.yaml
