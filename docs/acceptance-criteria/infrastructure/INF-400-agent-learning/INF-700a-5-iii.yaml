title: "Two units of work finishing at the same time never lose a learning between them; a duplicate across unmerged branches is the accepted failure"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a-5.yaml"
criteria: |
  Given one sink now serves a whole install rather than one working directory,
    and more than one unit of work runs in that install at a time — isolated
    working directories exist so that they can, and three at once is ordinary
    practice here,
  And each of them reaches its completion sequence independently, reads that
    one sink and the one claim store beside it, and publishes its writes on its
    own branch,
  And a record counts as routed only once its learning text is present in its
    destination file on the base branch (origin/main) — no run marks a record
    routed when it writes the learning, nor when its own commit carries it,
  When two units of work reach their routing step close enough together that
    both see the same record, and neither branch has merged yet,
  Then the learning is not lost between them: for each run that does not find
    the text on the base branch, the learning is written into the destination
    file on that run's own branch, so it reaches the merged tree if either
    branch merges, and the record stays eligible — unmarked — until its text is
    on the base branch,
  And if both branches merge, the destination file may hold the learning
    twice. That duplicate is the accepted failure, and it is bounded: at most
    one copy per branch that staged the record without finding its text on the
    base branch, and a reader of the destination file sees it,
  And once the learning's text is on the base branch, every later run finds it
    there, claims the record as routed instead of writing it, and that run's
    branch adds no further copy to the destination file,
  And two runs that share the claim store and both find the same record's text
    on the base branch do not both claim it: exactly one of them records the
    record as newly claimed and the other does not,
  And every degraded path fails toward the duplicate, never toward a mark: a
    run that cannot confirm the text is on the base branch — the base branch
    cannot be fetched or does not resolve — writes the learning again rather
    than marking the record routed, and a claim whose arbitration cannot be
    obtained proceeds unarbitrated rather than being skipped,
  And the two ways this fails are told apart, because they need different
    answers: the SAME LEARNING WRITTEN TWICE is visible to a reader and
    survivable; a LEARNING LOST WHILE MARKED AS ROUTED — a record marked routed
    before its text is on the base branch, whose branch then never merges — is
    seen by no reader and must not happen. A mechanism that trades a loss for a
    duplicate is acceptable; one that trades a duplicate for a loss is not,
  And the claim store is not corrupted, truncated or half-written by two units
    of work updating it at once — after both have finished it is readable and
    holds every claim either run made, not only the last writer's,
  And no unit of work waits on another's knowledge step to finish its own work:
    the outcome of the work, its failure count and the driver's exit status are
    the same as they are when it is the only unit of work running, and two
    units of work that both complete still both complete,
  And whatever arbitrates the claims is exercised rather than assumed — two
    runs whose claims of the same published record genuinely overlap produce
    one claim, and an implementation in which the arbitration is present but
    never reached produces two claims and is distinguishable from the first by
    that.
