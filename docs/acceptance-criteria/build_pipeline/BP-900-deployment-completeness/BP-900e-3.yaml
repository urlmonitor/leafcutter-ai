it_requirements:
  - "The candidate set is derived ENTIRELY from the union of (a) scripts resolved from registered hook entries and (b) script paths extracted from deployable templates. A script that appears in neither source is never a candidate — do not enumerate scripts/ and then subtract; build the promised set first."
  - "This is the critical no-false-positive class: legitimate package-dev-only tooling (build.py, epic_lock.py, and the source-only directories enumerated in BP-1000d-1: agent-health/, ci/, workflows/, worktree/, etc.) must never be flagged. A regression test must pin that at least build.py and epic_lock.py stay out of the verdict."
  - "Aligns with BP-1000d-1's stance that source-only tooling is legitimately exempt — but where BP-1000d-1 excludes by 'has no template counterpart', THIS check excludes by 'is not promised by registry or template reference'. The exclusion criteria differ; keep both stated distinctly."
