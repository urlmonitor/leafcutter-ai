title: "Compiled agents reflect current component data after rebuild"
component: ac-store
level: L2
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given docs/components.json has been updated with a new component entry
    (e.g. id: "supervisor_system" with agent_affinity: ["epic-supervisor"]),
  When build.py is executed,
  Then every compiled agent that uses {{components_table}} contains
    the new "supervisor_system" entry in its rendered output.
  And removing an entry from components.json and re-running build.py
    causes that entry to disappear from all compiled agent outputs.
  And the compiled output is deterministic -- running build.py twice
    with the same input produces byte-identical output.
depends_on: [ACS-300k-1]
