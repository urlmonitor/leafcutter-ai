estimated_complexity: XS
it_requirements:
- 'The finding is fixed by a type annotation: no inline ignore comment and no change to the type checker''s
  settings.'
- The ticket records the number of tests collected in unit_tests/ac_driven_dev/test_design_stage/ before
  and after the change.
declared_files:
- path: unit_tests/ac_driven_dev/test_design_stage/_design_stage_support.py
  state: existing
delivers_to: null
expects_from: null
test_required: true
test_intent:
- clause: the type checker reports no finding for that file
  needs_test: true
  reason: A missing or wrong annotation is exactly what the type checker run reports, so running it
    on the file is what catches a fix that did not land.
- clause: every test in unit_tests/ac_driven_dev/test_design_stage/ passes, with the same number of tests
    collected as before the change
  needs_test: true
  reason: An annotation written by changing the value instead of only typing it would alter the label
    table every test in that suite builds its replies from.
test_spec:
- name: test_design_stage_support_has_no_type_checker_finding
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: unit
  angle: reachability
  description: 'Entry point: the type checker CLI. pytest.importorskip("mypy"), then run [sys.executable,
    "-m", "mypy", "--ignore-missing-imports", "--explicit-package-bases", "--no-error-summary", "--cache-dir",
    <tmp_path>, unit_tests/ac_driven_dev/test_design_stage/_design_stage_support.py] as a subprocess from
    the repo root (the flags of the CI typecheck job, the project''s own settings). Asserts exit 0 and no
    output line naming the file, and in particular no [var-annotated] line. Red today: line 101 reports
    Need type annotation for "table" [var-annotated]. The new test file lives in unit_tests/ac_driven_dev/,
    not in test_design_stage/, so it does not change that suite''s collected count.'
  proves_clause: the type checker reports no finding for that file
  code_file: unit_tests/ac_driven_dev/test_design_stage/_design_stage_support.py
- name: test_design_stage_label_table_keeps_its_entries
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Imports _design_stage_support (no workflow run) and calls labels(prepass, holds) with
    sentinel objects: the result is a dict with exactly the 13 labels the technical route dispatches,
    design-prepass and approval-holds are the passed objects, stage-test-design-author equals designer_reply()
    and rule-check-test-design equals check_reply() when none are given, given designer and check replies
    are used as passed, and a keyword override replaces an existing label and adds a new one. Guards the
    value of the table the annotation types, which every test in test_design_stage/ builds its replies
    from; the suite itself, run unchanged, and the before/after collected counts the ticket records are
    the rest of the proof.'
  proves_clause: every test in unit_tests/ac_driven_dev/test_design_stage/ passes, with the same number
    of tests collected as before the change
  code_file: unit_tests/ac_driven_dev/test_design_stage/_design_stage_support.py
