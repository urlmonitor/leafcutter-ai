id: BO-2400g-4
components:
  - build_orchestration
  - review_system
title: "What the reading finds decides the run: serious findings stop it before anything is committed, minor ones ride along"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run whose change has been read and the reading produced findings,
  When the run decides whether to continue,
  Then a finding that reports the change is incorrect, unsafe, loses data, or does
    something none of the run's requirements asked for, stops the run before any
    commit for it exists,
  And a finding that reports a smell, a naming problem or a suggested improvement does
    not stop the run,
  And when the run is stopped this way there is no commit and no pull request for it,
    and none of its requirements is left recorded as being worked on,
  And the person is told which finding stopped the run, naming the requirement and the
    file it relates to.
depends_on: [BO-2400g, BO-2400g-2, TQ-200c-2]
