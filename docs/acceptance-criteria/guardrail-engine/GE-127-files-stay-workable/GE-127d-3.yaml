notes: |
  DECISION RECORDED (BrainCandy, 2026-10-16): no comment counts toward a file's length, in
  any style. `#`, `//`, `--` and `/* */` are stripped alike, docstrings stay uncounted as
  GE-127d-2 published, and stripping is lexically correct (a per-language tokenizer, not a
  regex). [SUPERSEDED 2026-10-21, see decision (2) below: blank lines no longer count
  anywhere.] Originally: blank lines keep today's treatment, so blank lines outside comments
  stay counted.

  WHY AN L2 UNDER GE-127d AND NOT A NEW L1. GE-127 holds 7 of 7 L1s with no
  child_limit_override, so no eighth L1 is possible without a split. The subject is
  GE-127d's own promise — the number you are quoted is one you can reproduce and that a
  formatting choice cannot move — so GE-127d is the right parent on the merits. GE-127d had
  2 of 5 L2s; this run takes it to 5 of 5 (d-3, d-4, d-5). GE-127d was work_status done and
  is reopened to todo in the same commit, with an amended_by entry, so the ACD-400a
  falsely-done-composite shape is not staged.

  TWO FURTHER DECISIONS:
    (1) A STANDALONE STRING IS INERT LIKE A COMMENT — BRAINCANDY 2026-10-20, SUPERSEDING
        THE 2026-10-16 "DOCSTRING POSITION ONLY" CONFIRMATION. A Python string literal that
        is an expression statement on its own — not assigned, passed, returned or otherwise
        used — is uncounted wherever it stands: docstrings AND bare strings, including the
        trailing `"""DECISION HISTORY ..."""` block about 250 Python files end in. A string
        that is assigned, passed as an argument, returned, or part of any larger expression
        (embedded SQL, prompts, templates) is code and counts. Trigger: the IT PO measured
        that docstring-position-only would push 6 files over their limit purely through a
        trailing DECISION HISTORY string and charge every doc-enforcer history entry as
        added lines in the two-for-one repayment. A standalone f-string counts as code,
        because evaluating it runs the expressions in its replacement fields (not inert) —
        proposed by the BA and CONFIRMED by BrainCandy's coordinator 2026-10-20; a
        standalone bytes or raw string is inert. The measure still decides by syntactic role only, never by the string's
        name or content.
        Superseded wording kept for the record: (2026-10-16) "only a string literal that is
        the first statement of a module, class or function is uncounted; any other
        triple-quoted string, assigned or bare, counts as code."
    (2) BLANK LINES NEVER COUNT, ANYWHERE — BRAINCANDY 2026-10-21, SUPERSEDING THE
        2026-10-16 "BLANK LINES OUTSIDE COMMENTS STAY COUNTED" AND THIS RECORD'S EARLIER
        "accept a one-line-per-gap difference". A physical line counts only when it holds a
        token that is code (not part of a comment, not part of a standalone Python string).
        Trigger: pr-reviewer found a formatting-only route — `// a / (blank) / // b` measured
        1 while the same text as one `/* */` block or docstring with a blank line inside
        measured 0, so rewriting blank-separated comment paragraphs as one block lowered the
        measured length with no raw growth (GE-127d-4's backstop stays silent); and squeezing
        out blank lines was the other formatting-only route. BrainCandy's stated goal: agents
        must find no formatting-only way to lower the number. BA reading, flagged for
        confirmation: "anywhere" includes a whitespace-only physical line inside a USED
        multi-line string value (e.g. an embedded SQL template). That contradicts the IT PO's
        line-rule it_requirement ("Every physical line spanned by a USED multi-line string
        value ... counts, blank or not"), which is left for the IT PO to reconcile.

  KNOWN REMAINING FORMATTING ROUTE — OUT OF SCOPE HERE, FOR A FUTURE AC (recorded 2026-10-21).
  Joining code statements onto fewer physical lines (`a(); b();` on one line, `x = 1; y = 2`
  in Python, chained shell commands with `;`) lowers both the measured and the raw line
  count, so neither this measure nor GE-127d-4's backstop (which needs raw to rise) catches
  it. Closing it needs a measure that counts statements or tokens rather than lines, or a
  separate rule against statement-joining; neither is specified here.

  LINES THAT ARE NOT COMMENTS EVEN THOUGH THEY START WITH A MARKER: GE-127d-3-i. A shebang
  and a Python encoding line ARE `#` comments lexically and are uncounted.
