notes: |
  RELOCATED FROM BO-3200f-2-ii SCENARIO 4 (user decision, BrainCandy, 2026-09-17). The
  first scenario is carried over with "each live scenario" generalised to "each case",
  "the executor"/"the agent dispatched" to "the agent asked", and "charter" to
  "instructions". Nothing was dropped.

  WHAT WAS ADDED, ALL FROM BO-3200f-2-ii's IT PO it_requirements, MOVED INTO CRITERIA
  BECAUSE EACH IS AN OBSERVABLE OUTCOME A DONE-PROOF DEPENDS ON:
    - kept for failed runs too, including runs where no request could be made;
    - never overwritten;
    - a run whose evidence cannot be kept is failed, even when every case passed;
    - a record whose instructions or registry entry digest differs from the files shipped
      now is visibly out of date.
  The location (a tracked directory, docs/testing/live-dispatch-evidence/), the file name
  (run start time and short commit SHA) and the JSON shape stay IT PO decisions.

  WHY A SEPARATE L2 FROM TQ-600a-1. Asking the agent and keeping the evidence fail
  independently: a mechanism can ask correctly and leave nothing behind, and a live run
  that leaves nothing behind cannot be told from one that never ran. The two are also built
  by different code (the request versus the writer and reader).

  declares_side_effect: true -- derived from the first scenario's Then ("an evidence
  record is written"), and honest: the record is a durable artifact a done-proof cites.

  BOUNDARY. Whether stale evidence loses its standing over time is TQ-400's, not decided
  here. No evidence field value named live_dispatch (BO-2900g-3).
