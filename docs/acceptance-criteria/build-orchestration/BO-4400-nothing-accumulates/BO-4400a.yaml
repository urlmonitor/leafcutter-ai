criteria: |
  Work handed over for review means the workspace is gone -- no wrap-up step needed.

  Whichever route did the work, its workspace is cleared through the one shared door
  the moment the work has safely reached the team, at the latest right after it is
  put up for review; a run that stopped or failed keeps its work and is listed so it
  can be reclaimed once nothing unsent remains, and the older ways of clearing are gone.
