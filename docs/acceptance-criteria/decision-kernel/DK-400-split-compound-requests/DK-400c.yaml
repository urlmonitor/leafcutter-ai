notes: |
  FLOW NODES: split-propose (step), split-dropped (branch).

  SETTLED: the host (Claude Code) proposes, through the new host operation
  host.decompose_goal (working name, from TICKET-20261002-KernelDecomposeMultiPartGoal).
  A proposal whose quote is not a verbatim span of the subject is dropped
  before the gate and shown read-only with its reason. It can never be approved
  or run, though the person can add its question back by editing (DK-400d).
  Each part names the parts it depends on, with no cycles.

  ADDED BY THE PO (flow-author open point a): "not forced into a split: you are
  told so plainly". This is the customer stance. The bounds below were
  DECIDED on 2026-10-05: the PO recommendation is the default the BA uses (see
  DK-400 "DECISIONS AT THE PO GATE", Q2, which wins over this note).
    - Fewer than 2 bounded parts (flow branch split-too-few-parts): the
      request was one question after all, and no split gate is shown. How it
      continues:
      - bundled_accepted or mid-run: it goes ahead as one;
      - ambiguous: it falls back to today's clarification question, and the
        run is not blocked (final-gate decision, DK-400 FINAL GATE);
      - jev_none: it is recorded as a capability gap, and the run ends
        blocked.
    - More than 5 parts (flow branch split-too-many-parts; mock not_covered[]):
      the gate offers the first five parts. The rest are listed read-only as
      not covered, with their quotes, and can be asked again as a request of
      their own. Never drop the rest silently. Grouping the request into at
      most five parts is not one of the chosen defaults.
    - Fewer than 2 parts left AFTER dropping (for example 3 proposed, 2
      dropped): the same rule as fewer than 2 applies. split-too-few-parts
      counts after unquoted parts are set aside.
  The flow and the mock data cover these cases since v5. One exception: v5
  still ends an ambiguous too-small split blocked, unlike the final-gate rule
  (see the follow-up in DK-400d). The IT PO defaults approved at the final gate
  also apply here: at most 5 parts per run, output schema
  leafcutter.decomposition.v1, and ADR-067 written by adr-author before
  DK-400c-1 is built.

  DOCS: host.decompose_goal is a new host operation (component-diagram). The
  kernel, the host, the person and the child work all take part in a split
  (sequence-diagram).
