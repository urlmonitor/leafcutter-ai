work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Tests prove the registry validator and its injection flow reject bad wiring
  instead of passing it through.

  The tools that load and validate the agent registry, confirm that spawn
  relationships point both ways, and inject registry data into templates are
  covered by tests. If a change lets an invalid registry, a one-way spawn link,
  or a broken injection slip past, a test fails immediately.
