id: BO-400c-5
components:
  - build_orchestration
  - commit_guardian
title: "Parity guard blocks a status: done ticket that still has a needed or failed phase, wherever the file lives"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a staged ticket whose YAML frontmatter reads `status: done`
    and whose `agents:` map still lists a phase as `needed` or `failed`
    (e.g. `pull-request: needed`),
    and whose path contains no `done/` segment
    (tickets are no longer moved into done/ folders — frontmatter `status:` is the lifecycle signal),
  When the pre-commit hook check_ticket_signoff_parity.py runs without `--enforce`,
  Then it reports a violation naming the offending agent and its status
  And it exits with code 1, blocking the commit
  And the bug symptom ("a status: done ticket with pull-request: needed is committed with only a warning") must not occur.

  Given the same `agents:` map on a ticket whose frontmatter status is not `done`
    (e.g. `status: todo`),
  When the hook runs without `--enforce`,
  Then any violation it finds is reported as a warning and the hook exits 0 (warn-only is unchanged).

  Given a `status: done` ticket whose every agent is `signed_off` or `not_needed`,
  When the hook runs,
  Then it exits 0.

  Given a `status: done` ticket outside any `done/` path whose only violations come from
    other parity checks (e.g. a `## Sign-offs` gap or a missing cross_layer_seam_answer),
  When the hook runs without `--enforce`,
  Then those violations are printed as warnings and the hook exits 0
    (only the needed/failed-phase rule blocks a done ticket).

  And a ticket under a legacy `done/` path still blocks on every violation, and `--enforce` still enforces every ticket.
  And a missing, non-string, or malformed `status:` never crashes the hook — it is treated as not done.
