estimated_complexity: S
it_requirements:
  - "Run the REAL gate, in the deployed layout, by the same entry point the commit-time and build-time stages use. A bespoke audit script written for this verification would prove that a script can count correctly, not that the guard that will hold the line afterwards works — and the guard is the artifact under test."
  - "The reintroduce-and-re-run pair must be executed as one test, in all four namespaces, with the reintroduced collision REMOVED afterwards. It is the only clause here that a broken implementation cannot satisfy, and it is the mutation check for the whole tree. Running it in one namespace leaves the other three unproven, which is the same gap as a pass that inspects nothing."
  - "The inspected counts must be asserted as EQUAL to independently-computed artifact counts for each namespace, not merely as non-zero. A non-zero assertion passes on a pass that reads one file per namespace, and the whole point of the count is to detect a partial walk."
  - "'No configuration exists anywhere that would excuse a contested number' must be checked against the actual configuration surfaces, enumerated: the enrolment/identifier rule data GE-122b-1 introduces, the `hooks_manifest.hooks` entry (an `enabled: false` flag there silently removes a hook from `.pre-commit-config.yaml` at build time), the ci.yml job's own conditions, and any skip or exemption argument on the gate's command line. An `enabled: false` manifest entry is the most plausible way this clause is violated without anyone writing an allowlist."
  - "The unchanged-artifacts clause must be asserted by NAME AND LOCATION over the eleven unnumbered diagrams, not by count. A count is preserved by renaming one of them, which is exactly the tidy-up the clause exists to fail."
  - "This AC is the tree's exit gate and must run AFTER GE-122e-1 and GE-122e-2, and BEFORE GE-122d-2 makes the CI gate required — that ordering is what stops a required gate from failing every merge on pre-existing drift."
  - "The verification must be re-run at merge time, not only when it is written. The collection moves continuously; a pass recorded three weeks before the merge is evidence about a different collection."
test_spec:
  - name: test_repaired_collection_passes_all_four_namespaces
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "The real gate, invoked through its production entry point over the repaired collection with no exemption arguments, returns a passing outcome for all four namespaces."
  - name: test_inspected_counts_equal_actual_artifact_counts
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "For each namespace the reported inspected count equals an independently-computed count of the artifacts present — asserted as equality, since a non-zero assertion passes on a pass that read one file."
  - name: test_reintroduced_collision_fails_in_every_namespace
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    description: "A contested number reintroduced into each of the four namespaces in turn makes the same pass over the same collection fail and name it; each reintroduction is removed afterwards. This is the mutation check the coverage note calls load-bearing."
  - name: test_no_exemption_configuration_exists_on_any_surface
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "No allowlist, known-bad list, skip argument or enabled:false manifest flag exists on any of the enumerated configuration surfaces that would cause a contested number to be reported as acceptable."
  - name: test_unnumbered_artifacts_unchanged_by_name_and_location
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "All eleven unnumbered artifacts are present at their original names and paths — asserted by name and location, not by count, so renaming one to tidy it up fails rather than passes."
test_rationale: |
  Only the reintroduce-and-re-run pair distinguishes a clean collection from a dead check, so it
  is written across all four namespaces rather than one: a mutation check that covers a quarter
  of the subject leaves the same blind spot it exists to close. The counts are asserted as
  equalities because non-zero is satisfied by a pass that reads a single file per namespace. The
  no-exemption descriptor enumerates real surfaces rather than searching for the word
  "allowlist", because the most plausible way that clause gets violated in this repository is an
  `enabled: false` flag in the hooks manifest, which removes the hook from the generated
  pre-commit config at build time and looks like nothing at all. The unchanged-artifacts
  descriptor asserts names and locations because a count survives a rename, and a rename is
  precisely the well-meant tidy-up the user's binding scope trim forbids.
