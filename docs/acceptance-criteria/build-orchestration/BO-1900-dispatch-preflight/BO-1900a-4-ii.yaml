notes: |
  A REGRESSION INTRODUCED BY REMEDIATION, and the second route into the same vacuous
  write BO-400a-2-iv forbids. The hardening batch made the ticket completion exit
  write-capable; this is the input path that reaches that exit with nothing to verify.
  Neither defect is dangerous alone -- an unusable plan that wrote nothing was merely a
  silently skipped ticket, and a write-capable exit reached with a real phase list is
  correct. Together they turn a dead planner into a done record.

  WHAT THE FAILURE LOOKS LIKE FROM OUTSIDE. Indistinguishable from success. The
  planning step fails, the drive substitutes a blank record for the missing reply and a
  blank list for the missing list, concludes the ticket needs no phases, takes the
  no-phases exit, arrives at a completion decision with an empty required set, and
  records the ticket done. No error is raised at any step, because every step did
  exactly what it was written to do. An infrastructure failure has been converted into
  a completion claim by two defaults that each looked like defensive programming.

  WHY THE PARTIAL REPLY IS THE DANGEROUS SHAPE. The planner's reply schema does not
  require the ordered list, so a reply that omits it is legal and passes validation.
  That is not a hypothetical: it is what a truncated, timed-out or degraded agent reply
  looks like. An implementer who writes the guard against a reply that DECLARES failure
  will take the usable branch on this shape and believe the case is covered. This is
  the identical mistake already caught and corrected one level up, in the epic-level
  re-check amended under BO-300a-5-i -- the same wrong polarity, in the same diff
  family, four weeks apart. It is recorded here explicitly so the correction is made
  once rather than discovered a third time.

  WHY IT SITS UNDER BO-1900a-4. The L1 promise is that nothing is dispatched against a
  target that has not been proven fit, and the parent L2 establishes the shape for it:
  a question the drive cannot answer is reported as unanswered, never filled in with a
  plausible substitute. An empty phase list standing in for a reply that never arrived
  is that substitute, with the ticket's entire scope of work as the value being
  invented.
