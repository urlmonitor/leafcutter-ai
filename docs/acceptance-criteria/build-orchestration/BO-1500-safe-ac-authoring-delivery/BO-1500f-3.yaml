assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    workspace_ownership:
      type: object
      description: "{ owner_run_id: '<run that holds the workspace>', owner_started_at: '<timestamp>', owner_state: active | ended | unknown, unfinished_items: ['<criterion id>', ...] }. Recorded with the workspace at the moment it is claimed and read back by any later run that resolves the same workspace. owner_state must be determined from durable evidence, not assumed."
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "BA-supplied schema minimum — the IT PO refines this block during technical enrichment."
    - "This narrows BO-1500a-1-i, which is already implemented as reuse-on-hit: reuse must now be conditional on same-run ownership. An unconditional adopt-if-present path is the defect being fixed and must be removed, not guarded — flag the amendment on BO-1500a-1-i when this lands. BO-1500a-1-i stays under BO-1500a and was not renamed by the 2026-08-14 split, so this amendment now spans the a/f boundary."
    - "unknown ownership must fall to the report-and-halt branch, not the continue branch; an ownership check that fails open re-creates the incident."
    - "Cover all four resolutions (same run, other run active, other run ended, no evidence) with behavioral tests that drive the real resolution path."
delivers_to:
  agent: python-coder
  contract: "A resolution of an existing workspace into exactly one of: continue as its owner, refuse and name the active owner, report as recoverable and halt"
expects_from:
  ac_id: BO-1500f-2
  contract: "The per-run identity that ownership evidence is written from and compared against"
