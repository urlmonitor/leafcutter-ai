id: GE-127e-3-ii
title: "Every tool named by an instruction a refusal sends the author to actually exists"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a refusal from the file-size gate names a command for the author to run,
  And that command's own instructions invoke one or more tools by path,
  When each of those paths is resolved against the repository the author is
    working in,
  Then every one of them exists,
  And given an instruction is introduced that invokes a tool at a path which
    does not exist,
  When the same resolution is performed,
  Then it is reported, naming the command, the instruction, and the path that
    did not resolve — so that the absence is a stated finding rather than
    something the author discovers by running it.
depends_on:
