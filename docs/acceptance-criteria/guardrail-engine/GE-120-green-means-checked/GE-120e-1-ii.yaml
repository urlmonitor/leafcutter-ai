id: GE-120e-1-ii
title: "A path is only an addition when the change actually introduced it, so editing an existing root file is not read as adding one"
component: guardrail-engine
components:
  - commit_guardian
  - git_vcs_operations
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a repository whose root already tracks a file that is not named in the root-file
    allowlist — requirements-dev.txt, this project's dependency file,
  And an author whose staged change edits the contents of that file and introduces no new
    path at the root,
  When the root-file placement check runs on that commit,
  Then the check decides what the change did from the recorded kind of each staged entry and
    not from the entry's mere presence in the change set, so an edit to a path the root
    already held counts as no addition, the check raises no objection, and the commit
    proceeds,
  And a genuinely new, non-allowlisted path introduced at the root in the same commit shape
    is still objected to and the commit is still stopped, so the objection cannot be cleared
    by relaxing what the check refuses,
  And the bug symptom ("A commit that MODIFIES an already-tracked root file is refused as though it were adding a new root file. Concretely, staging a one-line addition to requirements-dev.txt (adding pytest-xdist>=3.5) is blocked by check-root-files. requirements-dev.txt is already tracked at the repo root and is this project's actual dependency file (the repo does not use poetry), and it is absent from root_files.allowed_files in commit_guardian.json, so the file is currently un-editable by anyone. Generalised: any pre-existing, non-allowlisted root file can never be modified again.") must not occur.

  Coverage note: cover this by running the check as a process against a real repository
  standing in each state and asserting the exit status and the text it wrote for the reader.
  Reading the source for the absence of a status letter does not cover it (CLAUDE.md, "Gate /
  Workflow ACs — Verify Behaviorally, Not by Grep"), and the control case is load-bearing: a
  check that refuses nothing at all satisfies the first clause and defeats the guard.
