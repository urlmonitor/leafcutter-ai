assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    hook_trigger_reachability_nothing_to_match:
      type: object
      description: "Third reachability outcome, alongside reachable and unreachable: a registered gate whose activation condition selects files by kind and which the project currently holds none of. Distinguished from unreachable by whether any checkout of the project could ever produce a matching path, and reported by name with the kind left unmatched, so a gate reclassified this way is visible in the run's summary rather than silently omitted from the unreachable list."
  reference_file_path: "templates/scripts/commit_guardian/commit_guardian.json"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "PARENT SCOPE IS THE DEFECT. BP-100k-4's criteria say 'no path THIS REPOSITORY is able to stage' — written from the package repository's own perspective, where Python is always present. The gate inherited that framing and applies it to whatever project it runs in, so in an adopter that tracks no Python the two registered conditions selecting Python files are classified exactly like a condition naming a directory that cannot exist. This constraint supplies the missing distinction; it does not overturn the parent."
    - "The line to draw is COULD-EVER versus DOES-NOW. A condition selecting files by kind is reachable while any checkout of the project could produce such a file. A condition naming a location absent from every layout, or naming only ignored locations, could never be activated by any checkout and stays a blocking finding."
    - "Do NOT fix this by exempting the two conditions that select Python files, and do NOT fix it by narrowing the gate to run only when the project holds Python. Both leave the class intact and both re-break the moment another kind-based condition is registered."
    - "Do NOT fix it by making the gate advisory or by loosening it to always pass when anything is unclear. BP-100k-4-i already forbids the fail-open shape, and an inability to determine reachability must remain a named failure."
    - "The classification must be reported, not merely acted on. A gate silently reclassified as 'nothing to match' is indistinguishable from a gate that was never evaluated — the failure this whole L1 exists to prevent."
    - "Verify against a BUILT CONSUMER LAYOUT, not only the package's own tree. The defect is invisible in this repository by construction, because this repository holds Python; a source-tree-only verification cannot observe it."
    - "Must follow the repo error-handling policy: specific-exception try/except around file, JSON and subprocess I/O, log at WARNING or higher or re-raise; no bare or blind excepts."
test_spec:
  - name: test_kind_based_condition_matching_nothing_yet_does_not_block_the_commit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "In a built consumer project holding no file of the selected kind, the reachability check executed as a process does not name the kind-based gate as unreachable and terminates with exit status zero."
  - name: test_structurally_unreachable_condition_still_blocks_in_the_same_run
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A registry holding both a kind-based condition matching nothing yet and a condition naming a location no checkout can produce is evaluated in one executed run: the second is named and the run exits non-zero, establishing the narrowed verdict still fails on genuine unreachability."
  - name: test_a_first_commit_succeeds_in_a_project_holding_no_watched_file_kind
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A first commit attempted in a built consumer install that tracks no file of any kind any registered condition selects completes successfully — the adopter-facing symptom of KI-CG-20260831-0713, asserted end to end rather than at the gate's function boundary."
  - name: test_the_verdict_does_not_change_with_the_file_census
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The same registry evaluated in a project holding files of the selected kind and in one holding none yields the same reachability verdict for that gate, proving the classification is drawn from what a checkout could produce rather than from what is present at run time."
  - name: test_the_nothing_to_match_classification_is_stated_in_the_output
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The executed run names the gates it classified as having nothing to match, so the reclassification is auditable in the run's own summary and cannot be confused with a gate that was never evaluated."
  - name: test_removing_the_distinction_restores_the_blocker
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "With the could-ever/does-now distinction removed from the deployed check, the no-file-kind consumer commit fails again — the mutation proof that this constraint's assertions are capable of failing rather than passing on any implementation."
test_rationale: "Every assertion here has to run in a project shaped unlike this one, which is precisely why the defect survived a done parent, a done sibling edge case, and a green suite. BP-100k-4-i already pins the zero-unreachable case against 'the repository's real gate registry in a fresh checkout' — and in this repository that case is genuinely satisfied, because Python is present and the kind-based conditions match. No test executed against this tree can observe the blocker. Per CLAUDE.md ('Gate / Workflow ACs — Verify Behaviorally, Not by Grep') a source-reading test is forbidden and would be rejected here for a second reason as well: the correct and the broken implementations are source-shaped alike, differing only in a classification made at run time. The descriptors therefore execute the check as a process inside a built consumer layout, and the final descriptor removes the distinction and requires the blocker to return — without it, an implementation that simply never reports anything would satisfy every other assertion."
delivers_to: null
