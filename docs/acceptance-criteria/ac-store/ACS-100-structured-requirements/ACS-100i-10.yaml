assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    no_producer_report:
      type: object
      description: "The queryable answer this criterion adds: {records_examined: int, no_producer_total: int, by_spelling: {absent: int, null: int}, leaves: {total: int, by_change_target: object}, records: array of {id, path, level, change_target, is_leaf}}. records_examined is always present and is reported alongside no_producer_total, so a zero-examined run is never readable as 'no records without a producer'. by_spelling is diagnostic only — both spellings are counted into the single no_producer_total."
  reference_file_path: "scripts/ac_store/scan_ac_store.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python scripts/ac_store/validate_ac_schema.py docs/acceptance-criteria"
  constraints:
    - "ONE PREDICATE FOR BOTH SPELLINGS. The query must classify on `data.get('assigned_agent') is None`, which collapses absent and present-and-null into one state. Do NOT branch on `'assigned_agent' in data` — that is exactly the distinction the criterion forbids, and it is the same dict.get subtlety that produced the defect ACS-100i-10-i fixes. Report the absent/null split as a diagnostic sub-count only, never as two conditions."
    - "REPORT THE EXAMINED COUNT ALONGSIDE THE ANSWER, ALWAYS. A run that resolved to zero records must report zero-examined, not 'no records without a producer'. This is the same false-green shape as KI-ACS-001, where the store-wide validator reported success from a run that checked nothing for eight days while CLAUDE.md prescribed exactly that invocation."
    - "change_target IS SOMETIMES A LIST, AND A SCALAR COMPARISON WILL UNDER-COUNT. Measured on this branch 2026-08-25 among the no-producer leaves, change_target takes at least nine shapes, six of them lists — including ['code','schema'], ['prompt'], ['schema','prompt'], ['code','prompt'], ['code','config','docs'], ['code','infrastructure'] and ['pipeline','prompt'] — alongside the scalar spellings. The prompt/docs breakdown must treat a list value as declaring EACH of its members: comparing change_target to the string 'prompt' misses the four records spelling it as a one-element list, which is most of the population this criterion is trying to surface."
    - "THE python-coder FALLBACK STAYS. Do not remove it, do not turn it into a refusal, do not make it conditional on change_target. Roughly 748 records rely on it (measured this branch: 511 absent + 237 null of 3,385 records). This criterion adds visibility only. Replacing the default is a future criterion and is only safe once this population has been driven down."
    - "THE 'DEFAULTED' STATEMENT MUST LAND ON THE GENERATED TICKET, not only in a log line or a validation report. generate_ticket_from_ac.py line 3046 already emits a WARN reading 'assigned_agent absent — generator defaults to python-coder', but that goes to the validation report, fires only for the ABSENT spelling, and is invisible on the artifact build-feature.js actually reads. The generated ticket must itself say the producer was defaulted rather than declared."
    - "STATE THE LEAF PREDICATE IN CODE AND RE-MEASURE; DO NOT PIN THE CRITERION'S NUMBERS. Using 'level in (L2, L3) and covered_by empty', this branch yields 74 no-producer leaves — 2 spelling change_target as the scalar 'prompt' plus 4 spelling it as a one-element list, and 8 spelling 'docs' — against the criterion's 93 / 4 / 8. The gap is a leaf-definition difference, not a data change. Adopt the scanner's own existing leaf predicate, report which predicate produced the number, and re-measure at the implementing commit rather than hard-coding either set; a test that fails for the wrong reason gets deleted."
    - "The store-wide totals in the criterion predate the six records of this AC set. Measured 2026-08-25 on this branch: 3,385 records, 748 with no producer (511 absent + 237 null). Re-measure at the implementing commit and follow the ACS-100i-7 precedent — run the query over the real docs/acceptance-criteria/ tree and assert the re-measured totals, paired with a fixture-store test whose numbers CAN be pinned."
    - "Reading the store is external I/O: wrap file reads in try/except (OSError, yaml.YAMLError) and log at WARNING. A record that fails to parse must be reported, not silently dropped from the denominator — a shrinking denominator is how this report would lie."
delivers_to:
  agent: python-coder
  contract: "A no-producer report keyed on `assigned_agent is None`, carrying records_examined alongside no_producer_total, a leaf-restricted breakdown by change_target that handles list-valued change_target, and the per-record list. ACS-100i-10-i consumes the same single meaning of 'no producer declared' and makes generate_ticket_from_ac.py agree with it at all three fallback sites."
