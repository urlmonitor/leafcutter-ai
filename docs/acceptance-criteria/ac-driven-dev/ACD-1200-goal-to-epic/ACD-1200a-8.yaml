it_requirements:
  - "Master_Plan.md must satisfy /build-feature's resolution rule — its presence is the gate that determines whether a folder is treated as a driveable epic"
  - "Must be idempotent — re-running goal_to_epic on the same input must produce an identical Master_Plan.md without corrupting existing content"
  - "Must handle file-system I/O errors gracefully per the project error handling policy"
  - "The sub-ticket list in Master_Plan.md must be parseable by ticket-supervisor's batching algorithm (one filename per line with depends_on metadata)"
