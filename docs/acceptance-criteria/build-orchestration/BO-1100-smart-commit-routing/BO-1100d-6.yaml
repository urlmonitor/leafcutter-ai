work_status: todo
criteria: |
  Given the routing config contains an entry for "tickets" with path_pattern "tickets/**/*.md",
  And the staged files are:
    - tickets/00_inbox/TICKET-050.md
    - tickets/00_inbox/TICKET-051.md
  And the classifier assigns both files to the "tickets" group (a known pattern match),
  When the learner evaluates whether to record an observation,
  Then the learner does NOT record any observation to the shape-tracking store,
  And the learner does NOT propose a new routing rule,
  And the shape-tracking store is unchanged after this invocation.

  Given the routing config contains an entry for "implementation" with path_pattern "scripts/**",
  And the staged files include a mix:
    - scripts/new_feature.py (matched by "implementation")
    - docs/design/rationale.md (unmatched by any entry)
  When the learner evaluates whether to record an observation,
  Then the learner records an observation ONLY for the unmatched shape
    (directory pattern "docs/design/**", extensions [".md"]),
  And the learner does NOT record a duplicate observation for the "scripts/**" shape
    that is already covered by the "implementation" routing entry.
