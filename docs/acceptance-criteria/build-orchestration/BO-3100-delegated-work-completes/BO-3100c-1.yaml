id: BO-3100c-1
title: "Each dispatched step's result reaches the layer that dispatched it and decides what runs next"
component: build-orchestration
components:
  - build_orchestration
  - supervisor_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a build of three steps, where the third depends on the results of the first two,
    And each of the first two produces a value that identifies which step produced it,
  When the build is driven end to end,
  Then the layer that dispatched the first two holds both of their produced values before it
    dispatches the third,
    And the third is dispatched carrying both values.

  Given a build in which the first step fails,
  When the build is driven,
  Then the layer that dispatched it holds the failure before deciding what happens next, and
    the step that depended on it is not dispatched.

  Given any step in the build,
  When it is dispatched,
  Then what the dispatching layer receives is that step's result, not an acknowledgement that
    the step has been started.
