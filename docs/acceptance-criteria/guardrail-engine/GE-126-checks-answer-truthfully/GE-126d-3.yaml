  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NOW SET AND CROSSES AN AGENT BOUNDARY. This is the record both
  documentation surfaces in the branch are downstream of: GE-126d-4 and GE-126d-5 must
  RENDER their leg lists from this declaration, and their own criteria forbid restating it
  in prose. Without this record they have nothing to render from and would each grow a
  copy - which is the defect.

  SIZED L, AND IT IS THE LARGEST RECORD IN THE BRANCH. Three surfaces move together: a new
  declaration, a parity check that reads it instead of its own list, and a skill body that
  renders from it instead of enumerating in prose. The rendering mechanism for the skill
  body is the part with no precedent in this branch and is where the estimate is soft.

  A SPLIT WAS CONSIDERED AND NOT TAKEN. The skill-body surface
  (templates/skills/create-hook/SKILL.md) would ordinarily suggest llm-expert alongside
  python-coder. Two reasons against: GE-126d is already at the five-L2 cap so no sibling
  can be created, and the SKILL.md change here is a render marker rather than authored
  instruction text - the authored prose change is GE-126d-4's. Recorded as a caveat at the
  IT PO gate rather than resolved silently.

  THE DEPLOY OBLIGATION IS THE ONE MOST LIKELY TO BE MISSED AND THE MOST DAMAGING. A
  declaration that is not deployed leaves the deployed parity check with an empty leg list,
  and a parity check measuring against zero legs reports every check as complete. That is
  this tree's own defect, delivered by the fix. The fifth test descriptor exists for it.

  PACKAGE SURFACE — CONSIDERED AND NOT DECLARED. The four registries the
  check-package-surface-declaration hook watches are agent_registry.json,
  skill_registry.json, paths.json and commit_guardian.json. A new leg declaration is none
  of them, and no record in this branch adds a real entry to any of them - the fixture
  checks live in isolated trees. package_surface is therefore left unset. If the
  implementation lands the declaration INSIDE commit_guardian.json rather than beside it,
  that verdict changes and the AC must be amended before it is built.

  AGENT — python-coder.

