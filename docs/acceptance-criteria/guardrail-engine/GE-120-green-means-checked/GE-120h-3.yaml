    type: integration
    angle: seam
    description: "After the five entries are added, build_precommit produces a valid .pre-commit-config.yaml and check_manifest_parity reports zero violations."
test_rationale: >-
  Every arm is about a check RUNNING during a commit, so every test drives the
  deployed commit path. A test that asserts five entries appear in
  hooks_manifest.hooks is green on a registration that is unreachable, misstaged,
  filtered to nothing, or pointing at a script the deployed tree does not carry —
  and this repository has shipped all four of those. The refusal test is the one
  that cannot be faked: three of the five are vacuous here and one is unarmed by
  default, so five green results would satisfy a naive reading while changing
  nothing about whether the package's promise is true. The parity test is a
  regression guard, not a criterion clause — hooks_manifest.hooks feeds
  build_precommit and check_hook_parity, and a corrupted .pre-commit-config.yaml
  would disable the entire hook family while these five looked registered.
declares_side_effect: false
delivers_to:
  agent: python-coder
  contract: >-
    The five new members of hooks_manifest.hooks in
    templates/scripts/commit_guardian/commit_guardian.json — ids check-folder-density,
    check-test-fixture-bloat, check-sql-complexity, check-debug-scripts,
    check-ac-done-on-merge — each with tier: judgment, language: system,
    always_run: true, pass_filenames: false, change_set_source:
    handed_by_commit_path and NO files key; stages ["pre-commit"] for the first four
    and ["post-merge"] for check-ac-done-on-merge. Consumed by GE-120h-3-i, which
    judges their shape, and by GE-120h-4, whose per-check statements must match them.
