notes: |
  FLOW BACK-LINKS (add this AC id to each node's implements list):
    leafcutter/decision-forming    step    synthesize
    leafcutter/decision-forming    step    propose

  DERIVATION. Two forming steps folded into one L2 under the five-L2 cap. Both are
  host operations (synthesize_evidence, generate_options) whose output the kernel
  holds to what is actually there: findings to the retrieved evidence (scenario
  synthesize), caller-named options to the goal text (scenario propose). Example
  options from dec-d53e1c52cd47c832, whose three caller_goal options sit beside the
  host's opt.kernel_entry_point.

  STANDING RULE carried from DK-300a: options the person named are checked against
  their own words and kept as theirs.

  IT-PO BUILD STATUS (2026-10-02, unverified): PARTLY BUILT. The propose half (named
  options checked against the goal text, proposed_by caller_goal beside
  host.generate_options) is built and tested. The synthesize half is built differently
  from the criteria: a finding that cites an unknown evidence id is kept with that
  citation removed, a finding with no citation left is still accepted, and 'known'
  evidence is any id in the run. Either the kernel changes (its own ticket) or the BA
  amends the criteria; do not mark done as is.

