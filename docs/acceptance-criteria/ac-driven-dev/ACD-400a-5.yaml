test_rationale: |
  TESTS MUST NOT BE GREP-ONLY, and for this AC the grep-shaped test is not merely weak,
  it is actively misleading: the wrong behaviour and the right behaviour differ by a
  single condition inside one list comprehension, so any test that asserts on the
  presence of a helper, a level string, or an ancestor set will pass on both. The only
  assertions that discriminate are made on the scanner's OBSERVABLE OUTPUT over a real
  on-disk store: which ids come back ready, which come back held, and which ids are
  named as holding them.
  The two criterion tests are deliberately opposed and must be written as a pair,
  because each of the three plausible implementations fails a different one. The
  present code passes the composite test and fails the buildable test. A fix that
  deletes the ancestor exclusion outright passes the buildable test and fails the
  composite test — that is ACD-400a-3's original defect returning, and catching it here
  is the whole reason the negative control exists. Only a rule that narrows the
  exclusion to prerequisites which can never be independently built passes both.
  The real-store test is separate from the fixture tests because the defect was found in
  the real store and not by any fixture: hand-built fixtures reproduce the author's own
  assumptions, and every fixture written for ACD-400a-3 was satisfied by the over-broad
  rule. The reachability test is separate again because a correct rule that the command
  surface never consults is the same phantom-done failure wearing a different hat.
notes: |
  THE DEFECT, OBSERVED LIVE (2026-08-18, do not re-investigate). Running
  `scan_ac_store.py --level leaf --work-status todo --json` over the real store on this
  branch returns:
    - BO-2400g-1   -> HELD, blocked_by ['BO-2900g-1']
    - BO-2400g-1-i -> READY          (its only prerequisite is BO-2400g-1)
    - BO-2400g-4   -> HELD, blocked_by ['BO-2400g-2']
    - BO-2400g-4-i -> READY          (its only prerequisite is BO-2400g-4)
  Both refinements are offered to a builder while the L2 they refine is itself reported
  as unbuildable. The scanner is handing out the edge case before the base behaviour it
  refines exists. Store-wide totals at the time of the observation: 479 ready, 375 held.

  WHERE IT COMES FROM. scan_ac_store.py:_classify_ac (line 262) builds the blocking set
  as `[dep for dep in depends_on if dep not in ancestors and not _is_dep_done(dep, ...)]`
  (lines 287-289). `ancestors` comes from _get_ancestor_ids (line 232), which walks
  derive_parent_id (line 775) upward to the root. derive_parent_id("BO-2400g-1-i")
  returns "BO-2400g-1" — an L2 with its own criteria, its own owner and its own buildable
  work — so a genuine prerequisite edge is discarded as though it were structural noise.

  THE ORIGINAL REASONING IS CORRECT AND MUST SURVIVE. The exclusion was introduced by
  ACD-400a-3 and is recorded in that file's own DECISION HISTORY at lines 1054-1064: an
  L0/L1 composite is never independently completed — it rolls up from its children — so a
  child that listed its parent as a prerequisite would be held forever. That is true, and
  this AC does not touch it. What is wrong is the REACH of the rule, not the rule.

  THE ASYMMETRY THIS AC TURNS ON. Keeping the BO-2400g-1-i -> BO-2400g-1 edge cannot
  deadlock anything, because an L2 reaches a completed state by being built. The deadlock
  risk is exclusive to prerequisites that are never independently built at all. So the
  correct behaviour is neither "ignore ancestors" nor "ignore nobody" — it is "ignore only
  those prerequisites that can never themselves be built". The criteria are written around
  that distinction and deliberately do not name a helper, a parent-id derivation, or a
  level comparison: which field the implementation reads is the IT PO's call.

  WHICH CANDIDATE MECHANISMS THE CRITERIA NOW REJECT (settled 2026-08-18; supersedes the
  earlier note that all three candidates were equally reasonable). This AC used to say the
  recognition "may reasonably be the level field, the presence of an owner, or the
  composite/leaf distinction already in the schema". Two of those three give the wrong
  answer on this very store, so the criteria were tightened until they discriminate:
    - "Composite = has something beneath it" is REJECTED, because P in these criteria has
      R beneath it and P's own record says so. This is not a contrived fixture: BO-2400g-1,
      the observed defect's own P, is an L2 whose covered_by is [BO-2400g-1-i]. An
      implementation keyed on having children reproduces today's wrong answer exactly while
      appearing to be a principled fix.
    - "Not independently completable = no owner recorded" is REJECTED by the Q/T pair. The
      store permanently contains BA-authored L2s that have not been enriched yet — this
      AC's own notes say assignment is deliberately omitted at authoring time — and those
      are unfinished paperwork, not composites. They will be built, so they must hold their
      dependants meanwhile. The distinction that matters is between "can never be completed
      on its own" (structural, permanent) and "is not ready to hand over right now"
      (transient); only the first may drop a prerequisite from the blocking set.
  Anything that survives both rejections and the S/C control is acceptable. The IT PO's
  independently_completable predicate is compatible; what its description must not do is
  make an owner constitutive of the property, which is recorded in the amendment above.

  WHY THE NEGATIVE CONTROLS ARE INSIDE THE CRITERIA AND NOT ONLY IN A TEST. The cheapest
  wrong fix is a one-line deletion of `dep not in ancestors`. That satisfies every
  sentence about R and reinstates the exact bug ACD-400a-3 was written to remove, on a
  store where nearly every freshly-authored leaf carries its parent in depends_on. The
  S/C clauses exist so the requirement itself, not merely a downstream test, rejects that
  fix. The Q/T clauses are there for the same reason one level down: they reject a proxy
  that passes S/C and R/P and is still wrong across most of the store.

  CAP ARITHMETIC — CHECKED, AND THIS L1 IS NOW FULL. The default cap is 5 L2s per L1
  (_MAX_L2_PER_L1 = 5, templates/scripts/commit_guardian/check_ac_limits.py:82, applied as
  child_count > limit so exactly 5 passes). ACD-400a declares no child_limit_override.
  Existing L2s on disk before this one: ACD-400a-1, -2, -3, -4 = 4. This AC is the fifth.
  ACD-400a IS NOW AT THE CAP. A sixth L2 here will be blocked by check_ac_limits — the
  next author must either split the tree (see the ac-tree-split skill) or place the work
  under a different L1, and must NOT reach for child_limit_override, which the hook itself
  describes as a temporary waiver. L3 refinements are unaffected: _MAX_CHILDREN is keyed
  only for L0 and L1 (same file, lines 93-96), so L2 -> L3 fan-out is uncapped.

  STALE PARENT BACK-LINK, REPAIRED IN THIS PASS. ACD-400a's covered_by read
  [ACD-400a-1, ACD-400a-2] while ACD-400a-3.yaml and ACD-400a-4.yaml had both existed on
  disk as real ACs since 2026-08-12 — ACD-400a-3 being the very AC that introduced the
  exclusion this one narrows. The back-link was stale by two; all three ids (-3, -4, -5)
  were added in the same pass. The drift survived because check_ac_parent_covered_by
  validates only the files present in a commit's index: when -3 and -4 were committed the
  parent was not staged alongside them, so there was nothing for the hook to compare and
  it passed. A store-wide sweep, not a per-commit hook, is what finds this class of drift.

  AGENT ASSIGNMENT AND TECHNICAL ENRICHMENT DELIBERATELY OMITTED — BA-authored L2.
  assigned_agent, it_requirements, estimated_complexity, delivers_to and expects_from are
  the IT PO's to set. The expects_from edge that reads naturally here is ACD-400a-3's
  ancestor-aware classification, which this AC refines rather than replaces.
