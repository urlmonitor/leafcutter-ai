risk_surface: safety
criteria: |
  Given the refusal limit is set to 5 GB and the warning level to 20 GB, and the volume
    where workspaces are created has 3 GB free, and existing workspaces together occupy
    41 GB,
  When a workspace is requested from the one workspace maker,
  Then the answer is a refusal that states the free space (3 GB), the refusal limit
    (5 GB), the volume it measured, and the space existing workspaces occupy (41 GB),
  And the refusal carries no workspace location,
  And no folder, branch or registration for the requested workspace exists afterwards,
  And the route that asked halts with the refusal rather than continuing without a
    workspace.
