priority: medium
criteria: 'Given a flow step or branch has a one-sentence description, an actor kind and usable structured
  contract metadata,

  When a person opens that node in Atlas,

  Then the description appears once as the step text,

  And the actor kind appears as a plain-language badge beside the named agent,

  And the contract fields and examples appear once in the structured detail display, rendered from the
  structured metadata,

  And no generated contract text or compatibility badge repeats those fields and examples,

  And authored text is not removed merely because it contains words also used by a contract.'
