created_by: "docs/acceptance-criteria/guardrail-engine/GE-117-code-declares-what-it-serves/GE-117d.yaml"
criteria: |
  Given every in-scope module component, public symbol, and new decision-history
    entry in the staged commit has a satisfied declaration verdict
  When the commit-time guardrail runs on the staged commit
  Then the commit is allowed to proceed
  And the guardrail reports no declaration violation

  Given the staged commit touches only files and symbols that are out of scope
    (unchanged code, private symbols, pre-existing decision-history entries)
  When the commit-time guardrail runs
  Then the commit is allowed to proceed
  And the guardrail reports no declaration violation
