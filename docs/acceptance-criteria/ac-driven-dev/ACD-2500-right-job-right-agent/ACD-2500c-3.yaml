notes: |
  ORDERING CONSTRAINT (ACD-2500 notes, user brief): the discrimination / must_catch work
  from docs/analysis/2026-09-25-test-writers-prove-failure-not-discrimination.md (item 2:
  optional `must_catch` list on test_spec[] items) lands in the entries this AC shapes.
  Any L0/L1 authored for that analysis must list ACD-2500 in depends_on, and its schema
  AC must depend on ACD-2500c-3. The per-entry clause link is what a must_catch list keys
  on (which wrong implementation must this clause's test catch). The closed-schema clause
  keeps must_catch from being bolted on before that work is specified.
  Note: the analysis file is present only as an untracked file in the main checkout, not
  on this branch; the ACD-2500 L0 doc_link marks it status: exists.

  CORRECTION (2026-09-27, it-po, user-directed): the ORDERING CONSTRAINT above is overtaken.
  PR #911 (TQ-500f-1/-2) landed the optional test_spec[].must_catch list and the
  'discrimination' angle on main first, without depending on this AC. This AC now builds ON
  that field: it neither forbids nor re-specifies must_catch. What survives of the intent:
  the design-entry key set stays closed for any OTHER key, only the code-aware test-design
  step writes must_catch (the technical planner never does), and the presence of must_catch
  or angle 'discrimination' on an entry is that step's bug-fix/gate declaration -- no
  separate schema key.
