  config_schema_fragment:
    type: boolean
    description: "declares_side_effect on an AC record — derived from the record's own Then clauses, not authored by opinion. True when the criteria assert something observable outside the process (a file written, a record persisted, a state-changing command); absent or false otherwise, and the absence is the data-driven exemption BP-1100f-5-i defines."
  constraints:
    - "The declaration must be produced by CODE that reads the record's own criteria text. An instruction added only to an authoring agent template (it-po.md, business-analyst.md) cannot satisfy BO-2900g-2-i's third clause, which requires the guarantee to hold for a record authored by someone who was never told the field exists."
    - "NAME EVERY ENFORCEMENT POINT, AND STATE WHICH ONE IS LOAD-BEARING IN THE SIGN-OFF. There are three candidates and they are not equivalent: (1) scripts/commit_guardian/check_ac_schema.py, via the shared validators module named in reference_file_path — the pre-commit gate that actually runs, and since the 2026 rework config/ac_store_schema.json is authoritative via jsonschema with validate_manually() reduced to a schema-absent / import-failure fallback; (2) scripts/ac_store/validate_ac_schema.py — the bulk and CI path; (3) scripts/ac_store/generate_ticket_from_ac.py — today the SOLE reader of the field (two call sites, ~lines 2899 and 2936). A derivation placed only at (3) leaves the store still empty; a derivation placed only at (1) is bypassable with --no-verify. reference_file_path names the shared module so a single implementation can serve (1) and (2); record the choice explicitly."
    - "The marking rule must be data-driven from the record's own Then clauses. It must never key off id prefix, folder, feature name, authoring pass, sibling records, or an allow-list of names — the same rule BP-1100f-5-i already established for the absence side."
    - "The rule must not mark everything. Run over the real on-disk store (all 2,888 records under docs/acceptance-criteria/) it must leave a strict, substantial subset unmarked, and the marked/unmarked split must be reproducible from criteria text alone by a second reader. A derivation that marks everything is indistinguishable from one that marks nothing, one gate later: the observable-change check becomes noise and someone switches it off."
    - "Where a derived value and an explicitly authored value disagree, the disagreement must be reported by record id — never silently overwritten and never silently ignored."
    - "IF a one-off backfill over the existing store is included, it must be hard-idempotent: a second run is byte-stable (verify run-twice-and-diff), it infers then validates before writing, it inserts only the single declares_side_effect key (never a whole-file rewrite that reorders or reflows other fields), and any record whose criteria do not decide the question goes to a review report rather than receiving a guessed value."
    - "THE RECURSION IS A REQUIREMENT, NOT AN OBSERVATION: the records produced by this work must themselves carry the declaration where their criteria warrant it. If they do not, the derivation has failed on the first real input it was given."
    - "Authoring only. This AC must produce no gate, no block and no done-state consequence, and must not describe or re-derive what the declaration causes downstream (BP-1100f-5 owns that and is done)."
