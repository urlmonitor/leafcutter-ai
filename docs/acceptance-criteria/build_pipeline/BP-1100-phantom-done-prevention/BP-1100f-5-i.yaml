id: BP-1100f-5-i
components:
  - build_pipeline
title: "A work item with no declared durable side-effect is not force-routed through the smoke check"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: pipeline
risk_surface: contract_boundary
criteria: |
  Given a work item that declares no durable observable side-effect (for example a
    documentation-only change),
  When the pipeline runs the work item's verification phase,
  Then the observable-side-effect smoke check is not mandated for that work item, so a
    side-effect-free item is not blocked by a check for an effect it never claimed,
  And this scope narrowing does not weaken the mandatory routing for items that do declare
    a durable side-effect.
depends_on:
  - BP-1100f-5
