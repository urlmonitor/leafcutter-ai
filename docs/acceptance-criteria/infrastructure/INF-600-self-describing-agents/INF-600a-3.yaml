id: INF-600a-3
title: "Registry declares which knowledge channels feed each agent"
component: infrastructure
level: L2
status: active
work_status: todo
criteria: |
  Given an agent registry entry for an agent that consumes
    knowledge from multiple channels
    (e.g. python-coder, which receives context from channels
     1, 2, 5, 6, 7, 8, 9, 10, and 11 of the Agent Knowledge Plane)
  When the registry entry is read by the card generator
  Then the entry contains a `knowledge_channels` array
  And each element in the array has fields:
    - `channel` (integer 1-11, matching the channel numbering
       in docs/architecture/agent_knowledge_plane.md)
    - `source` (string naming the concrete source,
       e.g. "signoff SKILL.md", "Root CLAUDE.md")
    - `injection_mode` (enum: "always" | "on_demand" | "spawn_scoped" | "ticket_scoped")
    - `description` (string, what the channel provides to this agent)
  And the array covers every channel the agent actually consumes,
    including channels the agent self-reads via pre-flight instructions
    (not only harness-injected channels)
  And channels that are universally injected to all agents
    (channels 1, 9, 10, 11) may be omitted from individual entries
    if a convention flag `include_universal_channels: false` is set
    at the registry level
