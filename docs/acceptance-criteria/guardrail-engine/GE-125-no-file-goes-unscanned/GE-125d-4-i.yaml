title: "The self-description follows the decision, so a reduction cannot be widened or narrowed without the answer changing"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a change that adds a fifth location to the set the check treats with
    reduced scrutiny, made only where the check decides that question,
  And no other file is edited,
  When the check is asked to state what it declines to examine,
  Then the answer includes the fifth location,
  And a path under that fifth location is thereafter classified as reduced both
    by the answer and by the check's actual treatment of it,
  Because a description maintained separately from the decision drifts the first
    time someone edits one and not the other — and a description that is wrong
    about a removed protection is worse than no description at all, since it
    tells a reader they are covered when they are not.

  Given a change that removes one location from that set, made in the same
    single place,
  And no other file is edited,
  When the check is asked to state what it declines to examine,
  Then the answer no longer lists that location,
  Because the drift has to be unreachable in both directions: an answer that
    over-reports what is unexamined trains a reader to discount it, which ends
    in the same place as under-reporting.

  Given the answer and the check's treatment of any path,
  When the two disagree for any path,
  Then that disagreement is reachable by executing both — asking for the answer
    and checking the path — rather than only by reading the check's source,
  Because this record's whole subject is a claim about the source being the only
    place the truth lived, and a criterion verified by reading the source would
    reproduce it.
