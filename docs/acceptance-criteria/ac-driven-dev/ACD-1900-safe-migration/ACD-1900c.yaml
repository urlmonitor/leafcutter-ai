notes: |
  ADR-026 "Control surface": a single two-stage flag ac_unit_of_work {emit, enforce}. emit =
  generator produces thin tickets + AC-side sign-offs; enforce = gates REQUIRE the new shape
  (else dual-read/advisory). enforce may turn on ONLY once zero schema_version<2 (v1/legacy) ACs
  remain. Two kill-switches: enforce=false -> gates fall back to dual-read/advisory (one commit,
  no code revert); emit=false -> fat tickets return (safe because gates dual-read per ACD-1900b).
  state-diagram trigger covers the {emit,enforce} state machine and its legal transitions;
  how-to covers operating the kill-switch. Depends on ACD-1900b being in place first (the kill
  -switch is only safe because dual-read exists). RE-HOME/OWNERSHIP: the flag is store policy;
  schema_version is the per-AC data signal (ACD-1900a) -- keep the two distinct.
