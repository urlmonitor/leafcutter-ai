title: "A bundle's boundary is the members' exclusions minus every member's change surface, never their union"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a feature that bundles three requirements,
  And the first requirement excludes the build-orchestration runbook and the
    release workflow,
  And the second requirement excludes the release workflow,
  And the third requirement names the build-orchestration runbook as part of the
    surface it changes,
  When the boundary of the bundle as a whole is computed,
  Then the bundle's boundary contains the release workflow, because at least one
    member excludes it and no member changes it,
  And the bundle's boundary does NOT contain the build-orchestration runbook,
    because a member changes it even though another member excludes it,
  And a bundle whose members declare no exclusions at all yields an empty
    boundary rather than a boundary of every path any member did not name.
