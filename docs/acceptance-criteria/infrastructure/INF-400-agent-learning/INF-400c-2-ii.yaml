id: INF-400c-2-ii
components:
  - infrastructure
title: "An event the harvester cannot route stays unprocessed and is surfaced, never marked done"
component: infrastructure
level: L3
status: active
req_status: active
work_status: done
priority: critical
readiness: draft
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-400c-2.yaml"
criteria: |
  Given the harvester reads an event whose entry_kind it cannot route,
  And the harvester's idempotency record is what decides whether an event is
    offered to a later run,
  When the harvester processes that event,
  Then the event is not added to the idempotency record, so a later run reads
    it again,
  And the learning is not written to any knowledge surface on this run,
  And the run's summary reports the number of unroutable events separately
    from the number routed, naming each distinct unroutable entry_kind and
    how many events carried it,
  And the run's exit status distinguishes "drained cleanly" from "drained
    with unroutable events left behind", so a caller cannot read a run that
    routed nothing as a run that had nothing to route,
  And when the routing rules are extended to cover that entry_kind and the
    harvester is re-run over the same corpus, the previously unroutable event
    is routed and written on that later run,
  And a run over a corpus of 28 events of which 28 are unroutable writes
    nothing, retains all 28 for a later run, and reports 28 unroutable.
depends_on: [INF-400c-2]
