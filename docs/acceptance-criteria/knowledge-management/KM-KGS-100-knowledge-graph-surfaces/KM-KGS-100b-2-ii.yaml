id: KM-KGS-100b-2-ii
components:
  - knowledge_management
readiness: approved
priority: high
title: "Files named by requirements and tickets are drawn on the page, and a missing file looks different"
component: knowledge-management
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
parent: KM-KGS-100b-2
created_by: "docs/acceptance-criteria/knowledge-management/KM-KGS-100-knowledge-graph-surfaces/KM-KGS-100b-2.yaml"
criteria: |
  Given the map holds files-surface node "scripts/foo.py" marked present and
    files-surface node "scripts/removed_tool.py" marked missing, each with an incoming
    implemented_by edge from criterion KM-EX-070,
  When the visualisation page is generated with no surface restriction,
  Then both file nodes and both edges are drawn,
  And the legend lists the files surface in a colour of its own,
  And the missing file is drawn with a visual treatment that no present node can
    have, and the legend has a row naming that treatment "missing file",
  And the tooltip of the missing file says that it is missing,
  And a files-surface node with no present-or-missing mark is drawn as present, so
    the page still opens against map data produced before this change.
depends_on:
  - KM-KGS-100b-2
  - KM-KGS-100b-2-i
  - KM-KGS-100d-4
  - KM-KGS-100d-4-ii
doc_links:
  - path: scripts/visualise_knowledge_graph.py
    relationship: modifies
    status: exists
    relevance: "SURFACE_COLORS has no 'files' entry, and the legend only shows surfaces that have a colour entry. _assemble_graph() does not carry node attributes beyond id, surface, title, description and colour, so the missing mark would not reach the page today."
  - path: docs/acceptance-criteria/knowledge-management/KM-ADM-003.yaml
    relationship: context
    status: exists
    relevance: "The matched-pair precedent. Recording absent things without a distinct drawing made the map worse, because gaps read as real links. KM-KGS-100d-4-ii records missing files; this record draws them distinctly. Ship them together."
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The missing treatment is derived from the node's explicit mark (KM-KGS-100d-4-ii), never inferred from the absence of another field, and an unmarked files node degrades to present, per the KM-ADM-003 pattern."
  - "Add a distinct 'files' entry to SURFACE_COLORS without changing any existing surface colour (KM-KGS-100b-2's existing requirement, inherited)."
  - "The missing treatment must survive hover dimming and pinning, the page's two existing state changes. It must not be a stroke that the pin styling overwrites."
  - "MATCHED PAIR: do not merge KM-KGS-100d-4-ii to main without this record. Until this lands, missing files would render as ordinary present nodes, the exact 'gap mistaken for a working link' failure KM-ADM-100b forbids."
  - "The visualiser's page is generated by Python with the D3 script embedded as a template string, so python-coder owns both halves. There is no separate frontend build."
test_spec:
  - name: test_present_and_missing_file_nodes_and_edges_reach_the_page
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: criterion
    description: "FIXTURE (the file-drawing fixture): a temp project whose config/paths.json is a byte copy of the real one, a real scripts/foo.py, no scripts/removed_tool.py, and AC file KM-EX-070 naming both in implemented_by. The visualiser's main(['--no-open', '--output', <tmp html>, '--project-root', <fixture>]) writes the page with no surface restriction. The extracted DATA holds nodes 'scripts/foo.py' and 'scripts/removed_tool.py' with surface 'files', and both implemented_by edges from KM-EX-070"
  - name: test_missing_mark_reaches_page_data_explicitly
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: seam
    description: "On the file-drawing fixture, the DATA node for 'scripts/removed_tool.py' has missing === true and 'scripts/foo.py' has missing === false (JSON booleans, present as keys)"
  - name: test_files_surface_has_its_own_legend_colour_and_existing_colours_unchanged
    target_dir: unit_tests/
    framework: pytest
    type: unit
    angle: criterion
    description: "SURFACE_COLORS has a 'files' entry whose value differs from every other entry. Every entry that existed on 2026-09-25 keeps its value, checked against a pinned dict in the test (no git ref). The generated page's embedded SURFACE_COLORS JSON contains 'files', so the legend's shown-surfaces loop can list it"
  - name: test_missing_treatment_legend_row_and_tooltip_are_emitted
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: criterion
    description: "Static checks on the generated page (browser-free). The script contains a legend row whose label is exactly 'missing file'. The node-drawing code sets a missing-only visual attribute or class, and its branch is keyed on the node's missing mark being true. The tooltip builder emits text containing 'missing' on that same branch. The test extracts the attribute or class name the missing branch sets and asserts that no other node-styling branch (per-surface colour, degree sizing) sets it, so no present node can have the treatment"
  - name: test_missing_treatment_is_not_overwritten_by_hover_or_pin
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: boundary
    description: "Static check on the generated page: the attribute or class the missing branch sets (found as in the previous test) is not assigned by the hover (dimming) handlers or the pin handlers in the script. A missing treatment carried by the stroke the pin styling overwrites fails this test"
  - name: test_unmarked_files_node_is_drawn_as_present
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: boundary
    description: "Backward compatibility with map data produced before this change: the real _collect_all output for the file-drawing fixture is wrapped so that one files-surface node carries no missing mark (constructed with the field's default, or with the key removed from a JSON-read record). In the generated page that node's DATA entry has missing === false, and it passes the present-node branch, not the missing one"
  - name: test_real_repository_page_draws_missing_files_distinctly
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "The shipped visualiser runs as a subprocess against the real repository (--no-open --output <tmp html> --project-root <repo root>, no restriction). DATA holds more than 0 files-surface nodes, every one carries a boolean missing, and the count with missing true is greater than 0. That count equals the missing figure the knowledge_query JSON export reports for the same repository in the same test, so the page and the export cannot disagree. The page's legend markup includes the 'missing file' row. A missing repo root FAILS; it is never skipped"
test_required: true
test_rationale: >-
  The matched-pair risk (KM-ADM-003) is a missing file drawn like a present one, so the tests follow
  the mark from the map into the page data explicitly (true, false, and unmarked coerced to false),
  and check that the page gives the missing branch a treatment no other branch can set. BROWSER GAP,
  recorded honestly: no headless browser exists in the repository or in the CI pytest job (no
  Playwright, Selenium or pyppeteer in requirements-dev.txt; leafcutter-web's vitest+jsdom runs only
  in a separate npm job; D3 is loaded from a CDN). The criterion's visual clauses (drawn with a
  treatment no present node can have, and tooltip text on hover) and the hover/pin survival
  requirement are therefore proven by static analysis of the generated script, not by rendering.
  The static tests extract the attribute or class the missing branch sets and prove no other
  styling, hover or pin code assigns it. This is weaker than a rendered check: it cannot catch a CSS
  cascade or a D3 transition that restyles the node indirectly. A real-browser follow-up AC should
  cover it. Colour stability is pinned against a dict in the test, not a git ref. The real-artifact
  arm ties the page's missing count to the knowledge_query export's figure for the same repository.
  RED until KM-KGS-100d-4 and KM-KGS-100d-4-ii land, and it must merge with KM-KGS-100d-4-ii.
  File: unit_tests/test_km_kgs_100b_2_ii.py (under 400 content lines), reusing the shared
  temp-project helper. No skip.
