notes: |
  WHAT THIS RECORD OWNS AND WHY IT IS NOT PART OF INF-1300a. Acceptance and findability
  fail independently, as the L1 says. Nothing in the project's check set has an opinion
  about whether a document is listed anywhere, so this is the half of producing a document
  that no machinery will ever complain about — which is exactly why it needs a record.

  FALSIFIABILITY. In a scratch collection holding an index with several existing entries,
  produce a document with its listing requested. Read the index: the record is falsified if
  no entry appeared, if more than one did, if any existing entry changed or vanished, if
  the new entry is out of the index's order, or if the link does not resolve to the produced
  file. The link clause must be tested by RESOLVING the link against the collection, not by
  matching the link text against the requested destination — a correctly spelled link to a
  path that is not where the document landed is precisely the defect that makes an index
  worse than no index, and text comparison cannot see it. The preservation clause needs the
  scratch index to hold entries the production is unrelated to; an index with one entry
  cannot distinguish "added an entry" from "rewrote the file with one entry".

  THE ORDER CLAUSE IS NOT DECORATION. An index whose entries accumulate in creation order
  stops being a place a reader can stand and see the collection, which is the benefit the
  L1 names. It also makes INF-1300c-3's in-place update unreachable, because there is no
  defined position for an entry to be updated in.

  FENCED. WHERE the index lives, and creating it when it is absent, is INF-1300c-2's. What
  happens when the listing is requested twice for the same document is INF-1300c-3's. What
  happens when it is not requested at all is INF-1300c-4's. This record assumes an index
  exists and owns only the entry that appears in it.

