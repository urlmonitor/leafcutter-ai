id: BO-400d-2
components:
  - build_orchestration
  - ticket_lifecycle
title: "Each failure appends an immutable entry to the ticket's failure history, and that history survives a supervisor restart"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a ticket whose frontmatter `agents:` map records `pr-reviewer: needed`
    and which carries no `prior_failures:` field at all,
  When pr-reviewer returns a blocker and the ticket is written with
    `pr-reviewer: failed` at 2026-08-12 09:15,
  Then a `prior_failures:` list is created holding one entry carrying the agent
    name `pr-reviewer`, the timestamp `2026-08-12 09:15` in the same
    `YYYY-MM-DD HH:MM` form the `## Sign-offs` checklist already uses, and a
    `rule_id` naming what was caught,
  And when pr-reviewer is re-dispatched and signs off, the frontmatter terminal
    state becomes `pr-reviewer: signed_off` while that entry is still present
    with all three of its values unchanged,
  And when pr-reviewer fails a second time on the same ticket at 2026-08-12
    11:40, a second entry is appended rather than the first being replaced, so
    the list holds 2 entries in failure order,
  And after every one of those writes the entries recorded earlier are still
    present, in their original order, with their original agent, timestamp, and
    rule_id values.

  Given the supervisor process that wrote pr-reviewer's 2026-08-12 09:15 entry
    exits before the ticket reaches its terminal state,
  When a second, freshly spawned supervisor reads the same ticket from disk,
    re-dispatches pr-reviewer, and that attempt passes,
  Then the entry written by the first supervisor is still in the ticket's
    `prior_failures:` list, read from the ticket file and not from any counter
    held in the second supervisor's memory,
  And the number of attempts pr-reviewer took on the ticket is reported as 2,
    computed as the count of its `prior_failures:` entries plus one when its
    terminal state is `signed_off`,
  And no separate attempt-count field is written to the ticket, so the ticket
    holds no second figure that can disagree with the list,
  And a third process reading the same ticket computes the same figure of 2.

  Given a failure for which no rule_id is available — either because no rule_id
    in the vocabulary BO-2800b defines applies to the gate finding, or because
    the failure produced no gate finding at all, as when a coder's tests stayed
    red,
  When the entry is appended,
  Then its rule_id is written in the unclassified namespace as the word
    "unclassified" followed by the name of the emitting gate, and, for a
    failure with no emitting gate, followed by the name of the failing phase
    agent instead,
  And the entry is appended rather than omitted, whatever its rule_id reads.

  Given a ticket that carries no `prior_failures:` field,
  When a reader asks how many attempts each of its agents took,
  Then every agent on that ticket reports 0 failures and an empty failure
    history,
  And the ticket is accepted as valid rather than reported as malformed for
    lacking the field.
