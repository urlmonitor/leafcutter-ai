title: "Work carrying no recorded approval is withheld, and that is the stated verdict rather than an unstated default"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the store holds two pieces of leaf-level work that are active, still to do
    and waiting on nothing, identical in every respect except that one records an
    approval of approved and the other carries no recorded approval at all — the
    field is absent from the record rather than empty,
  When the queue is asked which work is ready to be picked up,
  Then only the piece with the recorded approval is offered,
  And the piece with no recorded approval is withheld, appearing neither among the
    work offered nor among the work reported as held,
  And it is treated identically to a piece whose approval is recorded as draft: for a
    store that differs only in whether the approval field is absent or recorded as
    draft, the queue returns the same answer,
  And writing an approved approval onto the record — changing nothing else — puts
    that piece into the offer on the next ask.
depends_on: [ACD-400c, ACD-400c-1]
