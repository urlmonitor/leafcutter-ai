it_requirements:
  - "THE DOCUMENTED AUTHORING PATH IS BLOCKED AND MUST BE RESOLVED BEFORE THE ARTIFACT IS
     WRITTEN, NOT ROUTED AROUND SILENTLY. templates/skills/write-c4-diagram/SKILL.md
     section 4 is titled 'Always scaffold first (MANDATORY)' and states 'Do not hand-author
     frontmatter, the legend block, or the mermaid skeleton'; its step 5 requires surfacing
     to the user and forbids improvising when the scaffold script fails or is unavailable.
     scripts/scaffold/new_arch_doc.py does not exist anywhere in this tree — verified at
     enrichment time — and its absence is a KNOWN, RECORDED gap: scripts/build_propagation_audit.py
     carries it in EXTERNAL_DEPENDENCY_ALLOWLIST precisely so the build guard does not block
     on it, with an inline comment stating the absence 'causes a hard user-visible failure in
     write-c4-diagram' and that 'a separate authoring ticket is required to create and deploy
     this script' (DECISION HISTORY, 2026-06-17, EPIC-BuildGuardFalsePositive/03). Exactly two
     resolutions are permitted, in this order of preference: (1) the scaffold script is
     authored and deployed first and this artifact is produced through it; or (2) the user
     explicitly authorises a scaffold-free pass, in which case the frontmatter and the
     '## Legend' block are reproduced VERBATIM from an existing same-tier sequence diagram in
     docs/architecture/diagrams/ and the deviation is recorded in the new diagram's own
     decision-history block. Composing frontmatter or the legend from memory is forbidden
     under both. Note this record does NOT take a depends_on edge on the missing script: no AC
     in the store owns creating it (BP-900b-1-1 owns the allowlist that HIDES it, not the
     script), so such an edge would park this record behind a non-existent prerequisite."
  - "The sequence number is allocated, not chosen. Run scripts/next_diagram_seq.py 3 at
     authoring time and use what it returns; it answered 8 at enrichment time, giving
     c3-008-<slug>.md, but the free number may have moved and MUST NOT be pre-committed here.
     The resulting filename must satisfy check_diagram_naming.py's c[1-4]-NNN-slug.md pattern
     with the leading digit agreeing with frontmatter flight_level: L3-Component, and must not
     collide on the c3-NNN pair with any existing file regardless of slug."
  - "The parent link must resolve in BOTH directions in the SAME commit. Set
     parent: docs/architecture/components/build-orchestration.md in the diagram's frontmatter
     AND append the diagram's path to that file's existing children: list, which today holds a
     single entry. check_mermaid_parent_link.py enforces this on the staged diagram and will
     block a one-directional link."
  - "The four criteria the diagram depicts must be named in the frontmatter related_docs list
     as their AC-store YAML paths. check_doc_frontmatter.py validates related_docs entries for
