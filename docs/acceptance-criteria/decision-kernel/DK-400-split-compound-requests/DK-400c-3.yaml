id: DK-400c-3
title: "A request proposed as fewer than two parts is treated as one question, with no split gate"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a request offered for a split,
  When the host's proposal for it holds one part or none,
  Then no split gate is shown and no part is created,
  And the request goes on exactly as a single question would: with trigger bundled_accepted it goes
    ahead as one decision from the precedent step; when it was found mid-run, the work item goes
    ahead as one decision or research step; with trigger jev_none or ambiguous, the run records the
    capability gap and ends blocked, as it does today,
  And the run's report has no split section.
depends_on:
