it_requirements:
  - "SEQUENCING, EXPRESSED AS A CONSTRAINT AND DELIBERATELY NOT AS depends_on EDGES. MEASURED ON 2026-08-24: templates/skills/security-scanner/SKILL.md contains no description of the location-based reduction at all. The reference is wrong by OMISSION, so there is no passage to amend. Whichever of the four documentation records — GE-125a-3, GE-125b-4, GE-125c-4, GE-125d-5 — is built FIRST must CREATE the section; the other three amend what it created. Before writing, check whether the section already exists and amend it if so rather than adding a second one. Do NOT add depends_on edges between the four documentation records: the coupling disappears the moment the passage exists, and an edge would tie four L1s to each other's delivery order permanently for a reason that is temporary."
  - "EXACTLY ONE SECTION, IN EXACTLY ONE DOCUMENT. Before publishing, search the project for any other passage describing this reduction — docs/how-to/managing-pre-commit-hooks.md and docs/architecture/components/security-scanner.md are the likely second homes — and fold any second account into this section, leaving a link rather than a restatement. Four separately-written accounts of one behaviour disagree with each other within a release, which is the outcome the goal forbids."
  - "The section must be MECHANICALLY COMPARABLE to the check's own answer from GE-125d-4: the same set of reductions, under the same stable names from the same closed vocabulary, so a test can compare the two rather than a reviewer comparing them by eye. Prose that conveys the same meaning in different words does not satisfy this — the names must match term for term."
  - "DESCRIBE THE BEHAVIOUR IN FORCE. A narrowing that is specified but not yet built gets no mention at all — not as a caveat, not as a 'planned', not as a 'coming soon'. On a security boundary a roadmap line is read as a description of the boundary by everyone in a hurry, and a reference that overstates protection converts a gap into a false assurance. If the section is written before a sibling lands, it describes today's behaviour including the substring match and the whole-file scope, however unflattering."
  - "The section must state which detection rules SURVIVE in reduced locations, not only which is removed. Measured today the reduction gates ENTROPY_HIGH only, and AWS_KEY, PRIVATE_KEY, EXCHANGE_API_KEY and GENERIC_SECRET still fire — a section naming only the removal overstates the gap in the other direction, and a reader who concludes reduced locations are unscanned will draw the wrong operational conclusion."
  - "The section must reproduce no credential-shaped value and no matched line, and it must NOT include an illustrative notice example that shows a withheld value being printed. The documentation must not model the very thing GE-125d-1 forbids: a copied example is the most durable way a prohibited output shape gets reintroduced."
  - "Carry KI-SEC-001's measurements at the confidence it records them at and do not upgrade them. In particular the substring match and the not-root-anchored consequence are measured facts about today's code, and the section must present them as the current behaviour rather than as a defect narrative or as an already-corrected one."
  - "ADR-001 parity: templates/skills/security-scanner/SKILL.md is the canonical copy and .claude/skills/security-scanner/SKILL.md is a build.py output. Edit the template, then run `python scripts/build.py --target-dir .`; a change made only to the deployed skill is reverted by the next build."
  - "ASSIGNMENT NOTE, recorded because the surface and the trigger point at different owners. The parent L1 carries documentation_triggers: [reference-doc], which routes to a documentation agent, but the artefact is a SKILL.md body and the agent registry's own DSL rule assigns templates/skills/*/SKILL.md to llm-expert. The registry rule wins because it is the mechanical one and the file is a skill body. If the section is later relocated to docs/reference/, reassign to reference-author at that point."
