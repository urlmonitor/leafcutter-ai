criteria: |
  A repair to the route reaches your project instead of staying in the source.

  What runs in your project is a copy that gets refreshed when you install. This
  is met when the copy you actually run is the fixed one -- so a repair to the
  route cannot be reported as delivered while every installed project keeps the
  broken behaviour or has it introduced by the next install.
