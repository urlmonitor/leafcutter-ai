expects_from:
  ac_id: GE-123a-1
  contract: "The per-file scan that no longer stops at the filename recognition — this criterion asserts that the same behaviour holds for every sensitively-named file in a multi-file run and that the run's report carries all of it through to the author."
it_requirements:
  - "All fixture files must exist as distinct real files in one tempfile-backed directory and be scanned in a SINGLE scan_files call. A test that calls the per-file scan five times in a loop asserts nothing this criterion is about and specifically cannot fail the aggregation arm."
  - "The aggregation arm must assert on the multiset of (rule_id, file_path) pairs, never on a total count alone. An implementation that de-duplicates by rule id across files must fail this arm rather than pass on a coincidental total."
  - "Order independence must be asserted by comparing the PER-FILE finding sets between a forward run and a reverse run of the same file list, never by comparing run totals — an order-dependent implementation can produce the same total from a different distribution across files."
  - "The five env-named fixtures must not be five copies of one filename in five directories. Use five distinct names drawn from the forms the sensitive-filename rule recognises, so the arm cannot be satisfied by behaviour that is specific to one name."
  - "The three ordinary source files must use ordinary .py filenames, and in the forward run one must precede all five env-named files and one must follow all of them, so the reverse run genuinely inverts their relative positions."
  - "Exit-status arms must run the scanner's CLI entry point in a fresh subprocess with the fixture directory as the working directory, and must assert the process exit code. A returned list of findings is not an exit status."
  - "Test fixtures must assemble every credential-shaped string at runtime from concatenated fragments rather than writing it as a source literal, so this repository continues to need no PRIVATE_KEY or AWS_KEY suppression anywhere. The existing suppression test module does this deliberately; do not collapse the fragments back into literals."
  - "Each of the four content-rule lines in a fixture must produce exactly one finding, so that twenty-five is an exact expectation rather than a floor. Verify the chosen values do not cross-trigger a second rule."
  - "The module under test must be loaded from the canonical templates/ path via importlib.util.spec_from_file_location, never from a deployed copy, which can be stale."
  - "No test may write a .security-allowlist to any real project root. Every arm of this criterion runs with no allowlist present in the fixture directory."
  - "Fixture files must not be placed under tickets/, docs/retrospectives/, docs/acceptance-criteria/ or templates/skills/. The pre-commit consumer post-filters entropy findings for those path prefixes, which would silently change the expected counts."
test_spec:
  - name: test_five_env_named_files_report_twenty_five_findings
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "Five distinct env-named fixtures, each carrying the same four recognised lines, scanned in a single scan_files call, return exactly twenty-five findings — five per file, with the filename rule and each of the four content rules present once per file."
  - name: test_findings_are_identical_under_forward_and_reverse_scan_order
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "The five env-named fixtures interleaved with three ordinary .py fixtures are scanned forwards and then in reverse; the per-file finding set for every one of the eight files is equal between the two runs."
  - name: test_no_finding_is_dropped_or_collapsed_between_files
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "The multiset of (rule_id, file_path) pairs returned for the five-file run contains all twenty-five pairs; findings that differ only in which file they came from are all present, so an aggregator that de-duplicates by rule id across files fails."
  - name: test_cli_over_the_five_file_set_exits_nonzero_and_names_every_file
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: e2e
    angle: reachability
    description: "The scanner CLI, run in a fresh subprocess with the fixture directory as its working directory over all five env-named fixtures, exits non-zero and its report names all five files rather than a single representative one."
test_rationale: "This record exists because the parent's scenario contains ONE env-named file while the measured collapse was total across five, so a fix that reads the contents of the first such file it meets would pass the parent and leave four files exactly as they are today. The descriptors are therefore built on a set, not an instance, and every one of them drives the multi-file entry point: a loop over the per-file scan reproduces the exact blind spot the third arm is about and cannot fail it. RED-VS-GREEN HONESTY, so a later TDD-order check does not misread the baseline: all four descriptors are RED today, but for a reason worth stating precisely. The baseline is five findings across the five files (one filename finding each), so every count-bearing assertion fails today. The STRUCTURAL properties the second and third descriptors guard — order independence and the absence of cross-file de-duplication — already hold in the current implementation, which iterates and appends with no cross-file state. Those two descriptors are therefore red on the counts and green on the mechanism: once GE-123a-1 lands they convert into regression guards against an order-sensitive or de-duplicating rewrite, and they should be read that way rather than as independent evidence of the fix. The fourth descriptor's exit-code assertion is green on arrival for the same reason as the parent's — five filename findings already exit non-zero — so its load-bearing half is the requirement that the report name every file."
