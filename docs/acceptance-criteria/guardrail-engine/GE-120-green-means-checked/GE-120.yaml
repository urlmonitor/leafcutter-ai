      from a working copy lacking the deployed-layout link, printed "cannot
      import derive_parent_id ...; skipping check (fail-open)" and exited 0.
      With the link in place, the SAME check on the SAME staged files blocked
      with 6 violations. Same check, same repo, opposite verdicts decided purely
      by workspace layout.
    - OBSERVED: check_ac_schema.py cannot resolve config/ac_store_schema.json
      from a separate working copy and silently degrades to "manual field
      validation" instead of authoritative schema validation (fallback at
