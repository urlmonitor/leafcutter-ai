notes: |
  Found 2026-08-14 while triaging why a done-proof failure appeared in CI but not
  locally. The two callers disagree:

    pre-commit (commit_guardian.json): check_done_proof.py --test-root .
    CI (.github/workflows/ci.yml):     check_done_proof.py --mode ci-changed --base origin/<base>

  Only the hook passes --test-root, so CI falls back to _DEFAULT_TEST_ROOT =
  "unit_tests". The manifest's own comment on the hook entry documents why that
  default is wrong — it "contains no .ts files, so JS-covered ACs would be
  reported as unproven (BO-2500e-5); this also makes the hook correct in consumer
  projects whose tests do not live under unit_tests/" — and in the same breath
  calls CI mode "the authoritative backstop". The authoritative backstop is
  therefore running with the scope the manifest calls incorrect.

  Measured on this repo the same day: 21 files under tests/ carry "# covers:"
  tags that the CI gate cannot see. Observed impact: BP-015's tests were written
  to tests/ and the required gate reported "no linked test found"; they were
  moved to unit_tests/ to get green, which treated the symptom.

  Fixing the DEFAULT rather than the CI command line is deliberate: it repairs
  every caller that omits the flag — CI, consumer installs, and ad-hoc runs —
  instead of leaving the next caller to rediscover the same trap. The hook's
  explicit --test-root . then becomes belt-and-braces rather than the only thing
  holding the behaviour up.
