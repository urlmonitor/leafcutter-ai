assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: 'Split record (DK-400a-1 shape) with trigger ''bundled_accepted'' and kept_routing {capability_id: ''decision''
    | ''research'', capability_version: string, routing_assessment_id: string} non-null; consumed by DK-400d-3-ii
    (kept-whole resume) and DK-400c-3 (too few parts goes ahead as that capability).'
expects_from: null
it_requirements:
  - bundled_accepted is caught at routing on the root work item (depth 0), in the same route pass that selected
    the capability, not inside the decision or research capability; the selected capability is not invoked for the
    root while the split is open.
  - The routing result that selected the capability (its RoutingAssessment id, or the intent-bound binding, with
    capability id and version) is kept on the split record as kept_routing and is the only source a kept-whole rejection
    or a too-few-parts outcome resumes from; it is not re-routed and no second routing Jev call is made on resume.
  - 'No options request, criteria proposal, precedent search or assessment runs for the whole goal before the gate
    answer: no host.generate_options packet and no decision Jev batch exists for the root.'
  - A bundled root resolved to research (evidence answer kind) is caught the same way with subject_kind research_request.
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_bundled_accepted_goal_offered_as_split_before_any_option_work
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: 'Routing selects decision for the decision-records goal with bundle 0.9: the run waits on decompose_goal
      with trigger bundled_accepted and kept_routing naming decision, and no options, criteria or assess work exists
      for the root.'
  - name: test_bundled_accepted_kept_routing_survives_restart
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: seam
    description: After a process restart at the split gate the split record still names the same capability id,
      version and routing assessment id.
  - name: test_ideas_root_is_never_split
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: A root classified as ideas with bundle 0.9 starts no split and is bound to host.generate_options
      as today.
test_rationale: 'Where the case is caught matters as much as that it is caught: the tests assert the absence of
  any decision work for the root, which only a run through the real scheduler can show.'
