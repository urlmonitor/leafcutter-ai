id: GE-130e-2-i
title: A hook that watches file changes cannot leave the rule by not declaring itself a protection, or
  by declaring itself out without a ground about what it does
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a hook registered for the editing tools or for shell commands,
  When the coverage check runs,
  Then a hook that carries no declaration either way is named as undeclared, and the check fails,
  And a hook declaring itself not a protection against changing files is accepted only when the
    declaration states a ground about what the hook does -- it only records, or it only reminds
    and never refuses,
  And a declaration stating no ground, or a ground about when the hook was added or that it
    predates the rule, is named and the check fails,
  And a hook accepted under a ground is reported with that ground, so the exemption is visible
    rather than silent.
