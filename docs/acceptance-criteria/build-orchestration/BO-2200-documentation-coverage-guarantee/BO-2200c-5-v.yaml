notes: |
  NOT IN THE ORIGINAL FOUR -- added because without it the idempotency behaviour (BO-2200c-5-iv)
  cannot ship. The verifier's coverage step satisfies a required document only when its path
  appears in the union of the branch-range diff and the working-tree diff. A writer that correctly
  determines a document already says enough, and therefore writes nothing, produces no entry in
  either. The document is right, the writer is right, and the ticket is blocked. Shipping -iv
  alone converts a documentation gap into a hard stop on every already-documented target.

  This belongs under BO-2200c-5 rather than under the verifier's own L1 because it is precisely
  what that criterion asserts: the writer's brief and the verifier's enforcement are one artifact
  read by two agents, and they must move together. An outcome vocabulary the writer can emit and
  the verifier cannot act on is the same drift, in the same block, as the format mismatch this
  criterion was reopened for.

  The last clause is the reason this does not weaken the coverage guarantee. Accepting "in the
  diff OR present on disk" would let any pre-existing file pass unread, which is the placeholder
  hole the verifier exists to close. Accepting the writer's word would make the gate
  self-certifying. Requiring the verifier to read the file and run its own content and placeholder
  checks keeps the three-way outcome -- satisfied-without-change, blocked-on-content,
  blocked-on-absence -- decided by evidence the verifier gathered itself, and makes the behaviour
  testable as three fixtures with three different verdicts rather than as the absence of a
  blocker.
