title: "How-to guide shows how to retire a done record honestly by superseding it"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the retired-record exemption (ACS-900d-4 and its L3s) is implemented,
  When a contributor needs to retire a record whose behaviour was deliberately
    removed,
  Then the AC traceability how-to guide gives the steps: set status
    "superseded_by", list one or more existing successor ids in superseded_by,
    leave work_status as it was, and stage the parent alongside,
  And the guide states which gates no longer apply to a retired record
    (covering-test proof, test contract, unfinished-children checks) and which
    still do (schema shape, successor ids exist and are not the record itself,
    parent/child links),
  And the guide states that editing readiness, change_target, test tags or
    test contracts to get a retired record past a gate is wrong,
  And the status lifecycle table in the AC schema reference no longer claims
    superseded records are excluded from enforcement without naming the
    structural rules that still apply.
depends_on: [ACS-900d, ACS-900d-4]
