id: BP-600d-1-i
title: "Quick-fix workflow rejects input that lacks a file path or root cause"
component: build-pipeline
level: L3
status: active
readiness: reviewed
priority: medium
work_status: todo
criteria: |
  Given the user invokes /quick-fix with text "the build is broken",
  When the workflow attempts to parse the diagnosis,
  Then it identifies the missing fields (no file path, no root cause),
  And it halts with a structured prompt asking the user to provide:
    (1) the file containing the bug, (2) what is going wrong, and
    (3) why it is happening,
  And it does not proceed to AC creation.
