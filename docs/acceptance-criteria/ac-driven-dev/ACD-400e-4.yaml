    angle: real_artifact
    surface_invoked: "docs/reference/ac-schema.md (parsed selection-verdict block)"
    description: "The committed account carries the two-selector difference as a verdict entry naming which selection it applies to, so a blanket claim of fast-lane indifference cannot be written without failing."
test_rationale: "Asserting the two behaviours separately would leave the account free to describe them as one, which is precisely the folklore BO-2400f-2 rests on. One store, both selectors, answers compared, is the construction that goes red on unification — and unification is the specific wrong repair a reader of the account is most likely to attempt."
