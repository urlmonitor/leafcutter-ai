notes: |
  Repeat of TICKET-20260527-FeedbackSinkPreDriveCheck. The original warn-only
  behavior allowed a drive to proceed with an unreachable sink, producing 23
  silent submit-failed events and an impossible retrospective. This L1 raises
  the gate from warn-only to hard block, matching the BO-100 pre-dispatch-gate
  pattern (cycle detection halts before dispatch).

  it-po enrichment finding (dual-surface parity): the pre-dispatch gate has TWO
  enforcement surfaces that must BOTH hard-block, or the JS path silently
  bypasses the prose gate and reintroduces the exact KI-3 bug —
    (1) templates/workflows/build-feature.md (slash-command prose, Step A -> B),
    (2) templates/workflows-js/build-epic.js (deterministic JS workflow that
        Step B delegates to; its Step 0 worktree-guard is the precedent shape).
  The probe (append one line to debugging/logs/agent_telemetry.jsonl, mkdir-and-
  retry, classify genuine write failure) is factored as ONE shared probe helper
  consumed by both surfaces. This is why BO-100d-1 and BO-100d-2 were each split
  across python-coder (build-epic.js + helper) and llm-expert (build-feature.md
  prose parity).

  2026-10-16 (business-analyst): the relative path debugging/logs/agent_telemetry.jsonl
  in the paragraph above is HISTORICAL. Since INF-500d-4 the telemetry stream lives
  under one durable operational_log_root declared at build time (ADR-069), and the
  probe targets the absolute path printed by the install's telemetry location query
  (sink_resolution.py --print-location telemetry, INF-500d-4-iii). A missing, empty
  or stale declaration blocks the drive with "rebuild" as the remediation and never
  falls back to the relative path. See KI-BO-20261009-bo100d-probe-pins-a-relative-
  telemetry-path.
