assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    done_proof_dangling_covers_flag:
      type: object
      description: "Covers-tag resolution that only counts a '# covers:<id>' tag when <id> resolves to an active AC; tags resolving to deprecated, superseded, or nonexistent ids are excluded from any done proof and reported as dangling."
  reference_file_path: "scripts/ac_store/test_enforcement.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Active-status resolution must derive from the AC store's own status/req_status fields (data-driven), never from a hard-coded id list, so newly deprecated or superseded ids are handled automatically."
    - "A tag whose id resolves to a non-active or nonexistent AC must not increment coverage for any active AC."
    - "Every dangling tag must be reported (id + originating test location) so it can be reconciled, per the error handling policy."
    - "Resolution must be idempotent for a given store + test tree."
