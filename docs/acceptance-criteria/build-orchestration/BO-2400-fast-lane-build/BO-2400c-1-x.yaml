title: "The delivery guarantee holds at any bundle size, and a ceiling announces itself"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the same lane and the same delivery check exercised twice — once with a bundle at
    the size the design intends, and once with one several times larger,
  When each is delivered unaltered,
  Then both are accepted and both are carried into the context-carrying dispatches,
  And when each is altered on the way, both are refused,
  So the size at which the guarantee holds is a property of the check rather than a
    threshold that has to be rediscovered every time the payload grows.

  Given a bundle far smaller than the size the design names,
  When it arrives altered,
  Then it is refused exactly as a large one is,
  And there is no size beneath which the check is skipped, because the failure of
    2026-08-31 happened at eighteen kilobytes — under the expectation the design itself
    states — so being small is not evidence of having arrived intact.

  Given a reply carrying only part of what was produced, which is the shape a limit on how
    much text can cross the boundary produces,
  When the lane compares what arrived against what was produced,
  Then the run ends reporting how much was produced against how much arrived,
  And it names the shortfall as a shortfall rather than as damaged content, so a ceiling on
    what can cross is discovered as a ceiling,
  And a decision to make the payload smaller is then one somebody takes knowingly, rather
    than a wall a run walks into and reports as something else.
