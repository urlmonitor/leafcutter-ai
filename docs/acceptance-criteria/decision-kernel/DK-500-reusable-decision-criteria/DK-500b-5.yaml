id: DK-500b-5
title: 'Reference: grouping suggestions, their rules and how their quality is measured'
component: decision-kernel
components:
- decision_kernel
level: L2
status: active
readiness: approved
req_status: draft
priority: high
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given the grouping behaviours DK-500b-1 to DK-500b-4,
  When a reader opens the grouping reference,
  Then it lists the fields of a grouping suggestion (the placed category or "none", preferred wording, other wordings, reason), and states that a broader category is never suggested and appears only when a person has set it,
  And it states the four settled rules: cheapest placement first, precision over recall, in-run grouping within the run's Jev budget and free on an empty library, and every grouping a suggestion a person accepts, changes or undoes,
  And it states the invariants: no label in two live categories, broader never loops and never names a retired category,
  And it defines precision, recall and the share left at "none" for a labelled set and an acceptance setting,
  And it describes the grouping method decided in dec-a070edfb6465bced: code places exact label and criterion-id matches without any model call, Jev then picks one existing category or "none" for each remaining wording and a merge is suggested only at p >= 0.8, each wording left at "none" becomes a one-member candidate category made by code, no language model is asked, and no broader category is ever suggested.
