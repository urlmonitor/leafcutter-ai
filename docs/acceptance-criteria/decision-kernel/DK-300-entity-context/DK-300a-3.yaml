  Fresh-run wiring criteria were explicitly reconciled to EntityContext on 2026-10-04.
estimated_complexity: L
it_requirements:
  - "Each artifact owner validates syntax and membership; AC parent derivation is not ID validation. Four-digit AC roots and nested suffixes use the canonical validator."
  - "Artifact cards preserve exact existing IDs and include native_kind, authored short title and canonical locator without criteria/rationale/body fields."
  - "Default configured source coverage must explicitly admit supported AC, ADR, decision-record, flow and ticket owner stores; selected source IDs and read roots still constrain all access."
  - "Source and projection hashes derive from actual selected snapshot content and retained projections; no placeholder provenance is allowed."
test_required: true
test_spec:
  - name: "test_artifact_identity_uses_canonical_owner_and_membership"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_owner_projection.py::test_artifact_identity_uses_canonical_owner_and_membership: Build from real native AC, ADR, decision, flow and ticket fixture formats; verify existing IDs, four-digit AC roots and nested suffixes."
  - name: "test_artifact_cards_are_metadata_only_with_real_provenance"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "behavioral"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_owner_projection.py::test_artifact_cards_are_metadata_only_with_real_provenance: Assert native kind, exact ID, title and canonical reference; inspect every card for real snapshot/source/projection hashes and absent criteria/rationale/body sentinels."
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
