title: "The package refuses to ship a database address again"
component: infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the package's shipped sources — the templates/ tree (including
    templates/docs/) and the config/ tree, which are what a build copies into
    an install — and the output of a build into a fresh, empty target
    directory,
  When the shipped-address check runs over those shipped sources and that
    build output,
  Then it passes when no shipped file contains a database connection address,
    And it fails when any shipped file contains one, naming each file and
      line — for example a template that reintroduces
      postgresql://trader:trader@localhost:5403/LIVE, or any other address of
      the form <scheme>://<user>:<password>@<host>:<port>/<database> with
      scheme postgresql, postgres or mysql,
    And run against the shipped sources as they stood before this work, it
      fails and names every shipped place the address came from — at least
      templates/agents/test-writer.md, templates/agents/test-runner.md,
      templates/workflows/test.md, config/skills_config.default.json and
      config/skills_config.schema.json, and their built copies,
    And leafcutter's own documentation tree (docs/, including the settings
      field reference, the testing guide, the analysis pages and the AC
      store) is not scanned, because a build does not ship it; those pages
      are cleaned by hand under INF-1100d-5,
    And it runs with the normal test suite, so reintroducing the address
      fails before a merge rather than after an install.
