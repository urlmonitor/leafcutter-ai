assigned_agent: python-coder
estimated_complexity: XS
it_requirements:
  - "Edit job typecheck in .github/workflows/ci.yml in place (same job id, so nothing that refers to it breaks): new name, continue-on-error removed, the step's run replaced by the fetch plus one call `python scripts/ci/mypy_ratchet.py --base \"origin/${{ github.base_ref }}\" -- <the twelve pathspecs>`. The KI-BP-20260831-0620 and PR #985 comments stay with the lines they explain. The header comment for the job states the ratchet rule and that the job is not yet required."
  - "Do not touch GitHub rulesets or branch protection."
test_spec:
  - name: test_bp_1300f_1_vii_ci_job_runs_the_ratchet_and_can_fail
    target_dir: unit_tests/build_guards/
    framework: unittest
    type: integration
    angle: seam
    must_catch:
      - "leaves continue-on-error: true on the job"
      - "runs plain mypy over whole files instead of the ratchet"
      - "drops the top-level 'dir/*.py' pathspec forms (KI-BP-20260831-0620)"
    description: "Parse the REAL .github/workflows/ci.yml with a YAML parser: job typecheck is named 'mypy ratchet (new errors only)', has no continue-on-error, checks out with fetch-depth 0, and its pull-request step fetches the base branch and calls scripts/ci/mypy_ratchet.py with --base origin/${{ github.base_ref }} and all twelve pathspecs."
test_rationale: >-
  The unit layer cannot run a GitHub workflow, so the binding test parses the real
  workflow file with a YAML parser and asserts the job's control flow consumes the
  ratchet's exit code (no continue-on-error) and calls it with the right scope. The
  live proof is the pull request's own CI run of this job, which must appear on the
  pull request that introduces it.
