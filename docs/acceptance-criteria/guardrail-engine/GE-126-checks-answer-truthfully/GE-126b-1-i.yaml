assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The statement must be emitted with an entirely empty environment. Assert it under a cleared environment rather than under the test runner's inherited one - an inherited variable is how an opt-in diagnostic looks unconditional to its own test suite."
  - "The historical switch may keep existing and may keep adding detail. What it may not do is decide whether the check says anything at all. Backward compatibility is not a reason to keep the gate and the record says so."
  - "A falsy spelling of the switch - the empty string, '0', 'false', 'no' - must not suppress the statement either. Today the switch is read for truthiness, so a caller who deliberately turns it off would silence the very thing that tells them the check abstained."
  - "Silence must not be a reachable response from this check on any path. If a caller receives no output at all, that must mean the process did not run - which is the fact that makes the diagnostic worth reading."
  - "Every assertion must be made against the copy the build deploys under .leafcutter/."
  - "Error handling must follow the four rules in CLAUDE.md; the statement must survive the internal-error fail-open path or that path becomes the new switch."
test_spec:
  - name: test_statement_is_emitted_with_a_completely_cleared_environment
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "Deployed check run by subprocess with env fully cleared, from a tree with no acceptance-criterion store, still states the resolved root and an examined count of zero. This is the run that is silent today."
  - name: test_setting_the_historical_switch_produces_no_different_statement
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: seam
    description: "The statement from the switch-set run and the statement from the switch-unset run are compared to each other and are the same - so a caller who sets the switch cannot be receiving the statement because of it."
  - name: test_falsy_switch_values_do_not_suppress_the_statement
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "Empty string, '0', 'false' and 'no' are each set as the switch value in separate runs and the statement is present in every one."
  - name: test_no_reachable_condition_produces_a_run_with_no_output_at_all
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "Across the no-store, empty-scope, records-examined and induced-internal-failure conditions with a cleared environment, no run produces empty output - silence is not a response the check can give."
test_rationale: |
  This record's failure is invisible to any test that runs under the suite's inherited
  environment, because the cheapest way to satisfy its parent is to move the existing
  opt-in line above the early returns and leave it opt-in — which passes the parent's
  descriptors if those tests happen to set the switch. Clearing the environment is
  therefore not a detail; it is the whole assertion. The second descriptor compares the
  two runs' statements to each other rather than each to a literal, because that is the
  only form that proves the switch is not what produced the output. The falsy-value
  descriptor covers the specific spelling a caller uses when they mean "off", which a
  truthiness read silently honours.
