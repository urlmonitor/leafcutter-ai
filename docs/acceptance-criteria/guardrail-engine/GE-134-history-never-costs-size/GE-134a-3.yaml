  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: reachability
  description: 'Stage the GE-134a-1 Python example under a limit of 50 and run the fixture copy of
    check_file_size.py as a subprocess; the Measures: line of the refusal states that comments and
    standalone strings are not counted. Uses _ge_127d_2_fixture.build_fixture_tree (a copy of the
    production modules in a temporary git repository, no build.py, no POSIX flock).'
  proves_clause: the rule leaves the decision-history block out, and the author arrives at the length the
    standard quoted
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
- name: test_ge_134a_3_published_config_rule_states_the_history_exclusion
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: 'Reads the shipped commit_guardian.json: the MEASUREMENT RULE passage of file_size._comment
    (a published_rule_surfaces entry) says comments and standalone strings are not counted and no longer
    carries the old sentence that every hash comment line is counted. Whole-passage agreement with the
    generated statement is GE-127d-5''s parity gate, not this test.'
  proves_clause: the rule leaves the decision-history block out, and the author arrives at the length the
    standard quoted
  code_file: templates/scripts/commit_guardian/commit_guardian.json
- name: test_ge_134a_3_stated_rule_names_where_the_block_starts_and_ends
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: 'NAME KEPT, PROMISE INVERTED. With no block concept left, the stated rule names no
    "DECISION HISTORY" heading and no position ("whole text", "directly above"), and instead covers
    comments of every style and standalone strings wherever they stand.'
  proves_clause: the rule leaves the decision-history block out, and the author arrives at the length the
    standard quoted
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
  must_catch:
  - a history-specific sentence with start/end conditions kept in the generated statement
- name: test_ge_134a_3_stated_rule_says_ordinary_comments_still_count
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  angle: criterion
  description: 'NAME KEPT, PROMISE INVERTED (GE-127d-3, 2026-10-21). No counted clause of the stated rule
    mentions comments, and the rule states that blank lines are not counted.'
  proves_clause: the rule leaves the decision-history block out, and the author arrives at the length the
    standard quoted
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
  must_catch:
  - the old "counts ... '#' comments" or "including blank lines" clause left in the statement
- name: test_ge_134a_3_applying_the_stated_rule_by_hand_gives_80
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: integration
  angle: criterion
  description: 'NAME KEPT (the 80 is the pre-GE-127d-3 figure). An independent counter applying the stated
    rule (no comment, no standalone string, no blank line) to the GE-134a-1 Python example arrives at its
    code-line count (64, derived at run time), and that equals the Lines: figure the refusal quotes.'
  proves_clause: the rule leaves the decision-history block out, and the author arrives at the length the
    standard quoted
  code_file: templates/scripts/commit_guardian/_file_size_ratchet.py
