  - ac_id: TQ-500f-2
    contract: "The must_catch field exists on test_spec items (non-empty list of non-blank strings) and reaches the test writer verbatim on the generated ticket."
  - ac_id: ACD-2500d-5
    contract: "templates/agents/test-designer.md exists as the registered code-aware test designer (Sonnet tier, reads code and existing tests), and its test-design procedure (ACD-2500c-1) writes test_spec items to the requirement record. This AC extends that procedure; it creates no agent and edits no other template."
it_requirements:
  - Edit the source template templates/agents/test-designer.md only, never the deployed copies.
    templates/agents/it-po.md gains NO must_catch text and is not touched by this change. Builds
    that edit test-designer.md (ACD-2500c-1, ACD-2500d-1/-2/-3, this AC) must be serialised.
  - 'The bug-fix / gate declaration is carried by EXISTING test_spec fields, with no new schema
    key (user decision 2026-09-27): a test_spec entry carrying must_catch, or angle: discrimination,
    IS the test designer''s stated judgement that the requirement is a bug fix or a gate. The
    instruction must present it as the designer''s own judgement, made after reading the code,
    and never as the output of an automatic classifier over the requirement''s wording.'
  - For a bug fix, the designer must author 'revert the fix' plus at least one wrong version that
    names the condition or input involved, taken from the code it opened. For a gate, it must
    author one 'drop the <X> condition' per gate condition plus 'the gate always allows'.
  - The instruction must say that new behaviour with no earlier version needs no must_catch and
    that its absence is not a defect, so the designer does not stamp must_catch on every entry.
  - Authored must_catch values must satisfy TQ-500f-2-i's rules (non-empty list of non-blank strings)
    and the test_spec item key set that ACD-2500c-3 allows. The instruction must tie must_catch to
    the conditional 'discrimination' angle per user decision Q2 (it fires for bug-fix or gate requirements
    or when must_catch is present, and never takes one of the four slots by default).
  - 'Model tier: must_catch is authored by the Sonnet-tier test designer itself. No Opus sub-call
    is added for must_catch by this AC (user decision 2026-09-27). The ADR-033 section 2.3 question
    belongs to the ACD-2500 owner.'
test_required: false
test_rationale: 'Prompt-only: the deliverable is instruction text in templates/agents/test-designer.md.
  No deterministic unit test can show that an LLM names good wrong versions, and a test asserting
  the instruction is present in the template is the grep-only proof CLAUDE.md forbids. Substitutes:
  (1) the shape of whatever the designer writes is enforced mechanically at commit time by TQ-500f-2-i''s
  validator; (2) the behavioural substitute is an eval over incidents 1 and 2 of docs/analysis/2026-09-25-test-writers-prove-failure-not-discrimination.md,
  run against the test designer once ACD-2500d-5 has built it: register test-designer in scripts/evals/agent_eval_config.json
  (artifact mode, run by scripts/evals/run_agent_eval.py) with R1/R2/R3 from this AC as gold
  rows. R1 must carry ''revert the fix'' plus a condition-naming wrong version, R2 one per condition
  plus ''the gate always allows'', and R3 none. That eval cannot exist before the agent does,
  so it needs its own follow-up AC; (3) pr-reviewer checks the prompt diff against each Then
  clause.'
