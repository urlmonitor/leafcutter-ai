assigned_agent: documentation-expert
estimated_complexity: M
it_requirements:
  - "The worked example must name the deployed copy under .leafcutter/ as the thing to invoke. A procedure that names the templates/ path teaches every reader to reproduce the defect GE-126c exists to close."
  - "Every command in the worked example must be a single simple shell command with absolute paths - no chaining, no cd - because the readers of this page include agents operating under that constraint (CLAUDE.md, 'Shell Convention')."
  - "The worked example must be extractable from the document by a test without the test re-typing it. A test that retypes the commands asserts the test author's belief rather than the document's content, and the two drift silently."
  - "The removal clause is a deletion obligation and must be verified as one: the test that covers this AC must assert the superseded advice is ABSENT, not merely that the new procedure is present. Leaving the old sentence beside the new one is how half the readership keeps following the old route."
  - "The document must not state or imply how many checks in the family honour this contract. Only check_ac_governance is repaired by this L1 and GE-126e is what would measure the rest (L0 standing rule)."
  - "Frontmatter and doc-type conventions must satisfy check_doc_frontmatter and check_doc_types_agents at the commit that lands the page."
test_spec:
  - name: test_worked_example_commands_are_extracted_and_executed_verbatim
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: "docs/how-to/managing-pre-commit-hooks.md interrogation procedure"
    description: "The test parses the worked example out of the shipped markdown and runs each command as written against the deployed check; it does not retype them."
  - name: test_worked_example_produces_the_refusal_the_document_shows
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: criterion
    description: "Running the extracted example against the record the document supplies yields the refusal outcome and the record name the document shows - a reader who copies the example sees a refusal, not a pass."
  - name: test_procedure_names_both_honoured_routes_and_each_route_works
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: ".leafcutter/scripts/commit_guardian/check_ac_governance.py"
    description: "For each target route the procedure names, the test drives that route against the documented violating record and asserts a refusal - so a route the document names but the check does not honour is caught."
  - name: test_silence_means_clean_advice_is_absent_from_the_hook_how_to_pages
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: boundary
    description: "No page under docs/how-to/ covering this hook family still states that a silent run or a bare zero exit constitutes verification - the deletion is asserted, not just the addition."
test_rationale: |
  A documentation AC covered by a presence assertion is the documentation form of the
  defect this whole tree exists to close: the page passes, nobody runs it, and the
  procedure it describes may not work. Extracting the worked example from the shipped
  markdown rather than retyping it is what makes the assertion about the document; a
  retyped command asserts the test author's memory and stays green while the page rots.
  The per-route descriptor exists because a procedure can name a route the check does
  not honour, and that failure is invisible to any test that only runs the first
  example. The deletion descriptor is separate because an addition test passes with the
  contradicted advice still on the page.
