notes: >-
  Evidence, observed 2026-09-14: the canonical worktree-setup script's create-only mode
  roots a new branch at the machine's local copy of the main line, while its two sibling
  modes root at the shared one. Local main was 39 commits behind when checked. Independently
  recorded as KI-BO-20260909-worktrees-go-stale-within-minutes, which also records that the
  quick-fix workflow had to hand-roll a compensating staleness pre-check (BP-600a-1 territory)
  and that passing that pre-check proved insufficient, because the script then produced a
  worktree rooted at a commit that was not the local main the guard had just verified. Two
  consequences for decomposition: the guarantee is about the COMMIT THE WORKSPACE IS ROOTED
  AT, not about a warning being printed; and a per-caller pre-check is the shape this AC
  exists to replace, so do not specify one. Distinct from BO-900a (divergence accumulating
  DURING a drive) and BO-1800f (freshness at DELIVERY) -- see the BO-4100 notes field.
