criteria: |
  Given the build's ordered set of phase agents for a ticket,
  When the phase order is resolved,
  Then a phase agent `documentation-verifier` exists with priority `11.9`.
  And its priority places it AFTER the coder, the test-runner, and
    `documentation-expert`, and BEFORE the commit phase.
  And on a ticket where `documentation-verifier` is `needed`, it is dispatched in that
    slot — never at the very end after commit.
