assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "An excerpt's content hash must be computed over the exact final retained text after shortening and whitespace normalization."
  - "Shortening must remain visible through the excerpt and enrichment truncation indicators."
delivers_to: null
expects_from: null
test_required: true
test_spec:
  - name: test_excerpt_cut_at_whitespace_hashes_the_retained_text
    target_dir: tests/kernel/enrichment/
    framework: pytest
    type: unit
    angle: boundary
    description: "A four-character excerpt allowance retains ZTC after whitespace normalization; its hash matches exactly ZTC and shortening is reported."
test_rationale: "The whitespace cutoff reproduces the normalization boundary where hashing an earlier text representation would disagree with the returned excerpt."
