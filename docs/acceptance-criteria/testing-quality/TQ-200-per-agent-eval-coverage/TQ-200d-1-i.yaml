assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  - ac_id: TQ-500g-1-i
    contract: >-
      wrong_version_runner.run_runner(ac_ids: list[str], test_root: Path, ac_root: Path,
      base_ref: str = "HEAD", alterations: str | None = None) -> dict, in
      scripts/build_orchestration/wrong_version_runner.py (public module, imported by path; CLI
      equivalent: wrong_version_runner.py run --ac-ids --test-root --ac-root --base-ref
      --alterations, one JSON object on stdout, exit 0 iff gate_passed). Never raises for a run
      failure. Verdict: {gate_passed: bool, applicable: bool, verified: bool, outcome: str, reason:
      str|null, results: [{test: str, wrong_version: str, result: caught|survived|did_not_load|
      not_applied|invalid|not_run|not_in_scope|not_applicable, blocking: bool, detail: str}],
      survivors: list, unfinished: list, non_blocking_survivors: list}. Scope is declared: a test
      is in scope only when a "# covers: <AC-ID>" tagged function's name matches a test_spec entry
      of that AC in ac_root carrying must_catch. Needs a git repository at test_root and a
      resolvable base_ref. The manifest is {"entries": [{"name": str, "status": "prepared",
      "files": [{"path": repo-relative str, "altered_copy": path str}]}]}.
  - ac_id: TQ-200d-1
    contract: >-
      The produced-tests scoring mode and its assertion-kind registry (OQ-1 decided: scripts/evals/produced_tests_scoring.py), the row's
      expected object ({negative, fixture, gold_output, assertions}), the git-initialised sandbox,
      and the scored-row record {id, negative, score: {passed, assertions: [{kind, passed,
      detail}], judge}}.
test_required: true
package_surface: false
it_requirements:
- 'The test half calls TQ-500g-1-i''s runner: wrong_version_runner.run_runner in scripts/build_orchestration/wrong_version_runner.py,
  in process or through its run CLI. It runs inside the row sandbox, never against the repository. There
  is no second mutation mechanism, and the eval does not re-classify pytest output itself.'
- 'The runner reads its scope from an AC store and # covers: tags, not from a test path, and needs a git
  base ref. So the row sandbox must carry three things. (1) A git repository whose base commit holds the
  gate before the fix (if refresh_due). (2) The fix (if refresh_due and retry_due) in the working tree
  when the runner is called, so "the gate as written" is the fixed gate. (3) A minimal AC store with one
  record whose test_spec names the produced covers-tagged guarding test with must_catch ["drop the retry_due
  condition"] and in_scope_files naming the fixture gate module. OQ-4 decided: the scorer writes that record
  after the agent has run, from the agent''s # covers: tagged tests, with the must_catch taken from the row,
  so the wrong version is never shown to the agent. The agent works on the pre-fix code; the scorer then
  installs the fix and calls the runner with base_ref set to the pre-fix commit.'
- 'The named wrong version is a prepared alteration in the manifest shape (status prepared, files [{path,
  altered_copy}]) taken from the fixture project, never written by the agent. "The fix undone" comes from
  the runner itself, against the base commit.'
- 'The test half passes only when the verdict has gate_passed true and a caught row for "drop the retry_due
  condition" from the produced test. survived fails the half. Any unfinished result (did_not_load, not_applied,
  invalid, not_run), or a baseline failing on the code as written, also fails it, with the runner''s detail
  quoted in the row result.'
- 'The test half and the report half are scored and recorded separately in the row result (for example
  score.halves.test and score.halves.report, each {passed, detail}). The row passes only when both pass.
  The test half never reads the judge or the report. The report half is a deterministic check that the
  completion report''s "Wrong versions the tests now catch" list names the dropped retry_due condition;
  any judge is secondary (OQ-5 decided).'
- 'The runner launches pytest with sys.executable from the sandbox root, and its recovery journal lives
  under the sandbox''s own <git-dir>/leafcutter/wrong-version-runs/. Nothing may be left in the repository''s
  git dir. The sandbox is removed only after the runner has put the code back.'
- Unit tests never call a live model. O1, O2 and O3 are recorded outputs run through the real runner on
  a real temporary git sandbox. A stubbed judge is used only to prove it is never read for the test half.
- Every new or changed .py file stays at or under 400 counted lines. run_agent_eval.py (1087) must not
  grow, and the runner modules (wrong_version_runner.py 309, _wvr_scope.py 275) are reused, not edited.
test_spec:
- name: test_o1_passes_both_halves
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: criterion
  description: 'O1: the produced test passes on the fixed gate and is caught (assertion failure) under
    "drop the retry_due condition" in a real run_runner call on a git sandbox. Its report names the wrong
    version. Both halves pass, and the row passes.'
- name: test_o2_fails_test_half_whatever_the_report_says
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: discrimination
  description: 'O2: the fixture sets refresh_due but never retry_due, so the runner reports the wrong
    version survived. The test half fails, even though the report claims the catch and a stubbed judge
    returns pass.'
  must_catch:
  - test half taken from the judge verdict
  - test half taken from the report's claim
  - survived result counted as caught
  in_scope_files:
  - scripts/evals/produced_tests_runs.py
  - scripts/evals/produced_tests_scoring.py
- name: test_o3_halves_scored_apart
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: boundary
  description: 'O3: the test half passes and the report half fails. The row fails, and the row result
    shows both halves separately.'
  must_catch:
  - halves merged into one score
  - row passes when only the test half passes
  in_scope_files:
  - scripts/evals/produced_tests_runs.py
  - scripts/evals/produced_tests_scoring.py
- name: test_unfinished_runner_verdict_fails_test_half
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: failure
  description: A produced test that cannot be imported in the sandbox (the runner reports did_not_load
    or a failing baseline), and a run where the manifest entry is missing (invalid), each fail the test
    half and quote the runner's detail.
  must_catch:
  - unfinished runner verdict counted as a test-half pass
  - missing manifest entry ignored
  in_scope_files:
  - scripts/evals/produced_tests_runs.py
- name: test_runner_called_with_declared_scope_and_base_commit
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: seam
  description: The sandbox the scorer hands to run_runner holds an AC record whose test_spec names the
    produced covers-tagged test with must_catch ["drop the retry_due condition"]. It also holds a manifest
    entry for that name, and base_ref is the sandbox's pre-fix commit. The verdict's results name the produced
    test.
  must_catch:
  - base_ref left at HEAD after the fix is committed
  - runner called with no ac_ids
  in_scope_files:
  - scripts/evals/produced_tests_runs.py
- name: test_refresh_row_scored_through_eval_runner_cli
  target_dir: unit_tests/evals/
  framework: pytest
  type: integration
  angle: reachability
  surface_invoked: python scripts/evals/run_agent_eval.py --agent test-writer --score-gold --row refresh-gate
    --results-file <tmp>
  description: run_agent_eval.py with --score-gold scores the refresh-gate row with its recorded gold
    output (O1). The row result carries the runner's verdict for the test half and a separate report
    half, and no file under the repository's git dir changes.
test_rationale: O2 is incident 1 itself, and only a real wrong-version run can fail it. So the tests use
  the shared runner on a real temporary git sandbox, not a judge double, and each bad output carries a
  must_catch on the scoring code that would let it through. The seam test pins the one place this AC
  can silently go wrong, the scope and base ref handed to the runner. A wrong scope there makes every
  verdict invalid, and that must fail the row, never pass it.
