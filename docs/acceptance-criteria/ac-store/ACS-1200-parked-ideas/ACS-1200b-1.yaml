title: "Every health surface that judges a tree by its back-links is enumerated and each one is proven parked-aware"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200b.yaml
criteria: |
  Given an enumeration recorded in the repository of every AC-store surface that
    decides whether a requirement tree is broken by reading a parent's covered_by
    or by deriving a parent id — the store-wide orphan scan among them,
  And a fixture tree consisting of one parent carrying parked: true with a
    non-empty parked_reason and an empty covered_by, plus two child records not
    listed in it,
  When each surface named in that enumeration is executed as a process against
    that fixture,
  Then none of them classifies the fixture as broken, missing, orphaned,
    unlinked, or incomplete,
  And each of them exits with the same status it returns for a fully linked
    tree,
  And a test reads the enumeration and asserts one executed parked-tree
    assertion per entry, so a surface added to the enumeration without such an
    assertion fails that test rather than passing unnoticed,
  And the enumeration is compared against the set of AC-store surfaces
    discovered to read covered_by or derive a parent id, and the comparison
    fails naming any surface present in one and absent from the other,
  And a surface that is patched but left out of the enumeration therefore
    cannot be counted as satisfying this criterion.
