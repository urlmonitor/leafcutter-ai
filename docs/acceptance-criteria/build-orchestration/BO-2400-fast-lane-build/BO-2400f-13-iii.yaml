assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  config_schema_fragment:
    fastlane_occupied_refusal_is_inert:
      type: object
      description: "Not a new payload field — a property of the refusing path, expressed as the set of writes it is forbidden to perform. The refusing path's ONLY outputs are the terminal refusal payload and the process exit status."
      properties:
        forbidden_writes:
          type: array
          description: "Nothing on this list may execute on a refusing run, in the workspace command or in the lane."
          items: {type: string}
          examples:
            - ["git worktree add (with or without -b)", "git branch / git checkout -b", "creating the worktrees/<slug> directory", "git worktree prune", "git worktree remove", "any write inside the occupant", "any write to docs/acceptance-criteria/", "the claim writer (BO-2400f-8)", "the done marker (BO-2400f-9)", "the release writer (BO-2400f-10)", "a marker, lock or state file of any kind"]
        forbidden_dispatches:
          type: array
          description: "The lane must record ZERO agent dispatches after the worktree phase on a refusing run."
          items: {type: string}
          examples:
            - ["resolve-connected", "claim", "test-writer", "coder", "pr-reviewer", "changelog", "commit", "pull-request", "release"]
        permitted_reads:
          type: array
          description: "Exhaustive. Anything not on this list is a scope violation on the refusing path."
          items: {type: string}
          examples:
            - ["git worktree list --porcelain", "stat / listdir of the target path", "git -C <own occupant> status --porcelain (BO-2400f-13-i only)", "git rev-parse --verify --quiet refs/remotes/origin/fast-lane/<slug>", "git rev-parse origin/main"]
  reference_file_path: "templates/workflows-js/fast-lane-ship.js"
  n_location_rule: "1 in templates/workflows-js/fast-lane-ship.js — the Phase 1 guard must RETURN ahead of the Phase 2 `phase(\"Resolve\")` call at :304 — plus the ordering constraint in templates/scripts/setup_ticket_worktree.py that no branch or directory is created before occupancy is decided."
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
    - "python -m pytest unit_tests/workflows/ unit_tests/build_orchestration/ -q"
  constraints:
    - "SPANS BOTH LANGUAGES, and the split matters. Zero-dispatch is a JS property in templates/workflows-js/fast-lane-ship.js (the guard returns before Phase 2). Occupant-untouched and no-new-branch are Python properties in templates/scripts/setup_ticket_worktree.py (an ordering constraint on cmd_create_fastlane_worktree). Satisfying one and not the other satisfies neither criterion. python-coder owns both extensions per config/agent_registry.json."
    - "THE RELEASE TRAP, INHERITED FROM BO-2400f-12-i AND WORSE HERE. The refusing branch must NOT invoke the release step (BO-2400f-10). It precedes the claim by TWO phases, so it holds nothing to release; releasing would flip acceptance criteria a concurrent run legitimately holds in_progress back to todo. It will look correct in review — it is only wrong in the presence of a concurrent run, which is exactly what an occupied workspace signals."
    - "ORDER OF OPERATIONS IS THE WHOLE OF THE NO-NEW-BRANCH CLAUSE. The natural shape of a fix is: compute the branch name, create it, then check the location. That leaves a stray fast-lane/<slug> branch behind on every refusal and nobody notices until the branch list is unreadable. Occupancy must be decided BEFORE _create_fastlane_worktree (:503) is called at all — note that function creates the branch and the worktree in one `git worktree add -b` call, so reaching it at all is already a violation."
    - "THE REFUSING PATH MUST NOT CREATE THE WORKTREES DIRECTORY EITHER. cmd_create_fastlane_worktree currently calls `worktrees_dir.mkdir(parents=True, exist_ok=True)` at :1284, before the lookup. mkdir of the PARENT worktrees/ directory is pre-existing and idempotent, but the per-slug directory must not be created, and the before/after comparison in the covering test will catch a fix that creates it speculatively."
    - "NO PRUNING, EVER, ON THE REFUSING PATH. `git worktree prune` is the tempting reflex when a registration looks stale, and it is a WRITE: it silently deregisters worktrees whose directories are temporarily unreachable (an unmounted volume, a slow network mount). The repeatability test is what catches it — the first run prunes and looks correct, the second sees a different world."
    - "REPEATABILITY IS BYTE-STABLE, not merely 'refuses again'. Two runs against unchanged conditions must name the same occupant for the same reason AND leave the repository identical — same branch set, same registered-worktree set, same occupant content hash, same AC store bytes. A half-fix that leaves one small trace looks correct once and only diverges on the second run."
    - "Prove it by execution, not by grep. A test that greps the refusing branch for the absence of a call proves nothing: the write can happen in a helper the grep never sees, and it passes just as happily when the branch is unreachable — which is the current state of this code."
delivers_to: null
expects_from:
  ac_id: BO-2400f-13
  contract: "The refusing branch itself — the point in Phase 1 at which the run ends on an occupied workspace, before the connected set is resolved and before any agent is dispatched. This criterion adds no new detection and no new payload field; it constrains what that branch is allowed to do."
test_required: true
test_spec:
  - name: test_occupied_workspace_records_zero_dispatches
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "LOAD-BEARING. Under run_workflow_under_e2 with the worktree label stubbed to a refusal, agent_calls contains exactly the worktree dispatch and nothing else — no resolve-connected, no claim, no test-writer, no coder, no review, no changelog, no commit, no pull-request."
  - name: test_refusing_run_does_not_invoke_the_release_step
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "THE INHERITED TRAP. The refusing run records no release dispatch and no claim dispatch — it neither takes nor returns a claim, so a concurrent run's in_progress claims survive it."
  - name: test_refusing_run_creates_no_branch_and_no_workspace
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "REAL SUBPROCESS against a REAL temporary repo with a REAL occupied location: the set of local branches and the set of registered worktrees are identical before and after, and in particular fast-lane/<slug> does not exist afterwards if it did not before. This is the compute-branch-before-checking-location defect."
  - name: test_refusing_run_leaves_the_occupant_untouched
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "After the refusal the occupant's file tree hash, its HEAD sha and its checked-out branch are unchanged, it has not been moved or removed, and the branch it held is still checked out at the same path."
  - name: test_refusing_run_leaves_the_ac_store_byte_identical
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: real_artifact
    description: "Every file under the fixture docs/acceptance-criteria/ is byte-identical before and after the refusing run — no work_status change, no marker file, no rewrite."
  - name: test_repeated_refusal_is_byte_stable
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: "THE HALF-FIX CATCHER. Two consecutive refusing runs against unchanged conditions name the same occupant for the same reason, and the branch set, registered-worktree set, occupant contents and AC store bytes are identical after each — a stray branch, a marker, or a pruned registration only diverges on the second run."
test_rationale: |
  This criterion is entirely negative — the claim is that nothing happened — and a
  negative is the easiest thing in the world to fake. A test that greps the refusing
  branch for the absence of a call proves nothing, because the change can happen in a
  helper the grep never sees, and it passes just as happily when the branch is
  unreachable.

  Prove it the only way that holds. Execute the lane under
  unit_tests/_workflow_engine_harness.py and assert the recorded dispatches are empty
  for the refusing run. Separately, run the workspace command as a REAL SUBPROCESS
  against a REAL temporary repository with a REAL occupied location, and compare the
  repository before and after — the occupant's contents, the set of branches, and the
  set of registered workspaces must all be unchanged.

  The repeatability run is what catches the half-fix: a refusal that leaves one small
  trace behind — a marker, a stray branch, a pruned registration — looks correct once
  and only diverges on the second run.
