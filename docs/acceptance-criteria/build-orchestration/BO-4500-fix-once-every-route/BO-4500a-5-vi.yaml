criteria: |
  Given the precommit-autofix skill and section 5.6 of the building-epics skill after this change,
  When their instructions for staging and committing are read,
  Then each directs the reader to record a commit by calling the shared commit step,
  And neither contains an instruction to stage all tracked files, stage all changed files,
    stage "all files in scope", or record a commit directly.

  Given the building-epics skill's section 5 commit lock, which names a helper that was never
    written,
  When the section is read after this change,
  Then it states that commits are kept apart by the shared step (BO-4500a-4-ii) and names no
    helper that does not exist.

  Given the two skills' recipes before this change and the shared step after it,
  When the migration is reviewed,
  Then precommit-autofix's single-retry rule is present in the shared step before the skill is
    moved,
  And the BO-210c-2 regression tests run against the shared step and pass.
