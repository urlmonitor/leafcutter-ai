notes: |
  Behaviour (b) of the four the parent BO-400e names. The parent warns that folding this
  into (a) causes (a) to be built as "trust the caller" and the guard to be quietly
  deleted, so it is authored as its own record.

  THIS RECORD IS WHERE TWO OF THE THREE NAMED WRONG FIXES DIE.
    - FIX ONLY THE REFUSAL (make the strict path stop refusing, leave the lenient path
      alone). Fails the first Then: the finished state is not written. The lenient branch
      is the worse of the two -- it wrote done onto a ticket whose source AC still read
      work_status: todo, which check-ticket-ac-status-parity then had to catch at commit
      time.
    - CONVERGE BY LOOSENING (unify on the permissive answer, by the blanket override or by
      dropping the parity check). Fails the same clause, and separately fails the clause
      that the record must still name the phase as needed afterwards -- which is the
      behavioural form of "the remedy for a record that asks for the wrong thing is to
      correct the record, never to soften the reader".

  THE CONTROL CASE IS NOT OPTIONAL. BO-400a-2-iii learned this the hard way: a driver
  reverted to never writing at all satisfies every refusal clause and looks correct. The
  second ticket, in the same run, is what makes the refusal attributable to the missing
  sign-off rather than to a writer that has stopped.

  DELIBERATE CONSEQUENCE, NOT A SHORTFALL. Once this lands, work whose record still
  demands a step it never got is refused reliably where before it slipped through roughly
  two times in three. That is more halts, and it is correct. The one-time correction of
  the existing population, and a pre-dispatch check that catches such a record before a
  drive spends hours on it, are both real needs and neither belongs in this record.

  VERIFY BY EXECUTION, NEVER BY GREP -- the parity check already exists in the source, so
  a structural test passes on the broken driver. BOTH TWINS IN ONE CHANGE, per
  BO-400a-2-ii's standing constraint.
