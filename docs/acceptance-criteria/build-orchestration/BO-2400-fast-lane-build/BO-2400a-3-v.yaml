notes: |
  This is the change of intent, not a fidelity fix: it deliberately replaces the
  "every newly added test must fail" rule that BO-2400a-3 states and the "a
  green-at-baseline test is a hard halt, never a warning that proceeds" rule that
  BO-2400a-3-i stated. Both of those are amended, not silently overridden — see the
  amended_by entries on BO-2400a-3 and BO-2400a-3-i.

  Why the weaker rule is still a real gate: the property the gate must prove is that
  something in the batch's new tests constrains the implementation the coder is about to
  write. One red newly-added test proves that. Requiring all of them to be red proves
  something stronger that is simply not true of a partially-implemented acceptance
  criterion, and blocks the majority of real work — observed live on TKT-600a-1, where
  two of four newly-written tests were green because the depends_on half of the
  criterion already existed.
