notes: |
  THE FAILURE MODE THIS RECORD EXISTS TO EXCLUDE IS THE ONE THE PO NAMED AS PASSING
  EVERY OTHER CRITERION IN THE TREE. It is entirely possible to end up with every
  specialist correctly informed, every kind of file covered, and every figure faithful,
  by hand-editing each specialist's instructions once. That world satisfies a, c, d and
  f on the day it ships. The only observation that separates it from the world the user
  asked for is what happens when you take the hand edits away: in one world nothing
  changes, in the other every specialist goes silent.

  THE REMOVAL IS A THOUGHT EXPERIMENT MADE EXECUTABLE, AND THAT IS THE POINT. It is not
  a refactoring instruction and no permanent deletion is being specified — the arm is a
  reversible experiment run over the project as it stands, exactly as GE-127e-2's
  paired runs are. What makes it worth the trouble is that it is the only arm in this
  tree that cannot be passed by an implementation that is merely correct.

  THE THIRD ARM IS THE USER'S REQUEST IN ITS PLAINEST FORM. "All agents working on that
  kind of file know about this" is a claim about agents that exist, agents that will
  exist, and agents nobody thought about when the standard was set. An owner added to
  the ownership record and correct thereafter, with nothing written about it, is that
  claim discharged.

  WHY THIS IS NOT INF-1200c. c asks whether the audience is complete. This asks where
  the statement lives. A project could inform its complete audience entirely by hand
  and pass c; a project could hold zero authored statements and still miss half its
  owners, passing this and failing c. The two are orthogonal and both are needed.

  NAMED MUTATION — EXECUTE IT, DO NOT MERELY DESCRIBE IT. Written so the IT PO can lift
  it verbatim into a test descriptor.

  MUTATION: pick one specialist that owns a kind of file carrying a standard. Restore a
  hand-authored, currently-correct statement of that standard into that specialist's
  own instructions, and exclude that specialist from the derived delivery. Under that
  injection:
    - that specialist remains correctly and faithfully informed, so INF-1200a-1,
      INF-1200c-1 and INF-1200f-1 all STAY GREEN for it;
    - the removal arm of this record must go RED, because stripping authored references
      now silences that specialist;
    - the change-the-declaration arm must go RED, because that specialist's figure no
      longer moves with the declaration.
  All outcomes must be observed and all must revert. If the removal arm stays green
  under this injection, the removal was not reaching authored instructions and the arm
  is measuring nothing.

  A SECOND, CHEAPER MUTATION WORTH RUNNING IF THE FIRST IS AWKWARD TO STAGE. MUTATION:
  make the derived delivery emit a specialist's standards only when that specialist's
  authored instructions already mention standards — an "opt-in" flag. Under it the
  removal arm goes RED and the newly-added-owner arm goes RED, while a specialist that
  already opted in stays green. Opt-in is a plausible, defensible design and it
  reintroduces the hand edit under a different name.

  MEASURED, 2026-09-09, IN THIS WORKTREE. Exactly one specialist's authored instructions
  refer to a standard, in several places including a trigger that makes it stop and ask
  before producing over-length work. That single file is the whole surface the removal
  arm currently touches, and INF-1200f-2 requires it to come out of this no less useful
  than it went in.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale and declares_side_effect. Those are the IT PO's. Both
  mutations above are written to be turned directly into test descriptors.
