id: GE-113c-3-ii
components:
  - commit_guardian
title: "A longer allowlist path does not shadow a shorter finding path"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: critical
criteria: |
  Given the security allowlist contains the entry "ENTROPY_HIGH:src/config/foo.py:*",
  And the secrets scanner detects an ENTROPY_HIGH finding in the root-level file "foo.py",
  When the scanner evaluates whether the allowlist entry suppresses the finding,
  Then the finding at "foo.py" is NOT suppressed,
  Because the allowlist path has 3 segments ["src", "config", "foo.py"] and the
    finding path has 1 segment ["foo.py"] — a 3-segment allowlist path cannot be
    a suffix of a 1-segment finding path.

  Given the security allowlist contains the entry "ENTROPY_HIGH:src/config/foo.py:*",
  And the secrets scanner detects an ENTROPY_HIGH finding in the file "src/config/foo.py",
  When the scanner evaluates whether the allowlist entry suppresses the finding,
  Then the finding at "src/config/foo.py" IS suppressed,
  Because the path segments match exactly.
