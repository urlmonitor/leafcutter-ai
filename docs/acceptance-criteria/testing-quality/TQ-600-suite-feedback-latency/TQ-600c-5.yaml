notes: |
  A GUARD NOTHING INVOKES IS THE PUREST FORM OF THE DEFECT THIS TREE IS ABOUT. It
  is worse than absent, because its existence is cited as the reason nobody needs
  to watch the runtime. This repository has the precedent on file: a commit hook
  documented in its own README as live with enforcement enabled, which appeared in
  no manifest anywhere and had never run. Every other AC under TQ-600c — the
  record, the failing verdict, the derived budget, the per-test regression — is
  satisfiable in full by a guard that nothing ever calls.

  THE FOURTH CLAUSE IS THE UNUSUAL ONE AND IT IS THE POINT. Most checks fail loudly
  when they break; a check that is merely unregistered fails silently and
  indistinguishably from a clean run. Requiring the verification to notice an
  absent guard is what converts "the guard was removed" from an invisible event
  into a reported one — the same distinction between examined-nothing and
  found-nothing that runs through TQ-600c-2 and TQ-600c-2-i.

  SCOPE BOUNDARY: this AC says nothing about the guard's logic, which is TQ-600c-2
  and TQ-600c-4, and nothing about the budget's value, which is TQ-600c-3. It is
  about invocation and consequence only. Keeping it separate matters, because
  reachability is the property most often assumed by the tests for the other three.
