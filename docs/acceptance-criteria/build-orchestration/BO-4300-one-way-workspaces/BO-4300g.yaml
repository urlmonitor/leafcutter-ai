id: BO-4300g
title: "A workspace is removed only when the workflow that asked for it says so"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: critical
roadmap_phase: phase_1
criteria: |
  Nothing is cleared away because an agent happened to overhear a "yes".

  A workspace or a line of work is removed only when the workflow that sent the request
  names exactly that workspace and that line of work in the request itself. A "yes" said
  somewhere else in the conversation, or one the agent asked for and then answered for
  itself, removes nothing, and permission for one workspace never reaches its neighbour.
  Steps that only look things up or run one command are handled by helpers that cannot
  remove anything at all, and finalize's own tidy-up names its exact workspace -- or, when
  it cannot be sure which one that is, leaves everything as it was.
depends_on: [BO-4300, BO-4300e]
