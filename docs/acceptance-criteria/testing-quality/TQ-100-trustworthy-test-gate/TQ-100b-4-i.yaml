assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The fail-safe direction is the whole point of this AC and is non-relaxable: for a capture in tag position, the id-shape test may only change WHICH report the capture lands in, never WHETHER it is reported. A shape-invalid capture in tag position that produces no output at all is a defect, not a narrowing."
  - "The malformed-tag report and the dangling-reference report must be separately addressable in the reader's output structure (two distinct keys/classes), so a consumer such as the TQ-100c-2 linkage-integrity check can act on 'this id no longer exists' differently from 'this is not an id at all'. A single flat list with a severity string does not satisfy this."
  - "Every malformed-tag record must name the file, the test function, and the captured value verbatim. A count, or a message naming only the file, is not actionable and does not satisfy the criterion."
  - "Detection must be driven by the tag's presence and position, never by a hard-coded list of known-bad values. A value never seen before (a fresh typo) must be reported on its first appearance with no code change."
  - "Position determination must reuse the existing AST-based definition already implemented in scripts/commit_guardian/check_test_ac_tags.py (comment line immediately above the def, docstring, first body line) rather than a second, independently written one — two position rules is the same drift TQ-100b-5 guards."
  - "The malformed-tag report must not, by itself, change the run's pass/fail outcome in this AC's scope. Whether a malformed tag blocks is TQ-100b-1-ii's and TQ-100c's decision; this AC only requires that the information reaches them. Do not silently couple the two."
test_spec:
  - name: test_malformed_tag_in_tag_position_is_reported_as_malformed
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    description: "Plant '# covers: TQ-100b_4' (underscore where a hyphen belongs) in tag position above a real test function inside a real on-disk copy of the test tree, run the reader over that tree, and assert a malformed-tag record exists naming the file, the test function, and the captured value verbatim. Asserting against a hand-constructed input string handed to the pattern does not satisfy this entry."
  - name: test_malformed_tag_is_a_distinct_report_class_from_dangling_reference
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    description: "In a single run over one tree containing both a shape-invalid tag ('# covers: TODO') and a well-shaped-but-unresolvable tag ('# covers: ACS-999z-9'), assert the two land in separately addressable output classes and that neither appears in the other's list. Covers the malformed-but-parseable shape boundary the id-shape test introduces."
  - name: test_malformed_tag_survives_to_the_done_proof_entry_point
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: reachability
    description: "Run the done-proof scan through its production entry point as a subprocess over the tree carrying the planted malformed tag and assert the malformed-tag record is present in the emitted output. Proves the report is not dropped between the scan and what the gate actually consumes — a report computed but never surfaced is indistinguishable from the false negative this AC exists to prevent."
  - name: test_removing_the_planted_tag_line_removes_the_report_and_nothing_else
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: failure
    description: "Negative control through the same entry point: rerun over the identical tree with only the planted tag line deleted and assert the malformed-tag report is empty while every other record in the run is byte-identical to the previous run. This is what falsifies the false-negative inversion — it fails both if the reader silently drops shape-invalid tags (nothing reported in the first run) and if the report is driven by a fixed value list rather than by the tag's presence."
delivers_to: null
