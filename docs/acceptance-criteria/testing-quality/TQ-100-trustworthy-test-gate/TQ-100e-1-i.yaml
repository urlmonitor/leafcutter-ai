it_requirements:
  - "In report-only mode the overall run outcome must be non-failing even when a would-otherwise-block test (e.g. a failing test on a done AC) is present — full visibility, zero blocking."
  - "Results must still be surfaced/reported (the failures are visible), so report-only is informational, not silent."
  - "Behavior must be deterministic under pytest-randomly: report-only never blocks regardless of seed/order."
