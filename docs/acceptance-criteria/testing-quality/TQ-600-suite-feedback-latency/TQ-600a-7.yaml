assigned_agent: documentation-expert
estimated_complexity: M
it_requirements:
  - >-
    SURFACE DECISION, WHICH THE BA EXPLICITLY LEFT HERE: the one account of the
    declaration lives in a new page, `docs/testing/shared-reference-layout.md`.
    `unit_tests/README.md` and the standing rule in the root `CLAUDE.md` point at
    it; neither carries a second procedure. One account, two pointers.
  - >-
    THE DOC-LENGTH RATCHET DECIDES THAT SURFACE AND IS NOT NEGOTIABLE BY PROSE.
    Verified at enrichment against the resolved known-issue record: `check-doc-length`
    refuses a commit in which a file already over the 300-line limit GROWS, and
    passes a file that shrinks or holds steady. `docs/testing/README.md` is 326
    lines and the root `CLAUDE.md` is 820 — both already over. Consequences, all
    three load-bearing: new material goes in a new file; any pointer added to
    `docs/testing/README.md` must be offset by at least as many lines removed in
    the same commit; and the `CLAUDE.md` edit must be a replacement that does not
    increase that file's line count. `unit_tests/README.md` is 228 lines and has
    room. The gate is PRE-COMMIT ONLY — `.github/workflows/ci.yml` does not run
    it — so a violation is invisible to CI and appears only as a local refusal.
  - >-
    THE CLAUDE.md RECONCILIATION IS AN ABSENCE PLUS A NAMING, AND IT IS THE
    LOAD-BEARING HALF OF THIS AC. Verified at enrichment: the sentence sits at
    `CLAUDE.md` line 416. After this change the exact sentence "Until that fixture
    exists, the prohibition alone applies" must appear nowhere in the root
    CLAUDE.md, and the rule must name the registered declaration and link to the
    guide. That rule is loaded into every agent's context: while it is
    unreconciled it is the louder of the two accounts and it is the wrong one.
  - >-
    QUOTE THE MECHANISM, NEVER PARAPHRASE THE INTENT. Every marker name, flag,
    path and command shown must be copied from what TQ-600a-5 actually registered
    in `pytest.ini` and what TQ-600a-1 actually delivers. A documented marker
    differing by one character from the registered one is treated as an honest
    omission, routed to the unshared path, and costs 59.8s per test with no error
    anywhere — the silent route is the expensive one.
  - >-
    PUBLISH AFTER THE MECHANISM LANDS, NOT BESIDE IT. This AC is implemented
    against merged TQ-600a-1, TQ-600a-2 and TQ-600a-5. A guide written ahead of
    delivery documents an intention, and a plausible intention is
    indistinguishable from a correct account until a reader tries the declaration.
  - >-
    CROSS-LINK WITH TQ-600b-6 RATHER THAN RESTATING IT. Running the suite and
    declaring a test are different questions with one reader. A second account of
    the other's half is exactly the drift TQ-600b-6's agreement clause forbids.
  - >-
    THE NEW PAGE MUST BE COMMITTABLE AND REACHABLE: it carries the YAML
    frontmatter `check-doc-frontmatter` requires and is linked from the doc index
    and from the two pointer surfaces. A guide nobody can navigate to satisfies
    every clause about its contents and teaches nobody.
  - >-
    VERIFY THE GATES FROM INSIDE THE WORKTREE. Commit-guardian hooks resolve
    their target set from the current working directory; invoked with absolute
    paths from elsewhere they examine nothing and exit 0, which is
    indistinguishable from a pass. Run them with `env --chdir=<worktree>` and
    worktree-relative paths, and read silence as "it examined nothing".
