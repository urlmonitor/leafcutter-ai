title: "Two units of work finishing at the same time do not route the same learning twice, and do not lose it between them"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
priority: high
readiness: reviewed
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-700a-5.yaml"
criteria: |
  Given one sink now serves a whole install rather than one working directory,
    and more than one unit of work runs in that install at a time — isolated
    working directories exist so that they can, and three at once is ordinary
    practice here,
  And each of them reaches its completion sequence independently, reads that
    one sink, and publishes its writes on its own branch,
  When two units of work reach their routing step close enough together that
    both see the same record,
  Then that record's learning is written to its destination file once and not
    twice, and the run that did not write it says it did not,
  And the record is not left unwritten by both of them: two routing steps
    arbitrating over the same record must not each conclude the other has it,
  And the bookkeeping that records a routing decision is not corrupted,
    truncated or half-written by two units of work updating it at once — after
    both have finished, it is readable and describes a state both runs agree
    with, rather than one that describes neither,
  And the two ways this fails are told apart, because they need different
    answers: where both branches reach the merged tree, the failure is the SAME
    LEARNING WRITTEN TWICE, which a reader sees as a duplicate; where one branch
    does not, the failure is a LEARNING LOST WHILE MARKED AS ROUTED, which no
    reader sees at all. The second is the one that must not happen, and a
    solution that trades it for the first is a solution,
  And no unit of work waits on another's knowledge step to finish its own work:
    the outcome of the work, its failure count and the driver's exit status are
    the same as they are when it is the only unit of work running, and two
    units of work that both complete still both complete,
  And whatever arbitrates this is exercised rather than assumed — a run in
    which two routing steps genuinely overlap produces one write, and an
    implementation in which the arbitration is present but never reached
    produces two and is distinguishable from the first by that.
