criteria: |
  Given the derived intra-package dependency closure of BP-900g-8,
  And a deployed script A that resolves module B, where B in turn resolves module C,
    and C is not deployed,
  When the deploy-completeness preflight runs,
  Then the build exits non-zero naming C, so a chain that is correct at its first hop
    and broken at its second is caught rather than passed,
  And given a module D newly added to the package and resolved by an already-deployed
    script, with no edit made to any manifest, list, or allowlist,
  When the same preflight runs,
  Then D is either deployed or named in a build failure — the closure covers it
    because it was derived from the code, and a run in which D is silently ignored
    means the closure is still reading a hand-maintained list and this criterion is
    not met,
  And given a deployed script that resolves a module from outside the package — the
    standard library, an installed third-party distribution, or a host-project path
    the consumer owns — that module produces no finding, so the closure does not
    demand the build ship what it does not own,
  And each of these three shapes is exercised by building into a temporary target and
    inspecting the deployed tree, not by reading the manifest and agreeing with it,
  Because the fourth instance of this defect at HEAD arrived after three prior
    instances had each been fixed individually and annotated with a warning comment;
    a closure that a new module can slip past reproduces that history exactly, and a
    closure derived from the very map it is auditing agrees with it by construction
    and detects nothing.
