assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - >-
    RECEIPT IS A PRECONDITION OF A VERDICT, NOT A PROPERTY INFERRED FROM ONE. The run must hold
    positive evidence that a guard received its input before it records anything other than
    never-attempted or blocked. Absence of evidence is never approval, and an exit code obtained
    from a process that read nothing is not an answer to a question that was never put.
  - >-
    THE TWO HONEST VALUES ARE NOT INTERCHANGEABLE AND MUST NOT BE COLLAPSED.
    config/verification_flow.schema.json's `unverified` means the attempt was never made;
    `blocked` means the attempt could not be run to a verdict. They mean different things to a
    reader — the first is a to-do, the second says something is in the way — and collapsing them
    turns a work list into a shrug. Both must also be distinguishable in the run's output from a
    guard that was genuinely asked and allowed the input through, which is a third and separate
    report.
  - >-
    THIS CONSTRAINT IS ABOUT THE RUN'S OWN DISCIPLINE, NOT ABOUT ANY GUARD'S. It must hold for a
    guard that does legitimately read a command line: such a guard invoked the wrong way may well
    answer, and the run must still not count that answer, because it is not the answer the
    protected surface would have got. Do not implement this as a check on whether the guard reads
    argv.
  - >-
    ARRIVAL COLOUR IS GREEN AND VACUOUSLY SO — the parent record says this, and it is why the
    injection below is mandatory rather than illustrative. Nothing examines these guards today, so
    nothing currently reports a clean exit as a demonstration. A green descriptor that has never
    been able to go red is not coverage; run the injection.
  - >-
    AC_ENFORCE_STRICT=1 on every pytest invocation below. Error-handling policy applies to the
    subprocess I/O: specific exception types, logged at WARNING or higher or re-raised. A
    swallowed invocation error is `blocked`, never an absent record and never a pass.
test_spec:
  - name: test_ge129a3i_a_guard_handed_a_path_and_no_payload_is_never_recorded_as_having_answered
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      THE DECISIVE DESCRIPTOR. A fixture guard that reads only the editor's payload, started as a
      plain command with the path of a known-bad file in argv and nothing on stdin, reads nothing,
      objects to nothing and exits cleanly. Assert the run reports it as never asked or as an
      attempt that could not be run to a verdict — distinguishably, under its own wording — and
      NOT as having demonstrated a refusal, and NOT as the declared input having been accepted.
      PAIRED IN THE SAME RUN, and this half is what stops the descriptor being satisfied by a run
      that refuses everything: a guard given the editor's own account of the tool call, which
      stops it, is reported as having demonstrated its refusal.
  - name: test_ge129a3i_the_bare_command_injection_reddens_this_record_and_leaves_its_parent_green
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: failure
    description: >-
      THE INJECTION THAT JUSTIFIES A SEPARATE RECORD — MANDATORY, RUN IT, AND OBSERVE BOTH HALVES
      OF THE ASYMMETRY. Inject: examine each guard by starting it as a command with the known-bad
      path in argv and read its exit status as the verdict. Assert this record's descriptors go
      RED, and assert GE-129a-3's descriptors over a guard that does read a command line stay
      GREEN under the same injection. Revert and assert both return. Recording only the red half
      proves the injection broke something, not that it broke this.
  - name: test_ge129a3i_never_asked_and_could_not_be_run_are_distinguishable_in_the_runs_output
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      One run over a fixture surface holding (a) a guard the run never attempted, (b) a guard the
      run attempted but could not carry to a verdict, and (c) a guard that was asked and allowed
      the input through. Assert all three are reported under three distinct wordings and that no
      two are merged. NAMED MUTATION (mandatory): collapse `blocked` into `unverified`. This
      descriptor must go RED while GE-129a-3's descriptors stay green.
test_rationale: |
  This record's arrival colour is green and vacuously so, which makes it the one descriptor set in
  this tree that cannot be validated by watching it turn green. Its content is entirely in the
  injection: the cheapest wrong implementation available on this surface — start the script, pass a
  path, read the exit code — needs no understanding of how the editor talks to a guard, runs
  everywhere, and on day one produces a quiet, complete and entirely false report.

  The second descriptor therefore asserts the asymmetry in BOTH directions rather than only the red
  half. A mutation that reddens the whole suite has located nothing, and this record's whole claim
  to a file of its own is that its mutation reddens it and leaves its parent standing.
