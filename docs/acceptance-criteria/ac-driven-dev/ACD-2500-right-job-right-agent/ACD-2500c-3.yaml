id: ACD-2500c-3
components:
  - ac_driven_dev
  - testing_quality
  - build_orchestration
readiness: approved
priority: high
title: "Each test-design entry is tied to its outcome clause and the design carries its author"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the store holds test designs produced by the code-aware step and designs written by
    the technical planner before this change,
  When the store's record check reads them,
  Then a design produced by the code-aware step is accepted with its authorship mark (step
    name and date), its list of opened files, and on every entry the outcome clause it
    proves,
  And a legacy design without those fields is also accepted, and is reported as legacy by
    any query that asks for designs by author,
  And an entry carrying a key the store does not know is rejected, naming the key, so each
    later per-entry addition has to be specified before it can be written.
depends_on:
  - ACD-2500c
  - ACD-2500c-1
doc_links:
  - path: docs/reference/ac-schema.md
    relationship: describes
    status: exists
  - path: docs/testing/test-angles.md
    relationship: related
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
- 'Extends the test_spec item schema in config/ac_store_schema.json with the per-entry keys the code-aware
  step writes (outcome clause proved, code file exercised, to-be-created flag, convention test file) and
  adds record-level provenance (authorship mark {step, date}, opened-files list). additionalProperties:
  false stays on test_spec items.'
- 'Builds ON the existing optional test_spec[].must_catch (TQ-500f-2, PR #911: non-empty list of non-blank
  strings, copied verbatim onto the ticket and kept identical in shape to config/test_requirements.schema.json)
  and the existing angle value ''discrimination'' (TQ-500f-1). Neither is redefined, renamed or re-shaped
  here; the new per-entry keys are added alongside them.'
- 'The design-entry key set otherwise stays closed: any key the schema does not declare is rejected, naming
  the key, at every enforcement point (the check-ac-schema hook including its manual fallback, and
  validate_ac_schema.py).'
- 'Declaration rule (settled on the TQ side, 2026-09-27): the presence of must_catch, or of angle ''discrimination'',
  on a test_spec entry IS the test designer''s bug-fix/gate declaration. No new schema key is added for
  that declaration.'
- 'Writer rule: only the code-aware test-design step (ACD-2500c-1 / ACD-2500d-5) writes must_catch; the
  technical planner (it-po) never does.'
- 'Legacy test_spec (no provenance, no new keys) stays valid: the new keys are optional in the schema,
  and their presence on code-aware designs is enforced by ACD-2500c-1-i, not by the schema.'
- The ticket generator passes the new keys through or drops them without producing a ticket that violates
  config/test_requirements.schema.json (the two schemas are coupled by hand).
- Field rows are added to docs/reference/ac-schema.md in the same change.
- A by-author query in the store's existing reporting tooling returns code-aware designs by step and lists
  the rest as legacy.
- The commit-time check and validate_ac_schema.py read the one schema file and give identical verdicts.
delivers_to:
- agent: python-coder
  contract: 'Code-aware test design = the record''s test_spec list, each item carrying the existing keys
    (name, target_dir, description, framework, type, angle) plus the ACD-2500c-3 per-entry keys (the outcome
    clause it proves, verbatim test_intent.clause text; the code file it exercises; a to-be-created flag;
    the neighbouring test file cited as convention), and record-level provenance: authorship mark {step:
    <code-aware agent id>, date: YYYY-MM-DD} and the list of repository files the step opened (repo-root-relative
    POSIX). Optional must_catch (TQ-500f-2: non-empty list of non-blank strings, copied verbatim onto the ticket) and angle ''discrimination'' are written only by the code-aware step; their presence on an entry is that step''s bug-fix/gate declaration (no separate declaration key). No other undeclared key. Read by ACD-2500b-2, ACD-2500b-3 and ACD-2500c-1-i.'
- agent: llm-expert
  contract: 'Code-aware test design = the record''s test_spec list, each item carrying the existing keys
    (name, target_dir, description, framework, type, angle) plus the ACD-2500c-3 per-entry keys (the outcome
    clause it proves, verbatim test_intent.clause text; the code file it exercises; a to-be-created flag;
    the neighbouring test file cited as convention), and record-level provenance: authorship mark {step:
    <code-aware agent id>, date: YYYY-MM-DD} and the list of repository files the step opened (repo-root-relative
    POSIX). Optional must_catch (TQ-500f-2: non-empty list of non-blank strings, copied verbatim onto the ticket) and angle ''discrimination'' are written only by the code-aware step; their presence on an entry is that step''s bug-fix/gate declaration (no separate declaration key). No other undeclared key. Written by the code-aware agent (ACD-2500c-1).'
expects_from: null
test_spec:
- name: test_code_aware_design_accepted_with_provenance
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: A design with the authorship mark, opened files and a clause on every entry is accepted.
  angle: real_artifact
- name: test_legacy_design_accepted_and_reported_legacy
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: A legacy design validates and the by-author query reports it as legacy.
- name: test_unknown_entry_key_rejected_naming_key
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: An entry with an undeclared key is rejected and the message names the key.
  angle: failure
- name: test_code_aware_entry_with_must_catch_and_discrimination_accepted
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: A code-aware entry carrying the new per-entry keys together with the existing must_catch and
    angle 'discrimination' is accepted, and the generated ticket entry carries must_catch verbatim.
  angle: seam
- name: test_generated_ticket_valid_against_test_requirements_schema
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: A ticket generated from a code-aware design validates against config/test_requirements.schema.json.
  angle: seam
