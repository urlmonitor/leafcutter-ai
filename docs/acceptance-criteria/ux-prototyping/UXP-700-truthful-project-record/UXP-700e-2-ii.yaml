declares_side_effect: true
estimated_complexity: M
change_target:
- code
- schema
risk_surface: contract_boundary
it_requirements:
- Generate compatibility labels from the same checked metadata used by the validator; repeated generation
  without changed sources must be byte-stable. Never write contract text into a description.
- Preserve the authored description, contract metadata and unrelated flow fields while updating only
  generator-owned representations. Validation must report drift without silently repairing it.
- The description gates are errors from the start because the same change migrates every flow. Keep the lint's
  false positives near zero with explicit allow-rules and a plain-English negative control.
- actor_kind is required on steps and optional on branches; its four values mirror ADR-053's mechanisms.
expects_from:
  ac_id: UXP-300-1
  contract: 'Flow JSON at docs/product-truth/flows/**/*.flow.json: contract_definitions is a map from
    reference label to {schema?: string, model?: string, authority?: runtime|source_reviewed|illustrative_design,
    note?: string}; each node has io_contracts with consumes/produces arrays of {contract: string, fields:
    [{path: JSON-pointer string, types: JSON-type string[], required: boolean, default?: JSON value, applies?:
    string}]}. Optional means absent, not null unless explicitly allowed. Contract labels are not payload
    wrapper keys.'
delivers_to:
  agent: frontend-coder
  contract: The canonical generator derives node consumes/produces string arrays from io_contracts and
    writes no contract text into a step or branch description; Atlas may omit those derived labels only
    when it can display the structured metadata.
test_spec:
- name: test_generator_repairs_only_derived_contract_presentation_and_is_idempotent
  target_dir: unit_tests/product_truth/
  description: Run the real generator after source metadata changes, read the serialized flow, verify
    the description is unchanged with no contract text added and a second run is byte-stable.
  framework: unittest
  type: integration
  angle: reachability
- name: test_cli_checks_visible_labels_and_is_read_only
  target_dir: unit_tests/product_truth/
  description: The canonical validator rejects edited compatibility labels without rewriting the record.
  framework: unittest
  type: integration
  angle: failure
- name: test_validator_rejects_contract_text_in_description_without_repairing_it
  target_dir: unit_tests/product_truth/
  description: The canonical validator rejects an old-style description carrying generated contract text,
    and neither it nor the generator rewrites it.
  framework: unittest
  type: integration
  angle: discrimination
- name: test_a_description_at_the_bound_passes_and_one_past_it_fails
  target_dir: unit_tests/product_truth/
  description: The length bound admits a description exactly at the limit and refuses one character more.
  framework: unittest
  type: unit
  angle: boundary
- name: test_plain_english_sentences_pass
  target_dir: unit_tests/product_truth/
  description: Negative control; plain sentences with slashes, abbreviations, step(s), entity and product
    names pass the code-token lint.
  framework: unittest
  type: unit
  angle: discrimination
- name: test_each_code_shaped_token_is_rejected_with_its_reason
  target_dir: unit_tests/product_truth/
  description: Each code-shaped family (backticks, files, paths, identifiers, calls, ids, flags, build status,
    second sentence, generated text) is rejected with its named reason.
  framework: unittest
  type: unit
  angle: criterion
- name: test_the_checker_fails_on_a_code_shaped_description_and_names_the_step
  target_dir: unit_tests/product_truth/
  description: The real checker CLI fails a store holding one code-shaped description and names the step.
  framework: unittest
  type: integration
  angle: reachability
- name: test_an_unknown_or_missing_step_kind_is_rejected
  target_dir: unit_tests/product_truth/
  description: The flow schema refuses an actor kind outside the four values and a step without one.
  framework: unittest
  type: unit
  angle: failure
test_rationale: The real generator-to-file-to-validator round trip covers criterion, seam and real-artifact
  obligations together. It distinguishes canonical derivation from a second manually synchronized copy.
test_required: true
