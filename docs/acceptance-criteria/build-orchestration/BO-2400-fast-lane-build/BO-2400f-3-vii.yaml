test_required: true
test_spec:
- name: test_wv_list_reply_with_leading_log_line_is_read_and_build_continues
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: criterion
  description: >-
    Run the fast-lane-ship template under the workflow engine harness with the fastlane-wv-list
    reply's stdout set to "base ref HEAD: 0 names declared, 0 derived\n{\"owed\": [], \"error\": null}".
    The run does not halt at the wrong-version list step and goes on to the finish step / commit, exactly
    as it does for a clean reply.
  must_catch:
  - wvStep still JSON.parses the whole stdout, so the leading log line makes it return null and halt.
- name: test_wv_reply_without_json_halts_quoting_the_received_reply
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: failure
  description: >-
    With the fastlane-wv-list reply's stdout set to text holding no JSON object, the run halts
    before commit, opens no pull request, releases the claim, and the halt message contains that received
    text and does not end in "did not pass: null".
  must_catch:
  - The halt message still reports null instead of the reply that was received.
  - The parse is loosened to accept anything, so a reply with no JSON object no longer halts.
- name: test_wv_reply_takes_the_last_json_object_line
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: discrimination
  description: >-
    With stdout holding two JSON object lines, the first {"owed": [], "error": "earlier"} and
    the last {"owed": [], "error": null}, the run continues (the last line decides); with the order swapped
    it halts.
  must_catch:
  - The first JSON-looking line is taken instead of the last.
- name: test_scratch_and_knowledge_routing_commands_name_the_workspace_scripts_absolutely
  target_dir: unit_tests/workflows/
  framework: pytest
  type: behavioral
  angle: criterion
  description: >-
    In the recorded dispatches of a harness run, the scratch-item and knowledge-routing-step
    prompts each name their script as a quoted absolute path that starts with the run's workspace path
    followed by the install's output root, and neither contains a bare cwd-relative ".leafcutter/scripts/"
    invocation.
  must_catch:
  - Either command still runs `python {{config.output_root}}/scripts/...` relative to the agent's cwd.
test_rationale: The defect lives in how the template reads one reply and spells two commands, so the
  proof runs the real template under the workflow engine harness and asserts on its recorded dispatches
  and terminal payload, never on the source text. The failure and discrimination tests stop a fix that
  simply accepts any reply, or picks the wrong line, from passing.
