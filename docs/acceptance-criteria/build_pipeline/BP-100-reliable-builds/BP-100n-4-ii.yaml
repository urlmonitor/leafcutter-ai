notes: >-
  WHY THIS IS NOT PARANOIA. This repository has shipped guards that exit 0 having examined
  nothing at least four times on the commit-guardian surface alone: KI-CG-034 (169 files
  examined, 169 skipped, zero compared, exit 0), KI-CG-012 (a clean pass on a file never
  validated), KI-CG-018 (exits 0 without inspecting anything, and its own "did I look?"
  diagnostic cannot fire on the paths where it did not), and the AC-store validator's
  bare-directory no-op, which made the documented defence against store rot itself a no-op
  for eight days while reporting clean the whole time. The check specified in BP-100n-4 has
  two independent populations to resolve, either of which can come back empty, so it has two
  new routes into that state on the day it lands.


  THE POSITIVE-COUNT FORM IS DELIBERATE. "Fails when it compared nothing" and "states how
  many it compared" are not the same requirement. The first can be satisfied by a guard on
  one code path; the second makes the empty state unrepresentable in the output, so a
  reader — human, agent, or CI log grep — can tell the two runs apart without knowing which
  branch was taken. Prefer the second and derive the first from it.


  MUTATION FOR THE ABSENCE-ASSERTING CLAUSE. "In neither situation does it state a count of
  zero scripts invoked by nothing" asserts that a clean verdict is NOT emitted, and on any
  implementation that reports nothing it is green on arrival. MUTATION: make the disk
  listing return an empty collection on error rather than raising or returning an
  unavailability signal — the ordinary fail-open shape, and the one every one of the four
  precedents above actually shipped. Under this mutation the check must report zero
  scripts compared, zero reported, and exit clean; the clause must fail, and it must fail
  by the exit status as well as by the text. Exercise it by making the listing genuinely
  unavailable at run time — an unreadable directory, a path that does not exist — not by
  asserting that an error branch is present in the source.


  BOUNDARY WITH BP-100k-4-i. That criterion pins the fail-closed contract for the REGISTRY
  side and is already done. This one adds the DISK side, which did not exist when it was
  written, and adds the stated-count requirement, which BP-100k-4-i expresses only as a
  zero-unreachable count and not as a population size. Extend the existing summary line;
  a second summary would let the two disagree about whether the run was determinate.
