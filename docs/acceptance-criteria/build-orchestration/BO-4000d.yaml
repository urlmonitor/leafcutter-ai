  ac_id: BO-4000
  contract: "The schema-validated repository-facts result shape BO-4000 defines — { path, exists, is_git_toplevel, is_linked_worktree, is_main_checkout, same_repository, branch } for a facts read, and { worktree_base } for the base read — as the value repoFactsCall must return to its callers."
