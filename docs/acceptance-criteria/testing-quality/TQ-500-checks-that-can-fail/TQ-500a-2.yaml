notes: |
  A WRITER FORCED TO PRODUCE A PROOF WILL INVENT ONE. This clause exists because
  the alternative failure mode is worse than the one being fixed: a fabricated
  alteration that no test objects to, recorded as though it were evidence, is a
  green record asserting falsifiability that was never demonstrated — the same
  self-concealing shape as the defect in KI-TQ-010, arrived at by a different road.

  THE NESTED SHAPE IS NOT A STYLE CHOICE. A bare no is malformed under the existing
  Bare-False Rule, so writing the negative as a bare no would make the whole
  hand-off record malformed and trigger a retry. Mirroring the nested form gets the
  reason and the next step recorded for free, and gives TQ-500b-1's reader a shape
  it already knows how to read.

  BOUNDARY WITH TQ-500b. This AC makes the honest negative expressible. TQ-500b-1
  makes it distinguishable from silence at read time. Neither absorbs the other: an
  expressible negative that reads the same as an absent answer would leave the
  collapse TQ-500b exists to remove.
