id: TQ-600a-9
components:
  - testing_quality
  - build_pipeline
title: "Tests that differ only in what they assert about one build stop producing one build each"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the population this record addresses: roughly 1,700 s of the 6,432 s suite —
    about 26% — sits in tests that each start a real build subprocess, at about 13.3 s
    for a build directed at a separate target directory and about 43 s for one that
    targets the checkout it was cloned from,
  And the correction that decides the shape of the work, established by reading every
    subprocess call site in the thirteen files examined: the lever is HOW MANY real
    builds a file performs, not whether a build is directed or self-targeting. Twelve
    of the thirteen are already directed, or are self-hosting because the criterion
    they test requires the package root and the target root to coincide; the
    thirteenth clones the checkout and builds against the clone because the
    self-targeting bootstrap path is the thing it exists to prove. No conversion
    between the two shapes is in scope here, and proposing one would be acting on a
    defect that is not present,
  And the identical-setup groups found by reading those call sites:
    - in the colliding-capability file, four tests whose setup lines are byte-identical
      — a fresh scratch adopter, a contested name picked deterministically as the first
      of the sorted shipped names, a colliding capability planted under that name, and
      one build — which then assert four different properties of that single result:
      that the adopter's file survives, what the message says, that the declared winner
      matches the resolution, and that the winner is the same on every platform. Eight
      of its sixteen builds serve those four tests, and six of the eight are removable,
    - in the consumer-install file, one test and all four parametrised instances of a
      second test that run a byte-identical build before any mutation, the mutation
      applying strictly afterwards to the produced tree and never to the package
      source, and the parity check that follows reading a target directory without
      building again. Five of its ten builds are that one build, and four are
      removable,
    - in the adopter-survival file, three tests sharing the same first build, and in the
      discoverable-symlink file, two tests sharing one build,
    - in the tracked-files file, one of its three clone-and-build cycles duplicating a
      cycle the same module already performs and already caches,
  And the prior count of the adopter family, which this record does not re-derive and
    must not take on trust: 35 of the 41 builds across six files are the first,
    declared-as-fixture-setup build that the family's own harness documents as "a
    fixture failure, never a finding for any AC in this build set" — about 497 s at the
    directed rate,
  When each group of tests that needs one identical preparation obtains that
    preparation once and each member of the group works against it — reading it
    directly where the member only reads, and against a private copy of it where the
    member alters anything,
  Then the real build subprocesses those files start fall by the counts the groups above
    name — 35 across the six adopter files, 4 in the consumer-install file, 1 in the
    tracked-files file — each figure obtained by counting the subprocesses the run
    actually starts, before and after, rather than taken from this record,
  And every assertion those files make before the change still exists, still runs, and
    still turns red when the property it names is broken: none is skipped, softened,
    merged into another, or left asserting something the shared preparation makes true
    by construction,
  And the elapsed time for those files, measured before and after on the same machine
    in the same sitting, is at most two thirds of the baseline,
  And the 497 s figure is reported as the one measured by that before-and-after count,
    not as the one inherited from the prior analysis, so a count that turns out smaller
    is visible rather than absorbed.
