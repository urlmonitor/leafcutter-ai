id: TQ-500g-1-xiii
components:
  - testing_quality
  - build_orchestration
title: "Every run re-checks each pinned replacement against the current code before any wrong version is run, and a pin that fails a check is neither used nor dropped but prepared again"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the work 07_TICKET-refresh-gate holds pinned replacements for six
    names of test T1's entry, and the code as written has changed since they
    were pinned —
      P1: its old text still occurs exactly once in refresh_config.py, the
          altered file loads, it changes bytes, and T1 runs the changed line
          on the run on the code as written,
      P2: its old text "if refresh_due and retry_due" now occurs twice in
          refresh_config.py,
      P3: applied now, refresh_config.py no longer loads, because the coder
          renamed a function the new text calls,
      P4: its new text now equals the current text at that place, so applying
          it changes no byte,
      P5: it applies, loads and changes bytes, but the changed line is in a
          function that no test naming P5 runs on the run on the code as
          written any more,
      P6: its file, settings.py, is no longer in scope for that name in the
          owed list,
  When the gate runs for that work,
  Then every pinned replacement is checked before any wrong version is run,
    And P1 is applied from the pin and run,
    And P2 to P6 are not applied from the pin; each is sent to the preparer,
      and each row says "re-prepared" and names the check that failed:
      "old text found 2 times", "did not load", "changes nothing",
      "changes no line the tests naming it run", "not in scope",
    And "still loads" is decided by executing the altered file as a module in
      a separate interpreter, not by checking only that it parses, so a P3
      whose new text calls the renamed function at module level reads "did
      not load"; the altered file is applied and put back through the same
      recorded apply-and-put-back the wrong-version runs use, and after the
      check refresh_config.py is byte for byte as written, whatever the
      outcome,
    And a re-prepared replacement is held to the same checks before it is
      run; when it passes, it is run and becomes that name's pin in place of
      the earlier one,
    And when the preparer cannot prepare a name again, or its new replacement
      also fails a check, the name is reported unfinished with the failed
      check named, the work does not pass, the name is never reported as
      caught or as survived, and the earlier pin is left as it was,
    And a replacement prepared for a name with no pin is held to the same
      checks before it is run, and becomes that name's pin only when it
      passes all of them,
    And no name owed by T1's entry is missing from the report: each one is
      run, or reported unfinished with its reason.
depends_on:
