title: "Know the clean install works, because every change proves it"
component: build_pipeline
level: L1
status: active
req_status: approved
readiness: approved
priority: critical
work_status: not_started
criteria: |
  Installing leafcutter into a fresh project is proven to work on every change,
  not discovered to be broken after release.

  Every pull request stands the package up in an empty project the way a real
  adopter would — clone, build, use it — and fails if that install does not
  come out whole and stable. Where BP-900a..BP-900g check deployment
  completeness statically inside the build, this branch verifies it
  empirically, by performing the install and inspecting the result.
