criteria: |
  Given the scripted AC-authoring workflow (the Python driver that dispatches the product
    owner, business analyst and technical planner) reaches its approval with the records
    ACD-9990a-1 and ACD-9990a-2,
    and the approval-hold report returns ACD-9990a-2 as held with the reason
    "test design pending",
  When that workflow approves,
  Then ACD-9990a-1 reads readiness "approved" and has gained one approval entry in amended_by,
  And ACD-9990a-2 still reads readiness "reviewed",
  And the value "approved" reaches a record's readiness only through the store's one
    approval step, so this workflow writes no readiness value of its own,
  And its result lists ACD-9990a-2 as held with the reason "test design pending".
