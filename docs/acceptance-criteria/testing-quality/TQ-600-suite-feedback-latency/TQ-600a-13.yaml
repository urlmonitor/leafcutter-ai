notes: |
  THIS IS A CORRECTNESS DEFECT WEARING A PERFORMANCE DEFECT'S CLOTHES. The cost is
  real — suffixed tests each pay a full real deploy and at least one of them is timed
  at 13.8 s in the duration record — but the reason it belongs in the store is that two
  documents state a protection the code does not implement. This repository's own
  guidance names three precedents of exactly that shape and calls each one out: the
  feedback-categories path that reported missing on every worktree, the store validator
  that exited zero having inspected nothing for eight days, and the merge audit that
  compared against a stale reference. This is the fourth.

  FIT, STATED PLAINLY. This record is the weakest fit of the three authored in this
  pass. Its parent L1's subject is expensive preparation paid for once rather than
  repeatedly; this record's subject is a claim about the suite that is untrue. Its
  natural home is TQ-600c, whose subject is the suite's cost being honestly measured
  and reported, and whose own notes define the "a check that examined nothing looked
  like a check that found nothing" failure class this record instantiates. It is filed
  here because the suffixed population includes this L1's own test files and the work
  is wanted now — the same reason, and the same imperfect fit, the parent already
  records for TQ-600a-11.

  RE-PARENT THIS RECORD onto TQ-600c when a product-owned split rebalances the TQ-600
  tree, or sooner if the product owner frees a slot under TQ-600c. The move is a
  two-field change: this record's depends_on, and the two parents' covered_by.

  WHAT THIS RECORD DELIBERATELY DOES NOT DECIDE. Whether to implement the exclusion or
  to correct the documents is left open, because the evidence supports correcting the
  documents and the suite-performance owner may have a reason to want the exclusion
  that this analysis cannot see. What is NOT left open is leaving the two in
  disagreement.
