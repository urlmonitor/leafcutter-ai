- path: templates/workflows-js/plan-feature.js
  state: existing
delivers_to: null
expects_from: null
test_intent:
- clause: every rationale pointer comment reads "Why" once, with the rest of its line unchanged character
    for character
  needs_test: true
  reason: Fifteen hand edits can drop or alter a character on a line, and only a per-site comparison catches
    that.
- clause: no line of the workflow source contains "Why why" in any letter case
  needs_test: true
  reason: A case-insensitive sweep of the whole source catches a missed site and stops the typo coming back.
test_spec:
- name: test_rationale_pointers_read_why_once
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: discrimination
  description: 'Pins the 15 rationale pointer lines that read ''// Why why'' at commit c73ebddc1 (L1660,
    1694, 1721, 1734, 1806, 2299, 2344, 2365, 2370, 2401, 2581, 2912, 2957, 3079, 3189) with their full
    text: in plan-feature.js each of those lines now equals the pinned line with ''// Why why '' replaced
    by ''// Why '', character for character (indentation and the rationale doc path included), and the
    file''s line count is unchanged.'
  proves_clause: every rationale pointer comment reads "Why" once, with the rest of its line unchanged
    character for character
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - the doubled word removed by deleting 'Why ' so the comment reads '// why ...'
  - a pointer line whose rationale doc path or ticket id changes while the word is fixed
  - a line added or removed, which shifts the pinned sites
- name: test_workflow_source_has_no_why_why
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: discrimination
  description: A case-insensitive scan of every line of plan-feature.js finds no 'why why'.
  proves_clause: no line of the workflow source contains "Why why" in any letter case
  code_file: templates/workflows-js/plan-feature.js
  must_catch:
  - only the three lines named in the old criteria (L1660, L1694, L1721) fixed while the other twelve
    stay
  - the check is case-sensitive, so a 'WHY why' or 'why Why' survives
- name: test_corrected_workflow_still_runs_to_the_final_gate
  target_dir: unit_tests/workflows/
  framework: pytest
  type: unit
  angle: reachability
  description: 'Entry point: the real plan-feature.js under run_workflow_under_e2 (the harness of _design_stage_support.py)
    runs to the final gate and through a cancel, so the comment-only edit leaves the workflow loading
    and running; the source text the harness loaded contains no ''why why'' in any letter case.'
  proves_clause: no line of the workflow source contains "Why why" in any letter case
  code_file: templates/workflows-js/plan-feature.js
