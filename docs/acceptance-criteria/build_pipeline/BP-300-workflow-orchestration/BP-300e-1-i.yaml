title: "Nested braces inside the JSON object do not truncate extraction"
component: build-pipeline
level: L3
status: active
req_status: draft
readiness: approved
priority: high
work_status: done
criteria: |
  Given a helper agent returns a valid JSON object that itself contains nested objects
    (braces within braces — for example a "contract" field whose value is another
    object), followed by trailing explanatory prose,
  When the workflow reads the agent's reply,
  Then the workflow recovers the complete top-level object including every nested
    level, stopping extraction only at the matching top-level closing brace and not
    at the first nested closing brace,
  And the run continues with the fully intact nested result.
depends_on:
  - BP-300e-1
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Extraction must count nesting depth and stop only at the matching top-level closing brace, never at the first nested close."
  - "The tolerant reader stays a pure, synchronous, dependency-free function; confine try/except to the JSON.parse boundary only."
  - "Behavior must be verified by a runtime behavioral test through the vm.Script replay harness with a deeply nested object plus trailing prose, not a source string-scan."
delivers_to: null
expects_from:
  ac_id: BP-300e-1
  contract: >-
    Inline tolerant reader parseAgentJson whose balanced-scan extraction is
    depth-counting (matches the top-level close), not first-close.
