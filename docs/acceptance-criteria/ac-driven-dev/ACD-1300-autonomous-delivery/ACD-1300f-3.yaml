id: ACD-1300f-3
title: Reject ambiguous membership and invalid prerequisite graphs
component: ac-driven-dev
components:
- ac_driven_dev
level: L2
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given a candidate contains an unresolved dependency identifier, a dependency cycle or ambiguous canonical parent membership
  When the worker evaluates the candidate
  Then it excludes the whole candidate and identifies the offending references or cycle
  And it neither guesses membership nor drops the prerequisite to make the feature selectable
  And no model call or feature workspace is created for this excluded candidate
