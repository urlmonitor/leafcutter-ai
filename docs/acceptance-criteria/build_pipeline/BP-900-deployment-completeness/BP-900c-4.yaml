    - "When the missing path is already named by a deploy declaration the build ships from, the selector must choose the declaration-already-exists remediation and must never choose the add-a-deploy-phase remediation for that state."
    - "The remediation must name the declaration that already claims the path AND both resolutions available for it (restore the source at the declared path, or remove the path from the declaration). Naming one resolution only leaves the author at the same dead end the 2026-08-31 observation recorded."
    - "The two branches BP-900c-3 and BP-900c-3-i already own must keep their current outcomes for their own states — adding the third branch must not change what either existing state is told, and unit_tests/test_build_tracked_source_guard.py must stay green unmodified."
