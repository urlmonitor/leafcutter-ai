criteria: |
  Given a run that staged a decision record,
  When a person follows the how-to,
  Then it shows the publish command with --run-id, what is checked before anything is written, the
    two files a publish changes (the record and the index), and the commit and PR that follow,
  And it shows how to correct an older record with --correct and a reason, and that the older
    record is appended to, never rewritten,
  And it gives the fix for each exit-code-3 stop: no staged record, and an unknown component or
    roadmap phase,
  And it states that a record left unpublished is never found as precedent.
