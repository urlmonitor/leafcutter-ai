criteria: |
  Permission to hand off work is declared up front and checked automatically.

  Whether a specialist is allowed to pass work to another specialist is written
  down as a deliberate decision, and that decision is checked every time the
  system is assembled. A specialist that was quietly given the means to hand off
  work it was never cleared for is reported as a mismatch and does not ship.
