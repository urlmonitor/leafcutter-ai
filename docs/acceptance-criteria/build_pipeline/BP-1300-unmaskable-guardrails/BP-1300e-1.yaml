notes: |
  THE NEGATIVE ARM (kernel-only rule set, scripts/ not refused) IS MANDATORY.
  Every positive arm is satisfied by an implementation that applies the
  error-handling set everywhere, which would refuse work CI accepts. That is a
  parity failure in the other direction, and BP-1300's L0 names both directions
  as worse than no check.

  The rule codes, trees and line numbers in the scenarios are concrete example
  inputs. The tree list and rule sets themselves must NOT be fixed by this
  record — they come from the single definition required by BP-1300e-1-i.

  VERIFY BEHAVIOURALLY. Every arm is about a real commit being refused or
  completing. A test that reads the hook registry as text is green on a hook
  that never runs (CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by
  Grep"; false-green mechanism M1).

  Behaviour only. assigned_agent, it_requirements, test_spec and
  package_surface are the IT PO's. Note for enrichment: adding a hooks_manifest
  entry trips check-package-surface-declaration (see GE-120h-3's notes).
