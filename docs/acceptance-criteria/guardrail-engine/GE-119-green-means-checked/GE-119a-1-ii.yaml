notes: |
  The THIRD state. GE-119a-1 covers "could not run at all"; GE-119a-1-i covers "ran
  fully, one input was bad". This covers the state between them: the check ran, but with
  a weaker instrument than the one its contract promises. A clean result from a weaker
  instrument is the most dangerous of the three because it looks exactly like a real pass.

  GE-119a-3 is the concrete instance (the AC-schema check degrading to manual field
  validation). This AC generalises it so a fourth point patch is not what ships — see the
  repeat-defect history in GE-119 notes (GE-112 already patched an adjacent defect in the
  same file).
