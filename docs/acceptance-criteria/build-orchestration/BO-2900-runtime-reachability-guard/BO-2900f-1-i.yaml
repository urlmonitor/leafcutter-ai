notes: |
  BUG-23, observed in run wf_cc2b46d9-f6f. Recorded per completed ticket:

    ticket 01 -- recorded: test-writer, python-coder, commit;
                 MISSING despite returning ok: test-runner, pr-reviewer
    ticket 03 -- recorded: test-writer, python-coder, pr-reviewer, commit,
                 commit (DUPLICATE); MISSING: test-runner
    ticket 09 -- recorded: test-writer, python-coder, test-runner, commit;
                 MISSING: pr-reviewer

  Transcripts confirm the missing agents really ran and really returned success --
  one test-runner dispatch is recorded in the run metadata as having returned ok
  while ticket 01 carries no test-runner entry and still names that phase as needed.

  IT IS NOT ONE BROKEN AGENT, AND THAT IS THE WHOLE POINT. Ticket 09 records
  test-runner correctly; ticket 03 records pr-reviewer correctly. Recording is
  unreliable per ticket, which is strictly worse than a deterministic bug: from a
  ticket alone you cannot distinguish "this gate was skipped" from "this gate ran and
  did not record". The parent L1's guarantee -- a check that never ran is never
  mistaken for a check that passed -- fails in the one direction nobody looks at,
  because here the check DID run and still left silence behind.

  WHY THIS LIVES UNDER BO-2900f-1. The parent invariant is exactly one entry per
  requested gate, with no gaps and no duplicates. This AC is the driver-side
  enforcement of the no-gaps half at the moment the gap is created; the sibling
  BO-2900f-1-ii covers the no-duplicates half, which the same run also exhibited.

  BOUNDARY. This AC is about a gate that ran. BO-2900f-2 covers a gate that was
  switched off and must still emit a skipped entry; BO-2900f-3 covers how non-passing
  outcomes roll up. Keep the three distinct.
