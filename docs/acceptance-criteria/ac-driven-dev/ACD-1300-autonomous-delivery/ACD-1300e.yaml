roadmap_phase: phase_1
criteria: |
  Provide an answer and the halted agent resumes with full context.

  When you respond to a pending request, the agent that asked the question
  resumes in the same workspace, with the same state, and the same progress
  it had when it stopped. It incorporates your answer and continues building.
  You do not need to re-explain the task or restart the feature from scratch.
