notes: |
  CONCEPT B. Ticket "done" is DERIVED from the done-state of its grouped
  requirements; there is no independent ticket-level completion an agent can set.

  IT-PO enrichment (2026-08-12): ticket-done rollup surface in scripts/ac_store/ (alongside
