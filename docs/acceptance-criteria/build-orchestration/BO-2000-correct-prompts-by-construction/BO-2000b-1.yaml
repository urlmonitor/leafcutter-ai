it_requirements:
  - "The python-coder template must carry a fail-open carve-out for pre-commit hooks: on an unexpected error, write the diagnostic to stderr and return 0; never re-raise."
  - "Implementation guidance for the carve-out: use print() to stderr and do not introduce an unused logger (Ruff-clean)."
  - "Test coverage: a hook that raises an unexpected error (e.g. OSError) exits 0 and emits a stderr diagnostic; and a content check that the template states the fail-open rule."
