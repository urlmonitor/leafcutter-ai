id: INF-800c
title: "Restructure across file boundaries without losing track"
component: infrastructure
level: L1
status: active
criteria: |
  Extract, rename, split, and merge code across modules in one coordinated operation.

  When restructuring spans multiple files -- extracting a class to its own
  module, splitting a large file into focused parts, or merging duplicated
  logic -- all the changes happen together. Every import, every reference,
  and every test path is updated as part of the same operation.
