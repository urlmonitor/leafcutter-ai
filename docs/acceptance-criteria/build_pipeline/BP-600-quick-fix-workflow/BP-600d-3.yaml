      (stage the parent so covered_by is correct in the commit that changes the
      tree) now stands on its own, and the defect is stated as observed on a
      named date with the counterfactual attached — a hook that read the store
      would BLOCK this commit on a stale back-link, so explicit staging is right
      under both regimes. The same split was applied to the corresponding
      it_requirements bullet. Nothing was deleted: the workaround is still the
      correct instruction, KI-CG-001 is still open, and work_status stays done
      because the behaviour the criteria require is unchanged.
