  n_location_rule: "2 -- the passing-outcome decision in build-feature.js and its twin in build-ticket.js. BO-400a-2-ii's standing twin constraint applies: a landing in one alone produces a store where an epic drive and a single-ticket drive disagree about whether a handover finished a phase, which is the same defect relocated."
  required_skills:
