id: TQ-600a-4
components:
  - testing_quality
  - build_pipeline
title: "Every converted test gives the same answer it gave when it deployed its own copy"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the tests that today obtain a deployed copy of the package by running a deploy
    of their own purely in order to read it — the population this work moves onto the
    shared reference layout, which TQ-600a-8's examination counts — and a per-test
    record of the outcome each of them reached before the move — passed, failed,
    skipped or expected-to-fail,
  When that population is run after the move,
  Then every test in it reaches the same outcome it reached before,
    And any test whose outcome differs is named in the comparison, with both
      outcomes stated,
    And the comparison is made test by test rather than by comparing the two runs'
      overall pass counts, so a test that started failing while another started
      passing is reported rather than cancelling out,
    And the comparison states how many tests it compared, and that number equals the
      size of that population as the examination counts it — not the size of whichever
      subset somebody chose to move — so a comparison over a chosen handful is
      distinguishable from a comparison over the population that exists,
    And a comparison whose population is empty reports a failure rather than agreement,
      so a conversion that moved nothing is not reported as a conversion that changed
      nothing.
depends_on:
  - TQ-600a
  - TQ-600a-1
  - TQ-600a-8
doc_links:
  - path: scripts/suite_performance/outcome_equivalence.py
    relationship: creates
    status: planned
    relevance: >-
      THE COMPARATOR ITSELF — node-id keying, the six-value outcome vocabulary,
      present-in-one-only as disagreement, the stated compared count. Named at this
      pass because every other path this record declares is a file in the compared
      POPULATION, so without it the generated ticket would point a coder at the tests
      to move and at no place to put the thing that proves the move was safe.
      TQ-600b-1 may reuse this module; it_requirement 6 already requires the two
      claims stay separately assertable, each with its own failing test and its own
      pair of input records.
  - path: docs/testing/test-angles.md
    relationship: describes
    status: exists
    relevance: >-
      The real_artifact angle governs the before-record: it must come from an
      actual run of the suite as it stands today, not from a list of outcomes
      someone believed to be current.
assigned_agent: python-coder
estimated_complexity: L
it_requirements:
  - >-
    THE BEFORE-RECORD IS TAKEN FROM A REAL RUN AND RECORDED AS-IS. It must carry
    the measured baseline's 2 failures, 5 skips, 19 xfailed and 96 collection
    errors. Do NOT clean it first: the criterion is preservation of each test's
    own outcome, so an already-failing test that starts passing is a
    disagreement, and a curated baseline makes the whole comparison vacuous.
  - >-
    KEY ON THE FULL TEST NODE ID (file::class::name), never on the bare function
    name. There are 667 test files here and duplicate function names across them
    are certain; a bare-name key silently pairs the wrong outcomes and reports
    agreement.
  - >-
    A TEST PRESENT IN ONE RECORD AND ABSENT FROM THE OTHER IS A DISAGREEMENT, not
    an omission to be skipped. Iterating the keys of one mapping is the natural
    implementation and it ignores every test the other run did not execute.
  - >-
    THE OUTCOME VOCABULARY MUST DISTINGUISH passed / failed / skipped / xfailed /
    xpassed / error. Collapsing xfail into pass or into fail is a
    false-agreement generator against a baseline holding 19 xfails.
  - >-
    READ MACHINE-READABLE RESULT RECORDS (junit-xml or the TQ-600c-1 cost record),
    never the console output. A comparator that re-parses terminal text silently
    matches nothing when the format changes, and a comparator that matches
    nothing reports agreement.
  - >-
    THIS COMPARATOR AND TQ-600b-1'S MAY SHARE AN IMPLEMENTATION, BUT THE TWO
    CLAIMS MUST STAY SEPARATELY ASSERTABLE. This AC compares before against after
    the shared layout; TQ-600b-1 compares serial against parallel. A single
    merged "nothing changed" run would pass while one change masked the other's
    breakage. If one module serves both, each AC keeps its own independently
    failing test and its own pair of input records.
  - >-
    Report per-test only, and state the compared count. Totals must not appear as
    the verdict.
  - >-
    THE POPULATION IS THE ONE TQ-600a-8 COUNTS, NOT THE ONE SOMEBODY CHOSE TO MOVE,
    AND AN EMPTY ONE IS A FAILURE. Both runs must be taken over the real suite roots
    `unit_tests/` and `tests/`, and the compared count must be reconciled against
    TQ-600a-8's inspected population rather than against whatever the after-run
    happened to execute. Before the 2026-09-28 amendment this record presupposed its
    own population and was satisfiable at size zero — "every test in the set reached
    the same outcome" and "0 == 0" are both true of the empty set, so a conversion
    that moved nothing reported as a conversion that changed nothing. Reconcile the
    two figures explicitly and fail when the compared count is zero OR when it
    disagrees with the examination's count; agreeing "0 == 0" is the defect, not the
    pass.
  - >-
    THE POPULATION REACHES BEYOND THE NEW DIRECTORY AND THE BEFORE-RUN MUST PROVE
    IT. The measured cost is concentrated in files the comparator does not live
    beside: unit_tests/portability/test_bp_1500d_1_i.py (206.74s of fixture setup,
    the single heaviest entry in the duration table),
    unit_tests/portability/test_ge_120c_1.py (73.03s),
    unit_tests/commit_guardian/test_bp_100k_5.py,
    unit_tests/build_guards/test_command_reachability_guard.py,
    unit_tests/ac_store/test_done_proof_composite.py and
    tests/test_build_clean.py. A before-record or after-record produced by running
    only unit_tests/suite_performance/ compares the comparator's own tests against
    themselves and reports agreement over a population containing none of the tests
    this work moves. Those paths are anchors naming where the cost is, not a list
    the comparator may key on — no literal population size may be written into the
    comparator or any test of it.
  - >-
    THE DECLARED MUTATORS ARE IN THE COMPARED POPULATION AND MUST STILL AGREE.
    unit_tests/test_bp_900g_8.py and its siblings keep building their own copy and
    are NOT converted, but they run in both records and a conversion that disturbs
    them — by publishing a shared layout into a path they reach, or by changing
    their working directory — flips their outcome. Excluding them from the
    comparison because they were not moved would hide exactly the regression the
    read-versus-mutate boundary exists to prevent.
delivers_to:
  - agent: python-coder
    ac_id: TQ-600b-1
    contract: >-
      A per-test outcome comparator keyed on the full node id, with the six-value
      outcome vocabulary, present-in-one-only treated as disagreement, and a
      stated compared count. TQ-600b-1 may reuse the implementation but asserts a
      different pair of runs and keeps its own failing test.
expects_from:
  - ac_id: TQ-600a-8
    contract: >-
      THE POPULATION AND ITS SIZE, which the 2026-09-28 amendment moved here from
      TQ-600a-1. The examination's per-file verdict list over unit_tests/ and
      tests/, plus its inspected count — the number this comparison's compared count
      must equal. Taking the population from the mover's own choice of subset
      instead is the vacuity the amendment closed: at size zero every clause held
      and the last held as 0 == 0.
  - ac_id: TQ-600a-1
    contract: >-
      The shared reference layout the after-run executes against — the
      `shared_reference_layout` fixture and `get_or_produce_shared_layout()` in
      scripts/suite_performance/ — which is what makes the after-run a different run
      from the before-run. TQ-600a-1 no longer supplies the population; it supplies
      only the mechanism the population is moved onto.
test_spec:
  - name: test_tq600a_4_every_converted_test_reaches_its_recorded_prior_outcome
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: "python -m pytest unit_tests tests --junitxml=<record> (two genuine runs over the real suite roots, before and after the move)"
    description: >-
      Over the before-record and after-record that two genuine runs of the REAL
      suite roots produced — machine-readable junit-xml from
      `unit_tests/` and `tests/`, not hand-authored fixtures and not a run confined
      to unit_tests/suite_performance/ — every test's outcome matches. NAMED
      MUTATION: produce either record by running only the comparator's own
      directory; the comparison then holds over a population containing none of the
      tests this work moves, and this test must go RED because its compared count
      cannot reconcile with TQ-600a-8's inspected count.
  - name: test_tq600a_4_a_flipped_outcome_is_named_with_both_outcomes_stated
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: failure
    description: >-
      THE RED. One test's outcome differs between the two records; the comparison
      names it and states the outcome it reached in each.
  - name: test_tq600a_4_a_pass_to_fail_and_a_fail_to_pass_in_the_same_pair_are_both_reported
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: failure
    description: >-
      The cancellation control. NAMED MUTATION: compare the two runs' overall
      pass counts instead of per-test outcomes. The measured baseline is 5292
      passed / 2 failed, so one break plus one accidental fix leaves the totals
      identical and the totals comparison reports agreement — this test must go
      RED under that injection.
  - name: test_tq600a_4_a_test_absent_from_one_record_is_reported_as_disagreeing
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: boundary
    description: >-
      NAMED MUTATION: iterate the keys of the before-record only. A test the
      after-run never executed is then invisible and this test must go RED.
  - name: test_tq600a_4_xfail_skip_and_pass_are_distinct_outcomes
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: boundary
    description: >-
      An xfailed test that becomes a pass, and a skipped test that becomes a
      pass, are each reported as disagreements. NAMED MUTATION: collapse the
      outcome vocabulary to pass/fail; this test must go RED against a baseline
      holding 19 xfails and 5 skips.
  - name: test_tq600a_4_the_compared_count_is_stated_and_equals_the_population_tq600a_8_counts
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: criterion
    description: >-
      The count appears in the output and is reconciled against TQ-600a-8's
      inspected population rather than against whatever the after-run happened to
      execute. Two empty records must NOT report agreement — they report a compared
      count of 0 and a FAILURE. NAMED MUTATION: size the comparison against the
      after-run's own key set; a conversion that moved nothing then reports
      agreement over zero tests and this test must go RED. No literal population
      size appears: the assertion is that the two figures reconcile, not that either
      holds a particular value.
  - name: test_tq600a_4_the_heaviest_measured_deploy_sites_reach_their_recorded_prior_outcomes
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: real_artifact
    surface_invoked: "python -m pytest unit_tests/portability --junitxml=<record>"
    description: >-
      The two heaviest sites the 2026-09-21 profile measured —
      unit_tests/portability/test_bp_1500d_1_i.py at 206.74s of fixture setup and
      unit_tests/portability/test_ge_120c_1.py at 73.03s — each appear in BOTH
      records by full node id and reach the same outcome. This descriptor lives
      beside the files it names so it is collected whenever that directory is, and
      so a conversion regression in the two tests that carry most of the cost is
      caught by their own directory's suite rather than only by a whole-tree
      comparison somebody has to remember to run. It asserts per-named-file
      agreement and a non-zero presence in both records, never a total.
  - name: test_tq600a_4_outcomes_are_paired_by_full_node_id_not_by_function_name
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: seam
    description: >-
      Two different files each containing a function of the same name, with
      different outcomes, are not paired with each other. NAMED MUTATION: key on
      the bare function name; this test must go RED.
test_rationale: |
  A faster suite that answers differently is not a faster suite, it is a
  different suite. Sharing setup changes what each converted test sees, and
  that is a real behavioural change that can flip an outcome.

  Four descriptors are negative controls naming their injections. The
  load-bearing one is the totals-comparison injection: comparing pass counts is
  the tempting cheap check and it is worthless against this baseline, where one
  break plus one accidental fix leaves 5292/2 unchanged.

  The node-id descriptor exists because this suite has 667 test files, so
  duplicate function names are certain and a bare-name key reports agreement
  while pairing unrelated tests.

  This AC's comparison must not be merged with TQ-600b-1's. That one compares
  serial against parallel; this one compares before against after the shared
  layout. A single "nothing changed" test spanning both would pass while one
  change masked the other's breakage, which is the specific reason the two are
  separate ACs.
