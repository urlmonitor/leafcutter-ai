criteria: |
  Given an AC names a path under scripts/ that has NO templates/ counterpart
    (a genuinely source-only dev tool, for example scripts/ci/ or scripts/workflows/),
  When the pointer-quality check evaluates it,
  Then the path is NOT flagged,
  And the check distinguishes a deployed copy of a template from genuinely-canonical source under scripts/,
  And the decision is made by the presence or absence of a templates/ counterpart, not by the prefix alone.
