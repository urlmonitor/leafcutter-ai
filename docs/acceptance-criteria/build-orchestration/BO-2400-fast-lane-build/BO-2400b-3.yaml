criteria: |
  Given the routing inputs (scope size, attended/unattended, defect-cost),
  When the path router makes its decision,
  Then the lane is derived from a single documented decision rule that maps those
    inputs to a lane
  And routing the same inputs twice yields the same lane (the decision is
    deterministic, not a per-run judgment call).
