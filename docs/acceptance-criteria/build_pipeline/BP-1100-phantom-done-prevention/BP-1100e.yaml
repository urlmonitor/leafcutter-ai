title: "A ticket cannot be called done when its real changes don't match what it said it would touch"
component: build-pipeline
level: L1
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Before a ticket is marked done, its actual changes are checked against its declared file scope -- a mismatch is flagged.

  A ticket can pass every gate -- tests green, sign-offs complete -- and still have
  delivered nothing, because the files it actually changed do not match the files it
  said it would touch (for example it edited documentation when its work belonged in
  the source that runs the behavior). Before that ticket is allowed to reach "done",
  the system compares what was really changed against the scope the ticket declared,
  and flags the disagreement instead of letting it mask missing work. Any project
  that installs leafcutter and runs build.py gets this check the same way. This
  complements BP-1100a, which catches a declared scope that is missing its executable
  target before work starts; BP-1100e catches the opposite drift after work is done,
  when the real change and the declared scope have parted ways.
depends_on: [BP-1100]
