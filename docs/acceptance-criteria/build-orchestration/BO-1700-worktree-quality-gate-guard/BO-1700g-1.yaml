id: BO-1700g-1
readiness: approved
priority: high
title: "Check B requires the manifest's required hook IDs, not merely one hook"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1700-worktree-quality-gate-guard/BO-1700g.yaml"
criteria: |
  Given the worktree's resolved `.pre-commit-config.yaml` parses successfully but
    is missing one or more of the hook IDs that the commit-guardian manifest
    declares as required,
  When the probe runs Check B,
  Then Check B fails, the probe exits non-zero, `config` is false in the JSON
    result, and stderr names each required hook ID that is absent from the
    resolved config.
  And given a resolved config that contains every required hook ID,
    Then Check B passes on the required-hooks assertion.
depends_on: [BO-1700g, BO-1700a-1]
