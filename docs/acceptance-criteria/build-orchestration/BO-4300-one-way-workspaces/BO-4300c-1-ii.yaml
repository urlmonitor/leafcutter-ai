assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: BO-4300c-1
  contract: 'Protections ingredient, per stage: checks.hooks_pre_commit_fired, checks.hooks_commit_msg_fired,
    checks.hooks_post_merge_fired (each true|false|''n/a''), their conjunction checks.hooks_canary_rejected,
    hooks_stages_declared [stage], and inactive_stages [stage] on HOOKS_INACTIVE (BO-4300c-2).'
package_surface: true
it_requirements:
  config_schema_fragment:
    type: object
    description: >-
      The four package-registry entries ticket 05 adds to templates/scripts/commit_guardian/commit_guardian.json,
      as staged on 2026-10-09 (read with `git show :templates/scripts/commit_guardian/commit_guardian.json`):
      one new top-level key, stage_canaries, and three new members of the existing hooks_manifest.hooks
      array, one per git stage the install declares. _package_surface_registry.WATCHED_REGISTRIES watches
      this file through both ("hooks_manifest.hooks", "list_ids") and ("", "mapping_keys"), so each of
      the four is a new package-surface entry. No other key or member is added, and the pre-existing
      manual-stage precommit-canary member is unchanged.
    required: [stage_canaries, hooks_manifest]
    properties:
      stage_canaries:
        type: object
        description: >-
          Path-keyed reserved inputs: the known-bad input the workspace maker feeds each declared stage
          to show that stage's protections fire. Keyed on reserved paths and one exact first message
          line, never on file or message contents, so ordinary work that merely mentions them is never
          rejected. precommit_canary.py --stage <stage> is the hook that rejects it; a declared stage
          with no entry here cannot be shown to fire and counts as not firing.
        required: [pre-commit, commit-msg, post-merge]
        properties:
          _comment:
            type: string
          pre-commit:
            type: object
            description: A commit that stages this reserved path is rejected.
            required: [path]
            properties:
              path:
                const: leafcutter-stage-canary/pre-commit
            additionalProperties: false
          commit-msg:
            type: object
            description: A commit whose first message line equals this reserved line is rejected.
            required: [message]
            properties:
              message:
                const: 'leafcutter-stage-canary: reserved commit-msg line'
            additionalProperties: false
          post-merge:
            type: object
            description: A merge that adds this reserved path is reported as failing by the post-merge hook.
            required: [path]
            properties:
              path:
                const: leafcutter-stage-canary/post-merge
            additionalProperties: false
        additionalProperties: false
      hooks_manifest:
        type: object
        properties:
          hooks:
            type: array
            description: >-
              Three new members, each running precommit_canary.py --stage <stage> and inert (exit 0)
              for every ordinary commit or merge; each also carries a _comment string. Manifest order:
              precommit-canary-pre-commit is member 0 and precommit-canary-commit-msg member 1;
              precommit-canary-post-merge sits directly after the manual-stage precommit-canary member
              and before check-ac-done-on-merge. Each canary is therefore the first hook of its stage.
            allOf:
            - contains:
                type: object
                required: [id, tier, name, entry, language, stages, always_run, pass_filenames, change_set_source]
                properties:
                  id:
                    const: precommit-canary-pre-commit
                  tier:
                    const: judgment
                  name:
                    const: 'Stage canary (pre-commit) - rejects only the declared known-bad input'
                  entry:
                    const: 'python {{config.output_root}}/scripts/commit_guardian/precommit_canary.py --stage pre-commit'
                  language:
                    const: system
                  stages:
                    const: [pre-commit]
                  always_run:
                    const: true
                  pass_filenames:
                    const: false
                  change_set_source:
                    const: handed_by_commit_path
            - contains:
                type: object
                required: [id, tier, name, entry, language, stages, always_run, pass_filenames, change_set_source]
                properties:
                  id:
                    const: precommit-canary-commit-msg
                  tier:
                    const: judgment
                  name:
                    const: 'Stage canary (commit-msg) - rejects only the declared known-bad input'
                  entry:
                    const: 'python {{config.output_root}}/scripts/commit_guardian/precommit_canary.py --stage commit-msg'
                  language:
                    const: system
                  stages:
                    const: [commit-msg]
                  always_run:
                    const: true
                  pass_filenames:
                    const: true
                  change_set_source:
                    const: handed_by_commit_path
            - contains:
                type: object
                required: [id, tier, name, entry, language, stages, always_run, pass_filenames, change_set_source]
                properties:
                  id:
                    const: precommit-canary-post-merge
                  tier:
                    const: judgment
                  name:
                    const: 'Stage canary (post-merge) - rejects only the declared known-bad input'
                  entry:
                    const: 'python {{config.output_root}}/scripts/commit_guardian/precommit_canary.py --stage post-merge'
                  language:
                    const: system
                  stages:
                    const: [post-merge]
                  always_run:
                    const: true
                  pass_filenames:
                    const: false
                  change_set_source:
                    const: handed_by_commit_path
  reference_file_path: templates/scripts/commit_guardian/commit_guardian.json
  n_location_rule: '4 -- one new top-level key (stage_canaries) and three new members of the single
    hooks_manifest.hooks array (precommit-canary-pre-commit, precommit-canary-commit-msg, precommit-canary-post-merge),
    all inside the one reference file. A declared stage registered without both its stage_canaries input
    and its hooks_manifest member cannot be shown to fire, so a partial registration makes a real ensure
    refuse HOOKS_INACTIVE naming that stage. The pre-existing manual-stage precommit-canary member is not
    modified.'
  required_skills:
  - python-coder
  - create-hook
  post_write_commands:
  - python scripts/build.py --target-dir . --force
  - python scripts/build.py --validate-only
  constraints:
  - 'STAGE SET FROM THE PROJECT''S OWN DECLARATION (KI-CG-20260914-post-merge-stage-registers-but-installs-no-shim):
    ensure installs a shim into the clone''s own .git/hooks for EVERY stage the workspace''s own hook declaration
    names -- in practice the union of `stages:` in the workspace''s generated .pre-commit-config.yaml, the
    same source commit_guardian''s install_pre_commit_shims.collect_stages reads (today pre-commit, commit-msg
    and post-merge). The stage list is never hard-coded in the maker, and no new copy of the stage-derivation
    logic is written: the maker uses the install''s own shim installer (run as a separate process from the
    workspace''s install, so the maker stays stdlib-only) or an equivalent single shared source. Clones have
    their own hooks directory, unlike worktrees.'
  - 'ONE CANARY PER DECLARED STAGE, each a real operation the stage rejects: pre-commit -- a commit of a
    known-bad file is rejected; commit-msg -- a commit with a known-bad message is rejected; post-merge
    -- a merge that brings in a known-bad change is reported as failing by the post-merge hook (non-zero
    exit; a post-merge hook cannot undo the merge). Each canary''s known-bad input is taken from the install''s
    own declaration, never hard-coded to one hook; a declared stage with no declared canary input cannot
    be shown to fire and counts as not firing.'
  - 'Canaries leave nothing behind: commit canaries never land in the branch, the index or the working
    tree; the after-merge canary runs against a disposable ref, and afterwards the line of work''s branch
    tip, index and working tree are exactly as before and the disposable ref is gone -- confirmed by the
    tree_clean ingredient (BO-4300c-1-iii) evaluated after the canaries.'
  - 'ANSWER FIELDS (aligned with BO-4300c-1 and BO-4300c-2): checks.hooks_pre_commit_fired, checks.hooks_commit_msg_fired,
    checks.hooks_post_merge_fired, each true|false|''n/a''; checks.hooks_canary_rejected is their conjunction
    (true only when every declared stage fired); hooks_stages_declared lists the stages the declaration
    names. When any declared stage does not fire, the answer is refused with code HOOKS_INACTIVE, its message
    names the stage(s), and inactive_stages lists them; no workspace_path.'
  - '''n/a'' RULE: for kind scratch ALL three stage checks and the conjunction are ''n/a'' (BO-4300e-4 --
    nothing is committed or merged in a comparison copy). For every other kind the pre-commit check is never
    ''n/a'' (a project that declares no commit-time stage gives HOOKS_INACTIVE naming pre-commit), and the
    commit-msg and post-merge checks are ''n/a'' only when the project''s declaration does not name that
    stage -- never because a declared stage was skipped.'
  - Presence of .pre-commit-config.yaml (or any .leafcutter copy), or of a shim file for a stage, is recorded
    (precommit_config_present) but never on its own produces ok. The fail-open OR-probe (setup_ticket_worktree.py
    AC-5, CLAUDE.md's ls ... || ls ... check, verify_precommit_active.py's check_b_config fallback) is not
    reproduced.
  - 'Git spelling (KI-CG-20260925-commit-delegation-hook-misses-git-dash-c): canary commits and the canary
    merge run with git''s working directory set to the workspace, never as `git -C <path> commit`; the
    same holds in the tests and fixtures.'
  - 'The real install must declare a canary input for each stage it declares; commit_guardian''s declaration
    carries only a manual-stage precommit-canary today (verified 2026-09-25), so adding per-stage canary
    declarations to the install is in scope of this record''s ticket (flagged to the user as a cross-component
    touch on commit_guardian).'
  - Proof runs the DEPLOYED maker -- the copy an install delivers, resolved through the shared test locator
    delivered by BO-4300f-4 -- as a separate process against real temporary git repositories with a real
    bare hub. No mock of git, no import of the maker module, no grep of its source (CLAUDE.md 'Gate / Workflow
    ACs -- Verify Behaviorally, Not by Grep'); a test never falls back to the templates/ source copy.
  - 'Tests must not spawn the package''s own scripts/build.py (CLAUDE.md ''Tests must not spawn their own
    build.py''): the deployed maker comes from the shared deployed layout, and fixture projects carry a
    minimal stub build entry point that installs a real, rejecting hook in well under a second. A test that
    must mutate the package and build its own copy says so and justifies it in its ticket.'
  - All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
    isolated global and system config; afterwards the developer's own repository's branches, registered
    worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_all_three_declared_stages_fire_gives_ok
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: criterion
  description: 'With a fixture project declaring pre-commit, commit-msg and post-merge stages, each with
    a stub hook that rejects its known-bad input, ensure answers ok; hooks_stages_declared lists all three;
    checks.hooks_pre_commit_fired, hooks_commit_msg_fired, hooks_post_merge_fired and hooks_canary_rejected
    are all true; and .git/hooks in the workspace holds a shim for each stage.'
- name: test_commit_time_stage_not_firing_is_refused_naming_it
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: With only the pre-commit hook made to accept the known-bad file (other two still fire),
    the answer is HOOKS_INACTIVE, inactive_stages == ['pre-commit'], the message names it, no workspace_path.
- name: test_commit_message_stage_not_firing_is_refused_naming_it
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: With only the commit-msg hook made to accept the known-bad message, the answer is HOOKS_INACTIVE,
    inactive_stages == ['commit-msg'], no workspace_path.
- name: test_after_merge_stage_not_firing_is_refused_naming_it
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: With only the post-merge hook made to exit 0 on the merge bringing in the known-bad change,
    the answer is HOOKS_INACTIVE, inactive_stages == ['post-merge'], no workspace_path.
- name: test_declared_stage_whose_shim_is_missing_is_refused_naming_it
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: seam
  description: 'With the fixture''s shim installer made to skip the post-merge shim while the stage stays
    declared (the KI-CG-20260914 shape), the answer is HOOKS_INACTIVE naming post-merge -- a declaration
    alone never counts.'
- name: test_config_or_shim_presence_alone_never_yields_ok
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: failure
  description: checks.precommit_config_present is true and all three shim files exist while one stage
    does not fire; status is not ok and workspace_path is absent.
- name: test_canaries_leave_branch_index_and_tree_unchanged
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: real_artifact
  description: After an ok ensure, the workspace's branch tip equals base_commit, `git status --porcelain`
    is empty, and no disposable canary ref remains.
- name: test_undeclared_stage_is_reported_na_and_does_not_block
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: A fixture declaring only pre-commit answers ok with hooks_commit_msg_fired and hooks_post_merge_fired
    == 'n/a' and hooks_pre_commit_fired true; a fixture declaring no pre-commit stage answers HOOKS_INACTIVE
    naming pre-commit.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer, its exit code, and the state of the workspace, the hub and the main copy afterwards.
  A direct-import unit test would pass while the deployed copy is stale or mis-deployed (F13), and a git
  mock cannot show the half-made and occupied states this family exists to handle. One refusal test per
  stage, each with only that stage made not to fire, so a maker that drops one stage fails exactly one
  test; the missing-shim test reproduces KI-CG-20260914 directly.
