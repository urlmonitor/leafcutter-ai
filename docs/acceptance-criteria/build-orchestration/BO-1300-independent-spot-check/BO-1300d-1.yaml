it_requirements:
  - "The auto-invocation wires into the /build-feature surface (templates/workflows/build-feature.md and its finalize/closing step) as the closing step before the feature is declared done, after tickets are implemented and merged."
  - "Must invoke the SAME shared spot-check pass authored in BO-1300a-2 / BO-1300b-1 — reuse the single pass, do not duplicate the dispatch/seeding logic in the build-feature surface."
  - "Must respect ADR-006: /build-feature already dispatches at depth, so the spot-check pass it invokes must keep the three reviewers within the depth-1 limit and must not introduce an additional supervisor layer."
  - "Auto-run must be ordered strictly after merge and strictly before the done declaration; if the pass cannot run it must surface that rather than silently declaring done."
