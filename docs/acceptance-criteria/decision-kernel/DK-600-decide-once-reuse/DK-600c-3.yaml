criteria: |
  Given a built decision record dec-d53e1c52cd47c832 from run run-f0f15b38791a428f,
  When the file backend saves it,
  Then the record is written to
    <run_root>/runs/run-f0f15b38791a428f/staged/decisions/dec-d53e1c52cd47c832.yaml as YAML,
  And no file in the repository changes: the repository's git status is the same before and after
    the run, and docs/decisions/ gains no file.
