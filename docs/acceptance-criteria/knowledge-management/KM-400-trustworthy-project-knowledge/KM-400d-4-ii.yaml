notes: |
  Supersedes the deadline-exhaustion clause of KM-400d-4 ("cancellation or deadline
  exhaustion stops further work") for the real CLI. KM-400d-4 is marked done, but that clause
  is false on the real CLI: its covering test's slow backend is a cancellable asyncio sleep,
  so it cannot see a blocking worker thread outliving the deadline. Measured 2026-10-22: a
  10 s default deadline took 32.45 s of wall time (exit 2, status unavailable, duration_ms
  10008); in-process the result was ready at 12.33 s and the event loop returned at 22.96 s
  because shutdown joined the abandoned worker thread, and closing the driver waited ~2.3 s
  on the in-flight connect. The bound is stated from retrieval start, not process start,
  because interpreter start-up alone measured 2.8-5.5 s on this host.
  Analysis: /home/henzeh/.cache/lc_probe/cli_query_time_limit_analysis.md (B2, option a).
  The kernel-hosted path must not block on an expired call either; that path is out of this
  AC's test scope (CLI) but must not regress.
  The concrete 2000 ms deadline in the scenarios is a test value; the 1000 ms margin is the
  user's bound and applies to every deadline_ms value 1-30000.
  The 'useful evidence' scenario restates KM-400d-4's "reports whether useful evidence was
  produced" under a blocking call -- BA addition, confirm at review.
