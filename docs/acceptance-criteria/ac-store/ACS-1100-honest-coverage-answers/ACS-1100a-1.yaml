notes: |
  The shape ACS-1100 asks for: (results, denominator, method). This AC fixes the
  SHAPE only — that all three parts are present and travel together, including on an
  empty result set. HOW the total is established independently of the result pass is
  ACS-1100a-2; WHAT the method must say is ACS-1100b-1; what happens when the numbers
  do not add up is ACS-1100c-1.

  The empty-result clause is load-bearing: today an answer of "nothing found" is
  indistinguishable from "nothing looked at". A run that joined none of the available
  records must say 0 of N, and N is what makes it loud.
