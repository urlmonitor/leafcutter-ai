notes: |
  THE MANDATORY LEAF. ACD-1800f's notes require it verbatim: "Whatever L2s come
  out of this L1, at least one MUST assert that an observable-effect requirement
  with no declared proof FAILS -- an empty proof set must never be a pass."

  THE DEFECT IS LIVE TODAY, BEFORE ANY MIGRATION (verified, do not
  re-investigate):
    - The gate is DISPATCHED and NON-OVERRIDABLE. generate_ticket_from_ac.py
      ~line 903: `if declares_side_effect: all_needed.add("user-surface-smoker")`,
      and ~line 920 `_SIDE_EFFECT_MANDATORY = frozenset({"user-surface-smoker"})`
      makes it immune to a `not_needed` override (same protection shape as
      `_TDD_MANDATORY`).
    - The gate's algorithm is "For each stanza in the `## Smoke Fixture` block"
      (user-surface-smoker.md ~line 111) and its aggregation is "If ALL stanzas
      PASS: emit (status: ok)" (~line 171).
    - Nothing writes the block: ZERO occurrences of "Smoke Fixture" in the
      generator.
    - NET: zero stanzas means the loop body never runs and the vacuous-truth
      aggregation emits `ok`. A mandatory gate reports a pass having verified
      nothing. This is the BO-2900 failure shape exactly, and it is the reason
      CLAUDE.md carries the "Gate / Workflow ACs -- Verify Behaviorally, Not by
      Grep" rule.

  THE FOURTH THEN CLAUSE IS THE DURABLE FIX, and it is separate from the first
  three on purpose. Making the empty case FAIL fixes today's requirement; making
  the two cases DISTINGUISHABLE in the emitted outcome is what stops the failure
  reappearing the next time an aggregation is written over a possibly-empty
  collection. An emitted count of proofs executed satisfies it; a bare
  pass/fail does not.

  INTERACTION WITH THE MIGRATION -- why this leaf must land EARLY, not late.
  During the cutover window the store will hold requirements that declare an
  observable effect under ACD-1800f-1 before anyone has authored proofs under
  ACD-1800f-2. If the empty case passes, every one of them reports green and the
  backfill queue is invisible. If it reports unproven, the queue is measurable.
  That is the same argument ACD-1600g-4 makes for the boundary.

  TENSION WITH ADR-026 RULE 4 (tolerant readers), RESOLVED DELIBERATELY. Absence
  of the DECLARATION is legacy mode and must never fail -- ACD-1800f-1's third
  Then clause. This AC is about the different case where the requirement DID
  declare an observable effect and then proved nothing; that is an incomplete
  requirement, not a legacy one, and the criteria say "unproven", not
  "validation error", so ADR-026 rule 3 (advisory before required) still governs
  how hard it lands.

  TESTABILITY. Run the observation craft against a real requirement that declares
  an effect and carries no proof, and assert the emitted outcome. A test that
  asserts the source contains an `if not stanzas:` branch would pass on a branch
  that is never reached.

  2026-08-17 (IT PO enrichment).

  WHERE THE AGGREGATION LIVES IS THE LOAD-BEARING DECISION. Today the entire
  aggregation rule exists as one sentence of Markdown inside an agent template
  ("If ALL stanzas PASS: emit (status: ok)", user-surface-smoker.md ~171). That
  is why the defect was unobservable: there is nothing to execute and nothing to
  assert against. The fix moves the decision -- empty-set refusal, counts, three
  outcomes, attribution -- into executable Python under scripts/ac_store/, and
  reduces the craft to reporting what the verdict said. Leaving the aggregation
  in prose and merely adding a sentence about the empty case would reproduce the
  original failure with a longer template.

  THREE OUTCOMES, NOT TWO, and the third is not in the criteria by accident.
  `refuted` (a proof ran and its assertion failed or its placeholder_signature
  matched) already exists implicitly in the craft's blocker path. Naming it
  beside `unproven` is what keeps the clearing actions distinct -- author a proof
  versus fix the surface -- and stops an implementer collapsing the new refusal
  into the existing blocker, which would make the backfill queue invisible again.

  ENFORCEMENT SURFACE CHOSEN: the DONE-PROOF PATH, not a new hook. verify_done_
  eligible in scripts/ac_store/done_proof.py is already consumed by the
  check_done_proof pre-commit hook AND the required CI done-proof job, so the
  third Then clause ("cannot be counted as complete") inherits both enforcement
  points for free. This mirrors the BO-2900a family decision and avoids a second
  eligibility oracle. Note the deploy-manifest consequence recorded in
  it_requirements -- done_proof.py's imports are the precedent that produced a
  ModuleNotFoundError in the deployed layout.

  MIXED SURFACE -- PARTIAL FLAG (S2.8, BP-1100f-3-i). Matched portion
  (python-coder / pytest): scripts/ac_store/*.py, scripts/build_phases.py.
  Unmatched portion: templates/agents/user-surface-smoker.md Step 6, a prose
  template edit. Flagged, not split -- ACD-1800f is at its 5-L2 cap. Recorded as
  a recommended companion llm-expert AC for the user's decision.
