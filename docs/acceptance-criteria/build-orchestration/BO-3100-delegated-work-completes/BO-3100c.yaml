criteria: |
  Coordination happens where waiting really works, so nothing is assumed done.

  Handing out parallel work and collecting the results is done only at the level
  of the system that can genuinely wait for an answer. Nowhere in a build is
  there a helper left coordinating work it has no way to wait for, so the whole
  category of "assumed finished" cannot arise — not merely because it is caught,
  but because there is no longer anywhere for it to happen.
