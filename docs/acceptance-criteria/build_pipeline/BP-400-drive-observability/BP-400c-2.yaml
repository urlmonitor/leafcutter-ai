criteria: |
  Given feedback.jsonl contains at least one entry in each of the
    actionable categories (knowledge-gap, convention-ambiguity,
    tooling-issue, quality-concern, blocker, subagent-quality),
  When trend_report.py is run with no filters,
  Then it exits with code 0,
  And the output contains at least one section per non-zero category,
  And each section contains at least one actionable recommendation,
  And a "Prioritized Action Items" section ranks categories by a
    combined score of count multiplied by severity weight,
  And high-severity categories with equal counts rank above
    low-severity categories.
