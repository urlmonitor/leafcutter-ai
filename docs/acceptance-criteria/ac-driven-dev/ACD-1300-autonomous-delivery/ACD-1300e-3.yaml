work_status: todo
declares_side_effect: true
roadmap_phase: phase_1
criteria: |
  Given a planning run with no person attached reaches a decision point and must record
    that it is waiting (write the record, then read it back to confirm it persisted),
  And a later run for the same run id must find, read, clear, and confirm the clearing of
    that record when it resumes,
  When each of those six record operations is carried out,
  Then each is performed either by a fixed command step that involves no agent or by an
    agent whose declared role explicitly includes reading and writing pause records,
  And none of them is given to an agent whose declared role is limited to other work
    (creating and removing worktrees, or investigating ticket state),
  And the pause ends with the run reported as waiting and the record present on disk,
    never ended as "pause persist failed" because the step that should have written the
    record declined it as outside its role,
  And the resume reads that record and applies the person's answer as ACD-2100c-3 requires,
  And the bug symptom ("on runs gpt-flow-step-links and fast-lane-test-gates, 2026-10-15/16,
    the pause record write was handed to the worktree agent, whose role is only worktree
    create/remove; it refused, every pause ended pause_persist_failed and the run could
    not be resumed at all") must not occur.
