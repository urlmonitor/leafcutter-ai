criteria: |
  Ending with nothing to show forces a retry instead of a pass.

  When a specialist finishes, the system decides whether it actually did its work
  by looking at what changed in your project — not by reading the specialist's
  own account of itself. One that leaves nothing behind is stopped from finishing
  quietly and is made to try again, so the empty result never reaches the build
  as a success.
