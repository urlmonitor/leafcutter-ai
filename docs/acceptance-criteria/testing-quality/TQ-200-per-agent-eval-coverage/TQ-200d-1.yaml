notes: |
  TQ-200d SUGGESTED SPLIT, ITEM 1 (test-writer). Rows stand in for the unit
  tests the prompt-only ACs TQ-500f-3, TQ-500f-4 and TQ-500f-4-ii cannot have.
  The prompt ACs' test_rationale should point at these rows once
  ac-authoring/tq-500f-2-ii-amend has merged (TQ-200d notes); not edited in
  this pass.

  NEGATIVE CASE (TQ-200a-4): "input moved to a new column" is the trap. It is
  the incident-2 shape: the natural fixture keeps seeding the old input, and
  the test then passes for the wrong reason.

  RUN THE ROWS BEFORE THE PROMPT CHANGES LAND. These rows do not depend on
  TQ-500f-3/-4/-4-ii being built: scored against today's test-writer, they
  should mostly fail — the eval's own red baseline. That is evidence, not a
  defect; record the before-score.

  LOCAL ONLY (user decision at the PO gate, 2026-09-28): the CI eval gate has
  never evaluated an agent (KI-TQ-20260907). The path to CI is TQ-200b-2; this
  AC does not wait for it and does not claim it.

  WHERE A JUDGE IS NOT NEEDED: the "refresh gate" row's test half is scored by
  running the produced test against the wrong version (TQ-200d-1-i). Other rows
  may start judge-scored; prefer a run wherever the expected outcome is a test
  going red.

  CASES COME FROM ONE ADOPTER'S WRITTEN RECORD, not re-verified against its
  history (same caveat as TQ-500f-5).

  IT-PO ENRICHMENT (2026-09-28)
  The existing artifact mode is product-truth specific (mock/flow). Test
  agents need their own scoring type, and it must live in a sibling module
  because run_agent_eval.py is over the ratchet. The BA flag on TQ-200a-1-i
  (in-scope list is not closed) stands.
  Lane: fast lane (python-coder). It can go first in the TQ-200d family.
