    relationship: specifies
    status: exists
  - path: docs/reference/claude-code-hooks.md
    relationship: describes
    status: exists
  - path: docs/architecture/adrs/ADR-007-ac-store-schema-id-format-enforcement.md
    relationship: describes
    status: exists
  - path: config/agent_registry.json
    relationship: describes
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Must follow the fail-open convention per docs/reference/claude-code-hooks.md"
  - "Must output the block decision as JSON to stdout per the PreToolUse hook contract"
  - "Must include all required error details in a single reason string (agent name, file path, violated rule, authorized agents list)"
  - "Must not hard-code the authorized agent list -- read from a configuration source so future additions do not require code changes"
  - "Must handle the case where agent identity cannot be determined gracefully (fail-open)"
delivers_to:
