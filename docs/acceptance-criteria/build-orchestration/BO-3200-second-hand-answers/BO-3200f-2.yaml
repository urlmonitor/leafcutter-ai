notes: |
  THE DEFECT BEING FIXED IS A CHARTER REFUSAL, so the first scenario uses the kinds of command
  that were actually refused or are at risk: store reads (fast-lane resolve and producibility),
  a store-mutating claim (fast-lane claim, dispatched today to the one agent that forbids it),
  git, and a script. A charter that admits reads but reserves mutations passes a reads-only test
  and fails the claim path.

  COMPOSES WITH AR-200c, DOES NOT DUPLICATE IT. AR-200c is that EVERY specialist states its
  limits, so absence is never read. This record needs only the executor's own entry to state its
  permission explicitly and to agree with its charter. How absence is interpreted registry-wide
  stays AR-200c's decision, and this record must not pre-empt it.

  A RISK THE IT PO SHOULD WEIGH, not decided here. "Admits every exact command" makes the
  executor the most capable party in the registry. The user's decision accepts that on the
  grounds that it exercises no judgement. Project guardrails and permission prompts still bind
  it; a command a guardrail blocks is a guardrail refusal (BO-3800's layer) and must be reported
  as that, not as the executor declining -- see BO-3200g.

  IT-PO ENRICHMENT (2026-09-16) -- THE RISK, WEIGHED.

  Accepted, with containment. "Admits every exact command" is acceptable only while four things
  hold, and each is now an it_requirement with a test: the executor's own tools are minimal and
  it cannot dispatch anyone (1, 2); every guardrail and permission rule binds it exactly as it
  binds a direct command, and nothing the package ships pre-approves its commands (3, and
  BO-3200f-1's guardrail-visibility parity test); guardrail escape hatches are not reachable
  through it (4); and a block is reported as a block, not a decline (5). Containment 6 keeps
  memory and skills from re-introducing judgement.

  A NOTE ON BO-3800. BO-3800 is a COMMIT-TIME standard summoning a craft. A PreToolUse block on
  an executor command is a different refusal at a different layer; what it shares with BO-3800
  is only BO-3200g's rule that a refusal is reported as a refusal by whom. Nothing here depends
  on BO-3800 or INF-800f.

  USER DECISIONS NEEDED.
    (a) Containment 4's load-bearing enforcement point. Authoring-time rejection by BO-3200f-3
        is fully within this package and testable today, but only covers commands written into
        shipped workflows. Run-time refusal at the guardrail covers every command, but depends
        on a hook being able to tell that the caller is the executor, which the hook payload
        may not expose. Recommendation: authoring time as load-bearing now, run time added if
        the payload supports it.
    (b) Permission prompts in unattended runs. Default here: no pre-approval of any kind. If
        fast-lane or plan-feature must run without prompts, the user decides which command
        FAMILIES get explicit allow rules; a rule keyed to the executor or its capture
        invocation is forbidden by containment 3.
    (c) Who may spawn the executor. Default here: workflow scripts only, spawn by any agent
        forbidden.

  CAVEAT -- NO LIVE-DISPATCH TEST SURFACE EXISTS. The unit suite drives workflows through
  unit_tests/_workflow_engine_harness.py with scripted agent replies; nothing in the repository
  dispatches a real agent in a test. The first scenario here and both scenarios of BO-3200f-2-i
  are model behaviour under a charter, so their e2e descriptors cannot run until such a surface
  exists. Recommended: a follow-up AC for an opt-in live-dispatch harness, or an explicit user
  decision to accept a recorded manual live run as the evidence for these three scenarios. Until
  one of those exists, these records must not be marked done on harness evidence alone.

  2026-09-16 (business-analyst) -- USER DECISIONS ON SECURITY CONTAINMENT, RECORDED. On
  2026-09-16 the user accepted the IT PO's security containment defaults as written, answering
  the three USER DECISIONS NEEDED above:
    (a) the guardrail bypass-variable rule (containment 4) is enforced at AUTHORING TIME now, by
        BO-3200f-3's routing check; run-time enforcement at the guardrail comes later;
    (b) no pre-approved permission rules of any kind -- no allow rule, settings entry or hook
        exemption for the executor, its capture invocation, or any command family;
    (c) only shipped workflow scripts may spawn the executor; no agent may list it in a
        spawn_allowlist.
  Recorded as a note only: criteria, readiness and every IT PO field are unchanged. The later
  run-time enforcement point has no acceptance criterion yet.

  2026-09-16 (business-analyst) -- LIVE-DISPATCH HARNESS DECIDED; THE FIRST SCENARIO IS NOT DONE
  WITHOUT IT. The user decided on 2026-09-16 that the scenarios only a real dispatch can prove --
  this record's first scenario and both scenarios of BO-3200f-2-i -- are proven by an opt-in
  live-dispatch test harness, not by a recorded manual run. The harness is specified by
  BO-3200f-2-ii. This record's first scenario is NOT DONE until BO-3200f-2-ii is satisfied and a
  switched-on run's evidence record shows that scenario passing. The "recorded manual live run"
  alternative in the caveat above is withdrawn. BO-3200f-2-ii is this record's child, so the
  ordering cannot be a depends_on edge (it would be a cycle); it is held by this note and by
  covered_by.
