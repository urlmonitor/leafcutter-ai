criteria: |
  Given the shared-block mechanism and the COMMIT-ANSWER block are built,
  When a reader opens the component diagram for shared blocks,
  Then it shows, as separate components, the block sources, the route templates with their empty
    marker pairs, the install step that fills them, the commit step's configuration feeding the
    install, the installed routes, and the identity check reading the installed routes,
  And it shows COMMIT-ANSWER's consuming routes (fast-lane-ship, plan-feature, quick-fix,
    finalize-feature and the /commit route) and shows build-feature and build-ticket outside that
    set,
  And it shows WORKSPACE-ANSWER as a second block on the same install step, not a second step,
  And it states, in its legend or notes, how this differs from the comparison of a workflow file
    with its shipped mirror (BP-1000e).
