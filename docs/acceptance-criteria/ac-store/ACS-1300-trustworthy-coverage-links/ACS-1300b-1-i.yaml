notes: |
  WITHOUT THE THIRD CLASSIFICATION THE ENUMERATION IS UNUSABLE IN PRACTICE. Some
  delivery paths genuinely carry work that names no requirement; forcing them into
  "bypassing" produces a permanent list of findings nobody can clear, and a list nobody
  can clear is a list nobody reads. That is how the enumeration in ACS-1300b-1 dies.

  BUT AN EXEMPTION IS THE EASIEST WAY TO MAKE THE WHOLE THING VACUOUS, which is why the
  second clause refuses to infer one. If a bypassing path with no stated reason were
  treated as exempt, the cheapest way to get a clean enumeration would be to state no
  reasons at all.

  THE STALE-EXEMPTION CLAUSE IS THE OTHER DIRECTION OF THE SAME RISK. An exemption
  written for a path that has since been deleted is a permission with no subject; left
  in place it quietly widens to whatever path later takes a similar name.

  THE FINAL CLAUSE IS THE ANTI-NO-OP PAIRING. Every clause above it is about something
  being classified benignly, and all of them are satisfied by an enumerator that
  classifies everything exempt. Requiring a bypassing classification in the same run
  makes that implementation fail.
