notes: |
  These two are a matched pair and must never be split across releases. KM-ADM-002
  records the four absent relations in the map; KM-ADM-003 makes the view draw them
  distinctly. KM-ADM-003's own notes state the trap plainly: recording them WITHOUT
  the distinct treatment made the rendered map WORSE than before, because four
  relations that do not exist were drawn as if they did. Any future work that adds a
  new absent relation inherits that ordering obligation.

  Boundary against sibling KM-ADM-100a: 100a is about how far a link that EXISTS can
  be trusted; 100b is about a link that does not exist at all. An absent relation is
  rated unenforced by definition and gets no trust discussion — do not let a future
  child blur the two axes.
