title: "A person can explore product-truth flows visually in the Atlas"
component: ux-prototyping
level: L1
status: active
req_status: approved
work_status: done
criteria: |
  As a person browsing the Atlas, I can open a Flows view that lists every product-truth
  flow, filter them by source and kind, select one to render as a graph, open any step to
  see its acceptance criteria's live status alongside the mock records and mockup it uses,
  and jump from an acceptance criterion to the flows it appears in — so I understand what
  the product does and how built it is without reading JSON or code.
