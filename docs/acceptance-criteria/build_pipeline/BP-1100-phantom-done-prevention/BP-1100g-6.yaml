notes: |
  Satisfies the reference-doc half of BP-1100g's documentation_triggers.

  THE PAGE'S JOB IS THE NEGATIVE, NOT THE POSITIVE. How to write a tag is two
  lines. What the tag is NOT is the whole reason the page exists: the moment
  these claims are visible in a diff, someone will read a reachability claim as
  reachability. The third and fourth clauses put the boundary and the accepted
  paste on the page, where the readers who would otherwise widen it will see
  them, rather than only in AC notes they will never open.

  THE TWO-CONSEQUENCE CLAUSE IS THERE BECAUSE THE TWO AXES SIT ON THE SAME TESTS
  and will be conflated by anyone reading the tests alone. Stating them side by
  side is cheaper than the incident.

  AGENT ASSIGNMENT DELIBERATELY OMITTED — BA-authored L2 with no technical
  enrichment; the IT PO assigns it and pins the real page path.

  IT-PO ENRICHMENT NOTE (2026-08-17). Assigned reference-author rather than
  documentation-expert, on the evidence of config/agent_registry.json: both are
  phase agents, but reference-author's selection_criteria is specifically "a new
  reference document in docs/reference/" while documentation-expert's is the
  broader docs-only / docs/*.md trigger. documentation-expert is additionally
  routed post-coder by the documentation_gates canonical-order path and will
  still review. Page path pinned to docs/reference/proof-claims-and-completeness.md,
  and a reconciliation requirement with BO-2900g-5's ASK-side page was added —
  two new reference pages authored in the same window that state different
  permitted kinds would recreate GAP C one layer up.
