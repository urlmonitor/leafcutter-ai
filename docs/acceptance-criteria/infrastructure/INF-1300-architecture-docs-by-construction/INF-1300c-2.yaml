notes: |
  THE PLACEMENT DECISION, TAKEN EXPLICITLY BECAUSE THE L1 FORBIDS TAKING IT SILENTLY.
  INF-1300c's notes say the index does not exist, that choosing it is a product decision
  about where readers should stand, and that a BA must not quietly pick the file easiest to
  append to. The choice here is the file the authoring instruction already names —
  docs/architecture/README.md — and the grounds are stated so they can be overruled: that
  path is what reaches every author and every adopting project today; the existing
  diagram-folder README already points readers to it, so choosing anywhere else leaves that
  pointer dangling and creates a second place to look; and it sits above the genre folders,
  which is the only position from which the whole collection is visible. The two
  alternatives the L1 names were weighed. A per-genre index was rejected because the
  collection already has one of those and it lists nothing, and because it cannot answer
  "show me the architecture" without the reader already knowing which genre to open. The
  component documents acting as the index through their lists of children was rejected
  because those lists exist to satisfy the two-directional link check, so they would acquire
  a second purpose that the check would then constrain — and a document with no parent would
  be reachable from nowhere.

  WHY CREATING THE FILE IS IN SCOPE RATHER THAN A PREREQUISITE. The listing behaviour cannot
  be observed at all without a target, and a project adopting this way of working will have
  no index either — so an implementation that assumes one exists works here after someone
  creates it by hand and fails everywhere else, which is the failure INF-1300e exists to
  prevent, reproduced inside INF-1300c.

  THE NO-DUPLICATION CLAUSE IS LOAD-BEARING. The diagram folder's README states the naming
  and numbering convention. An index that restates it creates the second copy, and the
  second copy is the one that goes stale — this collection already demonstrates the pattern,
  carrying two forward references to two documents that do not exist. Referring beats
  repeating.

  FALSIFIABILITY. Two scratch collections. In the first, with no index present, produce a
  document with its listing requested: the record is falsified if no index appears at the
  named place, if it lacks the entry, if it restates a convention that is already stated
  elsewhere in the collection, or if the project's document checks reject it. In the second,
  with an index already present holding several entries in a deliberate order, produce
  again: falsified if the file is replaced, if its order changes, or if anything in it
  beyond the new entry differs. The second collection is what separates "creates an index"
  from "overwrites the index", and the two are indistinguishable when the only observation
  starts from nothing.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale, delivers_to and expects_from. Those are the IT PO's.
