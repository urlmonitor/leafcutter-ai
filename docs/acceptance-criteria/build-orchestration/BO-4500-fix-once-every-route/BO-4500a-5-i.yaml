notes: |
  The fast lane is often the HARDENED copy (BO-4500 notes: KI-BO-020; the hardened AC writer
  _fl_lifecycle). For commits it is the WEAKEST on staging (add -A) but its halt-on-non-ok reading
  of replies is the hardened reply handling C2 credits it with -- keep that, which is the third
  clause of the first Then. BO-9999a-1 is a placeholder id for the test fixture.
