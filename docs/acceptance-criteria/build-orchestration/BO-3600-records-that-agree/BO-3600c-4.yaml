notes: |
  Satisfies BO-3600c's documentation_triggers: [reference-doc].

  This entry has a job beyond description: BO-3600c-2 makes an entry without an
  identifying anchor unverifiable, and that only improves the register if the people
  writing entries know what an anchor is. Undocumented, the check would spend its
  first year reporting the whole register as unverifiable.

  The third scenario carries BO-3600c-3's scope declaration into the documentation,
  where a reader meets it before they rely on a result rather than after.

  assigned_agent deliberately unset — the reference surface belongs to the IT
  Product Owner's assignment pass.
