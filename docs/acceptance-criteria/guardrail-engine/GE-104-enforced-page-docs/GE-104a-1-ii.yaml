it_requirements:
  - "Extend the SAME shared derive_doc_path helper from GE-104a-1-i to handle multi-segment and dynamic routes; do not create a second derivation path."
  - "Nested-route flattening (canonical): join all route segments between 'site/app/' and '/page.tsx' with a single hyphen '-'. Example: site/app/parts/list/page.tsx -> docs/reference/frontend/parts-list.md. Because the full ordered segment list is preserved in the joined name, two different nested routes can never collapse to the same doc path (the join is injective over distinct segment sequences given the rules below)."
  - "Dynamic-segment normalization (canonical, resolves BA open question on [id] handling): a Next.js dynamic segment of the form '[param]' is normalized by stripping the surrounding brackets and prefixing with a stable marker so it never collides with a literal segment of the same name. Use the literal segment text with brackets removed and the parameter name preserved, prefixed with the token 'p_'. Example: site/app/parts/[id]/page.tsx -> docs/reference/frontend/parts-p_id.md. The same dynamic route therefore always maps to the same doc path on every commit (deterministic)."
  - "Catch-all / optional-catch-all segments ([...slug], [[...slug]]) must also normalize deterministically without colliding with simple or single-dynamic segments; apply the same bracket-strip + 'p_' prefix rule to the inner name (e.g. [...slug] -> p_slug), and treat the same input identically on every run. If a route shape outside {literal, [param], [...param], [[...param]]} is encountered, the helper must fail loudly (raise) rather than silently produce an ambiguous path, per the project error handling policy."
  - "The resulting <name> must be filesystem-safe (lowercase, hyphen-separated, underscore-prefixed dynamic tokens) so the doc path is a valid on-disk path on all target platforms."
  - "Derivation remains a pure, deterministic, idempotent function of the page path with no filesystem or git dependence."
