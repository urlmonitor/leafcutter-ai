criteria: |
  One canonical record per thing — it grows by extension, never by duplication.

  As a project grows, its record stays something a person can actually sit down
  and read. There is one authoritative description of each thing rather than
  several near-copies, so reviewing the record stays a job someone will do,
  instead of a job everyone quietly stops doing.
