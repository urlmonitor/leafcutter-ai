roadmap_phase: phase_3
criteria: |
  The PR title is the L1 feature title -- what the reviewer gets, not what the developer did.

  When a PR is created for a ticket, the title is taken directly from the
  L1 acceptance criterion the ticket fulfills. The result is a PR list
  that reads like a feature announcement rather than a developer's shorthand.
