criteria: |
  Given a ticket is generated from an AC and the generator's back-reference writer
    records the generated ticket's path into that AC's implemented_by list,
  When the recorded path value is written,
  Then the recorded value is a repo-relative path (for example
    tickets/00_inbox/epics/EPIC-.../NN_TICKET-....md),
  And the value has no leading "/" and is not an absolute filesystem path,
  And the value contains no worktree-specific or per-checkout directory prefix
    (the same AC generated from any worktree records the identical repo-relative
    path).
