notes: RQ1; RQE-01 and RQE-03 completeness controls. Inherit ACS-1100 denominator/method honesty; the 15/5/10 and
  terminal-leaf 11 values belong only to the independently reviewed pinned example, not hard-coded production totals.
  Authored using the business-analyst template under explicit user authorization to draft ACs; not approval or implementation
  proof.
it_requirements:
- Retain immutable repository/source SHA provenance, bounded registered read-only queries and existing kernel authorization,
  budgets and retries. This contract adds no arbitrary Cypher, new network endpoint, source-write permission or
  automatic query activation.
- The named fields below describe the planned observable semantic contract; preserve compatible existing envelope
  fields and version any incompatible extension. Required unavailable values stay explicit and are never inferred
  from an evaluation oracle.
- Use canonical IDs for deduplication and the resolved source-pinned hierarchy policy for membership. Declare repository/family/level
  filters with every count; a bounded family query cannot establish a project-wide count.
- Exact totals require attributable enumeration completeness at one source SHA/generation. Exhausted fanout, paging,
  byte or item budgets, unresolved children and expired continuation produce a known subset with exact_total unavailable;
  retain existing resource limits.
- Include missing work_status in an explicit unknown bucket without relabeling it done or active. Counted implementation
  status is not test execution, delivery readiness or deployment proof.
- The RQE-01 fixture establishes 15 descendants (5 done, 10 todo) versus 11 terminal leaves only at its pinned oracle.
  Production behavior derives membership and values from returned evidence, not fixture constants.
test_required: true
test_rationale: Planned criterion and public reachability proof includes real producer/consumer boundaries and named
  plausible wrong outcomes. No descriptor is executed coverage; no provider, database or deployment result is asserted.
test_spec:
- name: test_public_count_matches_explicit_pinned_population
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Through the public research entry point consume actual RQE-01-P evidence and assert 15 distinct root-excluded
    L2/L3 descendants with 5 done and 10 todo, source provenance and complete enumeration.
  must_catch:
  - Counting the selected root, counting only leaves without disclosure or labeling active as done.
  covers:
  - KM-500e-3
  requires_db: false
  surface_invoked: Existing kernel research run/resume entry point using retrieve.repository
- name: test_count_deduplicates_identity_and_preserves_unknown_work_status
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Provide repeated paths to the same canonical AC and one missing work_status; assert deduplicated
    membership and a visible unknown bucket without asserting a fully known status breakdown.
  must_catch:
  - Counting graph paths as separate ACs or dropping records that lack work_status.
  covers:
  - KM-500e-3
  requires_db: false
- name: test_count_reports_partial_when_real_enumeration_is_bounded
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: seam
  description: Run the real enumeration consumer with truncated, unresolved-child and expired-continuation responses;
    assert known_count and limitations survive while exact_total is unavailable and no extra query bypasses budget
    limits.
  must_catch:
  - Returning a bounded first page as an exact population total.
  covers:
  - KM-500e-3
  requires_db: false
- name: test_count_scope_changes_do_not_reuse_wrong_population
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: Ask for terminal leaves after the 15-descendant fixture and verify the independently anchored 11-leaf
    scope; then change repository/source scope and assert no cached 15 or global claim leaks across contexts.
  must_catch:
  - Reusing a count from another hierarchy inclusion rule, repository or source revision.
  covers:
  - KM-500e-3
  requires_db: false
