notes: |
  BASELINE, so the test has something to compare against. Measured at 9b16d013
  by validating every AC YAML in docs/acceptance-criteria/ except index.yaml:
  280 records refused in total, 243 of them for lacking a structured
  implementation spec, leaving 37 refused for unrelated reasons (chiefly a
  missing `components` list, plus two on a `framework` value outside its enum).
  Re-measure and pin these two numbers in the test as of the implementing
  commit; they drift as other work lands, and a test that hard-codes 243 without
  re-measuring will fail for the wrong reason.

  This is deliberately an assertion about the REAL store, not about fixtures.
  The defect KI-ACS-005 records is a property of the corpus — a gate that is
  diff-scoped and therefore invisible until an unrelated change drags one of
  these records into a diff. A fixture-only test cannot observe that property.

  Second-scenario intent: the change must be a narrowing, not a loosening. If an
  implementation reaches "zero refusals on this rule" by weakening validation
  generally, the 37 unrelated refusals will shrink too, and this scenario fails.

  Honest statement of what this AC concedes: on today's corpus, where no record
  declares a package surface, the obligation applies to nothing. That is the
  intended outcome of the narrowing and the reason the backfill is a separate
  epic — the 243 records are not being certified as correct, they are being
  taken out of the gate's scope until an author or the backfill declares them.
