title: "New requirements flow into the AC store through a single command"
component: ac-driven-dev
level: L0
status: active
req_status: active
work_status: todo
criteria: |
  Given a user has a new feature idea, a behavioral addition, or a technical constraint,
  When they invoke a single command (/create-ac),
  Then the system triages their request, routes it through the correct authoring agents
    (PO v3, BA v3, IT PO v3) in sequence with user confirmation gates between stages,
  And the output is written to the AC store (docs/acceptance-criteria/<component>/),
  And duplicate or already-covered requirements are surfaced rather than re-authored,
  And the user controls progression at each stage before the next agent begins.
