id: BP-1000d-1
readiness: approved
priority: high
title: "A source script with no shipped template counterpart is never flagged as a parity failure"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build_pipeline/BP-1000-source-template-parity/BP-1000d.yaml"
criteria: |
  Given the source tree contains a script that has NO corresponding shipped
    template copy (source-only tooling a consumer would never receive, for
    example a developer-only build or maintenance script)
  And the source tree also contains mirrored source-template script pairs
  When the merge-gate parity check runs
  Then the source-only script is not included in the parity comparison
  And the source-only script never causes the parity check to report drift
  And the parity check evaluates only scripts that have a shipped template
    counterpart, so its pass or fail verdict depends solely on mirrored pairs
