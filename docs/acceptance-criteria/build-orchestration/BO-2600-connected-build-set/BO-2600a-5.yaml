  contract: "goal_to_epic exposes an id-list entrypoint (e.g. `--ids id1,id2,...` / build_epic_from_ids) that assembles a dependency-ordered epic from exactly the provided connected-set ids, so build-ac can pass the select_connected result as epic CONTENT rather than re-walking a subtree."
expects_from: null
it_requirements:
  config_schema_fragment: null
  reference_file_path: scripts/goal_to_epic.py
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  notes: |
    Add an explicit id-list entrypoint to goal_to_epic (scripts/goal_to_epic.py) — a
    `--ids` CLI mode and/or a build_epic_from_ids(ids, *, store_root, inbox_dir)
    function — that assembles the epic from EXACTLY the provided dependency-ordered leaf
    ids. Reuse the existing internals: resolve_leaf_dependencies (restricted to the given
    id set so out-of-set edges are dropped), topological_sort, the per-leaf
    generate_ticket path, and the epic-folder + Master_Plan assembly. Do NOT call
    traverse_ac_tree to re-derive the set from a single AC's subtree — that is the exact
    defect this AC closes: the current `--ac` path re-walks the subtree and would drop
    cross-tree genuine prerequisites that fast_lane.resolve_connected_build_set had
    already included. Preserve the existing single-AC `--ac` mode unchanged (backward
    compat). Translate each ticket's depends_on from AC ids to co-located ticket
    filenames so ticket_frontmatter_guard passes. NOTE the deployed/source path: in this
    repo goal_to_epic.py lives at scripts/goal_to_epic.py (not scripts/ac_store/).
test_spec:
  - name: test_build_epic_from_ids_uses_exact_set
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "The id-list entrypoint builds tickets for exactly the provided ids, including ids outside the first id's subtree (cross-tree prerequisites are NOT dropped)"
  - name: test_build_epic_from_ids_dependency_ordered_and_wired
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "Generated tickets are prerequisites-first and depends_on references co-located ticket files so ticket_frontmatter_guard passes"
  - name: test_ac_mode_preserved_backward_compatible
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: unit
    description: "The existing single-AC --ac mode produces the same epic as before the id-list mode was added"
