criteria: |
  Given the knowledge query renders a graph as JSON from an in-memory {nodes, edges}
    structure using its existing render_json serializer
  When the same source tree is served once by a live full parse rendered as JSON and
    once by the index-backed read rendered as JSON
  Then the two JSON outputs are byte-for-byte identical for that tree
  And the on-disk index stores the graph in the same {nodes, edges} shape that
    render_json consumes, so no separate serializer or reshaping step is introduced
    on the index-backed path
