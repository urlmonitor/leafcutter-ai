id: TQ-600b-6
components:
  - testing_quality
title: "The command for running the suite is written down in the places people look, and so is the way to force it back to one at a time"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a contributor who wants to run the test suite and has the project's written
    guidance and nothing else,
  When they follow it,
  Then they run the suite with the documented command and the run spreads across the
    machine, without their having to know the parallel runner's own flags or to have
    been told about it by somebody,
    And the same guidance states, in the same place, the one documented way to force
      the run back to one test at a time, and that way works as written,
    And it states the occasions on which a reader would want to do that — reading
      output that interleaves between workers, and isolating a failure that only shows
      up when tests run beside each other — so the serial run is presented as a
      diagnostic step rather than as a matter of taste,
    And it says what to do when a test passes one at a time and fails in parallel:
      that this is a finding about the test rather than a reason to stop running in
      parallel, and where the guidance on per-test scratch space and on not touching
      the checkout the run started from can be found,
    And the command and the escape hatch are stated in both of the places a
      contributor looks — docs/testing/README.md and unit_tests/README.md — and the
      two agree with each other, so neither can drift into naming a command the other
      does not.
depends_on:
  - TQ-600b
  - TQ-600b-1
  - TQ-600b-2
  - TQ-600b-5
