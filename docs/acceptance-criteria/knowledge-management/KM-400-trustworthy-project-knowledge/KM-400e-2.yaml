criteria: |
  Given evidence is sufficient, a canonical ID is known, a relationship is requested, or an ambiguous precedent is sought
  When the existing decision mechanism assesses the evidence gap
  Then it respectively skips with a reason or selects exact, graph, or supported hybrid retrieval
  And obvious exact or registered requests require no new language-model judgment
  And the choice records its reason, allowed fallback and bounded disclosure budget
  And an unavailable capability is not interpreted as evidence that no knowledge exists
