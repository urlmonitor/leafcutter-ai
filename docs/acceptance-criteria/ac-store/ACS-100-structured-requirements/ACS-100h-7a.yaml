id: ACS-100h-7a
components:
  - ac-store
title: "A shared AC-tree-limit check is callable at scaffold time and returns the violation set"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the check-ac-tree-limits enforcement logic that counts each AC's children
    by ID-derived parent (the same logic check_ac_limits.py applies in the
    pre-commit hook, deriving the parent from each child's ID string via
    derive_parent_id),
  When that logic is invoked programmatically against a target AC subtree
    (not only as a git pre-commit hook),
  Then it returns the set of limit violations, where each violation identifies
    the over-limit parent AC ID, its level, its ID-derived child count, and the
    effective limit applied (default limit adjusted by any child_limit_override
    on that parent),
  And the same callable is used by both the pre-commit hook path and any
    scaffold-time caller, so there is exactly one implementation of the
    child-counting and limit rule (no second independent traversal).
depends_on: [ACS-100h, ACS-100h-7]
doc_links:
  - path: templates/scripts/commit_guardian/check_ac_limits.py
    relationship: specifies
    status: exists
  - path: scripts/ac_store/ac_parent_id.py
    relationship: related
    status: exists
  - path: docs/reference/ac-schema.md
    relationship: related
    status: exists
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "MUST expose the existing check-ac-tree-limits child-counting + limit logic as a reusable callable; the pre-commit hook and the scaffold-time caller MUST both go through this one callable so the two enforcement points never drift"
  - "MUST count children by ID-derived parent via derive_parent_id (scripts/ac_store/ac_parent_id.py), NOT by covered_by or depends_on membership (consistent with GE-106)"
  - "MUST compute the effective limit as the default (7 for L0, 5 for L1) adjusted by any child_limit_override on the parent"
  - "MUST edit the canonical template copy and rebuild via build.py to sync the deployed/built copy (config/template parity per ADR-001); never edit one side only"
  - "MUST complete within a typical scaffold-time budget (sub-second for stores up to ~200 AC files) so it does not noticeably slow /create-epic"
delivers_to:
  agent: llm-expert
  contract: "Callable returning the violation set as a list of { parent_id: str, level: str, id_derived_child_count: int, effective_limit: int } — one entry per over-limit parent in the target subtree; empty list means no violation. Counting uses ID-derived parents (derive_parent_id) and honours child_limit_override."
