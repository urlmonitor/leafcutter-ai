notes: |
  Motivating real example supplied by the user, from an epic ticket in the inbox:
  "documentation-verifier (status: blocker) …; pr-reviewer signed off at 01:30 despite
  this — proceeding per supervised path authorization." One prose line, attributable to
  nothing, countable by nothing.

  THERE IS NOT ONE CHOKEPOINT. The original AC assumed a single place where a human
  declares an override. A census found at least four places where work proceeds past a
  blocking check, and only one of them is the human-prose path:

    1. The build workflow's cross-agent branch (templates/workflows-js/build-ticket.js,
       the phase loop): a cross-agent blocker pushes the phase onto skippedPhases and
       breaks out of the loop. The blocker is never re-raised and the run can still return
       a successful status. This is fully automated, requires no human decision, and is
       the path most likely to dominate the override count. It is now covered.
    2. Absent manifest (templates/skills/building-epics/SKILL.md, manifest routing table):
       an absent completion_manifest is treated as all-true and the supervisor proceeds.
       About 645 of 3,423 sign-off comments carry no manifest, so this fires constantly.
       It is now covered, flagged distinctly as an assumed pass rather than a declared
       override, because no finding was actually overruled — evidence was simply never
       supplied, and blending the two would inflate every gate's override rate.
    3. Supervised commit auto-authorization (building-epics §5.0): the commit agent's
       interactive confirmation gate is auto-authorized on a supervised dispatch. NOT
       covered here, deliberately — no gate raised a finding and nothing was overruled;
       what is bypassed is a confirmation prompt, not a check. Recording it as an override
       would attribute a phantom false positive to the commit phase. If a case is later
       made that prompt bypasses belong in the same ledger, they need their own record
       kind, not this one.
    4. Ad-hoc human prose — the path the original AC covered, still first above.

  WHY AN INSTANCE IDENTIFIER WAS ADDED. The defect identifier referenced here is the
  signature established by BO-2800b-2, which is derived from the gate and the rule
  identifier alone — a CLASS identity. The original clause "two blocking findings overruled
  on the same work produce two override records" therefore produced two byte-identical
  records whenever the same rule fired twice on one ticket, which is exactly the motivating
  case the user described (one defect firing four times in one epic). Without an instance
  discriminator the two records are indistinguishable and a deduplicating store would
  silently keep one, undercounting precisely the recurrence this goal exists to measure.

  The class-identity reference is why this L1 is sequenced after b rather than in parallel
  with it: an unattributed override count is a tally of frustration and cannot justify
  anything.
