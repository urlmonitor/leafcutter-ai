  - "Grounded (2026-07-10): build_workflow_scripts() currently yields a deployed plan-feature.js of 61,383 bytes while the canonical source templates/workflows-js/plan-feature.js is 82,834 bytes, so the plan-feature deploy assertions in tests/test_build_phases.py fail. Fix so deployed == canonical source."
