notes: |
  THE MISSING PRODUCER HALF OF ACS-500 (load-bearing — carry into L2/L3).
  ACS-500a-f all presuppose that patterns ALREADY EXIST: 500a says where a
  recognised pattern lives, 500b keeps page specs to what is unique, 500c has
  agents detect and link to EXISTING patterns, 500d propagates updates, 500e
  captures composition, 500f enforces the above mechanically. NOTHING covers
  CREATING a pattern in the first place, which closes the loop: the pattern
  inventory is empty, so the pattern-first check never matches, so a standalone
  AC is written, so no pattern is ever created. Verified in the live store —
  ZERO pattern records and ZERO ACs setting implements_pattern, despite the
  schema and the pre-commit hooks fully supporting both.

  Two halves the BA must decompose (do NOT collapse into one):
  (a) ONGOING PROMOTION — recurrence noticed while new requirements are being
      authored is promoted at that moment, so the inventory keeps growing.
  (b) RETROSPECTIVE SWEEP — a pass over the requirements already in the store
      that seeds the first patterns and breaks the cold-start deadlock.
  Both must yield a single parameterised definition that consumers reference
  (feeding ACS-500a's one-place rule and ACS-500c's detect-and-link behaviour)
  — this L1 is the producer, ACS-500c is the consumer; keep them distinct.

  The HOW (which agent or skill performs promotion, the sweep's mechanics, the
  record format) is deliberately unspecified here — that belongs to the BA and
  IT-PO layers.
