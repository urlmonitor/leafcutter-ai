criteria: |
  Given the by_ac inversion of the flow->AC edges,
  When generate_product_truth.py runs,
  Then it overwrites each referenced AC's product_truth block wholesale from that AC's
  by_ac list (the relationship is many-to-many, so product_truth is a list),
