criteria: |
  Given /build-feature is invoked for an epic with at least one ready ticket,
  And the first pre-drive feedback-sink reachability probe against
    debugging/logs/agent_telemetry.jsonl returns a non-zero result because the
    debugging/logs/ directory is absent,
  When the remediation step creates the missing directory and the probe is retried,
  And the retried append to debugging/logs/agent_telemetry.jsonl returns a
    successful (zero) result,
  Then the drive proceeds past the pre-dispatch stage and dispatches
    ticket-supervisors normally,
  And no hard-block operator message is shown,
  And the earlier first-attempt failure does not cause the drive to halt.
