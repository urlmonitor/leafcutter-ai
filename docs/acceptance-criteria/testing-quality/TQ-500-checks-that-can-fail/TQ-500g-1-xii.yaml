    state: to_be_created
  - path: scripts/build_orchestration/_wvw_write.py
    state: existing
it_requirements:
  - >-
    The decision lives in one place, _wvp_plan (created by TQ-500g-1-xi), called by the list step and by
    the write step alike, so the list's to_prepare, the manifest's source values and the names sent to
    the preparer can never disagree. No route, prompt or second module re-derives it.
  - >-
    Lookup: an owed name finds its pin only through _wvr_scope.norm_name (strip, then casefold), the same
    normalisation as the alias rule; nothing else is normalised (inner spaces, punctuation and any other
    character count). A name with no pin under its key is "prepared: not pinned". The writer's reply
    matching stays exact (TQ-500g-1-ix decision 2c); only the pin lookup is normalised.
  - >-
    Retarget trigger: a pinned replacement whose old text no longer occurs exactly once in its file as it
    now stands is never applied. Wording, exactly: "re-prepared: target changed" when it occurs 0 times;
    "re-prepared: old text found N times" when it occurs N >= 2 times (TQ-500g-1-xiii's check a). The
    count uses _wvw_prepare's own counting and CRLF rule, never a second matcher. A pin with several
    replacements is judged in order, each against the result of the one before, as the writer applies
    them; the first failing one names the reason.
  - >-
    Spelling: a name applied from the pin keeps the pin's replacements but its manifest entry and every
    verdict row carry the name as the CURRENT entry spells it (owed spelling), never the spelling stored
    with the pin.
  - >-
    Unowed pins: the plan iterates owed names only, so a pin whose name is not owed is neither applied,
    nor reported, nor removed; it is used again, after the checks, when an entry names it again. No step
    except the reset (TQ-500g-1-xvi) removes it.
  - >-
    to_prepare items are the owed items byte for byte (name, files, scope, and the additive blocking and
    origin keys of a to-run-later extra), in owed order. A to-run-later extra (TQ-500g-2-ii) follows the
    same three triggers.
  - >-
    Deterministic: the same owed list, pin file and code give byte-identical list output and plan.json.
    The plan reads only the pin file, the AC store (through the shared reader) and the files the pinned
    replacements name; it never scans the repository. 50 owed names are planned within 1 s on a typical
    work when no pytest run is needed.
  - >-
    Every new or changed Python file stays at or under 400 counted lines; no new module is needed beyond
    _wvp_plan (deployed by the build_orchestration directory glob, no deploy-list edit).
test_spec:
  - name: test_only_new_retargeted_or_reworded_names_go_to_the_preparer
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: criterion
    surface_invoked: python scripts/build_orchestration/wrong_version_writer.py list
    description: >-
      Temp repo and AC store for 07_TICKET-refresh-gate with a pin file holding N1 to N4 as in the
      criteria, the entry now naming N1, "Retry only once ", "skip the refresh when the cache is cold" and
      N5. list --work-key prints to_prepare with exactly N2, the cold name and N5, each item equal to its
      owed item (same files), and decisions "pinned" for N1 and N3.
    must_catch:
      - every owed name sent to the preparer although its pin still matches
      - to_prepare items carrying different files from the owed list
    in_scope_files:
      - scripts/build_orchestration/_wvp_plan.py
      - scripts/build_orchestration/_wvw_list.py  # 2026-10-29: to_prepare is built here (list_payload)
  - name: test_case_and_trailing_space_difference_uses_pin_with_current_spelling
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: >-
      N3 pinned as "retry only once" and now spelled "Retry only once ". finish applies the pinned
      replacement and the manifest entry and the verdict rows spell the name "Retry only once ".
    must_catch:
      - pin lookup by exact string, so a case change re-prepares the name
      - the row spelled as the pin stored it
    in_scope_files:
      - scripts/build_orchestration/_wvp_plan.py
      - scripts/build_orchestration/_wvw_write.py
  - name: test_retargeted_pin_never_applied_and_row_says_target_changed
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: failure
    description: >-
      N2's pinned old text "return refresh_due and retry_due" no longer occurs. The reply prepares N2
      afresh; the manifest entry for N2 holds the new replacement with source "re-prepared: target
      changed", and no altered copy or replacement from the pin is used. With no reply for N2 it is
      could_not_prepare "no alteration returned" and the pin is not applied either.
    must_catch:
      - a stale pinned copy applied when the old text is missing
      - the name dropped when its pin no longer matches
    in_scope_files:
      - scripts/build_orchestration/_wvp_plan.py
      - scripts/build_orchestration/_wvw_write.py
      - scripts/build_orchestration/_wvp_checks.py  # 2026-10-29: the old-text check lives here (TQ-500g-1-xiii)
  - name: test_reworded_name_never_takes_the_old_wordings_pin
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      The warm name is pinned and the entry now names the cold name. The cold name's decision and row say
      "prepared: not pinned", the warm pin is never applied to it, and the warm pin is absent from owed,
      to_prepare, decisions and the verdict, while still present in the pin file.
    must_catch:
      - a reworded name matched to the old pin by entry position or similarity
      - the unowed pin deleted from the store
    in_scope_files:
      - scripts/build_orchestration/_wvp_plan.py
      - scripts/build_orchestration/_wvp_store.py  # 2026-10-29: pins are written only here
  - name: test_unowed_pin_used_again_when_the_name_returns
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: boundary
    description: >-
      After a run in which the warm name is not owed, a later entry names it again: list puts it nowhere in
      to_prepare and its decision is "pinned", and finish applies the warm pin to the current file.
    must_catch:
      - a pin dropped by a run that does not owe it
    in_scope_files:
      - scripts/build_orchestration/_wvp_plan.py
      - scripts/build_orchestration/_wvp_store.py  # 2026-10-29: pins are written only here
  - name: test_any_inner_wording_change_counts_as_a_new_name
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      A pin for "retry only once" and an entry naming "retry only  once" (two inner spaces) and, in a
      second case, "retry only once." (a full stop). Both are in to_prepare as "prepared: not pinned".
    must_catch:
      - name comparison that collapses inner whitespace or strips punctuation
    in_scope_files:
      - scripts/build_orchestration/_wvp_plan.py
test_required: true
test_rationale: >-
  The three triggers and the normalised lookup are deterministic, so every entry runs the real list and
  finish CLIs on a temp git repo and AC store with a hand-written pin file and reply fixture, and asserts on
  to_prepare, the decisions, the manifest entries and the verdict rows. The discrimination entries carry the
  non-obvious rules: a reworded name gets no link to the old pin, and only strip plus case-fold is
  forgiven. Route behaviour (only to_prepare is dispatched) is proven in TQ-500g-1-xi.
