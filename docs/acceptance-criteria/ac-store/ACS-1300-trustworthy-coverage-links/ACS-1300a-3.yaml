notes: |
  PROMOTED FROM L3 TO L2 on the coordinator's and the product owner's instruction, and
  the reason is the population rather than the principle. The investigation that started
  this work was a sweep of composites marked finished with at least one unfinished
  child — records whose coverage list holds child ids by definition. For the population
  that motivated the repair, this is the common case, not an edge one.

  THE TWO "UNCHANGED CLASSIFICATION" CLAUSES ARE THE FALSIFIABLE PART, and they are
  deliberately bound to two DIFFERENT existing readers. A criterion that only said "the
  file is unchanged" is satisfied by a tool that does nothing; a criterion that only
  said "abstain on parents" is satisfied by a tool that recognises parents by their
  level field and gets it wrong for a legacy record. Binding to the verdict
  done_proof actually reaches, and to the verdict the back-link gate actually reaches,
  ties the outcome to how the field is really consumed.

  ABSTAIN, DO NOT DISAMBIGUATE. There is no reliable discriminator: a legacy record can
  hold test-file paths where child ids would go (see _has_resolvable_child's own note on
  that case), so entry shape does not settle meaning, and inventing a rule that decides
  it would write false evidence. Abstention with a stated reason keeps the record
  visible for a human without the tool guessing.

  THIS IS WHERE THE TREE'S ELIGIBILITY TEETH ACTUALLY ARE — established 2026-09-01 and
  worth understanding before anyone judges this AC's importance. Everywhere else in this
  tree, restoring a coverage link changes nothing about whether a record can be marked
  finished: verify_done_eligible resolves from the direct `# covers:` tag first, and every
  rotted record has a direct tag by construction, so the field is never read for it (527
  of 549 rotted records are already eligible). The ONE place the field is read is the
  composite path — a PARENT whose proof is derived from its child list. So a stale or
  wrong child list is the single case where coverage rot has downstream consequences for
  what the store believes is finished, and that is exactly the population this AC governs.
  Measured the same day: 118 parents have a differing child set between the coverage
  relation and ID-derivation; 1,312 ids are a parent under the coverage relation against
  1,286 under ID-derivation, and 60 ids are a parent under one relation only.

  WHICH MAKES THE ABSTENTION MORE IMPORTANT, NOT LESS. Appending a test path to a parent's
  child list is the one write in this whole tree that could change a done-proof verdict —
  it is the only write with teeth, and the teeth point the wrong way. That is the argument
  for abstaining rather than a reason to reconsider it.

  AND A BOUNDARY, BECAUSE THE ADJACENT REPAIR IS TEMPTING FROM HERE. Repairing a stale
  child list is NOT this tree's job. It is a different operation on a different relation,
  it already has a tool in scripts/ac_store/fix_ac_orphans.py, and the 118 disagreements
  above are its population, not ours. This AC abstains and reports; it must not grow a
  child-list repair, and the 12-of-25 composite slice in the L0 notes is evidence for the
  problem's existence, not a work item for this record.

  A SEPARATE FIELD WOULD DISSOLVE THIS ENTIRELY — a distinct place for child ids and for
  test links, so neither reader has to infer which it is looking at. That is a schema
  change well outside this tree's scope and is recorded here only so the next author
  knows the abstention is a consequence of the field's shape, not a preference.
