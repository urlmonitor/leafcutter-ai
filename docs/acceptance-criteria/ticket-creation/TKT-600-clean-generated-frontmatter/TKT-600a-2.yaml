notes: |
  WHY THIS AC EXISTS. TKT-600a stays open with its only child done, and its
  amended_by entry of 2026-09-01 names the two ways to close it: a new child
  covering the remaining case with a mechanism that is not phrase-matching, or an
  explicit decision to narrow the L1 too. This is that new child. The residual case
  TKT-600a-1 deliberately excluded is an illustrative path that both carries a file
  extension and exists on disk — the on-disk is_file() gate cannot see it, because
  the path is real; what makes it wrong is what the record says the path is FOR.

  THIS IS NOT THE REJECTED APPROACH, and the difference is the whole point of the
  record. Two mechanisms were tried and rejected, both documented in TKT-600a-1's
  amended_by of 2026-09-01:

    (1) A nine-pattern English cue blocklist (_PROSE_CONTEXT_ONLY_CUES) matching
        phrases like "do not edit" and "context only". Rejected on measurement: it
        fired on no cue in the real bullet that broke the GE-123 epic, and it
        silently dropped genuine edit surfaces elsewhere ("see scripts/goal_to_epic.py
        for details" -> []). It guessed authorial intent from English phrasing.

    (2) Dropping prose harvesting entirely. Rejected because it falsifies
        TKT-500f-8-i, which is readiness approved, work_status done and priority
        high, and whose criteria require that a real source path named only in a
        prose bullet IS extracted.

  The rule specified here reads NEITHER the English nor the filesystem. It reads the
  record's own structured doc_links: if the record has already declared a path at a
  relationship outside the edit-surface set, the record has said what that file is to
  it, and a prose repetition cannot override that declaration. The input is a
  relationship enum the author chose deliberately, in a structured field, for that
  exact purpose. There is no phrase to match and no intent to infer, which is why a
  future reader must not file this alongside approach (1) — the second and fourth
  scenarios exist so the difference is testable rather than merely asserted.

  WHAT THIS RULE DOES NOT CLAIM. It closes only the case where the record contradicts
  itself. An illustrative path that exists on disk, has an extension, and is named
  NOWHERE in the record's doc_links is still harvested — nothing in the record
  declares it as anything, so there is no declaration to consult. That residual is
  narrower than the one TKT-600a-1 left, and it is stated here rather than left for
  someone to discover.

  THE MOTIVATING FAILURE, measured. GE-123d-3 and GE-123d-4-i each generated
  files_touched = ['docs/known-issues/commit-guardian.md',
  'templates/scripts/commit_guardian/check_secrets.py']. Both records declare that
  register at relationship related, on purpose, because their it_requirements fence
  KI-CG-004 as explicitly out of scope; both also named the path in prose, so the
  harvester took it. A record whose stated requirement is "do not touch this file"
  produced a ticket naming that file as an edit surface. The two records were reworded
  on 2026-09-01 to name the register rather than its path, which drops both surfaces
  to the single real one — but that is a per-record workaround applied by hand, and it
  will not survive the next author who writes the path out. This AC is the durable fix.

  ON PROVING IT. TKT-600a-1 was reopened once as phantom-done because its covering
  test passed identically against unfixed code — the fixture paths did not exist on
  disk, so the pre-existing existence gate removed them and the test never exercised
  the restriction it claimed. Do not repeat that shape here. Every fixture path in the
  second, third and fifth scenarios must EXIST on disk as a file, so the existence
  gate cannot satisfy the assertion by proxy, and the fix must be mutation-proved:
  reverting the suppression must turn the first and fourth scenarios red while leaving
  the second, third and fifth green.
