estimated_complexity: S
it_requirements:
  - "The verdict MUST be computed against the final worktree tree (the post-origin/main-merge state at finalize time), reading the working-copy bytes of each mirrored file as they stand now — never as a diff of per-ticket commits or per-ticket deltas. This whole-branch-final-state comparison is precisely what makes the gate a backstop."
  - "The gate is independent of and additive to any per-ticket template-sync verification: it must reach a block verdict on accumulated divergence even when every individual ticket's own sync check passed. Do not short-circuit the comparison based on per-ticket pass records."
  - "Stateless across runs: the verdict depends only on the current file bytes, with no memory of prior per-ticket outcomes, so re-running after the divergence is repaired passes deterministically."
