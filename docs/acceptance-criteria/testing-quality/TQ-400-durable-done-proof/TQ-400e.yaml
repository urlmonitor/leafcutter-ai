criteria: |
  Only genuinely unproven work is knocked back; genuine exceptions stay settled.

  Work that really is proven is never demoted by mistake, and work that
  legitimately needs no test can be declared as such, with a stated reason, so it
  is not re-flagged every cycle. The check earns the authority to take "done"
  away by being right about who deserves to keep it.
