roadmap_phase: phase_kernel_1_founding
criteria: |
  Every published decision is checked first and reviewed like any change.

  Before a decision becomes part of your project's shared record it is checked for
  completeness and consistency, stopped with a clear reason if anything is wrong,
  and put through the same review and approval as any other change; a decision you
  choose not to publish stays with the work that produced it. A later decision can
  correct an earlier one without rewriting it, so the history of what was decided,
  and why, stays intact.
