id: INF-500d-3-vi
components:
  - infrastructure
  - feedback_collector
title: "epic-supervisor keeps its submission's error stream, so a failure records the script's reason and not a default"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given epic-supervisor's cross-ticket pattern submission, which today sends the
    submission's error stream to /dev/null and falls back to a bare `(submit-failed)`,
  And a run of that submission that prints nothing on standard output, exits non-zero,
    and writes `submit-failed:destination-unwritable:subagent-quality` on its error
    stream,
  When epic-supervisor follows its instruction for that submission,
  Then the run's error stream is written to that run's own file, named as INF-500d-3-ii
    requires from the ticket the submission names, the epic-supervisor phase and the
    cross-ticket-pattern event, and is not discarded,
  And epic-supervisor records `(submit-failed:destination-unwritable:subagent-quality)`,
  And it does not record `(submit-failed:facility-unavailable:subagent-quality)` or a
    bare `(submit-failed)`,
  And no step in epic-supervisor's instructions sends a submission's error stream to
    /dev/null or to any other place it cannot read back.

  Given the same submission fails, whatever the reason,
  When epic-supervisor surfaces the blocked payloads of the affected tickets to the user,
  Then those payloads are identical to the ones it surfaces when the submission
    succeeds.
depends_on:
  - INF-500d-3
  - INF-500d-3-ii
