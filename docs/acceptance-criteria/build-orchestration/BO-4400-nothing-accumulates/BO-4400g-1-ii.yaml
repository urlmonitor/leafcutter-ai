criteria: |
  Given ready workspaces for the features "alpha" and "beta", each holding nothing unsent,
  When clearing is requested naming the kind "feature" and short name "alpha" together
    with the line-of-work name "feature/beta",
  And clearing is requested naming the kind "feature" and short name "alpha" together
    with the location of the "beta" workspace,
  And clearing is requested naming only the kind "feature", with no short name,
  Then each request is refused without clearing anything,
  And the first two refusals name both identities they were given and state that they
    point at different workspaces,
  And the third refusal states that the work was not named completely,
  And "alpha" and "beta" are identical before and after all three requests.
