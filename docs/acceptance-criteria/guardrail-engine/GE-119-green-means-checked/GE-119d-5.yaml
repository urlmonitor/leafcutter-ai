notes: |
  Satisfies the how-to entry in GE-119d's documentation_triggers.

  DELIBERATELY DISTINCT FROM GE-119b-5, which edits the same document. GE-119b-5 REMOVES the
  obsolete manual workaround for the check family; this AC ADDS the set-up guarantee and the
  confirmation command. They are separate ACs because they have different preconditions —
  b-5 waits on GE-119b-4, this waits on GE-119d-2 — and because a single AC covering both
  would let an author satisfy it by doing whichever half was easier.

  The ordering is recorded in depends_on: GE-119b-5 first. Both edits touch the same document
  and the final clause here is what stops the second edit restoring text the first deleted —
  a real hazard when two agents edit one how-to in sequence from separate ACs.

  The confirm-command clause is the substantive addition. A reader who has been told for months
  to link the layout by hand will not stop doing it because a sentence was deleted; they stop
  when they are given something to run that tells them they do not need to.

  IT-PO (2026-08-14): the confirm command already exists —
  templates/scripts/commit_guardian/verify_precommit_active.py with
  docs/how-to/verify-precommit-active.md as its home. Use it rather than inventing a second
  one. The anti-reintroduction clause is backed by the same mechanical absence guard
  GE-119b-5 introduces; run it before sign-off.
