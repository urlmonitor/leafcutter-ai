title: "Report-only mode surfaces results but never fails the run"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100e.yaml
criteria: |
  Given the enforcement mode is configured to report-only and the suite contains
    at least one failing test that would otherwise block (for example a failing
    test covering a done AC),
  When the suite is run,
  Then every test result (including the failures) is surfaced in the run report
  And the overall run outcome is non-failing regardless of those failures
  And report-only never drives the run to a blocking outcome.
