notes: |
  Observed 2026-11-16, run wf_f26bd73c-98c. The claim runner's one shell call passed no time
  limit, reached the 120-second default, and was moved to the background. The runner replied
  without an exit status and ended its turn; the background command's output reads [killed]
  at the moment the runner ended. Whether the claim had changed anything is unknown. The lane
  read the reply as a decline and released nothing.

  Other agents already pass 600 s (test-writer, the coder at its green gate). Run 1's
  producibility agent overran 120 s and improvised a bounded wait on the background output;
  that worked, but only because the agent thought of it. This record makes it the runner's
  rule.

  CONTRACT WIDENING. BO-2400a-1-i (done) fixes two reply shapes. The unfinished reply is a
  third. It must not reuse the decline shape: a decline means nothing ran, an unfinished
  reply means something may have run. BO-2400a-1-i needs a contract-widened-by entry when
  this record is approved (the BO-4500a-5-viii precedent).

  Not in scope: raising the shell's default limit globally. It changes every agent, hides
  real hangs, and does not ship to consumer installs (2026-11-16 analysis).
