notes: |
  ONE L3 PER INSTANCE (i research-agent, ii retrospective-agent, iii the shared
  guide), so each fix is verifiable on its own and the composite cannot be marked
  done with one of them outstanding.

  ORDERING. This AC's real-tree run and the wiring in AR-400a-1 must land in the
  same change: wiring first breaks the build on these instances; fixing first
  leaves nothing guarding them. The design sequences both into PR-2.
