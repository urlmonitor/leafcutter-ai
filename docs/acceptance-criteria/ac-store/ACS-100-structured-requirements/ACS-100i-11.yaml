assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment:
    assigned_agent_repair:
      type: object
      description: "The repair's own per-record contract: {file_path: str, current_value: str (verbatim, including any literal quote characters), corrected_value: str (an id present in config/agent_registry.json), basis: str (the surface this record changes, which is why this producer was chosen)}. A record for which no producer can be inferred is emitted to a review report with corrected_value null and is NOT written."
  reference_file_path: "docs/acceptance-criteria"
  n_location_rule: "all"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/ac_store/validate_ac_schema.py docs/acceptance-criteria"
    - "python scripts/build.py --target-dir ."
  constraints:
    - "ORDER WITHIN THE CHANGE IS LOAD-BEARING AND MUST BE MECHANICAL, NOT A COMMENT. The 40 corrections are written and committed FIRST; the rule (ACS-100i-9) and its deploy_map entry land SECOND, in the same change. At the moment the rule becomes live, `python scripts/ac_store/validate_ac_schema.py docs/acceptance-criteria` must exit 0 with a non-zero examined count. If the rule lands first, that sweep is red from its first run on 40 records the runner did not author — and a permanently-red hygiene tool gets skipped, then removed, then documented as known noise. That is the recorded history of KI-ACS-001 and the reason the ACS-200h whole-store gate is still unimplemented."
    - "THE CORRECTION SET IS THE RULE'S OWN VERDICT, NOT A HAND-COPIED LIST. Run the new shared helper over the store, take the set of records it refuses, and correct exactly those. A hand-maintained list drifts between authoring and implementation and cannot be re-derived at review time."
    - "TWO DEFECTS, TWO DIFFERENT EDITS — AND THE BLAST-RADIUS CHECK MUST KNOW WHICH. Verified 2026-08-25: the 24 membership failures are genuinely wrong PARSED values (23 finalize-feature-workflow, 1 create-ticket) and correcting them changes the parsed value. The 16 'quoted' records are ordinary YAML double-quoting in the SOURCE, which PyYAML already parses to the correct name, so unquoting them changes NO parsed value. A blast-radius test comparing parsed values before and after therefore sees 24 changes, not 40. Compare RAW SOURCE LINES for the 16 and PARSED VALUES for the 24, or the test reads as a failure when the repair is correct."
    - "NEVER CORRECT BY DELETING THE FIELD OR SETTING IT NULL. That moves a known-bad value into the roughly 748-record no-producer population ACS-100i-10 exists to measure, laundering a defect into an unremarkable silence and corrupting that criterion's baseline in the same change that establishes it."
    - "CHOOSE PER RECORD, NOT PER GROUP. Each corrected value is a registered agent id matching the surface THAT record changes. The 23 finalize-feature-workflow records describe work on templates/workflows-js/finalize-feature.js, and workflow-architect is a registered agent covering that surface — but confirm against each record's own criteria rather than applying one value to all 23, since some may describe a Python or documentation surface instead. create-ticket is a retired slash command (ADR-012), not an agent, so that record likewise takes the agent for the surface it actually changes."
    - "DO NOT MAKE THE SWEEP GREEN BY WIDENING THE VOCABULARY. Adding finalize-feature-workflow (or create-ticket) to config/agent_registry.json would turn the sweep green without correcting a single record, and would put a workflow script into the vocabulary the fast lane's roster will later be drawn from. The criterion's 'no record is exempted' clause covers this in spirit; it is written out because it is the cheapest wrong answer available under time pressure."
    - "UNINFERABLE VALUES GO TO A REVIEW REPORT, NEVER TO A GUESS. A record whose surface cannot be determined from its own criteria is listed for human decision and left uncorrected; it is not defaulted to python-coder, which would silently make it a code ticket by omission."
    - "IDEMPOTENT AND SURGICAL. The repair must be re-runnable: a second run makes no edit and every file is byte-identical (verify by running twice and diffing). Insert or replace ONLY the assigned_agent line in each record — never rewrite a file through a YAML round-trip, which reflows every other field, destroys the blast-radius evidence, and can silently mangle the block scalars in notes and test_rationale."
    - "PROVE THE RULE STILL BITES AFTER THE REPAIR. A store-wide green with no negative control cannot tell a repaired store from a disabled rule. In the same test run, inject one record with an unregistered producer into a COPY of the corrected store and assert the pass refuses exactly that one record, by file path."
    - "RE-MEASURE THE 40 AT THE IMPLEMENTING COMMIT. Verified at enrichment time: 24 membership failures (23 + 1) among 3,385 records, and 16 quote-wrapped source lines (10 python-coder, 5 test-failure-triage, 1 documentation-expert). Both drift as other work lands; a test hard-coding 40 without re-measuring fails for the wrong reason and then gets deleted."
delivers_to:
  agent: python-coder
  contract: "A store in which the ACS-100i-9 rule refuses zero records — the precondition for enabling that rule without turning the prescribed store-wide sweep red. Delivered as corrected assigned_agent lines on exactly the refused set, plus a review report for any record whose producer could not be inferred. Applied BEFORE the rule within the same change; the rule's own commit depends on this state existing."
expects_from:
  ac_id: ACS-100i-9
  contract: "The rule whose refusal set defines exactly which records this correction must touch. The correction is scoped by the rule's own verdict, not by a hand-copied list."
origin_agent: BrainCandy
created: 2026-08-25
amended_by:
  - "2026-08-25 [claude]: corrected the record count from 40 to 24, same day, before any implementation. The 40 double-counted: 24 records genuinely name a non-agent (23 `finalize-feature-workflow`, 1 `create-ticket`), while the other 16 merely write a valid agent name with surrounding quotes — `assigned_agent: \"python-coder\"` is ordinary YAML double-quoting and parses to exactly `python-coder`. Verified against FIN-100c-5/-6/-9 and confirmed independently by the IT PO. Left uncorrected, this criterion would have sent a repair task at 16 records that are not broken, and the rewrite would have been a cosmetic edit presented as a correction. The parse-path inconsistency those 16 DO expose is real but belongs to ACS-100i-9-i, which was amended in the same pass to cover it; it is not repaired by rewriting the records. The blast-radius assertion is correspondingly 24, not 40."
