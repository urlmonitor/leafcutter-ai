notes: |
  User-authored intent: BrainCandy. Framed by product-owner-v3, 2026-09-09.

  SILENCE IS THE FAILURE MODE THIS WHOLE TREE IS EXPOSED TO, AND THIS IS THE
  ONLY RECORD THAT CLOSES IT. Today a specialist that was told nothing and a
  specialist for which no standard exists produce identical evidence: nothing.
  Every other criterion in this tree can therefore be reported satisfied by
  something that covers one pairing and stops — which is precisely the state
  the store is in now, and it has looked fine for as long as it has existed.

  INHERITED AND NOT REPEALED. This project's standing rule that a check which
  could not do its job must say so, rather than reporting success, applies here
  in its natural form: a delivery that reached nobody must not be
  indistinguishable from a project with no standards. That rule was written
  about checks; this is its equivalent on the telling side, and it is being
  applied, not re-litigated.

  A DECISION THIS RECORD DELIBERATELY LEAVES OPEN. Whether an uninformed
  specialist should merely be REPORTED or should actually STOP something is not
  settled here, and there is no blanket default in this project for that
  question. Decide it explicitly at enrichment, per surface, and record the
  reasoning. What is not open is visibility: the condition must be nameable.

  THE ACCEPTANCE SHAPE WITH TEETH, AND THE NEGATIVE ARM THAT IS MANDATORY.
  Every positive arm of this criterion is satisfied by something that reports
  every specialist as a gap all the time. The mandatory negative arm is that a
  specialist which HAS been told the standards for what it owns does not appear
  in the report. Without it, this L1 is discharged by a mechanism that says
  "everyone" and means nothing.

  A CAUTION FROM THIS STORE'S OWN HISTORY. Several checks in this project have
  reported clean for weeks while examining nothing at all, and each time the
  clean result was believed. Whatever produces this report needs a positive
  control — a known-uninformed pairing it demonstrably finds — before a clean
  result from it is worth anything. Three such pairings exist on disk today.
