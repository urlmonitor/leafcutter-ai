id: BO-1500b-3
components:
  - build_orchestration
readiness: approved
priority: high
title: Partial-run recovery pre-flight still detects stranded AC files on the isolated branch
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: in_progress
created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500b.yaml
criteria: |
  Given a prior authoring run left uncommitted AC YAML files in the authoring
    worktree (the partial-run condition the existing create-ac pre-flight checks for),
  When a new authoring run starts its mandatory partial-run recovery pre-flight,
  Then the pre-flight inspects the authoring worktree (not the user's original
    checkout) for the stranded AC files,
  And it detects and resolves them using the same recovery behavior it applied
    before isolation existed,
  And the pre-flight reports no false orphans caused by AC files that are already
    committed on the authoring branch.
depends_on:
- BO-1500b
- BO-1500a-1
doc_links:
- path: templates/skills/create-ac/SKILL.md
  relationship: modifies
  status: exists
- path: scripts/workflows/plan-feature.js
  relationship: modifies
  status: exists
- path: scripts/ac_store/scan_ac_orphans.py
  relationship: references
  status: exists
assigned_agent: llm-expert
estimated_complexity: M
it_requirements:
- The Partial-Run Recovery pre-flight (the §PRR section of create-ac/SKILL.md prose) must scope its orphan
  scan to the authoring worktree path, not the user's original checkout. Committed-on-branch files are
  not orphans; only uncommitted working-tree files are recovery candidates (no false orphans).
- This behavior must be implemented in BOTH surfaces -- /create-ac (templates/skills/create-ac/SKILL.md
  prose) and /plan-feature (scripts/workflows/plan-feature.js) -- preferably via a shared worktree/PR
  helper reused from build-single-ticket (scripts/setup_ticket_worktree.py) and the pull-request machinery;
  keep the two surfaces in sync. The create-ac prose edits are an llm-expert follow-on within the same
  ticket.
- Any git invocation specified in the prose must follow the project Error Handling Policy (wrap git status/restore
  I/O; warn rather than silently swallow), matching the existing §PRR error-handling table.
test_spec:
- name: test_orphan_scan_is_scoped_to_the_authoring_worktree_not_the_original_checkout
  target_dir: unit_tests/ac_store/
  framework: unittest
  type: integration
  description: With stranded draft AC YAML present in BOTH the original checkout and the authoring worktree,
    the worktree-scoped scan returns only the authoring-worktree paths.
- name: test_uncommitted_stranded_ac_drafts_in_the_authoring_worktree_are_detected
  target_dir: unit_tests/ac_store/
  framework: unittest
  type: integration
  description: A draft AC YAML left uncommitted in the authoring worktree's AC store is reported as a recovery
    candidate, matching the pre-isolation recovery behaviour.
- name: test_ac_files_committed_on_the_authoring_branch_are_not_reported_as_orphans
  target_dir: unit_tests/ac_store/
  framework: unittest
  type: integration
  description: AC YAML already committed on the authoring branch produces an empty orphan set — the no-false-orphans
    guarantee.
- name: test_preflight_git_status_is_anchored_to_the_authoring_worktree
  target_dir: unit_tests/workflows/
  framework: unittest
  type: behavioral
  description: With a recording git shim on PATH, the pre-flight's status invocation carries a `-C <authoring-worktree>`
    anchor and the AC-store pathspec, so the scan cannot read the user's original checkout.
delivers_to: null
expects_from:
