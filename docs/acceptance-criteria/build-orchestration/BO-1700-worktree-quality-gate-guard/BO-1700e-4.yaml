it_requirements: |
  Shared-git-dir resolution (BO-1700e-2) must handle the case where git-common-dir
  equals .git (plain clone) as well as the linked-worktree case, WITHOUT treating
  the equality as an anomaly (no false chain-broken verdict). A genuinely broken
  chain still fails uniformly. Implemented over the shared resolver (BO-1700e-2) and
  the probe (BO-1700a-1); ADR-001 deployed/template parity applies.
