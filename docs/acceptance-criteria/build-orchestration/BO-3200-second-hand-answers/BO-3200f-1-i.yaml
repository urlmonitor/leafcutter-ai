notes: |
  COMPOSES, DOES NOT RESTATE. The three-answer vocabulary and "could not tell stops the work"
  are BO-3200e-1 and BO-3200e-2. "A refusal is reported as a refusal and not as a damaged file"
  is BO-3200g. This record is the one dispatch site those rules must now hold at: the chartered
  executor becomes the transport for every read, so its failure modes are the failure modes of
  every check that reads through it.

  WHY AN L3 AND NOT AN L2. It is the "what could go wrong" of BO-3200f-1 -- a consumer of the
  executor's result -- and BO-3200f is at its five-L2 cap with the two documentation children
  its triggers require.

  WHY THE FOURTH SCENARIO. A command that ran and exited non-zero IS a real result, and the
  outcome is still could-not-tell (the registry could not be read, per BO-3200e-1). What must
  differ is the reason, because the remedy differs: fix the path, versus restore the dispatch.
  Collapsing the four reasons into one message is exactly the KI-ACD-009 defect of four causes
  printing one permissions message.

  WHY "DECLINES" IS STILL A CASE when BO-3200f-2 says the charter admits every exact command.
  A charter is a prompt, and KI-BO-20260901-1620 records that the agent that refused did so by
  judgement, not mechanism. The consumer must not trust BO-3200f-2 to make this path
  unreachable.

  IT-PO ENRICHMENT (2026-09-16). A GUARDRAIL BLOCK IS A FIFTH REASON, added as an it_requirement
  and a test rather than as criteria (criteria are the BA's). With the executor admitting every
  exact command, the most likely non-transport stop is a PreToolUse guardrail or a permission
  rule, and BO-3200g requires a refusal to be reported as a refusal BY WHOM. The BA may want to
  promote it to a fifth scenario on the next pass; nothing here depends on that.

  ORDER OF LANDING. This mapping is consumed by ACD-2100b-5, whose depends_on does not name this
  record (KI-ACD-015: expects_from alone orders nothing). Recommended BA edit: add BO-3200f-1-i
  to ACD-2100b-5's depends_on.
