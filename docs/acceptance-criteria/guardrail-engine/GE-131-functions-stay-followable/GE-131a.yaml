id: GE-131a
title: "The complexity check runs on every commit: an already-complex function can be worked on but never made worse, and no new one arrives over the limit"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Existing tangles never block your work; new or worse ones are refused, every time.

  A function already over the complexity limit may still be fixed, edited and
  improved, and a commit that leaves it no more complex than it was goes through. A
  change that makes it more complex than before is refused. A function that is new,
  or that crosses the limit for the first time, is held to the limit itself. The
  check runs on every ordinary commit with nothing extra to invoke. Being stopped
  tells you which function, its score, what it was allowed, why, and which skill
  helps. Every place that describes the check describes the rule it applies.
