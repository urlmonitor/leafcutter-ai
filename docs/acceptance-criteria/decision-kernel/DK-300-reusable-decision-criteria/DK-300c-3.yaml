criteria: |
  Given the published cat-40cc613f737e3323 with the member (dec-acdfd972fcaca478, crit.person_authorises) and the published cat-d15d52392d7aa94c with the member (dec-d53e1c52cd47c832, crit.human_authority), both asking whether only a person's approval authorises a record,
  When human:user merges cat-40cc613f737e3323 into cat-d15d52392d7aa94c in a kernel run and publishes the change,
  Then cat-40cc613f737e3323 is retired, with replaced_by [cat-d15d52392d7aa94c], no members, and a retirement entry naming human:user, the time and the reason,
  And cat-d15d52392d7aa94c keeps its id, gains the member (dec-acdfd972fcaca478, crit.person_authorises) and gains the retired category's preferred wording as one of its other wordings,
  And cat-40cc613f737e3323 stays resolvable by its id,
  And no published decision record changes.
