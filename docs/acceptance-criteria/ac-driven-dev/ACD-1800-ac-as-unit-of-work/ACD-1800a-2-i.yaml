notes: |
  Edge case of ACD-1800a-2: the checklist-vs-change-surface validation must catch
  MORE than the code-omits-tests case -- a behaviour change that omits docs or a
  diagram is equally incomplete. Excluding a kind must be explicit (ties to the
  not-applicable rule in ACD-1800b-2-i).

