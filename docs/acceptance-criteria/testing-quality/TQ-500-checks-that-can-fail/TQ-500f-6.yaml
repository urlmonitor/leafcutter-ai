title: "A how-to: write a test that catches the plausible wrong version"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a developer or requirement author who has to guard a bug fix or a
    change to a gate — for example the refresh gate that changed from
    "if refresh_due" to "if refresh_due and retry_due" —
  When they follow the how-to from start to finish,
  Then it takes them through naming the wrong versions first (at least "revert
      the fix" and one "drop condition X" per condition of the gate) and
      recording them as must_catch on the requirement's test entry,
    And through answering the three questions for the test, with the worked
      answers for the refresh-gate example, including the fixture that set
      refresh_due but never retry_due, so the branch ran 0 times,
    And through the vacuity checklist item by item, showing the weak version
      and the strengthened version of the test side by side for each item,
    And it shows that a red caused only by a missing import counts as proof
      that the code is absent, not as proof that the test guards existing code,
      and what an assertion-shaped red looks like instead,
    And it ends by pointing the reader to the reference taxonomy (TQ-500f-5)
      for the full catalogue, instead of repeating the catalogue.
