id: ACD-1300d-2-i
title: Unavailable desktop notifications do not lose the attention item
component: ac-driven-dev
components:
- ac_driven_dev
level: L3
status: active
req_status: approved
readiness: approved
work_status: in_progress
priority: medium
criteria: |
  Given desktop notifications are unavailable when a feature needs attention
  When the worker reports that outcome
  Then the CLI inbox still contains the outcome and its evidence
  And status reports notification failure separately from implementation or publication state
  And the worker neither loses the request nor claims that a desktop notification was delivered
