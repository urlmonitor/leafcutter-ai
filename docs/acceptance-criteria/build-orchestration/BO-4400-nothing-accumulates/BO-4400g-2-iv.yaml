criteria: |
  Given a project with three landed workspaces "ff-1", "ff-2" and "ff-3", each holding
    nothing unsent, and one workspace "open-1" not yet on the main line,
  When two landed-work passes are started at the same moment, as an hourly timer and a
    session start would,
  Then afterwards no folder of "ff-1", "ff-2" or "ff-3" remains and "open-1" is identical
    before and after,
  And between the two answers each of "ff-1", "ff-2" and "ff-3" is reported cleared by
    exactly one pass,
  And the other pass reports each of them as already gone or not listed, never as a
    failure,
  And both passes end with exactly one answer each, and neither asks a question.
depends_on: [BO-4400g-2, BO-4400g-1-i]
