id: AR-400d
title: "Your project can supply abilities of its own to the package's specialists"
component: agent-registry
components:
  - agent_registry
  - skills_system
  - build_pipeline
level: L1
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Grant a specialist an ability your project provides, not the package.

  A specialist's definition can say that one of its abilities comes from the
  project it is installed into. Where the project has it, the specialist gets
  it; where it does not, the build tells you so and carries on, rather than
  refusing to install. Package-specific content that belonged to another
  project is removed instead of being dressed up this way.
