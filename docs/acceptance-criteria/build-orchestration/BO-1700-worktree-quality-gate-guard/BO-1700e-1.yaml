criteria: |
  Given a fresh consumer install runs the build step,
  When the build completes,
  Then all three guard scripts -- the verification probe, the canary hook, and the
    self-healing hook -- are present at their deployed target paths under
    `scripts/commit_guardian/`, each copied from its `templates/scripts/commit_guardian/`
    source,
  And a fresh install has all three scripts available with no manual copy step.
