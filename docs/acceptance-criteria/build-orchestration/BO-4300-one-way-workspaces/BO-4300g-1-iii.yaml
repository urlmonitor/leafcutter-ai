notes: |
  Two separate guards, and neither one widens the other. Caller authorization answers "may this
  agent remove at all". The Q8 discard token (BO-4300e-3) answers "may work that never reached the
  shared project be lost". An agent that holds the first must not acquire the token by asking again
  and then use it in the same request.

