it_requirements:
  - "Edit the canonical source at templates/skills/security-scanner/SKILL.md and let build.py propagate it (ADR-001). Editing a deployed copy under .claude/, .gemini/, .leafcutter/, EPIC-*/ or worktrees/** leaves the shipped reference unchanged, which is the failure this AC is least able to detect from its own output."
  - "The addition belongs in the detection-rules section, beside the sentence that introduces the rules as applied in order — that sentence is the one this change invalidates. Do not open a second section about the name rule; a second home for the same statement drifts from the first."
  - "State the additive relationship in terms of RESULTS, not of control flow. The reader is an author deciding what to write in a suppression, not someone reading the scanner; 'the name result and the content results are both reported' is the useful form, and an internal description of where the scan returns is not."
  - "The reference must also make the consequence explicit for the suppression section it interacts with: quieting the name-based result leaves the content-based results reported. Cross-reference the existing allowlist section rather than restating the suppression grammar there — GE-123c-5 owns that grammar and two copies drift."
  - "PARITY, BOTH DIRECTIONS, and it is a review obligation rather than an automated one: check every statement added here against the shipped scanner's behaviour at the time of writing, not against this AC's prose and not against the sibling ACs. Where the reference and the implementation disagree, THE IMPLEMENTATION IS AUTHORITATIVE — raise the disagreement as a defect against the code AC that owns it and do not document the intended behaviour as though it were the actual one."
  - "SEQUENCING: this text describes behaviour that GE-123a-1 introduces. Written before that behaviour lands, it documents an intention. Write it against the shipped result, or mark it explicitly as pending and re-check it once GE-123a-1 is done."
  - "Examples must not contain credential-shaped literals. This file is scanned on every commit, so a realistic-looking example would either trip the check or need a suppression of its own — describe the shapes in words, as the neighbouring documentation ACs in this tree do."
  - "Documentation check for this AC, in place of an automated test: (1) the detection-rules section states that a name match records a result and the content rules still run, and that the name rule does not end the scan; (2) it states that an environment-named file yields the name result plus any content results, that they are separate, that quieting the name result leaves the content results reported, and that a name-matched file with innocuous contents is still reported for its name; (3) PARITY, BOTH DIRECTIONS — nothing claimed that the check lacks, nothing omitted that the check has, verified against the shipped scanner with the implementation authoritative on disagreement."
  - "Verification is by review against the shipped behaviour. Do not author code tests for this AC, and do not add test descriptors to it."
test_required: false
test_rationale: |
  This AC changes prose only, so it carries no executable behaviour and
  test_required is false rather than test_spec being left empty. What is asserted
  in place of a test is the three-part documentation check recorded in
  it_requirements, whose third part is a two-directional parity review against the
  shipped scanner: a reference that claims the contents of a name-matched file are
  examined when they are not reproduces exactly the false confidence this feature
  exists to remove, and one that omits the additive behaviour after it lands sends
  an author hunting for a protection they already have. Mechanising that parity
  would require reading the scanner's declared rule inventory and its per-file
  behaviour and comparing them against the document, which is a code AC of its own
  and is out of scope here; it is raised as a recommended follow-up rather than
  smuggled into a documentation AC.
