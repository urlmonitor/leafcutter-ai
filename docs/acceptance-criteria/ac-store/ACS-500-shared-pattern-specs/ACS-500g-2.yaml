title: "An authoring-patterns skill states the pattern-worthiness rules as decidable tests"
component: ac-store
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given a candidate behavior that recurs across ACs,
  When an author consults the authoring-patterns skill to decide whether it becomes
    a pattern,
  Then the skill returns a promote / do-not-promote decision derived from four
    stated rules, and each rule is decidable without further judgement calls:
    1. Recurrence — the behavior must appear in at least a stated NUMBER of distinct
       ACs (the skill states the number, e.g. 3; it does not say "several" or
       "often"),
    2. Slot-expressible variance — every difference between the occurrences must be
       a substituted VALUE; when an occurrence needs a Given, When or Then step the
       others do not have, the variance is not slot-expressible and the behavior is
       not promoted,
    3. Genuine shared behavior — occurrences that share nouns but assert different
       outcomes (both mention "a table", one asserts sorting, the other asserts a
       printed total) are classified as incidental similarity and rejected,
    4. Slot naming and scope — one slot per independently varying value, each slot
       named for the value it carries (filter_field, export_format), and no slot
       carrying two values that can vary apart from each other,
  And a do-not-promote decision names which of the four rules failed,
  And the skill states how to write the parameterised criteria body: one
    Given/When/Then scenario in which every declared slot appears as a named
    placeholder and every value that does not vary is written literally.
