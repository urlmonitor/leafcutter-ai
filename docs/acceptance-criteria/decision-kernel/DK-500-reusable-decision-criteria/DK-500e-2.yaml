notes: |
  Flow: decision-forming branch draft-for-gap and the edited propose step ("It drafts no new criteria unless Jev found a gap or no category fits"). The drafting itself is done by the host (Claude Code, generate_options); the kernel bounds what it asks for and checks what comes back. The IT PO may split a prompt part to llm-expert.
  Feedback loop (DK-500e): drafted and person-added criteria that end in a PUBLISHED decision become published-record input to the mining (DK-500a-1); draft-only wordings are seen through run history only.
