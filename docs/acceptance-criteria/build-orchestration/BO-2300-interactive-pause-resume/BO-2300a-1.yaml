notes: |
  Engineering shape (kept out of criteria prose): the E2 workflow engine
  (templates/workflows-js/*.js, run by the Workflow tool) today cannot prompt
  the user mid-run when headless/background, so at an interactive gate its
  parse-failure catch resolves to a safe default and cancels. This behavior
  requires that the gate PAUSE and persist a pending-question record keyed to
  the run id, via an agent() dispatch (the E2 body has no fs access), resumable
  via the harness resumeFromRunId replay -- rather than terminating the run.
