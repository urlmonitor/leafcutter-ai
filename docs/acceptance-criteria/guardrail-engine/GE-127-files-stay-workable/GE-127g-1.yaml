id: GE-127g-1
title: "Which documents are set aside is a declared class of locations, so a newly generated document of that kind joins it without anyone editing a list"
component: guardrail-engine
components:
  - commit_guardian
  - doc_compliance
  - agent_registry
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the set of documents the size standard does not judge is declared as a
    set of locations rather than as a set of individual filenames, and every
    entry in it carries a stated reason it is not judged,
  And the directory the agent-card generator writes its output into is one such
    declared location, on the stated ground that its contents are regenerated
    whole and have no human author,
  And that directory holds 65 generated documents, of which 3 stand above the
    300-line limit — the longest at 2,809 lines — and the next 3 stand at 276,
    235 and 207,
  When the author stages the whole of that directory exactly as a regeneration
    leaves it, and performs an ordinary commit,
  Then the commit completes.

  And given that a new agent is added to the project and the generator is run,
    so that directory now holds a 66th generated document standing at 420
    lines, which has never appeared in any declared entry by name,
  When the author stages that document together with the rest of the directory
    and performs an ordinary commit,
  Then the commit completes, and it completes without any change having been
    made to the declaration — so adding a generated document of an
    already-declared kind is not an occasion to edit anything.

  And given instead that the declaration is emptied of its entry for that
    directory,
  When the author stages the same regenerated directory and performs an ordinary
    commit,
  Then the commit does not complete, and the documents it names as over the
    limit are the three that stand above it — so the commit completing in the
    arms above is the declaration taking effect, and not the gate failing to
    look.
depends_on:
  - GE-127g
