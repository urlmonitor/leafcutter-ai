title: "Auto-commit the green batch and open a pull request"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the lean two-agent loop has taken the connected set to green (all batch tests
    pass and every AC has a passing covers test),
  When the run finishes,
  Then the changes are committed on the worktree's branch and a pull request is opened
    against main,
  And the pull request is landable: everything the repository's required merge checks
    demand of the change is present in it — including a changelog entry when, and only
    when, the change requires one — so nothing stands between the reported pull request
    and a merge except review,
  And the operator does not run commit, write a changelog entry, or open the PR by hand,
  And the PR is opened non-interactively under the correct account, with the EMU REST
    fallback used when gh pr create is blocked.

  Given the green+coverage gate does NOT pass,
  When the run finishes,
  Then no PR is opened and the failing AC ids are reported (the gate is the arbiter).
