title: "Unrecognised problem kinds stay distinct in an unclassified namespace and are queued for promotion"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given three findings emitted by the pull-request review gate whose rule identifiers are
    absent or are not present in that gate's declared vocabulary — two whose detail prose
    normalises to the same key, and one whose detail prose normalises to a different key,
  When the findings are recorded,
  Then each is assigned a rule identifier inside that gate's unclassified namespace,
    written as the word "unclassified", then the emitting gate name, then the normalised
    prose key, and each is recorded rather than dropped,
  And the two findings sharing a normalised prose key receive one identical rule identifier
    while the third receives a different one, so distinct unknown problem kinds remain
    distinct rather than collapsing into a single identifier per gate,
  And each takes part in signature computation and occurrence counting on the same terms as
    a declared rule identifier, with its signature method recorded as "unclassified",
  And each distinct unclassified rule identifier is listed, with its own occurrence count,
    in that gate's promotion queue as a proposed new entry in its declared vocabulary.

  Given a failure that produced no gate finding at all and therefore carries no prose to
    normalise — for example a coder phase whose tests stayed red,
  When its rule identifier is written,
  Then it is written as the word "unclassified" followed by the name of the emitting gate,
    or by the name of the failing phase agent where no gate emitted it, with no third
    segment,
  And that two-segment form and the three-segment form are both valid members of the same
    unclassified namespace,
  And the bare, gate-agnostic word "unclassified" is never written as a rule identifier,
    because it would merge every gate's unknowns into one bucket and leave the per-gate
    promotion queue with nothing to queue.

  Given an unclassified rule identifier in a promotion queue that has already accumulated
    an occurrence count, and an owned gate that adds a corresponding entry to its declared
    vocabulary,
  When the entry is promoted,
  Then the finding's rule identifier changes to the newly declared one and its signature
    changes with it, since the signature is derived from the gate and the rule identifier,
  And a recorded mapping from the retired unclassified identifier to the promoted declared
    one is written, so an aggregate reports the occurrences counted before and after
    promotion as one total against the promoted identifier rather than as two unrelated
    problems,
  And the signature method on records created after promotion is "declared", while records
    created before it retain "unclassified" and remain reachable through the mapping,
  And no occurrence counted before the promotion is discarded or double-counted.

  Given the pull-request review gate, which is permanently exempt from declaring a
    vocabulary because the skill its findings come from cannot be modified by this project,
  When its unclassified identifiers are queued,
  Then the queue records that this gate cannot accept a promotion, naming the reason,
  And its identifiers remain permanently in the unclassified namespace and continue to be
    counted at full weight rather than being discounted or expired from the queue.
