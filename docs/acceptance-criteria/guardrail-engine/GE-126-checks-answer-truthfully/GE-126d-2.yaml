id: GE-126d-2
title: "Recording a deliberate exclusion silences the report for that check and no other"
component: guardrail-engine
components:
  - commit_guardian
  - skills_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given two fixture checks both registered on every documented leg and both absent from the
    roster the autofix loop reads and one of them carrying a recorded deliberate exclusion
    that states who decided and why,
  When the registration parity check runs,
  Then it names the fixture check with no recorded exclusion and does not name the one that
    carries it,
  And removing the recorded exclusion and running again on an otherwise identical tree
    causes that check to be named so the silence was caused by the record rather than by
    the check being overlooked,
  And a recorded exclusion that names a check absent from the manifest does not silence
    anything and is itself named,
  And an exclusion record does not add its check to the roster so a check excluded from the
    autofix loop stays excluded from it,
  And the check that carries a recorded exclusion still blocks a commit that violates its
    rule so recording an exclusion has changed what the autofix loop attempts and nothing
    about what the check enforces.

  Coverage note: covered by running the parity check over a fixture registration set in
  each of the four states and asserting which checks are named in each. The last clause is
  covered by a separate out-of-process run of the excluded fixture check against input that
  genuinely violates its rule, asserting it still blocks.
depends_on:
