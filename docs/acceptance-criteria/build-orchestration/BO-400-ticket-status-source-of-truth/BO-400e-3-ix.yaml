estimated_complexity: S
it_requirements:
  - >-
    THE RECORD IS A GIT CONFIG KEY, NOT A FILE. setup-ticket writes branch.<branch>.leafcutterTicket
    to the clone's SHARED config, not to a per-worktree config, even when extensions.worktreeConfig
    is on, so that every worktree of the clone and finalize can read it. The value is the ticket's
    repo-relative POSIX path at setup time. The reasons are recorded in BO-400e-3-ii's
    it_requirements (decision 1). In short: it survives the lossy slug and --branch, it never makes
    the branch "change" its own ticket, and git branch -d/-D/-m delete or move it along with the
    branch. A worktree marker file and a field written onto the ticket are both rejected, for the
    same reasons.
  - >-
    It is written whenever setup-ticket returns success, both on creating a new worktree and on
    reusing an existing one for the same ticket. Writing is idempotent: one value, the same value.
    When the branch already records a DIFFERENT ticket, setup-ticket does not overwrite it, does not
    reuse the worktree, prints a message naming the branch and the ticket it is already built for,
    and exits non-zero. The JSON success payload is unchanged apart from any additive field.
    build-single-ticket keeps reading ticket_path_final.
  - "create-only, create-fastlane-worktree and create-ac-worktree write no record. The derivation module's documented outcome for a non-EPIC branch with no record is BO-400e-3-ii's evaluation order."
  - >-
    The key name and value format are one contract shared by the writer (setup_ticket_worktree.py)
    and the reader (scripts/build_orchestration/finalize_closable_set.py). The seam is proven by a
    test that runs the real setup command and then the real derive command against the same
    scratch clone. Matching constants in two files do not prove it.
  - >-
    Change templates/scripts/setup_ticket_worktree.py (the build source) and mirror the same hunk into
    scripts/setup_ticket_worktree.py. Both files are over the file-size limit, so the addition must
    be small. Error handling per the project policy: a git config subprocess failure is caught as a
    specific exception, reported on stderr, and fails setup-ticket. A branch whose record could not
    be written would silently fall into "cannot identify" at finalize time.
delivers_to:
  agent: python-coder
  contract: >-
    git config branch.<branch>.leafcutterTicket = <repo-relative POSIX path of the ticket .md> in the
    clone's shared config, set by setup-ticket. Absent for create-only, create-fastlane-worktree,
    create-ac-worktree and any branch set up before this change. Read by
    finalize_closable_set.py derive (BO-400e-3-ii) via `git -C <worktree> config --get`.
