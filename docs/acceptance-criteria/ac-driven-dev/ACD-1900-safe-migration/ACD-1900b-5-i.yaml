estimated_complexity: L
delivers_to:
  - agent: llm-expert
    contract: "An importable, side-effect-free coverage-resolution API in the new AC-store resolver module, taking a ticket path and returning a resolved-AC list plus the keys it found in the traceability block -- shape: {resolved_acs: [{ac_id: str, ac_yaml_path: str, resolved_via: 'traceability_block' | 'source_ac'}], block_keys_found: [str], block_interpretable: bool}. Step 1 of the gate template must call this instead of extracting l2/l3/ac_path itself, and Step 5's ok condition must require len(resolved_acs) >= 1 rather than 'every AC in the working list passed'. The prose edit plus a package rebuild into the deployed agents tree is what makes the running gate honour it."
  - agent: test-writer
    contract: "The same API, plus a verified-AC count on the emitted verdict (int, the number of ACs actually loaded and checked), so a test can assert the COUNT -- 1 for a two-key generated ticket, 0 for an uninterpretable block, N for an N-entry list-form block -- rather than only the verdict string. Without the count exposed on the verdict the discriminating assertion of this AC cannot be written."
expects_from:
  - ac_id: ACD-1900b-5
    contract: "The restructured Step 1 coverage-resolution control flow of the gate template (dual-read: ac_traceability OR source_ac) into which this AC's shape-tolerance is inserted. This AC extends that same Step 1; it must not add a second, parallel resolution path. If ACD-1900b-5 has not landed when this is built, this AC authors the Step 1 seam and ACD-1900b-5 builds on it rather than replacing it."
  - ac_id: ACD-1900b-1
    contract: "The shared store-first spec resolver (source_ac -> store AC record). When it exists, the coverage resolver here reuses its AC-id -> store-file lookup instead of duplicating it. NOT a blocking prerequisite: ACD-1900b-1 is phase_acbuild_1_foundation while this defect is live in phase_1, so this AC may land first and become that resolver's seed."
it_requirements:
  - "THE LOAD-BEARING CONSTRAINT, stated once rather than per-criterion: coverage resolution must return an explicit resolved-AC list whose length is observable to its caller, and the ok verdict must be conditional on that length being >= 1. An empty resolved list must never satisfy the ok condition. Today's rule -- ok when 'every AC in the working list is passed or skipped' -- is vacuously true over an empty list, and that vacuity, not the key names, is the defect."
  - "TWO ENFORCEMENT POINTS, BOTH MANDATORY, ONLY ONE LOAD-BEARING AT RUNTIME: (a) the executable resolver module declared in doc_links, which the tests call, and (b) the agent-template prose in templates/agents/ac-fulfillment-gate.md, Steps 1 and 5, which is what the running gate actually reads. (b) is the point that gates commits; (a) is the point that makes the behaviour provable. Changing only (a) leaves the live gate vacuous; changing only (b) leaves the AC unprovable and unenforceable. Neither alone satisfies this AC."
  - "DEPLOYED-COPY ACCEPTANCE: a templates-only edit does not satisfy this AC. Acceptance requires that after the package build deploys templates into the workspace root, the DEPLOYED copy of the gate template under the .claude/agents/ tree carries the dual-shape Step 1 and the >=1-resolved-AC ok precondition. templates/ remains the canonical source per ADR-001 and the deployed copy must NEVER be hand-edited -- but the deployed copy is the artifact whose state is asserted, because it is the one that runs. The three-key instruction is live there today at approximately lines 40-43, so this is not a source-only drift."
  - "DEPLOY MANIFEST: any new module added to the AC-store scripts package must also be added to the hardcoded deploy_map in build_ac_store (scripts/build_phases.py, approx. line 851). A module absent from deploy_map exists in the source tree but not in the deployed layout, so anything importing it raises ModuleNotFoundError at runtime while unit tests -- which import from source -- stay green. This is the exact failure mode CLAUDE.md records for the done-proof module."
  - "BO-201 RECONCILIATION -- NOT A BLOCKING PREREQUISITE, NO AMENDMENT REQUIRED. Accepting both shapes is a strict superset of BO-201, not a contradiction: BO-201's list form appears in its criteria as an illustrative 'e.g.', not as an exclusive shape, and its list-form scenario is preserved verbatim as this AC's third scenario. The implementation MUST NOT narrow or drop the list form, and the regression test that asserts the list-form verified-count must also carry a '# covers: BO-201' tag so BO-201 gains its first executing coverage. SEPARATELY FLAGGED, OUT OF SCOPE: BO-201 is work_status done, but its only covered_by entry is the legacy gate-template suite under tests/, which is entirely read_text() + regex over the template and asserts only frontmatter fields -- it could never have detected this divergence, which is how a 'done' spec AC and a vacuous gate coexisted."
  - "SOURCE_AC FALLBACK -- USE IT, BUT ORDERED AND NEVER SILENTLY. Resolution order is block-first, then source_ac: the block's own id/path is authoritative when interpretable (it names the exact store file rather than a directory a filename must be guessed inside), and source_ac is consulted only when the block yields nothing. source_ac must NOT silently rescue an unrecognised block: when the block is present with unrecognised keys and source_ac does resolve, the verdict must still name the unrecognised keys it found, otherwise the next shape drift becomes invisible exactly as this one was. The PRODUCER is not changed -- the two-key form is already on disk in tickets that have reached 99_done, so re-shaping the writer would retroactively invalidate every ticket generated to date."
  - "EXACTLY ONE RESOLVER may exist in the AC-store scripts package. If ACD-1900b-1's shared spec resolver already exists when this lands, extend it; otherwise the module created here is that resolver's seed and ACD-1900b-1 / ACD-1900b-5 must consume it rather than adding a second. A duplicated resolver reintroduces producer/consumer divergence one level up -- the same defect class this AC exists to close."
  - "SCOPE BOUNDARY -- the ac-validator agent template does not read ac_traceability at all and is OUT of scope here; it is a separate finding warranting its own AC, and its template must not be edited under this AC. In scope, because it sits on a file this change already touches: the _build_frontmatter docstring in scripts/ac_store/generate_ticket_from_ac.py (approx. line 1862) claims the block enables 'ac-validator and ac-fulfillment-gate' to locate the source AC. That claim is false for ac-validator and must be corrected in the same change rather than left as a documented untruth on an edited file."
  - "RESOLUTION IS READ-ONLY AND DETERMINISTIC. The coverage-resolution step must not mutate the ticket or any AC YAML file, and must return the same result for the same inputs. Auto-fix stays where it is, in the gate's Step 3, strictly downstream of resolution. This keeps the count assertion stable across repeated runs and prevents resolution from masking a failure by fixing it."
  - "ERROR HANDLING: ticket-frontmatter and AC-YAML reads must follow the repo error handling policy (Ruff E722 / BLE001 / TRY) -- typed except, log-or-re-raise, no bare except, no silent swallow. A parse failure of the traceability block must surface as a non-ok verdict naming the parse failure; it must never degrade into a resolved-count of zero that is then treated as 'nothing to verify'."
  - "TEST CONSTRAINT (binding on test-writer, per CLAUDE.md 'Gate / Workflow ACs -- Verify Behaviorally, Not by Grep'): no descriptor in test_spec may be satisfiable by a read_text() + regex over the gate template or the generator. Each test must obtain its ticket by INVOKING the generator (a real artifact, never a hand-indented literal fixture -- see the files_touched column-0 precedent) and then EXECUTE the resolution. The discriminating assertion is the verified-AC COUNT, not the verdict: an implementation still reading only the list form yields 0 on a generated ticket, whereas any verdict-only assertion can be made to pass by an implementation that blocks for an unrelated reason."
  - "DECLARED SURFACE HYGIENE: files_touched is derived from this AC's doc_links, and every edit-surface entry there is a file this change is expected to modify or create. Do not treat any other path named in prose as an edit surface; conversely, if implementation lands on a file not listed, reconcile doc_links rather than leaving the declared surface wrong."
test_spec:
  - name: test_two_key_block_resolves_exactly_one_ac_from_a_generated_ticket
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "Invoke the generator to WRITE a real ticket for a store AC (work_status todo, empty implemented_by, empty covered_by), then execute coverage resolution on that ticket path: the resolved-AC count is exactly 1 and the resolved entry names that AC id. An implementation reading only l2/l3 resolves 0 and fails here."
  - name: test_two_key_block_todo_ac_blocks_and_names_each_failed_field
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "On that same generated ticket the emitted verdict is not ok, names the AC id, reports a verified-AC count of 1, and lists work_status, implemented_by and covered_by as the fields that failed. The count assertion prevents a block emitted for an unrelated reason from satisfying this test."
  - name: test_uninterpretable_block_is_non_ok_with_zero_verified_and_lists_found_keys
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    description: "For a ticket whose traceability block carries only unrecognised keys and whose source_ac resolves to nothing: the verdict is not ok, the verified-AC count is 0, the message enumerates the keys actually found in the block, and the 'ac_traceability absent -- no AC store fields to verify' message is not emitted."
  - name: test_ok_verdict_is_impossible_over_an_empty_resolved_ac_list
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: unit
    description: "Direct invariant on the verdict step: given an empty resolved-AC list it does not return ok, whatever the per-AC results contain. This is the vacuous-truth guard and it fails against today's 'every AC in the working list is passed or skipped' rule."
  - name: test_list_form_verified_count_equals_number_of_acs_named
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: behavioral
    covers:
      - ACD-1900b-5-i
      - BO-201
    description: "Regression for the previously accepted form: a ticket with l2 naming two ACs, l3 naming one, and an ac_path, all three store ACs done with non-empty implemented_by and covered_by, yields ok AND a verified-AC count of 3 -- equal to the number the block named. Fails if the fix swapped to the two-key form instead of accepting both."
