risk_surface: contract_boundary
notes: |
  Mock-data invariant, stated as behaviour: "verdict == 'block' implies
  suppression_reason == null (a per-item opt-out downgrades to
  'pass-with-reason'; it can never coexist with a block)."

  Why its own L2 rather than a clause inside GE-124d-1 and GE-124d-2: the
  invariant is about the INTERACTION of the two escapes with the default, and
  an interaction cannot be tested from inside either participant. It is also
  the natural home for the precedence question neither escape answers on its
  own.

  THE PRECEDENCE ORDER IS A DECISION, NOT AN INHERITANCE — a file that is both
  warn-listed and reasoned resolves to pass-with-reason. Rationale: the reason
  is the more specific and more accountable statement, and resolving to warn
  would discard a reason someone wrote and a reviewer could challenge. Flagged
  for the user because it is not stated in the PO note or the mock data; the
  alternative (warn wins) is defensible and the choice should be confirmed
  rather than absorbed silently.

  IT-PO NOTE (2026-08-25). The precedence flag is carried forward unresolved —
  it is a product decision, not a technical one. Note only that whichever way it
  goes, it is one line of the resolution step and one test, so it is cheap to
  change after the fact; it does not need to block implementation.
