notes: |
  WHY THIS IS AN EDGE CASE OF THE PARENT AND NOT A SEPARATE BEHAVIOUR. Both shapes
  here are already inert for exactly the parent's reason — the line-number field
  holds something that is not a line number. No new predicate is needed; the value
  of writing them down is that the parent's rule must be shown to catch them
  without any special case, and that the drive-letter shape is the one an author
  is most likely to produce while being most confident it is correct.

  THE DRIVE-LETTER SHAPE IS NOT HYPOTHETICAL for this project — it is developed
  from Windows through a Linux subsystem, and absolute paths pasted from the host
  side carry a drive letter.

  ONE WARNING PER LINE is asserted explicitly because the natural implementation
  of a "too many fields" check can produce one message per surplus field, which
  would break the per-line announcement contract inherited from GE-113c-3-v.

  A WINDOWS DRIVE LETTER IS NOT MADE TO WORK HERE. The entry is rejected, not
  repaired: making absolute Windows paths suppressible is a separate question with
  its own matching semantics, and silently guessing at the author's intent is the
  failure mode this whole L1 exists to remove. Warning and skipping tells them.

  IT-PO TECHNICAL ENRICHMENT, 2026-08-18. Kept at python-coder, complexity S: no
  new predicate, no new message shape, only the demonstration that the parent's
  rule reaches both shapes. The load-bearing it_requirement is the prohibition on
  a shape-specific branch — the moment either shape gets its own code path, the
  next variant escapes.
target_epic: EPIC-SuppressionNarrowsNeverDisables
