created_by: "docs/acceptance-criteria/guardrail-engine/GE-100-code-quality-hooks/GE-100.yaml"
criteria: |
  Given the commit guardian configuration has the duplicate_code section with:
    enabled: true
  And the jscpd binary is present on the system PATH
  And running jscpd --version returns "4.0.0"
  When the duplicate code hook runs at pre-commit time
  Then the hook does NOT invoke jscpd for scanning
  And it emits a warning to stderr stating that jscpd v4.x has incompatible
    CLI flags and is not supported
  And the warning recommends installing jscpd v3.x
  And the hook exits with code 0 (fail-open)
