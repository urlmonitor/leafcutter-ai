notes: |
  ==========================================================================
  WHY THIS IS ITS OWN RECORD AND NOT AN AMENDMENT TO BP-1500b-4's GIVEN.
  The question was asked explicitly by the reporter and is answered here so
  no later reader has to re-litigate it.
  ==========================================================================
  BP-1500b-4 does reach this behaviour on its plain reading -- that is not in
  dispute, and its it_requirements already say so at length. Three things make
  it the wrong single home anyway.

  (1) ORDERING. BP-1500b-4 is an L2 whose Given opens "when the install is
      rebuilt AND THE ORPHAN SWEEP RUNS", and whose depends_on names
      BP-1500b-2. The sweep does not exist yet. So the clause that would stop
      the deletion is gated behind building BP-1500b-1, -2 and -3 first. The
      deletion is happening on the default path today, in adopter installs, and
      is independent of whether a sweep is ever written -- it is a cleanup step
      and a shim step disagreeing about who owns a directory. Requiring the
      residue feature to land before the data loss can stop is the wrong
      sequence for a live data-loss defect, and it is the reporter's stated
      reason for asking that it be worked first.

  (2) ALTITUDE. BP-1500b-4 is a CONSTRAINT ON A NEW FEATURE: do not let the
      sweep you are building become destructive. This is a DEFECT IN EXISTING
      BEHAVIOUR: the build is already destructive. Those are different units of
      work with different done-conditions. A reviewer can accept BP-1500b-4 by
      confirming the sweep is well-behaved, which is exactly what the L2's own
      test_rationale warns about ("a correct sweep bolted onto a build that is
      still deleting the adopter's skills directory").

  (3) THE GIVEN GENUINELY DOES NOT LEAD ANYWHERE NEAR THE HARD CASE. This is
      the IT PO's observation and it is correct. BP-1500b-4's three categories
      -- a machine-local settings file, a run-time lock file, and the build's
      own link entries -- all sit at the root of the managed area, OUTSIDE any
      directory the package claims wholesale. Every one of them is answerable
      by a per-file provenance test. The case here is a real directory sitting
      exactly where the package intends to put a link, holding a file the
      package has never heard of. Per-file provenance does not resolve it,
      because the conflict is over the container, not the contents. An
      implementer working only from that Given will build something correct
      that does not touch this.

  WHAT WOULD HAVE MADE THE AMENDMENT RIGHT: if the only harm were "the sweep
  might delete too much", one record would be correct and this one would be
  duplication. It is not the only harm -- see the second and third criteria
  paragraphs, neither of which BP-1500b-4 reaches at any reading.

  BP-1500b-4 IS NOT SUPERSEDED AND MUST NOT BE NARROWED IN RESPONSE TO THIS.
  Its provenance rule, its default-deny asymmetry and its no-exception-list
  control are all still required of the sweep, and none of them is restated
  here. The two records answer different questions about the same tree: that
  one asks what a new sweep may remove, this one asks what the build as it
  stands today may remove.

  ==========================================================================
  HANDOFF -- ONE CONCRETE ACTION FOR THE BA OR IT PO, DO NOT LET IT EVAPORATE.
  ==========================================================================
  BP-1500b-4's test_rationale ends: "If the owner decides that repair belongs
  elsewhere, drop this ONE entry deliberately and say where it went -- do not
  let it evaporate." The owner has now decided. The entry is

    test_bp_1500b_4_a_default_no_flag_build_does_not_delete_a_real_adopter_owned_skills_directory

  and it went HERE, to BP-1500g. The BA decomposing this L1 should carry it
  down as an L2 test descriptor under BP-1500g and, in the same pass, redirect
  BP-1500b-4's copy to cite BP-1500g rather than deleting it outright -- it is
  the only entry in that contract testing the fourth Then clause as a property
  of the rebuild, so removing it silently would weaken BP-1500b-4 as well.
  The same applies to BP-1500b-4's COEXISTENCE it_requirement: it should end
  up citing BP-1500g rather than carrying the repair itself.

  This PO run deliberately did NOT make those edits. L2 content is the BA's and
  IT PO's jurisdiction, and reaching into a reviewed L2's test_spec from an L1
  authoring pass is the quiet-widening move this store keeps catching. The
  instruction is recorded here, in the store, where both downstream agents read
  it -- and repeated in the component PROJECT_CONTEXT.md.

  ==========================================================================
  SCOPE BOUNDARY THE REPORTER ASKED FOR EXPLICITLY: NO PLACEMENT IS PRESCRIBED.
  ==========================================================================
  Where an adopter's own additions should live is a genuine design question
  with no good answer today -- the honest current state is that there is no
  safe placement at all, in either direction. Inside the generated tree, the
  opt-in clean build reaps it; at the discoverable location, the default build
  reaps it. This L1 therefore states only the OUTCOME (your addition keeps
  working and keeps existing) and deliberately names no directory, no
  configuration key and no ownership convention. Choosing among them is the
  BA's Gherkin and the IT PO's enrichment, and it may well need an ADR.

  A related trap worth naming so it is not discovered late: the cheapest way to
  stop the deletion is to stop installing the link, and that silently stops
  leafcutter's own capabilities arriving in the project. The third criteria
  paragraph exists to make that outcome a failure rather than a pass. Any L2
  set that tests only survival, and never that the package's own helpers are
  still reachable in the same project after the same build, leaves that door
  open.

  ==========================================================================
  PLACEMENT AND CAPS, CHECKED ON DISK 2026-09-08 -- NOT TAKEN ON TRUST.
  ==========================================================================
  Homes considered and rejected:
    - BP-900 (deployment completeness): 8 L1s against child_limit_override: 8,
      itself above the hard cap of 7. FULL -- a ninth needs a second waiver.
      Wrong theme regardless: BP-900 asks whether everything PROMISED arrived.
    - BP-100 (reliable builds): child_limit_override: 13 against a default of
      7. Adding to it deepens an existing waiver.
    - BP-017: mentions .claude/skills but is about symlink targets being
      relative rather than absolute, and is work_status: done. Not coverage --
      verified by reading the record, not by trusting the report.
    - BP-700d ("existing projects upgrade without breaking"): nearest title
      match in the store. Scoped to the frontend agent/skill consolidation
      migration; its four L2s are all about that one transition. Not a general
      ownership guarantee.
    - A NEW L0 was seriously considered and rejected. The honest theme here is
      ownership -- leafcutter sharing a project with its adopter rather than
      occupying it -- and that is arguably not BP-1500's honesty theme. It
      would have yielded three or four L1s. It was rejected because the
      reporter asked for one data-loss defect to be worked first, and a new
      L0 turns a fix into a programme with three siblings nobody requested,
      which is how a store accumulates permanent drafts. If ownership later
      earns its own goal, this L1 is the natural first child of it and BP-1600
      is free.
  Store-wide search for existing coverage before authoring: every AC mentioning
  "adopter", every AC mentioning ".claude/skills", and a regex sweep for
  deletion/destruction/overwriting of adopter-owned or project-owned files
  across all of docs/acceptance-criteria/. Nothing covers this. The only two
  records that come close are BP-1500b-4 (ruled on above) and BP-1500b's
  notes, which describe the defect accurately in prose while owning a
  different requirement.

  WHY BP-1500f WAS SKIPPED AND THIS IS g. BP-1500f is named twice in the store
  -- BP-1500b's notes and BP-1500b-3-i's notes -- as the reserved id for a
  possible future L1 lifting out the general rule that an unexamined check must
  not look like a satisfied one. Taking f for something unrelated would have
  turned two written pointers into misdirections for no gain. The letter gap is
  deliberate. After this record BP-1500 stands at 6 L1s against the hard cap of
  7 with no override, so that reservation remains exercisable -- but it is now
  THE LAST SLOT. A seventh L1 fills the parent, and an eighth needs a waiver.
  Flagged rather than worked around, per the reporter's instruction.

  THEME TENSION, FLAGGED HONESTLY RATHER THAN RESOLVED SILENTLY. BP-1500's own
  criteria opens "Running the build should never cost you anything you did not
  ask to give up", which is this defect verbatim; its notes narrow the goal to
  "is the build's ACCOUNT of its own work complete and true", which this defect
  is not really about. The green checkmark on the deletion is aggravating, not
  the injury -- a build that announced the deletion in red and did it anyway
  would satisfy the honesty reading and leave the adopter exactly as badly off.
  This record is placed under BP-1500 on the strength of the L0's criteria
  text, which is the normative field, and the tension is recorded so a future
  reader does not mistake the placement for a claim that this is a reporting
  defect. It is not. It is a destruction defect that happens to also be
  reported dishonestly.

  ROADMAP. phase_1 exit criterion 4 reads "The self-host build leaves the
  repository clean and reports truthfully: no unrequested edits to tracked
  files, no orphaned artifacts, no false all-clear". This defect is adjacent
  but not inside it: the criterion is scoped to THE SELF-HOST REPOSITORY, and
  the harm here lands hardest in adopter installs -- it was reported from one.
  No roadmap change is proposed; the gap is noted so nobody claims criterion 4
  closes this.

  PRIORITY IS high, NOT THE medium DEFAULT FOR A NEW L1, AND THE DEVIATION IS
  DELIBERATE. Matches the parent L0 and sits one step below BP-1500b-4's
  critical. The reporter characterised this as data loss to be worked first and
  reproduced it on today's main; assigning medium would have understated it to
  every downstream reader and to the scanner's ordering. Adjust at approval if
  that judgement is wrong. readiness remains draft.

  REPRODUCTION, AS REPORTED 2026-09-08 (kept in benefit terms; the mechanism is
  in KI-BP-009 and belongs to the BA and IT PO). A scratch project was given a
  skill of its own that the package does not ship and never has. An ordinary
  build with no flags was run against it. The build printed a success marker
  for a removal and then re-installed its link. The project's file was gone.
  Nothing in the output told the owner they had lost anything.
