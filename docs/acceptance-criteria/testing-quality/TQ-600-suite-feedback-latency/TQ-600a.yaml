id: TQ-600a
components:
  - testing_quality
  - build_pipeline
title: "Expensive setup is paid for once, not once per test"
component: testing-quality
level: L1
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  The costly preparation a test needs is produced once and shared, not rebuilt
  for every test that reads it.

  Today the single most expensive thing in the suite is producing a deployed
  copy of the package, and the suite produces one over and over — most often
  for tests that only need to LOOK at the result and never change it. The wait
  is not the testing; it is the same preparation repeated. This makes that
  preparation a shared resource, so a test that only reads it gets it
  immediately, while a test that genuinely needs its own altered copy still
  gets one.
