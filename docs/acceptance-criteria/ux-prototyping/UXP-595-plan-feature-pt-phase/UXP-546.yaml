title: "Product-truth stage commits stage only the reported artifact paths plus index.json"
component: ux-prototyping
level: L2
status: active
readiness: approved
priority: medium
req_status: approved
work_status: done
criteria: |
  Given a product-truth stage is being committed,
  When the commit is staged,
  Then only the stage's reported artifact paths and their derived files plus
  docs/product-truth/index.json are staged,
  And a wholesale git add of docs/product-truth is forbidden,
  And docs/acceptance-criteria/ is excluded from the product-truth commit,
  And conversely the AC-store commit never reaches into docs/product-truth.
depends_on:
  - UXP-595
doc_links:
  - path: docs/architecture/adrs/ADR-021-plan-feature-product-truth-phase.md
    relationship: specifies
    status: exists
assigned_agent: frontend-coder
estimated_complexity: M
it_requirements: |
  commitStageOutputProductTruth in templates/workflows-js/plan-feature.js builds commit
  instructions that enumerate the explicit reported paths + index.json, forbid a blanket
  "git add docs/product-truth", and keep docs/acceptance-criteria on a SEPARATE commit
  surface; commitStageOutput (AC side) stays scoped to docs/acceptance-criteria only.
