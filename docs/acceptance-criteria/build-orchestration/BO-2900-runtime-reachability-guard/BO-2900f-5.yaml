notes: |
  Satisfies the parent L1's `documentation_triggers: [reference-doc]`.

  Intended agent is `documentation-expert` — left as `assigned_agent: null` per this
  authoring run's instruction that the IT PO sets assignment. Flagging it here so the
  enrichment pass does not have to re-derive it.

  Scope note: this is a REFERENCE document (the contract as it is), not a how-to. The
  diagnostic walkthrough for "my live-app check did not run" already has a home at
  BO-2100d-4 — do not duplicate it here.

  2026-08-14 (IT PO enrichment). Agent set to documentation-expert as the notes
  above direct; no re-derivation was needed. Four things added to the requirements
  that the criteria imply but do not name:

  - THE TERM COLLISION GETS ITS OWN PARAGRAPH. BO-2900f-1's notes carry it as an
    implementer warning; it belongs in the published contract too, because the
    reader who confuses the two senses is exactly the reader consulting a reference
    to find out what an entry means.
  - THE HALT CARVE-OUT MUST BE PUBLISHED IN BOTH HALVES. Documenting only "zero
    entries are legitimate when the run halted" converts the reference itself into
    the excuse BO-2900f-2-i was split out to prevent. The defect half travels with
    it or neither goes in.
  - POSITION AGAINST THE SIGNOFF ENUM. A reader who knows {not_needed, needed,
    signed_off, failed} will read `skipped` as a near-synonym of `not_needed` and
    conclude the gate was waived. Since BO-2900f-3's entire point is that the two
    are opposites with respect to done-ness, the reference has to say so directly.
  - ONE SECTION IS BLOCKED, AND ONLY ONE. Everything except "where the record
    lives" is writable before the user's record-surface decision. Recording the
    boundary precisely so this AC is not treated as wholly blocked.
