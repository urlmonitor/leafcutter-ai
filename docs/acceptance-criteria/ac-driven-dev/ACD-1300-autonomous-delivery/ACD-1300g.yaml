notes: |
  Drafted under the existing autonomous-delivery goal at the user's request.
  Local inference is Qwen3.5 9B via Ollama with a tool-capable harness; the first
  workflow uses LangGraph. The reviewer executor and model are configurable,
  with Codex SDK and Claude Agent SDK adapter options. These implementation
  constraints belong in BA/IT PO decomposition, not the benefit statement.
  The user chose at most two automatic feature reviews, then human attention,
  and draft PR publication with manual merge. No daily or token caps were asked
  for. Publication and provider failures must not become false success.
  Intentionally unphased: the current vision defers non-Anthropic support, while
  the user explicitly authorizes this local pilot. No roadmap or vision change
  or readiness approval is claimed by creating these draft requirements.
