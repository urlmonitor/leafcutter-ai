  note: |
    Authorised by the user (BrainCandy) on 2026-09-17 through GE-129 ("the safeguards
    you are promised check who is acting, not what they typed"): commits are authorised
    by who is calling, so the typed token COMMIT_AGENT_MODE=1 grants nothing and is
    retired as an accepted alternative to dispatching the commit agent. Only a dispatch
    to the commit agent now satisfies this criterion; the meaning is otherwise unchanged.
    Aligns with the same-day amendments to BP-1100d-1 and BP-1100d-2. title, depends_on,
    readiness (draft) unchanged; declares_side_effect not added (the Then clause asserts
    no durable effect).

