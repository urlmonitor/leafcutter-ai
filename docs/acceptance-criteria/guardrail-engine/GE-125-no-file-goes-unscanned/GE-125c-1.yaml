notes: |
  THIS IS THE CRITERION THAT PROVES THE UNIT OF THE DECISION CHANGED, and it is
  the one the parent L1 calls load-bearing. The first and second scenarios are one
  pair in one location: the same explained identifier is set aside in both, and the
  only difference between a clean result and a blocked commit is whether a real
  credential is also present. No arrangement of a file-level rule produces that
  pair — a per-file rule gives zero findings for both files or two for both.

  THE COUNTING ARM FAILS IN BOTH DIRECTIONS AND BOTH ARE REACHABLE. Zero means the
  file-level shape survived; two means the per-result judgement stopped recognising
  the identifier. GE-123d-3 already fixed this exact counting shape for the
  adjacent keyword rule and its reasoning is reused here rather than re-derived.
  Do NOT close either as a duplicate of the other: GE-123d-3 governs a PROPOSED
  exemption for the keyword-based rule, this governs the EXISTING exemption for the
  shapeless-value rule, and six GE-123 records fence the two apart deliberately.

  MANDATORY NEGATIVE CONTROL, STATED AS A SCENARIO RATHER THAN A CAVEAT. The
  second scenario is the control that stops the first being satisfied by removing
  the exemption altogether. The parent's promise is that an allowance covers a
  single result — not that there is no allowance. Both directions must be red
  before the fix lands: the first scenario against today's whole-file exemption,
  the second against a naive "report everything in prose locations" implementation.
  A suite that cannot distinguish those two wrong implementations has not
  discharged this criterion.

  FIXTURE PLACEMENT — STATED, NOT INHERITED, AND SHARPER HERE THAN ANYWHERE ELSE
  IN THIS GOAL. Every fixture must be a real file created inside a tempfile-backed
  throwaway project root, with the prose location constructed INSIDE that root
  (for example `<tmp_root>/tickets/00_inbox/<name>.md`) and the check run against
  that root. No fixture may be created under this repository's own `tickets/`,
  `docs/retrospectives/`, `docs/acceptance-criteria/` or `templates/skills/` trees.
  The L0 records why: a fixture under one of those paths measures the exemption
  rather than the scanner and passes for the wrong reason. This criterion is the
  most exposed of the four L1 subtrees to that trap, because unlike its siblings it
  NEEDS its fixture to sit in a prose location — so the location must be one the
  test constructed and controls, never one the repository happens to provide. The
  test module itself belongs under `unit_tests/commit_guardian/`, which matches
  none of those four names. If the check cannot be pointed at a throwaway root,
  that inability is itself a defect to raise against this goal — it is not a
  licence to place a fixture in a real prose tree.

  VERIFY BY EXECUTION, NEVER BY READING THE SOURCE. Per CLAUDE.md, an AC about a
  hook is discharged only by a test that executes the behaviour. Every arm here
  runs the real pre-commit secrets check over real staged files and asserts the
  process exit status and the reported findings. Calling the exemption decision
  directly and asserting what it returns does not discharge any arm: a decision
  answering "not exempt" is not evidence that a commit was blocked. Greping the
  scanner source for a per-result call discharges nothing at all — it passes on
  dead code.

  CREDENTIAL-SHAPED FIXTURE STRINGS must be assembled at runtime from concatenated
  fragments rather than written as source literals, so this repository continues to
  need no suppression for the module that holds them. The existing suppression test
  module does this deliberately; do not collapse the fragments back into literals
  and do not add an allowlist entry so that literals can be committed.
