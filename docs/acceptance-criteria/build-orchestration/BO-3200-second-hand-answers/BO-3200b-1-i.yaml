notes: |
  The parent AC assumes the claim either happened or did not. The interesting state is in
  between, and it is the one that strands work: items are marked as the run walks the list, so
  a stop mid-list leaves a set of claims that no later release knows about — the run's own
  record of what it claimed is what the release reads from, and that record is incomplete.

  THE SECOND SCENARIO KEEPS THE GUARD FROM CRYING WOLF. A release path that reports a failure
  whenever it finds nothing to release trains everyone to ignore the line in the halt report
  that BO-3200b-2 exists to make meaningful.

  THE THIRD SCENARIO IS PER-ITEM TOLERANCE. A release that abandons the whole list on the first
  item it cannot handle leaves everything after that item stranded permanently, and the
  un-sticking mechanism is then the thing that is broken. Naming the item that could not be
  released is what makes the residue recoverable by hand instead of invisible.

  ADJACENT, NOT CLAIMED: the repository separately records a latent defect (KI-BO-022) in which
  a raise inside the claim and release helpers escapes uncaught and strands records for exactly
  these reasons. This AC specifies the required BEHAVIOUR of partial claim and partial release;
  it does not adopt that entry's mechanism or its remediation, which belong to whoever owns it.

  IT-PO ENRICHMENT NOTE (2026-08-26). The it_requirement that the claim record be written per
  claim (or the release list derived from the store) is the BA's first scenario turned into a
  mechanism. It is stated explicitly because the natural implementation — collect the claimed
  ids, write them when the loop completes — satisfies every test that uses a single item and
  fails silently on the exact state this AC exists for.
