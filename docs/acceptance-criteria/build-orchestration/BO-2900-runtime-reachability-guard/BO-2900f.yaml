readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Every check you asked for leaves a record — including the ones that never ran.

  When a piece of work asks for a quality check that the current setup has turned
  off, skipped, or otherwise did not run, the result still says so in plain terms,
  naming the check and the reason it did not happen. Silence is never an outcome:
  a check that produced nothing can no longer be read as a check that passed.
