roadmap_phase: phase_acbuild_2b_ticket_demotion
criteria: |
  Tickets exist only to bundle requirements into one valuable feature.

  A ticket is a grouping container -- it exists only to bundle a coherent set of
  requirements into one whole, valuable feature, so we build complete features
  rather than random isolated pieces. A ticket carries no sign-offs of its own and
  is never the thing an agent completes; it is simply done when all the
  requirements it groups are done.
