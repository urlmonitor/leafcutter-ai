estimated_complexity: M
it_requirements:
  - "The self-hosting-evidence rule is authored into the gate that adjudicates AC fulfillment: ac-fulfillment-gate.md (priority 11.7) and ac-validator.md (priority 11). Add a verification step that, when an AC's text asserts self-hosting non-regression (the changed guard/linter/hook does not newly flag the project's own code), inspects the recorded sign-off for that AC and treats the criterion as satisfied ONLY when concrete evidence is present."
  - "Evidence is defined as BOTH: (a) the literal command string that was invoked to run the changed check over the real repository, AND (b) an excerpt of that run's actual output demonstrating zero new violations on the repository's own code. The evidence is recorded in the sign-off Comments / completion_manifest of the AC's phase agent -- consistent with the signoff skill's completion_manifest model (signoff SKILL.md section 2b) that building-epics SKILL.md routes on."
  - "A sign-off that asserts only a bare verdict (e.g. 'self-hosting verified') with no recorded command and no recorded output must yield a blocking verdict from the gate: the self-hosting criterion is reported NOT satisfied and the commit phase is blocked, mirroring the existing blocker path in ac-fulfillment-gate.md Step 5."
  - "When recorded output shows one or more new violations on the repository's own code, the gate must keep the criterion unsatisfied (blocker) until a subsequent recorded run shows zero new violations -- the gate never infers success from the absence of a violation count."
  - "This is a prompt/template instruction change only: no new exception types, exit codes, or scripts are prescribed. The HOW of locating and parsing the recorded evidence is the implementing agent's choice; this AC fixes only the WHAT (evidence is mandatory; a bare assertion fails)."
  - "Detection of a self-hosting AC is a review-checklist judgment in the gate template: recognize AC language asserting that a changed guard/linter/hook does not newly flag the project's own real code. No detection heuristic is hard-coded."
