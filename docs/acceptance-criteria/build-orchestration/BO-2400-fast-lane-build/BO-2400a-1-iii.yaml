notes: |
  SPLIT 2026-09-27 (round 4, requested by the IT PO) out of BO-2400a-1-i to clear an approval
  blocker. Nothing validates config/agent_registry.json against its schema today; the only
  link is the $schema editor hint. A schema-only enum would therefore reject nothing. Making
  the running gate reject an unknown kind is .py work (python-coder), while the agent template
  and registry entry stay with llm-expert in BO-2400a-1-i.

  USER DECISION 2026-09-27 (round 3): the four kinds are reads_store, changes_store,
  changes_repository, publishes. Absent means no kinds, mirroring the undeclared reading of
  permits_shell, which BO-2400f-5-ii relies on.

  SCOPE. Only step_kinds is validated against the schema. Whole-schema validation is out of
  scope because switching it on may reject existing entries for unrelated reasons; that would
  be its own change.

  The added-kind scenario is the clause that separates reading the schema from a copied list:
  a gate holding its own list of four kinds passes the rejection scenario and fails this one.
  The duplicate-kind scenario follows from "array of unique strings".
