notes: |
  WHY THE REFUSAL SET IS THE PROBE'S, NOT A LIST OF NAMES. GE-129d's notes require "no prompt
  reaches a person" to be decided by observation. Auto-accept of edits may still prompt for shell
  commands; if so, the second scenario keeps it on the prompt path rather than refusing it by name.

  WHY THE THIRD SCENARIO. A guard that refuses only named modes lets through a new or unreported
  mode. Unknown means refused -- the same fail-closed stance as GE-129a-2-i.

  WHY "NAMES NO TOKEN". The cheapest helpful refusal would tell the reader how to get past it.
  Q6: no transitional token wording anywhere.

  DECIDED 2026-09-17 (user) -- THE DISPATCH PATH IS REFUSED TOO. In these modes the session could
  dispatch the commit specialist through the Agent tool, which Q1 treats as approved by the
  dispatching run. The user chose to refuse that dispatch; unattended workflow runs are not
  affected. Specified in GE-129d-2-i, not here.

  declares_side_effect: false -- the Then clauses assert refusal and absence of a commit.
