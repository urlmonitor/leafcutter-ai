id: UXP-700c-2-i
title: "A journey never confirmed is reported as never confirmed, not as current"
component: ux-prototyping
components:
  - ux_prototyping
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
criteria: |
  Given a newly authored journey carrying no record of ever having been confirmed against what
    it describes,
  When the record is checked,
  Then it is reported as never confirmed, naming the journey,
  And it is not reported as up to date,
  And it is not reported as behind, because there is no earlier confirmation for it to be
    behind,
  And the count of journeys compared does not include it.
depends_on:
  - UXP-700c-2
created_by: "docs/acceptance-criteria/ux-prototyping/UXP-700-truthful-project-record/UXP-700c-2.yaml"
