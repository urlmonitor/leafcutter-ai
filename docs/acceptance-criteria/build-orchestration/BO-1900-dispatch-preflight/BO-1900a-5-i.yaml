work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a phase agent whose own instructions require it to invoke a named capability,
    and a run in which no declaration of that agent's required capabilities can be found,
  When the run compares required capabilities against available ones for that dispatch,
  Then the comparison reports the requirement as unconfirmed and holds the dispatch back,
    And the comparison does not report the dispatch as fit,
    And the reason it gives distinguishes a requirement that could not be confirmed from a
      requirement that was confirmed absent,
  So an agent's requirements going undeclared is never indistinguishable from its
    requirements being met.
