estimated_complexity: S
it_requirements:
  - >-
    THE VERDICT READS HAVE THREE OUTCOMES, NOT TWO. Found / found-and-fine / could not
    read. Only a successful response whose body parses to the expected shape (a workflow
    object with a `state` string; a runs object with a `workflow_runs` list) counts.
    There is no code path on which an exception during a verdict read leads to "pass".
  - >-
    ONLY THE VERDICT READS DECIDE could_not_read (consequence of user decision A). The
    workflow-state read and the run-history read. The jobs read, the notice read and the
    two proof reads are content and evidence: their failure leaves the verdict held as
    computed and denies an exemption, never releasing a hold and never converting "held"
    into "could not read". A failed JOBS read (red vs did-not-complete) reports
    `did_not_complete` with stage `unknown` and the cause named — the conservative
    wording, since the check cannot then show the tests ran — and still permits the
    exemption route like any other held run.
  - >-
    THE CAUSE IS NAMED AND THE WORDING IS DISTINCT. Status code or kind of failure; a
    headline shared with no other held state. Logged at WARNING or above.
  - >-
    EVERY REQUEST HAS A BOUNDED TIMEOUT, on the order of ten seconds, configurable so the
    test can produce a real timeout in a fraction of a second.
  - >-
    A REFUSED WRITE LEAVES THE VERDICT ALONE AND IS NOT SILENT. The job's conclusion is the
    verdict's.
  - >-
    FORK PULL REQUESTS (user decision H; the reduced-credential premise is retired).
    VERIFIED (GitHub expert, Q7): under `pull_request_target` the job receives the base
    repository's token for fork pull requests too, limited by the `permissions:` block, so
    a fork gets the same verdict AND a working comment. Moot in practice — the repository
    has had no fork pull requests (VERIFIED API) — but the criterion stays so a fork is
    never treated differently. The run-history endpoint is readable by anyone with read
    access to this public repository (VERIFIED doc).
  - >-
    TRANSIENT-FAILURE RETRY — DECIDED AT RE-ENRICHMENT: at most ONE retry, only for 429,
    5xx, timeout and connection failure, after a short fixed delay (honouring
    `Retry-After` when present, capped at a few seconds), then could_not_read. Never for
    401/403/404 or a malformed body. Total evaluation stays within tens of seconds; the
    delay is injectable so the test runs in a fraction of a second. GITHUB_TOKEN's limit
    is 1,000 requests per hour per repository, shared by all workflows (VERIFIED doc).
  - >-
    THE FORK CRITERION IS TESTED AS PAYLOAD-INDEPENDENCE. The check never branches on
    `pull_request.head.repo.full_name`; the descriptor evaluates the same run history with
    a same-repository payload and a fork payload and asserts identical verdicts and
    identical request sets.
  - >-
    THE TESTS COST UNDER 0.5 s. Every failure produced at the HTTP layer through the REAL
    REST client: 401, 403, 404, 429, 500, malformed bodies, a closed local port, a
    non-answering socket with a fraction-of-a-second timeout.
delivers_to: null
expects_from:
  - ac_id: TQ-600a-13-vi
    contract: >-
      The verdict function and its workflow-state and run-history reads through
      scripts/ci/_github_rest.py, returning `state: could_not_read` with a non-null
      `cause` on any failed verdict read.
  - ac_id: TQ-600a-13-vii
    contract: >-
      The comment create/edit path, whose refusal this record requires to leave the
      verdict unchanged.
  - ac_id: TQ-600a-13-viii
    contract: >-
      The exemption path (proof reads and the exemption-record write), whose read and
      write failures the criteria name. -viii is in depends_on (BA amendment
      2026-10-08), so this record is built after it with its exemption cases intact.
test_spec:
  - name: test_tq600a_13_ix_every_failed_verdict_read_fails_closed
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: failure
    surface_invoked: "scripts/ci/post_merge_hold.py's verdict entry point, in-process, through the real REST client against the shared recording fake server returning each failure on the workflow read and, separately, on the run-history read"
    description: >-
      For 401, 403, 404, 429, 500, a timeout, a connection failure, a non-JSON body, and a
      JSON list where an object was expected, on either verdict read: could_not_read, the
      check fails, output names the cause. A fresh green run on an active workflow: pass.
  - name: test_tq600a_13_ix_content_and_write_failures_do_not_change_the_verdict
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "scripts/ci/post_merge_hold.py against the fake server refusing the notice read, the proof read, the comment write and the exemption write"
    must_catch:
      - "a verdict read error is caught and treated as 'nothing wrong', so the check passes"
      - "a failed notice read is reported as could_not_read, hiding that the run itself is red"
      - "a failed proof read grants the exemption"
      - "a refused comment write raises and ends the check neutral or skipped rather than failed"
      - "a refused comment write is caught and the check then reports success"
    description: >-
      Red run, notice read refused: held (not could_not_read), output notes the notice
      could not be read. Red run, jobs read refused: held as did_not_complete, stage
      unknown, cause named. Red run, declared fix, proof read refused: held. Red run,
      comment write refused: held. Green run, comment write refused: pass. Exemption
      record write refused on an otherwise-accepted fix: pass, output notes the record
      was not written.
  - name: test_tq600a_13_ix_a_fork_pull_request_gets_the_same_verdict
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "scripts/ci/post_merge_hold.py's verdict entry point with a same-repository event payload and a fork event payload against the same served history"
    must_catch:
      - "the check branches on the head repository and skips the comment or the verdict for a fork"
    description: >-
      Red and green histories, each evaluated with both payloads: identical verdicts and
      identical recorded request sets.
test_rationale: |
  The paired pass is required because the cheap way to satisfy "never passes on a failed
  read" is to fail on everything. The redesign splits reads into verdict reads and
  content reads: a content read that fails must neither release the hold nor masquerade as
  an outage, because "could not read" would then hide a real red run. Failures are
  produced at the HTTP layer through the real client. Under half a second.
