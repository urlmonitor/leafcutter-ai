notes: |
  THE PARENT L1 NAMES TWO INDEPENDENT DEFECTS and this is the second: "a required action whose
  outcome is never inspected cannot be known to have happened." Doing the action directly
  (BO-3200b-1) does not close it — a directly-performed action can also fail, and if nobody
  reads the result the failure is just as invisible as a refusal that was discarded.

  KI-BO-020's fix direction states it plainly: "Whatever the shape, read the reply: a release
  whose result is discarded cannot distinguish 'released' from 'refused', which is precisely
  how this stayed invisible. A release that did not release should surface in the halt payload
  next to the failure that triggered it."

  BOTH FACTS IN ONE REPORT is the load-bearing requirement. A halt that names only the
  triggering failure sends the reader to diagnose that failure while the real damage — stranded
  state — goes unmentioned and is discovered days later by the guard that refuses to rebuild.
  The second scenario forces the success case to be reported too, so silence is never the
  answer to "did the cleanup run".

  THE THIRD SCENARIO IS THE CONSUMED-IN-CONTROL-FLOW CLAUSE required by CLAUDE.md "Gate /
  Workflow ACs — Verify Behaviorally, Not by Grep": a report that states the failure while the
  machine-readable outcome still reads as everything-fine is the false-success shape recorded
  against this repository repeatedly. The covering test must run the real failure path and
  assert on both the report and the outcome a caller branches on.

  IT-PO ENRICHMENT NOTE (2026-08-26). Two additions the criteria imply. First, the triggering
  failure must survive: the obvious way to make the cleanup failure visible is to report it, and
  the obvious way to report it is to overwrite the halt reason. Second, reading the outcome must
  not raise — an exception thrown while inspecting the cleanup result would destroy the original
  failure and produce a third invisible fact, which is how a fix for an invisibility defect
  becomes a new one.
