  - name: test_finding_removable_by_both_mechanisms_is_counted_at_most_once
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: boundary
    description: "A value under a reduced location that a .security-allowlist entry also matches yields a total no larger than the number of findings actually removed — the overlap arm, which is the only way the double-count failure is reachable"
  - name: test_attribution_field_carries_no_part_of_the_matched_value
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "A distinctive marker embedded inside each withheld value appears in no attribution string and on neither stream — extending the never-echo assertion shape to the field most tempting to make more specific"
  - name: test_allowlist_fixture_is_scoped_to_the_throwaway_repository
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "The allowlist the run honours is the one written into the throwaway repository, verified by asserting the suppression takes effect there and that no allowlist outside it was read — so the first arm measures the allowlist rather than an ambient suppression"
test_rationale: "Every arm here is about which of three removal mechanisms a number counts, so each entry must run the real pipeline where all three mechanisms are actually in force: the allowlist inside scan_files, the location-based reduction inside the hook's post-filter, and nothing else. A unit test over the counting function alone would count whatever set it was handed and could not detect the ordering defect the second it_requirement names — an implementation that re-scans with suppression disabled produces a correct-looking count from a wrong set. The two-run entry exists because stability across runs is not observable in a single run, and it is the property that makes a widening of the reduced set visible by comparison. The overlap entry is the only reachable path to the double-count failure and cannot be folded into the first. The marker entry extends GE-125d-1's negative assertion shape to the attribution field, because 'a more specific reduction name' is the most plausible way a well-meaning later change reintroduces the value. The allowlist-scoping entry is a real-artifact test because CLAUDE.md records that the deployed hook resolves .security-allowlist from the workspace-root symlink target rather than the worktree root: a test that does not pin which allowlist is in force is measuring an unknown."
