notes: |
  THE PRODUCT OWNER ASKED FOR THIS IN TERMS: "resist making this a live gate. It is a
  view, not a verdict. A coverage figure that starts blocking things is a different
  requirement and needs its own conversation with the user." Recorded as a criterion so
  the resistance is mechanical rather than a matter of whoever implements it having
  read the note.

  A MEASUREMENT THAT GATES STOPS BEING A MEASUREMENT. The moment a number can fail a
  build, the incentive to make the number look good arrives, and the cheapest way to
  improve this particular number is to delete a declaration — which BO-3500a-1-i
  already has to forbid on the build side. A reporting requirement that quietly creates
  that incentive would undermine the tree it belongs to.

  THE SECOND CLAUSE OF THE SECOND SCENARIO — producing it twice leaves the same state —
  is the one that catches the accidental version of this, which is a report that
  helpfully annotates the requirements it classified. That is a write, it makes the
  report a participant rather than an observer, and it would be added with the best of
  intentions.

  THE THIRD SCENARIO IS THE HARDEST TO TEST and is stated anyway, because it is the
  clause a future change is most likely to violate. It asks for the absence of a
  consumer, and the honest way to establish it is to run the automation's decisions
  with the report absent and with it present and show no difference — not to inspect
  the source for the absence of a reference, which proves nothing about behaviour and
  is the evidence shape this component rejects.
