id: TQ-100a-2
components:
  - testing_quality
title: "A test that sandboxes itself with a linked worktree leaves the host repository's commit identity untouched"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given a host repository whose recorded commit identity is
      "Real Human <real-human@example.com>",
    And a test in the suite that sandboxes itself by adding a linked worktree of
      that same host repository and making commits inside it under its own
      fixture identity "Fixture <fixture@example.invalid>",
    And the standing fact that a linked worktree holds no configuration of its
      own — it reads and writes the single configuration shared by the host
      repository and every other worktree of it — so an unqualified identity
      write issued from inside the sandbox lands on the host,
  When the suite is run,
  Then each commit the sandbox makes carries "Fixture <fixture@example.invalid>"
      as BOTH its author and its committer,
    And the identity the host repository — and every other worktree of it —
      commits under afterwards is still "Real Human <real-human@example.com>",
      unchanged in both name and address,
    And the sandbox obtained its identity from the environment its git
      subprocesses inherit rather than by writing an identity into
      configuration, so the host's shared configuration is not written to at any
      point in the run,
    And a commit made in the host repository after the suite finishes is
      attributed to "Real Human <real-human@example.com>",
    And the host repository having worktree-scoped configuration switched on
      changes none of the above: that switch only makes an explicitly
      worktree-qualified write legal, and an unqualified write issued from
      inside the sandbox still lands on the host regardless of it.
depends_on:
