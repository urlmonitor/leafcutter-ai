id: GE-127d-3
title: "No comment of any style counts toward a file's length, so rewriting a comment in another style can never move the measured length"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a covered file holding 2 lines of code with 4 lines of explanatory text
    between them, the 4 lines marked as line comments in the file's own language
    (`#` in Python and shell, `//` in JavaScript and TypeScript, `--` in SQL),
  When its length is measured,
  Then the measured length is 2,
  And given the same 2 lines of code with the same 4 lines of text carried
    instead as one block comment (`/* ... */` in JavaScript, TypeScript and SQL),
    or in Python as a string literal standing alone as a statement — the
    docstring of the module, class or function, or a bare string anywhere else in
    the file, including a trailing block such as a DECISION HISTORY string at the
    end of the module,
  When its length is measured,
  Then the measured length is again 2 — no comment of any style, and no string
    literal that stands alone as a statement, counts toward a file's length, and
    the style a comment is carried in never changes the number,
  And a line holding code followed by a comment on the same line counts as one
    line,
  And a line counts only when it holds a token that is code — not part of a
    comment and not part of a Python string standing alone as a statement — so a
    physical line holding only whitespace never counts, wherever it stands:
    between code lines, between two line comments, inside a block comment or
    standalone string, or inside a multi-line string value that is used,
  And given the same 2 lines of code with the 4 lines of text split into two
    paragraphs by blank lines, carried once as line comments with a blank line
    between the paragraphs and once as one block comment or standalone string with
    a blank line inside it,
  When their lengths are measured,
  Then both measure 2,
  And given a covered file and a copy of it with blank lines removed from it or
    added to it anywhere, with nothing else changed,
  When both lengths are measured,
  Then the two measured lengths are the same number,
  And a Python string that is used — assigned to a name, passed as an argument,
    returned, or part of any larger expression, as embedded SQL, prompts and
    templates are — is a string value and each of its lines counts like any other
    code, and an f-string counts as code wherever it stands, because evaluating it
    runs the expressions inside it,
  And given a staged change to a covered file whose only effect is rewriting
    existing comments from one style to another with their text unchanged —
    including comment paragraphs separated by blank lines rewritten as one block —
    or adding or removing blank lines,
  When the author performs an ordinary commit,
  Then the length quoted for the file before the change and after it is the same
    number.
depends_on:
  - GE-127d
  - GE-127d-2
