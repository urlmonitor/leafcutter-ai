notes: |
  THIS IS THE FAILURE MODE THE OBVIOUS FIX PRODUCES. The natural way to satisfy GE-126c-1's
  first arm is a guard at the top of the build-source copy that refuses immediately. The
  build copies that file verbatim to the locations that are meant to enforce, so the guard
  ships to all of them and every commit in the repository is refused by a check that used
  to work. The distinction has to be drawn from something the two copies do not share —
  their location — rather than from text present in both.

  IT IS AN L3 BECAUSE IT PINS THE BLAST RADIUS of GE-126c-1 rather than adding a behaviour.
  It earns its own record because the failure is total and immediate and because the
  parity enforcement in this component checks that the copies MATCH which is exactly the
  pressure that produces this bug.

  THE EVERY-LOCATION CLAUSE IS NOT PADDING. This check exists at more than one deployed
  location and the parity guard enforces consistency across them. A fix verified at one
  location only is the template-only no-op this component has shipped before.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

  ------------------------------------------------------------------------------
  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  delivers_to IS NULL AND THAT IS NOW A DECISION, NOT AN UNFILLED FIELD. This record is
  TERMINAL: it is a boundary on where GE-126c-1's refusal may appear. A prohibition has no
  downstream consumer, and the deployed copies' enforcing behaviour is pre-existing rather
  than something this record produces. DO NOT REFILL.

  A DOC GAP RECORDED RATHER THAN GUESSED. There is no component-level architecture page
  describing the build deploy map; the only description of which phase writes which file
  is in scripts/build_phases.py, which the IT PO stage does not read. The doc_link above
  is marked status: planned so the gap is visible. This does not block the record - the
  coder reads the build source - but a reviewer should know the 'every location' clause
  has no documentation surface behind it today.

  THE DERIVE-THE-LOCATIONS REQUIREMENT IS THE SUBTLE ONE. A test that lists the deployed
  locations is a second enumeration of a set the build already owns, and it will drift the
  first time a location is added - which is GE-126d's defect reintroduced inside GE-126c's
  test suite. Read the set from the deploy map.

  AGENT AND SIZE. python-coder, M rather than S: running the real build into a temp target
  and reading its deploy map is most of the work, and none of it is reachable from a unit
  test that imports the check.

  NOT AUTHORED HERE: declares_side_effect (derived per BO-2900g-2, see KI-CG-015).
