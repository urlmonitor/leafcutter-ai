it_requirements:
  - >-
    CODE FACT (test-designer, 2026-11-16): today the target resolution in templates/scripts/worktree_remove_half.py
    lets --path win silently when --kind/--slug are also given. That precedence is removed: every given form is
    resolved and compared first (below), and the remove sub-parser in worktree.py stops treating the forms as
    exclusive alternatives (wiring only, no net growth).
  - >-
    When a request names the work in more than one form (--kind/--slug, --branch, --path), every form is
    resolved first. When they point at different workspaces, or one of them at none, the request is refused
    before any program check, fetch, unsent-work check or deletion runs. The refusal names every identity it
    was given and states that they point at different workspaces. Decided (user accepted the default, Q4,
    2026-11-16): code USAGE (exit 64).
  - >-
    No form silently wins over another. When the forms resolve to the same workspace, the request goes ahead
    as one request (decided, Q4, 2026-11-16).
  - >-
    A kind without a short name, or a short name without a kind, is refused USAGE with a message stating that
    the work was not named completely. The missing half is never guessed.
  - >-
    Every refusal here leaves every workspace byte-identical and touches neither the shared project nor the
    main checkout. It is one JSON answer under BO-4300c-2 and carries no workspace_path.
  - >-
    The agreement check lives with the one shared resolver of BO-4400g-1. worktree_remove.py (485 lines)
    takes wiring only, with no net growth. No limit is raised.
  - >-
    PROOF RUNS THE DEPLOYED MAKER as a separate process against real temporary repositories with a real
    bare hub (unit_tests/build_orchestration/_workspace_maker_fixtures.py). No git mock, no import of a maker
    module for the asserted behaviour, no build.py spawn, and isolated HOME and git config.
test_required: true
test_intent:
  - clause: each request is refused without clearing anything
    needs_test: true
    reason: A request that applies one identity and ignores the other would clear the wrong workspace, which is the loss this record exists to prevent.
  - clause: the first two refusals name both identities they were given and state that they point at different workspaces
    needs_test: true
    reason: The caller can only correct the request if the refusal names both names, which is computed from the two resolutions.
  - clause: the third refusal states that the work was not named completely
    needs_test: true
    reason: A kind with no short name must be refused rather than resolved by a guess, and the message is what the caller acts on.
  - clause: '"alpha" and "beta" are identical before and after all three requests'
    needs_test: true
    reason: A refusal issued after a partial deletion or a fetch would still change a workspace, which a snapshot of both catches.
test_spec:
  - name: test_mixed_and_incomplete_name_requests_are_each_refused_clearing_nothing
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      Ready alpha and beta (feature, nothing unsent). Three real subprocess requests: remove --kind feature --slug
      alpha --branch feature/beta; remove --kind feature --slug alpha --path <beta location>; remove --kind
      feature (no slug). Each answer is refused or usage (non-ok, exit 2 or 64), never ok, and carries no
      workspace_path or removed_path. Today the second request clears beta, because
      worktree_remove_half.target_path returns the --path location before it looks at --kind and --slug, so this
      test is red until the build.
    proves_clause: each request is refused without clearing anything
    code_file: templates/scripts/worktree_remove_half.py
    must_catch:
      - the line-of-work name or the location silently winning over kind and short name, clearing beta
      - a mixed request refused only after a program check, fetch or deletion ran
  - name: test_mixed_name_refusals_name_both_identities_and_say_they_differ
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: criterion
    description: >-
      For the first two requests the answer is code USAGE, exit 64, and its message names both identities it was
      given (feature/alpha or alpha, and feature/beta or the beta location) and states that they point at
      different workspaces.
    proves_clause: the first two refusals name both identities they were given and state that they point at different workspaces
    code_file: templates/scripts/worktree_admin.py
  - name: test_kind_without_short_name_is_refused_as_not_named_completely
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: boundary
    description: >-
      remove --kind feature alone answers USAGE, exit 64, with a message stating the work was not named
      completely, and the symmetric request with a short name and no kind gets the same refusal. Nothing is
      guessed.
    proves_clause: the third refusal states that the work was not named completely
    code_file: templates/scripts/worktree_remove.py
  - name: test_workspaces_are_identical_after_all_three_refusals
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: discrimination
    description: >-
      Snapshots (files with .git, refs, FETCH_HEAD absent as before) of alpha and beta, and of the shared project's
      refs, are identical before and after the three requests: no fetch, no marker rewrite to clearing, nothing
      deleted. A control remove of alpha by its own identity afterwards succeeds, so identical is not nothing ran.
    proves_clause: '"alpha" and "beta" are identical before and after all three requests'
    code_file: templates/scripts/worktree_remove.py
    must_catch:
      - a refusal issued after the maker fetched into the workspace or rewrote its record
  - name: test_mixed_name_refusal_is_reachable_through_the_real_cli
    target_dir: unit_tests/build_orchestration/
    framework: unittest
    type: behavioral
    angle: reachability
    description: >-
      main() with real argv as a subprocess: python <deployed worktree.py> remove --kind feature --slug alpha
      --branch feature/beta exits 64 with one JSON object (USAGE).
    proves_clause: each request is refused without clearing anything
    code_file: templates/scripts/worktree.py
