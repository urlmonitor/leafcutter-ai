id: BO-2300b-2
components:
  - build_orchestration
title: "An answer of the wrong shape is rejected and the question is re-asked"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a run is paused on a single-choice question whose valid answers are
    "approve", "edit", or "cancel",
  When an answer that does not match the declared shape is submitted
    (for example "high", which belongs to a priority-choice question),
  Then the answer is rejected and NOT applied,
  And the run stays paused on the same pending question,
  And the same question is presented again together with a statement of the
    valid answer shape.
depends_on: [BO-2300b]
assigned_agent: python-coder
estimated_complexity: S
doc_links:
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
    status: exists
  - path: docs/reference/workflow-authoring-contract.md
    relationship: describes
    status: exists
it_requirements:
  config_schema_fragment:
    type: object
    description: "Answer-validation result for a submitted answer against a declared question type."
    properties:
      accepted: {type: boolean}
      rejection_reason: {type: [string, "null"]}
      represented_question: {type: object, description: "the same pending question, with its valid answer shape restated"}
    required: [accepted]
  reference_file_path: "templates/workflows-js/plan-feature.js"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir ."
  constraints:
    - "A well-formed answer that does not satisfy the pending question's declared type must be rejected and not applied; the run stays paused on the same pending question and re-presents it together with its valid answer shape."
    - "Rejection must not advance the run and must not mutate committed prior stages."
    - "Reuse the single shared type/answer-shape validator established by BO-2300b-1; do not fork a second validator."
    - "E2 top-level-body form (ADR-017); deployed/template parity via build.py (ADR-001)."
delivers_to: null
expects_from:
  ac_id: BO-2300b-1
  contract: "The declared question type and its valid answer shape (allowed option set), against which a submitted answer is validated and, on mismatch, rejected and re-prompted."
