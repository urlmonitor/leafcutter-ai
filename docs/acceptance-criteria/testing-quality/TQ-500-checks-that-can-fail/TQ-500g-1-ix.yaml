assigned_agent: python-coder
estimated_complexity: L
delivers_to:
- agent: python-coder
  ac_id: TQ-500g-1-i
  contract: 'Alterations manifest (JSON), written to <git-dir>/leafcutter/work/<work-key>/alterations.json:
    {work_key: str, entries: [{name: str (the must_catch string verbatim), status: ''prepared''|''could_not_prepare'',
    reason: str|null (one line; required when could_not_prepare), files: [{path: str (repo-relative POSIX),
    altered_copy: str (absolute path of the full altered file, outside the working tree)}], diff: str
    (unified diff against the code as written, shown next to the name)}]}. There is one entry per named
    wrong version other than the fix-undone aliases. Nothing is ever omitted silently, and there are no
    outcome claims.'
- agent: python-coder
  ac_id: TQ-500g-1-v
  contract: 'Owed list (list step, user decision 2026-10-14): python scripts/build_orchestration/wrong_version_writer.py
    list --ac-ids <ids> --ac-root <path> --test-root <path> (the same values as the runner). It prints exactly
    one JSON object on stdout: {owed: [{name: str (the must_catch string verbatim, never an alias), files:
    [str (repo-relative POSIX source paths in scope for that name; never a test file; order of first declaration)]}],
    error: str|null}. Each owed name appears once, in the order the runner''s declared-scope reader yields
    it. A requirement id with no declared wrong version contributes nothing, and that is not an error.
    Exit 0 when the list was printed (also when owed is []); exit 1 when the AC store or test root cannot
    be read, or on an internal error, with owed [] and error set. Listing writes nothing anywhere. The route
    passes owed to agent test-breaker unchanged as its wrong_versions input ({name, files} per entry, TQ-500g-1-iv),
    and runs the list immediately before the dispatch, never from a cached copy.'
- agent: python-coder
  ac_id: TQ-500g-1-v
  contract: 'Writer CLI (write step): python scripts/build_orchestration/wrong_version_writer.py write --work-key
    <key> --reply <path, or - for stdin> --ac-ids <ids> --ac-root <path> --test-root <path> (the last three
    take the same values as the runner and as the list step). It prints exactly one JSON object: {written:
    bool, manifest_path: str|null (absolute <git-dir>/leafcutter/work/<work-key>/alterations.json; pass it
    to the runner''s --alterations), error: str|null, entries: [{name: str, status: ''prepared''|''could_not_prepare'',
    reason: str|null}], ignored_reply_names: [str], preparer_anomalies: [str]}. It exits 0 when the manifest
    was written, whatever the entries say. It exits 1 when the step stopped (unreadable reply, the failed
    shape, a reply for another work key, or an internal error), with written false, manifest_path null and
    no manifest on disk. The route passes no scope to the write step; the writer derives each name''s in-scope
    files itself.'
- agent: python-coder
  ac_id: TQ-500g-1-vi
  contract: Same list step and same writer CLI, with the same JSON, as for TQ-500g-1-v. The route sends
    the list's owed array to test-breaker unchanged.
- agent: llm-expert
  ac_id: TQ-500g-1-vii
  contract: Same list step and same writer CLI, with the same JSON, as for TQ-500g-1-v. The route sends
    the list's owed array to test-breaker unchanged.
expects_from:
- ac_id: TQ-500g-1-iv
  contract: 'Reply of agent test-breaker. Exactly one JSON value, either {work_key: str, entries: [{name:
    str (must_catch string verbatim), status: ''prepared''|''could_not_prepare'', reason: str|null, replacements:
    [{path: str (repo-relative POSIX), old: str, new: str}]}], anomalies: [str]} or {status: ''failed'',
    blocker_summary: str, anomalies: [str]}. The full rules are in TQ-500g-1-iv delivers_to.'
- ac_id: TQ-500g-1-i
  contract: The runner's shared helpers in scripts/build_orchestration/_wvr_scope.py (_safe_rel, is_test_path,
    the alias constant) and its declared-scope reader for the owed names. All are reused, never forked.
    The reader is extended in place to also yield each owed name's in-scope files (it_requirements, "Per-name
    scope"), so the runner, the list step and the write step share one reading of the test entries.
it_requirements:
- 'Placement (decision 2a). A new public sibling CLI, scripts/build_orchestration/wrong_version_writer.py
  (no leading underscore, its own CLI entry), not a prepare subcommand on wrong_version_runner.py. The
  runner''s flag-based CLI and its one JSON verdict are already used by the routes and the TQ-200d-1-i
  eval, and subcommands would change how that entry parses its arguments. Preparing and judging also stay
  separate steps, as the BA split them. The writer CLI has two steps, list and write (a new CLI, so steps
  here change no existing entry). The entry module holds only argument parsing, git-dir resolution
  and the JSON output. The logic lives in private siblings (for example _wvw_list.py and _wvw_prepare.py). Every new or
  changed Python file stays at or under 400 counted lines (scripts/commit_guardian/_file_size_ratchet.py).
  Today wrong_version_runner.py is at 258 and _wvr_scope.py at 211.'
- 'Reuse, never fork. Use _wvr_scope''s _safe_rel (path acceptance), is_test_path (the runner''s test-file
  rule, TQ-500g-1-i) and its alias constant (''revert the fix'' / ''the fix undone'', trimmed and case-folded).
  Use the declared-scope reader the runner uses to find the owed names, and the runner''s per-work-folder
  helper if it has one. If a helper lacks something the writer needs, for example telling "outside the
  repository" apart from "inside the version-control folder", extend it in _wvr_scope in place, without
  changing the runner''s behaviour, and never copy it. If a lint rule refuses importing an underscore name
  across modules, add a public alias in _wvr_scope rather than a copy.'
- 'Per-name scope (user decision 2026-10-14). The test_spec item schema in config/ac_store_schema.json has
  NO field today that puts a file in scope for a wrong version: its item properties are name, target_dir,
  framework, type, angle, must_catch, surface_invoked, description, covers and requires_db, with additionalProperties
  false, and the AC-level declared_files is per AC, not per name. This AC therefore adds one optional test_spec
  item field, in_scope_files: a non-empty list of repo-relative POSIX paths (each with at least one non-whitespace
  character), meaning "the files a wrong version named in this entry''s must_catch may alter". Add it to
  the test_spec item in config/ac_store_schema.json and describe it in docs/reference/ac-schema.md; the
  gate that refuses unknown test_spec keys today (validate_ac_schema.py, run by the check-ac-schema hook)
  must accept it and still refuse every other unknown key. generate_ticket_from_ac.py does not copy it onto
  the ticket descriptor; if it ever does, config/test_requirements.schema.json gains the same property
  in the same change. A name''s in-scope files are the union of in_scope_files over every in-scope test
  entry of the given ids whose must_catch carries that exact name, in order of first declaration, duplicates
  dropped, minus every path is_test_path counts as a test file (a test''s own file is never listed, even
  when an entry names it). An owed name with no in_scope_files on any of its entries has files [], so every
  replacement for it is refused as out of scope (fail closed; scope is never inferred from changed files,
  declared_files or the reply).'
- 'List step (user decision 2026-10-14). CLI: wrong_version_writer.py list --ac-ids <ids> --ac-root <path>
  --test-root <path>, the same values the runner takes. stdout: exactly one JSON object {owed: [{name, files:
  [...]}], error: str|null}, fixed key order, the shape in the delivers_to entry for TQ-500g-1-v. Names
  come from the runner''s declared-scope reader (covers-tagged entries carrying must_catch), minus the aliases,
  each exactly once, verbatim, in the reader''s order; files come from the per-name scope rule above. A
  requirement id with no declared wrong version contributes nothing and is not an error. Exit 0 when the
  list was printed, including owed []; exit 1 when the AC store or test root cannot be read, or on an internal
  error, still printing the shape with owed [] and error set. Progress logging goes to stderr only. Listing
  reads the AC store only and writes nothing: no work folder, no file in the working tree. It finishes
  within 2 seconds for up to 50 requirement ids.'
- 'One reading for list, write and runner. The list step and the write step call the same function for the
  owed names and their in-scope files, and that function is built on the runner''s declared-scope reader
  in _wvr_scope (or wherever the runner''s reader lives), extended in place. For the same ids, AC store and
  test root, the list''s names, the manifest''s names and the names the runner holds the tests to are identical
  sets. The write step never takes scope from the route, from the list''s output, or from the reply.'
- 'Inputs and output of the write step (decision 2b). wrong_version_writer.py write with the flags --work-key; --reply <path of the file holding the agent''s raw
  reply text, or - for stdin>; --ac-ids, --ac-root and --test-root, which take the same values as the runner
  (--test-root is the working-tree root). The owed names and their in-scope files are DERIVED, never passed in. The writer reads
  them from the AC test entries through the same declared-scope reader the runner uses (covers-tagged tests
  whose test_spec entry carries must_catch), minus the aliases. Why: the owed set must be exactly the set
  the runner later holds the tests to. One reader means the writer and the runner cannot disagree, a route
  bug cannot shrink the set, and the reply never defines it. Output: one JSON object on stdout, the shape
  in the delivers_to entries for the routes. The manifest path it prints is what the runner''s --alterations
  takes. Exit 0 when the manifest was written, whatever its entries say; exit 1 when the step stopped. An
  internal error still prints the shape, with written false. Progress logging goes to stderr only. With
  nothing owed, it writes a manifest with entries [] and exits 0; a missing or unreadable reply is then
  no error.'
- 'Name matching (decision 2c; the BA''s open points 1 and 2). A reply name matches an owed name only when
  the two strings are identical. A reply name that differs in case, spacing or anything else is unowed.
  Unowed names and alias names in the reply get no manifest entry and are listed under ignored_reply_names
  on stdout. An owed name the reply does not answer becomes could_not_prepare with the reason "no alteration
  returned". An owed name answered by more than one reply entry becomes could_not_prepare with the reason
  "more than one alteration returned", even when the answers agree; one is never picked. The manifest holds
  each owed name exactly once, spelled as the test entries spell it, in the order the declared-scope reader
  yields them.'
- 'Replacements (decision 2d; the BA''s open point 3). Each name starts from the code as written, never from
  another name''s result. Within one name, replacements on the same file apply in reply order, each against
  the result of the one before. Each old must be non-empty and occur exactly once in that current text,
  counting overlapping occurrences, so the sequence settles overlaps and no separate rule is needed. All
  or nothing per name: if any replacement of the name is refused, on any file, the name is could_not_prepare
  and no altered copy is written for any of its files. The one-line reason names the first refused replacement
  in reply order. Wording: "old text found 3 times in refresh_config.py", "old text not found in refresh_config.py",
  "tests/test_refresh_config.py is a test file", "../shared/refresh_config.py is outside the repository",
  ".git/hooks/pre-commit is inside the version-control folder", "settings.py is not in scope for \"refresh
  from the settings file\"" (the name quoted verbatim), "<path> not found", "<path> is not UTF-8 text".
  Path checks run in this order: path acceptance (outside the repository, inside the version-control folder),
  then test file, then in scope for this name, so a test file is always reported as a test file. A file
  in scope for another name, or an ordinary in-repository source file, is still out of scope for this
  name. Paths are checked before any file is read. A replacement whose new equals its old is still recorded
  prepared; the runner reports it as not_applied (TQ-500g-1-ii).'
- 'Line endings and bytes (decision 2e; the BA''s open point 4). Read each file as bytes and decode it as
  strict UTF-8. A leading BOM stays part of the text and is written back. A file counts as CRLF when it
  contains at least one CRLF, every LF in it is part of a CRLF, and it has no lone CR. For a CRLF file:
  convert the file text, old and new each from CRLF to LF, match and replace on the LF text, then turn
  every LF of the result back into CRLF. Because the file was uniformly CRLF, every byte outside the replaced
  text comes back unchanged, and an LF old (as the Read tool shows it) matches a CRLF checkout. Every other
  file (LF only, mixed, or without newlines) is matched raw, old against the text as it is, with nothing
  normalised. In a mixed file, an old that does not match raw is "old text not found", never a guess.
  Copies are written as bytes, never through text-mode newline translation.'
- 'Diff. The writer computes the diff from the code as written and the altered copy; it never takes one
  from the reply. Unified format: --- a/<path> and +++ b/<path> headers, 3 lines of context, and the name''s
  files in reply order joined into one string. A CRLF file is diffed in its LF form, so the diff reads
  the same on every checkout. A could_not_prepare entry has files [] and diff "".'
- 'Stale and unreadable (decision 2f). The writer''s first filesystem action removes any alterations.json
  and copies folder that an earlier preparation of the same work left in the work folder. That happens
  before the reply is read. The reply is unreadable when it is empty, is not one JSON object (for example
  cut off part-way), matches neither the success shape (work_key plus an entries list) nor the failed shape,
  or carries a work_key other than --work-key. Unreadable stops the step with the error "the preparer''s
  reply could not be read: <detail>". The failed shape stops it with "the preparer reported failure: <blocker_summary>".
  Both exit 1 and write no manifest, so no earlier manifest remains to be read in its place. The manifest
  is written last, after every copy: first to a temporary file in the work folder, then renamed over alterations.json
  in one step. A crash never leaves a partial manifest. A malformed entry inside a readable reply does
  not stop the step; that name becomes could_not_prepare "malformed reply entry: <field>". Malformed means
  a status outside the two values, a prepared entry with no replacement, or a replacement that lacks path,
  old or new or holds a non-string.'
- 'Claims and anomalies (decision 2g). anomalies is accepted (absent, or a list of strings). It is never
  copied into the manifest and appears only as preparer_anomalies on stdout, for the route''s log. Every
  other reply key is ignored and never copied: a diff, a caught or would_catch claim, a test name. Manifest
  entries are built only from the writer''s own values: the owed name, status, reason, files and the computed
  diff. A could_not_prepare reason is copied word for word. A missing or empty reason becomes "no reason
  given", and newlines in it become spaces so it stays one line.'
- 'Gate-file location (decision 2h). The work folder is <git-dir>/leafcutter/work/<work-key>/. git-dir comes
  from git rev-parse --absolute-git-dir run in --test-root, or from the runner''s work-folder helper if
  it has one; there is never a second path rule. The folder holds alterations.json and a copies/ folder
  with one subfolder per prepared name, mirroring the repo-relative paths. The work key must be one plain
  path segment (no separator, no ..), or the step stops. No git stash, no commit, and no write anywhere
  in the working tree: git status --porcelain and git stash list are identical before and after.'
- Deterministic and idempotent. The same reply, owed names and code as written give a byte-identical manifest
  and identical copies on a re-run. JSON key order is fixed, entries follow the owed order, and nothing
  time-dependent is written.
- 'Scope of reading. Read only the files named in the replacements, plus the AC store through the scope
  reader; never scan the repository. One preparation of up to 50 owed names finishes within 5 seconds
  on a typical work.'
- 'Out-of-scope refusal (the BA''s open point 5, reversed by the user on 2026-10-14; reply case R9). A replacement
  in any file that is not in the name''s in-scope files is refused, exactly like a test file: the name is
  could_not_prepare with the reason above, and no altered copy is written for any of its files (all or
  nothing per name). The in-scope files are those the per-name scope rule derives; there is no second scope
  input and no exemption by path or by name.'
- 'Route wiring is not tested here. The clause "the route sends this list to the preparer unchanged" is
  proven by the route ACs TQ-500g-1-v, -vi and -vii (their contracts in delivers_to). This AC proves only
  what the list step prints.'
test_spec:
- name: test_r1_prepared_copy_is_code_as_written_but_the_one_replacement
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: integration
  angle: criterion
  description: R1 is recorded prepared under its owed name with one altered copy of refresh_config.py under
    <git-dir>/leafcutter/work/<work-key>/. The copy equals the as-written bytes except that "if refresh_due
    and retry_due" reads "if refresh_due".
  must_catch:
  - altered copy re-serialised, with whitespace, quotes or the final newline changed
  - replacement applied to the working-tree file instead of a copy
- name: test_r1_diff_is_computed_and_reply_diff_ignored
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: integration
  angle: discrimination
  description: R1's manifest diff equals a unified diff of the as-written file against the altered copy.
    A deliberately wrong diff carried in the reply appears nowhere in the manifest.
  must_catch:
  - the reply's own diff copied into the manifest
- name: test_r2_r3_ambiguous_or_missing_old_text_is_could_not_prepare
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: integration
  angle: boundary
  description: R2 ("retry_due", found 3 times) and R3 ("max_retries = 3", absent) are could_not_prepare,
    with reasons naming refresh_config.py and saying found 3 times or not found. No copy exists for either.
  must_catch:
  - the first of several matches replaced
  - missing old text skipped and the entry recorded prepared
- name: test_r4_r5_r6_refused_paths_leave_no_copy_at_all
  target_dir: unit_tests/build_orchestration/
  framework: pytest
  type: integration
