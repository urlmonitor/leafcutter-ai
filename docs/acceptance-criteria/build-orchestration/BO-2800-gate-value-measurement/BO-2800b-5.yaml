notes: |
  Satisfies the reference-doc entries of BOTH BO-2800a and BO-2800b's
  documentation_triggers. The mined record and the defect record are one record and its
  extension, not two records, so they are documented in one place — BO-2800a-5 was deleted
  and its field list folded in here. Documenting them separately would have produced two
  field lists for one structure, kept in step by hand.

  Suggested assignee at enrichment time: documentation-expert.

  The deterministic-check promotion clause is the highest-value downstream USE of the
  counts and is stated here as a documented benefit. It is NOT a gate-retirement rule.
  Note that the retirement rules this tree originally deferred to BO-2500d-1..4 do not in
  fact exist — see the BO-2800 notes. This document must therefore not point a reader at
  them as though they were written; it documents the figures, and where the decision rules
  should eventually live is recorded in BO-2800's notes.
