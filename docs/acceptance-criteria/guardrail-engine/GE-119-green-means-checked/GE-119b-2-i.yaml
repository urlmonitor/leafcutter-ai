it_requirements:
  - "THE BASELINE IS AN ARTIFACT, captured by EXECUTION before the first line of GE-119b-2 is written, and stored so the after-run is diffed against it mechanically. Record the commit SHA of the pre-sweep tree alongside it. A baseline recorded after the change, or reconstructed from the check sources, proves nothing — that is the criterion's own coverage note and it is the single way this AC is most likely to be faked."
  - "CAPTURE IT WITH THE GE-119c-1 HARNESS, not with an ad-hoc script written by the agent performing the migration. An implementer's own before/after apparatus is the failure mode GE-119c-2 exists to prevent, and this AC has the same exposure at smaller scale."
  - "THE FIXTURE MUST PROVOKE A REAL VIOLATION FOR EVERY CHECK in hooks_manifest.hooks[] (54 entries today, 48 judgment + 6 transform). A clean fixture makes every check agree trivially — including a check that has silently stopped running altogether. This fixture is SHARED WITH GE-119b-4: build it once and own it in one place; two fixtures will diverge and the family-wide claims will stop meaning the same thing."
  - "The third clause is the load-bearing one: no check that previously reported a violation now reports clean. Assert PER CHECK BY ID, never in aggregate — an aggregate pass rate hides exactly one check going quiet, which is the consolidation bug this AC guards against."
  - "Transform-tier hooks (6 today) mutate files. Run each baseline and each after-run from an identical fixture state so one check's mutation cannot change a later check's input; otherwise the diff reports order effects as regressions."
  - "SCOPE OF PERMITTED DIFFERENCE: only working copies in which resolution previously FAILED. Any main-checkout difference is a regression, not an improvement, and fails this AC."
  - "Capture the baseline against the DEPLOYED copies (.leafcutter/scripts/commit_guardian/), because that is what pre-commit actually runs. A baseline taken against templates/ measures a layout no commit uses (ADR-001)."
test_spec:
  - name: test_ge119b2i_main_checkout_verdicts_match_recorded_baseline
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Every check executed in the main checkout after adoption produces the verdict recorded in the pre-adoption baseline, compared per check id."
  - name: test_ge119b2i_no_check_loses_prerequisite_resolution
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "No check that previously located its prerequisites now fails to locate them."
  - name: test_ge119b2i_no_check_downgrades_violation_to_clean
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "No check that previously reported a violation against the provoking fixture now reports clean — asserted per check id, not in aggregate."
  - name: test_ge119b2i_differences_confined_to_previously_failing_copies
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The only before/after differences observed are in working copies where resolution previously failed."
test_rationale: "A consolidation bug that makes a check stop finding things is invisible against a clean fixture, so the fixture must provoke a real violation for every check in the manifest. And the baseline is only evidence if it was captured by execution BEFORE the sweep — a post-hoc baseline reconstructed from the sources would agree with the change by construction. Both properties are procedural, so they are stated as requirements on how the test is produced, not only on what it asserts."
