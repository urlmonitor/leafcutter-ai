    relevance: >-
      The whole of this record's origin, and the source of its shape. "Not a flaky run
      and not a code defect — a structural impossibility": the check consults state the
      run has not yet reached, so red-then-green inside one workspace is impossible for
      that class of work and retrying cannot help. Observed once, diagnosed causally —
      the same checks returned 9/9 green once the change was taken up. Its fix
      direction (1), "let the lane detect this rather than the human", is the direction
      this record is written to; its warning that the class is unmarked and will recur
      is why the record exists at all.
