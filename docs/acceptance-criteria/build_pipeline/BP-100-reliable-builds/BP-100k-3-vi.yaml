notes: |
  THIS IS THE ONE RECORD IN THE RETROFIT WITHOUT A COVERING TEST, on purpose.
  None of the five tests in test_drift_exempt_recorded_key.py puts an
  exemption entry on a missing or unreadable recorded output. On reading, the
  shipped code already behaves as this record requires, because the lookup sits
  only in the hash-mismatch branch. Nothing stops a refactor from moving it up
  to wherever the recorded key is first resolved. That is the most plausible way
  for "excuse this file's drift" to quietly become "excuse anything about this
  file", and it would let an exemption hide the very deletion BP-100n-1 exists
  to report.

  assigned_agent is test-writer because no production change is expected.
  Only the missing test is. If that test goes red on the current gate, the
  claim in the doc_link relevance above is wrong and the fix goes to
  python-coder. covered_by stays empty until the test exists, so the record
  does not claim coverage it lacks.

  The "emptied registry gives identical counts" clause guards against a vacuous
  pass. A gate that miscounted missing outputs could still pass the first half
  as long as it never printed them as exemptions. Comparing against a run with
  no registry ties the result to the registry specifically.
