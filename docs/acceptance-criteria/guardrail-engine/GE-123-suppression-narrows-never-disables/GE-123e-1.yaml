notes: |
  PROMISE 1 OF GE-123e (refusal on every route, same verdict for people and agents).

  THE THREE ROUTES ARE THE CRITERION, not three examples of it. Today the person
  path (an inline message) and the agent path (a message file passed the way the
  shared commit step passes it, which is a verbatim-cleanup commit by file) reach
  the check by different routes. They only agree by accident. A test that drives
  one route proves nothing about the other two.

  THE THIRD ARM IS UNASKED-FOR AND LOAD-BEARING. Without it, "refuse every id-less
  heading in the touched ticket file" satisfies the first two arms. That would
  refuse every edit to a ticket written before the feedback-id epoch (the sign-off
  skill's backward-compatibility paragraph says those tickets legitimately carry
  none). The unit judged is a heading the commit ADDS. Whether deleting a
  feedback-id line from an existing heading should be refused is NOT decided here
  and is flagged to the person. It is a widening the L1 did not ask for.

  CONSUMED, NOT CHANGED: the sign-off heading grammar and the rule for where the
  feedback-id line must sit relative to its heading. The examples put the id on the
  line directly under the heading, which satisfies every placement the check
  accepts today. The value-shape check on the id (INF-500d-3) is out of scope. Any
  non-blank value passes here.

  TEST-EVIDENCE RULE (for the IT PO; non-negotiable). Every scenario is verified
  through REAL git commit calls in a scratch repository with the hook installed.
  Use both an inline -m message and a message file passed the way the shared commit
  step passes it, and drive the shared commit step itself for the agent route. A
  test that writes the repository's last-commit-message file by hand, or sets the
  environment variables the check reads in place of making a commit, is NOT
  evidence. That is the exact mistake the existing tests for this check make
  (test-angles failure catalogue, EPIC-ComputedQualityGates FP-7). Assert the
  outcome on the branch (did the tip move) as well as the refusal text.

  INHERITED: the component's fail-open-on-internal-error convention and GE-120's
  "a check that cannot run says so" both apply. Neither licenses a quiet pass.

  IT PO RESOLUTION (2026-11-16, gate decision 3). The open question above is now
  settled: deleting a feedback-id line from an existing heading is OUT of scope for
  GE-123e. It is tracked as KI-CG-20261116-removing-a-feedback-id-line-is-not-caught
  and recorded as a fence in it_requirements. The unit judged stays "a heading the
  commit adds".
