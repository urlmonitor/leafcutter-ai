it_requirements:
  - "THE STAGED SET. Enumerate with `git diff --cached --name-only --diff-filter=ACMR -z` (added, copied, modified, renamed; deletions excluded; a rename is judged at its new path), NUL-separated so paths with spaces or newlines survive. Gitlinks (mode 160000) are not files and are skipped. Only entries that a declared step's paths cover AND ruff's own include/exclude admits (decided by ruff with --force-exclude, not by a hook-side extension list) are inspected."
  - "THE CONTENT IS THE INDEX BLOB, NEVER THE WORKING-TREE FILE. Read each blob through git plumbing (`git show :<path>`, or `git cat-file --batch` for many) and feed it to ruff on stdin with `--stdin-filename <repo-relative path>`, with ruff's cwd set to the subject root, so ruff resolves configuration, per-file-ignores and --force-exclude against the real path while judging the staged bytes. Do NOT check out the index into a temporary directory: ruff's hierarchical config discovery and relative exclude patterns would then resolve against the temporary tree instead of the project."
  - "HONOUR THE TEMPORARY INDEX. `git commit -- <paths>`, `git commit -a` and `git commit --only` run hooks against a TEMPORARY index named by the GIT_INDEX_FILE environment variable. All git calls must inherit the hook's environment unchanged and go through git commands: never read .git/index directly, never strip GIT_* variables from child processes. Otherwise the hook judges content that is not the content being committed -- and `git commit -- <paths>` is the documented way commits are made into a dirty shared tree in this workspace."
  - "WHOLE FILE. Every finding in a staged blob counts toward the verdict, whichever lines the change touched. Never filter findings by diff hunks: CI judges whole files."
  - "THE 'PREDATES THIS CHANGE' LABEL IS DERIVED FROM HEAD, NOT FROM HUNKS. Lint `HEAD:<path>` (same step arguments, same --stdin-filename) when the path exists in HEAD. A finding is labelled as predating the change when the same rule code fires in the HEAD version on a line whose whitespace-stripped text is identical (multiset match, so two identical lines are not both credited by one HEAD occurrence). A new file has no predating findings. Hunk-based labelling is wrong in a direction that matters: removing the only use of a variable at line 90 creates a NEW F841 at untouched line 40, which hunk logic would mislabel as pre-existing. The label NEVER changes the verdict. The refusal text for a labelled finding must state that it predates this change, that it is in a file this commit modifies, and that CI's required check rejects the file whichever change introduced it."
  - "ONLY STAGED FILES ARE INSPECTED, AND THE OUTPUT SAYS WHICH. Untracked and unstaged files are never passed to ruff in staged mode. The output names the count and the repo-relative paths actually inspected, so the 'exactly the one staged file' arm is observable."
  - "A PARTIALLY STAGED RUFF CONFIGURATION CANNOT GIVE CI'S VERDICT. Ruff reads its configuration from disk, not from the index. If any ruff configuration file that governs an inspected file (ruff.toml, .ruff.toml, or pyproject.toml carrying [tool.ruff], at the subject root or in an ancestor directory of the inspected file within the subject root) has working-tree content different from its index content, report could_not_check naming that file and telling the author to stage or stash its unstaged edits; do not lint under the working-copy configuration and call it CI's verdict. leafcutter-lint.json needs no such rule: _lint_scope reads it from the index (BP-1300e-1-i)."
  - "PERFORMANCE BUDGET. Under 3 seconds wall clock for 20 staged in-scope files on the CI runner, including the HEAD-comparison pass. At most two ruff invocations per inspected file per declared step (index blob, HEAD blob); batching across files is allowed only if the findings set equals per-file application, proven by the same fixture tests."
  - "CROSS-FILE RULE ASSUMPTION. The per-file unit equals CI's verdict only while no selected rule depends on another file. No such rule is selected today. Detecting one automatically is out of scope; the assumption is recorded for BP-1300e-4's reference doc and must not be silently dropped from it."
  - "ERROR-HANDLING POLICY (CLAUDE.md Rules 1-4): a failing `git diff --cached` or `git show` is could_not_check (BP-1300e-1-iii scenario 5), never an empty staged set; catch OSError / subprocess.SubprocessError specifically and log at WARNING."
