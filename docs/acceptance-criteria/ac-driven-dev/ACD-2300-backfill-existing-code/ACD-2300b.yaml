title: "Tests you already wrote get credited to what they prove"
component: ac-driven-dev
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  A test that already proves a requirement stops being invisible proof.

  Tests that exist but are attached to nothing are matched to the requirements
  they actually prove, and each match is put to you before it is recorded. A link
  that is recorded is a link that was verified. A test whose subject cannot be
  established stays unattached and is reported as unattached — it is never
  attached to a requirement invented to receive it.
