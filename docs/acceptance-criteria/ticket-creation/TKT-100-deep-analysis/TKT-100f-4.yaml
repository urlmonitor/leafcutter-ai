title: "BA v3 produces L3 sub-ACs for non-trivial edge cases of L2 scenarios"
component: ticket-creation
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given an L2 AC "TKT-100a-1" describes the happy-path behavior
    "BA v3 reads AC store for the target component",
  When the BA v3 identifies edge cases that are distinct from the happy path
    (e.g., AC store directory exists but contains zero .yaml files,
    or a .yaml file has malformed YAML syntax),
  Then it produces L3 sub-ACs with IDs following the pattern
    TKT-100a-1-i, TKT-100a-1-ii (Roman numeral suffix),
  And each L3 AC has depends_on containing its parent L2 AC ID,
  And each L3 AC criteria field uses Given/When/Then Gherkin
    with a specific error scenario and expected system response,
  And L3 ACs are produced only when the edge case would cause
    different system behavior from the L2 happy path
    (not for trivial input variations).
