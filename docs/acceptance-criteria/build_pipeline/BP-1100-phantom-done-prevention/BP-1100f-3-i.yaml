notes: |
  L3 edge for BP-1100f-3: the check must be surface-partitioned, not all-or-nothing —
  a work item that legitimately spans two technologies is flagged only on the portion
  its declared implementer/checker cannot act on, so it does not produce a false pass
  (whole item accepted) nor a false full-reject (Python portion wrongly flagged).
