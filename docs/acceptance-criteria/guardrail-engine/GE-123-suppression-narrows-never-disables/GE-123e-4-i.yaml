delivers_to:
  agent: documentation-expert
  contract: "The could-not-check disposition for GE-123e-5 to document. When the incoming side cannot be read while an operation is concluded, the check exits 0, prints a stderr WARNING naming each affected ticket file (its sign-offs were not verified, and the incoming side could not be read), and emits 'RESULT: could_not_check' on stdout. Ordinary commits are never opened by this path."
expects_from:
