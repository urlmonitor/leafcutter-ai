id: UXP-590-1
title: "Each step of the product-truth generation flow links the ACs that specify that step"
component: ux-prototyping
components:
  - ux_prototyping
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given the "How product-truth links are generated and kept truthful" flow has five steps
    map, derive, invert, backref and validate,
  And the step links are shifted by one step today
    (derive -> [UXP-511, UXP-700e-2-ii], invert -> [UXP-512], backref -> [UXP-513]),
  When the flow's authored step links are corrected,
  Then the map step links exactly [UXP-510],
  And the derive step links exactly [UXP-510, UXP-700e-2-ii],
  And the invert step links exactly [UXP-511],
  And the backref step links exactly [UXP-512],
  And the validate step links exactly [UXP-513, UXP-514, UXP-300-1, UXP-300-2, UXP-300-3],
  And each of UXP-510, UXP-511, UXP-512, UXP-513 and UXP-514 is linked from at least one
    step of this flow,
  And no step label, description, order or acceptance scenario of the flow is changed.
depends_on:
  - UXP-590
doc_links:
- path: docs/product-truth/flows/leafcutter/generate-product-truth.flow.json
  relationship: implements
  status: exists
- path: docs/acceptance-criteria/ux-prototyping/UXP-500-product-truth-generation/UXP-510.yaml
  relationship: context
  status: exists
  relevance: UXP-510 specifies both the map and the derive steps; UXP-511..514 each specify one step
- path: docs/architecture/components/ux-prototyping.md
  relationship: describes
  status: exists
- path: docs/architecture/adrs/ADR-023-product-truth-flow-first-upstream-layer.md
  relationship: describes
  status: exists
- path: docs/product-truth/README.md
  relationship: describes
  status: exists
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
- Only steps[*].implements of the five steps of docs/product-truth/flows/leafcutter/generate-product-truth.flow.json
  may change; every other key of the flow (step ids, labels, descriptions, order, io_contracts, acceptance_scenarios,
  entities, provenance, readiness, status, version) must be byte-identical before and after
- The edit must keep the file's existing JSON formatting (indentation, key order, trailing newline) so
  that git diff of the flow shows only lines inside the five implements arrays
- Each implements list must hold exactly the AC ids the criteria name for that step, in the order the
  criteria list them
- Derived data (docs/product-truth/index.json, each AC's product_truth block, each step's impl_status)
  must not be hand-edited here; it is regenerated by UXP-590-2 in the same change set
- The corrected flow must still pass validate_product_truth.py's flow-schema and io_contracts checks (flow.schema.json),
  with no new error introduced by this edit
delivers_to:
  agent: python-coder
  contract: File docs/product-truth/flows/leafcutter/generate-product-truth.flow.json whose steps map/derive/invert/backref/validate
    carry implements = [UXP-510] / [UXP-510, UXP-700e-2-ii] / [UXP-511] / [UXP-512] / [UXP-513, UXP-514,
    UXP-300-1, UXP-300-2, UXP-300-3] (JSON arrays of AC-id strings, non-null); consumed by UXP-590-2 (regeneration)
    and by the UXP-590-3 step-claim check
expects_from: null
notes: |
  UXP-513 (generator idempotency and check-only mode) is placed on the validate step: its
  check-only mode is the CI gate that fails on stale derived data, which is the validate
  step's outcome ("Fail on derived-vs-source drift"). The alternative - a sixth step for
  the check-only gate - was not taken because it would change the flow's narrative and
  ordering, which this correction deliberately leaves untouched.
origin_agent: business-analyst
created: 2026-10-14
amended_by: []
superseded_by: null
covered_by: []
implemented_by: []
change_target: config
risk_surface: internal
test_required: true
test_spec:
- name: test_each_generation_flow_step_links_exactly_its_specifying_acs
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: real_artifact
  description: Reads the live generation flow and asserts the five steps' implements lists equal [UXP-510],
    [UXP-510, UXP-700e-2-ii], [UXP-511], [UXP-512] and [UXP-513, UXP-514, UXP-300-1, UXP-300-2, UXP-300-3]
    exactly (no extras, no omissions).
- name: test_every_generation_ac_510_to_514_is_linked_from_some_step
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: real_artifact
  description: Asserts each of UXP-510..UXP-514 appears in the implements list of at least one step of
    the live generation flow.
- name: test_flow_correction_leaves_step_ids_labels_descriptions_order_and_scenarios_unchanged
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: discrimination
  description: Compares the live flow, with implements masked out, against a pinned copy of the pre-correction
    flow (fixture) and asserts step ids, order, labels, descriptions and acceptance_scenarios are identical.
  must_catch:
  - rename or reorder a step while correcting its links
  - edit a step description or acceptance scenario alongside the link fix
- name: test_corrected_generation_flow_passes_the_flow_schema_check
  target_dir: unit_tests/product_truth/
  framework: unittest
  type: integration
  angle: seam
  description: Runs the validator's flow-schema / io_contracts check over the corrected flow and asserts
    it reports no error for this flow.
