id: TQ-200b-3
components:
  - testing_quality
title: "An eval runs whenever any file in its dependency closure changes"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given each agent declares the dependency closure of its eval — its prompt
    template, the shared skills / instructions it loads, the schemas its output
    must satisfy, the oracle artifacts its golden cases derive from, the eval set
    itself, and the harness / scorer code — as a set of trigger globs,
  When a change (a diff between two revisions) is evaluated for which evals to run,
  Then an eval is STALE (must run) when ANY file in its dependency closure changed,
  And the affected-eval set is computed by intersecting the change's file list
    against each agent's declared trigger globs,
  And only the affected evals run (so unaffected agents are not re-scored — cost),
  And EVERY affected eval always runs (no affected agent is dropped — completeness),
  And what ran versus what was skipped-as-unaffected is logged, so an eval is never
    silently truncated out of the run.
depends_on:
