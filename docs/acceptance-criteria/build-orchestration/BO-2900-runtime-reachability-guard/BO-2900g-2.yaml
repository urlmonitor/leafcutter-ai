title: "Work that changes something real declares it, because the work already says so in its own words"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a leaf piece of work whose stated behaviour asserts a durable, observable
      change — a file that exists and can be read back afterwards, a record that
      is persisted, a command that leaves the system in a different state,
    And a second leaf piece of work whose stated behaviour asserts only a value
      handed back to its caller,
  When each work record is authored,
  Then the first carries a declaration that it changes something real and the
    second does not,
    And the first's declaration is obtained from the behaviour that work already
      states, not supplied as a separate opinion by whoever wrote the record,
    And the second does not receive the declaration merely because it sits in the
      same feature, was authored in the same pass, or is named similarly,
    And a reader given only the two stated behaviours can predict which record
      carries the declaration and which does not.
