change_target: code
risk_surface: contract_boundary
notes: RQ5; CODER-01, CODER-05. Conditional supported inspection contract only; complete code graph, universal source
  ingestion and automated field-flow analysis remain outside this draft scope. Draft behavioral specification under
  the user-requested BA pass; technical enrichment and proof remain pending.
it_requirements:
- Retain immutable repository/source SHA provenance, bounded registered read-only queries and existing kernel authorization,
  budgets and retries. This contract adds no arbitrary Cypher, new network endpoint, source-write permission or
  automatic query activation.
- The named fields below describe the planned observable semantic contract; preserve compatible existing envelope
  fields and version any incompatible extension. Required unavailable values stay explicit and are never inferred
  from an evaluation oracle.
- This contract consumes approved source evidence already available to research; it does not add universal code
  indexing, call-graph extraction or a new source-inspection permission.
- Implementation references establish only declared links. Field-flow stages need attributable inspected content
  and revision; explanations distinguish inspected source facts from inference and unknown stages.
- A runtime-cause claim additionally requires diagnostics for the matching request/attempt and relevant revision.
  Static source findings alone cannot establish why another run failed.
- If approved inspection is unavailable or missing evidence prevents a stage, return a bounded explanation and explicit
  gap without asserting that the implementation or dependency does not exist.
test_required: true
test_rationale: Planned criterion and public reachability proof includes real producer/consumer boundaries and named
  plausible wrong outcomes. No descriptor is executed coverage; no provider, database or deployment result is asserted.
test_spec:
- name: test_public_implementation_explanation_is_bounded_by_supplied_source
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Provide approved source excerpts with locators and revision through public research; assert only
    evidenced field-flow stages are explained and interpretation remains labeled.
  must_catch:
  - Inventing unseen stages or claiming a complete code graph from a few snippets.
  covers:
  - KM-500f-4
  requires_db: false
  surface_invoked: Existing kernel research run/resume entry point using retrieve.repository
- name: test_implementation_reference_alone_does_not_establish_dataflow
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Provide implemented_by file references without inspected content and assert the references are reported
    while the field-flow question remains unresolved.
  must_catch:
  - Treating a filename reference as evidence of a callable path or transformation.
  covers:
  - KM-500f-4
  requires_db: false
- name: test_static_explanation_and_runtime_diagnostics_keep_attempt_identity
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: seam
  description: Combine real source-evidence and diagnostic consumers with matching and mismatched request/revision
    identities; permit causal statements only for attributable matching diagnostics.
  must_catch:
  - Using a source excerpt or an unrelated failure trace as proof of the current runtime cause.
  covers:
  - KM-500f-4
  requires_db: false
- name: test_missing_inspection_support_never_expands_access
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: Make source inspection unsupported or unauthorized and assert an explicit capability/evidence gap
    with no inspection invocation and no claim that absent graph links prove absent code.
  must_catch:
  - Launching an unauthorized source read or declaring no dependency because the graph has no code mapping.
  covers:
  - KM-500f-4
  requires_db: false
