roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a workspace "ws-a" holding nothing that has not reached the shared project,
    which during its life brought each of these into being outside its own folder:
    - its own local line of work (branch) in the shared project,
    - its registration entry in the shared project,
    - a stored look-up of the requirements store kept in the shared project's version
      control data on its behalf,
    - a Python environment for it in the user's shared Poetry environments folder,
    - a web development server cache for it outside its folder,
  When "ws-a" is cleared through the one shared clearing door,
  Then none of the five items exists afterwards,
  And the door's answer lists each of the five items it removed, by kind and location,
    with the space each one occupied in bytes,
  And the answer's total space freed equals the sum of the folder's size and the five
    items' sizes as measured immediately before the clearing.
