  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a reader deciding where a new piece of coordination belongs,
  When they open the component diagram for the delivery arrangement,
  Then it shows the coordinating layer and the specialists as distinct elements, marks the
    coordinating layer as the only one that dispatches and awaits, marks specialists as
    elements that do work and return a result, and shows no dispatch arrow between two
    specialists.

  Given the diagram,
  When it is compared against the dispatch record of a real drive,
  Then every dispatch arrow it shows corresponds to a dispatch that occurred, and every
    dispatch that occurred corresponds to an arrow it shows.
