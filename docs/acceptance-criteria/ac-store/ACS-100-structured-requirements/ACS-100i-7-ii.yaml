id: ACS-100i-7-ii
components:
  - ac_store
title: "The package-surface spec validator walks a directory it is given and never reports success for a run that examined no records"
component: ac-store
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a directory holding, inside a nested feature folder, one record that
    declares a package surface with a complete implementation spec and one that
    declares a package surface with implementation requirements written as a
    list of strings,
  When that directory is passed to the package-surface spec validator
    (scripts/ac_store/validate_ac.py),
  Then the directory is walked recursively, the second record is refused by
    file path, and the run exits non-zero.

  And given an empty directory, or a directory whose only YAML file is
    `index.yaml` (the component registry, not an acceptance criterion),
  When it is passed to the same validator,
  Then the run exits non-zero and says that no records were examined.

  And given a single valid record passed by file path,
  When it is validated,
  Then the run exits 0, exactly as before.

  And the bug symptom ("No YAML files to validate." printed with exit 0 after
    checking nothing) must not occur.
depends_on: [ACS-100i-7]
