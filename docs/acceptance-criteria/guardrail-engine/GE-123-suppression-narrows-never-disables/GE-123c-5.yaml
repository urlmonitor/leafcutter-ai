notes: |
  THIS IS THE RECORD OF A DESIGN DECISION, not only a list. The second criterion
  matters more than the first: the choice to act on the shape of an entry and not
  on whether it fired is the kind of deliberate omission that reads as an oversight
  to whoever touches this next, and gets "fixed" into a warning that fires on most
  entries on most commits.

  SCOPE, AGAINST THE SIBLING HOW-TO. This document answers "is this form accepted";
  the how-to answers "how do I write one". Same subject, different question, and
  the parent L1 triggered both. Keep the grammar and the rejection list here and
  the task guidance there rather than duplicating either — two copies of a grammar
  drift.

  THE THIRD CRITERION IS A PARITY REQUIREMENT and is worth stating because this
  same document was last amended by the change that closed the neighbouring
  malformed-entry hole; the section it describes is the one this L1 changes again.

  IT-PO TECHNICAL ENRICHMENT, 2026-08-18. The reference document identified is
  templates/skills/security-scanner/SKILL.md, whose existing suppression section
  documents the accepted format and the path-matching modes and was last amended by
  the neighbouring malformed-entry change — exactly the section this AC extends.
  Unlike the sibling how-to, this file SHIPS through build.py, so the canonical
  source is the templates/ copy and the deployed copies are build outputs. The
  two-directional parity arm is a review obligation here; a mechanical parity check
  would be a python-coder AC and is raised as a recommended follow-up rather than
  smuggled into a documentation AC.
