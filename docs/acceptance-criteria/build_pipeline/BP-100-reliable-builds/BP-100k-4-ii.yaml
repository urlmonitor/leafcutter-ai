notes: "Filed from KI-CG-20260831-0713, severity blocker, reproduced twice against synthetic consumer repositories: a fresh TypeScript consumer gives exit 1 with RESULT total=52 unreachable=27 exempt=9, and a fully-onboarded consumer fares no better. Confirmed live on origin/main on 2026-09-01: the gate's manifest entry is always_run true, pass_filenames false, files null, so it runs on every commit in every adopter and its verdict is part of the commit outcome. Two registered conditions select Python files, so an adopter tracking no Python cannot commit at all. This contradicts the phase_1 outcome in the roadmap — 'installs into any project' — directly. The pairing matters: BP-100n-4 widens what the same check looks at, and narrowing this verdict without that widening would make the gate quieter while leaving it blind. Both directions are being built together for that reason."
