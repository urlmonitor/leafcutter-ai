criteria: |
  Given a commit fails a gating hook whose tier is the mechanical tier (no judgment required),
  When the auto-fix path selects a fixer,
  Then it uses the existing generic light-model route rather than re-dispatching the originating coder,
  And it does NOT read or require a context_capsule for that fixer,
  And after any fixer (mechanical or originator re-dispatch) returns, the commit is retried
    exactly once,
  And if the retried commit still fails, the failure is surfaced rather than retried a second time.
