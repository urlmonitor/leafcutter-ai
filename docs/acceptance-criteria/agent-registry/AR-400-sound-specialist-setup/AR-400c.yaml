documentation_rationale: "Removes noise and stale guidance; no new user-facing surface. The authoring reference change is owned by AR-300c's existing reference-doc trigger."
notes: |
  WHY "DEAD GRANT" IS A REAL FAULT AND "NOT MENTIONED" IS NOT. A grant the
  instructions never mention is normal after AR-300 -- the grant arrives on its
  own. A grant the specialist has no use for is a different thing: it is
  delivered, costs attention, and implies work the specialist does not do.
  The two were indistinguishable in today's report. The dead grants named here
  are the two the user identified; the BA decides whether a check should find
  future ones or whether the cleanup is one-off.

  THE ALTERNATIVE THE USER REJECTED. Keeping the obsolete direction as a
  quieter message was not chosen -- "instead of printing noise". A message
  nobody acts on is the defect, however quietly it is printed.

  THE SAME-CLASS NEIGHBOUR LEFT OUT. The 14 "a human should verify" closure
  warnings (rebuild log lines 280-294) are excluded by the design and are not
  covered by this L1. See AR-400 notes.

  2026-10-21: test contract (test_spec, test_rationale) added for composite
  closure, at the user's decision ("Add parent tests, then close"), so this
  parent can be proven done by covering tests of its own. Criteria, readiness
  and every requirement-defining field are unchanged.
