notes: |
  WHY AN L3. The parent is met in a clean environment. A settings allow rule, or one "don't ask
  again" click, would turn the person's gate into a one-time gate for every later commit -- the
  mutation "leave the decision to the ordinary permission system" passes the parent and fails
  here.

  The "Or" clause is deliberate: whether an ask decision overrides an allow rule is harness
  behaviour, settled by observation. Fail-closed is the fallback, never pass-through.

  FOR THE IT PO. The probe's second scenario (GE-129a-1) should include one attempt with an allow
  rule present, so this record's branch is known before build.

  declares_side_effect: false -- the Then clauses assert a prompt or a refusal.
