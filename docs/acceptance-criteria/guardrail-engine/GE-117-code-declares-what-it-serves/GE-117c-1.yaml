notes: |
  Owns the HAPPY-PATH, MISSING-PATH, and the DIFF-ONLY LEGACY guarantee for the new
  decision-history entry -> AC surface (GE-117c). This EXTENDS the existing tail-tag
  mechanism (which already carries the ticket ref) with an AC dimension — it does NOT
  re-specify the ticket tag (out of scope per the PO note). Third scenario pins the
  core of the tail-tag convention: only entries ADDED in the diff are checked;
  pre-existing entries are never retrofitted. The inheritance rule (resolution #2)
  is specified in GE-117c-1-i. Verdict shape is the shared spine consumed by
  GE-117d/e.
