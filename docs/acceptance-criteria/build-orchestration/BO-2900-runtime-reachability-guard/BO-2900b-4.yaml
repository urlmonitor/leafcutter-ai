title: "How-to: keep capabilities and their automation connected in both directions"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the capability-to-automation connection checks are in place,
  When an author who is adding, renaming or removing an operator-facing capability
    consults the project's task-oriented documentation,
  Then a single how-to guide covers both directions of the connection,
    And it states the workflow for adding a capability — register it and wire its
      automation invocation in the same change — and shows the refusal that appears
      when only one of the two is done,
    And it states what counts as an automation invocation, and warns that naming a
      capability in a comment or an operator-facing message does not connect it,
    And it names the recorded exemption as the route for a capability that is
      deliberately not driven by automation, and links to the exemption's own
      documentation instead of restating it,
    And it is reachable from the documentation that describes the command surface it
      governs.
