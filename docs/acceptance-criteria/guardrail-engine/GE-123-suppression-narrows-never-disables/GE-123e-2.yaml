notes: |
  PROMISE 2 OF GE-123e, first half: this commit's OWN message. The carry-over half
  (a message left by an EARLIER commit) is the L3 child GE-123e-2-i. It is the arm
  that actually catches the defect, and it is split out so it cannot be dropped as
  a variant of this one.

  THE PROMISE IS ABOUT THE WORD, WHATEVER ROUTE CARRIES IT (GE-123e notes). The
  direction chosen is to REMOVE the bypass entirely: no token, and no message
  source read for it. Nobody asked for a narrower bypass, so none is specified. An
  implementation that keeps reading a message source but "fixes" which file it
  reads still fails this criterion, because the token must change nothing on any
  route.

  WHY THE SECOND ARM. A check that refuses any commit whose message carries the
  token satisfies every refusal arm above. The token-plus-real-id arm rules that
  out.

  THE TWO ENVIRONMENT ARMS ARE NOT SIMULATION. They reproduce the reported
  workaround exactly: a real commit by file, run with the environment variable
  naming the message file. The assertion is that real commit's outcome. That is
  different from what FP-7 records, where a test set the variable and called the
  check directly, in place of a commit, and asserted a skip. Setting either
  variable WITHOUT making a real commit is not evidence for any arm here.

  REGRESSION LOCK TO RETIRE (for the IT PO). The existing test module for this check
  writes the repository's last-commit-message file by hand and asserts a skip. It
  locks the defect in, and it must be removed or inverted in the same change, not
  left beside the new tests. A green run with both present means one of them is
  wrong.

  OUT OF SCOPE: the structural-change bypass token on other checks (GE-113b-*; its
  own stale-message defect is KI-CG-20261116); the commit framework's per-check skip
  setting, which is not a word in a message; the feedback-id value-shape check.

  TEST-EVIDENCE RULE (for the IT PO; non-negotiable). Every scenario is verified
  through REAL git commit calls in a scratch repository with the hook installed.
  Use both an inline -m message and a message file passed the way the shared commit
  step passes it, and drive the shared commit step itself for the agent route.
  Hand-writing the repository's last-commit-message file, or setting the
  environment variables the check reads in place of making a commit, is NOT
  evidence (test-angles failure catalogue, EPIC-ComputedQualityGates FP-7).
