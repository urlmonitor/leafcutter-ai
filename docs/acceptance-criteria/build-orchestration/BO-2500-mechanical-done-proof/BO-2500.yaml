title: "Trust that a feature is done because a test proves it — not because a sign-off says so"
component: build-orchestration
level: L0
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Completion is proven by real passing tests — never by a green rubber-stamp.

  Too often work is marked "done" by an approval step while the actual behaviour
  is missing — the review passes green and the feature is not there. This goal
  makes completion mechanical and impossible to fake: every requirement is tied
  to a real test that must genuinely pass, that test must exercise the real thing
  rather than a convenient stand-in, and an automatic check that cannot be skipped
  has the final word. Because proof is mechanical, the review steps whose only
  power was to hand out approval can be retired without losing any rigor. A review
  may still stand between finished work and delivery — it can hold work back when
  something looks wrong — but it can never be the thing that decides a feature is
  done. Holding work back and declaring it finished are different powers, and only
  the machine has the second one. The result is that when the system says a feature
  is done, you can believe it.
  This is the trust guarantee the fast lane (BO-2400) depends on.
