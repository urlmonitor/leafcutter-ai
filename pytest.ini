[pytest]
addopts = --continue-on-collection-errors --strict-markers -p scripts.ac_store.pytest_ac_enforcement -p scripts.suite_performance.pytest_shared_reference_layout
markers =
    shared_layout_reader: declares a test a read-only consumer of the shared_reference_layout fixture (TQ-600a-5); routed to the one shared deployed package root.
    shared_layout_mutator: declares a test must have its own private, unshared copy of the deployed package from the shared_reference_layout fixture (TQ-600a-5); never routed to the shared reference layout root.
pythonpath = .
