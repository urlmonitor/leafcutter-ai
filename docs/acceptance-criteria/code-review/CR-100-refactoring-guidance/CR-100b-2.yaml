assigned_agent: llm-expert
estimated_complexity: S
package_surface: true
it_requirements:
  config_schema_fragment:
    type: object
    required:
      - id
      - name
      - portable
      - domain
      - template_path
      - dependencies
      - description
      - components
    properties:
      id:
        const: complexity-reduction
      portable:
        const: true
      domain:
        type: "null"
      template_path:
        const: leafcutter/templates/skills/complexity-reduction/
      components:
        type: array
        minItems: 1
  reference_file_path: config/skill_registry.json
  n_location_rule: '1'
  required_skills:
    - llm-expert
    - add-skill-to-package
  post_write_commands:
    - python scripts/build.py --validate-only
    - python scripts/build.py --target-dir .
  constraints:
    - >-
      Package surface, written together as add-skill-to-package describes: the
      template templates/skills/complexity-reduction/SKILL.md and one new entry
      in config/skill_registry.json. No other registry entry changes. The root
      README.md already lists complexity-reduction under code-quality skills, so
      it needs no edit.
    - >-
      The template is portable. Checker paths use the {{config.output_root}}
      placeholder, which the build renders, and never a path from one project.
      Examples use neutral names and no single project's domain terms.
    - >-
      No limit is hard-coded as a fact. The shipped defaults (complexity 15,
      sql_complexity 75) may appear only as "shipped default", next to the
      commit_guardian.json keys that set them.
    - >-
      Every fenced python or sql example carries a first-line marker,
      "# measured: name=score[, name=score]" or "-- measured: score", which
      the test suite recomputes with the shipped calculators.
    - >-
      The skill says plainly that check-complexity ships but is not in the
      default hook manifest, and that check-sql-complexity is.
test_required: true
test_spec:
  - name: test_every_measured_example_matches_the_shipped_checker
    target_dir: unit_tests/
    framework: pytest
    type: unit
    angle: criterion
    description: "Parse every fenced python/sql block in templates/skills/complexity-reduction/SKILL.md, read its measured marker, recompute the score with calculate_complexities / calculate_sql_complexity from templates/scripts/commit_guardian, and assert equality. Every fenced python/sql block must carry a marker."
    must_catch:
      - "an example whose labelled score is not what the checker computes (the source skill claimed guard clauses lower the score; they do not)"
      - "an example added without a measured label"
  - name: test_shipped_defaults_quoted_by_the_skill_match_commit_guardian_json
    target_dir: unit_tests/
    framework: pytest
    type: unit
    angle: discrimination
    description: "The shipped-default limits in the skill's limits table equal complexity.max_score and sql_complexity.max_score in templates/scripts/commit_guardian/commit_guardian.json, and the table names both keys."
    must_catch:
      - "the skill quoting a SQL limit of 65 while the package ships 75"
  - name: test_skill_never_recommends_removing_observability
    target_dir: unit_tests/
    framework: pytest
    type: unit
    angle: failure
    description: "The skill carries the never-remove-observability rule, and no technique heading offers removing logging or RAISE NOTICE."
  - name: test_registry_entry_points_at_the_template
    target_dir: unit_tests/
    framework: pytest
    type: unit
    angle: seam
    description: "config/skill_registry.json has exactly one entry with id complexity-reduction, portable true, domain null, a template_path that resolves to templates/skills/complexity-reduction/, and non-empty components; the template's frontmatter name is complexity-reduction."
  - name: test_every_refusal_naming_the_skill_names_a_packaged_skill
    target_dir: unit_tests/
    framework: pytest
    type: unit
    angle: reachability
    description: "Every commit_guardian checker source that tells the author to use the complexity-reduction skill names a skill that has both a template directory and a registry entry."
  - name: test_installed_project_has_the_skill_and_the_files_its_commands_use
    target_dir: unit_tests/
    framework: pytest
    type: integration
    angle: deployed
    description: "In the deployed reference layout, .claude/skills/complexity-reduction/SKILL.md exists with frontmatter name complexity-reduction and no unrendered {{...}} placeholder. Every commit_guardian directory its commands put on sys.path exists there and holds check_complexity.py, check_sql_complexity.py, config.py and commit_guardian.json."
test_rationale: |
  The skill is an instruction document, so the tests pin what can be checked
  without a model: the numbers it states, the files it points at, and whether it
  is installed. The measured-marker test is the strongest one. The skill this
  record ports from another project stated several scores the checker does not
  produce: guard clauses "saving" points, a comprehension `if` "costing" one, and
  `IF ... IS NULL` "saving" two where it saves one. A test that recomputes every
  label keeps that kind of error from coming back.
