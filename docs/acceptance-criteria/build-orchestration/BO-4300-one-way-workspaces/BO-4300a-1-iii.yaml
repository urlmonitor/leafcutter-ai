id: BO-4300a-1-iii
title: "A workspace is cloned from the main copy on this machine, never fetched whole from the shared project"
component: build-orchestration
components:
  - worktree_manager
  - build_orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
change_target: code
risk_surface: safety
criteria: |
  Given a shared project whose main line is at commit S,
  And a main copy of it on this machine whose own main line is behind S and
    which holds a line of work "feature/x" that exists only on this machine,
  When a workspace for "alpha" is requested from the workspace maker,
  Then the workspace's history is shared on disk with the main copy rather than
    copied over the network,
  And the workspace's shared project is the main copy's shared project, not the
    main copy itself,
  And the ready answer states that the line of work for "alpha" was newly
    started at S,
  And a request for the work whose line is "feature/x" starts that line afresh
    at S rather than resuming the copy that exists only on this machine,
  And a workspace brought over from the old way by the cut-over is made the same
    way as the workspace for "alpha".
depends_on: [BO-4300a-1, BO-4300d-4]
