title: "Design and built page speak one vocabulary, so a one-sided criterion is a reported difference and never a dropped one"
component: ux-prototyping
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given a criterion id pinned in a rendered mockup
  When the id is resolved
  Then it is resolved by the same acceptance-criterion resolver the built side
    uses, so both sides are speaking one vocabulary rather than two that
    happen to look alike
  And an id that resolves to no acceptance criterion is reported as an
    unresolvable pin naming the file and the value, distinct from the design
    having no pin at all

  Given a criterion pinned in the design and absent from the built page
  When the two sides are compared
  Then that id is reported as a difference in the in-design-not-on-page
    direction

  Given a criterion pinned on the built page and absent from the design
  When the two sides are compared
  Then that id is reported as a difference in the on-page-not-in-design
    direction, kept separate from the first
  And no id present on either side is omitted from the comparison result

  Given a criterion pinned in an approved design
  When that criterion's coverage is assessed
  Then the pin counts only as evidence that the design shows the criterion
  And it never counts as evidence that the criterion works, is tested, or is
    done, and never appears in a coverage figure
