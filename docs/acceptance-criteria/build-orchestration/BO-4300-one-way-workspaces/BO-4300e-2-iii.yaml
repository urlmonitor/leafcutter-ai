it_requirements:
- remove resolves the project (--repo-root, else the marker's project_root) and acts only on a path inside
  that project's landing place (BO-4300b-2; the same --landing-root override if one was used) whose marker
  names that project; anything else is NOT_FOUND, and nothing is deleted, fetched or pushed.
- Proof runs the DEPLOYED maker -- the copy an install delivers, resolved through the shared test locator
  delivered by BO-4300f-4 -- as a separate process against real temporary git repositories with a real
  bare hub. No mock of git, no import of the maker module, no grep of its source (CLAUDE.md 'Gate / Workflow
  ACs -- Verify Behaviorally, Not by Grep'); a test never falls back to the templates/ source copy.
- All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
  isolated global and system config; afterwards the developer's own repository's branches, registered
  worktrees and local git config are unchanged (BO-4300f-4-i, F14, KI-TQ-012).
test_required: true
test_spec:
- name: test_remove_outside_this_projects_landing_place_is_not_found_and_changes_nothing
  target_dir: unit_tests/build_orchestration/
  framework: unittest
  type: behavioral
  angle: boundary
  description: remove from shop for blog's alpha and for the stray folder holding a copy of shop's marker
    is each refused NOT_FOUND; blog's alpha and the stray folder are byte-identical before and after, no
    fetch or push reached either hub, and remove of shop's own alpha from shop still answers ok.
test_rationale: Every assertion is made on what the deployed maker actually did to real repositories --
  its one JSON answer, its exit code, and the state of the workspaces and hubs afterwards. A direct-import
  unit test would pass while the deployed copy is stale or mis-deployed (F13).
