notes: |
  Wave 2. Defect 3 of the brief: the waiver links the record to nothing. The
  enforces tag is the link from the check's side; the record's named check is the
  link from the record's side. Both are required, so neither side can claim the
  other alone.

  Per user scope change 1 (PO gate 2026-10-25): relate to BO-3500c and its
  children by expects_from; no second check vocabulary.
