id: BP-600d-4-i
components:
  - build_pipeline
title: "Quick-fix opens a PR when none exists, only on explicit user confirmation"
component: build-pipeline
level: L3
status: active
readiness: reviewed
priority: medium
work_status: done
criteria: |
  Given the fix commit and the changelog commit have completed and the workflow
    reaches the close phase,
  When no open PR exists for the branch the workflow is on,
  Then the workflow first pushes the commits to origin, and halts with recovery
    instructions if that push fails — nothing further is attempted unpushed,
  And before running any PR command it switches the GitHub CLI to the non-EMU
    account, on every run, without assuming an earlier session already did so,
  And it then shows the user the proposed PR title and body and asks whether to
    open it,
  And it creates the PR only after the user explicitly agrees — opening a PR is
    an outward-facing action and is never automatic,
  And if the user declines, the workflow stops with the work pushed and no PR
    created, and reports the branch comparison URL instead,
  And when it does create the PR it supplies the body from a file rather than
    inline on the command line, so that an AC id or other bare identifier in the
    body is not interpreted by the shell and published corrupted into the PR,
  And it never merges the PR — merging remains the user's decision.
