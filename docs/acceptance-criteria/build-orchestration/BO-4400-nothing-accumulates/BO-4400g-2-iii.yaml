notes: |
  Unattended means nobody is there to notice a stopped program. BO-4300e-2-ii allows a
  single clearing request to stop a program and clear; the pass must not take that branch.

  "quiet-1" (second scenario) is its own fixture, not the "idle-1" of BO-4400g-2 and
  BO-4400g-3; the two names were the same until 2026-11-16.
