criteria: |
  The spec has a home in the ticket, and the dispatch just points there.

  When a ticket is generated from an AC that carries implementation requirements,
  the generator writes a structured Implementation Notes section into the ticket
  body carrying that spec verbatim -- config-schema fragment, the resolved
  reference-file path, the N-location rule, required skills, and post-write
  commands. The deterministic dispatch stays thin: it hands the agent a pointer and
  an explicit instruction to read the ticket first, rather than inlining (and
  drifting) the spec into the prompt. The spec now travels on one owning channel
  instead of being re-typed off-channel.
