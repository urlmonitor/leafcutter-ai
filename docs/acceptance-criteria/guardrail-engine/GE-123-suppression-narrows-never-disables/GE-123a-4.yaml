notes: |
  THIS DISCHARGES THE PARENT L1's documentation_triggers OF [reference-doc]. GE-123a
  declares that trigger and its other three children are all code ACs assigned to
  python-coder, so until this record existed the trigger had no owner. The
  obligation was folded into GE-123a-1's it_requirements as a stopgap — that entry
  asks the coder to update the skill body in the same change. That stopgap is worth
  keeping as a reminder, but it is not a discharge: it makes the documentation a
  side-effect of a code AC whose sign-off is a passing test suite, so nothing fails
  if the sentence is never written. This record is what actually discharges the
  trigger.

  WHY THE REFERENCE IS PART OF THE FEATURE AND NOT A FOLLOW-UP. The detection-rules
  section introduces the rules as applied in order and says nothing about any rule
  ending the scan. A reader today cannot tell from it that a name match stops the
  file being read, and after GE-123a-1 lands they will not be able to tell that it
  no longer does. Both readings are wrong in the same direction — the author
  believes the contents are being examined — and that belief is precisely the cost
  the measured collapse imposed.

  THE THIRD ARM IS A PARITY REQUIREMENT and is stated because this document is
  being changed by more than one AC in the same tree: GE-123c-5 extends its
  suppression grammar and GE-123b-5 amends its suppression-modes section. Three
  edits to one file in one feature is exactly the situation where a statement
  survives that no longer matches the code.

  SCOPE, AGAINST THE SIBLINGS. This record answers "is a name-matched file's
  content examined, and what will it be reported for". GE-123c-5 answers "is this
  suppression form accepted". GE-123b-5 answers "when is a suppression declined".
  Same document, three different questions; cross-reference rather than restate,
  because the shared grammar has exactly one home.
