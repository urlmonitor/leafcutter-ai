level: L1
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Marked a screen requirement done? Something on screen has to claim it.

  Before a change is accepted, every screen requirement recorded as finished is
  checked from the other direction: at least one part of the product says it is
  the thing that delivers it. A requirement that is complete on paper with
  nothing anywhere claiming to render it is reported as unfinished business
  rather than quietly counted as done. Being claimed is only half of finished —
  a requirement that something on screen points at, but that no test proves, is
  still not done, and passing this check never says otherwise.
