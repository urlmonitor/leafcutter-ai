it_requirements:
  - >-
    Do NOT make quick-fix open a PR unattended. The confirmation gate in the
    Close phase is deliberate and must survive this change untouched.
  - >-
    The not-opened state must be legible from the STRUCTURED result, not only
    from the prose message — a caller that reads the payload and never reads the
    message must still be able to tell an action is required of it.
  - >-
    The result must carry the branch and either the compare URL or the exact
    command that would open the PR, so the caller can act without re-deriving
    anything.
  - >-
    The already-a-PR-exists path and the push-failed status "blocked" path must
    be unchanged, and a run that DOES open a PR must still report cleanly as
    done.
  - >-
    Dual-surface rule: templates/workflows-js/quick-fix.js and
    templates/skills/quick-fix/SKILL.md are two surfaces of the same workflow.
    Either change both as a declared scope expansion, or change the JS and
    report the SKILL.md Phase 7.4 mirror as a required follow-up — never leave
    the two disagreeing silently.
test_spec:
