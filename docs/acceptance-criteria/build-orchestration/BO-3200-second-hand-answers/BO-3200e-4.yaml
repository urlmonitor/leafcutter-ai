it_requirements:
  - "AGENT CHOICE IS DELIBERATE: reference-author, the leaf author, not documentation-expert."
  - "THE PAGE'S ENTIRE CONTENT IS 'THREE ANSWERS, NOT TWO', stated as a definition an author reads BEFORE writing a check. The two-answer habit is not carelessness — fail-closed with a boolean genuinely has only two values, so an author reaching for the safe default has nowhere to put 'I could not look' and puts it in the failure bucket. Naming the third answer gives them somewhere to put it."
  - "THE PAGE MUST STATE ALL FOUR RULES the first criterion names: the three answers; that the third is required whenever the inspection did not happen FOR ANY REASON; that the third stops the work just as the second does; and that its advice describes restoring the inspection rather than changing the subject."
  - "IT MUST STATE EXPLICITLY THAT BOTH DIRECTIONS ARE REQUIRED and neither replaces the other. GE-120a-1 already guarantees that a failed inspection must not report a clean pass, and a reader who finds one of the two will reasonably assume the question is settled — which is how the missing direction stayed missing until KI-BO-018."
  - "EACH RULE MUST CARRY A CLAIM IDENTIFIER BOUND TO AN EXERCISED CHECK, using BO-3100d-1's pairing mechanism rather than inventing a second one, so the second scenario is enforced rather than intended."
  - "The page must name the actual outcome values a check emits, matching BO-3200e-1's vocabulary, so an author writing a new check uses the value the sweep and the runtime both recognise."
  - "Must satisfy the repository's existing doc front-matter and component-vocabulary rules unchanged."
