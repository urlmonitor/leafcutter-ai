id: GE-111c-1-i
readiness: approved
priority: high
title: "A pre-existing broken link in untouched source never blocks an unrelated commit"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-111-traceability-stays-honest/GE-111c.yaml"
criteria: |
  Given acceptance criterion AC-W has implemented_by entry "src/already-gone.py"
  And "src/already-gone.py" was deleted in an earlier commit, so the link is
    already broken in the repository before this commit
  And the current staged commit touches only "src/unrelated.py", which has no
    AC link pointing at it
  When the traceability reconciliation check runs at pre-commit time
  Then the check does not evaluate AC-W (its source is not staged in this commit)
  And the check produces no drift verdict
  And the commit is allowed to proceed despite the pre-existing broken AC-W link
