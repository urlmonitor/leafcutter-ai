notes: |
  An authorization is only as exact as the names put into it. If finalize filled it in from a
  default, a guess or an 'unknown' placeholder, BO-4300c-3 would be broken by another route. So
  when the workspace cannot be identified exactly, finalize sends no removal at all.

  USER DECISIONS 2026-10-25 (recorded by IT PO): F -- "the workspace lookup" in the criteria is
  the new step-7 maker locate (worktree.py locate, read-only, through shell-runner); only a
  definite ok answer whose marker.branch equals the expected branch builds the authorization,
  and every case in this record's criteria makes no removal dispatch.

