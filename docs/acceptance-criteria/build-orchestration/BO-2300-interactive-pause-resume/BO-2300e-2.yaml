id: BO-2300e-2
components:
  - build_orchestration
title: "Pause-store operations are dispatched to the agent chartered to run them, not to worktree-agent"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: done
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given plan-feature.js needs to perform one of the six pause-store operations
    against a run's paused_runs record -- peek-pause-record, read-pause-record,
    clear-pause-record, clear-pause-record-verify, pause-persist, or
    pause-persist-verify,
  When the workflow selects which agent to dispatch that operation to,
  Then the dispatch's agent type is command-step-runner, not worktree-agent,
  And the dispatch's prompt names the specific target workspace command-step-runner
    will run the command in,
  And command-step-runner accepts the dispatch and returns the underlying
    command's exit status, stdout, and stderr untouched, rather than declining
    it as outside its charter (the charter worktree-agent invokes to decline
    today: "I'm the worktree lifecycle agent, scoped to two actions: create and
    remove").
depends_on: [BO-2300e]
assigned_agent: python-coder
estimated_complexity: M
package_surface: false
