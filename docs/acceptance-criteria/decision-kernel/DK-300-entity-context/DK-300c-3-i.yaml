estimated_complexity: L
it_requirements:
  - "Entity and caller channels remain explicitly untrusted meaning-only data in every consuming judgment and host artifact; they never enter instruction/approval/evidence fields."
  - "Provider output is still checked by existing permission, output-contract and approval guards; recognized changes do not register new execution capabilities."
  - "Capability registration proves only declared configuration, not liveness, successful execution or verified AC satisfaction."
test_required: true
test_spec:
  - name: "test_hostile_definition_cannot_change_permissions_contract_or_approval"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "discrimination"
    description: "tests/kernel/entity_context/test_permissions.py::test_hostile_definition_cannot_change_permissions_contract_or_approval: Use instruction-like definitions and quoted caller examples with a recording provider; assert typed data placement, unchanged permissions/output contract, no approval and no new capability."
    must_catch: ["Merging entity meaning text into trusted instructions or evidence.","Treating a recognized approval claim as human approval."]
  - name: "test_meanings_and_registration_are_not_live_or_completion_evidence"
    target_dir: "tests/kernel/entity_context/"
    framework: "pytest"
    type: "integration"
    angle: "criterion"
    description: "tests/kernel/entity_context/test_permissions.py::test_meanings_and_registration_are_not_live_or_completion_evidence: Ask about runtime availability and AC fulfillment using only cards/registry claims; verify missing observations remain missing and no completion proof is fabricated."
test_rationale: "Exercise production public boundaries with real canonical-source fixtures and an injected recording classifier; assert observable outputs and side effects, not source strings. Capture red results before runtime implementation; no live provider is required."
