notes: |
  THIS AC ACCEPTS A LIE ON PURPOSE. Read the parent L1's adversarial note before
  changing a word of it.

  The promise-versus-claim check is trivially satisfiable by pasting a kind tag
  onto an existing happy-path test. That is ACCEPTED and is NOT a defect of this
  tree. What the check buys is that the gap between a promise and an artifact can
  no longer be left silently empty; the lie is caught downstream by BO-2900a's
  execution observer, which is the only mechanism that can catch it.

  DO NOT AUTHOR A SIBLING THAT TRIES TO DETECT THE PASTE. Any such AC needs to
  decide, from the test's text, whether the test does what it claims — which is
  exactly what BO-2900a-2 prohibits, on the grounds that a source scan inside a
  phantom-done guard is itself phantom-done. This L3 exists so that the
  prohibition is expressed as a falsifiable behaviour inside this tree rather
  than as a warning in a notes field that a later decomposer will not read.

  THE THIRD CLAUSE IS A MECHANISM CONSTRAINT AND IS DELIBERATELY WORDED THE SAME
  WAY BO-2900a-2 WORDS ITS PROHIBITION. It is testable in the same style: the
  outcome for the pasted-claim case must be byte-identical to the outcome for a
  genuine case, and must stay identical when the claiming test's body is replaced
  wholesale with an unrelated one carrying the same claim. No text-inspecting
  implementation can satisfy that.

  THE FOURTH CLAUSE GOVERNS THE WORDS, WHICH IS WHERE THE WIDENING WILL ACTUALLY
  HAPPEN. A check that reports "reachability verified" for a pasted tag has made
  a claim about execution from a comparison of two strings, and the next reader
  to build on that output will believe it. Report what was actually established:
  a promise, and a claim.

  IT-PO ENRICHMENT NOTE (2026-08-17). The accepted paste was NOT "fixed" during
  enrichment and no constraint narrows it. declares_side_effect is true for the
  same reason as on BP-1100g-4: the observable is user-facing commit-time output
  whose exact wording is load-bearing, which is precisely what a smoke test with
  a placeholder negative control is for.
