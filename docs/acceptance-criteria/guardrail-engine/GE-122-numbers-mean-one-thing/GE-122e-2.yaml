id: GE-122e-2
title: "Each work item that exists twice is reduced to the one copy that is right"
component: guardrail-engine
components:
  - commit_guardian
  - ticket_lifecycle
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the work-item collection holds five identifiers that each exist as a file in two
    lifecycle folders — four of them as a copy in the intake folder alongside a copy in the
    completed folder, and one as a copy in the intake folder alongside a copy in the active
    folder,
  When the repair is complete,
  Then each of those five identifiers exists as exactly one file,
  And the surviving file sits in the lifecycle folder that matches the lifecycle state declared
    in that work item's own content, so folder position and declared state agree,
  And where the two copies declared different states, the resolution taken and the reason are
    recorded on the surviving file, rather than one copy being deleted silently,
  And where the two copies differ in content beyond their declared state, the surviving file
    retains the content of whichever copy records the later work, so no completed work is
    discarded by the repair,
  And no work-item identifier anywhere in the collection is held by more than one lifecycle
    folder,
  And the five are exactly the five this record already enumerates, not a set re-derived at
    implementation time: an identifier the repair believes is twice-held but which is not among
    them is reported and left alone, and an enumerated identifier the repair cannot confirm is
    twice-held is reported and left alone,
  And every reference to any of the five identifiers resolves to the surviving file.

  Coverage note: covered by executing the work-item uniqueness pass over the repaired collection
  and asserting zero findings, plus asserting for each of the five that exactly one file exists
  and that its folder agrees with its declared state. Counting files alone does not cover it —
  deleting the correct copy also yields one file.
depends_on:
  - GE-122e
doc_links:
  - path: templates/hooks/ticket_frontmatter_guard.py
    relationship: context
    status: exists
    relevance: "Its _check_status_folder rule is the criterion for deciding which copy survives: the declared state and the folder must agree. Using the guard's own rule means the repaired collection passes the guard rather than merely looking tidy."
  - path: tickets/ticket_lifecycle.json
    relationship: context
    status: exists
    relevance: "The allowed-status-per-folder mapping that _check_status_folder reads. The survivor decision must be computed from this data rather than from an assumption about which folder is 'more final'."
  - path: docs/architecture/components/ticket-lifecycle.md
    relationship: describes
    status: exists
    relevance: "The lifecycle model and the declared-state-is-authoritative convention the survivor rule rests on."
  - path: docs/acceptance-criteria/guardrail-engine/GE-122-numbers-mean-one-thing/GE-122a-2.yaml
    relationship: context
    status: exists
    relevance: "The detection half. Its report supplies the folders and both declared states this repair chooses a survivor from, and its it_requirements record the identifier-rule question that decides whether the five is the whole set."
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The survivor is chosen by computing declared-state-versus-folder agreement from `tickets/ticket_lifecycle.json`, the same data `_check_status_folder` reads — not by a rule of thumb that the completed folder wins. Four of the five will very likely resolve to the completed copy, but that is an outcome to be arrived at per pair, not an assumption to implement; assuming it is precisely how the wrong copy gets deleted."
  - "THIS IS A DELETION AND IT IS NOT REVERSIBLE FROM THE STORE. Before deleting either copy, diff the two and record the diff on the surviving file. Two copies that have drifted may each hold something the other lacks — sign-off comments, a status history, a comment stream — and the point of the repair is that one identifier means one thing, not that half the record disappears."
  - "SCOPE IS THESE FIVE IDENTIFIERS AND NO OTHERS — measured 2026-08-17, listed here because an irreversible deletion must not act on a set re-derived at implementation time. Intake + completed: TICKET-20260603-ConfigDrivenBuildPaths, TICKET-20260603-FeedbackAnalysisPipeline, TICKET-20260604-PullRequestAgentProjectContext, TICKET-20260605-ContractShrinkingSelfExclusion. Intake + active: TICKET-20260629-BP-1200a-1-ii. If a fresh scan of the collection disagrees with this list in either direction, STOP and report the difference — do not repair the difference. The list, not the scan, is the scope."
  - "GE-122a-2's whole-collection pass will also surface `EPIC-MoveOnMainOnly`, which is held by BOTH `tickets/99_done/` and `tickets/99_rejected/` — one identifier in two TERMINAL folders that flatly disagree, with Master_Plan.md and four sub-items duplicated inside. It is not in the five and it is NOT repaired under this AC. Report it and stop; expanding scope silently is the mirror image of the re-expansion GE-122e-3 fails an implementer for."
  - "Sixteen loose `TICKET-*.md` files sit at `tickets/` root outside any lifecycle folder. They are not twice-held and are out of scope here; do not tidy them while in the area."
  - "ORDERING: this repair must land before the work-item stage of the uniqueness guard becomes blocking, or every commit is stopped by five pre-existing conditions the author did not create. GE-122e-3 is the check that the ordering worked."
  - "Use `git mv` / `git rm` so the deletions and moves are tracked; a ticket file removed with a plain filesystem delete loses the history that would let the decision be reviewed. Note that `templates/hooks/check_ticket_no_branch_move.py` blocks `git mv` of ticket files on non-main branches — it is currently registered nowhere, so it will not fire today, but if it is wired during this tree's work this repair collides with it. Perform the repair on a branch with that interaction understood, not discovered."
  - "Idempotency: re-running the repair over the repaired collection makes no further change."
test_spec:
  - name: test_each_of_the_five_identifiers_exists_exactly_once
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "After the repair, each of the five named identifiers is held by exactly one file in the whole work-item collection."
  - name: test_surviving_copy_folder_agrees_with_its_declared_state
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "For each of the five, the surviving file's lifecycle folder is the one ticket_lifecycle.json permits for the state declared in its own content — the assertion that distinguishes keeping the right copy from merely keeping one."
  - name: test_divergent_pair_records_the_resolution_and_reason
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Where the two copies declared different states, the surviving file carries the resolution taken and the reason, so no copy was deleted silently."
  - name: test_no_content_lost_from_the_deleted_copy
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "For any pair whose copies differed beyond their declared state, content present only in the deleted copy and recording later work is present on the survivor."
  - name: test_work_item_uniqueness_pass_reports_zero_findings
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "GE-122a-2's pass, run unmodified over the repaired collection, reports no identifier held by more than one lifecycle folder."
  - name: test_references_to_the_five_resolve_to_the_surviving_file
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Every reference to any of the five identifiers anywhere in the repository resolves to the surviving file and to no other."
  - name: test_repair_acts_only_on_the_enumerated_five
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "NEGATIVE CONTROL on the scope list: the set of work-item files the repair created, moved or deleted is a subset of the files holding the five enumerated identifiers — so an identifier a fresh scan believes is twice-held, but which is not on the list, is reported and left untouched rather than repaired."
  - name: test_out_of_scope_duplicates_are_untouched
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "EPIC-MoveOnMainOnly is still present in both tickets/99_done/ and tickets/99_rejected/, and the sixteen loose root tickets are unmoved — the repair stayed inside the five, exactly as GE-122e-3 requires of the unnumbered diagrams."
test_rationale: |
  Counting files is the obvious test and the coverage note rules it out, because deleting the
  correct copy also yields one file — so the load-bearing descriptor is the folder-versus-declared-state
  one, computed from ticket_lifecycle.json rather than from the assumption that the completed
  folder wins. The no-content-lost descriptor exists because this is an irreversible deletion of
  records that may each hold sign-off history the other lacks. The out-of-scope descriptor is the
  same shape as GE-122e-3's negative assertion about the unnumbered diagrams, applied to the
  duplicates this repair deliberately does not touch: an implementer who tidies EPIC-MoveOnMainOnly
  while in the area fails rather than quietly widening a scope the user set. The
  acts-only-on-the-enumerated-five descriptor is the general form of that: it fails a repair that
  substituted its own scan for the scope list, whichever extra identifier the scan happened to find.
