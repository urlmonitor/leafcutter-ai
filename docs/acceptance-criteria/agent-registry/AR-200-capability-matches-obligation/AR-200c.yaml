notes: |
  PLACEMENT, AND A FIT TENSION RECORDED RATHER THAN PAPERED OVER. This L1 was placed
  under AR-200 by the user's decision on 2026-09-16 (no new L0). The fit is good
  against the parent's FOLDER NAME and title -- capability matches obligation -- and
  imperfect against the parent's CRITERIA BODY, which is written narrowly about a
  specialist being equipped to RECORD A VERDICT. Declaring what a specialist may do is
  the precondition for checking that any such match holds, but it is not verdict
  recording. Flagged for the user rather than resolved here: either AR-200's criteria
  is broadened by an explicit amendment to cover declaration as well as equipment, or
  this record is re-homed. Do not quietly treat the fit as clean -- a later author
  reading AR-200's criteria alone will not predict this child.

  NOT A BACKFILL TICKET. The known issue is explicit that populating 58 records buys
  documentation and not behaviour, because absent and false already take the identical
  branch at the one live gate. The benefit here is that "not stated" stops being a
  state anything can misread. Whether that is achieved by populating every entry, or
  by changing what absence means, or by making readers distinguish undecided from
  decided-none, is a decision for the BA and the IT PO. The criteria above is
  deliberately silent on which, and must stay silent on it.

  WHY medium. On its own this changes no behaviour -- it is legibility. It earns its
  place because it is the precondition for enforcing anything: BO-3200f removes the
  need to ask a specialist for an errand, and BO-3200g makes a refusal legible, but
  neither stops a new errand being wired to a party that cannot run it. That
  enforcement cannot be written against a field that 58 of 60 agents leave unstated.

  DO NOT ABSORB: whether a given dispatch is wired to a chartered agent. That is
  enforcement, and it belongs under BO-3200a as an extension of BO-3200a-2's sweep
  from "every path that resolves a fact" to "every dispatch whose prompt runs a
  command". Recorded for the BA. This record is only about the declaration being
  complete enough to enforce against.

  SIBLINGS. AR-200a (a specialist told to record a verdict can record one) and
  AR-200b (a specialist told to use a tool is given it) are both about a specialist
  being EQUIPPED. This one is about the declaration being LEGIBLE. Three L1 slots
  remain free under AR-200 after this record.
