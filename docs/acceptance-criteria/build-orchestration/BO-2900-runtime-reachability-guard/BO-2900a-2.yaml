roadmap_phase: phase_1
criteria: |
  Given two proof-of-done tests for the same acceptance criterion, over a unit that
    exposes a runtime way in:
    test P, which invokes the way in with the action under proof and reaches the code
      under proof while it runs,
    and test Q, which imports the code under proof directly, and whose file also
      contains the name of the way in inside a comment, inside a docstring, and
      inside a helper function that is never called,
  When each test is evaluated for whether the proof reached the code through the way in,
  Then test P is judged to have reached it and test Q is judged not to have,
    And the judgement for each test is derived from what was entered while that test
      executed,
    And test Q receives the same judgement it would receive if every mention of the
      way in were deleted from its file, so the presence of the name in the text
      changes nothing.
