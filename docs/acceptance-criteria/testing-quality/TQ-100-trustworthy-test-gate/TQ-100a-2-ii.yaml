assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - >-
    THE ABORT IS MEASURED, NOT PREDICTED. On a repository WITHOUT the extension —
    which is what a fresh checkout produces — `git config --worktree` exits 128
    with "fatal: --worktree cannot be used with multiple working trees unless the
    config extension worktreeConfig is enabled". Reproduce that in the test
    rather than asserting the message from memory; the wording is git's and may
    be versioned.
  - >-
    THE TRAP IS THAT IT WORKS ON YOUR MACHINE. This clone already has
    `extensions.worktreeConfig` set to true, so an implementer following the
    register will see the worktree-scoped form succeed locally and conclude it is
    correct. The failure appears first in the required job, on someone else's
    pull request. State this in the register correction, not only here.
  - >-
    CORRECT THE REGISTER IN THE SAME CHANGE. This is a prose edit to
    docs/known-issues/testing-quality.md — remove the worktree-scoped write from
    remediation item 1 of the ~L840 occurrence, replace it with the environment-
    variable form, and note why the qualified form is not available on a fresh
    checkout. Small enough to belong in the implementer's commit; large enough
    that leaving it is how the next reader repeats the mistake. Do NOT
    renumber or merge the two duplicate KI-TQ-012 ids as part of this change —
    that is register hygiene, separately tracked, and conflating the two makes
    this diff unreviewable.
  - >-
    DO NOT WEAKEN THIS INTO "PREFER THE ENVIRONMENT FORM". A preference is
    advice; this is a refusal with a measured consequence attached. An
    implementation using the worktree-scoped write fails a required job on a
    checkout it will certainly encounter.
  - >-
    THE FOURTH CLAUSE IS THE CONTROL AND IS NOT OPTIONAL. Showing that the
    worktree-scoped form aborts proves only that one option is bad. Showing that
    the environment form succeeds ON THE SAME EXTENSION-LESS CHECKOUT is what
    establishes that the refusal has somewhere to go, rather than describing an
    unsolvable situation.
delivers_to: null
expects_from:
  ac_id: TQ-100a-2
  contract: >-
    The identity-supply mechanism whose acceptable shapes this AC bounds. It adds
    no new behaviour to TQ-100a-2; it rules one implementation of it out and
    corrects the written guidance that recommends that implementation.
test_spec:
  - name: test_tq100a_2_ii_worktree_scoped_write_aborts_on_a_checkout_without_the_extension
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: boundary
    surface_invoked: >-
      git config --worktree user.email ..., issued as a subprocess inside a
      linked worktree of a repository that has more than one working tree and no
      worktree-configuration extension set
    description: >-
      Build the extension-less multi-worktree condition a fresh checkout
      produces, issue the worktree-scoped write, and assert the invocation exits
      128 and that its error text names the worktree-configuration extension.
      Reproduce the condition rather than asserting the message from a fixture -
      the whole point is that the ambient repository has the extension enabled
      and would hide this.
  - name: test_tq100a_2_ii_the_environment_supplied_identity_succeeds_on_that_same_checkout
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      The control. On the identical extension-less multi-worktree repository, a
      commit whose identity comes from the inherited process environment succeeds
      and carries the intended author and committer. Without this the first
      descriptor establishes only that one option fails.
  - name: test_tq100a_2_ii_the_portability_suite_passes_on_an_extension_less_checkout
    target_dir: unit_tests/portability/
    framework: unittest
    type: integration
    angle: deployed
    surface_invoked: >-
      python -m pytest unit_tests/portability/ -q, run as a subprocess against a
      clone whose worktree-configuration extension is unset
    description: >-
      The end-to-end refusal, asserted behaviourally rather than by reading the
      source for a forbidden string. Under an implementation that uses the
      worktree-scoped write this run is red; under the environment-supplied one
      it is green. A test that greps the fixtures for "--worktree" passes on dead
      code and cannot tell the two apart.
  - name: test_tq100a_2_ii_the_register_no_longer_offers_the_aborting_form_as_a_remediation
    target_dir: unit_tests/portability/
    framework: unittest
    type: unit
    angle: real_artifact
    description: >-
      Read docs/known-issues/testing-quality.md as it is on disk and assert that
      neither write-up of this defect presents the worktree-scoped write as a
      remediation to apply. The deliverable here IS the document text, so reading
      the document is the direct assertion rather than a proxy for one. Scope the
      assertion to the remediation passages - the descriptive mention of what the
      broken call omits is accurate and must survive.
test_rationale: |
  The first two descriptors are a matched pair and neither is meaningful alone:
  one shows the register's recommendation aborts on the checkout CI creates, the
  other shows the accepted mechanism succeeds on that same checkout. Both must
  construct the extension-less multi-worktree condition themselves, because the
  repository they run in has the extension enabled and would silently make the
  refused form work.

  The third is deliberately behavioural. The obvious test here is a grep for
  "--worktree" across the fixtures, and it is the wrong test twice over: it
  passes on code that is never executed, and it fails on a legitimate mention in
  a comment. Running the suite on an extension-less clone distinguishes the two
  implementations by what they do.

  The fourth asserts over the document because the document is the deliverable.
  It is scoped to the remediation passages so that the accurate descriptive
  mention at the first write-up is not deleted by an over-broad assertion — the
  false-shortfall whose natural remedy is to weaken the check until it stops
  complaining.
