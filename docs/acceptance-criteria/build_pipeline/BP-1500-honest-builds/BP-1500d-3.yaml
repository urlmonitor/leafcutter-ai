it_requirements:
  - "THE PROCESS EXIT STATUS IS THE LOAD-BEARING SIGNAL, NOT THE PRINTED REPORT. Both must change. A loud, well-worded failure message accompanied by a successful exit status leaves every automated caller exactly where it is today, and is the single most likely way for this AC to be closed without being satisfied. The report clause and the outcome clause are separate in the criteria on purpose; neither substitutes for the other."
  - "NAME EVERY ENFORCEMENT POINT AT WHICH THE RECORD STEP'S OUTCOME IS SURFACED, AND STATE WHICH ONE ACTUALLY GATES THE EXIT STATUS. CORRECTED 2026-09-07 -- THE PRIOR COUNT WAS AN OVERSTATEMENT AND MUST NOT BE RE-DERIVED. It read: 'the outcome is surfaced three ways -- a warnings.warn, a _warn print, and an empty output_mappings section in the written manifest -- and NONE of them is load-bearing, because all three sit inside a handler that falls through to a successful build.' The outcome now reaches FOUR surfaces and exactly ONE of them is load-bearing. Not load-bearing, and all three still present: the warnings.warn, the _warn print, and the empty output_mappings section in a manifest that is still written and still announced as written. Load-bearing: the record-writer RETURNS the failure to its caller, and the build's exit path consumes that return into a printed failure naming the record and the target, then a non-zero exit. The obligation is therefore to KEEP that one path load-bearing under the rebased trigger, not to create it -- prove from a real run that the record step's failure still reaches the build's return value when the trigger is an out-of-target managed-file destination rather than an out-of-package package root. A change applied only to the message, or only to the warning category, remains a no-op with a report attached. Name all four surfaces and identify the gating one explicitly in sign-off."
  - "MUST NOT REFUSE OUT-OF-PACKAGE TARGETS WHOLESALE. A build that fails for every target outside the producing package's parent satisfies the failure clause and is a regression dressed as a fix. The paired success run is the guard against it and must not be dropped, weakened, or replaced by an assertion about the message."
  - "The failure must be attributable from the report alone: it must name the record that could not be produced AND the project the build was aimed at, so a reader knows which install is unprotected without re-running anything."
  - "THE FAILURE REPORT MUST NOT BE REACHABLE ONLY BY READING PAST A SUCCESS LINE FOR THE SAME RECORD. Added 2026-09-07 for the criteria clause added in the same pass. Measured on the failing run: the build prints a per-artifact success tick for the manifest -- 'build manifest (175 template + 0 output_mappings entries)' -- immediately BEFORE the failure line, so a reader who stops at the first statement the build makes about the record is told it was written. The report must not announce as written a record whose content could not be produced: either suppress or negate that tick for the failed record, or place the failure verdict where it is reached without reading past a contradicting success claim about the same artifact. The constraint is DIFFERENTIAL and must be provable as such -- the report of a build that could not produce the record must carry a signal the report of a build that DID produce it does not also carry. A message assertion that both reports satisfy is not a fix, it is the vacuity this clause exists to close."
  - "DO NOT REMOVE THE TRIGGER INSTEAD OF THE FAIL-OPEN. Added 2026-09-07. The rebased trigger is a managed file whose configured destination is an absolute path outside --target-dir; there is genuinely no truthful in-project position for such a file, so the correct outcome is a failed build and not a coerced key. Do not give the record's output-key relativization a not-inside-the-project fallback, do not substitute the absolute path as its own key, and do not silently drop the offending entry and continue. Each of those converts a build that cannot produce the record into a build that produces an UNTRUTHFUL one -- a different and worse defect -- and each would leave this AC's verdict unreachable and its tests unfalsifiable. BP-1500d-1's fallback is on the diagnostic-only template key, a different field, and is not precedent for the output keys the drift readers resolve files against."
  - "OUT OF SCOPE AND NOT A SUBSTITUTE -- THE RELATIVE FORM OF THE SAME ESCAPE. Written relatively ('../elsewhere/<file>') the escape does NOT fail: measured exit 0, a full 472-entry record, and an empty failure field, because the path library does not normalise '..' so the relativization succeeds and writes a key pointing outside the project it claims to describe. That is a produced-but-untruthful record, a different guarantee, and belongs to a sibling -- file it separately rather than folding it into this AC. If an implementation incidentally normalises paths so the relative form starts failing too, that is acceptable ONLY if the paired-success run still passes unchanged; a normalisation that turns more layouts into refusals is the wholesale-refusal regression under another name."
  - "Must be fail-closed by construction rather than by a caller remembering to check. Audit every caller of the build inside this repo -- CI jobs, build-self.sh, the worktree bootstrap path, and any workflow that shells out to build.py -- and name each one in sign-off together with whether it currently propagates the build's exit status. A build that starts failing correctly while a caller discards its status changes nothing at that caller."
  - "Must not change the build's command-line contract. The same invocation that succeeds today for the package's own workspace must still succeed, with the same arguments and the same output root."
  - "Must follow the project error handling policy at the record-writing boundary: the existing broad `except Exception` that downgrades a real failure to a warning must not be duplicated, and whatever replaces it must either re-raise or produce a typed failure that the build's exit path consumes."
  - "SCOPE BOUND -- this AC governs the build's verdict when the record cannot be produced. It does not govern where the record is written (BP-1500d-1), what form its entries take (BP-1500d-2), or what a reader does when it finds no record (BP-1500d-4). In particular, do not satisfy this AC by making the record always producible; that is -1's work and would leave this enforcement floor untested. KEPT DELIBERATELY 2026-09-07, AND NO LONGER A TRAP. When this bound was first written BP-1500d-1 had not landed, so it barred the only honest remedy for the then-current trigger and left a wholesale refusal as the only move available -- which is exactly what shipped and regressed 18 outcomes across 6 files. BP-1500d-1 is now work_status done and the out-of-package layout produces a correct record, so in this order the bound does the job it was written for: it prevents re-solving -1, and together with 'MUST NOT REFUSE OUT-OF-PACKAGE TARGETS WHOLESALE' it is now jointly satisfiable, with the paired-success run as the proof. Read the two side by side before choosing an approach."
delivers_to:
  - agent: python-coder
    ac_id: BP-1500d-1
    contract: "A build whose process exit status is unsuccessful whenever the record cannot be produced. This is what lets every sibling's positive fixture treat a green build as evidence the record exists; without it, 'the receiving project holds no record' and 'the build succeeded' remain simultaneously observable and no sibling's happy path is trustworthy."
  - agent: python-coder
    ac_id: BP-1500d-2
    contract: "The same guarantee, applied to this AC's pre-relocation state: a project that reached a green build is known to carry a producible record, so a failure after relocation is attributable to the move rather than to a build that quietly produced nothing."
  - agent: python-coder
    ac_id: BP-1500d-4
    contract: "The same guarantee, which bounds BP-1500d-4's scope. Because a build that cannot produce the record now fails, an install that exists at all has one, so BP-1500d-4's could-not-read verdict covers removal, corruption and non-portability rather than also having to cover 'the build silently skipped it'."
  - agent: documentation-expert
    ac_id: BP-1500d-5
    contract: "The observable form of the build's failure -- the exit status an automated caller sees and the text that names the record and the project -- which BP-1500d-5's reference must document so a reader can recognise it in their own output."
expects_from:
  - ac_id: BP-1500d-1
    contract: "SATISFIED 2026-09-07 -- BP-1500d-1 is readiness approved, work_status done, and its behaviour is demonstrably live on this branch. The out-of-package consumer-simulation harness (scratch project under a system temp root, realpath asserted NOT under package_root.parent, package copy at <scratch>/leafcutter-ai/, target otherwise empty apart from a minimal config), plus the ability to place that harness in a state where the record CAN be produced. The second half is what makes this AC's paired success run possible; without it only the failure verdict is observable and the AC can be satisfied by a build that refuses every out-of-package target -- which is precisely what happened when -3 was built first. It is now delivered and measured: a plain out-of-package build exits 0 and writes 472 output mappings into the RECEIVING project, which is also why this AC's trigger had to be rebased off that layout. CONFIG PATH, CORRECTED: the harness's config is read from <target>/.claude/skills_config.json, NOT <target>/skills_config.json. The prior wording said only 'a minimal skills_config.json' and a probe acting on it wrote the top-level path, configured nothing, and returned a false green. LAYOUT, MADE EXPLICIT BECAUSE THE PRIOR WORDING WAS AMBIGUOUS AND THE AMBIGUITY IS ITSELF A FALSE-GREEN VECTOR: the package copy and the receiving project are SIBLING directories under the temp root -- package at <scratch>/leafcutter-ai/, target at <scratch>/project/, invoked as --target-dir <scratch>/project. The prior text paired 'package copy at <scratch>/leafcutter-ai/' with a surface_invoked of '--target-dir <scratch>', which makes the target EQUAL to package_root.parent -- that is the self-host layout ADR-001 says hides this family of defect, not the out-of-package venue the L1 mandates, and it also contradicts the same sentence's own 'realpath asserted NOT under package_root.parent'. Every test_spec entry's surface_invoked has been corrected to the sibling form."
  - ac_id: BP-900h-1
    contract: "CORRECTED 2026-09-07 -- NOW SATISFIED. The prior text read 'NOT SATISFIED ... work_status not_started with zero implementation'; BP-900h-1 is now readiness approved, work_status done. It specifies the real-build-against-an-out-of-package-scratch-project invocation this AC asserts on, and is therefore shipped prior art for that invocation rather than an unmet specification to conform to. Still deliberately NOT a depends_on: the harness this AC drives is constructed by BP-1500d-1, which IS a depends_on; h-1 is read for the invocation shape only."
test_spec:
  - name: test_bp_1500d_3_build_exits_nonzero_when_the_record_cannot_be_produced_for_an_out_of_package_target
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    surface_invoked: "python <scratch>/leafcutter-ai/scripts/build.py --target-dir <scratch>/project"
    description: "THE PRIMARY ASSERTION, AND IT IS ON THE EXIT CODE. Run the real build as an out-of-process subprocess against the out-of-package harness with the record made unproducible, and assert the process exit status is NON-ZERO. TRIGGER REBASED 2026-09-07 -- the condition this entry previously named is dead. Its old description read 'measured 2026-08-25, this exact run emits [WARNING] could not compute output_mappings ... is not in the subpath of ..., writes a manifest with output_mappings {} (154 entries to 0), and exits 0', and every one of those located facts described the package sitting outside --target-dir. BP-1500d-1 has made that layout a SUCCESS case: it now exits 0 with 472 output mappings, 175 template entries and an empty failure field, so a fixture keyed to it can be made red only by re-breaking -1. THE TRIGGER TO USE, verified by three real subprocess builds rather than asserted: write <target>/.claude/skills_config.json with precommit_autofix_config_path set to an ABSOLUTE path outside --target-dir (changelog_categories_path behaves identically -- pin one, do not use both). Measured on this branch: the record computation raises, every mapping is discarded, the manifest is written with zero mappings and a non-empty failure field reading 'ValueError: <outside path> is not in the subpath of <target>', the pre-existing fail-open warning is printed verbatim, and the build exits 1. Measured on origin/main: the identical state exits 0 -- the red baseline this entry needs is intact. CONFIG-DISCOVERY TRAP, DO NOT SKIP IT: the config is read from <target>/.claude/skills_config.json, NOT <target>/skills_config.json. A fixture that writes the latter configures nothing, the build succeeds with a full record, and the result is a false green shaped exactly like a legitimate pass. THIS ENTRY MUST THEREFORE PROVE THE CONFIG WAS READ: assert the build's record-failure text names the exact out-of-target absolute path the fixture wrote into the config -- a fixture-unique string that cannot appear in the output unless the config was consumed. Do NOT use the relative '../' form of the escape; it does not fail (see it_requirements). THE TWO 'SETUP SANITY' ASSERTIONS ARE KEPT: output_mappings == {} and a non-empty output_mappings_error were INVERTED against the post--1 world -- 472 mappings and an empty failure field are what a healthy out-of-package build now produces, so the old pair pinned -1 as broken -- but under this trigger the record genuinely IS emptied, so both become valid again and should be kept, as SUPPORTING signals only. Do NOT retarget the primary assertion onto the warning string or the mapping count: exit-0-on-failure IS the defect, it is guarantee (d) of BP-1500d which the L1 states must not be dropped, and a warning-based assertion is satisfied by the unpatched build."
  - name: test_bp_1500d_3_the_verdict_is_taken_from_the_real_build_command_line_and_reaches_an_automated_caller
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "python <scratch>/leafcutter-ai/scripts/build.py --target-dir <scratch>/project"
    description: "PRODUCTION ENTRY POINT, and the consumption half. Invoke the build as a SUBPROCESS through the command line a consumer or a CI step runs -- never by importing write_build_manifest or calling an internal step -- and read returncode from the child process, because that is the only thing an automated caller sees. TRIGGER REBASED 2026-09-07: the exit-code assertion is invalid AS TRIGGERED, not as written -- keep the assertion verbatim and re-point the fixture onto entry 1's rebased trigger (an ABSOLUTE out-of-target precommit_autofix_config_path written into <target>/.claude/skills_config.json, NOT <target>/skills_config.json), carrying entry 1's config-was-read proof so a silently-unconfigured build cannot masquerade as a pass. THE SECOND HALF IS TRIGGER-INDEPENDENT AND MUST SURVIVE UNTOUCHED: parse the CI workflow as YAML and assert the step invoking the build neither carries continue-on-error true nor pipes the build into a command that masks its status. A grep for the script name is green on a step that ignores the exit code, which is the defect one level up. Minor and non-blocking, while in the file: the existing check that run_cmd contains neither a single pipe nor a double pipe is redundant in its second clause -- any double pipe already contains a single one."
  - name: test_bp_1500d_3_the_failure_report_names_the_record_and_the_project_the_build_was_aimed_at
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: criterion
    surface_invoked: "python <scratch>/leafcutter-ai/scripts/build.py --target-dir <scratch>/project"
    description: "THE REPORT CLAUSE -- AND THIS ENTRY IS VACUOUS TODAY, WHICH IS THE FINDING, NOT A REPRIEVE. Measured 2026-09-07: it PASSES, and it passes for the wrong reason. Both strings it searches for -- the record's name and the target project path -- appear in the SUCCESS line of a build that produced the record perfectly, so a substring search over the whole capture cannot distinguish the report this entry exists to check from that report's exact opposite. A green test that cannot fail is worse than a red one, and re-pointing the trigger alone would NOT fix it: the rebased fixture would still be searched with a predicate a healthy build satisfies. THREE CHANGES, ALL REQUIRED, IN THIS ORDER. (1) RE-POINT: use entry 1's rebased trigger -- an ABSOLUTE out-of-target precommit_autofix_config_path written to <target>/.claude/skills_config.json, NOT <target>/skills_config.json -- and carry entry 1's config-was-read proof. (2) SCOPE THE NAMING ASSERTIONS TO THE FAILURE REPORT ITSELF rather than to the whole capture: the line or contiguous block that carries the failure must ITSELF name BOTH the record that could not be produced AND the target project path, so neither match can be donated by an unrelated success line elsewhere in the output. A message that says only 'could not compute output_mappings' still tells a reader nothing about which install is unprotected, and that is the message today. (3) MAKE THE ASSERTION DIFFERENTIAL -- this is what discharges the criteria clause added 2026-09-07 and what makes the test capable of failing at all: in the SAME test, also capture the output of the paired-success run (entry 4's run 2 -- same command line, same out-of-package venue, the managed file placed back inside the project) and assert that the failure-report signal found in the failing capture is ABSENT from the succeeding capture. If the same predicate matches both captures the test has distinguished nothing and MUST fail; that inversion is the anti-vacuity guard and may not be dropped. ONE MEASURED FACT TO ASSERT ON WHILE DOING THIS: the failing run prints a per-artifact manifest success tick -- 'build manifest (175 template + 0 output_mappings entries)' -- immediately BEFORE the failure line. A reader must not have to read past a success claim about the same record to reach the failure, so assert the report does not present that tick as its verdict for the record it could not produce."
  - name: test_bp_1500d_3_the_identical_build_succeeds_and_leaves_the_record_in_place_once_it_can_be_produced
    target_dir: unit_tests/portability/
    framework: pytest
    type: behavioral
    angle: failure
    surface_invoked: "python <scratch>/leafcutter-ai/scripts/build.py --target-dir <scratch>/project"
    description: "THE ATTRIBUTION CONTROL, and the guard against a regression dressed as a fix. Three runs of the SAME build command line against the SAME out-of-package harness. MECHANISM REBASED 2026-09-07 -- the three-run structure and the reason run 2 exists are UNCHANGED; only how the condition is set and resolved changes. (1) Record unproducible: <target>/.claude/skills_config.json sets precommit_autofix_config_path to an ABSOLUTE path outside --target-dir -- assert non-zero exit. The old mechanism for this run, the package sitting outside the target, is dead: that layout now succeeds on its own. (2) The condition resolved by placing that managed file back INSIDE the project -- NOT by re-nesting the package inside the target, which is now a no-op because run 1's layout already succeeds. Run 2's three assertions are CORRECT AND KEPT VERBATIM: exit 0, a non-empty record present on disk in the target, and an empty record-failure field. ONE ASSERTION IS ADDED, and it is the config-was-read proof for the whole entry: set precommit_autofix_config_path to a NON-DEFAULT path inside the target (not the shipped default .claude/precommit-autofix.json) and assert the written record contains a mapping for THAT path. If it does not, the fixture's config was never consumed, and runs 1 and 3 prove nothing while looking green -- this is the exact false green a probe hit by writing <target>/skills_config.json instead of <target>/.claude/skills_config.json. (3) The condition reintroduced -- non-zero again. Run 2 remains load-bearing: without it a build that simply refuses every target outside its own parent folder passes runs 1 and 3 perfectly while being strictly worse than today, which is not hypothetical -- it is what shipped when this AC was built ahead of BP-1500d-1 and regressed 18 outcomes across 6 files. Assert the record's presence in run 2, not merely exit 0, so a build that succeeds by skipping the record cannot pass."
test_rationale: |
  This child is the enforcement floor for its three siblings, not an extra. BP-1500d's
  notes say it outright: (a) through (c) implemented over a build that still exits zero
  when it gives up leaves the whole family unenforceable, silently, exactly as today.
  So the contract is written to make the exit status impossible to skip.

  RE-BASED 2026-09-07, SECOND IT-PO PASS. What changed in this contract is the
  TRIGGER every entry fires on, and nothing else. The verdict, the separation of the
  outcome clause from the message clause, the attribution control's three-run shape
  and the exit-code primacy are all unchanged. BP-1500d-1 landed and turned the old
  trigger -- the package sitting outside --target-dir -- into a success case, so four
  entries were describing a condition that no longer exists. Every assertion below was
  invalid AS TRIGGERED, not as written; the fixtures move, the assertions do not.

  Entry 1 asserts on the exit code and must stay that way. A probe of the pre--1
  build correctly observed that the ValueError was swallowed and the process exited 0,
  and drew the wrong conclusion from it -- that an AC asserting build failure is false
  as written and the assertion should move to the mapping count or the warning string.
  Adopting that would bake the defect into the spec. The red is the finding. A
  warning-only assertion is satisfied by the unpatched build, which is the definition
  of a test that cannot fail for the right reason. The mapping count is a useful
  supporting signal and nothing more. Its two 'setup sanity' assertions were briefly
  worse than invalid -- INVERTED, pinning -1 as broken by demanding the empty record
  and non-empty failure field that -1 exists to eliminate. Under the rebased trigger
  the record genuinely is emptied again, so they are valid once more and are kept.

  THE FALSE-GREEN RISK IS NOW THE DOMINANT ONE IN THIS CONTRACT, AND IT IS WHY EVERY
  ENTRY CARRIES A CONFIG-WAS-READ PROOF. The rebased trigger is delivered through a
  config file, and the build reads it from <target>/.claude/skills_config.json rather
  than <target>/skills_config.json. A fixture that writes the top-level path
  configures nothing at all: the build succeeds with a full record and the test's
  red baseline evaporates while looking exactly like a legitimate pass. This is not a
  hypothetical -- the BA's first probe hit it. Every entry that stands up this fixture
  must assert on a fixture-unique consequence of the config having been read (the
  out-of-target absolute path appearing in the failure text; the non-default inside
  path appearing in the record) or it proves nothing.

  Entries 1 and 3 are deliberately separate because the criteria separate the outcome
  clause from the message clause, and a build can satisfy either one alone. The
  realistic partial fix here is a louder warning -- it reads like progress, passes a
  message assertion, and leaves every automated caller exactly where it is.

  ENTRY 3 NEEDED MORE THAN A RE-POINT, AND THIS IS THE MOST IMPORTANT CHANGE IN THE
  PASS. It passes today, vacuously: both strings it searches for appear in the success
  line of a healthy build, so its predicate is satisfied by the exact report it exists
  to rule out. Moving the fixture would have left a green test that still cannot fail.
  The cure is structural rather than textual. The naming assertions are scoped to the
  failure report itself so no match can be donated by a success line elsewhere in the
  capture, and the entry becomes DIFFERENTIAL: it captures the paired-success run in
  the same test and requires the failure signal to be absent there. A predicate that
  matches both captures now fails the test rather than passing it. That inversion is
  also how the criteria clause added in the same pass -- the failure report must be
  distinguishable from a successful one -- is made testable rather than asserted.

  Entry 4 is the attribution control and its second run is the part that will be
  tempting to drop. Runs 1 and 3 alone are passed perfectly by a build that refuses
  every out-of-package target, which would be a regression that closes the AC -- and
  that is precisely what shipped in the -3-first order, at a cost of 18 regressed
  outcomes across 6 files. Run 2 additionally asserts the record is present rather
  than only that the build exited 0, so a build that succeeds by skipping the record
  cannot pass either. Run 2's mechanism is the one thing that moves: it resolves the
  condition by putting the escaped managed file back inside the project, and it now
  doubles as the contract's config-was-read proof by using a non-default inside path
  and asserting that path appears in the record.

  Entry 2 carries the consumption half because a correct exit status is worth nothing
  at a caller that discards it. This repo has already shipped that exact shape --
  a verdict routed through a step carrying continue-on-error -- so the workflow is
  parsed as YAML and asserted on as a data structure rather than grepped.

  Angles: criterion and reachability -- the mandatory floor -- plus failure, which is
  conditional and consumes no slot. deployed is not charged: the build script is run
  from the package checkout by consumers rather than shipped into the deployed output
  root, so the deployed-layout question belongs to the readers in BP-1500d-4 rather
  than here. real_artifact is not charged because this AC's subject is a process exit
  status, not a serialized artifact another tool reads back. boundary is not charged
  because the criterion names no range, count or limit.
