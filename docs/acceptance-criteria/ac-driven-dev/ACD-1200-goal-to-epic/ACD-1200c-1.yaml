title: "AC depends_on relationships are propagated to ticket depends_on fields"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
criteria: |
  Given the leaf ACs for goal ACD-050 have these dependency relationships:
    - ACD-050a-1 (depends_on: [ACD-050a])
    - ACD-050a-2-i (depends_on: [ACD-050a-2], and ACD-050a-2 depends_on: [ACD-050a-1])
    - ACD-050b-1 (depends_on: [ACD-050b])
  When tickets are generated for these 3 leaf ACs,
  Then the ticket for ACD-050a-2-i has depends_on referencing the ticket for ACD-050a-1
    (because ACD-050a-2-i's ancestor ACD-050a-2 depends on ACD-050a-1)
  And the ticket for ACD-050a-1 has no ticket-level depends_on (its AC dependency
    is on the composite L1, which has no ticket)
  And the ticket for ACD-050b-1 has no ticket-level depends_on
  And only dependencies between leaf ACs that both appear in the generated set
    produce ticket-level depends_on edges.
depends_on: [ACD-1200c, ACD-1200a-2]
