criteria: |
  Given the answer contract of ACS-1100a, the method record of ACS-1100b, the halt of
    ACS-1100c, and the propagation and verdict cap of ACS-1100d,
  When an author of a tool that produces or consumes a store answer consults the
    store's reference documentation,
  Then one reference section states the three parts every answer carries — results,
    total, and named method — the shape a caller may rely on, and that the total and
    method are present even when the result set is empty, so an answer that matched
    nothing still reads 0 of 180,
  And it states that the total is derived without the query's own filter set, match
    keys, or join keys, gives a filter-free enumeration over the store root as the
    reference derivation, states that a single filter-free enumeration shared with the
    result pass satisfies the rule because it has no blind spot to inherit, and
    documents the declared exemption record — its fields, its single current entry for
    the AC-tree child-limit counter, ACS-100h-7a as the mandate behind that entry, and
    that an exemption withholds the independent total only and never authorises forking
    the rule applied per record,
  And it lists every field of the method record — the enumerated root, the inclusion
    rule, the measurement provenance (computed at answer time, or a recorded constant
    with the date it was measured), the normalisation applied when joining records to
    what was observed, and each exclusion as a count plus a stated ground — states the
    arithmetic the record must satisfy (covered plus declared exclusions equals the
    total), lists the grounds an exclusion may currently be recorded under including
    deprecated records, superseded records, files that are not requirement records, and
    records outside the requested scope, states that a ground not on that list must be
    added to the list before it may be used, states that a scoped answer reports both its
    scope total and the store total, and states that a stale measurement is declared by
    the method record and never halts,
  And it states the reconciliation arithmetic and the halt: what a halt report contains
    (the total, the covered count, the declared exclusion total, the number of records
    unaccounted for, and the number of records the measurement could not classify), the
    two ways to clear it — declare the missing exclusion with a ground, or repair the
    query so it reaches the records it missed — that the answer is withheld on a halt
    and a warning carrying the partial result is not an acceptable substitute, that a
    record the measurement could not classify means an unreadable or unparseable record
    only and never a record that merely fails schema validation, and the separation
    between a real unreconciled gap, which always halts, and a failure of the
    measurement itself, which degrades with a warning per the project error-handling
    policy,
  And it states what a consuming tool must carry through to its own result — the
    inherited coverage figure and the upstream answer it came from — that dropping it
    makes the tool's own result unaccounted for, that a consuming hop includes human-read
    surfaces (a rendered rating, a badge, a legend entry, a dashboard tile) and not only
    machine payloads, the cap rule with a worked example showing 40 of 180 and 180 of 180
    producing a verdict of clear for 40 of 180, the conditions under which an unqualified
    all-clear is available and that a halted or unclassifiable input yields no pass
    verdict at all, and it distinguishes this coverage guarantee from the phantom-done
    guarantees, which prove that work is done rather than that a query was complete,
  And it presents the SHIPPED WORKED EXAMPLE as an instance of that vocabulary: the
    artifact map's test-covers edge note, which declares its diff scope, names its
    enforcing test, carries its measurement date, states an explicit "do not read this as
    store-wide", and reports 244 of 607 — quoted as written and mapped field by field
    onto the method record, so the next author copies a real self-describing answer
    instead of inventing a fifth phrasing,
  And a vocabulary in which that note cannot be expressed without loss does not satisfy
    this criterion: the note is the acceptance test for the vocabulary rather than an
    illustration of it, so a thing the note says that the vocabulary has no field for is a
    missing field in the vocabulary and never a non-conforming note,
  And it carries the INHERITANCE REGISTER in this one place, naming each tree that
    INHERITS the standing contract and what it inherits it for — KM-200 for artifact
    census figures, KM-ADM-100 for the map's trust ratings and the first shipped instance
    of the contract — and each tree that is merely ADJACENT and does not inherit it —
    TQ-400, which governs whether the proof for finished work still holds over time
    rather than how an answer describes its own coverage, and whose TQ-400d owns retiring
    the untagged-finished pile,
  And the register states the rule it exists to enforce: an inheriting tree does not
    re-specify the contract and is not re-homed under it, and the register names the
    surface each inheritor has already shipped against the contract,
  And a register distributed across the notes of the records it describes does not
    satisfy this criterion — the bug symptom being five separate AC notes each stating a
    fragment of the relationship, so a reader who finds one of them cannot tell whether
    the tree they are standing in inherits the contract, owns it, or merely sits beside
    it,
  And a reader who has consulted only this one section can produce a conforming answer
    and a conforming consumer without reading any of the ACS-1100 records themselves.
