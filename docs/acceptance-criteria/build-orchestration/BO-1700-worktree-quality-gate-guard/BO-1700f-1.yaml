it_requirements: |
  The no-op path is taken ONLY when the MAIN tree genuinely has no config (see
  BO-1700f-1-ii for the authoritative determination via git-common-dir). INFO
  message, exit 0. This is the graceful-no-op boundary — it must NOT be reachable
  when the main tree HAS a config but the worktree cannot fire it (that is the hard
  fail in BO-1700f-1-i). Implemented in the shared probe helper (BO-1700a-1); ADR-001
  deployed/template parity applies.
