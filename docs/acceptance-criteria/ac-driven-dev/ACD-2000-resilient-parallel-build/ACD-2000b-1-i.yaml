notes: |
  THE OVERLOADED-FIELD LEAF -- ACD-2000b hazard 4, "the subtle one".

  THE PROBLEM, RESTATED PRECISELY. `work_status: in_progress` is simultaneously
  (a) a human-facing lifecycle value and (b) the lock. Locks and lifecycle values
  have incompatible access rules: a lifecycle value is something any tool or
  person may set, while a lock may only be released by its holder. Overloading
  them means every writer of work_status is, unknowingly, a lock manipulator.

  THE FOUR WRITER CLASSES THIS AC EXERCISES, each a real failure:
    1. MARK-DONE FLOWS. `fast_lane.mark_done_built_acs()` marks ACs done on test
       coverage alone. A done-marking pass over a requirement someone else is
       mid-build on ends the claim with no record -- and note this same function
       is separately flagged as a phantom-done regression risk once ACD-1800b's
       all-deliverables-signed definition lands.
    2. RECONCILIATION PASSES. Bulk store fixes that normalise work_status
       (the repo has run several; see the AC-store reconciliation guidance in
       CLAUDE.md) would strip live claims wholesale.
    3. HAND EDITS. A person opening the YAML has no signal that the value is
       load-bearing. Hence the third Then clause -- being TOLD, not merely
       blocked.
    4. THE READINESS SCANNER. It cannot today distinguish "a machine has claimed
       this" from "a person is working on it", so it either offers claimed work
       (double-dispatch) or hides human-in-progress work (invisible backlog).
       The last two Then clauses split those apart.

  EITHER DESIGN CAN SATISFY THIS AC, WHICH IS DELIBERATE. A separate claim field
  satisfies it structurally (lifecycle writers simply do not touch the claim).
  Keeping the overload satisfies it only by enumerating and gating every writer
  -- which is strictly more work and strictly more fragile, but the criteria do
  not forbid it. ACD-2000b's hazard 4 asks for the decision to be made
  deliberately rather than left implied; this AC makes the CONSEQUENCES testable
  either way, and the IT PO records the choice.

  THE SECOND THEN CLAUSE ("never quietly available with no record") is the one
  that connects to ACD-2000a: a claim that ends without a record is
  indistinguishable from a claim that was never made, and the adjudication trail
  loses an attempt boundary.

  TESTABILITY. Run the REAL housekeeping and scanning code over a real store
  containing a live claim and assert the observable outcomes. A test that
  enumerates writers by grepping for assignments to the field is a grep test and
  cannot see a writer that reaches the value through a helper -- which is how
  `_update_ac_work_status()` is reached today.

  2026-08-17 (IT PO enrichment). The choice this AC left open is recorded on
  ACD-2000b-1: a DEDICATED claim record, with `work_status` still dual-written
  until the `enforce` stage.

  NEWLY VERIFIED AGAINST THE GATE THAT ACTUALLY RUNS.
  `scripts/commit_guardian/check_ac_governance.py` does not merely fail to
  protect `work_status` -- it lists it in `_OPEN_FIELDS` (~lines 67-70) and
  prints "Open fields (any agent may change)" in its own diagnostic output. The
  deployed hook currently DECLARES the opposite of what this AC requires, so the
  third Then clause is a change to that constant and its message, not a new
  gate. The same hook is fail-open on unexpected exceptions (its docstring,
  ACS-400e-1-i), which is why the test contract executes the hook rather than a
  predicate: a check that raises there is skipped in silence.

  THE SCANNER CLAUSES CUT BOTH WAYS. Today a claimed requirement is hidden from
  the drive only as a side effect of the `work_status` overload. Move the lock to
  its own field without teaching `scan_ac_store` to read it and the fix itself
  re-offers every claimed requirement. That inversion is recorded as an
  it_requirement because it is invisible from the criteria alone.
