notes: |
  GAP D of BP-1100g, first half: the teaching, made CHECKABLE rather than merely
  present.

  THE OBSERVED STATE. Every plan the generator produces on the criteria-derived
  route now carries a named kind for each requested proof. The agent that writes
  those tests contains the word zero times. An instruction the doer cannot parse
  is not an instruction.

  WHY SET-EQUALITY AND NOT A PROSE CHECK. "The template mentions the vocabulary"
  is satisfiable by pasting a paragraph, and it decays silently the first time a
  name is added on the emitting side. Set-equality between the emittable names
  and the taught names is a machine-decidable predicate over two real sources,
  and it fails loudly on exactly the drift that matters. This is the shape of
  EPIC-ComputedQualityGates FP-1 layer 3, where a hook's allowed-targets list and
  the config it was meant to mirror were DISJOINT vocabularies: each side was
  tested against its own copy and no cross-source set-equality contract existed.
  The final Then clause exists because of that incident specifically — a
  comparison that reads a convenience copy reproduces the defect it is checking
  for.

  WHAT THIS AC DOES NOT CLAIM. Set-equality proves the writer has been told the
  words, not that it acted on them. The acting half is split deliberately:
  BP-1100g-2 covers the hardest judgement (resolving a way in when none is
  named), and BP-1100g-3 makes the writer state which kind each test answers.
  Do not fold any of the three together — each has a different producer and a
  different observable.

  BOUNDARY. Nothing here reads a test. A reported mismatch is a mismatch between
  two declarations of a vocabulary, not a verdict about any piece of work.

  IT-PO JUDGEMENT CALL, 2026-08-17 — THE PROSE-QUALITY CLAUSE IS NOT TESTED.
  The second Then clause asks that the instructions state, per name, what
  distinguishes that kind of proof from a proof of the behaviour alone "in terms
  the writer can act on without further interpretation". The honest
  machine-checkable content of this AC is the set-equality (clauses 1, 3, 4)
  only. Per the BA's explicit instruction, no test_spec entry greps the template
  for keywords and calls that coverage: a keyword grep asserts presence, not
  actionability, and passes on a paragraph nobody can act on. The clause is
  carried instead as an it_requirement and routed to pr-reviewer / the llm-expert
  Prompt-Quality Checklist. If a checkable form is wanted later, the only honest
  one is an eval: give a model a plan requesting a named kind and the template,
  and measure whether the test it writes exercises a production entry point —
  which is an eval harness, not a unit test, and is not in this AC's scope.

  IT-PO ENRICHMENT NOTE — SPLIT CONSIDERED AND REJECTED. Clauses 3 and 4 imply a
  .py comparison, which is python-coder surface, while clauses 1 and 2 are
  templates/agents/*.md, which is llm-expert surface. A split was rejected for
  two reasons: (a) the BA's own notes frame the comparison as the missing
  "cross-source set-equality contract TEST", which test-writer authors from
  test_spec in the normal flow rather than as production code; and (b) BP-1100g
  is at child_limit_override: 7, so two L2 children would breach the cap. The
  coupling that a split would have made explicit is instead pinned as the
  delivers_to contract: a stable anchor in the template that the check reads.
