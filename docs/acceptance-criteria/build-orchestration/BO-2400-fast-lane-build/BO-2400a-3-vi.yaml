  constraints:
    - "xfailed MUST count as red. Every AC in a fast-lane batch is not-yet-done, so the AC test-enforcement plugin converts its failures to xfail; a classifier that recognises only 'failed' sees zero red tests in every real run and makes the gate vacuous."
    - "The classification must be total over the outcome vocabulary the pytest parse layer emits (PASSED, FAILED, XFAIL, XPASS, SKIPPED, ERROR) — an unrecognised outcome must be treated as inconclusive and reported, never silently dropped."
    - "RESOLVED (verified against scripts/ac_store/pytest_ac_enforcement.py, 2026-08-17): the plugin does NOT use strict xfail. It adds no xfail marker; its pytest_runtest_makereport hookwrapper rewrites report.outcome to 'xfailed' only when report.when == 'call' AND report.outcome == 'failed'. A passing test is never touched, so the plugin cannot produce XPASS and the strict-xfail hazard does not exist. XPASS can arise only from an explicit @pytest.mark.xfail in a test, where classifying it green is correct. Note also that the plugin downgrades ONLY AssertionError failures — ImportError/TypeError and other non-assertion failures stay FAILED — so both FAILED and XFAIL genuinely occur in a real run and both must count as red."
    - "The covering test must exercise the xfail path against the real enforcement-plugin behaviour, not a hand-built fixture that only emits PASSED/FAILED — the bug being fixed is precisely a binary-outcome assumption."
