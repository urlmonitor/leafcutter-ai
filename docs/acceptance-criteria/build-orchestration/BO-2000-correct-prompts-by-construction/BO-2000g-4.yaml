id: BO-2000g-4
components:
  - build_orchestration
  - commit_guardian
title: "Each corrected comment example, written as the template gives it, passes the real commit-time feedback-id check"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/build-orchestration/BO-2000-correct-prompts-by-construction/BO-2000g.yaml
criteria: |
  Given a scratch git repository with the project's real commit-time feedback-id check
    installed and active as a pre-commit hook, and a scratch ticket, placed where that
    check inspects tickets, with a Comments section,
  And every comment example that the template lint (BO-2000g-3) examines and does not
    exempt, taken from the agent templates and skills as shipped,
  When each example is appended to the scratch ticket's Comments section exactly as the
    template gives it, with no line added, removed or reordered, and only its
    placeholders filled:
      - the heading's date and time are filled with the current time;
      - the heading's agent-name slot, where the example has one (for example
        `<agent-name>` in the write-c4-diagram skill's question entry), is filled with
        the name of an agent that uses that template or skill;
      - a real-id placeholder is filled with the id the feedback submission step printed
        in that same run, or with the documented failure fallback when that run failed;
      - a `feedback-id: (not-a-signoff)` line is copied unchanged,
  And the scratch ticket is committed once per example,
  Then every commit succeeds with the feedback-id check having run and passed, with no
    bypass token in the commit message and the check not skipped,
  And no feedback-id value in any committed entry was typed by hand: each one is the
    template's literal text or the submission step's printed output,
  And the number of examples proven equals the number of examples the lint examined and
    did not exempt, so adding one more conforming example to a template adds one more
    proven case with no change to the proof.
depends_on:
