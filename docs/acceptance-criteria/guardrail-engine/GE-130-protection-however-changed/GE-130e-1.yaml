id: GE-130e-1
title: The session-time hooks the package ships are counted from its hooks folder and shipped settings
  at run time, with the tools each one watches
component: guardrail-engine
components:
- commit_guardian
- precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the package's session-time hook scripts, held together in one folder, and the shipped hook
    settings, in which each registration names an event, the tools it matches and the script it
    runs,
  When the census runs,
  Then its population is obtained by listing that folder and reading those settings at the moment
    it runs, not from a list written into the census,
  And it reports for each registered hook the event, the tools it is registered for, and whether
    the hook declares itself a protection against changing files,
  And a hook script in that folder that no registration runs is reported by name as registered
    nowhere, under its own class,
  And given one hook script is added to that folder with a registration and nothing else changes,
  When the census runs again,
  Then the stated count of registered hooks is one greater and the new hook appears with its
    tools,
  And commit-time gate scripts are not in this population.
