  - precommit_hooks
level: L0
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Being stopped comes with a next step, never just a red light.

  Most of the checks that can stop a commit say nothing about what happens after
  they do. Nobody has decided who puts the problem right or how, so whoever is
  standing there improvises, and the cheapest thing that clears the check is rarely
  the right thing. After this goal, every check that can stop a commit says ahead
  of time what the author should do, which specialist helps, and which skill that
  specialist applies. A check that says none of this cannot be added, and one that
  points at help that does not exist is caught before anyone relies on it.
