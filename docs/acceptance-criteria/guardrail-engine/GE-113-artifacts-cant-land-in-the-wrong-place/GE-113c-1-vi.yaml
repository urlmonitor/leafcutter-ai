notes: |
  Found 2026-09-27 while building BO-2400a-1-iii, and approved by the user for an AC built right
  after it. check-agent-registry's main() looks for the package at the repository root plus
  'leafcutter' and returns 0 when that path is absent. In this repository the package sits at the
  repository root, so the commit-time registry gate has passed every commit without reading
  anything. Every "Check Agent Registry ... Passed" line here has been empty. The build's
  --validate-only path calls the same registry validation and still checks the registry at build
  time. It has never run at commit time in this repository.

  RELATION TO BO-2400a-1-iii (approved, on main via PR #922). This record is what makes
  BO-2400a-1-iii's clause "the registry gate that runs at commit time rejects an unknown step
  kind" hold in this repository, and it is built right after BO-2400a-1-iii. USER DECISION
  2026-09-28: no depends_on edge is added to the approved BO-2400a-1-iii. The fourth scenario
  uses a missing template, which fails today, instead of an unknown step kind.

  USER DECISIONS 2026-09-28. (1) Block, not warn. (2) GE-120a-2 is NOT a dependency: the check
  blocks with a plain non-zero exit today, so this record can be built at once. When GE-120a-2
  lands, check-agent-registry registers with cannot-run disposition "block". (3) The IT PO adds
  GE-113c-1's missing test_spec in the same AC commit. (4) The orchestrator records the known
  issue for the empty commit-time registry gate in this PR.

  PLACEMENT. GE-113c ("A guard does its job the same way inside a consumer project as it does at
  home") owns guards that resolve the wrong root for their layout. GE-113c-1 is the L2 for root
  resolution per layout, and GE-113c-1-i already covers the source-repository layout for the
  project root. This record is the package-root counterpart for one check. L2s carry no child
  cap. The id skips -ii, which GE-113c-1's amendment reserves as "intentionally NOT authored".

  OVERLAP, AND WHY THIS IS NOT A DUPLICATE. GE-120a-1 (done) and GE-120a-4 (done) state the
  generic no-silent-pass rule. check-agent-registry breaks it through a path neither covers: an
  early success return when its package path is missing, with no staged-file count and no
  message. GE-120a-2 (todo) owns the block/announce disposition; this record does not rely on it
  (see user decisions above). GE-113c-1-iv (todo) consolidates project-root resolution. This
  record asks for package-root resolution through the same convention and does not invent a
  second one.

  WHY BLOCK. A staged registry that cannot be checked is exactly the silent pass this record
  exists to end, and a warning would let the next unchecked registry through the way this one
  went through.

  NO SILENT RE-DISABLE. The last scenario exists because turning a dead gate on can make the next
  commit fail on errors nobody has seen. The easy way out is to switch it back off or exempt the
  registry. The criterion rules that out and makes those errors either fixed or recorded as known
  issues. No known issue for this defect existed on 2026-09-28 (known-issues searched for
  check_agent_registry, check-agent-registry and the 'leafcutter' path); the orchestrator adds
  one in this PR.

  The layout list comes from the defect report. The BA did not read the check's or the build's
  source to confirm which layouts the package ships or how the build locates the package. The IT
  PO confirms both at enrichment.
