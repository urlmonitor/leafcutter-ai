id: GE-111b-1-i
readiness: approved
priority: high
title: "An anchorless implemented_by entry is evaluated at file-path tier only"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-111-traceability-stays-honest/GE-111b.yaml"
criteria: |
  Given an acceptance criterion AC-X has implemented_by entry "src/foo.py" with
    no #symbol anchor
  And the staged commit keeps "src/foo.py" present but moves several functions
    out of it
  And the symbol-analysis tooling is available
  When the traceability reconciliation check evaluates AC-X
  Then the check does not invoke the symbol tier for AC-X
  And the check produces a clean verdict for AC-X because the file still resolves
    in the staged tree

  Given an acceptance criterion AC-Y has implemented_by entry "src/foo.py#"
    (an empty anchor after the # separator)
  When the traceability reconciliation check evaluates AC-Y
  Then the check treats AC-Y as having no resolvable symbol name
  And it evaluates AC-Y at the file-path tier only
depends_on:
  - GE-111b-1
