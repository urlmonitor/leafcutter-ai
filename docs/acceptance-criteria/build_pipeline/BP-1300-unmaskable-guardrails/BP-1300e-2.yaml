    angle: criterion
    description: "Run the deployed edit-time hook with ruff absent; stderr names check-lint-gate, contains no 'pre-commit ruff hook' sentence and no rule codes; check-lint-gate is an entry of the deployed generated pre-commit config (its reachability is proven by BP-1300e-1's tests)."
  - name: test_bp_1300e_2_exception_handling_section_names_the_real_config_and_carries_no_unread_rule_list
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: unit
    angle: real_artifact
    description: "Load the deployed commit_guardian.json: exception_handling._comment names no file absent from the repository (no pyproject.toml here), attributes no rule codes, and the section has no ruff_rules key."
  - name: test_bp_1300e_2_claiming_an_unapplied_rule_is_refused_naming_text_and_rule
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    must_catch:
      - "holds a written-in list of allowed or known rule codes"
      - "inspects only one of the configured texts"
    description: "Real commit in the fixture: edit the CLAUDE.md Error Handling Policy section to claim PLR0913 is enforced at commit time; refused naming CLAUDE.md and PLR0913. Repeated for the JSON comment text, so the refusal is not specific to one text kind."
  - name: test_bp_1300e_2_claiming_an_applied_rule_commits
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "Control: the same section edited to claim E722 commits."
  - name: test_bp_1300e_2_declaration_change_that_strands_a_claim_is_refused
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: boundary
    description: "CLAUDE.md claims TRY; a staged leafcutter-lint.json removes TRY from the only step selecting it; the commit is refused naming CLAUDE.md and TRY."
  - name: test_bp_1300e_2_edit_time_hook_behaviour_is_unchanged
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "With ruff installed, the deployed edit-time hook still exits 2 with E722 on a bare except and exits 0 with empty streams on a clean file (the existing test_exception_hook.py arms stay green unmodified apart from the replaced sentence)."
test_rationale: >-
  The drift arm is a gate, so it is tested by real commits that edit a claim,
  never by reading the texts: a test asserting today's texts are correct passes
  forever and catches nothing on the day the next false claim is written. The
  unapplied-rule input is repeated across two text kinds and paired with an
  applied-rule control and a declaration-side change, because the cheap
  implementations are a written-in allow-list (passes the control, fails the
  declaration arm) and a one-text reader (passes one kind only). The manifest
  content assertion is a unit read of the deployed artifact, which is acceptable
  because it is content, not a gate. Commit-path tests reuse
  _bp_1300e_lint_gate_fixture.py and declare @pytest.mark.shared_layout_reader
  with @pytest.mark.usefixtures("shared_reference_layout").
