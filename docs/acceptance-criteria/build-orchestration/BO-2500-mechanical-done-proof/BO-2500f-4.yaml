title: "Every layer that decides done waives the missing test only for a record whose verification record holds"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the layers that decide whether a record may be done: the mark command, the
    commit-time done check, the CI check over changed records, the CI sweep over all
    finished records, and the rule that rolls children up to a parent,
  When a test-free record with no covering test is evaluated by any of them,
  Then the missing covering test is waived only when the record's verification
    record holds: its shape is valid (BO-2500f-1, BO-2500f-1-i), a named check is
    tagged and wired (BO-2500f-2, BO-2500f-2-i), or an inspection's content is
    unchanged and its reviewer is a person (BO-2500f-3, BO-2500f-3-i),
  And a record carrying test_required false and a non-empty stated reason but no
    verification record that holds is refused, the reason given being that a stated
    reason alone no longer proves done,
  And the refusal names the part of the verification record that failed,
  And all layers reach the same verdict for the same record, because they consult
    one shared rule, and the earlier stated-reason rule (BO-2500a-1-ii) is replaced
    by it rather than kept beside it,
  And a parent whose children include a test-free child counts that child as
    proven only under the same rule,
  And the commit-time check is exercised the way a commit reaches it, and its
    result is the one a commit receives,
  And a record whose test_required is true or absent is judged exactly as before.
depends_on: [BO-2500f, BO-2500f-1, BO-2500f-2, BO-2500f-3]
