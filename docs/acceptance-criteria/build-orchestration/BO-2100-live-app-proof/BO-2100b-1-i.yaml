  post_write_commands:
    - "python -m pytest tests/test_port_registry.py -q"
  notes: |
    PortRegistry._is_enabled() must treat an absent live_surface_testing block, or an
    absent `enabled` key within it, as disabled (safe default false). When evaluated as
    disabled, no port may be allocated and no live-app check may run. A malformed or
    partial config block must be handled per the project error-handling policy (log at
    appropriate severity or raise a typed error) rather than defaulting to enabled or
    throwing on a missing key.
