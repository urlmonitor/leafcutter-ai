notes: |
  Known starting state, from the user's survey on 2026-08-25 — treat as evidence
  to verify, not as settled scope: roughly 25 registry entries currently declare
  a non-empty spawn allowlist, roughly 30 agent templates are granted the means
  to spawn, and 9 templates hold that means with an EMPTY allowlist. Those 9 are
  the drift this criterion is meant to make impossible; the exact counts must be
  re-measured at build time rather than hard-coded into a test.

  The two declarations (what the registry says an agent may do, and what the
  agent's own template actually grants it) must be reconciled with each other.
  A check that reads only one of them cannot see the drift, because the drift IS
  the disagreement between them.

  Boundary: INF-600g already covers agent-card / registry coherence in general
  and INF-600k covers tolerating non-agent external callers. This criterion is
  specifically about spawn AUTHORITY being a declared, validated property. Cite
  those, do not re-derive them, and do not add a thirteenth L1 to INF-600.

  IT-PO ENRICHMENT NOTE (2026-08-26). risk_surface is contract_boundary rather
  than internal: the reconciliation is a hard gate on the two declarations that
  every agent dispatch depends on, and a false verdict here stops the whole
  package assembling. The two declarations are `spawn_allowlist` in
  config/agent_registry.json and the `tools:` frontmatter of
  templates/agents/*.md. This L1's children all land in the assembly path
  (scripts/build.py -> scripts/registry_validator.py), which is why the
  deploy-manifest rule in CLAUDE.md applies to every one of them.
