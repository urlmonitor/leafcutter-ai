id: GE-125d-4
components:
  - security_scanner
  - commit_guardian
title: "You can ask the check what it declines to look at, and the answer describes what it does rather than what it meant to do"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given nothing is staged and no scan is running,
  When the check is asked to state what it declines to examine,
  Then it answers with one entry for each reduction in force, and each entry
    names the detection rule that is removed, the condition under which it is
    removed, and which detection rules still apply where the reduction applies,
  And the answer is obtained without the reader opening the check's source,
  Because the exemption this goal exists to close was discoverable only by
    reading the source, from the day the check shipped until the day somebody
    happened to read it — and a reviewer can only agree with a suppression they
    can see.

  Given two repository-relative paths whose treatment differs today — the check
    applies reduced scrutiny to "src/vendor/tickets/handler.py", which is
    measured as exempt and was never intended to be, and does not apply it to
    "src/app.py", which is measured as reported,
  When each of those two paths is classified using only the conditions the
    check's own answer states, and each is then actually checked on the path a
    real commit takes with an opaque credential-shaped value in it,
  Then the classification derived from the answer agrees with the observed
    treatment for both paths,
  Because an inventory that reported the INTENT would have described this
    reduction as four prose directories on the day it was measured to cover any
    path containing one of those four names at any depth, in any subtree — and
    that discrepancy is the entire reason the inventory is worth publishing. An
    answer that cannot be checked against behaviour is a second copy of the
    documentation that is already wrong.

  Given the answer above,
  When it is read,
  Then it contains no credential-shaped value, no matched line and no content
    from any file,
  And asking the question does not change the exit status of anything and does
    not block a commit,
  Because this is a description of policy, not a report of findings: it is safe
    to print anywhere, and it is a question a person asks rather than a gate a
    person trips.
