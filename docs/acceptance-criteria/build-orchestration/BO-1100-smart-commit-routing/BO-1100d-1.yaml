  - reason: "it-po (2026-09-29): added a non-empty test_spec (3 entries, one per Then clause: structural-shape fields recorded, durable persistence beyond the invocation, timestamp inclusion), each requiring the test to read back the real persisted record rather than grep source. Chose the test_spec branch over reclassification because this AC's criteria describe genuine executable behavior (a Python logging function producing a durable, inspectable record), assigned_agent is python-coder and change_target is code -- there is real code behaviour here to test, so reclassifying as docs/prompt would be dishonest. This gap was surfaced, not created, by the phantom-done work_status correction above: validate_test_contract only applies to a leaf code AC that is approved and not yet done, so while this record incorrectly carried work_status: done it sat outside the rule's scope; correcting the status to todo pulled it into scope and exposed the missing test contract. work_status, readiness, covered_by, and criteria left untouched."
