it_requirements:
  - "The answer must ride the EXISTING completion_manifest: block (templates/skills/signoff/SKILL.md §2b), under ONE fixed key token declared once and used verbatim in both templates/agents/test-writer.md Rule 3 and the signoff SKILL. Two spellings of the same key means the reader BP-1100g-5-i builds has to guess, which is the drift this tree exists to prevent."
  - "The reasoned negative must be a FIRST-CLASS, valid recorded outcome with the same standing as a covered seam — not a failure, not a skip, and not a bare false (the §2b Bare-False Rule makes a bare false malformed and triggers a supervisor retry). 'No seam applies, because this work is a pure function with no consumer outside its own module' is a good answer; forcing a fabricated seam claim is worse than no artifact at all, because it costs a real test's worth of effort and produces a false record."
  - "The reason is MANDATORY in the negative case. A negative with no reason must be expressible as a record — otherwise BP-1100g-5-i's 'reasonless' shortfall class has nothing to detect — but must be documented as non-conforming."
  - "The positive case must name both sides: the producing side and the consuming side. 'Seam covered: yes' is not an answer a reader can act on."
  - "EXACTLY ONE ANSWER PER PIECE OF WORK, NEVER PER RUN. A run-level answer lets one piece of work inherit another's. Wherever the record is emitted, the key must be scoped to the work item."
  - "REUSE BO-1000b-1-i's SHAPE AND CARRY ITS TRAP FORWARD: exactly one entry per required item, no gaps and no duplicates, reason carried with any skip. Its implementation shipped a double-recording bug because a skip-branch record was added while the pre-existing unconditional record after the if/else was left in place, and the structural test's regex matched only quoted-string arguments and was blind to template literals."
  - "The answer is a DECLARATION by the writer. It is not evidence that the seam test is any good, it feeds no done or pass decision, and nothing in this AC inspects a test to check it."
delivers_to:
  - agent: python-coder
    contract: "One completion_manifest key per work item answering the seam rule, in one of exactly two conforming shapes: a covered answer naming producing side and consuming side, or a not-applicable answer carrying a non-empty reason. Absent, reasonless, and duplicated are the three non-conforming states BP-1100g-5-i reads for and reports by name."
