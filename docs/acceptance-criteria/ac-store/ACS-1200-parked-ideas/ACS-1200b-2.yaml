id: ACS-1200b-2
components:
  - ac_store
title: "The orphan scan reports a parked tree as parked instead of as an orphan, and does not hide it"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200b.yaml
criteria: |
  Given the store contains KM-200.yaml carrying parked: true with the reason
    "captured as an outline; not decomposed yet" and an empty covered_by,
  And its six children KM-200a.yaml through KM-200f.yaml,
  When the store-wide orphan scan is executed as a process over the store,
  Then none of KM-200a through KM-200f appears in its orphan list,
  And KM-200 appears in a separate parked section of the same report, naming the
    six records it holds and the reason recorded on it,
  And the tree is therefore still visible in the report: a report in which
    KM-200 and its six children appear nowhere at all does not satisfy this
    criterion,
  And the scan's exit status is the same as it is for a store containing no
    parked tree,
  And a test that inspects the scan's source for a parked branch does not
    satisfy this criterion: coverage requires executing the scan and asserting
    the contents of the two sections of its report.
depends_on:
  - ACS-1200b
  - ACS-1200a-1
  - ACS-1200b-1
