# Ruff configuration for leafcutter-ai.
#
# Scope: the package's own Python sources and test suites
# (scripts/, tests/, unit_tests/). The templates/ tree is the package
# *source* that build.py compiles into scripts/; it carries ~900 pre-existing
# E501 line-length findings and is excluded here to keep CI focused. Linting
# templates/ to green is tracked as a follow-up. Parity between templates/ and
# scripts/ is already guarded by the check-build-drift pre-commit hook.
#
# Also excluded: scripts/commit_guardian/, scripts/doc_compliance/, and
# scripts/feedback/ are BUILD OUTPUTS (generated by build.py from templates/ —
# see .gitignore lines 1, 7-9). Their source of truth is templates/scripts/...;
# editing the compiled copies directly causes build drift. They are linted at
# their template source instead (when the templates/ exclusion is lifted), not
# here, so CI never asks a contributor to hand-edit a generated file.
#
# Rule selection rationale:
#   E, F  — pyflakes + pycodestyle errors (unused imports/vars, real bugs).
#   E722  — bare-except. Codifies "Rule 2" of the Error Handling Policy in
#           CLAUDE.md. The broader BLE001 / TRY family documented there is a
#           larger cleanup (26 findings in scripts/) and is deferred.

target-version = "py313"
line-length = 100

extend-exclude = [
    "templates",
    ".leafcutter",
    # Build outputs (generated by build.py from templates/) — see header.
    "scripts/commit_guardian",
    "scripts/doc_compliance",
    "scripts/feedback",
]

[lint]
select = ["E", "F", "E722"]

# `default-path-smoke` is the commit-guardian placeholder-defaults hook's own
# escape-hatch code, written as `# noqa: default-path-smoke <reason>` (matched
# literally by check_placeholder_defaults.has_noqa_suppression). Declaring it
# external tells Ruff it belongs to another linter, so Ruff does not emit a
# malformed-`# noqa`-directive warning for those lines.
external = ["default-path-smoke"]

ignore = [
    # E501 (line-too-long) is widespread here and orthogonal to the correctness
    # rules this gate enforces.
    "E501",
    # E402 (import-not-at-top): the package's scripts are not installed as a
    # module, so both scripts/ and the test suites resolve the project root at
    # runtime (find_project_root() / sys.path.insert) before importing sibling
    # modules. This deliberate idiom trips E402 throughout; suppress it.
    "E402",
]
