id: GE-116
components:
  - commit_guardian
title: "Self-contradictory settings are caught when you commit, not after they break the build"
component: guardrail-engine
level: L0
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  A setting that contradicts itself is blocked at commit — it never reaches main.

  When part of the project's own configuration contradicts itself, that mistake
  used to slip through review and only surface after merge — breaking the next
  build for everyone. This goal moves the check to the moment of commit: a
  self-contradictory definition is caught and stopped before it can be shared,
  with a message that pinpoints the problem and the fix. A broken setting can no
  longer travel from one person's commit into everyone's build.
