title: "A re-home that would make a requirement its own ancestor is rejected"
component: ac-store
level: L3
status: active
req_status: approved
work_status: todo
criteria: |
  Given a requirement with UID 10 that is an ancestor of the requirement with
    UID 42 (10 is 42's parent, grandparent, or higher),
  When an operation attempts to re-home UID 10 so that its new parent is UID 42,
  Then the operation is rejected with an error naming the cycle it would create
    (for example "10 -> 42 -> 10"),
  And neither requirement's parent-pointer field is changed,
  And re-homing a requirement under an unrelated parent that creates no cycle
    still succeeds.
