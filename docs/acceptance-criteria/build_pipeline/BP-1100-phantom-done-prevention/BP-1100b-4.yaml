  - reason: "F3/F4/F6/F7 fixed after an independent adversarial review (Fable-5) found the sandbox escapable and strict mode silently lost; F1/F2/F5 findings against this AC are corrected or noted, not this AC's own to hold work_status hostage to"
    by: python-coder
    at: 2026-08-26
    note: >-
      The review found, by direct execution, that `vm.createContext()` on a
      plain object literal left the sandboxed body's `globalThis` prototype-
      chained to the DRIVER realm's `Object.prototype` (F3): `globalThis.
      constructor.constructor('return process')()` returned a live `process`
