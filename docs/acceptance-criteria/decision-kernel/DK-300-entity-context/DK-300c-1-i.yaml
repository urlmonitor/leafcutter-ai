id: DK-300c-1-i
title: "Missing or unusable indexes never trigger broad pre-intent fallback"
component: decision-kernel
components: [decision_kernel]
level: L3
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given an index is missing, unreadable, corrupt, schema-incompatible, from another repository or workspace, stale for changed source content, or incomplete for a supported family,
  When a new initial recognition pass attempts to use it,
  Then unusable families contribute no meaning cards and the outcome is unavailable or partial according to the usable coverage,
  And the limitation identifies the affected permitted family without leaking excluded entities,
  And the pass performs no repository crawl, lexical body search, embeddings, wildcard search, graph expansion or full synchronous index rebuild,
  And later routed retrieval remains a separate task-evidence operation.
depends_on: [DK-300c-1]
