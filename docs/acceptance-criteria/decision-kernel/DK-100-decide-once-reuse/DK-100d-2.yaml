roadmap_phase: phase_kernel_1_founding
criteria: |
  Given a staged record for run R that names the component decision_kernel and the roadmap phase
    phase_kernel_1_founding,
  When the publish command validates it,
  Then its schema, its links, and its component and roadmap-phase values are checked, the values
    against docs/components.json and docs/roadmap.json,
  And every check finishes before any file under docs/decisions/ is created or changed.
