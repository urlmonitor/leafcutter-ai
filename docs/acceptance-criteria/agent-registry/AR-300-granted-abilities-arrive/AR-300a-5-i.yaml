notes: |
  SIX, NOT FIVE (BrainCandy decision, 2026-10-09). ticket-supervisor's
  hand-written fenced list under "### Spawn Allowlist (is_ticket_phase agents)"
  is a second hand-written sub-agent account and is removed, same as the five
  tables. The rule covers any hand-written sub-agent account, table OR list.
  Where the paragraphs below say "five" or "tables", read them as the measured
  table population of 2026-10-09; the governing count is six accounts.

  THE FIVE, MEASURED 2026-10-09: business-analyst, frontend-coder, test-writer
  (MATCH the registry); python-coder (table adds test-runner); architect-review
  (table omits architect-review-deep). llm-expert has no table -- it only names
  the heading inside its review-checklist prose -- and is the control case for
  the prose clause. The user decision text says "six" tables; five is what the
  measurement found.

  RESOLVING THIS MEANS DELETING THE FIVE BODY TABLES, not suppressing delivery.
  The surviving account must be the delivered one, because only it is held equal
  to the declaration. And the deletion must come AFTER the union consolidation in
  AR-300c-5-i, or python-coder's test-runner permission (table-only today) is lost
  rather than carried across.

  WHY THE EQUALITY CLAUSE IS LOAD-BEARING. Two of the five tables already
  disagree with the registry today. That is the drift a hand-written list
  produces with nothing comparing it -- the defect this rule exists to stop, not a
  hypothetical.

  THE PROSE CONTROL CLAUSE IS NOT PADDING. AR-200b-1 records in this component
  what happens to a detector that matches a heading string ordinary prose also
  produces: it fires across the tree and gets switched off. llm-expert's checklist
  is exactly such prose (and AR-300c-5-iv rewrites it so it stops requiring the
  table).
