id: DK-300d-2
title: "Optional context fits the exact serialized receiver allowance"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given the unchanged goal and required classifier envelope fit a configured receiving-model limit,
  And caller claims plus compact entity meanings would exceed its remaining allowance,
  When a provider request is projected for intent or a later native judgment,
  Then the exact serialized request stays within that receiver's configured limit,
  And the unchanged goal and required envelope receive space before optional caller claims and entity projections,
  And optional context is trimmed or omitted with counts and reasons without rewriting the full checkpoint,
  And representative mention projection preserves canonical identities, occurrence counts, trust boundaries and meaning-only provenance when retained,
  And the context allowance never enlarges the receiver's limit.
depends_on: [DK-300d]
