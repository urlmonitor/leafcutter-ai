notes: |
  WHAT THIS RECORD OWNS: the fate of the change. Not who does the tidying (BO-3800b),
  not what they are told (BO-3800c), not what happens when it still fails (BO-3800d).

  THE TWO FAILURES IT EXCLUDES, BOTH OF WHICH LOOK LIKE SUCCESS FROM A DISTANCE. The
  change discarded or rolled back so the restructuring starts from a clean file and the
  author's work is silently gone; and the change forced through unchanged once someone
  has "dealt with" the refusal. Either satisfies a naive reading of "the handoff
  happened" while destroying the reason for having one.

  THE RETRY IS PART OF THIS PROMISE, NOT A SEPARATE ONE. Holding a change that is never
  re-offered is the same outcome as losing it, from the point of view of the person
  waiting for it to land. Decomposition must keep the two halves in one record so an
  implementation cannot satisfy the hold and quietly drop the retry.

  HOW IT IS PROVABLE. By observing a run: the change is still present and unaltered after
  the refusal, delivery is attempted again after the restructuring, and no later step ran
  in between. Per CLAUDE.md, a test that reads a workflow file for the presence of a retry
  branch is not coverage — it stays green on a branch nothing reaches.
