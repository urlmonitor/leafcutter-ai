assigned_agent: python-coder
estimated_complexity: M
delivers_to: null
expects_from:
  ac_id: DK-400d-1
  contract: The gate answer schema and approval path of DK-400d-1, here with per-part reviews edited and left_out
    and a note.
it_requirements:
  - Edits and a subset combine in one approval. An edited part keeps covers unchanged, records proposed_text (the
    host's words) and text (the person's words), and runs with text as its question.
  - A left-out part gets review left_out and outcome not_run and never gets a work item. A kept part's dependency
    on a left-out part is released (it starts without it and never gets waited_for), and the release is recorded
    as a run event.
  - The note is stored word for word (only leading and trailing whitespace may be trimmed) within the configured
    input limits.
  - An edited text is bounded like a goal (1 to 4000 characters) and is not quote-checked (DK-400d-2-ii).
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_reword_and_leave_out_in_one_approval
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: Rewording p2 and unticking p3 in one approval records p1 kept, p2 edited with both texts and its
      quote unchanged, p3 left out, and the note word for word.
  - name: test_edited_part_runs_with_reworded_question
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: seam
    description: p2's decision work item asks the reworded text, and p3 never gets a work item.
  - name: test_dependency_on_left_out_part_released
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: A kept part that waited only for a left-out part starts without waiting and has no waited_for.
test_rationale: The edited text must reach the part's own decision, which only a seam test across the gate and the
  scheduler shows.
