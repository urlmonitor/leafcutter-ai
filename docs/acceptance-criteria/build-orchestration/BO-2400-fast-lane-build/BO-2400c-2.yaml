amended_by:
  - agent: BrainCandy
    date: "2026-08-19"
    reason: "Re-specified from configuration to measurement. The prior version required an extended one-hour cache_control TTL. That knob does not exist and cannot: the string cache_control appears nowhere in scripts/, templates/ or config/ (verified 2026-08-18 and again 2026-08-19), and the 'cache breakpoint' is a literal <!-- CACHE_BREAKPOINT --> HTML comment inside a prompt string — a textual convention, not a provider cache-control block. leafcutter never issues the model API call; the workflow engine's agent() does, and it is handed plain prompt text. Building the criterion as written would have produced a config value nothing reads — a new phantom-done inside the feature built to prevent phantom-done. Replaced with the honest, observable half of the same intent: the drive states, in its own record, whether the stable prefix it presented held across its invocations and how many invocations shared it. Stripped from it_requirements: the config_schema_fragment.cache_ttl block, its enum ['1h'], and both constraints referencing cache_control / the provider default short TTL."
