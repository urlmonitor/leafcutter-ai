it_requirements:
  - "The confidence score is produced by the classifier agent template (templates/agents/feedback-classifier.md) as part of its structured output record, on a 0.0-1.0 scale"
  - "The score must reflect how completely the entry's own fields supported the classification (complete unambiguous entry scores higher than a thin or vague one); it must be deterministic for identical input per ACD-1500a-4"
  - "The output contract must guarantee a confidence field is always present so the router (python-coder) can enforce 'no entry reaches a destination without a confidence score' at the gate"
delivers_to:
