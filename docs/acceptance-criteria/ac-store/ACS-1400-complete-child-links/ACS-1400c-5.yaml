criteria: |
  Given a person who has not worked on the requirement store before and has only
    the written guide,
  When they follow it to run the adjudicated pass against the real store and read
    what comes back,
  Then they can state, for any record in the report, whether it was repaired or
    left alone and why,
  And they correctly conclude that a run finishing with records still left alone
    is a successful run rather than an incomplete one,
  And the guide tells them how to supply the adjudication the pass requires and
    what happens if they do not,
  And the guide states that the pass does not change any record's finished state
    and names where that decision is made instead.
