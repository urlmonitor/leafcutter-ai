id: BO-3200a-3
title: "Reference documentation tells a workflow author which questions a specialist may be asked"
component: build-orchestration
components:
  - documentation_system
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an author adding a step that needs to know something about the project,
  When they open the reference documentation for obtaining facts,
  Then it states that a value the build branches on is read at its source, states that a
    judgement may be asked of a specialist, gives the test that separates the two — whether the
    build would still work if no party could be asked to judge anything, with only the chartered
    executor carrying out exact commands — and states how to obtain such a value with no
    judgement requested: through an exact command carried out by the chartered executor, linking
    to the reference that describes the executor rather than restating it.

  Given the reference documentation,
  When each rule it states about what is permitted is applied to a path and that path is
    exercised in an environment in which no party can be asked to judge anything -- the only party that
    can be dispatched is one chartered to carry out an exact command and return its output
    verbatim, whose charter admits every exact command so it has no grounds to decline one, and
    which treats whatever it receives as a literal command and so gives no answer to a request
    to look, decide, interpret or summarise; every dispatch to any other party fails
    immediately,
  Then a path the documentation calls permitted completes, and a path it calls forbidden is
    reported by the sweep.
