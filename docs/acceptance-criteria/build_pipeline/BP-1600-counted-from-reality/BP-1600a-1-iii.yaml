id: BP-1600a-1-iii
components:
  - build_pipeline
  - precommit_hooks
title: "A script deliberately left unwired is recorded with a ground that names where its fate is decided, and the census quotes the ground without saying what should be done; a record stating only that a decision is pending is refused and the script it names stays reported"
component: build-pipeline
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given some of the scripts kept in that place are deliberately not run — one whose
    detection is being folded into another check, one whose wiring is held back
    until a repair it would obstruct has landed,
  And there is a register of deliberately-unwired scripts in which each record names
    one script and states the ground on which it is not run, and that ground names
    the record in which that script's fate is decided,
  When the census runs,
  Then a script whose record states such a ground is reported as deliberately
    unwired, quoting the ground, is not counted among the scripts nothing runs, and
    does not fail the run,
  And the census states nothing about what should become of that script — being
    wired, being folded into another check, and being removed are all outcomes a
    ground may name, and choosing between them is never the census's to do,
  And given a record that names a script and states no ground, or states only that a
    decision has not yet been taken,
  When the census runs,
  Then that record is reported as refused, and the script it names is counted among
    the scripts nothing runs and fails the run — a postponement is not a ground,
  And given a record whose ground names a decision record that does not exist, or one
    that exists and does not itself name that script,
  When the census runs,
  Then that record is reported as refused in the same way, so a citation cannot serve
    as cover without the thing it cites saying anything,
  And given a record naming a script no longer present in that place,
  When the census runs,
  Then that record is reported as stale and named, so the register cannot accumulate
    cover for scripts that no longer exist,
  And given a script that is present, is run by a wiring, and also carries a record,
  When the census runs,
  Then it is reported as run and the redundant record is named,
  And the number of scripts treated as deliberately unwired is stated in the run's
    summary alongside the number examined and the number reported, so the size of the
    register is visible in every run rather than only on inspection.
depends_on:
  - BP-1600a-1
