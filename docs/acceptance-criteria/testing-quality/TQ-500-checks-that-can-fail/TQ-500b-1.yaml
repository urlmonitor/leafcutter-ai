id: TQ-500b-1
components:
  - testing_quality
  - build_pipeline
title: "Answer taken, answer not owed, answer owed and absent — three states, never two"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the hand-off records a run produced for three pieces of work:
      piece A, whose record carries a conforming falsifiability answer,
      piece B, whose test-writing phase ran and handed the work on but whose record
        carries no falsifiability answer at all,
      and piece C, for which no test-writing phase was required and none ran,
  When those records are read,
  Then each piece of work is placed in exactly one of three states, each named in
    the output — answer taken, answer not owed, or answer owed and absent,
    And piece A is answer taken, piece B is answer owed and absent, and piece C is
      answer not owed,
    And piece B is reported in words stating that the work is incomplete, and in no
      words stating that the question did not apply to it,
    And piece B and piece C are distinguishable in the output, so a reader cannot
      take one for the other,
    And the state given to each piece of work is established from the records the
      run actually produced, not from whether the writing side was observed to have
      been asked for an answer,
    And the falsifiability answer is read by the same reading of the hand-off record
      that reports on the record's other machine-checkable answers, so a record
      missing two different required answers yields both findings from one reading
      rather than requiring a second.
depends_on:
  - TQ-500b
  - BP-1100g-5-i
