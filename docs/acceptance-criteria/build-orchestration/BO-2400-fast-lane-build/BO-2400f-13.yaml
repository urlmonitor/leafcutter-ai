id: BO-2400f-13
components:
  - build_orchestration
title: "An occupied build workspace ends the run in a named refusal, not a first-phase collapse"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given an operator points the fast lane at an acceptance criterion,
  And the workspace that run resolves to for that criterion is already occupied —
    something already sits at the location the lane would open, or the build branch
    that criterion resolves to is already checked out somewhere else,
  When the run reaches its first phase, before it resolves the connected build set
    and before it dispatches any agent,
  Then the run recognises the occupant, rather than attempting to open the workspace
    regardless and discovering the collision only when the attempt fails,
  And the run's terminal outcome is a refusal: it is not reported as a successful
    run, it does not report a blank or absent workspace location, and it never
    asserts that a pull request was opened,
  And the refusal names, in one message, both the acceptance criterion the operator
    asked for and the occupied location,
  And the refusal states what the operator can do next, and for each option says
    plainly whether taking it throws anything away, so clearing empty residue and
    throwing away unsaved work are never offered as the same gesture,
  And nothing the operator reads is the underlying version-control tool's own
    diagnostic text.

  Given two runs are pointed at the same acceptance criterion,
  When the second starts while the first still holds its workspace,
  Then the second resolves to the same workspace location as the first — the
    location is derived from the acceptance criterion's identity alone and carries
    no per-run discriminator — and so it refuses,
  And it does not open a second, differently named workspace for the same
    acceptance criterion, because one criterion being taken twice is settled by the
    claim rules (BO-2400f-8) and not by inventing a second directory,
  And the refusal holds even when the location itself is free, because the build
    branch for that criterion can only be checked out in one place at a time.
depends_on: [BO-2400f, BO-2400f-3]
