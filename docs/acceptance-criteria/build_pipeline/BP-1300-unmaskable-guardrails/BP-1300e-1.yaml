assigned_agent: python-coder
estimated_complexity: L
package_surface: true
it_requirements:
  config_schema_fragment:
    _declares: >-
      ONE NEW MEMBER appended to the EXISTING hooks_manifest.hooks array of
      templates/scripts/commit_guardian/commit_guardian.json -- the commit-time
      counterpart of CI's required 'Lint (ruff)' job. It is NOT a new top-level
      key, and the lint scope and second-step rule set are deliberately NOT stored
      in this file: commit_guardian.json is package-managed and rewritten by
      build.py in every adopter install, so an adopter's scope written here would
      be lost on their next build. The scope lives in the project-owned
      declaration leafcutter-lint.json (BP-1300e-1-i). Every property below is
      already carried by an existing member, verified 2026-10-09: always_run
      (check-build-drift), verbose (check-identifier-uniqueness),
      negative_control (check-negative-control-liveness); id/tier/name/entry/
      language/stages/pass_filenames/change_set_source on every member.
    type: object
    required:
      - id
      - tier
      - name
      - entry
      - language
      - stages
      - pass_filenames
      - change_set_source
      - always_run
      - verbose
    properties:
      id:
        const: check-lint-gate
      tier:
        const: judgment
      name:
        type: string
        minLength: 1
        description: "Must say it mirrors CI's required 'Lint (ruff)' check, e.g. \"Check Lint Gate (mirrors CI 'Lint (ruff)')\"."
      entry:
        type: string
        pattern: "run_hook\\.py .*check_lint_gate\\.py"
        description: "python {{config.output_root}}/scripts/commit_guardian/run_hook.py {{config.output_root}}/scripts/commit_guardian/check_lint_gate.py -- staged mode is the default; no mode flag needed."
      language:
        const: system
      stages:
        const:
          - pre-commit
      pass_filenames:
        const: false
      change_set_source:
        const: handed_by_commit_path
      always_run:
        const: true
      verbose:
        const: true
      negative_control:
        type: object
        description: "GE-120f shape (config/verification_flow.schema.json $defs/negative_control), falsifiable form: input = a staged file under a declared tree carrying E741; expected_result = non-zero exit naming the path, line and E741; currently.state = unverified until the liveness runner has executed it. not_applicable is forbidden -- this check can refuse."
    not:
      anyOf:
        - required:
            - files
        - required:
            - types
        - required:
            - types_or
        - required:
            - exclude
  reference_file_path: templates/scripts/commit_guardian/commit_guardian.json
  n_location_rule: >-
    1 -- exactly one member appended to hooks_manifest.hooks, positioned AFTER
    every tier: transform entry so it judges content after any transform hook has
    re-staged. No top-level key is added, renamed or removed by this AC
    (exception_handling is BP-1300e-2's).
  required_skills:
    - python-coder
  post_write_commands:
    - "python scripts/build.py --target-dir <a fresh temporary directory>  (never the workspace parent: KI-BP-016 overwrites docs/INDEX.md)"
    - "python -m pytest unit_tests/commit_guardian/test_bp_1300e_1.py -q"
    - "python -m pytest unit_tests/commit_guardian/test_hook_registration_inventory.py -q"
  constraints:
    - "CANONICAL SOURCES (ADR-001). The gate is a NEW script templates/scripts/commit_guardian/check_lint_gate.py. Its two helpers live beside it: _lint_scope.py (declaration reader, owned by BP-1300e-1-i) and _ruff_locator.py (ruff discovery, owned by BP-1300e-1-iii). build_commit_guardian() deploys that directory with rglob, so no deploy_map edit is needed IF AND ONLY IF all three stay in templates/scripts/commit_guardian/. Do not place any of them under scripts/ (repo-only, never deployed) or templates/scripts/ac_store/ (hard-coded deploy_map). Underscore-prefix the helpers, matching _resolve_root.py, so the disk-to-registry census (test_hook_registration_inventory.py / BP-1600a-2) does not count them as unregistered gates."
    - "NO TREE NAME AND NO RULE CODE IN THE SCRIPT. The hook iterates the steps declared in leafcutter-lint.json and nothing else. A literal 'kernel', 'scripts', 'E722', 'BLE001' or 'TRY' anywhere in check_lint_gate.py is a defect: it is how the negative arm (BLE001 under scripts/ commits) gets passed by accident and how the declaration silently stops being the only definition. A step with no 'select' uses the project's own ruff configuration selection; a step with 'select' passes it as ruff --select, which REPLACES the selection while the configuration's exclude, ignore and per-file-ignores still apply -- exactly the semantics of CI's second step today."
    - "RUFF ARGV IS BUILT IN ONE PLACE AND ALWAYS CARRIES --force-exclude. Never --isolated, never a hook-synthesised --config, never --fix or --unsafe-fixes, never --exit-zero. Output format concise (path:line:col: CODE message) parsed into structured findings; an unparseable ruff output line is could_not_check, not ignored."
    - "ALL FINDINGS BEFORE ONE VERDICT. Run every declared step over every in-scope staged file, then decide. Each finding carries repo-relative POSIX path, line, column, rule code, message and the declared step name. A finding produced by more than one step for the same (path, line, code) -- E722 under kernel/ is selected by both steps -- is reported ONCE. A refusal that lists only the first step's findings fails the 'reported together' arm."
    - "VISIBLE OUTCOME ON EVERY PATH. Use templates/scripts/commit_guardian/check_outcome.py's vocabulary (GE-120a-1): RESULT: ok after a clean run, preceded by a line naming how many staged files were inspected and which; RESULT: nothing_to_inspect and RESULT: could_not_check per BP-1300e-1-iii. A refusal needs a value too: add OUTCOME_REFUSED = 'refused' to check_outcome.py itself, with a DECISION HISTORY entry, exactly as GE-120e-1-i and UXP-700c-3-ii added theirs. Never declare an outcome constant locally in check_lint_gate.py. verbose: true on the entry is required, because pre-commit hides a passing hook's output and the clean arm requires the inspected-files line to be seen."
    - "NO files / types / types_or / exclude ON THE ENTRY. Ruff's own include/exclude decides which files are lint subjects. A pre-commit types filter would be a second, private membership list: a file ruff's include admits but `identify` does not type as python would be skipped at commit time and linted by CI, which is the reverse half of the disagreement this L1 forbids. check_hook_trigger_reachability.py also reports always_run combined with a files filter as a self-contradiction and fails the run."
    - "PRINT THE RUFF VERSION USED; THE PIN IS ENFORCED BY BP-1300e-1-v. CI installs ruff from requirements-dev.txt (line 29, ruff==0.15.15, via ci.yml's lint job `pip install -r requirements-dev.txt`; ci.yml itself carries no version). A local ruff of another version can give a different verdict on the same content, so BP-1300e-1-v (user decision 2026-10-09) refuses the commit as could_not_check, reason linter_version_mismatch, reading the required version from the file named by leafcutter-lint.json's linter_version_source (default requirements-dev.txt). This AC's obligation is only that the version used appears in the hook's output on every path where ruff was probed; the earlier 'not enforced -- recorded as a caveat' position is retired."
    - "PACKAGE SURFACE. The commit that adds the entry must cite BP-1300e-1, which carries package_surface: true, or check-package-surface-declaration refuses it (_package_surface_registry.WATCHED_REGISTRIES watches hooks_manifest.hooks by id). Reduce nothing and add nothing in test_hook_registration_inventory.py's UNREGISTERED_BASELINE unless its staleness assertion demands it."
    - "THE EDIT-TIME HOOK IS NOT TOUCHED HERE. templates/hooks/check_exception_handling_hook.py's message and behaviour are BP-1300e-2's. This AC registers the commit-time check that BP-1300e-2's corrected text will point at."
    - "ERROR-HANDLING POLICY (CLAUDE.md Rules 1-4): every git and ruff subprocess call is wrapped in a specific except (OSError, subprocess.SubprocessError), logged at WARNING, and converted to could_not_check per BP-1300e-1-iii. No bare except; no try/except around the pure argv-building and output-parsing functions."
    - "VERIFY BEHAVIOURALLY THROUGH A REAL COMMIT. Every test drives an ordinary `git commit` in a temporary repository whose .pre-commit-config.yaml carries check-lint-gate ALONE and whose entry points at the DEPLOYED scripts of the shared reference layout. A test that reads hooks_manifest as text proves nothing (CLAUDE.md 'Gate / Workflow ACs -- Verify Behaviorally, Not by Grep')."
test_spec:
  - name: test_bp_1300e_1_e741_under_unit_tests_is_refused_naming_path_line_and_rule
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "Staged unit_tests/x.py introducing `l = 1` at line 12; ordinary git commit is refused and the output names unit_tests/x.py, 12 and E741."
  - name: test_bp_1300e_1_ble001_under_kernel_is_refused_naming_path_line_and_rule
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "Staged kernel/y.py with `except Exception:` at line 30 is refused, naming kernel/y.py, 30 and BLE001."
  - name: test_bp_1300e_1_ble001_under_scripts_commits_because_step_two_is_kernel_only
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    must_catch:
      - "applies the second step's rule set to every declared tree"
      - "merges both steps into one ruff invocation with the union selection over all trees"
    description: "The same `except Exception:` staged under scripts/ (no other violation) commits; the commit exists afterwards in git log."
  - name: test_bp_1300e_1_both_steps_findings_reported_in_one_refusal
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    must_catch:
      - "returns after the first step that finds anything"
    description: "One commit staging the E741 file under unit_tests/ and the BLE001 file under kernel/ is refused once, and the output names both findings with path, line and rule."
  - name: test_bp_1300e_1_clean_change_commits_and_names_the_files_inspected
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "Clean staged files under scripts/ and kernel/ commit; the hook's visible output says it inspected exactly those files, emits RESULT: ok, and the pre-commit line for the hook reads Passed."
  - name: test_bp_1300e_1_ordinary_commit_reaches_the_deployed_gate
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: "git commit -> pre-commit (installed via `pre-commit install`) -> <shared layout>/.leafcutter/scripts/commit_guardian/run_hook.py check_lint_gate.py"
    description: "With the hook installed by `pre-commit install` and no other command, a commit carrying E741 is refused and the refusal text originates from check_lint_gate.py in the shared deployed layout (not the template source)."
test_rationale: >-
  Every arm is about a real commit being refused or completing, so every test
  drives an ordinary `git commit` through a real `pre-commit install` in a
  temporary repository. Build that once as a shared fixture module,
  unit_tests/commit_guardian/_bp_1300e_lint_gate_fixture.py, modelled on
  _ge_127a_1_ordinary_commit_fixture.py: .pre-commit-config.yaml carries
  check-lint-gate ALONE (so no unrelated hook can fail the commit), the fixture
  copies this repository's real ruff.toml and real leafcutter-lint.json (real
  artifact, not a hand-typed lookalike), and the hook entry points at the
  DEPLOYED scripts of the session's shared reference layout. Tests that do this
  read the deployed layout and must declare it: @pytest.mark.shared_layout_reader
  together with @pytest.mark.usefixtures("shared_reference_layout") on any
  unittest.TestCase class (without the usefixtures line the integrity plugin
  fails the session while printing 'clean', KI-TQ-20261009). No test here spawns
  its own build.py. The scripts/ arm is the one a cheap implementation fails
  silently in the safe-looking direction, so it carries must_catch entries and is
  asserted on the commit actually existing, not on exit code alone.
delivers_to:
  - agent: python-coder
    contract: >-
      To BP-1300e-2: a registered, running commit-time check with hooks_manifest
      id check-lint-gate, whose applied rule set is exactly what
      leafcutter-lint.json plus the project's ruff configuration select. The
      corrected texts name this id and point at the declaration; they enumerate
      no rule codes of their own except where BP-1300e-2-i requires it.
  - agent: how-to-author
    contract: >-
      To BP-1300e-3: the refusal format -- one line per finding
      '<repo-relative path>:<line>:<col>: <CODE> <message> [step: <step name>]',
      an optional 'predates this change' suffix (BP-1300e-1-ii), a final
      'RESULT: refused|ok|nothing_to_inspect|could_not_check' line, and the
      ruff version used.
expects_from:
  ac_id: BP-1300e-1-i
  contract: >-
    _lint_scope.load(subject_root, source='index'|'worktree') returning the
    ordered declared steps [{name: str, paths: [str], select: [str] | None}] or
    raising a typed declaration-unreadable error naming the file and the offending
    key; and the single ruff-argv builder shared by the staged, full and files
    modes of check_lint_gate.py.
