delivers_to:
  agent: python-coder
  contract: "Consumed by KM-400d-4-iii. When the deadline passes, the retrieval path knows which step was in progress (one of \"name lookup\", \"connect\", \"query\") and the elapsed milliseconds already spent in that step on the retrieval clock, and makes both available to the result builder before the answer is printed, even while the abandoned call is still blocked. Delivered in-process."
