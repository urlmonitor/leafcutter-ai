title: "A prerequisite that records the criterion as its child is treated as its structural parent, even when the ids do not show the link"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an acceptance-criterion store containing a parent criterion P-590 whose
    covered_by lists seven not-done children [P-510, P-511, P-512, P-513, P-514, P-515, P-516],
    where no child id has the shape of a P-590 descendant (so the parent cannot be
    inferred from the child's id),
  And P-512 lists P-590 in its depends_on and has no other prerequisites and no children,
  And P-515 is assigned to a different implementing agent than P-512,
  When the connected build set for P-512 is resolved with structural-parent
    prerequisites excluded,
  Then P-590 is recognised as P-512's structural parent because P-590's covered_by
    lists P-512, and P-590 is neither added to the set nor expanded,
  And the resolved set is exactly [P-512],
  And none of P-510, P-511, P-513, P-514, P-515, P-516 appear in the set, and nothing
    reachable only through P-590's own prerequisites appears in the set,
  And a parent whose id shape does show the link (e.g. BO-2600a for BO-2600a-6) is still
    recognised and excluded exactly as before: the recorded-edge rule is added to the
    id-shape rule, not substituted for it.
depends_on: [BO-2600a, BO-2600a-1]
