roadmap_phase: phase_1
change_target: docs
risk_surface: internal
criteria: |
  Given a person whose request to clear a workspace stopped part-way, or who
    finds a leftover folder in the landing place whose repository is damaged or
    whose workspace record is gone,
  When they open the how-to guide for clearing a workspace,
  Then it shows that a clearing that stopped part-way is finished by making the
    same request again, with no token,
  And it shows that asking for the workspace of that work, or asking where it
    is, while a clearing has stopped part-way reports it as half-cleared and
    tells them to clear it again,
  And it shows that a leftover whose repository can no longer be read is refused
    as half-cleared with its remaining files listed, that its commits cannot be
    checked, and how to authorise the loss with the token from that refusal,
  And it shows that a leftover with no workspace record is treated as
    half-cleared only when a leftover piece of its repository names this
    project's shared project, and is otherwise refused "not found" with nothing
    changed,
  And it gives no manual deletion steps that bypass the workspace maker,
  And the reference listing the maker's answer codes and fields describes each
    new or changed answer by its code and by the fields it carries.
depends_on: [BO-4300e-5, BO-4300e-5-i, BO-4300e-2-ix, BO-4300e-2-x, BO-4300e-2-xi, BO-4300e-2-xii]
