id: BP-1200a-1
title: "Full test suite passes on a fresh clone using the documented CI test command"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a brand-new checkout of the project obtained by cloning the repository
    into an empty directory (no pre-existing local build outputs, caches, or
    artifacts from prior local work are present),
  When an operator follows the documented CI test command exactly as published
    (install the development dependencies, perform any preparation step the
    documented procedure prescribes, then run the full test suite over both the
    integration test directory and the unit test directory),
  Then every test in the full suite reports a passing result
  And the run completes with a non-failing overall outcome
  And no test fails because a file or module it needs to load is absent from the
    fresh checkout.
