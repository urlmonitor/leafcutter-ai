notes: 'Audit 2026-11-16 section 3.2: the existing oracle discipline (Git-anchored, hashed, separate from actual output)
  is the hard part and is kept. What it lacks for S1 is a second reviewer and any evidence that reviewers did not see
  system output; "blind host" was a policy statement with nothing recorded. The listed-inputs check turns that policy
  into something a test can refuse. Draft. IT PO 2026-11-17: adjudication is by the user only (decision from the main
  loop); the earlier option of a third separate dispatch as adjudicator is withdrawn. The reviewer, adjudication, oracle
  and lock files are produced by the S1 data run KM-500a-4-x and were removed from this record''s declared_files; this
  record owns the code that checks and freezes them. The not_run reason for a missing lock is "S1 not frozen".'
