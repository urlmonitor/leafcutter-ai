assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The change must land under templates/. The deployed workflow carries no charter gate at all today, so this guard is also what stops a future build shipping a gate that halts selectively (see ACD-2100d-3)."
  - "The halt must hold for every outcome in which the check did not establish a permitted verdict -- including outcomes not enumerated by ACD-2100b-1 through -3. A guard written as a list of four conditions is satisfied by an implementation that fails open on the fifth."
  - "Absence of dispatch must be established from the run's own record of what it dispatched, and absence of a worktree from the filesystem after the process exits. Reading the source to confirm a return follows the check proves nothing about whether the check is reached."
  - "The recorded outcome must not be a success outcome. This constrains only the success/non-success distinction -- it does not specify the status vocabulary and does not touch the cancellation return path, which is out of scope for this tree (KI-ACD-006)."
  - "Must not weaken the halt to a warning for any outcome. Three of the four causes are not permission problems, and the tempting conclusion that three of the four should therefore not block is the specific regression this record exists to prevent."
  - "Must satisfy the repository error-handling policy on every one of the four paths."
test_spec:
  - name: test_all_four_startup_check_conditions_stop_the_run_at_the_check
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Four runs, one per condition -- unreadable, uninterpretable, agent absent, agent
      denied -- each stops at the startup check and no step after the check runs.
  - name: test_no_authoring_agent_is_dispatched_in_any_halted_run
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: reachability
    surface_invoked: "the plan-feature workflow driven through the workflow runner, with the run's own dispatch record read back after each of the four runs"
    description: >-
      For each of the four runs, the run's record of what it dispatched contains no
      authoring-agent dispatch -- observed from the record the run itself produced, not
      from the workflow source.
  - name: test_no_authoring_worktree_or_branch_exists_after_any_halted_run
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: failure
    description: >-
      After each of the four processes exits, the project holds no authoring worktree
      directory and no authoring branch that was absent before the run.
  - name: test_no_halted_run_reports_itself_as_having_succeeded
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: criterion
    description: >-
      Each of the four runs records an outcome that says the run did not proceed; none
      records a success outcome.
test_rationale: >-
  The realistic way this L1 goes wrong is not a bad message -- it is somebody deciding
  that since three of the four causes are not really permission problems, three of the
  four should be warnings, which reintroduces the exact hazard the BO-1500f-1 gate was
  built for. So the guard has to be asserted behaviourally across all four conditions in
  one place, not inferred from each sibling record passing its own reporting test. The
  absence of dispatch and the absence of a worktree are asserted from the run's own
  record and from the filesystem because a source reading confirming a return statement
  follows the check says nothing about whether the check is reached. The last assertion
  closes the false-success gap: without it the guard is satisfied by a run that stops
  and still reports success.
