test_rationale: "An entry that names no path is invisible to any implementation that asks which named file an entry would empty, so a fix satisfying GE-123b-1 can leave this hole fully open — which is why the descriptors here are not variations of the parent's but are shaped around the per-scanned-file seam. The three-file fixture with one nested path sharing a basename is load-bearing rather than decorative: with a single file, an implementation that suppressed nothing at all and one that decided correctly are indistinguishable, and without the shared basename a correctly-scoped decision cannot be told apart from an entry that happened to miss. Per-file counts are asserted rather than totals for the same reason. The regression descriptor guards the specific cheap fix this criterion invites — refusing repository-wide entries as a class — which would break the rule-scoped wildcard-path form the repository's own allowlist depends on today and would repeal GE-113c-3-v's fourth scenario. Every descriptor drives scan_files with real files on disk and a real allowlist because an audit in that same family found two criteria that passed at the predicate level while describing scenarios the real entry point cannot produce."
