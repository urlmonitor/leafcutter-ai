id: DK-600e-2
title: "Earlier decisions are judged for fit, and those that apply are cited with their approver"
component: decision-kernel
components:
  - decision_kernel
level: L2
status: active
req_status: draft
work_status: done
readiness: reviewed
priority: medium
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given 5 precedent candidates from the lookup, and memory.max_precedents configured at 3,
  When they are sent to Jev,
  Then at most 3 candidates are judged, each with one literal yes/no question asking whether the
    earlier decision applies to the current question in its context,
  And the questions take one Jev call when the decision has no options yet, or ride the assessment
    batch with no extra Jev call once options exist,
  And a precedent scored at or above memory.applies_threshold (0.5 by default), for example
    dec-ef8ddcb79d668a67 at 0.62, becomes prior_decisions evidence that cites its record path
    docs/decisions/dec-ef8ddcb79d668a67.yaml and its approver human:user with the approval date
    2026-10-01,
  And a precedent scored exactly 0.5 is cited the same way.
depends_on:
  - DK-600e
