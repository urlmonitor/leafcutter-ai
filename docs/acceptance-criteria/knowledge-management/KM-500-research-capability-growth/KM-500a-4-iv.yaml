id: KM-500a-4-iv
title: The frozen planning-and-selection set S1 covers every outcome category with stated minimums and targets outside KM-500
component: knowledge-management
components:
- knowledge_management
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: todo
parent: KM-500a-4
criteria: |
  Given the planning-and-selection case set S1 prepared for the kernel-path evaluation
  When its composition is checked before any run
  Then every case carries exactly one category label, and the case count per category is at least: explicit_known_operation 10, missing_typed_input 10, ambiguous_population 10, fully_specified_no_clarification 10, one_suitable_query 15, several_plausible_one_correct 15, unsupported_source_data 8, missing_query_supported_mapping 8, field_availability_gap 6, injected_provider_failure 3, injected_denied 3, injected_budget_exhausted 3
  And ambiguous_population cases include root-only versus all-parents scope and topic versus family scope
  And the one_suitable_query cases together expect at least 6 distinct registered operations
  And at least one paraphrase or changed-identifier twin exists per 3 positive cases, where positive means a case in explicit_known_operation, fully_specified_no_clarification, one_suitable_query or several_plausible_one_correct
  And each twin names its original case and carries its own reviewed expectation, so a changed-identifier twin can expect a different answer from its original
  And the targets span at least 5 AC families other than KM-500 and TQ-500, plus at least one ADR, one component and one test as non-AC targets; targets in KM-500 or TQ-500 do not count toward that spread
  And the set totals about 110 cases including twins
  And a set that falls short of any minimum is reported with each short category, its count and its minimum, and every result measured on it is reported limited, never eligible for a readiness claim.
depends_on:
