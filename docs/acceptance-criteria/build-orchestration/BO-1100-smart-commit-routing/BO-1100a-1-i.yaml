criteria: |
  Given the routing config contains overlapping entries:
    - group: "new-acs", path_pattern: "docs/acceptance-criteria/**/*.yaml"
    - group: "status-changes", path_pattern: "docs/acceptance-criteria/**/*.yaml"
      (where status-changes matches files with work_status field changes)
  And a staged file docs/acceptance-criteria/build-orchestration/BO-100a-1.yaml
    has both a new title AND a work_status change in the diff,
  When the commit agent classifies this file,
  Then the classifier assigns the file to the first matching group only
    (first-match-wins from config order),
  And if the remaining staged files fall into a different group than this file,
    the mixed-change warning (BO-1100b) is triggered,
  And the classifier does NOT silently discard the secondary match
    without surfacing it to the user.
