title: "A text artifact the build writes lands holding exactly its content's bytes, on every platform"
component: build-pipeline
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/build_pipeline/BP-1000-source-template-parity/BP-1000a.yaml"
criteria: |
  Given a build phase deploys a text artifact whose content uses LF line endings
  When the build's shared text writer writes that artifact to disk, on any platform
  Then the file on disk holds exactly the UTF-8 bytes of that content, with no
    newline translation applied
  And when a forced re-run finds an existing file whose bytes differ from the
    content only in its line endings, the writer rewrites it rather than counting
    it as unchanged
  And a file already byte-identical to the content is still skipped, so a re-run
    over a correct install causes no churn
  And the bug symptom ("deployed text artifacts land CRLF on Windows while their
    templates are LF, and a re-run reports them unchanged instead of repairing
    them") must not occur
