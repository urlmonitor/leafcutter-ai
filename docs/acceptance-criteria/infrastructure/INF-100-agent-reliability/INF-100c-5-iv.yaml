notes: |
  The ac-validator / ac-fulfillment-gate half of the request is ALREADY on main: commit
  c3a469610 (2026-09-28, "let ac-validator and ac-fulfillment-gate record feedback")
  added both to the six categories above in both copies of the file. KI-FC-003 still reads
  "open" and "grep -c ac-validator -> 0"; it is stale. No test asserts either gate's
  membership (none of the feedback unit tests mention ac-fulfillment-gate), so this record
  pins the fix rather than re-doing it.
  The six-category set matches every other phase agent: quality-concern is reviewer-only
  (pr-reviewer, architect-review), subagent-quality is supervisor-only, process-finding is
  hook-only.
  restructuring-specialist and change-scope-reviewer were found missing while authoring
  (measured 2026-10-21): the same omission, two more instances, never observed in a drive.
