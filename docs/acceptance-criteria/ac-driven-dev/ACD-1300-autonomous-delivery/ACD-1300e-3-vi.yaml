notes: |
  Whether the run continues past a declined clearing or ends there is left to the IT PO:
  ADR-070 sec. 5.2 ends the run on any decline; the KI's recovery (commit the stage, start a
  new run) works either way because the answer was already applied and the stage committed.
  What is fixed here is that the operator is TOLD, in the result, and is told what to do with
  the leftover record. A stale record that names a passed decision point otherwise makes the
  next resume of the same run id refuse a correct answer as naming a different decision
  (ACD-2100c-3-i), which would be read as a new defect.

  Named mutation: keep the warning line only -- the "result states" clause goes red; the parent
  ACD-1300e-3 stays green, which is why this is its own record.
