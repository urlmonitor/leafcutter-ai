    contract: "The gate raised at the layer that can ask, its user-answer channel, and the awaiting-answer outcome. This AC constrains what may settle that gate: only an answer arriving through that channel."
test_spec:
  - name: test_bo_3200c_2_well_formed_non_person_decision_does_not_settle_the_gate
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: criterion
    description: "THE DISCRIMINATOR. Deliver a reply from a dispatched agent in exactly the shape of a valid decision, naming a permitted choice; assert the gate remains awaiting and no choice is recorded. A shape-validating implementation passes every other test here and fails this one."
  - name: test_bo_3200c_2_out_of_scope_refusal_does_not_settle_the_gate
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: criterion
    description: "Using the real KI-ACD-005 refusal shape, assert the gate remains awaiting and that no choice — in particular not cancel — is recorded on the person's behalf."
  - name: test_bo_3200c_2_person_answer_settles_the_gate_and_the_run_follows_it
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: criterion
    description: "THE ANTI-VACUUM TEST. An answer arriving through the user channel settles the gate and the run continues according to it — stops the criterion being satisfied by a gate that accepts nothing."
  - name: test_bo_3200c_2_agent_result_cannot_reach_the_settle_path
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: seam
    description: "Assert structurally that a dispatch result is not routed to the gate's settle path at all — the strongest form of the criterion, where the rejection is not a check that could later be removed."
  - name: test_bo_3200c_2_rejected_non_person_reply_is_recorded
    target_dir: unit_tests/ac_driven_dev/
    framework: unittest
    type: integration
    angle: boundary
    description: "After a rejected non-person reply, assert the run's record names what arrived and that it was rejected, so a gate answered repeatedly by the wrong source is diagnosable rather than appearing to hang."
test_rationale: |
  The first test is the whole AC and it is deliberately the harder case. Hardening the parser so
  refusal-shaped replies are not misread — which is where KI-ACD-005's fix direction stops — leaves
  the door open: an approve-shaped reply from a non-person would still be honoured. So the
  discriminating test supplies a PERFECTLY VALID decision from the wrong source and requires
  rejection precisely because it is valid.
  Using the real refusal shape for the second test follows the repository's real-artifact rule.
  The anchor reply was polite, correct, and named the right fix in its own text, which is why it
  read as an answer; a synthetic refusal would be more obviously not-an-answer than the real one.
  The structural test is preferred over a check because a check can be removed by someone who
  finds it inconvenient, and nothing would fail until a gate was answered by the wrong source
  again.
