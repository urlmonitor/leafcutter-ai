roadmap_phase: phase_1
criteria: |
  Given the commit-time lint check and the single lint-scope declaration exist,
  When the documentation step for this feature runs,
  Then a reference document states where the declaration lives, its fields (the
    trees linted, the second-step rule set and the trees it covers) and the
    default when undeclared,
  And it lists every runner that reads the declaration — the commit-time check,
    this repository's CI lint job, the sign-off gate's lint runner (BO-570-3) and
    any manual mirror — and states that none of them may hold its own copy,
  And it lists the check's outcomes with what each means: refused with findings,
    passed after inspecting named files, nothing to inspect, and could not run
    (with each cannot-run cause),
  And it states the per-file judging rule and the cross-file-rule assumption it
    rests on (BP-1300e-1-ii).
