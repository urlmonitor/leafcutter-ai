title: "When two efforts reach for the same requirement at once, exactly one gets it"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given an available requirement,
  And two efforts that both reach for it at the same moment,
  When both attempt to take it,
  Then exactly one of them ends up holding it,
  And the other is told the requirement is already taken and goes looking for
    different work rather than proceeding,
  And the requirement records exactly one owner, being the effort that succeeded,
  And repeating the same simultaneous contest many times never once produces two
    holders or zero holders.
