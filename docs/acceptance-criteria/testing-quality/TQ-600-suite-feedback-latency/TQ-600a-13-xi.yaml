test_spec:
  - name: test_tq600a_13_xi_every_path_writes_only_the_allowed_set
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: criterion
    surface_invoked: "every suite, notice, re-evaluation, proof and hold path, through the real REST client against the shared recording fake server, with git operations in a scratch repository whose origin is a local bare repository"
    description: >-
      Run every path. The union of write requests RECORDED AT THE SERVER is a subset of
      the allowed list; the fix proof records none. Branches, tags, index, working tree and
      the bare origin's refs compare equal before and after.
  - name: test_tq600a_13_xi_the_client_refuses_a_write_outside_the_list
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: discrimination
    surface_invoked: "scripts/ci/_github_rest.py in-process against the recording fake server"
    must_catch:
      - "the allowlist is checked after the request is sent"
      - "the allowlist matches by method only"
      - "a comment on an unlabelled issue is allowed because comments as a class are allowed"
      - "re-running a run of ci.yml or the suite workflow is allowed because re-runs as a class are allowed"
      - "a workflow dispatch or disable is allowed because the job holds `actions: write`"
      - "a check run is allowed because check runs as a class are allowed for the App"
      - "the App token is accepted for an issue, comment or re-run write"
    description: >-
      Ask the client to create a PR, update a ref, put contents, merge a PR, comment on an
      unlabelled issue, create a label, re-run a ci.yml run, dispatch a workflow, disable
      a workflow, post a check run with the GITHUB_TOKEN, post a check run with the App
      token under any other name or on any SHA other than the evaluated head, post a
      commit status, and use the App token for an issue comment. Each refused; the fake
      records none of them. The App token's create of `Post-merge suite status` on the
      evaluated head and its completion are accepted.
  - name: test_tq600a_13_xi_workflow_scopes_are_minimal
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: unit
    angle: seam
    surface_invoked: "every family workflow file under .github/workflows/post-merge-*.yml, loaded with PyYAML"
    must_catch:
      - "a workflow omits `permissions: {}` at workflow level and inherits read-all"
      - "`actions: write` appears on a second job"
      - "the fix proof job gains any scope or references `secrets.`"
      - "any job holds `contents: write`, `pull-requests: write` outside the hold, `checks` or `statuses`"
    description: >-
      Structural by necessity — scopes are enforced only by the platform. Each job's
      permissions equal its specified set exactly.
  - name: test_tq600a_13_xi_an_added_fix_step_is_caught
    target_dir: unit_tests/suite_performance/
    framework: unittest
    type: integration
    angle: discrimination
    surface_invoked: "the shared workflow-step executor running the notice and re-evaluation jobs of MUTATED copies of .github/workflows/post-merge-followup.yml in the scratch repository, against the fake server"
    must_catch:
      - "a red-run step regenerates the durations file or a timing baseline and pushes it"
      - "a red-run step opens a pull request with a proposed fix"
      - "a step edits a tracked file and a later step commits it"
      - "the re-evaluation step dispatches or re-runs the suite workflow to 'retry it green'"
    description: >-
      Insert each named step and execute on a red verdict. For each, the bound check goes
      red. The unmutated workflow passes.
test_rationale: |
  The rule is a negative, so the behavioural form is a bounded write set over every path
  plus mutations proving the bound catches an addition. The 2026-10-08 additions —
  editing a notice's description, two non-holding labels, re-running the hold's own runs
  — are each narrow; the discrimination descriptor attacks the widest of them, the
  `actions: write` scope, whose platform meaning is far broader than the one endpoint
  this family needs. The scope descriptor is structural because the platform alone
  enforces a `permissions:` block; it is paired with the behavioural allowlist
  descriptors rather than standing in for them. Under a second.

  BUILD ORDER: this record bounds every path, so its first descriptor is completed as the
  paths land; it should be built last in the family (after -xvi), or its path list grows
  record by record.
