criteria: |
  Given a coder has gathered design context whose combined length exceeds the
    capsule length cap (for example a ticket touching 30 files, each with a
    multi-line rationale),
  When the coder writes the context_capsule block,
  Then the block is truncated to the documented length cap,
  And the intent field and the consumers_checked field are preserved in full,
  And the truncation is marked so a reader can tell the capsule was shortened,
  And the resulting sign-off comment still parses as a valid sign-off entry.
