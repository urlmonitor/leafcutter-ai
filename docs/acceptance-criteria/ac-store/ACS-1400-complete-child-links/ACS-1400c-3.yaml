criteria: |
  Given a store containing a deliberately parked tree carrying the author-set
    parked signal, a parent whose coverage list resolves to no record at all, and
    a parent that already names real children and omits one it has,
  When the one-off adjudicated pass is run over that store with the repair applied,
  Then the third parent gained the child it was missing,
  And in that same run the parked tree's files and the second parent's file are
    byte-for-byte identical to their content before the run,
  And in that same run the composite-or-leaf classification that the done-proof
    reader itself reaches is the same for every record in the store before the run
    and after it,
  And in that same run the parent back-link check's own verdict passes for the
    repaired parent,
  And the parked tree's records are reported as exemptions naming the reason their
    author gave, rather than being absent from the report.
