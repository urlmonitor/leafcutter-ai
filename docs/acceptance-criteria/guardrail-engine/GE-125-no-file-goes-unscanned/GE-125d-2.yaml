notes: |
  WHY THE MACHINE-READABLE ARM IS SEPARATE FROM THE PRINTED NOTICE. They have
  different consumers and they fail differently. The notice fails by being
  unreadable or by leaking; the record fails by being absent, by being derivable
  only from the exit code, or by being a string a caller has to match. Folding
  them together produces the common shape where the only machine-readable signal
  is the presence of a line of English on a stream.

  RELATIONSHIP TO GE-120a-1, WHICH IS DELIBERATELY NOT A DEPENDENCY. GE-120a-1
  makes the same structural argument — a caller must distinguish an outcome from
  a clean pass without reading prose, and the exit status cannot carry the
  distinction when the degraded case still exits zero — and its wording is worth
  reusing when this is implemented. It is nevertheless a different goal about a
  check that CANNOT run: a missing prerequisite, an unreachable helper. This
  check runs perfectly and declines to look, by policy, on purpose. No
  depends_on edge is created here, and none should be added: the GE-120 folder
  is byte-frozen by a guard test, so an edge in that direction is not even
  mechanically available, and an edge in this direction would imply a
  prerequisite that does not exist.

  IF A SHARED OUTCOME VOCABULARY EXISTS BY THE TIME THIS IS BUILT, this record
  should express itself in it rather than mint a parallel one. That is an
  implementation judgement for the IT PO and the coder; the behavioural
  requirement here is only that the distinction is machine-readable, always
  present, and not the exit code.

  FIXTURE PLACEMENT, stated as this tree requires. The reduced arm uses two
  paths under exempt locations by design. The clean arm deliberately uses
  "src/app.py" and "leafcutter-web/app/page.tsx" — both recorded in the known
  issue as measured, reported (non-exempt) paths — so that the zero it asserts
  is a real zero and not a second reduction being counted as none.

  THE ALWAYS-PRESENT-ZERO ARM IS ALSO A NEGATIVE CONTROL of a different kind
  from GE-125d-3's: it fails an implementation that only ever attaches the
  record when something was withheld, which reads as correct until the day a
  caller has to distinguish an old check from a quiet one.

  IT-PO NOTE, 2026-08-24 — THERE IS NO RESULT OBJECT TO ATTACH THIS TO TODAY.
  Measured in the canonical copy: main() in
  templates/scripts/commit_guardian/check_secrets.py returns a bare int and
  returns 0 at the `if not findings` guard before producing any output. So this
  record is not a matter of populating an existing structure — one has to be
  introduced, while the pre-commit entry point keeps returning the same integer
  the hook framework reads. The tempting shortcut is to print the record as
  structured text on a stream; that is ruled out above, because it would both
  break GE-125d-1-i's stream split and break GE-125d-3's requirement that a
  clean run says nothing at all.
