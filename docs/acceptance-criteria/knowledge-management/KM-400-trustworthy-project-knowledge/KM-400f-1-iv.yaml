id: KM-400f-1-iv
title: "Reclaimable because the publication failed is reported apart from reclaimable because it is outside the bound"
component: knowledge-management
components: [knowledge_system]
level: L3
status: active
req_status: active
readiness: draft
priority: high
work_status: todo
parent: KM-400f-1
criteria: |
  Given the declared retention bound is at most 3 retained generations and a minimum retirement age of 24 hours
  And the active pointer references generation G12, whose publication completed
  And generations G11, G10 and G9 each record a completed publication, were retired more than 24 hours ago, and are the three retained generations inside the declared count bound
  And generations G8 and G7 each record a completed publication, were retired more than 24 hours ago, and sit outside the declared count bound
  And generations G6 and G5 each record a failed publication, were created 40 hours ago and carry no retirement time
  When the retention policy is evaluated
  Then G8 and G7 are reported reclaimable on the basis that they fall outside the declared count bound
  And G6 and G5 are reported reclaimable on the basis that their publication failed
  And those two bases are reported as distinct named values rather than as one combined reclaimable indication
  And the evaluation reports a separate count per basis: 2 outside the declared bound and 2 whose publication failed

  Given generation G4 records a failed publication, was created 40 hours ago, and also falls outside the declared count bound
  When the retention policy is evaluated
  Then the evaluation reports both bases for G4 rather than only the first basis it established
  And G4 is counted under each basis it satisfies, and the report states that the per-basis counts may overlap so they are not read as a total

  Given every generation outside the declared bound records a completed publication and no generation records a failed publication
  When the retention policy is evaluated
  Then the count of generations reclaimable because their publication failed is reported as 0
  And that figure is reported explicitly rather than left out of the report
depends_on: [KM-400f-1, KM-400f-1-i]
