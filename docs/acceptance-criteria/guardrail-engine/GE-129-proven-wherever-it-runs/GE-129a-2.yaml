id: GE-129a-2
title: "A session guard's declaration of what it must refuse is tied to the entry that runs it by particulars read from the surface, so an entry that moves out from under its declaration leaves the guard undeclared instead of quietly keeping the credit"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given each guard wired to one of the editor's tool calls has a declaration of the one
    known-bad input it must reject and of the observable rejection that input must
    produce, expressed in the same words the project already uses for a known-bad input,
    an expected rejection, the not-applicable alternative with its stated ground, and the
    four states an attempt can be in,
  And each declaration is tied to the entry it speaks for by particulars the run takes
    from the settings surface itself — the kind of tool call, the tools the group applies
    to, and the guard the entry resolves to — rather than by a name a person repeats in
    two places,
  When the liveness run examines the surface,
  Then every subject is reported either with the declaration tied to it, or as carrying
    no declaration at all, and the two are distinguishable in the run's own output,
  And every declaration is reported either as tied to a subject the surface names, or as
    tied to nothing,
  And given one guard's declaration is left exactly as authored while the entry it speaks
    for is repointed to a different guard,
  When the run repeats,
  Then that declaration is reported as tied to nothing, naming it,
  And the repointed entry is reported as carrying no declaration,
  And neither the declaration nor the entry is reported as having demonstrated a refusal
    on the strength of the tie that used to hold,
  And in that same run a guard whose entry was not touched is still reported with its own
    declaration tied to it and with the state its own examination produced, so a run in
    which everything is reported as tied to nothing cannot satisfy the clauses above,
  And given a guard is wired at a second kind of tool call and no declaration is added for
    that second entry,
  When the run repeats again,
  Then the first entry keeps its declaration and the second is reported as carrying none,
    so one declaration never answers for two places a guard is invoked from.
depends_on:
  - GE-129a
  - GE-129a-1
