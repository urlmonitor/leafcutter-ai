notes: |
  Authored by /quick-fix. Root cause: The ratchet resolves a file's previous length from the blob at the literal ref HEAD. During a merge, HEAD is the branch's PRE-merge tip, so a file long-standing on origin/main but not yet present on the branch resolves to NO previous length. check_file_size.py's _classify_file then falls through to the absolute-limit branch, and the file is judged as brand new. The GE-127b-1 ratchet — which exists precisely so an already-oversized file is not refused for merely existing — never applies to it. DESIRED: while a merge is in progress, previous length is resolved against the merge's other parent (MERGE_HEAD) as well as HEAD, so a file inherited from the incoming branch is judged against the incoming copy rather than treated as newly authored. A merge commit authors no new content. CONSTRAINTS, all load-bearing: (1) The ordinary non-merge path must be provably UNCHANGED — this is a required CI gate and a regression blocks every merge, which is the very failure being fixed. (2) Do NOT weaken the absolute limit for genuinely new files, in a merge or otherwise: a file that exists on NEITHER parent is new and must still be refused. (3) Do NOT resolve this by exempting merge commits wholesale — a merge that itself edits a file into oversize must still be caught. (4) Splitting main's two oversized test files is NOT the fix and is out of scope; it clears today's instance and leaves the mechanism intact. (5) templates/scripts/commit_guardian/ is canonical; scripts/commit_guardian/ and .leafcutter/ are build outputs that build.py overwrites — edit the template and rebuild. (6) Per the repo's standing rule for gate ACs, verify behaviourally by performing a real merge in a fixture repository, never by reading the source; a source-level assertion stays green on exactly the broken implementation. The mutation for the red baseline is naturally available: construct a fixture where one branch has an oversized file the other lacks, merge, and require the merge to complete — that is red today and must go green, while a genuinely-new oversized file in the same merge must still be refused.
