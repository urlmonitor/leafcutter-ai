id: GE-119c-4
title: "The unverified count of files that only looked clean is replaced with a measured one"
component: guardrail-engine
components:
  - testing_quality
  - ac_store
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the report that 26 schema-violating AC files looked clean under the reduced manual
    field validation — a figure recorded as reported by a parallel session and never
    independently reproduced,
  When the harness validates the AC store twice from the same working copy, once with the
    authoritative schema and once with the reduced manual field validation,
  Then it reports the actual number of files accepted by the reduced validation and rejected
    by the authoritative one, and lists those files by path,
  And it reports which authoritative rule each listed file violates, so the finding is
    actionable rather than a count,
  And the measured number is what is cited from that point on, whether or not it equals 26,
  And a measured result of zero is reported as the finding rather than treated as a broken
    measurement,
  And the measurement is repeatable on demand against the store as it stands, not captured
    once as a static number in a document.

  Coverage note: the two validations must both be executed against the real on-disk AC store,
  not a synthetic fixture. A fixture built by an author who already knows which rules the
  reduced validation omits reproduces that author's assumptions and cannot surprise them
  (CLAUDE.md, "Real-artifact behavioral spot-check before declaring done").
