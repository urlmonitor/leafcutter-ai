notes: |
  THIS IS THE DURABLE HALF OF THE PARENT, AND THE PARENT FORBIDS ITS OMISSION. GE-120h's
  notes state it directly: "do not decompose this as 'register the missing checks'".
  Draining today's backlog is GE-120h-3; this record is the rule that stops the next
  orphan appearing with the same four reassurances. Neither closes the other, and a run
  that produced only GE-120h-3 would have failed the parent.

  THE UNIT IS THE ADVERTISEMENT, NOT THE SCRIPT. Every clause here is written over what
  a surface CLAIMS, because that is what misleads a reader. This matters for two
  populations the disk census cannot see: a check advertised on a surface whose script
  was deleted (the claim survives the code), and a check whose settings section is the
  only thing that ever existed. It also matters for the reverse, which is deliberately
  OUT OF SCOPE: a check that runs and that no surface documents is a discoverability
  gap, not a false reassurance, and no clause here touches it.

  WHY THE COUNT CLAUSE AND THE ADDED-ADVERTISEMENT ARM ARE IN criteria RATHER THAN LEFT
  TO THE IT PO. Without them this record is satisfiable by a reconciliation holding a
  written-in list of the four surfaces and of today's disagreeing names — which is the
  same shape as the defect one level up, and is precisely how the incumbent reachability
  guard fails (it walks the registry, so it cannot see what the registry omits). The
  arm requires a number the run states to move when reality moves. Take the model from
  BP-1600a-2's added-script descriptor; it is the same anti-list device applied to a
  different population.

  NO COUNT OF TODAY'S DISAGREEMENTS MAY BE WRITTEN INTO THIS RECORD OR INTO ANY TEST OF
  IT. The measured figures move: the disk baseline was 18, then 16, then 14 in a single
  day, and the advertised population has never been measured at all. The three surfaces
  quantified in the doc_links are named individually, with the date and the file, so
  those statements stay checkable as the population moves. A test asserting "there are N
  advertised-but-unrun checks" passes forever and catches nothing.

  BLOCKING-VERSUS-ANNOUNCING, DECIDED EXPLICITLY BECAUSE THE COMPONENT'S STANDING RULE
  REQUIRES IT TO BE. GE-120's standing line is that the unit of the rule is visibility
  and that block-versus-announce is a per-check decision with no blanket default. The
  decision here is that a reconciled disagreement REFUSES the change, for one reason:
  the disagreement is introduced by an author's own edit to one of these surfaces, in
  the same change, and is repaired in that change at a cost of one line. It is not a
  pre-existing condition being discovered — the pre-existing set is GE-120h-2's subject
  and is explicitly excluded from refusing anything. The separate question of what
  happens when a surface cannot be READ is GE-120h-1-i's and is decided there.

  NOT AUTHORED HERE, BY DESIGN: assigned_agent, estimated_complexity, it_requirements,
  test_spec, test_rationale, declares_side_effect and package_surface. Those are the IT
  PO's fields.

  ---- IT PO ENRICHMENT, 2026-09-14 ----

  package_surface IS DELIBERATELY LEFT UNSET, AND THAT IS A DECISION WITH A DEADLINE —
  NOT AN OVERSIGHT. The criteria do not settle whether this reconciliation lands as a
  registered commit-time hook or as a run of some other kind, and the two answers give
  opposite truths:
    - As a REGISTERED HOOK it adds a new member to hooks_manifest.hooks, which
      _package_surface_registry.WATCHED_REGISTRIES watches via ("hooks_manifest.hooks",
      "list_ids"). If it also gains a per-check settings section, that is a SECOND
      surface: the same file is watched via ("", "mapping_keys"), so a new top-level key
      is itself a new entry. In that case this record must carry package_surface: true
      with the five-field structured it_requirements BEFORE the commit is attempted, or
      check-package-surface-declaration refuses it.
    - As anything that adds no registry entry, package_surface: true would be a
      fictional declaration in the opposite direction — precisely
      KI-CG-20260831-fictional-config-schema-fragment, which records two approved ACs
      declaring a commit_guardian.json key that was never created, passed by a validator
      that checks shape and never opens the file.
  Declaring a surface this record's criteria do not yet require would repeat that
  defect to save an amendment, so it is left unset and raised as a caveat instead.
  Meanwhile CLAUDE.md's binding note on this record effectively forces the hook answer,
  so the likely outcome is that the amendment is needed — make it deliberately, with a
  fragment read off disk, rather than under commit-time pressure with a plausible one.

  HOW THE it_requirements WERE VERIFIED. All four advertising places were opened in
  this worktree on 2026-09-14 and confirmed present: README.md, config.py,
  commit_guardian.json and templates/scripts/precommit-autofix.json. The manifest was
  parsed (38 top-level keys; hooks_manifest.hooks holds 62 members) and the three
  populated settings sections for unregistered checks — folder_density, sql_complexity,
  debug_scripts — were read directly. The two existing manifest readers named in the
  no-third-reader requirement (check_hook_parity.py,
  _hook_trigger_reachability_helpers.py) were found by grepping for hooks_manifest
  across the guardian directory. No name in the requirements was taken from a sibling
  record.
