notes: |
  The non-obvious interaction. Exempting a retired record only from its OWN
  done-proof leaves its live parent stuck: a composite marked done would be
  refused for a child whose behaviour was deliberately removed. The reverse
  hazard is just as real — a retired child left at "done" must not be counted
  as proof that a live parent is done. Both directions are pinned here.

  BA assumption for the user to confirm: a live parent whose ONLY children are
  retired falls back to needing its own covering test (third scenario), rather
  than being vacuously proven by zero live children.

  IT-PO enrichment (2026-10-15): the user CONFIRMED the BA assumption
  (decision 2). A live parent with only retired children needs its own
  covering test. A partial exemption already exists (KI-ACS-016,
  is_superseded_ac, on both paths), but today a composite with zero live
  children is refused unconditionally, even when it has its own covers tag.
  This AC changes that to the leaf rule. Call sites:
  _done_proof_composite._unproven_composite_children (pre-commit) and
  done_proof._resolve_all_child_ids (CI).
