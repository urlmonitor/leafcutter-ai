test_spec:
  - name: test_gate_reporting_success_with_no_record_entry_is_adjudicated_failed
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Drive the real workflow with a phase stub that returns success and writes nothing to the record, and assert the run's outcome for that phase is a failure naming the phase."
  - name: test_gate_with_a_present_record_entry_still_passes
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: criterion
    description: "Control case: the same driver, a phase that reports success and does write its entry, asserted to pass -- so the failure above is attributable to the missing entry and not to a driver that now fails everything."
  - name: test_the_verdict_carried_forward_is_the_one_derived_from_the_record
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: seam
    description: "With a phase reporting success and leaving no entry, assert the drive does not proceed as though that phase completed -- the downstream effect, not just an emitted warning. Distinguishes a consumed read-back from a discarded one."
  - name: test_unreadable_record_adjudicates_the_gate_failed
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: boundary
    description: "Make the record unreadable at the moment of the read-back and assert the gate is adjudicated failed rather than credited from its own success report."
  - name: test_verification_is_not_specific_to_any_named_gate
    target_dir: unit_tests/prompt_assembly/
    framework: unittest
    type: behavioral
    angle: real_artifact
    description: "Run the same scenario once per gate in the canonical phase set, each time with that gate reporting success and leaving no entry, and assert every one is adjudicated failed -- the generic-path requirement, exercised over the real phase list rather than a hand-picked pair."
test_rationale: |
  The defect is a true statement (the gate ran and succeeded) paired with a missing
  artifact, so nothing about the gate's own return value distinguishes the broken
  system from the fixed one. Only a run in which the record is observed after the
  dispatch can tell them apart, which is why every descriptor executes the workflow.
  The third descriptor is the load-bearing one: the cheapest wrong fix is to read the
  record and emit a warning while still trusting the agent, and that implementation
  passes descriptors one, two and four while leaving the production behaviour
  unchanged. The fifth descriptor exists because the observed failures were
  per-ticket and per-gate rather than deterministic, so a fix verified on a single
  gate would look green and remain unreliable.
