id: ACS-200g
components:
  - ac_store
title: "Every pull request that changes the requirements store has those changes checked against the store's own rules before merge"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the continuous-integration configuration for the repository,
  When a pull request is opened or updated and one or more of its changed files
    are acceptance-criterion records,
  Then a dedicated acceptance-criteria check runs automatically over those
    changed records and applies the same structural and schema rules the
    commit-time guardrails apply — record schema and required fields, the
    parent/child back-link, the per-parent child limit, absence of dependency
    cycles, resolvable shared-pattern references, and authorship governance,
  And the check reports a failing (non-passing, blocking) result whenever a
    changed record breaks any of those rules,
  And the check reports a passing result only when every changed record
    satisfies all of them,
  And the verdict does not depend on whether the contributing author's local
    guardrails were installed — a record committed while the local guardrails
    were absent is checked here exactly as one committed with them present,
  And the check is a hard, blocking check — not an advisory or informational one
    that a pull request can be merged despite,
  And the symptom ("a structurally invalid acceptance criterion reaches the
    protected branch with every check reporting green") must not occur.
