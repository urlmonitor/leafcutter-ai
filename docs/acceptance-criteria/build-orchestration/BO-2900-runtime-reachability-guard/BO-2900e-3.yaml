id: BO-2900e-3
components:
  - build_orchestration
  - commit_guardian
title: "A refusal cause with no exercised message cannot be added — message quality is proven by running the guard"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the guard can refuse for four causes, and each cause has a check that runs the
    guard on a change exhibiting that cause and reads the text the guard emitted,
  When a fifth refusal cause is added to the guard with no such check,
  Then the omission is reported and the change is refused, naming the cause that has no
    exercised message.

  Given a change that alters the text emitted for an existing cause so that it no longer
    names the stranded item,
  When the checks run,
  Then the change is reported as failing, because the check reads the emitted text.

  Given a change that alters only the wording around the stranded item, the missing side
    and the clearing action, leaving all three present,
  When the checks run,
  Then no failure is reported, so the message can be improved without the checks
    objecting to its prose.
