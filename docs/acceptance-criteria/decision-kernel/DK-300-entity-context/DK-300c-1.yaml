id: DK-300c-1
title: "Explicit index preparation records current repository and reader coverage"
component: decision-kernel
components: [decision_kernel]
level: L2
status: active
readiness: reviewed
req_status: draft
priority: high
work_status: done
criteria: |
  Given canonical owner sources and Python declarations in a selected repository workspace,
  When index preparation or refresh is explicitly requested outside an initial recognition pass,
  Then a disposable derived index is produced with repository and workspace identity, schema version, source snapshot, reader coverage and source hashes,
  And unchanged canonical input yields the same entity identities and projection content,
  And refresh reflects changed, added and removed supported sources without changing canonical source records,
  And uncommitted source changes contribute to the snapshot fingerprint even when the committed revision is unchanged,
  And repository declarations are inspected without importing or executing repository code.
depends_on: [DK-300c]
