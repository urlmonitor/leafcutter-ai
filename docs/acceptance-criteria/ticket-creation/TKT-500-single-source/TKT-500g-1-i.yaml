it_requirements:
  - "Precedence is a policy, not an implementation detail: where an authored proof demand and the path-shape inference disagree, the authored demand decides. An implementation in which the path-shape rule can suppress a demand that was read is non-conforming, however the internal checks happen to be arranged."
  - "The precedence must hold for both generators that produce work items from a record, not only the one this criterion was found on. A rule enforced in one generator and absent from the other is a partial gate, and the population lands on whichever generator ran."
  - "The 14 measured docs-or-config-only records that author a demand (12 documentation author, 2 diagram author, at 06ce1c43) are the proof population. A proof built only on a constructed record does not establish that the records actually in the store keep their section."
  - "If a reviewer later decides a documentation record must never carry a proof obligation, the conforming response is a named refusal at authoring time — never a silent discard at generation time, because a silent discard is indistinguishable from the defect."
test_spec:
  - name: test_docs_only_paths_do_not_suppress_an_authored_demand
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: criterion
    covers: [TKT-500g-1-i, TKT-500f-7]
    description: "A record whose changed paths are documentation and configuration only, and which authors one statement, generates a work item carrying that statement — the path shape does not suppress it."
  - name: test_the_docs_only_records_that_author_a_demand_all_keep_their_section
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Discovers from the real store every record whose changed paths are docs-or-config only AND which authors a demand (14 at 06ce1c43), and asserts none loses its proof section. Subjects are discovered by scanning, never named."
  - name: test_the_path_shape_omission_still_applies_when_no_demand_was_authored
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: boundary
    covers: [TKT-500g-1-i, TKT-500f-7]
    description: "The other side of the narrowing: with no authored demand present, a docs-or-config-only record still gets no proof section. Without this, 'the authored demand decides' could be satisfied by emitting a section for everyone."
test_rationale: |
  The criterion is a precedence rule between two inputs, so the contract needs both sides
  of the disagreement (descriptors 1 and 3) or the rule is provable by over-emitting.
  Descriptor 2 is the population: 14 real records sit on exactly this input, and a
  constructed-record-only proof would show that the generator CAN emit the section for
  such a record, not that the records in the store now receive one — the bias that hid
  the original defect. Descriptors 1 and 3 also cover TKT-500f-7, which governs the same
  two inputs from the other direction; one test, two ACs, so the two records cannot drift
  into describing different behaviour.
