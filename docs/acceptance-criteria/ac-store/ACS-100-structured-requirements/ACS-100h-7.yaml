notes: |
  Retrospective finding EPIC-CodeQualityHooks KI-4 (technical route). Authored
  directly by the IT-PO as a technical-constraint AC under ACS-100h.

  Split into ACS-100h-7a (python-coder — the reusable scaffold-time limit check,
  a .py callable shared with the check-ac-tree-limits hook) and ACS-100h-7b
  (llm-expert — wiring /create-epic to run the check before stub generation and
  block on violation). The L3 edge ACS-100h-7-i covers the tree-already-at-limit /
  cannot-auto-split case. Split rationale: the constraint crosses two owned
  surfaces (Python check logic + create-epic agent-template prose); create-epic is
  is_ticket_phase: false (supervisor tier) so it is NOT a dispatchable ticket-phase
  agent — editing its template body is llm-expert work.

  STOPGAP LINEAGE: This AC was authored while the ACS-100h tree was ITSELF over the
  L1 child limit (6 ID-derived L2 children, h-1..h-6, against the limit of 5).
  Landing ACS-100h-7 raised that to 7, handled via child_limit_override: 7 on
  ACS-100h (the documented escape hatch — see ACS-100h-6 scenario 3). The
  tree-saturation hit here is itself an instance of the very problem ACS-100h-7
  prevents at scaffold time. Per the ac-store PROJECT_CONTEXT (ACS-800), this
  override is a TEMPORARY stopgap to be RETIRED once ACS-800e lands (tooling counts
  children from metadata, not ID strings) — do not let it become permanent.
