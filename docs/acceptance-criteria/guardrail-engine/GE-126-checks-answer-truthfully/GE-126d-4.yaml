id: GE-126d-4
title: "Following the procedure for adding a check leaves nothing to discover later"
component: guardrail-engine
components:
  - commit_guardian
  - skills_system
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an author adding a new check who has never read the autofix configuration and never
    will,
  When they follow the documented procedure for adding a check from beginning to end,
  Then the procedure presents every place the check must be registered including membership
    of the autofix roster and it presents that membership as a decision the author makes
    rather than a step they can skip by inaction,
  And it states what follows from each choice in the author's terms — a check on the roster
    gets a repair attempt when it fails and a check off it does not — so the decision can be
    made without reading the autofix machinery,
  And it tells the author how to record a deliberate exclusion and what the registration
    parity check will report if they record nothing,
  And an author who follows the procedure to its end and then runs the parity check receives
    no finding about their new check,
  And the legs the procedure presents come from the single declaration rather than being
    listed again in the procedure's own words.

  Coverage note: covered by an end-to-end exercise that registers a fixture check by
  following the documented procedure step for step and then runs the registration parity
  check asserting it reports nothing. A test that asserts the procedure document contains a
  fourth step does not cover this criterion — the L1 says so directly: a sentence nobody
  reads passes that test.
