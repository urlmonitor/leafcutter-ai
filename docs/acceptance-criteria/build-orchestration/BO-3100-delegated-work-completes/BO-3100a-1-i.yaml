notes: |
  This is the silent half of the drift and the reason the reconciliation must run in both
  directions. An agent cleared for a hand-off it cannot perform never delegates, and
  nothing fails — the work simply is not done and no message is produced. That is the same
  success-shaped silence KI-SS-001 describes, arriving through the declarations rather than
  through a stalled agent.

  THE TWO MESSAGES MUST DIFFER. Collapsing both directions onto one failure text yields the
  right verdict with the wrong instruction: the author is told to clear a recipient that is
  already cleared, concludes the check is broken, and works around it. The distinguishing
  clause is the whole content of this AC, so the covering test must compare the text
  emitted by the two runs rather than only their exit outcomes.

  IT-PO ENRICHMENT NOTE (2026-08-26). Complexity S because this extends BO-3100a-1's pass
  rather than adding a mechanism; the cost is in the two-run comparison test, not the code.
  The machine-readable `direction` discriminator is required in addition to the text so that
  BO-3100a-4's documentation-to-behaviour check can select a fixture by direction without
  matching prose.
