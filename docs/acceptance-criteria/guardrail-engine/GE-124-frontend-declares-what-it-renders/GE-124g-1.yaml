change_target: code
risk_surface: contract_boundary
notes: |
  PLACE 1 OF FOUR where the substitution must be blocked. `covered_by` means
  "something asserts this", and a declaration asserts nothing.

  THE FIELD DECISION THE PO ASKED FOR, made explicitly rather than by default.
  A declaration goes into NEITHER `covered_by` NOR `implemented_by`; it goes
  into two new fields, `declared_by` for the component-level surface and
  `pinned_by` for the element surface. Reasoning:
    - `covered_by` is ruled out by this AC's whole purpose.
    - `implemented_by` is ruled out because it records a link established by
      completed work, whereas a declaration is a claim a file makes about
      itself, unverified at the moment it is written. Folding the two would make
      `implemented_by` a field that sometimes means "built" and sometimes means
      "says it is built" — the same ambiguity one level along.
    - TWO fields rather than one because the two surfaces are not
      interchangeable anywhere else in this tree (GE-124b-2, GE-124c-1-i), and a
      single merged field would make them indistinguishable to every reader.
  This matches the mock-data `Ac` entity, which already models `declared_by`
  and `pinned_by` alongside an unrelated `covered_by`.

  NO OPT-OUT, DELIBERATELY — the last clause. GE-124d's escapes govern whether a
  file must declare; they have no application here. A configurable version of
  this rule is not a rule. The configuration surface itself is GE-124g-1-i.

  IT-PO ENRICHMENT NOTE (2026-08-25). Two schema-layer facts. First, the two
  fields do not exist in config/ac_store_schema.json today; adding them is
  prerequisite work for anything in this tree that writes them, and both
  validators read that one file so they pick the change up together. Second,
  the JSON schema cannot enforce the rejection — a front-end path is a valid
  string — so the rule belongs in the shared _ac_schema_validators surface that
  the commit hook calls. A rule added only to the JSON schema is a no-op.
