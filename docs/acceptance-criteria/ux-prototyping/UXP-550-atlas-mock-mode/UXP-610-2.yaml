criteria: |
  Given a CI / non-production build of the Atlas,
  When the mock-mode CI checks call /api/drift-guard and /api/mock-toggle-check,
  Then both endpoints are present and respond, so the drift-guard (UXP-609) and toggle checks
    can run,
  So gating the endpoints out of production does not disable the CI checks that depend on them.
