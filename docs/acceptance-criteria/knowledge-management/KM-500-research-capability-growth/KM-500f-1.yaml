notes: RQ4; BA-03, PO-04, PO-05, ITPO-02, CODER-03; RQE-03. The five IDs are the independent pinned example, not
  a universal graph constant. No complete code graph or unlimited traversal is promised. Draft behavioral specification
  under the user-requested BA pass; technical enrichment and proof remain pending.
it_requirements:
- Retain immutable repository/source SHA provenance, bounded registered read-only queries and existing kernel authorization,
  budgets and retries. This contract adds no arbitrary Cypher, new network endpoint, source-write permission or
  automatic query activation.
- The named fields below describe the planned observable semantic contract; preserve compatible existing envelope
  fields and version any incompatible extension. Required unavailable values stay explicit and are never inferred
  from an evaluation oracle.
- Represent declared edge kind, direction, traversal depth and source pin explicitly. Separate depends_on, parent/covered_by
  hierarchy and implemented_by references; do not treat one relation as another or claim undeclared code impact.
- Retain the registered bounded traversal contract and deduplicated canonical identities. Incomplete or filtered
  enumeration uses the e-3 completeness contract; a proposed longer traversal requires separately governed capability
  support.
- A revision comparison identifies both source SHAs and each side of the declared-link difference. Missing code
  graph or second-revision evidence limits the answer; it does not establish an exhaustive unchanged impact set.
- RQE-03 anchors five incoming depends_on records for TQ-500f-2. Those are fixture expectations, not production
  constants or a complete call graph.
test_required: true
test_rationale: Planned criterion and public reachability proof includes real producer/consumer boundaries and named
  plausible wrong outcomes. No descriptor is executed coverage; no provider, database or deployment result is asserted.
test_spec:
- name: test_public_declared_impact_returns_all_pinned_dependents
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Invoke the registered retrieval path for RQE-03-P and assert the five expected incoming depends_on
    identities with pinned SHA, relation direction, depth and complete enumeration.
  must_catch:
  - Returning outgoing prerequisites instead of incoming dependents or omitting one required identity.
  covers:
  - KM-500f-1
  requires_db: false
  surface_invoked: python -m knowledge retrieve
- name: test_declared_impact_distinguishes_relationship_kinds
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Provide hierarchy and implementation references alongside declared depends_on edges; assert each
    is labeled by its actual relation and no code-consumer claim is derived from reference presence.
  must_catch:
  - Counting parent links or implemented_by references as declared dependencies.
  covers:
  - KM-500f-1
  requires_db: false
- name: test_truncated_impact_reaches_assessment_as_known_subset
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: seam
  description: Pass RQE-03-N through the real query-result and answer consumer with TQ-500f-6 withheld and truncation
    signaled; assert four known dependents, exact total unavailable and original impact question unresolved.
  must_catch:
  - Accepting four truncated dependents as the exact total of five.
  covers:
  - KM-500f-1
  requires_db: false
- name: test_revision_impact_does_not_mix_sources_or_invent_code_graph
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: Compare two explicitly pinned declared-edge sets, then remove the second source or code-consumer
    evidence; assert attributable differences only and an explicit limitation for the unavailable comparison.
  must_catch:
  - Using the current workspace as the missing historical revision or presenting declared links as exhaustive code
    impact.
  covers:
  - KM-500f-1
  requires_db: false
