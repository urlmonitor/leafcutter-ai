estimated_complexity: S
it_requirements:
  - "Add a new trigger_condition to the documentation-expert entry's selection_criteria.trigger_conditions array in config/agent_registry.json. The condition expresses: 'files_touched adds a new site/app/**/page.tsx whose derived docs/reference/frontend/<name>.md is NOT also in files_touched'."
  - "DSL feasibility resolution (resolves BA open question, see GE-104a-2-i): the existing DSL grammar (selection_criteria_evaluator.py: contains/equals/matches over files_touched/title/description/components, combined with AND/OR) has NO negation operator and NO derived-path correlation, so it CANNOT express 'page present without its derived doc'. Per ADR-018's two-tier model, author this as a type: 'llm' condition (the documentation-expert entry already carries llm-type conditions; the evaluator routes llm conditions to the LLM-judgment path and falls back to default_status until wired). Do NOT extend the DSL grammar for this single trigger."
  - "The llm condition expression must be phrased so the judgment is unambiguous: it fires only when a NEW page is added in files_touched AND the page's derived reference doc path is absent from files_touched; it does NOT fire when both the page and its derived doc are present, and does NOT fire when no new page is present."
  - "The page-to-doc derivation rule referenced in the expression must match the SINGLE shared derivation defined in GE-104a-1-i / GE-104a-1-ii (hyphen-joined lowercased route segments, dynamic [param] -> p_param), so the planning-time judgment and the commit-time hook never disagree about which doc a page maps to. Reference that rule explicitly in the expression text."
  - "default_status for documentation-expert must remain 'not_needed' so the agent is only forced to needed when this (or another) condition fires."
  - "Self-hosting parity (ADR-001): config/agent_registry.json is round-tripped by build.py into the deployed .claude config; the registry edit and any packaged template copy of the registry must be kept in parity and verified via the build.py round-trip."
  - "Edit must keep agent_registry.json valid against config/agent_registry.schema.json and pass the check-agent-registry / check-doc-types-agents pre-commit guards."
delivers_to: null
expects_from:
  ac_id: GE-104a-1-i
  contract: "The single shared page-path-to-doc-path derivation rule (hyphen-joined route segments -> docs/reference/frontend/<name>.md, with dynamic-segment normalization from GE-104a-1-ii). The planning-time trigger expression must reference this same rule so commit-time and planning-time enforcement cannot drift on the mapping."
