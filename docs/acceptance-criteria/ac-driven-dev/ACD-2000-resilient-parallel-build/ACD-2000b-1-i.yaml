it_requirements:
  - "ENFORCE ON THE GATE THAT ACTUALLY RUNS. Verified: scripts/commit_guardian/check_ac_governance.py declares work_status in _OPEN_FIELDS (~lines 67-70) -- 'fields that any agent may modify freely'. While the claim rides on work_status the deployed governance gate explicitly AUTHORISES every writer to break it. Whichever design lands, that constant and its message are an enforcement point that must be updated in the same change; a claim defended only inside fast_lane.py is defended nowhere."
  - "THAT HOOK IS FAIL-OPEN. Its own docstring records 'any unexpected exception exits 0' (ACS-400e-1-i). A claim check added there that raises is silently skipped and the gate reports green -- the exact phantom-green shape this repo exists to prevent. Any added check must handle its own failure explicitly rather than relying on the outer handler."
  - "THE HOUSEKEEPING PASS IS mark_done_built_acs (scripts/build_orchestration/fast_lane.py ~line 332), which marks done on test coverage alone and writes through the same _update_ac_work_status helper. Over a requirement claimed by another effort it must either leave the claim intact or record a deliberate hand-back naming what released it. Silently clearing is the defect."
  - "EVERY END OF A CLAIM IS ATTRIBUTABLE. Release, takeover and housekeeping hand-back each record what ended the claim. A claim that ends with no record is indistinguishable from a claim that was never made, and ACD-2000a's trail loses an attempt boundary."
  - "THE SCANNER IS A READER THAT MUST ACT, NOT JUST A RECORD THAT MUST DIFFER. scan_ac_store's ready filter (_matches_work_status, ~line 148) compares work_status against exactly one target value. Representing the machine claim and the human in-progress separately on the record satisfies nothing until the ready-set computation consults the claim; implement both halves or the last two Then clauses are unobservable."
  - "WATCH THE INVERSION THE FIX INTRODUCES. If the claim moves to its own field and work_status stops being flipped, a claimed requirement reads work_status: todo and the scanner OFFERS it -- double dispatch, caused by the fix. This is why ACD-2000b-1 requires the dual write; the scanner change here is the other half of the same guarantee."
  - "THE HAND-EDITING PERSON IS TOLD, NOT SILENTLY BLOCKED. The message must name the current owner and the claim instant so the person can decide; a bare refusal sends them to read the implementation, and a silent pass is the failure this AC exists to close."
  - "IF A NEW MODULE IS IMPORTED BY THE HOOK it must be added to the build deploy-manifest (scripts/build_phases.py deploy_map) in the same change. The hook runs from the deployed layout, and an undeployed dependency raises ModuleNotFoundError at hook runtime -- the done_proof.py precedent recorded in CLAUDE.md."
  - "Follow the project error handling policy (Ruff E722/BLE001/TRY): typed except, log-or-reraise, no bare except."
delivers_to: null
