change_target: code
risk_surface: contract_boundary
notes: |
  Encodes the settled user decision as a test rather than as prose. `class` is
  the styling namespace: mangled by CSS-modules hashing, purged by Tailwind
  content scanning, and an invitation to style the marker. A reader that also
  accepted a class-based marker would appear more forgiving while producing
  pins that vanish from the built output — a traceability link that exists in
  source and not in the product is worse than none.

  The second scenario is the one that matters in practice: real pinned elements
  carry both attributes, and the reader must take the criteria from exactly one
  of them. The mock-data record `decl-stock-badge` is this element.
