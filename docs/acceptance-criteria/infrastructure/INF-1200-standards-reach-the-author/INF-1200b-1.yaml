id: INF-1200b-1
title: "Covering a kind of file that had no standard is one statement, and the change that does it contains nothing else"
component: infrastructure
components:
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a kind of file that carries no standard today, and a specialist the
    ownership record already assigns that kind of file,
  When a standard for that kind of file is stated in the one place the project
    declares standards, and no other tracked material in the project is altered,
  Then that specialist begins work with that standard stated in its material,
    against that kind of file,
  And the entire change that produced this outcome is that one statement — no
    specialist's own instructions were edited, no per-kind entry was added, no
    step or case specific to that kind of file was added to whatever carries
    standards outward, and nothing was registered anywhere a second time,
  And given the same exercise is then repeated for a further kind of file, also
    previously uncovered and assigned to a different specialist,
  When that second statement is made and nothing else is altered,
  Then that second specialist likewise begins work with the new standard stated
    in its material, and the change that produced it is again that one statement
    and nothing else — so the cost of covering a kind of file does not grow with
    the number of kinds of file already covered.
