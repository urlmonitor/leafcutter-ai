notes: |
  The first run in KI-BO-20260921 deleted the remote branch refactor/gtfa-decompose, a branch
  its workflow never named. An authorization is bound to the exact pair it names, so a workspace
  authorization never extends to its branch, and neither extends to a neighbour.
  2026-10-25: 'locally' clarified by the user to mean the main project clone's same-named branch (a workspace's own branch goes with its folder).

  USER DECISIONS 2026-10-25 (recorded by IT PO): E -- "locally" means the main project clone's
  same-named branch; the test_intent clause, the test_spec proves_clause and the second
  it_requirement were updated to the new criteria text. A -- 5 trials per scenario, zero
  tolerance, as for BO-4300g-1.

