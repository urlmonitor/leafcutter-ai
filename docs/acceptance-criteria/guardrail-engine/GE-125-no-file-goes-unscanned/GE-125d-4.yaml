notes: |
  WHAT THIS ADDS OVER GE-125d-1, WHICH IS NOT OBVIOUS AND IS THE REASON THE
  RECORD EXISTS. GE-125d-1 announces a reduction that actually withheld
  something. That is per-run, and it only fires once a credential-shaped value
  has already been pasted into a reduced location. This record makes the shape
  of the reduction visible BEFORE that happens, and it is the arm that would
  have shortened the life of the original defect: nobody had to paste a token
  into "templates/skills/" for the exemption to be a problem — the problem was
  that its extent could not be inspected. It is also the arm that catches a
  widening which has not yet withheld anything, which no per-run notice can do.

  THE SECOND ARM IS THE LOAD-BEARING ONE. Asking a check to describe itself is
  cheap and is usually satisfied by printing a hand-written paragraph. Requiring
  the answer to CLASSIFY two real paths correctly, and checking that
  classification against what the check actually does to those paths, is what
  stops the answer being a second piece of prose that is free to be wrong. The
  chosen pair comes from the known issue's measurements:
  "src/vendor/tickets/handler.py" is exempt and was never intended to be;
  "src/app.py" is reported. Both are measured facts today, carried at the
  confidence the known issue records them at and not upgraded.

  THIS ARM SURVIVES ITS SIBLINGS BY CONSTRUCTION. If GE-125a anchors the match
  at the repository root, "src/vendor/tickets/handler.py" stops being exempt —
  and the arm still holds, because it asserts AGREEMENT between the answer and
  the behaviour, not a particular verdict. Whoever implements it after a sibling
  lands should keep the agreement assertion and choose a path pair that still
  differs; they must not weaken it to a single path, which any answer classifies
  correctly by accident half the time.

  FIXTURE PLACEMENT, stated as this tree requires. The pair is deliberately one
  path under a reduced location and one outside it, and both are ordinary source
  paths rather than prose, because the sharpest form of the defect is executable
  code that inherits a prose exemption from a directory name somewhere in its
  path. No fixture in this record needs to be under
  "docs/acceptance-criteria/" or "docs/retrospectives/".

  NOT A BLOCKING PROMISE. Asking the question changes nothing and stops nothing,
  which is stated explicitly in the third arm as this goal requires the
  block-or-announce decision to be made per case.

  IT-PO NOTE, 2026-08-24 — THERE IS NO WAY TO ASK THE CHECK ANYTHING TODAY.
  Measured in the canonical copy: templates/scripts/commit_guardian/
  check_secrets.py has no command-line surface whatsoever. main() takes no
  arguments, there is no argparse and no sys.argv handling, and pre-commit
  invokes it with the staged set discovered from git. So this record is not a
  matter of adding a flag to an existing parser — the query surface is new, and
  the regression it most easily causes is to the zero-argument path pre-commit
  depends on. That is why the complexity is M and why a zero-argument
  invocation entry appears in the test contract.
