criteria: |
  Given the trace-analyzers split rejected after routing had turned the goal away (trigger
    jev_none),
  And the decision-records split rejected after routing would have accepted the goal as one decision
    (trigger bundled_accepted),
  When each run's report is read,
  Then the first says "The proposed split was rejected by human:user; nothing was decided.",
    followed by a hint to ask again as one bounded question, with an example rewording,
  And the second carries the one line "The proposed split was rejected by human:user; the goal is
    kept whole and runs as one decision." above the report of that one decision,
  And a rejected split found mid-run gets the same kind of line, naming the work item kept whole,
  And none of these reports has a per-part section.
