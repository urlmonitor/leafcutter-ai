it_requirements:
  - "Single shared helper mandate: every guard under scripts/commit_guardian/ that needs the project root must obtain it through the ONE shared _resolve_root helper (the GE-113c-1 shared resolver). Forbid per-guard Path(__file__).resolve().parents[N] root literals and any resolution that follows the .leafcutter symlink to the workspace parent."
  - "Consolidate the two currently-divergent mechanisms flagged in GE-113c-1 — the ACS-300g-6 _repo_root() inside check_components_integrity.py and the separate _resolve_root.find_project_root() — into ONE, so a guard cannot regress to a wrong-root literal. Migrate existing guards (at minimum check_components_integrity.py, check_doc_frontmatter.py, check_secrets.py) onto the shared helper."
  - "Regression-proofing as a testable invariant: no guard in the commit_guardian guard set derives the project root by any mechanism other than the shared helper. State the WHAT (e.g. a meta-test or repo assertion that finds no residual parents[N]/symlink-following root derivation across the guard set) and let python-coder choose the HOW."
  - "The git-unavailable graceful fallback (wrap the subprocess, no bare except, warn, safe deterministic fallback per the project error handling policy and ACS-300g-6) lives ONCE in the shared helper, not duplicated per guard."
  - "Deployed/template parity (ADR-001): the shared helper and every migrated guard are edited under templates/scripts/commit_guardian/ and round-tripped to scripts/ via build.py — never edit only one side."
delivers_to:
  agent: python-coder
  contract: "The consolidation guarantee: check_components_integrity.py, check_doc_frontmatter.py, check_secrets.py, and any future commit_guardian guard obtain the project root exclusively through the single shared _resolve_root helper (git rev-parse --show-toplevel + safe fallback), with no per-guard parents[N] literal or .leafcutter-symlink-following resolution remaining in the guard set."
expects_from:
  ac_id: GE-113c-1
  contract: "The single shared project-root resolver produced by GE-113c-1 (scripts/commit_guardian/_resolve_root.py); this AC generalizes its adoption across all guards and forbids alternative per-guard mechanisms."
