notes: |
  RETIRED 2026-09-09 with the whole ACD-800 tree. Decision, mechanism and the
  live-code hazard are recorded once, in ACD-800's notes — read those.

  THIS RECORD'S OWN REASON. The 90%-similarity match is against a done ticket's
  "## Acceptance Criteria" section, so its evidence is a ticket history an
  adopting project does not have (retirement reason 2). It is also the source of
  the "high confidence" label that ACD-800c then treats as sufficient to write
  the finished-state field — a text-similarity score is not an observation that
  the behaviour was implemented, and calling it "high confidence" is what makes
  the downstream write look justified.

  NOTE FOR ANYONE READING THIS AS AN UNBUILT SPEC: it is built. This L1 is
  implemented by `_pass1_similarity` and `_find_matches` in
  scripts/ac_store/cross_reference_audit.py and covered by green tests
  (tests/ac_store/test_cross_reference_audit.py, `# covers: ACD-800a-1` /
  `ACD-800a-2`). The `work_status: todo` and `implemented_by: []` on this record
  are inaccurate and knowingly left so — see ACD-800's notes.

