notes: |
  Mock-mode hardening follow-up (independent code review finding H-2). The shipped badge reads
  a build-time NEXT_PUBLIC_ flag, so it does not change when a runtime ?mock override flips the
  data — the badge can "lie". This AC states the customer-value outcome (badge = resolved runtime
  decision). Criteria sharpened to Gherkin by BA; L3 edge cases UXP-607-1/-2 cover both override
  directions. IT-PO to enrich.
