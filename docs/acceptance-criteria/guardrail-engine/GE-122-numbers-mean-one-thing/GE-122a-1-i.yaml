it_requirements:
  - "This is the single most important test in the tree and the one a plausible implementation fails by accident. The inspection input MUST be the on-disk collection, resolved independently of `git diff --cached` / `--name-only`; the change set may only be intersected with the findings AFTERWARDS. Any implementation that derives its file list from the diff satisfies GE-122a-1 and fails this criterion, and the reviewer should read the input-set construction specifically."
  - "DECIDES THE QUESTION THE BA LEFT OPEN (notes: 'whether a pre-existing collision in which NEITHER claimant is in the change set should BLOCK or only be REPORTED'). DECISION: attribution is diff-scoped, inspection is not. A contested number with at least one claimant in the change set BLOCKS. A contested number with no claimant in the change set is REPORTED with a visible count and does NOT block. This follows the resolution already documented in ci.yml's 'AC store valid' job for the 57 pre-existing orphans, and is what lets the gate be switched on before GE-122e's repair has landed rather than after."
  - "The count of reported-but-unattributed collisions MUST be printed on every run, exactly as GE-122b-2 requires for its pre-existing unnumbered population. A silently-tolerated backlog is how the current drift accumulated; a visible count is what makes the backlog shrink."
  - "Once GE-122e has repaired the collection, no configuration change should be needed to make the unattributed case block — the set is expected to be empty, so the two dispositions converge. Do NOT implement the tolerance as an allowlist or a known-bad list of identifiers: GE-122e-3 asserts that no such configuration exists anywhere."
  - "Must not add a second collection walk: reuse GE-122a-1's single pass and filter its verdict. A separate diff-scoped walk would be a second definition of the rule and would fail GE-122d-1."
test_spec:
  - name: test_collision_reported_when_only_one_claimant_is_staged
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "Stage exactly ONE of the two claimants — the other is committed and untouched — execute the pass, and assert the unstaged claimant's path appears in the output. Staging both claimants is explicitly not an acceptable substitute."
  - name: test_collision_reported_when_neither_claimant_is_staged
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "With a change set touching neither claimant while the collision is still present, the pass still reports the contested identifier and both paths."
  - name: test_unattributed_collision_reports_but_does_not_block_commit
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "The neither-claimant-staged case yields a non-blocking commit-time disposition and a printed count of unattributed contested numbers, while the one-claimant-staged case blocks."
  - name: test_new_uncontested_record_produces_no_finding
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: behavioral
    description: "A change set adding a record whose identifier no other record claims produces no finding for that record."
test_rationale: |
  The distinguishing test is the one-claimant-staged case: it is the only condition under which
  a changed-files implementation and a whole-collection implementation give different answers,
  and it reproduces the actual incident (the two GE-119 records were authored weeks apart from
  different working copies and have never appeared in one diff). A test that stages both
  claimants passes on both implementations and therefore proves nothing, which is why the
  coverage note rules it out. The blocking-disposition descriptors exist because the
  attribution decision is made in it_requirements rather than in the criteria, so it needs its
  own executable evidence.
