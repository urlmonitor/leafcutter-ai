test_spec:
  - name: test_two_overlapping_routing_steps_write_the_same_learning_once
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Drive two completion paths in two isolated working directories of one install so that their routing steps genuinely overlap — both must have read the sink before either has finished. Merge both branches. Assert the learning appears once in the merged tree, and that exactly one of the two reported results counts it as written while the other says it did not. Overlap has to be real: a test that starts the second run after the first has returned exercises nothing this AC is about."
  - name: test_neither_run_concludes_the_other_has_it
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "The other half of the same race, and the one an over-eager arbitration produces. With the same overlapping pair, assert the learning is present in the merged tree at all — not zero writes because each run deferred to the other. Assert also that the record is not left eligible after a successful write, which would produce the duplicate on the next run instead."
  - name: test_the_routing_bookkeeping_survives_two_runs_updating_it_at_once
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "Run several overlapping pairs in a loop against one install. After each pair, assert the bookkeeping is readable, parses, and reflects both runs rather than only the last writer. A half-written state file is the failure that turns every subsequent run into a no-op or a re-run of everything, and it appears only under repetition — one pair can pass by luck."
  - name: test_a_lost_learning_is_the_failure_the_arbitration_must_not_produce
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: failure
    description: "The asymmetry, as a negative control. Run the overlapping pair, then discard one branch without merging it. Assert the learning is in the merged tree — either because the surviving run wrote it, or because the record stayed eligible and a later completed unit of work did. A run that marked the record routed on the strength of the discarded branch's write goes red here. This is INF-700a-5's bookkeeping clause under concurrency, which is the condition that makes it easy to get wrong."
  - name: test_concurrent_units_of_work_do_not_delay_or_fail_each_other
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Assert each of two overlapping units of work reports the same outcome, failure count and exit status it reports when run alone, and that both complete. An arbitration that makes one wait indefinitely on the other, or fails the loser, satisfies the write-once clause and breaks the package's fail-open rule; equality against the solo run is what catches it."
  - name: test_removing_the_arbitration_makes_the_write_once_test_fail
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "the completion paths driven through the workflow engine harness with the arbitration disabled"
    description: "The anti-fire-and-forget control. With whatever arbitration is chosen disabled, assert the overlapping pair produces two writes. If it does not, the first test was passing on timing rather than on the arbitration, and every other descriptor here is meaningless. This test is what proves the mechanism is reached."
test_rationale: |
  Every descriptor requires a genuine overlap, because the entire subject is a
  race and a sequential fixture cannot fail any of them. The last descriptor is
  the one that keeps the rest honest: a concurrency test that passes because
  the two runs never actually overlapped is indistinguishable from one that
  passes because the arbitration worked, and this repository has shipped that
  confusion in another form — a gate that was defined, tested and never
  executed. Disabling the arbitration and requiring the failure to appear is
  the only way to show the fixture reaches it. The bookkeeping descriptor loops
  rather than running once because a torn write is probabilistic; a single pair
  passing proves nothing about it.
notes: |
  WHY THIS IS AN L3 UNDER INF-700a-5 AND NOT A NEW L2. INF-700a-5 owns the rule
  that a learning counts as written only when its write is published, and owns
  the bookkeeping that must not outlive the publication it rode. Two routing
  steps racing is that same bookkeeping under a second stress, and both failure
  shapes here are that rule breaking — a duplicate is the same learning
  published twice, and the loss is a record marked routed against a publication
  that never arrived. It is an edge case of an existing behaviour rather than a
  new behaviour, which is what makes it L3. INF-700a remains at five children;
  nothing here needs a split.

  WHY IT IS SPECIFIED NOW RATHER THAN WHEN IT BITES. Until the sink was shared
  this condition could not arise: each working directory had its own sink and
  its own bookkeeping, so two drives never saw the same record. Making one sink
  serve the whole install is what creates the race, and it is created on a
  system where parallel working directories are routine — three at once has
  been observed. The concurrency is a direct consequence of the sink decision
  and arrives with it.

  THE MECHANISM IS NOT CHOSEN HERE, DELIBERATELY. A lock, an atomic state
  swap, a claim written before the write, per-branch bookkeeping reconciled at
  merge, or something else — any of them can satisfy these criteria and the IT
  PO owns the choice. What the criteria fix is the outcome and the asymmetry:
  of the two ways this fails, the duplicate is visible and survivable and the
  loss is neither, so a mechanism that converts losses into duplicates is an
  improvement and a mechanism that does the reverse is not, however much
  cleaner the duplicate-free case looks.

  BOUNDARY. INF-400c-4 owns concurrent APPENDS to the shared sink — that no
  record is lost, truncated or interleaved on the way in. That half is close to
  free with append-only writing. This record owns the ROUTING side, where the
  contended thing is the bookkeeping beside the sink rather than the sink, and
  where the cost of getting it wrong is a learning nobody will look for again.
change_target:
