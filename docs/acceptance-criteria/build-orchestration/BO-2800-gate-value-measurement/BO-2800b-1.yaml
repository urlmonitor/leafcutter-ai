title: "Every gate whose prompt this project owns declares a closed vocabulary of problem kinds"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a gate whose prompt template is owned and editable in this project — for example
    the documentation-verification gate or the acceptance-criteria validation gate,
  When its declared vocabulary of problem kinds is read,
  Then the vocabulary is a closed, enumerated list of rule identifiers scoped to that gate,
    each written as the gate name followed by a rule name, for example
    "documentation-verifier/how-to-missing-for-trigger",
  And every finding that gate emits carries exactly one rule identifier drawn from that
    list, alongside its free-text detail describing the specific instance,
  And a finding whose rule identifier is not in the emitting gate's declared vocabulary is
    recorded under that gate's unclassified namespace rather than being accepted with an
    invented category,
  And an owned gate that reports findings without declaring any vocabulary is reported by
    name as missing one.

  Given the pull-request review gate, whose findings originate in the external
    `pr-review-toolkit:review-pr` skill that its own agent template forbids this project
    from modifying,
  When the set of gates required to declare a vocabulary is determined,
  Then the pull-request review gate is listed as an explicitly exempt relaying gate, named
    together with the reason it cannot declare one,
  And it is not reported as an owned gate missing a vocabulary,
  And its findings are still recorded and still counted, taking their identity from the
    unclassified-namespace path rather than being dropped or left unlabelled,
  And a report that presents per-gate vocabulary coverage states how many of the recorded
    findings came from exempt relaying gates, so a reader cannot mistake the covered
    fraction for the whole population.
