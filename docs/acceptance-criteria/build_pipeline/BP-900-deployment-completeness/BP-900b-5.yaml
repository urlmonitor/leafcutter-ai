test_spec:
  - name: test_documentation_verifier_placeholder_scan_runs_from_consumer_install
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: deployed
    description: "In the shared directed (consumer-layout) build, the exact placeholder-scan command the compiled documentation-verifier prompt gives the agent runs in an isolated interpreter, imports build_placeholder_detection from the install, and reports a TODO marker in a scratch file."
    must_catch:
      - "build_placeholder_detection.py is not deployed"
      - "build_placeholder_table_context.py is not deployed"
      - "the template inserts <worktree_root>/scripts instead of the deployed scripts directory"
  - name: test_every_script_or_config_reference_in_compiled_prompts_is_deployed
    target_dir: unit_tests/build_guards/
    framework: pytest
    type: integration
    angle: criterion
    description: "Every package script or config file that a compiled agent/skill/command/workflow prompt tells the agent to run, import or read resolves to a file present in the consumer install; the scan fails on an empty population, must see the documentation-verifier import as a positive control, and names each explicitly exempted non-package reference with its reason."
    must_catch:
      - "a prompt tells the agent to run, import or read a package file the build never deploys"
