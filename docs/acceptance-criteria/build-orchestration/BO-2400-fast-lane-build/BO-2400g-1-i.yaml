notes: |
  WHY THIS IS A SEPARATE L3 AND NOT A CLAUSE ON THE PARENT. BO-2400g-1 is written
  about "one piece of work", which is how the demand is framed everywhere else in the
  store (BO-2900g-1 uses the same framing). On this lane, though, the unit is a
  connected SET: the operator names one id and the resolver pulls in the subtree plus
  unmet prerequisites (scripts/build_orchestration/fast_lane.py:498,
  resolve_connected_build_set, readiness-agnostic). An implementation that wires the
  demand to the named id only passes every clause of the parent and leaves the
  majority of a real run unasked, which is exactly the shape this L3 exists to catch.

  PLANNING-TIME ONLY, INHERITED. Like its parent, this AC settles what is ASKED FOR.
  It says nothing about whether any of the five requirements was actually reached, and
  nothing here may be offered as evidence of that (BO-2900a-2).

  NOT RE-SPECIFYING RESOLUTION. How the connected set is computed, its ordering, and
  its readiness-agnosticism belong to BO-2400f-1 / BO-2400f-2 and must not be restated
  here. This AC only asserts that whatever set was resolved is the set that gets asked.

  THE DUPLICATE-REQUEST CLAUSE IS NOT PADDING. The obvious repair for the five-member
  gap is to append the request once per member; the obvious existing behaviour is to
  append it once per run. Implementing the first without removing the second yields a
  double ask on every single-member run — the same "skip-branch side-effect,
  conditionalize don't add" defect recorded in CLAUDE.md, which duplicated an entry on
  every skipped step and stayed green because the structural test only checked for
  presence.
