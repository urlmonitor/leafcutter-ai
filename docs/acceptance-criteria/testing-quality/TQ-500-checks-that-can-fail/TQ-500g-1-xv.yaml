notes: |
  WHY. Analysis 3(b): "run-level record" was caught in rounds I and II and
  survived in III with no test change; the guess changed. Without the
  alteration in the row, "caught" and "survived" cannot be compared across
  runs.

  IDENTITY FROM THE REPLACEMENTS ALONE. Not from the altered copy and not from
  the diff, both of which change when the file changes elsewhere. Runs 1 and 2
  prove it. A stable hash of the ordered replacements is the analysis's
  suggestion; IT-PO chooses.

  KEEP, DON'T DELETE. Today the writer removes the earlier manifest and copies
  before writing (TQ-500g-1-ix decision 2f). That becomes a move into a
  per-run history. The guard "never read an old manifest by mistake" still
  holds, because the runner reads only the path it is handed (last clause).

  OPEN FOR IT-PO. Retention: nothing here bounds the history. The per-work
  folder lives under the worktree's git directory and goes with the worktree,
  so the BA did not add a cap; flag if disk use proves otherwise.

  IT-PO ENRICHMENT (2026-10-23)
  IDENTITY: "sha256:" + 16 hex over the ordered replacements (_wvp_store,
  TQ-500g-1-xi). HISTORY: work/<key>/history/<NNNN>/, filled by moving the
  earlier manifest and copies; -ix's it_requirements were amended from
  "removes" to "moves". RETENTION: unbounded, logged.
  CAVEAT FOR THE BA: this AC's criteria word run 1's source "prepared", while
  TQ-500g-1-xii's criteria word the same situation (a name with no pin)
  "prepared: not pinned". One vocabulary is needed; the IT-PO wrote
  "prepared: not pinned" for both and reads this AC's "prepared" as that value.
  If the BA wants the short word, -xii's criteria change instead.
  RESOLVED (BA, 2026-10-24, user-approved decision set): this AC's criteria now
  say "prepared: not pinned"; -xii is unchanged.
