id: BO-2500f-3
components:
  - build_orchestration
  - testing_quality
  - ac_store
title: "An inspection stops counting once the material it covered has changed, checked when the work is marked done"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a test-free record verified by an inspection that lists two files, each
    with the content fingerprint of the version the reviewer inspected,
  When the record is marked done,
  Then each listed file is fingerprinted as it stands in the version being marked
    done and compared with its recorded fingerprint,
  And when both fingerprints match, the inspection holds,
  And when either differs, marking done is refused with the verdict
    "re-inspection needed", naming each changed file with its recorded and its
    current fingerprint,
  And a listed file that no longer exists at its recorded path refuses marking done
    in the same way, reported as missing rather than as changed,
  And this comparison is made at every layer that decides done for a record being
    marked done: the mark command, the commit-time done check and the CI check over
    changed records,
  And the inspection's age plays no part in the verdict, so an inspection of
    unchanged content holds however old it is,
  And re-checking records that are already finished, and demoting those whose
    inspected content has since changed, is not done here; it belongs to TQ-400a
    and TQ-400b.
depends_on: [BO-2500f, BO-2500f-1]
