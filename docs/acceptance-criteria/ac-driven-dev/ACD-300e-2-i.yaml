title: "Agent proceeds with baseline context when knowledge-query returns no matching nodes"
component: ac-driven-dev
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given any of the three authoring agents (PO v3, BA v3, IT PO v3) invokes
    knowledge-query with a keyword or component name during S1,
  When the knowledge-query script returns zero matching nodes
    (the graph contains nodes but none match the query),
  Then the agent logs the assumption: "knowledge-query returned 0 nodes for
    '<query-term>' — no related context discovered, proceeding with
    file-based reads only",
  And the agent continues its normal S1 workflow without error or retry,
  And the agent does not present a deduplication warning to the user,
  And the agent does not add any doc_links derived from the empty result,
  And the final AC output is structurally identical to what the agent would
    produce without the knowledge-query feature (no empty or placeholder fields).
depends_on: [ACD-300e-2]
