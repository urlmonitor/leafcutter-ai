id: GE-120g-4
components:
  - commit_guardian
title: "A judging check hands back the file it was given to read byte-for-byte, so reading your config cannot be what breaks the next commit"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  GE-120g-1 established that being looked at leaves your working copy as it
  was. It is enforced by `run_hook.py`, which snapshots the working tree around
  a judging check and reverts what that check changed. That protection has a
  hole: it reverts tracked working-copy paths, and `.leafcutter/` is build
  output, untracked. A judging check that writes inside `.leafcutter/` is not
  caught by it, and nothing else notices.

  `check-negative-control-liveness` writes there. Its own registration hands it
  the deployed `commit_guardian.json` as its `--manifest` input, and it writes
  that same file back on every run whether or not anything in the document
  changed. The next commit then fails `check-output-drift` on a file the author
  never touched.

  Scenario: A run that changes nothing leaves the file byte-for-byte identical
    Given a deployed commit-guardian manifest as `build.py` produced it,
    And a run of the liveness check over that manifest that finds no
      `currently` block needing an update,
    When the check runs to completion and exits,
    Then the manifest file's bytes are exactly what they were before the run,
    Because the only reliable way for a judging check to leave a file alone is
      not to write it, and this is the overwhelmingly common case — every
      ordinary commit.

  Scenario: A run that must record something preserves the characters it read
    Given a manifest containing non-ASCII characters in its `_comment` prose,
    When the check runs and does have a genuine update to record,
    Then the characters it did not change are written back as the characters
      they were, not as escape sequences,
    Because a write that silently transliterates the parts it was not asked to
      touch is a second, quieter version of the same defect.

  Scenario: The verdict is unaffected
    Given any manifest,
    When the check runs,
    Then the pass/fail verdict and the per-check result lines it prints are
      what they were before this change,
    Because this criterion governs what the check writes, not what it decides.
