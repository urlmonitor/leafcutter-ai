criteria: |
  Given a package-surface AC whose it_requirements names a registration entry or
    reference file that does not resolve to a real artifact in the repository,
  When the AC is validated,
  Then validation fails,
  And the failure identifies the fictional or unresolvable reference so it cannot be
    passed off as a valid spec.
