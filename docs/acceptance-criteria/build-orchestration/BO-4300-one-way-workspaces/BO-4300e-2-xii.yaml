notes: |
  Observed 2026-11-02: leafcutter-ai-worktrees/ac/maker-remove-hardening lost its workspace
  record and almost all of its repository; 18 files remain -- 17 top-level files of the
  project (CLAUDE.md, README.md, .gitignore, build outputs ...) and one leftover repository
  file (.git/FETCH_HEAD, which names the shared project it last fetched from). Today a retry
  answers NOT_FOUND because a record-less folder holding files is refused by design (user
  decision 2026-10-29), so the maker can never finish it.

  NEEDS USER CONFIRMATION (Q1 in the BA sign-off) -- this record NARROWS the 2026-10-29
  decision. That decision's reason was "the folder cannot be told to be a workspace of this
  project". A leftover repository file naming this project's shared project, inside this
  project's own landing place at a workspace position, tells exactly that. The narrowing is
  kept minimal: identity only makes the folder half-cleared, so the BO-4300e-2-vi rule still
  applies in full -- its files are listed and are deleted only with a one-time token. The
  second and third arms pin that the 2026-10-29 rule is unchanged for every other record-less
  folder: one whose leftover names another shared project, and one with no repository
  leftover at all, are still refused "not found" with no token and never touched.

  The project boundary of BO-4300e-2-iii still applies on top: a folder in another project's
  landing place is never touched, whatever it holds.

  If the user rejects the narrowing, drop this record; the observed folder then stays a
  manual cleanup (outside the maker), which the user's request of 2026-11-02 asked to avoid.

  After this ships, the real folder is finished by asking the maker again with the token from
  its refusal (operational check, not a CI test: the folder exists only on the user's machine).
