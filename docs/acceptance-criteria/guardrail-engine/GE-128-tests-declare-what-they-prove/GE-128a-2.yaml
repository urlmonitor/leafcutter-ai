test_required: true
test_spec:
  - name: test_one_more_undeclared_test_is_refused_with_counts_and_name
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Scenario 1. A temp git repo commits a test file with 12 test functions, 7 undeclared; the change adds undeclared test_new and is staged. The real hook CLI (templates/scripts/commit_guardian/check_test_ac_tags.py) runs over the staged file with the mode forced to error; asserts non-zero exit and output naming the file path, the before count 7, the after count 8 and test_new."
    must_catch:
      - "gate disabled or allowing everything"
      - "compare the after count against zero instead of the file's previous count"
  - name: test_same_file_edited_without_new_undeclared_test_is_allowed
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "Scenario 2. Same committed file; the staged change edits the body of one undeclared test and adds a non-test helper, leaving 7 undeclared. The real hook in error mode exits 0 and its output does not list any of the 7 existing undeclared tests as a violation."
    must_catch:
      - "flat rule that refuses any file still holding an undeclared test"
  - name: test_both_arms_in_one_run_refuse_growth_and_allow_the_edit
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: discrimination
    description: "Scenario 3. In one test process, the Scenario 1 and Scenario 2 changes are each staged in their own copy of the same committed repo and judged by the same hook build: asserts exactly one refusal (Scenario 1) and one allow (Scenario 2). A refuse-everything or allow-everything hook fails this test."
    must_catch:
      - "refuse everything"
      - "allow everything"
  - name: test_real_git_commit_is_refused_and_head_is_unchanged
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: reachability
    description: "The temp repo wires the hook as its pre-commit hook in error mode, the Scenario 1 change is staged and a real `git commit` is run: asserts the commit fails and HEAD still points at the pre-change commit; then the Scenario 2 change is committed and HEAD advances."
  - name: test_one_files_decrease_does_not_offset_another_files_increase
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: behavioral
    angle: boundary
    description: "One commit stages file A going 5 -> 6 undeclared and file B going 5 -> 3. The real hook in error mode refuses and names A only; B is not reported."
    must_catch:
      - "sum the undeclared count across all staged files"
test_rationale: >-
  The ratchet compares a file against its own previous version, which only exists
  in a real git history, so every test builds a real temp repository and runs the
  real hook CLI over the real staged file, with the mode forced to error so a
  refusal is visible as an exit code. The parent L1's notes make the paired
  negative arm mandatory and say to prove it by mutation, not by grep: the
  both-arms test fails a hook stuck on either answer, and the must_catch entries
  name the wrong versions that each positive test alone would let through. One
  test drives a real git commit to prove the verdict is reached through the commit
  path, not only through a direct CLI call. The illustrative counts (12 and 7) are
  fixture values; the per-file offset test pins the per-file grain the L1
  specifies.
notes: |
  The counts (12 functions, 7 undeclared) are illustrative fixture values; any file
  with at least one undeclared test before the change exercises the same rule.
  Whether a file with NO previous version is judged at all, and against what, is
  GE-128b's subject and is deliberately not decided here: a scenario that treats
  "no previous version" as "previous count of zero" would make GE-128b's decision
  by accident.
