title: "A merge is not asked to repair links it did not author"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a merge that brings in a branch containing child records whose structural
    parents do not name them, where the merge result for those records is taken
    verbatim from one side and so is identical to that side's version,
  And, in the same merge, one child record whose content the merge itself
    introduces and whose structural parent does not name it,
  When the merge commit is checked at the moment it lands,
  Then the records taken verbatim from one side are not reported as violations,
  And the record the merge itself introduces is reported as a violation in that
    same run.
depends_on:
