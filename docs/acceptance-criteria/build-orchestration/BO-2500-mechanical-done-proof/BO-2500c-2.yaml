it_requirements:
  - "Encode in the test-writer agent template the rule that parser/validator tests must write the input to a real on-disk artifact with the production producer and read it back, asserting on the round-tripped value — not on an in-memory literal."
  - "The convention must require the same producer the system uses in production (e.g. the actual serializer / file-writer), so the on-disk format under test equals the format that actually occurs (see project memory: behavioral spot-check on REAL store)."
  - "The convention must be consistent with the independent real-artifact behavioral check (BO-2500c-3) and the fixture policy (BO-2500c-1)."
