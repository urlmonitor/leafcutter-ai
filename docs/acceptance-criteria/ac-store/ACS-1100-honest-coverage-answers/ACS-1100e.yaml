criteria: |
  One reference section explains the whole contract, not four scattered fragments.

  Everything a reader needs in order to produce or consume an honest answer — what an
  answer carries, how its total was arrived at, what may be left out and on what
  grounds, what happens when the numbers do not add up, and what a downstream verdict
  may claim — is written in a single place in the store's reference documentation, so
  a tool written a year from now inherits the whole contract rather than rediscovering
  a fraction of it.
