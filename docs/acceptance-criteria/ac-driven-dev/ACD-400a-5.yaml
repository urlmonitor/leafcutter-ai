id: ACD-400a-5
components:
  - ac_driven_dev
readiness: reviewed
priority: high
title: "A prerequisite that can itself be built still holds back its dependant, even when it also sits above it in the hierarchy"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given the store holds a unit of work "P" that is buildable in its own right — it
    carries its own criteria and its own single owner, a builder can be handed it
    exactly as it stands, and it reaches a completed state by being built — and P
    has not been completed,
  And the store also holds a composite "C" that is never handed to a builder as it
    stands and only reaches a completed state by the things beneath it reaching one,
  And a refinement "R" that sits directly beneath P in the store's hierarchy names P
    as the prerequisite it refines,
  And a separate refinement "S" that sits directly beneath C names only C as its
    prerequisite,
  When the scanner is asked which work is ready to be picked up,
  Then R is not offered as ready, and the account of what is holding R names P,
  And S IS offered as ready, and nothing in the account of held work names C as
    holding S,
  And the only thing holding R is that P is not finished — R's position beneath P in
    the hierarchy neither adds a reason to hold R nor removes one.
depends_on: [ACD-400a, ACD-400a-3]
