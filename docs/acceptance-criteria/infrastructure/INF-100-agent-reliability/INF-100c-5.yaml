criteria: |
  Given the package's agent definitions mark 24 agents with signoff: true,
    including restructuring-specialist,
  And the feedback categories file lists restructuring-specialist in no category's
    allowed_writers (all nine categories checked: complete, knowledge-gap,
    quality-concern, tooling-issue, convention-ambiguity, blocker,
    subagent-quality, success-pattern, process-finding),
  When the package build runs,
  Then the build fails before it reports success,
  And the failure message names restructuring-specialist as an agent that signs off
    but can write to no feedback category,
  And when two such agents are missing (restructuring-specialist and
    change-scope-reviewer) the one failure message names both, not only the first found,
  And after restructuring-specialist and change-scope-reviewer are added to the
    complete category's allowed_writers, the same build passes this check.
