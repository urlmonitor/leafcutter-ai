description: Decide how to make the Leafcutter kernel procedure (the /leafcutter skill for Claude ...
decision_type: design
question: 'Decide how to make the Leafcutter kernel procedure (the /leafcutter skill for Claude Code) usable from OpenAI Codex,
  both the CLI and the IDE extension. Codex 0.160 has no custom slash commands any more; it runs skills from .agents/skills/<name>/SKILL.md
  (repo) or ~/.agents/skills (user), invoked explicitly as $leafcutter, with agents/openai.yaml able to forbid implicit invocation;
  it ignores allowed-tools, blocks network in its default sandbox unless config.toml enables network_access or a .codex/rules
  prefix_rule allows a command, and offers structured questions only in Plan mode, so kernel questions are asked as plain
  text. Options: a repo-level skill in .agents/skills/leafcutter with a .codex/rules prefix rule that allows only the kernel
  command; a user-level skill in ~/.agents/skills/leafcutter with network access enabled in ~/.codex/config.toml; or another
  option grounded in the repository.'
