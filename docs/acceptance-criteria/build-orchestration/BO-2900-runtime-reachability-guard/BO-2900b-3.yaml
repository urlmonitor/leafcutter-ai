it_requirements:
  config_schema_fragment:
    invocation:
      type: object
      description: "{ script: '<repo-relative path>', line: int, surface: '<script path the command runs>', capability: str }. One record per actual invocation of a command surface by an automation script. The capability is the first positional argument of the executed command, never a name found elsewhere in the file."
  reference_file_path: "templates/workflows-js/fast-lane-ship.js"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands:
    - "./build-self.sh"
  constraints:
    - "THIS IS THE SHARED SEAM. collected_invocations(script_paths) -> list[Invocation] lives in scripts/commit_guardian/_reachability_inventory.py and is consumed by BO-2900b-1 forwards, BO-2900c-1/-2 backwards and BO-2900a-3 condition (3). Defined once; any second collector is a defect."
    - "COLLECT FROM COMMAND STRINGS THAT THE SCRIPT EXECUTES, NOT FROM THE FILE'S TEXT. In this repository an automation script invokes the surface as a program from a command string (see templates/workflows-js/fast-lane-ship.js:193, 264, 305, 312, 315, 465: `python3 ${gateScript} <capability> --flag value`). The collector must locate the executed-command expressions — the arguments of the script's command-running calls and the command strings it hands to its runner — and take the capability as the first positional token after the surface path. Text elsewhere in the file (comments, printed operator messages, variable names, log lines) is out of scope by construction, not by a filter."
    - "THE RENAME CLAUSE IS THE ACCEPTANCE PROPERTY: renaming the comment, the printed message and the local variable must produce a byte-identical collected set. Any implementation that can fail this is a substring scan regardless of how it is described. The three decoys are chosen to defeat, in order, a raw substring scan, a comment-stripping scan, and a string-literals-only scan."
    - "The invocation crosses a language boundary (JavaScript automation invoking a Python surface as a program), so the connection is the ARGUMENT the automation passes, not any language-level reference. Do not attempt to resolve it via imports or symbols."
    - "Surface identity must be resolved to a repo-relative path even when the command is built from a variable (e.g. `${gateScript}` bound to `${worktreePath}/scripts/build_orchestration/fast_lane.py`), so an invocation is attributed to the surface it actually runs. An unresolvable surface reference must be reported as such, never silently dropped — a silently dropped invocation makes a called capability look uncalled."
delivers_to:
  agent: python-coder
  contract: "collected_invocations(script_paths) -> list[{ script: str, line: int, surface: str, capability: str }] from scripts/commit_guardian/_reachability_inventory.py. Consumed by BO-2900b-1 (which registered capabilities have a caller), BO-2900c-1 and BO-2900c-2 (which invocations name a capability that exists), and BO-2900a-3 condition (3) (is the unit run as a program by any automation)."
expects_from:
