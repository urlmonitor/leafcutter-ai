criteria: |
  Automatic persona awareness at agent startup — no manual steps.

  The PO, BA, and relevant agents receive a persona summary the moment they
  are spawned. The injection is scoped so only agents that need audience
  awareness get it, and it is configurable. Agents start every task already
  knowing who they are building for.
