title: "Architect asks PO/BA clarifying questions when intent is ambiguous"
component: build-orchestration
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the architect agent is processing a ticket whose acceptance criteria
    reference a behavior that could be implemented in two or more architecturally
    distinct ways,
  When the architect cannot determine the intended approach from the existing
    documentation and the ticket's criteria alone,
  Then the architect produces a structured clarification request:
    - question: "<the specific ambiguity>"
    - context: "<what the architect has read and why it is insufficient>"
    - options: ["<approach A with tradeoffs>", "<approach B with tradeoffs>"]
    - addressed_to: "PO" or "BA" depending on whether the ambiguity is about
      user intent (PO) or behavioral specification (BA)
  And the architect pauses its artifact production until the question is answered
  And the clarification request is recorded in the ticket's comments section

  Given the architect has received a response to its clarification question,
  When it resumes artifact production,
  Then its ADRs, diagrams, and documentation reflect the answered direction
  And the ADR's Context section references the clarification exchange
