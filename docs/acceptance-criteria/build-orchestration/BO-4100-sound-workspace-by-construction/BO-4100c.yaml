criteria: |
  Finished workspaces stop piling up, and none holding undelivered work is ever let go.

  For any workspace you can tell whether it still holds work that has not reached
  the shared line, so the ones that are genuinely finished with can be let go
  routinely instead of accumulating indefinitely, and a workspace that still holds
  something you would miss is never disposed of on the assumption that it does not.
depends_on: [BO-4100]
