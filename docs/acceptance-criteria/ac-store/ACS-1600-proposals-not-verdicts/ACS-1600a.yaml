    relevance: >-
      THE LIFECYCLE THIS CRITERION READS, AND THE PLACE IT IS CURRENTLY UNDER-READ.
      The status lifecycle defines retired states and says they are "excluded from
      active enforcement", listing the readers that honour that. This adds one more
      reader. Decomposition must derive the set of retired states FROM that
      lifecycle rather than hard-coding the two values that happen to be common
      today — a third retired state added later must not silently re-open the hole.
  - path: docs/acceptance-criteria/ac-store/ACS-900-deprecation-hygiene/ACS-900.yaml
    relationship: related
    status: exists
    relevance: >-
      ADJACENT, FENCED, AND NOT TO BE ABSORBED IN EITHER DIRECTION. ACS-900 is the
      commit-time gate that fires when a requirement is retired and checks the code
      it claimed is gone. This criterion is the opposite direction on the same
      lifecycle: a retired requirement being out of reach of automation that would
      otherwise still act on it. Neither may be closed as a duplicate of the other.
