it_requirements:
  - "TARGET: templates/scripts/setup_ticket_worktree.py, the create-ac-worktree path, which today warns 'not found ... graceful no-op' for verify_precommit_active.py and install_pre_commit_shims.py and then reports a successfully created working copy. VERIFIED 2026-08-14 that both scripts DO exist at templates/scripts/commit_guardian/ — the failure is resolution, not absence, which is why GE-120d-3 is the paired fix."
  - "BLOCK IS THE RECORDED DISPOSITION for this case per GE-120a-2, with the stated reason: the artifact handed over is otherwise unprotected and is then used for hours by someone who was not watching set-up run. Record it WHERE GE-120a-2 records dispositions, not only in prose on this AC — a disposition that lives only in an AC note is not reviewable as a set."
  - "FAIL THE SET-UP MEANS THE CALLER MUST SEE IT: non-zero exit AND the callers (worktree-agent, the /feature path, build-epic.js) must not treat the copy as prepared. Verify the caller-visible contract, not just the exit code — a refusal the caller ignores is the same no-op one layer up, which is precisely the shape of this defect."
  - "ANY WORKING COPY LEFT BEHIND must be reported as unprotected in the failure output, naming its path, so it cannot be mistaken for a prepared one. Decide EXPLICITLY whether it is removed or left with a marker, and state which — leaving that question to the reader recreates the ambiguity the AC closes. If it is left, leaving it in a state a later run can detect is preferable to silent removal of someone's checkout."
  - "REPRODUCE WITHOUT CONTRIVANCE: this exact condition was observed live while creating the working copy this tree was authored in. Make the scripts genuinely unreachable rather than stubbing the not-found branch — a stub tests the branch the author wrote, not the resolution failure that occurred."
  - "ADR-001 deployed/template parity across all three copies of setup_ticket_worktree.py (templates/scripts/, scripts/, .leafcutter/scripts/): edit the template, run 'python scripts/build.py --target-dir .', confirm all three match. Callers run the deployed copy."
  - "Error-handling policy: the not-found condition is a caught specific exception (OSError / FileNotFoundError) logged at WARNING and escalated to a refusal — never swallowed into a no-op, which is the behaviour being removed."
