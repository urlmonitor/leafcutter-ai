notes: |
  The uniformity half of BUG-23 (run wf_cc2b46d9-f6f), and the reason that defect is
  worse than a deterministic bug.

  THE EVIDENCE IS THE INCONSISTENCY. Ticket 01 lost test-runner and pr-reviewer;
  ticket 03 lost test-runner but recorded pr-reviewer; ticket 09 recorded test-runner
  but lost pr-reviewer. No gate is reliably broken and no gate is reliably sound. The
  consequence is the one stated in the criteria: from a work item alone you cannot
  distinguish a gate that was skipped from a gate that ran and did not record, so
  every downstream reader -- the completion trigger, the roll-up, the archive check,
  and a human -- is reading a record that cannot answer the question it is being
  asked.

  WHY THIS IS NOT ABSORBED INTO BO-2900f-1-i. That AC can be satisfied completely by
  a read-back added at two or three gate call sites, which would have fixed the three
  tickets in the observed run and left the next gate unguarded. The property that
  survives is that the check belongs to the dispatch path itself, and that property
  is only falsifiable across multiple items and gates in one run.
