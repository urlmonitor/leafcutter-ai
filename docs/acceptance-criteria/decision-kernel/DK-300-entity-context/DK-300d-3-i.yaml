it_requirements:
  - "Human and host resumes reuse the serialized initial interpretation snapshot without re-recognition, even after index refresh or source change."
  - "Legacy context_enrichment checkpoints retain gathered/no_evidence semantics and do not gain an entity_context claim during resume."
  - "Full original goal survives resume separately from clarification responses; later evidence must reveal its new source version/hash without rewriting initial card provenance."
