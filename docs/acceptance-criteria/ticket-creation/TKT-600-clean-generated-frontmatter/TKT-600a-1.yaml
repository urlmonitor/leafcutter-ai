it_requirements:
  config_schema_fragment: null
  n_location_rule: '2'
  notes: 'Two independent defects in generate_ticket_from_ac.py, both observed live
    during

    the BO-2600 build:

    (1) files_touched over-extraction: _build_files_touched -> _extract_paths_from_prose

    pulls any ''/''-containing token with a known extension out of list-form

    it_requirements bullets, so illustrative example paths (e.g. src/foo.py,

    deploy/foo.py, src/config/foo.py used only to describe an exploit scenario) land
    in

    files_touched. Restrict prose extraction (e.g. only accept the structured

    reference_file_path + edit-surface doc_links; do not harvest arbitrary paths from

    narrative bullets), or gate on file existence.

    (2) depends_on passthrough: _build_frontmatter writes `ac.get("depends_on") or
    []`

    verbatim (AC ids), which ticket_frontmatter_guard rejects because ticket depends_on

    must reference co-located ticket files. Drop the structural-parent AC id

    (derive_parent_id) and translate remaining AC-id deps to their generated ticket

    filenames when in an epic context, else emit [].

    Preserve existing behavior for ACs that already produce correct output.

    '
