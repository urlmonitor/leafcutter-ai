notes: |
  Mirrors ACS-400e-1 ("Blocked commit produces a clear, actionable error
  message") for this hook. Load-bearing message contents (per PO note): (a) the
  AC id, (b) the implemented_by entry that broke, (c) the kind of change
  (moved / renamed / deleted; and at symbol level the symbol name and its new
  location), and (d) a pointer to the GE-111d reconciliation options (the
  applicable-routes content comes from GE-111d-3).

  IT-PO enrichment (2026-06-22): GE-111e-1 consumes TWO upstreams — the verdict
  object (primary expects_from: GE-111b-1, extended by GE-111b-2/b-3) and the
  applicable-routes content (GE-111d-3). Since expects_from is single-valued, the
  routes-content dependency is captured in it_requirements (per the IT-PO
  expects_from-is-single-valued convention). Renderer-only; no recomputation.
