notes: |
  Fixes the fidelity gap between BO-2400a-3's wording ("every newly added test for the
  batch fails") and the gate's actual behaviour, which treated "carries a matching
  covers tag" as a proxy for "newly added" and therefore swept in long-pre-existing
  tests. Observed live on BO-2400g-1, where three pre-existing green tests halted the
  gate.

  Why git and not the test-writer's self-reported file list: BO-2400a-3
  it_requirements[0] already requires the verdict to be "derived from the process exit
  code, not an agent judgment". An agent-supplied list of written test files
  reintroduces exactly the agent judgment that requirement excludes, and it is
  fabricable — an agent that reports a file it did not write, or omits one it did,
  silently moves the gate's decision boundary. Git state is observable, deterministic
  and not authored by the agent under test.
