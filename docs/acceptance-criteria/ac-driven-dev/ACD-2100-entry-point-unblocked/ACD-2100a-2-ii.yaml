it_requirements:
  - "The change must land under templates/scripts/setup_ticket_worktree.py. The deployed copy under .leafcutter/scripts/ is build output and was already patched by hand once on 2026-08-18; that patch was regenerated away."
  - "Reuse _resolve_repository_with_search_fallback() exactly as cmd_create_only() already calls it. Do NOT introduce a second resolver, a wrapper, or a per-subcommand variant -- a third resolution path is the defect this record exists to close, not a fix for it."
  - "The anchor must remain the first choice in both subcommands. Callers whose anchor already resolves -- every in-repo invocation working today -- must be byte-for-byte unaffected."
  - "Callers that supply an explicit repository location must keep bypassing both the anchor and the search, unchanged."
  - "The ambiguous case (two or more candidates) must refuse in these two subcommands exactly as ACD-2100a-2-i already requires of create-only; the shared helper is what makes that free, and re-implementing resolution locally is what would lose it."
  - "Must satisfy the repository error-handling policy: the git invocation is external I/O and must be wrapped in a typed except that logs at WARNING or re-raises; it must not be swallowed."
  - "No new helper, no new configuration key and no new CLI flag is warranted -- the fix is the substitution of the existing call at the two remaining sites."
test_spec:
