readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a ticket that motivates its work purely by design intent (for example a pure
    refactor or a new capability) and states no factual claim about a current failure,
  When the premise-capture check runs before the ticket may leave the inbox,
  Then the check finds no factual claim requiring capture,
  And it does not flag the ticket,
  And the ticket is cleared to leave the inbox on the capture axis.
