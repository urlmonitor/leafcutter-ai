notes: |
  WHY THIS IS A SEPARATE RECORD AND WHY IT IS THE ONE MOST LIKELY TO BE QUIETLY DROPPED. Its
  parent is fully satisfiable by a gate that polices new registrations and leaves the existing
  family alone, and that reading is attractive precisely because it makes the first run quiet.
  It also makes the regime worthless: the checks that cannot refuse are the ones already
  registered. A rule that applies only to what comes next certifies everything that is
  already broken.

  DAY-ONE BLAST RADIUS IS THE CORRECT OUTCOME, AND THIS RECORD IS WHERE THAT IS MADE
  MECHANICAL RATHER THAN ADVISORY. On the commit that lands this family most checks will
  report that no refusal has ever been demonstrated, because none has. That is the true state.
  It must not be pre-suppressed by seeding exemption records, by a dated cut-off, or by a
  single record covering everything registered so far. The natural remedy for the resulting
  noise is to weaken the rule until it goes quiet, and that remedy is the failure mode this
  whole tree is designed against. Repairing, declaring, or honestly exempting each check is
  the work, not a follow-up.

  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSE. "The first report is not made quiet by any
  such record, and the checks that report as never demonstrated are reported by name."
  ARRIVAL COLOUR: GREEN, vacuously — no report exists, so none is currently being quietened.
  INJECTION: accept an exemption record naming a group of checks by when they were registered.
  Under that injection the entire pre-existing family disappears from the failing classes and
  the run passes on the commit that lands it; this clause must go RED naming the checks the
  group record covered, and must return to green on revert. This is the single injection that
  would make the whole tree ship green and useless, so run it rather than describing it.

  SECOND NAMED MUTATION, FOR THE TEMPORAL-GROUND CLAUSE. INJECTION: accept any ground that is
  a non-empty statement — which is what the vocabulary's own minimum-length rule permits today
  and is the same weakness the postponement rule already has to defeat one form over. Under
  that injection a ground reading that the check predates the requirement is honoured and the
  check leaves every failing class; this clause must go RED. Hold the vocabulary of refused
  grounds as data a fixture can extend, not as a fixed set the test also carries, or the test
  and the implementation will agree with each other and with nothing else.

  ARRIVAL COLOURS FOR THE REMAINING CLAUSES. The first Then — pre-existing checks are subject
  identically — is RED on arrival, because no check is subject to anything today. Both
  refusal clauses are RED on arrival for the same reason. The two clauses above are the only
  greens and both are vacuous.

  NO COUNT OF INSTANCES IS STATED OR IMPLIED, per the parent's disputed-count rule. How many
  checks the first run names is exactly what the run measures.
