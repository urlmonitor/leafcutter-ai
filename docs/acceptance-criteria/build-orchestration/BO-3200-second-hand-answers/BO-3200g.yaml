notes: |
  BOUNDARY WITH BO-3200e, and it is a fine one that was argued before the record was
  written. BO-3200e is about what a CHECK reports when its own inspection could not be
  performed -- its three answers are "in order", "has a problem", "could not tell".
  This L1 sits one layer beneath: the check cannot choose the third answer if the
  layer feeding it has already converted a refusal into a read failure. BO-3200e-1's
  second Given enumerates exactly two ways an inspection can fail -- "the subject
  cannot be read, or what it read cannot be interpreted." A refusal is neither. The
  user considered folding this in as a fifth L2 under BO-3200e and chose a full L1
  on 2026-09-16, on the grounds that "you are not sent to repair a healthy file" is a
  distinct benefit from "a check that could not look says so".

  BOUNDARY WITH BO-3200c-2 AND ACD-2100c. Those cover a refusal misread as the USER'S
  CONSENT (KI-ACD-005). This covers a refusal misread as an I/O FAILURE (KI-ACD-009,
  KI-BO-018). Both must exist; neither is a special case of the other, and the
  remedies differ -- one is about provenance of an answer, this is about the class of
  an outcome.

  BOUNDARY WITH ACD-2100b. That L1 enumerates four startup-check outcomes: registry
  unreadable, uninterpretable, agent absent, agent denied. A refusal is a FIFTH and is
  not among them. ACD-2100b-3-i already demonstrates the enumeration is not closed,
  and ACD-2100b-4's it_requirements warn against implementing the guard as a
  four-branch table. ACD-2100b has been amended to name the fifth outcome rather than
  having it annexed here: this L1 is the general rule, that tree is the one startup
  path that must obey it.

  WHY high AND NOT critical. This is the misdiagnosis rather than the blockage. With
  BO-3200f built the run no longer halts here at all; with only this built the run
  still halts, but it says something true about why. It cost this session two full
  runs of operator time and pointed at a 131 KB file that was present and readable at
  both candidate locations, which is why it is not medium.

  WHY NOT A FIFTH KNOWN ISSUE. Four open entries already describe this family --
  KI-ACD-009, KI-ACD-005, KI-BO-018, KI-BO-20260901-1620. The user directed that they
  be updated and cross-referenced rather than joined by another.
