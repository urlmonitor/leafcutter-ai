id: DK-500c-1-i
title: The mining job and models can never approve a category
component: decision-kernel
components:
- decision_kernel
level: L3
status: active
readiness: reviewed
req_status: draft
priority: medium
work_status: todo
roadmap_phase: phase_kernel_2_knowledge
criteria: |
  Given the candidate cat-73d233fc8b15c735 in a kernel run,
  When an approval of it is attempted by criteria_mining, by jev or by claude_code instead of by a person,
  Then the approval is refused, naming the approver that was refused,
  And the candidate stays proposed and nothing is staged for it,
  And the same candidate accepted by human:user in the same run is staged.
depends_on:
- DK-500c-1
covered_by: []
implemented_by: []
assigned_agent: python-coder
estimated_complexity: S
delivers_to: null
expects_from:
  ac_id: DK-500c-1
  contract: Approval path for candidates in the criteria.review run.
change_target: code
risk_surface: auth
it_requirements:
- Approval authority is checked deterministically at the moment of approval and again at staging. Only a human-answer submission whose approver matches ^human(:<name>)?$ may approve. An approval that arrives through the host-result channel, from a Jev output, from the mining job or with any other approver string is refused, naming the refused approver.
- A refused approval leaves the candidate proposed in the mining store and stages nothing, and it is logged at WARNING.
- No configuration switch relaxes this rule.
test_required: true
test_spec:
- name: test_mining_jev_and_host_approvals_refused_naming_approver
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Approvals by criteria_mining, jev and claude_code are each refused, naming the refused approver.
- name: test_refused_candidate_stays_proposed_and_unstaged
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: criterion
  description: After the refusals the candidate is still proposed and nothing is staged for it.
- name: test_human_approval_in_same_run_stages
  target_dir: tests/kernel/criteria/
  framework: pytest
  type: behavioral
  angle: boundary
  description: The same candidate accepted by human:user in the same run is staged.
test_rationale: Exercise the review run and the publish command through their public CLI and RunService boundaries on a temporary repository copy and run root; assert staged files, published files, exit codes and byte-level before/after snapshots of docs/decisions/. Model-level unit tests alone would not prove that nothing is written outside the staged area or that publish is all-or-nothing.
