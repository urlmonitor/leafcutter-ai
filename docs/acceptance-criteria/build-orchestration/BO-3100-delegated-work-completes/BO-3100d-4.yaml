  - path: templates/skills/knowledge-query/SKILL.md
    relationship: modifies
    status: exists
    relevance: "Already queries across knowledge surfaces; extending it is preferred to authoring a second skill that overlaps it."
  - path: templates/skills/ac-audit/SKILL.md
    relationship: describes
    status: exists
