id: BO-2400f-10
components:
  - build_orchestration
title: "On failure or abort, release the claim: in_progress -> todo so work is never stuck"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a fast-lane run flipped its resolved acceptance criteria to work_status
    in_progress at start,
  And the run then halts or fails before the coverage gate passes (a gate blocks, an
    agent returns non-ok, or the run is aborted),
  When the run ends without success,
  Then every acceptance criterion it had flipped to in_progress that was not
    transitioned to done is released back to work_status todo,
  And the release is landed on mainline the same way the claim was (a status-only
    change touching only work_status), so no acceptance criterion is left permanently
    stuck in in_progress and blocking future runs.
depends_on: [BO-2400f, BO-2400f-7]
doc_links:
  - path: docs/how-to/fast-lane-build.md
    relationship: describes
    status: exists
  - path: docs/architecture/components/build-orchestration.md
    relationship: describes
