it_requirements:
  - "The strategy layer MUST explicitly detect reflink UNsupport (cp --reflink=auto silently degrades to a full byte copy on non-CoW filesystems) and MUST fall through to git clone --reference --dissociate rather than accept an accidental full byte copy, so the intended ordering is honored."
  - "The fallback result MUST have the same fully-independent, dissociated object store as the reflink path."
