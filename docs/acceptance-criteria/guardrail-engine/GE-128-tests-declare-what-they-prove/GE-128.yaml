notes: |
  ORIGIN (2026-09-14, product-owner, on BrainCandy's brief). Authored as a separate
  tree from ACS-1600 on the user's explicit instruction that the two are distinct
  subjects. They are: one governs a store-writing tool run by hand, the other a
  commit-time gate. They touch at exactly one point, recorded in GE-128d.

  ==========================================================================
  THE OVERLAP I FOUND THAT THE BRIEF DID NOT NAME — FLAGGED, NOT PAPERED OVER
  ==========================================================================
  ACD-2200 ("turn the standards on in a codebase that was not built under them",
  active, phase_1, four L1s, no children yet) already owns the ratchet AS A
  GENERIC CROSS-STANDARD POLICY. ACD-2200b is "existing shortfalls never block your
  work — new ones are refused at the door"; ACD-2200c is "the tolerated backlog is
  counted and never grows". Those are the user's governing rule stated once for all
  standards.

  So a tree here whose headline was "the ratchet" would be a duplicate at a lower
  altitude. Three responses were considered:
    (a) Hang this subject under ACD-2200. REJECTED: that tree is deliberately
        standard-agnostic; attaching one standard's content to it breaks its
        altitude, and all four of its L1s are about the adoption mechanism rather
        than about anything being adopted.
    (b) Author only the parts ACD-2200 does not reach. REJECTED: it would leave the
        obligation itself — that a test declares what it proves — owned by nobody,
        which is the actual gap.
    (c) TAKEN: the tree's subject is the DECLARATION, not the ratchet. The
        obligation is the goal; the ratchet is how it is adopted, and adoption is
        ACD-2200's. GE-128a therefore states only what the generic rule cannot —
        what the counted quantity is here and that it is held per file — and
        carries ACD-2200b as a depends_on doc_link rather than re-arguing it.

  RELATED FINDING, FILED RATHER THAN FIXED: GE-127b is a per-gate ratchet authored
  2026-09-01, eight days before ACD-2200 generalised the same rule, and it carries
  no fence to it. The two currently sit side by side with no stated relationship.
  That is a store defect and it is not this tree's to repair, but the next person
  to touch either should join them up.

  ==========================================================================
  WHY A NEW ROOT L0 — FOUR CANDIDATES EXAMINED AND REJECTED
  ==========================================================================
  - GE-117 (code declares what it serves) is the nearest subject and is fenced in
    doc_links. Five L1s of seven, and a different consumer for the declaration.
  - GE-126 (checks answer truthfully) has the only two free L1 slots in the
    GE-120/GE-126 family and was rejected on subject: it owns whether a check's
    answer about its own work is honest. This tree owns what the rule the check
    enforces actually IS. Two L1 slots could not hold this subject anyway.
  - GE-120 is at the cap — seven L1s, a..g — and every one of GE-120a..f is at the
    five-L2 cap. Closed both ways.
  - TQ-100 (trustworthy test gate) owns which test failures may block, and TQ-100b
    owns declaration recognition. Adjacent and fenced; wrong subject, and at five
    L1s.

  ==========================================================================
  MEASURED FACTS — SUPPLIED BY THE USER FROM THE REGISTER, CARRIED AT THE
  CONFIDENCE RECORDED THERE. DO NOT PUT ANY FIGURE IN A CRITERIA BLOCK.
  ==========================================================================
  Single measurement pass, one commit, one repository, unverified by a second
  method, and bound by ACS-1100 (inherited) wherever restated:
    - 5,566 test functions across 595 of 597 test files carry no declaration. Only
      2 files are fully declared.
    - The gate is NOT registered in the hook manifest. It has never run.
    - Its mode resolves to advisory because its configuration key is ABSENT, not
      because anyone chose advisory. It is one key away from refusing essentially
      all test work.
    - The register additionally notes that roughly 87 distinct declaration
      identifiers already in the test tree name a record that does not exist. That
      is the pre-existing rate of the defect GE-128c refuses to let grow.
  A criterion pinned to any of these numbers is falsified by the next commit that
  changes it. State the guarantee; leave the numbers here.

  ==========================================================================
  L1 CUT — BY GUARANTEE, NOT BY DEFECT. DO NOT RE-CUT AT L1.
  ==========================================================================
  - GE-128a — THE OBLIGATION AND ITS COUNTED QUANTITY. New work declares; the
    existing population is tolerated; the count is per file and moves one way.
    The keystone.
  - GE-128b — REARRANGEMENT IS NOT NEW DEBT. The refactor case and the new-file
    case, which is the loophole in the same mechanism.
  - GE-128c — A DECLARATION NAMES SOMETHING REAL. The guard on the guard.
  - GE-128d — A RETIRED REQUIREMENT NAMED BY A LIVE TEST IS A SIGNAL.
  - GE-128e — ACTIONABILITY. Being stopped hands you the next step, including when
    no suitable requirement exists yet.

  WHY GE-128c IS NOT OPTIONAL AND MUST NOT BE FOLDED INTO a. Without it, the
  cheapest implementation that satisfies GE-128a across the whole backlog is a
  script that writes a plausible-looking name above every undeclared test. That
  converts an honest gap into a dishonest green, at scale, using the standard meant
  to cure it — and the register's instruction not to attempt a bulk backfill is
  precisely this concern written as an instruction. This tree turns it into a
  property, because an instruction binds whoever read it and a property binds the
  implementation. NO CRITERION HERE MAY SPECIFY A BULK BACKFILL OF THE EXISTING
  POPULATION, and an L2 proposing one must be withdrawn rather than approved.

  WHY GE-128b IS SEPARATE FROM a. A per-file count degrades under movement: moving
  a declared test between files raises one file's count and lowers another's, and a
  file that did not exist before has no previous count to compare against. Treated
  carelessly in either direction the rule either punishes every refactor or lets
  every new file in undeclared. Both failures live in the same mechanism and
  neither is visible from GE-128a's own scenarios, which is what earns b its own
  record rather than a note.

  ==========================================================================
  THE INTERACTION WITH ACS-1600 — THE ONE POINT THE TWO TREES TOUCH
  ==========================================================================
  Six declarations in the test file for the store-writing tool governed by ACS-1600
  point at records being retired in an open pull request. GE-128d is about to fire
  on them. THE USER'S INSTRUCTION IS EXPLICIT AND IS ENCODED AS A PROPERTY RATHER
  THAN A NOTE: that notice is the live code behind a retired requirement making
  itself visible, and it is resolved by deciding the tool's fate — never by
  deleting the declarations so the notice stops. Once ACS-1600 exists, those
  declarations should point at it. That re-pointing is ACS-1600's tree's business
  and is NOT authored here.

  ==========================================================================
  INHERITED AND NOT REPEALED
  ==========================================================================
  This component's deliberate fail-open convention (an internal error yields a
  stderr warning and a zero exit so a script bug never blocks an unrelated commit)
  applies unchanged. So does the line GE-120 drew over it: failing open on one bad
  input while the check still ran is acceptable; reporting success for a check that
  never ran is not. A gate that could not read a file must say so rather than count
  it as compliant — and for a ratchet that matters twice over, because an unreadable
  previous version silently becomes a count of zero and turns the whole file into
  new debt.

  SILENCE IS NOT A PASS — carried from this component's standing notes. Several AC
  hooks read the git index or an environment variable rather than their arguments,
  so pointing one at a file does not make it inspect that file. Establish a positive
  control before believing any clean result while decomposing or testing this tree.

  ==========================================================================
  ROADMAP — phase_1 CLAIMED, AND THE ARGUMENT IS MADE RATHER THAN BORROWED
  ==========================================================================
  phase_1 is claimed on ACD-2200's reasoning, which this tree is an instance of:
  being able to switch a standard on in a codebase that was not built under it is
  part of "installs into any project and helps the user build good software". A
  gate that cannot be switched on without stopping all test work is not portable in
  any useful sense. Every recent L0 in this component claims phase_1 and this one
  is consistent with them. No roadmap or vision file was modified while authoring
  this.

  ==========================================================================
