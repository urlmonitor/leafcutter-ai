notes: |
  test_required: false — the deliverable is a Mermaid sequence diagram in the
  architecture docs. There is no importable surface and no runtime behaviour to
  assert; the only mechanically checkable property would be the presence of
  participant strings in the Markdown, which is exactly the grep-only test the
  project forbids (CLAUDE.md "Gate / Workflow ACs — Verify Behaviorally, Not by
  Grep"): it would pass on a diagram that had drifted from the implementation.
  The behaviour the diagram depicts is covered by the test contracts on
  BO-1500a-1-i and BO-1500a-2. Correctness of the drawing itself is a human
  review concern, enforced by the documentation gates, not a unit test.
