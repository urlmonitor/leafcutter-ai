criteria: |
  Given the technology manifest contains an entry for "elixir" with category "language"
  And no best-practice knowledge file exists for "elixir" in the package knowledge layer
  When the agent generator processes the manifest
  Then it produces an agent template for "elixir-coder" with a generic structure (no language-specific best practices)
  And the template includes a placeholder section noting that best practices are not yet available for this technology
  And a warning is emitted: "No best-practice knowledge found for elixir — generating minimal specialist"
  And the build does not fail or skip the technology
