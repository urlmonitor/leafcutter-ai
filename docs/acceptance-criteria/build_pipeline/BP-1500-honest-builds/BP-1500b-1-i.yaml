id: BP-1500b-1-i
title: "The sweep reaps the installed tree being rebuilt, in every layout, and never a second tree on the same machine"
component: build-pipeline
components:
  - build_pipeline
level: L3
status: active
req_status: draft
readiness: approved
priority: high
roadmap_phase: phase_1
work_status: todo
declares_side_effect: false
criteria: |
  Given two installed trees exist on one machine and both carry the retired
    "fast-lane-build" workflow: one belonging to a project that keeps the
    package inside itself and installs into its own root, and one belonging to
    an ordinary adopter project that keeps the package elsewhere,
  When the first project's install is rebuilt,
  Then the retired workflow is gone from the first project's installed tree,
  And nothing is removed from the second project's tree, nor from the package's
    own source,
  When the second project's install is then rebuilt,
  Then the retired workflow is gone from the second project's installed tree
    too, by the same behaviour and with no layout-specific special case,
  And where the location the sweep is pointed at is reached through a link
    rather than being a directory in its own right, the sweep examines the files
    that location actually contains and reports them in its scope, rather than
    finding nothing there and continuing silently.
