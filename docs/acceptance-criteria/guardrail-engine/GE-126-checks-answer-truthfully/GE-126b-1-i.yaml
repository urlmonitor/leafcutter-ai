id: GE-126b-1-i
title: "The statement arrives without being asked for and nothing can switch it off"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a caller who does not know that an opt-in introspection switch exists and sets
    no environment variable of any kind,
  When they invoke the deployed AC-governance check out of process from a directory tree
    containing no acceptance-criterion store,
  Then the check still states the root it resolved and that it examined no records —
    the statement is unconditional rather than gated behind a switch the caller has to
    know the name of,
  And setting the historical opt-in switch to any value including one that reads as off
    does not suppress the statement,
  And a caller who sets the historical switch and receives the statement cannot be
    receiving it for that reason — the same invocation without the switch produces the
    same statement,
  And silence from this check is therefore never a possible response so a caller who
    receives nothing at all knows the check did not run rather than having to weigh
    three explanations for the silence.

  Coverage note: covered by out-of-process runs with the switch unset with the switch set
  and with the switch set to a falsy value asserting the statement in all three. Silence
  in the unset run is the failure this pins.
