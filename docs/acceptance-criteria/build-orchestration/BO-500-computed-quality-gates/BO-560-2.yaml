criteria: |
  Given a ticket has change_type: flow_change
    and work agent python-coder (produces: production_code),
  When ticket-supervisor computes the agent chain,
  Then the sequence respects these ordering invariants:
    1. status-checker (priority 1) -- if needed
    2. adr-author (priority 2) -- if needed
    3. architecture-diagram-author (priority 3) -- if needed
    4. architect-review (priority 4) -- mandatory for flow_change
    5. test-writer (priority 5) -- mandatory for production_code
    6. python-coder (priority 6) -- the work agent
    7. test-runner (priority 9) -- mandatory for production_code
    8. documentation-expert (priority 10) -- mandatory pre-coder for flow_change,
       but also has post-coder documentation duties
    9. pr-reviewer (priority 11) -- always present
    10. ac-fulfillment-gate (priority 11.7) -- if ac_traceability present
    11. commit (priority 12) -- always present
    12. pull-request (priority 13) -- always present
  And no agent appears more than once in the chain
  And all mandatory agents for the change_type are present
  And all TDD agents for the produces trait are present
  And conditional agents (user-surface-smoker, ac-validator) are included
    only when their conditional_field is set on the ticket

  Given two agents share the same priority number
    (e.g. sql-coder and sql-query both at priority 7),
  When they are both required in the same chain,
  Then they are ordered by their registry array position (stable sort)
  And neither blocks the other (they could theoretically run in parallel)
