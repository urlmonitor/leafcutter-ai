    relevance: >-
      The second effect: with the restyle in HEAD, restoring the `//` lines was charged as
      growth and as added lines, raising the bar by 37 lines on build-feature.js and 30 on
      plan-feature.js for honest work. The second criterion forbids that.
  - path: templates/scripts/commit_guardian/_file_size_ratchet.py
    relationship: modifies
    status: exists
    relevance: >-
      IT PO, read 2026-10-16. count_added_measured_lines strips both sides with
      _strip_unmeasured_regions and diffs the remaining WHOLE lines with
      difflib.SequenceMatcher(autojunk=False), summing insert/replace targets;
      resolve_added_measured_lines takes the minimum across merge parents and returns 0 for a
      staged deletion. Both keep their shape; only what is diffed changes.
