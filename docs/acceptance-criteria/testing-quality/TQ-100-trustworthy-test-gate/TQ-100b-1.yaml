assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "The session-scoped component must read the AC store ONCE per pytest session and cache the work_status lookup (not re-read per test) — mirror the BP-1200a-1 classify-once-per-session shape; the lookup keys off the `# covers: <AC-ID>` tag already mandated by templates/agents/test-writer.md."
  - "Reuse the existing AC-store reader rather than re-implementing YAML walking: scripts/ac_store/scan_ac_store.py already exposes `_load_ac` / work_status access and a worktree-root finder — extract or import a shared loader, do not copy-paste store-walking logic."
  - "Linkage classification (enforced vs informational) must be deterministic under pytest-randomly: identical store + suite must yield an identical partition across seeds/orderings."
  - "Must handle AC-store read failures per the project error handling policy (CLAUDE.md Rules 1-4): an unreadable/parse-failing AC file is logged at WARNING and treated fail-safe (the affected test is enforced, never silently made informational)."
  - "If the linkage component is deployable conftest/plugin code, the templates/ package source and the deployed copy must be edited together and kept in parity via the build.py round-trip (ADR-001)."
delivers_to:
  agent: test-runner
  contract: "A session-scoped conftest/pytest-plugin that, for each test tagged '# covers: <AC-ID>', looks up the AC's work_status and treats a not-done AC's test as informational (xfail/skip-style, non-blocking)."
expects_from:
  ac_id: TQ-100a-1
  contract: "A suite that runs to completion despite individual broken files, so the per-test linkage decision is applied across the whole loadable suite."
