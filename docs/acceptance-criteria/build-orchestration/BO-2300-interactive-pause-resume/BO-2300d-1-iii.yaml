notes: "Authored by /quick-fix. Root cause: Two defects. (1) applyAnswerByType() returns {action:'approve', priority} for every priority_choice answer and ignores answer.action, so edit/defer/cancel sent with a priority are silently turned into approve. (2) A resume answer is never marked consumed within a run: resolveGate() checks args.resume_answer on every call whose gate_id matches, and on an 'edit' it deliberately keeps the durable pause record (only non-edit answers clear it), while the final-gate loop passes the same args object back into resolveGate on the next iteration. So one person-authored answer is applied once per loop iteration instead of once per run. Fix: honour a valid answer.action for priority_choice (approve still requires a priority), and make a resume answer apply at most once per run, so after an edit re-authors, the gate pauses for a NEW decision (persisting a fresh pause record) instead of replaying the old one.."
