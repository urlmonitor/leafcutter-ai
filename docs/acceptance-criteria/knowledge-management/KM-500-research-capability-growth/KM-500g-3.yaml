status: active
req_status: active
work_status: in_progress
readiness: approved
priority: medium
parent: KM-500g
criteria: 'Given an agent has a repository question and can discover the supported research entry points

  When it follows the shared research-answer how-to

  Then the walkthrough starts from an explicit question and scope and shows how to inspect required fields, source
  revision, completeness and question fulfillment in the actual returned evidence

  And examples distinguish a root-excluded AC count, an incomplete status answer, a declared-test answer without
  execution proof, a missing query and an unsupported source mapping

  And an observation example shows how to follow a verified trace reference or recognize that no remote trace was
  established

  And it explains when to clarify, request further evidence, propose a governed query build or stop with an unresolved
  answer

  And canonical source inspection used to design an expected answer is identified separately from an actual tool
  demonstration

  And disabled services, missing authorization and unavailable real-provider or deployment proof remain visible
  rather than being presented as passing examples

  And the walkthrough uses the shared reference definitions and states each example''s actual verification status.

  '
