it_requirements: |
  Move documentation-expert from the pre-coder flow_change_gates mandatory_agents lists
  (remove it from all four) to the per-surface canonical-order path so it is ordered after
  the coder. architect-review stays in the flow_change_gates lists (pre-coder). Audit for
  double-injection: documentation-expert must appear exactly once.
