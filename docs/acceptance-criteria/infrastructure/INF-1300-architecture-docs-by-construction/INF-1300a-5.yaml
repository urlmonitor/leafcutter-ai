criteria: |
  Given the means of starting a new architecture document, and the authoring
    how-to that tells an author how to start one,
  When every command the how-to publishes is executed exactly as published,
  Then each of them runs and does what the surrounding text says it does: a
    command the means rejects, or one that silently requires something the how-to
    does not tell the author to supply, is a failure of this record,
  And for every reason the means can refuse a request, the how-to holds an entry
    that names that reason and says what to supply instead, with the set of
    reasons taken from the means itself at the moment of the reading rather than
    from a list written into the observation — a reason the means produces with
    no entry, and an entry for a reason the means cannot produce, are both
    failures,
  And for each such entry, starting from the refused request, supplying exactly
    what the entry says to supply, and repeating the request yields a document
    that passes the project's full set of commit-time document checks unmodified,
  And the how-to tells the author which parts of the produced document are theirs
    to write and which are not theirs to rewrite by naming where that split is
    defined, rather than by defining it a second time here,
  And nothing the how-to says about the invocation, about the fields a document
    must carry, or about how to verify one, is a second copy of what an authoring
    surface already publishes: each is referenced, so a correction made on that
    surface cannot leave a stale duplicate standing here.
