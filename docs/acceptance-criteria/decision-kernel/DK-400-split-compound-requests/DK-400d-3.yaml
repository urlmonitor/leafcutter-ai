  - path: docs/analysis/2026-09-30-decision-kernel-design-3-kernel-scheduler.md
    relationship: describes
    status: exists
    relevance: Route node and batched Jev routing, intent step, guards and budgets, root completion, gap recording,
      resume and restart.
assigned_agent: python-coder
estimated_complexity: M
delivers_to:
  agent: python-coder
  contract: 'Rejected split: gate_answer ''rejected'' with gate_by, gate_at and gate_note verbatim; every part review
    ''rejected'' and outcome ''not_run''; no part work item. Ending keyed deterministically on trigger and found_at:
    jev_none | ambiguous -> state ''rejected'', run status ''blocked'', capability_gap_recorded true and today''s
    gap observation stored; bundled_accepted or found_at mid_run -> state ''rejected_kept_whole'', the subject resumes
    from kept_routing as one decision or research step, whole_decision_id set once that decision''s record is staged
    (null for a research step). Consumed by DK-400f-3 (report line) and DK-400d-3-i, -ii, -iii.'
expects_from:
  ac_id: DK-400d-1
  contract: "The gate answer path, here with the answer rejected."
it_requirements:
  - 'A rejection is recorded atomically with the answer: gate_answer rejected, gate_by, gate_at, the note word for
    word, every part review rejected and outcome not_run, and no part work item ever created.'
  - 'The ending is chosen deterministically from the split record (trigger, found_at), never by a model: jev_none
    or ambiguous -> state rejected and run blocked (DK-400d-3-i); bundled_accepted or mid_run -> state rejected_kept_whole
    and the subject resumes as one (DK-400d-3-ii, DK-400d-3-iii).'
  - A rejection is never inferred from another answer (DK-400d-2-i).
change_target: code
risk_surface: contract_boundary
test_required: true
test_spec:
  - name: test_rejection_runs_no_part_and_keeps_answer
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: criterion
    description: Rejecting at a pinned 2026-10-05T09:14:26Z records gate_answer rejected by human:user at that time
      with the note word for word, every part rejected and not run, and no part work item.
  - name: test_rejection_ending_keyed_on_trigger
    target_dir: tests/kernel/split/
    framework: pytest
    type: integration
    angle: boundary
    description: Parametrised over jev_none, ambiguous, bundled_accepted and mid_run, the rejection ends in state
      rejected (blocked) for the first two and rejected_kept_whole for the last two.
test_rationale: One rule fans out to three endings; the parametrised test pins the mapping, the criterion test pins
  what is recorded.
origin_agent: business-analyst
created: 2026-10-05
amended_by:
