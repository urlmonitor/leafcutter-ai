title: "Agent template declares its knowledge and skills"
component: infrastructure
level: L1
status: active
criteria: |
  Every agent template carries structured metadata describing what it knows
  at invocation time — which skills it invokes, which knowledge channels
  feed it, and which files it reads before starting work.

  These fields make the Knowledge Flow section of the agent card fully
  auto-generable. Without them, knowledge sources can only be inferred
  by reading the template prose body.
