id: KM-400a-1-xiv
title: Capability properties expose registry declarations independently of runtime eligibility
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: reviewed
work_status: done
priority: medium
parent: KM-400a-1
criteria: |
  Given a capability registry includes an enabled native entry and a disabled host-handoff entry with availability, admission and cost declarations
  When their native fields are exposed in the repository graph
  Then both entries retain their authored id, name, description, version, request_kinds, accepts_schemas, produces_schemas, execution_mode, binding, side_effect_class and admission
  And authored operations, scope_tags, components, permissions_required, enabled, availability, routing, process_maturity and cost_hints remain queryable
  And nested admission kind, decision reference, admission date, author and any legacy source remain associated with their entry, along with each availability and cost value
  And absent optional values remain absent while false, zero, null, empty arrays and future nested fields remain distinguishable
  And root registry identity, version and commentary remain separate supporting context, with each entry retaining its original source position
  And disabled, unavailable, experimental, fixed and legacy-admitted entries are not omitted because of runtime eligibility
  And bindings, schema references, permission declarations and admission references are exposed as data without executing or following them
  And capabilities with names matching Agents or Skills retain distinct identities, and component membership is not guessed from names or bindings
  And an absent registry yields no capability records, while malformed present entries, duplicate identities and invalid registry envelopes fail explicitly
depends_on: [KM-400a-1]
