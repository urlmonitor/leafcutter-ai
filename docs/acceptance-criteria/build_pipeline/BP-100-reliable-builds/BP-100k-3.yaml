    entry: "Added test_spec (6 behavioral descriptors, one per Then-clause plus the both-gates and no-ground constraints) and test_rationale; every descriptor executes the gate as a process and asserts on the run summary and exit status rather than on gate source text. Added three it_requirements constraints: (a) REGISTRATION SURFACE CORRECTION — the exemption-registry key belongs in templates/scripts/commit_guardian/commit_guardian.json, NOT the non-existent config/commit_guardian.json; (b) SERIALIZATION with BP-1100b-5, which edits the same guardian config; (c) the registry must be data-driven, never a hard-coded filename in the gate. Added two edit-surface doc_links (check_output_drift.py, commit_guardian.json) so files_touched covers the real surface. criteria, assigned_agent (python-coder), estimated_complexity (M), reference_file_path, delivers_to, expects_from, readiness and work_status left unchanged."
    by: it-po
