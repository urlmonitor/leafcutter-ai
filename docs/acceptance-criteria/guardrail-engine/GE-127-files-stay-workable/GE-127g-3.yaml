notes: |
  WHY THIS RECORD EXISTS AT ALL, GIVEN THAT NOTHING IN THE REPORT ASKED FOR IT. The
  request was to stop generated documents being refused. Every record that delivers only
  that is satisfied by an exclusion wide enough to swallow the whole of docs/, and an
  over-wide exclusion is strictly worse than the problem it solves: the refusals stop, the
  commits flow, and 901 documents grow unchecked while a gate reports success. This is the
  record that makes the fix narrower than the problem rather than wider, and it is the one
  most likely to be dropped as unasked-for.

  THE FIRST TWO ARMS ARE NOT HYPOTHETICAL — THEY ARE THE PRESENT MECHANISM'S OWN FAILURE
  MODE, MEASURED 2026-10-09. The exclusion test compares bare filenames, and the declared
  list holds README.md. There are twelve files named README.md under docs/, every one
  hand-authored, and every one of them is exempt from the length standard today on the
  strength of one entry intended for one file. So the shape the first two arms forbid is
  not a risk introduced by this change; it is what is already happening, and fixing the
  narrowness without fixing the breadth would carry it forward into the new mechanism.

  WHY THE FOURTH ARM IS STATED AS A POPULATION DIFFERENCE. The first three arms name
  specific documents, and a sufficiently lucky implementation satisfies all three while
  still exempting some fourth thing nobody tested. The fourth arm is the only clause that
  closes the set: the judged population across the whole of docs/ falls by exactly the size
  of the declared locations and by no more. It is also the clause that stays true as the
  repository grows, which the named-document arms do not. Construction reused from
  BP-1600a-2's varying-population form rather than reinvented.

  SCOPE NOTE, SO THE THIRD ARM IS NOT READ AS A CENSUS. The third arm stages one document
  per hand-authored directory; it does not require every document under docs/ to be
  enumerated in a test, and it is not a reachability census — that is BP-1600a-2's and is
  inherited as a precondition by the whole tree.

  NAMED MUTATIONS — EXECUTE THEM, DO NOT MERELY DESCRIBE THEM.

  (1) THE SUFFIX RULE. MUTATION: declare membership by the filename suffix the generated
      documents carry instead of by their location.
      MUST GO RED: the first arm only.
      MUST STAY GREEN: the second, third and fourth arms, and every arm of GE-127g-1 and
      GE-127g-1-i. This is the mutation that settles the parent's first design question
      mechanically rather than by argument: the suffix rule is not wrong in the abstract,
      it is wrong because this arm goes red under it.

  (2) THE BARE-FILENAME MATCH. MUTATION: keep the present mechanism and match a declared
      entry against any document sharing its filename at any depth.
      MUST GO RED: the second and fourth arms.
      MUST STAY GREEN: the first and third arms, and GE-127g-1's first arm. Note this is
      not a hypothetical mutation — it is the code as it stands.

  (3) THE WIDE EXEMPTION. MUTATION: declare the whole of docs/ set aside.
      MUST GO RED: all four arms here, and GE-127g-1's third arm, and GE-127g-1-i's third
      arm.
      MUST STAY GREEN: GE-127g-1's first and second arms and GE-127g-1-i's first and second
      arms — every clause that only asks for generated documents to stop being refused.
      That green half is the measure of how much of this subtree a wide exemption would
      satisfy, and the reason this record is not optional.

  (4) THE SECOND LIST. MUTATION: satisfy the arms above by adding a deny-list of
      hand-authored paths alongside the declared set-aside locations.
      MUST GO RED: the fourth arm, whose population difference must follow from the
      declared locations alone.
      MUST STAY GREEN: the first three arms, each of which a deny-list entry can be written
      for. Recorded because it is the shape of a fix that makes the tests pass and leaves
      the boundary undefined, so the next hand-authored document in a resembling location is
      exempt again.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect.
