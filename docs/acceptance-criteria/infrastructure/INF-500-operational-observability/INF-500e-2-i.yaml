notes: |
  Authored as an L3 because this failure is silent by construction and would not
  be found by reading the output. The merge-history query returns the most
  recently merged pull requests repository-wide; an under-provisioned budget does
  not error, it stops short, and the oldest weeks then show a low count that is
  indistinguishable from a genuine lull.

  Observed on this repository: a two-week run budgeted 120 results and reported
  51 pull requests for the week of 2026-08-17, while an eight-week run budgeted
  480 and reported 59 for that same week. Both runs looked entirely healthy. The
  only way to tell them apart is to ask whether the page reached back far enough,
  which is what this record specifies.

  The last two scenarios exist to stop the obvious over-correction. Declaring
  truncation whenever the budget is reached would mark every week unknown on a
  busy repository, and treating an empty page as truncated would deny a quiet
  repository the honest zero that INF-500e-2 guarantees it.
