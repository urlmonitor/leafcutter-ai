notes: |
  The blocking-enforcement half (user-confirmed: always block on a real
  violation; never downgrade to warn). This AC owns ONLY the block decision —
  the message text is ACS-900c, the clean-pass cases are ACS-900d, and the
  fail-open-on-internal-error behavior is ACS-900b-1-i.

  IT-PO enrichment (2026-06-22): pinned the load-bearing block-vs-fail-open
  distinction (PO note) into it_requirements, and explicitly forbade a config
  'warn' tier for the real-violation case so the user-confirmed posture is not
  silently relaxed. delivers_to refined to a concrete record shape carrying the
  status + superseded_by the message formatter (ACS-900c-1 / ACS-900c-1-i) needs.
change_target: code
risk_surface: contract_boundary
