notes: >-
  THE ONE-SENTENCE REASON THIS AC EXISTS. Every existing defence in this repository asks
  whether a check's verdict is CORRECT. None asks whether the check ever refused anything.
  A check that has never refused anything and a check that refuses correctly are today
  indistinguishable in every report the system produces, and eight separate instances of
  that indistinguishability were found in roughly 36 hours.


  THE FOUNDATION ALREADY EXISTS AND HAS NO READER — RE-DERIVED, 2026-09-01.
  config/verification_flow.schema.json states the principle in its own words and models
  the exact vocabulary. A repository-wide search for files mentioning it returns seven:
  the schema itself, one instance document (docs/testing/test-angles.verification.flow.json),
  two AC records (TQ-500a-1, BP-1100g-5-i), two changelogs, and docs/testing/test-angles.md.
  There is no code reader. The vocabulary was invented, the schema was written, one
  document was produced, and the validator was never built — which is itself another
  instance of the pattern. Build the reader; do not mint a second vocabulary beside it.


  WORKED EXAMPLE, RE-DERIVED IN THIS WORKTREE WITH THE GUARD'S OWN CODE, 2026-09-01.
  templates/hooks/readme_read_guard.py is registered as a PreToolUse hook in settings.json
  and runs on every Edit and Write. Loading its own `_is_gated` and reproducing main()'s
  resolve() step gives:

    .claude/hooks/x.py         gated=False   resolved -> <root>/.leafcutter/hooks/x.py
    .claude/agents/x.md        gated=False   resolved -> <root>/.leafcutter/agents/x.md
    .claude/skills/x/SKILL.md  gated=False   resolved -> <root>/.leafcutter/skills/x/SKILL.md
    alembic/versions/x.py      gated=True

  Three of the four gated prefixes are inert because those .claude entries are symlinks
  into .leafcutter and the resolved path no longer starts with the prefix. The fourth is
  live and matches nothing: this repository has no alembic directory at all (`ls -d`
  exits 2). So the guard is registered, enumerated, reachable and running, and cannot
  refuse anything — while GATED_PREFIXES reads correctly and greppably. It is the exact
  shape this AC makes visible, and it is invisible to every enumeration and reachability
  guard already in the store.

  ONE CORRECTION TO THE RECEIVED ACCOUNT, WHICH MATTERS FOR THE FIX. The inertness is
  usually attributed to relative_to() raising ValueError and the except branch returning
  False. That is true in the main workspace, where .leafcutter sits in the untracked
  parent. In a worktree .leafcutter is inside the root, relative_to() succeeds, and the
  prefix simply fails to match. Same inertness, different branch. A fix that only handles
  the ValueError leaves every worktree inert — and worktrees are where the drives run.


  ANTI-GREP, AND IT IS THE WHOLE SUBJECT. A criterion satisfiable by asserting that a
  declaration exists, that a list contains an entry, or that a function is defined
  reproduces this bleed one level up. The declaration must be READ BACK by feeding its
  stated known-bad input through the check's real entry point and requiring the stated
  rejection to be observed. A well-formed declaration nobody exercises is instance 5 of
  this bleed; a correct-looking constant that never matches is instance 8.


  THE MOVING-COUNT CLAUSE IS NOT DECORATION. A stated total satisfies a
  state-your-count requirement while proving nothing, because a hardcoded number is a
  legal answer. Requiring the figures to MOVE under a varied population is the only form
  of the requirement that a literal cannot satisfy. This is the same discriminator
  BP-100n-4 uses, deliberately, so the two read the same way.


  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSE. "A check whose record says the attempt
  has not been made is not reported as though its refusal had been demonstrated" is green
  on arrival, because today nothing is reported at all. INJECTION: treat a missing or
  unrun record as the rejection having been observed — the default that a hasty
  implementation reaches for so the first run is quiet. Under that injection every check
  that has never been exercised reports as demonstrated, the never-made figure falls to
  zero, and this clause must go RED; revert must restore it. The mutation must be applied
  to the copy the test loads (GE-126c-5), or it will not land.


  DAY-ONE BLAST RADIUS IS THE CORRECT OUTCOME, AND THE HONEST FIGURE IS UNKNOWN. On the
  commit that lands this, most checks will report that the attempt has not been made,
  because it has not. That is the true state and must not be pre-suppressed by seeding
  records. GE-126's own evidence block forbids stating how widespread the defect is until
  GE-126e has measured it; this AC states no such figure and none may be inferred from it.


  FALSE-GREEN CATALOGUE. "A guard whose refusal path has never been exercised" is not in
  docs/reference/false-green-mechanisms.md. M5 is a validator that validates nothing on a
  bad argument shape; M8 is a proxy reported as a verdict. Neither covers a guard that
  runs correctly on every input it is ever given and has no reachable refusal. Recommend
  a new entry.
