test_rationale: "This AC's whole artifact is prose added to docs/reference/ac-schema.md; it adds no executable surface, so there is nothing a test could drive. Its correctness gates are the repository doc hooks (check-doc-frontmatter, check-doc-length, check-doc-index), which run at commit time rather than as unit tests, and its acceptance is comprehension -- a reader answering the diagnostic question the fourth criterion poses -- which no automated assertion can stand in for. Asserting that a heading exists would be exactly the presence-only check the fourth criterion was written to rule out. The behaviours the doc describes are covered by the executing tests on ACD-2000a-1, ACD-2000a-2 and ACD-2000a-3. Recording the intent explicitly rather than leaving the contract absent, so test-writer skips with an accurate reason instead of the silent auto-skip documented in CLAUDE.md."
