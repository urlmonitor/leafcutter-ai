criteria: |
  Given a developer has added a new template category "widgets" to the output
    mappings and the managed artifact dirs but has NOT added it to the shim map
    or source manifests
  When the parity test suite executes
  Then the test fails
  And the assertion error message names the category that is missing ("widgets")
  And the assertion error message names the specific layer(s) where the category
    is absent (e.g., "shim map" and "source manifests")
  And the message is sufficient for the developer to identify which registration
    steps were skipped without reading the test source
