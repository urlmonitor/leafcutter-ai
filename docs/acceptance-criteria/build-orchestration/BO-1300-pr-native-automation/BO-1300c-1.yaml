title: "A failing required check produces an operator-visible blocker naming the failing check"
component: build-orchestration
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/build-orchestration/BO-1300-pr-native-automation/BO-1300c.yaml"
criteria: |
  Given an open pull request whose required check "Lint (ruff)" has reported failure
  When the automation determines that it cannot merge
  Then it surfaces a blocker to the operator
  And the blocker names the failing check "Lint (ruff)" as the reason the merge is held
  And the blocker identifies the pull request that is blocked
  And the automation leaves the pull request unmerged rather than proceeding
depends_on: [BO-1300c, BO-1300b-2-i]
