change_target: code
risk_surface: contract_boundary
notes: RQ3; PO-01, PO-02, PO-03. Source and policy availability are prerequisites, not a promise to introduce autonomous
  ranking, roadmap projection or new readiness semantics. Reuse KM-500d-2 for published/deployed readiness. Draft
  behavioral specification under the user-requested BA pass; technical enrichment and proof remain pending.
it_requirements:
- Retain immutable repository/source SHA provenance, bounded registered read-only queries and existing kernel authorization,
  budgets and retries. This contract adds no arbitrary Cypher, new network endpoint, source-write permission or
  automatic query activation.
- The named fields below describe the planned observable semantic contract; preserve compatible existing envelope
  fields and version any incompatible extension. Required unavailable values stay explicit and are never inferred
  from an evaluation oracle.
- This is a conditional evidence-assessment contract for supplied candidate facts and explicit policy, not authorization
  to create a roadmap projection or ranking platform. Unsupported policy/candidate sources remain an identified
  gap.
- Each recommendation references the applicable policy identity/clauses and supporting evidence IDs, separates canonical
  status from inferred readiness, and exposes unfulfilled or unknown prerequisites.
- Missing policy or a material interpretation choice routes to existing focused clarification or unresolved outcome.
  A done AC with no deployment evidence cannot establish operational availability.
- Recommendation generation is read-only with respect to canonical priorities, requirement lifecycle, work status
  and roadmap. Human product authority is unchanged.
test_required: true
test_rationale: Planned criterion and public reachability proof includes real producer/consumer boundaries and named
  plausible wrong outcomes. No descriptor is executed coverage; no provider, database or deployment result is asserted.
test_spec:
- name: test_public_readiness_assessment_uses_supplied_policy_and_evidence
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: reachability
  description: Through public research provide attributable candidate facts and an explicit readiness policy; assert
    a bounded recommendation citing its policy clauses, evidence and unresolved prerequisites separately from canonical
    statuses.
  must_catch:
  - Producing a ranked recommendation with an invented policy or silently rewriting priorities.
  covers:
  - KM-500f-3
  requires_db: false
  surface_invoked: Existing kernel research run/resume entry point using retrieve.repository
- name: test_missing_readiness_policy_requests_material_input
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: criterion
  description: Omit the policy or a material condition and assert focused clarification or unresolved output rather
    than a claimed ready ordering.
  must_catch:
  - Defaulting missing product policy to a fabricated readiness score.
  covers:
  - KM-500f-3
  requires_db: false
- name: test_readiness_consumer_keeps_done_separate_from_deployed
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: seam
  description: Feed the real proof assessment result for a done AC with no deployment receipt to the readiness consumer
    and assert deployment stays unverified and cannot satisfy a deployment prerequisite.
  must_catch:
  - Equating completed work with an available deployed capability.
  covers:
  - KM-500f-3
  requires_db: false
- name: test_readiness_recommendation_preserves_canonical_state
  target_dir: tests/knowledge/
  framework: pytest
  type: integration
  angle: discrimination
  description: Snapshot canonical requirement and policy inputs before a recommendation and assert they are unchanged
    afterward, including when evidence conflicts or sources are unsupported.
  must_catch:
  - Mutating canonical work status, priorities or roadmap while computing a recommendation.
  covers:
  - KM-500f-3
  requires_db: false
