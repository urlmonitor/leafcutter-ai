id: TQ-400f-1
components:
  - testing_quality
  - ac_store
title: "Every finished parent in the store is judged against all of its descendants, not just the ones in a pending change"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a store on disk holding two finished parent records: the first whose only
    direct child is itself finished but whose grandchild beneath that child is
    still unfinished, and the second whose direct child is unfinished; and given
    neither parent appears in any pending change — the pending change contains
    only unrelated files, and one of the two parents is present in it solely as a
    renamed path,
  When the whole-store honesty sweep runs over that store,
  Then each of the two parents receives a verdict of its own, distinct from the
    verdicts given to its children,
  And each of those verdicts is "has unfinished work beneath it", stated as its
    own outcome and never folded into the verdict about the parent's own test
    evidence,
  And each verdict names every descendant found unfinished at any depth,
    identified by name, including the unfinished grandchild that no direct-child
    check would have reached,
  And a parent every one of whose descendants is finished receives a verdict in
    the same run that is not "has unfinished work beneath it",
  And running the change-scoped check over that same store produces no verdict
    for either parent at all, so the population being judged is demonstrably the
    store on disk and not the set of files staged for a commit.
depends_on:
  - TQ-400f
  - TQ-400a-1
  - TQ-400a-4
