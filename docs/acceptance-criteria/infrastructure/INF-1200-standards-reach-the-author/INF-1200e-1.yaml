id: INF-1200e-1
title: "An uninformed pairing is named, an informed one is not, and informedness is judged from the brief rather than from the carrier's account of itself"
component: infrastructure
components:
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the project declares a standard for a kind of file, and the ownership
    record assigns that kind of file to a specialist whose material does not state
    that standard,
  When the condition is examined,
  Then that pairing is named — the specialist, the kind of file, and the standard
    it has not been told,
  And given a specialist whose material states the standards for every kind of
    file the ownership record assigns it,
  When the same examination is made,
  Then that specialist is not named at all,
  And given a specialist that owns two kinds of file carrying standards, whose
    material states one of the two,
  When the examination is made,
  Then it is named once, for the kind of file it was not told about, and not for
    the one it was,
  And given a specialist whose material once stated a standard and no longer does,
    while whatever carried that standard reports the same work as before,
  When the examination is made,
  Then that specialist is named — so whether a specialist counts as told is
    decided by reading the material that specialist begins work from, and never by
    any account the carrier gives of what it carried.
depends_on:
