criteria: |
  No requirement counts as met until a real, passing test is tied to it.

  Each added or changed requirement must have a live test linked to it that
  genuinely passes; a requirement with no passing test cannot be treated as
  delivered, so "done" can no longer be claimed for work that is not really there.
