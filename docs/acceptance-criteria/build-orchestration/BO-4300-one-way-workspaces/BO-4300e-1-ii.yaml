it_requirements:
  - >-
    verify's answer is derived from the checks it computes: ok only when every structural readiness
    ingredient of BO-4300c-1 holds on the workspace as it now exists (independent clone, not the main
    checkout, same project, branch matches the marker, not a protected branch, install present, protections
    in place); any false structural check is refused VERIFY_FAILED, carrying failed_ingredients that names
    every false check and no workspace_path. This holds for a workspace switched onto a protected branch
    too: verify answers VERIFY_FAILED (failed_ingredients naming not_protected_branch), never
    ON_PROTECTED_BRANCH, so every not-ready verify answer carries one code (decided at the plan-feature
    gate, 2026-10-24).
  - >-
    tree_clean is reported but never refused on: work in progress is the normal state of a workspace being
    confirmed mid-run. Freshness of the base against today's hub main is likewise not a verify refusal (a
    workspace legitimately falls behind main while work happens in it).
  - >-
    IDENTITY CHECK: when --kind and --slug are given they are normalised through the one identity table
    (BO-4300a-2, aliases included) and must equal the marker's kind and slug; a mismatch is refused
    VERIFY_FAILED with no workspace_path. A --kind outside the maker's declared set of kinds is a USAGE
    error (exit 64, one JSON object). --kind and --slug stay optional and must be given together.
  - >-
    failed_ingredients is an addition to the BO-4300c-2 result contract (compatible under its
    schema_version policy); it appears only on a VERIFY_FAILED answer and names checks by their checks.*
    key.
  - >-
    CALLERS STAY CORRECT: every caller that confirms a handed-in location through verify (BO-4300c-4-i,
    e.g. build-feature.js's handed-in confirmation and each `verify --path` site in templates/workflows-js/)
    still proceeds on a genuinely ready workspace and now halts on VERIFY_FAILED like any other non-ok
    answer; the workflow-engine harness tests for those callers stay green.
  - >-
    verify stays read-only (BO-4300e-1-i): it creates, repairs and fetches nothing, and completes within
    BO-4300a-1's 5 s budget for read-only verbs.
  - >-
    Answers conform to the result contract delivered by BO-4300c-2 (one JSON object on stdout, the
    status/code/exit mapping, workspace_path absent on every non-ok answer).
  - >-
    Proof runs the DEPLOYED maker as a separate process against a real ready workspace made by ensure;
    readiness is falsified through the fixture (checking out main inside the workspace), never through a
    maker flag. No mock of git, no import of the maker module, no grep of its source.
  - >-
    Tests must not spawn the package's own scripts/build.py; fixture projects carry the minimal stub build
    entry point (CLAUDE.md 'Tests must not spawn their own build.py').
  - >-
    All temporary projects, hubs and workspaces live under the test's temp directory and run git with an
    isolated global and system config; afterwards the developer's own repository's branches, registered
    worktrees and local git config are unchanged (BO-4300f-4-i, KI-TQ-012).
delivers_to: null
expects_from:
  ac_id: BO-4300e-1
  contract: >-
    locate/verify read-only answers: ok with workspace_path for a ready workspace; NOT_FOUND or INCOMPLETE
    otherwise, never with workspace_path; checks.* keys as listed in the BO-4300c-2 result contract.
test_intent:
  - clause: the request for "alpha" is answered ready with its location
    needs_test: true
    reason: Tightening verify could start refusing healthy workspaces, which would halt every caller that confirms a handed-in location.
  - clause: the request for "beta" is refused as not that work's workspace, with no location
    needs_test: true
    reason: verify parses the kind and slug today but never compares them with the marker, so a wrong workspace is confirmed.
  - clause: the request naming an unknown kind is refused as a malformed request
    needs_test: true
    reason: An unvalidated kind falls through to the comparison and is silently accepted or mismatched instead of rejected.
  - clause: the request after the switch onto the shared main line is refused naming the part of readiness that no longer holds, with no location
    needs_test: true
    reason: verify answers ok even when the checks it computes are false, so only a falsified ingredient shows the answer now follows the checks.
  - clause: the request while it holds an uncommitted change is answered ready
    needs_test: true
    reason: Refusing on every false check would wrongly include the clean-tree check and halt every caller mid-run.
test_spec:
  - name: test_verify_of_alpha_as_alpha_is_ready_with_its_location
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: reachability
    description: >-
      New unit_tests/build_orchestration/test_bo_4300e_1_ii.py, a WorkspaceCase subclass (test_bo_4300e_2.py;
      test_bo_4300e_1.py is the neighbouring verb test). ensure --kind feature --slug alpha through the deployed
      worktree.py, then run `verify --path <ws> --kind feature --slug alpha` as a subprocess. Assert status ok, exit
      0, workspace_path equal to the ensured location. Also accept the declared spelling 'feature/alpha' and the
      un-normalised slug 'Alpha' for the same workspace, and take a before/after snapshot of the workspace to show
      verify stayed read-only.
    proves_clause: the request for "alpha" is answered ready with its location
    code_file: templates/scripts/worktree.py
  - name: test_verify_of_alpha_as_beta_is_refused_without_a_location
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      With ready workspaces for alpha, run verify --path <alpha ws> --kind feature --slug beta. Assert refused
      code VERIFY_FAILED, exit 2, one JSON object, no workspace_path key, and that no beta workspace was created.
      Also run verify --path <alpha ws> --kind epic --slug alpha (same slug, other kind) and assert the same
      refusal, so a slug-only comparison is caught.
    proves_clause: the request for "beta" is refused as not that work's workspace, with no location
    code_file: templates/scripts/worktree.py
    must_catch:
      - a verify that still parses --kind and --slug and never compares them with the marker
      - a verify that compares only the slug and ignores the kind
  - name: test_verify_with_an_unknown_kind_is_a_usage_error
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Run verify --path <alpha ws> --kind bogus --slug alpha. Assert code USAGE, status error, exit 64, one JSON
      object, no workspace_path key, and that the message names the unknown kind. Control: the same request with
      --kind feature is ok. Also assert --kind given without --slug is a USAGE error (they stay optional and must be
      given together).
    proves_clause: the request naming an unknown kind is refused as a malformed request
    code_file: templates/scripts/worktree.py
    must_catch:
      - a verify that lets the unknown kind fall through to the comparison and answers VERIFY_FAILED with exit 2 instead of USAGE with exit 64
      - a verify that accepts the unknown kind and answers ok
  - name: test_verify_after_checkout_of_main_names_the_failed_ingredients_and_gives_no_location
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Falsify readiness through the fixture only: in the ensured workspace run `git checkout main` (the clone has
      origin/main, so git creates the local main), then verify --path <ws> --kind feature --slug alpha. Assert
      refused, exit 2, no workspace_path, failed_ingredients is a list naming at least branch_matches and
      not_protected_branch, and the checks object is present with those two false. Assert code VERIFY_FAILED and
      explicitly not ON_PROTECTED_BRANCH (worktree_readiness._refuse_structural maps not_protected_branch to
      ON_PROTECTED_BRANCH today, which is why worktree_readiness.py is now declared). Also assert the before/after workspace snapshot is unchanged.
    proves_clause: the request after the switch onto the shared main line is refused naming the part of readiness that no longer holds, with no location
    code_file: templates/scripts/worktree.py
    must_catch:
      - a verify that answers ok because it never turns its computed false checks into a refusal
      - a verify that refuses but names only the first false check in failed_ingredients
  - name: test_verify_with_an_uncommitted_change_is_still_ready
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
    angle: discrimination
    description: >-
      Edit the tracked README.md inside the ensured workspace (git diff HEAD only sees tracked changes, so an
      untracked file alone would not flip tree_clean) and add one untracked file, then verify --path <ws> --kind
      feature --slug alpha. Assert status ok, exit 0, workspace_path equal to the location, and checks.tree_clean is
      reported false. Control in the same test: the identical verify after the checkout of main is refused, so the
      ok answer is not simply 'verify never refuses'.
    proves_clause: the request while it holds an uncommitted change is answered ready
    code_file: templates/scripts/worktree.py
    must_catch:
      - a verify that refuses on every false check including tree_clean, halting callers mid-run
      - a verify that refuses on base_is_fresh when the workspace has legitimately fallen behind the hub main
