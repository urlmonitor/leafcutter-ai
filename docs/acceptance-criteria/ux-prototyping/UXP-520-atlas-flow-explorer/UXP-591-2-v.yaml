notes: |
  Owner ruling at the AC gate (2026-10-09), decision (2)(b): an old /flows?flow=<id>[&step=<step>]
  link whose flow id is unknown answers 308 to the canonical form and then shows the 404
  'Flow not found' state for that id. The flow leafcutter/explore-flows-in-atlas v5 does not yet
  model this behaviour, so no flow node maps to this AC and it carries no flow back-link. The
  redirect does not first check whether the flow exists; the 404 comes from the canonical address
  it lands on. The landing states are the dataset's FlowRoute route-unknown-flow-with-step and
  route-unknown-typo, whose notice reads "No flow has the id 'leafcutter/flow-render-pipline'.
  The link may be mistyped, or the flow was renamed or removed.".
