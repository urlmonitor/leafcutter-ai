title: "An operator can find out from the reference where every report is kept, before anything has been written"
component: infrastructure
level: L3
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given an operator or installer wants to know where the reports, the telemetry and
    the knowledge records of a drive are kept,
  When they read the feedback and operational-log reference,
  Then it states that every log in the operational log directory is kept in one
    enduring location that outlives the temporary per-drive workspace,
  And it states how to ask for that location without filing a report,
  And it states what happens when that location cannot be determined: the report is
    refused with a reason rather than written into the disposable workspace,
  And it states that reports written into per-drive workspaces before this change
    are not carried over, and where the one-off rescue of them is kept.
