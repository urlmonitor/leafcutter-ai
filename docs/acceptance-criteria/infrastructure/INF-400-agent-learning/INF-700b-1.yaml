it_requirements:
  - "SCHEMA CHANGE (resolves the INF-400b-2 contradiction the BA escalated). The knowledge-capture record gains one additive field, `text`, carrying the learning body as the agent wrote it. The field is REQUIRED OF THE PRODUCER (an emitting agent must populate it with non-empty prose) and OPTIONAL TO THE CONSUMER (a reader must accept a record without it). This asymmetry is the whole backward-compatibility story: the 28 six-field records already in debugging/logs/agent_telemetry.jsonl stay structurally valid on read, and a missing `text` is a CLASSIFICATION (ineligible-to-write, per INF-700c-1) rather than a parse error or a validation failure."
  - "GOVERNANCE — INF-400b-2 requires amendment and must NOT be edited by the implementer of this AC. Its enumerated field list (event, timestamp, agent, component, destination, entry_kind) becomes incomplete the moment `text` ships. Its separate clause 'structurally identical to the events emitted by phase agents via signoff section 7 step 4' does NOT need amendment and must keep holding — which is why the field must be added to BOTH emission surfaces in one change (see next requirement). Raise the amendment to the BA/PO; do not resolve it silently in code or prose."
  - "The `text` field must be added to all four emission surfaces in a single change so no install ever runs a mixed contract: templates/skills/signoff/SKILL.md section 7 step 4, and the S9 knowledge-emission blocks of templates/agents/product-owner.md, templates/agents/business-analyst.md and templates/agents/it-po.md."
  - "PRE-EXISTING DIVERGENCE, flag do not fix here: section 7 step 4 documents a record keyed on `ticket`, while the three v3 templates document `agent` + `component`; all 28 records on disk carry the v3 shape and none carries `ticket`. The harvester's idempotency hash keys on `ticket` among other fields (scripts/knowledge/harvest_learnings.py `_event_hash`), so it hashes an always-empty field. Reconciling the two shapes belongs to INF-400b-2, not to this AC; this AC must not pick a winner unilaterally, and must not make the divergence worse."
  - "The record is one JSONL line. `text` must be a JSON string that survives a json.loads round trip with embedded newlines escaped — no multi-line pretty-printing, no unescaped control characters, no raw markup fragments. Precedent: line 19 of the live sink is a bare `</content>` fragment left by a hand-composed append."
  - "The replacement step must name ONLY artefacts that resolve in BOTH layouts: templates/skills/<name>/ in the package checkout and .claude/skills/<name>/ in a consumer install. The names `route-learning` and `capture-learning` are retired by ADR-034 section 2 item 3 and must not be reintroduced under any spelling; scripts/check_skill_refs.py currently reports 10 dangling imperative references to the two of them across six files, and INF-700b-2 turns that report into a refusal."
  - "Must not introduce a sink-path literal. Which file the record lands in is INF-400c-4's decision and is currently unsettled (the harvester defaults to debugging/logs/knowledge_emissions.jsonl, which has never existed; the live records are in debugging/logs/agent_telemetry.jsonl). Reference the sink through the single declared path, never a second competing literal."
  - "Fail-open is retained — a knowledge step must never block an agent's primary output or its sign-off — but the proceed-anyway branch must leave a countable artefact. That obligation is specified by INF-700b-1-ii and must not be re-specified or contradicted here."
test_spec:
  - name: test_capture_step_names_only_resolvable_skill_targets
    target_dir: unit_tests/
    framework: unittest
    type: behavioral
    angle: reachability
    description: "Executes scripts/check_skill_refs.py over the template tree and asserts zero dangling imperative references originate from the signoff section 7 capture step or the three v3 agent S9 blocks."
  - name: test_section_7_emission_shape_declares_a_learning_text_field
    target_dir: unit_tests/
    framework: unittest
    type: unit
    angle: real_artifact
    description: "Parses the JSON object documented in templates/skills/signoff/SKILL.md section 7 step 4 as shipped and asserts it declares a `text` key alongside the existing descriptive keys."
  - name: test_v3_agent_emission_shape_matches_section_7
    target_dir: unit_tests/
    framework: unittest
    type: unit
    angle: real_artifact
    description: "Parses the emission JSON from product-owner.md, business-analyst.md and it-po.md S9 and asserts each key set equals section 7 step 4's, holding the INF-400b-2 structural-identity clause."
  - name: test_existing_six_field_records_remain_readable_without_text
    target_dir: tests/knowledge/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Feeds the real 28-record corpus (tests/fixtures/harvest_learnings/unroutable_corpus_28.json) to the reader and asserts no record is rejected as invalid for lacking `text`."
test_rationale: |
  Three of the four descriptors assert against the shipped artefact rather than
  a fixture, because the artefact under change IS prose: a test that builds its
  own template string proves nothing about what ships. The first descriptor
  executes the checker rather than grepping for the absence of a name, per the
  project's "verify behaviorally, not by grep" rule — a grep for
  "route-learning" passes the moment someone renames the reference while
  leaving it dangling. The fourth descriptor is the backward-compatibility
  proof and must use the real corpus, not a hand-written six-field stub, since
  the point is that records written by real agents in June still parse.
delivers_to:
  agent: python-coder
  contract: "The knowledge-capture record shape, one JSON object per line: { event: \"knowledge_captured\", timestamp: string (ISO-8601), agent: string, component: string, destination: string, entry_kind: string, text: string (non-empty, newlines escaped) }. `text` carries the learning body and is the ONLY field a writer or counter may treat as content; every other field is descriptive. Consumers must tolerate `text` being absent on pre-existing records and classify such a record as ineligible-to-write rather than rejecting it."
