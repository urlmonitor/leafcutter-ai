id: ACS-200g-2
components:
  - ac_store
title: "A pull request is not failed for pre-existing problems it did not introduce"
component: ac-store
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the requirements store already contains acceptance-criterion records
    that break one or more of the store's rules,
  And a pull request that leaves every one of those records untouched and
    changes a different acceptance-criterion record which satisfies every rule,
  When the acceptance-criteria check runs on that pull request,
  Then the check reports a passing result,
  And none of the pre-existing problems in the untouched records is reported as
    a failure of this pull request.

  Given the same already-broken records,
  And a pull request that edits one of them without fixing the rule it breaks,
  When the acceptance-criteria check runs on that pull request,
  Then the check reports a failing result naming that record,
  Because the pull request now touches it — the exemption covers records the
    change leaves alone, not records the change adopts.

  And the symptom ("the check fails every pull request on day one for problems
    nobody in that pull request introduced, so the check gets switched off")
    must not occur.
