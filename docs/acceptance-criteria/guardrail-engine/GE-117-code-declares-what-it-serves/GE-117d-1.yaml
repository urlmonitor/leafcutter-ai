id: GE-117d-1
readiness: approved
priority: medium
title: "A commit is blocked by default when any in-scope declaration is missing or invalid"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-117-code-declares-what-it-serves/GE-117d.yaml"
criteria: |
  Given the declaration checks have produced at least one missing-declaration or
    invalid-declaration verdict for in-scope staged code
  And no enforcement mode has been deliberately configured
  When the commit-time guardrail runs on the staged commit
  Then the commit is rejected
  And the guardrail reports each offending item naming the file, the surface
    (module component, public symbol, or new decision-history entry), and whether
    the declaration was missing or invalid
  And for an invalid declaration the report names the unresolved value that was
    declared

  Given the declaration checks have produced verdicts for module-component,
    symbol-AC, and decision-history-AC surfaces in the same commit, with at least
    one violation on more than one surface
  When the commit-time guardrail runs
  Then the commit is rejected
  And the report enumerates every offending item across all three surfaces rather
    than stopping at the first
depends_on:
  - GE-117d
  - GE-117a-1
  - GE-117b-1
  - GE-117c-1
