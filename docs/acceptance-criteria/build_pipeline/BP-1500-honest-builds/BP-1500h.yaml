readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Leave a file location empty, and every part of the build reads it as off.

  An empty file location in your settings means one thing everywhere: that
  feature is not configured. No part of the build tries to open your project
  folder as if it were the file, and no part skips the work silently -- what
  was not configured is said once, the same way, wherever it is read.
