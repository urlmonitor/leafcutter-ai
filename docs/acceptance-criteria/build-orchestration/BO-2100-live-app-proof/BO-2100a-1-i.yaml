id: BO-2100a-1-i
components:
  - build_orchestration
title: "live-surface-tester is absent from the agents map unless both toggles are on, and a requested-but-disabled check is recorded as skipped"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a ticket authored via the ticket-authoring skill in each of these states:
    (a) frontmatter `live_surface_test: true` but `skills_config.json`
        `live_surface_testing.enabled` is `false`,
    (b) frontmatter `live_surface_test` false or absent while
        `live_surface_testing.enabled` is `true`,
    (c) neither toggle set,
  When the business-analyst produces the ticket's `agents:` map
  Then the map contains NO `live-surface-tester` key in any of states (a), (b), or (c)
    And the key appears ONLY when the feature toggle and the project toggle are both true
    And in state (a) — and ONLY state (a) — the ticket additionally carries exactly one
      recorded `live-surface-tester` outcome of `skipped` whose reason names
      `live_surface_testing.enabled` as the term that prevented dispatch, because the
      ticket asked for the check and did not get it
    And in states (b) and (c) the ticket carries NO `live-surface-tester` outcome
      record at all, because the ticket never asked for the check.
depends_on: [BO-2100a-1]
