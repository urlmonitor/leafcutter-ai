criteria: |
  Given a ticket is being driven and delivery is refused with an outcome that
    names one file, states a demand of 120 measured lines against it, and states
    that a demand of that size is handed to a restructuring specialist,
  When the run engages the restructuring specialist,
  Then what the specialist is given names that file and states that demand of 120
    measured lines,
  And given the same run repeated with the refusal changed in one respect only —
    it states a demand of 37 measured lines against the same file,
  When the run engages the restructuring specialist,
  Then what the specialist is given states 37, so the demand MOVED with the
    refusal's,
  And given the same run repeated with the refusal changed in one respect only —
    it names a different covered file at the same demand,
  When the run engages the restructuring specialist,
  Then the file named in what the specialist is given MOVED with the refusal's,
  And given a refusal stating a demand that disagrees with what re-running the
    standard against the named file after the refusal would produce,
  When the run engages the restructuring specialist,
  Then what the specialist is given states the demand the REFUSAL stated, and not
    the one a re-run would produce — so the demand is carried from the refusal the
    run is acting on, and is never re-read from the file, re-computed, re-derived,
    or recovered from anywhere else.
