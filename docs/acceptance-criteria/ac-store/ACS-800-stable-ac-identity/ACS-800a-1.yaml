title: "A new requirement is assigned the next sequential opaque UID at creation"
component: ac-store
level: L2
status: active
req_status: approved
work_status: todo
criteria: |
  Given the requirement store currently holds requirements whose highest
    assigned stable UID is the integer 41,
  When a new requirement is created in any component and at any tree position,
  Then the new requirement is assigned the stable UID 42,
  And the UID is allocated from a single store-wide sequence shared by all
    components (not per-component and not per-level),
  And the UID value is opaque — it encodes neither the component prefix, the
    parent, the level, nor the sibling position of the requirement,
  And the assignment happens at creation time, before the requirement file is
    first persisted.
