test_spec:
  - name: test_a_never_run_tree_and_a_ran_after_every_unit_of_work_tree_report_differently
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: criterion
    description: "The discriminating pair the AC names. Build two temp trees: one where the routing step ran after each of five units of work, one where it has never run. Assert both report a waiting count of zero AND that their status answers differ. An answer that cannot tell these two trees apart fails, whatever else it reports."
  - name: test_an_absent_run_marker_reports_no_run_recorded_and_is_not_an_error
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: failure
    description: "Fresh-clone simulation: no debugging/ directory at all. Assert the answer carries the never-run value, that the value is not a zero timestamp and not an empty string, that the exit status is not an error status, and that querying created neither the marker nor its directory."
  - name: test_the_answer_reports_whether_the_named_sink_exists_and_names_it
    target_dir: tests/knowledge/
    framework: pytest
    type: behavioral
    angle: reachability
    surface_invoked: "the routing-status query run through its production CLI entry point via subprocess"
    description: "Run in two trees, one with the declared sink present and one with it absent, holding the last-run state identical. Assert the existence field differs between them and the resolved sink path appears in both answers. A routing step running happily against a path no producer writes to must be visible as that."
  - name: test_the_recency_answer_changes_after_a_completion_path_runs
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    angle: seam
    description: "Pipe the real producer into the real consumer: query the status in a fresh tree and assert never-run; drive one completion path to completion under the engine harness; query again and assert the answer now reports a completed run over the declared sink. Fails if the completion path does not actually record its run, or if the status reads a source the driver does not write."
test_rationale: |
  The first descriptor is the AC's own stated discriminating pair and is the
  only test that can distinguish this feature from doing nothing, because the
  waiting count reads zero in both trees. The fourth crosses the producer /
  consumer seam deliberately: a status answer tested only against
  hand-constructed marker files passes while nothing in the pipeline ever
  writes one, which is a smaller copy of the defect the whole INF-700a family
  exists to close. The second asserts three separate not-this properties (not
  an error, not a zero, not created by the query) because each of the three is
  a plausible implementation and each defeats the criterion in a different way.
notes: |
  The discriminating pair to test, stated so it is not lost: a tree where the
  routing step ran after every one of five units of work and a tree where it has
  never run both report a waiting count of zero. Any answer that cannot tell
  those two trees apart has not satisfied this criterion, whatever else it
  reports.

  Scope. This AC does not ask for a durable, cross-machine record of every run.
  It asks that a person standing in one tree can find out what happened in that
  tree, and that "I have no record" is said out loud rather than rendered as a
  clean zero.
