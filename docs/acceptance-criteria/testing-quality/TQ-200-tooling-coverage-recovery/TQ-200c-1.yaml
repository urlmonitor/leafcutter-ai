it_requirements:
  - "Author fresh unit tests in tests/test_prioritize.py (new file). Source PR is closed — write from scratch and verify run-to-green before sign-off. prioritize.py lives under templates/skills/ticket-prioritizer/scripts/ — import it via sys.path.insert of that scripts directory (see tests/test_pick_next_with_acs.py for the sys.path pattern)."
  - "API MISMATCH: there is no single function named prioritize. Map 'prioritize ranks the tickets' to the pipeline discover_tickets -> build_graph -> detect_cycle -> compute_ready. Assert compute_ready returns (ready, blocked) with blocked tickets excluded from the ready set and ready sorted highest-priority-first (PRIORITY_ORDER: critical<high<medium<low)."
  - "Assert detect_cycle returns the cycle node path (and main() exits non-zero) for a dependency cycle, rather than surfacing an arbitrary ticket as ready."
  - "API GAP: parked-ticket handling does NOT exist — _is_done treats only status 'done'/'deferred' as done, so a status: parked ticket is currently surfaced as ready. The parked-exclusion scenario cannot be authored run-to-green against the current code; flag to the BA/coder that 'parked' handling must be added first."
  - "Use tmp_path ticket .md fixtures carrying real frontmatter (status, priority, depends_on) since discovery is filesystem-driven (discover_tickets rglob's *.md)."
