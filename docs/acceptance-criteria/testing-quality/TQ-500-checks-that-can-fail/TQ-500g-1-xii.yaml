notes: |
  THE THREE TRIGGERS, AND ONLY THREE. A name goes to the preparer when (1) the
  work holds no pin for it, (2) its pinned old text no longer occurs exactly
  once in the current file (N2), or (3) its wording changed (N4). Every other
  name comes from the pin. The other failed checks of TQ-500g-1-xiii (does not
  load, changes nothing, changes no executed line, out of scope) also send a
  name back to the preparer; they are specified there, not here.

  WORDING CHANGE = A NAME WITHOUT A PIN. The pin is keyed by name, so a changed
  wording is a name the pin does not hold, and the earlier wording's pin is
  simply not owed any more. That is why N4's new wording reads "prepared: not
  pinned" rather than "re-prepared: wording changed": the store cannot tell a
  reworded name from a removed name plus an added one, and the BA chose not to
  invent a link (by entry position, for example) that could misfire. If the
  user wants the row to say "wording changed", IT-PO must define the link.

  COMPARISON. After the gate's existing trim and case-fold, the same rule
  TQ-500g-1-i uses for the fix-undone aliases (N3). The reply's own name
  matching in the writer (TQ-500g-1-ix, decision 2c) stays exact; only the pin
  lookup is normalised.

  AN UNOWED PIN IS KEPT. Nothing but the reset (TQ-500g-1-xvi) clears a pin,
  so a name dropped from must_catch and later restored gets its earlier pin
  back, still subject to every check.

  ROUTES. Only the names to prepare are sent to test-breaker; the routes'
  contracts (TQ-500g-1-v, -vi, -vii) must change accordingly in their next
  IT-PO pass.

  IT-PO ENRICHMENT (2026-10-23)
  The BA's choice is kept: no link from a reworded name to the old wording's
  pin, so the row reads "prepared: not pinned". The decision lives in
  _wvp_plan (TQ-500g-1-xi), shared by list and write. The route contracts were
  amended in this pass (to_prepare, TQ-500g-1-v/-vi/-vii). Retarget wording:
  0 occurrences "re-prepared: target changed", 2 or more "re-prepared: old text
  found N times" (TQ-500g-1-xiii check a), so -xii and -xiii never word the same
  failure two ways.
