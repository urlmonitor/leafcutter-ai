criteria: |
  Given a ticket whose YAML frontmatter agents map contains
    "python-coder: needed" and "pr-reviewer: needed",
  And the ticket body does NOT contain a "## Sign-offs" section,
  When build-ticket.js Step 1 runs the planner agent,
  Then the planner uses the frontmatter agents map as the sole source
    of truth for ordered_phases,
  And drift_warnings contains at least one entry noting that the
    "## Sign-offs" section was absent from the ticket body,
  And no error is raised (the workflow proceeds with frontmatter-only data).
