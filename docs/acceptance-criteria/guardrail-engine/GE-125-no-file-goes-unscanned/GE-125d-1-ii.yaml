notes: |
  THE TWO NOTICES MUST PARTITION THE REMOVALS, NOT OVERLAP. GE-123d-5, in the
  adjacent goal, specifies a notice for the per-finding exemption that feature
  introduces, and it explicitly EXCLUDES from its count both allowlist
  suppressions and the file-level location-based reduction that this goal is
  about. This record is the mirror image: it counts exactly the mechanism that
  one excludes. Read together the two notices divide the removals cleanly, and
  they must stay divided — merging them into one ambiguous total would leave a
  reader unable to tell which mechanism to argue with.

  THIS IS A CITATION, NOT AN EDGE. Six GE-123 records fence this defect as out
  of scope, deliberately and as dated records of a decision, and the known issue
  states plainly that no depends_on edge may be added from a GE-123 record to
  this tree. Nothing here adds one in either direction; GE-123d-5 is named in
  prose so the contract is legible, and neither record may be closed as a
  duplicate of the other.

  FIXTURE PLACEMENT, stated explicitly as this tree requires. The one file under
  a reduced location ("docs/retrospectives/…") is there because the reduction is
  the subject. Both control files are ordinary source paths outside every
  reduced location — "src/config_loader.py" and "src/app.py" — so that the
  allowlist arm genuinely measures the allowlist and not a second reduction
  overlapping it. The third arm deliberately overlaps the two mechanisms on one
  file, which is the only way the double-count failure is reachable.

  ".security-allowlist" fixtures belong inside the throwaway repository only.
  Writing one into a real project root would change the behaviour of the
  repository the test runs in.

  IT-PO NOTE, 2026-08-24 — WHY THE PARTITION IS ALREADY HALF-BUILT, and why
  that is a trap rather than a relief. Measured in the canonical copies: the
  allowlist is applied inside scan_files, in the scanner, before the hook's
  per-file _filter_prose_findings post-filter is reached. So an
  allowlist-suppressed finding is already gone by the time the reduction could
  withhold it, and a naive implementation that simply records what
  _filter_prose_findings removed satisfies the first and third arms without
  trying. The trap is the more thorough-looking implementation: computing the
  withheld set by re-scanning with suppression disabled, which produces a set
  containing allowlist-suppressed findings and double-counts the overlap. The
  ordering is the requirement, not an incidental property of today's code.
