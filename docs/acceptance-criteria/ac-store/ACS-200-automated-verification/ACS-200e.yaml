notes: "Authored by /quick-fix. Root cause: scripts/ac_store/validate_ac_schema.py never loads config/ac_store_schema.json — it imports only sys, pathlib, yaml and _ac_components and performs hand-rolled field checks — despite its module docstring claiming it 'validates the full schema against config/ac_store_schema.json'. The commit-time hook templates/scripts/commit_guardian/check_ac_schema.py does load that schema (SCHEMA_PATH) and run validate_with_jsonschema, so authors get a false green from the standalone validator and only discover violations at commit time."
