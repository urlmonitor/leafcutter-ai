it_requirements:
- Persist the inbox item first; deduplicate notification attempts by stable outcome identity, not each
  polling tick.
- Keep native notifier errors separate from feature implementation/review/publication state.
- Verification must execute the installed CLI/workflow or its real control-flow boundary with controlled
  external executors; source-string presence and model self-report are not evidence of behavior.
- 'Runtime interface from ACD-1300d-1 (data handoff, not an additional build-order prerequisite): InboxItem
  {item_id:string, run_id:string, feature_id:string, ac_id:string|null, request_id:string|null, state:string,
  reason:string|null, required_answer:string|null, evidence_refs:string[], pr_url:string|null, validated_sha:string|null,
  reviewed_sha:string|null}.'
test_spec:
- name: test_background_worker_new_outcome_notifies_once_and_links_inbox
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: integration
  angle: reachability
  description: Record a new blocker and a new delivered proposal; each causes one desktop notification
    with feature and durable item/PR reference.
  covers:
  - ACD-1300d-2
  surface_invoked: Installed background-worker CLI entry point specified by ACD-1300b-1 (concrete command
    name to be declared by implementation)
- name: test_background_worker_unchanged_polling_and_replay_do_not_repeat_alerts
  target_dir: unit_tests/ac_driven_dev/
  framework: pytest
  type: behavioral
  angle: criterion
  description: Poll and reload unchanged outcomes repeatedly; assert notification count unchanged and
    a genuinely new outcome may notify.
  covers:
  - ACD-1300d-2
