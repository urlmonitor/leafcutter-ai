risk_surface: internal
test_spec:
  - name: test_pause_store_and_script_resolution_dispatch_to_shell_permitted_agent
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Runs plan-feature under the E2 harness to an unanswered gate and through a resume; asserts every pause-persist, pause-persist-verify, peek/read/clear/clear-verify-pause-record and resolve-worktree-setup-script-path dispatch in agent_calls has agent_type worktree-agent and none has status-checker."
  - name: test_status_checker_scope_refusal_no_longer_reachable_on_pause
    target_dir: unit_tests/workflows/
    framework: pytest
    type: behavioral
    description: "Feeds a status-checker-shaped scope refusal to any status-checker dispatch; asserts the pause still persists (result status is the paused state, not pause_persist_failed), proving the pause path does not depend on status-checker."
notes: |
  Authored by /quick-fix on 2026-09-25 from a live failure: run itpo-split-20260925
  (workflow wf_734389cf-248) ended pause_persist_failed at gate-po because status-checker
  refused `pause_store.py write` as outside its ticket-state role. Diagnosis: status-checker
  has permits_shell: false (config/agent_registry.json), worktree-agent is the only entry
  with permits_shell: true and is already plan-feature's workspace-setup executor.
  Implemented together with BO-1500a-5-i (bootstrap fail-closed) in one change, because
  both touch the resolve-worktree-setup-script-path dispatch.
  Residual: worktree-agent's charter names worktree lifecycle, not pause-store I/O; a
  dedicated shell-executor agent (KI-BO-20260901-1620 item 4) would be the durable fix.
