estimated_complexity: S
it_requirements:
  reference_file_path: "scripts/ac_store/done_proof.py"
  n_location_rule: "0 — negative control: no location in the reference file may be changed to consume the new axis, and the assertion is that none does"
  required_skills:
    - python-coder
  post_write_commands:
    - "python -m pytest unit_tests/ac_store/ unit_tests/commit_guardian/ -q"
  config_schema_fragment:
    type: object
    description: "The invariance this AC asserts: the run outcome and the completion decision are functions of the coverage axis alone. The angles axis is an input that must not appear in either output."
    required:
      - run_outcome_inputs
      - completion_decision_inputs
    properties:
      run_outcome_inputs:
        type: array
        items:
          type: string
          enum:
            - covers
        description: "The coverage axis only. 'angles' must never appear here."
      completion_decision_inputs:
        type: array
        items:
          type: string
          enum:
            - covers
        description: "The coverage axis only. 'angles' must never appear here."
  constraints:
    - "The property is an ABSENCE and must be asserted across two runs differing in exactly the suspected cause — tag present vs tag absent, and whole-suite tags-stripped vs tags-present. A test that exercises only the new axis cannot observe an absence and will pass on an implementation that quietly consumes the tag."
    - "Both consequences must be covered together: the run outcome (which failing tests block) and the completion decision (whether the work counts as done). An implementation can leave the first untouched and still leak the tag into the second."
    - "The comparison must be over the real enforcement path — done_proof's eligibility computation and the pytest_ac_enforcement plugin — not over a re-implementation of the decision inside the test."
    - "The strip-every-kind-tag run must operate on a real copied test subtree written to disk, not on in-memory records, so a tag consumed anywhere in the file-reading path is caught."
    - "This AC must add no new enforcement of its own. It is a negative control: its only output is evidence that nothing changed, which is why n_location_rule is zero."
delivers_to: null
expects_from:
  - ac_id: BP-1100g-3
    contract: "A single-pass scanner returning both tag axes per test function, and an eligibility computation that consumes only the existing coverage axis."
test_spec:
  - name: test_bp_1100g_3_i_tagged_and_untagged_failing_tests_are_treated_identically
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: unit
    angle: criterion
    description: "Two failing tests carrying the same coverage tag and differing only in the presence of a kind tag produce the same treatment, and the run outcome equals the outcome with neither tag present."
  - name: test_bp_1100g_3_i_kind_tag_never_reaches_the_enforcement_decision
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: seam
    description: "Pipe the real scanner's real output (both axes populated) into the real enforcement consumer and assert the coverage axis alone decides which failing tests block — the producer/consumer pair, not either side in isolation."
  - name: test_bp_1100g_3_i_stripping_every_kind_tag_changes_no_outcome_and_no_completion_decision
    target_dir: unit_tests/ac_store/
    framework: unittest
    type: integration
    angle: real_artifact
    description: "Copy a real test subtree to a temp dir, run the whole-suite outcome and the completion decision twice — once as written and once with every kind tag removed from the files on disk — and assert both results are identical."
  - name: test_bp_1100g_3_i_enforcement_unchanged_through_the_deployed_gate
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT: run `python scripts/commit_guardian/check_done_proof.py --mode ci-changed --base <ref>` as a subprocess over a fixture store and test tree, with and without kind tags present, and assert byte-identical verdicts — the CI gate is where a leaked tag would actually change a merge decision."
test_rationale: |
  "The new axis does not affect enforcement" is a property of an absence, and absences are
  invisible to any test that only exercises the new axis. Two shapes are load-bearing: the
  pairwise run differing in exactly the tag, and the whole-suite strip, which is the one
  no implementation that quietly consumes the tag anywhere can satisfy. The deployed-gate
  variant is included because the CI path, not the library API, is where a leaked tag
  would change a merge.
