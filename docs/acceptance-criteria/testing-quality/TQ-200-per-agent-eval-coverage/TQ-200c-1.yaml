id: TQ-200c-1
components:
  - testing_quality
  - ac_store
title: "A requirement can state that a proof is judged rather than asserted, in words both sides understand"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: high
roadmap_phase: phase_1
criteria: |
  Given a piece of work whose behaviour can only be settled by a judgment about a
    model's output — for example, whether a prompt elicits the intended behaviour —
    and which today can only be written down as a deterministic assertion or not at
    all,
  When its author writes down the proof it needs,
  Then the author can state that this proof is settled by judgment rather than by
    assertion, and can do so in the same place, and in the same shape, as a
    deterministic proof is stated,
  And the same statement can also say that a proof is settled by assertion, so the
    two are alternatives within one vocabulary rather than two unrelated notations,
  And the word chosen for a judged proof means the same thing to whatever produces
    the plan for the work and to whatever consumes that plan: a plan carrying a
    judged proof is accepted by the consumer as a judged proof, without translation
    and without either side inventing a private synonym,
  And a proof statement using a word neither side recognises is refused at the point
    it is authored, naming the unrecognised word, rather than being accepted and
    ignored later,
  And a deterministic proof written before this vocabulary existed still means
    exactly what it meant, and still reads as a deterministic proof, with nothing
    added to it and nothing required of its author.
depends_on:
  - TQ-200c
