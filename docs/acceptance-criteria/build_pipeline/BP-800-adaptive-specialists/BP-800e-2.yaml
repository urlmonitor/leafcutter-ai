id: BP-800e-2
title: "Migration transfers project context into the new structure without user action"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given the build has detected a legacy agent layout in the project
  And the project has PROJECT_CONTEXT.md files in legacy locations
  When the migration process runs
  Then it transfers all project-specific context (PROJECT_CONTEXT.md content, user customizations from agent templates) into the new structure
  And the technology detector runs and produces a technology manifest for the project
  And generated specialists are produced from the manifest and knowledge layer
  And the user's workflow continues without any manual setup, config edits, or re-initialization commands
  And a migration summary is printed: listing each migrated artifact and its new location
depends_on:
  - BP-800e
  - BP-800e-1
