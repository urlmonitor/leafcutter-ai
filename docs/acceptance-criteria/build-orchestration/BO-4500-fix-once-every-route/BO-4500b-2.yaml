risk_surface: safety
created_by: "docs/acceptance-criteria/build-orchestration/BO-4500-fix-once-every-route/BO-4500b.yaml"
criteria: |
  Given installed routes A and B each carry ALPHA-ANSWER,
  And after the install one character inside route B's installed ALPHA-ANSWER text is changed,
  When the identity check runs over the installed routes as part of the test suite,
  Then the check fails, naming route B, the block ALPHA-ANSWER and the first line that differs
    from the source,
  And route A is not named.

  Given a new route D whose template marks an empty place for ALPHA-ANSWER is added and the package
    installed,
  And route D's installed ALPHA-ANSWER text is then changed,
  When the identity check runs, with no change made to the check itself,
  Then the check fails naming route D,
  Because the routes checked are every installed route found carrying a marker pair, never a list
    of routes kept in the check.

  Given every installed copy of every block equals its source byte for byte,
  When the identity check runs,
  Then it passes,
  And its report states, for each block, how many installed copies were inspected and names the
    routes that carry it.
