notes: |
  WHAT THIS AC ADDS THAT THE BRANCH DOES NOT ALREADY HAVE. The deployment half of this
  defect is specified. BP-900g-8-ii makes the build refuse to ship an install whose
  declaring files are not in the deploy manifest; BP-900h-4 proves empirically that they
  arrived; BP-900h-5 requires a guardrail that cannot locate them to be reported as unable
  to run rather than as a failure. All three are approved and all three are work_status:
  todo, so KI-BP-003's deployment half is an unimplemented specification, not an
  unspecified defect — do NOT author a fourth AC for it.

  What none of them says is that the guarantee must hold in more than one install layout,
  and that is the half the 2026-08-25 evidence adds. Deploying the file into the tree does
  not make the lookup independent of the package directory's name, and every fixture in
  this branch builds exactly one layout, with h-1's criteria fixing the package directory
  to one specific name. Two adopters can therefore both be right about contradictory
  symptoms while every AC in the branch is satisfied.

  THE CONTRADICTION IS RESOLVED, NOT LEFT OPEN. KI-BP-003 asks the next reproducer to settle
  whether the main checkout is affected. It was settled on 2026-08-25 and the answer is that
  both reports are correct for different install directory names: under the name one
  adopter used, the second hardcoded candidate resolves in the main checkout and fails in a
  worktree; under the name this project's own bootstrap documentation prescribes, neither
  candidate ever resolves and it fails everywhere. That is why the layout set has to vary
  the directory name AND the worktree-ness independently — either variable alone reproduces
  one report and hides the other.

  WHY THE PACKAGE BREAKS ITS OWN RECOMMENDED WORKFLOW. Layout (c) is not an exotic case.
  This package ships a feature skill and a worktree agent whose whole job is to create
  worktrees, and its epic runbook drives work inside them. The standing adopter workaround
  is to skip the guardrail entirely, which is a guardrail that has been switched off for
  every adopter who followed the documented workflow.

  SCOPE LINE HELD DELIBERATELY. This AC constrains the PROOF — which layouts it runs in and
  what it asserts in each. It does not re-specify the runtime degradation prohibitions in
  BP-900g-10-i and -ii, and it does not own the sibling vocabulary lookup's silent fallback,
  which is recorded against the commit-guardian component. Both are referenced from the
  criteria only as constraints on what an acceptable fix may not do, because a fix that
  reinstates a narrower built-in list would turn every layout in this set green.
