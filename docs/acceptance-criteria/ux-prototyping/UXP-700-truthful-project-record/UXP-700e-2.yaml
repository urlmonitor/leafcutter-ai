risk_surface: internal
test_required: true
test_rationale: |
  The propagation clause is the only one that distinguishes a derived form from a second
  authored one, and it can only be tested by changing the source and re-reading the derived
  place. A test asserting the two currently match would pass today for 0 of 14 journeys and,
  more importantly, would pass tomorrow on a store where someone had simply re-copied the text
  by hand. The last clause needs a negative fixture or the rule has nothing enforcing it once
  the current duplication is removed.
test_spec:
  - name: test_shorter_form_is_produced_from_the_authoritative_description
    target_dir: unit_tests/product_truth/
    description: "The short form shown in the index is computed from the journey's own description."
    type: integration
    angle: criterion
    framework: unittest
  - name: test_changing_the_authoritative_description_changes_every_shorter_form
    target_dir: unit_tests/product_truth/
    description: "Editing a journey's description and regenerating changes the index short form, with no other file edited."
    type: integration
    angle: seam
    framework: unittest
  - name: test_a_second_authored_description_is_reported
    target_dir: unit_tests/product_truth/
    description: "A hand-authored second description for the same journey is reported naming the journey and both locations."
    type: integration
    angle: failure
    framework: unittest
notes: |
  MEASURED 2026-09-07: all 14 of 14 journeys carry a description in the index that differs from
  the description in the journey file. The index copies run 89 to 218 characters; the source
  descriptions run 365 to 938. Examples: how-acs-are-built 197 vs 938; author-product-truth 218
  vs 731; checkout-and-pay 203 vs 748.

  OWNERSHIP SPLIT, recorded so the two records are not merged. The duplication is this L1's
  (a record outgrowing its reviewers produces a shorter second copy). The divergence between
  the two copies is an internal-consistency defect and is owned by UXP-514-6 under UXP-590,
  which is where internal consistency lives. UXP-514-6 guards the copy while it exists; this AC
  removes the need for it. Both are wanted: the guard lands first and cheaply, this lands later
  and structurally.

  This is NOT UXP-700c's drift. UXP-700c is the record's agreement with the code; this is the
  record's agreement with itself, caused by growth.
