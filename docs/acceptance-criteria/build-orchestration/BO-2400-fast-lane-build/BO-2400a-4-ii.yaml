it_requirements:
  config_schema_fragment:
    fast_lane_green_gate_strict_run:
      type: object
      description: "The green gate's scoped pytest run is executed with the AC test-enforcement plugin in strict mode (AC_ENFORCE_STRICT=1 set in the child process environment), so no failure of a scoped test is downgraded to xfail."
  reference_file_path: "scripts/build_orchestration/fast_lane.py"
  n_location_rule: "1"
  required_skills:
    - python-coder
  post_write_commands: []
  constraints:
    - "Strict mode is set on the environment of the gate's own test subprocess, not inherited from the caller's shell, so the gate's verdict does not depend on how the lane was launched."
    - "The covering test must reproduce the BO-2600b-4 shape: a not-yet-done AC whose covering test fails on an assertion, run through the real enforcement plugin, and assert the gate reports it failing. A fixture that emits FAILED directly cannot detect the defect."
    - "it-po to confirm whether verify_red_baseline should also run strict. It need not for correctness, since BO-2400a-3-vi already counts xfailed as red, so this record does not require it."
delivers_to:
  agent: llm-expert
  contract: "A green verdict whose failing_tests list includes every scoped test whose failure the enforcement plugin would otherwise have downgraded."
expects_from:
