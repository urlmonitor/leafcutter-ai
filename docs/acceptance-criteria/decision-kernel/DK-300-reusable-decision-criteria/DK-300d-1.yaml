criteria: |
  Given the published categories cat-1dc11c5a2ffa7310, cat-d15d52392d7aa94c, cat-52b16c7b5a23106f, cat-d6ce5f78c181ebd1 and cat-1df63b670163b54e, all for decision type design and not limited to a component,
  And the candidate cat-73d233fc8b15c735, the staged cat-6c3eb4f2af148922 and the retired cat-40cc613f737e3323, which would also fit,
  When a design decision scoped to the component decision_kernel is framed after its findings are written,
  Then the five published categories are offered as its starting criteria before any criterion is drafted,
  And each is offered in its preferred wording and carries its category id,
  And cat-73d233fc8b15c735, cat-6c3eb4f2af148922 and cat-40cc613f737e3323 are not offered,
  And the categories are found from the reviewed records in the repository by filter and wording, without a request to the run history,
  And they reach the approval of proposals as proposals, never as approved criteria.
