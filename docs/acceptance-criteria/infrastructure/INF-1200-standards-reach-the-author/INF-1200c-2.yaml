id: INF-1200c-2
title: "A specialist that owns two kinds of file is told both, and a kind of file with two owners reaches both"
component: infrastructure
components:
  - infrastructure
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the ownership record assigns one specialist two kinds of file that carry
    different standards,
  When that specialist begins work,
  Then its material states both kinds' standards, each attributed to the kind of
    file it governs, and neither is displaced by, merged into, or overwritten by
    the other,
  And given the ownership record assigns one kind of file to more than one
    specialist,
  When each of those specialists begins work,
  Then every one of them has that kind of file's standards stated in its
    material,
  And given a specialist that owns two kinds of file of which only one carries a
    standard,
  When it begins work,
  Then its material states the standard for the covered kind of file and makes no
    statement of a standard for the uncovered one,
  And given a further kind of file is added to a specialist's ownership so that
    it now owns three, one of which shares a standard with a kind of file another
    specialist owns,
  When both specialists begin work,
  Then each is told the standards for every kind of file it owns and for no other,
    so neither the number of kinds a specialist owns nor the number of specialists
    a kind of file has changes what anyone is told about the rest.
