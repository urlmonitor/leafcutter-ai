it_requirements:
- 'Build order. TQ-500g-4 and -4-i are done first. Then -1-i. Then -1-ii and -1-iii. Then -1-iv (the preparer).
  Then the route wiring: -1-v, -1-vi, and the pair -1-vii + TQ-500f-3-iv, which ships in ONE change with
  -1-viii.'
- One runner with one CLI entry, called by every route and by the TQ-200d-1-i eval. No route and no eval
  carries a copy of the rule.
- 'Placement on every route: immediately before the commit dispatch. In the fast lane that is after verify_green_and_coverage
  and the Review phase. In /build-feature, /build-ticket and /build-epic it is after the last pre-commit
  phase. So no later step can change the code the runs judged. Never after commit.'
- Decision logic stays in Python CLIs, as with the heavy_lane_gate precedent. Each workflow JS file adds
  only a thin dispatch and a fail-closed parse. The workflow engine has no module loader, so shared JS
  helpers are not available.
- 'Composite done-proof: -1-iv and -1-vii are test_required: false. Until KI-CG-20260914-done-proof-precommit-ignores-test-required
  is fixed, the pre-commit done-proof path refuses to mark this L2 done even when every child is done.'
test_spec:
- name: test_every_route_invocation_yields_identical_runner_verdict
  target_dir: unit_tests/workflows/
  framework: pytest
  type: integration
  angle: seam
  description: The runner commands recorded from fast-lane-ship.js, build-feature.js and build-ticket.js
    (under the workflow-engine harness), plus the command the /build-epic record check (TQ-500g-1-viii)
    accepts, are executed for real against one fixture repo with K1 and K2. All produce the same verdict
    JSON.
  must_catch:
  - a route passes a different base ref
  - a route omits the AC store root
  covers:
  - TQ-500g-1
  - TQ-500g-1-v
  - TQ-500g-1-vi
test_rationale: The children carry the rule and the per-route wiring. What only this L2 promises is that
  every route reaches the same verdict. That is proven by running every route's recorded command for real
  against one fixture, never by comparing command strings.
