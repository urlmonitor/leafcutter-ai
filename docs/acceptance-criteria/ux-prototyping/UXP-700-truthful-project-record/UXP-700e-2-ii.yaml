criteria: 'Given a node''s structured contract metadata is authoritative and its human explanation precedes
  the generated contract marker,

  When the Product Truth generator runs after a field or example changes,

  Then the updated flow artifact is written with compatibility input and output labels and the generated
  narrative section derived from that metadata,

  And the authored narrative is preserved,

  And a second generation without a source change leaves the generated content unchanged,

  And the validator rejects a hand-edited compatibility label or generated narrative section that disagrees
  with the canonical rendering.'
