  notes:
    - "When git rev-parse --show-toplevel cannot resolve a repo root (not a git repo, or git unavailable), the write must not crash: fall back to the existing repo-root helper's documented non-git path and emit a WARNING that the git top-level could not be resolved."
    - "The recorded value must still be made repo-relative against the fallback root — it must never record a raw absolute filesystem path with a leading '/'."
    - "The fallback must be reached only when git cannot resolve the top-level — when git resolves a repo root the fallback is not used (no regression of ACD-1200a-14)."
    - "Error handling must follow the project policy: catch the specific failure, log at WARNING or higher, no bare/blind except."
test_spec:
