notes: |
  Satisfies GE-122d's documentation_triggers: [reference-doc]. The L1's phrasing is the
  acceptance test in miniature: "which stage can I skip and what still catches me" should be
  written down rather than folklore.

  THIRD AND LAST SECTION OF ONE DOCUMENT. GE-122a-3 writes the numbering rules, GE-122b-4 the
  enrolment table, this one the bypass rules. Three ACs, three sections, one document — chosen
  over three documents because a contributor hitting a numbering problem should land in one
  place, and because three separate numbering documents would themselves drift.

  THE CLAUSE ABOUT THE NON-BYPASS is there because GE-122d-3-i creates a genuine case where a
  commit proceeds without a success result, and an undocumented case like that reads to a later
  contributor as either a bug or an undocumented escape hatch. Naming it as neither is cheap
  here and expensive to reconstruct later.

  IT PO NOTE (2026-08-17): there is a fourth thing worth writing down that the L1 did not
  anticipate — the authoring-time stage has no deliberate bypass but CAN be silently absent. A
  PostToolUse hook that crashes, times out or cannot resolve its import emits nothing at all,
  and nothing is exactly what a clean write produces. That is the honest statement for that
  stage's row, and it belongs in the same table.
target_epic: EPIC-TheNumberingGuaranteeHoldsAtEveryStage
