# Continuous-integration gate for leafcutter-ai.
#
# Runs on every push to main and every PR targeting main. Eight jobs — six
# BLOCKING (the required status checks named in the branch-protection ruleset)
# and two informational:
#
#   lint       — ruff check over scripts/, tests/, unit_tests/ (config: ruff.toml).
#                BLOCKING. The templates/ source tree is excluded (see ruff.toml).
#
#   component-vocab — every `components` value is a canonical id in
#                docs/components.json. BLOCKING. Diff-scoped on PRs, full tree
#                on push to main.
#
#   test       — full pytest suite over tests/ and unit_tests/. BLOCKING: there
#                is no continue-on-error on this job, so a PR carrying a failing
#                test cannot merge. The build step
#                (python scripts/build.py --target-dir .) runs before pytest
#                because build.py's install_shims() creates symlinks at
#                scripts/commit_guardian/, scripts/doc_compliance/, and
#                scripts/feedback/ pointing into .leafcutter/scripts/. Tests
#                import from those paths at startup; without the build step they
#                fail at import on a fresh clone (ADR-016). The suite runs under
#                AC_ENFORCE_STRICT=1 so AC-enforcement xfail-masking is off and
#                genuinely-failing tests surface as real failures. Promoting this
#                job to blocking WAS the BP-1200b deliverable; it is done, and the
#                job name "Test suite (pytest)" is the stable contract referenced
#                by the required-status-checks list (BP-1200c) — do NOT rename it.
#
#   done-proof — proof-of-done coverage (BO-2500b). BLOCKING, diff-scoped.
#
#   ac-store-valid — the AC store passes its schema and governance hooks.
#                BLOCKING.
#
#   changelog-presence — a changelogs/ entry accompanies the change. BLOCKING.
#
#   typecheck  — mypy over the .py files changed in a PR (non-strict,
#                --ignore-missing-imports, since the codebase has no type config
#                yet). INFORMATIONAL ONLY (continue-on-error): the codebase is
#                untyped, so touching any file surfaces dozens of pre-existing
#                type errors unrelated to the change. The job surfaces type
#                findings on changed files without blocking the merge. Promote
#                to blocking once the codebase is annotated. On direct pushes
#                there is no diff base, so it is a no-op.
#
#   consumer-install-sim — empirical consumer-install simulation (AC BP-900h-1).
#                Checks the package out into a leafcutter-ai/ subdirectory (so
#                the job's default working directory holds nothing but that
#                checkout — the "scratch directory containing no files other
#                than a minimal skills_config.json" the AC's Gherkin
#                describes, once the script below writes that file), then runs
#                scripts/ci/check_consumer_install.py, which drives a REAL
#                `build.py --target-dir` into that scratch directory (never a
#                copy of this repo — copying would reintroduce the
#                source-tree bias that hid BP-900g-4/-5/-6, BP-015..BP-018)
#                and reuses the existing BP-900b-1/BP-900c-1
#                reference-resolution machinery against the deployed output.
#                All job logic lives in that one invocable script; this job
#                supplies only arguments (mirrors the constraint already
#                written into sibling AC BP-900h-6 for merge-gate tooling).
#                Runs on both push and pull_request — unlike ac-store-valid /
#                changelog-presence, this job's logic does not differ between
#                the two events, so no `if:` guard is needed; the AC's
#                requirement ("must run on pull_request, so it gates before
#                merge") is satisfied simply by not excluding pull_request.
#                INFORMATIONAL ONLY for now: this is NOT yet a required/
#                blocking branch-protection check — promoting it to required
#                is BP-900h-3 (a separate ticket, out of scope here). Do not
#                add it to any required-status-checks list until that ticket
#                lands.
#
# Dependencies are pinned in requirements-dev.txt.

name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check scripts tests unit_tests

  component-vocab:
    name: Component vocab style (components.json)
    runs-on: ubuntu-latest
    # BLOCKING. Every `components` LIST value must be a canonical id in
    # docs/components.json (underscore-case). Scope depends on the event:
    #   - pull_request : only files CHANGED vs the base (diff-scoped), so a clean
    #     PR is not failed for pre-existing drift in the base it didn't introduce;
    #     a PR that *adds* drift still has that file in its diff and is caught.
    #   - push (to main): the FULL tree, guaranteeing main never carries an
    #     off-registry value (the merge-vector backstop that pre-commit can't cover).
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history + base ref for the diff on pull_request events.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Check component vocabulary (PR — changed files only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python scripts/check_component_vocab.py --changed "origin/${{ github.base_ref }}"

      - name: Check component vocabulary (push — full tree)
        if: github.event_name != 'pull_request'
        run: python scripts/check_component_vocab.py

  test:
    name: Test suite (pytest)
    runs-on: ubuntu-latest
    # BLOCKING gate (BP-1200b): the suite is green on a fresh checkout under
    # AC_ENFORCE_STRICT=1 (build step + install_shims, then strict pytest), so a
    # PR carrying a failing test now fails this check and cannot merge. There is
    # NO continue-on-error — dropping it is the whole point of this job.
    # The job name "Test suite (pytest)" is the stable contract referenced by the
    # branch-protection required-status-checks list (BP-1200c) — do NOT rename it.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build — run install_shims to create scripts/ symlinks
        # Required before pytest: install_shims() creates symlinks at
        # scripts/commit_guardian/, scripts/doc_compliance/, and
        # scripts/feedback/ pointing into .leafcutter/scripts/. Tests
        # add those paths to sys.path at import time (ADR-016).
        run: python scripts/build.py --target-dir .

      - name: Run test suite
        env:
          # Disable AC-enforcement xfail-masking on the gate so genuinely-failing
          # tests surface as real failures (not downgraded to xfail when their
          # covering AC is not "done"). Keeps the CI signal trustworthy — a
          # prerequisite for making this job blocking (BP-1200b).
          # (EPIC-RedTestClusterRepair ticket 09.)
          AC_ENFORCE_STRICT: "1"
        run: python -m pytest tests/ unit_tests/ -q --continue-on-collection-errors

  done-proof:
    name: Proof-of-done coverage check (BO-2500b)
    runs-on: ubuntu-latest
    # Blocking gate (BO-2500b-3): diff-scoped ci-changed mode evaluates only ACs
    # changed in the PR, making this safe to require without failing on pre-existing
    # done ACs that predate the covers-tag mandate.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so git diff <base>...HEAD is reachable.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # --- JS/TypeScript toolchain (BO-2500e-6) -------------------------------
      # The oracle recognises `// covers:` tags in .ts/.tsx tests and proves them
      # by running vitest. It fails CLOSED when the runner is unavailable
      # (BO-2500e-3-i), so the JS toolchain MUST be installed here — otherwise
      # every JS-covered AC would be judged ineligible and block the merge.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: leafcutter-web/package-lock.json

      - name: Install leafcutter-web dependencies (provides vitest)
        run: npm ci --prefix leafcutter-web

      - name: Build — run install_shims to create scripts/ symlinks
        # Required before invoking check_done_proof.py: install_shims() creates
        # the symlinks at scripts/commit_guardian/ etc. so the hook's imports
        # resolve correctly on a fresh checkout (ADR-016).
        run: python scripts/build.py --target-dir .

      - name: Run proof-of-done check (CI-changed mode)
        # --test-root . scans the whole repository so BOTH Python (`# covers:`
        # under unit_tests/) and JS/TS (`// covers:` under leafcutter-web/)
        # proofs are discovered by the one gate (BO-2500e-6). Without it the
        # default root is unit_tests/, which contains no .ts files, so every
        # JS-covered AC would be reported as having no proof. node_modules/,
        # .next/ and dist/ are excluded by the scanner.
        run: python scripts/commit_guardian/check_done_proof.py --mode ci-changed --base origin/${{ github.base_ref }} --test-root .

  ac-store-valid:
    name: AC store valid
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # BLOCKING (ACS-200g). Until this job existed, NOTHING in CI read
    # docs/acceptance-criteria/ — the AC guardrails lived only in
    # .pre-commit-config.yaml, so a contributor whose local hooks were absent
    # (see setup_ticket_worktree.py, which installs shims into the main repo
    # rather than the new worktree) could merge a structurally invalid
    # acceptance criterion with every required check green. The AC store is the
    # input to the whole build pipeline, so a bad record there propagates into
    # tickets, code and sign-offs.
    #
    # Diff-scoped to the PR (ACS-200g-2): the store currently has 57 orphaned
    # children, so a whole-store gate applied per-PR would fail every
    # contributor on day one and get switched off. Touch a broken record and
    # you own it; leave it alone and it is not your failure.
    #
    # NOT YET IMPLEMENTED — ACS-200h (whole-store run on push to main as a
    # merge-vector backstop). It is deliberately omitted rather than added
    # informationally: it would be red from the first run because of those 57
    # pre-existing orphans. Land it once the store is reconciled.
    #
    # WHY THE reset --soft: these hooks read their file set from
    # `git diff --cached --name-only --diff-filter=AM` (see
    # _get_staged_ac_paths in check_ac_schema.py) and are documented fail-open
    # — with a clean index they validate NOTHING and exit 0. In a CI checkout
    # the PR's files are committed, not staged, so `git add` is a no-op and
    # invoking the hooks with file arguments silently checks nothing. Moving
    # HEAD back to the base ref makes exactly the PR's added/modified files
    # appear staged; the working tree is untouched. Verified both ways: with
    # the reset a deliberately malformed record fails the job, without it the
    # same record passes.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so the base ref is reachable for the reset.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build — deploy .leafcutter so the guardian hooks resolve
        # install_shims() creates .pre-commit-config.yaml and the
        # scripts/commit_guardian symlink, both of which the hooks below need
        # on a fresh checkout (ADR-016).
        run: python scripts/build.py --target-dir .

      - name: Stage the PR's changes so the guardians can see them
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git reset --soft "origin/${{ github.base_ref }}"

      - name: Check AC store (PR — changed records only)
        # Run through pre-commit rather than calling the scripts directly, so
        # the merge-time and commit-time rule sets are literally the same
        # config and cannot drift apart (ACS-200i). Each hook applies its own
        # files: filter, so non-AC files in the diff are ignored.
        run: |
          pre-commit run check-ac-schema
          pre-commit run check-ac-tree-limits
          pre-commit run check-ac-governance
          pre-commit run check-ac-parent-covered-by
          pre-commit run check-ac-circular-deps
          pre-commit run check-ac-pattern-refs

  numbering-guarantee-valid:
    name: Numbering guarantee valid (GE-122d-1)
    runs-on: ubuntu-latest
    # Shared-build stage for GE-122's whole-collection numbering rule
    # (GE-122d-1). This is a SEPARATE job from ac-store-valid on purpose:
    # test_acs200i_ac_gate_rule_parity.py asserts ac-store-valid runs ONLY
    # hooks scoped to the docs/acceptance-criteria/*.yaml files: pattern in
    # the manifest, and check-identifier-uniqueness is not one of them (it
    # is always_run / pass_filenames: false, scoped to the whole collection,
    # not to AC YAML files) — folding it into that job would break that
    # parity guard.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so the base ref (PR) / pre-push SHA (push)
          # is reachable for the reset below — same requirement as
          # ac-store-valid, and for the same reason (see the staging steps).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build — deploy .leafcutter so the guardian hooks resolve
        run: python scripts/build.py --target-dir .

      - name: Stage the PR's changes so a contested number is attributed (PR)
        # WHY THE reset --soft: this hook's *inspection* is genuinely
        # whole-collection and always_run: true / pass_filenames: false at
        # the pre-commit level — that half of the old comment here was
        # correct. What it missed is that the hook's EXIT CODE is not
        # whole-collection: main() (check_identifier_uniqueness.py) calls
        # _get_staged_paths() (`git diff --cached --name-only`) and, via
        # compute_commit_disposition, blocks ONLY on a finding with a
        # claimant in that staged set — every other finding is printed as
        # "reported-but-unattributed ... not blocking" and the hook exits 0.
        # In a CI checkout the PR's files are committed, not staged, so with
        # no reset the staged set is genuinely empty (git ran fine — this is
        # not the "could not be determined" fallback path) and EVERY
        # contested number, including one the PR itself introduces, comes
        # back unattributed. Moving HEAD back to the base ref makes exactly
        # the PR's added/modified files appear staged, the identical
        # technique ac-store-valid already documents for the AC guardrails
        # and the technique this AC's (GE-122d-1) own it_requirements names
        # explicitly. Verified both ways in a scratch clone: with the reset,
        # a deliberately contested ADR number introduced by the diff fails
        # the job (exit 1); without it, the same collision passes (exit 0).
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git reset --soft "origin/${{ github.base_ref }}"

      - name: Stage the push's changes so a contested number is attributed (push)
        # Same requirement as the PR step above, for a direct push to main:
        # reset to the pre-push SHA (github.event.before) so the commit(s)
        # just pushed appear staged and a contested number introduced by the
        # push is attributed rather than silently reported-but-unattributed.
        if: github.event_name != 'pull_request'
        run: git reset --soft "${{ github.event.before }}"

      - name: Check numbering uniqueness (GE-122d-1 shared-build stage)
        # Run through pre-commit rather than calling the script directly, so
        # the shared-build and commit-time rule sets are literally the same
        # config and cannot drift apart (same technique the ac-store-valid
        # job already uses for the AC guardrails, per this AC's
        # it_requirements).
        run: pre-commit run check-identifier-uniqueness

  changelog-presence:
    name: "Changelog entry present"
    runs-on: ubuntu-latest
    # Blocking release-completeness gate: fails when a PR changes releasable
    # content (files outside of changelogs/, tickets/, docs/acceptance-criteria/)
    # but adds no changelogs/*.md entry. Without this gate, releasable work can
    # merge without triggering the auto-release version bump in compute_next_version.py.
    # Runs ONLY on pull_request — on direct pushes to main a changelog entry is
    # already expected to be present (it was required before merge).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so git diff <base>...HEAD is reachable.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # No pip install step: check_changelog_presence.py is stdlib-only.

      - name: Fetch base branch for three-dot diff
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Check changelog presence
        run: python scripts/release/check_changelog_presence.py --base "origin/${{ github.base_ref }}"

  typecheck:
    name: Type-check changed files (mypy, informational)
    runs-on: ubuntu-latest
    # Informational only — see header. Surfaces type findings without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the PR base commit to diff against.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: mypy on changed Python files
        # On push events github.base_ref is empty and this becomes a no-op.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only --diff-filter=ACM "origin/${{ github.base_ref }}"...HEAD -- 'scripts/**/*.py' 'tests/**/*.py' 'unit_tests/**/*.py')
          if [ -z "$CHANGED" ]; then
            echo "No changed Python files under scripts/, tests/, or unit_tests/ — skipping mypy."
            exit 0
          fi
          echo "Type-checking changed files:"
          echo "$CHANGED"
          # --explicit-package-bases avoids "source file found twice" errors from
          # the flat sys.path-based layout (scripts/ is not an installed package).
          mypy --ignore-missing-imports --explicit-package-bases --no-error-summary $CHANGED

  consumer-install-sim:
    name: Consumer install simulation (BP-900h-1)
    runs-on: ubuntu-latest
    # INFORMATIONAL ONLY for now — see header. This is NOT yet a required/
    # blocking branch-protection check (that promotion is BP-900h-3, a
    # separate ticket). Runs on both push and pull_request: the job's logic
    # is identical either way, so no `if:` guard is needed to satisfy the
    # AC's "must run on pull_request" requirement.
    steps:
      # Checked out into leafcutter-ai/ beneath the job's default working
      # directory (github.workspace), simulating a real consumer install: the
      # scratch directory contains nothing but this checkout until the script
      # below writes a minimal skills_config.json into it.
      - uses: actions/checkout@v4
        with:
          path: leafcutter-ai

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r leafcutter-ai/requirements-dev.txt

      - name: Run consumer install simulation
        # All job logic lives in check_consumer_install.py; this step supplies
        # only arguments (mirrors the constraint already written into sibling
        # AC BP-900h-6 for merge-gate tooling). --target-dir . is
        # github.workspace itself, which holds only the leafcutter-ai/
        # checkout at this point.
        run: python leafcutter-ai/scripts/ci/check_consumer_install.py --package-dir leafcutter-ai --target-dir . --use-install
