title: "The eval suite is wired into CI as a quality gate that blocks on regression"
component: testing-quality
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: high
roadmap_phase: phase_1
criteria: |
  Given the shared runner produces an eval report for every in-scope agent's set,
  When CI runs on a change,
  Then the eval suite runs as a CI quality gate,
  And the gate fails the change when any agent's golden score drops below its
    recorded baseline,
  And the gate reports which agent and which rows regressed,
  And the gate cannot be silently bypassed (its result is required to merge).
