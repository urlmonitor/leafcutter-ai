notes: |
  USER DECISION AT THE BA GATE (Q3, 2026-09-28): YES, add a mechanical backstop.
  TQ-500f-3-iv and TQ-500g-1-vii are prompt-only, so each is only as strong as
  the supervisor's instruction-following. This AC makes skipping either gate
  observable and blocking. It fails closed: a missing, unreadable, stop or
  out-of-date verdict stops the commit.

  PLACEMENT: an L3 under TQ-500g-1 (L3s have no cap), because the commit phase
  is where TQ-500g-1's runs sit. It also guards TQ-500f-3-iv; that relation is
  recorded through depends_on and doc_links, not by a second parent.

  WHY B6. The runner's verdict is about the code it ran against. On /build-epic
  a coder retry after the runs would otherwise commit code nobody ran wrong
  versions against. The red-baseline verdict has no such rule: it is taken
  before the coder, and a later code change is expected.

  B5 IS THE CONTROL. Tickets with no source requirement must still reach
  commit, and a not-applicable record never turns into "verified" (the
  TQ-500f-3-ii K3 rule).

  FOR IT-PO — WHERE THE CHECK RUNS AND WHERE VERDICTS LIVE. The check must run
  in code on the path to every /build-epic commit and must not depend on the
  supervisor choosing to call it. Candidates: build-epic.js before or after
  dispatching the commit phase, the commit agent's precondition, or a
  commit-time hook that reads the ticket's recorded verdicts. Where the two
  prompt ACs leave their verdicts (ticket comments, frontmatter, a per-ticket
  record file) is set by TQ-500f-3-iv / TQ-500g-1-vii's IT-PO pass and must be
  readable by this check. The BA did not read source to pick one.

  TESTABILITY: behavioural. Drive the chosen surface with fixture tickets B1 to
  B6 (for example build-epic.js under the workflow-engine harness, or the hook
  against staged fixture records) and assert which tickets reach commit. A text
  search of the building-epics skill is not a proof (CLAUDE.md, Verify
  Behaviorally, Not by Grep).

  IT-PO ENRICHMENT (2026-09-28): PLACEMENT DECISION
  The check runs in a commit-time hook, scoped by a marker that build-epic.js
  writes through a Python CLI before it dispatches each ticket. The verdicts
  live as records under the worktree's git directory, written by the two gate
  CLIs themselves. Why:
    - Only the commit itself is guaranteed to run code on every /build-epic
      commit path. build-epic.js hands the whole phase sequence, commit
      included, to ticket-supervisor.
    - The marker is written by code BEFORE the supervisor starts. So the hook
      cannot be switched off by the supervisor forgetting something, and it
      stays inert on every other route.
    - Records come from the CLIs, not the supervisor. That satisfies "never
      the supervisor's account", and it gives the hook something to parse.
  Lane: python-coder (not fast lane, because it ships with the two llm-expert
  prompt ACs in one PR).

  IT-PO AMENDMENT (2026-10-14): THE THREE-STEP DESIGN ON MAIN
  On /build-epic the supervisor reaches the runner through the finish wrapper
  (TQ-500g-1-v) and passes --record <ticket-key>. finish passes it on to
  the runner unchanged, so the record is still the runner's own. finish writes
  no record itself. When the writer stops, no runner runs and no wrong-version
  record exists. The hook then blocks on "missing", and the supervisor has
  already reported the ticket blocked. build-epic.js owns recovery on resume:
  it runs recover before re-dispatching the ticket, so test-breaker never reads
  code a cut-short run left altered.
  The criteria still match: B2 to B6 are unchanged by the three-step design.
  No clause needs the BA.
  FOLLOW-UPS OUTSIDE THIS AC: depends_on does not name TQ-500g-1-v (the
  wrapper this AC extends) (BA/user to add).

  IT-PO ALIGNMENT (2026-10-21): AGAINST MAIN AT adb0c2e61
  --RECORD. Not implemented anywhere on main: wrong_version_runner.py run,
  wrong_version_gate.py finish and fast_lane.py heavy_lane_gate have no
  record option (grep of scripts/ and templates/ finds none). This AC adds it,
  per the earlier contract. Records under
  <git-dir>/leafcutter/gate-verdicts/<ticket-key>/, beside the runner's
  wrong-version-runs/ and the writer's work/<work-key>/ folders.
  STALE RECORD. finish must clear an earlier wrong_version.json before the
  writer runs; otherwise a writer stop after an earlier pass would leave a
  stale record, and only the digest would stand between it and a commit.
  RECOVER MOVED. The 2026-10-14 text ran recover per resumed ticket. That is
  wrong on this route: build-epic.js runs up to 12 ticket-supervisors in one
  worktree, and recover (and every run step) closes EVERY open journal there.
  It now runs once at the drive head, before the Planner, on every drive,
  as build-ticket.js does (no fresh-or-resumed signal exists here).
  CONCURRENCY. build-epic.js (lines 413-421) runs chunks of up to 12 through
  parallel() in one worktree. The user's -vi rule (one ticket per chunk when
  a batch owes runs, 2026-10-21) applies; the chunk step is code, so it lives
  in this AC with a discrimination test, and TQ-500g-1-vii's supervisor-side
  serial check on runs_alone is the M-2 counterpart.
  STALENESS NARROWED to code paths (extensions from file_size.checked_extensions)
  and to staged paths, per path. A single whole-tree digest would block
  legitimate commits: building-epics section 5.9 stages knowledge records
  after the runs, and a halted sibling can leave unstaged files.
  QUOTING. Every build-epic.js command quotes the root, key and ticket path
  after the twins' checks (KI-BO-20261021 must not grow).
  PACKAGE SURFACE: true. The hook's registration adds new entries to
  commit_guardian.json, which ACS-100i-8 watches, so it_requirements is the
  structured object (the earlier policy list moved under constraints).
  create-hook is the package procedure for a hook; add-agent/add-skill-to-
  package do not apply.
  CAVEAT: if the user prefers the hook's name or the record module's name
  changed, change in_scope_files with it in the same edit.

  USER DECISIONS (2026-10-22)
  Q1 (a): a resumed drive that spawns commit but no coder runs heavy_lane_gate
  once before the wrong-version sequence (TQ-500f-3-iv), so red_baseline.json
  exists for the hook; without a recorded pass the reader halts.
  Q2 (a): the build-epic.js one-ticket-per-chunk rule stays in this AC as a
  constraint, with test_build_epic_serialises_batches_that_owe_runs.
  Q3 (a): the pinned names stand: check_build_epic_gate_verdicts.py, hook id
  check-build-epic-gate-verdicts, gate_verdict_records.py, and
  <git-dir>/leafcutter/gate-verdicts/<ticket-key>/. The caveat above is closed.

  REVIEW FINDINGS (2026-10-22), applied to the technical fields
  H-1 (fail-open): a record was never tied to the ticket's own requirements,
  so a supervisor that dropped --source-ac / --ac-ids got not-applicable
  records that passed. Now open snapshots the ticket frontmatter's source_ac
  into open.json before the supervisor runs; the hook demands matching ids
  on both records and refuses not-applicable when the snapshot is non-empty;
  a marker without a readable snapshot blocks.
  H-2: the unattributed-commit message tells the committer to stage the
  marked ticket file. It prints no close command, because closing a marker is
  the drive's job (be-gate-marker-close / close-all) or a human's. The
  precommit-autofix route text changes the same way.
  Path normalisation: open stores ticket_path as repo-relative POSIX with a
  leading ./ stripped, matching how staged paths are compared.
