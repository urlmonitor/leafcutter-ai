criteria: |
  Given a phase agent that has completed and verified its sign-off per the sign-off block,
  When it reaches the end of the sign-off protocol,
  Then the protocol directs it to run the knowledge-capture step (the sign-off
    block's section 7),
  And the capture step is part of the shared block so every signing agent inherits
    it without a per-ticket instruction.
