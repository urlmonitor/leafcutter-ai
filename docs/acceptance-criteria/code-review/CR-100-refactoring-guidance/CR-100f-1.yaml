criteria: |
  Given the structural bucket and the design bucket of code smells,
  When their smell sets are combined,
  Then their union is exactly the twelve Modern smells (full breadth, none missing),
  And their intersection is empty (no smell appears in both buckets),
  So the two buckets together form a true partition of the catalogue.
