decision_type: design
question: 'Decide how to model the Leafcutter decision lifecycle in the product-truth store (docs/product-truth/flows/leafcutter/)
  so it shows end to end how a decision is formed, staged as a record, published into docs/decisions, and retrieved as precedent
  by a later run. Options: four separate flows, one per stage; one decision-lifecycle flow whose steps expand to four sub-flows;
  or another option grounded in the repository.'
