  IT-PO ENRICHMENT (2026-09-28)
  architecture-diagram-author lane, with TQ-500g-5.

  IT-PO ALIGNMENT (2026-10-23): AGAINST MAIN AT ae3a1591c
  Technical fields rewritten from the code; criteria, title, depends_on and
  readiness unchanged. Complexity S to M: the diagram has about 20 nodes
  (4 routes, the executor, 5 CLIs, the preparer, the shared reader, the AC
  store, the test database, gate files, and the backstop hook).
  MISMATCHES BETWEEN THE CRITERIA AND THE CODE (the diagram follows the code):
    M1 "with no route holding a copy of it": true of the rule. But each of the
       three JS routes and the building-epics skill holds its own copy of the
       thin dispatch block, because the engine has no module loader. The
       diagram must show that distinction rather than imply that no route code
       is duplicated.
    M2 The criteria name three readers of the shared reading. A fourth, the
       sweep's base-versus-now runs (_cs_runs through _wvr_pytest), uses it too.
    M3 The preparation step is two parts: the read-only agent test-breaker and
       the deterministic writer (TQ-500g-1-ix). The fix undone is prepared by
       the runner from git, outside the preparation step.
    M4 The criteria's /build-epic clause does not mention the backstop
       (TQ-500g-1-viii). The diagram shows it, as the earlier it_requirement
       asked.
  OQ-3, the level and parent of the diagram, decided (see below). Recommended:
  level 3 (as c3-030), parent c2-fast-vs-heavy-lane-phases.md, sequence number
  allocated at write time.

  USER DECISIONS (2026-10-23, answered directly by the user in the main
  session's AskUserQuestion): OQ-3 accepted as recommended. Level 3, parent
  docs/architecture/diagrams/c2-fast-vs-heavy-lane-phases.md, and the sequence
  number allocated with scripts/next_diagram_seq.py 3 at write time.
