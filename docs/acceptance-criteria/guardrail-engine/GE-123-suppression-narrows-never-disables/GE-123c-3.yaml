notes: |
  THE ANTI-PRECEDENT THIS CRITERION EXISTS TO AVOID. This component already
  contains a guard documented as automatically bringing in a specialist that does
  no such thing — its correction path is a placeholder that always reports success.
  A documented-but-dead correction is worse than none, because authors believe they
  are covered. Every claim in this L1 that "the author is told" rests on this
  criterion, so it must be discharged by exercising the path a real commit takes —
  the pre-commit check invoking the scanner over staged files — and asserting the
  message actually arrives there. Loading the allowlist directly and inspecting the
  message proves the string exists, not that it reaches anyone.

  THE FAIL-OPEN / FAIL-CLOSED TENSION, RESOLVED EXPLICITLY. The component's
  standing convention is that an internal problem warns and exits zero rather than
  blocking an unrelated commit, and the already-done precedent for a bad allowlist
  line is warn-and-skip. Both point the same way here, and skipping is the
  fail-closed choice on the security axis: the author immediately sees the finding
  they were trying to suppress. Blocking the commit on a cosmetic mistake in a file
  that is read on every commit is the one disposition that could make this fix
  worse than the defect.

  ONE CONVENTION, NOT TWO. The three unmatchable shapes come from three different
  fields and could each acquire their own bespoke message. They must not. The third
  arm is the guard on that, and it is written as a property of the whole file's
  output rather than of any single message.

  SCOPE. This criterion settles delivery and disposition only. Which shapes count
  as unmatchable is decided by the two sibling criteria and their edge cases; what
  the author reads afterwards is the two documentation criteria.

  IT-PO TECHNICAL ENRICHMENT, 2026-08-18. Two implementation facts the BA could not
  see, both now it_requirements. First, the enforcement point that actually gates a
  commit is the DEPLOYED scanner copy the pre-commit check resolves as a sibling of
  its own location — a fix left in templates/ alone is inert on the real path, which
  is precisely the "warning nobody receives" failure this criterion forbids. Second,
  the pre-commit check post-filters high-entropy findings for prose-prefixed paths,
  so the fixture proving the commit is blocked must use a rule that is never
  post-filtered; a high-entropy finding would make that arm pass or fail for a reason
  unrelated to the allowlist.
target_epic: EPIC-SuppressionNarrowsNeverDisables
