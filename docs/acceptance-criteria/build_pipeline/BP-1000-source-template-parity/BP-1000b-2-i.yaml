created_by: "docs/acceptance-criteria/build_pipeline/BP-1000-source-template-parity/BP-1000b.yaml"
criteria: |
  Given a source script was changed during the drive so its shipped template
    copy is now stale (the exact KI-2 scenario: the jscpd hook source gained the
    GE-100c measured%/threshold% logic and its templates/ copy was not synced)
  And that drift was, before this gate existed, found only by a post-merge
    spot-check after the downgraded copy had already shipped
  When the finalize-feature workflow runs with the parity gate in place
  Then the drift is caught at the parity gate, which fires before the PR-merge
    step
  And because the gate HALTs before the PR-merge step, the drifted copy never
    reaches main and never ships to a consumer
  And there is no execution path in which a drifted pair passes the gate and is
    discovered only after the branch has landed on main
