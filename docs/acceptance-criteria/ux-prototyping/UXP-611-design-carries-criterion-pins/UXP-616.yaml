notes: |
  THE HOUSE PATTERN, CONFIRMED BY THE USER ON GE-124 ON 2026-08-25, REUSED
  DELIBERATELY. Diff-scoping was chosen there over a dated cutoff precisely so
  that no dated population is created — nothing to size, nothing to retire,
  nothing to argue about. The same reasoning applies here without modification.
  Precedents to match rather than reinvent: check_done_proof --mode ci-changed
  --base origin/main, the diff-scoped component-vocabulary CI job, GE-111c-1,
  and GE-124e-4.

  NOT EVALUATED IS NOT A STATE — THIS IS THE CLAUSE MOST LIKELY TO BE SOFTENED
  IN IMPLEMENTATION. The tempting version emits "12 mockups pre-convention"
  for visibility. That single line recreates the dated population the decision
  removed: it can be counted, it can be reported on, it becomes a backlog, and
  someone will eventually be asked to burn it down. An untouched mockup must be
  absent, not labelled.

  THE FOURTH SCENARIO IS THE ANTI-COUNTER CLAUSE and is written as an explicit
  negative because a counter added "for visibility" is a friendly-looking
  change that a casual review would wave through.

  WHY THE THIRD SCENARIO IS SEPARATE FROM THE SECOND. A newly added mockup is
  in the diff by the ordinary rule, so it needs no exception — but stating it
  makes clear the convention applies from day one to new work while never
  reaching backwards.
