id: GE-127f-1
title: "An addition to an already-oversized file must leave it at or below the less demanding of its permitted length and its previous length minus what the change added"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a tracked file of a kind the size standard covers stands at 2,677
    measured lines before the change, against a permitted length of 400,
  And a change is staged that adds 50 measured lines to that file and leaves it
    standing at 2,628,
  When the author performs an ordinary commit,
  Then the commit does not complete, and the outcome states the length the file
    stood at before the change, the length it stands at after it, the number of
    lines the change added, and the length it is required to stand at or below,
  And given instead the same file and the same 50 added lines, with the change
    leaving it standing at 2,627,
  When the author performs an ordinary commit,
  Then the commit completes, and the file is not refused for still standing above
    its permitted length,
  And given instead the same file and the same 50 added lines, with the change
    leaving it standing at exactly the 2,677 it stood at before,
  When the author performs an ordinary commit,
  Then the commit does not complete — a change that adds to an already-oversized
    file and gives back only what it took is no longer sufficient,
  And given a tracked covered file standing at 410 measured lines against a
    permitted length of 400, and a change that adds 50 measured lines to it and
    leaves it standing at exactly 400,
  When the author performs an ordinary commit,
  Then the commit completes — the required length is the less demanding of the
    permitted length and the previous length minus the lines added, so 60 lines
    leaving the file discharges the change and 100 is never asked for,
  And given the same 410-line file and the same 50 added lines, with the change
    leaving it standing at 401,
  When the author performs an ordinary commit,
  Then the commit does not complete,
  And given the same 2,677-line file and a change that adds no measured lines to
    it and removes three, leaving it standing at 2,674,
  When the author performs an ordinary commit,
  Then the commit completes, and nothing further is required of the change,
  And given a tracked covered file standing at 380 measured lines against a
    permitted length of 400, and a change that adds 12 measured lines to it and
    leaves it standing at 392,
  When the author performs an ordinary commit,
  Then the commit completes and no line of the outcome names that file — a file
    at or below its permitted length is not in this population at all.
depends_on:
  - GE-127f
