criteria: |
  Say which work is finished -- the right workspace goes, and anything already landed is tidied for you.

  Any flow, or you, can ask for a piece of work's workspace to be cleared just by naming
  the work, the same way it was asked for in the first place. Every workspace of this
  project whose work is already fully part of the shared main line, and that holds nothing
  unsent, can be cleared in one unattended pass that never asks a question, can be
  previewed first, and reports everything it kept and why. Every flow that makes a
  workspace clears it through that same one place, so no flow carries its own way of
  deleting one -- and unsent work, other projects' workspaces and the main checkout are
  never touched.
depends_on: [BO-4400, BO-4300e]
