criteria: |
  Given the refusal limit is set to 5 GB, and the project runs under WSL where the
    Linux volume reports 200 GB free while the Windows drive holding the Linux virtual
    disk has 2 GB free,
  When a workspace is requested from the one workspace maker,
  Then the answer is a refusal that names the Windows drive and its 2 GB free as the
    reason, and also states the Linux volume's 200 GB free,
  And given the same machine with the Windows drive at 50 GB free, the answer is ready
    with no space warning,
  And given a machine that is not running under WSL, only the volume where workspaces
    are created is measured and no Windows drive is named in the answer.
