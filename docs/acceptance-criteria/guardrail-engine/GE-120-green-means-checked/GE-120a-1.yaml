it_requirements:
  - "Target is concrete: templates/scripts/commit_guardian/check_ac_parent_covered_by.py. The cannot-run branch to replace is its PRIVATE _get_derive_parent_id() fallback (~line 377), which today prints 'cannot import derive_parent_id ...; skipping check (fail-open)' and returns an ordinary success. VERIFIED 2026-08-14: this check does NOT import the shared templates/scripts/commit_guardian/_resolve_root.py that 27 other files in the family already use."
  - "The could-not-check outcome must be machine-readable INDEPENDENTLY of the exit code. GE-120a-2 permits an announce disposition that still exits 0, so exit status alone cannot carry the distinction. Callers (pre-commit, the GE-120b-4 sweep, the GE-120c-1 harness) must tell could-not-check from clean-pass without parsing prose."
  - "Declare the outcome vocabulary ONCE in a shared module under templates/scripts/commit_guardian/ that every check imports. Do not re-declare the values per check: a per-check copy reproduces the 19-instance private-root-walk pattern that GE-120b-2 exists to remove."
  - "Any new shared module a hook imports MUST be added to the build deploy manifest (deploy_map in scripts/build_phases.py). An undeployed hook dependency raises ModuleNotFoundError at hook runtime from the deployed layout and blocks every commit (CLAUDE.md, 'New Hook / Gate Dependencies Must Be in the Build Deploy-Manifest')."
  - "ADR-001 deployed/template parity: edit templates/scripts/commit_guardian/ (canonical), then run 'python scripts/build.py --target-dir .' so scripts/commit_guardian/ and .leafcutter/scripts/commit_guardian/ match. check_hook_parity enforces all four locations (config section hook_parity: runtime_dir scripts/commit_guardian, canonical_template_dir templates/scripts/commit_guardian, legacy_template_dir templates/commit-guardian, deployed_output_dir .leafcutter/scripts/commit_guardian). A template-only fix is a NO-OP in the deployed layout, which is the exact defect class this tree closes."
  - "The message must name BOTH the unreachable prerequisite AND the unverified scope (for example '6 staged files not evaluated'). Naming only the failed import is insufficient; GE-120b-1-i requires reader-actionable wording."
  - "Main-checkout behaviour must be unchanged: with the prerequisite reachable, the same staged set still blocks with the same 6 violations (the GE-118a-1 backward-compatibility precedent)."
  - "Error-handling policy: the cannot-run branch catches a SPECIFIC exception (ImportError / OSError), logs at WARNING, and converts to the could-not-check outcome. No bare except, no silent swallow (CLAUDE.md Error Handling Rules 1-3)."
test_spec:
  - name: test_ge120a1_cannot_run_emits_could_not_check_not_success
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Deployed check run out of process from a working copy with no deployed layout, against 6 violating staged AC files, reports the could-not-check value and not the ordinary success value."
  - name: test_ge120a1_output_names_prerequisite_and_unverified_scope
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Same run: the output names the unreachable prerequisite AND the number of staged files left unevaluated."
  - name: test_ge120a1_legacy_failopen_shape_no_longer_satisfies_contract
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "The observed skipping-check fail-open line followed by an ordinary success result is no longer produced by the cannot-run path."
  - name: test_ge120a1_reachable_prerequisite_still_blocks_with_six_violations
    target_dir: unit_tests/portability/
    framework: unittest
    type: behavioral
    description: "Main checkout, identical staged set: the blocked verdict naming the same 6 violations is unchanged."
test_rationale: "The observed defect is a path-resolution failure that does not reproduce when the check module is imported from the source tree, which is the layout every existing unit test for this check runs in. Coverage therefore requires out-of-process execution of the DEPLOYED check from a working copy with the source tree off the import path (the GE-120c-1 harness). An in-process test that monkey-patches the import tests a different condition, and a test that greps the source for the warning string passes on dead code."
delivers_to:
  agent: python-coder
  contract: "A could-not-check outcome value that GE-120a-2 reads to decide block vs announce."
