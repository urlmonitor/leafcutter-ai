title: "A gate becomes required only after a sustained green window"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
readiness: reviewed
priority: medium
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given a gate whose recorded history has fewer than 10 consecutive green self-host
    merges,
  When promotion of that gate to a required check is attempted,
  Then promotion is refused;
  And when the recorded history reaches 10 consecutive green self-host merges,
    promotion is permitted.
depends_on:
  - ACD-1900d
