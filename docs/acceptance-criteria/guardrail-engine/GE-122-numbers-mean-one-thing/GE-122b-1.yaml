notes: |
  "SUPPOSED TO CARRY A NUMBER" IS DECIDED HERE, AS THE L1 REQUIRED, and deliberately decided as
  DATA (a declared enrolment rule the check reads) rather than as logic. Two reasons: a fifth
  namespace must be enrollable without changing the check, and the rule has to be quotable in
  the reference document GE-122b-4 writes. If the rule lived only in code, the document would be
  a second source of truth that could drift from it.

  THE ENROLMENT DECISION FOR THE DIAGRAM NAMESPACE — the only namespace with a live opt-out
  population — is: files under the diagrams location are enrolled; component-description
  documents, decision records, index and README files are exempt. This is NOT inferred from the
  current file listing, which is the drifted state being corrected: it is inferred from the fact
  that an allocator exists for exactly the diagrams location and for nothing else.

  THE OTHER THREE NAMESPACES HAVE NO OPT-OUT TODAY and their enrolment rule is trivially
  satisfied — an acceptance criterion, a decision record and a work item cannot exist without a
  filename or identifier. The rule must still be DECLARED for them so the reference document can
  state it and so a future artifact type cannot arrive unenrolled by default. Declaring it costs
  nothing; the check will simply never fire for them.

  NEXT-FREE-NUMBER IN THE MESSAGE is what makes this a remediation rather than an obstruction,
  and it is cheap here because the allocator already exists.

  IT PO NOTE (2026-08-17): the declared rule is also where GE-122a-2's work-item IDENTIFIER rule
  belongs — that AC found that the work-item identifier is not self-evident (bare basenames over
  the real tickets/ tree produce dozens of spurious duplicates from shared epic sub-item
  prefixes). One declared rule per namespace covering both enrolment and identifier shape keeps
  the two from being stated in two places.
