id: BO-3100b-1
title: "Two steps returning identical text get opposite verdicts, because the verdict is read from the project not the reply"
component: build-orchestration
components:
  - supervisor_system
  - build_orchestration
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a step whose specialist returns the confident, well-formed reply "Waiting for the
    phase agent to complete before proceeding. I will not poll further — I'll act on the
    completion notification when it arrives",
    And the project's working state is byte-for-byte unchanged since the step began,
  When the step is judged,
  Then it is judged to have produced nothing.

  Given a second step whose specialist returns that same reply word for word,
    And the project's working state now contains changes the step did not have before,
  When the step is judged,
  Then it is judged to have produced work.

  Given a step whose specialist returns a reply that describes files it created,
    And the project's working state is byte-for-byte unchanged since the step began,
  When the step is judged,
  Then it is judged to have produced nothing, and the reply's description is not treated
    as evidence that anything was created.
