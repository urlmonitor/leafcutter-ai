    description: "Fixtures for refused-in-both, passed-in-both, could-not-inspect-in-both and the asymmetric pair are each classified, the four classifications differ, and only the asymmetric pair is an instance."
  - name: test_a_check_whose_source_reads_defective_but_runs_correctly_is_not_an_instance
