notes: |
  WHY "NEITHER THE STATUS CHECKER NOR THE CHARTERED EXECUTOR". Two cheap reroutes exist: keep
  status-checker and exempt it (re-opens the defect for a named non-specialist), or hand the
  commit to the executor as a chore (Q5 forbids it; BO-3200f-3 gets the exclusion). Both pass a
  "the closure commit lands" test.

  The status checker's own part of the closure (deciding which tickets close) is unchanged and
  not specified here; only the commit moves.

  A dispatched commit specialist has no ticket path in this step and must not wait for a person:
  GE-129c-1-i. Its audit record: GE-129c-3. A refused closure commit: GE-129c-4.

  declares_side_effect: true -- derived from "the commit specialist commits the change".

  ASSIGNMENT (BA proposal): python-coder, the store's majority owner for workflows-js edits;
  the IT PO may prefer workflow-architect.
