superseded_by: null
covered_by: []
implemented_by: []
notes: |
  Nobody asked for this record. It is the boundary that stops BO-2000g-2 being carried
  out the wrong way: by registering ticket-supervisor or a "not-a-signoff" sentinel as a
  writer so that the entries could carry a "real" id. The person rejected adding
  ticket-supervisor to any category's writers. INF-100c-5-ii forbids documenting a
  sentinel that submission does not implement. Expect nothing to change in production
  code for this record. It guards an absence, and each clause's wrong version is "someone
  added it".
test_spec:
  - name: test_not_a_signoff_is_no_writer_and_no_category_in_either_copy
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Parametrised over config/feedback_categories.yaml and templates/config/feedback_categories.yaml,
      each parsed on its own. No allowed_writers list contains not-a-signoff and no category id
      equals it, in either copy.
    proves_clause: '`not-a-signoff` appears in no category''s allowed_writers and is the name of no category'
    code_file: templates/config/feedback_categories.yaml
    must_catch:
      - not-a-signoff added to a category's allowed_writers in only one of the two copies
      - a category registered with the id not-a-signoff so that note entries could carry a real id
      - a test that parses only the source copy and never the template copy
  - name: test_neither_categories_copy_contains_the_text_not_a_signoff
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      The raw text of each copy, read separately, does not contain the substring not-a-signoff
      anywhere, including comments and header notes. Deliberately stricter than the criteria
      because INF-100c-5-ii forbids documenting an unimplemented sentinel.
    proves_clause: 'neither copy mentions `(not-a-signoff)` in a comment or note as a writer or category value'
    code_file: config/feedback_categories.yaml
    must_catch:
      - a comment in the header of templates/config/feedback_categories.yaml documenting (not-a-signoff) as a sentinel
      - a note in the source copy that mentions (not-a-signoff) as a writer value
      - a check that scans only parsed YAML values and so misses comments
  - name: test_every_categorys_allowed_writers_match_the_recorded_baseline
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Per copy and per category, allowed_writers equals a baseline kept as data in the test together
      with the origin/main commit it was taken from (ticket-supervisor is already in four categories,
      so absence is never asserted). The failure message tells a maintainer to update the baseline in
      the same change when writers change on purpose.
    proves_clause: 'every category''s allowed_writers list is identical to its list before BO-2000g-2, so ticket-supervisor has been added to none of them'
    code_file: config/feedback_categories.yaml
    must_catch:
      - ticket-supervisor added to the complete category so proxy sign-offs could submit
      - ticket-supervisor added to a different category than complete
      - a writer silently removed from a category
      - a baseline check that only asserts ticket-supervisor appears nowhere, which fails on the existing four categories
  - name: test_submission_refuses_not_a_signoff_like_any_other_unregistered_value
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      Runs templates/scripts/feedback/submit_feedback.py as a subprocess from a copied temporary
      layout (scripts/feedback/ is not tracked here), each run with its own declared sink and a TMPDIR
      inside tmp_path. Four runs: not-a-signoff as --phase and a control unregistered phase; not-a-signoff
      as --category and a control unknown category. Per pair: same exit status (non-zero), empty
      stdout, sink unchanged, and stderr identical once the offending value is masked.
    proves_clause: 'each call is refused in the same way as any other unregistered writer or unknown category, and no feedback record is written, So the value cannot become a way to file feedback, or a sentinel that submission honours'
    code_file: templates/scripts/feedback/submit_feedback.py
    must_catch:
      - submission special-cases not-a-signoff and exits 0 without writing
      - submission accepts not-a-signoff and writes a record
      - a refusal for not-a-signoff whose message or exit status differs from the control
      - a run that writes into the repository's own feedback log instead of the declared sink
  - name: test_submit_feedback_entry_point_is_live_in_the_copied_layout
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: reachability
    description: >-
      The same copied layout runs the real submit_feedback.py CLI with a registered writer
      (python-coder, complete) as a subprocess and asserts exit 0 and a printed feedback id, so the
      refusals above are known to come from validation and not from a broken layout.
    proves_clause: 'each call is refused in the same way as any other unregistered writer or unknown category, and no feedback record is written, So the value cannot become a way to file feedback, or a sentinel that submission honours'
    code_file: templates/scripts/feedback/submit_feedback.py
  - name: test_control_submission_record_is_read_back_from_the_declared_sink
    target_dir: unit_tests/feedback/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The registered-writer control run is allowed to write to its real declared sink inside tmp_path,
      and the test reads the JSONL back and finds exactly one record whose feedback_id equals the
      printed stdout. This shows the sink is real, so the no-record assertion on the refused runs is
      not vacuous.
    proves_clause: 'each call is refused in the same way as any other unregistered writer or unknown category, and no feedback record is written, So the value cannot become a way to file feedback, or a sentinel that submission honours'
    code_file: templates/scripts/feedback/submit_feedback.py
