    contract: "The sweep, its discriminating rule, and the result_use declaration's field names and semantics (absence means fact; judgement is verified by observation), so the page documents the enforced rule rather than a parallel one."
  - ac_id: BO-3200a-1
    contract: "The source-read resolver and its interface {value, outcome, source_path, looked_in, uninspectable_reason}, whose call path makes only exact-command dispatches to the chartered executor, so the way the page names for obtaining a project fact exists."
  - ac_id: BO-3100d-1
    contract: "The claim-identifier pairing mechanism and three-state report, reused unchanged for this page's permitted/forbidden rules."
  - ac_id: BO-3200f-4
    contract: "The executor reference page at docs/reference/chartered-executor.md, which this page links to for obtaining a value with no judgement requested and which links back to this page for which questions a specialist may be asked."
test_spec:
  - name: test_bo_3200a_3_page_states_the_rule_the_test_and_the_declaration
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "Assert the page's declared claim set covers: branch-on values are read at source; judgement may be delegated; the discriminating question in the no-judgement wording; the result_use field with its three values and absence-means-fact; that a judgement declaration is verified; and how to obtain a value with no judgement requested, through the executor."
  - name: test_bo_3200a_3_documented_permitted_path_completes_and_forbidden_path_is_reported
    target_dir: unit_tests/workflows/
    framework: unittest
    type: integration
    angle: seam
    description: "THE NON-DIVERGENCE CHECK. For each documented rule, construct the path it describes and exercise it under BO-3200f-1's stand-in -- executor dispatches answered through the real capture, every other dispatch failing immediately: a path the page calls permitted completes, and a path it calls forbidden is reported by BO-3200a-2's real sweep. The page's own examples are run through the arbiter it defers to."
  - name: test_bo_3200a_3_every_rule_is_bound_to_an_exercised_path
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "Each permitted/forbidden rule carries a claim identifier resolving to an exercised path, and no path is orphaned. A rule added without a path fails here rather than reading as covered."
  - name: test_bo_3200a_3_named_resolver_and_root_rule_exist
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: real_artifact
    description: "The resolver and root-resolution helper the page names are asserted to exist in the repository, so guidance on how to obtain a value does not point at something that has been renamed."
  - name: test_bo_3200a_3_page_passes_repo_doc_gates
    target_dir: unit_tests/docs/
    framework: unittest
    type: integration
    angle: deployed
    description: "The repository's real doc front-matter and component-vocabulary checks pass over the new page."
  - name: test_bo_3200a_3_executor_is_linked_not_restated
    target_dir: unit_tests/docs/
    framework: unittest
    type: unit
    angle: criterion
    description: "Assert the page links to docs/reference/chartered-executor.md and that link resolves, the executor page links back, and the page carries none of the executor's could-not-check reason identifiers or result-shape field list -- so the two pages cannot drift by restating each other."
test_rationale: |
  The parent L0 explicitly rejects "authors are instructed not to..." as an acceptable
  criterion, which means this page cannot be covered by a test that it contains the right
  instruction. The coverage that matters runs the page's own examples through the real sweep:
  a permitted example must complete, a forbidden example must be reported. That makes
  divergence between guidance and enforcement a failing test rather than a discovery.
  The claim-binding test is the anti-vacuum half — without it the cheapest way to pass the
  non-divergence check is to document one rule and leave the rest unexercised.
  Deliberately NOT covered: whether the page is clear or persuasive. Human judgement.
