id: GE-117e-1-i
readiness: draft
priority: medium
title: "When the component or AC cannot be inferred unambiguously, autofix prompts instead of guessing"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
created_by: "docs/acceptance-criteria/guardrail-engine/GE-117-code-declares-what-it-serves/GE-117e.yaml"
criteria: |
  Given a commit was blocked because a new file's module docstring does not name a
    component
  And the file's location matches more than one registered component's directory
    pattern
  When the developer invokes the guided autofix for that file
  Then the autofix does not silently pick one component
  And it presents the matching candidate components for the developer to choose
  And it inserts a component only after the developer selects one

  Given a commit was blocked because a new file's module docstring does not name a
    component
  And the file's location matches no registered component's directory pattern
  When the developer invokes the guided autofix for that file
  Then the autofix does not insert a fabricated component name
  And it reports that it could not infer the component and asks the developer to
    supply one

  Given a commit was blocked because a new public symbol does not reference an AC
  And the surrounding commit context does not supply a single unambiguous AC
  When the developer invokes the guided autofix for that symbol
  Then the autofix does not insert a guessed AC reference
  And it asks the developer to supply the AC the symbol satisfies
