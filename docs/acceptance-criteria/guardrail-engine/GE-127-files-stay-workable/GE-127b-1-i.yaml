notes: |
  WHY THIS IS NOT PARANOIA. The ratchet introduces a population that did not exist
  before — a previous length per covered file — and a population that must be
  resolved is a population that can come back empty. This repository has shipped
  guards that exit 0 having examined nothing at least four times on this surface
  alone, and every one of them shipped the same shape: an error path that yields
  an empty collection rather than an unavailability signal. GE-127b-1 without this
  floor is the fifth.

  THE POSITIVE-COUNT FORM IS THE REQUIREMENT AND THE REFUSAL IS DERIVED FROM IT.
  "Refuses when it compared nothing" and "states how many it compared" are
  different requirements. The first is satisfiable by a guard on one code path;
  the second makes the empty state unrepresentable in the outcome, so a reader —
  human, agent, or a log being grepped — can tell a run that compared everything
  from a run that compared nothing without knowing which branch was taken.
  Implement the second and derive the first from it.

  THE TWO UNRESOLVABLE SITUATIONS MUST BE DISTINGUISHED BY NAME, NOT MERELY BOTH
  REFUSE. They are: the previous-length source could not be reached at all; and it
  was reached and what it returned could not be interpreted. Those are two
  different facts about the world and they demand two different responses — a
  broken environment, and a source that resolves but carries content that cannot
  be read. Collapsing them into a shared message costs the reader the only
  information that separates them. Those two exhaust the refusing set; nothing
  else here refuses.

  A HISTORY HOLDING NO COVERED FILE IS NAMED BUT DOES NOT REFUSE — THE CORRECTION
  OF 2026-09-01, AND DO NOT "RESTORE" THE STRICTER READING AS A FAIL-OPEN FIX.
  This record originally counted a successfully-established source holding no
  covered file at all as a third REFUSING situation. That clause deadlocks a fresh
  repository, concretely: if the history holds no covered file, the first commit
  that adds one is refused — and the history can never come to hold one, because
  the commit that would put it there is precisely the commit being refused. The
  only escape is bypassing the gate, which is worse than not having the gate. This
  package installs into arbitrary consumer projects, so "the history holds no file
  of a covered kind yet" is an ordinary day-one state, not evidence of a broken
  lookup. It was also a live contradiction in the store: GE-127b-1's fourth arm
  requires a commit adding one under-limit covered file to a history holding none
  to COMPLETE, and both records' tests build the identical fixture, so no
  implementation could satisfy both. The empty history therefore COMPLETES — and
  it is still NAMED in the outcome, distinctly from both refusing situations,
  because "the history holds nothing of a covered kind" and "the lookup broke" are
  different facts and telling them apart is the entire point of this record. It
  stops refusing; it does not become silent.

  THE BOUNDARY WITH THE CENSUS PATTERN THIS BORROWED FROM, STATED SO IT IS NOT
  RE-CROSSED. BP-100n-4-ii's rule that a successfully-empty result carries the same
  epistemic weight as a failed lookup is correct THERE and wrong HERE, and the
  difference is what an empty population is evidence of. A CENSUS enumerates things
  that must already exist — gate scripts on disk, registry entries — so a count of
  zero is not a fact about the world but a symptom that the enumeration is broken,
  and refusing is the only safe reading. A RATCHET compares against whatever
  history happens to hold, and a history holding no covered file yet is a
  determinate, unremarkable, self-correcting fact that the very next commit
  changes. The discriminating question is whether a count of zero could be true of
  a HEALTHY system: for the census it could not; for this ratchet it is true of
  every fresh install. Import the census's verdict VOCABULARY and its exit-status
  contract — those transfer unchanged — but not its treatment of emptiness.

  TWO STATES COMPLETE AND NEITHER MAY BE FOLDED INTO THE REFUSING SET. First, the
  source is established and holds no covered file at all — the empty history above.
  Second, the source is established and populated, and the particular commit stages
  only newly added covered files, so there is nothing to compare on this run. Both
  COMMIT, and both stay visible in the outcome through the stated count and,
  for the first, through its own named situation. What refuses is the SOURCE being
  unavailable — unreachable, or uninterpretable — never a history or a commit
  having nothing to compare against. Keeping both outside the refusing set is what
  keeps this record consistent with GE-127b-1's fourth arm.

  NAMED MUTATION — MANDATORY, EXECUTE IT, DO NOT MERELY DESCRIBE IT. The clause
  beginning "in neither of those situations is any file reported as not having
  grown" asserts an absence, and on any implementation that reports nothing it is
  green on arrival — which is today's implementation exactly. MUTATION: make the
  previous-length lookup yield an empty collection on error rather than raising or
  returning an unavailability signal. That is the ordinary fail-open shape and the
  one all four cited precedents actually shipped. Under the injection every file
  compares against nothing, the run states zero files compared, and the commit
  completes; this clause must go RED, and it must fail BY THE COMMIT OUTCOME as
  well as by the text, then return to green on revert. Requiring failure by the
  outcome is deliberate: a check that prints a worried message and then lets the
  commit through is indistinguishable from a passing one to everything downstream
  of it.

  ASSERT THE STATED COUNT BY VARIATION, NEVER AGAINST A LITERAL. Vary the number
  of covered files staged between two runs and require the stated compared-count
  to move with it. A fixed expected number satisfies a stated-count requirement
  while proving nothing about what was examined — which is the same defect one
  level up, and is how every one of the cited precedents passed its own tests.

  EXERCISE THE UNAVAILABLE STATES FOR REAL. Make the lookup genuinely unavailable
  at run time — absent, unreadable, or present and not interpretable — and make
  the empty state genuinely empty. Never assert that an error branch is present in
  the source: a source assertion stays green on precisely the fail-open
  implementation this record exists to forbid.

  ONE SUMMARY, NOT TWO. Whatever the run states about how many files it compared
  belongs in the single outcome the author already reads. A second summary printed
  elsewhere lets one of them report a determinate run while the other reports an
  empty one, and the reader has no way to know which is authoritative.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect.
