title: "Sequence diagram update: command steps go to the command-step-runner, and a declined step has its own halt path"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the fast-lane sequence diagram after BO-2400f-5-i and BO-2400f-5-iii are built,
  When a reader follows it,
  Then every command step — resolve, producibility, claim, context bundle, release, and
    any changelog, commit, push or pull-request step an agent is asked to do — is shown
    as a message from the workflow to the command-step-runner, carrying the target
    workspace's location, branch and criterion id, and returning either a result with
    an exit status or a decline,
  And test-writer, coder and pr-reviewer are shown as their own participants, not as the
    command-step-runner,
  And a declined step is shown as its own halt path, distinct from the claim-contention
    and gate-failure halt paths, naming the step, the agent and the reason,
  And the diagram shows that a decline before the claim ends the run with no release,
    and a decline after the claim is followed by a release sent to the
    command-step-runner before the run ends.

  Given the same diagram,
  When it is compared with the lane,
  Then no command step is shown going to status-checker, python-coder or worktree-agent.
