notes: >-
  Evidence, observed 2026-09-14: the remedy this repository currently recommends points a
  workspace's supporting material at the SHARED install tree. When the branch is behind the
  main line, two checks then refuse the commit over files the commit never touched -- both
  cleared once the main line was merged in, confirming the refusal was about the borrowed
  material and not the work. The refusing check's own suggested remedy is to rebuild, which
  is KI-BP-016 and would deploy an unmerged branch's material over the live shared install
  that other concurrent sessions are reading. So there are two harms from one cause and both
  belong here: a FALSE REFUSAL against the author, and CROSS-SESSION DAMAGE from the
  documented cure. Polarity warning for decomposition: this is a check that wrongly FIRES.
  BO-1700's whole family is about a check that wrongly stays SILENT. BO-1700h's "a stale
  workspace is flagged rather than trusted" is the opposite reading of the same word and
  must not be cited as covering this. Distinct too from BO-1700e (the guard working across
  layouts) and BO-1700f (standing aside where a project genuinely has no checks, which is a
  true negative, not a false positive).
