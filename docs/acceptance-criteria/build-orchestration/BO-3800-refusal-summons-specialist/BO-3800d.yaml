criteria: |
  No endless loop and no quiet pass — a file that stays stuck is reported.

  If the file still does not meet the standard after the specialist has worked
  on it, the attempt is not repeated without end and the work is not waved
  through anyway. It stops, and reports what was asked for, what was done and
  what is still outstanding, so a person can decide what happens next.
