title: "Known limitation: a branch off the LAST step does not synthesize a diamond"
component: ux-prototyping
level: L3
status: active
req_status: draft
work_status: not_started
criteria: |
  Given a flow whose conditional branch forks off the LAST ordered step
  (there is no subsequent step for the "else"/happy path to fall through to),
  When the graph for that flow is drawn,
  Then the current build does NOT synthesize a decision diamond for that trailing fork,
  And a fork with no happy-path successor step is therefore not drawn as a diamond.
