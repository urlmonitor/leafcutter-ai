readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given every workflow script, supervisor runbook, skill and agent definition shipped by the
    package,
  When the committer inventory check runs,
  Then it lists every step that issues a commit or dispatches an agent to commit, each with the
    agent that issues the commit,
    And the list contains at least the fast lane's commit step, ticket-supervisor's commit phase
    and finalize-feature's closure step,
    And it fails, naming the step and the agent, for every step whose commit is issued by an agent
    other than the commit specialist,
    And adding one such step to one shipped workflow adds exactly one named failure.
