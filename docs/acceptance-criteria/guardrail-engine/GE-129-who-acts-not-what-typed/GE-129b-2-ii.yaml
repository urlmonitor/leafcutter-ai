id: GE-129b-2-ii
title: "A git command whose subcommand cannot be read from its text is refused with that reason, not let through unnoticed"
component: guardrail-engine
components:
  - commit_guardian
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given identity enforcement in force, a staged change, a subagent named python-coder, and each of
    these commands, whose git subcommand is not written literally in the command:
    (a) `SUB=commit; git $SUB -m "x"`,
    (b) `git "$(echo commit)" -m "x"`,
    (c) `xargs git < args.txt`,
  And, for contrast, `SUB=status; git status` whose subcommand is written literally,
  When each is issued,
  Then (a), (b) and (c) are each refused, no commit is added, and each refusal quotes the command
    and states that it could not be ruled out as a commit,
    And the contrast command runs and is not refused.
