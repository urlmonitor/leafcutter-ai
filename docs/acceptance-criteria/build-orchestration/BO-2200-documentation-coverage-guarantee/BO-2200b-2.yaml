assigned_agent: python-coder
estimated_complexity: M
it_requirements: |
  The verifier inspects the ticket's git diff and asserts a real doc-file change exists
  for each required doc. A missing required doc yields status: blocker (not a warning).
  The list of required docs comes from the Agent Contracts brief (BO-2200c), keeping a
  single source of truth for what must exist.
