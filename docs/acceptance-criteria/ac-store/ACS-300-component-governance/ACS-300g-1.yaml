id: ACS-300g-1
title: "Each backfilled component entry satisfies the minimum schema"
component: ac-store
level: L2
status: active
readiness: approved
priority: medium
req_status: active
work_status: todo
criteria: |
  Given docs/components.json receives a new component entry for a subsystem
    (e.g. id: "supervisor_system"),
  When the entry is validated by check_components_integrity.py,
  Then it contains all required fields:
    id (string, snake_case),
    name (string),
    type (one of "infrastructure", "utility", "orchestration", "coding",
          "review", "documentation", "analysis"),
    description (string, >= 10 characters),
    status (one of "active", "reviewed", "planned"),
    and primary_code (array of >= 1 path string).
  And detail_ref is either a valid path to an on-disk Markdown file
    or null (indicating no architecture doc exists yet).
