criteria: |
  Project-adaptive agent generation — zero-config language specialists.

  When a build runs, the system discovers what your project uses — programming
  languages, frameworks, and data stores — and provisions a specialist agent
  for each, pre-loaded with behavioral best practices for that ecosystem.
  Detection is reliable and repeatable, generation covers all paradigms
  including non-relational databases, and the pipeline is clearly documented
  so you can understand and extend it.
