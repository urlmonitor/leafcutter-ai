criteria: |
  Routine lookups and routine chores get done, not requested.

  When the automation needs to read something already recorded in your project, or
  carry out a mechanical chore such as noting what it did or tidying up after
  itself, it does that itself. It no longer depends on a specialist agreeing to do
  a favour outside that specialist's remit, so a run can never be stopped by a
  polite and entirely correct refusal to do housekeeping.
