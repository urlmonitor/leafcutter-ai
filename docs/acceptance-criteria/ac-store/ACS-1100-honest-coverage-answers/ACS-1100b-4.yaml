notes: |
  WHY THIS IS NOT ALREADY IN ACS-1100b-1. ACS-1100b-1 requires every exclusion to
  carry a ground and rules that a ground outside the published list counts as no
  ground. It does not say what is on that list beyond four entries recorded in
  ACS-1100b's notes (deprecated, superseded, non-AC YAML, outside the requested
  scope), and the list itself is written by ACS-1100e-1, which has not been built.
  Grandfathering is therefore not currently forbidden — it is unaddressed, and the
  next author writing the list could admit it in good faith as a fifth ground. This
  criterion closes that door before the list is written. It adds one entry to the
  NEGATIVE side of the list and changes nothing else in ACS-1100b-1.

  WHY AGE IS DIFFERENT FROM SCOPE, stated so the two are not conflated. "Outside
  the requested scope" is a claim about which records a run looked at; it is
  self-limiting, because the excluded records stay unexamined and keep showing up
  in the count. "It pre-dates the rule" is a claim about which records the rule
  applies to; it is permanent, it shrinks the governed population rather than the
  examined one, and the excluded records never reappear. The first keeps the
  denominator honest, the second quietly redefines it. That is the whole distinction
  this record exists to fix in writing.

  DIFF-SCOPING IS NOT THE DEFECT AND IS NOT REPEALED HERE. The AC-store CI job
  states the product decision plainly (ACS-200g-2): a whole-store gate applied per
  pull request would fail every contributor on day one and be switched off. Nothing
  in this criterion requires a per-change validator to widen its scan. It requires
  the validator to say how wide its scan was. Read together with ACS-1100c-1, a
  scoped run that declares its scope and reports both totals reconciles and does not
  halt; it is the run that says nothing about the 44 that halts. The measured
  observation behind that decision has drifted and should be re-cited when used:
  the CI comment says 57 orphaned children; scan_ac_orphans.py reports 53 on
  2026-08-25.

  ADJACENT, NOT DUPLICATED.
    - ACS-200h owns the separate whole-store re-check on the protected branch, and
      is honestly open (work_status todo, covered_by empty), by the same stated
      reasoning. This criterion does not overlap it: ACS-200h widens a scan, this
      one constrains what a narrow scan may claim.
    - GE-120a-4 deliberately carves the empty-scope commit-time run OUT of its rule
      ("an invocation given no targets at all ... still reports an ordinary pass").
      That carve-out is correct for its subject and is exactly why the diff-scoped
      case needed a home somewhere else. This is that home.
    - TQ-400a (whole-store done-proof sweep), GE-122a-1 and GE-122d-3 (whole-
      collection numbering pass) and BP-1500a (whole-artifact-set build drift) are
      four further surfaces that each widened a scan for themselves. They are
      instances of the standing contract, not competitors to it; cite them, do not
      fold them in.

  THE NON-DUPLICATION RULE STILL HOLDS. docs/components.json is cited here as the
  binding grounding failure because the component registry is governed by ac-store
  records (ACS-300), so the grounding stays in-component as ACS-1100's notes
  require. Repairing the 36 entries is owned by ACS-300h-1 and ACS-300i-2 and is
  not a completion condition for this criterion.
