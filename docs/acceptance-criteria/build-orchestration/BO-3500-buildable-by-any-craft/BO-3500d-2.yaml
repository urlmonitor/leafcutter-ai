  - path: docs/how-to/fast-lane-build.md
    relationship: related
    status: exists
    relevance: "The report's reasons must use the same vocabulary an operator meets in a refusal, or the standing view and the individual refusal will describe the same situation in two languages."
assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "ONE REASON VOCABULARY FOR THE STANDING VIEW AND THE INDIVIDUAL REFUSAL. Group by the SAME reason codes the run emits: `unresolvable_craft` (BO-3500a-2), `capability_gap` (BO-3500a-3), `no_proof_defined` and `proof_unavailable_here` (BO-3500c-4), `unclassifiable` (BO-3500d-2-i). Two vocabularies means the report and the refusal describe the same situation in two languages, and an operator cannot connect them."
  - "NAME THE SPECIFIC CRAFT OR KIND, NOT THE CATEGORY. '440 requirements need a craft you do not have' is a fact; '463 need the prompt craft' is a decision. The group key carries the craft id or the kind value, not just the reason code."
  - "EXACTLY ONE GROUP PER REQUIREMENT, chosen DETERMINISTICALLY by a stated precedence when a record has two reasons. Never double-counted (which overstates the problem and discredits the report) and never dropped (which hides work). The precedence must be data, stated once, so the same store yields the same grouping on any day."
  - "THE ADD-UP INVARIANT IS AN ASSERTION IN THE CODE, NOT ONLY IN A TEST: sum of group sizes == the unbuildable total. It is the only check that catches the commonest reporting bug."
  - "ORDER LARGEST FIRST WITH A DETERMINISTIC TIE-BREAK, so the report is diffable across days and 'the single change that would unblock the most work' is stable rather than shuffling between equal groups."
  - "THIRD SCENARIO IS THE POINT OF THE WHOLE L1 and is testable in exactly the shape BO-3500a-3's second scenario is: run the same store against two different rosters and assert the report changes with nothing else changing. It is the only assertion here that proves the figure tracks reality rather than being computed once and cached."
  - "NO PRESENCE-ONLY ASSERTIONS. Every test produces a real report over a fixture store and reads the returned groups."
delivers_to:
  agent: python-coder
  contract: "groups: [{reason_code, subject: <craft id or kind value>, count, ac_ids?}], ordered by count descending with a deterministic tie-break, summing to the unbuildable total. Consumed by the report structure of BO-3500d-1 and read by the operator as a work list."
expects_from:
  ac_id: BO-3500d-1
  contract: "The single store-reading pass, the shared not-yet-done predicate, and the unbuildable total the group sizes must sum to. Grouping must add no second read (BO-3500d-1-i)."
