title: "Tests are written before code, by default"
component: ticket-creation
level: L1
status: active
req_status: draft
work_status: todo
criteria: |
  The build sequence always starts with test-writing unless explicitly overridden.

  When work begins on a requirement, the test-writer agent is dispatched first.
  Code-writing agents cannot start until test-writer has signed off. The only
  exception is when the technical reviewer explicitly marks a requirement as
  "tests-after" — and that exception is visible in the requirement's state.
