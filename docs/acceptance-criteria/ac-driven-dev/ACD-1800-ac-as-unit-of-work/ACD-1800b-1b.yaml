  - "The recipe must instruct the responsible craft to write the per-deliverable sign-off onto the AC record in the exact shape ACD-1800b-1a defines (spec-parity, not code-import: skill prose and schema mirror the one normative definition in docs/reference/ac-schema.md)."
  - "Supersession, not extension: rewrite the skill's ticket-body sign-off recipe (the §2 / §2c Sign-offs-on-the-ticket clauses that implement ACD-400b-4) so sign-offs live on the AC. Preserve dual-write during the ADR-026 cutover window; do not leave the ticket-body path to silently drift."
  - "The recipe must instruct crafts to leave sibling deliverable slots untouched, and to record a not-applicable resolution with who + why (the craft-facing half of ACD-1800b-2-i)."
  - "No new executable behaviour is authored here (prose surface) -- see test_required."
