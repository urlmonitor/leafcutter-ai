id: GE-123e-5
components:
  - commit_guardian
title: "The commit-guardian reference describes the feedback-id check, its refusal and its merge relief, and says no message switches it off"
component: guardrail-engine
level: L2
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given the commit-guardian component reference a reader consults to learn what
    each commit check does,
  When a reader looks up the feedback-id check,
  Then one section of the reference says which ticket changes the check judges,
    namely a sign-off heading that the commit adds to a ticket file,
  And it says what the check requires: a feedback-id line beneath that heading,
  And it says that a commit made by a person and a commit made through the shared
    commit step get the same verdict,
  And it says how a real id is obtained by pointing at the sign-off skill's
    section §2a, without restating a second procedure,
  And for an entry that signs nothing off it points at the sign-off skill's one
    documented value, "feedback-id: (not-a-signoff)", and gives no other,
  And it says that nothing in a commit message, the current one or any earlier
    one, switches the check off,
  And it describes the merge relief: while a merge, revert or cherry-pick is being
    concluded, a heading identical to its copy on either side of that operation is
    not judged, a heading added or changed during the resolution is judged, and
    when the incoming side cannot be read the check announces that it could not
    verify the sign-offs.

  Given the agent templates, skills and command prompts the project ships to
    consumers,
  When they are searched for the token "[NO-FEEDBACK-CHECK]",
  Then none of them tells a reader to put it in a commit message,
  Because a reference or prompt that still offers the dead escape hatch sends its
    reader down the same dead end the refusal no longer offers.
