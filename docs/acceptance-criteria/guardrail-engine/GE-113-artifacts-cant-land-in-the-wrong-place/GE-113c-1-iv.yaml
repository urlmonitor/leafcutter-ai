id: GE-113c-1-iv
components:
  - commit_guardian
title: "Every guard obtains the project root through one shared resolver so the wrong-root bug class cannot recur"
component: guardrail-engine
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given multiple pre-commit guards each need the project root, and a single
    shared root-resolution helper (scripts/commit_guardian/_resolve_root.py,
    resolving via `git rev-parse --show-toplevel` with a documented safe
    fallback) exists per GE-113c-1,
  When check_components_integrity, check_doc_frontmatter, check_secrets, and any
    future guard obtain the project root,
  Then each guard obtains the project root exclusively through that one shared
    helper,
  And no guard re-derives the project root via
    Path(__file__).resolve().parents[N], via following the .leafcutter symlink
    to the workspace parent, or via its own bespoke resolver duplicated from the
    shared one,
  And a new guard added later that needs the project root reuses the same
    shared helper rather than introducing its own resolution mechanism, so this
    wrong-root bug class cannot recur.
depends_on:
  - GE-113c-1
doc_links:
  - path: scripts/commit_guardian/_resolve_root.py
    relationship: describes
    status: exists
  - path: scripts/commit_guardian/check_doc_frontmatter.py
    relationship: describes
    status: exists
  - path: scripts/commit_guardian/check_secrets.py
