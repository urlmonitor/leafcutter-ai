  - "Two surfaces, two agents, one record — deliberately NOT split. The diagram is Markdown
     and is authored by architecture-diagram-author; the conformance test is Python under
     unit_tests/docs/ and is authored by test-writer, which the test_spec routes in. The
     mixed surface is resolved by the generator's own agent map, so an AC split would buy
     nothing and would orphan the test from the artifact it checks."
  - "The test must locate the diagram by CONTENT, never by a hard-coded filename: the unique
     file under docs/architecture/diagrams/ whose frontmatter diagram_type is 'sequence' and
