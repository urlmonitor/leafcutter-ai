readiness: approved
priority: medium
title: "Each stage's AC output is committed to git before the workflow advances to the next stage"
component: ac-driven-dev
level: L1
status: active
req_status: active
work_status: in_progress
criteria: |
  Given the /plan-feature workflow dispatches authoring agents in stages
    (product owner, business analyst, technical planner, test designer) with user
    confirmation gates after the product owner and business analyst stages and a
    final gate after the test design,
  When a stage's output is approved — by the user at its confirmation gate, or
    automatically for the technical planner's stage once its requirement rule
    check passes — or the user approves the batch at the final gate,
  Then all AC YAML files created or modified during that stage are committed
    to git before the next agent is dispatched (or, at the final gate, before
    the run reports success),
  And each commit includes only the AC files from the completed stage,
  And each commit message identifies the workflow run and stage,
  And if the commit fails, the workflow does not advance to the next stage,
  And if the user cancels at a gate, no commit is made for that stage's output.
depends_on: [ACD-300, ACD-300b, ACD-300c]
