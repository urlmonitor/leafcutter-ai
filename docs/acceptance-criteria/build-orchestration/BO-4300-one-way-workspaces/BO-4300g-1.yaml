notes: |
  ORIGIN: user request via /plan-feature, 2026-10-23. KI-BO-20260921 defect 3: the removal gate
  in the workspace agent's own instructions proceeds on any "yes" it can see. Twice a fast-lane
  run acted on the parent session's cleanup instruction. The fast lane's own route is closed
  (its workspace step now goes to a single-command agent), but the gate itself is unchanged and
  still reachable from plan-feature and finalize.

  "Authorization" here means a field of the dispatching workflow's own request, naming the exact
  workspace and branch. Text from anywhere else -- the parent conversation, an earlier message,
  the agent's own earlier reply -- is not authorization (BO-4300g-1-ii).

  BA ASSUMPTIONS, for IT PO to confirm or replace:
  - The KI says not to fix this by adding "ignore unrelated instructions" to a prompt. So the
    proof must run the agent's removal path against a synthetic parent context that contains a
    destructive instruction, in a throwaway clone (per the KI's reproduction note). It must not
    grep the agent's instructions. Choosing the mechanism -- a mechanical guard on the removal
    command, or a live agent evaluation -- is IT PO's decision.
  - A removal-capable agent is any agent whose registered abilities include removing a
    workspace or deleting a branch. Today that is the workspace agent.

