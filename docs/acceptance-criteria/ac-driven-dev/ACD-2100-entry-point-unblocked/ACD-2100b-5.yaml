id: ACD-2100b-5
components:
  - ac_driven_dev
  - agent_registry
readiness: reviewed
priority: medium
title: "The startup check reads the registry through an exact command instead of asking an agent to judge it"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
criteria: |
  Given an environment in which no party can be asked to judge anything -- the only
    party that can be dispatched is one chartered to carry out an exact command and
    return its output verbatim, whose charter admits every exact command so it has
    no grounds to decline one, and which treats whatever it receives as a literal
    command and so gives no answer to a request to look, decide, interpret or
    summarise; every dispatch attempt to any other party fails immediately with a
    transport error,
  And an agent registry that is present readable and lists the agent the route
    uses to create the authoring worktree with permission to run repository
    commands,
  When a run starts and reaches the startup check,
  Then the check completes with the permitted verdict and the run proceeds past it,
  And every dispatch the run's record attributes to the check went to that chartered
    party and carried an exact command, and none was addressed to any other party,
  And repeating the run with every party dispatchable reaches the same verdict, and
    the dispatches the run's record attributes to the check are again only exact
    commands to that chartered party.
depends_on: [ACD-2100b, BO-3200f-1, BO-3200f-1-i, BO-3200f-2]
