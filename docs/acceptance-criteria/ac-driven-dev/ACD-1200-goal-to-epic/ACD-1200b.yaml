criteria: |
  Before generating tickets, the system reports which ACs under the goal are not yet approved.

  If any ACs in the tree have readiness below approved, the command surfaces
  a count and offers to dispatch IT PO v3 for review and enrichment. You
  choose whether to proceed with only the approved subset or to bulk-review
  the rest before generating the epic.
