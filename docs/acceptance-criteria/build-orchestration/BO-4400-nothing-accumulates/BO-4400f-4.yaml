criteria: |
  Given scratch handling (BO-4400f-1, BO-4400f-1-i, BO-4400f-1-ii, BO-4400f-2,
    BO-4400f-3, BO-4400f-3-i) is in place,
  When a person reads the reference page for scratch and durable records,
  Then the page names the one designated scratch location and the label every item
    there carries (owning run, creation time),
  And the page states the age and ownership rule in full, including that an active
    run's scratch never expires, and the setting and default for the age limit,
  And the page lists the locations treated as durable (logs, test results, evidence)
    and states that nothing in them is ever removed by end-of-route deletion or the
    sweep,
  And the page lists the test-runner settings that keep scratch out of durable
    folders and retain it only for failed tests,
  And the page lists the third-party leftovers the rule also expires, including the
    commit-check tool's change-stash files.
