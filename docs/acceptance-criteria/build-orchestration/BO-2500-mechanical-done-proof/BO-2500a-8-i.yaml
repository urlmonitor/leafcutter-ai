notes: |
  Wave 1 of the done-proof remedy (user decision 2026-10-24 "plan both waves";
  scope confirmed at the PO gate 2026-10-25). Defect 1 of the brief: the done side
  (BO-2500a-1-ii) refuses a test-free declaration with no reason, while the
  authoring side accepts it. Today the commit-time record check only rejects an
  approved leaf code record that has neither test_spec nor test_required false; it
  never asks for the reason (validate_test_contract in
  scripts/commit_guardian/_ac_schema_validators.py, mirrored under templates/).

  User decision 2026-10-25 (IT PO stage): the refusal lives in check-ac-schema
  only, on records being written or changed. No JSON-schema if/then rule; the
  schema gets only a clearer test_rationale description; the whole-store baseline
  test is unchanged.

  Unasked-for clause, kept deliberately: "a stored record ... is not refused by
  that commit". Without it the rule could be built as a whole-store sweep, and the
  96 todo + 3 in_progress records still lacking a reason (measured 2026-10-25)
  would block every commit until BO-2500a-8-iv is finished. The refusal is on
  change, so the backfill can proceed record by record.

  The planner's instruction wording is a separate record (BO-2500a-8-ii,
  llm-expert) because it is a different craft and a different proof kind
  (BO-3500c-2-iv, prompt).

  Wave 2 (BO-2500f-1) adds a typed verification record on top of this reason; it
  does not remove this rule.
