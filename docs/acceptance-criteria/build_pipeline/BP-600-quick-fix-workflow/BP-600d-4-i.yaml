notes: |
  Amendment provenance (2026-08-24): amended in place, not superseded, per
  docs/how-to/ac-traceability-store.md.

  Why a PR became mandatory rather than optional: after BP-600f, /quick-fix
  never operates on main. The branch it works on is always a feature branch,
  and main is PR-only under the require-ci-lint ruleset, so nothing the
  workflow produces can land without a PR. "Push and leave it" is no longer a
  complete close — it is an unfinished one. The confirmation gate is what keeps
  that from becoming an unattended outward-facing action.
