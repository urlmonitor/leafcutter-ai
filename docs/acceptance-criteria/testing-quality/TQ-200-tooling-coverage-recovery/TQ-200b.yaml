criteria: |
  Tests protect the audit report, the agent-selection rules, and the agent
  diagram from silent breakage.

  The tools that run the package audit and format its report, evaluate the
  selection criteria that decide which agent fits a task, and generate the agent
  map are covered by tests. A change that corrupts the audit output, mis-evaluates
  a selection rule, or breaks the diagram is caught by a failing test rather than
  discovered by surprise later.
