it_requirements:
  - "Must preserve every pre-existing entry of each template's frontmatter skills: declaration (skill_id, mode and condition unchanged); only the knowledge-query entry is added or corrected"
  - "Must change only the frontmatter skills: declaration of the three templates; the template body is not touched by this record"
  - "Each frontmatter must stay valid YAML and pass the build's ability-reference check, with knowledge-query resolving to the packaged skill at templates/skills/knowledge-query/SKILL.md"
  - "skills_invoked in config/agent_registry.json is derived: it must come only from the transform-agent-registry commit hook regenerating it from the template declarations, and the regenerated registry is committed together with the template change; config/agent_registry.json is never hand-edited and no record carries skills_used (registry_validator refuses it and stops the build)"
delivers_to:
  agent: llm-expert
  contract: "For the sibling llm-expert records that add the knowledge-query instructions to each template body (ACD-300e-2 product-owner.md, ACD-300e-3 business-analyst.md, ACD-300e-4 it-po.md): the frontmatter skills: list of templates/agents/<name>.md holds { skill_id: knowledge-query, mode: conditional, condition: <non-empty string> }, and the config/agent_registry.json entry with that id carries the same object in its derived skills_invoked list and no skills_used key"
expects_from: null
test_required: false
test_rationale: >-
  No test is written: this is a prompt-only change to three template skills: declarations, and
  each outcome is already enforced by existing gates. The transform-agent-registry pre-commit hook
  (scripts/commit_guardian/transform_agent_registry.py) regenerates each record's skills_invoked
  from the template's skills: declaration with the same skill_id, mode and condition, and drops
  skills_used; the build's first phase, self-description validation
  (validate_agent_self_description in scripts/build_phases_agent_validation.py, run by
  scripts/build.py with self_description_enforcement error), stops the build when a skills_invoked
  skill_id does not resolve to templates/skills/<id>/ or config/skill_registry.json. Before the
  build phases, scripts/build.py runs registry_validator.validate_agent_registry, which refuses any
  record carrying skills_used (_check_skills_used) and runs
  check_skill_refs.ability_reference_verdict, which reads each definition's own skills:
  frontmatter (a malformed declaration is an error) and refuses any skill named in the template
  prose that is not packaged under templates/skills/ or not granted by that declaration; either
  finding aborts the build. That the other declared entries are preserved is a one-time content
  fact confirmed at review, with no executable behaviour for a test to guard.
