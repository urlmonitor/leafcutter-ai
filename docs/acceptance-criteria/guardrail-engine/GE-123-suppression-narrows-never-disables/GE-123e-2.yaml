delivers_to:
  agent: python-coder
  contract: "Consumed by GE-123e-2-i. The check in templates/scripts/commit_guardian/check_feedback_id.py with every message source it read for the token removed (the --commit-msg-file argument, the GIT_COMMIT_MSG and COMMIT_EDITMSG environment variables and the COMMIT_EDITMSG file in the git directory) and no replacement source added, so no message, current or earlier, can change its verdict; and the skip branch and its 'skipped via [NO-FEEDBACK-CHECK] escape hatch' output line removed."
