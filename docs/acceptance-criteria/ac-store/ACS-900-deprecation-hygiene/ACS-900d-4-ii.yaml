    type: integration
    angle: discrimination
    description: "In the same staged set, check_done_proof.py also reports X-1's missing covering test, because a record whose successor is missing is not retired."
    must_catch:
      - "the predicate counts any non-empty superseded_by as retired without checking that the successor exists"
    covers: [ACS-900d-4-ii]
  - name: test_empty_successor_list_refused
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: boundary
    description: "status superseded_by with superseded_by [] is refused with a message naming X-1 and saying a superseded record must name at least one successor."
    covers: [ACS-900d-4-ii]
  - name: test_null_successor_refused
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: boundary
    description: "status superseded_by with superseded_by null is refused with the same at-least-one-successor message."
    covers: [ACS-900d-4-ii]
  - name: test_successor_resolved_against_whole_store_not_staged_set
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: boundary
    description: "A successor that exists in the committed store but is not staged resolves, and no missing-successor refusal is raised."
    covers: [ACS-900d-4-ii]
  - name: test_retired_child_missing_from_parent_covered_by_refused
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "check_ac_parent_covered_by.py refuses a correctly retired child whose parent's covered_by does not name it, with the same message it gives for an active child."
    covers: [ACS-900d-4-ii]
  - name: test_retired_record_invalid_work_status_refused
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: criterion
    description: "A correctly retired record with work_status finished is refused for shape by check_ac_schema.py and by validate_ac_schema.py, the same as an active record."
    covers: [ACS-900d-4-ii]
test_rationale: "Test file: unit_tests/commit_guardian/test_acs_900d_4_ii_retirement_structural_rules.py. This is the anti-gaming guard, so every scenario runs the real hook entry points against a temp git repo and store. The done-proof cross-check proves the structural rule and the predicate agree. Without it, a bogus supersession could be refused by the schema gate yet silently skipped by done-proof whenever the schema gate is bypassed."
