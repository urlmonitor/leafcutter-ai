title: "Framework detection from dependency declarations"
component: build-pipeline
level: L2
status: active
req_status: active
work_status: todo
readiness: approved
priority: medium
criteria: |
  Given a project with:
    - pyproject.toml listing "fastapi" and "sqlalchemy" in [project.dependencies]
    - package.json listing "react" in dependencies and "next" in dependencies
  When the technology detector scans the project at build time
  Then it reports detected frameworks: ["fastapi", "sqlalchemy", "react", "nextjs"]
  And each framework is associated with its parent language ("fastapi" -> "python", "react" -> "typescript")
  And frameworks are detected from manifest files only (not from import statements in source code)
