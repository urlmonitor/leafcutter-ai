id: BO-1500g-1-i
components:
  - build_orchestration
readiness: draft
priority: high
title: "A run halted at setup leaves the invoking checkout exactly as it was"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
created_by: docs/acceptance-criteria/build-orchestration/BO-1500-safe-ac-authoring-delivery/BO-1500a.yaml
criteria: |
  Given the checkout an authoring run is invoked from contains uncommitted acceptance-criteria
    drafts belonging to another session,
  And the isolated-workspace setup for the new run ends without a confirmed workspace,
  When the run halts,
  Then no acceptance-criteria file has been created, modified, or deleted in the invoking
    checkout,
  And the invoking checkout's staged content and current branch are the same as before the
    run started,
  And no commit has been created in the invoking checkout,
  And the other session's uncommitted drafts are still present and unmodified.
depends_on:
  - BO-1500g-1
