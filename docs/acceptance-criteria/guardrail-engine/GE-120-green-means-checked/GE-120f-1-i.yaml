notes: |
  WHY THIS IS A SEPARATE RECORD AND NOT A CLAUSE OF ITS PARENT. The parent is satisfiable by
  a run that puts the declared input through something and records what happened. The
  cheapest something is the part of the check that decides — imported directly, called with
  the declared input, watched. That satisfies every parent clause including the
  alter-and-revert pair, because altering the deciding part changes what the deciding part
  answers. And it certifies as demonstrated precisely the guard whose deciding part is
  correct and whose service path never reaches it, which is the worked example and the
  reason this L1 exists at all. Only a criterion about the invocation itself excludes it.

  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSE. "A rejection produced by reaching inside
  the check does not cause that check's record to say the rejection was observed." ARRIVAL
  COLOUR: GREEN, vacuously — no record is written for any check today, so none is wrongly
  written from an inside call. INJECTION: obtain the observation by importing the check and
  calling the part of it that decides, rather than by invoking the entry point. Under that
  injection a guard whose deciding part refuses correctly while its service path cannot
  reach it records the rejection as observed; this clause must go RED naming that guard, and
  must return to green on revert. Run the injection against the copy the run loads or it
  will not land.

  SECOND NAMED MUTATION, FOR THE STATED-ENTRY-POINT CLAUSE. INJECTION: build the statement of
  which entry point was used from the entry point the check's declaration names, rather than
  from the invocation actually performed. Under that injection the run reports the intended
  way in for every check whatever it did, the wrong-way-in case becomes indistinguishable
  from the right one, and only this clause goes RED — the parent's clauses stay green because
  a record is still written and still moves under alteration. That asymmetry is the reason
  this record is a separate file. It is the same substitution GE-126c-5 forbids one axis
  over: a statement built from what the author intended rather than from what the process
  did.

  ARRIVAL COLOURS FOR THE REMAINING CLAUSES. The Then requiring the record to come from the
  protected surface's entry point is RED on arrival. The stated-entry-point clause is RED on
  arrival — nothing is stated today. The reader-can-tell clause is RED on arrival for the
  same reason.

  A PROXY THAT MUST NOT BECOME THE CRITERION. Whether an invocation crossed a process
  boundary is a useful smell and is not the requirement: a check legitimately invoked in
  process by the surface it protects would fail such a rule, and a check invoked out of
  process by a way in nobody uses would pass it. The observable is which invocation the
  protected surface performs, not how it is performed.
target_epic: EPIC-AGuardThatHasNeverSaidNoIsNotCountedAs
