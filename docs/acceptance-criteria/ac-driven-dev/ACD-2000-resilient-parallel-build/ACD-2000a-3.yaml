roadmap_phase: phase_acbuild_2a_unit_of_work
criteria: |
  Given a requirement known to sit on flaky ground, which states on itself that
    its rework budget for repeated test failures is four rather than the usual
    default,
  When that requirement fails its tests four times in a row,
  Then the fourth failure is still reworked rather than escalated,
  And the fifth failure stops and asks a person,
  And a requirement that states nothing about its budget uses the standard one,
  And a requirement that states a budget of zero stops and asks a person on its
    first failure rather than being treated as having no limit,
  And the budget in force for a given requirement is visible on the requirement
    itself, not only in the behaviour of whatever is building it.
depends_on: [ACD-2000a, ACD-2000a-1, ACD-2000a-2]
