title: "The coder checks its own work against the same unmasked results the green gate will use"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given the fast lane dispatches its coder for a batch whose criteria are not yet done,
  When the coder receives its instructions for confirming the batch is green before it
    reports,
  Then those instructions direct it to run the batch's scoped tests with the
    enforcement plugin's downgrading switched off, the same way the green gate runs
    them,
  And they state that an xfailed outcome on a scoped test is a failure the coder must
    fix before reporting ok, not a pass.

  Given the coder reports ok while 3 of the batch's scoped tests still fail,
  When the green gate runs,
  Then the run stops at the green gate naming those 3 tests and their criterion ids,
  And the run's result records that the gate contradicted the coder's green report,
    rather than recording the coder's report as the outcome.
