criteria: |
  Given the documentation-coverage guarantee changes the phase order for a doc-required
    ticket (documentation-expert after the coder and tests; documentation-verifier last
    before commit),
  When a maintainer needs to see the runtime flow,
  Then a sequence diagram exists that shows, in order, the doc-required ticket phases:
    coder -> test-runner -> documentation-expert (writes the docs) ->
    documentation-verifier (asserts the docs against the Agent Contracts brief) -> commit,
    including the verifier's blocker path that prevents commit when docs are missing or
    placeholder.
  And the diagram is cross-linked from the build-orchestration and doc-compliance
    component docs.
