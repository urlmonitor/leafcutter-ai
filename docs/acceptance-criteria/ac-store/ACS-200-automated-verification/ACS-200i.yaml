notes: |
  Without this, the store acquires two divergent definitions of "valid" and the
  gate becomes a source of friction instead of confidence. There is direct
  precedent for the failure mode in this very folder: ACS-200e was raised
  because the standalone validator reported OK for records the commit-time gate
  then rejected. That was one rule family drifting from one other surface; this
  AC extends the same guarantee across all six rule families and the new
  merge-time surface.
  Deliberately expressed as a property of the rules, not of any one mechanism —
  a single shared definition consumed by both surfaces is the obvious way to
  satisfy it, but the AC asserts the observable agreement, not the technique.
  Changing the local guardrails themselves is OUT OF SCOPE; this AC constrains
  what the merge-time check may apply, not how the local guardrails are built.
