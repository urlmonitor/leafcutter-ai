    angle: failure
    description: "The unmatched branch does not fall through to the buildable side; assert the buildable count excludes it."
  - name: test_totals_still_add_up_with_unclassifiable_records_present
    target_dir: unit_tests/build_orchestration/
    framework: pytest
    type: integration
