  - templates/workflows/build-feature.md
  - templates/workflows-js/build-epic.js
assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "The preferred JS path must render result.message verbatim — no re-formatting"
  - "If result.message is empty or missing, fall through to the inline fallback template"
test_rationale: |
  No covers-tagged test can be authored: the surface this AC names no longer
  exists. templates/workflows/build-feature.md was deleted in its entirety
  (504 lines) by commit 63a846ac0, "feat(build): guardrail for template
  deploy-path collisions + de-conflict /build-feature (#228)", after this AC was
  implemented by TICKET-20260604-StandardizeBuildCompletionOutput. There is no
  file to parse, no "On ok" block to resolve, and nothing to execute. Retargeting
  the test at the successor, templates/workflows-js/build-feature.js, would
  assert a different contract from the one these criteria state — that script's
  own epic-completion return (around line 768) carries worktree_path and message
  but no manual_tests field and no four-section message, so a test written
  against it would be testing behaviour the AC never specified.
