title: "A drive requested on a non-native filesystem is refused before it can start"
component: build-orchestration
level: L3
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_1
created_by: "docs/acceptance-criteria/build-orchestration/BO-1800-isolated-parallel-delivery/BO-1800a.yaml"
criteria: |
  Given a drive is requested with its working copy located on a filesystem that is
    not a native POSIX filesystem (for example a `/mnt/c` DrvFs mount, a network
    share, or a portable/removable drive),
  When the isolation layer prepares the drive,
  Then it refuses to create the drive there and reports that isolation requires a
    native POSIX filesystem (ext4/btrfs/xfs), naming the offending path,
  And no drive working copy is created on that filesystem.
depends_on: [BO-1800a-1]
