notes: |
  THIS IS THE FALSIFIABLE ARM AND IT MUST NOT BE COLLAPSED INTO GE-120g-1. The parent states
  the two behaviours as one L1 because tree alteration is the only known mechanism by which
  refusal provenance is violated today. They are not the same claim. An implementation that
  merely stops one source of alteration satisfies GE-120g-1 in full and leaves this record
  unproven, which is exactly why the parent requires it to carry its own coverage.

  THE PAIR IS MANDATORY — EACH HALF ALONE IS DISCHARGED BY A DEGENERATE IMPLEMENTATION. A
  criterion that only says "a clean set of verdicts lets the commit through" is satisfied by
  a run that refuses nothing ever. A criterion that only says "an objection refuses the
  commit" is satisfied by a run that refuses everything. Both directions are stated above and
  a descriptor may not drop either.

  ARRIVAL COLOURS, STATED SO A GREEN IS NOT MISTAKEN FOR PROGRESS. Both positive directions
  are green today in this repository, and the absence-asserting final clause is green here
  too — but only because this repository's own exclusion file makes the live condition latent
  (verified 2026-09-07, .gitignore lines 41-42 pass over the compiled-module cache). The
  observed incident is the counter-example: an ordinary commit of a compliant file was refused
  while the gate itself reported a clean pass. A run in this repository that comes up green
  has not exercised the property.

  NAMED MUTATION FOR THE ABSENCE-ASSERTING CLAUSE — EXECUTE IT, DO NOT DESCRIBE IT. The clause
  is "whenever a commit does not complete, at least one check has reported an objection".

    SEEDING (mandatory, order load-bearing, and identical to GE-120g-1's — build it once and
    share it). A working copy in the fresh-install shape: the checks installed and NO
    exclusion entry covering what a delegated check leaves beside them, in particular the
    interpreter's compiled-module cache directory and its files. Then IN THIS ORDER: (1) run
    one check once so those files come into existence; (2) `git add -A` so they become tracked
    content; (3) commit that as the fixture baseline. Seeding before the run stages nothing
    and the mutation then passes.

    INJECTION: revert the runner's environment helper so the delegated check process is
    launched bare, with no environment argument — the state before the shipped fix. Under that
    injection, in the seeded fixture, an ordinary commit of a change every check accepts is
    refused while every check reports that it found nothing to object to. This clause must go
    RED, and the assertion that fails must be the PROVENANCE one: a refusal was reported and
    no check reported an objection. Revert must restore it.

    THE PAIRED CONTROL THAT MAKES THE MUTATION EVIDENCE. Under the same injection, the
    objection direction must stay GREEN — a change one check objects to is still refused with
    that check named. A mutation run in which both directions go red has broken the fixture,
    not demonstrated the property.

    IF THE MUTATION DOES NOT GO RED, THE FIXTURE IS WRONG — NOT THE RECORD. Treat a green
    mutation run as a defective fixture. This repository cannot be the fixture as it stands,
    and a proof run here and reported as passing is a false green about a false red.

  WHAT THIS RECORD DOES NOT OWN. It does not own whether an objection is attributed to the
  right author (GE-120e), whether a check that cannot be started says so (GE-120a, at its
  cap, escalated), whether the working copy is altered (GE-120g-1), or whether a fresh install
  carries an exclusion file (BP-900). A clause reaching for any of those has been
  mis-decomposed.

  NO COUNT OF INSTANCES IS STATED OR IMPLIED, DELIBERATELY. How many judging checks alter the
  working copy by a route other than the compiled-module cache has not been measured and the
  parent forbids assuming it. This criterion is written over the outcome of an attempt, not
  over a population of mechanisms.

  NOT AUTHORED HERE, BY DESIGN: estimated_complexity, it_requirements, test_spec,
  test_rationale and declares_side_effect. Those are the IT PO's.
