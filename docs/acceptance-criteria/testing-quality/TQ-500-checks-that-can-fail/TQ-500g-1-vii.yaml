notes: |
  PROMPT-ONLY. /build-epic dispatches ticket-supervisor, which follows the
  building-epics skill (prompt text), so the wiring is an instruction, not code.
  It cannot be unit-tested without a template text search (forbidden). The rule
  itself is deterministic and tested in TQ-500g-1-i; this AC only makes the
  supervisor call it and act on its verdict. Substitute: pr-reviewer against the
  Then clauses, and a live /build-epic drive of a fixture epic with K1 to K3.
  MECHANICAL BACKSTOP (user decision Q3 at the BA gate): TQ-500g-1-viii stops
  the commit of any /build-epic ticket for which this runner's verdict is
  missing, unreadable, stop, or older than the code. This AC must therefore
  leave the runner's own verdict on record in a form that check can read.

  PAIR WITH TQ-500f-3-iv. Both add a shared gate call to the same
  ticket-supervisor phase sequence (the red-baseline reader between the test
  writer and the coder; the wrong-version runs before commit). They may be built
  together in one llm-expert change, but each keeps its own AC and can pass or
  fail on its own.

  IT-PO ENRICHMENT (2026-09-28)
  llm-expert lane. Ship in one PR with TQ-500f-3-iv and TQ-500g-1-viii (see
  it_requirements).

  IT-PO AMENDMENT (2026-10-14): THE THREE-STEP DESIGN ON MAIN
  The supervisor's instruction is now: list, test-breaker (only when something
  is owed, with the list unchanged), then the finish wrapper (TQ-500g-1-v)
  with the reply on stdin and --record <ticket-key>. Commit only on finish's
  gate_passed true. A writer stop is a blocked ticket. The whole sequence
  runs inside the commit-phase lock, because finish alters files in the shared
  epic worktree. Recovery on resume is build-epic.js's job (TQ-500g-1-viii).
  CRITERIA CLAUSES FOR THE BA (criteria untouched here):
    - "Then the /build-epic route makes the wrong-version runs through the one
      shared runner, with the same inputs the fast lane and /build-feature
      pass": proposed addition "after asking the writer what is owed and, when
      anything is, having test-breaker prepare it from that list unchanged".
    - "And the verdict is the runner's own; the supervisor's summary of it never
      stands in for it": proposed addition "and the supervisor hands the
      preparer's reply on unchanged".
  FOLLOW-UPS OUTSIDE THIS AC: depends_on does not name TQ-500g-1-v (the
  wrapper), -iv or -ix (BA/user to add).

  IT-PO ALIGNMENT (2026-10-21): AGAINST MAIN AT adb0c2e61
  What is real on main: wrong_version_gate.py finish (no --record),
  wrong_version_writer.py list/write with --base-ref and scope,
  wrong_version_runner.py run/recover (no --record; every run starts with
  recover_all, which closes EVERY open journal in the worktree), and the
  merged wvRuns blocks in build-feature.js / build-ticket.js (TQ-500g-1-vi).
  --record exists nowhere on main; TQ-500g-1-viii adds it in this change.
  CONCURRENCY. build-epic.js (lines 413-421 at adb0c2e61) dispatches
  ticket-supervisor for up to 12 tickets at once through parallel(), all in
  one shared worktree. The commit lock serialises commit phases only, not a
  sibling's coder or test runner, and finish builds "the fix undone" and any
  derived scope from ALL uncommitted changes. So the user's 2026-10-21 rule
  for -vi applies here unchanged: one ticket per chunk when a batch owes runs.
  The chunking is code in build-epic.js and belongs to TQ-500g-1-viii (it is
  testable there under the harness); this AC carries only the supervisor-side
  serial check on runs_alone, the counterpart of -vi's M-2 belt.
  RECOVER stays at the drive head in build-epic.js (TQ-500g-1-viii), never
  in the supervisor, for the same reason as -vi.
  QUOTING. The supervisor composes its own Bash lines, so the instruction
  pins them, quoting every path and the ticket key and the ids, after
  checking ids and key against ^[A-Za-z0-9._-]+$ and the root against ", $,
  backtick, CR, LF. This is the -vi pattern; KI-BO-20261021 names the sites
  that still lack it, and this AC must not add another.
  PACKAGE SURFACE: false. Template-only edits; no registry entry is added
  (test-breaker is already in spawn_allowlist and its spawned_by already
  names ticket-supervisor).
