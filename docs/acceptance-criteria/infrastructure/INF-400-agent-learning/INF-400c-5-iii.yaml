title: "A rejected entry_kind is reported to the agent and does not fail the agent's run"
component: infrastructure
level: L3
status: active
req_status: active
work_status: todo
priority: high
readiness: draft
created_by: "docs/acceptance-criteria/infrastructure/INF-400-agent-learning/INF-400c-5.yaml"
criteria: |
  Given an agent finishing a run offers the entry_kind
    "component-decomposition-and-operational-note", which is not a member of
    the canonical vocabulary,
  When the agent calls the emission helper,
  Then the helper declines to write the event and returns a message that
    names the rejected value and lists the canonical members whose routing
    destination matches the destination the agent supplied,
  And no partial or placeholder record is appended to the knowledge-emission
    sink,
  And the helper exits without error, so the agent completes and returns its
    primary output unaffected,
  And the rejection is counted, so a run that rejected one or more emissions
    can be distinguished from a run that emitted nothing.
