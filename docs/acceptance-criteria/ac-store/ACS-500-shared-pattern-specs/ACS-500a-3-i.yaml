title: "pattern_bindings with missing keys are rejected at commit time"
component: ac-store
level: L3
status: active
req_status: active
work_status: todo
criteria: |
  Given a pattern AC (PTN-001) has criteria containing three parameterized
    slots: {entity_type}, {columns}, and {default_sort},
  And a consuming AC has implements_pattern: "PTN-001" with pattern_bindings
    containing only two keys: {entity_type: "orders", columns: ["id", "date"]},
  When the schema validator runs at commit time,
  Then the commit is blocked with an error stating:
    "pattern_bindings missing required key 'default_sort' for pattern PTN-001"
  And the error names both the consuming AC file and the missing key.
