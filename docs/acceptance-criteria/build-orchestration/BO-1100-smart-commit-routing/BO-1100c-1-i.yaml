id: BO-1100c-1-i
title: "Malformed routing config is rejected with a specific parse error"
component: build-orchestration
level: L3
status: active
readiness: draft
priority: medium
req_status: active
work_status: todo
criteria: |
  Given the routing configuration file contains invalid JSON
    (e.g. a trailing comma after the last entry: [{"group":"tickets",...},]),
  When the commit agent attempts to load the config,
  Then the agent rejects the file with an error message that includes:
    - the file path that failed to parse
    - the line number or character offset of the syntax error
  And the commit does not proceed with a generic fallback message,
  And the user is informed they must fix the config before committing.

  Given the routing configuration file is valid JSON but an entry is missing
    the required "group" field (e.g. {"path_pattern": "docs/**", "template": "..."}),
  When the commit agent validates the config,
  Then the agent rejects the file with an error naming the entry index (e.g. "entry 3")
    and the missing field ("group"),
  And no commit message is produced.
