id: TQ-100e-1-ii
title: "With no explicit config, enforcement defaults to the safe non-blocking mode"
component: testing-quality
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_1
created_by: docs/acceptance-criteria/testing-quality/TQ-100-trustworthy-test-gate/TQ-100e.yaml
criteria: |
  Given a project or consumer install in which no explicit enforcement-mode
    configuration is present,
  When the suite is run,
  Then the active enforcement mode is report-only (the safe non-blocking default)
  And the run is never blocked solely because the mode was unconfigured
  And no project is silently promoted to blocking by the absence of explicit
    configuration.
