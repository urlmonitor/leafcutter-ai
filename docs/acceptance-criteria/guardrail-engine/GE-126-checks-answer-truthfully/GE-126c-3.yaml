notes: |
  THIS RECORD EXISTS TO KILL ONE SPECIFIC WRONG DECOMPOSITION. "Handle the import failure
  gracefully" or "fail closed when the dependency is missing" re-specifies the current
  behaviour with a different exit code. Both leave the copy deciding what it is from an
  accident of its surroundings, so the day someone drops the helper into the build-source
  tree for an unrelated reason the copy starts answering again and answers wrongly.

  THE DEPENDENCY-SATISFIED ARM IS THE LOAD-BEARING ONE and it is deliberately awkward to
  arrange, because that awkwardness is what makes it a real test. An implementation that
  keys off the import result cannot pass it. An implementation that keys off where the copy
  lives passes it without effort.

  SCOPE IS ONE FILE. This says nothing about any other build-source copy of any other
  check. Most of them have no such dependency and are perfectly capable of running in
  place. The L1 forbids widening to an unmeasured set and GE-126e is what would measure it.

  IT ALSO MAKES GE-126c-1-i's HAZARD TRACTABLE: a rule keyed to location is one the build
  can distinguish, whereas a rule keyed to an import result is identical in both copies by
  construction.

  delivers_to IS NULL BECAUSE NOTHING IS ENRICHED YET. DO NOT REFILL from the BA stage.

  ------------------------------------------------------------------------------
  IT PO ENRICHMENT — 2026-08-26. Supersedes the BA delivers_to paragraph above.

  THE DISTINCTION THIS RECORD PROTECTS IS CARRIED IN ONE TEST DESCRIPTOR AND ONE
  it_requirement, DELIBERATELY. The descriptor is
  test_build_source_copy_refuses_with_every_dependency_route_satisfied; the requirement
  is the second one, which forbids deriving the disqualifying fact from any import
  result. If either is dropped in review, this record collapses into "fail closed on a
  missing dependency", which is the current behaviour with a new exit code and is what
  the BA record exists to forbid. Neither is negotiable.

  WHY THE FIRST DESCRIPTOR NAMES ALL THREE RESOLUTION ROUTES. KI-CG-019 records three
  strategies. A fixture that satisfies only the script-relative one leaves the other two
  failing, so an import-keyed implementation still refuses and still passes - and the
  test report is indistinguishable from a genuine pass. This is the single easiest way
  for this record to ship green and broken, so the arm is specified at route granularity
  rather than as 'the dependency is available'.

  delivers_to IS NOW SET AND CROSSES AN AGENT BOUNDARY. GE-126c-4 must state WHY the
  build-source copy can never run there. That sentence is only true if the rule is keyed
  to location; if it is keyed to the dependency, the honest sentence would be 'it usually
  cannot', which is a different and much weaker claim.

  AGENT — python-coder. M rather than S because the dependency-satisfied fixture is the
  awkward part and has to leave the tree byte-identical afterwards.

