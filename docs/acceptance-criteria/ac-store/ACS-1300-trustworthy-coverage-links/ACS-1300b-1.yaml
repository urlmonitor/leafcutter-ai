notes: |
  ENUMERATION BEFORE IMPLEMENTATION, on the product owner's instruction in ACS-1300b's
  notes: you cannot specify a fix for a set you have not established. One unenumerated
  path is a permanent slow refill, and the next measurement reads that refill as the
  repair in ACS-1300a having failed rather than as a path nobody wired.

  DERIVED, NOT LISTED — AND THE TWO MUTATION CLAUSES ARE WHAT MAKE THAT FALSIFIABLE. A
  hand-maintained list satisfies "names every delivery path" on the day it is written.
  Requiring that a newly added path appears without editing the enumerator, and that a
  path stripped of its hand-off changes classification, cannot be satisfied by a
  constant. Both are single-edit mutations an implementer can run.

  NO FIXED COUNT, DELIBERATELY. The final clause exists because the obvious test is to
  assert the enumeration finds N paths, and that assertion passes for the wrong reason
  the moment a path is added and another removed. It is also the failure the KM-KGS-100
  tree had to be re-authored to undo.

  THE STALE DIAGNOSIS THIS AC IS NOT BUILT ON, recorded because it was believed for a
  week and is still written in BO-202's notes: that the gate skips L3 records and greps
  only tests/. Both were true when BO-202 was filed on 2026-08-25 and both were fixed on
  2026-08-26. Verified by reading the template on this branch, line numbers in the
  doc_link above. An AC premised on re-fixing them would go green against work it did
  not do.
