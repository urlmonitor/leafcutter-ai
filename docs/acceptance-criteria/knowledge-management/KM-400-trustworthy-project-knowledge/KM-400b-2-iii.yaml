id: KM-400b-2-iii
title: "Publishing the same snapshot object again is recognised as the same content after the collapse changed it in place"
component: knowledge-management
components: [knowledge_management]
level: L3
status: active
req_status: active
readiness: approved
priority: high
work_status: done
parent: KM-400b-2
criteria: |
  Given a snapshot published once, whose relationships KM-400b-2-i collapsed in place (its
    diagnostics gained the collapse lines and, where copies existed, its edges lost them)
  When the same snapshot object is published again under the same generation identity
  Then the publication finds the generation it already wrote and succeeds, writing no node
    or relationship again, instead of failing with "generation identity already belongs to
    different content"
  And a snapshot whose content really differs under that identity is still refused
  And a generation recorded earlier with the digest of the loaded, uncollapsed snapshot is
    still recognised as the same content.
depends_on: [KM-400b-2, KM-400b-2-i]
