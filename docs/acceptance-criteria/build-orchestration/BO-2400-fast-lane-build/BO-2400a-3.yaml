criteria: |
  Given the test-writer has written the batch's tests and no implementation change
    has been made yet,
  When the fast-lane loop verifies the red baseline,
  Then a deterministic script runs the batch's tests and confirms every newly added
    test for the batch fails (the batch test run exits non-zero)
  And the coder agent is dispatched only after this red-baseline check passes.
