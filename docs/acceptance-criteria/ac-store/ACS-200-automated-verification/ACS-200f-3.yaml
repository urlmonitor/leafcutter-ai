id: ACS-200f-3
components:
  - ac_store
title: "When the done-marking tool reports an AC marked done, the record's own work_status key really is done and nothing else in the file changed"
component: ac-store
level: L3
status: active
req_status: draft
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given an active AC that is still recorded as not-yet-done,
  And the record's prose (for example a criteria or notes block) contains the
    literal text "work_status: todo" above the record's real work_status key,
  When an operator runs the done-marking tool for that AC,
  Then the record's top-level work_status key reads done when the file is
    parsed afterwards,
  And the prose that quoted "work_status: todo" is unchanged,
  And every line other than the work_status line is byte-identical to before,
    including its line ending (a CRLF file stays CRLF, an LF file stays LF),
  And if the key could not be verified as done after writing, the tool exits
    non-zero with an error instead of reporting success,
  And the bug symptom ("the tool prints 'marked <ID> work_status=done' and
    exits 0 having edited the prose, left the real key todo, and rewritten
    every line from LF to CRLF") must not occur.
