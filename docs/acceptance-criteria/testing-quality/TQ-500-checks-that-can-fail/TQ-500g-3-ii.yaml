notes: |
  THE FALSIFIABLE HALF OF "NONE MAY BE WEAKENED" (TQ-500g criteria), for the
  forms of weakening a run can see. A widened expected value or a removed
  assertion inside a test that still passes is not visible here; that is left to
  review and to the wrong-version runs (see TQ-500g-3 notes).

  E IS THE NECESSARY EXIT. Without it, any requirement that removes a feature
  would be blocked from removing its tests. The exit is narrow: the sweep list
  must name the test and give the reason, and it is reported, not silent. BA
  ASSUMPTION: the reason is stated by the writer and checked by review; no
  mechanical check that the tested code is really gone is required here.

  D IS THE CONTROL: strengthening is always allowed.

  RELATION TO INCIDENT 5 AND done_proof: done_proof treats SKIPPED as
  non-passing only for tests being proven for an AC now; this closes the gap
  for skips added to old tests.

  TECHNICAL DETAIL FOR IT-PO: "before the work began" is the merge base; the
  comparison is over collected node ids and outcomes (so a deleted file and a
  deselected test both show as gone).

  IT-PO ENRICHMENT (2026-09-28)
  Lane: python-coder, in one PR with TQ-500g-3 (prompt) and -3-i.

  IT-PO ALIGNMENT (2026-10-22): AGAINST MAIN AFTER TQ-500g-1-v/-vi
  The runs are part of TQ-500g-3-i's consumer_sweep.py check, so they ride the
  same finish call. Narrowed parametrize is covered by comparing node ids, not
  function names. The base run uses an exported copy, never the working tree. A
  conftest change widens the runs to that conftest's folder only; a pytest
  config change widens them to the whole test root.
  NOT SEEN HERE (unchanged): a removed assertion or a loosened comparison inside
  a test that still passes. See the open question on a static follow-up.

  BA AMENDMENT (2026-10-22)
  The static follow-up is decided (user answer Q1): TQ-500g-3-iii compares every
  changed existing test before and after without running it, in the same check,
  and stops on fewer assertions, a loosened comparison or a widened approx
  tolerance. This AC still owns only what the runs see.
  depends_on gains TQ-500g-1-v and TQ-500g-1-vi (the finish entry and its route
  dispatch, both done on main).
