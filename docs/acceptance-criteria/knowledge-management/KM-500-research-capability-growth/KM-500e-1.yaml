criteria: 'Given an agent asks how many test-writing requirements are done without defining whether it means one
  named family or the whole project

  When research prepares to answer

  Then it identifies the requested fact as implementation work status and states the required population, hierarchy
  inclusion rule, project revision and completeness requirement

  And unresolved choices that change the answer are returned as focused clarification before a definitive count
  is produced

  And an explicit request for all L2 and L3 descendants of TQ-500f excluding only TQ-500f is accepted without asking
  the same scope question again

  And a request to exclude all parent requirements is distinguished from excluding only that selected root

  And the original question and the resolved answer requirements remain available to later query selection, result
  assessment and any resumed research

  And a required answer field cannot be removed merely because the first available query does not return it.

  '
