notes: |
  TWO STAGES, ONE PROMISE — deliberately not split. The commit-time stage and the shared-build
  stage differ in what they stop (a local commit versus a merge), and that difference is
  GE-120d's subject. What they OWE the author is identical, and writing it twice would guarantee
  the two copies drift. GE-120d-1 separately requires that all three stages evaluate one shared
  rule, which is what makes a single message contract implementable.

  THE EXPLICIT NEGATIVE — "makes no statement that any agent will perform the renumbering" — is
  the honesty constraint from the L1 turned into a testable assertion, and it is the reason this
  AC exists separately from GE-120c-1. The user's original request was for the gates to say a
  specialist should be brought in. At these two stages that is not possible: a pre-commit hook
  is a subprocess and a build job is a container, and neither can spawn an agent. An AC that
  promised it here would be unbuildable, and an implementer trying to satisfy it would produce
  exactly the documented-but-dead remediation path that already exists elsewhere in this
  repository. Promising less, truthfully, is the point.

  "SELF-CONTAINED" IS THE ACCEPTANCE SHAPE, and it is testable as written: capture the output,
  and check that the other claimant's path and the target identifier are literally present in
  it. At the moment of the block the author typically does not know which other artifact claims
  the number — that is the whole complaint the L1 records — so an output that omits it converts
  a block into an investigation.
