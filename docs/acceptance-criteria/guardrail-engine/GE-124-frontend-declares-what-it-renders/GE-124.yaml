criteria: |
  Point at anything on screen and find the requirement it was built for.

  Today, when a reviewer looks at a finished screen, nothing on it says what it
  was supposed to prove. They have to search the requirements by hand, guess
  which one the screen answers, and hope they guessed right. This goal removes
  the guesswork: the screen's own source states the requirement it exists to
  satisfy, and an individual thing on the page can be pinned to the specific
  criterion it renders. New screen work cannot land without saying what it
  serves, and a finished screen requirement cannot quietly have nothing on
  screen behind it. Anyone reviewing the product can travel from what they see
  back to what was asked for, without archaeology and without asking the author.
  What a screen says about itself is a signpost to the requirement — never proof
  that the requirement works.
