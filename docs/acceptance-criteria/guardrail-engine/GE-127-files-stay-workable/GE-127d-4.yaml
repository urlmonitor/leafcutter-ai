notes: |
  CONFIRM BEFORE APPROVAL — THE BACKSTOP REFUSES ONE HONEST CHANGE SHAPE. With every comment
  uncounted (GE-127d-3), a change that removes code and adds more lines of comments or
  docstrings than it removed makes the measured length fall while the total rises, and is
  refused. It is written that way on purpose, because the caller asked for the backstop on
  every covered file, and the cost is bounded: the refusal tells the author to make the
  reduction and the commenting in separate commits, and each of those passes on its own
  (comment-only additions leave the measured length unchanged). If BrainCandy prefers a
  narrower backstop (only files at or over their limit, or a small tolerance), that is a
  criteria change and needs an amended_by entry.

  WHY THIS IS AN L2 OF GE-127d AND NOT AN L3 OF GE-127d-3. It is a second, independent check
  that exists precisely in case GE-127d-3's measure is wrong; filing it under that measure
  would make the canary a child of what it watches.
