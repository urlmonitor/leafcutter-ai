roadmap_phase: phase_1
criteria: |
  Each standard is adopted on its own and can be stepped back safely.

  Standards are taken up individually and in whatever order suits the project,
  each moving from off to advisory to enforced only when you decide it should.
  Any one of them can be stepped back down without disturbing the others and
  without losing the ground already gained.
