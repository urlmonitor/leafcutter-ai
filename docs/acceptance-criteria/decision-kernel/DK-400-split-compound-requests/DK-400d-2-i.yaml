criteria: |
  Given the trace-analyzers split waiting at the split gate with parts p1 and p2,
  When the person unticks both parts and approves,
  Then the answer is not accepted as an approval and nothing is recorded as approved,
  And the gate says that at least one part must stay in, or that the split can be rejected instead,
  And the gate stays open with no part run.
