assigned_agent: python-coder
estimated_complexity: M
package_surface: false
delivers_to:
- agent: python-coder
  ac_id: TQ-500g-1
  contract: >-
    The finish commands this AC's two routes record under unit_tests/_workflow_engine_harness.py, for the
    TQ-500g-1 seam test to execute for real against one fixture repo. Each is the command string of the
    bf-wv-finish (build-feature.js) or bt-wv-finish (build-ticket.js) dispatch: python
    <worktree>/{{config.output_root}}/scripts/build_orchestration/wrong_version_gate.py finish --work-key
    <ticket file stem> --reply - [--ac-ids <source_ac ids, comma-separated>] --ac-root
    <worktree>/docs/acceptance-criteria --test-root <worktree> --base-ref HEAD <<'<delimiter>' followed by
    the reply text and the delimiter line. It is built the same way as fast-lane-ship.js's
    fastlane-wv-finish command: same flag set, same order, same base ref, same here-document rule.
expects_from:
- ac_id: TQ-500g-1-v
  contract: >-
    Gate wrapper CLI (merged, PR #1280): python scripts/build_orchestration/wrong_version_gate.py finish
    --work-key <key> --reply - [--ac-ids <comma-separated ids>] --ac-root <path> --test-root <worktree root>
    --base-ref <ref>, with the raw test-breaker reply on stdin (empty when nothing was owed). --ac-ids is
    omitted when the ticket has no source requirement. finish forwards the same ids, AC root, test root
    and base ref to the writer's write step and, only when the writer wrote a manifest, to the runner's run
    step. stdout is exactly one JSON object {gate_passed: bool, stopped_at: null|"write", writer: <writer
    write JSON>|null, verdict: <runner run JSON verbatim>|null}; exit 0 if and only if gate_passed. An
    internal error still prints the shape with gate_passed false. Full contract in TQ-500g-1-v delivers_to.
- ac_id: TQ-500g-1-i
  contract: >-
    Runner JSON inside finish's verdict ({gate_passed, applicable, verified, outcome, reason, results,
    survivors, unfinished}; shape in TQ-500g-1-i delivers_to). The recover step is python
    <worktree>/{{config.output_root}}/scripts/build_orchestration/wrong_version_runner.py recover: no
    flags, run with the worktree root as its working directory, prints {restored: [str], ok: bool,
    copy_dir: str|null, detail: str}. recover closes EVERY open journal under the worktree's
    <git-dir>/leafcutter/wrong-version-runs, not only the current ticket's. On a worktree with no
    journals it prints ok true and restored [].
- ac_id: TQ-500g-1-iv
  contract: >-
    Dispatch of agent test-breaker: inputs {work_key: str, repo_root: str (absolute worktree root),
    requirement_ids: [str], wrong_versions: [{name: str, files: [str], scope: "declared"|"derived"}]}. One
    JSON reply, never read as an outcome by the route, only handed to finish on stdin. Shape in
    TQ-500g-1-iv delivers_to. test-breaker's registry spawned_by already names build-feature.js and
    build-ticket.js.
- ac_id: TQ-500g-1-ix
  contract: >-
    Writer list step: python <worktree>/{{config.output_root}}/scripts/build_orchestration/wrong_version_writer.py
    list --ac-ids <ids> --ac-root <path> --test-root <path> --base-ref <ref>. It prints {owed: [{name, files,
    scope}], error: str|null}; exit 0 when printed (also when owed is []), 1 when the AC store or test root
    cannot be read. The write step is reached only through finish. Both read scope from the AC store, never
    from the route.
- ac_id: TQ-500g-1-x
  contract: >-
    list and write both take --base-ref <ref> (default HEAD). Owed items carry the additive scope key
    ("declared"|"derived"); the route passes owed to test-breaker unchanged, scope included. list exits 1
    with owed [] and error set when an owed name has no declared scope and the changed files cannot be
    worked out against the base ref. With --base-ref HEAD the derived scope is the worktree's uncommitted
    changes, tracked and untracked (non-ignored).
- ac_id: TQ-500g-1-xi
  contract: >-
    List step with --work-key "<ticket stem>" printing {owed, to_prepare, decisions, error}; the route
    sends to_prepare (never owed) to test-breaker unchanged and only when it is non-empty; finish gains
    pins and the "pin" stop. Built under TQ-500g-1-xi in templates/workflows-js/_shared/wrong-version-runs.js.
it_requirements:
- >-
  Placement: immediately before every commit dispatch, after the last pre-commit phase (review
  included), so no later step can change the code the runs judged. "Every" includes a commit
  re-dispatch after a handoff or a remedy agent (for example restructuring-specialist after a
  file-size refusal): the code may have changed, so the sequence runs again before that dispatch.
  The sequence is not a phase in the agents map, so there is no sign-off to trust. A ticket whose
  commit phase is not dispatched in this drive (already signed_off, or not_needed) gets no runs and
  no commit from this drive.
- >-
  Sequence, the same as fast-lane-ship.js's wrong-version block, in this order. (0) Recover on a
  resumed drive (placement and signal in the next requirement). (1) When the ticket has source_ac
  ids: the list step for those ids, with --work-key "<ticket stem>" (amended 2026-10-23,
  TQ-500g-1-xi), run fresh immediately before the dispatch. (2) When to_prepare is non-empty
  (amended 2026-10-23; before: when owed is non-empty): dispatch test-breaker with work_key, repo_root
  (absolute worktree root), requirement_ids (the source_ac ids) and wrong_versions = the list's
  to_prepare array unchanged; with to_prepare [] no test-breaker dispatch at all; a missing or
  non-array to_prepare halts with step "list". (3) One finish dispatch with the reply on stdin.
  (4) Reach the commit dispatch only when finish's own gate_passed is true.
- >-
  Resumed-drive signal and recover placement, per route. build-feature.js: the drive is resumed when
  it reuses an existing worktree, that is when realWorktreePath is established by the resolved-worktree
  facts (scenario 1) or by the occupied-location reuse branch (scenario 2), or the worktree-setup
  agent reports status "reused". It is fresh only when worktree-setup reports "created"; a fresh
  worktree has its own git-dir and so no journals. This is the counterpart of fast-lane-ship.js's
  workspaceCreated === false. Recover runs ONCE per drive, after the worktree is established and
  before the first ticket is dispatched (before the epic planner and before the single-ticket call
  to driveTicketPhases). It must not run inside driveTicketPhases: recover closes every open journal
  in the worktree, so in a parallel chunk it would put back a sibling's in-flight alteration in the
  middle of that sibling's run. build-ticket.js: it has no worktree-creation step (the worktree is
  caller-supplied or found by the ambient check), so no drive can be told apart as fresh. It runs
  recover on every drive, once, right after the Worktree Guard establishes
  resolvedTarget.worktree_path and before the Planner, so the red-baseline gate's test run never reads
  altered code either. On a clean worktree recover is a no-op that prints ok true.
- >-
  Dispatch labels, pinned for the tests. build-feature.js: bf-wv-recover, bf-wv-list,
  bf-wv-test-breaker, bf-wv-finish. build-ticket.js: bt-wv-recover, bt-wv-list, bt-wv-test-breaker,
  bt-wv-finish. Each dispatch carries phase "Wrong-Version Runs" in its options. The twin parity test
  compares the sequences with the bf-/bt- prefix removed, so the four suffixes (wv-recover, wv-list,
  wv-test-breaker, wv-finish) must be identical in both files and match the fast lane's suffixes.
- >-
  Inputs, the same values the fast lane passes. Every step that takes a base ref gets --base-ref HEAD
  passed explicitly: the list step and finish both pass it, and finish forwards that same value to the
  writer's write step and to the runner (TQ-500g-1-v). The base ref never comes from the reply, an
  earlier list output or an environment variable. --ac-ids is the ticket's source_ac ids joined by
  commas (omitted when there are none), --ac-root is <worktree>/docs/acceptance-criteria
  (AC_STORE_REL_PATH), --test-root is the worktree root, and the scripts are called as
  <worktree>/{{config.output_root}}/scripts/build_orchestration/<script>.py. On these per-ticket routes
  HEAD is the state before this ticket's own commit, so earlier tickets' commits are not undone.
- >-
  Owed items carry the additive scope key ("declared" | "derived", TQ-500g-1-x). The route does not read,
  filter, reorder or drop it: wrong_versions for test-breaker is the list's owed array unchanged, scope
  included. A list exit 1 for a base ref whose changed files cannot be worked out is a fail-closed halt
  like any other list failure.
- >-
  Reply transport and writer stop: as TQ-500g-1-v decided and fast-lane-ship.js does. The reply goes in
  on stdin through a quoted here-document whose delimiter does not occur in the reply (start from
  WV_REPLY_EOF and extend it while the reply contains it), and reaches the writer byte for byte, with no
  shell expansion of $, backticks or quotes. No reply file is written. When the writer stops, finish
  never calls the runner and reports gate_passed false with stopped_at "write"; the ticket halts as
  blocked with finish's JSON verbatim in its result.
- >-
  The JS never interprets the test-breaker reply. A string reply goes in as is; an object reply goes in as
  its JSON text; a dispatch that throws, is refused or returns nothing goes in as an empty reply. With
  names owed, the writer then stops and the ticket halts. The JS never decides that an empty reply means
  nothing is owed.
- >-
  Nothing to prepare (amended 2026-10-23): when to_prepare is [] (owed [] included), test-breaker is not
  dispatched and finish still runs with an empty stdin; finish's JSON may carry the additive key pins and
  stop at "pin", which halts like any other gate_passed false.
- >-
  Nothing owed: test-breaker is not dispatched, and finish still runs with an empty stdin. K3 (no
  source_ac): the list step and test-breaker are skipped, and finish runs with no --ac-ids, so the runner
  itself returns "wrong-version runs not applicable: no source requirement". Record verdict.outcome on
  the ticket outcome under the key wrong_version_outcome (the fast lane's key; null when finish gave no
  verdict), beside red_baseline_gate, and continue. Never record "verified".
- >-
  Executor: dispatch every command step (recover, list, finish) as agentType command-step-runner, the
  agent fast-lane-ship.js uses (permits_shell true). Never status-checker: it is registered read-only and
  has refused shell steps (KI-BO-20260927, KI-BO-20260901-1620). This includes NOT copying the twins'
  red-baseline gate, which still dispatches status-checker. The request is the executor's documented
  shape, JSON.stringify({step: <label>, command, target: {workspace: <worktree root>, branch: <the
  drive's branch when the route knows it>, run_id: <work_key>}}); run_id is used because K3 has no AC id.
  The reply's stdout is read by TQ-500f-3-v's reading rule (parseStepJson; amended by IT PO 2026-10-23,
  replacing "parsed as the fast lane does: JSON.parse(reply.stdout)"): the whole trimmed text when it
  parses as one JSON object, otherwise the one distinct line that is on its own a JSON object; zero or
  two-plus such lines is no reply. A decline (no stdout), a throw or a non-object also counts as no reply,
  and every caller still fails closed on it (the checks in the fail-closed entry below are unchanged). The
  fast lane (fast-lane-ship.js) keeps its own strict parse; it is out of scope here. The twins carry their own copy of the fast lane's executor reply
  schema (CLAIM_RUNNER_SCHEMA), identical in content, since the engine has no module loader.
- >-
  Registry (config/agent_registry.json), the one concrete edit: command-step-runner's spawned_by becomes
  ["user", "fast-lane-ship.js", "build-feature.js", "build-ticket.js"]. No other field changes, no new
  entry. Both names are recognised external callers because templates/workflows-js/build-feature.js and
  build-ticket.js exist (is_recognized_external_caller, INF-600k-1), so the registry validator's
  asymmetric-spawn check and the check-agent-spawn-consistency hook accept them without a
  spawn_allowlist counterpart. The same change regenerates docs/agents/cards/command-step-runner.card.md
  (Spawned By list and spawn diagram), which that hook compares with the registry, and updates the
  adopter_notes sentence in templates/agents/command-step-runner.md that says spawned_by lists only "user"
  and "fast-lane-ship.js". test-breaker's spawned_by already lists both files and is not touched. Deployed
  copies regenerate through build.py.
- >-
  package_surface: false (IT-PO decision 2026-10-21). The check-package-surface-declaration commit-msg
  hook (ACS-100i-8) refuses only a NEW entry in a watched registry (a new id under agents in
  config/agent_registry.json). Adding two values to an existing entry's spawned_by adds no entry, so the
  hook reports nothing to evaluate. Declaring true would wrongly impose the structured it_requirements
  object. If the build ends up adding a new registry entry after all, that is out of this AC's scope and
  needs its own AC with package_surface true.
- >-
  Fail closed on every command reply. recover: ok must be the boolean true. list: owed must be an array
  and error null. finish: gate_passed must be a boolean. A null, refused, declined or unparseable reply,
  or one that fails its check, halts as blocked and never counts as a pass. The commit dispatch is
  unreachable on any path that has not read gate_passed true from finish's own JSON.
- >-
  Halt shape: the blocked result carries the fast lane's keys: gate "wrong_version_gate",
  wrong_version_step ("recover" | "list" | "finish") and wrong_version_detail (the parsed reply verbatim,
  or null), with finish's JSON (survivors, unfinished, or the writer's error) in the message. Inside
  driveTicketPhases and build-ticket.js's loop it uses the routes' existing refuse(...) helper with
  classification "halt". A recover halt in build-feature.js happens before any ticket starts, so the
  whole drive returns blocked and no ticket is dispatched. These routes claim no ACs, so there is no
  release step; nothing is left claimed by a halt.
- >-
  work_key: the ticket's file stem (file name without .md), one plain path segment and stable across a
  resume. The same key goes to test-breaker, to finish and to the executor's target.run_id.
- >-
  Serialization in build-feature.js. Chunks of up to BATCH_SIZE (12) tickets run through parallel() in one
  shared worktree. The existing exclusion is commitLane: commitWithKnowledgeRouting chains each ticket's
  stage, commit and observe steps one ticket at a time. The sequence from the list step through the commit
  dispatch runs inside that same commitLane turn, ahead of its stage step, so no ticket's list, test-breaker
  or finish overlaps another ticket's finish or commit. On a halt the turn resolves to the blocked result
  without the stage, commit or observe steps, and the lane moves on to the next ticket. This placement is
  kept under the one-ticket-per-chunk rule below: a serial batch never has two tickets in the lane at once,
  and a parallel batch has no ticket that owes runs, but every K3-style finish (no ids) still runs inside
  the turn. build-ticket.js drives one ticket sequentially and needs no exclusion. Recover stays once at
  the drive head: it runs before any batch starts, when no journal can belong to a run in progress, so the
  serial rule does not move it.
- >-
  One ticket per chunk when a batch owes runs (user decision 2026-10-21). Why: commitLane does not exclude
  a sibling's NON-commit phases, and finish builds "the fix undone" and any derived scope from ALL
  uncommitted changes against HEAD (TQ-500g-1-x), alters the guarded files and restores its copies at the
  end. A sibling's coder or test-runner in flight at that moment would be judged against, reverted, or
  overwritten. Rule: when any ticket in a /build-feature batch has a source requirement (source_ac, so it
  owes wrong-version runs), that batch is driven one ticket at a time, so each ticket's runs see only its
  own changes. A batch in which no ticket has source_ac stays parallel in chunks of BATCH_SIZE, as today.
  The single-ticket path and build-ticket.js drive one ticket already and are unchanged.
- >-
  Where the decision sits in build-feature.js: in the epic path's batch loop ("run THIS LOOK's batches"),
  where `for (let i = 0; i < tickets.length; i += BATCH_SIZE)` slices `chunk = tickets.slice(i, i +
  BATCH_SIZE)` before the chunk's thunks go to parallel(chunkThunks). BATCH_SIZE stays the constant 12
  declared at the head of the epic path. The change is only the step: a per-batch chunk size of 1 when the
  batch owes runs, else BATCH_SIZE, decided once per batch before its first chunk. Everything after the
  slice (the BO-100e-1-i eligibility gate, the path-form refusal, parallel(), the halt and staged-leftover
  checks) stays as it is; a one-ticket chunk is still dispatched through parallel() with one thunk. The
  per-ticket source_ac read inside driveTicketPhases is too late for this decision, so the batch-level
  answer comes from the epic planner (label epic-planner, PLANNER_SCHEMA), whose
  batches[].tickets[] items gain a source_ac key: the ticket's source_ac frontmatter as an array of
  strings, and [] when the ticket has none. Unlike the ticket planner's convention (omit when absent),
  here the key is always returned, so its absence means "not read".
- >-
  Fail closed on that decision: a ticket whose batch item has no source_ac key, a non-array value, or a
  planner reply that cannot be read as such counts as having a source requirement, and its batch is
  driven serially. Only a batch in which every ticket item carries source_ac as an empty array stays
  parallel. The decision is a thin dispatch-side choice in the JS: no new script, no lock, no change to
  the planner's batching rules (antichain, files_touched split).
- >-
  Once TQ-500g-3-i and -3-ii exist, the same single before-commit finish call also carries them. Do not
  add a second dispatch for them.
- >-
  Edit only templates/workflows-js/ sources (plus the registry, card and executor template named above).
  Deployed mirrors regenerate through build.py. Respect the E2 leaf invariant and ADR-006: no workflow()
  call inside the workflow; test-breaker and command-step-runner are dispatched at depth 1 from the
  workflow body. No Python changes: wrong_version_gate.py, the writer and the runner are used as merged.
- >-
  Change build-feature.js (driveTicketPhases and the drive head) and its declared twin build-ticket.js
  together, as the TWIN rule in the build-feature.js header requires. Copy the fast lane's builders
  (script dir, ids flag, common flags, the step helper, the delimiter loop, the finish command) as text,
  kept identical between the twins apart from the label prefix, since the engine has no module loader.
- >-
  K4: the sequence runs whenever the commit phase is about to be dispatched, including on resume when
  every earlier phase is already signed_off.
- >-
  JS growth: thin dispatch only, no rule logic in the JS. Counted lines today (count_content_lines in
  scripts/commit_guardian/_file_size_ratchet.py, measured 2026-10-21): build-feature.js 2433, build-ticket.js
  1353, both over the 1000-line .js limit, so the ratchet refuses any growth. The fast lane's block was +52
  measured lines. Expected growth: build-feature.js about 62 to 82 (the block, the schema copy, the
  drive-head recover, the commitLane hook-in, plus about 7 to 12 for the one-ticket-per-chunk rule: the
  source_ac key on the planner's ticket item schema, one sentence in the epic-planner prompt and the
  per-batch chunk step), build-ticket.js about 45 to 60 (the block, the schema copy and the recover after
  the Worktree Guard). Anything well beyond that means rule logic leaked into the JS.
  The user will approve a one-time check-file-size skip for these two files at commit (the BO-3900 and
  TQ-500g-1-v precedent); record the measured growth in the commit message. SUPERSEDED for the next
  change (amended 2026-10-23, TQ-500g-1-xi): no size skip. Counted lines are now build-feature.js 1810
  and build-ticket.js 1138, and the ratchet accepts a change only when the new length is at most the
  previous length minus the counted lines it added (a replaced line counts as added). The twins'
  identical wrong-version block (WV_RUNNER_SCHEMA through wvHaltFields) therefore moves into
  templates/workflows-js/_shared/wrong-version-runs.js, inlined by the build between an empty
  "// WRONG-VERSION-RUNS-START" / "// WRONG-VERSION-RUNS-END" pair in each twin; const WV and
  build-feature.js's wvParallelTickets stay outside the markers. Any later wrong-version route logic is
  written in that shared source, never in the twins.
- >-
  Existing build-feature.js and build-ticket.js workflow tests reach the commit dispatch, so after this
  change they meet the new executor dispatches. Give them passing wrong-version stubs (recover ok true,
  list owed [], finish gate_passed true), as TQ-500g-1-v did for the older fast-lane tests, rather than
  weakening the new fail-closed parses.
- >-
  The workflow tests that carry must_catch exercise build-feature.js and build-ticket.js as they stand in
  templates/workflows-js/ when they run, never a deployed copy left from an earlier build.
test_spec:
- name: test_build_feature_runs_wrong_version_sequence_right_before_commit_dispatch
  target_dir: unit_tests/workflows/
  framework: pytest
  type: integration
  angle: reachability
  surface_invoked: templates/workflows-js/build-feature.js under unit_tests/_workflow_engine_harness.py
  description: >-
    Drives build-feature.js for K1. The recorded dispatches show, after the last pre-commit phase and before
    the commit agent: bf-wv-list, bf-wv-test-breaker, then bf-wv-finish, each command step as agentType
    command-step-runner. The list and finish commands carry the ticket's source_ac ids, the worktree root as
    --test-root, the AC root and --base-ref HEAD; finish carries the ticket stem as --work-key.
  must_catch:
  - runner placed after the commit phase
  - list step called without --base-ref
  - command step dispatched to status-checker
  in_scope_files:
  - templates/workflows-js/build-feature.js
  - templates/workflows-js/build-ticket.js
- name: test_owed_list_reaches_test_breaker_unchanged
  target_dir: unit_tests/workflows/
  framework: pytest
  type: integration
  angle: seam
  description: >-
    The list executor returns two owed entries, one with two files and scope "declared", the other with scope
    "derived". The bf-wv-test-breaker input carries wrong_versions equal to that owed array (same order,
    spellings, files and scope keys), requirement_ids equal to the source_ac ids, work_key equal to the
    ticket stem and an absolute repo_root.
  must_catch:
  - owed entries filtered or re-spelled before the test-breaker dispatch
  - scope key stripped from owed items before the dispatch
  in_scope_files:
  - templates/workflows-js/build-feature.js
  - templates/workflows-js/build-ticket.js
- name: test_finish_command_carries_reply_byte_for_byte
  target_dir: unit_tests/workflows/
  framework: pytest
  type: integration
  angle: real_artifact
  description: >-
