id: ACD-1900b-5
components:
  - ac_driven_dev
readiness: reviewed
priority: medium
title: "The fulfillment gate resolves coverage by dual-read, so a thin ticket is always verified"
component: ac-driven-dev
level: L2
status: active
req_status: draft
work_status: todo
roadmap_phase: phase_acbuild_1_foundation
criteria: |
  Given a thin ticket whose frontmatter carries no ac_traceability key but whose
    source_ac resolves to a store AC whose deliverable checklist has at least one
    unmet (unsigned) deliverable,
  When the ac-fulfillment-gate runs its coverage-resolution step,
  Then the gate does NOT take the "ac_traceability absent -> ok" skip path,
  And the gate resolves the ticket's AC coverage from source_ac (and the resolved
    AC's deliverable checklist / store fields) instead,
  And the gate verifies the resolved AC and returns a blocker naming the unmet
    deliverable,
  And the gate never returns ok for that thin ticket while a resolved deliverable
    is unmet;
  And given the same thin ticket whose resolved AC deliverables are all signed off,
  When the gate runs,
  Then the gate returns ok.
depends_on:
  - ACD-1900b
  - ACD-1900b-1
