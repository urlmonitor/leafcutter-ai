criteria: |
  Given an epic/feature drive is about to dispatch its first phase agent,
  When the drive reaches its pre-flight step,
  Then a new pre-flight step runs the probe against the worktree root before any
    phase agent is dispatched, mirroring the existing feedback-sink pre-flight,
  And if the probe returns a non-zero verdict the drive returns
    `{status: blocked, reason: <failing check>}` and no ticket is started,
  And only when the probe passes does the drive proceed to dispatch phase agents.
depends_on: [BO-1700d, BO-1700a-1]
