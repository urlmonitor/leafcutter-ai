  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: The readiness gate flags the record not implementation-ready with 'test design pending',
    distinct from 'missing test contract'.
- name: test_intent_record_excluded_from_dispatch_set
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: integration
  description: The record is absent from the set dispatched to builders.
  angle: reachability
- name: test_generator_derives_no_tests_for_intent_record
  target_dir: unit_tests/ac_store/
  framework: pytest
  type: unit
  description: The ticket generator derives no Then-clause test list for a record carrying test_intent.
  angle: seam
- name: test_commit_check_rejects_approved_intent_without_design
  target_dir: unit_tests/commit_guardian/
  framework: pytest
  type: unit
  description: The commit-time record check rejects the change, naming the file and 'test design pending'.
  angle: failure
