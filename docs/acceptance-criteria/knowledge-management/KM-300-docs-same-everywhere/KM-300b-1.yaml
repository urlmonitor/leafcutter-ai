test_spec:
  - name: test_retrospectives_order_is_code_point_by_posix_path
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Creates the four named retrospectives plus a discriminating pair (Zeta-retro.md, alpha-retro.md) in a shuffled creation order with shuffled mtimes; generates the map; asserts the Retrospectives rows appear in case-sensitive code-point order (2026-..., EPIC-ACD..., EPIC-AcP..., Zeta-retro, alpha-retro, epic-lowercase...). Red on a Windows host with the current case-insensitive sort."
  - name: test_recursive_section_order_is_segment_wise
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "In a recursively scanned section, creates a/x.md and a-b/x.md and asserts the fixed segment-wise rule orders a/x.md before a-b/x.md."
  - name: test_section_order_follows_declared_list
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Asserts the section headings appear in the generator's declared order regardless of the order sub-folders were created."
  - name: test_generator_docstring_states_ordering_rule
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: unit
    description: "Asserts the generate_doc_index module docstring states the ordering rule (case-sensitive code-point order over the forward-slash path). Red on every host until the rule is documented."
test_rationale: "The BA's four example names order the same under case-sensitive and case-insensitive rules, so the test adds a discriminating pair (Zeta/alpha); without it the ordering test is green on every host and proves nothing. The ordering assertion is red only on Windows; the docstring assertion gives a POSIX-red signal for the documented-rule clause."
notes: |
  Mixed-case names (EPIC- vs epic-) are deliberate in the example: Windows
  file systems are case-insensitive and a locale-aware or case-folding sort can
  order them differently from a byte-wise sort. Which rule is chosen is the
  IT PO's call; that the rule is fixed and host-independent is the behaviour.
