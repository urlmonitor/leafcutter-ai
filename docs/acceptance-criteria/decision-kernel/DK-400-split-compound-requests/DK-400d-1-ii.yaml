id: DK-400d-1-ii
title: "The /leafcutter and $leafcutter skills show the split gate in full and relay the person's answer unchanged"
component: decision-kernel
components:
  - decision_kernel
level: L3
status: active
req_status: draft
work_status: todo
readiness: approved
priority: high
roadmap_phase: phase_kernel_1_founding
criteria: |
  Given the decision-records split waiting at the split gate with parts p1 to p5 offered, and with
    p6 "Decide how human approval of a record is recorded" and p7 "Decide how later corrections
    to a record are recorded" listed as not covered (mock record dcp-decision-records-seven-parts),
  When the /leafcutter skill in Claude Code, or the $leafcutter skill in Codex, receives the run's
    waiting_human envelope for that gate,
  Then it shows the person the request as submitted and every offered part with its quote, the
    parts it waits for and its capability,
  And it shows every set-aside proposal and every not-covered part read-only, each with its
    reason, here p6 and p7 with the reason "beyond the five-part cap",
  And it relays the person's answer unchanged, whether approve, a rewording of a part, parts left
    out or reject, together with the person's note, with the person as actor human:<name> and the
    host only as the relayer,
  And it never answers the gate on the person's behalf,
  And when the person asks for the run's status, it shows the split's progress block: each part
    with its outcome and its link.
