title: "The block message tells the developer which of the two remedies applies"
component: ac-store
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
created_by: docs/acceptance-criteria/ac-store/ACS-1200-parked-ideas/ACS-1200c.yaml
criteria: |
  Given the parent-back-link check has blocked a commit because ACS-1200a-3 is
    not listed in its parent ACS-1200a's covered_by,
  When the message it produced is read,
  Then it names the child record id ACS-1200a-3, the parent record id ACS-1200a,
    the file path of the parent record, and the rule that was violated,
  And it states both available remedies in the same message — add the child id
    to the parent's covered_by list, or mark the parent as parked by setting
    parked: true together with a parked_reason — so the developer can tell which
    one applies to the tree in front of them,
  And it states that marking a record parked is the second remedy only when the
    tree has deliberately not been broken down yet,
  And it does not name skipping the check as a remedy anywhere,
  And the message is written to stdout, not only to stderr,
  And a message that names only the rule and the offending record, without both
    remedies, does not satisfy this criterion.
