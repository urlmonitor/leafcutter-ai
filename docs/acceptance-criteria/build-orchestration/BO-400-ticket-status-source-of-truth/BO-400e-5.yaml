notes: |
  Satisfies the parent BO-400e's documentation_triggers: [sequence-diagram]. It takes the
  fifth and last L2 slot under BO-400e, which is now at the cap of five.

  WHY A DIAGRAM IS THE RIGHT ARTEFACT HERE, AND NOT DECORATION. The defect this family
  fixes was a routing question: two doors existed to the same state and only one of them
  read the record, and nobody could see that without opening two files and a prompt. The
  diagram's job is to make the number of doors readable at a glance, which is why the
  criteria demand every writing participant, both drivers, the refusal path and the
  override path -- and why "exactly one path ends in the finished state" is stated as an
  explicit clause rather than left implicit in the drawing.

  BOTH DRIVERS OR IT HIDES THE THING IT IS FOR. Per BO-400a-2-ii's standing constraint the
  epic driver and the single-ticket driver must not diverge. A diagram of one of them
  cannot show a divergence between them, and the twin relationship is exactly the kind of
  fact a reader will not reconstruct from prose.

  THE REFUSAL PATH IS NOT OPTIONAL. A happy-path-only diagram of this feature documents the
  half that was never in doubt. The refusal is the reason the finished state is worth
  reading, so it is drawn with its own terminal state -- record unchanged, outstanding step
  named.

  SCOPE. This record is documentation only. It states nothing about behaviour that
  BO-400e-1 through BO-400e-4 do not already own, and it must not be read as amending them:
  if the diagram and those records ever disagree, the records are right and the diagram is
  stale.

  PRIORITY inherited from the parent's medium, which the parent labels a validator-forced
  placeholder.
