assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  - "Default mode is dry-run-first: with no execute confirmation the recovery prints the ordered action plan (each action names its concrete targets) and performs ZERO git writes, then exits. Execution requires an explicit execute flag (e.g. --execute) or an interactive yes; --dry-run is the effective default when no execute confirmation is given."
  - "The printed plan and the executed actions must be derived from the SAME plan-computation pass over the current repository state, so the executed set cannot diverge from what was shown (no 'compute plan for display, recompute different plan for execute')."
  - "Non-destructive-by-default means the failure mode of any ambiguity is to print-and-stop, not to act; when the plan cannot be computed the entry point reports why and makes no change (ties to the unrecoverable/refuse L3s BO-1600d-3-* )."
  - "PORTABLE SURFACE: this plan/confirm layer lives inside the same standalone recovery script pinned in BO-1600d-1 (templates/scripts/git_recovery.py); it is not a separate deployable artifact."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3): wrap the git/filesystem operations in try/except with a specific exception type, log at WARNING or higher, and treat an errored step as a stop, never as a silent skip that leaves a partial plan applied."
  - "PORTABLE per ADR-001: the dry-run-first + confirm behavior ships to consumers via build.py (BO-1600d-4); it must NOT rely on the leafcutter repo's own root CLAUDE.md."
delivers_to:
  agent: python-coder
  contract: "The plan/confirm layer: a single plan-computation pass over the current repository state that both prints the ordered, target-named action list (dry-run-first default, zero writes) and drives execution only after explicit confirmation. The recovery-step engine (BO-1600d-3) supplies the individual actions; this layer sequences, displays, and gates them."
expects_from:
  ac_id: BO-1600d-1
  contract: "The human-invoked, pre-confirmation-inert recovery entry point that this plan/confirm layer runs inside."
test_spec:
  - name: test_default_mode_prints_plan
    target_dir: tests/
    framework: unittest
    type: unit
    description: "With no execute confirmation the entry point prints the ordered action plan, and each printed action names its concrete target."
  - name: test_plan_describes_zero_byte_objects_by_path
    target_dir: tests/
    framework: unittest
    type: unit
    description: "The removal action's printed description lists the specific zero-byte object paths, not a count-only summary."
  - name: test_default_mode_no_git_writes_on_no
    target_dir: tests/
    framework: unittest
    type: unit
    description: "In default (no execute confirmation) mode the run issues zero git write subprocess calls and exits after printing the plan."
  - name: test_execute_flag_makes_writes
    target_dir: tests/
    framework: unittest
    type: unit
    description: "Supplying the explicit execute flag is the only non-interactive path that issues the git write calls for the printed actions."
  - name: test_interactive_yes_executes_plan
    target_dir: tests/
    framework: unittest
    type: unit
    description: "An interactive 'yes' counts as the explicit human confirmation and carries out the printed plan; any other answer performs no write."
  - name: test_executed_plan_is_same_object_as_printed_plan
    target_dir: tests/
    framework: unittest
    type: unit
    description: "The action list handed to execution is the identical plan-computation result that was printed — there is no second, divergent planning pass."
  - name: test_dry_run_on_real_repo_leaves_object_store_unchanged
    target_dir: tests/
    framework: unittest
    type: behavioral
    description: "On a real temporary git repository seeded with a zero-byte loose object, a default-mode run prints a non-empty plan while leaving the on-disk object store and refs byte-identical."
test_rationale: |
  The safety promise of this AC is a NEGATIVE ("zero git writes before
  confirmation"), and a mocked-subprocess assertion can only prove that for the
  call sites the test happens to patch. The behavioral descriptor
  (test_dry_run_on_real_repo_leaves_object_store_unchanged) is therefore not
  optional: it runs the entry point against a real temporary repository and
  compares the object store and refs before/after, so an unmocked write path
  cannot slip through. test_executed_plan_is_same_object_as_printed_plan is the
  other load-bearing descriptor — it is the only one able to disprove a
  "compute-a-plan-for-display, recompute-a-different-plan-for-execute"
  divergence, which no per-action assertion can detect.
