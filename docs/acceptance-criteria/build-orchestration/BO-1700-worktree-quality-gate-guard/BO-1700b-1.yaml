it_requirements: |
  User ruling (2026-07-01): the guard FAILS CLOSED on its own internal errors.
  There is NO fail-open-on-internal-error path anywhere in the probe or the gates.
  This is the SINGLE authoritative statement of the proceed condition — proceed iff
  (exit code 0 AND empty failing_checks) — that every gate in the BO-1700d family
  must honor without reinterpretation. All gates consume the one probe producer
  (BO-1700a-1); no gate invents its own leniency, so the surfaces cannot drift.
  ADR-001 deployed/template parity applies.
delivers_to:
  agent: python-coder
  contract: "The fail-closed proceed condition — proceed iff (exit code == 0 AND failing_checks == []); every other outcome (uncaught exception, non-zero exit, timeout) is FAIL. Honored uniformly by all gates (BO-1700d family)."
expects_from:
  ac_id: BO-1700a-1
  contract: "The probe result and exit semantics this invariant constrains."
