test_spec:
  - name: test_bp_900g_10_i_absent_declaring_schema_produces_a_stop_and_exactly_zero_per_record_findings
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: criterion
    description: "Invoke the DEPLOYED AC-schema guardrail as a subprocess inside a consumer-layout install with config/ac_store_schema.json ABSENT, against a batch of REAL on-disk AC records taken verbatim from docs/acceptance-criteria/ - not hand-typed fixtures. Assert two things: it reports that the file defining its rule could not be read and names the location it looked for; and the number of per-record findings is EXACTLY ZERO. The zero-findings count is the load-bearing assertion. The live defect reports something too - it reports 920 findings - so a test that asserts only that an error was emitted, or that the exit code was non-zero, is green on the substitution path this AC exists to remove."
  - name: test_bp_900g_10_i_absent_unreadable_and_unparseable_declaring_files_all_take_the_same_stop_path
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: failure
    description: "All three failure modes the criterion names, through the same deployed entry point and against the same real records: declaring file absent; present but unreadable (permissions removed); present but unparseable (truncated to invalid JSON). Each must stop, name the file and the location, and emit zero per-record findings. Assert all three, not one: a fix scoped to 'the file is missing' leaves the unparseable branch substituting, and the unparseable branch is the one a partially-deployed or truncated install actually produces."
  - name: test_bp_900g_10_i_the_hook_runner_blocks_and_the_blocker_message_names_the_schema_rather_than_any_record
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: reachability
    description: "PRODUCTION ENTRY POINT with the must_block modifier. Run the guardrail through the REAL commit-guardian hook runner as a subprocess, in the consumer install, with the declaring schema absent and real AC files staged. Assert non-zero; assert the blocker message names the schema path it could not read; and assert the message does NOT contain the id of any staged record. The negative half is what distinguishes a correct stop from the misdirecting substitute: the harm this AC exists against is not that the guardrail complained, it is that the complaint pointed at 920 records that were never wrong. A message assertion without the does-not-name-a-record half cannot tell the two apart."
  - name: test_bp_900g_10_i_with_the_declaring_schema_present_the_deployed_guardrail_returns_the_verdict_that_file_defines
    target_dir: unit_tests/commit_guardian/
    framework: unittest
    type: integration
    angle: deployed
    description: "The paired positive control, and the second killer of the built-in substitute. Through the same deployed entry point with the schema present: a record the DECLARED schema rejects is rejected, and the report cites the rule from the declaring file; and a large batch of real on-disk records that the declared schema accepts is accepted with zero findings. The second half is the discriminator - if the compiled-in stricter pattern is still consulted anywhere, the real-record batch produces findings and this entry goes red. It is also the only entry that would catch the fix being satisfied by a guardrail that simply refuses to run."
test_rationale: |
  A substitute rule is not a neutral default and that is exactly why the parent AC's
  wording does not reach it. It is loud, specific and confident: it produces 920
  findings that appear to explain themselves. Every conventional shape of test for a
  fail-closed contract — assert an error was raised, assert a warning was logged,
  assert a non-zero exit — is green on the substitution path, because the substitution
  path does all three. The only assertion the defect cannot survive is a count: zero
  per-input findings. That count is therefore the spine of entries 1 and 2, and its
  mirror in entry 3 is the assertion that no record id appears in the blocker message.

  Entry 4 is the control that stops the fix in both directions. Without its
  real-records half, a guardrail that quietly kept its built-in schema as a secondary
  check would stay green; without its rejected-record half, a guardrail that simply
  refuses to run would stay green, and the criterion explicitly says the fix is not
  that. Feeding it real on-disk AC records rather than hand-built dicts matters for the
  same reason it mattered in EPIC-ComputedQualityGates FP-1 layer 2 — a fixture the
  test author typed reproduces the author's model of the format, and the 920 rejected
  identifiers were real identifiers in the real store's shape.

  Every entry runs the DEPLOYED guardrail as a subprocess rather than importing the
  check function. In the package's own repository the schema resolves, so the
  substitution branch is unreachable from a source-tree import and a direct-import test
  is structurally incapable of exercising it. That is the same construction blindness
  recorded for BP-811 and done_proof.py.

  Angles: criterion, failure, reachability, deployed — at the cap of four, with
  must_block riding entry 3.
