id: GE-132a-4
title: "The commit-time remedy checks judge the package's committed declaration table, so a stale or absent local copy can neither refuse a correct commit nor pass a defective one"
component: guardrail-engine
components:
  - commit_guardian
  - precommit_hooks
level: L2
status: active
req_status: draft
work_status: done
readiness: approved
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a package checkout whose local declaration table was written before
    GE-132a-2 and never refreshed, so its check-doc-frontmatter rule is
    mechanical-autofix with no agent and it still holds a rule for check-docstrings,
    which no registered check has,
  And the committed package declaration table declares check-doc-frontmatter as
    mechanical-autofix naming general-purpose, holds no check-docstrings rule, and
    passes every registration and validity rule of GE-132a-1 and GE-132a-2,
  When a change to the committed package declaration table is committed,
  Then the commit is not refused, and no refusal names check-doc-frontmatter,
    check-docstrings or the local table.

  Given the committed package declaration table declares check-doc-frontmatter as
    mechanical-autofix with no agent,
  And the local declaration table declares check-doc-frontmatter as
    mechanical-autofix naming general-purpose and is otherwise correct,
  When that change is committed,
  Then the commit is refused, naming check-doc-frontmatter as a declaration that names
    no agent, and naming the committed package declaration table as the file it came
    from.

  Given a project's local declaration table declares check-complexity as
    engage-specialist, naming restructuring-specialist and complexity-reduction, with
    the instruction "split plan_batches into two functions",
  And the package seed gives check-complexity a different instruction,
  When check-complexity refuses a commit that raises plan_batches from 30 to 31, and
    the specialist run reads check-complexity's declaration,
  Then the refusal shows "split plan_batches into two functions" and not the seed's
    instruction,
  And the specialist run receives the local declaration, reported as coming from the
    local table.

  Given a package checkout with no local declaration table at all,
  And a committed package declaration table that passes every rule of GE-132a-1 and
    GE-132a-2,
  When a change to the committed package declaration table is committed,
  Then the commit is not refused.
depends_on:
  - GE-132a
  - GE-132a-1
  - GE-132a-2
  - GE-132a-3
