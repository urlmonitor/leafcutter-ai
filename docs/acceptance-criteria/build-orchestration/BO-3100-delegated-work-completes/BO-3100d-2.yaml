notes: |
  The parent L1 asks for the correction to happen "in the open — the old decision is kept and
  marked as superseded, so anyone reading later can see both what was believed and what
  replaced it." The third scenario is that requirement stated from the reader's position,
  which is the only position that matters: a superseded record that is only discoverable from
  its successor is not discoverable at all, because a reader who has found the old one has by
  definition not found the new one.

  MECHANICALLY CHECKABLE WITHOUT READING PROSE. Whether a pointer resolves, and whether the
  pointer exists in both directions, are structural facts about the records. That is what
  makes this criterion enforceable where a requirement to "keep the documentation accurate"
  would not be.

  SCOPE HELD AS THE PO SET IT: which decisions are superseded, and what replaces them, is a
  judgement for the decision-record author and is deliberately not pre-committed here. This
  AC constrains only the shape of a supersession once one is made. ADR-006 and ADR-019 are
  the expected subjects — both were confirmed on 2026-08-25 to assert a hard depth-1 limit
  with deeper calls silently dropped — but naming them in the criteria would pre-commit the
  judgement the L1 reserves.

  IT-PO DECISION (2026-08-26) — THE HUMAN-REVIEW BOUNDARY, made explicit rather than implied.
  This AC has a falsifiable half and a non-falsifiable half. The falsifiable half is covered by
  the test_spec above and by BO-3100d-2-i. The non-falsifiable half — that the replacement
  reasons soundly — is discharged by a named human review recorded on the delivering ticket, is
  stated as an it_requirement, and is stated again in test_rationale so that nobody later reads
  the absence of a test as an oversight and closes it with a prose grep. That would be the worst
  available outcome: it would read as coverage while proving nothing, which is the failure shape
  this entire tree exists to remove.
