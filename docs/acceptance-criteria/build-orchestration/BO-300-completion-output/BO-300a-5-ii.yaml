id: BO-300a-5-ii
components:
  - build_orchestration
title: "The epic's machine-readable outcome never says success while the epic itself is reported not complete"
component: build-orchestration
level: L3
status: active
req_status: active
work_status: done
readiness: approved
priority: high
roadmap_phase: phase_1
criteria: |
  Given a drive producing its epic completion output,
    And in the first case the drive withholds the epic-complete claim because work
      added to the epic after planning was never built,
    And in the second case the drive could not confirm it re-read the epic's set of
      work at all,
    And in the third case the epic did complete and the re-read of its set was
      affirmatively confirmed,
  When the drive returns its completion output,
  Then in the first two cases the single overall outcome value the output leads with --
    the one a caller routes on without reading anything else -- is not a success value,
    and a caller reading only that value cannot take the epic for finished,
    And the reason is still named in the same output, so nothing is lost by the outcome
      value no longer reading as success,
    And in the third case that value is a success value,
    And in all three cases the overall outcome value, the epic's own complete-or-not
      verdict, and the sentence the output states about the epic all agree: none of the
      three reports completion while another denies it,
  So the drive cannot hand back an output that says succeeded and not complete at the
    same time, and no caller has to read the prose to learn which one is true.
depends_on:
