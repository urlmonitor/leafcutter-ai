notes: |
  Satisfies the reference-doc documentation trigger on GE-120e, and follows the shape the
  sibling L1s use — GE-120a-5, GE-120b-5, GE-120c-5 and GE-120d-5 each spend the fifth L2
  slot on the documentation the trigger asks for. That convention is why this L1's
  still-blocked negative is filed as GE-120e-3-ii rather than as a sixth L2: the child cap
  is five and every sibling is already at it.

  WHY THE LIMIT SITS IN THE SAME PARAGRAPH AS THE RULE. Written alone, "a check reports only
  the author's changes" reads as licence to exempt merges, which is the failure this L1
  would produce if it produced one. The rule and its limit have to arrive together or the
  next author will implement half of it.

  THE LAST CLAUSE was written without a confirmed target. A search of docs/how-to and
  docs/reference found no merge-time override recipe committed to a documentation surface
  today — the override guidance the observed session followed lives in operational notes
  outside this store. The clause is kept because the guidance is exactly what gets written
  down after the second time a merge is blocked, and a rule sitting beside a recipe for
  ignoring it is worse than either alone. If the documentation-expert finds nothing to
  correct, that clause is satisfied by confirming so, not by inventing a target.
