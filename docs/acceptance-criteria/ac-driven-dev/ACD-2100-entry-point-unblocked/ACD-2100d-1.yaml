notes: |
  THE MOTIVATING FACT, verified by the PO on 2026-08-25: the deployed workflow at
  leafcutter-ai/.leafcutter/workflows/plan-feature.js is STALE -- it carries no
  charter gate at all. The installed copy and the source copy are therefore
  observably different programs today, and nobody noticed because nothing compares
  their behaviour.

  THE LAST CLAUSE IS THE POINT OF THE RECORD. A test that diffs the two files, or
  checks a build manifest, passes on a deployed artifact that is byte-identical and
  still cannot run -- a missing dependency, a path that resolves differently in the
  deployed layout, a support file that was not copied. This repo has that failure
  twice over in CLAUDE.md ("New Hook / Gate Dependencies Must Be in the Build
  Deploy-Manifest" and the deployed-layout no-op trap), both of which were invisible
  to source-tree tests. Run the deployed artifact, in the deployed layout, in a
  fresh process.

  SAME STARTING DIRECTORY CONDITIONS matters because ACD-2100a's behaviours are
  directory-sensitive. Vary one thing: which copy is running.

  BOUNDARY WITH ITS SIBLINGS. This record does not restate what a, b or c require;
  it requires that the copy the user runs is the copy that does it. If a child here
  reads like "sibling behaviour X but in the deployed layout", it is duplicating
  coverage and splitting the evidence for one behaviour across two L1s.

  2026-08-25 (it-po): sized L because the deliverable is largely a harness that does not
  exist yet -- install into a temporary target, start a run there, and observe how far
  it got -- and that harness is what ACD-2100d-3 then reuses. SEQUENCING CAVEAT RAISED
  TO THE USER: this record's Then clause ("both runs reach the first question") cannot
  hold until ACD-2100a-3 and ACD-2100a-5 land, because the source copy halts at the
  charter gate today. depends_on carries only [ACD-2100d], and the build sequencer reads
  depends_on only (KI-ACD-015, open), so nothing stops this being scheduled first. The
  it-po does not own depends_on and has not edited it; the recommended edit is to add
  ACD-2100a-5 to this record's depends_on before the tree is approved.

  IT PO ENRICHMENT -- 2026-08-26 (files_touched backfill).

  WHY THIS RECORD PRODUCED AN EMPTY files_touched. The generated ticket's surface is
  derived by generate_ticket_from_ac.py as the union of two sources: path tokens found
  in it_requirements prose that exist on disk, and doc_links whose relationship is one
  of constrains / creates / implements / modifies / specifies. Every doc_link on this
  record was "describes", and no it_requirement named a path, so the union was empty.
  Every sibling that DID get a surface (a-1 through a-5, b-1 through b-5, c-1 through
  c-5) carries at least one "implements" doc_link. The enrichment below closes that at
  the cause, so a regeneration reproduces the same four paths.

  THE FOUR PATHS, AND WHY EACH ONE IS THERE.

  scripts/build_phases.py -- not speculative. Verified on 2026-08-26 in this worktree:
  the deployed route runs `cat .leafcutter/config/agent_registry.json` on its startup
  path, and a `find` over a freshly built .leafcutter tree returns no agent_registry.json
  at all. The gate that reads it fails closed on any unreadable or unparseable response,
  so the installed copy halts before the first user question for a reason that has
  nothing to do with the route's own logic. That is precisely the failure mode this
  record's deploy-manifest requirement names, it is live today, and the deploy
  declarations that fix it live in this file and nowhere else. Without this path the
  ticket has no surface on which its own Then clause can be made true.

  unit_tests/_installed_route_probe.py -- new. The AC's own it-po note sizes this record
  L because the harness does not exist. It must be importable from the portability test
  package (ACD-2100d-3 calls it twice) without living inside it, so it goes at the
  unit_tests root, which is where this repository already keeps its two shared
  cross-package harnesses. Named in doc_links with relationship "creates" because a file
  that does not exist yet is filtered out of prose extraction by the generator's
  on-disk-existence gate and can only enter the surface through a doc_link.

  unit_tests/_workflow_engine_harness.py -- existing, and a genuine edit surface rather
  than a dependency. It exposes run_workflow_under_e2(script_path, ...), the only thing
  in the repository that starts a workflow run in a fresh Node process against an
  arbitrary script path, which is what makes "run the installed copy" possible at all.
  But its _default_label_responses_for_script helper resolves the workspace-setup
  permission gate's default by walking up from the script's own directory looking for the
  package agent registry. That walk succeeds for the source copy and fails for a copy
  under a temporary target, so an unmodified harness supplies a permitted default to one
  run and nothing to the other. The deployed run would then halt at the charter gate and
  the test would report a parity failure that is entirely an artifact of the harness. A
  coder who did not read this helper would ship that false red and then "fix" it by
  weakening the assertion.

  unit_tests/portability/test_acd_2100d_1.py -- the four descriptors. target_dir on every
  descriptor is the portability package and the generator already names this exact path
  in the ticket's Test Requirements block; listing it makes the ticket's declared surface
  and its declared tests agree.

  PATHS CONSIDERED AND REJECTED.

  templates/workflows-js/plan-feature.js -- rejected. This record observes the route; it
  does not change it. Making the source copy reach the first question is ACD-2100a-3 and
  a-5's work, which is exactly what the sequencing caveat above is about. Including it
  would let an a-family edit pass this ticket's scope gate unchallenged.

  .leafcutter/workflows/plan-feature.js -- rejected. Untracked build output (`git ls-files
  .leafcutter/` is empty). It is this record's observation target, never an edit surface;
  editing it is the exact defect ACD-2100d-2 exists to catch, and the 2026-08-18 incident
  in ACD-2100d-2's notes is what happens when someone does.

  scripts/ci/check_consumer_install.py -- rejected here, taken by ACD-2100d-3. It installs
  into a temporary target but never starts a run, and d-3 is the record that owns wiring
  a standing gate. Splitting that surface across both records would give two tickets
  authority over one file for two different reasons.

  AUTHORING CONSTRAINT WORTH KNOWING FOR THE NEXT PASS. The generator extracts any
  slash-bearing token from it_requirements prose whose file exists on disk, including bare
  directories such as "templates/" or "unit_tests/". Illustrative path mentions therefore
  leak into files_touched. The prose above is written to name only the paths that belong
  in the surface; everything else is referred to descriptively on purpose.
