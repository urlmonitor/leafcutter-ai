id: GE-127d-4
title: "A change that makes a file's measured length fall while its total line count rises is refused, and the refusal names that situation"
component: guardrail-engine
components:
  - commit_guardian
level: L2
status: active
req_status: draft
work_status: todo
readiness: draft
priority: medium
roadmap_phase: phase_1
criteria: |
  Given a tracked covered file whose previous version measures 620 and holds 700
    lines in total,
  And a staged version that measures 610 and holds 712 lines in total,
  When the author performs an ordinary commit,
  Then the commit does not complete, and the outcome names the file and states
    that its measured length fell from 620 to 610 while its total line count rose
    from 700 to 712,
  And the outcome states that this combination is refused whatever the file's
    permitted length, and that a reduction in counted lines and an addition of
    uncounted lines (comments, docstrings) are accepted when made in separate
    commits,
  And this refusal is distinguishable in the outcome from a refusal for crossing
    the limit, for growth, or for an unpaid two-for-one repayment,
  And the same holds for a file whose previous and staged lengths are both below
    its permitted length,
  And given a staged version that measures 610 and holds 690 lines in total,
  When the author performs an ordinary commit,
  Then this refusal is not produced,
  And given a staged version that measures 620 and holds 712 lines in total,
    because the change only put comments into the file,
  When the author performs an ordinary commit,
  Then this refusal is not produced,
  And given a newly added file, which has no previous version,
  When the author performs an ordinary commit,
  Then this refusal is not produced.
depends_on:
  - GE-127d
  - GE-127d-3
