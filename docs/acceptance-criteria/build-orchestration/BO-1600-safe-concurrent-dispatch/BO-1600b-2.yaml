estimated_complexity: M
it_requirements:
  - "Cleanup must leave the worktree index in a consistent, readable state (a fresh status/read succeeds with no index-corruption error)."
  - "Any stale index lock left by the interrupted supervisor must be removed so a later commit can acquire the index — but a lock currently held by a still-live commit must not be removed (distinguish stale from live)."
  - "The git-write serialization guard from BO-1600a-1 held by the interrupted supervisor must be released by cleanup so a waiting supervisor is not blocked indefinitely; this closes the deadlock risk the guard would otherwise introduce."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3) when removing lock files / releasing the guard: name the exception type, log at WARNING or higher, never swallow silently."
