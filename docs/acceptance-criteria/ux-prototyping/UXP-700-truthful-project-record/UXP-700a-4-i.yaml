test_required: true
test_rationale: |
  A guard that never refuses anything passes every test that only feeds it good input. This
  record is the negative control for UXP-700a-4: it is the only test in the family that proves
  the check can fail, and the isolation clause is what stops the fix being "make the whole
  build fail loudly", which would be indistinguishable from a broken build.
test_spec:
  - name: test_removing_one_required_file_fails_the_build_naming_it
    target_dir: unit_tests/build_guards/
    description: "With one start-up input removed from the install, the build fails and the message names that file."
    type: integration
    angle: failure
    framework: unittest
  - name: test_removing_one_required_file_leaves_other_build_checks_green
    target_dir: unit_tests/build_guards/
    description: "The verdicts of the build's other checks are unchanged by the removal."
    type: integration
    angle: boundary
    framework: unittest
notes: |
  Named mutation: delete one entry from what the deploy phase writes. Only this record and
  UXP-700a-4 turn red. If any sibling also reddens, the mutation was too coarse and the
  isolation clause has not been implemented.
