  - "Must validate the generated file against the persona schema before writing"
  - "Must return a non-zero exit code if writing fails (directory exists, permission error, schema violation)"
  - "Must be idempotent — if the directory already exists, reject with an informative error"
  - "Must accept persona data as a JSON string via --data argument"
