    state: existing
it_requirements:
  - >-
    Applies to label, artifact and produced-tests runs: every row loop (run_agent_eval.py label and artifact
    loops, produced_tests_mode.py) stops at the first launch failure, scores no further row and prints
    one message naming the launch failure and its operating-system reason. A timeout, a non-zero exit
    after start or an unreadable reply still counts as a failed row and the run continues, as before.
  - >-
    Exit-status decision (IT PO, 2026-10-30): a harness-failure run exits with status 3. The existing
    values keep their meaning: 0 passed, 1 below threshold, 2 usage or configuration error.
  - >-
    Results-file decision: a harness-failure run writes a results file with a top-level 'harness_failure'
    object {cause: 'agent_launch_failed', row: <row id>, detail: <launch-failure text>} and the existing
    agent, run_context and timestamp keys, and it carries no accuracy, pass-rate, per-assertion or score
    key at all (absent, not 0 or null).
  - >-
    A harness-failure results file is never accepted as a fresh eval receipt: eval_selector.py --check
    and anything else that reads results files for freshness treat it as no result. If eval_selector.py
    must change it must not grow (it is over 400 lines).
  - >-
    Code that the stop logic needs goes in scripts/evals/agent_launch/ or produced_tests_mode.py; run_agent_eval.py
    must not grow; every changed file stays at or under 400 counted lines.
  - >-
    Unit tests never call a live model; they use a fake claude program on PATH (or a patched process start)
    that records its argv, its stdin and any prompt file it is given. Tests cover label, artifact and
    produced-tests runs.
  - >-
    DOCUMENTATION (part of done) - scripts/evals/README.md rewrites the 'invocation failures stay in the
    accuracy denominator' sentence and must state: a failure to start the agent CLI stops the run as a
    harness failure, exit status 3, results file marked 'harness_failure' with no accuracy figure; failures
    after start (timeout, non-zero exit, unreadable reply) stay in the denominator. It also lists the
    four exit statuses.
  - >-
    DOCUMENTATION (part of done) - docs/how-to/run-a-live-agent-eval.md 'A run that stops as a harness
    failure' must state what the run prints, its exit status 3, that the results file carries no score,
    and to fix the launch before re-running (link 'Reading a launch failure').
  - >-
    DOC-DRIFT TEST: the exit status the README and the how-to name is the status a launch-failure run
    returns, and the results-file marker the README names is the key written.
  - >-
    KNOWN ISSUES: in docs/known-issues/testing-quality/open-high-ki-tq-20260908-0900.md add to the Status
    line 'launch-failure-as-score case fixed by TQ-200d-5-iii'; the entry stays open while its pre-commit-gate
    case remains. If the WinError 2 and 206 entries are already resolved, append 'fail fast: TQ-200d-5-iii'
    to their resolved Status lines.
  - >-
    CHANGELOG: one entry for TQ-200d-5-iii written with scripts/changelog/emit_entry.py (type manual,
    components [testing_quality]) into changelogs/, naming the harness-failure stop, exit status 3 and
    the README/how-to changes. The entry is written in the same change as the code.
  - >-
    GLOSSARY: new terms used in the docs this AC writes ('harness failure') reach docs/glossary.md only
    through the check-glossary-coverage hook and the glossary-triage flow. No entry is added by hand (CLAUDE.md).
test_spec:
  - name: test_first_launch_failure_stops_the_run
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      For a label, an artifact and a produced-tests run of 8 rows whose launch fails, exactly one launch
      is attempted, no row is scored, and one printed message names the launch failure and its operating-system
      reason.
    must_catch:
      - run keeps scoring rows after a launch failure
      - stop message drops the operating-system reason
      - produced-tests row loop not stopped
    in_scope_files:
      - scripts/evals/run_agent_eval.py
      - scripts/evals/produced_tests_mode.py
      - scripts/evals/agent_launch/command.py
  - name: test_harness_failure_exit_status_differs_from_below_threshold
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: unit
    angle: discrimination
    description: main() returns 3 for a launch-failure run and 1 for a run that scored below its threshold.
    must_catch:
      - harness failure returns the below-threshold status 1
      - harness failure returns 0
    in_scope_files:
      - scripts/evals/run_agent_eval.py
  - name: test_harness_failure_results_file_carries_no_score
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: unit
    angle: discrimination
    description: >-
      The results file of a launch-failure run has a harness_failure object with cause, row and detail,
      and no accuracy, pass-rate, per-assertion or score key.
    must_catch:
      - accuracy 0.0 written for a harness failure
      - pass-rate written for a harness failure
      - harness_failure marker missing from the results file
    in_scope_files:
      - scripts/evals/run_agent_eval.py
      - scripts/evals/produced_tests_mode.py
  - name: test_failure_after_start_still_scores_every_row
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: unit
    angle: boundary
    description: >-
      A run where one row times out, one exits non-zero after start and one replies unreadably scores
      all rows, counts those three as failed, and exits 0 or 1 by its threshold.
    must_catch:
      - timeout treated as a launch failure and stops the run
      - non-zero exit after start treated as a harness failure
    in_scope_files:
      - scripts/evals/run_agent_eval.py
      - scripts/evals/produced_tests_mode.py
      - scripts/evals/agent_launch/command.py
  - name: test_harness_failure_file_is_not_a_fresh_receipt
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: unit
    angle: failure
    description: >-
      eval_selector --check, given a harness-failure results file as the latest result for an affected
      agent, reports the agent as not freshly evaluated.
    must_catch:
      - harness-failure results file accepted as a fresh eval receipt
    in_scope_files:
      - scripts/evals/eval_selector.py
  - name: test_cli_run_with_no_claude_exits_as_harness_failure
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: integration
    angle: reachability
    surface_invoked: python scripts/evals/run_agent_eval.py --agent pt-classifier --results-file <tmp>
    description: >-
      The real CLI with a PATH holding no claude (and LEAFCUTTER_EVAL_USE_API unset) exits 3 after one
      launch attempt and writes a harness_failure results file.
  - name: test_docs_name_the_harness_failure_exit_status_and_marker
    target_dir: unit_tests/evals/tq200d5/
    framework: pytest
    type: unit
    angle: real_artifact
    description: >-
      The exit status and the results-file marker named in scripts/evals/README.md and the how-to equal
      the values the code uses, and the README no longer says invocation failures stay in the denominator
      without the launch exception.
test_rationale: >-
  The defect is a launch failure read as a 0% score, so the tests pin the three things that would let
  it read as a score again: a continued loop, a shared exit status, and a score key in the file. The boundary
  test protects the opposite direction, post-start failures that must still score. The receipt test closes
  the path by which a harness-failure file could satisfy the freshness check.
