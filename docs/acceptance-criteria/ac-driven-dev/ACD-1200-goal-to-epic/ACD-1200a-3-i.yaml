criteria: |
  Given the AC store contains goal ACD-060 (level: L0) with covered_by: [ACD-060a]
  And ACD-060a (level: L1) has covered_by: [] and no L2/L3 children exist beneath it,
  When /build-ac is invoked with --ac ACD-060,
  And the tree traversal finds zero leaf-level ACs (L1 is composite, not a leaf),
  Then the system outputs an error:
    "No leaf-level ACs found beneath ACD-060. Decompose the L1s into L2/L3 ACs first."
  And no epic folder is created
  And no ticket files are generated.
