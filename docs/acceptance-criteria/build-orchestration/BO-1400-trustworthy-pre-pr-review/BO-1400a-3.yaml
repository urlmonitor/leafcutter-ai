criteria: |
  Given the pre-PR self-review performs real-data verification of bulk/quantitative AC
    claims (BO-1400a-1) and deployable-artifact placement verification (BO-1400a-2)
  When the documentation for this feature is authored
  Then a sequence diagram exists that shows the interaction across the review run:
    the reviewer detecting a bulk/quantitative data claim, invoking the real-store
    validation over all records, and receiving the observed pass/fail counts; the
    reviewer detecting a delivered artifact and checking it against the deployable
    package source; and the decision points where each check yields a clean verdict,
    a blocking finding, or (for the data claim) an inconclusive result
  And the diagram identifies the participants (the pre-PR reviewer, the real data store /
    validation step, and the deployable-source / fresh-install reachability check)
  And the diagram shows the INCONCLUSIVE branch when the validation means is unavailable
    (BO-1400a-1-i) and the no-flag branch for a build-output-only artifact (BO-1400a-2-i)
