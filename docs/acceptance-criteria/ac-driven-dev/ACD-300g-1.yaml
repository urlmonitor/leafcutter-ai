id: ACD-300g-1
components:
  - ac_driven_dev
readiness: approved
priority: medium
title: "Approved stage output is committed before the next agent is dispatched"
component: ac-driven-dev
level: L2
status: active
req_status: active
work_status: todo
criteria: |
  Given the /plan-feature workflow has completed a stage (product owner, business
    analyst, or technical planner) and the authoring agent has written AC YAML files
    to the AC store,
  And the stage's output has been approved — by the user at the confirmation gate,
    or automatically for the technical planner's stage once its requirement rule
    check passes,
  When the workflow prepares to dispatch the next agent,
  Then a git commit containing all AC files from the approved stage is created
    before the next agent begins,
  And the commit is confirmed to have succeeded (exit code 0) before dispatch,
  And the committed files are present in the repository history.

  Given the /plan-feature workflow follows the strategic route
    (product owner -> gate -> business analyst -> gate -> technical planner
    (auto-gated) -> test designer -> final gate),
  When the user approves gate 1 (after the product owner),
  Then the L0 and L1 AC YAML files produced by the product owner are committed,
  And the business analyst is not dispatched until the commit succeeds.

  Given the user approves gate 2 (after the business analyst),
  When the workflow transitions to the technical planner,
  Then the L2 and L3 AC YAML files produced by the business analyst are committed,
  And the parent AC updates (covered_by additions) are included in the same commit,
  And the technical planner is not dispatched until the commit succeeds.

  Given the technical planner's stage has passed its requirement rule check,
  When the workflow transitions to the test-design stage,
  Then the AC YAML files enriched by the technical planner are committed,
  And the design pre-pass and the test designer are not run until the commit succeeds.

  Given the user approves the final gate (after the test-design stage),
  When the workflow completes,
  Then the AC YAML files carrying the test design and the approval are committed,
  And the workflow reports success only after the final commit succeeds.
depends_on: [ACD-300g]
