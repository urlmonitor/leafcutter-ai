it_requirements:
  - "Spot-check findings must be appended to the epic retrospective (the same artifact produced by the retrospective-agent) before the merge step completes."
  - "Each defect-classified finding must be turned into a remediation ticket; the close step must verify that no defect finding is left without a ticket."
  - "If a defect finding has no remediation ticket, finalization must block the close and surface which finding is unaddressed."
