it_requirements:
  - "The flag condition is 'an actually-changed SOURCE file (.py/.sql/.ts/.tsx/.js) absent from files_touched UNION out_of_scope'. A ticket whose real diff contains no such undeclared source file (docs-only, config-only, or fully-declared) must pass cleanly — narrow scope is not itself a violation."
  - "Do NOT infer 'this ticket should have touched source' from the AC text here (that inference is BP-1100a's pre-dispatch concern); BP-1100e only reconciles actual-vs-declared, so a docs-only ticket that only changed docs is not a BP-1100e mismatch."
  - "PORTABLE SURFACE: this narrow-scope non-false-positive guard lives in the same hook (templates/scripts/commit_guardian/hooks/check_files_touched_reconciliation.py) pinned in BP-1100e-1; ADR-001 build.py round-trip parity applies."
  - "Must handle errors gracefully per the project error handling policy (CLAUDE.md Rules 1-3)."
