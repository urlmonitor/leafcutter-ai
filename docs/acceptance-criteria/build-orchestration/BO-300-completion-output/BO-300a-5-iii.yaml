assigned_agent: python-coder
estimated_complexity: M
it_requirements:
  config_schema_fragment: null
  reference_file_path: templates/workflows-js/build-feature.js
  n_location_rule: "1 -- build-feature.js ONLY (epicRecheckReport and both epic completion returns); build-ticket.js drives a single ticket and has no epic path"
  required_skills:
    - python-coder
  post_write_commands:
    - "python -m unittest discover -s unit_tests/prompt_assembly -p test_epic_removed_work_verdict.py"
  constraints:
    - "A REMOVAL AND A COMPLETION ARE INDEPENDENT FACTS, AND THE PAYLOAD ALREADY KNOWS BOTH. The live defect is that every missing piece is treated as unbuilt, when the drive's own completed record often proves the opposite. Partition the missing set by that record before saying anything about it. An implementation that keeps one undifferentiated missing list and only softens the wording has not fixed this: the completion claim still turns on the wrong fact."
    - "DO NOT WITHHOLD UNCONDITIONALLY. The cheapest way to remove the contradiction is to withhold the completion claim whenever anything is missing. That makes every ordinary lifecycle move -- a ticket file relocated to its done folder by the drive that finished it -- report the epic as unfinished, which is a worse and far more frequent regression than the one being fixed. The removed-and-completed case must still report success, and the control case must stay green."
    - "DO NOT SUPPRESS THE MISSING LIST EITHER. Reporting nothing about a piece that disappeared satisfies the no-contradiction invariant and destroys the information BO-300a-5-i was authored to add. The piece is still named as no longer present in every case; what changes is whether it is described as unbuilt and whether it blocks the claim."
    - "BOTH RETURNS, NOT JUST THE LAST ONE. The epic path has two completion returns and the re-check report feeds both. The early no-batches return is the one where the completed record is emptiest, so a partition written only against the final return's data shape is most likely to misclassify exactly there."
    - "THE CONTRADICTION MUST BE DETECTABLE, NOT MERELY ABSENT. The suite's epic-outcome disagreement check recognises only 'not complete' and 'incomplete', so the phrase this branch actually emits slips past it and a green suite over this defect already exists. The coverage must extend to the wording the driver emits for removals, so that any future output pairing a success verdict with a not-built statement is caught by the check rather than by a reviewer. Assert that the check FAILS on a contradictory payload, not only that it passes on a corrected one -- a check that never fires proves nothing."
    - "VERIFY BY EXECUTION, NOT BY GREP. Per CLAUDE.md 'Gate / Workflow ACs -- Verify Behaviorally, Not by Grep', the partition happens before a merge that assembles the payload, and reading the source cannot tell which classification survives that merge. Drive the real build-feature.js through unit_tests/prompt_assembly/harness_build_ticket_guard.mjs and assert on the payload the run returned."
