notes: |
  NOT PADDING — this is a measured condition, not a hypothetical. Of the 11 unnumbered artifacts
  in the diagrams location (BA re-measurement, 2026-08-17), FOUR carry a level prefix with no
  sequence number (two c2-, two c3-) and ONE uses an entirely different scheme (df-001-). A
  naive enrolment check that asks "does the name start with a level letter" would accept five of
  the eleven as enrolled, so the guard would report a smaller problem than exists and would let
  a sixth such name through unchallenged in future.

  This condition is also the most likely one to be reintroduced, because a half-enrolled name
  LOOKS conventional to a reviewer. It is kept as its own record so the classification rule
  survives any later rewrite of GE-120b-1.

  These four artifacts are NOT retro-numbered — see GE-120b-2 and the binding scope decision in
  GE-120e's notes. This criterion governs how they are CLASSIFIED, not whether they are changed.

  IT PO CONFIRMATION (2026-08-17): the BA's measurement is correct against the current tree —
  docs/architecture/diagrams/ holds 12 numbered artifacts (c1-001, c2-001..006, c3-001..005) and
  11 unnumbered ones, of which four carry a level prefix without a sequence and one uses the
  df-001- scheme. All four names quoted in the criteria exist on disk and are usable directly as
  test input.
