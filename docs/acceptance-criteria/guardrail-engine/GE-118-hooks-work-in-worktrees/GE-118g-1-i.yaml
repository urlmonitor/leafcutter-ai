assigned_agent: python-coder
estimated_complexity: S
it_requirements:
  - "Where the invoking directory IS inside a work tree, that tree's own top level is
    the anchor — resolved by a git read performed against the invoking directory, never
    by an ancestor walk from the program's own file location and never by resolving the
    shared administrative directory's parent."
  - "A linked worktree's administrative git data lives outside the worktree directory;
    the resolution must therefore not assume .git is a directory inside the tree it is
    resolving. The existing shared resolver's fallback ancestor walk tests
    (ancestor / '.git').exists(), which a linked worktree's .git FILE satisfies by
    accident rather than by design — do not rely on that coincidence."
  - "The anchor actually used must be reported, so a verdict reached from the wrong one
    of several candidate trees is attributable rather than invisible."
  - "Must introduce no second resolution route. This record constrains which tree the
    single route lands on; a separate worktree-specific branch would be a second route
    and would reintroduce the drift this subtree exists to remove."
  - "Record in the implementation's decision history which anchor was chosen and why,
    because GE-118c deliberately chose the OPPOSITE anchor for a package-bundled file
    and the next reader needs both reasons side by side."
test_spec:
  - name: test_two_linked_worktrees_are_judged_separately
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: discrimination
    surface_invoked: templates/scripts/commit_guardian/check_adr_collision.py
    description: >-
      Arm 1, both halves in one test because the discrimination IS the pairing. Create a
      real clone and two real linked worktrees A and B via git worktree add. Stage an
      unclaimed-number ADR in A only and an already-claimed-number ADR in B only. Run
      the pre-flight with cwd=A and assert exit 0 with no collision reported; run it with
      cwd=B and assert non-zero with B's collision named. Neither run may attribute the
      other tree's staged content. No build.py spawn and no layout fixture, so no marker.
    must_catch:
      - "resolve the repository by walking ancestors from the program's own file location"
      - "resolve to the shared administrative directory's parent, so both worktrees are reported against the clone"
  - name: test_linked_worktree_with_external_git_data_reads_its_own_index
    target_dir: unit_tests/commit_guardian/
    framework: pytest
    type: integration
    angle: boundary
    description: >-
      Arm 2. A linked worktree whose .git is a FILE pointing at administrative data under
      the clone's .git/worktrees/. Stage a colliding ADR in that worktree, run with it as
      the working directory, and assert the tree reported about is the worktree itself —
      specifically that the committed set it compared against is the worktree's checked-out
      branch and not the clone's. No marker.
    must_catch:
      - "treat the resolved administrative directory's parent as the tree under examination"
      - "assume .git is a directory inside the tree being resolved"
test_rationale: >-
  Both entries require REAL linked worktrees made with git worktree add and real staged
  content in each, because that is the only configuration in which two candidate trees
  exist at once — and this record is the only place in the subtree where they do. A test
  that asserts a resolved path string, or that compares a resolver's return value against
  an expected directory, cannot tell the two arms apart: it passes on a resolver that
  returns the right path for the single-tree case and the wrong one of two. The first
  entry is deliberately ONE test spanning both halves of arm 1 rather than two tests, so
  that a run which passes A and fails B cannot be reported as half-green — the assertion
  is that the two trees are judged separately, which is not expressible as two independent
  tests. Neither entry requests shared_reference_layout; the deployed-layout import chain
  is proved once, by GE-118g-1's own deployed entry, and duplicating it here would pay a
  second cost for nothing. Both are therefore outside the marker-routing mechanism and
  carry no marker. Pinned for the test author: the mutation in the record's notes reddens
  these two entries and leaves every GE-118g-1 arm green, so a run in which GE-118g-1 is
  green and these are red is the expected signature of that mutation, not a harness fault.
